id: P92172
gene_symbol: daf-7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'DAF-7 is a TGF-beta superfamily ligand of Caenorhabditis elegans. It is made as a prepro-protein
  with a C-terminal cysteine-knot ligand domain and is secreted mainly by the ASI chemosensory neurons,
  and in ASJ neurons in response to pathogenic Pseudomonas metabolites and in adult males. Transcription
  of daf-7 reports environmental quality: food, cGMP (DAF-11) and CREB (CRH-1) signalling promote it,
  and dauer pheromone (ascarosides) and high temperature repress it. Secreted DAF-7 activates the DAF-1
  (type I) / DAF-4 (type II) serine/threonine kinase receptors on target cells, mainly neurons, which
  signal through the R-Smads DAF-8/DAF-14 to antagonise the Co-Smad DAF-3 and the Sno/Ski protein DAF-5.
  Its principal role is to inhibit entry into the dauer diapause and promote reproductive development
  when conditions are favourable; loss-of-function alleles are temperature-sensitive dauer-constitutive.
  The same neuroendocrine signal also tunes adult physiology and behaviour, including lifespan (via insulin/DAF-16),
  feeding rate and fat storage, foraging and exploration, pathogen avoidance, male mate searching, germline
  stem-cell niche signalling and chemoreceptor gene expression.'
