  review:
    summary: 'IMP: in daf-7 mutants, DAF-3 represses the myo-2 C subelement enhancer in pharyngeal muscle.'
    action: MARK_AS_OVER_ANNOTATED
    reason: DAF-7 is an extracellular ligand. The transcriptional effect is mediated by the Co-Smad DAF-3,
      whose repressor activity is inhibited by TGF-beta-like signalling. Annotating the ligand to positive
      regulation of RNA polymerase II transcription makes an indirect, multi-step pathway output look
      like a transcriptional role. The broader 'regulation of gene expression' rows are kept as non-core
      instead.
