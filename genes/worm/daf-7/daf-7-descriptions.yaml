gene_symbol: daf-7
organism: worm
uniprot_id: P92172
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Under harsh environmental conditions, larvae enter a developmentally arrested
    state known as dauer; TGF-beta-like daf-7 acts to inhibit dauer larva formation
    and promote growth (PubMed:37060828, PubMed:8910282). May be a ligand to cell
    surface receptor daf-4 (PubMed:8413626). May act as a negative regulator of dauer
    larva development by transducing chemosensory information from ASI neurons (PubMed:8910282).
    Involved in sensitivity to CO2 levels (PubMed:18524955). Involved in mate searching
    behavior of males, acting in concert with the neuropeptide pdf-1 (PubMed:30024377).
    In AWC neurons, acts to promote expression of srsx-3, a member of the GPCR family
    (PubMed:20713521).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P92172
  source_id: P92172
- source: Alliance_Imported
  text: daf-7 encodes a member of the transforming growth factor beta superfamily;
    in C. elegans, DAF-7 functions as part of a signaling pathway that interprets
    environmental conditions to regulate energy-balance pathways that affect dauer
    larval formation, adult lifespan, fat metabolism, egg laying, pathogen avoidance
    behavior, and feeding behavior; daf-7 reporter gene fusions are expressed in the
    ASI, ADE, and OLQ neurons, and daf-7 expression is induced in both ASI and ASJ
    chemosensory neurons in response to the pathogenic bacterial strain Pseudomonas
    aeruginosa PA14.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000903;class=Gene
  source_id: WB:WBGene00000903
- source: Alliance_Automated
  text: Predicted to enable cytokine activity and transforming growth factor beta
    receptor binding activity. Involved in several processes, including cellular response
    to cGMP; regulation of gene expression; and response to bacterium. Located in
    extracellular region. Is expressed in coelomocyte; neurons; pharynx; and in male.
    Human ortholog(s) of this gene implicated in myostatin-related muscle hypertrophy
    and vertebral hypersegmentation and orofacial anomalies. Orthologous to several
    human genes including GDF11 (growth differentiation factor 11).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000903;class=Gene
  source_id: WB:WBGene00000903
