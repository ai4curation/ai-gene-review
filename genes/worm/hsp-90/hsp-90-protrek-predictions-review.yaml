  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 15.41), absent from GOA, which stops at the generic protein-containing complex
      (IBA/IDA/IPI) and, by IEA, protein folding chaperone complex. The HSP90-CDC37 complex is the
      kinase-specific chaperone module, and CDC-37 is named in the gene review as one of HSP-90's
      co-chaperones. Correct and a genuine refinement; it is also a child of the rank-3 term, so the
      model returns the specific complex above the general one - the right ordering, and the opposite
      of what it did for drp-1.
    supported_by:
