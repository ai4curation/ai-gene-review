id: Q18688
gene_symbol: hsp-90
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm hsp-90 (DAF-21), the sole cytosolic HSP90. The pattern
  is unusual and instructive: the chaperone activity that both GOA and the gene review put first -
  ATP-dependent protein folding chaperone - does not appear anywhere in the top five. What comes back
  instead are two co-chaperone interaction terms, TPR domain binding and the HSP90-CDC37 complex,
  both correct, both absent from GOA, and both naming partners the review identifies by name (STI-1/Hop
  and PPH-5 bind the C-terminal MEEVD through TPR domains; CDC-37 is listed among the co-chaperones).
  The model has learned HSP90 by its interaction network rather than by its enzymology. Ranks 4 and
  5 then fall off a cliff into Drosophila flight behaviour, so the useful output is the top three.
  Scores decline steeply from 16.92 to 14.56 and the Function channel returns the canonical HSP90
  comment at 19.30. Assessment: 2 correct novel, 1 correct-not-novel. Assessment: 2 correct novel
  (COR), 1 correct not novel (CNN).
