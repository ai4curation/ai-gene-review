    summary: >-
      Top-ranked hit (score 16.92), absent from GOA, which holds only generic protein binding (IPI)
      and protein phosphatase 5 binding (IPI) for this interaction class. HSP90's C-terminal MEEVD
      motif is the docking site for TPR-domain co-chaperones, and the gene's own review names STI-1/Hop
      and PPH-5 among its partners - PPH-5 being a TPR protein. A specific, mechanistically apt refinement
      of what is currently annotated.
