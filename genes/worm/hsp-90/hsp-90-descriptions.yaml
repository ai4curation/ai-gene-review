- source: Alliance_Automated
  text: Enables several functions, including ATP hydrolysis activity; protein phosphatase
    5 binding activity; and protein phosphatase activator activity. Involved in several
    processes, including determination of adult lifespan; protein export from nucleus;
    and protein stabilization. Located in perinuclear region of cytoplasm. Part of
    HSP90-CDC37 chaperone complex. Is expressed in several structures, including excretory
    system; germ line; head; intestine; and pharynx. Used to study cardiovascular
    system disease. Human ortholog(s) of this gene implicated in infertility and multiple
    sclerosis. Orthologous to several human genes including HSP90AB1 (heat shock protein
    90 alpha family class B member 1).
