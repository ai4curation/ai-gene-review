- source: Alliance_Imported
  text: daf-21 encodes a member of the Hsp90 family of molecular chaperones; DAF-21
    activity is required for larval development, negative regulation of dauer larva
    formation, and a number of specific chemosensory behaviors, such as the response
    to chemicals and odorants detected by the ASE and AWC sensory neurons; a daf-21
    sensory defect can be rescued by a cyclic GMP analogue, suggesting that, in regulating
    chemosensory behaviors, DAF-21 acts at a similar point as the DAF-11 guanylyl
    cyclase; down-regulation of daf-21 via RNAi results in a small but reproducible
    reduction in age-1 life span, suggesting that daf-21 is part of a chaperone network
    required for the extended life span seen in age-1 mutant animals.
