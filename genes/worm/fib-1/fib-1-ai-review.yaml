core_functions:
- description: Catalytic subunit of nucleolar box C/D snoRNPs that 2'-O-methylates ribose residues of
    pre-rRNA at sites selected by guide snoRNAs (conserved fibrillarin activity, inferred by homology;
    no worm enzymology).
  molecular_function:
    id: GO:0008649
    label: rRNA methyltransferase activity
  directly_involved_in:
  - id: GO:0031167
    label: rRNA methylation
  locations:
  - id: GO:0005730
    label: nucleolus
  - id: GO:0001650
    label: fibrillar center
  in_complex:
    id: GO:0031428
    label: box C/D methylation guide snoRNP complex
  supported_by:
  - reference_id: file:worm/fib-1/fib-1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Utilizes the methyl donor S-adenosyl-L-methionine to catalyze the site-specific 2'-hydroxyl
      methylation of ribose moieties in pre-ribosomal RNA
  - reference_id: PMID:23705068
    supporting_text: In wild-type animals, FIB-1 is highly expressed and localized in the nucleolus, where
      it methylates pre-rRNAs during ribosome maturation
  - reference_id: PMID:30190478
    supporting_text: C. elegans fib-1 encodes the highly conserved nucleolar methyltransferase fibrillarin,
      which is a vital factor in the C/D small nucleolar ribonucleoprotein (snoRNP) complex.
  - reference_id: PMID:36329008
    supporting_text: C. elegans nucleoli contain 2 phase-separated compartments, with NUCL-1 and LPD-6
      in the GC and FIB-1 and GARR-1 in the FC.
- description: As a component of the U3 snoRNP within the small-subunit processome, required for early
    pre-rRNA processing and maintenance of the rRNA pool; loss of FIB-1 lowers 18S/26S rRNA, nucleolar
    size and protein synthesis capacity.
  directly_involved_in:
