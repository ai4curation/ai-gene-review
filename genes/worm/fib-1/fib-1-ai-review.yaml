    record_section: ["CC:SUBUNIT"]
    supporting_text: Component of box C/D small nucleolar ribonucleoprotein (snoRNP) particles. It is
      associated with the U3, U8 and U13 small nuclear RNAs.
  - reference_id: PMID:26492166
    supporting_text: Conversely, knockdown of FIB-1 led to an overall reduction in the rRNA levels, further
