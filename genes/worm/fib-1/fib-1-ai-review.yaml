gene_symbol: fib-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'FIB-1 is the C. elegans fibrillarin, a nucleolar S-adenosyl-L-methionine-dependent methyltransferase
  with an N-terminal glycine/arginine-rich (RG/RGG) domain and a conserved C-terminal fibrillarin methyltransferase
  domain. By homology it is the catalytic subunit of box C/D small nucleolar ribonucleoproteins, which
  use guide snoRNAs to direct site-specific 2''-O-ribose methylation of pre-rRNA, and, as part of the
  U3 snoRNP/small-subunit processome, it is required for early pre-rRNA processing; fibrillarins also
  methylate histone H2A Gln104/105 at rDNA. In worms FIB-1 localizes to the fibrillarin-containing inner
  compartment of nucleoli in germline and somatic cells, and to nucleoplasmic foci in early embryos before
  nucleoli form. fib-1 is essential: mutants arrest as larvae with small nucleoli, and knockdown reduces
  rRNA levels and protein synthesis. Its abundance is controlled by a let-7/NCL-1/PUF-NOS translational
  cascade and by nutrient/TORC1 signalling, and reduced FIB-1 is associated with small nucleoli, extended
  lifespan and pathogen resistance.'
