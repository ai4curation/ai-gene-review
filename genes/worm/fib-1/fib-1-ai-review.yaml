- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: IMP
  original_reference_id: PMID:18804378
  qualifier: involved_in
  review:
    summary: fib-1(RNAi) adults show ~20% reduced 35S-methionine incorporation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Reduced bulk protein synthesis after loss of a ribosome biogenesis factor is an indirect consequence
      of fewer or less mature ribosomes; FIB-1 does not regulate translation as such. The authors themselves
      frame it as box C/D snoRNP function in ribosome biogenesis. The phenotype is real but the regulatory
      process term overstates FIB-1's role.
    supported_by:
    - reference_id: PMID:18804378
      supporting_text: We observed a 20% decrease in 35S incorporation when we inactivated pha-4, genes
        required for the Box C/D snoRNP (ruvb-1 or fib-1), or ife-2 for translation initiation
    - reference_id: PMID:30190478
      supporting_text: Since FIB-1 is a methytransferase involved in rRNA maturation and ribosome biogenesis,
        we hypothesized that fib-1 RNAi might lead to a reduction in ribosome biogenesis and thereby translation,
        thus activating the defense response.
