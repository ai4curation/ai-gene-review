    label: box C/D sno(s)RNA 3'-end processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000036740
  - SGD:S000002172
  review:
    summary: IBA from the fibrillarin node (PTN000036740) seeded by yeast Nop1, for box C/D snoRNA 3'-end
      processing.
    action: KEEP_AS_NON_CORE
    reason: Box C/D core proteins, including fibrillarin/Nop1, are required for stable accumulation and
      3'-end maturation of box C/D snoRNAs in yeast; this is a consequence of snoRNP assembly rather than
      the catalytic role of fibrillarin. FIB-1 is a predicted box C/D snoRNP component in worms and descends
      within the conserved fibrillarin clade with no sign of divergence, so the inheritance is sound,
      but the process is peripheral to the methyltransferase function and has not been examined in C.
      elegans.
    supported_by:
