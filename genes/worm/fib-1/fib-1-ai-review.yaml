suggested_questions:
- question: Does C. elegans FIB-1 methylate histone H2A at the glutamine equivalent to yeast/human H2AQ105
    at the rDNA locus, given that the IBA asserts this activity for the whole fibrillarin clade?
- question: Does C. elegans have Cajal bodies containing FIB-1, or are the nucleoplasmic FIB-1 foci of
    early embryos purely prenucleolar bodies? This decides the Cajal body IBA.
- question: Does the worm 'fibrillar center' defined by Spaulding et al. (2022) correspond to the amniote
    dense fibrillar component, i.e. should FIB-1 be annotated to GO:0001651 dense fibrillar component
    instead?
suggested_experiments:
- description: RiboMeth-seq or Nm-seq of rRNA from fib-1 RNAi or auxin-degron depleted worms, compared
    with controls, together with in vitro methylation by reconstituted FIB-1/NOL-56/NOL-58/SNU13 box C/D
    snoRNP.
  hypothesis: FIB-1 is the 2'-O-methyltransferase for the box C/D-guided sites in C. elegans rRNA.
- description: Catalytic-dead knock-in (mutation of conserved SAM-binding/catalytic residues) to separate
    catalytic and structural (RG/RGG, nucleolar assembly) roles of FIB-1 in viability, rRNA processing
    and nucleolar size.
  hypothesis: Nucleolar size and viability depend on FIB-1 scaffolding/processing function independently
    of methylation activity.
