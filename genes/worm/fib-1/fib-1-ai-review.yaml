    label: fibrillar center
  evidence_type: IDA
  original_reference_id: PMID:36329008
  qualifier: located_in
  review:
    summary: Super-resolution live imaging of endogenously tagged FIB-1 places it in the inner (FC) compartment
      of the two-compartment C. elegans nucleolus.
    action: ACCEPT
    reason: Direct endogenous-tag imaging in germ cells and hypodermis. The authors define the worm nucleolus
      as having two compartments, and the fibrillarin-containing inner one is called the fibrillar center;
      in amniotes fibrillarin marks the dense fibrillar component, so the worm FC may correspond to a
      merged FC/DFC. The annotation follows the authors' assignment and is the best available sub-nucleolar
      location.
    supported_by:
    - reference_id: PMID:36329008
      supporting_text: C. elegans nucleoli contain 2 phase-separated compartments, with NUCL-1 and LPD-6
        in the GC and FIB-1 and GARR-1 in the FC.
