    label: nucleologenesis
  evidence_type: IMP
  original_reference_id: PMID:26492166
  qualifier: involved_in
  review:
    summary: fib-1 mutant L1 larvae have small nucleoli and fib-1 RNAi suppresses the enlarged nucleoli
      of ncl-1 mutants.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is about nucleolar size, and the authors attribute it to the rRNA pool. Fibrillarin
      nonetheless contributes structurally to nucleolar assembly (its GAR domain drives phase separation
      of the fibrillar compartment in other species, and the FIB-1 RG/RGG domain is essential in worms),
      so participation in nucleolus formation is plausible. Kept as non-core.
    supported_by:
    - reference_id: PMID:26492166
      supporting_text: we thus characterized fib-1 mutant larvae (L1 stage) and found that nucleoli therein
        displayed size reduction (S2 Fig).
    - reference_id: file:worm/fib-1/fib-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Plays a role in modulation of nucleolus size most likely through regulating the
        ribosomal RNA (rRNA) pool (PubMed:26492166).
