descriptions:
- source: UniProt
  text: S-adenosyl-L-methionine-dependent methyltransferase that has the ability to
    methylate both RNAs and proteins (By similarity). Involved in pre-rRNA processing.
    Utilizes the methyl donor S-adenosyl- L-methionine to catalyze the site-specific
    2'-hydroxyl methylation of ribose moieties in pre-ribosomal RNA (By similarity).
    Site specificity is provided by a guide RNA that base pairs with the substrate.
    Methylation occurs at a characteristic distance from the sequence involved in
    base pairing with the guide RNA (By similarity). Also acts as a protein methyltransferase
    by mediating methylation of 'Gln-105' of histone H2A (H2AQ105me), a modification
    that impairs binding of the FACT complex and is specifically present at 35S ribosomal
    DNA locus (By similarity). Plays a role in modulation of nucleolus size most likely
    through regulating the ribosomal RNA (rRNA) pool (PubMed:26492166).
  source_type: curated
