descriptions:
- source: UniProt
  text: 'Transcription factor, probably acting as a transcriptional activator and
    repressor, involved in the TGF-beta-like dbl-1 signaling pathway (PubMed:14627718,
    PubMed:17397820, PubMed:20687916). Plays a role in regulation of body size, and
    patterning of male-specific genital sensilla (simple sense organs), known as rays,
    and mating- associated structures, spicules (PubMed:14627718). Required for the
    dorsoventral patterning of the postembryonic mesodermal lineage (M lineage), acting
    by antagonizing the TGF-beta-like dbl-1 signaling pathway, in part by repressing
    expression of transcription factor unc- 130 (PubMed:16790477, PubMed:18036582,
    PubMed:29155044). Involved in egg-laying, perhaps via modulation of cholinergic
    neurotransmission (PubMed:25407930). Involved in production of reactive oxygen
    species (ROS), acting downstream of the dbl-1 signaling pathway (PubMed:20687916).
    Plays a role in the mitochondrial unfolded protein response (mtUPR) (PubMed:20687916).
    May play a role in modulating lifespan and in responses to proteotoxic stress
    (PubMed:25407930). . [Isoform h]: Transcription factor, probably acting as a transcriptional
    activator (PubMed:17397820). Required for patterning of male-specific genital
    sensilla (simple sense organs), known as rays (PubMed:20565799). Dispensable for
    regulation of body size (PubMed:20565799).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q7JM44
  source_id: Q7JM44
- source: Alliance_Imported
  text: sma-9 encodes, by extensive alternative splicing, at least 13 isoforms, a
    number of which are large (~2000-residue) proteins with at least three N-terminal
    involucrin domains, seven C-terminal zinc-finger domains, and a glutamine/asparagine-rich
    domain; SMA-9 is orthologous to the Drosophila Smad cofactor Schnurri (FBgn0003396)
    and the vertebrate HIVEP proteins (Human Immunodeficiency Virus Type 1 Enhancer-Binding
    Proteins, OMIM:194540, OMIM:143054, and OMIM:606649); in C. elegans, sma-9 functions
    in a subset of the TGF-beta-mediated signaling pathways that regulate body size
    and male tail patterning and morphogenesis; sma-9, through this pathway, also
    regulates reproductive aging; studies have shown that a reduction of TGF-beta
    pathway genes extends reproductive span by maintaining oocyte and germline quality;
    sma-9 also functions antagonistically to the TGF-beta signaling pathway, and in
    parallel to the lin-12/Notch pathway, to effect proper cell fate specification
    in the postembryonic mesodermal lineage, the M lineage; SMA-9 is widely expressed
    and localizes to nuclei.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004862;class=Gene
  source_id: WB:WBGene00004862
- source: Alliance_Automated
  text: Enables transcription coactivator activity and transcription corepressor activity.
    Involved in several processes, including determination of adult lifespan; nematode
    male tail tip morphogenesis; and regulation of gene expression. Acts upstream
    of or within cellular response to heat. Located in nucleus. Is expressed in several
    structures, including anal region; digestive tract; excretory cell; hypodermis;
    and vulva. Used to study Alzheimer's disease. Human ortholog(s) of this gene implicated
    in asthma and autosomal dominant intellectual developmental disorder 43. Orthologous
    to human HIVEP1 (HIVEP zinc finger 1) and HIVEP2 (HIVEP zinc finger 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004862;class=Gene
