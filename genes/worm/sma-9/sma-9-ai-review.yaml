suggested_questions:
- question: How does the same SMA-9 protein mediate DBL-1 output in body size but antagonize
    it in the dorsal M lineage? Do different isoforms or partners explain this?
- question: Does SMA-9 bind DNA directly through its zinc fingers, as Drosophila Schnurri
    does in Mad/Medea silencer complexes, or is it recruited only through Smads?
- question: Genome-wide data (Vora et al. 2025) suggest that most genes co-regulated by SMA-9
    and SMA-3 are activated by both. How does this square with the earlier conclusion that
    SMA-9 acts primarily as a repressor in body size control?
suggested_experiments:
- description: ChIP-seq or CUT&RUN of isoform-specific tagged SMA-9 alongside SMA-3 to determine
    co-occupancy and direct targets (e.g. unc-130, lon-1).
- description: EMSA or SELEX with SMA-9 zinc-finger regions, alone and with SMA-3/SMA-4, to
    test for direct sequence-specific DNA binding.
