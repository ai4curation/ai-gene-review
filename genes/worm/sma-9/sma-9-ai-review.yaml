id: Q7JM44
gene_symbol: sma-9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SMA-9 is the C. elegans homolog of Drosophila Schnurri and the vertebrate HIVEP/ZAS
  proteins. It is a large nuclear zinc-finger protein produced as many alternatively spliced
  isoforms, and it acts as a transcriptional cofactor of the DBL-1/BMP-like Sma/Mab pathway.
  Genetically it is a downstream component needed for body size and for patterning of the
  male tail sensory rays and spicules, but its activity is more restricted in time and cell
  type than that of the core pathway. Fusion experiments indicated that SMA-9 acts mainly
  as a transcriptional repressor in body size control. Separate regions of the protein have
  intrinsic repressor and activator activity, and both contribute to male tail patterning.
  Genome-wide ChIP-seq places SMA-9 on chromatin at many sites shared with SMA-3. Its direct
  targets include both activated and repressed genes, and several targets act in cuticle collagen
  secretion. In the postembryonic mesoderm (M lineage) SMA-9 has an opposite, antagonistic
  role. It specifies dorsal fates (the M-derived coelomocytes) by opposing BMP signaling on
  the dorsal side, partly by repressing BMP-dependent expression of the FOXD factor UNC-130.
  Loss of sma-9 causes a dorsal-to-ventral fate transformation that is suppressed by loss
  of the core pathway.
