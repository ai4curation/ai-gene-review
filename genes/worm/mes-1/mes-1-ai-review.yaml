  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Places LIN-5 and GPR-1/2 downstream of mes-1 and src-1 at the four-cell stage. Cited
      by the UniProt FUNCTION text for GPR-1/2 enrichment at the P2/EMS junction.
- id: PMID:14534135
  title: LET-99 opposes Galpha/GPR signaling to generate asymmetry for spindle positioning
    in response to PAR and MES-1/SRC-1 signaling.
  findings: []
