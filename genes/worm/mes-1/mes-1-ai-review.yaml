core_functions:
- description: >-
    At the contact between the germline blastomere (P2, P3) and its endodermal neighbour,
    the transmembrane pseudokinase MES-1 provides an extrinsic polarity cue, working with
    SRC-1. It orients PAR-2 and GPR-1/2 asymmetry and positions the mitotic spindle and P
    granules toward the contact, so that the germline divisions are unequal and germ plasm
    is inherited by P4.
  directly_involved_in:
  - id: GO:0008356
    label: asymmetric cell division
  - id: GO:0040001
    label: establishment of mitotic spindle localization
  - id: GO:0045167
    label: asymmetric protein localization involved in cell fate determination
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:11003841
    supporting_text: Our results suggest that MES-1 directly positions the developing mitotic spindle
      and its associated P granules within P(2) and P(3), or provides an orientation signal for P(2)-
      and P(3)-specific events.
  - reference_id: PMID:20823070
    supporting_text: The PAR-2 localization during the asymmetric P2 and P3 divisions is controlled by
      extracellular signals via MES-1/SRC-1 signaling.
- description: >-
    In the reciprocal direction MES-1, required with SRC-1 for phosphotyrosine accumulation
    at the P2/EMS contact, acts in parallel with Wnt signaling in EMS. This pathway rotates
    the EMS spindle onto the anterior-posterior axis (through LET-99, LIN-5, PIG-1 and CED-10)
    and specifies endoderm in the E daughter.
  directly_involved_in:
  - id: GO:0000132
    label: establishment of mitotic spindle orientation
  - id: GO:0001714
    label: endodermal cell fate specification
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12110172
    supporting_text: two tyrosine kinase-related genes, src-1 and mes-1, are required for the accumulation
      of phosphotyrosine between P2 and EMS
  - reference_id: PMID:12110172
    supporting_text: src-1 and mes-1 mutants strongly enhance endoderm and EMS spindle rotation defects
      associated with Wnt pathway mutants
  - reference_id: PMID:27672093
    supporting_text: We show that LET-99 acts in the Mes-1/Src-1 pathway for spindle positioning.
