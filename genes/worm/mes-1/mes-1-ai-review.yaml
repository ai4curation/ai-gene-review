- id: file:worm/mes-1/mes-1-uniprot.txt
  title: UniProtKB/Swiss-Prot entry G5EBL2 (mes-1)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      CC FUNCTION statements on P2/P3 asymmetric division and P granule localization
      (PMID:7555722) and on MES-1 acting upstream of SRC-1 in EMS (PMID:12110172) are
      correct. The phrasing that MES-1 "plays a role in endoderm development by controlling
      spindle orientation" treats two parallel outputs of P2/EMS signaling as cause and
      effect; this is noted but not filed. The final sentence, that MES-1 controls EMS
      spindle orientation by enriching LIN-5 and GPR-1/2 and excluding LET-99 at the P2/EMS
      junction, is outdated (PMID:21903670, PMID:27672093). The DOMAIN note on the
      inactive kinase agrees with our analysis.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: UniProtKB:G5EBL2
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Controls EMS spindle orientation probably by promoting lin-5 and gpr-1/2 enrichment
        at, and let-99 exclusion from the junction between P2 and EMS cells
      confidence: PROBABLE
      explanation: >-
        The CC FUNCTION comment says MES-1 "Controls EMS spindle orientation probably by
        promoting lin-5 and gpr-1/2 enrichment at, and let-99 exclusion from the junction
        between P2 and EMS cells". Mosaic analysis later showed that GPR-1/2 is asymmetric
        only in P2 and symmetric in EMS, and ruled out the model in which signaling localizes
        GPR-1/2 by locally inhibiting LET-99 (PMID:21903670). LET-99 is instead required in
        the MES-1/SRC-1 pathway for EMS spindle positioning (PMID:27672093), and CED-10 and
        branched actin act in EMS (PMID:39891664). Suggested text: "Controls EMS spindle
        orientation together with src-1, acting through let-99, lin-5 and ced-10; in P2,
        promotes asymmetric gpr-1/2 localization." Filed as a query because the original
        sentence is hedged ("probably").
      supported_by:
      - reference_id: PMID:21903670
        supporting_text: We were surprised to find that GPR-1/2 distribution is symmetric in EMS, where
          GPR-1/2 had been proposed to function as an asymmetric cue for spindle orientation. Instead,
          GPR-1/2 is asymmetrically distributed only in P(2).
      - reference_id: PMID:21903670
        supporting_text: We ruled out a model in which signaling localizes GPR-1/2 by locally inhibiting
          LET-99, a GPR-1/2 antagonist.
      - reference_id: PMID:27672093
        supporting_text: We show that LET-99 acts in the Mes-1/Src-1 pathway for spindle positioning.
- id: file:worm/mes-1/mes-1-deep-research-wormbase.md
  title: WormBase gene description for mes-1 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      WormBase curated description (uncited, undated). All three claims trace: the receptor
      tyrosine kinase-like protein (PMID:11003841), the requirement for unequal germline
      divisions (PMID:7555722), and positioning of the mitotic spindle and P granules
      (PMID:11003841). "Receptor tyrosine kinase-like" is accurate as stated, but the text
      does not say that the kinase domain is predicted inactive, which the automated text and
      GOA contradict. It also omits the P2/EMS signaling role with SRC-1 (EMS spindle
      rotation, endoderm). Both omissions are recorded as a missing statement.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00003219
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00003219
      confidence: CONFIRMED
      explanation: >-
        The description covers only the germline divisions. It omits that MES-1 acts with
        the Src kinase SRC-1 at the P2/EMS contact, in parallel with Wnt signaling, to orient
        the EMS division and specify endoderm (PMID:12110172). It also omits that MES-1's
        kinase-like domain lacks catalytic residues and is predicted inactive
        (PMID:11003841). Suggested addition: "MES-1 is a predicted pseudokinase; with SRC-1
        and in parallel with Wnt signaling, it also signals between P2 and EMS to orient the
        EMS division and specify endoderm."
      supported_by:
      - reference_id: PMID:12110172
        supporting_text: src-1 and mes-1 mutants strongly enhance endoderm and EMS spindle rotation defects
          associated with Wnt pathway mutants
      - reference_id: PMID:11003841
        supporting_text: mes-1 encodes a receptor tyrosine kinase-like protein, though it lacks several
          residues conserved in all kinases and therefore is predicted not to have kinase activity
suggested_questions:
- question: >-
    What does the MES-1 extracellular domain bind? Bei et al. proposed a homotypic
    MES-1/MES-1 interaction across the P2/EMS contact, but no ligand or binding partner has
    been identified.
- question: >-
    How does the MES-1 pseudokinase domain activate SRC-1? Does it serve as a scaffold or
    docking site for SRC-1 or CED-10, and does it bind nucleotide at all?
- question: >-
    Why does MES-1 accumulate only at the P2/EMS-type contact, when all early blastomeres
    contain the protein? What contact-specific factor anchors it?
suggested_experiments:
- description: >-
    Test MES-1 extracellular domain binding partners by proximity labelling (TurboID) of
    endogenous MES-1 at the P2/EMS contact, and test homotypic binding with purified
    ectodomain or cell-aggregation assays.
  experiment_type: proximity labelling and binding assays
- description: >-
    Express the MES-1 cytoplasmic domain and test kinase activity and ATP binding (thermal
    shift with ATP/Mg2+), then use CRISPR alleles restoring the catalytic-loop Asp (R832D)
    and DFG Asp (N860D), or deleting the pseudokinase domain, to ask whether the domain acts
    as a scaffold for SRC-1 activation in vivo.
  experiment_type: in vitro kinase/nucleotide-binding assays and CRISPR allele analysis
