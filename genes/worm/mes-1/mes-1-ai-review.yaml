- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000719
  review:
    summary: InterPro2GO mapping from the protein kinase domain signature (IPR000719).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Some pseudokinases still bind ATP, so loss of catalysis alone does not exclude this.
