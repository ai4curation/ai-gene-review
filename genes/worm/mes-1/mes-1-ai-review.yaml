  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: MES-1 and SRC-1 are needed for phosphotyrosine at the P2/EMS contact and act in parallel
      with Wnt for endoderm and EMS spindle rotation. The author PDF (read online) describes the EMS
      "L/R division axis" behind the UniProt left/right axis IGI row.
- id: PMID:12730122
  title: A complex of LIN-5 and GPR proteins regulates G protein signaling and spindle
