      supporting_text: As an apparent consequence of these defects, P4 is transformed into a muscle
        precursor, like its somatic sister cell D, and generates up to 20 body muscle cells instead
        of germ cells.
    - reference_id: PMID:12110172
      supporting_text: SRC-1 and MES-1 signal bidirectionally to control cell fate and division orientation
