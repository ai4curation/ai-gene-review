    action: ACCEPT
    reason: >-
      MES-1 participates in the cell-contact signaling that specifies blastomere fates. It
      orients the P2/P3 divisions that segregate germline determinants (PMID:7555722,
      PMID:11003841), and with SRC-1 it signals from P2 to EMS to specify endoderm
      (PMID:12110172). The endoderm part is captured more specifically by the MODIFY on the
      GO:0048557 row. Core process.
    supported_by:
