id: G5EBL2
gene_symbol: mes-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  mes-1 (maternal-effect sterile 1) encodes MES-1, a 966-residue single-pass transmembrane
  protein. It has a large extracellular domain and a cytoplasmic domain resembling a receptor
  tyrosine kinase, but the kinase domain lacks the catalytic-loop aspartate, the DFG aspartate
  and the glycine-rich loop, so MES-1 is a predicted pseudokinase. In 4- to 24-cell embryos
  MES-1 accumulates in a crescent at the contact between the germline blastomere (P2, P3, P4)
  and its neighbouring endodermal cell (EMS, E, Ep), and its localization there requires
  MES-1 in both cells. From this contact MES-1 acts with the Src kinase SRC-1, which it is
  needed to activate (phosphotyrosine accumulates at the junction), and signals in both
  directions. In P2 and P3 it orients cell polarity, PAR-2 and GPR-1/2 asymmetry, and
  spindle and P granule positioning toward the contact, so that the divisions are unequal
  and germ plasm goes only to the germline daughter. In EMS, acting in parallel with Wnt
  signaling, it contributes to rotation of the mitotic spindle onto the anterior-posterior
  axis and to endoderm specification of the E daughter, through LET-99, LIN-5, PIG-1 and the
  Rac CED-10. In mes-1 mutants P2 and P3 divide symmetrically, P4 adopts the muscle fate of
  its sister D, and the offspring grow into sterile adults without a germline.
