findings:
- category: discrepancy
  text: The automated text gives MES-1 serine/threonine and tyrosine kinase activity, but
    the kinase domain lacks the catalytic-loop and DFG aspartates and the glycine-rich loop,
    and the discovery paper predicted no activity. The review removes all four kinase-activity
    rows and records a CONFIRMED WormBase defect on the ISS row.
  sources:
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: Left/right axis specification in the automated text comes from a UniProt IGI row that
    misreads "a fully L/R division axis in EMS" (spindle orientation) as organismal L/R specification.
    The review modifies it to establishment of mitotic spindle orientation.
  sources:
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: UniProt's mechanism for EMS spindle orientation (GPR-1/2 enrichment, LET-99 exclusion
    at the P2/EMS junction) was revised by PMID:21903670 (GPR-1/2 asymmetric only in P2) and
    PMID:27672093 (LET-99 required in the MES-1/SRC-1 pathway).
  sources:
  - UniProt
- category: gap
  text: WormBase does not mention the P2/EMS signaling role with SRC-1 (endoderm, EMS spindle
    rotation) or the pseudokinase status; recorded as a WormBase missing statement.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: WormBase and UniProt agree that MES-1 is a membrane protein at the germline/endoderm
    contact that orients the unequal P2/P3 divisions, and UniProt adds the SRC-1/EMS role.
    The automated text contradicts both by asserting kinase activities that the domain cannot
    have, and adds a spurious left/right axis role.
