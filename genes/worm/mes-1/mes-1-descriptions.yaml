descriptions:
- source: UniProt
  text: During early embryogenesis, controls asymmetric cell division and the asymmetric localization
    of P granules of germline precursor P2 and its descendant P3 (PubMed:7555722). Probably
    upstream of tyrosine kinase src-1, plays a role in endoderm development by controlling
    spindle orientation during EMS blastomere cell division (PubMed:12110172). Controls EMS
    spindle orientation probably by promoting lin-5 and gpr-1/2 enrichment at, and let-99
    exclusion from the junction between P2 and EMS cells (PubMed:12730122, PubMed:14534135).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EBL2
  source_id: G5EBL2
