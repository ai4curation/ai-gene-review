    - rubric: specificity
      score: 4
    overall_notes: Cited and correct on P2/P3 asymmetric division, P granule localization
      and MES-1 upstream of SRC-1 in EMS. The mechanism sentence (EMS spindle orientation
      via GPR-1/2 enrichment and LET-99 exclusion at the junction) is outdated (PMID:21903670,
      PMID:27672093). "Endoderm development by controlling spindle orientation" links two
      parallel outputs causally. The DOMAIN note correctly flags the inactive kinase.
- source: Alliance_Imported
  text: The mes-1 gene encodes a receptor tyrosine kinase-like protein that is required for
    unequal cell divisions in the early embryonic germline; during embryonic cell divisions,
    mes-1 is involved in positioning of the early mitotic spindle and of associated P granules.
