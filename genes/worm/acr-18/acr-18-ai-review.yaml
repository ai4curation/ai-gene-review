id: G5EG72
gene_symbol: acr-18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ACR-18 (F28F8.1) is a Caenorhabditis elegans subunit of the Cys-loop ligand-gated ion channel
  superfamily, in the nematode-specific DEG-3 group of nicotinic acetylcholine receptor-like subunits.
  It has an N-terminal extracellular ligand-binding domain with the Cys-loop disulfide and the vicinal
  loop-C cysteines of an alpha-type subunit, followed by four transmembrane helices, and is expected to
  assemble into pentameric cation channels in the neuronal plasma membrane. acr-18 is expressed in sex-shared
  head and ventral nerve cord neurons, including the backward command interneuron AVA, and in male ray
  and pre-anal ganglion neurons. In males, an ACR-18-containing cholinergic receptor acting in the backward
  command interneurons relays input from the male-specific cholinergic interneurons PVY and PVX, which
  drive backward locomotion during the vulva search of mating; this function is partially redundant with
  receptors containing UNC-29 and ACR-16. The agonist, partner subunits and ion permeability of ACR-18-containing
  receptors have not been determined directly.
