suggested_questions:
- question: What agonist gates ACR-18-containing receptors? ACR-18 is a DEG-3-group subunit, and some
    channels of this group respond to choline or betaine rather than acetylcholine; is acetylcholine-gated
    channel activity (GO:0022848) the right MF term?
- question: 'Which subunits co-assemble with ACR-18 in AVA: does it form heteromers with UNC-29 or ACR-16,
    other DEG-3-group subunits, or homomers?'
- question: Are ACR-18-containing channels calcium-permeable, as the IBA row for calcium ion transport
    implies?
suggested_experiments:
- description: Express ACR-18 alone and with candidate partners (DEG-3-group subunits, UNC-29, ACR-16)
    in Xenopus oocytes with RIC-3 and test acetylcholine, choline, betaine and nicotine; measure reversal
    potentials and Ca2+ permeability.
  hypothesis: ACR-18 forms, alone or with partners, a cation channel gated by acetylcholine (or another
    cholinergic ligand) with measurable Ca2+ permeability.
- description: Endogenously tag ACR-18 (e.g. CRISPR knock-in of a fluorescent protein) and image its subcellular
    distribution in AVA relative to PVY/PVX presynaptic markers.
  hypothesis: ACR-18 protein is enriched at postsynaptic sites on AVA opposite PVY/PVX cholinergic terminals.
