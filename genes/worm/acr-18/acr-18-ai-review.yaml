    review_notes: WormBase curated description. Checked claims. (1) ACR-18 is an alpha-type nAChR subunit
      of the nematode-specific DEG-3 group, which is correct and consistent with the family literature and the sequence
      motif check. (2) A role at neuromuscular junctions is stated only as a prediction and has no direct
      support; the only primary paper on acr-18 places it in neurons (backward command interneurons), not
      muscle. (3) The text omits the one established function, an ACR-18-containing receptor in AVA that
      mediates PVY/PVX-driven reversal during male mating (PMID:23577128). Recorded as a missing statement.
