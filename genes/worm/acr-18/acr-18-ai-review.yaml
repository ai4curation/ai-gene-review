references:
- id: PMID:23577128
  title: The C. elegans male exercises directional control during mating through cholinergic regulation
    of sex-shared command interneurons.
  findings:
  - statement: acr-18 is expressed in AVA and other sex-shared head and ventral cord neurons, and in male
      ray and pre-anal ganglion neurons.
    supporting_text: In both sexes, acr-18 expression is apparent in a number of sex-shared head and ventral
      nerve cord neurons and, in the male, in a subset of ray and pre-anal ganglion neurons
  - statement: An ACR-18-containing cholinergic receptor acting in nmr-1-expressing backward command cells
      mediates PVY/PVX-induced reversal; cell-specific rescue.
    supporting_text: These data suggest that PVY+PVX-induced reversal depends on an ACR-18-containing
      cholinergic receptor that functions in nmr-1-expressing cells, most likely the backward command
      cells as these are direct targets of cholinergic PVY and PVX.
  - statement: ACR-18-, UNC-29- and ACR-16-containing receptors are partially redundant in AVA.
    supporting_text: PVY+PVX-induced reversal depends on cholinergic transmission in AVA that is mediated
      by partially redundant AChRs that contain acr-18-, unc-29- and acr-16-encoded subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC3618225); the only primary paper on acr-18 found by PubMed search.
      Evidence is genetic (null mutant, cell-specific rescue, optogenetics) plus transcriptional reporters;
      no electrophysiology or protein localization for ACR-18.
