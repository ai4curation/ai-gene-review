descriptions:
- source: Alliance_Imported
  text: acr-18 encodes an alpha subunit of nicotinic acetylcholine receptor (nAChR),
    predicted to be a ligand-gated ion channel regulating fast action of acetylcholine
    at neuromuscular junctions and in the nervous system; ACR-18 falls into the 'DEG-3'
    class of nAChR subunits, apparently unique to nematodes, which includes DEG-3,
    DES-2, ACR-5, ACR-17, ACR-20, and ACR-23.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000057;class=Gene
  source_id: WB:WBGene00000057
