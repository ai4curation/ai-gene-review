descriptions:
- source: Alliance_Imported
  text: acr-18 encodes an alpha subunit of nicotinic acetylcholine receptor (nAChR),
    predicted to be a ligand-gated ion channel regulating fast action of acetylcholine
    at neuromuscular junctions and in the nervous system; ACR-18 falls into the 'DEG-3'
    class of nAChR subunits, apparently unique to nematodes, which includes DEG-3,
    DES-2, ACR-5, ACR-17, ACR-20, and ACR-23.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000057;class=Gene
  source_id: WB:WBGene00000057
- source: Alliance_Automated
  text: Predicted to enable extracellular ligand-gated monoatomic ion channel activity
    and transmembrane signaling receptor activity. Predicted to contribute to acetylcholine-gated
    monoatomic cation-selective channel activity. Predicted to be involved in several
    processes, including calcium ion transport; cholinergic synaptic transmission;
    and regulation of membrane potential. Predicted to be located in membrane and
    postsynapse. Predicted to be part of acetylcholine-gated channel complex. Predicted
    to be active in plasma membrane. Is expressed in neurons and ray. Used to study
    nicotine dependence.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000057;class=Gene
  source_id: WB:WBGene00000057
- source: RefSeq
  text: Predicted to enable neurotransmitter receptor activity. Predicted to contribute
    to acetylcholine-gated monoatomic cation-selective channel activity. Predicted
    to be involved in several processes, including calcium ion transport; cholinergic
    synaptic transmission; and regulation of membrane potential. Predicted to be located
    in membrane and postsynapse. Predicted to be part of acetylcholine-gated channel
    complex. Predicted to be active in neuron projection; plasma membrane; and synapse.
    Is expressed in neurons and ray. Used to study nicotine dependence. [provided
    by Alliance of Genome Resources, Jun 2026]
