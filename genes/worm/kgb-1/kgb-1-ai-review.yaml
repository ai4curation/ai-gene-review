suggested_questions:
- question: Which KGB-1 substrates other than FOS-1 are directly phosphorylated during
    heavy-metal, pore-forming-toxin, and protein-folding stress?
- question: What age-dependent molecular switch makes KGB-1 enhance DAF-16 nuclear localization
    in larvae but attenuate DAF-16 nuclear localization in adults?
suggested_experiments:
- description: Perform stimulus-resolved KGB-1 phosphoproteomics after copper, cadmium, Cry5B,
    ER stress, and fasting to separate direct JNK substrates from indirect transcriptional
    outputs.
- description: Use phosphosite-mutant FOS-1 and DAF-16 reporters in kgb-1 and vhp-1 backgrounds
    to test whether KGB-1 directly controls adult intestinal DAF-16 localization or acts through
    an intermediate kinase or scaffold.
