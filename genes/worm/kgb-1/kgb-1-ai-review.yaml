  qualifier: involved_in
  review:
    summary: RNA-splicing changes after pore-forming toxin exposure are too indirect for KGB-1.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Cry5B full text shows that xbp-1 splicing is KGB-1-dependent during
      pore-forming-toxin UPR activation. KGB-1 acts upstream of UPR signaling, but IRE-1
      performs xbp-1 splicing itself, so positive regulation of RNA splicing overstates the JNK
      kinase's direct role.
    supported_by:
    - reference_id: PMID:21408619
      supporting_text: Cry5B PFT-induced activation of the UPR PFT defense pathway is also
        dependent upon JNK MAPK, as ascertained by induction of the downstream transcriptional
        target hsp-4 transcript levels and by induction of xbp-1 splicing
