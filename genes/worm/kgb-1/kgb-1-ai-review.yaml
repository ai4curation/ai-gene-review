id: O44408
gene_symbol: kgb-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'KGB-1 is a JNK-like MAP kinase in the MLK-1-MEK-1-KGB-1 stress-response cascade. Activated
  KGB-1 phosphorylates downstream targets including FOS-1/AP-1-family factors, supports heavy-metal
  tolerance and defense against bacterial pore-forming toxins, regulates P-granule GLH proteins in
  the germline, and modulates DAF-16/FOXO localization in opposite directions during larval development
  and adulthood.'
