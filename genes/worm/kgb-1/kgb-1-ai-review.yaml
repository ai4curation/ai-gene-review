- term:
    id: GO:0010629
    label: negative regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:25274306
  qualifier: involved_in
  review:
    summary: KGB-1 is only indirectly connected to repression of the mitochondrial UPR.
    action: MARK_AS_OVER_ANNOTATED
    reason: The UPRmt paper reports enhanced spg-7(RNAi) survival in kgb-1 mutants and
      interprets KGB-1 as a negative regulator of UPRmt. It does not show direct KGB-1-mediated
      repression of gene expression, so this row overstates the mechanism.
    supported_by:
    - reference_id: PMID:25274306
      supporting_text: increased survival by spg-7(RNAi) was further enhanced in kgb-1(km21)
        worms, consistent with kgb-1 being a negative regulator of the UPRmt
