  review:
    summary: KGB-1 directly phosphorylates FOS-1 threonine sites.
    action: ACCEPT
    reason: The FOS-1 phosphorylation evidence maps the major KGB-1 site to Thr-304, with
      Thr-316 and Thr-318 as possible minor sites. This directly supports protein
      serine/threonine kinase activity, while JUN kinase activity is retained on rows whose own
      evidence or PAINT source supports that specific JNK-family substrate profile.
    supported_by:
    - reference_id: PMID:23437011
      supporting_text: To confirm that KGB-1 phosphorylates FOS-1 at the Thr-304 residue, we
        generated anti-phospho-FOS-1 antibodies
