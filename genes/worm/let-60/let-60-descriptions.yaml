gene_symbol: let-60
organism: worm
uniprot_id: P22981
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: GTP-binding protein with GTPase activity (PubMed:39809765). The level of let-60
    controls the switch between vulval and hypodermal cell fates during C.elegans
    vulval induction (PubMed:20230814, PubMed:2123303, PubMed:2257629, PubMed:23103556,
    PubMed:24929033, PubMed:28135265, PubMed:32053105). May stimulate the guanine
    nucleotide exchange factor (GEF) activity of rap-1 (PubMed:10608844). May induce
    nuclear condensation (PubMed:23103556).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22981
  source_id: P22981
- source: Alliance_Imported
  text: let-60 encodes a member of the GTP-binding RAS protooncogene family; let-60
    activity is required for viability, vulval development, spicule development, germ
    line meiotic progression, posterior development of the hypodermis, chemotaxis,
    sex myoblast migration, and muscle membrane extension; let-60 acts genetically
    downstream of let-23 with respect to vulval development and upstream of the MAPK
    pathway with respect to chemotaxis; let-60 is expressed in neural, muscle, and
    hypodermal lineages.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002335;class=Gene
  source_id: WB:WBGene00002335
- source: Alliance_Automated
  text: Enables GTP binding activity; phospholipase binding activity; and protein
    serine/threonine kinase binding activity. Involved in several processes, including
    learning or memory; positive regulation of receptor localization to synapse; and
    positive regulation of vulval development. Located in cell cortex. Is expressed
    in several structures, including gonad; head neurons; pharyngeal cell; vulval
    cell; and vulval precursor cell. Used to study RASopathy; cancer; and prostate
    cancer. Human ortholog(s) of this gene implicated in several diseases, including
    Costello syndrome; Noonan syndrome (multiple); cardiofaciocutaneous syndrome (multiple);
    disease of cellular proliferation (multiple); and uterine disease (multiple).
    Orthologous to several human genes including HRAS (HRas proto-oncogene, GTPase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002335;class=Gene
  source_id: WB:WBGene00002335
