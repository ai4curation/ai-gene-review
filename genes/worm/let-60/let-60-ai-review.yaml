id: P22981
gene_symbol: let-60
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  let-60 encodes the C. elegans Ras small GTPase that functions as a
  membrane-associated molecular switch downstream of receptor tyrosine kinases.
  SOS-1-mediated GTP loading activates LET-60, enabling interactions with
  effectors such as LIN-45/Raf and PLC-1 to control vulval induction,
  oogenesis, learning, and additional Ras-dependent developmental signals.
