  review:
    summary: LET-60/Ras contributes to LIN-45/Raf-dependent larval viability,
      but larval development is a downstream organismal output rather than the
      reusable Ras molecular role.
    action: KEEP_AS_NON_CORE
    reason: LIN-45/Raf is activated downstream of LET-60/Ras and is required for
      larval viability, fertility, and vulval induction. The annotation is
      plausible for LET-60 in the RTK/Ras/MAPK pathway but is a broad
      developmental consequence, so it should be retained as non-core rather
      than treated as LET-60's core GTPase function.
