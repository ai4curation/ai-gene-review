- source: Alliance_Imported
  text: sta-2 encodes a member of the STAT family of transcription factors; STA-2
    functions cell autonomously together with the SNF-12 sodium-dependent neurotransmitter
    symporter to regulate expression of antimicrobial peptides in the epidermis following
    fungal infection and physical wounding; STA-2 physically interacts with SNF-12;
    a sta-2 reporter gene is expressed in the epidermis throughout development and
    in the seam cells, intestine, phasmid socket cells, excretory duct cell, vulval
    cells and the dorsal rectal cells; STA-2 localizes to both the nucleus and the
    cytoplasm; in the epidermal cytoplasm, STA-2 colocalizes with SNF-12 in endocytic-like
    vesicles near the apical cell surface.
  source_type: curated
