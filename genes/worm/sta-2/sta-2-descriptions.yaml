descriptions:
- source: UniProt
  text: 'Carries out a dual function: signal transduction and activation of transcription
    (By similarity). Required, in concert with transcription factor elt-3, for up-regulation
    of the vacuolar H(+)- ATPase and acceleration of lysosome maturation at molt (PubMed:31735670).
    As part of the innate immune response to molting and injury of the adult epidermis,
    positively regulates the expression of epidermal antimicrobial peptides, such
    as nlp-29 (PubMed:21575913, PubMed:22470487, PubMed:33259791). Through positively
    modulating the expression of epidermal antimicrobial peptides, such as nlp-29,
    plays a role in resistance to fungal infection and in the response to physical
    wounding and phorbol ester PMA treatment (PubMed:21575913, PubMed:22470487). Functions
    cell autonomously in the epidermis, in concert with sodium-dependent transporter
    snf-12, probably acting at vesicular membranes, downstream of a p38 MAPK/pmk-1
    pathway.'
  source_type: curated
