  review:
    summary: PAINT IBA for protein refolding from node PTN000897708.
    action: KEEP_AS_NON_CORE
    reason: 'sHSPs do not refold clients themselves; they bind unfolding intermediates ATP-independently
      and hold them in a state from which the HSP70 system refolds them, so they contribute an upstream
      holding step to the refolding process. The IBA node placement is reasonable for the alpha-crystallin
      family and there is no evidence that HSP-16.41 has diverged, so it is retained, but as non-core:
      the core activity is the holdase function. (The hsp-16.2 review removed this IBA; KEEP_AS_NON_CORE
      is used here because a PAINT node judgement is not contradicted by evidence specific to this protein.)'
    supported_by:
    - reference_id: PMID:9305934
      supporting_text: both wild-type and C-terminally-truncated HSP16-2 can function as molecular chaperones
        by suppressing the thermally-induced aggregation of citrate synthase
