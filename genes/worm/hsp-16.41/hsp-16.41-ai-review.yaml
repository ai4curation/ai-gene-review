description: HSP-16.41 is a heat-inducible small heat shock protein (sHSP) of the alpha-crystallin/HSP20
  family, encoded by the single-copy gene Y46H3A.2 on chromosome V, which is transcribed divergently from
  hsp-16.2 off a shared intergenic promoter containing heat shock elements. It belongs to the same sHSP
  subclass as HSP-16.48. HSP-16.41 is not expressed under normal conditions and is strongly induced by
  heat in an HSF-1-dependent manner, with the hsp-16.2/hsp-16.41 promoter acting preferentially in intestine
  and pharynx; unlike hsp-16.2 it is not hypoxia-responsive. By homology with HSP-16.2, it functions as
  an ATP-independent holdase chaperone that binds unfolding proteins to prevent their aggregation. Its
  pharyngeal expression during Salmonella infection depends on the Toll-like receptor TOL-1.
