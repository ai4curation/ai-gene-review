descriptions:
- source: Alliance_Imported
  text: hsp-16.41 encodes a 16-kD heat shock protein (HSP) that is a member of the
    hsp16/hsp20/alphaB-crystallin (HSP16) family of heat shock proteins; an hsp-16.41
    reporter fusion, expressed broadly but strongest in intestine and pharynx, is
    induced in response to heat shock or other environmental stresses; expression
    is detectable in somatic tissues in post-gastrulation embryos, all larval stages,
    and in adults; HSP-16.41 is likely to function as a passive ligand temporarily
    preventing unfolded proteins from aggregating.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002018;class=Gene
  source_id: WB:WBGene00002018
- source: Alliance_Automated
  text: Predicted to enable unfolded protein holdase activity. Involved in defense
    response to Gram-negative bacterium and response to heat. Predicted to be active
    in cytoplasm and nucleus. Is expressed in several structures, including alimentary
    muscle; coelomocyte; intestine; neurons; and ventral nerve cord. Human ortholog(s)
    of this gene implicated in cataract 9 multiple types. Orthologous to human CRYAA
    (crystallin alpha A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002018;class=Gene
