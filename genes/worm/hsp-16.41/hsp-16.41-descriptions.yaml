- source: Alliance_Automated
  text: Predicted to enable unfolded protein holdase activity. Involved in defense
    response to Gram-negative bacterium and response to heat. Predicted to be active
    in cytoplasm and nucleus. Is expressed in several structures, including alimentary
    muscle; coelomocyte; intestine; neurons; and ventral nerve cord. Human ortholog(s)
    of this gene implicated in cataract 9 multiple types. Orthologous to human CRYAA
    (crystallin alpha A).
