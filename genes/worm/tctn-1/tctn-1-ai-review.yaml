  title: Conserved Genetic Interactions between Ciliopathy Complexes Cooperatively
    Support Ciliogenesis and Ciliary Signaling.
  findings:
  - statement: >-
      TCTN-1 is a TZ protein of the MKS module; it interacts genetically with nphp-1
      and nphp-4 but not with MKS genes, and excludes TRAM-1a from cilia.
    supporting_text: >-
      tctn-1 interacts with nphp-4 and nphp-1, but not with the MKS complex genes
      mks-1, mksr-1, mksr-2 and mks-3, thereby genetically placing tctn-1 within the
      MKS module.
