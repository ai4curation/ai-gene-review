      supporting_text: >-
        However, loss of tctn-1 in combination with loss of components of the NPHP
        complex, a biochemically distinct transition zone complex, synergistically
        abrogated ciliogenesis
- term:
    id: GO:1903565
    label: negative regulation of protein localization to cilium
  evidence_type: IMP
  original_reference_id: PMID:26540106
  qualifier: involved_in
  review:
    summary: >-
      TRAM-1a::tdTomato, normally restricted to the periciliary membrane
      compartment, enters phasmid cilia in tctn-1 mutants. TCTN-1 is therefore
      required to exclude a non-ciliary membrane protein from the cilium.
    action: NEW
    reason: >-
      Ciliary gate function is the central role of the TZ MKS module. The same term
      is used for sibling MKS-module genes (mks-2, mks-3, mksr-1). TCTN-1 is a TZ
      component of the barrier itself, not an upstream regulator.
    supported_by:
    - reference_id: PMID:26540106
      supporting_text: >-
        We found that C. elegans TCTN-1 controls ciliary membrane composition
        similarly to other transition zone proteins, by excluding the non-ciliary
        membrane protein TRAM-1a from the cilium
core_functions:
- description: >-
    Tectonic-family component of the MKS module at the ciliary transition zone. It
    contributes to the TZ membrane diffusion barrier that excludes non-ciliary
    membrane proteins (TRAM-1a), and acts redundantly with the NPHP module to build
    intact cilia and Y-links. It is not required for TZ assembly of other MKS/NPHP
    proteins. 'structural molecule activity' is a placeholder: no GO
    molecular-function term describes a TZ barrier component.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
