  review:
    summary: >-
      Phylogenetic inference from fly and mouse Tectonics, which are required for
      ciliogenesis. In worms, tctn-1 acts redundantly with nphp-1/nphp-4 to build
      intact cilia.
    action: ACCEPT
    reason: >-
      Supported by the synthetic cilium structure defects of tctn-1;nphp-4 and
      tctn-1;nphp-1 double mutants. The more specific non-motile cilium assembly
      would also fit, because worm sensory cilia are non-motile, but the IBA level
      is acceptable.
