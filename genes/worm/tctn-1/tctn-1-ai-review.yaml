suggested_questions:
- question: >-
    Is TCTN-1 a biochemical subunit of a worm MKS/tectonic complex, as mouse Tctn1
    is? Worm evidence is genetic only, so MKS complex membership has not been
    asserted here.
- question: >-
    Is the TCTN-1 C-terminal hydrophobic segment a true transmembrane anchor, or a
    GPI-attachment signal as proposed for some vertebrate Tectonics?
suggested_experiments:
- description: >-
    Test which TZ proteins (MKS-5, MKS-1, MKSR-1, TMEM-107) are required for
    TCTN-1::GFP TZ localization, to place it in the MKS assembly hierarchy.
