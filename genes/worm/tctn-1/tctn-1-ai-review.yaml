gene_symbol: tctn-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  TCTN-1 (E04A4.6) is the single Caenorhabditis elegans ortholog of the vertebrate
  Tectonic proteins (TCTN1-3). It has an N-terminal signal peptide, a Tectonic
  domain most conserved in its C-terminal region, and a predicted C-terminal
  transmembrane segment. Like other transition zone genes, tctn-1 carries an X-box
  promoter motif, depends on DAF-19, and is expressed preferentially in ciliated
  sensory neurons. TCTN-1::GFP concentrates at the ciliary transition zone (TZ),
  immediately distal to the basal body. Genetically TCTN-1 belongs to the MKS
  module: tctn-1 single mutants and double mutants with MKS-module genes (mks-1,
  mksr-1, mksr-2, mks-3) have normal cilia, whereas tctn-1;nphp-4 and tctn-1;nphp-1
  double mutants lose ciliary integrity (missing or truncated axonemes, defective
  Y-links, mispositioned cilia). TCTN-1 is not needed for TZ localization of MKSR-1,
  MKS-5, MKS-6 or NPHP-4, or for ciliary targeting of ODR-10 or ARL-13. It is
  required, however, to keep the non-ciliary membrane protein TRAM-1a out of the
  cilium, so it contributes to the TZ membrane diffusion barrier (ciliary gate).
