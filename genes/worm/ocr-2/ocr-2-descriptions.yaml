    overall_notes: TRPV channel required for several sensory modalities and mutual
      ciliary localization with OSM-9; no thermosensation or serotonin regulation.
- source: Alliance_Automated
  text: Enables temperature-gated cation channel activity. Involved in heat acclimation.
    Located in non-motile cilium and plasma membrane. Is expressed in several structures,
    including SMDVL; body ganglion; head neurons; lumbar neurons; and uterus. Human
    ortholog(s) of this gene implicated in several diseases, including colorectal
    cancer; congenital stationary night blindness; hyperparathyroidism; keratosis
    (multiple); and migraine with aura. Orthologous to several human genes including
    TRPV5 (transient receptor potential cation channel subfamily V member 5) and TRPV6
    (transient receptor potential cation channel subfamily V member 6).
  source_type: automated
