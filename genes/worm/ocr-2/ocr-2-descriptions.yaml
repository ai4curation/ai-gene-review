gene_symbol: ocr-2
organism: worm
uniprot_id: O61220
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: ocr-2 encodes a TRPV (transient receptor potential channel, vanilloid subfamily)
    ion channel; OCR-2 activity is required for several types of sensory transduction
    including olfaction, osmosensation, mechanosensation, and chemosensation; an OCR-2
    fusion protein is expressed in sensory cilia and requires the OSM-9 TRPV channel
    protein for proper localization; likewise, OSM-9 requires OCR-2 for its cilial
    localization.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003839;class=Gene
  source_id: WB:WBGene00003839
- source: Alliance_Automated
  text: Enables temperature-gated cation channel activity. Involved in heat acclimation.
    Located in non-motile cilium and plasma membrane. Is expressed in several structures,
    including SMDVL; body ganglion; head neurons; lumbar neurons; and uterus. Human
    ortholog(s) of this gene implicated in several diseases, including colorectal
    cancer; congenital stationary night blindness; hyperparathyroidism; keratosis
    (multiple); and migraine with aura. Orthologous to several human genes including
    TRPV5 (transient receptor potential cation channel subfamily V member 5) and TRPV6
    (transient receptor potential cation channel subfamily V member 6).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003839;class=Gene
  source_id: WB:WBGene00003839
