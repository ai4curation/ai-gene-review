      source_entities:
      - source_id: PANTHER:PTN000554964
        source_label: PTN000554964
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Eukaryotic RdRP node seeded by S. pombe Rdp1, whose RDRC acts in nuclear heterochromatin
          assembly. RRF-1 keeps the RdRP-helicase complex but acts in cytoplasmic Mutator foci; in C.
          elegans the heterochromatin role belongs to EGO-1.
    reason: RRF-1 does form an RdRP complex with the Dicer-related helicase DRH-3 (PMID:18007599, PMID:19800275).
      But the characterized RRF-1 complex acts in cytoplasmic perinuclear Mutator foci (PMID:22713602),
      and RRF-1 is not one of the RdRPs needed for H3K9me2 assembly on unpaired meiotic DNA, which requires
      only EGO-1 (PMID:16271877). The nuclear, heterochromatin-assembly complex defined by this term fits
      EGO-1 better than RRF-1.
    supported_by:
    - reference_id: PMID:16271877
