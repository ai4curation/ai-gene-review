  label: Caenorhabditis elegans
description: 'RRF-1 is a C. elegans cellular RNA-directed RNA polymerase (RdRP) that synthesizes secondary
  small interfering RNAs (22G-RNAs). Its products are unprimed, 5''-triphosphorylated antisense RNAs made
  on target mRNA templates, and they are loaded into worm-specific Argonautes (WAGOs) to amplify and sustain
  silencing. RRF-1 is the RdRP of somatic RNAi and, in the germline, the RdRP of the Mutator pathway:
  it colocalizes with MUT-16 in perinuclear Mutator foci, where it is thought to use poly(UG)-tailed mRNA
  fragments made by RDE-3 as templates, and it binds UG-repeat RNA. RRF-1 associates with the Dicer-related
  helicase DRH-3 in RdRP complexes and acts partly redundantly with the germline RdRP EGO-1. It is required
  for exogenous RNAi, for transposon and endogenous gene silencing.'
