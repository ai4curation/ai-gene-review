core_functions:
- molecular_function:
    id: GO:0003968
    label: RNA-directed RNA polymerase activity
  description: Synthesizes unprimed, 5'-triphosphorylated antisense secondary siRNAs (22G-RNAs) on target
    mRNA templates, plausibly pUG-tailed mRNA fragments, as part of an RdRP complex with DRH-3. In germ
    cells it acts in Mutator foci.
  locations:
  - id: GO:1990633
    label: mutator focus
  - id: GO:0005737
    label: cytoplasm
  directly_involved_in:
  - id: GO:0030422
    label: siRNA processing
  supported_by:
  - *id001
  - *id002
  - reference_id: PMID:32499657
    supporting_text: Together, these data show that the RdRP RRF-1 interacts with UG repeat RNAs
  - reference_id: PMID:21396820
    supporting_text: The secondary step involves the activity of the RdRP RRF-1 in the soma and involves
      the production of a much larger pool of approximately 22 nt, 5′-triphosphorylated small RNAs which
      are essential for effective gene silencing
suggested_questions:
- question: Does purified RRF-1 initiate synthesis directly on the pUG tail of a pUG-tailed RNA, as the
    UG-repeat binding data suggest, and what fixes the 22-nt product length?
- question: RRF-1 has three UniProtKB entries (G5ECM1, G3MU40, Q7JLA0). Should GO annotations be consolidated
    on the isoform a entry G5ECM1?
suggested_experiments:
- description: Reconstitute RRF-1 (with and without DRH-3/EKL-1) and test RdRP activity on pUG-tailed
    versus untailed mRNA fragments.
  hypothesis: pUG tails recruit RRF-1 and promote de novo initiation of 22G-RNA synthesis on the attached
    mRNA fragment.
