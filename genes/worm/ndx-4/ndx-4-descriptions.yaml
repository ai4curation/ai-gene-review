  text: The ndx-4 gene encodes a homodimeric diadenosine tetraphosphate (Ap(4)A) hydrolase
    that belongs to the NUDIX hydrolase family.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003581;class=Gene
