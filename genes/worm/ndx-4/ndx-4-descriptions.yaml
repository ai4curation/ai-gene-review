- source: Alliance_Automated
  text: Enables 5-phosphoribosyl 1-pyrophosphate pyrophosphatase activity and bis(5'-nucleosyl)-tetraphosphatase
    (asymmetrical) activity. Involved in nucleotide metabolic process. Human ortholog(s)
    of this gene implicated in intellectual disability. Orthologous to human NUDT2
    (nudix hydrolase 2).
