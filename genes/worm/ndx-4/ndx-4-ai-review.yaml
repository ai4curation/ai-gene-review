  - reference_id: PMID:11738085
    supporting_text: >-
      It hydrolyses Ap4A with a K(m) of 7 microM and k(cat) of 27 s(-1) producing AMP and
      ATP as products.
  - reference_id: PMID:12475970
    supporting_text: >-
      As expected for a Nudix hydrolase, the wild type k(cat) of 23 s(-1) was reduced by
      10(5)-, 10(3)-, and 30-fold, respectively, by replacement of the conserved
      P(4)-phosphate-binding catalytic residues Glu(56), Glu(52), and Glu(103) by Gln.
suggested_questions:
- question: >-
    What are the physiological consequences of loss of ndx-4 in C. elegans, and does
    Ap4A accumulate in ndx-4 mutants under stress?
- question: >-
    Where is NDX-4 expressed and localized (cytosol vs nucleus), given that Ap4A
    signalling roles in other animals involve both compartments?
suggested_experiments:
- description: >-
    Measure Ap4A/Ap3A levels by LC-MS in ndx-4 deletion mutants under heat, oxidative
    and genotoxic stress, and score stress survival, development and germline apoptosis.
- description: >-
    Generate an endogenous fluorescent knock-in of ndx-4 to determine tissue expression
    and subcellular localization.
