id: Q9U2M7
gene_symbol: ndx-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ndx-4 (Y37H9A.6) encodes the C. elegans asymmetrical diadenosine tetraphosphate (Ap4A)
  hydrolase, a small monomeric Nudix hydrolase and the nematode counterpart of animal
  Ap4A hydrolases such as human NUDT2. The enzyme hydrolyses Ap4A to AMP plus ATP
  (Km about 7-9 uM, kcat about 23-27 s-1) using divalent metal ions, and also cleaves
  other adenosine and diadenosine polyphosphates with four or more phosphates, always
  releasing ATP, but not Ap3A. Crystal structures of the free enzyme and an
  inhibitor complex, together with site-directed mutagenesis, define the Nudix-box
  glutamates (Glu52, Glu56, Glu103) as catalytic and show that substrate binding relies
  mainly on contacts with the P1 and P4 phosphates, implying a broad substrate range.
  In vitro the same active site also hydrolyses 5-phosphoribosyl 1-pyrophosphate (PRPP)
  to ribose 1,5-bisphosphate. Its physiological role is presumed to be control of
  intracellular Ap4A levels; no in vivo phenotype, expression or localization data
  have been reported for the worm gene.
