- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: TAS
  original_reference_id: PMID:11937063
  qualifier: involved_in
  review:
    summary: >-
      Traceable author statement from the crystal structure paper speculating that Ap4A
      hydrolase may influence apoptosis via the Ap3A/Ap4A ratio.
    action: REMOVE
    reason: >-
      The cited statement is explicitly hedged ("potentially") background reasoning in a
      structural paper; no experiment in this or any cited study links ndx-4 to
      apoptosis in C. elegans, and the hypothesis derives from cultured mammalian cell
      work on dinucleotide ratios rather than from the enzyme itself. A structural study
      cannot support a TAS for an organismal process of this kind.
    supported_by:
    - reference_id: PMID:11937063
      supporting_text: >-
        Ap(4)A hydrolase has a key role in regulating the intracellular Ap(4)A levels and
        hence potentially the cellular response to metabolic stress and/or
        differentiation and apoptosis via the Ap(3)A/Ap(4)A ratio.
    - reference_id: file:worm/ndx-4/ndx-4-deep-research-openscientist.md
      supporting_text: >-
        The signalling interpretation (F4, F7, F8) rests largely on mammalian/*Drosophila*
        orthologues and on reviews
