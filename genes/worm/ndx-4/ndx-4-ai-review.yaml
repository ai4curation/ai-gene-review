- term:
    id: GO:0019693
    label: ribose phosphate metabolic process
  evidence_type: IDA
  original_reference_id: PMID:12370170
  qualifier: involved_in
  review:
    summary: >-
      Based on in vitro hydrolysis of PRPP to ribose 1,5-bisphosphate by a panel of Nudix
      hydrolases including the C. elegans Ap4A hydrolase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PRPP activity was shown in vitro in a family-wide screen; the authors judged
      PRPP a significant substrate only for D. radiodurans DR2356 and the DIPP subfamily,
      not for the Ap4A hydrolases. There is no evidence that ndx-4 contributes to ribose
      phosphate metabolism in vivo, so a process annotation over-reaches.
    supported_by:
    - reference_id: PMID:12370170
      supporting_text: >-
        Comparison of the specificity constants for nucleotide, diphosphoinositol
        polyphosphate, and PRPP hydrolysis suggests that PRPP is a significant substrate
        for the D. radiodurans DR2356 enzyme and for the DIPP subfamily.
- term:
    id: GO:0043135
    label: 5-phosphoribosyl 1-pyrophosphate pyrophosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:12370170
  qualifier: enables
  review:
    summary: >-
      In vitro PRPP pyrophosphatase activity; active-site mutants of the C. elegans Ap4A
      hydrolase lacked it, showing it uses the same active site as Ap4A hydrolysis.
    action: KEEP_AS_NON_CORE
    reason: >-
      The activity was directly assayed (curators had the full text), so the MF is
      supported, but it is a secondary promiscuous activity; for the human Ap4A
      hydrolase orthologue the PRPP kcat is about 0.057 s-1 versus tens per second for
      Ap4A, and the authors did not propose PRPP as a significant substrate for this
      subfamily.
    supported_by:
    - reference_id: PMID:12370170
      supporting_text: >-
        Active site mutants of the Caenorhabditis elegans diadenosine tetraphosphate
        hydrolase had no activity, confirming that the same active site is responsible
        for nucleotide and PRPP hydrolysis.
    - reference_id: PMID:12370170
      supporting_text: >-
        All 11 enzymes that were active toward dinucleoside polyphosphates with 4 or more
        phosphate groups as substrates were also able to hydrolyze PRPP
    - reference_id: file:worm/ndx-4/ndx-4-deep-research-openscientist.md
      supporting_text: >-
        it should not be mistaken for NDX-4's principal physiological reaction
