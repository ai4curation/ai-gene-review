- id: PMID:11738085
  title: Cloning, characterisation and crystallisation of a diadenosine 5',5"'-P(1),P(4)-tetraphosphate
    pyrophosphohydrolase from Caenorhabditis elegans.
  findings:
  - statement: Recombinant ndx-4 is an asymmetrical Ap4A hydrolase producing AMP + ATP
      (Km 7 uM, kcat 27 s-1), active on other (di)adenosine polyphosphates with >=4
      phosphates but not Ap3A.
    supporting_text: >-
      It hydrolyses Ap4A with a K(m) of 7 microM and k(cat) of 27 s(-1) producing AMP and
      ATP as products.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical characterisation of ndx-4 (Y37H9A.6); cited as experimental evidence for FUNCTION and COFACTOR in UniProt Q9U2M7.
- id: PMID:11937063
  title: The crystal structure of diadenosine tetraphosphate hydrolase from Caenorhabditis
    elegans in free and binary complex forms.
  findings:
  - statement: Crystal structures (2.0 and 1.8 A) show a Nudix fold and explain
      specificity for tetraphosphates over triphosphates.
    supporting_text: >-
      These results suggest how the enzyme can catalyze the hydrolysis of a range of
      related dinucleoside tetraphosphate, but not triphosphate, compounds through
      precise orientation of key elements of the substrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural paper on ndx-4; its apoptosis statement is speculative background and does not support the TAS apoptotic process annotation.
- id: PMID:12370170
  title: Nudix hydrolases that degrade dinucleoside and diphosphoinositol polyphosphates
    also have 5-phosphoribosyl 1-pyrophosphate (PRPP) pyrophosphatase activity that
    generates the glycolytic activator ribose 1,5-bisphosphate.
  findings:
  - statement: The C. elegans Ap4A hydrolase active site also hydrolyses PRPP in vitro.
    supporting_text: >-
      Active site mutants of the Caenorhabditis elegans diadenosine tetraphosphate
      hydrolase had no activity, confirming that the same active site is responsible
      for nucleotide and PRPP hydrolysis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Family-wide in vitro screen; supports a secondary PRPP pyrophosphatase activity, not a physiological role.
- id: PMID:12475970
  title: Analysis of the catalytic and binding residues of the diadenosine tetraphosphate
    pyrophosphohydrolase from Caenorhabditis elegans by site-directed mutagenesis.
  findings:
  - statement: Glu52, Glu56 and Glu103 are catalytic; substrate binding depends mainly on
      P1 and P4 phosphate contacts, suggesting a broad substrate range.
    supporting_text: >-
      It is concluded that interactions with the P(1)- and P(4)-phosphates are minimum
      and sufficient requirements for substrate binding by this class of enzyme,
      indicating that it may have a much wider substrate range then previously believed.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mutagenesis of ndx-4 itself.
- id: file:worm/ndx-4/ndx-4-deep-research-openscientist.md
  title: OpenScientist deep research for ndx-4
  findings:
  - statement: Orthologue data place Ap4A hydrolase in the nucleus, but no direct C. elegans
      localisation data exist.
    supporting_text: >-
      This supports a nuclear site of action for Ap4A metabolism and, by inference, for
      NDX-4 (which lacks direct *C. elegans* localisation data).
