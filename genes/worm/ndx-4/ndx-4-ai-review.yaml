  review:
    summary: >-
      Process term inferred because AMP is one of the two products of Ap4A hydrolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      AMP is released as a by-product of degrading Ap4A, not as the purpose of a
      biosynthetic pathway; there is no evidence that ndx-4 contributes meaningfully to
      cellular AMP pools, which are dominated by de novo and salvage purine synthesis.
      The biologically informative process is diadenosine tetraphosphate catabolism
      (GO:0015967), which the gene already carries. Note the PAINT node is seeded only
      from ndx-4's own IDA, so this reflects the same product-based reasoning.
