  label: Caenorhabditis elegans
description: >-
  glc-4 encodes a Cys-loop glutamate-gated chloride channel subunit in
  Caenorhabditis elegans. The Q95QT7 protein has the canonical extracellular
  ligand-binding and four-pass transmembrane architecture of a
  neurotransmitter-gated ion channel, and genetic rescue data place GLC-4 with
  GLC-2 in an inhibitory glutamatergic receptor that acts on enteric-muscle
  plasma membranes downstream of DVB glutamate release.
