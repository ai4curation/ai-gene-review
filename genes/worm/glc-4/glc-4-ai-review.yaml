references:
- id: PMID:37811674
  title: UBR-1 ubiquitin ligase regulates the balance between GABAergic and glutamatergic
    signaling.
  findings:
  - statement: >-
      Li et al. identified GLC-2/GLC-4 as the enteric-muscle glutamate-gated
      chloride channel pair that mediates inhibitory glutamatergic signaling
      from the DVB motor neuron when glutamate tone is elevated.
    supporting_text: >-
      glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
      glutamate signals to inhibit DVB and enteric muscle activity
  - statement: >-
      The same study genetically separated GLC-3-mediated DVB autoinhibition
      from GLC-2/GLC-4-mediated enteric-muscle inhibition.
    supporting_text: >-
      removing either of the inhibitory glutamate-gated chloride channels
      (GluCl), GLC-3 in DVB and GLC-2/GLC-4 in intestinal muscles also rescue
      the expulsion defects
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary evidence for the native GLC-4 role in enteric-muscle
      inhibitory glutamatergic signaling. The paper does not purify native
      GLC-2/GLC-4 receptors or test GLC-4 alone in a heterologous expression
      system.
- id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
  title: PTHR18945 neurotransmitter-gated ion channel family review
  findings:
  - statement: >-
      The family review places C. elegans GLC proteins in the anion-selective
      GluCl/glycine-receptor lineage and flags the excitatory-channel IBA on
      PTN001055382 because inhibitory extracellular ligand-gated channel
      activity better fits this anion-selective branch.
    supporting_text: Anion-selective glycine receptor and invertebrate chloride-channel lineage
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Locally curated PTHR18945 review used to evaluate the PAINT
      plasma-membrane, chloride-transport and sign-wrong excitatory-channel IBA
      rows.
- id: file:worm/glc-4/glc-4-uniprot.txt
  title: C. elegans GLC-4 UniProt record
  findings:
