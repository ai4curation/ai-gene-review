suggested_questions:
- question: >-
    Is the native enteric-muscle receptor a GLC-2/GLC-4 heteromer, a mixture of
    GLC-2 and GLC-4 homomers, or a larger GluCl assembly containing additional
    subunits?
- question: >-
    Does GLC-4 act at a defined postsynaptic specialization opposite DVB
    glutamate release, or is it distributed more broadly over the
    enteric-muscle plasma membrane?
- question: >-
    Which Brugia, Onchocerca and Haemonchus GluCl paralogs are the direct
    orthologs or functional analogs of C. elegans glc-4 in ivermectin-sensitive
    circuits?
suggested_experiments:
- description: >-
    Endogenously tag GLC-4 and co-image it with GLC-2 plus presynaptic
    glutamate-release markers in enteric and anal depressor muscles.
  hypothesis: >-
    GLC-4 localizes with GLC-2 at enteric-muscle plasma-membrane domains that
    receive inhibitory glutamate from DVB.
- description: >-
    Reconstitute GLC-4 alone and in pairwise combinations with GLC-2 in oocytes
    or HEK293T cells and measure glutamate-, chloride- and
    ivermectin-dependent currents.
  hypothesis: >-
    GLC-4 contributes to a glutamate-gated chloride channel whose drug and
    agonist sensitivity differs from GLC-2 homomers and GLC-1/GLC-2
    heteromers.
