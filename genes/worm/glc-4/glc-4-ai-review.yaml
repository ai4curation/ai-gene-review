- term:
    id: GO:0008068
    label: extracellularly glutamate-gated chloride channel activity
  evidence_type: IC
  original_reference_id: PMID:37811674
  qualifier: contributes_to
  review:
    summary: Native GLC-4 contribution to the GLC-2/GLC-4 enteric-muscle GluCl.
    action: NEW
    reason: >-
      Core molecular function as a receptor subunit contribution. Li et al.
      placed both glc-2 and glc-4 reporters in enteric and anal depressor
      muscles, showed that loss of glc-4 suppresses the ubr-1 elevated-glutamate
      expulsion and enteric-muscle calcium defects, and showed that glutamate no
      longer inhibits enteric-muscle activity in glc-2; glc-4 double mutants.
      That evidence supports GLC-4 as a contributor to the native
      extracellularly glutamate-gated GLC-2/GLC-4 chloride-channel complex, not
      as an independently assayed homomeric channel.
    supported_by:
    - reference_id: PMID:37811674
      supporting_text: >-
        glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
        glutamate signals to inhibit DVB and enteric muscle activity
    consistency_exception:
      reason: >-
        GO currently places the glutamate-gated chloride channel term under the
        excitatory ligand-gated channel parent, but GLC-4 contributes to an
        anion-selective inhibitory channel. The child term is correct for this
        gene; the excitatory ancestor and the automated
        excitatory-postsynaptic-potential row are the claims being rejected.
