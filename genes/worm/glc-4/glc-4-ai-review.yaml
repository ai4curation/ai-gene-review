      The Q95QT7 TrEMBL entry links GLC-4 to WormBase WBGene00001594 and
      records the Cys-loop ligand-binding and transmembrane domains that define
      its receptor-channel architecture.
    supporting_text: "WormBase; C27H5.8; CE32152; WBGene00001594; glc-4."
    record_section:
    - DR:WormBase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Unreviewed but accession-resolving UniProt record used for the exact
      Q95QT7 sequence, domain predictions and WormBase cross-reference.
- id: file:worm/glc-4/glc-4-deep-research-wormbase.md
  title: WormBase gene description for glc-4
  findings:
  - statement: >-
      WormBase summarizes glc-4 as a predicted glutamate-gated chloride channel
      with ivermectin and reversal-behavior phenotypes.
    supporting_text: >-
      glc-4 encodes a predicted glutamate-gated chloride channel that affects
      ivermectin sensitivity and reversal behavior
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      The channel prediction agrees with InterPro and PAINT, but this brief
      uncited description does not name the primary evidence for ivermectin
      sensitivity, reversal behavior, the avr-14 genetic interaction, or
      neuronal expression. The present review therefore uses Li et al. for the
      native GLC-2/GLC-4 role.
