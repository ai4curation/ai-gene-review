    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: Accurate but limited to the PTZ convulsion and GABA vesicle RNAi
      phenotypes; no nuclear migration or dynein mechanism.
- source: Alliance_Automated
  text: Predicted to enable microtubule binding activity. Involved in GABAergic synaptic
    transmission; nuclear migration along microfilament; and synaptic vesicle transport.
    Located in nuclear envelope. Is expressed in several structures, including hypodermal
    cell; neurons; non-striated muscle; rectal valve cell; and tail hypodermis. Used
    to study epilepsy and lissencephaly. Human ortholog(s) of this gene implicated
    in lissencephaly 4 and microcephaly. Orthologous to several human genes including
    NDE1 (nudE neurodevelopment protein 1).
  source_type: automated
