gene_symbol: nud-2
organism: worm
uniprot_id: O45717
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Part of a complex with lis-1, which is recruited to the nuclear envelope by
    unc-83, where, in turn, it recruits dynein to the nuclear surface and regulates
    nuclear migration in hypodermal precursor cells (PubMed:20005871, PubMed:27697906).
    Plays a role in GABAergic synaptic vesicle localization in the ventral nerve cord
    (PubMed:16996038).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45717
  source_id: O45717
- source: Alliance_Imported
  text: nud-2 encodes an ortholog of human NDE1 and NDEL1, effectors of LIS1; NUD-2,
    along with other orthologs of LIS1-associated proteins (NUD-1, DHC-1, CDK-5, and
    CDKA-1), is required to prevent convulsions induced by exposure to the GABA antagonist
    pentylenetetrazole (PTZ); nud-2(RNAi), like RNAi of nud-1 et al., not only induces
    PTZ susceptibility but also causes GABA-containing synaptic vesicles in the ventral
    nerve cord to be distributed raggedly, and nud-2(RNAi) animals are abnormally
    susceptible to paralysis by the GABA agonist muscimol; nud-2(RNAi) phenotypes
    are dominantly enhanced by a heterozygous lis-1 allele, and nud-2(RNAi) delays
    the recovery from PTZ-induced paralysis of lis-1 heterozygotes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011230;class=Gene
  source_id: WB:WBGene00011230
- source: Alliance_Automated
  text: Predicted to enable microtubule binding activity. Involved in GABAergic synaptic
    transmission; nuclear migration along microfilament; and synaptic vesicle transport.
    Located in nuclear envelope. Is expressed in several structures, including hypodermal
    cell; neurons; non-striated muscle; rectal valve cell; and tail hypodermis. Used
    to study epilepsy and lissencephaly. Human ortholog(s) of this gene implicated
    in lissencephaly 4 and microcephaly. Orthologous to several human genes including
    NDE1 (nudE neurodevelopment protein 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011230;class=Gene
  source_id: WB:WBGene00011230
