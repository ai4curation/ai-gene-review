      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 5
    overall_notes: 'Cited: UNC-83 recruitment of NUD-2/LIS-1 to the nuclear envelope
      to recruit dynein in hyp7 nuclear migration; GABA vesicle localization. Omits
      kinetochore dynein role.'
- source: Alliance_Imported
  text: nud-2 encodes an ortholog of human NDE1 and NDEL1, effectors of LIS1; NUD-2,
    along with other orthologs of LIS1-associated proteins (NUD-1, DHC-1, CDK-5, and
    CDKA-1), is required to prevent convulsions induced by exposure to the GABA antagonist
    pentylenetetrazole (PTZ); nud-2(RNAi), like RNAi of nud-1 et al., not only induces
    PTZ susceptibility but also causes GABA-containing synaptic vesicles in the ventral
    nerve cord to be distributed raggedly, and nud-2(RNAi) animals are abnormally
    susceptible to paralysis by the GABA agonist muscimol; nud-2(RNAi) phenotypes
    are dominantly enhanced by a heterozygous lis-1 allele, and nud-2(RNAi) delays
    the recovery from PTZ-induced paralysis of lis-1 heterozygotes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011230;class=Gene
  source_id: WB:WBGene00011230
