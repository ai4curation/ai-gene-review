descriptions:
- source: UniProt
  text: Part of a complex with lis-1, which is recruited to the nuclear envelope by
    unc-83, where, in turn, it recruits dynein to the nuclear surface and regulates
    nuclear migration in hypodermal precursor cells (PubMed:20005871, PubMed:27697906).
    Plays a role in GABAergic synaptic vesicle localization in the ventral nerve cord
    (PubMed:16996038).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45717
  source_id: O45717
  review:
