    label: cytoskeletal motor regulator activity
  evidence_type: IMP
  original_reference_id: PMID:29192061
  review:
    summary: NUD-2 sustains dynein, dynactin and LIS-1 at kinetochores and supports dynein function when
      LIS-1 is limiting.
    action: NEW
    reason: 'NUD-2''s molecular role is regulation of dynein via LIS-1 (the module''s NudE-family function,
      GO:0140659): its loss reduces kinetochore dynein and is synthetic lethal with partial LIS-1 depletion.
      Direct biochemical demonstration in worm is lacking, so the term is supported by genetic and localization
      data plus family conservation.'
