      supporting_text: Our results reveal that both NUD-2 and RZZ-Spindly are essential for dynein function
        at kinetochores
    - reference_id: file:worm/nud-2/nud-2-deep-research-falcon.md
      supporting_text: Loss of NUD-2 reduced kinetochore-associated dynein heavy chain DHC-1 to **52±8%
        of control**, LIS-1 to **65±13%**, and dynactin p50/DNC-2 to **62±8%**
