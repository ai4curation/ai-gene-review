- term:
    id: GO:0031022
    label: nuclear migration along microfilament
  evidence_type: IMP
  original_reference_id: PMID:20005871
  qualifier: involved_in
  review:
    summary: nud-2 mutant hyp7 nuclear migration defect, annotated as nuclear migration along microfilament.
    action: MODIFY
    reason: The phenotype is sound, but the cited paper places NUD-2 in the dynein pathway acting with
      kinesin-1 at the UNC-83 KASH protein, i.e. a microtubule-motor-driven migration; nothing in the
      paper implicates NUD-2 in actin-based movement. (Actin networks contribute to P-cell nuclear migration
      through constrictions, PMID:27697906, but NUD-2's role there is through dynein.) The appropriate
      term is nuclear migration along microtubule.
    proposed_replacement_terms:
    - id: GO:0030473
      label: nuclear migration along microtubule
    additional_reference_ids:
    - PMID:27697906
    supported_by:
    - reference_id: PMID:20005871
      supporting_text: These data are consistent with the hypothesis that BICD-1 and NUD-2 function through
        dynein to regulate hyp7 nuclear migration.
    - reference_id: PMID:27697906
      supporting_text: Both motors function in P-cell nuclear migration, but dynein, functioning through
        UNC-83, plays a more central role as nuclei migrate towards minus ends of polarized microtubule
        networks.
