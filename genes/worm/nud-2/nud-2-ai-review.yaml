core_functions:
- description: 'Dynein regulator at the nuclear envelope: recruited by the KASH protein UNC-83 through
    its C terminus, NUD-2 with LIS-1 engages dynein to move nuclei toward microtubule minus ends during
    hyp7 precursor and P-cell nuclear migration, in parallel with BICD-1/EGAL-1.'
  molecular_function:
    id: GO:0140659
    label: cytoskeletal motor regulator activity
  directly_involved_in:
  - id: GO:0030473
    label: nuclear migration along microtubule
  locations:
  - id: GO:0005635
    label: nuclear envelope
  supported_by:
  - reference_id: PMID:20005871
    supporting_text: These data demonstrate that UNC-83 recruits NUD-2 to the nuclear envelope through
      a direct interaction in vivo.
  - reference_id: PMID:20005871
    supporting_text: These data are consistent with the hypothesis that BICD-1 and NUD-2 function through
      dynein to regulate hyp7 nuclear migration.
- description: 'Kinetochore dynein regulator: recruited by the CENP-F-like proteins HCP-1/HCP-2, NUD-2
    maintains dynein, dynactin and LIS-1 at kinetochores, promoting timely load-bearing kinetochore-microtubule
    attachment and faithful chromosome segregation in the embryo.'
  molecular_function:
    id: GO:0140659
    label: cytoskeletal motor regulator activity
  directly_involved_in:
  - id: GO:0007059
    label: chromosome segregation
  locations:
  - id: GO:0000776
    label: kinetochore
  supported_by:
  - reference_id: PMID:29192061
    supporting_text: This facilitates functional characterization of kinetochore-localized NUD-2, which
      is recruited by the CENP-F-like proteins HCP-1 and HCP-2 independently of RZZ-Spindly and dynein-LIS-1.
  - reference_id: PMID:29192061
    supporting_text: Kinetochore dynein levels are reduced in Δnud-2 embryos, and, as occurs upon RZZ
      inhibition, loss of NUD-2 delays the formation of load-bearing kinetochore-microtubule attachments
      and causes chromatin bridges in anaphase.
suggested_questions:
- question: Does NUD-2 bind dynein intermediate chain directly in C. elegans (as NDEL1/Ndl1 do), and is
    its N-terminal coiled coil required for kinetochore and nuclear-envelope dynein function?
  experts:
  - C. elegans cell biologists
  - dynein biochemists
suggested_experiments:
- description: Separation-of-function nud-2 alleles lacking the UNC-83-binding C terminus versus the LIS-1-binding
    coiled coil, scored for hyp7/P-cell nuclear migration and kinetochore dynein levels.
  hypothesis: NUD-2 acts as a site-specific LIS-1-dynein recruitment module whose C terminus reads out
    location (UNC-83, HCP-1/2) and whose coiled coil engages LIS-1/dynein.
  experiment_type: genetics with live imaging
