  - PANTHER:PTN000100519
  - RGD:621235
  review:
    summary: PAINT IBA kinesin complex (rat Ndel1 donor).
    action: REMOVE
    reason: NudE-family proteins regulate dynein and are not kinesin subunits; the rat source describes
      Ndel1 as kinesin-1 cargo (removed in the human NDE1/NDEL1 reviews). In worm hyp7 nuclear migration,
      kinesin-1 (KLC-2) and NUD-2 bind separate domains of UNC-83, so NUD-2 is not part of the kinesin
      complex.
