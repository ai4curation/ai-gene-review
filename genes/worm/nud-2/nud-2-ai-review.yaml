id: O45717
gene_symbol: nud-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: NUD-2 (R11A5.2) is the sole Caenorhabditis elegans NudE/NUDEL-family protein, a 293-residue
  dynein cofactor with an N-terminal coiled coil and a C-terminal helical region, and the worm counterpart
  of NDE1/NDEL1, Aspergillus NudE and yeast Ndl1. It forms a complex with LIS-1 and supports cytoplasmic
  dynein function at specific sites rather than being required for all dynein activities. During larval
  nuclear migrations in hyp7 precursors and P cells, the outer-nuclear-membrane KASH protein UNC-83 binds
  the extreme C terminus of NUD-2 and recruits it to the nuclear envelope, where the NUD-2/LIS-1 module
  acts in parallel with a BICD-1/EGAL-1/DLC-1 module to engage dynein, which moves nuclei toward microtubule
  minus ends together with kinesin-1. In the early embryo, NUD-2 is recruited to mitotic kinetochores
  by the CENP-F-like proteins HCP-1 and HCP-2, independently of RZZ-Spindly and dynein, and sustains kinetochore
  dynein, dynactin and LIS-1, promoting timely formation of load-bearing kinetochore-microtubule attachments
  and faithful chromosome segregation. NUD-2 is largely dispensable for centrosome separation, pronuclear
  migration and spindle positioning in the zygote but becomes essential when LIS-1 levels are reduced.
  RNAi of nud-2 and other LIS1-pathway genes also perturbs GABAergic synaptic vesicle distribution and
  increases convulsion susceptibility.
