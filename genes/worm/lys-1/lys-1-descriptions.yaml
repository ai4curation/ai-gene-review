- source: Alliance_Imported
  text: lys-1 encodes a putative lysozyme, whose overexpression increasesresistance
    to infection by Serratia marcescens; lys-1(RNAi) animals havenormal resistance
    to S. marcescens, perhaps because of geneticredundancy with the LYS-1 paralogs
    LYS-2 to -8 and LYS-10; in uninfectedanimals, LYS-1 is expressed in the intestine
    and in IL1/IL2 neurons,along with a few unidentified head neurons; in intestinal
    cells, LYS-1localizes to apical vesicles; LYS-1 expression is induced by infectionby
    Pseudomonas aeruginosa but not S. marcescens; LYS-1 expression ispromoted by DBL-1,
    TIR-1 and NSY-1, and perhaps also by ELT-2, but notby DAF-16; LYS-1 and its paralogs
    are more similar to lysozymes from theamoeboid protozoon Entamoeba histolytica
    than to more familiar ones fromvertebrates.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003090;class=Gene
