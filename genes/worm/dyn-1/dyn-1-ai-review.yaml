      - statement: GTP-binding mutants lose hydrolysis.
        supporting_text: As expected for mutant DYN-1 molecules that are severely defective for GTP binding,
          DYN-1(G40E) and DYN-1(K46A) displayed greatly reduced GTP hydrolysis activities in comparison
