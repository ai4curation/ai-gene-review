suggested_questions:
  - question: Is DYN-1 required for the clathrin-independent ultrafast endocytosis step at the C. elegans
      neuromuscular junction, for the later clathrin-dependent budding of vesicles from synaptic endosomes,
      or for both?
  - question: Which SH3 partner (SDPN-1, ITSN-1, UNC-57 or LST-4) recruits DYN-1 to the presynaptic endocytic
      zone, and is that recruitment separable from its phagosomal recruitment by LST-4?
suggested_experiments:
  - description: Flash-and-freeze electron microscopy of dyn-1(ky51) neuromuscular junctions shifted to
      the restrictive temperature immediately before optogenetic stimulation, scoring pits, large vesicles
      and coated intermediates over 20 ms to 10 s.
    hypothesis: Dynamin severs both the ultrafast endocytic pit at the plasma membrane and the clathrin-coated
      buds on synaptic endosomes.
