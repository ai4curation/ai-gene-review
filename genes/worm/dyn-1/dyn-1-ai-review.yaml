id: P39055
gene_symbol: dyn-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'DYN-1 is the single classical dynamin of Caenorhabditis elegans, a large GTPase with an
  N-terminal GTPase domain, middle domain, pleckstrin-homology lipid-binding domain, GTPase effector domain
  and C-terminal proline-rich domain. Purified DYN-1 hydrolyses GTP, and negatively charged lipids stimulate
  its activity to the level of rat dynamin; self-assembly on membranes and GTP hydrolysis together set
  its residence on target membranes. Its core role is membrane fission: it pinches clathrin-coated vesicles
  from the plasma membrane, so that the temperature-sensitive GTPase-domain mutant dyn-1(ky51) is a shibire-like
  reversible paralytic with blocked synaptic vesicle recycling, yolk endocytosis by oocytes and coelomocyte
  uptake. DYN-1 is concentrated at synapses, on the apical membrane of intestinal cells and at the periciliary
  membrane of sensory neurons. In engulfing cells it is recruited to pseudopods and nascent phagosomes
  downstream of the CED-1/CED-6/CED-7 receptor pathway, where it recruits the PI3-kinase VPS-34 and the
  GTPases RAB-5 and RAB-7 to drive phagosome maturation and degradation of apoptotic corpses; its proline-rich
  domain binds SH3 proteins such as the sorting nexin LST-4 and syndapin SDPN-1. DYN-1 also localizes
  to cleavage furrows and the midbody and is needed for late cytokinesis, and its endocytic activity contributes
  to the execution of necrotic neurodegeneration.'
