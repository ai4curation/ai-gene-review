      - statement: DYN-1::GFP enriched on apical intestinal surfaces.
        supporting_text: Interestingly, the level of enrichment of DYN-1(G40E)::GFP signal on apical surfaces
          of intestinal cells is higher than that of DYN-1::GFP (Figure 7, A and C), suggesting that either
          DYN-1(G40E) displays a higher affinity to target membrane than DYN-1 or that it does not dissociate
          from the target membranes efficiently.
      - statement: Membrane fission activity requires GTP hydrolysis.
        supporting_text: Alternatively, the membrane fission activity of DYN-1, which requires GTP hydrolysis,
          might act on the surface of intracellular membranes to generate sufficient amount of intracellular
