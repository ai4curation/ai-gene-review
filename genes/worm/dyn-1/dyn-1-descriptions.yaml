- source: Alliance_Automated
  text: Enables GTPase activity. Involved in several processes, including embryo development;
    endocytosis; and necroptotic process. Located in several cellular components,
    including cleavage furrow; periciliary membrane compartment; and pseudopodium.
    Is expressed in several structures, including hermaphrodite gonad; hypodermis;
    nervous system; pharynx; and rectal valve cell. Used to study early infantile
    epileptic encephalopathy. Human ortholog(s) of this gene implicated in Charcot-Marie-Tooth
    disease dominant intermediate B; centronuclear myopathy 1; developmental and epileptic
    encephalopathy 31A; developmental and epileptic encephalopathy 31B; and lethal
    congenital contracture syndrome 5. Orthologous to human DNM1 (dynamin 1); DNM2
    (dynamin 2); and DNM3 (dynamin 3).
