descriptions:
- source: UniProt
  text: Microtubule-associated force-producing protein involved in producing microtubule
    bundles and able to bind and hydrolyze GTP. Most probably involved in vesicular
    trafficking processes, in particular endocytosis (By similarity). Required for
    coelomocyte endocytosis (PubMed:20803083). Involved in apoptotic cell phagocytosis
    (PubMed:21490059). Required for recruitment of phosphatidylinositol 3- kinase
    piki-1 to phagosomes (PubMed:22272187). May play a role in rab-5 recruitment to
    cell-corpses-containing phagosomes but not to endosomes (PubMed:18425118). Required
    for embryonic and larval development (PubMed:20803083, PubMed:21490059, PubMed:9294229).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39055
  source_id: P39055
