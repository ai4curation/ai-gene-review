gene_symbol: dyn-1
organism: worm
uniprot_id: P39055
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Microtubule-associated force-producing protein involved in producing microtubule
    bundles and able to bind and hydrolyze GTP. Most probably involved in vesicular
    trafficking processes, in particular endocytosis (By similarity). Required for
    coelomocyte endocytosis (PubMed:20803083). Involved in apoptotic cell phagocytosis
    (PubMed:21490059). Required for recruitment of phosphatidylinositol 3- kinase
    piki-1 to phagosomes (PubMed:22272187). May play a role in rab-5 recruitment to
    cell-corpses-containing phagosomes but not to endosomes (PubMed:18425118). Required
    for embryonic and larval development (PubMed:20803083, PubMed:21490059, PubMed:9294229).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39055
  source_id: P39055
- source: Alliance_Imported
  text: dyn-1 encodes the C. elegans ortholog of the dynamin GTPase; dyn-1 activity
    is required for endocytosis, synaptic vesicle recycling, cytokinesis, and the
    CED-1 pathway that regulates engulfment and degradation of apoptotic cells; mutations
    in dyn-1 affect locomotion, egg-laying, defecation, and embryonic development,
    indicating that dyn-1's endocytic function is required for a number of diverse
    processes; dyn-1 reporter fusion constructs are expressed in motor neurons, intestinal
    cells, and pharyngeal muscle.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001130;class=Gene
  source_id: WB:WBGene00001130
- source: Alliance_Automated
  text: Enables GTPase activity. Involved in several processes, including embryo development;
    endocytosis; and necroptotic process. Located in several cellular components,
    including cleavage furrow; periciliary membrane compartment; and pseudopodium.
    Is expressed in several structures, including hermaphrodite gonad; hypodermis;
    nervous system; pharynx; and rectal valve cell. Used to study early infantile
    epileptic encephalopathy. Human ortholog(s) of this gene implicated in Charcot-Marie-Tooth
    disease dominant intermediate B; centronuclear myopathy 1; developmental and epileptic
    encephalopathy 31A; developmental and epileptic encephalopathy 31B; and lethal
    congenital contracture syndrome 5. Orthologous to human DNM1 (dynamin 1); DNM2
    (dynamin 2); and DNM3 (dynamin 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001130;class=Gene
  source_id: WB:WBGene00001130
