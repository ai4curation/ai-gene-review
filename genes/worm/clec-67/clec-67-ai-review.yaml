core_functions:
- description: >-
    Secreted, intestinally expressed C-type lectin-like protein whose expression is
    induced by bacterial pathogens under ELT-2 control and whose loss increases
    susceptibility to virulent S. maltophilia. Its molecular activity is unknown:
    the CTLD is non-canonical and carbohydrate binding has not been tested, so no
    molecular function term is asserted.
  supported_by:
  - reference_id: PMID:17183709
    supporting_text: when elt-2 expression is ablated by RNAi, clec-67 is downregulated
      compared to vector control, indicating that ELT-2 regulates the expression of this
      effector of C. elegans immunity to S. enterica
  - reference_id: PMID:30177956
    supporting_text: Mutations in cpr-4, mpk-2, lys-6, clec-67, and C48B4.1 caused
      hyper-susceptibility to JCMS but did not have a statistically significant survival
      phenotype on K279a
  - reference_id: file:worm/clec-67/clec-67-uniprot.txt
    record_section: ["FT:SIGNAL"]
    supporting_text: SIGNAL          1..17
  knowledge_gaps:
  - gap_statement: The molecular activity and ligand of CLEC-67 are unknown; it is not
      known whether the non-canonical CTLD binds glycans, microbial surfaces or host
      molecules, or what the DUF7154 region does.
    boundary: The protein is predicted to be secreted, is expressed in the intestine,
      is induced by pathogens under ELT-2 control, and its loss increases susceptibility
      to virulent S. maltophilia.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:30177956
      supporting_text: If lectins are in fact involved in pathogen recognition as postulated
suggested_questions:
- question: Does the clec-67(ok2770) hypersusceptibility to S. maltophilia JCMS reflect
    a direct effector role of the secreted protein (e.g. microbial binding or
    agglutination), and would that justify a defense-response process annotation, or
    is clec-67 only a marker of the response?
- question: Is clec-67 actually listed among the pek-1- or ire-1-dependent UPR genes in
    the supplementary tables of PMID:16184190, and should WormBase retain the
    protein folding chaperone IC row inferred from that expression?
suggested_experiments:
- description: Express recombinant CLEC-67 and test binding to glycan arrays and to
    intact S. maltophilia, S. enterica and E. coli cells, with and without calcium,
    to determine whether the non-canonical CTLD binds carbohydrate or bacteria.
  experiment_type: biochemical binding assay
- description: Rescue the clec-67(ok2770) S. maltophilia survival defect with an
    intestinal clec-67 transgene, and test a signal-peptide-deleted version to ask
    whether secretion is required for protection.
  experiment_type: genetic rescue / survival assay
