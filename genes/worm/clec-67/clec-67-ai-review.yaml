id: Q8ITX4
gene_symbol: clec-67
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  clec-67 (F56D6.2) encodes a 467-residue predicted secreted protein (N-terminal
  signal peptide) with a single C-type lectin-like domain and a region matched by
  the DUF7154 family; it belongs to a nematode-expanded C-type lectin family. The
  lectin domain is non-canonical: it carries three rather than four conserved
  cysteines and none of the EPN, QPD or WND motifs that mediate calcium-dependent
  sugar binding in classical C-type lectins, so whether it binds carbohydrate is
  unknown. clec-67 is expressed in the intestine and is a widely used
  transcriptional marker of the intestinal innate immune response: it is induced
  by Salmonella enterica, Stenotrophomonas maltophilia, ionizing radiation and
  immunostimulatory extracts, and its expression depends on the intestinal GATA
  transcription factor ELT-2. A clec-67 deletion mutant is hypersusceptible to a
  virulent S. maltophilia strain, suggesting a contribution to antibacterial
  defense, but no biochemical activity of the protein has been demonstrated. Its
  transcript is also reported among genes induced during the unfolded protein
  response.
existing_annotations:
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0044183
  review:
    summary: Electronic inference from the protein folding chaperone (GO:0044183)
      IC row via the inter-ontology link; it inherits that row's basis and adds
      no independent evidence.
    action: REMOVE
    reason: >-
      This row is derived mechanically from the WormBase IC annotation to protein
      folding chaperone, which itself rests only on clec-67 being transcriptionally
      induced during ER stress. CLEC-67 is a secreted C-type lectin-like protein
      with no chaperone, foldase or other protein-folding domain, and no study has
      tested a folding role. Since the source MF claim is unsupported (see the
      GO:0044183 row), the propagated process claim is removed with it.
    supported_by:
    - reference_id: file:worm/clec-67/clec-67-bioinformatics/RESULTS.md
      supporting_text: no catalytic or chaperone-like domain signature (e.g. HSP70,
        HSP90, small HSP, PDI thioredoxin, calnexin/calreticulin) is listed among
        its InterPro/Pfam/SMART cross-references
- term:
    id: GO:0030246
    label: carbohydrate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000415793
  review:
    summary: UniRule transfer of carbohydrate binding based on the C-type lectin
      domain (PROSITE PS50041, residues 27-144).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The C-type lectin-like domain is real, but it is non-canonical. UniProt's own
      ProRule check flags that the domain lacks conserved residues needed to
      propagate feature annotation, and our motif scan finds only three of the
      four disulfide-forming cysteines and none of the EPN, QPD or WND
      calcium/sugar-recognition motifs. Many nematode CTLD proteins lack these
      motifs and their ligands (if any) are unknown; carbohydrate binding by
      CLEC-67 has never been tested. The row is therefore a family-level default
      rather than a supported activity, and is flagged rather than removed because
      non-canonical CTLDs can still bind glycans.
    supported_by:
    - reference_id: file:worm/clec-67/clec-67-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: 'CAUTION: Lacks conserved residue(s) required for the propagation
        of feature annotation.'
    - reference_id: file:worm/clec-67/clec-67-bioinformatics/RESULTS.md
      supporting_text: None of the canonical calcium-dependent sugar-binding motifs
        (EPN for mannose-type, QPD for galactose-type, WND calcium ligand) is present.
- term:
    id: GO:0036499
    label: PERK-mediated unfolded protein response
  evidence_type: HEP
  original_reference_id: PMID:16184190
  qualifier: involved_in
  review:
    summary: WormBase HEP annotation from the Shen et al. 2005 UPR microarrays, in
      which a subset of tunicamycin-induced (i-UPR) genes required pek-1 for maximal
      induction; clec-67 is presumably listed in the supplementary table of
      pek-1-dependent genes (not cached; not named in the main text).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The expression pattern reported is that clec-67 transcription is induced in a
      PEK-1-dependent manner during ER stress, which makes it an output (target) of
      the PERK branch rather than a component that executes the response. A
      secreted lectin-like protein has no known role in sensing unfolded proteins,
      eIF2alpha phosphorylation or the downstream transcriptional program. We defer
      to the curator on the expression data itself (the supplementary table was not
      available to us) but flag the process claim as an over-annotation, consistent
      with how other UPR-target rows from this paper (e.g. nsf-1, snap-1) were
      handled. clec-67 is far better known as a pathogen-induced intestinal gene.
    supported_by:
    - reference_id: PMID:16184190
      supporting_text: approximately 23% (47 out of 202) of i-UPR genes require pek-1
        for maximal induction (see Figure 3A; Table S2).
- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IC
  original_reference_id: PMID:16184190
  qualifier: enables
  supporting_entities:
  - GO:0036498
  review:
    summary: WormBase IC inferring chaperone activity from clec-67 being an
      IRE1-pathway (GO:0036498) UPR-induced gene in Shen et al. 2005.
    action: REMOVE
    reason: >-
      Being transcriptionally induced by the UPR does not imply that a protein is a
      folding chaperone; the UPR induces lipid-metabolism, ERAD, trafficking and
      many uncharacterized genes as well as chaperones. CLEC-67 is a secreted
      C-type lectin-like protein with a non-canonical CTLD and a DUF7154 region; it
      has no chaperone domain and no folding or holdase activity has been tested.
      Unlike the ER lectin chaperones calnexin and calreticulin, C-type lectins are
      not part of the ER folding machinery. The curator inference is therefore not
      supported on biological grounds and should be withdrawn.
    supported_by:
    - reference_id: file:worm/clec-67/clec-67-bioinformatics/RESULTS.md
      supporting_text: no catalytic or chaperone-like domain signature (e.g. HSP70,
        HSP90, small HSP, PDI thioredoxin, calnexin/calreticulin) is listed among
        its InterPro/Pfam/SMART cross-references
    - reference_id: PMID:16184190
      supporting_text: For uncharacterized worm genes, functions were inferred based
        on their mammalian or yeast homologs.
    - reference_id: file:worm/clec-67/clec-67-deep-research-manual.md
      supporting_text: There is no evidence for chaperone activity or for direct participation
    source_defects:
    - defect_type: WRONG_TERM
      resource: WORMBASE
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0044183
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        IC annotation of clec-67 (F56D6.2, WBGene00018971) to protein folding
        chaperone (GO:0044183) from PMID:16184190, inferred from GO:0036498. The
        paper only reports UPR-dependent induction of the transcript; clec-67
        encodes a secreted C-type lectin-like protein with no chaperone domain and
        no tested folding activity. Induction by the UPR is not evidence of
        chaperone activity. Please consider deleting this row (the derived
        GO_REF:0000108 protein folding IEA would then drop with it).
