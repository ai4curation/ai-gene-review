  review:
    summary: IBA from the LATS PAINT node (seeded by mouse Lats2 and human LATS2) placing G1/S transition
      of mitotic cell cycle.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The PAINT node is sound for vertebrate LATS2, but there is target-specific evidence that
      the C. elegans lineage does not use WTS-1 in cell-cycle control: the wts-1 mutant phenotype is not
      caused by proliferation defects, UniProt curators record no proliferation role, and C. elegans lacks
      Hippo overgrowth phenotypes. WTS-1 output in the worm is repurposed to non-proliferative epithelial
      and neuronal functions.'
    supported_by:
    - &id011
      reference_id: PMID:19605499
      supporting_text: The wts-1 phenotype was not caused by cell proliferation or apoptosis defects.
    - &id012
      reference_id: file:worm/wts-1/wts-1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Does not appear to regulate apoptosis and proliferation
    - &id015
      reference_id: PMID:41746831
      supporting_text: classical Hippo phenotypes such as tissue overgrowth are absent
    - &id013
      reference_id: file:worm/wts-1/wts-1-deep-research-manual.md
      supporting_text: No evidence that WTS-1 controls cell proliferation, G1/S transition or apoptosis
        in C. elegans
