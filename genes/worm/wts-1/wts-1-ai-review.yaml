core_functions:
- description: AGC (NDR/LATS) serine/threonine kinase that binds YAP-1 via N-terminal PPxY motifs and
    represses YAP-1 nuclear accumulation and YAP-1/EGL-44 (TEAD) output, acting in hippo signaling; in
    the intestine it is located at the subapical cortex.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0035329
    label: hippo signaling
  - id: GO:0042308
    label: negative regulation of protein import into nucleus
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:worm/wts-1/wts-1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Phosphorylates yap-1 which may negatively regulate yap-1 nuclear localization
  - reference_id: PMID:31358532
    supporting_text: WTS-1 bound directly to YAP-1 and inhibited its nuclear accumulation in intestinal
      cells.
  - reference_id: PMID:41746831
    supporting_text: Upon WTS-1 loss, endogenous YAP-1 translocated from cytosol to nucleus in the epithelium
      and intestine.
  - reference_id: PMID:19605499
    supporting_text: WTS-1, the C. elegans Lats homolog, localized primarily to the subapical region in
      the intestine.
- description: Binds the transcriptional coactivator YAP-1 (WTS-1 N-terminus to YAP-1 WW domain), recruiting
    its substrate.
  molecular_function:
    id: GO:0001223
    label: transcription coactivator binding
  supported_by:
  - reference_id: file:worm/wts-1/wts-1-uniprot.txt
    record_section:
    - CC:SUBUNIT
    supporting_text: Interacts (via N-terminus) with yap-1 (via WW domain).
  - reference_id: PMID:31358532
    supporting_text: WTS-1 bound GST fused YAP-1, but not GST alone; this result indicates that WTS-1
      interacts directly with YAP-1
suggested_questions:
- question: Which kinase activates intestinal WTS-1, given that CST-1/2 (Hippo/MST) are dispensable there,
    and is phosphorylation of the T863 hydrophobic motif required?
- question: Does WTS-1 phosphorylate YAP-1 directly in vitro, and on which residues, given that the C.
    elegans YAP-1 HXRXXS sites diverge from mammalian YAP?
- question: Is the reported sorting-endosome localization of WTS-1 (PMID:34817059) independent of its
    subapical cortical pool, and should sorting endosome be annotated once confirmed by a second line
    of evidence?
- question: Should the PAINT LATS node carrying G1/S transition, regulation of organ growth and positive
    regulation of apoptotic process be restricted to exclude the nematode lineage, given the negative
    phenotype data in C. elegans?
suggested_experiments:
- description: In vitro kinase assay with purified WTS-1 (wild type, kinase-dead D625A or K531A, and T863A)
    and recombinant YAP-1, followed by phosphosite mapping.
  hypothesis: WTS-1 directly phosphorylates YAP-1 on conserved serines, and this requires catalytic activity
    and hydrophobic-motif phosphorylation.
- description: Rescue wts-1(ok753) with intestinal kinase-dead WTS-1 versus wild type to test whether
    larval survival and YAP-1 cytoplasmic retention require catalytic activity or only YAP-1 binding.
  hypothesis: Kinase activity, not only PPxY-mediated sequestration, is required for WTS-1 to restrain
    YAP-1.
