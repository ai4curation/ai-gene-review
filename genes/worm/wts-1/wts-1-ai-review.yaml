- id: PMID:19605499
  title: Lats kinase is involved in the intestinal apical membrane integrity in the nematode Caenorhabditis
    elegans.
  findings:
  - statement: WTS-1 localizes to the subapical region of intestinal cells.
    supporting_text: WTS-1, the C. elegans Lats homolog, localized primarily to the subapical region in
      the intestine.
  - statement: wts-1 loss causes early larval arrest and intestinal lumen defects not attributable to
      proliferation or apoptosis.
    supporting_text: The wts-1 phenotype was not caused by cell proliferation or apoptosis defects.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; abstract verified against PubMed. Primary characterization of
      wts-1 mutant intestinal phenotype and localization.
- id: PMID:19737560
  title: Ce-wts-1 plays important roles in Caenorhabditis elegans development.
  findings:
  - statement: Ce-wts-1 null causes L1 lethality; RNAi reveals pleiotropic developmental roles.
    supporting_text: The null allele of Ce-wts-1 causes L1 lethality.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; abstract verified against PubMed.
- id: PMID:23396260
  title: Yes-associated protein homolog, YAP-1, is involved in the thermotolerance and aging in the nematode
    Caenorhabditis elegans.
  findings:
  - statement: wts-1 knockdown causes nuclear accumulation of YAP-1.
    supporting_text: wts-1 (LATS ortholog) and ftt-2 (14-3-3 ortholog) knockdowns cause nuclear accumulation
      of YAP-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Source of IPI (YAP-1 binding) and IMP (kinase, nuclear import)
      rows; UniProt FUNCTION/SUBUNIT also derive from it.
- id: PMID:12213836
  title: The CeCDC-14 phosphatase is required for cytokinesis in the Caenorhabditis elegans embryo.
  findings:
  - statement: RNAi of T20F10.1 (wts-1), a putative Dbf2p homologue, causes F1 arrest at the L1 stage;
      no embryonic cytokinesis role was found.
    supporting_text: Depletion of the ORF T20F10.1, one of the putative Dbf2p homologues, caused the offspring
      of injected worms to arrest at an early larval stage (L1).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Paper is about CDC-14; wts-1 appears only as ORF T20F10.1 in an RNAi
      survey of MEN/SIN homologues (Table I). Earliest wts-1 loss-of-function phenotype; not cited by
      GOA.
- id: PMID:31358532
  title: The Hippo Pathway Is Essential for Maintenance of Apicobasal Polarity in the Growing Intestine
    of Caenorhabditis elegans.
  findings:
  - statement: WTS-1 binds YAP-1 directly and inhibits its nuclear accumulation in intestine.
    supporting_text: WTS-1 bound directly to YAP-1 and inhibited its nuclear accumulation in intestinal
      cells.
  - statement: WTS-1 is restricted to the subapical region of intestinal cells.
    supporting_text: Normally, WTS-1 is present only at the subapical region of intestinal cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Suppressor screen establishing NFM-1-WTS-1-YAP-1-EGL-44 pathway; GST
      pull-down of WTS-1 with YAP-1.
- id: PMID:41746831
  title: Canonical and noncanonical Hippo signaling in C. elegans.
  findings:
  - statement: Endogenous YAP-1 moves to the nucleus on WTS-1 loss; intestinal WTS-1 is required past
      L2.
    supporting_text: Upon WTS-1 loss, endogenous YAP-1 translocated from cytosol to nucleus in the epithelium
      and intestine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (2026). Endogenous tagged YAP-1, AID degradation of WTS-1, CST-1/2 dependency
      in epithelium only.
- id: PMID:40178516
  title: Neuroprotective role of Hippo signaling by microtubule stability control in Caenorhabditis elegans.
  findings:
  - statement: wts-1 loss causes premature touch-neuron deformation dependent on yap-1 and egl-44.
    supporting_text: Loss of wts-1 leads to premature decline of TRNs both in structure and function,
      and downstream effectors, yap-1 and egl-44, are required in this phenomenon.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Neuronal maintenance phenotype; supports YAP-1/EGL-44 as WTS-1 effectors
      outside intestine.
