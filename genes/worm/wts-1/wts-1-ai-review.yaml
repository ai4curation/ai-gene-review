id: O45797
gene_symbol: wts-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: wts-1 encodes the sole Caenorhabditis elegans ortholog of Drosophila Warts and mammalian
  LATS1/2, an NDR/LATS-subfamily AGC serine/threonine protein kinase (protein kinase domain plus AGC C-terminal
  domain, with N-terminal PPxY motifs). WTS-1 binds the YAP/Yorkie coactivator YAP-1 through YAP-1's WW
  domain and keeps it out of the nucleus, repressing YAP-1/EGL-44(TEAD)-dependent transcription. It is
  concentrated at the subapical cortex of intestinal cells (kept apical by NFM-1/Merlin) and near the
  plasma membrane in other epithelia. Unlike Warts/LATS in flies and mammals, WTS-1 does not control cell
  proliferation, apoptosis or organ size; instead the WTS-1 -> YAP-1/EGL-44 module maintains apicobasal
  polarity and apical membrane identity of the growing larval intestine, so null mutants arrest as early
  larvae with ectopic lumen-like structures and mislocalized apical actin. Upstream input is Hippo/MST
  (CST-1/2)-dependent in the epidermis but Hippo-independent in the intestine. WTS-1 also restrains YAP-1
  in touch receptor neurons to maintain their structure during aging, and RNAi reveals roles in growth
  rate, body size, dauer entry and lifespan.
