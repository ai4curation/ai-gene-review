gene_symbol: wts-1
organism: worm
uniprot_id: O45797
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Phosphorylates yap-1 which may negatively regulate yap-1 nuclear localization
    (PubMed:23396260). Plays an essential role in larval development (PubMed:19605499,
    PubMed:19737560). Regulates growth, the formation of gut granules, lifespan and
    cell and body sizes probably in synergy with the TGF-beta sma/mab pathway (PubMed:19737560).
    Does not appear to regulate apoptosis and proliferation (PubMed:19605499). In
    addition, may synergize with the TGF-beta daf-7 dauer pathway to regulate entry
    into the dauer stage (PubMed:19737560). Maintains the cellular integrity of intestinal
    cells by regulating the localization of apical actin and junctional proteins (PubMed:19605499).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45797
  source_id: O45797
- source: Alliance_Imported
  text: wts-1 encodes a serine/threonine protein kinase orthologous to members of
    the NDR/LATS family of protein kinases; wts-1 is required for the integrity of
    the apical intestinal membrane via regulation of the localization of newly synthesized
    apical actins; wts-1 is also required for regulating the localization of the product
    of YAP-1, a Yes-associated protein (Yap) homolog, between the cytoplasm and the
    nucleus; wts-1 is also required for larval development; WTS-1 localizes to the
    subapical region of the intestine.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007047;class=Gene
  source_id: WB:WBGene00007047
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity and transcription coactivator
    binding activity. Involved in several processes, including apical protein localization;
    negative regulation of protein import into nucleus; and post-embryonic digestive
    tract morphogenesis. Located in apical plasma membrane and cytoplasm. Is expressed
    in several structures, including anal depressor muscle; excretory canal; hypodermis;
    intestine; and reproductive system. Orthologous to several human genes including
    LATS1 (large tumor suppressor kinase 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00007047;class=Gene
  source_id: WB:WBGene00007047
