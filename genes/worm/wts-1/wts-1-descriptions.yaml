- source: Alliance_Imported
  text: wts-1 encodes a serine/threonine protein kinase orthologous to members of
    the NDR/LATS family of protein kinases; wts-1 is required for the integrity of
    the apical intestinal membrane via regulation of the localization of newly synthesized
    apical actins; wts-1 is also required for regulating the localization of the product
    of YAP-1, a Yes-associated protein (Yap) homolog, between the cytoplasm and the
    nucleus; wts-1 is also required for larval development; WTS-1 localizes to the
    subapical region of the intestine.
