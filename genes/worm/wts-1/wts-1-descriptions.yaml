- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity and transcription coactivator
    binding activity. Involved in several processes, including apical protein localization;
    negative regulation of protein import into nucleus; and post-embryonic digestive
    tract morphogenesis. Located in apical plasma membrane and cytoplasm. Is expressed
    in several structures, including anal depressor muscle; excretory canal; hypodermis;
    intestine; and reproductive system. Orthologous to several human genes including
    LATS1 (large tumor suppressor kinase 1).
