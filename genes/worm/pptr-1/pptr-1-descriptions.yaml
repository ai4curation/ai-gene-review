gene_symbol: pptr-1
organism: worm
uniprot_id: O18178
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable regulatory subunit of serine/threonine-protein phosphatase let-92
    which negatively regulates the insulin receptor signaling cascade composed of
    daf-2, age-1, akt-1, akt-2 and sgk-1 by promoting the dephosphorylation of akt-1
    on 'Thr-350' (PubMed:19249087). Negatively regulates several functions controlled
    by the insulin pathway including dauer formation, lifespan, fat storage and stress
    resistance (PubMed:19249087). Plays a role in the asymmetric segregation of the
    P granule components during embryonic cell divisions but does not play an essential
    role in specifying germ cell fate (PubMed:21127218). Within a PP2A phosphatase
    complex, acts redundantly with pptr-2, to dephosphorylate P granule components
    including meg-1 and meg-3 to promote the assembly and accumulation of zygotic
    P granules in the posterior cytoplasm during zygote polarization, and thus maintain
    P granule distribution and segregation in early stage embryos following meiosis
    (PubMed:25535836). In adults, required to promote germ cell proliferation and
    differentiation when exposed to thermic stress (PubMed:21127218).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O18178
  source_id: O18178
- source: Alliance_Imported
  text: 'pptr-1 encodes a PP2A holoenzyme regulatory subunit, a member of the B56
    family of genes  homologous to mammalian PPP2R5B (OMIM: 601644); out of the seven
    PP2A regulatory subunits only pptr-1 regulates dauer formation downstream of daf-2;pptr-1
    controls dauer formation specifically through the IIS pathway; pptr-1 regulates
    multiple phenotypes associated with the IIS pathways like stress resistance and
    life span; genetically pptr-1 is at the level of or downstream of akt-1 in IIS
    pathway; PPTR-1/mammalian B56beta regulatory subunit function to modulate AKT-1
    phosphorylation in a conserved manner across phylogeny; changes in PPTR-1 levels
    affect the activity of AKT-1 and as a result, modulate DAF-16 subcellular localization;
    PPTR-1 positively regulates DAF-16 nuclear localization and thereby its activity
    on transcriptional targets; PPTR1 expression is predominantly cytosolic and overlaps
    with AKT-2  in pharynx, head neurons, nerve ring, spermathecae and vulva.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00012348;class=Gene
  source_id: WB:WBGene00012348
- source: Alliance_Automated
  text: Enables protein kinase binding activity and protein phosphatase activator
    activity. Involved in several processes, including P granule assembly; determination
    of adult lifespan; and negative regulation of insulin receptor signaling pathway.
    Located in cytosol. Is expressed in several structures, including excretory cell;
    intestine; nervous system; pharynx; and reproductive system. Orthologous to several
    human genes including PPP2R5E (protein phosphatase 2 regulatory subunit B'epsilon).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00012348;class=Gene
  source_id: WB:WBGene00012348
- source: RefSeq
  text: Enables protein kinase binding activity and protein phosphatase activator
    activity. Contributes to protein serine/threonine phosphatase activity. Involved
    in several processes, including P granule assembly; determination of adult lifespan;
    and negative regulation of insulin receptor signaling pathway. Located in cytosol.
    Is expressed in several structures, including excretory cell; intestine; nervous
    system; pharynx; and reproductive system. Orthologous to several human genes including
    PPP2R5E (protein phosphatase 2 regulatory subunit B'epsilon). [provided by Alliance
