id: O18178
gene_symbol: pptr-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: pptr-1 encodes a B56 (B prime) regulatory subunit of the heterotrimeric serine/threonine
  protein phosphatase PP2A in Caenorhabditis elegans. The protein has an ARM-like helical B56 domain.
  With the scaffold PAA-1 and the catalytic subunit LET-92, it targets PP2A to specific phosphoproteins
  in the cytoplasm. In insulin/IGF-1 signaling, PPTR-1 binds AKT-1 and promotes dephosphorylation of its
  activation-loop Thr350. This lowers AKT-1 activity, allows DAF-16/FOXO nuclear entry, and affects dauer
  formation, lifespan, fat storage and stress resistance; mammalian B56beta acts the same way on Akt Thr308.
  In the early embryo, maternal PPTR-1, redundantly with PPTR-2, dephosphorylates the intrinsically disordered
  MEG proteins (MEG-1, MEG-3) that are phosphorylated by MBK-2/DYRK. This promotes condensation and stability
  of P granules so that they segregate to the germline. pptr-1 mutants partition P granule components
  equally to somatic and germline blastomeres but remain fertile except at high temperature.
