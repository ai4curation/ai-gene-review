  review:
    summary: Co-immunoprecipitation of PPTR-1 with AKT-1 from worm lysates.
    action: REMOVE
    reason: 'The PPTR-1/AKT-1 interaction is real and important: PPTR-1 targets PP2A to AKT-1 to dephosphorylate
      Thr350. Generic protein binding adds no information, and the same interaction is already captured
      by the protein kinase binding row and the phosphatase activator activity rows. Removal does not
      dispute the interaction.'
    supported_by:
    - reference_id: PMID:19249087
      supporting_text: In this study, we show that PPTR-1 directly interacts with AKT-1 and regulates
        its activity by modulating its phosphorylation, predominantly at the Thr 350 site.
