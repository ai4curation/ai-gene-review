      is epistatic. PPTR-1 does part of the work as the regulatory subunit that targets PP2A to the MEG
      substrates, so the process annotation is a core one.
    additional_reference_ids:
    - PMID:21127218
    supported_by:
    - reference_id: PMID:25535836
      supporting_text: Phosphorylation of the MEGs promotes granule disassembly and dephosphorylation
        promotes granule assembly.
    - reference_id: PMID:21127218
      supporting_text: We have identified a mutant (pptr-1) in which P granules become unstable during
        mitosis and P granule proteins and RNAs are distributed equally to somatic and germline blastomeres.
