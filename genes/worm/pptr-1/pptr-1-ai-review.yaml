  review:
    summary: B56-family member of the PP2A holoenzyme.
    action: ACCEPT
    reason: PPTR-1 is a B56 (B prime) regulatory subunit of PP2A. RNAi of the catalytic (let-92), scaffold
      (paa-1) and pptr-1 subunits gives the same phenotypes (PMID:33315870), and PPTR-1 acts with PAA-1/LET-92
      on P granules (PMID:25535836). The IBA is well placed in the B56 family.
    supported_by:
    - reference_id: PMID:19249087
      supporting_text: An RNAi screen for serine/threonine protein phosphatases that counterbalance the
        effect of the kinases in the IIS pathway identified pptr-1, a B56 regulatory subunit of the PP2A
        holoenzyme.
    - reference_id: PMID:33315870
      supporting_text: we found that three genes encoding the subunits to constitute a complete PP2A complex
        consisting of the catalytic subunit LET-92 along with the regulatory subunit PPTR-1 and the scaffold
        PAA-1 were required for Day 6 adults to resist ultraviolet irradiation
