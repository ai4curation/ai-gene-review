  review:
    summary: IBA from the deep AP-mu family node PTN000055849, whose experimental seeds for this term
      are yeast AP-1/AP-3 mu subunits and a mammalian non-AP-2 mu subunit acting between Golgi and vacuole/lysosome.
      AP-2 mu functions exclusively at the plasma membrane; there is no evidence that DPY-23 acts in Golgi-to-vacuole
      transport, and the worm literature places it at synapses, phagocytic cups, coelomocyte plasma membrane
      and the periciliary membrane.
    action: REMOVE
    reason: 'Over-propagation from a family-wide node that mixes AP-1/AP-3/AP-4 mu subunits (Golgi/endosome-to-vacuole
      carriers) with AP-2 mu (plasma-membrane endocytosis). The node placement is at the wrong depth for
      this term: the Golgi-to-vacuole role arose in the AP-1/AP-3 lineages, not at the common ancestor
      of all AP-mu subunits. DPY-23 loss affects plasma-membrane cargo (MIG-14 accumulating at the cell
      surface), not Golgi-derived trafficking.'
