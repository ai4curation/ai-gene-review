    supporting_text: Here, we characterize the apm-2 gene (also called dpy-23), which encodes the only
      micro2 subunit in the nematode Caenorhabditis elegans.
  - statement: APM-2::GFP localises to synapses with synaptobrevin and clathrin heavy chain.
    supporting_text: APM-2∷GFP is localized at synapses and colocalizes with the synaptic vesicle protein
      synaptobrevin/VAMP
  - statement: Loss of mu2 mislocalises synaptic clathrin and reduces vesicle number and evoked release
      to ~60%, but vesicles are still recycled.
    supporting_text: In apm-2 mutants, clathrin is mislocalized at synapses, and synaptic vesicle numbers
      and evoked responses are reduced to 60 and 65%, respectively.
  - statement: Mu2 stabilises the AP-2 complex; alpha adaptin falls to 60% (e840) and 12% (gm17).
    supporting_text: The reduction in α adaptin levels in both alleles indicates that μ2 is required to
      stabilize the AP2 complex; however, some residual α adaptin remains in the absence of μ2.
  - statement: Yolk uptake persists in apm-2 nulls.
    supporting_text: Over 98% of the gonads in both apm-2(e840) and apm-2(gm17) mutants were scored as
      positive for yolk protein uptake
