id: P35603
gene_symbol: dpy-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: dpy-23 (also called apm-2) encodes the sole mu2 (AP50) subunit of the heterotetrameric AP-2
  clathrin adaptor complex in Caenorhabditis elegans. Within AP-2 the mu subunit recognises tyrosine-based
  YxxPhi sorting signals in the cytoplasmic tails of membrane cargo and helps dock the complex on phosphatidylinositol-4,5-bisphosphate-containing
  plasma membrane, linking selected cargo to the clathrin coat during clathrin-mediated endocytosis. DPY-23
  is expressed in essentially all tissues, localises to presynaptic terminals with clathrin and synaptobrevin,
  to the plasma membrane of scavenger coelomocytes, to phagocytic cups around apoptotic cell corpses and
  to the periciliary membrane compartment at the base of sensory cilia. Loss of mu2 destabilises the AP-2
  complex and produces dumpy, uncoordinated and egg-laying defective animals; synaptic clathrin is mislocalised
  and synaptic vesicle number and evoked release are reduced, though vesicle recycling continues. Physiological
  cargoes include the Wntless orthologue MIG-14, whose AP-2-dependent internalisation in Wnt-producing
  cells is required for EGL-20/Wnt secretion, the phagocytic receptor CED-1 during apoptotic cell clearance,
  and membrane retrieved at the ciliary base that sets ciliary membrane volume. Mu2 is largely dispensable
  for yolk uptake by oocytes, which depends more strongly on the alpha and beta2 subunits.
