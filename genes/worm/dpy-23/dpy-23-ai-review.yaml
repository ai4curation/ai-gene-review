- id: file:worm/dpy-23/dpy-23-deep-research-falcon.md
  title: Deep research report (falcon/Edison) on C. elegans dpy-23
  findings:
  - statement: Deep research corroborates the mu2 cargo-adaptor model and adds GLR-1 trafficking, NEKL-kinase
      and SEL-5/AAK1 phosphorylation findings not in GOA.
    supporting_text: DPY-23/AP-2 facilitates clathrin-dependent synaptic-vesicle recycling but is not
      absolutely essential; residual AP-2 or alternative recycling routes likely remain.
core_functions:
- description: As the mu2 subunit of the AP-2 adaptor complex, DPY-23 recognises YxxPhi sorting signals
    in the cytoplasmic tails of plasma-membrane cargo (MIG-14/Wntless, the CED-1 phagocytic receptor,
    synaptic vesicle proteins) and, with the other subunits, docks the complex on PI(4,5)P2-containing
    membrane so that cargo is concentrated into nascent clathrin-coated pits.
