suggested_questions:
- question: Which cargo motifs does DPY-23 recognise in vivo, and does MIG-14 internalisation depend on
    a tyrosine-based signal read by mu2 or on the beta2/sigma2 dileucine site?
- question: Given that yolk uptake and synaptic vesicle recycling persist in apm-2 nulls, does the residual
    alpha/sigma2 hemicomplex support endocytosis on its own or do other adaptors (e.g. stonin/UNC-41,
    AP180/UNC-11) compensate?
