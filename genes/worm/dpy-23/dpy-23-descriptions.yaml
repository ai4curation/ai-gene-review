gene_symbol: dpy-23
organism: worm
uniprot_id: P35603
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the adapter complexes which link clathrin to receptors in coated
    vesicles (By similarity). Clathrin-associated protein complexes are believed to
    interact with the cytoplasmic tails of membrane proteins, leading to their selection
    and concentration (By similarity). AP50 is a subunit of the plasma membrane adapter
    (By similarity). Essential wnt/egl-20 signaling protein that functions in wnt/egl-20-producing
    cells (PubMed:18160346, PubMed:18160347). Required for the AP-2 complex-mediated
    endocytosis of membrane proteins including wntless homolog mig-14 in egl-20-producing
    cells (PubMed:18160346, PubMed:18160347). During development, regulates the migration
    of HSN neurons and the left and right Q neuroblasts (QL and QR, respectively)
    and their descendants, possibly through hox gene and wnt/egl-20 gene target mab-5,
    and plays a role in establishing ALM and PLM neuronal cell polarity (PubMed:18160346).
    Regulates AWB sensory neuron cilia membrane expansion during development, potentially
    via localization of tub-1 and PtdIns(4,5)P2 to the ciliary base (PubMed:31259686).
    Required for the asymmetric divisions of V5 cells (PubMed:18160346).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P35603
  source_id: P35603
- source: Alliance_Imported
  text: 'dpy-23 encodes an adaptin: specifically, it encodes an ortholog of the mu2
    subunit of adaptor protein complex 2 (AP2); DPY-23 activity is required for receptor-mediated
    endocytosis and for normal body morphogenesis; DPY-23 also plays a key role in
    regulation of Wnt secretion by regulating trafficking of MIG-14/Wntless; when
    expressed in neurons, DPY-23 localizes to the synapse and co-localizes with SNB-1
    at synaptic vesicles.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001082;class=Gene
  source_id: WB:WBGene00001082
- source: Alliance_Automated
  text: Predicted to enable clathrin-cargo adaptor activity. Involved in several processes,
    including necroptotic process; positive regulation of Wnt protein secretion; and
    protein localization to non-motile cilium. Located in periciliary membrane compartment
    and synaptic vesicle. Is expressed in anal depressor muscle; germ line; neurons;
    rectal epithelial cell; and spermatheca. Human ortholog(s) of this gene implicated
    in autosomal dominant intellectual developmental disorder 60 with seizures. Orthologous
    to human AP2M1 (adaptor related protein complex 2 subunit mu 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001082;class=Gene
