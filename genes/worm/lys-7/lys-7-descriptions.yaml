gene_symbol: lys-7
organism: worm
uniprot_id: O16202
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role in resistance to Gram-positive bacteria B.thuringiensis and M.nematophilum
    and Gram-negative bacteria S.boydii or S.flexneri infection and to fungus C.neoformans
    infection (PubMed:16809667, PubMed:21399680, PubMed:21931778, PubMed:22841995).
    Plays a role in susceptibility to Gram-negative bacterium S.typhimurium infection
    (PubMed:21399680).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16202
  source_id: O16202
- source: Alliance_Imported
  text: lys-7 encodes an enzyme homologous to an antimicrobial lysozyme encoded by
    the LYS4 gene of the protozoan parasite Entamoeba histolytica; LYS-7 functions
    in the innate immune response as an antimicrobial enzyme that, by homology, hydrolyzes
    the 1,4-beta-linkages between N-acetyl-D-glucosamine and N-acetylmuramic acid
    in peptidoglycan heteropolymers of prokaryotic cell walls; loss of lys-7 activity
    results in enhanced susceptibility to P. aeruginosa PA14, renders worms susceptible
    to Cryptococcus neoformans killing, but enhances tolerance to the enteric bacteria
    Salmonella typhimurium; lys-7 expression is significantly upregulated in response
    to infection with the Gram-negative bacterium Serratia marcescens; constitutive
    expression of lys-7 mRNA is detected in the intestine and the intestinal valve
    cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003096;class=Gene
  source_id: WB:WBGene00003096
- source: Alliance_Automated
  text: Predicted to enable lysozyme activity. Involved in defense response to bacterium;
    defense response to fungus; and innate immune response. Is expressed in head neurons;
    intestine; and rectal gland cell.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003096;class=Gene
  source_id: WB:WBGene00003096
