gene_symbol: bec-1
organism: worm
uniprot_id: Q22592
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Regulates autophagy (PubMed:12958363). Together with phosphatidyl-3-phosphate
    kinase vps-34, acts as a core subunit of the PI3K complex that mediates formation
    of phosphatidylinositol 3- phosphate (PtdIns3P), thereby regulating membrane trafficking
    (PubMed:16111945, PubMed:21183797, PubMed:26783301). In association with sorf-1
    and sorf-2, negatively regulates phosphatidylinositol 3- phosphate in early endosomes
    to allow for the conversion to late endosomes (PubMed:26783301). Involved in the
    clearance of engulfed apoptotic cell corpses (PubMed:16111945, PubMed:21183797).
    Together with ced-9, negatively regulates somatic and germline apoptosis (PubMed:17890369).
    Plays a role in endosome-to-Golgi retrograde transport of mig-14 (PubMed:21183797).
    In a daf-18/PTEN- and skn-1/Nrf- dependent manner, promotes germline stem cell
    proliferation during late and adult stages, probably by ensuring cell survival
    and cell cycle progression (PubMed:28285998). Required for embryonic development
    and L3/L4 molting during larval development (PubMed:16111945). Required for normal
    dauer morphogenesis and lifespan (PubMed:12958363, PubMed:17204841). Plays a role
    in male tail ray pattern formation (PubMed:17890369). Required for normal survival
    when exposed to pathogenic bacteria S.typhimurium by promoting autophagic degradation
    of intracellular S.typhimurium (PubMed:19667176).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22592
  source_id: Q22592
- source: Alliance_Imported
  text: bec-1 encodes a coiled-coil protein orthologous to the yeast and mammalian
    autophagy proteins Atg6/Vps30/Beclin1; by homology, BEC-1 may be part of a Class
    III phosphatidylinositol 3-kinase complex that plays a role in localizing autophagy
    proteins to preautophagosomal structures and overexpression of C. elegans bec-1
    in S. cerevisiae APG6/VPS30 mutants can rescue associated autophagy defects; bec-1
    is also required for regulation of endocytic retrograde transport; in C. elegans,
    bec-1 activity is required for normal dauer morphogenesis and survival of dauer
    larvae, as well as for adult life span extension of daf-2(e1370) mutants at 15
    degrees; in addition, bec-1(RNAi) indicates a role for bec-1 in normal growth
    rates, movement, and vulval morphogenesis; a bec-1::GFP reporter fusion is expressed
    in the hypodermis, intestine, nervous system, pharynx, and reproductive organs,
    all tissues that are remodeled during dauer larval development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000247;class=Gene
  source_id: WB:WBGene00000247
- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol 3-kinase binding activity and protein-macromolecule
    adaptor activity. Involved in several processes, including determination of adult
    lifespan; nematode male tail tip morphogenesis; and positive regulation of early
    endosome to late endosome transport. Located in endosome; nucleus; and perikaryon.
    Is expressed in several structures, including intestine; nervous system; pharyngeal-intestinal
    valve; pharynx; and vulva. Human ortholog(s) of this gene implicated in Machado-Joseph
    disease. Orthologous to several human genes including BECN1 (beclin 1).
