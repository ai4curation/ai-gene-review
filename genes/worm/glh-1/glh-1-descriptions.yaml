- source: Alliance_Automated
  text: Enables DEAD/H-box RNA helicase binding activity; JUN kinase binding activity;
    and RNA helicase activity. Involved in germ cell development and post-embryonic
    development. Located in P granule. Is expressed in Z2; Z3; germ line; and gonad.
    Orthologous to human DDX4 (DEAD-box helicase 4).
