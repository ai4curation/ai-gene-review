gene_symbol: glh-1
organism: worm
uniprot_id: P34689
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable ATP-binding RNA helicase (PubMed:8415696). May act redundantly with
    the P-granule component glh-4 to regulate the formation of the granular structure
    of P-granules in embryos (PubMed:21402787, PubMed:24746798). Plays a role in positively
    regulating the localization of pgl-1 to P-granules (PubMed:18234720). May play
    a role in transgenerational epigenetic inheritance (PubMed:28533440). May protect
    somatic cells from excessive apoptosis during normal development (PubMed:27650246).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34689
  source_id: P34689
- source: Alliance_Imported
  text: glh-1 encodes a putative DEAD-box RNA helicase that contains four CCHC zinc
    fingers and is homologous to Drosophila VASA, a germ-line-specific, ATP-dependent
    RNA helicase; at permissive temperature, GLH-1 is required redundantly with GLH-4
    for proper germ-line development and  fertility, specifically for regulating the
    normal extent of germ-line proliferation, oogenesis, and the production of functional
    sperm; GLH-1 activity is also likely required for the wild-type morphology of
    P granules and for localization of several protein components, such as PGL-1,
    but not for accumulation of P granule mRNAs; GLH-1 interacts in vivo with CSN-5,
    a COP9 signalosome component, and in vitro with itself and with KGB-1, a JNK-like
    MAP kinase, ZYX-1, a LIM domain-containing zyxin homologue, and GLH-3; GLH-1 is
    a constitutive P granule component and thus, with the exception of mature sperm,
    is expressed in germ cells at all stages of development; consistent with its P
    granule localization, GLH-1 is cytoplasmic in oocytes and the early embryo, while
    perinuclear in all later developmental stages as well as in the distal and medial
    regions of the hermaphrodite gonad; GLH-1 is also expressed in males.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001598;class=Gene
  source_id: WB:WBGene00001598
- source: Alliance_Automated
  text: Enables DEAD/H-box RNA helicase binding activity; JUN kinase binding activity;
    and RNA helicase activity. Involved in germ cell development and post-embryonic
    development. Located in P granule. Is expressed in Z2; Z3; germ line; and gonad.
    Orthologous to human DDX4 (DEAD-box helicase 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001598;class=Gene
