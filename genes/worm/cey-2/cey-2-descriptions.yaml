descriptions:
- source: Alliance_Imported
  text: cey-2 encodes a cold-shock/Y-box domain-containing protein; by homology, CEY-2
    is predicted to function as either an RNA-binding protein involved in translation
    or RNA processing, or a DNA-binding protein involved in transcriptional regulation;
    cey-2 mRNA is expressed maternally in the early embryo, in a pattern characteristic
    of class II maternal RNAs, which are initially detected throughout the embryo
    but restricted to the P, or germline, lineage as cell division progresses; CEY-2
    associates with CGH-1 and CEY-3/4 in cytoplasmic particles of the gonad and early
    embryo.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000473;class=Gene
  source_id: WB:WBGene00000473
- source: Alliance_Automated
  text: Predicted to enable nucleic acid binding activity. Predicted to be involved
    in regulation of gene expression. Part of ribonucleoprotein complex. Is expressed
    in germ cell; germ line; pharynx; and somatic cell. Used to study Huntington's
    disease and neurodegenerative disease. Orthologous to human YBX2 (Y-box binding
    protein 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000473;class=Gene
