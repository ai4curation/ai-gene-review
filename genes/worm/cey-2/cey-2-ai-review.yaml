  review:
    summary: Broad gene-expression regulation inherited from the CSD node. For CEY-2 the
      evidence places this regulation after transcription.
    action: MODIFY
    reason: The claim holds for CEY-2, but the term is less specific than the evidence
      supports. Two independent lines place CEY-2's role after transcription. First,
      CEY-2 is cytoplasmic only and is not found in the nucleus (PMID:25378320). Second,
      it is a component of the RNA-dependent CAR-1/CGH-1 maternal mRNP
      (PMID:16247027, PMID:25378320), and cey-2,-3 mutants have lower levels of maternal
      mRNAs such as rme-2 (PMID:25378320). I propose GO:0010608 post-transcriptional
      regulation of gene expression. I do not go further, to mRNA stabilization or
      translational repression, because only steady-state mRNA and protein levels were
      measured, the phenotype is shared with CEY-3, and how CEY-2 acts remains
      unresolved.
    proposed_replacement_terms:
    - id: GO:0010608
      label: post-transcriptional regulation of gene expression
