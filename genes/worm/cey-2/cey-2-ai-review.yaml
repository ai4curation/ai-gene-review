core_functions:
- description: Germline-specific cytoplasmic Y-box protein. Its cold shock domain is
    predicted to bind nucleic acid. It is a component of the CAR-1/CGH-1 maternal mRNP
    and acts, redundantly with CEY-3, in post-transcriptional control of maternal mRNAs
    during oogenesis.
