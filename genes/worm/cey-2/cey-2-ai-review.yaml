  review:
    summary: Nuclear activity propagated from the vertebrate Y-box protein node (YBX1,
      YBX2, YBX3 seeds), which have documented nuclear roles in transcription and
      splicing.
    action: REMOVE
    reason: The node placement is reasonable for vertebrate Y-box proteins, but there is
      target-specific experimental evidence that this localization was not retained in
      CEY-2. Arnold et al. (PMID:25378320) found by immunostaining and GFP fusions that
      CEY proteins, CEY-2 included, are only cytoplasmic in soma and germline, and that
      blocking CRM1/XPO-1-dependent nuclear export did not make CEY-2 accumulate in the
      nucleus. CEY-2 does not appear to shuttle through the nucleus as YB-1 does, so
      "is_active_in nucleus" is contradicted for this gene. Hayden et al.
      (PMID:39423228) also place CEY-1, not CEY-2, as the closest ortholog of the
      mammalian YBX proteins that seed the node.
