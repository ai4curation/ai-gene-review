  review:
    summary: Nucleic acid binding inherited from the cold shock domain node, which spans
      bacterial cold shock proteins and eukaryotic Y-box proteins.
    action: ACCEPT
    reason: CEY-2 carries a canonical cold shock domain (CSD, residues 65-135) with the
      RNP1/RNP2 nucleic-acid-binding motifs, and it lies well inside the CSD clade on
      which PAINT placed nucleic acid binding. Nothing specific to CEY-2 argues against
      the node. I do not refine the term to RNA or mRNA binding, because direct binding
      by CEY-2 has not been assayed, and RIP-seq of FLAG-CEY-2 found no specific mRNA
      enrichment (PMID:25378320), which the authors note fits either non-specific
      binding or no binding. Nucleic acid binding is as precise as the evidence for
      this protein allows.
