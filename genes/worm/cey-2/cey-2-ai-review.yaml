  review:
    summary: CEY-2 was identified by tandem affinity purification and mass spectrometry
      as one of three components of the CAR-1 complex, with CGH-1, and the complex
      depends on RNA.
    action: ACCEPT
    reason: Direct biochemical evidence. Stringent two-step TAP of GFP-LAP:CAR-1
      recovered only CAR-1, CGH-1 and CEY-2 (PMID:16247027). The CAR-1/CGH-1 association
      is RNase-sensitive, which makes the complex an RNP. Arnold et al. (PMID:25378320)
      independently confirmed RNA-dependent co-IP of FLAG-CEY-2 with CGH-1 and GLD-1.
      This germline mRNP is the best-supported setting for CEY-2 function.
    supported_by:
    - reference_id: PMID:16247027
      supporting_text: Under these stringent purification conditions, we obtained significant
        sequence coverage for CAR-1 and two additional proteins, the RNA helicase, CGH-1,
        and the Y-box domain–containing protein, CEY-2
    - reference_id: PMID:16247027
      supporting_text: We conclude that CAR-1 is a component of an RNase-sensitive, multiprotein
        complex of conserved RNA-binding proteins.
    - reference_id: PMID:25378320
      supporting_text: These data were confirmed by co-IPs performed again with or without
        RNAse treatment on FLAG-CEY-2
