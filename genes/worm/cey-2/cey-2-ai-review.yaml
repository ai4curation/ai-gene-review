  label: Caenorhabditis elegans
description: >-
  CEY-2 (F46F11.2) is one of four Caenorhabditis elegans Y-box-binding proteins. It
  is a 267-residue protein with a single N-terminal cold shock domain (CSD) followed
  by a long disordered, basic C-terminal region, and it lacks the RG/RGG repeats of
  its paralogs CEY-1 and CEY-4. CEY-2 is expressed only in the germline, rises
  strongly as germ cells enter meiosis, and disappears during the oocyte-to-embryo
  transition. It is cytoplasmic, not nuclear. It co-purifies with the Scd6/LSM14
  protein CAR-1 and the DDX6-family helicase CGH-1 in a maternal mRNP complex, and
  its associations with CGH-1 and GLD-1 depend on RNA. Together with its close,
  largely redundant paralog CEY-3, it is needed for normal germ cell proliferation
  and survival, normal oocyte maturation timing, normal levels of maternal mRNAs and
  full fertility, consistent with the conserved role of germline Y-box proteins in
  packaging and storing maternal mRNAs. Direct RNA binding by CEY-2 has not been
  demonstrated biochemically.
