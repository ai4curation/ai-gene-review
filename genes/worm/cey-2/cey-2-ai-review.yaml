suggested_questions:
- question: Does CEY-2 bind RNA directly, and with what specificity? The lack of mRNA
    enrichment in FLAG-CEY-2 RIP-seq fits either non-specific binding or no binding.
- question: Does CEY-2 stabilize maternal mRNAs or repress their translation? The reduced
    maternal mRNA levels in cey-2,-3 mutants could reflect either mechanism, or an indirect
    effect of altered mRNP assembly.
- question: Is the nuclear localization of vertebrate Y-box proteins lost across the nematode
    CEY clade? If so, the PAINT nucleus node (PTN000899564) should carry a loss annotation
    for nematode germline CEY proteins.
suggested_experiments:
- description: Recombinant CEY-2 CSD and full-length protein in EMSA or fluorescence anisotropy
    with ssRNA, ssDNA and dsDNA probes, plus iCLIP in the germline, to establish direct
    RNA binding and any sequence preference.
  experiment_type: biochemical binding assay / CLIP
- description: Measure maternal mRNA half-lives (for example after transcriptional shutoff
    in dissected gonads) and ribosome association in cey-2 cey-3 double mutants, to separate
    mRNA stabilization from translational control.
  experiment_type: mRNA decay and polysome profiling
