gene_symbol: bbs-9
organism: worm
uniprot_id: O01514
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia (By similarity). The BBSome complex is required for ciliogenesis
    but is dispensable for centriolar satellite function (By similarity). Required
    for proper BBSome complex assembly and its ciliary localization (PubMed:22922713).
    Required for cilia biogenesis and both the assembly and movement of intraflagellar
    transport proteins along the ciliary axoneme (PubMed:22022287, PubMed:22922713).
    In ciliated sensory neurons, required for the sensation of nitric oxide and avoidance
    of NO- producing organisms like P.aeruginosa (PubMed:30014846).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O01514
  source_id: O01514
- source: Alliance_Imported
  text: bbs-9 is orthologous to the human parathyroid hormone-responsive B1 gene,
    also known as BBS9; bbs-9 apart from being required for proper cilium morphology
    and function, is also required, similar to bbs-1, bbs-5, and bbs-8, for the regulation
    of insulin release from sensory neurons; bbs-9 mutants exhibit an increased secretion
    of insulin, daf-7, a neurally expressed TGF-beta ligand, and flp-21, a FRMF-amide
    neuropeptide; accordingly mutants display body size, feeding and metabolic defects;
    increased secretion of bbs mutants requires the Rab27/AEX-6 dense-core vesicle
    exocytosis machinery; the metabolic and ciliary phenotypes of bbs-9 and similar
    bbs mutants indicate that normal ciliary function is required for detection of
    food-related stimuli along with the coordination of metabolic, growth and insulin-signaling
    pathways.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016744;class=Gene
  source_id: WB:WBGene00016744
- source: Alliance_Automated
  text: Predicted to be involved in cilium assembly. Located in ciliary basal body.
    Used to study Bardet-Biedl syndrome. Human ortholog(s) of this gene implicated
    in Bardet-Biedl syndrome; Bardet-Biedl syndrome 9; craniosynostosis; and primary
    ovarian insufficiency. Orthologous to human BBS9 (Bardet-Biedl syndrome 9).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00016744;class=Gene
  source_id: WB:WBGene00016744
