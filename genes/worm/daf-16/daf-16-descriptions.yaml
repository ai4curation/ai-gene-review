- source: Alliance_Imported
  text: daf-16 encodes the sole C. elegans forkhead box O (FOXO) homologue; DAF-16
    functions as a transcription factor that acts in the insulin/IGF-1-mediated signaling
    (IIS) pathway that regulates dauer formation, longevity, fat metabolism, stress
    response, and innate immunity; DAF-16 regulates these various processes through
    isoform-specific expression, isoform-specific regulation by different AKT kinases,
    and differential regulation of target genes; DAF-16 can interact with the CBP-1
    transcription cofactor in vitro, and interacts genetically with other genes in
    the insulin signaling and with daf-12, which encodes a nuclear hormone receptor;
    DAF-16 is activated in response to DNA damage during development and co-regulated
    by EGL-27, alleviates DNA-damage-induced developmental arrest by inducing DAF-16-associated
    element (DAE)-regulated genes; DAF-16 is broadly expressed but displays isoform-specific
    tissue enrichment; DAF-16 localizes to both the cytoplasm and the nucleus, with
    the ratio between the two an important regulator of function.
