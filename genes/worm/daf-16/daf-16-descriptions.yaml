- source: Alliance_Automated
  text: Enables several functions, including 14-3-3 protein binding activity; DNA-binding
    transcription activator activity, RNA polymerase II-specific; and enzyme binding
    activity. Involved in several processes, including defense response to bacterium;
    regulation of dauer larval development; and regulation of gene expression. Located
    in cytoplasm and nucleus. Is expressed in several structures, including germ cell;
    germ line; gonad; hypodermis; and neurons. Used to study Parkinson's disease and
    diabetes mellitus. Human ortholog(s) of this gene implicated in alveolar rhabdomyosarcoma.
    Orthologous to several human genes including FOXO1 (forkhead box O1) and FOXO3
    (forkhead box O3).
