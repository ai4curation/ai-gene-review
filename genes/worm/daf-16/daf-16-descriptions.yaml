descriptions:
- source: UniProt
  text: 'Forkhead-type transcription factor (PubMed:9360933). Binds to the promoters
    of genes that contain the daf-16/FOXO binding element (DBE), TTGTTTAC, in their
    regulatory region (PubMed:10880363, PubMed:23770237, PubMed:26675724). Functions
    in the Insulin/IGF-1-like signaling (IIS) mediated pathway which affects lipogenesis,
    lifespan, starvation survival, heat shock and oxidative stress responses, sleep,
    associative memory, and dauer formation (PubMed:11381260, PubMed:11747821, PubMed:11747825,
    PubMed:12750521, PubMed:14622602, PubMed:17900900, PubMed:18358814, PubMed:18762027,
    PubMed:18832074, PubMed:19103192, PubMed:21531333, PubMed:22081913, PubMed:26675724,
    PubMed:29523076, PubMed:8247153, PubMed:9360933). Longevity signaling predominantly
    arises from expression in the intestine (PubMed:14622602). Acts in the intestine
    to mediate the role of slo-1 in age-associated decline in motor activity and longevity
    (PubMed:30613772). Transcriptional activity of daf-16/FOXO is negatively regulated
    by interaction with host cell factor homolog hcf- 1; and by cytoplasmic sequestration
    by association with ftt-2 (PubMed:11381260, PubMed:18828672, PubMed:21531333).
    Inhibition is required for the carbon dioxide (CO2) avoidance response (PubMed:18524954).
    Upon loss of inhibition, daf-16 translocates to the nucleus to regulate genes
    that result in delayed reproduction and growth while increasing stress resistance
    starvation tolerance and longevity (PubMed:11747825, PubMed:21531333). Association
    with arginine methyltransferase prmt-1 prevents phosphorylation and allows for
    translocation to the nucleus and the subsequent transcription of longevity-related
    genes (PubMed:21531333). Modulation of its activity by cGMP levels in sensory
    neurons regulates lifespan (PubMed:19489741). Has a protective role against muscle
    dystrophy (PubMed:18397876). Involved in mediating protection against aberrant
    protein aggregation proteotoxicity (PubMed:16902091). Influences transcription
    of genes that code for proteins involved in immunity as part of a general stress
    response (PubMed:17096597, PubMed:18245330). Targets genes that inhibit and stimulate
    tumor growth (PubMed:17934462). Targets kinases, phosphatases and transcription
    factors that are primarily involved in signaling and gene regulation (PubMed:24516399).
    Thought to regulate ins-7 in FOXO-to-FOXO signaling, which coordinates daf-16
    expression (PubMed:18025456). Activity is positively regulated by shc-1-mediated
    inhibition of daf-2 and activation of JNK pathway (PubMed:18832074, PubMed:22916022).
    Through the regulation of its activity by shc-1- mediated inhibition of daf-2
    and activation of JNK pathway, plays a role in maintaining the integrity of the
    gonad (PubMed:22916022). Functions by indirect interaction with jnk-1 of the mitogen-activated
    protein kinase (MAPK) pathway (PubMed:17894411). Involved in increased proteasome
    activity by activating expression of rpn-6.1 in response to proteotoxic stress,
    leading to enhanced assembly of the 26S proteasome, followed by higher proteasome
    activity (PubMed:22922647). Also regulates proteasome activity in the intestine
    by preventing expression of deubiquitinase ubh-4 (PubMed:23770237). Represses
    transcription of natc-1 (PubMed:25330323). Involved in regulation of srh-234 expression
    (PubMed:25357003). Binds to the promoter of the AMPK-gamma regulatory subunit,
    aakg-4, and activates its transcription (PubMed:24516399). Also activates transcription
    of AMPK-gamma regulatory subunit, aakg-1 (PubMed:24516399). Maintains endoplasmic
    reticulum (ER) function by inducing protein degradation and elimination to remove
    misfolded secretory proteins from the ER independently of the ire-1/xbp-1 unfolded
    protein response pathway (PubMed:25448701). Regulates epidermal innate immunity
    to nematophagous fungal infection and physical wounding which trigger bli-3 induced
    ROS release, leading to daf-16 activation independently of daf-2 signaling (PubMed:24146615).
    May negatively regulate resistance to stress caused by oxidized cholesterol adducts
    by preventing the activation of daf-9 and nuclear hormone receptor daf-12, two
    members of the steroid signaling pathway (PubMed:24957743). Promotes apoptosis
    during embryonic development (PubMed:25383666). Probably through the regulation
    of the autophagy genes atg-18 and atg-16.2, plays a role in regulating stem cell
    number in the germline during larval development (PubMed:28285998). Plays a role
    in learning and memory; including associative memory, and aversive gustatory associated
    learning known as salt avoidance learning (PubMed:26675724, PubMed:30779740).
    Plays a role in regulating gene transcription in response to white light exposure
    (PubMed:29500338). Binds to the promoter of dex-1 to positively regulate its expression
    in seam cells during the dauer phase (PubMed:30409788). Plays a role in transgenerational
    lipid accumulation in response to a high-fat diet (PubMed:35140229). . [Isoform
    a]: Functions in the Insulin/IGF-1-like signaling (IIS) mediated pathway (PubMed:24834345).
    May play a role in lifespan modulation, but less significant than that played
    by isoforms d and f (PubMed:24834345). . [Isoform d]: Functions in the Insulin/IGF-1-like
    signaling (IIS) mediated pathway (PubMed:24834345). Transcript level in the early
    adult may play a role in lifespan modulation, but effect is more significant than
    that played by isoform a (PubMed:24834345). . [Isoform f]: Functions in the Insulin/IGF-1-like
    signaling (IIS) mediated pathway (PubMed:24834345). Transcript level in the early
    adult may play a role in lifespan modulation, but effect is more significant than
    that played by isoform a (PubMed:24834345).'
