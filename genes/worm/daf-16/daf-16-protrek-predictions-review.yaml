  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm daf-16, the FOXO transcription factor that is the primary
  effector of insulin/IGF-1 signalling and arguably the most-studied gene in C. elegans aging. The
  result is one of the weakest in ARGO139. Top-five scores run 12.95 down to 11.01, the lowest of
  the worm set, and the only correct call - DNA-binding transcription factor activity, RNA polymerase
  II-specific - arrives last at rank 5 and is the generic parent that GOA already holds with IBA and
  IMP support, not anything DAF-16-specific. The four calls above it are a yeast cell-cycle complex,
  mitochondrial transcription factor activity, ChREBP's carbohydrate response element and mitochondrial
  promoter binding: three of the four point at mitochondria or yeast, neither of which has anything
  to do with DAF-16. The free-text channel fails in the family-collapse way, returning the comment
  for a different worm forkhead that regulates 21U-RNAs redundantly with fkh-4 and fkh-5. Assessment:
  3 nonparalog incorrect. Assessment: 3 nonparalog incorrect (NPI).
