    summary: >-
      Rank 3 (score 11.72). Carbohydrate response element binding is the defining DNA-binding specificity
      of ChREBP/MLXIPL, a bHLH-ZIP factor of an entirely different structural class. DAF-16 binds
      the forkhead DAF-16-binding element; GOA records its RNA polymerase II cis-regulatory region
      binding with IDA. Scored MORE_SPECIFIC against that GOA term, so closure would credit a call
