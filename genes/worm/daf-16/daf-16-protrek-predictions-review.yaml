    summary: >-
      Top-ranked hit (score 12.95). The M/G1 phase-specific MADS box-forkhead transcription factor
      complex is the budding-yeast Mcm1-Fkh2 complex that drives CLB2-cluster cell-cycle transcription.
      DAF-16 is a forkhead, which is presumably the thread followed, but the complex is yeast-specific
      and DAF-16 has no cell-cycle transcription role of this kind. Scored MORE_SPECIFIC against GOA's
      nucleus.
