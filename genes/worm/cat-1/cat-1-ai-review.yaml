gene_symbol: cat-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CAT-1 is the vesicular monoamine transporter (VMAT) of Caenorhabditis
  elegans, a member of the SLC18 family of the major facilitator superfamily and the
  paralogue of the vesicular acetylcholine transporter UNC-17. It resides in the
  synaptic vesicle membrane of roughly twenty-five aminergic neurons, including all
  dopaminergic and serotonergic cells, and exchanges luminal protons for cytosolic
  monoamines, thereby concentrating dopamine, serotonin, tyramine, octopamine and
  related amines into synaptic vesicles using the proton gradient generated by the
  vesicular V-ATPase. Expressed heterologously it transports serotonin and dopamine
  with a pharmacological profile resembling mammalian VMAT2. cat-1 null mutants are
  viable but lack VMAT immunostaining, have strongly reduced dopamine content and
  are defective in dopamine- and serotonin-dependent behaviours, which can be
  rescued by worm or human VMAT transgenes, showing that aminergic signalling
  depends entirely on vesicular loading.
