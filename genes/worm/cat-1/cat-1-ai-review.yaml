suggested_questions:
- question: Does CAT-1 load histamine and dopamine with comparable efficiency in
    vivo, and is the relative loading of tyramine versus octopamine tuned in the
    RIM/RIC neurons that use those amines?
suggested_experiments:
- description: Measure proton-gradient-dependent uptake of dopamine, serotonin,
    tyramine and octopamine by purified or reconstituted CAT-1, and quantify amine
    content of cat-1 null and rescue strains by HPLC per neuron class.
