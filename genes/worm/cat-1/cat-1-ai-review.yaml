- id: PMID:9870940
  title: The cat-1 gene of Caenorhabditis elegans encodes a vesicular monoamine
    transporter required for specific monoamine-dependent behaviors.
  findings:
  - statement: cat-1 encodes the C. elegans VMAT, 47-49% identical to human VMAT1
      and VMAT2.
    supporting_text: We have identified the Caenorhabditis elegans homolog of the
      mammalian vesicular monoamine transporters (VMATs); it is 47% identical to
      human VMAT1 and 49% identical to human VMAT2
  - statement: CAT-1 is associated with synaptic vesicles in about 25 neurons,
      including all dopaminergic and serotonergic cells.
    supporting_text: C. elegans VMAT is associated with synaptic vesicles in
      approximately 25 neurons, including all of the cells reported to contain
      dopamine and serotonin, plus a few others
  - statement: Heterologously expressed CAT-1 transports serotonin and dopamine.
    supporting_text: When C. elegans VMAT is expressed in mammalian cells, it has
      serotonin and dopamine transport activity
  - statement: Norepinephrine, tyramine, octopamine and histamine also have high
      affinity for CAT-1.
    supporting_text: norepinephrine, tyramine, octopamine, and histamine also have
      high affinity for the transporter
  - statement: The pharmacological profile resembles mammalian VMAT2.
    supporting_text: The pharmacological profile of C. elegans VMAT is closer to
      mammalian VMAT2 than VMAT1
  - statement: cat-1 null mutants lack VMAT immunostaining and dopamine-mediated
      behaviours but are viable.
    supporting_text: cat-1 knock-outs are totally deficient for VMAT immunostaining
      and for dopamine-mediated sensory behaviors, yet they are viable and grow
      relatively well
  - statement: Mutant phenotypes are rescued by worm or human VMAT transgenes.
    supporting_text: The cat-1 mutant phenotypes can be rescued by C. elegans VMAT
      constructs and also (at least partially) by human VMAT1 or VMAT2 transgenes
  - statement: Amine transmitter function depends entirely on vesicular loading.
    supporting_text: It therefore appears that the function of amine neurotransmitters
      can be completely dependent on their loading into synaptic vesicles
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; the defining paper for cat-1 identity, substrate
      range, localization and null phenotype.
  full_text_unavailable: true
core_functions:
- description: Vesicular monoamine transporter of aminergic neurons; exchanges
    luminal protons for cytosolic dopamine, serotonin, tyramine or octopamine,
    concentrating the amine into the synaptic vesicle lumen using the proton
    gradient generated by the vesicular V-ATPase.
  molecular_function:
