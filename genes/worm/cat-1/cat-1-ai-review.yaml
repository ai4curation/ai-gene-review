- term:
    id: GO:0042417
    label: dopamine metabolic process
  evidence_type: IMP
  original_reference_id: PMID:14739932
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00091705
  review:
    summary: HPLC shows that cat-1(ok411) animals have strongly reduced dopamine
      content, like the biosynthetic mutants cat-2 and cat-4 (PMID:14739932).
    action: MARK_AS_OVER_ANNOTATED
    reason: The measurement is sound, but CAT-1 catalyses no step of dopamine
      synthesis or degradation. The reduced amine content follows from the loss of
      vesicular sequestration, which normally protects cytosolic dopamine from
      catabolism, so this is a downstream consequence of the transport function
      rather than participation in dopamine metabolism. Retained, since CAT-1 does
      shape dopamine pools, but flagged as an over-annotation.
    supported_by:
    - reference_id: PMID:14739932
      supporting_text: Mutant strains deficient for the vesicular monoamine
        transporter ( cat-1 ), TH ( cat-2 ) and GTP-cyclohydroxylase ( cat-4 ) have
        reduced levels of dopamine
