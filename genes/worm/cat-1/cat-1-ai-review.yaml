- term:
    id: GO:0005330
    label: dopamine:sodium symporter activity
  evidence_type: IDA
  original_reference_id: PMID:9870940
  qualifier: enables
  review:
    summary: C. elegans VMAT expressed in mammalian cells transports dopamine
      (PMID:9870940). The assay established dopamine transport, not sodium coupling.
    action: MODIFY
    reason: The transport activity is real but the mechanism in the term is wrong.
      Sodium-coupled dopamine symport is the property of the plasma-membrane SLC6
      reuptake transporter DAT; VMAT-family transporters are vesicular
      monoamine/proton antiporters that use the V-ATPase proton gradient. The
      appropriate term, already present in this annotation set by IBA, is
      monoamine:proton antiporter activity.
    proposed_replacement_terms:
    - id: GO:0015311
      label: monoamine:proton antiporter activity
    supported_by:
