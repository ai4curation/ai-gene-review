      supporting_text: When C. elegans VMAT is expressed in mammalian cells, it has
        serotonin and dopamine transport activity
    - reference_id: PMID:9870940
      supporting_text: We have identified the Caenorhabditis elegans homolog of the
        mammalian vesicular monoamine transporters (VMATs)
