gene_symbol: cat-1
organism: worm
uniprot_id: Q9GNP0
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: cat-1 encodes a synaptic vesicular monoamine transporter required for the
    presence of dopamine and serotonin in nerve terminals, for the normal slowing
    of worms on a bacterial lawn (versus clean agar), for faster pharyngeal pumping
    on food, and for a normally (high) rate of egg-laying.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000295;class=Gene
  source_id: WB:WBGene00000295
- source: Alliance_Automated
  text: Enables dopamine:sodium symporter activity and serotonin:sodium:chloride symporter
    activity. Involved in aminergic neurotransmitter loading into synaptic vesicle;
    dopamine metabolic process; and feeding behavior. Located in synaptic vesicle.
    Is expressed in gonad; nervous system; and in male. Used to study amphetamine
    abuse and cocaine abuse. Human ortholog(s) of this gene implicated in Parkinson's
    disease; bipolar disorder; infantile parkinsonism-dystonia 2; and schizophrenia.
    Orthologous to human SLC18A1 (solute carrier family 18 member A1) and SLC18A2
    (solute carrier family 18 member A2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000295;class=Gene
  source_id: WB:WBGene00000295
- source: RefSeq
  text: Enables dopamine:sodium symporter activity and serotonin:sodium:chloride symporter
    activity. Involved in several processes, including dopamine metabolic process;
    monoamine transport; and octopamine transport. Located in synaptic vesicle. Is
    expressed in gonad; nervous system; and in male. Used to study amphetamine abuse
    and cocaine abuse. Human ortholog(s) of this gene implicated in Parkinson's disease;
    bipolar disorder; infantile parkinsonism-dystonia 2; and schizophrenia. Orthologous
    to human SLC18A1 (solute carrier family 18 member A1) and SLC18A2 (solute carrier
    family 18 member A2). [provided by Alliance of Genome Resources, Jun 2026]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/180837
