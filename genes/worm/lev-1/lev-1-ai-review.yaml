id: Q27218
gene_symbol: lev-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: LEV-1 is a non-alpha Cys-loop nicotinic acetylcholine receptor subunit in
  Caenorhabditis elegans. Together with UNC-29, UNC-38, UNC-63 and LEV-8, it forms the
  heteropentameric levamisole-sensitive acetylcholine receptor that mediates excitatory cholinergic
  transmission at body-wall neuromuscular junctions. LEV-1-containing receptors also occur in
  neurons and contribute to levamisole-stimulated egg laying.
