      of CHC is necessary and sufficient for clathrin self-assembly into triskelia and also provides the
      binding interface for CLC ( 13 ).
  - reference_id: PMID:22342749
    supporting_text: Here we show that localization of the clathrin light chain, AP-2 clathrin adaptor,
