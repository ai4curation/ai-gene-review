- description: CLIC-1 binds the hub domain of clathrin heavy chain CHC-1 as the light chain of the triskelion,
    stabilising and regulating assembly of the clathrin lattice that coats plasma-membrane pits (including
    the periciliary endocytic compartment) and TGN/endosomal vesicles.
