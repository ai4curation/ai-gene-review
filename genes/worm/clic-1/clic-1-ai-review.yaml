  title: Differential requirements for clathrin in receptor-mediated endocytosis and maintenance of synaptic
    vesicle pools.
  findings:
  - statement: Triskelia contain three heavy and three light chains; the CHC hub binds CLC; CLC is dispensable
      for endocytosis but contributes to other clathrin steps.
    supporting_text: Recent reports indicate that clathrin light chain (CLC) is not required for endocytosis
      but rather contributes to other clathrin-mediated trafficking steps ( 10 ).
