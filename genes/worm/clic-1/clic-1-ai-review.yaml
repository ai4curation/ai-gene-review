gene_symbol: clic-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: clic-1 encodes the clathrin light chain of Caenorhabditis elegans. Light chains bind through
  a central coiled-coil region to the hub domain of clathrin heavy chain (CHC-1), one light chain per
  leg of the triskelion, and modulate the flexibility, assembly and disassembly of the polyhedral clathrin
  lattice that coats clathrin-coated pits at the plasma membrane and clathrin-coated vesicles budding
  from the trans-Golgi network and endosomes. In worms, CLIC-1 is found with AP-2, dynamin and RAB-5 at
  the periciliary membrane compartment at the base of sensory cilia, where clathrin-mediated membrane
  retrieval controls ciliary membrane volume, and with CHC-1 in apical epidermal coated structures. Consistent
  with light chains being accessory rather than essential for coat formation, loss of clic-1 is much milder
  than loss of the heavy chain.
