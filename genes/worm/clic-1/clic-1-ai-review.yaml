      epidermal structures.
    supporting_text: 'CHC-1 is genetically much more essential: *chc-1* RNAi or temperature-sensitive
      inactivation disrupts endocytosis and viability, whereas CLIC-1 loss alone is comparatively mild.'
- id: file:worm/clic-1/clic-1-deep-research-falcon.md
  title: Deep research report (falcon/Edison) on C. elegans clic-1
  findings:
  - statement: 'Deep research: clic-1 alone is dispensable but clic-1 RNAi is synthetically lethal with
      chc-1(ts); CLIC-1::GFP marks the periciliary membrane compartment and apical epidermal puncta.'
    supporting_text: whereas *clic-1* RNAi in a temperature-sensitive *chc-1* background caused embryonic
      lethality even at the normally permissive temperature
