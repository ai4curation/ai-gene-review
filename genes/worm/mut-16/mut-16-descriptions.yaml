  source_id: WB:WBGene00003508
- source: Alliance_Automated
  text: Involved in regulatory ncRNA-mediated post-transcriptional gene silencing
    and siRNA processing. Located in cytoplasm and nucleus. Is active in mutator focus.
    Is expressed in several structures, including germ cell; germ line; and somatic
    cell.
