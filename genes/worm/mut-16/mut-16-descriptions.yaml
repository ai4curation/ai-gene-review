descriptions:
- source: Alliance_Imported
  text: mut-16 encodes a glutamine/asparagine (Q/N)-rich domain-containing protein
    that lacks obvious homologs outside of other nematode species; MUT-16 activity
    is required for RNA-mediated interference (RNAi), transgene silencing in germ-line
    and somatic tissues, and for maintaining low levels of transposon mobilization;
    MUT-16 is thus predicted to play a role in chromatin organizataion and/or regulation
    of gene expression.
