descriptions:
- source: UniProt
  text: Probably mediates the hydrolysis of some nucleoside diphosphate derivatives.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O61902
  source_id: O61902
- source: Alliance_Imported
  text: ndx-2 encodes a NUDIX hydrolase; by sequence comparison, NDX-2 is predicted
    to be orthologous to human NUDT5 which, in vitro, possesses ADP-sugar diphosphatase
    activity; in C. elegans, loss of ndx-2 activity via RNA-mediated interference
    (RNAi) does not result in any obvious abnormalities, consistent with the proposed
    nonessential roles for Nudix proteins in eliminating potentially toxic nucleotide
    metabolites from cells and modulating levels of metabolic intermediates by shuttling
    them into alternative biochemical pathways.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003579;class=Gene
  source_id: WB:WBGene00003579
- source: Alliance_Automated
  text: Predicted to enable ADP-ribose diphosphatase activity. Predicted to be involved
    in nucleoside phosphate metabolic process and ribose phosphate metabolic process.
    Predicted to be active in nucleus. Orthologous to human NUDT5 (nudix hydrolase
    5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003579;class=Gene
  source_id: WB:WBGene00003579
