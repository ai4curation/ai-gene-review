core_functions:
- description: >-
    Hydrolysis of ADP-ribose (and probably other ADP-sugars) to AMP and ribose 5-phosphate,
    inferred from conservation with human NUDT5 and yeast YSA1 in the ADP-sugar
    pyrophosphatase subfamily; not yet tested for the worm enzyme.
  molecular_function:
    id: GO:0047631
    label: ADP-ribose diphosphatase activity
  supported_by:
  - reference_id: GO_REF:0000033
  - reference_id: PMID:24435662
    supporting_text: >-
      C. elegans NDX-2 is predicted to be an ADP sugar diphosphatase orthologous to human
      NUDT5.
- description: >-
    Hydrolysis of 8-oxo-dGDP to 8-oxo-dGMP and phosphate, without activity on 8-oxo-dGTP;
    unoxidised dGDP is hydrolysed equally well, so this activity is not selective for the
    oxidised nucleotide.
  molecular_function:
    id: GO:0044715
    label: 8-oxo-dGDP phosphatase activity
  supported_by:
  - reference_id: PMID:24435662
    supporting_text: >-
      As shown in Figure 1B , NDX-2 degraded 8-oxo-dGDP to its monophosphate form, and
      hydrolysis of 8-oxo-dGTP was hardly detected.
  - reference_id: PMID:24435662
    supporting_text: >-
      NDX-2 can hydrolyze normal dGDP as efficiently as 8-oxo-dGDP ( Table I ).
- description: >-
    Hydrolysis of the ribonucleotide 8-oxo-GDP to 8-oxo-GMP and phosphate, with about
    5-fold preference over unoxidised GDP and no activity on 8-oxo-GTP; this is NDX-2's
    one measured activity that discriminates in favour of the oxidised nucleotide.
  molecular_function:
    id: GO:0044716
    label: 8-oxo-GDP phosphatase activity
  supported_by:
  - reference_id: PMID:24435662
    supporting_text: >-
      As shown in Figure 1C and Table I , NDX-1 and NDX-2 showed 8-oxo-GDPase activity.
  - reference_id: PMID:24435662
    supporting_text: >-
      Under the same conditions, hydrolysis of 8-oxo-GTP by NDX-2 was hardly detected.
  - reference_id: file:worm/ndx-2/ndx-2-notes.md
    supporting_text: >-
      dGDP 66.4%, 8-oxo-dGDP 54.4%, 8-oxo-GDP 25.2%, GDP 5.40%
suggested_questions:
- question: >-
    Does NDX-2 hydrolyse ADP-ribose and other ADP-sugars as NUDT5 and YSA1 do, and is that
    or guanine nucleoside diphosphate hydrolysis its main activity in the worm?
- question: >-
    Since NDX-2 hydrolyses dGDP and 8-oxo-dGDP equally, does it lower dGDP and dGTP pools in
    vivo, and is the oxidative-stress sensitivity of ndx-2 RNAi worms due to 8-oxo-dGDP
    accumulation, a nucleotide-pool imbalance, or ADP-ribose accumulation?
suggested_experiments:
- description: >-
    Measure steady-state kinetics of purified NDX-2 on ADP-ribose, other ADP-sugars, dGDP,
    8-oxo-dGDP and 8-oxo-GDP to establish its preferred substrate.
- description: >-
    Make an ndx-2 deletion allele (rather than RNAi) and measure ADP-ribose and
    8-oxo-(d)GDP/(d)GTP levels by LC-MS/MS, with and without ndx-1 loss, under basal and
    oxidative-stress conditions.
