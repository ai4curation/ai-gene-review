id: O61902
gene_symbol: ndx-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ndx-2 (W02G9.1) encodes a 223-residue Nudix hydrolase of the NUDT5 / ADP-sugar
  pyrophosphatase family, the worm counterpart of human NUDT5 and yeast YSA1, which hydrolyse
  ADP-ribose and other ADP-sugars and also dephosphorylate 8-oxo-dGDP. Purified NDX-2
  removes the terminal phosphate from guanine nucleoside diphosphates: it hydrolyses
  8-oxo-dGDP to 8-oxo-dGMP and normal dGDP equally well, prefers 8-oxo-GDP about 5-fold over
  GDP, and does not act on 8-oxo-dGTP or other triphosphates. Its 8-oxo-dGDP phosphatase
  activity is lower than that of NDX-1, and expressing it in an E. coli mutT mutant only
  partly suppresses the mutator phenotype. Activity on ADP-ribose, the characteristic
  substrate of the family, has not been tested for the worm enzyme. In C. elegans, ndx-2
  RNAi makes developing worms more sensitive to the superoxide generators methyl viologen
  and menadione bisulphite, a growth delay that depends on the chk-2 / clk-2 DNA-damage
  checkpoint, and ndx-1 and ndx-2 appear to back each other up. Expression and subcellular
  localization of NDX-2 have not been reported.
