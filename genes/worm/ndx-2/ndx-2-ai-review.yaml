    label: 8-oxo-dGDP phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:24435662
  qualifier: enables
  review:
    summary: >-
      Purified NDX-2 converts 8-oxo-dGDP to 8-oxo-dGMP, with little or no activity on
      8-oxo-dGTP. It hydrolyses unoxidised dGDP equally well, and its 8-oxo-dGDP activity
      is lower than that of NDX-1.
    action: NEW
    reason: >-
      Direct assay of the purified worm protein, not in GOA. The term matches the reaction
      measured. NDX-2 does not discriminate between dGDP and 8-oxo-dGDP, so this activity
      should not be read as a selective oxidised-nucleotide sanitiser. The broader parent
      GO:0017110 nucleoside diphosphate phosphatase activity is not proposed alongside it,
      to avoid an ancestor/descendant pair.
    supported_by:
    - reference_id: PMID:24435662
      supporting_text: >-
        As shown in Figure 1B , NDX-2 degraded 8-oxo-dGDP to its monophosphate form, and
        hydrolysis of 8-oxo-dGTP was hardly detected.
    - reference_id: PMID:24435662
      supporting_text: >-
        NDX-2 can hydrolyze normal dGDP as efficiently as 8-oxo-dGDP ( Table I ).
