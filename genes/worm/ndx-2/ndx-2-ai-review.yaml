  review:
    summary: >-
      Phylogenetic inference from the NUDT5/YSA1 clade node PTN000217303, seeded by human
      NUDT5 and yeast YSA1 (Q01976), both characterised ADP-ribose pyrophosphatases.
    action: ACCEPT
    reason: >-
      A sound clade-level inference. NDX-2 sits in the ADP-sugar pyrophosphatase subfamily
      (PTHR11839:SF1), the 2014 study calls it a NUDT5 orthologue, and nothing suggests the
      activity was lost. Its measured 8-oxo-dGDP phosphatase activity, a second NUDT5
      activity, is also conserved. ADP-ribose hydrolysis itself has not been assayed for the
      worm enzyme; that is listed as a suggested experiment.
    supported_by:
    - reference_id: PMID:24435662
      supporting_text: >-
