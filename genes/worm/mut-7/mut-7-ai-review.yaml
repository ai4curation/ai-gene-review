suggested_questions:
- question: 'What does MUT-7 degrade in Mutator foci: the 3'' ends of target RNA fragments before or after
    pUGylation, abortive RdRP products, or something else? Recombinant MUT-7 trims an A-tail but cannot
    degrade a folded pUG unit.'
- question: What is the function of the nuclear MUT-7 complex, which lacks RDE-2?
suggested_experiments:
- description: Map MUT-7-dependent RNA 3' ends in vivo (e.g. 3'-end sequencing of pUG RNAs and RdRP products)
    in wild type, catalytic-dead mut-7 and mut-8 interface mutants.
  hypothesis: MUT-7 trims specific RNA intermediates in Mutator foci, and this trimming is needed for
    efficient RRF-1-dependent 22G-RNA synthesis.
