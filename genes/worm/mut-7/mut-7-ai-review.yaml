id: P34607
gene_symbol: mut-7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MUT-7 is a C. elegans 3'-5' exoribonuclease of the MUT-7/EXD3 family (RNase D-like DEDDy
  exonuclease domain plus a C-terminal MUT7-C domain), related to the exonuclease domain of the Werner
  syndrome protein and to Drosophila Nibbler. It is a core Mutator-class protein. Through its MUT7-C domain
  insertion it binds RDE-2/MUT-8, which links it to the scaffold MUT-16 and recruits it to perinuclear
  germline Mutator foci, where it supports amplification of secondary 22G siRNAs. Recombinant MUT-7 degrades
  single-stranded RNA 3'-to-5' in a metal-dependent way, and the MUT7-C domain contributes to RNA binding.
  MUT-7 is required for germline transposon silencing, exogenous RNAi and endogenous 22G and ERGO-1 class
  26G siRNA pathways. Its precise substrate in the Mutator pathway is not known. MUT-7 is found in both
  cytosol and nucleus. In AWC olfactory neurons it acts with HPL-2 in the endogenous nuclear RNAi that
  mediates odor adaptation.
