- molecular_function:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  description: Metal-dependent 3'-5' exoribonuclease acting on single-stranded RNA. It is recruited to
    Mutator foci by RDE-2/MUT-8 and MUT-16, and its activity is required for 22G siRNA amplification.
    Its physiological substrate is not known.
