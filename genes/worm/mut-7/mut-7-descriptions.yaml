    overall_notes: Correct list of transposon, RNAi, co-suppression and sperm phenotypes;
      'perhaps by degrading transposon messages' is dated and the RDE-2/MUT-16 recruitment
      and 22G amplification role are missing.
- source: Alliance_Imported
  text: mut-7 encodes a homolog of RnaseD that represses transposition of Tc1, Tc3,
    Tc4, and Tc5, perhaps by degrading transposon-specific messages; also affects
    sperm development, sensitivity to RNAi of mainly germline expressed genes, silencing
    of some germline transgenes, X chromosome loss, and is required for cosuppression
    (functional silencing of chromosomal loci induced by transgenes) and for silencing
    induced by antisense RNA oligomers; cellular fractionation experiments indicate
    that MUT-7 is expressed in adult worms, and resides in a complex in both the cytosol
    and nucleus; in the cytosolic complex, MUT-7 interacts with RDE-2, a novel protein
    also required for RNA interference.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003504;class=Gene
  source_id: WB:WBGene00003504
