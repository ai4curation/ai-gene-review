gene_symbol: mut-7
organism: worm
uniprot_id: P34607
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Represses the transposition of Tc1, Tc3, Tc4, and Tc5, perhaps by degrading
    transposon-specific messages. Also affects sperm development, sensitivity to RNAi
    of mainly germline expressed genes, silencing of some germline transgenes, X chromosome
    loss, and is required for cosuppression (functional silencing of chromosomal loci
    induced by transgenes) and for silencing induced by antisense RNA oligomers.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34607
  source_id: P34607
- source: Alliance_Imported
  text: mut-7 encodes a homolog of RnaseD that represses transposition of Tc1, Tc3,
    Tc4, and Tc5, perhaps by degrading transposon-specific messages; also affects
    sperm development, sensitivity to RNAi of mainly germline expressed genes, silencing
    of some germline transgenes, X chromosome loss, and is required for cosuppression
    (functional silencing of chromosomal loci induced by transgenes) and for silencing
    induced by antisense RNA oligomers; cellular fractionation experiments indicate
    that MUT-7 is expressed in adult worms, and resides in a complex in both the cytosol
    and nucleus; in the cytosolic complex, MUT-7 interacts with RDE-2, a novel protein
    also required for RNA interference.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003504;class=Gene
  source_id: WB:WBGene00003504
- source: Alliance_Automated
  text: Predicted to enable 3'-5'-exoribonuclease activity involved in mature miRNA
    3'-end processing and single-stranded DNA 3'-5' DNA exonuclease activity. Involved
    in olfactory learning and regulatory ncRNA-mediated post-transcriptional gene
    silencing. Located in cytosol and nucleus. Is active in mutator focus. Is expressed
    in several structures, including head neurons; intestine; rectal gland cell; reproductive
    system; and somatic cell. Orthologous to human EXD3 (exonuclease 3'-5' domain
    containing 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003504;class=Gene
  source_id: WB:WBGene00003504
