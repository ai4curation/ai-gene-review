core_functions:
- description: Type I BMP receptor kinase that, with DAF-4, transduces DBL-1 signals 
    from the basolateral plasma membrane of hypodermal and other epithelial cells to the
    Smads SMA-2/3/4, controlling body size and male tail development.
  molecular_function:
    id: GO:0098821
    label: BMP receptor activity
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  - id: GO:0040018
    label: positive regulation of multicellular organism growth
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0070724
    label: BMP receptor complex
  supported_by:
  - reference_id: PMID:9847239
    supporting_text: We have cloned and characterized a novel type I receptor and show 
      that it is encoded by sma-6
  - reference_id: PMID:9847239
    supporting_text: Mutations in sma-6 generate the reduced body size (Sma) and 
      abnormal mail tail (Mab) phenotypes identical to those observed in daf-4 and 
      sma-2, sma-3, sma-4 mutants (C. elegans Smads), indicating that they function in a
      common signaling pathway
  - reference_id: PMID:11784045
    supporting_text: hypodermal expression of SMA-6 is necessary and sufficient for the 
      growth and maintenance of body length
  - reference_id: PMID:24550286
    supporting_text: We found that both SMA-6::GFP and DAF-4::GFP, visualized in 
      otherwise wild-type intact living animals, localized to the basolateral plasma 
      membrane, where they are in position to receive signaling molecules secreted by 
      neurons
suggested_questions:
- question: Does SMA-6 bind DBL-1 directly with measurable affinity, and how do SMA-10, 
    tetraspanins and DRAG-1 change ligand-receptor complex assembly?
- question: How is SMA-6 signaling to the Smads separated from the R-Smad-independent 
    output in g1 gland cell morphology?
suggested_experiments:
- description: Show in vitro, with purified receptor kinase, that SMA-6 phosphorylates 
    the C-terminal SSXS motifs of SMA-2/SMA-3, and that DAF-4 phosphorylates the SMA-6 
    GS domain.
  hypothesis: SMA-6 is the direct R-Smad kinase of the Sma/Mab pathway, as for 
    vertebrate BMPR1.
