  review:
    summary: IBA asserting activin type I receptor activity.
    action: MODIFY
    reason: SMA-6 is a type I receptor kinase, so the receptor-kinase part of the IBA is
      sound. Its ligand is the BMP-like DBL-1 [PMID:9847239, PMID:12051826], and C. 
      elegans has no activin. BMP receptor activity is the correct ligand-specific term.
    proposed_replacement_terms:
    - id: GO:0098821
      label: BMP receptor activity
    supported_by:
    - reference_id: PMID:9847239
      supporting_text: We have cloned and characterized a novel type I receptor and show
        that it is encoded by sma-6
    - reference_id: PMID:12051826
      supporting_text: The ligand of the pathway, dbl-1, transmits its signal through 
        two receptor serine threonine kinases, daf-4 and sma-6
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000583887
        source_label: PTN000583887
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Activin/TGF-beta type I receptor node (Babo/ALK4/5/7-like). SMA-6 
          signals for the BMP-like ligand DBL-1, and C. elegans has no activin ligand, 
          so the activin-specific part of the term does not transfer.
      failure_modes:
