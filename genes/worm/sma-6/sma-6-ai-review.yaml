id: Q09488
gene_symbol: sma-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'SMA-6 is the type I serine/threonine receptor kinase of the DBL-1 BMP-like Sma/Mab
  pathway in C. elegans. It is a single-pass transmembrane protein with an extracellular ligand-binding
  domain, a GS domain and a cytoplasmic kinase domain. Together with the shared type II receptor
  DAF-4, it receives the neuronally secreted ligand DBL-1 and phosphorylates the R-Smads SMA-2
  and SMA-3, which act with the co-Smad SMA-4 to regulate transcription. SMA-6 is expressed
  mainly in the hypodermis, pharynx and intestine and sits at the basolateral plasma membrane.
  Hypodermal expression is necessary and sufficient for normal body length. Receptor levels
  and signaling depend on AP-2-mediated endocytosis and retromer-dependent recycling, and
  SMA-10/LRIG, tetraspanins and DRAG-1/UNC-40 promote signaling at the receptor level. sma-6
  mutants are small and males have abnormal tails, but they are not dauer-constitutive. Pathway
  outputs also include antimicrobial peptide expression, M-lineage patterning and pharyngeal
  gland morphology.'
