gene_symbol: sma-6
organism: worm
uniprot_id: Q09488
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase receptor which binds TGF- beta-like ligands
    dbl-1 and perhaps daf-7 (PubMed:24004951, PubMed:9847239). Upon ligand binding,
    probably activates a TGF-beta- like signaling pathway (PubMed:24004951, PubMed:9847239).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09488
  source_id: Q09488
- source: Alliance_Imported
  text: sma-6 encodes a serine/threonine protein kinase that is orthologous to type
    I TGF-beta receptors; sma-6 activity is required for regulating body length and
    for proper development of the male tail; sma-6, along with other genes in the
    TGF-beta Sma/Mab pathway, also regulates reproductive aging; a reduction of TGF-beta
    pathway genes extends reproductive span by maintaining oocyte and germline quality;
    sma-6 expression first begins at the 1.5-fold stage of embryogenesis and continues
    through adulthood; sma-6 is expressed in dorsal and ventral hypodermis, pharyngeal
    muscle, and the intestine; expression in the hypodermis is necessary and sufficient
    for body length regulation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004860;class=Gene
  source_id: WB:WBGene00004860
- source: Alliance_Automated
  text: Enables BMP binding activity. Involved in several processes, including maintenance
    of protein location in nucleus; nematode male tail tip morphogenesis; and positive
    regulation of transforming growth factor beta receptor signaling pathway. Predicted
    to be located in membrane and nucleus. Predicted to be part of activin receptor
    complex. Predicted to be active in plasma membrane. Is expressed in several structures,
    including ASI; hypodermis; intestine; pharynx; and tail. Human ortholog(s) of
    this gene implicated in several diseases, including Loeys-Dietz syndrome 1; bone
    development disease (multiple); disease of cellular proliferation (multiple);
    glaucoma (multiple); and intestinal disease (multiple). Orthologous to several
    human genes including BMPR1B (bone morphogenetic protein receptor type 1B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004860;class=Gene
  source_id: WB:WBGene00004860
