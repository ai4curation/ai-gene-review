- source: UniProt
  text: Serine/threonine-protein kinase receptor which binds TGF- beta-like ligands
    dbl-1 and perhaps daf-7 (PubMed:24004951, PubMed:9847239). Upon ligand binding,
    probably activates a TGF-beta- like signaling pathway (PubMed:24004951, PubMed:9847239).
