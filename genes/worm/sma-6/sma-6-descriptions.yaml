    overall_notes: Correct type I receptor for body length and male tail, hypodermal
      sufficiency, expression pattern, reproductive aging.
- source: Alliance_Automated
  text: Enables BMP binding activity. Involved in several processes, including maintenance
    of protein location in nucleus; nematode male tail tip morphogenesis; and positive
    regulation of transforming growth factor beta receptor signaling pathway. Predicted
    to be located in membrane and nucleus. Predicted to be part of activin receptor
    complex. Predicted to be active in plasma membrane. Is expressed in several structures,
    including ASI; hypodermis; intestine; pharynx; and tail. Human ortholog(s) of
    this gene implicated in several diseases, including Loeys-Dietz syndrome 1; bone
    development disease (multiple); disease of cellular proliferation (multiple);
    glaucoma (multiple); and intestinal disease (multiple). Orthologous to several
    human genes including BMPR1B (bone morphogenetic protein receptor type 1B).
