- source: Alliance_Imported
  text: sma-6 encodes a serine/threonine protein kinase that is orthologous to type
    I TGF-beta receptors; sma-6 activity is required for regulating body length and
    for proper development of the male tail; sma-6, along with other genes in the
    TGF-beta Sma/Mab pathway, also regulates reproductive aging; a reduction of TGF-beta
    pathway genes extends reproductive span by maintaining oocyte and germline quality;
    sma-6 expression first begins at the 1.5-fold stage of embryogenesis and continues
    through adulthood; sma-6 is expressed in dorsal and ventral hypodermis, pharyngeal
    muscle, and the intestine; expression in the hypodermis is necessary and sufficient
    for body length regulation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004860;class=Gene
  source_id: WB:WBGene00004860
