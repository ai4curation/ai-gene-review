taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: che-11 encodes a large, unfamiliar protein with orthologs in vertebrates and
    arthropods (e.g., KIAA0590 and CG11838-PA) and in Chlamydomonas (IFT140), as well
    as distant similarity to OSM-1 and ZK520.1; che-11 is required for normal synthesis
    of sensory cilia (via intraflagellar transport) in sensory neurons, osmotic avoidance,
    and dauer formation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000490;class=Gene
  source_id: WB:WBGene00000490
- source: Alliance_Automated
  text: Involved in several processes, including dauer entry; determination of adult
    lifespan; and positive regulation of intracellular transport. Located in non-motile
    cilium. Is expressed in body wall musculature; head; and neurons. Human ortholog(s)
    of this gene implicated in autosomal dominant polycystic kidney disease; cranioectodermal
    dysplasia; retinitis pigmentosa 80; and short-rib thoracic dysplasia 9 with or
    without polydactyly. Orthologous to human IFT140 (intraflagellar transport 140).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000490;class=Gene
  source_id: WB:WBGene00000490
