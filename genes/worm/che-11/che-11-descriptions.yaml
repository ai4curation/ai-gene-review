descriptions:
- source: Alliance_Imported
  text: che-11 encodes a large, unfamiliar protein with orthologs in vertebrates and
    arthropods (e.g., KIAA0590 and CG11838-PA) and in Chlamydomonas (IFT140), as well
    as distant similarity to OSM-1 and ZK520.1; che-11 is required for normal synthesis
    of sensory cilia (via intraflagellar transport) in sensory neurons, osmotic avoidance,
    and dauer formation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000490;class=Gene
  source_id: WB:WBGene00000490
