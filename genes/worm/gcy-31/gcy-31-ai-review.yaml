- term:
    id: GO:0038060
    label: nitric oxide-cGMP-mediated signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0038295
  - PANTHER:PTN002276750
  review:
    summary: Nitric oxide-cGMP-mediated signaling (IBA, PTN002276750). The term is defined
      as signaling initiated by NO activating sGC, including NO synthesis.
    action: REMOVE
    reason: C. elegans lacks a nitric oxide synthase, and GCY-31 belongs to the atypical O2-regulated
      sGC clade whose physiological ligand is molecular O2, not NO. In vivo, these sGCs mediate
      O2-evoked responses. Although the isolated H-NOX domain of the related GCY-33 can bind
      NO in vitro, there is no NO-cGMP signaling pathway in the worm; the IBA reflects the
      vertebrate NO-sensitive sGC ancestry and is over-propagated to this lineage.
    supported_by:
    - reference_id: PMID:19323996
      supporting_text: BAG sensory neurons are activated by decreases in O2 levels, and require
        the sGCs gcy-31 and gcy-33.
    - reference_id: PMID:19323996
      supporting_text: We suggest that O2 downshifts increase cGMP production by GCY-31 and
        GCY-33, allowing opening of the cGMP-gated cation channel encoded by tax-4 and depolarization
        of BAG neurons.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002276750
        source_label: PTN002276750
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded by a Drosophila sGC (FB:FBgn0038295); NO-cGMP signaling may be
          valid in flies, which have NOS, but C. elegans has no NOS and its beta3-like sGCs
          function as O2 sensors.
