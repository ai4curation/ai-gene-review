id: Q86C56
gene_symbol: gcy-31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: GCY-31 is an atypical soluble guanylate cyclase (sGC) subunit of Caenorhabditis
  elegans of the beta3-like clade (related to Drosophila Gyc-88E), with an H-NOX heme domain,
  an HNOB-associated domain, a coiled coil and a C-terminal guanylate cyclase domain. It is
  expressed strongly in the BAG gas-sensing neurons, where together with GCY-33 (probably
  as a heterodimer) it is required for BAG activation by a decrease in O2. A fall in O2 is
  thought to relieve O2 inhibition of the heme-regulated cyclase, raising cGMP and opening
  TAX-2/TAX-4 cGMP-gated channels. GCY-31 is required for O2-downshift locomotory responses
  and starvation-enhanced hyperoxia avoidance, but not for BAG CO2 sensing, which uses the
  receptor guanylyl cyclase GCY-9. Three splice isoforms are annotated.
