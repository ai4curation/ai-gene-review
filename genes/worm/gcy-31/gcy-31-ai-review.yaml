  review:
    summary: GCY-31 is an atypical soluble guanylate cyclase with an H-NOX heme domain and
      a C-terminal class III nucleotidyl cyclase domain; the PAINT node (PTN002902243) covers
      the whole sGC clade, which uniformly synthesizes cGMP.
    action: ACCEPT
    reason: Guanylate cyclase activity is the core catalytic activity. In vivo, O2-evoked
      responses in BAG require GCY-31 and are carried by cGMP-gated TAX-2/TAX-4 channels;
      the catalytic-domain residues are conserved. Direct in vitro reconstitution of the worm
      enzyme has not been reported, but the IBA is the right level of specificity.
    supported_by:
    - reference_id: PMID:19323996
      supporting_text: BAG sensory neurons are activated by decreases in O2 levels, and require
        the sGCs gcy-31 and gcy-33.
    - reference_id: PMID:19323996
      supporting_text: sGCs are a class of enzymes that bind gases through heme-nitric oxide
        and oxygen binding (H-NOX) domains and synthesize the second messenger cGMP from GTP.
    - reference_id: PMID:19323996
      supporting_text: Testing these models will require biochemical reconstitution of C.
        elegans sGC activity, which has not yet been accomplished.
