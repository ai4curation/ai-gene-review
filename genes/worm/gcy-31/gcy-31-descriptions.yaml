- source: UniProt
  text: Synthesizes cyclic GMP (cGMP) from GTP. May play a role in embryogenesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86C56
  source_id: Q86C56
- source: Alliance_Imported
  text: gcy-31 encodes a soluble guanylyl cyclase; GCY-31 activity is required in
    the ciliated BAG head sensory neurons to sense decreases in O2 levels and effect
    corresponding behavioral changes; a gcy-31::GFP reporter is expressed in the BAG
    neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001551;class=Gene
  source_id: WB:WBGene00001551
- source: Alliance_Automated
  text: Enables oxygen sensor activity. Involved in response to oxygen levels. Predicted
    to be located in cytoplasm. Predicted to be part of guanylate cyclase complex,
    soluble. Is expressed in BAGL; BAGR; and head.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001551;class=Gene
