descriptions:
- source: Alliance_Imported
  text: dyf-11 encodes a conserved protein that is orthologous to mammalian IFT54
    (MIP-T3, Traf3ip1) and that contains a lysine-rich region and a C-terminal coiled-coil
    domain present in a number of intraflagellar transport complex B (IFT-B) proteins;
    DYF-11 activity is required continuously in sensory neurons for formation of medial
    and distal ciliary segments and thus, for normal sensory cilium morphology and
    function and chemotaxis;  DYF-11 physically interacts with DYF-19, the C. elegans
    FBF1 (Fas(TNFRSF6)-binding factor 1) ortholog that localizes to ciliary transition
    fibers; a dyf-11::gfp promoter fusion is expressed in all ciliated sensory neurons
    as well as in the AQR, PQR, ADE, and PDR neurons; a DYF-11::GFP protein fusion
    is detected throughout the cilium and localizes to IFT-B subcomplexes in a manner
    consistent with an early role in IFT-B subcomplex assembly; dyf-11 expression
    in ciliated neurons is dependent upon the presence of the DAF-19 RFX transcription
    factor.
