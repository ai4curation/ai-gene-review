  text: Predicted to enable microtubule binding activity. Involved in several processes,
    including cilium organization; dauer entry; and hyperosmotic response. Located
    in axoneme and ciliary basal body. Part of intraciliary transport particle B.
    Is expressed in intestine and nervous system. Human ortholog(s) of this gene implicated
    in Senior-Loken syndrome 9. Orthologous to human IFT54 (intraflagellar transport
    54).
