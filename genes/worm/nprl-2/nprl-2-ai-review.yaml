  review:
    summary: As a GATOR1 subunit, NPRL-2 contributes to the complex's GAP activity toward
      the RagA/B GTPases.
    action: ACCEPT
    reason: The GAP activity is a property of the GATOR1 complex, executed through the
      NPRL2-NPRL3 heterodimer contacting RAGA; NPRL2 alone is not shown to be a GAP, so the
      contributes_to qualifier is the right form. The IBA node places this activity on the
      NPR2 family; C. elegans NPRL-2 is a single-copy family member with no evidence of
      divergence. There is no worm biochemistry, but the phylogenetic inference is sound.
    supported_by:
    - reference_id: PMID:29590090
      supporting_text: weaker interactions between the NPRL2-NPRL3 heterodimer and RAGA
        execute GAP activity
    - reference_id: PMID:23723238
      supporting_text: GATOR1 has GTPase-activating protein (GAP) activity for RagA and
        RagB
