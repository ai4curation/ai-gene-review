  review:
    summary: Conserved role of GATOR1 in shutting off TORC1 upon amino-acid withdrawal;
      not tested directly in C. elegans.
    action: KEEP_AS_NON_CORE
    reason: Loss of GATOR1 subunits makes TORC1 signalling resistant to amino-acid
      deprivation in human cells and Nprl2 mediates the adaptive starvation response in
      Drosophila, so the IBA is well founded. It is the physiological context of the core
      activity (TORC1 inhibition) rather than a separate function, and worm experiments
      addressed lipid (d17iso-GlcCer) rather than amino-acid signalling.
    supported_by:
    - reference_id: PMID:23723238
      supporting_text: Inhibition of GATOR1 subunits (DEPDC5, Nprl2, and Nprl3) makes
        mTORC1 signaling resistant to amino acid deprivation.
    - reference_id: PMID:24786828
      supporting_text: The TORC1 inhibitors Nprl2 and Nprl3 mediate an adaptive response
        to amino-acid starvation in Drosophila.
