id: W6RQZ3
gene_symbol: nprl-2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  nprl-2 (F49E8.1) encodes the C. elegans member of the NPR2/NPRL2 family, the ortholog
  of yeast Npr2 and human NPRL2. By orthology it is a subunit of GATOR1 (with NPRL-3 and
  a DEPDC5-like subunit), the complex that acts as a GTPase-activating protein for the
  RagA/B GTPases at the lysosomal surface and thereby switches off amino-acid signalling
  to TORC1. In C. elegans the evidence is genetic: RNAi of nprl-2, like loss of nprl-3,
  bypasses the L1 growth arrest caused by loss of monomethyl branched-chain fatty acids
  or their derived glucosylceramide, a checkpoint that requires TORC1 activity, placing
  NPRL-2/3 as negative regulators of nutrient/lipid-promoted TORC1 signalling. nprl-2
  knockdown has also been reported to reduce basal and starvation-induced autophagy in
  some genetic backgrounds.
