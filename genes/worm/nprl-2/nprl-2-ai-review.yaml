    supporting_text: weaker interactions between the NPRL2-NPRL3 heterodimer and RAGA
      execute GAP activity
  - reference_id: PMID:23705068
    supporting_text: These results led to the conclusion that TORC1 acts downstream of
      d17iso-GlcCer to promote L1 growth and development and that this activity is
      negatively regulated by NPRL-2/3.
suggested_questions:
- question: Does C. elegans GATOR1 reach the lysosomal surface through a KICSTOR-like
    recruiter, or by another mechanism, given that worm NPRL-2 localization has not been
    examined?
- question: Is the regulation of intestinal apical polarity attributed to NPRL-3 a
    Rag-GAP-dependent consequence of TORC1 inhibition or a separate activity, and does
    NPRL-2 share it?
- question: Is worm NPRL-2 phosphorylated and regulated by LET-92/PP2A as proposed from
    the yeast Npr2 model?
suggested_experiments:
- description: Endogenously tag NPRL-2 (e.g. CRISPR knock-in GFP) and examine
    co-localization with lysosomal markers in the intestine under fed and amino-acid
    deprived conditions.
  experiment_type: localization
- description: Test a nprl-2 null allele for TORC1 hyperactivity (e.g. phospho-S6K
    readouts) and for the TORC1-dependence of its suppression of elo-5 L1 arrest, as was
    done for nprl-3.
  experiment_type: genetic epistasis
- description: Reconstitute worm NPRL-2/NPRL-3 (with the DEPDC5-like subunit) and assay
    GAP activity on RAGA-1, including mutation of the conserved NPRL2 arginine finger.
  experiment_type: biochemical assay
