    summary: The vacuolar membrane location comes from yeast and human seeds; in a metazoan
      the corresponding compartment is the lysosomal membrane.
    action: MODIFY
    reason: The IBA propagates a yeast vacuolar-membrane location; the metazoan seeds
      (human NPRL2, fly Nprl2) are lysosomal, and in animals the lytic vacuole is the
      lysosome. Lysosomal membrane (is_a vacuolar membrane) is the precise term for a
      metazoan ortholog. No C. elegans localization data exist for NPRL-2, and whether
