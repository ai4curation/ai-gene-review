      elo-5 mutants, phenocopying nprl-3(ku540).
    supporting_text: nprl-2 dsRNA injection also rescued 42.4% of elo-5(−) animals to or
      beyond L3 stage (n = 128)
  - statement: NPRL-2/3 negatively regulate d17iso-GlcCer-promoted TORC1 activity (TORC1
      epistasis shown with nprl-3).
    supporting_text: These results led to the conclusion that TORC1 acts downstream of
      d17iso-GlcCer to promote L1 growth and development and that this activity is
      negatively regulated by NPRL-2/3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Only C. elegans paper with an nprl-2 loss-of-function
      result relevant to TORC1; nprl-2 data are a single RNAi experiment, the rest of the
