core_functions:
- description: As a predicted core subunit of GATOR1, NPRL-2 forms a heterodimer with
    NPRL-3 that executes GAP activity toward the RagA/B GTPases at the lysosomal surface,
    thereby inhibiting nutrient- and lipid-promoted TORC1 signalling. In C. elegans this
    restrains the d17iso-GlcCer/TORC1-dependent L1 growth programme.
  contributes_to_molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
