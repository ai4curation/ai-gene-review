  label: Caenorhabditis elegans
description: >-
  IFT-43 is the Caenorhabditis elegans ortholog of IFT43, the smallest subunit of
  intraflagellar transport complex A (IFT-A). It is a short (200 aa) protein with
  no known catalytic domain. IFT-43 is expressed in ciliated sensory neurons,
  localizes to the sensory cilium and co-purifies with IFT-A. On its own, loss of
  ift-43 causes no obvious defect in cilium morphology. IFT-43 acts redundantly
  with the IFT-A subunit IFT-139: ift-139; ift-43 double mutants have defective
  cilia, and the two proteins together promote motility of the retrograde motor
  dynein-2 (CHE-3). IFT-43 is also one of the IFT-A subunits, with IFTA-1 and
  IFT-139, needed to remove periciliary membrane proteins from the cilium
  (transition-zone gating). Human IFT43 mutations cause cranioectodermal
  dysplasia and retinal dystrophy.
