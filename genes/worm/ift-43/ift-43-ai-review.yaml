knowledge_gaps:
- gap_statement: >-
    What IFT-43 does on its own is unknown. It is dispensable for cilium shape
    when IFT-139 is present, yet it is needed to clear periciliary membrane
    proteins from cilia. Whether this reflects a distinct cargo-handling role or
    only a weakened IFT-A2 lobe has not been tested.
  boundary: >-
    Established: IFT-A membership, redundancy with IFT-139 for dynein-2 motility
    and cilium morphology, and a role in ciliary gating. Unknown: the direct
    partners of IFT-43 in the worm and the mechanism of its gating role.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    IFT43 is mutated in human ciliopathies even though the worm single mutant
    has nearly normal cilia; knowing its separable role would help interpret
    those alleles.
  resolution: >-
    Single-molecule imaging of IFT-A, dynein-2 and periciliary membrane cargo in
    ift-43 single and ift-43; ift-139 double mutants, plus binding assays
    between IFT-43 and IFT-121/IFTA-1 and IFT-139.
  provenance:
  - reference_id: PMID:30293716
    supporting_text: with IFT-140 controlling their ciliary entry and IFT-43/121/139
      controlling their ciliary removal
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Does worm IFT-43 bridge IFT-121/IFTA-1 and IFT-139 in the IFT-A2 lobe, as in
    other species, and is that why its loss is masked when IFT-139 is present?
suggested_experiments:
- description: >-
    Image periciliary membrane cargo and dynein-2 in ift-43 single mutants and
    in ift-43; ift-139 double mutants, at single-molecule resolution.
  hypothesis: >-
    IFT-43 is needed to remove membrane cargo from the cilium but is
    dispensable for retrograde motor coupling when IFT-139 is present.
