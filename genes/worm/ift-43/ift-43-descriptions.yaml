descriptions:
- source: UniProt
  text: As a component of IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport and entry into cilia of G protein- coupled receptors (GPCRs),
    it is involved in ciliogenesis (Probable). In particular, may act redundantly
    with the intraflagellar transport protein ift-139 to regulate the transport of
    specific ciliary cargo proteins such as che-3 which are related to motility.
  source_type: curated
