descriptions:
- source: Alliance_Imported
  text: elks-1 encodes the C. elegans homolog of the vertebrate ELKS (glutamine, leucine,
    lysine, and serine-rich) proteins; although loss of elks-1 activity results in
    no obvious developmental or behavioral abnormalities, the ELKS-1 C-terminus interacts
    with the PDZ domain of UNC-10/RIM in vitro, and in vivo each protein appears to
    play a nonessential role in localizing the other to the presynaptic active zone;
    in addition to the active zone, ELKS-1 also localizes to the pharyngeal basal
    lamina.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00018330;class=Gene
  source_id: WB:WBGene00018330
- source: Alliance_Automated
  text: Enables PDZ domain binding activity. Involved in intracellular protein localization
    and regulation of protein deneddylation. Located in basement membrane and presynaptic
    active zone. Is expressed in nervous system. Orthologous to several human genes
    including ERC2 (ELKS/RAB6-interacting/CAST family member 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00018330;class=Gene
