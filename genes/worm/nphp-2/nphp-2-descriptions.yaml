descriptions:
- source: Alliance_Imported
  text: nphp-2 encodes an ankyrin repeat domain-containing protein orthologous to
    mammalian inversin (INVS); NPHP-2 activity is required for ciliogenesis; in regulating
    ciliogenesis, nphp-2 functions together with nphp-1, nphp-2, and mks-1, mks-3,
    mks-6, mksr-1 and mksr-2; NPHP-2 localizes to the middle segment of sensory cilium
    (nonmotile primary cilium).
