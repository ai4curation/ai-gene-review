- term:
    id: GO:0000303
    label: response to superoxide
  evidence_type: IMP
  original_reference_id: PMID:23593298
  qualifier: involved_in
  review:
    summary: gsr-1 RNAi animals die on the redox cycler juglone and are also sensitive to paraquat and,
      less strongly, to cumene hydroperoxide and tert-butyl hydroperoxide.
    action: MODIFY
    reason: The phenotype shows GSR-1 is needed to tolerate oxidative stress, but it is not specific to
      superoxide (organic hydroperoxides also affect the knockdown) and glutathione reductase does not
      act on superoxide itself; it regenerates GSH consumed while countering the oxidants. The better-supported
      claim is the broader cellular response to oxidative stress, which the gene already carries by IBA
      and which overexpression (increased juglone resistance) also supports.
    supported_by:
    - &id012
      reference_id: PMID:23593298
      supporting_text: Among the 67 GSH-metabolism genes tested only C46F11.2 was found to be absolutely
        essential for juglone tolerance
    - &id013
      reference_id: PMID:23593298
      supporting_text: GSR-1 was also found to be crucial for the tolerance against other pro-oxidants
        including paraquat and to a lesser extent cumene hydroperoxide and tert-butylhydroperoxide
    - &id014
      reference_id: PMID:23593298
      supporting_text: Transgenic Pgsr-1::gsr-1::GFP worms exhibited a significantly higher resistance
        towards juglone than the control strain
    proposed_replacement_terms:
    - id: GO:0034599
      label: cellular response to oxidative stress
