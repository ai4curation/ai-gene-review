gene_symbol: gsr-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'gsr-1 encodes the only glutathione reductase of Caenorhabditis elegans, an FAD-containing
  homodimeric flavoenzyme of the class-I pyridine nucleotide-disulfide oxidoreductase family that uses
  NADPH to reduce glutathione disulfide (GSSG) to reduced glutathione (GSH). Alternative first exons/start
  codons produce a mitochondrial isoform (GSR-1a) with a 14-residue N-terminal targeting sequence and
  a cytosolic isoform (GSR-1b). By keeping the glutathione pool reduced, GSR-1 underpins tolerance of
  oxidative stress (juglone, paraquat), lifespan, reduction of cuticle disulfides during molting together
  with thioredoxin reductase TRXR-1, mitochondrial integrity and proteostasis. The cytosolic isoform is
  essential: loss-of-function mutants are maternal-effect embryonic lethal and are rescued by cytosolic
  but not mitochondrial GSR-1. gsr-1 is expressed widely (pharynx, intestine, hypodermis, muscle) and
  is induced by oxidants and starvation through SKN-1.'
