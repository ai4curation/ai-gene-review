suggested_questions:
- question: What function does mitochondrial GSR-1a serve, given that it cannot rescue embryonic lethality
    and that TRXR-2 is not a redundant mitochondrial GSSG reductase?
- question: Is the cuticle disulfide reduction during molting catalysed by GSH generated by GSR-1 directly,
    or via glutaredoxins acting on cuticle proteins?
- question: Does the 14-residue presequence of GSR-1a get cleaved in vivo, placing the mature enzyme in
    the mitochondrial matrix?
suggested_experiments:
- description: Measure compartment-specific glutathione redox potential (cytosolic and matrix-targeted
    Grx1-roGFP2) in gsr-1 mutants rescued with GSR-1b only, under normal and oxidative-stress conditions.
  hypothesis: GSR-1a is required to keep the mitochondrial glutathione pool reduced under stress, while
    GSR-1b controls the cytosolic pool.
  experiment_type: In vivo redox imaging
- description: Determine the N-terminus of mitochondrial GSR-1a by mass spectrometry and test sub-mitochondrial
    localization by protease protection.
  hypothesis: The GSR-1a MTS is cleaved and the mature enzyme resides in the mitochondrial matrix.
  experiment_type: Proteomics and subfractionation
