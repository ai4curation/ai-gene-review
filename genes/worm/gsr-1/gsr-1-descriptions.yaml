gene_symbol: gsr-1
organism: worm
uniprot_id: Q93379
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Catalyzes the reduction of glutathione disulfide (GSSG) to reduced glutathione
    (GSH). Constitutes the major mechanism to maintain a high GSH:GSSG ratio in the
    cytosol (PubMed:23593298). Involved in resistance to oxidative stress and starvation
    (PubMed:23593298). Together with thioredoxin reductase txtr-1, required for the
    reduction of disulfide groups in the cuticle during molting (PubMed:21199936).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q93379
  source_id: Q93379
- source: Alliance_Imported
  text: gsr-1 encodes a glutathionine reductase orthologous to human mitochondrial
    glutathione reductase (GSR; OMIM:138300); GSR deficiency has been associated with
    hemolytic anemia; loss of gsr-1 activity, together with that of trxr-1, results
    in molting defects characterized by a failure to remove old cuticle and reduced,
    disulfide groups in the cuticle that remain oxidized; gsr-1 expression is reduced
    in dauer larvae.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00008117;class=Gene
  source_id: WB:WBGene00008117
- source: Alliance_Automated
  text: Enables glutathione-disulfide reductase (NADPH) activity. Involved in several
    processes, including cell redox homeostasis; ecdysis, collagen and cuticulin-based
    cuticle; and response to superoxide. Is active in cytosol. Is expressed in several
    structures, including Ea; Ep; Epr; excretory canal; and reproductive system. Human
    ortholog(s) of this gene implicated in chronic obstructive pulmonary disease;
    congenital nonspherocytic hemolytic anemia 10; and macular degeneration. Orthologous
    to human GSR (glutathione-disulfide reductase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00008117;class=Gene
  source_id: WB:WBGene00008117
