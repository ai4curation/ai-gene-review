taxon_id: NCBITaxon:6239
status: COMPLETE
descriptions:
- source: UniProt
  text: Catalyzes the reduction of glutathione disulfide (GSSG) to reduced glutathione
    (GSH). Constitutes the major mechanism to maintain a high GSH:GSSG ratio in the
    cytosol (PubMed:23593298). Involved in resistance to oxidative stress and starvation
    (PubMed:23593298). Together with thioredoxin reductase txtr-1, required for the
    reduction of disulfide groups in the cuticle during molting (PubMed:21199936).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q93379
  source_id: Q93379
