id: Q9XUS9
gene_symbol: cyk-4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  CYK-4 (K08E3.6) is the C. elegans ortholog of MgcRacGAP/RACGAP1 and the non-motor subunit of
  centralspindlin, a constitutive 2:2 heterotetramer with the kinesin-6 ZEN-4/MKLP1. The 681-aa
  protein has an N-terminal coiled coil that dimerizes it and binds the ZEN-4 neck region, a
  central disordered linker, an atypical C1 (phorbol-ester/DAG-type zinc finger) domain that
  associates centralspindlin with the plasma membrane, and a C-terminal RhoGAP domain that
  stimulates GTP hydrolysis by CED-10/Rac1, CDC-42 and, more weakly, RHO-1/RhoA. In anaphase
  centralspindlin concentrates on the spindle midzone, where it bundles antiparallel microtubules
  to build the central spindle, and on the equatorial cortex, where membrane-bound oligomeric
  centralspindlin works with the RhoGEF ECT-2 to activate RhoA and drive cleavage furrow
  ingression. CYK-4 GAP activity is required for cytokinesis: it inactivates Rac and, by binding
  RhoA and ECT-2, also promotes rather than opposes RhoA activation. CYK-4 then persists at the
  midbody and division remnants, recruits midbody factors (for example CDC-14 and LEM-3), and is
  required for completion of cytokinesis in mitotic embryos and for polar body extrusion in
  meiosis. In interphase it is mainly cytoplasmic with some nuclear signal.
