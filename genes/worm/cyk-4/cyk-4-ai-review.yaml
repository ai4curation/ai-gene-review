core_functions:
- description: >-
    Rho-family GTPase-activating protein subunit of centralspindlin. At the equatorial plasma
    membrane, the C1-GAP region of CYK-4 binds RhoA and ECT-2; its GAP activity inactivates Rac
    and, non-canonically, promotes ECT-2-dependent RhoA activation, driving contractile ring
    assembly and cleavage furrow ingression in mitotic cytokinesis.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  in_complex:
    id: GO:0097149
    label: centralspindlin complex
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0032154
    label: cleavage furrow
  directly_involved_in:
  - id: GO:1990386
    label: mitotic cleavage furrow ingression
  - id: GO:0000281
    label: mitotic cytokinesis
  supported_by:
  - reference_id: PMID:26252513
    supporting_text: we show that both the C1 domain and the catalytic activity of the RhoGAP
      domain of CYK-4 are also required for full activation of ECT-2
  - reference_id: PMID:19056985
    supporting_text: Thus, inactivation of Rac by centralspindlin functions in parallel with RhoA
      activation to drive contractile ring constriction during cytokinesis.
  - reference_id: PMID:10871280
    supporting_text: in vitro, stimulates GTP hydrolysis by Rho, Rac, and Cdc42
- description: >-
    Non-motor subunit of the centralspindlin heterotetramer: the CYK-4 N-terminal coiled coil
    dimerizes and binds the ZEN-4 kinesin-6 neck, configuring the motors for antiparallel
    microtubule bundling and thereby building the central spindle and midbody.
  molecular_function:
    id: GO:0019894
    label: kinesin binding
  in_complex:
    id: GO:0097149
    label: centralspindlin complex
  locations:
  - id: GO:0051233
    label: spindle midzone
  - id: GO:0030496
    label: midbody
  directly_involved_in:
  - id: GO:0051256
    label: mitotic spindle midzone assembly
  supported_by:
  - reference_id: PMID:11782313
    supporting_text: The N terminus of CYK-4 binds the central region of ZEN-4, including the neck
      linker.
  - reference_id: PMID:25875822
    supporting_text: CYK4 binds to a globular mass in the atypically long MKLP1 neck domain
  - reference_id: PMID:10871280
    supporting_text: These embryos also fail to assemble the central spindle.
suggested_questions:
- question: >-
    The CYK-4 C1-GAP region binds the ECT-2 DH-PH domain and is required for full ECT-2 activity
    in vivo, but stimulation of ECT-2 GEF activity has not been reconstituted in vitro. Should
    CYK-4 carry guanyl nucleotide exchange factor activator activity (GO:0160124) once direct
    activation is shown, or is the relationship better modelled in GO-CAM (CYK-4 GAP activity
    positively regulates ECT-2 GEF activity)?
- question: >-
    What lipid does the atypical C1 domain of C. elegans CYK-4 bind? Phosphoinositide binding was
    shown for human MgcRacGAP; the DAG-binding IEA row is probably a domain-signature artefact.
suggested_experiments:
- description: >-
    Liposome flotation or lipid-strip assays with purified CYK-4 C1 domain (wild type, ΔC1 and
    E448K) to determine whether it binds phosphoinositides, phosphatidylserine or diacylglycerol.
  experiment_type: biochemical lipid binding
- description: >-
    Reconstitute ECT-2 GEF activity on supported membranes with RhoA, oligomeric centralspindlin
    and the CYK-4 R459A/RhoA-binding mutants to test whether CYK-4 directly stimulates ECT-2.
  experiment_type: in vitro reconstitution
