- term:
    id: GO:0000070
    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:29463814
  qualifier: involved_in
  review:
    summary: >-
      Hong et al. 2018 is a LEM-3 nuclease paper. cyk-4 RNAi was used to abolish the
      central spindle/midbody, which prevents LEM-3 recruitment; chromatin bridges induced by
      partial mcm-7 RNAi then persist. The segregation defect is an indirect consequence of
      losing the midbody platform that recruits LEM-3.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Full text read. CYK-4 does none of the work of separating sister chromatids; it is needed to
      build the midbody, which tethers the LEM-3 nuclease that processes chromatin bridges. The
      phenotype was scored only in combination with partial mcm-7 RNAi. This is a downstream,
      pleiotropic consequence of failed central spindle/midbody assembly, which is already
      captured by spindle midzone assembly and cytokinesis annotations.
    supported_by:
    - reference_id: PMID:29463814
      supporting_text: Midbody localization of LEM-3 depends on the central spindle component
        CYK-4 and the microtubule-bundling protein SPD-1
    - reference_id: PMID:29463814
      supporting_text: we combined the partial mcm-7 RNAi with the depletion of ZEN-4 and CYK-4
        central spindle components
