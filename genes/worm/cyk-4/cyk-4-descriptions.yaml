descriptions:
- source: Alliance_Imported
  text: 'cyk-4 encodes a Rho GAP (Rho guanosine triphosphatase (GTPase) activating
    protein); during development, cyk-4 is required for two different processes: 1)
    paternally provided CYK-4 regulates anterior-posterior polarity in the one-cell
    embryo by controlling the actomyosin cytoskeletal network, and 2) together with
    ZEN-4, CYK-4 is sufficient to promote formation of the large bundles of microtubules
    that form the central spindle during anaphase and polarize the foregut epithelium;
    in addition, CYK-4 is required for fertility and coordinated locomotion postembryonically;
    CYK-4 is enriched in sperm and also localizes to the central spindle during anaphase
    interdependently with ZEN-4; CYK-4 interacts with ZEN-4 in vitro and in vivo.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000875;class=Gene
