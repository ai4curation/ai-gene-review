- source: Alliance_Automated
  text: Enables GTPase activator activity. Involved in mitotic cleavage furrow ingression;
    mitotic spindle midzone assembly; and polar body extrusion after meiotic divisions.
    Located in mitotic spindle midzone and plasma membrane. Part of centralspindlin
    complex. Is expressed in several structures, including germ cell; hypodermis;
    intestine; nervous system; and reproductive system. Human ortholog(s) of this
    gene implicated in congenital dyserythropoietic anemia type IIIb. Orthologous
    to human RACGAP1 (Rac GTPase activating protein 1).
