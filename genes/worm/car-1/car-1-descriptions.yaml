gene_symbol: car-1
organism: worm
uniprot_id: Q9XW17
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Transcriptional regulator (PubMed:18430416). Involved in modulating embryonic
    expression of ATP-dependent chaperone cdc-48.1 (PubMed:18430416). May play a role
    in mRNA gene silencing, and RNA granule (P-body) assembly (PubMed:29510985).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XW17
  source_id: Q9XW17
- source: Alliance_Imported
  text: car-1 encodes a putative RNA-binding protein orthologous to buddingyeast Scd6p,
    fission yeast Sum2p, Drosophila TRAL, and human LSM14A andLSM14B; CAR-1 inhibits
    physiological apoptosis in oocytes, keeping itdown to a normal level of ~50% in
    hermaphrodite gonads; independently ofapoptosis, CAR-1 is also required for normal
    oogenesis, early embryoniccytokinesis, and normally organized endoplasmic reticulum
    (ER); CAR-1has an N-terminal Sm-related domain that is dispensable for subcellularlocalization,
    but directly binds RNA and is critical for CAR-1'sfunction; CAR-1 expressed in
    the germline; CAR-1 associates with CGH-1,DCAP-1, and CEY-2/3/4, in P granules
    and other cytoplasmic particles ofthe early embryo; CAR-1 also localizes to the
    mitotic spindle ofdividing 1-cell embryos, and to ER; CAR-1 requires CGH-1 for
    normallocalization in meiotic germ cells, and binds CGH-1 in an RNA-dependentmanner;
    car-1(tm1753) or car-1(RNAi) embryos display abnormalcytokinesis, with aberrant
    cleavage furrow ingression and anaphasespindle structure, and mislocalized AIR-2,
    SPD-1, and ZEN-4; car-1(RNAi)also results in elevated (though not 100%) physiological
    germ cellapoptosis, reduced fertility, and failed oocyte diakinesis; maternalCAR-1
    is sufficient to rescue car-1(tm1753) homozygotes throughdevelopment to adulthood;
    in car-1(RNAi) animals, excess physiologicalapoptosis actually promotes fertility,
    since car-1(RNAi) hermaphroditeshave larger brood sizes than those with apoptosis
    suppressed byced-3(n717).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00012484;class=Gene
  source_id: WB:WBGene00012484
- source: Alliance_Automated
  text: Enables RNA polymerase II core promoter sequence-specific DNA binding activity.
    Involved in positive regulation of gene expression. Located in cytoplasmic ribonucleoprotein
    granule; endoplasmic reticulum; and microtubule cytoskeleton. Part of ribonucleoprotein
    complex and ribonucleoprotein granule. Is expressed in germ line; gonad; neurons;
    somatic cell; and touch receptor neurons. Orthologous to several human genes including
    LSM14B (LSM family member 14B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00012484;class=Gene
