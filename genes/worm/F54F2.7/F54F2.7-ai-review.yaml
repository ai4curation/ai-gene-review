  full_text_unavailable: true
- id: PMID:35193982
  title: Leg length and bristle density, both necessary for water surface locomotion, are genetically
    correlated in water striders.
  findings:
  - statement: RNAi depletion of insect Simiate in Gerris buenoi disrupts actin-based sensory bristle
      organization and leg elongation, corroborating conserved actin-cytoskeletal involvement in protostomes.
    supporting_text: Simiate RNAi knockdown in G. buenoi resulted in embryos with bristles that are disorganized
      and variable in size, as well as shorter legs
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Comparative ecdysozoan perturbation evidence supporting conserved actin-regulatory function
      of protostome ABITRAM orthologs.
