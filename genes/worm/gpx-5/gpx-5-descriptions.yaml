descriptions:
- source: Alliance_Imported
  text: gpx-5 encodes a glutathione peroxidase; by homology, GPX-5 is predicted to
    function to reduce lipid hydroperoxides to their corresponding alcohols and reduce
    hydrogen peroxide to water to protect cells from damage induced by reactive oxygen
    species.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007516;class=Gene
  source_id: WB:WBGene00007516
- source: Alliance_Automated
  text: Predicted to enable glutathione peroxidase activity. Involved in response
    to reactive oxygen species. Predicted to be located in extracellular region. Is
    expressed in head; hypodermis; intestine; pharynx; and rectal gland cell. Human
    ortholog(s) of this gene implicated in several diseases, including Barrett's esophagus;
    cerebrovascular disease (multiple); gastrointestinal system cancer (multiple);
    sensorineural hearing loss; and type 2 diabetes mellitus. Orthologous to several
    human genes including GPX3 (glutathione peroxidase 3) and GPX5 (glutathione peroxidase
    5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00007516;class=Gene
  source_id: WB:WBGene00007516
