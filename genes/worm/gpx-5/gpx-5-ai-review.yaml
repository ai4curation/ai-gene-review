id: Q93204
gene_symbol: gpx-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  gpx-5 (C11E4.1) encodes a 223-residue member of the glutathione peroxidase (GPx) family in
  Caenorhabditis elegans. It has a predicted N-terminal signal peptide and no transmembrane
  segment, and resembles the secreted mammalian GPx3/GPx5 enzymes, so it is expected to act
  as an extracellular peroxidase. The peroxidatic position is a cysteine (Cys72) rather than
  the selenocysteine found in GPX1-type enzymes, so GPX-5 is a cysteine-type GPx. Its
  reducing substrate (glutathione or thioredoxin) has not been measured. No biochemical,
  localisation or structural study of the protein exists. In an RNAi screen of
  glutathione-metabolism genes, knockdown of C11E4.1 made worms more sensitive to arsenite
  but not to the redox-cycling quinone juglone. This suggests that GPX-5 helps protect
  against arsenite-induced toxicity, probably by reducing peroxides.
