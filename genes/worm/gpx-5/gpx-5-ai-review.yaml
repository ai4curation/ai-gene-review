core_functions:
- description: >-
    Secreted cysteine-type glutathione peroxidase-family enzyme. It is predicted to reduce
    hydrogen peroxide and organic hydroperoxides outside the cell, using its peroxidatic
    Cys72, and so to detoxify oxidants. Its physiological reductant (glutathione or
    thioredoxin) is unknown.
