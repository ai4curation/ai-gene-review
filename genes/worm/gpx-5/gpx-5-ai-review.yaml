suggested_questions:
- question: >-
    Does GPX-5, a Cys-type GPx with Cys72 in place of selenocysteine, use glutathione or
    thioredoxin (or another thiol reductant) to regenerate its peroxidatic cysteine? Should
    the glutathione peroxidase activity inherited from PTN000904512 be qualified for Cys-GPx
    members?
- question: >-
    WormBase's IMP to GO:0000302 is based on arsenite sensitivity, while the ROS generator
    juglone had no effect in the same screen. Would GO:0046685 response to
    arsenic-containing substance be the better term?
- question: Where is GPX-5 expressed, and into which extracellular compartment (pseudocoelom, cuticle, intestinal lumen) is it secreted?
suggested_experiments:
- description: >-
    Express recombinant mature GPX-5 (residues 18-223) and measure H2O2 and cumene
    hydroperoxide reduction in coupled assays with GSH/glutathione reductase/NADPH versus
    thioredoxin/thioredoxin reductase/NADPH. Include a C72S mutant as a control.
  hypothesis: GPX-5 is a Cys-dependent peroxidase. Its preferred reductant decides whether
    glutathione peroxidase activity is the right annotation.
- description: >-
    Tag endogenous gpx-5 with a fluorescent protein using CRISPR, to define its expression
    and confirm secretion. Test a gpx-5 deletion allele for arsenite, juglone and tert-butyl
    hydroperoxide sensitivity.
  hypothesis: GPX-5 is secreted, and loss of gpx-5 makes worms sensitive to arsenite-induced
    peroxide stress.
