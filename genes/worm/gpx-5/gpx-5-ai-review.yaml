- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000889
  review:
    summary: >-
      This is a family-level InterPro2GO process term for GPx proteins.
    action: KEEP_AS_NON_CORE
    reason: >-
      A secreted peroxidase plausibly protects against oxidative insult, and the arsenite
      phenotype fits a role in protection from chemically induced oxidative damage. There is
      no gpx-5-specific evidence for a more specific kind of response: knockdown did not
      sensitise worms to juglone. The descendant GO:0034599 (cellular response to oxidative
      stress) is no better supported, as discussed on that row. The process that the core
      activity most directly carries out is captured by cellular oxidant detoxification, so
      this broader response term is kept as non-core.
    supported_by:
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR000889; Glutathione_peroxidase
- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000190813
  - MGI:MGI:104886
  - PANTHER:PTN002480721
  - PomBase:SPBC32F12.03c
  - SGD:S000000448
  - SGD:S000001476
  - UniProtKB:C8VJD9
  - UniProtKB:P00435
  - UniProtKB:P07203
  - WB:WBGene00009165
  review:
    summary: >-
      This PAINT IBA comes from a deep node in PTHR11592 (PTN002480721). Its seeds are
      fungal, mammalian and C. elegans GPx proteins, including yeast Gpx1-3, fission yeast
      gpx1, mouse GPX4 and worm gpx-6.
    action: KEEP_AS_NON_CORE
    reason: >-
      gpx-5 descends from this node, and nothing in its sequence argues for loss of the
      peroxide-scavenging role behind the term. Most seeds are intracellular enzymes, whereas
      gpx-5 is predicted to be secreted. Even so, an extracellular peroxidase still forms part
      of the organism's antioxidant defence against oxidative stress. The RNAi data (arsenite
      but not juglone sensitivity) neither confirm nor refute the claim. It is kept as a
      non-core consequence of the peroxidase activity.
    supported_by:
    - reference_id: PMID:23593298
      supporting_text: Both, the alpha-class related gst-32 and the GPX are implicated in the
        oxidative stress response by way of their GSH-dependent reduction of inorganic and organic
        peroxides or by their ability to eliminate secondary products of lipid peroxidation.
- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415528
  review:
    summary: >-
      This UniRule-based electronic transfer of cell redox homeostasis applies to GPx family
      members in general.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cell redox homeostasis means maintaining the redox environment of a cell. gpx-5 is
      predicted to be secreted, and nothing links it to the intracellular thiol/disulfide
      balance. Its likely role, removing peroxides, is described more accurately by
      cellular oxidant detoxification. The rule applies a catch-all process term that is
      appropriate for intracellular thiol-based peroxidases and redoxins, but no evidence
      supports it for this extracellular enzyme.
    supported_by:
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..17
- term:
    id: GO:0098869
    label: cellular oxidant detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - GO:0004601
  - GO:0004602
  review:
    summary: >-
      This combined automated annotation derives the process from the peroxidase and
      glutathione peroxidase function annotations.
    action: ACCEPT
    reason: >-
      Peroxidase activity (accepted above) reduces hydrogen peroxide and organic
      hydroperoxides, which is exactly oxidant detoxification. This is the process that the
      core activity directly carries out. The inference depends only on peroxidase activity,
      not on GSH dependence. GO applies this term to secreted GPx enzymes as well as
      intracellular ones.
    supported_by:
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR000889; Glutathione_peroxidase
    - reference_id: PMID:23593298
      supporting_text: Here GPX uses GSH to reduce peroxides
