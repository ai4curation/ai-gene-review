- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      This row maps the UniProt "Secreted" subcellular location to extracellular region.
    action: ACCEPT
    reason: >-
      The UniProt location line itself rests on an ARBA rule, but two independent lines
      support it. First, SignalP predicts a cleavable signal peptide (residues 1-17), and the
      protein has no transmembrane segment or ER-retention motif. Second, gpx-5 is most
      similar to the secreted Cys-GPx and GPx3 enzymes. The authors of the only experimental
      paper also call it an extracellular GPX. Extracellular region is as precise as the
      evidence allows, because whether the protein is in pseudocoelomic fluid, cuticle or
      lumen is unknown.
    supported_by:
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..17
    - reference_id: PMID:23593298
      supporting_text: an extracellular glutathione peroxidase (C11E4.1)
