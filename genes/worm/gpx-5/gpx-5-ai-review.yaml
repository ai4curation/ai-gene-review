      confidence: PROBABLE
      explanation: >-
        In PMID:23593298, C11E4.1 (gpx-5) RNAi reduced survival on arsenite (13.3 +/- 9.4 %)
        but not on the ROS generator juglone (80.0 +/- 14.5 %). The assayed phenotype is
        arsenite sensitivity, so GO:0046685 response to arsenic-containing substance fits
