- term:
    id: GO:0000302
    label: response to reactive oxygen species
  evidence_type: IMP
  original_reference_id: PMID:23593298
  qualifier: involved_in
  review:
    summary: >-
      The WormBase IMP row comes from the Luersen et al. 2013 RNAi screen. In that screen,
      C11E4.1 knockdown reduced survival on arsenite but did not affect survival on juglone,
      the ROS-generating stressor in the same screen.
    action: MODIFY
    reason: >-
      I read the full text. The phenotype for this gene is arsenite sensitivity: survival under
      arsenite was 13.3 +/- 9.4 % (p<0.001), while survival under juglone was 80.0 +/- 14.5 %
      (not significant). The paper therefore shows that the gene is needed to tolerate an
      arsenic-containing substance. The ROS-specific claim is the authors' interpretation
      through peroxide reduction, and the ROS stressor in the same screen did not support it.
      GO:0046685 response to arsenic-containing substance states what was assayed. This is a
      lateral correction within the response-to-chemical branch, not a refinement. It is
      recorded as a probable WRONG_TERM defect at WormBase.
    proposed_replacement_terms:
    - id: GO:0046685
      label: response to arsenic-containing substance
