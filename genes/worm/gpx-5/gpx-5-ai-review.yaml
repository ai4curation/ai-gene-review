- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000889
  review:
    summary: >-
      This InterPro2GO row comes from the glutathione peroxidase family signature
      (IPR000889). gpx-5 has the full GPx fold, and its peroxidatic cysteine and tetrad
      residues are intact.
    action: ACCEPT
    reason: >-
      Family membership is clear (Pfam GSHPx, PIRSF000303, three GPx PROSITE signatures).
      The catalytic Sec position is replaced by Cys72, which aligns with GPX1 Sec49. Cys-GPx
      enzymes, such as mammalian GPX5 and the thioredoxin-dependent GPxs of plants and
      yeast, still reduce hydroperoxides, though usually less efficiently. Peroxidase
      activity is therefore the most specific claim the evidence supports. Which reductant
      the enzyme uses is the open question, and it is handled on the glutathione peroxidase
      rows. No GPX-5-specific assay exists, so this is an inference from the family.
    supported_by:
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR000889; Glutathione_peroxidase
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["DR:PIRSF"]
      supporting_text: PIRSF000303; Glutathion_perox
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the glutathione peroxidase family.
- term:
    id: GO:0004602
    label: glutathione peroxidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:104887
  - MGI:MGI:105102
  - MGI:MGI:106609
  - PANTHER:PTN000904512
  - RGD:2729
  - RGD:727780
  - UniProtKB:P00435
  - UniProtKB:P07203
  - UniProtKB:P18283
  - UniProtKB:P22352
  review:
    summary: >-
      This PAINT IBA places glutathione peroxidase activity at PTN000904512. The node's
      descendant evidence comes from vertebrate GPx enzymes (GPX1, GPX2, GPX3 and their
      rodent orthologues), all of which have selenocysteine at the peroxidatic position.
    action: UNDECIDED
    reason: >-
      The PAINT node placement is reasonable for the family as a whole. However, gpx-5 has a
      Cys at the peroxidatic position (Cys72 for Sec). The node's experimental donors are all
      Sec-GPxs, and in other lineages Cys-GPxs often use thioredoxin instead of glutathione
      as the reductant. gpx-5 has no assay of glutathione-dependent activity, and the only
      paper on the gene infers GSH dependence from the family without measuring it.
      Peroxidase activity (GO:0004601) is accepted as the core function. Whether that
      activity is glutathione-dependent cannot be decided without a biochemical assay.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000904512
        source_label: PAINT node for glutathione peroxidase activity in PTHR11592
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The donors that carry experimental evidence (human GPX1 P07203, GPX3 P22352, GPX2
          P18283, bovine GPX1 P00435 and rodent orthologues) are selenoproteins. gpx-5 has
          Cys in place of Sec, so the donors do not establish which reductant it uses.
      residue_claims:
      - claim_type: SUBSTITUTED
        role: peroxidatic selenocysteine (catalytic tetrad)
        method: MSA
        anchor:
          accession: UniProtKB:P07203
          position: 49
          residue: U
          sequence_version: 4
        target:
          accession: UniProtKB:Q93204
          position: 72
          residue: C
          sequence_version: 3
        comment: >-
          Ad hoc motif alignment of the GPx signature: GPX1 NVASLUGTT and gpx-5 NVATFCAYT.
    supported_by:
    - reference_id: file:worm/gpx-5/gpx-5-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the glutathione peroxidase family.
    - reference_id: file:worm/gpx-5/gpx-5-deep-research-manual.md
      supporting_text: The peroxidatic position is a cysteine (Cys72, in the motif NVATFCAYT), which aligns with
        the selenocysteine of human GPX1 (Sec49, motif NVASLUGTT).
