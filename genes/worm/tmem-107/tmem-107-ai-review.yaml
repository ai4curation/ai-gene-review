  review:
    summary: >-
      Phylogenetic inference from human TMEM107 (Q6UX40), which co-immunoprecipitates
      with TMEM216, TMEM231, TMEM237 and MKS1. In worms TMEM-107 behaves genetically
      and in localization hierarchies as an MKS-module protein.
    action: ACCEPT
    reason: >-
      The PAINT node is well supported. The worm protein is a single-copy ortholog
      with conserved TZ localization, is placed in an intermediate layer of the MKS
      module, and is required to recruit MKS-1, TMEM-231 and JBTS-14. The
      co-evolutionary TMEM107-TMEM17-TMEM231 submodule further supports the
      inheritance of complex membership.
