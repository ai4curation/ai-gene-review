suggested_questions:
- question: >-
    Does C. elegans TMEM-107 physically associate with TMEM-17 and TMEM-231 in vivo,
    as the co-evolution and localization dependencies predict? Mammalian TMEM107
    did not co-immunoprecipitate TMEM17.
suggested_experiments:
- description: >-
    Proximity labelling (TurboID) of endogenous TMEM-107 in ciliated neurons, done in
    wild-type and mks-5 backgrounds, to define its direct TZ membrane partners.
