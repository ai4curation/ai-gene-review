  label: Caenorhabditis elegans
description: >-
  TMEM-107 (F39B2.9) is the Caenorhabditis elegans ortholog of human TMEM107, a
  small four-pass integral membrane protein of the ciliary transition zone (TZ).
  It is expressed only in ciliated sensory neurons, under control of the RFX
  transcription factor DAF-19, and is anchored, immobile, in the TZ membrane, where
  super-resolution imaging shows it in periodic ring-like subdomains. TMEM-107 is
  a component of the MKS module. Its own TZ localization depends on MKS-5 and the
  intermediate-layer MKS proteins, and it in turn organizes the recruitment of a
  submodule of MKS proteins (MKS-1, TMEM-231, JBTS-14/TMEM237 and TMEM-17) to the
  TZ. This recruitment depends on its transmembrane helices rather than its short
  cytosolic termini. tmem-107 single mutants have structurally normal cilia but a
  selectively leaky ciliary membrane diffusion barrier (TRAM-1 enters cilia). In
  combination with nphp-4 loss, the mutants lose Y-link connectors, TZs fail to
  dock at the membrane, cilia are truncated or missing, and phasmid dendrites are
  short. Human TMEM107 mutations cause Joubert and oral-facial-digital syndromes.
