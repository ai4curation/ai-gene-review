- term:
    id: GO:1903565
    label: negative regulation of protein localization to cilium
  evidence_type: IMP
  original_reference_id: PMID:26595381
  qualifier: involved_in
  review:
    summary: >-
      In tmem-107 single mutants the non-ciliary membrane protein TRAM-1 leaks into
      cilia, so the TZ membrane diffusion barrier is defective. Unlike in other
      MKS-module mutants, RPI-2 does not leak, which shows the barrier defect is
      selective.
    action: NEW
    reason: >-
      The ciliary gate is the central function of the TZ MKS module, and the same
      term is used for sibling MKS-module genes (mks-2, mks-3, mksr-1) in this
      repository. TMEM-107 is a TZ-anchored membrane subunit of the barrier itself,
      so this is participation, not just necessity. The abstract states that
      TMEM-107 controls ciliary composition. The TRAM-1 leakage data are in the full
      text (PMC5580800), which is not in the local cache.
    supported_by:
    - reference_id: PMID:26595381
      supporting_text: TMEM-107 controls ciliary composition
    - reference_id: PMID:26595381
      supporting_text: >-
        This work expands the MKS module of ciliopathy-causing TZ proteins
        associated with diffusion barrier formation
core_functions:
- description: >-
    Integral membrane subunit of the MKS module at the ciliary transition zone. It
    is anchored in the TZ membrane, recruits a submodule of MKS proteins (MKS-1,
    TMEM-231, JBTS-14, TMEM-17), and acts redundantly with the NPHP module to build
    Y-link connectors, dock the TZ at the membrane and maintain the ciliary membrane
    diffusion barrier. Its molecular activity is unknown, so no MF is asserted.
