- term:
    id: GO:0016358
    label: dendrite development
  evidence_type: IGI
  original_reference_id: PMID:26595381
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:G5ECP0
  review:
    summary: >-
      In tmem-107;nphp-4 double mutants the phasmid dendrites are often short,
      which the authors read as a dendritic-tip anchoring defect during dendrite
      elongation. This is the same phenotype seen with other MKS-module;nphp-4
      combinations.
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic interaction with nphp-4 (G5ECP0) is real. The phenotype comes from
      the TZ and ciliary base failing to anchor the dendrite tip as the dendrite
      extends (retrograde extension), so it is a downstream consequence of TZ
      membrane-anchoring function rather than a dendrite-specific role. Kept as
      non-core. The cached record is abstract-only, and the curator worked from the
      full text.
    supported_by:
    - reference_id: PMID:26595381
      supporting_text: >-
        TMEM-107 controls ciliary composition and functions redundantly with NPHP-4
        to regulate cilium integrity, TZ docking and assembly of membrane to
        microtubule Y-link connectors
