gene_symbol: cct-3
organism: worm
uniprot_id: Q9N4J8
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis (By
    similarity). Known to play a role, in vitro, in the folding of actin and tubulin
    (By similarity). Plays a role in microtubule polymerization (PubMed:16054029).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N4J8
  source_id: Q9N4J8
- source: Alliance_Imported
  text: cct-3 encodes a putative gamma subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT3 (OMIM:600114); in early embryos, CCT-3 is
    required for normally fast microtubule elongation; CCT-3 is also required to repress
    SKN-1-dependent transcription of gst-4; in mass RNAi assays, CCT-3 is required
    for normal embryonic and larval viability, and for fertility.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00018782;class=Gene
  source_id: WB:WBGene00018782
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Predicted
    to be located in cytoplasm. Predicted to be part of chaperonin-containing T-complex.
    Human ortholog(s) of this gene implicated in language disorder. Orthologous to
    human CCT3 (chaperonin containing TCP1 subunit 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00018782;class=Gene
  source_id: WB:WBGene00018782
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
    in protein folding. Predicted to be located in cytoplasm. Predicted to be part
    of chaperonin-containing T-complex. Orthologous to human CCT3 (chaperonin containing
    TCP1 subunit 3). [provided by Alliance of Genome Resources, Jun 2026]
