      score: 3
    overall_notes: Generic CCT text plus a cited role in microtubule polymerization.
      That fits the review's tubulin-supply explanation of the embryonic microtubule
      growth defect.
- source: Alliance_Imported
  text: cct-3 encodes a putative gamma subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT3 (OMIM:600114); in early embryos, CCT-3 is
    required for normally fast microtubule elongation; CCT-3 is also required to repress
    SKN-1-dependent transcription of gst-4; in mass RNAi assays, CCT-3 is required
    for normal embryonic and larval viability, and for fertility.
  source_type: curated
