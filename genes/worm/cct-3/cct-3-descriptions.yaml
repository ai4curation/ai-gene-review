- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis (By
    similarity). Known to play a role, in vitro, in the folding of actin and tubulin
    (By similarity). Plays a role in microtubule polymerization (PubMed:16054029).
  source_type: curated
