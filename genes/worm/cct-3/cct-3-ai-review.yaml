  label: Caenorhabditis elegans
description: cct-3 encodes the gamma (CCT3 / TCP-1-gamma) subunit of the eukaryotic cytosolic
  chaperonin CCT/TRiC, an ATP-dependent double-ring chaperonin in which each ring contains
  eight distinct paralogous subunits. The assembled complex folds a subset of cytosolic proteins,
  most notably actin and tubulin. In the conserved CCT nucleotide hierarchy the gamma subunit
  belongs to the low-ATP-affinity hemisphere, so its contribution is chiefly structural and
  substrate-contacting rather than as a major ATPase. In C. elegans CCT-3 acts in the cytoplasm;
  like other subunits it is required in the early embryo for normal microtubule growth (tubulin
  supply) and, in the germline, for correct assembly of the meiotic chromosome axis, consistent
  with CCT folding of tubulin and of meiotic HORMA domain proteins.
