suggested_questions:
- question: Which native C. elegans CCT clients depend specifically on contacts made by the
    gamma subunit apical domain, as opposed to the complex as a whole?
- question: Is the low ATP affinity of the gamma subunit measured for yeast and bovine TRiC
    conserved in the nematode complex, and should family-level ATP hydrolysis annotations
    be qualified for low-affinity CCT subunits?
suggested_experiments:
- description: Affinity purification and mass spectrometry of endogenously tagged cct-3 (or
    of assembled CCT) from staged C. elegans, combined with crosslinking, to map clients contacting
    the gamma subunit.
  hypothesis: The gamma subunit contributes a defined subset of client contacts, dominated
    by actin and tubulin but including WD40 and other proteins.
- description: Introduce nucleotide-binding (P-loop) or hydrolysis-dead mutations into cct-3
    by CRISPR and test viability, actin/tubulin levels and fertility.
  hypothesis: As for yeast low-affinity subunits, ATP binding by the gamma subunit is dispensable
    for CCT function in vivo.
