  review:
    summary: The gamma subunit retains the chaperonin nucleotide-binding fold but is one of
      the four low-ATP-affinity CCT subunits.
    action: KEEP_AS_NON_CORE
    reason: The InterPro-based annotation reflects the conserved equatorial domain and is
      not wrong. However, CCT3 has very low ATP occupancy even at high ATP concentrations,
      and ATP binding by the low-affinity subunits is dispensable for TRiC function in vivo
      (yeast). ATP binding is thus retained but is not the core contribution of this subunit,
      which lies in its structural and substrate-contacting role in the ring.
