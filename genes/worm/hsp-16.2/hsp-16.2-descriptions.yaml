descriptions:
- source: Alliance_Imported
  text: hsp-16.2 encodes a 16-kD heat shock protein (HSP) that is a member of the
    hsp16/hsp20/alphaB-crystallin (HSP16) family of heat shock proteins; hsp-16.2
    expression, strongest in intestine and pharynx, is induced in response to heat
    shock or other environmental stresses; HSP-16.2 has been shown to interact with
    intracellular human beta amyloid peptide, a primary component of the extracellular
    plaques found in Alzheimer's disease; HSP-16.2 is likely to function as a passive
    ligand temporarily preventing unfolded proteins from aggregating.
