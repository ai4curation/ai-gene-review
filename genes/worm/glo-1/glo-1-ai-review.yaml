      supporting_text: We show that the glo-1 gene encodes a predicted Rab GTPase that localizes to lysosome-related
        gut granules in the intestine
    - reference_id: PMID:22916203
      supporting_text: GLO-1, which is orthologous to Rab32/38 in mammals [4], is localized to, and required
