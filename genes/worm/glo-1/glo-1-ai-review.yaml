gene_symbol: glo-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'glo-1 encodes the Caenorhabditis elegans ortholog of the Rab32/Rab38 subfamily of Rab small
  GTPases. It is expressed in the intestine, where it associates with the limiting membrane of gut granules,
  the intestine-specific lysosome-related organelles (LROs) that store birefringent, autofluorescent material
  and Nile Red-stained lipid and coexist with conventional degradative lysosomes. In its GTP-bound form,
  activated by the GLO-3/CCZ-1 guanine nucleotide exchange factor (with help from LMD-2 and the ABCG transporter
  WHT-2), GLO-1 is required for gut granule biogenesis: it routes membrane protein cargo such as PGP-2
  and CDF-2 away from conventional endolysosomes and toward gut granules, downstream of or in parallel
  with AP-3, BLOC-1 and HOPS, and restricts RAB-7 to conventional endolysosomes. glo-1 mutants lack gut
  granules and show downstream defects in fat staining, ascaroside metabolism and LRO-dependent stress
  and immune responses.'
