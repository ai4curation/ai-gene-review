core_functions:
- description: Rab32/38-family GTPase that, when GTP-bound (activated by the GLO-3/CCZ-1 GEF), acts on
    the gut granule membrane to direct protein cargo to, and drive biogenesis of, intestinal lysosome-related
    gut granules.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - *id002
  - id: GO:0006886
    label: intracellular protein transport
  locations:
  - *id001
  supported_by:
  - reference_id: PMID:30419011
    supporting_text: Whereas glo-1(+) wild-type and glo-1(Q71L) mutant transgenes restored birefringent,
      PGP-2-containing, and autofluorescent gut granules when expressed in glo-1(-) mutants, the glo-1(T25N)
      mutant did not.
  - reference_id: PMID:30419011
    supporting_text: Similar to other Rabs [29, 31], we show that the GTP bound form of GLO-1 is active
      in gut granule formation (Fig 5).
  - reference_id: PMID:30419011
    supporting_text: Notably, we did not detect a significant role for GLO-1 in the transport of cargo
      through conventional endolysosomes and instead show that GLO-1 functions to direct protein cargo
      away from this pathway toward gut granules (Figs 2 and 3).
  - reference_id: PMID:22916203
    supporting_text: (I) GFP::GLO-1 marked the periphery of gut granules in wild type (white arrows).
  - reference_id: PMID:39078368
    supporting_text: LMD-2 thus promotes the GEF activity of the GLO-3–CCZ-1 complex to activate GLO-1.
suggested_questions:
- question: What are the GLO-1 effectors on gut granules, and do they include homologs of the mammalian
    Rab32/38 effectors VARP (ANKRD27) or the HOPS/AP-3 machinery?
- question: Is there a GLO-1-specific GAP that terminates its activity, and does GLO-1 GTP hydrolysis
    occur at measurable rates in vitro?
- question: Does GLO-1 ever associate with mitochondria or the Golgi in C. elegans tissues outside the
    intestine, as mammalian RAB32 and RAB29 do?
suggested_experiments:
- description: Measure intrinsic and GAP-stimulated GTP hydrolysis of purified GLO-1 wild type and Q71L,
    and identify GTP-dependent GLO-1 interactors by affinity purification from intestinal lysates.
  hypothesis: GLO-1 is a catalytically active Rab whose GTP-bound form recruits specific effectors that
    sort cargo to gut granules.
