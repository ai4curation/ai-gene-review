  review:
    action: MODIFY
    summary: glo-1(zu437) mutants lack gut granules; the process is biogenesis of a lysosome-related organelle,
      best captured by gut granule assembly.
    reason: 'The IMP is sound in essence: gut granules are LROs and glo-1 mutants fail to form them. GO,
      however, places gut granule assembly (GO:1902900) under vesicle/organelle assembly, not under lysosome
      organization, and glo-1 loss does not significantly disturb conventional endolysosome biogenesis.
      Gut granule assembly is the more accurate term; this is a lateral refinement, not a correction of
      a mistaken annotation. Full text of PMID:15843430 was not accessible, but the abstract and later
      full-text papers establish the gut granule loss phenotype.'
    proposed_replacement_terms:
