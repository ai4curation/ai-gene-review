  review:
    action: ACCEPT
    summary: GLO-1 directs protein cargo (e.g. PGP-2, CDF-2) to gut granules; intracellular protein transport
      is a fitting, appropriately specific process.
    reason: 'Rab-family IBA, and the worm data support it directly: glo-1 loss mistraffics gut granule
      membrane proteins, and GLO-1 routes protein cargo away from conventional endolysosomes toward gut
      granules. GO has no more specific term for protein transport to lysosome-related organelles.'
