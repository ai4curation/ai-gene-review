  review:
    action: ACCEPT
    summary: GLO-1 is a Rab32/38-family small GTPase; GTPase activity is the conserved core activity of
      the Rab clade.
    reason: The PAINT node PTN001292747 covers the Rab family, whose members are experimentally characterised
      GTPases. GLO-1 retains the P-loop (GKT25S) and the switch-II catalytic glutamine (WDISGQ71), and
      the predicted hydrolysis-deficient Q71L and GTP-binding-deficient T25N mutants behave as expected
      for an active Rab in rescue assays. No direct hydrolysis assay exists for GLO-1, but the inheritance
      of the activity is well grounded.
    supported_by:
    - reference_id: PMID:30419011
      supporting_text: GLO-1 is a Rab32 family member and the conservation of G-motifs suggests that it
        functions as a GTPase [21, 22].
    - reference_id: PMID:30419011
      supporting_text: Expression of GFP::GLO-1(Q71L), which is predicted to lack GTP hydrolysis and maintain
        an active GTP-bound conformation [59], was able to functionally replace GLO-1(+) (Fig 5D and Tables
        1 and 2).
    - reference_id: PMID:30419011
      supporting_text: Whereas glo-1(+) wild-type and glo-1(Q71L) mutant transgenes restored birefringent,
        PGP-2-containing, and autofluorescent gut granules when expressed in glo-1(-) mutants, the glo-1(T25N)
        mutant did not.
