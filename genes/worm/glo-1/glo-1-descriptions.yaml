- source: Alliance_Imported
  text: glo-1 encodes a member of the Rab family of small GTPases that is similar
    to the vertebrate Rab32 and Rab38 proteins and Drosophila Rab-RP1/Lightoid; throughout
    development, glo-1 activity is required for biogenesis of the lysosome-related
    gut granules; in addition, glo-1 activity is required during embryonic development
    for normal body morphogenesis; in regulating gut granule formation, glo-1 acts
    downstream of apb-3 which encodes the AP-3 complex beta subunits; GLO-1 reporter
    fusions and antibodies indicate that GLO-1 is expressed in embryonic and adult
    intestinal cells, beginning at the E2 stage of intestinal development; within
    intestinal cells, GLO-1 colocalizes with lysosome-related gut granules.
  source_type: curated
