descriptions:
- source: UniProt
  text: Component of the IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport (PubMed:28479320). Moves along the ciliary axoneme and is involved
    in the assembly, localization and the movement of other intraflagellar transport
    (IFT) proteins along the cilia axoneme (PubMed:16957054, PubMed:22922713). May
    also associate with the BBSome complex in order to mediate ciliary transport (PubMed:22922713).
    Regulates cilia biogenesis, morphology and sensitivity to environmental cues (PubMed:16957054,
    PubMed:22922713).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5ECZ4
  source_id: G5ECZ4
