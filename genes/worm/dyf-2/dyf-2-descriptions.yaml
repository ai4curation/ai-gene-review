findings:
- category: discrepancy
  text: WormBase and the automated text assign DYF-2 to IFT complex B; UniProt and
    the review identify it as the IFT-A subunit WDR19/IFT144 and mark the IFT-B annotation
    as over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - UniProt
- category: gap
  text: WormBase reports that dyf-2 mutants are long-lived and resist heat stress
    and starvation; the review does not mention lifespan.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 2
  overall_notes: UniProt and the review put DYF-2 in IFT-A; WormBase and the automated
    text place it in IFT-B.
