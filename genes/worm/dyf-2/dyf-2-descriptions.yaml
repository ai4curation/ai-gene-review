gene_symbol: dyf-2
organism: worm
uniprot_id: G5ECZ4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport (PubMed:28479320). Moves along the ciliary axoneme and is involved
    in the assembly, localization and the movement of other intraflagellar transport
    (IFT) proteins along the cilia axoneme (PubMed:16957054, PubMed:22922713). May
    also associate with the BBSome complex in order to mediate ciliary transport (PubMed:22922713).
    Regulates cilia biogenesis, morphology and sensitivity to environmental cues (PubMed:16957054,
    PubMed:22922713).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5ECZ4
  source_id: G5ECZ4
- source: Alliance_Imported
  text: dyf-2 encodes an ortholog of human WDR19; DYF-2 associates withintraflagellar
    transport (IFT) particle complex B in sensory cilia, andis required for normal
    assembly and motion of IFT structures, includingcomplex A particles; consequently,
    DYF-2 is also required for normalcilial structure and chemosensation; dyf-2 expression
    is regulated byDAF-19; dyf-2 mutants are longer-lived than normal; this seems
    tocorrelate with the ability to withstand prolonged heat stress andstarvation
    in L1 larvae; in mice, WDR19 also localizes to cilia.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001118;class=Gene
  source_id: WB:WBGene00001118
- source: Alliance_Automated
  text: Involved in several processes, including chemotaxis; cilium organization;
    and olfactory behavior. Acts upstream of or within cilium assembly and intraciliary
    retrograde transport. Located in non-motile cilium. Part of intraciliary transport
    particle B. Is expressed in nervous system. Human ortholog(s) of this gene implicated
    in several diseases, including Caroli disease; Senior-Loken syndrome (multiple);
    asphyxiating thoracic dystrophy 5; cranioectodermal dysplasia 4; and nephronophthisis
    13. Orthologous to human WDR19 (WD repeat domain 19).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001118;class=Gene
  source_id: WB:WBGene00001118
