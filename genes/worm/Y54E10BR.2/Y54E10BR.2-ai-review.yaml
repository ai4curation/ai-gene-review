suggested_questions:
- question: >-
    Does the nematode-specific G4 motif variant (134-NKSE-137 vs canonical NKQD) in C. elegans
    Y54E10BR.2 accelerate spontaneous GDP/GTP exchange, and does Y54E10BR.2 dock onto the
    C. elegans Sys1 homolog T23F2.5 (note that C. elegans gene symbol sys-1 denotes an
    unrelated divergent beta-catenin) to recruit ARL-1 to intestinal Golgi stacks?
suggested_experiments:
- description: >-
    Compare intrinsic GDP dissociation and GTPase rates of purified wild-type C. elegans
    Y54E10BR.2 (134-NKSE-137) against an S136Q/E137D revertant, and image endogenous
    Y54E10BR.2::mNeonGreen and ARL-1::mScarlet in wild-type versus T23F2.5-depleted C. elegans
    intestinal epithelia.
