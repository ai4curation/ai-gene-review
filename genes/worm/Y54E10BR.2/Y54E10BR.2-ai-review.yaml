- id: file:worm/Y54E10BR.2/Y54E10BR.2-uniprot.txt
  title: UniProtKB Q9N3C8 (Q9N3C8_CAEEL) TrEMBL record
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Unreviewed TrEMBL record for C. elegans Y54E10BR.2 carries accurate PANTHER PTHR45909:SF1
      and InterPro Arf/Sar GTPase signatures, but exhibits two automated rule defects:
      ARBA00037377 over-propagates mammalian intestinal chylomicron and hepatic VLDL lipidation
      claims into a nematode that lacks a liver and chylomicron/VLDL lipoproteins, and
      PROSITE-ProRule PRU00753 misclassifies this Arf-family GTPase into the Rab family.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9N3C8
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Required for the lipidation of chylomicrons in the intestine and
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: >-
        Automated rule ARBA:ARBA00037377 asserts in CC -!- FUNCTION that C. elegans Y54E10BR.2
        is "Required for the lipidation of chylomicrons in the intestine and required for VLDL
        lipidation in the liver." Nematodes lack a liver and do not synthesize chylomicrons or
        hepatic VLDL particles (secreting vitellogenin yolk lipoprotein particles instead);
        restrict the mammalian lipoprotein-lipidation sentences of ARBA00037377 to
        Vertebrata/Mammalia while keeping the conserved trans-Golgi ARL1-targeting sentences.
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9N3C8
      slot: CC:SIMILARITY
      requested_change: CHECK
      asserted_value: Belongs to the small GTPase superfamily. Rab family.
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Automated rule PROSITE-ProRule:PRU00753 asserts "Belongs to the small GTPase
        superfamily. Rab family." on UniProtKB:Q9N3C8, whereas Q9N3C8 matches PS51417 (ARF),
        IPR006689 (Small_GTPase_ARF/SAR), IPR024156 (Small_GTPase_ARF), and PANTHER
        PTHR45909:SF1 and is an Arf-family GTPase ("Belongs to the small GTPase superfamily.
        Arf family.").
