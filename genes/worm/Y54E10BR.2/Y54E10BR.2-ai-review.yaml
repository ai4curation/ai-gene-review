description: >-
  Y54E10BR.2 (UniProtKB Q9N3C8) is a 191-residue Caenorhabditis elegans monomeric Arf-family
  small GTPase and the single 1:1 nematode ortholog of human ARFRP1 and Saccharomyces
  cerevisiae Arl3p in PANTHER subfamily PTHR45909:SF1. Lacking a Gly2 myristoylation motif,
  Y54E10BR.2 retains an N-terminal amphipathic helix starting with Met1-Tyr2
  (1-MYTLSAGIWEKFFK-14) characteristic of NatC-acetylated Golgi Sys1-receptor docking, together
  with a conserved Walker A P-loop (24-GLDNAGKT-31), Switch II catalytic glutamine
  (75-DLGGQ-79), and a conservatively diverged G4 guanine-recognition motif (134-NKSE-137 in
  place of canonical NKQD), supporting an inferred role in Golgi Arl1/golgin recruitment and
  post-Golgi protein transport.
