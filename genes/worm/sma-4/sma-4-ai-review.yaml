id: P45897
gene_symbol: sma-4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SMA-4 is the Smad4-like common-mediator Smad (co-Smad) of the C. elegans DBL-1/BMP-like
  Sma/Mab pathway. It is a dwarfin/MAD-family protein with MH1 and MH2 domains. SMA-4 is thought
  to partner the receptor-regulated Smads SMA-2 and SMA-3 in a heteromeric transcription-factor
  complex downstream of the DAF-4/SMA-6 receptors. sma-4 mutants have the same small body
  size and abnormal male tail phenotypes as the receptor and R-Smad mutants. Their small size
  reflects smaller cells with unchanged cell numbers, and the pathway represses the body-size
  target lon-1. sma-4 mutants do not form constitutive dauers, so dauer control by TGF-beta
  signaling goes through DAF-1 and the DAF-8/DAF-14/DAF-3 Smads instead. SMA-4 is also needed
  for BMP-dependent M lineage fate in sma-9 mutants, and for DAF-16-driven germline tumors.
