core_functions:
- description: Co-Smad (Smad4-like) of the DBL-1/BMP-like Sma/Mab pathway. It partners SMA-2
    and SMA-3 in a heteromeric Smad transcription-factor complex that regulates target genes
    to promote postembryonic body growth and male tail patterning.
