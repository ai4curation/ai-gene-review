  review:
    summary: 'IBA: heteromeric SMAD protein complex.'
    action: ACCEPT
    reason: R-Smad/co-Smad heteromers are the canonical active form. Genetically, SMA-2, SMA-3
      and SMA-4 are all required for, and non-redundant in, the same pathway, which is consistent
      with a heteromeric complex. Note that a direct SMA-2/SMA-3 interaction was not detected
      by yeast two-hybrid (PMID:28549065), so the exact stoichiometry is unresolved.
    supported_by:
    - *id010
    - reference_id: PMID:28549065
      supporting_text: Even though it has been suggested previously that SMA-2 and SMA-3 form
        a heterodimer [41], we were unable to detect a direct interaction between SMA-2 and
        SMA-3 in this assay (S5 Fig).
