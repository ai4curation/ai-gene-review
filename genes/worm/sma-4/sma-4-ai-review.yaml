suggested_questions:
- question: Is SMA-4 the obligate co-Smad for all DBL-1 outputs, including the caenacin antifungal
    response, or do some outputs act through SMA-3 alone?
- question: Does SMA-4 interact with the dauer-pathway R-Smads DAF-8/DAF-14 under any condition,
    as the IGI dauer annotation might imply?
suggested_experiments:
- description: Test SMA-4 nuclear accumulation (endogenous tag) in sma-2, sma-3 and sma-6
    mutants to establish R-Smad-dependent co-Smad translocation.
- description: Biochemically reconstitute SMA-2/SMA-3/SMA-4 complexes, with phospho-mimetic
    SSXS motifs on the R-Smads, to determine complex composition.
