- id: PMID:21215634
  title: Complexin has opposite effects on two modes of synaptic vesicle fusion.
  findings:
  - statement: Loss of CPX-1 increases tonic release 3-fold and decreases evoked release 10-fold at 
      the NMJ.
    supporting_text: Loss of CPX-1 results in a 3-fold increase in the rate of tonic synaptic 
      transmission at the neuromuscular junction, whereas stimulus-evoked SV fusion is decreased 
      10-fold.
  - statement: The clamp function requires SNARE binding (KY/AA) and the C-terminal domain.
    supporting_text: Rescue of cpx-1 with the SNARE-binding mutant KY/AA failed to rescue the tonic 
      rate of fusion (Figure 6A&C).
  - statement: CPX-1::GFP is diffuse along the axon and enriched at presynaptic terminals.
    supporting_text: CPX-1::GFP was diffusely expressed throughout the axon with some enrichment at 
      presynaptic terminals based on colocalization with an SV marker mCherry::Rab-3 (Figure 2C).
  - statement: cpx-1 is expressed broadly, including all cholinergic and GABAergic motor neurons.
    supporting_text: Expression was observed in a large number of neurons in the head, ventral cord,
      and tail, including all cholinergic and GABAergic motor neurons in the ventral cord (Figure 
      2A&B).
  - statement: Dual role, suppressing tonic exocytosis and promoting synchronous evoked fusion.
    supporting_text: 'These observations suggest a dual role for CPX-1: suppressing SV exocytosis, driven
      by low levels of endogenous neural activity, while promoting synchronous fusion of SVs driven by
      a depolarizing stimulus.'

  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the defining functional study of worm complexin.
