    summary: Complexin binds the assembled SNARE four-helix bundle but does not contribute a helix 
      to it; family-level propagation of complex membership.
    action: MARK_AS_OVER_ANNOTATED
    reason: Membership overstates the relationship. The GO SNARE complex is the four-helix bundle of
      Q- and R-SNAREs; complexin is an accessory ligand of that complex, which the SNARE binding row
      already captures. Not removed, since complexin-SNARE co-complexes are well documented.
    propagation_review:
