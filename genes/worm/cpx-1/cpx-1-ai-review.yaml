gene_symbol: cpx-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  CPX-1 is the principal Caenorhabditis elegans complexin, a small cytosolic protein whose central
  helix binds the assembled synaptic SNARE complex (UNC-64/RIC-4/SNB-1) at presynaptic terminals.
  It has opposite effects on the two modes of vesicle fusion at the neuromuscular junction:
  it clamps activity-independent tonic release, a function that requires SNARE binding and its
  C-terminal domain, and it promotes synchronous, stimulus-evoked release, which is reduced
  ten-fold in its absence. cpx-1 null animals are viable but slow-moving and aldicarb-hypersensitive,
  with normal neuronal development and synapse number. The protein is expressed in most neurons,
  including all cholinergic and GABAergic motor neurons, and is distributed along axons with
  enrichment at synaptic vesicle clusters.
