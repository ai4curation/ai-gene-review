- source: Alliance_Automated
  text: Predicted to enable SNARE binding activity. Predicted to be involved in modulation
    of chemical synaptic transmission; regulation of synaptic vesicle fusion to presynaptic
    active zone membrane; and synaptic vesicle exocytosis. Located in axon and synapse.
    Is expressed in nervous system. Used to study depressive disorder. Human ortholog(s)
    of this gene implicated in developmental and epileptic encephalopathy 63. Orthologous
    to several human genes including CPLX1 (complexin 1) and CPLX2 (complexin 2).
