knowledge_gaps:
- gap_statement: >-
    The molecular activity of CEC-10 is unknown. Specifically, it is untested whether its chromodomain
    binds methylated histone lysines (and which: H3K9me, H3K27me or other), and what, if anything, its
    ankyrin region binds.
  boundary: >-
    It is established only that CEC-10 has a canonical chromodomain (PROSITE/SMART matches), long
    disordered regions and an ankyrin-like region, and that it lacks a sequence-specific DNA-binding
    domain. The related C. elegans chromodomain protein CEC-4 reads methylated H3K9, but no binding,
    localization or interaction data exist for CEC-10.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Without a defined activity, the only GO annotations CEC-10 carries are inherited from a fungal
    cell-cycle complex that animals lack, so it is effectively unannotated.
  resolution: >-
    Peptide-array or isothermal titration binding of the recombinant chromodomain to modified histone
    tail peptides, tagged-allele localization in the germ line, and IP-mass spectrometry for partners.
  provenance:
  - reference_id: file:worm/cec-10/cec-10-notes.md
    supporting_text: No such data exist for CEC-10.
- gap_statement: >-
    The biological role of cec-10 is unknown; no loss-of-function phenotype has been reported, despite
    predominantly germline expression.
  boundary: >-
    Expression is reported mainly in the germ line (Bgee). No genetic or phenotypic study of cec-10 has
    been published.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Germline chromodomain proteins in C. elegans often act in heterochromatin maintenance or small-RNA
    pathways; whether cec-10 belongs to either is open.
  resolution: >-
    CRISPR deletion of cec-10 with brood-size, mortal-germline (multigenerational) and transgene-silencing
    assays, plus H3K9me ChIP in mutant germlines.
  provenance:
  - reference_id: UniProtKB:Q9N4L7
    supporting_text: Expressed in germ line (C elegans) and 4 other cell types or tissues.
suggested_questions:
- question: Should a negative (IRD) annotation be placed on the metazoan branch below PANTHER PTN000917496,
    or a Fungi-only taxon constraint be added to GO:0030907 MBF transcription complex and GO:0033309
    SBF transcription complex, so that sporadic animal PTHR43828 members such as CEC-10 stop inheriting
    MBF/SBF terms?
- question: Is CEC-10 a true descendant of an ancestral Swi6/Cdc10-like protein, or was it pulled into
    PTHR43828:SF3 by ankyrin-repeat similarity alone? A tree built only on the conserved ankyrin and
    C-terminal regions would show whether the subfamily assignment is sound.
- question: Does the CEC-10 chromodomain retain the aromatic cage needed to bind methyl-lysine?
suggested_experiments:
- description: Test binding of the recombinant CEC-10 chromodomain (residues ~40-120) to a panel of
    methylated histone H3 and H4 tail peptides (H3K9me1/2/3, H3K27me3, H3K36me3, H4K20me), with CEC-4
    as a positive control.
  hypothesis: The CEC-10 chromodomain is a methyl-lysine reader, which would place CEC-10 in chromatin
    regulation rather than in a cell-cycle transcription complex.
- description: Generate an endogenously tagged CEC-10 allele and a CRISPR null, then examine germline
    localization, brood size, the mortal germline phenotype over generations, and germline transgene
    silencing.
  hypothesis: CEC-10 acts on germline chromatin, and its loss affects germline heterochromatin or
    silencing.
