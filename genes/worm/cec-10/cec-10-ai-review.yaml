  review:
    summary: >-
      IBA seeded by the DNA-binding SBF/MBF subunits Res2 (S. pombe), Swi4 and Mbp1 (S. cerevisiae),
      all sequence-specific transcription factors that bind DNA through an N-terminal KilA-N/APSES
      domain.
    action: REMOVE
    reason: >-
      A DNA-binding transcription factor activity needs a sequence-specific DNA-binding domain.
      CEC-10 has none: its only recognised domains are a chromodomain and an ankyrin region, and it
      lacks the KilA-N/APSES domain that confers this activity on every seed. Within the fungal
      family the activity is not even shared by the non-DNA-binding Swi6/Cdc10 subunits, which
      PANTHER places in the same subfamily (SF3) as CEC-10. The node assertion is therefore
      over-propagated to CEC-10 on both lineage and domain-architecture grounds.
    supported_by:
    - reference_id: file:worm/cec-10/cec-10-bioinformatics/RESULTS.md
      supporting_text: CEC-10 has no KilA-N / APSES-type HTH DNA-binding domain (IPR003163, IPR018004, PF04383).
