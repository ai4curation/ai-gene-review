      supporting_text: SMART; SM00298; CHROMO; 1.
    - reference_id: PMID:26607792
      supporting_text: CEC-4 binds preferentially mono-, di-, or tri-methylated H3K9 and localizes at
        the nuclear envelope independently of H3K9 methylation and nuclear lamin.
