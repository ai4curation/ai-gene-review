id: Q9N4L7
gene_symbol: cec-10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  cec-10 (ZK973.2) encodes an uncharacterized 865-residue Caenorhabditis elegans protein. It has
  an N-terminal chromodomain (residues ~49-110) of the kind that in other proteins reads methylated
  histone lysines, long disordered and compositionally biased regions, and a single recognisable
  ankyrin repeat (~520-552) inside a larger ankyrin-like region. Sequence-family classifiers (PANTHER
  PTHR43828, InterPro IPR051642 "SWI6-like") group it with the fungal Swi4/Swi6/Mbp1/Res1/Res2/Cdc10
  subunits of the SBF and MBF G1/S transcription complexes. It lacks the KilA-N/APSES DNA-binding domain
  that defines the DNA-binding subunits of those complexes, and it has only weak pairwise similarity
  to any of them. Transcriptome data report expression mainly in the germ line. No experimental study
  of its molecular activity, chromatin binding, localization or loss-of-function phenotype has been
  published, so its function is unknown.
existing_annotations:
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000174900
  - CGD:CAL0000183437
  - CGD:CAL0000186541
  - PANTHER:PTN000917496
  - SGD:S000000913
  - SGD:S000002214
  - SGD:S000004172
  review:
    summary: >-
      IBA from PANTHER node PTN000917496, whose experimental seeds are the fungal SBF/MBF subunits
      (budding yeast Swi4, Mbp1, Swi6 and three Candida members). These complexes drive G1/S
      transcription in fungi. CEC-10 is a nematode chromodomain protein with no DNA-binding
      KilA-N/APSES domain, and nothing links it to the cell cycle.
    action: REMOVE
    reason: >-
      In fungi, G1/S control through SBF/MBF is a lineage-specific innovation. The DNA-binding
      subunits came from a viral KilA-N protein at the base of the fungal lineage, and no homologs
      exist outside fungi. Animals, nematodes included, run G1/S transcription through E2F/DP-Rb.
      The PTN000917496 IBD is placed deep enough to take in a sporadic metazoan
      chromodomain/ankyrin lineage that cannot form an MBF/SBF complex: there is no partner
      DNA-binding subunit, and CEC-10 lacks the KilA-N domain itself. Pairwise similarity between
      CEC-10 and the six yeast seeds is weak and confined to ankyrin or low-complexity stretches. No
      cell-cycle phenotype or expression pattern has been reported for cec-10. The process cannot
      be inherited from this node.
    supported_by:
    - reference_id: PMID:27162172
      supporting_text: We were unable to find any eukaryotic homologs of SBF or Whi5 outside of fungi, with
        a few exceptions related to DNA viruses that we discuss later.
    - reference_id: PMID:27162172
      supporting_text: SBF and its ancestral animal counterpart E2F
    - reference_id: file:worm/cec-10/cec-10-bioinformatics/RESULTS.md
      supporting_text: CEC-10 has no KilA-N / APSES-type HTH DNA-binding domain (IPR003163, IPR018004, PF04383).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000917496
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Fungal SBF/MBF seeds (budding-yeast Swi4, Mbp1, Swi6; Candida members) genuinely drive
          G1/S transcription. The node sits above a metazoan chromodomain/ankyrin lineage that has neither
          the KilA-N DNA-binding subunit nor any evidence of a cell-cycle role.
