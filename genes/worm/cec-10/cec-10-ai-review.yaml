  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026330
  review:
    summary: >-
      ARBA machine-learning prediction of nuclear localization. CEC-10 has a canonical chromodomain
      (PROSITE PS50013, SMART SM00298). In characterised proteins this module binds methylated histone
      tails, so a nuclear (chromatin) location is plausible. CEC-10 localization has not been tested.
    action: KEEP_AS_NON_CORE
    reason: >-
      Nuclear localization fits the domain architecture: a chromodomain, as in the related C.
      elegans chromodomain protein CEC-4, which reads methylated H3K9 at the nuclear periphery.
      Nothing contradicts it, so the term is kept. It is a broad prediction and not evidence of any
      specific function, so it is not treated as core. The ARBA rule itself is not cited as support.
    supported_by:
