- term:
    id: GO:0030907
    label: MBF transcription complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000917496
  - PomBase:SPAC22F3.09c
  - PomBase:SPBC336.12c
  - PomBase:SPBC725.16
  - SGD:S000002214
  - SGD:S000004172
  review:
    summary: >-
      IBA placing CEC-10 in the MBF complex, seeded by fission yeast Res2, Cdc10 and Res1 and budding
      yeast Mbp1 and Swi6. MBF is a fungal G1/S transcription complex formed by a KilA-N DNA-binding
      subunit (Mbp1, Res1/Res2) and the Swi6/Cdc10 cofactor. Wei et al. 2020 (rate-ratio screen)
      flagged this annotation, and the related SBF transcription complex IBA, as likely
      misannotations for this protein.
    action: REMOVE
    reason: >-
      Animals cannot assemble MBF: its DNA-binding subunits are fungal-specific, derived from a viral
      KilA-N protein, and C. elegans has no KilA-N protein in this family. CEC-10 sits in the same
      PANTHER subfamily as Swi6/Cdc10 (SF3), which explains the propagation. It shares only weak,
      mostly ankyrin-region and low-complexity similarity with them, and it carries an N-terminal
      chromodomain absent from every fungal member. The PTN000917496 IBD is placed above a metazoan
      branch that cannot hold the complex: a lineage/taxon mismatch caused by node depth. The Wei et
      al. flag stands. The better fix is an IRD on the metazoan branch below PTN000917496, or a
      Fungi-only taxon constraint on GO:0030907.
    additional_reference_ids:
    - PMID:32470107
    supported_by:
    - reference_id: PMID:27162172
      supporting_text: The emergence of the new fungal regulators SBF, which includes the large APSES family,
        and Whi5 is abrupt and occurs near the split of basal fungi from metazoans
    - reference_id: PMID:32470107
      supporting_text: Importantly, 56% of the misannotations are 'Inferred from Biological
        aspect of Ancestor (IBA)'
    - reference_id: file:worm/cec-10/cec-10-bioinformatics/RESULTS.md
      supporting_text: Pairwise alignment gives no
        evidence that CEC-10 is an ortholog of any MBF or SBF subunit.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000917496
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: MBF membership is experimentally solid for the fission-yeast (Res1, Res2, Cdc10) and
          budding-yeast (Mbp1, Swi6) seeds. The node is too deep for the metazoan branch carrying
          CEC-10, which has no MBF partners.
