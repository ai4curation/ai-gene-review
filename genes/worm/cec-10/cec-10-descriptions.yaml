findings:
- category: discrepancy
  text: Both automated texts present CEC-10 as a Swi6-like G1/S transcription activator
    in MBF (and, in RefSeq, SBF) complexes; the review removes all five such IBA rows
    because the protein lacks the DNA-binding domain and the complexes are fungal.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: Neither text mentions the N-terminal chromodomain, the protein's one recognisable
    functional module.
  sources:
  - Alliance_Automated
  - RefSeq
