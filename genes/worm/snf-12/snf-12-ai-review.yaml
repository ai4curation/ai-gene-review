  review:
    summary: snf-12 mutants fail to induce nlp-29 cluster AMP genes after infection by the fungus D. coniospora;
      SNF-12 acts cell autonomously in the epidermis together with STA-2.
    action: ACCEPT
    reason: Direct IMP evidence (two alleles) from the paper that identified SNF-12 in an AMP-reporter
      screen. The NIPI-4 paper reconfirmed by qRT-PCR that nlp-29 induction after infection is abrogated
      in snf-12 mutants. SNF-12 binds STA-2 and is part of the signalling machinery, so it does part of
      the regulatory work. This is the core biological role of SNF-12.
    supported_by:
    - reference_id: PMID:21575913
      supporting_text: we identify the sodium-neurotransmitter symporter SNF-12, a member of the solute
        carrier family (SLC6), as being essential for both these immune signaling pathways
    - reference_id: PMID:22470487
      supporting_text: We could confirm by qRT-PCR that in the nipi-4(fr106) mutant, just as in sta-2
        or snf-12 mutants [21], the induction of nlp-29 after infection was essentially abrogated.
