    summary: IBA transfer of amino acid:sodium symporter activity from an SLC6 node seeded by glycine
      and proline transporters (SLC6A5, SLC6A9, SLC6A7) and SLC6A14.
    action: KEEP_AS_NON_CORE
    reason: SNF-12 is an SLC6 family member and a sodium-coupled symporter activity is plausibly inherited,
      so I do not reject the PAINT node placement. However, no transport activity or substrate has been
      demonstrated for SNF-12. The epidermal immunity review states that it is predicted to transport
      a bioactive amine and that its endogenous substrate is unknown. Its documented role is in STA-2
      signalling, not transport, so this inferred activity is kept as non-core.
    supported_by:
