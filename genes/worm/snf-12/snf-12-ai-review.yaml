- id: PMID:21575913
  title: Unusual regulation of a STAT protein by an SLC6 family transporter in C. elegans epidermal innate
    immunity.
  findings:
  - statement: SNF-12 is essential for AMP induction after fungal infection and binds STA-2 directly.
    supporting_text: We also identify the STAT transcription factor-like protein STA-2 as a direct physical
      interactor of SNF-12 and show that the two proteins function together to regulate AMP gene expression
      in the epidermis
  full_text_unavailable: true
- id: PMID:22470487
  title: The pseudokinase NIPI-4 is a novel regulator of antimicrobial peptide gene expression.
  findings:
  - statement: SNF-12 binds STA-2 through its C terminus and is found in endosome-like vesicles.
    supporting_text: SNF-12 is found in endosome-like vesicles in the epidermis, where it may act as a
      signaling platform during the innate immune response.
- id: PMID:26716073
  title: Mechanisms of innate immunity in C. elegans epidermis.
  findings:
  - statement: The transport substrate of SNF-12 is unknown.
    supporting_text: SNF-12/SLC6 is predicted to be a transporter of a bioactive amine, but its endogenous
      substrate has yet to be identified.
- id: PMID:31995031
  title: Microtubule plus-end dynamics link wound repair to the innate immune response.
  findings:
  - statement: SNF-12 is in an undefined apical membrane compartment that does not colocalize with endosome,
      lysosome or plasma-membrane markers, and it is recruited to wounds along microtubules.
    supporting_text: SNF-12 localizes to apical clusters that are recruited at the wound site in a MT-dependent
      way.
core_functions:
- description: SNF-12 binds the STAT-like transcription factor STA-2 through its C terminus on apical
    endosome-like vesicles of the epidermis, and is required cell autonomously for STA-2-dependent induction
    of AMP genes after fungal infection and wounding. How SNF-12 activates STA-2, and whether its (unknown)
    transport activity is involved, is not known.
  molecular_function:
    id: GO:0097677
    label: STAT family protein binding
  directly_involved_in:
