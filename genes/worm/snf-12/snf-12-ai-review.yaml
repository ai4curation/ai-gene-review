  - reference_id: PMID:22470487
    supporting_text: SNF-12 is found in endosome-like vesicles in the epidermis, where it may act as a
      signaling platform during the innate immune response.
suggested_questions:
- question: What is the transport substrate of SNF-12, and is transport activity needed for STA-2 activation,
    or does SNF-12 act purely as a scaffold?
- question: Does SNF-12 binding hold STA-2 inactive (as MUP-4 does at hemidesmosomes), or is it needed
    to activate STA-2 after PMK-1 signalling?
suggested_experiments:
- description: Express SNF-12 in Xenopus oocytes or HEK cells and screen candidate amines and amino acids
    for sodium-dependent uptake. Test transport-dead substitutions (e.g. in the conserved sodium-binding
    sites) for rescue of nlp-29 induction in snf-12 mutants.
- description: Map how the SNF-12 C terminus binds STA-2, and test whether a binding-deficient SNF-12
    rescues AMP induction after D. coniospora infection.
