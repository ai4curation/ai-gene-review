  review:
    summary: IBA transfer of plasma membrane localization from SLC6 family members.
    action: MARK_AS_OVER_ANNOTATED
    reason: Most characterized SLC6 transporters act at the plasma membrane, which explains the IBA. For
      SNF-12, however, colocalization analyses with plasma-membrane lipid markers and endosome/lysosome
      markers found no colocalization. SNF-12 is in a yet-undefined apical membrane compartment and in
      endosome-like vesicles. There is no experimental support for SNF-12 being active at the plasma membrane.
    supported_by:
    - reference_id: PMID:31995031
      supporting_text: We performed colocalisation analyses between SNF-12::GFP and available vesicular
        and plasma membrane markers (early, late and recycling endosomes, lysosomes, plasma membrane lipids).
    - reference_id: PMID:31995031
      supporting_text: This indicates that SNF-12 is in a yet-to-be defined apical membrane compartment.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000177662
