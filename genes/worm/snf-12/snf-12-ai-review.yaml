gene_symbol: snf-12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SNF-12 is a multi-pass membrane protein of the SLC6 sodium/neurotransmitter symporter family
  expressed in the C. elegans epidermis (hypodermis). Its transport substrate has not been identified.
  SNF-12 is required cell autonomously in the epidermis for induction of the nlp-29 cluster of antimicrobial
  peptide (AMP) genes after infection by the fungus Drechmeria coniospora and after wounding, and for
  constitutive expression of caenacin (cnc) AMP genes. Its C terminus binds the STAT-like transcription
  factor STA-2, and the two proteins act together downstream of the PKC/p38 MAPK (PMK-1) cascade to drive
  AMP transcription. SNF-12 resides in apical, endosome-like vesicular clusters of the epidermis that
  do not coincide with known endosomal, lysosomal or plasma-membrane markers; after wounding these clusters
  are recruited to the wound site in a microtubule-dependent manner. SNF-12 is thought to act as a vesicular
  signalling platform for STA-2 rather than through a known transport activity.
