descriptions:
- source: UniProt
  text: Probably mediates sodium-dependent uptake of unknown small molecule(s) (PubMed:21575913).
    By positively modulating expression, in the epidermis, of antimicrobial peptides
    such as nlp-29, plays a role in resistance to fungal infection and in the response
    to physical wounding and phorbol ester PMA treatment (PubMed:21575913). Role in
    response to wounding of the epidermis may be facilitated by recruitment of snf-12
    to the wound site by microtubule-dependent vesicle trafficking (PubMed:31995031).
    Functions cell autonomously in the epidermis, in concert with STAT transcription
    factor sta-2, probably acting at vesicular membranes, downstream of a p38 MAPK/pmk-1
    pathway (PubMed:21575913).
