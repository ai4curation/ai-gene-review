- source: Alliance_Imported
  text: 'snf-12 encodes a transmembrane protein that is member of a highly conserved
    sodium-dependent neurotransmitter symporter family orthologous to mammalian sodium
    and chloride-dependent neurotransmitter transporters, or solute carrier 6 family
    (SLC6) members (OMIM: 610300); snf-12 is essential for a neuroendocrine TGF-beta
    and p38/MAPK immune signaling pathways; snf-12 is required cell autonomously for
    the response to infection in the epidermis, specifically for upregulating expression
    of nlp-29 and cnc-2 which encode anti-microbial peptides; SNF-12 is an atypical
    SLC6 protein that specifically regulates AMP gene expression; SNF-12 physical
    interacts with the STAT transcription factor-like protein STA-2 with which it
    functions to regulate antimicrobial gene expression downstream of a G protein/PKC
    delta pathway and partially downstream of p38/MAPK PMK-1; SNF-12 is expressed
    predominantly near the apical surface in epidermal cells in endosome-like vesicles
    where it colocalizes with STA-2; snf-12 is also expressed in the seam, excretory
    cell, and the amphid and phasmid socket cells.'
