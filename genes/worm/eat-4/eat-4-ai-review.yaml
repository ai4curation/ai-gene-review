core_functions:
- description: Vesicular glutamate transporter of glutamatergic neurons; uses the
    proton electrochemical gradient generated by the synaptic vesicle V-ATPase to
    concentrate L-glutamate into the vesicle lumen, filling vesicles for
    glutamatergic synaptic transmission.
