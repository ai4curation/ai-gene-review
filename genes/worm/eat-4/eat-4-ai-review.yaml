gene_symbol: eat-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EAT-4 is the sole vesicular glutamate transporter (VGLUT) of
  Caenorhabditis elegans, a major facilitator superfamily protein orthologous to
  mammalian SLC17A6/7/8. It sits in the synaptic vesicle membrane of glutamatergic
  neurons and concentrates cytosolic L-glutamate into the vesicle lumen, using the
  proton electrochemical gradient generated by the vesicular V-ATPase, so that the
  vesicles release glutamate on exocytosis. eat-4 is expressed in a defined subset
  of neurons (including the pharyngeal motor neuron M3, the touch receptor neurons
  ALM and AVM, the polymodal nociceptor ASH and the male-repurposed PHC) and its
  expression defines glutamatergic neuron identity. Loss of eat-4 abolishes
  glutamatergic transmission from these neurons without otherwise impairing them,
  producing delayed pharyngeal muscle relaxation, loss of ASH-mediated nose-touch
  and osmotic avoidance, reduced spontaneous reversals, defective touch
  habituation, and abnormal male turning and vulva-location behaviour during mating.
