suggested_questions:
- question: Has vesicular glutamate uptake by EAT-4 been measured directly (e.g. in
    reconstituted proteoliposomes or purified worm synaptic vesicles), and is it
    membrane-potential-driven and chloride-stimulated like mammalian VGLUTs?
suggested_experiments:
- description: Express EAT-4 in a heterologous vesicular system (e.g. PC12 or
    reconstituted liposomes with bacteriorhodopsin) and measure glutamate uptake
    dependence on delta-psi, delta-pH and chloride.
