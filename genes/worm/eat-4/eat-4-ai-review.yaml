- term:
    id: GO:0015501
    label: glutamate:sodium symporter activity
  evidence_type: ISS
  original_reference_id: PMID:9870947
  qualifier: enables
  supporting_entities:
  - UniProtKB:P51907
  review:
    summary: Sequence-similarity transfer from human SLC17A1 (NPT1, a Na+/phosphate
      cotransporter), reflecting the 1999 proposal that EAT-4 is a Na-Pi
      cotransporter (PMID:9870947). Vesicular glutamate transport by VGLUTs is
      driven by the membrane potential of the V-ATPase proton gradient, not by
      sodium symport; Na+-coupled glutamate symport is the mechanism of the
      plasma-membrane EAAT (SLC1) family.
    action: REMOVE
    reason: Wrong transport mechanism and wrong template. EAT-4 belongs to the
      VGLUT subfamily and loads synaptic vesicles; it is not a sodium:glutamate
      symporter. The cited paper itself proposed phosphate, not glutamate, as the
      Na+-coupled substrate, so the term is supported neither by the reference nor
      by current understanding. Computational (ISS) annotation, so removal is
      appropriate.
    supported_by:
    - reference_id: PMID:9870947
      supporting_text: it seems likely that eat-4 encodes a C. elegans
        sodium-dependent inorganic phosphate cotransporter
