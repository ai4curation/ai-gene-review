- id: PMID:9870947
  title: EAT-4, a homolog of a mammalian sodium-dependent inorganic phosphate
    cotransporter, is necessary for glutamatergic neurotransmission in
    caenorhabditis elegans.
  findings:
  - statement: eat-4 encodes a homologue of rat BNPI (later shown to be VGLUT1).
    supporting_text: We find that eat-4 encodes a protein similar in sequence to a
      mammalian brain-specific sodium-dependent inorganic phosphate cotransporter I
      (BNPI)
  - statement: Loss of eat-4 specifically impairs glutamatergic transmission.
    supporting_text: Loss-of-function mutations in eat-4 cause defective
      glutamatergic chemical transmission but appear to have little effect on other
      functions of neurons
  - statement: eat-4 mutants have reduced M3 glutamatergic transmission and
      delayed pharyngeal relaxation.
    supporting_text: In eat-4 mutants, pharyngeal muscle relaxation is delayed
      because of dramatically reduced pharyngeal motor neuron M3 synaptic
      transmission
