- id: PMID:11717360
  title: The EGL-3 proprotein convertase regulates mechanosensory responses of
    Caenorhabditis elegans.
  findings:
  - statement: eat-4 mutants lack the VGLUT and are defective in all three
      ASH-mediated avoidance behaviours.
    supporting_text: All three ASH-mediated sensory behaviors are defective in eat-4
      mutants ( Berger et al., 1998 ; Hart et al., 1999 ), which lack the vesicular
      glutamate transporter (VGLUT)
  - statement: eat-4 is expressed in ASH.
    supporting_text: The eat-4 VGLUT gene is expressed in the ASH neurons
  - statement: eat-4;egl-3 double mutants are nose-touch insensitive, so glutamate
      release is required for the response.
    supporting_text: We found that eat-4 VGLUT ;egl-3 PC2 double mutants were
      insensitive to nose touch (Fig. 5 B ), suggesting that glutamate release is
      required for restoration of the nose touch response
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; eat-4 used as the glutamate-release-defective
      background.
