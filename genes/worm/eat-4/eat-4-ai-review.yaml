  review:
    summary: In mammals VGLUTs mark excitatory glutamatergic synapses. In C. elegans
      EAT-4 also loads vesicles at glutamatergic synapses that are inhibitory
      through glutamate-gated chloride channels, e.g. the M3 to pharyngeal muscle
      synapse whose IPSPs are lost in eat-4 mutants (PMID:9870947).
    action: KEEP_AS_NON_CORE
    reason: Correct for many EAT-4 synapses (e.g. ASH to command interneurons via
