    overall_notes: Correct and cited on glutamatergic transmission, AWB/AWC food detection
      and male turning, but does not say it is a vesicular glutamate transporter.
- source: Alliance_Imported
  text: eat-4 encodes an ortholog of the mammalian BNPI vesicular glutamate transporter
    that affects chemotaxis, feeding, foraging and thermotaxis; eat-4 is expressed
    in specific neurons, including M3L and M3R which are known to be glutamatergic.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001135;class=Gene
