descriptions:
- source: UniProt
  text: Required for glutamatergic synaptic transmission (PubMed:10818169, PubMed:14762140,
    PubMed:14981253, PubMed:15371514, PubMed:9526004, PubMed:9870947). In AWB and
    AWC sensory neurons, required for the detection of preferred food sources, probably
    via glutamatergic neurotransmission from sensory neurons (PubMed:25009271). Negatively
    regulates the turning step of male mating behavior (PubMed:17611271).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34644
  source_id: P34644
