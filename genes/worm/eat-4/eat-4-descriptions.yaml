    - rubric: specificity
      score: 4
    overall_notes: 'Concise: BNPI/VGLUT ortholog affecting chemotaxis, feeding, foraging,
      thermotaxis; M3 expression.'
- source: Alliance_Automated
  text: Predicted to enable L-glutamate transmembrane transporter activity; glutamate:sodium
    symporter activity; and neurotransmitter transmembrane transporter activity. Involved
    in several processes, including glutamatergic synaptic transmission; positive
    regulation of backward locomotion; and regulation of male mating behavior. Predicted
    to be located in plasma membrane and synapse. Predicted to be active in excitatory
    synapse and synaptic vesicle membrane. Is expressed in intestine; nerve ring;
    nervous system; and pharynx. Human ortholog(s) of this gene implicated in autosomal
    dominant nonsyndromic deafness 25. Orthologous to several human genes including
    SLC17A7 (solute carrier family 17 member 7) and SLC17A8 (solute carrier family
    17 member 8).
  source_type: automated
