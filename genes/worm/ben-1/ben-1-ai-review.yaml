  review:
    summary: PAINT annotation of mitotic cell-cycle involvement.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      BEN-1 is a beta-tubulin structural subunit, but the evidence for this
      isotype points to a nonessential, benzimidazole-sensitive neuronal
      beta-tubulin rather than a mitotic beta-tubulin. C. elegans animals
      lacking ben-1 are viable, coordinated and drug resistant, so a mitotic
      cell-cycle row over-propagates generic beta-tubulin biology to this
      paralog.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000172598
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PAINT places mitotic cell cycle at the tubulin root rather than
          limiting it to beta-tubulin paralogs that provide the mitotic
          microtubule pool; BEN-1 is dispensable for viability and appears to
          be a nonessential benzimidazole-sensitive neuronal isotype in C.
          elegans.
    supported_by:
    - &driscoll_deletion
      reference_id: PMID:2592410
      supporting_text: >-
        Since the deletion strains appear to be fully resistant to the drugs,
        the ben-1 product appears to be the only benzimidazole-sensitive
        beta-tubulin in C. elegans.
    - reference_id: PMID:42247472
      supporting_text: >-
        The third most highly expressed beta-tubulin, ben-1, is largely
        restricted to neurons, specifically cholinergic and glutamatergic
        neurons
