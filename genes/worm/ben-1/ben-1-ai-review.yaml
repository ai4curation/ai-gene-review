- term:
    id: GO:0018991
    label: egg-laying behavior
  evidence_type: IMP
  original_reference_id: PMID:24780738
  qualifier: involved_in
  review:
    summary: Egg-laying RNAi phenotype from an in vivo microtubule-dynamics screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The WormBase row maps Lacroix et al.'s TBB-5 uterine-muscle RNAi hit to
      ben-1, consistent with recent C. elegans literature listing ben-1, rather
      than a separate tbb-5 locus, among the six beta-tubulin genes. The
      tissue-specific RNAi phenotype shows a differentiated-cell context that
      needs this beta-tubulin isotype, but the direct BEN-1 role remains
      structural contribution to microtubule organization rather than the
      organism-level egg-laying behavior.
    supported_by:
    - reference_id: PMID:24780738
      supporting_text: >-
        Tissue-specific RNAi of 5 of these MAPs induced Egl (Figure 5A; KLP-7,
        KLP-13, CCPP-6, TTLL-15, and TBB-5), confirming that they act in egg
        laying via a role in the non-neuronal cells of the egg-laying
        apparatus.
    - reference_id: PMID:42247472
      supporting_text: >-
        the free-living model nematode species C. elegans has six
        beta-tubulin genes (tbb-1, tbb-2, mec-7, tbb-4, ben-1, and tbb-6)
