id: Q18817
gene_symbol: ben-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  BEN-1 is a nonessential Caenorhabditis elegans beta-tubulin isotype that can
  dimerize with alpha-tubulin and contribute GTP-binding, GTP-hydrolyzing
  beta-tubulin subunits to microtubules. It is dispensable for viability and
  movement under standard laboratory conditions because the broadly expressed
  beta-tubulins TBB-1 and TBB-2 provide the essential microtubule pool, but
  BEN-1 is the principal C. elegans beta-tubulin isotype whose presence confers
  sensitivity to benzimidazole anthelmintics such as benomyl and albendazole.
