- id: PMID:24780738
  title: In situ imaging in C. elegans reveals developmental regulation of microtubule
    dynamics.
  findings:
  - statement: >-
      Lacroix et al. identified a TBB-5 tubulin-isoform RNAi requirement in
      uterine muscle cells during egg laying, supporting the WormBase IMP row
      for ben-1 while leaving microtubule organization as the direct molecular
      process.
    supporting_text: >-
      All other Egl worms tested failed to respond to both drugs, demonstrating
      that CCPP-6, KLP-7, KLP-13, TBB-5 and TTLL-15 are required in UMCs for
      proper egg-laying (Figure 5B and 5C).
- id: PMID:2592410
  title: Genetic and molecular analysis of a Caenorhabditis elegans beta-tubulin that
    conveys benzimidazole sensitivity.
  full_text_unavailable: true
  findings:
  - statement: >-
      ben-1 encodes a beta-tubulin, and deletion alleles are viable,
      coordinated and fully resistant to benzimidazoles.
    supporting_text: >-
      Molecular cloning and DNA sequence analysis established that ben-1
      encodes a beta-tubulin.
- id: PMID:30372484
  title: >-
    Extreme allelic heterogeneity at a Caenorhabditis elegans beta-tubulin
    locus explains natural resistance to benzimidazoles.
  findings:
  - statement: >-
      Natural albendazole resistance in C. elegans is largely driven by many
      low-frequency ben-1 loss-of-function alleles, confirming that BEN-1 is
      the main benzimidazole-sensitive beta-tubulin in this species.
    supporting_text: >-
      We show that a major source of ABZ resistance in the C. elegans
      population is driven by putative loss-of-function (LoF) variants in the
      ben-1 locus.
- id: PMID:38991432
  title: Quantitative tests of albendazole resistance in Caenorhabditis elegans
    beta-tubulin mutants.
  findings:
  - statement: >-
      Quantitative albendazole-resistance assays found that the C. elegans
      ben-1 loss-of-function strain is a high-resistance control for beta-tubulin
      variant tests.
    supporting_text: >-
      We found that the loss of ben-1 conferred the maximum level of resistance
      following exposure to a single concentration of albendazole
- id: PMID:42247472
  title: >-
    Evaluating beta-tubulin variants as predictors of benzimidazole resistance
    across Caenorhabditis nematodes.
  findings:
  - statement: >-
      BEN-1 remains the primary beta-tubulin linked to albendazole resistance
      across Caenorhabditis tests, whereas tbb-1, tbb-2, mec-7 and tbb-4
      high-impact variants did not confer resistance in the species assayed.
    supporting_text: >-
      Strains with variants in tbb-1, tbb-2, mec-7, and tbb-4 were not
      resistant to ABZ in any of the three Caenorhabditis species, indicating
      that ben-1 is the primary beta-tubulin that confers resistance.
core_functions:
- description: >-
    Nonessential beta-tubulin structural subunit that can assemble with
    alpha-tubulin into microtubules and supply the exchangeable GTP-binding
    beta chain in the heterodimer; its beta-tubulin sequence makes it the major
    benzimidazole-sensitive beta-tubulin isotype in C. elegans.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
  - id: GO:0000226
    label: microtubule cytoskeleton organization
  locations:
  - id: GO:0005874
    label: microtubule
  supported_by:
  - *driscoll_identity
  - *driscoll_deletion
  - reference_id: PMID:30372484
    supporting_text: >-
      Additionally, we find purifying selection at all five β-tubulin genes,
      despite predicted loss-of-function variants in ben-1
  - reference_id: file:genes/worm/ben-1/ben-1-uniprot.txt
    supporting_text: >-
      Alpha-beta heterodimers associate head-to-tail to form protofilaments
      running lengthwise along the microtubule wall
suggested_questions:
- question: >-
    Which C. elegans cell types incorporate BEN-1 into benzimidazole-sensitive
    microtubules in vivo, and do those microtubules differ dynamically from
    TBB-1/TBB-2-containing microtubules?
suggested_experiments:
- description: >-
    Combine endogenous BEN-1 tagging with alpha/beta-tubulin isotype-specific
    perturbations and albendazole exposure in cholinergic and GABAergic neurons
    to resolve the microtubule pools that create BEN-1-dependent drug
    sensitivity.
  hypothesis: >-
    BEN-1-containing neuronal microtubules are the primary cellular target of
    benzimidazoles in C. elegans, while TBB-1/TBB-2-rich essential
    microtubules are comparatively drug resistant.
  experiment_type: live-cell imaging
