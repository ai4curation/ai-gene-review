    summary: PAINT annotation of mitotic cell-cycle involvement.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      BEN-1 is a beta-tubulin structural subunit, but this isotype is largely
      neuronal, and the Lacroix uterine-muscle RNAi hit points to a
      post-mitotic differentiated-cell context rather than a generic mitotic
      role. The mitotic-cell-cycle IBD is therefore a root beta-tubulin
      assertion that should not be propagated to BEN-1 without isotype-specific
      evidence.
