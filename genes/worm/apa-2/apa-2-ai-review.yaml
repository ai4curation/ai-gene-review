id: Q22601
gene_symbol: apa-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'apa-2 (formerly apt-4) encodes the alpha-adaptin large subunit of the AP-2 clathrin adaptor
  complex of Caenorhabditis elegans. Alpha-adaptin forms the alpha/sigma2 half of the heterotetrameric
  adaptor: its trunk contributes phosphatidylinositol-4,5-bisphosphate binding that docks AP-2 on the
  plasma membrane and, with sigma2, the pocket that reads dileucine sorting signals, while its hinge and
  appendage (''ear'') domain recruits accessory endocytic proteins such as the RAB-5 exchange factor RME-6,
  the RAB-35 regulator RME-4, the clathrin-associated sorting protein DAB-1 and the engulfment adaptor
  CED-6. APA-2 is expressed in most cells, is highest in neurons, and marks plasma-membrane clathrin-coated
  pits in coelomocytes, the presynaptic periactive zone of motor neurons and phagocytic cups around apoptotic
  corpses. It functions in clathrin-mediated endocytosis of yolk by oocytes, synaptic vesicle retrieval
  at neuromuscular junctions, and CED-1-dependent apoptotic-cell engulfment. Null mutants are viable but
  dumpy, egg-laying defective and mildly uncoordinated, with a 30% reduction in synaptic vesicles; combined
  loss of alpha and mu2 removes essentially all AP-2 function and is nearly lethal.'
