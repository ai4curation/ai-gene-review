- term:
    id: GO:0032794
    label: GTPase activating protein binding
  evidence_type: IPI
  original_reference_id: PMID:15895077
  qualifier: enables
  supporting_entities:
  - WB:WBGene00004377
  review:
    summary: IPI 'GTPase activating protein binding' with RME-6. RME-6 is a Vps9-domain guanine-nucleotide
      exchange factor for RAB-5, not a GTPase-activating protein; the paper shows it binds GDP-RAB-5 and
      that rme-6 mutants have low RAB-5 activity. The alpha-adaptin/RME-6 co-immunoprecipitation is genuine
      but the term mischaracterises the partner.
    action: REMOVE
    reason: The GO term asserts binding to a GAP, whereas RME-6 is a RAB-5 GEF; GO has no guanyl-nucleotide-exchange-factor-binding
      term to move the annotation to, and the interaction is an alpha-appendage accessory-protein contact
      already described in the notes. The row is therefore removed as mislabelled rather than as false.
    supported_by:
    - reference_id: PMID:15895077
      supporting_text: Consistent with the known catalytic function of Vps9 domains in Rab5 GDP/GTP exchange,
        we found that RME-6 binds specifically to Caenorhabditis elegans RAB-5 in the GDP-bound conformation,
        and rme-6 mutants have phenotypes that indicate low RAB-5 activity.
    - reference_id: PMID:15895077
      supporting_text: We found that α-adaptin did indeed coimmunoprecipitate with GFP::RME-6, showing
        a physical link of RME-6 to clathrin-coated pits.
