- id: PMID:23482940
  title: AP2 hemicomplexes contribute independently to synaptic vesicle endocytosis.
  findings:
  - statement: apa-2 null mutants are viable; alpha and mu2 halves of AP-2 function as partially independent
      hemicomplexes.
    supporting_text: α-adaptin mutants are viable and the remaining μ2/β hemicomplex retains some function.
  - statement: Loss of alpha reduces synaptic vesicles ~30%; loss of both alpha and mu2 reduces them 70%.
    supporting_text: Mutations in either α or μ2 subunits alone reduce the number of synaptic vesicles
      by about 30%; however, simultaneous loss of both α and μ2 subunits leads to a 70% reduction in synaptic
      vesicles and the presence of large vacuoles.
  - statement: Dileucine cargo depends more on alpha, MIG-14 more on mu2.
    supporting_text: These data suggest that recovery of di-leucine cargo depends on α-adaptin more than
      μ2-adaptin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary characterisation of apa-2 mutants.
