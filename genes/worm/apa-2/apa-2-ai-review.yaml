      into oocytes, resulting in high accumulation of YP170::GFP in the pseudocoelomic space and many
      fewer YP170::GFP-containing yolk granules in late-stage oocytes and embryos.
  - statement: Embryos from alpha-adaptin RNAi mothers are inviable.
