- id: file:worm/apa-2/apa-2-deep-research-falcon.md
  title: Deep research report (falcon/Edison) on C. elegans apa-2
  findings:
  - statement: Deep research corroborates the alpha/sigma2 hemicomplex model, quantifies the dileucine-cargo
      defect, and adds GLR-1 trafficking and NCAP-1/NECAP regulation not in GOA.
    supporting_text: An intestinal eGFP–CD4 reporter carrying an ExxxLL signal accumulated at the basolateral
      membrane in *apa-2(ox422)* animals, with fluorescence of 14,907 ± 990 versus 1,998 ± 275 in wild
      type (*p*<0.0001).
core_functions:
- description: As the alpha subunit of the AP-2 adaptor complex, APA-2 docks the adaptor on PI(4,5)P2-containing
    plasma membrane, contributes with sigma2 to dileucine-signal recognition, and through its appendage
    recruits accessory proteins (RME-6, RME-4, DAB-1, CED-6) that couple selected cargo (yolk receptor/DAB-1,
    the CED-1 phagocytic receptor) to clathrin during clathrin-dependent endocytosis.
