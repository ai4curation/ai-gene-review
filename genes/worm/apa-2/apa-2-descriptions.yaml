taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Adaptins are components of the adaptor complexes which link clathrin to receptors
    in coated vesicles. Clathrin-associated protein complexes are believed to interact
    with the cytoplasmic tails of membrane proteins, leading to their selection and
    concentration.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22601
  source_id: Q22601
- source: Alliance_Imported
  text: 'apa-2 encodes an adaptin: specifically, it encodes an ortholog of the alpha
    subunit of adaptor protein complex 2 (AP2); loss of apa-2 activity via RNAi results
    in defects in receptor-mediated yolk endocytosis and thus, embryonic lethality.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000161;class=Gene
  source_id: WB:WBGene00000161
- source: Alliance_Automated
  text: Enables GTPase activating protein binding activity. Involved in embryo development;
    endocytosis; and intracellular protein localization. Located in clathrin-coated
    endocytic vesicle and presynaptic periactive zone. Is expressed in several structures,
    including anterior gonad arm; germ line; intestine; nervous system; and vulva.
    Orthologous to human AP2A1 (adaptor related protein complex 2 subunit alpha 1)
    and AP2A2 (adaptor related protein complex 2 subunit alpha 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000161;class=Gene
  source_id: WB:WBGene00000161
