- source: Alliance_Automated
  text: Predicted to be a structural constituent of ribosome. Predicted to be involved
    in cytoplasmic translation. Predicted to be located in rough endoplasmic reticulum.
    Predicted to be part of cytosolic small ribosomal subunit. Predicted to be active
    in ribosome. Is expressed in several structures, including anal depressor muscle;
    excretory cell; intestine; nervous system; and pharynx. Human ortholog(s) of this
    gene implicated in brachycephaly, trichomegaly, and developmental delay. Orthologous
    to human RPS23 (ribosomal protein S23).
