- source: Alliance_Imported
  text: rps-23 encodes a small ribosomal subunit S23 protein; by homology, RPS-23
    is predicted to function in protein biosynthesis; in C. elegans, RPS-23 activity
    is required for germline development, vulval morphogenesis, and the overall health
    of the animal.
