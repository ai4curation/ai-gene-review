suggested_questions:
- question: Does uS12 in C. elegans contribute to decoding accuracy as bacterial S12 and yeast uS12 do, and would
    point mutations at the decoding centre alter translational fidelity in vivo?
- question: Is Pro62 of C. elegans RPS-23 hydroxylated, and by which OGFOD1/Tpa1-family prolyl hydroxylase?
- question: Why are rps-23(0) arrests rescued by inx-14 or sinh-1 knockdown when large-subunit null arrests are not;
    does this reflect a property of 40S loss in general or of uS12 specifically?
suggested_experiments:
- description: Introduce decoding-centre missense alleles of rps-23 by CRISPR and measure stop-codon readthrough and
    misincorporation with dual-luciferase reporters to test a role in translational fidelity.
- description: Mass spectrometry of RPS-23 from purified C. elegans ribosomes, with and without loss of the candidate
    OGFOD1 ortholog, to test Pro62 hydroxylation.
