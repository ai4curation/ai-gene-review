id: Q19877
gene_symbol: rps-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rps-23 (F28D1.7) encodes the Caenorhabditis elegans small ribosomal subunit protein uS12 (40S ribosomal
  protein S23), a member of the universal uS12 family. uS12 is a core protein of the cytosolic 40S subunit that sits
  on the subunit-interface side close to the decoding centre, and it is resolved in the cryo-EM structure of the
  C. elegans 80S ribosome. As a structural constituent of the ribosome it contributes to cytoplasmic mRNA translation
  in the cytosol, including on ribosomes bound to the rough endoplasmic reticulum. Pro62 is predicted, by similarity,
  to carry a hydroxyproline modification. Homozygous null mutants complete embryogenesis on maternally supplied
  ribosomes but arrest as L1 larvae, heterozygotes show reduced RPS-23 protein with altered mitochondrial morphology,
  and RNAi depletion causes sterility, all consistent with loss of general translation capacity.
