  review:
    summary: uS12 is a structural component of the cytosolic 40S subunit and takes part in cytoplasmic translation;
      transferred from human RPS23.
    action: ACCEPT
    reason: As a core 40S protein at the decoding centre, uS12 does part of the work of translation rather than merely
      being required for it. The worm protein is a one-to-one ortholog of human RPS23 (eukaryote/archaea uS12 signature)
      and is modelled in the C. elegans 80S structure from purified cytosolic ribosomes. Null mutants arrest at L1
      once maternal ribosomes are depleted, consistent with this role.
