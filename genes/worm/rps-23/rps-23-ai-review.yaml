- id: PMID:39209556
  title: High-resolution reconstruction of a C. elegans ribosome sheds light on evolutionary dynamics and tissue
    specificity.
  findings:
  - statement: Cryo-EM structure of the C. elegans 80S ribosome; all ribosomal proteins except stalk proteins, eL28
      and RACK-1 were modelled, so uS12 is part of the modelled 40S subunit.
    supporting_text: We also modeled the ribosomal proteins, with the exceptions of those bound to the P- and L-stalks
      (uL10/P0, P1, P2, uL1, uL11), eL28, and RACK-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Sehgal et al. 2024, RNA. Source of PDB 9CAI listed in Q19877 (chain AX, residues 1-143); uS12 is
      not among the unmodelled proteins.
- id: PMID:30799226
  title: Maternal Ribosomes Are Sufficient for Tissue Diversification during Embryonic Development in C. elegans.
  findings:
  - statement: An rps-23 null allele (uS12) was generated; homozygous nulls complete embryogenesis on maternal ribosomes
      and then arrest as L1 larvae.
    supporting_text: Despite being phenotypically similar to wild-type first-stage (L1) larvae, the homozygous larvae
      arrest at L1 stage without any detectable growth
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Establishes that rps-23 is essential post-embryonically; necessity evidence only,
      supports no process annotation beyond cytoplasmic translation.
- id: PMID:41047111
  title: Ribosomal biogenesis defects trigger subunit specific developmental checkpoints via TOR signaling and gap
    junction in C. elegans.
  findings:
  - statement: rps-23(0) larvae arrest with partial M-cell divisions; inx-14 or sinh-1 knockdown partially rescues
      the arrest. Describes a ribosome-insufficiency checkpoint rather than an activity of RPS-23.
    supporting_text: Small subunit RP mutants rps-23(0) and rps-10(0) exhibited a less extreme phenotype
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Phenotypic, indirect consequences of ribosome loss.
- id: PMID:39786340
  title: Differential impacts of ribosomal protein haploinsufficiency on mitochondrial function.
  findings:
  - statement: rps-23(0)/+ heterozygotes have about half the RPS-23 protein, altered mitochondrial morphology and a
      modest lifespan extension without FuDR.
    supporting_text: The only exception was rps-23(0)/+ mutants that displayed a modest but significant extension
      of lifespan only in the absence of FuDR
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Haploinsufficiency phenotypes reflect reduced ribosome dosage; they do not justify
      lifespan or mitochondrial process annotations for RPS-23.
- id: PMID:16247027
  title: A complex containing the Sm protein CAR-1 and the RNA helicase CGH-1 is required for embryonic cytokinesis
    in Caenorhabditis elegans.
  findings:
  - statement: RNAi of RPS-23 (with five other RPS proteins), used as a translation-inhibition control, caused penetrant
      sterility; partial depletion gave osmotically sensitive embryos without cytokinesis defects.
    supporting_text: Depletions of six different ribosomal subunits (RPS-1, -3, -5, -11, -18, and -23) each resulted
      in penetrant sterility (unpublished data).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Paper is about CAR-1/CGH-1; RPS-23 data are an unpublished-data control showing
      necessity phenotypes consistent with general translation loss. Does not justify any process annotation.
- id: file:worm/rps-23/rps-23-uniprot.txt
  title: UniProt record Q19877 (RS23_CAEEL)
- id: file:worm/rps-23/rps-23-deep-research-manual.md
  title: Manual literature review of rps-23
- id: file:worm/rps-23/rps-23-deep-research-wormbase.md
  title: WormBase gene description for rps-23 (worm)
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: WormBase curated description. The uS12/S23 identity and the predicted
      role in protein biosynthesis are correct and agree with the ribosome structure
      in PMID:39209556. The requirement for germline development and overall health
      is consistent with the L1 arrest of null mutants and the sterility after RNAi
      (PMID:30799226, PMID:16247027). The vulval morphogenesis requirement has no
      cited source and probably comes from a large-scale RNAi phenotype. It was checked,
      but no primary report was found among the cached papers. It is a peripheral
      consequence of reduced translation in a dividing tissue, so it is not added
      to the review.
