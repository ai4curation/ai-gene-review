descriptions:
- source: UniProt
  text: Transcription factor (By similarity). Involved in positively modulating longevity
    and stress tolerance, probably acting by positively regulating expression of transsulfuration
    enzyme cth-2, leading to increased hydrogen sulfide production and therefore increased
    protein persulfidation, a protective modification of redox- reactive cysteines
    (PubMed:35181679). May mediate longevity and increased stress resistance induced
    by mTORC1 suppression (PubMed:35181679).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22156
  source_id: Q22156
