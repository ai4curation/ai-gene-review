descriptions:
- source: UniProt
  text: Transcription factor (By similarity). Involved in positively modulating longevity
    and stress tolerance, probably acting by positively regulating expression of transsulfuration
    enzyme cth-2, leading to increased hydrogen sulfide production and therefore increased
    protein persulfidation, a protective modification of redox- reactive cysteines
    (PubMed:35181679). May mediate longevity and increased stress resistance induced
    by mTORC1 suppression (PubMed:35181679).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22156
  source_id: Q22156
- source: Alliance_Imported
  text: atf-5 encodes a homolog of the mammalian bZIP transcription factors ATF4and
    ATF5, analogous to GCN4 in S. cerevisiae; like like ATF4 and GCN4,atf-5 has an
    extensive 5' UTR with one 37-residue uORF; ATF4 is poorlytranslated in unstressed
    cells but well-translated during ER stress, aminoacid starvation, or arsenite
    treatment; possibly atf-5 is alsotranslationally regulated in a way similar to
    ATF4.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000221;class=Gene
  source_id: WB:WBGene00000221
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription activator activity, RNA polymerase
    II-specific and RNA polymerase II transcription regulatory region sequence-specific
    DNA binding activity. Involved in hydrogen sulfide biosynthetic process and positive
    regulation of gene expression. Located in nucleus. Human ortholog(s) of this gene
    implicated in prostate carcinoma. Orthologous to several human genes including
    ATF5 (activating transcription factor 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000221;class=Gene
  source_id: WB:WBGene00000221
