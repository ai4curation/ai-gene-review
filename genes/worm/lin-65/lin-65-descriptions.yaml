descriptions:
- source: Alliance_Imported
  text: lin-65 is a encodes, by alternative splicing, two isoforms of a large (~600-residue),
    acid-rich, but unfamiliar protein that acts with the B class of synMuv genes (such
    as lin-35/Rb) to repress vulval induction, and that is required for fertility;
    LIN-65 isoforms share a ~400-residue N-terminal domain of low-complexity sequence
    which is probably nonglobular; in the longer LIN-65 isoform, there follows a ~100-residue
    proline-rich domain, but both isoforms lack regions of obvious similarity to non-nematode
    proteins; lin-65 genetically interacts with ark-1, lin-15, and gap-1.
  source_type: curated
