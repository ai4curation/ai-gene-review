gene_symbol: epg-9
organism: worm
uniprot_id: Q95XH2
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: epg-9 encodes the C. elegans homolog of mammalian ATG101 (AuTophaGy101); in
    C. elegans, epg-9 is required for autophagic degradation of protein aggregates
    and for normal survival rates under conditions of food deprivation; EPG-9 physically
    interacts with ATG-13, the C. elegans homolog of ATG13, and UNC-51, the C. elegans
    homolog of ATG1; an EPG-9::GFP reporter fusion is ubiquitously expressed during
    embryogenesis and widely expressed in postembryonic stages, including in pharyngeal
    muscles, neurons and intestinal cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022078;class=Gene
  source_id: WB:WBGene00022078
- source: Alliance_Automated
  text: Enables protein kinase binding activity. Involved in aggrephagy. Predicted
    to be part of Atg1/ULK1 kinase complex. Predicted to be active in phagophore assembly
    site. Is expressed in several structures, including body wall musculature; hypodermis;
    intestine; pharyngeal muscle cell; and tail. Orthologous to human ATG101 (autophagy
    related 101).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00022078;class=Gene
  source_id: WB:WBGene00022078
