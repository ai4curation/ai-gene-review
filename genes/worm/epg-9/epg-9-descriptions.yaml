- source: Alliance_Automated
  text: Enables protein kinase binding activity. Involved in aggrephagy. Predicted
    to be part of Atg1/ULK1 kinase complex. Predicted to be active in phagophore assembly
    site. Is expressed in several structures, including body wall musculature; hypodermis;
    intestine; pharyngeal muscle cell; and tail. Orthologous to human ATG101 (autophagy
    related 101).
