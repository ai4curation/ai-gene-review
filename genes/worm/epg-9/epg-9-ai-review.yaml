suggested_questions:
- question: Does EPG-9, like human ATG101, stabilize EPG-1/ATG-13 through a HORMA-HORMA heterodimer and
    recruit downstream factors such as ATG-9 or EPG-8/ATG14 via a WF finger?
- question: Are the three Y69A2AR.7 isoforms (Q95XH2, H2L0S0, Q86DD3) functionally equivalent?
suggested_experiments:
- description: Structure-guided mutation of the predicted EPG-1-binding surface and WF-finger-equivalent
    residues of EPG-9, testing complex formation and rescue of aggrephagy defects.
