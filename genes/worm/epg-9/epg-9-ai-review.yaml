  label: Caenorhabditis elegans
description: EPG-9 is the C. elegans ortholog of ATG101, a HORMA-domain-family protein (ATG101 family)
  that is a subunit of the UNC-51/Atg1 autophagy initiation complex. EPG-9 binds EPG-1/ATG-13 directly
  and forms a complex with it and with the UNC-51 kinase. Loss of epg-9 blocks autophagic degradation
  of several protein aggregates in embryos (aggrephagy), reduces survival during food deprivation, and
  causes autophagy phenotypes like those of unc-51 and epg-1 mutants. The gene (Y69A2AR.7) makes several
  isoforms. Its expression is controlled by nutrient-responsive transcription factors such as MML-1/MXL-2
  and HSF-1.
