gene_symbol: dve-1
organism: worm
uniprot_id: Q86MI0
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Transcription factor (PubMed:35021096). Acts during mitochondrial stress by
    activating the mitochondrial unfolded protein response (mtUPR) (PubMed:17925224,
    PubMed:30642431). Required during mitochondrial stress for the activation of genes
    involved in the mtUPR, in concert with histone deacetylase hda-1 (PubMed:32934238).
    In response to the citrate-induced mtUPR, positively regulates transcription of
    transcription factor nhr-80, thereby leading to modulation of lipid metabolism
    (PubMed:35021096). May play a role in modulating the decline in protein homeostasis
    associated with normal aging (PubMed:32934238). Required for embryonic development
    and maintenance of mitochondrial morphology (PubMed:17925224).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86MI0
  source_id: Q86MI0
- source: Alliance_Imported
  text: dve-1 encodes, by alternative splicing, three proteins with a COMPASS (CMP)
    domain and two homeodomains; dve-1 interacts with two or more components of the
    EGF/RAS signallingpathway, and is required for such signalling in vulval development;
    the CMP domain is found in the N-terminus of SATB-class CUT homeodomain proteins
    (e.g. human SATB1), and in Drosophila DEFECTIVE PROVENTRICULUS (DVE), to which
    DVE-1 may be orthologous; both DVE and dve-1 encode two homeodomains which are
    highly divergent, but homologous between species, and probably derived by intragenic
    duplication; dve-1 is required for a normally high rate of growth, fluid excretion,
    and larval viability in in mass RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022861;class=Gene
  source_id: WB:WBGene00022861
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific;
    enzyme binding activity; and protein-folding chaperone binding activity. Involved
    in embryo development; mitochondrial unfolded protein response; and regulation
    of innate immune response. Located in chromatin; cytosol; and nucleus. Part of
    transcription regulator complex. Is expressed in several structures, including
    arcade cell; intestine; midbody; nervous system; and rectum. Human ortholog(s)
    of this gene implicated in SATB2-associated syndrome; intellectual disability;
    and tooth disease. Orthologous to human SATB1 (SATB homeobox 1) and SATB2 (SATB
    homeobox 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00022861;class=Gene
  source_id: WB:WBGene00022861
