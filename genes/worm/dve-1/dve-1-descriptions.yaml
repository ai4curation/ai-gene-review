    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 1
    - rubric: specificity
      score: 3
    overall_notes: Mostly domain architecture and phylogeny; the only function stated
      is an EGF/RAS vulval signalling role that the review does not mention. No mtUPR,
      the gene's established role.
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific;
    enzyme binding activity; and protein-folding chaperone binding activity. Involved
    in embryo development; mitochondrial unfolded protein response; and regulation
    of innate immune response. Located in chromatin; cytosol; and nucleus. Part of
    transcription regulator complex. Is expressed in several structures, including
    arcade cell; intestine; midbody; nervous system; and rectum. Human ortholog(s)
    of this gene implicated in SATB2-associated syndrome; intellectual disability;
    and tooth disease. Orthologous to human SATB1 (SATB homeobox 1) and SATB2 (SATB
    homeobox 2).
