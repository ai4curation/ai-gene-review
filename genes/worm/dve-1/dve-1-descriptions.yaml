    overall_notes: 'Cited: transcription factor in the mtUPR, with HDA-1, NHR-80 regulation
      in citrate-induced UPRmt, embryonic development. Omits UBL-5, SUMO regulation
      and immunity.'
- source: Alliance_Imported
  text: dve-1 encodes, by alternative splicing, three proteins with a COMPASS (CMP)
    domain and two homeodomains; dve-1 interacts with two or more components of the
    EGF/RAS signallingpathway, and is required for such signalling in vulval development;
    the CMP domain is found in the N-terminus of SATB-class CUT homeodomain proteins
    (e.g. human SATB1), and in Drosophila DEFECTIVE PROVENTRICULUS (DVE), to which
    DVE-1 may be orthologous; both DVE and dve-1 encode two homeodomains which are
    highly divergent, but homologous between species, and probably derived by intragenic
    duplication; dve-1 is required for a normally high rate of growth, fluid excretion,
    and larval viability in in mass RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022861;class=Gene
  source_id: WB:WBGene00022861
