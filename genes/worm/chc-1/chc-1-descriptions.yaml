descriptions:
- source: UniProt
  text: Clathrin is the major protein of the polyhedral coat of coated pits and vesicles
    (By similarity). May play a role in yolk protein clatherin-mediated endocytosis
    by oocytes during oogenesis (PubMed:19798448).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34574
  source_id: P34574
- source: Alliance_Imported
  text: chc-1 encodes the C. elegans clathrin heavy chain ortholog; loss of chc-1
    activity via RNAi results in defects in receptor-mediated yolk endocytosis and
    thus, embryonic lethality.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011867;class=Gene
  source_id: WB:WBGene00011867
- source: Alliance_Automated
  text: Predicted to enable clathrin light chain binding activity. Involved in several
    processes, including apical protein localization; determination of adult lifespan;
    and positive regulation of clathrin-dependent endocytosis. Located in several
    cellular components, including clathrin-coated endocytic vesicle; cytoplasmic
    side of plasma membrane; and mitotic spindle. Is expressed in coelomocyte; germ
    line; hypodermal cell; intestine; and pharyngeal cell. Human ortholog(s) of this
    gene implicated in autosomal dominant intellectual developmental disorder 56.
    Orthologous to human CLTC (clathrin heavy chain) and CLTCL1 (clathrin heavy chain
    like 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011867;class=Gene
  source_id: WB:WBGene00011867
