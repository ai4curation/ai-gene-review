id: P34574
gene_symbol: chc-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: chc-1 (rme-3) encodes the single clathrin heavy chain of Caenorhabditis elegans. Three heavy
  chains trimerise through their C-terminal hub domains, each binding a clathrin light chain, to form
  the triskelion that polymerises into the polyhedral lattice of clathrin-coated pits and vesicles; the
  N-terminal beta-propeller engages adaptor complexes (AP-2 at the plasma membrane, AP-1 at the trans-Golgi
  network) and accessory proteins. CHC-1 localises to punctate coated pits on the cytoplasmic face of
  the plasma membrane of oocytes, coelomocytes, intestine and presynaptic varicosities, and to phagocytic
  cups around apoptotic corpses. It is required for receptor-mediated uptake of yolk by oocytes, for CED-1/CED-6-dependent
  engulfment and maturation of apoptotic-cell phagosomes, and for AP-1/clathrin-dependent apical sorting
  of E-cadherin in the epidermis; complete loss is embryonic lethal. A temperature-sensitive hub mutant
  paralyses within minutes at restrictive temperature but retains a normal synaptic vesicle pool, showing
  that high clathrin activity is dispensable for synaptic vesicle regeneration. In the one-cell embryo
  CHC-1 additionally promotes cortical acto-myosin tension that restrains pulling forces on centrosomes.
