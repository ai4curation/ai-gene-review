- source: Alliance_Imported
  text: nhr-49 encodes a nuclear hormone receptor (NHR) related to the mammalian HNF4
    (hepatocyte nuclear factor 4) family of NHRs; nhr-49 functions as a key regulator
    of fat metabolism and lifespan by regulating induction of beta-oxidation genes
    upon food deprivation and activation of stearoyl-CoA desaturase in fed animals,
    respectively; NHR-49 activates transcription in conjunction with the MDT-15 mediator
    subunit with which it physically interacts.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003639;class=Gene
  source_id: WB:WBGene00003639
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity. Involved in determination
    of adult lifespan; positive regulation of transcription by RNA polymerase II;
    and regulation of fatty acid metabolic process. Located in cytoplasm and nucleus.
    Is expressed in hypodermis; intestinal cell; intestine; muscle cell; and neurons.
    Used to study alcohol use disorder and obesity. Human ortholog(s) of this gene
    implicated in Fanconi renotubular syndrome 4; disease of metabolism (multiple);
    and familial hyperlipidemia (multiple). Orthologous to human HNF4A (hepatocyte
    nuclear factor 4 alpha) and HNF4G (hepatocyte nuclear factor 4 gamma).
