descriptions:
- source: UniProt
  text: Orphan nuclear receptor (PubMed:25981666). Regulates expression of genes involved
    in fat metabolism and in maintaining homeostasis of fatty acid saturation, such
    as lipid desaturase fat-7, and acyl-CoA synthetase acs-2 (PubMed:15719061, PubMed:22511885,
    PubMed:25981666). May form part of a negative feedback loop with fat-7 to limit
    mitochondrial beta-oxidation, in which it stimulates expression of fat-7 and acs-2,
    and in turn fat-7 indirectly inhibits acs-2 and other genes also involved in beta-oxidation
    (PubMed:15719061). Acts in multiple somatic tissues, probably cell non- autonomously,
    to regulate response to a low oxygen environment (hypoxia) (PubMed:35285794).
    During hypoxia, activates expression of acs-2, various autophagy-related genes,
    and the formation of autophagosomes, independent of hypoxia-inducible factor hif-1
    (PubMed:35285794). Furthermore, activates detoxification gene flavin mono-oxygenase
    fmo-2, acting in parallel with hif-1, during hypoxia (PubMed:35285794). As part
    of a lysosome-to-nucleus retrograde lipid signaling pathway, acting in concert
    with nuclear hormone receptor nhr- 80, activates the transcription of genes promoting
    longevity and mitochondrial beta-oxidation (PubMed:25554789, PubMed:26671266).
    In concert with nuclear hormone receptor nhr-66, involved in regulating target
    genes with roles in sphingolipid breakdown and lipid remodeling (PubMed:22511885).
    Also involved in regulating fatty acid desaturase genes, acting in concert with
    nuclear hormone receptors nhr-13 and nhr- 80 (PubMed:22511885). Plays a role in
    modulating mitochondrial morphology and function (PubMed:22511885). Plays a role
    in transgenerational lipid accumulation in response to a high-fat diet (PubMed:35140229).
