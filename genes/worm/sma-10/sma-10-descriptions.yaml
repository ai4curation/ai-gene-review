- source: Alliance_Imported
  text: sma-10 encodes a protein containing leucine rich-repeats and immunoglobulin-like
    domains that is a member of the LRIG family of transmembrane proteins; sma-10
    functions to regulate the TGFbeta signaling pathway that controls body size; consistent
    with genetic epistasis analysis suggesting that SMA-10 acts between the DBL-1/TGFbeta
    ligand and the SMA-6/TGFbeta receptor in the SMA-6/DAF-4 signaling pathway, SMA-10
    physically interacts with both the SMA-6 and DAF-4 TGFbeta receptors in vitro;
    a SMA-10::GFP translational fusion protein is expressed in the hypodermis and
    in pharyngeal muscle and is required in the hypodermis for regulating body size.
  source_type: curated
