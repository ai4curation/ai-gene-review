gene_symbol: sma-10
organism: worm
uniprot_id: Q965M2
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds to the TGF-beta receptors sma-6 and daf-4, and enhances TGF-beta signaling
    activity in vitro. Has a role in regulation of body size.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q965M2
  source_id: Q965M2
- source: Alliance_Imported
  text: sma-10 encodes a protein containing leucine rich-repeats and immunoglobulin-like
    domains that is a member of the LRIG family of transmembrane proteins; sma-10
    functions to regulate the TGFbeta signaling pathway that controls body size; consistent
    with genetic epistasis analysis suggesting that SMA-10 acts between the DBL-1/TGFbeta
    ligand and the SMA-6/TGFbeta receptor in the SMA-6/DAF-4 signaling pathway, SMA-10
    physically interacts with both the SMA-6 and DAF-4 TGFbeta receptors in vitro;
    a SMA-10::GFP translational fusion protein is expressed in the hypodermis and
    in pharyngeal muscle and is required in the hypodermis for regulating body size.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00020649;class=Gene
  source_id: WB:WBGene00020649
- source: Alliance_Automated
  text: Enables type I transforming growth factor beta receptor binding activity and
    type II transforming growth factor beta receptor binding activity. Involved in
    several processes, including positive regulation of transforming growth factor
    beta receptor signaling pathway; regulation of mesodermal cell fate specification;
    and transforming growth factor beta receptor signaling pathway. Located in plasma
    membrane. Is expressed in hypodermis; intestine; pharynx; and rectal gland cell.
    Human ortholog(s) of this gene implicated in urofacial syndrome. Orthologous to
    several human genes including LRIG2 (leucine rich repeats and immunoglobulin like
    domains 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020649;class=Gene
  source_id: WB:WBGene00020649
