  - UniProtKB:Q99467
  review:
    summary: IBA from the LRIG/LRFN clade asserting signaling receptor activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: SMA-10 has no evidence of acting as a ligand-binding receptor that itself 
      transduces a signal. Its documented activity is binding the BMP receptors SMA-6 
      and DAF-4 and promoting their signaling and trafficking, i.e. a receptor-regulator
      role [PMID:20502686, PMID:28704415]. The activity better captured by the IPI 
      receptor-binding annotations; signaling receptor activity overstates what is known
      for this member.
    supported_by:
    - reference_id: PMID:20502686
      supporting_text: showing that SMA-10 physically binds the DBL-1 receptors SMA-6 
        and DAF-4 and enhances signaling in vitro
    - reference_id: file:worm/sma-10/sma-10-deep-research-falcon.md
      supporting_text: It is not characterized as an enzyme or transporter and therefore
        has no established catalytic reaction or transported substrate.
