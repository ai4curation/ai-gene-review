  label: Caenorhabditis elegans
description: 'SMA-10 is the C. elegans member of the LRIG family of transmembrane proteins,
  with fifteen leucine-rich repeats and three immunoglobulin-like domains. It acts in the
  hypodermis as a positive regulator of the DBL-1/BMP-like Sma/Mab pathway that controls body
  size and male tail development. SMA-10 binds the type I receptor SMA-6 and the type II receptor
  DAF-4 and enhances receptor signaling. It is required for normal endocytic trafficking of
  SMA-6: without SMA-10, SMA-6 accumulates in early endosomes, multivesicular bodies and late
  endosomes, its ubiquitination is reduced, and signaling is weaker. SMA-10 is found at the
  plasma membrane and in endosomes. The Drosophila ortholog lambik can rescue sma-10 mutants,
  and vertebrate LRIG1 binds BMP receptors, so this role is conserved.'
