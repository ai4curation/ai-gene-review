core_functions:
- description: SMA-10 binds the BMP type I (SMA-6) and type II (DAF-4) receptors and 
    promotes their signaling and endocytic trafficking at the hypodermal plasma membrane
    and endosomes, acting as a positive regulator of DBL-1/BMP body-size signaling.
