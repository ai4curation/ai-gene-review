  - reference_id: PMID:28704415
    supporting_text: Here we show that the loss of sma-10 leads to aberrant endocytic 
      trafficking of SMA-6, resulting in its accumulation in distinct intracellular 
      endosomes including the early endosome, multivesicular bodies (MVB), and the late 
      endosome with a reduction in signaling strength
- description: SMA-10 also binds the type II receptor DAF-4, consistent with a role 
