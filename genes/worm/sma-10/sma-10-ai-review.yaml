suggested_questions:
- question: Does SMA-10 bind DBL-1 ligand directly, or does it act only through receptor
    binding and trafficking?
- question: How does SMA-10 promote SMA-6 ubiquitination, and which E3 ligase is 
    involved?
suggested_experiments:
- description: Test whether purified SMA-10 ectodomain changes DBL-1 binding to 
    SMA-6/DAF-4 ectodomains in vitro.
  hypothesis: SMA-10 promotes signaling by stabilizing ligand-receptor complexes in 
    addition to directing receptor trafficking.
