- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate binding activity. Involved in several
    processes, including determination of adult lifespan; germ cell proliferation;
    and xenophagy. Acts upstream of or within with a positive effect on plasma membrane
    repair. Located in phagocytic vesicle. Is expressed in several structures, including
    hypodermis; intestine; nervous system; pharynx; and tail. Used to study Huntington's
    disease. Human ortholog(s) of this gene implicated in musculoskeletal system disease.
    Orthologous to human WIPI1 (WD repeat domain, phosphoinositide interacting 1)
    and WIPI2 (WD repeat domain, phosphoinositide interacting 2).
