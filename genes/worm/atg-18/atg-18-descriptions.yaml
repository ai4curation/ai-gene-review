- source: Alliance_Imported
  text: atg-18 encodes, by alternative splicing, two isoforms of a WD40 repeat-containing
    protein orthologous to the autophagic budding yeast protein Atg18p, and to human
    WIPI1 (OMIM:609224) and WIPI2 (OMIM:609225); ATG-18 activity is essential for
    normal dauer morphogenesis and autophagy in daf-2 mutant animals; ATG-18 is expressed
    in larval and adult pharynx, bodywall muscle, hypodermis, seam cells, and neurons,
    and in larval intestine; in mass RNAi assays, ATG-18 is required for normally
    rapid growth, and is weakly required for the viability of cup-5(ar465) mutants.
