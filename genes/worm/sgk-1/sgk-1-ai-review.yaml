core_functions:
- description: SGK-1 is an AGC serine/threonine kinase that, activated by PDK-1 and acting
    in a complex with AKT-1 and AKT-2, phosphorylates DAF-16/FOXO and SKN-1 to transduce DAF-2
    insulin/IGF-1-like signals, controlling development, stress resistance and lifespan.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0008286
    label: insulin receptor signaling pathway
  in_complex:
    id: GO:1902911
    label: protein kinase complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15068796
    supporting_text: All three kinases of this complex are able to directly phosphorylate
      DAF-16/FKHRL1
  - reference_id: PMID:18358814
    supporting_text: The IIS kinases AKT-1, -2, and SGK-1 phosphorylate SKN-1
- description: Downstream of TORC2 (RICT-1), SGK-1 kinase activity antagonizes SKN-1 in the
    embryo and keeps PQM-1 cytoplasmic in the intestine, promoting vitellogenesis and fat
    transport to the germline independently of DAF-16.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0035556
    label: intracellular signal transduction
  supported_by:
  - reference_id: PMID:27401555
    supporting_text: Surprisingly, SGK-1 functions independently of DAF-16/FoxO; instead,
      SGK-1 promotes the cytoplasmic localization of the PQM-1 transcription factor
  - reference_id: PMID:23973804
    supporting_text: The SGK-1 kinase mediated these functions downstream of rict-1/TORC2
suggested_questions:
- question: Does SGK-1 phosphorylate PQM-1 directly, or act through an intermediate, to control
    its nuclear exclusion downstream of TORC2?
- question: Given that mammalian SGK1 lacks a PH domain, which region of C. elegans SGK-1
    mediates the PIP3 binding observed in vitro?
- question: Should SGK-1 carry GO:0038203 TORC2 signaling? Human SGK1, the canonical TORC2
    substrate, does not carry it in GOA, so it was not proposed here; GO guidance on whether
    TORC2 substrates belong in that term would settle it.
suggested_experiments:
- description: In vitro kinase assays of SGK-1 on PQM-1 and in vivo analysis of PQM-1 phospho-site
    mutants to test whether PQM-1 is a direct SGK-1 substrate.
