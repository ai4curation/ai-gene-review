gene_symbol: sgk-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SGK-1 is the C. elegans ortholog of serum- and glucocorticoid-inducible kinase,
  an AGC-family serine/threonine protein kinase. It is activated by PDK-1 and by the TORC2
  complex (RICT-1), and forms a complex with AKT-1 and AKT-2. SGK-1 directly phosphorylates
  the transcription factors DAF-16/FOXO and SKN-1/Nrf, promoting their cytoplasmic retention;
  downstream of TORC2 it also promotes cytoplasmic localization of PQM-1, independently of
  DAF-16, to support intestinal vitellogenin production and fat transport to the germline.
  sgk-1 loss of function causes slow development, egg-laying defects, small body size, altered
  stress resistance and lifespan, and defects in sorting the Wnt-sorting receptor MIG-14/Wntless
  to the basolateral intestinal membrane. SGK-1 binds PIP3 in vitro and, together with AKT-1
  and AKT-2, promotes embryonic cell survival. It is expressed strongly in intestine and head
  and tail neurons, localizing to the cytoplasm and apical cell cortex in intestine and to
  both cytoplasm and nucleus in neurons.
