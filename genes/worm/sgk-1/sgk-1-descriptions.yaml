descriptions:
- source: UniProt
  text: Acts downstream of PI3 kinase age-1 and kinase pdk-1 in the daf-2/insulin
    receptor-like transduction pathway (PubMed:15068796). Essential role in regulating
    development, stress response, and longevity (PubMed:15068796, PubMed:18782349).
    Phosphorylates Forkhead- related daf-16 and the longevity-promoting skn-1 transcription
    factors, which inhibits their entry into the nucleus and antagonizes their function
    (PubMed:18358814). Promotes the cytoplasmic localization of the transcription
    factor pqm-1 (PubMed:27401555). Plays a role in the intracellular trafficking
    of proteins such as mig-14 to the cell membrane, and this may be through positively
    regulating ceramide synthesis (PubMed:26115433). Acts downstream of rict-1 to
    regulate fat storage, size, development and vitellogenesis (PubMed:19240135, PubMed:19260765,
    PubMed:27401555). Downstream of age-1 and together with akt-1/2, promotes cell
    survival during embryonic development (PubMed:25383666). Plays a role in maintaining
    the gonadal basement membrane through antagonizing akt-1 activity (PubMed:22916022).
    Does not appear to play a role in immune function (PubMed:18782349).
