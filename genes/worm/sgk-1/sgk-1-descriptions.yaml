- source: Alliance_Automated
  text: Enables phosphatidylinositol-3,4,5-trisphosphate binding activity; protein
    serine kinase activity; and protein serine/threonine kinase activity. Involved
    in several processes, including insulin receptor signaling pathway; positive regulation
    of vitellogenesis; and regulation of protein localization to basolateral plasma
    membrane. Located in apical plasma membrane; cytoplasm; and nucleus. Part of protein
    kinase complex. Is expressed in intestine; neurons; and tail neurons. Human ortholog(s)
    of this gene implicated in hypertension. Orthologous to several human genes including
    C8orf44-SGK3 (C8orf44-SGK3 readthrough); SGK2 (serum/glucocorticoid regulated
    kinase 2); and SGK3 (serum/glucocorticoid regulated kinase family member 3).
