    - rubric: specificity
      score: 3
    overall_notes: Correct BiP homology, viability phenotypes, tissues and UPR/heat/Cry5B
      induction. Says nothing about chaperone activity or the hsp-4 reporter use.
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity. Involved in endoplasmic reticulum unfolded protein response. Located
    in rough endoplasmic reticulum. Is expressed in several structures, including
    PVD; hermaphrodite gonad; hypodermis; intestinal muscle; and intestine. Human
    ortholog(s) of this gene implicated in dopamine beta-hydroxylase deficiency and
    infertility. Orthologous to human HSPA5 (heat shock protein family A (Hsp70) member
    5).
  source_type: automated
