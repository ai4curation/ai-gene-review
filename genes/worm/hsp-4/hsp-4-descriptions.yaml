gene_symbol: hsp-4
organism: worm
uniprot_id: P20163
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Endoplasmic reticulum chaperone that plays a key role in protein folding and
    quality control in the endoplasmic reticulum lumen (By similarity). Required for
    ER dynamics during the first embryonic cell divisions (PubMed:15716356). Specifically,
    controls ER transition into sheet-like structures at the onset of mitosis, possibly
    by regulating homotypic membrane fusion (PubMed:15716356).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P20163
  source_id: P20163
- source: Alliance_Imported
  text: hsp-4 encodes one of two C. elegans heat shock response 70 (hsp70) proteins
    homologous to mammalian grp78/BiP (glucose regulated protein 78/immunoglobulin
    heavy chain-binding protein, OMIM:138120); hsp-4 affects embryonic and larval
    viability; hsp-4 is expressed in several tissues including the hypodermis, intestine,
    and spermatheca; hsp-4 transcription is upregulated in response to endoplasmic
    reticulum stress induced by dithiothreitol (DTT) or tunicamycin (unfolded protein
    response) as well as in response to heat shock and treatment of animals with pore-forming
    toxins such as Cry5B.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002008;class=Gene
  source_id: WB:WBGene00002008
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity. Involved in endoplasmic reticulum unfolded protein response. Located
    in rough endoplasmic reticulum. Is expressed in several structures, including
    PVD; hermaphrodite gonad; hypodermis; intestinal muscle; and intestine. Human
    ortholog(s) of this gene implicated in dopamine beta-hydroxylase deficiency and
    infertility. Orthologous to human HSPA5 (heat shock protein family A (Hsp70) member
    5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002008;class=Gene
  source_id: WB:WBGene00002008
