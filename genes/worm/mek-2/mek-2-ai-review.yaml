    label: vulval development
  evidence_type: IGI
  original_reference_id: PMID:11861555
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00002335
  review:
    summary: MEK-2 contributes to LET-60/LIN-45-dependent vulval induction, a
      non-core developmental output of ERK signaling.
    action: KEEP_AS_NON_CORE
    reason: The LIN-45 study supports a linear LET-60/Ras to LIN-45/Raf to
      MEK-2 to MPK-1/ERK module that induces vulval fates. Vulval development is
      a valid in vivo output, but it is organismal and context-specific relative
      to MEK-2's reusable MAP kinase kinase activity.
    supported_by:
    - reference_id: PMID:11861555
      supporting_text: The lin-45(null) phenotype is similar to the mek-2(null)
        and mpk-1(null) phenotypes
