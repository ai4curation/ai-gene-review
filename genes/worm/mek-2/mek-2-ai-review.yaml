- term:
    id: GO:0050830
    label: defense response to Gram-positive bacterium
  evidence_type: IMP
  original_reference_id: PMID:15268855
  qualifier: involved_in
  review:
    summary: MEK-2 signaling contributes to defense against the Gram-positive
      bacterium M. nematophilum.
    action: KEEP_AS_NON_CORE
    reason: The ERK MAPK cassette mediates tail swelling and protection from
      severe constipation during rectal M. nematophilum infection. That is a
      real physiological use of MEK-2 signaling, but it is a pathogen-specific
      downstream deployment rather than the core MAP2K activity.
    supported_by:
    - reference_id: PMID:15268855
      supporting_text: protects C. elegans from severe constipation
