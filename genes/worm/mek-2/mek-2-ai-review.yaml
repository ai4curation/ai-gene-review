  review:
    summary: PAINT correctly places MEK-2 in the conserved MAPK cascade.
    action: ACCEPT
    reason: MEK-2 is the worm MEK/MAP2K in the Ras-Raf-MEK-ERK relay. Direct
      biochemical and genetic evidence showed that MEK-2 has MAP kinase kinase
      activity and acts between LIN-45/Raf and SUR-1/MPK-1, so the PAINT MAPK
      cascade inference is consistent with the C. elegans evidence and the
      conserved animal MAP2K role.
    supported_by:
    - reference_id: PMID:7729690
      supporting_text: mek-2 acts between lin-45 raf and sur-1/mpk-1 in a signal
        transduction pathway
