    id: GO:0097110
    label: scaffold protein binding
  evidence_type: IPI
  original_reference_id: PMID:10409742
  qualifier: enables
  supporting_entities:
  - UniProtKB:G5EFD2
  review:
    summary: MEK-2 binds the Ras-pathway scaffold KSR-1.
    action: KEEP_AS_NON_CORE
    reason: The KSR study showed that nematode KSR proteins can bind MEKs and
      that KSR-MEK binding changes MEK localization, supporting the MEK-2 to
      KSR-1 scaffold-binding row. This interaction is pathway-relevant but
      ancillary to the core MAP kinase kinase activity.
    supported_by:
    - reference_id: PMID:10409742
      supporting_text: Both nematode and mammalian KSRs are capable of binding
        to MEKs
