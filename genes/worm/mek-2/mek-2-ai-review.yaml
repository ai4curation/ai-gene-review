    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000719
  - InterPro:IPR017441
  review:
    summary: MEK-2 has the ATP-binding kinase fold, but ATP binding is an
      uninformative subfunction relative to MAP kinase kinase activity.
    action: KEEP_AS_NON_CORE
    reason: The protein kinase domain includes predicted ATP-binding residues
      and ATP is the phosphate donor for MEK-2 catalysis. This row is
      mechanistically true, but it is a generic nucleotide-binding feature of
      the kinase fold rather than the core MAP2K activity itself.
    supported_by:
