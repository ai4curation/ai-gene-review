  label: Caenorhabditis elegans
description: MEK-2 is the C. elegans dual-specificity MAP kinase kinase in the
  Ras/Raf/ERK signaling module. It acts downstream of LET-60/Ras and LIN-45/Raf
  and upstream of SUR-1/MPK-1/ERK to phosphorylate and activate ERK-family MAP
  kinase during vulval induction and other Ras/MAPK outputs, and it is reused in
  the ERK-dependent response to Microbacterium nematophilum infection.
