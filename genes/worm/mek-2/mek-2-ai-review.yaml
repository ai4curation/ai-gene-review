  review:
    summary: The ERK MAPK cascade row is supported by MEK-2 pathway activity
      during the rectal response to M. nematophilum infection.
    action: ACCEPT
    reason: Nicholas and Hodgkin showed that rectal infection by the
      Gram-positive bacterium M. nematophilum uses an ERK MAPK cascade. This
      in vivo pathogen-response deployment is the same core LIN-45/MEK-2/MPK-1
      cassette, so MAPK cascade is a correct direct pathway annotation.
    supported_by:
    - reference_id: PMID:15268855
      supporting_text: an extracellular signal-regulated kinase (ERK)
        mitogen-activated protein (MAP) kinase cascade mediates tail swelling
