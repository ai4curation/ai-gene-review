- source: Alliance_Imported
  text: mek-2 encodes a MAP kinase kinase; MEK-2 functions as a core component of
    Ras-mediated signal transduction pathways that regulate several biological processes
    including larval development, vulval development, cell migration, meiotic cell
    cycle progression, olfaction, and pathogen defense.
