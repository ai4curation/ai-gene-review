gene_symbol: mek-2
organism: worm
uniprot_id: Q10664
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions in the let-60 Ras signaling pathway; acts downstream of lin-45 raf
    kinase, but before the sur-1/mpk-1 gene product in controlling vulval cell differentiation
    (PubMed:7729690). Required for progression of developing oocytes through the pachytene
    stage (PubMed:19826475). Plays a role in responses to M.nematophilum- mediated
    bacterial infection by promoting tail swelling and preventing constipation (PubMed:15268855).
    Involved in fluid homeostasis (PubMed:11689700). Positively regulates lifespan
    upstream of mpk-1 (PubMed:20624915).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q10664
  source_id: Q10664
- source: Alliance_Imported
  text: mek-2 encodes a MAP kinase kinase; MEK-2 functions as a core component of
    Ras-mediated signal transduction pathways that regulate several biological processes
    including larval development, vulval development, cell migration, meiotic cell
    cycle progression, olfaction, and pathogen defense.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003186;class=Gene
  source_id: WB:WBGene00003186
- source: Alliance_Automated
  text: Enables protein serine/threonine/tyrosine kinase activity and scaffold protein
    binding activity. Involved in defense response to Gram-positive bacterium; intracellular
    signaling cassette; and vulval development. Human ortholog(s) of this gene implicated
    in several diseases, including carcinoma (multiple); cardiofaciocutaneous syndrome
    3; cardiofaciocutaneous syndrome 4; high grade glioma; and melorheostosis. Orthologous
    to human MAP2K1 (mitogen-activated protein kinase kinase 1) and MAP2K2 (mitogen-activated
    protein kinase kinase 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003186;class=Gene
  source_id: WB:WBGene00003186
