- source: Alliance_Automated
  text: Enables protein serine/threonine/tyrosine kinase activity and scaffold protein
    binding activity. Involved in defense response to Gram-positive bacterium; intracellular
    signaling cassette; and vulval development. Human ortholog(s) of this gene implicated
    in several diseases, including carcinoma (multiple); cardiofaciocutaneous syndrome
    3; cardiofaciocutaneous syndrome 4; high grade glioma; and melorheostosis. Orthologous
    to human MAP2K1 (mitogen-activated protein kinase kinase 1) and MAP2K2 (mitogen-activated
    protein kinase kinase 2).
