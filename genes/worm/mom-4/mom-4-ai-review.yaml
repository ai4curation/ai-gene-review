proposed_new_terms: []
suggested_questions:
- question: Should GO:0097076 (TAK1 complex), currently defined via IKK activation and TRAF6 signaling, be generalized
    to a TAK1-TAB activator complex so that the nematode MOM-4/TAP-1 kinase-activator assembly can be annotated?
- question: Does MOM-4 also activate MAP2Ks (MKK-4/JNK or SEK-1/p38 modules) in post-embryonic contexts, as vertebrate
    and fly TAK1 do, or is its output confined to direct LIT-1 activation?
- question: Which molecular event links the MOM-2/Wnt signal from P2 to MOM-4/TAP-1 activation in EMS?
suggested_experiments:
- hypothesis: MOM-4 activity is spatially restricted to the P2-contacting cortex of EMS and is activated by Wnt-dependent
    TAP-1 engagement.
  description: Image endogenously tagged MOM-4 and TAP-1 in live 4-cell embryos, and measure LIT-1 T220 phosphorylation
    and its asymmetry with phospho-specific antibodies in mom-2, tap-1 and src-1 backgrounds.
  experiment_type: live imaging and phospho-immunostaining
- hypothesis: MOM-4 signals to MAP2K-dependent JNK or p38 modules outside the early embryo.
  description: Use auxin-inducible degradation of MOM-4 after the EMS stage, and assay JNK/p38 (KGB-1, PMK-1) activation-loop
    phosphorylation and stress or immune readouts.
  experiment_type: conditional depletion and phospho-MAPK assays
