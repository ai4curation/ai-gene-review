id: Q9XTC6
gene_symbol: mom-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: mom-4 encodes the C. elegans ortholog of TAK1/MAP3K7, a Ser/Thr MAP kinase kinase kinase with an N-terminal
  kinase domain and a divergent, largely disordered C-terminal region. Like vertebrate TAK1, it is activated by
  a TAB1-related partner, TAP-1. MOM-4 acts in the responding EMS blastomere, and in other posterior daughter cells,
  as an effector of the P2-derived Wnt/polarity signal of the Wnt/beta-catenin asymmetry pathway. It directly phosphorylates
  Thr220 in the TXE activation loop of the Nemo-like kinase LIT-1, with no intervening MAP2K, and so promotes activity
  of the WRM-1/LIT-1 kinase complex. That complex phosphorylates the TCF protein POP-1, lowering its nuclear level
  in the posterior daughter. MOM-4 also supports the initial nuclear accumulation of WRM-1/beta-catenin. Loss of
  mom-4 causes partially penetrant loss of endoderm, with E adopting an MS-like mesodermal fate, together with embryonic
  lethality. Mouse MAP3K7 partially substitutes for MOM-4. Nematodes lack NF-kappaB, so the IKK/NF-kappaB branch
  of vertebrate TAK1 signaling has no counterpart here.
