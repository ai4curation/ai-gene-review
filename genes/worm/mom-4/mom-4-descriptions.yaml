gene_symbol: mom-4
organism: worm
uniprot_id: Q9XTC6
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Part of the Wnt signaling pathway essential for the specification of the mesodermal
    cell fate in early embryos. Stimulates the wrm-1/lit-1-dependent phosphorylation
    of pop-1 and plays a role in the initial nuclear accumulation of wrm-1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XTC6
  source_id: Q9XTC6
- source: Alliance_Imported
  text: 'mom-4 encodes a MAP kinase kinase kinase-related protein orthologous to Drosophila
    Tak1 and the vertebrate MAPKKK7 proteins; during embryonic development, mom-4
    activity is required for positive regulation of the Wnt pathway signaling that
    governs anterior/posterior (A/P) polarity: MOM-4 stimulates the WRM-1/LIT-1-dependent
    phosphorylation of POP-1, a TCF/LEF-related transcription factor, leading to its
    downregulation in posterior daughters of A/P cell divisions.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003396;class=Gene
  source_id: WB:WBGene00003396
- source: Alliance_Automated
  text: Enables MAP kinase kinase kinase activity and protein serine kinase activity.
    Involved in several processes, including asymmetric protein localization involved
    in cell fate determination; cell fate specification; and embryonic digestive tract
    morphogenesis. Located in striated muscle dense body. Is expressed in BAGL and
    BAGR.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003396;class=Gene
  source_id: WB:WBGene00003396
- source: RefSeq
