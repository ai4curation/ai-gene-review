taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Regulates body size morphogenesis, but does not affect male tail development.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09566
  source_id: Q09566
- source: Alliance_Imported
  text: The lon-1 gene encodes a protein belonging to the PR-protein superfamily that
    is a target of DBL-1 (TGF-beta) signaling, and that regulates polyploidization
    and body length.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003055;class=Gene
  source_id: WB:WBGene00003055
- source: Alliance_Automated
  text: Predicted to enable molecular adaptor activity. Involved in several processes,
    including negative regulation of BMP signaling pathway; negative regulation of
    DNA endoreduplication; and positive regulation of growth rate. Located in adherens
    junction and plasma membrane. Is expressed in head; hypodermis; intestinal cell;
    intestine; and tail. Orthologous to human GLIPR1L1 (GLIPR1 like 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003055;class=Gene
  source_id: WB:WBGene00003055
