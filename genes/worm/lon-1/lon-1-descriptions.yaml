- source: Alliance_Automated
  text: Predicted to enable molecular adaptor activity. Involved in several processes,
    including negative regulation of BMP signaling pathway; negative regulation of
    DNA endoreduplication; and positive regulation of growth rate. Located in adherens
    junction and plasma membrane. Is expressed in head; hypodermis; intestinal cell;
    intestine; and tail. Orthologous to human GLIPR1L1 (GLIPR1 like 1).
