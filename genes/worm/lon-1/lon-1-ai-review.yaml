- term:
    id: GO:0032934
    label: sterol binding
  evidence_type: IDA
  original_reference_id: PMID:39657262
  review:
    summary: Purified LON-1 binds sterol (cholesterol sulfate) but not fatty acid in 
      vitro, and CAP-domain residues required in vivo are also needed for sterol binding
      [PMID:39657262].
    action: NEW
    reason: The only directly measured biochemical activity of LON-1. It fits the 
      lipid-binding activity of other CAP-domain proteins and is the best available 
      molecular function. Its physiological ligand is not yet known.
    supported_by:
