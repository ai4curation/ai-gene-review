suggested_questions:
- question: What is the physiological sterol ligand of LON-1, and is sterol binding 
    needed for its growth-restraining activity in vivo, given that the E153A mutant 
    loses function without losing sterol binding?
- question: 'Through which step does LON-1 feed back on BMP signaling: ligand availability,
    receptor activity or a downstream step?'
suggested_experiments:
- description: Engineer endogenous LON-1 variants that selectively abolish sterol 
    binding while preserving folding and secretion; score body length and RAD-SMAD.
  hypothesis: Sterol binding is required for LON-1 to restrain growth and BMP signaling.
