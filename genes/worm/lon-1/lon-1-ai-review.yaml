id: Q09566
gene_symbol: lon-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'LON-1 is a secreted CAP-domain protein of the CRISP/PR-1 superfamily in C. elegans.
  It is expressed mainly in the hypodermis and intestine, and hypodermal expression is enough
  to set normal body length. DBL-1/BMP-like Sma/Mab signaling represses lon-1 transcription,
  and LON-1 restrains body growth: lon-1 mutants are long and have raised hypodermal ploidy,
  while overexpression makes animals short. LON-1 does not affect male tail patterning. LON-1
  also feeds back to dampen BMP pathway output: lon-1 loss raises BMP reporter activity and
  suppresses the sma-9 M-lineage defect. The CAP domain, not the C-terminal tail, is needed
  for function. Purified LON-1 binds sterol but not fatty acid in vitro, which suggests that
  LON-1 acts through lipid binding.'
