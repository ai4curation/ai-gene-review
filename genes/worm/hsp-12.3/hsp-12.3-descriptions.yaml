gene_symbol: hsp-12.3
organism: worm
uniprot_id: Q20164
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: hsp-12.3 encodes a small heat-shock protein that forms heterotetramerswith
    HSP-12.2 and has no chaperone-like activity; structurally, HSP-12.3is mostly a
    beta-sheet; at least one HSP-12 (which may or may not beHSP-12.2) is ubiquitously
    expressed in L1 larvae, and later expressed inadult spermatids (and perhaps spermatocytes),
    and some adult vulvalcells; hsp-12.3 is upregulated in daf-2 mutants, suggesting
    thathsp-12.3's expression may contribute to prolonged lifespan in dauerlarvae.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002012;class=Gene
  source_id: WB:WBGene00002012
- source: Alliance_Automated
  text: Enables heat shock protein binding activity. Predicted to be involved in protein
    refolding and response to heat. Predicted to be active in cytoplasm and nucleus.
    Human ortholog(s) of this gene implicated in adult-onset myofibrillar myopathy
    2A; cataract 16 multiple types; cataract 9 multiple types; dilated cardiomyopathy
    1II; and infantile-onset myofibrillar myopathy-2B. Orthologous to human CRYAA
    (crystallin alpha A); CRYAB (crystallin alpha B); and HSPB2 (heat shock protein
    family B (small) member 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002012;class=Gene
  source_id: WB:WBGene00002012
