descriptions:
- source: UniProt
  text: Transcription factor (By similarity). Plays a role in the unfolded protein
    response (UPR), perhaps mainly during constitutive endoplasmic reticulum (ER)
    stress, by activating transcription of genes involved in the UPR (PubMed:16184190).
    Plays a role in modulating lifespan, acting by positively regulating expression
    of calcium-binding chaperone crt-1, thereby influencing ER calcium homeostasis
    (PubMed:25186652, PubMed:32905769). By activating the UPR pathway, confers adaptive
    protection to subsequent exposure to hypoxia (PubMed:20733002). Involved in protection
    against proteotoxicity, probably acting via the UPR (PubMed:31570707). Probably
    acts in the UPR in parallel with the ire-1-xbp-1 and pek-1 pathways (PubMed:16184190).
    May be regulated by endopeptidase S2P-mediated proteolytic cleavage (PubMed:16184190).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20435
  source_id: Q20435
- source: Alliance_Imported
  text: atf-6 is an ortholog of mammalian ATF6alpha, a proximal sensor requiredfor
    the unfolded protein response (UPR) in the endoplasmic reticulum (ER);ATF6alpha
    is a transmembrane protein, with a bZIP transcription factordomain in its cytosolic
    amino terminus that is released and activated byproteolytic cleavage upon ER stress;
    either ire-1 or xbp-1 deletions aresynthetically lethal with atf-6 or pek-1 deletions,
    producing arrest in L2larvae; RNAi of Y56A3A.2 (a S2P protease homolog) is synthetically
    lethalwith ire-1(RNAi), consistent with the hypothesis that Y56A3A.2 cleavesATF-6;
    atf-6 regulates few genes that are transcriptionally induced byUPR, but regulates
    roughly one-quarter of genes that require UPRconstitutively; pdr-1 transcripts
    are strongly upregulated in aatf-6(ok551) mutant background, but atf-6(ok551);pdr-1(lg103)
    doublemutants have a grossly normal phenotype ; atf-6 is dispensable for properlocalization
    of GLR-1 glutamate receptors.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000222;class=Gene
  source_id: WB:WBGene00000222
- source: Alliance_Automated
  text: Enables RNA polymerase II transcription regulatory region sequence-specific
    DNA binding activity. Involved in ATF6-mediated unfolded protein response and
    positive regulation of transcription by RNA polymerase II. Predicted to be located
    in membrane. Predicted to be active in nucleus. Is expressed in several structures,
    including intestine; muscle cell; pharyngeal gland cell; rectum; and vulva. Human
    ortholog(s) of this gene implicated in achromatopsia 7. Orthologous to human ATF6
    (activating transcription factor 6) and ATF6B (activating transcription factor
    6 beta).
  source_type: automated
