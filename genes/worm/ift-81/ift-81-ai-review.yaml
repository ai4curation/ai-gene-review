suggested_questions:
- question: Is the tubulin-binding CH domain of worm IFT-81 required in vivo for axoneme elongation,
    as it is in human cells, and does its loss mimic the ift-74 phospho-dead or phospho-mimic
    phenotypes?
suggested_experiments:
- description: Introduce CH-domain point mutations that abolish tubulin binding into endogenous
    ift-81 and measure cilium length and tubulin (TBB-4) transport by live imaging.
