id: A8DYR7
gene_symbol: ift-81
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'IFT-81 is the Caenorhabditis elegans ortholog of IFT81, a core subunit of the
  intraflagellar transport complex B (IFT-B1 core). It has an N-terminal calponin-homology
  (CH) domain followed by long coiled-coil segments, through which it forms a heterodimer
  with IFT-74. The IFT-74/81 heterodimer is the tubulin-binding module of the IFT particle:
  the IFT81 CH domain recognizes the globular part of tubulin and the basic IFT74 N-terminus
  binds the beta-tubulin tail, so tubulin dimers are carried into the cilium for axoneme assembly.
  IFT-81 is expressed in ciliated sensory neurons, localizes at the ciliary base and in sensory
  cilia, and colocalizes with IFT-74. ift-81 loss-of-function mutants have mild defects in
  cilium formation, strongly disrupted IFT in mature cilia, chemosensory and dye-filling defects
  and small body size. Phosphorylation of IFT-74 by the ciliary kinase DYF-5 reduces the tubulin
  affinity of the IFT-74/81 module and promotes tubulin unloading at the ciliary tip.'
