- id: PMID:17535250
  title: IFT-81 and IFT-74 are required for intraflagellar transport in C. elegans.
  findings:
  - statement: IFT-81 is expressed in sensory neurons, localizes at the ciliary base, interacts
      with IFT-74, and is required for IFT in mature cilia.
    supporting_text: ift-81 and ift-74 mutants similarly exhibited weak anomalies in cilia
      formation and obvious disruptions of transport in mature cilia
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; primary loss-of-function study of ift-81 and ift-74.
- id: PMID:28479320
  title: Dynein-Driven Retrograde Intraflagellar Transport Is Triphasic in C. elegans Sensory
    Cilia.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only cache; mentions IFT-B generically.
- id: PMID:35969738
  title: DYF-5/MAK-dependent phosphorylation promotes ciliary tubulin unloading.
  findings:
  - statement: The IFT-74/81 module binds tubulin; DYF-5 phosphorylation of IFT-74 lowers
      its tubulin affinity about sixfold.
    supporting_text: the ciliary kinase DYF-5/MAK phosphorylates multiple sites within the
      tubulin-binding module of IFT-74, reducing the tubulin-binding affinity of IFT-74/81
      approximately sixfold
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; IFT-81 construct from WormBase CE41565 (F32A6.2), matching
      A8DYR7.
- id: PMID:23990561
  title: Molecular basis of tubulin transport within the cilium by IFT74 and IFT81.
  findings:
  - statement: The IFT81 CH domain binds the globular part of tubulin; tubulin binding by
      IFT81 is required for ciliogenesis in human cells.
    supporting_text: tubulin binding by IFT81 was required for ciliogenesis in human cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ortholog structural/biochemical evidence (human, Chlamydomonas).
core_functions:
- description: With IFT-74, IFT-81 forms the tubulin-binding module of the IFT-B particle.
    Its N-terminal calponin-homology domain binds tubulin dimers that IFT carries into the
    sensory cilium for axoneme assembly, and its coiled-coil region pairs with IFT-74 in the
    IFT-B1 core.
  supported_by:
  - reference_id: PMID:23990561
    supporting_text: the two core IFT proteins IFT74 and IFT81 form a tubulin-binding module
      and mapped the interaction to a calponin homology domain of IFT81 and a highly basic
      domain in IFT74
  - reference_id: PMID:35969738
    supporting_text: Tubulin dimers are loaded to IFT machinery through an interaction between
      tubulin and the IFT-74/81 module
