gene_symbol: ift-81
organism: worm
uniprot_id: A8DYR7
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Component of the intraflagellar transport (IFT) complex B: together with
    IFT74, forms a tubulin-binding module that specifically mediates transport of
    tubulin within the cilium. Binds tubulin via its CH (calponin-homology)-like region.
    Required for ciliogenesis. Required for proper regulation of SHH signaling. Plays
    an important role during spermatogenesis by modulating the assembly and elongation
    of the sperm flagella.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/A8DYR7
  source_id: A8DYR7
- source: Alliance_Imported
  text: ift-81 encodes an ortholog of the intraflagellar transport component IFT-81
    in Chlamydomonas; ift-81 along with ift-74 is involved in growth, chemotaxis,
    intraflagellar transport and the morphogenesis of cilia; ift-81 binds ift-74 in
    protein binding assays and co-localizes with ift-74 to the transition zone of
    cilia in neurons, indicating that ift-81 may form a complex with ift-74.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00017973;class=Gene
  source_id: WB:WBGene00017973
- source: Alliance_Automated
  text: Enables microtubule binding activity. Involved in chemotaxis; detection of
    stimulus involved in sensory perception; and intraciliary transport. Located in
    non-motile cilium. Is expressed in nervous system. Human ortholog(s) of this gene
    implicated in short-rib thoracic dysplasia 19 with or without polydactyly. Orthologous
    to human IFT81 (intraflagellar transport 81).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00017973;class=Gene
  source_id: WB:WBGene00017973
