gene_symbol: cebp-2
organism: worm
uniprot_id: Q8IG69
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Transcription factor that binds to the promoter and the enhancer regions of
    target genes (By similarity). Regulates expression of genes involved in fat metabolism,
    including ech-1.1 and fat-5 (PubMed:26505800). Has a protective role in response
    to infection by the Gram-negative bacterium P.aeruginosa (PubMed:26876169, PubMed:28662060,
    PubMed:34804026). Required for the activation of infection response gene irg-1
    following P.aeruginosa infection (PubMed:26876169). Required to prevent P.aeruginosa
    ToxA-mediated lethality (PubMed:26876169). May also function in concert with transcription
    factor zip-11 to mediate immune responses, independently of the pmk-1/p38 MAPK
    pathway (PubMed:34804026). May act together with the bZIP transcription factor,
    zip-2 (PubMed:26876169).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8IG69
  source_id: Q8IG69
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in defense response to Gram-negative bacterium; regulation
    of lipid metabolic process; and regulation of transcription by RNA polymerase
    II. Located in nucleus. Is expressed in head neurons; intestine; and somatic cell.
    Orthologous to several human genes including CEBPG (CCAAT enhancer binding protein
    gamma).
  source_type: automated
