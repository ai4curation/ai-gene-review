- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in defense response to Gram-negative bacterium; regulation
    of lipid metabolic process; and regulation of transcription by RNA polymerase
    II. Located in nucleus. Is expressed in head neurons; intestine; and somatic cell.
    Orthologous to several human genes including CEBPG (CCAAT enhancer binding protein
    gamma).
