findings:
- category: discrepancy
  text: UniProt and WormBase describe SEM-5 as a negative regulator of let-23/Ras
    vulval signaling; the review describes it as the adaptor coupling LET-23 to SOS-1/LET-60.
  sources:
  - UniProt
  - Alliance_Imported
- category: gap
  text: UniProt's role in nAChR (LEV-1) synaptic levels and nicotine sensitivity is
    not covered by the review.
