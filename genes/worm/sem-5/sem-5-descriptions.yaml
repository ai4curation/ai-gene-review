- source: Alliance_Automated
  text: Enables epidermal growth factor receptor binding activity. Involved in several
    processes, including epidermal growth factor receptor signaling pathway; male
    genitalia development; and regulation of vulval development. Located in plasma
    membrane. Is expressed in several structures, including P3.p hermaphrodite; P4.p
    hermaphrodite; P5.p hermaphrodite; P6.p hermaphrodite; and P7.p hermaphrodite.
    Human ortholog(s) of this gene implicated in autosomal recessive nonsyndromic
    deafness 114; breast cancer; prostate adenocarcinoma; and prostate cancer. Orthologous
    to several human genes including GRB2 (growth factor receptor bound protein 2).
