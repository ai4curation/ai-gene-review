  review:
    summary: 'IBA: epidermal growth factor receptor binding by the conserved SEM-5/GRB2 adaptor family.'
    action: ACCEPT
    reason: EGFR binding is a core activity of SEM-5/GRB2-family SH2/SH3 adaptors.
      Worm SEM-5 itself was shown to bind activated human EGFR in vitro, and human
      GRB2 and fly Drk can functionally replace SEM-5 in vivo, supporting the PAINT
      inference across this family node.
    supported_by:
    - reference_id: PMID:8305738
      supporting_text: We also show that Sem-5, like GRB2, can bind to the activated
        hEGFR in vitro.
