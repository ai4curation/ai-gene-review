id: P29355
gene_symbol: sem-5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sem-5 encodes the C. elegans GRB2-family SH2/SH3 adaptor that links receptor
  tyrosine kinases to Ras/MAPK signaling. SEM-5 is recruited to activated
  LET-23 and other RTK signaling complexes and, through proline-rich partner
  binding, helps couple these receptors to SOS-1/LET-60 signaling in vulval
  induction, sex-myoblast migration, and additional RTK-dependent processes.
existing_annotations:
- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0004638
  - PANTHER:PTN005273574
  - RGD:619758
  - UniProtKB:P62993
  review:
    summary: 'IBA: phosphotyrosine residue binding by the conserved SEM-5/GRB2 SH2 domain.'
    action: ACCEPT
    reason: SEM-5 is an SH2/SH3 adaptor in the GRB2 family; the central SH2 domain is
      the conserved phosphotyrosine-recognition module that allows these adaptors to
      couple activated receptor tyrosine kinases to downstream Ras/MAPK signaling.
      The PAINT placement on the GRB2/Sem-5/Drk node is consistent with direct
      Sem-5 sequence and functional-rescue evidence.
    supported_by:
    - reference_id: PMID:1372395
      supporting_text: SH2 and SH3 domains are present in many signalling proteins
        regulated by receptor and non-receptor tyrosine kinases.
