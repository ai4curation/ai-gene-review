  supporting_entities:
  - PANTHER:PTN005273574
  - UniProtKB:O75791
  review:
    summary: 'IBA: nucleoplasmic activity inferred for a GRB2-family adaptor.'
    action: KEEP_AS_NON_CORE
    reason: Nucleoplasm is plausible as a secondary localization for this adaptor
      family but is not the canonical SEM-5 site of action in C. elegans; SEM-5 is
      best established as a cytosolic and membrane-recruited SH2/SH3 adaptor in
      receptor tyrosine kinase signaling.
    supported_by:
    - reference_id: PMID:1372395
      supporting_text: On the basis of its DNA sequence, sem-5 encodes a novel
        228-amino-acid protein which consists almost entirely of one SH2 (SH, src
        homology region) and two SH3 domains.
