descriptions:
- source: Alliance_Imported
  text: tax-2 encodes a cyclic nucleotide-gated channel beta subunit orthologous to
    the human gene ROD PHOTORECEPTOR CNG-CHANNEL BETA SUBUNIT (CNGB1; OMIM:600724),
    which when mutated leads to disease; TAX-2 activity is required for chemosensation,
    thermosensation, regulation of dauer larval development, normal axon guidance
    for some sensory neurons, and regulation  of axonal outgrowth and morphology in
    late larval stages; a tax-2::GFP promoter fusion is expressed in nine pairs of
    amphid sensory neurons and a TAX-2::GFP fusion protein localizes to developing
    axons and sensory cilia.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006525;class=Gene
