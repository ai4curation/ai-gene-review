gene_symbol: tax-2
organism: worm
uniprot_id: G5EEE2
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: tax-2 encodes a cyclic nucleotide-gated channel beta subunit orthologous to
    the human gene ROD PHOTORECEPTOR CNG-CHANNEL BETA SUBUNIT (CNGB1; OMIM:600724),
    which when mutated leads to disease; TAX-2 activity is required for chemosensation,
    thermosensation, regulation of dauer larval development, normal axon guidance
    for some sensory neurons, and regulation  of axonal outgrowth and morphology in
    late larval stages; a tax-2::GFP promoter fusion is expressed in nine pairs of
    amphid sensory neurons and a TAX-2::GFP fusion protein localizes to developing
    axons and sensory cilia.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006525;class=Gene
  source_id: WB:WBGene00006525
- source: Alliance_Automated
  text: Contributes to intracellularly cGMP-activated cation channel activity. Involved
    in several processes, including G protein-coupled receptor signaling pathway coupled
    to cGMP nucleotide second messenger; negative regulation of receptor guanylyl
    cyclase signaling pathway; and regulation of gene expression. Part of cation channel
    complex. Is expressed in hypodermis; intestine; and nervous system. Human ortholog(s)
    of this gene implicated in achromatopsia; achromatopsia 3; color blindness; retinitis
    pigmentosa; and retinitis pigmentosa 45. Orthologous to human CNGB1 (cyclic nucleotide
    gated channel subunit beta 1) and CNGB3 (cyclic nucleotide gated channel subunit
    beta 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006525;class=Gene
  source_id: WB:WBGene00006525
