descriptions:
- source: UniProt
  text: Transcription factor (PubMed:16839188, PubMed:35021096). Binds to regulatory
    elements and regulates transcription of target genes, including acyltransferase
    dgat-2 (PubMed:35021096). As part of a lysosome-to-nucleus retrograde lipid signaling
    pathway, acts as a direct nuclear receptor of oleoylethanolamide (OEA) and, acting
    in concert with nuclear hormone receptor nhr-49, activates the transcription of
    genes promoting longevity and mitochondrial beta- oxidation (PubMed:25554789,
    PubMed:26671266). Required to modulate expression of delta-9 fatty acid desaturases,
    thereby regulating lipid metabolism; in some contexts, acting in concert with
    nhr-49 (PubMed:16839188, PubMed:21423649, PubMed:22511885). Involved in modulation
    of lipid metabolism in response to the citrate-induced mitochondrial unfolded
    protein response (mtUPR), acting downstream of transcription factor dve-1 and
    ubiquitin-like protein 5 (PubMed:35021096). Plays a role in modulating mitochondrial
    morphology and function (PubMed:22511885). Involved in positively modulating life-
    span in a germline-dependent manner, acting in concert with nuclear hormone receptor
    daf-12 (PubMed:21423649). Plays a role in transgenerational lipid accumulation
    in response to a high-fat diet (PubMed:35140229).
