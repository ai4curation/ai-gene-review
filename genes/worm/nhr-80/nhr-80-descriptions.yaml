- source: Alliance_Imported
  text: nhr-80 encodes a nuclear hormone receptor, expressed in the intestine,that
    regulates expression of the delta-9 desaturases FAT-5/-6/-7, andthus regulates
    fatty acid metabolism; NHR-80 is fully required for anyexpression of FAT-7, full
    expression of FAT-5/-6, viability in theabsence of FAT-6, and transcriptional
    hyperactivation of fat-7 in theabsence of FAT-6, and for a fully normal adult
    lifespan; nhr-80 isexpressed robustly in the intestine during larval and adult
    stages ofdevelopment, with some expression also seen in head muscles; nhr-80 isspecific
    to nematodes, being a divergent ortholog of HNF4 with manyparalogs in C. elegans;
    nhr-80(tm1011) mutants, like nhr-49 mutants,have an increased ration of saturated
    18:0 fatty acids tomonounsaturated 18:1 ones (4.6 instead of 2.2); nhr-80(tm1011)
    mutantsare viable and fertile and have no increase in fat storage, but doublefat-6(tm331);nhr-80(tm1011)
    mutants, (or fat-6(tm331) mutants subjectedto nhr-80(RNAi), are synthetically
    lethal unless cultured on mediasupplemented with desaturated fatty acids.
