gene_symbol: rimb-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: RIMB-1 (formerly TAG-168) is the single Caenorhabditis elegans RIM-binding protein, a large
  cytoplasmic scaffold of the presynaptic active zone built from three SH3 domains and two fibronectin
  type III domains and expressed as two splice isoforms. It is not an enzyme; it acts as an adaptor that
  helps retain and position the UNC-2/CaV2 voltage-gated calcium channel close to release-ready synaptic
  vesicles, so that local calcium influx triggers fusion rapidly and precisely. Endogenously tagged RIMB-1
  forms puncta along motor-neuron neurites that colocalize with UNC-10/RIM and UNC-2, and its own recruitment
  depends on CLA-1/Clarinet and partly on SYD-2/liprin-alpha. Because the active zone is built from overlapping
  scaffolds, loss of RIMB-1 alone has mild consequences, while combined loss of RIMB-1 and UNC-10 causes
  a profound loss of presynaptic calcium channels and of transmission.
