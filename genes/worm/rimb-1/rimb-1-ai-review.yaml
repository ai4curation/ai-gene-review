core_functions:
- description: Cytoplasmic scaffold of the presynaptic active zone; RIMB-1 uses its SH3 and FN3 modules
    to help retain and position the UNC-2/CaV2 calcium channel at release sites, acting redundantly with
    UNC-10/RIM and downstream of CLA-1 and SYD-2.
