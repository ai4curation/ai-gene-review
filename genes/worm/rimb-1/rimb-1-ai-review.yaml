  review:
    summary: Proposed molecular function - RIMB-1 is a cytoplasmic structural component of the presynaptic
      active zone that helps retain and position the UNC-2/CaV2 calcium channel at release sites.
    action: NEW
    reason: 'rimb-1 currently carries no molecular-function or location annotation at all, its only GOA
      row being a high-throughput protein-binding IPI that this review removes. The scaffold function
      is the one accepted for the human ortholog RIMBP2 in this repository and is the role assigned to
      RIM-BP in the synaptic vesicle exocytosis module. Worm evidence supports it directly: endogenously
      tagged RIMB-1 colocalizes with UNC-2 at every synaptic punctum examined, rimb-1;unc-10 double mutants
      lose presynaptic UNC-2 profoundly while either single mutant does not, and rescue requires the C-terminal
      SH3 region. The participation test is met because RIMB-1 itself supplies the interaction surfaces
      that hold the channel in place.'
    supported_by:
