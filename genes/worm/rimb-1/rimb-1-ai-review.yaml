  title: Deep research report for rimb-1 (falcon)
  findings:
  - statement: RIMB-1 is a multidomain intracellular presynaptic active-zone adaptor whose main role is
      to retain and position UNC-2/CaV2 near release-ready vesicles.
    supporting_text: It is a multidomain, intracellular **presynaptic active-zone adaptor/scaffold**.
  - statement: RIMB-1 has three SH3 and two FN3 domains and two splice isoforms, with similarity to mouse
      RIM-BP2 and Drosophila RIM-BP.
    supporting_text: Both possess one N-terminal SH3 domain, two fibronectin type III-like domains, and
      two tandem C-terminal SH3 domains
  - statement: Endogenously tagged RIMB-1 colocalizes with GFP-tagged UNC-2 at all examined synaptic puncta
      in the dorsal nerve cord.
    supporting_text: Endogenous mScarlet-tagged RIMB-1 and GFP-tagged UNC-2 colocalized at all examined
      synaptic puncta in the dorsal nerve cord.
  - statement: rimb-1 and unc-10 act redundantly - single mutants retain near-normal UNC-2 clusters, the
      double mutant loses presynaptic UNC-2 profoundly.
    supporting_text: Either single mutant retained relatively normal UNC-2 clusters in several assays,
      but the double mutant showed a profound loss of presynaptic UNC-2.
  - statement: RIMB-1 puncta depend strongly on CLA-1/Clarinet.
    supporting_text: Complete loss of CLA-1 drastically reduced both the intensity and number of RIMB-1
      puncta
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Machine-generated literature synthesis; its primary sources (Kushibiki 2019, Oh 2021,
