- id: PMID:31530643
  title: RIMB-1/RIM-Binding Protein and UNC-10/RIM Redundantly Regulate Presynaptic
    Localization of the Voltage-Gated Calcium Channel in Caenorhabditis elegans.
  findings:
  - statement: RIMB-1 and UNC-10/RIM act redundantly to regulate presynaptic localization of UNC-2/CaV2.
    supporting_text: Both analyses identified the RIM homolog UNC-10 that acts together with RIMB-1 to
      regulate presynaptic localization of the P/Q-type VGCC UNC-2/Cav2.
  - statement: A C-terminal SH3 domain of RIMB-1 is required for its UNC-2-localization function.
    supporting_text: Our transgenic rescue analysis with RIMB-1 deletion constructs revealed a functional
      requirement of a C-terminal SH3 in regulating UNC-2/Cav2 localization.
  - statement: Transgenic RIMB-1 puncta in D-type motor neurons colocalize with UNC-10/RIM and with the
      synaptic vesicle marker SNB-1/VAMP2, placing RIMB-1 at presynaptic active zones.
    supporting_text: mCherry-RIMB-1a puncta resembled those of GFP-labeled presynaptic AZ protein
      UNC-10/RIM
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC full text cached; directly supports the proposed RIMB-1 active-zone scaffold
      function and active-zone localization.
- id: PMID:33975919
  title: UNC-2 CaV2 Channel Localization at Presynaptic Active Zones Depends on UNC-10/RIM
    and SYD-2/Liprin-α in Caenorhabditis elegans.
  findings:
  - statement: Endogenously tagged RIMB-1 and UNC-2 colocalize at synaptic puncta in the dorsal nerve
      cord.
    supporting_text: UNC-2 and RIMB-1 imaged in the dorsal nerve cord colocalized in all synaptic puncta
  - statement: Endogenously tagged UNC-10, SYD-2, ELKS-1, and RIMB-1 show distinct but partly redundant
      control of presynaptic UNC-2 channel localization.
    supporting_text: Together our data show that UNC-10, SYD-2, RIMB-1, and ELKS-1 control presynaptic
      UNC-2 channel localization in redundant yet distinct manners.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC full text cached; supports endogenous active-zone localization and the
      UNC-10/SYD-2/RIMB-1/ELKS-1 redundancy model.
- id: PMID:37186867
  title: C. elegans Clarinet/CLA-1 recruits RIMB-1/RIM-binding protein and UNC-13 to
    orchestrate presynaptic neurotransmitter release.
  findings:
  - statement: CLA-1 and UNC-10 act together upstream of RIMB-1, UNC-2 and UNC-13 in the active-zone
      machinery that coordinates presynaptic release.
    supporting_text: These data provide compelling evidence for several genetic interactions through
      which CLA-1 contributes to synaptic function, predominantly through the regulation of RIMB-1 and
      UNC-13, and along with UNC-10 governs neurotransmitter release at C. elegans synapses
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC full text cached; supports the CLA-1-dependent recruitment/stabilization
      context described in the review.
