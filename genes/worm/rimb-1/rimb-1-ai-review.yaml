suggested_questions:
- question: rimb-1 has only one GOA annotation (a high-throughput protein-binding IPI) despite a substantial
    worm literature on RIMB-1 in calcium-channel positioning - can the Kushibiki 2019, Oh 2021 and Krout
    2023 papers be curated for this gene?
- question: Does RIMB-1 bind UNC-10/RIM directly in C. elegans, as vertebrate RIM-BPs bind RIM proline-rich
    motifs through their third SH3 domain, or only functionally in parallel with it?
suggested_experiments:
- description: Purified-protein binding assays between the RIMB-1 SH3 domains and the UNC-10 proline-rich
    region and the UNC-2 C-terminus, paired with endogenous tagging and super-resolution imaging in rimb-1
    domain-deletion knock-ins, to establish which interaction anchors the channel.
