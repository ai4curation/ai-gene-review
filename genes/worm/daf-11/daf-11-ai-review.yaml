    label: non-motile cilium
  supported_by:
  - reference_id: PMID:1732156
    supporting_text: >-
      These results suggest that daf-11 is directly involved in chemosensory transduction essential for
      dauer formation
  - reference_id: PMID:11677050
    supporting_text: >-
      Expression of daf-11 cDNA by cell specific promoters suggests that daf-11 acts cell autonomously
      in ASI chemosensory neurons for daf-7 expression.
suggested_questions:
- question: >-
    What ligand or stimulus, if any, binds the DAF-11 extracellular domain, and is DAF-11 activity regulated
    directly by NO or other gases through its HNOBA region?
- question: >-
    Does DAF-11 form heterodimers with ODR-1 or other co-expressed receptor guanylyl cyclases in AWC/ASJ
    cilia, and is each partner catalytically competent?
suggested_experiments:
- description: >-
    Measure cyclase activity of recombinant DAF-11 (alone and co-expressed with ODR-1) in membranes, testing
    candidate ligands, NO donors and DAF-21/Hsp90 dependence.
