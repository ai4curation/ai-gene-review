core_functions:
- description: >-
    Ciliary receptor-type guanylate cyclase: converts GTP to cGMP in the sensory cilia of ASI, ASJ, ASK,
    AWB and AWC chemosensory neurons, supplying the second messenger for cGMP-gated (TAX-2/TAX-4) transduction
    channels.
  molecular_function:
    id: GO:0004383
    label: guanylate cyclase activity
  directly_involved_in:
  - id: GO:0006182
    label: cGMP biosynthetic process
  - id: GO:0007168
    label: receptor guanylyl cyclase signaling pathway
  locations:
  - id: GO:0097730
    label: non-motile cilium
  supported_by:
  - reference_id: PMID:10790386
    supporting_text: >-
      We report that daf-11 encodes one of a large family of C. elegans transmembrane guanylyl cyclases
      (TM-GCs).
  - reference_id: PMID:10790386
    supporting_text: >-
      The cyclic GMP analogue 8-bromo-cGMP rescues a sensory defect in both daf-11 and daf-21 mutants,
      supporting a role for DAF-11 guanylyl cyclase activity in this process
  - reference_id: PMID:21124868
    supporting_text: >-
      In wild-type animals, the DAF-11::GFP protein localized to the sensory cilia of the olfactory neuron
      pairs ASI, ASJ, ASK, AWB and AWC
- description: >-
    cGMP source for chemosensory and light transduction: DAF-11 is required for AWC-mediated chemotaxis
    to volatile odorants and for LITE-1-dependent photocurrents in ASJ, acting at the cyclase step between
    upstream receptors/G proteins and the CNG channel.
  molecular_function:
    id: GO:0004383
    label: guanylate cyclase activity
  directly_involved_in:
  - id: GO:0006935
    label: chemotaxis
  - id: GO:0007602
    label: phototransduction
  locations:
  - id: GO:0097730
    label: non-motile cilium
  supported_by:
  - reference_id: PMID:7828815
    supporting_text: >-
      both mutants are defective in taxis to volatile attractants detected primarily by the amphid neuron
      AWC
  - reference_id: PMID:20436480
    supporting_text: >-
      Two independent daf-11 mutant alleles, ks67 and m47, both lacked photocurrents in ASJ
- description: >-
    Sensory repression of dauer entry: cGMP signalling by DAF-11 in ASI/ASJ is required to keep larvae
    in reproductive development, partly by sustaining daf-7 TGF-beta expression in ASI.
  molecular_function:
    id: GO:0004383
    label: guanylate cyclase activity
  directly_involved_in:
