        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Peptide-receptor activity is grounded in vertebrate natriuretic peptide receptor guanylyl cyclases
          (NPR-A/NPR-B); the C. elegans sensory receptor guanylyl cyclase radiation has no demonstrated
          peptide ligand.
