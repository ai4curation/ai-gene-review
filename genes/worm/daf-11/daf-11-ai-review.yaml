gene_symbol: daf-11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  daf-11 encodes a receptor-type (transmembrane) guanylate cyclase of C. elegans chemosensory neurons.
  The protein has an extracellular ligand-binding-like domain of unknown ligand, a single transmembrane
  helix, an intracellular kinase-homology (pseudokinase) domain and a C-terminal class-4 guanylate cyclase
  domain that converts GTP to cGMP. DAF-11 is expressed in five pairs of amphid chemosensory neurons (ASI,
  ASJ, ASK, AWB, AWC) and is concentrated in their non-motile sensory cilia; its ciliary targeting requires
  the MYND-domain protein DAF-25, and its activity depends on the Hsp90 chaperone DAF-21. DAF-11-generated
  cGMP gates the TAX-2/TAX-4 cyclic nucleotide-gated channel and activates the PKG EGL-4. Through this
  second-messenger output DAF-11 is required for chemotaxis to AWC-sensed volatile odorants and ASE-sensed
  water-soluble attractants, for phototransduction downstream of the LITE-1 photoreceptor in ASJ/ASK/ASI,
  for NO-evoked calcium responses in ASJ, and for repression of dauer entry, partly by maintaining daf-7
  TGF-beta expression in ASI. Loss of daf-11 also affects adult lifespan, oxidative-stress responses,
  sensory axon maintenance and AWC str-2 olfactory receptor expression.
