- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IGI
  original_reference_id: PMID:1732156
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:G5ED37
  review:
    summary: >-
      IGI cilium assembly derived from double-mutant epistasis between daf-11 and cilium-structure (che/osm/daf)
      mutants.
    action: REMOVE
    reason: >-
      The cited paper shows that Daf-c mutations in daf-11 are suppressed by mutations in nine cilium-structure
      genes, i.e. daf-11 requires intact cilia to exert its effect; this epistasis places cilium formation
      upstream/permissive for DAF-11 signalling and does not show that DAF-11 builds cilia. daf-11 mutants
      have structurally normal, dye-filling amphid cilia. DAF-11 is a ciliary guanylyl cyclase, not a
      ciliogenesis factor. The IGI appears to reflect the cilium genes (WITH partners), not a function
      of DAF-11.
    supported_by:
    - reference_id: PMID:1732156
      supporting_text: >-
        Dauer-constitutive mutations in one gene, daf-11, were strongly suppressed for dauer formation
        by mutations in the nine cilium-structure genes.
    - reference_id: PMID:21124868
      supporting_text: By contrast, daf-11 and daf-21 mutants show wild-type dye filling
