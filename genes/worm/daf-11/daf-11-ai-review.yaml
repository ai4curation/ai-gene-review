  review:
    summary: >-
      PANTHER IBA transfer of peptide receptor activity from vertebrate natriuretic-peptide receptor guanylyl
      cyclases (NPR-A/NPR-B) at a deep node of the receptor guanylyl cyclase family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      DAF-11 is an orphan receptor-type guanylyl cyclase. No peptide (or any other) ligand has been identified
      for its extracellular domain, and the experimental literature places it as the cGMP source downstream
      of diverse sensory inputs (pheromone, odorants, light via LITE-1, NO), not as a peptide receptor.
      The receptor-for-peptide function is a lineage-specific property of the natriuretic peptide receptors
      and is not demonstrated for the nematode chemosensory rGC radiation; marking as over-annotated rather
      than removing because a ligand could still be found.
    supported_by:
    - reference_id: PMID:10790386
      supporting_text: >-
        We report that daf-11 encodes one of a large family of C. elegans transmembrane guanylyl cyclases
        (TM-GCs).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
