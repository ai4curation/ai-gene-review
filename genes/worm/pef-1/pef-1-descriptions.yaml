- source: Alliance_Automated
  text: Predicted to enable protein serine/threonine phosphatase activity. Predicted
    to be involved in detection of stimulus involved in sensory perception. Located
    in perikaryon and plasma membrane. Is expressed in hypodermis; intestinal cell;
    muscle cell; and neurons. Orthologous to several human genes including PPEF1 (protein
    phosphatase with EF-hand domain 1).
