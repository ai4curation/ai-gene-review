- source: Alliance_Imported
  text: pef-1 encodes an ortholog of the rhodopsin-specific serine/threonine phosphatase
    RdgC in D. melanogaster and of RdgC-related proteins in humans (PPEF1 and PPEF2;
    OMIM:300109 and OMIM:602256); PEF-1 has a EF-hand calcium-binding domain, and
    is peripherally bound to the plasma membrane by myristoylation and palmitoylation;
    pef-1 has no known mutant phenotype, but is expressed in several anterior amphid
    neurons, from what appears to be the 3-fold embryo stage onward; on the basis
    of its expression and its orthology, PEF-1 may negatively regulate signalling
    through serpentine receptors such as STR-2.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003969;class=Gene
