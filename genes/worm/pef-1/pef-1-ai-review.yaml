id: G5EBX9
gene_symbol: pef-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: PEF-1 (Phosphatase with EF-hands 1) is the sole C. elegans member 
  of the RdgC/PPEF family of serine/threonine protein phosphatases, 
  distinguished by C-terminal EF-hand calcium-binding domains. Expression is 
  restricted to sensory neurons including ciliated chemosensory neurons AWB, 
  AWC, ASE, AFD, BAG, and others. The protein localizes to sensory cilia via 
  N-terminal myristoylation (Gly-2) and palmitoylation (Cys-3), where it is 
  enriched in the ciliary axoneme and excluded from the transition zone. PEF-1 
  requires transition zone proteins (MKS-5, CEP-290) for proper ciliary 
  compartmentalization. Functional studies demonstrate that pef-1 mutants show 
  defects in thermotaxis, salt chemotaxis, CO2 avoidance, and UV light 
  avoidance, while osmosensation remains normal. TEM analysis reveals 
  microtubule abnormalities in pef-1 mutant cilia, suggesting a role in cilium 
  maintenance. The protein binds calcium via its EF-hands and binds manganese as
  a cofactor for phosphatase activity. This is the first PPEF family member 
  demonstrated to function in cilia; in contrast, the Drosophila ortholog RdgC 
  functions in non-ciliary rhabdomeric photoreceptors.
