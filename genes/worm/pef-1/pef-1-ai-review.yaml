  - term:
      id: GO:0005506
      label: iron ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: IEA annotation from InterPro domain IPR012008. However, PPP 
        phosphatases typically use manganese, not iron, as the catalytic metal. 
        UniProt specifically annotates manganese binding for this protein based 
        on similarity to P36873. Iron binding is not established for PPEF family
        members.
      action: REMOVE
      reason: This is likely an incorrect inference. PPEF family phosphatases 
        use manganese as the catalytic metal ion. UniProt annotation and 
        experimental evidence from related proteins indicate manganese binding, 
        not iron. The InterPro inference may be overly broad.
  - term:
