      label: calcium ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Core function supported by experimental evidence. PEF-1 contains 
        three EF-hand domains that bind calcium. Ramulu and Nathans (2001) 
