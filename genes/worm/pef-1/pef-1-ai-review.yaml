core_functions:
  - molecular_function:
      id: GO:0004722
      label: protein serine/threonine phosphatase activity
    description: Member of the RdgC/PPEF family of serine/threonine 
      phosphatases. Contains PPP phosphatase domain with conserved catalytic 
      residues and manganese binding sites. Catalytic activity inferred from 
      domain architecture and family membership (PMID:11312268).
    locations:
      - id: GO:0005929
        label: cilium
      - id: GO:0005930
        label: axoneme
    directly_involved_in:
      - id: GO:0040040
        label: thermosensory behavior
  - molecular_function:
      id: GO:0005509
      label: calcium ion binding
    description: Contains three C-terminal EF-hand domains. Experimental 
      evidence demonstrates binding of 1-2 calcium ions per protein. Calcium 
      binding is a defining feature of the PPEF family (PMID:11312268).
    supported_by:
      - reference_id: PMID:11312268
        supporting_text: A recombinant C-terminal fragment of CePPEF containing 
          two putative EF-hands bound between one and two Ca(2+) ions/protein
  - molecular_function:
      id: GO:0030145
      label: manganese ion binding
    description: PPP phosphatases require manganese as catalytic cofactor. 
      Binding of 2 manganese ions per subunit inferred from conserved binding 
      residues and similarity to characterized family members.
