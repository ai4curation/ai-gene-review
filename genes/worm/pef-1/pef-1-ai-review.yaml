  - term:
      id: GO:0004722
      label: protein serine/threonine phosphatase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - FB:FBgn0265959
      - PANTHER:PTN001362369
      - RGD:68415
      - SGD:S000003355
      - TAIR:locus:2163991
      - UniProtKB:P53041
      - UniProtKB:Q8ILL9
    review:
      summary: Core molecular function of PEF-1 supported by sequence homology
        to the RdgC/PPEF family, presence of PPP phosphatase domain, and
        catalytic residues. The protein contains a well-characterized
        metallophos domain with manganese-binding sites essential for catalysis.
        UniProt annotates EC 3.1.3.16 activity.
      action: ACCEPT
      reason: Protein serine/threonine phosphatase activity is the defining
        molecular function of the PPEF family. PEF-1 contains all necessary
        catalytic domains and cofactor binding sites. This is strongly supported
        by phylogenetic analysis and domain architecture.
      supported_by:
        - reference_id: PMID:11312268
          supporting_text: The RdgC/PPEF family of serine/threonine protein
            phosphatases is distinguished by the presence of C-terminal EF-hands
            and neuron-specific expression, including frequent expression in
            primary sensory neurons
        - reference_id: file:worm/pef-1/pef-1-deep-research-falcon.md
          reference_section_type: OTHER
          supporting_text: pef-1 encodes a Protein Phosphatase with EF-hands (PPEF) orthologous to Drosophila retinal degeneration C (rdgC), within the PPP family of serine/threonine phosphatases distinguished by a C‑terminal EF‑hand pair.
        - reference_id: file:worm/pef-1/pef-1-deep-research-wormbase.md
          reference_section_type: OTHER
          supporting_text: pef-1 encodes an ortholog of the rhodopsin-specific serine/threonine phosphatase RdgC in D. melanogaster and of RdgC-related proteins in humans (PPEF1 and PPEF2; OMIM:300109 and OMIM:602256)
