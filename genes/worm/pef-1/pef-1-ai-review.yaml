    review:
      summary: IBA annotation based on phylogenetic inference at the broad
        PP5/BSU1/PPEF phosphatase node (PANTHER:PTN001362369). However, the 2001
        study by Ramulu and Nathans (PMID:11312268) found CePPEF (PEF-1) to be
        membrane-associated via N-terminal myristoylation (Gly-2) and
        palmitoylation (Cys-3) and localized to neuronal cell bodies, dendrites,
        axons, and cilia. No nuclear localization was observed in C. elegans,
        and PMID:39550471 confirms localization to the ciliary axoneme.
      action: REMOVE
      reason: No experimental evidence supports nuclear localization of PEF-1 in
        C. elegans. Both PMID:11312268 and PMID:39550471 show exclusive
        membrane/ciliary localization in sensory neurons via dual N-terminal
        acylation. Propagation from nuclear PP5/BSU1 paralogs at the broad
        PANTHER:PTN001362369 node does not apply to the lipid-anchored RdgC/PPEF
        subfamily.
