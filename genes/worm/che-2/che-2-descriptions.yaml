gene_symbol: che-2
organism: worm
uniprot_id: G5EGF0
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: che-2 encodes a protein that contains G-protein beta-like WD-40 repeats that
    affects chemotaxis, dauer formation, and longevity; expressed in the cilia of
    most ciliated sensory neurons, some head neurons, and male tail rays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000484;class=Gene
  source_id: WB:WBGene00000484
- source: Alliance_Automated
  text: Is expressed in neurons. Human ortholog(s) of this gene implicated in asphyxiating
    thoracic dystrophy 2. Orthologous to human IFT80 (intraflagellar transport 80).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000484;class=Gene
  source_id: WB:WBGene00000484
- source: RefSeq
  text: Involved in several processes, including dauer larval development; negative
    regulation of transforming growth factor beta receptor signaling pathway; and
    positive regulation of locomotion involved in locomotory behavior. Located in
    ciliary basal body and non-motile cilium. Is expressed in neurons. Human ortholog(s)
    of this gene implicated in asphyxiating thoracic dystrophy 2. Orthologous to human
    IFT80 (intraflagellar transport 80). [provided by Alliance of Genome Resources,
    Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/180401
  source_id: GeneID:180401
fetch_date: '2026-10-29'
