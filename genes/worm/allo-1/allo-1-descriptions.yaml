descriptions:
- source: UniProt
  text: Autophagy receptor, which is required for allophagy, an autophagic process
    in which paternal organelles, including mitochondria and membranous organelles,
    are degraded in early embryos. After fertilization, recruited to ubiquitin-modified
    paternal organelles and is required for the formation of autophagosomes around
    the paternal organelles. Also plays a role in the regulation of autophagy in germ
    cells.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9U389
