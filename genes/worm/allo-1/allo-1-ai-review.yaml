    - reference_id: PMID:38368448
      supporting_text: We observed that localization of EPG-7-GFP and UNC-51-GFP around paternal organelles
        was severely impaired in the allo-1 mutant (Supplementary Fig. 5a, b), indicating that ALLO-1
        is required for recruitment of the ULK complex around cargo.
