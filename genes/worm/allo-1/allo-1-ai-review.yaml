    label: mitophagy
  evidence_type: IMP
  original_reference_id: PMID:38368448
  review:
    summary: Paternal mitochondria persist in allo-1 mutant embryos. ALLO-1b, the canonical UniProt isoform,
      gathers on paternal mitochondria within 30 s of sperm-oocyte contact and efficiently rescues their
      degradation.
    action: NEW
    reason: 'ALLO-1 does part of the work of mitophagy. It binds the cargo and LGG-1, and recruits the
      ULK complex around the mitochondria. Comparator check (QuickGO), for receptors in the same role:
      human FUNDC1 and BNIP3 are annotated to mitophagy (GO:0000423), and OPTN to its child, type 2 mitophagy.
      Paternal mitochondrion clearance is a selective autophagy of mitochondria, and no more specific
      GO term for allophagy exists. ALLO-1 also targets membranous organelles, which this term does not
      cover.'
    supported_by:
    - reference_id: PMID:38368448
      supporting_text: In contrast to ALLO-1a, the expression of GFP-ALLO-1b efficiently rescued the defective
        degradation of paternal mitochondria (Fig. 2a, b).
    - reference_id: PMID:29255173
      supporting_text: In Caenorhabditis elegans embryos, paternally provided organelles, including mitochondria,
        are eliminated by a process of selective autophagy called allophagy
