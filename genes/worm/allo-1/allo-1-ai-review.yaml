    supporting_text: ALLO-1 is essential for autophagosome formation around paternal organelles and directly
      binds to the worm LC3 homologue LGG-1 through its LC3-interacting region (LIR) motif.
  - reference_id: PMID:38368448
    supporting_text: indicating that ALLO-1 is required for recruitment of the ULK complex around cargo
suggested_questions:
- question: Which ubiquitin ligase(s) mark paternal mitochondria versus membranous organelles, and does
    ALLO-1b bind ubiquitin through a different interface from ALLO-1a?
- question: Should GO have a process term for elimination of paternal organelles or mitochondria after
    fertilization (allophagy), as a child of mitophagy/selective autophagy?
- question: Does ALLO-1 act outside the zygote, for example in the reported germ cell regulation of autophagy,
    and through what cargo?
suggested_experiments:
- description: In vitro reconstitution with ubiquitinated liposomes or isolated sperm mitochondria, recombinant
    ALLO-1a/b, LGG-1 and EPG-7, to test whether ALLO-1 alone bridges cargo to LC3 and the ULK scaffold,
    and how IKKE-1 phosphorylation of Thr-74 changes this.
