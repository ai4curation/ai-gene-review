  review:
    summary: allo-1 mutants fail to form autophagosomes around paternal organelles after fertilization.
      ALLO-1 is also needed to recruit LGG-1 and the ULK complex (UNC-51, EPG-7) around the cargo.
    action: ACCEPT
    reason: ALLO-1 does part of the work of autophagosome assembly at the cargo by recruiting the ULK
      complex and LGG-1. This is direct participation, as for other cargo receptors. The cached 2018 paper
      is abstract-only, but the 2024 full-text follow-up confirms the recruitment role.
    supported_by:
