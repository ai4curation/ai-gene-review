core_functions:
- description: ALLO-1 is a cargo adaptor (autophagy receptor) for allophagy. It is recruited to ubiquitinated
    paternal mitochondria (mainly ALLO-1b) and membranous organelles (mainly ALLO-1a, which binds K48/K63
    polyubiquitin). It links the cargo to LGG-1 through its LIR motif and recruits the ULK complex, so
    that autophagosomes form around the paternal organelles. IKKE-1 phosphorylation of ALLO-1 drives its
    accumulation on the cargo.
  molecular_function:
    id: GO:0160247
    label: autophagy cargo adaptor activity
  directly_involved_in:
