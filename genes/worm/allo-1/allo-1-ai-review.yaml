  label: Caenorhabditis elegans
description: 'ALLO-1 (allophagy-1, R102.5) is a nematode-specific selective autophagy receptor (cargo
  adaptor) that drives allophagy. Allophagy is the autophagic removal of sperm-derived (paternal) mitochondria
  and membranous organelles from the early C. elegans embryo, and it underlies maternal inheritance of
  mitochondrial DNA. ALLO-1 is expressed in the oocyte germline. Within about a minute of fertilization
  it gathers on ubiquitin-modified paternal organelles. Through an N-terminal LC3-interacting region (LIR)
  motif it binds the Atg8/LC3 homolog LGG-1. It is also needed to recruit the ULK complex (UNC-51 and
  EPG-7/FIP200) around the cargo, so that autophagosomes form locally. Two splice isoforms differ in their
  C-termini and prefer different cargo: ALLO-1a mainly targets membranous organelles, and its C-terminal
  coiled-coil region binds K48- and K63-linked polyubiquitin. ALLO-1b mainly targets paternal mitochondria.
  The TBK1/IKKepsilon-family kinase IKKE-1 binds ALLO-1 and phosphorylates it, which is needed for ALLO-1
  to accumulate on the cargo. ALLO-1 and IKKE-1 thus form a positive feedback loop that starts autophagosome
  formation.'
