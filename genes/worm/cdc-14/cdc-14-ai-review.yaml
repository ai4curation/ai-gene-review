  review:
    summary: CDC14-family Ser/Thr (pSer/pThr-Pro) phosphatase activity inherited from yeast, fission yeast
      and human orthologs.
    action: ACCEPT
    reason: CDC14 family members preferentially dephosphorylate CDK-phosphorylated Ser/Thr-Pro sites.
      CeCDC-14 retains the catalytic Cys (C295) required for activity and dephosphorylates histone H1
      (a CDK substrate) in vitro. The proposed in vivo mechanism, promoting a hypophosphorylated CKI-1,
      fits a phospho-Ser/Thr phosphatase. No evidence of loss of activity in the worm.
