id: P81299
gene_symbol: cdc-14
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'cdc-14 encodes the single C. elegans member of the CDC14 family of dual-specificity (Cys-dependent,
  protein-tyrosine-phosphatase-fold) phosphatases, which in other eukaryotes reverse CDK-dependent phosphorylation
  of Ser/Thr-Pro sites. The protein has an N-terminal DSPn domain and a catalytic DSPc domain with an
  essential Cys295; recombinant CDC-14 hydrolyses pNPP and dephosphorylates histone H1 in vitro. Alternative
  splicing of the 3'' exons produces several isoforms that share the phosphatase domain. In vivo, cdc-14
  is not required for mitosis or cytokinesis (null alleles are viable and fertile), but it is needed to
  keep postembryonic precursor cells, such as vulval precursor cells and intestinal and hypodermal cells,
  in developmentally programmed G1 quiescence. It acts upstream of the Cip/Kip inhibitor CKI-1, promoting
  its nuclear accumulation, and in parallel with LIN-35/Rb downstream of cyclin D/CYD-1. The CDC-14C isoform
  is the main form acting in VPCs. Its expression is restricted post-transcriptionally, and it shuttles
  between nucleus and cytoplasm: XPO-1-dependent export and cyclin D activity keep it mostly cytoplasmic
  in cycling cells, and the nuclear pool rises during quiescence. CDC-14 is also seen at the mitotic spindle
  midzone, midbody and centrosomes, but these sites have no confirmed function in vivo.'
