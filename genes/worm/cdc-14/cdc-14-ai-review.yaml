- id: PMID:12213836
  title: The CeCDC-14 phosphatase is required for cytokinesis in the Caenorhabditis elegans embryo.
  findings:
  - statement: Recombinant CeCDC-14 is an active phosphatase that requires catalytic Cys295.
    supporting_text: This phosphatase activity was completely abolished upon mutation of the presumptive
      catalytic cysteine 295 to serine
  - statement: CeCDC-14 localizes to the central spindle and midbody in embryos.
    supporting_text: CeCDC-14 itself localizes to the central spindle in anaphase and to the midbody in
      telophase
  - statement: RNAi-depleted embryos fail cytokinesis (later attributed to off-target RNAi effects).
    supporting_text: We show that CeCDC-14 is required for cytokinesis but may be dispensable for progression
      of the early embryonic cell cycles.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text read. The biochemistry and localization data are sound. The central claim
      that cdc-14 is required for cytokinesis rests on dsRNA injection and was not reproduced with null
      alleles (PMID:15247923, PMID:21723944), so the process claims are disputed.
- id: PMID:15247923
  title: The CDC-14 phosphatase controls developmental cell-cycle arrest in C. elegans.
  findings:
  - statement: cdc-14 is required for developmental quiescence of precursor cells; null mutants have extra
      divisions without mitotic defects.
    supporting_text: inactivation of C. elegans cdc-14 resulted in extra divisions in multiple lineages,
      with no apparent defects in mitosis or cell-fate determination
  - statement: cdc-14 acts upstream of cki-1 to promote nuclear CKI-1 accumulation.
    supporting_text: cdc-14 functions upstream of the cki-1 Cip/Kip inhibitor to promote accumulation
      of CKI-1 in the nucleus
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; title, authors and journal match UniProt RN [1]. Defines the
      core quiescence role.
- id: PMID:15282614
  title: Cell cycle regulation of central spindle assembly.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Abstract only. It concerns Cdk1 phosphorylation of ZEN-4 and does not mention CDC-14;
      the WormBase IDA for phosphoprotein phosphatase activity presumably comes from full-text data we
      cannot see.
- id: PMID:21723944
  title: Control of Cdc14 activity coordinates cell cycle and development in Caenorhabditis elegans.
  findings:
  - statement: A cdc-14 null allele does not cause mitotic defects or enhance zen-4(ts).
    supporting_text: we find no evidence supporting a role for cdc-14 function during mitosis
  - statement: The earlier RNAi cytokinesis phenotype is attributed to off-target effects.
    supporting_text: the lethality arising from defective cytokinesis previously observed following cdc-14(RNAi)
      was due to off-target effects
  - statement: cdc-14 acts in parallel with lin-35 downstream of cyd-1 to restrain G1/S progression.
    supporting_text: These data support a model wherein cyd-1 promotes G1/S progression by inhibiting
      parallel processes requiring cdc-14 and lin-35 activities.
  - statement: CDC-14C is the isoform required for VPC quiescence.
    supporting_text: VPC development appeared to specifically require CDC-14C activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; matches UniProt RN [5]. Resolves the cytokinesis controversy with null
      alleles and characterises isoform-specific regulation and nucleocytoplasmic shuttling.
- id: PMID:15838512
  title: 'Cell-cycle control in Caenorhabditis elegans: how the worm moves from G1 to S.'
  findings:
  - statement: Review placing CDC-14 among G1 regulators that maintain quiescence.
    supporting_text: we recently found that the CDC-14 phosphatase promotes maintenance of the quiescent
      state
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review by the van den Heuvel lab; PubMed-verified. Abstract only.
- id: PMID:15303097
  title: 'Developmental quiescence: Cdc14 moonlighting in G1.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: News and views commentary on PMID:15247923; no abstract available. Cited by PMID:21723944
      for the off-target RNAi explanation.
- id: file:worm/cdc-14/cdc-14-deep-research-manual.md
  title: Manual literature research summary for cdc-14
core_functions:
- description: CDC14-family protein phosphatase that dephosphorylates phospho-Ser/Thr protein substrates
    (the CDK-phosphorylated sites typical of the family), using the catalytic Cys295 of its DSPc domain.
  molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12213836
    supporting_text: This phosphatase activity was completely abolished upon mutation of the presumptive
      catalytic cysteine 295 to serine
  - reference_id: PMID:12213836
    supporting_text: although the recombinant phosphatase readily dephosphorylated histone H1
- description: Maintains developmentally programmed G1 quiescence of postembryonic precursor cells (VPCs,
    intestine, hypodermis). It acts upstream of the CKI-1 Cip/Kip inhibitor to promote nuclear CKI-1 accumulation,
    and in parallel with LIN-35/Rb downstream of cyclin D. The CDC-14C isoform, regulated by nucleocytoplasmic
    shuttling, is the key form in VPCs.
  molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  directly_involved_in:
  - id: GO:1902807
    label: negative regulation of cell cycle G1/S phase transition
  - id: GO:1903452
    label: positive regulation of G1 to G0 transition
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15247923
    supporting_text: cdc-14 functions upstream of the cki-1 Cip/Kip inhibitor to promote accumulation
      of CKI-1 in the nucleus
  - reference_id: PMID:21723944
    supporting_text: These data support a model wherein cyd-1 promotes G1/S progression by inhibiting
      parallel processes requiring cdc-14 and lin-35 activities.
suggested_questions:
- question: Does CDC-14 dephosphorylate CKI-1 directly (for example at CDK sites that control its stability),
    or does it act through another substrate to stabilise nuclear CKI-1?
- question: Why does cdc-14 localize to the spindle midzone and midbody if null mutants show no mitotic
    or cytokinesis defect? Is a mitotic role masked by redundancy with other phosphatases (for example
    PP2A/PP1)?
- question: Do the non-C isoforms (A, D, E, G, H), which can rescue intestinal but not VPC quiescence,
    have distinct substrates or localizations, including nucleolar ones?
- question: Does C. elegans cdc-14 have roles in ciliated sensory neurons, as reported for vertebrate
    CDC14 paralogs, which would bear on the cilium assembly IBA?
suggested_experiments:
- description: In vitro dephosphorylation of CDK-phosphorylated CKI-1 by wild-type versus C295S CDC-14,
    combined with phospho-site mapping of CKI-1 in cdc-14 null larvae.
  hypothesis: CDC-14 directly removes CDK phosphates from CKI-1, stabilising it in the nucleus to enforce
    G1 arrest.
- description: Examine early embryonic cytokinesis and central spindle assembly in cdc-14(he141) or a
    CRISPR full-locus deletion, combined with depletion of other mitotic phosphatases.
  hypothesis: Any mitotic role of CDC-14 is redundant and only becomes visible when parallel phosphatases
    are reduced.
