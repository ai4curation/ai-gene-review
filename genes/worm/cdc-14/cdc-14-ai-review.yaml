- term:
    id: GO:0040038
    label: polar body extrusion after meiotic divisions
  evidence_type: IMP
  original_reference_id: PMID:12213836
  qualifier: involved_in
  review:
    summary: Most RNAi embryos failed polar body extrusion.
    action: REMOVE
    reason: Loss-of-function evidence from two independent groups using genetic null alleles (he118, he141,
      and ok1407) shows that cdc-14 mutants are viable and fertile with no mitotic or cytokinesis defect,
      and he141 does not enhance zen-4(or153ts). Roy et al. attribute the embryonic cytokinesis phenotype
      seen after high-dose dsRNA injection (PMID:12213836) to off-target effects. UniProt records the
      same conflict in a CAUTION note. The RNAi-based process claim is therefore contradicted by stronger
      genetic evidence and should not be propagated. Null mutant hermaphrodites are fertile with viable
      broods, which is inconsistent with a requirement for meiotic polar body extrusion.
    supported_by:
    - *id001
    - *id002
