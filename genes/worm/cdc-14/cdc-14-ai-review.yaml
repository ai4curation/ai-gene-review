  review:
    summary: Inherited from yeast Cdc14 (SGD) and the worm's own contested RNAi annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'PAINT placed this function at a node that includes fungal Cdc14/Clp1, where Cdc14 drives
      mitotic exit and cytokinesis. C. elegans cdc-14 falls inside that clade, but there is target-specific
      evidence that the inherited mitotic role is not detectable in the worm: null alleles cause no mitotic
      or cytokinesis defect. The family-level inference is reasonable for yeasts but is an over-annotation
      for this gene.'
