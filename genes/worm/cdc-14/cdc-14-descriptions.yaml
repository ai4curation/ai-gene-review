gene_symbol: cdc-14
organism: worm
uniprot_id: P81299
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Protein phosphatase that negatively regulates the G1-to-S phase transition
    to inhibit the cell cycle and establish quiescence in cells of multiple lineages
    including vulval, hypodermal and intestinal (PubMed:15247923, PubMed:21723944).
    Promotes nuclear accumulation and activity of the cyclin-dependent kinase inhibitor
    cki-1 which leads to inhibition of G1 progression during vulval tissue development
    (PubMed:15247923). Has been shown to not be required for cytokinesis (PubMed:15247923).
    However, in the embryo, in a contrasting study, has been shown to act as a regulator
    of central spindle formation and cytokinesis, and may be required for localization
    of the spindle component zen-4, and its interacting partner air-2 at the spindle
    during late cell divisions (PubMed:12213836). . [Isoform c]: Main regulator of
    cell cycle arrest in vulval precursor cells.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P81299
  source_id: P81299
- source: Alliance_Imported
  text: cdc-14 encodes a dual-specificity phosphatase, homologous to Cdc14p in S.
    cerevisiae; cdc-14 regulates developmental cell cycle arrest during post-embryonic
    development; in regulating cell cycle arrest, CDC-14 appears to function via regulation
    of CKI-1 levels in the nucleus; CDC-14 is widely expressed and its localization
    is dynamic, localizing to the cytoplasm during the G1 phase of the cell cycle,
    to the centrosomes during prophase, the spindle asters and spindle midzone in
    metaphase and anaphase and to the midbody in late telophase; in post-mitotic cells,
    CDC-14 localizes to the nucleus and nucleolus.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000383;class=Gene
  source_id: WB:WBGene00000383
- source: Alliance_Automated
  text: Enables phosphoprotein phosphatase activity. Involved in several processes,
    including cytoskeleton-dependent cytokinesis; mitotic spindle midzone assembly;
    and regulation of cell cycle process. Located in microtubule cytoskeleton and
    nucleolus. Is active in midbody and mitotic spindle midzone. Human ortholog(s)
    of this gene implicated in autosomal recessive nonsyndromic deafness 32. Orthologous
    to several human genes including CDC14A (cell division cycle 14A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000383;class=Gene
