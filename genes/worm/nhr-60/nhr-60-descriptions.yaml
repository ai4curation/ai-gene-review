taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Orphan nuclear receptor (Potential). Required for embryonic and larval morphogenesis
    and probably for seam cell positioning and migration.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O17898
  source_id: O17898
- source: Alliance_Imported
  text: nhr-60 encodes a nuclear hormone receptor required for seam cell development,
    and for embryonic and early larval viability; NHR-60 has no obvious non-nematode
    orthologs, and is thus classified as 'supplementary'; NHR-60 is expressed throughout
    development in most cells from one-cell embryos to adults, and is noticeably enriched
    in seam cells and germline; NHR-60's germline enrichment suggests that it is maternally
    contributed to oocytes; subcellularly, NHR-60 is localized to the nuclear periphery;
    nhr-60 is transcribed in embryonic seam cell precursors, and in larval seam cells,
    pharyngeal gland cells, and uterine vulval uv1 cells; NHR-23 is required for nhr-60
    transcription in seam cells but not in pharynx; a dominant-negative NHR-60 isoform
    displaces endogeneous NHR-60 from the nuclear periphery.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003650;class=Gene
  source_id: WB:WBGene00003650
- source: Alliance_Automated
  text: Predicted to enable RNA polymerase II cis-regulatory region sequence-specific
    DNA binding activity and nuclear receptor activity. Predicted to be involved in
    cell differentiation and regulation of transcription by RNA polymerase II. Located
    in nuclear envelope. Is expressed in several structures, including VC neuron;
    pharyngeal gland cell; ray; seam cell; and uv1. Human ortholog(s) of this gene
    implicated in liver cirrhosis; lung non-small cell carcinoma; and pancreatic cancer.
    Orthologous to human RXRA (retinoid X receptor alpha); RXRB (retinoid X receptor
    beta); and RXRG (retinoid X receptor gamma).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003650;class=Gene
  source_id: WB:WBGene00003650
