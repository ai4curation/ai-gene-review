    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Detailed and correct: supplementary NHR without non-nematode orthologs,
      seam cell and viability roles, nuclear periphery, NHR-23-dependent seam expression,
      dominant-negative isoform.'
- source: Alliance_Automated
  text: Predicted to enable RNA polymerase II cis-regulatory region sequence-specific
    DNA binding activity and nuclear receptor activity. Predicted to be involved in
    cell differentiation and regulation of transcription by RNA polymerase II. Located
    in nuclear envelope. Is expressed in several structures, including VC neuron;
    pharyngeal gland cell; ray; seam cell; and uv1. Human ortholog(s) of this gene
    implicated in liver cirrhosis; lung non-small cell carcinoma; and pancreatic cancer.
    Orthologous to human RXRA (retinoid X receptor alpha); RXRB (retinoid X receptor
    beta); and RXRG (retinoid X receptor gamma).
  source_type: automated
