  - *id001
  - *id003
  - *id005
suggested_questions:
- question: Does the nuclear-periphery pattern of NHR-60 reflect association with the nuclear envelope/lamina
    itself or with peripheral chromatin, and would GO:0034399 nuclear periphery describe it better than
    GO:0005635 nuclear envelope?
- question: Does NHR-60 bind DNA as a homodimer or heterodimer (e.g. with other supnrs), and does it recognise
    HNF4-like DR1 elements?
- question: Is the GEI-8 interaction ligand-regulated, and does GEI-8 mediate repression of NHR-60 target
    genes in seam cells?
suggested_experiments:
- description: ChIP-seq or DamID of endogenously tagged NHR-60 combined with RNA-seq after nhr-60 RNAi
    in staged embryos, to identify direct targets and binding motifs (especially in seam cells).
- description: Electrophoretic mobility shift or SELEX with the purified NHR-60 DBD to determine its DNA-binding
    specificity.
- description: Co-immunoprecipitation of NHR-60 with GEI-8 in vivo and reporter assays testing whether
    GEI-8 represses NHR-60-dependent transcription.
