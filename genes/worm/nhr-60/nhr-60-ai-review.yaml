- term:
    id: GO:0001222
    label: transcription corepressor binding
  evidence_type: IPI
  original_reference_id: PMID:23484030
  qualifier: enables
  review:
    action: NEW
    summary: GST-NHR-60 pulls down the in vitro translated C-terminal domain I of GEI-8, the C. elegans
      NCoR/SMRT corepressor homologue, which contains its predicted NR1 (CoRNR box) binding site; GST
      alone does not.
    reason: Direct physical-interaction evidence for NHR-60 that is not in GOA. Binding of a nuclear receptor
      to an NCoR/SMRT-type corepressor via the NR-binding motif is the canonical corepressor-recruitment
      interaction, and GEI-8 is the putative C. elegans corepressor. The evidence is a single in vitro
      pull-down (one of two concordant experiments, supplementary figure) with no functional repression
      assay, so it is proposed as a non-core molecular function.
    supported_by:
    - reference_id: PMID:23484030
      supporting_text: the C-terminal region I of GEI-8 that includes the predicted NR1 binding site showed
        affinity to GST-NHR-60 but not to the control protein expressing the GST anchor used for pull-down
        experiments (Figure S1).
    - reference_id: PMID:23484030
      supporting_text: GST-NHR-60 binds in vitro translated domain I of GEI-8 (lane 4 in panel A and the
        corresponding bar in panel B) supporting the functional similarity between GEI-8 C-terminal region
        and NCoR/SMRT.
