core_functions:
- description: Orphan nuclear-receptor transcription factor that, by homology to the HNF4 lineage, binds
    RNA polymerase II cis-regulatory DNA through its C4 zinc-finger DNA-binding domain and regulates transcription
    in the nucleus; the ligand, response elements and targets are unknown.
  molecular_function:
    id: GO:0004879
    label: nuclear receptor activity
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
