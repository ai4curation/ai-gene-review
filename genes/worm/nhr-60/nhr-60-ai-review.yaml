gene_symbol: nhr-60
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'nhr-60 (F57A10.5) encodes a 443-residue supplementary nuclear receptor (supnr) of Caenorhabditis
  elegans, one of the nematode-specific nuclear hormone receptors that arose by explosive duplication
  of an ancestral HNF4-like orphan receptor. It has the canonical nuclear-receptor architecture: an HNF4-like
  DNA-binding domain built from two C4-type zinc fingers and a C-terminal ligand-binding domain, and by
  homology it is a nuclear-receptor transcription factor that binds RNA polymerase II cis-regulatory DNA
  and regulates transcription; no ligand, response element or target gene has been identified. NHR-60
  is expressed ubiquitously from the one-cell embryo onwards and localizes to nuclei with a distinctive
  enrichment at the nuclear periphery; it accumulates strongly in seam cell nuclei in an NHR-23-dependent
  manner and is also prominent in the L1 germ line, pharyngeal gland cells, VC4/VC5 neurons and uv1 cells.
  RNAi or a dominant-negative isoform causes embryonic arrest at the two-fold stage with ventral-closure
  and elongation defects, early larval lethality and absent or misplaced seam cells. In vitro, NHR-60
  binds the nuclear-receptor-interaction region of GEI-8, the C. elegans homologue of the NCoR/SMRT corepressors.'
