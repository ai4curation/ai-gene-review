  review:
    action: ACCEPT
    summary: Sequence-specific binding to RNA polymerase II cis-regulatory DNA is the diagnostic activity
      of the nuclear-receptor DNA-binding domain (two C4 zinc fingers, residues 44-121) that NHR-60 carries.
    reason: NHR-60 sits inside the PANTHER nuclear-receptor clade whose node (PTN000638895) is seeded
      by many experimentally characterised NR2-class receptors, including HNF4A (P41235) and C. elegans
      receptors. The DBD is intact (both C4 zinc fingers annotated by PROSITE PRU00407), so there is no
      sign of loss of DNA binding. No NHR-60 response element has been mapped, so this rests on homology,
      but it is the expected core molecular activity.
    supported_by:
