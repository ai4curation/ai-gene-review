  evidence_type: IMP
  original_reference_id: PMID:16857685
  qualifier: involved_in
  review:
    summary: >-
      cpi-2a loss reduces yolk protein accumulation in mature oocytes.
    action: ACCEPT
    reason: >-
      Correct native oocyte/yolk process. Hashmi et al. found that yolk
      proteins or YP170::GFP were absent or reduced in mature cpi-2a mutant
      oocytes, consistent with a positive effect on yolk accumulation through
      CPI-2-dependent protease regulation.
    supported_by:
    - reference_id: PMID:16857685
      supporting_text: >-
        green fluorescent protein expression was absence or reduced in
        cpi-2a/yp170:gfp mutant oocytes
