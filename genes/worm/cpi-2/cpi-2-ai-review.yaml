  qualifier: involved_in
  review:
    summary: >-
      cpi-2a deletion causes oogenesis and fertilization defects.
    action: ACCEPT
    reason: >-
      Correct organismal role. Hashmi et al. characterized a sterile
      cpi-2a(ok1256) deletion mutant and linked CPI-2 loss to abnormal yolk
      protein uptake or processing during oocyte development. The process term
      captures the native reproductive context of CPI-2-dependent protease
      regulation.
    supported_by:
    - reference_id: PMID:16857685
      supporting_text: >-
        In the present study, we characterized a sterile cpi-2a(ok1256)
        deletion mutant in Caenorhabditis elegans and showed that CPI-2a has
        an essential regulatory role during oogenesis and fertilization.
- term:
    id: GO:0070613
    label: regulation of protein processing
  evidence_type: IMP
  original_reference_id: PMID:16857685
  qualifier: involved_in
  review:
    summary: >-
      cpi-2a loss perturbs uptake or processing of yolk proteins.
    action: ACCEPT
    reason: >-
      Correct core biological process. CPI-2 is a cysteine-protease inhibitor,
      CPL-1 and CPZ-1 colocalize with it in sheath cells and yolk granules, and
      loss of cpi-2a disrupts mature-oocyte yolk protein accumulation. The
      evidence supports a direct regulatory role in proteolytic yolk-protein
      processing rather than a distant phenotypic consequence.
    supported_by:
    - reference_id: PMID:16857685
      supporting_text: >-
        defects in the uptake and/or processing of yolk proteins by the growing
        oocytes
- term:
