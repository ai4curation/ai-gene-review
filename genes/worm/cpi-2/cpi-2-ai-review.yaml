id: G5ECM9
gene_symbol: cpi-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  cpi-2 encodes a secretory cystatin-family cysteine protease inhibitor, also
  called Ce-CPI-2a/Cysele2. Recombinant CPI-2 inhibits papain-like cysteine
  proteases such as cathepsins B, L and S, but lacks the legumain/asparaginyl
  endopeptidase inhibitory site found in Brugia malayi CPI-2. In C. elegans,
  CPI-2 localizes to the myoepithelial sheath around germ cells and oocytes and
  to yolk granules within oocytes, where it helps regulate yolk-protein uptake
  or processing during oogenesis and fertilization.
