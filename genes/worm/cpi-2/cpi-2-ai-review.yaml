suggested_questions:
- question: >-
    Which endogenous cysteine protease substrates fail to be processed in
    cpi-2a(ok1256) oocytes, and are CPL-1 and CPZ-1 the direct regulated
    proteases in yolk granules?
  experts:
  - C. elegans reproductive biology experts
  - nematode cystatin experts
- question: >-
    What is the native function of the secreted or extracellular CPI-2 pool
    outside oocyte yolk granules?
  experts:
  - C. elegans gonad-cell biology experts
suggested_experiments:
- description: >-
    Perform rescue of cpi-2a(ok1256) sterility with CPI-2 variants lacking the
    N-terminal reactive-site motif or the secondary cystatin contact motif to
    test whether cysteine-protease inhibition in yolk granules is required for
    oogenesis.
- description: >-
    Co-image CPI-2, CPL-1, CPZ-1 and yolk proteins in live oocytes with
    compartment markers and protease-activity reporters to separate the sheath,
    extracellular and yolk-granule pools that contribute to yolk uptake or
    processing.
