- source: Alliance_Automated
  text: Enables protein-folding chaperone binding activity. Involved in several processes,
    including chemical synaptic transmission; positive regulation of anterior/posterior
    axon guidance; and ventral cord development. Located in several cellular components,
    including basolateral plasma membrane; dendrite; and perikaryon. Is expressed
    in several structures, including excretory gland cell; hermaphrodite gonad; intestine;
    muscle cell; and nervous system. Human ortholog(s) of this gene implicated in
    several diseases, including Creutzfeldt-Jakob disease; Hirschsprung's disease;
    autosomal recessive nonsyndromic deafness 123; congenital diarrhea; and generalized
    epilepsy with febrile seizures plus 9. Orthologous to several human genes including
    STX1A (syntaxin 1A) and STX1B (syntaxin 1B).
