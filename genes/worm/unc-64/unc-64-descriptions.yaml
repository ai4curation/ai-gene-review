gene_symbol: unc-64
organism: worm
uniprot_id: O16000
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a critical role in several secretory processes, including cuticle secretion
    and neurotransmitter release, and probably assists in neuronal membrane maturation
    or the final stages of neuronal differentiation (PubMed:1945043, PubMed:9442061).
    Plays a role in synaptic vesicle docking and tethering through its association
    with unc-18 (PubMed:21423527). Through binding to unc-18 mediates the release
    of the neurotransmitter acetylcholine from cholinergic motor neurons, and thereby
    promotes locomotory behaviors (PubMed:18596236). Essential for embryonic viability
    and development. Has a role in dauer formation and adult life span (PubMed:10377425).
    Required for locomotion (PubMed:10377425). Probably by regulating neuronal transmission
    downstream of lin-3 and receptor lin-23 and phospholipase plc-3 and upstream of
    innexin unc-7 and egl-4/PKG in ALA neurons, involved in the decrease in pharyngeal
    pumping during the quiescent state that precedes each larval molt (PubMed:17891142).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16000
  source_id: O16000
- source: Alliance_Imported
  text: unc-64 encodes syntaxin, a plasma membrane receptor for intracellular vesicles
    that is orthologous to vertebrate syntaxin 1A (OMIM:186590) and Drosophila Syx1A;
    UNC-64 is required for normal locomotion and possibly also for insulin secretion;
    as an essential component of the core synaptic vesicle fusion machinery, UNC-64
    interacts with UNC-13, a diacylglycerol-binding protein, and SNB-1/synaptobrevin;
    UNC-64 trafficking from the endoplasmic reticulum to the plasma membrane is mediated
    by UNC-18, an SM (Sec1, Munc18) family member; unc-64 mutations can be suppressed
    by mutations in slo-1, a calcium-activated potassium channel; UNC-64 is expressed
    ubiquitously in the nervous system and in secretory cells such as the vulval uv1
    cell and the excretory gland cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006798;class=Gene
  source_id: WB:WBGene00006798
- source: Alliance_Automated
  text: Enables protein-folding chaperone binding activity. Involved in several processes,
    including chemical synaptic transmission; positive regulation of anterior/posterior
    axon guidance; and ventral cord development. Located in several cellular components,
    including basolateral plasma membrane; dendrite; and perikaryon. Is expressed
    in several structures, including excretory gland cell; hermaphrodite gonad; intestine;
    muscle cell; and nervous system. Human ortholog(s) of this gene implicated in
    several diseases, including Creutzfeldt-Jakob disease; Hirschsprung's disease;
    autosomal recessive nonsyndromic deafness 123; congenital diarrhea; and generalized
    epilepsy with febrile seizures plus 9. Orthologous to several human genes including
    STX1A (syntaxin 1A) and STX1B (syntaxin 1B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006798;class=Gene
  source_id: WB:WBGene00006798
