- source: Alliance_Imported
  text: unc-64 encodes syntaxin, a plasma membrane receptor for intracellular vesicles
    that is orthologous to vertebrate syntaxin 1A (OMIM:186590) and Drosophila Syx1A;
    UNC-64 is required for normal locomotion and possibly also for insulin secretion;
    as an essential component of the core synaptic vesicle fusion machinery, UNC-64
    interacts with UNC-13, a diacylglycerol-binding protein, and SNB-1/synaptobrevin;
    UNC-64 trafficking from the endoplasmic reticulum to the plasma membrane is mediated
    by UNC-18, an SM (Sec1, Munc18) family member; unc-64 mutations can be suppressed
    by mutations in slo-1, a calcium-activated potassium channel; UNC-64 is expressed
    ubiquitously in the nervous system and in secretory cells such as the vulval uv1
    cell and the excretory gland cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006798;class=Gene
