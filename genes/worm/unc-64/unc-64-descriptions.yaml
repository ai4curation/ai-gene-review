descriptions:
- source: UniProt
  text: Plays a critical role in several secretory processes, including cuticle secretion
    and neurotransmitter release, and probably assists in neuronal membrane maturation
    or the final stages of neuronal differentiation (PubMed:1945043, PubMed:9442061).
    Plays a role in synaptic vesicle docking and tethering through its association
    with unc-18 (PubMed:21423527). Through binding to unc-18 mediates the release
    of the neurotransmitter acetylcholine from cholinergic motor neurons, and thereby
    promotes locomotory behaviors (PubMed:18596236). Essential for embryonic viability
    and development. Has a role in dauer formation and adult life span (PubMed:10377425).
    Required for locomotion (PubMed:10377425). Probably by regulating neuronal transmission
    downstream of lin-3 and receptor lin-23 and phospholipase plc-3 and upstream of
    innexin unc-7 and egl-4/PKG in ALA neurons, involved in the decrease in pharyngeal
    pumping during the quiescent state that precedes each larval molt (PubMed:17891142).
