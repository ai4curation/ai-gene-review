- id: PMID:10377425
  title: Neurosecretory control of aging in Caenorhabditis elegans.
  findings:
  - statement: unc-64 mutants are dauer-constitutive and long-lived, suppressed by daf-16, placing 
      unc-64 in the daf-2/age-1 pathway.
    supporting_text: These data place unc-64 and unc-31 in the genetic pathway of the daf-2 and 
      age-1 genes.
  - statement: unc-64 acts in neurons, interpreted as Ca2+-regulated secretion of an insulin-like 
      DAF-2 ligand rather than a general synaptic defect.
    supporting_text: The simplest model for unc-64 and unc-31 function in regulating life span and 
      dauer formation is that they are involved in the Ca 2+ -regulated secretion of an insulin-like
      ligand for the DAF-2 receptor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Genetic epistasis only; the secretion-of-ligand model is the 
      authors' interpretation.
- id: PMID:12973353
  title: Defects in synaptic vesicle docking in unc-18 mutants.
  findings:
  - statement: Immunogold EM places syntaxin on the axonal plasma membrane.
    supporting_text: immunogold labeling of syntaxin on ultra-thin sections showed that syntaxin is 
      associated with axonal plasma membranes in both wild-type and unc-18 mutant
  - statement: Constitutively open UNC-64 supports wild-type release and bypasses UNC-13/RIM priming
      but still requires the other SNAREs and calcium.
    supporting_text: Neurotransmitter release via open syntaxin requires the normal presynaptic 
      machinery, such as other SNARE proteins and calcium, but open syntaxin bypasses the 
      requirement of proteins that function in vesicle priming, such as UNC-13 and Rim
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; unc-18 paper that also assays syntaxin localisation and the 
      open-syntaxin bypass.
- id: PMID:18596236
  title: UNC-18 promotes both the anterograde trafficking and synaptic function of syntaxin.
  findings:
  - statement: In wild type UNC-64 is bright in neuronal processes and dim in cell bodies; in unc-18
      mutants it is retained in the ER of the perikaryon.
    supporting_text: In wild-type animals, bright uniform anti-UNC-64 immunostaining was observed in
      all neuronal processes, with a small number of dimly stained neuronal cell bodies.
  - statement: UNC-18 chaperones UNC-64 out of the ER; loss of UNC-18 reduces axonal syntaxin.
    supporting_text: Together, these studies indicate that UNC-64 accumulates in the ER in unc-18 
      mutants, resulting in decreased anterograde trafficking of UNC-64 to axons.
  - statement: UNC-18 binding to the syntaxin N-peptide is required for release and locomotion.
    supporting_text: UNC-18 binding to the N terminus of Syntaxin was required for normal locomotion
      behavior and neurotransmitter release.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
