    summary: UNC-64 is the plasma-membrane Qa-SNARE whose helix, zippering with SNB-1 and RIC-4, 
      performs the fusion of synaptic vesicles at the active zone; H3-domain hypomorphs alter 
      transmitter-release kinetics and interact allele-specifically with snb-1 SNARE-domain lesions 
      (PMID:9614171), and open UNC-64 restores wild-type release in the null while still requiring 
      the other SNAREs and Ca2+ (PMID:12973353).
