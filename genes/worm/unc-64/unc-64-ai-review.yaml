  review:
    summary: unc-64(e246) is dauer-constitutive and long-lived, suppressed by daf-16, placing it 
      genetically in the daf-2/age-1 pathway; the authors propose it mediates neuronal secretion of 
      an insulin-like DAF-2 ligand (PMID:10377425).
    action: MODIFY
    reason: UNC-64 acts upstream of the receptor (ligand release), not as a component of the 
      intracellular signalling cascade that GO:0008286 describes. Loss of unc-64 phenocopies reduced
      DAF-2 signalling, so a positive-regulation term captures the epistasis.
