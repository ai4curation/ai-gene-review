      either a secretory or neuronal character, including the intestine, spermatheca, excretory 
      gland cells, distal tip cells, and uv1 cells.
suggested_questions:
- question: Which UNC-64 isoform (A, B or C anchor) supports dense-core-vesicle release in 
    non-neuronal secretory tissues, and is the dauer/lifespan phenotype attributable to a specific 
    neuronal DCV pool?
- question: Is UNC-64 present on the basolateral membrane of intestinal cells, as the GOA IDA row 
    implies, or distributed over the whole intestinal plasma membrane?
suggested_experiments:
- description: Tissue-specific degradation (AID) of UNC-64 in intestine versus neurons combined with
    insulin-like-peptide reporter release assays.
  hypothesis: The Daf-c and lifespan phenotypes reflect loss of neuronal DCV exocytosis of DAF-2 
    ligands rather than loss of synaptic transmission.
