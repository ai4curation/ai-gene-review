id: O16000
gene_symbol: unc-64
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  UNC-64 is the Caenorhabditis elegans syntaxin-1 orthologue, a single-pass type IV membrane
  protein anchored in the neuronal plasma membrane that contributes the Qa helix of the
  synaptic SNARE complex (with RIC-4/SNAP-25 and SNB-1/synaptobrevin). Zippering of this
  four-helix bundle, triggered by Ca2+ through SNT-1 and clamped by CPX-1, fuses synaptic
  vesicles with the presynaptic membrane and releases acetylcholine, GABA and other transmitters;
  null mutants are paralysed L1 larvae and hypomorphs are uncoordinated and aldicarb-resistant.
  UNC-64 is held in a closed conformation by the SM protein UNC-18, which also chaperones its
  exit from the ER; a constitutively open form bypasses the priming factors UNC-13 and UNC-10/RIM.
  The protein is distributed uniformly along axons, dendrites and cell bodies rather than
  concentrated at release sites, and is transported anterogradely by the UNC-76/FEZ1-UNC-116
  kinesin complex. Alternative C-terminal anchors give neuronal and non-neuronal isoforms; the
  protein is also expressed in secretory tissues (intestine, spermatheca, uv1, excretory gland,
  distal tip cells) and mediates the Ca2+-regulated release of dense-core-vesicle cargo,
  including a neuronal insulin-like signal that controls dauer entry and adult lifespan through
  DAF-2/DAF-16.
