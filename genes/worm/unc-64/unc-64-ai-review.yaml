  review:
    summary: UNC-64 pairs with the other synaptic SNAREs (RIC-4/SNAP-25 and SNB-1/synaptobrevin) 
      through its H3 SNARE helix; allele-specific genetic interactions between unc-64 and snb-1 
      SNARE-domain lesions provide in vivo evidence for the interaction (PMID:9614171).
    action: ACCEPT
    reason: The PAINT node PTN000461349 places SNARE binding at the syntaxin family level, which is 
      sound; UNC-64 is a canonical Qa-SNARE and its H3 domain mediates SNAP-25/synaptobrevin 
      binding. The more informative activity is GO:0005484, which is also annotated.
    supported_by:
    - reference_id: PMID:9614171
      supporting_text: The lesions in the hypomorphic alleles map to the hydrophobic face of the H3 
        coiled-coil domain of syntaxin, a domain that in vitro mediates physical interactions with 
        similar coiled-coil domains in SNAP-25 and synaptobrevin.
