- id: PMID:9614171
  title: The Caenorhabditis elegans unc-64 locus encodes a syntaxin that interacts genetically with 
    synaptobrevin.
  findings:
  - statement: unc-64 encodes the C. elegans syntaxin-1 orthologue; three transcripts differ only in
      the C-terminal membrane anchor.
    supporting_text: unc-64 expresses three transcripts, each encoding a molecule with 63–64% 
      identity to human syntaxin 1A, a membrane- anchored protein involved in synaptic vesicle 
      fusion.
  - statement: Null mutants complete embryogenesis but arrest as paralysed L1 larvae; cuticle 
      secretion and muscle function do not require unc-64.
    supporting_text: A complete loss-of-function mutation in unc-64 results in a worm that completes
      embryogenesis, but arrests development shortly thereafter as a paralyzed L1 larva, presumably 
      as a consequence of neuronal dysfunction.
  - statement: Hypomorphic lesions map to the H3 SNARE helix and interact allele-specifically with 
      synaptobrevin SNARE-domain mutants, in vivo evidence for SNARE-bundle-mediated fusion.
    supporting_text: the unc-64 syntaxin mutants exhibit allele-specific genetic interactions with 
      mutants carrying lesions in the coiled-coil domain of synaptobrevin, providing in vivo 
      evidence for the significance of these domains in regulating synaptic vesicle fusion
  - statement: Syntaxin is uniformly distributed over neuronal cell bodies, axons and dendrites and 
      is not concentrated at release sites.
    supporting_text: In neurons, syntaxin A and C were found ubiquitously on neuronal cell bodies, 
      axons, and dendrites.
  - statement: Expression in non-neuronal secretory tissues (intestine, spermatheca, uv1 cells).
    supporting_text: Immunoreactivity was strong in the uv1 cells of the vulva, in the intestine 
      (Figure 2 C), and in the spermatheca (Figure 2 D).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary cloning and expression paper for unc-64. It does not 
      show a basolateral-restricted pool in the intestine, only an inferred secretory role.
- id: file:worm/unc-64/unc-64-deep-research-falcon.md
  title: Deep research report for unc-64 (falcon / Edison Scientific Literature)
  findings:
  - statement: UNC-64 contributes one helix of the neuronal SNARE four-helix bundle with SNB-1 and 
      RIC-4; assembly provides the mechanical energy for fusion.
    supporting_text: UNC-64 supplies one helix to the neuronal SNARE complex; vesicular 
      SNB-1/synaptobrevin supplies one, and plasma-membrane RIC-4/SNAP-25 supplies two. Their 
      progressive assembly into a tightly wound four-helix bundle brings the vesicle and plasma 
      membranes together and provides mechanical energy for membrane fusion.
  - statement: Open UNC-64 rescues the docking defect of unc-13 mutants; UNC-13 opens syntaxin at 
      the active zone.
    supporting_text: Constitutively open syntaxin fully rescued the docking defect of *unc-13* 
      mutants, whereas excess wild-type syntaxin did not.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: LLM literature synthesis; used only where the cited primary papers (Saifee 1998, 
      Hammarlund 2007, Weimer 2003) are known to support the statement.
