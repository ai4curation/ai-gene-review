gene_symbol: pdr-1
organism: worm
uniprot_id: Q9XUS3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions within a multiprotein E3 ubiquitin ligase complex, catalyzing the
    covalent attachment of ubiquitin moieties onto substrate proteins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XUS3
  source_id: Q9XUS3
- source: Alliance_Imported
  text: pdr-1 encodes an ortholog of human parkin (PARK2).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003967;class=Gene
  source_id: WB:WBGene00003967
- source: Alliance_Automated
  text: Enables ubiquitin conjugating enzyme binding activity and ubiquitin protein
    ligase activity. Involved in several processes, including determination of adult
    lifespan; negative regulation of engulfment of apoptotic cell; and protein autoubiquitination.
    Located in mitochondrial outer membrane and neuronal cell body. Part of ubiquitin
    ligase complex. Is expressed in muscle cell and neurons. Used to study Parkinson's
    disease. Human ortholog(s) of this gene implicated in Parkinson's disease; Parkinson's
    disease 2; lung cancer; and ovarian cancer. Orthologous to human PRKN (parkin
    RBR E3 ubiquitin protein ligase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003967;class=Gene
  source_id: WB:WBGene00003967
- source: RefSeq
  text: Enables ubiquitin conjugating enzyme binding activity. Contributes to ubiquitin-protein
    transferase activity. Involved in several processes, including determination of
    adult lifespan; negative regulation of engulfment of apoptotic cell; and protein
    autoubiquitination. Located in mitochondrial outer membrane and neuronal cell
    body. Part of ubiquitin ligase complex. Is expressed in muscle cell and neurons.
    Used to study Parkinson's disease. Human ortholog(s) of this gene implicated in
    Parkinson's disease; Parkinson's disease 2; lung cancer; and ovarian cancer. Orthologous
    to human PRKN (parkin RBR E3 ubiquitin protein ligase). [provided by Alliance
    of Genome Resources, Jul 2025]
  source_type: automated
