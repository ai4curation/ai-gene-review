descriptions:
- source: UniProt
  text: Transcriptional activator that binds to the consensus sequence 5'-[AT]GATA[AG]-3'
    (PubMed:15733671, PubMed:18003741, PubMed:18024960, PubMed:18448117, PubMed:26016853,
    PubMed:26700680, PubMed:26963674, PubMed:7782329). Predominantly directs the transcription
    of intestinal genes such as ges-1, cpr-6, pho-1, ftn-1, vit-2 and lev-11, and
    itself (PubMed:10518545, PubMed:15733671, PubMed:18448117, PubMed:19111532, PubMed:26700680,
    PubMed:26963674, PubMed:9659934). Required for gut-specific differentiation, specifically
    acting with the GATA region-binding transcription factor elt-7 to control normal
    gene expression and promote normal formation of the intestine (PubMed:20807527).
    Regulates intestinal gene expression in response to hypoxia to promote longevity
    (PubMed:25284791). Modulation of longevity may, in part, be the result of regulation
    of expression of daf-16 isoforms d and f in the intestine (PubMed:24834345). Regulates
    tissue specific gene expression at basal levels and in response to bacterial infection
    in the intestine to control innate immunity (PubMed:16968778, PubMed:21168435,
    PubMed:25340560, PubMed:26016853). Plays a role in the induction of metal-responsive
    genes, activating gene expression from zinc-activated promoters and iron-dependent
    promoters and enhancers (PubMed:18024960, PubMed:22194696, PubMed:25552416). May
    regulate the expression of genes that control sensitivity to oxidative stress,
    in a mab-3-dependent manner, and osmotic stress, in conjunction with the GATA
    region-binding transcription factor elt-3 (PubMed:17901115, PubMed:20126308, PubMed:20498281).
    May play a role in sphingolipid signaling by regulating the expression of the
    sphingosine-1-phosphate degrading enzyme, sphingosine-1-phosphate lyase (PubMed:15734735).
    May act with the Notch signaling pathway to promote endodermal gene expression
    (PubMed:18003741). Has a protective role in response to infection by Gram-negative
    bacteria such as S.enterica, E.coli, P.aeruginosa and B.pseudomallei, Gram-positive
    bacterium E.faecalis and fungal pathogen C.neoformans (PubMed:16968778, PubMed:17183709,
    PubMed:21168435, PubMed:23980181, PubMed:30265660). An association with the 26S
    proteasome regulatory subunit rpt-6, in part, controls gene expression in response
    to infection by P.aeruginosa (PubMed:30265660). Regulates gene expression during
    the recovery phase following a bacterial infection (PubMed:25340560, PubMed:30265660).
    May act with p38- activated transcription factors to control p38 gene induction
    in response to bacterial infection (PubMed:22967128, PubMed:26016853). Controls
    lysosome formation in the intestine by controlling lysosomal gene expression (PubMed:26828939).
