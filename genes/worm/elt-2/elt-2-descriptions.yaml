- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific;
    RNA polymerase II cis-regulatory region sequence-specific DNA binding activity;
    and enzyme inhibitor activity. Involved in several processes, including defense
    response to Gram-negative bacterium; determination of adult lifespan; and positive
    regulation of transcription by RNA polymerase II. Located in nucleus. Is expressed
    in several structures, including Ea; Eal; anal region; head neurons; and intestine.
    Human ortholog(s) of this gene implicated in artery disease (multiple); atrial
    fibrillation (multiple); congenital heart disease (multiple); and dilated cardiomyopathy.
    Orthologous to human GATA5 (GATA binding protein 5).
