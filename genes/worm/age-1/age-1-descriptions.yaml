descriptions:
- source: UniProt
  text: Phosphatidylinositol 3-kinase homolog that regulates longevity and diapause
    (PubMed:21750263, PubMed:8700226). Promotes cell survival during embryonic development
    by recruiting akt-1/2 to the plasma membrane through the production of PtdIns(3,4,5)P3
    (PubMed:25383666). Could function in the development or neuroendocrine signaling
    of the dauer pathway (PubMed:8700226). Mediates susceptibility to enteropathogenic
    E.coli infection (PubMed:16091039). May negatively regulate AYI interneuron neurite
    outgrowth (PubMed:22069193). Plays a role in aversive olfactory learning when
    an odor is associated with food deprivation (PubMed:27383131). Regulates this
    process by promoting the nuclear relocalization of egl-4 in AWC olfactory neurons
    after odor conditioning (PubMed:27383131).
