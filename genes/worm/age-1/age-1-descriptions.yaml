- source: Alliance_Automated
  text: Predicted to enable 1-phosphatidylinositol-3-kinase activity and 1-phosphatidylinositol-4-phosphate
    3-kinase activity. Involved in several processes, including dauer entry; determination
    of adult lifespan; and regulation of synaptic assembly at neuromuscular junction.
    Located in cytoplasm and non-motile cilium. Part of phosphatidylinositol 3-kinase
    complex. Is expressed in anchor cell; hypodermis; intestine; nervous system; and
    pharyngeal-intestinal valve. Human ortholog(s) of this gene implicated in several
    diseases, including CLOVES syndrome; Cowden syndrome 5; autistic disorder; disease
    of cellular proliferation (multiple); and epidermal nevus. Orthologous to several
    human genes including PIK3CA (phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic
    subunit alpha).
