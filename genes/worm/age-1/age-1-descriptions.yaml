- source: Alliance_Imported
  text: age-1 encodes the C. elegans ortholog of the phosphoinositide 3-kinase (PI3K)
    p110 catalytic subunit; AGE-1, supplied maternally and embryonically, is a central
    component of the C. elegans insulin-like signaling pathway, lying downstream of
    the DAF-2/insulin receptor and upstream of both the PDK-1 and AKT-1/AKT-2 kinases
    and the DAF-16 forkhead type transcription factor, whose negative regulation is
    the key output of the insulin signaling pathway; in accordance with its role in
    insulin signaling, AGE-1 activity is required for regulation of metabolism, life
    span, dauer formation, stress resistance, salt chemotaxis learning, fertility,
    and embryonic development; although the age-1 expression pattern has not yet been
    reported, ectopic expression studies indicate that pan-neuronal age-1 expression
    is sufficient to rescue life-span defects, while neuronal, intestinal, or muscle
    expression can partially rescue dauer formation, and neuronal or muscle expression
    can rescue metabolic defects.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000090;class=Gene
