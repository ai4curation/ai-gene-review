suggested_questions:
- question: >-
    Does AGE-1 bind AAP-1 constitutively in all tissues, and does AGE-1 retain partial activity
    without AAP-1 (aap-1 mutants have weak phenotypes)?
- question: >-
    Is there a functionally relevant ciliary pool of AGE-1 in amphid sensory neurons?
suggested_experiments:
- description: >-
    In vitro lipid kinase assays of recombinant AGE-1/AAP-1 with PI, PI4P and PI(4,5)P2 substrates
    to establish substrate preference directly for the nematode enzyme.
  hypothesis: AGE-1 prefers PI(4,5)P2 like mammalian class IA p110 enzymes.
