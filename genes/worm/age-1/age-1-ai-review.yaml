id: Q94125
gene_symbol: age-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  AGE-1 is the catalytic p110 subunit of the single class I phosphatidylinositol 3-kinase
  (PI3K) of Caenorhabditis elegans. It partners with the p50/p55-like adaptor subunit AAP-1
  and, downstream of the insulin/IGF-1-like receptor DAF-2, phosphorylates phosphatidylinositol
  4,5-bisphosphate to generate PIP3 at the inner leaflet of the plasma membrane. PIP3 recruits
  and activates PDK-1 and the AKT-1/AKT-2/SGK-1 kinases, which phosphorylate and exclude the
  FOXO transcription factor DAF-16 from the nucleus; the PTEN homolog DAF-18 opposes AGE-1
  by removing the 3-phosphate. AGE-1 is found diffusely in the cytoplasm of most cells. Loss
  of maternal and zygotic age-1 causes constitutive dauer arrest, while partial loss greatly
  extends adult lifespan and increases stress resistance, effects that require daf-16. AGE-1
  signalling also contributes to fertility, embryonic cell survival, and experience-dependent
  salt chemotaxis in sensory neurons.
