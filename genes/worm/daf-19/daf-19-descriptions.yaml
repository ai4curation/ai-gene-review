- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in defense response to Gram-negative bacterium and
    positive regulation of transcription by RNA polymerase II. Acts upstream of or
    within serotonin biosynthetic process. Located in nucleus. Is expressed in several
    structures, including body wall musculature; hypodermis; intestine; neurons; and
    somatic nervous system. Orthologous to several human genes including RFX1 (regulatory
    factor X1) and RFX2 (regulatory factor X2).
