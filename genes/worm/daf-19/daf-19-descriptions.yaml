gene_symbol: daf-19
organism: worm
uniprot_id: Q09555
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Probable transcription factor (PubMed:10882127, PubMed:12954713). May regulate
    some genes of ciliated sensory neurons (PubMed:10882127, PubMed:12954713). May
    activate the expression of the shared components of sensory cilia, but not the
    cell-type-specific expression (PubMed:10882127, PubMed:12954713). Together with
    transcription factor atf-7, involved in regulation of the serotonergic response
    of ADF neurons to pathogenic food (PubMed:23505381). . [Isoform c]: Involved in
    male mating behavior; may play a role in functional specialization of PKD ciliated
    sensory neurons.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09555
  source_id: Q09555
- source: Alliance_Imported
  text: daf-19 is the sole C. elegans member of the RFX family of transcriptionfactors,
    and is required for sensory neuron cilium formation; DAF-19 isexpressed in ciliated
    sensory neurons during the period that their ciliaare generated, and probably
    functions as an common transcriptionalactivator of many genes that specifically
    encode cilial structures insensory neurons; daf-19 mutants lack sensory cilia,
    have abnormal amphids,are strongly dauer-constutive, lack normal openings of the
    amphids to theexternal environment (i.e., fail to show dye-filling), and are highlydefective
    in their ability to taste or smell; DAF-19 regulates bbs-5,che-2, che-13, dyf-3,
    osm-1, osm-6, and xbx-1 expression, and probablyregulates ~200 other genes (e.g.,
    bbs-2, bbs-7 and bbs-8); thelocalization of DAF-6 is aberrant in daf-19 mutants.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000914;class=Gene
  source_id: WB:WBGene00000914
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in defense response to Gram-negative bacterium and
    positive regulation of transcription by RNA polymerase II. Acts upstream of or
    within serotonin biosynthetic process. Located in nucleus. Is expressed in several
    structures, including body wall musculature; hypodermis; intestine; neurons; and
    somatic nervous system. Orthologous to several human genes including RFX1 (regulatory
    factor X1) and RFX2 (regulatory factor X2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000914;class=Gene
