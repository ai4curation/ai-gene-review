descriptions:
- source: UniProt
  text: Calmodulin mediates the control of a large number of enzymes, ion channels
    and other proteins by Ca(2+). Among the enzymes to be stimulated by the calmodulin-Ca(2+)
    complex are a number of protein kinases and phosphatases.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16305
  source_id: O16305
- source: Alliance_Imported
  text: cmd-1 encodes a putative homolog of calmodulin 1 that affects growth rate
    and fertility.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000552;class=Gene
  source_id: WB:WBGene00000552
- source: Alliance_Automated
  text: Predicted to enable calcium ion binding activity and enzyme regulator activity.
    Involved in several processes, including apoptotic cell clearance; establishment
    of meiotic spindle orientation; and positive chemotaxis. Located in cell periphery;
    microtubule cytoskeleton; and nuclear membrane. Human ortholog(s) of this gene
    implicated in catecholaminergic polymorphic ventricular tachycardia 4; familial
    hypertrophic cardiomyopathy; long QT syndrome 14; long QT syndrome 15; and long
    QT syndrome 16. Orthologous to human CALM1 (calmodulin 1); CALM2 (calmodulin 2);
    and CALM3 (calmodulin 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000552;class=Gene
  source_id: WB:WBGene00000552
