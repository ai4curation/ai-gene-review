id: O16305
gene_symbol: cmd-1
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm cmd-1, the single C. elegans calmodulin. Qualitatively
  the most useful worm result relative to what is currently annotated: the gene's GOA stops at calcium
  ion binding and generic enzyme regulator activity, both IBA, and ProTrek returns the specific effector
  relationships calmodulin is known for - cyclic-nucleotide phosphodiesterase activation at ranks
  1 and 3, and protein phosphatase activation (calcineurin, which the gene's own review names as a
  concrete worm example with TAX-6 and CNB-1) at rank 4. None of this is new biology; it is transferred
  from well-annotated calmodulin orthologs, and calmodulin was originally discovered as a phosphodiesterase
  activator. But it is new to this gene's annotation record, and it is the kind of specific effector
  claim these evaluations ask for. Two caveats: absolute scores are the lowest of the worm batch (14.67
  down to 13.94, a 149-residue protein), so score again fails to track correctness, and rank 1 is
  obsolete in the current GO release - rank 3 is its live molecular-function equivalent. Assessment:
  3 correct novel. Assessment: 3 correct novel (COR).
