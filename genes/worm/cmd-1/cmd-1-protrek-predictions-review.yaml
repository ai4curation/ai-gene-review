    label: detection of calcium ion
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 14.47), absent from GOA. Detection of calcium ion is defined as receipt of a calcium
      stimulus and its conversion into a molecular signal, which is precisely what an EF-hand sensor
      does, and the gene's first curated core function is calcium ion binding as the biochemical core
      of its sensor role. A curator might prefer to leave the sensor function at calcium ion binding
      plus downstream effects rather than assert the detection process, so this is a defensible rather
      than an obligatory call - but it is not wrong.
    supported_by:
