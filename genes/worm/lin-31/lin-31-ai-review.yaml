- id: file:worm/lin-31/lin-31-deep-research-wormbase.md
  title: WormBase gene description for lin-31 (worm)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'WormBase curated description (uncited, undated). Traced: HNF3/Forkhead family
      (PMID:8504934); effector of MAPK signalling in the vulva and the inhibitory LIN-1/LIN-31
      complex (PMID:9604932). Not traced: expression in the VPCs; it is consistent with the
      Pn.p site of action (PMID:8807292), but no expression assay was read (the cached PMID:9604932
      is abstract-only). Disputed: that on induction LIN-31 "becomes phosphorylated, dissociates
      from LIN-1, and goes on to promote primary and secondary vulval cell fates". PMID:9604932
      showed dissociation in vitro and offered the activator role only as a possibility, and
      endogenous knock-ins of the four MAPK sites to Ala or Glu change vulval morphology, not
      fate patterning (PMID:23995389, PMID:30544993). Omitted: the cki-1/VPC quiescence role
      (PMID:18082681), the lin-39 enhancer target (PMID:16782085), and the male spicule and
      Bgamma roles (PMID:10419688, PMID:20042118); the Bgamma role also qualifies "tissue-specific".'
