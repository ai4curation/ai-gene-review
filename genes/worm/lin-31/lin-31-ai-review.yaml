  review:
    summary: PAINT inference of a role in anatomical structure morphogenesis, inherited from
      the developmental forkhead factors of the node.
    action: KEEP_AS_NON_CORE
    reason: 'True for lin-31 in two organs: the four MAPK phosphosites are needed for normal
      vulval morphogenesis (PMID:23995389), and lin-31 mutant males have defective proctodeal
      cell migrations and malformed spicules (PMID:10419688). In both cases the morphogenetic
      defect follows from LIN-31''s role as a fate-specifying transcription factor, so this
      broad developmental term is kept as non-core.'
    supported_by:
    - reference_id: PMID:23995389
      supporting_text: Mutation of the four MAPK phosphorylation sites to alanine caused a distorted
        vulval morphology at the L4 stage and a partially penetrant protruding vulva phenotype
        in the adult
    - reference_id: PMID:10419688
      supporting_text: Mutations in lin-31 result in identical cell migration and spicule morphology
        defects.
