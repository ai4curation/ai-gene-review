  review:
    summary: PAINT inference that LIN-31 binds RNA polymerase II cis-regulatory DNA in a sequence-specific
      way, inherited from the forkhead (FOX) transcription factor node.
    action: ACCEPT
    reason: LIN-31 is a forkhead-domain transcription factor and the forkhead DNA-binding domain
      is essential for its function (PMID:11102360). It binds a Ras-responsive cis-regulatory
      module upstream of the Hox gene lin-39 and activates lin-39 expression in P6.p through
      it (PMID:16782085, restated in PMID:24885717). That is the binding of an RNA polymerase
      II cis-regulatory region this IBA asserts, and nothing places lin-31 outside the forkhead
      clade that inherits it.
    supported_by:
    - reference_id: PMID:24885717
      supporting_text: Expression from the last element is dependent on Ras pathway function
        and we showed that LIN-1, LIN-31 and LIN-39 directly bind this cis-regulatory module
    - reference_id: PMID:16782085
      supporting_text: The Forkhead domain protein LIN-31 also acts positively on lin-39 in
        P6.p via this module.
