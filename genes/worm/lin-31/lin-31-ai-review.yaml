id: P34683
gene_symbol: lin-31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: lin-31 encodes a FoxB-subfamily forkhead (HNF-3/fork head, winged-helix) transcription
  factor that acts in the vulval precursor cells (VPCs) of the C. elegans hermaphrodite as a
  nuclear effector of the LET-23/EGFR, LET-60/Ras and MPK-1/ERK pathway. Without lin-31 the
  VPCs choose among the primary, secondary and tertiary fates at random, so mutants can be vulvaless
  or multivulva. The forkhead DNA-binding domain is essential, and the gene acts within the
  Pn.p cells. LIN-31 binds the Ets factor LIN-1, and the LIN-1/LIN-31 complex inhibits vulval
  induction. MPK-1 phosphorylates LIN-31 on four C-terminal threonines, which disrupts the complex
  in vitro. Endogenous knock-ins that block or mimic phosphorylation at these sites disturb
  vulval morphogenesis but were reported not to alter VPC fate patterning, so how the signal
  regulates LIN-31 in vivo is still open. LIN-31 binds a Ras-responsive enhancer of the Hox gene lin-39 and activates
  lin-39 in P6.p. With LIN-1 it is needed to switch off a late egl-17/FGF enhancer. Before induction,
  LIN-1 and LIN-31 promote transcription of the CDK inhibitor gene cki-1, which keeps the VPCs
  quiescent through the first two larval stages. In males, lin-31 is needed for spicule development,
  and downstream of EGF signalling for ceh-13/Hox1 expression in the B-lineage cell Bgamma.
