  review:
    summary: Direct assay (Wagmaister et al. 2006) showing that LIN-31 binds a lin-39 cis-regulatory
      module.
    action: MODIFY
    reason: The paper defines a 1.3 kb upstream cis-regulatory module of the Hox gene lin-39
      that drives Ras-dependent expression in P6.p, shows that LIN-31 acts positively through
      it, and (as the same group restates, PMID:24885717) that LIN-31 binds it directly. The
      bound DNA is an RNA polymerase II cis-regulatory region of a protein-coding gene, so this
      row's own evidence supports the more specific GO:0000978, which the gene already carries
      by IBA. The IEA row to the same term stays ACCEPT because its evidence, the forkhead
      domain signature, supports only the general term; the two actions differ by evidence,
      not by claim.
    proposed_replacement_terms:
    - id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    supported_by:
    - reference_id: PMID:16782085
      supporting_text: a 1.3-kb upstream cis-regulatory module that drives expression in the
        VPC P6.p in a Ras-dependent manner
    - reference_id: PMID:16782085
      supporting_text: The Forkhead domain protein LIN-31 also acts positively on lin-39 in
        P6.p via this module.
    - reference_id: PMID:24885717
      supporting_text: Expression from the last element is dependent on Ras pathway function
        and we showed that LIN-1, LIN-31 and LIN-39 directly bind this cis-regulatory module
