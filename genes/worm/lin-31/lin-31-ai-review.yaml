  review:
    summary: PAINT inference of a role in cell differentiation.
    action: ACCEPT
    reason: 'LIN-31 specifies vulval precursor cell fates: without it the VPCs choose among
      the primary, secondary and tertiary fates at random (PMID:8504934), and it acts in the
      Pn.p cells themselves (PMID:8807292). The more specific process (vulval cell fate specification)
      is not carried by any row, and the IBA''s evidence supports only this level, so the term
      is kept; cell fate choice is LIN-31''s central role.'
    supported_by:
    - reference_id: PMID:8504934
      supporting_text: lin-31 regulates how vulval precursor cells choose their fate; in lin-31
        mutants, these cells do not properly choose which fate to express and therefore adopt
        any one of the three possible vulval cell fates in a deregulated fashion.
    - reference_id: PMID:8807292
      supporting_text: lin-31, which specifies cell fates during vulval induction and encodes
        a putative transcription factor similar to HNF-3/fork head, acts in the Pn.p cells.
