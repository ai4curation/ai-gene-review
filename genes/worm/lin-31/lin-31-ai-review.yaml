core_functions:
- description: LIN-31 is a FoxB forkhead transcription factor that acts in the vulval precursor
    cells downstream of LET-23/EGFR, LET-60/Ras and MPK-1/ERK. Bound to LIN-1/Ets it restrains
    vulval fates; on induction it helps specify primary and secondary fates, and it directly
    activates the Hox gene lin-39 through a Ras-responsive enhancer in P6.p. Before induction
    it also promotes cki-1 transcription, which keeps the VPCs quiescent.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0040025
    label: vulval development
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0030154
    label: cell differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8504934
    supporting_text: lin-31 regulates how vulval precursor cells choose their fate
  - reference_id: PMID:9604932
    supporting_text: LIN-31 binds to LIN-1, and the LIN-1/LIN-31 complex inhibits vulval induction.
  - reference_id: PMID:24885717
    supporting_text: Expression from the last element is dependent on Ras pathway function and
      we showed that LIN-1, LIN-31 and LIN-39 directly bind this cis-regulatory module
  - reference_id: PMID:18082681
    supporting_text: LIN-1 and LIN-31 promote cki-1/Kip-1 transcription prior to their inhibition
      through RTK/Ras/MAPK activation.
suggested_questions:
- question: The four C-terminal MAPK threonines of LIN-31 are dispensable for VPC fate patterning
    (PMID:23995389). How, then, does EGFR/MPK-1 signalling change LIN-31 activity, and is the
    LIN-1/LIN-31 complex disrupted in the induced VPC in vivo?
  experts:
  - C. elegans vulval development researchers
  - ERK signalling biochemists
- question: Which LIN-31 targets are activated and which are repressed with LIN-1, and is cki-1
    a direct LIN-31 target?
  experts:
  - C. elegans transcription factor researchers
- question: Why did full-length lin-39::GFP upregulation in P6.p appear LIN-31-independent (PMID:16412617)
    while the isolated 1.3 kb enhancer depends on LIN-31 (PMID:16782085)?
  experts:
  - Hox gene regulation researchers
suggested_experiments:
- experiment_type: Genome-wide binding in VPCs
  description: Map endogenous LIN-31 binding in the VPCs by targeted DamID or ChIP-seq of a
    tagged knock-in allele, before and after induction and in lin-1 mutants, and test the cki-1,
    lin-39 and egl-17 regulatory regions specifically.
  hypothesis: LIN-31 binds cki-1 and lin-39 regulatory DNA directly, and its occupancy or partner
    (LIN-1) changes on induction.
- experiment_type: Stage-specific degradation
  description: Use auxin-inducible degradation of endogenous LIN-31 in the VPCs during L1-L2
    or only in L3 to separate the quiescence role from the fate-specification role.
  hypothesis: Early loss of LIN-31 causes precocious VPC division through loss of cki-1, while
    L3 loss alone randomises fates.
- experiment_type: In vivo complex analysis
  description: Measure LIN-1/LIN-31 association in VPCs (proximity labelling or split-fluorescent
    reporters) in wild type, lin-31(4T->A) and lin-31(4T->E) animals and under altered EGF signalling.
  hypothesis: Signal-dependent release of LIN-31 from LIN-1 occurs in vivo but does not require
    the four C-terminal MAPK sites.
