findings:
- category: discrepancy
  text: WormBase states that on induction LIN-31 is phosphorylated, leaves LIN-1 and then promotes
    primary and secondary fates. The source paper (PMID:9604932) proposed the activator role
    only as a possibility, and Ala or Glu knock-ins of the four MAPK sites change vulval morphology,
    not fate patterning (PMID:23995389, PMID:30544993). Recorded as an OUTDATED_STATEMENT source
    defect.
  sources:
  - Alliance_Imported
- category: gap
  text: No source mentions that LIN-1 and LIN-31 promote cki-1 transcription to keep the VPCs
    quiescent before induction (PMID:18082681), or the lin-39 enhancer that LIN-31 binds and
    activates in P6.p (PMID:16782085). The review covers both.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: 'No source mentions the male roles: spicule development (PMID:10419688) and ceh-13 expression
    in Bgamma downstream of EGF (PMID:20042118). The Bgamma role also qualifies the vulval-specific
    framing in the WormBase text.'
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: insight
  text: 'Not every LIN-1 output needs LIN-31: LIN-1 represses lag-2 in the VPCs without it (PMID:21596897),
    so the LIN-1/LIN-31 complex is target-specific.'
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All four texts agree that LIN-31 specifies vulval precursor cell fates, and
    none contradicts another. WormBase alone gives the mechanism and overstates the phosphorylation
    model; UniProt and the automated texts are correct but thin.
