descriptions:
- source: UniProt
  text: Lin-31 regulates how vulval precursor cells choose their fate. It helps specify three
    alternative cell fates in vulval development.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34683
  source_id: P34683
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'Correct and traceable to the 1993 cloning paper (PMID:8504934): LIN-31 controls
      how the VPCs choose among three fates. It does not say that LIN-31 is a forkhead transcription
      factor, and omits the MPK-1/LIN-1 regulation, the lin-39 and cki-1 targets and the male
      roles.'
- source: Alliance_Imported
  text: lin-31 encodes a winged helix (WH)-like transcription factor that is a member of the
    HNF3/Forkhead family of DNA-binding proteins; LIN-31 acts as a tissue-specific effector
    of MAP kinase-mediated signaling in the vulva; when MAP kinase is inactive, LIN-31 forms
    a complex with LIN-1/Ets that inhibits vulval cell fates; upon MAP kinase activation (vulval
    induction), LIN-31 becomes phosphorylated, dissociates from LIN-1, and goes on to promote
    primary and secondary vulval cell fates; LIN-31 is expressed in the vulval precursor cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003017;class=Gene
  source_id: WB:WBGene00003017
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Accurate on family, the vulval MAPK effector role and the LIN-1/LIN-31 inhibitory
      complex (PMID:9604932). It states as established that phosphorylated LIN-31 dissociates
      from LIN-1 and promotes fates. Tan et al. offered the activator role as a possibility,
      and endogenous phosphosite knock-ins alter vulval morphology but not fate patterning (PMID:23995389).
      It omits the cki-1/quiescence role and the male roles, which also qualify "tissue-specific".
