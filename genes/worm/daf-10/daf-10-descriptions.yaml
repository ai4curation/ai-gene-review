- source: Alliance_Imported
  text: daf-10 encodes a WD- and WAA-repeat containing protein that is the C. elegans
    ortholog of intraflagellar transport (IFT) complex A component IFT122; daf-10
    activity is required for intraflagellar transport and thus for proper development
    of amphid and phasmid neurons, dauer development, chemotaxis, and normal lifespan;
    a DAF-10::GFP fusion protein undergoes both anterograde and retrograde intraflagellar
    transport in amphid or phasmid sensory neurons.
