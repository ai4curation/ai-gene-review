gene_symbol: daf-10
organism: worm
uniprot_id: G5EFW7
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport and entry into cilia of G protein- coupled receptors (GPCRs)
    (PubMed:28479320). Plays a role in chemotaxis and sensory perception (PubMed:7240452,
    PubMed:7705621). Required for entry into and exit from the dauer larval stage
    and this may be mediated by daf-12, daf-16 and daf-41 (PubMed:23284299, PubMed:25830239,
    PubMed:7240452). Controls the behavioral response, namely the avoidance response,
    and pathogen-responsive gene expression in the response to pathogenic bacteria
    such as E.coli and P.aeruginosa (PubMed:23284299).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EFW7
  source_id: G5EFW7
- source: Alliance_Imported
  text: daf-10 encodes a WD- and WAA-repeat containing protein that is the C. elegans
    ortholog of intraflagellar transport (IFT) complex A component IFT122; daf-10
    activity is required for intraflagellar transport and thus for proper development
    of amphid and phasmid neurons, dauer development, chemotaxis, and normal lifespan;
    a DAF-10::GFP fusion protein undergoes both anterograde and retrograde intraflagellar
    transport in amphid or phasmid sensory neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000906;class=Gene
  source_id: WB:WBGene00000906
- source: Alliance_Automated
  text: Involved in several processes, including non-motile cilium assembly; positive
    regulation of dauer larval development; and receptor localization to non-motile
    cilium. Located in ciliary basal body. Human ortholog(s) of this gene implicated
    in cranioectodermal dysplasia 1. Orthologous to human IFT122 (intraflagellar transport
    122).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000906;class=Gene
  source_id: WB:WBGene00000906
