descriptions:
- source: UniProt
  text: Component of the IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport and entry into cilia of G protein- coupled receptors (GPCRs)
    (PubMed:28479320). Plays a role in chemotaxis and sensory perception (PubMed:7240452,
    PubMed:7705621). Required for entry into and exit from the dauer larval stage
    and this may be mediated by daf-12, daf-16 and daf-41 (PubMed:23284299, PubMed:25830239,
    PubMed:7240452). Controls the behavioral response, namely the avoidance response,
    and pathogen-responsive gene expression in the response to pathogenic bacteria
    such as E.coli and P.aeruginosa (PubMed:23284299).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EFW7
