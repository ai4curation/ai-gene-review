    label: nematode larval development
  evidence_type: IMP
  original_reference_id: PMID:10901169
  qualifier: involved_in
  review:
    summary: Abstract-only 2000 report that aps-2 RNAi causes larval lethality at various stages and morphological
      defects. Later deletion alleles of aps-2 are viable adults with the jowls phenotype, and sigma2
      RNAi in another study produced dumpy but living progeny.
    action: MARK_AS_OVER_ANNOTATED
    reason: The RNAi phenotype is real but viable null alleles show that sigma2 is not required for larval
      development per se; the developmental defects are downstream consequences of reduced AP-2 endocytosis.
      Treated as over-annotation rather than removed because the primary data cannot be checked beyond
      the abstract.
    supported_by:
    - reference_id: PMID:10901169
      supporting_text: RNA interference experiments showed that the reduction of either apm-2 or aps-2
        gene function causes embryonic lethality, larval lethality at various stages of development, and
        other morphological defects in the larval stages.
    - reference_id: PMID:25303366
      supporting_text: Deletion of the sigma subunit (aps-2) produces a similar ‘jowls’ phenotype (Figure
        1A and Figure 1—figure supplement 1B), while the beta subunit is shared by both AP1 and AP2 in
        C.
    additional_reference_ids:
