id: Q19123
gene_symbol: aps-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: aps-2 encodes the sigma2 (AP17) small subunit of the AP-2 clathrin adaptor complex of Caenorhabditis
  elegans. Sigma2 is bound tightly to alpha-adaptin, with which it forms the alpha/sigma2 half of the
  heterotetrameric adaptor; its surface carries the pocket that, with the alpha subunit, recognises dileucine-type
  sorting signals in cargo cytoplasmic tails, and this pocket is latched shut by the beta N-terminus until
  FCHO-1 drives the complex into its open, membrane- and cargo-binding conformation. APS-2::GFP localises
  to synaptic regions of the nerve ring and to maturing oocytes, and depends on alpha-adaptin for stability.
  Loss of aps-2 phenocopies loss of the other AP-2 subunits (dumpy body, cuticular 'jowls'), reflecting
  reduced clathrin-dependent endocytosis at the plasma membrane, although sigma2 is dispensable for yolk
  uptake by oocytes and for apoptotic-corpse clearance, processes that depend more on the alpha, beta
  and mu2 subunits.
