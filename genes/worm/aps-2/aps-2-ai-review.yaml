- id: PMID:10588660
  title: Receptor-mediated endocytosis in the Caenorhabditis elegans oocyte.
  findings:
  - statement: sigma2 RNAi produces severely dumpy progeny but does not reduce yolk uptake.
    supporting_text: Unlike the other CCP components we tested, Ce- μ2(RNAi) and Ce- ς2(RNAi) did not
      result in an apparent reduction in YP170::GFP uptake into the oocyte.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:10901169
  title: Molecular genetic analysis of apm-2 and aps-2, genes encoding the medium and small chains of
    the AP-2 clathrin-associated protein complex in the nematode Caenorhabditis elegans.
  findings:
  - statement: aps-2 is expressed in most cells during embryogenesis and mainly in neurons and hypodermis
      later; RNAi caused embryonic/larval lethality.
    supporting_text: RNA interference experiments showed that the reduction of either apm-2 or aps-2 gene
      function causes embryonic lethality, larval lethality at various stages of development, and other
      morphological defects in the larval stages.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; the lethality is not reproduced by later deletion alleles (PMID:25303366).
- id: PMID:25303366
  title: The membrane-associated proteins FCHo and SGIP are allosteric activators of the AP2 clathrin
    adaptor complex.
  findings:
  - statement: aps-2 deletion mutants are viable with the jowls phenotype; suppressors map to the beta/sigma2
      latch.
    supporting_text: Deletion of the sigma subunit (aps-2) produces a similar ‘jowls’ phenotype (Figure
      1A and Figure 1—figure supplement 1B), while the beta subunit is shared by both AP1 and AP2 in C.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:23482940
  title: AP2 hemicomplexes contribute independently to synaptic vesicle endocytosis.
  findings:
  - statement: sigma2 is tightly bound to alpha, unstable in apa-2 mutants, and retained at the nerve
      ring in mu2 mutants.
    supporting_text: On the other hand, the small σ2 subunit, which is normally tightly bound to α-adaptin,
      is unstable in apa-2 mutants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; not cited by GOA for aps-2 but reports APS-2::GFP localisation and
      stability.
- id: file:worm/aps-2/aps-2-deep-research-falcon.md
  title: Deep research report (falcon/Edison) on C. elegans aps-2
  findings:
  - statement: Deep research quantifies APS-2::GFP dependence on alpha-adaptin and adds the tm2912 allele
      (temperature-sensitive growth/locomotion defects, alpha-synuclein enhancer) and GLR-1 trafficking
      not in GOA.
    supporting_text: 'Nerve-ring fluorescence: wild type **3543 ± 169 (100%)**; *apa-2/α* mutant **389
      ± 28 (11%)**; *apm-2/μ2* mutant **1391 ± 51 (39%)**; comparisons **p < 0.0001**.'
core_functions:
- description: As the sigma2 subunit of the AP-2 adaptor complex, APS-2 stabilises the alpha/sigma2 hemicomplex
    and contributes the dileucine-signal binding pocket that, once the complex is opened by FCHO-1 at
    PI(4,5)P2-rich plasma membrane, links cargo to the clathrin coat during clathrin-dependent endocytosis.
  molecular_function:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  directly_involved_in:
  - id: GO:0072583
    label: clathrin-dependent endocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0030122
    label: AP-2 adaptor complex
  supported_by:
  - reference_id: PMID:25303366
    supporting_text: In the unlatched state, the N-terminus of the beta subunit disconnects from the alpha
      and sigma2 subunits and exposes the dileucine-motif binding pocket (Kelly et al., 2008).
  - reference_id: PMID:23482940
    supporting_text: On the other hand, the small σ2 subunit, which is normally tightly bound to α-adaptin,
      is unstable in apa-2 mutants.
suggested_questions:
- question: Which endogenous dileucine-motif cargoes require APS-2 in vivo, given that yolk uptake and
    corpse clearance proceed without it?
