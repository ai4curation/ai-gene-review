- term:
    id: GO:0030276
    label: clathrin binding
  evidence_type: ISS
  original_reference_id: PMID:10901169
  qualifier: enables
  review:
    summary: ISS clathrin binding from the abstract-only 2000 gene-structure paper. The sigma2 subunit
      is a small trunk-only subunit with no hinge or clathrin box; clathrin recruitment to AP-2 is a function
      of the beta subunit, and the sigma2 surface instead contributes the dileucine-cargo pocket.
    action: REMOVE
    reason: 'Sequence-similarity inference that is not supported by AP-2 structure or by any worm experiment:
      sigma2 does not bind clathrin, the beta hinge does. The activity that sigma2 genuinely contributes
      is captured by the clathrin-cargo adaptor row.'
    supported_by:
    - reference_id: PMID:23482940
      supporting_text: Although clathrin is largely recruited to AP2 by the β subunit, even in the absence
        of β, it could still be recruited indirectly to the complex via AP180
    - reference_id: PMID:10588660
      supporting_text: The β-adaptin subunit is thought to connect the AP2 complex to clathrin ( Pearse
        and Robinson, 1990 ).
    - reference_id: PMID:25303366
      supporting_text: In the unlatched state, the N-terminus of the beta subunit disconnects from the
        alpha and sigma2 subunits and exposes the dileucine-motif binding pocket (Kelly et al., 2008).
    additional_reference_ids:
    - PMID:23482940
    - PMID:10588660
    - PMID:25303366
