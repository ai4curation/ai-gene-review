gene_symbol: aps-2
organism: worm
uniprot_id: Q19123
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: 'aps-2 encodes an adaptin: specifically, it encodes an ortholog of the sigma2
    subunit of adaptor protein complex 2 (AP2), which mediates endocytosis from the
    plasma membrane; APS-2 is required for embryonic and larval development and for
    normal body morphogenesis, but is not required for endocytosis of yolk protein
    in developing oocytes; APS-2 is expressed in nearly all cells during embryogenesis,
    but during larval and adult stages, expression is confined to neurons and some
    hypodermal cells, including vulval hypodermal cells during the fourth larval stage.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000157;class=Gene
  source_id: WB:WBGene00000157
- source: Alliance_Automated
  text: Predicted to enable clathrin binding activity. Involved in several processes,
    including body morphogenesis; clathrin-dependent endocytosis; and nematode larval
    development. Predicted to be located in several cellular components, including
    bounding membrane of organelle; cytoplasmic vesicle membrane; and plasma membrane.
    Predicted to be part of AP-2 adaptor complex. Is expressed in neurons. Human ortholog(s)
    of this gene implicated in familial hypocalciuric hypercalcemia 3. Orthologous
    to human AP2S1 (adaptor related protein complex 2 subunit sigma 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000157;class=Gene
