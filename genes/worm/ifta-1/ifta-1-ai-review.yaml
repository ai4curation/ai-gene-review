id: Q18859
gene_symbol: ifta-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  IFTA-1 (C54G7.4) is the Caenorhabditis elegans ortholog of human WDR35
  (IFT121), a core subunit of intraflagellar transport complex A (IFT-A). It is
  a large (1246 aa) scaffold made of two N-terminal WD40 beta-propellers, a
  tetratricopeptide-repeat (TPR)/alpha-solenoid region and a C-terminal
  zinc-finger-like domain, with no catalytic domain. ifta-1 is an X-box gene
  expressed in ciliated sensory neurons. GFP-tagged IFTA-1 concentrates at the
  ciliary base (transition zone) and along the axoneme, and moves
  bidirectionally at IFT rates. ifta-1 mutants have somewhat shortened cilia
  that lack part of the distal segment, accumulate IFT machinery inside the
  cilium (a sign of failed retrograde transport), take up dye poorly, and
  chemotax poorly. IFTA-1 behaves like the IFT-A subunit CHE-11/IFT140 and
  needs CHE-11 to reach cilia. With IFT-43 and IFT-139 it is also needed to
  remove periciliary membrane proteins from the cilium. Human WDR35 mutations
  cause cranioectodermal dysplasia and short-rib thoracic dysplasia.
