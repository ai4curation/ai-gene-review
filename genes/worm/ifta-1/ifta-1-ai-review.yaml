knowledge_gaps:
- gap_statement: >-
    How IFTA-1 helps couple dynein-2 to trains at the ciliary tip is unknown.
    ifta-1 mutants accumulate IFT machinery inside cilia, and IFT-A as a whole is
    needed for train turnaround, but which IFTA-1 surface binds dynein-2 or other
    IFT-A subunits has not been mapped in the worm.
  boundary: >-
    Established: IFT-A membership, dependence on CHE-11 for ciliary entry, and a
    requirement for retrograde IFT. Unknown: direct binding partners and the
    mechanism by which IFTA-1 supports retrograde train assembly.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    WDR35 ciliopathy alleles cluster in the propellers and solenoid; knowing
    which interfaces carry the retrograde function would explain them.
  resolution: >-
    Structure-guided point mutations in IFTA-1 propeller and solenoid
    interfaces, read out by single-molecule IFT-A and dynein-2 imaging.
  provenance:
  - reference_id: PMID:37883232
    supporting_text: our data establish key roles for IFT-A in mediating motor-train
      coupling during IFT turnaround, promoting retrograde IFT initiation, and modulating
      dynein-2 retrograde motility
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Does worm IFTA-1, like vertebrate WDR35, also help deliver membrane vesicles
    to the ciliary base, separately from its role in retrograde IFT?
suggested_experiments:
- description: >-
    Express ciliopathy-equivalent IFTA-1 point mutants from the endogenous locus
    and measure IFT-A train loading, dynein-2 turnaround at the tip and
    periciliary membrane cargo exclusion.
  hypothesis: >-
    Separate IFTA-1 interfaces support retrograde train assembly and removal of
    membrane cargo from the cilium.
