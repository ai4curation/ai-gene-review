core_functions:
- description: >-
    Core structural subunit of intraflagellar transport complex A (IFT-A). IFTA-1
    is a non-catalytic WD40 beta-propeller and TPR scaffold that moves on IFT
    trains along the axoneme and is required for retrograde (tip-to-base)
    transport of IFT machinery.
