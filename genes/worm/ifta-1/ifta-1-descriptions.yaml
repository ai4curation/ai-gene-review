descriptions:
- source: Alliance_Imported
  text: ifta-1 encodes a evolutionarily conserved protein found in ciliated unicellular
    and multicellular organisms including humans and is absent in non-ciliated organisms
    like yeast; IFTA-1 contains a X-box and several N-terminal WD repeats; ifta-1
    is required for retrograde intraflagellar transport and likely associates with,
    or is a core component of the IFT-A subcomplex; ifta-1 is also required for the
    proper functioning and assembly of cilia; IFTA-1 localizes to the basal body of
    the cilium.
