- source: Alliance_Automated
  text: Involved in chemotaxis; intraciliary transport; and non-motile cilium assembly.
    Located in axoneme and ciliary basal body. Is expressed in nervous system. Human
    ortholog(s) of this gene implicated in Ellis-Van Creveld syndrome; cranioectodermal
    dysplasia 2; and short-rib thoracic dysplasia 7 with or without polydactyly. Orthologous
    to human WDR35 (WD repeat domain 35).
