gene_symbol: ifta-1
organism: worm
uniprot_id: Q18859
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: ifta-1 encodes a evolutionarily conserved protein found in ciliated unicellular
    and multicellular organisms including humans and is absent in non-ciliated organisms
    like yeast; IFTA-1 contains a X-box and several N-terminal WD repeats; ifta-1
    is required for retrograde intraflagellar transport and likely associates with,
    or is a core component of the IFT-A subcomplex; ifta-1 is also required for the
    proper functioning and assembly of cilia; IFTA-1 localizes to the basal body of
    the cilium.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016935;class=Gene
  source_id: WB:WBGene00016935
- source: Alliance_Automated
  text: Involved in chemotaxis; intraciliary transport; and non-motile cilium assembly.
    Located in axoneme and ciliary basal body. Is expressed in nervous system. Human
    ortholog(s) of this gene implicated in Ellis-Van Creveld syndrome; cranioectodermal
    dysplasia 2; and short-rib thoracic dysplasia 7 with or without polydactyly. Orthologous
    to human WDR35 (WD repeat domain 35).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00016935;class=Gene
  source_id: WB:WBGene00016935
