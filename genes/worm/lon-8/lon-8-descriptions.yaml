gene_symbol: lon-8
organism: worm
uniprot_id: G5EGH7
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Secreted protein that is involved in larval elongation, early adult growth
    and male tail development.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EGH7
  source_id: G5EGH7
- source: Alliance_Imported
  text: lon-8 encodes a secreted protein, conserved among nematodes, thatinhibits
    body elongation during larval and early adult growth, probablyby limiting cell
    size rather than nuclear ploidy or cell number; LON-8is also required for normal
    ray morphology in the male tail, but not forsuperficially normal male mating,
    suggesting a role in cuticleretraction; LON-8 is strongly expressed in the hypodermal
    syncytia hyp4and hyp7, and appears to be secreted from them in vivo; in males,
    LON-8is also expressed in male tail hypodermal nuclei (V6.pppaa, T.aa, R6.p,T.apapa,
    R7.p, R8.p and R9.p); LON-8 has no obvious non-nematodehomologs; LON-8 activity
    is genetically independent of DBL-1/TGF-betasignalling; newly hatched lon-8(hu187)
    larvae are normal in length, butthen outgrow wild-type larvae at a rate similar
    to that of lon-1(e185)larvae until 96 hours post-hatching, after which lon-8(hu187)
    growth wasnormal; lon-8(hu187) mutants have normal levels of hypodermalendoreduplication
    and of seam cell fusion; lon-8(hu187) is suppressed bymutations of dpy-11 or dpy-18;
    conversely, lon-8(hu187) does notsuppress dbl-1(nk3) or sma-6(e1482), and lon-8
    transcripts are notaffected by dbl-1(nk3) or sma-6(e1482) mutations.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00013352;class=Gene
  source_id: WB:WBGene00013352
- source: Alliance_Automated
  text: Acts upstream of or within with a positive effect on nematode male tail tip
    morphogenesis. Located in extracellular region. Is expressed in hyp4; hyp7 syncytium;
    and intestine.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00013352;class=Gene
  source_id: WB:WBGene00013352
- source: RefSeq
