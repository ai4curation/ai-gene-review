id: O61667
gene_symbol: egl-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'egl-1 encodes a short, intrinsically disordered BH3-only apoptosis activator in Caenorhabditis
  elegans. When transcribed in cells fated to die, EGL-1 binds the BCL2-family survival protein CED-9
  and inhibits its sequestration of CED-4, allowing CED-4 to activate the CED-3 caspase. The same CED
  pathway is reused locally in neurons for EGL-1-dependent elimination of transient presynaptic material.'
