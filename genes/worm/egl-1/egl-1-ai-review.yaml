core_functions:
- description: EGL-1 donates a BH3-like helix to the pro-survival BCL2-family protein CED-9, 
    inhibiting CED-9 and triggering release of CED-4 for apoptotic CED-3 activation.
  proposed_molecular_function: pro-survival BCL2 family protein inhibitor activity
  directly_involved_in:
