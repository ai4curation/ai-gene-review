      complex, and were unable to\ninduce cell death in vivo"
    reference_section_type: ABSTRACT
  - reference_id: PMID:16208361
    supporting_text: "EGL-1 binding induces\npronounced conformational changes in CED-9 that result in
      the dissociation of\nthe CED-4 dimer from CED-9"
    reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: pro-survival BCL2 family protein inhibitor activity
  proposed_definition: Binding to a pro-survival BCL2-family protein through a BH3-mediated 
    interaction to inhibit that protein from sequestering pro-apoptotic BCL2-family effectors or 
    activators.
  justification: EGL-1, BIM, BID, PUMA, NOXA, and related BH3-only proteins donate BH3 helices to 
    pro-survival BCL2-family proteins and inhibit their anti-apoptotic activity. GO:0051434 BH3 
    domain binding annotates the groove-side receptor, such as CED-9, and is directionally wrong for
    the EGL-1-side BH3 ligand.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:9604928
    supporting_text: "EGL-1 activates programmed cell death by binding to and directly inhibiting\nthe
      activity of CED-9"
    reference_section_type: ABSTRACT
  - reference_id: PMID:15383288
    supporting_text: "The C-terminal\nhalf of EGL-1 is necessary and sufficient for binding to CED-9 and
      for killing\ncells"
    reference_section_type: ABSTRACT
suggested_questions:
- question: Should GO add a BH3-ligand-side molecular-function term for EGL-1 and mammalian BH3-only
    proteins, paired with the existing groove-side BH3 domain binding term?
  experts: []
- question: Should local reuse of EGL-1, CED-9, CED-4, and CED-3 in synapse pruning be curated in a 
    worm-specific pathway module distinct from whole-cell apoptosis?
  experts: []
- question: Does EGL-1 participate directly in the CED-3/miRNA heterochronic pathway, or are egl-1 
    genetic interactions in that paper indirect consequences of upstream apoptosis-module 
    perturbation?
  experts: []
suggested_experiments:
- hypothesis: The same EGL-1 BH3/CED-9 interface is required for whole-cell apoptosis and for local 
    CED-pathway synapse pruning.
  description: Endogenously introduce EGL-1 BH3 interface mutations that abolish or weaken CED-9 
    binding, then quantify embryonic cell-corpse formation, M4/NSM sister-cell survival, CED-4 
    release or CED-3 activation, and RME/DD presynaptic-material pruning in the same allelic series.
