- source: Alliance_Automated
  text: Involved in several processes, including actin filament depolymerization;
    defense response to Gram-negative bacterium; and positive regulation of cellular
    component organization. Located in cytosol; mitochondrion; and presynapse. Is
    expressed in several structures, including ABalappaapp; ABaraapapaad; HSN; URX;
    and proctodeal cell.
