gene_symbol: egl-1
organism: worm
uniprot_id: O61667
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a major role in programmed cell death (PCD or apoptosis) by negatively
    regulating ced-9 (PubMed:10688797, PubMed:15383288, PubMed:9604928). Binds to
    and directly inhibits the activity of ced-9, releasing the cell death activator
    ced-4 from a ced- 9/ced-4 containing protein complex and allowing ced-4 to activate
    the cell-killing caspase ced-3 (PubMed:10688797, PubMed:15383288, PubMed:9604928).
    Required to activate programmed cell death in the sister cells of the serotonergic
    neurosecretory motor (NSM) neurons during embryogenesis (PubMed:12874127). Required
    to activate programmed cell death in the sister cells of the M4 motor neuron and
    I1 pharyngeal neuron during embryogenesis (PubMed:20713707). During larval development,
    required for the elimination of transient presynaptic components upstream of ced-9,
    ced-4 and ced-3 apoptotic pathway (PubMed:26074078). Together with ain-1, a component
    of the miRNA- induced-silencing complex (miRISC), and probably upstream of ced-3
    and ced-4, regulates temporal cell fate patterning during larval development (PubMed:25432023).
    Has been shown in two studies to be dispensable in mitochondrial dynamics and
    morphology during early embryonic development (PubMed:19327994, PubMed:21949250).
    However, one study shows that during larval development, egl-1 is involved in
    modulating mitochondrial dynamics, perhaps acting by stabilizing the interaction
    between ced-9 and drp-1 in order to promote mitochondrial fission (PubMed:21949250).
    Involved in inducing mitochondrial fragmentation during apoptosis, probably acting
    via ced-9 and dynamin- related protein drp-1 (PubMed:15716954).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O61667
  source_id: O61667
- source: Alliance_Imported
  text: egl-1 encodes a novel protein that contains a region similar to the BH3 (Bcl-2
    homology region 3) domain of mammalian cell death activators; EGL-1 functions
    as an upstream activator in the general programmed cell death pathway and positively
    regulates programmed cell death by interacting directly with CED-9 to induce CED-4
    release from CED-4/CED-9 complexes and ultimately activate the CED-3 caspase;
    EGL-1 also induces WAH-1/apoptosis-inducing factor release from the mitochondria;
    in hermaphrodites, egl-1 is transcriptionally repressed by TRA-1, permitting survival
    of the HSN neurons required for egg laying; egl-1 message is detected at low abundance
    in embryonic and L1 larval mRNA preparations, but not in mRNA preparations from
    later larval stages or young adults.
