- source: Alliance_Automated
  text: Enables microtubule motor activity. Involved in microtubule-based movement.
    Part of axonemal heterotrimeric kinesin-II complex. Is expressed in head; intestine;
    nervous system; and reproductive system. Human ortholog(s) of this gene implicated
    in allergic disease and asthma. Orthologous to human KIF3A (kinesin family member
    3A).
