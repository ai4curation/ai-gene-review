descriptions:
- source: UniProt
  text: Component of the kinesin II motor complex (composed of kap-1 and the heterodimeric
    motor proteins klp-11 and klp-20) which is required for intraflagellar transport
    (IFT) (PubMed:20498083, PubMed:20833139). Heterodimerizes with klp-11 to form
    a 'processive' molecular motor upon IFT cargo binding, which, within the kinesin
    II motor complex, binds to and moves along microtubules in a unidirectional manner
    (without dissociation of the heterodimer), and in turn, is responsible for the
    IFT of cargo (PubMed:20498083). Specifically, the kinesin II motor complex, together
    with the kinesin motor protein osm-3 moves along microtubules and is required
    for anterograde IFT along the middle segment of the sensory neuron cilia (PubMed:17000880,
    PubMed:20833139, PubMed:28479320). In particular, the kinesin II motor complex
    delivers specific ciliary cargo proteins such as che-3 which are related to motility
    to ciliary tips (PubMed:28479320). This is likely mediated by IFT complexes A
    and B (PubMed:28479320).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q965T6
  source_id: Q965T6
- source: Alliance_Imported
  text: klp-20 encodes one of 19 C. elegans kinesin-like proteins; KLP-20, along with
    KLP-11 and KAP-1, is a component of heterotrimeric kinesin-II that cooperates
    with OSM-3 motors to facilitate anterograde intraflagellar transport essential
    for formation of sensory neuron cilia.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002230;class=Gene
  source_id: WB:WBGene00002230
- source: Alliance_Automated
  text: Enables microtubule motor activity. Involved in microtubule-based movement.
    Part of axonemal heterotrimeric kinesin-II complex. Is expressed in head; intestine;
    nervous system; and reproductive system. Human ortholog(s) of this gene implicated
    in allergic disease and asthma. Orthologous to human KIF3A (kinesin family member
    3A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002230;class=Gene
