    label: hemidesmosome associated protein complex
  supported_by:
  - reference_id: PMID:37759445
    supporting_text: MUP-4 exerts immune surveillance function through binding and sequestering STA-2
      under normal conditions and releasing STA-2 to induce AMPs upon apical structural damage
  - reference_id: PMID:37759445
    supporting_text: Moreover, the deletion of the extracellular portion of MUP-4 containing the collagen-binding
      domain caused STA-2 detachment from CeHDs, suggesting that the interaction between MUP-4 and STA-2
      responds to signals from ECM collagens
  - reference_id: PMID:25692704
    supporting_text: The epidermis recognized structural damage through hemidesmosomes associated with
      a STAT-like protein, whose disruption led to detachment of STA-2 molecules from hemidesmosomes and
      transcription of AMPs.
suggested_questions:
- question: Does BLI-1 bind the MUP-4 ectodomain directly? If so, which MUP-4 domain (vWFA, SEA or EGF
    repeats) mediates collagen binding?
- question: Does the MUP-4 cytoplasmic (filaggrin-like) domain bind STA-2 directly, and what conformational
    or proteolytic change in MUP-4 releases STA-2 after damage? Do the SEA modules undergo autoproteolysis,
    as in other SEA-domain receptors?
suggested_experiments:
- description: Run in vitro binding assays (pull-down or SPR) between recombinant MUP-4 ectodomain fragments
    and BLI-1, and between the MUP-4 cytoplasmic domain and STA-2, to test the proposed direct collagen-receptor-STAT
    links.
- description: Use CRISPR to make domain-specific MUP-4 deletions (vWFA, SEA, cytoplasmic tail) and measure
    both cuticle attachment and nlp-29 AMP reporter induction, to separate the adhesion and damage-sensing
    functions.
