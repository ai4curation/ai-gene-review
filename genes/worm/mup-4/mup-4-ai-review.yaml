- id: PMID:37759445
  title: C. elegans Hemidesmosomes Sense Collagen Damage to Trigger Innate Immune Response in the Epidermis.
  findings:
  - statement: Damage to specific DPY collagens separates BLI-1 (a presumptive ligand) from MUP-4 and
      releases STA-2. Direct BLI-1/MUP-4 binding is not yet validated biochemically.
    supporting_text: However, the direct binding between BLI-1 and MUP-4 requires biochemical methods
      for further validation.
core_functions:
- description: Transmembrane receptor of the apical epidermal hemidesmosome. It adheres the apical epidermal
    membrane and intermediate filament network to the cuticle, so that muscle force is transmitted across
    the epidermis. It is essential for epidermal integrity, embryonic elongation and muscle position.
  molecular_function:
    id: GO:0098631
    label: cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0007160
    label: cell-matrix adhesion
  locations:
  - id: GO:0030056
    label: hemidesmosome
  supported_by:
  - reference_id: PMID:11470827
    supporting_text: Analyses of the localization of MUP-4 and the ultrastructural lesions in mutants
      support the hypothesis that MUP-4 functions to tether IFs and to adhere the hypodermis to the apical
      ECM, thus providing a mechanical link that transmits muscle forces to the cuticle.
  - reference_id: PMID:11470827
    supporting_text: In contrast, all mup-4 mutants (n = 14) showed a lesion between the apical hypodermal
      membrane and the cuticle.
- description: Binds and holds the STAT-like transcription factor STA-2 at apical hemidesmosomes. When
    the cuticle-hemidesmosome link is broken (by hemidesmosome disruption, or by damage to specific DPY
    collagens that separates the proposed ligand BLI-1 from MUP-4), STA-2 is released and induces AMP
    genes, bypassing the p38 MAPK cascade. The MUP-4 ectodomain is needed to keep STA-2 at hemidesmosomes.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  locations:
  - id: GO:0030056
    label: hemidesmosome
  in_complex:
