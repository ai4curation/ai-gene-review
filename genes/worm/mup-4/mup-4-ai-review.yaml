gene_symbol: mup-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MUP-4 is a large single-pass transmembrane receptor of the C. elegans epidermis (hypodermis).
  Its extracellular region has 28 EGF-like repeats (many of the calcium-binding type), a von Willebrand
  factor A domain and two SEA modules. Its intracellular domain resembles the intermediate filament-associated
  protein filaggrin. MUP-4 localizes to the apical hemidesmosomes (fibrous organelles) that overlie body
  wall muscles, and to other sites where cells attach mechanically to cuticle. There it anchors the apical
  epidermal membrane and its intermediate filament network to the cuticle, forming part of the mechanical
  link that transmits muscle force across the epidermis. mup-4 mutants detach the epidermis from the cuticle,
  fail epidermal enclosure or elongation, and displace body wall muscles. MUP-4 also binds the STAT-like
  transcription factor STA-2 at hemidesmosomes. When hemidesmosomes or specific cuticle collagens are
  damaged, STA-2 is released and drives antimicrobial peptide gene expression. This makes the MUP-4/STA-2
  complex a sensor of structural damage in the epidermis. The cuticle collagen BLI-1 is a proposed extracellular
  ligand.
