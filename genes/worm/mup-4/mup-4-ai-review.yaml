  review:
    summary: IBA transfer of extracellular matrix structural constituent from fibrillin (FBN1) and C.
      elegans FBN-1.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PANTHER family (PTHR24039, fibrillin-related) groups proteins by their arrays of calcium-binding
      EGF repeats. Fibrillins are secreted microfibril components, but MUP-4 is a single-pass transmembrane
      receptor. It mediates attachment between the apical membrane and the cuticle and is not itself an
      ECM structural constituent. MUP-4 sits in its own subfamily (PTHR24039:SF40). The comparable apical
      hemidesmosome receptor MUA-3 carries the same IBA, which reflects family scope rather than evidence
      for either protein.
    supported_by:
    - reference_id: PMID:11470827
      supporting_text: Here, we report that mup-4 encodes a novel transmembrane protein that is required
        for attachments between the apical epithelial surface and the cuticular matrix.
