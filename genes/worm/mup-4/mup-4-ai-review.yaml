- term:
    id: GO:0007160
    label: cell-matrix adhesion
  evidence_type: IMP
  original_reference_id: PMID:11470827
  review:
    summary: In all mup-4 mutants examined by electron microscopy, the apical epidermal membrane separates
      from the cuticle. MUP-4 is the transmembrane receptor of the apical hemidesmosome.
    action: NEW
    reason: 'MUP-4 is a structural participant here, not just a required factor: it is the transmembrane
      protein that physically links the apical membrane to the cuticular matrix, and its loss causes a
      lesion exactly at that interface. Comparator check: MUA-3, the other apical hemidesmosome transmembrane
      receptor (characterized in PMID:11470828), is annotated to GO:0007160 cell-matrix adhesion by IMP.
      MUP-4 lacks any adhesion process term.'
    supported_by:
    - reference_id: PMID:11470827
      supporting_text: In contrast, all mup-4 mutants (n = 14) showed a lesion between the apical hypodermal
        membrane and the cuticle.
    - reference_id: PMID:11470827
      supporting_text: Analyses of the localization of MUP-4 and the ultrastructural lesions in mutants
        support the hypothesis that MUP-4 functions to tether IFs and to adhere the hypodermis to the
        apical ECM, thus providing a mechanical link that transmits muscle forces to the cuticle.
