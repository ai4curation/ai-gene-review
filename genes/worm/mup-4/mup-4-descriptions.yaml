gene_symbol: mup-4
organism: worm
uniprot_id: Q21281
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for junctional attachments between hypodermis and muscle, and between
    the apical epithelial surface and the cuticular matrix. Essential for enclosure
    of the embryo by the hypodermis, hypodermal integrity, embryo elongation, and
    maintenance of hypodermal morphology in fully elongated embryos.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21281
  source_id: Q21281
- source: Alliance_Imported
  text: The mup-4 gene encodes a novel transmembrane protein required for junctional
    attachments between hypodermis and muscle, and between the apical epithelial surface
    and the cuticular matrix.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003497;class=Gene
  source_id: WB:WBGene00003497
- source: Alliance_Automated
  text: Predicted to be an extracellular matrix structural constituent. Located in
    hemidesmosome. Part of hemidesmosome associated protein complex. Is expressed
    in body wall musculature; hypodermis; pharynx; touch receptor neurons; and vulval
    cell. Orthologous to human MATN1 (matrilin 1) and MATN2 (matrilin 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003497;class=Gene
  source_id: WB:WBGene00003497
