id: G5ECU5
gene_symbol: F44E5.4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: F44E5.4 and F44E5.5 are two adjacent, identical-coding genes that encode the same inducible
  cytosolic HSP70 chaperone (UniProt G5ECU5), closely related to HSP-70 (C12C8.1) and to the mammalian
  inducible HSPA1A/B proteins. The protein has a complete HSP70 architecture - N-terminal ATPase nucleotide-binding
  domain, substrate-binding domain and C-terminal EEVD co-chaperone-binding motif - and no ER or mitochondrial
  targeting signal. It is one of the four cytosolic HSP70s of C. elegans and is monitored alongside C12C8.1
  as a stress-inducible cytoplasmic chaperone of the heat shock response. By homology it is an ATP-dependent
  folding chaperone that binds and refolds denatured proteins with J-domain and nucleotide-exchange co-chaperones;
  no gene-specific functional study has been reported.
