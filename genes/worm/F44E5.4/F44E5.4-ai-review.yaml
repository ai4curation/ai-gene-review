core_functions:
- description: 'Stress-inducible cytosolic ATP-dependent folding chaperone (inferred from family membership
    and the HSP70 PAINT node): binds unfolded/misfolded proteins and refolds them using ATP hydrolysis,
    in partnership with HSP40 and NEF co-chaperones.'
