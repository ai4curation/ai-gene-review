proposed_new_terms: []
suggested_questions:
- question: Is the F44E5.4/F44E5.5 protein heat-inducible to the same extent and in the same tissues as
    C12C8.1, and are they functionally redundant?
- question: Do the F44E5.4/5 loci also produce endogenous siRNAs that regulate the HSP70 transcripts,
    as suggested by small-RNA studies of this locus?
suggested_experiments:
- description: Measure F44E5.4/5 mRNA and protein (gene-specific primers / tagged allele) after heat shock
    in wild type and hsf-1 mutants, and test thermotolerance of a CRISPR deletion of both copies alone
    and combined with C12C8.1 loss.
  hypothesis: F44E5.4/5 is a direct HSF-1 target that contributes, redundantly with C12C8.1, to refolding
    capacity and thermotolerance after heat shock.
