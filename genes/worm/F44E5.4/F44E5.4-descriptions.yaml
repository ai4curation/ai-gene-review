    overall_notes: Correctly calls it an Hsp70 family member, but 'precise role not
      yet known' from RNAi screens is uninformative and omits its identity as an inducible
      cytosolic HSPA1-like chaperone identical to F44E5.5.
- source: Alliance_Automated
