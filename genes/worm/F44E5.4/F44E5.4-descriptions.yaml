descriptions:
- source: Alliance_Imported
  text: F44E5.4 encodes a member of the Hsp70 family of heat shock proteins; as loss
    of F44E5.4 activity via large-scale RNAi screens results in no obvious defects,
    the precise role of F44E5.4 in C. elegans development and/or behavior is not yet
    known.
