    overall_notes: Generic by-similarity prefoldin text plus spindle positioning.
- source: Alliance_Imported
  text: pfd-6 encodes a putative prefoldin 6 subunit, orthologous to human PFDN6 (OMIM:605660),
    required for normal microtubule growth and distal tip cell migration; PFD-6 is
    expressed cytoplasmically in most, if not all, tissues, including the germline;
    in mass RNAi assays, PFD-6 is required for normal mitotic spindle position, embryonic
    and larval viability, fertility, body shape, vulval development, and locomotion,
    and for normally rapid growth; pfd-6(RNAi) embryos show a reduced microtubule
    growth rate.
  source_type: curated
