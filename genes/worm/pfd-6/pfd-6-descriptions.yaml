gene_symbol: pfd-6
organism: worm
uniprot_id: P52554
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins
    to it. Binds to nascent polypeptide chain and promotes folding in an environment
    in which there are many competing pathways for nonnative proteins (By similarity).
    Required for positioning of the mitotic spindle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52554
  source_id: P52554
- source: Alliance_Imported
  text: pfd-6 encodes a putative prefoldin 6 subunit, orthologous to human PFDN6 (OMIM:605660),
    required for normal microtubule growth and distal tip cell migration; PFD-6 is
    expressed cytoplasmically in most, if not all, tissues, including the germline;
    in mass RNAi assays, PFD-6 is required for normal mitotic spindle position, embryonic
    and larval viability, fertility, body shape, vulval development, and locomotion,
    and for normally rapid growth; pfd-6(RNAi) embryos show a reduced microtubule
    growth rate.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00009004;class=Gene
  source_id: WB:WBGene00009004
- source: Alliance_Automated
  text: Predicted to enable protein-folding chaperone binding activity. Predicted
    to be involved in protein folding. Located in cytoplasm. Is expressed in body
    wall musculature; hypodermal cell; intestinal cell; muscle cell; and neurons.
    Orthologous to human PFDN6 (prefoldin subunit 6).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00009004;class=Gene
  source_id: WB:WBGene00009004
- source: RefSeq
  text: Predicted to enable protein-folding chaperone binding activity. Predicted
    to be involved in chaperone-mediated protein complex assembly and protein folding.
    Located in cytoplasm. Is expressed in body wall musculature; hypodermal cell;
    intestinal cell; muscle cell; and neurons. Orthologous to human PFDN6 (prefoldin
    subunit 6). [provided by Alliance of Genome Resources, Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/172474
  source_id: GeneID:172474
