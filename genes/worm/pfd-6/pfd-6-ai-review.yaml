      PFD-2, PFD-4, and PFD-6 and α-type PFD-3 and PFD-5.
suggested_questions:
- question: Is PFD-6 binding to DAF-16/FOXO a chaperone-like activity of the R2TP/prefoldin-like complex,
    or a direct transcriptional coregulator function of PFD-6? Which GO molecular function term, if any,
    should record it?
- question: Does PFD-6 contribute to a C. elegans R2TP/prefoldin-like (URI-1/UXT/PDRG1) complex as well
    as canonical prefoldin, and do the two pools have separable functions?
- question: Which clients other than actin and tubulin does C. elegans prefoldin deliver to CCT in vivo,
    and does dependence on prefoldin differ between tissues?
suggested_experiments:
- description: Pull down endogenously tagged PFD-6 (CRISPR knock-in) and identify co-purifying proteins
    by mass spectrometry, to tell canonical prefoldin from R2TP/prefoldin-like complex membership and
    to find clients.
- description: Use auxin-inducible degradation of PFD-6 in specific tissues, then measure alpha/beta-tubulin
    and actin levels and microtubule growth rate (EB1 tracking), to define the tissue-specific requirement.
