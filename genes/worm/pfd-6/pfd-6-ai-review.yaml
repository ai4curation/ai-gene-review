  label: Caenorhabditis elegans
description: PFD-6 (F21C3.5) is a beta-class subunit of C. elegans prefoldin, the ortholog of human PFDN6.
  In the cytosolic prefoldin heterohexamer, it helps capture non-native actin and tubulin chains and pass
  them to the CCT/TRiC chaperonin. Strong loss of pfd-6 causes embryonic lethality and larval arrest,
  and prefoldin knockdown impairs tubulin biogenesis, spindle positioning and distal tip cell migration.
  PFD-6 is also found in nuclei. It binds UXT, a homolog of a component of the R2TP/prefoldin-like complex,
  and binds the FOXO transcription factor DAF-16. PFD-6 levels rise with reduced insulin/IGF-1 signaling
  in an HSF-1-dependent manner, and PFD-6 is required in the intestine and hypodermis for the full lifespan
  extension of daf-2 mutants, where it enhances expression of DAF-16 target genes.
