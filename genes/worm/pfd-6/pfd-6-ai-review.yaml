core_functions:
- description: PFD-6 contributes a beta-class subunit to the cytosolic prefoldin heterohexamer. Prefoldin
    binds non-native actin and tubulin chains without ATP and delivers them to the CCT/TRiC chaperonin,
    which supports efficient alpha-tubulin biogenesis and microtubule growth in C. elegans embryos and
    in migrating distal tip cells.
