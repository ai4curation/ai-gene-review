id: Q21480
gene_symbol: atg-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ATG-2 is the C. elegans member of the ATG2 family, a very large (2290 aa) rod-shaped bridge-like
  lipid transfer protein of the chorein/VPS13 superfamily. By homology with yeast Atg2 and human ATG2A,
  ATG-2 tethers the rim of the expanding phagophore (isolation membrane) to the endoplasmic reticulum
  and moves glycerophospholipids from the ER to the phagophore, supplying membrane for its growth. ATG-2
  binds the PROPPIN EPG-6 (WIPI3/4 ortholog) directly, and the ATG-2/EPG-6 complex is needed for PI3P-positive
  omegasomes to progress to closed autophagosomes; atg-2 mutants accumulate enlarged early autophagic
  structures, mislocalise ATG-9 and ATG-13, and fail to degrade protein aggregates such as PGL granules
  during embryogenesis. In neurons, ATG-2 acts cell-autonomously in the autophagy needed for presynaptic
  assembly.
