- term:
    id: GO:0120013
    label: lipid transfer activity
  evidence_type: ISS
  original_reference_id: PMID:30952800
  qualifier: enables
  review:
    summary: ATG2-family lipid transfer activity, transferred from human ATG2A and fission-yeast Atg2.
    action: NEW
    reason: 'Lipid transfer is the defining biochemical activity of ATG2 proteins: human ATG2A and S.
      pombe Atg2 bind many glycerophospholipids in an N-terminal hydrophobic channel and transfer them
      between membranes in vitro, and the lipid-transfer region is sufficient to rescue autophagosome
      formation. C. elegans ATG-2 is a full-length ATG2 family member (Chorein/ATG2_CAD domains) whose
      loss blocks phagophore expansion, so the activity is expected to be conserved. Comparator: human
      ATG2A and ATG2B carry GO:0120013. UniProt also describes ATG-2 as a lipid transfer protein by similarity.
      ATG-2 itself does the transfer, so this is the gene doing the work, not a requirement.'
    supported_by:
    - reference_id: PMID:30952800
      supporting_text: ATG2A can bind tens of glycerophospholipids at once and transfers lipids robustly
        in vitro
    - reference_id: PMID:30911189
      supporting_text: These results suggest that Atg2 acts as a lipid-transfer protein that supplies
        phospholipids for autophagosome formation
    - reference_id: file:worm/atg-2/atg-2-uniprot.txt
      supporting_text: Lipid transfer protein involved in autophagosome assembly
