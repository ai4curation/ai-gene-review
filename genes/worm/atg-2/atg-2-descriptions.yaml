- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol-3-phosphate binding activity and
    protein-membrane adaptor activity. Involved in positive regulation of autophagy.
    Located in cytoplasm. Is expressed in several structures, including intestine;
    nervous system; pharynx; seam cell; and spermathecal-uterine junction. Orthologous
    to human ATG2A (autophagy related 2A) and ATG2B (autophagy related 2B).
  source_type: automated
