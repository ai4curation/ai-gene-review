    - rubric: specificity
      score: 5
    overall_notes: 'Accurate: lipid transfer from ER to isolation membrane (by similarity),
      ATG-9/ATG-13 distribution, rRNA autophagy. Omits EPG-6 partner.'
- source: Alliance_Imported
  text: atg-2 encodes a large (2,275-residue) protein orthologous to theautophagic
    budding yeast protein Atg2p, and to human ATG2A and ATG2B;ATG-2 is expressed in
    larval and adult pharynx, intestine, body wall   muscles, and neurons, as well
    as adult reproductive system; ATG-2 has noobvious phenotype in mass RNAi assays.
