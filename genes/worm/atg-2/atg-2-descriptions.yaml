descriptions:
- source: UniProt
  text: Lipid transfer protein involved in autophagosome assembly and in the distribution
    of atg-9 and atg-13 during the autophagy-mediated degradation of protein aggregates
    (PubMed:21802374, PubMed:25124690). Tethers the edge of the isolation membrane
    (IM) to the endoplasmic reticulum (ER) and mediates direct lipid transfer from
    ER to IM for IM expansion (By similarity). Binds to the ER exit site (ERES), which
    is the membrane source for autophagosome formation, and extracts phospholipids
    from the membrane source to the IM for membrane expansion (By similarity). Involved
    in autophagy-mediated degradation of ribosomal RNA and ribosomal proteins in lysosomes,
    which is essential for maintaining nucleotide homeostasis (PubMed:30102152).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21480
  source_id: Q21480
