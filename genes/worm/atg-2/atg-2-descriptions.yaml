gene_symbol: atg-2
organism: worm
uniprot_id: Q21480
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Lipid transfer protein involved in autophagosome assembly and in the distribution
    of atg-9 and atg-13 during the autophagy-mediated degradation of protein aggregates
    (PubMed:21802374, PubMed:25124690). Tethers the edge of the isolation membrane
    (IM) to the endoplasmic reticulum (ER) and mediates direct lipid transfer from
    ER to IM for IM expansion (By similarity). Binds to the ER exit site (ERES), which
    is the membrane source for autophagosome formation, and extracts phospholipids
    from the membrane source to the IM for membrane expansion (By similarity). Involved
    in autophagy-mediated degradation of ribosomal RNA and ribosomal proteins in lysosomes,
    which is essential for maintaining nucleotide homeostasis (PubMed:30102152).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21480
  source_id: Q21480
- source: Alliance_Imported
  text: atg-2 encodes a large (2,275-residue) protein orthologous to theautophagic
    budding yeast protein Atg2p, and to human ATG2A and ATG2B;ATG-2 is expressed in
    larval and adult pharynx, intestine, body wall   muscles, and neurons, as well
    as adult reproductive system; ATG-2 has noobvious phenotype in mass RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019748;class=Gene
  source_id: WB:WBGene00019748
- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol-3-phosphate binding activity and
    protein-membrane adaptor activity. Involved in positive regulation of autophagy.
    Located in cytoplasm. Is expressed in several structures, including intestine;
    nervous system; pharynx; seam cell; and spermathecal-uterine junction. Orthologous
    to human ATG2A (autophagy related 2A) and ATG2B (autophagy related 2B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00019748;class=Gene
  source_id: WB:WBGene00019748
