      element in a reporter abolishes neuronal exon 7a selection in vivo.
    action: NEW
    reason: This is the direct experimental basis for the core molecular function of UNC-75 and
      is not represented in GOA (the existing binding rows are generic or mRNA-scoped). The
      bound RNA is an intronic segment of a pre-mRNA that UNC-75 regulates in vivo; Norris 2014
      independently shows binding to an intronic motif downstream of unc-16 exon 16.
    supported_by:
    - reference_id: PMID:23468662
      supporting_text: UNC-75 shifted the mobility of Probe 2-2-1 (Figure 5C, lanes 1–4, 25–28),
        demonstrating that UNC-75 directly and specifically binds to the 2-1-1 fragment in this
        region.
    - reference_id: PMID:23468662
      supporting_text: indicating that only RRM3 can bind to Probe 2-1-1 by itself
    - reference_id: PMID:23468662
      supporting_text: confirming that the stretch is essential for the selection of exon 7a in
        the nervous system in vivo
