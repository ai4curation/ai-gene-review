suggested_questions:
- question: Does UNC-75, like vertebrate CELF1/2, have any cytoplasmic role in mRNA stability or
    translation, or is it exclusively nuclear? The answer decides whether the family-level
    cytoplasm IBA should carry a NOT for the CELF3-6-like branch.
  experts:
  - PANTHER/PAINT curators
  - C. elegans neuronal splicing researchers
- question: Should the GO_REF:0000108 inter-ontology rule that infers located_in synapse from
    synaptic transmission process annotations be suppressed when the source row is an IMP
    phenotype for a nuclear regulator?
  experts:
  - GO Central
suggested_experiments:
- description: CLIP-seq (e.g. iCLIP or TRIBE) of endogenously tagged UNC-75 in neurons, combined
    with nuclear/cytoplasmic fractionation, to map direct binding sites genome-wide and test for
    any cytoplasmic mRNA targets.
- description: Identify proteins co-purifying with UNC-75 on the unc-32 exon 4 cluster pre-mRNA
    to find the postulated cooperative factors.
