- id: PMID:23468662
  title: CELF family RNA-binding protein UNC-75 regulates two sets of mutually exclusive exons
    of the unc-32 gene in neuron-specific manners in Caenorhabditis elegans.
  findings:
  - statement: UNC-75 directly binds a UUGUUGUGUUGU element in unc-32 intron 7a via its RRMs
      (RRM3 alone suffices) and is required for neuron-specific selection of unc-32 exons 7a and
      4b.
    supporting_text: UNC-75 specifically binds via its three RNA recognition motifs to the
      element including a UUGUUGUGUUGU stretch
  - statement: The C-terminal PY-NLS is required for UNC-75 nuclear localization.
    supporting_text: confirming that the C-terminal motif of UNC-75 functions as the PY-NLS
  - statement: UNC-75 represses its own exon 8.
    supporting_text: consistent with the idea that UNC-75 negatively regulates its own
      expression by repressing exon 8
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Key biochemical and genetic paper; not cited in GOA for
      G5EE68.
- id: PMID:24910101
  title: A pair of RNA-binding proteins controls networks of splicing events contributing to
    specialization of neural cell types.
  findings:
  - statement: UNC-75 and EXC-7 regulate overlapping neuron-subtype-specific exon networks;
      UNC-75 binds U[G/A]UUGUG motifs and generally promotes inclusion from downstream introns;
      targets include unc-16 and unc-64.
    supporting_text: UNC-75 generally stimulates exon inclusion by binding to downstream
