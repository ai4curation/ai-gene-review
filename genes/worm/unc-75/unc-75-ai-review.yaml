- description: Neuron-specific regulator of alternative splicing that both activates and
    represses particular splice sites, selecting unc-32 exons 7a and 4b, promoting unc-16 exon 16
    inclusion and tuning unc-64/syntaxin final-exon usage, often together with EXC-7 (Hu/ELAV)
    and the RBFOX proteins ASD-1 and FOX-1.
  directly_involved_in:
