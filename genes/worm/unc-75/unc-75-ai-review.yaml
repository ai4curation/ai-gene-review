    supporting_text: UNC-75 represses splicing of exon 3 to exon 4c and exon 4a to exon 5 and
      promotes splicing of exon 4b to exons 3 and 5.
  - reference_id: PMID:24910101
    supporting_text: These results indicate that unc-64 isoforms A and B have non-overlapping
      functions, and that the relative proportions of these isoforms are fine-tuned by UNC-75.
  knowledge_gaps:
