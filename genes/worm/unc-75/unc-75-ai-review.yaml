    action: ACCEPT
    reason: Regulation of alternative splicing is the defining, experimentally established
      activity of UNC-75 (unc-32 exons 4 and 7, unc-16 exon 16, genome-wide exon networks). The
      IBA says this function is inherited across the CELF clade, which agrees with the worm
      data. UNC-75 both activates and represses particular splice sites, so the unsigned
      regulation term is the right level.
