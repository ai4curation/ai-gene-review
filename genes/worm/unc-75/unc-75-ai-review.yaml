  review:
    summary: unc-75 null mutants alter neuron-subtype-specific alternative splicing of unc-16
      exon 16 and of a genome-wide network of exons; mutation of the intronic UNC-75 motif
      phenocopies the mutant.
    action: ACCEPT
    reason: Full text read. Loss of UNC-75 and mutation of its cis-motif in a reporter both
      shift exon choice, and UNC-75 binds that motif directly, so the protein itself performs the
      regulatory step. This is the core process of the gene.
    supported_by:
    - reference_id: PMID:24910101
      supporting_text: These results strongly support a model where UNC-75 and EXC-7
