id: G5EE68
gene_symbol: unc-75
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  UNC-75 is the Caenorhabditis elegans CELF (CUG-BP and ETR-3-like factor) family RNA-binding
  protein, related to the vertebrate CELF3-6 subfamily, with two N-terminal RRMs, a divergent
  linker domain and a C-terminal RRM followed by a PY-type nuclear localization signal. It is
  expressed throughout the nervous system and in neurosecretory gland cells, and resides in the
  nucleus in dynamic nuclear speckles. UNC-75 binds UG-rich elements (UUGUUGUGUUGU;
  RNAcompete consensus U[G/A]UUGUG) in introns of its target pre-mRNAs, RRM3 providing
  the core specificity, and acts as a neuron-specific regulator of alternative splicing. It
  selects unc-32 exon 7a (with the RBFOX proteins ASD-1 and FOX-1) and exon 4b, promotes
  inclusion of unc-16 exon 16 and adjusts unc-64/syntaxin final-exon usage, often together
  with the Hu/ELAV protein EXC-7. It generally enhances inclusion when bound downstream of an
  exon, and it represses its own exon 8. Through its network of neuronal splicing targets,
  UNC-75 is needed for normal locomotion and for normal cholinergic and GABAergic synaptic
  transmission, but not for neuronal development.
