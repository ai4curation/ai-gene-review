id: Q20303
gene_symbol: elo-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ELO-6 is a C. elegans member of the ELO family of fatty acid elongases, seven-transmembrane
  endoplasmic reticulum enzymes that catalyse the malonyl-CoA dependent condensation (3-ketoacyl-CoA synthase)
  step of the fatty acid elongation cycle. Genetic analysis shows that ELO-6 is required for normal levels
  of the monomethyl branched-chain fatty acid isoheptadecanoate (C17ISO), and it is inferred to elongate
  isopentadecanoyl-CoA (C15ISO) to C17ISO, acting downstream of ELO-5, which is needed for both C15ISO
  and C17ISO. elo-6 is expressed in the intestine, neurons, pharynx and vulval muscles, and its expression
  depends partly on the SREBP homologue LPD-1. Unlike elo-5, elo-6 knockdown causes no obvious growth
  or developmental defect.
