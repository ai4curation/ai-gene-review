  title: WormBase gene description for elo-6 (worm)
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: WormBase curated description. The paralogy to elo-1 and elo-2 is
      correct. The claim that ELO-6 "may be required for a normally high growth rate" is
      not supported by the targeted study, in which elo-6 RNAi caused no obvious growth or
      morphological defect while elo-5 RNAi did (PMID:15340492); it probably derives from a
      large-scale RNAi screen that we could not check. The text also omits the one
      function shown for ELO-6, elongation of C15ISO to the monomethyl branched-chain fatty
      acid C17ISO (PMID:15340492). Not used as support.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001244
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: "ELO-6 may be required for a normally high growth rate"
      confidence: PROBABLE
      explanation: The WormBase gene description says "ELO-6 may be required for a
        normally high growth rate" and describes ELO-6 only as a paralog of the PUFA
        elongases elo-1 and elo-2. In the targeted study of elo-5 and elo-6
        (PMID:15340492), elo-6 RNAi did not cause obvious morphological or growth defects,
        and lowered only the monomethyl branched-chain fatty acid C17ISO, suggesting that
        ELO-6 elongates C15ISO to C17ISO. Please check the source of the growth-rate
        statement and consider adding the branched-chain fatty acid elongation role.
      supported_by:
      - reference_id: PMID:15340492
        supporting_text: While the suppression of elo-6 activity by feeding double-stranded
          RNA (dsRNA) to wild-type animals did not cause obvious morphological or growth
          defects, the suppression of elo-5 resulted in more pronounced phenotypes
      - reference_id: PMID:15340492
        supporting_text: The RNAi of elo-6 significantly reduced the amount of only C17ISO
