suggested_questions:
- question: UniProt attributes the C15ISO-CoA to 3-oxo-C17ISO-CoA reaction (RHEA:35335) to PMID:15340492
    with ECO:0000269, but that paper reports only RNAi fatty-acid profiles, not an enzyme assay. Should
    the evidence be ECO:0000305/ISS-level until a biochemical assay exists?
- question: Does ELO-6 accept straight-chain saturated or unsaturated acyl-CoAs as well as C15ISO-CoA,
    or is it specific for iso-branched substrates?
suggested_experiments:
- description: Express ELO-6 in a yeast elo-deficient strain or assay microsomes with C15ISO-CoA and malonyl-CoA
    to confirm 3-oxo-isoheptadecanoyl-CoA formation and define substrate range.
- description: Localise endogenously tagged ELO-6 and analyse an elo-6 deletion allele for fatty acid
    composition and C17ISO-dependent phenotypes.
