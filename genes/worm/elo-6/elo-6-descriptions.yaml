    overall_notes: Correct condensing enzyme for C17iso.
- source: Alliance_Imported
  text: The elo-6 gene encodes a paralog of elo-1 and elo-2, each of which encodes
    a polyunsaturated fatty acid (PUFA) elongase; ELO-6 may be required for a normally
    high growth rate.
