gene_symbol: elo-6
organism: worm
uniprot_id: Q20303
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Catalyzes the first and rate-limiting reaction of the four reactions that
    constitute the long-chain fatty acids elongation cycle. Uses malonyl-CoA to add
    2 carbons per cycle to the chain of long-chain fatty acids. Condensing enzyme
    required for the formation of isoheptadecanoate (C17iso), which plays critical
    roles in animal development and growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20303
  source_id: Q20303
- source: Alliance_Imported
  text: The elo-6 gene encodes a paralog of elo-1 and elo-2, each of which encodes
    a polyunsaturated fatty acid (PUFA) elongase; ELO-6 may be required for a normally
    high growth rate.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001244;class=Gene
  source_id: WB:WBGene00001244
- source: Alliance_Automated
  text: Predicted to enable fatty acid elongase activity. Involved in methyl-branched
    fatty acid biosynthetic process. Predicted to be located in membrane. Predicted
    to be active in endoplasmic reticulum membrane. Is expressed in amphid neurons;
    intestine; nerve ring; and vulva.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001244;class=Gene
  source_id: WB:WBGene00001244
- source: RefSeq
