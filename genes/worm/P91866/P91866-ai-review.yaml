core_functions: []
suggested_questions:
- question: Is F32H2.6 transcribed and translated into a stable protein, or is it a partial
    duplication of fasn-1 that behaves as a transcribed pseudogene?
- question: Do F32H2.6 transcripts or peptides have any regulatory relationship with fasn-1 (for
    example through shared small RNAs, given their extended nucleotide identity)?
suggested_experiments:
- description: >-
    Generate an F32H2.6-specific deletion by CRISPR (avoiding sequence shared with fasn-1) and test
    viability, development and fatty acid composition, in parallel with an endogenous epitope tag to
    detect the protein.
  hypothesis: F32H2.6 is dispensable, and the larval arrest seen after combined RNAi reflects loss
    of fasn-1.
