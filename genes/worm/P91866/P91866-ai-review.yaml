id: P91866
gene_symbol: F32H2.6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  F32H2.6 (WBGene00009343, chromosome I) encodes a predicted 187-residue protein (UniProtKB P91866)
  that is a partial paralog of the N-terminal region of FASN-1 (F32H2.5), the single full-length
  multifunctional type I fatty acid synthase of C. elegans, encoded at the neighbouring locus.
  Residues 1-167 are about two-thirds identical to FASN-1 residues 28-194 and contain only the
  first part of the beta-ketoacyl synthase (KS) N-terminal subdomain (Pfam ketoacyl-synt). The
  similarity ends just before the KS active-site motif, so the product lacks the catalytic
  cysteine and both catalytic histidines of the KS domain, as well as the KS C-terminal subdomain
  and all downstream fatty acid synthase domains. It is therefore not expected to have
  ketoacyl synthase or other acyltransferase activity. The gene shares extended nucleotide
  identity with fasn-1, consistent with a partial duplication. No study has addressed whether a
  stable protein is made or what its function, if any, is; combined RNAi against fasn-1 and
  F32H2.6 causes larval arrest, but the phenotype cannot be separated from loss of fasn-1.
existing_annotations:
- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR016039
  review:
    summary: >-
      Electronic InterPro2GO annotation from the Thiolase-like superfamily signature (IPR016039).
      The mapping is reasonable for complete thiolase-fold condensing enzymes, whose
      acyltransferase chemistry depends on a catalytic cysteine that forms the acyl-enzyme
      intermediate, assisted by two histidines. P91866 matches only the first ~140 residues of
      the KS N-terminal subdomain of FASN-1; the alignment to FASN-1 and to human FASN stops
      immediately before the active-site motif (human FASN DTACSSS, Cys161), and none of the
      three catalytic residues has a counterpart. Without them the fragment cannot catalyse acyl
      transfer, and no experimental evidence of any activity exists. The only literature (Kniazeva
      et al. 2004) describes F32H2.6 as encoding just the N-terminal portion of fatty acid
      synthase.
    action: REMOVE
    reason: >-
      Demonstrably wrong electronic transfer: the superfamily signature is matched by a
      catalytically incomplete fragment that lacks the KS catalytic Cys-His-His triad and the
      KS C-terminal subdomain, so the activity implied by the mapping cannot be performed by this
      product. This is a pseudoenzyme/fragment over-annotation, not a true-but-broad term, so
      no replacement is proposed.
    supported_by:
    - reference_id: PMID:15340492
      supporting_text: There is one predicted FAS gene, F32H2.5, and its shorter homolog, F32H2.6,
        in the C. elegans genome. The latter can only encode the N-terminal portion of the protein.
    - reference_id: file:worm/P91866/P91866-bioinformatics/RESULTS.md
      supporting_text: the KS catalytic
        cysteine (FASN C161) and the two catalytic histidines (H293, H331) have no counterpart in P91866.
    - reference_id: file:worm/P91866/P91866-deep-research-manual.md
      supporting_text: PubMed searches for "F32H2.6" return no paper about the gene.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR016039
      slot: interpro2go
      requested_change: DELETE_ROW
      asserted_value: GO:0016746
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The InterPro2GO mapping IPR016039 (Thiolase-like) -> GO:0016746 acyltransferase activity is
        applied to P91866 (C. elegans F32H2.6), a 187-residue fragment homologous only to the
        N-terminal ~170 residues of fatty acid synthase FASN-1. The match ends before the KS
        active-site cysteine, and the protein lacks the catalytic Cys and both catalytic His
        residues of the ketoacyl synthase domain, so it cannot have acyltransferase activity. The
        mapping should not be applied to partial matches that lack the catalytic residues (for
        example, by requiring the KS active-site region or PF02801 KS C-terminal domain).
