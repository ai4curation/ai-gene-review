  findings:
  - statement: F32H2.6 is a shorter homolog of the single predicted fatty acid synthase gene F32H2.5
      (fasn-1) and can encode only the N-terminal part of the protein.
    supporting_text: There is one predicted FAS gene, F32H2.5, and its shorter homolog, F32H2.6, in
