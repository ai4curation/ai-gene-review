  source_id: Q966L9
- source: Alliance_Imported
  text: glh-2 encodes a putative DEAD-box RNA helicase that contains six CCHC zinc
    fingers and is homologous to Drosophila VASA, a germ-line-specific, ATP-dependent,
    RNA helicase; at non-permissive temperatures, GLH-2 plays a role in germ-line
    development and fertility, specifically in regulating the normal extent of germ-line
    proliferation, oogenesis, and the production of functional sperm; GLH-2 activity
    may also be required for the wild-type morphology of P granules and for localization
    of several protein components, but not accumulation of P granule mRNA components;
    GLH-2 interacts in vitro with itself and with KGB-1, a JNK-like MAP kinase; GLH-2
    is a constitutive P granule component and thus, with the exception of mature sperm,
    is expressed in germ cells at all stages of development; GLH-2 is cytoplasmic
    in oocytes and the early embryo, while perinuclear in all later developmental
    stages as well as in the distal and medial regions of the hermaphrodite gonad;
    GLH-2 is expressed at barely detectable levels in males.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001599;class=Gene
  source_id: WB:WBGene00001599
- source: Alliance_Automated
  text: Predicted to enable RNA helicase activity and mRNA binding activity. Involved
    in germ cell development and post-embryonic development. Located in P granule.
    Is expressed in germ line and gonad. Orthologous to human DDX4 (DEAD-box helicase
    4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001599;class=Gene
  source_id: WB:WBGene00001599
