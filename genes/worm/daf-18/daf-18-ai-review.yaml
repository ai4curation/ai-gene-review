    A pheromone-induced developmental switch in Caenorhabditis elegans: Temperature-sensitive
    mutants reveal a wild-type temperature-dependent process.
  findings: []
- id: PMID:25383666
  title: >-
    Caspase-activated phosphoinositide binding by CNT-1 promotes apoptosis by inhibiting the
    AKT pathway.
- id: PMID:8601482
  title: >-
    The age-1 and daf-2 genes function in a common pathway to control the lifespan of Caenorhabditis
    elegans.
core_functions:
- description: >-
    PIP3 3-phosphatase that converts PIP3 to PI(4,5)P2 at the plasma membrane, opposing AGE-1
    PI3K and limiting AKT recruitment, thereby negatively regulating DAF-2 insulin-like signalling.
  molecular_function:
    id: GO:0016314
    label: phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity
  directly_involved_in:
  - id: GO:0051898
    label: >-
      negative regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - id: GO:0046627
    label: negative regulation of insulin receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:10377431
    supporting_text: >-
      elegans, the PTEN homolog DAF-18 functions as a negative regulator of the DAF-2 and
      AGE-1 signaling pathway, consistent with the notion that DAF-18 acts a phosphatidylinositol
      3,4,5-trisphosphate phosphatase in vivo.
  - reference_id: PMID:25383666
    supporting_text: >-
      The PI3K and AKT pathway is negatively regulated by the lipid phosphatase DAF-18 (homologous
      to human Phosphatase and Tensin Homolog, PTEN), which dephosphorylates and converts
      PIP3 to PIP2 and blocks recruitment of AKT kinases to the plasma membrane28–31.
- description: >-
    Organismal outputs of PIP3 opposition: promotion of dauer formation and of normal adult
    lifespan.
  molecular_function:
    id: GO:0016314
    label: phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity
  directly_involved_in:
  - id: GO:0061066
    label: positive regulation of dauer larval development
  - id: GO:0008340
    label: determination of adult lifespan
  supported_by:
  - reference_id: PMID:10377431
    supporting_text: >-
      we have shown that mutation in daf-18 can completely suppress the dauer-constitutive
      phenotype caused by inactivation of daf-2 or age-1
  - reference_id: PMID:10377431
    supporting_text: >-
      In addition, daf-18(nr2037) dramatically shortens lifespan, both in a wild-type background
      and in a daf-2 mutant background that normally prolongs lifespan.
- description: >-
    Protein tyrosine phosphatase activity antagonising the VAB-1 Eph receptor in oocyte maturation,
    independent of PI3K signalling.
  molecular_function:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  supported_by:
  - reference_id: PMID:19853560
    supporting_text: >-
      We also present evidence that DAF-18 has protein phosphatase activity to antagonize
      VAB-1 action.
  - reference_id: PMID:19853560
    supporting_text: >-
      We show that in C. elegans, the VAB-1 Eph kinase domain physically interacts with and
      phosphorylates PTEN (DAF-18), diminishing its protein levels and function.
suggested_questions:
- question: >-
    Which DAF-18 functions (vulval MAPK inhibition, VAB-1 antagonism, germline quiescence)
    require protein versus lipid phosphatase activity in vivo?
- question: >-
    Does the ARR-1/MPZ-1/DAF-18 complex inhibit DAF-18 activity or its membrane recruitment?
suggested_experiments:
- description: >-
    Rescue daf-18 null animals with lipid-phosphatase-dead (G-to-E, PTEN G129E equivalent)
    and protein-phosphatase-dead (Y138L equivalent) transgenes and score dauer, lifespan,
    vulval and oocyte phenotypes.
  hypothesis: >-
    IIS phenotypes depend on lipid phosphatase activity while VAB-1 antagonism needs protein
    phosphatase activity.
