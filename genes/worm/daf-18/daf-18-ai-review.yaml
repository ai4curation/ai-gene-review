  review:
    summary: IEA (EC 3.1.3.16 mapping) protein serine/threonine phosphatase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      PTEN-family enzymes are dual-specificity protein phosphatases and DAF-18 has protein
      phosphatase activity toward VAB-1 (PMID:19853560), but the principal in vivo activity
      is PIP3 3-phosphatase. Serine/threonine protein dephosphorylation by DAF-18 specifically
      is by similarity to human PTEN. Non-core.
    supported_by:
    - reference_id: PMID:19853560
      supporting_text: >-
        We also present evidence that DAF-18 has protein phosphatase activity to antagonize
        VAB-1 action.
