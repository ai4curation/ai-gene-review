- term:
    id: GO:0006606
    label: protein import into nucleus
  evidence_type: IGI
  original_reference_id: PMID:11381260
  qualifier: acts_upstream_of_positive_effect
  supporting_entities:
  - WB:WBGene00000898
  review:
    summary: >-
      IGI protein import into nucleus (acts upstream of, positive effect) from Lin et al.
      2001: DAF-2 pathway activity prevents DAF-16 nuclear accumulation, and DAF-18 opposes
      the pathway.
    action: KEEP_AS_NON_CORE
    reason: >-
      DAF-18 does not participate in nuclear import machinery; it acts upstream by lowering
      PIP3 and AKT activity, thereby permitting DAF-16 nuclear entry. The acts-upstream-of
      qualifier captures this indirect relationship correctly; non-core.
    supported_by:
    - reference_id: PMID:11381260
      supporting_text: Here, we show that the DAF-2 pathway prevents DAF-16 accumulation in
        nuclei.
    - reference_id: PMID:10377431
      supporting_text: >-
        elegans, the PTEN homolog DAF-18 functions as a negative regulator of the DAF-2 and
        AGE-1 signaling pathway, consistent with the notion that DAF-18 acts a phosphatidylinositol
        3,4,5-trisphosphate phosphatase in vivo.
