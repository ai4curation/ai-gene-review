id: G5EE01
gene_symbol: daf-18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  DAF-18 is the Caenorhabditis elegans ortholog of the PTEN tumour suppressor, a phosphatidylinositol
  3,4,5-trisphosphate 3-phosphatase that also has dual-specificity protein phosphatase activity.
  By converting PIP3 back to PI(4,5)P2 at the plasma membrane it opposes the AGE-1 class I
  PI3K and limits recruitment and activation of PDK-1 and the AKT-1/AKT-2/SGK-1 kinases, thereby
  permitting nuclear entry of the FOXO factor DAF-16. Loss of daf-18 suppresses the dauer-constitutive
  and long-lived phenotypes of daf-2 and age-1 mutants and shortens lifespan. DAF-18 is found
  in the cytoplasm, at the plasma membrane and in nuclei, and is expressed in neurons. Beyond
  insulin-like signalling it promotes developmental neurite outgrowth, embryonic apoptosis
  and germline quiescence during diapause, antagonises the VAB-1 Eph receptor via protein
  phosphatase activity, and restrains RAS/MAPK signalling during vulval induction.
