    label: positive regulation of insulin receptor signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:20207731
  qualifier: involved_in
  review:
    summary: >-
      NAS positive regulation of insulin receptor signaling pathway (Palmitessa & Benovic
      2010, ARR-1/MPZ-1/DAF-18 complex).
    action: MODIFY
    reason: >-
      The sign is inverted. The cited abstract itself states DAF-18 normally serves as a suppressor
      of DAF-2 signaling; it is ARR-1 that positively regulates DAF-2 signalling. All genetic
      data place DAF-18 as the PIP3 phosphatase that antagonises DAF-2/AGE-1 signalling. The
      intended process is negative regulation.
    proposed_replacement_terms:
    - id: GO:0046627
      label: negative regulation of insulin receptor signaling pathway
    supported_by:
    - reference_id: PMID:20207731
      supporting_text: >-
        Interestingly, ARR-1 and MPZ-1 are found in a complex with the phosphatase and tensin
        homolog (PTEN) ortholog DAF-18, which normally serves as a suppressor of DAF-2 signaling,
        suggesting that these three proteins work together to regulate DAF-2 signaling.
    - reference_id: PMID:10377431
      supporting_text: >-
        elegans, the PTEN homolog DAF-18 functions as a negative regulator of the DAF-2 and
        AGE-1 signaling pathway, consistent with the notion that DAF-18 acts a phosphatidylinositol
        3,4,5-trisphosphate phosphatase in vivo.
