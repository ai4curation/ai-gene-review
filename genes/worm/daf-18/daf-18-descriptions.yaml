gene_symbol: daf-18
organism: worm
uniprot_id: G5EE01
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Acts as a dual-specificity protein phosphatase, dephosphorylating tyrosine-,
    serine- and threonine-phosphorylated proteins (By similarity). Also acts as a
    lipid phosphatase, removing the phosphate in the D3 position of the inositol ring
    from phosphatidylinositol 3,4,5-trisphosphate (PubMed:15637588). By dephosphorylating
    PtdIns(3,4,5)P3 antagonizes PtdIns(3,4,5)P3 production by age-1/PI3K and thus,
    negatively regulates daf-2-mediated processes including dauer formation, longevity,
    fat metabolism, chemotaxis towards salt, thermotolerance and axon guidance (PubMed:10077613,
    PubMed:10209098, PubMed:10377431, PubMed:16950159, PubMed:19249087, PubMed:20207731,
    PubMed:22916022, PubMed:23995781, PubMed:9885576). Similarly, promotes apoptosis
    during embryonic development by suppressing the recruitment of the prosurvival
    kinases akt-1/2 to the plasma membrane (PubMed:25383666). In addition, regulates
    Z2/Z3 germline precursor cell cycle by maintaining them arrested at the G2 stage
    and by controlling their growth during L1 diapause (PubMed:16631584). After sperm
    depletion in larvae and adult hermaphrodites, promotes germline stem cell quiescence
    and oocyte accumulation (PubMed:26552888). By dephosphorylating ephrin-like receptor
    vab-1 on tyrosine residues, negatively regulates oocyte maturation downstream
    of vab-1 and upstream of mpk-1, independently of daf-2 (PubMed:19853560). Plays
    a role in postembryonic muscle arm extensions (PubMed:18436204). Required for
    neurite outgrowth during AIY interneuron embryonic development (PubMed:22069193).
    Mainly independently of daf-2, negatively regulates vulva induction probably by
    inhibiting mpk-1 phosphorylation (PubMed:22916028). Both lipid and protein phosphatase
    activities are required for the regulation of vulva induction (PubMed:22916028).
    Plays a role in gonad and germline development following the L1 diapause (PubMed:24746511).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EE01
  source_id: G5EE01
- source: Alliance_Imported
  text: daf-18 encodes a lipid phosphatase homologous to the human PTEN tumor suppresor
    (OMIM:601728, mutated in Cowden disease and several cancers); DAF-18 negatively
    regulates insulin-like signaling mediated by DAF-2/IR and AGE-1/PI3K and thus
    plays a role in metabolism, development, and longevity; based on sequence and
    genetic analysis, DAF-18 is predicted to dephosphorylate AGE-1-generated PIP3
    in order to limit activation of the downstream AKT-1 and AKT-2 kinases that negatively
    regulate DAF-16.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000913;class=Gene
  source_id: WB:WBGene00000913
- source: Alliance_Automated
  text: Enables protein tyrosine phosphatase activity. Involved in several processes,
    including determination of adult lifespan; positive regulation of dauer larval
    development; and positive regulation of positive chemotaxis. Acts upstream of
    with a positive effect on protein import into nucleus. Located in several cellular
    components, including cytoplasmic side of plasma membrane; dendrite; and perikaryon.
    Is expressed in several structures, including Z2; egg-laying apparatus; germ line;
    oocyte; and somatic nervous system. Used to study cancer. Human ortholog(s) of
    this gene implicated in several diseases, including Cowden syndrome 1; breast
    cancer (multiple); nervous system cancer (multiple); reproductive organ cancer
    (multiple); and uterine disease (multiple). Orthologous to several human genes
    including PTEN (phosphatase and tensin homolog).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000913;class=Gene
