- term:
    id: GO:1903863
    label: P granule assembly
  evidence_type: IMP
  original_reference_id: PMID:28182654
  qualifier: involved_in
  review:
    summary: ego-1 alleles recovered in a screen for P-granule defects have P-granule phenotypes like
      csr-1, ekl-1 and drh-3 mutants (PMID:28182654).
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype is shared by all CSR-1 pathway mutants. EGO-1 is an RdRP, not a granule scaffold,
      and P-granule changes in ego-1 mutants accompany broad germline defects (PMID:15911573). No evidence
      shows EGO-1 doing part of the work of granule assembly, so the annotation reflects an indirect effect.
    supported_by:
    - reference_id: PMID:28182654
      supporting_text: Similarities between the P-granule phenotypes of csr-1, ego-1, ekl-1, drh-3 and
        elli-1 suggests ELLI-1 functions with or in parallel to CSR-1
