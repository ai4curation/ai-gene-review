gene_symbol: ego-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EGO-1 is one of four C. elegans cellular RNA-directed RNA polymerases (RdRPs) and the principal
  RdRP of the germline. Acting with the Dicer-related helicase DRH-3 and the Tudor protein EKL-1, it synthesizes
  5'-triphosphorylated, antisense 22G small RNAs from germline mRNA templates. The best-characterized
  EGO-1 products are the 22G-RNAs loaded into the Argonaute CSR-1, which target thousands of germline-expressed
  genes and promote holocentric chromosome organization and segregation rather than silencing; EGO-1 also
  contributes to WAGO-class 22G-RNAs and to robust RNA interference against germline-expressed genes.
  EGO-1 is enriched in perinuclear germ granules (P granules) and is also found in the nucleus and on
  mitotic chromosomes. It is required for H3K9me2 enrichment on unpaired chromosomes during meiosis (meiotic
  silencing). Loss of ego-1 causes sterility with pleiotropic germline defects in proliferation, meiosis,
  gametogenesis, nuclear pore and P-granule organization.
