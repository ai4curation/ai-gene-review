suggested_questions:
- question: Recombinant or immunopurified EGO-1 has not clearly been shown to have RdRP activity in vitro,
    unlike RRF-1. Does EGO-1 show primer-independent RdRP activity, and does it use pUG-tailed templates
    as RRF-1 does?
- question: What determines which templates go to EGO-1 (CSR-1 class) and which to RRF-1 (Mutator/WAGO
    class), given that both are germline RdRPs and partly redundant for WAGO 22G-RNAs?
suggested_experiments:
- description: In vitro RdRP assays with EGO-1 complexes immunopurified from germline extracts, using
    a catalytic-site (DxDxD) mutant as control.
  hypothesis: EGO-1 has intrinsic, primer-independent RdRP activity that produces 22-nt 5'-triphosphorylated
    products.
