- term:
    id: GO:0051664
    label: nuclear pore localization
  evidence_type: IMP
  original_reference_id: PMID:15911573
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00094620
  review:
    summary: In ego-1 mutants the size and distribution of germline nuclear pore complexes are altered
      (PMID:15911573).
    action: MARK_AS_OVER_ANNOTATED
    reason: The mutant phenotype is real, but EGO-1 is an RdRP and there is no evidence that it acts on
      nuclear pores. Small-RNA profiling later showed that EGO-1 targets include nuclear pore assembly
      genes, whose mRNAs rise in ego-1 mutants (PMID:21396820). The NPC defect is therefore most likely
      an indirect consequence of misregulated gene expression, not EGO-1 participation in nuclear pore
      localization.
    supported_by:
    - reference_id: PMID:15911573
      supporting_text: the size and distribution of nuclear pore complexes and perinuclear P granules
        are altered in the absence of EGO-1
    - reference_id: PMID:21396820
      supporting_text: These potential mRNA targets fall into distinct classes, including genes required
        for kinetochore and nuclear pore assembly
