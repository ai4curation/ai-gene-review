descriptions:
- source: Alliance_Imported
  text: ego-1 encodes a homolog of RNA-directed RNA polymerase; ego-1 is essential
    for several aspects of germline development such as proliferation, heterochromatin
    assembly on unpaired DNA during meiosis, and gametogenesis; ego-1 is also required
    for RNAi in the germ line; EGO-1 is detected in nuclear extracts.
