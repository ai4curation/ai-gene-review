gene_symbol: ego-1
organism: worm
uniprot_id: G5EBQ3
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: ego-1 encodes a homolog of RNA-directed RNA polymerase; ego-1 is essential
    for several aspects of germline development such as proliferation, heterochromatin
    assembly on unpaired DNA during meiosis, and gametogenesis; ego-1 is also required
    for RNAi in the germ line; EGO-1 is detected in nuclear extracts.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001214;class=Gene
  source_id: WB:WBGene00001214
- source: Alliance_Automated
  text: Predicted to enable RNA-directed RNA polymerase activity. Involved in several
    processes, including P granule assembly; nuclear pore localization; and regulatory
    ncRNA-mediated post-transcriptional gene silencing. Located in P granule; condensed
    nuclear chromosome; and metaphase plate. Is expressed in germ line.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001214;class=Gene
  source_id: WB:WBGene00001214
