- source: Alliance_Imported
  text: ced-4 encodes a novel protein; along with CED-3, CED-4 is required for the
    initiation of programmed cell death; accordingly, genetic analyses indicate that
    ced-3 and ced-4 function upstream of ced-1, ced-2, and nuc-1 in the programmed
    cell death pathway; in yeast two-hybrid experiments, and upon coexpression in
    mammalian cells, CED-4 interacts with CED-9, an anti-apoptotic BCL-2 homolog;
    coexpression of CED-4 and CED-9 results in redistribution of CED-4 from the cytosol
    to organellar membranes, suggesting that CED-9 may negatively regulate CED-4 activity
    by sequestering CED-4 to intracellular membranes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000418;class=Gene
  source_id: WB:WBGene00000418
- source: Alliance_Automated
  text: Enables several functions, including ATP binding activity; BH domain binding
    activity; and peptidase activator activity. Involved in several processes, including
    muscle cell cellular homeostasis; positive regulation of synapse pruning; and
    regulation of apoptotic process. Located in several cellular components, including
    cytosol; mitochondrion; and perinuclear region of cytoplasm. Part of caspase complex.
    Is expressed in several structures, including anal sphincter muscle; germ cell;
    germ line; intestine; and nervous system.
