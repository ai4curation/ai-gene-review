core_functions:
- description: CED-4 binds ATP and Mg through its Apaf-1-like nucleotide-binding module, oligomerizes into an 
    octameric apoptosome, and binds the CED-3 zymogen to stimulate autocatalytic CED-3 maturation during 
    apoptotic signaling.
  molecular_function:
    id: GO:0008656
    label: cysteine-type endopeptidase activator activity involved in apoptotic process
