    label: caspase complex
  supported_by:
  - reference_id: PMID:16208361
    supporting_text: The released CED-4 dimer further dimerizes to form a tetramer, which facilitates the 
      autoactivation of CED-3.
    reference_section_type: ABSTRACT
  - reference_id: PMID:20434985
    supporting_text: The CED-4 homo-oligomer or apoptosome is required for initiation of programmed cell death
      in Caenorhabditis elegans by facilitating autocatalytic activation of the CED-3 caspase zymogen.
    reference_section_type: ABSTRACT
  - reference_id: PMID:24065769
    supporting_text: CED-4 forms an octameric apoptosome, which binds the CED-3 zymogen and facilitates its 
      autocatalytic maturation.
    reference_section_type: ABSTRACT
proposed_new_terms: []
suggested_questions:
- question: Should GO add a C. elegans or metazoan apoptosome-assembly process term for CED-4/APAF1-like 
    oligomerization that sits between apoptotic signaling and caspase zymogen activation?
- question: Should the non-apoptotic CED-4-dependent regulation of cell size be modeled as a separate pathway 
    with an unknown effector, or left as a phenotype until the molecular output downstream of CED-4 is 
    identified?
- question: How should local reuse of EGL-1, CED-9, CED-4, and CED-3 in developmental synapse pruning be 
    represented without implying whole-cell apoptosis?
suggested_experiments:
- hypothesis: CED-4 apoptosome assembly surfaces that recruit CED-3 are also required for the nonlethal 
    synapse-pruning pathway.
  description: Introduce CED-4 separation-of-function mutations that impair the CED-3 L2-loop interface or 
    oligomerization into an endogenous ced-4 rescue transgene and score embryonic cell corpses, CED-3 
    processing, and RME presynaptic-cluster elimination in the same animals.
  experiment_type: endogenous rescue with apoptosome-interface mutants
- hypothesis: CED-4-dependent cell-size control uses a caspase-independent effector distinct from CED-3.
  description: Compare phosphoproteome and size phenotypes after acute TFG-1 depletion in wild-type, 
    ced-4-null, ced-3-null, and catalytically inactive CED-3 rescue backgrounds to separate CED-4 scaffold 
    activity from canonical caspase activation.
  experiment_type: epistasis proteomics and cell-size assay
