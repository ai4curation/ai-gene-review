id: P30429
gene_symbol: ced-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'CED-4 is the Caenorhabditis elegans Apaf-1-like apoptosome adaptor that links EGL-1/CED-9 mitochondrial
  apoptotic signaling to activation of the CED-3 caspase. In surviving cells, CED-4 dimers are held by CED-9 at
  mitochondria; after CED-9 inhibition, ATP/Mg-bound CED-4 oligomerizes into an octameric apoptosome that binds
  CED-3 zymogens and stimulates their autocatalytic maturation. CED-4 also moves to the nuclear envelope during
  apoptosis and is reused in selected nonlethal CED-pathway outputs, including developmental synapse elimination
  and cell-size control.'
