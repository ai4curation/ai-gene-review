- source: Alliance_Automated
  text: Predicted to enable protein-macromolecule adaptor activity. Predicted to be
    involved in centrosome cycle; cilium assembly; and protein localization to cilium.
    Located in ciliary basal body. Used to study Bardet-Biedl syndrome. Human ortholog(s)
    of this gene implicated in Bardet-Biedl syndrome 4; morbid obesity; and obesity.
    Orthologous to human BBS4 (Bardet-Biedl syndrome 4).
