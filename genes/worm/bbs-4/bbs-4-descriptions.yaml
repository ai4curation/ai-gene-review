gene_symbol: bbs-4
organism: worm
uniprot_id: Q5CZ52
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia (By similarity). The BBSome complex is required for ciliogenesis
    but is dispensable for centriolar satellite function (By similarity). Required
    for proper BBSome complex assembly and its ciliary localization (By similarity).
    May be required for microtubule anchoring at the centrosome but not for microtubule
    nucleation (By similarity). May be required for the dynein- mediated transport
    of pericentriolar proteins to the centrosome (By similarity). Required, redundantly
    with bbs-5, for cilia biogenesis and both the assembly and movement of intraflagellar
    transport proteins along the ciliary axoneme (PubMed:22922713, PubMed:26150102).
    Plays a role in the removal of degraded mechanosensory receptors within the cilia
    (PubMed:26150102).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q5CZ52
  source_id: Q5CZ52
- source: Alliance_Imported
  text: bbs-4 encodes the ortholog of human BBS4 and is paralogous to elegans bbs-8
    and osm-5 which are all ciliary proteins involved in ciliary structure and function.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00043992;class=Gene
