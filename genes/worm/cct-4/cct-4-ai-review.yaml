  review:
    summary: The delta subunit is one of the four high-ATP-affinity CCT subunits; ATP binding
      to these subunits drives the folding cycle.
    action: ACCEPT
    reason: InterPro chaperonin domains predict a nucleotide-binding equatorial domain; in
      CCT/TRiC, CCT4 is one of only four subunits that bind ATP at physiological concentrations,
      and abolishing its nucleotide binding is lethal in yeast. ATP binding is therefore a
      genuine and functionally essential activity of this subunit.
    supported_by:
    - reference_id: PMID:23041314
      supporting_text: Only four of the eight different subunits bind ATP at physiological
        concentrations.
