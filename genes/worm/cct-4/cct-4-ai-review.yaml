  label: Caenorhabditis elegans
description: cct-4 encodes the delta (CCT4 / TCP-1-delta) subunit of the eukaryotic cytosolic
  chaperonin CCT/TRiC, an ATP-dependent double-ring chaperonin whose rings are each assembled
  from eight distinct paralogous subunits and which folds a subset of cytosolic proteins including
  actin and tubulin. CCT-4 is one of the four high-ATP-affinity subunits whose nucleotide
  binding powers the folding cycle. In C. elegans cct-4 is expressed at all life stages. CCT-4
  is cytoplasmic but is also abundant in germline nuclei, where it associates with meiotic
  chromatin and forms complexes with the meiotic HORMA-domain axis proteins (HIM-3, HTP-1,
  HTP-3); a cct-4 missense allele (P382S) suppresses axis-assembly defects of HORMAD mutants,
  supporting local folding of HORMADs by chromosome-associated CCT. Loss of cct-4 or other
  subunits also impairs endocytic trafficking in intestinal cells.
