  review:
    summary: Body-morphology phenotype from the genome-wide RNAi screen (Kamath et al. 2003)
      attributed to cct-4.
    action: KEEP_AS_NON_CORE
    reason: 'The RNAi phenotype is real, but CCT is an essential, ubiquitous chaperonin whose
      loss pleiotropically disrupts actin and tubulin biogenesis; the body morphogenesis defect
      is a downstream consequence rather than a process CCT-4 specifically executes. Retained
      as a non-core, phenotype-derived annotation. Caveat: a later study reports that the
      commercial (Source Bioscience, derived from the Ahringer library used here) clone labelled
      cct-4 is misidentified, so the gene assignment of this screen phenotype is uncertain.'
    supported_by:
