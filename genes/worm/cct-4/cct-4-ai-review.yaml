suggested_questions:
- question: Which native C. elegans CCT clients depend specifically on contacts made by the
    delta subunit apical domain, as opposed to the complex as a whole?
- question: Is the nuclear pool of CCT-4 part of fully assembled TRiC, and does it fold meiotic
    HORMADs in situ or act through a complex-independent mechanism?
suggested_experiments:
- description: Affinity purification and mass spectrometry of endogenously tagged cct-4 (or
    of assembled CCT) from staged C. elegans, combined with crosslinking, to map clients contacting
    the delta subunit.
  hypothesis: The delta subunit contributes a defined subset of client contacts, dominated
    by actin and tubulin but including WD40 and other proteins.
- description: Test whether a nuclear-excluded CCT-4 (NES-tagged knock-in) supports meiotic
    axis assembly and HORMAD loading.
  hypothesis: A chromosome-proximal pool of CCT is needed for timely HORMAD incorporation
    into the meiotic axis.
