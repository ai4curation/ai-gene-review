  review:
    summary: ATP-dependent protein folding chaperone is the most informative MF term for CCT/TRiC;
      cct-4 contributes to this activity as a subunit of the complex.
    action: ACCEPT
    reason: This term captures the activity of the CCT chaperonin. Strictly it is a complex-level
