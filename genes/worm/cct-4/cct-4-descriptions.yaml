gene_symbol: cct-4
organism: worm
uniprot_id: P47208
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47208
  source_id: P47208
- source: Alliance_Imported
  text: cct-4 encodes a putative delta subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT4 (OMIM:605142); CCT-4 represses SKN-1-dependent
    transcription of gst-4; CCT-4 is expressed in pharynx, pharyngeal gland cells,
    intestine, renal gland cells, and neurons; CCT-4 is expressed in touch receptor
    neurons in a MEC-3-dependent fashion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000379;class=Gene
  source_id: WB:WBGene00000379
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Involved in post-embryonic body morphogenesis. Predicted
    to be located in cytoplasm. Predicted to be part of chaperonin-containing T-complex.
    Is expressed in several structures, including head; intestine; pharynx; rectal
    gland cell; and touch receptor neurons. Orthologous to human CCT4 (chaperonin
    containing TCP1 subunit 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000379;class=Gene
  source_id: WB:WBGene00000379
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Involved in post-embryonic
    body morphogenesis. Predicted to be located in cytoplasm. Predicted to be part
    of chaperonin-containing T-complex. Is expressed in several structures, including
    head; intestine; pharynx; rectal gland cell; and touch receptor neurons. Orthologous
    to human CCT4 (chaperonin containing TCP1 subunit 4). [provided by Alliance of
