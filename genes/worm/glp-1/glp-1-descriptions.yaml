- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity and transcription coactivator activity. Involved in several processes,
    including cytoplasmic streaming; positive regulation of cell population proliferation;
    and regulation of gene expression. Located in several cellular components, including
    endomembrane system; lateral plasma membrane; and nucleus. Part of RNA polymerase
    II transcription regulator complex. Is expressed in several structures, including
    AB lineage cell; anus; germ line; neurons; and somatic nervous system. Used to
    study cancer and obesity. Human ortholog(s) of this gene implicated in several
    diseases, including Adams-Oliver syndrome; Alagille syndrome; Hajdu-Cheney syndrome;
    adult T-cell leukemia/lymphoma; and aortic valve disease 1. Orthologous to human
    NOTCH1 (notch receptor 1) and NOTCH2 (notch receptor 2).
