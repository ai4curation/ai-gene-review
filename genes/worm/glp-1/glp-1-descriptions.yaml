descriptions:
- source: UniProt
  text: Essential signaling protein which has a major role in germline and embryonic
    development; involved in cell fate decisions that require cell-cell interactions
    (PubMed:16319922, PubMed:19379690, PubMed:8156602). Probable membrane-bound receptor
    for putative ligands lag-2 and apx-1 (PubMed:7607081, PubMed:8156602). Upon ligand
    activation, and releasing from the cell membrane, the glp-1/Notch intracellular
    domain (NICD) probably forms a transcriptional activator complex with lag-1 and
    lag-3 and regulates expression of various genes; targets in the germline include
    lst-1 and sygl-1 (PubMed:10884418, PubMed:16197940, PubMed:16319922, PubMed:19379690,
    PubMed:32196486, PubMed:7566091, PubMed:9003776). Involved in the specification
    of the cell fates of the blastomeres, ABa and ABp (PubMed:8156602). Proper signaling
    by glp-1 induces ABa descendants to produce anterior pharyngeal cells, and ABp
    descendants to adopt a different fate (PubMed:8156602). Contributes to the establishment
    of the dorsal- ventral axis in early embryos (PubMed:8156602). Required in postmitotic
    neurons in order to maintain the developmentally arrested larval state known as
    dauer, probably in response to lag-2 (PubMed:18599512). Regulates germ cell mitotic
    proliferation probably by regulating MAP kinase phosphatase lip-1 expression (PubMed:16319922,
    PubMed:22278922). Required for oocyte growth control (PubMed:19502484). Plays
    a negative role in lifespan (PubMed:21906946, PubMed:24332851, PubMed:28853436).
