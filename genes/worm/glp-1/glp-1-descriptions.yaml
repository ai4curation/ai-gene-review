- source: Alliance_Imported
  text: glp-1 encodes an N-glycosylated transmembrane protein that, along with LIN-12,
    comprises one of two C. elegans members of the LIN-12/Notch family of receptors;
    from the N- to the C-terminus, GLP-1 is characterized by ten extracellular EGF-like
    repeats, three LIN-12/Notch repeats, a CC-linker, a transmembrane domain, a RAM
    domain, six intracellular ankyrin repeats, and a PEST sequence; in C. elegans,
    GLP-1 activity is required for cell fate specification in germline and somatic
    tissues; in the germline, GLP-1, acting as a receptor for the DSL family ligand
    LAG-2, is essential for mitotic proliferation of germ cells and maintenance of
    germline stem cells; in somatic tissues, maternally provided GLP-1, acting as
    a receptor for the DSL family ligand APX-1, is required for inductive interactions
    that specify the fates of certain embryonic blastomeres; GLP-1 is also required
    for some later embryonic cell fate decisions, and in these decisions its activity
    is functionally redundant with that of LIN-12; GLP-1 expression is regulated temporally
    and spatially via translational control, as GLP-1 mRNA, present ubiquitously in
    the germline and embryo, yields detectable protein solely in lateral, interior,
    and endomembranes of distal, mitotic germ cells, and then predominantly in the
    AB blastomere and its descendants in the early embryo; proper spatial translation
    of glp-1 mRNA in the embryo is dependent upon genes such as the par genes, that
    are required for normal anterior-posterior asymmetry in the early embryo; signaling
    through GLP-1 controls the activity of the downstream Notch pathway components
    LAG-3 and LAG-1, the latter being predicted to function as part of a transcriptional
    feedback mechanism that positively regulates GLP-1 expression; signaling through
    the DNA-binding protein LAG-1 is believed to involve a direct interaction between
    LAG-1 and the GLP-1 RAM and ankyrin domains
