suggested_questions:
- question: >-
    GLP-1 is placed in PANTHER PTHR45836:SF23 (Notch homolog 1) while its paralog LIN-12 is placed in
    PTHR24049:SF22 (crumbs homolog). Should both C. elegans Notch receptors share a Notch receptor subfamily
    and its IBA annotations?
- question: >-
    Are lst-1 and sygl-1 truly the only primary germline GLP-1/LAG-1 targets, and which GLP-1 somatic
    (dauer neuron, embryonic) targets are direct?
suggested_experiments:
- description: >-
    Use endogenously tagged GLP-1 NICD with auxin-inducible degradation to map the dauer-neuron transcriptional
    targets and test whether they share LAG-1 binding sites.
