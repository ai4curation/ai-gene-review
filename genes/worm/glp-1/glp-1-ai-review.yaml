    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:9003776
  qualifier: enables
  review:
    summary: The GLP-1 intracellular ANK repeats activate transcription and bind LAG-1.
    action: ACCEPT
    reason: >-
      The NICD acts as a coactivator for the DNA-binding CSL factor LAG-1 and recruits LAG-3. Transcription
      coactivator activity is the appropriate MF for the nuclear intracellular domain (as for NOTCH1 NICD).
    supported_by:
    - reference_id: PMID:9003776
      supporting_text: >-
        Finally, we show in yeast that the ANK repeats are strong transcriptional activators.
    - reference_id: PMID:9003776
      supporting_text: >-
        We speculate that one possible function for the ANK repeat domain is to act as a transcriptional
        co-activator with LAG-1.
    - reference_id: PMID:10830967
      supporting_text: >-
        We propose that GLP-1 and LIN-12 promote signalling by recruiting LAG-3 to target promoters, where
        it functions as a transcriptional activator.
