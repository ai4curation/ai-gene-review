id: P13508
gene_symbol: glp-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  GLP-1 is one of the two Caenorhabditis elegans Notch-family receptors. It is a single-pass type I membrane
  protein with 10 EGF-like repeats, three LIN-12/Notch repeats, and an intracellular RAM domain and ankyrin
  repeats. In the germ line GLP-1 receives the DSL ligands LAG-2 and APX-1 from the distal tip cell niche.
  Its intracellular domain binds the CSL transcription factor LAG-1 and recruits the Mastermind-like coactivator
  LAG-3/SEL-8 to activate transcription of sygl-1 and lst-1. This keeps germ cells in the proliferative
  stem-cell state and prevents entry into meiosis. Maternal glp-1 mRNA is translationally controlled so
  that GLP-1 accumulates in anterior (AB) blastomeres. There it receives APX-1 from P2 to specify ABp
  and ABa descendant fates, including the anterior pharynx. GLP-1 acts redundantly with LIN-12 in many
  embryonic cell interactions. It also works in dauer neurons to maintain the dauer state and modulates
  oocyte growth.
