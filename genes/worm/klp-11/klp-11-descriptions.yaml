descriptions:
- source: Alliance_Imported
  text: klp-11 encodes a kinesin motor protein that functions as a subunit of C. elegans
    heterotrimeric kinesin-II; in vitro microtubule gliding assays demonstrate that
    purified kinesin-II and OSM-3, a homomeric kinesin-II motor, cooperatively generate
    movement similar to that seen along cilia lacking additional regulatory factors;
    antibodies to KLP-11 detect high intensity staining in the cilia of chemosensory
    neurons, with fainter staining detected in the dorsal and ventral nerve cords
    as well as motor commissures.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002222;class=Gene
  source_id: WB:WBGene00002222
- source: Alliance_Automated
  text: Enables microtubule motor activity. Involved in microtubule-based movement.
    Part of axonemal heterotrimeric kinesin-II complex. Is expressed in amphid neurons;
    dorsal nerve cord; inner labial neurons; phasmid neurons; and ventral nerve cord.
    Human ortholog(s) of this gene implicated in retinitis pigmentosa 89. Orthologous
    to human KIF3B (kinesin family member 3B) and KIF3C (kinesin family member 3C).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002222;class=Gene
  source_id: WB:WBGene00002222
