descriptions:
- source: UniProt
  text: Argonaute protein which is involved in the endogenous small interfering RNA
    (endo-siRNA) pathway and is required for RNA-mediated gene silencing (RNAi) in
    the germline (PubMed:22810588, PubMed:28533440). Interacts with secondary 22G-RNAs
    in an hrde-2- dependent manner; 22G-RNAs are RNA-dependent RNA polymerase-derived
    endo-siRNAs, typically 22 nucleotides in length with a 5'-guanosine residue (PubMed:22810588,
    PubMed:28533440). Plays a key role in transgenerational epigenetic inheritance
    and germline immortality (PubMed:22810588, PubMed:37083324). May be involved in
    transgenerational gene silencing both by inducing subnuclear-co- localization
    of target genes into heterochromatin and by activation of small RNA amplification
    in the nuage (PubMed:37083324).
