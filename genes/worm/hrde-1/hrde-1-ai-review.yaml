    summary: Argonaute-family IBA for RNA endonuclease (slicer) activity. HRDE-1 belongs to
      the WAGO clade, whose members lack the catalytic residues required for slicing.
    action: REMOVE
    reason: Slicer activity was gained at an ancestral Argonaute node, but HRDE-1 is in the
      WAGO clade, which has lost it. Our alignment of HRDE-1 with human AGO2 found that none
      of the four DEDH catalytic tetrad positions (AGO2 D597, E637, D669, H807) is conserved.
      Shirayama et al. state that all WAGOs lack key catalytic residues. No cleavage activity
      has been reported for HRDE-1; it silences targets by nuclear recruitment of NRDE factors
      and chromatin modification. This is a target-specific loss of the inherited function,
      so the IBA should not apply.
