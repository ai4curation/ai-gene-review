id: Q09249
gene_symbol: hrde-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: HRDE-1 (heritable RNAi deficient 1, also WAGO-9) is a germline-specific nuclear
  Argonaute of the nematode-specific WAGO clade. It carries PAZ and PIWI domains but, like
  other WAGOs, lacks the slicer catalytic residues. HRDE-1 is loaded with RdRP-derived secondary
  22G endo-siRNAs, including those produced downstream of piRNA (PRG-1/21U-RNA) and exogenous
  dsRNA targeting, and acts in germ-cell nuclei as the specificity factor of the nuclear RNAi
  (NRDE) pathway. siRNA-guided HRDE-1 recruits NRDE-2 to nascent target transcripts and, with
  NRDE-1/2/4 and the SET-25/SET-32/HPL-2 chromatin machinery, directs H3K9 trimethylation
  and co-transcriptional silencing of target loci. Acting in each inheriting generation, HRDE-1
  propagates RNAi- and piRNA-initiated silencing across generations; it also visits perinuclear
  nuage, where it stimulates further small RNA amplification. Loss of HRDE-1 causes progressive
  loss of germline silencing and a temperature- sensitive mortal germline phenotype.
