  review:
    summary: hrde-1 mutants show a progressive, temperature-sensitive mortal germline phenotype,
      with late-generation animals failing to make mature gametes.
    action: KEEP_AS_NON_CORE
    reason: The gametogenesis defect appears only after several generations without HRDE-1.
      It is a downstream result of the gradual loss of nuclear RNAi silencing in the germline,
      not a direct role in germ cell development. It is a real and important phenotype, so
      the annotation is kept as non-core.
    supported_by:
    - reference_id: PMID:22810588
      supporting_text: Most late generation hrde-1(−) mutants (grown at 25°C) failed to produce
        mature oocytes or sperm
    - reference_id: PMID:22810588
      supporting_text: In hrde-1- or nuclear RNAi-deficient animals, germline silencing is
        lost over generational time.
