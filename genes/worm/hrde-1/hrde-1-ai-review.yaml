      reasonable at the family level. For HRDE-1, however, the experimental data show nuclear,
      co-transcriptional silencing with H3K9me3 deposition. Its process is better captured
      by regulatory ncRNA-mediated heterochromatin formation, matching the change made to
      the IMP annotation.
