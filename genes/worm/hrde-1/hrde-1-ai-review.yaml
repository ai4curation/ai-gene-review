core_functions:
- description: HRDE-1 is a germline nuclear Argonaute loaded with RdRP-derived 22G siRNAs.
    In germ-cell nuclei it acts as the sequence-specificity factor that recruits NRDE-2 and
    the downstream NRDE factors to nascent target transcripts. This directs H3K9me3 deposition
    and co-transcriptional silencing that is propagated across generations.
  molecular_function:
    id: GO:0035197
    label: siRNA binding
  directly_involved_in:
  - id: GO:0031048
    label: regulatory ncRNA-mediated heterochromatin formation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0031332
    label: RNAi effector complex
  supported_by:
  - reference_id: PMID:22810588
    supporting_text: HRDE-1 bound 22G endogenous (endo) siRNAs, which were expressed in germ
      cells
  - reference_id: PMID:22810588
    supporting_text: In the nuclei of these germ cells, HRDE-1 engages the nuclear RNAi defective
      pathway to direct the trimethylation of histone H3 at Lys 9 (H3K9me3) at RNAi-targeted
      genomic loci and promote RNAi inheritance.
  - reference_id: PMID:22810588
    supporting_text: HRDE-1 was required for RNAi-mediated recruitment of NRDE-2 to a germline
      pre-mRNA
suggested_questions:
- question: How does HRDE-1 partition between germ-cell nuclei and perinuclear nuage, and
    which of its activities (heterochromatin targeting or stimulation of 22G-RNA amplification)
    is the main driver of transgenerational silencing?
- question: Should siRNA binding be added to HRDE-1 as an experimental annotation (the co-IP
    and sequencing of 22G siRNAs in PMID:22810588), to replace the inherited miRNA binding
    IBA?
suggested_experiments:
- description: Express a HRDE-1 variant that cannot enter the nucleus, or one held in the
    nucleus, and measure separately H3K9me3 at target loci and the amount of 22G-RNA amplification
    over several generations.
