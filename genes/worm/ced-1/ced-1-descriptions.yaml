gene_symbol: ced-1
organism: worm
uniprot_id: Q9XWD6
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in programmed cell death, also called apoptosis, in both somatic
    and germ cells (PubMed:11163239, PubMed:12944970, PubMed:15744306, PubMed:16740477,
    PubMed:18351800, PubMed:1936965, PubMed:26598553, PubMed:27650246, PubMed:6857247).
    Acts by recruiting ced-6 to phagosomes which enables actin-dependent cytoskeletal
    reorganization and subsequent engulfment of the apoptotic cell corpse (PubMed:15744306).
    Has a role in the association of ppk-3 and rab-7 with the phagosomal surface which
    is necessary for the incorporation of lysosomes to phagosomes during phagosome
    maturation (PubMed:16740477, PubMed:18351800). Activates the expression of unfolded
    protein response genes, which are involved in the immune response to live bacteria
    (PubMed:18606143).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XWD6
  source_id: Q9XWD6
- source: Alliance_Imported
  text: ced-1 encodes a single-pass transmembrane protein homologous to human CD91,
    a low density lipoprotein receptor; CED-1 is a component of the apoptotic pathway
    and functions to initiate a signaling pathway in phagocytic cells that promotes
    cell corpse engulfment, phagosome maturation as evidenced by enrichment of PtdIns(3)P,
    DYN-1, and RAB-5 on phagosomal surfaces and, ultimately, apoptotic cell degradation;
    CED-1 is expressed on the plasma membrane, engulfing pseudopodia, and nascent
    phagosomes; CED-1 interacts physically with the secreted transthyretin-like protein
    TTR-52 and with CED-6, which colocalizes with CED-1 at at the plasma membrane
    and around engulfed apoptotic cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000415;class=Gene
  source_id: WB:WBGene00000415
- source: Alliance_Automated
  text: Enables scavenger receptor activity. Involved in several processes, including
    cytoskeleton organization; left/right axis specification; and phagocytosis. Located
    in several cellular components, including phagocytic cup; phagocytic vesicle membrane;
    and pseudopodium membrane. Is expressed in several structures, including engulfing
    cell; hypodermis; intestinal cell; muscle cell; and neurons. Human ortholog(s)
    of this gene implicated in congenital myopathy 10A and congenital myopathy 10B.
    Orthologous to human MEGF10 (multiple EGF like domains 10) and MEGF11 (multiple
    EGF like domains 11).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000415;class=Gene
  source_id: WB:WBGene00000415
