- term:
    id: GO:1902742
    label: apoptotic process involved in development
  evidence_type: IGI
  original_reference_id: PMID:24225442
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O17386
  review:
    summary: Apoptotic process involved in development (Chen et al. 2013, CED-8 paper).
    action: MODIFY
    reason: In the full text, ced-1(e1735) is used as a background that blocks engulfment so that corpses
      persist and can be counted; the paper tests ced-8, not ced-1. Separately, engulfment genes including
      ced-1 promote cell death when killing is weakened (Reddien 2001; Hoeppner 2001), and ced-1 expressed
      in engulfing cells rescues that. CED-1 therefore promotes death from the engulfing cell rather than
      taking part in the dying cell's apoptotic program.
    supported_by:
    - reference_id: PMID:24225442
      supporting_text: ced-1(e1735) blocks cell corpse engulfment and sensitizes
    - reference_id: PMID:11449278
