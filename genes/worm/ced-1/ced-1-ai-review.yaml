core_functions:
- description: Engulfment receptor on engulfing cells that recognizes apoptotic cell corpses through the
    PtdSer-bridging ligand TTR-52 and drives their engulfment.
  molecular_function:
    id: GO:0005044
    label: scavenger receptor activity
  directly_involved_in:
  - id: GO:0043652
    label: engulfment of apoptotic cell
  - id: GO:0043654
    label: recognition of apoptotic cell
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0001891
    label: phagocytic cup
  supported_by:
  - reference_id: PMID:11163239
    supporting_text: CED-1 is a cell surface phagocytic receptor that recognizes cell corpses
  - reference_id: PMID:20526330
    supporting_text: binds to both PtdSer and the extracellular domain of CED-1 in vitro
  - reference_id: PMID:22713871
    supporting_text: CED-1 binds TTR-52 through its N-terminal EMI domain
  - reference_id: PMID:11163239
    supporting_text: ced-1 is expressed in and functions in engulfing cells
- description: Signals through its cytoplasmic NPXY motif to the CED-6 adaptor and DYN-1 to drive actin
    reorganization, internalization and phagosome maturation into a phagolysosome.
  molecular_function:
    id: GO:0038023
    label: signaling receptor activity
  directly_involved_in:
  - id: GO:0043652
    label: engulfment of apoptotic cell
  - id: GO:0001845
    label: phagolysosome assembly
  locations:
  - id: GO:0030670
    label: phagocytic vesicle membrane
  supported_by:
  - reference_id: PMID:11729193
    supporting_text: we present evidence for a physical interaction between GULP/CED-6 and one of the
      two motifs (NPXY motif) in the cytoplasmic tail of CED-1
  - reference_id: PMID:11163239
    supporting_text: Motifs in the intracellular domain of CED-1 known to interact with PTB and SH2 domains
      were necessary for engulfment but not for clustering
  - reference_id: PMID:18351800
    supporting_text: One of the pathways, composed of CED-1, the adaptor protein CED-6, and DYN-1, controls
      the rate of enrichment of PI(3)P and RAB-7 on phagosomal surfaces and the formation of phagolysosomes
  - reference_id: PMID:15744306
    supporting_text: CED-1, CED-6 and CED-7 are required for actin reorganization around the apoptotic
      cell corpse
suggested_questions:
- question: Does CED-1 bind phosphatidylserine directly, or only through TTR-52 and other bridging molecules?
- question: How do engulfing cells, through CED-1, push cells that have received a weak death signal into
    death, and what signal passes back to the dying cell?
- question: Should the PANTHER family for CED-1 follow PANTHER's own classification (PTHR24035:SF109,
    which holds the CED-1/Draper/MEGF10 PAINT nodes) rather than the UniProt/InterPro cross-reference
    (PTHR24043:SF8)? See projects/PANTHER_FAMILY_ASSIGNMENT_DISCREPANCIES.md.
suggested_experiments:
- hypothesis: CED-1 promotes death of weakly signalled cells through direct contact-dependent signalling
    from the engulfing cell.
  description: In a weak ced-3 background, compare survival of specific cells when ced-1 is restored only
    in the engulfing cell versus with NPXY or YXXL tail mutants, scoring survival with cell-type reporters.
  experiment_type: genetic
