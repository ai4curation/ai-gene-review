id: Q9XWD6
gene_symbol: ced-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CED-1 is the C. elegans engulfment receptor for apoptotic cell corpses, a single-pass transmembrane
  protein of the CED-1/Draper/MEGF10 family with an EMI domain, extracellular EGF-like repeats and a cytoplasmic
  tail carrying NPXY and YXXL motifs. Expressed on engulfing cells, it clusters around neighbouring corpses
  and recognizes them through the secreted bridging protein TTR-52, which binds exposed phosphatidylserine.
  Its NPXY motif recruits the PTB-domain adaptor CED-6/GULP and, with the ABC transporter CED-7 and dynamin
  DYN-1, it drives pseudopod extension, actin reorganization and internalization, then initiates phagosome
  maturation through PI(3)P and RAB-7. After engulfment it is recycled to the plasma membrane by retromer.
  Engulfing cells also use it to promote the death of cells that receive weak death signals, and it contributes
  to defense against bacterial pathogens.
