        cell corpses, rescues the cell-killing defects of ced-1 mutants
    - reference_id: PMID:11449279
      supporting_text: genes that mediate corpse removal can also function to actively kill cells
    proposed_replacement_terms:
    - id: GO:1904747
      label: positive regulation of apoptotic process involved in development
