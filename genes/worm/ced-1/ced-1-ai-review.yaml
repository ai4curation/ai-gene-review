- term:
    id: GO:0012501
    label: programmed cell death
  evidence_type: IMP
  original_reference_id: PMID:6857247
  qualifier: involved_in
  review:
    summary: Programmed cell death (IMP, Hedgecock et al. 1983).
    action: MARK_AS_OVER_ANNOTATED
    reason: The source paper concludes that cells programmed to die still die in engulfment mutants, so
      engulfment is not needed for most deaths. Engulfment genes do promote death in sensitized backgrounds
      (Reddien et al. 2001), but that is a regulatory role, captured here by positive regulation of apoptotic
      process involved in development. CED-1 is not part of the death program itself.
    supported_by:
    - reference_id: PMID:6857247
      supporting_text: With few exceptions, these cells still die, suggesting that, in nematodes, engulfment
        is not necessary for most programmed deaths
    - reference_id: PMID:11449278
      supporting_text: the expression in engulfing cells of ced-1, which encodes a receptor that recognizes
        cell corpses, rescues the cell-killing defects of ced-1 mutants
