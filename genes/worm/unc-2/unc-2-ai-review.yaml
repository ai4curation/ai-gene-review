id: G5EFB0
gene_symbol: unc-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-2 is the alpha1 subunit of the single Caenorhabditis elegans CaV2-family voltage-gated
  calcium channel, the worm counterpart of vertebrate N-, P/Q- and R-type channel alpha1 subunits. It
  is a multi-pass membrane protein that opens on depolarization and conducts calcium into the presynaptic
  terminal, and it is concentrated at the presynaptic active-zone membrane of sensory and motor neurons,
  within about 90 nm of the presynaptic density and overlapping UNC-10/RIM. The calcium microdomain it
  creates triggers synaptic vesicle fusion, so unc-2 mutants are uncoordinated and have strongly reduced
  evoked release at the neuromuscular junction. Its synaptic delivery depends on the alpha2delta subunit
  UNC-36 and on the ER protein CALF-1, reflecting its assembly into a multi-subunit channel complex. Beyond
  release, UNC-2-mediated calcium entry acts in adaptation to dopamine and serotonin, in the control of
  movement rate through a TGF-beta pathway, and with EGL-19/CaV1 in the AWC left/right asymmetry decision.
