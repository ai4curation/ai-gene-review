    supporting_text: is localized to presynaptic active zones of sensory and motor neurons
  - reference_id: PMID:18721860
    supporting_text: The calcium channel alpha subunit, UNC-2 is required for evoked responses at the
      C. elegans NMJ
suggested_questions:
- question: Which active-zone scaffold, UNC-10/RIM, RIMB-1 or SYD-2, dominates UNC-2 clustering at different
    synapse types, and does the residual clustering in triple mutants reflect a further unidentified anchor?
- question: Is the alternative UniProt entry used here (G5EFB0) or A0A1N7SYT0 the reference sequence for
    unc-2, and should the annotations be consolidated onto one accession?
suggested_experiments:
- description: Endogenous tagging of UNC-2 combined with electrophysiology in unc-10, rimb-1, elks-1 and
    syd-2 single and combinatorial mutants, measuring both channel-cluster intensity and the calcium sensitivity
    of evoked release, to relate channel positioning quantitatively to release probability.
