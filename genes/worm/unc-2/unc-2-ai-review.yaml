core_functions:
- description: Depolarization-gated calcium entry at the presynaptic active zone; as the alpha1 subunit
    of the worm CaV2 channel complex (with UNC-36/alpha2delta), UNC-2 conducts the calcium microdomain
    next to the presynaptic density that triggers synaptic vesicle fusion.
  molecular_function:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  directly_involved_in:
