gene_symbol: unc-2
organism: worm
uniprot_id: G5EFB0
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: unc-2 encodes a calcium channel alpha subunit similar to the human P/Q-type
    calcium channel, CACNA1A; unc-2 is required for desensitization to dopamine, normal
    movement, normally low sensitivity of whole animals to serotonin, and neuronal
    migrations; unc-2 interacts with the TGF beta pathway to regulate movement, and
    maintain normal serotonin levels; unc-2/TGF beta pathway is also required for
    the stress-induced modulation of tryptophan hydroxylase/tph-1 expression in the
    serotonergic chemosensory ADF neurons (but not the NSM neurons); UNC-2 is expressed
    primarily in motor neurons, several sensory neurons, and the HSN and VC neurons
    controlling egg-laying.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006742;class=Gene
  source_id: WB:WBGene00006742
- source: Alliance_Automated
  text: Predicted to enable high voltage-gated calcium channel activity. Predicted
    to be involved in calcium ion import across plasma membrane and chemical synaptic
    transmission. Predicted to be located in basolateral plasma membrane and presynaptic
    membrane. Predicted to be part of voltage-gated calcium channel complex. Is expressed
    in several structures, including body wall musculature; excretory canal; head;
    neurons; and pharyngeal muscle cell. Used to study migraine. Human ortholog(s)
    of this gene implicated in Lambert-Eaton myasthenic syndrome; brain disease (multiple);
    and neurodegenerative disease (multiple). Orthologous to several human genes including
    CACNA1B (calcium voltage-gated channel subunit alpha1 B) and CACNA1E (calcium
    voltage-gated channel subunit alpha1 E).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006742;class=Gene
  source_id: WB:WBGene00006742
