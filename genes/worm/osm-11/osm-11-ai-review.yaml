suggested_questions:
- question: >-
    Does OSM-11 bind LIN-12 directly in a purified system, and does it form a ternary complex with DSL
    ligands on the receptor (the bipartite ligand model)?
- question: Is the osmotic-stress resistance of osm-11 mutants Notch-dependent?
suggested_experiments:
- description: >-
    Test Notch-receptor dependence of the osm-11 osmotic resistance and glycerol phenotypes using lin-12
    and glp-1 conditional alleles or tissue-specific degradation.
