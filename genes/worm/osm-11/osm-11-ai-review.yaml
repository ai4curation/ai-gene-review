  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  OSM-11 is a small secreted, diffusible protein of Caenorhabditis elegans that carries a DOS (Delta and
  OSM-11) motif and acts as a Notch co-ligand. The C. elegans DSL ligands (LAG-2, APX-1, DSL-1) lack the
  DOS motif found in Drosophila and vertebrate Delta/Serrate. OSM-11 and related DOS proteins (OSM-7,
  DOS-1, DOS-2, DOS-3) are proposed to supply this motif in trans, forming a bipartite ligand with the
  DSL proteins. OSM-11 binds the LIN-12 extracellular EGF repeats and is concentrated on the apical surface
  of vulval precursor cells. It promotes LIN-12-mediated lateral specification together with DSL-1 and
  other DOS proteins; mammalian DLK1 can substitute for it. OSM-11 is also secreted from hypodermal seam
  cells into the pseudocoelom. There it acts with LAG-2 to activate LIN-12 and GLP-1 in adult neurons,
  regulating octanol avoidance and sleep-like quiescence. Loss of OSM-11 also causes osmotic-stress resistance
  with elevated glycerol and a long defecation cycle.
