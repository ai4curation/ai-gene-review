      Well-supported phenotype, but the mechanism (proposed cuticle interaction or Notch-dependent signaling)
      is unresolved. It is non-core relative to the co-ligand function.
    supported_by:
    - reference_id: PMID:16980399
      supporting_text: >-
        Mutations in either gene lead to high internal levels of glycerol and cause an osmotic resistance
        phenotype (Osr).
    - reference_id: PMID:16980399
      supporting_text: >-
        We hypothesize that osm-7 and osm-11 interact with the cuticle, and disruption of the cuticle
        causes activation of signaling pathways that increase glycerol production.
