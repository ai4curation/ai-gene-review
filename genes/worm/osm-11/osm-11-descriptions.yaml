    overall_notes: 'Cited: Notch co-ligand in VPC lateral signaling with DSL-1/LAG-2,
      octanol avoidance and quiescence via LIN-12/GLP-1. Lacks osmotic/glycerol phenotypes.'
- source: Alliance_Imported
  text: osm-11 encodes a protein required for normal osmosensation, osmotic resistance,
    and defecation rhythm, and for fully normal growth rate; OSM-11 has no clear orthologs
    outside of nematodes, but is paralogous to DOS-1, OSM-7, and K02F3.7, has a predicted
    signal sequence with 12 conserved cysteine residues, and may be secreted; osm-11
    mutants have abnormally high levels of internal glycerol, defective osmotic avoidance,
    and slowed defecation rhythms characteristic of worms under chronic osmotic stress;
    osm-11 mutants are also somewhat scrawny and slow-growing; osm-11(RNAi) animals
    show constitutive gpdh-1 transcription.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003891;class=Gene
