descriptions:
- source: UniProt
  text: Probable secreted lin-12/Notch ligand or co-ligand involved in the mediation
    of Notch signaling (PubMed:18700817, PubMed:21549604). Involved in the lin-12/Notch
    pathway signaling of cell fate in vulval precursor cells (VPCs), acting redundantly
    with dsl-1 and lag-2 (PubMed:18700817). Required for normal octanol avoidance
    response, acting via both lin-12/Notch and glp-1/Notch signaling pathways in neurons,
    in concert with lag-2 (PubMed:21549604). Involved in regulation of sleep-like
    quiescence during the larval to adult transition, acting via Notch receptor activation
    and in parallel with EGF signaling (PubMed:21549604).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45346
  source_id: O45346
