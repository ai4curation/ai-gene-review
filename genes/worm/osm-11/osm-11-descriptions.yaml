gene_symbol: osm-11
organism: worm
uniprot_id: O45346
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable secreted lin-12/Notch ligand or co-ligand involved in the mediation
    of Notch signaling (PubMed:18700817, PubMed:21549604). Involved in the lin-12/Notch
    pathway signaling of cell fate in vulval precursor cells (VPCs), acting redundantly
    with dsl-1 and lag-2 (PubMed:18700817). Required for normal octanol avoidance
    response, acting via both lin-12/Notch and glp-1/Notch signaling pathways in neurons,
    in concert with lag-2 (PubMed:21549604). Involved in regulation of sleep-like
    quiescence during the larval to adult transition, acting via Notch receptor activation
    and in parallel with EGF signaling (PubMed:21549604).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45346
  source_id: O45346
- source: Alliance_Imported
  text: osm-11 encodes a protein required for normal osmosensation, osmotic resistance,
    and defecation rhythm, and for fully normal growth rate; OSM-11 has no clear orthologs
    outside of nematodes, but is paralogous to DOS-1, OSM-7, and K02F3.7, has a predicted
    signal sequence with 12 conserved cysteine residues, and may be secreted; osm-11
    mutants have abnormally high levels of internal glycerol, defective osmotic avoidance,
    and slowed defecation rhythms characteristic of worms under chronic osmotic stress;
    osm-11 mutants are also somewhat scrawny and slow-growing; osm-11(RNAi) animals
    show constitutive gpdh-1 transcription.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003891;class=Gene
  source_id: WB:WBGene00003891
- source: Alliance_Automated
  text: Enables Notch binding activity. Involved in several processes, including positive
    regulation of Notch signaling pathway; response to osmotic stress; and vulval
    development. Located in apical plasma membrane and extracellular region. Is expressed
    in several structures, including P3.p hermaphrodite; P4.p hermaphrodite; P5.p
    hermaphrodite; hermaphrodite gonad; and hypodermis.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003891;class=Gene
  source_id: WB:WBGene00003891
