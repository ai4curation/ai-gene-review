id: Q18287
gene_symbol: C28G1.2
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: C28G1.2 is a compact, divergent member of the Caenorhabditis intracellular serpin clade.
  It retains a serpin-fold-like scaffold but has no counterpart to the hinge and reactive-centre loop
  that its inhibitory paralogs (SRP-1, -2, -3, -6) use to trap proteases, and its function has not
  been studied experimentally (no PubMed record names the gene). Both ProtNLM2 GO claims assert serine
  protease inhibition, which the serpin suicide-substrate mechanism cannot deliver without a
  reactive-centre loop; both are scored as transfers of an inhibitory function onto a lineage that has
  lost the required structural element. This rests on sequence analysis, not on a biochemical assay.
