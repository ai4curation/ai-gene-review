    summary: The process claim depends on C28G1.2 acting as a serpin-type protease inhibitor. Local
      alignment to its inhibitory paralogs shows no counterpart to the hinge and reactive-centre loop,
      the element serpins use to trap target proteases, so the inhibitory function of the clade is
      not expected to hold for this divergent lineage. C. elegans serpins with demonstrated inhibitory
      activity are restricted to five full-length members, which do not include C28G1.2. No other
      mechanism of peptidase regulation has been reported for the gene; the conclusion is a
      sequence-level inference that no biochemical assay has tested.
