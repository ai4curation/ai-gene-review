  review:
    action: REMOVE
    summary: Root-node PAINT inference (PTN000156123) of extracellular localization. C28G1.2 belongs to
      the nematode clade L intracellular serpins (PANTHER PTN002479231/PTN002479232, with srp-1, srp-2,
      srp-3, srp-6, srp-7, srp-8), whose characterised members lack signal peptides and are cytosolic
      and not secreted. The target has no signal peptide feature.
    reason: 'The extracellular IBD at the PTHR11461 root reflects the many secreted serpins (vertebrate
      clades A and C-I, insect and plant serpins). The IBA reaches C28G1.2 only by descent from that root;
      the clade C28G1.2 actually sits in has direct contrary evidence: all C. elegans serpins lack signal
      peptides and N/C-terminal extensions, GFP fusions are cytoplasmic with no secretion into lumen,
      pseudocoelom or cuticle, and SRP-2 is an obligate intracellular serpin (PMID:25786854). C28G1.2
      shares the clade architecture (no N-terminal extension, no SIGNAL feature in UniProt). PAINT already
      records a loss of extracellular localization for another intracellular lineage (NOT GO:0005576 at
      PTN002606963), showing the root term is not intended to hold for intracellular serpin lineages;
      the nematode clade L appears simply not to have been given the corresponding NOT. No direct localization
      data exist for C28G1.2, so no replacement location is proposed.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000156123
        source_label: PTHR11461 root node (extracellular region IBD)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Root IBD is sound for secreted serpin lineages, but C28G1.2 lies in the nematode clade
          L intracellular serpin node PTN002479231, whose characterised members are cytosolic and not
          secreted, and no NOT GO:0005576 has been placed there (unlike PTN002606963).
      residue_claims_not_applicable: Localization question about a lineage lacking signal peptides, not
        a point-residue substitution.
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: Similar to the clade B serpins, these nematode serpins lacked a signal peptide
        and the N- and C-terminal extensions typical of serpins transiting the conventional ER–Golgi secretory
        pathway.
    - reference_id: PMID:25786854
      supporting_text: Green fluorescent protein (GFP)–nematode serpin fusions show a diffuse cytoplasmic
