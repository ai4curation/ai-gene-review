description: Caenorhabditis elegans C28G1.2 encodes a 265-residue serpin-domain-containing protein. Its
  compact, divergent sequence supports membership in the serpin structural superfamily but does not establish
  protease inhibition, collagen chaperoning or a specific cellular compartment. Its physiological function
  remains unknown.
