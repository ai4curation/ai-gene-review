  review:
    action: REMOVE
    summary: >-
      Root-level PAINT localization (PTN000156123, Archaea-Eukaryota) propagated into the nematode
      intracellular serpin clade, where the experimental evidence points the other way. The local
      PANTHER tree places C28G1.2 inside the Caenorhabditis duplication node PTN002479232 together with
      SRP-1, SRP-2, SRP-3 and SRP-6/7/8. The nematode serpins lack signal peptides, and their GFP
      fusions are cytoplasmic with no evidence of secretion. SRP-2 in particular is demonstrably
      cytosolic and is retained in the ER rather than secreted even when given an artificial signal
      peptide. C28G1.2 itself has no predicted signal peptide or transmembrane segment (Phobius). None of
      the seeds of the root node is a nematode protein. PAINT already records the analogous exception
      for the vertebrate intracellular clade B serpins (NOT extracellular region at PTN002606963) but has
      no equivalent negation at the nematode node. On biological grounds the extracellular
      localization is not expected to hold for this lineage. No positive localization can be
      substituted, because C28G1.2 has not been localized experimentally.
    reason: >-
      An over-propagated IBA that biological evidence argues against. The nearest relatives of C28G1.2
      in the tree (the paralogous C. elegans intracellular serpins) are cytosolic and lack signal
      peptides, and the target has no secretion signal either. The ancestral extracellular state at the
      family root was evidently replaced in the nematode clade, as it was in vertebrate clade B, where
      PAINT curators negated it explicitly.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000156123
        source_label: PTHR11461 family root (Archaea-Eukaryota)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The extracellular state is well supported by the secreted serpins among the seeds,
          none of which is a nematode protein. Within the root, C28G1.2 descends through the
          nematode intracellular serpin clade (PTN002479231 -> PTN002479232), whose characterised
          members are cytosolic and lack signal peptides. PAINT has no NOT at this clade, although it
          has one for vertebrate clade B (PTN002606963).
      residue_claims_not_applicable: Localization claim; no catalytic or binding residue is involved.
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: Similar to the clade B serpins, these nematode serpins lacked a signal peptide
        and the N- and C-terminal extensions typical of serpins transiting the conventional ER–Golgi
        secretory pathway.
    - reference_id: PMID:25786854
      supporting_text: Green fluorescent protein (GFP)–nematode serpin fusions show a diffuse cytoplasmic
        appearance and no evidence of secretion into the intestinal cell lumen, the pseudocoelomic
        space, or the cuticle
    - reference_id: PMID:14739286
      supporting_text: they lack typical N-terminal signal peptides and
        reside intracellularly
    - reference_id: file:worm/C28G1.2/C28G1.2-bioinformatics/RESULTS.md
      supporting_text: Phobius predicts no signal peptide and no transmembrane segment.
    - reference_id: file:worm/C28G1.2/C28G1.2-bioinformatics/RESULTS.md
      supporting_text: PTN002479232 is a multifurcating duplication node whose children are the C.
        elegans/C. briggsae paralog lineages
