  label: Caenorhabditis elegans
description: >-
  C28G1.2 (WBGene00016187, X chromosome) encodes a 265-residue member of the serpin superfamily, the
  only protein product annotated for the gene. In the PANTHER serpin tree it is one of the paralogous
  lineages that arose by duplication within the Caenorhabditis intracellular (clade L) serpins, next to
  the inhibitory serpins SRP-1, SRP-2, SRP-3 and SRP-6/7/8, and it has an ortholog only in other
  Caenorhabditis species. Compared with those paralogs it is markedly shorter and more divergent: it
  retains a compact serpin-fold-like scaffold but lacks the hinge and reactive-centre loop that
  inhibitory serpins use to trap target proteases, as well as several segments of the N-terminal half.
  It has no predicted signal peptide or transmembrane segment, like its cytosolic paralogs. Its
  molecular function, localization and biological role have not been studied and remain unknown; the
  loss of the reactive-centre loop suggests it is not a serpin-mechanism protease inhibitor.
