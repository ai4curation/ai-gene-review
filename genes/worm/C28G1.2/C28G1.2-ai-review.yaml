suggested_questions:
- question: >-
    PAINT node PTN002479231 (Rhabditida-Chromadorea) now carries an IBD for GO:0004867 serine-type
    endopeptidase inhibitor activity, and C28G1.2 descends from it. Should the C28G1.2 lineage
    (PTN007508270) carry an IKR/NOT for that activity, given that it lacks the hinge and reactive-centre
    loop? And should the nematode intracellular serpin clade carry a NOT for GO:0005576 extracellular
    region, as the vertebrate clade B node PTN002606963 already does?
- question: Does purified C28G1.2 adopt a serpin fold, and does it bind any protease or other partner
    despite lacking a reactive-centre loop?
- question: Is C28G1.2 expressed, and in which tissues and subcellular compartment?
suggested_experiments:
- description: >-
    Endogenous CRISPR tagging of C28G1.2 (e.g. C-terminal GFP or epitope) to determine its expression
    pattern and subcellular localization, comparing it with cytosolic SRP-2 and SRP-6.
  hypothesis: Like its paralogs, C28G1.2 is a cytosolic protein that is not secreted.
- description: >-
    Express recombinant C28G1.2 and test it against the proteases targeted by its paralogs (granzyme B,
    cathepsins L/K/S/V, calpain, chymotrypsin). Measure SDS-stable complex formation and the
    stoichiometry of inhibition, and use SRP-2 as a positive control.
  hypothesis: Because it lacks a reactive-centre loop, C28G1.2 does not inhibit proteases by the serpin
    mechanism.
