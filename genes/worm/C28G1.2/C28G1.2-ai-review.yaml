  review:
    action: UNDECIDED
    summary: The extracellular IBA represents an ancestral localization inference, not a direct secretion
      assay. The compact target has no called signal peptide in the retrieved record, but that alone cannot
      overrule the phylogenetic judgment or exclude unconventional export. Target localization and the
      applicability of the secretion-bearing ancestor to this divergent architecture remain unresolved.
