core_functions: []
suggested_questions:
- question: Is C28G1.2 a stably folded protein in vivo, and does its RCL-less serpin fold have a non-inhibitory
    binding function?
- question: Should PAINT add a NOT extracellular region (GO:0005576) IRD at the nematode clade L node
    (PTN002479231), consistent with the cytosolic localization of SRP-2 and other worm serpins?
knowledge_gaps:
- gap_statement: The molecular function of C28G1.2 is unknown. It is a serpin-fold protein that lacks
    the reactive-centre loop, so it is not expected to inhibit proteases by the serpin mechanism, and
    no alternative activity, binding partner, expression pattern or subcellular location has been measured.
  boundary: It is established that C28G1.2 belongs to the nematode intracellular (clade L) serpin lineage
    and has a conserved, truncated RCL-less architecture shared with its C. briggsae ortholog. Whether
    it is folded, what it binds, and where it acts are unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Conserved RCL-less serpin paralogs could represent a non-inhibitory serpin function in
    nematodes (as for clade B non-inhibitory serpins), or a regulatory decoy for the inhibitory paralogs.
  resolution: Endogenous tagging for expression and localization, recombinant protein folding/stability
    assays, and affinity proteomics to identify partners; protease inhibition assays as a negative control.
suggested_experiments:
- description: CRISPR knock-in of a fluorescent tag at the C28G1.2 locus to define tissue expression and
    subcellular localization, compared with SRP-2::GFP.
- description: Express recombinant C28G1.2 and test inhibition of chymotrypsin, cathepsin G, granzyme-like
    and papain-like proteases alongside SRP-2/SRP-3 controls; absence of SDS-stable complexes would confirm
    a non-inhibitory serpin.
