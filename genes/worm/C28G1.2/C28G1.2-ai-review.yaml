description: C28G1.2 encodes a 265-residue serpin-domain protein of Caenorhabditis elegans. It is a Caenorhabditis-specific
  paralog within the nematode clade L serpins, the intracellular serpin lineage related to vertebrate
  clade B serpins that also includes the characterised protease inhibitors SRP-2 and SRP-3. Compared with
  these full-length serpins it lacks an internal segment and the hinge/reactive-centre loop that inhibitory
  serpins use as protease bait, a truncated architecture shared with its C. briggsae ortholog. It therefore
  is unlikely to act as a canonical protease inhibitor. Like other worm serpins it has no signal peptide.
  Its expression, localization and molecular function have not been studied.
