descriptions:
- source: UniProt
  text: Argonaute protein which is involved in the endogenous small interfering RNA
    (endo-siRNA) pathway and is required for RNA-mediated gene silencing (RNAi) in
    the germline (PubMed:17110334, PubMed:29791857, PubMed:30728462). Interacts with
    secondary 22G-RNAs, which are RNA-dependent RNA polymerase-derived endo-siRNAs,
    typically 22 nucleotides in length with a 5'guanosine residue (PubMed:29791857).
    Also interacts with the mRNA targets of 22G-RNAs (PubMed:29791857). Associates
    with znfx-1 to mediate small RNA-directed transgenerational epigenetic inheritance
    of both germline- and soma-expressed genes (PubMed:29769721, PubMed:29791857).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O62275
  source_id: O62275
- source: Alliance_Automated
  text: Predicted to enable RNA endonuclease activity; miRNA binding activity; and
    single-stranded RNA binding activity. Involved in regulatory ncRNA-mediated heterochromatin
    formation. Acts upstream of or within with a positive effect on regulation of
    gene silencing by regulatory ncRNA. Located in cytoplasm. Is expressed in several
    structures, including EMS; Psub1; Psub2; germ line; and oocyte.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00010263;class=Gene
  source_id: WB:WBGene00010263
- source: RefSeq
  text: Predicted to enable RNA endonuclease activity; miRNA binding activity; and
    single-stranded RNA binding activity. Involved in regulatory ncRNA-mediated heterochromatin
    formation. Acts upstream of or within with a positive effect on regulation of
    gene silencing by regulatory ncRNA. Predicted to be located in perinuclear region
    of cytoplasm. Predicted to be part of RISC complex. Predicted to be active in
    cytoplasmic ribonucleoprotein granule and nucleus. Is expressed in several structures,
    including EMS; Psub1; Psub2; germ line; and oocyte. [provided by Alliance of Genome
    Resources, Jul 2025]
