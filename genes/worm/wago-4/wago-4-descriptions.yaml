descriptions:
- source: UniProt
  text: Argonaute protein which is involved in the endogenous small interfering RNA
    (endo-siRNA) pathway and is required for RNA-mediated gene silencing (RNAi) in
    the germline (PubMed:17110334, PubMed:29791857, PubMed:30728462). Interacts with
    secondary 22G-RNAs, which are RNA-dependent RNA polymerase-derived endo-siRNAs,
    typically 22 nucleotides in length with a 5'guanosine residue (PubMed:29791857).
    Also interacts with the mRNA targets of 22G-RNAs (PubMed:29791857). Associates
    with znfx-1 to mediate small RNA-directed transgenerational epigenetic inheritance
    of both germline- and soma-expressed genes (PubMed:29769721, PubMed:29791857).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O62275
