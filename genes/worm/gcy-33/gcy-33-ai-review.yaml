taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'GCY-33 is an atypical soluble guanylate cyclase (sGC) subunit of Caenorhabditis
  elegans of the beta3-like clade, with an H-NOX heme domain, an HNOB-associated domain, a
  coiled coil, a C-terminal guanylate cyclase domain and a long C-terminal extension with
  a predicted prenylation site. Its H-NOX domain binds O2, NO and CO in vitro. In the BAG
  gas-sensing neurons GCY-33 acts with GCY-31 (probably as a heterodimer) to detect decreases
  in O2: a fall in O2 raises cGMP, opening TAX-2/TAX-4 channels and depolarizing BAG. GCY-33
  is also expressed in the URX, AQR and PQR neurons and contributes to O2-upshift behavior.
  PDL-1 (PrBP/PDE6delta) targets GCY-33 to BAG and URX dendritic endings, where it colocalizes
  with the globin GLB-5. GCY-33 also modulates quinine avoidance non-cell-autonomously, upstream
  of the cGMP-dependent kinase EGL-4.'
