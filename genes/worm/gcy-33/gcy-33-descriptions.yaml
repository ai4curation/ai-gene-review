- source: Alliance_Imported
  text: gcy-33 encodes a soluble guanylate cyclase beta subunit; GCY-33 activity is
    required in the ciliated BAG head sensory neurons to sense decreases in O2 levels
    and effect corresponding behavioral changes; a gcy-33::GFP reporter is expressed
    in the BAG neurons; biochemical characterization of chimeric molecules containing
    the GCY-33 N-terminal H-NOX domain fused to the rat beta1 guanylate cyclase indicate
    that the GCY-33 H-NOX domain can form complexes with NO, CO, and O2 and that binding
    can positively regulate catalytic activity of the molecule.
  source_type: curated
