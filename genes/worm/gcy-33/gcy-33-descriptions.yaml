- source: Alliance_Automated
  text: Enables carbon monoxide sensor activity; nitric oxide binding activity; and
    oxygen sensor activity. Involved in chemosensory behavior; response to oxygen
    levels; and sensory perception of bitter taste. Predicted to be located in cytoplasm.
    Predicted to be part of guanylate cyclase complex, soluble. Is expressed in oxygen
    sensory neurons.
