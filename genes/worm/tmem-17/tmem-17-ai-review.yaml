suggested_questions:
- question: >-
    Is C. elegans TMEM-17 a biochemical subunit of the MKS (tectonic-like) complex,
    as human TMEM17 is? No worm biochemical evidence exists yet, so MKS complex
    membership has not been asserted here.
suggested_experiments:
- description: >-
    Co-immunoprecipitation or proximity labelling of endogenous TMEM-17 with
    TMEM-107, TMEM-231 and MKS-2 in ciliated neurons, to test the predicted
    TMEM107/TMEM17/TMEM231 submodule.
