id: Q23481
gene_symbol: tmem-17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  TMEM-17 (ZK418.3) is the Caenorhabditis elegans ortholog of human TMEM17, a small
  three-pass integral membrane protein of the TMEM17/TMEM216/TMEM80 family, located
  at the ciliary transition zone (TZ). It is a peripheral (layer 3) component of the
  MKS module. Its TZ localization depends on the assembly factors MKS-5 and CEP-290,
  on core MKS proteins, and on TMEM-107. In cep-290 mutants it is retained in the
  dendrite instead of reaching the TZ. Endogenously expressed TMEM-17::GFP forms
  striated, ring- or spiral-like bands at the TZ of all ciliated sensory neurons.
  Loss of tmem-17 alone does not perturb MKS-2 localization or the ciliary gate. In
  combination with nphp-4 loss, however, it causes strong dye-filling
  (ciliogenesis) defects, showing that TMEM-17 acts redundantly with the NPHP
  module in TZ and cilium formation. Human TMEM17 variants cause oral-facial-digital
  syndrome type 6, Joubert syndrome and Meckel syndrome, and the corresponding
  worm substitutions reduce TMEM-17 abundance at the TZ and its function.
