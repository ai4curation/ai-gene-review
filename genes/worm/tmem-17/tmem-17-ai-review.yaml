core_functions:
- description: >-
    Peripheral integral membrane component of the MKS module at the ciliary
    transition zone. It is recruited by MKS-5, CEP-290, core MKS proteins and
    TMEM-107, and acts redundantly with the NPHP module to support TZ and cilium
    formation. Unlike core MKS proteins, TMEM-17 is not required for the C. elegans
    ciliary gate or for MKS-2 localization. 'structural molecule activity' is a
    placeholder: no GO molecular-function term describes a TZ membrane scaffold
    subunit.
