- source: Alliance_Imported
  text: cct-6 encodes, by alternative splicing, two isoforms of a putative zeta subunit
    of the eukaryotic cytosolic ('T complex') chaperonin, orthologous to human CCT6A
    (OMIM:104613); CCT-6 represses SKN-1-dependent transcription of gst-4; CCT-6 is
    expressed in a few cells of pre-comma stage embryos; in mass RNAi assays, CCT-6
    is required for normally short life span, and for normal transgene subcellular
    localization, embryonic and larval viability, fertility, vulval development, locomotion,
    and osmoregulation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000381;class=Gene
