gene_symbol: cct-6
organism: worm
uniprot_id: P46550
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P46550
  source_id: P46550
- source: Alliance_Imported
  text: cct-6 encodes, by alternative splicing, two isoforms of a putative zeta subunit
    of the eukaryotic cytosolic ('T complex') chaperonin, orthologous to human CCT6A
    (OMIM:104613); CCT-6 represses SKN-1-dependent transcription of gst-4; CCT-6 is
    expressed in a few cells of pre-comma stage embryos; in mass RNAi assays, CCT-6
    is required for normally short life span, and for normal transgene subcellular
    localization, embryonic and larval viability, fertility, vulval development, locomotion,
    and osmoregulation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000381;class=Gene
  source_id: WB:WBGene00000381
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Predicted
    to be located in cytoplasm. Predicted to be part of chaperonin-containing T-complex.
    Orthologous to several human genes including CCT6B (chaperonin containing TCP1
    subunit 6B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000381;class=Gene
  source_id: WB:WBGene00000381
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
    in protein folding. Predicted to be located in cytoplasm. Predicted to be part
    of chaperonin-containing T-complex. Orthologous to several human genes including
    CCT6B (chaperonin containing TCP1 subunit 6B). [provided by Alliance of Genome
    Resources, Jul 2025]
  source_type: automated
