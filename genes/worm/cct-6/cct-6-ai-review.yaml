  label: Caenorhabditis elegans
description: cct-6 encodes the zeta (CCT6 / TCP-1-zeta) subunit of the eukaryotic cytosolic
  chaperonin CCT/TRiC, an ATP-dependent double-ring chaperonin built from eight distinct paralogous
  subunits per ring that folds a subset of cytosolic proteins, notably actin and tubulin.
  The zeta subunit lies in the low-ATP-affinity hemisphere of the ring, so its role is chiefly
  structural and substrate-contacting. In C. elegans cct-6 is expressed at all life stages;
  an endogenously tagged CCT-6 is abundant throughout the germline and in oocytes, and its
  levels fall when another subunit (cct-2) is depleted, consistent with co-dependent complex
  stability. CCT function in oocytes prevents ectopic RNA-binding-protein condensation, and
  cct-6 knockdown blunts the lifespan extension conferred by overexpressing other CCT subunits.
