core_functions:
- description: cct-6 is the zeta subunit of the cytosolic chaperonin CCT/TRiC, located in
    the low-ATP-affinity hemisphere of the ring. Its contribution to the ATP-dependent folding
    of actin, tubulin and other cytosolic clients is as a structural and substrate-contacting
    member of the folding chamber rather than as a major ATPase; the foldase activity belongs
    to the assembled complex.
