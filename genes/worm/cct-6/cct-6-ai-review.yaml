  review:
    summary: cct-6 (zeta subunit) is a subunit of the cytosolic chaperonin CCT/TRiC, which
      folds actin, tubulin and other cytosolic proteins in an ATP-dependent manner. Protein
      folding is the core biological process for every CCT subunit.
    action: ACCEPT
    reason: The PAINT inference places protein folding at the root of the CCT subfamily tree;
      the worm subunit sits squarely inside that clade (PANTHER PTHR11353; InterPro IPR012722).
      In C. elegans, depletion of CCT subunits causes actin aggregation and tubulin loss,
      confirming the folding role in vivo. The complex performs the folding, and each subunit
      contributes directly to the folding chamber.
    supported_by:
    - &id003
      reference_id: PMID:16762366
      supporting_text: The eukaryotic cytosolic chaperonin CCT is an essential ATP-dependent
        protein folding machine whose action is required for folding the cytoskeletal proteins
        actin and tubulin
    - reference_id: PMID:25143409
      supporting_text: CCT depletion causes a reduction in the tubulin levels and disorganization
        of the microtubule network
