gene_symbol: osm-5
organism: worm
uniprot_id: G5ED37
taxon_id: NCBITaxon:6239
status: COMPLETE
descriptions:
- source: Alliance_Imported
  text: osm-5 encodes the ortholog of the murine polycystic kidney disease gene Tg737
    (which encodes the protein Polaris) and human IFT88; osm-5 is required for the
    proper morphology of the cilia of chemosensory neurons and is involved in intraflagellar
    transport; the abnormalities in cilia structure in osm-5 mutants lead to defects
    in several processes like osmotic avoidance, chemotaxis, dauer formation, male
    mating and life span; osm-5 is expressed in ciliated sensory neurons and localizes
    to the transition zones of the amphids, phasmids, labials and rays of the male
    tail; osm-5 expression is regulated by the RFX-type transcription factor, DAF-19,
    that also regulates the expression of other genes involved in cilia formation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003885;class=Gene
  source_id: WB:WBGene00003885
