    overall_notes: IFT88/Polaris ortholog required for cilium morphology and IFT,
      with phenotypes and DAF-19 regulation. Transition-zone localization is narrower
      than the review's ciliary base and axoneme.
- source: Alliance_Automated
  text: Predicted to enable kinesin binding activity. Involved in several processes,
    including dauer entry; locomotory exploration behavior; and non-motile cilium
    assembly. Located in ciliary basal body; neuron projection; and non-motile cilium.
    Part of intraciliary transport particle B. Is expressed in amphid sensillum and
    neurons. Used to study autosomal dominant polycystic kidney disease. Orthologous
    to human IFT88 (intraflagellar transport 88).
