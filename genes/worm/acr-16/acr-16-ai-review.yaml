gene_symbol: acr-16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ACR-16 is an alpha-type subunit of the Cys-loop nicotinic acetylcholine receptor family in Caenorhabditis
  elegans and the closest nematode relative of vertebrate CHRNA7 (alpha7). Like alpha7 it forms homopentameric acetylcholine-gated
  cation channels that are activated by nicotine, desensitize rapidly, are blocked by dihydro-beta-erythroidine
  and are not activated by levamisole; robust surface expression needs the ER chaperone RIC-3. In body-wall muscle
  ACR-16 forms the levamisole-insensitive, nicotine-sensitive AChR (N-AChR) at the postsynaptic membrane of cholinergic
  neuromuscular junctions, where it carries the fast excitatory cholinergic current. It acts partially redundantly
  with the levamisole-sensitive receptor, so that loss of both receptors causes near paralysis. Its synaptic localization
  depends on the Ror receptor tyrosine kinase CAM-1. ACR-16 is also expressed in the backward command interneuron
  AVA, where ACR-16-containing receptors, together with receptors containing UNC-29 and ACR-18, relay cholinergic
  input that triggers reversal during male mating.
