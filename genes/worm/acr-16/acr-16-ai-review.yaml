- id: file:worm/acr-16/acr-16-deep-research-manual.md
  title: acr-16 manual literature research
core_functions:
- description: Alpha7-like nicotinic acetylcholine receptor subunit that forms homopentameric acetylcholine-gated
    cation channels (the levamisole-insensitive N-AChR) in the postsynaptic membrane of body-wall muscle, carrying
    the fast excitatory cholinergic current at the neuromuscular junction.
  molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
  directly_involved_in:
  - id: GO:0007274
    label: neuromuscular synaptic transmission
  - id: GO:0060079
    label: excitatory postsynaptic potential
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  in_complex:
    id: GO:0005892
    label: acetylcholine-gated channel complex
  supported_by:
  - reference_id: PMID:19020092
    supporting_text: These recombinant receptors had the expected properties of N-AChRs because they were activated
      by nicotine and insensitive to levamisole.
  - reference_id: PMID:8627624
    supporting_text: Upon expression in the Xenopus oocyte system, the Ce21 subunit assembled into a functional
      homomeric nAChR
  - reference_id: PMID:15944127
    supporting_text: acr-16 mutants lack fast cholinergic current at the NMJ
  - reference_id: PMID:15917232
    supporting_text: Electrophysiological analysis of the acr-16 deletion mutant showed that the levamisole-insensitive
      muscle acetylcholine current was eliminated
suggested_questions:
- question: Is the native muscle N-AChR an ACR-16 homopentamer, or does it include other subunits in vivo?
- question: What is the Ca2+ permeability of ACR-16 receptors, and does Ca2+ entry through them have signalling
    roles in muscle or AVA?
- question: 'Which subcellular structure do the WormBase cell projection (GO:0042995) IDA rows refer to: muscle
    arms or neuronal processes?'
suggested_experiments:
- description: Measure reversal potentials of reconstituted ACR-16 (with RIC-3) receptors under bi-ionic conditions
    to estimate PCa/PNa.
  hypothesis: ACR-16 homomers are highly Ca2+-permeable, like vertebrate alpha7.
- description: Affinity purification of tagged ACR-16 from muscle followed by mass spectrometry.
  hypothesis: The muscle N-AChR is a homopentamer without other AChR subunits.
