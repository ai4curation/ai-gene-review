- source: Alliance_Automated
  text: Enables acetylcholine-gated monoatomic cation-selective channel activity.
    Involved in monoatomic ion transmembrane transport. Predicted to be located in
    postsynaptic membrane. Predicted to be part of acetylcholine-gated channel complex.
    Predicted to be active in plasma membrane. Is expressed in body wall musculature;
    linker cell; muscle cell; and neurons. Used to study nicotine dependence. Human
    ortholog(s) of this gene implicated in chronic obstructive pulmonary disease;
    esophagus squamous cell carcinoma; lung cancer; malignant pleural mesothelioma;
    and schizophrenia. Orthologous to human CHRFAM7A (CHRNA7 (exons 5-10) and FAM7A
    (exons A-E) fusion) and CHRNA7 (cholinergic receptor nicotinic alpha 7 subunit).
  source_type: automated
