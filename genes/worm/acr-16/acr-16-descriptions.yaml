gene_symbol: acr-16
organism: worm
uniprot_id: P48180
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: After binding acetylcholine, the AChR responds by an extensive change in conformation
    that affects all subunits and leads to opening of an ion-conducting channel across
    the plasma membrane (By similarity). A subunit of the levamisole-insensitive nicotinic
    receptor.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48180
  source_id: P48180
- source: Alliance_Imported
  text: acr-16 encodes an alpha-7-like homomer-forming subunit of the nicotinic acetylcholine
    receptor (nAChR) superfamily orthologous to human nicotinic cholinergic receptor
    alpha 7 (CHRNA7; OMIM:118511; possibly associated with schizophrenia and juvenile
    myoclonic epilepsy); ACR-16 functions as a ligand-gated ion channel that is required
    for the major fast cholinergic excitatory current at C. elegans neuromuscular
    junctions; when expressed in Xenopus ooctyes, ACR-16 is active as a homomeric
    receptor and responds robustly to acetylcholine; an ACR-16::GFP reporter fusion
    expressed in muscle cells localizes to the tips of muscle arms, specific regions
    of the muscle cell membrane that form synapses with neuronal processes; acr-16::gfp
    promoter fusions also reveal expression in a subset of neurons; ACR-16 localization
    to postsynaptic regions, a key component of activity-dependent synaptic plasticity,
    is regulated by a Wnt signaling pathway that includes CWN-2, LIN-17, CAM-1, and
    DSH-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000055;class=Gene
  source_id: WB:WBGene00000055
- source: Alliance_Automated
  text: Enables acetylcholine-gated monoatomic cation-selective channel activity.
    Involved in monoatomic ion transmembrane transport. Predicted to be located in
    postsynaptic membrane. Predicted to be part of acetylcholine-gated channel complex.
    Predicted to be active in plasma membrane. Is expressed in body wall musculature;
    linker cell; muscle cell; and neurons. Used to study nicotine dependence. Human
    ortholog(s) of this gene implicated in chronic obstructive pulmonary disease;
    esophagus squamous cell carcinoma; lung cancer; malignant pleural mesothelioma;
    and schizophrenia. Orthologous to human CHRFAM7A (CHRNA7 (exons 5-10) and FAM7A
    (exons A-E) fusion) and CHRNA7 (cholinergic receptor nicotinic alpha 7 subunit).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000055;class=Gene
  source_id: WB:WBGene00000055
- source: RefSeq
  text: Enables acetylcholine-gated monoatomic cation-selective channel activity.
    Involved in monoatomic ion transmembrane transport. Predicted to be located in
    postsynaptic membrane. Predicted to be part of acetylcholine-gated channel complex.
