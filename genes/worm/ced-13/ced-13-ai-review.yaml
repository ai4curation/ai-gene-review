  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:24813612
  title: The intrinsic apoptosis pathway mediates the pro-longevity response to
    mitochondrial ROS in C. elegans.
  findings:
  - statement: CED-13, not EGL-1, is needed upstream of mtROS and CED-4 for the protective,
      pro-longevity response of mitochondrial mutants; ced-13 loss has little effect on
      apoptosis.
    supporting_text: Moreover, unlike apoptosis, which requires the BH3-only protein EGL-1,
      the suppression of isp-1 and nuo-6 requires the BH3-only protein CED-13, which is not
      required for apoptosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:29666474
  title: The cisd gene family regulates physiological germline apoptosis through ced-13
    and the canonical cell death pathway in Caenorhabditis elegans.
  findings:
  - statement: ced-13 loss suppresses the increased physiological germ cell death of cisd
      mutants.
    supporting_text: Here we demonstrate that the CISD family members play a pro-survival
      role in the process of apoptosis and that they function through the Bcl-2 family
      CED-9 and BH3 domain CED-13 but not through EGL-1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
core_functions:
- description: >-
    CED-13 is a BH3-only protein that binds the pro-survival BCL2-family protein CED-9 and
    can release CED-4 from CED-9, promoting CED-3 activation. It is induced by CEP-1/p53
    after DNA damage and feeds into the core apoptotic pathway, and it also activates the
    CED-9/CED-4 pathway non-apoptotically in the mitochondrial ROS longevity response.
  proposed_molecular_function: pro-survival BCL2 family protein inhibitor activity
  directly_involved_in:
  - id: GO:0042771
    label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class
      mediator
  - id: GO:0043065
    label: positive regulation of apoptotic process
  supported_by:
  - reference_id: PMID:15605074
    supporting_text: We demonstrate that CED-13 protein physically interacts with the
      antiapoptotic Bcl-2-related protein CED-9.
  - reference_id: PMID:16167070
    supporting_text: synthetic peptides corresponding to the BH3 domains of worm BH3-only
      proteins (EGL-1, CED-13) dissociate CED-4 from CED-9
proposed_new_terms:
- proposed_name: pro-survival BCL2 family protein inhibitor activity
  proposed_definition: Binding to a pro-survival BCL2-family protein through a BH3-mediated
    interaction to inhibit that protein from sequestering pro-apoptotic BCL2-family
    effectors or activators.
  justification: CED-13, like EGL-1 and the mammalian BH3-only proteins, donates a BH3 helix
    to a pro-survival BCL2-family protein (CED-9) and inhibits its sequestration of CED-4.
    GO:0051400 BH domain binding and GO:0051434 BH3 domain binding describe binding to a BH
    domain, which is the groove-side receptor's activity. The same term is proposed in the
    egl-1 review.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:16167070
    supporting_text: synthetic peptides corresponding to the BH3 domains of worm BH3-only
      proteins (EGL-1, CED-13) dissociate CED-4 from CED-9
suggested_questions:
- question: Should the CED-13-dependent, non-apoptotic activation of the CED-9/CED-4/CED-3
    pathway by mitochondrial ROS (PMID:24813612) be annotated, and with which process term,
    given that it promotes longevity and stress protection rather than cell death?
- question: Why does CED-13 drive a protective, non-lethal output of the same CED-9/CED-4
    pathway that EGL-1 uses to kill cells?
suggested_experiments:
- hypothesis: CED-13 and EGL-1 differ in where they are expressed or in how strongly they
    bind CED-9, which explains their different outputs.
  description: Compare CED-9 binding affinity and CED-4 release for full-length CED-13 and
    EGL-1 in vitro, and map endogenous tagged CED-13 expression in somatic tissues of isp-1
    and nuo-6 mutants versus wild type.
