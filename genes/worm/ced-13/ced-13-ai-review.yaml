gene_symbol: ced-13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ced-13 encodes a small BH3-only protein of the EGL-1 family (Pfam PF11430), the second
  BH3-only protein of Caenorhabditis elegans. Its transcription is induced by ionizing
  radiation and other genotoxic stress in a CEP-1/p53-dependent manner, together with
  egl-1. CED-13 binds the BCL2-family survival protein CED-9, and a CED-13 BH3 peptide,
  like that of EGL-1, displaces CED-4 from the CED-9/CED-4 complex in vitro.
  Overexpression in somatic cells kills cells that normally survive, through the core
  CED-9/CED-4/CED-3 pathway. Loss of ced-13 alone has little effect on developmental or
  DNA-damage-induced death; it contributes to physiological germ cell death that is
  increased when CISD (mitoNEET-like) proteins are lost. CED-13 also has a non-apoptotic
  role: it is required, upstream of mitochondrial ROS and CED-4, for the
  intrinsic-pathway-dependent pro-longevity and protective response of mitochondrial
  respiratory-chain mutants such as isp-1 and nuo-6.
existing_annotations:
- term:
    id: GO:0042771
    label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class
      mediator
  evidence_type: IDA
  original_reference_id: PMID:15605074
  qualifier: involved_in
  review:
    summary: ced-13 is a CEP-1/p53 transcriptional target induced by DNA damage that encodes
      a CED-9-binding BH3-only protein.
    action: ACCEPT
    reason: >-
      ced-13 mRNA accumulates after DNA damage in a cep-1-dependent way, and CED-13 binds
      CED-9 (PMID:15605074). Transcriptional profiling confirmed that egl-1 and ced-13 are
      the main cep-1-dependent IR-induced genes (PMID:18627611). This places CED-13 as a
      BH3-only signaling component downstream of the p53-class mediator, the same position
      as EGL-1. Its requirement for DNA-damage-induced germ cell death is weak and partly
      redundant with EGL-1 (PMID:24813612), but the curator saw the full text, and the term
      describes the pathway in which CED-13 acts.
    additional_reference_ids:
    - PMID:18627611
    - PMID:24813612
    supported_by:
    - reference_id: PMID:15605074
      supporting_text: We show that ced-13 mRNA accumulates following DNA damage, and that
        this accumulation is dependent on an intact C. elegans cep-1/p53 gene.
    - reference_id: PMID:18627611
      supporting_text: Besides a nematode specific gene we found that only egl-1 and ced-13
        are upregulated by IR and transcriptionally dependent on cep-1.
- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IGI
  original_reference_id: PMID:15605074
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00001170
  review:
    summary: CED-13 overexpression kills somatic cells through the core apoptotic pathway.
    action: ACCEPT
    reason: >-
      Somatic overexpression of ced-13 causes death of cells that normally survive, and this
      death requires the core CED pathway (PMID:15605074). Loss of ced-13 suppresses the
      increased germ cell death of cisd mutants (PMID:29666474). As a BH3-only inhibitor of
      CED-9, CED-13 promotes apoptosis, matching the same term on egl-1.
    additional_reference_ids:
    - PMID:29666474
    supported_by:
    - reference_id: PMID:15605074
      supporting_text: Furthermore, overexpression of ced-13 in somatic cells leads to the
        death of cells that normally survive, and this death requires the core apoptotic
        pathway of C. elegans.
    - reference_id: PMID:29666474
      supporting_text: Combined, these data demonstrate that the cisd gene family could
        function as regulators of physiological germline programmed cell death acting
        through ced-13 function.
- term:
    id: GO:0051400
    label: BH domain binding
  evidence_type: IPI
  original_reference_id: PMID:15605074
  qualifier: enables
  supporting_entities:
  - WB:WBGene00000423
  review:
    summary: CED-13 binds CED-9 and its BH3 domain displaces CED-4 from CED-9.
    action: MODIFY
    reason: >-
      The CED-13/CED-9 interaction is real and is the core CED-13 molecular function
      (PMID:15605074, PMID:16167070). BH domain binding describes binding to a BH domain.
      CED-13 is the BH3 ligand and CED-9 provides the groove, so the term says little about
      what CED-13 does. Following the egl-1 review, the activity is better represented by a
      BH3-ligand-side inhibitor activity for pro-survival BCL2-family proteins, for which GO
      has no term yet.
    proposed_replacement_terms:
    - id: NTR
      label: pro-survival BCL2 family protein inhibitor activity
    additional_reference_ids:
    - PMID:16167070
    supported_by:
    - reference_id: PMID:15605074
      supporting_text: We demonstrate that CED-13 protein physically interacts with the
        antiapoptotic Bcl-2-related protein CED-9.
    - reference_id: PMID:16167070
      supporting_text: synthetic peptides corresponding to the BH3 domains of worm BH3-only
        proteins (EGL-1, CED-13) dissociate CED-4 from CED-9
references:
- id: PMID:15605074
  title: C. elegans ced-13 can promote apoptosis and is induced in response to DNA damage.
  findings:
  - statement: ced-13 encodes a conserved BH3-only protein, is induced by DNA damage via
      cep-1, binds CED-9 and kills cells when overexpressed.
    supporting_text: Here we describe the Caenorhabditis elegans gene ced-13, which encodes
      a conserved BH3-only protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. Source of all three GOA rows.
- id: PMID:16167070
  title: 'CED-4 forms a 2 : 2 heterotetrameric complex with CED-9 until specifically displaced
    by EGL-1 or CED-13.'
  findings:
  - statement: The CED-13 BH3 peptide dissociates CED-4 from wild-type CED-9 but not from
      CED-9(G169E).
    supporting_text: synthetic peptides corresponding to the BH3 domains of worm BH3-only
      proteins (EGL-1, CED-13) dissociate CED-4 from CED-9, but not from the
      gain-of-function CED-9 (G169E) mutant
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache.
- id: PMID:18627611
  title: Transcriptional profiling in C. elegans suggests DNA damage dependent apoptosis
    as an ancient function of the p53 family.
  findings:
  - statement: egl-1 and ced-13 are the main cep-1-dependent IR-induced genes.
    supporting_text: Besides a nematode specific gene we found that only egl-1 and ced-13
