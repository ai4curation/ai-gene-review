descriptions:
- source: Alliance_Imported
  text: ced-13 encodes a 98-residue protein with a single BH3 domain, whoseoverexpression
    promotes CED-3/4-dependent apoptosis; CED-13 binds theBcl-2 ortholog CED-9, and
    ced-13 is transcriptionally activated by the p53ortholog CEP-1, and the ced-13
    promoter contains several potentialp53-binding sites; ced-13 mutations are mostly
    indistinguishable fromwild-type, but may enhance the abnormal response to germline
    irradiationseen for egl-1 mutations; peptides containing the BH3 domains of eitherCED-13
    or EGL-1 can dissociate stable CED-4/CED-9 heterotetramers invitro if CED-9 is
    wild-type, but not if CED-9 has a gain-of-function G169Emutation.
  source_type: curated
