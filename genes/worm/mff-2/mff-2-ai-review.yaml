      as a control for proteins exposed to the cytosol
suggested_questions:
- question: Does MFF-2 bind DRP-1 directly in C. elegans? If DRP-1 recruitment does not need Mff, what
    step of fission does MFF-2 promote (for example DRP-1 oligomerisation or activation at ER contact
    sites)?
- question: Do MFF-1 and MFF-2 differ in tissue expression or in how they divide between peroxisomes and
    mitochondria?
- question: PMID:21248201 calls F55F8.6 both mff-2 and "MFF-1 (F55F8.6)". Which antibody and locus were
    actually used for the outer-membrane control?
suggested_experiments:
- description: Endogenous tagging of MFF-1 and MFF-2 with distinct fluorophores, co-imaged with peroxisome
    and mitochondrial markers and DRP-1, to test dual targeting and redundancy at single fission sites.
- description: In vitro binding of recombinant MFF-2 cytosolic domain to DRP-1, and DRP-1 GTPase/oligomerisation
    assays in its presence.
