  supporting_entities:
  - UniRule:UR001527798
  review:
    summary: Positive regulation of protein targeting to membrane, a UniRule IEA reflecting mammalian
      Mff recruitment of Drp1 to the outer membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: In C. elegans, DRP-1 foci and the amount of DRP-1 in mitochondrial fractions are unchanged
      in mff-1; mff-2 double mutants. The authors conclude that worm Mff is not essential for DRP-1 recruitment.
      Some contribution to DRP-1 targeting cannot be ruled out, but the family-level transfer overstates
