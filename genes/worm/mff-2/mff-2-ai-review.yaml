core_functions:
- description: MFF-2 is a tail-anchored outer mitochondrial (and probably peroxisomal) membrane adaptor
    of the Mff family. Redundantly with MFF-1, it promotes DRP-1-dependent mitochondrial and peroxisomal
    fission. The adaptor MF is inferred from family homology. In worms, Mff is not essential for DRP-1
    recruitment.
  molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  directly_involved_in:
