- term:
    id: GO:0016559
    label: peroxisome fission
  evidence_type: IMP
  original_reference_id: PMID:24196833
  review:
    summary: Peroxisomes are tubular rather than punctate in the mff-1; mff-2 double mutant, as in drp-1
      mutants.
    action: NEW
    reason: The Mff family adaptor is part of the fission machinery at the organelle surface, so it does
      part of the work rather than being a substrate. In the comparator check (same role, same process),
      human MFF and the DRP1 GTPase (DNM1L) are annotated to peroxisome fission, and this paper shows
      the worm phenotype. The double-mutant evidence covers MFF-2 together with MFF-1.
    supported_by:
    - reference_id: PMID:24196833
      supporting_text: We conclude that C. elegans Mff homologues affect mitochondrial and peroxisome
        fission, whereas Fis1 homologues have no obvious effects.
