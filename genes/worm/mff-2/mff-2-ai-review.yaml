  label: Caenorhabditis elegans
description: 'MFF-2 (F55F8.6) is one of two C. elegans homologs of mitochondrial fission factor (Mff;
  Tango11 family), the other being MFF-1 (F11C1.2). It is a small (161 aa) tail-anchored protein with
  a single C-terminal transmembrane segment. It sits in the mitochondrial outer membrane with its N-terminal
  domain facing the cytosol. In vertebrates, Mff recruits the dynamin-related GTPase Drp1 to mitochondria
  and peroxisomes. In C. elegans, mff-1 and mff-2 act redundantly: single mutants have weak effects, while
  the double mutant has elongated, interconnected mitochondria and tubular peroxisomes, a fission defect
  similar to but milder than loss of drp-1. Unlike in mammalian cells, DRP-1 still forms foci and associates
  with mitochondria in the mff-1 mff-2 double mutant, and ionophore-induced fragmentation still occurs.
  So worm Mff proteins promote mitochondrial and peroxisomal fission but are not essential for DRP-1 recruitment.'
