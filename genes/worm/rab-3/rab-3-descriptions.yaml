    - rubric: utility
      score: 3
    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct aldicarb resistance, vesicle distribution and AEX-3-dependent
      localization, but padded with peripheral behavioral phenotypes (track amplitude,
      chemotaxis, pumping, male mating).
- source: Alliance_Automated
  text: Predicted to enable GTPase activity and myosin V binding activity. Involved
    in several processes, including positive regulation of anterior/posterior axon
    guidance; regulation of GABAergic synaptic transmission; and ventral cord development.
    Located in neuron projection and synaptic vesicle. Is expressed in nervous system;
    neurons; and uv1. Used to study alcohol use disorder and epilepsy. Human ortholog(s)
    of this gene implicated in autosomal dominant cerebellar ataxia. Orthologous to
    several human genes including RAB3A (RAB3A, member RAS oncogene family) and RAB3B
    (RAB3B, member RAS oncogene family).
