gene_symbol: rab-3
organism: worm
uniprot_id: Q94986
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in exocytosis by regulating a late step in synaptic vesicle fusion.
    Could play a role in neurotransmitter release by regulating membrane flow in the
    nerve terminal (By similarity). Plays a role in the recruitment of endophilin
    unc-57 to synaptic vesicles (PubMed:21029864). Probably by controlling dense-core
    vesicle trafficking, plays a role in the AVG neuron-mediated formation of the
    right axon tract of the ventral nerve cord (PubMed:27116976).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94986
  source_id: Q94986
- source: Alliance_Imported
  text: rab-3 encodes a rab3 homolog, a member of the Ras GTPase superfamily, and
    affects sensitivity to aldicarb and the distribution of synaptic vesicle populations
    and thereby affects synaptic transmission, track amplitude and speed of movement,
    chemotaxis to isoamyl alcohol, affects pharyngeal pump durations, and may only
    slightly affect male mating behavior; requires aex-3 for localization to synapse-rich
    regions in axons and it is expressed in most or all neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004267;class=Gene
  source_id: WB:WBGene00004267
- source: Alliance_Automated
  text: Predicted to enable GTPase activity and myosin V binding activity. Involved
    in several processes, including positive regulation of anterior/posterior axon
    guidance; regulation of GABAergic synaptic transmission; and ventral cord development.
    Located in neuron projection and synaptic vesicle. Is expressed in nervous system;
    neurons; and uv1. Used to study alcohol use disorder and epilepsy. Human ortholog(s)
    of this gene implicated in autosomal dominant cerebellar ataxia. Orthologous to
    several human genes including RAB3A (RAB3A, member RAS oncogene family) and RAB3B
    (RAB3B, member RAS oncogene family).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004267;class=Gene
  source_id: WB:WBGene00004267
