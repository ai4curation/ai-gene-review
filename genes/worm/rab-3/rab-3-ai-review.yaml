  title: Direct interactions between C. elegans RAB-3 and Rim provide a mechanism to target vesicles to
    the presynaptic density.
  findings:
  - statement: GTP-bound RAB-3 binds the zinc-finger domain of UNC-10/RIM; GDP-bound RAB-3 does not, and
      other worm Rabs do not.
    supporting_text: C. elegans and vertebrate Rim both interacted with the activated C. elegans GTP-bound
      RAB-3(Q81L) mutant, but not the GDP-bound RAB-3(T36N) mutant
  - statement: rab-3 mutants specifically lose vesicles contacting the membrane next to the presynaptic
      density, phenocopying unc-10; doubles are not additive.
    supporting_text: there was a specific reduction in SVs contacting the plasma membrane near the presynaptic
      density, relative to the wild type
  - statement: Release in rab-3 mutants is reduced and more sensitive to lowered extracellular calcium.
    supporting_text: the evoked defects of unc-10 and rab-3 and single and double mutants where exacerbated
      when calcium was lowered from 5mM to 1mM
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; establishes the RAB-3/UNC-10 docking pathway.
