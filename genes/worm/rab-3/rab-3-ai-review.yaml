id: Q94986
gene_symbol: rab-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: RAB-3 is the single Caenorhabditis elegans ortholog of the vertebrate Rab3 (RAB3A-D) small
  GTPases. It is a geranylgeranylated Rab that associates with synaptic vesicles in its GTP-bound state
  and, through its GTP-dependent interaction with the active-zone protein UNC-10/RIM, recruits vesicles
  to the presynaptic density where they are positioned close to UNC-2 calcium channels for efficient calcium-triggered
  release. rab-3 mutants are viable but have reduced evoked and spontaneous neurotransmitter release,
  depressed cholinergic and pharyngeal transmission, and a specific loss of vesicles contacting the membrane
  next to the presynaptic density, phenocopying unc-10. RAB-3 is activated by the GEF AEX-3 and marks
  presynaptic puncta along motor-neuron axons. Beyond the synapse, AEX-3-activated RAB-3 contributes to
  vesicle delivery in the growth cone during pioneer (AVG) axon navigation.
