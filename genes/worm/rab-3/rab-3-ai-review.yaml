core_functions:
- description: Synaptic-vesicle-associated Rab GTPase switch; in its GTP-bound state it binds the active-zone
    effector UNC-10/RIM and thereby recruits and docks vesicles at the presynaptic density, positioning
    them near UNC-2 calcium channels for efficient calcium-triggered exocytosis.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0016079
    label: synaptic vesicle exocytosis
  locations:
  - id: GO:0008021
    label: synaptic vesicle
  supported_by:
  - reference_id: PMID:18721860
    supporting_text: C. elegans and vertebrate Rim both interacted with the activated C. elegans GTP-bound
      RAB-3(Q81L) mutant, but not the GDP-bound RAB-3(T36N) mutant
  - reference_id: PMID:18721860
    supporting_text: there was a specific reduction in SVs contacting the plasma membrane near the presynaptic
      density, relative to the wild type
suggested_questions:
- question: Does RAB-3 also contribute to dense-core vesicle docking in C. elegans, as reported for Rab3A
    in PC12 and chromaffin cells, or is that role taken by AEX-6/Rab27?
- question: Which cargo (UNC-5 or membrane) is delivered by AEX-3/RAB-3 at the AVG growth cone, and is
    UNC-10 dispensable there only because synapses are absent?
