id: Q23022
gene_symbol: unc-38
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'UNC-38 is a C. elegans alpha Cys-loop nicotinic acetylcholine receptor subunit that is shared
  by two heteromeric acetylcholine-gated cation channels. With UNC-29, LEV-1, UNC-63 and LEV-8, it forms
  the levamisole-sensitive receptor at body-wall neuromuscular junctions; with ACR-2, ACR-3, ACR-12 and
  UNC-63, it forms the neuronal ACR-2 receptor that maintains cholinergic motor-neuron excitability. UNC-38-containing
  receptors localize to postsynaptic cell-surface puncta and contribute to locomotion and levamisole-stimulated
  egg laying.'
