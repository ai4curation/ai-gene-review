core_functions:
- description: Alpha pore subunit shared by the body-wall muscle levamisole-sensitive acetylcholine
    receptor and the neuronal ACR-2 receptor. In both pentamers, UNC-38 contributes to
    acetylcholine-gated cation-selective channel activity at the plasma membrane; in the L-AChR it
    acts at the postsynaptic membrane to drive excitatory neuromuscular transmission.
