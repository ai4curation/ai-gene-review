suggested_questions:
- question: How are UNC-38 and UNC-63 positioned in the L-AChR versus the ACR-2R pentamer, and which
    complementary subunit faces create the levamisole, acetylcholine, nicotine and mecamylamine
    pharmacology differences between the two receptors?
- question: Which UNC-38-containing receptor species account for the partial ACR-8 and ACR-12
    overlap with UNC-38 puncta in the nerve cord?
suggested_experiments:
- description: Determine the subunit order of purified or reconstituted UNC-38-containing L-AChR and
    ACR-2R complexes by single-particle cryo-EM or interface-selective cysteine substitution.
  hypothesis: Shared UNC-38/UNC-63 alpha subunits occupy different interfaces in L-AChR and ACR-2R
    pentamers, explaining why levamisole activates L-AChR but not ACR-2R.
