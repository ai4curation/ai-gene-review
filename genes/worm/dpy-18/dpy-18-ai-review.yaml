- id: PMID:21795395
  title: >-
    Genetic interaction between Caenorhabditis elegans teneurin ten-1 and
    prolyl 4-hydroxylase phy-1 and their function in collagen IV-mediated
    basement membrane integrity during late elongation of the embryo.
  findings:
  - statement: >-
      phy-1/dpy-18 loss causes collagen IV accumulation in body-wall muscles,
      and ten-1; phy-1 double mutants disrupt epidermal-muscle basement
      membrane integrity during late embryonic elongation.
    supporting_text: >-
      Loss of phy-1 causes intracellular accumulation of collagen IV protein
      and weakens BMs in the double mutant.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study showing that phy-1 contributes to collagen IV
      handling and genetically interacts with ten-1 at the epidermis/muscle
      basement membrane during late embryonic elongation.
