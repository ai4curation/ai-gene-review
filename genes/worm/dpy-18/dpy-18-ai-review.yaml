knowledge_gaps:
- gap_statement: >-
    The extent to which DPY-18 directly hydroxylates basement-membrane collagen
    IV in vivo remains unresolved.
  boundary: >-
    phy-1/dpy-18 mutants accumulate collagen IV in embryonic body-wall muscles
    and show enhanced basement-membrane genetic interactions, but the direct
    hydroxyproline sites and relative contributions of PHY-1 and PHY-2 to
    collagen IV modification were not mapped.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Distinguishing cuticle-collagen and basement-membrane-collagen substrates
    would refine how far the conserved nematode P4H complex extends beyond
    collagenous cuticle biogenesis.
  resolution: >-
    Profile hydroxyproline occupancy on LET-2 and EMB-9 collagen IV from
    phy-1, phy-2 and double-depleted embryos and compare secretion/retention of
    defined collagen IV reporters.
  provenance:
  - reference_id: PMID:21795395
    supporting_text: >-
      Loss of phy-1 causes intracellular accumulation of collagen IV protein
      and weakens BMs in the double mutant.
suggested_questions:
- question: >-
    Which C. elegans cuticle collagen sites are most sensitive to loss of
    DPY-18 versus PHY-2, and do the two alpha subunits have distinct substrate
    preferences in vivo?
- question: >-
    Does the dpy-18 induction reported in the tunicamycin/UPR expression screen
    reflect a collagen-specific secretory burden or a broader remodeling of ER
    hydroxylation capacity?
suggested_experiments:
- description: >-
    Use stage-resolved collagen peptidomics in wild type, dpy-18, phy-2 and
    double-depleted larvae to quantify hydroxyproline occupancy on individual
    cuticle collagens and identify alpha-subunit-specific substrates.
- description: >-
    Rescue dpy-18 mutants with catalytically inactive and PDI-2-binding-defective
    PHY-1 variants to separate Fe2OG hydroxylase activity from any structural
    chaperone contribution to collagen folding.
