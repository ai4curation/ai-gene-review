- id: PMID:10805750
  title: >-
    Prolyl 4-hydroxylase is an essential procollagen-modifying enzyme required
    for exoskeleton formation and the maintenance of body shape in the nematode
    Caenorhabditis elegans.
  findings:
  - statement: >-
      phy-1 is dpy-18, and dpy-18 null alleles reduce the hydroxyproline
      content of cuticle collagens.
    supporting_text: Mutations in phy-1 result in the dpy-18 phenotype.
    reference_section_type: RESULTS
  - statement: >-
      Loss of both conserved C. elegans collagen P4H alpha subunits causes
      post-elongation embryonic lethality after the first cuticle forms.
    supporting_text: >-
      The abnormal phenotype became evident after cuticle synthesis (710 min
      into development; see also reference 31 ).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study establishing that phy-1 is dpy-18, that dpy-18
      mutants have reduced cuticle-collagen hydroxyproline, that phy-1/phy-2
      double disruption causes post-elongation embryonic lethality, and that
      phy-1, phy-2 and pdi-2 are expressed in the cuticle-synthesizing
      hypodermis.
