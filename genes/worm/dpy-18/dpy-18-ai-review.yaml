description: >-
  DPY-18/PHY-1 is a secretory procollagen prolyl 4-hydroxylase alpha subunit of
  Caenorhabditis elegans. It has an N-terminal signal peptide, a C-terminal
  Fe(II)- and 2-oxoglutarate-dependent dioxygenase domain, and conserved
  catalytic iron- and 2-oxoglutarate-binding residues. DPY-18 assembles in the
  endoplasmic reticulum lumen with the PDI-2 beta subunit, either as a
  PHY-1/PDI-2 dimer or in a mixed PHY-1/PHY-2/(PDI-2)2 tetramer, to
  hydroxylate cuticle procollagens. Loss of phy-1/dpy-18 reduces cuticle
  collagen hydroxyproline and causes a dumpy body morphology, while combined
  loss of phy-1 and the paralogous alpha subunit phy-2 disrupts collagenous
  cuticle formation and causes post-elongation embryonic lethality.
