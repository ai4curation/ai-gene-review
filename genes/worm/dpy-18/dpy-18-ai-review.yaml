      PHY-2/PDI-2 dimers.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only primary study directly supporting DPY-18/PHY-1 membership
      in recombinant and native collagen P4H complexes with PDI-2 and PHY-2.
