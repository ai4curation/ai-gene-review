descriptions:
- source: UniProt
  text: Functions as a component of the nuclear pore complex (NPC) and the COPII coat
    (By similarity). Required for the nuclear import of hcp-4 during mitotic prophase,
    this step is essential for centrosome assembly and resolution (PubMed:28122936).
    . As a component of the GATOR complex may function in the amino acid-sensing branch
    of the TORC1 signaling pathway.
  source_type: curated
