findings:
- category: discrepancy
  text: The automated text names positive regulation of division septum assembly (a
    fungal septum term, modified in the review) and mitotic chromosome centromere
    condensation (over-annotated) as headline processes.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: The automated text omits the COPII vesicle coat, half of SEC13's dual role,
    which UniProt and the review both give.
  sources:
  - Alliance_Automated
  - RefSeq
review:
