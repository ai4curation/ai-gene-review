gene_symbol: npp-20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'npp-20 (Y77E11A.13) encodes the single Caenorhabditis elegans ortholog of SEC13, a small
  six-bladed WD40 beta-propeller protein of the Sec13/Seh1 family. Like its yeast and human counterparts,
  NPP-20/SEC-13 is a dual-purpose structural subunit: it is a nucleoporin of the Y-shaped outer-ring
  subcomplex of the nuclear pore complex, and it is the propeller partner of SEC-31 in the outer cage
  layer of the COPII vesicle coat at endoplasmic reticulum exit sites. In the worm germline SEC-13 is
  seen both on nuclear envelopes and next to SEC-16-marked ER exit sites, and native SEC-13 exists in
  a SEC-13/SEC-31 heterotetramer and larger TFG-1-dependent assemblies. Depletion of NPP-20 blocks nuclear
  import of the CENP-C ortholog HCP-4 in prophase, disrupts nuclear morphology and reformation after the
  first embryonic mitosis, blocks cytokinesis and causes fully penetrant embryonic lethality; partial
  depletion arrests larvae at L2-L3. By orthology it is also expected to be a subunit of the GATOR2
  complex that promotes TORC1 signalling on the lysosome, and npp-20 was recovered in a nonsense-mediated
  mRNA decay screen, although neither role has been dissected in the worm.'
