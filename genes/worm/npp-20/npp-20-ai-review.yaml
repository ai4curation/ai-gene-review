proposed_new_terms:
- proposed_name: structural constituent of COPII vesicle coat
  proposed_definition: The action of a molecule that contributes to the structural integrity of a COPII
    vesicle coat, such as the Sec13-Sec31 heterotetramer that forms the outer cage of the coat.
  justification: GO has structural-constituent terms for the nuclear pore and other assemblies but none
    for the COPII coat. SEC13 is a structural subunit of both the nuclear pore outer ring and the COPII
    outer cage, so refining structural molecule activity to the nuclear pore term alone would leave its
    COPII role without a molecular function.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
  - reference_id: PMID:21478858
    supporting_text: the COPII coat, which is composed of two multimeric protein complexes (Sec23-Sec24
      and Sec13-Sec31)
  - reference_id: PMID:21478858
    supporting_text: which forms an adaptor layer for Sec13-Sec31 lattice assembly, completing the COPII
      coat
suggested_questions:
- question: Is the cytokinesis block in npp-20(RNAi) one-cell embryos due to loss of COPII-dependent
    membrane delivery, NPC/nuclear defects, or a direct role at the furrow?
- question: Does NPP-20 act in a worm GATOR2 complex (with WDR-24, WDR-59 and MIOS orthologs) to promote
    TORC1 signalling, and is it found on lysosomes in C. elegans?
- question: Is the NMD requirement for npp-20 a direct function or a secondary consequence of NPC (mRNA
    export) or ER/COPII defects?
- question: Should UniProt/GO replace GO:0010973 positive regulation of division septum assembly on Q9N4A7
    with mitotic cytokinesis (GO:0000281), given that the source paper reports an animal cytokinesis
    block?
suggested_experiments:
- description: Time-lapse imaging of furrow ingression and plasma-membrane addition in partial npp-20(RNAi)
    embryos, compared with sec-31, sec-23 and Y-complex nucleoporin (npp-5, npp-15) depletion, to separate
    COPII from NPC contributions to the cytokinesis defect.
  experiment_type: RNAi phenotyping with live imaging
- description: Endogenously tagged NPP-20 co-immunoprecipitation/mass spectrometry and lysosomal co-localization
    in starved versus fed animals, with TORC1 readouts, to test GATOR2 membership in C. elegans.
  experiment_type: proteomics and cell biology
