- term:
    id: GO:0010973
    label: positive regulation of division septum assembly
  evidence_type: IMP
  original_reference_id: PMID:12937276
  qualifier: involved_in
  review:
    summary: Flagged by Wei et al. 2020 (PMID:32470107) as a taxon-implausible term. The full text of
      Galy et al. 2003 (PMC284812; cache is abstract-only) states that RNAi against CeSec13R caused
      additional severe defects in embryonic appearance and blocked cytokinesis, which the authors
      attribute to pleiotropic Sec13 functions (NPC and COPII). UniProt has synced this as curated
      disruption-phenotype text. The curator evidently mapped this animal cytokinesis block onto a
      division-septum term.
    action: MODIFY
    reason: The observation is a genuine experimental phenotype, so the row should not be removed, but
      division septum assembly is defined for fungal/bacterial septation and does not occur in a nematode
      embryo. The animal-appropriate term for a block in the first embryonic division is mitotic cytokinesis
      (GO:0000281). This role is non-core and probably indirect (e.g. COPII-dependent membrane supply),
      as the authors themselves suggest.
    proposed_replacement_terms:
