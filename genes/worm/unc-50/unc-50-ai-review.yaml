id: Q10045
gene_symbol: unc-50
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  UNC-50 is a conserved multi-pass Golgi membrane protein required in
  Caenorhabditis elegans body-wall muscle for subtype-specific trafficking of
  assembled nicotinic acetylcholine receptors. After levamisole-sensitive
  receptor assembly in the endoplasmic reticulum, UNC-50 helps direct the
  receptor through the Golgi toward functional neuromuscular-junction surface
  expression; in unc-50 mutants the receptor is misrouted to the lysosomal
  system and degraded. unc-50 also supports functional expression of the
  neuronal ACR-2 receptor, consistent with a broader role in Cys-loop
  acetylcholine receptor biogenesis.
