knowledge_gaps:
- gap_statement: >-
    The direct molecular mechanism by which Golgi-localized UNC-50 recognizes,
    escorts, or licenses assembled L-AChRs for surface delivery remains
    unresolved.
  boundary: >-
    UNC-50 is established as a Golgi membrane protein required after L-AChR
    assembly to route the receptor away from lysosomal degradation and toward
    the body-wall muscle surface, and the only physical interaction assayed for
    C. elegans UNC-50 is cross-species binding to yeast Gea1p.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving this mechanism would explain how nematode-specific AChR cargo
    selectivity is imposed at a conserved UNC-50/GMH1 Golgi factor.
  resolution: >-
    Identify endogenous C. elegans UNC-50 interactors and test whether the
    receptor subunits or an intermediate sorting factor bind UNC-50-dependent
    Golgi domains during L-AChR and ACR-2R export.
  provenance:
  - reference_id: PMID:17853888
    supporting_text: >-
      Alternatively, UNC-50 might be required to sort a factor that directly
      interacts with the Lev-AChR to promote its export to the cell surface.
suggested_questions:
- question: >-
    Which endogenous C. elegans Arf GEF, if any, is recruited or regulated by
    UNC-50 during L-AChR and ACR-2R export through the Golgi?
  experts:
  - Bessereau JL
  - Jorgensen EM
suggested_experiments:
- description: >-
    Endogenously tag UNC-50, L-AChR and ACR-2R subunits, then test candidate
    Golgi Arf-GEF perturbations for receptor-specific loss of synaptic
    receptor localization and for rerouting of assembled receptors to
    lysosomal compartments.
