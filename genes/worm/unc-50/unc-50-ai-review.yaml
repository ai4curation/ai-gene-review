    label: regulation of muscle contraction
  evidence_type: IGI
  original_reference_id: PMID:20027209
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P48182
  review:
    summary: Genetic interaction between unc-50 and the hyperactive ACR-2 receptor.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as a true but downstream, non-core physiological output. Jospin et
      al. found unc-50 loss-of-function suppressors of the acr-2(n2420gf)
      convulsion phenotype and used unc-50 cRNA when reconstituting ACR-2R in
      Xenopus oocytes, supporting an ancillary role for UNC-50 in neuronal
      ACR-2R expression as well as muscle L-AChR expression. The existing
      muscle-contraction term captures the behavioral output of ACR-2R activity
      in cholinergic motor neurons, whereas Golgi receptor trafficking is the
      core cellular role.
    supported_by:
