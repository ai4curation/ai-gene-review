- id: PMID:17853888
  title: Regulation of nicotinic receptor trafficking by the transmembrane Golgi protein
    UNC-50.
  findings:
  - statement: >-
      Functional fluorescent UNC-50 fusions expressed in body-wall muscle
      localize to the Golgi system, colocalizing with a medial-Golgi
      alpha-mannosidase II marker but not with an ER marker.
    supporting_text: >-
      mRFP-UNC-50 and Mannosidase II-GFP staining showed 91±3% ( n =4)
      colocalization
  - statement: >-
      UNC-50 acts after L-AChR assembly to direct levamisole-sensitive
      acetylcholine receptors to the body-wall muscle surface instead of to a
      lysosomal degradative route.
    supporting_text: >-
      UNC-50 is required in body-wall muscles for the trafficking of the
      assembled Lev-AChR to the NMJ
  - statement: >-
      Reducing lysosomal biogenesis with cup-5 partially restores detectable
      UNC-29 in unc-50 mutants but does not return L-AChRs to the cell surface,
      placing misrouted receptors on a lysosomal degradation route.
    supporting_text: >-
      introduction of cup-5(ar465) in unc-50 mutants causes a reappearance of
      the Lev-AChR subunit UNC-29
  - statement: >-
      C. elegans UNC-50 specifically interacts with the C-terminus of yeast
      Gea1p in yeast two-hybrid assays, supporting conservation of an
      UNC-50/large Sec7-domain Arf-GEF interaction surface.
    supporting_text: >-
      UNC-50, like the yeast Gmh1 and the human hGmh1, specifically
      interacted with the C-terminus of the yeast Arf GEF Gea1p
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary unc-50 localization and receptor-trafficking study. The full
      text is cached from PMC2034668 and directly supports the Golgi
      localization, yeast-Gea1p interaction, cup-5 lysosomal-rerouting result,
      and requirement for UNC-50 in trafficking assembled L-AChRs to
      neuromuscular junctions.
- id: PMID:20027209
  title: A neuronal acetylcholine receptor regulates the balance of muscle excitation
    and inhibition in Caenorhabditis elegans.
  findings:
  - statement: >-
      unc-50 and unc-74 loss-of-function alleles suppress the hyperactive
      acr-2(n2420gf) convulsion phenotype, implicating the two L-AChR ancillary
      factors in expression of the neuronal ACR-2 receptor.
    supporting_text: >-
      loss-of-function mutations in unc-50 and unc-74 suppress
      acr-2(n2420gf) suggests that these two ancillary proteins also function
      in ACR-2R assembly and trafficking
  - statement: >-
      UNC-50 was included with RIC-3 and UNC-74 in the cRNA mix used for
      Xenopus oocyte reconstitution of ACR-2R-containing acetylcholine
      receptors.
    supporting_text: >-
      cRNAs for acr-12, ric-3, unc-38, unc-50, unc-63, and unc-74 were
      coinjected for each condition
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text is cached. The paper establishes the neuronal ACR-2 receptor
      and reports that unc-50 loss-of-function alleles suppress the
      acr-2(n2420gf) convulsion phenotype, consistent with an additional
      UNC-50 role in ACR-2R assembly or trafficking.
- id: PMID:19020092
  title: Eight genes are required for functional reconstitution of the Caenorhabditis
    elegans levamisole-sensitive acetylcholine receptor.
  findings:
  - statement: >-
      The C. elegans levamisole-sensitive acetylcholine receptor requires the
      ancillary factors RIC-3, UNC-50 and UNC-74 for in vivo expression and for
      robust functional reconstitution in Xenopus oocytes.
    supporting_text: >-
      In addition to AChR subunits, genetic screens identified 3 ancillary
      proteins, RIC-3, UNC-50, and UNC-74, that are absolutely required for the
      expression of L-AChRs in vivo
  - statement: >-
      Removing UNC-50 or UNC-74 from the oocyte cRNA mixture leaves less than
      10% of the full-set L-AChR response, confirming that both proteins are
      critical expression factors in the heterologous L-AChR system.
    supporting_text: >-
      Removal of UNC-50 or UNC-74 reduced response amplitudes to <10% of the
      response obtained with the full set of cRNAs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text is cached. The paper independently confirms that UNC-50 is one
      of three ancillary factors required for efficient functional expression
      of L-AChRs assembled from the five receptor subunits in Xenopus oocytes.
