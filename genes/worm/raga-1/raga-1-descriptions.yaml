- source: Alliance_Automated
  text: Predicted to enable GTP binding activity and GTPase activity. Involved in
    determination of adult lifespan; positive regulation of TOR signaling; and regulation
    of growth. Predicted to be part of Gtr1-Gtr2 GTPase complex. Predicted to be active
    in lysosome and nucleus. Is expressed in several structures, including anterior
    hypodermis; gonad; and intestine. Used to study ragopathy. Orthologous to several
    human genes including RRAGA (Ras related GTP binding A).
