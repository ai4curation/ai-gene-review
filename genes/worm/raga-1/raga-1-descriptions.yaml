gene_symbol: raga-1
organism: worm
uniprot_id: Q22743
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: raga-1 encodes the C. elegans ortholog of the ras-related GTPase RagA; in
    C. elegans RAGA-1 functions as a modifier of behavioral aging and adult lifespan
    (particularly under high food concentration); raga-1 mutations also affect body
    size and reproduction; genetic analyses suggest that raga-1 functions in the let-363/Tor
    pathway to regulate behavioral aging and lifespan and also interacts with the
    daf-2/daf-16 insulin signaling pathway and skn-1; raga-1 reporter fusions are
    widely expressed in larvae, with more restricted expression (gut, head and tail
    neurons, somatic gonad, hypodermis) seen in adults.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006414;class=Gene
  source_id: WB:WBGene00006414
- source: Alliance_Automated
  text: Predicted to enable GTP binding activity and GTPase activity. Involved in
    determination of adult lifespan; positive regulation of TOR signaling; and regulation
    of growth. Predicted to be part of Gtr1-Gtr2 GTPase complex. Predicted to be active
    in lysosome and nucleus. Is expressed in several structures, including anterior
    hypodermis; gonad; and intestine. Used to study ragopathy. Orthologous to several
    human genes including RRAGA (Ras related GTP binding A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006414;class=Gene
  source_id: WB:WBGene00006414
