suggested_questions:
- question: Does C. elegans RAGA-1 bind and hydrolyse GTP with RagA-like kinetics, and is its nucleotide
    state controlled by worm GATOR1 (NPRL-2/NPRL-3) acting as a GAP?
- question: Which nutrient signals (amino acids, the sphingolipid d17iso-GlcCer, others) change the RAGA-1
    nucleotide state in vivo, and does RAGA-1 itself respond to the lipid or act only as a permissive
    TORC1 activator?
- question: Why does the egIs12 raga-1(Q63L) transgene shorten lifespan without raising phospho-RSKS-1,
    while the endogenous Q63L allele raises phospho-RSKS-1 without shortening lifespan?
suggested_experiments:
- description: Image endogenously tagged RAGA-1 and RAGC-1 together with lysosomal markers in fed and
    starved animals, and test their co-immunoprecipitation.
  hypothesis: RAGA-1 forms a heterodimer with RAGC-1 and is enriched on lysosomes in a nutrient-independent
    way, as RagA/B is in mammals.
  experiment_type: Live imaging and co-immunoprecipitation
- description: Measure GTP binding and hydrolysis by recombinant RAGA-1 (wild type, T18N, Q63L) alone
    and with RAGC-1 and worm NPRL-2/3.
  hypothesis: RAGA-1 has the low intrinsic GTPase activity typical of RagA, stimulated by GATOR1 orthologues.
  experiment_type: In vitro biochemistry
