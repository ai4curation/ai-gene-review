core_functions:
- description: RAGA-1 is the RagA/B subunit of the RAGA-1/RAGC-1 Rag GTPase heterodimer. In its GTP-bound
    state it activates TORC1 at the lysosomal surface in response to nutrients, promoting TORC1 outputs
    such as RSKS-1/S6K phosphorylation.
