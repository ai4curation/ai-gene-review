id: Q22743
gene_symbol: raga-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: raga-1 encodes the sole Caenorhabditis elegans orthologue of the RagA/RagB Rag GTPases (yeast
  Gtr1). RAGA-1 is a GTR/RAG-family GTP-binding protein that is predicted to form a heterodimer with RAGC-1
  (RagC/D) on the lysosomal surface. There, in its GTP-bound state, it couples nutrient availability to
  activation of TORC1. In worms, depleting RAGA-1 lowers phosphorylation of the TORC1 target RSKS-1/S6K,
  and an endogenous GTP-locked Q63L allele raises it. Loss of raga-1 extends lifespan in a TOR-, DAF-16-
  and SKN-1-dependent manner, slows age-related locomotor decline, reduces body size and blunts the lifespan
  response to dietary restriction. Activated RAGA-1 restores larval growth in intestinal-sphingolipid-deficient
  animals. These organismal effects are downstream consequences of its role as a TORC1 activator.
