- id: PMID:9312045
  title: >-
    avr-15 encodes a chloride channel subunit that mediates inhibitory
    glutamatergic neurotransmission and ivermectin sensitivity in Caenorhabditis
    elegans.
  findings:
  - statement: >-
      avr-15 encodes two GluCl subunits with ligand-binding and transmembrane
      domains, and an avr-15-encoded subunit forms homomeric glutamate- and
      ivermectin-gated channels.
    supporting_text: >-
      An avr-15-encoded subunit forms a homomeric channel that is
      ivermectin-sensitive and glutamate-gated.
  - statement: >-
      AVR-15 acts postsynaptically in fast inhibitory glutamatergic
      neuromuscular signaling from M3 neurons to pharyngeal muscle.
    supporting_text: >-
      avr-15, a gene that confers ivermectin sensitivity on worms, is necessary
      postsynaptically for a functional M3 synapse and for the hyperpolarizing
      effect of glutamate on pharyngeal muscle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Only the abstract is cached locally. This is the primary avr-15 paper:
      the abstract verifies the M3 inhibitory glutamatergic synapse, the
      postsynaptic avr-15 requirement for glutamate-induced hyperpolarization of
      pharyngeal muscle, and homomeric glutamate/ivermectin-gated channel
      activity for an avr-15-encoded subunit.
- id: PMID:9407104
  title: >-
    Genetic and biochemical evidence for a novel avermectin-sensitive chloride
    channel in Caenorhabditis elegans. Isolation and characterization.
  findings:
  - statement: >-
      GluClalpha2 forms homomeric channels gated by avermectin and glutamate and
      heteromeric channels with GluClbeta.
    supporting_text: >-
      This subunit forms homomeric channels that are gated irreversibly by
      avermectin and reversibly by glutamate. GluClalpha2 coassembles with
      GluClbeta to form heteromeric channels that are gated by both ligands.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Only the abstract is cached locally. The abstract does not use the
      avr-15 gene name, but Dent et al. later identify avr-15 as encoding
      AVR-15/GluClalpha2, making this direct GluClalpha2 channel evidence
      relevant.
- id: PMID:10716995
  title: The genetics of ivermectin resistance in Caenorhabditis elegans.
  findings:
  - statement: >-
      avr-14, avr-15 and glc-1 are parallel GluClalpha pathways whose
      simultaneous loss gives high-level ivermectin resistance.
    supporting_text: >-
      simultaneous mutation of three genes, avr-14, avr-15, and glc-1,
      encoding glutamate-gated chloride channel (GluCl) alpha-type subunits
      confers high-level resistance to the antiparasitic drug ivermectin
  - statement: >-
      AVR-15/GluClalpha2 defines one pathway to inhibition of pharyngeal
      pumping by ivermectin.
    supporting_text: >-
      one of the genetic pathways leading to the inhibition of pharyngeal
      pumping is defined by the avr-15 -encoded GluClα2 expressed in the
      pharyngeal muscle
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This paper links avr-15 to AVR-15/GluClalpha2 and
      places AVR-15 with AVR-14 and GLC-1 in parallel ivermectin-sensitivity
      pathways.
- id: PMID:12750328
  title: >-
    Mechanosensory inputs influence Caenorhabditis elegans pharyngeal activity
    via ivermectin sensitivity genes.
  findings:
  - statement: >-
      avr-14 and avr-15 mediate the glutamatergic pathway by which adult tail
      tap inhibits pharyngeal pumping.
    supporting_text: >-
      Tail tap of adults inhibits pharyngeal pumping via a pathway involving
      the innexin gene unc-7 and components of the glutamatergic pathway
      encoded by the genes avr-14 and avr-15.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Only the abstract is cached locally. The abstract verifies the pharyngeal
      pumping rows by placing AVR-15 with AVR-14 and UNC-7 in an inhibitory
      mechanosensory-to-pharyngeal circuit.
