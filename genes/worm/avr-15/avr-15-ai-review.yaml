proposed_new_terms: []
gene_model_issues: []
suggested_questions:
- question: >-
    Which AVR-15 splice forms and beta subunits assemble into native M3
    pharyngeal-muscle receptors, and do those receptor stoichiometries alter
    glutamate or macrocyclic-lactone sensitivity?
- question: >-
    Which parasitic-nematode GluCl subunits are the closest functional
    counterparts of C. elegans AVR-15 in pharyngeal muscle and motor circuits?
suggested_experiments:
- description: >-
    Endogenously tag AVR-15 isoforms and candidate GluCl beta subunits and
    combine M3 synapse imaging with electropharyngeogram recordings after
    isoform-specific perturbation.
  hypothesis: >-
    Native AVR-15 receptors at pharyngeal muscle contain defined isoforms and
    partner subunits that tune inhibitory glutamatergic currents.
- description: >-
    Express candidate Haemonchus, Brugia and Onchocerca AVR-15-like GluCl
    subunits in avr-15 mutant worms or oocytes and compare glutamate and
    ivermectin dose responses.
  hypothesis: >-
    Parasitic AVR-15 orthologs can replace the C. elegans subunit's
    glutamate-gated chloride conductance but differ in ivermectin sensitivity.
knowledge_gaps:
- gap_statement: >-
    Native AVR-15 receptor composition remains unresolved: AVR-15/GluClalpha2
    forms homomeric channels and can coassemble with GluClbeta in oocytes, but
    the isoform and subunit stoichiometry used at M3 pharyngeal-muscle synapses
    remains unknown.
  boundary: >-
    avr-15 is postsynaptically required for the M3 hyperpolarizing response, and
    GluClalpha2 can form homomeric channels and coassemble with GluClbeta after
    heterologous expression.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Subunit composition determines the channel's native conductance and
    drug-sensitivity properties and is a key comparator for parasite orthologs.
  resolution: >-
    Isoform-specific endogenous tags, native biochemical pulldowns, or oocyte
    reconstruction of parasite and worm subunit pairs would distinguish
    homomeric from heteromeric AVR-15 receptors.
