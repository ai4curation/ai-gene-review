id: G5ECH3
gene_symbol: avr-15
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  avr-15 encodes a Cys-loop glutamate-gated chloride channel alpha subunit,
  also known as GluClalpha2. AVR-15 forms ivermectin-sensitive, glutamate-gated
  chloride channels and can coassemble with GluClbeta. In C. elegans pharyngeal
  muscle, AVR-15 acts postsynaptically in the fast inhibitory glutamatergic M3
  neuromuscular circuit that regulates pharyngeal pumping. AVR-15 is also one
  of several glutamate-gated chloride channel subunits that confer ivermectin
  sensitivity and influence locomotory behavior.
