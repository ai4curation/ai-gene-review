- term:
    id: GO:0008068
    label: extracellularly glutamate-gated chloride channel activity
  evidence_type: IDA
  original_reference_id: PMID:9312045
  qualifier: enables
  review:
    summary: Cloning and direct oocyte expression of avr-15/GluClalpha2.
    action: NEW
    reason: >-
      Core molecular function missing from GOA. Dent et al. found that an
      avr-15-encoded subunit forms homomeric channels that respond to glutamate
      and ivermectin, and Vassilatis et al. independently showed that
      GluClalpha2, the AVR-15 subunit, forms homomeric glutamate- and
      avermectin-gated channels and coassembles with GluClbeta.
    consistency_exception:
      reason: >-
        GO currently places the glutamate-gated chloride channel term under the
        excitatory ligand-gated channel parent, but AVR-15 is an
        anion-selective inhibitory channel. The child term is correct for this
        gene; the excitatory ancestor and automated excitatory-postsynaptic
        row are the claims being rejected.
    supported_by:
    - reference_id: PMID:9312045
      supporting_text: >-
        An avr-15-encoded subunit forms a homomeric channel that is
        ivermectin-sensitive and glutamate-gated.
      full_text_unavailable: true
    - reference_id: PMID:9407104
      supporting_text: >-
        This subunit forms homomeric channels that are gated irreversibly by
        avermectin and reversibly by glutamate. GluClalpha2 coassembles with
        GluClbeta to form heteromeric channels that are gated by both ligands.
      full_text_unavailable: true
proposed_ontology_changes:
- change_type: NODE_SHALLOWING
  ontology: GO
  about_node:
    id: GO:0005234
    label: extracellularly glutamate-gated ion channel activity
  old_value: GO:0005231
  new_value: GO:0005230
  subject:
    id: GO:0005230
    label: extracellular ligand-gated monoatomic ion channel activity
  predicate: rdfs:subClassOf
  justification: >-
    GO:0005234 is currently a child of GO:0005231, which makes every
    extracellularly glutamate-gated chloride channel a kind of excitatory
    extracellular ligand-gated channel and causes the correct GO:0008068
    glutamate-gated chloride-channel term to propagate excitatory postsynaptic
    potential assertions to invertebrate anion-selective GluCls. Glutamate-gated
    channels include both cation-selective excitatory channels and
    chloride-selective inhibitory channels, so the glutamate-gated ion-channel
    parent should sit under GO:0005230 without the excitatory sign commitment;
    cation-selective glutamate receptors would then need a more specific
    excitatory glutamate-gated channel parent so AMPA/NMDA receptor inferences
    keep the excitatory-postsynaptic-potential link.
  origin: SELF_PROPOSED
  confidence: PROBABLE
  affected_annotations:
  - genes/worm/avr-15/avr-15-ai-review.yaml
  supported_by:
