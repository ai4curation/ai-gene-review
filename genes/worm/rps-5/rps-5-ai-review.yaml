suggested_questions:
- question: Does C. elegans RPS-5 enter the nucleolus and join early pre-40S (SSU processome) particles, as inferred
    from human RPS5, or does it assemble late in the cytoplasm as uS7 does in some other eukaryotes?
- question: Do tissue-specific ribosome heterogeneity studies in C. elegans show any variation in uS7 occupancy of
    the 40S subunit?
suggested_experiments:
- description: Endogenously tag rps-5 (e.g. GFP knock-in) and image germline and embryonic cells, with nucleolar markers
    (FIB-1), to test nucleolar entry; combine with RNAi and northern blotting of pre-rRNA intermediates to test whether
    RPS-5 depletion blocks 18S rRNA processing.
