id: P49041
gene_symbol: rps-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rps-5 (T05E11.1) encodes the Caenorhabditis elegans small ribosomal subunit protein uS7 (40S ribosomal
  protein S5), a member of the universal uS7 family. uS7 is a core protein of the head of the cytosolic 40S subunit,
  where it contacts 18S rRNA and lies near the E site and mRNA exit path; it is resolved in the cryo-EM structure
  of the C. elegans 80S ribosome. As a structural constituent of the ribosome it contributes to cytoplasmic mRNA
  translation, and RNAi depletion causes sterility and osmotically sensitive embryos, as expected for general loss
  of translation. By orthology with human RPS5 it is also expected to join nascent pre-40S particles (the small-subunit
  processome) in the nucleolus during ribosome biogenesis, although this has not been examined in the worm.
