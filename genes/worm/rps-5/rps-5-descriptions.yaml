- source: Alliance_Automated
  text: Predicted to enable mRNA binding activity and rRNA binding activity. Predicted
    to be a structural constituent of ribosome. Predicted to be involved in ribosomal
    small subunit biogenesis and translation. Predicted to be located in cytoplasm.
    Predicted to be part of cytosolic small ribosomal subunit and small-subunit processome.
    Predicted to be active in ribosome. Orthologous to human RPS5 (ribosomal protein
    S5).
