descriptions:
- source: UniProt
  text: Component of the small ribosomal subunit. The ribosome is a large ribonucleoprotein
    complex responsible for the synthesis of proteins in the cell (By similarity).
    Part of the small subunit (SSU) processome, first precursor of the small eukaryotic
    ribosomal subunit. During the assembly of the SSU processome in the nucleolus,
    many ribosome biogenesis factors, an RNA chaperone and ribosomal proteins associate
    with the nascent pre-rRNA and work in concert to generate RNA folding, modifications,
    rearrangements and cleavage as well as targeted degradation of pre-ribosomal RNA
    by the RNA exosome (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P49041
  source_id: P49041
