  review:
    summary: Replace native norspermidine synthesis with the supported spermidine pathway role.
    action: MODIFY
    reason: The InterPro mapping turns NspC-family membership into a norspermidine process claim. The
      81116 enzyme accepts both substrates in vitro, but native cells contain spermidine and its deletion
      abolishes spermidine; this is a close-strain inference for 11168, not a direct phenotype of Q0P8A4.
      Catalytic decarboxylation makes the enzyme a direct participant. Native specificity against CAPA
      remains to be tested.
    supported_by:
