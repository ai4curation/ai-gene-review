status: COMPLETE
taxon:
  id: NCBITaxon:192222
  label: Campylobacter jejuni subsp. jejuni NCTC 11168 = ATCC 700819
description: Cj1515c is a predicted pyridoxal-phosphate-dependent carboxyspermidine decarboxylase in Campylobacter
  jejuni NCTC 11168. Its close 81116 ortholog directly decarboxylates carboxyspermidine to spermidine
  and also accepts carboxynorspermidine in vitro. Native 81116 cells synthesize spermidine rather than
  norspermidine through this enzyme; transfer of this role to NCTC 11168 is supported by close homology.
