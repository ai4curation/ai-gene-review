- id: PMID:36671471
  title: 'Cysteine Biosynthesis in Campylobacter jejuni: Substrate Specificity of CysM and the Dualism
    of Sulfide.'
  findings:
  - statement: Cj0912c uses OAS rather than OPS in the tested cysteine-synthesis assay.
    supporting_text: No L-Cysteine was produced when OPS was provided as sulfur acceptor.
  - statement: Sulfide is favored over thiosulfate in purified-enzyme kinetics.
    supporting_text: Sulfide proved to be a far superior sulfur donor, while thiosulfate was such
      a poor donor that reliable Km and Vmax values could not be calculated.
  - statement: Complementation and OAS rescue place CysE upstream of the OAS-dependent synthase.
    supporting_text: These phenotypes were restored to wildtype levels by genetic complementation
      (Figure 6A) and, in the case of ΔcysE, partially by chemical complementation through exogenous
      addition of OAS (Figure 6B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text. Assayed CysM is NCTC11168 Cj0912c with an N-terminal His6 tag;
      no tag cleavage is reported. CysE is genetically disrupted/complemented and chemically rescued,
      not purified. The acid-ninhydrin readout is reported as cysteine even for thiosulfate; it is
      not treated here as identification of the immediate sulfur-transfer product or as bypass of
      S-sulfocysteine reduction. The text says reliable thiosulfate kinetic parameters could not
      be calculated, although Figure4 caption gives high-uncertainty fitted values. Do not use that
      fit to claim a robust physiological thiosulfate route.
