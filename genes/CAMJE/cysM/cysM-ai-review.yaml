  label: Campylobacter jejuni subsp. jejuni NCTC 11168 = ATCC 700819
description: CysM is a pyridoxal-phosphate-dependent cysteine synthase in Campylobacter jejuni NCTC11168.
  It uses O-acetyl-L-serine and preferentially sulfide to form cysteine; O-phosphoserine did not
  support activity in the purified-enzyme assay. Thiosulfate supports much weaker activity under
  the tested conditions. CysM supports growth on suitable inorganic sulfur sources, with sulfide
  availability and toxicity limiting the physiological response.
