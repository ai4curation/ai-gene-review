taxon:
  id: NCBITaxon:192222
  label: Campylobacter jejuni subsp. jejuni NCTC 11168 = ATCC 700819
description: CysE is the serine acetyltransferase of Campylobacter jejuni NCTC11168. It converts
  L-serine and acetyl-CoA to O-acetyl-L-serine, supplying the carbon skeleton used by CysM to synthesize
  cysteine. Loss of cysE prevents growth with sulfide or thiosulfate as the sole sulfur source under
  the tested conditions; genetic complementation and partial rescue by O-acetylserine support its
  pathway role.
