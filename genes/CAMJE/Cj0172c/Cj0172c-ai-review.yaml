suggested_questions:
- question: What are the relative catalytic efficiencies and native fluxes for the carboxyspermidine,
    carboxynorspermidine and CAPA routes in this exact strain?
- question: Does Cj0172c catalyse the predicted carboxyspermidine reaction, and what explains increased
    spermidine after deletion of the 81116 CASDH candidate?
suggested_experiments:
- description: Measure purified exact-strain enzyme kinetics with competing substrates and couple these
    assays to isotope-resolved polyamine metabolomics and genetic complementation.
  experiment_type: enzyme kinetics and isotope tracing
knowledge_gaps:
- gap_statement: Which amine substrate does Cj0172c use physiologically, and is its proposed carboxyspermidine
    reaction demonstrable in the exact NCTC11168 protein?
  boundary: Family evidence argues against interpreting the imported saccharopine label literally, but
    the same family includes putrescine-, DAP- and agmatine-using enzymes. The 81116 C8J_0166 deletion
    increases spermidine and does not establish the reaction or physiological flux of Q0PBW7. The MF replacement
    is provisional and is not promoted into a core function.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines the correct substrate-specific enzyme and pathway assignment.
  resolution: Assay purified Q0PBW7 with competing amines and verify products; combine with exact-strain
    isotope tracing and deletion/complementation.
  provenance:
  - reference_id: PMID:22025614
  - reference_id: PMID:37878710
