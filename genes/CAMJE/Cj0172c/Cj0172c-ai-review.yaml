id: Q0PBW7
gene_symbol: Cj0172c
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192222
  label: Campylobacter jejuni subsp. jejuni NCTC 11168 = ATCC 700819
description: Cj0172c is a predicted NADPH-dependent carboxypolyamine dehydrogenase of Campylobacter jejuni
  NCTC 11168. Its family assignment supports a role in reductive condensation of an amine with aspartate
  semialdehyde, with carboxyspermidine synthesis from putrescine a plausible activity. Native substrate
  preference and pathway flux remain unresolved; deletion of the corresponding candidate in strain 81116
  increased, rather than abolished, spermidine accumulation.
existing_annotations:
- term:
    id: GO:0004754
    label: saccharopine dehydrogenase (NAD+, L-lysine-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.5.1.7
  review:
    summary: The inherited saccharopine assignment is better explained by carboxypolyamine dehydrogenase
      homology.
    action: MODIFY
    reason: The EC:1.5.1.7 mapping derives from an unreviewed imported saccharopine name, not a lysine-forming
      assay. The sequence belongs to PTHR43796:SF2, the carboxypolyamine dehydrogenase family. PMID22025614
      identifies Campylobacter homologues misnamed saccharopine dehydrogenase as CASDH candidates. GO:0102143
      explicitly includes carboxyspermidine/putrescine chemistry, whereas obsolete GO:0102144 must not
      be used. This replacement is a homology-supported candidate activity, not an assay of Q0PBW7. The
      studied C8J_0166 deletion was in 81116 and increased spermidine; neither necessity nor exclusive
      native putrescine specificity is established. CAPA-family diversification (PMID37878710) prevents
      equating family membership with native substrate preference. The replacement is a provisional molecular-function
      refinement, not a demonstrated physiological core; core_functions is deliberately empty, consistent
      with substrate-uncertain BT_4612. A verified exact-strain assay could confirm or revise this reaction
      hypothesis.
    supported_by:
    - reference_id: file:CAMJE/Cj0172c/Cj0172c-uniprot.txt
      supporting_text: PANTHER; PTHR43796:SF2; CARBOXYNORSPERMIDINE SYNTHASE
      record_section:
      - DR:PANTHER
    - reference_id: PMID:22025614
      supporting_text: deletion of the C. jejuni CASDH does not abolish spermidine accumulation. Instead,
        it paradoxically produces a very large increase in spermidine accumulation.
    proposed_replacement_terms:
    - id: GO:0102143
      label: carboxynorspermidine dehydrogenase activity
