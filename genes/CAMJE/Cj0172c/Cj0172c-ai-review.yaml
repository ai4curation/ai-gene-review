id: Q0PBW7
gene_symbol: Cj0172c
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192222
  label: Campylobacter jejuni subsp. jejuni NCTC 11168 = ATCC 700819
description: Cj0172c is a predicted NADPH-dependent carboxypolyamine dehydrogenase of Campylobacter jejuni
  NCTC 11168. Its family assignment supports a role in reductive condensation of an amine with aspartate
  semialdehyde, with carboxyspermidine synthesis from putrescine a plausible activity. Native substrate
  preference and pathway flux remain unresolved; deletion of the corresponding candidate in strain 81116
  increased, rather than abolished, spermidine accumulation.
existing_annotations:
- term:
    id: GO:0004754
    label: saccharopine dehydrogenase (NAD+, L-lysine-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.5.1.7
  review:
    summary: Neither the imported saccharopine reaction nor the proposed PUT/DAP-specific replacement
      is established for Cj0172c.
    action: UNDECIDED
    reason: 'The imported EC/name is not an independent saccharopine assay. PTHR43796:SF2 placement supports
      a carboxypolyamine-dehydrogenase candidate but does not resolve PUT/DAP versus agmatine chemistry.
      PMID:37878710 demonstrates agmatine-preferring CAPADH orthologs, including an H. pylori enzyme,
      within this broader functional family. The 81116 C8J_0166 deletion increases spermidine and does
      not identify the reaction of NCTC 11168 Q0PBW7. GO:0102143 is consequently retained as a testable
      hypothesis rather than an asserted replacement. Uncertainty concerns target substrate specificity;
      it is not a claim that the measured homolog activities are false. The verdict distinguishes two
      questions: the legacy saccharopine mapping is suspect, and the positive replacement substrate is
      unresolved. Unlike CLOLEP_01502/A7VSG1 (assayed as EDO61991.1), Q0PBW7 has no accession-matched
      saccharopine assay establishing activity at the detection limit. Homology to a divergent carboxypolyamine
      family alone does not demonstrate that this unassayed protein lacks saccharopine activity. Therefore
      the specific EC mapping remains UNDECIDED rather than being declared experimentally contradicted;
      no PUT/DAP- or agmatine-specific replacement is asserted. The direct negative biochemical result
      permits REMOVE for CLOLEP_01502, but that result is not transferred to Q0PBW7.'
    supported_by:
    - reference_id: file:CAMJE/Cj0172c/Cj0172c-uniprot.txt
      supporting_text: PANTHER; PTHR43796:SF2; CARBOXYNORSPERMIDINE SYNTHASE
      record_section:
      - DR:PANTHER
    - reference_id: PMID:22025614
      supporting_text: deletion of the C. jejuni CASDH does not abolish spermidine accumulation. Instead,
        it paradoxically produces a very large increase in spermidine accumulation.
    - reference_id: PMID:37878710
      supporting_text: Similar to Synechocystis CAPADH, these enzymes showed much lower activities toward
        putrescine and 1,3-diaminopropane than the activity for agmatine (fig. S14D).
