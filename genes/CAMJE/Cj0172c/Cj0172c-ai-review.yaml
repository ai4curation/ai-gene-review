suggested_questions:
- question: What are the relative catalytic efficiencies and native fluxes for the carboxyspermidine,
    carboxynorspermidine and CAPA routes in this exact strain?
- question: Does Cj0172c catalyse the predicted carboxyspermidine reaction, and what explains increased
    spermidine after deletion of the 81116 CASDH candidate?
- question: >-
    Where does the saccharopine dehydrogenase assertion on this entry come from, and should it be
    withdrawn? The record carries the name and EC 1.5.1.7 with evidence ECO:0000313 from the EMBL
    submission, and the single GO row descends from that EC as IEA:UniProtKB-EC. A sequence and
    structure analysis (kgap-cj0172c-amine-substrate) puts global identity to genuine saccharopine
    dehydrogenases at 14.2 to 20.0 per cent against 64.5 to 69.3 per cent to the carboxyspermidine
    dehydrogenase group, and reads the cofactor as NADP(H) rather than the NAD+ the GO term names.
    This is raised as a question rather than filed as a source defect because the identity figures
    were not recomputed here and no activity has been measured for this protein.
suggested_experiments:
- description: Measure purified exact-strain enzyme kinetics with competing substrates and couple these
    assays to isotope-resolved polyamine metabolomics and genetic complementation.
  experiment_type: enzyme kinetics and isotope tracing
knowledge_gaps:
- gap_statement: Which amine substrate does Cj0172c use physiologically, and is its proposed carboxyspermidine
    reaction demonstrable in the exact NCTC11168 protein?
  boundary: >-
    Family evidence does not validate the imported saccharopine name or identify PUT/DAP rather than
    agmatine as target substrates. The 81116 C8J_0166 deletion increases spermidine and does not
    establish Q0PBW7 chemistry or flux. The existing annotation is UNDECIDED and no specific
    replacement or core activity is asserted. An OpenScientist run
    (kgap-cj0172c-amine-substrate) assigns the cofactor and the reaction class to this protein but
    not the amine, and the split is not a hedge: it follows from how many positions are testable
    against evidence at all. Twenty-nine residues of this protein line the cofactor site of a
    liganded family structure and 27 are identical, while zero residues can be matched to an
    amine-contacting position, because no structure anywhere in this family holds an amine or a
    carboxypolyamine. On family placement the identity gap is wide and one-directional: 14.2 to 20.0
    per cent to genuine saccharopine dehydrogenases against 64.5 to 69.3 per cent to the
    epsilonproteobacterial carboxyspermidine dehydrogenase group and 43.1 to 43.4 per cent to the
    Vibrio carboxynorspermidine dehydrogenases that have been assayed, and this is the only PF03435
    protein in the genome. The cofactor is NADP(H), read from this sequence mapped onto an
    NADPH-bound structure: 27 of 29 cofactor contacts identical against a 55.9 per cent background
    for that pair, with all three 2'-phosphate contacts present and no acidic residue at the
    position that would confer NAD specificity. So the saccharopine dehydrogenase name this entry
    carries is a fold-level carry-over, and the single GO row on it is wrong in both cofactor and
    chemistry. The amine then resists assignment from three directions at once. Putrescine is the
    only diamine this strain can make, since the genome carries no arginase-family ureohydrolase, no
    group II PLP decarboxylase and no ornithine decarboxylase, which closes the 1,3-diaminopropane
    and aminopropylagmatine routes; but that is an argument about the cell and not about the enzyme.
    The partner decarboxylase turns over both carboxyspermidine and carboxynorspermidine in vitro,
    so the second leg that settled the Clostridium leptum case, the measured preference of the
    partner enzyme, transmits no constraint upstream here. And the one in vivo test points away from
    the activity altogether: deleting the 99.0 per cent identical orthologue in strain 81116
    produced a large increase in spermidine and normal growth, while the four other deletions in the
    same pathway abolished spermidine and severely compromised growth. That result cannot be set
    aside as strain background or redundancy, because the two strains carry the same five pathway
    enzymes at 98.8 to 100 per cent identity and 81116 encodes no paralogue of this gene. The run
    states the caveats that cut the other way: the deletion strain was never complemented, so a
    second-site change in that one strain is not excluded, and free spermidine measured by HPLC is
    the balance of synthesis, glutathione conjugation and export. The qualitative point survives
    both: spermidine was still made, and growth was normal, without this enzyme. The run's own
    recommendation is to keep the existing UNDECIDED action, which this review does, since a family,
    a cofactor and a reaction class do not amount to a specific activity with a named substrate.
    Verified here against this entry's own UniProt record, which is 401 residues: the glycine-rich
    motif reading GAGGV at positions 8 to 12 and the three 2'-phosphate contacts Arg35, Thr36 and
    Lys39, together with the Pfam assignments PF03435 and PF16653, and the provenance of the
    disputed annotation, namely a submitter-supplied name and EC 1.5.1.7 carrying evidence
    ECO:0000313 from the EMBL entry, from which the GO row descends as IEA:UniProtKB-EC. Not
    reproduced here: the identity percentages, the structural mapping and its background rate, the
    genome-wide absence of the three decarboxylase and ureohydrolase families, and the cross-strain
    identity figures.
