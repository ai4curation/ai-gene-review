    - reference_id: PMID:22025614
      supporting_text: deletion of the C. jejuni CASDH does not abolish spermidine accumulation. Instead,
        it paradoxically produces a very large increase in spermidine accumulation.
    - reference_id: PMID:37878710
      supporting_text: Similar to Synechocystis CAPADH, these enzymes showed much lower activities toward
        putrescine and 1,3-diaminopropane than the activity for agmatine (fig. S14D).
references:
- id: file:CAMJE/Cj0172c/Cj0172c-hypotheses/kgap-cj0172c-amine-substrate/openscientist.md
  title: OpenScientist analysis of the Cj0172c cofactor, family placement and amine substrate
  findings:
  - statement: >-
      The cofactor and reaction class are assignable, the amine is not, and the split follows from how
      many positions are testable: 27 of 29 cofactor-site contacts are identical to a liganded family
      structure, while no structure in the family holds an amine at all. Family identity is 14.2 to
      20.0 per cent to genuine saccharopine dehydrogenases against 64.5 to 69.3 per cent to the
      carboxyspermidine dehydrogenase group, so the entry's saccharopine name is a fold-level
      carry-over and its single GO row is wrong in both cofactor and chemistry. The amine resists
      assignment because the organism's only available diamine argument is about the cell rather than
      the enzyme, the partner decarboxylase accepts both candidate substrates in vitro, and the one in
      vivo deletion of the 99 per cent identical orthologue increased spermidine with normal growth
      while four other pathway deletions abolished it.
    supporting_text: >-
      The cofactor and the reaction class can be assigned to this protein. The amine cannot.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Verified against this entry's own UniProt record (401 residues): the glycine-rich motif reading
      GAGGV at 8-12, the three 2'-phosphate contacts Arg35, Thr36 and Lys39, the Pfam assignments
      PF03435 and PF16653, and the provenance of the disputed annotation, a submitter-supplied name
      and EC 1.5.1.7 with evidence ECO:0000313 from the EMBL entry, from which the GO row descends as
      IEA:UniProtKB-EC. Not reproduced here: the identity percentages, the structural mapping onto
      8DEB and its background substitution rate, the genome-wide absence of the ureohydrolase and
      decarboxylase families, and the cross-strain identity figures. The run recommends keeping the
      existing UNDECIDED action and this review does so.
