core_functions:
- description: Predicted Fe(II)-dependent gallate ring cleavage, supported by two
    gallate-dioxygenase domains and NF009904 in the native strain 383 gallate-cluster neighborhood.
    Whole-strain gallate growth supports the physiological context; this protein has not been
    directly assayed here. Neither strict gallate specificity nor a complete downstream route
    follows from this assignment.
