  label: Burkholderia lata
description: Bcep18194_C7572 encodes a predicted Fe(II)-dependent gallate ring-cleavage dioxygenase
  in Burkholderia lata strain 383. Its fused LigB-like catalytic and LigA-like domains carry
  gallate-dioxygenase family signatures. It is a candidate entry enzyme of the chromosomal gallate
  catabolic cluster; its native substrate range has not been established by a target-specific enzyme
  assay.
