  review:
    action: MODIFY
    summary: Gallate dioxygenase is the supported inferred catalytic assignment.
    reason: The original PCA-specific assignment is an EC mapping resting on an unchecked submitter
      designation. Both gallate-specific domain classifications and NF009904, in a published
      gallate-cluster neighborhood, instead support a GalA/DesB-like gallate enzyme. The generic
      LigA/LigB fold does not establish PCA specificity. This is a substrate correction by
      convergent homology and context, not a claim that PCA turnover was experimentally excluded in
      the target.
