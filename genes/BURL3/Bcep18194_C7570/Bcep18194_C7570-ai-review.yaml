  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The shared fold does not establish this reaction class for the target.
    reason: The InterPro mapping extends a heterogeneous amidohydrolase-related/decarboxylase classification
      to this member. In the published gal cluster the corresponding position is LigJ-like, supporting
      a hydration/dehydration role. Neither hydrolytic bond cleavage nor decarboxylation has been independently
      demonstrated for Q39LQ2. A hydratase can share this fold without catalysing either reaction; do
      not equate a fold or family label with its substrate chemistry.
