  label: Burkholderia lata
description: Bcep18194_C7570 encodes a predicted LigJ-like hydro-lyase in the gallate-associated gene
  cluster of Burkholderia lata strain 383. Its amidohydrolase-related fold is compatible with a soluble
  aromatic-ring-cleavage intermediate hydratase. The exact substrate isomer and reaction specificity remain
  unestablished for this protein, including whether it hydrates KCH or an oxalomesaconate form.
