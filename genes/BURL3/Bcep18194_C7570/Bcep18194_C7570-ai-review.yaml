suggested_questions:
- question: 'Which ring-cleavage intermediate does Q39LQ2 hydrate: KCH, keto-OMA or enol-OMA, and is an
    upstream isomerase required?'
suggested_experiments:
- description: Assay purified Q39LQ2 separately with chemically verified KCH, keto-OMA and enol-OMA;
    identify products by NMR or LC-MS, accounting for spontaneous isomerization. Couple only
    experimentally compatible upstream and downstream enzymes, and test native
    deletion/complementation.
