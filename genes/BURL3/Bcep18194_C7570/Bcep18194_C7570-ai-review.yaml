core_functions:
- description: Inferred LigJ-like hydro-lyase participating in the downstream portion of gallate catabolism.
    PTHR21240:SF28 membership establishes evolutionary placement and the published neighborhood supports
    a hydratase role, but neither establishes the exact substrate isomer. This candidate cannot satisfy
    a requirement for demonstrated KCH hydration or establish a complete native gallate route.
