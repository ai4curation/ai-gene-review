  review:
    action: MODIFY
    summary: The inferred role is gallate catabolism rather than an unspecified secondary pathway.
    reason: The secondary-metabolism term can include utilization of unusual nutrients, so it is not treated
      as biologically false. The target lies in the strain 383 gal cluster and is inferred to catalyse
      a downstream hydration step, rather than merely being a consumed substrate. Gallate catabolism states
      this candidate physiological role more clearly. Native growth is a strain-level observation; gene
      participation is inferred from homology and neighborhood, and does not establish the exact intermediate.
    supported_by:
