    id: GO:0047584
    label: 4-oxalmesaconate hydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:4.2.1.83
  review:
    action: MODIFY
    summary: Retain the inferred hydro-lyase class without assigning an untested substrate isomer.
    reason: GO:0047584 specifies an oxalomesaconate reaction. The submitter EC assignment and broad PTHR21240:SF28
      membership do not resolve whether Q39LQ2 accepts that form, OMAenol or KCH. Comparative work distinguishes
      these intermediates and cannot be transferred wholesale to this unassayed member. Family plus synteny
      support a LigJ-like hydration role, for which hydro-lyase activity is the defensible granularity.
      The exact KCH-specific LigJ activity must remain unasserted.
    supported_by:
