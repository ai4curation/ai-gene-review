  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The shared fold does not establish this reaction class for the target.
    reason: The InterPro mapping assigns a carboxy-lyase reaction from a heterogeneous
      amidohydrolase/decarboxylase-related class. Published neighborhood analysis instead proposes a
      LigJ-like hydratase at this cluster position. These are different chemical reaction classes,
      but no target-specific Q39LQ2 product assay establishes exclusion of decarboxylation or its
      possible secondary activity. Keep MARK_AS_OVER_ANNOTATED for the unsupported specificity
      rather than treating the hydro-lyase hypothesis as a negative experiment. Characterized SYK-6
      LigJ has direct reaction/product evidence that this Burkholderia candidate lacks; different
      certainty is justified.
