core_functions:
- description: Predicted CHA aldolase contributing the downstream carbon-carbon cleavage step of gallate
    catabolism. The family assignment supports production of pyruvate and oxaloacetate, but the native
    protein has not been assayed here and no additional HMG specificity or oxaloacetate-decarboxylase
    activity is asserted.
