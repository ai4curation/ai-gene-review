suggested_questions:
- question: Does native Q39LQ3 cleave CHA with the expected product stoichiometry, and does it also decarboxylate
    oxaloacetate?
suggested_experiments:
- description: Purify Q39LQ3 and measure CHA cleavage with independent pyruvate/oxaloacetate quantification.
    Test HMG and oxaloacetate separately rather than importing the full substrate range of a homolog;
    test native deletion and complementation on gallate.
