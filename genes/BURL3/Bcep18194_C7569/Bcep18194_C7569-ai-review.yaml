    summary: The current term includes CHA cleavage, supported by LigK/PcmE family membership.
    reason: The current GO:0047443 definition includes the CHA reaction (2-hydroxy-4-oxobutane-1,2,4-tricarboxylate
      to oxaloacetate and pyruvate), in addition to the HMG reaction named in its label. TIGR02798 and
      the CHA-aldolase FunFam independently support the inferred activity, with PTHR33254:SF16 and cluster
