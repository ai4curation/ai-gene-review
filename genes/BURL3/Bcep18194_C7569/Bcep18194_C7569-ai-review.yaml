  label: Burkholderia lata
description: Bcep18194_C7569 encodes a predicted LigK/GalC-family 4-carboxy-4-hydroxy-2-oxoadipate (CHA)
  aldolase in Burkholderia lata strain 383. It is inferred to cleave a downstream gallate-catabolic intermediate
  into pyruvate and oxaloacetate. LigK/PcmE family and functional-family signatures support this assignment;
  the native enzyme kinetics and additional substrate range remain uncharacterized.
