suggested_questions:
- question: Is CexA-mediated citrate efflux strictly passive (driven by the outward citrate
    gradient and membrane potential acting on the citrate anion), or is it coupled to another
    ion under acidogenic conditions (pH around 2) that the yeast uptake assays at pH 5.5-7
    did not reproduce?
- question: Does CexA export any other tricarboxylate (isocitrate, cis-aconitate) in vivo?
    Isocitrate competes for citrate uptake, but its transport has not been shown.
- question: The UniProt INDUCTION comment says expression is repressed by Mg(2+) ions, but
    the cited studies (PMID:38076415, PMID:39377610) concern manganese(II). Should this read
    Mn(2+)?
suggested_experiments:
- description: Measure efflux of preloaded 14C-citrate from A. niger protoplasts or reconstituted
    CexA proteoliposomes as a function of pH gradient and membrane potential, to define the
    export energetics at physiological (acidic) external pH.
  experiment_type: transport assay
- description: Test radiolabelled isocitrate and cis-aconitate transport by CexA in the S.
    cerevisiae expression system to distinguish binding from translocation.
  experiment_type: transport assay
