- term:
    id: GO:0039514
    label: symbiont-mediated suppression of host JAK-STAT cascade
  evidence_type: EXP
  original_reference_id: PMID:22919663
  qualifier: involved_in
  review:
    summary: >-
      GP63 cleaves the host protein tyrosine phosphatases SHP-1, PTP1B and TCPTP
      after entering the macrophage through lipid rafts. Cleavage activates the
      phosphatases, which dephosphorylate JAK and downstream components, attenuating
      IFN-gamma-driven JAK/STAT signalling and the microbicidal responses it controls.
    action: ACCEPT
    reason: >-
      The suppression is executed by GP63 itself, through its own proteolytic
      activity on the phosphatases that switch off the cascade, and the mechanism was
      established with GP63-null and GP63-rescued L. major. The term states the direction
      of the effect and the pathway correctly for a symbiont protein acting on the host.
    additional_reference_ids:
    - PMID:19797268
    supported_by:
    - reference_id: PMID:22919663
      supporting_text: GP63 is responsible for the activation of protein tyrosine phosphatases (PTPs; SHP-1, PTP1B,
        and TCPTP) that lead to the alteration of JAK, MAP, and IRAK-1 kinase pathways.
    - reference_id: PMID:19797268
      supporting_text: involves the proteolytic activity of the Leishmania surface protease
        GP63.
    - reference_id: PMID:19797268
      supporting_text: lipid raft-dependent mechanism, resulting in PTP cleavage and stimulation of phosphatase
        activity.
- term:
    id: GO:0052028
    label: symbiont-mediated activation of host signal transduction pathway
  evidence_type: IMP
  original_reference_id: PMID:25063865
  qualifier: acts_upstream_of
  review:
    summary: >-
      GP63-dependent degradation of host synaptotagmin XI removes a brake on
      macrophage vesicular secretion, so infected cells release TNF and IL-6, and mice
      injected with GP63-expressing parasites recruit more neutrophils and inflammatory
      monocytes.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim is supported by GP63-deficient parasites and by siRNA epistasis
      against the substrate, and GP63 performs the cleavage itself. The term is broad, but
      GO:0052028 has no descendant covering symbiont-driven induction of host cytokine
      secretion, so it is as precise as the ontology allows; it is a downstream consequence
      of the protease activity rather than a core function.
    supported_by:
