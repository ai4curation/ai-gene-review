- term:
    id: GO:0039604
    label: symbiont-mediated suppression of host translation
  evidence_type: IMP
  original_reference_id: PMID:21501832
  qualifier: involved_in
  review:
    summary: >-
      Jaramillo et al. showed that GP63 cleaves host mTOR in infected macrophages,
      inhibiting mTORC1 and activating the translational repressor 4E-BP1, which represses
      cap-dependent host translation and promotes parasite proliferation. GP63-deficient
      parasites do not produce the effect.
    action: NEW
    reason: >-
      GP63 performs the step itself, by proteolysing the kinase that controls the
      host translational repressor, so this is participation and not merely a downstream
      consequence of infection. The effect is on host translation specifically and is not
      covered by the existing JAK-STAT, inflammatory-response or signal-transduction terms.
    additional_reference_ids:
    - PMID:22919663
    supported_by:
    - reference_id: PMID:21501832
      supporting_text: we show that the Leishmania protease GP63 cleaves the mammalian/mechanistic target of
        rapamycin (mTOR), a serine/threonine kinase that regulates the translational repressor
        4E-BP1.
    - reference_id: PMID:21501832
      supporting_text: mTOR cleavage results in the inhibition of mTOR complex 1 (mTORC1) and
        concomitant activation of 4E-BP1 to promote Leishmania proliferation.
core_functions:
- description: >-
    Zinc-dependent metalloendopeptidase (EC 3.4.24.36) of the peptidase M8
    family, held GPI-anchored on the external face of the promastigote plasma membrane and
    catalytically active in situ, with a released soluble pool. It cleaves host proteins
    with a preference for hydrophobic residues at the scissile bond, and this single
    activity underlies all of its characterised roles.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
