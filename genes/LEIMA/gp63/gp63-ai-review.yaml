    action: ACCEPT
    reason: >-
      Correctly uses the neutral perturbation term rather than the suppression child
      GO:0052036, because the measured effect of GP63 here is an increase in the
      inflammatory output, not its inhibition. The effect is traced to a protein that GP63
      cleaves directly, so GP63 performs part of the work.
    supported_by:
