id: P08148
gene_symbol: gp63
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5664
  label: Leishmania major
description: >-
  Leishmanolysin (GP63, major surface protease/MSP, EC 3.4.24.36) is the predominant
  surface glycoprotein of Leishmania promastigotes. It is a zinc-dependent
  metalloendopeptidase of the peptidase M8 family, built on a metzincin-like catalytic
  domain with an HEXXH motif in which Glu-265 is the catalytic base and the two
  histidines coordinate a single zinc ion. The 602-residue
  precursor carries a signal peptide and an N-terminal activation propeptide, and the
  mature chain is attached to the outer leaflet of the parasite plasma membrane by a
  glycosylphosphatidylinositol anchor added at Asn-577, so the enzyme is catalytically
  active in situ on the cell surface. A soluble pool is released from the surface and
  GP63 is also exported in parasite exosomes. In Leishmania major the protein is encoded
  by a tandem gene family whose members are expressed in a stage-specific manner, with
  the highly expressed promastigote forms distinct from the metacyclic/amastigote form.
  GP63 is a virulence factor acting at the parasite-host interface. On the parasite
  surface it accelerates conversion of deposited complement C3b to iC3b, limiting
  assembly of the terminal complement components and conferring resistance to
  complement-mediated lysis while leaving the parasite opsonised for uptake through
  complement receptors; it degrades host antimicrobial peptides and extracellular matrix
  proteins such as collagen IV and fibronectin, promoting migration through tissue. After
  internalisation into macrophages it reaches cytoplasmic substrates and cleaves host
  protein tyrosine phosphatases SHP-1, PTP1B and TCPTP, activating them and thereby
  damping JAK/STAT and MAPK signalling, cleaves mTOR to inhibit mTORC1 and repress
  cap-dependent host translation, and degrades synaptotagmin XI, which de-represses
  macrophage TNF and IL-6 secretion.
