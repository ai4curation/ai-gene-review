- term:
    id: GO:0141115
    label: symbiont-mediated suppression of host complement activation by inactivation
      of complement proteins
  evidence_type: EXP
  original_reference_id: PMID:22442494
  qualifier: involved_in
  review:
    summary: >-
      Review of secreted Leishmania virulence factors citing GP63 as the surface
      protease that cleaves complement C3 products and protects the parasite from
      complement-mediated lysis. The underlying experimental work is in the primary
      literature, where GP63 accelerates C3b to iC3b conversion and GP63-deficient
      L. major is complement-sensitive.
    action: ACCEPT
    reason: >-
      The claim is correct and well supported. GP63 itself cleaves surface-deposited
      C3b, converting it to the inactive iC3b fragment so that the terminal complement
      components are not assembled. The protease, not the parasite in general, performs the
      inactivating step, which is exactly what the term describes.
    additional_reference_ids:
    - PMID:22919663
    - PMID:9489664
    - PMID:11849703
    supported_by:
    - reference_id: PMID:22919663
      supporting_text: Leishmania overexpressing proteolytically active GP63 was able to increase the conversion of
        C3b into C3bi and to reduce the fixation of terminal complement components to Leishmania,
        consequently increasing their resistance to complement-mediated lysis comparatively to
        parasite overexpressing inactive GP63 (Brittingham et al., 1995).
    - reference_id: PMID:9489664
      supporting_text: clearly involved in conferring resistance to complement-mediated lysis. The L. major GP63
        1-6 mutants were capable of infecting mouse macrophages and differentiating into
        amastigotes.
- term:
    id: GO:0141115
    label: symbiont-mediated suppression of host complement activation by inactivation
      of complement proteins
  evidence_type: EXP
  original_reference_id: PMID:7673725
  qualifier: involved_in
  review:
    summary: >-
      Brittingham et al. compared Leishmania expressing wild-type GP63, a
      proteolytically inactive mutant, or no GP63. Only parasites with active GP63
      converted surface C3b rapidly to iC3b, fixed little of the terminal complement
      components and resisted lysis; complement fixation itself did not require GP63
      proteolysis.
    action: ACCEPT
    reason: >-
      This is the primary experimental basis for the term and it is used correctly.
      The proteolysis-dependent effect is inactivation of a deposited complement protein
      and the consequent failure of the lytic pathway, while the opsonic C3b deposition
      that GP63 does not require proteolysis for is a separate, adhesion-related claim
      handled by the symbiont-to-host adhesion term in this review. Same term and same
      claim as the other GO:0141115 row, so the actions agree.
    additional_reference_ids:
    - PMID:11849703
    supported_by:
    - reference_id: PMID:7673725
      supporting_text: Organisms expressing wild-type gp63 more rapidly converted C3b on their surface to a form
        that exhibited the neoantigen of iC3b and interacted avidly with cells expressing Mac-1, the
        receptor for iC3b.
    - reference_id: PMID:7673725
      supporting_text: However, organisms expressing wild-type gp63 on their surface
        fixed only small amounts of the terminal complement components and were dramatically
        more resistant to lysis by complement than were those lacking functional gp63.
    - reference_id: PMID:11849703
      supporting_text: promastigotes recovered from sand flies or from culture showed
        an increase in sensitivity to complement-mediated lysis and a delay in lesion
        formation in BALB/c animals.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:9739094
  qualifier: enables
  review:
    summary: >-
      The 1.86 A crystal structure of L. major leishmanolysin was solved with a
      bound zinc ion in a metzincin-type active site. UniProt records three explicit
      BINDING features for the catalytic Zn(2+) in P08148 itself, at His-264, His-268 and
      His-334, each evidenced to that structure (PubMed:9739094). Substituting either
      histidine of the HEXXH motif destabilises the protein in vivo, consistent with a
      structural as well as catalytic role for zinc binding.
    action: NEW
    reason: >-
      Zinc coordination is annotated residue-by-residue on this very protein, so the
      claim rests on observed ligand positions rather than on membership of the metzincin
      class, and it is not entailed by the metalloendopeptidase activity term, which is
      about the hydrolysis rather than the metal. Proposed conservatively as a molecular
      function the protein itself performs.
    additional_reference_ids:
    - PMID:8626468
