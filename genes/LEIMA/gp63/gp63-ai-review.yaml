suggested_questions:
- question: >-
    Which of the seven L. major gp63/msp genes contributes each documented
    activity? P08148 is one member of a stage-regulated tandem array, and annotations
    derived from experiments on parasites expressing the whole family cannot by themselves
    assign a function to a single paralog.
- question: >-
    Is there a suitable GO term for a symbiont protease that degrades host
    antimicrobial peptides? Leishmanolysin-null parasites are hypersensitive to defensins,
    magainins and cathelicidins because wild-type parasites degrade the peptides, but no
    existing child of the symbiont-mediated defence-suppression branch captures this.
- question: >-
    Likewise, should degradation of host extracellular matrix by a symbiont
    protease (collagen IV, fibronectin) be annotatable, given that it promotes parasite
    migration through tissue?
- question: >-
    How does surface-anchored, extracellularly oriented GP63 reach cytoplasmic
    host substrates such as PTP1B, mTOR and synaptotagmin XI? Lipid-raft-dependent entry is
    reported, but the translocation mechanism and the form of the enzyme that crosses the
    membrane are not established.
- question: >-
    Does GP63 have endogenous parasite substrates, or is its substrate repertoire
    entirely host-derived? No intra-parasite substrate has been reported, yet the protein
    is the most abundant surface protein of the promastigote.
suggested_experiments:
- description: >-
    Reconstitute single gp63 paralogs in the L. major whole-locus (gp63 1-7)
    null background and assay each for C3b conversion, PTP cleavage, mTOR cleavage and
    antimicrobial peptide degradation side by side.
  hypothesis: >-
    The documented activities are not evenly distributed across the paralog
    family; the stage-specific metacyclic/amastigote form carries the activities relevant
    to intracellular survival.
- description: >-
    Use an active-site-directed, cell-permeable zinc protease probe together
    with proximity labelling in infected macrophages to identify GP63 substrates and the
    host compartments it occupies over the course of infection.
  hypothesis: >-
    GP63 accesses a defined set of cytoplasmic substrates from a lipid-raft entry
    route rather than acting promiscuously throughout the host cell.
- description: >-
    Compare catalytically dead (E265D) and GPI-anchorless (N577 substituted)
    GP63 in the null background for each host-directed phenotype.
  hypothesis: >-
    Surface anchoring is required for complement evasion and adhesion, whereas
    the released enzyme accounts for extracellular matrix degradation and for delivery to
    intracellular host substrates.
