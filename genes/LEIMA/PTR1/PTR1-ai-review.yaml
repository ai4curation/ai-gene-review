- term:
    id: GO:0004146
    label: dihydrofolate reductase activity
  evidence_type: IDA
  original_reference_id: PMID:9521731
  review:
    summary: PTR1 reduces folate to dihydrofolate and dihydrofolate to 5,6,7,8-tetrahydrofolate
      with NADPH. It transfers the pro-S hydride to C6 on the si face and gives the same
      THF stereoisomer as DHFR.
    action: NEW
    reason: GO:0004146 is defined by the reaction THF + NADP+ = DHF + NADPH, which PTR1
      catalyzes directly as shown with purified enzyme. This folate-reducing activity
      underlies PTR1-mediated methotrexate resistance. GOA does not capture it for Q01782.
      PTR1 is the catalyst, so no participation concern arises. DHFR-TS is the main
      folate reductase, so this is a secondary, physiologically conditional activity.
    supported_by:
    - reference_id: PMID:9521731
      supporting_text: With folate as a substrate, PTR1 catalyzes two rounds of reduction,
        yielding 5,6,7, 8-tetrahydrofolate and oxidizing 2 equiv of NADPH.
    - reference_id: PMID:9521731
      supporting_text: PTR1 transfers the pro-S hydride of NADPH to carbon 6 on the si
        face of dihydrofolate, producing the same stereoisomer of THF as does dihydrofolate
        reductase.
