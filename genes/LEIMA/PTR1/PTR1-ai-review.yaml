- id: PMID:21239486
  title: Dissecting the metabolic roles of pteridine reductase 1 in Trypanosoma brucei
    and Leishmania major.
  findings:
  - statement: LmPTR1 has NADPH-dependent quinonoid dihydropteridine reductase activity
      in addition to pteridine reductase activity, with about 20-fold lower efficiency
      than LmQDPR.
    supporting_text: we demonstrate that there is an NADPH-dependent QDPR activity associated with both TbPTR1
      and LmPTR1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. PubMed title matches. Source of the GO:0004155 and
      GO:0047040 IDA annotations.
- id: PMID:7972081
  title: 'PTR1: a reductase mediating salvage of oxidized pteridines and methotrexate
    resistance in the protozoan parasite Leishmania major.'
  findings:
  - statement: PTR1 is the primary enzyme of pteridine salvage; ptr1- mutants require
      reduced biopterin.
    supporting_text: The concordance of the biochemical and genetic properties of PTR1
      suggests that this is the primary enzyme mediating pteridine salvage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract only. Its report of no activity with quinonoid
      dihydrobiopterin is superseded by PMID:21239486.
- id: PMID:9153248
  title: The roles of pteridine reductase 1 and dihydrofolate reductase-thymidylate synthase
    in pteridine metabolism in the protozoan parasite Leishmania major.
  findings:
  - statement: PTR1 is a homotetramer and is much less sensitive to methotrexate than
      DHFR-TS.
    supporting_text: PTR1 exhibited 2000-fold less sensitivity to inhibition by methotrexate than dihydrofolate
      reductase-thymidylate synthase, suggesting several mechanisms by which PTR1 may compromise
      antifolate inhibition in wild-type Leishmania and lines bearing PTR1 amplifications.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract only.
- id: PMID:9521731
  title: 'Leishmania major pteridine reductase 1 belongs to the short chain dehydrogenase
    family: stereochemical and kinetic evidence.'
  findings:
  - statement: PTR1 reduces folate to THF via DHF with DHFR-like stereochemistry and
      follows an ordered SDR mechanism.
    supporting_text: With folate as a substrate, PTR1 catalyzes two rounds of reduction,
      yielding 5,6,7, 8-tetrahydrofolate and oxidizing 2 equiv of NADPH.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract only. Basis for the NEW dihydrofolate reductase
      activity.
- id: PMID:11373620
  title: Pteridine reductase mechanism correlates pterin metabolism with drug resistance
    in trypanosomatid parasites.
  findings:
  - statement: Crystal structures show a two-step reduction mechanism; the first step
      is SDR-like and the second is DHFR-like.
    supporting_text: The first reduction uses the generic SDR mechanism, whereas the second
      shares similarities with the mechanism proposed for DHFR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract only.
- id: PMID:1339441
  title: A member of the aldoketo reductase family confers methotrexate resistance in
    Leishmania.
  findings:
  - statement: Identified hmtxr (PTR1) as the H-region gene conferring methotrexate resistance.
    supporting_text: We have now identified hmtxr as the H region gene conferring MTX
      resistance using a transfection-based approach.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. The family assignment (aldo-keto reductase) was later
      corrected to SDR (PMID:9521731).
- id: PMID:20545846
  title: Trypanosoma brucei pteridine reductase 1 is essential for survival in vitro
    and for virulence in mice.
  findings:
  - statement: TbPTR1, the ISO donor ortholog, is cytosolic by digitonin fractionation.
    supporting_text: PTR1 was recovered exclusively in the cytosolic fraction along with the cytosolic enzyme
      marker, enolase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (PMC2916222), full text. Ortholog study supporting the
      ISO cytosol transfer.
- id: PMID:17275814
  title: Degradation of pteridine reductase 1 (PTR1) enzyme during growth phase in the
    protozoan parasite Leishmania donovani.
  findings:
  - statement: L. donovani PTR1-GFP is cytoplasmic and is degraded in stationary phase,
      which the authors propose is proteasome-mediated.
    supporting_text: Fluorescence microscopy revealed cytoplasmic localization of GFP tagged protein extending to
      the flagellum in these stationary phase promastigotes, implying that degradation of the
      protein was not by the usual multivesicular tubule lysosome (MVT) pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract only. GFP-tagged overexpression; tagging
      artifacts possible.
