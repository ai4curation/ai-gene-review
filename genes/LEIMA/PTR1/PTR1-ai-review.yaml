  review:
    summary: PAINT propagation of generic SDR oxidoreductase activity. Q01782 appears
      among its own donors because it has experimental annotations, as expected.
    action: MODIFY
    reason: The claim is correct; PTR1 is an NADPH-dependent SDR reductase. But the term
      is far less specific than the directly measured activities. Replace it with pteridine
      reductase activity (GO:0047040), which the gene already carries by IDA, and dihydrofolate
      reductase activity (GO:0004146), shown by kinetic and stereochemical studies. Both
      are is_a descendants of oxidoreductase activity.
    proposed_replacement_terms:
    - id: GO:0047040
      label: pteridine reductase activity
    - id: GO:0004146
      label: dihydrofolate reductase activity
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002462421
        source_label: PTN002462421
        source_status: SUPPORTS_TRANSFER
        comment: PTR1 is inside this SDR clade and generic oxidoreductase activity is conserved
          across it. Q01782 is among the donors because it has its own experimental evidence.
          The MODIFY only sharpens the term to the measured pteridine and dihydrofolate reductase
          activities; it does not dispute the transfer.
    supported_by:
    - reference_id: PMID:7972081
      supporting_text: PTR1 purified from engineered Escherichia coli exhibited a MTX-sensitive,
        NADPH-dependent biopterin reductase activity.
    - reference_id: PMID:9521731
      supporting_text: With folate as a substrate, PTR1 catalyzes two rounds of reduction,
        yielding 5,6,7, 8-tetrahydrofolate and oxidizing 2 equiv of NADPH.
