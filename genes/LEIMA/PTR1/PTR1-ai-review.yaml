id: Q01782
gene_symbol: PTR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5664
  label: Leishmania major
description: >-
  Pteridine reductase 1 (PTR1, also known as HMTXR) is a cytosolic, NADPH-dependent
  short-chain dehydrogenase/reductase (SDR) that forms a homotetramer of 30-kDa
  subunits. Leishmania and other trypanosomatids cannot synthesize pterins de novo,
  and PTR1 is the main enzyme of unconjugated pterin salvage. It reduces imported
  biopterin in two successive steps, first to 7,8-dihydrobiopterin and then to
  5,6,7,8-tetrahydrobiopterin (H4B). The first reduction follows the general SDR
  mechanism; the second resembles the dihydrofolate reductase (DHFR) mechanism.
  PTR1 has broad substrate specificity. It also reduces folate and dihydrofolate to
  tetrahydrofolate with the same stereochemistry as DHFR, and it has a lower,
  NADPH-dependent quinonoid dihydropteridine reductase activity. ptr1 null
  promastigotes need reduced biopterin to grow, and loss of PTR1 changes
  metacyclogenesis and sensitivity to oxidative stress. PTR1 is about 2000-fold less
  sensitive to methotrexate than DHFR-thymidylate synthase. It was first identified
  as the amplified H-region gene that confers methotrexate resistance, because it
  provides a route for folate reduction that bypasses antifolate inhibition, and it
  is a target for antitrypanosomatid drug design.
existing_annotations:
- term:
    id: GO:0004155
    label: 6,7-dihydropteridine reductase activity
  evidence_type: IDA
  original_reference_id: PMID:21239486
  qualifier: enables
  review:
    summary: Ong et al. (2011) assayed recombinant LmPTR1 with an HPLC/spectrophotometric
      method and found an NADPH-dependent quinonoid dihydrobiopterin (qH2B) reductase
      activity, with a specificity constant similar to that for 7,8-dihydrobiopterin.
    action: KEEP_AS_NON_CORE
    reason: The activity is directly demonstrated and supersedes the 1994 report of no
      activity with qH2B (PMID:7972081), so the annotation stands. In L. major, however,
      the dedicated NADH-dependent QDPR is about 20-fold more efficient with qH2B than
      LmPTR1. PTR1's quinonoid reductase activity is therefore a secondary, backup
      activity in Leishmania. It may matter more in T. brucei, which lacks a QDPR. The
      term is as specific as warranted but peripheral to the core salvage function.
    supported_by:
    - reference_id: PMID:21239486
      supporting_text: we demonstrate that there is an NADPH-dependent QDPR activity associated with both TbPTR1
        and LmPTR1.
    - reference_id: PMID:21239486
      supporting_text: Specificity constants (k(cat)/K(m)) for LmPTR1 are similar with dihydrobiopterin (H(2)B)
        and quinonoid dihydrobiopterin (qH(2)B) as substrates and about 20-fold lower than LmQDPR
        with qH(2)B. In contrast, TbPTR1 shows a 10-fold higher k(cat)/K(m) for H(2)B over qH(2)B.
