- term:
    id: GO:0006729
    label: tetrahydrobiopterin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00849
  review:
    summary: The UniPathway mapping places PTR1 in the step "tetrahydrobiopterin from
      biopterin". PTR1 catalyzes the NADPH-dependent two-step reduction of biopterin to
      H4B, the only route to H4B in pterin-auxotrophic Leishmania.
    action: ACCEPT
    reason: PTR1 itself catalyzes formation of H4B from salvaged biopterin, and ptr1
      null parasites need reduced biopterin for growth. This is salvage, not the de
      novo GTP route, which trypanosomatids lack. The GO term covers any pathway that
      forms H4B, so it is correct and core.
    additional_reference_ids:
    - PMID:7972081
    - PMID:11373620
    supported_by:
    - reference_id: PMID:11373620
      supporting_text: PTR1 catalyzes the NADPH-dependent two-step reduction of oxidized pterins to the active
        tetrahydro-forms and reduces susceptibility to antifolates by alleviating dihydrofolate
        reductase (DHFR) inhibition.
    - reference_id: PMID:7972081
      supporting_text: these ptr1- mutants required reduced biopterin (dihydro- or tetrahydrobiopterin) for growth.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002462421
