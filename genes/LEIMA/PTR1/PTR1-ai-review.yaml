proposed_new_terms: []
suggested_questions:
- question: Given that LmPTR1 reduces quinonoid dihydrobiopterin with efficiency similar
    to 7,8-dihydrobiopterin, does PTR1 contribute measurably to H4B regeneration in
    L. major cells lacking QDPR, or is the dedicated QDPR sufficient?
- question: Which H4B-dependent reactions explain the requirement for reduced pterins
    in Leishmania, given that the parasite lacks NOS and the aromatic amino acid hydroxylases
    other than a non-essential PAH?
- question: What enzyme provides the residual pteridine reductase activity (PTR2) seen
    in ptr1 null Leishmania?
suggested_experiments:
- description: Generate ptr1/qdpr double mutants in L. major supplemented with H4B and
    measure intracellular H4B/qH2B pools by HPLC, with and without complementation by
    a PTR1 variant selectively impaired for quinonoid substrates.
  hypothesis: PTR1 quinonoid reductase activity partially compensates for QDPR loss
    in vivo.
- description: Determine the localization of untagged endogenous PTR1 in L. major
    promastigotes and amastigotes by immunofluorescence and digitonin fractionation.
  hypothesis: Endogenous PTR1 is cytosolic and not glycosomal in both life stages.
