- hypothesis: Dimerisation is obligatory for activity, because the substrate pocket is formed at the
    dimer interface.
  description: Identify interface residues from the 1.55 Angstrom structure, build substitutions
    designed to shift the monomer-dimer equilibrium without perturbing the monomer fold, verify the
    oligomeric state by size-exclusion chromatography with inline light scattering and the fold by
    circular dichroism, then assay cyclic tetra-adenylate cleavage. A quantitative correlation
    between dimer fraction and activity would establish that the functional unit is the dimer, which
    would in turn justify annotating protein homodimerization activity on this entry, something the
    current evidence supports structurally but has not tested functionally.
  experiment_type: interface mutagenesis with paired oligomeric-state and activity readouts
