core_functions:
- description: Homodimeric cA4-preferring ring nuclease that produces linear di-adenylate bearing a
    2',3'-cyclic phosphate. Purified-enzyme chemistry and substrate recognition are established;
    effective counterdefence under native viral expression remains disputed.
  proposed_molecular_function: cyclic oligoadenylate ring nuclease activity
