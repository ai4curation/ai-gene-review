proposed_new_terms:
- proposed_name: cyclic oligoadenylate ring nuclease activity
  proposed_definition: Catalysis of the hydrolytic cleavage of a phosphodiester bond
    within a cyclic oligoadenylate second messenger, such as cyclic tetra-adenylate
    or cyclic hexa-adenylate, opening the ring to yield linear oligoadenylate products
    that bear a 2',3'-cyclic phosphate and that no longer activate cyclic-oligoadenylate-dependent
    effector enzymes.
  justification: GO has no term for cleavage of a cyclic oligoadenylate messenger,
    and each available alternative is either too general or simply wrong. GO:0004521
    RNA endonuclease activity, asserted on this entry as the nearest existing term,
    is defensible because cyclic tetra-adenylate is a short ribonucleotide and ring
    opening is an internal phosphodiester cleavage, but it loses the substrate entirely,
    and the substrate is what the enzyme is for. GO:0001730 2'-5'-oligoadenylate synthetase
    activity is the metazoan OAS enzyme, which synthesises a different, linear 2'-5'-linked
    molecule, so it is the wrong term in both direction and chemistry, and it must
    not be used for this family or for the Cas10 cyclase that makes the substrate.
    The cyclic-nucleotide phosphodiesterase term GO:0004112 is about cAMP and cGMP
    second messengers and about generating a linear nucleoside monophosphate, which
    is neither the substrate nor the product here. The term is not a single-gene request.
    It is needed for the whole AcrIII-1 family, which is widespread in archaeal and
    bacterial viruses and in proviruses, and it would equally serve the host-encoded
    Crn1 and Crn2 ring nucleases, for example UniProtKB:Q97YD2, which perform the
    same chemistry as self-regulation of the host response rather than as counter-defence.
    It is also the mirror image of a second gap, the absence of a term for the cyclic
    oligoadenylate synthase activity of the Cas10 Palm domain, recorded in MODULE:crispr_cas_adaptive_immunity,
    and the two should be requested together so that the ontology can represent both
    ends of the signalling step.
  proposed_parent:
    id: GO:0004521
    label: RNA endonuclease activity
  supported_by:
  - reference_id: PMID:31942067
    supporting_text: Both proteins possess a potent ring nuclease activity, rapidly
      degrading cA4 to generate linear di-adenylate (ApA>P) with a cyclic 2’,3’ phosphate
  - reference_id: PMID:31942067
    supporting_text: Both SIRV1 gp29 and YddF enzymes show a strong preference for
      cA4 over cA6
  - reference_id: PMID:31942067
    supporting_text: The AcrIII-1 family has a broad host range, as it targets cA4
      signalling molecules rather than specific CRISPR effector proteins.
knowledge_gaps:
- gap_statement: GO has no molecular-function term for cleavage of a cyclic oligoadenylate
    second messenger, so the activity of this enzyme can only be asserted with GO:0004521
    RNA endonuclease activity, which omits the substrate that defines it.
  boundary: The chemistry, the product end-groups, the rate, the substrate preference
    and the active site are all established, and the process term GO:0098672 fits
    exactly. The gap is purely in the ontology's molecular-function coverage.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: Without the term, this enzyme is indistinguishable in GO from any
    other RNA endonuclease, and the signalling layer of type III CRISPR immunity is
    invisible from both ends, since the Cas10 cyclase that makes the messenger has
    no term either and GO:0001730 is the wrong term for it. The gap is also not confined
    to viral counter-defence, because the host's own Crn1 and Crn2 regulators perform
    the same reaction.
  resolution: Create the proposed term cyclic oligoadenylate ring nuclease activity
    under GO:0004521, paired with the cyclic oligoadenylate synthase request recorded
    in MODULE:crispr_cas_adaptive_immunity, then move its identifier into the molecular_function
    slot of the core function here.
  provenance:
  - reference_id: PMID:31942067
    supporting_text: Both proteins possess a potent ring nuclease activity, rapidly
      degrading cA4 to generate linear di-adenylate (ApA>P) with a cyclic 2’,3’ phosphate
- gap_statement: The UniProt entry is reviewed Swiss-Prot yet still titled "Uncharacterized
    protein 114", with no FUNCTION line and zero GO annotations, six years after the
    protein was characterised enzymatically, structurally and in a living host.
  boundary: There is no scientific uncertainty to resolve. Catalysis, substrate, product,
    rate, structure, active-site residue and in vivo sufficiency are all published
    in one paper.
  gap_kind:
  - CURATION
  status: OPEN
  significance: This is the accession-level gap recorded in modules/anti_crispr_suppression.yaml,
    which states that the assayed AcrIII-1 protein could not be matched to a UniProt
    entry from local data and uses this accession only as an orienting family exemplar.
    That gap is now closed in the opposite direction from what the module anticipated,
    because the orienting exemplar turns out to be the assayed protein. The reason
    it was hard to see is nomenclature, since the literature says gp29, UniProt says
    protein 114 and PDB says ORF 114a for one molecule, and RefSeq NP_666617 is the
    identifier that joins them. A reviewer following the module to this entry would
    otherwise conclude the protein is uncharacterised.
  resolution: Update the module by closing its third knowledge gap, citing NP_666617
    and PDB 6SCF, and by removing the caveat on the representative_members description
    for UniProtKB:Q8QL27. Separately, nominate the Swiss-Prot entry for a FUNCTION
    line and a RecName citing PMID:31942067, and add gp29 as an alternative name.
  provenance:
  - reference_id: PMID:31942067
    supporting_text: AcrIII-1 homologs were collected by using gp29 (NP_666617) of
      SIRV1 as a query
  - reference_id: PMID:31942067
    supporting_text: The structural coordinates and data have been deposited in the
      Protein Data Bank with deposition code 6SCF.
- gap_statement: Whether this gene is required for SIRV1 itself to overcome type III
    CRISPR immunity in its natural host is undetermined. Sufficiency was shown by
    expressing it in trans to rescue a different, duf1874-less virus; necessity in
    the virus of origin has not been tested.
  boundary: Sufficiency in a living host is established, and so is the enzymology.
    The untested claim is the loss-of-function counterpart, which for other anti-CRISPR
    families was the experiment that grounded the original assignments.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Sufficiency in trans shows the enzyme can defeat type III immunity.
    It does not show that SIRV1 depends on it, and SIRV1 may carry other counter-defence
    genes. A deletion that leaves SIRV1 unimpaired would mean the enzyme is one redundant
    option among several, which changes how central the activity is to the virus even
    though it would not change the molecular function.
  resolution: Delete the gene from SIRV1 and compare plaquing on a Saccharolobus islandicus
    host with an intact type III system against an isogenic effector deletion, with
    complementation in trans as the control. The precedent is the small-plaque phenotype
    reported for deletion of the homologous STIV gene B116.
  provenance:
  - reference_id: PMID:31942067
    supporting_text: However, the same cells expressing the SIRV1 gp29 gene from a
      plasmid were readily infected, giving rise to plaque formation. These data are
      consistent with the hypothesis that SIRV1 gp29 is functioning as an Acr specific
      for type III CRISPR defence.
suggested_questions:
- question: The viral enzyme is more than sixty-fold faster than the host's own Crn1
    ring nuclease on the same substrate. Is that because the host must keep its messenger
    around long enough for immunity to work, so Crn1 is under selection to be slow,
    while the virus is under selection only to be fast?
  experts:
  - Januka S. Athukoralage
  - Malcolm F. White
- question: Does GO want a cyclic tetra-adenylate binding term as a sibling of GO:0180001
    cyclic-di-AMP binding, given that specificity for the tetramer over the hexamer
    is a measured property of this enzyme and of the host CARF-domain receptors alike?
- question: PubMed lists a 2025 Nature comment on PMID:31942067 (640(8059) pages E8
    to E14) whose content was not retrievable here. Does it revise any of the gp29
    results, and if so which annotations on this entry need revisiting?
- question: SIRV1 carries this gene while the lytic virus SSeV used as the reporter
    does not. Is the presence or absence of a duf1874 gene a good predictor of which
    archaeal viruses can persist in type III-competent Sulfolobus populations?
  experts:
  - Rachel J. Whitaker
  - Mart Krupovic
suggested_experiments:
- hypothesis: SIRV1 requires this gene to overcome type III CRISPR immunity in its
    natural host, so deleting it should phenocopy the small-plaque defect reported
    for the homologous STIV gene.
  description: Construct a SIRV1 deletion mutant lacking this gene and compare plaque
    size and titre on a Saccharolobus islandicus host with an intact type III system,
    on an isogenic effector-nuclease deletion, and with the gene supplied in trans
    from a plasmid. A defect only in the type-III-competent host, rescued in trans,
    would convert the current in-trans sufficiency result into a necessity result
    on the virus of origin and would justify an additional IMP annotation.
  experiment_type: viral gene deletion and plaquing assay
- hypothesis: Catalytic speed, not substrate affinity, is what the virus is selected
    for, which would explain the sixty-fold rate difference from the host's own ring
    nuclease.
  description: Measure full Michaelis-Menten parameters for cyclic tetra-adenylate
    turnover side by side for this enzyme and for the host Crn1 under identical conditions,
    separating the contributions of substrate affinity and maximum rate. A difference
    concentrated in the maximum rate rather than in affinity would support the selection
    argument, and would also give the kinetic parameters that the GO term request
    and any future quantitative model of the signalling step need.
  experiment_type: comparative steady-state enzyme kinetics
- hypothesis: Dimerisation is obligatory for activity, because the substrate pocket
    is formed at the dimer interface.
  description: Identify interface residues from the 1.55 Angstrom structure, build
    substitutions designed to shift the monomer-dimer equilibrium without perturbing
    the monomer fold, verify the oligomeric state by size-exclusion chromatography
    with inline light scattering and the fold by circular dichroism, then assay cyclic
    tetra-adenylate cleavage. A quantitative correlation between dimer fraction and
    activity would establish that the functional unit is the dimer, which would in
    turn justify annotating protein homodimerization activity on this entry, something
    the current evidence supports structurally but has not tested functionally.
  experiment_type: interface mutagenesis with paired oligomeric-state and activity
    readouts
