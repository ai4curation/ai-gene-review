- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:31942067
  qualifier: enables
  review:
    summary: The purified recombinant protein rapidly degrades cyclic tetra-adenylate to linear
      di-adenylate bearing a 2',3'-cyclic phosphate, with an observed single-turnover cleavage rate
      exceeding five per minute at 50 degrees Celsius and a strong preference for the tetrameric
      over the hexameric cyclic oligoadenylate. Opening the ring is an internal phosphodiester
      cleavage within a short ribonucleotide, so GO:0004521 applies, and the co-crystal structure
      with substrate plus the H47A loss-of-activity variant with partial chemical rescue by
      imidazole together establish the active site.
    action: NEW
    reason: Asserted as the nearest existing term, since GO has no term for cleavage of a cyclic
      oligoadenylate second messenger. QuickGO searches for "ring nuclease" return only generic
      nuclease and nuclease-regulator terms, and searches for "cyclic oligoadenylate" return
      GO:0001730 2'-5'-oligoadenylate synthetase activity, which is the metazoan OAS enzyme acting
      in the opposite direction on a different molecule and is the wrong term, plus
      cyclic-nucleotide binding and phosphodiesterase terms that do not fit. GO:0004521 is correct
      but loses the substrate, which is the whole point of the enzyme, so a specific term is
      proposed alongside it and the core function carries the proposed name rather than this
      identifier. Evidence is IDA on purified protein.
    supported_by:
    - reference_id: PMID:31942067
      supporting_text: Both proteins possess a potent ring nuclease activity, rapidly degrading cA4
        to generate linear di-adenylate (ApA>P) with a cyclic 2’,3’ phosphate
    - reference_id: PMID:31942067
      supporting_text: With a catalytic rate exceeding 5 min-1, the Acr enzyme is at least 60-fold
        more active than the cellular ring nuclease Crn1 from S. solfataricus.
