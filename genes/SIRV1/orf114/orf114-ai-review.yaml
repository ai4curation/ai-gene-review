proposed_new_terms:
- proposed_name: cyclic oligoadenylate ring nuclease activity
  proposed_definition: Catalysis of the endonucleolytic cleavage of an internal 3'-5' phosphodiester
    linkage within a cyclic oligoadenylate second messenger, opening the ring to yield linear
    oligoadenylate products bearing a 2',3'-cyclic phosphate.
  justification: GO has no term for cleavage of a cyclic oligoadenylate messenger, and each
    available alternative is either too general or simply wrong. GO:0004521 RNA endonuclease
    activity, asserted on this entry as the nearest existing term, is defensible because cyclic
    tetra-adenylate is a short ribonucleotide and ring opening is an internal phosphodiester
    cleavage, but it loses the substrate entirely, and the substrate is what the enzyme is for.
    GO:0001730 2'-5'-oligoadenylate synthetase activity is the metazoan OAS enzyme, which
    synthesises a different, linear 2'-5'-linked molecule, so it is the wrong term in both direction
    and chemistry, and it must not be used for this family or for the Cas10 cyclase that makes the
    substrate. The cyclic-nucleotide phosphodiesterase term GO:0004112 is about cAMP and cGMP second
    messengers and about generating a linear nucleoside monophosphate, which is neither the
    substrate nor the product here. The term is not a single-gene request. It is needed for
    experimentally established ring nucleases in viral and cellular lineages, and it would equally
    serve the host-encoded Crn1 and Crn2 ring nucleases, for example UniProtKB:Q97YD2, which perform
    the same chemistry as self-regulation of the host response rather than as counter-defence. It is
    also the mirror image of a second gap, the absence of a term for the cyclic oligoadenylate
    synthase activity of the Cas10 Palm domain, recorded in MODULE:crispr_cas_adaptive_immunity, and
    the two should be requested together so that the ontology can represent both ends of the
    signalling step.
  proposed_parent:
    id: GO:0004521
    label: RNA endonuclease activity
  supported_by:
  - reference_id: PMID:31942067
    supporting_text: Both proteins possess a potent ring nuclease activity, rapidly degrading cA4 to
      generate linear di-adenylate (ApA>P) with a cyclic 2’,3’ phosphate
  - reference_id: PMID:31942067
    supporting_text: Both SIRV1 gp29 and YddF enzymes show a strong preference for cA4 over cA6
knowledge_gaps:
- gap_statement: GO has no molecular-function term for cleavage of a cyclic oligoadenylate second
    messenger, so the activity of this enzyme can only be asserted with GO:0004521 RNA endonuclease
    activity, which omits the substrate that defines it.
  boundary: The ring-cleavage chemistry, product end-groups, rate, substrate preference and active
    site are established. The separate native counterdefence dispute does not invalidate the
    molecular activity.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: Without the term, this enzyme is indistinguishable in GO from any other RNA
    endonuclease, and the signalling layer of type III CRISPR immunity is invisible from both ends,
    since the Cas10 cyclase that makes the messenger has no term either and GO:0001730 is the wrong
    term for it. The gap is also not confined to viral counter-defence, because the host's own Crn1
    and Crn2 regulators perform the same reaction.
  resolution: Create the proposed term cyclic oligoadenylate ring nuclease activity under
    GO:0004521, paired with the cyclic oligoadenylate synthase request recorded in
    MODULE:crispr_cas_adaptive_immunity, then move its identifier into the molecular_function slot
    of the core function here.
  provenance:
  - reference_id: PMID:31942067
    supporting_text: Both proteins possess a potent ring nuclease activity, rapidly degrading cA4 to
      generate linear di-adenylate (ApA>P) with a cyclic 2’,3’ phosphate
- gap_statement: The UniProt entry is reviewed Swiss-Prot yet still titled "Uncharacterized protein
    114", with no FUNCTION line and zero GO annotations, six years after the protein was
    characterised enzymatically, structurally and in a living host.
  boundary: The accession-to-assayed-protein mapping and enzymology are established. Native
    anti-CRISPR effectiveness is a distinct unresolved question after the 2025 exchange.
  gap_kind:
  - CURATION
  status: RESOLVED
  significance: This is the accession-level gap recorded in modules/anti_crispr_suppression.yaml,
    which stated that the assayed AcrIII-1 protein could not be matched to a UniProt entry from
    local data and used this accession only as an orienting family exemplar. The module now records
    the gap as resolved and the exemplar as de-caveated. That gap is now closed in the opposite
    direction from what the module anticipated, because the orienting exemplar turns out to be the
    assayed protein. The reason it was hard to see is nomenclature, since the literature says gp29,
    UniProt says protein 114 and PDB says ORF 114a for one molecule, and RefSeq NP_666617 is the
    identifier that joins them. A reviewer following the module to this entry would otherwise
    conclude the protein is uncharacterised.
  resolution: Update the module by closing its third knowledge gap, citing NP_666617 and PDB 6SCF,
    and by removing the caveat on the representative_members description for UniProtKB:Q8QL27.
    Separately, nominate the Swiss-Prot entry for a FUNCTION line and a RecName citing
    PMID:31942067, and add gp29 as an alternative name.
  provenance:
  - reference_id: PMID:31942067
    supporting_text: AcrIII-1 homologs were collected by using gp29 (NP_666617) of SIRV1 as a query
  - reference_id: PMID:31942067
    supporting_text: The structural coordinates and data have been deposited in the Protein Data
      Bank with deposition code 6SCF.
- gap_statement: Under which native virus, host, target-transcript and expression-timing conditions
    does gp29 provide effective anti-CRISPR protection?
  boundary: Plasmid-expression sufficiency and nuclease chemistry are established. The 2025
    infection experiments used SIRV2 and included transplanted SIRV1 gp29; native SIRV1 infection
    was not assayed. The Comment and Reply main texts were inspected in the public reproduction,
    separately from the incomplete publisher caches.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: An experimentally effective ectopic inhibitor need not protect its native virus at
    the time CRISPR immunity acts. Conversely, failure in one infection context does not prove
    absence of every conditional viral counterdefence role.
  resolution: Resolve expression timing, host/target and multiplicity-of-infection dependence with
    matched constructs and controls for flanking-gene effects. Distinguish native SIRV2 gp37,
    transplanted SIRV1 gp29 and native SIRV1 infection. A negative result in one context does not
    settle all contexts.
  provenance:
  - reference_id: PMID:31942067
    supporting_text: However, the same cells expressing the SIRV1 gp29 gene from a plasmid were
      readily infected, giving rise to plaque formation. These data are consistent with the
      hypothesis that SIRV1 gp29 is functioning as an Acr specific for type III CRISPR defence.
  - reference_id: https://www.nature.com/articles/s41586-025-08649-0
    supporting_text: cannot inhibit subtype III-B CRISPR immunity when expressed from the viral
      genome, but exhibit anti-CRISPR activity when expressed from a plasmid.
    full_text_unavailable: true
