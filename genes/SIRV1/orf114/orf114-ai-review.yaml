references:
- id: PMID:31942067
  title: An anti-CRISPR viral ring nuclease subverts type III CRISPR immunity.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The paper that characterises this protein, and the reference that every annotation
      here rests on. Verification was the main curation task. Four independent checks place this
      accession as the assayed protein rather than merely a family member. First, the methods name
      the query sequence as RefSeq NP_666617, which Q8QL27 cross-references, and NCBI efetch of
      NP_666617.1 returns a sequence identical to this entry over all 114 residues. Second, the
      data-availability statement gives PDB 6SCF as the only deposition, Q8QL27 cross-references
      6SCF with eight chains spanning residues 1 to 114, and the RCSB entry record gives this paper
      as 6SCF's primary citation with the matching 1.55 Angstrom resolution and the cyclic
      tetra-adenylate ligand. Third, the four conserved residues the paper names, H47, R66, R85 and
      E88, with H47A used as the inactive variant, sit at exactly those positions in the Q8QL27
      sequence. Fourth, the apo structure the paper cites for the family member it assays
      corresponds to PDB 2X4I, also cross-referenced from this entry, whose RCSB title is "ORF 114a
      from Sulfolobus islandicus rudivirus 1".  The protein identity, cA4 chemistry and
      plasmid-expression phenotype remain supported. PMID:40240860 disputes native anti-CRISPR
      deployment; PMID:40240850 is the authors' reply. Publisher previews and the public
      reproduction of the Comment and Reply were inspected. The latter distinguishes the SIRV2
      infection experiments from untested SIRV1 infection; its normally fetched URL cache contains
      the landing page, not the full OCR displayed by web search. DISPUTED refers to the
      physiological generalization, not a retraction or a failure of the biochemical experiments.
  findings:
  - statement: The DUF1874 family was investigated for anti-CRISPR function because it is widespread
      in archaeal viruses and plasmids, bacteriophages and prophages
    supporting_text: Here, we investigated the DUF1874 protein, which is conserved and widespread in
      a variety of archaeal viruses and plasmids, bacteriophages and prophages (Extended Data
      Fig.1), for an Acr function.
    reference_section_type: INTRODUCTION
  - statement: The original authors interpret viral DUF1874 proteins as anti-CRISPR enzymes; cA4
      cleavage is established, whereas family-wide physiological deployment is now disputed.
    supporting_text: Here we identify a new family of viral anti-CRISPR (Acr) enzymes that rapidly
      degrade cyclic tetra-adenylate (cA4). The viral ring nuclease AcrIII-1 is widely distributed
      in archaeal and bacterial viruses and in proviruses.
    reference_section_type: ABSTRACT
  - statement: A previously unknown fold binds cA4 and a conserved active site cleaves it; the
      original authors infer an anti-CRISPR consequence whose native scope is disputed.
    supporting_text: The enzyme uses a previously unknown fold to bind cA4 specifically, and a
      conserved active site to rapidly cleave this signalling molecule, allowing viruses to
      neutralize the type III CRISPR defence system.
    reference_section_type: ABSTRACT
  - statement: The original authors infer broad host range from messenger targeting; this is not a
      demonstration of effective counterdefence by every homolog in every host.
    supporting_text: The AcrIII-1 family has a broad host range, as it targets cA4 signalling
      molecules rather than specific CRISPR effector proteins.
    reference_section_type: ABSTRACT
  - statement: Expressing this gene in a type III-B-only host rescues an unrelated duf1874-less
      virus from CRISPR immunity
    supporting_text: However, the same cells expressing the SIRV1 gp29 gene from a plasmid were
      readily infected, giving rise to plaque formation. These data are consistent with the
      hypothesis that SIRV1 gp29 is functioning as an Acr specific for type III CRISPR defence.
    reference_section_type: RESULTS
  - statement: This protein was one of the two family members expressed and assayed
    supporting_text: 'we cloned and expressed two family members in E. coli: the SIRV1 gp29 protein and
      the YddF protein encoded by an integrative and conjugative element ICEBs1 from B. subtilis'
    reference_section_type: RESULTS
  - statement: It degrades cyclic tetra-adenylate to linear di-adenylate with a 2',3'-cyclic
      phosphate
    supporting_text: Both proteins possess a potent ring nuclease activity, rapidly degrading cA4 to
      generate linear di-adenylate (ApA>P) with a cyclic 2’,3’ phosphate
    reference_section_type: RESULTS
  - statement: The observed single-turnover cleavage rate exceeds five per minute and exceeds that
      of the compared host ring nuclease; this is not a measured steady-state kcat.
    supporting_text: With a catalytic rate exceeding 5 min-1, the Acr enzyme is at least 60-fold
      more active than the cellular ring nuclease Crn1 from S. solfataricus.
    reference_section_type: RESULTS
  - statement: The enzyme strongly prefers cyclic tetra-adenylate over the hexameric signal
    supporting_text: Both SIRV1 gp29 and YddF enzymes show a strong preference for cA4 over cA6
    reference_section_type: RESULTS
  - statement: The substrate binds at the dimer interface
    supporting_text: The complex reveals a molecule of cA4 bound at the dimer interface.
    reference_section_type: RESULTS
  - statement: The fold is unrelated to the CARF domain, the only previously known cyclic
      oligoadenylate receptor
    supporting_text: The structure of AcrIII-1 is unrelated to the CARF domain, which is the only
      protein family thus far known to bind cOA
    reference_section_type: RESULTS
  - statement: The substrate complex was obtained with the inactive H47A variant at 1.55 Angstrom
    supporting_text: we co-crystallised an inactive variant (H47A) of SIRV1 gp29 with cA4 and solved
      the structure to 1.55 Å resolution
    reference_section_type: RESULTS
  - statement: Four residues are conserved across the family, including the catalytic histidine
    supporting_text: Conserved residues H47, R66, R85 and E88 are indicated by asterisks.
    reference_section_type: SUPPLEMENTARY_MATERIAL
  - statement: The sole structural deposition from this work is PDB 6SCF
    supporting_text: The structural coordinates and data have been deposited in the Protein Data
      Bank with deposition code 6SCF.
    reference_section_type: METHODS
  - statement: The phylogenetic query sequence is identified by RefSeq accession NP_666617
    supporting_text: AcrIII-1 homologs were collected by using gp29 (NP_666617) of SIRV1 as a query
    reference_section_type: METHODS
