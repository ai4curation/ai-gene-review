suggested_questions:
- question: The viral enzyme is more than sixty-fold faster than the host's own Crn1 ring nuclease
    on the same substrate. Is that because the host must keep its messenger around long enough for
    immunity to work, so Crn1 is under selection to be slow, while the virus is under selection only
    to be fast?
  experts:
  - Januka S. Athukoralage
  - Malcolm F. White
- question: Does GO want a cyclic tetra-adenylate binding term as a sibling of GO:0180001
    cyclic-di-AMP binding, given that specificity for the tetramer over the hexamer is a measured
    property of this enzyme and of the host CARF-domain receptors alike?
- question: Which controlled native-expression and host/target comparisons would resolve the
    physiological scope disputed by the 2025 Comment and Reply, while preserving the established
    biochemical and ectopic-expression results?
- question: SIRV1 carries this gene while the lytic virus SSeV used as the reporter does not. Is the
    presence or absence of a duf1874 gene a good predictor of which archaeal viruses can persist in
    type III-competent Sulfolobus populations?
  experts:
  - Rachel J. Whitaker
  - Mart Krupovic
- question: Should the demonstrated plasmid-expression anti-CRISPR phenotype receive a
    context-qualified process annotation despite the disputed native infection role?
  experts:
  - GO microbial and viral annotation curators
suggested_experiments:
- hypothesis: If SIRV1 gp29 contributes to counterdefence in an appropriate native infection
    context, catalytic disruption should selectively impair protection under conditions in which the
    protein is expressed before the relevant CRISPR response.
  description: If a SIRV1 isolate becomes available, compare native-promoter wild type,
    catalytic-site mutant and complemented virus across defined host CRISPR and target-transcript
    backgrounds, measuring expression timing and flanking-gene expression. In the available SIRV2
    system, distinguish native gp37 from transplanted gp29 and include early-expression controls.
    Interpret a CRISPR-dependent phenotype together with direct cA4 cleavage and signal
    measurements; knockout necessity alone does not establish process participation or automatically
    justify a new annotation.
  experiment_type: matched viral-expression and catalytic-mutant infection assays
- hypothesis: Catalytic speed, not substrate affinity, is what the virus is selected for, which
    would explain the sixty-fold rate difference from the host's own ring nuclease.
  description: Measure full Michaelis-Menten parameters for cyclic tetra-adenylate turnover side by
    side for this enzyme and for the host Crn1 under identical conditions, separating the
    contributions of substrate affinity and maximum rate. A difference concentrated in the maximum
    rate rather than in affinity would support the selection argument, and would also give the
    kinetic parameters that the GO term request and any future quantitative model of the signalling
    step need.
