taxon:
  id: NCBITaxon:157898
  label: Sulfolobus islandicus rod-shaped virus 1
description: "Protein 114 (gp29/ORF114a) of Sulfolobus islandicus rod-shaped virus 1 is a small homodimeric
  DUF1874-family cyclic tetra-adenylate ring nuclease. Its dimer-interface pocket recognizes cA4, and
  a conserved catalytic site cleaves the signal to linear di-adenylate with a 2',3'-cyclic phosphate.
  The enzyme prefers cA4 over cA6. Ectopic plasmid expression can suppress cA4-dependent type III CRISPR
  immunity and permit infection by another virus. Its native anti-CRISPR role is disputed: a later SIRV2
  infection study found no protection from native gp37 or SIRV1 gp29 transplanted into SIRV2 under the
  tested expression conditions, whereas earlier induced gp29 expression restored protection. This did
  not test infection by SIRV1 itself. The established enzymatic activity therefore does not demonstrate
  that all native infections or DUF1874 homologs use it as an effective counterdefence."
