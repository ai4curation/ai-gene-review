    summary: The 1.55 Angstrom co-crystal structure of the catalytically inactive
      H47A variant with cyclic tetra-adenylate shows one molecule of the cyclic nucleotide
      bound in a pocket at the dimer interface, buried by a loop that closes over
      it. The fold is unrelated to the CRISPR-associated Rossmann fold domain, which
      was the only protein module previously known to bind cyclic oligoadenylates.
    action: NEW
