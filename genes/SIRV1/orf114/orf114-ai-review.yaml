gene_symbol: '114'
product_type: PROTEIN
aliases:
- gp29
- ORF114a
status: COMPLETE
taxon:
  id: NCBITaxon:157898
  label: Sulfolobus islandicus rod-shaped virus 1
description: Protein 114 of Sulfolobus islandicus rod-shaped virus 1, also called gp29
  in the literature, is a 114-residue homodimeric enzyme of the DUF1874 family and
  the founding characterised member of the AcrIII-1 class of anti-CRISPR ring nucleases.
  It defeats type III CRISPR immunity by destroying the second messenger that drives
  it rather than by touching any Cas protein. When a type III effector detects viral
  RNA, the cyclase domain of Cas10 synthesises cyclic oligoadenylates from ATP, and
  cyclic tetra-adenylate in turn activates downstream CRISPR-associated Rossmann fold
  nucleases that degrade RNA indiscriminately and can drive an infecting virus to extinction.
  The enzyme binds cyclic tetra-adenylate in a pocket at its own dimer interface, on
  a fold unrelated to the Rossmann fold modules that are the only other known receptors
  for this signal, and opens the ring at a conserved active site to give linear di-adenylate
  carrying a 2',3'-cyclic phosphate, a product that no longer activates the downstream
  nucleases. Turnover exceeds five per minute, more than sixty-fold faster than the
  host's own ring nuclease, and the enzyme strongly prefers the tetrameric over the
  hexameric signal. Because the target is a small-molecule messenger rather than a protein
  surface, a single enzyme works against any type III subtype that signals through cyclic
  tetra-adenylate, and the family is correspondingly widespread across archaeal and
  bacterial viruses and proviruses.
existing_annotations:
- term:
    id: GO:0098672
    label: symbiont-mediated suppression of host CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:31942067
  qualifier: involved_in
  review:
    summary: Expressing this gene from a plasmid in a Sulfolobus islandicus M.16.4
      derivative whose only remaining defence is the type III-B CRISPR system allowed
      an unrelated lytic virus, SSeV, which carries no duf1874 gene of its own and
      which otherwise cannot plaque on that strain, to form plaques. The same strain
      without the gene remained immune, and deleting the downstream csx1 effector
      reproduced the permissive phenotype, so the gene product acts at the step that
      csx1 depends on. GO:0098672 is the correct and maximally specific process term.
    action: NEW
    reason: GOA holds no annotations at all for Q8QL27, which is still titled "Uncharacterized
      protein 114" in a reviewed Swiss-Prot entry. This is a gain-of-function experiment
      in a living host on this exact gene, which is why the evidence code is IMP rather
      than IDA. On the identity of the accession, modules/anti_crispr_suppression.yaml
      records an open gap stating that the assayed AcrIII-1 could not be matched to
      a UniProt entry and that this exemplar orients the family without being the
      assayed protein. That gap is resolved, and this accession is the assayed protein.
      The paper's phylogenetic methods name its query as RefSeq NP_666617, which Q8QL27
      cross-references and whose NCBI sequence is identical to this entry character
      for character; the data-availability statement gives PDB 6SCF, which this entry
      cross-references with eight chains spanning residues 1 to 114 and which RCSB
      resolves to this paper; and the four conserved residues named in the paper,
      H47, R66, R85 and E88, with H47A used as the inactive variant, occupy exactly
      those positions in this sequence. The reason this was not obvious is nomenclature.
      The literature calls the protein gp29, UniProt calls it protein 114, and PDB
      calls it ORF 114a, numbering the same molecule by three conventions.
    supported_by:
    - reference_id: PMID:31942067
      supporting_text: However, the same cells expressing the SIRV1 gp29 gene from
        a plasmid were readily infected, giving rise to plaque formation. These data
        are consistent with the hypothesis that SIRV1 gp29 is functioning as an Acr
        specific for type III CRISPR defence.
    - reference_id: PMID:31942067
      supporting_text: The enzyme uses a previously unknown fold to bind cA4 specifically,
        and a conserved active site to rapidly cleave this signalling molecule, allowing
        viruses to neutralize the type III CRISPR defence system.
    - reference_id: PMID:31942067
      supporting_text: AcrIII-1 homologs were collected by using gp29 (NP_666617)
        of SIRV1 as a query
- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:31942067
  qualifier: enables
  review:
    summary: The purified recombinant protein rapidly degrades cyclic tetra-adenylate
      to linear di-adenylate bearing a 2',3'-cyclic phosphate, with a turnover rate
      exceeding five per minute and a strong preference for the tetrameric over the
      hexameric cyclic oligoadenylate. Opening the ring is an internal phosphodiester
      cleavage within a short ribonucleotide, so GO:0004521 applies, and the co-crystal
      structure with substrate plus the H47A loss-of-activity variant with partial
      chemical rescue by imidazole together establish the active site.
    action: NEW
    reason: Asserted as the nearest existing term, since GO has no term for cleavage
      of a cyclic oligoadenylate second messenger. QuickGO searches for "ring nuclease"
      return only generic nuclease and nuclease-regulator terms, and searches for
      "cyclic oligoadenylate" return GO:0001730 2'-5'-oligoadenylate synthetase activity,
      which is the metazoan OAS enzyme acting in the opposite direction on a different
      molecule and is the wrong term, plus cyclic-nucleotide binding and phosphodiesterase
      terms that do not fit. GO:0004521 is correct but loses the substrate, which
      is the whole point of the enzyme, so a specific term is proposed alongside it
      and the core function carries the proposed name rather than this identifier.
      Evidence is IDA on purified protein.
    supported_by:
    - reference_id: PMID:31942067
      supporting_text: Both proteins possess a potent ring nuclease activity, rapidly
        degrading cA4 to generate linear di-adenylate (ApA>P) with a cyclic 2’,3’
        phosphate
    - reference_id: PMID:31942067
      supporting_text: With a catalytic rate exceeding 5 min-1, the Acr enzyme is
        at least 60-fold more active than the cellular ring nuclease Crn1 from S.
        solfataricus.
    - reference_id: PMID:31942067
      supporting_text: Both SIRV1 gp29 and YddF enzymes show a strong preference for
        cA4 over cA6
