    label: host cell cytoplasm
  evidence_type: IC
  original_reference_id: PMID:31942067
  review:
    summary: The enzyme is expressed from the viral genome inside the infected Saccharolobus
      islandicus cell and destroys cyclic tetra-adenylate there, a soluble second
      messenger synthesised by the host's cytoplasmic Cas10 cyclase domain and consumed
      by cytoplasmic Rossmann-fold effector nucleases. Rescue of an unrelated virus
      from type III immunity was demonstrated in living host cells, so the enzyme
      must act in the host cytoplasm; the structures and kinetics were obtained in
      vitro, so the location is inferred rather than measured.
    action: NEW
    reason: The UniProt taxon for this entry is the virus, so the host-qualified component
      term is the correct one and GO:0005737 cytoplasm would be wrong for a viral
      protein acting in another organism. The same assignment with the same IC code
      was used for the phage-encoded inhibitors AcrF8 (genes/BPZF4/AcrF8), gp30 (genes/BPD31/orf30)
      and AcrF3 (genes/9CAUD/acrIF3). The inference is unusually secure here because
      the substrate is a small diffusible molecule whose synthesis and consumption
      are both cytoplasmic, so there is nowhere else for the enzyme to be useful.
    supported_by:
    - reference_id: PMID:31942067
      supporting_text: However, the same cells expressing the SIRV1 gp29 gene from
        a plasmid were readily infected, giving rise to plaque formation. These data
        are consistent with the hypothesis that SIRV1 gp29 is functioning as an Acr
        specific for type III CRISPR defence.
    - reference_id: PMID:31942067
      supporting_text: Here we identify a new family of viral anti-CRISPR (Acr) enzymes
        that rapidly degrade cyclic tetra-adenylate (cA4). The viral ring nuclease
        AcrIII-1 is widely distributed in archaeal and bacterial viruses and in proviruses.
references:
- id: PMID:31942067
  title: An anti-CRISPR viral ring nuclease subverts type III CRISPR immunity.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The paper that characterises this protein, and the reference that
      every annotation here rests on. Verification was the main curation task. Four
      independent checks place this accession as the assayed protein rather than merely
      a family member. First, the methods name the query sequence as RefSeq NP_666617,
      which Q8QL27 cross-references, and NCBI efetch of NP_666617.1 returns a sequence
      identical to this entry over all 114 residues. Second, the data-availability
      statement gives PDB 6SCF as the only deposition, Q8QL27 cross-references 6SCF
      with eight chains spanning residues 1 to 114, and the RCSB entry record gives
      this paper as 6SCF''s primary citation with the matching 1.55 Angstrom resolution
      and the cyclic tetra-adenylate ligand. Third, the four conserved residues the
      paper names, H47, R66, R85 and E88, with H47A used as the inactive variant,
      sit at exactly those positions in the Q8QL27 sequence. Fourth, the apo structure
      the paper cites for the family member it assays corresponds to PDB 2X4I, also
      cross-referenced from this entry, whose RCSB title is "ORF 114a from Sulfolobus
      islandicus rudivirus 1". One caveat, recorded rather than resolved. PubMed lists
      a 2025 Nature entry (640(8059):E8-E14, doi 10.1038/s41586-025-08649-0) as a
      comment on this paper. Its content could not be retrieved from the local cache
      and has not been read, so what it revises is unknown. The paper is deliberately
      not marked is_invalid, since a listed comment is not a retraction and there
      is no evidence it bears on the gp29 results, but a curator with access should
      read it before finalising these annotations.'
