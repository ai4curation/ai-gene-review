      is no GO term for cyclic tetra-adenylate specifically, although GO:0180001 cyclic-di-AMP
      binding exists for the shorter relative, which suggests a sibling term would
      be accepted. Raised in suggested_questions rather than proposed here, to keep
      the single proposed term in this review focused on the activity.
