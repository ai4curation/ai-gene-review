    summary: >-
      Interaction of RAM1 with the GRAS protein TF80 (G7J1L1), reported by
      Park et al. (yeast interaction assays per UniProt and deep research).
    action: MODIFY
    reason: >-
      Protein binding is uninformative. GRAS proteins function as hetero-oligomeric
      transcriptional complexes (e.g. NSP1-NSP2), and RAM1 interacts with several
      other GRAS proteins (NSP2, RAD1, TF80). The interaction is better captured
