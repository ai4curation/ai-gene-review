core_functions:
- description: >-
    Nuclear GRAS-domain transcriptional activator of the arbuscular mycorrhizal
    gene program in root cortical cells. Expressed downstream of the
    CCaMK-CYCLOPS-DELLA complex, RAM1 (likely in heteromeric complexes with
    other GRAS proteins such as NSP2 and RAD1) induces arbuscule genes
    including RAM2 (direct target), STR, EXO70I, PT4 and RAD1, driving host
    lipid supply to the fungus and arbuscule branching.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0036377
    label: arbuscular mycorrhizal association
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:28596311
    supporting_text: this lipid export requires the glycerol-3-phosphate acyltransferase
      RAM2, a direct target of RAM1
  - reference_id: PMID:26511916
    supporting_text: RAM1 is not necessary to enable hyphopodium formation or hyphal
      entry into the root but is essential to support arbuscule branching
  - reference_id: PMID:27020747
    supporting_text: The corresponding proteins form a complex that activates RAM1
      expression via binding of CYCLOPS to a cis element in the RAM1 promoter.
suggested_questions:
- question: >-
    Does RAM1 bind DNA directly and sequence-specifically, or does it activate
    targets such as RAM2, STR and EXO70I only as part of a GRAS heterocomplex
    (e.g. with NSP2 or RAD1) whose DNA-binding is supplied by a partner? This
    determines whether DNA-binding transcription factor activity or
    transcription coregulator activity is the correct molecular function.
- question: >-
    Is RAM1 required for hyphopodium formation (as reported for ram1-1) or only
    for arbuscule branching (as reported for ram1-3), and do the alleles or the
    growth conditions explain the discrepancy?
- question: >-
    Should the PMID:25971550 IMP annotation (a petunia ATA mutant study) be
    recoded as ISS/ISO for the Medicago protein?
- question: >-
    How does phosphate status act on RAM1-dependent transcription; is RAM1
    regulated by PHR-SPX phosphate signalling directly?
suggested_experiments:
- description: >-
    DAP-seq or ChIP-seq of RAM1 in mycorrhizal Medicago roots, together with
    EMSA of recombinant RAM1 alone and with NSP2/RAD1, to establish direct
    targets and whether RAM1 binds DNA autonomously.
- description: >-
    Native-promoter RAM1-fluorescent protein fusions in complemented ram1
    roots to determine subcellular localization in arbusculated cortical cells.
- description: >-
    Side-by-side early-stage phenotyping of ram1-1, ram1-2 and ram1-3 under
    identical inoculation conditions to resolve the hyphopodium discrepancy.
