id: G7L166
gene_symbol: RAM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3880
  label: Medicago truncatula
description: >-
  RAM1 (REQUIRED FOR ARBUSCULAR MYCORRHIZATION 1) is a GRAS-domain
  transcriptional regulator of Medicago truncatula that acts in root cortical
  cells as a central regulator of the arbuscular mycorrhizal (AM) gene
  program. RAM1 transcription is induced in colonized cortical cells and is
  activated downstream of the common symbiosis signalling pathway by a
  CCaMK-CYCLOPS-DELLA complex acting on the RAM1 promoter, integrating
  symbiotic and gibberellin signals. RAM1 is required for the expression of
  arbuscule-associated genes, including the glycerol-3-phosphate
  acyltransferase RAM2 (a direct target), the half-ABC transporter STR, the
  exocyst subunit EXO70I, the phosphate transporter PT4 and the GRAS factor
  RAD1, and ectopic RAM1 expression is sufficient to induce several of these
  genes in the absence of the fungus. Through this program RAM1 drives the
  host lipid biosynthesis that feeds the fatty-acid-auxotrophic fungus and
  the formation of the periarbuscular interface. ram1 mutants form arbuscules
  arrested at the trunk stage with few or no branches and have strongly
  reduced colonization; an early hyphopodium defect reported for ram1-1 was
  not observed for ram1-3. RAM1 is also required for the pre-symbiotic
  transcriptional response to fungal Myc-LCO signals and for
  phosphate-mediated suppression of colonization, but is dispensable for
  rhizobial Nod factor signalling. RAM1 interacts with the GRAS proteins NSP2,
  RAD1 and TF80 and acts in the nucleus.
