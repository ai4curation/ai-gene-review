    CC   -!- FUNCTION: Required for early signal transduction events leading to
    CC       endosymbiosis. Acts early in a signal transduction chain leading
    CC       from the perception of Nod factor to the activation of calcium
    CC       spiking. Also involved in mycorrhizal symbiosis. May be involved
    CC       in the regulation of the calcium channel responsible for calcium
    CC       spiking by mobilizing another cation, and thereby altering the
    CC       membrane potential. {ECO:0000269|PubMed:17631529}.
    CC   -!- SUBCELLULAR LOCATION: Nucleus membrane
    CC       {ECO:0000269|PubMed:17173544}; Multi-pass membrane protein
    CC       {ECO:0000269|PubMed:17173544}.
    CC   -!- TISSUE SPECIFICITY: Mainly expressed in roots and nodules. Also
    CC       detected in pods, flowers, leaves, and stems.
    CC       {ECO:0000269|PubMed:14963334, ECO:0000269|PubMed:17173544}.
    CC   -!- INDUCTION: Not induced after bacterial or Nod factor treatment.
    CC       {ECO:0000269|PubMed:14963334}.
    CC   -!- DOMAIN: The N-terminal domain (1-76) is sufficient, but not
    CC       required, to target DMI1 to the nucleus.
    CC   -!- DISRUPTION PHENOTYPE: Loss of microbial symbioses. Undergoes
    CC       typical root hairs growth deformation in response to Nod factors,
    CC       but exhibits no calcium spiking and nodule formation.
    CC       {ECO:0000269|PubMed:14963334}.
    CC   -!- SIMILARITY: Belongs to the castor/pollux (TC 1.A.1.23) family.
    CC       {ECO:0000305}.
