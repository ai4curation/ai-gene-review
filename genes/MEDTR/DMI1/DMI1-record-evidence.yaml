  comments:
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '17631529'
      value: Required for early signal transduction events leading to endosymbiosis. Acts early in a signal transduction
        chain leading from the perception of Nod factor to the activation of calcium spiking. Also involved in mycorrhizal
        symbiosis. May be involved in the regulation of the calcium channel responsible for calcium spiking by mobilizing
        another cation, and thereby altering the membrane potential
    commentType: FUNCTION
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '27230377'
      value: Interacts (via c-terminus) with CNGC15A, CNGC15B and CNGC15C (via N-terminus). The Nod factor has no
        effect on these interactions, implying that the complex is maintained after activation
    commentType: SUBUNIT
  - commentType: SUBCELLULAR LOCATION
    subcellularLocations:
    - location:
        evidences:
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '17173544'
        - evidenceCode: ECO:0000269
