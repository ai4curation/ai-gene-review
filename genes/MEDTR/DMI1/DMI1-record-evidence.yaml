        value: Nucleus membrane
        id: SL-0182
      topology:
        evidences:
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '17173544'
        value: Multi-pass membrane protein
        id: SL-9909
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '14963334'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '17173544'
      value: Mainly expressed in roots and nodules. Also detected in pods, flowers, leaves, and stems
    commentType: TISSUE SPECIFICITY
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '14963334'
      value: Not induced after bacterial or Nod factor treatment
    commentType: INDUCTION
  - texts:
    - value: The N-terminal domain (1-76) is sufficient, but not required, to target DMI1 to the nucleus
    commentType: DOMAIN
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '14963334'
      value: Loss of microbial symbioses. Undergoes typical root hairs growth deformation in response to Nod factors,
        but exhibits no calcium spiking and nodule formation
    commentType: DISRUPTION PHENOTYPE
  - texts:
    - evidences:
      - evidenceCode: ECO:0000305
      value: Belongs to the castor/pollux (TC 1.A.1.23) family
    commentType: SIMILARITY
