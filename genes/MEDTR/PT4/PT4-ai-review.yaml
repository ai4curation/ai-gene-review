  review:
    summary: IBA (PANTHER PTN008392514) placing the family in the plasma membrane. Pht1 transporters generally
      act at the root plasma membrane, but MtPT4 is a lineage-specific (Pht1 subfamily I, AM-specific)
      member that is targeted exclusively to the branch domain of the periarbuscular membrane and is explicitly
      absent from the cortical-cell plasma membrane.
    action: MODIFY
    reason: 'The family-level node placement is sound for most Pht1 members, but there is target-specific
      evidence of divergence in localization: immunolocalization and native-promoter MtPT4-GFP show that
      MtPT4 is not in the plasma membrane and is restricted to the periarbuscular membrane. GO represents
      the periarbuscular membrane (GO:0085042) as a distinct host-derived membrane rather than as part
      of the plasma membrane, so the more accurate location is the periarbuscular membrane.'
    proposed_replacement_terms:
    - &id001
      id: GO:0085042
      label: periarbuscular membrane
    supported_by:
    - &id002
      reference_id: PMID:19692536
      supporting_text: As reported previously, MtPT4 is not located in the plasma membrane, and the MtPT4-GFP
        marker is consistent with this and did not label the plasma membrane.
    - &id015
      reference_id: PMID:19692536
      supporting_text: the MtPT4-GFP marker is localized exclusively in the periarbuscular membrane in
        the region around the hyphal branches, and there is no signal arising from the membrane around
        the arbuscule trunk or from the plasma membrane of the cell
    - &id003
      reference_id: PMID:12368495
      supporting_text: immunolocalization revealed that MtPT4 colocalizes with the arbuscules, consistent
        with a location on the periarbuscular membrane
