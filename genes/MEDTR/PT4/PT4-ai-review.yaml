- term:
    id: GO:0005315
    label: phosphate transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004738
  review:
    summary: InterPro (Phos_permease, IPR004738) mapping to phosphate transmembrane transporter activity.
      MtPT4 is a Pht1-family phosphate transporter whose activity was shown by complementation of yeast
      Pi-transport mutants, with low (~0.5 mM) apparent affinity and an acidic pH optimum consistent with
      H+-coupled uptake.
    action: MODIFY
    reason: The term is correct but generic. Pht1 transporters are H+/Pi symporters; UniProt records the
      H+-coupled reaction (RHEA:29939) from the original characterization, and PT4 is described as a secondary
      active transporter energized by the periarbuscular H+-ATPase gradient. The more informative child
      GO:0015317 phosphate:proton symporter activity is therefore proposed. No existing annotation carries
      an experimental molecular function term, so this MODIFY supplies the core MF.
    proposed_replacement_terms:
    - &id016
      id: GO:0015317
      label: phosphate:proton symporter activity
    supported_by:
    - &id004
      reference_id: PMID:12368495
      supporting_text: Complementation of yeast phosphate transport mutants indicated that MtPT4 functions
        as a phosphate transporter, and estimates of the K(m) suggest a relatively low affinity for phosphate.
    - &id017
      reference_id: PMID:19692536
      supporting_text: H + -ATPases, which create proton gradients necessary for secondary active transporters
        such as MtPT4, are induced in AM roots and have been localized to the periarbuscular membrane
    - &id008
      reference_id: file:MEDTR/PT4/PT4-deep-research-falcon.md
      supporting_text: It is a transporter, not an enzyme that chemically converts phosphate.
