suggested_questions:
- question: Does MtPT4 have a signalling (transceptor) activity separable from Pi transport, as suggested
    for root-tip Pi sensing and for arbuscule maintenance, or are both phenotypes explained by loss of
    Pi influx?
- question: 'How should the nitrogen-dependent suppression of pt4 premature arbuscule degeneration (via
    AMT2;3) be represented: as a property of AMT2;3/N signalling rather than as a PT4 ''response to nitrogen''
    annotation?'
- question: Should the PANTHER plasma membrane IBA be qualified for the AM-specific Pht1 subfamily I clade,
    whose members (MtPT4, OsPT11, LjPT4) are targeted to the periarbuscular membrane rather than the plasma
    membrane?
suggested_experiments:
- description: Express transport-dead MtPT4 variants (mutations in conserved Pht1 substrate-binding residues)
    in pt4 roots to test whether arbuscule maintenance and root-tip Pi responses require Pi transport
    per se.
- description: Electrophysiology (Xenopus oocytes or reconstituted proteoliposomes) to measure H+:Pi stoichiometry
    and pH dependence of MtPT4-mediated transport.
