id: Q8GSG4
gene_symbol: PT4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3880
  label: Medicago truncatula
description: PT4 (MtPT4, MtPht1;4) of Medicago truncatula is a low-affinity inorganic phosphate (Pi) transporter
  of the Pht1 subfamily I, a plant clade within the major facilitator superfamily whose members are expressed
  in arbuscular mycorrhizal (AM) roots. It is a 12-transmembrane H+-coupled Pi symporter (apparent Km
  about 0.5 mM in yeast, acidic pH optimum) that is expressed in root cortical cells containing arbuscules
  and is targeted exclusively to the branch domain of the periarbuscular membrane, the host-derived membrane
  surrounding the fine arbuscule branches; it is absent from the cortical-cell plasma membrane and from
  the membrane around the arbuscule trunk, and is degraded when arbuscules collapse. There it imports
  Pi released by the fungus from the acidified periarbuscular space into the plant cell, driven by the
  proton gradient generated by the H+-ATPase HA1. Loss of PT4 abolishes symbiotic Pi uptake and, under
  nitrogen-replete conditions, causes premature arbuscule degeneration and termination of the symbiosis;
  this degeneration is suppressed under nitrogen deprivation in an AMT2;3-dependent manner. Its transcription
  is controlled by the arbuscule program regulators RAM1 and WRI5a. PT4 is also expressed at low levels
  in root tips of non-mycorrhizal roots in a Pi-dependent manner, and pt4 mutants show altered Pi-starvation
  responses of lateral root branching.
