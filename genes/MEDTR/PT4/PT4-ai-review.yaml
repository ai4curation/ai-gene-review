core_functions:
- description: H+-coupled phosphate import across the periarbuscular membrane (arbuscule branch domain),
    taking up Pi released by the AM fungus into the root cortical cell; the plant-side uptake step of
    the mycorrhizal phosphate pathway, required for arbuscule maintenance.
