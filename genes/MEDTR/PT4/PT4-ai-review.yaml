- term:
    id: GO:0010247
    label: detection of phosphate ion
  evidence_type: IMP
  original_reference_id: PMID:26476189
  qualifier: involved_in
  review:
    summary: 'IMP: mtpt4 mutants lack the phosphate-starvation-induced increase in lateral root number
      and show impaired expression of phosphate-starvation-induced genes; the authors suggest PT4 as a
      component of root-tip P-sensing machinery.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Detection of phosphate ion (GO:0010247) asserts that the gene product receives the Pi stimulus
      and converts it into a signal (a transceptor role). The cited work shows a mutant phenotype in Pi-status
      responses, which the authors themselves only 'suggest' reflects sensing; an equally parsimonious
      explanation is that reduced Pi uptake at the root tip alters downstream Pi-status signalling. No
      evidence that PT4 signals independently of transport is available in the abstract. The curator has
      seen the full text, so this is not removed, but the claim exceeds what the phenotype establishes.
    supported_by:
    - &id007
      reference_id: PMID:26476189
      supporting_text: Lotus PT4i plants and Medicago mtpt4 mutants did not show any differential response
        to phosphate levels, suggesting that PT4 genes affect early root branching.
    - reference_id: PMID:26476189
      supporting_text: We suggest PT4 genes as novel components of the P-sensing machinery at the root
        tip level, independently of AM fungi.
