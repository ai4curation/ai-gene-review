        id: '1368505'
      value: Isopenicillin-N N-acyltransferase; part of the gene cluster that mediates the biosynthesis of penicillin,
        the world's most important antibiotic (PubMed:1368505, PubMed:2110531, PubMed:2120195). AatA catalyzes the
        exchange of the alpha-aminoadipyl side chain of isopenicillin N for phenylacetic acid to yield penicillin
        (PubMed:1368505, PubMed:2110531, PubMed:2120195). This step occurs in the peroxisomal matrix and the penM
        and paaT transporters are involved in the isopenicillin N and phenylacetic acid import into the peroxisome,
        respectively (PubMed:23053082). The penicillin biosynthesis occurs via 3 enzymatic steps, the first corresponding
        to the production of the tripeptide N-[(5S)-5-amino-5-carboxypentanoyl]-L-cysteinyl-D-valine (LLD-ACV or
        ACV) by the NRPS acvA. The tripeptide ACV is then cyclized to isopenicillin N (IPN) by the isopenicillin
        N synthase ipnA that forms the beta-lactam nucleus. Finally, the alpha-aminoadipyl side chain is exchanged
        for phenylacetic acid by the isopenicillin N acyltransferase aatA to yield penicillin in the peroxisomal
        matrix (Probable) (PubMed:1368505)
    commentType: FUNCTION
  - commentType: CATALYTIC ACTIVITY
    reaction:
      name: isopenicillin N + phenylacetyl-CoA + H2O = penicillin G + L-2-aminoadipate + CoA + H(+)
