- id: PMID:2793936
  title: The major component of the paraflagellar rod of Trypanosoma brucei is a helical
    protein that is encoded by two identical, tandemly linked genes.
  findings:
  - statement: PFRA is a 600-aa highly helical protein encoded by two identical tandem genes.
    supporting_text: The PFR protein is coded for by two tandemly linked genes of identical nucleotide sequence.
  - statement: A single PFR protein was proposed to give both the 73 and 69 kDa bands via two conformations.
    supporting_text: This PFR protein can assume two different conformations, resulting in two distinct bands of apparent molecular masses of 73 and 69 kD in SDS-gel electrophoresis.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:19879876
      review_notes: The 73 kDa (PFR1/PFRC) and 69 kDa (PFR2/PFRA) bands are encoded by distinct paralogous genes in separate tandem arrays.
      supported_by:
      - reference_id: PMID:19879876
        supporting_text: now show that the genes encoding PFR1 and PFR2 are distinct but related and are present in
          separate tandem arrays (Berriman et al., 2005; El-Sayed et al., 2005; Ivens et al., 2005).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified cloning paper for P22225 (UniProt RN [1]); the single-protein/two-conformation model was later overturned.
