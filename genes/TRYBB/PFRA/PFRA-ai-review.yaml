id: P22225
gene_symbol: PFRA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5702
  label: Trypanosoma brucei brucei
description: >-
  PFRA (and its identical tandem copy PFRB) encodes the 69 kDa paraflagellar rod
  protein, PFR2 in the consolidated kinetoplastid nomenclature, a 600-residue,
  highly alpha-helical, coiled-coil-rich protein. Together with its paralog PFR1
  (the 73 kDa PFRC/PFRD protein) it is one of the two major structural components
  of the paraflagellar rod (PFR), a trilaminar paracrystalline lattice that runs
  alongside the axoneme inside the flagellum of kinetoplastids and euglenids.
  PFR1 and PFR2 coiled coils are thought to form the filamentous wires of the PFR
  lattice. PFR2 is assembled at the distal tip of the growing flagellum into a
  stable structure with low turnover. Depletion of PFRA by RNAi blocks PFR
  construction, prevents incorporation of other PFR components, and paralyses
  procyclic trypanosomes. In bloodstream forms it is essential for viability
  and infectivity, because cells that cannot move fail cytokinesis. The PFR
  proteins associate with calmodulin, which itself is required for PFR assembly.
existing_annotations:
- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007824
  review:
    summary: >-
      InterPro2GO transfer from the Flagellar_rod domain (IPR007824). UniProt
      predicts a calmodulin-binding region (residues 335-355) by sequence
      analysis only. Purified PFR proteins (PFR1/PFR2) bound calmodulin-Sepharose
      in a calcium-dependent manner, and the binding was competed by a CaMKII
      calmodulin-binding peptide (Ridgley et al. 2000, as summarised in
      PMID:19879876). Calmodulin localises to the PFR and is required for PFR
      assembly (PMID:23787017).
    action: KEEP_AS_NON_CORE
    reason: >-
      Calmodulin binding by the PFR1/PFR2 pool is plausible and has biochemical
      support. However, the assay did not separate PFR2 from PFR1 or from
      co-migrating PAR proteins, so the evidence that PFR2 itself binds
      calmodulin is weaker than for its structural role. The term is kept as a
      real but non-core property; the core function of PFR2 is structural.
    additional_reference_ids:
    - PMID:19879876
    - PMID:23787017
    supported_by:
    - reference_id: PMID:19879876
      supporting_text: PFR protein binding by calmodulin-Sepharose was sensitive to competition by the calmodulin binding peptide from calmodulin kinase II but not an irrelevant peptide, suggesting that there is a specific interaction between calmodulin and components of the PFR.
    - reference_id: PMID:19879876
      supporting_text: although the presence in the preparations of proteins of similar molecular weight such as
        PAR1 and PAR4 homologues may also explain these results.
    - reference_id: PMID:23787017
      supporting_text: Unexpectedly CaM depletion resulted in total and catastrophic failure in PFR assembly; even
        connections linking axoneme to PFR failed to form following CaM depletion.
- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0090
  review:
    summary: >-
      UniProt SubCell mapping (Cytoplasm, cytoskeleton). PFR2 is a structural
      subunit of the paraflagellar rod, which is described as a stable
      cytoskeletal structure inside the flagellum.
    action: MODIFY
    reason: >-
      The location is correct in a broad sense, since the PFR is a cytoskeletal
      lattice, but it is unspecific and suggests a cytoplasmic cell-body
      cytoskeleton. GO has a dedicated term, GO:0097740 paraflagellar rod (part_of
      9+2 motile cilium). In GO it is not classified under cytoskeleton, so this
      is a lateral refinement to the precise structure that PFR2 builds, not a
      descendant swap. The same replacement is proposed for the motile cilium row.
    proposed_replacement_terms:
    - id: GO:0097740
      label: paraflagellar rod
    supported_by:
    - reference_id: PMID:10954429
      supporting_text: The PFR is constructed by a polar assembly process at the distal end of the flagellum resulting in a stable cytoskeletal structure with low turn-over.
    - reference_id: PMID:2793936
      supporting_text: Its major structural component is a single protein of 600 amino acids.
- term:
    id: GO:0031514
    label: motile cilium
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR007824
  - UniProtKB-SubCell:SL-0117
  review:
    summary: >-
      Combined automated annotation (InterPro + UniProt SubCell flagellum). PFR2
      is located in the flagellum, specifically in the paraflagellar rod that
      runs alongside the axoneme.
    action: MODIFY
    reason: >-
      Correct but general. GO:0097740 paraflagellar rod is a part_of descendant of
      motile cilium (via 9+2 motile cilium) and names the exact structure of
      which PFR2 is a major component. Since the PFR is only found in kinetoplastids
      and euglenids, this specific term is fully appropriate for a trypanosome protein.
    proposed_replacement_terms:
    - id: GO:0097740
      label: paraflagellar rod
    supported_by:
    - reference_id: file:TRYBB/PFRA/PFRA-uniprot.txt
      supporting_text: Major component of the paraflagellar rod (PFR).
    - reference_id: PMID:34257277
      supporting_text: Biochemical analyses indicate that major structural components of the PFR are two
        proteins, PFR1 and PFR2
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IMP
  original_reference_id: PMID:10954429
  qualifier: enables
  review:
    summary: >-
      PFR2 is one of the two major structural proteins of the PFR lattice. RNAi
      depletion of PFRA blocks PFR construction, and EM shows that most of the
      PFR structure is missing. Cryo-ET suggests that PFR1/PFR2 coiled coils make
      up the lattice wires.
    action: NEW
    reason: >-
      There is no molecular-function annotation describing what PFR2 actually
      does. It contributes structure to the PFR lattice and is non-redundant
      with PFR1. GO:0005200 structural constituent of cytoskeleton was not used
      because that term occurs_in GO:0005856 cytoskeleton, and in GO the PFR is
      not classified under cytoskeleton. The broader GO:0005198 is therefore the
      most accurate existing term.
    additional_reference_ids:
    - PMID:19888464
    - PMID:34257277
    supported_by:
    - reference_id: PMID:10954429
      supporting_text: new PFRA RNA and PFRA protein quickly disappeared and PFR construction was affected,
        resulting in cell paralysis.
    - reference_id: PMID:19888464
      supporting_text: EM analysis shows that the PFR structure is greatly reduced
    - reference_id: PMID:34257277
      supporting_text: PFR1 and PFR2 are essential and non-redundant components of the PFR.
- term:
    id: GO:0060285
    label: cilium-dependent cell motility
  evidence_type: IMP
  original_reference_id: PMID:10954429
  qualifier: involved_in
  review:
    summary: >-
      Depletion of PFRA/PFR2 by inducible RNAi (snl-1, snl-2, snl4) paralyses
      procyclic T. brucei. Flagellar beat frequency and amplitude drop and
      forward motility is lost, while the axoneme remains intact.
    action: NEW
    reason: >-
      Participation test: PFR2 does part of the work of flagellar motility
      because it builds the PFR, an extra-axonemal structure that the flagellar
      beat depends on (the structural-contribution case). It is not merely a
      substrate or a remote necessity. The motility phenotype has been
      reproduced with several independent RNAi constructs and matches the
      Leishmania PFR2 null mutant. The bloodstream-form lethality and
      cytokinesis failure are downstream of motility loss, so no cytokinesis
      term is proposed.
    additional_reference_ids:
    - PMID:19888464
    - PMID:19879876
    supported_by:
    - reference_id: PMID:19888464
      supporting_text: Defective motility is clearly apparent and cells are completely paralysed.
    - reference_id: PMID:19879876
      supporting_text: Cells showed a dramatic decrease in flagellar wave frequency and amplitude that corresponded to a loss of forward cell motility.
core_functions:
- description: >-
    Major structural component of the paraflagellar rod. Together with its
    non-redundant paralog PFR1, PFR2 forms the coiled-coil lattice of the PFR
    alongside the axoneme in the trypanosome flagellum. It is needed to
    construct the PFR and to incorporate other PFR proteins into it.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0060285
    label: cilium-dependent cell motility
