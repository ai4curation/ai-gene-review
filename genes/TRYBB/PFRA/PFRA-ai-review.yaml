suggested_questions:
- question: Does PFR2 bind calmodulin directly, independently of PFR1 and co-purifying PAR proteins, and is the predicted 335-355 region the binding site?
- question: Should structural subunits such as PFR1/PFR2 be annotated to GO:0120268 paraflagellar rod assembly, given that their depletion abolishes PFR construction, or is their structural-constituent annotation sufficient by GO convention?
- question: Which specific domains of the PFR lattice (proximal, intermediate, distal) does PFR2 occupy relative to PFR1?
suggested_experiments:
- description: Express recombinant PFR2 (and PFR1) separately and measure calcium-dependent calmodulin binding, for example by overlay or ITC, with and without deletion of the predicted 335-355 calmodulin-binding region.
- description: Localise PFR2 within the PFR lattice using in situ tagging combined with cryo-ET subtomogram averaging, to assign PFR2 to specific lattice wires or densities.
