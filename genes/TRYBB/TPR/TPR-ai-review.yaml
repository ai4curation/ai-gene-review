suggested_questions:
- question: Is any T. brucei TryR imported into the single mitochondrion, for example by
    an internal or alternative-start targeting signal, or is mitochondrial trypanothione
    reduced in the cytosol and imported? The 1991 fractionation study (PMID:1779986) should
    be checked against TrypTag localisation data for Tb927.10.10390.
- question: GO:0004362 glutathione-disulfide reductase activity is propagated by TreeGrafter
    from PANTHER PTHR42737 to kinetoplastid trypanothione reductases. Should the TryR subfamily
    (PTHR42737:SF2 / TIGR01423) be excluded from that node, given the experimentally
    established mutually exclusive substrate specificity?
suggested_experiments:
- hypothesis: A fraction of TryR is located in the T. brucei mitochondrion and is needed
    to reduce trypanothione for mitochondrial tryparedoxin peroxidase.
  description: Endogenous-locus tagging with C- and N-terminal mNeonGreen, combined with
    digitonin titration and immunoblotting of cytosolic versus mitochondrial fractions in
    bloodstream and procyclic forms, using compartment markers.
  experiment_type: subcellular localization
