      TryR-depleted trypanosomes cannot cope with H2O2 (PMID:10672177). TryR does not reduce
      peroxides itself; it regenerates the electron donor, so this is treated as a
      downstream, non-core role, with cell redox homeostasis as the core process.
    supported_by:
