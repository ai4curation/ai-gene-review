    supporting_text: TbTryR was highly specific for the electron donor (NADPH) and electron
      acceptor (T(S)2) in the 412 nm assay.
  - reference_id: PMID:10672177
    supporting_text: trypanosomes containing less than 10% of wild-type enzyme activity were unable to grow,
      although the levels of reduced trypanothione and total thiols remained constant.
