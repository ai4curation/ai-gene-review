- id: PMID:10672177
  title: Trypanosomes lacking trypanothione reductase are avirulent and show increased
    sensitivity to oxidative stress.
  findings:
  - statement: Tetracycline-regulated TryR expression in T. brucei shows that less than 10%
      of wild-type activity blocks growth, causes about 60-fold hypersensitivity to H2O2, and
      abolishes infectivity in mice.
    supporting_text: trypanosomes containing less than 10% of wild-type enzyme activity were unable to grow,
      although the levels of reduced trypanothione and total thiols remained constant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified via DOI 10.1046/j.1365-2958.2000.01721.x. Abstract only
      in cache. The key in vivo genetic study of T. brucei TryR.
- id: PMID:19747949
  title: Comparative structural, kinetic and inhibitor studies of Trypanosoma brucei trypanothione
    reductase with T. cruzi.
  findings:
  - statement: Recombinant T. brucei TryR is a homodimeric FAD flavoprotein (PDB 2WBA) that
      is highly specific for NADPH and trypanothione disulfide over NADH and glutathione
      disulfide.
    supporting_text: TbTryR was highly specific for the electron donor (NADPH) and electron
      acceptor (T(S)2) in the 412 nm assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (primary citation of PDB 2WBA). Full text cached. Direct
      enzymology and structure of the T. brucei enzyme.
- id: PMID:1453951
  title: 'Molecular characterization of the trypanothione reductase gene from Crithidia
    fasciculata and Trypanosoma brucei: comparison with other flavoprotein disulphide oxidoreductases
    with respect to substrate specificity and catalytic mechanism.'
  findings:
  - statement: Cloning and sequence of the T. brucei TryR gene. TryR belongs to the flavoprotein
      disulfide oxidoreductase family.
    supporting_text: Trypanothione reductase belongs to the family of flavoprotein disulphide
      oxidoreductases that include glutathione reductases, dihydrolipoamide dehydrogenases
      and mercuric reductases.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: UniProt sequence reference for P39051. PubMed-verified, abstract only.
- id: PMID:3883489
  title: 'Trypanothione: a novel bis(glutathionyl)spermidine cofactor for glutathione reductase
    in trypanosomatids.'
  findings:
  - statement: Discovery of trypanothione as the substrate of the trypanosomatid disulfide
      reductase (then called glutathione reductase).
    supporting_text: Glutathione reductase from trypanosomes and leishmanias, unlike glutathione
      reductase from other organisms, requires an unusual low molecular weight cofactor for
      activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Historical discovery paper (Crithidia). The early
      "glutathione reductase" naming is the source of the family-level confusion.
- id: PMID:1444271
  title: Metabolism and functions of trypanothione in the Kinetoplastida.
  findings:
  - statement: Review establishing that trypanothione plus TryR replace the GSH/GR system and
      act in oxidant defense.
    supporting_text: Trypanothione and its related enzymes are involved in defense against
      damage by oxidants, certain heavy metals, and possibly xenobiotics.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified review, abstract only.
