  review:
    summary: UniProt SubCell mapping (Cytoplasm). Correct but less specific than cytosol,
      which the gene already carries.
    action: MODIFY
    reason: TryR is a soluble enzyme with no mitochondrial presequence (the sequence starts
      directly with the FAD-binding GxGxxG motif) and no canonical C-terminal PTS1, so it is
      expected to be cytosolic rather than glycosomal or mitochondrial. The more specific
      term cytosol (GO:0005829), already annotated, is preferred.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: file:TRYBB/TPR/TPR-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm.'
- term:
