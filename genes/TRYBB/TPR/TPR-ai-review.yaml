      supporting_text: hypersensitivity towards hydrogen peroxide (EC50 = 3.5 microM) was
        observed compared with the wild type (EC50 = 223 microM)
core_functions:
- description: NADPH-dependent reduction of trypanothione disulfide to dihydrotrypanothione,
    the kinetoplastid-specific replacement for glutathione reductase. It keeps the cytosolic
    thiol pool reduced and supplies electrons for peroxide detoxification. It is essential
    for parasite growth and for infection in mice.
