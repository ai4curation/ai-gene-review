  review:
    summary: Inferred by inter-ontology link from glutathione-disulfide reductase activity,
      which is itself an incorrect annotation for TryR. The process is nonetheless plausible
      biologically, because TryR supplies reducing equivalents to the tryparedoxin/peroxiredoxin
      hydroperoxide-detoxification pathway.
