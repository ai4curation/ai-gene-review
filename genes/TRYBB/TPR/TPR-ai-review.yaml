id: P39051
gene_symbol: TPR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5702
  label: Trypanosoma brucei brucei
description: >-
  Trypanothione reductase (TryR/TRYR) is the NADPH-dependent flavoprotein disulfide
  reductase that keeps the kinetoplastid-specific low-molecular-weight thiol trypanothione
  [N1,N8-bis(glutathionyl)spermidine] in its reduced dithiol form, T(SH)2. It is a homodimeric
  member of the class-I pyridine nucleotide-disulfide oxidoreductase family (the glutathione
  reductase/lipoamide dehydrogenase/mercuric reductase superfamily), with one FAD per subunit
  and a redox-active Cys52-Cys57 disulfide that transfers electrons from NADPH via FAD to
  trypanothione disulfide. The T. brucei enzyme strongly prefers NADPH over NADH and
  trypanothione disulfide over glutathione disulfide, so it does the job that glutathione
  reductase does in other eukaryotes. TryR lacks a mitochondrial presequence or a glycosomal
  PTS1 and is thought to act mainly in the cytosol. Reduced trypanothione supplies electrons to
  the tryparedoxin/peroxiredoxin systems that detoxify hydroperoxides and maintain thiol
  redox balance. TryR is essential: bloodstream trypanosomes with less than 10% of wild-type
  activity cannot grow, are highly sensitive to hydrogen peroxide, and fail to establish or
  sustain infection in mice. Because the trypanothione system has no counterpart in the
  mammalian host, TryR is a validated drug target.
existing_annotations:
- term:
    id: GO:0004362
    label: glutathione-disulfide reductase (NADPH) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN009164685
  review:
    summary: TreeGrafter transfer of glutathione reductase activity from the PTHR42737
      (glutathione reductase) family node. Purified T. brucei TryR is highly specific for
      trypanothione disulfide and reduces glutathione disulfide only negligibly.
    action: REMOVE
    reason: Paralog/family-level over-annotation. Trypanothione reductase and glutathione
      reductase are sister enzymes with mutually exclusive disulfide substrate specificity,
      and the recombinant T. brucei enzyme shows a striking preference for T(S)2 over
      GSSG (PMID:19747949). The correct activity, trypanothione-disulfide reductase (NADPH)
      activity (GO:0015042), is already present as a separate annotation. Kinetoplastids
      have no glutathione reductase; trypanothione and TryR replace the GSH/GR system
      (PMID:10672177).
    supported_by:
    - reference_id: PMID:19747949
      supporting_text: the kinetic and physical properties of TbTryR are consistent with trypanothione reductases
        from other trypanosomatids such as T. cruzi and L. donovani, especially the striking
        preference for T(S)2 over glutathione disulphide.
    - reference_id: PMID:19747949
      supporting_text: However, the enzymes trypanothione reductase and glutathione reductase are highly specific
        for their respective disulphide substrates
    - reference_id: PMID:10672177
      supporting_text: In Kinetoplastida, trypanothione and trypanothione reductase (TRYR)
        provide an intracellular reducing environment, substituting for the glutathione-glutathione
        reductase system found in most other organisms.
