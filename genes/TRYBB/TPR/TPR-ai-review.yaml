  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN009164685
  review:
    summary: TreeGrafter transfer from the glutathione reductase family node, where some
      members (e.g. dual-targeted fungal and animal GRs) have mitochondrial isoforms.
    action: UNDECIDED
    reason: T. brucei TryR has no recognizable N-terminal mitochondrial targeting sequence,
      and UniProt records only Cytoplasm. However, the subcellular distribution of TryR in
      bloodstream and procyclic T. brucei was studied directly by Smith, Opperdoes and
      Fairlamb (PMID:1779986), and the cached record has no abstract or full text, so the
      fractionation result could not be checked. The kinetoplastid mitochondrion does use
      trypanothione-dependent peroxidase systems, so a minor mitochondrial pool cannot be
      excluded. Left undecided pending access to that paper.
