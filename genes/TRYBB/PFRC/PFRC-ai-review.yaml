id: Q26789
gene_symbol: PFRC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5702
  label: Trypanosoma brucei brucei
description: PFRC (also called PFR1, PFR-C/PFR-D) is the 73 kDa major structural protein of the
  paraflagellar rod (PFR) of Trypanosoma brucei, encoded by tandemly repeated, nearly identical
  genes. The PFR is a large, paracrystalline, extra-axonemal lattice that runs alongside the 9+2
  axoneme inside the single flagellum of kinetoplastids, euglenoids and dinoflagellates. PFRC and
  the closely related but distinct 69 kDa protein PFRA (PFR2) are the two most abundant PFR
  components and are thought to co-polymerise into the coiled-coil-rich filaments of the rod.
  Both are restricted to the flagellum and are added mainly at the distal tip of the growing
  flagellum, where they form a stable cytoskeletal structure with low turnover. PFRC and PFRA are
  essential and non-redundant for PFR assembly; without PFRA, PFRC enters the flagellum but
  accumulates unassembled at the tip. Through its structural role in the PFR, PFRC supports
  flagellar motility, and the PFR also serves as a platform for calmodulin and for signalling
  and metabolic enzymes. A predicted calmodulin-binding segment is present, and the PFR complex
  binds calmodulin, but direct calmodulin binding by PFRC itself is not firmly established.
existing_annotations:
- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007824
  review:
    summary: InterPro2GO transfer from the Flagellar_rod domain (IPR007824). UniProt marks a
      predicted (ECO:0000255) calmodulin-binding region at residues 317-337. Calmodulin is a
      resident PFR protein required for PFR assembly, and purified PFR protein preparations
      bind calmodulin-Sepharose in a calcium-dependent manner, but that experiment does not
      separate PFR1 (PFRC) from PFR2 or from co-purifying PAR proteins, so direct binding by
      PFRC specifically is not demonstrated in sources available to this review.
    action: MARK_AS_OVER_ANNOTATED
    reason: Nothing positive is known about calmodulin binding by PFRC itself. The IEA is an
      InterPro2GO transfer off IPR007824, a structural Flagellar_rod domain shared by both
      major PFR subunits and by other PFR proteins, so it carries no protein-specific
      information, and the UniProt region is an ECO:0000255 sequence-analysis prediction.
      The only biochemistry is a calmodulin-Sepharose experiment run on a bulk purified PFR
      protein pool, which does not resolve PFR1 (PFRC) from PFR2 and which the authors
      themselves say may be explained by co-purifying PAR1/PAR4 homologues; the PFR
      interaction map likewise reports only "direct or indirect" complex-level interactions.
      Marked as over-annotated rather than removed, because a candidate calmodulin-binding
      segment exists and calmodulin is a resident, assembly-critical PFR protein, so the claim
      is plausible at the complex level; it is an over-annotation as a statement about PFRC.
    additional_reference_ids:
    - PMID:19879876
    - PMID:10960180
    supported_by:
    - reference_id: file:TRYBB/PFRC/PFRC-uniprot.txt
      supporting_text: /note="Calmodulin-binding"
    - reference_id: PMID:19879876
      supporting_text: This suggests that there are two pools of PFR proteins that are
        differentiated by their ability to bind calmodulin, although the presence in the
        preparations of proteins of similar molecular weight such as PAR1 and PAR4 homologues
        may also explain these results.
    - reference_id: PMID:19888464
      supporting_text: There is also evidence for either direct or indirect interactions between the major PFR
        components and calmodulin [13], strengthening the hypothesis for a major role for calcium in
        PFR function.
    - reference_id: PMID:23787017
      supporting_text: calmodulin (CaM) is found within the paraflagellar rod (PFR)
