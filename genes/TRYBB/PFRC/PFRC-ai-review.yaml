    summary: UniProt SubCell mapping (Cytoplasm, cytoskeleton). PFRC is a major component of the
      paraflagellar rod, an extra-axonemal lattice inside the flagellum often described as
      cytoskeletal, but the generic term does not capture the actual location.
    action: MODIFY
    reason: The precise, well-established location is the paraflagellar rod (GO:0097740), the
      kinetoplastid-specific extra-axonemal lattice of which PFRC is one of the two major
      structural components. GO:0097740 is the standard cellular component used for T. brucei
      PFR proteins (over 170 TREU927 gene products in QuickGO). GO classifies GO:0097740 as a
      supramolecular complex, not under cytoskeleton, so this is a lateral correction to the
      correct structure rather than a refinement to a descendant term, consistent with the
      partner subunit PFRA.
