core_functions:
- description: Major structural subunit of the paraflagellar rod. Together with the 69 kDa PFRA
    (PFR2), PFRC (PFR1) is incorporated at the distal tip of the growing flagellum and builds the
    extra-axonemal PFR lattice; each protein is essential and non-redundant for PFR assembly,
    and the PFR is required for flagellar (cilium-dependent) motility.
