- term:
    id: GO:0060285
    label: cilium-dependent cell motility
  evidence_type: IMP
  original_reference_id: PMID:12798502
  qualifier: involved_in
  review:
    summary: PFRC is described as a flagellar protein required for cell motility. The PFR it
      builds is required for flagellar beating; ablation of the PFR (classically by PFRA RNAi)
      paralyses procyclic T. brucei while the axoneme remains intact.
    action: NEW
    reason: Participation test - PFRC does part of the work of flagellar motility because it
      builds the PFR, an extra-axonemal structure on which the flagellar beat depends (the
      structural-contribution case), mirroring the partner subunit PFRA. The direct evidence for
      PFRC is weaker than for PFRA. Durand-Dubief et al. used PFRC dsRNA and describe both genes
      as required for cell motility, but the cached abstract reports only the PFRA phenotype.
      PFR1 and PFR2 are, however, each essential and non-redundant for PFR assembly, and PFR loss
      causes paralysis. Bloodstream-form lethality and cytokinesis defects follow from loss of
      motility, so no further process terms are proposed.
    additional_reference_ids:
    - PMID:10954429
    - PMID:34257277
    supported_by:
    - reference_id: PMID:12798502
      supporting_text: PFRA and PFRC genes, which code for flagellar proteins required for cell motility.
    - reference_id: PMID:10954429
      supporting_text: PFR construction was affected, resulting in cell paralysis.
    - reference_id: PMID:34257277
      supporting_text: despite sharing high-percentage amino acid identity, PFR1 and PFR2 are essential and
        non-redundant components of the PFR.
