suggested_questions:
- question: Should structural subunits such as PFR1/PFR2 be annotated to GO:0120268 paraflagellar
    rod assembly, given that each is required for PFR construction and is incorporated at the
    flagellar tip (and PFRC fails to assemble without PFRA), or are they what is assembled
    rather than agents of assembly, so that a structural-molecule annotation is sufficient?
- question: Does PFRC bind calmodulin directly, through the predicted 317-337 segment, and is any
    such binding Ca2+-dependent and relevant to PFR assembly or flagellar beat regulation?
- question: Do PFRC and PFRA form an obligate heterodimer or heteropolymer, and which densities
    of the PFR distal-zone lattice (scissors, wires) do they occupy?
- question: Are PFRC/PFRA required for viability of bloodstream-form T. brucei in the same way
    as for motility of procyclic cells?
suggested_experiments:
- description: Express recombinant PFRC (wild type and a 317-337 deletion) and measure calmodulin
    binding by Ca2+-dependent pull-down or ITC, then test the deletion for PFR incorporation and
    motility in a PFRC RNAi rescue background.
  hypothesis: PFRC carries a functional Ca2+-dependent calmodulin-binding site that contributes
    to PFR assembly or motility regulation.
- description: Use in situ tagging with small epitopes and cryo-ET subtomogram averaging, or
    crosslinking mass spectrometry of isolated PFRs, to map PFRC and PFRA positions in the
    distal-zone lattice.
  hypothesis: PFRC and PFRA co-assemble into the coiled-coil wires connecting the scissors stack
    network planes.
