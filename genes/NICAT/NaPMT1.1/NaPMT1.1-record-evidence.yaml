  comments:
  - texts:
    - evidences:
      - evidenceCode: ECO:0000250
        source: UniProtKB
        id: Q42963
      value: Involved in the biosynthesis of pyridine alkaloid natural products, leading mainly to the production
        of anabasine, anatabine, nicotine and nornicotine, effective deterrents against herbivores with antiparasitic
        and pesticide properties (neurotoxins); nornicotine serves as the precursor in the synthesis of the carcinogen
        compound N'-nitrosonornicotine (NNN) (By similarity). Methyltransferase that mediates the conversion of
        putrescine to N-methylputrescine (By similarity)
    commentType: FUNCTION
  - commentType: CATALYTIC ACTIVITY
    reaction:
      name: putrescine + S-adenosyl-L-methionine = N-methylputrescine + S-adenosyl-L-homocysteine + H(+)
