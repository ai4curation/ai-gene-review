  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '11299398'
      value: Triggered by jasmonic acid (MeJA); this induction is repressed by 2-chloroethylphosphonic acid (ethephon),
        an ethylene precursor, that can by alleviated by 1-methylcyclopropene (1-MCP), a competitive inhibitor of
        ethylene receptors (PubMed:11299398). Accumulates upon wounding and feeding by the specialist herbivore
        Manduca sexta; these induction is dramatically amplified by a pretreatment with 1-MCP (PubMed:11299398)
    commentType: INDUCTION
  - texts:
