- id: PMID:21343426
  title: Vacuole-localized berberine bridge enzyme-like proteins are required for a late step of nicotine biosynthesis in tobacco.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Experimental work on Nicotiana tabacum BBL proteins, the close orthologs
      of this N. attenuata BBL candidate; used here by similarity for the vacuolar location only.
existing_annotations:
- term:
    id: GO:0005773
    label: vacuole
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Vacuolar localization is plausible and worth retaining as non-core context.
    action: KEEP_AS_NON_CORE
    reason: >-
      By similarity: the UniProt vacuole line is ARBA-only, but GFP fusions and
      subcellular fractionation placed the tobacco BBL orthologs in the vacuole
      (Kajikawa et al. 2011, PMID:21343426), and this protein has a predicted
      N-terminal signal peptide (SignalP) consistent with entry into the
      secretory route. Kept as non-core because the review question is which BBL
      paralog carries the late nicotine chemistry, not compartment detail.
    supported_by:
    - reference_id: PMID:21343426
      supporting_text: Subcellular fractionation and localization of green fluorescent protein-tagged BBLs showed that BBLs are localized in the vacuoles.
      reference_section_type: ABSTRACT
    - reference_id: file:NICAT/NaBBL2_candidate_FOX1_2/NaBBL2_candidate_FOX1_2-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: |-
        FT   SIGNAL          1..23
        FT                   /evidence="ECO:0000256|SAM:SignalP"
      reference_section_type: DATABASE_ENTRY
