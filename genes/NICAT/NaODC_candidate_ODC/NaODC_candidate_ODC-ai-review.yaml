- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm is a true, if broad, location for this soluble decarboxylase.
    action: KEEP_AS_NON_CORE
    reason: >-
      By similarity and sequence, not an experiment on this protein. In
      subcellular fractions of tobacco (N. tabacum) cell cultures most ornithine
      decarboxylase activity was in the soluble supernatant, with a consistent
      portion in nuclear-enriched fractions (Walker et al. 1987, PMID:16665687);
      that assay cannot separate ODC paralogs. The protein is a class-II
      PLP-dependent decarboxylase (Pfam Orn_Arg_deC_N, PROSITE ODR_DC_2_1) with
      no transmembrane segment. The UniProt chloroplast line is ARBA-only and is
      not relied on here (see the chloroplast row). Kept as non-core because the
      informative content of this review is the catalytic step, not the
      compartment.
    supported_by:
    - reference_id: PMID:16665687
      supporting_text: Although a consistent portion of ornithine decarboxylase activity was detected in the nuclear-enriched fractions of TX1 and TX4, the largest levels of activity were in the supernatants of both lines.
      reference_section_type: ABSTRACT
    - reference_id: file:NICAT/NaODC_candidate_ODC/NaODC_candidate_ODC-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'DR   Pfam; PF02784; Orn_Arg_deC_N; 1.'
      reference_section_type: DATABASE_ENTRY
- term:
    id: GO:0006596
    label: polyamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
