- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm is a true, if broad, location for this soluble decarboxylase.
    action: KEEP_AS_NON_CORE
    reason: >-
      By similarity and sequence, not an experiment on this protein. In
      subcellular fractions of tobacco (N. tabacum) cell cultures most ornithine
      decarboxylase activity was in the soluble supernatant, with a consistent
      portion in nuclear-enriched fractions (Walker et al. 1987, PMID:16665687);
      that assay cannot separate ODC paralogs. The protein is a class-II
      PLP-dependent decarboxylase (Pfam Orn_Arg_deC_N, PROSITE ODR_DC_2_1) with
      no transmembrane segment. The UniProt chloroplast line is ARBA-only and is
      not relied on here (see the chloroplast row). Kept as non-core because the
      informative content of this review is the catalytic step, not the
      compartment.
    supported_by:
    - reference_id: PMID:16665687
      supporting_text: Although a consistent portion of ornithine decarboxylase activity was detected in the nuclear-enriched fractions of TX1 and TX4, the largest levels of activity were in the supernatants of both lines.
      reference_section_type: ABSTRACT
    - reference_id: file:NICAT/NaODC_candidate_DCOR/NaODC_candidate_DCOR-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'DR   Pfam; PF02784; Orn_Arg_deC_N; 1.'
      reference_section_type: DATABASE_ENTRY
- term:
    id: GO:0006596
    label: polyamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: This process assignment is appropriate.
    action: ACCEPT
    reason: >-
      Ornithine decarboxylase chemistry directly feeds polyamine biosynthesis via
      putrescine formation.
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Chloroplast localization rests only on an ARBA rule; no evidence for or
      against it in this protein was found.
    action: UNDECIDED
    reason: >-
      The UniProt plastid location is an ARBA-only prediction, the record has no
      annotated transit peptide, and no localization study of this N. attenuata
      protein or a named Nicotiana ortholog was found. What is known about plant
      ODCs does not point to the chloroplast: tobacco cell fractionation put most
      ODC activity in the soluble supernatant (Walker et al. 1987,
      PMID:16665687), and GFP fusions of rice and soybean ODC expressed in
      N. benthamiana leaves were localized to the ER (Joshi et al. 2024,
      PMID:39214468). Neither result is on this gene, so the row is left
      UNDECIDED rather than removed (previously KEEP_AS_NON_CORE, which rested on
      the ARBA line alone).
    supported_by:
    - reference_id: PMID:39214468
      supporting_text: Brassicas do not have ODC, but the single ODC gene from rice and one of the soybean genes, were localized to the ER.
      reference_section_type: ABSTRACT
    - reference_id: PMID:16665687
      supporting_text: Although a consistent portion of ornithine decarboxylase activity was detected in the nuclear-enriched fractions of TX1 and TX4, the largest levels of activity were in the supernatants of both lines.
      reference_section_type: ABSTRACT
- term:
    id: GO:0033387
    label: putrescine biosynthetic process from arginine, via ornithine
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      The ornithine-route putrescine term was the appropriate upstream process, but it is now
      obsolete; its replacement, putrescine biosynthetic process, is the correct upstream term.
    action: MODIFY
    reason: >-
      DCOR still encodes ornithine-to-putrescine chemistry even if its precise
      nicotine specialization remains uncertain.
      GO:0033387 is obsolete in the GO release 2026-07-26 (replaced_by GO:0009446), so the annotation moves to putrescine biosynthetic process.
    proposed_replacement_terms:
    - id: GO:0009446
      label: putrescine biosynthetic process
    supported_by:
    - reference_id: file:NICAT/NaODC_candidate_DCOR/NaODC_candidate_DCOR-notes.md
      supporting_text: UniProt curates A0A1J6ITS2 as an ornithine decarboxylase-family enzyme that catalyzes the same PLP-dependent ornithine-to-putrescine reaction and is also assigned to nicotine biosynthesis.
      reference_section_type: LITERATURE_REVIEW
