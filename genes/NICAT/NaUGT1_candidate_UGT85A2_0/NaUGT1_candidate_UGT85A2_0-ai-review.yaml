- id: file:NICAT/NaUGT1_candidate_UGT85A2_0/NaUGT1_candidate_UGT85A2_0-bioinformatics/RESULTS.md
  title: Reproducible NaUGT1 primary-sequence and ontology reconciliation
  findings:
  - statement: Explicit primary accession mapping and an independently recomputed global alignment support
      the close tobacco homolog; the gene-level Cell evidence resolves the candidate identity.
    supporting_text: The assayed tobacco UGT1 maps explicitly to A0A1S3YWH6 and is a nicotinate N-glucosyltransferase.
- id: file:NICAT/NaUGT1_candidate_UGT85A2_0/NaUGT1_candidate_UGT85A2_0-bioinformatics/identity-cell.md
  title: Cell 2026 NaUGT1 identity check against primary primers and GenBank sequences
  findings:
  - statement: Published cloning and perturbation primers map to the g26396 locus represented by A0A2H4GSI3;
      a primer-compatible extended ORF contains its entire 485-aa sequence unchanged.
    supporting_text: Figure 3D assays purified recombinant NaUGT1 expressed in E. coli and detects nicotinic
      acid N-glucoside from nicotinic acid.
- id: file:NICAT/NaUGT1_candidate_UGT85A2_0/NaUGT1_candidate_UGT85A2_0-hypotheses/naugt1-candidate-identity-and-nicotinate-glucosylation/openscientist.md
  title: OpenScientist adjudication of NaUGT1 identity and nicotinate glucosylation
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read the entire report and computational artifact. Its decisive O-versus-N clade exclusion
      and non-pathway/storage-branch argument are contradicted by PMID:42151135 and PMID:41928514. The very
      tobacco accession the report calls an O-glucosyltransferase is explicitly assayed as UGT1/NaGT in
      the primary supplement. Automated names and missing annotations were treated as experimental proof.
      Its no-known-plant-nicotinate-enzyme assertion conflicts with PMID:31611893. Code uses average linkage
      rather than the claimed neighbor joining and can omit terminal overhangs from identity calculations;
      independent results use the published assayed sequence. Retain the report as provenance, not as
      negative functional evidence.
  findings:
  - statement: The report claims nicotinate N-glucosylation is outside nicotine biosynthesis.
    supporting_text: nicotinic acid *N*-glucoside is a separate conjugation/storage branch (one of three
      fates of nicotinic acid), not a nicotine-biosynthetic step.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:42151135
      - PMID:41928514
      review_notes: Direct primary pathway reconstitution demonstrates on-pathway activating glucosylation.
        The source report appeared after these publications but failed to incorporate them.
      supported_by:
      - reference_id: PMID:42151135
        supporting_text: 'producing nicotinic acid N-glucoside ( 10)

          from nicotinic acid ( 2) and UDP-glucose'
