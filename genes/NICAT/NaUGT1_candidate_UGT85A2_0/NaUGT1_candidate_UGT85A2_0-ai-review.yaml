- id: file:NICAT/NaUGT1_candidate_UGT85A2_0/NaUGT1_candidate_UGT85A2_0-deep-research-falcon.md
  title: Deep research report on NaUGT1/UGT85A2_0 (Falcon/Edison Scientific Literature)
  findings:
  - statement: The earlier report lacked a primary sequence crosswalk for the candidate and therefore
      treated substrate assignment as unresolved. The independent primary-sequence analysis below now
      supplies that crosswalk at the gene level.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Earlier uncertainty about accession mapping is superseded by primary supplemental sequence
      evidence from the two 2026 papers. The Cell NaUGT1 assay primers identify the g26396 locus, with
      an extended N-terminal construct; exact activity of the isolated 485-aa database form remains untested.
      The tobacco paper is Nature Communications, distinct from the independent Cell paper.
- id: file:NICAT/NaUGT1_candidate_UGT85A2_0/NaUGT1_candidate_UGT85A2_0-hypotheses/function-hypothesis-go-0080043/openscientist.md
  title: Blinded OpenScientist function-assignment report (TreeGrafter audit)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The report supports UGT85-family identity but explicitly admits unknown target substrate
      specificity and broad UGT85 diversity. Its headline refutation and claim that sequence identity
      gaps are incompatible with shared substrate specificity are too strong. No duplicate quercetin run
      is needed; the nicotine orthology hypothesis is distinct. The family-only and absent-primary-data
      framing is superseded by the 2026 NaUGT1 gene-level assays and explicit tobacco UGT1 sequence mapping;
      these do not establish negative quercetin results.
- id: file:NICAT/NaUGT1_candidate_UGT85A2_0/NaUGT1_candidate_UGT85A2_0-hypotheses/function-hypothesis-go-0080043/falcon.md
  title: Existing falcon function-hypothesis report
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The proposed discriminating substrate panel acknowledges unresolved acceptor specificity.
      Its absence-of-characterized-UGT85-quercetin argument supports caution, not categorical exclusion.
      Neither inferred phylogenetic distance nor high predicted structure confidence proves substrate
      specificity. The family-only and absent-primary-data framing is superseded by the 2026 NaUGT1 gene-level
      assays and explicit tobacco UGT1 sequence mapping; these do not establish negative quercetin results.
- id: PMID:42151135
  title: Nicotine biosynthesis is completed by cryptic activating glucosylation.
  findings:
  - statement: The purified tobacco UGT1 enzyme N-glucosylates nicotinic acid and participates in the
      reconstituted nicotine biosynthesis cascade. Supplementary sequences explicitly identify the assayed
      homolog.
    supporting_text: 'producing nicotinic acid N-glucoside ( 10)

      from nicotinic acid ( 2) and UDP-glucose'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identifier/title and publisher full text verified; original supplementary Data1/Data4
      give the exact tobacco locus/accession and assayed sequence. Ortholog evidence, not a direct assay
      of the NICAT 485-aa protein.
- id: PMID:41928514
  title: Complete biosynthesis of nicotine.
  findings:
  - statement: The independent N. attenuata study biochemically assays NaUGT1 and disrupts its locus;
      primary supplemental primers link those assays to g26396, with an N-terminal construct extension
      documented in the identity analysis.
    supporting_text: Abrogating any of these components depletes nicotine accumulations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity verified. Cached abstract supplemented by independently read author-hosted
      in-press/final full PDFs and actual supplemental primers. Figure3D recombinant assay and Figure3E/F
      genetic tests are mapped to g26396 by reproducible genomic/primer comparison; exact whole expression-construct
      sequence was not separately deposited in retrieved materials.
