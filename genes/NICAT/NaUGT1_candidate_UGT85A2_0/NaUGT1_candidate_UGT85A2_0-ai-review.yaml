  label: Nicotiana attenuata
description: NaUGT1 (g26396, annotated UGT85A2_0) is a Nicotiana attenuata family-1 UDP-glycosyltransferase
  that N-glucosylates nicotinic acid. This reaction activates the pyridine precursor for nicotine biosynthesis,
  supplying nicotinic acid N-glucoside to the A622 reductase and subsequent scaffold-forming reactions.
  Biochemical pathway reconstruction and genetic disruption support its contribution to nicotine production.
  The physiological roles of possible alternative acceptor substrates remain unresolved.
