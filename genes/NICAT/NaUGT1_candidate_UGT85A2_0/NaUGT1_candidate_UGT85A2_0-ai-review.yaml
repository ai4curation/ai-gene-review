suggested_questions:
- question: Does the 45-residue N-terminal extension specified by the Cell 2026 cloning primers represent
    the dominant native g26396 protein, a corrected gene model, or a construct-specific choice? What activity
    does the isolated 485-aa A0A2H4GSI3 form retain?
- question: Does NaUGT1 also glucosylate quercetin or 7-deoxyloganetic acid under physiological conditions,
    and how selective is it for nicotinate relative to these acceptors?
suggested_experiments:
- description: Compare the primer-compatible 530-aa construct and the 485-aa database form with nicotinate,
    quercetin and 7-deoxyloganetic acid, using product-resolved assays and matched protein amounts.
  experiment_type: comparative biochemical substrate assay
  hypothesis: The mapped gene product catalyzes nicotinate N-glucosylation; N-terminal sequence and alternative-acceptor
    contributions remain unresolved.
- description: Resolve the endogenous g26396 translation start with transcript-boundary sequencing and
    N-terminal proteomics in induced roots.
  experiment_type: gene-model and isoform verification
  hypothesis: The published cloning primers identify an upstream initiation site whose native usage has
    not been established by the retrieved assays.
