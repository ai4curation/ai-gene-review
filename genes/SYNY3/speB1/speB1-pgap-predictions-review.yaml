description: >-
  NCBI PGAP names WP_010871340.1 "N(1)-aminopropylagmatine ureohydrolase" using
  BlastRule NBR017633 and assigns EC 3.5.3.24 and no GO terms. The name and EC
  are correct: they match the activity demonstrated for the purified enzyme
  (APA to spermidine plus urea) and UniProt's experimentally supported EC. They
  are not novel, because the WP_ record is identical to the reviewed P72703 and
  cites the characterising paper, so the rule very likely reflects this protein.
  The earlier genome record (RS_2026_01_07) instead carried the two GO terms of
  the NCBIfam TIGR01230 agmatinase equivalog, which the newer WP_ record has
  dropped. One is GO:0008783 agmatinase activity, a paralog over-annotation:
  purified SpeB1 releases no urea from agmatine, and APAUH proteins form a clade
  separate from agmatinases. The other is GO:0008295 spermidine biosynthetic
  process, which is correct and already in UniProt/GOA, although TIGR01230
  implies the wrong route to it (agmatine to putrescine). Moving from
  TIGR01230-derived GO to the NBR017633 name and EC therefore fixed a wrong
  molecular function, at the cost of losing the correct process term, because
  the BlastRule carries no GO.
