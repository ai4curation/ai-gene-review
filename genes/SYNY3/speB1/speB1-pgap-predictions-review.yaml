  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0008783
    label: agmatinase activity
  predicted_term_type: GO_MF
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Incorrect. The genome record's GO comes from NCBIfam TIGR01230, an
      "agmatinase" equivalog (EC 3.5.3.11). That model's scope includes the
      aminopropylagmatine ureohydrolase (APAUH) subfamily, to which SpeB1
      belongs. APAUH proteins form a clade separate from agmatinases. Purified
      SpeB1 releases no measurable urea from agmatine and produces no putrescine
      from it, and the orthologous Thermus SpeB homologue likewise does not act
      on agmatine. The model fails to separate APAUH from true agmatinases
      within the same family, which is a paralog-subfamily error. The newer WP_
      record, named from NBR017633, rightly omits the term.
    supported_by:
    - reference_id: file:SYNY3/speB1/speB1-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: 'product_name: agmatinase'
    - reference_id: PMID:37878710
      supporting_text: >-
        The APAUH is highly specific to APA and incapable of releasing measurable
        urea from CAPA, agmatine, arginine, guanidine, guanidinobutyrate, and
        guanidinopropionate
    - reference_id: PMID:37878710
      supporting_text: >-
