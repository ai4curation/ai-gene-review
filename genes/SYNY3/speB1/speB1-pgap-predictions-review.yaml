- source_method: NCBI PGAP
  source_version: GCF_000009725.1-RS_2026_01_07 genome record (GO absent from the
    newer WP_ record); TIGR01230 agmatinase equivalog GO
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0008295
    label: spermidine biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct but not novel. SpeB1 catalyses the final step of spermidine
      synthesis by the CAPA pathway. Its deletion abolishes spermidine, and
      complementation restores it. UniProt and GOA already carry this process
      for P72703. The right term comes from the wrong model logic, though:
      TIGR01230 implies agmatine hydrolysis to putrescine, a spermidine
      precursor, whereas SpeB1 makes spermidine directly from APA and the CAPA
      route bypasses putrescine. The newer WP_ record lost this correct term
      because the naming BlastRule carries no GO.
    supported_by:
    - reference_id: PMID:37878710
      supporting_text: >-
        Complementation of the individual gene-deletion mutants by expressing the
        respective genes fully restored the spermidine biosynthesis
    - reference_id: PMID:37878710
      supporting_text: >-
        The CAPA pathway does not involve putrescine and uses ASA rather than
        decarboxylated AdoMet as the aminopropyl group donor
    - reference_id: file:SYNY3/speB1/speB1-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: GO:0008295
