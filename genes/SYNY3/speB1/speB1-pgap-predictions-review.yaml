    summary: >-
      Correct. EC 3.5.3.24 (N1-aminopropylagmatine ureohydrolase) comes from
      BlastRule NBR017633. It is the activity shown for purified Sll0228, which
      converts APA completely to spermidine and urea with kcat 70.8 per second.
