id: P72703
gene_symbol: speB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: >-
  SpeB1 (sll0228) is a manganese-dependent ureohydrolase of the arginase family
  that catalyses the last step of spermidine biosynthesis in Synechocystis sp.
  PCC 6803. It hydrolyses N1-(3-aminopropyl)agmatine (APA) to spermidine and
  urea (EC 3.5.3.24), completing the carboxyaminopropylagmatine (CAPA) pathway
  in which agmatine is condensed with aspartate semialdehyde to CAPA, CAPA is
  decarboxylated to APA, and APA is hydrolysed to spermidine. This route does
  not pass through putrescine. Deletion of speB1 abolishes spermidine and causes
  APA to accumulate. The purified enzyme binds Mn2+, has a kcat of about 71 per
  second and a Km of 1.78 mM for APA, and releases no detectable urea from
  agmatine, arginine, CAPA, guanidine or guanidino acids. APAUH proteins form a
  clade distinct from agmatinases and arginases within the ureohydrolase
  superfamily, and two residues (Glu60 from the neighbouring subunit, and Arg151)
  that bind the aminopropyl moiety of APA are conserved only in this clade.
  Although an earlier extract study assigned an agmatinase activity to sll0228,
  the enzyme is not an agmatinase.
