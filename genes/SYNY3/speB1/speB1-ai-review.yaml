- id: PMID:37878710
  title: A bacterial spermidine biosynthetic pathway via carboxyaminopropylagmatine.
  findings:
  - statement: >-
      Sll0228 (SpeB1) is an APA ureohydrolase that converts N1-aminopropylagmatine
      to spermidine and urea, the last step of the CAPA spermidine pathway.
    supporting_text: >-
      Thus, through genetic and biochemical characterization, we propose that
      Sll0228 is an APAUH.
  - statement: >-
      Purified APAUH does not hydrolyse agmatine, arginine, CAPA or guanidino
      compounds.
    supporting_text: >-
      The APAUH is highly specific to APA and incapable of releasing measurable
      urea from CAPA, agmatine, arginine, guanidine, guanidinobutyrate, and
      guanidinopropionate
  - statement: >-
      Residues E60 and R151, which bind the aminopropyl moiety of APA, are
      specific to APAUH orthologues.
    supporting_text: E60 and R151 are only conserved in the APAUH orthologs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC10599626). Primary characterization of SpeB1 by gene
      deletion, complementation, purified-enzyme assays, kinetics and
      mutagenesis.
- id: PMID:10648527
  title: Arginine catabolism in the cyanobacterium Synechocystis sp. Strain PCC 6803
    involves the urea cycle and arginase pathway.
  findings:
  - statement: >-
      An sll0228 insertion mutant retains wild-type arginase activity, which
      shows that sll0228 does not encode the arginase.
    supporting_text: >-
      exhibited arginase activities, as determined in cell extracts, identical to
      that found in the wild-type strain
  - statement: >-
      The authors concluded that sll0228 encodes an agmatinase, because a trace
      agmatinase activity in crude extracts was absent from the mutant.
    supporting_text: >-
      ORF sll0228 clearly encodes an agmatinase and, therefore, represents an speB
      gene
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:37878710
      supported_by:
      - reference_id: PMID:37878710
        supporting_text: >-
          The APAUH is highly specific to APA and incapable of releasing
          measurable urea from CAPA, agmatine, arginine, guanidine,
          guanidinobutyrate, and guanidinopropionate
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Full text read. It shows correctly that sll0228 is not the arginase. Its
      conclusion that sll0228 "clearly encodes an agmatinase" rests on a trace
      extract activity (about 0.28 nmol/min/mg). It predates the discovery of
      the CAPA/APA pathway, and the 2023 purified-enzyme data contradict it.
