  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006035
  - InterPro:IPR020855
  review:
    summary: >-
      InterPro2GO assignment from ureohydrolase signatures. Like other arginase
      family members, SpeB1 has a binuclear manganese centre. The purified
      enzyme contained 1.34 Mn2+ per subunit, and the Mn ligands are conserved.
    action: MODIFY
    reason: >-
      This is correct but general. The metal is known to be manganese, both from
      measurement on the purified protein and from the conserved binuclear Mn
      site of the family (PROSITE PRU00742). The specific descendant
      GO:0030145 manganese ion binding is supported. Mn2+ is a catalytic
      cofactor here, so the term is peripheral to the core activity annotation.
