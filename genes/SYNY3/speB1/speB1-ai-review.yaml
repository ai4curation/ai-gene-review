    Manganese-dependent N1-aminopropylagmatine ureohydrolase. It hydrolyses APA
    to spermidine and urea as the final step of the agmatine/aspartate
    semialdehyde (CAPA) spermidine biosynthesis pathway in Synechocystis, and it
    is required for cellular spermidine. It is specific for APA and does not
    hydrolyse agmatine or arginine.
