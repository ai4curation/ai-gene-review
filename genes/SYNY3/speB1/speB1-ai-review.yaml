suggested_questions:
- question: >-
    Should a NOT|enables GO:0008783 agmatinase activity annotation be made for
    P72703 from PMID:37878710 (no urea from agmatine, no putrescine)? That would
    block the PTN000144486 agmatinase IBA, and PAINT could add a loss or
    divergence event at the node that founds the APAUH clade.
- question: >-
    What explains the trace agmatine-dependent urea release in wild-type extracts
    that was absent from the sll0228 mutant (PMID:10648527)? Possibilities are a
    minor activity of SpeB1 below the 2023 detection limit, or an indirect
    agmatine-to-APA-to-urea flux through CAPADH and CAPADC in the extract.
- question: >-
    Should the NCBIfam TIGR01230 "agmatinase" equivalog be split so that the
    APAUH clade (E60/R151 signature) gets its own model, carrying EC 3.5.3.24 and
    GO:0043920 rather than EC 3.5.3.11 and GO:0008783?
suggested_experiments:
- description: >-
    Assay purified SpeB1 with high agmatine (up to 50 mM) by a sensitive
    urea/putrescine LC-MS assay to set an upper bound on kcat/Km for agmatine
    relative to APA. Repeat the Quintero et al. extract assay with the
    Delta-slr0049 and Delta-sll0873 mutants to test whether the extract
    "agmatinase" signal requires the upstream CAPA enzymes.
  experiment_type: Enzyme kinetics and genetic epistasis
  hypothesis: >-
    SpeB1 has no physiologically meaningful agmatinase activity, and the extract
    signal reported in 2000 came from coupled CAPA-pathway flux.
- description: >-
    Swap E60 and R151 of SpeB1 for the residues found at the equivalent
    positions in E. coli SpeB, and test whether the variants gain agmatinase
    activity.
  experiment_type: Site-directed mutagenesis and substrate-specificity assay
  hypothesis: >-
    E60 and R151 determine APA versus agmatine specificity in the ureohydrolase
    superfamily.
