- term:
    id: GO:0008783
    label: agmatinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G08870
  - AGI_LocusCode:AT4G08900
  - CGD:CAL0000194495
  - PANTHER:PTN000144486
  - UniProtKB:P60651
  - UniProtKB:Q57757
  - UniProtKB:Q5JI38
  review:
    summary: >-
      PAINT places agmatinase activity at PTN000144486, a broad
      arginase/agmatinase family node. Its experimental donors include E. coli
      SpeB (P60651) and Arabidopsis arginases. SpeB1 falls in the
      aminopropylagmatine ureohydrolase (APAUH) clade, and the purified protein
      does not hydrolyse agmatine.
    action: REMOVE
    reason: >-
      The target has direct evidence that it lacks this activity. Purified SpeB1
      released no measurable urea from agmatine and made no putrescine from it,
      but converted APA to spermidine completely. Phylogenetic analysis places
      APAUH and its orthologues in a clade separate from agmatinases. The
      orthologous Thermus SpeB homologue likewise hydrolyses APA but not
      agmatine. The function annotated at the PTN node was therefore not
      retained in this lineage: the substrate shifted from agmatine to APA. This
      is a paralog-type over-annotation, in which an agmatinase-like fold has a
      different substrate. An earlier crude-extract study (PMID:10648527) linked
      a trace "agmatinase" activity to sll0228. It predates the discovery of APA
      in Synechocystis and did not test the purified protein, so the 2023
      purified-enzyme data take precedence. The correct activity is captured by
      GO:0043920.
    supported_by:
    - reference_id: PMID:37878710
      supporting_text: >-
        The APAUH is highly specific to APA and incapable of releasing measurable
        urea from CAPA, agmatine, arginine, guanidine, guanidinobutyrate, and
        guanidinopropionate
    - reference_id: PMID:37878710
      supporting_text: >-
        Putrescine was not detectable in the assay mixture containing the APAUH
        and agmatine
    - reference_id: PMID:37878710
      supporting_text: >-
        Phylogenetic analysis revealed that APAUH and its orthologs are clustered
        as a separate group from arginase and agmatine ureohydrolase and form a
        distinct clade within the ureohydrolase superfamily
    - reference_id: PMID:15983049
      supporting_text: >-
        the enzyme hydrolyzes N1-aminopropylagmatine to spermidine but does not act
        on agmatine
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000144486
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A broad arginase/agmatinase node that also founds the APAUH clade.
          Agmatinase is correct for the agmatinase donors, but the APAUH clade
          changed its substrate to N1-aminopropylagmatine.
      - source_id: UniProtKB:P60651
        source_label: E. coli SpeB agmatinase
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Bona fide agmatinase, but it is in a different subfamily from the APAUH
          clade that contains SpeB1.
- term:
    id: GO:0009446
    label: putrescine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT4G08870
  - AGI_LocusCode:AT4G08900
  - PANTHER:PTN000144486
  review:
    summary: >-
      This IBA follows from the same agmatinase/arginase family node, at which
      agmatine or arginine hydrolysis yields putrescine or ornithine. SpeB1
      neither consumes agmatine nor produces putrescine, and the CAPA pathway it
      completes bypasses putrescine entirely.
    action: REMOVE
    reason: >-
      Putrescine is neither a substrate nor a product of SpeB1. The purified
      enzyme produces no putrescine from agmatine, and the CAPA spermidine route
      in Synechocystis does not involve putrescine. The annotation comes from
      the same propagation that wrongly assigns agmatinase activity, and it is
      contradicted on biological grounds for this enzyme.
    supported_by:
    - reference_id: PMID:37878710
      supporting_text: >-
        Putrescine was not detectable in the assay mixture containing the APAUH
        and agmatine
    - reference_id: PMID:37878710
      supporting_text: >-
        The CAPA pathway does not involve putrescine and uses ASA rather than
        decarboxylated AdoMet as the aminopropyl group donor
    propagation_review:
