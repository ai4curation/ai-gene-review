id: P80505
gene_symbol: gap2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: >-
  Gap2 (sll1342) is the photosynthetic, phosphorylating glyceraldehyde-3-phosphate dehydrogenase
  (GAPDH, EC 1.2.1.59) of the cyanobacterium Synechocystis sp. PCC 6803. It is a cytoplasmic
  homotetramer of 337-residue subunits that belongs to the type I GAPDH family and is most similar to
  the chloroplast GAPDH of plants, whereas its paralog Gap1 (slr0884) resembles plant cytosolic GAPDH.
  Gap2 uses both NADPH and NADH, and in vivo works mainly in the reductive (anabolic) direction,
  reducing 1,3-bisphosphoglycerate to glyceraldehyde 3-phosphate. It catalyses this step in the
  Calvin-Benson-Bassham (reductive pentose-phosphate) cycle in the light and in gluconeogenesis.
  gap2 insertion mutants cannot grow photoautotrophically or on organic acids but still grow on
  glucose, whereas gap1 mutants show the reciprocal phenotype; Gap1 is the NAD-specific glycolytic
  enzyme. In the dark or under oxidizing conditions Gap2 is held inactive in a CP12-mediated ternary
  complex with phosphoribulokinase. NADPH and reducing conditions release it from this complex in the
  light.
