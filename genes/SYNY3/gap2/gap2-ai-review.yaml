    review_notes: Abstract-only cache. Primary characterization of Gap2 (sll1342); source of the EXP
      annotations and of the UniProt catalytic-activity lines.
- id: PMID:9484473
  title: Genetic and biochemical evidence for distinct key functions of two highly divergent GAPDH
    genes in catabolic and anabolic carbon flow of the cyanobacterium Synechocystis sp. PCC 6803.
  findings:
  - statement: gap2 mutants cannot grow photoautotrophically or on organic acids, but grow on glucose;
      Gap2 functions in the Calvin cycle and gluconeogenesis, Gap1 in glycolysis.
    supporting_text: While Gap2 operates in the photosynthetic Calvin cycle and in non-photosynthetic
      gluconeogenesis, Gap1 seems to be essential only for glycolytic glucose breakdown
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Gene inactivation study of gap1 and gap2 in Synechocystis PCC
      6803; defines the anabolic versus catabolic division of labour between the paralogs.
- id: PMID:9689144
  title: Evolutionary conserved light regulation of Calvin cycle activity by NADPH-mediated reversible
    phosphoribulokinase/CP12/ glyceraldehyde-3-phosphate dehydrogenase complex dissociation.
