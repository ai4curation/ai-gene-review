suggested_questions:
- question: Does Gap2 contribute significant catabolic (glycolytic) flux in vivo under mixotrophic
    or heterotrophic conditions, or is its oxidative activity fully repressed (by CP12 or by the
    low-molecular-weight inhibitor reported by Koksharova et al.)?
- question: Is the NAD-dependent activity of Gap2 physiologically relevant in vivo, or does NADPH
    dominate under all conditions where Gap2 is active?
- question: Should GO represent Gap2's CP12-dependent inactivation, for example as membership of a
    PRK/CP12/GAPDH complex term, which no current annotation captures?
suggested_experiments:
- hypothesis: Gap2 carries glycolytic flux in a gap1 background under mixotrophic conditions.
  description: Use 13C-glucose labelling and metabolic flux analysis in wild type, a gap1 mutant and
    a gap1 mutant expressing a CP12-insensitive Gap2, to measure oxidative GAPDH flux attributable to
    Gap2.
- hypothesis: The ratio of NADPH to NADH use by Gap2 in vivo changes with light intensity.
  description: Express cofactor-specificity variants of Gap2 (NADP-only and NAD-only, by mutating the
    residues that bind the adenosine 2'-phosphate) in a gap2 background and compare photoautotrophic
    growth and CBB-cycle intermediate pools.
