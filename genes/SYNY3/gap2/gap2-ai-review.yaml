- term:
    id: GO:0019253
    label: reductive pentose-phosphate cycle
  evidence_type: IMP
  original_reference_id: PMID:9484473
  qualifier: involved_in
  review:
    summary: gap2 insertion mutants cannot survive photoautotrophically, and Gap2 is the major anabolic
      (1,3-bisphosphoglycerate-reducing) GAPDH in Synechocystis extracts.
    action: NEW
    reason: >-
      Participation test: Gap2 itself catalyses the reduction of 1,3-bisphosphoglycerate to
      glyceraldehyde 3-phosphate with NADPH, one of the steps of the Calvin-Benson-Bassham cycle. Its
      role is therefore catalytic and not just necessity. The mutant phenotype (no photoautotrophic
      growth) and the activity measurements in mutant extracts identify Gap2, not Gap1, as the
      isoenzyme that performs this step. Comparator check: in QuickGO, the plant chloroplast GAPDH
      subunits GAPA1 and GAPB (P25856, P25857) and the other CBB-cycle enzymes of cyanobacteria (PRK,
      RbcL/S, FBPase) carry GO:0019253. The term is not an ancestor or descendant of any other term
      on Gap2.
    supported_by:
    - reference_id: PMID:9484473
      supporting_text: Under dim light they only grow on glucose but not on organic acids nor do they survive
        under photosynthetic conditions.
    - reference_id: PMID:9484473
      supporting_text: While Gap2 operates in the photosynthetic Calvin cycle and in non-photosynthetic
        gluconeogenesis
    - reference_id: PMID:39036361
      supporting_text: Therefore, GapDH2 is mainly part of the CBB cycle, in which it reduces G1,3BP using
        photosynthetic NADPH
