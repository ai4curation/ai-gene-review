  label: Synechocystis sp. PCC 6803 substr. Kazusa
status: COMPLETE
locus_tag: sll1342
description: >-
  NCBI PGAP names WP_010874115.1 (Gap2, sll1342) with the NCBIfam equivalog NF005641.0 (PRK07403,
  "type I glyceraldehyde-3-phosphate dehydrogenase"), which supplies the product name and EC 1.2.1.-
  but no GO terms. PGAP passes on GO only from the naming model, so the protein receives no GO
  annotation at all. The second matching equivalog, TIGR01534, has the same product name and maps
  GO:0006006, GO:0016620, GO:0050661 and GO:0051287, but its GO is discarded because it was not the
  naming model. The single PGAP prediction, EC 1.2.1.-, is correct but less precise than the
  experimentally supported EC 1.2.1.59 (NAD(P)-dependent phosphorylating GAPDH) curated in UniProt
  from PMID:9226260. Neither PGAP model distinguishes the NADP-using Calvin-cycle Gap2 from the
  NAD-specific glycolytic Gap1, although EC 1.2.1.59 could be assigned at the cyanobacterial/plastid
  Gap2-subfamily level.
