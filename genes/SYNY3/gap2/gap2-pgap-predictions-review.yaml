predictions:
- source_method: NCBI PGAP
  source_version: GCF_000009725.1-RS_2026_01_07 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: EC:1.2.1.-
    label: EC 1.2.1.-
  predicted_term_type: EC
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      EC 1.2.1.- (oxidoreductase acting on aldehydes, NAD+ or NADP+ acceptor) is correct for Gap2 but
      less precise than its known activity. Purified native and recombinant Gap2 catalyse the
      phosphorylating oxidation of glyceraldehyde 3-phosphate with either NAD+ or NADP+, which is EC
      1.2.1.59, and UniProt curates both reactions with experimental evidence. The incomplete EC comes
      from the naming model NF005641, which carries EC 1.2.1.- because the type I GAPDH family includes
      NAD-specific (EC 1.2.1.12), NADP-specific (EC 1.2.1.13) and dual-specificity (EC 1.2.1.59)
      members. No error type applies, because the prediction is not wrong, only underspecified.
    supported_by:
    - reference_id: file:SYNY3/gap2/gap2-pgap-prediction-evidence/WP_010874115.1.gp
      supporting_text: /EC_number="1.2.1.-"
    - reference_id: file:SYNY3/gap2/gap2-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: 'WP_010874115.1: HMM:NF005641.0'
    - reference_id: file:SYNY3/gap2/gap2-uniprot.txt
      supporting_text: EC=1.2.1.59 {ECO:0000269|PubMed:9226260};
    - reference_id: file:SYNY3/gap2/gap2-uniprot.txt
      supporting_text: can use both NADP and NAD. {ECO:0000269|PubMed:9226260}.
    - reference_id: PMID:9226260
      supporting_text: The recombinant GAPDH2 showed the dual pyridine nucleotide specificity characteristic
        of the native cyanobacterial enzyme
