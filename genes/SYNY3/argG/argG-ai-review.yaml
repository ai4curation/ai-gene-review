taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: ArgG (Slr0585) is a soluble argininosuccinate synthetase in Synechocystis sp. PCC 6803. It
  uses ATP to condense citrulline with aspartate, producing argininosuccinate for arginine synthesis.
  Purified enzyme is inhibited by arginine, and overexpression affects growth and metabolite pools under
  defined nitrogen-source conditions. Thioredoxin trapping identifies ArgG as an interaction candidate,
  while direct thioredoxin-dependent regulation of its catalytic activity remains distinct from that observation.
