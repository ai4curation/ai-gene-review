  - UniProtKB:P00966
  review:
    summary: ArgG certainly synthesizes argininosuccinate, but GO:0000050 specifically requires a urea-producing
      cycle.
    action: UNDECIDED
    reason: ArgG certainly synthesizes argininosuccinate, but GO:0000050 specifically requires a urea-producing
      cycle. Early native tracer work proposed such a cycle (PMID:10648527); later studies identify an
      ArgZ-dependent ornithine-ammonia cycle, releasing ammonia and CO2 rather than urea (PMID:29632414;
      PMID:31914412). Shared ArgG chemistry does not distinguish these routes, and available evidence
      does not settle whether a parallel urea-producing route supports the PAINT assignment.
    supported_by:
    - reference_id: PMID:31914412
      supporting_text: ArgZ-catalyzed conversion of arginine to ornithine, ammonia, and carbon dioxide
    propagation_review:
