        comment: Argininosuccinate synthesis is conserved, but historical native urea-cycle interpretation
          and later ArgZ ornithine-ammonia chemistry differ at the cycle output. The available target
          evidence does not resolve whether a parallel urea-producing route warrants propagation of this
