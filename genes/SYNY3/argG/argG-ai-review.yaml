id: P77973
gene_symbol: argG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: ArgG (Slr0585) is a soluble argininosuccinate synthetase in Synechocystis sp. PCC 6803. It
  uses ATP to condense citrulline with aspartate, producing argininosuccinate for arginine synthesis.
  Purified enzyme is inhibited by arginine, and overexpression affects growth and metabolite pools under
  defined nitrogen-source conditions. Thioredoxin trapping identifies ArgG as an interaction candidate,
  while direct thioredoxin-dependent regulation of its catalytic activity remains distinct from that observation.
existing_annotations:
- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000172504
  - RGD:2163
  - UniProtKB:P00966
  review:
    summary: ArgG synthesizes argininosuccinate in Synechocystis, but the native cycle that recycles arginine
      to ornithine releases ammonia via ArgZ rather than urea, so the urea-cycle term over-states the target
      pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0000050 is defined as "The sequence of reactions by which arginine is synthesized from ornithine,
      then cleaved to yield urea and regenerate ornithine." ArgG supplies the argininosuccinate step common
      to that cycle and to arginine biosynthesis. The early native tracer work (PMID:10648527) inferred an
      arginase step from labelling kinetics ("suggesting that the reaction of arginase...") without identifying
      an arginase enzyme, whereas later work identified the cyanobacterial ornithine-ammonia cycle, whose
      arginine-to-ornithine step is the ArgZ arginine dihydrolase releasing ammonia (PMID:29632414; PMID:31914412).
      The PAINT node correctly carries argininosuccinate synthesis, but the urea-producing closure is not
      established for this target. This is treated the same way as the KT2440 ArgG urea-cycle row (MARK_AS_OVER_ANNOTATED),
      and differs from the yeast ARG1 row, where a native arginase closes the cycle.
    supported_by:
    - reference_id: PMID:29632414
      supporting_text: ends with conversion of arginine to ornithine and ammonia by a novel arginine dihydrolase
    - reference_id: PMID:31914412
      supporting_text: ArgZ-catalyzed conversion of arginine to ornithine, ammonia, and carbon dioxide
    - reference_id: PMID:10648527
      supporting_text: suggesting that the reaction of arginase, rendering ornithine and urea, is the main
        initial step in arginine catabolism
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000172504
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node's argininosuccinate synthase activity and arginine biosynthesis transfer to Synechocystis
          ArgG. Its urea-cycle process holds for donors with a urea-producing arginase (the rat and human
          ASS1 donors), but the target organism's characterized arginine-to-ornithine step is ArgZ, which
          releases ammonia. This is a pathway-context issue, not donor-count criticism.
