- term:
    id: GO:0103012
    label: ferredoxin-thioredoxin reductase activity
  evidence_type: IDA
  original_reference_id: PMID:10649999
  qualifier: enables
  review:
    summary: Ferredoxin-thioredoxin reductase activity of the Synechocystis FTR heterodimer, of which
      FtrC is the catalytic chain.
    action: ACCEPT
    reason: Core function. The Synechocystis enzyme is the reference FTR for structural and mechanistic
      work. FtrC carries the [4Fe-4S] cluster, the redox-active Cys58-Cys88 disulfide (literature Cys57/Cys87)
      and His87, and mutation of either active-site cysteine abolishes activity. Ferredoxin and thioredoxin
      bind only the catalytic subunit. The activity is measured on the heterodimer, but because every
      catalytic element is on FtrC, enables (rather than contributes_to) is appropriate for this subunit;
      contributes_to would fit the variable subunit FtrV.
    supported_by:
    - reference_id: PMID:10649999
      supporting_text: The thin, flat FTR molecule makes the two-electron reduction possible by forming
        on one side a mixed disulfide with thioredoxin and by providing on the opposite side access to
        ferredoxin for delivering electrons.
    - reference_id: file:SYNY3/ftrC/ftrC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalytic subunit of the ferredoxin-thioredoxin reductase
    - reference_id: PMID:35453339
      supporting_text: FTR is a heterodimeric enzyme composed of an approximately 13 kDa catalytic subunit
        (FTRC), which contains a 4Fe-4S cluster and a redox-active site
