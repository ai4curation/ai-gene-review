- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IDA
  original_reference_id: PMID:14769790
  qualifier: enables
  review:
    summary: Electron transfer from ferredoxin through the FTR [4Fe-4S] cluster to the thioredoxin disulfide.
    action: MODIFY
    reason: 'The electron flow these papers describe is the catalytic reaction of FTR: two one-electron
      transfers from ferredoxin reduce the active-site disulfide and then thioredoxin. GO:0009055 describes
      electron carriers such as ferredoxin itself; for an enzyme the informative term is the specific
      oxidoreductase activity, GO:0103012, which the gene already carries by IDA from the same papers.
      The evidence is sound; only the term is replaced.'
    proposed_replacement_terms:
    - *id001
    supported_by:
    - reference_id: PMID:14769790
      supporting_text: It catalyzes the two-electron reduction of the disulfide of thioredoxins with electrons
        from ferredoxin involving a 4Fe-4S cluster and an adjacent active-site disulfide.
