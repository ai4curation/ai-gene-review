id: Q55389
gene_symbol: ftrC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: 'ftrC (sll0554) encodes the 118-residue catalytic chain (FTR-C, also called FTR-B) of ferredoxin:thioredoxin
  reductase (FTR, EC 1.8.7.2) in the cyanobacterium Synechocystis sp. PCC 6803. FTR is a thin, disk-shaped
  heterodimer of FtrC and the variable subunit FtrV (ssr0330). It reduces the disulfide of thioredoxins
  with two electrons, taken one at a time from photosystem I-reduced plant-type [2Fe-2S] ferredoxin. All
  of the redox chemistry is on FtrC: a [4Fe-4S] cluster (ligated by Cys56, Cys75, Cys77 and Cys86) sits
  next to a redox-active Cys58-Cys88 disulfide. Ferredoxin docks on one face of the disk and thioredoxin
  on the other. After one electron arrives, Cys58 attacks the thioredoxin disulfide to form a mixed-disulfide
  intermediate, and Cys88 becomes a fifth ligand to one cluster iron. His87 assists with protonation and
  keeps the cluster-interacting thiol in place. A second electron then releases reduced thioredoxin. The
  Synechocystis enzyme is the structural and mechanistic model for FTRs from cyanobacteria and chloroplasts,
  with crystal structures of the oxidized enzyme, both reduced intermediates, and the binary and ternary
  complexes with ferredoxin and thioredoxin. In vivo, FTR links light to thioredoxin-dependent redox regulation.
  ftrC expression falls in the dark and when photosynthetic electron transport is inhibited, and disruption
  studies point to the FTR-Trx pathway being more important for growth-rate control, while NADPH-thioredoxin
  reductase serves antioxidant functions.'
