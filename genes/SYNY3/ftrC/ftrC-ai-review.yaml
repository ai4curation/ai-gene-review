- term:
    id: GO:0015979
    label: photosynthesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005069401
  - UniProtKB:Q55389
  review:
    summary: Phylogenetic inference of involvement in photosynthesis from the FTR catalytic chain family
      (PTHR35113).
    action: KEEP_AS_NON_CORE
    reason: FTR transmits the light signal from photosystem I-reduced ferredoxin to thioredoxins, which
      regulate photosynthetic carbon metabolism, so placing the family under photosynthesis is reasonable.
      The role is regulatory and peripheral to the reactions of photosynthesis themselves, and no more
      specific process term is supported by direct evidence for Synechocystis FtrC. Q55389 appearing in
      its own WITH/FROM is expected.
    supported_by:
    - reference_id: PMID:17611542
      supporting_text: Electrons are shuttled from photosystem I by means of ferredoxin (Fdx) to ferredoxin-thioredoxin
        reductase (FTR), which catalyses the two-electron-reduction of chloroplast thioredoxins (Trxs).
    - reference_id: PMID:17611542
      supporting_text: Oxygen-evolving photosynthetic organisms regulate carbon metabolism through a light-dependent
        redox signalling pathway.
- term:
    id: GO:0015979
    label: photosynthesis
  evidence_type: IEP
  original_reference_id: PMID:19825613
  qualifier: involved_in
  review:
    summary: ftrC expression depends on photosynthetic conditions (decreased in darkness and by DCMU/DBMIB).
    action: KEEP_AS_NON_CORE
    reason: Expression pattern evidence alone is weak support for process involvement, but it agrees with
      the IBA row and with the known light-signalling role of FTR. Kept as non-core, consistent with the
      IBA row on the same term.
    supported_by:
    - reference_id: PMID:19825613
      supporting_text: Experiments of light-dark transition indicate that the expression of all these
        genes except trxQ decreases in the dark in the absence of glucose in the growth medium.
