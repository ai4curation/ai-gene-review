core_functions:
- description: Catalytic subunit of ferredoxin:thioredoxin reductase. Uses a [4Fe-4S] cluster and an adjacent
    redox-active disulfide to reduce thioredoxin disulfides with two electrons supplied one at a time
    by reduced [2Fe-2S] ferredoxin, converting the photosynthetic light signal into a thiol signal.
  molecular_function:
    id: GO:0103012
    label: ferredoxin-thioredoxin reductase activity
  supported_by:
  - reference_id: PMID:14769790
    supporting_text: It catalyzes the two-electron reduction of the disulfide of thioredoxins with electrons
      from ferredoxin involving a 4Fe-4S cluster and an adjacent active-site disulfide.
  - reference_id: PMID:17611542
    supporting_text: FTR is unique in its use of a [4Fe-4S] cluster and a proximal disulphide bridge in
      the conversion of a light signal into a thiol signal.
  - reference_id: PMID:35453339
    supporting_text: Crystallographic structures showed that ferredoxin (Fd) and Trxs interact exclusively
      with the catalytic subunit of FTR [19,20,21].
proposed_new_terms: []
suggested_questions:
- question: Should the FTR catalytic chain be annotated with enables and the variable chain FtrV (Q55781)
    with contributes_to GO:0103012? FtrV currently has no molecular function annotation in GOA apart from
    protein binding.
- question: GO:0030386 ferredoxin-thioredoxin reductase complex has a taxon constraint that admits Cyanobacteria
    but also a part_of chloroplast axiom, and has no annotations. Should the chloroplast axiom be removed
    so that the well-characterized cyanobacterial FTR heterodimer can be annotated to the complex?
- question: Which Synechocystis thioredoxins (TrxA/m, TrxB/x, TrxC, TrxQ/y) does FTR reduce in vivo, and
    which target enzymes depend on the FTR route rather than on NTR?
suggested_experiments:
- hypothesis: FtrC alone is catalytically competent but unstable, and FtrV mainly protects the [4Fe-4S]
    cluster from oxidative damage.
  description: Express FtrC with and without FtrV, measure cluster content, oxygen sensitivity and ferredoxin-dependent
    thioredoxin reduction, to establish whether the variable subunit takes part in catalysis or only stabilises
    the enzyme.
- hypothesis: The FTR-Trx pathway controls specific Calvin-cycle and carbon-metabolism enzymes in Synechocystis
    under light/dark transitions.
  description: Use a conditional ftrC knockdown with redox proteomics (thiol trapping) across light/dark
    transitions to identify thioredoxin targets whose reduction depends on FTR.
