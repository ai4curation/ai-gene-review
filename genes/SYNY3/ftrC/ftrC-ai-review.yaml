- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IDA
  original_reference_id: PMID:10649999
  qualifier: enables
  review:
    summary: FtrC binds one [4Fe-4S] cluster, coordinated by Cys56, Cys75, Cys77 and Cys86.
    action: ACCEPT
    reason: Shown by crystallography and EPR, Mossbauer, resonance Raman and MCD spectroscopy on the Synechocystis
      enzyme. The cluster is the electron entry point and interacts directly with the active-site disulfide,
      so cofactor binding is integral to the catalytic mechanism.
    supported_by:
    - reference_id: PMID:10649999
      supporting_text: FTR, the key electron/thiol transducer enzyme in this pathway, is unique in that
        it can reduce disulfides by an iron-sulfur cluster
