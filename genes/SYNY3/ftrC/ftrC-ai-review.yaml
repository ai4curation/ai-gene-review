  review:
    summary: InterPro2GO mapping from the FTR catalytic beta chain signatures.
    action: MODIFY
    reason: 'Correct but general: ferredoxin, an iron-sulfur protein, is the physiological electron donor
      of FTR. The specific activity is GO:0103012, which the gene carries by IDA. In GO, GO:0103012 sits
      under GO:0016673 (iron-sulfur protein as acceptor, following the EC direction) rather than under
      GO:0016730, so this row is not formally redundant and is replaced rather than marked TOO_GENERAL.'
