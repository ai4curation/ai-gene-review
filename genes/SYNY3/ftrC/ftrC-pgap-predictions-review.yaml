description: >-
  NCBI PGAP makes no GO or EC prediction for WP_010873706.1 (FtrC, sll0554). The RefSeq record
  carries the product name "ferredoxin:thioredoxin reductase" and a CDD FeThRed_B region, but no
  naming evidence (no HMM, BlastRule or other naming model is recorded for it). PGAP passes on GO
  and EC only from the naming model, so the protein gets neither. The one NCBI HMM that matches,
  the domain-level NF014939 ("ferredoxin-thioredoxin reductase catalytic domain-containing
  protein", wrapping Pfam PF02943), maps GO:0016730 (oxidoreductase activity, acting on
  iron-sulfur proteins as donors) and no EC. Because it is not the naming model, PGAP discards that
  GO. This is a recall failure rather than an error. FtrC is the catalytic chain of the
  Synechocystis FTR heterodimer, the structural and mechanistic reference enzyme for
  ferredoxin:thioredoxin reductase (EC 1.8.7.2, GO:0103012). Its activity, [4Fe-4S] cluster and
  active-site residues are established by crystallography, spectroscopy and mutagenesis, and
  UniProt/GOA carry GO:0103012 by IDA and through EC/Rhea mapping. Even if NF014939's GO had been
  passed on, GO:0016730 would be correct but less precise than GO:0103012 (see the gene review,
  where the InterPro2GO row with the same term is modified to GO:0103012). The product name itself
  is correct but does not say that this is the catalytic rather than the variable subunit.
