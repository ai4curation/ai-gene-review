taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: ArgD (Slr1022) is a soluble pyridoxal-phosphate-dependent acetylornithine aminotransferase
  in Synechocystis sp. PCC 6803. It supplies N-acetylornithine in arginine biosynthesis. Purified enzyme
  strongly prefers the acetylornithine reaction but also catalyzes ornithine and GABA transamination at
  much lower efficiencies. Mutant and isotope studies support a contextual role in the GABA shunt supplying
  succinate, so the low in vitro GABA activity does not by itself exclude a physiological contribution.
