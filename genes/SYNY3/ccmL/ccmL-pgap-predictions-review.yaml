- source_method: NCBI PGAP
  source_version: GCF_000009725.1-RS_2026_01_07 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0015977
    label: carbon fixation
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: COMPLEX_ACTIVITY_TRANSFER
    summary: >-
      Over-annotation. Carbon fixation is performed by RuBisCO, the cargo of the carboxysome; CcmL is a
      non-catalytic shell vertex protein that builds the compartment. Its requirement for efficient
      fixation in vivo is necessity, not participation in the fixation step, so the organelle's process
      has been transferred to a structural subunit. The same term is in GOA via UniRule
      (GO_REF:0000104) and is MARK_AS_OVER_ANNOTATED in the main review; the comparator check found no
      experimental carbon-fixation annotation on any beta-carboxysome shell protein. Not on the January
      2026 genome record. GO lacks a carboxysome-assembly or CO2-concentrating-mechanism process term
      that would be the appropriate process for this family model.
    supported_by:
    - reference_id: file:SYNY3/ccmL/ccmL-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: 'product_name: beta-carboxysome shell vertex protein CcmL'
    - reference_id: PMID:18292340
      supporting_text: The carboxysome is a bacterial microcompartment that functions as a simple organelle by sequestering enzymes involved in carbon fixation.
