    summary: >-
      Correct. Although CcmL is a pentameric vertex protein rather than one of the hexameric CcmK
      facet proteins, the vertices are part of the shell, and GO has no vertex-specific child term, so
      this is the most specific applicable MF. The PGAP product name ("shell vertex protein") supplies
      the vertex detail. Also in GOA (IEA and IPI from PMID:18292340) and ACCEPTed in the main review:
      correct but not novel. Not on the January 2026 genome record.
