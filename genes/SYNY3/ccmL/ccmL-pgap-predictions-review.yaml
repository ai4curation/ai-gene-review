description: >-
  NCBI PGAP names WP_010871404.1 "beta-carboxysome shell vertex protein CcmL" from the NCBIfam
  equivalog HMM NF053795.1, which carries three GO terms: carboxysome, structural constituent of
  carboxysome shell, and carbon fixation. All three are also in GOA (from UniRule/InterPro IEA, plus an
  IPI for the shell-constituent function). The product name is accurate and more informative than the
  GO terms, since it records the vertex (pentamer) role; GO has no vertex-specific child of
  structural constituent of carboxysome shell, so the shell-constituent term is as precise as the
  ontology allows. Carboxysome and structural constituent of carboxysome shell are correct and agree
  with the main review (CNN). Carbon fixation is the same pathway-membership over-annotation that the
  main review marks as over-annotated: CcmL is a non-catalytic shell protein and RuBisCO performs the
  fixation step. These GO terms appear on the current WP_ protein record (updated 14-APR-2026) but not
  on the January 2026 genome annotation (GCF_000009725.1-RS_2026_01_07), so the genome record lags the
  WP_ records. PGAP did not pass on bacterial microcompartment from the secondary domain HMM
  NF015289, which would have been redundant with carboxysome.
