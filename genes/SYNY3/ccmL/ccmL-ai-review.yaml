id: P72759
gene_symbol: ccmL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1111708
  label: Synechocystis sp. PCC 6803 substr. Kazusa
description: >-
  CcmL is a small (100 aa) protein of the CcmL/EutN family that forms the vertices of the
  beta-carboxysome shell, the proteinaceous coat of the cyanobacterial organelle that encapsulates
  RuBisCO and carbonic anhydrase as part of the CO2-concentrating mechanism. The Synechocystis
  protein crystallises as a tight homopentamer (a truncated pentagonal pyramid with a narrow,
  positively charged central pore) whose size and shape fit the five-fold vertices of an
  icosahedral shell whose facets are tiled by hexameric CcmK proteins. Genetic loss of the
  Synechococcus elongatus ortholog gives high-CO2-requiring cells with aberrant, elongated
  carboxysomes, consistent with a role in closing and shaping the shell. By analogy with the
  alpha-carboxysome vertex proteins (CsoS4), vertex pentamers are needed for the shell to act as a
  CO2 leakage barrier. CcmL also interacts with the long CcmM isoform (CcmM73), linking the shell
  to the internal bicarbonate dehydration complex.
existing_annotations:
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR001492141
  review:
    summary: >-
      UniRule transfer of carbon fixation to CcmL. CcmL is a non-catalytic structural shell
      (vertex) protein; it neither catalyses the carboxylation step nor supplies anything
      incorporated into the product. RuBisCO performs carbon fixation, and the carboxysome
      shell creates the compartment in which it works more efficiently.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The process is the purpose of the organelle CcmL builds, not something CcmL does.
      Necessity evidence (ccmL mutants require high CO2; vertex proteins are needed for the shell
      to retain CO2) shows CcmL is required for efficient fixation in vivo, which is not the same
      as participating in the fixation step. Comparator check (QuickGO, 2026-10-19): other
      beta-carboxysome shell proteins, e.g. Synechocystis CcmK2 (P72761) and S. elongatus CcmL
      (Q03512), carry GO:0015977 only through this same GO_REF:0000104 rule; no shell protein has an
      experimental carbon-fixation annotation. The protein's role is already captured by the
      carboxysome location and structural constituent of carboxysome shell function. GO currently
      has no carboxysome-assembly or CO2-concentrating-mechanism process term that would be the
      appropriate process for CcmL (raised as a suggested question). Marked as over-annotation
      rather than removed because the term is not false at the level of the organelle.
    supported_by:
    - reference_id: PMID:18292340
      supporting_text: The carboxysome is a bacterial microcompartment that functions as a simple organelle by sequestering enzymes involved in carbon fixation.
    - reference_id: PMID:19844578
      supporting_text: In the absence of the CsoS4 proteins the carboxysome shell loses its limited permeability to CO(2)
- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR004992
  review:
    summary: >-
      InterPro2GO mapping from the EutN/CcmL family signature. Correct, but the carboxysome is the
      specific bacterial microcompartment for CcmL, and GO:0031470 carboxysome (is_a bacterial
      microcompartment) is accepted elsewhere in this review.
    action: TOO_GENERAL
    reason: >-
      True but uninformative: entailed by the accepted carboxysome annotation. The family-level
      mapping is appropriate for EutN/PduN relatives in other microcompartments; for this
      beta-carboxysome protein the specific term applies.
    supported_by:
