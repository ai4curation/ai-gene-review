    supporting_text: Subsequently, shell proteins encapsulate this procarboxysome, inducing budding and distribution of functional organelles within the cell.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: S. elongatus assembly pathway; abstract only cached.
- id: PMID:23949415
  title: Two new high-resolution crystal structures of carboxysome pentamer proteins reveal high structural conservation of CcmL orthologs among distantly related cyanobacterial species.
