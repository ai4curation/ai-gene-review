core_functions:
- description: >-
    Forms homopentamers that occupy the vertices of the icosahedral beta-carboxysome shell, closing
    the CcmK hexamer facets; required for normal carboxysome shape and, by analogy with alpha-carboxysome
    vertex proteins, for the shell's barrier to CO2 leakage. Links to the internal bicarbonate
    dehydration complex via CcmM73.
  molecular_function:
    id: GO:0043886
    label: structural constituent of carboxysome shell
  locations:
  - id: GO:0031470
    label: carboxysome
  supported_by:
  - reference_id: PMID:18292340
    supporting_text: Both proteins assemble to form pentameric structures whose size and shape are compatible with formation of vertices in an icosahedral shell.
  - reference_id: PMID:22928045
    supporting_text: These data suggested a model for the facet structure of β-carboxysomes with CcmL forming the vertices
  - reference_id: PMID:8491708
    supporting_text: The PVU mutant has a drug marker inserted into the ccmL gene, and it possesses abnormal rod-shaped carboxysomes.
suggested_questions:
- question: GO has no process term for carboxysome (or bacterial microcompartment) assembly, nor for
    the CO2-concentrating mechanism. Should such a term be created, so that shell proteins like CcmL
    can carry an informative process instead of the inherited GO:0015977 carbon fixation?
- question: Are all twelve vertices of the beta-carboxysome occupied by CcmL pentamers in vivo, or are
    some left open or filled by other proteins, and does vertex occupancy vary with carboxysome size?
- question: Does the narrow, positively charged CcmL pore conduct any metabolite (e.g. bicarbonate), or
    is CcmL purely structural?
suggested_experiments:
- description: Delete ccmL in Synechocystis PCC 6803 and measure growth at air versus high CO2,
    carboxysome morphology (cryo-ET) and the CO2 permeability of purified carboxysomes.
  hypothesis: As for alpha-carboxysome CsoS4 mutants, Synechocystis carboxysomes lacking CcmL are
    misshapen and leak CO2.
- description: Quantify CcmL copy number per carboxysome by quantitative proteomics or single-particle
    fluorescence of a functional tagged allele, alongside cryo-EM of intact beta-carboxysomes.
  hypothesis: CcmL is present at about 60 copies (12 pentamers) per carboxysome, one per vertex.
- description: Mutate pore-lining residues of CcmL and test carboxysome function and solute flux in
    reconstituted shells.
  hypothesis: The CcmL pore does not make a measurable contribution to substrate flux.
