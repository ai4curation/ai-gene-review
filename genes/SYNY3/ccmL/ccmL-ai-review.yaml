- term:
    id: GO:0031470
    label: carboxysome
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0034
  - UniRule:UR001492141
  review:
    summary: >-
      CcmL is a structural component of the beta-carboxysome shell. The crystal structure of the
      Synechocystis protein shows a pentamer fitted to the shell vertices, the S. elongatus ortholog
      is required for normal carboxysome shape, and CcmL interacts with the carboxysomal CcmM73
      protein in Synechocystis.
    action: ACCEPT
    reason: >-
      Location is core to the protein's function. Supported by structure (PMID:18292340), genetics of
      the ortholog (PMID:8491708, PMID:22928045) and interaction with carboxysome cargo-linking
      protein CcmM (PMID:17993516).
    supported_by:
    - reference_id: PMID:18292340
      supporting_text: Both proteins assemble to form pentameric structures whose size and shape are compatible with formation of vertices in an icosahedral shell.
    - reference_id: PMID:17993516
      supporting_text: This complex, through CcmM73, also interacts with the major bacterial microcompartment shell proteins CcmK and CcmL.
- term:
    id: GO:0043886
    label: structural constituent of carboxysome shell
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR046387
  - UniRule:UR001492141
  review:
    summary: >-
      Combined UniRule/InterPro (CcmL subfamily) transfer of the shell structural-constituent
      function. CcmL pentamers form the vertices of the shell, so the protein is a structural
      constituent of the shell even though it is not one of the hexameric facet proteins.
    action: ACCEPT
    reason: >-
      Consistent with the experimental IPI row and the structural and genetic literature. GO has no
      vertex-specific child term, so this is as precise as the ontology allows.
    supported_by:
    - reference_id: PMID:22928045
      supporting_text: These data suggested a model for the facet structure of β-carboxysomes with CcmL forming the vertices
- term:
    id: GO:0043886
    label: structural constituent of carboxysome shell
  evidence_type: IPI
  original_reference_id: PMID:18292340
  qualifier: enables
  supporting_entities:
  - UniProtKB:P72759
  review:
    summary: >-
      The Science 2008 structure of the Synechocystis protein (PDB 2QW7) shows a tight homopentamer
      (IPI with itself) whose dimensions fit the vertices of an icosahedral carboxysome shell, and
      the authors built an atomic model of the shell combining CcmL pentamers with CcmK hexamers.
    action: ACCEPT
    reason: >-
      Core molecular function. The cached record is abstract-only, but the abstract directly states
      the pentameric vertex-compatible assembly, and later genetic (rod-shaped carboxysomes in ccmL
      mutants) and structural work on orthologs agree.
    supported_by:
    - reference_id: PMID:18292340
      supporting_text: Combining these pentamers with the hexamers previously elucidated gives two plausible, preliminary atomic models for the carboxysome shell.
    - reference_id: PMID:22928045
      supporting_text: Mutant carboxysomes lacking the CcmL protein have a characteristic rod-like appearance which is consistent with its location at the icosahedral vertex in structural models
