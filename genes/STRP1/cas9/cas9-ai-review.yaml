proposed_new_terms:
- proposed_name: guide RNA-directed nucleic acid target recognition activity
  proposed_definition: >-
    Binding to a nucleic acid target at a site whose sequence is specified by
    base-pairing with a separate, non-covalently bound guide RNA, such that altering the
    guide RNA sequence alters the target site that is recognised without any change to
    the polypeptide. The gene product supplies the guide-binding site and the machinery
    for unwinding the target and forming a guide:target heteroduplex; it does not itself
    encode the target sequence specificity.
  proposed_parent:
    id: GO:0003676
    label: nucleic acid binding
  justification: >-
    Programmable, guide-dependent target recognition is the defining property of every
    CRISPR-Cas effector and the single most consequential thing about this protein, and
    GO cannot express it. A QuickGO search for "guide RNA binding", "crRNA", "CRISPR"
    and "RNA-guided" returns only process terms (GO:0099048, GO:0043571, GO:0098672 and
    two obsoletes) and generic binding terms. The nuclease chemistry is well covered
    (GO:0004520, GO:0004521, GO:0004530, GO:1990238), which is precisely why the gap
    matters: with only those terms, Cas9 is annotated indistinguishably from an unguided
    restriction endonuclease, and Cascade or Csy surveillance complexes are
    indistinguishable from generic double-stranded DNA binding proteins. The term is
    deliberately pitched above any one system so that it serves Cas9, Cas12a, Cas13a,
    Cascade/Csy subunits and Csm/Cmr complexes alike, with children for guide
    RNA-directed DNA endonuclease activity and guide RNA-directed RNA endonuclease
    activity layering the chemistry back on. Two things are deliberately excluded from
    the definition. PAM (or PFS) dependence, because it is protein-encoded and
    orthologue-specific - NGG for this enzyme, N4GAYW-class for Neisseria meningitidis
    Cas9, N4CC for Nme2Cas9, a protospacer flanking site for Cas13a - and so belongs to
    child terms or to the individual annotation, not to the general concept. And the fate
    of the target, because that is what the existing nuclease terms already say. The
    activity is separable from catalysis experimentally, not just conceptually: AcrIIC1
    occupies the HNH domain and abolishes cleavage while leaving target binding intact,
    converting Cas9 into a recognition-only protein. One scope question is left for the
    ontology editors and is also raised in suggested_questions: as defined, the term
    would equally fit Argonaute-family slicers, which are guide-directed in exactly this
    sense. That seems right - the concept is specificity delegated to a dissociable
    nucleic-acid guide, and it is one concept - but it widens the term well beyond
    prokaryotic defence and is a decision GO should take explicitly.
  supported_by:
  - reference_id: PMID:22745249
    supporting_text: the mature crRNA that is base-paired to trans-activating crRNA
