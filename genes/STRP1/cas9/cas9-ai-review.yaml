    action: MODIFY
    reason: >-
      The specific child is supported by the enzymology and by the curated cofactor
      assignment, so the generic parent discards information. Manganese occupancy in
      crystals reflects soaking conditions rather than a second physiological cofactor.
    proposed_replacement_terms:
