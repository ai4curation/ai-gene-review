suggested_questions:
- question: >-
    Should a GO molecular-function term for guide RNA-directed target recognition be
    scoped to CRISPR-Cas effectors, or pitched broadly enough to include Argonaute-family
    slicers, which delegate specificity to a dissociable guide in the same way?
  experts: []
- question: >-
    Is the 3'-to-5' trimming of the non-complementary strand a third activity of Cas9, or
    further RuvC action on the strand it has already nicked? No separate catalytic centre
    has been assigned, and the question decides whether GO:0008408 should remain on this
    protein at all.
  experts: []
- question: >-
    GO has no way to say that an inhibitor acts on one catalytic domain of a multidomain
    nuclease. Given that AcrIIC1 occludes HNH alone and that the HNH catalytic
    conformation activates RuvC, is domain-level occlusion a distinguishable mechanism GO
    should represent, or is the allosteric coupling enough to make protein-level
    inhibition the right granularity?
  experts: []
- question: >-
    Cas9's role in adaptation is PAM selection within a Cas1-Cas2-Csn2 complex. Should
    that be curated as sequence-specific DNA binding on Cas9, or as a has-input
    relationship in a GO-CAM of the acquisition complex?
  experts: []
suggested_experiments:
- hypothesis: >-
    The 3'-to-5' trimming of the non-complementary strand is performed by the RuvC
    active site acting iteratively on the strand it has already cut, not by a distinct
    exonuclease centre.
  description: >-
    Assay end-processing of a pre-nicked, PAM-adjacent duplex by wild-type Cas9, by the
    RuvC-dead D10A mutant and by the HNH-dead H840A mutant, reading products at
    single-nucleotide resolution. If trimming survives H840A but not D10A, it is RuvC
    chemistry and GO:0008408 is redundant with GO:0004520 on this protein.
  experiment_type: in vitro nuclease assay with catalytic point mutants
- hypothesis: >-
    Cas9's contribution to spacer acquisition is PAM reading by the PI domain and nothing
    else, so a PI-domain swap should retarget the memory without touching interference.
  description: >-
    Replace the S. pyogenes PI domain with that of an orthologue reading a different PAM
    in a strain whose interference guide is held constant, then sequence newly acquired
    spacers. The prediction is that the acquired PAM tracks the donor PI domain while
    cleavage of the pre-existing target is unchanged.
  experiment_type: domain-swap genetics with spacer-acquisition sequencing
- hypothesis: >-
    Native S. pyogenes interference is directed at a substrate set wider than virus,
    including conjugative and transformable plasmid DNA, which would support GO:0099048
    over GO:0051607 as the primary process term.
  description: >-
    Challenge wild-type and in-frame cas9-deletion S. pyogenes with matched
    protospacer-bearing and protospacer-free plasmids delivered by conjugation and by
    transformation, alongside a phage challenge, and quantify interference for each
    delivery route in the same genetic background.
  experiment_type: comparative interference assay across delivery routes
