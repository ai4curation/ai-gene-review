    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR036397
  review:
    summary: >-
      Root-level and uninformative. Cas9's nucleic-acid binding has two distinct
      components: binding of the crRNA:tracrRNA guide, and PAM-dependent binding of
      duplex target DNA. The DNA component is already carried by the IDA GO:0003677
      row (refined to GO:0003690 below), so the content this row should carry is guide
      RNA binding, which is experimentally established but entirely absent from GOA.
    action: MODIFY
    reason: >-
      The InterPro mapping is from IPR036397 (RNase H-like superfamily) to the root
      binding term, which does not distinguish Cas9 from any unguided nuclease.
      GO:0003723 RNA binding is the informative descendant not otherwise represented:
      Cas9 is inactive without both guide RNAs, and the ternary structures resolve the
      protein-sgRNA interface directly.
    proposed_replacement_terms:
    - id: GO:0003723
      label: RNA binding
    additional_reference_ids:
    - PMID:31668930
    supported_by:
    - reference_id: PMID:22745249
      supporting_text: mature crRNA alone was incapable of directing Cas9-catalyzed
        plasmid DNA cleavage
      reference_section_type: RESULTS
    - reference_id: PMID:22745249
      supporting_text: Addition of tracrRNA substantially enhanced target DNA binding
