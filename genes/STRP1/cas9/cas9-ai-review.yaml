- term:
    id: GO:0004520
    label: DNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:22745249
  qualifier: enables
  review:
    summary: >-
      The core catalytic activity. Guide-loaded Cas9 introduces a double-strand break
      in target DNA three base pairs upstream of the PAM, the HNH domain cutting the
      crRNA-complementary strand and the discontinuous RuvC-like domain the
      non-complementary strand, with the two centres allosterically coupled rather
      than acting independently. Cleavage requires magnesium and a complementary
      crRNA, and works on both linear and supercoiled substrates.
    action: ACCEPT
    reason: >-
      Retained as a core molecular function. GO has no vocabulary for which domain of
      a multidomain nuclease performs which cut, so the HNH/RuvC division of labour is
      recorded in prose rather than split into two annotations; the coupling evidence
      (HNH's catalytic conformation activating RuvC) argues against treating them as
      independent activities.
    additional_reference_ids:
    - PMID:31668930
    supported_by:
    - reference_id: PMID:22745249
      supporting_text: the mature crRNA that is base-paired to trans-activating crRNA
        (tracrRNA) forms a two-RNA structure that directs the CRISPR-associated protein
        Cas9 to introduce double-stranded (ds) breaks in target DNA
      reference_section_type: ABSTRACT
    - reference_id: PMID:22745249
      supporting_text: Plasmid DNA cleavage produced blunt ends at a position three
        base pairs upstream of the PAM sequence
      reference_section_type: RESULTS
    - reference_id: PMID:22745249
      supporting_text: The cleavage reaction required both magnesium and the presence
        of a crRNA sequence complementary to the DNA
      reference_section_type: RESULTS
    - reference_id: PMID:31668930
      supporting_text: The HNH active conformation activates the RuvC domain
      reference_section_type: ABSTRACT
- term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:22745249
  qualifier: enables
  review:
    summary: >-
      This is not a domain-based inference, as its appearance on a pair of
      endonucleolytic domains might suggest. It is a direct observation reported in the
      cited paper: after the initial endonucleolytic cut, the non-complementary strand
      is trimmed 3'-to-5'. UniProt stands behind it independently, recording
      "FUNCTION AS AN EXONUCLEASE" against this reference, stating the trimming in the
      FUNCTION comment, and carrying the Exonuclease keyword. The annotation is
      correctly sourced and is kept. It is nonetheless a secondary reaction on a product
      the enzyme has already cut, not the activity that destroys the invader: the
      decisive output is the near-blunt double-strand break, no distinct exonuclease
      active site has been assigned (UniProt annotates exactly two catalytic residues,
      Asp10 in RuvC and His840 in HNH), and the trimming is most parsimoniously further
      RuvC action on the already-nicked non-target strand.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept rather than removed because the evidence is a verbatim observation in the
      reference the curator read, and because removing it would contradict a reviewed
      UniProt keyword. Marked non-core because it is a trimming step downstream of the
      double-strand break and has never been localised to its own catalytic centre; the
      core chemistry of Cas9 is endonucleolytic.
    supported_by:
    - reference_id: PMID:22745249
      supporting_text: the non-complementary strand is first cleaved endonucleolytically
        and subsequently trimmed by a 3’-5’ exonuclease activity
      reference_section_type: RESULTS
    - reference_id: PMID:22745249
      supporting_text: Plasmid DNA cleavage produced blunt ends at a position three
        base pairs upstream of the PAM sequence
      reference_section_type: RESULTS
- term:
    id: GO:0043571
    label: maintenance of CRISPR repeat elements
  evidence_type: IDA
  original_reference_id: PMID:22745249
  qualifier: involved_in
  review:
    summary: >-
      Counter-intuitive on its face - Cas9 is the interference effector, and sustaining
      the array sounds like Cas1/Cas2 work - but correct, for a reason that only appears
      from the term definition. GO:0043571 sits under GO:0043570 maintenance of DNA
      repeat elements, in a DNA-metabolism branch rather than under defence, and its
      definition covers "capture of new spacer elements ... transcription of the CRISPR
      repeat arrays into RNA and processing". Cas9 does work in both of those limbs. In
      crRNA biogenesis it is the only Cas protein required for mature crRNA production,
      acting as a non-catalytic anchor that holds the tracrRNA:pre-crRNA duplex together
      for RNase III to cut. In adaptation it is a member of the Cas1-Cas2-Csn2
      acquisition complex and its PAM-binding motif performs the selection step that
      decides which protospacers enter the array.
    action: ACCEPT
    reason: >-
      Accepted as a genuine, non-obvious fit. The step Cas9 itself performs is
      identifiable in both limbs (duplex stabilisation; PAM recognition during spacer
      selection), so this is participation rather than mere requirement - note the
      dissociation that Cas9's own nuclease activity is dispensable for acquisition
      while its PAM-binding motif is not, and that the PAM-motif mutant still acquires
      spacers but acquires non-functional ones. The one caveat is reference choice: the
      cited PMID:22745249 is the interference paper and does not itself establish array
      maintenance. The grounding is PMID:21455174 (biogenesis) and PMID:25707807
      (adaptation), both added here and quoted below. That is a citation quibble rather
      than grounds to overturn an experimental call.
    additional_reference_ids:
    - PMID:21455174
    - PMID:24270795
    - PMID:25707807
    supported_by:
    - reference_id: PMID:21455174
      supporting_text: In-frame deletions of any of the operon’s four genes then revealed
        Csn1 as the only Cas protein required for the production of mature crRNAs and
        concomitant tracrRNA cleavage
      reference_section_type: RESULTS
    - reference_id: PMID:21455174
      supporting_text: Csn1 acts as a molecular anchor facilitating the base-pairing of
        tracrRNA with pre-crRNA
      reference_section_type: DISCUSSION
    - reference_id: PMID:24270795
      supporting_text: demonstrating that none of the catalytic motifs is involved in
        dual-RNA maturation by RNase III
      reference_section_type: RESULTS
    - reference_id: PMID:25707807
      supporting_text: these results indicate that Cas1 and Cas9 are part of a complex
        dedicated to spacer acquisition which requires Cas1 nuclease activity and Cas9
        PAM-binding properties for the selection of new spacer sequences
      reference_section_type: RESULTS
