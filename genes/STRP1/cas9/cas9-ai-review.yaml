- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000165201
  review:
    summary: >-
      Correct but unnecessarily generic. UniProt's COFACTOR block for this entry names
      only Mg(2+) (ChEBI:18420), cleavage was shown to require magnesium, and the
      HNH/RuvC centres are canonical two-metal and one-metal magnesium sites; crystals
