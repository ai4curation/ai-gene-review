- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:22745249
  qualifier: enables
  review:
    summary: >-
      Correct and experimentally grounded: electrophoretic mobility shift assays with
      catalytically inactive Cas9 demonstrate guide-dependent, PAM-dependent binding of
      target DNA. The substrates in those assays were duplex DNA and plasmid, and PAM
      recognition requires a duplex, so the more specific child GO:0003690 is better
      supported than the generic parent.
    action: MODIFY
    reason: >-
      Too general. Cas9 recognises a PAM within double-stranded DNA and then unwinds
      it; it does not recognise a PAM on single-stranded DNA. GO:0003690
      double-stranded DNA binding states what was assayed. The curator's IDA call is
      retained unchanged in evidence and reference; only the term specificity is
      refined.
    proposed_replacement_terms:
    - id: GO:0003690
      label: double-stranded DNA binding
    additional_reference_ids:
    - PMID:24476820
    supported_by:
    - reference_id: PMID:22745249
      supporting_text: Mutation of either G in the PAM sequence substantially reduced
        the affinity of Cas9-tracrRNA:crRNA for the target DNA
      reference_section_type: RESULTS
    - reference_id: PMID:24476820
      supporting_text: DNA strand separation and RNA-DNA heteroduplex formation initiate
        at the PAM and proceed directionally towards the distal end of the target
        sequence
      reference_section_type: ABSTRACT
