id: Q99ZW2
gene_symbol: cas9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160490
  label: Streptococcus pyogenes M1 GAS
description: >-
  Cas9 (originally Csn1) is the single-protein effector of the type II-A CRISPR-Cas
  adaptive immune system of Streptococcus pyogenes. It is a 1368-residue, bilobed,
  magnesium-dependent nuclease that is catalytically inert on its own and becomes
  active only when loaded with a two-part guide: a mature CRISPR RNA (crRNA)
  base-paired to a trans-encoded tracrRNA. The loaded ribonucleoprotein interrogates
  double-stranded DNA for a 5'-NGG-3' protospacer adjacent motif (PAM); PAM
  recognition by the C-terminal PAM-interacting domain licenses local strand
  separation and invasion of the target strand by the crRNA spacer, and the resulting
  RNA:DNA heteroduplex positions the two nuclease centres on opposite strands. The HNH
  domain (catalytic His840) cleaves the crRNA-complementary target strand and the
  discontinuous RuvC-like domain (catalytic Asp10) cleaves the non-complementary
  strand three base pairs upstream of the PAM, generating an essentially blunt
  double-strand break that destroys the invading replicon; the non-complementary
  strand is additionally trimmed in the 3'-to-5' direction after the initial
  endonucleolytic cut. Because the sequence specificity resides in a dissociable RNA
  rather than in the polypeptide, one protein serves every spacer the array carries.
  Cas9 also acts at the two earlier stages of the pathway. It is required
  non-catalytically for tracrRNA-directed, RNase III-dependent maturation and
  accumulation of crRNA, acting as a molecular anchor that holds the tracrRNA:pre-crRNA
  duplex together. And it joins Cas1, Cas2 and Csn2 in the spacer-acquisition complex,
  where its PAM-binding motif selects which invader sequences are integrated into the
  CRISPR array, so that newly stored spacers correspond to targets the same enzyme will
  later be able to cut. In its native host the substrates are the genomes of infecting
  phages and other incoming mobile DNA, including plasmids and prophage-derived
  sequences. The enzyme is the target of the type II-A anti-CRISPR proteins AcrIIA2 and
  AcrIIA4, which block target DNA binding.
