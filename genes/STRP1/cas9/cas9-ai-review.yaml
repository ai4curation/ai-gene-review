- description: >-
    Magnesium-dependent introduction of a double-strand break into the recognised target
    DNA, three base pairs upstream of the PAM, destroying the invading replicon. One
    activity carried by two active sites: the HNH domain cuts the crRNA-complementary
    target strand and the discontinuous RuvC-like domain cuts the non-complementary
    strand, and because the catalytic HNH conformation is what activates RuvC the two
    fire as a coupled pair rather than independently. The product is essentially blunt;
    the non-complementary strand is then trimmed 3'-to-5', a secondary reaction with no
    separately assigned active site.
