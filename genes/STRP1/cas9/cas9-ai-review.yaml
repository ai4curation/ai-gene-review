core_functions:
- description: >-
    crRNA:tracrRNA-programmed interrogation of double-stranded DNA and PAM-licensed
    recognition of a complementary protospacer. The protein supplies the guide-binding
    channel and the PAM-reading C-terminal domain; the sequence that is recognised is
    specified entirely by the spacer segment of the crRNA, so the same polypeptide
    serves every spacer the array holds. Recognition proceeds by PAM contact, local
    strand separation, and directional invasion of the target strand to form an RNA:DNA
    heteroduplex. This is a separable activity, not merely the first half of cleavage:
    binding the HNH domain with AcrIIC1 removes catalysis while leaving target binding
    intact.
