      supporting_text: The HNH domains of Cas9 orthologs use a metal ion cofactor to
        catalyze TS cleavage between nts 3 and 4 of the protospacer
      reference_section_type: RESULTS
- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000165201
  review:
    summary: >-
      Supported for this gene beyond the rule that produced it. The S. pyogenes type
      II-A locus confers crRNA-directed immunity against infecting phage, and the
      adaptation experiments on this locus were phage-challenge experiments. The native
      substrate set is wider than virus - prophage-derived DNA and plasmids are also
      cleared - which is why a GO:0099048 row is proposed alongside rather than
      replacing this one.
    action: ACCEPT
    reason: >-
      Kept as a core process. Unlike the type II-C meningococcal orthologue, where only
      anti-transformation interference has been demonstrated, phage inactivation by this
      Cas9 is directly reported.
    additional_reference_ids:
    - PMID:25707807
    supported_by:
    - reference_id: PMID:25707807
      supporting_text: the Cas9 nuclease inactivates infective phages using crRNAs as
        guides to introduce double-strand DNA breaks into the viral genome
      reference_section_type: INTRODUCTION
- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:21455174
  qualifier: involved_in
  review:
    summary: >-
      The pathway term itself, absent from GOA for this protein. GO:0099048 names the
      three-stage system - spacer acquisition, crRNA biogenesis, target interference -
      and Cas9 is the only protein in this locus that contributes to all three. It sits
      under GO:0099046 clearance of foreign intracellular nucleic acids, so it covers
      the plasmid and prophage-derived substrates that GO:0051607 does not reach.
    action: NEW
    reason: >-
      Proposed because the gene's defence role is currently represented only by
      GO:0051607, which names a substrate class narrower than what is cleared, and by
      GO:0043571, which sits in a DNA-metabolism branch and says nothing about immunity.
      Checked for redundancy: GO:0099048 is neither an ancestor nor a descendant of
      GO:0051607 (under response to virus) or GO:0043571 (under maintenance of DNA
      repeat elements). Evidence is IMP: deletion of csn1 abolishes immunity against a
      protospacer-bearing plasmid in the native host, and the same deletion abolishes
      crRNA maturation.
    supported_by:
    - reference_id: PMID:21455174
      supporting_text: tracrRNA directs the maturation of crRNAs by the activities of
        the widely conserved endogenous RNase III and the CRISPR-associated Csn1 protein;
        all these components are essential to protect S. pyogenes against prophage-derived
        DNA
      reference_section_type: ABSTRACT
    - reference_id: PMID:25707807
      supporting_text: These results establish a new function for Cas9 in the genesis of
        prokaryotic immunological memory
      reference_section_type: ABSTRACT
- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: IMP
  original_reference_id: PMID:25707807
  qualifier: enables
  review:
    summary: >-
      Recognition of the protospacer adjacent motif, a short defined sequence, is the
      step Cas9 performs during spacer acquisition. Swapping cas9 for an allele reading a
      different PAM changes which protospacers enter the array, and mutating the
      PAM-binding motif leaves acquisition running but acquiring sequences with no
      conserved flanking motif. This is a sequence-specific DNA-binding function distinct
      from the guide-programmed recognition used in interference, because here the
      specificity is protein-encoded rather than delegated to the crRNA.
    action: NEW
    reason: >-
      Absent from GOA, which records only the guide-dependent binding terms. Proposed
      because the adaptation role needs a molecular function to hang on, and PAM reading
      is the one activity in that complex that is unambiguously Cas9's own - the
      integration chemistry is Cas1's. Evidence is IMP from the cas9 allele-swap and
      PAM-motif point mutants.
    supported_by:
    - reference_id: PMID:25707807
      supporting_text: Here we show that Cas9 selects functional spacers by recognizing
        their PAM during spacer acquisition
      reference_section_type: ABSTRACT
    - reference_id: PMID:25707807
      supporting_text: whereas spacers acquired in the presence of dCas9 displayed correct
        PAMs, those acquired in the presence of Cas9PAM matched DNA regions without a
        conserved flanking sequence
      reference_section_type: RESULTS
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:21455174
  qualifier: located_in
  review:
    summary: >-
      Cas9 is a soluble, non-secreted bacterial protein with no signal peptide or
      transmembrane segment, and every reaction it performs - guide duplex stabilisation,
      spacer selection at the CRISPR array, and cleavage of incoming plasmid, phage and
      transforming DNA - happens in the bacterial cytoplasm.
    action: NEW
    reason: >-
      Added so that the cellular compartment used by the core functions is asserted
      rather than implied. Evidence is IC: there is no subcellular fractionation or
      imaging experiment for this protein, and the location is inferred from the
      compartment in which its substrates and partners reside. Not GO:0005829 cytosol,
      which would claim a resolution the evidence does not support.
    supported_by:
    - reference_id: PMID:21455174
      supporting_text: tracrRNA directs the maturation of crRNAs by the activities of
        the widely conserved endogenous RNase III and the CRISPR-associated Csn1 protein;
        all these components are essential to protect S. pyogenes against prophage-derived
        DNA
      reference_section_type: ABSTRACT
