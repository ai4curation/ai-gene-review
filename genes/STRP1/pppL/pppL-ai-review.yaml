- id: PMID:16487973
  title: 'Identification and biochemical characterization of a eukaryotic-type serine/threonine
    kinase and its cognate phosphatase in Streptococcus pyogenes: their biological functions and
    substrate identification.'
  findings:
  - statement: Purified SP-STK and SP-STP are Mn2+-dependent enzymes, and the reversibly modified
      residue on their endogenous histone-like substrate SP-HLP is threonine.
    supporting_text: Enzyme activities of SP-STK and SP-STP primarily depended on Mn(2+).
    reference_section_type: ABSTRACT
  - statement: SP-STP is primarily cytoplasmic but is also a major secreted protein of GAS; the
      accompanying claim that it is essential for survival was later corrected by non-polar stp
      mutants.
    supporting_text: SP-STP, primarily a cytoplasmic protein, was found to be a major secretory
      protein of GAS and essential for bacterial survival.
    reference_section_type: ABSTRACT
  - statement: The isogenic mutants constructed in this study lacked SP-STK or one of its domains,
      so phenotypes reported for them are kinase-mutant phenotypes.
    supporting_text: Three isogenic mutants, lacking either the entire SP-STK, or one of its two
      domains
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Mol Biol 2006;357:1351-72, Jin and Pancholi). Abstract only,
      not in PMC, so the full text could not be read; the enzymology it is cited for is stated in
      the abstract. Cited by CACAO for the capsule IMP, where the mutants described are kinase
      mutants, so it is a weaker source for the direction of the stp effect than PMID:21917918.
- id: PMID:21917918
  title: Role of serine/threonine phosphatase (SP-STP) in Streptococcus pyogenes physiology and
    virulence.
  findings:
  - statement: SP-STP dephosphorylates SP-STK-phosphorylated WalR and CovR in vitro, and the
      kinase modifies both regulators specifically on threonine.
    supporting_text: The SP-STP was able to dephosphorylate the SP-STK-phosphorylated SP-WalR
    reference_section_type: RESULTS
  - statement: Non-polar stp mutants in two M1 backgrounds form long chains with multiple
      asymmetric and parallel septa and thickened walls, reverted by complementation.
    supporting_text: revealed unusual staining patterns with multiple asymmetric and parallel
      septa formation
    reference_section_type: RESULTS
  - statement: Capsule production falls 3-4-fold in both stp mutants, with 14-100-fold lower has
      transcript, placing SP-STP as a positive regulator of capsule synthesis via CovR.
    supporting_text: In both of the STP mutants, we observed a 3–4-fold decrease in the capsule
      production
    reference_section_type: RESULTS
  - statement: Total saturated and unsaturated fatty acid content rises 2-3-fold in the stp mutant,
      alongside down-regulation of the fabT repressor homolog.
    supporting_text: both saturated fatty acid (SFA) and unsaturated fatty acid (UFA) content in
      the mutant were 2–3-fold up-regulated
    reference_section_type: RESULTS
  - statement: Adherence to pharyngeal cells is reduced only in the M1SF370-derived stp mutant,
      while that mutant is 6-fold more invasive, so loss of stp increases rather than decreases
      entry into host cells.
    supporting_text: although the M1ΔSTP mutant lost the ability to adhere to pharyngeal cells,
      the adherent mutant strain was 6-fold more invasive
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2011;286:41368-80). Full text obtained from
      PMC3308849 and read for this review; it is the primary source for five of the eight CACAO
      rows.
- id: PMID:22262847
  title: Serine/threonine phosphatase (SP-STP), secreted from Streptococcus pyogenes, is a
    pro-apoptotic protein.
  findings:
  - statement: Wild-type GAS inhibits pharyngeal cell proliferation by over 90% while stp mutants
      inhibit 5-18%, with restoration on complementation, establishing SP-STP as the apoptotic
      determinant.
    supporting_text: significantly lower inhibition of proliferation of pharyngeal cells treated
      with GAS strains devoid of SP-STP (M1ΔSTP and M1T1ΔSTP, 5 and 18%, respectively) unlike the
      wild-type GAS strains (>90% inhibition)
    reference_section_type: RESULTS
  - statement: Exogenously added SP-STP enters pharyngeal cells and accumulates in the nucleus of
      most cells within 12-24 h.
    supporting_text: More than 70% of the total cells displayed the labeled SP-STP within the
      nucleus
    reference_section_type: RESULTS
  - statement: SP-STP dephosphorylates CDK1-phosphorylated histone H1 in vitro and reduces the H1
      Thr146 phospho-epitope in nuclei of treated cells.
    supporting_text: the purified SP-STP was able to dephosphorylate the H1∼P histone
    reference_section_type: RESULTS
  - statement: SP-STP-induced death is caspase-dependent and requires host transcription and
      translation.
    supporting_text: The programmed cell death induced by SP-STP, which requires active
      transcription and de novo protein synthesis, is also caspase-dependent
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2012;287:9147-67). Full text obtained from
      PMC3308748 and read; supports the GO:0052151 row with mutant, complementation, purified
      protein, catalytic-dead and in vivo evidence.
