- term:
    id: GO:0000918
    label: division septum site selection
  evidence_type: IMP
  original_reference_id: PMID:21917918
  qualifier: involved_in
  review:
    summary: >-
      The stp mutant phenotype is long chains with multiple asymmetric and parallel septa,
      which the authors interpret as regulation of septum formation acting through WalR
      phosphorylation and CdhA levels, not as participation in division-site selection.
    action: MODIFY
    reason: >-
      CACAO row. What the paper shows (Fig. 2A-D): Gram and fluorescent-vancomycin staining
      plus TEM of the non-polar M1DeltaSTP and M1T1DeltaSTP mutants give long chains, thickened
      walls and multiple asymmetric or parallel septa, reverted by complementation; the authors
      conclude a role in the regulation of septa formation and in turn cell division. The
      mechanism offered (Fig. 3) is indirect and regulatory: SP-STK/SP-STP reversibly
      phosphorylate WalR, and CdhA protein and transcript rise in the mutants. GO:0000918 is
      the wrong granularity and the wrong kind of claim, because it names the machinery that
      positions the division plane (Min/Noc/DivIVA-type activity), and nothing here shows
      SP-STP doing that work rather than tuning the expression of division genes. This is the
      phenotype-read-as-process shape, so MODIFY to the regulatory term the authors themselves
      assert, GO:0032955 regulation of division septum assembly, which also covers the
      misplaced-septum observation.
