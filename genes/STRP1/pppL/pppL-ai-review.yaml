- term:
    id: GO:0052151
    label: symbiont-mediated activation of host apoptosis
  evidence_type: IMP
  original_reference_id: PMID:22262847
  qualifier: involved_in
  review:
    summary: >-
      Wild-type GAS kills pharyngeal cells while the stp mutants barely do, complementation
      restores killing, purified SP-STP alone is sufficient and specific, the effect is
      caspase-dependent, and catalytically inactive protein is inert; this is a direct
      host-directed activity of the gene product.
    action: ACCEPT
    reason: >-
      CACAO row, the strongest in the set. What the paper shows: MTT proliferation assays (Fig.
      2A) give more than 90% inhibition by wild-type M1SF370 and M1T15448 but only 5% and 18%
      by M1DeltaSTP and M1T1DeltaSTP, with restoration in the stp-complemented strains;
      purified SP-STP alone inhibits Detroit 562 and A549 cells dose-dependently while the
      structurally homologous EF-STP does not (Fig. 2B, 3A); annexin-V staining, JC-1
      mitochondrial depolarization, caspase-3, caspase-9 and PARP cleavage and blockade by
      caspase inhibitors establish apoptosis rather than necrosis (Figs. 3, 4 and 10); mouse
      lung TUNEL confirms it in vivo (Fig. 5); and the catalytically inactive D192A protein
      neither internalizes nor kills, including when expressed inside the cell (Figs. 7-9).
      SP-STP itself performs the work here, entering the host cell, reaching the nucleus and
      dephosphorylating host histone H1, so the participation requirement is met and the term is
      at the right granularity. One caveat recorded for completeness, that killing was seen in
      two of four human cell lines, makes the activity cell-type selective but does not weaken
      the claim.
    supported_by:
    - reference_id: PMID:22262847
      supporting_text: significantly lower inhibition of proliferation of pharyngeal cells treated
        with GAS strains devoid of SP-STP (M1ΔSTP and M1T1ΔSTP, 5 and 18%, respectively) unlike
        the wild-type GAS strains (>90% inhibition)
      reference_section_type: RESULTS
    - reference_id: PMID:22262847
      supporting_text: only SP-STP and not EF-STP displayed dose-dependent proliferation
        inhibition of Detroit pharyngeal cells
      reference_section_type: RESULTS
    - reference_id: PMID:22262847
      supporting_text: a significant number of TUNEL-positive cells were found in the lungs of
        wild-type M1SF370-infected mice as compared with the lungs of M1ΔSTP-infected mice
      reference_section_type: RESULTS
    - reference_id: PMID:22262847
      supporting_text: The programmed cell death induced by SP-STP, which requires active
        transcription and de novo protein synthesis, is also caspase-dependent
      reference_section_type: ABSTRACT
- term:
    id: GO:0062085
    label: positive regulation of capsule polysaccharide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:16487973
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      SP-STP positively regulates hyaluronic acid capsule synthesis through CovR, but the
      quantified stp-mutant evidence for that direction is in PMID:21917918; the cited 2006
      paper asserts capsule modulation by this kinase and phosphatase system while its isogenic
      mutants were kinase mutants.
    action: KEEP_AS_NON_CORE
    reason: >-
      CACAO row. What the cited paper shows: the 2006 abstract reports that the three isogenic
      mutants constructed lacked the entire SP-STK or one of its domains, and states that these
      proteins modulate expression of the major virulence factors, the M protein and the
      capsule. The full text is not available (J Mol Biol, not in PMC), so what else was assayed
      for SP-STP cannot be read, and the curator-deference rule forbids calling the row
      mis-referenced on an abstract alone. The direction asserted by the term is independently
      and quantitatively established in the stp mutants themselves, with 3-4-fold less capsule
      and 14-100-fold lower has transcript in both M1DeltaSTP and M1T1DeltaSTP, restored by
      complementation, and CovR identified as the mediating response regulator (PMID:21917918,
      Fig. 4A). Noted for the project record is that capsule goes up in the SP-STK deletion, so
      the sign cannot be transferred from the kinase mutants of the cited paper. Kept as
      non-core rather than accepted because the regulation is a transcriptional consequence of
      CovR dephosphorylation, one of many outputs of this global regulator, rather than part of
      the enzyme's own activity.
    additional_reference_ids:
    - PMID:21917918
    supported_by:
    - reference_id: PMID:16487973
      supporting_text: the ability of these three proteins to modulate the expression of the major
        virulence factors, the M protein and the capsule
      reference_section_type: ABSTRACT
    - reference_id: PMID:21917918
      supporting_text: In both of the STP mutants, we observed a 3–4-fold decrease in the capsule
        production
      reference_section_type: RESULTS
- term:
    id: GO:0075294
    label: positive regulation by symbiont of entry into host
  evidence_type: IMP
  original_reference_id: PMID:21917918
  qualifier: involved_in
  review:
    summary: >-
      The only entry readout in the paper goes the other way, the stp mutant being 6-fold more
      invasive, while the adherence decrease that motivated the term was seen in only one of two
      strain backgrounds, so the sign of the regulation is not established.
    action: MODIFY
    reason: >-
      CACAO row, and the clearest error in the set. What the paper shows (Fig. 5A-B): on Detroit
      562 pharyngeal cells, adherence was significantly reduced for M1DeltaSTP but unaltered for
      M1T1DeltaSTP relative to their parents, and for internalization the mutant was more
      invasive, with the discussion stating that the adherent mutant strain was 6-fold more
      invasive. Entry into the host therefore increases, not decreases, on loss of stp, so
      positive regulation by symbiont of entry into host has the sign inverted; it appears to
      have been read off the adherence panel, which measures attachment rather than entry and is
      itself strain-specific (the authors attribute it to down-regulated pilin, scpA, sic and
      scl transcripts, and the increased invasion in part to about 14-fold speB up-regulation).
      Because SP-STP demonstrably modulates adherence and invasion but the direction for entry
      is not established, MODIFY to the sign-free parent GO:0052372 modulation by symbiont of
      entry into host. REMOVE is not used, because this is an experimental annotation whose
      underlying phenomenon is real and the defect is the sign, not the existence of the effect.
    proposed_replacement_terms:
    - id: GO:0052372
      label: modulation by symbiont of entry into host
    supported_by:
    - reference_id: PMID:21917918
      supporting_text: The results showed a significantly reduced adherence pattern for the
        M1ΔSTP strain and unaltered adherence for the M1T1ΔSTP mutant in comparison with their
        corresponding wild-type strains
      reference_section_type: RESULTS
    - reference_id: PMID:21917918
      supporting_text: the M1ΔSTP mutant was found to be more invasive than the M1T1ΔSTP mutant,
        reiterating the strain-specific STP-mediated regulation in GAS adherence and invasion
      reference_section_type: RESULTS
    - reference_id: PMID:21917918
      supporting_text: although the M1ΔSTP mutant lost the ability to adhere to pharyngeal cells,
        the adherent mutant strain was 6-fold more invasive
      reference_section_type: DISCUSSION
- term:
    id: GO:0042025
    label: host cell nucleus
  evidence_type: IDA
  original_reference_id: PMID:22262847
  qualifier: located_in
  review:
    summary: >-
      Secreted SP-STP added to pharyngeal cells reaches the nucleus of most cells, GFP-STP
      expressed in those cells is nuclear, and the host substrate it acts on, histone H1 Thr146,
      is nuclear.
    action: NEW
    reason: >-
      Proposed because the location where part of the accepted host-directed function is
      executed is missing from GOA. Fluorescently labelled SP-STP added exogenously is
      membrane-proximal at 3 h, cytoplasmic at 6 h and nuclear in more than 70% of cells by
      12-24 h, confirmed by subcellular fractionation; ectopically expressed GFP-SP-STP is
      likewise nuclear; and the functional consequence read out in the nucleus is loss of the H1
      Thr146 phospho-epitope. Two independent delivery routes (exogenous protein and ectopic
      expression) plus a nuclear enzymatic readout support the location, so this is not a
      single-assay localization.
    supported_by:
    - reference_id: PMID:22262847
      supporting_text: More than 70% of the total cells displayed the labeled SP-STP within the
        nucleus
      reference_section_type: RESULTS
    - reference_id: PMID:22262847
      supporting_text: The ectopically expressed wild-type SP-STP was found to be in the nucleus
        and conferred apoptosis of Detroit 562 pharyngeal cells
      reference_section_type: ABSTRACT
    - reference_id: PMID:22262847
      supporting_text: A significant reduction in the reactivity of anti-Pan H1-reacting 27-kDa
        protein in the nuclear extract obtained from the SP-STP-treated Detroit cells with anti-
        Thr(P)-146 H1 antibody
      reference_section_type: RESULTS
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:16487973
  qualifier: located_in
  review:
    summary: >-
      SP-STP is a major secreted protein of GAS, detected with specific antibodies outside the
      cell, and secretion is what makes the host-directed apoptotic activity possible.
    action: NEW
    reason: >-
      Proposed because the secreted pool is a required part of the protein's biology and no
