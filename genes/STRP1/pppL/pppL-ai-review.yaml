id: Q99YM9
gene_symbol: pppL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:301447
  label: Streptococcus pyogenes serotype M1
description: >-
  pppL (SP-STP, SPy_1626) is the PPM/PP2C-type, divalent-metal-dependent protein
  serine/threonine phosphatase of group A Streptococcus, encoded immediately downstream of
  and co-transcribed with the eukaryote-type Ser/Thr kinase SP-STK (SPy_1625). Together the
  two enzymes form a one-component reversible-phosphorylation module: SP-STK phosphorylates
  threonine residues on the two-component response regulators WalR and CovR and on a
  histone-like protein, and SP-STP removes them. Through this cognate control SP-STP sets the
  expression of genes governing septum formation and chain length (via WalR and CdhA), capsule
  and hemolysin synthesis (via CovR), surface proteins and SpeB, and fatty acid biosynthesis
  (via the FabT repressor). The enzyme is largely cytoplasmic but is also a major secreted
  protein; secreted SP-STP enters human pharyngeal epithelial cells, crosses into the nucleus,
  dephosphorylates histone H1 at Thr146 and triggers caspase-dependent apoptosis, an activity
  that requires its intact catalytic and structural core. Loss of pppL leaves the bacterium
  viable but strongly attenuated in vivo, so the protein is both a central physiological
  regulator and a host-directed virulence effector.
