suggested_questions:
- question: Does SP-STP dephosphorylate phosphoserine at all? Every mapped site in the literature
    (SP-HLP, WalR, CovR, host histone H1 Thr146) is a threonine, yet the protein is named and
    annotated as a serine/threonine phosphatase on the basis of the PPM fold and EC 3.1.3.16.
- question: What is the full substrate set of SP-STP in GAS, and how much of the pleiotropic stp
    mutant phenotype is explained by WalR and CovR alone versus additional direct substrates?
- question: By what route is a signal-peptide-less cytoplasmic phosphatase secreted, and how is the
    partition between the cytoplasmic regulatory pool and the secreted effector pool controlled
    during infection?
- question: How does SP-STP cross the host plasma membrane and the nuclear envelope, and is a host
    receptor responsible for the cell-type selectivity, with Detroit 562 and A549 responding while
    Cal-27 and HepG2 do not?
- question: Is host histone H1 Thr146 dephosphorylation causal for the apoptosis or a correlate of
    it, given that blocking the ERK-driven H3 phosphorylation did not prevent killing?
- question: Does loss of stp genuinely increase bacterial entry into epithelial cells relative to
    the wild type, independently of the SpeB up-regulation seen in M1SF370, and does the direction
    hold in the M1T1 background?
suggested_experiments:
- hypothesis: SP-STP is a threonine-specific rather than a dual serine/threonine phosphatase.
  description: Assay purified SP-STP against matched phosphopeptide pairs differing only in
    phospho-Ser versus phospho-Thr at the same position, including the WalR, CovR and H1 Thr146
    contexts, measuring kinetic constants, and complement this with phosphoproteomics of wild-type
    versus stp-mutant GAS to see whether phospho-Ser sites respond to stp status at all.
  experiment_type: enzyme kinetics with defined phosphopeptides plus differential phosphoproteomics
- hypothesis: The division and capsule phenotypes of the stp mutant are mediated specifically by
    the phospho-threonine sites of WalR and CovR.
  description: Replace walR and covR with phosphoablative (Thr to Ala) and phosphomimetic alleles
    at the SP-STK target threonines in both M1 backgrounds, and test whether these alleles
    reproduce or suppress the chain and septum, has transcript, capsule and fatty acid phenotypes
    of the stp deletion.
  experiment_type: allele-replacement epistasis analysis
- hypothesis: Entry of GAS into pharyngeal cells is not positively regulated by SP-STP.
  description: Repeat adherence and internalization assays with wild type, stp mutant and
    complemented strain side by side in both M1SF370 and M1T15448, normalizing invasion to the
    adherent population and using a speB deletion background to remove the confounding protease
    effect, so the sign of the stp effect on entry can be stated for each strain.
  experiment_type: quantitative adherence and gentamicin-protection invasion assay
- hypothesis: Nuclear histone H1 dephosphorylation by SP-STP is required for host apoptosis.
  description: Express H1 variants that cannot be phosphorylated or that mimic phosphorylation at
    Thr146 in Detroit 562 cells and test whether SP-STP-induced caspase activation and killing is
    blocked or bypassed; in parallel, target catalytically active SP-STP to the cytoplasm only, by
    fusing a nuclear export signal, to separate nuclear from cytoplasmic contributions.
  experiment_type: substrate-site mutagenesis with compartment-restricted effector
