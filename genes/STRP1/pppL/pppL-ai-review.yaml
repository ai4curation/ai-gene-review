- term:
    id: GO:0045717
    label: negative regulation of fatty acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:21917918
  qualifier: involved_in
  review:
    summary: >-
      Deleting stp raises total saturated and unsaturated fatty acid content 2-3-fold and lowers
      the fabT repressor transcript, so the sign of the regulation is right, but the effect is
      transcriptional and indirect and is peripheral to the enzyme's core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      CACAO row. What the paper shows (Table 1 and Fig. 6C-D): gas-chromatographic fatty acid
      methyl ester analysis of M1SF370 versus M1DeltaSTP gives 2-3-fold higher saturated and
      unsaturated fatty acid and about 3-fold higher total lipid in the mutant, with loss of
      C15:0 anteiso and C17:0 cyclopropane species, alongside 3-6-fold down-regulation of the
      GAS fabT homolog (marR/SPy1755) and 4-10-fold down-regulation of fabH in both mutants.
      Loss of the phosphatase therefore increases fatty acid synthesis, which is the direction
      GO:0045717 asserts, and the paper notes the complementary finding that SP-STK positively
      regulates fatty acid biosynthesis. The term is thus supported in sign and at a reasonable
      granularity. It is kept as non-core rather than accepted because the link is indirect (the
      authors themselves only speculate that SP-STK phosphorylates the FabT repressor, and do
      not test it), the lipid measurement was made in one of the two strain backgrounds, and
      fatty acid output is one of many downstream readouts of this global regulator rather than
      part of what the protein does.
    supported_by:
    - reference_id: PMID:21917918
      supporting_text: both saturated fatty acid (SFA) and unsaturated fatty acid (UFA) content
        in the mutant were 2–3-fold up-regulated
      reference_section_type: RESULTS
    - reference_id: PMID:21917918
      supporting_text: we also observed down-regulation of the fabT homolog of GAS, marR /
        SPy1755 (3–6-fold), in both of the mutant strains
      reference_section_type: DISCUSSION
