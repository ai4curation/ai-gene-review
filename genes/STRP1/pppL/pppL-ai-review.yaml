- description: >-
    Secreted form of the same phosphatase acting as a host-directed virulence effector. It is
    released by GAS, internalized by human pharyngeal epithelial cells, traverses to the nucleus
    and dephosphorylates histone H1 at Thr146, driving caspase-dependent apoptosis. The activity
    requires the intact catalytic and structural core, and purified protein is sufficient.
