core_functions:
- description: >-
    Mn2+-dependent PPM/PP2C-type protein serine/threonine phosphatase that, as the cognate
    partner of the co-transcribed kinase SP-STK, removes threonine phosphorylation from the
    two-component response regulators WalR and CovR, and from the histone-like protein SP-HLP,
    in the bacterial cytoplasm. This reversible-phosphorylation module is the mechanism by which
    SP-STP sets septum formation and chain length, capsule and hemolysin synthesis, surface
    protein and SpeB expression, and fatty acid output.
