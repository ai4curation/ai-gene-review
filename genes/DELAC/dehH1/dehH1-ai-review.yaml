- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:38063407
  qualifier: located_in
  review:
    summary: >-
      Proposed to replace the removed GO:0016020 row. DehH1 is a soluble
      cytoplasmic enzyme: it is described and used as such in the literature, the
      biology of its reaction requires it (the halide is released inside the
      cell), and it carries no export or membrane-targeting signal.
    action: NEW
    reason: >-
      Two independent lines agree. First, direct description of the purified and
      expressed protein. Dodge et al. purified the enzyme as a soluble protein
      and refer to it throughout as the cytoplasmic Delftia defluorinase; their
      whole experimental question, how much fluoride a cell can tolerate when the
      C-F bond is cleaved internally, presupposes and depends on cytoplasmic
      activity, and they measured the resulting intracellular fluoride stress.
      Second, sequence features. Neither this entry nor the identical curated
      entry Q01398 has a signal peptide, transmembrane feature or lipid-anchor
      site; the only feature is the AB hydrolase-1 domain spanning almost the
      whole chain, and a hydropathy screen finds no candidate membrane-spanning
      segment. A plasmid-encoded catabolic enzyme acting on a substrate that must
      first enter the cell is expected to act there. The evidence code is IC:
      this is an inference the reviewer draws and justifies, not a localisation
      assay on the native organism, and the strongest direct statements come from
      a recombinant Pseudomonas host rather than from Delftia itself. That
      caveat is why the term proposed is the general GO:0005737 rather than
      GO:0005829 cytosol.
