id: Q7DI61
gene_symbol: dehH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:80866
  label: Delftia acidovorans
description: >-
  DehH1 is haloacetate dehalogenase H-1 (EC 3.8.1.3), a plasmid-encoded bacterial
  enzyme of the alpha/beta-hydrolase fold that hydrolytically cleaves the
  carbon-halogen bond of haloacetates, releasing the halide anion and glycolate.
  It is the better-known of two unrelated haloacetate dehalogenases carried on the
  65-kb plasmid pUO1 of Delftia acidovorans strain B (originally described as
  Moraxella sp. strain B), and it is distinguished from its plasmid partner DehH2
  by acting preferentially on fluoroacetate, whose carbon-fluorine bond is among
  the strongest in natural products. Catalysis follows the canonical two-step
  alpha/beta-hydrolase route with an aspartate rather than a serine nucleophile:
  Asp105, on a classical nucleophile elbow, displaces the halide to form a
  covalent ester intermediate, which His272 then activates water to hydrolyse. The
  enzyme is a soluble cytoplasmic protein with no signal peptide or membrane
  anchor, and it also turns over non-natural 2-fluorocarboxylic acids such as
  alpha-fluorophenylacetic acid and 2-fluoropropionic acid, stereoselectively,
  making it a workhorse for studies of microbial organofluorine degradation and of
  intracellular fluoride stress.
