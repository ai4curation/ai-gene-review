      transmembrane segment or lipid anchor in either of its UniProt entries. The
      membrane claim does not hold and is removed; GO:0005737 cytoplasm is
      proposed in its place.
    action: REMOVE
    reason: >-
      PTHR43798 is an alpha/beta-hydrolase superfamily family with roughly
      164,000 members across 13 subfamilies, so grafting into it constrains the
      fold and little else. Tracing the claim through the family's PAINT data,
      the only nodes carrying GO:0016020 by IBD are PTN000177089, seeded by
      UniProtKB:P07000, SGD:S000001577, MGI:MGI:1346042, AGI_LocusCode:AT1G52760
      and UniProtKB:Q57U43, and PTN001661081, seeded by MGI:MGI:1913332. Those
      seeds are lysophospholipases and monoacylglycerol lipases, whose membrane
      association is a consequence of their substrates being membrane lipids.
      DehH1 shares the catalytic fold but not the substrate class. Its substrates
      are haloacetate and other small 2-halocarboxylic acids, which are freely
      soluble, so nothing about the lipase branch's compartment transfers with
