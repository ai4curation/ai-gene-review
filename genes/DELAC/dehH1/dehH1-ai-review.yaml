      cell so that fluoride accumulates there. Neither Q7DI61 nor the identical
      curated entry Q01398 carries a signal peptide, transmembrane feature or
      lipid-anchor site, and a hydropathy screen over the sequence finds no
      candidate membrane-spanning segment. This is a demonstrably wrong
      electronic propagation rather than a term that is merely too broad, so
      REMOVE is used rather than MARK_AS_OVER_ANNOTATED. The same row sits on
