id: Q7DI63
gene_symbol: dehH2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:80866
  label: Delftia acidovorans
description: >-
  DehH2 is haloacetate dehalogenase H-2, a small (224 aa) soluble hydrolase encoded on
  the self-transmissible IncP-1beta plasmid pUO1 of Delftia acidovorans strain B (originally
  described as Moraxella sp. strain B). It belongs to the haloalkanoic acid dehalogenase
  (HAD) superfamily, subgroup type II / L-DEX, and cleaves the carbon-halogen bond of
  2-halogenated short-chain carboxylic acids by hydrolysis, releasing the halide anion and
  the corresponding 2-hydroxy acid. Its demonstrated substrates are haloacetates: expression
  of the gene makes Escherichia coli and Pseudomonas putida resistant to iodoacetate, a
  growth-inhibitory haloacetate. Unlike DehH1, the unrelated alpha/beta-hydrolase-fold
  fluoroacetate dehalogenase encoded on the same plasmid, DehH2 does not act appreciably on
  fluoroacetate, so it cleaves C-Cl, C-Br and C-I bonds rather than the much stronger C-F
  bond. The gene sits on the class I composite transposon TnHad1, itself nested within the
  class II transposon TnHad2, making the haloacetate-catabolic capability a horizontally
  mobile module. Biologically, the enzyme allows the host to detoxify and use halogenated
  acetates such as those derived from chlorinated herbicides and water-disinfection
  by-products as carbon sources.
existing_annotations:
- term:
    id: GO:0018784
    label: (S)-2-haloacid dehalogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00098079
  - EC:3.8.1.2
  - UniRule:UR001553764
  review:
    summary: >-
      UniRule assigns DehH2 to the (S)/L-2-haloacid dehalogenase family (EC 3.8.1.2). The
      family placement is independently corroborated by several signature systems on the
      same record, and the sequence carries the HAD aspartate-nucleophile motif, so the
      hydrolytic 2-haloacid dehalogenase activity is well supported. The (S) stereospecificity
      itself has not been tested on this protein, whose documented substrates (haloacetates)
      are achiral at C2.
    action: ACCEPT
    reason: >-
      Multiple independent family signatures on Q7DI63 converge on the HAD type II
      (L-2-haloacid dehalogenase, L-DEX) family: NCBIfam TIGR01428 HAD_type_II, CDD cd02588
      HAD_L2-DEX, PRINTS PR00413 HADHALOGNASE and SFLD SFLDF00045 2-haloacid_dehalogenase.
      The sequence opens MKKIEAIAFDMYGTLYD, the canonical HAD motif I with the catalytic
      aspartate, consistent with the covalent aspartyl-ester mechanism of this family.
      Family and domain classification is legitimate support for a membership-based function,
      so the term is kept. It is not, however, listed in core_functions: the (S) stereospecificity
      it asserts has never been tested on DehH2, whereas the haloacetate activity has, so the
      core molecular function recorded below is GO:0018785 rather than this term. The caveat
      worth recording for curators is that
      the enantiospecificity encoded in the term label is a family-level inference rather than
      a measurement on DehH2: the only substrates published for this enzyme are haloacetates,
      which have no stereocentre, and Kawasaki et al. report only that H-2, unlike H-1, does
      not act on fluoroacetate. The term is therefore accepted but not treated as the only
      statement of the enzyme's activity; the EC 3.8.1.3 sibling term GO:0018785, matching the
      enzyme's published name and demonstrated haloacetate activity, is proposed alongside it.
    supported_by:
    - reference_id: file:DELAC/dehH2/dehH2-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01428; HAD_type_II; 1."
    - reference_id: file:DELAC/dehH2/dehH2-uniprot.txt
      record_section: ["DR:SFLD"]
      supporting_text: "DR   SFLD; SFLDF00045; 2-haloacid_dehalogenase; 1."
    - reference_id: PMID:1512562
      supporting_text: H-1 predominantly acts on fluoroacetate, but H-2 does not.
- term:
    id: GO:0019120
    label: hydrolase activity, acting on halide bonds, in C-halide compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006328
  review:
    summary: >-
      The InterPro2GO mapping from IPR006328 (2-haloacid dehalogenase) to this term is correct
      and is the claim most directly demonstrated for DehH2: the enzyme was discovered and
      named as a haloacetate dehalogenase, and heterologous expression of dehH2 confers
      iodoacetate resistance on E. coli and P. putida.
    action: ACCEPT
    reason: >-
      This term covers hydrolysis of a halide bond in an organically bound halogen, which is
      exactly what haloacetate dehalogenase H-2 does. Unlike the UniRule row above, this claim
      rests on experiment rather than on family inference: Kawasaki et al. tied the 675-bp
      dehH2 ORF to the purified H-2 dehalogenase by N-terminal sequence, amino acid composition
      and molecular mass, and the cloned gene produces a haloacetate-dependent gain-of-function
      phenotype in two heterologous hosts. It is a parent of the two more specific terms also
      asserted in this review, and it is kept as ACCEPT rather than marked TOO_GENERAL because
      a true parent row reinforces the claim its children make rather than duplicating them:
      the row is correct, is independently sourced (InterPro IPR006328), and nothing about it
      is contradicted by adding the specific child. The specific term the evidence does reach
      is GO:0018785 haloacetate dehalogenase activity, asserted below and recorded as the core
      molecular function; this parent row is retained alongside it, not in place of it.
    supported_by:
    - reference_id: PMID:1512562
      supporting_text: >-
        Two genes encoding haloacetate dehalogenases, H-1 and H-2, are closely linked on a
        plasmid from Moraxella sp. strain B.
    - reference_id: PMID:7579995
      supporting_text: The dehH2 gene introduced into the cells conferred iodoacetate resistance on them.
    - reference_id: file:DELAC/dehH2/dehH2-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR006328; 2-HAD."
- term:
    id: GO:0018785
    label: haloacetate dehalogenase activity
  evidence_type: IDA
  original_reference_id: PMID:1512562
  qualifier: enables
  review:
    summary: >-
      Proposed addition. GOA has no term capturing the activity the enzyme was actually
      discovered, purified and named for. DehH2 is haloacetate dehalogenase H-2 of
      Moraxella/Delftia strain B (EC 3.8.1.3), and the cloned gene confers resistance to the
      haloacetate iodoacetate in two heterologous hosts.
    action: NEW
    reason: >-
      Participation is direct: DehH2 is the catalyst, hydrolysing the C-halogen bond of
      haloacetate itself, so this is an enables-type molecular function rather than a process
      role transferred from a partner. GO places GO:0018785 (EC 3.8.1.3) and GO:0018784
      (EC 3.8.1.2) as sibling children of GO:0019120, so this is neither an ancestor nor a
      descendant of a term already asserted here, and it is not redundant with them: the
      existing UniRule row encodes the family-based (S)-2-haloacid reading, while the primary
      literature documents haloacetate turnover specifically. Comparator check: GO:0018785 is
      the term carried by the characterised haloacetate dehalogenases of this literature, among
      them the strain's own reviewed DehH1 entry (UniProtKB:Q01398, "Haloacetate dehalogenase
      H-1 (EC 3.8.1.3)"); DehH2's absence from the term reflects that Q7DI63 is an unreviewed
      TrEMBL entry whose annotation is entirely rule-derived, not a curatorial decision against
      the term. Asserted as IDA rather than IC: the evidence is published experiment on the gene
      product itself, not a curator inference from another GO term. Kawasaki et al. identified
      the dehH2 ORF as the structural gene of the purified haloacetate dehalogenase H-2 by
      N-terminal sequence, amino acid composition and molecular mass (PMID:1512562), and
      expression of the cloned gene confers haloacetate (iodoacetate) resistance on two
      heterologous hosts (PMID:7579995). This is the term recorded as the core molecular
      function below; GO:0019120 is retained above as its true parent.
    supported_by:
    - reference_id: PMID:1512562
      supporting_text: >-
        The genes for H-1 and H-2, designated dehH1 and dehH2, respectively, had different
        sizes (885 bp and 675 bp) and G+C contents (58.3% and 53.4%).
    - reference_id: PMID:7579995
      supporting_text: >-
        The haloacetate dehalogenase gene, dehH2, cloned from Moraxella sp. strain B could be
        used a selection marker gene for vectors in Escherichia coli and Pseudomonas putida.
    - reference_id: PMID:7579995
      supporting_text: Haloacetates, especially iodoacetate, inhibit the growth of some microorganisms.
core_functions:
- description: >-
    Hydrolytic dehalogenation of haloacetates, the substrates actually demonstrated for this
    enzyme, cleaving the carbon-halogen bond to release the halide anion and glycolate, and
    thereby detoxifying haloacetates and making them available as carbon sources. Activity on
    longer 2-halogenated short-chain carboxylic acids is expected from HAD type II (L-DEX)
    family membership but has not been measured on DehH2.
  molecular_function:
    id: GO:0018785
    label: haloacetate dehalogenase activity
  supported_by:
  - reference_id: PMID:1512562
    supporting_text: >-
      Two genes encoding haloacetate dehalogenases, H-1 and H-2, are closely linked on a
      plasmid from Moraxella sp. strain B.
  - reference_id: PMID:7579995
    supporting_text: The dehH2 gene introduced into the cells conferred iodoacetate resistance on them.
  - reference_id: file:DELAC/dehH2/dehH2-uniprot.txt
    record_section: ["DR:NCBIfam"]
    supporting_text: "DR   NCBIfam; TIGR01428; HAD_type_II; 1."
