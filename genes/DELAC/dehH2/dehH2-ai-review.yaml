- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The InterPro2GO mapping used here (IPR006328 2-HAD to GO:0019120) is sound; IPR006328
      is the 2-haloacid dehalogenase entry and the target term is the generic C-halide
      hydrolase term, so the mapping is correctly conservative.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Covers the UniRule RU368077 / EC 3.8.1.2 route to GO:0018784. The rule assignment to the
      HAD type II family is correct for this sequence; only the implied enantiospecificity is
      untested on DehH2.
- id: PMID:1512562
  title: Lack of homology between two haloacetate dehalogenase genes encoded on a plasmid
    from Moraxella sp. strain B.
  findings:
  - statement: >-
      The dehH2 open reading frame is 675 bp, matching the 224-residue Q7DI63 sequence, and was
      identified as the structural gene of the purified haloacetate dehalogenase H-2 by
      N-terminal amino acid sequence, amino acid composition and molecular mass.
    supporting_text: >-
      The genes for H-1 and H-2, designated dehH1 and dehH2, respectively, had different sizes
      (885 bp and 675 bp) and G+C contents (58.3% and 53.4%).
  - statement: >-
      DehH2 does not act appreciably on fluoroacetate; the fluoroacetate-cleaving activity of
      the strain belongs to the unrelated DehH1 enzyme.
    supporting_text: H-1 predominantly acts on fluoroacetate, but H-2 does not.
  - statement: >-
      DehH1 and DehH2 are not homologues, so DehH2's HAD-superfamily assignment cannot be
      transferred from, or confused with, the alpha/beta-hydrolase fluoroacetate dehalogenase.
    supporting_text: Sequence analysis revealed no homology between the two genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Gen Microbiol 138:1317-23, 1992). This is the defining paper for the
      gene: it names dehH2, gives its size, links the ORF to the purified enzyme, and states the
      fluoroacetate exclusion. Cached entry is abstract-only; all quotes used here are from the
      abstract.
- id: PMID:7579995
  title: Use of haloacetate dehalogenase genes as selection markers for Escherichia
    coli and Pseudomonas vectors.
  findings:
  - statement: >-
      Expression of cloned dehH2 confers iodoacetate resistance on Escherichia coli and
      Pseudomonas putida, an in-vivo gain-of-function demonstration of haloacetate
      dehalogenation by the DehH2 protein in two heterologous hosts.
    supporting_text: The dehH2 gene introduced into the cells conferred iodoacetate resistance on them.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Biodegradation 6:213-6, 1995). Abstract-only in the cache, but the
      phenotype claim quoted is stated in the abstract itself.
- id: PMID:11976102
  title: Characterization of a class II defective transposon carrying two haloacetate
    dehalogenase genes from Delftia acidovorans plasmid pUO1.
  findings:
  - statement: >-
      dehH2 is carried on the class I composite transposon TnHad1, nested within the
      Tn21-related class II transposon TnHad2, making the haloacetate-catabolic capability a
      mobile genetic module.
    supporting_text: >-
      The dehH2 gene was carried on an 8.9-kb class I composite transposon (TnHad1) that was
      flanked by two directly repeated copies of IS1071, IS1071L and IS1071R.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Genomic context rather than enzymology; it establishes the mobility of the
      locus but says nothing about DehH2 catalysis. Cached entry is abstract-only.
- id: PMID:14594853
  title: Structure of haloacetate-catabolic IncP-1beta plasmid pUO1 and genetic mobility
    of its residing haloacetate-catabolic transposon.
  findings:
  - statement: >-
      pUO1, the plasmid carrying dehH2, is a self-transmissible IncP-1beta plasmid that also
      carries mercury-resistance genes, so the haloacetate-catabolic genes are conjugally
      transferable.
    supporting_text: >-
      The self-transmissible plasmid pUO1 from Delftia acidovorans strain B carries two
      haloacetate-catabolic transposons, TnHad1 and TnHad2, and the mer genes for resistance to
      mercury.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Plasmid-level context for the locus; no functional data on DehH2.
- id: PMID:38063407
  title: Recombinant Pseudomonas growing on non-natural fluorinated substrates shows
    stress but overall tolerance to cytoplasmically released fluoride anion.
  findings:
  - statement: >-
      The Delftia acidovorans strain B defluorinase characterised in this study is DehH1, not
      DehH2; the authors identify it by GenBank accession BAC81979.1 and UniProt accession
      Q01398, both of which are the 294-residue haloacetate dehalogenase H-1. Neither accession
      is cross-referenced from Q7DI63 (224 residues), and dehH2 is not mentioned in the paper.
    supporting_text: >-
      The pre-existing AlphaFold (37, 38) structure of the Delftia defluorinase (UniProt
      accession Q01398) was used for modeling interactions between the enzyme and different
      fluorinated ligands.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available. Cited here only to document that its purified-enzyme
      defluorination results belong to DehH1 and are not evidence about DehH2. External resources
      that ground C-F cleavage claims to Q7DI63 on the strength of this paper have mis-attributed
      it; the enzyme is named by accession in the Methods and the activity it reports is excluded
      for DehH2 by PMID:1512562.
suggested_questions:
- question: >-
    Is DehH2 stereospecific on chiral 2-haloalkanoates such as 2-chloropropionate, and if so
    for which enantiomer? The UniProt name and EC 3.8.1.2 assignment assert (S)/L-specificity
    by family inference, but every substrate published for this enzyme is an achiral
    haloacetate.
- question: >-
    Which downstream pathway consumes the glycolate produced by haloacetate dehalogenation in
    Delftia acidovorans strain B, and is it plasmid- or chromosome-encoded? This bears on which
    catabolic pathway dehH2 feeds, not on whether DehH2 participates: it performs the
    dehalogenation step itself. No biological-process term is proposed here for a different
    reason - an OLS search of GO found no haloacetate, haloalkanoate or dehalogenation
    catabolic-process term, and the only applicable ancestor, GO:0090345 organohalogen
    metabolic process, has no catabolic child covering this chemistry and would add nothing
    beyond the molecular function already asserted. If GO created a haloacetate catabolic
    process term, DehH2 would be a direct participant in it.
- question: >-
    Does DehH2 contribute measurably to growth on haloacetates in the native strain, given that
    DehH1 is present on the same plasmid and that dehH2 is reported to be prone to spontaneous
    deletion from pUO1?
suggested_experiments:
- description: >-
    Assay purified recombinant DehH2 against the separated enantiomers of 2-chloropropionate and
    2-bromopropionate, following halide release, and determine the configuration of the
    2-hydroxy acid product by chiral chromatography or coupled stereospecific lactate
    dehydrogenases. This would convert the EC 3.8.1.2 / GO:0018784 assignment from a family
    inference into a measurement, or replace it with the (R)-specific or non-specific
    alternative.
  hypothesis: >-
    DehH2, as a HAD type II (L-DEX) family member, inverts configuration at C2 and acts
    preferentially on the (S) enantiomer.
  experiment_type: enzyme kinetics with stereochemical product analysis
- description: >-
    Measure specific activities of purified DehH2 on fluoro-, chloro-, bromo- and iodoacetate
    side by side under one set of conditions, with no-enzyme controls for spontaneous halide
    release, using a halide-selective electrode or ion chromatography.
  hypothesis: >-
    DehH2 turns over chloro-, bromo- and iodoacetate but shows no activity above the spontaneous
    rate on fluoroacetate, quantifying the qualitative exclusion reported by Kawasaki et al.
  experiment_type: substrate-specificity profiling
- description: >-
    Construct a clean dehH2 deletion in the pUO1-bearing Delftia acidovorans strain B background,
    in both dehH1-positive and dehH1-negative backgrounds, and compare growth and halide release
    on chloroacetate as sole carbon source, with complementation in trans.
  hypothesis: >-
    DehH2 provides the dominant haloacetate dehalogenase activity for growth on non-fluorinated
    haloacetates, with DehH1 contributing little outside fluoroacetate.
  experiment_type: targeted gene deletion with growth phenotyping
