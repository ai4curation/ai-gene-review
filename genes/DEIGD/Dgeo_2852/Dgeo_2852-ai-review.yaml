    action: UNDECIDED
    summary: Native membrane association of the short kinase remains unresolved.
    reason: The target lacks the transmembrane region of full-length KdpD and was purified as a soluble
      recombinant protein. This undermines an automatic integral-membrane interpretation, but does not
      exclude peripheral recruitment to the membrane pump that it phosphorylates. The available heterologous
