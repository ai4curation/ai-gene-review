id: Q1J2K3
gene_symbol: Dgeo_2852
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:319795
  label: Deinococcus geothermalis DSM 11300
description: Dgeo_2852 is a short KdpD-family atypical serine kinase comprising KdpD_N and universal stress
  protein domains. The purified Deinococcus geothermalis protein phosphorylates the regulatory serine
  of heterologous Escherichia coli KdpB, with stimulation by cyclic di-AMP under the tested conditions.
  It lacks the histidine-kinase transmitter domains of canonical KdpD. Its native pump partners, signaling
  inputs and cellular localization remain incompletely characterized.
