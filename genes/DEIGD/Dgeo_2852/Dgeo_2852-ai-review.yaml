    action: UNDECIDED
    summary: Native intracellular partitioning of DgKdpD is not established by heterologous purification.
    reason: The short KdpD_N/Usp architecture lacks the canonical membrane-spanning region and is compatible
      with a soluble kinase. However, the quoted cytosolic fraction belongs to the E. coli expression
      host, not a D. geothermalis localization assay. The architecture does not exclude peripheral recruitment
      to a native membrane partner. The ARBA assertion is not independent evidence; retain uncertainty
      about native compartmental partitioning instead of refining it to cytosol.
