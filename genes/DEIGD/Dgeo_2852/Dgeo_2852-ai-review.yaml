  review:
    action: MODIFY
    summary: The demonstrated kinase chemistry is serine phosphorylation, not a histidine phosphorelay.
    reason: This is a nonhierarchical catalytic-class correction, not a descendant refinement. Q1J2K3
      is the short KdpD_N/Usp protein explicitly assayed in PMID:38622146. It lacks HisKA/HATPase transmitter
      domains, whereas purified DgKdpD phosphorylates heterologous E. coli KdpB in the atypical serine-kinase
      assay. Broad KdpD family classification does not establish a histidine kinase in this truncated
      architecture. The exact accession is absent from the cached PAINT tree, so no target loss is claimed.
