  review:
    action: UNDECIDED
    summary: The propagated glutathione-dependent formaldehyde function is unresolved for ADH8a3.
    reason: 'The target evidence supports a muscle ADH8a ethanol role. Purified zebrafish ADH8A and ADH8B
      diverge in substrate specificity: ADH8B efficiently uses S-hydroxymethylglutathione whereas ADH8A
      had no detectable activity toward this substrate under the reported assay conditions. This makes
      broad transfer of a formaldehyde/GSNOR-like claim questionable, but neither the target substrate
      panel nor the exact TreeGrafter attachment was independently resolved. Do not equate assay nondetection
      in a homolog with absolute absence in this paralog; retain uncertainty rather than remove the claim
      from an incomplete test.'
