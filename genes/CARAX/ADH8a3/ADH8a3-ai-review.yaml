  findings:
  - statement: Muscle ADH8a3 transcript predominance and pathway physiology identify the likely ethanol-producing
      paralog; the proposed substrate-channel substitution was not functionally tested.
    supporting_text: Whereas the ADH8a3 mRNA completely dominated the expression in skeletal muscle, constituting
      96% of total ADH8a mRNA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected. Expression/model evidence distinguishes target assignment
      from older muscle-enzyme measurements.
- id: PMID:15231826
  title: Two zebrafish alcohol dehydrogenases share common ancestry with mammalian class I, II, IV, and
    V alcohol dehydrogenase genes but have distinct functional characteristics.
  findings:
  - statement: Purified zebrafish ADH8A uses ethanol, whereas ADH8B favors other substrates including
      S-hydroxymethylglutathione. These are comparator proteins, not crucian carp ADH8a3 assays.
    supporting_text: Kinetic studies demonstrate that ADH8A metabolizes ethanol
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full cached primary study read. Used to assess reaction and specificity transfer across
      the ADH8 branch, with explicit organism/paralog limits.
