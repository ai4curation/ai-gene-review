  label: Carassius carassius
description: ADH8a3 is a zinc-containing medium-chain alcohol dehydrogenase paralog enriched in crucian
  carp skeletal muscle. Its expression and ADH8a-family relationship implicate it in reduction of acetaldehyde
  to ethanol during prolonged anoxia, downstream of a specialized mitochondrial pyruvate-decarboxylating
  system. The paralog assignment integrates muscle physiology, expression and sequence evidence; purified
  ADH8a3 substrate kinetics and the functional effect of its distinctive substrate-channel residue remain
  unresolved.
