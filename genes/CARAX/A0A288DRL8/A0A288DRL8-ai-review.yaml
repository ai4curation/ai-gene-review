suggested_questions:
- question: Does purified E1alpha3/E1beta2 release acetaldehyde independently of E2, and what residual
    lipoyl-E2 acetylation activity remains?
suggested_experiments:
- description: Reconstitute full-length alpha3/beta2 and conventional alpha1/beta1 complexes, quantify
    acetaldehyde and lipoyl-E2 acetylation separately, and reverse the beta2 interface substitution to
    test the proposed loss of E2 coupling.
