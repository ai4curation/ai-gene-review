  label: Carassius carassius
description: E1alpha3 is a pyruvate-dehydrogenase-E1-derived subunit in crucian carp, represented by a
  393-residue full-length sequence. Together with the complementary muscle-enriched E1 paralog, it is
  implicated in a mitochondrial pyruvate decarboxylase that releases acetaldehyde for ethanol production
  during anoxia. This proposed specialization differs from the usual E1-mediated transfer of an acetyl
  group to lipoyl-E2 in the pyruvate dehydrogenase complex. The paralog-specific enzyme composition is
  inferred from expression, localization, sequence and structural evidence.
