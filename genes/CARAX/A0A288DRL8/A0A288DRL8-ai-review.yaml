  title: Extreme anoxia tolerance in crucian carp and goldfish through neofunctionalization of duplicated
    genes creating a new ethanol-producing pyruvate decarboxylase pathway.
  findings:
  - statement: E1alpha3 is assigned to the muscle-enriched E1 pair proposed to function as a mitochondrial
      acetaldehyde-producing decarboxylase. The study combines transcript stoichiometry, E1 protein/localization
      observations and structural modeling, not purified-paralog reconstitution.
    supporting_text: Together, these data suggest that the protein products of the E1α3 and E1β2 paralogs
      combine to produce a specific E1 enzyme
  - statement: Mitochondrial targeting and E1 localization support compartment assignment; E1alpha antibody
      observations do not distinguish alpha3 from other E1alpha paralogs.
    supporting_text: The presence of 5′ mitochondrial import signals in both Carassius PDC subunits supports
      a mitochondrial localization
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected. The proposed E1alpha3/E1beta2 functional specialization
      is explicitly treated as an integrated inference, distinct from direct purification and residual
      PDH activity tests.
