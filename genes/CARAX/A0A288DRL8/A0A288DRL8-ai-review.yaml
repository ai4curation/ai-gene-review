core_functions:
- description: Inferred contribution of E1alpha3 to the proposed muscle E1alpha3/E1beta2 pyruvate decarboxylase,
    producing acetaldehyde for ethanol synthesis. This is a complex-level specialization supported by
    integrated primary evidence, not an assertion that the isolated subunit is active or that residual
    PDH acetyl-transfer activity is absent.
