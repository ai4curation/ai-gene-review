  review:
    action: UNDECIDED
    summary: Participation of this specialized paralog in acetyl-CoA production is unresolved.
    reason: The proposed muscle pathway releases acetaldehyde rather than delivering an acetyl group to
      E2. Other E1 paralogs maintain conventional PDH metabolism. Family/domain and TreeGrafter mapping
      do not settle deployment of this specific paralog, and no target-specific acetyl-CoA synthesis assay
      was found; retain uncertainty rather than declaring all pyruvate-decarboxylation pathways equivalent.
    supported_by:
