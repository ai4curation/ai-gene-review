  review:
    action: UNDECIDED
    summary: Conventional acetyl-transferring E1 activity remains unresolved for this specialized paralog.
    reason: The conserved E1 family supports pyruvate/ThDP chemistry, but the target-specific study argues
      that E1alpha3/E1beta2 forms a separate acetaldehyde-producing system; the beta2 E1-E2 interface
      substitution provides a mechanistic basis. This challenges unqualified transfer of acetyl-transferring
      PDH activity. The study does not purify/reconstitute this exact paralog pair or measure residual
      lipoyl-E2 acetylation, so neither conventional activity nor its complete loss is established.
    supported_by:
    - reference_id: PMID:28801642
      supporting_text: Together, these data suggest that the protein products of the E1α3 and E1β2 paralogs
        combine to produce a specific E1 enzyme
