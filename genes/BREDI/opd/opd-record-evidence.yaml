    CC   -!- FUNCTION: Has an unusual substrate specificity for synthetic
    CC       organophosphate triesters and phosphorofluoridates. All of the
    CC       phosphate triesters found to be substrates are synthetic
    CC       compounds. The identity of any naturally occurring substrate for
    CC       the enzyme is unknown. Has no detectable activity with phosphate
    CC       monoesters or diesters and no activity as an esterase or protease.
    CC       It catalyzes the hydrolysis of the insecticide paraoxon at a rate
    CC       approaching the diffusion limit and thus appears to be optimally
    CC       evolved for utilizing this synthetic substrate.
    CC   -!- CATALYTIC ACTIVITY: An aryl dialkyl phosphate + H(2)O = dialkyl
    CC       phosphate + an aryl alcohol.
