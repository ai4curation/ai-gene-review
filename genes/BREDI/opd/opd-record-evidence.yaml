  comments:
  - texts:
    - value: Has an unusual substrate specificity for synthetic organophosphate triesters and phosphorofluoridates.
        All of the phosphate triesters found to be substrates are synthetic compounds. The identity of any naturally
        occurring substrate for the enzyme is unknown. Has no detectable activity with phosphate monoesters or diesters
        and no activity as an esterase or protease. It catalyzes the hydrolysis of the insecticide paraoxon at a
        rate approaching the diffusion limit and thus appears to be optimally evolved for utilizing this synthetic
        substrate
    commentType: FUNCTION
  - commentType: CATALYTIC ACTIVITY
    reaction:
      name: An aryl dialkyl phosphate + H2O = dialkyl phosphate + an aryl alcohol.
      ecNumber: 3.1.8.1
  - commentType: COFACTOR
    cofactors:
    - name: Zn(2+)
      cofactorCrossReference:
        database: ChEBI
        id: CHEBI:29105
    note:
      texts:
      - value: Binds 2 Zn(2+) ions per subunit.
  - texts:
    - value: Homodimer
    commentType: SUBUNIT
  - commentType: SUBCELLULAR LOCATION
    subcellularLocations:
    - location:
        value: Cell membrane
        id: SL-0039
      topology:
        value: Peripheral membrane protein
        id: SL-9903
  - texts:
    - value: Predicted to be exported by the Tat system. The position of the signal peptide cleavage has been experimentally
        proven
    commentType: PTM
  - texts:
    - value: Has attracted interest because of its potential use in the detoxification of chemical waste and warfare
        agents and its ability to degrade agricultural pesticides such as parathion
    commentType: BIOTECHNOLOGY
  - texts:
