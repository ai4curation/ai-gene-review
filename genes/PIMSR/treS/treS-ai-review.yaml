  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006047
  - InterPro:IPR012810
  review:
    summary: >-
      Generic carbohydrate metabolism from GH13 InterPro signatures; correct
      but less specific than the known substrate and product.
    action: MODIFY
    reason: >-
      The enzyme interconverts maltose and trehalose, so its process is
      trehalose metabolic process (GO:0005991), an is_a descendant of
      carbohydrate metabolic process through disaccharide metabolic process.
      The direction-neutral metabolic term is chosen rather than trehalose
      biosynthetic process because the reaction is reversible and its
      direction in Pimelobacter cells has not been measured; the enzyme was
      characterized only as a maltose-to-trehalose catalyst in vitro.
    proposed_replacement_terms:
