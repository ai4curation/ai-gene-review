    action: MODIFY
    reason: >-
      The enzyme's catalytic activity is known: the cloned gene encodes the
      trehalose synthase that converts maltose into trehalose, which is
      maltose alpha-D-glucosyltransferase activity (GO:0047471), an is_a
      descendant of catalytic activity through intramolecular transferase
