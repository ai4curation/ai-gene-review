id: P72235
gene_symbol: treS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:51662
  label: Pimelobacter sp.
description: >-
  TreS from Pimelobacter sp. R48 is the founding trehalose synthase: a
  573-residue standalone glycoside hydrolase family 13 (GH13) enzyme that
  converts maltose into alpha,alpha-trehalose by intramolecular
  transglucosylation, turning the alpha-1,4 glucosidic bond of maltose into the
  alpha,alpha-1,1 bond of trehalose without releasing free glucose as the main
  product. The reaction is reversible. The protein carries the
  TreS/alpha-amylase N-terminal region, the GH13 catalytic barrel with its
  nucleophile and proton-donor residues, and the maltogenic-amylase-like
  C-terminal domain, and it belongs to the PANTHER SF219 maltose
  alpha-D-glucosyltransferase subfamily. Its physiological role in
  Pimelobacter has not been studied beyond trehalose formation from maltose.
