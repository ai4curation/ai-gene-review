core_functions:
- description: >-
    Standalone trehalose synthase that converts maltose into
    alpha,alpha-trehalose in a single reversible intramolecular
    transglucosylation, forming trehalose without a glucan intermediate.
  molecular_function:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  directly_involved_in:
  - id: GO:0005991
    label: trehalose metabolic process
  supported_by:
  - reference_id: PMID:8645698
    supporting_text: >-
      The gene encoding trehalose synthase (catalyzing the conversion of maltose into
      alpha, alpha-trehalose by intramolecular transglucosylation) was cloned from
      Pimelobacter sp. R48.
  knowledge_gaps:
  - gap_statement: >-
      Whether Pimelobacter TreS makes or consumes trehalose in living cells,
      and what supplies its maltose, has not been tested.
    gap_kind:
    - BIOLOGY
    significance: >-
      Mycobacterial SF219 TreS enzymes run mainly in the trehalose-to-maltose
      direction in vivo, so in vitro trehalose formation does not settle the
      physiological direction of this standalone homolog.
suggested_questions:
- question: >-
    Does Pimelobacter sp. R48 accumulate trehalose from maltose through TreS
    in vivo, or does the enzyme mainly feed maltose into alpha-glucan
    metabolism as mycobacterial TreS does?
suggested_experiments:
- description: >-
    Measure intracellular trehalose, maltose and glycogen in a Pimelobacter
    treS deletion strain grown on maltose versus other carbon sources and under
    osmotic stress.
