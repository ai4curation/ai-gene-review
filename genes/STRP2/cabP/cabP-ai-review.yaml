taxon:
  id: NCBITaxon:373153
  label: Streptococcus pneumoniae D39
description: CabP (SPD_0077) is a cyclic di-AMP receptor and potassium-transport regulator in Streptococcus
  pneumoniae D39. It directly interacts with the membrane potassium transporter SPD_0076 and supports
  potassium uptake under potassium limitation. Elevated cyclic di-AMP weakens the CabP-transporter interaction
  and reduces potassium uptake. CabP is the regulatory component rather than the transmembrane pore.
