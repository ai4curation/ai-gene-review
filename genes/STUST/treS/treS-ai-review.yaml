id: Q9LAS5
gene_symbol: treS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:316
  label: Stutzerimonas stutzeri
description: >-
  TreS of Stutzerimonas (Pseudomonas) stutzeri CJ38 is a 689-residue
  trehalose synthase that reversibly interconverts maltose and
  alpha,alpha-trehalose in a single step. Unlike the classical actinobacterial
  TreS enzymes, it belongs to a distinct Pseudomonas-type TreS group defined by
  the NCBIfam TIGR02455 (TreS_stutzeri) and InterPro IPR012665 signatures,
  sitting within the GH13 alpha-amylase PANTHER family without a PANTHER
  subfamily assignment. The recombinant enzyme converts concentrated maltose to
  trehalose at high yield with no detectable glucose by-product and shows no
  activity on starch or maltooligosaccharides, so its substrate range is
  confined to the maltose-trehalose pair.
existing_annotations:
- term:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:15654636
  qualifier: enables
  review:
    summary: >-
      Proposed molecular-function annotation for the characterized CJ38
      trehalose synthase, which has no GO annotation in GOA.
    action: NEW
    reason: >-
      The CJ38 enzyme reversibly interconverted maltose and trehalose, and the
      recombinant protein expressed from the cloned 689-codon gene converted
      maltose to trehalose at high yield. That is the EC 5.4.99.16 reaction
      defined by GO:0047471. Q9LAS5 corresponds to GenBank AAF26837.1, the
      689-residue product cited by UniProt to this paper.
    supported_by:
    - reference_id: PMID:15654636
      supporting_text: >-
        Activity analysis, using either maltose or trehalose as a
        substrate, showed a reversible reaction.
    - reference_id: PMID:15654636
      supporting_text: >-
        The recombinant enzyme exhibited a high
        activity toward the substrate maltose, about 50-fold higher than the parent
        strain and resulted in a high conversion yield (72%) at a relatively high
        substrate concentration (20%).
    - reference_id: file:STUST/treS/treS-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: 'DR   NCBIfam; TIGR02455; TreS_stutzeri; 1.'
