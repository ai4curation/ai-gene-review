core_functions:
- description: >-
    Single-step reversible isomerization of maltose to alpha,alpha-trehalose,
    giving a one-enzyme trehalose route from maltose without glucose
    by-product or a glucan intermediate.
  molecular_function:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  supported_by:
  - reference_id: PMID:15654636
    supporting_text: >-
      Activity analysis, using either maltose or trehalose as a
      substrate, showed a reversible reaction.
  knowledge_gaps:
  - gap_statement: >-
      The physiological direction of CJ38 TreS and its contribution to
      trehalose accumulation in S. stutzeri cells are unknown.
    gap_kind:
    - BIOLOGY
    significance: >-
      The reaction is reversible and only recombinant-enzyme conversion has
      been measured, so in vivo flux could equally run toward maltose.
suggested_questions:
- question: >-
    What residues distinguish the TIGR02455 Pseudomonas-type TreS group from
    classical SF219 TreS enzymes, and do they explain the absence of glucose
    by-product?
suggested_experiments:
- description: >-
    Delete treS in S. stutzeri CJ38 and measure intracellular trehalose and
    maltose under osmotic stress and on maltose as carbon source.
