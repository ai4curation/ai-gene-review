    action: REMOVE
    summary: Physical association is real, but bare protein binding is uninformative.
    reason: The structural complex and solution-association evidence support a catalytic heterotetramer.
      Remove the generic binding term under the protein-binding policy without denying those interactions;
      the catalytic activities and complex membership capture their functional context. PMID:16472743
