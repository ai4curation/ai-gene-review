id: P28790
gene_symbol: fadA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:296
  label: Pseudomonas fragi
description: FadA, historically FaoB, is the beta thiolase subunit of the Pseudomonas fragi B-0771 fatty-acid
  oxidation complex. Its catalytic center cleaves 3-ketoacyl-CoA with CoA, releasing acetyl-CoA and a
  shortened acyl-CoA. Productive thiolase activity depends on association with the FadB/FaoA alpha partner
  under the tested reconstitution conditions. Two copies of each chain form a soluble heterotetramer;
  the complex supplies the final three reactions of beta-oxidation rather than the initial acyl-CoA oxidation
  step.
