  - PANTHER:PTN002466592
  review:
    action: UNDECIDED
    summary: Phenylacetate participation remains unresolved for this thiolase.
    reason: The primary studies establish fatty-acid beta-oxidation chemistry but do not assay phenylacetate
      catabolism. That positive canonical function does not exclude secondary participation in phenylacetate
      degradation, and a shared thiolase fold alone does not establish it. The supplied TreeGrafter source
      PTN002466592 has not been resolved to a target-specific phenylacetate assertion in the available
      family evidence. Retain uncertainty rather than treating absence of pathway-specific evidence or
      a different family label as evidence against the annotation.
    supported_by: *id002
