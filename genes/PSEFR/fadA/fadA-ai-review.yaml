  review:
    action: ACCEPT
    summary: FadA/FaoB supplies the complex thiolase catalytic center.
    reason: The native complex and in-vitro reconstitution establish CoA-dependent 3-oxoacyl-CoA cleavage.
      Isolated beta is inactive under the 1997 conditions, and the structural study shows alpha-dependent
      organization for long acyl chains. These partner requirements qualify the activity but do not automatically
      invalidate enables on the catalytic beta gene product.
    supported_by:
    - &id001
      reference_id: PMID:9396725
      supporting_text: 'The HDT complex, reconstituted in vitro from the isolated alpha- and

        beta-subunits, exhibits the three original enzymic activities'
