id: P28793
gene_symbol: fadB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:296
  label: Pseudomonas fragi
description: FadB, historically FaoA, is the alpha subunit of the soluble Pseudomonas fragi B-0771 fatty-acid
  oxidation complex. Its N-terminal hydratase and C-terminal NAD-dependent dehydrogenase process enoyl-CoA
  substrates through the middle two reactions of beta-oxidation. The alpha chain remains catalytically
  active outside the alpha2beta2 complex and supports productive thiolysis by its FadA/FaoB partner. The
  complex also exhibits enoyl-CoA isomerase and hydroxyacyl-CoA epimerase capabilities; epimerization
  does not suffice for complete degradation of all unsaturated substrates.
