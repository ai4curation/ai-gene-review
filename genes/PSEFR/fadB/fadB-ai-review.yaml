  - RHEA:45900
  - EC:5.3.3.8
  - UniRule:UR000080054
  review:
    action: ACCEPT
    summary: The Pseudomonas complex has an auxiliary enoyl-CoA isomerase activity.
    reason: The native complex directly exhibited cis3/trans2 isomerase activity and supported oxidation
      of substrates bearing odd-position cis bonds. The alpha hydratase/isomerase architecture assigns
      this auxiliary activity to FadB/FaoA. The finding is not transferred to Mtb cis substrates, for
      which the separate literature reports a restriction.
    supported_by:
    - reference_id: PMID:2361950
      supporting_text: 'cis-3,trans-2-enoyl-CoA

        isomerase'
