  - PANTHER:PTN002462037
  - UniRule:UR000080054
  - UniPathway:UPA00659
  review:
    action: ACCEPT
    summary: The chain catalyzes reactions within fatty-acid beta-oxidation.
    reason: Purified and reconstituted-complex experiments assign the relevant chemistry to this subunit;
      this is participation through catalysis rather than an indirect growth phenotype. The alpha/beta
      complex covers only the final three reactions. Its assembly and substrate restrictions are retained
      and no first-step partner is inferred.
    supported_by: *id001
- term:
    id: GO:0008692
    label: 3-hydroxybutyryl-CoA epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012799
  - RHEA:21760
  - EC:5.1.2.3
  - UniRule:UR000080054
  review:
    action: KEEP_AS_NON_CORE
    summary: Hydroxyacyl-CoA epimerase is an assayed peripheral capability.
    reason: The native complex has measured epimerase activity, supporting the alpha-chain annotation
      together with its multifunctional architecture. However, the same reconstituted system failed to
      complete oxidation of substrates with even-position cis bonds until a separate dienoyl-CoA reductase
      was added. Keep the genuine capability as non-core rather than denying it solely because it was
      ineffective in that pathway context.
    supported_by:
    - reference_id: PMID:2361950
      supporting_text: 'These results suggested that the

        3-hydroxyacyl-CoA epimerase in the complex was not operative.'
