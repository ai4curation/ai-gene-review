- term:
    id: GO:0004165
    label: delta(3)-delta(2)-enoyl-CoA isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012799
