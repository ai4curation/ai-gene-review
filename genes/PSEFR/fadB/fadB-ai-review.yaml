  review:
    action: MODIFY
    summary: FadB oxidizes long-chain 3S-hydroxyacyl-CoA using NAD+.
    reason: The C-terminal HAD domain and assays support NAD-dependent oxidation of long-chain intermediates.
      GO:0016509 is a verified descendant of the broader dehydrogenase/oxidoreductase terms; it covers
      13–22 carbon acyl chains. The complex processes long-chain substrates in native-complex reconstitution;
      the 2006 ligand study additionally uses3-hydroxyhexadecanoyl-CoA. This specificity is not an assertion
      that shorter chains are impossible or that FadB performs the beta-chain thiolase reaction.
