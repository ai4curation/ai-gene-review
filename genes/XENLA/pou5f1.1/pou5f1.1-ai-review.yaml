id: Q7T103
gene_symbol: pou5f1.1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: Oct-25 (XOct-25; Xenbase pou5f3.2.L) is one of three Xenopus laevis POU class V (Pou5f3) transcription
  factors, the amphibian counterparts of mammalian Oct4; the others are Oct-60 (pou5f3.3) and Oct-91 (pou5f3.1).
  It is a nuclear octamer (ATGCAAAT)-binding protein with a POU-specific domain and POU homeodomain. Its mRNA is
  present at low levels maternally and rises sharply at gastrulation in the animal and marginal zones, then declines
  by the end of neurulation. When bound directly to octamer sites, as in the BMP-responsive Xvent-2B promoter, it
  activates transcription. In the early embryo it mainly acts as a partner-dependent repressor. It joins complexes
  with VegT and Tcf3 on Xnr and Siamois promoters, and with FoxH1, Smad2 and WBSCR11 on goosecoid and Mix2. These
  complexes damp the nuclear response to the maternal VegT, Wnt/beta-catenin and nodal/activin inducers, keeping
  embryonic cells undifferentiated and timing germ-layer specification. In the ectoderm it limits competence to
  respond to BMP, favouring neural over epidermal fate and inducing Sox2. Suv4-20h-dependent H4K20me3 must silence
  it for neural differentiation to proceed. Zygotic Oct-25 and Oct-91 are also expressed at the neural plate border.
  There they are required, with Oct-25 alone sufficient for rescue, for neural crest formation. Pou5 proteins therefore
  act as competence factors that the crest inherits from the pluripotent blastula. Mouse Oct4 and chick OCT4 play
  a similar role in the crest. Pou5 is a vertebrate innovation derived from a pou3-like ancestor, and its crest-promoting
  activity is specific to the pou5 clade. Lamprey pou5 is expressed in blastula animal-pole cells but not in the
  neural crest. Even so, lamprey pou5 can promote crest formation when expressed in frog embryos.
