suggested_questions:
- question: Should GO:0019827 stem cell population maintenance (or a new 'maintenance of embryonic/progenitor competence'
    term) apply to Xenopus Oct-25? Frog evidence shows timing of germ-layer specification and of ectodermal fate
    choice. It does not show maintenance of a self-renewing stem cell population, so GO:0019827 (carried by mouse
    Pou5f1 for ICM/ES self-renewal) was not added. This bears on the module's open competence-maintenance knowledge
    gap.
- question: York 2024 places zygotic pou5f3.2 at the neural plate border and in early crest. Nicetto 2013 describes
    Oct-25 restricted to the notoplate by midneurula. Which cells express Oct-25 protein at stages 13-17, and is
    the border expression Oct-25, Oct-91, or both?
- question: Does frog Oct-25 occupy neural crest enhancers directly, with Sox2/3 and TFAP2A, as OCT4-SOX2 does in
    chick and human crest (PMID:36182685)? Or does it act at the border indirectly, through its ectodermal anti-BMP
    and anti-differentiation activities?
- question: Should the neural crest formation annotation be shared with Oct-91 (B7ZQA9) and the S homeolog? The
    morpholinos hit pou5f3.1 and pou5f3.2 (L and S), and either paralog rescues.
- question: 'Nomenclature: UniProt names Q7T103 pou5f1.1, whereas Xenbase, RefSeq-linked literature and York 2024
    use pou5f3.2. Should UniProt adopt the Pou5f3 nomenclature to avoid paralog confusion?'
suggested_experiments:
- description: Paralog-specific CRISPR F0 knockouts of pou5f3.2 vs pou5f3.1 (both homeologs), scoring pax3, snai2,
    foxd3 and sox10 at the border. This would test whether Oct-25 alone is required for crest formation, separately
    from its gastrula germ-layer role (for example by using stage-restricted, hormone-inducible dominant-negative
    constructs).
- description: CUT&RUN for Oct-25 in neural plate border explants (Pax3/Zic1- or Wnt/chordin-induced animal caps)
    compared with blastula caps, to test reuse versus retargeting of Oct-25 binding sites and co-occupancy with
    Sox3 and Tfap2a.
- description: Swap the Oct-25 C-terminal domain and the pou3-distinguishing linker residues (MAPK and SUMO sites)
    into Pou3 and back. This would map the residues responsible for pou5-specific crest-promoting activity.
