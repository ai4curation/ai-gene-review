  review:
    summary: Oct-25 represses VegT- and beta-catenin/Tcf3-activated Xnr1 and Siamois promoters even when its own
      octamer site is mutated, by joining VegT and Tcf3 complexes on their sites. The same protein-interaction mode
      represses Gsc and Mix2 through FoxH1/Smad2/WBSCR11.
    action: NEW
    reason: Reporter assays with site mutants (full text) show repression that does not need Oct-25's own DNA binding
      and depends on partner transcription factors, which defines corepressor activity. The authors state this function
      explicitly, and PMID:18922797 shows the same mode for nodal targets (VP16- and EVE-fusions both repress).
      This is the most informative description of how Oct-25 restrains inducing signals. It complements, rather
      than replaces, its sequence-specific activator activity on octamer sites.
