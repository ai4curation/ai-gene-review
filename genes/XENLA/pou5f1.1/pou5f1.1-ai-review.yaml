  review:
    summary: Zygotic Oct25 (pou5f3.2) and Oct91 (pou5f3.1) are expressed at the neural plate border and in early
      crest. Depleting both (L and S morpholinos) nearly abolishes snai2 and foxd3 and reduces pax3. Oct25 alone
      rescues, and Oct25 gain of function expands border and crest markers.
    action: NEW
    reason: 'Synthesis: (1) expression in border/crest cells; (2) a DNA-binding transcription factor whose POU5
      orthologs (OCT4) bind neural crest enhancers with TFAP2A in chick/human (PMID:36182685) and are required for
      cranial crest ectomesenchyme in mouse (PMID:33542111); (3) LOF with paralog-specific rescue by this protein;
      (4) GOF expands border and crest. Layer: competence factor carried from the blastula, not a specifier. It
      is broadly ectodermal, it also promotes neural fate (sox3 expansion), and LOF lowers the border marker pax3
      as well as crest specifiers. Under the project convention it therefore takes GO:0014029, not GO:0014036. Participation:
      it is a transcription factor acting in the forming crest cells, not a substrate. Comparator check (QuickGO
      2026-10-07, queries in notes): no POU5 protein in human, mouse, rat, zebrafish, chicken or either Xenopus
      carries any neural crest term. The POU5 crest papers (2021-2024) are uncurated, while same-layer potency peers
      carry crest terms (id3-a GO:0014029 IMP; zebrafish mych GO:0014032 IMP; foxd3, snai1). So this is curation
      lag, not a convention. Caveat: the LOF hit pou5f3.1 and pou5f3.2 together.'
