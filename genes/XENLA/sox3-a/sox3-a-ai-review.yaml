      (a transcriptional step, not mere necessity). Rescue by a Sox3-EnR repressor and by a Nodal inhibitor places
      the effect on Sox3 repression of nodal. The antibody may also block Sox3-B; the term is shared by both homeologs
      (sox3-b by ISS). Core maternal function.
