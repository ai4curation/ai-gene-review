  review:
    summary: 'Proposed: maternal Sox3, with Pou5f3, activates zygotic gene expression at the maternal-to-zygotic
      transition, binding enhancers of the genes it activates.'
    action: NEW
    reason: 'Phelps et al. 2023 performed CUT&RUN with V5-tagged Sox3.S (NM_001090679 = P55863, so the binding data
      are specific to this homeolog) and morpholino knockdown with RNA-seq, including under cycloheximide to isolate
      primary activation. Genes that fail to activate lie near Sox3/Pou5f3-bound enhancers, whereas up-regulated
      genes do not. Participation: Sox3 is the sequence-specific activator bound at the regulatory elements of activated
      genes, so it performs a step of the process. Comparator (QuickGO 2026-10-07): zebrafish sox19b (Q9DDD7, a maternal
      SoxB1) and zebrafish pou5f3 both carry GO:0141064 by IMP (PMID:35145080); same role, same term. Caveat: the
      strongest loss-of-function effects need combined sox3 and pou5f3 morpholinos.'
    supported_by:
    - reference_id: PMID:37787392
      supporting_text: Together, our findings establish the pluripotency factors Pou5f3.3 and Sox3 as maternal activators
        of embryonic genome activation, which are differentially recruited to the two homeologous subgenomes of X.
    - reference_id: PMID:37787392
