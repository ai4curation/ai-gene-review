  review:
    summary: Blocking maternal Sox3 DNA binding (antiSOX3c antibody) shifts mesoderm and endoderm markers animally,
      raises endoderm markers and Xnr5, and causes gastrulation failure, rescued by a Sox3-EnR repressor or by Cerberus-short.
