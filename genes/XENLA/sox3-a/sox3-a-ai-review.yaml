suggested_questions:
- question: Combined Sox2 and Sox3 morpholinos abolish the competence of blastula animal-pole cells to form mesoderm
    and endoderm (Buitrago-Delgado 2018). Only mammalian SOX2 carries stem cell population maintenance terms; no SOX3
    does in any species (QuickGO 2026-10-07). Should frog Sox3 carry such a term for blastula pluripotency? The same
    question is open for sox2, id3-a, myc-a, snai1 and lin28a.
- question: Forced SoxB1 activity at the neural plate border lowers foxd3 and snail2, and Sox3 overexpression delays
    crest specification. But no Sox3 loss of function expands the crest, and no SoxB1 protein in any species carries
    a neural crest process term, positive or negative (QuickGO 2026-10-07). Is there loss-of-function evidence that
    endogenous Sox3 limits crest formation (which would support GO:0090301), or is Sox3's exclusion from the crest
    a consequence of crest specifiers repressing it (cf. Snail2–Sox3 reciprocal repression in amniote gastrulation)?
- question: Sox3 represses Xnr5 through DNA binding but activates sox2, geminin and zygotic genes. Should it also
    carry GO:0001227 (repressor activity), or GO:1900108 negative regulation of nodal signaling pathway (no SoxB1 carries
    it yet), or is repression partner-dependent and best left at the process level?
- question: The module knowledge gap describes OCT4–SOX2 redeployed to TFAP2A-bound crest enhancers. In frog, the
    blastula Oct–Sox pair is Pou5f3–Sox3 at genome-activation enhancers, and Sox3 is excluded from definitive crest
    by neurula. Does any Oct–SoxB1 complex act at frog crest enhancers, or does Oct25 partner with SoxE there?
- question: All experimental rows are on sox3-a (sox3.S); sox3-b (Q5FWM3, presumably sox3.L) carries only ISS copies,
    and UniProt lists "sox11" as a synonym for sox3-b. Should the synonym be corrected, and do the two homeologs differ
    in maternal versus zygotic expression?
suggested_experiments:
- hypothesis: Sox3 alone, not only SoxB1 jointly, is required for blastula competence and zygotic genome activation,
    and Sox3.L and Sox3.S act redundantly.
  description: F0 CRISPR knockout of sox3.L, sox3.S or both (maternal-effect via oocyte host transfer), scoring zygotic
    gene activation by RNA-seq and animal-cap competence to respond to activin.
  experiment_type: CRISPR knockout
- hypothesis: Sox3 must be actively repressed at the neural plate border, and its persistence there blocks crest
    specification.
  description: CUT&RUN for Snai2, Sox9/10 and Sox3 in dissected border tissue at stages 12-14, combined with border-restricted
    sox3 knockdown or knockout to test whether the crest domain expands.
  experiment_type: ChIP-seq
