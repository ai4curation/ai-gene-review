taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Sox3-A (xSox3, xSox-B1; Xenbase sox3.S) is a SoxB1-group HMG-box transcription factor of Xenopus laevis.
  Its HMG box binds A/T-rich Sox motifs (AACAAT, AACAAAG), and in the early embryo it occupies thousands of enhancers,
  often with Pou5f3 factors at Oct-Sox composite sites. It is a maternal factor: the RNA is most abundant in early
  oocytes and the protein is localised to the animal hemisphere of the egg, cytoplasmic at first and increasingly
  nuclear as development proceeds. Acting as a sequence-specific repressor, animal Sox3 binds the promoter of the
  VegT/beta-catenin target Xnr5 and, with induction of Nodal antagonists (Ectodermin, Xema, Coco), restricts
  nodal-related gene expression to the vegetal hemisphere, setting the normal pattern of germ-layer formation.
  Acting as an activator, Sox3 together with Pou5f3 drives zygotic genome activation, with differential recruitment
  to the L and S subgenomes. With Sox2 it is required for the competence of pluripotent blastula animal-pole cells
  to respond to mesoderm- and endoderm-inducing signals. Sox3 is the only SoxB1 factor expressed throughout naive
  ectoderm before neural induction; it is induced and maintained by BMP antagonism and FGF, directly activates the
  early neural genes sox2 and geminin, and is required for BMP-inhibition-mediated neural induction. By the end of
  gastrulation Sox3 is confined to the neural plate and preplacodal region and is excluded from the neural crest,
  where SoxE factors take over; forced SoxB1 activity at the neural plate border lowers crest specifier expression,
  and SoxB1 cannot replace SoxE in crest induction. Later it marks brain, otic vesicle, branchial arches and lens,
  and in adults is mainly ovarian. SoxB1 blastula and neural functions are ancestral in chordates, and the
  downregulation of SoxB1 in premigratory crest with a switch to SoxE is conserved in lamprey.'
