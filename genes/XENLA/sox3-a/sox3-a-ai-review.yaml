- term:
    id: GO:0021990
    label: neural plate formation
  evidence_type: IMP
  original_reference_id: PMID:18992330
  review:
    summary: 'Proposed: Sox3 is required in naive ectoderm for neural induction by BMP inhibition and directly activates
      early neural plate genes.'
    action: NEW
    reason: 'Sox3 is the only SoxB1 expressed throughout the ectoderm before neural induction. A Sox3 morpholino blocks
      Noggin-induced neural markers in explants, and MO-resistant sox3 RNA rescues. Sox3 directly (cycloheximide-resistant)
      activates sox2 and geminin. Combined Sox2/Sox3 depletion blocks Chordin neural induction, rescued by Sox3 (Buitrago-Delgado
      2018). GO has no neural induction term; GO:0021990 is defined as formation of the neural plate from ectoderm
      in response to signals from dorsal mesoderm, which is this process. Participation: Sox3 is the transcription
      factor that activates the neural plate programme in responding cells. Comparator (QuickGO 2026-10-07): no SoxB1
      carries GO:0001840 or its descendants, but frog sox2 carries the broader GO:0007399 by IMP for equivalent neural-induction
      experiments, and zebrafish and mouse Sox3 carry nervous-system descendants. The gap is one of granularity, not
      a convention against SoxB1 in neural induction.'
    supported_by:
    - reference_id: PMID:18992330
      supporting_text: With morpholino-mediated knockdown of Sox3, we demonstrate that it is required for induction
        of neural tissue by BMP inhibition.
    - reference_id: PMID:18992330
      supporting_text: We were able to rescue this phenotype by injecting sox3 mRNA in which the Sox3MO annealing
        sequence was mutated
    - reference_id: PMID:30144418
      supporting_text: We first showed that morpholino-mediated depletion of Sox2 and Sox3 prevented chordin-mediated
        neural induction (Figure 6A–B).
