- term:
    id: GO:0003714
    label: transcription corepressor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0000575
  - PANTHER:PTN000919548
  review:
    summary: >-
      Phylogenetic inference of corepressor activity for the Id family (seeded from
      Drosophila extramacrochaetae).
    action: MODIFY
    reason: >-
      The family membership is right but the molecular function term is not. GO defines
      a corepressor as acting by binding a DNA-binding transcription factor at a specific
      genomic locus. Id proteins work the other way round: they lack a basic region,
      heterodimerise with bHLH proteins off DNA, and prevent those complexes from binding
      E-boxes. Xenopus Id3 disrupts myogenic factor/E-protein DNA binding and also
      disrupts Stat3-FGFR4 complex formation. GO:0140416 transcription regulator inhibitor
      activity describes this sequestration mechanism and is the term used for
      experimentally characterised mammalian ID1, ID2 and ID4.
    proposed_replacement_terms:
    - id: GO:0140416
      label: transcription regulator inhibitor activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000919548
        comment: >-
          Id-family ancestral node. The inhibitory regulator role is correctly inherited
          by Id3, but the corepressor term implies action as a cofactor on DNA-bound TFs;
          the inherited activity is better typed as transcription regulator inhibitor
          activity.
        source_status: SUPPORTS_TRANSFER
      - source_id: FB:FBgn0000575
        comment: >-
          Drosophila emc, an HLH protein without a basic region that antagonises
          proneural bHLH factors; supports the inhibitory function, not a DNA-bound
          corepressor mechanism.
        source_status: SUPPORTS_TRANSFER
    supported_by:
    - reference_id: PMID:7734394
      supporting_text: >-
        disrupts binding of myogenic factor/E-protein complexes to DNA in vitro
    - reference_id: PMID:7619724
      supporting_text: >-
        The activity of bHLH transcription factors that are involved in cell
        determination and differentiation is inhibited by Ids, HLH proteins lacking the
        basic amino acid sequence element.
    - reference_id: file:XENLA/id3-a/id3-a-deep-research-falcon.md
      supporting_text: >-
        Id proteins retain an HLH dimerization region but lack the basic DNA-binding
        region characteristic of basic HLH (bHLH) transcription factors.
