- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: IMP
  original_reference_id: PMID:15769946
  qualifier: involved_in
  review:
    summary: >-
      Kee and Bronner-Fraser: Id3 is expressed at the neural plate border; morpholino
      depletion removes neural crest precursors through cell-cycle arrest and death of
      the progenitor pool, not through a fate switch; overexpression expands the crest.
    action: MODIFY
    reason: "Loss of function, gain of function and expression all point to Id3 being needed to build the neural crest progenitor pool. The authors state that this is independent of cell fate determination. Fate specification (GO:0014036) or fate commitment (GO:0014034) would overstate the role. Id3 acts as a progenitor maintenance and competence factor, downstream of the border signals. GO:0014029 is proposed for obsoletion (projects/NEURAL_CREST_FORMATION_OBSOLETION.md): its definition describes forming the neural plate border region while its placement is under epithelial to mesenchymal transition. This gene's role is keeping crest progenitors undifferentiated and competent, captured by the proposed term 'neural crest progenitor maintenance' (NTR)."
    proposed_replacement_terms:
    - id: NTR
      label: neural crest progenitor maintenance
    supported_by:
    - reference_id: PMID:15769946
      supporting_text: >-
        Morpholino oligonucleotide-mediated depletion of Id3 results in the absence of
        neural crest precursors and a resultant loss of neural crest derivatives.
    - reference_id: PMID:15769946
      supporting_text: >-
        This appears to be mediated by cell cycle inhibition followed by cell death of
        the neural crest progenitor pool, rather than a cell fate switch.
    - reference_id: PMID:15769946
      supporting_text: >-
        overexpression of Id3 increases cell proliferation and results in expansion of
        the neural crest domain
