id: Q91399
gene_symbol: id3-a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: >-
  Id3 (inhibitor of DNA binding 3; L-homeolog id3.L, with S-homeolog id3-b) is a small
  nuclear helix-loop-helix (HLH) protein that lacks the basic DNA-binding region of bHLH
  transcription factors. It heterodimerises with bHLH proteins such as E proteins
  (Tcf3/E12-E47) and acts as a dominant-negative inhibitor: it prevents myogenic and
  neurogenic bHLH/E-protein complexes from binding E-box DNA and so blocks their
  transcriptional activation (for example of MyoD- and NeuroD-driven programmes). It also
  binds and antagonises the bHLH-Orange repressor Hairy2/Hes4 and disrupts Stat3-FGFR4
  complex formation. Id3 is expressed after the midblastula transition in pluripotent
  blastula ectoderm, then at the neural plate border and in premigratory and early
  migratory neural crest, and in eye, otic, myotome and other proliferating progenitor
  domains. It is induced by BMP, Notch and Myc. In the neural crest it is required to keep
  progenitors cycling, surviving and undifferentiated, and so is needed for formation of
  the multipotent neural crest progenitor pool; overexpression expands the crest domain and
  delays differentiation of crest derivatives. It therefore acts as a progenitor
  maintenance and competence factor downstream of the border signals, rather than as a
  border specifier or a DNA-binding crest fate specifier. The HLH inhibitor activity is
  ancestral to chordates (amphioxus Id is expressed in mesoderm and endoderm), whereas Id
  expression at the neural plate border and dorsal neural tube appeared early in the
  vertebrate lineage, which makes Id3 an example of co-option of a pre-existing regulator
  into the neural crest network.
