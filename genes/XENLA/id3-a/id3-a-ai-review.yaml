core_functions:
- description: >-
    Dominant-negative HLH inhibitor of transcription regulators. Id3 lacks a basic
    region and heterodimerises through its HLH domain with bHLH proteins, notably E
    proteins (Tcf3/E12-E47), preventing myogenic and neurogenic bHLH/E-protein complexes
    from binding E-box DNA and activating target genes (MyoD, NeuroD). The same
    sequestration logic applies to its other partners in the neural plate border: it
    binds and antagonises the bHLH-Orange repressor Hairy2/Hes4 and disrupts
    Stat3-FGFR4 complexes. It acts in the nucleus.
  molecular_function:
    id: GO:0140416
    label: transcription regulator inhibitor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0043392
    label: negative regulation of DNA binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7734394
    supporting_text: >-
      disrupts binding of myogenic factor/E-protein complexes to DNA in vitro and
      inhibits transactivation of the E-box regulated cardiac actin gene by MyoD in
      embryonic tissue
  - reference_id: PMID:14651922
    supporting_text: >-
      Id3 blocks only neuroD activity in our assays
  - reference_id: PMID:18721802
    supporting_text: >-
      Id3 protein, which physically interacts with Hairy2, negatively regulates Hairy2
      activity
  - reference_id: PMID:19851287
    supporting_text: >-
      Stat3 activation is also modulated by Hairy2 and Id3 proteins that,
      respectively, facilitate and disrupt Stat3-FGFR4 complex formation.
- description: >-
    Maintenance of the neural crest progenitor pool. Acting downstream of the neural
    plate border signals (BMP, Notch, Myc, FGF-Stat3, Hairy2), Id3 keeps neural crest
    progenitors cycling, surviving and undifferentiated until they are ready to
    differentiate, and is therefore required for neural crest formation. Loss of Id3
    arrests the cell cycle and kills the progenitors without a fate switch;
    overexpression expands the crest domain and delays differentiation of crest
    derivatives. This places Id3 in a progenitor maintenance and competence layer shared
    with the blastula potency programme (the Myc-Id3 axis), rather than among the border
    specifiers or the DNA-binding crest fate specifiers.
  molecular_function:
    id: GO:0140416
    label: transcription regulator inhibitor activity
  directly_involved_in:
  - id: GO:0045787
    label: positive regulation of cell cycle
  - id: GO:0045596
    label: negative regulation of cell differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15769946
    supporting_text: >-
      This appears to be mediated by cell cycle inhibition followed by cell death of
      the neural crest progenitor pool, rather than a cell fate switch.
  - reference_id: PMID:15769946
    supporting_text: >-
      overexpression of Id3 increases cell proliferation and results in expansion of
      the neural crest domain
  - reference_id: PMID:15772131
    supporting_text: >-
      forced expression of Id3 maintains the expression of markers of the neural crest
      progenitor state beyond the time when they would normally be downregulated and
      blocks the differentiation of neural crest derivatives
  - reference_id: PMID:18721802
    supporting_text: >-
      However, Id3 is required to allow Hairy2 to promote neural crest formation.
  - reference_id: PMID:25931449
    supporting_text: >-
      This model is supported by a shared requirement for Myc protein, and its
      transcriptional target Id3, in both neural crest cell genesis and ES cell
      pluripotency
proposed_new_terms:
- proposed_name: neural crest progenitor maintenance
  proposed_definition: The process by which neural plate border and premigratory neural crest progenitor
    cells are kept in an undifferentiated, proliferative and multipotent state until neural crest specification.
  justification: GO:0014029 neural crest formation, which these factors currently carry, is proposed for
    obsoletion (projects/NEURAL_CREST_FORMATION_OBSOLETION.md). Competence factors (Myc, Id3, Hairy2,
    Pou5f3/Oct25) are required for crest to form, but loss causes progenitor arrest or death rather than
    a change of fate, and sustained activity blocks differentiation, so neither crest cell differentiation
    nor fate specification describes their role. GO:0019827 stem cell population maintenance is the parent;
    the new term says which progenitor population is maintained.
  proposed_parent:
    id: GO:0019827
    label: stem cell population maintenance
  supported_by:
  - reference_id: PMID:15769946
    supporting_text: This appears to be mediated by cell cycle inhibition followed by cell death of the
      neural crest progenitor pool, rather than a cell fate switch.
  - reference_id: PMID:15769946
    supporting_text: overexpression of Id3 increases cell proliferation and results in expansion of the
      neural crest domain
suggested_questions:
- question: >-
    GO has no neural plate border formation/specification term. Id3 is expressed at
    the border but acts downstream of border signals, as a progenitor maintenance
    factor. If a border term is created, should Id3 be excluded from it (in contrast to
    Pax3, Zic1, Msx1, Tfap2a and Hairy2), so that the term keeps the border-specifier
    layer distinct?
- question: >-
    Is GO:0019827 stem cell population maintenance (or a neural crest-specific
    progenitor maintenance term) a better description of the Id3 role than neural crest
    formation, given that forced Id3 maintains progenitor markers and that Id3 is shared
    with the blastula and ES-cell potency programme? Is there Xenopus evidence that Id3
    is required in blastula cells, rather than only co-expressed with Oct/Sox/Vent?
- question: >-
    Which bHLH partner(s) does Id3 sequester in neural crest progenitors to prevent
    p27Xic1 induction and cell-cycle exit? Are E proteins the relevant partners, or is
    Hairy2/Stat3 antagonism sufficient to explain the phenotype?
- question: >-
    Do id3.L (Q91399) and id3.S (Q7SZ28) differ in expression or activity? All
    experimental annotations are attached to id3-a, while id3-b carries ISS copies; the
    morpholinos used most likely targeted both homeologs.
- question: >-
    Amphioxus Id is expressed in mesoderm and endoderm but not at the neural plate
    border, while lamprey Id is expressed in neural crest. Was Id co-opted into the
    border by acquiring BMP/Notch/Myc-responsive enhancers in the vertebrate ancestor,
    and does amphioxus Id protein retain the same bHLH-inhibitory activity (that is,
    a purely cis-regulatory co-option)?
suggested_experiments:
- hypothesis: >-
    Id3 maintains neural crest progenitors by sequestering E proteins and thereby
    preventing activation of cell-cycle inhibitors such as p27Xic1.
  description: >-
    In Id3 morphant or CRISPR F0 Xenopus embryos, rescue with wild-type Id3, the V59N HLH
    mutant, or Id3 variants engineered to bind E proteins but not Hairy2 (or the
    reverse). Score proliferation (pH3, EdU), p27Xic1 expression and neural crest markers,
    and use proximity labelling in neural plate border explants to identify the Id3
    partners in vivo.
- hypothesis: >-
    The Id3 neural crest function is cis-regulatory co-option of an ancestral HLH
    inhibitor.
  description: >-
    Test whether amphioxus Id and lamprey Id protein rescue Xenopus Id3 loss of
    function in the neural crest, and compare Xenopus id3 neural plate border enhancers
    (BMP response element, Su(H) sites, Myc E-boxes) with amphioxus Id regulatory
    regions in reporter assays in Xenopus and chick.
- hypothesis: >-
    id3.L and id3.S contribute redundantly to neural crest progenitor maintenance.
  description: >-
    Generate homeolog-specific CRISPR mutants of id3.L and id3.S, singly and in
    combination, and assay neural crest marker expression and progenitor proliferation.
