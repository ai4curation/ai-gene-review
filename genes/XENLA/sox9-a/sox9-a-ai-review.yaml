    reason: Correct but imprecise. Combined Xenopus evidence places Sox9 in the crest specifier layer.
      Loss of Sox9 removes crest progenitors and expands the neural plate; Sox9 is required for Wnt-driven
      induction and for specification, but not for migration. GO:0014036 neural crest cell fate specification,
