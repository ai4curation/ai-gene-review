suggested_questions:
- question: Should Xenopus SoxE experimental annotations to GO:0014029 neural crest formation be refined
    to GO:0014036 neural crest cell fate specification? GO lacks a neural plate border formation/specification
    term, so border specifiers (Pax3, Zic1, Msx1) and crest specifiers (Sox9, Sox10, Snai2, FoxD3) currently
    both end up under neural crest formation, and that conflates two network layers.
- question: Do the Sox9 morpholinos and mRNAs used in the Xenopus studies (PMID:11807034, PMID:15464575,
    PMID:15084460) target both sox9-a (L) and sox9-b (S)? If so, should the experimental annotations be
    shared with the sox9-b homeolog (Q6DFF5)?
- question: Lamprey SoxE paralogs arose by duplications independent of the gnathostome Sox8/9/10 split
    (PMID:21889937). Which lamprey SoxE gene carries the Sox9-like chondrogenic crest role, and can any
    PAINT node assert neural crest specification above the gnathostome SoxE duplication?
- question: Which crest enhancers does Sox9 directly occupy in Xenopus (e.g. sox10, snai2, foxd3)? Does
    the SUMO switch at K61/K365 alter DNA occupancy or co-factor recruitment?
suggested_experiments:
- hypothesis: Sox9 directly activates crest specifier genes at the neural plate border.
  description: CUT&RUN or ChIP-seq for Sox9 (homeolog-resolved by tagged sox9-a/sox9-b alleles) in dissected
    Xenopus neural folds at stage 13-15, combined with ATAC-seq after Sox9 knockdown, to identify directly
    bound and Sox9-dependent crest enhancers.
  experiment_type: ChIP-seq
- hypothesis: sox9-a and sox9-b are functionally equivalent and jointly required.
  description: Homeolog-specific CRISPR F0 knockouts of sox9-a, sox9-b and both together, scoring sox10/snai2/foxd3
    expression at the border, otic Pax8 expression and Alcian blue-stained cranial cartilage.
  experiment_type: genetic knockout
