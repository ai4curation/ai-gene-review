- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: IMP
  original_reference_id: PMID:11807034
  qualifier: involved_in
  review:
    summary: Sox9 morpholino causes loss of neural crest progenitors and expansion of the neural plate.
    action: MODIFY
    reason: 'Correct, but more precise annotation is possible. The phenotype is a fate switch: crest progenitors
      are lost and the neural plate expands. This is the signature of a neural crest specifier, not a
      border specifier. The same laboratory then showed that Sox9 is required for crest specification
      but not for migration, and that it is needed for Wnt-driven crest induction. Sox9 comes on at the
      border after Sox8 and before Sox10. Taken together with this evidence, Sox9 belongs in the specifier
      layer of the network, and GO:0014036 neural crest cell fate specification, a descendant of neural
      crest formation, describes the work it does.'
    proposed_replacement_terms:
    - id: GO:0014036
      label: neural crest cell fate specification
    additional_reference_ids:
    - PMID:15464575
    supported_by:
    - *id008
    - *id009
    - &id020
      reference_id: PMID:15464575
      supporting_text: Wnt-mediated neural crest induction is inhibited in the context of Sox9-depleted
        embryos
