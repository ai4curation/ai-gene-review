  review:
    summary: Phylogenetic inference of a role in chondrocyte differentiation.
    action: ACCEPT
    reason: Chondrogenesis is the conserved core role of Sox9 across vertebrates. In Xenopus, Sox9 depletion
      removes neural crest-derived cranial skeletal elements, including Meckel's cartilage. Lamprey Sox9
      is co-expressed with Col2a1 throughout skeletogenesis, so the chondrogenic programme predates the
      agnathan-gnathostome split. Sox9 acts directly in this process as the transcriptional activator
      of the chondrocyte programme.
