id: B7ZR65
gene_symbol: sox9-a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Sox9-a is the L-subgenome homeolog of Xenopus laevis Sox9 (the S homeolog is sox9-b). It
  is a SoxE-group HMG-box transcription factor that binds ACAAAG/AACAAT-type motifs in enhancers and activates
  RNA polymerase II transcription through C-terminal transactivation domains. Maternal transcripts are
  present, and zygotic expression begins at mid-gastrula at the lateral edges of the neural plate, after
  Sox8 and before Sox10. It persists in migrating cranial neural crest cells as they populate the pharyngeal
  arches and is also expressed in the otic placode and vesicle, eye, genital ridges, notochord and pancreas.
  Sox9 is a neural crest specifier. It is required for Wnt-dependent induction and specification of neural
  crest progenitors, but not for their migration; when it is depleted, crest progenitors are lost and
  the neural plate expands. Sox9 is later required for chondrogenesis of crest-derived cranial cartilage,
  its deeply conserved vertebrate role. It is also required for otic placode specification. Its developmental
  output is modulated by SUMOylation at K61 and K365, which biases the protein between crest and melanocyte-promoting
  activities and otic-promoting activities. SoxE proteins are largely interchangeable in these assays.
  The chondrogenic SoxE programme is ancestral: lamprey Sox9 is co-expressed with type II collagen, and
  amphioxus SoxE lacks neural crest enhancers. Its deployment in the neural crest therefore arose through
  vertebrate-specific cis-regulatory recruitment.'
