core_functions:
- description: >-
    Cytosolic UDP-N-acetylglucosamine pyrophosphorylase that condenses UTP with
    N-acetylglucosamine 1-phosphate to form UDP-GlcNAc, the last step of hexosamine
    biosynthesis. This is inferred from PANTHER SF4 subfamily membership and the
    PAINT eukaryotic UAP node, with all human substrate-contact residues conserved.
    Because the frog product lacks the AGX2 insert, it may also use
    N-acetylgalactosamine 1-phosphate, but that has not been tested.
  molecular_function:
    id: GO:0003977
    label: UDP-N-acetylglucosamine diphosphorylase activity
  directly_involved_in:
  - id: GO:0006048
    label: UDP-N-acetylglucosamine biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id002
  - *id004
  - reference_id: PMID:11707391
    supporting_text: 'we

      have solved the crystal structures of AGX1 and AGX2 in complexes with UDPGlcNAc'
suggested_questions:
- question: What are the relative GlcNAc-1-phosphate and GalNAc-1-phosphate catalytic efficiencies of
    frog Uap1.S? Its domain layout matches human AGX1, which prefers GalNAc-1-P, so should GO:0052630
    (UDP-N-acetylgalactosamine diphosphorylase activity) be added at the vertebrate UAP1 PAINT node, where
    it is currently not propagated?
- question: Does X. laevis produce an insert-bearing (AGX2-like) uap1.S or uap1.L transcript, and do the
    two homeologs differ in expression or substrate preference?
suggested_experiments:
- description: Express recombinant Q6DCZ6 and measure kinetics with UTP plus GlcNAc-1-P, GalNAc-1-P and
    Glc-1-P (LC-MS product identification), alongside human AGX1 and AGX2 controls.
