      residues are conserved.
    supporting_text: 'UniProt UDP-GlcNAc/UDP-GalNAc binding-site residues conserved in frog: 15 of 15.'
  - statement: The only gap matches the human AGX2-specific insert (residues 454-470, absent from isoform
      AGX1).
    supporting_text: 'Human positions with no frog counterpart: 454-470.'
  - statement: Human Arg453 is required for the IRF3 interaction and IRF3 pyrophosphorylation; it is leucine
      in the frog protein.
