    action: NEW
    summary: A PAINT IBD for cytosol is placed on the same eukaryotic UAP node (PTN000237224, seeded by
      human UAP1 and Arabidopsis AT5G52560) as the catalytic function. The frog SF4 protein descends from
      that node but has no location annotation yet, probably because the cytosol IBD (2025-12) postdates
