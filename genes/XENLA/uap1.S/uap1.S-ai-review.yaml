- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    action: NEW
    summary: >-
      Proposed cytosol location. PAINT placed an IBD for GO:0005829 at the same
      eukaryote-level UAP node (PTN000237224) that carries the activity
      and process the frog gene already inherits. That IBD is seeded by human UAP1
      (UniProt cytosol, ECO:0000269 from PMID:8025165) and an Arabidopsis member.
      The frog product has no signal peptide, transmembrane segment or organelle
      targeting sequence beyond what is shared with the cytosolic human enzyme. Its
      products, UDP-GlcNAc and UDP-GalNAc, are made in the cytosol and then
      transported into the ER/Golgi. The PAINT node already asserts this location,
      so it is not a manufactured gap; the TreeGrafter set for Q6DCZ6 simply lacks
      it. The PAINT file also records an IRD NOT cytosol at PTN007553518, but in the
      PANTHER tree that node subtends only a protist subclade (trypanosomatid, Giardia,
      Trichomonas, Plasmodium, Paramecium, stramenopile members). Q6DCZ6 sits under
      PTN000237224 and not under PTN007553518, as do human UAP1 and S. pombe uap1,
      which both receive the IBA.
