  review:
    action: ACCEPT
    summary: >-
      Accepted. The enzyme itself catalyzes the last step that forms UDP-GlcNAc
      from GlcNAc-1-phosphate and UTP, so it does part of the work of this
      biosynthetic process and is not merely needed for it. PAINT placed the same
      process at the eukaryotic UAP node (PTN000237224). Downstream glycosylation
      processes that consume UDP-GlcNAc are deliberately not annotated.
