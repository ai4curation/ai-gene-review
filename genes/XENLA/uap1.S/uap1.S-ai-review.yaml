suggested_questions:
- question: Does frog Uap1.S, which lacks the AGX2 17-residue insert, prefer GalNAc-1-phosphate over GlcNAc-1-phosphate
    as human AGX1 does? PAINT did not propagate UDP-N-acetylgalactosamine diphosphorylase activity (GO:0052630)
    to the eukaryotic UAP node, so it is not annotated here.
- question: Does Xenopus generate an AGX2-like insert-containing uap1 isoform by alternative splicing, or
    is the AGX1/AGX2 splice specific to mammals?
- question: Human UAP1 also pyrophosphorylates IRF3 (Ser386), but the frog protein has leucine at the position
    of human Arg453, which is needed for the IRF3 interaction. Is that activity conserved outside mammals?
suggested_experiments:
- description: Express recombinant Uap1.S and Uap1.L and measure kcat/Km for GlcNAc-1-P and GalNAc-1-P
    with UTP, in the forward direction, using a coupled pyrophosphatase/phosphate assay.
