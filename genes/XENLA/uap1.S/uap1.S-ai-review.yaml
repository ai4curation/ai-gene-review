- id: PMID:11707391
  title: 'Crystal structures of two human pyrophosphorylase isoforms in complexes with UDPGlc(Gal)NAc:
    role of the alternatively spliced insert in the enzyme oligomeric assembly and active site architecture.'
  full_text_unavailable: false
  findings:
  - statement: Human AGX1 and AGX2 structures with bound UDP-GlcNAc and UDP-GalNAc identify the nucleotide-sugar
      contacts and show that the active site is selective for N-acetylhexosamines.
    supporting_text: These extensive contacts suggest a specificity of the enzyme for acetylated hexosamine
  - statement: AGX1 and AGX2 differ by a 17-residue alternatively spliced peptide. AGX1 is more active
      with GalNAc-1-P and AGX2 with GlcNAc-1-P. The frog protein lacks the equivalent of this peptide.
    supporting_text: AGX1 was 2- to 3-fold more active with GalNAc1P as a substrate while AGX2 was 8-fold
      more active with GlcNAc1P
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Residue numbering in the paper's I-loop discussion (Arg453, Lys455)
      is on AGX1 and was mapped to the canonical sequence in the bioinformatics report.
