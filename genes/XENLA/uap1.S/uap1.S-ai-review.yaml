id: Q6DCZ6
gene_symbol: uap1.S
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: Xenopus laevis uap1.S encodes a UDP-N-acetylhexosamine pyrophosphorylase that is predicted
  to convert UTP and N-acetylglucosamine-1-phosphate to UDP-N-acetylglucosamine. This reaction supplies
  an activated sugar nucleotide for cellular glycosylation pathways. The complete UAP-like architecture
  and conserved nucleotide-sugar contacts support the assignment; the relative GlcNAc and GalNAc substrate
  preferences of the frog protein have not been measured.
