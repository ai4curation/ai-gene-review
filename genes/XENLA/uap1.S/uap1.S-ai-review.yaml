id: Q6DCZ6
gene_symbol: uap1.S
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: >-
  uap1.S is the S-subgenome homeolog of UAP1 in the allotetraploid frog Xenopus
  laevis and encodes a 507-residue UDP-N-acetylhexosamine pyrophosphorylase of the
  UDPGP type 1 family (PANTHER PTHR11952:SF4). By orthology to human UAP1 and yeast
  Uap1p/QRI1, it is expected to catalyze the final step of the hexosamine
  biosynthetic pathway, the UTP-dependent conversion of N-acetylglucosamine
  1-phosphate to UDP-N-acetylglucosamine (UDP-GlcNAc) and diphosphate, in the
  cytosol. UDP-GlcNAc is the donor substrate for N- and O-linked glycosylation,
  O-GlcNAcylation, GPI-anchor and glycosaminoglycan synthesis. The frog product
  conserves every human UDP-HexNAc contact residue but lacks the 17-residue insert
  that distinguishes human isoform AGX2 from AGX1, so its domain layout matches the
  AGX1 isoform. Human AGX1 is 2-3 times more active with N-acetylgalactosamine
  1-phosphate in vitro, so the frog enzyme may also make UDP-GalNAc. No
  experiment on the frog protein itself has been reported.
