    action: MODIFY
    summary: >-
      The term is correct but too broad. GO:0003977 is_a GO:0070569 (checked in
      OLS), and the subfamily-level evidence supports the specific
      N-acetylglucosamine-1-phosphate uridylyltransferase reaction, which the gene
      already carries. The IPR002618 UDPGP family signature also covers
      UDP-glucose pyrophosphorylases. It therefore cannot tell which sugar is used;
      the SF4 subfamily placement and the conserved N-acetylhexosamine-binding
      residues settle that.
