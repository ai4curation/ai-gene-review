id: Q6DCZ6
gene_symbol: uap1.S
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: uap1.S is the S-subgenome homeolog of the Xenopus laevis UDP-N-acetylhexosamine
  pyrophosphorylase (UAP1), a member of the UDPGP type 1 (UDP-sugar pyrophosphorylase) family. By orthology
  to human UAP1, it is expected to catalyse the final step of the hexosamine biosynthetic pathway, the
  reversible condensation of UTP with N-acetylglucosamine 1-phosphate to give UDP-N-acetylglucosamine
  and diphosphate, in the cytosol. UDP-GlcNAc is the amino-sugar donor for N- and O-linked glycosylation,
  O-GlcNAcylation, GPI anchors and glycosaminoglycans. The 507-residue frog product keeps every human
  nucleotide-sugar contact residue, but it lacks the 17-residue insert that distinguishes the human AGX2
  isoform from AGX1. In human, AGX1 is somewhat more active on GalNAc 1-phosphate, so the frog enzyme may
  also make UDP-GalNAc. No frog-specific biochemical, localization or genetic data are available.
