core_functions:
- description: Catalyses UTP + N-acetyl-alpha-D-glucosamine 1-phosphate to UDP-N-acetylglucosamine + diphosphate,
    the terminal step of the hexosamine biosynthetic pathway, in the cytosol. This is inferred from PANTHER
    SF4 and PAINT eukaryotic-UAP node placement and from full conservation of the human UAP1 active site.
