  review:
    action: ACCEPT
    summary: >-
      Accepted as the core activity. The TreeGrafter assignment follows PAINT's
      eukaryote-level IBD for GO:0003977 (node PTN000237224, seeded by experimental
      annotations on human UAP1, yeast QRI1, Candida, Drosophila, rat and
      Arabidopsis members). Q6DCZ6 is in the same PANTHER subfamily as human UAP1
      (PTHR11952:SF4, UDP-N-acetylhexosamine pyrophosphorylase) and not in a
      UDP-glucose pyrophosphorylase subfamily. My re-review alignment conserves all
      15 human UDP-GlcNAc/UDP-GalNAc contact positions, so there is no sign of loss
      or divergence on the frog lineage. The only gene-specific loss PAINT records
      (an IKR NOT) is in nematodes.
    reason: >-
      The function rests on an evolutionary inference (subfamily membership plus
      PAINT node placement), backed by direct enzymology of the human and fungal
      orthologs and by full conservation of the human substrate-pocket residues.
      There is no frog-specific assay.
