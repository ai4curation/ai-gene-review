- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: IMP
  original_reference_id: PMID:16943273
  qualifier: involved_in
  review:
    summary: Sox8 morpholino knockdown delays induction of neural crest progenitors and blocks crest migration
      into the periphery, disrupting multiple crest lineages.
    action: MODIFY
    reason: 'Combined evidence places Sox8 in the neural crest specifier layer. (1) Expression: Sox8 appears
      at the lateral edges of the neural plate at mid-gastrula, before Sox9 and Sox10. (2) Upstream regulation:
      it is induced by the border specifiers Pax3 and Zic1 among the earliest NC specifiers (with snail1 and
      myc). (3) Loss of function: knockdown delays, but does not abolish, progenitor induction; the authors
      attribute the later lineage defects to failed migration. (4) Redundancy: any SoxE rescues the morphant,
      and SoxE activities are conserved. Neural crest cell fate specification (GO:0014036) is the precise
      process for the specification phenotype. The authors explicitly conclude that the downstream lineage
      defects reflect a migration failure rather than a specification or survival deficit, so neural crest
      cell migration (GO:0001755) is also proposed. Whether this migration requirement is separate from delayed
      specification is unresolved (cache is abstract-only; see suggested questions), so migration is not
      treated as core.'
    proposed_replacement_terms:
    - id: GO:0014036
      label: neural crest cell fate specification
    - id: GO:0001755
      label: neural crest cell migration
    supported_by:
    - reference_id: PMID:16943273
      supporting_text: Although morpholino-mediated knockdown of Sox8 protein did not prevent the formation
        of neural crest progenitors, the timing of their induction was severely affected
    - reference_id: PMID:16943273
      supporting_text: We demonstrate that these defects are due to the inability of neural crest cells
        to migrate into the periphery, rather than to a deficiency in neural crest progenitors specification
        and survival
    - reference_id: PMID:23509273
      supporting_text: a group of early genes ( snail1 , sox8 , and myc ) was activated during early neurulation
        (between stages 12 and 15)
    - reference_id: PMID:33424631
      supporting_text: The neural crest can be rescued in Sox8 morphants by any of the SoxE factors suggesting
        there is functional redundancy between the SoxE factors
