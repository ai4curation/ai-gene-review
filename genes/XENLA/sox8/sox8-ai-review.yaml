taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Sox8 is a SoxE-group HMG-box transcription factor of Xenopus laevis, paralogous to Sox9 and
  Sox10. It has an N-terminal dimerisation region, a central HMG box that binds and bends DNA in the minor
  groove, and middle (TAM) and C-terminal (TAC) transactivation domains, and it acts in the nucleus as
  an RNA polymerase II sequence-specific transcription factor. Low-level transcripts are present in the
  blastula but disappear by the onset of gastrulation. Zygotic expression then begins at mid-gastrula at
  the lateral edges of the neural plate, in the prospective neural crest, before Sox9 and Sox10, which makes
  Sox8 the first SoxE factor deployed in the frog crest. Sox8 is induced there by the neural plate border
  specifiers Pax3 and Zic1 as part of the first wave of neural crest specifier genes (with snail1 and
  myc). Expression persists in migrating cranial crest populating the pharyngeal arches and in trunk crest,
  and later in the otic vesicle. Knockdown of Sox8 delays the induction of neural crest progenitors and
  impairs their migration into the periphery, so that multiple crest-derived lineages develop abnormally;
  the neural crest of Sox8 morphants can be rescued by any SoxE factor. Sox8 therefore acts as an early,
  partly redundant neural crest specifier downstream of the border module. The prominence of Sox8 is
  species-specific: in chick and mouse Sox9 is the first SoxE in the crest and Sox8 is largely dispensable,
  and zebrafish sox8 is not expressed in neural crest. Gnathostome Sox8/9/10 and lamprey SoxE1-3 arose
  by independent duplications, and amphioxus SoxE lacks neural crest enhancers. The crest-specifier role
  thus belongs to the vertebrate SoxE group, recruited into the crest by cis-regulatory change, and is
  allocated differently among paralogs in different lineages.'
