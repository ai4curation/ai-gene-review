- description: Sequence-specific RNA polymerase II transcription factor acting as the earliest SoxE neural
    crest specifier in Xenopus. Induced by the border specifiers Pax3 and Zic1 at mid-gastrula, it times
    the onset of neural crest progenitor gene expression (redundantly with Sox9 and Sox10). It is needed
    for the crest to migrate and populate its derivatives.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0014036
    label: neural crest cell fate specification
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16943273
    supporting_text: Although morpholino-mediated knockdown of Sox8 protein did not prevent the formation
      of neural crest progenitors, the timing of their induction was severely affected
  - reference_id: PMID:23509273
    supporting_text: a group of early genes ( snail1 , sox8 , and myc ) was activated during early neurulation
      (between stages 12 and 15)
  - reference_id: PMID:33424631
    supporting_text: The neural crest can be rescued in Sox8 morphants by any of the SoxE factors suggesting
      there is functional redundancy between the SoxE factors
suggested_questions:
- question: GO has no neural plate border formation/specification term. Sox8 is the clearest example of
    an NC specifier induced by the border module, and frog Sox8 expression defines the border/presumptive
    crest domain most clearly. Without a border term, border specifiers and early NC specifiers can only be
    separated by GO:0014029 versus GO:0014036. Should a neural plate border specification term be proposed
    (project-level decision)?
- question: Is the migration defect of Sox8 morphants a separate requirement for Sox8 in migrating crest,
    or a consequence of delayed specification (premigratory programme not yet complete when neighbouring
    tissues move)? This decides whether neural crest cell migration (GO:0001755) is a direct Sox8 process.
- question: Does frog Sox8 act as an activator (GO:0001228) on specific NC enhancers (e.g. sox10, snai2,
    foxd3), and which targets are direct?
- question: The early crest-specifier role is carried by different SoxE paralogs in different lineages
    (Sox8 in frog, Sox9 in chick/mouse, sox9a/b in zebrafish, SoxE1/2 in lamprey, which duplicated independently).
    Should orthology-based transfer of the frog Sox8 specifier role to other species' sox8 genes (e.g. zebrafish,
    where sox8 is not expressed in crest) be avoided, with the role annotated on whichever paralog carries
    it?
suggested_experiments:
- hypothesis: Sox8 directly binds enhancers of later NC specifier genes (sox10, snai2, foxd3) at stages
    11.5-13 in Xenopus.
  description: CUT&RUN for tagged Sox8 in Pax3-GR/Zic1-GR-induced animal caps and dissected neural folds,
    integrated with ATAC-seq and RNA-seq of sox8 F0 CRISPR mutants or morphants.
  experiment_type: genomic binding assay
- hypothesis: Sox8 is required in migrating crest independently of its early specification role.
  description: Deplete Sox8 only after specification (e.g. inducible dominant-negative Sox8 or degron
    activated at stage 17-19) and assay crest emigration in vivo and in cranial crest explant migration
    assays.
  experiment_type: genetic perturbation
