- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: IGI
  original_reference_id: PMID:15691759
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q3B8L1
  review:
    summary: 'IGI with msx1 (Q3B8L1): Msx1 and Pax3 are both required for neural crest formation, and Pax3 acts
      downstream of Msx1.'
    action: ACCEPT
    reason: 'Core annotation. Pax3 is a neural plate border specifier: expressed early in the lateral neural plate
      border before crest specifiers, induced by Wnt/FGF via Msx1, and required for the border territory to give
      rise to crest. GO:0014029 is defined as the formation of the region of ectoderm between neural plate and non-neural
      ectoderm, which is exactly the level at which a border specifier acts (pending project convention: NC specifiers
      narrowed to GO:0014036, border/competence genes keep GO:0014029). No GO term for neural plate border formation
      exists; see suggested_questions.'
    supported_by:
    - reference_id: PMID:15691759
