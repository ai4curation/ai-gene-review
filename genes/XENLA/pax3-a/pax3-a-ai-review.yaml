core_functions:
- description: Neural plate border specifier. Induced by Wnt/FGF via Msx1 in the lateral neural plate border during
    gastrulation, before crest specifiers, Pax3 activates its own gene and, together with border partners, establishes
    the border territory from which neural crest arises.
  molecular_function: &id012
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0014029
    label: neural crest formation
  locations:
  - &id013
    id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15691759
    supporting_text: Msx1 and Pax3 are both required for neural crest formation, display overlapping but nonidentical
      activities, and that Pax3 acts downstream of Msx1.
  - reference_id: PMID:15843410
    supporting_text: Pax3 and Zic1 are expressed in an overlapping manner in the presumptive neural crest area of
      the Xenopus gastrula, even prior to the onset of the expression of the early bona fide neural crest marker
      genes Foxd3 and Slug.
  - &id015
    reference_id: PMID:24360906
    supporting_text: These data show that Pax3 exerts a positive autoregulation on its own transcription and suggest
      new putative regulatory elements mediating this regulation.
  - reference_id: PMID:18562679
    supporting_text: Ectodermal Zic and Pax3/7 expression marks the neural plate border, and amphioxus SoxB1-a expression
      labels the entire neural plate.
- description: Initiation of neural crest fate. With Zic1, Pax3 directly activates the crest specifiers (snail1/2,
    foxd3, twist1, tfap2b, and sox8/sox9) and the pair is necessary and sufficient for full crest determination;
    Pax3 acts as the upstream inducer of commitment rather than as a specifier itself.
  molecular_function: *id012
  directly_involved_in:
  - id: GO:0014034
    label: neural crest cell fate commitment
  locations:
  - *id013
  supported_by:
  - reference_id: PMID:24360906
    supporting_text: We demonstrated that the neural border specifiers Pax3 and Zic1 are direct upstream regulators
      of neural crest specifiers Snail1/2, Foxd3, Twist1, and Tfap2b.
  - &id014
    reference_id: PMID:24360906
    supporting_text: We showed that Pax3 binds efficiently to snail2 oligonucleotide but much less to the oligonucleotide
      mutated in the putative binding site (Figure 4D).
  - reference_id: PMID:15843410
    supporting_text: Misexpression of both Pax3 and Zic1 together efficiently induces ectopic neural crest differentiation
      in the ventral ectoderm, whereas overexpression of either one of them only expands the expression of neural
      crest markers within the dorsolateral ectoderm.
  - reference_id: PMID:23509273
    supporting_text: coactivating transcription factors Pax3 and Zic1 not only initiate neural crest specification
      from various early embryonic lineages in Xenopus and chicken embryos but also trigger full neural crest determination.
- description: Sequence-specific Pol II transcriptional activation through paired-domain/homeodomain binding to
    cis-regulatory elements, the activity underlying its developmental roles.
  molecular_function: *id012
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - *id013
  supported_by:
  - *id014
  - *id015
suggested_questions:
- question: GO has no term for neural plate border formation or specification; GO:0014029 neural crest formation
    (formation of the ectodermal region between neural plate and non-neural ectoderm) is used here for border specifiers.
    Should a dedicated neural plate border term be created, which would also accommodate border-derived non-crest
    fates (hatching gland, preplacodal ectoderm, Rohon-Beard neurons)?
- question: All experimental Pax3 rows are duplicated on pax3-a (Q645N4, pax3.S) and pax3-b (Q0IH87, pax3.L), while
    the reagents were generic Pax3 morpholinos/mRNAs. Do both homeologs contribute equally at the border, or has
    one subfunctionalised?
- question: Mammalian Pax3 carries neural crest migration and pigmentation terms but no neural crest formation/commitment
    terms, while frog Pax3 carries the reverse. Should Splotch-derived crest data and frog border data be reconciled
    across orthologs (e.g. is mammalian Pax3 required for crest induction, given Pax7 redundancy in chick/mouse)?
- question: Is the vertebrate-specific step in the Pax3/7 border module a change in the protein (ability to co-activate
    crest specifier enhancers with Zic) or in the cis-regulatory elements of the targets (snail2, foxd3, sox8)?
suggested_experiments:
- description: Test whether amphioxus Pax3/7, with amphioxus Zic, can substitute for Xenopus Pax3 in the Pax3+Zic1
    animal-cap crest induction assay and bind/activate the frog snail2 Pax3 site, to separate protein from cis-regulatory
    evolution.
- description: Homeolog-specific knockdown or CRISPR F0 knockout of pax3.L vs pax3.S, scoring border markers (msx1,
    zic1), crest specifiers (snai2, foxd3, sox8) and hatching gland (xhe).
- description: CUT&RUN/ChIP for endogenous Pax3 at gastrula stage 12 to confirm in vivo occupancy of the snail2
    and pax3 elements identified by EMSA, and to determine whether Pax3 and Zic1 co-occupy crest specifier enhancers.
