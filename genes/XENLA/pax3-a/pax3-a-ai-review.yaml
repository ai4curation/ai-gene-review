  evidence_type: IGI
  original_reference_id: PMID:15843410
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O73689
  review:
    summary: 'IGI with zic1 (O73689) in Sato et al. 2005: co-activation of Pax3 and Zic1 determines neural crest
      fate; together they induce ectopic crest in ventral ectoderm and their co-presence is essential for initiating
      crest differentiation.'
    action: ACCEPT
    reason: Core. Beyond forming the border, Pax3 with Zic1 directly activates the crest specifiers (snail1/2, foxd3,
      twist1, tfap2b; sox8 and sox9 in a second screen) and the pair is sufficient for full crest determination
      including migration and differentiation of derivatives. Commitment (which includes the inductive initiation
      of the fate) is the right level for this upstream inducer; GO:0014036 fate specification was not added because
      it is a part_of descendant of this term and the specification proper is executed by the downstream specifiers.
    supported_by:
    - reference_id: PMID:15843410
