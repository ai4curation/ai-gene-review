gene_symbol: pax3-a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Paired box protein Pax-3-A is the S-subgenome homeolog of Xenopus Pax3, a nuclear transcription factor
  of the Pax3/7 subgroup that binds DNA through a paired domain and a paired-type homeodomain. Pax3 is one of the
  earliest neural plate border specifiers: Wnt and FGF signals from the underlying mesoderm, acting partly through
  Msx1, induce it in the lateral and posterior neural plate during gastrulation, before the onset of neural crest
  specifier genes. Together with Zic1 it directly activates neural crest specifiers (snail1/2, foxd3, twist1, tfap2b,
  sox8, sox9) and positively autoregulates its own gene, and the Pax3-Zic1 pair is both necessary and sufficient
  to induce neural crest, including migration and differentiation of crest derivatives. Acting without Zic1, Pax3
  instead promotes hatching gland fate, so the relative levels of Pax3 and Zic1 partition the border into neural
  crest, hatching gland and preplacodal fates. Pax3 is also expressed in the dorsal neural tube. Border expression
  of Pax3/7 is conserved in amphioxus, placing Pax3 in the ancestral chordate border layer of the neural crest gene
  regulatory network; the direct wiring to crest specifier genes is a vertebrate feature.'
