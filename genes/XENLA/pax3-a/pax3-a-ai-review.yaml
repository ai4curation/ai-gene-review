        activities, and that Pax3 acts downstream of Msx1.
    - reference_id: PMID:24360906
      supporting_text: The combined activity of the neural border specifiers establishes a robust neural border
        territory during gastrulation
    - reference_id: PMID:15843410
      supporting_text: Pax3 and Zic1 are expressed in an overlapping manner in the presumptive neural crest area
