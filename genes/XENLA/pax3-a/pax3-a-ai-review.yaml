      blocks FGF8-dependent crest induction.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The epistasis is real and is respected here, but it places Pax3 downstream of FGF8 as a transcription
      factor whose expression and activity are required for the crest outcome of the signal, i.e. a target/output
