  review:
    summary: Positive regulation of endothelial cell migration, transferred from human ETS1 (IMP, PMID:15592518).
    action: KEEP_AS_NON_CORE
    reason: Ets1 is a conserved endothelial transcription factor and frog ets-1 is expressed in hemangioblastic
