- term:
    id: GO:0001755
    label: neural crest cell migration
  evidence_type: IMP
  original_reference_id: PMID:25691536
  review:
    summary: Ets1 knockdown in Xenopus neural crest disrupts collective migration and segregation of cranial
      and cardiac crest streams; transplantation shows the requirement is within the crest.
    action: NEW
    reason: Synthesis of expression in premigratory and migratory crest, crest-autonomous loss of function
      in frog (morpholino and transplantation), chick gain/loss of function, and downstream migratory
      targets (msmb3). Ets1 acts as a transcription factor within the migrating cells, the same role in
      which other Xenopus TFs (sox10.S, snai2.S, hic1.L, kmt2d.L) carry this term. Note that frog reagents
      targeted both homeologs.
    supported_by:
