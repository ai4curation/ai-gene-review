suggested_questions:
- question: Should Ets1 be annotated to neural crest cell fate specification? In chick it directly activates
    the Sox10E2 enhancer needed for initial Sox10 expression in cranial crest, but in Xenopus combined
    ets1a/ets1b knockdown leaves early foxd3/snai2 expression largely intact. Is this a species difference,
    homeolog redundancy, or a sign that Ets1 acts after specification?
- question: GO has no neural plate border specification/formation process term. Ets1 is not a border gene
    (its onset follows Brn3c/Lhx5/Dmbx1 and depends on Tfap2b), but should a border term be created so
    that border specifiers and late crest specifiers such as Ets1 can be distinguished in annotation?
- question: Do ets1a (ets1.S, P18755) and ets1b (ets1.L) have divergent roles in Xenopus neural crest
    versus heart mesoderm, given that ets1b is reported to be more prominent in presumptive crest and
    all loss-of-function reagents target both?
- question: Is the HDAC1-dependent repression of id3 seen on overexpression a physiological activity of
    endogenous Ets1 in crest cells, or a dosage artefact?
suggested_experiments:
- hypothesis: ets1a and ets1b make separable contributions to neural crest delamination/migration and
    to endocardium formation.
  description: Generate homeolog-specific CRISPR F0 mutants (ets1.S vs ets1.L) in X. laevis, assay delamination,
    stream segregation (sox10, twist1) and endocardial markers, and rescue with each homeolog mRNA.
- hypothesis: Endogenous Ets1 directly occupies and activates cranial crest enhancers (Sox10E2 orthologous
    region, msmb3, alx1) in Xenopus.
  description: CUT&RUN with an epitope-tagged knock-in ets1 allele on dissected premigratory cranial crest,
    combined with ATAC-seq after ets1 knockdown and enhancer-reporter mutagenesis of bound ETS sites.
- hypothesis: Deploying Ets1 in lamprey premigratory crest is sufficient to confer gnathostome-like cranial
    delamination behaviour.
  description: Electroporate gnathostome or lamprey Ets1 under a lamprey crest enhancer into lamprey embryos
    and score delamination timing, cell recruitment and Sox10 enhancer activity.
