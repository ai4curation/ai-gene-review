- term:
    id: GO:0036032
    label: neural crest cell delamination
  evidence_type: IMP
  original_reference_id: PMID:25691536
  review:
    summary: Ets1 is required for neural crest delamination from the neural tube in Xenopus, and in chick
      it is required and sufficient for the cranial-type mass recruitment and basal lamina breaching that
      make up cranial delamination.
    action: NEW
    reason: Frog crest-targeted knockdown shows delamination defects, and chick gain and loss of function
      show that ets-1 drives cranial delamination (sufficient for ectopic delamination; dominant-negative
      blocks cranial but not trunk delamination). This is the most specific process for which Ets1 is
      both necessary and sufficient. Chick SOX9 carries the same term.
    supported_by:
    - reference_id: PMID:25691536
      supporting_text: Using a translation-blocking antisense morpholino to knockdown Ets1 protein selectively
        in the NC, we observed defects in NC delamination from the neural tube, collective cell migration,
        as well as segregation of NC streams in the cranial and cardiac regions.
    - reference_id: PMID:17987123
      supporting_text: We show that ets-1 promotes massive cell recruitment and induces local degradations
        of the basal lamina, two separable events which are sufficient to initiate ectopic delaminations.
    - reference_id: PMID:17987123
      supporting_text: Altogether, these data show a specific requirement of ets-1 in cranial NCCs delamination.
