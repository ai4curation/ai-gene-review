  review:
    summary: Sequence-specific RNA polymerase II DNA-binding transcription factor activity, inherited
      from the ETS family PAINT node.
    action: ACCEPT
    reason: P18755 has a canonical ETS DNA-binding domain and the ETS-family function as an RNA polymerase
      II sequence-specific transcription factor is conserved and experimentally established for the vertebrate
      orthologs (e.g. direct binding of chick Ets1 to the cranial Sox10E2 enhancer; Xenopus Ets1a occupancy
      of the id3 promoter). Correct core molecular function at an appropriate level.
    supported_by:
    - reference_id: PMID:20139305
      supporting_text: ChIP, DNA-pull down, and gel-shift assays demonstrate their direct binding to the
        Sox10E2 enhancer in vivo, whereas mutation of their corresponding binding sites, or inactivation
        of the three upstream regulators, abolishes both reporter and endogenous Sox10 expression.
    - reference_id: file:XENLA/ets1-a/ets1-a-deep-research-falcon.md
      supporting_text: FLAG-tagged frog Ets1a occupied its predicted binding region in embryo chromatin-immunoprecipitation
        assays.
