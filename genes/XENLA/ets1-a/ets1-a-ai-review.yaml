id: P18755
gene_symbol: ets1-a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Xenopus laevis c-Ets-1-A (Ets1a; the S-subgenome ets1 homeolog) is an ETS-family sequence-specific
  transcription factor with an N-terminal pointed (PNT/SAM) domain, a transactivation region and a C-terminal
  ETS winged helix-turn-helix DNA-binding domain whose DNA binding is autoinhibited by flanking helices.
  It acts in the nucleus, mainly as an activator of RNA polymerase II target genes, but can also repress
  targets by recruiting HDAC1 (e.g. the BMP-responsive id3 promoter). In the embryo ets1 is expressed
  in premigratory and migrating neural crest, especially cranial and cardiac crest, and in hemangioblastic,
  endothelial and endocardial precursors. Within the neural crest gene regulatory network it belongs to
  the crest-specifier layer rather than the neural plate border layer: in amniotes it is switched on after
  the border genes, downstream of Tfap2b, as part of a cranial-identity circuit with Sox8 and Tfap2b,
  and it directly activates the cranial Sox10E2 enhancer. In frog its loss impairs neural crest delamination,
  collective migration and stream segregation rather than initial crest induction, and it is separately
  required in heart mesoderm for endocardium and heart-tube formation. Expression of Ets1 in premigratory/migratory
  crest is absent in lamprey but present in skate, so its recruitment into the crest programme appears
  to be a gnathostome innovation.'
