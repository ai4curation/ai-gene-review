        induction activities of FoxD3 are dependent on a C-terminal domain, as well as specific DNA-binding
        activity conferred by the forkhead domain.
    - &id002
      reference_id: PMID:24252777
      supporting_text: Amphioxus and vertebrate (Xenopus) FoxD proteins both exhibited transcriptional
        repressor activity in Gal4 transactivation assays and bound to similar DNA sequences in vitro.
