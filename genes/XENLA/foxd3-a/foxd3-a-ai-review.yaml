  review:
    summary: 'Based on Sasai et al. 2001: dominant-negative FoxD3 inhibits neural crest differentiation;
      presumably neural-crest-derived neuronal/peripheral markers were reduced.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The loss-of-function phenotype reflects failure of neural crest determination, from which
      neural derivatives secondarily fail; the CNS marker Sox2 was not suppressed. This is an indirect,
      downstream consequence of FoxD3's role in neural crest fate commitment (already annotated), and
      it conflicts in sign with the GO:0050768 annotation from overexpression. In mouse, Foxd3 maintains
      neural potential of crest progenitors, which is better captured by crest-progenitor terms than by
      generic neurogenesis. Full text not available, so not removed.
