- term:
    id: GO:0001707
    label: mesoderm formation
  evidence_type: IMP
  original_reference_id: PMID:17138566
  qualifier: involved_in
  review:
    summary: FoxD3 knockdown/antagonism and gain-of-function in the Xenopus gastrula show that FoxD3,
      acting as a Groucho-dependent repressor in the Spemann organizer, maintains Nodal-related gene expression
      needed for dorsal mesoderm formation.
    action: KEEP_AS_NON_CORE
    reason: The organizer/mesoderm function is well supported in Xenopus (FoxD3 morpholino blocks axis
      formation and organizer Nodal expression; FoxD3 induces mesoderm non-cell-autonomously via Nodal).
      The mechanism is indirect (a repressor maintaining Nodal expression, likely through derepression
      of an unidentified inhibitor), but FoxD3 is a genuine transcriptional regulator in the organizer,
      so the process annotation is acceptable. It is an early, separate deployment from the neural crest
      role and is not conserved as an organizer function in the outgroup sense (amphioxus FoxD is in mesoderm/notochord,
      which is consistent with an ancestral mesodermal deployment). Kept as non-core.
    supported_by:
    - reference_id: PMID:17138566
      supporting_text: In the gastrula, FoxD3 functions as a transcriptional repressor in the Spemann
        organizer to maintain the expression of Nodal-related members of the transforming growth factor-beta
        superfamily that induce dorsal mesoderm formation.
    - &id005
      reference_id: PMID:17092955
      supporting_text: Therefore, FoxD3 is required for Nodal expression in the Spemann organizer and
        this function is essential for dorsal mesoderm formation.
    - &id012
      reference_id: PMID:17092955
      supporting_text: Engrailed-FoxD3, but not VP16-FoxD3, was identical to native FoxD3 in mesoderm-inducing
        activity, indicating that FoxD3 functions as a transcriptional repressor to induce mesoderm.
    - reference_id: file:XENLA/foxd3-a/foxd3-a-deep-research-falcon.md
      supporting_text: The relevant endogenous inhibitor and any direct FoxD3-bound regulatory element
        were **not identified** in these experiments.
