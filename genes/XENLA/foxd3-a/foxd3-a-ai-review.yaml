id: Q9DEN4
gene_symbol: foxd3-a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Forkhead box protein D3-A (FoxD3, XFD-6) is the L-homeolog copy of Xenopus laevis foxd3,
  a nuclear forkhead/winged-helix transcription factor that acts as a sequence-specific transcriptional
  repressor. Repression requires DNA binding by the forkhead domain and a C-terminal eh1/GEH motif that
  recruits Groucho/TLE corepressors (Grg4/tle4). foxd3 is expressed in pluripotent blastula animal cells,
  in the Spemann organizer at gastrula stages, and then in the presumptive and premigratory neural crest,
  where it is downregulated as crest cells migrate and differentiate. In the gastrula organizer it maintains
  Nodal-related gene expression required for dorsal mesoderm formation. At the neural plate border it
  acts as a neural crest specifier downstream of Zic/Wnt inputs and is required for Slug induction and
  neural crest determination; it also represses its own transcription. In other vertebrates Foxd3 maintains
  pluripotent epiblast cells and multipotent neural crest progenitors, and in zebrafish it first acts
  as a pioneer factor before switching to repression. FoxD3 recruitment to the neural crest is a vertebrate
  innovation: amphioxus FoxD is not expressed at the neural plate border, and a vertebrate-specific N-terminal
  motif confers the neural-crest-inducing activity that the ancestral FoxD repressor lacks.'
