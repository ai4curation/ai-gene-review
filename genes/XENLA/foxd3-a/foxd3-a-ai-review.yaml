- term:
    id: GO:0014034
    label: neural crest cell fate commitment
  evidence_type: IMP
  original_reference_id: PMID:11493569
  qualifier: involved_in
  review:
    summary: Dominant-negative FoxD3 (FoxD3delN) blocks neural crest marker expression in vivo without
      affecting the CNS marker Sox2; FoxD3 overexpression induces neural crest markers in embryos and
      ectodermal explants; FoxD3 is required for Slug induction by Zic factors.
    action: ACCEPT
    reason: 'This is the core developmental process and the correct network layer. Multiple lines of evidence
      converge: expression in presumptive neural crest from late gastrula (overlapping Zic-r1, similar
      to Slug); sufficiency (induces neural crest markers in explants; vertebrate FoxD3 including Xenopus
      induces ectopic neural crest in chick neural tube); loss-of-function (dominant-negative blocks crest,
      rescued by Slug); network position downstream of the border specifier Zic and upstream of Slug;
      and the mouse requirement for Foxd3 in neural crest progenitors. FoxD3 is therefore a neural crest
      specifier, not a neural plate border specifier. GO:0014034 (commitment) is appropriately pitched:
      the data cover both specification and the ''determination'' language of the authors, so neither
      child term (GO:0014036 specification, GO:0014035 determination) is clearly preferable. Caveats:
      the dominant-negative construct may interfere with related FoxD factors, and assays do not distinguish
      the L/S homeologs.'
    supported_by:
    - &id015
      reference_id: PMID:11493569
      supporting_text: Expression of FoxD3 in the presumptive neural crest region starts at the late gastrula
        stage in a manner similar to that of Slug, and overlaps with that of Zic-r1.
    - &id016
      reference_id: PMID:11493569
      supporting_text: When overexpressed in the embryo and in ectodermal explants, FoxD3 induces expression
        of neural crest markers.
    - &id010
      reference_id: PMID:11493569
      supporting_text: Attenuation of FoxD3-related signaling by a dominant-negative FoxD3 construct (FoxD3delN)
        inhibits neural crest differentiation in vivo without suppressing the CNS marker Sox2.
    - &id017
      reference_id: PMID:11493569
      supporting_text: Slug induction by Zic factors requires FoxD3-related signaling
    - &id018
      reference_id: PMID:24252777
      supporting_text: whereas vertebrate FoxD3 genes induced the differentiation of ectopic NCCs when
        overexpressed in chick neural tube, neither amphioxus FoxD nor any other vertebrate FoxD paralogs
        exhibited this activity.
    - reference_id: PMID:18367558
      supporting_text: Here, we report that Foxd3 is required for maintenance of the multipotent mammalian
        neural crest.
    - reference_id: file:XENLA/foxd3-a/foxd3-a-deep-research-falcon.md
      supporting_text: The historical experiments generally studied “Xenopus FoxD3/XFD-6” and did not
        resolve modern *X. laevis* homeologs; they therefore cannot automatically be assigned uniquely
        to Q9DEN4.
