suggested_questions:
- question: GO has no neural plate border specification/formation process term. FoxD3 sits downstream
    of the border specifiers (Zic, Pax3, Msx1, Tfap2a) and is not expressed at the amphioxus border; should
    a border term be created so that border specifiers and crest specifiers such as FoxD3 can be separated
    in annotation, rather than both being placed under neural crest fate commitment/formation?
- question: Should Xenopus FoxD3 carry a progenitor/potency maintenance process (e.g. stem cell population
    maintenance) given blastula expression and the mouse epiblast and neural crest progenitor requirements,
    or is that role not yet demonstrated by loss-of-function in frog?
- question: Do foxd3-a (L) and foxd3-b (S) differ in expression or activity, or should the experimental
    annotations currently attached only to foxd3-a also apply to foxd3-b (Q9DEN3)?
- question: Is the pioneer/chromatin-opening activity reported for zebrafish foxd3 in early neural crest
    conserved in Xenopus, and is there an appropriate GO molecular function term to capture pioneer activity
    distinct from repression?
- question: What does the vertebrate-specific FoxD3 N-terminal motif do biochemically (partner recruitment,
    activator function, chromatin access) to confer neural-crest-inducing activity absent from amphioxus
    FoxD?
suggested_experiments:
- hypothesis: FoxD3 directly occupies and represses (and early on primes) neural crest specifier and mesenchymal-fate
    enhancers in Xenopus neural crest.
  description: Homeolog-resolved CUT&RUN/ChIP-seq for FoxD3 and TLE4 in Xenopus neural crest explants
    (Wnt8+Chordin induced animal caps), combined with ATAC-seq after foxd3-a/foxd3-b morpholino or F0
    CRISPR, to define direct targets and test for a pioneer-to-repressor switch.
- hypothesis: The vertebrate N-terminal motif is required for FoxD3 neural crest activity in Xenopus.
  description: Rescue foxd3 knockdown in Xenopus with wild-type FoxD3, N-terminal-motif-deleted FoxD3,
    amphioxus FoxD, and amphioxus FoxD carrying the vertebrate N-terminal segment; score neural crest
    markers (snai2, sox10, twist1) and identify motif-dependent interacting proteins by IP-MS.
- hypothesis: FoxD3 maintains neural crest multipotency in Xenopus as in mouse.
  description: Late (post-specification) inducible inhibition of FoxD3 (hormone-inducible dominant-negative
    or degron) in Xenopus neural crest, followed by lineage tracing and single-cell RNA-seq to test for
    premature mesenchymal differentiation and loss of neural/glial derivatives.
