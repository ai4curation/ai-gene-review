- description: 'Neural crest specifier: acting as a transcriptional repressor at the neural plate border
    downstream of Zic and Wnt inputs, FoxD3 is necessary and sufficient for neural crest marker expression
    and is required for Slug induction, committing border cells to neural crest fate. This deployment
    (and the N-terminal motif that confers neural-crest-inducing activity) is vertebrate-specific.'
