  review:
    summary: Xenopus FoxD3 represses Pol II reporter transcription through sequence-specific forkhead
      DNA binding plus a C-terminal eh1/GEH motif that recruits Groucho/TLE corepressors; no activation
      domain was found.
    action: NEW
    reason: Multiple independent Xenopus studies (VP16/Engrailed fusions; Gal4 fusion reporter assays;
      Groucho recruitment; amphioxus/Xenopus Gal4 assays) converge on repressor activity, and repression
      is what is required for both mesoderm induction and neural crest effects. The general GO:0000981
      is correct but the repressor child is the informative molecular function. Zebrafish data suggest
      an earlier pioneer/activator phase in NC; this does not undermine the repressor annotation but is
      why GO:0000981 is retained.
