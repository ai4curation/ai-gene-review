  review:
    summary: Phylogenetic inference that FoxD3-A binds RNA polymerase II cis-regulatory DNA sequence-specifically
      via its forkhead (winged-helix) domain.
    action: ACCEPT
    reason: FoxD3 transcriptional repression and its developmental activities depend on sequence-specific
      DNA binding by the forkhead domain (DNA-contact mutant N140A/H144A is inactive), and Xenopus FoxD3
      binds DNA sequences in vitro similar to amphioxus FoxD. Forkhead DNA binding is ancestral to the
      FoxD subfamily, so the PAINT node placement is sound. Endogenous Xenopus target enhancers remain
      undefined.
