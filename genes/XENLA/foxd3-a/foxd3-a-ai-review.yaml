- term:
    id: GO:0050768
    label: negative regulation of neurogenesis
  evidence_type: IMP
  original_reference_id: PMID:11335115
  qualifier: involved_in
  review:
    summary: Based on Pohl and Knochel 2001, where FoxD3 overexpression enlarges the neural plate, abolishes
      neural crest formation and blocks differentiation and migration of transplanted crest cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype is an overexpression (gain-of-function) phenotype at high dose and an indirect
      consequence of disrupting neural crest progression; the abstract reports an enlarged neural plate,
      which does not obviously indicate reduced neurogenesis. A second Xenopus study (Sasai 2001) is annotated
      to the opposite-sign term (positive regulation of neurogenesis). FoxD3's work is done as a neural
      crest specifier/maintenance repressor; neurogenesis regulation is a downstream readout, not a process
      FoxD3 is known to execute. Full text not available, so not removed.
    supported_by:
    - reference_id: PMID:11335115
      supporting_text: Ectopic overexpression of FoxD3 leads to an enlargement of the neural plate concomitant
        with a failure in neural crest formation
    - reference_id: PMID:11335115
      supporting_text: Transplantation experiments show that FoxD3 overexpressing cells from the prospective
        neural crest do neither differentiate nor migrate.
    - *id007
