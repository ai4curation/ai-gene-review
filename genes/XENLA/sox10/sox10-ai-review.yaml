- term:
    id: GO:0019899
    label: enzyme binding
  evidence_type: IPI
  original_reference_id: PMID:16256735
  qualifier: enables
  supporting_entities:
  - UniProtKB:P63282
  review:
    summary: Interaction with the SUMO-conjugating enzyme Ubc9 (ube2i, P63282), reflecting Sox10 as a
      SUMOylation substrate.
    action: REMOVE
    reason: The interaction itself is not disputed (UniProt records interaction with ube2i and sumo1 and
      that Sox10 is SUMOylated), but 'enzyme binding' is an uninformative binding term that here records
      Sox10 being a substrate of the SUMO E2. The biology is regulation of Sox10 activity by SUMOylation,
      which is better captured on the enzyme side (has input) or as a PTM, not as a Sox10 molecular function.
    supported_by:
    - reference_id: file:XENLA/sox10/sox10-uniprot.txt
      supporting_text: Interacts with the sumoylation factors ube2i/ubc9 and sumo1
