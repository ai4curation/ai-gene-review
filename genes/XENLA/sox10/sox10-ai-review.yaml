  review:
    summary: Peripheral nervous system development (glia and sensory/autonomic ganglia from NC).
    action: KEEP_AS_NON_CORE
    reason: 'A conserved later lineage role: SOX10 drives glial programs (ERBB3, MPZ) in other vertebrates,
