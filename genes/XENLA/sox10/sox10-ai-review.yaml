- id: PMID:12812785
  title: Sox10 regulates the development of neural crest-derived melanocytes in Xenopus.
  findings:
  - statement: Sox10 is expressed at the lateral neural plate edges at gastrulation; overexpression expands
      the Slug domain (C-terminus sufficient) and greatly increases pigment cells; competence lost during
      gastrulation.
    supporting_text: Overexpression of Sox10 causes a dramatic expansion of the Slug expression domain
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; title and Xenopus Sox10 subject verified against PubMed record.
- id: PMID:12885557
  title: Sox10 is required for the early development of the prospective neural crest in Xenopus embryos.
  findings:
  - statement: Sox10 morpholino causes loss of NC precursors (slug, foxd3), increased apoptosis and decreased
      proliferation; Sox10 lies between Snail and Slug; also needed for melanocytes and ganglia.
    supporting_text: This effect of Sox10 depletion is produced during some of the earliest steps of neural
      crest specification
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; full-text details (rescue, penetrance) are taken from the deep-research
      summary.
- id: PMID:16256735
  title: SoxE factors function equivalently during neural crest and inner ear development and their activity
    is regulated by SUMOylation.
  findings:
  - statement: Sox9 and Sox10 are essential and functionally equivalent for NC precursor formation; SUMOylation
      directs SoxE activity to subsets of functions.
    supporting_text: Sox9 and the closely related factor Sox10 are essential for the formation of neural
      crest precursor cells
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; source of the IMP and the Ubc9 IPI.
- id: PMID:30144418
  title: A transition from SoxB1 to SoxE transcription factors is essential for progression from pluripotent
    blastula cells to neural crest cells.
  findings:
  - statement: Sox10 is not expressed in blastula pluripotent cells; it appears at the NPB by late gastrula/early
      neurula. Premature Sox10 represses pluripotency genes (HMG-dependent); Sox10 can replace SoxB1 for
      blastula pluripotency; Sox10 MO blocks NC markers in induced explants; SoxB1 cannot replace SoxE
      for NC.
    supporting_text: Sox9 and Sox10 do have the ability to maintain pluripotency, although they may do
      so less robustly than SoxB1 factors do
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; key for network-layer placement and the SoxB1-to-SoxE evolutionary
      argument.
- id: PMID:21889937
  title: 'SoxE gene duplication and development of the lamprey branchial skeleton: Insights into development
    and evolution of the neural crest.'
  findings:
  - statement: Lamprey has three SoxE genes required for branchial skeleton; duplications occurred independently
      from gnathostome Sox8/9/10.
    supporting_text: understanding the independent evolution of duplicated SoxE genes among agnathan and
      gnathostome vertebrates
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Evolutionary context only; no Xenopus sox10 data.
