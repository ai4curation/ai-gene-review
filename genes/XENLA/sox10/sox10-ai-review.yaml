    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000741645
  - UniProtKB:P48436
  review:
    summary: SoxE factors can repress as well as activate; premature Sox10 in Xenopus blastula represses
      pluripotency genes in an HMG-dependent manner, and SUMOylated SoxE recruit repressors.
    action: KEEP_AS_NON_CORE
    reason: Sox10 is predominantly a transcriptional activator (TAM/TAC domains; activation of the NC
      and melanocyte programs), but context-dependent repression is documented for SoxE proteins, including
      SUMO-dependent repression of melanocyte genes and HMG-dependent down-regulation of blastula pluripotency
      genes by Sox10 in Xenopus. The PAINT node (SoxE/Sox group) placement is reasonable; repression is
      a real but secondary mode, so keep as non-core.
    supported_by:
    - reference_id: PMID:30144418
      supporting_text: SoxE proteins can functions as activators or repressors depending upon whether
        they have been modified by Sumoylation
    - reference_id: PMID:30144418
      supporting_text: suggesting that the observed down-regulation of pluripotency genes by SoxE factors
        is dependent upon DNA binding
