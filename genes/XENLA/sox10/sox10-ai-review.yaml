- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: IMP
  original_reference_id: PMID:12885557
  qualifier: involved_in
  review:
    summary: Sox10 morpholino causes loss of NC precursors (Slug, FoxD3) at the earliest steps of NC specification,
      with expansion of neural plate and epidermis; Sox10 lies between Snail and Slug.
    action: MODIFY
    reason: 'The data place Sox10 in the NC-specifier layer, not the border layer: it is induced by Wnt/FGF
      and Snail within the NC domain and is required for expression of the specifier genes slug/snai2
      and foxd3, with surrounding tissues adopting neural plate/epidermal fates. Neural crest cell fate
      specification (part_of neural crest formation) captures this layer more precisely. The accompanying
