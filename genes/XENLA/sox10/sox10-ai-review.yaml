- term:
    id: GO:0001755
    label: neural crest cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:98358
  - PANTHER:PTN002910110
  - ZFIN:ZDB-GENE-011207-1
  review:
    summary: Sox10 is expressed in migrating cranial and trunk neural crest; mouse/zebrafish Sox10 mutants
      have NC migration/survival defects.
    action: KEEP_AS_NON_CORE
    reason: Sox10 is expressed in migrating NC in Xenopus, and the IBA reflects mouse and zebrafish sox10
      phenotypes. However, Sox10's primary contribution is specification and survival of non-ectomesenchymal
      NC lineages; migration defects in mutants are at least partly secondary to failed specification/survival.
      No Xenopus experiment isolates a migration role. Keep as non-core.
    supported_by:
    - reference_id: PMID:12885557
      supporting_text: It is expressed in prospective neural crest and otic placode regions from the earliest
        stages of neural crest specification and in migrating cranial and trunk neural crest cells
