  review:
    summary: Family-level SoxE inference (node includes Sox8/Sox9) to epithelial morphogenesis.
    action: KEEP_AS_NON_CORE
    reason: Epithelial morphogenesis is a dominant theme for Sox9 (and the node is SoxE-wide); mouse Sox10
      is among the descendant evidences. For Xenopus sox10 the relevant epithelium would be the otic placode/vesicle,
      where Sox10 is expressed and SoxE factors act in inner ear development. Plausible but peripheral
      to Sox10's NC and lineage roles; keep as non-core.
    supported_by:
