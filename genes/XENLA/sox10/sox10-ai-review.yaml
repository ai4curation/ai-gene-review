gene_symbol: sox10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Sox10 is a SoxE-group (Sox8/Sox9/Sox10) HMG-box transcription factor that binds specific
  cis-regulatory DNA and regulates RNA polymerase II transcription, mainly as an activator through middle
  and C-terminal transactivation domains, with activity tuned by SUMOylation. In Xenopus it is switched
  on at late gastrula/early neurula within the neural crest-forming region at the neural plate border,
  downstream of Wnt and FGF signalling and Snail, after the neural plate border specifiers and after SoxB1
  (Sox2/Sox3) expression has withdrawn to the neural plate. It acts as a neural crest specifier: it is
  required, redundantly with Sox8 and Sox9, for expression of slug/snai2, foxd3 and sox9 and for survival
  and proliferation of premigratory neural crest precursors, and its overexpression expands the neural
  crest domain. Unlike most neural crest potency factors it is not expressed in pluripotent blastula cells,
  yet it can substitute for SoxB1 in maintaining blastula pluripotency, consistent with SoxE factors taking
  over part of the potency-maintaining Sox function in neural crest. Sox10 is later redeployed in migrating
  crest and in neural crest-derived lineages, most clearly melanocytes (it is sufficient to expand and
  required for the pigment cell lineage) and peripheral ganglia and glia, and is also expressed in the
  otic placode and vesicle. SoxE-group recruitment into the neural plate border/neural crest network is
  thought to be a vertebrate novelty; lamprey SoxE genes duplicated independently of the gnathostome Sox8/Sox9/Sox10
  paralogs.'
