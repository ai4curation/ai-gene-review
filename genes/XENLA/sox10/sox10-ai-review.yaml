      supporting_text: This effect of Sox10 depletion is produced during some of the earliest steps of
        neural crest specification
    - reference_id: PMID:12885557
      supporting_text: Sox10 may lie between Snail and Slug in the genetic cascade that controls neural
        crest development
    - reference_id: PMID:12885557
      supporting_text: produce a loss of neural crest precursors and an enlargement of the surrounding
