suggested_questions:
- question: GO has no neural plate border specification/formation process term, so border specifiers (pax3,
    zic1, msx1, tfap2a) and NC specifiers such as sox10 can only be distinguished by using neural crest
    formation (GO:0014029) versus neural crest cell fate specification (GO:0014036). Should a neural plate
    border formation/specification term be created so that sox10 (a NC specifier expressed only after
    border specifiers) can be cleanly separated from the border layer?
- question: Sox10 can replace SoxB1 in maintaining Xenopus blastula pluripotency (PMID:30144418). Does
    endogenous SoxE activity maintain the multipotency of neural crest cells (supporting a stem cell population
    maintenance annotation), or is this an overexpression/replacement property only?
- question: Is the neural crest specifier role a property of the SoxE group as a whole (with Sox8, Sox9
    and Sox10 redundant in frog and lamprey having independently duplicated SoxE genes), so that orthology-based
    transfer of Sox10-specific late-lineage terms (glia, ENS, oligodendrocytes) to non-gnathostome SoxE
    genes should be avoided?
- question: Which frog genes are directly bound by Sox10 at NC specification stages (e.g. snai2, foxd3,
    sox9 enhancers) versus indirectly regulated?
suggested_experiments:
- hypothesis: Sox10 directly occupies enhancers of NC specifier genes (snai2, foxd3, sox9) and melanocyte
    genes (mitf, dct) in Xenopus.
  description: CUT&RUN or ChIP-seq for tagged Sox10 in Wnt8/Chordin-induced NC explants and dissected
    neural folds at stages 13-17, integrated with ATAC-seq and Sox10 morphant RNA-seq.
  experiment_type: genomic binding assay
- hypothesis: SoxE factors maintain neural crest multipotency endogenously, beyond specifying it.
  description: Use F0 CRISPR triple knockout of sox8/sox9/sox10 or inducible dominant-negative Sox10 applied
    after specification, then assay NC explant ability to form multiple derivative types (melanocytes,
    glia, cartilage, neurons).
  experiment_type: genetic perturbation
