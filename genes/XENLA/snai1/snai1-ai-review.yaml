    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:12490555
  qualifier: involved_in
  review:
    summary: Negative regulation of RNA polymerase II transcription, from Aybar et al. 2003 (repressor-domain fusions
      of the Xsnail zinc fingers).
    action: ACCEPT
    reason: An Engrailed-repressor fusion of the Xsnail zinc-finger region mimics Snail gain of function in the
      crest while an E1A-activator fusion antagonises it, showing that Snail works by sequence-specific repression;
      Snail also represses Delta1 at the crest border. Snail-family repression of Pol II promoters through SNAG-recruited
      corepressors is conserved. Direct frog target promoters have not been mapped (no frog ChIP), but the process
      term is well supported. Core.
    supported_by:
    - &id003
      reference_id: PMID:12490555
      supporting_text: We show that Snail is required for neural crest specification and migration and that it works
        as a transcriptional repressor.
    - &id001
      reference_id: file:XENLA/snai1/snai1-deep-research-falcon.md
      supporting_text: a fusion of the Xsnail zinc-finger region to an Engrailed repression domain expanded neural-crest-marker
        expression, whereas fusion to an E1A activation domain inhibited those markers
    - reference_id: PMID:14681193
      supporting_text: At the early gastrula stage, the coordinated action of Xiro1, as a positive regulator, and
        Snail, as a repressor, restricts the expression of Delta 1 at the border of the neural crest territory.
