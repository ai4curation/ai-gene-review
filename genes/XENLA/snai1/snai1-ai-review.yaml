gene_symbol: snai1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Snai1 (Snail1, Xsna) is a Snail-family C2H2 zinc-finger transcriptional repressor of Xenopus laevis
  (this entry is the L homeolog). An N-terminal SNAG motif recruits corepressors, including the Ajuba-family LIM
  proteins Ajuba, LIMD1 and WTIP, and five C-terminal zinc fingers recognise E-box elements in RNA polymerase II
  promoters; the protein is labile and is stabilised by Elp3, which binds the zinc-finger region and limits beta-Trcp-mediated
  ubiquitination. snai1 has maternal vegetal transcripts and is expressed zygotically from stage 9 in the dorsal
  marginal zone and then in all early involuting mesoderm, where it is induced by mesoderm-inducing signals and
  later down-regulated as mesodermal tissues differentiate. It is also co-expressed with Oct/Sox/Vent pluripotency
  factors in blastula animal-pole cells and is required there to maintain that network and the competence of these
  cells to respond to mesoderm- and endoderm-inducing signals. From stage 11 snai1 is switched on in the ectoderm
  surrounding the prospective neural plate, among the first genes activated in crest progenitors by the border factors
  Pax3 and Zic1 (Zic1 binds an upstream snai1 element directly), and before snai2. Snail1 specifies neural crest
  fate: it is sufficient to induce Slug, FoxD3, Twist, Zic5 and Ets1 in naive ectoderm without neural plate or mesoderm
  markers, is required for crest specification upstream of Slug, and later contributes to crest migration, persisting
  in migrating crest and some derivatives. Snail border expression is ancestral in chordates (amphioxus Snail is
  transiently expressed at the neural plate border), and lamprey has a single snail gene expressed in both blastula
  and crest; after the gnathostome duplication the frog Snai1 paralog retained the blastula and earliest crest roles,
  while Snai2 took on the definitive crest-specifier and EMT dynamics.'
