- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: TAS
  original_reference_id: PMID:15242799
  qualifier: involved_in
  review:
    summary: AgBase TAS to neural crest formation citing Martinsen et al. 2004, a chick/Xenopus cardiac neural crest
      ablation study of Id2 expression.
    action: MODIFY
    reason: 'The cited abstract concerns Id2 expression after cardiac crest ablation and does not mention Snail;
      the same reference sources the TAS rows on snai2 and twist1. The biology is nevertheless sound at a more precise
      level. Snail1 is not a border specifier: Zic1 activates it directly, it acts upstream of Slug, FoxD3, Twist
      and Ets1, and in naive animal caps it induces all crest markers tested without neural-plate or mesoderm markers,
      i.e. it specifies crest identity. Following the convention applied to snai2, sox8, sox9-a and sox10 (GO:0014029
      for border-acting genes, GO:0014036 for specifiers), the term is narrowed to neural crest cell fate specification,
      which the IMP row already supports. The weak TAS reference should be replaced by the Xenopus experimental
      papers.'
    proposed_replacement_terms:
    - id: GO:0014036
      label: neural crest cell fate specification
    supported_by:
    - &id008
      reference_id: PMID:12490555
      supporting_text: We show that Snail is able to induce the expression of Slug and all other neural crest markers
        tested (Zic5, FoxD3, Twist and Ets1) at the time of specification.
    - &id011
      reference_id: PMID:12490555
      supporting_text: This activation is observed in whole embryos and in animal caps, in the absence of neural
        plate and mesodermal markers.
    - &id010
      reference_id: PMID:24360906
      supporting_text: were highly and reproducibly activated either by Pax3 (snail2, twist1) or by Zic1 (snail1)
        in the presence of cycloheximide
    - &id009
