suggested_questions:
- question: Snail1 is co-expressed with, and required to maintain, the Oct/Sox/Vent pluripotency network and the
    competence of blastula animal-pole cells (Buitrago-Delgado 2015). No GO process term captures this competence
    role; should GO:0019827 stem cell population maintenance apply (the same question raised for id3-a and myc-a),
    or is a more specific term needed?
- question: Frog Snail1 is expressed in all early mesoderm and induced by mesoderm-inducing factors, and mouse Snai1
    carries GO:0001707 mesoderm formation by IMP. Is there snai1-specific frog loss-of-function evidence (rather
    than loss of blastula competence) that would justify mesoderm formation or gastrulation terms for P19382?
- question: The AgBase TAS to GO:0014029 cites PMID:15242799, an Id2 cardiac crest paper that does not mention Snail
    (the same source as the snai2 and twist1 TAS rows). Should these rows be withdrawn at source?
- question: 'Lamprey has a single snail gene with flat expression dynamics across blastula and crest stages, like
    frog snai1, whereas frog snai2 rises monotonically like a definitive crest factor; in mouse, Snail rather than
    Slug marks premigratory crest. Which paralog carries the crest-specifier role is therefore lineage-specific:
    should Snai1 crest annotations be transferred by orthology at all?'
- question: Does snai1.S (A0A1L8ELB6) share the experimental functions of snai1.L (P19382)? The dominant-negative
    zinc-finger reagents would not distinguish homeologs (or paralogs).
suggested_experiments:
- hypothesis: Snail1 directly represses distinct target sets in blastula animal cells (maintaining competence) and
    in early crest progenitors (specification).
  description: Homeolog-resolved tagged-Snail1 CUT&RUN in blastula animal caps and in stage 12-14 neural folds,
    combined with RNA-seq of snai1 F0 CRISPR (both homeologs) explants, to define direct targets at each stage.
  experiment_type: ChIP-seq
- hypothesis: snai1 and snai2 are partially redundant in crest specification, but snai1 is uniquely required for
    blastula competence.
  description: Single and combined F0 CRISPR knockouts of snai1 and snai2 scoring pluripotency markers at blastula,
    border and specifier markers at neural plate stages, and migration.
  experiment_type: CRISPR knockout
