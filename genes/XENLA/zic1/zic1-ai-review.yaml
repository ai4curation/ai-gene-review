id: O73689
gene_symbol: zic1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Zinc finger protein ZIC 1 (Zic1, Opl, Zic-r1) is a nuclear C2H2 zinc-finger transcriptional
  activator of the Zic family, related to GLI/Cubitus interruptus and to Drosophila odd-paired. It binds
  GLI-like DNA sites and has a C-terminal regulatory domain that restrains its activity. In Xenopus it
  is one of the earliest neural genes: it is induced directly by BMP inhibition in the prospective neuroectoderm
  at the start of gastrulation and, with Zic3, is required for definitive neural fate. By late gastrula
  its expression resolves to the lateral and anterior neural plate border, where it acts as a neural plate
  border specifier. Together with Pax3 it is necessary and sufficient to induce neural crest, including
  migration and differentiation of crest derivatives; Zic1 directly activates the crest specifier snail1
  and, with Pax3, snail2, foxd3, twist1, tfap2b and sox8. Without Pax3, Zic1 instead promotes preplacodal
  ectoderm (six1, eya1), so the relative activity of Pax3 and Zic1 partitions the border into crest, preplacodal
  and hatching gland fates. Later it is expressed in the dorsal neural tube and brain, where it regulates
  neural regionalization partly by inducing Wnt ligand genes (wnt1, wnt8b) and engrailed-2. Zic and Pax3/7
  expression already marks the neural plate border in amphioxus, which lacks border expression of most
  crest specifiers, so Zic1 belongs to the ancestral chordate border layer of the neural crest gene regulatory
  network.'
