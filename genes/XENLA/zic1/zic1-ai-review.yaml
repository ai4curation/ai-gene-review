suggested_questions:
- question: GO has no neural plate border formation/specification term. GO:0014029 neural crest formation
    (formation of the ectodermal region between neural plate and non-neural ectoderm) is used for Zic1
    as a border specifier, and GO:0060788 ectodermal placode formation for its preplacodal role. Should
    a neural plate border term be created that would cover crest, preplacodal ectoderm and hatching gland
    outputs of the border specifiers?
- question: Should the project convention (border specifiers at GO:0014029/GO:0014034, crest specifiers
    at GO:0014036) be applied to zebrafish tfap2a, which carries GO:0014036 while all Xenopus Zic/Pax3/Hes4
    border specifiers sit at GO:0014029/GO:0014034?
- question: PMID:9435279 (Mizuseki 1998) sources a GO:0014029 IMP row but its abstract only reports neural
    induction; does the full text contain neural crest data for Zic-r1?
- question: Experimental rows sit on O73689 (zic1.S) only, while zic1.L (A0A1L8GAZ5) has none and the
    reagents were not homeolog-specific. Do both homeologs act at the border?
- question: Is the vertebrate-specific step in the Zic border module a protein change (ability to co-activate
    crest specifier enhancers with Pax3) or a cis-regulatory change in target elements (snail1 Zic site,
    foxd3, sox8)?
suggested_experiments:
- description: Test whether amphioxus Zic, with amphioxus Pax3/7, can replace Xenopus Zic1 in the Pax3+Zic1
    animal-cap crest induction assay and bind the frog snail1 Zic1 element, to separate protein from cis-regulatory
    evolution.
- description: CUT&RUN for endogenous Zic1 at gastrula stage 12 to confirm in vivo occupancy of the snail1
    element and test co-occupancy with Pax3 at foxd3, sox8 and twist1 enhancers.
- description: Homeolog-specific CRISPR F0 knockout of zic1.L vs zic1.S, scoring crest (snai1, snai2,
    sox8), preplacodal (six1, eya1) and neural plate (sox2) markers.
proposed_new_terms:
- proposed_name: neural plate border formation
  proposed_definition: The formation of the neural plate border, the region of ectoderm at the boundary
    between the neural plate and the non-neural ectoderm that is competent to give rise to neural crest,
    preplacodal ectoderm, dorsal neural tube and epidermis.
  justification: GO has no term for the neural plate border. GO:0014029 neural crest formation is defined
    as forming this ectodermal region but is placed under epithelial to mesenchymal transition, so border
    specifiers end up annotated to an EMT term. The border is conserved in chordates without neural crest
    (amphioxus, tunicates), so it cannot be a part of neural crest formation. See projects/NEURAL_CREST_FORMATION_OBSOLETION.md.
  proposed_parent:
    id: GO:0007398
    label: ectoderm development
  supported_by:
  - reference_id: PMID:15843410
    supporting_text: Pax3 and Zic1 are expressed in an overlapping manner in the presumptive neural crest
      area of the Xenopus gastrula, even prior to the onset of the expression of the early bona fide neural
      crest marker genes Foxd3 and Slug.
  - reference_id: PMID:24360908
    supporting_text: Transcription factors pax3 and zic1 are among the earliest genes activated in NC
      progenitors, and they are both necessary and sufficient to promote NC fate.
