- term:
    id: GO:0001840
    label: neural plate development
  evidence_type: IMP
  original_reference_id: PMID:16871635
  qualifier: involved_in
  review:
    summary: Zic1 is one of the earliest neural plate genes. It is induced directly by BMP inhibition,
      is required with Zic3 for definitive neural fate, patterns the neural plate (e.g. through its direct
      target Xfeb) and partitions the lateral neural plate border into crest and preplacodal fates.
    action: ACCEPT
    reason: 'Neural plate development is the right broad process for Zic1: every Zic1 output (neural fate,
      border specification, regionalization) is executed in the neural plate and its border. Zic1 does
      the work as a transcriptional activator of neural plate genes. The cited paper shows Zic1 directly
      upregulates Xfeb, a neural plate regionalizing factor.'
    additional_reference_ids:
    - PMID:19805078
    supported_by:
    - reference_id: PMID:16871635
      supporting_text: The transcription factor Zic1 plays important roles in patterning the neural plate
        in early vertebrate development.
    - reference_id: PMID:16871635
      supporting_text: We have identified a new direct downstream target gene of Zic1 that we have named
        Xfeb.
    - reference_id: PMID:16871635
      supporting_text: Xfeb represses the hindbrain gene hoxB1 and the anterior neural gene otx2, suggesting
        that Xfeb is involved in regionalizing the neural plate, possibly by ensuring a posterior expression
        limit for otx2.
    - reference_id: PMID:19805078
      supporting_text: Conversely, we found that zic1 can be activated by BMP inhibition in the absence
        of translation.
    - reference_id: PMID:19805078
      supporting_text: Finally, Zic1 and Zic3 are required together for definitive neural fate acquisition,
        both in ectopic and endogenous situations.
