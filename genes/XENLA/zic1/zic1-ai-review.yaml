core_functions:
- description: Neural plate border specifier. Induced in the lateral and anterior neural plate border
    during gastrulation, before the crest specifiers, Zic1 acts as a DNA-binding transcriptional activator
    that, with Pax3, establishes the border territory from which neural crest arises.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15843410
    supporting_text: Pax3 and Zic1 are expressed in an overlapping manner in the presumptive neural crest
      area of the Xenopus gastrula, even prior to the onset of the expression of the early bona fide neural
      crest marker genes Foxd3 and Slug.
  - reference_id: PMID:24360908
    supporting_text: Transcription factors pax3 and zic1 are among the earliest genes activated in NC
      progenitors, and they are both necessary and sufficient to promote NC fate.
  - reference_id: PMID:17409353
    supporting_text: Although in distinct regions of the ectoderm, Pax3 and Zic1 can independently promote
      HG and PE fates; in domain of the ectoderm where both factors are coexpressed, their combined activities
      specify the NC.
  - reference_id: PMID:18562679
    supporting_text: Ectodermal Zic and Pax3/7 expression marks the neural plate border, and amphioxus
      SoxB1-a expression labels the entire neural plate.
- description: Initiation of neural crest fate with Pax3. Zic1 directly activates the first-wave crest
    specifier snail1 (EMSA-validated element, cycloheximide-resistant induction) and with Pax3 activates
    snail2, foxd3, twist1, tfap2b and sox8; the pair is necessary and sufficient for full crest determination.
    Zic1 is the upstream inducer, not a crest specifier itself.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0014034
    label: neural crest cell fate commitment
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:24360906
    supporting_text: Similarly, we showed that Zic1 binds to snail1 putative oligonucleotide but not to
      the snail1 oligonucleotide mutated on the putative binding site (Figure 4E and not shown).
  - reference_id: PMID:24360906
    supporting_text: Firstly, the main known neural crest specifiers, snail1, snail2 and twist1, were
      highly and reproducibly activated either by Pax3 (snail2, twist1) or by Zic1 (snail1) in the presence
      of cycloheximide.
  - reference_id: PMID:24360906
    supporting_text: We demonstrated that the neural border specifiers Pax3 and Zic1 are direct upstream
      regulators of neural crest specifiers Snail1/2, Foxd3, Twist1, and Tfap2b.
  - reference_id: PMID:15843410
    supporting_text: Misexpression of both Pax3 and Zic1 together efficiently induces ectopic neural crest
      differentiation in the ventral ectoderm, whereas overexpression of either one of them only expands
      the expression of neural crest markers within the dorsolateral ectoderm.
  - reference_id: PMID:15843410
    supporting_text: Loss-of-function studies in vivo and in the animal cap show that co-presence of Pax3
      and Zic1 is essential for the initiation of neural crest differentiation.
  - reference_id: PMID:23509273
    supporting_text: Thus, Pax3 and Zic1 cooperate and execute a transcriptional switch sufficient to
      activate full multipotent neural crest development and differentiation.
- description: Preplacodal ectoderm fate at the anterior neural plate border. Acting without high Pax3,
    Zic1 activates six1 and eya1 and is required for preplacodal ectoderm.
