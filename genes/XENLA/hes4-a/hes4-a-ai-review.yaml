suggested_questions:
- question: GOA asserts both involved_in and NOT involved_in GO:0014029 for hes4-a (Q90Z12). The NOT rests
    on a negative homeolog-specific morpholino result (Murato 2007), while Vega-Lopez 2015 reports hairy2a
    border/crest expression and functional equivalence with hairy2b, and the Nichane 2008 rows (unsuffixed
    Hairy2) were attached to both homeologs. Should the NOT be withdrawn, or the positive rows restricted
    to hes4-b?
- question: GO has no neural plate border formation/maintenance term. Hairy2 acts on the border region
    (BMP level, border genes, progenitor maintenance) rather than specifying crest fate. If a border term
    is created, should Hairy2/Hes4 sit in it alongside Pax3, Zic1, Msx1 and Tfap2a, or in a separate border
    progenitor maintenance term shared with Id3 and Stat3?
- question: Should Hes4 carry GO:0007219 Notch signaling pathway as a direct Notch target effector (as
    for other Hes genes), or GO:0045596 negative regulation of cell differentiation for its role in keeping
    border progenitors undifferentiated?
- question: Is hairy/Hes expression at the neural plate border ancestral (amphioxus, lamprey), and did
    the Notch-Hairy-Bmp4 border circuit predate the crest? Hes4 has been lost in rodents; is a mammalian
    paralog (Hes1) covering its border role?
suggested_experiments:
- hypothesis: hes4.S (hes4-a) and hes4.L (hes4-b) act redundantly in neural crest formation, with hes4-b
    dominant because of its higher zygotic border expression.
  description: Homeolog-specific CRISPR F0 mutants of hes4.S and hes4.L, singly and together, scored for
    border genes (pax3, zic1, msx1), crest markers (snai2, foxd3, sox10), floor plate and prechordal plate
    markers, and p27xic1, with cross-rescue by each homeolog mRNA.
- hypothesis: Hairy2 represses Bmp4 and other border targets directly via N-box sites.
  description: CUT&RUN for tagged Hes4 in neural plate border explants, combined with reporter assays
    of Bmp4 and p27xic1 regulatory regions with N-box mutations.
