core_functions:
- description: DNA-binding transcriptional repressor of the bHLH-Orange (Hairy/E(spl)) family. Binds N-box
    sites, dimerises with bHLH partners and recruits Groucho/TLE through WRPW to repress Pol II target
    genes such as Bmp4.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id003
  - *id001
  - *id002
  - *id006
- description: Neural plate border maintenance. Induced by Delta1/Notch (downstream of Xiro1), BMP and
    FGF at the border, Hairy2 represses Bmp4 to set border BMP levels, upregulates early border genes
    and keeps border/pre-crest progenitors surviving and in a mitotic, undifferentiated state, with Id3
    (antagonist) and Stat3 (Hairy2 facilitates FGFR4-Stat3). This places it in a border-level progenitor
    maintenance layer upstream of the crest specifiers, so the process term is kept at GO:0014029 (formation
    of the border region). The hes4-a homeolog contribution, relative to hes4-b, is disputed.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
