taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Hairy2a (Hes4-A) is a basic helix-loop-helix-Orange (bHLH-O) transcriptional repressor of
  the Hairy/Enhancer of split family, encoded by the S homeolog (hes4.S) of the allotetraploid frog; its
  L homeolog is hes4-b/Hairy2b. It binds N-box DNA sites through a proline-containing basic region, dimerises
  with other bHLH proteins (Hey1, Hes6) and recruits Groucho/TLE corepressors through its C-terminal WRPW
  motif, acting in the nucleus. hes4-a is a Notch target: Delta1/Notch induces it in the dorsal organiser,
  where it promotes floor plate over notochord fate, and at the neural plate border, where it also responds
  to BMP, FGF and Wnt. At the border Hairy2 represses Bmp4, upregulates border genes and keeps border
  progenitors surviving, cycling and undifferentiated (partly through a DNA-binding-independent Stat3-Delta1
  route), working with its antagonist Id3 and with Stat3. It therefore acts as a border/progenitor maintenance
  factor upstream of the neural crest specifiers rather than as a crest fate specifier. It is also required
  in the prechordal plate and in pre-placodal ectoderm for lens development (by limiting p27Xic1), and
  is expressed in stripes in presomitic mesoderm. The two homeologs have partly subfunctionalised: hes4-a
  is maternally supplied with lower zygotic expression, shares floor plate and prechordal plate roles
  with hes4-b, and has a disputed contribution to the neural crest, where hes4-b is more strongly expressed.
  Hes4 is absent from rodents.'
