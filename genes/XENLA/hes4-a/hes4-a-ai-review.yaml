- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: IMP
  original_reference_id: PMID:14681193
  qualifier: involved_in
  review:
    summary: 'IMP from Glavic et al. 2004: Hairy2A downstream of Xiro1 and Delta1/Notch represses Bmp4
      so that border BMP levels permit neural crest specification; Hairy2A rescues loss of crest markers
      when Xiro1 or Notch is blocked.'
    action: ACCEPT
    reason: 'GO:0014029 is defined as forming the region of ectoderm between neural plate and non-neural
      ectoderm, which is precisely where Hairy2 acts: it sets BMP levels for the neural plate border and
      maintains border progenitors. It is not a crest fate specifier (early overexpression represses crest
      markers and induces border genes), so the row stays at GO:0014029 rather than being narrowed to
      GO:0014036. This paper names Hairy2A explicitly and the row sits on hes4-a only.'
    supported_by:
    - &id007
      reference_id: PMID:14681193
      supporting_text: ensuring that levels of Bmp4 optimal for the specification of the neural plate
        border are attained in this region
    - *id001
