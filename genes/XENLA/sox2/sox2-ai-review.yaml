    summary: 'Proposed: Sox2 is required in retinal progenitors for neural potential, downstream of Frizzled-5/Wnt.'
    action: NEW
    reason: Van Raay et al. 2005 show that Xfz5/Wnt maintains Sox2 in the optic vesicle and that blocking Sox2 reproduces
