suggested_questions:
- question: Combined Sox2+Sox3 morpholinos abolish the competence of blastula animal-pole cells to form mesoderm
    and endoderm (Buitrago-Delgado 2018), and mammalian SOX2 carries GO:0019827/GO:0035019. Should frog Sox2 carry
    a stem cell population maintenance term for blastula pluripotency, given that the evidence is for SoxB1 jointly
    and the same question is open for id3-a, myc-a, snai1 and lin28a?
- question: Forced SoxB1 activity at the neural plate border lowers foxd3 and snail2, but no Sox2-specific loss
    of function expands the crest, and no SoxB1 protein in any species carries a neural crest process term (QuickGO
    2026-10-07). Is there any loss-of-function evidence that endogenous Sox2 limits crest formation (which would
    support GO:0090301), or is its exclusion from the crest simply a consequence of crest specifiers repressing
    it?
- question: Buitrago-Delgado 2018 attribute SoxB1/SoxE mutual exclusion partly to Snail2 repressing Sox2, citing
    Acloque 2011, which concerns Sox3 in chick/mouse gastrulation. Is there direct evidence that Snail2 (or another
    crest specifier) represses sox2 in the frog border?
- question: Frog loss-of-function reagents (dominant-negative Sox2, combined Sox2/Sox3 morpholinos) do not separate
    Sox2 from Sox3. Which neural induction and retinal functions are Sox2-specific rather than shared SoxB1 functions?
suggested_experiments:
- hypothesis: Sox2 and Sox3 are partly redundant for blastula competence and neural induction, but Sox2 is uniquely
    required in retinal progenitors.
  description: Single and combined F0 CRISPR knockouts of sox2.L and sox3 in X. laevis/X. tropicalis, scoring activin
    competence of animal caps, neural plate markers, and retinal proneural/Notch gene expression.
  experiment_type: CRISPR knockout
- hypothesis: Sox2 is actively repressed at the neural plate border by crest specifiers, and its persistence there
    blocks crest specification.
  description: CUT&RUN for Snai2, Sox9/10 and Sox2 in dissected border tissue at stages 12-14, combined with border-restricted
    sox2 knockdown or knockout to test whether the crest domain expands.
  experiment_type: ChIP-seq
