gene_symbol: sox2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: 'Sox2 is a SoxB1-group HMG-box transcription factor of Xenopus laevis (sox2.L). Its HMG box binds A/T-rich
  Sox motifs in RNA polymerase II cis-regulatory regions and a C-terminal 9aaTAD motif supports transcriptional
  activation; with the homeodomain factor Otx2 it binds and synergistically activates a conserved enhancer of the
  eye-field gene Rax. Together with its paralog Sox3, Sox2 is expressed in pluripotent blastula animal-pole cells,
  where SoxB1 activity is required for the competence of these cells to respond to mesoderm- and endoderm-inducing
  signals. From the onset of gastrulation it is induced by Chordin/BMP antagonism in prospective neuroectoderm and
  makes ectoderm responsive to FGF neuralising signals; SoxB1 function is required for neural induction and for
  early neuroectoderm to consolidate neural identity. By the end of gastrulation Sox2 is confined to the neural
  plate and is excluded from the neural crest, where SoxE factors (Sox8, Sox9, Sox10) take over: forced SoxB1 activity
  at the neural plate border lowers crest markers and cannot replace SoxE in crest induction, so the SoxB1 to SoxE
  hand-off accompanies the transition from blastula potency to crest. Later Sox2 marks central nervous system and
  eye progenitors: in the retina, Frizzled-5/Wnt signalling maintains Sox2, which confers neural competence and
  proneural gene onset, then restrains neuronal differentiation through Notch and favours Muller glia until proneural
  factors switch it off; in larval spinal cord it is required in ventricular-zone progenitors for regeneration.
  SoxB1 neural progenitor functions are shared across bilaterians, and the downregulation of SoxB1 in premigratory
  crest with a switch to SoxE is conserved in lamprey, dating the hand-off to the vertebrate ancestor.'
