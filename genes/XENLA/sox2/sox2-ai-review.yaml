- term:
    id: GO:0045665
    label: negative regulation of neuron differentiation
  evidence_type: IMP
  original_reference_id: PMID:19736324
  review:
    summary: 'Proposed: Sox2 restrains neuronal differentiation of retinal progenitors through Notch, downstream
      of Wnt/beta-catenin.'
    action: NEW
    reason: 'Agathocleous et al. 2009 show that sustained Sox2 blocks retinal neurogenesis cell-autonomously and
      that the block requires Notch (Su(H)DBM abolishes it); Sox2 must be switched off by the proneural factors
      for neurons to form. Sox2 does the work as the transcription factor that keeps Notch active and opposes proneural
      activity, so the participation test is met. Comparator (QuickGO 2026-10-07): mouse Sox2 carries GO:0045665
      by IDA (PMID:16631155) and human SOX2 by ISS, so frog lacks only the curation. The evidence is gain-of-function
      plus epistasis; it complements, not replaces, the competence role.'
    supported_by:
    - *id006
    - *id011
