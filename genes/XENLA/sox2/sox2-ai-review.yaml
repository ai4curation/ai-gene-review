    label: nervous system development
  evidence_type: IMP
  original_reference_id: PMID:10648237
  qualifier: involved_in
  review:
    summary: 'Nervous system development, from Kishi et al. 2000: dominant-negative Sox2 (including a hormone-inducible
      version) blocks neural differentiation of animal caps and suppresses N-CAM and regional neural markers in
      embryos.'
    action: ACCEPT
    reason: 'This is the central frog role of Sox2: it is required for early neuroectoderm to consolidate neural
      identity, from late blastula onward. A dominant-negative construct may also block Sox3 (the authors write
      of "Sox2-class genes"), and later combined Sox2/Sox3 morpholino data confirm the SoxB1 requirement for neural
      induction, so the attribution is to SoxB1 activity in which Sox2 participates. Nervous system development
      is broad but accurate; core.'
    supported_by:
    - reference_id: PMID:10648237
      supporting_text: Microinjection of dominant-negative forms of Sox2 (dnSox2) mRNA inhibits neural differentiation
        of animal caps caused by attenuation of BMP signals.
    - reference_id: PMID:10648237
      supporting_text: These data suggest that Sox2-class genes are essential for early neuroectoderm cells to consolidate
        their neural identity during secondary steps of neural differentiation.
    - reference_id: PMID:30144418
      supporting_text: We first showed that morpholino-mediated depletion of Sox2 and Sox3 prevented chordin-mediated
        neural induction (Figure 6A–B).
