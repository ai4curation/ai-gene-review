    summary: Negative regulation of RNA polymerase II transcription, inherited from the SoxB1/SoxB2 node (PTN008496689)
      whose donors include mouse Sox1/2/3/21, Drosophila SoxNeuro and zebrafish sox paralogs.
    action: KEEP_AS_NON_CORE
    reason: SoxB1 proteins can repress as well as activate (mammalian SOX2 repression is SUMO-dependent), and in
