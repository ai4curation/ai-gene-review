core_functions:
- description: Cytoplasmic pre-miRNA-binding protein that recognizes GGAG-containing terminal loops (pre-let-7 and,
    in frog, pre-mir-363) through its cold-shock domain and CCHC zinc knuckles, and suppresses let-7 biogenesis
    by recruiting TUT4/7 to oligouridylate pre-let-7 so that Dicer cannot process it.
  molecular_function:
    id: GO:0070883
    label: pre-miRNA binding
  directly_involved_in:
  - id: GO:2000632
    label: negative regulation of pre-miRNA processing
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:26447465
    supporting_text: We demonstrate that lin28a binds to the terminal loop of pre-mir-363 with an affinity similar
      to that of let-7, and that this high affinity interaction requires to conserved a GGAG motif
  - reference_id: PMID:19703396
    supporting_text: Lin28 recruits TUT4 to pre-let-7 by recognizing a tetra-nucleotide sequence motif (GGAG) in
      the terminal loop
  - reference_id: PMID:18951094
    supporting_text: The uridylated pre-let-7 (up-let-7) fails Dicer processing and undergoes degradation
- description: Sequence-selective mRNA-binding protein in cytoplasmic mRNPs; in mammals it enhances translation
    of selected mRNAs by recruiting RNA helicase A to polysomes (not yet shown in frog).
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:17617744
    supporting_text: Lin28 binds mRNAs in the nucleus and accompanies them to ribosomes and P-bodies
  - reference_id: PMID:21247876
    supporting_text: Lin28 may stimulate translation by actively recruiting RHA to polysomes
suggested_questions:
- question: 'Is Lin28 a neural crest competence factor in Xenopus, as Lin28a is in chick (PMID:30520734)? Which
    frog paralog (lin28a.L/.S or lin28b) is expressed at the neural plate border and premigratory crest? Until frog
    data exist, should GO:0014029 neural crest formation be added to chick LIN28A (Q45KJ5) by IMP from PMID:30520734
    rather than to the frog protein? (QuickGO, 2026-10-07: no Lin28 protein in human, mouse, rat, zebrafish, chicken
    or Xenopus carries any neural crest branch term.)'
- question: Should the module progenitor_competence_maintenance part gain a Lin28/let-7 annoton? In chick, let-7
    directly targets Pax7, FoxD3 and Myc, which would connect Lin28 to the Myc/Id3 competence circuit. Should it
    be grounded on chick LIN28A, given the absence of frog evidence?
- question: Does GO:0019827 stem cell population maintenance fit any Lin28 role in non-mammalian embryos? Or is
    the shared blastula/crest role better described by a new competence-maintenance term (the module knowledge gap)?
    The frog data show responsiveness of transient pluripotent cells to inducers, not maintenance of a population.
- question: In the early Xenopus embryo, Lin28 raises mir-17~92/mir-106~363 levels and binds the pre-mir-363 loop,
    and its early function seems let-7-independent. Does Lin28 act on pre-mir-363 processing (positive regulation
    of pre-miRNA processing), on stability, or indirectly? Should this be annotated?
- question: Should mesoderm formation (GO:0001707) or regulation of response to FGF/activin be annotated to Xenopus
    lin28a? The X. tropicalis evidence comes from compound lin28a+lin28b knockdown (PMID:23344711), so it cannot
    be assigned to one paralog.
- question: The project page cites PMID:25931449 for Lin28 being in the shared blastula/neural crest programme,
    but that paper main text does not mention Lin28. Should the citation move to PMID:39060477 (lamprey/Xenopus
    transcriptomes) and PMID:36182685 (chick neural plate border)?
suggested_experiments:
- description: In situ hybridization and HCR for lin28a.L, lin28a.S and lin28b from blastula to neurula in X. laevis,
    co-stained with pax3, zic1, snai2 and sox10. This would test whether a Lin28 paralog is expressed at the neural
    plate border and in premigratory crest, as Lin28a is in chick.
- description: 'Neurula-stage (post-gastrulation) lin28 depletion that avoids the early germ-layer phenotype: photo-morpholinos,
    hormone-inducible dominant negatives, or a mCCHC Lin28a. Score foxd3, snai2 and sox10, and rescue with wild-type
    Lin28a versus a let-7 sponge, mirroring the chick design (PMID:30520734).'
- description: Let-7 sensor and pre-let-7 uridylation assays in neural crest explants (Wnt8/chordin-induced animal
    caps), and anti-Lin28 CLIP in those explants, to identify which pre-miRNAs and mRNAs Lin28 binds in the crest
    versus the blastula.
- description: Lamprey lin28 expression at the neural plate border and in crest, and morpholino knockdown in lamprey.
    Amphioxus Lin28 expression at the neural plate border would tell whether Lin28 competence at the border predates
    vertebrates.
