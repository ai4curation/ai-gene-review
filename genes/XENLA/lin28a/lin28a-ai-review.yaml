id: Q8JHC4
gene_symbol: lin28a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8355
  label: Xenopus laevis
description: Lin28a (Xenbase lin28a.S) is a small cytoplasmic RNA-binding protein of the Lin-28 family, with an
  N-terminal cold-shock domain and two CCHC zinc knuckles that together recognize the terminal loops of precursor
  microRNAs (GGAG motif) and specific mRNAs. In vertebrates Lin28 blocks let-7 microRNA biogenesis, recruiting TUT4/TUT7
  to oligouridylate pre-let-7 so that Dicer cannot process it, and it also enhances translation of selected mRNAs.
  Xenopus lin28a protein binds pre-let-7 and pre-mir-363 loops, and in the early embryo Lin28 proteins promote mir-17~92
  family miRNAs. lin28a is expressed zygotically from gastrula stages in pluripotent, FGF-responsive cells; together
  with lin28b it is needed for these cells to respond to FGF and activin/nodal mesoderm inducers, a role that appears
  independent of let-7. Later it is downregulated, and forced expression in tadpoles delays metamorphosis by dampening
  the thyroid hormone axis, consistent with the ancient heterochronic (developmental timing) role of Lin-28 first
  defined in C. elegans. Lin28 belongs to the pluripotency factor set whose expression is shared between blastula
  animal pole cells and the neural plate border in frog, chick and lamprey. In chick, Wnt-driven Lin28a is required
  for neural crest specification and maintains crest multipotency through let-7 suppression; a comparable neural
  crest role has not been tested in Xenopus.
