- term:
    id: GO:0019827
    label: stem cell population maintenance
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9H9Z2
  review:
    summary: Stem cell population maintenance transferred from human LIN28A, whose IMP comes from knockdown in cultured
      cells lowering stem cell markers.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Judged against frog evidence: Xenopus lin28 is expressed in transient pluripotent blastula cells, and
      compound lin28a/lin28b knockdown impairs their response to FGF and activin/nodal mesoderm inducers rather
      than depleting a self-renewing population; later, overexpression delays metamorphosis. Neither shows maintenance
      of a stem cell population. The human source is itself a culture marker readout. In chick, Lin28a holds neural
      crest cells in a multipotent state through let-7 suppression, which is the closest real case, but there is
      no frog counterpart and that role is not stem cell population maintenance in the GO sense. Not wrong for mammals;
      an over-reach for frog.'
    additional_reference_ids:
    - PMID:30520734
    supported_by:
    - reference_id: PMID:19703396
      supporting_text: Knockdown of TUT4 and Lin28 reduces the level of stem cell markers, suggesting that they
        are required for stem cell maintenance
    - reference_id: PMID:23344711
      supporting_text: the ability of pluripotent cells from the embryo to respond to the FGF and activin/nodal-like
        mesoderm-inducing pathways is compromised following inhibition of lin28 function
    - reference_id: PMID:28359807
      supporting_text: Lin28 overexpression before activation of TH signaling delays metamorphosis and inhibits
        the expression of TH target genes
    - reference_id: PMID:30520734
      supporting_text: high levels of Lin28a during early development are necessary for neural crest specification,
        while its subsequent downregulation is required for silencing of progenitor identity
