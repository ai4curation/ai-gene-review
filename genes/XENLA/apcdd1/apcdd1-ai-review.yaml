- id: PMID:20393562
  title: APCDD1 is a novel Wnt inhibitor mutated in hereditary hypotrichosis simplex.
  findings:
  - statement: Morpholino knockdown of endogenous Xenopus laevis apcdd1 (cDNA BC080377) causes loss of anterior and dorsal embryonic structures due to ectopic zygotic Wnt activity, rescued by MO-resistant Xapcdd1 mRNA or dominant-negative Wnt8 mRNA.
    supporting_text: Depletion of Xapcdd1 protein with a specific translation-blocking MO oligonucleotide (Fig. S13) resulted in loss of anterior and dorsal structures (Fig. 4e and Table S1). This phenotype was rescued by either injection of MO-resistant 5’ mutant Xapcdd1 RNA, or by DNWnt8 RNAs (Fig. 4f,g and Table S1), which inhibit zygotic Wnt signaling24.
    reference_section_type: RESULTS
  - statement: APCDD1 inhibits Wnt8-stimulated Siamois transcription cell-autonomously in the signal-receiving blastomere upstream of beta-catenin.
    supporting_text: APCDD1 RNA inhibited transcription when coinjected with the Sia reporter, but not with Wnt8 (Fig. 4h), suggesting that APCDD1 inhibits Wnt signaling cell-autonomously in the receiving cell.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Clones Xenopus laevis apcdd1 (BC080377 = Q66KI8) and demonstrates endogenous zygotic Wnt inhibition by translation-blocking morpholino knockdown and mRNA/DNWnt8 rescue.
- id: PMID:32320685
  title: Apcdd1 is a dual BMP/Wnt inhibitor in the developing nervous system and skin.
  findings:
  - statement: Endogenous Xenopus laevis apcdd1 is co-expressed with the BMP synexpression group and its morpholino depletion expands BMP target sizzled expression and elevates Smad1 phosphorylation, rescued by MO-resistant apcdd1 mRNA.
    supporting_text: We found that MO-depletion of XA1 in Xenopus embryos expands the expression of sizzled, a downstream target activated by BMP signaling (Fig. 2G–J). The elevated expression of sizzled was reduced by the co-injection of a MO-resistant apcdd1 RNA (Fig. 2K, L).
    reference_section_type: RESULTS
  - statement: Xenopus apcdd1 inhibits BMP2/Alk3 transcriptional signaling upstream of Smad1 as well as canonical Wnt signaling.
    supporting_text: APCDD1 blocks BMP signaling by binding to the BmprIa receptor and inhibiting the nuclear localization of Smad1, the main BMP effector.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes endogenous BMP pathway antagonism alongside Wnt inhibition for Xenopus laevis apcdd1 via morpholino depletion, phospho-Smad1 Western blotting, BRE reporter assays, and mRNA rescue.
- id: PMID:37155902
  title: Structure of WNT inhibitor adenomatosis polyposis coli down-regulated 1 (APCDD1), a cell-surface lipid-binding protein.
  findings:
  - statement: Vertebrate APCDD1 ectodomains fold into two disulfide-bridged beta-barrel domains (ABD1 and ABD2) with a ~350 A^3 hydrophobic pocket in ABD2 that captures palmitoylated WNT ligands.
    supporting_text: Structural and functional analyses show that APCDD1 has a large hydrophobic pocket in ABD2 and that APCDD1 can bind to WNT7A, presumably via its covalently bound palmitoleate, a modification that is common to all WNTs and is essential for signaling.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the structural basis of WNT ligand binding conserved in Xenopus laevis apcdd1 (Cys51-Cys465, Asn99/Asn167/Asn318).
