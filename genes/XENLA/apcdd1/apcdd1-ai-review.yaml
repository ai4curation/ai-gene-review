  label: Xenopus laevis
description: >-
  Single-pass type I plasma-membrane glycoprotein (Xapcdd1 / apcdd1.L) that acts
  cell-autonomously at the surface of signal-receiving embryonic cells as a dual negative
  regulator of Wnt and BMP signaling during dorsoventral axis specification, neural crest
  induction, and epidermal patterning in Xenopus laevis. Retaining the conserved 12-cysteine
  tandem ABD1/ABD2 beta-barrel ectodomain (including interdomain Cys51-Cys465), three
  N-glycosylation sequons (Asn99, Asn167, Asn318), and C-terminal transmembrane anchor,
  endogenous Xapcdd1 restricts zygotic Wnt8 signaling upstream of beta-catenin to preserve
  anterior-dorsal structures and antagonizes BMP/BMPR1A-Smad1 signaling within the BMP
  synexpression group during gastrulation and neurulation.
