suggested_questions:
- question: >-
    Do the homeologous apcdd1.L (Q66KI8) and apcdd1.S (A0A8J0T4I1) genes in allotetraploid
    Xenopus laevis exhibit identical maternal and BMP-synexpression-group developmental
    patterns or partial subfunctionalization?
suggested_experiments:
- description: >-
    Compare apcdd1.L and apcdd1.S spatial-temporal expression by homeolog-specific RT-qPCR
    and test CRISPR/Cas9 F0 knockout of each homeolog on zygotic Wnt8 and BMP/Smad1 target
    gene expression during Xenopus laevis gastrulation and neurulation.
