- id: PMID:11850185
  title: Gbx2 interacts with Otx2 and patterns the anterior-posterior axis during gastrulation
    in Xenopus.
  findings:
  - statement: Xgbx2a acts as a transcriptional repressor and represses Otx2 at gastrula
