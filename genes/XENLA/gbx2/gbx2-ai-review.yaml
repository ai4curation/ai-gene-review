  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached; uses gbx2 as a marker only.
- id: PMID:24360906
  title: Pax3 and Zic1 trigger the early neural crest gene regulatory network by the direct
