suggested_questions:
- question: >-
    Which residues of the crotonase fold allow FabM to isomerize
    trans-2-decenoyl-ACP without hydrating it, and do they distinguish FabM
    from the hydratase-lyase and polyketide dehydratase members of the same
    PANTHER family?
suggested_experiments:
- description: >-
    Determine a FabM structure with a decenoyl-ACP or decenoyl-pantetheine
    ligand and test candidate active-site residues by mutagenesis for loss of
    isomerase activity.
