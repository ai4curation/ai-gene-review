id: Q8DR19
gene_symbol: fabM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:171101
  label: Streptococcus pneumoniae R6
description: >-
  FabM is the trans-2-decenoyl-[acyl-carrier-protein] isomerase of
  Streptococcus pneumoniae type II fatty acid synthesis. It converts
  trans-2-decenoyl-ACP, made by the general FabZ dehydratase, into
  cis-3-decenoyl-ACP, which is then elongated to cis-unsaturated long-chain
  fatty acids. FabM is a homotetrameric member of the enoyl-CoA
  hydratase/isomerase (crotonase) superfamily, unrelated in sequence and fold
  to the hotdog-fold FabA isomerase of proteobacteria, and it has no
  dehydratase activity. It prefers 10-carbon substrates, also uses 12-carbon
  enoyl-ACP, and does not act on 14- or 16-carbon enoyl-ACP, so it fixes the
  oxygen-independent branch point for unsaturated fatty acids after
  trans-2-decenoyl-ACP formation.
existing_annotations:
- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00094
  review:
    summary: >-
      True but less specific than the evidence: FabM acts only at the
      unsaturated branch of type II fatty acid synthesis.
    action: MODIFY
    reason: >-
      FabM does not take part in the shared elongation cycle; its only
      demonstrated reaction is the C10 isomerization that starts unsaturated
      fatty acid synthesis. The specific descendant GO:0006636 unsaturated
      fatty acid biosynthetic process is already on this gene by IDA, so the
      UniPathway mapping is refined to it.
    proposed_replacement_terms:
    - id: GO:0006636
      label: unsaturated fatty acid biosynthetic process
    supported_by:
    - reference_id: PMID:12237320
      supporting_text: >-
        carries out the isomerization of
        trans-2-decenoyl-ACP to cis-3-decenoyl-ACP, but is not capable of catalyzing the
        dehydration of beta-hydroxy intermediates
- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:94871
  - PANTHER:PTN000941828
  - RGD:61892
  - RGD:69330
  - UniProtKB:P30084
  review:
    summary: >-
      Over-propagated beta-oxidation term from a mammalian enoyl-CoA hydratase
      node; FabM is an ACP-dependent biosynthetic isomerase.
    action: REMOVE
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000941828
        source_label: PAINT node seeded by mammalian ECHS1 orthologs
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mitochondrial enoyl-CoA hydratases act in beta-oxidation; FabM is an
          ACP-dependent isomerase of fatty acid synthesis.
    reason: >-
      PTN000941828 is seeded only by mammalian mitochondrial enoyl-CoA
      hydratases (human ECHS1 and rodent orthologs). The PTHR42964 family review
      finds the node absent from the current PTHR42964 tree and judges that it
      cannot be placed over the FabM clade. FabM acts on acyl-ACP thioesters in
      fatty acid synthesis and is defined by the isomerization reaction, not by
      degradation of acyl-CoA. There is no evidence that S. pneumoniae FabM
      participates in beta-oxidation, so the shared crotonase fold does not
      justify the process.
    supported_by:
    - reference_id: PMID:12237320
      supporting_text: >-
        We cloned and
        biochemically characterized a new enzyme in type II fatty acid synthesis from
        Streptococcus pneumoniae
    - reference_id: file:interpro/panther/PTHR42964/PTHR42964-review.yaml
      supporting_text: >-
        This 2017 row is not part of the current family: PTN000941828 does not
        occur in the PANTHER 19 treeinfo topology for PTHR42964
