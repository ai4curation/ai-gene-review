        enoyl-ACP reductase in this organism.
- term:
    id: GO:0018580
    label: nitronate monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004136
  review:
    summary: >-
      Nitronate monooxygenase activity mapped from an InterPro signature shared with the 2-nitropropane
      dioxygenase family; FabK is a characterized enoyl-ACP reductase and no nitronate activity has been
      reported for it.
    action: REMOVE
    reason: >-
      The assignment comes from the NMO-family signature IPR004136, which FabK matches because it shares
      the FMN-binding TIM-barrel fold with 2-nitropropane dioxygenases - a resemblance the crystal structure
      makes explicit. The same entry also matches IPR017569, the putative type-II enoyl-ACP reductase
      family, which is the correct assignment: the purified protein reduces enoyl-ACP with NADH and FMN,
      and the gene cannot be deleted because it provides the organism's only enoyl reduction step. No
      alkyl-nitronate substrate has been assayed for FabK, so the activity is an unsupported fold-level
      transfer rather than a secondary activity, and the protein name derived from it is an automatic
      ARBA prediction.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR004136
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0018580
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The InterPro2GO mapping of IPR004136 (Nitronate monooxygenase) to GO:0018580 nitronate monooxygenase
        activity reaches Q8DR17, the characterized FMN-dependent enoyl-ACP reductase FabK of S. pneumoniae
        (gene spr0379), which also matches IPR017569 (Putative enoyl-[acyl-carrier-protein] reductase
        II) and the NCBIfam model TIGR03151. FabK reduces enoyl-ACP with NADH (PMID:12487627) and its
        structure is a TIM barrel resembling 2-nitropropane dioxygenase (PMID:18305197), which is why
        the fold-level signature matches; no nitronate substrate has been reported for it. Members that
        also match IPR017569/TIGR03151 should be excluded from the IPR004136 GO:0018580 mapping, and the
        entry's ARBA-derived protein name should follow.
    supported_by:
    - reference_id: PMID:18305197
      supporting_text: >-
        Each subunit formed a triose phosphate isomerase (TIM) barrel structure, and flavin mononucleotide
        (FMN) was bound as a cofactor in the active site.
    - reference_id: PMID:18305197
      supporting_text: >-
        The overall structure was similar to the enoyl-ACP reductase (ER) of fungal fatty acid synthase
        and to 2-nitropropane dioxygenase (2-ND) from Pseudomonas aeruginosa
    - reference_id: PMID:12487627
      supporting_text: >-
        FabK specifically required NADH and the protein activity was stimulated by ammonium ions.
- term:
    id: GO:0004318
    label: enoyl-[acyl-carrier-protein] reductase (NADH) activity
  evidence_type: IDA
  original_reference_id: PMID:12487627
  qualifier: enables
  review:
    summary: >-
      The characterized reaction of the purified enzyme: NADH-dependent reduction of enoyl-ACP, and the
      only enoyl reduction route in S. pneumoniae.
    action: NEW
    reason: >-
      GOA carries no molecular-function term for this activity on this entry, only the generic
      oxidoreductase IBA and an InterPro-derived nitronate monooxygenase row, both above and neither
      of them this reaction.
      The activity itself is directly assayed rather than inferred: the purified protein reduces
      enoyl-ACP, specifically requires NADH (not NADPH), and carries the FMN that mediates the hydride
      transfer; the gene cannot be deleted, which is consistent with it supplying the organism's only
      enoyl-ACP reductase. The NADH specificity in the term label is the assayed cofactor preference,
      which is what separates this term from GO:0141148, the NADPH activity of FabL.
    supported_by:
    - reference_id: PMID:12487627
      supporting_text: >-
        FabK specifically required NADH and the protein activity was stimulated by ammonium ions.
    - reference_id: PMID:12487627
      supporting_text: >-
        We were unable to delete the fabK gene from Strep. pneumoniae, suggesting that this is the only
        enoyl-ACP reductase in this organism.
- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IDA
  original_reference_id: PMID:18305197
  qualifier: enables
  review:
    summary: >-
      FabK carries one non-covalently bound FMN per subunit, identified by mass spectrometry and seen
      in the active site of the crystal structure.
    action: NEW
    reason: >-
      The flavin is what distinguishes FabK from the nicotinamide-only FabI and FabL reductases, and it
      is directly demonstrated twice over: the purified protein's visible absorption spectrum showed a
      flavin that MS identified as FMN in a 1:1 molar ratio with protein, and the 1.7 A structure resolves
      FMN in the active site, stacked against a bound inhibitor. This is missing from the current annotation
      set.
    supported_by:
    - reference_id: PMID:12487627
      supporting_text: >-
        The visible absorption spectrum of the purified protein indicated the presence of a flavin cofactor
        that was identified as FMN by MS, and was present in a 1:1 molar ratio with protein.
    - reference_id: PMID:18305197
      supporting_text: >-
        Each subunit formed a triose phosphate isomerase (TIM) barrel structure, and flavin mononucleotide
        (FMN) was bound as a cofactor in the active site.
