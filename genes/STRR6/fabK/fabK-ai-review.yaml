  review:
    summary: >-
      True of FabK but uninformative on its own, and entailed by the enoyl-ACP reductase activity asserted
      below; the IBA's own node reaches no further than this.
    action: TOO_GENERAL
    reason: >-
      Generic oxidoreductase activity is true of FabK, and the node placement is sound: the IBD sits over
      a clade of FMN-dependent TIM-barrel oxidoreductases holding both FabK and the 2-nitropropane
      dioxygenases. That heterogeneity is also the limit of what the row can say. On the 2026-11-14
      reading, MODIFY needs the deeper term to be reached by this row's own evidence, and descent from
      a clade that mixes enoyl-ACP reductases with nitronate monooxygenases reaches only the shared
      oxidoreductase chemistry - which is exactly what the propagation review below records. The term
      is also imprecise on its own (which oxidoreduction?), the case TOO_GENERAL is reserved for, and
      GO:0004318 enoyl-[acyl-carrier-protein] reductase (NADH) activity is asserted elsewhere in this
      review, as a NEW row on the direct enzymology and as the core function, so it already entails this
      term. The row is therefore kept and marked uninformative rather than refined. Contrast the MECR
      review, where the same ruling licenses MODIFY on an IBA: there the IBD sits on PTHR43981, whose
      members are all mitochondrial enoyl-ACP reductases, so descent from the node does reach the more
      specific term.
