id: Q8DR17
gene_symbol: fabK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:171101
  label: Streptococcus pneumoniae R6
description: >-
  FabK is the flavin-dependent enoyl-[acyl-carrier-protein] reductase of Streptococcus pneumoniae and
  some other Firmicutes. It catalyses the NADH-dependent reduction of the carbon-carbon double bond of
  trans-2-enoyl-ACP to saturated acyl-ACP, the last reaction of each elongation cycle of type II (dissociated)
  fatty-acid synthesis. Unlike the FabI and FabL reductases, which are Rossmann-fold enzymes with a Tyr-(Xaa)6-Lys
  dyad, FabK is a TIM-barrel flavoprotein that carries one non-covalently bound FMN per subunit and is
  resistant to triclosan; a histidine in the active site is the proposed catalytic residue. It is the
  only enoyl-ACP reductase of S. pneumoniae, which cannot tolerate loss of the gene, and it also oxidises
  NADH slowly in the absence of an acyl substrate.
