suggested_questions:
- question: >-
    Does the slow substrate-independent NADH oxidase activity of FabK have a physiological role in oxygen-dependent
    metabolism in streptococci, or is it an unavoidable side reaction of the reduced flavin?
- question: >-
    Can a curated rule separate the FabK enoyl-ACP reductases from true nitronate monooxygenases within
    IPR004136, using the IPR017569/TIGR03151 match as the condition?
suggested_experiments:
- description: >-
    Assay purified FabK with propionate 3-nitronate and other alkyl nitronates to test directly whether
    the nitronate monooxygenase activity transferred from the fold-level signature exists at all, and
    at what rate relative to enoyl-ACP reduction.
- description: >-
    Determine whether the active-site histidine proposed from the inhibitor complex is the catalytic residue,
    by comparing enoyl-ACP reduction and NADH oxidase rates of the histidine variant with wild-type enzyme.
