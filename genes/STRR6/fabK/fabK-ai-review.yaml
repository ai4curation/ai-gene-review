- id: PMID:12487627
  title: >-
    Characterization of Streptococcus pneumoniae enoyl-(acyl-carrier protein) reductase (FabK).
  findings:
  - statement: >-
      Purified FabK is an FMN-containing, NADH-specific enoyl-ACP reductase and is the only enoyl-ACP
      reductase of S. pneumoniae.
    supporting_text: >-
      FabK specifically required NADH and the protein activity was stimulated by ammonium ions.
    reference_section_type: ABSTRACT
  - statement: One FMN per subunit was identified by mass spectrometry.
    supporting_text: >-
      The visible absorption spectrum of the purified protein indicated the presence of a flavin cofactor
      that was identified as FMN by MS, and was present in a 1:1 molar ratio with protein.
    reference_section_type: ABSTRACT
  - statement: >-
      FabK-related proteins of S. aureus and B. subtilis are not enoyl-ACP reductases, so the family name
      does not by itself establish the activity.
    supporting_text: >-
      However, the genes did not complement a fabI (Ts) mutant and the purified flavoproteins were unable
      to reduce enoyl-ACP in vitro and did not exhibit NAD(P)H oxidase activity, indicating they were
      not enoyl-ACP reductases.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary enzymology of S. pneumoniae FabK (Marrakchi et al., Biochem J 2003). Cached
      entry is abstract-only; all quotes used here are from that abstract.
- id: PMID:18305197
  title: >-
    Crystal structure of enoyl-acyl carrier protein reductase (FabK) from Streptococcus pneumoniae reveals
    the binding mode of an inhibitor.
  findings:
  - statement: >-
      The 1.7 A FabK structure is a TIM-barrel flavoprotein with FMN in the active site, resembling fungal
      FAS enoyl reductase and 2-nitropropane dioxygenase.
    supporting_text: >-
      Each subunit formed a triose phosphate isomerase (TIM) barrel structure, and flavin mononucleotide
      (FMN) was bound as a cofactor in the active site.
    reference_section_type: ABSTRACT
  - statement: >-
      An inhibitor competes with NADH for binding, consistent with an NADH site on FabK.
    supporting_text: >-
      Lineweaver-Burk plots indicate that the inhibitor binds competitively with respect to NADH, and
      uncompetitively with respect to crotonoyl coenzyme A.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified structural study of S. pneumoniae FabK (Saito et al., J Biochem 2008). Cached entry
      is abstract-only; quotes taken from that abstract. Used for the FMN cofactor and the fold resemblance
      that explains the nitronate-monooxygenase signature match.
