    summary: >-
      Correct but uninformative parent activity; FabK's characterized reaction is the NADH-dependent reduction
      of enoyl-ACP.
    action: MODIFY
    reason: >-
      Generic oxidoreductase activity is true of FabK, and the IBA node is placed over a clade of FMN-dependent
      TIM-barrel oxidoreductases that includes both FabK and the related 2-nitropropane dioxygenases,
      so the ancestral assignment is sound at that level. The literature on this protein supports a far
      more specific term: purified FabK reduces enoyl-ACP and specifically requires NADH, and it is the
      sole enoyl-ACP reductase of S. pneumoniae. The replacement is a descendant of this term, so the
      row is refined rather than contradicted.
