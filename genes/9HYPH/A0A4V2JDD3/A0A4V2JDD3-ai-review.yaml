taxon:
  id: NCBITaxon:2528245
  label: Hansschlegelia quercus
description: >-
  EYR15_14300 encodes Hans-LanM, a lanmodulin of the facultative methylotroph
  Hansschlegelia quercus. The 133-residue precursor has a predicted 23-residue
  signal peptide and a 110-residue mature chain carrying four EF-hand loops spaced
  12-13 residues apart, the short-linker arrangement that defines the lanmodulin
  family; only EF2 has the proline at loop position 2 that all four Mex-LanM loops
  carry, and the protein shares only about 33% identity with the founding lanmodulin
  of Methylorubrum extorquens. Recombinant mature Hans-LanM binds about three
  equivalents of light lanthanide ions, with picomolar apparent affinity for La(III)
  and Nd(III) and a cooperative disorder-to-order (helix-forming) conformational
  change, while Dy(III) binds more weakly and Ca(II) only at micromolar
  concentration. In crystal structures EF1-EF3 hold lanthanide ions and EF4 does
  not. Light-lanthanide binding drives head-to-tail homodimerization through an
  interface in which Arg100 of one subunit hydrogen-bonds to the EF3 ligands of the
  other, so the dimer is more than 100-fold tighter with La(III) than with Dy(III);
  this metal-sensitive dimerization explains its stronger light versus heavy
  rare-earth discrimination compared with the monomeric Mex-LanM. Its role in
  H. quercus itself has not been studied.
existing_annotations:
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002048
  - UniRule:UR001552760
  review:
    summary: >-
      Electronic transfer of calcium ion binding from the EF-hand domain signature
      (InterPro IPR002048). Hans-LanM does bind Ca(II) in vitro, but only weakly
      (apparent Kd 60 µM, non-cooperative, partial conformational change), roughly
      six orders of magnitude more weakly than it binds light lanthanides.
    action: KEEP_AS_NON_CORE
    reason: >-
      The EF-hand mapping is literally true: purified Hans-LanM responds to Ca(II)
      (PMID:37259003). But the EF hands of this protein are lanthanide sites, bound
      at picomolar concentrations of La(III) and Nd(III), and calcium gives neither
      the cooperative response nor the full conformational change. The row is kept as
      a true but peripheral activity, as was done for the Mex-LanM orthologue
      (genes/METEA/lanM). It is not refined to a more specific term because no GO
      term for lanthanide binding exists; the lanthanide activity is captured by the
      NEW metal ion binding row and the lanthanide ion binding term proposed below.
    supported_by:
    - reference_id: PMID:37259003
      supporting_text: Hans-LanM responds to calcium(II) weakly (Kd,app = 60 µM),
        with the same lack of cooperativity (n = 1.0) and partial conformational
        change evident with DyIII
    - reference_id: PMID:37259003
      supporting_text: the Kd,app values are similar, 68 and 91 pM, respectively
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IDA
  original_reference_id: PMID:37259003
  qualifier: enables
  review:
    summary: >-
      Purified Hans-LanM binds about three equivalents of La(III) and Nd(III) with
      picomolar apparent affinity, and crystal structures show La(III) or Dy(III)
      coordinated in EF1-EF3.
    action: NEW
    reason: >-
      Lanthanide binding is the activity this protein has been characterized for, and
      it is demonstrated directly on purified protein by ICP-MS stoichiometry,
      chelator-buffered circular dichroism titrations and X-ray structures
      (PDB 8DQ2, 8FNR) (PMID:37259003). GOA carries only the EF-hand-derived calcium
      ion binding row, which does not entail lanthanide binding. GO has no lanthanide
      ion binding term (checked in OLS), so metal ion binding is the most specific
      existing term for this activity; it is used here exactly as it is for
      Mex-LanM (genes/METEA/lanM), and a lanthanide ion binding child is proposed in
      proposed_new_terms and is what core_functions now gives as the core activity via
      proposed_molecular_function. The row is kept rather than dropped in favour of that
      proposed term, and the limitation is stated plainly: GO:0046872 is a strict
      ancestor of the GO:0005509 row the gene already carries, so as a term it adds
      nothing the true-path rule does not already entail, and the lanthanide claim it is
      meant to carry lives in this summary and reason rather than in the term. It is
      retained because it is the most specific term that exists today, so it is the only
      lanthanide-motivated row a curator can act on before the proposed term is created,
      and because it marks that the metal-binding claim here is a direct measurement on
      purified protein (ICP-MS, chelator-buffered CD, two crystal structures) rather than
      the EF-hand-derived calcium prediction the GO:0005509 row rests on. Mex-LanM's own
      GOA carries GO:0005509 and GO:0046872 side by side, so the shape has precedent.
      When GO creates the lanthanide term, this row should be replaced by it.
    supported_by:
    - reference_id: PMID:37259003
      supporting_text: The protein binds about three equivalents of LaIII and NdIII,
        and slightly less DyIII, by inductively coupled plasma mass spectrometry
    - reference_id: PMID:37259003
      supporting_text: The final model consists of residues 24–133 in each chain, 12
        LaIII ions (3 per chain in the first, second and third EF hands)
    - reference_id: PMID:37259003
      supporting_text: The conformational change is cooperative (Hill coefficients,
        n, of 2; Supplementary Table 2), and the Kd,app values are similar, 68 and 91
        pM, respectively.
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:37259003
  qualifier: enables
  review:
    summary: >-
      Hans-LanM forms a head-to-tail homodimer whose stability depends on the bound
      metal; the La(III) complex dimerizes more than 100-fold more tightly than the
      apo or Dy(III) forms.
    action: NEW
    reason: >-
      Homodimerization is shown directly on the purified protein by size-exclusion
      chromatography, SEC-MALS, isothermal titration calorimetry, small-angle X-ray
      scattering and the La(III)-bound crystal structure, and it is abolished by the
      interface substitution R100K (PMID:37259003). It is the structural basis of the
      protein's light versus heavy lanthanide selectivity and distinguishes it from
      the monomeric Mex-LanM, so it is an informative activity that no GOA row covers.
      The apo and Dy(III) forms dimerize only weakly (Kdimer 117 and 60 µM), so the
      activity is metal-dependent; its occurrence in the bacterium has not been
      tested, although the authors note that dimerization is tuned to protein
      concentrations of about 10-20 µM.
    supported_by:
    - reference_id: PMID:37259003
      supporting_text: In the presence of LaIII, however, the dimer was too tight to
        be able to observe monomerization by isothermal titration calorimetry, which
        indicates that Kdimer <0.4 µM
    - reference_id: PMID:37259003
      supporting_text: The apoprotein and DyIII-bound protein weakly dimerize, with
        Kdimer values of 117 µM and 60 µM, respectively
    - reference_id: PMID:37259003
      supporting_text: A 1.8-Å-resolution X-ray crystal structure of Hans-LanM in
        complex with LaIII confirms LRE-induced dimerization
    - reference_id: PMID:37259003
      supporting_text: SEC–MALS analysis indicated MWs of 10–13 kDa for apo, LaIII–
        and DyIII–Hans-LanM(R100K)
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:37259003
  title: Enhanced rare-earth separation with a metal-sensitive lanmodulin dimer.
  findings:
  - statement: >-
      Hans-LanM is identified as a lanmodulin by the family hallmarks (four EF hands,
      short inter-loop spacing, at least one Pro2) and shares 33% identity with
      Mex-LanM.
    supporting_text: Hans-LanM features low (33%) sequence identity with Mex-LanM
    reference_section_type: RESULTS
  - statement: >-
      Purified Hans-LanM binds about three equivalents of light lanthanides with
      picomolar apparent affinity and a cooperative conformational change; Dy(III)
      binds more weakly and Ca(II) only at micromolar concentration.
    supporting_text: The protein binds about three equivalents of LaIII and NdIII,
      and slightly less DyIII, by inductively coupled plasma mass spectrometry
    reference_section_type: RESULTS
  - statement: >-
      Light lanthanides induce a tight head-to-tail homodimer; the La(III) dimer is
      more than 100-fold tighter than the Dy(III) dimer, and R100K at the interface
      makes the protein monomeric.
    supporting_text: Thus, LaIII favours Hans-LanM’s dimerization by >100-fold over DyIII.
    reference_section_type: RESULTS
  - statement: >-
      The paper treats the first 23 residues of Hans-LanM as a signal peptide, and the
      construct used for every experiment omits them. This is the same SignalP (v6.0)
      prediction that UniProt records as FT SIGNAL 1..23 (the Methods state that signal
      peptides of LanM sequences were predicted with SignalP and then removed), so it
      corroborates the boundary used for the mature chain but is NOT a second,
      independent line of evidence: no experiment in the paper tests cleavage, export
      or a periplasmic location, and none is done in H. quercus.
    supporting_text: codon optimized for expression in E. coli without its native
      23-residue signal peptide
    reference_section_type: METHODS
  - statement: >-
      Immobilized Hans-LanM(R100K) separated a Nd(III)/Dy(III) mixture in a single
      column stage; this is an engineered in vitro application, not a property of the
      organism.
    supporting_text: The immobilized R100K variant performed even better, achieving
      baseline separation of DyIII and NdIII to >98% purity and >99% yield in a single
      stage
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC10232371). PMID, DOI and title match the UniProt RN line for
      the PDB 8DQ2/8FNR structures of this accession. The only primary study of this
      protein; all experiments use recombinant mature protein (residues 24-133)
      expressed in E. coli. Residue numbers in the paper (Asp85, Glu91, Asp93,
      Arg100) match the displayed UniProt sequence.
- id: file:9HYPH/A0A4V2JDD3/A0A4V2JDD3-bioinformatics/RESULTS.md
  title: Hans-LanM versus Mex-LanM EF-hand loop and pairwise identity comparison
  findings:
  - statement: >-
      Only EF2 of Hans-LanM carries Pro at loop position 2, whereas all four Mex-LanM
      loops do; global identity between the two is about 33%.
    supporting_text: Hans-LanM carries Pro at loop position 2 only in EF2 (Pro59)
core_functions:
- description: >-
    High-affinity, selective binding of light lanthanide ions (La(III), Nd(III)) at
    three EF-hand sites (EF1-EF3) with picomolar apparent affinity and a cooperative
    disorder-to-order conformational change; heavy lanthanides (Dy(III)) bind with
    lower affinity and Ca(II) only at micromolar concentration. A specific lanthanide
    ion binding term does not exist in GO, so the core activity is given here as the
    proposed term rather than as the generic metal ion binding parent that this review
    uses for the annotation row. Lanthanide binding is coupled to metal-sensitive
    homodimerization that enhances light versus heavy rare-earth discrimination. All
    evidence is from purified recombinant protein.
  proposed_molecular_function: lanthanide ion binding
  supported_by:
  - reference_id: PMID:37259003
    supporting_text: The protein binds about three equivalents of LaIII and NdIII,
      and slightly less DyIII, by inductively coupled plasma mass spectrometry
  - reference_id: PMID:37259003
    supporting_text: Therefore, Hans-LanM discriminates more strongly between LREs and
      HREs than does Mex-LanM, with the HRE complexes exhibiting lower affinity, lesser
      cooperativity and a lesser primary conformational change.
  - reference_id: PMID:37259003
    supporting_text: The final model consists of residues 24–133 in each chain, 12
      LaIII ions (3 per chain in the first, second and third EF hands)
proposed_new_terms:
- proposed_name: lanthanide ion binding
  proposed_definition: Binding to a lanthanide ion (La, Ce, Pr, Nd, Pm, Sm, Eu, Gd,
    Tb, Dy, Ho, Er, Tm, Yb or Lu), a trivalent f-block metal cation.
  justification: >-
    Hans-LanM, like Mex-LanM, is characterized by picomolar binding of lanthanide ions
    at EF-hand sites with orders-of-magnitude selectivity over Ca(II); GO currently
    offers only the generic metal ion binding parent. The same term was proposed in
    the Mex-LanM review (genes/METEA/lanM).
suggested_questions:
- question: >-
    Is Hans-LanM expressed, secreted to the periplasm and lanthanide-loaded in
    Hansschlegelia quercus, and does it support lanthanide-dependent (XoxF-type)
    methanol oxidation in this organism?
- question: >-
    Does the light-lanthanide-induced dimer form at the protein concentrations present
    in vivo, and does it contribute to selecting the lanthanides that support growth?
suggested_experiments:
- experiment_type: Gene deletion and growth phenotyping
  description: >-
    Delete EYR15_14300 in H. quercus and compare methanol growth with La(III), Nd(III),
    Dy(III) or Ca(II) only, together with periplasmic fractionation and ICP-MS of
    cell-associated lanthanides, to establish whether the protein acts in lanthanide
    acquisition or homeostasis.
- experiment_type: Subcellular localization
  description: >-
    Fractionate H. quercus cells (or express a tagged protein) to test whether the
    predicted signal peptide directs Hans-LanM to the periplasm, as assumed by
    analogy with Mex-LanM.
