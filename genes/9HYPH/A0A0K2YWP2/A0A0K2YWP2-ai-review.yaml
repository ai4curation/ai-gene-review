      The annotation applies to the T-G1 gene product, which this fragment record represents.
      Characterized PgeF orthologs edit cytoplasmic peptidoglycan precursors. The WSM2073
      counterpart (L0KKS2) has no signal peptide or transmembrane segment, and family
      membership (TIGR00726) puts it in the cytoplasmic stage of peptidoglycan synthesis.
      The fragment itself is too short to carry any targeting signal.
