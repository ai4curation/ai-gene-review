taxon:
  id: NCBITaxon:536018
  label: Mesorhizobium australicum
description: >-
  A0A0K2YWP2 is a 54-residue partial sequence of a PgeF/LACC1-family (YfiH, DUF152)
  protein from Mesorhizobium australicum isolate T-G1. It was obtained as an RT-PCR
  amplicon from primers designed on the WSM2073 locus Mesau_02205. The fragment matches
  the C-terminal region of WSM2073 Mesau_02205 (UniProtKB:L0KKS2, residues 207-260) at
  about 89% identity, and does not include the catalytic cysteine of the family. The
  full-length T-G1 protein is expected to be, like characterized bacterial PgeF, a
  cytoplasmic hydrolase. Such enzymes proofread peptidoglycan precursor synthesis by
  removing misincorporated L-serine or glycine from UDP-N-acetylmuramoyl-peptides. Its
  transcript is more abundant in acidic (pH 5.5) Mn(II)-oxidizing T-G1 cultures than at
  neutral pH. The gene was first described as a putative laccase-like multicopper oxidase,
  a label that comes from the family's historical "Cu-oxidase_4" name. No function of the
  T-G1 protein, including any role in Mn(II) oxidation, has been tested.
