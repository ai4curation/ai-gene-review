alternative_records:
- id: L0KKS2
  relationship: REFERENCE_PROTEOME_CANDIDATE
  reference_proteome: UP000010998
  reviewed_on: '2026-10-28'
  reason: >-
    A0A0K2YWP2 is a 54-residue fragment from strain T-G1 and is kept as its own review.
    L0KKS2 (locus Mesau_02205) is the full-length PgeF of the type strain WSM2073 reference
    proteome, and Bohu et al. designed their primers on it. The two are not the same
    sequence: their UniParc ids differ, and the fragment is 88.9% identical over L0KKS2
    207-260. The source paper calls the T-G1 sequence an ortholog of mesau_02205, which is
    plausible strain-level divergence of one locus. A 54-residue fragment cannot exclude a
    paralog, so the relationship is recorded as a candidate, not an equivalent. GO
    annotations are not transferred between the two records.
  evidence:
  - type: PROTEOME_MEMBERSHIP
    description: The UniProt record of L0KKS2 places it on the chromosome of reference proteome
      UP000010998 (M. australicum WSM2073). A0A0K2YWP2 belongs to no reference proteome.
    supported_by:
    - reference_id: file:MESAW/Mesau_02205/Mesau_02205-uniprot.txt
      record_section: ["DR:Proteomes"]
      supporting_text: Proteomes; UP000010998; Chromosome.
  - type: SEQUENCE_COMPARISON
    description: >-
      Local BLOSUM62 alignment of the fragment to L0KKS2 gives 48/54 identities (88.9%) over
      L0KKS2 residues 207-260, with no gaps. The UniParc identifiers differ (UPI00067A44EE vs
      UPI00022DFB2D), so the sequences are not identical.
    supported_by:
    - reference_id: file:9HYPH/A0A0K2YWP2/A0A0K2YWP2-bioinformatics/RESULTS.md
      supporting_text: The two Mesorhizobium records are NOT the same sequence
    - reference_id: file:9HYPH/A0A0K2YWP2/A0A0K2YWP2-bioinformatics/results.json
      supporting_text: '"percent_identity": 88.9'
  - type: LOCUS_MAPPING
    description: The amplicon primers were designed from the WSM2073 mesau_02205 sequence, and
      the authors describe the deposited T-G1 sequence as the ortholog of that locus. This maps
      the fragment to the corresponding locus by primer design, not by T-G1 genome assembly.
    supported_by:
    - reference_id: PMID:26236307
      supporting_text: The mesau_02205 gene sequence was used to design primers Mesau_02205_163F
    - reference_id: PMID:26236307
      supporting_text: The partial sequence of the orthologs of mesau_02205 for RT-PCR was also
        deposited in the EMBL database under the accession number LN864498.
core_functions:
- description: >-
    Predicted, for the full-length T-G1 protein this fragment represents: a cytoplasmic
    peptidoglycan-precursor editing hydrolase that removes misincorporated L-serine or
    glycine from UDP-MurNAc-peptide precursors. Inferred from family membership of the
    WSM2073 counterpart. The fragment itself lacks the catalytic cysteine region.
  proposed_molecular_function: UDP-N-acetylmuramoyl-peptide editing amidase activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:40632566
    supporting_text: Detailed biochemical analysis of several bacterial PgeF homologs reveals
      that PgeF specifically cleaves serine or glycine but not alanine from the PG precursors.
  - reference_id: file:9HYPH/A0A0K2YWP2/A0A0K2YWP2-bioinformatics/RESULTS.md
    supporting_text: The fragment therefore covers only the C-terminal quarter of the PgeF domain.
proposed_new_terms:
- proposed_name: UDP-N-acetylmuramoyl-peptide editing amidase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the amide bond between the lactyl group of
    UDP-N-acetylmuramic acid and the first amino acid of a UDP-N-acetylmuramoyl-peptide
    peptidoglycan precursor, preferentially when that residue is a non-canonical L-serine
    or glycine instead of L-alanine. The products are UDP-N-acetylmuramate and the free
    peptide. The activity proofreads cytoplasmic peptidoglycan precursor synthesis.
  justification: >-
    Same proposal as in the L0KKS2 (Mesau_02205) review. PgeF activity has been shown
    biochemically (PMID:40632566), but GO has no term for it. GO:0008745
    N-acetylmuramoyl-L-alanine amidase activity is defined on cell-wall glycopeptides,
    under peptidoglycan muralytic activity.
  proposed_parent:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear
      amides
  supported_by:
  - reference_id: PMID:40632566
    supporting_text: confirming that PgeF cleaves the amide bond between UDP-MurNAc and the peptide
