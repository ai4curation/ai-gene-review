suggested_questions:
- question: Does the T-G1 genome encode a single PgeF-family gene (the presumed ortholog of
    Mesau_02205), and does it also encode cupredoxin-domain multicopper oxidases that would
    better explain the proteinase-K-sensitive Mn(II) oxidation?
suggested_experiments:
- description: Sequence the full-length T-G1 PgeF gene and genome, then test whether deletion of
    the PgeF gene changes Mn(II) oxidation at pH 5.5 compared with deletion of candidate
    cupredoxin-domain MCO genes.
  experiment_type: gene knockout
