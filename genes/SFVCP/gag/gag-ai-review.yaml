- id: file:genes/SFVCP/gag/gag-uniprot.txt
  title: UniProtKB Q87039 (GAG_SFVCP) flat-file record
  findings:
  - statement: >-
      UniProt's curated description of the entry, used here for the GR-box, PTAP/PSAP L
      domain, NLS and chain definitions and for the spumaretrovirus-specific features of
      Gag processing and budding. All functional statements in the record carry
      ECO:0000250 (by similarity), consistent with protein existence level 3, so it is
      cited as curated summary rather than as experimental evidence for this isolate.
    record_section: ["CC:MISCELLANEOUS"]
    supporting_text: Mature particles do not include the usual processed retroviral
      structural protein (MA, CA and NC), but instead contain two large Gag proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reviewed Swiss-Prot record for the entry under review. Its FUNCTION, SUBUNIT and
      SUBCELLULAR LOCATION blocks are curated free text transferred by similarity from
      prototype foamy virus, which is itself the central observation of this review; its
      DOMAIN, MOTIF, REGION and CHAIN features are the sequence-level facts used for the
      GR boxes, the PSAP motif at 289-292, the NLS at 540-561 and the two PRO_ chains.
- id: PMID:17530924
  title: Centrosomal latency of incoming foamy viruses in resting cells.
  findings:
  - statement: >-
      Incoming foamy virus Gag and the viral DNA genome localize at the centrosome of
      resting primary fibroblasts and CD4-positive T cells and persist there for weeks as
      unprocessed capsids; cell-cycle re-entry triggers Gag cleavage, nuclear import and
      productive infection.
    supporting_text: Incoming foamy retroviruses can stably persist at the centrosome,
      awaiting cell stimulation to initiate capsid cleavage, nuclear import, and viral gene
      expression.
  - statement: >-
      The paper contains no chromosome or chromatin assay. The only occurrence of
      "chromosomes" in the full text is a general introductory statement about retroviral
      pre-integration complexes, and the word "chromatin" does not occur at all, so the
      paper cannot support the GO:0044383 host chromosome annotation keyed to it.
    supporting_text: retroviruses undergo uncoating and reverse transcription, leading to
      the formation of pre-integration complexes, which must then gain access to the
      nuclear compartment and integrate the provirus into host chromosomes
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      PubMed-verified, full text cached, and genuinely about foamy virus Gag - it is the
      best source for centrosomal targeting and latency of the incoming particle, which is
      how it is used here. It is miscited for the annotation it is attached to: the CACAO
      GO:0044383 host chromosome row has no basis in this paper, whose chromatin result
      lives in the companion study PMID:18627573. Also note the experiments are on
      prototype foamy virus, not on the SFVcpz isolate this entry describes.
- id: PMID:21255441
  title: A nuclear export signal within the structural Gag protein is required for
    prototype foamy virus replication.
  findings:
  - statement: >-
      Wild-type PFV Gag distributes between cytoplasm, nucleus and a nucleocytoplasmic
      pattern in transfected HeLa cells, scored by confocal immunofluorescence over three
      experiments of 200 cells (Figure 1D). This is the direct localization evidence behind
      the host cell nucleus annotation.
    supporting_text: "Wild-type Gag proteins were detected in the cytoplasm for 33% ± 2% of
      transfected cells, including around the centrosome, within the nucleus (28% ± 2%) or
      harbored a nucleocytoplasmic distribution (39% ± 2%)"
  - statement: >-
      A leptomycin B-sensitive, CRM1-dependent nuclear export signal at aa 95-112 of Gag is
      required for the late stages of replication; deletion or point mutation of it
      redistributes Gag into the nucleus and blocks capsid assembly and egress, and the
      mutant sequesters wild-type Gag in the nucleus.
    supporting_text: Therefore, the PFV Gag domain encompassing aa 95 to 112 constitutes an
      effective LMB-sensitive nuclear export signal.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached and read. Figure 1D is an explicit quantified
      confocal localization of wild-type Gag, so it supports the CACAO IDA row; the mutant
      series supports the companion IMP row. The one reservation is taxonomic rather than
      evidential: all constructs are prototype foamy virus Gag (UniProtKB:P14349), not
      SFVcpz Q87039, recorded as a source defect on the annotations.
- id: PMID:22393357
  title: Investigating the intercellular spreading properties of the foamy virus Gag
    protein.
  findings:
  - statement: >-
      The apparent cell-to-cell spreading and nuclear accumulation of PFV Gag, and of its
      isolated GR box II fused to GFP, occurs only after methanol fixation and never in
      living cells or after glutaraldehyde fixation; the authors conclude it is an
      artificial diffusion event during fixation, followed by nuclear retention mediated by
      the chromatin-binding sequence in GR box II.
    supporting_text: we established that spreading and nuclear localization of the PFV Gag
      is due to artificial transport occurring during cell fixation
  - statement: >-
      The paper's own positive statement that Gag is nuclear is a citation to earlier
      studies rather than new data, and it notes that the GR box II nuclear localization
      signal has been challenged.
    supporting_text: PFV Gag displays different patterns of subcellular distribution, being
      localized in the cytoplasm, the nucleus and the centrosome in transfected and
      infected cells
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed-verified and full text cached. The paper is sound and about the right protein,
      but it is the wrong citation for an IDA on host cell nucleus: the nuclear Gag signal
      it reports is the fixation artefact it was written to expose, and its statement that
      Gag is nuclear in transfected and infected cells is a review of prior work. Useful
      here as a secondary source for the GR box II chromatin-binding sequence and as a
      caution against single-fixation localization claims.
- id: PMID:18627573
  title: Chromatin tethering of incoming foamy virus by the structural Gag protein.
  findings:
  - statement: >-
      A short C-terminal domain of foamy virus Gag binds host chromosomes by interacting
      with H2A/H2B core histones; mutating it abolishes chromosomal attachment of incoming
      subviral complexes and prevents proviral integration while leaving particle
      production, entry and intracellular trafficking intact.
    supporting_text: we identify a short domain within the C-terminus of the structural Gag
      protein that efficiently binds host chromosomes, by interacting with H2A/H2B core
      histones
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the cache (no PMC record), so quotes here are from
      the abstract. This is the paper that actually establishes GO:0044383 host chromosome
      for foamy virus Gag and the separation of chromatin tethering from entry and
      trafficking; it is the reference the CACAO host-chromosome row should carry.
- id: PMID:12857789
  title: Targeting of incoming retroviral Gag to the centrosome involves a direct interaction
    with the dynein light chain 8.
  findings:
  - statement: >-
      Foamy virus Gag targets the pericentrosomal region in transfected cells without any
      other viral component, in a microtubule- and dynein/dynactin-dependent manner, through
      a 30-residue N-terminal coiled-coil motif and a direct interaction with dynein light
      chain 8 (DYNLL1).
    supporting_text: we describe a direct interaction between Gag and dynein light chain 8
      that probably accounts for the specific routing of the incoming capsids to the
      centrosome prior to nuclear import of the viral genome
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the cache, so quotes are from the abstract. It is
      the primary support for GO:0075521 and for the host cell centrosome replacement
      proposed for the host cytoskeleton row, and it establishes that Gag is the active
      adaptor rather than passive cargo in retrograde transport.
- id: PMID:15858022
  title: Identification of domains in gag important for prototypic foamy virus egress.
  findings:
  - statement: >-
      PFV Gag carries PSAP, PPPI and YEIL motifs. PSAP acts as a conventional class E VPS L
      domain, interacting with TSG101 in a PSAP-dependent manner in yeast two-hybrid; PPPI
      supports release by a Vps4-independent route; YEIL is required at an assembly step
      before budding.
    supporting_text: yeast two-hybrid analysis showed a PSAP motif-dependent interaction
      between PFV Gag and Tsg101
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Primary support for GO:0039702 and for keeping the
      parent GO:0046755 alongside it, since the PPPI-dependent route is ESCRT/Vps4
      independent.
- id: PMID:23618494
  title: An N-terminal domain helical motif of Prototype Foamy Virus Gag with dual functions
    essential for particle egress and viral infectivity.
  findings:
  - statement: >-
      Foamy virus release requires a highly specific Gag-Env interaction that heterologous
      Env cannot complement; the determinant maps to an N-terminal helical region of Gag,
      and the N-terminal 129 residues suffice for release while their loss abolishes it.
    supporting_text: a minimal PFV Gag protein comprising the N-terminal 129 aa was released
      into the supernatant, whereas proteins lacking this domain failed to do so
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Establishes the Env-dependence of foamy budding and
      maps the Gag side of the interaction, which is why GO:0046755 and GO:0019076 are
      accepted as participation rather than as mere requirement.
- id: PMID:8970944
  title: The carboxyl terminus of the human foamy virus Gag protein contains separable
    nucleic acid binding and nuclear transport domains.
  findings:
  - statement: >-
      The expressed C-terminal GR-box region of foamy virus Gag, the functional equivalent
      of the orthoretroviral nucleocapsid domain, binds both RNA and DNA with high affinity
      and without sequence specificity in filter-binding assays; GR box I is required for
      binding and for replication.
    supporting_text: the NC domain of HFV Gag binds with high affinity to both RNA and DNA,
      in a sequence-independent manner, as determined by filter binding assays
  - statement: >-
      A revertant lacking GR box II shows little nuclear transport of Gag yet replicates in
      tissue culture, which the authors read as evidence that nuclear localization of Gag is
      not critical for infection. This is the main contradiction behind the knowledge gap
      recorded on the chromatin-tethering core function.
    supporting_text: it is unlikely that nuclear localization of Gag protein plays any
      critical role during viral infection
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified; abstract-only in the cache, so quotes are from the abstract. The
      nucleic-acid-binding result is uncontested and is the primary support for the DNA
      binding and RNA binding rows. Its stronger conclusion, that the nuclear stage is
      dispensable, is in tension with the later finding that an NES point mutation is lethal
      and dominant negative (PMID:21255441); both are cited for the knowledge gap rather
      than one being preferred.
- id: PMID:21106749
  title: Novel functions of prototype foamy virus Gag glycine- arginine-rich boxes in
    reverse transcription and particle morphogenesis.
  findings:
  - statement: >-
      Deletion and substitution of each GR box in a four-plasmid PFV vector system leaves
      particle release and genomic RNA packaging largely intact but drastically reduces
      particle-associated DNA content and infectivity; GR box I mutants have altered
      particle morphology and GR box II mutants lose the typical nuclear localization
      pattern of Gag.
    supporting_text: the PFV Gag GR boxes are important for RNA encapsidation, genome
      reverse transcription, and virion infectivity as well as for particle morphogenesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Supports the GR boxes as the nucleocapsid-function
      equivalent and independently confirms that GR box II drives the nuclear localization
      of Gag, which is relevant to all four host-nucleus rows.
- id: PMID:27399201
  title: Cryo-electron Microscopy Structure of the Native Prototype Foamy Virus Glycoprotein
    and Virus Architecture.
  findings:
  - statement: >-
      Cryo-EM and cryo-electron tomography of purified PFV show a capsid of constant
      dimension plus a less ordered shell between capsid and membrane attributed to the Gag
      N-terminal domain together with the cytoplasmic part of the Env leader peptide gp18LP,
      with trimeric Env spikes in the viral membrane.
    supporting_text: Mature PFV particles have a distinct morphology with a capsid of
      constant dimension as well as a less ordered shell of density between the capsid and
      the membrane likely formed by the Gag N-terminal domain and the cytoplasmic part of
      the Env leader peptide gp18LP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Primarily an Env structure paper, used here for the
      architectural placement of Gag in the particle and to show that receptor binding and
      fusion are Env functions, which is the basis for marking the symbiont-entry row
      over-annotated.
- id: PMID:8184531
  title: 'Isolation, cloning, and sequencing of simian foamy viruses from chimpanzees
    (SFVcpz): high homology to human foamy virus (HFV).'
  findings:
  - statement: >-
      SFVcpz, the isolate this UniProt entry describes, is a distinct chimpanzee foamy virus
      from human foamy virus / prototype foamy virus, clustering with it at 86-95%
      amino-acid identity gene by gene. This is the basis for treating the CACAO rows as
      cross-isolate transfers requiring ISS rather than experimental codes.
    supporting_text: Amino acid homologies between corresponding genes of SFVcpz and HFV
      range between 86% for the taf gene and 95% for the pol gene
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the cache. This is the sequencing paper behind
      UniProt Q87039 and the reference that fixes the relationship between this entry and
      P14349, which every CACAO row on this entry depends on.
