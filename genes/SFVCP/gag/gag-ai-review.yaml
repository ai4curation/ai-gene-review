- term:
    id: GO:0046718
    label: symbiont entry into host cell
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004957
  - UniProtKB-KW:KW-1160
  review:
    summary: >-
      Over-annotation from the UniProt keyword. GO:0046718 is the process by which the
      symbiont breaches the plasma membrane or cell envelope and enters the cell, ending
      when the genome is released into it. In foamy viruses that work is done by Env -
      receptor binding and membrane fusion by gp80SU/gp48TM - and Gag is cargo inside the
      entering particle.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Gag's documented early-phase activities all begin after entry: dynein-dependent
      transport of the incoming capsid to the centrosome [PMID:12857789], the stall there
      until cell-cycle re-entry triggers uncoating [PMID:17530924], and chromatin
      tethering of the pre-integration complex [PMID:18627573]. The chromatin-tethering
      study makes the separation explicit, reporting that mutating the chromosome-binding
      domain leaves virus entry and intracellular trafficking unaffected while abolishing
      chromosomal attachment - entry is a separable step that this protein does not
      perform. The term is not simply false (Gag is physically carried in), but applying
      involved_in asserts participation in the breach itself, which belongs to Env. The
      post-entry steps are captured properly by GO:0075521 and GO:0075606 on this same
      entry, so nothing is lost by downgrading this row; marking it over-annotated rather
      than removing it reflects that KW-1160 is routinely applied to incoming structural
      proteins and that this is a keyword-mapping granularity problem, not a claim
      contradicted by data.
    additional_reference_ids:
    - PMID:27399201
    - PMID:12857789
    supported_by:
    - reference_id: PMID:18627573
      supporting_text: While viral particle production, virus entry and intracellular
        trafficking are not affected by mutation of this domain, chromosomal attachment of
        incoming subviral complexes is abolished, precluding proviral integration.
    - reference_id: PMID:27399201
      supporting_text: The viral membrane contains trimeric Env glycoproteins partly
        arranged in interlocked hexagonal assemblies.
- term:
    id: GO:0046755
