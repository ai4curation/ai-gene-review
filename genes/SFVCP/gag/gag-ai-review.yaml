      already carries. Note this is a lateral refinement rather than a strict descendant
      substitution: GO places host cell nucleus and host cell cytoplasm under GO:0043656
      host intracellular region, not under GO:0043657 host cell, so TOO_GENERAL is not
      available even though the intent is the same. Nothing here suggests the claim is
      false.
