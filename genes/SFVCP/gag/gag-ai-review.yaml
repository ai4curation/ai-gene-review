  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1198
  review:
    summary: >-
      Gag is the capsid component whose interaction with the Env leader peptide licenses
      budding, and which carries two late-domain motifs that drive release. The
      pathway-level term is kept alongside the ESCRT-specific child because one of those
      motifs, PPPI, works independently of Vps4.
    action: ACCEPT
    reason: >-
      Foamy virus budding is Gag-driven but strictly Env-dependent, and the Gag
      determinant has been mapped: the N-terminal 129 residues suffice for release and
      their loss abolishes it [PMID:23618494]. Keeping this term is not a redundant
      restatement of GO:0039702, because PFV release that depends on the PPPI motif was
      found to be Vps4-independent and only partially TSG101-dependent [PMID:15858022], so
      part of Gag-driven budding lies outside the ESCRT child term. Foamy virus buds mainly
      into the endoplasmic reticulum rather than the plasma membrane, which is a further
      reason to keep the unqualified parent rather than force a membrane-specific child.
    additional_reference_ids:
    - file:genes/SFVCP/gag/gag-uniprot.txt
    supported_by:
    - reference_id: PMID:23618494
