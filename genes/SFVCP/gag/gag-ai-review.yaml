id: Q87039
gene_symbol: gag
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:298339
  label: Pan troglodytes foamy virus
description: >-
  Gag polyprotein (Pr71Gag) of simian foamy virus, chimpanzee isolate SFVcpz. It is the
  sole structural protein of the viral core and, unlike orthoretroviral Gag, is not
  processed into matrix, capsid and nucleocapsid subunits: a single partial cleavage near
  the C-terminus yields p68Gag plus a 27-residue p3 peptide, and both p71 and p68 are
  present in mature particles. The N-terminal half is the assembly and egress module. It
  multimerises into the capsid shell and, because foamy Gag carries no myristoylation or
  other membrane-targeting signal, it reaches the budding site by binding directly to the
  cytoplasmic tip of the Env leader peptide; budding therefore strictly requires
  co-expressed cognate Env, and particles form predominantly at the endoplasmic reticulum
  and occasionally at the plasma membrane. A PSAP late domain in the same half recruits
  host TSG101 and routes a large part of egress through the ESCRT machinery, while a
  neighbouring PPPI motif supports release by a Vps4-independent route. The C-terminal
  half is intrinsically disordered and carries three glycine-arginine-rich boxes (GR
  boxes) that replace the Cys-His boxes of other retroviruses: they bind RNA and DNA with
  high affinity and little sequence specificity, package the genome, and are required for
  reverse transcription inside the particle and for virion morphogenesis. GR box II
  additionally carries a chromatin-binding sequence that tethers the incoming subviral
  complex to host chromosomes through H2A/H2B core histones, which is how the
  pre-integration complex is held on chromatin until integration, and overlaps a nuclear
  localization signal that drives a transient nuclear stage of newly made Gag; a
  CRM1-dependent nuclear export signal in the N-terminal domain returns Gag to the
  cytoplasm for assembly. Early after infection, Gag binds the dynein light chain DYNLL1
  and carries the incoming capsid along microtubules to the centrosome, where in
  non-dividing cells the particle can persist uncoated for weeks until the cell re-enters
  the cycle.
functional_isoforms:
- id: GAG_P68
  name: Gag protein / p68Gag
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000378592
    residues: 1-626
  description: >-
    The major mature Gag species, produced by partial viral-protease cleavage at the
    626/627 site of Pr71Gag. It retains the N-terminal Env-interaction and L-domain
    region and GR boxes I-III, and is the form that carries the capsid, genome-binding,
    chromatin-tethering and dynein-binding activities. Because the cleavage is only
    partial, p71 and p68 coexist in particles, so no GO-annotatable function is specific
    to p68 as distinct from the uncleaved polyprotein; the distinction is recorded here
    only because UniProt defines it as a separate chain of the same accession.
- id: GAG_P3
  name: p3 / p3Gag
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000378593
    residues: 627-653
  description: >-
    The 27-residue C-terminal peptide released by the partial 626/627 cleavage. UniProt
    records only that it is present in the virion, by similarity; no separate molecular
    function, interaction partner or localization has been reported for it, so it carries
    no GO annotations of its own and is not treated as a separate gene product.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: >-
      The GR-box region of foamy virus Gag, which replaces the orthoretroviral Cys-His
      nucleocapsid motif, binds DNA as well as RNA with high affinity and no sequence
      specificity, so the keyword-derived term is correct and biologically meaningful
      for a virus whose particles can carry a reverse-transcribed dsDNA genome.
    action: ACCEPT
    reason: >-
      Filter-binding assays on the expressed C-terminal NC-equivalent of foamy virus Gag
      show high-affinity, sequence-independent binding to both RNA and DNA, and GR box I
      is required for it [PMID:8970944]. This is not an artefact of in vitro excess:
      foamy viruses proceed to late reverse transcription, so up to 20% of extracellular
      particles contain dsDNA rather than RNA, and Gag is the only protein packaging it.
      The claim for Q87039 itself rests on sequence similarity to the PFV protein
      (P14349), which is the basis of UniProt's own GR-box annotation.
    additional_reference_ids:
    - PMID:21106749
    - file:genes/SFVCP/gag/gag-uniprot.txt
    supported_by:
    - reference_id: PMID:8970944
      supporting_text: the NC domain of HFV Gag binds with high affinity to both RNA and
        DNA, in a sequence-independent manner, as determined by filter binding assays
    - reference_id: PMID:8970944
      supporting_text: this motif is required for nucleic acid binding and for viral replication
    - reference_id: file:genes/SFVCP/gag/gag-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: Gag protein contains 3 glycine-arginine motifs (GR-boxes) necessary
        for RNA packaging, the first of which has nucleic acid binding properties in vitro.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0694
  review:
    summary: >-
      RNA binding by the GR boxes is a core activity: it is how the viral genome is
      selected and encapsidated, and it is required for reverse transcription within the
      particle.
    action: ACCEPT
    reason: >-
      The expressed GR-box region binds RNA with high affinity in filter-binding assays
      [PMID:8970944], and systematic deletion and substitution of each GR box in a
      four-plasmid vector system shows the boxes are needed for RNA encapsidation,
      intraparticle reverse transcription and infectivity [PMID:21106749]. The term is at
      the right granularity: binding is sequence-independent, so no specific RNA-class
      child term applies.
    additional_reference_ids:
    - file:genes/SFVCP/gag/gag-uniprot.txt
    supported_by:
    - reference_id: PMID:21106749
      supporting_text: the PFV Gag GR boxes are important for RNA encapsidation, genome
        reverse transcription, and virion infectivity as well as for particle morphogenesis
    - reference_id: PMID:21106749
      supporting_text: particle-associated DNA content and infectivity were drastically
        reduced for all deletion mutants
- term:
    id: GO:0019013
    label: viral nucleocapsid
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: located_in
  supporting_entities:
  - UniProtKB-KW:KW-0543
  review:
    summary: >-
      Gag is the protein component of the foamy virus nucleocapsid: the GR-box region is
      the functional equivalent of the orthoretroviral NC domain and is the only protein
      bound to the packaged genome.
    action: ACCEPT
    reason: >-
      Foamy virus Gag is not cleaved into MA/CA/NC; the nucleoprotein complex in the
      particle is genome plus Gag, with the C-terminal GR boxes performing the
      NC function [PMID:8970944, PMID:21106749]. The term therefore describes a real
      structure this protein is part of, not a mapping artefact, even though it is
      keyword-derived.
    additional_reference_ids:
    - file:genes/SFVCP/gag/gag-uniprot.txt
    supported_by:
    - reference_id: PMID:8970944
      supporting_text: The Gag protein of human foamy virus (HFV) lacks Cys-His boxes
        present in the nucleocapsid (NC) domains of other retroviruses; instead it contains
        three glycine-arginine-rich motifs (GR boxes)
    - reference_id: file:genes/SFVCP/gag/gag-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: Mature particles do not include the usual processed retroviral
        structural protein (MA, CA and NC), but instead contain two large Gag proteins.
- term:
    id: GO:0019028
    label: viral capsid
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR004957
  - UniProtKB-KW:KW-0167
  review:
    summary: >-
      Gag multimerises into the foamy virus capsid shell; cryo-EM of native PFV particles
      resolves a capsid of constant dimension plus an outer shell attributed to the Gag
      N-terminal domain together with the Env leader peptide.
    action: ACCEPT
    reason: >-
      This is the central structural role of the protein and is supported by direct
      structural work on the particle rather than only by the InterPro Gag_N signature
      [PMID:27399201]. Assembly-competence maps to the same N-terminal region
      [PMID:23618494], so the component and the mechanism agree.
    additional_reference_ids:
    - PMID:23618494
    supported_by:
    - reference_id: PMID:27399201
      supporting_text: Mature PFV particles have a distinct morphology with a capsid of
        constant dimension as well as a less ordered shell of density between the capsid
        and the membrane likely formed by the Gag N-terminal domain and the cytoplasmic
        part of the Env leader peptide gp18LP
- term:
    id: GO:0019076
    label: viral release from host cell
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004957
  review:
    summary: >-
      Gag is required for and actively drives particle release: its N-terminal helical
      motif binds the Env leader peptide to license budding, and its PSAP and PPPI motifs
      are release determinants.
    action: ACCEPT
    reason: >-
      Deleting the N-terminal Env-interaction domain abolishes release, while the
      N-terminal 129 residues alone suffice for release of a minimal Gag [PMID:23618494];
      mutating the PSAP and PPPI motifs reduces egress additively [PMID:15858022]. Gag
      performs part of the work of release rather than merely being cargo, so the
      involved_in claim is sound at this level of the hierarchy.
    additional_reference_ids:
    - file:genes/SFVCP/gag/gag-uniprot.txt
    supported_by:
    - reference_id: PMID:23618494
      supporting_text: a minimal PFV Gag protein comprising the N-terminal 129 aa was
        released into the supernatant, whereas proteins lacking this domain failed to do so
    - reference_id: PMID:15858022
      supporting_text: Mutation of the PSAP and PPPI motifs individually reduced PFV
        egress, and their combined mutation had an additive effect
- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR004957
  - UniProtKB-SubCell:SL-0381
  review:
    summary: >-
      The cytoplasm is where Gag does most of its work: capsid assembly in the late phase
      and dynein-dependent trafficking of the incoming capsid in the early phase both
      occur there.
    action: ACCEPT
    reason: >-
      Direct immunofluorescence puts a third of wild-type Gag wholly in the cytoplasm and
      a further 39% in a nucleocytoplasmic distribution [PMID:21255441], and the published
      consensus is cytoplasmic, nuclear and centrosomal distribution in transfected and
      infected cells [PMID:22393357]. The term is as precise as the assays warrant for
      the bulk pool; the specific cytoplasmic sub-locations it is kept beside are the
      centrosome row and, for the ER budding site, a gap noted in suggested_experiments.
    additional_reference_ids:
    - PMID:22393357
    supported_by:
    - reference_id: PMID:21255441
      supporting_text: "Wild-type Gag proteins were detected in the cytoplasm for 33% ±
        2% of transfected cells, including around the centrosome, within the nucleus (28%
        ± 2%) or harbored a nucleocytoplasmic distribution (39% ± 2%)"
    - reference_id: PMID:22393357
      supporting_text: PFV Gag displays different patterns of subcellular distribution,
        being localized in the cytoplasm, the nucleus and the centrosome in transfected
        and infected cells
- term:
    id: GO:0039702
    label: viral budding via host ESCRT complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1187
  review:
    summary: >-
      The PSAP late domain of Gag behaves as a conventional class E VPS L domain: it binds
      TSG101 in a PSAP-dependent manner and its loss makes release insensitive to dominant
      negative Vps4 and largely insensitive to dominant negative TSG101.
    action: ACCEPT
    reason: >-
      This is one of the best-evidenced parts of foamy Gag biology and is not a bare
      keyword transfer: yeast two-hybrid shows a PSAP-dependent Gag-TSG101 interaction,
      and the dominant-negative epistasis shows the motif is what routes egress through
      ESCRT [PMID:15858022]. Q87039 carries the PTAP/PSAP motif at residues 289-292. The
      second motif, PPPI, works Vps4-independently, which is why the parent viral budding
      term is also kept rather than being treated as redundant.
    additional_reference_ids:
    - file:genes/SFVCP/gag/gag-uniprot.txt
    supported_by:
    - reference_id: PMID:15858022
      supporting_text: yeast two-hybrid analysis showed a PSAP motif-dependent interaction
        between PFV Gag and Tsg101
    - reference_id: PMID:15858022
      supporting_text: 'When PSAP was mutated, residual infectious PFV release was
        unaffected by dominant negative Vps4 (an ATPase involved in the final stages of
        budding), and sensitivity to dominant negative Tsg101 was dramatically reduced,
        suggesting that the PSAP motif functions as a conventional class E VPS-dependent
        L domain'
    - reference_id: file:genes/SFVCP/gag/gag-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: 'Nucleocapsid protein p14 contains one L domain: a PTAP/PSAP
        motif, which interacts with the UEV domain of TSG101'
- term:
    id: GO:0042025
    label: host cell nucleus
  evidence_type: IDA
  original_reference_id: PMID:21255441
  qualifier: part_of
  review:
    summary: >-
      CACAO row. The cited paper does localize Gag to the nucleus directly: Figure 1D
      scores wild-type Gag by confocal immunofluorescence in transfected HeLa cells as
      28% ± 2% nuclear and 39% ± 2% nucleocytoplasmic, and the whole paper is built on
      the NES that returns that nuclear pool to the cytoplasm. The CACAO term matches
      what the figure shows and is at the right granularity.
    action: ACCEPT
    reason: >-
      This is the strongest of the four CACAO rows and the one that grounds the other
      three. The assay is a direct localization of the Gag protein itself (anti-Gag
      immunofluorescence, three experiments of 200 cells), not a phenotype read as a
      location, and the nuclear stage is a genuine, mechanistically characterised part of
      the replication cycle - import via the GR box II NLS [PMID:21106749], export via the
      CRM1-dependent NES at aa 95-112 [PMID:21255441]. The one defect is that the protein
      assayed is prototype foamy virus Gag (UniProtKB:P14349), a sister chimpanzee foamy
      virus isolate, not SFVcpz Q87039; the two Gag sequences are identical across the NES
      (aa 95-112 LAFQDLDLPEGPLRFGPL in both, G110 included) and 92% identical over the
      N-terminal 150 residues, so the claim transfers, but the correct evidence code for
      Q87039 is ISS rather than IDA. That is recorded as a source defect instead of a
      REMOVE, following the curator-deference rule.
    additional_reference_ids:
    - PMID:21106749
    - PMID:8184531
    supported_by:
    - reference_id: PMID:21255441
      supporting_text: "Wild-type Gag proteins were detected in the cytoplasm for 33% ±
        2% of transfected cells, including around the centrosome, within the nucleus (28%
        ± 2%) or harbored a nucleocytoplasmic distribution (39% ± 2%)"
      reference_section_type: RESULTS
    - reference_id: PMID:21106749
      supporting_text: GR box II mutants lacked the typical nuclear localization pattern
        of PFV Gag
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: OTHER
      slot: Evidence_Code
      requested_change: REPOINT
      asserted_value: IDA
      corrected_value: ISS
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Assigned by CACAO (GONUTS/Texas A&M community curation); the responsible resource
        is not in SourceResourceEnum, hence OTHER. The annotation is on UniProtKB:Q87039,
        Gag of simian foamy virus chimpanzee isolate SFVcpz (NCBI:txid298339). Every
        experiment in PMID:21255441 was performed on prototype foamy virus (PFV, formerly
        human foamy virus) Gag, which is a separate UniProt entry, UniProtKB:P14349
        (NCBI:txid11963). An IDA on Q87039 asserts that this protein was assayed, which it
        was not. The two isolates are closely related (86-95% amino-acid identity gene by
        gene; the Gag NES region aa 95-112 is identical), so the localization claim is
        very likely correct for Q87039 and the row should be retained with an
        inference-from-sequence-similarity code (ISS) and WITH/FROM UniProtKB:P14349,
        rather than deleted. The same correction applies to the three other CACAO rows on
        this entry. Alternatively the rows could be re-pointed to P14349, which has no
        Gag host-nucleus annotation of its own.
      supported_by:
      - reference_id: PMID:21255441
        supporting_text: In the case of the prototype foamy virus (PFV), Gag structural
          proteins undergo transient nuclear trafficking after their synthesis, returning
          back to the cytoplasm for capsid assembly and virus egress.
      - reference_id: PMID:8184531
        supporting_text: Amino acid homologies between corresponding genes of SFVcpz and
          HFV range between 86% for the taf gene and 95% for the pol gene
- term:
    id: GO:0042025
    label: host cell nucleus
  evidence_type: IDA
  original_reference_id: PMID:22393357
  qualifier: part_of
  review:
    summary: >-
      CACAO row. The term is right for this protein, but this paper is the wrong support
      for it: the nuclear Gag signal this study reports is the very thing it sets out to
      debunk. Using different fixation procedures the authors establish that the
      intercellular spreading and nuclear accumulation of Gag they see is artificial
      transport occurring during cell fixation, never observed in living cells.
    action: ACCEPT
    reason: >-
      The claim is kept because it is true and because three other rows on this entry
      assert it from sound evidence - a REMOVE here would contradict them and is not the
      way to deal with a bad reference. But the row should not be read as independent
      support. The only statement in this paper that locates Gag in the nucleus in its own
      right is a citation to prior work ("PFV Gag displays different patterns of
      subcellular distribution, being localized in the cytoplasm, the nucleus and the
      centrosome in transfected and infected cells [5], [21], [22]"); the new data show
      bright nuclear fluorescence in methanol-fixed recipient cells and none in live
      cells, and the authors attribute it to leakage during fixation followed by retention
      on chromatin via the GR box II chromatin-binding sequence. Two source defects are
      recorded: the reference does not support an IDA, and, as for every CACAO row here,
      the protein assayed is PFV Gag (UniProtKB:P14349), not SFVcpz Q87039. For the CACAO
      failure taxonomy this is an "artefact paper read as positive evidence" - the mirror
      of the Ebola GP case, where the paper never localized the viral protein; here it
      localized it and then showed the localization was not real.
    additional_reference_ids:
    - PMID:21255441
    supported_by:
    - reference_id: PMID:22393357
      supporting_text: we established that spreading and nuclear localization of the PFV
        Gag is due to artificial transport occurring during cell fixation
      reference_section_type: RESULTS
    - reference_id: PMID:22393357
      supporting_text: We conclude that uptake and nuclear accumulation of PFV Gag in
        naïve recipient cells represents an artificial diffusion event occurring during
        cell fixation with subsequent nuclear retention mediated by the CBS within the
        GRII box
    - reference_id: PMID:21255441
      supporting_text: "Wild-type Gag proteins were detected in the cytoplasm for 33% ±
        2% of transfected cells, including around the centrosome, within the nucleus (28%
        ± 2%) or harbored a nucleocytoplasmic distribution (39% ± 2%)"
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: OTHER
      slot: DB:Reference
      requested_change: REPOINT
      asserted_value: PMID:22393357
      corrected_value: PMID:21255441
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Assigned by CACAO (GONUTS/Texas A&M community curation); the resource is not in
        SourceResourceEnum, hence OTHER. PMID:22393357 is cited as the direct-assay
        support for GO:0042025 host cell nucleus, but its conclusion is that the nuclear
        Gag signal it observes is an artefact of methanol fixation and is absent from
        living cells, so it cannot support an IDA for that component. The paper's own
        statement that Gag is nuclear is a citation to earlier studies. The intended
        evidence is presumably the companion paper from the same laboratory,
        PMID:21255441, which scores nuclear Gag by confocal immunofluorescence (Figure
        1D). Either re-point the reference or delete the row; the term itself is retained
        in this review on the strength of PMID:21255441.
      supported_by:
      - reference_id: PMID:22393357
        supporting_text: By using different fixation procedures, we established that
          spreading and nuclear localization of the PFV Gag is due to artificial transport
          occurring during cell fixation, as already observed in the case of VP22
    - defect_type: WRONG_EVIDENCE_CODE
      resource: OTHER
      slot: Evidence_Code
      requested_change: REPOINT
      asserted_value: IDA
      corrected_value: ISS
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Assigned by CACAO. The annotated entry is UniProtKB:Q87039 (SFVcpz,
        NCBI:txid298339) but the assayed protein is prototype foamy virus Gag,
        UniProtKB:P14349 (NCBI:txid11963). Experimental codes assert that the annotated
        protein was assayed; a cross-isolate transfer between these two closely related
        chimpanzee foamy viruses should carry ISS with WITH/FROM UniProtKB:P14349.
      supported_by:
      - reference_id: PMID:8184531
        supporting_text: DNA and deduced protein sequences of SFVcpz show high homologies
          to human foamy virus (HFV)
