core_functions:
- description: >-
    Structural constituent of the foamy virus core: Gag multimerises into the capsid
    shell, binds the cytoplasmic tip of the Env leader peptide to license budding in the
    absence of any membrane-targeting signal of its own, and recruits host TSG101 through
    its PSAP late domain so that egress proceeds through the ESCRT machinery.
  molecular_function:
    id: GO:0039660
    label: structural constituent of virion
  directly_involved_in:
  - id: GO:0046755
    label: viral budding
  - id: GO:0039702
    label: viral budding via host ESCRT complex
  - id: GO:0019076
    label: viral release from host cell
  locations:
  - id: GO:0030430
    label: host cell cytoplasm
  supported_by:
  - reference_id: PMID:23618494
    supporting_text: FV release requires co-expression and a highly specific interaction
      between capsid (Gag) and glycoprotein (Env), which cannot be complemented by
      heterologous Env proteins
  - reference_id: PMID:15858022
    supporting_text: yeast two-hybrid analysis showed a PSAP motif-dependent interaction
      between PFV Gag and Tsg101
  - reference_id: PMID:27399201
    supporting_text: Mature PFV particles have a distinct morphology with a capsid of
      constant dimension as well as a less ordered shell of density between the capsid and
      the membrane likely formed by the Gag N-terminal domain and the cytoplasmic part of
      the Env leader peptide gp18LP
- description: >-
    Sequence-independent, high-affinity nucleic acid binding by the three C-terminal
    glycine-arginine-rich boxes, which take the place of the orthoretroviral Cys-His
    nucleocapsid motif. This is how the genome is encapsidated, and it is also required
    for reverse transcription inside the particle and for correct virion morphogenesis;
    the same region binds DNA, which matters because foamy particles frequently carry a
    reverse-transcribed dsDNA genome.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  directly_involved_in:
  - id: GO:0019074
    label: viral RNA genome packaging
  locations:
  - id: GO:0030430
    label: host cell cytoplasm
  supported_by:
  - reference_id: PMID:8970944
    supporting_text: the NC domain of HFV Gag binds with high affinity to both RNA and DNA,
      in a sequence-independent manner, as determined by filter binding assays
  - reference_id: PMID:21106749
    supporting_text: the PFV Gag GR boxes are important for RNA encapsidation, genome
      reverse transcription, and virion infectivity as well as for particle morphogenesis
- description: >-
    Adaptor that couples the incoming capsid to the host minus-end microtubule motor. A
    30-residue coiled-coil motif in the Gag N-terminus binds dynein light chain DYNLL1
    directly and is sufficient to drive Gag to the pericentrosomal region in the absence
    of any other viral protein, delivering the viral genome to the centrosome, where in
    non-dividing cells it can remain as an uncoated latent intermediate for weeks.
  molecular_function:
    id: GO:0045503
    label: dynein light chain binding
  directly_involved_in:
  - id: GO:0075521
    label: microtubule-dependent intracellular transport of viral material towards nucleus
  locations:
  - id: GO:0120148
    label: host cell centrosome
  supported_by:
  - reference_id: PMID:12857789
    supporting_text: we describe a direct interaction between Gag and dynein light chain 8
      that probably accounts for the specific routing of the incoming capsids to the
      centrosome prior to nuclear import of the viral genome
  - reference_id: PMID:17530924
    supporting_text: Incoming foamy retroviruses can stably persist at the centrosome,
      awaiting cell stimulation to initiate capsid cleavage, nuclear import, and viral gene
      expression.
- description: >-
    Chromatin tether for the incoming pre-integration complex. A chromatin-binding
    sequence within GR box II binds host chromosomes through the H2A/H2B core histones,
    holding the subviral complex on chromatin until integration; mutating it leaves
    particle production, entry and intracellular trafficking intact but abolishes
    chromosomal attachment and blocks proviral integration. The same region overlaps the
    nuclear localization signal responsible for the transient nuclear stage of newly
    synthesised Gag.
  molecular_function:
    id: GO:0042393
    label: histone binding
  locations:
  - id: GO:0044383
    label: host chromosome
  - id: GO:0042025
    label: host cell nucleus
  supported_by:
  - reference_id: PMID:18627573
    supporting_text: we identify a short domain within the C-terminus of the structural Gag
      protein that efficiently binds host chromosomes, by interacting with H2A/H2B core
      histones
  - reference_id: PMID:18627573
    supporting_text: chromosomal attachment of incoming subviral complexes is abolished,
      precluding proviral integration
  knowledge_gaps:
  - gap_statement: >-
      It is not known whether the transient nuclear stage of newly synthesised Gag has any
      function beyond chromatin binding of incoming complexes, and the published evidence
      is directly contradictory on whether it is required at all.
    boundary: >-
      Firmly established: Gag enters the nucleus, the GR box II NLS drives that import, a
      CRM1-dependent NES at aa 95-112 exports it again, and blocking the NES by point
      mutation or deletion traps Gag in the nucleus, prevents capsid assembly and
      abolishes infectivity, with the NES mutant acting dominant-negatively on wild-type
      Gag. Also established: the GR box II chromatin-binding sequence tethers the incoming
      pre-integration complex to host chromosomes.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    significance: >-
      If the nuclear stage is dispensable, the essential role of the aa 95-112 motif must
      be something other than export - for example Gag-Gag interaction control or Env
      binding - and the "nuclear export signal" framing of a conserved and essential motif
      would be the wrong mechanistic model.
    resolution: >-
      Separation-of-function mutants that abolish nuclear import without perturbing the
      chromatin-binding sequence or the N-terminal helical region, assayed for particle
      release, genome packaging, intraparticle reverse transcription and single-cycle
      infectivity in the same vector system.
    provenance:
    - reference_id: PMID:8970944
      supporting_text: it is unlikely that nuclear localization of Gag protein plays any
        critical role during viral infection
    - reference_id: PMID:21255441
      supporting_text: The role of this nuclear stage as well as the molecular
        mechanism(s) responsible for nuclear export of PFV Gag are not yet understood.
    - reference_id: PMID:22393357
      supporting_text: The GRII box was described as harboring also a nuclear localization
        sequence (NLS) [5], a finding recently challenged [6].
suggested_questions:
- question: >-
    Should experimental GO annotations derived from prototype foamy virus (UniProtKB:P14349)
    experiments be made on P14349 and propagated to the sister isolate SFVcpz
    (UniProtKB:Q87039) as ISS, rather than made directly on Q87039 with an experimental
    code? All four CACAO rows on Q87039 are cross-isolate transfers of PFV results, and
    P14349 itself carries no corresponding Gag annotation.
  experts:
  - Dirk Lindemann
  - Ali Saib
- question: >-
    Is the transient nuclear stage of newly synthesised Gag functionally required, or is
    the essential role of the aa 95-112 motif something other than nuclear export? A GR box
    II deletion revertant replicates in culture despite little nuclear transport, which is
    hard to reconcile with the lethality of NES point mutations.
  experts:
  - Maxine L Linial
  - Ali Saib
  - Dirk Lindemann
- question: >-
    Given that foamy viruses bud predominantly into the endoplasmic reticulum, should Gag
    carry a host endoplasmic reticulum component annotation, and is there a GO process term
    that distinguishes Env-licensed budding into an internal compartment from plasma
    membrane budding?
  experts:
  - Dirk Lindemann
suggested_experiments:
- hypothesis: >-
    The SFVcpz Gag protein itself, and not only its PFV orthologue, localizes to the host
    nucleus, the centrosome and host chromosomes, so that the annotations currently carried
    on Q87039 with experimental codes can be grounded on this isolate.
  description: >-
    Express epitope-tagged SFVcpz Gag (Q87039) in the same HeLa transfection system used
    for PFV Gag and score subcellular distribution by confocal immunofluorescence, in
    parallel with PFV Gag as the reference, using glutaraldehyde as well as methanol
    fixation so that fixation-induced redistribution is controlled for. Follow with a
    mitotic chromosome spread and a histone H2A/H2B pull-down to test chromatin tethering,
    and nocodazole plus dynein inhibition to test centrosomal targeting.
  experiment_type: Comparative confocal immunofluorescence and biochemical fractionation
- hypothesis: >-
    The nuclear import of Gag can be abolished without disturbing chromatin binding, and
    import-deficient but chromatin-binding-competent virus replicates normally.
  description: >-
    Build separation-of-function GR box II mutants in the four-plasmid PFV vector system
    that uncouple the nuclear localization signal from the chromatin-binding sequence, and
    assay each for Gag localization, particle release, genomic RNA packaging,
    particle-associated DNA content and single-cycle infectivity. Include the aa 95-112 NES
    mutants as controls so that the import and export requirements are measured on the same
    scale.
  experiment_type: Reverse genetics with single-cycle infectivity and packaging readouts
- hypothesis: >-
    Gag reaches the budding site on endoplasmic reticulum membranes through the Env leader
    peptide, so Gag is detectable on host ER membranes only when cognate Env is
    co-expressed.
  description: >-
    Co-express Gag with cognate Env, with a heterologous Env, or alone, and determine Gag
    distribution by immuno-electron microscopy and by membrane flotation of
    ER-marker-positive fractions, to establish whether a host endoplasmic reticulum
    component annotation is warranted and whether it is strictly Env-dependent.
  experiment_type: Immuno-electron microscopy and membrane flotation
