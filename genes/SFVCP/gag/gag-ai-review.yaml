  review:
    summary: >-
      CACAO row. The term is right for foamy virus Gag - a chromatin-binding sequence in
      GR box II binds host chromosomes through H2A/H2B core histones - but the cited paper
      does not show it. PMID:17530924 is about centrosomal latency of incoming particles;
      the word "chromatin" never appears in it, and "chromosomes" appears only twice, both
      in one generic Introduction sentence about retroviral provirus integration. Its
      localization data put Gag at the centrosome, and diffusely in cytoplasm and nucleus
      after cell activation.
    action: ACCEPT
    reason: >-
      The claim is kept because it is well established for this protein, just from a
      different paper: PMID:18627573, from the same laboratory one year later, identifies
      the C-terminal domain that "efficiently binds host chromosomes, by interacting with
      H2A/H2B core histones", and shows that mutating it abolishes chromosomal attachment
      of incoming subviral complexes while leaving particle production, entry and
      trafficking intact. That is a clean, specific demonstration of the component and of
      why it matters, so REMOVE would discard a true and functionally central claim.
      Two source defects are recorded: the reference, and the cross-isolate evidence code
      that affects all four CACAO rows here. For the CACAO failure taxonomy this is a
      pattern not yet catalogued - right term, right protein, right evidence code, wrong
      paper from the same group - which no mechanical check can see, because the PMID
      resolves, the title matches, and the paper really is about foamy virus Gag.
