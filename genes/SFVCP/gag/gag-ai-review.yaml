        between capsid (Gag) and glycoprotein (Env), which cannot be complemented by
        heterologous Env proteins
    - reference_id: PMID:15858022
      supporting_text: 'Surprisingly, PFV release which is dependent on the PPPI motif was
        Vps4-independent and was partially inhibited by dominant negative Tsg101,
        suggesting that PPPI functions by an unconventional mechanism to facilitate PFV
        egress'
    - reference_id: file:genes/SFVCP/gag/gag-uniprot.txt
