core_functions:
- description: >-
    Mg(2+)-dependent class II aldolase that cleaves 4-carboxy-4-hydroxy-2-oxoadipate
    (CHA) to pyruvate and oxaloacetate, the terminal step of the protocatechuate
    4,5-cleavage pathway shared by protocatechuate and gallate catabolism.
  molecular_function:
