    label: protocatechuate catabolic process, meta-cleavage
  evidence_type: IDA
  original_reference_id: PMID:12486039
  qualifier: involved_in
  review:
    summary: >-
      LigK catalyses the final step (CHA -> pyruvate + oxaloacetate) of the
      protocatechuate 4,5-cleavage pathway, and its disruption abolishes growth
      on vanillate and syringate.
    action: ACCEPT
    reason: >-
      GO:0019617 is defined as protocatechuate breakdown via meta-cleavage to
