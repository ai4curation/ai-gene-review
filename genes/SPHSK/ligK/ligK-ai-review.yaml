      supporting_text: Inactivation of ligK in S. paucimobilis SYK-6 resulted in the growth deficiency of vanillate and syringate, indicating that ligK encodes the essential CHA aldolase for catabolism of these compounds.
- term:
    id: GO:0046274
    label: lignin catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  supporting_entities:
  - UniPathway:UPA00892
  qualifier: involved_in
  review:
    summary: >-
      UniPathway mapping (UPA00892, lignin degradation). LigK acts on
      intermediates derived from lignin monomers (vanillate, syringate), not on
      the lignin polymer itself.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PCA 4,5-cleavage pathway is the funnelling route for low-molecular
      weight lignin breakdown products in this lignin-degrading bacterium, so
      the term is defensible in its broad sense, but the direct process is
      protocatechuate (and gallate) catabolism; kept as a non-core context
      term.
    supported_by:
    - reference_id: PMID:12486039
      supporting_text: The protocatechuate (PCA) 4,5-cleavage pathway is the essential metabolic route for degradation of low-molecular-weight products derived from lignin by Sphingomonas paucimobilis SYK-6.
- term:
    id: GO:0047443
    label: 4-hydroxy-4-methyl-2-oxoglutarate aldolase activity
  evidence_type: EXP
  original_reference_id: PMID:12486039
  qualifier: enables
  review:
    summary: >-
      Purified LigK cleaves CHA to pyruvate and oxaloacetate (Km 11.2 uM, Vmax
      265 U/mg), Mg(2+)-dependent. The GO term definition explicitly includes
      the CHA reaction (2-hydroxy-4-oxobutane-1,2,4-tricarboxylate =
      oxaloacetate + pyruvate; EC 4.1.3.17).
    action: ACCEPT
    reason: >-
      This is the core catalytic activity of LigK and GO:0047443 is the
      existing term covering CHA aldol cleavage, even though its label names
      only HMG. A CHA-specific child term is proposed (as for P. putida GalC).
    supported_by:
    - reference_id: PMID:12486039
      supporting_text: This result indicated that LigK catalyzes the conversion of CHA to pyruvate and oxaloacetate.
    - reference_id: PMID:12486039
      supporting_text: LigK was suggested to be one of the class II aldolases, which require the metal ion.
