id: G2IQQ8
gene_symbol: ligK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: >-
  LigK is a cytoplasmic, Mg(2+)-dependent class II pyruvate aldolase of the
  LigK/PcmE (RraA-like fold) family that catalyses the last step of the
  protocatechuate 4,5-cleavage (meta-cleavage) pathway: the retro-aldol
  cleavage of 4-carboxy-4-hydroxy-2-oxoadipate (CHA) to pyruvate and
  oxaloacetate. The homohexameric enzyme also decarboxylates oxaloacetate to
  pyruvate and CO2 at a lower rate, and can condense two pyruvate molecules to
  4-hydroxy-4-methyl-2-oxoglutarate (HMG), the reverse of the HMG aldolase
  reaction. Because protocatechuate (from vanillate/guaiacyl units) and
  gallate or 3-O-methylgallate (from syringate/syringyl units) all converge on
  4-oxalomesaconate and then CHA, LigK is essential for growth on vanillate and
  syringate and channels the carbon of lignin-derived aromatic compounds into
  central metabolism. It is the sphingomonad counterpart of the GalC CHA
  aldolase of gallate-degrading pseudomonads.
existing_annotations:
- term:
    id: GO:0008948
    label: oxaloacetate decarboxylase activity
  evidence_type: EXP
  original_reference_id: PMID:12486039
  qualifier: enables
  review:
    summary: >-
      Purified recombinant LigK decarboxylates oxaloacetate to pyruvate and
      CO2, shown by ESI-MS product analysis and an LDH-coupled assay; the
      activity is Mg(2+)-dependent and ~20-fold slower (Vmax) than CHA
      cleavage, with a 12-fold higher Km.
    action: KEEP_AS_NON_CORE
    reason: >-
      The activity is experimentally demonstrated and correctly annotated, but
      it is a secondary activity of the CHA aldolase active site (shared
      pyruvate-enolate chemistry common to class II pyruvate aldolases) rather
      than the physiological pathway step, so it is retained as non-core.
    supported_by:
    - reference_id: PMID:12486039
      supporting_text: It is concluded that LigK is able to decarboxylate oxaloacetate to generate pyruvate.
    - reference_id: PMID:12486039
      supporting_text: The V max for CHA aldol cleavage (265 U/mg) is 20 times higher than that for oxaloacetate decarboxylation (13.2 U/mg).
