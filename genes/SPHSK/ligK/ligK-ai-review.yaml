- term:
    id: GO:0019396
    label: gallate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:12486039
  qualifier: involved_in
  review:
    summary: >-
      In this strain gallate (formed from syringate via 3-O-methylgallate) is
      ring-cleaved by DesB directly to 4-oxalomesaconate, which then enters the
      shared lower pathway terminating in LigK-catalysed CHA cleavage. A ligK
      mutant cannot grow on syringate.
    action: NEW
    reason: >-
      LigK catalyses a step (CHA aldol cleavage) of gallate catabolism to
      central metabolites, the same role for which the orthologous P. putida
      GalC CHA aldolase carries GO:0019396. Participation test met: LigK itself
      performs the C-C cleavage step. Non-core relative to the PCA
      meta-cleavage process but part of the same lower pathway.
    supported_by:
    - reference_id: PMID:16030198
      supporting_text: DesB specifically attacked gallate to generate 4-oxalomesaconate as the reaction product.
    - reference_id: PMID:12486039
      supporting_text: In this alternative pathway, 3MGA was finally converted to OMA and then entered the PCA 4,5-cleavage pathway.
    - reference_id: PMID:12486039
      supporting_text: The obtained mutant strain DLK completely lost the ability to grow on both vanillate and syringate.
