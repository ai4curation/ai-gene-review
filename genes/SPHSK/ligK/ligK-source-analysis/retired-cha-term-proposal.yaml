accession: G2IQQ8
original_proposed_new_terms:
- proposed_name: 4-carboxy-4-hydroxy-2-oxoadipate aldolase activity
  proposed_definition: Catalysis of the reaction 2-hydroxy-4-oxobutane-1,2,4-tricarboxylate 
    (4-carboxy-4-hydroxy-2-oxoadipate) = oxaloacetate + pyruvate.
  justification: GO:0047443 bundles the HMG and CHA aldolase reactions under an HMG-only label. LigK
    (and P. putida GalC) have CHA cleavage as their physiological reaction; a CHA-specific child 
    term (RHEA:28935) would make the protocatechuate/gallate pathway step explicit. Same proposal as
    in the PSEPK galC review.
  proposed_parent:
    id: GO:0047443
    label: 4-hydroxy-4-methyl-2-oxoglutarate aldolase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:28935
      label: 2-hydroxy-4-oxobutane-1,2,4-tricarboxylate = oxaloacetate + pyruvate
  supported_by:
  - reference_id: PMID:12486039
    supporting_text: This result indicated that LigK catalyzes the conversion of CHA to pyruvate and
      oxaloacetate.
reason: The current official GO:0047443 definition already includes the exact CHA cleavage to 
  oxaloacetate and pyruvate. This removes only a redundant top-level ontology request, consistently 
  with the GalC archive; no annotation payload, historical NEW action or catalytic core is 
  withdrawn.
