id: C0SUK1
gene_symbol: ligN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: LigN is a short-chain dehydrogenase/reductase from strain SYK-6 that oxidizes the benzylic
  Calpha hydroxyl of lignin-derived beta-aryl ether dimers using NAD+. It accepts both Cbeta configurations
  of alphaS-configured guaiacylglycerol-beta-guaiacyl ether, producing the corresponding ketone intermediates
  while retaining Cbeta stereochemistry. LigN and LigL have overlapping substrate stereospecificity and
  both contribute to native alphaS-dimer catabolism.
existing_annotations: []
core_functions:
- description: Oxidizes both alphaS/betaR and alphaS/betaS GGE stereoisomers to betaR- and betaS-MPHPV,
    respectively, with NAD+ as oxidant. This is the upstream activation step of the native beta-aryl ether
    dimer pathway. LigN is not assigned a unique beta stereoisomer relative to LigL.
  proposed_molecular_function: arylglycerol-beta-aryl ether Calpha-dehydrogenase (NAD+) activity
  supported_by: &id001
  - reference_id: PMID:19542348
    supporting_text: Chiral HPLC analysis indicated that LigL and LigN have the same stereospecificity
      and transformed (α S ,β R )-GGE and (α S ,β S )-GGE to (β R )-MPHPV and (β S )-MPHPV, respectively
  - reference_id: PMID:19542348
    supporting_text: These results indicated that both ligL and ligN contribute to the degradation of
      (α S ,β R )-GGE and (α S ,β S )-GGE.
proposed_new_terms:
- proposed_name: arylglycerol-beta-aryl ether Calpha-dehydrogenase (NAD+) activity
  proposed_definition: Catalysis of NAD+-dependent oxidation of the benzylic Calpha alcohol of an arylglycerol-beta-aryl
    ether to the corresponding Calpha ketone, producing NADH and a proton while retaining the Cbeta configuration.
  justification: GO:0016616 correctly describes oxidation of a CH-OH donor with a pyridine nucleotide
    acceptor, but does not specify the arylglycerol-beta-aryl ether substrate or NAD+ requirement. GO:0018502
    instead specifies oxidation of 2,5-dichloro-2,5-cyclohexadiene-1,4-diol, a different substrate. A
    substrate-defined child term captures the demonstrated reaction; individual alphaR or alphaS preferences
    remain in the enzyme descriptions.
  supported_by: *id001
  proposed_parent:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
