  review:
    summary: Replace the unsupported chlorinated-substrate assignment with the experimentally established
      arylglycerol-beta-aryl ether Calpha-dehydrogenase activity.
    action: MODIFY
    reason: GO:0018502 denotes oxidation of 2,5-dichloro-2,5-cyclohexadiene-1,4-diol to dichlorohydroquinone,
      not the GGE Calpha oxidation established for ligL in PMID:19542348 and PMID:26940872. Membership
      in the SDR superfamily supports general oxidoreductase chemistry but does not establish this precise
      chlorinated-substrate activity. The assays establish a different physiological substrate; they do
      not experimentally exclude all promiscuous activity on the chlorinated compound. The general NAD+-dependent
      alcohol-oxidation chemistry is sound, but the named substrate is not the experimentally established
      one. MODIFY makes this lateral substrate correction explicit and links the row to the supported
      proposed GGE molecular function. This correction is not a claim that all promiscuous activity on
      the chlorinated compound has been experimentally disproven; the source defect remains SUSPECTED
      and requests CHECK.
    supported_by:
    - &id001
      reference_id: PMID:19542348
      supporting_text: Chiral HPLC analysis indicated that LigL and LigN have the same stereospecificity
        and transformed (α S ,β R )-GGE and (α S ,β S )-GGE to (β R )-MPHPV and (β S )-MPHPV, respectively
        (Fig. 3 ; see Fig. S2 in the supplemental material). On the other hand, LigO converted (α R ,β
        S )-GGE and (α R ,β R )-GGE into (β S )-MPHPV and (β R )-MPHPV, respectively (see Fig. S3 in the
        supplemental material). These results indicated that LigO has the same stereospecificity as LigD.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
