  label: Sphingobium sp. SYK-6
description: LigL is an NAD+-dependent short-chain dehydrogenase/reductase from Sphingobium strain SYK-6.
  It oxidizes the Calpha alcohol of alphaS-configured guaiacylglycerol-beta-guaiacyl ether (GGE), accepting
  both betaR and betaS diastereomers and producing the corresponding beta-configured alpha-keto ether
  MPHPV. This oxidation prepares lignin-derived beta-O-4 dimers for subsequent glutathione-dependent ether
  cleavage. LigL and LigN supply complementary capacity for alphaS GGE oxidation in SYK-6.
