proposed_new_terms:
- proposed_name: arylglycerol-beta-aryl ether Calpha-dehydrogenase (NAD+) activity
  proposed_definition: Catalysis of NAD+-dependent oxidation of the benzylic Calpha alcohol of an arylglycerol-beta-aryl
    ether to the corresponding Calpha ketone, producing NADH and a proton while retaining the Cbeta configuration.
  justification: GO:0016616 correctly describes oxidation of a CH-OH donor with a pyridine nucleotide
    acceptor, but does not specify the arylglycerol-beta-aryl ether substrate or NAD+ requirement. GO:0018502
    instead specifies oxidation of 2,5-dichloro-2,5-cyclohexadiene-1,4-diol, a different substrate. A
    substrate-defined child term captures the demonstrated reaction; individual alphaR or alphaS preferences
    remain in the enzyme descriptions.
  supported_by: *id002
  proposed_parent:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
