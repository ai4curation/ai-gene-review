id: G2IQQ5
gene_symbol: ligJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: >-
  LigJ is a zinc-dependent hydratase of the amidohydrolase superfamily
  (distorted (beta/alpha)8-barrel, cog2159) that catalyses the reversible syn
  addition of water across the C3=C4 double bond of
  (3Z)-2-keto-4-carboxy-3-hexenedioate (KCH) to form
  (4S)-4-carboxy-4-hydroxy-2-oxoadipate (CHA). The single active-site Zn(2+)
  polarizes the substrate C2 carbonyl, and Glu-284 acts as general base and
  then general acid. Originally described as a 4-oxalomesaconate (OMA)
  hydratase, LigJ acts preferentially on KCH, the product of the LigU
  1,3-allylic isomerase, so that in sphingomonads the OMA-to-CHA conversion is
  carried out by LigU plus LigJ. The homodimeric enzyme is required for growth
  on vanillate and syringate, functioning in the lower protocatechuate
  4,5-cleavage pathway that also receives gallate-derived 4-oxalomesaconate,
  and thereby in the bacterial catabolism of lignin-derived aromatic compounds.
