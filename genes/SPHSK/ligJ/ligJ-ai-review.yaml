  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  supporting_entities:
  - InterPro:IPR006680
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from the amidohydrolase-related domain (IPR006680).
      LigJ is a hydratase (lyase, EC 4.2.1.-) that adds water across a C=C
      double bond; no hydrolytic bond cleavage is catalysed.
    action: REMOVE
    reason: >-
      Superfamily-level over-annotation. Structural and biochemical work shows
      the reaction is a hydration (KCH + H2O = CHA), not hydrolysis; many
      amidohydrolase-superfamily members are lyases or isomerases, so the
      domain does not imply hydrolase activity.
    supported_by:
    - reference_id: PMID:30207699
      supporting_text: The overall reaction occurs by the syn addition of water to the double bond between C4 and C3 of the substrate KCH.
