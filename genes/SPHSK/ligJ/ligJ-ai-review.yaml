core_functions:
- description: >-
    Zinc-dependent hydratase that converts (3Z)-2-keto-4-carboxy-3-hexenedioate
    (KCH), formed from 4-oxalomesaconate by LigU, into
    (4S)-4-carboxy-4-hydroxy-2-oxoadipate (CHA) in the lower protocatechuate
    4,5-cleavage pathway that also processes gallate-derived 4-oxalomesaconate.
    GO has no reaction-specific term; the general hydro-lyase term is used here
    and the specific term "2-keto-4-carboxy-3-hexenedioate hydratase activity"
    is requested under proposed_new_terms.
  molecular_function:
    id: GO:0016836
    label: hydro-lyase activity
  directly_involved_in:
  - id: GO:0019617
    label: protocatechuate catabolic process, meta-cleavage
  - id: GO:0019396
    label: gallate catabolic process
  supported_by:
  - reference_id: PMID:30207699
    supporting_text: LigJ from the soil bacterium Sphingobium sp. SYK-6 catalyzes the reversible hydration of (3 Z)-2-keto-4-carboxy-3-hexenedioate (KCH) to 4-carboxy-4-hydroxy-2-oxoadipate (CHA)
  - reference_id: PMID:11092855
    supporting_text: The mutant strain DLJ obtained completely lost the ability to grow on both vanillate and syringate.
proposed_new_terms:
- proposed_name: 2-keto-4-carboxy-3-hexenedioate hydratase activity
  proposed_definition: >-
    Catalysis of the reaction: (3Z)-2-oxo-4-carboxy-3-hexenedioate + H2O =
    (2S)-2-hydroxy-4-oxobutane-1,2,4-tricarboxylate
    ((4S)-4-carboxy-4-hydroxy-2-oxoadipate).
  justification: >-
    LigJ catalyses RHEA:58508 (EC 4.2.1.-) in the sphingomonad protocatechuate
    4,5-cleavage pathway. The only related GO term, GO:0047584
    4-oxalmesaconate hydratase activity, is defined on
    (1E)-4-oxobut-1-ene-1,2,4-tricarboxylate (OMA; RHEA:17401, the GalB-type
    reaction), whereas LigJ's preferred substrate is the LigU product KCH.
  proposed_parent:
    id: GO:0016836
    label: hydro-lyase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:58508
      label: (3Z)-2-oxo-4-carboxy-3-hexenedioate + H2O = (2S)-2-hydroxy-4-oxobutane-1,2,4-tricarboxylate
  supported_by:
  - reference_id: PMID:30207699
    supporting_text: LigJ from the soil bacterium Sphingobium sp. SYK-6 catalyzes the reversible hydration of (3 Z)-2-keto-4-carboxy-3-hexenedioate (KCH) to 4-carboxy-4-hydroxy-2-oxoadipate (CHA)
  - reference_id: PMID:29658701
    supporting_text: We have also shown that the product of the LigU-catalyzed reaction is the preferred substrate for the LigJ hydratase.
suggested_questions:
- question: >-
    Does LigJ hydrate OMA itself at a physiologically relevant rate, or only
    KCH? This determines whether GO:0047584 4-oxalmesaconate hydratase
    activity should also be annotated, or only the proposed KCH hydratase term.
  experts:
  - GO molecular function editors
  - Raushel laboratory (Texas A&M)
suggested_experiments:
- description: >-
    Measure LigJ kinetics with chemically defined (4E)-OMA (keto and enol
    forms, trapped to prevent spontaneous isomerization) versus KCH to
    quantify the substrate preference reported qualitatively for KCH.
  experiment_type: enzyme kinetics / substrate specificity assay
