id: E1CJ68
gene_symbol: ligP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: LigP is a glutathione-dependent beta-etherase from strain SYK-6. It attacks the betaR-configured
  Calpha-keto intermediate MPHPV, replacing the aryloxy group with glutathione and releasing guaiacol.
  The reaction inverts Cbeta stereochemistry, generating a betaS-configured glutathione conjugate for
  downstream deglutathionylation. LigP overlaps with LigE in the native pathway for conversion of lignin-derived
  beta-aryl ether dimers.
existing_annotations: []
core_functions:
- description: Cleaves the beta-aryl ether bond of betaR-MPHPV using glutathione, releasing guaiacol and
    a betaS-glutathionylated ketone. This is the native LigE-overlapping branch, not a generic halide-displacing
    glutathione transferase reaction.
  proposed_molecular_function: glutathione-dependent beta-aryl etherase activity
  supported_by: &id001
  - reference_id: PMID:22146726
    supporting_text: LigP produced in Escherichia coli revealed enantioselectivity for (-)-(βR)-MPHPV,
      and ligE and ligP alone contributed to the degradation of (-)-(βR)-MPHPV in SYK-6.
  - reference_id: PMID:24509858
    supporting_text: β-etherase catalysis causes stereochemical inversion of the chiral center, converting
      a β(R)-substrate to a β(S)-product (LigE and LigP), and a β(S)-substrate to a β(R)-product (LigF).
proposed_new_terms:
- proposed_name: glutathione-dependent beta-aryl etherase activity
  proposed_definition: Catalysis of glutathione-dependent displacement of the aryloxy group from Cbeta
    of a Calpha-keto beta-aryl ether, forming a carbon-sulfur bond between Cbeta and glutathione and releasing
    the corresponding phenol.
  justification: The reaction transfers the carbon group formerly attached to the aryloxy oxygen onto
    glutathione sulfur. GO:0016765 supplies the appropriate broad transferase parent but does not specify
    this substrate or reaction. GO:0004364 defines halide displacement, whereas beta-aryl ether cleavage
    releases a phenol; the reaction is also distinct from ether hydrolysis. Substrate stereoselectivity
    and demonstrated product configuration belong in the individual enzyme or complex description.
  supported_by: *id001
  proposed_parent:
    id: GO:0016765
    label: transferase activity, transferring alkyl or aryl (other than methyl) groups
