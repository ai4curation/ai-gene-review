id: G2IKM4
gene_symbol: ligQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: LigQ is the Nu-class glutathione-dependent deglutathionylase encoded by SLG_04120 in strain
  SYK-6. It converts both stereoisomers of the lignin-dimer intermediate GS-HPV to achiral hydroxypropiovanillone,
  using a second glutathione and producing glutathione disulfide. LigQ prefers betaS-GS-HPV under the
  measured assay conditions. In native cells it supplies the betaS branch and overlaps with LigG on the
  betaR branch; its role concerns soluble dimer intermediates rather than direct attack on intact lignin.
existing_annotations: []
core_functions:
- description: Removes glutathione from both GS-HPV stereoisomers through reductive deglutathionylation,
    yielding HPV and GSSG. Native knockout analysis places LigQ on the betaS branch and jointly with LigG
    on the betaR branch; acceptance of both epimers does not imply equal catalytic efficiency.
  proposed_molecular_function: GS-HPV glutathione-dependent deglutathionylase activity
  supported_by: &id001
  - reference_id: PMID:33244017
    supporting_text: Analyses of mutants of ligG, ligQ, and both genes revealed that SYK-6 converted (βR)-GS-HPV
      using both LigG and LigQ, whereas only LigQ was involved in converting (βS)-GS-HPV.
  - reference_id: PMID:29449375
    supporting_text: the glutathione moiety is removed from GS-HPV and combined with another GSH, producing
      hydroxypropiovanillone (HPV) and glutathione disulfide (GSSG).
proposed_new_terms:
- proposed_name: GS-HPV glutathione-dependent deglutathionylase activity
  proposed_definition: Catalysis of reductive cleavage of the carbon-sulfur bond in glutathionyl-hydroxypropiovanillone
    (GS-HPV), using a second reduced glutathione to form hydroxypropiovanillone and glutathione disulfide.
  justification: GO:0016846 describes carbon-sulfur elimination chemistry, whereas this reaction consumes
    a second GSH and produces GSSG by reductive deglutathionylation. The precise activity should not be
    replaced by an ill-fitting lyase or halide-displacing GST term.
  supported_by: *id001
references:
- id: PMID:33244017
  title: Roles of two glutathione S-transferases in the final step of the β-aryl ether cleavage pathway
    in Sphingobium sp. strain SYK-6.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary SYK-6 purified-enzyme and native knockout study; establishes SLG_04120 as ligQ
      and separates its native betaS role from LigG overlap on betaR.
  findings:
  - statement: Native betaS-GS-HPV conversion requires LigQ, while either LigG or LigQ contributes to
      betaR conversion.
    supporting_text: Analyses of mutants of ligG, ligQ, and both genes revealed that SYK-6 converted (βR)-GS-HPV
      using both LigG and LigQ, whereas only LigQ was involved in converting (βS)-GS-HPV.
  - statement: LigQ accepts both epimers with higher specific activity for betaS under the reported conditions.
    supporting_text: purified LigQ showed an approximately six-fold higher specific activity for (βS)-GS-HPV
      than that for (βR)-GS-HPV.
- id: PMID:29449375
  title: Novosphingobium aromaticivorans uses a Nu-class glutathione S-transferase as a glutathione lyase
    in breaking the β-aryl ether bond of lignin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary Nu-class comparison including the exact SYK-6 SLG_04120 product. Native F199
      necessity is not transferred to SYK-6; the latter native assignment rests on PMID33244017.
  findings:
  - statement: Deglutathionylation consumes a second GSH and forms HPV plus GSSG.
    supporting_text: the glutathione moiety is removed from GS-HPV and combined with another GSH, producing
      hydroxypropiovanillone (HPV) and glutathione disulfide (GSSG).
