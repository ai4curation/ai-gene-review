  review:
    summary: The electronic membrane annotation follows a curated peripheral inner-membrane statement
      whose experimental basis could not be verified.
    action: UNDECIDED
    reason: GO:0005886 includes proteins associated with the plasma membrane, so a peripheral bacterial
      inner-membrane enzyme is compatible with the term. UniProt explicitly records this location. The
      accessible abstracts of PMID:1744051 and PMID:8495726 do not describe localization experiments,
      and attempts to recover the old full text failed. Purification as a soluble GST and lack of a transmembrane
      helix do not disprove peripheral membrane association. Retain the assertion for follow-up rather
      than infer a contradictory cytosolic location.
