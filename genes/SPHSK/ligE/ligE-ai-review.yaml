- id: PMID:12618439
  title: Roles of the enantioselective glutathione S-transferases in cleavage of beta-aryl ether.
  findings:
  - statement: LigE and LigF convert opposite MPHPV enantiomers to guaiacol and a glutathione conjugate
      through nucleophilic attack by glutathione.
    supporting_text: 'Based on the

      identification of the reaction product by electrospray ionization-mass

      spectrometry, a model compound of beta-aryl ether,

      alpha-(2-methoxyphenoxy)-beta-hydroxypropiovanillone (MPHPV), was transformed by

      LigF or LigE to guaiacol and alpha-glutathionyl-beta-hydroxypropiovanillone

      (GS-HPV). This result suggested that LigF and LigE catalyze the nucleophilic

      attack of glutathione on the carbon atom at the beta position of MPHPV.'
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract directly identifies the target enzymes, products and native disruption
      experiments; it does not establish absolute beta configurations.
- id: PMID:24509858
  title: Stereochemical features of glutathione-dependent enzymes in the Sphingobium sp. strain SYK-6
    β-aryl etherase pathway.
  findings:
  - statement: ligE is stereoselective for betaR alpha-carbonyl beta-aryl ether and yields a betaS glutathione
      conjugate by inversion.
    supporting_text: 'β-etherase catalysis causes

      stereochemical inversion of the chiral center, converting a β(R)-substrate to a

      β(S)-product (LigE and LigP), and a β(S)-substrate to a β(R)-product (LigF).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text establishes stereochemistry using defined model substrates, including veratryl
      analogues. General mechanistic stereochemistry is integrated with the MPHPV assays, without treating
      all substrate analogues as chemically identical. The historical unknown fate of betaS conjugates
      is superseded by LigQ studies.
- id: PMID:8495726
  title: A bacterial enzyme degrading the model lignin compound beta-etherase is a member of the glutathione-S-transferase
    superfamily.
  findings:
  - statement: LigE and LigF belong to the GST superfamily; glutathione stimulates beta-etherase activity.
    supporting_text: 'ligF and ligE

      are homologous to glutathione-S-transferase, and upon addition of glutathione a

      remarkable acceleration of beta-etherase activity was found in E. coli carrying

      ligF.'
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Early gene characterization provides historical evidence for GST family membership and
      GSH dependence; subsequent product characterization refines the initial hydrogen-donor description.
- id: PMID:1744051
  title: Cloning and sequencing of the gene for a Pseudomonas paucimobilis enzyme that cleaves beta-aryl
    ether.
  findings:
  - statement: The original ligE clone encodes a beta-aryl ether-cleaving enzyme with native-like kinetics.
    supporting_text: 'Here, we report the isolation and

      characterization of the beta-etherase gene, which contains an open reading frame

      of 843 bp and which we call ligE. This gene was expressed in Escherichia coli,

      and the enzyme had the same kinetic properties as the P. paucimobilis SYK-6

      enzyme.'
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only the abstract was recovered by normal publication retrieval. It supports enzyme
      identity and cloning but does not resolve the provenance of the UniProt peripheral-membrane location
      statement.
