status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: LigE is a glutathione-dependent beta-aryl etherase of Sphingobium strain SYK-6 and a member
  of the glutathione transferase superfamily. It cleaves the beta-O-4 ether bond in alpha-carbonyl lignin-derived
  dimers by glutathione attack at the beta carbon. With betaR-MPHPV, this reaction releases guaiacol and
  forms betaS-GS-HPV with inversion at the beta stereocenter. Subsequent glutathione-dependent deglutathionylation
  releases hydroxypropiovanillone, enabling further aromatic catabolism.
