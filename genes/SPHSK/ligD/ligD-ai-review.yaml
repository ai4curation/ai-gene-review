    id: GO:0046274
    label: lignin catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00892
  review:
    summary: Lignin catabolism is retained as the broader biological context of LigD-mediated dimer oxidation,
      rather than its core biochemical process.
    action: KEEP_AS_NON_CORE
    reason: LigD directly oxidizes both alphaR GGE diastereomers and supplies an experimentally established
      step in utilization of lignin-derived aromatics (PMID:19542348; PMID:7764263). The UniPathway lignin-degradation
      mapping is retained as contextual participation in the broader biological utilization of lignin-derived
      material. GO:0046274 describes lignin polymer breakdown, whereas the demonstrated core function
      here is NAD+-dependent oxidation of low-molecular-weight beta-O-4 dimers; these experiments do not
      establish direct attack on intact polymer. KEEP_AS_NON_CORE reflects this distinction between broader
      biological context and the core catalytic role, not merely a request to replace a general term with
      a more specific descendant.
    supported_by:
    - reference_id: PMID:19542348
      supporting_text: These results strongly suggested that ligD is essential for the conversion of (α
        R ,β S )-GGE and (α R ,β R )-GGE.
