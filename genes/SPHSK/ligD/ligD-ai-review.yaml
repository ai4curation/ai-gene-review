gene_symbol: ligD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:627192
  label: Sphingobium sp. SYK-6
description: 'LigD is an NAD+-dependent short-chain dehydrogenase/reductase from Sphingobium strain SYK-6.
  It oxidizes the Calpha alcohol of alphaR-configured guaiacylglycerol-beta-guaiacyl ether (GGE), accepting
  both betaR and betaS diastereomers and producing the corresponding beta-configured alpha-keto ether
  MPHPV. This oxidation prepares lignin-derived beta-O-4 dimers for subsequent glutathione-dependent ether
  cleavage. LigD supplies the major physiological alphaR oxidation activity in SYK-6: disruption prevents
  conversion of both alphaR GGE diastereomers under the tested conditions.'
