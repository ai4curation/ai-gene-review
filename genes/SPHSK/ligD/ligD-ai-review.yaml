- id: PMID:19542348
  title: Identification of three alcohol dehydrogenase genes involved in the stereospecific catabolism
    of arylglycerol-beta-aryl ether by Sphingobium sp. strain SYK-6.
  findings:
  - statement: ligD oxidizes both beta configurations of alphaR GGE; the alpha configuration, rather than
      a unique alpha/beta pair per paralog, determines this substrate partition.
    supporting_text: These results clearly indicated that LigD converted (α R ,β S )-GGE and (α R ,β R
      )-GGE into (β S )-MPHPV and (β R )-MPHPV, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text resolves the abstract''s potentially misleading use of respectively: LigL/LigN
      share alphaS specificity and LigD/LigO share alphaR specificity. Native mutant phenotypes must be
      distinguished from recombinant enzyme capacity.'
- id: PMID:26940872
  title: Structural and Biochemical Characterization of the Early and Late Enzymes in the Lignin β-Aryl
    Ether Cleavage Pathway from Sphingobium sp. SYK-6.
  findings:
  - statement: Structural and biochemical characterization establishes NAD+-dependent Calpha alcohol oxidation
      and the SDR catalytic mechanism.
    supporting_text: The conversion from GGE to MPHPV during the Cα-dehydrogenase reaction is achieved
      by the loss of a proton and a hydride ion from the substrate, creating NADH from NAD+, and transfer
      of the proton to the bulk solvent (Fig. 1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct structural and biochemical study of LigD, LigO and LigL. The paper's historical
      statement that the betaS GS-HPV route was unknown is superseded by later LigQ work and is not propagated
      here.
- id: PMID:7764263
  title: Characterization of the C alpha-dehydrogenase gene involved in the cleavage of beta-aryl ether
    by Pseudomonas paucimobilis.
  findings:
  - statement: LigD oxidation produces the alpha-carbonyl substrate required by beta-etherases.
    supporting_text: 'C alpha-dehydrogenase catalyzes the oxidation of arylglycerol-beta-aryl ether at

      the C alpha-position, and therefore this process produces the specific substrate

      for beta-etherase, which cleaves beta-ary ethers (C alpha carbonyl type).'
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract directly identifies ligD and its reaction; modern full-text studies
      supply stereochemistry.
