proposed_new_terms:
- proposed_name: arylglycerol-beta-aryl ether Calpha-dehydrogenase (NAD+) activity
  proposed_definition: Catalysis of NAD+-dependent oxidation of the Calpha alcohol of arylglycerol-beta-aryl
    ether dimers to the corresponding alpha-carbonyl beta-aryl ether, producing NADH and a proton. Individual
    enzymes can be stereoselective for the alphaR or alphaS substrate configuration; beta stereochemistry
    is retained.
  justification: Direct substrate/product and stereochemical studies establish this activity, but live
    QuickGO definition and text searches did not identify a precise existing term. A broad family label
    or a chemically different reaction must not substitute for the experimentally established molecular
    function.
  supported_by: *id001
