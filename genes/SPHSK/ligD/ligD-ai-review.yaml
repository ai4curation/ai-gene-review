  review:
    summary: LigD catalyzes the initial oxidation in the catabolism of lignin-derived beta-O-4 dimers.
    action: ACCEPT
    reason: The UniPathway mapping is consistent with the experimentally established participation of
      LigD in lignin-derived aromatic catabolism (PMID:19542348; PMID:7764263). LigD performs an actual
      catalytic step and its disruption blocks both alphaR GGE diastereomers. GO:0046274 refers to lignin
      polymer breakdown; this pathway-level annotation is retained in the established lignin-degradation
      usage, with the explicit limit that the experiments establish low-molecular-weight dimer conversion,
      not extracellular attack on intact lignin polymer. No broader polymer-depolymerase activity is inferred.
    supported_by:
    - reference_id: PMID:19542348
      supporting_text: These results strongly suggested that ligD is essential for the conversion of (α
        R ,β S )-GGE and (α R ,β R )-GGE.
