    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      Cytoplasm from the UniProt subcellular-location mapping. The record's location line is
      ARBA-derived, but it agrees with the family's biology: PgeF edits cytoplasmic
      UDP-MurNAc-peptide precursors, and the protein has no signal peptide or
      transmembrane segment.
    action: ACCEPT
    reason: >-
      The substrates of the core editing activity are cytoplasmic PG precursors (UDP-MurNAc
      mono- to tri-peptides formed by MurC-MurE), so cytoplasm is where the activity takes
      place. E. coli PgeF also has a periplasm IDA (PMID:28612943), which may reflect a
      second pool or fractionation. That evidence is not transferred here. Cytoplasm is the
      appropriate, conservative location.
    supported_by:
    - reference_id: PMID:40632566
      supporting_text: Using extensive mass spectrometry, we find accumulation of misincorporated
        cytoplasmic PG precursors in the absence of pgeF.
    - reference_id: PMID:40632566
      supporting_text: Here, we show that bacterial PgeF is a conserved proofreading enzyme that
        edits misincorporated L-Ser or Gly residues from the cytoplasmic precursors during PG
        synthesis, to preserve cell wall composition.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:40632566
  qualifier: involved_in
  review:
    summary: >-
      Proposed by similarity to characterized bacterial PgeF orthologs (E. coli, Salmonella,
      B. subtilis, G. stearothermophilus). These hydrolyse misligated UDP-MurNAc-peptide
      intermediates of the cytoplasmic stage of PG synthesis and so act as a proofreading
      step of the pathway.
    action: NEW
    reason: >-
      Participation test: PgeF itself catalyses a step on pathway intermediates (hydrolysis of
      the MurNAc-peptide amide of misligated precursors). It is not a substrate or a
      requirement only. This is the same sense in which aminoacyl-tRNA editing domains take
      part in translation fidelity. Comparator: E. coli PgeF carries peptidoglycan metabolic
      process by IMP (PMID:28612943), so the family already sits in this process area. Mesau_02205 is
      a TIGR00726 member with the catalytic cysteine conserved (Cys117 aligned with E. coli
      Cys107). No alphaproteobacterial PgeF has been tested, so the evidence code is ISS,
      not experimental.
    supported_by:
    - reference_id: PMID:40632566
      supporting_text: Overall, these results show that the phenotypes of the E. coli pgeF mutant
        are fully complemented by homologs from other Gram-negative as well as -positive bacteria,
        suggesting their conserved function in the PG biosynthetic pathway.
    - reference_id: PMID:40632566
      supporting_text: Taken together, these results establish that PgeF specifically cleaves
        the UM-intermediates containing the noncanonical amino acids at the first position,
        thereby ensuring the incorporation of L-Ala in the bacterial cell wall
