id: L0KKS2
gene_symbol: Mesau_02205
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:754035
  label: Mesorhizobium australicum WSM2073
description: >-
  Mesau_02205 encodes a 264-residue PgeF/LACC1-family (YfiH, DUF152) protein in the
  alphaproteobacterium Mesorhizobium australicum WSM2073. It carries the NCBIfam
  TIGR00726 peptidoglycan editing factor signature and conserves the catalytic cysteine
  (Cys117, aligned with Cys107 of Escherichia coli PgeF). Characterized bacterial PgeF
  orthologs are cytoplasmic proofreading hydrolases. They remove misincorporated L-serine
  or glycine from UDP-N-acetylmuramoyl-peptide precursors by cleaving the amide bond
  between UDP-MurNAc and the peptide, which keeps L-alanine at the first position of the
  peptidoglycan stem peptide. The same family also shows weak in vitro purine nucleoside
  phosphorylase, adenosine deaminase and S-methyl-5'-thioadenosine phosphorylase
  activities, which in bacteria seem to have no physiological role. The "multicopper
  polyphenol oxidase/laccase" names given to the family come from a disputed early
  report. The protein has no cupredoxin domains and is not a multicopper oxidase.
  No experiment has been done on the Mesorhizobium protein itself. Its transcript was
  measured by qRT-PCR, under the name of a putative laccase-like multicopper oxidase,
  in acidic Mn(II)-oxidizing cultures of the related isolate T-G1. Those data are
  correlative and do not link this protein to Mn(II) oxidation.
existing_annotations:
- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000770205
  review:
    summary: >-
      TreeGrafter IEA transferring copper ion binding to the PgeF/LACC1 family. The family's
      only copper evidence is the 2006 EPR/laccase characterization of metagenomic RL5 and
      E. coli YfiH. A later sensitive LC-MS assay found no laccase products for YfiH or YlmD,
      and the established catalytic mechanism of the family uses a His-Cys-His triad.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Copper binding by YfiH-family proteins is disputed, not refuted. Beloqui et al. 2006
      reported multicopper centres in E. coli YfiH by EPR. Cader et al. 2020 could not detect
      laccase products from YfiH or YlmD, and the editing activity defined in 2025 depends on
      a catalytic cysteine with no metal requirement described. The PTN000770205 node used
      by TreeGrafter is not among the current PAINT IBD nodes of PTHR30616, whose only
      bacterial-root MF assertion is the diphenol oxidase term seeded by the same disputed
      work. Nothing specific to Mesau_02205 supports copper binding. The term over-reaches
      what is known for this protein, but it is kept visible, not removed, because
      experimental EPR data exist for a family member.
    supported_by:
    - reference_id: PMID:16740638
      supporting_text: Kinetic, electrochemical, and EPR analyses provide unequivocal evidence
        that the hypothetical proteins from Bacteroides thetaiotaomicron and from E. coli, which
        are closely related to the deduced protein encoded by the RL5 gene, are also multicopper
        proteins with polyphenol oxidase activity.
    - reference_id: PMID:31978345
      supporting_text: In a sensitive LC-MS method (Perna et al., 2018), laccase end-products
        were only detected with a conventional laccase but not with YlmD, YfiH, or FAMIN254I
    - reference_id: PMID:40632566
      supporting_text: PgeF belongs to a multicopper polyphenol oxidoreductase/laccase superfamily
        with a well-conserved catalytic triad of His-Cys-His
