- id: PMID:40632566
  title: A conserved editing mechanism for the fidelity of bacterial cell wall biosynthesis.
  findings:
  - statement: Bacterial PgeF homologs (E. coli, B. subtilis, G. stearothermophilus) hydrolyse
      the UDP-MurNAc-peptide amide bond of precursors carrying L-Ser or Gly at position 1, and
      the activity depends on catalytic Cys107 (E. coli numbering).
  - statement: Bacterial PgeF has a weak PNP activity that is catalytically independent of
      editing and appears to have no physiological role in E. coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (PNAS 2025;122(28):e2505676122). Full text cached. It is the
      main source for the family's editing activity. No rhizobial homolog was tested.
- id: PMID:28612943
  title: Identification of YfiH (PgeF) as a factor contributing to the maintenance of bacterial
    peptidoglycan composition.
  findings:
  - statement: E. coli yfiH (pgeF) mutants incorporate L-Ser or Gly in place of L-Ala in
      peptidoglycan and are beta-lactam sensitive.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract only. Genetic origin of the PgeF name.
- id: PMID:31978345
  title: FAMIN Is a Multifunctional Purine Enzyme Enabling the Purine Nucleotide Cycle.
  findings:
  - statement: FAMIN/LACC1 and bacterial YfiH/YlmD show adenosine deaminase, PNP and MTA
      phosphorylase activities in vitro. Laccase end-products were not detected for YfiH,
      YlmD or FAMIN by LC-MS.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached. Family-level biochemistry. It argues against
      the laccase/copper oxidase interpretation of the family.
- id: PMID:16740638
  title: 'Novel polyphenol oxidase mined from a metagenome expression library of bovine rumen:
    biochemical properties, structural analysis, and phylogenetic relationships.'
  findings:
  - statement: Metagenomic RL5 and E. coli and B. thetaiotaomicron DUF152 proteins were reported
      as multicopper polyphenol oxidases.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: PubMed-verified, abstract only. Origin of the "Cu-oxidase_4 / multicopper
      polyphenol oxidase" family names. The laccase activity was not reproduced by sensitive
      LC-MS in PMID:31978345.
- id: PMID:26236307
  title: Characterization of pH dependent Mn(II) oxidation strategies and formation of a bixbyite-like
    phase by Mesorhizobium australicum T-G1.
  findings:
  - statement: Mesau_02205 was picked as the only "laccase-like MCO" gene of WSM2073 by an
      annotation keyword search, and qRT-PCR primers designed on it were used to measure
      expression of the T-G1 ortholog. MCO activity was measured only on whole-cell protein.
    supporting_text: Only one laccase-like MCO gene, mesau_02205, was detected.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: PubMed-verified, full text cached. The only paper to mention Mesau_02205.
      Its MCO/laccase framing of the gene rests on a misleading family name. Gene-level data
      are transcript abundance in a different strain (T-G1), so the paper does not support a
      Mn(II)-oxidase function for this protein.
