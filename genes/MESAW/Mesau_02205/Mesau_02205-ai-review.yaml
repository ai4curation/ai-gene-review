suggested_questions:
- question: Is the Mn(II)-oxidizing, proteinase-K-sensitive activity of M. australicum T-G1 due
    to a genuine multicopper oxidase (cupredoxin-domain MCO) elsewhere in the genome, rather
    than to the PgeF-family gene targeted by Bohu et al. 2015?
- question: Should the InterPro/Pfam names "Cu_polyphenol_OxRdtase"/"Cu-oxidase_4" for the YfiH
    family be revised to the PgeF/LACC1 name? They keep leading to multicopper oxidase
    assignments.
suggested_experiments:
- description: Purify recombinant Mesau_02205 and test it on UDP-MurNAc-L-Ser and UDP-MurNAc-Gly
    (with UDP-MurNAc-L-Ala as control), with a C117A mutant, and in parallel test Mn(II)
    oxidation (LBB) and ABTS oxidation, to separate PG-editing from any Mn-oxidase activity.
  experiment_type: in vitro enzyme assay
- description: Delete the PgeF gene in a genetically tractable M. australicum strain and test
    PG composition with L-Ser supplementation and Mn(II) oxidation at pH 5.5.
  experiment_type: gene knockout
