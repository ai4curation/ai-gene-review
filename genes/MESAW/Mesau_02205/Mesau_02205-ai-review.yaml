        cysteine of E. coli PgeF (Cys107, PMID:40632566) aligns to L0KKS2 Cys117
core_functions:
- description: >-
    Predicted cytoplasmic peptidoglycan-precursor editing hydrolase. By homology to
    characterized bacterial PgeF, it removes misincorporated L-serine or glycine (with the
    attached peptide) from UDP-MurNAc-peptide precursors, cleaving the UDP-MurNAc-peptide
    amide bond, so that L-alanine stays at position 1 of the stem peptide. This is inferred
    from family membership and a conserved catalytic cysteine. The Mesorhizobium protein
    has not been tested.
  proposed_molecular_function: UDP-N-acetylmuramoyl-peptide editing amidase activity
  directly_involved_in:
  - id: GO:0009252
    label: peptidoglycan biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:40632566
    supporting_text: Detailed biochemical analysis of several bacterial PgeF homologs reveals
      that PgeF specifically cleaves serine or glycine but not alanine from the PG precursors.
  - reference_id: PMID:40632566
    supporting_text: confirming that PgeF cleaves the amide bond between UDP-MurNAc and the peptide
  - reference_id: file:MESAW/Mesau_02205/Mesau_02205-uniprot.txt
    record_section: ["DR:NCBIfam"]
    supporting_text: NCBIfam; TIGR00726; peptidoglycan editing factor PgeF; 1.
proposed_new_terms:
- proposed_name: UDP-N-acetylmuramoyl-peptide editing amidase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the amide bond between the lactyl group of
    UDP-N-acetylmuramic acid and the first amino acid of a UDP-N-acetylmuramoyl-peptide
    peptidoglycan precursor, preferentially when that residue is a non-canonical L-serine
    or glycine instead of L-alanine. The products are UDP-N-acetylmuramate and the free
    peptide. The activity proofreads cytoplasmic peptidoglycan precursor synthesis.
  justification: >-
    PgeF (YfiH) is a conserved bacterial enzyme whose activity has been shown biochemically
    (PMID:40632566), but GO has no term for it. GO:0008745 N-acetylmuramoyl-L-alanine
    amidase activity is defined on cell-wall glycopeptides and sits under peptidoglycan
    muralytic activity (cell-wall hydrolysis), which does not fit a cytoplasmic
    precursor-editing enzyme. The proposed parent is the linear-amide C-N hydrolase term.
  proposed_parent:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear
      amides
  supported_by:
  - reference_id: PMID:40632566
    supporting_text: confirming that PgeF cleaves the amide bond between UDP-MurNAc and the peptide
  - reference_id: PMID:40632566
    supporting_text: suggesting that PgeF can discriminate and cleave preferentially L-Ser or
      Gly containing UM-derivatives
