id: P07620
gene_symbol: parA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:562
  label: Escherichia coli
description: >-
  ParA is the partition ATPase of the plasmid prophage P1 (the UniProt
  entry is filed under Escherichia coli). It is a Walker-type ATPase with an
  N-terminal helix that mediates dimerization and a winged
  helix-turn-helix. ParA has two DNA-binding modes switched by nucleotide.
  ATP-bound ParA binds DNA non-specifically and associates with the host
  nucleoid; this binding is essential for partition, and ATP hydrolysis
  stimulated by the ParB-parS partition complex drives positioning and
  separation of plasmid copies. ParA, especially when bound to ADP, also
  binds the par operator and represses the parA-parB operon; this
  autoregulation keeps ParB at the level partition needs but is
  dispensable for partition itself when Par protein levels are held low.
existing_annotations:
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:19461582
  qualifier: enables
  supporting_entities:
  - UniProtKB:P07620
  review:
    summary: ParA forms dimers through its N-terminal helix.
    action: MODIFY
    reason: >-
      The self-interaction is real, but identical protein binding does not
      say what it is. Crystal structures show that the N-terminal helix
      mediates dimerization, and biochemistry shows apo-ParA is a dimer at
      physiological concentrations. Protein homodimerization activity
      (GO:0042803) states that.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
    supported_by:
    - reference_id: PMID:19461582
      supporting_text: Biochemical data confirm that apoParA forms dimers at physiological concentrations.
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:8885272
  review:
    summary: ParA is an ATPase, and its nucleotide-binding site is essential for partition.
    action: NEW
    reason: >-
      GOA has only the dimerization row for this protein. ParA is an ATPase;
      disrupting its nucleotide-binding site makes it completely inactive for
      partition even when autoregulation is bypassed, and Walker A mutants
      with damaged ATPase activity lose partition. ATP hydrolysis is the core
      activity of the partition ATPase.
    supported_by:
    - reference_id: PMID:8885272
      supporting_text: The P1 ParA protein is an ATPase that recognizes the parA promoter region where it
        acts to autoregulate the P1 parA-parB operon.
    - reference_id: PMID:11532954
      supporting_text: all exhibited damaged ATPase activity
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:20659294
  review:
    summary: ATP-bound ParA binds DNA non-specifically, the basis of its nucleoid association.
    action: NEW
    reason: >-
      Total internal reflection fluorescence shows ParA binding DNA in an
      ATP-dependent manner, independent of hydrolysis. This non-specific
      binding to the nucleoid is essential for partition. GO has no term for
      non-specific DNA binding, so the general term is used; operator binding
      is a separate row.
    supported_by:
    - reference_id: PMID:20659294
      supporting_text: This activity depends on, and is highly specific for ATP.
    - reference_id: PMID:33055234
      supporting_text: ParA binds to the bacterial nucleoid via an ATP-dependent nonspecific DNA (nsDNA)-binding
        activity, which is essential for partition.
- term:
    id: GO:0030541
    label: plasmid partitioning
  evidence_type: IMP
  original_reference_id: PMID:8885272
  review:
    summary: ParA is the motor of P1 plasmid partition.
    action: NEW
    reason: >-
      ParA does work in the process as the partition ATPase. Its role is
      separate from autoregulation: a nucleotide-binding-site mutant is
      completely inactive for partition in a system where autoregulation is
      not needed.
    supported_by:
    - reference_id: PMID:8885272
      supporting_text: completely inactive for partition in a system in which the need for autoregulation
        is abolished
- term:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  evidence_type: IDA
  original_reference_id: PMID:33055234
  review:
    summary: ParA binds the par operator and represses the parA-parB operon.
    action: NEW
    reason: >-
      ParA binds the par operator site-specifically, with ATP or ADP, and this
      binding is essential for its repressor activity but dispensable for
      partition. Real but peripheral to partition.
    supported_by:
    - reference_id: PMID:33055234
      supporting_text: ParA also has a site-specific DNA-binding activity to the par operator ( parOP ),
        which requires either ATP or ADP, and which is essential for it to act as a transcriptional repressor
        but is dispensable for partition.
- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:11532954
  review:
    summary: ParA autoregulates the par operon.
    action: NEW
    reason: >-
      ATP-site mutants that become super-repressors or weak repressors show
      that ParA represses its own operon. Non-core, as for the repressor
      activity.
    supported_by:
    - reference_id: PMID:11532954
      supporting_text: it acts as a repressor of the par operon
