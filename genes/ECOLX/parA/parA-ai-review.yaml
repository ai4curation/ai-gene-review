suggested_questions:
- question: How does the cell balance ATP-bound (nucleoid-binding) and ADP-bound (operator-binding)
    ParA, given that the two activities compete for the same protein?
suggested_experiments:
- description: Measure ParA nucleotide state and operator occupancy in vivo across the cell cycle.
  hypothesis: Operator binding is dominated by ADP-ParA and rises when partition activity is low.
  experiment_type: ChIP and nucleotide-state assay
