  label: Escherichia coli
description: >-
  ParB is the centromere-binding protein of the plasmid prophage P1 (the
  UniProt entry is filed under Escherichia coli). It binds the bent, roughly
  74-bp parS partition site, whose A-box and B-box motifs flank a binding
  site for host integration host factor (IHF); IHF greatly increases ParB
  affinity for parS. ParB is an asymmetric dimer: N-terminal
  helix-turn-helix domains contact the A-boxes and a dimerized beta-sheet
  module contacts the B-boxes, and the flexibly linked modules can bridge
  adjacent DNA duplexes. ParB-parS complexes form foci near the
  quarter-cell positions, positioned by the partition ATPase ParA, and
  serve as the substrate for plasmid segregation. ParB can also spread for
  kilobases along flanking DNA, although extensive spreading is not needed
  for partition.
