    label: plasmid partitioning
  evidence_type: IDA
  original_reference_id: PMID:10611311
  review:
    summary: ParB-parS complexes are the substrate of P1 plasmid segregation.
    action: NEW
    reason: >-
      ParB does work in the process: it forms the partition complex at parS
      that ParA positions. ParB foci form only with parS, sit near the
      quarter-cell positions, and are mispositioned without ParA. The
      essential role of ParB in partition is also stated in the P1 ParA
      literature. The original parB mutant work is not in the cache, so the
      code is IDA from the localization study rather than IMP.
    supported_by:
    - reference_id: PMID:10611311
      supporting_text: these results indicate that parS recruits a pool of ParB into foci and that the resulting
        ParB-parS complexes serve as substrates for the segregation reaction
    - reference_id: PMID:8885272
      supporting_text: The ParB protein is essential for plasmid partition and recognizes the cis-acting
        partition site parS.
