suggested_questions:
- question: Does P1 ParB bind and hydrolyse CTP like F SopB and RK2 KorB, given that its parS recognition
    module and bridging architecture differ from the ParB/Srx-fold clamps?
- question: Does P1 ParB stimulate ParA ATP hydrolysis directly, as SopB does for SopA through an arginine
    finger?
suggested_experiments:
- description: Assay purified P1 ParB for CTP binding and hydrolysis with and without parS and IHF,
    and test CTP-dependent loading on parS-containing closed DNA.
  hypothesis: P1 ParB is a CTP-dependent clamp like other plasmid ParB proteins.
  experiment_type: enzyme assay and single-molecule DNA loading
