      record_section: ["CC:FUNCTION"]
      supporting_text: Produces ATP from ADP in the presence of a proton gradient
        across the membrane. The catalytic sites are hosted primarily by the beta
        subunits.
    - reference_id: file:CALBD/atpD/atpD-bioinformatics/RESULTS.md
