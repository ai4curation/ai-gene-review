suggested_questions:
- question: >-
    Is the C. bescii F1Fo ATP synthase H+- or Na+-coupled? The c subunit lacks two
    ligands of the I. tartaricus Na+ site, but this has not been tested.
- question: >-
    In which direction does the enzyme mainly run in vivo? C. bescii makes most of
    its ATP by substrate-level phosphorylation, so the ATP synthase could either
    harvest a gradient made by membrane-bound hydrogenase or hydrolyse ATP to keep
    up the membrane potential.
suggested_experiments:
- hypothesis: >-
    The C. bescii F1Fo ATP synthase is H+-coupled and synthesizes ATP during growth
    on cellulose.
  description: >-
    Measure ATP synthesis and ATP-driven ion pumping in inverted membrane vesicles
    of C. bescii with and without Na+ and protonophores, to establish the coupling
    ion and the physiological direction of the enzyme.
  experiment_type: biochemical assay
