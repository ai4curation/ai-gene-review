  - UniRule:UR000101855
  review:
    summary: >-
      F1-beta subunits catalyse ATP synthesis driven by ion flow through Fo. In a
      bacterium this happens at the plasma membrane.
    action: MODIFY
    reason: >-
      Correct but general. The bacterial F1Fo ATP synthase works at the plasma
      membrane, so the specific child GO:0042777 proton motive force-driven plasma
      membrane ATP synthesis applies. E. coli AtpD, to which B9MS68 is 70%
      identical with every catalytic residue conserved, carries GO:0042777 by IMP.
      The proton term assumes H+ coupling; the c subunit lacks two Na+-site ligands,
      which supports it, but the coupling ion has not been measured in C. bescii.
    proposed_replacement_terms:
