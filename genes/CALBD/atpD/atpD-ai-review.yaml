id: B9MS68
gene_symbol: atpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:521460
  label: Caldicellulosiruptor bescii DSM 6725
description: >-
  AtpD (Athe_1424) is the beta subunit of the F-type ATP synthase (F1Fo-ATPase) of
  the extremely thermophilic, anaerobic, cellulolytic bacterium Caldicellulosiruptor
  bescii. Three beta subunits alternate with three alpha subunits to form the
  alpha3beta3 hexamer of the F1 sector, which sits on the cytoplasmic face of the
  plasma membrane and is held to the membrane Fo sector by the central (gamma,
  epsilon) and peripheral (delta, b2) stalks. Beta carries most of the catalytic
  site at each alpha/beta interface: it binds Mg-ADP and phosphate, and rotation
  of the gamma subunit inside the hexamer drives each beta through the open,
  ADP-bound and ATP-bound states of the binding-change cycle, so that ion flow
  through Fo is coupled to ATP synthesis. The complex can also run in reverse,
  hydrolysing ATP to pump ions out. The protein has not been studied directly. Its
  function is inferred from its close similarity (70% identity) to E. coli AtpD,
  whose catalytic residues (Walker A Lys155 and Thr156, catalytic Glu181, Arg182,
  Glu185, Walker B Asp242, adenine-stacking Tyr331 and the DELSEED gamma-contact
  loop) are all conserved. The c subunit encoded nearby (atpE, Athe_1429) lacks two
  ligands of the sodium site of Na+-coupled c rings, which is consistent with
  proton coupling, but the coupling ion of the C. bescii enzyme has not been
  measured.
