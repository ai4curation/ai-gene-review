    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000194
  - InterPro:IPR020003
  - UniRule:UR000101855
  review:
    summary: >-
      Electronic annotation from the InterPro alpha/beta ATPase nucleotide-binding
      domain and the HAMAP rule. B9MS68 has the Walker A motif GGAGVGKT (152-159),
      and every E. coli beta residue known from mutagenesis to form the catalytic
      nucleotide site is conserved.
    action: ACCEPT
    reason: >-
      Nucleotide binding at the catalytic site is a direct property of the beta
      subunit. In E. coli beta, replacing the Walker A threonine abolishes ATPase
      activity (PMID:1832155), and the corresponding residues (Lys158, Thr159,
      Glu184, Tyr335) are conserved in B9MS68. The more informative statement of
      the activity is GO:0046933, which this review also accepts.
