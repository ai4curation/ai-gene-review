- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005722
  - PANTHER:PTN008558588
  - UniRule:UR000101855
  review:
    summary: >-
      The core activity of the F1Fo complex, to which beta contributes the
      catalytic sites. The rotational mechanism was shown for E. coli F1 by
      beta-gamma crosslinking at the beta DELSEED loop (PMID:7479919) and directly
      for thermophilic Bacillus PS3 F1 (PMID:9069291). B9MS68 keeps DELSEED
      (384-390) and the catalytic residues.
    action: ACCEPT
    reason: >-
      This is the central function of the protein. The activity belongs to the
      complex, and beta contributes the catalytic sites to it. The source cited
      here is the F1-beta clade node PTN008558588, below the duplication node
      PTN008558586 that the PTHR15184 family review judges too deep; the problem
      with that node affects the type III export ATPases, not F1-beta members such
      as this one.
    supported_by:
    - reference_id: PMID:7479919
      supporting_text: The results demonstrate that gamma subunit rotates relative
        to the beta subunits during catalysis.
    - reference_id: PMID:8065448
      supporting_text: the three catalytic beta-subunits differ in conformation and
        in the bound nucleotide
    - reference_id: file:CALBD/atpD/atpD-bioinformatics/RESULTS.md
      supporting_text: Every catalytic and coupling residue characterized by mutagenesis
        in E. coli beta is conserved in B9MS68.
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  - InterPro:IPR036121
  review:
    summary: >-
      InterPro2GO mapping from the alpha/beta ATPase N-terminal domain. Protons
      cross the membrane through the Fo sector (subunits a and c), and the
      catalytic cycle of beta is coupled to that flow through the rotor.
    action: KEEP_AS_NON_CORE
    reason: >-
      Beta takes part in proton transport only through coupling within the
      complex; the proton path is in Fo. In hydrolysis mode the complex pumps
      protons, driven by beta catalysis. The term is true at complex level but is
      not the core contribution of beta, and it rests on H+ coupling, which has not
      been measured for C. bescii.
    supported_by:
    - reference_id: PMID:9069291
      supporting_text: F1-ATPase, together with the membrane-embedded proton-conducting
        unit F0, forms the H+-ATP synthase that reversibly couples transmembrane proton
        flow to ATP synthesis/hydrolysis
core_functions:
- description: >-
    Catalytic subunit of the F1 sector of the plasma-membrane F1Fo ATP synthase.
    Three beta subunits, alternating with alpha in the alpha3beta3 hexamer, carry
    the catalytic nucleotide sites; rotation of the central gamma subunit cycles
    them through the binding-change states, coupling ion flow through Fo to ATP
    synthesis from ADP and phosphate.
