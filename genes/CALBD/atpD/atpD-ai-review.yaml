    - reference_id: file:CALBD/atpD/atpD-bioinformatics/RESULTS.md
      supporting_text: Every catalytic and coupling residue characterized by mutagenesis
        in E. coli beta is conserved in B9MS68.
    - reference_id: PMID:1832155
      supporting_text: a beta Thr156----Ala or Cys mutation impaired ATPase activity,
        suggesting that the hydroxyl moiety at position 156 is essential for the
        catalytic activity
