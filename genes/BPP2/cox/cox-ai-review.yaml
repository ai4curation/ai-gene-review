id: P07695
gene_symbol: cox
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Protein Cox (control of excision) is a 91-amino-acid bifunctional winged-helix DNA-binding protein of Escherichia phage P2 that serves both as the lytic switch transcriptional repressor—inhibiting the lysogenic promoter Pc to block repressor C synthesis while negatively autoregulating the early promoter Pe—and as the recombination directionality factor (excisionase) required with integrase Int for prophage excision.
