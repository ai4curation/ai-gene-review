    summary: Cox is required for excisive site-specific recombination of the P2 prophage from the Escherichia coli chromosome.
    action: NEW
    reason: Gene cox (control of excision) stimulates prophage excision and acts as the recombination directionality factor required for excisive recombination between attL and attR.
    supported_by:
    - reference_id: PMID:3475531
