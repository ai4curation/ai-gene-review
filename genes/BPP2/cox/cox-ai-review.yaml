  review:
    summary: Cox is a sequence-specific DNA-binding protein that binds cis-regulatory regions at promoters Pc and Pe and acts as a transcriptional repressor.
    action: MODIFY
    reason: Broad keyword-based annotation; experimental evidence demonstrates that Cox specifically binds regulatory sequences at promoters Pc and Pe to repress transcription, warranting refinement to GO:0000976 (transcription cis-regulatory region binding) and GO:0001217 (DNA-binding transcription repressor activity).
