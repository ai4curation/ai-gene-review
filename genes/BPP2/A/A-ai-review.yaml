suggested_questions:
- question: What structural features of nascent gpA enforce its strict cis-preference for the ori sequence located within its own encoding template?
- question: How does gpA coordinate termination cleavage and religation of unit-length circular monomeric DNA molecules after one round of rolling-circle synthesis?
suggested_experiments:
- description: Determine the cryo-EM or crystal structure of gpA bound to the P2 ori DNA substrate to define the DNA-recognition interface and active-site geometry around Tyr-454.
- description: Perform single-molecule co-transcriptional/co-translational tether assays to test whether ribosome-nascent chain tethering accounts for the strict cis-activity of gpA in vivo.
