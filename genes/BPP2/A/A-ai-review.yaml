id: Q06419
gene_symbol: A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Replication endonuclease gpA is a 761-amino-acid cis-acting early protein of Escherichia phage P2 that initiates modified rolling-circle viral DNA genome replication. It specifically recognizes the phage origin of replication (ori), located within the A coding sequence itself, and introduces a site-specific single-strand nick, becoming covalently attached via Tyr-454 to the 5'-phosphate terminus while liberating a 3'-OH primer for host DNA polymerase extension.
