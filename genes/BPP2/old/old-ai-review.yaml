  label: Bacteriophage P2
description: Protein Old (overcoming lysogenization defect) is a 583-amino-acid Class 1 OLD family antiphage defense enzyme of Escherichia phage P2 comprising an N-terminal ABC-type ATPase domain and a C-terminal Toprim two-metal-ion nuclease domain. Expressed from the P2 prophage, Old exhibits 5'-to-3' double-stranded DNA exonuclease and single-stranded DNA/RNA nuclease activities coupled to ATP hydrolysis, mediating abortive infection that blocks bacteriophage lambda replication and causes lethality in recBC-deficient Escherichia coli hosts.
