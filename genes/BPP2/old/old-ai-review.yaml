suggested_questions:
- question: How does inhibition of host RecBCD by bacteriophage lambda Gam (or genetic loss of recBC) trigger the conformational switch in P2 Old from an autoinhibited ATP-bound state to an active DNA/tRNA-cleaving nuclease?
suggested_experiments:
- description: Perform cryo-EM analysis of full-length P2 Old in the presence of branched DNA repair intermediates and ATP analogs to determine how RecBCD-substrate accumulation allosterically gates the Toprim active site.
