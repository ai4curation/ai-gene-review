  - UniProtKB-SubCell:SL-0373
  review:
    summary: LysB is anchored in the Escherichia coli inner (plasma) membrane via an N-terminal transmembrane helix (residues 9-29).
    action: ACCEPT
    reason: Core localization of the inner-membrane subunit (i-spanin) of the P2 spanin complex.
    supported_by:
    - reference_id: file:BPP2/lysB/lysB-uniprot.txt
      supporting_text: Component of the spanin complex that disrupts the host outer membrane and participates in cell lysis during virus exit.
