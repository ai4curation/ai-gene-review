  qualifier: involved_in
  review:
    summary: LysB acts as the inner-membrane spanin subunit required for efficient outer-membrane disruption and timely host cell lysis at the end of the P2 lytic cycle.
    action: NEW
    reason: An amber mutation in lysB delays host cell lysis (PMID:8051010), consistent with its role as the i-spanin subunit of the two-component LysB-LysC spanin complex.
    supported_by:
    - reference_id: PMID:8051010
      supporting_text: The gene products of lysA and lysB, although nonessential, appear to play a role in the correct timing of lysis, since a lysA amber mutant caused slightly accelerated lysis and a lysB amber mutant slightly delayed lysis of nonpermissive strains.
    - reference_id: file:BPP2/lysB/lysB-uniprot.txt
      supporting_text: Component of the spanin complex that disrupts the host outer membrane and participates in cell lysis during virus exit.
