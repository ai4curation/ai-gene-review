  review:
    summary: Broad keyword-derived term; LysB specifically functions in viral release from the host cell by cytolysis.
    action: MODIFY
    reason: Broad keyword mapping from KW-0204 (Cytolysis); LysB is the i-spanin subunit that promotes host outer-membrane disruption during bacteriophage P2 cytolytic exit, captured by GO:0044659 (viral release from host cell by cytolysis).
