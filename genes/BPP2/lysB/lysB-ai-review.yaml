suggested_questions:
- question: Does the P2 LysB-LysC spanin complex require intermolecular disulfide bond formation in the periplasm (mediated by host DsbA/DsbC) for outer-membrane fusion and lysis, as observed in phage lambda Rz-Rz1?
suggested_experiments:
- description: Assay P2 host cell lysis kinetics in wild-type versus dsbA/dsbC Escherichia coli hosts under divalent-cation-stabilized outer-membrane conditions (+10 mM MgCl2) and analyze LysB/LysC cysteine substitution mutants.
