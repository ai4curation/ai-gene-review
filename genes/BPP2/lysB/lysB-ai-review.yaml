id: P51770
gene_symbol: lysB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Inner membrane spanin subunit LysB (i-spanin) is a 141-amino-acid single-pass transmembrane protein of Escherichia phage P2 that anchors in the host inner membrane and extends a coiled-coil domain into the periplasm to pair with the outer-membrane lipoprotein o-spanin LysC, forming the spanin complex that disrupts the Gram-negative outer membrane following peptidoglycan degradation to complete host cell lysis.
