- id: PMID:8051010
  title: Functions involved in bacteriophage P2-induced host cell lysis and identification of a new tail gene.
  findings:
  - statement: Sequenced the P2 lysis cluster and showed that a lysA amber mutation causes accelerated host cell lysis.
    supporting_text: The gene products of lysA and lysB, although nonessential, appear to play a role in the correct timing of lysis, since a lysA amber mutant caused slightly accelerated lysis and a lysB amber mutant slightly delayed lysis of nonpermissive strains.
- id: PMID:23335412
  title: Functional analysis of a class I holin, P2 Y.
  findings:
  - statement: Demonstrated that LysA is a Y-specific antiholin that delays Y-mediated lysis by ~10 minutes and increases phage progeny yield by ~50% without altering Y protein levels.
    supporting_text: Finally, instead of encoding a second translational product of Y as an antiholin, as shown for lambda S107, the P2 lysis cassette encodes another predicted membrane protein, LysA, which is shown here to have a Y-specific antiholin character.
