      supporting_text: Finally, instead of encoding a second translational product of Y as an antiholin, as shown for lambda S107, the P2 lysis cassette encodes another predicted membrane protein, LysA, which is shown here to have a Y-specific antiholin character.
- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IMP
  original_reference_id: PMID:23335412
  qualifier: involved_in
  review:
    summary: LysA acts as a Y-specific antiholin that delays holin-triggered cytolysis by ~10 minutes, increasing progeny phage burst size by ~50%.
    action: NEW
    reason: Genetic and physiological experiments in PMID:8051010 and PMID:23335412 show that LysA controls the timing of P2 holin-mediated cytolytic viral release.
    supported_by:
    - reference_id: PMID:8051010
      supporting_text: The gene products of lysA and lysB, although nonessential, appear to play a role in the correct timing of lysis, since a lysA amber mutant caused slightly accelerated lysis and a lysB amber mutant slightly delayed lysis of nonpermissive strains.
    - reference_id: PMID:23335412
      supporting_text: Induction of λ- Y lysogens transformed with the lysA construct resulted in lysis ~10 min later than the same lysogen transformed with the isogenic vector ( Fig. 4B ), with an ~50% increase in the yield of PFU (1.4 × 10 9 PFU/ml versus 9.3 × 10 8 PFU/ml) in the final lysate, without affecting the accumulation of Y (data not shown).
