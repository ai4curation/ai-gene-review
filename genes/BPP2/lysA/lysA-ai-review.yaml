suggested_questions:
- question: Which transmembrane helices of the four-pass membrane protein LysA directly bind the three-pass holin gpY to prevent premature triggering?
suggested_experiments:
- description: Perform co-immunoprecipitation and bacterial two-hybrid interaction mapping between transmembrane domain variants of LysA and gpY in Escherichia coli inner membranes.
