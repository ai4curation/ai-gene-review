    record_section: ["CC:FUNCTION"]
    supporting_text: "FUNCTION: Involved in lysis inhibition. Interacts with and inhibits the holin thereby delaying the host cell lysis timing."
core_functions:
- description: Inner-membrane antiholin that specifically inhibits premature oligomerization and pore formation by the class I holin gpY, delaying host cell cytolysis to maximize viral progeny production.
