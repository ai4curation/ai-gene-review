id: P51769
gene_symbol: lysA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Antiholin protein LysA is a 141-amino-acid four-transmembrane inner-membrane protein encoded in the lysis cassette of Escherichia phage P2 that functions as a Y-specific antiholin, delaying premature pore formation by the class I holin gpY to optimize lysis timing and maximize progeny virion yield.
existing_annotations:
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0373
  review:
    summary: LysA is a multi-pass integral membrane protein that localizes to the Escherichia coli inner (plasma) membrane where it inhibits holin gpY.
    action: ACCEPT
    reason: Sequence topology and functional inhibition of the inner-membrane holin gpY in PMID:23335412 support localization to the host cell plasma membrane.
    supported_by:
    - reference_id: PMID:23335412
      supporting_text: Finally, instead of encoding a second translational product of Y as an antiholin, as shown for lambda S107, the P2 lysis cassette encodes another predicted membrane protein, LysA, which is shown here to have a Y-specific antiholin character.
