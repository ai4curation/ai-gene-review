id: P36935
gene_symbol: P36935
aliases:
- YSV_BPP2
- orf-30
status: COMPLETE
description: Uncharacterized 30.4 kDa protein (261 amino acids) encoded by open reading frame orf-30 in the intergenic region
  between the S and V tail genes of Escherichia phage P2. Insertion mutagenesis demonstrates that orf-30 is non-essential
  for phage P2 lytic growth in Escherichia coli under standard laboratory conditions, and its molecular function and biological
  role remain unknown.
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
references:
- id: PMID:8178426
  title: Molecular cloning and characterization of bacteriophage P2 genes R and S involved in tail completion.
  findings:
  - statement: Open reading frame orf-30 is located between the tail genes S and V and is non-essential for bacteriophage
      P2 growth in Escherichia coli as shown by insertion mutagenesis.
    supporting_text: The sequences of two previously known tail genes, R and S, of the temperate bacteriophage P2 and the
      sequence of an additional open reading frame (orf-30) located between S and V, were determined.
