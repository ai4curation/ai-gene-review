existing_annotations: []
core_functions: []
suggested_questions:
- question: Is the orf-30 (P36935) protein expressed during the late lytic cycle of phage P2, and does it provide a fitness
    advantage or accessory function under non-standard host or environmental conditions?
suggested_experiments:
- description: Perform ribosome profiling and mass spectrometry of P2-infected Escherichia coli lysates to determine whether
    P36935 (orf-30) is translated during infection, and screen an orf-30 deletion mutant across diverse clinical and environmental
    E. coli strains to test for host-range or competitive fitness phenotypes.
  hypothesis: P36935 is an accessory factor expressed from the late tail gene cluster that enhances phage propagation or host
    adaptation in specific bacterial hosts.
