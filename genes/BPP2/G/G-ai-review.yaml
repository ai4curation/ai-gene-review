id: P26699
gene_symbol: G
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: >-
  Non-structural tail fiber assembly chaperone protein gpG (175 aa, 20.0 kDa)
  encoded immediately downstream of the tail fiber gene H in the bacteriophage
  P2 V-W-J-I-H-G late tail operon. gpG is homologous to the bacteriophage Mu
  tail fiber assembly proteins gpU and gpU' and to bacteriophage lambda Tfa and
  T4 gp38, acting catalytically in the host cell cytoplasm to promote folding
  and oligomerization of the gpH tail fiber and its attachment to the virion
  baseplate.
references:
  - id: GO_REF:0000043
    title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
    findings: []
  - id: PMID:1531648
    title: 'DNA sequences of the tail fiber genes of bacteriophage P2: evidence for horizontal transfer of tail fiber genes among unrelated bacteriophages.'
    findings:
      - statement: Gene G encodes an essential tail fiber assembly protein that is highly homologous across its entire length to phage Mu gpU and gpU' and shares conserved regions with tail fiber assembly chaperones of phages TuIa, TuIb, T4, and lambda.
        supporting_text: "Gene G of P2 probably codes for a protein required for assembly of the tail fibers of the virion. The entire G gene product is very similar to the products of genes U and U' of phage Mu; a region of these proteins is also found in the tail fiber assembly proteins of phages TuIa, TuIb, T4, and lambda."
      - statement: The H-G tail fiber cassette shows evidence of horizontal evolution across enteric bacteriophages sharing host range specificity.
        supporting_text: "The similarities in the tail fiber genes of phages of different families provide evidence that illegitimate recombination occurs at previously unappreciated levels and that phages are taking advantage of the gene pool available to them to alter their host ranges under selective pressures."
  - id: file:BPP2/G/G-uniprot.txt
    title: UniProtKB record for P26699 (TFA_BPP2)
    findings:
      - statement: gpG acts catalytically in the assembly of tail fiber oligomers.
        record_section: ["CC:FUNCTION"]
        supporting_text: "FUNCTION: Acts catalytically in the formation of tail protein dimers."
