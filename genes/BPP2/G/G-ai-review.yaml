proposed_new_terms: []
suggested_questions:
  - question: >-
      Does P2 gpG transiently bind the C-terminal tip of gpH and dissociate
      prior to virion release, or does a fraction of gpG remain associated with
      mature tail fibers as observed for lambda Tfa?
suggested_experiments:
  - description: >-
      Co-express recombinant P2 gpH with and without gpG in Escherichia coli
      and assay soluble trimer formation, LPS binding, and gpG retention on
      purified P2 virions by quantitative mass spectrometry.
    hypothesis: >-
      Co-expression of gpG is strictly required to prevent inclusion-body
      aggregation of the C-terminal LPS-binding domain of gpH and yield
      functional trimeric tail fibers.
status: COMPLETE
