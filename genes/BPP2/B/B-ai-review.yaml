  review:
    summary: gpB acts in the Escherichia coli host cell cytoplasm where it interacts with host DnaB during phage DNA replication.
    action: NEW
    reason: Phage P2 DNA replication and interaction with the host DnaB helicase take place in the bacterial host cytoplasm.
    supported_by:
