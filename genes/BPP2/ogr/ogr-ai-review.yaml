      supporting_text: P2 growth is blocked by a host mutation, rpoA109, in the alpha subunit of DNA-dependent RNA polymerase. The ogr52 mutation, which allows P2 to grow in an rpoA109 strain, was shown to be a single nucleotide change, in the codon for residue 42, that changes tyrosine to cysteine.
references:
- id: PMID:3735430
  title: Coliphage P2 late control gene ogr. DNA sequence and product identification.
  findings:
  - statement: Cloned and sequenced the bacteriophage P2 late control gene ogr and identified its 8.3 kDa basic protein product.
    supporting_text: The bacteriophage P2 late control gene ogr was cloned and precisely localized by deletion analysis in vitro. The DNA sequence of the ogr gene containing the ogr1 mutation was determined. The sequence translates into a basic protein of a molecular weight of 8300.
- id: PMID:3458177
  title: 'Regulation of bacteriophage P2 late-gene expression: the ogr gene.'
  findings:
  - statement: Sequenced wild-type ogr (72 amino acids) and showed that the ogr52 (Y42C) mutation suppresses the Escherichia coli rpoA109 mutation in the alpha subunit of RNA polymerase to restore P2 late-gene transcription.
    supporting_text: The ogr gene product of bacteriophage P2 is a positive regulatory factor required for P2 late-gene transcription. We have determined the nucleotide sequence of the ogr gene, which encodes a basic polypeptide of 72 amino acids. P2 growth is blocked by a host mutation, rpoA109, in the alpha subunit of DNA-dependent RNA polymerase. The ogr52 mutation, which allows P2 to grow in an rpoA109 strain, was shown to be a single nucleotide change, in the codon for residue 42, that changes tyrosine to cysteine.
- id: file:BPP2/ogr/ogr-uniprot.txt
  title: UniProtKB record for P08762 (OGR_BPP2)
  findings:
  - statement: Documents coordination of one zinc ion per monomer by Cys-4, Cys-7, Cys-27, and Cys-30 and the role of Ogr in positively regulating late gene transcription of P2 and satellite phage P4.
    supporting_text: "FUNCTION: This protein may act as an activator of P2 late transcription through an interaction with the alpha-subunit of the host RNA polymerase."
