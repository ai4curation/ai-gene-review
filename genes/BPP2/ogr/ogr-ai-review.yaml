  qualifier: located_in
  review:
    summary: Ogr acts in the Escherichia coli host cell cytoplasm where it engages the bacterial RNA polymerase holoenzyme at phage late promoters.
    action: NEW
    reason: Interaction between Ogr and the host Escherichia coli RNA polymerase alpha subunit (RpoA) occurs in the bacterial cytoplasm.
    supported_by:
