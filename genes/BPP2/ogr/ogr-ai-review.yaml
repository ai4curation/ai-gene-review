  qualifier: involved_in
  review:
    summary: Ogr positively regulates transcription of the bacteriophage P2 late genes by recruiting or activating host RNA polymerase at the late promoters.
    action: NEW
    reason: Direct genetic evidence shows that Ogr is required to activate transcription of all P2 late operons.
    supported_by:
    - reference_id: PMID:3458177
      supporting_text: The ogr gene product of bacteriophage P2 is a positive regulatory factor required for P2 late-gene transcription.
    - reference_id: PMID:3735430
      supporting_text: The bacteriophage P2 late control gene ogr was cloned and precisely localized by deletion analysis in vitro.
