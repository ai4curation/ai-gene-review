id: P08762
gene_symbol: ogr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Regulatory protein Ogr is a 72-amino-acid C4-type zinc-finger transcriptional activator of Escherichia phage P2 that is required for transcription of the phage late morphogenetic and lysis operons by binding upstream of the late promoters and interacting with the alpha subunit (RpoA) of host DNA-dependent RNA polymerase.
existing_annotations:
- term:
    id: GO:0001216
    label: DNA-binding transcription activator activity
  evidence_type: IMP
  original_reference_id: PMID:3458177
  qualifier: enables
  review:
    summary: Ogr is a positive regulatory transcription factor required for activation of bacteriophage P2 late-gene transcription through interaction with the alpha subunit of host RNA polymerase.
    action: NEW
    reason: Genetic and molecular characterization demonstrates that Ogr is an essential transcriptional activator of P2 late promoters that suppresses the host rpoA109 RNA polymerase alpha-subunit mutation via allele-specific compensation (ogr52, Y42C).
    supported_by:
    - reference_id: PMID:3458177
      supporting_text: The ogr gene product of bacteriophage P2 is a positive regulatory factor required for P2 late-gene transcription. We have determined the nucleotide sequence of the ogr gene, which encodes a basic polypeptide of 72 amino acids. P2 growth is blocked by a host mutation, rpoA109, in the alpha subunit of DNA-dependent RNA polymerase. The ogr52 mutation, which allows P2 to grow in an rpoA109 strain, was shown to be a single nucleotide change, in the codon for residue 42, that changes tyrosine to cysteine.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: NAS
  original_reference_id: PMID:3458177
  qualifier: enables
  review:
    summary: Ogr coordinates a single zinc ion via four conserved cysteine residues (Cys-4, Cys-7, Cys-27, Cys-30) in its N-terminal C4-type zinc-finger domain.
    action: NEW
    reason: Ogr is the founding member of the prokaryotic C4-type zinc-finger family (IPR007157) and requires Zn(2+) coordination by four conserved cysteines for structural folding and transcriptional activation.
    supported_by:
    - reference_id: file:BPP2/ogr/ogr-uniprot.txt
      supporting_text: InterPro; IPR007684; Znf_Ogr/Delta.
