id: Q06423
gene_symbol: ORF81
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Uncharacterized 11.3 kDa protein ORF81 (orf-81, DUF5405 family) is a 100-amino-acid early protein encoded in
  the 5' region upstream of the replication endonuclease gene A in Escherichia phage P2. Its polypeptide product has been
  experimentally identified from cloned early-operon constructs, but its molecular function and biological process remain
  unknown.
existing_annotations: []
references:
- id: PMID:8510152
  title: Studies of bacteriophage P2 DNA replication. The DNA sequence of the cis-acting gene A and ori region and construction
    of a P2 mini-chromosome.
  findings:
  - statement: Discovered, cloned, and identified the polypeptide product of orf-81 in the P2 early operon upstream of gene
      A.
    supporting_text: Five previously unknown open reading frames (orf-80, orf-81, orf-82, orf-83 and orf-91) were discovered.
      They have been cloned and their respective products were identified. The products of orf-80, orf-82 and gene A were
      found to be lethal to the host when overexpressed.
- id: file:BPP2/ORF81/ORF81-uniprot.txt
  title: UniProtKB record for Q06423 (Y81_BPP2)
  findings:
  - statement: Documents the 100-amino-acid DUF5405-domain protein encoded by ORF81 in the 5' region of gene A.
    supporting_text: Uncharacterized 11.3 kDa protein in GpA 5'region
core_functions: []
suggested_questions:
- question: Does ORF81 modulate the toxicity of the adjacent early operon protein ORF80 or assist in early phage DNA replication
    across clinical Escherichia coli isolates?
suggested_experiments:
- description: Test whether co-expression of ORF81 suppresses the host-lethal phenotype of ORF80 or ORF82 in Escherichia coli
    and screen an orf-81 deletion mutant against a panel of bacterial antiphage defense systems.
