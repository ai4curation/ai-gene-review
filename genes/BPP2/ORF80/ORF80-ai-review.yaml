id: Q06422
gene_symbol: ORF80
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Uncharacterized 8.3 kDa protein ORF80 (orf-80, DUF2732 family) is a 74-amino-acid early protein encoded in the
  5' region upstream of the replication endonuclease gene A in Escherichia phage P2. Although its specific biochemical activity
  is unknown, expression of the cloned orf-80 gene product is lethal to the Escherichia coli host cell upon overexpression.
existing_annotations: []
references:
- id: PMID:8510152
  title: Studies of bacteriophage P2 DNA replication. The DNA sequence of the cis-acting gene A and ori region and construction
    of a P2 mini-chromosome.
  findings:
  - statement: Discovered, cloned, and identified the protein product of orf-80 upstream of gene A, and demonstrated that
      overexpression of orf-80 is lethal to the Escherichia coli host.
    supporting_text: Five previously unknown open reading frames (orf-80, orf-81, orf-82, orf-83 and orf-91) were discovered.
      They have been cloned and their respective products were identified. The products of orf-80, orf-82 and gene A were
      found to be lethal to the host when overexpressed.
- id: file:BPP2/ORF80/ORF80-uniprot.txt
