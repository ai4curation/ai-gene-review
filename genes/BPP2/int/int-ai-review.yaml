  label: Bacteriophage P2
description: Integrase Int is a 337-amino-acid tyrosine-based site-specific recombinase of Escherichia phage P2 that catalyzes integrative recombination between the phage attP site and the bacterial host chromosome attB site to establish lysogeny, as well as excisive recombination between attL and attR in concert with the phage excisionase Cox.
