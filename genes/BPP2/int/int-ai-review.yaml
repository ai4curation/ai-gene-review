suggested_questions:
- question: How does the N-terminal arm-binding domain of P2 Int allosterically regulate the C-terminal catalytic domain during integrative versus excisive synaptic complex assembly?
suggested_experiments:
- description: Solve the cryo-EM structures of the P2 integrative (attP x attB) and excisive (attL x attR with Cox) intasomes to define the architectural switch governing recombination directionality.
