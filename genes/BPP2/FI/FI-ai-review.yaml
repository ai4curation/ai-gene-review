id: P22501
gene_symbol: FI
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Contractile tail sheath protein gpFI (396 aa, 43.1 kDa) encoded as the first cistron of the bacteriophage P2
  FI-FII-E-T-U-D late tail operon. gpFI polymerizes into an extended metastable helical sheath around the inner tail tube
  (gpFII) and baseplate during virion tail assembly; upon irreversible host cell attachment, gpFI undergoes a large-scale
  conformational contraction that drives the rigid inner tail tube and central spike (gpV) across the host bacterial cell
  envelope for viral genome ejection.
