- id: PMID:1825255
  title: Nucleotide sequence of the genes encoding the major tail sheath and tail tube proteins of bacteriophage P2.
  findings:
  - statement: Proteins FI and FII are the major structural components of the bacteriophage P2 contractile tail, forming the
      tail sheath and tail tube respectively.
    supporting_text: The major structural components of the contractile tail of bacteriophage P2 are proteins FI and FII,
      which are believed to be the tail sheath and tube proteins, respectively.
  - statement: The FI and FII coding regions were confirmed by mapping the Fam4 amber mutation and by N-terminal amino acid
      sequencing of both purified virion proteins.
    supporting_text: The coding regions were confirmed by location of the Fam4 mutation and by N-terminal amino acid sequencing
      of both proteins.
- id: PMID:3458177
  title: 'Regulation of bacteriophage P2 late-gene expression: the ogr gene.'
  findings:
  - statement: Late transcription of the P2 tail operons requires the positive regulatory factor encoded by the ogr gene.
    supporting_text: The ogr gene product of bacteriophage P2 is a positive regulatory factor required for P2 late-gene transcription.
- id: PMID:3981640
  title: Bacteriophage P2 late promoters. II. Comparison of the four late promoter sequences.
  findings:
  - statement: The start of the first gene (FI) in the FETUD late tail transcription unit was mapped downstream of the FETUD
      late promoter.
    supporting_text: Location of the first gene in the FETUD transcription unit has been inferred from the DNA sequence.
- id: file:BPP2/FI/FI-uniprot.txt
  title: UniProtKB record for P22501 (TSP_BPP2)
  findings:
  - statement: gpFI polymerizes as an extended helical sheath around the baseplate-tail tube complex and contracts during
      genome ejection to drive the inner tail tube through the host cell envelope.
    supporting_text: 'FUNCTION: Polymerizes as an extended helical structure around the baseplate-tail tube complex. During
      ejection, the sheath shifts to a contracted form, thereby making the inner tail tube protrude through the host cell
      envelope. {ECO:0000250|UniProtKB:P79678}.'
