suggested_questions:
- question: How are the N- and C-terminal β-strand handshake arms of P2 gpFI interlinked across adjacent sheath rings in the
    extended and contracted states?
suggested_experiments:
- description: Determine high-resolution cryo-EM reconstructions of the extended and contracted bacteriophage P2 tail sheath
    to map inter-subunit β-sheet augmentation and gpFI-gpFII contacts.
  hypothesis: Contraction of the gpFI sheath proceeds via rigid-body rotation and sliding of gpFI subunits while preserving
    the inter-subunit β-sheet mesh linking adjacent hexameric rings.
