proposed_new_terms: []
suggested_questions:
- question: Does P2 gpT form an inner cytoplasmic membrane pore upon ejection into the Escherichia coli envelope after gpV
    pierces the outer membrane?
suggested_experiments:
- description: Construct internal in-frame deletions and duplications within the central coiled-coil region of P2 gene T and
    measure resulting tail lengths by transmission electron microscopy, and test purified gpT transmembrane peptides for liposome
    pore formation.
  hypothesis: P2 tail length scales linearly with gpT polypeptide length at ~0.15 nm per amino acid residue, and ejected gpT
    inserts into the host inner membrane to conduct phage DNA into the cytoplasm.
