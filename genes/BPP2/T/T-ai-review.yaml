id: O64314
gene_symbol: T
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Tail length tape measure protein gpT (815 aa, 86.4 kDa) encoded immediately downstream of the E/E' frameshift
  chaperone genes in the bacteriophage P2 FI-FII-E-T-U-D late tail operon. Stabilized in the host cytoplasm by gpE and gpE+E',
  gpT extends as an alpha-helical coiled-coil filament from the baseplate hub (gpD) through the central lumen of the polymerizing
  inner tail tube (gpFII) to determine the exact length of the contractile tail shaft and is ejected through the tail tube
  during host infection to facilitate genome delivery across the bacterial cell envelope.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:12426340
  title: Programmed translational frameshift in the bacteriophage P2 FETUD tail gene operon.
  findings:
  - statement: Complete nucleotide sequencing of the FII-E-T-U-D operon and mapping of amber mutations Tam5, Tam64, and Tam215
      defined the 815-codon coding region of gene T.
    supporting_text: Sequence analysis of the remainder of this operon and the locations of amber mutations Eam30, Tam5, Tam64,
      Tam215, Uam25, Uam77, Uam92, and Dam6 and missense mutation Ets55 identified the coding regions for genes E, T, U, and
      D, completing the sequence determination of the P2 genome.
  - statement: gpT is the bacteriophage P2 tail tape measure protein, as it is the only P2 tail protein large enough to span
      the length of the tail shaft and is preceded by the E/E' frameshift chaperone pair.
    supporting_text: The most likely role for gpT is that of tail length determination. It is the only P2 tail protein that
      is large enough to span the length of the P2 tail shaft.
