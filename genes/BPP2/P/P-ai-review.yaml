  label: Bacteriophage P2
description: Terminase ATPase subunit gpP is a 590-amino-acid motor protein of Escherichia phage P2 that associates with the endonuclease subunit gpM to form the viral terminase complex, docking at the gpQ portal vertex of empty procapsids and hydrolyzing ATP to power translocation of linearized P2 or P4 double-stranded DNA genomes into the capsid.
