proposed_new_terms: []
suggested_questions:
- question: What is the assembly order of gpR and gpS at the top of the P2 tail tube and sheath, and which protein directly
    contacts the head portal/connector complex?
suggested_experiments:
- description: Determine the cryo-EM structure of the P2 neck/head-tail junction and perform in vitro reconstitution of purified
    hexameric gpR and gpS onto isolated P2 tails.
  hypothesis: gpR and gpS form stacked hexameric rings atop the gpFII tail tube and gpFI sheath (analogous to T4 gp3 and gp15)
    to lock the extended sheath and create the head-binding socket.
