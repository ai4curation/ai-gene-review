id: P36933
gene_symbol: R
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Tail completion protein gpR (155 aa, 17.5 kDa) encoded in the bacteriophage P2 late tail gene cluster upstream
  of gene S. gpR shares sequence homology with the bacteriophage T4 tail completion protein gp15 and acts with gpS at the
  final stage of contractile tail morphogenesis to cap the proximal end of the polymerized tail tube/sheath, preventing aberrant
  tail elongation and forming the head-binding interface required for stable head-tail joining.
references:
- id: PMID:8178426
  title: Molecular cloning and characterization of bacteriophage P2 genes R and S involved in tail completion.
  findings:
  - statement: Nucleotide sequencing of P2 tail genes R and S and mapping of amber mutations Ram3, Ram42, and Ram23 defined
      the 155-codon open reading frame of gpR.
    supporting_text: Amber mutations mapping within R and S, Ram3, Ram42, Ram23, Sam75, and Sam89 were sequenced and found
      to be within their corresponding open reading frames.
  - statement: gpR shares homology with the bacteriophage T4 tail completion protein gp15 and functions with gpS as a tail
      completion protein essential for stable head-tail joining.
    supporting_text: However, the R protein contains a small region homologous to one in the phage T4 tail protein gp15, which
      is required for T4 tails to bind heads. We propose that R and S are tail completion proteins that are essential for
      stable head joining.
