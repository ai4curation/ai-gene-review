  title: Functions involved in bacteriophage P2-induced host cell lysis and identification of a new tail gene.
  findings:
  - statement: Mapped all classical P2 lysis-defective mutations (ts60, am12, am76, am218) to gene K and demonstrated that gpK is a lambda R-like endolysin required for host cell lysis.
    supporting_text: All of the existing lysis mutants--ts60, am12, am76, and am218--were located in orf21, which must therefore correspond to gene K. The K gene product has extensive amino acid sequence similarity to the product of gene R of bacteriophage lambda, and its exhibits endolysin function.
