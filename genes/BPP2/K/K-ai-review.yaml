  review:
    summary: gpK is the bacteriophage P2 endolysin that cleaves bacterial peptidoglycan to lyse the Escherichia coli host cell.
    action: ACCEPT
    reason: Genetic and functional complementation in PMID:8051010 demonstrate that gpK is the essential peptidoglycan-degrading endolysin of phage P2.
    supported_by:
    - reference_id: PMID:8051010
      supporting_text: All of the existing lysis mutants--ts60, am12, am76, and am218--were located in orf21, which must therefore correspond to gene K. The K gene product has extensive amino acid sequence similarity to the product of gene R of bacteriophage lambda, and its exhibits endolysin function.
