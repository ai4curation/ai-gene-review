  review:
    summary: False-positive automated mapping from UniProt keyword KW-0081 (Bacteriolytic enzyme); phage P2 endolysin K lyses the infected bacterial host to release progeny virions, not as an immune defense response.
    action: REMOVE
    reason: Bacteriophages do not mount an immune defense response to bacteria; KW-0081 is mapped to GO:0042742 for eukaryotic lysozymes, which is inappropriate for a phage lytic endolysin.
