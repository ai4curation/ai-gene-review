  review:
    summary: Like phage lambda R endolysin, gpK belongs to the lytic transglycosylase family (EC 4.2.2.n1), which cleaves peptidoglycan via a non-hydrolytic intramolecular transglycosylation (lyase) mechanism.
    action: ACCEPT
    reason: Lambda R / P2 K family endolysins catalyze non-hydrolytic cleavage of beta-1,4-glycosidic bonds in peptidoglycan yielding 1,6-anhydro-N-acetylmuramic acid.
    supported_by:
    - reference_id: PMID:8051010
      supporting_text: The K gene product has extensive amino acid sequence similarity to the product of gene R of bacteriophage lambda, and its exhibits endolysin function.
    - reference_id: file:BPP2/K/K-uniprot.txt
      supporting_text: "FUNCTION: Endolysin with transglycosylase activity that degrades host peptidoglycans and participates with the holin and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles. Once the holin has permeabilized the host cell membrane, the endolysin can reach the periplasm and break down the peptidoglycan layer."
