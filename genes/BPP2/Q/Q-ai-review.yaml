- id: PMID:1837355
  title: Nucleotide sequence of the DNA packaging and capsid synthesis genes of bacteriophage P2.
  findings:
  - statement: Sequenced gene Q in the P2 head morphogenesis and packaging cluster and identified gpQ as the portal protein
      candidate.
    supporting_text: 'Polypeptides predicted were: a capsid completion protein, gpL; the major capsid precursor, gpN; the
      presumed capsid scaffolding protein; gpO; the ATPase and proposed endonuclease subunits of terminase, gpP and gpM, respectively;
      and a candidate for the portal protein, gpQ.'
- id: PMID:8178458
  title: 'Bacteriophage P2 and P4 morphogenesis: identification and characterization of the portal protein.'
  findings:
  - statement: Demonstrated by microsequencing, immunoelectron microscopy, and overexpression that P2 gpQ is cleaved after
      residue 25 to form capsid protein h6 and assembles into the portal vertex of P2 and P4 virions.
    supporting_text: Here we present evidence that P2 gene Q codes for the P2 and P4 portal protein. First, microsequencing
      shows that capsid protein h6 is derived from gpQ, most probably by proteolytic cleavage. Second, antibodies against
      gpQ bind to the portal structure in disrupted P2 phage virions, as observed by electron microscopy. Third, gpQ partially
      purified from an overexpressing plasmid assembles into portal-like structures.
- id: PMID:17049269
  title: The gpQ portal protein of bacteriophage P2 forms dodecameric connectors in crystals.
  findings:
  - statement: Showed by negative-stain electron microscopy and 2D crystallography that purified P2 gpQ forms a 135 A diameter
      dodecameric ring with a 25 A central DNA channel.
    supporting_text: The gpQ connector protein from bacteriophage P2 has been overexpressed in Escherichia coli and purified
      by sucrose gradient centrifugation. Negative stain electron microscopy and image analysis revealed a 135 A diameter
      dodecameric ring structure with a central 25 A hole.
