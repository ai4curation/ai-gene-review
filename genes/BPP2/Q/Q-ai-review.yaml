suggested_questions:
- question: Which protease (the viral gpO protease or a host peptidase) catalyzes removal of the N-terminal 25 amino acids
    of gpQ during capsid maturation, and what is the functional role of this N-terminal leader peptide?
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of the in situ P2 portal-neck-tail vertex before and after
    DNA packaging to define how gpQ signals headful/cos cleavage and binds head completion protein gpL.
