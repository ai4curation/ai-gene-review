suggested_questions:
- question: Why is the short C-terminal cytoplasmic domain of P2 holin Y strictly essential for hole formation, whereas the homologous C-terminal tail of phage lambda S105 is dispensable?
suggested_experiments:
- description: Perform site-specific cysteine crosslinking and cryo-electron tomography of P2 Y lesions in Escherichia coli inner membranes to map the inter-helical contacts and role of the C-terminal cytoplasmic tail.
