id: P51773
gene_symbol: Y
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Holin gpY is an essential 93-amino-acid three-transmembrane class I holin of Escherichia phage P2 that accumulates in the bacterial host inner (plasma) membrane and, at a genetically programmed time or upon membrane depolarization, oligomerizes into large membrane pores that allow the cytoplasmic endolysin gpK to access the periplasm and degrade the peptidoglycan cell wall.
