- id: PMID:8051010
  title: Functions involved in bacteriophage P2-induced host cell lysis and identification of a new tail gene.
  findings:
  - statement: Identified P2 gene Y as encoding an essential 93-amino-acid holin whose amber mutant (Yam) blocks host cell lysis.
    supporting_text: Gene Y encodes a polypeptide with striking similarities to the family of holin proteins exemplified by gpS of phage lambda, and the Yam mutant displayed the expected properties of a holin mutant.
- id: PMID:23335412
  title: Functional analysis of a class I holin, P2 Y.
  findings:
  - statement: Demonstrated that P2 Y is a three-transmembrane class I holin requiring its C-terminal cytoplasmic tail for function and specifically inhibited by the antiholin LysA.
    supporting_text: Here, we used physiological and genetic approaches to show that Y exhibits the essential holin functional criteria, namely, allele-specific delayed-onset lethality and sensitivity to the energization of the membrane. ... However, Y holin function requires the integrity of its short cytoplasmic C-terminal domain, unlike for S105.
- id: file:BPP2/Y/Y-uniprot.txt
  title: UniProtKB record for P51773 (HOLIN_BPP2)
  findings:
  - statement: Summarizes the three-transmembrane topology and holin pore-forming activity of P2 gpY in the host inner membrane.
    supporting_text: "FUNCTION: Accumulates harmlessly in the cytoplasmic membrane until it reaches a critical concentration that triggers the formation of micron- scale pores (holes) causing host cell membrane disruption and endolysin escape into the periplasmic space (Probable). Determines the precise timing of host cell lysis (Probable)."
core_functions:
- description: Class I holin that integrates into the bacterial host plasma membrane and oligomerizes at a programmed time to form large inner-membrane pores, allowing cytoplasmic endolysin gpK to reach the periplasm and lyse the host cell.
