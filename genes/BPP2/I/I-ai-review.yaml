id: P26701
gene_symbol: I
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Baseplate wedge protein gpI (176 aa, 19.8 kDa) encoded between J and H in the bacteriophage P2 V-W-J-I-H-G late
  tail operon. Together with gpJ, gpI is an essential structural component of the six peripheral baseplate wedges that surround
  the central gpD-gpV hub and anchor the lateral tail fibers (gpH) in the mature P2 contractile tail.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:1531648
  title: 'DNA sequences of the tail fiber genes of bacteriophage P2: evidence for horizontal transfer of tail fiber genes
    among unrelated bacteriophages.'
  findings:
  - statement: Sequencing of the bacteriophage P2 tail fiber gene region immediately downstream of gene I determined the coding
      sequences of tail genes G and H.
    supporting_text: We have determined the DNA sequence of the bacteriophage P2 tail genes G and H, which code for polypeptides
      of 175 and 669 residues, respectively.
- id: PMID:22297511
  title: Contractile tail machines of bacteriophages.
  full_text_unavailable: true
  findings:
  - statement: Comparative analysis of contractile tail machines identifies P2 gpI as a component of the baseplate wedges.
- id: PMID:24097944
  title: Structural and functional studies of gpX of Escherichia coli phage P2 reveal a widespread role for LysM domains in
    the baseplates of contractile-tailed phages.
  findings:
  - statement: P2 proteins gpI and gpJ comprise the peripheral wedges of the bacteriophage P2 baseplate.
    supporting_text: The P2 proteins gpI and gpJ are believed to comprise the baseplate wedges ( 7 ), and gpJ has been detected
      at the periphery of the P2 baseplate ( 9 ).
- id: PMID:7483254
  title: 'Bacteriophage P2: genes involved in baseplate assembly.'
  findings:
  - statement: Gene I is an essential tail gene in the V-W-J-I-H-G operon whose product is a structural component of the P2
      virion tail.
    supporting_text: The sequences of two previously defined tail genes, V and J, of the temperate bacteriophage P2, and those
      of two new essential tail genes, W and I, were determined.
