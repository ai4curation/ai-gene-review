suggested_questions:
- question: What is the stoichiometry of the gpI-gpJ heterocomplex within each of the six baseplate wedges of bacteriophage
    P2?
suggested_experiments:
- description: Co-express and purify P2 gpI and gpJ in Escherichia coli and determine the stoichiometry and structure of the
    wedge heterocomplex by SEC-MALS and X-ray crystallography or cryo-EM.
  hypothesis: gpI and gpJ form a 1:2 or 1:1 heterotrimeric/heterodimeric wedge protomer analogous to the T4 gp6-gp7 and phage
    Mu gp45-gp46 baseplate wedge complexes.
status: COMPLETE
