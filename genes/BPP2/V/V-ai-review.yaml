proposed_new_terms: []
suggested_questions:
- question: Does the gpV spike dissociate from the gpD baseplate hub in the host periplasm after piercing the outer membrane
    so that DNA and gpT can exit the gpFII tube lumen?
suggested_experiments:
- description: Use cryo-electron tomography of bacteriophage P2 infecting Escherichia coli minicells to visualize the fate
    of the gpV central spike inside the host periplasm after sheath contraction.
  hypothesis: Following outer membrane puncture, gpV detaches from the distal end of the gpD/gpFII tube in the periplasm to
    uncork the tail tube channel for gpT and viral DNA translocation.
