id: P31340
gene_symbol: V
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Central baseplate spike protein gpV (211 aa, 21.8 kDa) encoded as the first cistron of the bacteriophage P2 V-W-J-I-H-G
  late tail operon. gpV forms a homotrimer comprising an N-terminal oligonucleotide/oligosaccharide-binding (OB)-fold domain
  that docks to the central baseplate hub (gpD) and a C-terminal intertwined triple beta-helix needle whose ~10-Angstrom apex
  is rigidified by a centrally coordinated octahedral iron ion (bound by six histidines, His197/His199) alongside calcium
  and chloride ions; during contractile tail sheath contraction, the gpV spike acts as a mechanical drill bit that punctures
  the host outer membrane without unfolding.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:21821878
  title: The host-binding domain of the P2 phage tail spike reveals a trimeric iron-binding structure.
  findings:
  - statement: The C-terminal domain of P2 gpV forms a triangular pyramid spearhead composed of an intertwined beta-sheet,
      a triple beta-helix, and a tip metal-binding site coordinating iron, calcium, and chloride ions.
    supporting_text: The structure is a triangular pyramid and looks like a spearhead composed of an intertwined β-sheet,
      a triple β-helix and a metal-binding region containing iron, calcium and chloride ions.
  - statement: Structural analysis of gpV-C revealed no ligand- or receptor-binding pockets or clefts on the spike surface.
    supporting_text: Unfortunately, we did not find any ligand-binding pockets or clefts in the gpV-C structure.
- id: PMID:22325780
  title: Phage pierces the host cell membrane with the iron-loaded spike.
  full_text_unavailable: true
  findings:
  - statement: P2 gpV forms a compact trimeric spike with a ~10-Angstrom tip stabilized by an iron ion coordinated by six
      histidine residues that translocates across the host lipid bilayer without unfolding during membrane penetration.
    supporting_text: Both proteins form compact spikes with a ∼10Å diameter tip that is stabilized by a centrally positioned
      iron ion bound by six histidine residues. The accumulated data strongly suggest that, in the process of membrane penetration,
      the spikes are translocated through the lipid bilayer without undergoing major unfolding.
- id: PMID:24097944
  title: Structural and functional studies of gpX of Escherichia coli phage P2 reveal a widespread role for LysM domains in
    the baseplates of contractile-tailed phages.
  findings:
  - statement: P2 gpV is the central baseplate tail spike protein and is homologous to the bacteriophage T4 central spike
      protein gp5.
    supporting_text: Among the P2 baseplate constituents, gpD, the baseplate hub protein, and gpV, the tail spike protein,
      are homologues of the T4 proteins performing the same functions, gp27 and gp5, respectively ( 7 ).
- id: PMID:7483254
  title: 'Bacteriophage P2: genes involved in baseplate assembly.'
  findings:
  - statement: The V gene product forms the small central spike at the tip of the bacteriophage P2 tail baseplate.
    supporting_text: The V gene product is the small spike at the tip of the tail, and the J gene product lies at the edge
      of the baseplate.
- id: file:BPP2/V/V-uniprot.txt
  title: UniProtKB record for P31340 (SPIKE_BPP2)
  findings:
  - statement: gpV forms the central spike on the baseplate that plugs the tail tube before DNA ejection and perforates the
      host membrane during ejection.
    record_section: ["CC:FUNCTION"]
    supporting_text: 'FUNCTION: Forms the small spikes on the baseplate that plug the end of the tube before DNA ejection
      and form a channel perforating the host membrane during ejection. Involved in baseplate assembly.'
