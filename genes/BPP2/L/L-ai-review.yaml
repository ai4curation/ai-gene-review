id: P25475
gene_symbol: L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Head completion protein gpL is an essential 169-amino-acid late morphogenetic protein of Escherichia phage P2
  that acts after viral DNA packaging to stabilize and seal the DNA-filled capsid at the portal/neck junction and remains
  incorporated as a structural component of mature virions.
existing_annotations:
- term:
    id: GO:0019069
    label: viral capsid assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR009225
  review:
    summary: gpL is the essential head completion protein required for the final step of capsid assembly after DNA packaging.
    action: ACCEPT
    reason: Genetic and biochemical characterization establish gpL as the capsid completion factor required to produce stable,
      infectious DNA-filled heads.
    supported_by:
    - reference_id: PMID:1837355
      supporting_text: 'Polypeptides predicted were: a capsid completion protein, gpL; the major capsid precursor, gpN; the
        presumed capsid scaffolding protein; gpO; the ATPase and proposed endonuclease subunits of terminase, gpP and gpM,
        respectively; and a candidate for the portal protein, gpQ.'
    - reference_id: PMID:17931675
      supporting_text: Using mass spectrometry, we have also identified the head completion protein gpL in the virions.
- term:
    id: GO:0039660
    label: structural constituent of virion
  evidence_type: IDA
  original_reference_id: PMID:17931675
  qualifier: enables
  review:
    summary: Mass spectrometry of purified P2 and P4 virions demonstrates that head completion protein gpL is incorporated
      into mature phage particles.
    action: NEW
    reason: Direct mass-spectrometric identification of gpL in purified virions confirms its role as a structural virion component.
    supported_by:
    - reference_id: PMID:17931675
      supporting_text: Using mass spectrometry, we have also identified the head completion protein gpL in the virions.
- term:
    id: GO:0044423
    label: virion component
  evidence_type: IDA
  original_reference_id: PMID:17931675
  qualifier: located_in
  review:
    summary: Mass spectrometry directly identifies gpL as a component of mature bacteriophage P2 virions.
    action: NEW
    reason: Proteomic analysis of purified phage particles demonstrates that gpL is retained in the mature virion.
    supported_by:
    - reference_id: PMID:17931675
      supporting_text: Using mass spectrometry, we have also identified the head completion protein gpL in the virions.
