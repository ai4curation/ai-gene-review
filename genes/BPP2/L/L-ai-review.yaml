suggested_questions:
- question: What is the oligomeric stoichiometry of gpL at the portal-tail neck interface of mature P2 virions?
suggested_experiments:
- description: Perform cryo-EM single-particle reconstruction of the P2 neck region to resolve the ring stoichiometry and
    interactions of gpL with the gpQ portal dodecamer and the contractile tail.
