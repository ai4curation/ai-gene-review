- id: file:BPP2/L/L-uniprot.txt
  title: UniProtKB record for P25475 (CPL_BPP2)
  findings:
  - statement: Summarizes the essential role of gpL in head completion during late virion morphogenesis.
    record_section: ["CC:FUNCTION"]
    supporting_text: 'FUNCTION: Carries out the completion of filled heads by rendering the newly packaged DNA in filled heads
      resistant to DNase. The protein is assumed to bind to DNA-filled capsids.'
core_functions:
- description: Structural head-completion protein that binds DNA-filled capsids after packaging to seal the portal/neck vertex
    and complete head morphogenesis, remaining as a structural component of mature virions.
