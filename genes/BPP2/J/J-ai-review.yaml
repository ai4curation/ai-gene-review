id: P51767
gene_symbol: J
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Baseplate wedge protein gpJ (302 aa, 33.0 kDa) encoded between W and I in the bacteriophage P2 V-W-J-I-H-G late
  tail operon. Immunoelectron microscopy localizes gpJ to the outer periphery of the virion baseplate, where it associates
  with gpI to form the six baseplate wedges that surround the central hub and connect the lateral tail fibers (gpH) to the
  contractile sheath (gpFI).
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:22297511
  title: Contractile tail machines of bacteriophages.
  full_text_unavailable: true
  findings:
  - statement: Comparative analysis of contractile tail machines assigns P2 gpJ to the peripheral baseplate wedges.
- id: PMID:24097944
  title: Structural and functional studies of gpX of Escherichia coli phage P2 reveal a widespread role for LysM domains in
    the baseplates of contractile-tailed phages.
  findings:
  - statement: P2 proteins gpI and gpJ comprise the baseplate wedges, with gpJ localized at the periphery of the P2 baseplate.
    supporting_text: The P2 proteins gpI and gpJ are believed to comprise the baseplate wedges ( 7 ), and gpJ has been detected
      at the periphery of the P2 baseplate ( 9 ).
- id: PMID:7483254
  title: 'Bacteriophage P2: genes involved in baseplate assembly.'
  findings:
  - statement: Gene J is an essential tail gene of bacteriophage P2 whose nucleotide sequence was determined in the V-W-J-I
      operon region.
    supporting_text: The sequences of two previously defined tail genes, V and J, of the temperate bacteriophage P2, and those
      of two new essential tail genes, W and I, were determined.
  - statement: Immunoelectron microscopy localizes the J gene product to the outer edge of the bacteriophage P2 baseplate.
    supporting_text: The V gene product is the small spike at the tip of the tail, and the J gene product lies at the edge
      of the baseplate.
