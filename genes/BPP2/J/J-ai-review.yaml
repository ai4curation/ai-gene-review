suggested_questions:
- question: Which domain of gpJ forms the attachment site for the N-terminus of the gpH tail fiber at the outer rim of the
    P2 baseplate?
suggested_experiments:
- description: Perform cross-linking mass spectrometry (XL-MS) and cryo-EM single-particle analysis on purified P2 baseplate-tail
    fiber complexes to map the gpJ-gpH and gpJ-gpI interaction surfaces.
  hypothesis: A C-terminal peripheral domain of gpJ exposed at the rim of the baseplate directly binds the N-terminal attachment
    domain of trimeric gpH.
