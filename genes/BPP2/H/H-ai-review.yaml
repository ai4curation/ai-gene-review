proposed_new_terms: []
suggested_questions:
- question: How does LPS binding at the C-terminal tip of the gpH tail fiber transmit a conformational signal to the baseplate
    wedges (gpI/gpJ) to trigger sheath (gpFI) contraction?
suggested_experiments:
- description: Determine the X-ray or cryo-EM structure of the gpH trimer in complex with Escherichia coli R1/K-12 core oligosaccharide
    and map the N-terminal baseplate-anchoring interface with gpI/gpJ.
  hypothesis: Simultaneous engagement of multiple gpH tail fibers with outer membrane LPS reorients the N-terminal baseplate-binding
    domain of gpH, unlocking the gpI/gpJ baseplate wedge ring to initiate sheath contraction.
status: COMPLETE
