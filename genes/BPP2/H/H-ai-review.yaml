  title: UniProtKB record for P26700 (FIBH_BPP2)
  findings:
  - statement: gpH belongs to the conserved bacteriophage tail fiber protein family.
    supporting_text: 'SIMILARITY: Belongs to the tail fiber family. {ECO:0000305}.'
