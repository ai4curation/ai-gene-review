id: P26700
gene_symbol: H
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Tail fiber protein gpH (669 aa, 71.5 kDa) encoded in the bacteriophage P2 V-W-J-I-H-G late tail operon. gpH folds
  with the assistance of the dedicated tail fiber assembly chaperone gpG into the six lateral tail fibers anchored to the
  virion baseplate; its C-terminal receptor-binding domain, conserved with phages Mu and P1, recognizes the lipopolysaccharide
  (LPS) core of the Escherichia coli outer membrane to mediate initial host adsorption and trigger baseplate conformational
  rearrangement and sheath contraction.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: GO_REF:0000120
  title: Combined automated annotation using Multiple Electronic Annotation Methods
  findings: []
- id: PMID:12426340
  title: Programmed translational frameshift in the bacteriophage P2 FETUD tail gene operon.
  findings:
  - statement: gpH is established as the bacteriophage P2 tail fiber protein.
    supporting_text: Subsequent work, however, established gpH as the P2 tail fiber protein ( 13 ).
- id: PMID:1531648
  title: 'DNA sequences of the tail fiber genes of bacteriophage P2: evidence for horizontal transfer of tail fiber genes
    among unrelated bacteriophages.'
  findings:
  - statement: Gene H encodes the P2 tail fiber protein, whose C-terminal region is homologous to the LPS-binding tail fiber
      proteins of phages Mu and P1 that share the same host range.
    supporting_text: Gene H probably codes for the distal part of the P2 tail fiber, since the deduced sequence of its product
      contains regions similar to tail fiber proteins from phages Mu, P1, lambda, K3, and T2. The similarities of the carboxy-terminal
      portions of the P2, Mu, ann P1 tail fiber proteins may explain the observation that these phages in general have the
      same host range.
  - statement: Assembly of the gpH tail fibers requires the downstream chaperone gene G.
    supporting_text: Gene G of P2 probably codes for a protein required for assembly of the tail fibers of the virion. The
      entire G gene product is very similar to the products of genes U and U' of phage Mu; a region of these proteins is also
      found in the tail fiber assembly proteins of phages TuIa, TuIb, T4, and lambda.
