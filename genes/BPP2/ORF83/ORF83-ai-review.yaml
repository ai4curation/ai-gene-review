id: Q06425
gene_symbol: ORF83
aliases:
- YO83_BPP2
- orf-83
- ORF4
status: COMPLETE
description: Uncharacterized 10.2 kDa early protein (91 amino acids) encoded by orf-83 (ORF4) in the 5' region upstream of
  the replication endonuclease gene A in Escherichia phage P2. Shares sequence similarity with the early protein CP83 of bacteriophage
  186 (defining the P2/186 Orf83/CP83 protein family), and its specific molecular function and biological role remain unknown.
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
references:
- id: PMID:8510152
  title: Studies of bacteriophage P2 DNA replication. The DNA sequence of the cis-acting gene A and ori region and construction
    of a P2 mini-chromosome.
  findings:
  - statement: The orf-83 open reading frame upstream of gene A was discovered, cloned, and its protein product was identified.
    supporting_text: Five previously unknown open reading frames (orf-80, orf-81, orf-82, orf-83 and orf-91) were discovered.
      They have been cloned and their respective products were identified.
  - statement: The predicted amino acid sequence of the orf-83 gene product is similar to an early gene product (CP83) of
      bacteriophage 186.
    supporting_text: The predicted amino acid sequences of the orf-82 and orf-83 gene products were similar to two early gene
      products of phage 186; the orf-91 product resembled the hypothetical protein of orfd of retron Ec67.
- id: file:BPP2/ORF83/ORF83-uniprot.txt
  title: UniProtKB entry Q06425 (YO83_BPP2)
  findings:
  - statement: ORF83 shares sequence similarity with bacteriophage 186 early protein CP83.
    record_section: ["CC:SIMILARITY"]
    supporting_text: 'SIMILARITY: To phage 186 CP83. {ECO:0000305}.'
existing_annotations: []
core_functions: []
suggested_questions:
- question: What is the molecular target and role of the conserved P2/186 Orf83/CP83 protein family during early lytic development
    of P2-like myoviruses?
suggested_experiments:
- description: Construct an in-frame deletion of orf-83 in Escherichia phage P2 to test its requirement for early gene expression
    and DNA replication, and perform affinity purification-mass spectrometry (AP-MS) in P2-infected Escherichia coli to identify
    host or phage binding partners of ORF83.
  hypothesis: ORF83 interacts with host or phage replication/transcription machinery as an accessory factor during the early
    lytic cycle of P2 and 186 phages.
