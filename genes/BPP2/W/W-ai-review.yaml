      also displayed a region of extra density near the baseplate-tail tube junction ( Fig. 1 ). These data imply that gpW
      and gpX are located near each other in the baseplate structure. Like the Xam phage, lysates of cells infected with a
      P2 Wam phage contained filled heads but no tail-related structures (data not shown).
proposed_new_terms: []
suggested_questions:
- question: How do gpW and gpX interact at the top of the P2 baseplate to nucleate the first hexameric ring of the gpFI tail
    sheath?
suggested_experiments:
- description: Perform co-immunoprecipitation and surface plasmon resonance (SPR) binding assays between purified recombinant
    gpW, gpX, gpI/gpJ, and gpFI.
  hypothesis: gpW forms a hexameric ring atop the gpI/gpJ baseplate wedges that directly mimics the fold of the gpFI sheath
    C-terminal domain to initiate sheath polymerization, stabilized by gpX.
status: COMPLETE
