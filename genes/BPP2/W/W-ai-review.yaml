id: P51768
gene_symbol: W
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Baseplate protein gpW (115 aa, 12.8 kDa) encoded between V and J in the bacteriophage P2 V-W-J-I-H-G late tail
  operon. gpW is the structural orthologue of the bacteriophage T4 baseplate wedge subunit gp25 and localizes to the top of
  the P2 baseplate near the baseplate-tail tube/sheath junction alongside gpX, where it is essential early in tail morphogenesis
  to initiate polymerization of the contractile tail sheath (gpFI) on the baseplate.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:22297511
  title: Contractile tail machines of bacteriophages.
  full_text_unavailable: true
  findings:
  - statement: Comparative structural analysis of contractile tail machines identifies P2 gpW as the baseplate subunit orthologous
      to T4 gp25.
- id: PMID:24097944
  title: Structural and functional studies of gpX of Escherichia coli phage P2 reveal a widespread role for LysM domains in
    the baseplates of contractile-tailed phages.
  findings:
  - statement: Electron microscopy of P2 virions incorporating an MBP-gpW fusion protein localizes gpW to the top of the baseplate
      near the baseplate-tail tube junction, and Wam mutant lysates contain filled heads but no tail-related structures.
    supporting_text: Like the P2 particles that incorporated MBP-gpX fusion protein, particles bearing the MBP-gpW fusion
      also displayed a region of extra density near the baseplate-tail tube junction ( Fig. 1 ). These data imply that gpW
      and gpX are located near each other in the baseplate structure. Like the Xam phage, lysates of cells infected with a
      P2 Wam phage contained filled heads but no tail-related structures (data not shown).
- id: PMID:7483254
  title: 'Bacteriophage P2: genes involved in baseplate assembly.'
  findings:
  - statement: Gene W is an essential tail gene located between V and J in the bacteriophage P2 tail gene cluster.
    supporting_text: The sequences of two previously defined tail genes, V and J, of the temperate bacteriophage P2, and those
      of two new essential tail genes, W and I, were determined.
- id: file:BPP2/W/W-uniprot.txt
  title: UniProtKB record for P51768 (BPW_BPP2)
  findings:
  - statement: gpW is a baseplate subunit that plays an essential role in P2 tail assembly.
    record_section: ["CC:FUNCTION"]
    supporting_text: 'FUNCTION: Baseplate protein that is part of the outer wedges of the baseplate. Probably plays a role
      as a connector between the central and peripheral parts of the baseplate. Plays a role in tail assembly.'
