core_functions:
- description: Structural baseplate subunit (orthologous to T4 gp25) located at the baseplate-tail tube junction that is required
    early in P2 tail morphogenesis to link the baseplate wedges (gpI/gpJ) to the polymerizing tail sheath (gpFI).
  molecular_function:
    id: GO:0039660
    label: structural constituent of virion
  directly_involved_in:
