proposed_new_terms: []
suggested_questions:
  - question: >-
      Does the C-terminal E' domain of gpE+E' directly bind the tail tube
      monomer gpFII to nucleate tube polymerization on the gpT-gpE complex?
suggested_experiments:
  - description: >-
      Perform pull-down and isothermal titration calorimetry (ITC) binding
      assays using isolated recombinant E' C-terminal domain (residues 86-142)
      against monomeric gpFII and gpT.
    hypothesis: >-
      The 85-residue N-terminal E domain binds gpT, whereas the 57-residue
      C-terminal E' extension interacts with gpFII to initiate tail tube
      assembly, analogous to the C-terminal T domain of lambda gpGT.
status: COMPLETE
