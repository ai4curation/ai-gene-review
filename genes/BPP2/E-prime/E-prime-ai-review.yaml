core_functions:
  - description: >-
      Programmed -1 ribosomal frameshift tail assembly chaperone (gpE+E') that
      cooperates with gpE in the host cell cytoplasm to coat and stabilize the
      tape measure protein (gpT) and recruit the tail tube protein (gpFII)
      during contractile tail morphogenesis.
