suggested_questions:
- question: Why does the P2 gpM-gpP terminase complex require closed circular monomeric DNA molecules as its preferred cos-cleavage substrate in vitro and in vivo, unlike concatemer-packaging phages such as lambda?
suggested_experiments:
- description: Determine the cryo-EM structure of the P2 gpM-gpP holoterminase bound to circular supercoiled cos DNA to elucidate how DNA topology activates staggered cos cleavage by gpM.
