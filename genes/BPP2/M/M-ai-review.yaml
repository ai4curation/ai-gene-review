  label: Bacteriophage P2
description: Terminase endonuclease subunit gpM is a 247-amino-acid protein of Escherichia phage P2 that forms a hetero-oligomeric viral terminase complex with the ATPase subunit gpP. During DNA packaging, gpM recognizes the phage cos site on monomeric circular double-stranded viral DNA and introduces staggered endonucleolytic nicks to linearize the genome with 19-nucleotide cohesive ends for translocation into the procapsid.
