suggested_questions:
- question: How does the P2 baseplate hub protein gpD coordinate the symmetry transition between the trimeric tail spike (gpV)
    and the hexameric tail tube (gpFII)?
suggested_experiments:
- description: Determine the atomic cryo-EM structure of the intact P2 baseplate in its pre-contraction and post-contraction
    states to resolve the interfaces between gpD, gpV, gpU, gpW, gpX, and gpFII.
  hypothesis: gpD forms a trimer of two-domain subunits creating a pseudo-hexameric top ring that templates hexameric gpFII
    polymerization while binding the N-terminal OB-fold domain of trimeric gpV on its bottom surface.
status: COMPLETE
