id: P10312
gene_symbol: D
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Baseplate hub protein gpD (387 aa, 42.8 kDa) encoded at the distal end of the bacteriophage P2 FII-E-T-U-D late
  tail operon. gpD is the structural homolog of the bacteriophage T4 central baseplate hub protein gp27 (and phage Mu gp47/gp48)
  and forms a trimeric pseudo-hexameric ring at the center of the virion baseplate, serving as the structural adapter connecting
  the trimeric membrane-piercing spike (gpV) to the hexameric inner tail tube (gpFII) during contractile tail morphogenesis.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:12426340
  title: Programmed translational frameshift in the bacteriophage P2 FETUD tail gene operon.
  findings:
  - statement: Complete nucleotide sequence of the FII-E-T-U-D tail operon and mapping of the Dam6 amber mutation identified
      the coding sequence of essential tail protein gpD.
    supporting_text: Sequence analysis of the remainder of this operon and the locations of amber mutations Eam30, Tam5, Tam64,
      Tam215, Uam25, Uam77, Uam92, and Dam6 and missense mutation Ets55 identified the coding regions for genes E, T, U, and
      D, completing the sequence determination of the P2 genome.
  - statement: Gene D overlaps the termination codon of gene U and encodes a 42.8-kDa polypeptide that is truncated to 267
      amino acids in the Dam6 mutant.
    supporting_text: Overlapping the termination codon of gene U is a start codon for an open reading frame of 388 aa, encoding
      a protein with a molecular mass of 42.8 kDa. The D am 6 mutation (C to T at nt 23592) is in this reading frame and would
      generate a protein of 267 aa (29.4 kDa), consistent with the reported reduction in size ( 29 ).
- id: PMID:22297511
  title: Contractile tail machines of bacteriophages.
  full_text_unavailable: true
  findings:
  - statement: Comparative structural analysis of contractile phage tail machines assigns P2 gpD as the central baseplate
      hub protein.
- id: PMID:24097944
  title: Structural and functional studies of gpX of Escherichia coli phage P2 reveal a widespread role for LysM domains in
    the baseplates of contractile-tailed phages.
  findings:
  - statement: gpD is the baseplate hub protein of bacteriophage P2 and is homologous to the bacteriophage T4 baseplate hub
      protein gp27.
    supporting_text: Among the P2 baseplate constituents, gpD, the baseplate hub protein, and gpV, the tail spike protein,
      are homologues of the T4 proteins performing the same functions, gp27 and gp5, respectively ( 7 ).
