suggested_questions:
- question: How do satellite phage P4 derepression proteins (such as Epsilon) interact with P2 repressor C to strip it from the Pe operator without proteolytic cleavage?
suggested_experiments:
- description: Determine the high-resolution structure of the P2 repressor C dimer bound to operator O1/O2 DNA and in complex with the phage P4 antirepressor Epsilon.
