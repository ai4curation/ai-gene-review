  review:
    summary: Repressor C specifically binds two operator sites in the P2 early promoter region, warranting refinement to transcription cis-regulatory region binding.
    action: MODIFY
    reason: Broad domain/keyword mapping; genetic analysis of virulent operator mutants demonstrates that repressor C specifically binds two operator sites regulating the early replication operon, which is more precisely captured by GO:0000976 (transcription cis-regulatory region binding).
    proposed_replacement_terms:
    - id: GO:0000976
      label: transcription cis-regulatory region binding
    supported_by:
    - reference_id: PMID:6330728
      supporting_text: The operator region for the early replication functions was located by sequencing the DNA of three virulent mutants. The sequence indicates that there are two repressor-binding sites.
