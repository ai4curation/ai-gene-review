  label: Bacteriophage P2
description: Immunity repressor C is a 99-amino-acid Cro/C1-type helix-turn-helix DNA-binding transcriptional repressor of Escherichia phage P2 that establishes and maintains prophage lysogeny by binding two operator sites overlapping the early lytic promoter Pe, thereby repressing transcription of the early replication and excision operon.
