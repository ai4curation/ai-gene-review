- id: PMID:2826134
  title: The cox protein of bacteriophage P2 inhibits the formation of the repressor protein and autoregulates the early operon.
  findings:
  - statement: Demonstrated that the early protein Cox inhibits formation of repressor C by regulating the divergent promoters Pc and Pe.
    supporting_text: The results show that the Cox protein negatively autoregulates the early operon and inhibits the formation of the repressor C.
