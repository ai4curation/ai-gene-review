id: P22502
gene_symbol: FII
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Major tail tube protein gpFII (172 aa, 19.1 kDa) encoded as the second cistron of the bacteriophage P2 FI-FII-E-T-U-D
  late tail operon. gpFII polymerizes into stacked hexameric rings around the tape measure protein (gpT) atop the baseplate
  hub (gpD) to form the rigid inner tube of the contractile tail; during infection, contraction of the outer sheath (gpFI)
  drives the intact gpFII tube across the host cell envelope to form the lumen for viral DNA ejection.
