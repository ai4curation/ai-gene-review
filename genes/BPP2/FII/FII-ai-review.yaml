- id: PMID:1825255
  title: Nucleotide sequence of the genes encoding the major tail sheath and tail tube proteins of bacteriophage P2.
  findings:
  - statement: Proteins FI and FII are the major structural components of the bacteriophage P2 contractile tail, forming the
      tail sheath and tail tube respectively.
    supporting_text: The major structural components of the contractile tail of bacteriophage P2 are proteins FI and FII,
      which are believed to be the tail sheath and tube proteins, respectively.
  - statement: The FI and FII coding regions were confirmed by mapping the Fam4 mutation and by N-terminal amino acid sequencing
      of both purified virion proteins.
    supporting_text: The coding regions were confirmed by location of the Fam4 mutation and by N-terminal amino acid sequencing
      of both proteins.
- id: PMID:3458177
  title: 'Regulation of bacteriophage P2 late-gene expression: the ogr gene.'
  findings:
  - statement: Late transcription of the P2 tail operons requires the positive regulatory factor encoded by the ogr gene.
    supporting_text: The ogr gene product of bacteriophage P2 is a positive regulatory factor required for P2 late-gene transcription.
