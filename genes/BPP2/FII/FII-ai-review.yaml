proposed_new_terms: []
suggested_questions:
- question: What electrostatic and steric features of the inner lumen of the gpFII tail tube facilitate rapid translocation
    of double-stranded P2 DNA during genome ejection?
suggested_experiments:
- description: Determine the cryo-EM structure of the P2 tail tube hexamer and assay point mutants of lumen-lining charged
    residues of gpFII for DNA ejection kinetics in vitro.
  hypothesis: Net negative or neutral surface charge lining the gpFII lumen minimizes electrostatic friction with the translocating
    phage DNA phosphate backbone.
