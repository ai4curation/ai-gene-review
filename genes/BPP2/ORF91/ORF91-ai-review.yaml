existing_annotations: []
core_functions: []
suggested_questions:
- question: Is ORF91 an evolutionary remnant of a retron element insertion at the right end of the P2 genome, or does it perform
    an active accessory or antidefense function during P2 infection or prophage maintenance?
suggested_experiments:
- description: Test an orf-91 deletion mutant of phage P2 for lytic replication, lysogenization efficiency, and susceptibility
    to bacterial defense systems across a panel of Escherichia coli strains.
  hypothesis: ORF91 is dispensable for core lytic replication and lysogeny in standard laboratory strains and represents a
    retron-related accessory gene at the right genomic terminus.
