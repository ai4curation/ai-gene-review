id: Q06426
gene_symbol: ORF91
aliases:
- YO91_BPP2
- orf-91
- ORF5
status: COMPLETE
description: Uncharacterized 12.9 kDa protein (109 amino acids) encoded by orf-91 (ORF5) at the right end of the Escherichia
  phage P2 genome in the 3' region downstream of the replication endonuclease gene A. Shares sequence similarity with the
  hypothetical orfd protein of Escherichia coli retron Ec67, and its specific molecular function and biological role remain
  unknown.
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
references:
- id: PMID:8510152
  title: Studies of bacteriophage P2 DNA replication. The DNA sequence of the cis-acting gene A and ori region and construction
    of a P2 mini-chromosome.
  findings:
  - statement: The orf-91 open reading frame in the 3' region of gene A was discovered, cloned, and its protein product was
      identified.
    supporting_text: Five previously unknown open reading frames (orf-80, orf-81, orf-82, orf-83 and orf-91) were discovered.
      They have been cloned and their respective products were identified.
  - statement: The predicted amino acid sequence of the orf-91 gene product resembles the hypothetical protein encoded by
      orfd of retron Ec67.
    supporting_text: The predicted amino acid sequences of the orf-82 and orf-83 gene products were similar to two early gene
      products of phage 186; the orf-91 product resembled the hypothetical protein of orfd of retron Ec67.
