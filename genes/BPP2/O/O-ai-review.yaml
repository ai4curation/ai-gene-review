- id: PMID:1837355
  title: Nucleotide sequence of the DNA packaging and capsid synthesis genes of bacteriophage P2.
  findings:
  - statement: Sequenced gene O in the P2 morphogenetic cluster and identified gpO as the presumed capsid scaffolding protein.
    supporting_text: 'Polypeptides predicted were: a capsid completion protein, gpL; the major capsid precursor, gpN; the
      presumed capsid scaffolding protein; gpO; the ATPase and proposed endonuclease subunits of terminase, gpP and gpM, respectively;
      and a candidate for the portal protein, gpQ.'
- id: PMID:17931675
  title: Incorporation of scaffolding protein gpO in bacteriophages P2 and P4.
  findings:
  - statement: Demonstrated that gpO is cleaved between residues 141 and 142, that the N-terminal fragment O* (1-141) is retained
      in mature P2 and P4 virions and retains protease activity, and that the C-terminal 90 residues (195-284) are sufficient
      for T=7 procapsid assembly.
    supporting_text: Here, we use protein analysis and mass spectroscopy to show that P2 and P4 virions as well as procapsids
      isolated from viral infections contain O(*) and that cleavage occurs between residues 141 and 142 of gpO. By co-expression
      of gpN with truncated gpO proteins, we show that O(*) binds to gpN and retains the proteolytic activity of gpO and that
      the C-terminal 90 residues of gpO (residues 195-284) are sufficient to promote the formation of P2-size procapsids.
- id: PMID:19064277
  title: 'Functional domains of the bacteriophage P2 scaffolding protein: identification of residues involved in assembly
    and protease activity.'
  findings:
  - statement: Identified the serine protease catalytic triad of gpO (Asp-19, His-48, Ser-107) and showed that the C-terminal
      alpha-helical scaffolding domain (residues 195-284) oligomerizes and requires Cys-284 for faithful procapsid assembly.
    supporting_text: We show that gpO is a classical serine protease, with a catalytic triad comprised of Asp 19, His 48 and
      Ser 107. The C-terminal 90 amino acids of gpO are required and sufficient for capsid assembly. This fragment contains
      a predicted alpha-helical segment between residues 197 and 257 and exists as a multimer in solution, suggesting that
      oligomerization is required for scaffolding activity. Correct assembly requires the C-terminal cysteine residue, which
      is most likely involved in transient gpN interactions.
- id: file:BPP2/O/O-uniprot.txt
  title: UniProtKB record for P25478 (SCP_BPP2)
  findings:
  - statement: Summarizes the dual scaffolding and S49-family serine protease activities of gpO during P2 procapsid assembly
      and maturation.
    record_section: ["CC:FUNCTION", "CC:PTM"]
    supporting_text: 'FUNCTION: Scaffolding protein and protease involved in the icosahedric procapsid assembly. Coassembles
      with the capsid proteins to form the procapsid, in which the scaffolding protein is found within the external shell
      of icosahedrally arranged capsid protein subunits. In a subsequent step the scaffolding protein molecules are cleaved
      by the viral protease activity. ... PTM: Autocleaves itself into an N-terminal fragment containing the protease activity,
      that remains in the capsid following maturation.'
core_functions:
- description: Catalyzes serine-type endopeptidase cleavage (via catalytic triad Asp-19, His-48, Ser-107) of the major capsid
    precursor gpN and autoproteolytic removal of its own C-terminal scaffolding domain during viral procapsid maturation,
    with the N-terminal protease domain O* remaining inside the capsid.
