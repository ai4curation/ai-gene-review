  label: Bacteriophage P2
description: Capsid scaffolding and maturation protease gpO is a bifunctional 284-amino-acid protein of Escherichia phage
  P2 comprising an N-terminal S49-family serine endopeptidase domain (catalytic triad Asp-19, His-48, Ser-107) and a C-terminal
  alpha-helical scaffolding domain (residues 195-284). The C-terminal domain directs T=7 procapsid assembly with the major
  capsid protein gpN, while the N-terminal protease domain cleaves both gpN and gpO itself (between residues 141 and 142)
  during procapsid maturation, leaving the N-terminal protease fragment O* incorporated inside mature virions.
