proposed_new_terms: []
suggested_questions:
- question: Does gpS form the inner tube-capping hexamer (analogous to T4 gp3) while gpR forms the outer head-binding neck
    hexamer (analogous to T4 gp15)?
suggested_experiments:
- description: Perform immunogold electron microscopy and cryo-EM reconstruction of tails purified from Ram and Sam mutant
    lysates to determine which protein terminates gpFII tube polymerization versus gpFI sheath stabilization.
  hypothesis: gpS binds directly to the terminal hexamer of gpFII and the C-terminus of the tape measure protein gpT, whereas
    gpR assembles atop gpS to recruit the DNA-filled head.
