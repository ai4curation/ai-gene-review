id: P36934
gene_symbol: S
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Tail completion protein gpS (150 aa, 17.5 kDa) encoded immediately downstream of gene R in the bacteriophage
  P2 late tail gene cluster. Together with gpR, gpS acts at the final stage of contractile tail morphogenesis to cap the proximal
  end of the polymerized tail tube/sheath, preventing aberrant tail elongation and forming the connector interface required
  for stable head-tail joining.
references:
- id: PMID:8178426
  title: Molecular cloning and characterization of bacteriophage P2 genes R and S involved in tail completion.
  findings:
  - statement: Nucleotide sequencing of P2 tail genes R and S and mapping of amber mutations Sam75 and Sam89 defined the 150-codon
      open reading frame of gpS.
    supporting_text: Amber mutations mapping within R and S, Ram3, Ram42, Ram23, Sam75, and Sam89 were sequenced and found
      to be within their corresponding open reading frames.
  - statement: gpR and gpS function as tail completion proteins at the top of the P2 tail that are essential for stable attachment
      of completed tails to DNA-filled heads.
    supporting_text: However, the R protein contains a small region homologous to one in the phage T4 tail protein gp15, which
      is required for T4 tails to bind heads. We propose that R and S are tail completion proteins that are essential for
      stable head joining.
