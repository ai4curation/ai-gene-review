core_functions:
- description: Early C4-type DksA/TraR-family zinc-finger protein that coordinates
    a zinc ion and causes host cell lethality when overexpressed in Escherichia coli.
  molecular_function:
    id: GO:0008270
    label: zinc ion binding
  supported_by:
