id: Q06424
gene_symbol: ORF82
aliases:
- YO82_BPP2
- orf-82
- ORF3
status: COMPLETE
description: Early 8.2 kDa zinc-finger protein (74 amino acids) encoded by orf-82
  (ORF3) in the 5' region upstream of the replication gene A in Escherichia phage
  P2. Contains a conserved C4-type DksA/TraR zinc-finger domain (residues 35-59) that
  coordinates a zinc ion, shares sequence similarity with an early protein of bacteriophage
  186, and is lethal to the Escherichia coli host cell when overexpressed.
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
