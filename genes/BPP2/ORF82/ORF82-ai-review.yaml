  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods.
  findings: []
- id: PMID:8510152
  title: Studies of bacteriophage P2 DNA replication. The DNA sequence of the cis-acting
    gene A and ori region and construction of a P2 mini-chromosome.
  findings:
  - statement: The orf-82 open reading frame upstream of gene A was cloned and its
      product was shown to be lethal to the host cell when overexpressed.
    supporting_text: Five previously unknown open reading frames (orf-80, orf-81,
      orf-82, orf-83 and orf-91) were discovered. They have been cloned and their
      respective products were identified. The products of orf-80, orf-82 and gene
      A were found to be lethal to the host when overexpressed.
  - statement: The predicted amino acid sequence of the orf-82 gene product is similar
      to an early gene product of bacteriophage 186.
    supporting_text: The predicted amino acid sequences of the orf-82 and orf-83 gene
      products were similar to two early gene products of phage 186; the orf-91 product
      resembled the hypothetical protein of orfd of retron Ec67.
