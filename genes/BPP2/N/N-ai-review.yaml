suggested_questions:
- question: How does the N-terminal 31-residue delta-domain of gpN guide procapsid assembly before its removal by the gpO
    maturation protease?
suggested_experiments:
- description: Compare high-resolution cryo-EM reconstructions of uncleaved P2 procapsids versus mature gpN* capsids to visualize
    the conformational rearrangement triggered by N-terminal cleavage.
