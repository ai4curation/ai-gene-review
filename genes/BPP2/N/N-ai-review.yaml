        with the removal of the first 31 amino acids.
- term:
    id: GO:0019069
    label: viral capsid assembly
  evidence_type: IMP
  original_reference_id: PMID:8874520
  qualifier: involved_in
  review:
    summary: Full-length gpN (including its N-terminal 31 residues prior to cleavage) is essential for assembly and post-assembly
      maturation of viable P2 and P4 capsids.
    action: NEW
    reason: Complementation and mutational analyses show that full-length gpN is required for procapsid assembly and post-assembly
      capsid maturation.
    supported_by:
    - reference_id: PMID:8874520
      supporting_text: During capsid assembly of bacteriophage P2 and its satellite phage P4, gpN undergoes proteolytic cleavage
        with the removal of the first 31 amino acids. The truncated protein gpN* is unable to support formation of viable
        phages in complementation tests.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:1837355
  title: Nucleotide sequence of the DNA packaging and capsid synthesis genes of bacteriophage P2.
  findings:
  - statement: Sequenced the P2 morphogenetic gene cluster and identified gene N as encoding the major capsid precursor gpN.
    supporting_text: 'Polypeptides predicted were: a capsid completion protein, gpL; the major capsid precursor, gpN; the
      presumed capsid scaffolding protein; gpO; the ATPase and proposed endonuclease subunits of terminase, gpP and gpM, respectively;
      and a candidate for the portal protein, gpQ.'
- id: PMID:1840708
  title: Morphopoietic switch mutations of bacteriophage P2.
  findings:
  - statement: Assigned sid-responsiveness (sir) morphopoietic switch mutations to a 38-codon central segment of the 357-codon
      major capsid gene N.
    supporting_text: For eight we could assign their sir mutation to P2 gene N, which encodes the major capsid protein. DNA
      sequencing indicated an open reading frame of 357 codons for gene N and showed these sir mutations to affect only four
      codons within a 38-codon segment in the middle of N.
- id: PMID:8874520
  title: The N-terminal part of bacteriophage P2 capsid protein is essential for postassembly maturation of P2 and P4 capsids.
  findings:
  - statement: Demonstrated that removal of the first 31 amino acids of gpN occurs during capsid maturation and that pre-truncated
      gpN* cannot support viable phage formation.
    supporting_text: During capsid assembly of bacteriophage P2 and its satellite phage P4, gpN undergoes proteolytic cleavage
      with the removal of the first 31 amino acids. The truncated protein gpN* is unable to support formation of viable phages
      in complementation tests.
- id: file:BPP2/N/N-uniprot.txt
  title: UniProtKB record for P25477 (CAPSD_BPP2)
  findings:
  - statement: Summarizes the HK97-like fold and proteolytic processing of major capsid precursor gpN into gpN* (residues
      32-357).
    supporting_text: 'FUNCTION: P2 proheads and capsids consist primarily of N*, a 36.7 kDa protein and two minor components,
      H1 (39 kDa) and H2 (38.6 kDa). ... PTM: N*, H1 and H2 all derive from full-length N protein by N-terminal processing.'
core_functions:
- description: Major capsid structural subunit that co-assembles with the scaffolding protease gpO into T=7 icosahedral procapsids
    and undergoes N-terminal proteolytic maturation (yielding gpN*) to form the mature virion capsid shell.
