  review:
    summary: gpN is the major structural subunit of the bacteriophage P2 icosahedral capsid shell.
    action: NEW
    reason: Genetic and biochemical analyses establish gpN (and its processed form gpN*) as the major structural protein of
      the P2 and P4 virion capsids.
    supported_by:
    - reference_id: PMID:1840708
      supporting_text: For eight we could assign their sir mutation to P2 gene N, which encodes the major capsid protein.
    - reference_id: PMID:8874520
