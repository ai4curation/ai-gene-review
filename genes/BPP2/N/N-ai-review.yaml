id: P25477
gene_symbol: N
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Major capsid protein gpN is a 357-amino-acid precursor polypeptide of Escherichia phage P2 that self-assembles
  with the internal scaffolding protease gpO into T=7 procapsids (or with the satellite phage P4 external scaffold Sid into
  T=4 procapsids) and undergoes proteolytic removal of its N-terminal 31 residues to form the mature icosahedral capsid shell
  subunit gpN*.
