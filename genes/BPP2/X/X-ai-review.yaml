id: P51772
gene_symbol: X
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: Essential baseplate protein gpX (67 aa, 7.3 kDa) encoded as the first cistron of the bacteriophage P2 X-Y-K-lysA-lysB-R-S
  late operon. gpX adopts a LysM-like alpha-beta-beta-alpha-beta fold ( structurally similar to the LysM domain of T4 baseplate
  hub protein gp53) without monomeric peptidoglycan-binding activity and localizes to the top of the P2 baseplate near the
  baseplate-tail tube junction alongside gpW, where it is required early in tail morphogenesis prior to tail tube and sheath
  polymerization.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:22297511
  title: Contractile tail machines of bacteriophages.
  full_text_unavailable: true
  findings:
  - statement: Comparative analysis of contractile phage tail machines assigns P2 gpX to the virion baseplate.
- id: PMID:24097944
  title: Structural and functional studies of gpX of Escherichia coli phage P2 reveal a widespread role for LysM domains in
    the baseplates of contractile-tailed phages.
  findings:
  - statement: Electron microscopy of P2 virions incorporating an MBP-gpX fusion localizes gpX to the top of the baseplate
      near the baseplate-tail tube junction.
    supporting_text: Electron microscopy of P2 phage particles with an incorporated gpX-maltose binding protein fusion revealed
      that gpX is located at the top of the baseplate, near the junction of the baseplate and tail tube.
  - statement: Lysates of cells infected with a P2 Xam mutant contain DNA-filled heads but no tail-like structures, demonstrating
      that gpX is required early in tail assembly prior to tail tube and sheath polymerization.
    supporting_text: An abundance of DNA-filled free heads were observed in these lysates, but no mature viral particles or
      tail-like particles were found (data not shown). These data imply that the activity of gpX in tail assembly takes place
      early in the process, before tail tube and tail sheath polymerization.
  - statement: Purified monomeric gpX adopts a LysM-like fold by NMR spectroscopy but does not bind peptidoglycan in vitro.
    supporting_text: These results indicate that purified monomeric gpX does not bind to peptidoglycan under these assay conditions.
- id: PMID:8051010
  title: Functions involved in bacteriophage P2-induced host cell lysis and identification of a new tail gene.
  findings:
  - statement: Gene X is located upstream of the lysis genes in the P2 late region and provides an essential function for
      synthesis of P2 tails.
    supporting_text: Gene X must encode a tail protein, since lysates from nonpermissive cells infected with the X amber mutant
      were complemented in vitro by similar lysates of cells infected with P2 head mutants but not with tail mutants.
