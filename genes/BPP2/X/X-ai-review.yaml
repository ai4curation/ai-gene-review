proposed_new_terms: []
suggested_questions:
- question: Does P2 gpX form a hexameric wedge-stabilizing ring equivalent to the LysM-like domain of T4 baseplate protein
    gp53?
suggested_experiments:
- description: Determine the cryo-EM structure of the P2 baseplate to resolve the exact binding interfaces of the LysM-like
    gpX domain with gpW, gpD, and the gpI/gpJ wedges.
  hypothesis: Six copies of gpX clamp the inner ring of gpW and the gpI/gpJ wedges to the central gpD hub, analogous to the
    structural role of the LysM domain of T4 gp53.
