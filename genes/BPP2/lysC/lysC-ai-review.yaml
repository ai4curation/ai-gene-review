suggested_questions:
- question: What C-terminal periplasmic residues of mature LysC form the heterodimeric interface with the coiled-coil domain of the inner-membrane spanin subunit LysB?
suggested_experiments:
- description: Perform pull-down and analytical ultracentrifugation assays with purified periplasmic domains of P2 LysB and LysC to define the stoichiometry and binding affinity of the periplasm-spanning complex.
