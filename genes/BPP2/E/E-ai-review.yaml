id: O64313
gene_symbol: E
taxon:
  id: NCBITaxon:2905681
  label: Bacteriophage P2
description: >-
  Non-structural tail assembly chaperone protein gpE (91 aa, 10.3 kDa) encoded
  between FII (tail tube) and T (tape measure) in the bacteriophage P2
  FII-E-T-U-D late tail operon. Together with the programmed -1 ribosomal
  frameshift product gpE+E' (E-prime), gpE acts in the host cell cytoplasm to
  bind and stabilize the extended tape measure protein (gpT) and scaffold the
  polymerization of the tail tube protein (gpFII) during contractile tail
  morphogenesis, analogous to the bacteriophage lambda gpG/gpGT chaperone
  system.
alternative_products:
  - id: O64313-1
    name: E
    sequence_note: Displayed
  - id: O64312-1
    name: E'
    sequence_note: External
references:
  - id: GO_REF:0000043
    title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
    findings: []
  - id: PMID:12426340
    title: Programmed translational frameshift in the bacteriophage P2 FETUD tail gene operon.
    findings:
      - statement: Nonsense mutation Eam30 and temperature-sensitive mutation Ets55 in gene E abolish bacteriophage P2 tail assembly.
        supporting_text: "Gene E was originally defined by the ts mutation 55 ( 26 ); nonsense mutation am30 lies in the same complementation group and was shown by Lengyel et al. ( 24 ) to result in a lack of tails."
      - statement: The tape measure protein gpT is unstable in the absence of gpE, indicating that gpE stabilizes gpT during tail morphogenesis.
        supporting_text: "The role of gpE is unknown; Lengyel et al. ( 24 ) reported that the product of gene T appears to be unstable in the absence of gpE and suggested that gpE plays a role in stabilizing gpT."
      - statement: Ribosomes translating gene E undergo a programmed -1 frameshift about 10% of the time near the 3' end of E to synthesize the 15.4-kDa extended protein gpE+E'.
        supporting_text: "Work described here demonstrates that this reading frame encodes an essential P2 function and that ribosomes translating gene E undergo a programmed frameshift near the 3′ end of the gene about 10% of the time and enter the −1 reading frame. The resulting 15.4-kDa protein shares 85 N-terminal amino acids (aa) with gpE and contains a C-terminal extension encoded by the overlapping reading frame. This extended protein has been designated gpE+E′."
  - id: file:BPP2/E/E-uniprot.txt
    title: UniProtKB record for O64313 (TAP_BPP2)
    findings:
      - statement: Tail assembly proteins E and E' wrap the linear tape measure protein to create a scaffold for tail tube assembly.
        record_section: ["CC:FUNCTION"]
        supporting_text: "FUNCTION: Promotes tail assembly by creating a scaffold for the tail tube proteins. Tail assembly proteins E and E' would wrap the linear tape measure protein to create a tail assembly scaffold. {ECO:0000305}."
existing_annotations:
  - term:
      id: GO:0075523
      label: viral translational frameshifting
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Incorrect keyword-derived process annotation; gpE is the 0-frame translation product of an mRNA that undergoes ribosomal frameshifting, not a protein that performs translational frameshifting.
      action: REMOVE
      reason: >-
        `GO:0075523` (viral translational frameshifting) was propagated from
        `UniProtKB-KW:KW-0688` (Ribosomal frameshifting), which describes the
        mechanism by which host ribosomes shift reading frames on the `E-E'`
        mRNA transcript. The gpE protein itself is a tail assembly chaperone and
        does not catalyze or regulate translational frameshifting.
      supported_by:
        - reference_id: PMID:12426340
          supporting_text: "Work described here demonstrates that this reading frame encodes an essential P2 function and that ribosomes translating gene E undergo a programmed frameshift near the 3′ end of the gene about 10% of the time and enter the −1 reading frame. The resulting 15.4-kDa protein shares 85 N-terminal amino acids (aa) with gpE and contains a C-terminal extension encoded by the overlapping reading frame. This extended protein has been designated gpE+E′."
    qualifier: involved_in
    supporting_entities:
      - UniProtKB-KW:KW-0688
  - term:
      id: GO:0098003
      label: viral tail assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Accurately reflects the essential role of gpE in bacteriophage P2 tail morphogenesis.
      action: ACCEPT
      reason: >-
        Conditional lethal mutations in gene E (`Eam30`, `Ets55`) abolish phage
        P2 tail formation, and both gpE and the frameshift product gpE+E' are
        required for assembly of functional contractile tails.
      supported_by:
        - reference_id: PMID:12426340
          supporting_text: "Gene E was originally defined by the ts mutation 55 ( 26 ); nonsense mutation am30 lies in the same complementation group and was shown by Lengyel et al. ( 24 ) to result in a lack of tails."
    qualifier: involved_in
    supporting_entities:
      - UniProtKB-KW:KW-1245
  - term:
      id: GO:0044183
      label: protein folding chaperone
    evidence_type: IMP
    original_reference_id: PMID:12426340
    qualifier: enables
    review:
      summary: gpE acts as a tail assembly chaperone that stabilizes the tape measure protein gpT and scaffolds tail tube assembly.
      action: NEW
      reason: >-
        In the absence of gpE, the tape measure protein gpT is unstable, and
        gpE/gpE+E' function analogously to the bacteriophage lambda gpG/gpGT
        chaperones by coating the linear tape measure protein to scaffold tail
        tube polymerization without being incorporated into the mature virion.
      supported_by:
        - reference_id: PMID:12426340
          supporting_text: "The role of gpE is unknown; Lengyel et al. ( 24 ) reported that the product of gene T appears to be unstable in the absence of gpE and suggested that gpE plays a role in stabilizing gpT."
        - reference_id: file:BPP2/E/E-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "FUNCTION: Promotes tail assembly by creating a scaffold for the tail tube proteins. Tail assembly proteins E and E' would wrap the linear tape measure protein to create a tail assembly scaffold. {ECO:0000305}."
  - term:
      id: GO:0030430
      label: host cell cytoplasm
    evidence_type: IDA
    original_reference_id: PMID:12426340
    qualifier: located_in
    review:
      summary: gpE is synthesized and acts in the host cell cytoplasm during tail assembly and is absent from mature virions.
      action: NEW
      reason: >-
        gpE is expressed in the infected Escherichia coli cytoplasm where it
        stabilizes gpT during intracellular tail morphogenesis and is displaced
        prior to virion maturation.
      supported_by:
        - reference_id: PMID:12426340
          supporting_text: "The role of gpE is unknown; Lengyel et al. ( 24 ) reported that the product of gene T appears to be unstable in the absence of gpE and suggested that gpE plays a role in stabilizing gpT."
core_functions:
  - description: >-
      Cytosolic tail assembly chaperone that binds and stabilizes the tape
      measure protein (gpT) in cooperation with the frameshift isoform gpE+E',
      forming a scaffold for tail tube (gpFII) polymerization during P2 tail
      morphogenesis.
    molecular_function:
      id: GO:0044183
      label: protein folding chaperone
    directly_involved_in:
      - id: GO:0098003
        label: viral tail assembly
    locations:
      - id: GO:0030430
        label: host cell cytoplasm
    supported_by:
      - reference_id: PMID:12426340
        supporting_text: "The role of gpE is unknown; Lengyel et al. ( 24 ) reported that the product of gene T appears to be unstable in the absence of gpE and suggested that gpE plays a role in stabilizing gpT."
      - reference_id: file:BPP2/E/E-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: "FUNCTION: Promotes tail assembly by creating a scaffold for the tail tube proteins. Tail assembly proteins E and E' would wrap the linear tape measure protein to create a tail assembly scaffold. {ECO:0000305}."
proposed_new_terms: []
suggested_questions:
  - question: >-
      What is the stoichiometric ratio of gpE and gpE+E' bound along the length
      of the tape measure protein gpT prior to gpFII polymerization?
suggested_experiments:
  - description: >-
      Co-express and purify His-tagged gpT with untagged gpE and gpE+E' in
      Escherichia coli, and analyze the resulting complex by size-exclusion
      chromatography coupled to multi-angle light scattering (SEC-MALS) and
      native mass spectrometry.
    hypothesis: >-
      gpE and gpE+E' form a soluble hetero-oligomeric chaperone sheath along
      gpT that prevents gpT aggregation in the absence of gpFII.
status: COMPLETE
