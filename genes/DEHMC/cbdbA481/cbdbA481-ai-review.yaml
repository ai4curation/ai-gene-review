suggested_questions:
- question: Which physiological corrinoid donor methylates CBDB1 MesB, and is AcsCD-to-MesB transfer direct
    or mediated by an unidentified participant?
- question: Can a specific methylcobalamin:homocysteine S-methyltransferase GO term distinguish this reaction
    from folate-dependent methionine synthase activity?
suggested_experiments:
- description: Establish the physiological methyl donor and test whether a defined corrinoid protein supplies
    methyl groups to MesB without an intervening folate reaction.
