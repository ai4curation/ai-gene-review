  label: Dehalococcoides mccartyi CBDB1
description: 'cbdbA481 encodes the compact MesB-type methionine synthase of Dehalococcoides mccartyi CBDB1.
  Purified untagged recombinant protein transfers a methyl group from methylcobalamin to homocysteine,
  forming methionine in anoxic assays. The enzyme lacks the folate-binding half of canonical MetE and
  does not use methyl-tetrahydrofolate triglutamate in the tested reaction. The physiological corrinoid
  donor remains unidentified: transfer from the AcsCD corrinoid iron-sulfur protein is a proposed route,
  not a demonstrated native transfer reaction. The protein does not rescue an E. coli metE deletion under
  the tested complementation conditions.'
