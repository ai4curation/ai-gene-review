references:
- id: PMID:32034217
  title: Identification and characterization of a bacterial core methionine synthase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read, including untagged expression/purification, LC-MS identity/product verification,
      methylcobalamin assay controls, folate-negative assay, failed E. coli complementation and the hypothetical
      AcsCD route. Direct target biochemical evidence is distinct from a native physiological donor or
      flux experiment.
  findings:
  - statement: Purified CBDB1 cbdbA481 protein catalyzes methionine formation from methylcobalamin and
      homocysteine with controlled substrate and enzyme omissions.
    supporting_text: The enzymatic activity of purified core-MetECBDB was tested using methylcob(III)alamin
      as methyl donor and homocysteine as methyl acceptor.
  - statement: The folate-triglutamate control did not produce methionine with core-MetE, whereas canonical
      E. coli MetE did.
    supporting_text: No L-methionine was formed in the presence of core-MetECBDB
  - statement: Direct methyl transfer from AcsCD/CoFeSP to MesB remains a hypothesis.
    supporting_text: We speculate that the methyl group is directly transferred from the CoFeSP to the
      core-MetECBDB
- id: PMID:33534785
  title: Four families of folate-independent methionine synthases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This primary comparative analysis contextualizes the direct CBDB1 enzyme
      study; its CoFeSP donor model remains a hypothesis.
  findings:
  - statement: The characterized Dehalococcoides core synthase defines the MesB family, distinguished
      from aerobic MesD and canonical two-barrel MetE.
    supporting_text: MesB uses methylcobalamin, but not 5-methyl-THF, as a substrate in vitro
