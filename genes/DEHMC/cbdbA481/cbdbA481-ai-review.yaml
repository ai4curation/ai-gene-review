  review:
    summary: Purified CBDB1 MesB directly methylates homocysteine using methylcobalamin in vitro.
    action: NEW
    reason: The exact cbdbA481/CAI82680 protein was produced untagged, purified, identified by peptide
      mass spectrometry and assayed with methylcobalamin and homocysteine. No-enzyme, no-homocysteine
      and E. coli crude-extract controls were negative, while methionine product was confirmed by LC-MS.
      GO0008172 captures the directly demonstrated sulfur methyl transfer without imposing folate, SAM
      or another untested physiological donor. Current narrower donor-specific GO terms do not match this
      reaction. This is an independent experimentally supported activity gap in a zero-row seed; no process
      annotation is added merely for coverage.
