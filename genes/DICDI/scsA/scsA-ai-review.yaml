  review:
    action: KEEP_AS_NON_CORE
    summary: IBA from PANTHER PTN000122012, the LUCA node of the alpha-subunit family. scsA is inside the clade
      and nothing indicates loss, but an ADP-forming succinyl-CoA synthetase has not been demonstrated in Dictyostelium.
    reason: Whether an alpha subunit takes part in ADP-forming activity depends on its beta partner. The node
      placement holds for scsA. It is a member of the eukaryotic clade, outside the branches that the review of
      PTHR11117 marks for pruning, and the Dictyostelium genome encodes an A-type beta subunit of the SUCLA2 lineage
      (scsC, Q55AI5) beside the G-type subunit (scsB, Q869S7). scsA is a single-copy gene, so if scsC forms an
      enzyme it does so with this alpha subunit, as in animals. The row is therefore kept. Non-core is used because no ADP-forming enzyme has been shown in this organism, so the term is left out of the core functions; it does not mean that the activity would be peripheral, since an enzyme formed with scsC would have the same catalytic role as the GDP-forming one. The partially purified protein was phosphorylated
