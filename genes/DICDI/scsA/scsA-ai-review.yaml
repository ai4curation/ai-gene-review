    supporting_text: Dephosphorylation of p36 is induced by relatively high levels of GDP and is coincident with
      the formation of GTP
  - statement: The enzyme is an alpha/beta dimer on gel filtration.
    supporting_text: Gel-filtration analyses indicate that SCS in our system behaves as a non-interacting alpha
      beta dimer
  - statement: Low GDP is proposed to act at an allosteric site.
    supporting_text: We propose that GDP functions as an allosteric regulator of SCS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; the PMC record holds page scans that could not be read. No GO annotation cites
      this paper.
