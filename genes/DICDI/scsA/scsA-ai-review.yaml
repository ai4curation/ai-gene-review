suggested_questions:
- question: Does the full text of PMID:8448193 report the complete succinyl-CoA synthetase reaction with GTP for
    the purified enzyme, or only GTP-dependent phosphorylation of the alpha subunit? The GDP-forming IDA, and
    the seed that scsA provides for the PAINT annotation at PTN000122012, rest on this paper.
- question: Does the membrane IDA from PMID:8448193 record more than recovery of p36 in a crude membrane fraction?
    The protein has a cleaved mitochondrial targeting sequence and belongs to a soluble enzyme, and a crude membrane
    pellet contains mitochondria. Would mitochondrion, supported by the transit peptide and by the mitochondrial proteomes of PMID:33923051 and PMID:35602934 (Percoll-purified mitochondria; the protein was one of the reference proteins of that study), be the better experimental annotation for this gene?
- question: The A-type beta gene scsC (Q55AI5) carries a no-data annotation for molecular function, while scsA
    inherits ADP-forming activity and membership of the ADP-forming complex from the family root. Should the ADP-forming
    terms on the Dictyostelium alpha subunit wait for an assay of a heterodimer containing scsC?
- question: Is the 38 kDa protein phosphorylated in crude mitochondrial fractions and affected within seconds
    by cAMP stimulation (PMID:8384004) the scsA product? The alpha gene is single copy, but the abstract gives
    no sequence.
suggested_experiments:
- hypothesis: scsA forms a GDP-forming enzyme with the G-type beta subunit scsB and an ADP-forming enzyme with
    the A-type beta subunit scsC.
  description: Co-express mature scsA with scsB or with scsC, purify each heterodimer and measure the complete
    reaction in both directions with ATP/ADP and GTP/GDP. In parallel, identify the beta subunit or subunits that
    co-purify with scsA from mitochondria of growing and aggregation-stage cells by mass spectrometry.
- hypothesis: Labelling of the alpha subunit by ATP in crude preparations comes from an scsC-containing enzyme
    and not from conversion of ATP to GTP.
  description: Repeat the phosphorylation assay with ATP and with GTP in mitochondrial extracts of scsB and scsC
    knockout strains, and in extracts depleted of nucleoside-diphosphate kinase activity.
- hypothesis: The alpha subunit is a soluble matrix protein, and its recovery in membrane preparations reflects
    mitochondria in those preparations.
  description: Fractionate gradient-purified mitochondria by carbonate extraction and protease protection, following
    scsA with matrix, inner-membrane and endoplasmic-reticulum markers, and image a tagged scsA in living cells.
- hypothesis: Succinyl-CoA synthetase is needed for respiratory growth and normal development of Dictyostelium.
  description: Disrupt scsA, or deplete it conditionally if the knockout is not viable, and measure growth, oxygen
    consumption and the timing of aggregation and culmination.
