id: P36967
gene_symbol: scsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: Alpha subunit (p36) of mitochondrial succinyl-CoA synthetase (succinate--CoA ligase) of Dictyostelium
  discoideum. The enzyme is an alpha/beta heterodimer that interconverts succinyl-CoA and succinate with a nucleoside
  di- and triphosphate in the tricarboxylic acid cycle. The alpha subunit belongs to the family whose members
  bind CoA and phosphate and carry the catalytic phosphohistidine, while the beta subunit determines which nucleotide
  is used. The protein is made as a 315-residue precursor and the first 16 residues, a mitochondrial targeting
  sequence, are absent from the mature protein. The enzyme purified from growing cells uses GTP. Partially purified
  p36 is phosphorylated by GTP and little or not at all by ATP, the phosphoenzyme is also formed from succinyl-CoA
  and phosphate, and GDP at high concentration dephosphorylates it with formation of GTP. Low concentrations of
  GDP increase the rate of phosphoenzyme formation without acting at the catalytic site, which has been interpreted
  as allosteric regulation. scsA is a single-copy gene. Its mRNA is highest in growing cells and falls after aggregation,
  while the protein level stays constant through development. The genome also encodes two beta subunits, scsB
  of the GDP-specific (SUCLG2) lineage and scsC of the ADP-specific (SUCLA2) lineage, as in animals; which of them
  partners the alpha subunit in the purified enzyme has not been determined, and an ADP-forming enzyme has not
  been demonstrated in this organism.
