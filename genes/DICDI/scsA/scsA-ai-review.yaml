      or descendant of it. Animal alpha subunits (SUCLG1) carry this term. The row is proposed as IC and not IDA
      because the dimer and the GTP formation were observed but which complex they amount to is inferred. The evidence was read from abstracts
      only, and the beta subunit of the dimer was not identified; by lineage it is expected to be scsB (Q869S7).
