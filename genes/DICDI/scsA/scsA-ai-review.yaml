      p36 only in crude preparations, where an ADP-forming enzyme and nucleotide interconversion cannot be told
      apart from the abstracts. No heterodimer containing scsC has been assayed. There is no evidence against
      the activity, so the row is neither removed nor marked as over-annotated. All of this rests on abstracts.
