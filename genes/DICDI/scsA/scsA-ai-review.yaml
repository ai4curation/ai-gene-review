core_functions:
- description: Alpha subunit of the mitochondrial succinyl-CoA synthetase heterodimer. It carries the phosphoenzyme
    intermediate and contributes to the GTP/GDP-dependent interconversion of succinyl-CoA and succinate in the
    tricarboxylic acid cycle. Nucleotide specificity is set by the beta subunit; the enzyme purified from growing
    cells uses GTP, and its beta subunit has not been identified.
