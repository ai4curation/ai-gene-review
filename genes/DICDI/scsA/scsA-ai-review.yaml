knowledge_gaps:
- gap_statement: Which beta subunit partners the alpha subunit in the GTP-utilizing enzyme, and whether an ADP-forming
    enzyme made of scsA and the A-type beta subunit scsC exists in Dictyostelium, is unknown.
  boundary: 'Established: the enzyme purified from growing cells uses GTP and is an alpha/beta dimer; the genome
    encodes one alpha gene, one G-type beta gene (scsB) and one A-type beta gene (scsC). Not established: the
    identity of the beta subunit in the purified enzyme, and any nucleotide-dependent activity of a defined scsA-scsB
    or scsA-scsC heterodimer. ATP labels the alpha subunit only in crude preparations, where an ADP-forming enzyme
    and conversion of ATP to GTP by other enzymes are not distinguished.'
