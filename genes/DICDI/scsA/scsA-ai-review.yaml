- id: PMID:8448193
  title: P36, a Dictyostelium discoideum protein whose phosphorylation is stimulated by GDP, is homologous to the
    alpha-subunit of succinyl-CoA synthetase.
  full_text_unavailable: true
  findings:
  - statement: p36 was purified and identified by peptide sequence as the alpha subunit of succinyl-CoA synthetase.
    supporting_text: Partial peptide sequencing of this band revealed p36 to be homologous to the alpha-subunit
      of succinyl-CoA synthetase
  - statement: In crude preparations both ATP and GTP phosphorylate p36; the partially purified protein is phosphorylated
      by GTP and little or not at all by ATP.
    supporting_text: Partially purified p36 retained its ability to be phosphorylated with GTP while exhibiting
      little or no phosphorylation with ATP
  - statement: The starting material was a crude membrane preparation.
    supporting_text: Previously, we reported the phosphorylation of a 36 kDa protein, p36, in crude membranes
      from the amoeba Dictyostelium discoideum
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; not in PMC. The source of all three experimental and author-statement rows on
      this gene and of the peptide sequence that defines the mature N-terminus in UniProt. The abstract shows
      GTP-dependent phosphorylation of the alpha subunit, a partial reaction, and does not describe a complete
      ligase assay, a membrane-topology experiment or a mitochondrial fractionation.
- id: PMID:7771809
  title: Cloning and expression of the alpha subunit of succinyl-CoA synthetase from Dictyostelium discoideum.
  full_text_unavailable: true
  findings:
  - statement: The first 16 residues encoded by the cDNA are a mitochondrial targeting sequence absent from the
      mature protein.
    supporting_text: Direct amino acid sequence data indicate that the first 16 amino acids encoded by the cDNA
      comprise a mitochondrial targeting sequence
  - statement: The purified enzyme uses GTP.
    supporting_text: We have previously shown that the enzyme purified from growing D. discoideum is a GTP-utilizing
      enzyme
  - statement: The gene is single copy; mRNA falls after aggregation while the protein level is constant.
    supporting_text: In contrast, the level of the protein, as determined by Western blots, remains unchanged
      throughout development
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. The statement that the purified enzyme is GTP-utilizing is a retrospective summary
      of the laboratory's earlier work and not a new assay in this paper. The cDNA of this paper carries a frameshift
      according to UniProt, which explains the 310 residues it predicts against the 315 of the genome sequence.
