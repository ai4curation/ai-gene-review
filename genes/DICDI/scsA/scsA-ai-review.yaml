- id: PMID:35602934
  title: Generation of a mitochondrial protein compendium in Dictyostelium discoideum.
  findings:
  - statement: Mitochondria of axenically growing AX2 cells were purified on Percoll gradients and compared with
      whole-cell lysate by quantitative mass spectrometry.
    supporting_text: From AX2 axenic cultures, we prepared mitochondria isolates—both crude and highly purified—through
      Percoll gradient ultracentrifugation
  - statement: Proteins were classified by their enrichment relative to 47 reference mitochondrial proteins, with
      a cutoff of 0.392. In the supplementary tables P36967 has a relative enrichment ratio of 1.021 and is in
      the compendium. P36967 is itself one of the 47 reference proteins.
    supporting_text: We chose an RER cutoff of 0.392
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read, and supplementary tables S1 to S7 read directly on 2026-11-18 (Europe PMC supplementary
      files of PMC9118663). The cached text does not name the protein; the values for P36967 (DDB_G0289325) are
      in the spreadsheets and cannot be quoted. Table S2 gives enrichment ratios 0.915 (crude/lysate), 1.021 (pure/lysate,
      the relative enrichment ratio) and 1.115 (pure/crude); Table S4 gives probability 1 of the mitochondrial
      cluster; Table S7 lists the protein in the compendium with discovery method Proteomics; Tables S1 and S5
      give TargetP-2.0 prediction mTP. Table S3 lists P36967 among the 47 reference proteins, chosen from existing
      annotation, so the classification is not independent of that annotation; the enrichment is still a measurement.
      Whole-organelle proteomics without sub-mitochondrial resolution.
