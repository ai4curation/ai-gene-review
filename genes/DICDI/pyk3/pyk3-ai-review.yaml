- id: PMID:25143406
  title: Two Dictyostelium tyrosine kinase-like kinases function in parallel, stress-induced
    STAT activation pathways.
  findings:
  - statement: Pyk3 autophosphorylates on tyrosine and directly phosphorylates STATc on
      Y922; its pseudokinase domain inhibits the TKL domain.
