core_functions:
- description: Pyk3 is a tyrosine kinase-like (TKL) kinase whose C-terminal catalytic
    domain autophosphorylates on tyrosine and directly phosphorylates the transcription
    factor STATc on its activating residue Tyr922, acting (redundantly with Pyk2) as a
    JAK-analogous, stress- and cGMP-activated STATc kinase in the hyperosmotic stress
    response. Its N-terminal pseudokinase domain negatively regulates the catalytic domain,
    and stress relocates Pyk3 from the cytosol to the cell cortex.
  molecular_function:
    id: GO:0004713
    label: protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0097696
    label: cell surface receptor signaling pathway via STAT
  - id: GO:0006972
    label: hyperosmotic response
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:25143406
    supporting_text: In the construct GST-Pyk3-KI, where KI was expressed in isolation
      from KII, the TKL directed tyrosine phosphorylation of His-STATc on Y922.
  - reference_id: PMID:25143406
    supporting_text: By analysis of cells expressing myc-tagged Pyk2 and Pyk3 in an in
      vitro kinase assay, we show that both enzymes directly increase tyrosine phosphorylation
      of STATc in response to cGMP.
  - reference_id: PMID:25143406
    supporting_text: Like metazoan JAKs but unlike Pyk2, Pyk3 contains a TKL domain that
      is located C-terminal to a pseudokinase domain.
suggested_questions:
- question: Which tyrosine residue(s) of Pyk3 are autophosphorylated and serve as the docking
    site for the STATc SH2 domain, and how does stress or cGMP (e.g. via GbpC) increase
    Pyk3 autophosphorylation?
- question: Does Pyk3 phosphorylate any serine/threonine substrates in vivo, justifying the
    dual-specificity (EC 2.7.12.1) name, or is it tyrosine-selective?
- question: Is the opposite STATc phenotype reported for dpyk3- in DIF-1 signalling (Lee et
    al. 2008) explained by strain background, and does Pyk3 have targets other than STATc
    during development?
suggested_experiments:
- hypothesis: Pyk3 is tyrosine-selective and lacks physiologically relevant Ser/Thr kinase
    activity.
  description: Phosphoamino-acid analysis and phosphoproteomics of autophosphorylated
    recombinant Pyk3 KI domain and of substrates in wild-type versus pyk3- (and pyk2-/pyk3-)
    stressed cells.
  experiment_type: biochemical
- hypothesis: Specific autophosphorylated tyrosines in Pyk3 recruit the STATc SH2 domain
    and are required for stress-induced STATc activation.
  description: Map Pyk3 autophosphorylation sites by mass spectrometry, then test Tyr-to-Phe
    mutants for STATc SH2 binding in pull-downs and for rescue of STATc activation in
    pyk2-/pyk3- cells.
  experiment_type: mutagenesis
