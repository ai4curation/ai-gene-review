  - statement: Pyk3 moves from the cytosol to the F-actin-rich cortex upon hyperosmotic
      stress.
    supporting_text: Before sorbitol treatment, Pyk3 is also enriched in the cytosol, but,
      after exposure to sorbitol, the amount at the cortex increases, where it often colocalizes
