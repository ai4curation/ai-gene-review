id: Q54I36
gene_symbol: pyk3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: >-
  Pyk3 (DPYK3, PkyA) is a large (1338 aa) tyrosine kinase-like (TKL) group protein
  kinase of Dictyostelium discoideum with a JAK-like tandem architecture: a long,
  partly disordered N-terminal region, a central pseudokinase domain (KII) and a
  C-terminal catalytic TKL domain (KI). Although Dictyostelium lacks orthodox tyrosine
  kinases and JAKs, the Pyk3 KI domain autophosphorylates on tyrosine and directly
  phosphorylates the transcription factor STATc on its activating residue Tyr922; the
  pseudokinase domain acts, like the JAK JH2 domain, as a negative regulator of the
  kinase domain. Autophosphorylated tyrosine(s) on Pyk3 provide a docking site for the
  STATc SH2 domain. Pyk3 activity is increased by hyperosmotic stress and cGMP, and Pyk3
  acts redundantly with the related TKL kinase Pyk2 to activate STATc in the hyperosmotic
  stress response, promoting STATc nuclear accumulation and induction of STATc target
  genes. Pyk3 is cytosolic in resting cells and relocates to the actin-rich cell cortex
  under stress. Loss of Pyk3 alters STATc phosphorylation dynamics and prestalk/prespore
  patterning during multicellular development.
