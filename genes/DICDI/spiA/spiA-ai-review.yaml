id: Q02465
gene_symbol: spiA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: spiA encodes Dd31, a late spore-specific, multi-pass membrane protein
  of the SCAMP (secretory carrier-associated membrane protein) family in the social
  amoeba Dictyostelium discoideum. Its transcript is induced specifically in prespore
  cells and spores during culmination, the terminal stage of fruiting body
  (sorocarp) formation, making spiA a widely used sporulation marker. The Dd31
  protein (~30 kDa on Western blots) is associated with the inner face of the spore
  coat in a detergent-resistant manner. Loss of spiA does not detectably perturb
  development or spore morphology, but mutant spores lose viability far more rapidly
  than wild-type spores as they age, especially when submerged in dilute buffer,
  indicating a role in maintaining long-term spore stability and dormancy. The
  precise molecular activity of Dd31 is not established.
existing_annotations:
- term:
    id: GO:0006887
    label: exocytosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Exocytosis is retained as an inferred SCAMP-family role, secondary to the directly
      demonstrated requirement for spore stability.
    action: KEEP_AS_NON_CORE
    reason: The current PTHR10687 PAINT table places exocytosis at PTN000074638, separate from
      the localization ancestor PTN000074637. The existing OpenScientist report supports SCAMP
      membership and recommends non-core retention of trafficking annotations, while finding no
      direct SpiA trafficking assay. Its observation that NPF-less mammalian SCAMP4/5 still traffic
      prevents treating the absent NPF motifs as proof of functional loss. The spore-coat phenotype
      establishes the best-characterized role but does not exclude inherited trafficking activity.
    supported_by:
    - reference_id: PMID:1592257
      supporting_text: Dd31 is associated with the inner face of spore coat fragments in a detergent-resistant
        manner.
    - reference_id: file:DICDI/spiA/spiA-hypotheses/spia-scamp-trafficking/openscientist.md
      supporting_text: Treat the vesicular-trafficking GO terms as **non-core, homology-only annotations**
        that do not represent the gene product's primary function.
- term:
    id: GO:0032588
    label: trans-Golgi network membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: The trans-Golgi network membrane localization is a credible SCAMP-family inference
      that remains secondary to the experimentally demonstrated spore-wall localization.
    action: KEEP_AS_NON_CORE
    reason: PTHR10687-paint.tsv places this localization at the eukaryotic ancestral node PTN000074637.
      Its experimental descendants include human SCAMP5 (Q8TAC9), itself an NPF-less SCAMP, so
      absence of NPF repeats in SpiA cannot establish loss of the inherited compartment. The existing
      OpenScientist report confirms SCAMP membership and explicitly acknowledges that NPF-less
      SCAMP4/5 still traffic; its recommendation is to retain trafficking terms as non-core. Localization
      at the inner spore coat also does not exclude earlier trafficking compartments. Restore
      the inference as non-core without presenting it as directly imaged in SpiA.
    supported_by:
    - reference_id: PMID:1592257
      supporting_text: Dd31 is associated with the inner face of spore coat fragments in a detergent-resistant
        manner.
    - reference_id: file:DICDI/spiA/spiA-hypotheses/spia-scamp-trafficking/openscientist.md
      supporting_text: the short human SCAMP4/SCAMP5 (229/235 aa) are also NPF-less yet still
        traffic, so NPF absence is suggestive rather than decisive.
