- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: InterPro2GO (IEA) annotation derived from the SCAMP domain (IPR007273).
      Protein transport is a broad process associated with the SCAMP family but has
      not been demonstrated for spiA, whose characterized role is in spore
      maintenance.
    action: KEEP_AS_NON_CORE
    reason: A membrane-trafficking/protein-transport role is consistent with SCAMP
      family membership and cannot be excluded, but it is a domain-based inference
      rather than an experimentally established core function for this gene.
