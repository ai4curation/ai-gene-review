    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Dd31 is a multi-pass membrane protein with four predicted transmembrane
      helices, consistent with SCAMP family topology. Membrane localization is well
      supported.
    action: ACCEPT
    reason: The protein sequence contains four hydrophobic transmembrane segments and
      UniProt annotates it as a multi-pass membrane protein; a generic membrane
      location is correct, though more specific locations (spore coat) are better
      captured elsewhere.
    supported_by:
    - reference_id: PMID:1592257
