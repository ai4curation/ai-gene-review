- id: file:DICDI/spiA/spiA-hypotheses/spia-scamp-trafficking/openscientist.md
  title: OpenScientist function-assignment analysis of the SpiA SCAMP trafficking hypothesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The existing independent report supports SCAMP-family identity and explicitly
      recommends retaining vesicular-trafficking annotations as non-core. It notes that NPF-less
      mammalian SCAMP4/SCAMP5 still traffic, so the absent NPF repeats in SpiA do not establish
      loss of trafficking or of a particular compartment. The PAINT localization assertion includes
      NPF-less human SCAMP5, strengthening that caveat. Report findings and exact excerpts are
      incorporated into the three IBA reviews; no duplicate report was launched.
core_functions:
- description: spiA/Dd31 is a late spore-specific, multi-pass membrane protein of the
    SCAMP family that becomes stably associated with the inner face of the spore coat
    during culmination and is required to maintain long-term spore viability and
    dormancy. Its specific molecular activity is not established; loss of function
    does not block spore formation but accelerates the loss of spore viability with
    age.
