  review:
    summary: The glucose-activated pathway specificity is a substantive concern, but the available
      evidence does not establish loss of the ancestral regulatory role.
    action: UNDECIDED
    reason: The PTHR28283 IBD at PTN002001416 derives from a glucose-signaling source context.
      The verified GO:0110034 definition requires that glucose-activated GPCR pathway; ordinary
      cAMP-receptor feedback alone does not establish it. The focused report claims the pathway
      is absent in Dictyostelium but explicitly lists this as an unresolved knowledge gap and
      did not examine the fungal primary source in full. PdsA being secreted and cAR1 being cAMP-activated
      do not by themselves exclude an additional nutrient-signaling contribution. PMID:19477920
      tested ACA activation after 10 micromolar cAMP in cells prepared with exogenous PDE; it
      is not a glucose-pathway loss experiment. Withdraw the provisional REMOVE, retain uncertainty,
      and seek expert assessment of source pathway scope and target conservation.
