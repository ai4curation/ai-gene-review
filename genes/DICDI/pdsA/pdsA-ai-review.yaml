- id: PMID:230476
  title: Binding of inhibitor alters kinetic and physical properties of extracellular cyclic
    AMP phosphodiesterase from Dictyostelium discoideum.
  findings:
  - statement: PdsA forms a complex with a heat-stable glycoprotein inhibitor that raises its
      Km; dithiothreitol relieves inhibition by inactivating the inhibitor.
    supporting_text: Treating the enzyme-inhibitor complex with dithiothreitol stimulated enzyme
      activity 20- to 100-fold
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the PdsA-inhibitor (PdiA) interaction and DTT-mediated relief
      of inhibition; supports the protein-binding and response-to-DTT annotations.
