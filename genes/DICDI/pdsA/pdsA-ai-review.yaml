  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Extracellular PdsA and intracellular RegA degrade different cAMP pools, but that
      does not settle whether PdsA negatively regulates cAMP/PKA signaling through feedback.
    action: UNDECIDED
    reason: GO:0141162 covers any process reducing cAMP/PKA signaling; it does not require direct
      hydrolysis of the cAMP bound by PKA. PMID:17040207 demonstrates pool partition, and PMID:30790701/11390363
