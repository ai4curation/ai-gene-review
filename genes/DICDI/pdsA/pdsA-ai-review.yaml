id: P12019
gene_symbol: pdsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: pdsA (PdsA, DdPDE1, PDE1) is the major extracellular cyclic nucleotide phosphodiesterase
  of Dictyostelium discoideum. It is a secreted glycoprotein of the class II cyclic nucleotide
  phosphodiesterase family that is synthesized with a cleaved signal peptide and is released
  into the medium. Older biochemical preparations suggested a cell-surface-associated form,
  whereas imaging of functional tagged PdsA during chemotaxis localized its intracellular pool
  to the endoplasmic reticulum and did not detect plasma-membrane association. The enzyme hydrolyzes
  extracellular 3',5'-cyclic AMP to 5'-AMP with a preference for cAMP over cGMP, but has dual
  specificity and also hydrolyzes 3',5'-cyclic GMP. By degrading the extracellular cAMP chemoattractant,
  PdsA sharpens the spatial cAMP gradient and terminates and resets the propagating cAMP waves
  that guide chemotaxis and streaming during starvation-induced aggregation; cells lacking PdsA
  fail to aggregate. Its activity is negatively modulated by a secreted heat-stable glycoprotein
  inhibitor (PdiA), and this inhibition is relieved by reducing agents such as dithiothreitol.
  PdsA expression is developmentally controlled through multiple promoters, including a prestalk-specific
  promoter whose activity is required for later morphogenesis (slug formation and culmination).

