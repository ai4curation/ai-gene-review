  - statement: DdPDE1 (PdsA) is a class II dual-specificity phosphodiesterase that degrades
      extracellular cAMP and cGMP and can be secreted or displayed on the cell surface.
    supporting_text: DdPDE1 (PdsA) is a class II dual-specificity PDE that degrades extracellular
      cAMP and cGMP. The enzyme can be secreted in the medium, or exposed on the cell surface.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:19477920
      review_notes: The surface-associated portion of this earlier summary conflicts with subsequent
        imaging of functional PdsA during chemotaxis; extracellular secretion and substrate
        specificity are not disputed.
      supported_by:
      - reference_id: PMID:19477920
        supporting_text: We found no colocalization of PdsA-Myc with the plasma membrane (Figure
          5C).
  - statement: PdsA is the main enzyme degrading extracellular cAMP during aggregation and is
      essential for shaping cAMP waves; pdsA-null (UK7) cells fail to aggregate.
    supporting_text: DdPDE1 is the main PDE that degrades extracellular cAMP during cell aggregation
      and is thereby essential for shaping cAMP waves
  - statement: PdsA and its homologue DdPDE7 have dual cAMP/cGMP specificity and are strongly
      inhibited by DTT and insensitive to IBMX.
    supporting_text: Both DdPDE1 and DdPDE7 are PDEs with dual cAMP/cGMP specificity, and are
      strongly inhibited by DTT and insensitive to IBMX.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text available and read; directly characterizes PdsA (DdPDE1) function,
      localization, dual specificity, and the pdsA-null aggregation phenotype.
- id: PMID:19477920
  title: The group migration of Dictyostelium cells is regulated by extracellular chemoattractant
    degradation.
  findings:
  - statement: The intracellular pool of PdsA is localized to the endoplasmic reticulum, proposed
      as a storage/secretion compartment.
    supporting_text: the intracellular pool of PdsA is localized to the endoplasmic reticulum,
      which may provide a compartment for storage and secretion of PdsA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary full text was inspected, including imaging and complementation results.
      Functional PdsA fusions rescue development, localize intracellularly to the ER and do
      not colocalize with the plasma membrane during chemotaxis. This directly supports the
      NOT localization assertion in that context; the authors propose ER contamination to explain
      earlier membrane fractions.
