      so its refuted verdict goes beyond the evidence. The 2009 normal stimulated ACA machinery
      result likewise does not exclude feedback under native gradients. Keep the PTN002001416
      inference unresolved pending a pathway-output assessment; do not assert either a proven
      PKA role or proven loss.
