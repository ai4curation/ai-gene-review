- id: file:DICDI/pdsA/pdsA-hypotheses/extracellular-pde-and-camp-pathway-regulation/openscientist.md
  title: PdsA/DdPDE1 (DICDI, UniProt P12019) — Adjudication of two negative-regulation GO claims
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Pool distinction and feedback biology are supported, but direct-only restriction
      on a regulation BP is unjustified; report itself admits no PdsA-specific PKA test or verified
      absence of a glucose-GPCR pathway. Fungal source papers not full-text read. Claimed GO:1902660
      annotation is absent from this review and not used. PTN002001416 is a node in PTHR28283,
      not a family identifier. Directionality lead for GO:0007193 was independently verified.
core_functions:
- description: Secreted class II cyclic nucleotide phosphodiesterase that hydrolyzes extracellular
    3',5'-cyclic AMP to 5'-AMP. By degrading the extracellular cAMP chemoattractant, PdsA shapes
    and resets the propagating cAMP waves that drive chemotactic streaming and aggregation during
    starvation-induced development.
