core_functions:
- description: Shell protein of the Dictyostelium vault. MvpB co-assembles with MvpA into the barrel-shaped
    vault cage (mixed shells shown by proximity labelling); without it only ovoid remnants remain. What
    the vault does for the cell is unknown.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:42014721
    supporting_text: MVPB, although not tagged, was also biotinylated
  - reference_id: PMID:7622465
    supporting_text: Ovoid structures isolated from mvp- single mutant lines represent what remains of
      vaults in these cells
  - reference_id: PMID:42014721
    supporting_text: vaults, at least in part, form a heterooligomeric assembly in which MVPA and MVPB
      laterally interact with each other
  - reference_id: PMID:42014721
    supporting_text: The 985 cytosolic vault particles could be split into halfsets before STA
  knowledge_gaps:
  - gap_statement: 'The cellular function of the Dictyostelium vault is unknown: mvp mutants are viable,
      with only a growth defect under nutritional stress, and no cargo, transport activity or enzymatic
      role of the assembled cage has been shown.'
    boundary: Vault composition (MvpA, MvpB, PARP and TEP1 orthologues), in situ architecture, membrane
      association and ribosome encapsulation are described.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Without a function every process annotation for the Dictyostelium MVPs would rest on
      indirect growth phenotypes.
suggested_questions:
- question: Do Dictyostelium cells contain homo-oligomeric MvpA-only and MvpB-only vaults as well as mixed
    ones, and what sets the MvpA:MvpB ratio per vault?
- question: Do Dictyostelium vaults contain a vault RNA? Vault RNAs have been characterised in vertebrates,
    but the cached Dictyostelium literature does not establish one.
- question: Is ribosome encapsulation by vaults functional, for example storage or protection of ribosomes
    under nutrient stress, which would connect to the growth defect of mvp mutants?
- question: What is MvpC, which copurifies with vault remnants in mvpA- mvpB- cells, and is it a minor
    shell protein that partly substitutes for MvpA/MvpB?
suggested_experiments:
- hypothesis: Vaults protect or store ribosomes during nutritional stress.
  description: Compare ribosome content, translation recovery and the growth of mvpA- mvpB- versus wild-type
    cells after starvation and re-feeding, with cryo-ET quantification of vault-enclosed ribosomes over
    the time course.
  experiment_type: genetic perturbation with cryo-electron tomography
- hypothesis: MvpA and MvpB form mixed vault shells in defined stoichiometry.
  description: Purify vaults from strains with endogenously tagged MvpA or MvpB, quantify the co-purifying
    partner by targeted MS, and solve single-particle cryo-EM structures to locate each paralogue in the
    shell.
  experiment_type: biochemistry and structural biology
