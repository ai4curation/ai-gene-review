  review:
    summary: PAINT IBA (PTN000366423) for signal transduction, whose only seed is human MVP (Q14764).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'No PAINT loss applies to this lineage (just paint-losses). The human signalling roles that
      seed this node are modulatory and tied to metazoan phosphotyrosine signalling: tyrosine-phosphorylated
      MVP binds the SH2 domains of SHP-2 and SRC in EGF signalling. Even in human the term is kept only
      as non-core. Nothing in the Dictyostelium literature links mvpB to a signalling pathway; the only
      phenotype of mvp mutants is slower growth under nutritional stress. Placing a signalling function
      at the eukaryote-wide node on the basis of one mammalian gene extrapolates beyond the evidence for
      this amoebozoan.'
    supported_by:
    - reference_id: PMID:7622465
