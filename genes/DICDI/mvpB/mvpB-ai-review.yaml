gene_symbol: mvpB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: Major vault protein beta (MvpB) is the second major shell protein of the Dictyostelium discoideum
  vault, a barrel-shaped cytoplasmic ribonucleoprotein particle of about 13 MDa conserved across eukaryotes.
  MvpB (92 kDa) is 60% identical to MvpA (94 kDa); proximity labelling from tagged MvpA biotinylates MvpB
  on the vault shell, indicating that the two proteins co-assemble, at least partly, into mixed vaults.
  Cells lacking mvpB retain only ovoid vault remnants. Vaults are overwhelmingly cytosolic, with a minor
  fraction docked on ER and nuclear-envelope membranes and a substantial fraction enclosing 80S ribosomes.
  mvpB single and mvpA mvpB double mutants are viable but reach only one third of wild-type density in
  suspension culture under nutritional stress; the remnants in double mutants copurify with a further
  92 kDa protein, MvpC. The cellular function of the vault is unknown.
