- term:
    id: GO:0034504
    label: protein localization to nucleus
  evidence_type: IMP
  original_reference_id: PMID:18305004
  qualifier: involved_in
  review:
    summary: >-
      PTP3 opposes nuclear accumulation of STATc: overexpression of PTP3 prevents
      STATc nuclear accumulation, and a dominant inhibitor of PTP3 causes ectopic
      STATc nuclear localisation. The effect works through STATc dephosphorylation,
      which blocks phosphotyrosine-SH2 dimerisation. The direction of PTP3's effect
      is therefore negative.
    action: MODIFY
    reason: >-
      The mutant phenotypes show that PTP3 negatively regulates STATc nuclear
      localisation; it does not carry out nuclear import. Negative regulation of
      protein localization to nucleus describes the IMP data correctly.
    proposed_replacement_terms:
