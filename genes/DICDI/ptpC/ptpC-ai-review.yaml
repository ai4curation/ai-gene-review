core_functions:
- description: >-
    PTP3 is a cytosolic non-receptor protein tyrosine phosphatase that binds the
    transcription factor STATc and dephosphorylates its activating residue Tyr922.
    This keeps STATc monomeric and out of the nucleus, counterbalancing the
    constitutive STATc kinase Pyk2, and so negatively regulates STATc signalling.
    DIF-1 and hyperosmotic stress inhibit PTP3 (with S448/S747 phosphorylation),
    which tips the balance toward STATc activation.
  molecular_function:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  directly_involved_in:
  - id: GO:0035335
    label: peptidyl-tyrosine dephosphorylation
  - id: GO:1904893
    label: negative regulation of receptor signaling pathway via STAT
