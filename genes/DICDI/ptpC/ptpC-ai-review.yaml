id: P54637
gene_symbol: ptpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: >-
  ptpC encodes PTP3 (tyrosine-protein phosphatase 3), a 990-residue non-receptor
  protein tyrosine phosphatase with a single, sequence-divergent classical PTP
  catalytic domain flanked by long disordered N- and C-terminal regions. PTP3 is
  the tyrosine phosphatase that deactivates the transcription factor STATc: it binds
  STATc directly and removes the activating phosphate from STATc Tyr922, opposing
  STATc dimerisation and nuclear accumulation. Under basal conditions PTP3 is
  constitutively active and largely cytosolic, counterbalancing a constitutively
  active STATc tyrosine kinase (the TKL kinase Pyk2). The prestalk inducer DIF-1 and
  hyperosmotic stress inhibit PTP3, correlating with phosphorylation of S448 and S747
  through Ca2+-dependent signalling and the TKL kinase Phg2 and with downregulation
  by the Cbl homologue CblA, so that STATc becomes tyrosine phosphorylated and nuclear.
  On stress, PTP3 relocalises from the cytosol to endosome-like vesicles and granules
  that also contain Pyk2. PTP3 is expressed during growth and early development,
  enriched in prestalk and anterior-like cells, and its gene appears to be required
  for viability, as the second of two genomic copies could not be disrupted.
