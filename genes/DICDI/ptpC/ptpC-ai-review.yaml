      STATc
  - reference_id: PMID:24587195
    supporting_text: PTP3 is constitutively active in its non-phosphorylated form
      and removes the phosphate from Tyr922 of STATc.
  - reference_id: PMID:18840649
    supporting_text: PTP3, the protein tyrosine phosphatase responsible for dephosphorylating
      STATc
suggested_questions:
- question: >-
    How does Ser/Thr phosphorylation at S448 and S747 inhibit PTP3: through a
    conformational change, or through selective oxidation of the catalytic cysteine
    in endosome-like compartments, as Araki et al. (2008) suggested?
- question: >-
    Which kinase phosphorylates PTP3 on S448, and does Phg2 phosphorylate S747
    directly or act through another kinase?
- question: >-
    Is ptpC essential for viability, given that the second genomic copy could not
    be disrupted? Does it have essential substrates besides STATc?
suggested_experiments:
- hypothesis: >-
    Phosphorylation of S448/S747 is enough to inhibit PTP3 catalytic activity toward
    STATc pTyr922.
  description: >-
    Express phosphomimetic (S448D/S747D) and non-phosphorylatable (S448A/S747A) PTP3
    in Dictyostelium. Measure activity of the purified protein on a STATc pTyr922
    phosphopeptide under reducing and non-reducing conditions, and measure STATc
    activation after DIF-1 or sorbitol in cells expressing the mutants.
- hypothesis: >-
    PTP3 is required for viability because of substrates other than STATc.
  description: >-
    Use conditional (inducible degron or CRISPR-based) depletion of both ptpC copies,
    then run substrate-trapping proteomics with the C-to-S mutant to identify all
    PTP3-bound phosphotyrosine proteins.
