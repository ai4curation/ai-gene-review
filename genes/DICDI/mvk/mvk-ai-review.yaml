gene_symbol: mvk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: mvk (DDB_G0272018) encodes the Dictyostelium discoideum mevalonate kinase, a 390-residue
  GHMP-family kinase. It transfers the gamma-phosphate of ATP to (R)-mevalonate to give
  (R)-5-phosphomevalonate, the first of the three steps that convert mevalonate to isopentenyl
  diphosphate (IPP), and requires Mg(2+). IPP feeds the farnesyl and geranylgeranyl diphosphate used
  for protein prenylation and for synthesis of dictyosterol, the major Dictyostelium sterol, which is
  made by the plant-like cycloartenol route. The function is assigned by close similarity to animal
  mevalonate kinases; the Dictyostelium enzyme has not been assayed. GFP fusions of the protein
  expressed in amoebae are cytosolic, whereas the next enzyme of the pathway, phosphomevalonate
  kinase, and farnesyl diphosphate synthase are imported into peroxisomes.
