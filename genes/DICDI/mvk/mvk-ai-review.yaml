knowledge_gaps:
- gap_statement: It is unknown how the Dictyostelium mevalonate pathway is connected across the peroxisomal
    membrane. Fusion-protein data place mevalonate kinase and diphosphomevalonate decarboxylase in the
    cytosol but phosphomevalonate kinase and farnesyl diphosphate synthase in peroxisomes, so the
    5-phosphomevalonate made by mvk would have to enter peroxisomes and 5-diphosphomevalonate leave them,
    unless the endogenous enzymes are distributed differently from the overexpressed fusions.
  boundary: Established - cytosolic N- and C-terminal GFP fusions of mvk (unrefereed thesis), a
    PTS1-dependent peroxisomal phosphomevalonate kinase (same thesis) and a PTS2-dependent peroxisomal FDP
    synthase (PMID:22849378). Not established - the location of the endogenous proteins, whether any of the
    enzymes is dual-localised, and any transporter for phosphorylated mevalonate intermediates.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: A split cytosol-peroxisome pathway would be unusual among eukaryotes and would require
    either membrane transport of charged intermediates or dual localization; it bears on where the
    nitrogen-bisphosphonate target FDPS receives its substrates in this model organism.
  resolution: Tag the endogenous mvk, phosphomevalonate kinase and mvd loci, image them against a peroxisomal marker, and fractionate amoebae with
    digitonin and organelle markers; test whether peroxisome-deficient pex mutants still make sterols and
    prenylated proteins.
  provenance:
  - reference_id: url:https://etheses.whiterose.ac.uk/id/eprint/7085/2/full%20thesis%20final%20Em.pdf
    supporting_text: Hence, it appears that the putative PTS2 does not direct DdMVK to the peroxisomes.
  - reference_id: PMID:22849378
    supporting_text: A fusion protein between FDPS and GFP (green fluorescent protein) was found, in D. discoideum,
      to localize to peroxisomes
suggested_questions:
- question: Does endogenous Dictyostelium mevalonate kinase stay cytosolic, as its GFP fusions do, while
    phosphomevalonate kinase and FDP synthase are peroxisomal? If so, how does 5-phosphomevalonate reach
    peroxisomal phosphomevalonate kinase?
- question: Has the kinetic behaviour of Dictyostelium mevalonate kinase, including feedback inhibition by
    farnesyl or geranylgeranyl diphosphate as in the animal enzymes, ever been measured?
suggested_experiments:
- hypothesis: Endogenous Dictyostelium mevalonate kinase is cytosolic.
  description: Knock in a C-terminal GFP or epitope tag at the mvk locus, image amoebae with an mRFP-PTS1
    peroxisomal marker, and confirm by digitonin permeabilisation and fractionation that the tagged protein
    is released with cytosolic markers.
  experiment_type: localization
- hypothesis: Recombinant Dictyostelium mvk is a Mg-ATP-dependent mevalonate kinase.
  description: Express and purify the protein, measure mevalonate kinase activity with a coupled
    pyruvate kinase/lactate dehydrogenase assay, and determine Km for mevalonate and ATP and inhibition by
    farnesyl and geranylgeranyl diphosphate.
  experiment_type: enzyme kinetics
