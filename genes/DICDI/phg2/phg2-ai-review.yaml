suggested_questions:
- question: Does Phg2 directly phosphorylate PTP3 Ser747 and/or myosin II heavy chain (or MHCK-A), or
    does it act through an intermediate kinase? Recombinant Phg2 has so far been inactive on exogenous
    substrates.
- question: Why do phg2-null strains in DH1 and KAx-3 backgrounds show opposite adhesion phenotypes (reduced
    vs increased attachment)?
- question: Would GO:0110014 (negative regulation of aggregation involved in sorocarp development) or
    a term for negative regulation of initiation of development better capture the phg2 developmental
    phenotype than regulation of sorocarp development?
- question: Does Phg2 genuinely bind RasG and RasS in vivo, given that its RA domain preferentially binds
    Rap1-GTP?
suggested_experiments:
- description: In vitro kinase assays with Phg2 purified from Dictyostelium (with and without co-purified
    Rap1-GTP) on recombinant PTP3 and myosin II tail fragments, plus a kinase-dead (catalytic Lys/Asp
    mutant) Phg2 complementation test of adhesion, chemotaxis and development phenotypes.
- description: Phosphoproteomic comparison of wild-type and phg2-null cells after cAMP stimulation and
    hyperosmotic stress to identify direct Phg2 substrates.
