knowledge_gaps:
- gap_statement: It is unknown how 5-diphosphomevalonate reaches the cytosolic decarboxylase in
    Dictyostelium. Fusion-protein data place mvd in the cytosol but the enzyme that makes its substrate,
    phosphomevalonate kinase, in peroxisomes, so the substrate would have to leave peroxisomes, unless
    the endogenous enzymes are distributed differently from the overexpressed fusions.
  boundary: Established - cytosolic N- and C-terminal GFP fusions of mvd and PTS1-dependent peroxisomal
    import of phosphomevalonate kinase (unrefereed thesis), and a PTS2-dependent peroxisomal FDP synthase
    (PMID:22849378). Not established - the location of the endogenous proteins, dual localization, and any
    transporter for diphosphomevalonate or IPP across the peroxisomal membrane.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: A pathway that alternates between cytosol and peroxisome would need transport of
    phosphorylated intermediates, which has not been described in any eukaryote, or dual-localised
    enzymes; either would change the model of isoprenoid synthesis in this organism.
  resolution: Tag the endogenous mvd and phosphomevalonate kinase loci, compare their locations with a
    peroxisomal marker by microscopy and digitonin fractionation, and test whether peroxisome-deficient
    pex mutants still make sterols and prenylated proteins.
  provenance:
  - reference_id: url:https://etheses.whiterose.ac.uk/id/eprint/7085/2/full%20thesis%20final%20Em.pdf
    supporting_text: In D. discoideum, diphosphomevalonate decarboxylase (DdDMPD) has neither a PTS1 nor a
      PTS2.
  - reference_id: url:https://etheses.whiterose.ac.uk/id/eprint/7085/2/full%20thesis%20final%20Em.pdf
    supporting_text: confirmed that DdPMK localizes to peroxisomes by making use of a PTS1
  - reference_id: PMID:22849378
    supporting_text: it would seem probable that other enzymes on the D. discoideum mevalonate pathway will
      also be found to be peroxisomal
suggested_questions:
- question: Is endogenous Dictyostelium mvd cytosolic, as its GFP fusions are, while the upstream
    phosphomevalonate kinase is peroxisomal? If so, how does diphosphomevalonate leave the peroxisome?
- question: Which UniPathway or GO sterol term best describes dictyosterol synthesis, given that GO:0016129
    phytosteroid biosynthetic process is defined by C-24 substitution and a delta-22 double bond?
suggested_experiments:
- hypothesis: Endogenous Dictyostelium mvd is cytosolic.
  description: Knock in a C-terminal GFP or epitope tag at the mvd locus, image amoebae with an
    mRFP-PTS1 peroxisomal marker, and use digitonin permeabilisation and fractionation with cytosolic and
    peroxisomal markers.
  experiment_type: localization
- hypothesis: Recombinant Dictyostelium mvd is an ATP-dependent diphosphomevalonate decarboxylase.
  description: Express and purify the protein and measure IPP formation from (R)-5-diphosphomevalonate
    with a coupled ADP-release assay; determine Km for both substrates.
  experiment_type: enzyme kinetics
