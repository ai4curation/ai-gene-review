taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: mvd (DDB_G0278607) encodes the Dictyostelium discoideum diphosphomevalonate decarboxylase
  (EC 4.1.1.33), a 391-residue GHMP-superfamily enzyme. It uses ATP to phosphorylate and decarboxylate
  (R)-5-diphosphomevalonate to isopentenyl diphosphate (IPP), ADP, phosphate and CO2, the last step of
  the mevalonate pathway. IPP is the C5 precursor of the farnesyl and geranylgeranyl diphosphate used
  for protein prenylation, dolichol and ubiquinone, and of dictyosterol, the major Dictyostelium sterol,
  which is made through the plant-like cycloartenol route rather than through lanosterol and
  cholesterol. The function is assigned by close similarity to animal and fungal decarboxylases; the
  Dictyostelium enzyme has not been assayed. It has no peroxisomal targeting signal, and GFP fusions
  expressed in amoebae are cytosolic, although the enzyme that makes its substrate, phosphomevalonate
  kinase, and farnesyl diphosphate synthase are imported into peroxisomes.
