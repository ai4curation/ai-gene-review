    label: cholesterol biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00063
  review:
    summary: UniPathway mapping from the UniProt PATHWAY line "Steroid biosynthesis; cholesterol
      biosynthesis" (curator inference). Dictyostelium does not make cholesterol; its sterol pathway
      cyclises oxidosqualene to cycloartenol and ends in dictyosterol.
    action: MODIFY
    reason: The essence is sound - mvd supplies IPP to the sterol pathway - but the end product is the
      human one. Sterol biosynthetic process (GO:0016126), the parent of GO:0006695, states the supported
      claim without naming a sterol Dictyostelium does not make. GO:0016129 phytosteroid biosynthetic
      process may fit dictyosterol (a C-24 ethyl, delta-22 sterol) but is not proposed without a direct
      Dictyostelium study of the sterol branch.
    proposed_replacement_terms:
    - id: GO:0016126
      label: sterol biosynthetic process
    supported_by:
    - reference_id: PMID:11607106
      supporting_text: the stereochemical outcome of squalene oxide cyclization leads to the production of
        cycloartenol rather than lanosterol
    - reference_id: PMID:10783001
      supporting_text: Presented here is the first cycloartenol synthase gene identified from a protist, the
        cellular slime mold Dictyostelium discoideum.
    - reference_id: url:https://etheses.whiterose.ac.uk/id/eprint/7085/2/full%20thesis%20final%20Em.pdf
      supporting_text: In D.discoideum the biosynthesis of dictysterol, the major sterol that is produced by
        growing amoebae
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q54YQ9
      slot: CC:PATHWAY
      requested_change: CHECK
      asserted_value: GO:0006695
      corrected_value: GO:0016126
      corrected_label: sterol biosynthetic process
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The PATHWAY comment of Q54YQ9 reads "Steroid biosynthesis; cholesterol biosynthesis"
        (ECO:0000305), and the UniPathway mapping turns it into GO:0006695 cholesterol biosynthetic process.
        Dictyostelium discoideum makes dictyosterol by way of cycloartenol (Nes et al. 1990, PMID:11607106;
        cycloartenol synthase, PMID:10783001), not cholesterol. The enzyme does feed sterol synthesis, so
        the pathway line should name sterol biosynthesis generally (or be replaced by the isopentenyl
        diphosphate pathway line used for the mvk entry), and the GO row should become GO:0016126. Based on
        the abstracts of the two papers.
