id: P51136
gene_symbol: gskA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: gskA encodes the single glycogen synthase kinase-3 (GSK-3) of the social amoeba Dictyostelium
  discoideum, a CMGC-family serine/threonine protein kinase. GskA activity is stimulated by extracellular
  cAMP acting through cell-surface cAMP receptors and the tyrosine kinases ZAK1 and ZAK2, and is also
  promoted by LKB1. During multicellular development GskA mediates the cAMP signal that induces prespore
  differentiation and represses prestalk B/stalk differentiation, so null mutants form few spores and
  an excess of basal-disc/stalk cells. GskA phosphorylates transcription factors such as Dd-STATa and
  GtaC, promoting their nuclear export. In aggregating cells it is required for efficient chemotaxis to
  cAMP and folate, phosphorylating chemotaxis regulators including the Ras effector Daydreamer, the RapGEF
  GflB, PdeD, dynacortin and the Rho GTPase RacE, whose Ser192 phosphorylation promotes mTORC2 activation
  of PKB. GskA is cytoplasmic and nuclear, associates with the central mitotic spindle and centrosomes,
  and is needed for spindle elongation and efficient cytokinesis.
