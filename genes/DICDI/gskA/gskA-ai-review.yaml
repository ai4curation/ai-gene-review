core_functions:
- description: Cytoplasmic/nuclear serine/threonine protein kinase activated downstream of cAMP receptors
    (via ZAK1/ZAK2) that phosphorylates chemotaxis regulators (DydA, GflB, PdeD, dynacortin, RacE) to
    promote TORC2 signalling and efficient chemotaxis toward cAMP.
