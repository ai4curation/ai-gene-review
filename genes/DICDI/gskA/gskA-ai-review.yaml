  review:
    summary: gskA-null cells fail to elongate the mitotic spindle; GskA-GFP decorates the central spindle.
    action: KEEP_AS_NON_CORE
    reason: Direct loss-of-function phenotype plus localization to the central spindle supports a role
      in spindle elongation, consistent with conserved GSK-3 spindle roles in animals. The function is
      likely regulatory (via phosphorylation of spindle-associated proteins, not identified), and is not
      the best-characterized role of GskA, so it is kept as non-core.
