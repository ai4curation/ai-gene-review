suggested_questions:
- question: Which direct GskA substrates mediate its regulation of mitotic spindle elongation and cytokinesis
    in Dictyostelium, given that no chromosome segregation defect accompanies the spindle defect?
- question: How are the apparently conflicting observations reconciled that gskA- cells show reduced PIP3/TORC2
    output (Teo 2010) yet extended PI3K recruitment and PKB/PKBR1 phosphorylation (Kolsch 2013)?
- question: Does GskA require priming phosphorylation of its Dictyostelium substrates (as for metazoan
    GSK-3), and which kinases provide it?
suggested_experiments:
- hypothesis: GskA directly phosphorylates RacE Ser192 and Daydreamer in vivo during chemotaxis.
  description: Perform in vitro kinase assays with purified Dictyostelium GskA (wild type vs K85R) on
    RacE and DydA, and compare phospho-site occupancy in wild-type versus gskA- cells by targeted phosphoproteomics
    after cAMP stimulation.
- hypothesis: GskA phosphorylates spindle-associated proteins required for spindle elongation.
  description: Identify mitosis-specific GskA substrates by phosphoproteomics of synchronized wild-type
    versus gskA- cells and test phospho-site mutants for spindle elongation defects by live imaging of
    GFP-tubulin.
