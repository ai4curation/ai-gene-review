- term:
    id: GO:0032197
    label: retrotransposition
  evidence_type: IC
  qualifier: involved_in
  review:
    summary: >-
      NEW: the RT-RNase H carries out the reverse-transcription step of DIRS-1
      retrotransposition.
    action: NEW
    reason: >-
      This is participation, not necessity: the protein catalyses conversion of the element
      RNA into the cDNA intermediate, which is a step of retrotransposition as GO defines it.
      DIRS-1 retrotransposition was shown with tagged reporter elements in RNAi mutants, and a
      reporter lacking most of the RT-RNase H coding region still produced cDNA through RT
      supplied in trans by endogenous copies. The protein was not mutated or assayed on its
      own, so the annotation is a curator inference (IC) from its RT activity together with
      element-level genetics. DNA integration and DNA recombination are not proposed: in DIRS
      elements those steps belong to the separately encoded tyrosine recombinase, which this
      protein lacks.
    supported_by:
    - reference_id: PMID:32170321
      supporting_text: "indicated that the endogenous DIRS-1 reverse transcriptase can act in trans"
    - reference_id: PMID:32170321
      supporting_text: "Our results show that DIRS-1 retrotransposition is facilitated only in RrpC-deficient strains and in an agnA mutant"
core_functions:
- description: >-
    Reverse transcription of DIRS-1 RNA. The RT domain, with intact catalytic aspartates
    (D99, YLDD 163-166), synthesises cDNA on the element RNA template. This makes the
    single-stranded, mostly linear extrachromosomal cDNA that is the replication intermediate
    of DIRS-1. Status in D. discoideum: inferred from domain architecture and supported
    indirectly by element-level genetics, in which RT from endogenous DIRS-1 copies acts in
    trans on reporter transcripts. There is no biochemical assay.
  molecular_function:
    id: GO:0003964
    label: RNA-directed DNA polymerase activity
  directly_involved_in:
  - id: GO:0032197
    label: retrotransposition
  - id: GO:0006278
    label: RNA-templated DNA biosynthetic process
  supported_by:
  - reference_id: file:DICDI/O96849/O96849-bioinformatics/RESULTS.md
    supporting_text: "All three catalytic aspartates are retained."
  - reference_id: PMID:32170321
    supporting_text: "suggested that the DIRS-1 encoded reverse transcriptase (Figure 2A), which is missing in trDIRS-1bsr*, can act in trans on the mRNA derived from that construct, resulting in the observed cDNA"
  knowledge_gaps:
  - gap_statement: >-
      Reverse transcriptase activity has never been measured for the purified DIRS-1 protein,
      and the primer used to start DIRS-1 reverse transcription is unknown.
    boundary: >-
      An intact RT catalytic site and trans-complementation of cDNA formation in rrpC- cells
      support RT function; neither identifies the primer or shows activity directly.
    gap_kind:
    - BIOLOGY
- description: >-
    RNase H degradation of the RNA strand of RNA-DNA hybrids formed during reverse
    transcription. The function is inferred from the DIRS1-type RNase H domain (CDD cd09275)
    with retained acidic active-site residues. It has not been tested experimentally.
  molecular_function:
    id: GO:0004523
    label: RNA-DNA hybrid ribonuclease activity
  directly_involved_in:
  - id: GO:0032197
    label: retrotransposition
  supported_by:
  - reference_id: file:DICDI/O96849/O96849-uniprot.txt
    supporting_text: "CDD; cd09275; RNase_HI_RT_DIRS1; 1."
  - reference_id: file:DICDI/O96849/O96849-bioinformatics/RESULTS.md
    supporting_text: "The DEDD-type acidic cluster appears retained"
  knowledge_gaps:
  - gap_statement: >-
      Whether the DIRS-1 RNase H domain is catalytically active, and whether it generates
      a primer for second-strand synthesis, is unknown.
    boundary: >-
      Active-site carboxylates were assigned from Pfam/CDD alignments only.
    gap_kind:
    - BIOLOGY
