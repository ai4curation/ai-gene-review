  review:
    summary: >-
      InterPro2GO mapping from the RNase H superfamily signature (IPR036397, residues
      328-463). Binding nucleic acid is true but says nothing about what the domain does.
    action: MODIFY
    reason: >-
      The signature is the RNase H fold, and in this protein it is a DIRS1-type RT-associated
      RNase H (CDD cd09275) whose acidic active-site residues (D331, E334, E368, D393) are
      retained. The informative claim is the catalytic one, RNA-DNA hybrid ribonuclease
      activity (GO:0004523). This is a lateral binding-to-activity refinement rather than an
      is_a descendant. The activity is inferred from the domain model, not assayed.
    proposed_replacement_terms:
