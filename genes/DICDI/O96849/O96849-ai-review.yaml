  review:
    summary: >-
      Reverse transcriptase activity, assigned from the RT domain. This is the defining
      activity of the protein.
    action: ACCEPT
    reason: >-
      The RT domain (Pfam RVT_1 51-215, CDD cd03714 RT_DIRS1) keeps all three catalytic
      aspartates (D99 and the YLDD motif D165/D166). Cappello et al. first recognised the
      homology to retroviral RT. Element-level genetics in D. discoideum shows that
      DIRS-1-encoded RT acts in trans to make cDNA from a reporter that lacks most of the
      RT-coding region. The protein itself has not been assayed biochemically, so the
      activity rests on domain evidence and indirect genetics; the IEA code is appropriate.
    supported_by:
    - reference_id: file:DICDI/O96849/O96849-bioinformatics/RESULTS.md
      supporting_text: "All three catalytic aspartates are retained."
    - reference_id: PMID:2416457
      supporting_text: "that bears significant homology to retrovirus reverse"
    - reference_id: PMID:32170321
      supporting_text: "suggested that the DIRS-1 encoded reverse transcriptase (Figure 2A), which is missing in trDIRS-1bsr*, can act in trans on the mRNA derived from that construct, resulting in the observed cDNA"
