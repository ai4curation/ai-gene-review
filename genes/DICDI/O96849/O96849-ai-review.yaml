      Endogenous DIRS-1 RT acts in trans on a reporter that lacks most of the RT-coding
      region. This is element-level genetic evidence; the protein itself was not assayed.
    supporting_text: "indicated that the endogenous DIRS-1 reverse transcriptase can act in trans"
