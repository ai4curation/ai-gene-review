suggested_questions:
- question: >-
    Does the degenerate C-terminal Dam-like domain of DIRS-element RT-RNase H proteins have
    any activity or structural role (for example nucleic-acid binding), or is it a
    decaying remnant?
- question: >-
    Which enzyme converts the single-stranded DIRS-1 cDNA intermediate to double-stranded
    DNA before integration by the tyrosine recombinase: this RT, or a host polymerase?
suggested_experiments:
- description: >-
    Express the RT-RNase H region of O96849 and assay RNA-dependent DNA polymerase
    (primer extension on an RNA template), DNA-dependent DNA polymerase, and RNase H
    (cleavage of a labelled RNA-DNA hybrid) activities, with YLDD-to-YLAA and D331A mutants
    as controls.
- description: >-
    In the rrpC- retrotransposition assay, supply a DIRS-1 helper carrying a catalytic-dead
    RT (YLAA) or RNase H (D331A) and test whether cDNA formation and blasticidin-resistant
    retrotransposition are lost. This would turn element-level genetics into
    protein-specific evidence.
