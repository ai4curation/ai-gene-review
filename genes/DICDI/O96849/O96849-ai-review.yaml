- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008593
  review:
    summary: >-
      InterPro2GO mapping from the Dam N6-adenine methyltransferase signature (IPR008593,
      residues 455-561), which is a distant and catalytically degenerate match in this
      protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only basis for a separate DNA-binding function is the C-terminal Dam-like region.
      In this protein that region has lost motif IV (FPPP in place of NPPY) and has never
      been studied; the literature describes it only as a methylase of unknown function. An
      RT-RNase H necessarily contacts its RNA template and DNA primer, but that is part of its
      polymerase and RNase H activities, which are annotated directly. A stand-alone DNA
      binding assertion from the degenerate MTase domain overstates what is known.
    supported_by:
    - reference_id: file:DICDI/O96849/O96849-bioinformatics/RESULTS.md
      supporting_text: "aligns to FPPP (519-522) in O96849"
    - reference_id: PMID:32170321
      supporting_text: "DIRS and PAT elements encode additionally a methylase with unknown function"
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - EC:2.7.7.7
  - UniRule:UR000414873
  review:
    summary: >-
      Combined automatic annotation from the PROSITE RT profile rule, which assigns both EC
      2.7.7.49 and EC 2.7.7.7 to RT domains.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retroviral and LTR-type RT-RNase H enzymes usually also copy DNA templates
      (second-strand synthesis), so the activity is plausible for this intact RT. It has not
      been tested for DIRS-1. The DIRS-1 replication intermediate detected in cells is
      single-stranded cDNA, and the step that makes it double-stranded, and the enzyme that
      does it, have not been identified. The term is kept as a plausible secondary activity,
      not as a core function.
    supported_by:
    - reference_id: file:DICDI/O96849/O96849-uniprot.txt
      supporting_text: "PROSITE; PS50878; RT_POL; 1."
    - reference_id: PMID:32170321
      supporting_text: "The resulting single-stranded circular DNA would then be converted to a double-stranded circular DNA, which would be ready to be incorporated into the genome by means of the DIRS-1-encoded YR activity."
- term:
    id: GO:0003964
    label: RNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
