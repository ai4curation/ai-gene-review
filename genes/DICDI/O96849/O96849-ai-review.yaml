id: O96849
gene_symbol: O96849
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: >-
  O96849 is the 608-residue reverse transcriptase-RNase H (RT-RNase H) protein encoded by the
  DIRS-1 retrotransposon of the social amoeba Dictyostelium discoideum (called ORF2 in recent
  papers, ORF3 in the original sequence report). Q23898 is a second cloned copy of the same
  ORF, identical in length and differing at nine non-catalytic positions. DIRS-1 is the
  founding member of the DIRS order of tyrosine recombinase retroelements. It is the most
  abundant retrotransposon in the D. discoideum genome and is concentrated in centromeric
  heterochromatin. The protein has an N-terminal reverse transcriptase domain (residues
  ~51-215) that keeps the catalytic aspartates of the YLDD motif. This is followed by a
  DIRS1-type RNase H domain (~323-449) that keeps its acidic active-site cluster. The
  C-terminal region (~455-561) is a distant match to phage Dam N6-adenine
  methyltransferases, but its catalytic motif IV is degenerate (FPPP in place of NPPY). The
  protein has no recombinase domain; integration is carried out by the separately encoded
  DIRS-1 tyrosine recombinase. In its native setting the RT-RNase H is expected to reverse
  transcribe the DIRS-1 RNA into the single-stranded, mostly linear extrachromosomal cDNA
  that is the replication intermediate of the element. Genetic work with tagged reporter
  elements shows that DIRS-1 is mobile only in RNAi-defective (rrpC- or agnA-) cells, and
  that RT supplied by endogenous DIRS-1 copies acts in trans. No biochemical assay of the
  protein itself has been reported.
