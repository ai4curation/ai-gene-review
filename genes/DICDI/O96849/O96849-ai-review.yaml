- term:
    id: GO:0004523
    label: RNA-DNA hybrid ribonuclease activity
  evidence_type: ISM
  review:
    summary: >-
      NEW: RNase H activity of the DIRS1-type RNase H domain, which is not in GOA.
    action: NEW
    reason: >-
      The protein has a DIRS1-type RT-associated RNase H domain (CDD cd09275 327-449; Pfam
      PF17917 323-403) with the acidic active-site residues D331, E334, E368 and D393
