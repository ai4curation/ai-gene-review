- term:
    id: GO:0009007
    label: site-specific DNA-methyltransferase (adenine-specific) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008593
  review:
    summary: >-
      InterPro2GO mapping from the Dam N6-adenine methyltransferase signature over the
      C-terminal region (455-561).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The Pfam PF05869 match is real but distant (43 bits, against about 240-250 bits for
      reviewed phage Dam enzymes). Catalytic motif IV, NPPY in the reviewed phage Dam
      methyltransferases, is FPPP here. Both the Asn that contacts the target adenine N6 and
      the aromatic residue that stacks with the flipped base are lost, and no [DNSH]PP[YFW]
      motif occurs anywhere in the protein. DIRS-element methylase domains are described as
      of unknown function, and the only D. discoideum DNA methyltransferase studied in DIRS-1
      silencing is the host enzyme DnmA. Adenine-specific site-specific methylation by this
      protein is therefore unlikely as stated and is not supported by any experiment. It is
      not removed outright because a non-canonical activity cannot be excluded from sequence
      alone.
    supported_by:
    - reference_id: file:DICDI/O96849/O96849-bioinformatics/RESULTS.md
      supporting_text: "No [DNSH]PP[YFW] motif occurs anywhere in O96849 or Q23898."
    - reference_id: PMID:32170321
      supporting_text: "DIRS and PAT elements encode additionally a methylase with unknown function"
- term:
    id: GO:0009307
    label: DNA restriction-modification system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008593
  review:
    summary: >-
      InterPro2GO mapping carried over from the phage/bacterial Dam methyltransferase family.
    action: REMOVE
    reason: >-
      Restriction-modification systems are prokaryotic defence systems that pair a
      restriction endonuclease with a cognate methyltransferase. This protein comes from a
      eukaryotic retrotransposon; it has no restriction-enzyme partner, and its Dam-like
      region is catalytically degenerate. The mapping was inherited from the bacterial and
      phage family context and has no biological basis here.
    supported_by:
    - reference_id: file:DICDI/O96849/O96849-bioinformatics/RESULTS.md
      supporting_text: "the C-terminal region is a degenerate Dam-like domain"
    - reference_id: PMID:29051748
      supporting_text: "ORF2 overlaps with ORF3 and encodes RT, RH and methyl transferase (MT) domains, while ORF3 contains the YR"
