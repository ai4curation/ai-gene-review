      The DIRS-1 replication intermediate is single-stranded, mainly linear extrachromosomal
      cDNA.
    supporting_text: "Further, we show that the extrachromosomal cDNA is a single-stranded, mainly linear molecule, which serves as a true intermediate of the DIRS-1 replication cycle."
