- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: General term inherited from a calmodulin-family node. One of the
      three seeds, S. pombe Cam2, carries it for exactly the role MlcD has, the
      light chain of a class I myosin, so the inference is not contradicted for
      MlcD. It is uninformative and peripheral to the core light-chain function.
    action: KEEP_AS_NON_CORE
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000549861
        source_label: "PANTHER node for the calmodulin family"
        source_status: SUPPORTS_TRANSFER
        comment: "IBD node of 1127 leaves with three seeds: S. pombe Cam2, Dictyostelium calmodulin calA and Plasmodium falciparum calmodulin. The target sits in the 203-leaf child PTN000549862, in the same Dictyostelium clade as calA."
      - source_id: PomBase:SPAC29A4.05
        source_label: "S. pombe cam2 (myosin 1 light chain)"
        source_status: SUPPORTS_TRANSFER
        comment: "PomBase IPI (PMID:21693583) for enzyme regulator activity with has_input myo1: the seed is annotated as the regulator of the class I myosin it binds, the role MlcD has for MyoD"
      - source_id: UniProtKB:P62203
        source_label: "Plasmodium falciparum calmodulin (CAM)"
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: "Calmodulin regulates many target enzymes; that calcium-dependent, multi-target role is not shown for MlcD"
    reason: >-
      The PAINT IBD sits at PTN000549861 (1127 leaves) and rests on three seeds.
      One of them, S. pombe Cam2 (PomBase:SPAC29A4.05), is itself a class I myosin
      light chain, and its experimental row is enzyme regulator activity with
      myosin 1 as the input. GO therefore applies this term to the light chain of
      a myosin motor, which is what MlcD is for MyoD. The earlier removal argued
      that a light chain is structural and not an enzyme regulator, which the
      seed contradicts, and that MlcD lacks direct data, which is what an IBA is
      for. What MlcD has lost is calmodulin's calcium sensing and broad target
      range: it binds only MyoD, with low calcium affinity. So the term holds
      only in the narrow sense of a myosin light chain, is as general as the
      evidence allows, and is not a core function. Kept as non-core.
    supported_by:
    - reference_id: PMID:12826013
      supporting_text: FLAG-MlcD expressed in Dictyostelium formed a complex 
        with MyoD, but not with the two other long-tailed Dictyostelium myosin I
        isoenzymes, MyoB and MyoC
    - reference_id: PMID:12826013
      supporting_text: The low affinity of MlcD for Ca2+ indicates that it 
        cannot function as a sensor of physiological Ca2+
- term:
    id: GO:0000226
    label: microtubule cytoskeleton organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: This IBA transfers a calmodulin function to a Dictyostelium-specific
      paralog that has diverged from calmodulin. MlcD binds only the class I
      myosin MyoD, an actin-based motor that functions at membranes and actin
      waves, and cannot act as a calcium sensor.
    action: REMOVE
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000549862
        source_label: "PANTHER node for the calmodulin / EF-hand light-chain family"
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: "Microtubule-organization roles derive from multifunctional calmodulin-family members; MlcD is a dedicated myosin I light chain with no microtubule connection"
      - source_id: FB:FBgn0000253
        source_label: "Drosophila calmodulin (Cam)"
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: "Multifunctional calmodulin source; its cytoskeletal roles do not transfer to a dedicated myosin light chain"
    reason: >-
      The PAINT IBD sits at PTN000549862 (203 leaves) and its four seeds are the
      calmodulins of budding yeast, fission yeast, worm and fly, all in the
      190-leaf child PTN000549863. MlcD sits in the other child, PTN000550353 (13
      leaves, Dictyostelium and Entamoeba), where a Dictyostelium-specific
      expansion (PTN000550364, 12 leaves) holds calmodulin calA, calB and MlcD.
      The term reflects calmodulin acting on spindle pole and centrosome
      targets. MlcD is not the Dictyostelium calmodulin but a derived paralog,
      and there is direct evidence on it of divergence from calmodulin: it does
      not bind the other long-tailed myosins I, and its calcium affinity is too
      low for it to act as a calcium sensor, so it has lost the calcium-dependent
      multi-target mode through which calmodulin reaches its microtubule
      targets. Its experimentally defined contexts are actin-based (macropinocytic
      cups, actin waves). This is a target-specific loss, and the PAINT fix is a
      loss annotation on the MlcD branch (PTN000855032).
    supported_by:
    - reference_id: PMID:31774725
      supporting_text: Myo1D localized, like short-tail Myo1E and Myo1F, in the 
        PIP3-rich region encircled by the actin wave
    - reference_id: PMID:12826013
      supporting_text: FLAG-MlcD expressed in Dictyostelium formed a complex 
        with MyoD, but not with the two other long-tailed Dictyostelium myosin I
        isoenzymes, MyoB and MyoC
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO annotation from the EF-hand domain (IPR002048). While 
      MlcD does contain EF-hand domains and retains low-affinity calcium 
      binding, this annotation overstates functional importance since the 
      binding is not physiologically relevant.
    action: KEEP_AS_NON_CORE
    reason: The InterPro2GO inference from EF-hand domains is technically 
      correct (MlcD does bind calcium) but functionally misleading. Three of 
      four EF-hands have degenerate calcium-coordinating residues, and the 
      measured Kd of 52 uM is far above physiological calcium concentrations. 
      This is not a core function.
    supported_by:
    - reference_id: PMID:12826013
      supporting_text: EF-hands 2-4 contain mutations in key Ca2+-co-ordinating 
        residues that would be predicted to impair Ca2+ binding
    - reference_id: PMID:12826013
      supporting_text: The low affinity of MlcD for Ca2+ indicates that it 
        cannot function as a sensor of physiological Ca2+
