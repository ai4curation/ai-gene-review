- term:
    id: GO:0062201
    label: actin wave
  evidence_type: IDA
  original_reference_id: PMID:31774725
  qualifier: part_of
  review:
    summary: MlcD localizes to actin waves as part of the Myo1D complex. 
      Specifically, Myo1D localizes to the PIP3-rich region encircled by the 
      actin wave, not the actin wave crest itself. This is a valid localization 
      annotation reflecting the behavior of the Myo1D complex.
    action: ACCEPT
    reason: Brzeska et al. 2019 directly demonstrated Myo1D (and hence its light
      chain MlcD) localizing to actin wave structures, specifically in the 
      PIP3-rich region. This is a core localization for the Myo1D motor complex.
    supported_by:
    - reference_id: PMID:31774725
      supporting_text: Myo1D localized, like short-tail Myo1E and Myo1F, in the 
        PIP3-rich region encircled by the actin wave
- term:
    id: GO:0070687
    label: macropinocytic cup cytoskeleton
  evidence_type: IDA
  original_reference_id: PMID:31774725
  qualifier: is_active_in
  review:
    summary: Myo1D localizes to macropinocytic cups, and MlcD as its light chain
      would be present there. The annotation to macropinocytic cup cytoskeleton 
      is well supported by the localization data.
    action: ACCEPT
    reason: Brzeska et al. 2019 showed that Myo1D localizes to macropinocytic 
      protrusions, cups, and freshly internalized vesicles. As the obligate 
      light chain, MlcD is present at these sites.
    supported_by:
    - reference_id: PMID:31774725
      supporting_text: Myo1D is also found in pinocytic protrusions and cups, 
        and freshly internalized vesicles
    - reference_id: file:DICDI/mlcD/mlcD-deep-research-bioreason-sft.md
      supporting_text: Its recruitment to large endocytic structures is 
        consistent with GO:0070685 macropinocytic cup
