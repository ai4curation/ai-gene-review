gene_symbol: splB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: 'splB (Pyk2, DPYK2) is a cytosolic tyrosine kinase-like (TKL) family protein kinase of Dictyostelium
  discoideum with a long, largely disordered N-terminal region and a C-terminal kinase domain. Despite
  TKL kinases being mostly serine/threonine-specific, Pyk2 is a tyrosine kinase: it autophosphorylates
  on tyrosine, and these phosphotyrosines are bound by the SH2 domain of the transcription factor STATc,
  forming a constitutive enzyme-substrate complex. Pyk2 then phosphorylates STATc on Tyr922, the activating
  tyrosine, acting as a functional analogue of metazoan JAK kinases. Pyk2 is required for STATc activation
  by the prestalk-inducing morphogen DIF-1, and acts redundantly with the related TKL Pyk3 in cGMP-dependent
  STATc activation during hyperosmotic stress. Pyk2 is semi-constitutively active, with STATc activation
  additionally controlled by the tyrosine phosphatase PTP3; under stress Pyk2 relocates from the cytosol
  into cytoplasmic granules that also contain PTP3. The gene was originally isolated as a developmentally
  regulated tyrosine kinase.'
