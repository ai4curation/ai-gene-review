- description: Cytosolic protein tyrosine kinase that autophosphorylates on tyrosine to create docking
    sites for the STATc SH2 domain and then phosphorylates STATc on its activating Tyr922, mediating STATc
    activation in response to DIF-1 and (redundantly with Pyk3) hyperosmotic stress.
