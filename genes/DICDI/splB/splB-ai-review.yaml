suggested_questions:
- question: Does splB/Pyk2 possess serine/threonine kinase activity, as its UniProt name "dual specificity
    protein kinase" implies, or is it tyrosine-specific as described by Araki et al. 2012?
- question: How is Pyk2 activity coupled to DIF-1 and to cGMP during hyperosmotic stress, given that the
    DIF-1 receptor is unknown and Pyk2 appears semi-constitutively active?
- question: What are the identity and function of the stress-induced cytoplasmic granules in which Pyk2
    and PTP3 co-accumulate?
suggested_experiments:
- description: In vitro kinase assays of purified Pyk2 kinase domain against generic Ser/Thr and Tyr peptide
    substrates, with phosphoamino acid analysis, to test dual specificity.
- description: Phosphoproteomics of wild-type versus pyk2/pyk3 double-null cells under sorbitol stress
    to identify Pyk2 substrates beyond STATc that explain the stress-hypersensitive developmental phenotype.
- description: Mapping of the Pyk2 autophosphorylation sites bound by the STATc SH2 domain by mass spectrometry
    and mutagenesis.
