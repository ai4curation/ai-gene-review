suggested_questions:
- question: What extracellular ligand, if any, is sensed by the Dictyostelium-specific extracellular domain
    of DrkA, and does it link DrkA activity to cAMP or another prestalk signal?
- question: Is DrkA localized to the plasma membrane or to intracellular vesicles (as the vsk1 name suggests),
    and where does it encounter STATa?
- question: Does DrkA phosphorylate any exogenous Ser/Thr substrates, or is it functionally a tyrosine-selective
    TKL kinase?
suggested_experiments:
- description: Assess STATa Tyr702 phosphorylation and STATa target gene expression in drkA null and kinase-dead
    knock-in strains after cAMP stimulation, with and without rk2 deletion to test redundancy.
- description: Determine DrkA subcellular localization in pstA cells using an endogenously tagged allele
    and live imaging.
