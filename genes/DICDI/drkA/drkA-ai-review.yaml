  review:
    action: KEEP_AS_NON_CORE
    summary: EC 2.7.11.1 mapping from the UniProt name "Probable serine/threonine-protein kinase". DrkA
      belongs to the TKL group; recombinant DrkA autophosphorylates on threonine as well as tyrosine,
      so some Ser/Thr activity is plausible, but no exogenous Ser/Thr substrate has been reported and
      the only characterized substrate (STATa) is phosphorylated on tyrosine.
    reason: Threonine autophosphorylation supports a degree of Ser/Thr kinase activity (dual-specificity-like
      TKL), but the demonstrated physiological activity is tyrosine phosphorylation of STATa; retain as
      non-core.
