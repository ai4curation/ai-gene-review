  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Inherited from a PANTHER node that includes many soluble cytoplasmic TKL kinases (e.g. RAF/LIMK-like
      members). DrkA is predicted to be a single-pass type I transmembrane receptor-like kinase whose
      kinase domain faces the cytoplasm, so "is_active_in cytoplasm" mis-describes a membrane-anchored
      protein. No experimental localization exists.
    reason: Topology (signal peptide 1-23, extracellular 24-322, TM 323-343, cytoplasmic kinase 344-642)
      indicates membrane-anchored activity; cytoplasm reflects soluble family members rather than this
      receptor-like subfamily.
