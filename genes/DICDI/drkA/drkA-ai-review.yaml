gene_symbol: drkA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: drkA (rk1/vsk1) encodes a Dictyostelium receptor-like kinase of the DRK subfamily within
  the tyrosine kinase-like (TKL) group. The 642-residue protein has a signal peptide, a Dictyostelium-specific
  extracellular domain shared with rk2, a single transmembrane helix and a C-terminal cytoplasmic protein
  kinase domain, an architecture typical of single-pass receptor kinases; its ligand is unknown. drkA
  is expressed almost exclusively in prestalk A (pstA) cells during multicellular development. Recombinant
  DrkA autophosphorylates on tyrosine and threonine and phosphorylates the STAT family transcription factor
  STATa on its activating Tyr702 residue in an SH2-dependent manner; over-expression increases STATa tyrosine
  phosphorylation in cells. DrkA is therefore a candidate direct STATa kinase acting in cAMP-induced STATa
  activation in prestalk cells, which is important for morphogenesis.
