id: Q869S7
gene_symbol: scsB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: Beta subunit of the mitochondrial succinyl-CoA synthetase (succinate--CoA ligase) of Dictyostelium
  discoideum, of the SUCLG2 type, the lineage whose animal members form the GTP-specific enzyme. Succinyl-CoA synthetase
  is an alpha/beta heterodimer of the tricarboxylic acid cycle that converts succinyl-CoA, a nucleoside diphosphate
  and phosphate to succinate, CoA and a nucleoside triphosphate. In this family the beta subunit carries the nucleotide
  site in its ATP-grasp domain and binds succinate, and the alpha subunit carries the CoA and phosphate sites
  and the catalytic phosphohistidine. Dictyostelium has one alpha subunit (scsA) and two beta subunits, scsB and
  an SUCLA2-type subunit (scsC), as animals do. The scsB protein is found in purified mitochondria of growing
  cells. It has a 26-residue N-terminal extension ahead of the conserved start of the mature subunit, in the position
  of the transit peptide of its animal orthologs, but no targeting sequence is predicted and the mature N-terminus
  is not known. The enzyme purified from growing cells uses GTP and forms GTP from GDP. Those measurements were
  made on the enzyme and its alpha subunit and have not been assigned to either beta subunit, so the GDP specificity
  of scsB is inferred from its evolutionary placement and has not been measured. No mutant of the gene has been
  described.
