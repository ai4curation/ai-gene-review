- term:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000212531
  - PANTHER:PTN000929335
  negated: true
  review:
    summary: NOT annotation. PAINT places ADP-forming activity at the LUCA node PTN000212531 and a loss of it at
      PTN000929335, the node that holds the animal, choanoflagellate and Dictyostelium SUCLG2-type subunits. scsB
      is below the loss node.
    action: ACCEPT
    reason: The question for this row is whether scsB is inside the clade that lost ADP use. It is. The PANTHER
      tree places it below PTN000929335, and a neighbor-joining and a maximum-likelihood tree built on one 64-sequence panel, independently of PANTHER, group it with SUCLG2 (182 of 200 neighbor-joining bootstrap trees, and all three maximum-likelihood runs). The review of PTHR11815 rates the loss at this node
      as supported. The evidence for the loss is the pigeon G-type enzyme, which is highly specific for GTP/GDP,
      the pig GTP-specific enzyme, and descent. For Dictyostelium there is no assay of a defined scsA/scsB heterodimer
      with ADP. The enzyme-level data agree with the negative and do not prove it. The partially purified enzyme
      is phosphorylated with GTP and little or not at all with ATP, but its beta subunit was not identified, and
      crude preparations accept both nucleotides. Gln at position 20 of the mature subunit (Gln46 here) is a conserved
      feature of the clade and is not by itself evidence for loss of ADP use. The A-type subunit scsC (Q55AI5),
      in the other daughter clade, is the candidate for any ADP-forming enzyme in this organism. The Dictyostelium
      papers were read as abstracts only.
    supported_by:
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: '| Dictyostelium Q869S7 (Gln) | G daughter, under PTN000929335 | with SUCLG2 | 10 / 182 /
        8 | with SUCLG2 |'
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
