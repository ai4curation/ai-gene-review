- id: PMID:35602934
  title: Generation of a mitochondrial protein compendium in Dictyostelium discoideum.
  findings:
  - statement: Mitochondria of axenically growing AX2 cells were purified on Percoll gradients and compared with
      whole-cell lysate by quantitative mass spectrometry.
    supporting_text: From AX2 axenic cultures, we prepared mitochondria isolates—both crude and highly purified—through
      Percoll gradient ultracentrifugation
  - statement: Proteins were classified by their enrichment relative to 47 reference mitochondrial proteins, with
      a cutoff of 0.392. In the supplementary tables Q869S7 has a relative enrichment ratio of 0.799 and is in
      the compendium; scsA has 1.021 and scsC 0.854. Q869S7 is itself one of the 47 reference proteins.
    supporting_text: We chose an RER cutoff of 0.392
  - statement: Targeting sequences were predicted with TargetP-2.0, which classifies Q869S7 as having none (supplementary
      tables S1 and S5).
    supporting_text: Subcellular localization was predicted using TargetP-2.0
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read, and supplementary tables S1 to S9 read directly; the values for Q869S7 are in
      the supplementary spreadsheets and not in the cached text, so they cannot be quoted. This is the only publication
      with data on the scsB protein. Whole-organelle proteomics without sub-mitochondrial resolution. Because Q869S7
      is one of the reference proteins chosen from existing annotation, its classification as mitochondrial is
      not independent of that annotation, but its enrichment in purified mitochondria is a measurement.
