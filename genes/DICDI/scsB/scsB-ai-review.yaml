core_functions:
- description: SUCLG2-type beta subunit of the mitochondrial succinyl-CoA synthetase heterodimer. In this family
    the beta subunit binds the nucleotide and succinate; with the alpha subunit scsA it is expected to form the
    GDP-forming enzyme of the tricarboxylic acid cycle. GDP specificity is inferred from descent below PANTHER
    PTN000929335 and agrees with the GTP-utilizing enzyme purified from growing cells, whose beta subunit was
    not identified; it has not been measured for this subunit.
