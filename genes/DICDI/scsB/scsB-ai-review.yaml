  - reference_id: PMID:18452512
    supporting_text: Although analysis of residues inside the nucleotide-binding site suggests that Blastocystis
      SCS is GTP-specific, we demonstrate that it is ATP-specific.
- gap_statement: How the succinyl-CoA synthetase step is divided between the two beta subunits scsB and scsC,
    which are present in the same mitochondria, is unknown.
  boundary: 'Established: scsA, scsB and scsC are all enriched in purified mitochondria of axenically growing cells,
    and there is one alpha gene. In crude fractions the alpha subunit is labelled by ATP and by GTP; after partial
    purification, by GTP and little or not at all by ATP. Not established: the share of flux carried by each beta
    subunit, whether scsC forms an ADP-forming enzyme, whether labelling by ATP in crude fractions comes from such
    an enzyme or from conversion of ATP to GTP, and whether the ratio of the two subunits changes in development.'
