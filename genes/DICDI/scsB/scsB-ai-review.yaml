knowledge_gaps:
- gap_statement: The nucleotide specificity of the enzyme that scsB forms with scsA has not been measured, and
    the GTP-utilizing activity of the purified Dictyostelium enzyme has not been assigned to scsB as opposed to
    the A-type beta subunit scsC.
  boundary: 'Established: scsB descends from the node of the animal GTP-specific subunits and has Gln at position
    20 of the mature subunit; the enzyme purified from growing cells uses GTP, forms GTP from GDP and is an alpha/beta
    dimer. Not established: which beta subunit that enzyme contains, and any activity of a defined scsA/scsB heterodimer
    with GTP/GDP or with ATP/ADP. Gln20 does not settle it, because a Gln20 enzyme of another eukaryote is ATP-specific.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Every molecular function annotation on this gene, including the negative annotation for ADP-forming
    activity, rests on this inference. Among the organisms outside vertebrates with a subunit below the
    node where PAINT places the gain of GDP-forming and the loss of ADP-forming activity, Dictyostelium is the
    one for which the review of the family found enzyme-level data.
  resolution: Co-expression of mature scsA with scsB, purification of the heterodimer and assay of the complete
    reaction in both directions with GTP/GDP and ATP/ADP; identification of the beta subunit of the native enzyme
    by mass spectrometry.
  provenance:
