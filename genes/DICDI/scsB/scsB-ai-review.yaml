        have been purified to homogeneity from pigeon liver and breast muscle
    - reference_id: PMID:8448193
      supporting_text: Partially purified p36 retained its ability to be phosphorylated with GTP while exhibiting
        little or no phosphorylation with ATP
    - reference_id: PMID:8448193
      supporting_text: In crude sample preparations, p36 could be phosphorylated by both ATP or GTP
    - reference_id: PMID:18452512
      supporting_text: Although analysis of residues inside the nucleotide-binding site suggests that Blastocystis
