        comprise a mitochondrial targeting sequence
    - reference_id: PMID:8240297
      supporting_text: Gel-filtration analyses indicate that SCS in our system behaves as a non-interacting alpha
        beta dimer
    - reference_id: file:DICDI/scsB/scsB-bioinformatics/RESULTS.md
      supporting_text: Six of the seven references place their mature start on Leu27 of Q869S7.
    - reference_id: file:DICDI/scsB/scsB-bioinformatics/RESULTS.md
      supporting_text: They contain 4 basic residues (Lys or Arg), no acidic residue (Asp or Glu), 3 Ser or Thr
        and 12 hydrophobic residues
