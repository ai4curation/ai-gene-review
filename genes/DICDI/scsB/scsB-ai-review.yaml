suggested_questions:
- question: Does dictyBase or the laboratory that purified the Dictyostelium enzyme hold a peptide-level identification
    of the beta subunit of the purified GTP-utilizing enzyme? The abstracts of PMID:8448193, PMID:8240297 and PMID:7771809
    identify only the alpha subunit, and the full texts were not read.
- question: Is the PAINT loss of ADP-forming activity at PTN000929335 meant to cover the Dictyostelium subunit,
    for which no assay with ADP exists? The negative annotation is accepted here on descent, with the partially
    purified enzyme showing little or no labelling by ATP.
- question: The mitochondrial compendium of PMID:35602934 places scsA, scsB and scsC in purified mitochondria.
    Should these supply high-throughput experimental mitochondrion annotations for the three genes, given that
    all three were among the reference proteins used to scale the enrichment ratio?
- question: The A-type beta gene scsC (Q55AI5) carries a no-data annotation for molecular function and scsB carries
    none, although neither subunit has been assayed. Should the two genes be treated alike?
suggested_experiments:
- hypothesis: scsB forms a GDP-forming enzyme with scsA that does not use ADP, and scsC forms an ADP-forming enzyme
    with the same alpha subunit.
  description: Co-express mature scsA with scsB and, separately, with scsC in E. coli. Purify each heterodimer and
    measure kcat and Km for the complete reaction with GTP/GDP and with ATP/ADP. Test the exchange of Gln46 of scsB
    for Pro, and the reverse exchange in scsC.
- hypothesis: scsB carries most of the succinyl-CoA synthetase flux in growing cells, and labelling of the alpha
    subunit by ATP in crude fractions depends on scsC.
  description: Disrupt scsB and scsC singly, and attempt the double mutant, in an axenic strain. Measure GDP- and
    ADP-dependent succinyl-CoA synthetase activity and labelling of the alpha subunit by ATP and by GTP in mitochondrial
    extracts, with oxygen consumption, growth and the timing of development.
- hypothesis: The first 26 residues of scsB are a mitochondrial presequence that is removed in the matrix.
  description: Determine the N-terminus of scsB from purified mitochondria by Edman sequencing or N-terminal proteomics.
    Express full-length scsB and residues 1 to 30 fused to a fluorescent protein with a mitochondrial marker, and
    delete the extension. Fractionate gradient-purified mitochondria by protease protection and carbonate extraction
    with matrix, inner-membrane and endoplasmic-reticulum markers.
- hypothesis: The stimulation of phosphoenzyme formation by low GDP requires the G-type beta subunit.
  description: Repeat the phosphoenzyme assay at low and high GDP with the recombinant scsA/scsB and scsA/scsC heterodimers.
