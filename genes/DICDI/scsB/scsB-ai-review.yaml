- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IC
  original_reference_id: PMID:35602934
  qualifier: located_in
  review:
    summary: Proposed sub-compartment, added beside the three mitochondrion rows and not in place of them. scsB
      is a soluble subunit of a tricarboxylic acid cycle enzyme, it is found in purified mitochondria, and its alpha
      partner is imported with a cleaved presequence.
    action: NEW
    reason: 'An inference from several lines that agree; no sub-mitochondrial assay exists for this protein. (1)
      The protein is in the organelle: it is enriched in Percoll-purified mitochondria. (2) The function belongs
      in the matrix: the enzyme is a step of the tricarboxylic acid cycle and its substrates are matrix metabolites.
      (3) The partner is a matrix-targeted protein: the enzyme is a soluble alpha/beta dimer, the alpha subunit
      is the product of a single-copy gene, and direct protein sequencing shows that its 16-residue targeting sequence
      is removed. A beta subunit that works in that dimer is in the same compartment. (4) Topology: the UniProt
      record has no transmembrane feature, and scsB has a 26-residue N-terminal extension ahead of the conserved
      start of the mature subunit, with four basic and no acidic residues, in the position of the transit peptides
      of human SUCLG2 and SUCLA2. One line does not agree: TargetP-2.0 classifies the protein as having no targeting
      peptide (supplementary tables of the proteome study) and UniProt records that none is predicted, so whether
      the extension is a cleaved presequence is unknown. That concerns the import signal and not the compartment.
      The core function location stays at mitochondrion, because the activity has not been shown in a sub-compartment.
      The alpha subunit scsA carries the same proposed row. As a comparator and not as evidence on this protein, the mouse ortholog Suclg2 (Q9Z2I8) is annotated to mitochondrial matrix by IDA (PMID:27496549, QuickGO 2026-11-18; the paper was not read).'
    supported_by:
    - reference_id: PMID:35602934
      supporting_text: From AX2 axenic cultures, we prepared mitochondria isolates—both crude and highly purified—through
        Percoll gradient ultracentrifugation
    - reference_id: PMID:7771809
