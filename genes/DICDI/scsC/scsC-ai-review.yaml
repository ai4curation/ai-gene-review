  review:
    summary: IBA from PANTHER PTN000212531, the LUCA node of the beta-subunit family, seeded by rat, E. coli, Pseudomonas aeruginosa, tomato and human ADP-forming subunits. scsC is inside the clade that inherits the term and outside the node
      where PAINT records its loss.
    action: ACCEPT
    reason: Core activity, held by inference. The question for this row is whether scsC is inside the clade that
      inherited ADP use, and whether anything shows that it lost it. The PANTHER tree places scsC in the A daughter
      (PTN008330414) with human SUCLA2 and yeast LSC2, and not below PTN000929335, where PAINT places the loss
      of ADP-forming activity and where its paralog scsB sits. The maximum-likelihood tree of the LSC2 analysis
      groups scsC with SUCLA2 in a clade with ultrafast bootstrap 98. Neighbor joining agrees in 127 of 200 bootstrap
      trees, which is moderate support and weaker than for yeast LSC2. scsC has an intact ATP-grasp domain with
      Pro at position 20 of the mature subunit (Pro54), as the assayed ADP-forming subunits have. The assayed
      members of the A-type lineage, the yeast enzyme and the pigeon A-type enzyme, use ATP and not GTP. Nothing
      specific to scsC indicates loss or divergence. The pruning that the review of PTHR11815 proposes for this
      annotation concerns other leaves. The limits are these. The activity has not been measured for this subunit
      or for any enzyme shown to contain it. The succinyl-CoA synthetase purified from growing Dictyostelium cells
      uses GTP, which is the activity expected of the scsB-containing enzyme, so no ADP-forming enzyme has been
      isolated from this species. In crude fractions the alpha subunit is labelled by ATP as well as GTP, which
      an ADP-forming enzyme would explain but which conversion of ATP to GTP in the fraction would also explain.
      Position 20 does not decide nucleotide use alone. The activity belongs to the alpha/beta heterodimer, so
      the core function records it as a contribution. The Dictyostelium, yeast and pigeon papers were read as
      abstracts only.
