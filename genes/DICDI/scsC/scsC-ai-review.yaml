knowledge_gaps:
- gap_statement: The nucleotide specificity of the enzyme that scsC forms with scsA has not been measured, and
    no ADP-forming succinyl-CoA synthetase has been isolated from Dictyostelium.
  boundary: 'Established: scsC descends from the lineage of the ATP-specific subunits of animals and fungi, outside
    the node where ADP use was lost, and has Pro at position 20 of the mature subunit; the enzyme purified from
    growing cells uses GTP and is an alpha/beta dimer; in crude fractions the alpha subunit is labelled by ATP
    as well as by GTP. Not established: any activity of a defined scsA/scsC heterodimer with ATP/ADP or with GTP/GDP,
    and whether labelling by ATP in crude fractions comes from an scsC-containing enzyme or from conversion of
    ATP to GTP. Position 20 does not settle it, because a Gln20 enzyme of another eukaryote is ATP-specific and
    a Pro20 bacterial enzyme prefers GTP.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Every molecular function annotation on this gene other than the no-data row rests on this inference.
    Dictyostelium is the one organism outside animals and fungi with a subunit in this clade for which enzyme-level
    data exist, and those data show only the GTP-using form.
  resolution: Co-expression of mature scsA with scsC, purification of the heterodimer and assay of the complete
    reaction in both directions with ATP/ADP and GTP/GDP; separation of the succinyl-CoA synthetase forms of
    mitochondrial extracts and identification of the beta subunit of each by mass spectrometry.
  provenance:
  - reference_id: PMID:7771809
    supporting_text: We have previously shown that the enzyme purified from growing D. discoideum is a GTP-utilizing
      enzyme
  - reference_id: PMID:8448193
    supporting_text: In crude sample preparations, p36 could be phosphorylated by both ATP or GTP
  - reference_id: PMID:8448193
    supporting_text: Partially purified p36 retained its ability to be phosphorylated with GTP while exhibiting
      little or no phosphorylation with ATP
  - reference_id: PMID:18452512
    supporting_text: Although analysis of residues inside the nucleotide-binding site suggests that Blastocystis
      SCS is GTP-specific, we demonstrate that it is ATP-specific.
  - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
    supporting_text: The residue therefore does not by itself decide nucleotide use for an unassayed subunit.
- gap_statement: Whether scsC forms an enzyme with scsA in the cell, and how the succinyl-CoA synthetase step
    is divided between the two beta subunits scsC and scsB, which are present in the same mitochondria, is unknown.
  boundary: 'Established: scsA, scsB and scsC are all enriched in purified mitochondria of axenically growing cells,
    and there is one alpha gene. The purified enzyme is an alpha/beta dimer whose beta subunit was not identified.
    Not established: a physical association of scsC with scsA, the share of flux carried by each beta subunit,
    and whether the ratio of the two subunits changes in development. No mutant of scsC or scsB has been described.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: It decides whether scsC carries part of the tricarboxylic acid cycle step in this organism, and
    whether the animal arrangement of one alpha subunit serving two enzymes of different nucleotide specificity
    is shared by Amoebozoa.
  resolution: Disruption of scsC and of scsB, singly and together, followed by assay of ADP- and GDP-dependent
    succinyl-CoA synthetase activity in mitochondrial extracts, respirometry, and growth and development assays;
    co-purification of tagged scsC with scsA.
  provenance:
