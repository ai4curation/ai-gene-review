  - reference_id: PMID:8384004
    supporting_text: p38 can be phosphorylated in vitro using either ATP or GTP as phosphoryl donors
  - reference_id: PMID:7771809
    supporting_text: In D. discoideum, the alpha subunit is a single copy gene that is developmentally regulated
  - reference_id: PMID:35602934
    supporting_text: we assessed the probability of a protein localizing to mitochondria by comparing its relative
