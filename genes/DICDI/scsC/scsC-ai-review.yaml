- id: PMID:35602934
  title: Generation of a mitochondrial protein compendium in Dictyostelium discoideum.
  findings:
  - statement: Mitochondria of axenically growing AX2 cells were purified on Percoll gradients and compared with
      whole-cell lysate by quantitative mass spectrometry.
    supporting_text: From AX2 axenic cultures, we prepared mitochondria isolates—both crude and highly purified—through
      Percoll gradient ultracentrifugation
  - statement: Proteins were classified by their enrichment relative to 47 reference mitochondrial proteins, with
      a cutoff of 0.392. In the supplementary tables Q55AI5 has a relative enrichment ratio of 0.854 and is in
      the compendium; scsA has 1.021 and scsB 0.799. Q55AI5 is itself one of the 47 reference proteins.
    supporting_text: We chose an RER cutoff of 0.392
  - statement: Targeting sequences were predicted with TargetP-2.0, which classifies Q55AI5 as having a mitochondrial
      targeting peptide (supplementary tables S1 and S5).
    supporting_text: Subcellular localization was predicted using TargetP-2.0
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read, and the supplementary tables downloaded and read directly; the values for Q55AI5
      are in the supplementary spreadsheets and not in the cached text, so they cannot be quoted. This is the only
      publication with data on the scsC protein. Whole-organelle proteomics without sub-mitochondrial resolution,
      and no functional data. Because Q55AI5 is one of the reference proteins chosen from existing annotation,
      its classification as mitochondrial is not independent of that annotation, but its enrichment in purified
      mitochondria is a measurement. In Table S5 the dictyBase identifier on the Q55AI5 row belongs to another
      gene; the accession and values agree with the other tables.
- id: PMID:7771809
  title: Cloning and expression of the alpha subunit of succinyl-CoA synthetase from
    Dictyostelium discoideum.
  full_text_unavailable: true
  findings:
  - statement: The enzyme purified from growing cells uses GTP.
    supporting_text: We have previously shown that the enzyme purified from growing D. discoideum is a GTP-utilizing
      enzyme
  - statement: The alpha subunit has a cleaved 16-residue mitochondrial targeting sequence and is encoded by a single-copy
      gene.
    supporting_text: Direct amino acid sequence data indicate that the first 16 amino acids encoded by the cDNA
      comprise a mitochondrial targeting sequence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. About the alpha subunit and the enzyme; the abstract says nothing about a beta
      subunit gene. The GTP-using enzyme is the form expected of the paralog scsB, so this paper is evidence that
      no ADP-forming enzyme has been purified from the species, not evidence about scsC. One of the two references
      that dictyBase lists for the gene.
