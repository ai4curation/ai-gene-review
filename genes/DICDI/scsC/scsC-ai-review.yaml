- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IC
  original_reference_id: PMID:35602934
  qualifier: located_in
  review:
    summary: Proposed sub-compartment, added beside the three mitochondrion rows and not in place of them. scsC
      is a soluble subunit of a tricarboxylic acid cycle enzyme, it is found in purified mitochondria, a targeting
      peptide is predicted, and its alpha partner is imported with a cleaved presequence.
    action: NEW
    reason: 'An inference from several lines that agree; no sub-mitochondrial assay exists for this protein. (1)
      The protein is in the organelle: it is enriched in Percoll-purified mitochondria. (2) The function belongs
      in the matrix: the enzyme is a step of the tricarboxylic acid cycle and its substrates are matrix metabolites.
      (3) The partner is a matrix-targeted protein: the alpha subunit is the product of a single-copy gene, and
      direct protein sequencing shows that its 16-residue targeting sequence is removed. A beta subunit that works
      with it is in the same compartment. (4) Topology and targeting: the UniProt record has no transmembrane
      feature; scsC has a 34-residue N-terminal extension ahead of the conserved start of the mature subunit,
      with seven basic and no acidic residues, in the position of the transit peptides of human SUCLA2 and SUCLG2;
      the family rule predicts a transit peptide, and TargetP-2.0 classifies the protein as having a mitochondrial
      targeting peptide (supplementary tables S1 and S5 of the proteome study, read directly). No line disagrees.
      The length of the presequence is uncertain: the rule gives 17 residues and the alignment leaves 34 ahead
      of the conserved start, and the cleavage site has not been measured. That concerns the processing site and
      not the compartment. The core function location stays at mitochondrion, because the activity has not been
      shown in a sub-compartment. The alpha subunit scsA and the paralog scsB carry the same proposed row.'
    supported_by:
    - reference_id: PMID:35602934
      supporting_text: From AX2 axenic cultures, we prepared mitochondria isolates—both crude and highly purified—through
