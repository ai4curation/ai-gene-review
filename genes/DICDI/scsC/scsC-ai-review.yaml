id: Q55AI5
gene_symbol: scsC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:44689
  label: Dictyostelium discoideum
description: Beta subunit of the mitochondrial succinyl-CoA synthetase (succinate--CoA ligase) of Dictyostelium
  discoideum, of the SUCLA2 type, the lineage whose animal and fungal members form the ATP-specific enzyme. Succinyl-CoA
  synthetase is an alpha/beta heterodimer of the tricarboxylic acid cycle that converts succinyl-CoA, a nucleoside
  diphosphate and phosphate to succinate, CoA and a nucleoside triphosphate. In this family the beta subunit carries
  the nucleotide site in its ATP-grasp domain and binds succinate, and the alpha subunit carries the CoA and phosphate
  sites and the catalytic phosphohistidine. Dictyostelium has one alpha subunit (scsA) and two beta subunits, scsC
  and an SUCLG2-type subunit (scsB), as animals do. The scsC protein is found in purified mitochondria of growing
  cells. It has a 34-residue basic N-terminal extension ahead of the conserved start of the mature subunit, in
  the position of the transit peptide of its animal orthologs, and a mitochondrial targeting peptide is predicted;
  the mature N-terminus is not known. An enzyme that contains scsC has not been isolated or assayed. The succinyl-CoA
  synthetase purified from growing cells uses GTP, the activity expected of the scsB-containing enzyme, so the ADP-forming
  activity of scsC is inferred from its evolutionary placement and has not been measured. No mutant of the gene
  has been described.
