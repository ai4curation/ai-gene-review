suggested_questions:
- question: Did the purification of the Dictyostelium enzyme in PMID:8448193 and PMID:7771809 remove an ATP-linked
    form of succinyl-CoA synthetase? Crude preparations label the alpha subunit with ATP and GTP, and the partially
    purified enzyme with GTP only. The full texts were not read.
- question: dictyBase keeps a no-data annotation for the molecular function of scsC (2015) and none for scsB,
    although neither beta subunit has been assayed. Is the difference intended, given that the enzyme-level assays
    on the alpha subunit show the GTP-using form?
- question: The mitochondrial compendium of PMID:35602934 places scsA, scsB and scsC in purified mitochondria.
    Should these supply high-throughput experimental mitochondrion annotations for the three genes, given that
    all three were among the reference proteins used to scale the enrichment ratio?
- question: The UniProt record gives scsC a transit peptide of residues 1 to 17 from HAMAP rule MF_03220, while
    the conserved start of the mature subunit aligns to residue 35. Is the rule's cleavage position meant to
    be read as approximate for this entry?
suggested_experiments:
- hypothesis: scsC forms an ADP-forming enzyme with scsA that does not use GDP, and scsB forms a GDP-forming enzyme
    with the same alpha subunit.
  description: Co-express mature scsA with scsC and, separately, with scsB in E. coli. Purify each heterodimer and
    measure kcat and Km for the complete reaction with ATP/ADP and with GTP/GDP, and labelling of the alpha subunit
    by radiolabelled ATP and GTP. Test the exchange of Pro54 of scsC for Gln, and the reverse exchange in scsB.
- hypothesis: Dictyostelium mitochondria contain two succinyl-CoA synthetase forms, and the ATP-linked form contains
    scsC and is lost in the published purification.
  description: Fractionate mitochondrial extracts of growing cells by hydroxyapatite or ion-exchange chromatography,
    assay each fraction for ADP- and GDP-dependent succinyl-CoA synthetase activity, and identify the beta subunit
    in each active fraction by mass spectrometry.
- hypothesis: scsC and scsB each carry part of the succinyl-CoA synthetase flux, and labelling of the alpha subunit
    by ATP in crude fractions depends on scsC.
  description: Disrupt scsC and scsB singly, and attempt the double mutant, in an axenic strain. Measure ADP- and
    GDP-dependent succinyl-CoA synthetase activity and labelling of the alpha subunit by ATP and by GTP in mitochondrial
    extracts, with oxygen consumption, growth, the timing of development and mitochondrial DNA copy number.
- hypothesis: The N-terminal 34 residues of scsC are a mitochondrial presequence that is removed in the matrix.
  description: Determine the N-terminus of scsC from purified mitochondria by Edman sequencing or N-terminal proteomics.
    Express full-length scsC and its first 40 residues fused to a fluorescent protein with a mitochondrial marker.
    Fractionate gradient-purified mitochondria by protease protection and carbonate extraction with matrix, inner-membrane
    and endoplasmic-reticulum markers.
