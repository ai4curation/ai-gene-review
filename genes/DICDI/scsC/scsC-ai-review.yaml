    - reference_id: file:DICDI/scsC/scsC-uniprot.txt
      record_section: ["FT:TRANSIT"]
      supporting_text: TRANSIT         1..17 /note="Mitochondrion"
core_functions:
- description: SUCLA2-type beta subunit of the mitochondrial succinyl-CoA synthetase heterodimer. In this family
    the beta subunit binds the nucleotide and succinate; with the alpha subunit scsA it is expected to form the
    ADP-forming enzyme of the tricarboxylic acid cycle. ADP specificity is inferred from descent in the A daughter
    clade of the beta-subunit family, outside the node where ADP use was lost. It has not been measured for this
    subunit, and the enzyme purified from growing cells uses GTP. The complex is named at the nucleotide-neutral
    level for that reason.
