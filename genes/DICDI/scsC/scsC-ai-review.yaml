  review:
    summary: No-data annotation made by dictyBase in 2015. It records that a search of the literature found no
      molecular function shown for this gene product. That is still the case.
    action: ACCEPT
    reason: 'The annotation follows the evidence-code guideline. No publication assays, purifies, mutates or names
      the scsC product; the searches and their counts are in the notes file. The IBA and IEA rows for ADP-forming
      activity are inferences and do not make the no-data row stale. The enzyme assays from this species do not
      change that. They are on the enzyme and its alpha subunit, they do not identify a beta subunit, and what
      was purified uses GTP, which is the activity expected of the paralog scsB. The one publication with data
      on the scsC protein is an organelle proteome, which gives a location and no function. The case is recorded
      as a true gap and not as inferable. The family and the reaction are clear from orthologs, but the nucleotide
      is not: the only enzyme purified from this species uses GTP, the A-type placement of scsC has moderate
      support in one of the two trees built on one panel independently of PANTHER, and the residue at position 20 does not decide nucleotide use. This is the subcase in which the family is known but the specificity is not. The test for an inferable function is the one applied to the IBA row, and it is met for the reaction, since scsC is inside the clade that inherits the term; it is the ortholog assignment that is ambiguous for the nucleotide (57.9% identity to the paralog scsB, and 127 of 200 neighbor-joining bootstrap trees with SUCLA2 against 59 with SUCLG2 and 14 outside both), which is why the true-gap subcase is used although the IBA and IEA rows are accepted. The matching knowledge gap
      is the first one of this review.'
    nd_case: TRUE_GAP
    supported_by:
