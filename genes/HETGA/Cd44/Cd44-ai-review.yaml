core_functions:
- description: >-
    Hyaluronan receptor at the cell surface. The N-terminal Link module binds the hyaluronan
    of the pericellular and extracellular matrix, tethering the cell to that matrix and
    reporting its abundance. In the naked mole rat this is the sensing arm of the
    hyaluronan-dependent proliferative brake: fibroblasts secrete very-high-molecular-mass
    hyaluronan, CD44 reads it, and blocking the receptor with an antibody lets cells reach
    higher densities and form colonies in soft agar. All four hyaluronan-contact residues and
    all three Link-region disulfides of the human protein are conserved, and naked mole-rat
    cells bind hyaluronan roughly twice as avidly as mouse or human cells.
  molecular_function:
    id: GO:0005540
    label: hyaluronic acid binding
  directly_involved_in:
  - id: GO:0008285
    label: negative regulation of cell population proliferation
  - id: GO:0007155
    label: cell adhesion
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:23783513
    supporting_text: >-
      To confirm that HA signaling triggers ECI via the CD44 receptor we cultured naked
      mole-rat cells in the presence of a CD44-blocking antibody. Naked mole-rat cells grown
      with CD44 antibodies reached a higher cell density (Figure 3b) indicating that the ECI
      signal from HMW-HA is in part transmitted via the CD44 receptor.
  - reference_id: PMID:23783513
    supporting_text: >-
      Naked mole-rat cells displayed a two-fold higher affinity to HA than mouse or human
      cells (Figure 3d), which can contribute to higher sensitivity of naked mole rat cells
      to HA signaling.
  - reference_id: file:HETGA/Cd44/Cd44-bioinformatics/RESULTS.md
    supporting_text: >-
      All four UniProt-annotated hyaluronan-contact residues of human CD44 and all six
      cysteines forming the three Link-region disulfides have direct counterparts in the NMR
      sequence
- description: >-
    Transmembrane signalling receptor. Ligand engagement at the ectodomain is relayed through
    a short, almost invariant cytoplasmic tail (97.2% identity to human) to the ERM/NF2
    machinery and to survival signalling. In naked mole-rat cells this transduction step is
    what converts the hyaluronan signal into growth arrest and into resistance to
    transformation, and it also underlies the receptor's cytoprotective effect: the
    protection that naked mole-rat very-high-molecular-mass hyaluronan confers against
    oxidative-stress-induced death requires CD44 and not RHAMM.
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0043066
    label: negative regulation of apoptotic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23783513
    supporting_text: >-
      On the cytoplasmic face, the CD44 receptor interacts with NF2 (merlin), which mediates
      contact inhibition17.
  - reference_id: PMID:32398747
    supporting_text: >-
      Knockdown of RHAMM did not block the cytoprotective effect of NSF-HA, whereas CD44
      siRNA as well as a CD44 neutralizing antibody abrogated its effect
  - reference_id: file:HETGA/Cd44/Cd44-bioinformatics/RESULTS.md
    supporting_text: >-
      The cytoplasmic tail is the single most conserved region (97.2% identity).
- description: >-
    Endoplasmic reticulum pool that raises basal ATF6 output and confers ER stress
    resistance, independently of hyaluronan. CD44 co-localises with ER markers and associates
    with ER chaperones including CALR, HSPA5 and HSP90B1; depleting it lowers basal ATF6
    target gene expression and survival under tunicamycin, and an ER-retained CD44 ectodomain
    is sufficient to restore both. In the naked mole rat this arm is demonstrated on the
    animal's own protein - CD44 knockdown in naked mole-rat oligodendrocyte progenitors
    downregulates ER and ATF6 gene sets and abolishes their tunicamycin advantage over mouse
    cells - and CD44 expression is unusually high in this species and correlates with maximum
    lifespan across mammals. The molecular activity by which CD44 acts on the ER is not
    established, so no molecular-function term is asserted.
  directly_involved_in:
  - id: GO:1903893
    label: positive regulation of ATF6-mediated unfolded protein response
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:37708026
    supporting_text: >-
      Indeed, NMR OPCs showed higher resistance against an ER stress inducer, tunicamycin,
      compared with mouse OPCs in a manner dependent on CD44.
  - reference_id: PMID:37708026
    supporting_text: >-
      CD44 modifies proteome and membrane properties of the ER and enhances ER stress
      resistance in a manner dependent on unfolded protein response regulators without the
      requirement of HA.
  - reference_id: PMID:37708026
    supporting_text: >-
      NMR OPCs and U2OS cells also exhibited ER localization of CD44 (Figures S6D and S6E).
  - reference_id: PMID:37708026
    supporting_text: >-
      expression levels of CD44, an ECM-binding protein that has been suggested to
      contribute to NMR longevity by mediating the effect of hyaluronan (HA), are not only
      high in OPCs of long-lived species but also positively correlate with longevity in
      multiple cell types/tissues.
proposed_new_terms:
- proposed_name: positive regulation of basal ATF6-mediated signalling
  proposed_definition: >-
    Any process that increases the resting, unstressed activity of the endoplasmic reticulum
    stress sensor ATF6, raising constitutive expression of its target genes, without altering
    the magnitude of ATF6 activation induced by acute endoplasmic reticulum stress.
  justification: >-
    The published CD44 phenotype is specifically an elevation of basal ATF6 tone: CD44
    knockdown lowers constitutive ATF6 target gene expression and ER stress resistance, while
    tunicamycin-induced activation of IRE1, PERK and ATF6 and their downstream targets is
    explicitly unaffected. GO:1903893 positive regulation of ATF6-mediated unfolded protein
    response is the closest existing term and is what this review used, but it cannot
    distinguish setting a sensor's resting set-point from amplifying its stress response. The
    distinction matters because pre-emptive raising of chaperone capacity, rather than a
    stronger emergency response, is the mechanism proposed to link CD44 to mammalian
    longevity.
  proposed_parent:
    id: GO:1903893
    label: positive regulation of ATF6-mediated unfolded protein response
  supported_by:
  - reference_id: PMID:37708026
    supporting_text: >-
      Taken together, CD44 promotes basal ATF6 activity but does not affect UPR gene
      expressions once exposed to strong ER stress.
suggested_questions:
- question: >-
    Which CD44 splice forms do naked mole-rat tissues actually express? The RefSeq gene model
    selected as the reference protein is a long variant-exon-containing form, but the UniProt
    entry carries no isoform annotation and no study reports naked mole-rat CD44 splice usage.
    Does the naked mole-rat protein carry heparan sulfate on the variant region, as human
    CD44v3 does?
  experts:
  - Vera Gorbunova
  - Andrei Seluanov
  - Masaki Takasugi
- question: >-
    Is the naked mole-rat proliferative arrest driven by hyaluronan through CD44 properly
    described as contact inhibition? The hyaluronan is secreted into the medium and acts
    before confluence, and the GO contact-inhibition branch requires density information
    received by direct cell-cell contact. Should the ontology gain a term for a matrix-borne,
    secreted-signal density brake?
  experts:
  - Vera Gorbunova
  - Andrei Seluanov
- question: >-
    Does the endoplasmic reticulum function of CD44 require anything specific to the naked
    mole rat, or is the species difference purely one of expression level? Mouse and naked
    mole-rat CD44 were both effective when overexpressed in mouse oligodendrocyte
    progenitors, which suggests the latter.
  experts:
  - Masaki Takasugi
  - Vera Gorbunova
- question: >-
    Given that very-high-molecular-mass hyaluronan suppresses CD44 protein-protein
    interactions and CD44 self-association, what is the steady-state signalling state of CD44
    in naked mole-rat tissue - is the receptor held in a de-clustered, low-output
    configuration, and is that itself the protective mechanism?
  experts:
  - Masaki Takasugi
  - Vera Gorbunova
suggested_experiments:
- hypothesis: >-
    Naked mole-rat CD44 binds hyaluronan with higher affinity, or with a stronger preference
    for very-high-molecular-mass polymer, than mouse or human CD44.
  description: >-
    Express naked mole-rat, mouse and human CD44 ectodomains recombinantly and measure
    binding to size-defined hyaluronan preparations spanning oligosaccharide to more than 6
    MDa by surface plasmon resonance or biolayer interferometry. This isolates the receptor
    contribution from the whole-cell FACS comparison, which cannot distinguish CD44 from
    other surface hyaluronan-binding proteins or from the pericellular coat.
  experiment_type: biophysical binding assay
- hypothesis: >-
    Naked mole-rat CD44 mediates little or no hyaluronan internalisation, consistent with the
    slow tissue turnover of hyaluronan in this species.
  description: >-
    Incubate naked mole-rat and mouse primary fibroblasts with fluorescently labelled
    hyaluronan of defined size, and quantify surface-bound versus internalised polymer by
    flow cytometry with trypan blue quenching plus confocal colocalisation with lysosomal
    markers, with and without CD44 knockdown. This directly tests the cargo-receptor and
    hyaluronan-catabolism annotations that this review downgraded on indirect grounds.
  experiment_type: endocytosis assay
- hypothesis: >-
    The endoplasmic reticulum pool of CD44 alters ER membrane lipid composition, which is how
    it raises basal ATF6 activity.
  description: >-
    Isolate ER membranes from control and CD44-depleted naked mole-rat and human cells and
    perform quantitative lipidomics, focusing on the sterol and saturated-phospholipid
    parameters to which ATF6 is known to respond. Pair with the ATF6 Y392C lipid-unresponsive
    mutant as an internal control. This would convert the current inference from a
    mutant-based epistasis argument into a direct measurement and would supply the missing
    molecular activity for the ER function.
  experiment_type: membrane lipidomics
- hypothesis: >-
    CD44 ectodomain shedding is suppressed in naked mole-rat tissue generally, not only under
    ionomycin stimulation in skin fibroblasts.
  description: >-
    Measure soluble CD44 in naked mole-rat and mouse plasma and tissue lysates by ELISA or
    targeted mass spectrometry, and test cleavage in additional naked mole-rat cell types and
    with additional sheddases, notably MT1-MMP. This would establish whether the absence of
    the shed ectodomain is a species-wide property, which bears directly on the extracellular
    region annotation.
  experiment_type: shedding and soluble-ectodomain quantification
