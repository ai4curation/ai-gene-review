- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  review:
    summary: >-
      Root-level ARBA rule assertion that CD44 is part of some protein-containing complex.
      True of most membrane receptors and therefore uninformative.
    action: MODIFY
    reason: >-
      The essence is sound - CD44 does function within multiprotein assemblies - but the
      root term states nothing. The only specific complex supported anywhere in this
      annotation set is the macrophage migration inhibitory factor receptor complex, whose
      GO definition names CD44 explicitly, so that is the term the assertion should resolve
      to. A caution worth recording: in naked mole-rat tissue the dominant ligand actively
      opposes CD44 assembly, since very-high-molecular-mass hyaluronan suppresses CD44
      protein-protein interactions where ordinary high-mass hyaluronan promotes them.
    proposed_replacement_terms:
    - id: GO:0035692
      label: macrophage migration inhibitory factor receptor complex
    supported_by:
    - reference_id: PMID:32398747
      supporting_text: >-
        These results show that CD44 protein-protein interactions are promoted by HMM-HA but
        are suppressed by vHMM-HA.
