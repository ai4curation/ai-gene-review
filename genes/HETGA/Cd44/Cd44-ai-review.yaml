- term:
    id: GO:0004896
    label: cytokine receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: contributes_to
  review:
    summary: >-
      Reflects CD44's role as the signal-transducing component of the CD74-CD44 receptor
