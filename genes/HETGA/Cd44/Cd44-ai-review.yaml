      Title verified against PubMed; no quotation used.
- id: PMID:37006235
  title: Galectin-9 promotes natural killer cells activity via interaction with CD44.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Fetched and read for this review. It is the human source behind the signaling receptor
      activity and NK T cell activation rows. The identifier resolves to the intended paper
      and the CD44 finding is real - the galectin-9-CD44 interaction is shown in mouse and
      then confirmed in human NK cells - but the paper does not support GO:0051132. It
      studies natural killer cells throughout, and the strings NKT and natural killer T do
      not appear anywhere in the full text, whereas that term is defined for natural killer T
      cells. Marked MISCITED on that basis; the mismatch is a GOA-side question about the
      human annotation and is flagged rather than resolved here.
- id: file:HETGA/Cd44/Cd44-uniprot.txt
  title: UniProt entry A0AAX6R0R7 (Cd44, Heterocephalus glaber)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source for topology, domain boundaries and subcellular-location statements. Note that
      nearly all of its content is itself ARBA-propagated (PE 4, Predicted), so it is used
      for structural features rather than as independent functional evidence. Its CAUTION
      about lacking conserved residues comes from the Link-domain rule PROSITE-ProRule
      PRU00323 and concerns automatic disulfide-feature propagation; the sequence analysis in
      this review shows the hyaluronan-contact residues and Link disulfide cysteines are in
      fact present.
- id: file:HETGA/Cd44/Cd44-bioinformatics/RESULTS.md
  title: Naked mole-rat Cd44 isoform architecture and hyaluronan-binding site analysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis performed for this review; the script and cached sequences are in the
      Cd44-bioinformatics folder and the result is reproducible. Establishes that the
      reference protein is a variant-exon-containing gene model and that the hyaluronan
      binding residues and Link disulfides are conserved. It does not measure binding, and
      says nothing about which isoforms naked mole-rat tissues express.
- id: file:HETGA/Cd44/Cd44-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for CD44 (human ortholog P16070)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A machine-generated Affinage record for the HUMAN ortholog P16070, obtained
      deliberately as a conserved-mechanism baseline because Affinage does not run on
      non-human species. Used only for mechanism; no sentence from it is cited as evidence
      about the naked mole-rat protein and none of its mechanism_profile GO ids were
      imported. Useful for the ADAM10 shedding and glycosylation-gated binding background.
      Its most consequential omission, recorded here as a recall observation: it contains no
      trace of the CD44 endoplasmic reticulum and ATF6 proteostasis function - PMID:37708026
      is absent from its twenty citations and its localisation profile lists plasma membrane,
      nucleus and lysosome but not the ER - even though that is the only line of work in
      which naked mole-rat CD44 itself was manipulated.
