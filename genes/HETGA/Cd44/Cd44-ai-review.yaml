- id: PMID:20522558
  title: Proinflammatory cytokines induce hyaluronan synthesis and monocyte adhesion in human
    endothelial cells through hyaluronan synthase 2 (HAS2) and the nuclear factor-kappaB
    (NF-kappaB) pathway.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The human source behind the positive regulation of monocyte aggregation row. The gene
      manipulated in that system is HAS2 in endothelial cells, with CD44 acting as the
