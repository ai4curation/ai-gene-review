- term:
    id: GO:0019221
    label: cytokine-mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      GO-to-GO inference from the cytokine receptor activity row, which itself reflects
      CD44's role as the signal-transducing component of the MIF-CD74 receptor complex. The
      underlying human biology is real; there is no naked mole-rat evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Worth noting a quiet strengthening in the inference: the molecular-function row it
      derives from carries the qualifier contributes_to, because CD44 does not bind MIF -
      CD74 does - whereas this inferred process row carries involved_in, converting a
      contributory role into a participatory one. That said, CD44 is genuinely required for
      MIF-driven signalling in human cells, and its cytoplasmic tail, the part that does the
      transducing, is 97.2% identical to human, so the process claim is defensible for the
      ortholog. Kept as non-core: no naked mole-rat data, and it is a conserved immune
      signalling role rather than part of this species' hyaluronan or proteostasis biology.
    additional_reference_ids:
    - PMID:17045821
    supported_by:
    - reference_id: file:HETGA/Cd44/Cd44-bioinformatics/RESULTS.md
      supporting_text: >-
        The cytoplasmic tail is the single most conserved region (97.2% identity).
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
