id: A0AAX6R0R7
gene_symbol: Cd44
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  CD44 is the principal cell-surface receptor for hyaluronan. It is a single-pass type I
  membrane glycoprotein whose N-terminal Link module binds hyaluronan and whose short,
  highly conserved cytoplasmic tail couples ligand engagement to the ERM/NF2 (merlin)
  cytoskeletal-signalling machinery and to downstream ERK and survival signalling. The
  ectodomain is a long, heavily O-glycosylated mucin-like stem built from alternatively
  spliced variant exons; the naked mole-rat reference protein is a long,
  variant-exon-containing gene model whose Link module, hyaluronan-contact residues and
  Link-region disulfides are all conserved with human CD44, and whose cytoplasmic tail is
  the most conserved segment of the protein. Beyond the plasma membrane, CD44 also
  localises to the endoplasmic reticulum, where it associates with ER chaperones, alters
  ER membrane properties and raises basal ATF6 output, conferring resistance to ER stress
  independently of hyaluronan. In the naked mole rat these two arms converge on the
  animal's biology: fibroblasts secrete very-high-molecular-mass hyaluronan that signals
  through CD44 and NF2 to arrest proliferation well before confluence and to block
  anchorage-independent growth, while high CD44 expression in oligodendrocyte progenitors
  and other tissues tracks with maximum lifespan across mammals and supports the
  proteostatic ER-stress resistance of naked mole-rat cells. Naked mole-rat CD44 sits in
  an unusual ligand environment: the very-high-mass hyaluronan of this species suppresses,
  rather than promotes, CD44 clustering and CD44 protein-protein interactions, tissue
  hyaluronan turnover is slow, and stimulated ADAM10-dependent shedding of the CD44
  ectodomain is not observed in naked mole-rat primary skin fibroblasts.
existing_annotations:
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      CD44 is a single-pass type I membrane protein that converts extracellular hyaluronan
      engagement into intracellular signalling. In naked mole-rat cells this is
      demonstrated directly: an antibody applied to the outside of intact cells changes
      proliferation and transformation behaviour, which requires the receptor to be
      transmitting across the membrane.
    action: ACCEPT
    reason: >-
      The TreeGrafter node assertion is confirmed by naked mole-rat data rather than merely
      inherited. Blocking CD44 on intact naked mole-rat cells raises saturation density and
      permits anchorage-independent growth, and the authors trace the signal through the
      cytoplasmic partner NF2/merlin, so the transmembrane signal-transduction step is
      established for this species. The UniProt record independently supports the topology
      required by the term (single-pass type I membrane protein, TRANSMEM 609..630), and
      the cytoplasmic tail through which the signal is relayed is the most conserved
      segment of the protein (97.2% identity to human).
    supported_by:
    - reference_id: PMID:23783513
      supporting_text: >-
        To confirm that HA signaling triggers ECI via the CD44 receptor we cultured naked
        mole-rat cells in the presence of a CD44-blocking antibody. Naked mole-rat cells
        grown with CD44 antibodies reached a higher cell density (Figure 3b) indicating
        that the ECI signal from HMW-HA is in part transmitted via the CD44 receptor.
    - reference_id: PMID:23783513
      supporting_text: >-
        On the cytoplasmic face, the CD44 receptor interacts with NF2 (merlin), which
        mediates contact inhibition17.
    - reference_id: file:HETGA/Cd44/Cd44-uniprot.txt
      supporting_text: "TRANSMEM        609..630"
    - reference_id: file:HETGA/Cd44/Cd44-bioinformatics/RESULTS.md
      supporting_text: >-
        The cytoplasmic tail is the single most conserved region (97.2% identity).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000027508
        source_label: CD44 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node-level receptor assertion, independently confirmed in the target species by
          antibody blockade on intact naked mole-rat cells.
- term:
    id: GO:0005540
    label: hyaluronic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The core molecular function. Hyaluronan binding is carried by the N-terminal Link
      module, and both the sequence evidence and the naked mole-rat functional evidence
      support it in this species.
    action: ACCEPT
    reason: >-
      Grounded in naked mole rat rather than accepted on the strength of the projection
      alone. Functionally, a CD44-blocking antibody applied to intact naked mole-rat cells
      abolishes the hyaluronan-driven growth arrest, and the authors conclude the pathway
      runs through HA/CD44/NF2; a whole-cell FACS assay shows naked mole-rat cells bind
      fluorescent hyaluronan about twice as avidly as mouse or human cells (that assay
      measures the whole cell surface, not CD44 specifically, so it is corroborating rather
      than decisive). Structurally, all four hyaluronan-contact residues annotated on human
      CD44 have direct counterparts in the naked mole-rat sequence (R41 to R43, R78 to R80,
      Y79 to Y81, Y105 to Y107), all six cysteines of the three Link-region disulfides are
      present, and the Link domain is 92.1% identical to human. The UniProt CAUTION about
      lacking conserved residues required for feature-annotation propagation comes from the
      Link-domain rule PROSITE-ProRule PRU00323 and concerns that rule's automatic DISULFID
      transfer; it is not a finding that the hyaluronan-binding site is degenerate.
    supported_by:
    - reference_id: PMID:23783513
      supporting_text: >-
        Collectively these results establish that ECI is controlled by the HA/CD44/NF2
        pathway.
    - reference_id: PMID:23783513
      supporting_text: >-
        Naked mole-rat cells displayed a two-fold higher affinity to HA than mouse or human
        cells (Figure 3d), which can contribute to higher sensitivity of naked mole rat
        cells to HA signaling.
    - reference_id: file:HETGA/Cd44/Cd44-uniprot.txt
      supporting_text: "AltName: Full=Hyaluronate receptor"
    - reference_id: file:HETGA/Cd44/Cd44-bioinformatics/RESULTS.md
      supporting_text: >-
        All four UniProt-annotated hyaluronan-contact residues of human CD44 and all six
        cysteines forming the three Link-region disulfides have direct counterparts in the
        NMR sequence
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P16070
        source_label: human CD44
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human IDA evidence for hyaluronan binding; the binding residues transfer
          one-to-one to the naked mole-rat sequence.
      - source_id: InterPro:IPR000538
        source_label: Link domain
        source_status: SUPPORTS_TRANSFER
        comment: Link module present at residues 34-122 and 92.1% identical to human.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Derived from the ARBA-propagated UniProt "Secreted" subcellular-location keyword. For
      a type I membrane protein this location can only mean the shed soluble ectodomain,
      and shedding is exactly the step that is absent in naked mole-rat fibroblasts.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The keyword is an ARBA family-level propagation, not an observation on this protein.
      The single direct test of naked mole-rat CD44 ectodomain release found none: ionomycin
      induced ADAM10-dependent cleavage of CD44 in mouse primary skin fibroblasts but not in
      naked mole-rat primary skin fibroblasts. This is a genuine species difference and is
      why the term is downgraded rather than accepted. It is not grounds for REMOVE, because
      the cause is upstream of CD44 (a phosphatidylserine externalisation deficit) and is
      rescued by restoring scrambling, so the protein remains a competent substrate; and
      because only one cell type, one stimulus and one sheddase were tested.
    supported_by:
    - reference_id: PMID:36790936
      supporting_text: >-
        we observed an absence of ADAM10 mediated CD44 cleavage, as well as shedding of
        exogenous and overexpressed betacellulin in NPSF, whereas in mouse primary skin
        fibroblasts ionomycin induced ADAM10-dependent cleavage of both CD44 and
        betacellulin.
    - reference_id: PMID:36790936
      supporting_text: >-
        increased phosphatidylserine (PS) externalization, which rescued the ADAM10
        sheddase activity and promoted cell migration in NPSF in an ADAM10-dependent
        manner.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0243
        source_label: Secreted
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          ARBA-propagated keyword (ARBA00004613/ARBA00022525) with no observation on the
          naked mole-rat protein.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      The primary site of action. CD44 is a single-pass type I plasma membrane protein and
      naked mole-rat CD44 is demonstrably accessible to an antibody applied to intact
      cells.
    action: ACCEPT
    reason: >-
      Supported by three independent strands: the UniProt subcellular-location statement for
      this entry, the transmembrane helix in its own feature table, and the functional
      requirement that a cell-impermeant blocking antibody reach the receptor on living
      naked mole-rat cells. Note that the plasma membrane is not the only compartment in
      which CD44 acts - a substantial ER pool exists and is captured in a separate proposed
      annotation - but it is the location at which the hyaluronan-receptor function is
      exercised.
    supported_by:
    - reference_id: file:HETGA/Cd44/Cd44-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cell membrane"
    - reference_id: PMID:23783513
      supporting_text: >-
        Similarly, naked mole rat cells cultured in the presence of CD44 blocking antibody
        formed colonies in soft agar (Supplementary Figure 6).
    propagation_review:
      root_cause: NO_FAILURE_CORE
