- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Ancestral-node assertion reflecting CD44's well-established role in leukocyte
      trafficking and inflammation in mouse and human. There is no naked mole-rat evidence
      bearing on it.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phylogenetic placement is sound and CD44's inflammatory role is deeply conserved,
      so there is no positive argument for removal. But naked mole-rat immunology is
      atypical - their immune cell populations lack natural killer cells and they are not
      broadly disease-resistant - and none of the naked mole-rat CD44 literature addresses
      inflammation. Kept as a conserved, non-core process claim.
    supported_by:
    - reference_id: PMID:34476892
      supporting_text: >-
        These findings are further supported by studies that their immune cell populations
        lack natural killer cells, the cells responsible for immune surveillance and
        eradication of virally infected cells (Hilton et al., 2019).
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000027508
        source_label: CD44 ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Conserved family process; no naked mole-rat evidence, and the species has an
          unusual lymphoid compartment.
- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      CD44 is the canonical hyaluronan adhesion receptor, tethering cells to the hyaluronan
      of the pericellular matrix. This is the process counterpart of the accepted
      hyaluronic-acid-binding molecular function.
    action: ACCEPT
    reason: >-
      Supported convergently by the Link domain, the ARBA/UniProt keyword, the ancestral
      node and the human ortholog, and by the naked mole-rat observation that these cells
      bind hyaluronan about twice as avidly as mouse or human cells and that a CD44 blockade
      abolishes the resulting signal. The term is broad, but the more specific alternatives
      in this branch make claims about cell-cell versus cell-matrix adhesion that the naked
      mole-rat data do not distinguish, so the general term is the honest level here.
    supported_by:
    - reference_id: PMID:31036852
      supporting_text: >-
        The main HA receptor is CD44, a cell surface adhesion receptor that binds a range of
        ligands and is itself associated with metastasis12.
    - reference_id: PMID:23783513
      supporting_text: >-
        Naked mole-rat cells displayed a two-fold higher affinity to HA than mouse or human
        cells (Figure 3d), which can contribute to higher sensitivity of naked mole rat
        cells to HA signaling.
    propagation_review:
