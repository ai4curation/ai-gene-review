- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      A pure GO-to-GO logical inference with no organism evidence: the row exists only
      because CD44 was annotated to cargo receptor activity. It lands at the top of the
      transport hierarchy and inherits the weakness of its parent.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Two problems compound. First, the inference chains off GO:0038024 cargo receptor
      activity, which this review marks over-annotated for the naked mole rat because the
      hyaluronan-uptake-and-turnover arm of CD44 biology is precisely what this species has
      dialled down: hyaluronidase activity in naked mole-rat cells is much lower than in
      human, mouse or guinea pig, and the tissue phenotype is hyaluronan accumulation.
      Second, even taken at face value the resulting term is a root-level transport grouping
      that conveys nothing specific about CD44. Not removed, because CD44-mediated
      hyaluronan endocytosis is real in other mammals and has simply never been assayed in
      naked mole-rat cells.
    supported_by:
    - reference_id: PMID:23783513
      supporting_text: >-
        HAase activity of the naked mole-rat cells was much lower than that of human, mouse
        or guinea pig cells (Figure 2c).
    - reference_id: PMID:39009271
      supporting_text: >-
        Naked mole-rats (NMRs) accumulate abundant high-molecular weight hyaluronan (HA) in
        their tissues, suggesting decreased HA degradation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: GO:0038024
        source_label: cargo receptor activity
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The only source is another annotation on the same protein; the inference adds no
          independent evidence and the parent row is itself downgraded here.
