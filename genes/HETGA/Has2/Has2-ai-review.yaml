- term:
    id: GO:1903561
    label: extracellular vesicle
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Curator-reviewed ISS transfer from human HAS2 (UniProtKB:Q92819): HAS2 protein leaves
