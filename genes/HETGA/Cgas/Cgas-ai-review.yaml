- id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
  title: 'Naked mole-rat cGAS (A0AAX6RS70): conservation of catalytic and chromatin-binding residues'
  findings:
  - statement: The catalytic triad, zinc-coordinating residues and nucleosome anchor are retained.
      Most nucleotide contacts are conserved, with a documented human T211-to-target A243 substitution;
      there is no pseudoenzyme signature.
    supporting_text: Every catalytically important residue that UniProt annotates on human cGAS is
      present and identical in the naked mole-rat protein
  - statement: The four residues that differ and reverse the HR phenotype lie in the C-terminal regulatory
      domain, well away from the active site.
    supporting_text: All four positions fall inside the C-terminal Mab-21-like HhH/H2TH-like domain
      that UniProt annotates at 437-541 on A0AAX6RS70.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Own reproducible analysis written for this review (align_cgas.py, biopython global
      alignment against Q8N884 and Q8C6L5 with UniProt feature transfer). It answers the question
      the abstracts leave open — whether the catalytic machinery survives in this species — and independently
      resolves the numbering frame of the four divergent residues. Every quotation used as supporting_text
      was grep-verified against the file, since file: quotes are not checked by CI. Its stated limits
      are respected in the review: it establishes capability, not measured activity.'
- id: file:HETGA/Cgas/Cgas-deep-research-falcon.md
  title: 'Functional Annotation Report: *Heterocephalus glaber Mb21d1* / cGAS'
  findings:
  - statement: The nuclear, nucleosome-tethered pool is the dominant resting pool of mammalian cGAS,
      not a minor one.
    supporting_text: A 2024 authoritative review reports that nuclear cGAS can constitute approximately
      **85–95%** of total cGAS in some cell types.
  - statement: 'Nucleosome tethering actively restrains cGAS: it occludes the DNA-binding and oligomerization
      surfaces, and breaking the tether at the arginine anchor causes massive constitutive cGAMP
      production.'
    supporting_text: mouse R241E generated about **300-fold** more basal cGAMP than wild type, and
      human R255E generated over **100-fold** more
  - statement: The report's own literature search returned no naked-mole-rat-specific functional
      study of this protein — a conclusion contradicted by PMID:41066557, which the search missed.
    supporting_text: There is no verified naked-mole-rat kinetic constant, catalytic rate, DNA-length
      response curve, product measurement, structure, tissue-expression map, or subcellular localization
      for this accession.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: The report supplies mammalian DNA sensing, cGAMP-STING signaling and nucleosome
      restraint, but missed the direct naked-mole-rat HR study PMID:41066557. Its human/mouse sequestration
      model does not demonstrate loss of naked-mole-rat immune signaling. Use conserved mechanism
      with this recall limitation; do not use lack of retrieved species assays to refute inherited
      function.
