- id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
  title: 'Naked mole-rat cGAS (A0AAX6RS70): conservation of catalytic and chromatin-binding residues'
  findings:
  - statement: >-
      Every UniProt-annotated catalytic, metal-binding, nucleotide-binding and
      nucleosome-anchoring residue of human cGAS is conserved in the naked-mole-rat protein;
      there is no pseudoenzyme signature.
    supporting_text: >-
      Every catalytically important residue that UniProt annotates on human cGAS is present
      and identical in the naked mole-rat protein
  - statement: >-
      The four residues that differ and reverse the HR phenotype lie in the C-terminal
      regulatory domain, well away from the active site.
    supporting_text: >-
      All four positions fall inside the C-terminal Mab-21-like HhH/H2TH-like domain that
      UniProt annotates at 437-541 on A0AAX6RS70.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Own reproducible analysis written for this review (align_cgas.py, biopython global
      alignment against Q8N884 and Q8C6L5 with UniProt feature transfer). It answers the
      question the abstracts leave open — whether the catalytic machinery survives in this
      species — and independently resolves the numbering frame of the four divergent
      residues. Every quotation used as supporting_text was grep-verified against the file,
      since file: quotes are not checked by CI. Its stated limits are respected in the
      review: it establishes capability, not measured activity.
- id: file:HETGA/Cgas/Cgas-deep-research-falcon.md
  title: 'Functional Annotation Report: *Heterocephalus glaber Mb21d1* / cGAS'
  findings:
  - statement: >-
      The nuclear, nucleosome-tethered pool is the dominant resting pool of mammalian cGAS,
      not a minor one.
    supporting_text: >-
      A 2024 authoritative review reports that nuclear cGAS can constitute approximately
      **85–95%** of total cGAS in some cell types.
  - statement: >-
      Nucleosome tethering actively restrains cGAS: it occludes the DNA-binding and
      oligomerization surfaces, and breaking the tether at the arginine anchor causes massive
      constitutive cGAMP production.
    supporting_text: >-
      mouse R241E generated about **300-fold** more basal cGAMP than wild type, and human
      R255E generated over **100-fold** more
  - statement: >-
      The report's own literature search returned no naked-mole-rat-specific functional study
      of this protein — a conclusion contradicted by PMID:41066557, which the search missed.
    supporting_text: >-
      There is no verified naked-mole-rat kinetic constant, catalytic rate, DNA-length
      response curve, product measurement, structure, tissue-expression map, or subcellular
      localization for this accession.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Thorough and unusually well-disciplined on the conserved mammalian mechanism, and it
      contributes something the other sources do not: quantitative grounding for the claim
      that chromatin-tethered cGAS is the restrained pool (85-95% of total cGAS is nuclear;
      human R255E, the arginine anchor conserved as R287 here, produces over 100-fold more
      basal cGAMP). That is what makes the caveat on the innate-immune arm concrete rather
      than speculative. Marked LOW_QUALITY for a specific and consequential recall failure
      rather than for any incorrect statement: the report concludes that no naked-mole-rat
      functional study of this protein exists, when PMID:41066557 (Science 2025) is exactly
      such a study, is cached in this repository, and reverses the sign of one propagated
      annotation. Every species-specific conclusion in the report is therefore stated with
      the wrong evidence base, and following it alone would have produced a review with no
      REMOVE and no NEW. Its citations are Edison-internal keys rather than PMIDs, so nothing
      from it is used to support a term the primary literature does not already carry.
- id: file:HETGA/Cgas/Cgas-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for CGAS (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched affinage record for the HUMAN ortholog CGAS (Q8N884), used only as a
      conserved-mechanism baseline because affinage does not run on non-human species. It is
      accurate and well cited on the human protein, and it supplies the human half of the
      central comparison, including nuclear cGAS suppressing HR via PARP1 (PMID:30356214)
      and the nucleosome acidic-patch structures (PMID:32911482, PMID:32913000). It contains
      no naked-mole-rat content whatsoever, and so could not surface the sign reversal that
      drives the one REMOVE in this review; on its own it would have led to accepting
      GO:2000042. Its mechanism_profile GO ids were deliberately not imported (they collapse
      to coarse parents such as GO:0016740 and GO:0003677), and no sentence from it is used
      as supporting_text.
existing_annotations:
- term:
    id: GO:0002218
    label: activation of innate immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Family-defining innate-immune role, propagated from a well-grounded Euteleostomi node,
      but never tested in the naked mole-rat.
    action: UNDECIDED
    reason: >-
      The node assertion is sound: PTN002579681 sits at taxon:117571 (Euteleostomi) and is
      seeded by mouse Cgas and human CGAS, both experimentally annotated, and the naked mole
      rat is squarely inside that clade. The molecular prerequisite is also intact — the
      catalytic triad, zinc thumb and nucleotide contacts are fully conserved in
      A0AAX6RS70. What is missing is any naked-mole-rat measurement: no cached publication
      reports DNA sensing, cGAMP production, STING engagement or an innate-immune output in
      this species, and the one primary paper is silent on the immune arm. There is also a
      species-specific reason not to wave it through. The naked-mole-rat adaptation is
      longer retention of cGAS on chromatin, and in human and mouse the chromatin- and
      nucleosome-bound pool is the catalytically restrained one — nucleosome tethering
      occludes the DNA-binding and oligomerization surfaces, and breaking that tether at the
      arginine anchor releases over 100-fold more basal cGAMP. Since that anchor is itself
      conserved in the naked-mole-rat protein (R287), a variant biased toward chromatin
      residence could in principle leave a smaller free pool available for cytosolic
      sensing. That is a hypothesis rather than a finding, and it is not grounds for
      REMOVE — which would require a positive argument this review does not have — but it is
      why UNDECIDED is the honest call rather than ACCEPT.
    supported_by:
    - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
      supporting_text: >-
        it does not demonstrate that the naked mole-rat enzyme actually produces cGAMP, and
        no naked mole-rat biochemical assay of cGAMP synthesis was found in the cached
        literature
    - reference_id: file:HETGA/Cgas/Cgas-deep-research-falcon.md
      supporting_text: >-
        Nuclear localization does not normally produce constitutive signaling because
        nucleosome tethering sequesters key cGAS DNA-binding and oligomerization surfaces.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002579681
        source_label: Euteleostomi cGAS node (PTHR10656)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          IBD at taxon:117571 seeded by MGI:MGI:2442261 and UniProtKB:Q8N884; node placement
          is not disputed.
      - source_id: UniProtKB:Q8N884
        source_label: human CGAS
        source_status: SUPPORTS_TRANSFER
      - source_id: MGI:MGI:2442261
