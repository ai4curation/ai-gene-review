- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Directly and positively confirmed in the naked mole-rat: chromatin binding is the very
      activity the species-specific adaptation acts on.
    action: ACCEPT
    reason: >-
      This is the one molecular function for which there is explicit naked-mole-rat
      evidence. The primary study reports that the four species-specific substitutions make
      cGAS retain chromatin longer after DNA damage, and refers to the resulting state as
      prolonged chromatin binding. The structural basis is also intact: the arginine anchor
      by which cGAS docks onto the nucleosome acidic patch (human R255) is conserved as R287
      in A0AAX6RS70. Rather than being weakened by the naked-mole-rat divergence, chromatin
      binding is enhanced by it, so this term is not merely retained but is core.
    supported_by:
    - reference_id: PMID:41066557
      supporting_text: >-
        The changes enable cGAS to retain chromatin longer upon DNA damage by weakening
        TRIM41-mediated ubiquitination and interaction with the segregase P97.
    - reference_id: PMID:41066557
      supporting_text: >-
        Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
        FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
        homologous recombination repair.
    - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
      supporting_text: "| nucleosome acidic-patch arginine anchor | R255 | R241 | **R287** | yes |"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002579681
        source_label: Euteleostomi cGAS node (PTHR10656)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node assertion independently confirmed in the target species by PMID:41066557,
          which is the strongest possible outcome for a propagated term.
      residue_claims:
      - claim_type: RETAINED
        role: nucleosome acidic-patch arginine anchor
        method: MSA
        comment: >-
          Human R255 is the arginine that docks cGAS onto the nucleosome acidic patch. Its
          retention in the naked-mole-rat protein is consistent with the reported chromatin
          retention, and refutes any suggestion that chromatin binding was lost in this
          lineage. It carries a second implication worth recording: R255E in human releases
          over 100-fold more basal cGAMP, so this residue is also the switch that keeps
          chromatin-bound cGAS catalytically restrained, and its conservation means the
          naked-mole-rat protein retains that restraint while spending longer in the
          restrained state. Correspondence from an ad hoc global alignment
          (Cgas-bioinformatics/align_cgas.py), so no shared alignment release is pinned.
        anchor:
          accession: UniProtKB:Q8N884
          position: 255
          residue: R
          sequence_version: 2
        target:
          accession: UniProtKB:A0AAX6RS70
          position: 287
          residue: R
          sequence_version: 1
- term:
    id: GO:0003690
    label: double-stranded DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The dsDNA-reading apparatus, including the zinc thumb, is fully conserved in the naked
      mole-rat protein.
    action: ACCEPT
    reason: cGAS reads B-form double-stranded DNA through a zinc thumb and a set of basic DNA-binding
      surfaces. Residue transfer from human cGAS shows the zinc thumb intact (H390/C396/C397/C404 to
      H422/C428/C429/C436) and the C-terminal DNA-binding region 384-407 at 62.5% identity, i.e. ordinary
      orthologue-level conservation with no disruption. The only substitutions among human single-residue
      annotations that touch DNA are K187 and L195, which UniProt annotates as tuning preference for
      curved long DNA and which lie in the fast-evolving disordered N-terminal arm; those affect substrate
      preference at most, not the capacity to bind dsDNA. The native chromatin phenotype is compatible
      with a DNA-binding protein but, by itself, does not distinguish contacts with DNA from contacts
      with histones. Nothing about the species-specific C-terminal divergence bears on this.
    supported_by:
