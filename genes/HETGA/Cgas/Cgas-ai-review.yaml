      The canonical cGAS-STING output, propagated from human and mouse; not measured in the
      naked mole-rat, and the species-specific adaptation gives a concrete reason to check
      rather than assume.
    action: UNDECIDED
    reason: >-
      Accepting this requires that the naked-mole-rat enzyme make cGAMP, that STING respond
      to it, and that interferon genes be induced. The first is plausible on sequence
      grounds — the catalytic triad and nucleotide contacts are conserved — but has never
      been assayed in this species, and the second and third have not been examined at all.
      The abstracts of all four cGAS publications are silent on interferon. Additionally,
      the adaptation described in this species increases the fraction of cGAS residing on
      chromatin, which in human and mouse is the restrained pool and already accounts for
      the large majority of cellular cGAS, so the direction of any effect on interferon
      output is genuinely open. This is not an argument that the term is wrong, and no
      REMOVE is proposed; it is an argument that it is unverified in a species where the
      protein is known to have diverged.
    supported_by:
