          C-terminal regulatory position; one of the four residues reported to distinguish
          naked-mole-rat from human and mouse cGAS in homologous recombination repair
        method: MSA
        comment: >-
          The abstract states that four amino acids changed but does not name them; secondary
          coverage names S463D, E511K, Y527L, T530K without stating the numbering frame. The
          frame was resolved here from sequence: read in naked-mole-rat numbering the
          wild-type residues are exactly S463, E511, Y527 and T530, and the aligned human
