    label: GTP
  supported_by:
  - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
    supporting_text: Every catalytically important residue that UniProt annotates on human cGAS is
      present and identical in the naked mole-rat protein
  - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
    supporting_text: The divergence that reverses the HR phenotype sits in a C-terminal regulatory
      surface, not in the active site.
  - reference_id: PMID:23258413
    supporting_text: Overexpression of cGAS activated the transcription factor IRF3 and induced interferon-β
      in a STING-dependent manner.
  knowledge_gaps:
  - gap_statement: The quantitative DNA-dose response, cGAMP production and interferon output of
      naked-mole-rat cGAS remain unmeasured in the inspected evidence.
    boundary: 'Firmly established: the catalytic Mg(2+) triad, the zinc thumb and the ATP, GTP and
      cGAMP contacts are all present and identical to human cGAS, so there is no pseudoenzyme signature,
      and the four residues that diverge in this species lie outside the active site.'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: These measurements would test the strength and regulation of a well-supported conserved
