- term:
    id: GO:2000042
    label: negative regulation of double-strand break repair via homologous recombination
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Contradicted in this species. Naked-mole-rat cGAS does not suppress homologous
      recombination; it promotes it. This is a sign inversion, not a refinement.
    action: REMOVE
    reason: >-
      This is the one propagated term with direct, species-specific evidence against it. The
      primary study states that naked-mole-rat cGAS lacks the suppressive function that the
      human and mouse orthologs have in homologous recombination repair, and attributes the
      difference to four amino acids fixed during evolution. The replacement activity runs
      in the opposite direction: prolonged chromatin retention strengthens the FANCI-RAD50
      interaction and promotes RAD50 recruitment to damage sites, potentiating homologous
      recombination.

      The propagation is not defective at its source. PTN002579681 sits at taxon:117571
      (Euteleostomi) and its seeds — mouse Cgas and human CGAS — genuinely do suppress
      homologous recombination, so the PAINT curator encoded a real and well-supported
      property of the species that had been examined. What fails is the assumption that the
      property is conserved across the whole clade. The naked mole rat is inside that clade
      and does the opposite, which is exactly the target-specific evidence of functional
      divergence needed to challenge a node placement — as distinct from an objection based
      on how many donors seeded it.

      Retaining a negative-regulation term alongside the positive one would assert both
      directions at once, so this row is removed rather than modified, and the correct
      activity is asserted separately as GO:1905168.
    proposed_replacement_terms:
    - id: GO:1905168
      label: positive regulation of double-strand break repair via homologous recombination
    supported_by:
    - reference_id: PMID:41066557
      supporting_text: >-
        naked mole-rat cyclic guanosine monophosphate-adenosine monophosphate synthase (cGAS)
        lacks the suppressive function of human or mouse homologs in homologous recombination
        repair through the alteration of four amino acids during evolution
    - reference_id: PMID:41066557
      supporting_text: >-
        Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
        FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
        homologous recombination repair.
    - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
      supporting_text: >-
        All four positions fall inside the C-terminal Mab-21-like HhH/H2TH-like domain that
        UniProt annotates at 437-541 on A0AAX6RS70.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002579681
        source_label: Euteleostomi cGAS node (PTHR10656)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The IBD is correct for the clade members that were tested; it is the extension to
          the naked mole rat that fails, because this lineage inverted the sign of the
          regulation.
      - source_id: UniProtKB:Q8N884
        source_label: human CGAS
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Nuclear human cGAS genuinely suppresses homologous recombination; PMID:41066557
          uses it as the explicit contrast to the naked-mole-rat protein.
      - source_id: MGI:MGI:2442261
        source_label: mouse Cgas
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Same as human; named as a contrasting ortholog in the primary study.
      residue_claims:
      - claim_type: SUBSTITUTED
        role: >-
          C-terminal regulatory position; one of the four residues reported to distinguish
          naked-mole-rat from human and mouse cGAS in homologous recombination repair
        method: MSA
        comment: >-
          The abstract states that four amino acids changed but does not name them; secondary
          coverage names S463D, E511K, Y527L, T530K without stating the numbering frame. The
          frame was resolved here from sequence: read in naked-mole-rat numbering the
          wild-type residues are exactly S463, E511, Y527 and T530, and the aligned human
          residues are D431, K479, L495 and K498, so the reported series is a humanising one.
          E511 is recorded as the representative position. The residue identities and the
          correspondence are verified; the functional attribution to these specific positions
          rests on the secondary summary and is therefore corroborated rather than proven.
          Correspondence from an ad hoc global alignment
          (Cgas-bioinformatics/align_cgas.py), so no alignment release is pinned.
        anchor:
          accession: UniProtKB:Q8N884
          position: 479
          residue: K
          sequence_version: 2
        target:
          accession: UniProtKB:A0AAX6RS70
          position: 511
          residue: E
          sequence_version: 1
- term:
    id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:41066557
  qualifier: involved_in
  review:
    summary: >-
      Proposed replacement for GO:2000042. Naked-mole-rat cGAS potentiates homologous
      recombination repair through prolonged chromatin retention and promotion of RAD50
      recruitment.
    action: NEW
    reason: >-
      The primary study reports a positive, mechanistically specified role for cGAS in
      homologous recombination in this species: prolonged chromatin binding strengthens the
      FANCI-RAD50 interaction and facilitates RAD50 recruitment to damage sites, thereby
      potentiating homologous recombination repair. The conclusion is drawn from an
      engineered four-residue substitution series that shifts the naked-mole-rat protein
      toward the human and mouse behaviour, which is why IMP is the appropriate evidence
      code.

      GO:1905168 was chosen deliberately over the two neighbouring options. The gene product
      is not itself performing recombination, so GO:0000724 double-strand break repair via
      homologous recombination would overstate the role; and the effect is specific to the
      homologous-recombination pathway rather than to repair in general, so the broader
      GO:2000781 positive regulation of double-strand break repair would understate it. The
      identifier was confirmed against QuickGO rather than written from memory.

      No accompanying ageing or lifespan term is proposed. The abstract does support an
      anti-ageing role, but reduced senescence and extended lifespan here are indirect,
      downstream consequences of improved repair, and NEW is explicitly not for indirect or
      pleiotropic effects.
    supported_by:
    - reference_id: PMID:41066557
      supporting_text: >-
        Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
        FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
        homologous recombination repair.
    - reference_id: PMID:41066557
      supporting_text: >-
        naked mole-rat cyclic guanosine monophosphate-adenosine monophosphate synthase (cGAS)
        lacks the suppressive function of human or mouse homologs in homologous recombination
        repair through the alteration of four amino acids during evolution
core_functions:
- description: Chromatin-associated promotion of homologous recombination repair. After DNA damage,
    cGAS binds chromatin in the nucleus and, because naked-mole-rat-specific changes in its C-terminal
    domain weaken TRIM41-mediated ubiquitination and p97-driven extraction, it remains there longer
    than the human or mouse protein. The retained protein strengthens the FANCI-RAD50 interaction
    and promotes RAD50 recruitment to double-strand breaks, potentiating homologous recombination.
    This is the species-specific core function and it is the opposite in sign to the repair-suppressive
    role of the human and mouse orthologs.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  directly_involved_in:
  - id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0035861
    label: site of double-strand break
  supported_by:
  - reference_id: PMID:41066557
    supporting_text: Prolonged chromatin binding of cGAS enhanced the interaction between repair
      factors FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
      homologous recombination repair.
  - reference_id: PMID:41066557
    supporting_text: The changes enable cGAS to retain chromatin longer upon DNA damage by weakening
      TRIM41-mediated ubiquitination and interaction with the segregase P97.
  knowledge_gaps:
  - gap_statement: 'The molecular step by which chromatin-retained cGAS strengthens the FANCI-RAD50
      interaction is undetermined: it is not known whether cGAS contacts FANCI or RAD50 directly,
      acts as a chromatin-tethered scaffold that raises their local concentration, or works through
      a further unidentified intermediary.'
    boundary: 'Firmly established: the four C-terminal residues prolong chromatin retention by weakening
      TRIM41-mediated ubiquitination and p97 engagement, and prolonged retention increases the FANCI-RAD50
      interaction and RAD50 recruitment to damage sites, thereby potentiating homologous recombination.'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: This is the mechanistic hinge of the only known case in which cGAS promotes rather
      than suppresses homologous recombination, and it determines whether the activity is a catalysis-independent
      scaffolding role or a signalling one.
    resolution: Direct interaction mapping between cGAS, FANCI and RAD50 in naked-mole-rat cells,
      combined with a homologous recombination reporter assay comparing wild-type cGAS, a catalytically
      dead mutant and the humanising four-residue variant.
    provenance:
    - reference_id: PMID:41066557
      supporting_text: Prolonged chromatin binding of cGAS enhanced the interaction between repair
        factors FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
        homologous recombination repair.
- description: DNA-activated synthesis of 2′3′-cGAMP supports the conserved cGAS-STING innate immune
    signaling pathway. A0AAX6RS70 retains the catalytic and DNA-binding machinery; this pathway role
    is inferred from orthology and mammalian mechanism, while species-specific signaling output remains
    unmeasured.
  molecular_function:
    id: GO:0061501
    label: 2',3'-cyclic GMP-AMP synthase activity
  locations:
  - id: GO:0005829
    label: cytosol
  substrates:
