      DNA are K187 and L195, which UniProt annotates as tuning preference for curved long
      DNA and which lie in the fast-evolving disordered N-terminal arm; those affect
      substrate preference at most, not the capacity to bind dsDNA. The naked-mole-rat
      protein also demonstrably engages chromatin in vivo, which requires nucleosomal DNA
      binding. Nothing about the species-specific C-terminal divergence bears on this.
    supported_by:
