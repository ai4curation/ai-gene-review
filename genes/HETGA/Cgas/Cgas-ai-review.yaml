taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: 'Naked-mole-rat cGAS is a DNA-binding nucleotidyltransferase with conserved machinery
  for synthesizing the second messenger 2′3′-cGAMP from ATP and GTP. The mammalian cGAMP-STING innate
  immune pathway is inferred to be retained. In the nucleus, naked-mole-rat cGAS promotes homologous
  recombination repair: species-specific C-terminal changes weaken TRIM41-mediated ubiquitination
  and p97 engagement, prolong chromatin retention after DNA damage, and enhance FANCI-RAD50 association
  and RAD50 recruitment. This repair-promoting behavior differs from the suppressive effect of human
  and mouse cGAS. The magnitude and regulation of cGAMP and interferon output have not been measured
  for this species in the inspected evidence.'
references:
- id: PMID:41066557
  title: A cGAS-mediated mechanism in naked mole-rats potentiates DNA repair and delays aging.
  findings:
  - statement: Naked mole-rat cGAS has lost the homologous-recombination-suppressing activity of
      its human and mouse orthologs, through four amino acid changes fixed during evolution.
    supporting_text: naked mole-rat cyclic guanosine monophosphate-adenosine monophosphate synthase
      (cGAS) lacks the suppressive function of human or mouse homologs in homologous recombination
      repair through the alteration of four amino acids during evolution
  - statement: The mechanism is prolonged chromatin retention after DNA damage, caused by weakened
      TRIM41-mediated ubiquitination and weakened p97 engagement.
    supporting_text: The changes enable cGAS to retain chromatin longer upon DNA damage by weakening
      TRIM41-mediated ubiquitination and interaction with the segregase P97.
  - statement: Chromatin-retained cGAS promotes the FANCI-RAD50 interaction and RAD50 recruitment
      to damage sites, potentiating homologous recombination repair.
    supporting_text: Prolonged chromatin binding of cGAS enhanced the interaction between repair
      factors FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
      homologous recombination repair.
  - statement: The same four residues mediate an anti-ageing and lifespan-extending function.
    supporting_text: Moreover, the four amino acids mediate the function of cGAS in antagonizing
      cellular and tissue aging and extending life span.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The single primary source for every species-specific claim in this review, and
      the only evidence that contradicts a propagated annotation. PubMed-verified (Science 2025;
      390:eadp5056; doi 10.1126/science.adp5056). Cached abstract-only, so all quotes are taken from
      the abstract and no assay detail, cell type or residue-level mechanism is asserted beyond what
      the abstract states.
- id: PMID:41066590
  title: Longevity steps on the cGAS.
  findings:
  - statement: Science commentary on the primary study, framing the naked-mole-rat cGAS DNA-repair
      activity as a candidate longevity mechanism and still describing cGAS as a cytosolic sensor.
    supporting_text: A DNA repair function in a cytosolic sensor demonstrates a potential role in
      naked mole-rat longevity.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Perspective piece accompanying PMID:41066557 in the same issue; it corroborates
      the framing but contains no independent data, and is treated as commentary rather than evidence.
      No annotation action rests on it.
