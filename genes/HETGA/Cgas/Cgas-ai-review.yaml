- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Canonical cGAS compartment, propagated from a well-grounded node with nothing in the
      naked-mole-rat data arguing against a cytosolic pool.
    action: ACCEPT
    reason: >-
      Cytosolic localization is the best-established property of cGAS in mammals, and the
      Euteleostomi node carries it on experimental grounding from both human CGAS and mouse
      Cgas. Nothing in the naked-mole-rat work excludes a cytosolic pool: what changes in
      this species is how long the protein stays on chromatin once damage occurs, which
      shifts the balance between compartments rather than abolishing one of them. The
      commentary on the primary paper likewise still describes the protein as a cytosolic
      sensor. A localization claim is a weaker assertion than the functional output that
      normally accompanies it, and it survives here even though that output is left
      UNDECIDED — the caveat about the size of the cytosolic pool belongs on the DNA-sensing
      process terms, not on the existence of the compartment.
    supported_by:
    - reference_id: PMID:41066590
      supporting_text: >-
        A DNA repair function in a cytosolic sensor demonstrates a potential role in naked
        mole-rat longevity.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002579681
        source_label: Euteleostomi cGAS node (PTHR10656)
        source_status: SUPPORTS_TRANSFER
