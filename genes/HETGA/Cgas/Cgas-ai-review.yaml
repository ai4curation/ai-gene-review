taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  Cyclic GMP-AMP synthase (cGAS, encoded by the gene UniProt still lists under the older
  symbol Mb21d1) is the naked mole-rat member of the mab-21 nucleotidyltransferase family.
  The 554-residue protein has the canonical two-lobed architecture: a long basic, disordered
  N-terminal arm, a Mab-21-like nucleotidyltransferase domain (residues 246-420) and a
  C-terminal Mab-21-like HhH/H2TH-like domain (437-541). All of the machinery that defines
  the family is present and unchanged relative to human and mouse cGAS — the catalytic
  Mg(2+)-coordinating triad (E257/D259/D351), the zinc thumb that reads B-form
  double-stranded DNA (H422/C428/C429/C436), the ATP/GTP and cGAMP contacts, and the
  arginine anchor (R287) through which cGAS docks onto the nucleosome acidic patch. In
  mammals generally, cGAS bound to cytosolic double-stranded DNA condenses ATP and GTP into
  the second messenger 2'3'-cGAMP, which activates STING and drives type I interferon
  production; a separate pool of cGAS binds chromatin in the nucleus, where in human and
  mouse it acts as a brake on homologous recombination repair.

  The naked mole-rat protein is distinguished by an inversion of that nuclear activity.
  Four amino acid changes acquired during evolution weaken TRIM41-mediated ubiquitination
  of cGAS and its interaction with the segregase p97, so the protein is retained on
  chromatin longer after DNA damage instead of being extracted. This prolonged chromatin
  residence strengthens the interaction between the repair factors FANCI and RAD50,
  promotes RAD50 recruitment to damage sites, and potentiates homologous recombination
  rather than suppressing it. The same four residues underlie a role in opposing cellular
  and tissue ageing and in extending lifespan, making cGAS a contributor to the exceptional
  genome maintenance and longevity of this species. The four positions have not been
  named in the primary literature; sequence alignment against human cGAS places candidates
  in the C-terminal domain at S463, E511, Y527 and T530 (human D431, K479, L495 and K498),
  but that assignment remains provisional. Whether the naked-mole-rat enzyme also retains the ancestral
  cytosolic DNA-sensing output — cGAMP synthesis, STING activation and interferon induction
  — has not been measured.
references:
- id: PMID:41066557
  title: A cGAS-mediated mechanism in naked mole-rats potentiates DNA repair and delays aging.
  findings:
  - statement: >-
      Naked mole-rat cGAS has lost the homologous-recombination-suppressing activity of its
      human and mouse orthologs, through four amino acid changes fixed during evolution.
    supporting_text: >-
      naked mole-rat cyclic guanosine monophosphate-adenosine monophosphate synthase (cGAS)
      lacks the suppressive function of human or mouse homologs in homologous recombination
      repair through the alteration of four amino acids during evolution
  - statement: >-
      The mechanism is prolonged chromatin retention after DNA damage, caused by weakened
      TRIM41-mediated ubiquitination and weakened p97 engagement.
    supporting_text: >-
      The changes enable cGAS to retain chromatin longer upon DNA damage by weakening
      TRIM41-mediated ubiquitination and interaction with the segregase P97.
  - statement: >-
      Chromatin-retained cGAS promotes the FANCI-RAD50 interaction and RAD50 recruitment to
      damage sites, potentiating homologous recombination repair.
    supporting_text: >-
      Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
      FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
      homologous recombination repair.
  - statement: The same four residues mediate an anti-ageing and lifespan-extending function.
    supporting_text: >-
      Moreover, the four amino acids mediate the function of cGAS in antagonizing cellular
      and tissue aging and extending life span.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single primary source for every species-specific claim in this review, and the
      only evidence that contradicts a propagated annotation. PubMed-verified (Science 2025;
      390:eadp5056; doi 10.1126/science.adp5056). Cached abstract-only, so all quotes are
      taken from the abstract and no assay detail, cell type or residue-level mechanism is
      asserted beyond what the abstract states.
