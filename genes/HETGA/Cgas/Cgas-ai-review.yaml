  review:
    summary: >-
      Supported in the naked mole-rat: the species-specific function is exercised on
      chromatin after DNA damage, which is nuclear.
    action: ACCEPT
    reason: >-
      The entire naked-mole-rat phenotype is a nuclear one — retention on chromatin after
      DNA damage, promotion of the FANCI-RAD50 interaction, and RAD50 recruitment to damage
      sites. A protein cannot do that without a nuclear pool. This is therefore not merely a
      propagated localization but one corroborated by the species-specific evidence, and it
      is the compartment in which the core naked-mole-rat activity takes place.
    supported_by:
