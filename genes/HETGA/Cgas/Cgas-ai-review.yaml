- term:
    id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:41066557
  qualifier: involved_in
  review:
    summary: >-
      Proposed replacement for GO:2000042. Naked-mole-rat cGAS potentiates homologous
      recombination repair through prolonged chromatin retention and promotion of RAD50
      recruitment.
    action: NEW
    reason: >-
      The primary study reports a positive, mechanistically specified role for cGAS in
      homologous recombination in this species: prolonged chromatin binding strengthens the
      FANCI-RAD50 interaction and facilitates RAD50 recruitment to damage sites, thereby
      potentiating homologous recombination repair. The conclusion is drawn from an
      engineered four-residue substitution series that shifts the naked-mole-rat protein
      toward the human and mouse behaviour, which is why IMP is the appropriate evidence
      code.

      GO:1905168 was chosen deliberately over the two neighbouring options. The gene product
      is not itself performing recombination, so GO:0000724 double-strand break repair via
      homologous recombination would overstate the role; and the effect is specific to the
      homologous-recombination pathway rather than to repair in general, so the broader
      GO:2000781 positive regulation of double-strand break repair would understate it. The
      identifier was confirmed against QuickGO rather than written from memory.

      No accompanying ageing or lifespan term is proposed. The abstract does support an
      anti-ageing role, but reduced senescence and extended lifespan here are indirect,
      downstream consequences of improved repair, and NEW is explicitly not for indirect or
      pleiotropic effects.
    supported_by:
    - reference_id: PMID:41066557
      supporting_text: >-
        Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
        FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
        homologous recombination repair.
    - reference_id: PMID:41066557
      supporting_text: >-
        naked mole-rat cyclic guanosine monophosphate-adenosine monophosphate synthase (cGAS)
        lacks the suppressive function of human or mouse homologs in homologous recombination
        repair through the alteration of four amino acids during evolution
core_functions:
- description: >-
    Chromatin-associated promotion of homologous recombination repair. After DNA damage,
    cGAS binds chromatin in the nucleus and, because naked-mole-rat-specific changes in its
    C-terminal domain weaken TRIM41-mediated ubiquitination and p97-driven extraction, it
    remains there longer than the human or mouse protein. The retained protein strengthens
    the FANCI-RAD50 interaction and promotes RAD50 recruitment to double-strand breaks,
    potentiating homologous recombination. This is the species-specific core function and it
    is the opposite in sign to the repair-suppressive role of the human and mouse orthologs.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  directly_involved_in:
  - id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0035861
    label: site of double-strand break
  supported_by:
  - reference_id: PMID:41066557
    supporting_text: >-
      Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
      FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
      homologous recombination repair.
  - reference_id: PMID:41066557
    supporting_text: >-
      The changes enable cGAS to retain chromatin longer upon DNA damage by weakening
      TRIM41-mediated ubiquitination and interaction with the segregase P97.
  knowledge_gaps:
  - gap_statement: >-
      The molecular step by which chromatin-retained cGAS strengthens the FANCI-RAD50
      interaction is undetermined: it is not known whether cGAS contacts FANCI or RAD50
      directly, acts as a chromatin-tethered scaffold that raises their local concentration,
      or works through a further unidentified intermediary.
    boundary: >-
      Firmly established: the four C-terminal residues prolong chromatin retention by
      weakening TRIM41-mediated ubiquitination and p97 engagement, and prolonged retention
      increases the FANCI-RAD50 interaction and RAD50 recruitment to damage sites, thereby
      potentiating homologous recombination.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      This is the mechanistic hinge of the only known case in which cGAS promotes rather
      than suppresses homologous recombination, and it determines whether the activity is a
      catalysis-independent scaffolding role or a signalling one.
    resolution: >-
      Direct interaction mapping between cGAS, FANCI and RAD50 in naked-mole-rat cells,
      combined with a homologous recombination reporter assay comparing wild-type cGAS, a
      catalytically dead mutant and the humanising four-residue variant.
    provenance:
    - reference_id: PMID:41066557
      supporting_text: >-
        Prolonged chromatin binding of cGAS enhanced the interaction between repair factors
        FANCI and RAD50 to facilitate RAD50 recruitment to damage sites, thereby potentiating
        homologous recombination repair.
- description: >-
    Double-stranded DNA-activated synthesis of the cyclic dinucleotide second messenger
    2'3'-cGAMP from ATP and GTP, the family-defining activity of cGAS. The naked-mole-rat
    protein retains the complete apparatus for it — the catalytic Mg(2+) triad E257/D259/D351,
    the zinc thumb H422/C428/C429/C436 that reads B-form double-stranded DNA, and the
    nucleotide and product contacts — and the four residues that diverge in this species lie
    in a separate C-terminal regulatory surface. The activity itself has not been assayed in
    naked-mole-rat material, and the downstream STING and type I interferon output is
    correspondingly unverified in this species, so this core function is stated at the level
    of the enzyme and its substrates rather than extended to an immune process term.
  molecular_function:
    id: GO:0061501
    label: 2',3'-cyclic GMP-AMP synthase activity
  locations:
  - id: GO:0005829
    label: cytosol
  substrates:
  - id: CHEBI:30616
    label: ATP
  - id: CHEBI:37565
    label: GTP
  supported_by:
  - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
    supporting_text: >-
      Every catalytically important residue that UniProt annotates on human cGAS is present
      and identical in the naked mole-rat protein
  - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
    supporting_text: >-
      The divergence that reverses the HR phenotype sits in a C-terminal regulatory surface,
      not in the active site.
  knowledge_gaps:
  - gap_statement: >-
      Whether the naked-mole-rat enzyme actually synthesises 2'3'-cGAMP, and whether the
      cGAMP-STING-type I interferon axis is functional in this species, has never been
      measured. Conservation of the catalytic machinery establishes capability, not activity.
    boundary: >-
      Firmly established: the catalytic Mg(2+) triad, the zinc thumb and the ATP, GTP and
      cGAMP contacts are all present and identical to human cGAS, so there is no pseudoenzyme
      signature, and the four residues that diverge in this species lie outside the active
      site.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Four propagated innate-immune annotations (GO:0002218, GO:0002230, GO:0032481,
      GO:0071360) cannot be resolved without it, and the same adaptation that biases cGAS
      toward chromatin could plausibly reduce the free pool available for cytosolic sensing,
      so the answer is not predictable from the ortholog.
    resolution: >-
      An in vitro cGAMP synthesis assay on recombinant A0AAX6RS70 with a catalytic-triad
      mutant control, plus measurement of STING and IRF3 phosphorylation and interferon-beta
      induction in naked-mole-rat cells challenged with cytosolic double-stranded DNA.
    provenance:
    - reference_id: file:HETGA/Cgas/Cgas-bioinformatics/RESULTS.md
      supporting_text: >-
        it does not demonstrate that the naked mole-rat enzyme actually produces cGAMP, and
        no naked mole-rat biochemical assay of cGAMP synthesis was found in the cached
        literature
    - reference_id: file:HETGA/Cgas/Cgas-deep-research-falcon.md
      supporting_text: >-
        There is no verified naked-mole-rat kinetic constant, catalytic rate, DNA-length
        response curve, product measurement, structure, tissue-expression map, or subcellular
        localization for this accession.
suggested_questions:
- question: >-
    Does naked-mole-rat cGAS still signal through STING to induce type I interferon, or has
    the shift toward chromatin retention reduced the free cytosolic pool available for DNA
    sensing? Four propagated annotations covering the innate-immune arm cannot be resolved
    without this.
  experts:
  - Zhiyong Mao
  - Yu Chen
- question: >-
    Do the four C-terminal substitutions affect only TRIM41 and p97 engagement, or do they
    also change cGAS turnover, oligomerisation or nucleosome affinity in ways that would
    alter the enzyme's regulation more broadly?
  experts:
  - Zhiyong Mao
- question: >-
    Given that the chromatin retention which potentiates repair corresponds, in human and
    mouse, to the catalytically restrained nucleosome-bound state, is there a trade-off in
    the naked mole rat between genome maintenance and cytosolic DNA surveillance?
  experts:
  - Vera Gorbunova
  - Andrei Seluanov
- question: >-
    Is the homologous-recombination-promoting activity of naked-mole-rat cGAS independent of
    its nucleotidyltransferase activity, as would be expected if it acts as a chromatin-bound
    scaffold rather than through cGAMP?
  experts:
  - Zhiyong Mao
suggested_experiments:
- hypothesis: >-
    Naked-mole-rat cGAS retains 2'3'-cGAMP synthase activity, as predicted by the complete
    conservation of its catalytic triad, zinc thumb and nucleotide contacts.
  description: >-
    Express and purify recombinant A0AAX6RS70 alongside human CGAS as a positive control, and
    measure 2'3'-cGAMP production from ATP and GTP in the presence and absence of activating
    double-stranded DNA by LC-MS/MS. Include a triad mutant (E257A/D259A) as a negative
    control. This would convert the sequence-level inference behind the GO:0061501 call into a
    direct measurement.
  experiment_type: in vitro enzyme assay
- hypothesis: >-
    The cGAS-STING-interferon axis is functional in naked-mole-rat cells, so the four
    propagated innate-immune annotations transfer despite the chromatin-retention adaptation.
  description: >-
    Transfect naked-mole-rat and mouse fibroblasts with cytosolic double-stranded DNA and with
    poly(I:C), and compare cGAMP levels, STING and IRF3 phosphorylation, and interferon-beta
    and interferon-stimulated gene induction, with cGAS knockdown as the specificity control.
    A positive result would let GO:0002218, GO:0002230, GO:0032481 and GO:0071360 move from
    UNDECIDED to ACCEPT; a negative result would be the first evidence that the immune arm has
    diverged in this lineage.
  experiment_type: cellular innate immune signalling assay
- hypothesis: >-
    Naked-mole-rat cGAS localises to double-strand break sites, as the propagated cellular
    component term asserts and as its role in RAD50 recruitment implies.
  description: >-
    Induce site-specific double-strand breaks and follow endogenous cGAS by live-cell imaging
    and by chromatin immunoprecipitation at the break site in naked-mole-rat cells, comparing
    residence times with mouse cells. This would directly test the GO:0035861 localization,
    which is currently accepted on mechanistic inference rather than on imaging in this
    species.
  experiment_type: laser microirradiation and ChIP at induced breaks
- hypothesis: >-
    The promotion of homologous recombination by naked-mole-rat cGAS is a scaffolding
    function that does not require nucleotidyltransferase activity.
  description: >-
    Compare homologous recombination reporter efficiency in cells complemented with wild-type
    naked-mole-rat cGAS, a catalytically dead triad mutant, and the humanising four-residue
    variant. Separating catalysis from the repair role would determine whether the two core
    functions recorded here are genuinely independent activities of the same protein.
  experiment_type: DR-GFP homologous recombination reporter assay
