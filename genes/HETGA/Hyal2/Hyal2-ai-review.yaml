  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: The GPI anchor places mature HYAL2 in the plasma membrane; this is the primary
      site of its catalytic function and is asserted directly on the naked mole rat record.
    action: ACCEPT
    reason: UniProt annotates cell membrane with a GPI lipid anchor for A0A0P6J1Y4 itself,
      and the topology follows from the cleaved signal peptide plus C-terminal GPI attachment.
      Human and mouse donors both carry multiple IDAs and an EXP. Since GO obsoleted the
      GPI-specific location terms (GO:0046658 and GO:0031225, both replaced_by GO:0005886),
      plasma membrane is now the correct and only available representation of the anchored
      state.
    supported_by:
