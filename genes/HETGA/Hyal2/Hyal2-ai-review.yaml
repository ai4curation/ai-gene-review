id: A0A0P6J1Y4
gene_symbol: Hyal2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  Hyal2 encodes hyaluronidase-2, a 471-residue glycosyl hydrolase family 56 (GH56)
  enzyme. Like its mammalian orthologs it is synthesised with a cleaved N-terminal
  signal peptide and delivered to the outer leaflet of the plasma membrane through a
  C-terminal glycosylphosphatidylinositol (GPI) anchor, where it partitions into
  cholesterol-rich membrane rafts and faces the extracellular matrix. Its molecular
  activity is the first, rate-limiting step of hyaluronan catabolism: random hydrolysis
  of the beta-1,4 linkage between N-acetyl-beta-D-glucosamine and D-glucuronate in
  high-molecular-mass hyaluronan (EC 3.2.1.35), cutting the polymer down to
  intermediate-size (~20 kDa) fragments that are then endocytosed and degraded to
  oligosaccharides by lysosomal HYAL1 and exoglycosidases. The catalytic proton donor
  (Glu135, within the conserved GH56 DWEHW motif) and all five family disulfides are
  retained. HYAL2 orthologs are weak, acid-preferring enzymes that depend on
  pericellular acidification for efficient catalysis, yet their loss in mammals raises
  plasma hyaluronan roughly ten-fold and causes craniovertebral skeletal defects,
  thrombocytopenia and chronic haemolysis.
  Heterocephalus glaber accumulates hyaluronan of unusually high molecular mass in its
  tissues. The absolute size is contested: the original report puts it above 6 MDa, while a
  later quantification of naked mole rat tissues and plasma finds a substantially smaller
  maximum, a discrepancy that has been attributed to differences in isolation procedure and
  is still unresolved. Its Hyal2 carries a mole-rat-specific substitution, A284G, that arose in
  the common ancestor of the naked and Damaraland mole rats inside the catalytic GH
  domain. Recombinant naked mole rat HYAL2 degrades hyaluronan, and reverting residue
  284 to the ancestral alanine increases that degradation, so the protein is a
  functional but modestly attenuated hyaluronidase rather than an inactive one; Hyal2
  transcript levels in naked mole rat skin fibroblasts and kidney equal or exceed those
  in mouse. Beyond catabolism, HYAL2 orthologs act as a cell-surface scaffold: the
  protein binds the receptor tyrosine kinase RON/MST1R and holds it functionally
  silent, and binds TGF-beta1 at the cell surface with recruitment of WWOX. In sheep
  and humans, but not in mouse, HYAL2 additionally serves as the entry receptor for
  jaagsiekte sheep retrovirus; this receptor competence varies by three orders of
  magnitude between mammalian orthologs and has not been assayed in this species.
references:
- id: PMID:38052795
  title: Evolution of high-molecular-mass hyaluronic acid is associated with subterranean
    lifestyle.
  findings:
  - statement: Naked mole rat HYAL2 was cloned and expressed, and a naked-mole-rat/Damaraland-mole-rat-specific
      substitution at residue 284 in the catalytic GH domain was shown to weaken, but
      not abolish, its hyaluronan-degrading activity.
    supporting_text: A positively selected site G284 was also identified in NMR and DMR
      HYAL2 (Fig. 3c). We tested the effect of this mutation on NMR HYAL2. We did not
      observe difference when HA was incubated for two days, but the size and amount
      of HA was smaller after three days of incubation (Fig. 5i), suggesting that the
      substitution in G284 also contributes to the weaker HYAL2 in NMRs.
  - statement: Naked mole rat HYAL2 transcript is not reduced relative to control species
      in skin fibroblasts or kidney.
    supporting_text: NMR had a higher expression of HYAL2 and a drastically lower expression
      of HYAL1 in the kidney
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The single most decisive reference for this gene. It is the only study
      that has cloned and functionally assayed the naked mole rat HYAL2 protein itself,
      and it is titled for a phenotype rather than for the gene, so it is easy to miss.
      Its result establishes that the naked mole rat enzyme is catalytically active and
      only modestly attenuated, which is what keeps GO:0004415 an ACCEPT rather than a
      REMOVE.
- id: PMID:23783513
  title: High-molecular-mass hyaluronan mediates the cancer resistance of the naked mole
    rat.
  findings:
  - statement: Naked mole rat cells and tissues have markedly lower bulk hyaluronidase
      activity than human, mouse or guinea pig, so both increased synthesis and slowed
      degradation contribute to high-molecular-mass hyaluronan accumulation.
    supporting_text: 'HAase activity of the naked mole-rat cells was much lower than
      that of human, mouse or guinea pig cells (Figure 2c). Similarly, HAase activity
      was lower in the naked mole-rat tissues than in the mouse tissues (Figure 2d).
      These results indicate that two mechanisms contribute to accumulation of HMW-HA
      in the naked mole-rat: more robust synthesis and slower degradation.'
  - statement: The Hyal2 overexpression construct used to abolish the cancer-resistance
      phenotype was the HUMAN HYAL2 cDNA, so those experiments carry no information about
      the catalytic properties or physiological role of the naked mole rat protein.
    supporting_text: Human Hyal2 cDNA was amplified from pCMV6-HYAL2 (sc117754 OriGene)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the tissue-level hyaluronidase deficit but does not attribute
      it to an isoenzyme. Its Hyal2 experiments use the human cDNA (verified in Methods),
      so they must not be read as evidence about naked mole rat Hyal2.
- id: PMID:33846452
  title: Abundance and size of hyaluronan in naked mole-rat tissues and plasma.
  findings:
  - statement: RNAseq argues against markedly reduced Hyal2 transcription in the naked
      mole rat, and the authors state that the isoenzyme responsible for the reduced
      hyaluronidase activity has never been resolved.
    supporting_text: The RNAseq data obtained in our study seem to rule out a markedly
      decreased transcription of the Hyal2 gene, but we have no information about NMR
      lymph node HYAL2 activity.
  - statement: HYAL2 is the GPI-linked cell-surface enzyme that performs the first step
      of somatic hyaluronan depolymerisation, upstream of lysosomal HYAL1.
    supporting_text: The principal somatic HA-depolymerizing enzymes, i.e. hyaluronidases,
      are HYAL1 and HYAL2. HA is degraded at the cell surface by the glycosylphosphatidylinositol
      (GPI)-linked HYAL2 into intermediate-size fragments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Explicitly identifies the attribution gap that makes several calls in
      this review cautious; the authors state that the HYAL1/HYAL2 distinction could
      not be made in the naked mole rat.
- id: PMID:39009271
  title: Naked mole-rat TMEM2 lacks physiological hyaluronan-degrading activity.
  full_text_unavailable: true
  findings:
  - statement: The naked mole rat ortholog of TMEM2, a structurally unrelated cell-surface
      hyaluronidase, is catalytically inactive, offering an alternative explanation for
      the reduced hyaluronan degradation in this species.
    supporting_text: Thus, unlike mTMEM2, nmrTMEM2 is not a physiological hyaluronidase.
      The inability of nmrTMEM2 to degrade HA might partially account for the high-molecular-weight
      HA accumulation in NMR tissues.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in the cache; nothing here is drawn from unseen Methods
      or Results. It concerns TMEM2 (G8/GG domains, PbH1 repeats), not the GH56 family,
      so its conclusion must not be transferred to Hyal2. Its value for this review is
      indirect but real - it gives the naked mole rat degradation deficit a documented
      owner elsewhere, which removes the pressure to explain that deficit by inactivating
      HYAL2.
- id: PMID:32398747
  title: Naked mole-rat very-high-molecular-mass hyaluronan exhibits superior cytoprotective
    properties.
  findings:
  - statement: Hyaluronan polymer length, not merely abundance, determines the biological
      outcome, with very-high-molecular-mass and shorter high-molecular-mass hyaluronan
      having opposing effects through CD44.
    supporting_text: vHMM-HA (>6.1 MDa) has superior cytoprotective properties compared
      to the shorter HMM-HA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Background for why the product-size axis matters biologically; motivates
      the proposed new term. No Hyal2-specific data.
- id: PMID:16191204
  title: Amino acid residues that are important for Hyal2 function as a receptor for
    jaagsiekte sheep retrovirus.
  findings:
  - statement: Mouse Hyal2 neither binds jaagsiekte sheep retrovirus Env nor mediates
      entry, and shows 1,000-fold lower receptor activity than human Hyal2; GOA records
      this as an explicit NOT|enables GO:0001618 annotation on mouse Hyal2.
    supporting_text: Human Hyal2 binds the envelope (Env) proteins of these viruses and
      is functional as a receptor, but Hyal2 from mice does not bind Env nor does it
      mediate entry of either virus.
  - statement: Receptor competence is determined by multiple co-acting residues in the
      central third of the protein, so it cannot be predicted from any single residue
      in an untested ortholog.
    supporting_text: None of the single or double mutation reduced the receptor activity
      of human Hyal2 by more than 10-fold, whereas mouse Hyal2 activity is reduced 1,000-fold
      from that of human Hyal2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive for the GO:0001618 and GO:0046718 calls. Not a naked mole rat
      paper, but the only rodent-ortholog test of HYAL2 receptor function that exists.
      The affinage human record cites this paper but frames it only as a quantitative
      difference and omits the outright loss of Env binding in mouse.
- id: PMID:19366691
  title: Transforming growth factor beta1 signaling via interaction with cell surface
    Hyal-2 and recruitment of WWOX/WOX1.
  findings:
  - statement: Cell-surface Hyal-2 binds TGF-beta1 on microvilli and recruits WWOX/WOX1,
      with the complex reported to relocate to the nucleus and enhance Smad-driven promoter
      activity.
    supporting_text: we determined that TGF-beta1 bound cell surface hyaluronidase Hyal-2
      on microvilli in type II TGF-beta receptor-deficient HCT116 cells, as determined
      by immunoelectron microscopy. This binding resulted in recruitment of proapoptotic
      WOX1 (also named WWOX or FOR) and formation of Hyal-2.WOX1 complexes for relocation
      to the nuclei.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Sole anchor for the whole nuclear and transcriptional annotation cluster
      projected from mouse Hyal2 (GO:0003713, GO:0090575, GO:0045944, GO:0042307) and
      for GO:0050431 and GO:0005829. Single-laboratory, reporter- and imaging-based;
      correctly cited, but too thin a base for projecting a transcription-complex membership
      onto an untested species.
- id: PMID:12676986
  title: Hyaluronidase 2 negatively regulates RON receptor tyrosine kinase and mediates
    transformation of epithelial cells by jaagsiekte sheep retrovirus.
  full_text_unavailable: true
  findings:
  - statement: HYAL2 associates with the RON/MST1R receptor tyrosine kinase and holds
      it functionally silent; releasing RON activates AKT and MAPK signalling.
    supporting_text: the HYAL2 receptor protein is associated with the RON receptor tyrosine
      kinase (also called MST1R or Stk in the mouse), rendering it functionally silent
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Anchor for GO:0030971, GO:0030294 and GO:0051898. Corroborated on the
      naked mole rat record itself by the UniProt ARBA subunit line naming MST1R, which
      is why these are kept as non-core rather than marked over-annotated.
- id: PMID:11296287
  title: Candidate tumor suppressor HYAL2 is a glycosylphosphatidylinositol (GPI)-anchored
    cell-surface receptor for jaagsiekte sheep retrovirus, the envelope protein of which
    mediates oncogenic transformation.
  full_text_unavailable: true
  findings:
  - statement: HYAL2 is a GPI-anchored cell-surface protein rather than a purely lysosomal
      enzyme, and its hyaluronidase activity is too weak to detect in cell-based assays
      that readily detect HYAL1.
    supporting_text: HYAL2 was previously described as a lysosomal hyaluronidase, but
      we show that HYAL2 is actually a glycosylphosphatidylinositol (GPI)-anchored cell-surface
      protein.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source of the human NOT|enables GO:0004415 IDA. The apparent contradiction
      with the nine positive IDAs is resolved by HYAL2 being a genuinely weak, acid-requiring
      enzyme, not by either annotation being wrong.
- id: PMID:9712871
  title: HYAL2, a human gene expressed in many cells, encodes a lysosomal hyaluronidase
    with a novel type of specificity.
  full_text_unavailable: true
  findings:
  - statement: HYAL2 hydrolyses high-molecular-mass hyaluronan only below pH 4 and only
      down to a ~20 kDa product, defining the acid-dependent, partial-digestion character
      of the enzyme.
    supporting_text: The HYAL2 protein was shown to have hyaluronidase activity below
      pH 4.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Defines the catalytic character of the family; explains why cell-based
      assays at neutral pH can score HYAL2 as inactive.
- id: PMID:18772348
  title: 'Skeletal and hematological anomalies in HYAL2-deficient mice: a second type
    of mucopolysaccharidosis IX?'
  full_text_unavailable: true
  findings:
  - statement: Despite weak in vitro activity, HYAL2 has a physiological hyaluronidase
      role in vivo, required for craniovertebral bone formation, plasma hyaluronan clearance
      and erythrocyte and platelet homeostasis.
    supporting_text: murine HYAL2 has a physiological activity in vivo that is relevant
      for craniovertebral bone formation, maintenance of plasma HA concentrations, and
      erythrocyte and platelet homeostasis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The in vivo counterweight to the weak in vitro activity, and the basis
      for treating the skeletal terms as genuine but peripheral.
- id: file:HETGA/Hyal2/Hyal2-uniprot.txt
  title: UniProt record for naked mole rat Hyal2 (A0A0P6J1Y4)
  findings:
  - statement: UniProt assigns EC 3.2.1.35, places the protein in glycosyl hydrolase family
      56, gives it a cleaved signal peptide and a GPI anchor at the cell membrane, annotates
      the catalytic proton donor at residue 135, and records an MST1R interaction.
    supporting_text: '-!- SIMILARITY: Belongs to the glycosyl hydrolase 56 family.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The only species-specific sequence-level record. Entirely rule-derived
      (PE 3, inferred from homology), but the feature annotations are checkable against
      the deposited sequence - residue 135 is the glutamate of the conserved GH56 DWEHW
      motif, confirming an intact catalytic centre.
- id: file:HETGA/Hyal2/Hyal2-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for HYAL2 (human ortholog), used as a conserved-mechanism
    baseline
  findings:
  - statement: A 21-finding, citation-anchored record of the HUMAN HYAL2 protein, used
      here only to establish what the conserved protein does mechanistically.
    supporting_text: HYAL2 is a GPI-anchored, lipid raft-associated cell-surface hyaluronidase
      that initiates extracellular catabolism of high-molecular-weight hyaluronan (HA),
      cleaving it preferentially at acidic pH to ~20 kDa intermediates rather than to
      smaller fragments
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human-ortholog record, fetched deliberately as a conserved-mechanism
      baseline because affinage refuses non-human species; its frontmatter and heading
      both say human. Accurate and well-cited for human HYAL2 and genuinely useful for
      the RON and WWOX modules. Not cited as evidence for any naked-mole-rat claim. Three
      recall and grounding limitations are recorded in the notes - it contains nothing
      on the naked mole rat, so it misses PMID:38052795, the one paper that assays this
      species' protein; it frames PMID:16191204 as a quantitative difference without
      recording that mouse Hyal2 does not bind Env at all; and its mechanism_profile
      grounding is unusable, listing GO:0140098 catalytic activity acting on RNA as a
      molecular activity for a glycoside hydrolase. Its GO ids were deliberately not
      imported.
