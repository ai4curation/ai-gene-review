- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct but far too general - an InterPro2GO and UniRule mapping at the level
      of all carbohydrate metabolism for a dedicated hyaluronan hydrolase.
    action: MODIFY
    reason: The annotation is not wrong, but it sits several levels above what is known.
      The source domain is InterPro:IPR018155, which is the hyaluronidase signature itself,
      so the mapping discards specificity the source already carries. The informative
      term is GO:0030214 hyaluronan catabolic process, which is what the enzyme actually
      does and which is separately supported here.
    proposed_replacement_terms:
    - id: GO:0030214
      label: hyaluronan catabolic process
    supported_by:
    - reference_id: file:HETGA/Hyal2/Hyal2-uniprot.txt
      supporting_text: '-!- FUNCTION: Catalyzes hyaluronan degradation into small fragments
        that'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
- term:
    id: GO:0046718
    label: symbiont entry into host cell
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: A mechanical inter-ontology consequence of the GO:0001618 virus receptor
      annotation, which is itself not defensible for this species.
    action: REMOVE
    reason: >-
      The WITH/FROM for this row is literally GO:0001618, so this annotation exists only
      because the virus receptor activity annotation exists. Removing that annotation
      removes this one with it. Independently, the process referred to is entry of
      jaagsiekte sheep retrovirus and enzootic nasal tumour virus, ovine and caprine
      betaretroviruses, into a host cell; there is no evidence that HYAL2 of
      Heterocephalus glaber participates in the entry of any virus, and the only rodent
      HYAL2 ever tested does not mediate entry of either virus.
    supported_by:
    - reference_id: PMID:16191204
      supporting_text: Human Hyal2 binds the envelope (Env) proteins of these viruses
        and is functional as a receptor, but Hyal2 from mice does not bind Env nor does
        it mediate entry of either virus.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: GO:0001618
        source_label: virus receptor activity
        source_status: SOURCE_BAD
        comment: The inference source is another annotation on this protein that is itself
          an unsupported ortholog projection.
- term:
    id: GO:0000302
    label: response to reactive oxygen species
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Projected from a single human IDA. Plausible in the naked mole rat, where
      hyaluronan is implicated in oxidative stress resistance, but that biology belongs
      to the polymer and CD44, not demonstrably to Hyal2.
    action: KEEP_AS_NON_CORE
    reason: The human donor has one IDA (PMID:20554532). The naked mole rat context makes
      this superficially attractive - very-high-molecular-mass hyaluronan is cytoprotective
      against oxidative stress - but that protection is a property of the polymer acting
      through CD44 (PMID:32398747), and attributing it to the enzyme that shortens the
      polymer would invert the logic. Retained as peripheral, not core.
    supported_by:
    - reference_id: PMID:32398747
      supporting_text: vHMM-HA (>6.1 MDa) has superior cytoprotective properties compared
        to the shorter HMM-HA.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
- term:
    id: GO:0001618
    label: virus receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Jaagsiekte sheep retrovirus receptor activity is a species-idiosyncratic,
      multi-residue property that the only tested rodent ortholog lacks outright; the
      pipeline projected a positive from a donor set containing an explicitly negated
      donor.
    action: REMOVE
    reason: >-
      The positive biological argument has three parts. First, the closest tested
      relative is negative, not merely weaker - PMID:16191204 reports that mouse Hyal2
      neither binds Env nor mediates entry, and GOA records this as an explicit
      NOT|enables GO:0001618 IDA on mouse O35632. The GO_REF:0000120 WITH/FROM for this
      row lists that same mouse protein alongside human Q12891, so the pipeline
      propagated a positive assertion from a donor set that contains a curated negation
      for the identical term. Second, receptor competence is not a conserved family
      property but varies by orders of magnitude across mammals, being strong in sheep
      and human, weak in cattle and effectively absent in mouse. Third, it is not
      predictable from sequence - the determinants lie in the central third of the
      protein and act only in concert, with no single or double substitution accounting
      for more than a tenth of the difference, so no residue inspection of A0A0P6J1Y4
      can license the transfer. The viruses concerned are ovine and caprine pathogens
      with no relationship to Heterocephalus glaber. This is a removal of an unsupported
      projection, not a claim that the naked mole rat protein has been shown to be
      non-permissive; that experiment has never been done.
    supported_by:
    - reference_id: PMID:16191204
      supporting_text: Human Hyal2 binds the envelope (Env) proteins of these viruses
        and is functional as a receptor, but Hyal2 from mice does not bind Env nor does
        it mediate entry of either virus.
    - reference_id: PMID:16191204
      supporting_text: Mouse and human Hyal2 are 82% identical at the amino acid level
        but mouse Hyal2 shows 1,000-fold lower JSRV receptor activity.
    - reference_id: PMID:16191204
      supporting_text: we previously found that bovine Hyal2 acts as a weak receptor for
        JSRV and ENTV compared to sheep or human Hyal2
    - reference_id: PMID:16191204
      supporting_text: None of the single or double mutation reduced the receptor activity
        of human Hyal2 by more than 10-fold, whereas mouse Hyal2 activity is reduced 1,000-fold
        from that of human Hyal2.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:O35632
