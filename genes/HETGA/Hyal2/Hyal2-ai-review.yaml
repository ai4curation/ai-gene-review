existing_annotations:
- term:
    id: GO:0004415
    label: hyalurononglucosaminidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The core molecular function. Naked mole rat HYAL2 has been cloned and shown
      to degrade hyaluronan in transfected cells, the catalytic proton donor and all
      family disulfides are retained, and UniProt assigns EC 3.2.1.35 on RuleBase evidence.
    action: ACCEPT
    reason: >-
      This is the one annotation in the set with direct naked-mole-rat functional
      support. PMID:38052795 cloned HYAL2 of NMR into a piggyBac vector, expressed it
      in HeLa and HEK293T cells, and compared wild type against the G284A revertant of
      the mole-rat-specific A284G substitution. Both constructs degrade hyaluronan; the
      revertant leaves smaller product. That is a quantitative attenuation of a retained
      activity, not a loss of function, and per the review guidance it refines rather
      than abolishes the GO molecular function. The sequence agrees - UniProt annotates
      the proton donor at residue 135, which in the deposited sequence is the glutamate
      of the conserved GH56 DWEHW motif (positions 133-137 read D-W-E-H-W), and all
      five PIRSR disulfides are present. The apparent conflict in the human donor record
      (nine IDAs for this term plus one NOT|enables IDA from PMID:11296287) reflects the
      weak, acid-requiring character of HYAL2 rather than a curation error - the enzyme
      works below pH 4 (PMID:9712871) yet has demonstrable physiological activity in
      vivo (PMID:18772348).
    supported_by:
    - reference_id: PMID:38052795
      supporting_text: A positively selected site G284 was also identified in NMR and
        DMR HYAL2 (Fig. 3c). We tested the effect of this mutation on NMR HYAL2. We did
        not observe difference when HA was incubated for two days, but the size and amount
        of HA was smaller after three days of incubation (Fig. 5i), suggesting that the
        substitution in G284 also contributes to the weaker HYAL2 in NMRs.
    - reference_id: PMID:38052795
      supporting_text: as well as HYAL2 of NMR were cloned into a piggyBac vector
    - reference_id: file:HETGA/Hyal2/Hyal2-uniprot.txt
      supporting_text: EC=3.2.1.35
    - reference_id: file:HETGA/Hyal2/Hyal2-uniprot.txt
      supporting_text: ACT_SITE        135
    - reference_id: PMID:9712871
      supporting_text: The HYAL2 protein was shown to have hyaluronidase activity below
        pH 4.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q12891
        source_label: human HYAL2
        source_status: SUPPORTS_TRANSFER
        comment: Nine independent IDAs for this term in GOA.
      - source_id: UniProtKB:O35632
        source_label: mouse Hyal2
        source_status: SUPPORTS_TRANSFER
        comment: IMP from PMID:26887442 plus ISS.
- term:
    id: GO:0005886
