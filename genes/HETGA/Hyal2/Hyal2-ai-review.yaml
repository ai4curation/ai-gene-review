core_functions:
- description: >-
    Cell-surface, GPI-anchored endo-beta-N-acetylhexosaminidase that performs the
    first and rate-limiting cut in extracellular hyaluronan catabolism, hydrolysing
    beta-1,4 linkages in high-molecular-mass hyaluronan (EC 3.2.1.35) to
    intermediate-size fragments that are subsequently internalised and completed by
    lysosomal HYAL1 and exoglycosidases. It acts from lipid rafts in the outer leaflet
    of the plasma membrane, where the catalytic domain faces the extracellular matrix,
    and it is a weak, acid-preferring enzyme dependent on local pericellular
    acidification. In Heterocephalus glaber this activity is retained but attenuated.
    The catalytic proton donor Glu135 and all five family disulfides are intact, and
    recombinant naked mole rat HYAL2 degrades hyaluronan, but a mole-rat-specific
    A284G substitution in the catalytic domain reduces the rate relative to the
    ancestral residue, contributing alongside elevated HAS2 synthesis to the
    very-high-molecular-mass hyaluronan characteristic of this species.
  molecular_function:
    id: GO:0004415
    label: hyalurononglucosaminidase activity
  directly_involved_in:
  - id: GO:0030214
    label: hyaluronan catabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  - id: GO:0045121
    label: membrane raft
  substrates:
  - id: CHEBI:16336
    label: hyaluronic acid
  supported_by:
  - reference_id: PMID:38052795
    supporting_text: A positively selected site G284 was also identified in NMR and DMR
      HYAL2 (Fig. 3c). We tested the effect of this mutation on NMR HYAL2. We did not
      observe difference when HA was incubated for two days, but the size and amount of
      HA was smaller after three days of incubation (Fig. 5i), suggesting that the substitution
      in G284 also contributes to the weaker HYAL2 in NMRs.
  - reference_id: PMID:38052795
    supporting_text: Interestingly, an amino acid replacement A284G occurred in the ancestor
      of NMR and DMR that overlapped with the strongest positive selection sites A284K
      identified in SNM and EM (Fig. 3c).
  - reference_id: PMID:33846452
    supporting_text: The principal somatic HA-depolymerizing enzymes, i.e. hyaluronidases,
      are HYAL1 and HYAL2. HA is degraded at the cell surface by the glycosylphosphatidylinositol
      (GPI)-linked HYAL2 into intermediate-size fragments.
  - reference_id: file:HETGA/Hyal2/Hyal2-uniprot.txt
    supporting_text: EC=3.2.1.35
  - reference_id: file:HETGA/Hyal2/Hyal2-uniprot.txt
    supporting_text: Lipid-anchor, GPI-anchor
  knowledge_gaps:
  - gap_statement: It is not established whether Hyal2 makes any material contribution
      to the reduced hyaluronan degradation that underlies very-high-molecular-mass hyaluronan
      accumulation in Heterocephalus glaber, or whether that deficit is carried entirely
      by other enzymes.
    boundary: What is known is that bulk hyaluronidase activity is lower in naked mole
      rat cells and tissues than in mouse, human or guinea pig; that Hyal2 transcript is
      not reduced and is elevated in some tissues; that recombinant naked mole rat HYAL2
      is active with a modest A284G-dependent attenuation; and that the naked mole rat
      TMEM2 ortholog is catalytically dead. What is not known is the relative contribution
      of each enzyme to the tissue-level deficit, because no study has measured HYAL1-
      versus HYAL2-specific activity in naked mole rat tissue.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    status: NARROWING
    significance: This is the central claim that motivates interest in the gene. Without
      the isoenzyme-level attribution, Hyal2 remains a plausible but unproven contributor
      to the species' defining extracellular matrix phenotype.
    provenance:
    - reference_id: PMID:33846452
      supporting_text: Tian et al.24 described a generally reduced hyaluronidase activity
        in the NMR tissues and cultured fibroblasts but the distinction between HYAL1 and
        HYAL2 was not possible and the lymph nodes were not directly examined.
    - reference_id: PMID:39009271
      supporting_text: Thus, unlike mTMEM2, nmrTMEM2 is not a physiological hyaluronidase.
        The inability of nmrTMEM2 to degrade HA might partially account for the high-molecular-weight
        HA accumulation in NMR tissues.
  - gap_statement: The magnitude of the naked mole rat HYAL2 catalytic deficit is unquantified.
      No kcat, Km, pH optimum or specific activity has been measured for this ortholog.
    boundary: The only functional datum is a gel comparison of hyaluronan size and amount
      after three days of incubation with cells expressing wild-type versus G284A naked
      mole rat HYAL2. That establishes direction but not magnitude, and cannot distinguish
      a two-fold from a fifty-fold effect.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Whether the enzyme is marginally or severely attenuated determines whether
      Hyal2 is a bystander or a driver of the species phenotype, and whether the GO molecular
      function should eventually carry a qualifier.
    provenance:
    - reference_id: PMID:38052795
      supporting_text: We did not observe difference when HA was incubated for two days,
        but the size and amount of HA was smaller after three days of incubation (Fig.
        5i), suggesting that the substitution in G284 also contributes to the weaker HYAL2
        in NMRs.
proposed_new_terms:
- proposed_name: regulation of hyaluronan polymer size
  proposed_definition: Any process that modulates the molecular mass distribution of hyaluronan
    polymers in a tissue or extracellular compartment, through the combined control of
    hyaluronan synthase processivity and hyaluronidase activity.
  justification: >-
    The biologically decisive property of hyaluronan in subterranean mammals is not how
    much of it there is but how long the chains are, and no GO term expresses that axis.
    GO has hyaluronan metabolic, biosynthetic and catabolic process terms and a
    regulation term for biosynthesis, but nothing for the product-size phenotype, even
    though it has ample precedent for polymer-length terms elsewhere (GO:0030832
    regulation of actin filament length, GO:0032532 regulation of microvillus length).
    The gap matters because polymer size inverts biological outcome - very-high-molecular
    -mass and shorter high-molecular-mass hyaluronan have opposing effects through CD44
    - and because the naked mole rat phenotype is produced jointly by a synthase and
    several hyaluronidases, so it cannot be captured by annotating any one of them to
    catabolism or biosynthesis alone.
  proposed_parent:
    id: GO:0030212
    label: hyaluronan metabolic process
  supported_by:
  - reference_id: PMID:32398747
    supporting_text: vHMM-HA (>6.1 MDa) has superior cytoprotective properties compared
      to the shorter HMM-HA.
  - reference_id: PMID:23783513
    supporting_text: 'HAase activity of the naked mole-rat cells was much lower than that
      of human, mouse or guinea pig cells (Figure 2c). Similarly, HAase activity was lower
      in the naked mole-rat tissues than in the mouse tissues (Figure 2d). These results
      indicate that two mechanisms contribute to accumulation of HMW-HA in the naked mole-rat:
      more robust synthesis and slower degradation.'
suggested_questions:
- question: How much of the reduced bulk hyaluronidase activity of naked mole rat tissues
    is attributable to HYAL2, as opposed to HYAL1, which is sharply downregulated in heart
    and kidney, or to the catalytically dead TMEM2 ortholog?
  experts:
  - Vera Gorbunova
  - Andrei Seluanov
  - Bruno Flamion
- question: Is naked mole rat HYAL2 a receptor for jaagsiekte sheep retrovirus? Given that
    mouse Hyal2 does not bind Env at all and that the determinants are multi-residue, the
    projected GO:0001618 annotation cannot be evaluated without a direct binding or transduction
    assay.
  experts:
  - A Dusty Miller
- question: Does the naked mole rat pericellular pH microenvironment differ from that of
    mouse or human cells in a way that would reduce HYAL2 activity in vivo without any
    change to the enzyme itself?
  experts:
  - Bruno Flamion
- question: Do the RON/MST1R and TGF-beta1/WWOX interactions reported for human and mouse
    HYAL2 occur in naked mole rat cells, or has the moonlighting scaffold role diverged
    along with the catalytic rate?
  experts:
  - Nan-Shan Chang
suggested_experiments:
- hypothesis: Naked mole rat HYAL2 is a functional but kinetically attenuated hyaluronidase
    rather than a pseudo-enzyme, and the A284G substitution accounts for a measurable but
    modest fraction of the attenuation.
  description: Express and purify soluble naked mole rat, mouse and human HYAL2 ectodomains
    from a baculovirus or mammalian system, as has been done for human soluble HYAL2, and
    determine specific activity, apparent Km for high-molecular-mass hyaluronan and pH-activity
    profiles side by side, including the G284A revertant. This converts the existing qualitative
    gel result into a quantitative statement and would settle whether the GO molecular
    function deserves any qualification in this species.
  experiment_type: recombinant enzyme kinetics
- hypothesis: The tissue-level hyaluronidase deficit in the naked mole rat is carried mainly
    by TMEM2 and HYAL1 rather than by HYAL2.
  description: Perform isoenzyme-resolved hyaluronidase assays on naked mole rat and guinea
    pig tissue extracts, using pH fractionation and isoenzyme-selective inhibition or immunodepletion,
    combined with siRNA or CRISPR knockdown of Hyal1, Hyal2 and Tmem2 individually in naked
    mole rat fibroblasts followed by pulse-field gel measurement of secreted hyaluronan
    size. This addresses the attribution gap that PMID:33846452 explicitly identifies.
  experiment_type: isoenzyme-resolved activity assay and loss-of-function
- hypothesis: Naked mole rat HYAL2 does not function as a jaagsiekte sheep retrovirus entry
    receptor, consistent with the mouse ortholog.
  description: Express naked mole rat HYAL2 in a non-permissive cell line alongside human,
    mouse and sheep HYAL2 controls, and measure JSRV and ENTV pseudotype transduction titre
    and direct Env surface-protein binding by surface plasmon resonance. A negative result
    would convert the REMOVE recorded here from an argument about an unsupported projection
    into a positive experimental finding.
  experiment_type: viral pseudotype transduction and binding assay
- hypothesis: Reduced HYAL2 activity in naked mole rat tissue is environmental rather than
    intrinsic, reflecting a less acidic pericellular microenvironment.
  description: Measure pericellular pH in naked mole rat versus mouse and guinea pig fibroblasts
    using ratiometric membrane-targeted pH sensors, and test whether pharmacological or
    genetic manipulation of Na+/H+ exchanger-1 activity restores hyaluronan degradation
    in naked mole rat cells to control levels. HYAL2 requires local acidification to work
    pericellularly, so this is a route to the phenotype that leaves the enzyme untouched
    and that no study has examined.
  experiment_type: live-cell pH imaging with pharmacological rescue
