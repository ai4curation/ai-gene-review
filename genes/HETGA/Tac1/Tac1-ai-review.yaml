    status: OPEN
    significance: >-
      The species is famous for a substance P phenotype, but a second tachykinin with a
      different receptor and a largely visceral distribution comes from the same gene and
      has never been looked at. It is the most likely place for a compensating or
      preserved tachykinin function to be hiding.
    resolution: >-
