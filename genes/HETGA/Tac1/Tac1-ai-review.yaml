- id: PMID:18232734
  title: Selective inflammatory pain insensitivity in the African naked mole-rat (Heterocephalus
    glaber).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary source for the naked mole-rat phenotype and the single most important
      paper for this gene. Two things matter here beyond the famous headline: the
      absence of substance P is stated as being in the skin innervation specifically,
      and the authors reintroduced the preprotachykinin gene into naked mole-rat sensory
      neurons with an HSV vector and recovered capsaicin-induced thermal hyperalgesia.
      The construct carried a rat beta-PPT cDNA, so this shows the naked mole-rat
      downstream pathway is competent rather than assaying the naked mole-rat protein.
- id: PMID:20497578
  title: Absence of histamine-induced itch in the African naked mole-rat and "rescue"
    by Substance P.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Intrathecal substance P restores histamine-evoked scratching in an animal that
      otherwise shows none. Together with PMID:21200438 this is the functional
      demonstration that the naked mole-rat neurokinin system responds normally to its
      ligand, which is what keeps the molecular-function annotation defensible.
- id: PMID:21200438
  title: 'Functional neurokinin and NMDA receptor activity in an animal naturally lacking
    substance P: the naked mole-rat.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The title is the over-simplification this review has to correct, and the paper's
      own discussion corrects it: it states that substance P and CGRP have been
      identified in presumptive visceral sensory fibres and that peptidergic
      neurotransmission does occur in this species. Read past the title. The
      pharmacology (SP sensitises, GR-82334 reverses, APV reverses) is the strongest
      evidence that the naked mole-rat NK1 receptor is functional.
- id: PMID:31992138
  title: Acid and inflammatory sensitisation of naked mole-rat colonic afferent nerves.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct immunohistochemical demonstration of CGRP-positive extrinsic sensory fibres
      in naked mole-rat colonic mesentery and myenteric plexi. Corroborates the
      tissue-restricted, rather than global, loss of peptidergic innervation. It shows
      CGRP, not substance P, so it supports the general claim by analogy rather than
      directly.
- id: PMID:32206859
  title: 'Independent evolution of pain insensitivity in African mole-rats: origins and
    mechanisms.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Review by the groups that did the primary work. Valuable for the precise wording
      of the phenotype (skin fibres virtually devoid of immunostaining, small-diameter
      somata essentially absent of it) and for stating that naked mole-rats have
      visceral fibres positive for CGRP. Being a review, its visceral claim is a
      citation to Park et al. 2003 and Hockley et al. 2020 rather than a primary figure.
- id: PMID:32478202
  title: The naked mole-rat has a functional purinergic pain pathway despite having a
    non-functional peptidergic pain pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Qualifies its own title in its abstract: the neuropeptides are absent from
      cutaneous C-fibres, which makes the peptidergic pathway hypofunctional. Also shows
      that intrathecal substance P enhances the formalin-induced response, i.e. the
      inflammatory-pain capability is retained and merely unmasked. This is the paper
      that decides KEEP_AS_NON_CORE rather than REMOVE on GO:0006954.
- id: PMID:32880221
  title: Naked mole-rats lack cold sensitivity before and after nerve injury.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited only for its one-line restatement that naked mole-rats lack CGRP and
      substance P in nociceptive C fibres, which is background rather than new evidence
      about this gene. The paper itself is about cold sensitivity.
- id: PMID:34424517
  title: The Somatosensory World of the African Naked Mole-Rat.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the local cache (full_text_available is false). The abstract is
      about TrkA and NaV1.7 and does not mention substance P or tachykinins at all, so
      nothing in this review is drawn from it. Retained as general background on naked
      mole-rat somatosensation; no supporting_text is quoted from it.
- id: PMID:34476892
  title: "The naked truth: a comprehensive clarification and classification of current
    'myths' in naked mole-rat biology."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Does not list "naked mole-rats lack substance P" among its 28 myths, so it does
      not adjudicate that specific claim; stated here rather than implied, because it
      would be easy to over-read this paper. What it does supply is the adjacent
      correction (Myth 10, feeling no pain, answered by emphasising selectivity) and the
      observation that substance P signalling under hypercapnia is diminished rather
      than absent. Both support treating the substance P story as tissue- and
      condition-restricted.
- id: file:HETGA/Tac1/Tac1-uniprot.txt
  title: UniProt record for naked mole-rat Tac1 (A0A0P6JY17)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      TrEMBL, unreviewed, PE 3 (inferred from homology); all FUNCTION and SUBCELLULAR
      LOCATION statements are ARBA/RuleBase-derived rather than curated for this
      protein. Its sequence and its SignalP/SMART features are primary data and are used
      as such; its FUNCTION prose is used only where it agrees with the sequence or with
      an independent source. Note that it carries no PEPTIDE features, so it does not by
      itself say whether substance P is in this isoform.
- id: file:HETGA/Tac1/Tac1-bioinformatics/RESULTS.md
  title: 'Tac1 (HETGA, A0A0P6JY17): where are the processed tachykinin peptides?'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis performed for this review. Gap-free comparison of A0A0P6JY17 against the
      reviewed human entry P20366 (both are the same length bar one C-terminal residue),
      transferring the human PEPTIDE coordinates and independently re-checking each
      transferred peptide against the tachykinin F-x-G-L-M consensus and its downstream
      Gly-amide plus dibasic site. Reproducible from peptide_boundaries.py; output.txt
      is the verbatim run.
- id: file:HETGA/Tac1/Tac1-deep-research-falcon.md
  title: 'Functional annotation report: Heterocephalus glaber Tac1'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Species-specific deep-research report (Edison/falcon). Unlike the affinage
      human-ortholog record it is about the naked mole rat, it correctly excludes Tac2
      and the unrelated symbol collisions, and it reaches the same central conclusion
      reached independently here from the primary papers: the locus is intact and the
      absence of substance P is a cutaneous expression restriction rather than a change
      in the protein. Its own reasoning was spot-checked against the cached primary
      papers before use and matched. Two leads it supplied that the cached corpus does
      not contain are recorded in the notes rather than curated here, because neither is
      verifiable from the local cache: a 2025 book chapter devoted to this exact question
      (Zhao et al., "Life without substance P: The naked mole rat",
      doi:10.1016/b978-0-443-22194-1.00013-6), and CAP-TAC1, a capped TAC1-derived
      circulating tachykinin-receptor agonist reported in mouse and human
      (doi:10.1038/s41467-023-43857-0) and explicitly not shown in this species. Its
      orthology-based sections are appropriately labelled as such by the report itself.
- id: file:HETGA/Tac1/Tac1-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for TAC1 (human)
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Machine-generated record for the HUMAN ortholog (P20366), supplied as a
      conserved-mechanism baseline because affinage does not run on non-human species.
      Two limitations, recorded because provider recall is being measured. First, it
      contains no naked mole-rat content: none of its 36 citations is a naked mole-rat
      paper, and none of the six papers that actually decide this review appears in it,
      so it contributed nothing to any curation call. Second, its corpus is contaminated
      by symbol collisions - roughly a third of its findings table describes C. elegans
      TAC-1 (a TACC microtubule-associated protein), Candida Tac1 (a zinc-cluster
      transcription factor) or rice TAC1 (tiller angle control) rather than the
      tachykinin precursor. It flags this itself, but the table is unsafe to consume
      wholesale. Its mechanism_profile GO grounding was not imported; every term here
      was re-grounded against QuickGO. Genuinely useful for the mouse Tac1-knockout
      pleiotropy literature it collects.
existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Protachykinin-1 is a secreted preproprotein: it carries a cleaved N-terminal
      signal peptide and is processed to tachykinins that act on cell-surface neurokinin
      receptors on other cells, so both the precursor and its products are
      extracellular.
    action: ACCEPT
    reason: >-
      This is the least contentious row in the set and nothing about the naked mole rat
      bears on it. The keyword mapping (UniProtKB-SubCell:SL-0243, Secreted) is
      corroborated independently within the same record by a SignalP-predicted signal
      peptide at residues 1-19, and by the biology of the mature products: substance P
      and neurokinin A are agonists of cell-surface GPCRs and must be released to act.
      The human ortholog P20366 carries GO:0005576 with experimental (EXP) evidence as
      well as a PAINT IBA. Retained as core, because being secreted is part of what this
      gene product is for, not an incidental location.
    supported_by:
    - reference_id: file:HETGA/Tac1/Tac1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Secreted'
    - reference_id: file:HETGA/Tac1/Tac1-bioinformatics/RESULTS.md
      supporting_text: >-
        only `SIGNAL 1..19`, `CHAIN 20..130`, and two SMART `Tachykinin` domain calls at
        `58..68` and `97..107`
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0243
        source_label: Secreted
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Keyword itself is ARBA-derived for this entry, but is independently
          corroborated by the SignalP signal peptide in the same record.
- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Tachykinins are canonical mediators of neurogenic inflammation in mammals, and the
      naked mole rat retains the capability - intrathecal substance P enhances its
      formalin response. But the principal route by which substance P drives
      inflammation in other mammals, release from peptidergic cutaneous C-fibre
      terminals, is precisely the arm documented to be hypofunctional in this species.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the one row where the naked-mole-rat literature legitimately changes the
      curation call, and it changes it to non-core rather than to REMOVE. Two facts pull
      in opposite directions and both must be respected. On one side, the peptidergic
      inflammatory arm is explicitly described as hypofunctional in this species, and
      the animal shows selective insensitivity to inflammatory pain (PMID:18232734); a
      blanket involved_in inflammatory response transferred from a PANTHER node founded
      on mouse and human data therefore overstates what this protein routinely does in
      the intact naked mole rat. On the other side, the capability is demonstrably
      retained, not lost: adding substance P back enhances the formalin-induced
      response, which is exactly what would not happen if the annotation were wrong.
      There is also no evidence either way about the visceral or immune substance P
      pool, where the peptide is present (PMID:21200438). REMOVE would assert something
      false about the protein; ACCEPT would present a contextual, largely latent role as
      a core function. Keep it, marked non-core.
    supported_by:
    - reference_id: PMID:32478202
      supporting_text: >-
        naked mole-rats do not express neuropeptides, such as Substance P and calcitonin
        gene-related peptide in their cutaneous C-fibers, effectively making the
        peptidergic pain pathway hypofunctional
    - reference_id: PMID:32478202
      supporting_text: >-
        here we showed that intrathecal SP administration enhanced the formalin-induced
        pain response in naked mole-rats, suggesting that activation of the peptidergic
        pathway is important for the full behavioral response
    - reference_id: PMID:32478202
      supporting_text: >-
        In most mammals, TRPV1+ peptidergic C-fibers synapse in lamina I of the spinal
        cord where the neurokinin I receptor (NK1r) for SP is also expressed
    - reference_id: PMID:34476892
      supporting_text: have diminished substance P signalling under hypercapnia
    - reference_id: PMID:31992138
      supporting_text: >-
        CGRP-positive extrinsic neuronal varicosities were identified encircling and
        tracking with blood vessels within the mesentery supplying the distal colon of NMR
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000134172
        source_label: TreeGrafter ancestral node (PTHR11250, TACHYKININ)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node placement is sound; the human ortholog P20366 carries GO:0006954 as a
          PAINT IBA. The qualification is target-specific tissue context, not a fault in
          the node.
- term:
    id: GO:0007217
    label: tachykinin receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      The naked mole-rat precursor encodes two peptides that literally satisfy this
      term's definition, and the naked mole-rat spinal cord contains a neurokinin-1
      receptor that responds to substance P with the expected agonist and antagonist
      pharmacology.
    action: ACCEPT
    reason: >-
      The GO definition of this term specifies a tachykinin as a short peptide with the
      terminal sequence Phe-X-Gly-Leu-Met-NH2. Both peptides encoded here end in exactly
      that motif (FFGLM at 64-68, FVGLM at 103-107), each followed by the glycine that
      donates the amide and by a dibasic KR convertase site, so the sequence itself
      satisfies the definition rather than merely resembling something that does. The
      pathway is then shown to be operational in this species: NK1 receptor
      immunoreactivity is present in superficial dorsal horn neurons, intrathecal
      substance P sensitises heat-evoked withdrawal, and the NK1R antagonist GR-82334
      reverses that sensitisation, which the authors take as showing the receptor is
      normal. The tissue-restricted absence of the peptide from cutaneous fibres does
      not touch this annotation: GO records what a gene product does, not which cells
      choose to express it, and the add-back experiments confirm rather than undermine
      the pathway assignment. Core.
    supported_by:
    - reference_id: file:HETGA/Tac1/Tac1-bioinformatics/RESULTS.md
      supporting_text: >-
        Both tachykinin cores end in the `F-x-G-L-M` consensus that the `GO:0007217`
        definition uses to define a tachykinin, and both are immediately followed by
        `G-K-R`
    - reference_id: PMID:18232734
      supporting_text: >-
        we were able to detect the neurokinin-1 (NK1) receptor immunoreactivity in naked
        mole-rat superficial spinal cord neurons
    - reference_id: PMID:21200438
      supporting_text: >-
        SP also sensitized foot withdrawal responses in naked mole-rats, an effect most
        clearly observed at the highest dose tested
    - reference_id: PMID:21200438
      supporting_text: This shows that NK1 receptors function normally in the naked mole-rat
    - reference_id: file:HETGA/Tac1/Tac1-uniprot.txt
      supporting_text: Belongs to the tachykinin family.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR008215
        source_label: Tachykinin_dom
        source_status: SUPPORTS_TRANSFER
        comment: Domain match is corroborated residue-by-residue by the F-x-G-L-M check.
      - source_id: PANTHER:PTN000134172
        source_label: TreeGrafter ancestral node (PTHR11250, TACHYKININ)
        source_status: SUPPORTS_TRANSFER
- term:
    id: GO:0031835
    label: substance P receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Naked mole-rat substance P is identical in sequence to human substance P, and the
      naked mole-rat NK1 receptor binds and responds to it: intrathecal substance P
      sensitises nociceptive behaviour and rescues histamine itch, and both effects are
      reversed by an NK1R antagonist.
    action: ACCEPT
    reason: >-
      This is the annotation that the naked-mole-rats-lack-substance-P framing would
      tempt a reviewer to remove, and removing it would be wrong. The claim in the
      literature is about where the peptide is made, not about what it is: substance P
      occupies positions 58-68 of this precursor as RPKPQQFFGLM, with zero substitutions
      relative to human, and the flanking amidation and dibasic cleavage signals are
      conserved. The binding itself is then demonstrated in this species by intervention
      rather than inferred - exogenous substance P produces NK1R-dependent sensitisation
      that the antagonist GR-82334 reverses, and re-expressing preprotachykinin in naked
      mole-rat sensory neurons restores capsaicin-evoked thermal hyperalgesia. A
      cell-type-restricted loss of expression is not a change in molecular function, and
      GO has no slot for expression pattern on an MF annotation; encoding it as REMOVE
      would assert that this protein cannot engage an NK1 receptor, which the rescue
      experiments directly refute. Core.
    supported_by:
    - reference_id: file:HETGA/Tac1/Tac1-bioinformatics/RESULTS.md
      supporting_text: >-
        `RPKPQQFFGLM` occupies exactly positions 58-68, the same coordinates as in the
        reviewed human entry, with zero substitutions.
    - reference_id: PMID:20497578
      supporting_text: >-
        following intrathecal SP administration, naked mole-rats displayed robust
        scratching behavior in response to histamine that was significantly greater than
        after intrathecal saline
    - reference_id: PMID:20497578
      supporting_text: >-
        We propose that addition of SP activates superficially located neurons
        expressing neurokinin-1 receptors and thus increases the excitatory drive into
        the superficial laminae
    - reference_id: PMID:18232734
      supporting_text: >-
        We used a neurotropic virus to reintroduce PPT gene expression into naked
        mole-rat sensory neurons and found that capsaicin could now induce thermal
        hyperalgesia in the treated mole-rats
    - reference_id: PMID:21200438
      supporting_text: >-
        These results indicate that spinal neurons in naked mole-rats have functional SP
        and NMDA receptors, but that these receptors do not participate in heat-evoked
        foot withdrawal unless SP is experimentally introduced
    - reference_id: file:HETGA/Tac1/Tac1-deep-research-falcon.md
      supporting_text: >-
        In the naked mole-rat, the coding locus is apparently intact, but SP expression is
        selectively absent from cutaneous peptidergic C-fibers.
    - reference_id: file:HETGA/Tac1/Tac1-deep-research-falcon.md
      supporting_text: >-
        This should not be generalized to complete organism-wide absence: SP- and
        CGRP-positive presumptive sensory fibers have been reported in visceral tissues,
        suggesting tissue- or neuronal-subtype-specific regulation
    - reference_id: PMID:32880221
      supporting_text: >-
        NMRs also lack calcitonin gene-related peptide (CGRP) and substance P in
        nociceptive C fibers
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000134172
        source_label: TreeGrafter ancestral node (PTHR11250, TACHYKININ)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human P20366 carries GO:0031835 as a PAINT IBA. The transfer is additionally
          confirmed target-side: the naked mole-rat substance P sequence is identical to
          human and its receptor is pharmacologically functional in this species.
      residue_claims_not_applicable: >-
        The argument here is the inverse of a residue-loss claim - it is that the mature
        peptide is fully conserved, which is recorded as a whole-peptide identity in the
        bioinformatics results rather than as a claim about individual sites.
- term:
    id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Correct, and well grounded upstream: substance P binding to Gq-coupled NK1
      receptors activates phospholipase C and releases calcium via IP3, and the human
      ortholog from which this row was projected carries the same term with direct-assay
      evidence. It is nonetheless a generic downstream readout rather than a
      distinguishing function.
    action: KEEP_AS_NON_CORE
    reason: >-
      No doubt about correctness is intended by this action. The row is an Ensembl
      Compara projection from human TAC1 (UniProtKB:P20366 / ENSP00000321106) together
      with the PANTHER node, and checking the human record shows GO:0007204 there
      carries an IDA (PMID:8957234) as well as a PAINT IBA, so the source is
      experimentally grounded rather than inferred-only. The mechanism is also the one
      the naked mole-rat authors themselves invoke to explain their spinal substance P
      results. The reason for non-core is granularity, not doubt: raising cytosolic
      calcium is the effector consequence shared by essentially every Gq-coupled ligand,
      and what identifies this protein is the tachykinin receptor engagement captured by
      GO:0007217 and GO:0031835. A more informative term for the same biology,
      GO:0007209, is proposed below as a new annotation.
    supported_by:
    - reference_id: PMID:21200438
      supporting_text: >-
        the binding of SP to NK1 receptors, which leads to phospholipase C (PLC)
        activation and subsequent IP3-mediated calcium release
    - reference_id: file:HETGA/Tac1/Tac1-uniprot.txt
      supporting_text: activation of G(q) and phosphatidylinositol
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P20366
        source_label: human TAC1 (protachykinin-1)
        source_status: SUPPORTS_TRANSFER
