  - gap_statement: >-
      The neurokinin A arm of this gene is entirely uncharacterised in Heterocephalus
      glaber. Neurokinin A has never been detected in this species, no naked mole-rat
      TACR2 pharmacology exists, and it is unknown whether the visceral peptidergic
      fibres that persist here use neurokinin A, substance P, or both.
    boundary: >-
      Firmly established from sequence: the precursor carries neurokinin A at residues
      98-107 with zero substitutions relative to human, followed by intact amidation and
      dibasic processing signals, and UniProt annotates the gene product as a TACR2
      ligand.
    gap_kind:
