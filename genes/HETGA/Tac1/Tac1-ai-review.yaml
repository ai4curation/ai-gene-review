proposed_new_terms: []
suggested_questions:
- question: >-
    Is the absence of substance P from naked mole-rat cutaneous C-fibres transcriptional
    - Tac1 simply not expressed in those neurons - or is the peptidergic nociceptor
    population itself reduced or missing? The distinction matters for how the phenotype
    should be represented, because only the first is compatible with a normal Tac1 gene
    in a normal cell type.
  experts:
  - Gary R. Lewin
  - Ewan St. John Smith
  - Thomas J. Park
- question: >-
    In which naked mole-rat tissues is mature, amidated substance P actually present, and
    at what concentration relative to mouse? Every existing statement rests on
    immunohistochemistry in skin, DRG and spinal cord; there is no quantification
    anywhere, including in the viscera where the peptide is reported to persist.
  experts:
  - Ewan St. John Smith
  - Thomas J. Park
- question: >-
    Does the naked mole rat produce neurokinin A, and is its neurokinin-2 receptor
    (TACR2) functional? The whole species literature concerns substance P and NK1R, yet
    the precursor encodes neurokinin A identically to human, so a second, entirely
    unexamined tachykinin arm exists.
  experts:
  - Ewan St. John Smith
- question: >-
    Which preprotachykinin splice forms (alpha, beta, gamma, delta) does the naked mole
    rat transcribe, and in what proportions across skin, viscera and hypothalamus? The
    UniProt entry declares no alternative products, so the isoform repertoire of this
    species is unknown.
  experts: []
- question: >-
    Does the naked mole rat produce CAP-TAC1, the capped (pyroglutamylated, amidated)
    TAC1-derived circulating peptide recently described in mouse and human plasma? If a
    third class of product comes from this locus and acts on tachykinin receptors from
    the circulation, then an animal characterised as lacking substance P in one tissue
    might nonetheless have a systemic tachykinin tone that nobody has looked for.
  experts: []
- question: >-
    Given that Tac1 is expressed in the naked mole-rat hypothalamus, do the
    non-nociceptive roles established for Tac1 in mouse - energy balance, reproductive
    timing, affective behaviour - operate normally in this species? The cutaneous
    phenotype has attracted all the attention, but nothing predicts that the central
    functions are affected.
  experts:
  - Thomas J. Park
suggested_experiments:
- hypothesis: >-
    Tac1 mRNA is absent or strongly reduced specifically in naked mole-rat
    small-diameter cutaneous nociceptors, while being expressed at normal levels in
    visceral afferent and central neurons.
  description: >-
    Single-cell or single-nucleus RNA-seq of naked mole-rat dorsal root ganglia, with
    matched mouse DRG processed in parallel, quantifying Tac1 alongside Calca, Trpv1,
    P2rx3 and IB4-binding markers. Retrograde labelling from skin versus colon before
    dissociation would separate the cutaneous and visceral afferent populations so that
    Tac1 expression can be compared between them within the same animal. This directly
    distinguishes the gene being switched off in these neurons from the neurons being
    absent.
  experiment_type: single-cell transcriptomics with retrograde tracing
- hypothesis: >-
    Naked mole-rat tissues contain mature amidated substance P and neurokinin A, at
    levels that are low in skin but comparable to mouse in gut and hypothalamus.
  description: >-
    Targeted LC-MS/MS quantification of amidated substance P and neurokinin A in naked
    mole-rat skin, dorsal root ganglia, spinal cord, colon and hypothalamus, using
    stable-isotope-labelled synthetic peptide standards and mouse tissue as the
    comparator. Because the naked mole-rat and human peptides are sequence-identical,
    existing human standards and transitions can be used unmodified. This would replace
    the entire immunohistochemical evidence base with quantitative measurements and
    would show whether the conserved amidation and dibasic sites are actually used in
    vivo.
  experiment_type: targeted quantitative peptidomics
- hypothesis: >-
    The naked mole-rat neurokinin-2 receptor is functional and responds to naked
    mole-rat neurokinin A with potency comparable to the human pair.
  description: >-
    Express naked mole-rat TACR2 and, as a control, naked mole-rat TACR1 in a
    heterologous cell line and measure Gq-coupled responses (IP1 accumulation and
    calcium mobilisation) to synthetic naked mole-rat neurokinin A and substance P
    across a concentration range, with the human receptor-ligand pairs run alongside.
    This closes the arm of the pathway that no naked mole-rat study has examined, and it
    tests the sequence-inferred GO:0031837 annotation proposed here rather than leaving
    it as a homology assertion.
  experiment_type: heterologous receptor pharmacology
- hypothesis: >-
    Peptidergic innervation persists in naked mole-rat viscera, and substance P
    immunoreactivity - not only CGRP - can be demonstrated there directly.
  description: >-
    Whole-mount immunohistochemistry for substance P and CGRP, with PGP9.5 as a
    pan-neuronal counterstain, on naked mole-rat colon, bladder and mesentery alongside
    skin from the same animals, using mouse tissue as a positive control and peptide
    pre-adsorption as the specificity control. The visceral substance P claim currently
    propagates through review prose citing older work, and only CGRP has been shown
    directly in the cached colonic study; this would supply the missing primary image
    for substance P itself.
  experiment_type: comparative immunohistochemistry
