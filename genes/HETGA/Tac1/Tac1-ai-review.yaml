  knowledge_gaps:
  - gap_statement: >-
      Whether mature, amidated substance P is actually produced from this precursor in
      the naked mole rat has never been measured. Every naked mole-rat observation of the
      peptide is immunohistochemical, so the conserved amidation and dibasic cleavage
      sites are inferred to be used rather than shown to be used, and no tissue
      concentration is known for any organ.
    boundary: >-
      Firmly established: the gene is present and transcribed, the encoded substance P
      sequence is identical to human, the processing signals are intact, and the naked
      mole-rat NK1 receptor responds normally to exogenous substance P.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      The whole naked mole-rat pain literature turns on the peptide being absent from
      one compartment and present in others, yet the peptide itself has never been
      quantified anywhere in this species.
    resolution: >-
      Targeted LC-MS/MS of amidated substance P and neurokinin A across naked mole-rat
      skin, DRG, spinal cord, colon and hypothalamus against mouse comparators.
    provenance:
