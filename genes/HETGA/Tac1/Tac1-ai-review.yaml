core_functions:
- description: >-
    Acts as the secreted precursor of substance P and, after processing at paired basic
    residues and C-terminal amidation, releases substance P as an agonist of the
    neurokinin-1 receptor (TACR1) on target cells. In the nervous system this is the
    peptidergic arm by which primary afferents drive second-order neurons in the
    superficial dorsal horn, producing NK1R-dependent sensitisation of nociceptive and
    pruritic responses. The naked mole-rat peptide is identical in sequence to human
    substance P and its receptor is pharmacologically normal in this species; what
    differs is that the peptide is not made in cutaneous C-fibre nociceptors.
