id: A0A0P6JY17
gene_symbol: Tac1
aliases:
- PPT
- PPT-A
- protachykinin-1
- preprotachykinin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  Tac1 encodes protachykinin-1 (PPT), the secreted precursor of the tachykinin
  neuropeptides substance P and neurokinin A. A cleaved signal peptide directs the
  130-residue preproprotein into the secretory pathway, where prohormone convertases
  cut at paired basic residues and a donor glycine is converted into the C-terminal
  amide that neurokinin receptors require for potency. The naked mole-rat precursor has
  the beta-preprotachykinin architecture: substance P (RPKPQQFFGLM, residues 58-68) and
  neurokinin A (HKTDSFVGLM, residues 98-107) occupy the same positions as in the human
  protein, both mature peptides are identical in sequence to their human counterparts,
  and both amidation and dibasic cleavage sites are conserved. Once released, substance
  P acts on the neurokinin-1 receptor (TACR1) and neurokinin A on the neurokinin-2
  receptor (TACR2); both are Gq-coupled, so agonist binding drives phospholipase C
  activation, inositol trisphosphate production and a rise in cytosolic calcium in the
  target cell. Through these receptors tachykinins excite neurons, contract smooth
  muscle, dilate blood vessels, and relay nociceptive and pruritic signals from primary
  afferents onto second-order neurons in the superficial dorsal horn. In the naked
  mole-rat the peptide has a distinctive anatomical distribution: substance P and CGRP
  immunoreactivity are absent from cutaneous C-fibre nociceptors and from small-diameter
  dorsal root and trigeminal ganglion somata, while peptidergic fibres persist in
  visceral afferents, and the gene is transcribed in the hypothalamus among other
  tissues. The neurokinin-1 receptor remains present and pharmacologically normal in the
  superficial dorsal horn of this species, so introducing substance P intrathecally, or
  re-expressing preprotachykinin in its sensory neurons, restores capsaicin-evoked
  nocifensive behaviour, thermal hyperalgesia and histamine-induced scratching. This
  regional restriction of where the peptide is made, rather than any change to the
  protein itself, underlies the animal's selective insensitivity to inflammatory pain
  and to pruritogens.
