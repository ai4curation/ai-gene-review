      supporting_text: >-
        in the naked mole-rat, unmyelinated fibers in the skin were observed to be
        virtually devoid of SP and CGRP immunostaining
    - reference_id: PMID:21200438
      supporting_text: >-
        although SP is absent from naked mole-rat cutaneous C-fibers, both SP and CGRP
        have been identified in presumptive sensory fibers in the viscera
- description: >-
    The same precursor also releases neurokinin A, which acts on the neurokinin-2
    receptor (TACR2, the substance K receptor), typically on smooth muscle and in
    visceral tissue, where tachykinin receptor engagement drives Gq-coupled phospholipase
    C activation. Naked mole-rat neurokinin A is identical in sequence to the human
    peptide and its processing sites are conserved, but nothing in the naked mole-rat
    experimental literature addresses this arm.
