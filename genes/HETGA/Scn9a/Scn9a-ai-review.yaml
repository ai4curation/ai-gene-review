      the low acid-sensitivity of sensory neuron of the African naked mole-rat (ANMr)
      was reported to be due to a strong proton-evoked block of ANMrNav1.7
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - reference_id: file:HETGA/Scn9a/Scn9a-deep-research-falcon.md
