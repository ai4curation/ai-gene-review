- term:
    id: GO:0086010
    label: membrane depolarization during action potential
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Sodium influx through this channel is what depolarizes the membrane during the
      upstroke of the action potential. This is the mechanistic biological process of a
      NaV alpha subunit and the step that fails in naked mole-rat nociceptors when the
      channel is blocked by protons.
    action: ACCEPT
    reason: >-
      Correct, specific, and the process on which the entire naked-mole-rat acid
      phenotype turns: when the variant channel is proton-blocked, the depolarization
      that would initiate the action potential does not occur, which is why acid
      silences rather than excites these neurons.
    supported_by:
    - reference_id: PMID:34476892
      supporting_text: >-
        The gene variant in question renders the NaV1.7 channel more susceptible to
        inhibition by acid, thus shutting down action potential firing in nociceptor
        fibres.
      reference_section_type: DISCUSSION
    - reference_id: PMID:32206859
      supporting_text: >-
        Voltage-gated sodium channels are necessary for action potential initiation and
        propagation
      reference_section_type: RESULTS
    propagation_review:
