- term:
    id: GO:0019228
    label: neuronal action potential
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      NaV1.7 is the channel that sets the threshold for action potential initiation in
      peripheral sensory neurons. In the naked mole-rat this function is intact: the
      species shows normal nocifensive responses to noxious heat and mechanical
      stimuli, which requires nociceptors that fire normally, and the acid phenotype is
      specifically a failure of action potential initiation under acidification.
    action: ACCEPT
    reason: >-
      This is the process term the naked-mole-rat literature actually argues about. The
      published mechanism is that acid prevents action potential initiation in this
      species by blocking this channel, which presupposes that the channel drives
      action potential initiation in the first place. Neither the projection nor the
      species-specific variant gives any reason to doubt participation in neuronal
      action potentials; only the pH dependence of that participation differs.
    supported_by:
    - reference_id: PMID:32206859
      supporting_text: >-
        Voltage-gated sodium channels are necessary for action potential initiation and
        propagation
      reference_section_type: RESULTS
    - reference_id: PMID:34476892
      supporting_text: >-
        Normal nocifensive responses were reported for noxious heat and mechanical
        stimuli.
      reference_section_type: DISCUSSION
    - reference_id: PMID:22174253
      supporting_text: >-
        Thus, evolutionary pressure has selected for an Na(V)1.7 gene variant that tips
        the balance from proton-induced excitation to inhibition of action potential
        initiation to abolish acid nociception.
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000004433
        source_label: PAINT node cited by the TreeGrafter row
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The naked mole-rat protein sits inside the NaV1.7 subfamily that inherited
          this role, and the species-specific literature corroborates it directly.
