proposed_new_terms:
- proposed_name: proton-inhibited voltage-gated sodium channel activity
  proposed_definition: >-
    Voltage-gated sodium channel activity in which an increase in extracellular proton
    concentration (a fall in extracellular pH) reduces or blocks sodium conduction
    through the channel, so that acidification decreases rather than increases the
    sodium current the channel carries.
  proposed_parent:
    id: GO:0005248
    label: voltage-gated sodium channel activity
  justification: >-
    The Gene Ontology currently has no way to state that a channel's own conductance is
    suppressed by protons, and this is the defining functional property of naked
    mole-rat NaV1.7 and of the convergent variants found in hibernating and other
    acid-tolerant mammals. Each candidate existing term fails for a specific reason,
    checked against QuickGO rather than assumed. GO:0160128 pH-gated monoatomic ion
    channel activity and its sodium child GO:0160125 are defined as channels that open
    in response to a change in pH, which is the ASIC/TRPV1 behaviour that naked
    mole-rat NaV1.7 pointedly does not show; asserting them here would state the
    opposite of the published mechanism. GO:1905150 regulation of voltage-gated sodium
    channel activity is a biological process describing a regulator gene product, and
    its negative-regulation counterpart GO:1905151 is obsolete as of 2025-04-08 with no
    replacement and no consider term, carrying the comment that it was obsoleted
    because it represents a molecular function, so the concept was explicitly moved to
    the molecular function branch without the molecular function term being created.
    GO:0016248 channel inhibitor activity and GO:0019871 sodium channel inhibitor
    activity describe the inhibitor, not the inhibited channel, and the inhibitor here
    is a proton rather than a gene product. GO:1901691 proton binding is discouraged by
    GO's own comment on GO:0160128, which notes that pH effects on transporters work by
    protonation of specific residues rather than by proton binding. The biological
    process terms GO:0010447 response to acidic pH and GO:0071468 cellular response to
    acidic pH describe a cellular or organismal response and cannot capture a gating
    property of the channel.
  supported_by:
  - reference_id: PMID:22174253
    supporting_text: >-
      We describe a species-specific variant of the nociceptor sodium channel
      Na(V)1.7, which is potently blocked by protons and can account for acid
      insensitivity in this species.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - reference_id: PMID:32206859
    supporting_text: >-
      It should be noted that EKE variant has been shown experimentally to increase the
      proton block of the NaV1.7 channel.
    reference_section_type: RESULTS
  - reference_id: PMID:24352952
    supporting_text: >-
      Our analyses revealed a functional convergence of amino acid sequences, which
      occurred at least six times independently in mammals that hibernate.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - reference_id: PMID:28939386
    supporting_text: >-
      Our data confirms that a negative charge of a postulated proton-motif encodes for
      a high proton-sensitivity when inserted into hNav1.7.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Should GO create a molecular function term for a channel whose conduction is
    inhibited by extracellular protons, given that GO:1905151 was obsoleted in 2025 on
    the grounds that the concept belongs in the molecular function branch, but no
    molecular function term was created in its place?
- question: >-
    Is enhanced proton block of NaV1.7 better captured as a molecular function of the
    channel, or as a gene-product-independent modulation that GO should not attempt to
    represent at all? The blocking species is a proton, not a gene product, which is
    what makes the existing regulator-centred and inhibitor-centred terms unusable.
- question: >-
    G9DCX3 is a fragment missing 22 N-terminal and 87 C-terminal residues relative to
    human NaV1.7. Is this the accession GO should annotate for naked mole-rat Scn9a, or
    should annotations move to a genome-derived full-length model once one is
    available? The fragment is the sequence tied to the primary literature, which is a
    real argument for keeping it.
- question: >-
    Does the domain III variant set reported as unique to acid-insensitive African
    mole-rats contribute to proton block, and if so should the two regions be described
    as one functional site?
suggested_experiments:
- hypothesis: >-
    The acidic EKE triplet in the domain IV S5-pore linker is necessary, and not merely
    sufficient, for the enhanced proton block of naked mole-rat NaV1.7.
  description: >-
    Reciprocal mutagenesis in the naked mole-rat channel itself: convert the domain IV
    EKE triplet at G9DCX3 positions 1698-1700 back to the mammalian KKV and measure
    proton block and pH-dependent shifts in activation and inactivation in a
    heterologous expression system. The published work reported the converse
    experiment, moving naked mole-rat residues into the human protein, so testing the
    loss-of-adaptation direction would close the loop.
- hypothesis: >-
    The triplet acts through local electrostatics at the outer pore rather than through
    the voltage sensors.
  description: >-
    Structural or accessibility mapping of the protonation site: cryo-EM of the naked
    mole-rat channel, or cysteine-accessibility scanning of the domain IV S5-pore
    linker, at low and neutral extracellular pH, comparing the naked mole-rat and
    mouse channels.
- hypothesis: >-
    The domain III variants unique to acid-insensitive African mole-rats add to the
    proton block conferred by the domain IV triplet.
  description: >-
    Measure proton block of naked mole-rat NaV1.7 with the domain III variants reverted
    to the mammalian consensus while the domain IV EKE triplet is left intact, and in
    the double-reverted channel, to test additivity.
- hypothesis: >-
    Naked mole-rat NaV1.7 occupies the same neuronal subcompartments as its human and
    mouse orthologs.
  description: >-
    Immunolocalisation of NaV1.7 in naked mole-rat dorsal root ganglia and skin, asking
    whether the channel occupies axons, intraepidermal terminals and nodes of Ranvier.
    This is the missing evidence that currently limits the cellular component
    annotation to plasma membrane.
- hypothesis: >-
    The EKE state tracks burrow hypercapnia rather than hystricomorph phylogeny.
  description: >-
    Sequence and functionally test the domain IV triplet across a broader panel of
    hystricomorph rodents, including species that are not subterranean, and correlate
    the triplet with measured burrow CO2 where available. The guinea pig HKV state
    observed in this review suggests the region is variable within this clade.
