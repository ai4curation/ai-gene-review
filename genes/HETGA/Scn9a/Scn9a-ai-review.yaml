- description: >-
    In naked mole-rat nociceptors this channel sets the threshold for action potential
    initiation, and it carries a species-specific acidic EKE triplet in the domain IV
    extracellular P-loop in place of the basic KKV triplet of other mammals. The
    substitution does not abolish conduction, but it makes the channel far more potently
    blocked by extracellular protons, so acidification inhibits rather than excites the
    neuron and the animal shows no acid-evoked pain while retaining normal heat and
    mechanical nociception.
  molecular_function:
    id: GO:0005248
    label: voltage-gated sodium channel activity
  directly_involved_in:
  - id: GO:0019228
    label: neuronal action potential
  - id: GO:0019233
    label: sensory perception of pain
  locations:
  - id: GO:0005886
