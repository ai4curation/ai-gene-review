        source_label: PAINT node cited by the TreeGrafter row
        source_status: SUPPORTS_TRANSFER
- term:
    id: GO:0019233
    label: sensory perception of pain
  evidence_type: ISS
  original_reference_id: PMID:17167479
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q15858
  review:
    summary: >-
      Missing from GOA. The whole naked-mole-rat literature on this protein is about
      its role in this species' pain phenotype: NaV1.7 is the nociceptor sodium channel
      whose species-specific variant abolishes acid nociception while leaving heat and
      mechanical nociception intact. A gene product whose sequence changes selectively
      remove one pain modality is, by any reasonable reading, involved in sensory
      perception of pain.
    action: NEW
    reason: >-
      Proposed as an inferred-from-sequence-similarity annotation rather than an
      experimental one, because the direct manipulations were done on the cloned
      channel and on nociceptor recordings rather than on the intact animal's gene. The
      inference is nonetheless unusually well grounded for this species: the human
      ortholog is an essential and non-redundant requirement for nociception, the naked
      mole-rat channel is the same subfamily protein with an intact pore, and the naked
      mole-rat papers explicitly attribute this species' selective analgesia to
      mutations in this gene. The ISS is therefore anchored on the source-species
      experiment (PMID:17167479, loss-of-function SCN9A in humans) with the human
      ortholog UniProtKB:Q15858 recorded as the with/from entity, rather than on the
      naked mole-rat channel paper PMID:22174253, which remains cited in supported_by
      as the evidence that this species' variant selectively removes acid nociception. I have not proposed any more specific child term, because
      the naked mole-rat's distinguishing feature is the loss of one pain modality
      rather than a positive role in detecting a stimulus.
    supported_by:
    - reference_id: PMID:22174253
      supporting_text: >-
        We describe a species-specific variant of the nociceptor sodium channel
        Na(V)1.7, which is potently blocked by protons and can account for acid
        insensitivity in this species.
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    - reference_id: PMID:34424517
      supporting_text: >-
        by accumulating mutations in genes encoding proteins that are only now being
        exploited as targets for new pain therapies (the nerve growth factor receptor
        TrkA and voltage-gated sodium channel, NaV1.7), this species mastered the art
        of analgesia before humans evolved
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    - reference_id: PMID:17167479
      supporting_text: >-
        Our data suggest that SCN9A is an essential and non-redundant requirement for
        nociception in humans.
      reference_section_type: ABSTRACT
