  supported_by:
  - reference_id: PMID:22174253
    supporting_text: >-
      Thus, evolutionary pressure has selected for an Na(V)1.7 gene variant that tips
      the balance from proton-induced excitation to inhibition of action potential
      initiation to abolish acid nociception.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - reference_id: PMID:32206859
