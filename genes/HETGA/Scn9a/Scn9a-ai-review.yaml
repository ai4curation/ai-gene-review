      Source of the voltage-gated sodium channel activity, voltage-gated sodium channel
      complex and plasma membrane rows, combining InterPro, PANTHER and UniRule.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:22174253
  title: The molecular basis of acid insensitivity in the African naked mole-rat.
  full_text_unavailable: true
  findings:
  - statement: >-
      The primary paper. Reports that naked mole-rat nociceptors are inhibited rather
      than excited by acid, and attributes this to a species-specific NaV1.7 variant
      that is potently blocked by protons. UniProt cites this paper as the sole
      literature reference for G9DCX3, and the EMBL entry JF912494 that defines this
      accession was submitted by its authors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the cache; every quotation used here is from the abstract. The
      identifier is anchored independently of the abstract text: the UniProt record for
      G9DCX3 cites this exact PubMed ID and DOI for its nucleotide-sequence reference,
      with the same author list. No residue-level claim in this review is taken from
      this paper, precisely because the abstract gives none.
- id: PMID:24352952
  title: Repeated functional convergent effects of NaV1.7 on acid insensitivity in
    hibernating mammals.
  full_text_unavailable: true
  findings:
  - statement: >-
      Independent confirmation that acid insensitivity in the naked mole-rat is
      conferred by a functional motif of NaV1.7, and evidence that the same functional
      convergence arose at least six times independently in hibernating mammals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Used for the convergence claim and for independent corroboration
      of the naked-mole-rat mechanism, not for any residue numbering. Note that the one
      hibernator sequence I sampled independently (Ictidomys tridecemlineatus) retains
      the ancestral KKV triplet, so this paper's survey should not be read as implying
      that every hibernator carries the variant.
- id: PMID:31147513
  title: Rapid molecular evolution of pain insensitivity in multiple African rodents.
  full_text_unavailable: true
  findings:
  - statement: >-
      Screen of eight African rodent species related to the naked mole-rat, tracing
      sequence variants in transduction channels including NaV1.7 that accompany
      insensitivity to capsaicin, acid and AITC.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Establishes the comparative context; the specific EKE/EKD motif
      detail attributed to this study is quoted from the full-text review PMID:32206859
      rather than from this abstract, which does not state it.
- id: PMID:32206859
  title: 'Independent evolution of pain insensitivity in African mole-rats: origins
    and mechanisms.'
  findings:
  - statement: >-
      Full-text review by the authors of the primary work. States the mechanism
      (variants that enhance proton block of NaV1.7), names the motif as a charge
      inversion of a trio of residues in domain IV from KKV to EKD or EKE, and records
      that the EKE variant specifically has been shown experimentally to increase
      proton block.
  - statement: >-
      Also notes that NaV1.7 matters far more for somatic than visceral pain, which is
      the key to reconciling the cutaneous acid insensitivity with the residual acid
      responses of colonic afferents reported in PMID:31992138.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and used as the primary source for the motif description,
      since the primary papers are abstract-only in this cache. It is a review by the
      same group, so it is not evidentially independent of PMID:22174253; the motif it
      describes was nonetheless verified directly against the sequences rather than
      taken on trust.
- id: PMID:31992138
  title: Acid and inflammatory sensitisation of naked mole-rat colonic afferent nerves.
  findings:
  - statement: >-
      Independent group restating the mechanism: a variation in naked mole-rat NaV1.7
      renders the channel hypersensitive to proton-mediated block and prevents
      acid-driven action potential initiation from the skin.
  - statement: >-
      Reports that naked mole-rat colonic afferents still respond to acid, and explains
      this by the known redundancy of NaV1.7 in visceral afferents. This is about
      visceral, not cutaneous, afferents and must not be read as qualifying the
      cutaneous acid-insensitivity phenotype.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available. Cited here only for its statement of the NaV1.7 mechanism
      and for the somatic/visceral distinction, both of which are explicit in its own
      introduction and discussion. Its primary experimental subject, colonic afferent
      electrophysiology, is not used as evidence for any annotation on this protein.
- id: PMID:34476892
  title: 'The naked truth: a comprehensive clarification and classification of current
    ''myths'' in naked mole-rat biology.'
  findings:
  - statement: >-
      Corrects the popular over-claim that naked mole-rats feel no pain, emphasising
      that the original finding was of selective insensitivity and that normal
      nocifensive responses to noxious heat and mechanical stimuli were reported. This
      is why the review accepts neuronal action potential and does not treat the NaV1.7
      variant as a loss of channel function.
  - statement: >-
      Restates the mechanism as a gene variant that renders NaV1.7 more susceptible to
      inhibition by acid, shutting down action potential firing in nociceptor fibres,
      and notes the same variant in the Cape mole-rat.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Consulted specifically to check whether it corrects any
      over-claim about NaV1.7. It does not dispute the NaV1.7 mechanism; what it
      corrects is the broader claim that this species feels no pain, and that
      correction has been incorporated here.
- id: PMID:34424517
  title: The Somatosensory World of the African Naked Mole-Rat.
  full_text_unavailable: true
  findings:
  - statement: >-
      Names NaV1.7, alongside the NGF receptor TrkA, as one of the two proteins whose
      accumulated mutations underlie this species' selective analgesia.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only; used solely for the attribution of the species' pain phenotype to
      this gene, which the abstract states explicitly.
- id: PMID:17167479
  title: An SCN9A channelopathy causes congenital inability to experience pain.
  findings:
  - statement: >-
      Loss-of-function SCN9A mutations abolish pain perception in humans, establishing
      NaV1.7 as an essential and non-redundant requirement for nociception. Used as the
      orthologous grounding for the proposed sensory perception of pain annotation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Human paper, cited as the sequence-similarity basis for the NEW annotation rather
      than as evidence about the naked mole-rat protein.
- id: PMID:30765606
  title: Structures of human Na(v)1.7 channel in complex with auxiliary subunits and
    animal toxins.
  findings:
  - statement: >-
      Cryo-EM structures of human NaV1.7 with beta subunits, supporting the
      voltage-gated sodium channel complex cellular component for the orthologous alpha
      subunit.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Human structural paper, used only to justify the complex term for the conserved
      alpha subunit. No naked-mole-rat structure exists.
- id: PMID:30795902
  title: Defining the Functional Role of Na(V)1.7 in Human Nociception.
  findings:
  - statement: >-
      Human data on NaV1.7 subcellular distribution, including localisation to nodes of
      Ranvier. Noted here as the reason the review does NOT project axon, nerve
      terminal or node of Ranvier onto the naked mole-rat: those localisations are
      established only in human and mouse.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited for what it does not license rather than for what it supports; no naked
      mole-rat cellular component annotation was derived from it.
- id: PMID:28939386
  title: Investigation into the role of an extracellular loop in mediating proton-evoked
    inhibition of voltage-gated sodium channels.
  full_text_unavailable: true
  findings:
  - statement: >-
      The only study that tested the naked mole-rat motif experimentally. Patch-clamp
      recordings show that inserting the naked mole-rat EKE motif into human NaV1.7
      increases proton-evoked tonic inhibition, confirming the causal role of the motif,
      but also reduce channel function in the chimera.
  - statement: >-
      It also qualifies the mechanism. A homology model places the EKE residues outside
      the pore lumen and too far from the pore mouth for direct steric obstruction, and
      across NaV1.2 to NaV1.8 motif charge does not correlate with proton sensitivity.
      The motif is therefore the sequence correlate of enhanced proton block rather than
      an established pore-block site, and the review's wording follows that distinction.
  - statement: >-
      Independently locates the motif in the domain IV P-loop, which agrees with the
      position determined here by direct sequence comparison.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only; fetched during this review after the falcon report surfaced it, as
      it was not previously in the publication cache. Marked VERIFIED rather than
      DISPUTED because it confirms rather than contradicts the central claim (EKE
      increases proton block of NaV1.7); what it disputes is the simple
      charge-and-pore-occlusion explanation, which this review therefore does not
      assert. Its quantitative values come from human channel mutagenesis, not from
      recordings of the naked mole-rat protein.
- id: file:HETGA/Scn9a/Scn9a-deep-research-falcon.md
  title: Falcon deep research report for naked mole-rat Scn9a
  findings:
  - statement: >-
      Naked-mole-rat-specific deep research report (Edison Scientific Literature, 15
      citations) generated during this review. It reaches the same conclusions arrived
      at independently here: NaV1.7 identity, a plasma-membrane electrogenic
      sodium-selective threshold channel, enhanced proton inhibition as the
      species-specific specialization, and the fragment caveat on G9DCX3.
  - statement: >-
      Its one genuinely new contribution was surfacing Harms et al. 2017
      (PMID:28939386), which was not in the publication cache and which neither the
      affinage human record nor the cached naked-mole-rat corpus contained. That paper
      changed how the mechanism is worded in this review.
  - statement: >-
      It also independently confirms the localisation gap recorded here: no dedicated
      naked-mole-rat immunolocalisation or spatial-transcriptomic study maps this
      protein, which is why the cellular component annotation stops at plasma membrane.
      Its suggested process term "regulation of membrane potential" was not adopted,
      because GO:0086010 is already annotated and is more precise for a channel that
      carries the depolarizing current itself.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      LLM-generated deep-research report, so its narrative is a lead rather than
      evidence. Every claim taken from it that matters to an annotation is separately
      anchored to a PMID or to the UniProt record; the quotations used from it are
      restricted to statements of general channel biology and to its own explicit
      statements about what the retrieved literature does not show. Its quantitative
      proton-block figures were traced to their source (PMID:28939386) and cited from
      there rather than from the report.
- id: file:HETGA/Scn9a/Scn9a-uniprot.txt
  title: UniProt record for Scn9a
  findings:
  - statement: >-
      G9DCX3 is a 1884-residue TrEMBL fragment (Flags Fragment, NON_TER at both ends)
      derived from EMBL JF912494, the mRNA submitted by the authors of PMID:22174253.
      It carries four Pfam PF00520 ion-transport domains, 20 transmembrane helices, the
      PF11933 cytoplasmic domain, the PF06512 sodium-ion-transport-associated domain
      and a C-terminal IQ motif, and is assigned to PANTHER PTHR10037:SF221 and the
      sodium channel (TC 1.A.1.10) family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched UniProt record, not edited. Its FUNCTION, CATALYTIC ACTIVITY and
      SUBCELLULAR LOCATION statements are RuleBase/ARBA-derived rather than
      experimental for this species, which is why each is corroborated with
      naked-mole-rat literature wherever it supports an annotation here.
- id: file:HETGA/Scn9a/Scn9a-bioinformatics/RESULTS.md
  title: Domain IV pore-loop motif and fragment extent for naked mole-rat Scn9a
  findings:
  - statement: >-
      Reproducible comparison of the domain IV S5-pore linker triplet across seven
      mammalian NaV1.7 sequences, anchored on invariant flanking residues. The naked
      mole-rat protein carries EKE at fragment positions 1698-1700 where human, mouse,
      rat, rabbit and thirteen-lined ground squirrel carry KKV and guinea pig carries
      HKV. This reproduces the published motif directly in the sequence under review
      instead of relying on residue numbers recalled from memory, and places it in the
      distal half of the domain IV extracellular P-loop (S5 ends at 1641, S6 begins at
      1717 in this entry). The file records the location only; it explicitly defers to
      PMID:28939386 on mechanism.
  - statement: >-
      The fragment spans approximately human residues 23-1901, missing 22 N-terminal
      and 87 C-terminal residues, at 92.1% identity within matched blocks. All four
      homologous repeats, all voltage sensors and all four pore loops are present, so
      the truncation does not undercut the molecular function or cellular component
      annotations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis written for this review; the script is deterministic, uses only the
      standard library, and caches its UniProt downloads, so the table can be
      regenerated. Results are not hardcoded.
- id: file:HETGA/Scn9a/Scn9a-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for human SCN9A used as a conserved-mechanism
    baseline
  findings:
  - statement: >-
      Machine-fetched Affinage record for the HUMAN ortholog SCN9A (Q15858), retrieved
      deliberately as a conserved-mechanism baseline because Affinage covers human
      genes only. It is a useful account of human NaV1.7 as a threshold-setting
      nociceptor channel, of its channelopathies, and of its CRMP2/Nedd4-2 trafficking
      control.
  - statement: >-
      It contains nothing about the naked mole-rat and nothing about proton block. None
      of PMID:22174253, PMID:24352952, PMID:31147513 or PMID:32206859 appears among its
      42 citation-anchored findings, and the strings mole-rat, glaber and proton do not
      occur in the file. The entire evidence base for this gene's species-specific
      function had to be found independently.
  - statement: >-
      Its own GO grounding collapses to uninformative parents: mechanism_profile gives
      molecular_activity as GO:0005215 transporter activity for a protein whose
      defining activity is GO:0005248 voltage-gated sodium channel activity. No
      identifier from it was imported; every term here was re-grounded from GOA,
      QuickGO and the literature.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Human-ortholog record used only as a conserved-mechanism baseline, never as
      evidence about the naked mole-rat protein, and no sentence from it is quoted as
      supporting_text anywhere in this review. Marked LOW_QUALITY rather than VERIFIED
      because the record tripped a soft trust gate: its own frontmatter reports
      self_evaluation_pairwise as tie rather than win against the curated UniProt
      reference, so it did not demonstrate an advantage over the curated source it was
      scored against. Its coarse GO grounding, transporter activity for a voltage-gated
      sodium channel, is consistent with that self-assessment.
