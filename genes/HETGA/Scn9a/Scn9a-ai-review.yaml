id: G9DCX3
gene_symbol: Scn9a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  Scn9a encodes NaV1.7, the pore-forming alpha subunit of a tetrodotoxin-sensitive
  voltage-gated sodium channel of peripheral sensory neurons. The protein has the
  canonical NaV architecture of four homologous repeats (domains I-IV), each with six
  transmembrane segments; the S4 segments are the voltage sensors and the four
  re-entrant S5-S6 pore loops form the sodium-selective pore. On membrane
  depolarization the channel opens and conducts Na+ down its electrochemical gradient
  across the plasma membrane, producing the depolarizing upstroke of the action
  potential. In nociceptors NaV1.7 sets the threshold for action potential initiation,
  which makes it a principal determinant of pain sensation across mammals. The naked
  mole-rat protein carries a species-specific charge-changing substitution in the
  domain IV extracellular P-loop, an acidic EKE triplet in place of the basic KKV
  triplet found in mouse, rat, rabbit and human. The channel remains a conducting
  voltage-gated sodium channel, and naked mole-rat nociceptors respond normally to
  noxious heat and mechanical stimuli, but it is far more potently blocked by
  extracellular protons than its mouse counterpart. Acidification therefore silences
  rather than excites naked mole-rat cutaneous nociceptors, and the animal shows no
  nocifensive response to acid. The same charge inversion at this triplet has arisen
  repeatedly in other acid-tolerant and hibernating mammals, making it one of the
  clearest examples of convergent molecular adaptation in mammalian sensory biology.
