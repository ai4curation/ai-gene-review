- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      UniProt places this multi-pass membrane protein in the cell membrane, and the
      mechanism established for it requires that location: a channel can only gate the
      action potential and be reached by extracellular protons if it sits in the plasma
      membrane of the sensory neuron.
    action: ACCEPT
    reason: >-
      Supported by the UniProt subcellular-location annotation and by the biology.
      Naked-mole-rat proton block is measured on nociceptor membrane currents and acts
      from the extracellular side, so a plasma-membrane location is not merely
      transferred but required by the published mechanism. I deliberately do not extend
      this to axon, nerve terminal or node of Ranvier: those localizations are
      established for the human and mouse orthologs, not in this species.
