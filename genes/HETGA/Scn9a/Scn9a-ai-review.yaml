- term:
    id: GO:0005248
    label: voltage-gated sodium channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the core molecular function. The naked mole-rat protein is a functional
      voltage-gated sodium channel: it was cloned from naked mole-rat sensory tissue
      and its currents measured, and naked mole-rat nociceptors fire normal action
      potentials to noxious heat and mechanical stimuli. Its species-specific feature
      is greatly enhanced block by extracellular protons, which modifies gating without
      abolishing conduction.
    action: ACCEPT
    reason: >-
      Unusually for a naked mole-rat annotation, this projected term is positively
      confirmed by naked mole-rat work on this very protein rather than merely
      transferred from mouse. Smith et al. describe a species-specific variant of this
      channel that is potently blocked by protons; a channel that can be blocked is a
      channel that conducts, and the enhanced proton block is a quantitative
      modification of gating, not a loss of channel activity. Independent reviews
      restate the same conclusion. My own sequence comparison locates the responsible
      substitution in the domain IV extracellular P-loop, between the S5 and S6 helices.
      The physical mechanism of the block is not settled: Harms et al. reproduced the
      effect by transplanting the motif into human NaV1.7, but modelled the residues as
      not lining the pore lumen and found that motif charge does not predict proton
      sensitivity across other NaV subtypes, so the substitution is best described as
      the sequence correlate of enhanced proton block rather than as a pore-occluding
      site. Either way it modulates gating rather than removing channel activity.
    supported_by:
    - reference_id: PMID:22174253
      supporting_text: >-
        We describe a species-specific variant of the nociceptor sodium channel
        Na(V)1.7, which is potently blocked by protons and can account for acid
        insensitivity in this species.
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    - reference_id: PMID:32206859
      supporting_text: >-
        The NaV1.7 subunit is particularly important for action potential initiation
        and the naked mole-rat gene encodes amino acid variations that when mutated
        into the human protein considerably enhance proton block of NaV1.7 channels at
        certain pH values that excite nociceptors
      reference_section_type: RESULTS
    - reference_id: PMID:24352952
      supporting_text: >-
        In the naked mole-rat, acid insensitivity has been shown to be conferred by the
        functional motif of the sodium ion channel NaV1.7.
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    - reference_id: file:HETGA/Scn9a/Scn9a-uniprot.txt
      supporting_text: Reaction=Na(+)(in) = Na(+)(out)
    - reference_id: PMID:28939386
      supporting_text: >-
        The insertion of the negatively charged motif (EKE) of ANMrNav1.7 into human
        Nav1.7 results in an increased proton-evoked tonic inhibition, but also in a
        reduced channel function.
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    - reference_id: file:HETGA/Scn9a/Scn9a-deep-research-falcon.md
      supporting_text: >-
        NaV1.7 is not an enzyme. It is an **electrogenic ion channel** whose transported
        substrate is principally **Na+**.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000004433
        source_label: PAINT node cited by the combined-IEA pipeline for this row
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Independently corroborated by naked-mole-rat experimental literature on this
          protein, so the transfer is not the only support for the term here.
      residue_claims:
      - claim_type: SUBSTITUTED
        role: >-
          First position of the domain IV extracellular P-loop triplet that is the
          published sequence correlate of enhanced block of this channel by
          extracellular protons.
        method: MSA
        comment: >-
          The naked mole-rat channel carries EKE (acidic/basic/acidic) where human,
          mouse, rat, rabbit and thirteen-lined ground squirrel carry KKV
          (basic/basic/neutral); guinea pig, the closest sampled hystricomorph, carries
