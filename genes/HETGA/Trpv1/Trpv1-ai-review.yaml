      configuration by applying 1 µM capsaicin
- description: >-
    Ca2+-permeable pore that also serves as a proton sensor. The same non-selective cation
    conductance is opened by extracellular acidification, and naked mole-rat TRPV1 retains
    proton sensitivity equivalent to the mouse channel. Opening admits Ca2+ from the
    extracellular space into the cytosol of the sensory neuron. Notably, this normal proton
    gating coexists with complete behavioural acid insensitivity in the animal, which is
    caused by a proton-blocked NaV1.7 variant rather than by any change in TRPV1.
