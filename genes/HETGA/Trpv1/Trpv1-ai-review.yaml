id: G9DCX1
gene_symbol: Trpv1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  Trpv1 encodes the naked mole-rat transient receptor potential vanilloid 1 channel
  (vanilloid receptor 1, VR1), an 840-residue polymodal non-selective cation channel of
  the TRPV family. The subunit has the canonical TRPV architecture: a large cytoplasmic
  N-terminal ankyrin-repeat domain, six transmembrane helices with a re-entrant pore loop
  between S5 and S6, and a cytoplasmic C-terminal tail; four subunits assemble around a
  central Ca2+-permeable pore. It resides in the plasma membrane of small-diameter dorsal
  root ganglion neurons and their peripheral cutaneous and central dorsal-horn terminals,
  where about 28% of DRG neurons are TRPV1-positive, a fraction indistinguishable from
  mouse. The channel is opened by noxious heat, by extracellular protons and by vanilloid
  agonists such as capsaicin, and the resulting cation influx raises cytosolic Ca2+ and
  depolarises the nociceptor.

  The naked mole-rat channel is functionally ordinary. Expressed in sensory neurons from
  Trpv1-null mice it produces capsaicin-, heat- and pH-gated currents with a heat-activation
  threshold of about 44 degrees C, and naked mole-rat sensory neurons respond to nanomolar
  capsaicin with the same incidence and magnitude as mouse neurons; its proton sensitivity
  matches that of mouse TRPV1. The species' well-known behavioural insensitivity to capsaicin
  therefore does not originate in the channel: it is explained downstream, by the absence of
  substance P and CGRP from cutaneous C-fibres and by an unusual pattern of TRPV1-fibre
  termination in both superficial and deep laminae of the dorsal horn, and behavioural
  responsiveness to capsaicin is restored by intrathecal substance P. Likewise, the absence
  of NGF- and capsaicin-induced thermal hyperalgesia in this species reflects a hypofunctional
  TrkA receptor rather than a defect in TRPV1, which is sensitised normally when placed in a
  mouse cellular context and is sensitised by artemin in naked mole-rat neurons. One
  naked-mole-rat-specific substitution is documented, a threonine at the position
  corresponding to Ser502 of rat TRPV1 (a PKC-epsilon phospho-acceptor), but it is
  functionally silent for sensitisation. Naked mole-rat acid insensitivity is likewise
  unrelated to this channel, arising instead from a proton-blocked variant of the
  voltage-gated sodium channel NaV1.7.
