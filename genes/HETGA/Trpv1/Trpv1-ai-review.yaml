- description: >-
    Vanilloid-gated cation channel - the capsaicin receptor of naked mole-rat nociceptors.
    Binding of capsaicin and related vanilloids opens the channel, producing inward current
    and Ca2+ entry in dorsal root ganglion neurons with nanomolar potency, at the same
    incidence and magnitude as in mouse. This ligand-gated activity is intact in the naked
    mole rat despite the animal's complete behavioural insensitivity to capsaicin, which
    arises downstream in the spinal cord.
