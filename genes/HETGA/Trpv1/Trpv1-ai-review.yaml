      supporting_text: the naked mole-rat TRPV1 protein can rescue capsaicin and heat
        sensitivity in Trpv1−/− sensory neurons
    - reference_id: PMID:32206859
      supporting_text: Indeed, subsequent analysis of naked mole-rat TRPV1 demonstrated that
        it has normal heat, pH, voltage and capsaicin sensitivity
