core_functions:
- description: >-
    Heat-gated cation channel of the nociceptor plasma membrane. Naked mole-rat TRPV1 opens
    on heating with a noxious-heat threshold near 44 degrees C, admitting Ca2+ and other
    cations and depolarising the sensory neuron. The threshold and the current are
    indistinguishable from those of the mouse channel, established by expressing the cloned
    naked mole-rat protein in sensory neurons that lack endogenous TRPV1.
