- term:
    id: GO:0005216
    label: monoatomic ion channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Correct but uninformatively general. Naked mole-rat TRPV1 is not merely an ion
      channel: its gating has been measured directly, and it is a polymodal channel opened
      by noxious heat, by protons and by vanilloid ligands. Because the specific gating
      modes are experimentally established for this species' protein, the generic parent
      term should give way to the informative children.
    action: MODIFY
    reason: >-
      The cloned naked mole-rat cDNA (the very accession annotated here, EMBL AEV53346.1
      from PMID:22174253) was expressed in sensory neurons from Trpv1-null mice and shown to
      produce heat-gated currents with a threshold of 44.4 +/- 0.7 degrees C and pH-gated,
      ruthenium-red-sensitive currents, and to restore capsaicin sensitivity
      [PMID:27732851]. Review of that work records normal heat, pH, voltage and capsaicin
      sensitivity [PMID:32206859]. GO:0005216 discards all of this. Replace with GO:0097603
      (temperature-gated ion channel activity), which captures the heat gating, and
      GO:0015276 (ligand-gated monoatomic ion channel activity), which captures vanilloid
      gating. GO:0015276 is preferred over GO:0005230 (extracellular ligand-gated) because
      capsaicin engages a vanilloid pocket reached from the inner leaflet rather than an
      extracellular binding site. Ca2+ selectivity is separately and correctly captured by
      GO:0005262 below.
    proposed_replacement_terms:
    - id: GO:0097603
      label: temperature-gated ion channel activity
    - id: GO:0015276
      label: ligand-gated monoatomic ion channel activity
    supported_by:
