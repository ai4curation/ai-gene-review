- term:
    id: GO:0032591
    label: dendritic spine membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      An over-annotation. This is a UniProt subcellular-location keyword transfer
      (UniProtKB-SubCell SL-0285, reached via ARBA00004332) that asserts a specific CNS
      postsynaptic compartment. It is IEA-only in every well-curated mammalian ortholog, so
      what propagates here is an unvalidated keyword artefact rather than an experimental
      finding, and every naked mole-rat observation of this protein is in peripheral sensory
      neurons.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Three positive reasons, not merely "this was transferred electronically". First, the
      provenance: the UniProt record carries the location only with an ARBA evidence tag and
      no experimental support. Second, the term is IEA in human (Q8NER1), mouse (Q704Y3) and
      rat (O35433) alike, whereas the genuinely experimental CNS locations on those
      orthologs are postsynaptic membrane (GO:0045211, IDA/IMP in mouse and rat) and
      dendrite (GO:0030425, IDA in rat) - so even in the source species the spine-specific
      term is unvalidated. Third, all naked mole-rat data on this protein concern DRG
      somata, cutaneous C-fibre endings and central terminals in the dorsal horn
      [PMID:18232734, PMID:40705105, PMID:32880221]; no naked mole-rat study has examined
      TRPV1 in brain, let alone at dendritic spines. REMOVE is not used because TRPV1 does
      have real postsynaptic and dendritic localisation in rodent CNS, so the term is
      unsupported and over-specific for this species rather than false for the family.
    supported_by:
    - reference_id: file:HETGA/Trpv1/Trpv1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell projection, dendritic spine membrane'
    - reference_id: PMID:18232734
      supporting_text: Thus, TRPV1-responsive sensory fibers are synaptically connected to
        both superficial and deep dorsal horn neurons in the naked mole-rat.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_EVIDENCE_WEAK
