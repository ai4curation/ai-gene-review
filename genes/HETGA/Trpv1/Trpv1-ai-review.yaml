proposed_new_terms:
- proposed_name: vanilloid-gated monoatomic cation channel activity
  proposed_definition: >-
    Enables the transmembrane transfer of a cation by a channel that opens when a vanilloid
    ligand, such as capsaicin or resiniferatoxin, is bound in a pocket formed by the
    transmembrane domain and accessible from the inner leaflet of the plasma membrane.
  justification: >-
    GO has no term for vanilloid or capsaicin gating, so the defining pharmacological
    property of TRPV1 - the one that names the protein (vanilloid receptor 1) and the one
    that has been measured most often in the naked mole rat - can only be recorded with the
    generic GO:0015276 ligand-gated monoatomic ion channel activity. GO:0005230
    (extracellular ligand-gated) would be wrong, because the vanilloid pocket is reached
    from the cytoplasmic leaflet rather than from the extracellular face. A dedicated child
    of GO:0015276 would let curators distinguish vanilloid-sensitive TRPV channels from
    vanilloid-insensitive ones (avian TRPV1, TRPV2) without resorting to free text.
  proposed_parent:
    id: GO:0015276
    label: ligand-gated monoatomic ion channel activity
  supported_by:
  - reference_id: PMID:18232734
    supporting_text: The capsaicin receptor is a nonselective cation channel called transient
      receptor potential vanilloid channel-1 (TRPV1), which can also be activated by noxious
      heat and protons
suggested_questions:
- question: >-
    Does naked mole-rat TRPV1 mediate the species' normal nocifensive response to noxious
    heat? Noxious-heat withdrawal is normal in this species and TRPV1 is expressed at normal
    levels, but in mice C-fibre noxious-heat sensitivity survives Trpv1 deletion, so the
    organism-level term GO:0050965 cannot be transferred on expression data alone.
  experts:
  - Gary R. Lewin
  - Ewan St. John Smith
  - Thomas J. Park
- question: >-
    Is naked mole-rat TRPV1 expressed anywhere outside the somatosensory system - brain,
    bladder urothelium, gut epithelium, vasculature - where mouse and rat TRPV1 carry
    organ-physiology annotations such as temperature homeostasis, regulation of urine volume
    and regulation of systemic arterial blood pressure?
  experts:
  - Ewan St. John Smith
- question: >-
    Does naked mole-rat TRPV1 form heteromeric channels with TRPA1 or TRPV4, and does its
    calmodulin, ATP and PIP2 regulation match that of the mouse and rat channels? None of
    these has been tested in this species, yet all are carried as keyword or ISS annotations
    on the orthologs.
  experts: []
- question: >-
    Beyond the functionally silent Ser502Thr (rat numbering; Thr505 in G9DCX1), does the
    naked mole-rat TRPV1 sequence carry any substitution that alters desensitisation or
    tachyphylaxis? Artemin was found to diminish capsaicin-evoked desensitisation in naked
    mole-rat neurons, which raises the question of whether baseline desensitisation kinetics
    differ from mouse.
  experts:
  - Ewan St. John Smith
suggested_experiments:
- hypothesis: >-
    Naked mole-rat TRPV1 is required for normal nocifensive responses to noxious heat in this
    species, despite contributing nothing to capsaicin-evoked pain behaviour.
  description: >-
    Test whether pharmacological block of TRPV1 (a selective antagonist such as AMG9810 or
    BCTC, applied topically or intraplantar) raises radiant-heat and hot-plate withdrawal
    latencies in naked mole-rats, using mice as a positive control and confirming target
    engagement by loss of capsaicin-evoked currents in ex vivo skin-nerve recordings from the
    same animals. A negative result would show that, as in Trpv1-null mice, noxious-heat
    transduction in naked mole-rat C-fibres is carried by another transducer, and would
    justify leaving GO:0050965 off this gene.
  experiment_type: pharmacological behavioural assay with electrophysiological confirmation
- hypothesis: >-
    Naked mole-rat TRPV1 has the same polymodal gating parameters as mouse TRPV1 when both
    are recorded side by side in the same expression system.
  description: >-
    Express nmrTrpv1 and mouse Trpv1 in parallel in HEK293 cells or Xenopus oocytes and
    measure, on the same rigs and days, capsaicin dose-response (EC50), proton dose-response,
    heat-activation threshold and Q10, single-channel conductance and Ca2+ permeability ratio
    (PCa/PNa). The published comparisons are qualitative ("similar", "indistinguishable") and
    are the sole basis for accepting several of the projected molecular-function annotations;
    a quantitative side-by-side would either convert those to firm evidence or reveal a
    quantitative divergence that the qualitative statements hide.
  experiment_type: comparative heterologous electrophysiology
- hypothesis: >-
    Naked mole-rat TRPV1 protein is confined to the somatosensory system and is absent from
    the CNS compartments (dendritic spines, postsynaptic membrane) that the UniProt keyword
    annotation asserts.
  description: >-
    Perform RNAscope for Trpv1 mRNA plus validated immunohistochemistry across naked mole-rat
    hippocampus, cortex, hypothalamus, bladder, colon and mesenteric vessels, with DRG as a
    positive control and Trpv1-null mouse tissue as an antibody specificity control. This
    would directly resolve the GO:0032591 dendritic spine membrane annotation, which is
    currently a keyword transfer with no experimental support in any species.
  experiment_type: in situ hybridisation and immunohistochemistry survey
references:
- id: PMID:18232734
  title: Selective inflammatory pain insensitivity in the African naked mole-rat (Heterocephalus
    glaber).
  findings:
  - statement: >-
      Naked mole-rat nociceptors respond vigorously to capsaicin, and cultured DRG neurons
      show Ca2+ responses to 10 nM and 2 uM capsaicin equal in incidence and magnitude to
      mouse neurons, so the species' behavioural insensitivity to capsaicin is not a TRPV1
      defect.
    supporting_text: The results of these experiments indicated that the incidence and
      magnitude of the capsaicin responses to both low (10 nM) and high (2 μM) capsaicin
      concentrations are equivalent to that found in the mouse
  - statement: >-
      TRPV1-expressing sensory fibres are synaptically connected to both superficial and
      deep dorsal horn neurons in the naked mole-rat, unlike the mouse, which is one
      explanation for the absent nocifensive response.
    supporting_text: Thus, TRPV1-responsive sensory fibers are synaptically connected to
      both superficial and deep dorsal horn neurons in the naked mole-rat.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The foundational naked mole-rat nociception paper; full text cached. Its capsaicin
      calcium-imaging and skin-nerve data are the primary species-specific evidence for the
      channel-activity annotations here. Quoted passages were checked verbatim against the
      cached full text.
- id: PMID:22174253
  title: The molecular basis of acid insensitivity in the African naked mole-rat.
  findings:
  - statement: >-
      Naked mole-rat acid sensors, including TRPV1, are similar to those of other
      vertebrates; acid insensitivity is instead caused by a species-specific NaV1.7 variant
      that is potently blocked by protons.
    supporting_text: acid sensors (acid-sensing ion channels and the transient receptor
      potential vanilloid-1 ion channel) in naked mole-rat nociceptors are similar to those
      in other vertebrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is the paper whose mRNA submission (EMBL JF912492 / AEV53346.1) created the
      UniProt entry G9DCX1 being reviewed, so the annotated protein is the one characterised
      here; the link is verifiable in the RN/RX block of Trpv1-uniprot.txt. Only the abstract
      is cached, so the quoted passage is from the abstract and no methods detail is cited
      from it. The detailed TRPV1 gating characterisation attributed to this paper is quoted
      at second hand via PMID:27732851 and PMID:32206859.
  full_text_unavailable: true
- id: PMID:27732851
  title: Hypofunctional TrkA Accounts for the Absence of Pain Sensitization in the African
    Naked Mole-Rat.
  findings:
  - statement: >-
      Naked mole-rats have fully functional TRPV1 channels; the cloned naked mole-rat protein
      expressed in Trpv1-null mouse sensory neurons produces heat-gated currents with a 44.4
      degree C threshold and ruthenium-red-sensitive pH-gated currents, and rescues both
      capsaicin and heat sensitivity.
    supporting_text: Transfected Trpv1−/− sensory neurons had heat-gated currents with an
      activation threshold of 44.4°C ± 0.7°C (n = 5) and pH-gated currents sensitive to
      ruthenium red
  - statement: >-
      The single naked-mole-rat-specific substitution at a conserved PKC-epsilon
      phospho-acceptor (Ser502 in rat numbering) is functionally silent: the T502S revertant
      is sensitised by PMA just as the wild-type naked mole-rat protein is.
    supporting_text: We also generated a naked mole-rat TRPV1T502S mutant that was also
      sensitized by PMA in naked mole-rat fibroblast cell lines
  - statement: >-
      NGF fails to sensitise TRPV1 in naked mole-rat nociceptors, but the defect lies in the
      hypofunctional naked mole-rat TrkA receptor, not in TRPV1, which is sensitised normally
      in a mouse cellular context.
    supporting_text: in naked mole-rat IB4-negative sensory neurons, NGF never sensitized
      TRPV1 currents
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. The single most informative reference for this gene: the
      only paper that isolates the naked mole-rat TRPV1 protein from its cellular context and
      measures its gating directly, and the source of the only documented species-specific
      substitution. Quoted passages verified verbatim against the cache.
- id: PMID:32206859
  title: 'Independent evolution of pain insensitivity in African mole-rats: origins and
    mechanisms.'
  findings:
  - statement: >-
      Analysis of naked mole-rat TRPV1 demonstrated normal heat, pH, voltage and capsaicin
      sensitivity, so loss of TRPV1 function cannot explain the absence of NGF-induced
      thermal hyperalgesia.
    supporting_text: Indeed, subsequent analysis of naked mole-rat TRPV1 demonstrated that
      it has normal heat, pH, voltage and capsaicin sensitivity
  - statement: >-
      Altered central connectivity of TRPV1-positive nociceptors, which contact deep as well
      as superficial dorsal horn neurons, is the leading explanation for why capsaicin
      produces no nocifensive response in this species.
    supporting_text: This altered connectivity of TRPV1-positive nociceptors potentially
      explains why capsaicin elicits a robust nocifensive response in mice, but none in the
      naked mole-rat.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The best single synthesis of naked mole-rat nociception, and the
      clearest statement anywhere that the TRPV1 channel itself is unremarkable in this
      species. Written by the same group that did the primary work, so it is a well-informed
      secondary source rather than an independent one; the primary claims it summarises are
      separately cited to PMID:18232734 and PMID:27732851.
- id: PMID:31992138
  title: Acid and inflammatory sensitisation of naked mole-rat colonic afferent nerves.
  findings:
  - statement: >-
      Naked mole-rat TRPV1 is expressed in sensory afferents and shows proton sensitivity
      similar to mouse TRPV1; the species' acid insensitivity is attributed to the NaV1.7
      variant rather than to any acid sensor.
    supporting_text: NMR TRPV1 is also expressed in sensory afferents and shows similar
      proton sensitivity to mouse TRPV1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Cited only for its restatement of naked mole-rat TRPV1 proton
      sensitivity and afferent expression; the paper's own new data concern colonic afferent
      firing rather than TRPV1 directly, so it corroborates rather than establishes.
- id: PMID:32478202
  title: The naked mole-rat has a functional purinergic pain pathway despite having a
    non-functional peptidergic pain pathway.
  findings:
  - statement: >-
      The behavioural insensitivity of the naked mole-rat to capsaicin is attributable to a
      lack of neuropeptides in its C-fibres, which makes the TRPV1 pain pathway
      non-functional for pain signalling while leaving the channel itself intact.
    supporting_text: Experiments involving immunohistochemistry and intrathecal
      administration of SP showed that the behavioral insensitivity to capsaicin is
      attributable to a lack of neuropeptides in C-fibers of the naked mole-rat
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Supports the downstream (neuropeptide) explanation of the capsaicin
      phenotype, which is why no pain-perception term was proposed for this gene. It also
      quantifies TRPV1 immunoreactivity in naked mole-rat DRG.
- id: PMID:32880221
  title: Naked mole-rats lack cold sensitivity before and after nerve injury.
  findings:
  - statement: >-
      TRPV1 is functional in the naked mole-rat and expressed at normal levels in DRG, and
      TRPV1 mRNA punctae per cell are statistically indistinguishable between naked mole-rat
      and mouse, in contrast to the TRPM8 and TRPA1 differences the paper reports.
    supporting_text: We also probed for TRPV1 mRNA transcripts as a further TRP channel
      comparison and found that the average number of punctae per cell was similar between
      the species
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Important as a control on the thermosensation question: the naked
      mole rat's genuine thermal difference is in cold, and this paper places that difference
      in TRPM8/TRPA1 while explicitly finding TRPV1 transcript levels normal. Nothing here
      supports a cold-sensing role for TRPV1.
- id: PMID:34476892
  title: "The naked truth: a comprehensive clarification and classification of current 'myths'\
    \ in naked mole-rat biology."
  findings:
  - statement: >-
      The claim that naked mole-rats feel no pain has no basis in the literature: the animals
      respond normally to noxious heat and mechanical stimuli and lack responses only to
      specific stimuli such as acid and capsaicin.
    supporting_text: Normal nocifensive responses were reported for noxious heat and
      mechanical stimuli.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Directly relevant because TRPV1 claims about this species are a known
      source of over-statement. Its Myth 10 section corrects the blanket "no pain" claim and
      affirms normal noxious-heat nocifension, which is why the heat-related terms proposed
      here are cellular-response terms rather than organism-level pain terms.
- id: PMID:40705105
  title: Artemin sensitises mouse (Mus musculus) and naked mole-rat (Heterocephalus glaber)
    sensory neurons in vitro.
  findings:
  - statement: >-
      Capsaicin-evoked TRPV1 currents are recorded under voltage clamp from naked mole-rat
      DRG neurons, about 28% of which are TRPV1-positive, and artemin sensitises those
      neurons and reduces TRPV1 desensitisation, showing that the channel is subject to
      normal sensitisation by at least one growth-factor pathway.
    supporting_text: In summary, employing in vitro methods, we observed that artemin
      sensitizes both the intrinsic electrical properties of mouse and NMR DRG sensory
      neurons as well as sensitivity to capsaicin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The most recent independent confirmation that naked mole-rat TRPV1 is
      a working capsaicin-gated channel, recorded by whole-cell voltage clamp rather than
      calcium imaging. Also a useful counterweight to the TrkA story: sensitisation of this
      channel is not globally lost in the species, only the NGF/TrkA arm is impaired.
- id: PMID:20497578
  title: Absence of histamine-induced itch in the African naked mole-rat and "rescue" by
    Substance P.
  findings:
  - statement: >-
      Calcium imaging of naked mole-rat DRG neurons identifies a capsaicin-responsive
      population (10% activated by 1 uM capsaicin alone, a further 13% by both capsaicin and
      histamine), confirming functional TRPV1 in small-diameter neurons.
    supporting_text: 10% (n = 35/343) were activated by 1 μM capsaicin
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Cited only for its independent demonstration of capsaicin-evoked
      calcium responses in naked mole-rat DRG neurons; the paper's main subject is histamine
      itch and substance P rescue.
- id: PMID:21200438
  title: 'Functional neurokinin and NMDA receptor activity in an animal naturally lacking
    substance P: the naked mole-rat.'
  findings:
  - statement: >-
      Capsaicin sensitises heat-evoked foot withdrawal in mice but not in naked mole-rats,
      and intrathecal substance P restores heat sensitisation, locating the deficit in spinal
      neuropeptide signalling rather than in the capsaicin receptor.
    supporting_text: Capsaicin sensitizes heat-evoked foot withdrawal to heat in mice, but
      not naked mole-rats.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Supports the interpretation that the missing capsaicin-induced
      thermal hyperalgesia is a spinal and neuropeptide phenomenon; it makes no claim about
      TRPV1 protein function itself.
- id: file:HETGA/Trpv1/Trpv1-uniprot.txt
  title: UniProt record G9DCX1 for naked mole rat Trpv1
  findings:
  - statement: >-
      The 840-residue TrEMBL entry derives from mRNA JF912492 (AEV53346.1) submitted with
      PMID:22174253, carries six Phobius-predicted transmembrane helices, a Pfam PF00520 ion
      transport domain (437-695) and ankyrin repeats, and is classified in PANTHER
      PTHR10582:SF17.
    supporting_text: Multi-pass membrane protein
  - statement: >-
      The only subcellular location on the record is an ARBA-derived keyword assignment to
      dendritic spine membrane, with no experimental evidence tag.
    supporting_text: 'SUBCELLULAR LOCATION: Cell projection, dendritic spine membrane'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched UniProt record, not edited. Used for sequence, domain architecture and
      the provenance of the SubCell keyword annotation. Both quoted strings were grep-checked
      against the file and each lies within a single physical line.
- id: file:HETGA/Trpv1/Trpv1-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for TRPV1 (human ortholog record)
  findings:
  - statement: >-
      Conserved-mechanism baseline for the TRPV1 family: cryo-EM gating trajectory, the
      capsaicin binding pose and its coupling to the S4-S5 linker, PIP2 as a positive
      cofactor, PKA/AKAP150 and PKC-mediated sensitisation, TRPV1-TRPA1 and TRPV1-TRPV4
      heteromers, and a non-channel role in modulating mu-opioid receptor desensitisation.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      This is the Affinage record for the HUMAN ortholog (Q8NER1), fetched deliberately as a
      conserved-mechanism baseline because Affinage does not run on non-human species; its
      frontmatter and heading both say human. It is used only for family-level mechanism, and
      no sentence from it is cited as evidence about the naked mole-rat protein. Its
      mechanism_profile GO ids (GO:0005215, GO:0060089, GO:0008289, GO:0140299) were not
      imported: they are coarse parents and, for the sensor and transducer terms, not what a
      curator would assert for a channel whose gating has been measured directly. Its recall
      gap on the species question is total - none of its 22 citations is a naked mole-rat
      paper, and it therefore misses the functionally silent Ser502Thr substitution and the
      TrkA-not-TRPV1 dissociation, both of which are decisive here.
