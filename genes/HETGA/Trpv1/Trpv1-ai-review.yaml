  review:
    summary: >-
      Core molecular function, and positively confirmed in naked mole-rat material rather
      than merely projected. Capsaicin evokes Ca2+ influx in naked mole-rat DRG neurons at
      the same incidence and magnitude as in mouse, and the cloned naked mole-rat protein
      produces capsaicin-evoked Ca2+ signals when expressed in naked mole-rat fibroblasts.
    action: ACCEPT
    reason: >-
      Fura-2 calcium imaging of cultured naked mole-rat DRG neurons showed capsaicin-evoked
      Ca2+ responses equivalent to mouse at both 10 nM and 2 uM capsaicin, with no
      difference in the proportion of responding neurons [PMID:18232734]. Capsaicin-evoked
      Ca2+ signals were also recorded from a naked mole-rat fibroblast line transfected with
      nmrTrpv1 [PMID:27732851], establishing that the Ca2+ conductance is a property of this
      protein and not of some other channel in the neuron. The ARBA/PANTHER projection is
      therefore not merely plausible but directly corroborated for this species.
