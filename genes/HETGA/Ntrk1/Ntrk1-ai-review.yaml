      raised phospho-ERK through the receptor bearing the naked mole-rat intracellular domain,
      to a lower level than through rat TrkA. Reduced is not absent, and positive regulation
      of the ERK1/2 cascade is therefore a demonstrated activity of this protein's
      intracellular domain. Caveat recorded honestly: the assay used a chimeric receptor with
      a rat ectodomain expressed in HEK293 cells, so the evidence is for the naked mole-rat
