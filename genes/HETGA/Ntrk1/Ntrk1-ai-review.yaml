- term:
    id: GO:0070374
    label: positive regulation of ERK1 and ERK2 cascade
  evidence_type: IDA
  original_reference_id: PMID:27732851
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. The one downstream branch for which direct measurements on the
      naked mole-rat TrkA intracellular domain exist: NGF stimulation increases ERK1/2
      activation through it, less efficiently than through rat TrkA but unambiguously.
    action: NEW
    reason: >-
      The current GOA set annotates the PI3K/AKT branch, for which there is no naked-mole-rat
      measurement at all, but not the ERK branch, for which there is. Omerbasic et al.
      quantified ERK1 (MAPK3 pTyr-204) and ERK2 (MAPK1 pTyr-187) phosphopeptides by SILAC
