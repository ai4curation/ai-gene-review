- term:
    id: GO:0038180
    label: nerve growth factor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Core biological process, retained in this species with reduced efficiency rather than
      lost.
    action: ACCEPT
    reason: >-
      This is the annotation the naked mole-rat phenotype most tempts a reviewer to negate,
      and it should not be negated. The pathway operates: naked mole-rat sensory neurons
      respond to NGF with neurite outgrowth, the cloned receptor sensitises TRPV1 to
      rat-equivalent levels at 1,000 ng/mL NGF, and NGF still produces mechanical
      hyperalgesia in adult animals. What is reduced is the efficiency of the coupling at
      physiological NGF concentrations, mapped by chimeric receptors to the intracellular
      domain. A quantitative attenuation of an operative pathway is recorded in prose, not by
      REMOVE and not by a NOT qualifier - the latter would be positively false here, since
      the receptor does drive the pathway when NGF is high.
    additional_reference_ids:
    - PMID:32478202
    supported_by:
    - reference_id: PMID:27732851
      supporting_text: >-
        the naked mole-rat TrkA molecule is less efficient at initiating sensitization with
        NGF concentrations of ∼100 ng/mL
    - reference_id: PMID:27732851
      supporting_text: >-
        NGF signaling in adult naked mole-rat is still capable of producing mechanical
        hyperalgesia, a process that does not involve TRPV1
    - reference_id: PMID:32206859
      supporting_text: >-
        Indeed experiments using naked mole-rat TrkA and a chimeric TrkA (extracellular
        rat/intracellular naked mole-rat) further showed that activation of the naked mole-rat
        TrkA receptor is much less efficient at producing NGF-induced TRPV1 sensitization,
        thus indicating that the deficit lies in the intracellular domain
- term:
    id: GO:0043121
    label: neurotrophin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Ligand binding is retained. The chimeric-receptor experiment specifically excluded the
      ectodomain as the site of the naked mole-rat defect.
    action: ACCEPT
    reason: >-
      The naked mole-rat ectodomain has diverged, including the juxtamembrane NGF-binding
      region, which raises the obvious question of whether ligand binding is compromised.
      Omerbasic et al. tested precisely this: a chimera carrying the rat extracellular domain
      with the naked mole-rat transmembrane and kinase domains reproduced the signalling
      deficit, showing that the lesion is intracellular and that poor ligand binding is not
      the explanation. Functionally, NGF binding must occur for the receptor to drive neurite
      outgrowth in naked mole-rat neurons and to sensitise TRPV1 at high NGF. No direct
      binding measurement (Kd, SPR) has been made on the naked mole-rat protein - that
      limitation is recorded in the notes and as a suggested experiment - but the functional
      evidence supports the annotation. The general term is appropriate: TrkA family
      receptors bind more than one neurotrophin, and only NGF has been tested here.
    supported_by:
    - reference_id: PMID:27732851
      supporting_text: >-
        There was significant sequence divergence in the extracellular TrkA domains,
