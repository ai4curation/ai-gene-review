proposed_new_terms: []
suggested_questions:
- question: >-
    Is there any acceptable way to represent a receptor whose signalling output is
    quantitatively reduced but qualitatively intact? GO's action vocabulary offers ACCEPT or
    NOT, and neither expresses "same function, right-shifted dose-response"; the naked
    mole-rat TrkA is a clean test case for whether an efficiency annotation extension is
    warranted.
  experts: []
- question: >-
    Should the absence of NGF-induced heat hyperalgesia be captured anywhere in GO for this
    gene? It is an organismal phenotype, not a molecular function, and a NOT annotation would
    be false because the receptor does sensitise TRPV1 at high NGF - but it is the single most
    important fact about the gene in this species.
  experts: []
- question: >-
    Which of the one to three kinase-domain substitutions is causal? The paper could not
    resolve this, and the Mashona mole-rat shares two of the three without losing C-fibres,
    which points at the naked-mole-rat-specific leucine-to-cysteine change at 774 but does not
    prove it.
  experts:
  - Gary R. Lewin
  - Damir Omerbašić
- question: >-
    Do the endosomal and axonal localisation annotations hold for the naked mole-rat receptor?
    If the 774 substitution altered receptor trafficking, recycling, or turnover rather than
    only catalytic coupling, these untested transfers are where it would show.
  experts: []
suggested_experiments:
- hypothesis: >-
    Naked mole-rat TrkA binds NGF with affinity comparable to rat TrkA, and the hypofunction
    is entirely post-binding.
  description: >-
    Measure NGF binding directly to purified naked mole-rat and rat TrkA ectodomains by
    surface plasmon resonance or isothermal titration calorimetry, and by saturation binding
    of labelled NGF to intact cells expressing each full-length receptor. The chimeric-receptor
    experiment excluded the ectodomain as the cause of the signalling deficit but did not
    measure affinity; the neurotrophin binding annotation currently rests on functional
    inference alone.
  experiment_type: quantitative ligand binding
- hypothesis: >-
    The PI3K/AKT branch downstream of naked mole-rat TrkA is attenuated to a similar degree as
    the ERK branch, because the 774 substitution perturbs recognition of the flanking Tyr751
    p85 docking site.
  description: >-
    Stimulate cells expressing rat, full-length naked mole-rat, and chimeric TrkA with a range
    of NGF concentrations and quantify phospho-AKT (Ser473, Thr308), phospho-Tyr751, and p85
    co-immunoprecipitation alongside phospho-ERK as an internal reference. This is the one
    annotated downstream branch for which no naked-mole-rat measurement exists.
  experiment_type: dose-resolved signalling assay
- hypothesis: >-
    The leucine-to-cysteine substitution at 774 is individually sufficient to reduce
    NGF-driven signalling output.
  description: >-
    Introduce the single 774 substitution into rat TrkA and the reciprocal reversion into
    naked mole-rat TrkA, then compare NGF dose-response curves for activation-loop
    autophosphorylation, ERK1/2 phosphorylation, and TRPV1 sensitisation. Include the other
    two kinase-domain variants singly and in combination to apportion the effect.
  experiment_type: site-directed mutagenesis and structure-function
- hypothesis: >-
    Naked mole-rat TrkA traffics, internalises and recycles like its orthologues, so the
    endosomal localisation annotations transfer correctly.
  description: >-
    Follow surface-labelled TrkA in naked mole-rat and mouse dorsal root ganglion neurons by
    live imaging and endosomal-marker colocalisation after NGF stimulation, and measure
    receptor half-life and retrograde axonal transport in compartmented cultures. This tests
    the early, late and recycling endosome membrane annotations, and the axon annotation, none
    of which has ever been examined in this species.
  experiment_type: receptor trafficking and live imaging
- hypothesis: >-
    The postnatal loss of C-fibres in naked mole-rats proceeds by apoptosis and is
    TrkA-dependent.
  description: >-
    Quantify apoptotic markers in naked mole-rat dorsal root ganglia across the postnatal
    window during which C-fibre number falls, and test whether exogenous NGF at high
    concentration, or expression of a wild-type mammalian TrkA, prevents the loss. The current
    negative regulation of neuron apoptotic process annotation rests on the conserved
    neurotrophic survival function plus a statement that embryonic survival is supported; the
    apoptotic mechanism of the adult deficit has never been demonstrated.
  experiment_type: developmental cell-death analysis
references:
- id: PMID:27732851
  title: Hypofunctional TrkA Accounts for the Absence of Pain Sensitization in the African
    Naked Mole-Rat.
  findings:
  - statement: >-
      The naked mole-rat TrkA kinase domain carries one to three amino acid substitutions,
      including a leucine-to-cysteine change at position 774 unique to this species, that
      render the receptor less efficient at engaging downstream signal transduction.
    supporting_text: >-
      Between one- and three-amino-acid substitutions in the kinase domain of the naked
      mole-rat TrkA are sufficient to render the receptor hypofunctional, and this is
      associated with the absence of heat hyperalgesia.
  - statement: >-
      The deficit is quantitative and surmountable: naked mole-rat TrkA reaches rat-equivalent
      TRPV1 sensitisation at 1,000 ng/mL NGF.
    supporting_text: >-
      When oocytes were stimulated with 1,000 ng/mL NGF, activation of the naked mole-rat TrkA
      receptor produced a degree of sensitization similar to that observed with rat TrkA
  - statement: >-
      Naked mole-rat TrkA signalling remains sufficient for embryonic sensory neuron survival
      and development.
    supporting_text: >-
      It thus appears that the signaling capacity of the naked mole-rat TrkA is sufficient to
      support the survival and functional development of sensory neurons during embryonic
      development
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read in full. The primary and decisive source for every
      species-specific call in this review. Verified that the paper's central claim is a
      reduction in signalling efficiency, not a loss of receptor function: ligand binding is
      excluded as the lesion by the chimeric-receptor experiment, the kinase domain
      autophosphorylates basally, and the NGF dose-response reaches rat-equivalent output at
      1,000 ng/mL. The residue position 774 is stated with rat numbering; the naked mole-rat
      UniProt entry independently carries a cysteine at its own position 774, which is
      recorded separately in the notes rather than inferred from the paper.
- id: PMID:18232734
  title: Selective inflammatory pain insensitivity in the African naked mole-rat
    (Heterocephalus glaber).
  findings:
  - statement: >-
      NGF fails to produce heat hyperalgesia in naked mole-rats, acutely and chronically.
    supporting_text: >-
      But NGF also failed to produce heat hyperalgesia both acutely (<4 h) and chronically
      (>24h)
  - statement: >-
      Naked mole-rat sensory neurons carry functional NGF receptors: TrkA-positive cultured
      neurons elaborate extensive neurites in response to 500 ng/mL NGF.
    supporting_text: >-
      In the presence of 500 ng/ml of NGF, sensory neurons elaborated extensive neurites and
      the same cells were positive for the trk A receptor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. The phenotype paper, and the source of the only positive
      naked-mole-rat evidence for the neurite-outgrowth annotations. Its Figure S2 legend is
      an explicit demonstration that the NGF receptor is functional in this species, which is
      what makes ACCEPT rather than REMOVE the right call on the core molecular function
      terms.
- id: PMID:32206859
  title: 'Independent evolution of pain insensitivity in African mole-rats: origins and
    mechanisms.'
  findings:
  - statement: >-
      Chimeric receptor experiments localise the naked mole-rat TrkA signalling deficit to the
      intracellular domain.
    supporting_text: >-
      Indeed experiments using naked mole-rat TrkA and a chimeric TrkA (extracellular
      rat/intracellular naked mole-rat) further showed that activation of the naked mole-rat
      TrkA receptor is much less efficient at producing NGF-induced TRPV1 sensitization, thus
      indicating that the deficit lies in the intracellular domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Review by authors of the primary work; used here as a concise
      independent restatement of the chimeric-receptor result and of TrkA expression in naked
      mole-rat sensory neurons. Adds no primary data on this gene, so all quantitative claims
      are anchored to PMID:27732851 instead.
- id: PMID:40705105
  title: Artemin sensitises mouse (Mus musculus) and naked mole-rat (Heterocephalus glaber)
    sensory neurons in vitro.
  findings:
  - statement: >-
      TrkA expression and IB4 binding define largely distinct sensory neuron populations in
      naked mole-rat dorsal root ganglia, as in mouse.
    supporting_text: >-
      IB4 binding and TrkA expression also define largely distinct populations in NMR DRG
      neurons
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available. Independent 2025 confirmation that TrkA marks a defined sensory
      neuron population in this species, and important for bounding the TrkA deficit: artemin
      does sensitise naked mole-rat sensory neurons, so the failure of sensitisation is
      specific to the NGF/TrkA route rather than a general inability of these neurons to be
      sensitised.
- id: PMID:32478202
  title: The naked mole-rat has a functional purinergic pain pathway despite having a
    non-functional peptidergic pain pathway.
  findings:
  - statement: >-
      The P2X3 purinergic pathway is functional in naked mole-rats, showing that the species'
      pain-pathway deficits are selective rather than global.
    supporting_text: >-
      we used Ca2+-imaging of cultured dorsal root ganglion neurons and in vivo behavioral
      testing to demonstrate that the P2X3 pathway is functional in naked mole-rats
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text available. Background context only; no TrkA data. Cited to support the point
      that naked mole-rat nociceptive signalling is selectively, not globally, disabled, which
      is part of the argument against negating the NGF signalling pathway annotation.
