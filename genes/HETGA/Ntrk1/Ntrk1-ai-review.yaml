- term:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Core molecular function, and positively supported in this species. The naked mole-rat
      receptor is hypofunctional in the sense of reduced signalling efficiency, but it retains
      the activity itself.
    action: ACCEPT
    reason: >-
      This is the annotation the naked mole-rat literature is most likely to be
      misread as challenging, so the argument matters. Omerbasic et al. cloned nmrTrkA from
      sensory neuron mRNA and showed that at 100 ng/mL NGF it sensitises TRPV1 significantly
      less than rat TrkA - but at 1,000 ng/mL it reaches rat-equivalent output. A
      dose-response curve shifted to the right yet reaching the wild-type maximum is the
      signature of reduced efficiency, not of a lost molecular function. Independently, the
      kinase domain is catalytically competent: the chimeric receptor carrying the naked
      mole-rat intracellular domain shows strong basal activation-loop autophosphorylation,
      and all activation tyrosines are conserved. The sequence of A0AAX6QC09 carries the
      complete catalytic apparatus (P-loop 518..526, beta-3 Lys546, HRD Asp652 assigned as
      proton acceptor, DFG at 670, activation-loop Tyr pair at 682/683). REMOVE would assert
      that this protein cannot act as a receptor tyrosine kinase, which the data contradict;
      the quantitative deficit belongs in the annotation comment, not in the action.
    supported_by:
    - reference_id: PMID:27732851
      supporting_text: >-
        When oocytes were stimulated with 1,000 ng/mL NGF, activation of the naked mole-rat
        TrkA receptor produced a degree of sensitization similar to that observed with rat
        TrkA
    - reference_id: PMID:27732851
      supporting_text: >-
        All tyrosine residues important for receptor activation were conserved in all the
        species, including the naked mole-rat.
    - reference_id: PMID:27732851
      supporting_text: >-
        the Tyr674/675 residues in both chimeric TrkA and rat TrkA displayed strong basal
        receptor phosphorylation in the absence of NGF
    - reference_id: file:HETGA/Ntrk1/Ntrk1-uniprot.txt
      supporting_text: >-
        FT   ACT_SITE        652
- term:
    id: GO:0005030
    label: neurotrophin receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Core molecular function. TrkA is the high-affinity NGF receptor, and naked mole-rat
      sensory neurons demonstrably transduce an NGF signal through it.
    action: ACCEPT
    reason: >-
      The term requires combining with a neurotrophin and transmitting the signal to initiate
      a change in cell activity - both halves are satisfied in this species. Park et al.
      showed that cultured naked mole-rat sensory neurons that stain for TrkA elaborate
      extensive neurites in response to NGF, and explicitly used this to exclude absent or
      non-functional NGF receptors as the explanation for the missing thermal hyperalgesia.
      The InterPro NTRK1 signature and the PANTHER high-affinity NGF receptor subfamily
      assignment place the protein unambiguously in the TrkA orthology group. The reduced
      signalling efficiency documented by Omerbasic et al. refines this function; it does not
      abolish it.
    supported_by:
    - reference_id: PMID:18232734
      supporting_text: >-
        The lack of NGF-induced thermal hyperalgesia cannot be explained by a lack of
        functional NGF receptors, because we were able to observe a robust stimulation of
        neurite-growth in cultured small and medium sensory neurons that were also stained
        positive for the NGF receptor TrkA
    - reference_id: PMID:18232734
      supporting_text: >-
        In the presence of 500 ng/ml of NGF, sensory neurons elaborated extensive neurites and
        the same cells were positive for the trk A receptor
    - reference_id: file:HETGA/Ntrk1/Ntrk1-uniprot.txt
      supporting_text: >-
        DR   InterPro; IPR020461; NTRK1.
