- id: file:HETGA/Ntrk1/Ntrk1-deep-research-affinage-human-ortholog.md
  title: Affinage mechanistic annotation for NTRK1 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This is the Affinage record for the HUMAN orthologue NTRK1/P04629, fetched deliberately
      as a conserved-mechanism baseline because Affinage covers human genes only. It is a
      dense, well-cited map of the conserved receptor - D5 NGF-binding hot spot, ordered bi-bi
      kinetics, Y490/Y785 docking, IRS-mediated p85-PI3K recruitment, N-glycosylation gating
      of surface delivery, STX8 and GGA3 trafficking, retrograde signalling endosomes, TRAF4
      and Nedd4-2 ubiquitin control - and it is what makes the endosome-membrane and
      receptor-complex transfers in this GOA set credible at the family level. It contains
      zero mentions of naked mole-rat, Heterocephalus, or PMID:27732851 across all 34
      citations, so it is unusable as evidence for any species-specific claim, and no sentence
      of it is quoted as supporting_text anywhere in this review. Its mechanism_profile GO ids
      were not imported: they collapse to coarse parents and one of them, GO:0048018 receptor
      ligand activity, is wrong for a receptor. One useful lead it did surface is
      PMID:24623787, a KFG-deletion knock-in mouse in which raised TrkA activity produces
      enhanced thermal sensitivity - the mirror image of the naked mole-rat, recorded as a
      lead in the notes rather than as evidence.
