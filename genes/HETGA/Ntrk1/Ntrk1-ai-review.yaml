core_functions:
- description: >-
    NGF-activated transmembrane receptor tyrosine kinase at the neuronal plasma membrane.
    Ligand binding drives dimerisation and trans-autophosphorylation of the conserved
    activation-loop tyrosines, coupling extracellular NGF concentration to the ERK1/2 and p38
    cascades. In the naked mole-rat the catalytic apparatus and all activation tyrosines are
    intact and the receptor reaches rat-equivalent output at high NGF, but one to three
    kinase-domain substitutions reduce the efficiency of this coupling at physiological NGF
    concentrations.
  supported_by:
  - reference_id: PMID:27732851
    supporting_text: >-
      When oocytes were stimulated with 1,000 ng/mL NGF, activation of the naked mole-rat TrkA
      receptor produced a degree of sensitization similar to that observed with rat TrkA
  - reference_id: PMID:27732851
    supporting_text: >-
      All tyrosine residues important for receptor activation were conserved in all the
      species, including the naked mole-rat.
  - reference_id: PMID:27732851
    supporting_text: >-
      western blotting for phosphorylated Erk in HEK293 cells transfected with rat or chimeric
      TrkA after NGF stimulation revealed reduced levels of phospho-Erk protein after
      stimulation of the chimeric receptor
  - reference_id: file:HETGA/Ntrk1/Ntrk1-uniprot.txt
    supporting_text: >-
      Reaction=L-tyrosyl-[protein] + ATP = O-phospho-L-tyrosyl-[protein] +
