id: A0AAX6QC09
gene_symbol: Ntrk1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10181
  label: Heterocephalus glaber
description: >-
  Ntrk1 encodes TrkA, the high-affinity nerve growth factor (NGF) receptor: a single-pass
  type I plasma-membrane receptor tyrosine kinase built from an extracellular leucine-rich
  repeat and two immunoglobulin-like domains, a transmembrane helix, and an intracellular
  tyrosine kinase domain. NGF binding drives receptor dimerisation and trans-autophosphorylation
  of the activation-loop tyrosines, creating phosphotyrosine docking sites - an NPQY motif
  that recruits SHC1 and a C-terminal site that recruits PLCG1 - which couple the receptor to
  the ERK/MAPK, p38 and PI3K/AKT cascades. In sensory ganglia TrkA marks the peptidergic
  nociceptor population, where it supports neuronal survival and neurite outgrowth during
  development and, in most mammals, sensitises the heat-gated channel TRPV1 during
  inflammation. The naked mole-rat protein is a functionally distinctive variant: it carries
  one to three substitutions in the otherwise strictly conserved kinase domain, including a
  leucine-to-cysteine change at position 774, that leave ligand binding and the catalytic
  apparatus intact but reduce the efficiency with which ligand occupancy is converted into
  downstream signalling. NGF-driven ERK1/2 and p38 phosphorylation is weaker than in rat, and
  TRPV1 sensitisation is markedly reduced at 100 ng/mL NGF yet reaches rat-equivalent output
  at ten-fold higher ligand concentration. The receptor nonetheless remains
  competent for the outputs that matter developmentally: it is expressed on about half of
  naked mole-rat dorsal root ganglion neurons and drives robust neurite outgrowth in them, and
  it supports embryonic sensory neuron survival, although adult naked mole-rats show a marked
  paucity of unmyelinated C-fibres that emerges after birth. At the organismal level the
  reduced signalling output is associated with a complete absence of NGF- and
  inflammation-induced heat hyperalgesia, while NGF-dependent mechanical hyperalgesia is
  retained.
