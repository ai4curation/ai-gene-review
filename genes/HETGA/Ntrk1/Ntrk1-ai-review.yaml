- term:
    id: GO:0030424
    label: axon
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Plausible family-level projection resting on the mouse and rat retrograde-signalling
      literature; no naked-mole-rat evidence either way.
    action: KEEP_AS_NON_CORE
    reason: >-
      TrkA in sensory and sympathetic neurons is internalised at axon terminals and
      retrogradely transported in signalling endosomes, which is the basis for the TreeGrafter
      projection from PTN000699860. In the naked mole-rat, TrkA-positive dorsal root ganglion
      neurons certainly exist and project axons in cutaneous nerves, but no one has localised
      the protein within naked mole-rat axons. Nothing contradicts the annotation, so it is
      retained; it is not a core claim about this protein and, given that the species shows a
      postnatal loss of unmyelinated axons that may reflect altered TrkA signalling, axonal
      trafficking is one of the places a species-specific difference could hide.
    supported_by:
    - reference_id: PMID:27732851
      supporting_text: >-
        a hypofunctional TrkA receptor in the naked mole-rat is associated with a striking
        paucity of unmyelinated C-fibers in adult peripheral nerves
