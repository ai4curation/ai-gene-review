      membrane (IPM) network immediately post-invasion (Sibley et al. 1986; Dubremetz et al.
      1993).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Supports the parasitophorous vacuole location recorded by UniProt and shows that
      it reflects shedding or export of surface material. Abstract-only in the cache.
- id: PMID:40607979
  title: Surface antigen SAG1 mediates Toxoplasma gondii fitness and host cell attachment
    in IFNγ-stimulated cells.
  findings:
  - statement: >-
      A CRISPR SAG1 knockout showed reduced attachment that was restored by
      complementation, with the defect amplified in interferon-gamma-stimulated cells
      and in host cells lacking sialic acid.
    supporting_text: the Δsag1 strain displayed a significantly reduced attachment, with only 81% of WT
      attachment levels, indicating the important role of SAG1 in mediating adhesion.
  - statement: >-
      Intracellular replication was unaffected by SAG1 deletion, so the fitness defect
      is attributable to attachment rather than growth.
    supporting_text: suggesting that parasite replication is not affected by SAG1 deletion.
  - statement: >-
      Heparan sulfate contributed little to SAG1-dependent adhesion, whereas sialic
      acid was required.
    supporting_text: suggesting that heparan sulfate plays a minimal role in SAG1-mediated adhesion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache. The cleanest genetic evidence for SAG1 in
      attachment: knockout plus complementation, with host glycosylation mutants.
      Supports the proposed adhesion-of-symbiont-to-host-cell annotation.
- id: PMID:34950858
  title: Toxoplasma gondii SAG1 targeting host cell S100A6 for parasite invasion and
    host immunity.
  findings:
  - statement: >-
      Proximity labelling with a SAG1-TurboID fusion in infected human fibroblasts
      identified host S100A6 as a SAG1-proximal protein, and SAG1 was reported to
      reduce the host S100A6-vimentin interaction early after infection.
    supporting_text: We utilized the biotin ligase -TurboID fusion with TgSAG1 to identify the host proteins
      interacting with TgSAG1, and identified that S100A6 was co-localized with TgSAG1 when T.
      gondii attached to the host cell.
  - statement: >-
      Infection with wild-type parasites induced more TNF-alpha than infection with
      the SAG1 deletion strain, which the authors attribute to an
      S100A6-vimentin/PKC-theta/NF-kB route.
    supporting_text: As an immunogen, TgSAG1 could promote the secretion of tumor
      necrosis factor alpha (TNF-α) through S100A6-Vimentin/PKCθ-NF-κB signaling
      pathway.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Full text cached and internally consistent, and cited by UniProt for FUNCTION
      and SUBUNIT. It is nonetheless a single-laboratory mechanism built on proximity
      labelling plus knockdown, and the proposed signalling chain involves
      intracellular host proteins that a GPI-anchored surface protein would not
      obviously reach. No annotation is proposed from it; it is recorded as a
      knowledge gap instead.
- id: PMID:31165984
  title: Identification of Host Proteins Interacting with Toxoplasma gondii SAG1 by
    Yeast Two-Hybrid Assay.
  findings:
  - statement: >-
      A yeast two-hybrid screen of a human cDNA library with SAG1 as bait recovered
      lysine-rich coiled-coil protein as the strongest interactor, supported by
      co-immunoprecipitation.
    supporting_text: The results indicated that a strong interaction existed between Homo sapiens lysine-rich
      coil-coiled and SAG1 protein, which could activate the expressions of the reporter genes in
      diploid yeast. Co-immunoprecipitation experiment result indicated the binding between this
      prey and SAG1 protein was significant (Mann-Whitney U test, Z = - 1.964, P = 0.05).
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Cited by UniProt for the KRCC1 interaction. Yeast two-hybrid with a secreted,
      disulfide-rich, GPI-anchored bait is prone to artefacts, and no infection-based
      validation is reported; no annotation is derived from it.
- id: PMID:29351065
  title: Measurement of binding strength between prey proteins interacting with Toxoplasma
    gondii SAG1 and SAG2 using isothermal titration calorimetry (ITC).
  findings:
  - statement: >-
      Isothermal titration calorimetry with recombinant proteins produced a typical
      binding curve for SAG1 with its human prey protein.
    supporting_text: ITC results indicated there was a typical binding curve for
      interactions between SAG1 and HLY protein.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Follow-up biophysics on the yeast two-hybrid hit, using bacterially expressed
      SAG1, which is unlikely to be correctly disulfide-bonded. Supports a physical
      interaction in vitro only.
- id: PMID:38157925
  title: Toxoplasma gondii surface antigen 1 (SAG1) interacts in vitro with host cell
    receptor for activated C kinase 1 (RACK1).
  findings:
  - statement: >-
      RACK1 was identified as a SAG1 binding partner in host cells, and its depletion
      reduced host cell viability, leading the authors to propose that SAG1 preserves
      host cell viability through RACK1.
    supporting_text: the expression of RACK1 is manipulated by SAG1, and depletion of RACK1 negatively regulated
      host cell viability.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Cited by UniProt for FUNCTION and SUBUNIT, but the proposed partner is an
      intracellular host scaffold, and the paper's own title limits the claim to an in
      vitro interaction. Only the abstract is cached. No annotation is proposed.
- id: PMID:15294991
  title: The induction of acute ileitis by a single microbial antigen of Toxoplasma
    gondii.
  findings:
  - statement: >-
      Susceptible mice orally infected with a SAG1-deficient strain did not develop
      the lethal ileitis caused by wild-type parasites, although the mutant replicated
      normally in enterocytes and dendritic cells.
    supporting_text: C57BL/6 mice orally infected with Deltasag1 parasites failed to
      develop ileitis.
  - statement: >-
      Loss of SAG1 does not impair intracellular replication, so the immunopathology
      phenotype is not a growth defect.
    supporting_text: In vitro, the mutant parasites replicate in both enterocytes and
      dendritic cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Strong in vivo immunology, but the phenotype is a host immune response to SAG1
      as an antigen rather than an activity SAG1 performs, so no symbiont-side process
      term is proposed from it. Useful as independent evidence that SAG1 is
      dispensable for replication.
- id: PMID:15944311
  title: Stage-specific expression of surface antigens by Toxoplasma gondii as a mechanism
    to facilitate parasite persistence.
  findings:
  - statement: >-
      Forcing constitutive expression of the tachyzoite antigen SAG1 into the
      bradyzoite stage altered cyst burden and caused severe encephalitis, showing
      that the stage restriction of SRS antigens contributes to persistence.
    supporting_text: We conclude that stage-specific expression of SRS Ags is among
      the key mechanisms by which optimal parasite persistency is established and
      maintained.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Supports the developmental-stage statement in the description. The phenotypes
      are properties of the host immune response to mis-timed antigen expression, not
      of a SAG1 molecular activity, so nothing is annotated from it.
- id: PMID:11566296
  title: 'Surface antigens of Toxoplasma gondii: variations on a theme.'
  findings:
  - statement: >-
      Review of the SAG1 and SAG2 families; notes that SAG3 null mutants show a clear
      attachment function, whereas rodent studies of a SAG1 knockout pointed to immune
      modulation or virulence attenuation.
    supporting_text: Analyses of a SAG1 knockout in rodents, however, indicate that
      this surface antigen may play a crucial role in immune modulation or virulence
      attenuation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Family-level context, used to keep the adhesion call proportionate: SAG1 is one
      of many partly redundant SRS adhesins, which is consistent with the mild
      knockout attachment phenotype seen later by CRISPR.
