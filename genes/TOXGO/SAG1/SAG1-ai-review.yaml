existing_annotations:
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR007226
  review:
    summary: >-
      InterPro2GO mapping from the SRS domain signature. SAG1 is a membrane protein,
      but the evidence supports a far more specific location: GPI attachment in the
      outer leaflet of the tachyzoite plasma membrane.
    action: MODIFY
    reason: >-
      The term is right but too general. Metabolic labelling with palmitate and
      myo-inositol plus release by PI-PLC showed that P30/SAG1 carries a glycolipid
      anchor (PMID:2925621), and structural analysis of that anchor placed SAG1 in the
      parasite plasma membrane via GPI (PMID:11522346). A GPI-anchored protein
      displayed on the parasite surface lies on the external side of the plasma
      membrane, so GO:0005886 and GO:0009897, both descendants of membrane, are the
      supported replacements. The SRS domain occurs in GPI-anchored surface antigens
      throughout the family, so the InterPro mapping is imprecise rather than wrong.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    - id: GO:0009897
      label: external side of plasma membrane
    additional_reference_ids:
    - PMID:2925621
    - PMID:11522346
    supported_by:
    - reference_id: PMID:2925621
      supporting_text: These results argue that P30 is anchored by a glycolipid.
    - reference_id: PMID:11522346
      supporting_text: The protein is inserted into the parasite's plasma membrane by a
        glycosyl-phosphatidylinositol anchor, a modification that is present on all T. gondii
        surface proteins characterized so far.
    - reference_id: PMID:12091874
      supporting_text: The surface of Toxoplasma is coated with a family of
        developmentally regulated glycosylphosphatidylinositol (GPI)-linked proteins
        (SRSs), of which SAG1 is the prototypic member.
- term:
    id: GO:0020003
    label: symbiont-containing vacuole
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0194
  review:
    summary: >-
      Mapped from the UniProt subcellular location "Parasitophorous vacuole". SAG1 is
      detected in vesicular extensions of the parasitophorous vacuole of intracellular
      tachyzoites, but that pool is surface material that has been shed or exported;
      the functional site is the parasite plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      Immuno-electron microscopy places SAG1 in vacuoles throughout the infected cell,
      described either as extensions of the parasitophorous vacuole or as exported
      parasite surface material (PMID:8570580), and UniProt records SAG1 as a component
      of the vesicular network inside that vacuole. The parasitophorous vacuole is a
      genuine Toxoplasma compartment and the symbiont-containing vacuole term is used
      in the correct direction for a parasite protein, so this is not a mis-transfer.
      Whether SAG1 is on the intravacuolar network right after invasion was contested
      in the early literature (PMID:8570580), and the location reflects shedding rather
      than the adhesin activity carried out at the parasite surface, so it is retained
      as non-core. No more specific term for the intravacuolar network exists, so the
      term is as precise as the evidence allows.
    additional_reference_ids:
    - PMID:8570580
    supported_by:
    - reference_id: PMID:8570580
      supporting_text: SAG1 is present on the surface of daughter zoites and is found
        throughout the infected cell in distinct vacuoles; these vacuoles represent
        either direct extensions of the parasitophorous vacuole or true export of
        parasite surface material.
    - reference_id: file:TOXGO/SAG1/SAG1-uniprot.txt
      supporting_text: vesicular network within the parasitophorous vacuole
- term:
    id: GO:0046812
    label: host cell surface binding
  evidence_type: IDA
  original_reference_id: PMID:15151144
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. A direct in vitro attachment assay showed that SAG1
      itself binds MDBK host cells, and that this binding is competed by a glucosamine
      neoglycoprotein, pointing to glucosamine-containing glycans on the host surface.
    action: NEW
    reason: >-
      This is the most direct evidence for the activity underlying the adhesin role,
      because the isolated protein rather than the whole parasite was assayed. The
      host ligand is not settled (glucosamine-containing glycans, PMID:15151144; a
      sialic-acid dependence of SAG1-mediated attachment, PMID:40607979; a predicted
      sulfated-proteoglycan groove in the dimer, PMID:12091874), so a ligand-agnostic
      term is the right level rather than a carbohydrate- or proteoglycan-binding
      term. Inhibition of whole-parasite attachment by the 6A8 monoclonal and its Fab
      (PMID:8050521) corroborates that SAG1 engages the host cell. No molecular
      function term is present in GOA for this protein.
    supported_by:
    - reference_id: PMID:15151144
      supporting_text: Soluble BSA-glucosamide blocked SAG1 attachment to MDBK cells
        in a dose-dependent manner, implying that SAGI binding is mediated, in part,
        via attachment to host cell surface glucosamine.
    - reference_id: PMID:8050521
      supporting_text: Taken together, these observations suggest that SAG-1 is an
        important parasite ligand that binds to the host cell in the process of T.
        gondii invasion.
- term:
    id: GO:0044650
    label: adhesion of symbiont to host cell
  evidence_type: IMP
  original_reference_id: PMID:40607979
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. A CRISPR SAG1 knockout attaches less efficiently to
      host cells; the defect is reversed by complementation and is larger in
      interferon-gamma-stimulated and in sialic-acid-deficient host cells.
    action: NEW
    reason: >-
      SAG1 carries out the adhesion step itself rather than being merely required for
      it: isolated SAG1 binds host cells (PMID:15151144), anti-SAG1 antibodies and Fab
      fragments inhibit attachment of tachyzoites to fixed host cells (PMID:8050521),
      and the knockout plus complementation experiment shows reduced attachment with
      no replication defect (PMID:40607979). The comparator check is consistent: other
      apicomplexan surface adhesins, such as P. falciparum CSP reviewed in this
      repository, carry this term. The term is the symbiont-side process term, correct
      for a parasite protein acting on a host cell, and is neither ancestor nor
      descendant of the binding term proposed above. GOA currently records no process
      annotation at all for SAG1.
    supported_by:
    - reference_id: PMID:40607979
      supporting_text: the Δsag1 strain displayed a significantly reduced attachment, with only 81% of WT
        attachment levels, indicating the important role of SAG1 in mediating adhesion.
    - reference_id: PMID:40607979
      supporting_text: SAG1-deficient parasites had reduced attachment efficiency,
        which was exacerbated in IFNγ-treated cells.
    - reference_id: PMID:8050521
      supporting_text: Treatment of fresh extracellular T. gondii with rabbit
        polyclonal anti-SAG-1 serum inhibited parasite attachment to host cells by
        71%.
core_functions:
- description: >-
    Tachyzoite surface adhesin. GPI-anchored SAG1, displayed on the outer face of the
    parasite plasma membrane, binds the host cell surface partly through host glycans
    and so contributes to the initial attachment of the tachyzoite that precedes
    microneme- and rhoptry-driven entry. Its contribution is partly redundant with
    other surface and micronemal adhesins in unstimulated cells, and becomes important
    when host cells are stimulated with interferon-gamma or lack surface sialic acid.
  supported_by:
  - reference_id: PMID:15151144
    supporting_text: Soluble BSA-glucosamide blocked SAG1 attachment to MDBK cells in a dose-dependent manner,
      implying that SAGI binding is mediated, in part, via attachment to host cell surface
      glucosamine.
  - reference_id: PMID:40607979
    supporting_text: These findings highlight the role of SAG1 in mediating robust
      parasite attachment, especially in the context of immune pressure.
  - reference_id: PMID:11522346
    supporting_text: The protein is inserted into the parasite's plasma membrane by a
      glycosyl-phosphatidylinositol anchor, a modification that is present on all T. gondii
      surface proteins characterized so far.
  molecular_function:
    id: GO:0046812
    label: host cell surface binding
  directly_involved_in:
  - id: GO:0044650
    label: adhesion of symbiont to host cell
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0005886
    label: plasma membrane
knowledge_gaps:
- gap_statement: >-
    The host molecule that SAG1 binds is unidentified. Separate studies implicate
    glucosamine-containing glycans, sialylated glycans and sulfated proteoglycans, and
    it is unknown which of these SAG1 contacts directly, or how interferon-gamma
    changes the host cell surface so that SAG1 becomes more important for attachment.
  boundary: >-
    That isolated SAG1 binds host cells, and that SAG1-null parasites attach less well,
    especially to interferon-gamma-stimulated or sialic-acid-deficient cells, is
    established; the basic groove of the crystallographic dimer is only a predicted
    proteoglycan site.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Naming the ligand would convert the longest-standing descriptive claim about the
    most abundant Toxoplasma surface protein into a defined receptor-ligand pair, and
    would explain why the attachment defect of the knockout depends on host immune
    status.
  resolution: >-
    Glycan-array and host-cell-surface capture profiling with recombinant SAG1 dimer,
    combined with attachment assays on host cells carrying defined glycosylation
    knockouts and with structure-guided mutation of the basic groove.
  provenance:
  - reference_id: PMID:15151144
    supporting_text: implying that SAGI binding is mediated, in part, via attachment to host cell surface
      glucosamine.
- gap_statement: >-
    It is unknown whether the host proteins reported to interact with SAG1 - S100A6,
    KRCC1 and RACK1 - are contacted by SAG1 during infection and, if so, how a
    GPI-anchored protein on the parasite surface reaches intracellular host proteins.
  boundary: >-
    The interactions have been reported by yeast two-hybrid, isothermal titration
    calorimetry, proximity labelling and co-immunoprecipitation, each by a single
    group; the topological route and the in vivo relevance have not been established.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    If genuine, these interactions would give SAG1 a signalling role toward the host
    cell beyond adhesion, and would explain reported effects on host cytoskeletal
    organisation and cytokine output; if they are artefacts of the assays, the
    simpler adhesin model stands.
  resolution: >-
    Independent replication with endogenously tagged SAG1 and host alleles, with
    quantitative proximity labelling controlled against a GPI-anchored non-SAG1
    surface protein, plus interface mutants that separate adhesion from the reported
    interaction.
  provenance:
  - reference_id: PMID:34950858
    supporting_text: We utilized the biotin ligase -TurboID fusion with TgSAG1 to identify the host proteins
      interacting with TgSAG1, and identified that S100A6 was co-localized with TgSAG1 when T.
      gondii attached to the host cell.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which host-cell-surface molecule does SAG1 bind directly, and does the basic groove
    of the SAG1 homodimer carry that binding site?
  experts: []
- question: >-
    Why does loss of SAG1 matter mainly in interferon-gamma-stimulated host cells - does
    interferon-gamma remove the redundant adhesion routes, or does it create the surface
    that SAG1 recognises?
  experts: []
- question: >-
    Are the reported interactions with host S100A6, KRCC1 and RACK1 reproducible in other
    laboratories, and can a surface-anchored protein plausibly reach them during infection?
  experts: []
- question: >-
    Is the immunodominance of SAG1 separable from its adhesive activity, given that the
    main conformational epitope does not overlap the predicted ligand pocket?
  experts: []
suggested_experiments:
- description: >-
    Structure-guided mutagenesis of the basic groove in the SAG1 homodimer, expressed
    from the native locus in a SAG1 knockout background, followed by quantitative
    attachment assays on naive and interferon-gamma-stimulated host cells and on cells
    lacking sialic acid or heparan sulfate.
  hypothesis: >-
    The conserved basic groove formed at the SAG1 dimer interface is the host-ligand
    binding site, and its disruption reproduces the attachment defect of the knockout.
- description: >-
    Glycan-array screening and host-cell-surface crosslinking with recombinant SAG1,
    comparing the candidate ligand classes implicated so far (glucosamine-containing
    glycans, sialylated glycans, sulfated proteoglycans) under naive and
    interferon-gamma-stimulated conditions.
  hypothesis: >-
    SAG1 binds a single class of host glycan whose abundance or accessibility is
    altered by interferon-gamma stimulation.
- description: >-
    Independent re-examination of the reported SAG1 host interactors using endogenous
    tagging, proximity labelling controlled with an unrelated GPI-anchored surface
    protein, and reciprocal co-immunoprecipitation in infected cells.
  hypothesis: >-
    Only a subset of the reported host partners is enriched specifically by SAG1 over a
    generic surface-anchored control.
