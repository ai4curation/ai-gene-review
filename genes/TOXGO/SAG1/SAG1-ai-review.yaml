- id: PMID:2925621
  title: The major surface antigen, P30, of Toxoplasma gondii is anchored by a glycolipid.
  findings:
  - statement: >-
      P30/SAG1 incorporates palmitate and myo-inositol and is released from intact
      parasites by phosphatidylinositol-specific phospholipase C, establishing a
      glycolipid (GPI) membrane anchor.
    supporting_text: These results argue that P30 is anchored by a glycolipid.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Located by PubMed search and cached here; title, authors and journal match the
      J Biol Chem 1989 record. Primary biochemical evidence for the membrane anchor
      that justifies replacing the generic membrane term.
- id: PMID:11522346
  title: Two glycoforms are present in the GPI-membrane anchor of the surface antigen
    1 (P30) of Toxoplasma gondii.
  findings:
  - statement: >-
      SAG1 is inserted into the parasite plasma membrane by a GPI anchor, which exists
      as two glycoforms differing by a terminal hexose on the GalNAc branch.
    supporting_text: The protein is inserted into the parasite's plasma membrane by a
      glycosyl-phosphatidylinositol anchor, a modification that is present on all T. gondii
      surface proteins characterized so far.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Structural characterisation of the SAG1 anchor; states explicitly that the
      anchor places SAG1 in the parasite plasma membrane, which is the basis for the
      MODIFY on GO:0016020.
- id: PMID:12091874
  title: Structure of the immunodominant surface antigen from the Toxoplasma gondii
    SRS superfamily.
  findings:
  - statement: >-
      The 1.7 A structure of SAG1 is a homodimer whose interface forms a deep,
      positively charged groove proposed to bind sulfated proteoglycans on target
      cells.
    supporting_text: This basic groove seems to be conserved among SRS proteins and potentially serves as a
      sulfated proteoglycan-binding site on target cell surfaces, thus rationalizing the
      promiscuous attachment properties of Toxoplasma to a broad range of host cell types.
  - statement: >-
      SAG1 is the prototypic member of a family of GPI-linked, developmentally
      regulated surface proteins that coat the parasite.
    supporting_text: The surface of Toxoplasma is coated with a family of
      developmentally regulated glycosylphosphatidylinositol (GPI)-linked proteins
      (SRSs), of which SAG1 is the prototypic member.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt for the crystal structure (PDB 1KZQ) and for the subunit
      description. The proteoglycan-binding groove is explicitly a structural
      proposal, not a measured binding activity, and is treated as such here.
- id: PMID:16242717
  title: Crystal structure of the complex between the monomeric form of Toxoplasma
    gondii surface antigen 1 (SAG1) and a monoclonal antibody that mimics the human
    immune response.
  findings:
  - statement: >-
      The immunodominant conformational epitope lies in the N-terminal domain and does
      not overlap the proposed ligand-binding pocket, so antibody recognition and
      ligand binding are structurally separable.
    supporting_text: this conformational epitope, located within the SAG1 N-terminal domain, does not overlap
      with the proposed ligand-binding pocket. This study provides the first structural
      description of the monomeric form of SAG1, and significant insights into its dual role of
      adhesin and immune target during parasite infection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt for PDB 1YNT. Used here for the relationship between epitope
      and ligand site, which motivates one of the suggested questions.
- id: PMID:1730266
  title: 'Toxoplasma gondii: the role of a 30-kDa surface protein in host cell invasion.'
  findings:
  - statement: >-
      A monoclonal antibody against P30 consistently reduced invasion of bovine kidney
      cells to 37% of control values across ten replicate assays.
    supporting_text: In 10 replicate assays, the overall invasion was reduced to 37% of control values (P less
      than 0.0001).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Early antibody-blockade evidence. Antibody inhibition can act by steric masking
      of the parasite surface rather than by blocking a SAG1-specific contact, so it
      is used as corroboration and not as the primary basis for any annotation.
- id: PMID:8050521
  title: Attachment of Toxoplasma gondii to host cells involves major surface protein,
    SAG-1 (P30).
  findings:
  - statement: >-
      Polyclonal anti-SAG-1 serum inhibited attachment of live tachyzoites to fixed
      human fibroblasts by 71%, and the 6A8 monoclonal and its Fab gave dose-dependent
      inhibition; parasite mutants with defective SAG-1 bound much less well.
    supporting_text: Treatment of fresh extracellular T. gondii with rabbit polyclonal
      anti-SAG-1 serum inhibited parasite attachment to host cells by 71%.
  - statement: >-
      The authors conclude that SAG-1 is a parasite ligand binding the host cell during
      invasion.
    supporting_text: Taken together, these observations suggest that SAG-1 is an
      important parasite ligand that binds to the host cell in the process of T.
      gondii invasion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Combines antibody blockade, Fab controls and SAG-1-defective mutants, so it is
      stronger than antibody inhibition alone. Abstract-only in the cache.
- id: PMID:15151144
  title: 'Toxoplasma gondii major surface antigen (SAG1): in vitro analysis of host
    cell binding.'
  findings:
  - statement: >-
      In an assay measuring binding of SAG1 itself rather than of whole tachyzoites,
      SAG1 attached to MDBK cells and was competed by soluble BSA-glucosamide,
      implicating host-surface glucosamine.
    supporting_text: Soluble BSA-glucosamide blocked SAG1 attachment to MDBK cells in
      a dose-dependent manner, implying that SAGI binding is mediated, in part, via
      attachment to host cell surface glucosamine.
  - statement: >-
      Polyclonal serum from chronically infected mice did not block SAG1 binding,
      arguing that anti-SAG1 antibodies do not act simply by masking the host-binding
      site.
    supporting_text: pre-incubation of SAG1 in polyclonal sera from chronically infected mice failed to block
      binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt for FUNCTION. The key study for the molecular-function call,
      because the protein rather than the parasite was the binding species. Only the
      abstract is cached, and the host cells are bovine kidney cells, so the ligand
