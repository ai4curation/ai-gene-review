id: P13664
gene_symbol: SAG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5811
  label: Toxoplasma gondii
description: >-
  SAG1 (P30, SRS29B) is the most abundant surface protein of the Toxoplasma gondii
  tachyzoite and the prototypic member of the SAG1-related sequence (SRS) superfamily
  of developmentally regulated surface antigens. It is encoded by a single-copy,
  intronless gene and is expressed only in the rapidly dividing, invasive tachyzoite
  stage. The precursor carries an N-terminal signal peptide and a C-terminal
  glycosylphosphatidylinositol (GPI) addition signal; the mature protein is held in
  the outer leaflet of the parasite plasma membrane by a GPI anchor that occurs as two
  glycoforms. It is built from two disulfide-rich SRS domains and crystallises as a
  homodimer whose interface forms a basic groove proposed to bind sulfated
  proteoglycans. SAG1 behaves as a surface adhesin: purified SAG1 binds host cells,
  partly through host-surface glucosamine-containing glycans; antibodies against it
  reduce attachment and invasion; and SAG1-null parasites attach less efficiently, a
  defect that is larger when host cells are stimulated with interferon-gamma or lack
  surface sialic acid. Loss of SAG1 leaves intracellular replication unchanged, so the
  protein is dispensable in unstimulated cultured cells. Part of the surface pool is
  shed during invasion, and SAG1 is also detected in vesicular extensions of the
  parasitophorous vacuole. SAG1 is immunodominant: it elicits strong antibody and
  T-cell responses, is sufficient to drive the lethal ileitis that follows oral
  infection of susceptible mice, and its stage-restricted expression shapes the
  balance between parasite clearance and persistence. Reported host-protein partners
  include S100A6, KRCC1 and RACK1.
existing_annotations:
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR007226
  review:
    summary: >-
      InterPro2GO mapping from the SRS domain signature. SAG1 is a membrane protein,
      but the evidence supports a far more specific location: GPI attachment in the
      outer leaflet of the tachyzoite plasma membrane.
    action: MODIFY
    reason: >-
      The term is right but too general. Metabolic labelling with palmitate and
      myo-inositol plus release by PI-PLC showed that P30/SAG1 carries a glycolipid
      anchor (PMID:2925621), and structural analysis of that anchor placed SAG1 in the
      parasite plasma membrane via GPI (PMID:11522346). A GPI-anchored protein
      displayed on the parasite surface lies on the external side of the plasma
      membrane, so GO:0005886 and GO:0009897, both descendants of membrane, are the
      supported replacements. The SRS domain occurs in GPI-anchored surface antigens
      throughout the family, so the InterPro mapping is imprecise rather than wrong.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    - id: GO:0009897
      label: external side of plasma membrane
    additional_reference_ids:
    - PMID:2925621
    - PMID:11522346
    supported_by:
    - reference_id: PMID:2925621
      supporting_text: These results argue that P30 is anchored by a glycolipid.
    - reference_id: PMID:11522346
      supporting_text: The protein is inserted into the parasite's plasma membrane by
        a glycosyl-phosphatidylinositol anchor
    - reference_id: PMID:12091874
      supporting_text: The surface of Toxoplasma is coated with a family of
        developmentally regulated glycosylphosphatidylinositol (GPI)-linked proteins
        (SRSs), of which SAG1 is the prototypic member.
- term:
    id: GO:0020003
    label: symbiont-containing vacuole
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0194
  review:
    summary: >-
      Mapped from the UniProt subcellular location "Parasitophorous vacuole". SAG1 is
      detected in vesicular extensions of the parasitophorous vacuole of intracellular
      tachyzoites, but that pool is surface material that has been shed or exported;
      the functional site is the parasite plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      Immuno-electron microscopy places SAG1 in vacuoles throughout the infected cell,
      described either as extensions of the parasitophorous vacuole or as exported
      parasite surface material (PMID:8570580), and UniProt records SAG1 as a component
      of the vesicular network inside that vacuole. The parasitophorous vacuole is a
      genuine Toxoplasma compartment and the symbiont-containing vacuole term is used
      in the correct direction for a parasite protein, so this is not a mis-transfer.
      Whether SAG1 is on the intravacuolar network right after invasion was contested
      in the early literature (PMID:8570580), and the location reflects shedding rather
      than the adhesin activity carried out at the parasite surface, so it is retained
      as non-core. No more specific term for the intravacuolar network exists, so the
      term is as precise as the evidence allows.
    additional_reference_ids:
    - PMID:8570580
    supported_by:
    - reference_id: PMID:8570580
      supporting_text: SAG1 is present on the surface of daughter zoites and is found
        throughout the infected cell in distinct vacuoles; these vacuoles represent
        either direct extensions of the parasitophorous vacuole or true export of
        parasite surface material.
    - reference_id: file:TOXGO/SAG1/SAG1-uniprot.txt
      supporting_text: vesicular network within the parasitophorous vacuole
