        id: '40607979'
      value: Mediates binding to host cells and is especially important for parasite attachment and fitness in IFN-gamma/IFNG-stimulated
        host cells (PubMed:15151144, PubMed:40607979). May regulate binding between human S100A6 and vimentin (VIM)
        for cytoskeleton organization during the early stages of invasion into host cells (PubMed:34950858). Promotes
        TNF secretion in host cells probably by enhancing binding between human VIM and PRKCQ and activating NF-kappa-B
        pathway (PubMed:34950858). Promotes viability of host cells to satisfy the survival needs of parasites through
        the interaction with human RACK1 (PubMed:38157925)
    commentType: FUNCTION
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '12091874'
      - evidenceCode: ECO:0000269
        source: PubMed
