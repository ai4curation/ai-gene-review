      - evidenceCode: ECO:0000269
        source: PubMed
        id: '34950858'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '38157925'
      value: Monomer (PubMed:12091874). Forms homodimers (PubMed:12091874). Interacts with human lysine-rich coiled-coil
        protein 1 (KRCC1) (PubMed:29351065, PubMed:31165984). Interacts with human S100A6 (PubMed:34950858). Interacts
        with human RACK1; the interaction promotes viability of host cells (PubMed:38157925)
    commentType: SUBUNIT
  - commentType: SUBCELLULAR LOCATION
    note:
      texts:
      - value: Surface of extra- and intracellular tachyzoites and also component of the vesicular network within
          the parasitophorous vacuole
    subcellularLocations:
    - location:
        value: Parasitophorous vacuole
        id: SL-0194
  - texts:
    - value: Detected only in rapidly dividing and invasive tachyzoites
    commentType: DEVELOPMENTAL STAGE
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '34950858'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '40607979'
      value: Gene knockout results in higher levels of S100A6-VIM interaction at 30 min post infection compared
        to the wild-type parasites, with similar S100A6-VIM binding levels after 3 hours (PubMed:34950858). Gene
        disruption results in increased susceptibility to IFN-gamma/IFNG (PubMed:40607979). Attachment defect, which
        is significantly exacerbated in the presence of IFNG (PubMed:40607979)
    commentType: DISRUPTION PHENOTYPE
  - texts:
    - evidences:
      - evidenceCode: ECO:0000305
      value: It is uncertain whether Met-1 or Met-18 is the initiator
