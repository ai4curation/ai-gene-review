  review:
    summary: MpABI1 uses magnesium or manganese as catalytic cofactors.
    action: MODIFY
    reason: Both broad binding claims are correct but biochemical activity titrations specify Mg2+
      and Mn2+. EDTA eliminates activity, Mn2+ activates at lower concentrations than Mg2+, and Mg2+
      supports higher maximal activity in the reported assay. Refine both broad terms to the
      supported ions; neither experimental assay establishes which ion predominates in vivo.
