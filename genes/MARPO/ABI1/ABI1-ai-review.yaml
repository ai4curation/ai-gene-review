description: 'MpABI1 is a clade A protein phosphatase 2C from Marchantia polymorpha that negatively regulates
  ABA-responsive gene expression. Its C-terminal catalytic domain dephosphorylates serine/threonine-phosphorylated
  proteins in a magnesium- or manganese-dependent manner. The intact 568-residue protein contains an N-terminal
  nuclear localization region and accumulates mainly in the nucleus when expressed as a GFP fusion in
  onion epidermal cells. It suppresses ABA-induced transcription in Marchantia cells; its endogenous physiological
  substrates remain to be established.'
