suggested_questions:
- question: How does the original male-thallus GQ504039/ADB22517.1 clone represented by D3W6X9 map
    to current sex-linked MpABI1A/MpABI1B gene models? Confirm by sequence before assigning a
    female- or male-specific modern locus.
- question: Which endogenous Marchantia substrates are directly dephosphorylated by MpABI1, and in
    which cellular compartment? The original biochemical substrate was phosphorylated myelin basic
    protein.
