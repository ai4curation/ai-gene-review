- term:
    id: GO:0009788
    label: negative regulation of abscisic acid-activated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:20097789
  review:
    summary: Primary experiments support negative regulation of abscisic acid-activated signaling
      pathway.
    action: NEW
    reason: MpABI1 overexpression directly suppresses ABA-responsive Em-GUS transcription in
      Marchantia cells, and an activity-impaired catalytic mutant has reduced suppressive effect.
      The phosphatase is the signaling regulator, not a substrate merely required for a downstream
      phenotype. QuickGO comparator queries show the same term on Arabidopsis ABI1 (P49597) and ABI2
      (O04719); HAB1 (Q9CAJ0) lacks the exact term, so there is no systematic exclusion of this
      role. GO ancestry places this term under negative regulation of signaling and ABA signaling.
      No existing process term duplicates this proposal, and the GO-CAM index contains no D3W6X9
      model.
    supported_by:
    - &id003
      reference_id: PMID:20097789
      supporting_text: Coexpression of MpABI1 and Em-GUS resulted in suppression of the ABA-induced
        gene expression
