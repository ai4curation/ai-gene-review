  review:
    summary: The cloned MpABI1 protein directly dephosphorylates a Ser/Thr-phosphorylated protein
      substrate.
    action: ACCEPT
    reason: D3W6X9 maps to the assayed 568-residue GQ504039/ADB22517.1 clone. Purified recombinant
      GST-MpABI1 dephosphorylates radiolabeled myelin basic protein previously phosphorylated by a
      Ser/Thr kinase, requiring divalent cations; the G298D mutant markedly loses activity. This
      supports the protein substrate specificity independently of the electronic annotation and does
      not identify an endogenous SnRK2 substrate.
