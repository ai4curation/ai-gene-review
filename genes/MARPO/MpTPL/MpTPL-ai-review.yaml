gene_symbol: MpTPL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3197
  label: Marchantia polymorpha
description: MpTPL is the TOPLESS-family transcriptional corepressor of Marchantia polymorpha,
  with conserved LisH/CTLH and WD40 domains. It supplies repression capacity when recruited
  to regulatory complexes. MpARF2 engages MpTPL through an LFG-dependent interaction in plant-cell
  assays, and engineered MpTPL fusions demonstrate repression capacity in Marchantia. Perturbing
  MpTPL affects meristem-associated growth and thallus patterning. Nuclear action is inferred
  from its conserved corepressor role; the published nuclear-targeted promoter reporter measures
  expression pattern rather than native MpTPL protein localization.
