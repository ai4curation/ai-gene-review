taxon:
  id: NCBITaxon:3197
  label: Marchantia polymorpha
description: MpARF2 is a class-B DNA-binding transcriptional repressor in Marchantia polymorpha. It recognizes
  AuxRE configurations also bound by MpARF1 and limits auxin-responsive transcription through DNA-site
  competition and active repression involving an LFG-dependent interaction with MpTPL. Native perturbations
  affect auxin sensitivity and thallus growth, while the direct MpARF2–MpTPL interaction and repression-motif
  assays were measured in heterologous plant systems. Its DNA-binding domain can support activation when
  transplanted into an MpARF1 scaffold; that result separates DNA recognition from the repressive activity
  of native full-length MpARF2.
