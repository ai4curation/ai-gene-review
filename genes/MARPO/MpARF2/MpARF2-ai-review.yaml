- id: PMID:40168121
  title: A conserved ARF-DNA interface underlies auxin-triggered transcriptional response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native Mparf1 mutant auxin-transcriptome and domain-swap/targeted-mutant work. Bulk
      gemma conditions define the no-response result; MpARF2 B3 transplantation into MpARF1 does not make
      native MpARF2 an activator.
  findings:
  - statement: The native bulk-gemma experiment supports MpARF1 as the principal auxin transcriptional
      effector under the tested conditions; domain swaps do not assign activation to native MpARF2.
    supporting_text: no differential gene expression could be detected in the absence of MpARF1 in bulk
      gemmae
