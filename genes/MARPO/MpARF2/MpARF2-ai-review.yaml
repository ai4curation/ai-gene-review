    label: DNA-binding transcription repressor activity
  description: DNA-binding repressor that competes with MpARF1 and recruits MpTPL through an LFG motif.
    Native phenotypes and heterologous direct-binding assays provide complementary evidence; the DBD alone
    does not determine regulatory sign. Nuclear action is a functional inference from transcriptional
    regulation, with no claim of exclusive native localization.
