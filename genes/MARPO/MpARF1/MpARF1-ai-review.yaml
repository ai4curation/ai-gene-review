gene_symbol: MpARF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3197
  label: Marchantia polymorpha
description: MpARF1 is the class-A auxin response factor of Marchantia polymorpha. Its B3-containing DNA-binding
  domain recognizes AuxRE-containing regulatory DNA, its middle region supports transcriptional activation,
  and its PB1 domain mediates regulatory interactions. Native loss-of-function and complementation experiments
  establish a major role in auxin-responsive transcription and thallus development. No short-term auxin-responsive
  expression was detected in the tested bulk gemmae lacking MpARF1. This is a condition-specific result,
  not an assertion that all transcription in every tissue depends on this protein. MpARF1 activity is
  opposed by the class-B regulator MpARF2 through competition and repression within the same response
  circuit.
