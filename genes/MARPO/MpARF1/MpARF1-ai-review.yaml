- id: PMID:26020649
  title: A Simple Auxin Transcriptional Response System Regulates Multiple Morphogenetic Processes in
    the Liverwort Marchantia polymorpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct publication-linked KP clone identifiers and engineered perturbations. MpTPL–ARF/PB1
      fusions are synthetic tests; promoter3xVENUSN7 contains an added NLS and does not localize native
      MpTPL. Read together with correction PMID:26901620.
  findings:
  - statement: The primary paper identifies the publication-linked MpTPL/MpARF clones; engineered fusion
      experiments test forced corepressor recruitment, not an unmodified native binary interaction.
    supporting_text: MpTPL, genbank accession number KP877967
- id: PMID:26901620
  title: 'Correction: A Simple Auxin Transcriptional Response System Regulates Multiple Morphogenetic
    Processes in the Liverwort Marchantia polymorpha.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Correction of figures/control presentation and methods in PMID:26020649; recorded rather
      than treating corrected pictures as independent evidence.
- id: PMID:26020919
  title: Auxin-Mediated Transcriptional System with a Minimal Set of Components Is Critical for Morphogenesis
    through the Life Cycle in Marchantia polymorpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent 2015 study uses AB981317/AB981318 genomic ARF clones. Gal4 transcription
      assays are in tobacco BY-2; BiFC is in Nicotiana leaves and yeast assays use interaction-domain
      constructs. Locus transfer is not proof of full-sequence identity to KP clones.
  findings:
  - statement: Heterologous Gal4-fusion assays distinguish MpARF1 activation from MpARF2 repression.
    supporting_text: These results suggest that MpARF1 and MpARF2 can function as a transcriptional activator
      and repressor, respectively.
- id: PMID:32415296
  title: Design principles of a minimal auxin response system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native Marchantia mutant/induction/domain-swap experiments combined with heterologous
      FRET–FLIM and tobacco reporter assays. Full text is normally cached separately as the WUR523089
      URL; historical MpARF2 DBD accession A0A0K2QVG1 is not silently equated to every full-length isoform.
- id: url:https://edepot.wur.nl/523089
  title: https://edepot.wur.nl/523089
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normally fetched full publisher PDF of PMID:32415296. Methods explicitly place MpARF2–MpTPL
      FRET–FLIM in Arabidopsis protoplasts and LFG reporter assays in tobacco; native Marchantia genetics
      supports the physiological circuit.
  findings:
  - statement: LFG-dependent MpARF2–MpTPL interaction is measured in a heterologous plant-cell assay,
      alongside native Marchantia genetics.
    supporting_text: "The fluorescent proteins were coexpressed in Arabidopsis leaf mesophyll \nprotoplasts"
