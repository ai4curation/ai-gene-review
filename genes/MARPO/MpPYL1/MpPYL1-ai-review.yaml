  label: Marchantia polymorpha
description: 'MpPYL1 is a monomeric intracellular abscisic acid (ABA) receptor of the PYR/PYL/RCAR family
  in Marchantia polymorpha. It binds ABA and inhibits clade A protein phosphatases 2C, combining substantial
  basal ligand-independent inhibitory activity with further activation by ABA. Through this receptor–phosphatase
  switch it controls ABA-responsive transcription, including LEA protein genes, and contributes to growth
  inhibition, sugar accumulation, and desiccation tolerance.'
