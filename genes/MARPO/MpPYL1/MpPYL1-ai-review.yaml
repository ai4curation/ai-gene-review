      further activation by ABA; MpABI1 is assayed as a catalytic-domain construct.
    supporting_text: The Marchantia receptor showed 30% to 50% basal activity when analyzed with the
      native PP2C or with the standardized HAB1
- id: PMID:30442644
  title: Archetypal Roles of an Abscisic Acid Receptor in Drought and Sugar Responses in Liverworts.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read refreshed full text; GFP expression assays do not establish receptor
      subcellular localization. Native Marchantia results are separated from heterologous moss
      assays.
  findings:
  - statement: MpPYL1 is Mapoly0030s0080 and regulates ABA-dependent growth and transcription in
      Marchantia.
    supporting_text: When we grew gemmalings of these lines on a medium containing ABA, the plants
      of all of the genome-edited lines tested grew similarly in the presence or absence of ABA in
      the medium, indicating that they were insensitive to ABA
- id: PMID:41984838
  title: Evolutionary-based remodeling of ABA receptors reveals the structural basis of hormone
    perception and regulation.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read cached full text; wild-type MpPYL1 properties are distinguished from
      engineered MpPYL1Cs dimerization variants and citrus receptor mutants. Affinity measurements
      used HAB1 complexes.
  findings:
  - statement: Structural and biochemical experiments establish monomeric wild-type MpPYL1 and
      ABA-bound and ligand-free inhibitory complexes.
    supporting_text: we solved the crystal structures of MpPYL1 in complex with HAB1 both in the
      presence and absence of ABA.
