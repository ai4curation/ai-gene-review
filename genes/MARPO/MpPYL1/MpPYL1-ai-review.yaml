  review:
    summary: Wild-type MpPYL1 binds ABA.
    action: ACCEPT
    reason: ABA-bound MpPYL1–HAB1 crystal structures and ligand titration directly substantiate the
      inherited binding function. The reported 68 nM value describes the ABA-dependent ternary
      interaction assay with HAB1, not an isolated-receptor affinity measurement. Engineered dimeric
      MpPYL1Cs is distinguished from wild-type MpPYL1.
    supported_by:
    - *id002
    - &id004
      reference_id: PMID:41984838
      supporting_text: When titrated with ABA, MpPYL1 exhibited strong binding to HAB1 with an ABA
        Kd of 68 nM, while CsPYL1 had a Kd of 243 nM.
