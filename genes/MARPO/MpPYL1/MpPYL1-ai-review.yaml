  review:
    summary: MpPYL1 directly inhibits clade A PP2C phosphatases.
    action: MODIFY
    reason: The inherited phosphatase-inhibitor activity is correct; biochemical PP2C assays support
      the more precise serine/threonine phosphatase inhibitor term. PMID:31744875 uses recombinant
      native-sequence MpPYL1 with an N-terminally truncated MpABI1 catalytic construct and
      Arabidopsis HAB1. Substantial inhibition occurs without ABA and is enhanced by ABA; basal
      activity is not evidence that ABA binding is absent.
    supported_by:
    - &id001
      reference_id: PMID:31744875
      supporting_text: The Marchantia receptor showed 30% to 50% basal activity when analyzed with
        the native PP2C or with the standardized HAB1
    - &id002
      reference_id: PMID:41984838
      supporting_text: we solved the crystal structures of MpPYL1 in complex with HAB1 both in the
        presence and absence of ABA.
    proposed_replacement_terms:
    - &id005
      id: GO:0004865
      label: protein serine/threonine phosphatase inhibitor activity
