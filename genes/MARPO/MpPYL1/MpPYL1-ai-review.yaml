  review:
    summary: MpPYL1 is an ABA-perceiving regulator of the Marchantia ABA signaling pathway.
    action: ACCEPT
    reason: ABA binding and ABA-enhanced PP2C inhibition establish direct participation in signal
      transduction. Marchantia genome-edited mppyl1 lines lose ABA growth responsiveness and show
      broad defects in ABA-induced transcription. The receptor performs the signaling step; these
      are not merely downstream stress correlations.
    supported_by:
    - *id001
    - &id003
      reference_id: PMID:30442644
      supporting_text: When we grew gemmalings of these lines on a medium containing ABA, the plants
        of all of the genome-edited lines tested grew similarly in the presence or absence of ABA in
        the medium, indicating that they were insensitive to ABA
