  negated: false
  action: MODIFY
  reason: KP877968 is the exact published clone linked to this 828-aa UniProt record. PMID:26020649 
    knockdown phenotypes support a repressive auxin role but its corrected control/panel issues 
    (PMID:26901620) must accompany that evidence. Independent PMID:26020919 uses an 825-aa construct
    and dominant domain-II/GR manipulations to repress an auxin reporter in Marchantia. The combined
    evidence supports negative regulation of transcription. MpTPL–MpIAA domain fusions impose 
    repression and are not, by themselves, proof of native direct MpTPL recruitment.
  assessed_support:
  - reference_id: PMID:26020649
    supporting_text: AUX/IAA (MpIAA, KP877968)
  - reference_id: PMID:26020649
    supporting_text: In summary, knock-down MpIAA lines were auxin hypersensitive, indicating that 
      MpIAA represses the auxin signaling pathway
  - reference_id: PMID:26901620
    supporting_text: Fig 2B was mislabeled
  - reference_id: PMID:26020919
    supporting_text: plants completely repressed auxin-dependent expression of the GUS reporter gene
