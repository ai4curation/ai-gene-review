  reason: The domain/UniRule assignment is consistent with nuclear transcriptional repression and 
    ARF association. PMID:26020919 manipulates nuclear entry of an MpIAAmDII–GR fusion and detects 
    repressive activity; this is functional support, not direct imaging of endogenous 828-aa 
    KP877968 protein. The independent study describes an 825-aa MpIAA construct, so its results 
    corroborate the homologous native locus rather than establish exact clone identity. Retain the 
    organelle-level inference without inventing an endogenous localization assay.
