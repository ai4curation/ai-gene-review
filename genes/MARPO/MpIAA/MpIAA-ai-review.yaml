core_functions:
- description: Canonical Aux/IAA corepressor function is supported by the conserved repression/interaction
    architecture, native Marchantia perturbations and auxin-reporter repression. The 828-aa KP877968 record
    is distinguished from the 825-aa construct used in independent interaction and GR-fusion assays. A
    forced MpTPL-domain fusion demonstrates repression capacity, not an independently established native
    MpIAA–MpTPL binary complex. Nuclear location is an inference from the functional assay and curated
    rule, not a native-protein image.
