  label: Marchantia polymorpha
description: MpIAA is the canonical Aux/IAA repressor of the Marchantia polymorpha nuclear auxin-response
  system. The publication-linked 828-amino-acid clone KP877968 carries an EAR-type repression motif, an
  auxin-regulated domain-II degron and a C-terminal PB1 interaction region. MpIAA restrains ARF-dependent
  transcription and helps regulate thallus patterning, rhizoid production and other developmental responses.
  Reduced MpIAA expression increases auxin sensitivity, while stabilized or engineered repressive MpIAA
  constructs inhibit auxin responses. Studies of the same locus using an 825-amino-acid construct corroborate
  ARF interaction and transcriptional repression; the two experimental sequences are not assumed identical.
