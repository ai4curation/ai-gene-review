taxon:
  id: NCBITaxon:3197
  label: Marchantia polymorpha
description: MpPIN1, also called MpPINZ, is the canonical long-loop PIN auxin exporter of the
  liverwort Marchantia polymorpha. It localizes at the plasma membrane, with tissue-dependent
  polarity, and contributes to gemmaling dorsiventral patterning, gametangiophore shoot tropisms
  and meristem development. Native loss-of-function and complementation establish its developmental
  role; expression of MpPINZ-GFP in moss increases radioactive IAA export. Native stalk polarity
  and broad nonpolar membrane localization in other tissues illustrate that directional tissue
  flow is context-dependent. The genome encodes additional short-loop PINs with distinct potential
  roles.
