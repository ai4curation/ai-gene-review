  review:
    summary: The membrane annotation can be refined to plasma membrane.
    action: MODIFY
    reason: Native Marchantia complementation/localization (PMID:36880411) and MpPINZ-GFP imaging
      in Marchantia (PMID:37528584) support PM localization. The latter uses a 35S promoter
      and shows context-dependent polarity; native-promoter Citrine provides independent native
      evidence. Exact 719-aa sequence identity connects the seeded genome protein A0A2R6WHW5
      with the published MpPINZ clone A0A075ILB5/KJ664532/AIF28545.1, as reproduced in the source-analysis
      directory.
    supported_by:
    - &id003
      reference_id: PMID:37528584
      supporting_text: Interestingly, MpPINZ-GFP localized on the PM with small intracellular
        puncta and no apparent polarity in all gemma epidermal cells (Figure 4B, right panel).
    proposed_replacement_terms:
