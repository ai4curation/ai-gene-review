  review:
    summary: The transport process is specifically auxin export across the plasma membrane.
    action: MODIFY
    reason: PMID:37528584 measures H3-IAA release from induced MpPINZ-GFP in moss, a heterologous
      host; the cloned MpPINZ sequence is identical to this genome protein. Native Marchantia
      loss and complementation support its physiological role (PMID:36880411). Refine the generic
      BP to GO:0010315, without converting every developmental phenotype into a separate process
      proposal or claiming universal canalized flux.
    supported_by:
    - &id001
      reference_id: PMID:37528584
      supporting_text: We determined the localization pattern of the PIN proteins by fusing
        GFP to AtPIN1, AtPIN2, PpPINA, and MpPINZ as shown in Figure 3A (Zhang et al., 2019).
    - &id002
