references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:36529527
  title: Auxin signaling is essential for organogenesis but not for cell survival in the liverwort Marchantia
    polymorpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article inspected. Accession section maps MpTIR1 to Mp6g02750/Mapoly0035s0062,
      matching UniProt A0A0K2QW32. Fig2 uses plant-expressed MpTIR1 and recombinant MpIAA C-terminal fragments;
      DII mutation and conditional knockout provide target-specific controls. Supplemental Fig14 is described
      as nucleus-like localization of a complementing native-promoter fusion. AC activity is explicitly
      a future question.
  findings:
  - statement: Auxin is required for native MpTIR1–MpIAA interaction.
    supporting_text: The MpTIR1-3xFLAG proteins showed interactions with MpIAA only when auxin was added
      to the mixture
  - statement: The paper explicitly leaves MpTIR1 AC catalysis untested.
    supporting_text: It would be interesting to examine whether MpTIR1 has adenylate cyclase activity
  - statement: A functional receptor fusion has nuclear-region enrichment.
    supporting_text: accumulated at nucleus-like regions in most of the sporeling cells soon after germination
  - statement: A complementing native-promoter MpTIR1-tdTomato fusion accumulates in nucleus-like regions
      in sporelings. This supports the core location shared with the module; it is distinct from the artificially
      NLS-tagged DII reporter.
    supporting_text: MpTIR1 promoter-driven MpTIR1-tdTomato fusion protein, which complemented the Mptir1-1ko
      mutants, accumulated at nucleus-like regions in most of the sporeling cells soon after germination
- id: file:interpro/panther/PTHR16134/PTHR16134-paint.tsv
