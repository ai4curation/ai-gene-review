suggested_questions:
- question: Does MpTIR1 itself catalyze cAMP production, and is that activity separable from MpIAA recognition
    and turnover?
- question: Which native SKP1/CUL1 partners assemble with MpTIR1, and can the complete complex reconstitute
    auxin-dependent MpIAA ubiquitination?
suggested_experiments:
- description: Purify full-length MpTIR1 with folding controls and test ATP-to-cAMP conversion by LC-MS/MS,
    with motif substitutions tested separately for MpIAA recognition.
- description: Identify native MpTIR1 SCF partners by functional-tag purification and reconstitute MpIAA
    ubiquitination using wild-type and DII-mutated substrate.
