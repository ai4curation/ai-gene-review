  label: Marchantia polymorpha
description: MpTIR1 is the single canonical TIR1/AFB-type auxin receptor in Marchantia polymorpha. Its
  F-box and leucine-rich-repeat architecture supports an SCF substrate-adaptor role. Auxin promotes interaction
  with the domain-II degron of MpIAA, and conditional loss of MpTIR1 stabilizes an MpIAA degron reporter.
  A functional native-promoter fluorescent fusion accumulates in nucleus-like regions of young sporelings.
  MpTIR1-dependent signaling controls organogenesis and both induction and repression of auxin-responsive
  genes; knockout cell masses remain viable but fail to make normal organs. Adenylate cyclase activity
  has not been directly established for this receptor.
