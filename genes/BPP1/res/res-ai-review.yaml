  label: Escherichia phage P1
description: >-
  Restriction and ATPase/translocase subunit Res (R.EcoPI / ResP1; EC 3.1.21.5)
  of the type III restriction-modification enzyme EcoPI encoded by the mod-res
  operon of Escherichia phage P1. Res assembles with the sequence-specific
  methyltransferase subunit Mod into a heterotetrameric Res2Mod2 complex. Upon
  Mod-mediated recognition of two inversely oriented, unmethylated 5'-AGACC-3'
  sites, the N-terminal superfamily 2 helicase-like domain of Res hydrolyzes ATP
  to trigger one-dimensional diffusion along DNA, and collision of two
  converging Res2Mod2 complexes activates the C-terminal PD-(D/E)XK endonuclease
  domain of Res to cleave double-stranded DNA 25-27 bp downstream of one
  recognition site.
