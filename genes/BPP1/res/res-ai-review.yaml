core_functions:
  - description: >-
      Catalyzes ATP-dependent double-stranded DNA cleavage 25-27 bp downstream
      of unmethylated 5'-AGACC-3' recognition sites as the restriction
      endonuclease and superfamily 2 ATPase translocase subunit of the
      heterotetrameric Res2Mod2 EcoPI type III restriction-modification complex.
    molecular_function:
      id: GO:0015668
      label: type III site-specific deoxyribonuclease activity
    directly_involved_in:
      - id: GO:0009307
        label: DNA restriction-modification system
    supported_by:
      - reference_id: PMID:11178902
        supporting_text: >-
          DNA cleavage by type III restriction endonucleases requires two inversely oriented asymmetric recognition sequences and results from ATP-dependent DNA translocation and collision of two enzyme molecules. Here, we characterized the structure and mode of action of the related EcoP1I and EcoP15I enzymes. Analytical ultracentrifugation and gel quantification revealed a common Res(2)Mod(2) subunit stoichiometry. Single alanine substitutions in the putative nuclease active site of ResP1 and ResP15 abolished DNA but not ATP hydrolysis, whilst a substitution in helicase motif VI abolished both activities.
      - reference_id: PMID:15489417
        supporting_text: >-
          The Res subunit catalyzes the double-strand cleavage of DNA about 25 bp to the 3′ side of a recognition sequence, but it does so only when bound to the Mod subunit in a Res 2 Mod 2 complex ( 161 ).
suggested_questions:
  - question: >-
      How does collision of two sliding Res2Mod2 complexes along DNA allosterically
      activate the C-terminal PD-(D/E)XK endonuclease domain of each Res subunit
      to nick opposite DNA strands 25-27 bp downstream of one recognition site?
    experts:
      - Mark D. Szczelkun
      - Thomas A. Bickle
      - Desirazu N. Rao
suggested_experiments:
  - description: >-
      Perform single-molecule magnetic tweezers and fluorescence imaging of
      quantum-dot-labeled EcoPI Res2Mod2 complexes colliding on DNA substrates
      with head-to-head versus tail-to-tail 5'-AGACC-3' sites.
    hypothesis: >-
      ATP hydrolysis by the N-terminal SF2 motor domain of Res induces a
      conformational switch that releases the complex from the 5'-AGACC-3' site
      into a 1D diffusive sliding state, and physical contact with a second
      site-bound Res2Mod2 complex engages both Res nuclease domains across the
      duplex.
    experiment_type: Single-molecule fluorescence-force spectroscopy and DNA cleavage kinetics
