  - term:
      id: GO:0004386
      label: helicase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Res contains an N-terminal superfamily 2 helicase-like domain (residues
        75-540) whose conserved motif VI (Arg-534) is essential for ATP
        hydrolysis and DNA translocation/sliding prior to cleavage.
      action: MODIFY
      reason: >-
        Although Res possesses a superfamily 2 helicase-like motor domain, type
        III restriction enzymes do not unwind duplex DNA into single strands;
        rather, ATP hydrolysis by this domain powers double-stranded DNA
        translocation/sliding, which is more accurately captured by ATP
        hydrolysis activity (GO:0016887) alongside type III site-specific
        deoxyribonuclease activity (GO:0015668).
