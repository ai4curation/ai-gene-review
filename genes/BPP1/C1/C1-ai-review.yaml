- id: PMID:3430609
  title: Characterization of the binding sites of c1 repressor of bacteriophage P1.
    Evidence for multiple asymmetric sites.
  findings:
  - statement: C1 repressor maintains the P1 prophage in the lysogenic state by binding
      specific 17-bp operator sequences across the P1 genome.
    supporting_text: The repressor of bacteriophage P1, encoded by the c1 gene, is
      responsible for maintaining a P1 prophage in the lysogenic state.
  - statement: Derived the 17-bp asymmetric consensus binding site sequence for C1
      repressor.
    supporting_text: From these sites we have derived the consensus binding site sequence
      ATTGCTCTAATAAATTT.
- id: PMID:2678003
  title: The c1 genes of P1 and P7.
  findings:
  - statement: Expression of the c1 gene represses transcription from promoters containing
      C1 operator sites.
    supporting_text: Plasmids expressing the c1 gene from either phage cause the repression
      of transcription from a cloned promoter situated upstream of P1c1.
- id: PMID:2678004
  title: The c1 repressor of bacteriophage P1 operator-repressor interaction of wild-type
    and mutant repressor proteins.
  findings:
  - statement: The DNA-binding domain of C1 resides in a 14-kDa C-terminal cyanogen
      bromide fragment and requires intact cysteine sulfhydryl groups for operator
      binding.
    supporting_text: a 14-kDa C-terminal repressor fragment obtained by cyanogen bromide
      cleavage retains DNA binding properties.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: C1 is the monomeric master repressor of P1 lytic functions encoded
      within the immC immunity locus and binds 20 operators across the genome.
    supporting_text: The key repressor of P1 lytic functions is the C1 protein, encoded
      by c 1 within ImmC
