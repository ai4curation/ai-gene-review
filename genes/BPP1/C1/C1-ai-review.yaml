id: P13121
gene_symbol: C1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Master transcriptional repressor of bacteriophage P1 lytic functions encoded
  in the immC immunity region. Exists as a monomer in solution and binds via its C-terminal
  DNA-binding domain to asymmetric 17-bp operator sequences (consensus 5'-ATTGCTCTAATAAATTT-3')
  dispersed at 20 monovalent and bivalent operator sites across the phage genome, repressing
  lytic replication, antirepressor, and late-activator operons to maintain the prophage
  in the lysogenic plasmid state. Its operator affinity and DNA-looping activity are
  enhanced by the ternary-complex corepressor Lxc (Bof) and antagonized by the inducer
  Coi and the antirepressor Ant1/Ant2.
existing_annotations:
- term:
