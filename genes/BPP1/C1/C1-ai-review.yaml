  review:
    summary: C1 binds DNA, but specifically functions as a sequence-specific DNA-binding
      transcriptional repressor that recognizes 17-bp operator sequences to repress
      P1 lytic promoters.
    action: MODIFY
    reason: Direct biochemical and genetic studies demonstrate that C1 binds 17-bp
      cis-regulatory operator sequences via its C-terminal domain to repress transcription
      of lytic genes and maintain lysogeny (PMID:3430609, PMID:2678003, PMID:2678004,
      PMID:15489417). Therefore, the general DNA binding term should be refined to
      DNA-binding transcription repressor activity (GO:0001217) and transcription
      cis-regulatory region binding (GO:0000976).
    proposed_replacement_terms:
    - id: GO:0001217
      label: DNA-binding transcription repressor activity
    - id: GO:0000976
      label: transcription cis-regulatory region binding
    supported_by:
    - reference_id: PMID:3430609
      supporting_text: The repressor of bacteriophage P1, encoded by the c1 gene,
        is responsible for maintaining a P1 prophage in the lysogenic state.
    - reference_id: PMID:2678003
      supporting_text: Plasmids expressing the c1 gene from either phage cause the
        repression of transcription from a cloned promoter situated upstream of P1c1.
    - reference_id: PMID:2678004
      supporting_text: a 14-kDa C-terminal repressor fragment obtained by cyanogen
        bromide cleavage retains DNA binding properties.
