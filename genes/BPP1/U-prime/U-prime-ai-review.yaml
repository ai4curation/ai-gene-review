suggested_questions:
  - question: >-
      What are the specific C-terminal residues of gpU' that dictate its
      chaperone specificity for the Sv' tail fiber tip over the Sv tip?
    experts:
      - Malgorzata B. Lobocka
      - Jason J. Gill
suggested_experiments:
  - description: >-
      Construct chimeric U/U' genes swapping the variable C-terminal segments
      and test complementation of S(C+) and S(C-) phage infectivity on E. coli
      K-12 versus Erwinia and Citrobacter hosts.
    hypothesis: >-
      The conserved N-terminal domain of gpU/gpU' binds the proximal variable
      region of Sv/Sv', while the divergent C-terminal domain folds the distal
      receptor-binding tip.
    experiment_type: Chimeric complementation and host-range plating assays
