existing_annotations:
  - term:
      id: GO:0019062
      label: virion attachment to host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        gpU' folds the C-terminal receptor-binding tip of the alternative gpS(C-)
        tail fiber and, by homology to lambda Tfa, may remain associated with
        the distal tail fiber to participate in host receptor binding.
      action: KEEP_AS_NON_CORE
      reason: >-
        The core role of gpU' is acting as the cognate tail fiber assembly
        chaperone (GO:0098004) for the Sv' tail fiber variant. While C-terminal
        homology to Ur-lambda Tfa suggests it may also remain associated with
        the tail fiber tip and contribute to host receptor binding, this is
        secondary to its assembly chaperone role.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            Whereas the C-terminal region of λ Tfa is not homologous to that of T4 gp38, it is homologous to those of P1 gpU and P1 gpU′. It is thus likely that the gpU and gpU′ proteins of P1, like λ Tfa, can function as both tail fiber assembly chaperones and virion components.
  - term:
      id: GO:0030430
      label: host cell cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: >-
        gpU' functions in the host bacterial cytoplasm during late lytic
        infection by C(-) phage to assemble gpS(C-) tail fibers.
      action: ACCEPT
      reason: >-
        Tail fiber folding and assembly occur in the host cell cytoplasm prior
        to virion maturation and cell lysis.
      supported_by:
        - reference_id: file:BPP1/U-prime/U-prime-uniprot.txt
          supporting_text: >-
            CC   -!- SUBCELLULAR LOCATION: Virion. Host cytoplasm. Note=Tail fiber.
