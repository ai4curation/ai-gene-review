id: Q71TD7
gene_symbol: U-prime
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Alternative tail fiber assembly protein gpU' (U') of Escherichia phage P1,
  encoded within the Cin-invertible C segment in the C(-) orientation downstream
  of the Sv' variable region of the tail fiber gene S. When Cin-mediated DNA
  inversion places the Sv'-U' cassette in frame with the constant N-terminal Sc
  region of gene S, gpU' is expressed in the host cytoplasm as the cognate tail
  fiber assembly chaperone required for folding and assembling the gpS(C-) tail
  fiber variant, enabling P1 infection of alternative enterobacterial hosts.
