  label: Escherichia phage P1
description: >-
  Large (2,255-residue, 251.5-kDa) internal capsid antirestriction protein DarB
  (defense against restriction protein B) of Escherichia phage P1 that is
  packaged into the procapsid via an N-terminal 30-residue capsid-targeting
  signal in a DarA/Hdf/DdrA-dependent pathway and co-injected with viral or
  transduced DNA into the host cell to protect DNA in cis against host type I
  restriction-modification systems (such as EcoB and EcoK). DarB is a
  multidomain enzyme comprising an N-terminal gamma-class DNA N6-adenine
  methyltransferase domain (carrying the catalytic NPPY/F motif IV) and a
  C-terminal superfamily 2 (DEAH-box) ATP-dependent helicase/translocase domain.
