  - term:
      id: GO:0006304
      label: DNA modification
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: >-
        The N-terminal domain of DarB contains all nine conserved sequence
        motifs (including the catalytic NPPY/F motif IV) of gamma-type DNA
        N6-adenine methyltransferases and modifies injected DNA to prevent host
        type I restriction cleavage.
      action: ACCEPT
      reason: >-
        Sequence and functional analyses support DNA modification (GO:0006304)
        mediated by the N-terminal gamma-class DNA N6-adenine methyltransferase
        domain of DarB upon injection into the host cell.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            The N-terminal domain contains nine appropriately ordered amino acid sequence motifs characteristic of DNA N6-adenine methyltransferases of type “gamma” (Fig. 5 ) (reviewed in references 44 and 214 ) and like the majority of them, may methylate adenine residues in a TNNA motif. DarB contains within motif IV the sequence NPPY/F (with one permitted mismatch) known to be essential for adenine DNA methyltransferase catalytic activity.
