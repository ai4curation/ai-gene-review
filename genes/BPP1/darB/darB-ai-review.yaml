  - term:
      id: GO:0099018
      label: symbiont-mediated evasion of host restriction-modification system
    evidence_type: IMP
    original_reference_id: PMID:28509398
    review:
      summary: >-
        Mutant and proteomic analyses confirm that DarB is incorporated into the
        P1 virion head in a DarA/Hdf/DdrA-dependent manner and is required to
        protect infecting P1 DNA from EcoK and EcoB type I restriction.
      action: ACCEPT
      reason: >-
        Direct genetic and proteomic evidence in PMID:28509398 confirms that
        DarB is the terminal effector packaged into the P1 head to mediate
        evasion of EcoK/EcoB type I restriction systems.
      supported_by:
        - reference_id: PMID:28509398
          supporting_text: >-
            Proteomic analysis of purified virions suggests that packaging of antirestriction components into P1 virions follows a distinct pathway that begins with the incorporation of DarA and Hdf and concludes with DarB and Ulx.
  - term:
      id: GO:0099018
      label: symbiont-mediated evasion of host restriction-modification system
    evidence_type: IMP
    original_reference_id: PMID:3029954
    review:
      summary: >-
        Genetic characterization of darB- mutants shows that DarB is a capsid
        protein injected with packaged DNA that protects P1 and transduced DNA
        against EcoB and EcoK type I restriction systems.
      action: ACCEPT
      reason: >-
        Foundational experimental demonstration that DarB protects phage P1 and
        transduced DNA against host type I restriction systems.
      supported_by:
        - reference_id: PMID:3029954
          supporting_text: >-
            Here we show that this protection against restriction is due to the products of two phage genes which we call darA and darB (dar for defense against restriction). Each of the dar gene products provides protection against a different subset of type I restriction systems. The darA and darB gene products are found in the phage head and protect any DNA packaged into a phage head, including transduced chromosomal markers, from restriction. The proteins must, therefore, be injected into recipient cells along with the DNA.
core_functions:
  - description: >-
      Packaged into the bacteriophage P1 head and co-injected with viral DNA into
      the host cell, where its N-terminal gamma-class adenine methyltransferase
      domain and C-terminal superfamily 2 helicase domain act in cis to modify
      and protect injected DNA against cleavage by host type I
      restriction-modification systems (such as EcoB and EcoK).
    molecular_function:
      id: GO:0004386
      label: helicase activity
    directly_involved_in:
      - id: GO:0099018
        label: symbiont-mediated evasion of host restriction-modification system
      - id: GO:0006304
        label: DNA modification
    supported_by:
      - reference_id: PMID:3029954
        supporting_text: >-
          Here we show that this protection against restriction is due to the products of two phage genes which we call darA and darB (dar for defense against restriction). Each of the dar gene products provides protection against a different subset of type I restriction systems. The darA and darB gene products are found in the phage head and protect any DNA packaged into a phage head, including transduced chromosomal markers, from restriction. The proteins must, therefore, be injected into recipient cells along with the DNA.
      - reference_id: PMID:15489417
        supporting_text: >-
          The N-terminal domain contains nine appropriately ordered amino acid sequence motifs characteristic of DNA N6-adenine methyltransferases of type “gamma” (Fig. 5 ) (reviewed in references 44 and 214 ) and like the majority of them, may methylate adenine residues in a TNNA motif. DarB contains within motif IV the sequence NPPY/F (with one permitted mismatch) known to be essential for adenine DNA methyltransferase catalytic activity. The C-terminal moiety of DarB contains sequence motifs characteristic of DNA or RNA helicases (see Table S1 in the supplemental material). Most likely DarB methylates DNA on infection.
      - reference_id: PMID:35458408
        supporting_text: >-
          DarB deletions indicated the presence of an N-terminal packaging signal, and the N-terminal 30 residues of DarB are shown to be sufficient for directing a heterologous reporter protein to the capsid.
suggested_questions:
  - question: >-
      How is the 251.5-kDa DarB polypeptide unfolded or threaded through the
      narrow portal and tail tube channel during DNA ejection, and does its
      C-terminal SF2 helicase domain drive processive N6-adenine methylation
      along the entering DNA molecule?
    experts:
      - Jason J. Gill
      - Ry Young
      - Malgorzata B. Lobocka
suggested_experiments:
  - description: >-
      Assay purified recombinant DarB (wild-type, NPPY->APPA methyltransferase
      mutant, and Walker A K860A helicase mutant) for SAM-dependent N6-adenine
      methylation and ATP-dependent DNA translocation in vitro and for EcoKI
      antirestriction in vivo.
    hypothesis: >-
      ATP-driven translocation by the C-terminal SF2 helicase domain allows a
      small number of co-injected DarB molecules (~35 per virion) to rapidly
      scan and methylate type I recognition sites along the 93.6-kb P1 genome
      upon entry into the host cytoplasm.
    experiment_type: Site-directed mutagenesis, in vitro methyltransferase/ATPase assays, and plating efficiency on EcoKI+ hosts
