suggested_questions:
- question: How does the host ClpXP protease selectively recognize and unfold Phd
    when Phd is bound to operator DNA versus when Phd is complexed with Doc in solution?
suggested_experiments:
- description: Measure in vitro ClpXP degradation rates of free Phd, operator-bound
    Phd2-DNA, and ternary Phd2-Doc-Phd2-DNA complexes using fluorescently labeled
    Phd variants.
  hypothesis: Engagement of the C-terminal tail of Phd in the high-affinity Doc groove
    partially shields the ClpX recognition determinant, whereas free Phd monomers
    in thermal equilibrium are rapidly degraded.
