references:
- id: PMID:8411153
  title: 'Plasmid addiction genes of bacteriophage P1: doc, which causes cell death
    on curing of prophage, and phd, which prevents host death when prophage is retained.'
  findings:
  - statement: Phd is a 73-aa antitoxin protein that prevents host cell death caused
      by the 126-aa Doc toxin in the P1 plasmid addiction module.
    supporting_text: The plasmid withdrawal response depends on a gene named doc (death
      on curing), encoding a 126 amino acid protein. Expression of doc is not SOS-inducing
      and killing by Doc is recA-independent. In cells that retain P1 the killing
      is prevented by the product of a gene named phd (prevent host death), encoding
      a 73 amino acid protein.
- id: PMID:9829946
  title: Corepression of the P1 addiction operon by Phd and Doc.
  findings:
  - statement: Phd binds operator DNA and represses transcription of the phd-doc operon,
      while Doc enhances repression by binding Phd and mediating cooperative interactions
      between adjacent Phd-binding sites.
    supporting_text: We found that Doc is not a repressor in its own right but enhances
      repression by binding to Phd and mediating cooperative interactions between
      adjacent Phd-binding sites.
- id: PMID:9915794
  title: Stability and DNA binding of the phd protein of the phage P1 plasmid addiction
    system.
  findings:
  - statement: Two Phd monomers bind cooperatively as a dimer to each operator subsite,
      and four monomers bind to the intact operator of the phd-doc promoter.
    supporting_text: Two Phd monomers bind to each operator subsite, and four monomers
      bind to the intact operator. The subsite binding reaction shows a second-order
      dependence on protein concentration and monomer-bound DNA species are unpopulated,
      suggesting that two Phd molecules bind cooperatively to each operator subsite.
- id: PMID:18757857
  title: Doc of prophage P1 is inhibited by its antitoxin partner Phd through fold
    complementation.
  findings:
  - statement: Crystal structure of the C-terminal toxin-binding peptide of Phd bound
      to Doc reveals how folding-upon-binding complements the incomplete Fic-like
      fold of Doc and blocks its active site.
    supporting_text: The toxin Doc (death on curing) from the phd/doc module on phage
      P1 hosts the C-terminal domain of its antitoxin partner Phd (prevents host death)
      through fold complementation. This Phd domain is intrinsically disordered in
      solution and folds into an alpha-helix upon binding to Doc.
- id: PMID:20603017
  title: Allostery and intrinsic disorder mediate transcription regulation by conditional
    cooperativity.
  findings:
  - statement: Coupled folding and binding of the C-terminal domain of Phd to Doc
      allosterically structures the N-terminal DNA-binding domain of Phd for operator
      recognition, while monomeric Doc engages two Phd dimers on two unrelated binding
      sites.
    supporting_text: Here we show that monomeric Doc engages two Phd dimers on two
      unrelated binding sites. The binding of Doc to the intrinsically disordered
      C-terminal domain of Phd structures its N-terminal DNA-binding domain, illustrating
      allosteric coupling between highly disordered and highly unstable domains.
