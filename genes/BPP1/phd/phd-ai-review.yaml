id: Q06253
gene_symbol: phd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Antitoxin protein Phd (73 amino acids, 8.1 kDa; "prevent host death")
  of the bacteriophage P1 phd-doc Type II plasmid addiction system. Comprises two
  functionally coupled modules—an N-terminal dimerization and DNA-binding domain
  (residues 1-49) that binds two adjacent 10-bp palindromic operator sites (OR1 and
  OR2) in the phd-doc promoter to autorepress operon transcription, and an intrinsically
  disordered C-terminal domain (residues 52-73) that folds into an alpha-helix upon
  binding and neutralizing the Fic-fold kinase toxin Doc. In plasmid-free daughter
  cells, degradation of labile Phd by the host ClpXP protease releases Doc to phosphorylate
  EF-Tu and arrest translation.
existing_annotations:
- term:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  evidence_type: EXP
  original_reference_id: PMID:9915794
  qualifier: enables
  review:
    summary: Phd dimers bind the OR1 and OR2 operator sites in the phd-doc promoter
      to repress transcription of the addiction operon.
    action: ACCEPT
    reason: Biochemical and genetic studies show that Phd binds the palindromic OR1
      and OR2 operator subsites upstream of phd-doc and represses transcription, both
      alone and in a cooperative ternary complex with Doc (PMID:9829946, PMID:9915794,
      PMID:20603017).
    supported_by:
    - reference_id: PMID:9829946
      supporting_text: We found that Doc is not a repressor in its own right but enhances
        repression by binding to Phd and mediating cooperative interactions between
        adjacent Phd-binding sites.
    - reference_id: PMID:9915794
      supporting_text: Two Phd monomers bind to each operator subsite, and four monomers
        bind to the intact operator. The subsite binding reaction shows a second-order
        dependence on protein concentration and monomer-bound DNA species are unpopulated,
        suggesting that two Phd molecules bind cooperatively to each operator subsite.
