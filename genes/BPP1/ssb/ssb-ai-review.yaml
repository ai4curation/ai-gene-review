  label: Escherichia phage P1
description: Single-stranded DNA-binding protein SSB-P1 (162 amino acids, 18.1 kDa)
  of bacteriophage P1. Shares 66% amino acid identity with Escherichia coli SSB, including
  an N-terminal oligonucleotide/oligosaccharide-binding (OB) fold domain (residues
  6-111) and a conserved acidic C-terminal tail (DDDIPF) that interacts with host
  replisome proteins. Repressed by the C1 master repressor during lysogeny and expressed
  specifically during the lytic cycle to support vegetative phage DNA replication;
  functionally complements both the temperature-sensitive DNA replication defect and
  UV repair defect of E. coli ssb-1 mutants.
