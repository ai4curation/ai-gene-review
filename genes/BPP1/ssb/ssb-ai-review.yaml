suggested_questions:
- question: Under what host physiological conditions or in which natural Enterobacteriaceae
    hosts does P1 lytic replication require phage-encoded SSB-P1 in addition to host
    SSB?
suggested_experiments:
- description: Compare burst sizes and single-molecule replisome progression of wild-type
    P1 and P1 delta-ssb across diverse clinical Enterobacteriaceae isolates and under
    SOS-induced or high-temperature growth conditions.
  hypothesis: Phage-encoded SSB-P1 provides a competitive replication advantage when
    host SSB pools are sequestered by DNA damage or when infecting enteric hosts whose
    endogenous SSB C-terminal tail diverges from E. coli.
