- id: PMID:10515938
  title: Identification and characterization of the single-stranded DNA-binding protein
    of bacteriophage P1.
  findings:
  - statement: Bacteriophage P1 encodes a 162-aa single-stranded DNA-binding protein
      (SSB-P1) with 66% sequence identity to E. coli SSB that complements the replication
      and UV-repair defects of an E. coli ssb-1 mutant.
    supporting_text: "The genome of bacteriophage P1 harbors a gene coding for a 162-amino-acid protein which shows 66% amino acid sequence identity to the Escherichia coli single-stranded DNA-binding protein (SSB)."
  - statement: Cloned P1 ssb functionally substitutes for E. coli ssb in vivo and
      is expressed specifically during lytic growth from a C1-repressible promoter.
    supporting_text: "When cloned on an intermediate-copy-number plasmid, the P1 gene is able to suppress the temperature-sensitive defect of an E. coli ssb mutant, indicating that the two proteins are functionally interchangeable."
  - statement: Exclusive lytic expression of SSB-P1 indicates a primary role in vegetative
      phage DNA replication.
    supporting_text: "The expression of SSB-P1 exclusively during lytic growth indicates a function of the protein related to vegetative DNA replication."
core_functions:
- description: Binds single-stranded DNA intermediates during the bacteriophage P1
    lytic cycle to support vegetative viral DNA replication, recruiting host replisome
    components via its conserved C-terminal acidic peptide.
