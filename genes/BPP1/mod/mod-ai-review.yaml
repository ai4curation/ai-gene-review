description: >-
  Modification and target-recognition subunit Mod (M.EcoPI / M.EcoP1I; EC 2.1.1.72)
  of the type III restriction-modification enzyme EcoPI encoded by the mod-res
  operon of Escherichia phage P1. Mod is a beta-subtype DNA N6-adenine
  methyltransferase that recognizes the asymmetric double-stranded sequence
  5'-AGACC-3' and transfers a methyl group from S-adenosyl-L-methionine to the
  N6 position of the internal adenine (5'-AGm6ACC-3'). Alone, Mod functions as a
  homodimeric methyltransferase (Mod2) that modifies host and prophage DNA; in
  complex with the Res restriction subunit, it forms a heterotetrameric
  Res2Mod2 holoenzyme in which Mod provides sequence-specific DNA recognition
  for both methylation and ATP-dependent DNA cleavage.
