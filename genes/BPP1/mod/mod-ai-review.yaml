core_functions:
  - description: >-
      Recognizes the asymmetric DNA sequence 5'-AGACC-3' and catalyzes
      S-adenosyl-L-methionine-dependent methylation of the internal adenine to
      N6-methyladenine as the modification and target-recognition subunit of the
      type III restriction-modification enzyme EcoPI (forming both a Mod2
      methyltransferase dimer and a Res2Mod2 restriction-modification
      heterotetramer).
    molecular_function:
      id: GO:0009007
      label: site-specific DNA-methyltransferase (adenine-specific) activity
    directly_involved_in:
      - id: GO:0009307
        label: DNA restriction-modification system
    supported_by:
      - reference_id: PMID:2837577
        supporting_text: >-
          The mod gene product is responsible for binding the system-specific DNA recognition sequences in both restriction and modification; it also catalyses the modification reaction.
      - reference_id: PMID:15489417
        supporting_text: >-
          The P1 Mod subunit recognizes the DNA sequence 5′-AGACC and catalyzes methylation of the central adenine residue at the N-6 position ( 23 ), using adenosyl methionine as the methyl donor.
      - reference_id: PMID:21048863
        supporting_text: >-
          EcoP1I DNA methyltransferase (M.EcoP1I) catalyses the transfer of a methyl group from AdoMet to the second adenine in the recognition sequence 5′-AGACC-3′ to form N6-methyladenine in the presence of metal ions [4].
suggested_questions:
  - question: >-
      How does divalent metal ion binding at the (358)ID(x)n...ExK(401) and
      (600)DxDxD(604) motifs of M.EcoPI coordinate conformational switching
      between methylation of a single 5'-AGACC-3' site and licensing of Res
      ATPase/sliding upon binding of a Res2Mod2 complex?
    experts:
      - Desirazu N. Rao
      - Mark D. Szczelkun
      - Thomas A. Bickle
suggested_experiments:
  - description: >-
      Determine the high-resolution cryo-EM structure of the P1 EcoPI Res2Mod2
      heterotetramer bound to 5'-AGACC-3' dsDNA in the presence of Sinefungin
      and ADP-BeFx.
    hypothesis: >-
      One Mod subunit in the Mod2 dimer recognizes the 5'-AGACC-3' target while
      the second Mod subunit positions the N-terminal SF2 helicase lobe of Res
      onto adjacent DNA to initiate ATP-triggered 1D diffusion.
    experiment_type: Cryo-EM single-particle analysis
