id: P19653
gene_symbol: kilA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Protein KilA encoded upstream of repL in the C1-repressed kilA-repL lytic
  replication operon. Contains a conserved N-terminal KilA-N domain (residues 21-121)
  and a C-terminal ANT domain featuring a Cro-like helix-turn-helix DNA-binding motif
  (residues 176-195) homologous to the P1/P7 Ant1/Ant2 antirepressor proteins. Although
  dispensable for lytic DNA replication and phage development under laboratory conditions,
  unrepressed expression of KilA interferes with plasmid establishment or is lethal
  to Escherichia coli host cells.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005039
  - UniProtKB-KW:KW-0238
  review:
    summary: KilA contains a C-terminal Cro-like helix-turn-helix DNA-binding motif
      homologous to the P1/P7 Ant proteins as well as an N-terminal KilA-N DNA-binding
      domain.
    action: ACCEPT
    reason: Sequence analysis demonstrates that KilA possesses a C-terminal 20-amino-acid
      helix-turn-helix DNA-binding motif shared with the P1/P7 Ant proteins (InterPro:IPR005039,
      file:genes/BPP1/kilA/kilA-uniprot.txt) and an N-terminal KilA-N domain (InterPro:IPR018004).
      Because its specific target DNA sites and physiological role in the P1 life
      cycle remain undetermined (PMID:2661830, PMID:15489417), general DNA binding
      (GO:0003677) is the appropriate level of specificity.
    supported_by:
    - reference_id: file:genes/BPP1/kilA/kilA-uniprot.txt
      supporting_text: 'DR   InterPro; IPR018004; KilA/APSES_HTH.'
    - reference_id: PMID:15489417
      supporting_text: The repL gene is in an operon with the preceding gene, kilA
        , whose function is unclear ( 112 , 295 ). When expressed, kilA is lethal
        to E. coli . Its product is dispensable for phage replication.
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:2661830
  title: Genetic analysis of the lytic replicon of bacteriophage P1. II. Organization
    of replicon elements.
  findings:
  - statement: The 266-codon kilA gene is promoter-proximal in the kilA-repL operon,
      non-essential for L-replicon function, and lethal to host cells or inhibitory
      to plasmid establishment when expressed.
    supporting_text: The promoter-proximal reading frame is 266 amino acid residues
      long and is not essential for replicon function. In fact, expression of that
      open reading frame either interferes with plasmid establishment after transformation
      or is lethal to cells.
- id: PMID:2661831
  title: Structure and regulation of the lytic replicon of phage P1.
  findings:
  - statement: Insertional inactivation shows that kilA is non-essential for replication
      and lytic development whereas repL is essential.
    supporting_text: The kilA gene was shown to be non-essential for both replication
      and lytic development whereas the repL gene probably encodes an essential replication
      protein.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: Expression of kilA is lethal to the host cell and its product is dispensable
      for phage replication, while its physiological role in the P1 life cycle remains
      unclear.
    supporting_text: The repL gene is in an operon with the preceding gene, kilA ,
      whose function is unclear ( 112 , 295 ). When expressed, kilA is lethal to E.
      coli . Its product is dispensable for phage replication.
