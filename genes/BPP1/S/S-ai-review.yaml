core_functions:
  - description: >-
      Forms the structural shaft and C-terminal receptor-binding tip of the six
      bacteriophage P1 tail fibers, anchoring to the baseplate via its constant
      N-terminal region and binding host cell surface lipopolysaccharide
      receptors via its C-invertible C-terminal domain to mediate virion
      attachment.
    molecular_function:
      id: GO:0005198
      label: structural molecule activity
    directly_involved_in:
