id: P22588
gene_symbol: S
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Main tail fiber structural protein gpS (gene 19 product) of Escherichia phage
  P1 that mediates host receptor recognition and reversible/irreversible virion
  adsorption onto the outer membrane lipopolysaccharide (LPS) core of host
  Enterobacteriaceae. Its N-terminal constant region (Sc) anchors the fiber to
  the baseplate, whereas its C-terminal receptor-binding region (Sv or Sv') is
  alternatively expressed via Cin-mediated inversion of the 3-kb C segment,
  switching phage host range specificity in conjunction with the cognate tail
  fiber assembly chaperone U or U'.
