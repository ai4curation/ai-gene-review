        label: virion attachment to host cell
    supported_by:
      - reference_id: PMID:15489417
        supporting_text: >-
          S specifies a structural protein that extends along the tail fiber with its constant N-terminal part at the baseplate, while its variable C-terminal part is available to bind a specific receptor on the host cell surface (reviewed in reference 347 ).
      - reference_id: PMID:35458408
        supporting_text: >-
          P1 S is the well-characterized tail fiber and specificity determinant responsible for host recognition [10].
suggested_questions:
  - question: >-
      Does the chaperone gpU/gpU' remain bound to the C-terminal tip of gpS in
      mature P1 virions (like Ur-lambda Tfa) or dissociate after catalyzing gpS
      trimerization (like T4 gp38)?
    experts:
      - Jason J. Gill
      - Malgorzata B. Lobocka
suggested_experiments:
  - description: >-
      Perform quantitative targeted LC-MS/MS and cryo-EM subtomogram averaging
      of the distal tail fiber tip of C(+) and C(-) P1 virions.
    hypothesis: >-
      gpS forms a homotrimeric tail fiber whose distal receptor-binding tip is
      folded by gpU/gpU' during assembly.
    experiment_type: Quantitative proteomics and cryo-electron tomography
