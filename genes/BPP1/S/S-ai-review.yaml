existing_annotations:
  - term:
      id: GO:0019062
      label: virion attachment to host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: >-
        gpS forms the host-receptor-binding tail fibers of phage P1 and is the
        primary determinant of virion attachment to the host bacterial surface.
      action: ACCEPT
      reason: >-
        Extensive genetic, sequence, and structural evidence establishes that
        gpS is the main tail fiber protein whose variable C-terminal region
        binds specific LPS receptors on the host cell surface to mediate phage
        adsorption.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            S specifies a structural protein that extends along the tail fiber with its constant N-terminal part at the baseplate, while its variable C-terminal part is available to bind a specific receptor on the host cell surface (reviewed in reference 347 ).
        - reference_id: PMID:35458408
          supporting_text: >-
            P1 S is the well-characterized tail fiber and specificity determinant responsible for host recognition [10].
  - term:
      id: GO:0046718
      label: symbiont entry into host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: >-
