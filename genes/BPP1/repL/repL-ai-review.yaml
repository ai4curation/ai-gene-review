id: P19654
gene_symbol: repL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Lytic replication initiator protein RepL (281 amino acids, 30.9 kDa)
  encoded in the C1-repressed kilA-repL operon. Essential for initiating bidirectional
  theta-mode viral DNA replication during the lytic cycle from the lytic replication
  origin oriL, which is embedded within the distal half of the repL coding sequence.
existing_annotations:
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0235
  review:
    summary: RepL is involved in DNA replication, specifically acting as the viral
      replication initiator protein that initiates lytic DNA replication at oriL.
    action: MODIFY
    reason: Genetic and molecular analyses demonstrate that RepL is the essential
      replication initiator protein of the P1 lytic replicon, initiating bidirectional
      theta-mode viral DNA replication from the oriL origin located within the repL
      coding region (PMID:2661830, PMID:2661831, PMID:15489417). The general DNA
      replication term should be refined to DNA replication initiation (GO:0006270)
      and viral DNA genome replication (GO:0039693).
    proposed_replacement_terms:
    - id: GO:0006270
      label: DNA replication initiation
    - id: GO:0039693
      label: viral DNA genome replication
    supported_by:
    - reference_id: PMID:2661830
      supporting_text: The promoter-distal reading frame, designated the repL open
        reading frame, is either 269 or 281 amino acid residues long and is essential
        for replicon function.
    - reference_id: PMID:2661831
      supporting_text: Evidence is provided here that the L-replicon is the principal
        replicon used for DNA replication during the lytic cycle. The L-replicon (exclusive
        of its promoter) is shown to be contained within a 1093-base-pair DNA segment
        that includes a 281-codon open reading frame, designated repL.
    - reference_id: PMID:15489417
      supporting_text: Lytic replication initiates bidirectionally in the theta mode
        from an origin, oriL , distinct from the plasmid origin and located within
        the essential replication gene, repL
- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IMP
  original_reference_id: PMID:2661830
  qualifier: enables
  review:
    summary: RepL is the essential replication initiator protein that acts at the internal oriL replication origin to initiate P1 lytic DNA replication.
    action: NEW
    reason: Genetic dissection of the P1 L-replicon demonstrates that RepL is the replicon-specific initiator protein required for bidirectional theta-mode replication from the oriL origin located within the repL coding sequence (PMID:2661830, PMID:2661831, PMID:15489417).
    supported_by:
    - reference_id: PMID:2661830
      supporting_text: The promoter-distal reading frame, designated the repL open reading
        frame, is either 269 or 281 amino acid residues long and is essential for replicon
        function.
    - reference_id: PMID:15489417
      supporting_text: Lytic replication initiates bidirectionally in the theta mode
        from an origin, oriL , distinct from the plasmid origin and located within
        the essential replication gene, repL
