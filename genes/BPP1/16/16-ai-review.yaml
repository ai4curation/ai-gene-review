existing_annotations:
  - term:
      id: GO:0005198
      label: structural molecule activity
    evidence_type: IDA
    original_reference_id: PMID:35458408
    review:
      summary: >-
        gp16 is a virion-associated structural or morphogenetic component of the
        P1 tail/baseplate detected in purified P1 virions by mass spectrometry.
      action: NEW
      reason: >-
        LC-MS/MS proteomics of purified P1 virions (PMID:35458408) and genetic
        mapping of baseplate/tail mutants (PMID:15489417) identify gp16 as a
        virion-associated tail/baseplate protein.
      supported_by:
        - reference_id: PMID:35458408
          supporting_text: >-
            Five additional P1 proteins were identified as virion-associated with a weak LC-MS/MS signal (gp7, gp16, and gp25), or were shown to be essential for virion morphogenesis (PmgR, PmgB).
  - term:
      id: GO:0098003
      label: viral tail assembly
    evidence_type: IMP
    original_reference_id: PMID:15489417
    review:
      summary: >-
        Mutations in gene 16 abolish normal tail morphogenesis, causing
        accumulation of complete heads and aberrant polysheaths with no visible
        tail structures.
      action: NEW
      reason: >-
        Amber mutations in gene 16 produce complete heads and polysheaths
        without assembled tails, phenocopying baseplate wedge mutants in gene 26
        and R (PMID:15489417).
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            Mutations in three other P1 genes, R, 16 , and 21 , cause phenotypes identical to those of gene 26 mutants ( 323 ).
core_functions:
  - description: >-
      Virion-associated tail and baseplate component required for proper
      bacteriophage P1 baseplate and contractile tail assembly, preventing
      aberrant polysheath formation.
    molecular_function:
      id: GO:0005198
      label: structural molecule activity
    directly_involved_in:
      - id: GO:0098003
        label: viral tail assembly
    supported_by:
      - reference_id: PMID:15489417
        supporting_text: >-
          Mutations in three other P1 genes, R, 16 , and 21 , cause phenotypes identical to those of gene 26 mutants ( 323 ).
      - reference_id: PMID:35458408
        supporting_text: >-
          Five additional P1 proteins were identified as virion-associated with a weak LC-MS/MS signal (gp7, gp16, and gp25), or were shown to be essential for virion morphogenesis (PmgR, PmgB).
suggested_questions:
  - question: >-
      Does gp16 act as a structural baseplate wedge subunit or as a transient
      baseplate assembly factor that prevents premature tail sheath
      polymerization (polysheath formation)?
    experts:
      - Jason J. Gill
      - Ry Young
      - Malgorzata B. Lobocka
suggested_experiments:
  - description: >-
      Perform cryo-EM reconstruction of the P1 baseplate and pull-down assays of
      gp16 with baseplate proteins BplA, gp26, R, and Sit.
    hypothesis: >-
      gp16 associates in low copy number with the baseplate-sheath interface to
      nucleate proper tail tube/sheath assembly and prevent aberrant polysheath
      formation.
    experiment_type: Cryo-EM structural analysis and co-immunoprecipitation
