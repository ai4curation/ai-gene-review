id: P22587
gene_symbol: '16'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Virion-associated tail and baseplate morphogenesis protein gp16 of Escherichia
  phage P1, encoded at the distal end of the late sit operon (pmgC-tub-pmgB-sit-pmgA-bplA-16).
  Amber mutations in gene 16 abolish normal tail assembly and result in the
  accumulation of complete heads and aberrant polysheaths, indicating a role in
  baseplate and tail morphogenesis.
