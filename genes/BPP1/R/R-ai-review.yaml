      label: structural molecule activity
    evidence_type: IDA
    original_reference_id: PMID:35458408
    review:
      summary: >-
        gpR is a structural baseplate wedge component of the P1 virion,
        orthologous to bacteriophage T4 baseplate protein gp8.
      action: NEW
      reason: >-
        Virion mass spectrometry and HHpred structural homology analysis
