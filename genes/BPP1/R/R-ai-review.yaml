  - term:
      id: GO:0098003
      label: viral tail assembly
    evidence_type: IMP
    original_reference_id: PMID:15489417
    review:
      summary: >-
        gpR is an essential baseplate wedge component required for P1 viral tail
        assembly; mutations in R cause accumulation of complete heads and
        polysheaths with no normal tails.
      action: NEW
      reason: >-
        Mutant phenotype analysis (PMID:15489417) and virion mass spectrometry
        plus HHpred orthology to T4 baseplate wedge protein gp8 (PMID:35458408)
        establish that gpR is a structural baseplate wedge protein essential for
        viral tail assembly.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            Mutations in three other P1 genes, R, 16 , and 21 , cause phenotypes identical to those of gene 26 mutants ( 323 ).
        - reference_id: PMID:35458408
          supporting_text: >-
            P1 proteins R and BplA are baseplate wedge components orthologous to T4 gp8 and gp6, respectively, based on HHpred analysis (Supplementary Table S4).
core_functions:
  - description: >-
      Serves as a structural baseplate wedge component (orthologous to T4 gp8)
      required for bacteriophage P1 baseplate morphogenesis and contractile tail
      assembly.
    molecular_function:
      id: GO:0005198
      label: structural molecule activity
    directly_involved_in:
      - id: GO:0098003
        label: viral tail assembly
    supported_by:
      - reference_id: PMID:2526777
        supporting_text: >-
          The tail-fibre gene and gene R are transcriptionally and translationally coupled. Thus, the tail-fibre operon of bacteriophage P1 consists of three genes: gene R, gene 19 (or gene S) and gene U.
      - reference_id: PMID:15489417
        supporting_text: >-
          Mutations in three other P1 genes, R, 16 , and 21 , cause phenotypes identical to those of gene 26 mutants ( 323 ).
      - reference_id: PMID:35458408
        supporting_text: >-
          While the assembly process of the P1 baseplate is not known, mass-spectrometry identified five proteins that are predicted to play a role in baseplate structure and have been assigned roles by bioinformatic analysis: S, R, BplA, PmgG, and gp6 (Table 1, Supplementary Table S4).
suggested_questions:
  - question: >-
      Does translational coupling between R and S coordinate the stoichiometry
      of baseplate wedge assembly with tail fiber attachment in phage P1?
    experts:
      - Jason J. Gill
      - Ry Young
      - Malgorzata B. Lobocka
suggested_experiments:
  - description: >-
      Determine the structure and interaction partners of gpR within the P1
      baseplate wedge using cryo-EM and bacterial two-hybrid assays with BplA,
      gp26, and the N-terminal constant domain of gpS.
    hypothesis: >-
      gpR forms a homodimer within each of the six baseplate wedges that bridges
      BplA (T4 gp6 ortholog) and the N-terminal baseplate-anchoring domain of
      the gpS tail fiber.
    experiment_type: Cryo-EM reconstruction and protein-protein interaction assays
