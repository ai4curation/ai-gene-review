id: P22946
gene_symbol: R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Baseplate wedge subunit gpR of Escherichia phage P1, encoded as the first gene
  of the late tail-fiber operon (R-S-U) and transcriptionally and translationally
  coupled to the tail fiber gene S. Mass spectrometry of purified virions and
  HHpred structural homology analysis identify gpR as an ortholog of
  bacteriophage T4 baseplate wedge protein gp8, and amber mutations in gene R
  abolish normal tail assembly, yielding complete heads and polysheaths.
