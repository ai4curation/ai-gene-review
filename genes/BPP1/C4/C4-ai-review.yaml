id: P11189
gene_symbol: C4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Immunity repressor locus c4 in the immI region of bacteriophage P1. Although
  UniProtKB P11189 represents a hypothetical 66-amino-acid polypeptide originally
  predicted from the nucleotide sequence, genetic and biochemical studies established
  that the functional c4 gene product is not a protein but a 77-nucleotide processed
  antisense RNA (C4 RNA). Excised from the 5' region of the polycistronic c4-icd-ant1/2
  transcript, C4 RNA folds into a cloverleaf-like structure whose exposed single-stranded
  loops base-pair with complementary sequences (a2 and b2) in the c4-icd-ant1/2 mRNA,
  occluding the icd ribosome-binding site, blocking translation of icd and translationally
  coupled ant1/2 antirepressor, and promoting premature Rho-dependent transcription
  termination.
existing_annotations:
- term:
