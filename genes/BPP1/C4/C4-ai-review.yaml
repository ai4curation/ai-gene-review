- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:3811234
  title: The c4 gene of phage P1.
  findings:
  - statement: Localized the c4 immunity gene to a 335-bp DNA fragment of P1 and tentatively
      predicted a 66-codon ORF prior to the discovery that c4 acts as an antisense
      RNA.
    supporting_text: The c4 gene of phage P1 has been localized to 335 bp of the P1EcoRI-9
      fragment, within 50 bp of the EcoRI-9/14 junction. DNA sequence analysis of
      this fragment reveals a single open reading frame of 66 amino acids.
- id: PMID:2585500
  title: Organization of the immunity region immI of bacteriophage P1 and synthesis
    of the P1 antirepressor.
  findings:
  - statement: The c4 gene product in the immI locus negatively regulates synthesis
      of the Ant1/Ant2 antirepressor proteins.
    supporting_text: The immI region of bacteriophage P1 includes the ant/reb gene,
      which encodes the antirepressor protein, and the c4 gene, which encodes a repressor
      molecule that negatively regulates antirepressor synthesis.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: The functional product of c4 is a 77-nt processed antisense RNA rather
      than a protein.
    supporting_text: A trans -acting RNA (the c 4 product) regulates Ant1/2 synthesis
      in a novel way, being excised from a transcript on which lies its site of action.
  - statement: C4 RNA base-pairs with complementary regions a2 and b2 in the c4-icd-ant1/2
      mRNA to occlude the icd ribosome-binding site and repress translation of icd
      and translationally coupled ant1.
    supporting_text: Two short single-stranded regions, b′ and a′, exposed in its
      cloverleaf-like structure, block translation of icd (and of translationally
      coupled ant1 ) by interaction with the complementary regions, a2 and b2, in
      the c 4 icd ant1/2 mRNA. The interaction occludes the RBS in front of the icd
      gene
