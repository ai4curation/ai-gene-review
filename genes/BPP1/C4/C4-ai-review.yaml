  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: Automated keyword-derived DNA binding annotation on a spurious predicted
      ORF; the functional c4 product is an antisense RNA that binds mRNA, not a DNA-binding
      protein.
    action: REMOVE
    reason: UniProtKB P11189 (PE=4 Predicted) reflects an early hypothesis that c4
      encoded a 66-aa DNA-binding repressor protein (PMID:3811234). Subsequent work
      demonstrated that the functional c4 product is a 77-nt processed antisense RNA
      that base-pairs with complementary target sequences (a2 and b2) in the c4-icd-ant1/2
      mRNA to occlude the icd ribosome-binding site and block ant1/2 translation (PMID:15489417).
      Neither the C4 RNA nor the hypothetical ORF binds DNA.
    supported_by:
    - reference_id: PMID:15489417
      supporting_text: A 77-bp antisense RNA encoded by c 4 regulates expression of
        downstream genes in its own message
    - reference_id: PMID:15489417
      supporting_text: Two short single-stranded regions, b′ and a′, exposed in its
        cloverleaf-like structure, block translation of icd (and of translationally
        coupled ant1 ) by interaction with the complementary regions, a2 and b2, in
        the c 4 icd ant1/2 mRNA. The interaction occludes the RBS in front of the
        icd gene
