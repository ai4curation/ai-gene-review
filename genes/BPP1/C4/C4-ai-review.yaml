suggested_questions:
- question: Should UniProtKB P11189 be obsoleted as a spurious protein entry and migrated
    to an RNAcentral non-coding RNA record representing the 77-nt C4 antisense RNA?
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and 5'/3' RACE across the P1
    immI locus during lysogeny and lytic induction.
  hypothesis: Confirm absence of ribosome footprints corresponding to the hypothetical
    66-aa ORF and quantify RNase P-processed 77-nt C4 RNA abundance relative to c4-icd-ant1/2
    transcript termination.
