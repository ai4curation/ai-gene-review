  review:
    summary: Lpa directly activates transcription from P1 late promoters by enabling
      RNA polymerase binding.
    action: NEW
    reason: In vivo trans-activation and footprinting studies show that Lpa binds
      the -22 inverted repeat of P1 late promoters and is required for RNA polymerase
      binding and transcriptional activation of late genes (PMID:1917870, PMID:15489417).
    supported_by:
    - reference_id: PMID:1917870
      supporting_text: An in vivo trans activation assay system, consisting of gene
        10 under the transcriptional control of an inducible promoter and a gene S/lacZ
