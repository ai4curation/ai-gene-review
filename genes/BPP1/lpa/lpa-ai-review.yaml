suggested_questions:
- question: How do Lpa (gp10) and host SspA contact the sigma-70 RNA polymerase holoenzyme
    to compensate for the absence of a -35 promoter element at P1 late promoters?
suggested_experiments:
- description: Determine the cryo-EM structure of an open transcription initiation
    complex containing E. coli sigma-70 RNA polymerase holoenzyme, host SspA, P1 Lpa,
    and the P1 late promoter Ps.
  hypothesis: Lpa binds the -22 spacer inverted repeat on the opposite face of the
    DNA helix or remodels the spacer geometry while contacting the SspA-associated
    RNA polymerase holoenzyme to stabilize open complex formation.
