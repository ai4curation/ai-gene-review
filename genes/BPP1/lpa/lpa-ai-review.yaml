        function required for late promoter activation.
    - reference_id: PMID:15489417
      supporting_text: Results of in vivo footprinting experiments confirm that RNA
        polymerase binds to late promoter sequences in the presence, but not in the
        absence, of Lpa
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:1917870
  title: Bacteriophage P1 gene 10 encodes a trans-activating factor required for late
    gene expression.
  findings:
  - statement: Gene 10 (lpa) encodes an 18.1-kDa trans-activating protein that is
      the only phage-encoded factor required to activate transcription from P1 late
      promoters.
    supporting_text: An in vivo trans activation assay system, consisting of gene
      10 under the transcriptional control of an inducible promoter and a gene S/lacZ
      fusion transcribed from Ps, was used to show that gene 10 is the only phage-encoded
      function required for late promoter activation.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: Lpa interacts with a conserved 9-bp inverted repeat centered around
      position -22 of P1 late promoters.
    supporting_text: Instead, they have a conserved 9-bp inverted repeat (previously
      termed late operator) that is centered about position −22 of the transcription
      start site and interacts with Lpa
  - statement: In vivo footprinting confirms that RNA polymerase binds to P1 late
      promoters only in the presence of Lpa.
    supporting_text: Results of in vivo footprinting experiments confirm that RNA
      polymerase binds to late promoter sequences in the presence, but not in the
      absence, of Lpa
core_functions:
- description: Sequence-specific DNA-binding transcription activator that binds the
    -22 inverted repeat of P1 late promoters and recruits host sigma-70 RNA polymerase
    holoenzyme (together with host SspA) to activate late viral gene transcription.
