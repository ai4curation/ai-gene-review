id: Q06260
gene_symbol: lpa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Late promoter-activating protein Lpa (gp10), a 150-amino-acid sequence-specific
  DNA-binding transcriptional activator that directs expression of bacteriophage P1
  late genes during the lytic cycle. Transcribed from a C1-repressible early promoter,
  Lpa binds a conserved 9-bp inverted repeat centered near position -22 of P1 late
  promoters and cooperates with host Escherichia coli stringent starvation protein
  SspA and sigma-70 RNA polymerase holoenzyme to activate transcription of morphogenetic,
  DNA packaging, and host lysis operons.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR058027
  - UniProtKB-KW:KW-0238
  review:
    summary: Lpa binds DNA, but specifically acts as a sequence-specific DNA-binding
      transcription activator that recognizes the -22 inverted repeat of P1 late promoters.
    action: MODIFY
    reason: In vivo trans-activation and footprinting studies show that Lpa (gp10)
      binds a conserved 9-bp inverted repeat centered near position -22 of P1 late
      promoters and is the phage-encoded transcriptional activator required for RNA
      polymerase recruitment to late promoters (PMID:1917870, PMID:15489417). The
      general DNA binding term should be refined to DNA-binding transcription activator
      activity (GO:0001216) and transcription cis-regulatory region binding (GO:0000976).
    proposed_replacement_terms:
    - id: GO:0001216
      label: DNA-binding transcription activator activity
    - id: GO:0000976
      label: transcription cis-regulatory region binding
    supported_by:
    - reference_id: PMID:1917870
      supporting_text: An in vivo trans activation assay system, consisting of gene
        10 under the transcriptional control of an inducible promoter and a gene S/lacZ
        fusion transcribed from Ps, was used to show that gene 10 is the only phage-encoded
        function required for late promoter activation.
    - reference_id: PMID:15489417
      supporting_text: Instead, they have a conserved 9-bp inverted repeat (previously
        termed late operator) that is centered about position −22 of the transcription
        start site and interacts with Lpa
