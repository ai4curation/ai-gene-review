id: Q06261
gene_symbol: tec
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Uncharacterized 76-amino-acid predicted protein (8.8 kDa) encoded immediately
  downstream of the phd-doc plasmid addiction module and upstream of the lpa (gene
  10) late promoter activator gene in bacteriophage P1. Has no known conserved domains
  or experimentally determined molecular function.
existing_annotations: []
references:
- id: file:genes/BPP1/tec/tec-uniprot.txt
  title: UniProtKB record for Q06261 (TEC_BPP1)
  findings:
  - statement: Q06261 is an uncharacterized 76-aa (8762 Da) predicted protein (Protein
      tec) encoded in the phd-doc region of bacteriophage P1 with no detected functional
      domains.
    supporting_text: 'DR   EMBL; M95666; -; NOT_ANNOTATED_CDS; Unassigned_DNA. ... PE   4: Predicted;'
- id: PMID:8411153
  title: 'Plasmid addiction genes of bacteriophage P1: doc, which causes cell death
    on curing of prophage, and phd, which prevents host death when prophage is retained.'
  findings:
  - statement: Reports the nucleotide sequence of the P1 plasmid addiction region
      containing phd, doc, and the downstream sequence encoding tec.
    supporting_text: The plasmid withdrawal response depends on a gene named doc (death
      on curing), encoding a 126 amino acid protein. Expression of doc is not SOS-inducing
      and killing by Doc is recA-independent. In cells that retain P1 the killing
      is prevented by the product of a gene named phd (prevent host death), encoding
      a 73 amino acid protein.
- id: PMID:1917870
  title: Bacteriophage P1 gene 10 encodes a trans-activating factor required for late
    gene expression.
  findings:
  - statement: Reports the nucleotide sequence of the P1 lpa (gene 10) region adjacent
      to the phd-doc locus.
    supporting_text: An in vivo trans activation assay system, consisting of gene
      10 under the transcriptional control of an inducible promoter and a gene S/lacZ
      fusion transcribed from Ps, was used to show that gene 10 is the only phage-encoded
      function required for late promoter activation.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: Two open reading frames of unknown function (pdcA and pdcB) situated
      between doc and lpa appear to be co-transcribed with the phd-doc operon.
    supporting_text: The nucleotide sequence downstream of doc contains two ORFs that
      could encode proteins of 66 and 347 residues, designated here pdcA and pdcB
      (post-doc). The 5′ end of pdcA overlaps 17 terminal nucleotides of the doc gene.
      The phd-doc transcript appears to include the transcripts of pdcA and pdcB
core_functions:
- description: Uncharacterized 76-amino-acid predicted polypeptide encoded downstream
    of doc and upstream of lpa (gene 10), with no known molecular activity.
  supported_by:
  - reference_id: file:genes/BPP1/tec/tec-uniprot.txt
    supporting_text: 'DR   EMBL; M95666; -; NOT_ANNOTATED_CDS; Unassigned_DNA. ... PE   4: Predicted;'
  - reference_id: PMID:15489417
    supporting_text: The nucleotide sequence downstream of doc contains two ORFs that
      could encode proteins of 66 and 347 residues, designated here pdcA and pdcB
      (post-doc). The 5′ end of pdcA overlaps 17 terminal nucleotides of the doc gene.
      The phd-doc transcript appears to include the transcripts of pdcA and pdcB
suggested_questions:
- question: Is the tec open reading frame translated in vivo, and does it play any
    cis- or trans-acting role in coupling phd-doc transcription to the downstream
    lpa promoter?
suggested_experiments:
- description: Construct a synonymous start-codon mutation in tec on the P1 prophage
    and measure phd-doc autorepression, post-segregational killing efficiency, and
    lpa transcript levels during lytic induction.
  hypothesis: Mutating the tec start codon without altering the overlapping transcriptional
    regulatory elements will reveal whether a translated Tec polypeptide has any functional
    role in the P1 life cycle.
