suggested_questions:
- question: How does the synaptic invertasome formed by Cin dimers at cixL/cixR and
    host Fis at the internal recombinational enhancer ensure exclusively intramolecular
    inversion rather than deletion?
suggested_experiments:
- description: Determine the cryo-EM structure of the complete P1 invertasome assembled
    from Cin, E. coli Fis, and supercoiled DNA carrying cixL, cixR, and the cin recombinational
    enhancer.
  hypothesis: Topological trapping of two negative supercoil nodes by Fis-enhancer
    and Cin-cix complexes aligns cixL and cixR in an antiparallel synaptic geometry
    that permits only inversion upon subunit rotation.
