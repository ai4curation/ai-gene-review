  review:
    summary: Indirect effect; Cin is an intracellular DNA invertase that switches
      tail fiber gene expression rather than a virion component mediating host entry.
    action: REMOVE
    reason: Cin does not directly participate in virion attachment or entry into the
      host cell. Instead, Cin catalyzes DNA inversion of the C-segment inside the
      infected cell, which alternates expression of the tail fiber C-terminal variants
      Sv and Sv' (PMID:6315399, PMID:15489417). The tail fiber proteins, not the Cin
      recombinase, mediate host cell entry.
