id: P10311
gene_symbol: cin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Serine site-specific DNA invertase Cin (186 amino acids, 21.2 kDa) that
  catalyzes conservative site-specific inversion of the 4.2-kb C-segment of bacteriophage
  P1 DNA between two inverted 26-bp crossover sites (cixL and cixR). Cleaves and exchanges
  DNA strands via a transient O-(5'-phospho-DNA)-serine (Ser-9) covalent intermediate,
  stimulated by host Escherichia coli Fis binding to a recombinational enhancer within
  the cin coding sequence. Inversion alternates which C-terminal tail fiber coding
  module (Sv-U or Sv'-U') is fused in-frame to the constant 5' tail fiber gene region
  (Sc), thereby switching viral receptor specificity and bacterial host range.
