      supported_by:
        - reference_id: PMID:1538406
          supporting_text: >-
            By sequencing wild-type P1 DNA and DNA derived from various P1 amber mutants that are deficient in pac cleavage, two distinct genes, referred to as pacA and pacB, were identified.
        - reference_id: PMID:15489417
          supporting_text: >-
            P1 PacB bears an ATP binding motif (see Table S1 in the supplemental material) and presumably transduces the energy of ATP hydrolysis into the energy of DNA translocation into the capsid, as does the analogous T4 gp17 protein.
core_functions:
  - description: >-
      Catalyzes double-stranded endonucleolytic cleavage of the P1 packaging
      site (pac) in complex with the PacA recognition subunit and performs
      termination cuts after headful DNA packaging.
    molecular_function:
      id: GO:0004519
      label: endonuclease activity
    directly_involved_in:
      - id: GO:0019073
        label: viral DNA genome packaging
    supported_by:
      - reference_id: PMID:1538406
        supporting_text: >-
          Extracts prepared from cells expressing both PacA and PacB are proficient for site-specific cleavage of the P1 packaging site, whereas those lacking either protein are not. However, the two defective extracts can complement each other to restore functional pac cleavage activity. Thus, PacA and PacB are two essential bacteriophage proteins required for recognition and cleavage of the P1 packaging site.
      - reference_id: PMID:15489417
        supporting_text: >-
          Cleavage of the P1 packaging site requires the product of both proteins PacA and PacB, presumably as heterooligomers.
  - description: >-
      Transduces the energy of ATP hydrolysis into mechanical translocation of
      concatemeric viral DNA into the phage prohead during headful packaging.
    molecular_function:
      id: GO:0016887
      label: ATP hydrolysis activity
    directly_involved_in:
      - id: GO:0019073
        label: viral DNA genome packaging
    supported_by:
      - reference_id: PMID:15489417
        supporting_text: >-
          P1 PacB bears an ATP binding motif (see Table S1 in the supplemental material) and presumably transduces the energy of ATP hydrolysis into the energy of DNA translocation into the capsid, as does the analogous T4 gp17 protein.
      - reference_id: PMID:18687036
        supporting_text: >-
          An ATP-powered DNA translocation machine encapsidates the viral genome in the large dsDNA bacteriophages. The essential components include the empty shell, prohead, and the packaging enzyme, terminase. During translocation, terminase is docked on the prohead's portal protein. The translocation ATPase and the concatemer-cutting endonuclease reside in terminase.
suggested_questions:
  - question: >-
      Does the internal in-frame product PacC translated from the distal third
      of pacB regulate PacB endonuclease or ATPase activity during headful
      packaging termination?
    experts:
      - Malgorzata B. Lobocka
      - Catalin E. Catalano
suggested_experiments:
  - description: >-
      Purify recombinant P1 PacB and test ATPase and DNA translocation rates in
      the presence and absence of PacA, PacC, and assembled Prt portal rings.
    hypothesis: >-
      PacA stimulates PacB site-specific endonuclease activity at methylated pac
      DNA, whereas docking to the Prt portal switches PacB into a processive
      ATP-hydrolyzing DNA translocase.
    experiment_type: In vitro ATPase, nuclease, and prohead DNA packaging assays
