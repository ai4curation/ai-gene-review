existing_annotations:
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Broad nucleotide-binding annotation redundant with the more specific ATP
        binding term.
      action: TOO_GENERAL
      reason: >-
        Nucleotide binding is already entailed by ATP binding (GO:0005524),
        which is also annotated on PacB.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            P1 PacB bears an ATP binding motif (see Table S1 in the supplemental material) and presumably transduces the energy of ATP hydrolysis into the energy of DNA translocation into the capsid, as does the analogous T4 gp17 protein.
  - term:
      id: GO:0004518
      label: nuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Broad nuclease annotation redundant with the more specific endonuclease
        activity term.
      action: TOO_GENERAL
      reason: >-
        Nuclease activity is entailed by endonuclease activity (GO:0004519),
        which is already present in the annotations for PacB.
      supported_by:
        - reference_id: PMID:1538406
          supporting_text: >-
            Extracts prepared from cells expressing both PacA and PacB are proficient for site-specific cleavage of the P1 packaging site, whereas those lacking either protein are not.
  - term:
      id: GO:0004519
      label: endonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        PacB is the catalytic large terminase subunit required with PacA for
        site-specific double-stranded endonucleolytic cleavage at the pac site
        and headful termination cuts during concatemer packaging.
      action: ACCEPT
      reason: >-
        Amber mutations in pacB abolish pac cleavage in vivo and in vitro, and
        in vitro complementation of PacA- and PacB-containing extracts restores
        site-specific endonucleolytic cleavage of the P1 pac site.
      supported_by:
        - reference_id: PMID:1538406
          supporting_text: >-
            Extracts prepared from cells expressing both PacA and PacB are proficient for site-specific cleavage of the P1 packaging site, whereas those lacking either protein are not. However, the two defective extracts can complement each other to restore functional pac cleavage activity. Thus, PacA and PacB are two essential bacteriophage proteins required for recognition and cleavage of the P1 packaging site.
        - reference_id: PMID:18687036
          supporting_text: >-
            The translocation ATPase and the concatemer-cutting endonuclease reside in terminase.
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        PacB contains a conserved N-terminal Walker A (P-loop) ATP-binding motif
        (residues 56-63) that powers viral DNA translocation.
      action: ACCEPT
      reason: >-
        Sequence analysis of the P1 genome and UniProt domain annotation identify
        a canonical Walker A ATP-binding motif in PacB homologous to the
        ATP-binding packaging motor domain of phage large terminase subunits.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            P1 PacB bears an ATP binding motif (see Table S1 in the supplemental material) and presumably transduces the energy of ATP hydrolysis into the energy of DNA translocation into the capsid, as does the analogous T4 gp17 protein.
        - reference_id: file:BPP1/pacB/pacB-uniprot.txt
          supporting_text: >-
            CC   -!- FUNCTION: Component of the molecular motor that translocates genomic
  - term:
      id: GO:0016787
      label: hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Broad hydrolase annotation reflecting both endonuclease and ATPase
        activities of the large terminase subunit.
      action: MODIFY
      reason: >-
        Hydrolase activity is overly general; in addition to endonuclease
        activity (GO:0004519, already annotated), PacB functions as the
        ATP-hydrolyzing translocation motor of the terminase complex, which is
        specifically captured by ATP hydrolysis activity (GO:0016887).
      proposed_replacement_terms:
        - id: GO:0016887
          label: ATP hydrolysis activity
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            P1 PacB bears an ATP binding motif (see Table S1 in the supplemental material) and presumably transduces the energy of ATP hydrolysis into the energy of DNA translocation into the capsid, as does the analogous T4 gp17 protein.
        - reference_id: PMID:18687036
          supporting_text: >-
            An ATP-powered DNA translocation machine encapsidates the viral genome in the large dsDNA bacteriophages. The essential components include the empty shell, prohead, and the packaging enzyme, terminase. During translocation, terminase is docked on the prohead's portal protein. The translocation ATPase and the concatemer-cutting endonuclease reside in terminase.
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        PacB binds divalent metal cations required as cofactors for both its
        RNase H-fold endonuclease domain and its Walker A/B ATPase domain.
      action: KEEP_AS_NON_CORE
      reason: >-
        Divalent metal ion binding (Mg2+) is a standard cofactor requirement for
        phage large terminase endonuclease and ATPase catalysis, making it
        accurate but auxiliary to the core catalytic activities.
      supported_by:
        - reference_id: file:BPP1/pacB/pacB-uniprot.txt
          supporting_text: >-
            CC   -!- FUNCTION: Component of the molecular motor that translocates genomic
  - term:
      id: GO:0019073
      label: viral DNA genome packaging
    evidence_type: IMP
    original_reference_id: PMID:1538406
    review:
      summary: >-
        PacB is essential for pac site cleavage and ATP-driven viral DNA genome
        packaging into P1 proheads.
      action: NEW
      reason: >-
        Amber mutations in pacB abolish pac site cleavage and viral genome
        packaging, and PacB serves as the catalytic endonuclease and ATPase
