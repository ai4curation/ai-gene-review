id: P27753
gene_symbol: pacB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Large terminase (pacase) subunit PacB of Escherichia phage P1 that associates
  with the DNA-recognition subunit PacA to catalyze site-specific endonucleolytic
  cleavage of the methylated packaging site (pac) on concatemeric viral DNA and
  powers ATP-dependent translocation of viral DNA into the prohead through the
  portal vertex.
