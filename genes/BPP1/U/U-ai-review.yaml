      label: protein folding chaperone
    evidence_type: ISS
    original_reference_id: PMID:15489417
    review:
      summary: >-
        gpU acts as a molecular chaperone required for the folding and assembly
        of the C(+) variant of the gpS tail fiber protein.
      action: NEW
      reason: >-
        gpU shares 95% sequence identity with phage Mu gpU and is homologous to
        T4 gp38 and lambda Tfa tail fiber assembly chaperones, which catalyze
        tail fiber folding and trimerization (PMID:15489417).
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            It is thus likely that the gpU and gpU′ proteins of P1, like λ Tfa, can function as both tail fiber assembly chaperones and virion components.
