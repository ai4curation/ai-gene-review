id: Q71TD6
gene_symbol: U
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Tail fiber assembly protein gpU of Escherichia phage P1, encoded within the
  Cin-invertible C segment in the C(+) orientation downstream of the Sv variable
  region of the tail fiber gene S. Homologous to bacteriophage Mu gpU, T4 gp38,
  and lambda Tfa, gpU acts in the host cell cytoplasm as a tail fiber assembly
  chaperone required for the folding and assembly of the C-terminal Sv receptor-binding
  tip of the gpS(+) tail fiber, conferring infectivity on Escherichia coli K-12
  and C strains, and may also remain associated with the mature tail fiber tip.
