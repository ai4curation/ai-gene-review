existing_annotations:
  - term:
      id: GO:0019062
      label: virion attachment to host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        gpU folds the C-terminal receptor-binding tip of the gpS(+) tail fiber
        and, by homology to lambda Tfa, may remain bound to the distal tail
        fiber to participate in host receptor binding.
      action: KEEP_AS_NON_CORE
      reason: >-
        The primary, well-established role of gpU is serving as a tail fiber
        assembly chaperone (GO:0098004). Although its C-terminal homology to Ur-lambda
        Tfa suggests it may also remain associated with the virion tail fiber and
        contribute to host adsorption, virion mass spectrometry (PMID:35458408)
        did not detect gpU in mature P1 virions, making direct participation in
        virion attachment secondary to its chaperone function.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            Whereas the C-terminal region of λ Tfa is not homologous to that of T4 gp38, it is homologous to those of P1 gpU and P1 gpU′. It is thus likely that the gpU and gpU′ proteins of P1, like λ Tfa, can function as both tail fiber assembly chaperones and virion components.
  - term:
      id: GO:0030430
      label: host cell cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: >-
        gpU is synthesized in the infected host cell cytoplasm during late viral
        gene expression to chaperone tail fiber assembly.
      action: ACCEPT
      reason: >-
        Tail fiber assembly occurs in the host bacterial cytoplasm during late
        lytic phage development, where gpU acts on nascent gpS(+) polypeptides.
      supported_by:
        - reference_id: file:BPP1/U/U-uniprot.txt
          supporting_text: >-
            CC   -!- SUBCELLULAR LOCATION: Virion. Host cytoplasm. Note=Tail fiber.
