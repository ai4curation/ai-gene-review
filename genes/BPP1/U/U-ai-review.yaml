suggested_questions:
  - question: >-
      Does P1 gpU remain stoichiometrically bound to the C-terminal tip of
      mature gpS(+) tail fibers on infectious virions, or is it released after
      catalyzing gpS trimerization?
    experts:
      - Malgorzata B. Lobocka
      - Jason J. Gill
suggested_experiments:
  - description: >-
      Co-express His-tagged gpS(C+) with untagged gpU in E. coli, purify folded
      tail fibers, and determine whether gpU co-purifies with the mature trimer
      and binds E. coli K-12 LPS.
    hypothesis: >-
      gpU is essential to prevent gpS(+) aggregation during trimerization and
      caps the distal C-terminal receptor-binding domain.
    experiment_type: Recombinant co-expression, size-exclusion chromatography, and LPS binding assay
