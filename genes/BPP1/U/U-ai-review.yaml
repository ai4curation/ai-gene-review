  - term:
      id: GO:0098004
      label: virus tail fiber assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        gpU is the cognate tail fiber assembly chaperone for the C(+) variant of
        the P1 tail fiber protein gpS.
      action: ACCEPT
      reason: >-
        Supported by 95% sequence identity to phage Mu gpU and homology to T4
        gp38 and lambda Tfa tail fiber assembly chaperones, as well as
        co-expression with the Sv tail fiber variant in the R-S-U operon.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            P1 gpU and gpU′ appear to be 95% identical to their Mu-encoded counterparts and have informative homologies to certain tail fiber assembly proteins of other phages, including gp38 of T4, λ Tfa, and the Tfa protein of a wild strain of λ with tail fibers (Ur-λ) ( 133 ).
        - reference_id: PMID:15489417
          supporting_text: >-
            It is thus likely that the gpU and gpU′ proteins of P1, like λ Tfa, can function as both tail fiber assembly chaperones and virion components.
  - term:
      id: GO:0098678
      label: viral tropism switching
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Keyword-derived annotation reflecting that U and U' are encoded within
        the invertible C segment that switches phage host range.
      action: REMOVE
      reason: >-
        The DNA inversion reaction that switches viral tropism is catalyzed by
        the site-specific recombinase Cin acting on cix sites, whereas U and U'
        are the alternatively expressed effector proteins encoded within the
        invertible C segment and do not themselves perform the tropism-switching
        recombination step.
  - term:
