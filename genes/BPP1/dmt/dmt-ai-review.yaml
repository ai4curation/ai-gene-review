id: Q71TL0
gene_symbol: dmt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Lytic DNA N6-adenine methyltransferase Dmt (Dam homolog; 754 amino acids) of
  Escherichia phage P1 that methylates the N6 position of adenine within
  5'-GATC-3' sequences (including the seven 5'-GATC-3' sites in the 162-bp pac
  packaging site) during late lytic development. Transcribed late under the
  control of Lpa, Dmt ensures full adenine methylation of nascent rolling-circle
  concatemeric P1 DNA—which is strictly required for pac cleavage and headful
  genome packaging by the PacAB terminase complex—and enables P1 propagation in
  dam-deficient host bacteria.
