existing_annotations:
  - term:
      id: GO:0003676
      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: >-
        Broad nucleic acid binding annotation; Dmt specifically binds DNA to
        methylate 5'-GATC-3' sites.
      action: MODIFY
      reason: >-
        Nucleic acid binding (GO:0003676) is overly general for a DNA
        methyltransferase; DNA binding (GO:0003677) is more specific.
      proposed_replacement_terms:
        - id: GO:0003677
          label: DNA binding
      supported_by:
        - reference_id: PMID:2236019
          supporting_text: >-
            We have previously shown that pac is a 162-base-pair segment of P1 DNA that contains seven DNA adenine methyltransferase methylation sites (5'-GATC). We show here that cleavage of pac is methylation sensitive. Both in vivo and in vitro experiments indicate that methylated pac is cleavable, whereas unmethylated pac is not.
