  - term:
      id: GO:0009307
      label: DNA restriction-modification system
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: >-
        InterPro-derived annotation from DNA methyltransferase domain families;
        however, Dmt is an orphan Dam-like lytic methyltransferase that
        regulates pac site cleavage rather than part of a restriction-modification
        system.
      action: REMOVE
      reason: >-
        Unlike the P1 EcoPI Mod-Res type III restriction-modification system,
        Dmt has no cognate restriction endonuclease partner; it is an orphan
        Dam-like 5'-GATC-3' methyltransferase expressed late in lytic infection
        to license pac site cleavage for viral DNA packaging (PMID:2236019,
        PMID:15489417).
