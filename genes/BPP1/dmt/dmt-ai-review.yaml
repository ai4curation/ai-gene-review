  - term:
      id: GO:0019073
      label: viral DNA genome packaging
    evidence_type: IMP
    original_reference_id: PMID:2236019
    review:
      summary: >-
        Dmt-catalyzed adenine methylation of the seven 5'-GATC-3' sites within
        the P1 pac site is required to license pac cleavage by the PacAB
        terminase and initiate viral DNA genome packaging in dam-deficient hosts
        and during late rolling-circle replication.
      action: NEW
      reason: >-
        Both in vivo and in vitro experiments (PMID:2236019, PMID:15489417)
        establish that pac site cleavage and subsequent genome packaging require
        adenine methylation of the pac 5'-GATC-3' motifs, which is catalyzed
        late in lytic development by the phage-encoded Dmt methyltransferase.
      supported_by:
        - reference_id: PMID:2236019
          supporting_text: >-
            We have previously shown that pac is a 162-base-pair segment of P1 DNA that contains seven DNA adenine methyltransferase methylation sites (5'-GATC). We show here that cleavage of pac is methylation sensitive. Both in vivo and in vitro experiments indicate that methylated pac is cleavable, whereas unmethylated pac is not.
        - reference_id: PMID:15489417
          supporting_text: >-
            The late expression of dmt could switch pacase function from nonselective sequestration of pac sites to selective cutting of those pac sites that are newly generated and able to become fully methylated.
core_functions:
  - description: >-
      Catalyzes S-adenosyl-L-methionine-dependent N6-adenine methylation of
      5'-GATC-3' sequences within the bacteriophage P1 packaging site (pac)
      during late lytic development, licensing site-specific pac cleavage by the
      PacAB terminase complex to initiate viral DNA genome packaging.
    molecular_function:
      id: GO:0009007
      label: site-specific DNA-methyltransferase (adenine-specific) activity
    directly_involved_in:
      - id: GO:0019073
        label: viral DNA genome packaging
    supported_by:
      - reference_id: PMID:2236019
        supporting_text: >-
          We have previously shown that pac is a 162-base-pair segment of P1 DNA that contains seven DNA adenine methyltransferase methylation sites (5'-GATC). We show here that cleavage of pac is methylation sensitive. Both in vivo and in vitro experiments indicate that methylated pac is cleavable, whereas unmethylated pac is not.
      - reference_id: PMID:15489417
        supporting_text: >-
          Cleavages within the pac site are distributed over 13 bp, which are flanked on each side by four similarly oriented hexanucleotide elements (5′-TGATCA/G) ( 298 ). These sites are substrates for adenine methylation by the bacterial and viral methyltransferases Dam and Dmt, respectively.
      - reference_id: PMID:15489417
        supporting_text: >-
          The late expression of dmt could switch pacase function from nonselective sequestration of pac sites to selective cutting of those pac sites that are newly generated and able to become fully methylated.
suggested_questions:
  - question: >-
      What is the biological function of the N-terminal C5-cytosine
      methyltransferase-like domain (residues 4-469) fused to the C-terminal
      D12 class N6-adenine methyltransferase domain in the 754-residue P1 Dmt
      polypeptide?
    experts:
      - Malgorzata B. Lobocka
      - Desirazu N. Rao
      - Richard J. Roberts
suggested_experiments:
  - description: >-
      Purify full-length P1 Dmt (Q71TL0) and its isolated N-terminal (1-470) and
      C-terminal (471-754) domains and assay methylation of 5'-GATC-3' and
      cytosine-containing P1 DNA substrates using [3H]-AdoMet and bisulfite/SMRT
      sequencing.
    hypothesis: >-
      The C-terminal D12 domain catalyzes N6-adenine methylation at 5'-GATC-3'
      sites within pac, while the N-terminal C5-MTase-like domain either
      provides a second methylation specificity or allosterically regulates
      substrate recognition.
    experiment_type: Domain dissection, radiometric methyltransferase assays, and PacBio SMRT methylome sequencing
