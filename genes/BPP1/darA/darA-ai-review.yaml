        supporting_text: >-
          Here we show that this protection against restriction is due to the products of two phage genes which we call darA and darB (dar for defense against restriction). Each of the dar gene products provides protection against a different subset of type I restriction systems. The darA and darB gene products are found in the phage head and protect any DNA packaged into a phage head, including transduced chromosomal markers, from restriction. The proteins must, therefore, be injected into recipient cells along with the DNA.
      - reference_id: PMID:28509398
        supporting_text: >-
          Proteomic analysis of purified virions suggests that packaging of antirestriction components into P1 virions follows a distinct pathway that begins with the incorporation of DarA and Hdf and concludes with DarB and Ulx. Electron microscopy analysis showed that hdf and darA mutants also produce abnormally high proportions of virions with aberrant small heads, which suggests Hdf and DarA play a role in capsid morphogenesis.
suggested_questions:
  - question: >-
      How does DarA physically shield injected DNA in cis from type I
      restriction enzymes (e.g., EcoA) after ejection through the tail tube?
    experts:
      - Jason J. Gill
      - Ry Young
      - Malgorzata B. Lobocka
suggested_experiments:
  - description: >-
      Reconstitute purified mature DarA with unmethylated DNA substrates and
      purified EcoA/EcoKI type I restriction-modification complexes in vitro.
    hypothesis: >-
      DarA coats or bridges injected DNA molecules in cis and sterically blocks
      ATP-dependent DNA translocation or cleavage by type I restriction enzymes.
    experiment_type: In vitro DNA binding, translocation block, and restriction protection assays
