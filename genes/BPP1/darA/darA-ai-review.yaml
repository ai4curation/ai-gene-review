existing_annotations:
  - term:
      id: GO:0019028
      label: viral capsid
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Proteolytically processed DarA is an internal structural component of
        the phage P1 head (capsid).
      action: ACCEPT
      reason: >-
        Purified virion analysis, SDS-PAGE of heads versus tails, and LC-MS/MS
        proteomics demonstrate that mature DarA is a major internal protein of
        the P1 capsid (~80 copies per virion).
      supported_by:
        - reference_id: PMID:3029955
          supporting_text: >-
            The protein is made as a high-molecular-weight soluble precursor. This is proteolytically cleaved to the mature form, which is a structural component of the phage head.
        - reference_id: PMID:35458408
          supporting_text: >-
            Nine proteins were assigned to the P1 head, including the major capsid gp23, portal (Prt), and the six proteins that comprise the P1 Dar system (Table 1).
