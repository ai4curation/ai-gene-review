  - term:
      id: GO:0019069
      label: viral capsid assembly
    evidence_type: IDA
    original_reference_id: PMID:28509398
    review:
      summary: >-
        DarA and Hdf are incorporated early into the procapsid, initiate the
        ordered assembly of the internal Dar complex, and regulate capsid
        isometric size determination (vad phenotype).
      action: ACCEPT
      reason: >-
        Electron microscopy and proteomic analysis of darA mutants show that
        loss of DarA abolishes incorporation of Hdf, DarB, DdrB, and Ulx and
        causes an abnormally high proportion of virions with aberrant small
        heads.
      supported_by:
        - reference_id: PMID:28509398
          supporting_text: >-
            Proteomic analysis of purified virions suggests that packaging of antirestriction components into P1 virions follows a distinct pathway that begins with the incorporation of DarA and Hdf and concludes with DarB and Ulx. Electron microscopy analysis showed that hdf and darA mutants also produce abnormally high proportions of virions with aberrant small heads, which suggests Hdf and DarA play a role in capsid morphogenesis.
