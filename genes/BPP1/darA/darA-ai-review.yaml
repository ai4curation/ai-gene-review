  - term:
      id: GO:0099018
      label: symbiont-mediated evasion of host restriction-modification system
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        DarA is injected with the viral genome into the host cell and protects
        packaged DNA in cis from cleavage by host type I restriction
        endonucleases.
      action: ACCEPT
      reason: >-
        Consistent with experimental evidence (PMID:3029954, PMID:28509398)
        showing that DarA protects infecting P1 DNA from host type I
        restriction-modification systems and is required for packaging the full
        Dar antirestriction complex into the capsid.
      supported_by:
        - reference_id: PMID:3029954
          supporting_text: >-
            Here we show that this protection against restriction is due to the products of two phage genes which we call darA and darB (dar for defense against restriction). Each of the dar gene products provides protection against a different subset of type I restriction systems. The darA and darB gene products are found in the phage head and protect any DNA packaged into a phage head, including transduced chromosomal markers, from restriction. The proteins must, therefore, be injected into recipient cells along with the DNA.
