core_functions:
  - description: >-
      Serves as an internal capsid scaffold and antirestriction effector that
      directs normal big-head capsid morphogenesis, recruits the DarB/DdrA/DdrB/Ulx
      antirestriction proteins into the procapsid, and is co-injected with viral
      DNA into the host bacterium to protect the genome in cis against host
      type I restriction-modification systems.
