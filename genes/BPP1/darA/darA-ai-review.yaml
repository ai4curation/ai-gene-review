id: O21970
gene_symbol: darA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Internal capsid protein and antirestriction factor DarA (defense against
  restriction protein A) of Escherichia phage P1. Synthesized late in infection
  as a 69.5-kDa soluble precursor and proteolytically processed into a ~60-kDa
  mature form in a pro-dependent manner, DarA is co-dependently incorporated
  with Hdf into the procapsid, where it promotes normal icosahedral head
  morphogenesis (preventing aberrant small head formation), recruits the remaining
  Dar antirestriction components (DarB, DdrA, DdrB, Ulx), and is co-injected
  with packaged DNA into the host cell to protect viral and transduced DNA in
  cis against type I restriction-modification systems (such as EcoA, StySA, and
  EcoKI).
