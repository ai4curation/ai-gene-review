id: P40820
gene_symbol: '9'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Legacy 142-amino-acid sequence entry (annotated as putative protein 9 in an
  early partial sequence downstream of gene 10) that is 100% identical to the
  N-terminal 142 residues of the 397-amino-acid small terminase subunit PacA
  (P28813) of Escherichia phage P1, where the pac cleavage site is embedded
  within the 5' end of the pacA coding sequence.
references:
  - id: PMID:1917870
    title: Bacteriophage P1 gene 10 encodes a trans-activating factor required for late gene expression.
    full_text_unavailable: true
  - id: PMID:1538406
    title: Bacteriophage P1 genes involved in the recognition and cleavage of the phage packaging site (pac).
    full_text_unavailable: true
  - id: PMID:15489417
    title: Genome of bacteriophage P1.
    full_text_unavailable: false
  - id: file:BPP1/9/9-uniprot.txt
    title: UniProtKB flatfile for P40820 (9)
    full_text_unavailable: false
existing_annotations:
  - term:
      id: GO:0003677
      label: DNA binding
    evidence_type: ISS
    original_reference_id: PMID:15489417
    review:
      summary: >-
        P40820 is 100% identical to the N-terminal 142 residues of the small
        terminase subunit PacA (P28813), which recognizes and binds methylated
        pac site DNA.
      action: NEW
      reason: >-
        Sequence alignment confirms that P40820 (putative protein 9) is a
        3'-truncated N-terminal sequence entry corresponding to residues 1-142
        of P1 PacA (P28813), the DNA-binding subunit of the P1 pacase complex.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            The PacA subunit recognizes and binds to methylated pac sites independently of PacB but requires a host factor to do so ( 287 ).
  - term:
      id: GO:0019073
      label: viral DNA genome packaging
    evidence_type: ISS
    original_reference_id: PMID:1538406
    review:
      summary: >-
        Represents the N-terminal region of the PacA small terminase subunit
        required for pac site recognition and cleavage during viral DNA genome
        packaging.
      action: NEW
      reason: >-
        P40820 encodes residues 1-142 of PacA (P28813), which contains the
        embedded pac site and functions with PacB to initiate viral DNA genome
        packaging.
      supported_by:
        - reference_id: PMID:1538406
          supporting_text: >-
            Thus, PacA and PacB are two essential bacteriophage proteins required for recognition and cleavage of the P1 packaging site.
core_functions:
  - description: >-
      Represents the N-terminal 142-amino-acid region of the bacteriophage P1
      small terminase (pacase) subunit PacA (P28813), which binds methylated
      pac DNA to initiate viral DNA genome packaging.
    molecular_function:
      id: GO:0003677
      label: DNA binding
    directly_involved_in:
      - id: GO:0019073
        label: viral DNA genome packaging
    supported_by:
      - reference_id: PMID:1538406
        supporting_text: >-
          Thus, PacA and PacB are two essential bacteriophage proteins required for recognition and cleavage of the P1 packaging site.
      - reference_id: PMID:15489417
        supporting_text: >-
          The site, pac , at which each concatemeric P1 DNA is cut to be packaged into a prohead lies just within the pacA gene, encoding one of the two subunits of the pacase enzyme ( 286 ).
suggested_questions:
  - question: >-
      Should UniProt entry P40820 (putative protein 9) be merged into P28813
      (PacA), given that its 142-amino-acid sequence is 100% identical to
      residues 1-142 of PacA and derives from a truncated 3' sequence fragment
      downstream of lpa (gene 10)?
    experts:
      - Malgorzata B. Lobocka
      - UniProtKB Curation Team
suggested_experiments:
  - description: >-
      Perform sequence database reconciliation between EMBL X59745 (PMID:1917870),
      M86637 (PMID:1538406), and the complete P1 genome AF234172 (PMID:15489417).
    hypothesis: >-
      Putative protein 9 (P40820) is an artifactual 3'-truncated ORF fragment of
      pacA (P28813) and does not represent an independent gene in phage P1.
    experiment_type: Comparative genomic and database curation analysis
