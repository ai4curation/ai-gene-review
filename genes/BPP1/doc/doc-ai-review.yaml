- term:
    id: GO:0044696
    label: killing by virus of host cell by post-segregational killing
  evidence_type: IMP
  original_reference_id: PMID:11222604
  qualifier: involved_in
  review:
    summary: >-
      CACAO IMP row for the defining phenotype of this gene. GO:0044696 was written for
      exactly this phenomenon - its definition describes a two-gene extrachromosomal module
      whose long-lived toxic product kills daughter cells that lose the viral DNA - and Doc
      is the toxic product in question.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene: Hazan et al. work with the P1 phd-doc module and
      its post-segregational killing of plasmid-free cells, and show that this killing
      requires the host mazEF system, so the phenotype itself is assayed with doc present
      and the readout is cell death on prophage loss. The term is not a downstream
      phenotype misread as a process: post-segregational killing is the biological process
      Doc evolved to execute, and Doc performs the committed step in it by phosphorylating
      EF-Tu and shutting down host translation, which satisfies the participation test. It
      is also at the right granularity - more specific than its parent killing by virus of
      host cell, and the most specific term GO offers. The cached record is abstract-only
      and GONUTS is offline, so figure-level checking was impossible, but the claim is
      independently established in the founding paper for this gene, which named doc for
      death on curing. GO:0044696 is a host-directed term, so the "own-process term for a
      host-directed activity" failure shape catalogued for phage proteins does not apply.
      Accepted as a core process.
    supported_by:
    - reference_id: PMID:11222604
      supporting_text: The extrachromosomal addiction module phd-doc, located on the P1
        prophage, is responsible for the postsegregational killing effect (death of
        plasmid-free cells).
    - reference_id: PMID:8411153
