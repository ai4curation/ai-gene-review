suggested_questions:
- question: Does the reverse dephosphorylation activity of Doc (converting phospho-EF-Tu
    and ADP/GDP back into active EF-Tu and ATP/GTP) contribute to resuscitation of
    growth-arrested cells when P1 re-infects or Phd synthesis resumes?
suggested_experiments:
- description: Track single-cell recovery kinetics of Doc-arrested E. coli cells after
    pulse induction of Phd alongside intracellular ADP/ATP ratio perturbations and
    time-resolved phospho-EF-Tu immunoblotting.
  hypothesis: Before Phd completely sequesters all free Doc molecules, residual free
    Doc or endogenous host phosphatases dephosphorylate the Thr-382-phosphorylated
    EF-Tu pool to allow rapid translation restart.
