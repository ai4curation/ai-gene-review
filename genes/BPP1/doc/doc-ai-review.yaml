- id: PMID:18398006
  title: Bacterial addiction module toxin Doc inhibits translation elongation through its
    association with the 30S ribosomal subunit.
  findings:
  - statement: >-
      Inducing Doc in E. coli arrests growth and inhibits translation specifically, without
      perturbing transcription or replication.
    supporting_text: Doc expression resulted in rapid cell growth arrest and marked
      inhibition of translation without significant perturbation of transcription or
      replication.
    reference_section_type: ABSTRACT
  - statement: >-
      Unlike the mRNA interferase toxins, Doc does not cleave mRNA; it stabilises polysomes
      and increases mRNA half-life.
    supporting_text: However, Doc did not cleave mRNA as do other addiction-module toxins
      whose activities result in translation inhibition.
    reference_section_type: ABSTRACT
  - statement: >-
      Doc was proposed to act by binding the 30S ribosomal subunit at the hygromycin B site
      in helix 44, blocking elongation non-catalytically.
    supporting_text: Doc toxicity is the result of inhibition of translation elongation,
      possibly at the translocation step, through its interaction with the 30S ribosomal
      subunit.
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:24141193
      - PMID:24448800
      review_notes: >-
        The mechanistic model, not the phenotype, has been overturned. In a reconstituted
        system Doc had little effect when added to ribosomes before initiation or to
        preformed ternary complexes, and the authors of the later work attribute the
        reported Doc-ribosome co-purification to indirect association through EF-Tu. The
        same laboratory that proposed the 30S model published the kinase mechanism in
        PMID:24448800. The translation-inhibition findings above stand and remain
        curatable; this one should not be curated from.
      supported_by:
      - reference_id: PMID:24141193
        supporting_text: Co-purification of Doc with ribosomes as found in an earlier
          study13 is likely caused by association of Doc with ribosomes through EF-Tu.
      - reference_id: PMID:24141193
        supporting_text: These results indicated that Doc does not interfere with tRNA
          binding to ribosomes, as was suggested earlier13 but rather inhibits formation of
          the ternary tRNA:EF-Tu:GTP complex.
      - reference_id: PMID:24141193
        supporting_text: Inhibition of translation by Doc is the direct result of
          phosphorylation of the translation elongation factor EF-Tu without the involvement
          of the ribosome itself or of any other player of the translation machinery.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Cached record is abstract-only. Correctly cited and the right paper for the gene; the
      in vivo translation-inhibition data it reports are sound and underpin the accepted
      GO:0039604 IDA row. Marked DISPUTED because its headline mechanism (30S occlusion,
      which is in the title) was refuted five years later; the per-finding detail is in the
      finding_review above.
- id: PMID:18757857
  title: Doc of prophage P1 is inhibited by its antitoxin partner Phd through fold
