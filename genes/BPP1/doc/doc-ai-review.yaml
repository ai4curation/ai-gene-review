id: Q06259
gene_symbol: doc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Toxin protein Doc (126 amino acids, 13.6 kDa; "death on curing") of the
  bacteriophage P1 phd-doc Type II plasmid addiction system. Adopts an incomplete
  Fic-like alpha-helical bundle fold that binds ATP or GTP in an inverted orientation
  and acts as a protein threonine kinase, specifically phosphorylating host translation
  elongation factor EF-Tu at Thr-382 to prevent aminoacyl-tRNA binding and arrest
  host translation in plasmid-free daughter cells. In P1-containing cells, Doc is
  neutralized by fold complementation with the C-terminal helix of the antitoxin Phd
  and functions as a non-DNA-binding transcriptional corepressor that bridges two
  operator-bound Phd dimers to mediate conditional cooperativity at the phd-doc promoter.
