- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: >-
      Projection of UniProt keyword KW-0238 (DNA-binding), which the Q06259 entry carries
      alongside the Repressor keyword because Doc autoregulates the phd/doc operon. The
      experimental literature shows the opposite: Doc regulates transcription without
      touching DNA, and the DNA-binding domain in the complex belongs to Phd.
    action: REMOVE
    reason: >-
      This is an electronic keyword mapping that the primary literature directly refutes,
      which is the sanctioned ground for REMOVE. Magnuson and Yarmolinsky tested DNA
      binding by the non-toxic but regulation-competent DocH66Y protein and found none,
      while the same protein strongly enhanced Phd's operator binding; Doc enters the
      protein-DNA complex (supershift) but contributes no DNA contact of its own. The
      structural work makes the division explicit: Doc binds the intrinsically disordered
      C-terminal domain of Phd and thereby orders Phd's N-terminal DNA-binding domain. Doc
      has only a Fido domain (PROSITE PS51459) and no recognisable DNA-binding motif.
      Comparator: in GOA, Phd (UniProtKB:Q06253) carries GO:0003677 by IDA from
      PMID:20603017, which is where the activity actually sits. The regulatory role is not
      lost by this removal - it is recaptured by the proposed GO:0003714 and GO:0045892
      rows below.
    supported_by:
    - reference_id: PMID:9829946
      supporting_text: DocH66Y failed to bind DNA in vitro yet enhanced the affinity,
        cooperativity, and specificity with which Phd bound the operator.
    - reference_id: PMID:20603017
      supporting_text: The binding of Doc to the intrinsically disordered C-terminal domain
        of Phd structures its N-terminal DNA-binding domain
