- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:24448800
  qualifier: enables
  review:
    summary: >-
      CACAO IDA row, and the central molecular function of this protein. Cruz et al. 2014
      showed by direct in vitro assay that Doc transfers the gamma-phosphate of ATP to a
      single E. coli protein, identified as EF-Tu, at Thr-382.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene, assay by assay. In a defined coupled
      transcription/translation system Doc gave no signal with alpha-32P-ATP but a strong
      single band just above 40 kDa with gamma-32P-ATP (Fig. 2, A and B) - i.e. phosphate
      transfer, not adenylylation. The band was abolished by the Fic-motif mutant H66Y and
      by preincubation with the antitoxin Phd, excluding a contaminating kinase (Fig. 2B,
      Fig. 3A). The target was identified as recombinant EF-Tu (Fig. 3A), confirmed as the
      only Doc substrate in whole-cell lysate (Fig. 2C), and release of alpha-32P-ADP was
      shown by TLC (Fig. 3B). MS/MS at 100% coverage gave a single site, Thr-382, and the
      T382A mutant was not phosphorylated (Fig. 6). Castro-Roa et al. reached the same
      conclusion independently in the same year. The CACAO term matches this result: it is
      not too downstream (the assay is the catalytic activity itself), the evidence code
      fits a direct in vitro assay, and GO:0004674 is the most specific existing GO term -
      GO has no "protein threonine kinase activity" term (see proposed_new_terms), so the
      serine/threonine parent is as precise as the ontology allows. Accepted as the core
      molecular function.
    supported_by:
    - reference_id: PMID:24448800
      supporting_text: potent phosphorylation of a single product migrating just above 40
        kDa was observed, indicating that Doc is in fact a kinase
    - reference_id: PMID:24448800
      supporting_text: Sample analysis resulted in 100% protein coverage and yielded a
        single EF-Tu phosphorylation site in this Doc-treated sample at Thr-382
    - reference_id: PMID:24448800
      supporting_text: we demonstrated that Doc was unable to phosphorylate a T382A EF-Tu
        mutant
    - reference_id: PMID:24141193
      supporting_text: Doc is a new type of kinase that inhibits bacterial translation by
        phosphorylating the conserved threonine (Thr382) of the translation elongation
        factor EF-Tu, rendering EF-Tu unable to bind aminoacylated tRNAs
