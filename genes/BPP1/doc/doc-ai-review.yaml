- term:
    id: GO:0039604
    label: symbiont-mediated suppression of host translation
  evidence_type: IDA
  original_reference_id: PMID:18398006
  qualifier: involved_in
  review:
    summary: >-
      CACAO IDA row. Liu et al. 2008 induced Doc in E. coli and measured a rapid arrest of
      growth with marked inhibition of translation, no perturbation of transcription or
      replication, stabilised polysomes and a large increase in mRNA half-life. The term
      matches that outcome exactly.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene: after Doc induction protein synthesis shuts down
      while transcription and replication continue, so the block is specific to
      translation; polysomes are stabilised rather than running off, placing the block at
      elongation; mRNA half-life rises substantially; and no mRNA cleavage occurs,
      distinguishing Doc from the RNase toxins. E. coli is the host of this phage and Doc
      is the phage-encoded symbiont protein, so GO:0039604 (a symbiont inhibiting or
      disrupting the translation of host mRNA into protein) is the right branch and the
      right granularity - neither a downstream phenotype read as a process nor a
      parent-level restatement. One caveat does not change the action: this paper's
      mechanistic model, direct occlusion of the 30S subunit at the hygromycin B site, was
      overturned in 2013-2014 (recorded as a finding_review on this reference). GO:0039604
      asserts the outcome and not the mechanism, so the term stands while the explanation
      has changed. The cached record is abstract-only and the GONUTS page that would show
      the student's reading is offline, so figure-level checking was not possible; the
      abstract states the annotated claim directly. Accepted as a core process.
    supported_by:
    - reference_id: PMID:18398006
      supporting_text: Doc expression resulted in rapid cell growth arrest and marked
        inhibition of translation without significant perturbation of transcription or
        replication.
    - reference_id: PMID:18398006
      supporting_text: However, Doc did not cleave mRNA as do other addiction-module toxins
        whose activities result in translation inhibition.
    - reference_id: PMID:24141193
      supporting_text: Inhibition of translation by Doc is the direct result of
        phosphorylation of the translation elongation factor EF-Tu without the involvement
        of the ribosome itself or of any other player of the translation machinery.
