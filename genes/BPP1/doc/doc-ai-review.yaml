id: Q06259
gene_symbol: doc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Doc ("death on curing") is the 126-residue toxin of the phd/doc type II toxin-antitoxin
  module carried by bacteriophage P1, which lysogenises Escherichia coli as a single-copy
  plasmid prophage. It consists of a single Fido (Fic/Doc) domain whose Fic motif is
  degenerate relative to the canonical AMPylating motif, and this degeneracy makes it a
  protein kinase rather than an adenylyltransferase: in the host cytoplasm Doc transfers
  the gamma-phosphate of ATP or GTP onto a single conserved threonine (Thr-382 of mature
  E. coli EF-Tu, Thr-383 in UniProt numbering) in domain 3 of the translation elongation
  factor EF-Tu. The modified EF-Tu can no longer form the ternary aminoacyl-tRNA:EF-Tu:GTP
  complex, so elongation halts, polysomes and mRNA are stabilised, and the bacterium
  arrests growth and dies. The same active site runs in reverse when ADP or GDP
  accumulates, removing the phosphate, which may allow return from dormancy. Doc acts once
  its cognate antitoxin Phd, which is labile and degraded by host ClpXP, disappears: loss
  of the P1 prophage therefore kills the plasmid-free daughter cell, the post-segregational
  killing that stabilises the prophage in the population. Doc has a second, mechanistically
  separate role in autoregulating its own operon. It does not bind DNA; instead monomeric
  Doc bridges two Phd dimers and orders Phd's intrinsically disordered C-terminal domain,
  which in turn structures Phd's N-terminal DNA-binding domain, deepening repression at
  low Doc:Phd ratios and derepressing the operon when Doc accumulates (conditional
  cooperativity).
