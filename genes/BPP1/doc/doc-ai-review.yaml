- id: PMID:8411153
  title: 'Plasmid addiction genes of bacteriophage P1: doc, which causes cell death
    on curing of prophage, and phd, which prevents host death when prophage is retained.'
  findings:
  - statement: Doc is the 126-aa toxin of the P1 plasmid addiction locus that causes
      death of cured cells when not neutralized by the 73-aa antitoxin Phd.
    supporting_text: "The plasmid withdrawal response depends on a gene named doc (death on curing), encoding a 126 amino acid protein. Expression of doc is not SOS-inducing and killing by Doc is recA-independent. In cells that retain P1 the killing is prevented by the product of a gene named phd (prevent host death), encoding a 73 amino acid protein."
- id: PMID:9829946
  title: Corepression of the P1 addiction operon by Phd and Doc.
  findings:
  - statement: Doc is not a repressor on its own, but acts as a corepressor that enhances
      repression by binding Phd and mediating cooperative interactions between adjacent
      Phd-binding sites.
    supporting_text: "We found that Doc is not a repressor in its own right but enhances repression by binding to Phd and mediating cooperative interactions between adjacent Phd-binding sites."
- id: PMID:11222604
  title: Postsegregational killing mediated by the P1 phage "addiction module" phd-doc
    requires the Escherichia coli programmed cell death system mazEF.
  findings:
  - statement: Post-segregational activation of the phd-doc module inhibits host E.
      coli protein synthesis and kills plasmid-free cells.
    supporting_text: "The extrachromosomal addiction module phd-doc, located on the P1 prophage, is responsible for the postsegregational killing effect (death of plasmid-free cells)."
- id: PMID:18398006
  title: Bacterial addiction module toxin Doc inhibits translation elongation through
    its association with the 30S ribosomal subunit.
  findings:
  - statement: Induction of Doc causes rapid inhibition of bacterial translation without
      directly perturbing transcription or DNA replication.
    supporting_text: "Doc expression resulted in rapid cell growth arrest and marked inhibition of translation without significant perturbation of transcription or replication."
- id: PMID:18757857
  title: Doc of prophage P1 is inhibited by its antitoxin partner Phd through fold
    complementation.
  findings:
  - statement: Doc adopts an incomplete Fic-like fold that is complemented by binding
      the C-terminal amphipathic alpha-helix of Phd.
    supporting_text: "The toxin Doc (death on curing) from the phd/doc module on phage P1 hosts the C-terminal domain of its antitoxin partner Phd (prevents host death) through fold complementation. This Phd domain is intrinsically disordered in solution and folds into an alpha-helix upon binding to Doc."
- id: PMID:20603017
  title: Allostery and intrinsic disorder mediate transcription regulation by conditional
    cooperativity.
  findings:
  - statement: Monomeric Doc engages two Phd dimers on two unrelated binding sites
      to form a cooperative repressor complex on the phd-doc operator.
    supporting_text: "Here we show that monomeric Doc engages two Phd dimers on two unrelated binding sites."
- id: PMID:24141193
  title: The Fic protein Doc uses an inverted substrate to phosphorylate and inactivate
    EF-Tu.
  findings:
  - statement: Doc is a Fic-fold protein kinase that binds NTPs in an inverted orientation
      to phosphorylate EF-Tu exclusively on Thr-382, abolishing aminoacyl-tRNA binding.
    supporting_text: "Here we show that, in contrast to having AMPylating activity, Doc is a new type of kinase that inhibits bacterial translation by phosphorylating the conserved threonine (Thr382) of the translation elongation factor EF-Tu, rendering EF-Tu unable to bind aminoacylated tRNAs."
- id: PMID:24448800
  title: Doc toxin is a kinase that inactivates elongation factor Tu.
  findings:
  - statement: Mass spectrometry across the E. coli proteome shows that Doc transfers
      a single phosphate group to EF-Tu exclusively at Thr-382.
    supporting_text: "We demonstrated that P1 Doc added a single phosphate group to the essential translation elongation factor and GTPase, elongation factor (EF)-Tu. The phosphorylation site was at a highly conserved threonine, Thr-382, which was blocked when EF-Tu was treated with the antibiotic kirromycin."
