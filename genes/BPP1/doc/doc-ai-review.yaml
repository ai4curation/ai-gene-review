- id: PMID:20603017
  title: Allostery and intrinsic disorder mediate transcription regulation by conditional
    cooperativity.
  findings:
  - statement: >-
      Monomeric Doc engages two Phd dimers at two unrelated binding sites.
    supporting_text: Here we show that monomeric Doc engages two Phd dimers on two unrelated
      binding sites.
    reference_section_type: ABSTRACT
  - statement: >-
      Doc's binding to Phd's intrinsically disordered C-terminal domain orders that domain
      and thereby structures Phd's N-terminal DNA-binding domain - the allosteric basis of
      corepression, and the reason the DNA-binding function belongs to Phd and not to Doc.
    supporting_text: The binding of Doc to the intrinsically disordered C-terminal domain of
      Phd structures its N-terminal DNA-binding domain
    reference_section_type: ABSTRACT
  - statement: >-
      Rising Doc tightens repression up to the point where toxin accumulation triggers Phd
      production, which is the conditional cooperativity switch.
    supporting_text: In this way, higher levels of Doc tighten repression up to a point
      where the accumulation of toxin triggers the production of Phd to counteract its
      action.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, but the abstract states the structural conclusions
      used here explicitly. PubMed-verified; the companion IntAct row (Doc-Phd) cites this
      paper correctly, and GOA assigns Phd the DNA-binding IDA from the same work, which
      corroborates the reading that Doc supplies no DNA contact.
- id: PMID:24141193
  title: The Fic protein Doc uses an inverted substrate to phosphorylate and inactivate
    EF-Tu.
  findings:
  - statement: >-
      Doc is a protein kinase, not an AMPylating Fic protein, and inhibits translation by
      phosphorylating EF-Tu Thr382 so that EF-Tu can no longer bind aminoacylated tRNA.
    supporting_text: Doc is a new type of kinase that inhibits bacterial translation by
      phosphorylating the conserved threonine (Thr382) of the translation elongation factor
      EF-Tu, rendering EF-Tu unable to bind aminoacylated tRNAs.
    reference_section_type: ABSTRACT
  - statement: >-
      In a reconstituted translation system Doc had little effect on ribosomes or on
      preformed ternary complexes; it acts on free EF-Tu and blocks ternary complex
      formation.
    supporting_text: These results indicated that Doc does not interfere with tRNA binding
      to ribosomes, as was suggested earlier13 but rather inhibits formation of the ternary
      tRNA:EF-Tu:GTP complex.
    reference_section_type: RESULTS
  - statement: >-
      Doc uses either ATP or GTP as phosphate donor and turns over about 20 EF-Tu molecules
      per second.
    supporting_text: We found that Doc phosphorylated EF-Tu (using either ATP or GTP) at a
      relatively high rate of ~20 EF-Tu molecules per second by one molecule of Doc
    reference_section_type: RESULTS
  - statement: >-
      Phd blocks de novo phosphorylation but cannot reverse it; Doc itself reverses the
      modification when ADP or GDP is present, suggesting a route out of dormancy.
    supporting_text: in the presence of ADP or GDP (the levels of which are likely elevated
      during dormancy), the phosphorylation of EF-Tu could be reverted
    reference_section_type: RESULTS
  - statement: >-
      Translation inhibition by Doc requires no component of the translation machinery other
      than EF-Tu, which supersedes the earlier ribosome-occlusion model.
    supporting_text: Inhibition of translation by Doc is the direct result of phosphorylation
      of the translation elongation factor EF-Tu without the involvement of the ribosome
      itself or of any other player of the translation machinery.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Together with PMID:24448800 this is the mechanistic basis
      of the review; the two papers are independent (different laboratories, different
      assays) and agree on the site. It is also the source UniProt cites with ECO:0000269
      for EC 2.7.11.1 on this entry.
- id: PMID:24448800
  title: Doc toxin is a kinase that inactivates elongation factor Tu.
  findings:
  - statement: >-
      Doc transfers the gamma- and not the alpha-phosphate of ATP, so it is a kinase rather
      than an adenylyltransferase; the activity is lost in the Fic-motif mutant H66Y and is
      blocked by Phd.
    supporting_text: potent phosphorylation of a single product migrating just above 40 kDa
      was observed, indicating that Doc is in fact a kinase
    reference_section_type: RESULTS
  - statement: >-
      EF-Tu is the only Doc substrate detectable in E. coli whole-cell lysate.
    supporting_text: EF-Tu is the sole target of Doc toxin.
    reference_section_type: RESULTS
  - statement: >-
      Mass spectrometry at 100% EF-Tu coverage, searched for phosphoserine, phosphothreonine
      and phosphotyrosine, gave a single site, Thr-382, and the T382A mutant is not a
      substrate - so the only demonstrated acceptor residue is a threonine.
    supporting_text: Sample analysis resulted in 100% protein coverage and yielded a single
      EF-Tu phosphorylation site in this Doc-treated sample at Thr-382
    reference_section_type: RESULTS
  - statement: >-
      Kirromycin, which traps EF-Tu on the ribosome and binds near Thr-382, completely
      blocks phosphorylation by Doc.
    supporting_text: We observed complete inhibition of phosphorylation by kirromycin
    reference_section_type: RESULTS
  - statement: >-
      The degenerate Fic motif of the Doc family is what distinguishes these kinases from
      the AMPylating Fic proteins, so Doc-family toxins are predicted to be kinases
      generally.
    supporting_text: By extension, all Doc toxins with this Fic domain are predicted to
      function as kinases as well.
    reference_section_type: DISCUSSION
