- id: PMID:8411153
  title: 'Plasmid addiction genes of bacteriophage P1: doc, which causes cell death on curing
    of prophage, and phd, which prevents host death when prophage is retained.'
  findings:
  - statement: >-
      P1 lysogens maintain the prophage as a low-copy plasmid and lose it at about 1e-5 per
      cell per generation; a plasmid-encoded mechanism kills the cells that lose it.
    supporting_text: Here we show that a significant part of this remarkable stability can
      be attributed to a plasmid-encoded mechanism that causes death of cells that have
      lost P1.
    reference_section_type: ABSTRACT
  - statement: >-
      doc encodes the 126-residue killer and phd the 73-residue protector; the two form an
      operon with translational coupling.
    supporting_text: The two genes constitute an operon and the synthesis of Doc appears to
      be translationally coupled to that of Phd.
    reference_section_type: ABSTRACT
  - statement: >-
      Killing by Doc is independent of the SOS response and of recA.
    supporting_text: Expression of doc is not SOS-inducing and killing by Doc is
      recA-independent.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. PubMed-verified as the founding paper that named doc
      and phd and established post-segregational killing; it is cited here only for claims
      the abstract states explicitly.
- id: PMID:9829946
  title: Corepression of the P1 addiction operon by Phd and Doc.
  findings:
  - statement: >-
      Doc does not bind DNA. The regulation-competent, non-toxic DocH66Y protein failed to
      bind DNA in vitro while strongly enhancing Phd's operator binding.
    supporting_text: DocH66Y failed to bind DNA in vitro yet enhanced the affinity,
      cooperativity, and specificity with which Phd bound the operator.
    reference_section_type: ABSTRACT
  - statement: >-
      Doc deepens Phd-mediated repression of the operon about fourfold in vivo.
    supporting_text: transcription was repressed 40-fold, while in the presence of Phd,
      transcription was repressed only 10-fold, indicating that under these conditions, Doc
      enhanced repression about fourfold.
    reference_section_type: RESULTS
  - statement: >-
      At high Doc levels the regulation inverts and the operon is partially derepressed.
    supporting_text: Strikingly, higher levels of Doc, obtained by adding higher
      concentrations of IPTG, partially derepressed the operon
    reference_section_type: RESULTS
  - statement: >-
      Doc enters the Phd-operator complex, retarding it further, and mediates cooperative
      interaction between the two adjacent Phd-binding sites.
    supporting_text: Mobility of the protein-DNA complex is further retarded in the presence
      of Doc, indicating that Doc may directly participate in the protein-DNA complex
    reference_section_type: INTRODUCTION
  - statement: >-
      Host ClpXP degrades the antidote Phd, which is what liberates Doc in a plasmid-free
      segregant.
    supporting_text: Degradation of antidote by the host-encoded ClpXP protease liberates
      the toxin, which then poisons the plasmid-free segregant
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. This is the paper that separates Doc's regulatory function
      from its toxicity (via docH66Y) and shows directly that Doc does not bind DNA; it is
      the basis for the REMOVE of GO:0003677 and for the two proposed transcription rows.
- id: PMID:11222604
  title: Postsegregational killing mediated by the P1 phage "addiction module" phd-doc
    requires the Escherichia coli programmed cell death system mazEF.
  findings:
  - statement: >-
      Post-segregational killing by the P1 phd-doc module requires the host mazEF system.
    supporting_text: Here we show that the postsegregational killing mediated by the P1
      phd-doc module depends on the presence of the E. coli mazEF system.
    reference_section_type: ABSTRACT
  - statement: >-
      Host protein synthesis is inhibited under phd-doc post-segregational killing
      conditions.
    supporting_text: we demonstrate that under conditions of postsegregational killing,
      mediated by phd-doc, protein synthesis of E. coli is inhibited
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only and the GONUTS page that would show the student's
      figure-level evidence is offline. PubMed-verified as a paper about the P1 phd-doc
