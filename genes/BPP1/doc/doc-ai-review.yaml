- term:
    id: GO:0106310
    label: protein serine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:17989
  review:
    summary: >-
      Rhea-to-GO projection of RHEA:17989, the generic seryl half of EC 2.7.11.1 that
      UniProt lists under CATALYTIC ACTIVITY beside the threonyl reaction RHEA:46608. No
      serine phosphorylation by Doc has ever been observed; the single demonstrated
      acceptor is a threonine.
    action: MODIFY
    reason: >-
      This is a lateral correction, not a refinement: the right acceptor residue is
      threonine, not serine. Cruz et al. searched the EF-Tu phosphopeptides for
      differential modifications of phosphotyrosine, phosphoserine and phosphothreonine at
      100% sequence coverage and recovered one site, Thr-382, with the T382A mutant no
      longer a substrate; Castro-Roa et al. independently identify Thr382. The two UniProt
      CATALYTIC ACTIVITY lines are the generic pair that accompanies EC 2.7.11.1, and only
      RHEA:46608 (threonyl) is backed by data, so the Rhea mapping has projected the
      unsupported half. GO has no "protein threonine kinase activity" term to point at,
      which is an ontology gap rather than a reason to keep the serine claim; the
      replacement is therefore the proposed term below, and the existing GO:0004674 rows
      remain the curatable annotations until GO creates it.
    proposed_replacement_terms:
    - id: NTR
      label: protein threonine kinase activity
    supported_by:
    - reference_id: PMID:24448800
      supporting_text: re-searched with SEQUEST against the EF-Tu sequence without taking
        into account enzyme specificity and with differential modifications of
        phosphorylated tyrosine, serine, and threonine residues
    - reference_id: PMID:24448800
      supporting_text: Sample analysis resulted in 100% protein coverage and yielded a
        single EF-Tu phosphorylation site in this Doc-treated sample at Thr-382
    - reference_id: PMID:24448800
      supporting_text: Doc is a kinase that inactivates EF-Tu at a highly conserved
        threonine at the C-terminal end
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q06259
      slot: CC:CATALYTIC ACTIVITY
      requested_change: CHECK
      asserted_value: RHEA:17989
      corrected_value: RHEA:46608
      confidence: PROBABLE
      explanation: >-
        Q06259 lists both the seryl (RHEA:17989) and threonyl (RHEA:46608) reactions of
        EC 2.7.11.1 without evidence tags. Only threonine phosphorylation has been
        demonstrated for Doc (PMID:24448800 Fig. 6, PMID:24141193), and the seryl line is
        what GO_REF:0000116 projects to GO:0106310. Asking UniProt to check whether the
        generic seryl reaction belongs on an entry whose single characterised acceptor is
        a threonine.
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IDA
  original_reference_id: PMID:24141193
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Doc uses GTP as phosphate donor as readily as ATP, and GDP
      (like ADP) drives the reverse, dephosphorylating reaction - so GTP binding is a
      demonstrated, mechanistically meaningful capability that GOA does not record.
    action: NEW
    reason: >-
      Castro-Roa et al. state directly that Doc phosphorylated EF-Tu using either ATP or
      GTP, and UniProt's curated FUNCTION line records the same with ECO:0000269. The
      nucleotide promiscuity is not incidental: the triphosphate forms make Doc a kinase
      while the diphosphate forms make it run backwards, so the GTP/GDP side of the site
      is part of the proposed switch between toxicity and recovery. Doc itself is not a
      GTPase - it binds GTP as a cosubstrate - which the term does not imply. ATP binding
      is already annotated; this row completes the pair at the same granularity rather
      than restating it.
    supported_by:
    - reference_id: PMID:24141193
      supporting_text: We found that Doc phosphorylated EF-Tu (using either ATP or GTP) at
        a relatively high rate of ~20 EF-Tu molecules per second by one molecule of Doc
    - reference_id: file:BPP1/doc/doc-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Phosphorylates EF-Tu on 'Thr-383' in vitro; can use ATP or GTP
- term:
    id: GO:0003714
    label: transcription corepressor activity
  evidence_type: IDA
  original_reference_id: PMID:9829946
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation capturing Doc's second, non-catalytic function: it represses
      the phd/doc operon by binding the DNA-binding repressor Phd and increasing Phd's
      affinity, cooperativity and specificity for the operator, without binding DNA itself.
    action: NEW
    reason: >-
      Participation test: Doc does the work. The conformational ordering it imposes on
      Phd's disordered C-terminal domain is what structures Phd's DNA-binding domain and
      what bridges two Phd dimers across the two adjacent operator sites, and Doc remains
      in the resulting protein-DNA complex (further mobility retardation). Repression is
      weaker when Doc is absent and is restored by the catalytically dead DocH66Y, so the
      activity is separable from the kinase activity and is not a knock-on of toxicity.
      GO:0003714 is defined as a coregulator activity exerted by binding a DNA-binding
      transcription factor rather than DNA, which is precisely this arrangement.
      Comparator: GOA gives Phd the DNA-side terms (GO:0003677, GO:0001217 and GO:0045892
      on UniProtKB:Q06253) but gives Doc only a bare protein-binding row for the same
      interaction, so the coregulator half of a two-protein repressor is simply
