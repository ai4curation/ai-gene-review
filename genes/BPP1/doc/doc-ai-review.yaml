- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IDA
  original_reference_id: PMID:9829946
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation for the process side of the corepressor activity: Doc deepens
      repression of the phd/doc promoter about fourfold in vivo in the presence of Phd, and
      point mutations that abolish the regulatory function map to the Doc protein itself.
    action: NEW
    reason: >-
      In vivo reporter assays show transcription repressed 40-fold with Phd plus Doc versus
      10-fold with Phd alone, and DocH66Y - which has no toxicity - reproduces the effect,
      so the readout is regulation rather than a consequence of growth arrest. Point mutants
      L12P, L82P, L84P and L118P lose transcriptional regulatory activity, placing the
      function on Doc. The term is deliberately the negative-regulation term and not a
      bidirectional one even though high Doc:Phd ratios derepress the operon (conditional
      cooperativity): the derepression arises when antitoxin capacity is exceeded and the
      operon has left its homeostatic set point, whereas corepression is the regulatory
      behaviour in the physiological regime where Phd is in excess. The bidirectional case
      is flagged in suggested_questions rather than annotated as a second, opposing arm.
    supported_by:
    - reference_id: PMID:9829946
      supporting_text: transcription was repressed 40-fold, while in the presence of Phd,
        transcription was repressed only 10-fold, indicating that under these conditions,
        Doc enhanced repression about fourfold.
    - reference_id: PMID:9829946
      supporting_text: In addition to acting as antidote and toxin, Phd and Doc collaborate
        to autoregulate transcription of the addiction promoter.
    - reference_id: file:BPP1/doc/doc-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: 'L->P: Loss of toxin and transcriptional regulatory activity.'
core_functions:
- description: >-
    Protein threonine kinase that transfers the gamma-phosphate of ATP or GTP onto Thr-382
    in domain 3 of host elongation factor EF-Tu in the host cytoplasm, preventing formation
    of the aminoacyl-tRNA EF-Tu-GTP ternary complex and thereby arresting translation
    elongation; this is the toxic activity that kills E. coli cells that have lost the P1
    prophage, and it is switched off by the cognate antitoxin Phd.
  supported_by:
  - reference_id: PMID:24448800
    supporting_text: Doc is a protein kinase that blocks translation elongation through
      phosphorylation of Thr-382 of the essential elongation factor EF-Tu
  - reference_id: PMID:24141193
    supporting_text: These results indicated that Doc does not interfere with tRNA binding
      to ribosomes, as was suggested earlier13 but rather inhibits formation of the ternary
      tRNA:EF-Tu:GTP complex.
  - reference_id: PMID:24448800
    supporting_text: preincubation of Doc with Phd prevented labeling of EF-Tu
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0039604
    label: symbiont-mediated suppression of host translation
  - id: GO:0044696
    label: killing by virus of host cell by post-segregational killing
  substrates:
  - id: UniProtKB:P0CE47
    label: tufA
  knowledge_gaps:
  - gap_statement: >-
      It is not known whether any phosphatase reverses EF-Tu Thr-382 phosphorylation in
      vivo, and therefore whether Doc-induced dormancy is reversible in the cell. Doc
      itself removes the phosphate in vitro when ADP or GDP is supplied, but no cellular
      enzyme or condition has been shown to do so, and no phosphatase has been identified.
    boundary: >-
      What is established: Doc phosphorylates EF-Tu Thr-382 with ATP or GTP; the antitoxin
      Phd blocks de novo phosphorylation but cannot reverse it; Doc catalyses the reverse
      reaction in vitro in the presence of 1 mM ADP or GDP, and Phd blocks that too.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    significance: >-
      Whether phd/doc killing is terminal or a reversible dormancy switch depends on this.
      It also bears on the wider question of whether EF-Tu Thr-382 phosphorylation, first
      seen in ribosomal fractions twenty years before Doc was implicated, is a general
      bacterial growth-control modification with its own dedicated kinase and phosphatase.
    resolution: >-
      Identify the phosphatase and test reversibility in vivo (see suggested_experiments).
    provenance:
    - reference_id: PMID:24141193
      supporting_text: in the presence of ADP or GDP (the levels of which are likely
        elevated during dormancy), the phosphorylation of EF-Tu could be reverted
    - reference_id: PMID:24448800
      supporting_text: because the presence of serine/threonine phosphatases has been
        established in many bacteria
  - gap_statement: >-
      Whether EF-Tu is the substrate of Doc-family toxins generally, or only of P1 Doc, is
      unknown; so is whether other family members that do target EF-Tu hit Thr-382 rather
      than the switch I or II regions that canonical Fic proteins modify.
    boundary: >-
      What is established: all Doc-family toxins share the degenerate Fic motif and the
      shortened six-helix fold, and P1 Doc phosphorylates EF-Tu Thr-382 and nothing else
      detectable in E. coli lysate.
    gap_kind:
    - BIOLOGY
    significance: >-
      Doc-family toxins are carried by many bacterial pathogens and are proposed antibiotic
      targets; whether they converge on EF-Tu determines whether that is one target or many.
    resolution: >-
      Kinase assays on purified Doc-family toxins from other taxa against EF-Tu and against
      lysate (see suggested_experiments).
    provenance:
    - reference_id: PMID:24448800
      supporting_text: it is unclear whether the targeting of EF-Tu is unique to this Doc
        toxin or whether this highly effective mechanism of growth control is enlisted by
        all Doc family members
- description: >-
    Non-catalytic transcriptional corepressor of its own phd/doc operon: monomeric Doc
    binds the intrinsically disordered C-terminal domain of two Phd antitoxin dimers,
    ordering it and thereby structuring Phd's N-terminal DNA-binding domain, which
    increases the affinity, cooperativity and specificity with which Phd occupies the two
    adjacent operator sites. Doc contributes no DNA contact of its own and is active in
    this role when catalytically dead.
  supported_by:
  - reference_id: PMID:9829946
    supporting_text: DocH66Y failed to bind DNA in vitro yet enhanced the affinity,
      cooperativity, and specificity with which Phd bound the operator.
  - reference_id: PMID:20603017
    supporting_text: Here we show that monomeric Doc engages two Phd dimers on two
      unrelated binding sites.
  - reference_id: PMID:9829946
    supporting_text: transcription was repressed 40-fold, while in the presence of Phd,
      transcription was repressed only 10-fold, indicating that under these conditions, Doc
      enhanced repression about fourfold.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  knowledge_gaps:
  - gap_statement: >-
      How the cell reads the Doc:Phd ratio is not resolved at the level of operator
      occupancy: the species that derepresses the operon at high Doc has not been
      identified, so it is not known whether derepression reflects Doc saturating both Phd
      binding sites and disassembling the bridge, or a distinct complex with altered
      operator affinity.
    boundary: >-
      What is established: subsaturating Doc relative to Phd gives maximal repression and
      specificity; higher Doc partially derepresses; several electrophoretically distinct
      protein-DNA species form at different Doc:Phd ratios; Doc engages two Phd dimers at
      two unrelated sites.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Conditional cooperativity is a general design feature of type II toxin-antitoxin
      operons, and phd/doc is its structural paradigm; which complex does the derepressing
      is the remaining mechanistic step.
    resolution: >-
      Resolve the stoichiometry of the derepressing species on operator DNA (see
      suggested_experiments).
    provenance:
    - reference_id: PMID:9829946
      supporting_text: Several electrophoretically distinct protein-DNA complexes were
        observed with different amounts of DocH66Y relative to Phd.
    - reference_id: PMID:9829946
      supporting_text: Strikingly, higher levels of Doc, obtained by adding higher
        concentrations of IPTG, partially derepressed the operon
proposed_new_terms:
- proposed_name: protein threonine kinase activity
  proposed_definition: >-
    Catalysis of the reaction ATP + protein L-threonine = ADP + protein
    O-phospho-L-threonine. The threonine-specific counterpart of GO:0106310 protein serine
    kinase activity, with proposed mapping to RHEA:46608.
  justification: >-
    GO has GO:0106310 protein serine kinase activity but no threonine-specific sibling, so
    a kinase whose only demonstrated acceptor is a threonine can be annotated either to the
    serine child (false) or to the GO:0004674 serine/threonine parent (true but less
    specific than the evidence). P1 Doc is a clean case: mass spectrometry at 100% EF-Tu
    coverage, searched for phosphoserine, phosphothreonine and phosphotyrosine, returned a
    single site, Thr-382, and the T382A substrate mutant is not phosphorylated. UniProt
    lists both the seryl (RHEA:17989) and threonyl (RHEA:46608) reactions of EC 2.7.11.1 on
    the entry, and GO_REF:0000116 projects only the seryl one, giving Doc a protein serine
    kinase activity annotation it should not have. The same gap affects other
    threonine-specific kinases and the Rhea mapping of RHEA:46608, which currently has no
    GO term to map to.
  proposed_parent:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  supported_by:
  - reference_id: PMID:24448800
    supporting_text: Sample analysis resulted in 100% protein coverage and yielded a single
      EF-Tu phosphorylation site in this Doc-treated sample at Thr-382
  - reference_id: PMID:24448800
    supporting_text: Doc is a kinase that inactivates EF-Tu at a highly conserved threonine
      at the C-terminal end
  - reference_id: file:BPP1/doc/doc-uniprot.txt
    supporting_text: Reaction=L-threonyl-[protein] + ATP = O-phospho-L-threonyl-[protein] +
      ADP +
suggested_questions:
- question: >-
    Does a dedicated phosphatase dephosphorylate EF-Tu Thr-382 in vivo, and is Doc-induced
    dormancy therefore reversible, or is the Doc-catalysed ADP/GDP-dependent reverse
    reaction the only route back?
  experts:
  - Nikolay Zenkin
  - Abel Garcia-Pino
- question: >-
    At high Doc:Phd ratios the operon is derepressed rather than repressed. Which
    protein-DNA species is responsible, and does Doc leave the operator complex or remain
    in an altered one?
  experts:
  - Remy Loris
  - Roy D. Magnuson
- question: >-
    Do Doc-family toxins from bacterial genomes outside P1 also target EF-Tu Thr-382, or
    has the family diversified its substrates while keeping the degenerate Fic motif?
  experts:
  - Nancy A. Woychik
  - Jonathan W. Cruz
- question: >-
    Is the mazEF dependence of phd/doc post-segregational killing a downstream host death
    pathway triggered by translation arrest, or does Doc act on mazEF more directly? No
    activity of Doc on MazE or MazF has been reported.
  experts:
  - Hanna Engelberg-Kulka
suggested_experiments:
- hypothesis: >-
    A host serine/threonine phosphatase reverses EF-Tu Thr-382 phosphorylation and allows
    recovery from Doc-induced dormancy.
  description: >-
    Screen the E. coli phosphatase complement (and candidate PPM/PPP-family enzymes) for
    activity against purified phospho-Thr-382 EF-Tu in vitro, then test the hits in vivo:
    induce Doc transiently in wild-type and phosphatase-deletion backgrounds and follow
    phospho-EF-Tu by Phos-tag gel or targeted mass spectrometry alongside regrowth kinetics
    after Doc shut-off. A phosphatase mutant that retains phospho-EF-Tu and fails to resume
    growth would establish the recovery route.
  experiment_type: biochemical screen plus genetic epistasis
- hypothesis: >-
    The species that derepresses the phd/doc operon at high Doc:Phd ratio is a distinct
    Doc-Phd-operator complex of defined stoichiometry.
  description: >-
    Titrate purified DocH66Y against fixed Phd on single-site and double-site operator DNA
    and resolve the complexes by native mass spectrometry and mass photometry alongside
    EMSA, assigning each electrophoretic species a Doc:Phd:DNA stoichiometry; pair this with
    SAXS or cryo-EM of the repressing and the derepressing species.
  experiment_type: structural and biophysical stoichiometry
- hypothesis: >-
    EF-Tu Thr-382 is the conserved target of the whole Doc subfamily of Fic proteins.
  description: >-
    Express and purify Doc-family toxins (with their cognate antitoxins for neutralisation)
    from a phylogenetically spread panel of bacterial genomes, assay each against its own
    host EF-Tu and against whole-cell lysate with gamma-32P-ATP, and map any phosphosites
    by tandem mass spectrometry. A toxin that labels lysate but not EF-Tu would identify a
    substrate switch within the family.
  experiment_type: comparative enzymology
- hypothesis: >-
    The mazEF requirement for phd/doc post-segregational killing is downstream of
    translation arrest and not a direct Doc-MazEF interaction.
  description: >-
    Test purified Doc for phosphorylation of MazE and MazF with gamma-32P-ATP and for
    binding by pull-down or isothermal titration calorimetry; in parallel, ask whether an
    unrelated translation-arresting toxin substitutes for Doc in a mazEF-dependent killing
    assay, and whether cells expressing EF-Tu T382A are protected from Doc-induced,
    mazEF-dependent death.
  experiment_type: biochemistry plus genetic complementation
