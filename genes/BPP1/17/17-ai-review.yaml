suggested_questions:
  - question: >-
      Does the host periplasmic disulfide isomerase DsbC or DsbA influence the
      rate of spontaneous thiol-disulfide isomerization of P1 Lyz upon membrane
      release in vivo?
    experts:
      - Ry Young
      - Malgorzata B. Lobocka
suggested_experiments:
  - description: >-
      Measure P1 Lyz activation kinetics and lysis timing in E. coli dsbA, dsbB,
      and dsbC null mutants following PMF collapse.
    hypothesis: >-
      Because the Cys-13 sulfhydryl liberated from the inner membrane attacks the
      pre-existing Cys-44-Cys-51 disulfide bond intramolecularly, DsbA is
      required during membrane-tethered folding to form the initial inhibitory
      disulfide bond, whereas isomerization itself is uncatalyzed.
    experiment_type: In vivo lysis kinetics and thiol-trapping alkylation assays
