  - term:
      id: GO:0020002
      label: host cell plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: >-
        Prior to release into the periplasm, P1 Lyz is tethered to the host
        inner (plasma) membrane via its N-terminal SAR transmembrane domain.
      action: ACCEPT
      reason: >-
        Experimental studies demonstrate that Lyz is exported via the host Sec
        system and accumulates as an inactive form tethered to the host inner
        membrane by its N-terminal signal-arrest-release (SAR) domain before
        release into the periplasm.
      supported_by:
        - reference_id: PMID:15090650
          supporting_text: >-
            The unusual N-terminal domain, rich in residues that are weakly hydrophobic, thus functions as a signal-arrest-release sequence, which first acts as a normal signal-arrest domain to direct the endolysin to the periplasm in membrane-tethered form and then allows it to be released as a soluble active enzyme in the periplasm.
  - term:
      id: GO:0031640
      label: killing of cells of another organism
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Broad interspecies cell-killing term mapped from the Bacteriolytic
        enzyme keyword; for a bacteriophage endolysin, viral-induced host cell
        lysis is more precise.
      action: MODIFY
      reason: >-
        P1 Lyz is a phage endolysin that lyses the infected host bacterium at
        the end of the viral lytic cycle to release phage progeny, which is more
        specifically represented by cytolysis by symbiont of host cells
        (GO:0051715) or viral release from host cell by cytolysis (GO:0044659).
      proposed_replacement_terms:
        - id: GO:0044659
          label: viral release from host cell by cytolysis
      supported_by:
        - reference_id: PMID:15090650
          supporting_text: >-
            The Lyz endolysin of bacteriophage P1 was found to cause lysis of the host without a holin. Induction of a plasmid-cloned lyz resulted in lysis, and the lytic event could be triggered prematurely by treatments that dissipate the proton-motive force.
        - reference_id: PMID:15489417
          supporting_text: >-
            Mutations in only one of these genes, lyz (formerly 17 ), located separately from the two others, prevent lysis.
  - term:
      id: GO:0042742
      label: defense response to bacterium
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        False-positive automated keyword mapping from the Lysozyme/Bacteriolytic
        enzyme keyword suitable for eukaryotic innate immunity lysozymes, not a
        bacteriophage endolysin.
      action: REMOVE
      reason: >-
        Bacteriophage P1 is a virus infecting Escherichia coli, not a host
        organism mounting an immune defense response against bacteria. This term
        is a well-known UniProt keyword over-propagation artifact on viral
        lysozymes.
core_functions:
  - description: >-
      Hydrolyzes peptidoglycan beta-1,4-glycosidic bonds in the host bacterial
      cell wall after Sec-mediated export and release of its N-terminal
      signal-arrest-release (SAR) domain from the host inner membrane, causing
      host cell lysis and phage progeny release.
