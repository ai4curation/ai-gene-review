existing_annotations:
  - term:
      id: GO:0003796
      label: lysozyme activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: >-
        P1 Lyz (gp17) is a true T4-family lysozyme (peptidoglycan
        N-acetylmuramoylhydrolase, EC 3.2.1.17) that cleaves host peptidoglycan
        to mediate cell lysis.
      action: ACCEPT
      reason: >-
        Genetic, biochemical, and X-ray crystallographic studies confirm that P1
        Lyz is a T4-family lysozyme whose active site (Glu-42, Asp-51, Thr-57)
        hydrolyzes host peptidoglycan after SAR-domain release and disulfide
        isomerization.
      supported_by:
        - reference_id: PMID:15637279
          supporting_text: >-
            The P1 lysozyme Lyz is secreted to the periplasm of Escherichia coli and accumulates in an inactive membrane-tethered form. Genetic and biochemical experiments show that, when released from the bilayer, Lyz is activated by an intramolecular thiol-disulfide isomerization, which requires a cysteine in its N-terminal SAR (signal-arrest-release) domain. Crystal structures confirm the alternative disulfide linkages in the two forms of Lyz and reveal dramatic conformational differences in the catalytic domain.
        - reference_id: PMID:15489417
          supporting_text: >-
            The product of the lyz gene was found to be a 185-residue protein homologous to several proteins of the T4 lysozyme family ( 277 ), indicating that it is a “true” lysozyme capable of hydrolyzing peptidoglycan N-acetylmuramyl-β( 1 , 4 ) linkages.
