  label: Escherichia phage P1
description: >-
  Signal-arrest-release (SAR) endolysin Lyz (gene 17 product) of Escherichia
  phage P1 that hydrolyzes peptidoglycan beta-1,4-glycosidic linkages to lyse
  the host bacterial cell at the end of the lytic cycle. Exported via the host
  Sec pathway in an inactive, inner-membrane-tethered form via its N-terminal
  SAR transmembrane domain, Lyz is released into the periplasm upon membrane
  depolarization (accelerated by holin LydA/LydD pinholes) and activated by an
  intramolecular thiol-disulfide isomerization involving Cys-13 in the SAR
  domain and Cys-44/Cys-51 in the catalytic domain, which unmasks the active
  site cleft.
