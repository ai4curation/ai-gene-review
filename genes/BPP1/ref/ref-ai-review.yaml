  label: Escherichia phage P1
description: RecA-dependent HNH-family endonuclease (186 amino acids, 21.3 kDa; "recombination
  enhancement function") of bacteriophage P1, regulated by the C1 master repressor.
  Comprises a positively charged, intrinsically disordered N-terminal DNA-binding
  tail (residues 1-76) and a C-terminal globular HNH-family nuclease domain (residues
  77-186) that coordinates two Zn2+ ions. Binds single- and double-stranded DNA but
  cleaves DNA only when targeted to active, ATP-hydrolyzing host RecA nucleoprotein
  filaments, cutting RecA-bound single-stranded DNA and D-loop intermediates to introduce
  directed, recombinogenic double-strand breaks that stimulate homologous and microhomologous
  DNA recombination.
existing_annotations:
- term:
