    supporting_text: "Lysogenization by a c1ts variant of coliphage P1, P1c1.100, markedly increased the frequency of reversion of a galT::IS1 mutation. The formation of Gal+ colonies presumably occurs by microhomologous recombination between the 9-base-pair repeats in galT (CGCCGCTAC) generated by the transposition of IS1."
suggested_questions:
- question: What is the physiological substrate of Ref during the bacteriophage P1
    lytic or lysogenic cycle (e.g., concatemer formation, cyclization of terminally
    redundant virion DNA, or cleavage of competing mobile elements)?
suggested_experiments:
- description: Perform high-throughput sequencing of 5'-phosphorylated DNA ends (END-seq)
    in E. coli cells infected with wild-type P1 versus a P1 delta-ref mutant during
    early lytic growth and prophage establishment.
  hypothesis: Ref introduces RecA-guided double-strand breaks within the terminally
    redundant ends of infecting P1 DNA or at stalled replication forks to accelerate
    RecA-dependent genome cyclization and concatemeric recombination.
