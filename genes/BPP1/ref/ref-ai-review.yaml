    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0228
  review:
    summary: Automated mapping artifact from UniProt keyword KW-0228 (DNA excision);
      Ref stimulates IS1 transposon excision via microhomologous recombination by
      generating double-strand breaks, not DNA excision repair.
    action: REMOVE
    reason: UniProt keyword KW-0228 (DNA excision) was assigned because Ref stimulates
      precise excision of IS1 elements between 9-bp direct repeats via RecA-dependent
      microhomologous recombination (PMID:2542224), not nucleotide excision DNA repair;
      biochemically, Ref is a RecA-dependent HNH endonuclease that creates double-strand
      breaks (PMID:21193392).
    supported_by:
    - reference_id: PMID:2542224
      supporting_text: "Lysogenization by a c1ts variant of coliphage P1, P1c1.100, markedly increased the frequency of reversion of a galT::IS1 mutation. The formation of Gal+ colonies presumably occurs by microhomologous recombination between the 9-base-pair repeats in galT (CGCCGCTAC) generated by the transposition of IS1."
    - reference_id: PMID:21193392
      supporting_text: "The overall structure of Ref, including several putative active site histidine residues, defines a new subclass of HNH-family nucleases. We propose that enhancement of recombination by Ref reflects the introduction of directed, recombinogenic double-strand breaks."
