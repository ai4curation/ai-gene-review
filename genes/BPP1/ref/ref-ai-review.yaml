- term:
    id: GO:0008047
    label: enzyme activator activity
  evidence_type: EXP
  original_reference_id: PMID:21193392
  qualifier: enables
  review:
    summary: PMID:21193392 explicitly refuted the hypothesis that Ref is a RecA activator,
      demonstrating instead that Ref is an HNH-family endonuclease activated by RecA
      filaments.
    action: MODIFY
    reason: The cited study (PMID:21193392) explicitly found no evidence that Ref
      functions as a RecA regulator or activator; instead, it demonstrated that Ref
      is an HNH-family endonuclease whose DNA cleavage activity is activated by RecA
      nucleoprotein filaments, warranting replacement with GO:0004519 (endonuclease
      activity) and GO:0000014 (single-stranded DNA endonuclease activity).
    proposed_replacement_terms:
    - id: GO:0004519
      label: endonuclease activity
    - id: GO:0000014
      label: single-stranded DNA endonuclease activity
    supported_by:
    - reference_id: PMID:21193392
      supporting_text: "In this work we have purified and characterized the Ref protein, finding no evidence that it functions as a RecA regulator. Instead, Ref protein is a new kind of enzyme; that is, a RecA-dependent nuclease."
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:2542224
  title: Stimulation of IS1 excision by bacteriophage P1 ref function.
  findings:
  - statement: Expression of the P1 ref gene stimulates RecA-dependent microhomologous
      recombination and precise excision of IS1 elements between 9-bp direct repeats.
    supporting_text: "Lysogenization by a c1ts variant of coliphage P1, P1c1.100, markedly increased the frequency of reversion of a galT::IS1 mutation. The formation of Gal+ colonies presumably occurs by microhomologous recombination between the 9-base-pair repeats in galT (CGCCGCTAC) generated by the transposition of IS1."
  - statement: Ref-mediated stimulation of recombination strictly requires host RecA
      but is independent of RecB and IHF (himA).
    supporting_text: "Ref stimulated precise excision in recB or himA cells, but not in recA mutants."
- id: PMID:21193392
  title: 'Creating directed double-strand breaks with the Ref protein: a novel RecA-dependent
    nuclease from bacteriophage P1.'
  findings:
  - statement: Ref is not a RecA regulator or activator, but rather a RecA-dependent
      HNH-family endonuclease that cleaves ssDNA and D-loop structures only where
      active RecA nucleoprotein filaments are bound.
    supporting_text: "In this work we have purified and characterized the Ref protein, finding no evidence that it functions as a RecA regulator. Instead, Ref protein is a new kind of enzyme; that is, a RecA-dependent nuclease."
  - statement: Ref introduces directed, recombinogenic double-strand breaks at RecA-bound
      target sites.
    supporting_text: "The overall structure of Ref, including several putative active site histidine residues, defines a new subclass of HNH-family nucleases. We propose that enhancement of recombination by Ref reflects the introduction of directed, recombinogenic double-strand breaks."
core_functions:
- description: RecA-dependent HNH-family endonuclease that cleaves RecA-coated single-stranded
    DNA and both strands of RecA-generated D-loops to introduce directed, recombinogenic
    double-strand breaks that stimulate homologous and microhomologous DNA recombination.
