  review:
    summary: Bof (Lxc) does not bind DNA on its own, but binds C1-operator complexes
      to increase C1 operator affinity and enhance transcriptional repression.
    action: NEW
    reason: Gel mobility shift and reporter assays demonstrate that Bof (Lxc) lacks
      intrinsic DNA-binding activity but forms a ternary complex with C1 repressor
      and operator DNA that enhances C1 affinity and transcriptional repression across
      C1-controlled operators (PMID:2211715, PMID:2345146, PMID:15489417).
    supported_by:
    - reference_id: PMID:2211715
      supporting_text: Using a DNA mobility shift assay, we show that bof protein
        enhances the binding of c1 repressor to the operator of the c1 gene.
    - reference_id: PMID:15489417
      supporting_text: Participation of Lxc in the C1-operator complexes that control
        c 1 expression increases the affinity of the repressor for the operator and
        down-regulates the synthesis of C1 itself
