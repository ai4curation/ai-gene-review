id: P22499
gene_symbol: bof
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Transcriptional corepressor and C1 modulator protein Bof (also known
  as Lxc) encoded in the immT immunity region and translated from a UUG initiation
  codon. Although Bof does not bind DNA on its own, it assembles into a ternary complex
  with the master lytic repressor C1 and operator DNA, increasing the affinity of
  C1 for its operators, promoting DNA looping between paired operator sites, enhancing
  c1 autorepression, and protecting C1-operator complexes from dissociation by the
  Coi inducer protein.
