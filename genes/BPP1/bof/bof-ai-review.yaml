references:
- id: PMID:2211715
  title: A bacteriophage P1-encoded modulator protein affects the P1 c1 repression
    system.
  findings:
  - statement: Bof enhances the binding of C1 repressor to operator DNA by forming
      a ternary complex and acts as a global modulator of C1-controlled operators.
    supporting_text: Using a DNA mobility shift assay, we show that bof protein enhances
      the binding of c1 repressor to the operator of the c1 gene.
  - statement: Bof modulates repression across multiple C1-controlled operators in
      the P1 genome.
    supporting_text: We conclude that bof acts as a modulator protein in the repression
      of a multitude of c1-controlled operators in the P1 genome.
- id: PMID:2345146
  title: 'The bof gene of bacteriophage P1: DNA sequence and evidence for roles in
    regulation of phage c1 and ref genes.'
  findings:
  - statement: The bof gene encodes an 82-amino-acid protein initiated at a UUG codon
      and makes C1-mediated repression of target operons more complete in vivo.
    supporting_text: The bofDNA sequence encodes an 82-codon reading frame that begins
      with a TTG codon
  - statement: Co-expression of Bof with C1 increases transcriptional repression of
      C1-regulated promoters.
    supporting_text: Repression of both fusion genes by plasmid-encoded C1 plus Bof
      or by a P1 bof+ prophage was more complete.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: Bof (renamed Lxc) is encoded in the immT locus and modulates C1 repressor
      function by forming a ternary complex with C1 and operator DNA without binding
      DNA on its own.
    supporting_text: The ImmT region, distant from ImmC and ImmI, contains a small
      gene, lxc , whose product modulates the function of C1 by formation of a ternary
      complex with C1 and operator DNA
  - statement: Binding of Lxc to a C1-operator complex increases C1 affinity for operators
      and enhances inter-operator DNA looping.
    supporting_text: Participation of Lxc in the C1-operator complexes that control
      c 1 expression increases the affinity of the repressor for the operator and
      down-regulates the synthesis of C1 itself
