existing_annotations:
  - term:
      id: GO:0003677
      label: DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        PacA is the site-specific DNA-binding subunit of the P1 pacase complex
        that recognizes and binds methylated hexanucleotide repeats within the
        162-bp pac packaging site.
      action: ACCEPT
      reason: >-
        Experimental evidence demonstrates that PacA directly recognizes and
        binds methylated pac site DNA independently of PacB in the presence of
        host factors IHF and HU. While sequence-specific DNA binding could be
        considered, GO:0003677 accurately captures its core molecular function as
        the DNA recognition subunit of the viral terminase complex.
      supported_by:
        - reference_id: PMID:15489417
          supporting_text: >-
            The PacA subunit recognizes and binds to methylated pac sites independently of PacB but requires a host factor to do so ( 287 ).
        - reference_id: PMID:1538406
          supporting_text: >-
            Thus, PacA and PacB are two essential bacteriophage proteins required for recognition and cleavage of the P1 packaging site.
  - term:
      id: GO:0004518
      label: nuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        PacA is required together with PacB for endonucleolytic cleavage of the
        P1 pac site, though the catalytic nuclease and ATPase centers reside in
        the large terminase subunit PacB.
      action: MODIFY
      reason: >-
        Although extracts require both PacA and PacB to cleave the pac site,
        comparative phage terminase biology and domain architecture show that
        PacA is the DNA-recognition small subunit whereas the endonuclease and
        ATPase catalytic centers reside in the large subunit PacB. However, if
        annotating the complex-dependent cleavage activity, endonuclease activity
        (GO:0004519) is more specific than general nuclease activity.
      proposed_replacement_terms:
        - id: GO:0004519
          label: endonuclease activity
      supported_by:
        - reference_id: PMID:1538406
          supporting_text: >-
            Extracts prepared from cells expressing both PacA and PacB are proficient for site-specific cleavage of the P1 packaging site, whereas those lacking either protein are not.
        - reference_id: PMID:15489417
          supporting_text: >-
            Cleavage of the P1 packaging site requires the product of both proteins PacA and PacB, presumably as heterooligomers.
  - term:
      id: GO:0016787
      label: hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        Broad keyword-derived hydrolase annotation reflecting pac site cleavage
        by the PacAB terminase complex.
      action: TOO_GENERAL
      reason: >-
        Hydrolase activity is an uninformative root-level parent term already
        entailed by endonuclease activity of the terminase complex, and PacA
        itself acts primarily as the DNA-binding specificity subunit rather than
        the catalytic hydrolase subunit.
      supported_by:
        - reference_id: file:BPP1/pacA/pacA-uniprot.txt
          supporting_text: >-
            CC   -!- FUNCTION: Necessary for recognition and cleavage of the phage packaging
  - term:
      id: GO:0019073
      label: viral DNA genome packaging
    evidence_type: IMP
    original_reference_id: PMID:1538406
    review:
      summary: >-
        PacA is essential for recognition and cleavage of the pac site to
        initiate viral DNA genome packaging into P1 proheads.
      action: NEW
      reason: >-
        Amber mutations and knockouts in pacA abolish pac site cleavage and
        disable the P1 DNA packaging motor complex, yielding unencapsidated
        proheads and tails.
      supported_by:
        - reference_id: PMID:1538406
          supporting_text: >-
            By sequencing wild-type P1 DNA and DNA derived from various P1 amber mutants that are deficient in pac cleavage, two distinct genes, referred to as pacA and pacB, were identified.
        - reference_id: PMID:35458408
          supporting_text: >-
            The pacA mutant disables the P1 DNA packaging motor complex [44] and was used as a control for the purification of incomplete P1 virion components.
core_functions:
  - description: >-
      Recognizes and binds adenine-methylated hexanucleotide repeats within the
      phage P1 packaging site (pac) and recruits the large terminase subunit
      PacB to cleave concatemeric viral DNA and initiate headful genome
      packaging into proheads.
    molecular_function:
      id: GO:0003677
      label: DNA binding
    directly_involved_in:
      - id: GO:0019073
        label: viral DNA genome packaging
    supported_by:
      - reference_id: PMID:1538406
        supporting_text: >-
          Extracts prepared from cells expressing both PacA and PacB are proficient for site-specific cleavage of the P1 packaging site, whereas those lacking either protein are not. However, the two defective extracts can complement each other to restore functional pac cleavage activity. Thus, PacA and PacB are two essential bacteriophage proteins required for recognition and cleavage of the P1 packaging site.
      - reference_id: PMID:15489417
        supporting_text: >-
          The PacA subunit recognizes and binds to methylated pac sites independently of PacB but requires a host factor to do so ( 287 ).
      - reference_id: PMID:35458408
        supporting_text: >-
          The pacA mutant disables the P1 DNA packaging motor complex [44] and was used as a control for the purification of incomplete P1 virion components.
suggested_questions:
  - question: >-
      How does PacA oligomerize on IHF/HU-bent methylated pac DNA, and which
      domain of PacA directly contacts the PacB large terminase subunit and the
      Prt portal vertex?
    experts:
      - Malgorzata B. Lobocka
      - Ry Young
      - Jason J. Gill
suggested_experiments:
  - description: >-
      Determine the cryo-EM structure of the P1 PacA-PacB-IHF-pac DNA assembly
      to resolve the mechanism of adenine-methylation readout and endonuclease
      activation.
    hypothesis: >-
      PacA forms a ring-like oligomer around bent methylated pac DNA that
      positions a pair of PacB nuclease domains across the 13-bp cleavage zone.
    experiment_type: Cryo-EM single-particle reconstruction and electrophoretic mobility shift assays
