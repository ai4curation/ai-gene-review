id: P28813
gene_symbol: pacA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: >-
  Small terminase (pacase) subunit PacA of Escherichia phage P1 that recognizes
  and binds the adenine-methylated packaging site (pac) on concatemeric viral
  DNA in cooperation with host architectural proteins IHF and HU. Together with
  the large terminase subunit PacB, PacA forms the hetero-oligomeric pacase
  (terminase) complex that catalyzes site-specific endonucleolytic cleavage at
  pac to initiate processive headful DNA packaging into phage proheads.
