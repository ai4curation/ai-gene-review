id: Q06262
gene_symbol: YORA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Uncharacterized 312-amino-acid predicted protein (36.0 kDa; ORFA, corresponding
  to pdcB) encoded in the intergenic region between the doc toxin gene of the phd-doc
  plasmid addiction operon and the lpa (Gp10) late promoter activator gene of bacteriophage
  P1. Contains a domain of unknown function (DUF968; InterPro:IPR010373) and has no
  experimentally determined molecular function.
existing_annotations: []
references:
- id: file:genes/BPP1/YORA/YORA-uniprot.txt
  title: UniProtKB record for Q06262 (YORA_BPP1)
  findings:
  - statement: Q06262 is a 312-aa (36.0 kDa) predicted protein (ORFA) in bacteriophage
      P1 containing a DUF968 domain of unknown function.
    supporting_text: 'DR   InterPro; IPR010373; DUF968. ... PE   4: Predicted;'
- id: PMID:8411153
  title: 'Plasmid addiction genes of bacteriophage P1: doc, which causes cell death
    on curing of prophage, and phd, which prevents host death when prophage is retained.'
  findings:
  - statement: Reports the nucleotide sequence of the P1 plasmid addiction region
      containing phd, doc, and the adjacent downstream intergenic region encoding
      ORFA (YORA).
    supporting_text: The plasmid withdrawal response depends on a gene named doc (death
      on curing), encoding a 126 amino acid protein. Expression of doc is not SOS-inducing
      and killing by Doc is recA-independent. In cells that retain P1 the killing
      is prevented by the product of a gene named phd (prevent host death), encoding
      a 73 amino acid protein.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: Two open reading frames of unknown function (pdcA and pdcB) located
      immediately downstream of doc appear to be co-transcribed with the phd-doc operon.
    supporting_text: The nucleotide sequence downstream of doc contains two ORFs that
      could encode proteins of 66 and 347 residues, designated here pdcA and pdcB
      (post-doc). The 5′ end of pdcA overlaps 17 terminal nucleotides of the doc gene.
      The phd-doc transcript appears to include the transcripts of pdcA and pdcB
core_functions:
- description: Uncharacterized 312-amino-acid predicted polypeptide (ORFA / PdcB;
    DUF968 family) encoded in the intergenic region between doc and lpa (Gp10), co-transcribed
    downstream of the phd-doc operon with no known molecular activity.
  supported_by:
  - reference_id: file:genes/BPP1/YORA/YORA-uniprot.txt
    supporting_text: 'DR   InterPro; IPR010373; DUF968. ... PE   4: Predicted;'
  - reference_id: PMID:15489417
    supporting_text: The nucleotide sequence downstream of doc contains two ORFs that
      could encode proteins of 66 and 347 residues, designated here pdcA and pdcB
      (post-doc). The 5′ end of pdcA overlaps 17 terminal nucleotides of the doc gene.
      The phd-doc transcript appears to include the transcripts of pdcA and pdcB
suggested_questions:
- question: Is the YORA open reading frame translated in vivo during P1 lysogeny or
    lytic growth, and does its deletion affect phd-doc mRNA stability or lpa transcription?
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and chromosomal epitope tagging
    of the YORA open reading frame in P1 lysogens and lytically induced cells.
  hypothesis: YORA is either a non-essential small accessory polypeptide co-transcribed
    with phd-doc or a non-coding intergenic spacer between the phd-doc and lpa transcriptional
    units.
