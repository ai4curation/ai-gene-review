id: P06956
gene_symbol: cre
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Tyrosine site-specific recombinase Cre (343 amino acids, 38.5 kDa) that
  catalyzes cofactor-independent conservative site-specific recombination between
  34-bp loxP sequences (comprising two 13-bp inverted repeats flanking an asymmetric
  8-bp spacer). Assembles as a homotetrameric synaptic complex that cleaves and exchanges
  DNA strands sequentially via a covalent 3'-phosphotyrosine (Tyr-324) intermediate
  and a Holliday junction intermediate. In the bacteriophage P1 life cycle, Cre circularizes
  newly injected terminally redundant linear phage DNA and resolves dimeric prophage
  plasmids into monomers to ensure stable extrachromosomal plasmid partitioning.
