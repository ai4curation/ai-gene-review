  review:
    summary: Cre binds DNA, but specifically recognizes 34-bp loxP target sequences
      and catalyzes conservative site-specific DNA strand exchange.
    action: MODIFY
    reason: Crystal structures and biochemical studies demonstrate that Cre specifically
      recognizes the 13-bp inverted repeats of 34-bp loxP sites and catalyzes site-specific
      DNA cleavage, strand exchange, and religation via active-site Tyr-324 (PMID:9288963,
      PMID:9670032). The general DNA binding term should be refined to sequence-specific
      DNA binding (GO:0043565) and DNA strand exchange activity (GO:0000150).
    proposed_replacement_terms:
