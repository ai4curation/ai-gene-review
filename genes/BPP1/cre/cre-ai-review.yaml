- id: PMID:3486297
  title: Bacteriophage P1 cre gene and its regulatory region. Evidence for multiple
    promoters and for regulation by DNA methylation.
  findings:
  - statement: Sequenced the P1 cre gene and identified multiple upstream promoters.
    supporting_text: The bacteriophage P1 site-specific recombination system consists
      of two components, a site, loxP, at which recombination occurs, and a recombinase
      protein, Cre. In this paper, we present the DNA sequence of the cre structural
      gene and its upstream regulatory region.
- id: PMID:9288963
  title: Structure of Cre recombinase complexed with DNA in a site-specific recombination
    synapse.
  findings:
  - statement: Crystal structure of the Cre-loxP synaptic complex reveals a homotetramer
      that catalyzes site-specific recombination between 34-bp loxP sites via a covalent
      3'-phosphotyrosine (Tyr-324) intermediate.
    supporting_text: The bacteriophage recombinase Cre catalyses site-specific recombination
      between two 34-base-pair loxP sites. The crystal structure at 2.4 A resolution
      of Cre bound to a loxP substrate reveals an intermediate in the recombination
      reaction, in which a Cre molecule has cleaved the substrate to form a covalent
      3'-phosphotyrosine linkage with the DNA.
- id: PMID:9670032
  title: Structure of the Holliday junction intermediate in Cre-loxP site-specific
    recombination.
  findings:
  - statement: Crystal structure of the Cre-loxA Holliday junction intermediate shows
      a planar four-way junction bound by the Cre tetramer.
    supporting_text: We have determined the X-ray crystal structures of two DNA Holliday
      junctions (HJs) bound by Cre recombinase. ... Cre recombinase is an integrase
      family member that recombines 34 bp loxP sites in the absence of accessory proteins
      or auxiliary DNA sequences.
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: In the P1 life cycle, Cre catalyzes phage DNA cyclization after infection
      and resolves prophage plasmid multimers into monomers to support extrachromosomal
      plasmid maintenance.
    supporting_text: A site-specific recombinase, Cre, which appears promptly after
      infection, is involved in phage DNA cyclization ( 137 ), assists plasmid maintenance
      by resolving plasmid multimers ( 21 ), and perhaps, by a separate mechanism,
      may stabilize plasmid copy number
  - statement: P1 prophage exists as an autonomous extrachromosomal plasmid rather
      than integrating into the host chromosome.
    supporting_text: Whereas λ prophage leads an essentially passive existence within
      the chromosome of its host, P1 prophage exists as an autonomous plasmid that
      is maintained at low copy number.
