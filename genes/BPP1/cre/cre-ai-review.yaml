- term:
    id: GO:0015074
    label: DNA integration
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002104
  - InterPro:IPR013762
  - UniProtKB-KW:KW-0229
  review:
    summary: Over-propagated annotation from the tyrosine integrase domain family;
      P1 does not integrate into the host chromosome during its normal life cycle,
      and Cre functions in DNA cyclization and plasmid dimer resolution.
    action: REMOVE
    reason: Unlike integrative phages such as lambda, bacteriophage P1 maintains lysogeny
      as an autonomous low-copy-number plasmid rather than integrating into the host
      chromosome (PMID:15489417). In its native biological context, Cre catalyzes
      intramolecular cyclization of terminally redundant linear phage DNA and resolution
      of dimeric prophage plasmids into monomers (PMID:15489417, file:genes/BPP1/cre/cre-uniprot.txt).
      The DNA integration annotation is an artifact of domain/keyword propagation
      from the phage integrase family (IPR002104 / KW-0229).
    supported_by:
    - reference_id: PMID:15489417
      supporting_text: Whereas λ prophage leads an essentially passive existence within
        the chromosome of its host, P1 prophage exists as an autonomous plasmid that
        is maintained at low copy number.
    - reference_id: file:genes/BPP1/cre/cre-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Catalyzes site-specific recombination between two 34-base- ... pair LOXP sites. Its role is to maintain the phage genome as a ... monomeric unit-copy plasmid in the lysogenic state.'
