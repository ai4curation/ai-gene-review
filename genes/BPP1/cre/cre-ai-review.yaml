suggested_questions:
- question: How does transcription from the three upstream promoters of cre (one Dam-methylation
    regulated and one C1-associated) coordinate Cre levels during initial infection
    versus steady-state plasmid maintenance?
suggested_experiments:
- description: Quantify single-cell cre promoter activity and plasmid dimer resolution
    rates in wild-type and dam-mutant E. coli during initial P1 infection and lysogenic
    growth.
  hypothesis: Hemimethylation after replication transiently boosts cre transcription
    to ensure timely resolution of newly formed sister-plasmid dimers before cell
    division.
