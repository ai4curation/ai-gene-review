  review:
    summary: Ant1/Ant2 contains a conserved C-terminal helix-turn-helix DNA-binding
      domain (IPR005039) and interacts with the phage-specific sas DNA site within
      the ant gene to mediate antirepression.
    action: ACCEPT
    reason: Sequence analysis identifies a C-terminal ANT domain containing a Cro-like
      helix-turn-helix DNA-binding motif shared with KilA (InterPro:IPR005039), and
      genetic studies show that Ant proteins require loading onto the phage-specific
      sas DNA site inside the ant gene to perform their antirepressor function during
      heteroimmune prophage induction (PMID:2585500, PMID:15489417).
    supported_by:
    - reference_id: PMID:15489417
      supporting_text: An additional specificity determinant, sas (site of Ant specificity),
        is involved in determining the capacity of Ant proteins to induce prophage
        on heteroimmune superinfection. The site resides centrally within the ant
        genes of P1 and P7
    - reference_id: PMID:15489417
      supporting_text: It was suggested that Ant proteins must normally load onto
        their phage-specific sas sites to perform their antirepressor function
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:2585500
  title: Organization of the immunity region immI of bacteriophage P1 and synthesis
    of the P1 antirepressor.
  findings:
  - statement: The ant/reb gene in the immI locus encodes the P1 antirepressor that
      interferes with the C1 repressor of lytic function.
    supporting_text: The immI region of bacteriophage P1 includes the ant/reb gene,
      which encodes the antirepressor protein, and the c4 gene, which encodes a repressor
      molecule that negatively regulates antirepressor synthesis. The antirepressor
      interferes with the activity of the P1 repressor of lytic function, the product
      of the c1 gene.
  - statement: A single open reading frame encodes two in-frame antirepressor proteins,
      Ant1 and Ant2, via internal translation initiation.
    supporting_text: two antirepressor proteins of molecular weights 42,000 and 32,000
      are encoded by a single open reading frame, with the smaller protein initiating
      at an in-frame start codon
- id: PMID:15489417
  title: Genome of bacteriophage P1.
  findings:
  - statement: Ant proteins require the central phage-specific sas DNA site within
      the ant coding sequence to induce heteroimmune prophages.
    supporting_text: An additional specificity determinant, sas (site of Ant specificity),
      is involved in determining the capacity of Ant proteins to induce prophage on
      heteroimmune superinfection. The site resides centrally within the ant genes
      of P1 and P7
  - statement: Ant proteins load onto their phage-specific sas DNA sites to carry
      out antirepressor activity against C1.
    supporting_text: It was suggested that Ant proteins must normally load onto their
      phage-specific sas sites to perform their antirepressor function
core_functions:
- description: Antirepressor that loads onto the phage-specific sas DNA site and antagonizes
    the C1 master repressor to derepress P1 lytic transcription and trigger the switch
    from lysogeny to lytic development.
