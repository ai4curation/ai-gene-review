suggested_questions:
- question: How does the Ant1-Ant2 heteromeric complex assemble on the sas DNA site
    and physically strip or inactivate C1 repressor at distant operator sites?
suggested_experiments:
- description: Reconstitute purified Ant1 and Ant2 in vitro with sas DNA, C1 repressor,
    and operator DNA using electrophoretic mobility shift and single-molecule DNA
    curtain assays.
  hypothesis: Ant1 and Ant2 form a heteromeric complex that nucleates specifically
    at the sas DNA sequence via its C-terminal HTH domain and sequesters C1 repressor
    via the N-terminal extension unique to Ant1.
