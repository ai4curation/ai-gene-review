id: P19655
gene_symbol: ant
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2886926
  label: Escherichia phage P1
description: Antirepressor protein encoded by the ant gene within the c4-icd-ant1/2
  operon of the immI immunity locus. Expressed as two in-frame isoforms—full-length
  Ant1 (322 aa, formerly RebB) and N-terminally truncated Ant2 (239 aa, initiated
  at Met-84, formerly RebA)—that act together to antagonize the master lytic repressor
  C1 and trigger lytic development. Contains a C-terminal domain with a predicted
  helix-turn-helix DNA-binding motif homologous to KilA and requires a central phage-specific
  DNA site (sas, site of Ant specificity) within the ant coding region to mediate
  prophage induction upon heteroimmune superinfection.
