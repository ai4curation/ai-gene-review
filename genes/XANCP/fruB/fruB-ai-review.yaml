    supporting_text: 'The X. campestris MTP (837 amino acid residues) consists of three
      moieties: a fructose-specific enzyme-IIA-like N-terminal moiety (residues 1-148),
      followed by an HPr-like moiety (161-251) and an enzyme-I-like C-terminal moiety
