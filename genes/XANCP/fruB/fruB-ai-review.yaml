- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000532509
  - UniProtKB:Q9HXN5
  review:
    summary: The N-acetylglucosamine transport IBA descends from the bacterial root node of the enzyme
      I family, seeded only by an N-acetylglucosamine PTS multiphosphoryl protein outside this protein's
      clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PTHR46244 family review assesses PTN000532509 as TOO_DEEP for this term; its single seed,
      P. aeruginosa PA3760 (Q9HXN5), is an N-acetylglucosamine PTS multiphosphoryl protein, while P45597
      is the fused fructose relay of the fruBKA system with a fructose-type EIIA domain. Native-strain genetics
      tie this protein to fructose transport and phosphorylation, and no N-acetylglucosamine uptake assay
      was found. Coupling to another sugar through free HPr is not excluded, so the claim is marked as an
      over-annotation of the inherited node rather than removed as contradicted.
    supported_by:
    - *id004
    - *id006
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000532509
