core_functions:
- description: FruB autophosphorylates from phosphoenolpyruvate on its enzyme I domain
    and relays the phosphoryl group through its fused HPr and EIIA(Fru) domains to
    the FruA EIIB'BC permease, driving fructose uptake as fructose 1-phosphate.
  molecular_function:
    id: GO:0008965
    label: phosphoenolpyruvate-protein phosphotransferase activity
  directly_involved_in:
