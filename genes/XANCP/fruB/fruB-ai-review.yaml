- id: PMID:1655739
  title: Fructose catabolism in Xanthomonas campestris pv. campestris. Sequence of the PTS operon, characterization
    of the fructose-specific enzymes.
  findings:
  - statement: The historical-strain study distinguishes FruA-mediated PTS uptake, FruK phosphorylation
      and the separate bypass fructokinase.
    supporting_text: The fructose 1-phosphate produced by the phosphotransferase system is phosphorylated
      into fructose 1,6-bisphosphate by a 1-phosphofructokinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full JBC PDF inspected through the cited source mirror; local publication cache remains
      abstract-only. Assay source is NRRL B1459/ATCC13951. Current ATCC33913 sequences have historical
      conflicts; preserve the strain-transfer limitation. No negative ribose assay or exact current-protein
      kinetics is claimed.
- id: PMID:7496537
  title: 'Fructose phosphotransferase system of Xanthomonas campestris pv. campestris: characterization
    of the fruB gene.'
  findings:
  - statement: FruB combines EIIA, HPr and EI modules and supports fructose uptake/phosphorylation; the
      insertion polarity is bounded by a FruK-negative control.
    supporting_text: The construction of a fruB mutant confirmed the role of the MTP in fructose transport
      and phosphorylation in X. campestris.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Publisher full PDF read, including Methods and mutant/control results. Native ATCC13951/NRRL
      B1459 experiments; current P45597 is838 residues versus historical837. Mutant growth is not a direct
      assay of every sugar transport route. The fruBK transcription unit and fruA promoter are distinguished.
- id: PMID:1650911
  title: Identification of two fructose transport and phosphorylation pathways in Xanthomonas campestris
    pv. campestris.
  findings:
  - statement: A separate permease plus ATP-dependent fructokinase provides a non-PTS fructose entry route.
    supporting_text: an unidentified permease coupled to an ATP-dependent fructokinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: New normal fetch returned abstract-only; used only for the explicitly reported bypass,
      not to overrule experimental annotations or identify the unknown transporter.
