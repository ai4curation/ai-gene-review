proposed_new_terms:
- proposed_name: PTS EIIA-to-EIIB phosphotransferase activity
  proposed_definition: Catalysis of phosphate transfer from the phosphorylated
    histidine of a phosphoenolpyruvate-dependent sugar phosphotransferase system
    EIIA domain to the cognate EIIB phosphoacceptor.
  justification: As for P. putida FruB (Q88PQ5), GO:0008965 covers only the enzyme
    I entry step; no GO molecular-function term describes the EIIA(Fru) domain's transfer
    of phosphate to the FruA EIIB domain, which the X. campestris MTP must perform
    for fructose uptake. Existing GO:0008982, GO:0022877 and GO:0090563 describe terminal
    transport-coupled transfer to the sugar. GO:0016772 is used only as a placeholder
    parent.
  proposed_parent:
    id: GO:0016772
    label: transferase activity, transferring phosphorus-containing groups
  supported_by:
  - reference_id: file:XANCP/fruB/fruB-uniprot.txt
    record_section: ["CC:DOMAIN"]
    supporting_text: 'DOMAIN: The PTS EIIA type-2 domain is phosphorylated by phospho-HPr
      on a histidyl residue. Then, it transfers the phosphoryl group to the PTS EIIB
      type-2 domain.'
suggested_questions:
- question: Why does loss of FruB block growth on mannose, mannitol and sucrose as
    well as fructose in X. campestris; are these sugars routed through fructose or
    fructose 1-phosphate, or does FruB also phosphorylate other EII permeases?
suggested_experiments:
- hypothesis: The enzyme I domain of X. campestris FruB is sufficient to phosphorylate
    its own HPr domain, and phosphate reaches FruA only through the EIIA(Fru) histidine.
  description: Purify FruB and FruA-containing membranes, measure PEP-dependent phosphorylation
    of FruB and of fructose to fructose 1-phosphate, and test FruB variants with substitutions
    at the predicted EI (His460), HPr (His175) and EIIA (His67) phosphohistidine sites.
  experiment_type: in vitro phosphotransfer and site-directed mutagenesis
