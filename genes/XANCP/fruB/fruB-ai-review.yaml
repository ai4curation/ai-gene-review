core_functions:
- description: Accepts phosphate from PEP through the EI module and relays it through fused HPr/EIIA modules
    to FruA. The current protein has EIIA7–147, HPr161–253 and EI274–838; domain evidence, not SF6 membership
    alone, establishes the fusion. Activity in ATCC33913 is inferred from architecture and ATCC13951 biochemical/genetic
    evidence.
