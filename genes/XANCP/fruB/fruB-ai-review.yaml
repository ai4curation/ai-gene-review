gene_symbol: fruB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
description: FruB is the multiphosphoryl transfer protein (MTP) of the fructose-specific
  phosphoenolpyruvate-dependent phosphotransferase system (PTS) of Xanthomonas campestris
  pv. campestris. A single 838-residue cytoplasmic polypeptide carries an N-terminal
  fructose-specific EIIA domain, a central HPr domain and a C-terminal enzyme I domain,
  so the fructose PTS needs no separate enzyme I or HPr. The enzyme I domain autophosphorylates
  from phosphoenolpyruvate and the phosphoryl group passes through the HPr and EIIA
  histidines to the EIIB domains of the membrane permease FruA (EIIB'BC), which imports
  fructose as fructose 1-phosphate. fruB is cotranscribed with fruK (1-phosphofructokinase)
  upstream of fruA, and a fruB mutant cannot grow on fructose.
