taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
description: FruB is a soluble multiphosphoryl-transfer protein that combines N-terminal EIIA, central
  HPr and C-terminal enzyme-I domains in one polypeptide. Its enzyme-I module accepts phosphate from phosphoenolpyruvate,
  and the HPr/EIIA relay supplies the fructose-specific membrane component FruA. This fused architecture
  supports fructose uptake and phosphorylation without requiring separate EI and HPr proteins for that
  relay. The current ATCC33913 sequence differs from the ATCC13951 protein studied genetically; its exact
  kinetic constants and possible participation in other sugar systems remain unresolved.
