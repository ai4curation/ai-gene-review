- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000532509
  - UniProtKB:Q9HXN5
  review:
    summary: Remove. The term is propagated from the root bacterial enzyme I node,
      seeded only by the P. aeruginosa N-acetylglucosamine PTS multiphosphoryl protein
      PA3760, and X. campestris FruB is the fructose-specific relay.
    action: REMOVE
    reason: A substrate-specific transport process placed on the family root node
      descends to every enzyme I paralogue, including fructose-specific MTPs. The
      X. campestris fruB operon encodes the fructose system (with fruK and fruA), and
      the mutant phenotype names fructose and sugars metabolised through it, not
      N-acetylglucosamine. Over-propagation from a too-deep node, as in the PTHR46244
      family review.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000532509
        source_label: PTN000532509
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Root bacterial enzyme I node; the N-acetylglucosamine transport IBD
          is seeded only by Q9HXN5 and is placed too deep for substrate-specific
          paralogues such as fructose MTPs.
      - source_id: UniProtKB:Q9HXN5
        source_label: PA3760
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: P. aeruginosa N-acetylglucosamine PTS multiphosphoryl protein; its
          sugar specificity does not transfer to the fructose-specific FruB.
    supported_by:
    - reference_id: PMID:7496537
      supporting_text: fruB is part of a transcriptional unit together with the fruK
