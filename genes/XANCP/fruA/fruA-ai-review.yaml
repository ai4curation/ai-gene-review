  review:
    summary: FruA performs phosphoryl-transfer-coupled uptake, not carbohydrate:proton symport.
    action: REMOVE
    reason: The InterPro IPR006327 mapping asserts a secondary symport reaction. The established FruA
      PTS reaction modifies fructose to fructose 1-phosphate using protein-bound phosphate; proton cotransport
      is not its demonstrated coupling mechanism. This corrects this mapping, not a claim that every PTS
      transporter lacks any proton interaction.
