id: P23355
gene_symbol: fruA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
description: FruA is the membrane EIIB'BC component of the fructose phosphotransferase system. Its EIIC
  region translocates fructose while its EIIB phosphocysteine relay transfers phosphate to form intracellular
  fructose 1-phosphate. The duplicated N-terminal EIIB' region assists the cognate phosphotransfer interaction.
  FruB supplies phosphate from phosphoenolpyruvate, and FruK converts the imported fructose 1-phosphate
  to fructose 1,6-bisphosphate. The ATCC33913 protein is assigned this role by conserved architecture
  and work on the related ATCC13951 strain; Xanthomonas also has a distinct non-PTS fructose-utilization
  route.
