core_functions:
- description: Catalyzes transport-coupled phosphorylation of D-fructose to intracellular fructose 1-phosphate
    through its EIIC and EIIB domains. The residue-level function is inferred for ATCC33913 from conserved
    Cys126/type-2 architecture and ATCC13951 biochemistry; upstream FruB supplies the phosphorelay.
  molecular_function:
    id: GO:0090582
    label: protein-phosphocysteine-D-fructose-phosphotransferase system transporter activity
