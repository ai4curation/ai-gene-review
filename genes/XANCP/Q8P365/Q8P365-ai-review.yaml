id: Q8P365
gene_symbol: btuE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
description: >-
  BtuE (XCC4213) of Xanthomonas campestris pv. campestris is a 181-residue
  cysteine-type (non-selenium) glutathione peroxidase-fold protein of the BtuE
  subfamily (PANTHER PTHR11592:SF40). It shares a gammaproteobacterial clade
  with Escherichia coli BtuE. It keeps the catalytic tetrad of the family:
  peroxidatic Cys37, Gln71, Trp143 and Asn144. It also has a second cysteine
  (Cys83) at the resolving-cysteine position used by atypical 2-Cys GPx-like
  peroxiredoxins. By homology to E. coli BtuE, it is predicted to act as a
  cytoplasmic thiol peroxidase that reduces hydrogen peroxide and organic or
  lipid hydroperoxides. Thioredoxin is predicted to be the preferred electron
  donor, with weaker glutathione-dependent activity, so the enzyme would help
  defend the cell against oxidative stress. Despite the name, the E. coli
  homolog has no role in vitamin B12 transport. No experiment has yet been
  reported on the Xanthomonas protein itself.
existing_annotations:
- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Cellular response to oxidative stress, propagated from the PANTHER
      PTHR11592 root node PTN002480721. Q8P365 descends from that node through
      the gammaproteobacterial BtuE node PTN000173904.
    action: ACCEPT
    reason: >-
      This IBA follows from the PAINT IBD at the family root PTN002480721, and
      the PANTHER 19 tree places Q8P365 beneath it with no intervening IRD/NOT
      on its lineage. The PAINT negations of this family are on eutherian and
      fungal nodes only. In the closest characterized member of the same
      subfamily and PAINT clade, E. coli BtuE (P06610), btuE is induced by
      oxidative-stress elicitors, and the purified enzyme reduces H2O2 and
      organic hydroperoxides. A peroxide-scavenging enzyme whose expression
      responds to oxidants does part of the work of the cellular response to
      oxidative stress. No Xanthomonas-specific experiment exists, but the
      phylogenetic inference is sound.
    supported_by:
    - reference_id: PMID:20621065
      supporting_text: >-
        The btuE gene was induced when cells were exposed to oxidative stress
        elicitors that included potassium tellurite, menadione and hydrogen
        peroxide, among others, suggesting that BtuE could participate in the
        E. coli response to reactive oxygen species.
    - reference_id: file:XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        Q8P365 descends from PTN000173904 (Gammaproteobacteria, subfamily
        PTHR11592:SF40), the same node that contains experimentally
        characterized E. coli BtuE (P06610).
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Peroxidase activity from the InterPro IPR000889 mapping is correct but
      general. Clade evidence supports the more specific thioredoxin-dependent
      peroxiredoxin activity, with glutathione peroxidase activity as a
      secondary activity.
    action: MODIFY
    reason: >-
      Q8P365 conserves the full GPx catalytic tetrad (C37, Q71, W143, N144),
      plus the resolving-cysteine position C83, which aligns to E. coli BtuE
      C83. Both proteins descend from PAINT node PTN000173904 in subfamily
      PTHR11592:SF40, where PAINT curators placed GO:0008379 thioredoxin
      peroxidase activity by IBD from P06610. Purified E. coli BtuE uses
      thioredoxins A or C in preference to glutathione for H2O2, cumene,
      tert-butyl and linoleic acid hydroperoxides. GO:0140824
      thioredoxin-dependent peroxiredoxin activity (a hydroperoxide-general
      parent of GO:0008379) is the best replacement, because substrate breadth
      was shown. GO:0004602 glutathione peroxidase activity is also listed. It
      is placed by PAINT at the family root, and E. coli BtuE shows
      glutathione-dependent H2O2 decomposition in vitro. The earlier version of
      this review proposed GO:0004602 alone, which ignored the thioredoxin
      preference of the clade. Both proposed terms are is_a descendants of
      GO:0004601.
    proposed_replacement_terms:
    - id: GO:0140824
      label: thioredoxin-dependent peroxiredoxin activity
    - id: GO:0004602
      label: glutathione peroxidase activity
    supported_by:
    - reference_id: PMID:20621065
      supporting_text: >-
        Figure 2 shows that BtuE uses preferentially thioredoxins A or C as
        reducing agents irrespective of the peroxide substrate.
    - reference_id: PMID:20621065
      supporting_text: >-
        Purified BtuE decomposes in vitro hydrogen peroxide in a
        glutathione-dependent manner.
    - reference_id: file:XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        Q8P365 C37 aligns to P06610 C37 (peroxidatic cysteine), and Q8P365 C83
        aligns to P06610 C83 (resolving-cysteine position on helix alpha2 of
        atypical 2-Cys GPx-like peroxiredoxins).
    - reference_id: file:XANCP/Q8P365/Q8P365-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the glutathione peroxidase family.
- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Response to oxidative stress is true for Q8P365, but it is an ancestor of
      cellular response to oxidative stress (GO:0034599), which is accepted in
      this review.
    action: TOO_GENERAL
    reason: >-
      The claim is correct for a BtuE-clade peroxidase, as the IBA row above
      sets out. GO:0034599 already entails it, so the broader InterPro2GO term
      adds no information. The judgment concerns the term only: the claim is
      not false.
    supported_by:
    - reference_id: PMID:20621065
      supporting_text: >-
        suggesting that BtuE could participate in the E. coli response to
        reactive oxygen species
- term:
    id: GO:0098869
    label: cellular oxidant detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Cellular oxidant detoxification, inferred logically from peroxidase
      activity. This is the process in which a cytoplasmic thiol peroxidase
      directly takes part.
    action: ACCEPT
    reason: >-
      The enzyme itself performs the detoxifying step: reduction of H2O2 and
      organic hydroperoxides to water or alcohols. That matches GO:0098869,
      which GO places as a part_of parent of the peroxidase and peroxiredoxin
      activities. The activity is supported for the BtuE clade by PAINT node
      placement and by E. coli BtuE biochemistry, and the catalytic residues
      are conserved in Q8P365.
    supported_by:
    - reference_id: PMID:20621065
      supporting_text: >-
        BtuE also utilizes preferentially thioredoxin A to decompose hydrogen
        peroxide as well as cumene-, tert-butyl-, and linoleic acid
        hydroperoxides, confirming that its active site confers non-specific
        peroxidase activity.
    - reference_id: file:XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        Transfer of BtuE's thioredoxin-dependent hydroperoxide reductase
        activity is supported by node placement and by conservation of both the
        peroxidatic and resolving cysteines.
