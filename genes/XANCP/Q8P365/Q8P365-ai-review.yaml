- id: PMID:20621065
  title: The Escherichia coli btuE gene, encodes a glutathione peroxidase that is
    induced under oxidative stress conditions.
  findings:
  - statement: >-
      Purified E. coli BtuE (P06610), which is in the same PANTHER subfamily
      and PAINT clade (PTN000173904) as Q8P365, reduces H2O2 and cumene,
      tert-butyl and linoleic acid hydroperoxides. It prefers thioredoxins A or
      C to glutathione as the reductant.
    supporting_text: >-
      Figure 2 shows that BtuE uses preferentially thioredoxins A or C as
      reducing agents irrespective of the peroxide substrate.
  - statement: >-
      E. coli btuE expression is induced by oxidative-stress elicitors.
    supporting_text: >-
      The btuE gene was induced when cells were exposed to oxidative stress
      elicitors that included potassium tellurite, menadione and hydrogen
      peroxide
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text was read in the publications cache. This is the only
      biochemical characterization in the BtuE subfamily. It is the IDA/EXP
      source for the E. coli GO:0004602, GO:0008379 and GO:0140824
      annotations, and P06610 is the PAINT seed for GO:0008379 at
      PTN000173904.
- id: file:XANCP/Q8P365/Q8P365-uniprot.txt
  title: UniProt record for Q8P365 (btuE)
  findings:
  - statement: >-
      UniProt classifies Q8P365 as a glutathione peroxidase belonging to the
      glutathione peroxidase family, with an active site at position 37 and
      conserved GSHPx, thioredoxin-like fold, and GPX active site domains.
- id: file:XANCP/Q8P365/Q8P365-deep-research-falcon.md
  title: Falcon deep research for btuE (Q8P365)
  findings:
  - statement: >-
      Falcon deep research found no organism-specific experimental literature
      for Q8P365/btuE in X. campestris. All functional inference is based on
      domain architecture and glutathione peroxidase family membership.
      Bacterial GPx-family proteins generally function in peroxide
      detoxification and oxidative stress defense.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      The falcon run retrieved no literature contexts ("no contexts were
      retrieved"), so its text is ungrounded. In this re-review it is no longer
      used as support. Its one useful finding is that it located no
      Xanthomonas-specific experimental study.
- id: file:XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
  title: Q8P365 re-review bioinformatics (PANTHER tree placement and alignment to
    E. coli BtuE)
  findings:
  - statement: >-
      In the PANTHER 19 tree, Q8P365 descends from PTN000173904
      (Gammaproteobacteria, SF40) together with E. coli BtuE. The Xanthomonas
      paralog Q8PAI2 arises from a lineage-specific duplication. Q8P365 is 49%
      identical to P06610, with conserved C37, C83, Q71, W143 and N144.
core_functions:
- description: >-
    Cytoplasmic thiol peroxidase of the BtuE clade. It reduces hydrogen peroxide
    and organic or lipid hydroperoxides through a peroxidatic cysteine (Cys37),
    with a conserved resolving cysteine (Cys83). Thioredoxin is predicted to be
    the preferred reductant, as for E. coli BtuE.
  molecular_function:
    id: GO:0140824
    label: thioredoxin-dependent peroxiredoxin activity
  directly_involved_in:
  - id: GO:0098869
    label: cellular oxidant detoxification
  - id: GO:0034599
    label: cellular response to oxidative stress
  supported_by:
  - reference_id: PMID:20621065
    supporting_text: >-
      Figure 2 shows that BtuE uses preferentially thioredoxins A or C as
      reducing agents irrespective of the peroxide substrate.
  - reference_id: file:XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
    supporting_text: >-
      Q8P365 descends from PTN000173904 (Gammaproteobacteria, subfamily
      PTHR11592:SF40), the same node that contains experimentally
      characterized E. coli BtuE (P06610).
suggested_questions:
- question: >-
    Does Xanthomonas BtuE (XCC4213) prefer thioredoxin over glutathione like E.
    coli BtuE, and how does it divide work with the paralog XCC1501 (Q8PAI2),
    which has a predicted signal peptide?
suggested_experiments:
- description: >-
    Purify recombinant XCC4213. Assay NADPH-coupled peroxidase activity with
    Xanthomonas TrxA/TrxB versus GSH/glutathione reductase on H2O2,
    tert-butyl, cumene and linoleic acid hydroperoxides, and use C37S and C83S
    mutants to test the 2-Cys mechanism.
