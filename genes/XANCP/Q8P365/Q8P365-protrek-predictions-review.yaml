id: Q8P365
gene_symbol: btuE
taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris ATCC 33913
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for BtuE (XCC4213), a glutathione-peroxidase-family
  protein of Xanthomonas campestris. GOA stops at the generic peroxidase activity; ProTrek
  goes several levels deeper and offers five specific peroxidase chemistries in its top
  five, with the family-correct glutathione peroxidase activity at rank 2. The
  discrimination it does not make is the one that matters for this protein: BtuE-type
  bacterial GPx homologs are typically thioredoxin-dependent rather than
  glutathione-dependent - UniProt's own PANTHER assignment is PTHR11592:SF40,
  "THIOREDOXIN/GLUTATHIONE PEROXIDASE BTUE" - so the thioredoxin peroxidase call at rank 3
  may be the most accurate of the five, and the model ranks it third. Rank 1 is a
  vertebrate GPX4-type specificity that does not apply to a bacterium. ProtNLM2 predicted
  only response to oxidative stress.
  Assessment: 1 correct novel (COR), 1 uncertain (UNC), 1 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/XANCP/Q8P365/Q8P365-uniprot.txt
  - genes/XANCP/Q8P365/Q8P365-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047066
      label: phospholipid-hydroperoxide glutathione peroxidase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 19.60). This is the GPX4 specificity - reduction of
        phospholipid hydroperoxides in membranes, the activity central to ferroptosis
        protection in animals. Bacterial BtuE homologs act on soluble hydroperoxides and are
        not membrane phospholipid peroxidases; nothing in the sequence or in this review
        supports the specificity. The vertebrate GPX4 entries are among the most heavily
        described in SwissProt, which is the likely reason this outranks the correct
        family-level term.
      supported_by:
        - reference_id: file:XANCP/Q8P365/Q8P365-uniprot.txt
          supporting_text: Belongs to the glutathione peroxidase family
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004602
      label: glutathione peroxidase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 18.43), absent from GOA (which carries only the parent peroxidase
        activity) and an exact match to this review's core molecular function. A real
        refinement of the existing annotation and the useful output for this protein. The
        caveat, which the model does not express, is that the reductant for BtuE-type
        enzymes is often thioredoxin rather than glutathione.
      supported_by:
        - reference_id: file:XANCP/Q8P365/Q8P365-uniprot.txt
          supporting_text: Belongs to the glutathione peroxidase family
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0008379
      label: thioredoxin peroxidase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 15.87). Arguably the most accurate call in the list - E. coli BtuE and
        many bacterial GPx-family enzymes use thioredoxin, not glutathione, as reductant, and
        UniProt's PANTHER subfamily for this entry is named "thioredoxin/glutathione
        peroxidase BtuE" - but no assay exists for the Xanthomonas protein and the reductant
        cannot be assigned from sequence. Recorded as uncertain and flagged as a curation
        lead. That the model's most defensible call sits at rank 3, below a vertebrate-specific
        one at rank 1, is a compact illustration of why ProTrek's ranking should not be read
        as a confidence ordering over biological correctness.
      supported_by:
        - reference_id: file:XANCP/Q8P365/Q8P365-uniprot.txt
          supporting_text: PANTHER; PTHR11592:SF40; THIOREDOXIN_GLUTATHIONE PEROXIDASE BTUE; 1.
