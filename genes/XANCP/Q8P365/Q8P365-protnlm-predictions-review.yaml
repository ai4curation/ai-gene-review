id: Q8P365
gene_symbol: btuE
taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
status: COMPLETE
description: >-
  Q8P365 is a BtuE-subfamily glutathione peroxidase-fold thiol peroxidase. By phylogenetic transfer
  from E. coli BtuE it takes part in the cellular response to oxidative stress. The single ProtNLM2
  prediction, response to oxidative stress, is correct but broader than the accepted cellular-response
  annotation.
source_documents:
  - genes/XANCP/Q8P365/Q8P365-uniprot.txt
  - genes/XANCP/Q8P365/Q8P365-goa.tsv
  - genes/XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
  - publications/PMID_20621065.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006979
      label: response to oxidative stress
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Q8P365 belongs to the glutathione peroxidase family and the BtuE subfamily (PANTHER PTHR11592:SF40),
        and descends from the gammaproteobacterial PAINT node PTN000173904 that contains experimentally
        characterized E. coli BtuE (P06610). It conserves the peroxidatic Cys37 active site. Purified E.
        coli BtuE decomposes peroxides and btuE is induced by oxidative-stress elicitors (PMID:20621065),
        which supports transfer of a protective role in the oxidative-stress response. The gene already
        carries an accepted IBA for GO:0034599 cellular response to oxidative stress, an is_a descendant
        of the predicted GO:0006979 (OLS4 ancestry), and the gene review marks the GOA IEA row for
        GO:0006979 itself as TOO_GENERAL. The prediction is correct but less precise than the existing
        supported annotation. No experiment on the Xanthomonas protein itself was found in a PubMed search.
      supported_by:
        - reference_id: file:XANCP/Q8P365/Q8P365-uniprot.txt
          supporting_text: Belongs to the glutathione peroxidase family.
        - reference_id: file:XANCP/Q8P365/Q8P365-uniprot.txt
          supporting_text: PTHR11592:SF40; THIOREDOXIN_GLUTATHIONE PEROXIDASE BTUE
        - reference_id: file:XANCP/Q8P365/Q8P365-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            Q8P365 descends from PTN000173904 (Gammaproteobacteria, subfamily PTHR11592:SF40), the same
            node that contains experimentally characterized E. coli BtuE (P06610).
        - reference_id: PMID:20621065
          supporting_text: >-
            Purified BtuE decomposes in vitro hydrogen peroxide in a glutathione-dependent manner
        - reference_id: PMID:20621065
          supporting_text: >-
            The btuE gene was induced when cells were exposed to oxidative stress elicitors that included
            potassium tellurite, menadione and hydrogen peroxide
