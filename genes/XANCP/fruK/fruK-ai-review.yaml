taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
description: FruK is a soluble ATP-dependent fructose-1-phosphate kinase of the PfkB carbohydrate kinase
  family. It converts the fructose 1-phosphate produced by the fructose PTS to fructose 1,6-bisphosphate
  for further metabolism. This activity is distinct from the free-fructose kinase used by the non-PTS
  bypass. The ATCC33913 protein is assigned its function from conserved FruK architecture and biochemical/genetic
  characterization in ATCC13951; activity toward ribose has not been established for this target.
