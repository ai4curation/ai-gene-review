suggested_questions:
- question: Does a native XCC4145 deletion abolish the DP16 OPG product in ATCC33913, and can complementation
    restore its amount and linkage pattern?
- question: What are the physiological Tat-cleavage site, periplasmic abundance and substrate source for
    XccOpgD?
- question: Which closely related GH186 proteins share this exact cyclase specificity rather than hydrolysis
    or another transfer reaction?
- question: Should GO:1900727 osmoregulated periplasmic glucan biosynthetic process gain an appropriate
    relationship to GO:0051274 beta-glucan biosynthetic process, or a product-qualified subtype, for the
    beta-linked OPG products? Current ontology closure does not entail the latter claim, so both supported
    process assertions must be retained independently.
suggested_experiments:
- description: Compare native ATCC33913 wild-type, opgD deletion and complemented strains by product-resolved
    glucan MS/NMR under defined osmolarities.
  experiment_type: targeted genetics and glucan chemistry
- description: Measure native export and N-terminal processing independently of the signal-deleted recombinant
    construct.
  experiment_type: subcellular fractionation and N-terminal proteomics
