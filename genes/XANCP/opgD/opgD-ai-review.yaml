    - reference_id: PMID:38957137
      supporting_text: 'Only one α-1,6-glucosidic

        bond was identified, with all other bonds being the β-1,2-glucoside

        type'
    - reference_id: file:XANCP/opgD/opgD-source-analysis/primary-evidence.md
      supporting_text: Official RCSB 8X18 entity1 identifies this source strain and a BL21(DE3) expression
        host; deposited sequence equals the frozen 533-residue precursor except D379N and the C-terminal
        LEHHHHHH extension.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN001253664
        source_status: SUPPORTS_TRANSFER
        comment: The inspected IBD propagates beta-glucan biosynthetic involvement from P33136, not a
          hydrolytic molecular mechanism. Direct target cyclization of a beta-1,2 backbone supports this
          biosynthetic role despite the alpha-1,6 closing bond. Retaining the independently true process
          does not allege ancestral loss or a defective source node.
