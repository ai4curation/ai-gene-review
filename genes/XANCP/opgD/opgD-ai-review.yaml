proposed_new_terms:
- proposed_name: alpha-1,6-cyclized beta-1,2-glucohexadecaose synthase activity
  proposed_definition: Catalysis of an anomer-inverting transglycosylation that converts a linear beta-1,2-glucan
    substrate into a cyclic 16-glucose product containing fifteen beta-1,2-glucosidic linkages and one
    alpha-1,6-glucosidic linkage. The reaction cleaves the donor chain and forms the alpha-1,6 ring-closing
    bond rather than using water as the glycosyl acceptor.
  proposed_parent:
    id: GO:0016757
    label: glycosyltransferase activity
  justification: Current official GO searches did not establish a term for this substrate/product-specific
    cyclization. GO:0033913 specifies hydrolysis, while cyclomaltodextrin glucanotransferase acts on a
    different glucan linkage system. A dedicated term distinguishes the experimentally characterized XccOpgD
    reaction from E. coli OpgD hydrolysis and from nonspecific family-wide transfers. No invented GO or
    EC identifier is assigned.
  supported_by:
  - reference_id: PMID:38957137
    supporting_text: converts linear β-1,2-glucan into CβG16α specifically.
  - reference_id: PMID:38957137
    supporting_text: 'Only one α-1,6-glucosidic

      bond was identified, with all other bonds being the β-1,2-glucoside

      type'
  - reference_id: file:XANCP/opgD/opgD-source-analysis/primary-evidence.md
    supporting_text: Official RCSB 8X18 entity1 identifies this source strain and a BL21(DE3) expression
      host; deposited sequence equals the frozen 533-residue precursor except D379N and the C-terminal
      LEHHHHHH extension.
core_functions:
- description: Anomer-inverting cyclization of linear beta-1,2-glucan into the alpha-1,6-closed DP16 OPG
    product, demonstrated with signal-deleted, C-terminal His6 recombinant wild-type protein. Periplasmic
    action is inferred from native export architecture; native pathway flux and physiological cleavage
    were not measured.
  proposed_molecular_function: alpha-1,6-cyclized beta-1,2-glucohexadecaose synthase activity
