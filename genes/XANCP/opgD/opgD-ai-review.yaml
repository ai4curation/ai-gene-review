    label: beta-glucan biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001253664
  - UniProtKB:P33136
  review:
    summary: The demonstrated cyclization directly contributes to biosynthesis of a predominantly beta-linked
      glucan.
    action: ACCEPT
    reason: The sequence-grounded ATCC33913-reference XccOpgD performs the cyclization step converting
      linear beta-1,2-glucan into the DP16 product with one alpha-1,6 closing bond and otherwise beta-1,2
      linkages. This is direct chemical participation in beta-glucan biosynthesis, not a necessity-only
      inference; native deletion/rescue and flux were not measured here. The PTN001253664 IBD seeded by
      P33136 concerns biosynthetic involvement, not an OpgG-like hydrolase mechanism, and the existing
      lineage assessment reports no detected IRD/IKR. Retain GO:0051274 independently of the OPG-specific
      GO:1900727 already proposed by other rows, because the latter does not currently entail the beta-glucan
      process.
