id: Q8P3C6
gene_symbol: opgD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190485
  label: Xanthomonas campestris pv. campestris str. ATCC 33913
description: OpgD from Xanthomonas campestris pv. campestris ATCC 33913 is a GH186-family anomer-inverting
  transglycosylase. Recombinant protein converts linear beta-1,2-glucan into a cyclic 16-glucose product
  containing fifteen beta-1,2 linkages and one alpha-1,6 linkage. This chemistry supports its role in
  osmoregulated periplasmic glucan biosynthesis and differs from the hydrolysis performed by Escherichia
  coli OpgD. Its Tat-type signal and conserved localization support periplasmic function, although native
  export, cleavage and pathway flux have not been directly measured in the cited assays.
