description: BP3757 is the MlaF-family ATPase of the Bordetella pertussis Mla phospholipid-transport system.
  Its conserved nucleotide-binding domain supplies ATP-dependent energy to the inner-membrane MlaFED complex,
  supporting outer-membrane lipid asymmetry. Bordetella lacks an identifiable MlaB homolog; MlaF-associated
  envelope and growth phenotypes depend on physiological conditions.
