id: Q7VZI5
gene_symbol: BP0922
taxon:
  id: NCBITaxon:257313
  label: Bordetella pertussis Tohama I
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for BP0922, an uncharacterised PrpF-family protein
  of Bordetella pertussis with no GOA annotations. This is the single best result in the
  benchmark: the top hit is methylitaconate delta-isomerase activity at a score of 19.66
  - an exact match to this review's core molecular function, absent from GOA, and
  separated from rank 2 by 3.2 score units - and the free-text Function channel returns
  the PrpF description of the 2-methylcitrate cycle at 21.03. The remaining hits
  enumerate other small-molecule isomerase and hydratase activities in the same
  mechanistic neighbourhood, none of which is supported for this protein. ProtNLM2 made
  no GO prediction here, so on this entry ProTrek supplies a specific, correct annotation
  where the alternative model supplied nothing.
  Assessment: 1 correct novel (COR), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/BORPE/Q7VZI5/Q7VZI5-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0050100
      label: methylitaconate delta-isomerase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 19.66) and an exact match to the core molecular function this
        review derived independently from the PrpF domain (IPR007400/PF04303), the
        diaminopimelate-epimerase-like fold, and 2-methylcitrate cycle reconstruction. The
        protein has no GOA annotations at all, so this is a fully novel, specific and correct
        EC-level assignment - the outcome the whole retrieval approach is meant to deliver
        for unannotated bacterial proteins. Confidence is bounded by the same limit as the
        review itself: no biochemistry has been done on this protein.
      supported_by:
        - reference_id: file:BORPE/Q7VZI5/Q7VZI5-uniprot.txt
          supporting_text: Belongs to the PrpF family
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047584
      label: 4-oxalmesaconate hydratase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 16.44). A gallate-degradation enzyme (GalB/LigJ) that shares the
        PrpF-like fold; the reaction is a hydration, not the cis-trans isomerisation PrpF
        catalyses, and B. pertussis is not known to degrade gallate. This is the fold's other
        occupant being reported alongside the right answer, with a 3.2-unit score gap
        separating them - a case where the score does discriminate, unlike most queries in
        this benchmark.
      supported_by:
        - reference_id: file:BORPE/Q7VZI5/Q7VZI5-uniprot.txt
          supporting_text: Belongs to the PrpF family
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047613
      label: aconitate decarboxylase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 15.86). Cis-aconitate decarboxylase (IRG1/ACOD1) produces itaconate and
        is mechanistically distinct from PrpF, though it acts on a chemically adjacent
        substrate; it is a mammalian and fungal immunometabolic enzyme with no B. pertussis
        counterpart. Ranks 2-5 all substitute a different reaction on a similar C5/C6
        dicarboxylate, which is the substrate-neighbourhood pattern seen throughout this
        benchmark - the difference here is that the correct one won by a clear margin.
      supported_by:
        - reference_id: file:BORPE/Q7VZI5/Q7VZI5-uniprot.txt
          supporting_text: Belongs to the PrpF family
