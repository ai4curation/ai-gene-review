id: Q7VZI5
gene_symbol: Q7VZI5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:257313
  label: Bordetella pertussis Tohama I
description: >-
  Q7VZI5 (ordered locus BP0922) is an uncharacterised 391-residue protein of
  Bordetella pertussis in the PrpF/DUF453 family (PANTHER PTHR43709, subfamily SF2;
  Pfam PF04303; InterPro IPR007400). This family adopts the cofactor-independent,
  two-domain diaminopimelate epimerase (DapF) fold. Its characterised members
  isomerise unsaturated organic acids: the PrpF methylaconitate cis-trans/positional
  isomerase of the AcnD-dependent 2-methylcitrate cycle, the 3-methylitaconate
  delta-isomerase Mii, the fungal aconitate delta-isomerase Adi1, and the
  oxalomesaconate delta-isomerase and tautomerase enzymes LigU and GalD. Q7VZI5
  conserves the catalytic lysine/cysteine pair that these enzymes share, so it is
  probably a soluble cytoplasmic isomerase of this kind. It is only about 36%
  identical to the PrpF enzymes, lacks the PrpF-specific TIGR02334 signature, and is
  encoded outside the B. pertussis prp (methylcitrate cycle) gene cluster, which has
  its own PrpF (BP2370). Its neighbours instead include an MmgE/PrpD-family protein,
  a succinate-semialdehyde dehydrogenase and a tricarboxylate-transport-like protein.
  The physiological substrate and pathway are unknown. Q7VZI5 is about equally
  related (35-45% identity) to characterised members with different substrates, so
  sequence similarity does not assign a specific reaction.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISS
  original_reference_id: file:BORPE/Q7VZI5/Q7VZI5-deep-research-falcon.md
  review:
    summary: >-
      This annotation is not in GOA. Q7VZI5 has no hydrophobic N-terminal signal
      sequence and no transmembrane-length hydrophobic segment (maximum
      Kyte-Doolittle 19-residue mean 1.52 overall and 0.55 in the first 40
      residues). Characterised members of the family, such as S. oneidensis PrpF,
      are soluble intracellular enzymes.
    action: NEW
    reason: >-
      Cytoplasm is a reasonable location for a soluble, cofactor-independent
      family isomerase that has no export or membrane signals. Confidence is modest,
      because the hydropathy screen is crude and there is no direct localisation
      data.
    supported_by:
      - reference_id: file:BORPE/Q7VZI5/Q7VZI5-bioinformatics/RESULTS.md
        supporting_text: "There is no sign of a signal peptide or a transmembrane segment."
- term:
    id: GO:0016853
    label: isomerase activity
  evidence_type: ISS
  original_reference_id: file:BORPE/Q7VZI5/Q7VZI5-bioinformatics/RESULTS.md
  review:
    summary: >-
      Every characterised member of PTHR43709 is a cofactor-independent isomerase
      of the DapF fold. They include PrpF (methylaconitate/aconitate cis-trans
      isomerase), Mii (3-methylitaconate delta-isomerase), Adi1 (aconitate
      delta-isomerase), LigU (oxalomesaconate delta-isomerase) and GalD
      (oxalomesaconate tautomerase). Q7VZI5 keeps the proposed catalytic residues,
      Lys65 and Cys99, which correspond to PrpF Lys73 and Cys107.
    action: NEW
    reason: >-
      Isomerase activity is the most specific function shared by all
      characterised members of the family, and Q7VZI5 retains the catalytic
      residues. The family includes both C=C-transposing delta-isomerases and a
      keto-enol tautomerase. Q7VZI5 has no close characterised neighbour, so no
      narrower class (GO:0016863 or GO:0016862) or substrate-specific child is
      warranted. The PAINT IBD for GO:0016863 is seeded by Shewanella PrpF, and
      Q7VZI5 has not inherited it.
    supported_by:
      - reference_id: file:BORPE/Q7VZI5/Q7VZI5-uniprot.txt
        supporting_text: "InterPro; IPR007400; PrpF-like."
      - reference_id: PMID:17567742
        supporting_text: "Results from in vitro studies show that PrpF isomerizes trans -aconitate to cis -aconitate."
      - reference_id: PMID:17567742
        supporting_text: "this family of proteins can utilize a variety of residues as catalytic acids or bases"
      - reference_id: file:BORPE/Q7VZI5/Q7VZI5-bioinformatics/RESULTS.md
        supporting_text: "The proposed catalytic Lys/Cys pair is conserved across the family, Q7VZI5 included."
references:
- id: PMID:12910271
  title: Comparative analysis of the genome sequences of Bordetella pertussis, Bordetella
    parapertussis and Bordetella bronchiseptica
  findings:
    - statement: >-
        Establishes the complete genome sequence of Bordetella pertussis strain Tohama I,
        including locus BP0922.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Genome-sequence paper cited in the UniProt record (RX line). It is the source
      of the sequence only and makes no functional claim about BP0922.
- id: PMID:17567742
  title: 'The three-dimensional crystal structure of the PrpF protein of Shewanella oneidensis
    complexed with trans-aconitate: insights into its biological function.'
  findings:
    - statement: >-
        S. oneidensis PrpF has a DapF-like fold, isomerizes trans-aconitate to
        cis-aconitate in vitro, and uses Lys73 (with Cys107 nearby) at the active
        site. It is required only in bacteria that use AcnD. PrpF and Mii share only
        39% identity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The study characterises the PrpF clade of PTHR43709:SF2, not Q7VZI5. It is used
      for the family-level isomerase activity, for the active-site residue mapping,
      and for the point that the methylcitrate-cycle role belongs to AcnD-associated
      PrpF.
- id: PMID:29145506
  title: The PrpF protein of Shewanella oneidensis MR-1 catalyzes the isomerization
    of 2-methyl-cis-aconitate during the catabolism of propionate via the AcnD-dependent
    2-methylcitric acid cycle.
  findings:
    - statement: >-
        SoPrpF isomerizes the AcnD product (putatively 4-methyl-cis-aconitate) to
        2-methyl-cis-aconitate, the aconitase substrate in the 2-methylcitrate cycle.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Defines the physiological reaction of the PrpF clade. It is background for why
      the propionate-catabolism role belongs to the B. pertussis paralog BP2370 and
      not to Q7VZI5.
- id: file:BORPE/Q7VZI5/Q7VZI5-uniprot.txt
  title: UniProt entry Q7VZI5
  findings:
    - statement: >-
        Records the PrpF-like domain (IPR007400), the PrpF Pfam domain (PF04303),
        PANTHER PTHR43709:SF2 and the diaminopimelate epimerase-like fold. The
        recommended name is generated by ProtNLM, and the family similarity note
        rests on ARBA. Neither is used as evidence here.
- id: file:BORPE/Q7VZI5/Q7VZI5-deep-research-falcon.md
  title: Deep research summary for Q7VZI5
  findings:
    - statement: >-
        States that no organism-specific experimental literature exists for
        BP0922.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      No longer used as support. It restates the database name and mixes up the
      chemistry: it describes 3-methylitaconate to 2-methylaconitate, which is
      neither the Mii reaction (to dimethylmaleate) nor the PrpF reaction. It also
      assigns propionate catabolism without considering the prp-operon paralog. Its
      only literature citations (Tang et al. 2023, a Foods paper on herbal extracts)
      are irrelevant. Kept because earlier rows cite it as original_reference_id.
- id: file:BORPE/Q7VZI5/Q7VZI5-bioinformatics/RESULTS.md
  title: Q7VZI5 PTHR43709 comparison, active-site mapping, genomic context and hydropathy
  findings:
    - statement: >-
        Q7VZI5 is 36% identical to the three PrpF proteins (which are 78-80%
        identical to each other, including B. pertussis BP2370) and lacks
        TIGR02334. It is 35-45% identical to all other characterised SF2 and SF3
        members.
    - statement: >-
        Q7VZI5 conserves the PrpF catalytic Lys/Cys pair (K65, C99). It has
        arginine at the PrpF K281 carboxylate-binding position.
    - statement: >-
        BP0922 lies outside the prp cluster (BP2368-BP2371), next to an
        MmgE/PrpD-family protein (BP0918) and a succinate-semialdehyde
        dehydrogenase (BP0919).
core_functions:
- description: >-
    Predicted cofactor-independent isomerase of the PrpF/DapF-fold family, acting
    on an unidentified unsaturated organic-acid substrate in the cytoplasm. Its
    physiological pathway is unknown and is distinct from the methylcitrate-cycle
    role of the B. pertussis PrpF paralog BP2370.
  molecular_function:
