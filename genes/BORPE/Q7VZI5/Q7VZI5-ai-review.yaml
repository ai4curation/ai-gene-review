suggested_questions:
  - question: >-
      What is the substrate of BP0922? The gene is paired with an MmgE/PrpD-family
      dehydratase (BP0918) in the same cluster. Does this pair form an
      AcnD/PrpF-like dehydratase-isomerase module for another tricarboxylic or
      methyl-branched acid, such as an alternative methylaconitate,
      homoaconitate-like or itaconate-derived substrate?
  - question: >-
      Does a phylogeny of PTHR43709:SF2 place BP0922 in a clade with Mii, with Adi1,
      with YraM, or in a separate clade? Does that clade include any characterised
      member?
suggested_experiments:
  - hypothesis: >-
      Recombinant Q7VZI5 isomerises a C6/C7 unsaturated tricarboxylic or
      dicarboxylic acid, and the activity depends on Lys65 and Cys99.
    description: >-
      Purify Q7VZI5 and screen candidate substrates by HPLC or NMR: cis- and
      trans-aconitate, 2- and 4-methylaconitate isomers, itaconate and
      3-methylitaconate, and oxalomesaconate. Compare with K65A and C99A mutants.
    experiment_type: in vitro enzyme assay
  - hypothesis: >-
      BP0922 is needed for growth on a carbon source catabolised by the
      BP0918-BP0925 cluster, not for growth on propionate.
    description: >-
      Grow a B. pertussis or B. bronchiseptica deletion of the BP0922 ortholog on
      propionate and on candidate organic acids, alongside a prpF (BP2370 ortholog)
      deletion as comparator. Complement both mutants.
    experiment_type: microbial growth assay
