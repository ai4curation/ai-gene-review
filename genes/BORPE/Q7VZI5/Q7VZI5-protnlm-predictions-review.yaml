status: COMPLETE
description: >-
  ProtNLM2 made no predictions (GO or subcellular location) for
  PrpF family protein. The model returned only a protein name.
  This is an assessed absence. The gene has no GOA annotations, and the gene
  review supports only isomerase activity (GO:0016853) in the cytoplasm,
  transferred at family level from characterised PTHR43709 (PrpF/DUF453)
  members; the physiological substrate is unknown. The family-level name
  "PrpF family protein" is consistent with this. It does not assign the
  PrpF-specific methylaconitate isomerase reaction, which the review argues
  against because Q7VZI5 lacks the TIGR02334 signature and lies outside the
  prp gene cluster. A PubMed search for the locus tag BP0922 returned no
  papers, so there is no gene-specific evidence for a more specific term.
