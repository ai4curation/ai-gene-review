  label: Bordetella pertussis Tohama I
description: BP3761 is the soluble MlaC-family phospholipid carrier of Bordetella pertussis. Its signal
  peptide directs export to the periplasm, where the carrier is inferred to shuttle lipid between the
  outer-membrane MlaA interface and inner-membrane MlaFED machinery. Deposited structures of its mature
  sequence contain bound phosphatidylethanolamine, directly supporting lipid binding; native transfer
  direction and loading stoichiometry remain unresolved.
core_functions:
- description: Binds phospholipid in the mature MlaC carrier. Deposited recombinant structures11HY and11IF
    contain phosphatidylethanolamine and an exact match to Q7VSZ6 residues27–207; native lipid specificity
    and occupancy are not determined by those structures.
