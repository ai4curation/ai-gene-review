  label: Bordetella pertussis Tohama I
description: BP3760 is an MlaA-family lipoprotein of Bordetella pertussis. It is predicted to act at the
  outer membrane, helping transfer misplaced phospholipids to the periplasmic MlaC carrier for return
  through the Mla system. Its MlaA domain and lipoprotein signal support this role, while the cognate
  porin partner and target-specific transfer kinetics remain unresolved.
