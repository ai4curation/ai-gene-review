core_functions:
- description: Contributes the outer-membrane lipid extraction/loading interface of the Mla pathway. Specific
    MlaA architecture, a lipidated signal-peptide cleavage product and the cognate Mla locus support this
    role; the exact Bordetella porin partner and native direction were not measured.
  supported_by:
