- id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical for bacterial outer
    membrane asymmetry.
  findings:
  - statement: Purified E. coli MlaC/MlaFEDB shows spontaneous exchange with ATP-enhanced retrograde movement.
      This is ortholog mechanism evidence, not a Bordetella directional reconstitution.
    supporting_text: We reveal that MlaC spontaneously transfers PLs to the IM transporter in an MlaD-dependent
      manner that can be further enhanced by coupled ATP hydrolysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli MlaC/MlaFEDB shows spontaneous exchange with ATP-enhanced retrograde
      movement. This is ortholog mechanism evidence, not a Bordetella directional reconstitution.
- id: PMID:40168124
  title: Following phospholipid transfer through the OmpF(3)-MlaA-MlaC lipid shuttle with native mass
    spectrometry.
  findings:
  - statement: An E. coli porin–MlaA complex directly promotes MlaC lipid loading. This supports the conserved
      outer-membrane interface mechanism, without identifying the Bordetella porin partner or proving
      native target flux.
    supporting_text: significant enrichment of PG over PE
