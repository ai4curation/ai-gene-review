id: C6T1A2
gene_symbol: C6T1A2
taxon:
  id: NCBITaxon:3847
  label: Glycine max
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for soybean ZFP1, a Q-type C2H2 zinc-finger
  transcription factor with a QALGGH DNA-binding motif and a C-terminal EAR-like
  repression motif. This protein has no GOA annotations at all, so it is the kind of
  entry a retrieval tool is meant to help with. ProTrek's five top GO calls are all
  biological processes borrowed from Arabidopsis ZFP5/ZFP8 - gibberellin and cytokinin
  responses and trichome initiation - and none of them names the two things that are
  actually well supported here: DNA-binding transcription factor activity and nuclear
  localisation. The free-text Function channel again does better, returning both the
  ZFP5/ZFP8 trichome description and, at rank 2, the ZAT10/ZAT12-type "transcriptional
  repressor ... binding to their promoter regions in a DNA sequence-specific manner"
  sentence that matches the EAR motif. ProtNLM2 predicted nucleus plus negative
  regulation of ABA signalling for the same protein, which is closer to the supported
  biology.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (PLI).
