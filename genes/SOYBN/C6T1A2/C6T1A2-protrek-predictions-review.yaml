predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0010373
      label: negative regulation of gibberellin biosynthetic process
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 17.61). The Q-type C2H2 family in plants is large and
        functionally heterogeneous; gibberellin-pathway regulation is characterised for the
        ZFP5/ZFP8/GIS trichome-initiation clade, not for this protein, whose closest
        characterised ortholog is AtZFP7 (ABA signalling) and whose EAR motif points to
        general transcriptional repression. Assigning a specific hormone pathway on the
        strength of a shared QALGGH zinc finger is a subfamily-level over-assignment.
      supported_by:
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-deep-research-falcon.md
          supporting_text: >-
            Based on InterPro domain annotation showing C2H2-type zinc finger domains (IPR013087,
            IPR036236, IPR053266), this protein is predicted to function as a DNA-binding transcription factor
            localized to the nucleus.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0009739
      label: response to gibberellin
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 17.43). A much weaker claim than rank 1 - "response to gibberellin" is
        satisfied by any transcriptional change under GA - and plant C2H2 repressors of this
        class are commonly hormone-responsive, so it cannot be refuted from what is known.
        But there is no expression or phenotype evidence for this protein either, and the
        soybean ORFeome context that produced it was a drought-resistance screen rather than
        a GA screen. Left as uncertain: a lead, not an annotation.
      supported_by:
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-deep-research-falcon.md
          supporting_text: >-
            Based on InterPro domain annotation showing C2H2-type zinc finger domains (IPR013087,
            IPR036236, IPR053266), this protein is predicted to function as a DNA-binding transcription factor
            localized to the nucleus.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1905499
      label: trichome papilla formation
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 17.26). Trichome papilla formation is the specific developmental
        readout of the Arabidopsis GIS/ZFP5/ZFP8 module and is transferred here purely by
        zinc-finger similarity. Soybean trichome development is not known to involve this
        gene, and the prediction is several inferential steps beyond anything the sequence
        supports. It illustrates a systematic bias in the GO channel for this protein: all
        five top hits are biological processes, and the well-supported molecular function
        (DNA-binding transcription factor activity) and location (nucleus) never appear.
      supported_by:
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-hypotheses/core-function-1-go-0003700/openscientist.md
          supporting_text: >-
            QALGGH motif (residues 92-97) is the diagnostic marker for Q-type C2H2 zinc finger
            transcription factors. AlphaFold pLDDT 91.5 for zinc finger domain. C-terminal EAR-like repression
            motif present. Same-species evidence from GmZAT10-1 (PMID:40158630) confirms soybean C2H2 ZFPs function
            as DNA-binding transcription factors.
