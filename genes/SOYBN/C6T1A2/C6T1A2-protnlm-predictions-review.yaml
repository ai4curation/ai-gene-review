id: C6T1A2
gene_symbol: C6T1A2
taxon:
  id: NCBITaxon:3847
  label: Glycine max
status: COMPLETE
description: >-
  C6T1A2 (soybean GLYMA_17G165600) is a single-finger plant Q-type C2H2 zinc-finger protein in
  PTHR47593:SF9, a lineage with no experimentally characterised member and no PAINT annotation. Its
  domain architecture suggests a nuclear transcription factor, but neither nuclear localization nor a
  role in ABA signaling has been tested for C6T1A2 or any SF9 member; the Arabidopsis ZFP proteins with
  ABA phenotypes lie in a different PANTHER tree.
