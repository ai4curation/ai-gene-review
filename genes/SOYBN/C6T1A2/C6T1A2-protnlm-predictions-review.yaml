    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0009788
      label: negative regulation of abscisic acid-activated signaling pathway
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        C6T1A2 is a single-finger Q-type C2H2 zinc-finger protein in PTHR47593:SF9. Arabidopsis ZFP3
        and related ZFPs confer ABA insensitivity at germination when overexpressed (PMID:24808098),
        and the PAINT GO:0009788 node covering Arabidopsis ZFP4/ZFP7 lies in the PTHR45730 tree, which
        does not contain C6T1A2; those proteins are only about 34-37% identical to it. The soybean
        QALGGH protein GmZFP3 (a chromosome 7 locus, not C6T1A2) acts negatively in drought tolerance and
        may act through an ABA-dependent pathway (PMID:27047508), which is not evidence for this gene. No
        experiment on C6T1A2 or any SF9 member tests ABA signaling, and no rows exist in GOA, so the
        prediction is plausible as a family-class hypothesis but cannot be validated or refuted.
      supported_by:
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The ABA-signalling annotation that PAINT curators placed on the Arabidopsis
            ZFP4/ZFP7 node cannot be inherited by C6T1A2, because that node is in a different tree.
        - reference_id: PMID:27047508
          supporting_text: >-
            GmZFP3 might be involved in the ABA-dependent pathway during the drought stress
            response.
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-uniprot.txt
          supporting_text: >-
            ID   C6T1A2_SOYBN            Unreviewed;       210 AA. ... DR   InterPro; IPR053266; Zinc_finger_protein_7.
            ... DR   InterPro; IPR013087; Znf_C2H2_type. ... FT   DOMAIN          79..106 ... FT                   /note="C2H2-type"
        - reference_id: PMID:24808098
          supporting_text: >-
            ZFP3, a nuclear C2H2 zinc finger protein
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-hypotheses/prediction-negative-regulation-aba-signaling/openscientist.md
          supporting_text: exact GO:0009788 role cannot be established from sequence, orthology, or
            domain evidence alone
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005634
      label: nucleus
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        C6T1A2 has one Q-type C2H2 zinc finger (QALGGH, residues 92-97) and was cloned in a soybean
        transcription-factor ORFeome, so a nuclear location is expected from domain architecture. It has
        not been tested for C6T1A2 or any PTHR47593:SF9 member. Arabidopsis ZFP3 is nuclear
        (PMID:24808098) but lies in a different PANTHER tree, so this is class-level context rather than
        a phylogenetic transfer, and the PAINT nucleus node (PTN009184003) is likewise outside the
        C6T1A2 tree. A soybean QALGGH relative, GmZFP3, was distributed throughout the cell rather than
        confined to the nucleus (PMID:27047508), so domain class alone does not fix the localization.
        Nucleus is absent from GOA for this gene. The prediction is plausible but supported only by
        domain inference.
      supported_by:
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The QALGGH motif of plant Q-type C2H2 zinc fingers is present at residues 92-97.
        - reference_id: file:SOYBN/C6T1A2/C6T1A2-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            It sits in a Pentapetalae-duplicated
            PTHR47593:SF9 lineage that has no experimentally characterised member and no PAINT
            annotation.
        - reference_id: PMID:24808098
          supporting_text: >-
            ZFP3, a nuclear C2H2 zinc finger protein
        - reference_id: PMID:27047508
          supporting_text: >-
            subcellular localization analysis indicated that
            GmZFP3 was ubiquitously distributed in plant cells
