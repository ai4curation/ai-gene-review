id: C6T1A2
gene_symbol: C6T1A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3847
  label: Glycine max
description: >-
  C6T1A2 is the 210-residue product of soybean GLYMA_17G165600 (Glyma17g18110;
  NCBI Gene 732609, also recorded as ZFP1). It is a plant Q-type C2H2 zinc-finger
  protein. It has a single C2H2 zinc finger (residues 79-106) carrying the
  plant-specific QALGGH motif (residues 92-97), disordered N-terminal and central
  regions with an acidic N-terminus, and a C-terminal LDLRL sequence that matches
  the LxLxL EAR-like transcriptional repression motif. This domain organisation is
  typical of single-finger plant C2H2 transcription factors, so the protein most
  likely acts as a nuclear, sequence-specific DNA-binding transcription factor,
  possibly a repressor. In PANTHER it belongs to subfamily SF9 of PTHR47593. SF9 is
  a lineage that arose by a duplication in the core eudicots (Pentapetalae) and
  contains no experimentally characterised member. The Arabidopsis ZFP proteins
  that regulate ABA responses during germination (ZFP3, ZFP4, ZFP7) are only about
  35% identical to it and are placed in a different PANTHER tree. No gene-specific
  experimental study of C6T1A2 has been published. Its transcript was cloned in a
  soybean drought-associated transcription factor ORFeome.
existing_annotations:
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: UniProtKB:C6T1A2
  review:
    summary: >-
      Proposed annotation. GOA has no annotation for C6T1A2. The protein has one
      C2H2 zinc finger with the plant Q-type QALGGH motif, the signature of
      single-finger plant C2H2 transcription factors, and its transcript was cloned
      in a soybean transcription factor ORFeome. No experimental assay of C6T1A2 or
      of any PTHR47593:SF9 member exists, so this is a domain-level inference.
    action: NEW
    reason: >-
      The Q-type C2H2 zinc finger is a DNA-binding domain, and the QALGGH helix is
      conserved across the plant single-finger transcription factors (the
      Arabidopsis ZFP proteins and soybean SF8/SF9 paralogs; see RESULTS-rereview.md).
      This makes DNA-binding transcription factor activity the best-supported
      molecular function. The inference does not come from a PAINT node: the PAINT
      GO:0000976 node (PTN009184003) is in the PANTHER PTHR45730 tree, which does not
      contain C6T1A2. A more specific term (e.g. repressor activity, implied by the
      EAR-like motif) is not asserted, because no repression assay exists.
