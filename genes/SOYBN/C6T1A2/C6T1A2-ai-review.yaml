core_functions:
- description: >-
    Predicted sequence-specific DNA-binding transcription factor, acting in the
    nucleus through a single plant Q-type (QALGGH) C2H2 zinc finger. A C-terminal
    EAR-like LxLxL motif suggests it may act as a repressor. This is inferred from
    domain architecture only. No member of its PANTHER subfamily (PTHR47593:SF9)
    has been characterised experimentally.
  molecular_function:
