proposed_new_terms: []
suggested_questions:
- question: Does C6T1A2 bind DNA through its QALGGH zinc finger (and if so, which
    sequence, for example the AGT core bound by other Q-type ZFPs)? Does its EAR-like
    C-terminus make it a transcriptional repressor?
  experts: []
- question: The PAINT nodes listed in interpro/panther/PTHR47593/PTHR47593-paint.tsv
    (PTN008158895, PTN009184003) belong to the PANTHER 19 PTHR45730 tree. Should
    PTHR47593 (which contains C6T1A2) receive its own PAINT review? Did the
    Pentapetalae SF8/SF9 duplication separate functionally distinct lineages?
  experts: []
- question: Does any PTHR47593:SF9 member act in ABA or drought responses, given that
    the ABA role is established only for Arabidopsis ZFPs in a different PANTHER tree?
  experts:
  - Henry T. Nguyen
suggested_experiments:
- description: Test C6T1A2 in a yeast GAL4-BD or plant protoplast LUC reporter assay,
    with and without the C-terminal LDLRL motif, for activation or repression
    activity. Define its DNA-binding specificity by EMSA or DAP-seq.
  hypothesis: C6T1A2 binds specific DNA sequences via its Q-type C2H2 zinc finger
    and represses transcription through its EAR-like motif.
  experiment_type: transcription factor activity assay
- description: Localise a C6T1A2-GFP fusion in soybean protoplasts or Nicotiana
    benthamiana leaf epidermis.
  hypothesis: C6T1A2 localizes to the nucleus.
  experiment_type: subcellular localization by fluorescent protein fusion
- description: Phenotype CRISPR/Cas9 mutants of the SF9 paralogs (GLYMA_17G165600
    together with the GLYMA_05G100900 homeolog) under ABA and drought treatments,
    measuring germination and stress-responsive gene expression.
  hypothesis: SF9 ZFPs modulate ABA or drought responses in soybean, as the
    paralogous Arabidopsis ZFPs do.
  experiment_type: loss-of-function genetics with stress phenotyping
