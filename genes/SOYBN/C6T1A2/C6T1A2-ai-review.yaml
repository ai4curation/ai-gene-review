references:
- id: PMID:26268547
  title: "Soybean transcription factor ORFeome associated with drought resistance:
    a valuable resource to accelerate research on abiotic stress resistance"
  findings:
  - statement: C6T1A2 (Glyma17g18110.1) was cloned as part of a soybean transcription
      factor ORFeome associated with drought resistance (GenBank KT031152). The C2H2
      zinc fingers are one of the seven largest transcription factor families in the
      collection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Source of the KT031152 sequence. It classifies the gene as a C2H2-ZF
      transcription factor but contains no gene-specific functional data.
- id: PMID:24808098
  title: The Arabidopsis ZINC FINGER PROTEIN3 Interferes with Abscisic Acid and Light
    Signaling in Seed Germination and Plant Development.
  findings:
  - statement: Arabidopsis ZFP3 is a nuclear C2H2 zinc-finger protein. Overexpression
      of ZFP3 and the related Arabidopsis ZFP1, ZFP4, ZFP6 and ZFP7 confers ABA
      insensitivity at germination.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract only. It concerns Arabidopsis ZFPs, which PANTHER 19 places in the
      PTHR45730 tree, not in the PTHR47593:SF9 lineage of C6T1A2. The Arabidopsis
      ZFP1 named here is not soybean ZFP1 (C6T1A2). The paper is used only as
      class-level context for nuclear localisation; its ABA findings are not
      transferred.
- id: UniProtKB:C6T1A2
  title: UniProtKB entry C6T1A2 (C6T1A2_SOYBN), C2H2-Zn transcription factor, Glycine max.
  findings:
  - statement: 210-aa unreviewed (TrEMBL) protein with a single C2H2-type zinc finger
      domain (residues 79-106), two disordered regions, and an N-terminal acidic
      compositional bias.
  - statement: InterPro classifies the protein in IPR053266 (Zinc_finger_protein_7),
      IPR036236 (Znf_C2H2_sf) and IPR013087 (Znf_C2H2_type). PANTHER places it in
      PTHR47593:SF9 (C2H2-TYPE DOMAIN-CONTAINING PROTEIN) within PTHR47593 (ZINC
      FINGER PROTEIN 4-LIKE).
  - statement: The only GO annotation in the UniProt DR lines is GO:0008270 (zinc ion
      binding, IEA:UniProtKB-KW). The GOA export has no rows.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct UniProt entry, PE 2 (transcript level), with computational annotation
      only. The IPR053266 name "Zinc_finger_protein_7" is a family label and does
      not establish orthology to Arabidopsis ZFP7.
- id: file:SOYBN/C6T1A2/C6T1A2-bioinformatics/RESULTS-rereview.md
  title: C6T1A2 re-review bioinformatics - motif positions, pairwise identities and
    PANTHER 19 tree placement.
  findings:
  - statement: The QALGGH motif is at residues 92-97 and a C-terminal LDLRL EAR-like
      match is at 206-210. C6T1A2 is identical to A0A2K7G974 (ZFP1).
  - statement: C6T1A2 is in PTHR47593:SF9, a lineage produced by a Pentapetalae
      duplication (PTN002935045). The PTHR47593 tree has no Arabidopsis leaves and
      no PAINT nodes. The ZFP7/ZFP4 PAINT nodes are in the PTHR45730 tree.
  - statement: Arabidopsis ZFP7, ZFP4, ZFP3 and ZFP2 are 34-37% identical overall to
      C6T1A2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible scripts in the same folder. Results are not hard-coded.
- id: file:SOYBN/C6T1A2/C6T1A2-deep-research-falcon.md
  title: Deep-research report (falcon / Edison Scientific Literature) - functional
    annotation of soybean C6T1A2 / Glyma17g18110.1 (C6T1A2).
  findings:
  - statement: No gene-specific experimental literature was identified for C6T1A2 /
      Glyma17g18110.1 from soybean.
  - statement: Based on InterPro domain annotation, the protein is predicted to
      function as a DNA-binding transcription factor localized to the nucleus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly reports that no gene-specific literature exists. Its functional
      statements are domain-based inference only.
- id: file:SOYBN/C6T1A2/C6T1A2-hypotheses/core-function-1-go-0003700/openscientist.md
  title: OpenScientist hypothesis investigation - DNA-binding transcription factor activity
  findings:
  - statement: >-
      Reports the QALGGH motif at residues 92-97 and a C-terminal EAR-like motif,
      both reproduced independently in RESULTS-rereview.md. It also calls
      Arabidopsis ZFP7 the "direct ortholog" with 60.9% zinc-finger identity.
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      No longer used as support. The motif positions are reproduced by the
      re-review scripts. Its claims that ZFP7 is the direct ortholog of C6T1A2, and
      that GmZAT10-1 (a two-finger ZAT protein) gives same-species evidence, are not
      supported by PANTHER 19 tree placement: ZFP7 is in PTHR45730 and is 36%
      identical overall. Its AlphaFold pLDDT values were not re-verified.
