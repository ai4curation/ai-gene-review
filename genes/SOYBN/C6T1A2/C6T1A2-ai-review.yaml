- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISS
  original_reference_id: UniProtKB:C6T1A2
  review:
    summary: >-
      Proposed annotation. A protein whose only folded domain is a DNA-binding C2H2
      zinc finger and that is predicted to act as a transcription factor is expected
      in the nucleus. The location has not been tested for C6T1A2 or any SF9 member.
      Related Arabidopsis single-finger ZFPs in a different PANTHER family are
      nuclear (e.g. ZFP3).
    action: NEW
    reason: >-
      The nuclear location follows from the inferred transcription factor activity.
      Arabidopsis ZFP3 is a nuclear C2H2 zinc-finger protein, but it sits in another
      PANTHER family, so it is cited only as class-level context, not as an
      ortholog transfer. Earlier support taken from a ProtNLM2 prediction review has
      been removed.
    supported_by:
