id: A0A2L1CCQ9
gene_symbol: gmhA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39152
  label: Methanococcus maripaludis
description: 184-residue GmhA-family phosphoheptose isomerase from Methanococcus maripaludis DSM2067 (strain
  JJ). It is predicted to convert sedoheptulose 7-phosphate to D-glycero-D-manno-heptose 7-phosphate as
  the first reaction of an ADP-heptose biosynthetic ensemble. The enzyme is predicted to bind zinc and
  act in the cytoplasm; the native glycan destination of the archaeal product remains unresolved.
