id: A0A2L1CD41
gene_symbol: hldE_3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39152
  label: Methanococcus maripaludis
description: 159-residue HldC-like nucleotidyltransferase from Methanococcus maripaludis DSM2067 (strain
  JJ), encoded next to the separate heptose kinase hldE_2. It is predicted to transfer AMP from ATP to
  D-glycero-beta-D-manno-heptose 1-phosphate, yielding ADP-D-glycero-beta-D-manno-heptose and diphosphate.
  Its nucleotide-donor selectivity and the native glycan destination of the product remain unresolved.
existing_annotations:
- term:
    id: GO:0033786
    label: heptose-1-phosphate adenylyltransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: Proposed heptose 1-phosphate adenylyltransferase activity for the archaeal RfaE domain II
      protein, which has no GOA annotation.
    action: NEW
    reason: GOA carries no rows for this retired TrEMBL accession. The NCBIfam TIGR02199 rfaE_dom_II
      signature and the matching InterPro RfaE domain II assignment identify this 159-residue protein
      as the standalone nucleotidyltransferase half of the HldE architecture, the HldC-like counterpart
      of the adjacent hldE_2 kinase. Genome context corroborates the step, since MMJJ_17690 lies between
      the kinase and GmhA in a consecutive four-gene locus that makes a complete ensemble. ISS is used
      rather than an experimental code because no assay on this protein was reported, and the UniProt
      catalytic-activity statement for the same reaction carries only ARBA evidence, which is an unvetted
      prediction and is therefore not cited as support. Nucleotide-donor selectivity is left unasserted,
      since related enzymes also accept CTP or UTP.
    supported_by:
    - reference_id: file:METMI/hldE_3/hldE_3-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR011914; RfaE_dom_II.'
    - reference_id: file:METMI/hldE_3/hldE_3-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR02199; rfaE_dom_II; 1.'
    - reference_id: file:METMI/hldE_2/hldE_2-bioinformatics/RESULTS.md
      supporting_text: Their GmhB, RfaE domain I, RfaE domain II and GmhA classifications identify a complete
        four-step ensemble.
references:
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
- id: PMID:39116220
  title: The β-d-manno-heptoses are immune agonists across kingdoms.
  findings:
  - statement: Four DSM2067 HBE genes introduced into the HBE-negative M. maripaludis S2 recipient produced
      ADP-heptose. This is ensemble-level engineered-host evidence; individual accession mapping is direct
      only for the kinase through GenBank PP708527.1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache is abstract-only. Author-uploaded main article independently read; publisher supplement
      inaccessible. Kinase construct mapping is independently verified by exact GenBank protein translation;
      other three assignments combine family/domain evidence and genome context without claiming exact
      assay identity.
- id: file:METMI/hldE_3/hldE_3-uniprot.txt
  title: Archived UniProtKB record for hldE_3 (A0A2L1CD41), last pre-deletion version
  findings:
  - statement: Versioned archived record establishes source identity and specific family/domain classification.
    record_section:
    - DR:InterPro
    supporting_text: DR   InterPro; IPR011914; RfaE_dom_II.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official UniSave flat file retrieved unchanged through the normal seeding pipeline with
      versioned archival transport. Only curated HAMAP/PIRNR and specific family/domain evidence is used;
      names, electronic GO lines and ARBA-only catalytic statements are not functional support.
- id: file:METMI/hldE_2/hldE_2-bioinformatics/RESULTS.md
  title: DSM2067 HBE construct sequence comparison and source mapping
  findings:
  - statement: Exact sequence comparison maps archived hldE_2 to PP708527.1; the other three archived
      sequences have no exact match in this deposited construct subset. Genomic context provides qualified
      functional inference.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible exact full-sequence comparison against unmodified GenBank records; absence
      of a construct match is not treated as evidence against function.
core_functions:
- description: Predicted HldC-like heptose 1-phosphate adenylyltransferase. The specific RfaE domain II
    classification (IPR011914) and adjacency to the experimentally mapped kinase support AMP transfer to heptose 1-phosphate;
    the exact construct mapping remains unverified and no CTP/UTP promiscuity is assigned.
  molecular_function:
    id: GO:0033786
    label: heptose-1-phosphate adenylyltransferase activity
  supported_by:
  - reference_id: file:METMI/hldE_3/hldE_3-uniprot.txt
    record_section:
