id: A0A2L1CD41
gene_symbol: hldE_3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39152
  label: Methanococcus maripaludis
description: 159-residue HldC-like nucleotidyltransferase from Methanococcus maripaludis DSM2067 (strain
  JJ), encoded next to the separate heptose kinase hldE_2. It is predicted to transfer AMP from ATP to
  D-glycero-beta-D-manno-heptose 1-phosphate, yielding ADP-D-glycero-beta-D-manno-heptose and diphosphate.
  Its nucleotide-donor selectivity and the native glycan destination of the product remain unresolved.
