core_functions:
- description: Predicted HldC-like heptose 1-phosphate adenylyltransferase. The specific RfaE domain II
    classification (IPR011914) and adjacency to the experimentally mapped kinase support AMP transfer to heptose 1-phosphate;
    the exact construct mapping remains unverified and no CTP/UTP promiscuity is assigned.
  molecular_function:
