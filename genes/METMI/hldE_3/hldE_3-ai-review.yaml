    supporting_text: DR   InterPro; IPR011914; RfaE_dom_II.
  - reference_id: file:METMI/hldE_2/hldE_2-bioinformatics/RESULTS.md
suggested_questions:
- question: Which exact DSM2067 accessions and construct sequences correspond to all four genes introduced
    into strain S2 in supplementary figure S11 of PMID39116220, and what glycan uses the product in native
    DSM2067?
suggested_experiments:
- description: Measure purified-enzyme substrate specificity and product stereochemistry, and identify
    the native DSM2067 glycoconjugate incorporating heptose.
