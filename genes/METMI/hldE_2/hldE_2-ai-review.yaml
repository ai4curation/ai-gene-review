core_functions:
- description: ATP-dependent phosphorylation of D-glycero-beta-D-manno-heptose 7-phosphate at C1 to produce
    the 1,7-bisphosphate. Exact full-length sequence identity connects this record to deposited HldA_MM;
    its RfaE domain I supports a standalone kinase rather than bifunctional HldE.
