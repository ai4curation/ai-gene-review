id: A0A2L1CCT7
gene_symbol: hldE_2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39152
  label: Methanococcus maripaludis
description: Monofunctional 306-residue heptose 7-phosphate kinase from Methanococcus maripaludis DSM2067
  (strain JJ), also called HldA. It phosphorylates the anomeric hydroxyl of D-glycero-beta-D-manno-heptose
  7-phosphate to form the 1,7-bisphosphate intermediate. Its PfkB/RfaE kinase domain is separate from
  the adjacent HldC-like nucleotidyltransferase, despite the historical hldE_2 gene name.
