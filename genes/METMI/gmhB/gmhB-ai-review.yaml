- description: GmhB-family hydrolysis of the C7 phosphate of D-glycero-beta-D-manno-heptose 1,7-bisphosphate.
    PIRNR004682, the specific InterPro/PANTHER classification and genomic context support the beta-HBP
    phosphatase assignment; exact linkage to the experimental construct remains unverified.
