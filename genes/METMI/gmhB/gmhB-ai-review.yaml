id: A0A2L1CCN4
gene_symbol: gmhB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39152
  label: Methanococcus maripaludis
description: 168-residue GmhB-family phosphatase from Methanococcus maripaludis DSM2067 (strain JJ), encoded
  in the contiguous ADP-heptose biosynthesis locus. It is predicted to remove the C7 phosphate from D-glycero-beta-D-manno-heptose
  1,7-bisphosphate, producing the 1-phosphate substrate for the adjacent nucleotidyltransferase.
existing_annotations: []
references:
- id: PMID:39116220
  title: The β-d-manno-heptoses are immune agonists across kingdoms.
  findings:
  - statement: Four DSM2067 HBE genes introduced into the HBE-negative M. maripaludis S2 recipient produced
      ADP-heptose. This is ensemble-level engineered-host evidence; individual accession mapping is direct
      only for the kinase through GenBank PP708527.1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache is abstract-only. Author-uploaded main article independently read; publisher supplement
      inaccessible. Kinase construct mapping is independently verified by exact GenBank protein translation;
      other three assignments combine family/domain evidence and genome context without claiming exact
      assay identity.
