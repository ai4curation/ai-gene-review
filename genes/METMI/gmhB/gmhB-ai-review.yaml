- id: PMID:20050615
  title: 'Divergence of biochemical function in the HAD superfamily: D-glycero-D-manno-heptose-1,7-bisphosphate
    phosphatase (GmhB).'
  findings:
  - statement: Comparative GmhB kinetics establish that anomer preference varies among orthologs; this
      limits what family membership can establish for the archaeal accession without a verified experimental construct match.
    supporting_text: each displays substantial anomeric specificity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text comparative bacterial GmhB study. Evidence for the limitation of family-based
      anomer inference, not direct evidence for METMI GmhB activity.
core_functions:
- description: 'Predicted C7 dephosphorylation of D-glycero-beta-D-manno-heptose 1,7-bisphosphate. PIRNR004682
    supports GmhB-family identity but does not specify the anomer. PTHR42891:SF1 membership, adjacency
    to the independently classified HldA/HldC/GmhA genes, and production of ADP-heptose by the DSM2067
    ensemble jointly support inferred beta-substrate competence. This is not evidence for beta preference
    or exclusivity: GmhB orthologs differ in their relative alpha/beta activities. Exact linkage of this
    accession to the experimental phosphatase construct remains unverified.'
  molecular_function:
    id: GO:0034200
    label: D-glycero-beta-D-manno-heptose 1,7-bisphosphate 7-phosphatase activity
