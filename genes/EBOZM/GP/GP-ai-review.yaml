- term:
    id: GO:0039654
    label: fusion of virus membrane with host endosome membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1170
  review:
    summary: >-
      Keyword mapping of Fusion of virus membrane with host endosomal membrane. This is GP2's
      defining activity and the compartment is right: entry is pH-dependent and requires
      endosomal cathepsin processing and NPC1 binding before GP2 can fuse.
    action: ACCEPT
    reason: >-
      Core function. The endosomal location of the fusion event is independently supported by
      the bafilomycin A1 sensitivity of both EbGP pseudotypes and replication-competent ZEBOV
