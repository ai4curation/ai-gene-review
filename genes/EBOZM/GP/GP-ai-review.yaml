knowledge_gaps:
  - gap_statement: >-
      The lipid species that the GP2 internal fusion loop engages in the endosomal membrane is
      unidentified, so the chemistry of the insertion step is unknown.
    boundary: >-
      The fusion peptide (residues 524-539) is mapped, its 3(10)-helical fold in
      membrane-mimetic environments is solved, Trp8 and Phe12 are known to be required for the
      fold, and the peptide interacts with bulk detergent-resistant membrane fractions. But
      the published assays used SDS micelles and whole detergent-resistant membranes, and the
      GOA WITH/FROM entity for the lipid-binding annotation is sodium dodecyl sulfate, a
      detergent.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Fusion-loop lipid preference determines which endosomal membrane composition supports
      fusion and is the target for small molecules that block the fusion step rather than
      receptor binding.
  - gap_statement: >-
      Whether full-length GP accumulates in the endoplasmic reticulum during authentic
      infection, or only when overexpressed from plasmids, is undetermined, and so is the
      mechanism by which the mucin-like region causes the accumulation.
    boundary: >-
      Transiently overexpressed full-length GP colocalises with an endoplasmic reticulum
      marker in HEK293T cells at 24 hours while a mucin-deleted GP does not, and the
      mucin-like region is independently known to carry the cytotoxic activity. But GP also
      reaches the plasma membrane in infected non-human-primate tissue, and must pass through
      the trans-Golgi to be cleaved by furin, a compartment in which the same study saw no
      signal.
    gap_kind:
      - BIOLOGY
    dark_aspect: CC_DARK
    significance: >-
      If the accumulation is real in infection, retention of a cytotoxic glycoprotein in the
      endoplasmic reticulum would be a candidate mechanism for GP-induced cell rounding and
      anoikis; if it is an artefact of overexpression, the cytotoxicity must be explained at
      the cell surface.
  - gap_statement: >-
      It is not known whether GP2 palmitoylation at Cys670 and Cys672 is required for
      infectivity, despite being required for lipid-raft partitioning.
    boundary: >-
      The C670/672A mutant fails to enter rafts and fails to release GM1-containing particles,
      yet UniProt records that palmitoylation is not required for GP2 function on the basis of
      a separate study.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Resolving the conflict would establish whether raft targeting is mechanistically
      necessary for assembly and budding or merely correlated with it.
suggested_questions:
  - question: >-
      Does the raft dependence of GP assembly and budding reflect a requirement for a specific
      lipid environment at the budding site, or simply colocalisation with VP40, given that
      palmitoylation-site mutants lose raft partitioning but are reported not to lose function?
    experts:
      - Bavari S
      - Aman MJ
  - question: >-
      Is the endoplasmic reticulum accumulation of full-length GP seen on plasmid
      overexpression detectable in Ebola-virus-infected cells, and does it contribute to
      GP-induced cell rounding?
    experts:
      - Bhattacharyya S
      - Hope TJ
  - question: >-
      Shed GP and membrane GP both act through TLR4. Are the relevant epitopes the same, and
