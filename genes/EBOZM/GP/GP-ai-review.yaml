          probably represent the assembly and budding site.
- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:20202662
  qualifier: part_of
  review:
    summary: >-
      CACAO row. PMID:20202662 is an entry-pathway study: it asks whether EbGP-pseudotyped HIV
      and replication-competent ZEBOV require clathrin-mediated endocytosis, using
      chlorpromazine, hypertonic sucrose, dominant-negative Eps15 and clathrin heavy-chain
      siRNA, with bafilomycin A1 for pH dependence. Having read the complete text (Materials
      and methods plus Results, recovered from PubMed Central; the cached copy holds only the
      abstract, introduction and discussion), the paper contains no assay of where GP is
      located. Every imaging experiment in it visualises host trafficking machinery,
      eGFP-clathrin, labelled transferrin, transferrin receptor and mRFP-Eps15, and the viral
      readout throughout is GFP reporter infectivity measured by flow cytometry or by counting
      infected cells. The cited paper therefore does not support an IDA cellular-component
      annotation on the viral glycoprotein. Independently, the term is also entailed by the
      host cell endoplasmic reticulum row kept below, since GO:0044165 is part_of GO:0030430.
    action: TOO_GENERAL
    reason: >-
      Two separate problems point to the same disposition. First, the claim as such is true at
      this altitude but says nothing useful: GP transits the host secretory pathway, and the
      endoplasmic reticulum annotation retained in this review already entails host cell
      cytoplasm, so this row adds no information. Second, and this is the CACAO-specific
      point, the cited reference does not show it: the row looks like a mechanism paper read
      as a localisation, with sentences about clathrin being redistributed in the cytoplasm,
      or about the virus entering the cytoplasm, converted into a component annotation on GP.
      It would in any case be a poor location for a single-pass type I membrane glycoprotein
      whose cytoplasmic tail is five residues long and whose ectodomain faces the lumen or the
      outside of every membrane it occupies. TOO_GENERAL rather than REMOVE because the term
      is genuinely entailed by a location this review keeps; the reference problem is recorded
      as a source defect instead.
    supported_by:
      - reference_id: PMID:20202662
        supporting_text: Sensitivity of EbGP pseudotyped HIV as well as infectious EBOV to
          inhibitors of clathrin suggests that EBOV uses clathrin-mediated endocytosis as an
          entry pathway.
    source_defects:
      - defect_type: WRONG_REFERENCE
        resource: OTHER
        slot: DB:Reference
        requested_change: CHECK
        asserted_value: PMID:20202662
        cause: OTHER
        confidence: CONFIRMED
        explanation: >-
          The GO:0030430 (host cell cytoplasm) IDA row for Q05320 cites PMID:20202662 (Ebola
          virus uses clathrin-mediated endocytosis as an entry pathway). The complete text of
          that paper, including Materials and methods and Results, contains no experiment that
          localises the Ebola glycoprotein. Its microscopy is confined to host factors
          (eGFP-clathrin redistribution after chlorpromazine or sucrose, fluorescent
          transferrin uptake, transferrin receptor staining, mRFP-Eps15 constructs); viral
          infection is scored only as GFP reporter expression by flow cytometry or by counting
          infected cells. There is consequently no direct assay from which an IDA cellular
          component annotation for GP could be made, and the paper's own conclusions concern
          the endocytic route of entry, not the glycoprotein's location. The companion
          GO:0046718 IMP row from the same reference is well supported and should be kept.
          This row was assigned by CACAO, the GONUTS/Texas A and M community-curation
          programme; the GONUTS wiki page for this PMID could not be consulted because
          gowiki.tamu.edu was offline at the time of review. The recommended action is to
          withdraw this row, or to re-point it to a publication that actually images GP.
        supported_by:
          - reference_id: PMID:20202662
            supporting_text: In this study we examined whether EBOV requires the
              clathrin-mediated endocytic pathway for entry.
- term:
