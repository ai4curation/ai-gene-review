    supported_by:
      - reference_id: file:EBOZM/GP/GP-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: NPC1-binding, Ca(2+) and acidic pH induce a conformational change of
          GP2, which unmasks its fusion peptide and permit membranes fusion
      - reference_id: PMID:20202662
        supporting_text: Also, both chlorpromazine and Bafilomycin A1 inhibited entry of
          infectious EBOV.
