- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0375
  review:
    summary: >-
      Mapping of the curated Host cell membrane location of GP1 and GP2. In infected and in
