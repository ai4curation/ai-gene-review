        followed by cell death.
      full_text_unavailable: true
    - statement: The cytotoxic effect requires intracellular GP expression and is not
        transferred by conditioned medium
      supporting_text: suggesting that EGP needs to be expressed intracellularly to exert its
        cytotoxic effect
      full_text_unavailable: true
- id: PMID:15103332
  title: Ectodomain shedding of the glycoprotein GP of Ebola virus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached entry is abstract-only, but the abstract states the cleavage position (D637), the
      protease family (ADAM/TACE), the released species (GP1 plus truncated GP2) and the
