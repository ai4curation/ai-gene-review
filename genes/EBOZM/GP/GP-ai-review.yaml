    supported_by:
      - reference_id: PMID:17545161
        supporting_text: EBO(16) can interact with detergent-resistant membrane fractions
- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027537
  review:
    summary: >-
      ARBA association-rule prediction of lipid binding for filovirus glycoproteins. The
      prediction is unvetted in itself, but it coincides with the experimental fusion-peptide
