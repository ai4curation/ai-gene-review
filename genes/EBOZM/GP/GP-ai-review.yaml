- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IPI
  original_reference_id: PMID:17545161
  qualifier: enables
  supporting_entities:
  - ChEBI:8984
  review:
    summary: >-
      Third coding of the same fusion-peptide study, as a physical interaction with
      ChEBI:8984 (sodium dodecyl sulfate). The lipid-binding claim stands on the
      detergent-resistant-membrane data, but the WITH/FROM entity is a membrane-mimetic
      detergent, not a lipid, so it does not name a physiological ligand.
    action: ACCEPT
    reason: >-
      Kept, consistently with the other lipid binding rows, because the underlying claim is
      correct. The defect is in the WITH/FROM field rather than in the annotation: SDS
      micelles were the folding environment used to obtain the NMR structure, and treating
      them as the bound lipid is misleading. Recorded as a source defect for DisProt.
    supported_by:
      - reference_id: PMID:17545161
        supporting_text: insertion of the peptide was modeled by experiments in which the
          tryptophan fluorescence and (1)H NMR were monitored in the presence of sodium
          dodecyl sulfate micelles or in the presence of detergent-resistant membrane
          fractions
    source_defects:
      - defect_type: WRONG_WITH_FROM
        resource: OTHER
        slot: With/From
        requested_change: CHECK
        asserted_value: ChEBI:8984
        cause: OTHER
        confidence: PROBABLE
        explanation: >-
          The GO:0008289 (lipid binding) IPI row for Q05320 from PMID:17545161 names
          ChEBI:8984 (sodium dodecyl sulfate) in WITH/FROM. SDS is the anionic detergent used
          to form the membrane-mimetic micelles in which the EBO16 fusion peptide was folded
          for NMR; it is an organosulfate, not a lipid, so it cannot be the interacting lipid
          that supports a lipid-binding annotation. The lipid-binding claim is better
          supported by the peptide's interaction with detergent-resistant membrane fractions
          reported in the same paper, which identifies no single chemical species. The
          annotation itself is sound; the WITH/FROM entity should be removed or replaced with
          an entity the paper actually identifies. The responsible resource is DisProt, the
          assigning group for this row.
        supported_by:
          - reference_id: PMID:17545161
            supporting_text: in the presence of sodium dodecyl sulfate micelles or in the
              presence of detergent-resistant membrane fractions
- term:
