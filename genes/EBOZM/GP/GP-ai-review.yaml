    experts:
      - Bukreyev A
      - Volchkov VE
suggested_experiments:
  - hypothesis: >-
      The GP2 fusion loop binds a defined lipid class rather than bulk hydrophobic membrane,
      and that preference sets the endosomal membrane requirement for fusion.
    description: >-
      Measure binding and insertion of recombinant GP2 ectodomain and of the EBO16 peptide
      into liposomes of defined composition (varying cholesterol, the late-endosomal lipid
      bis(monoacylglycero)phosphate, phosphatidylserine and sphingomyelin) by surface-plasmon
      resonance and tryptophan-fluorescence depth quenching, and test whether the same
      compositions support NPC1- and low-pH-triggered fusion of GP-bearing pseudovirions in a
      lipid-mixing assay.
    experiment_type: liposome binding and in vitro fusion
  - hypothesis: >-
      GP localises to the endoplasmic reticulum during authentic infection only transiently,
      and the apparent accumulation reported from plasmid transfection is an overexpression
      artefact.
    description: >-
      Compare GP localisation in cells infected with recombinant Ebola virus at a low
      multiplicity against cells transfected with GP plasmid at matched expression levels,
      using quantitative immunofluorescence against markers for endoplasmic reticulum, ERGIC,
      trans-Golgi and plasma membrane, with a pulse-chase of endoglycosidase-H-sensitive
      versus resistant GP to measure the rate of Golgi transit.
    experiment_type: infection versus transfection localisation and glycan maturation time
      course
  - hypothesis: >-
      Raft targeting via GP2 palmitoylation is required for efficient incorporation of GP into
      budding virions and therefore for particle infectivity.
    description: >-
      Build a recombinant Ebola virus carrying GP C670A/C672A, with a single-site control, by
      reverse genetics, then quantify GP incorporation per particle by western blot normalised
      to VP40, particle morphology by electron microscopy, and specific infectivity per genome
      copy; test whether cholesterol depletion of producer cells phenocopies the mutant.
    experiment_type: reverse genetics with particle composition and specific infectivity
      measurement
