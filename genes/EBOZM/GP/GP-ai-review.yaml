- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:26917592
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q05320
  review:
    summary: >-
      Self-interaction recorded by IntAct from the structural study of neutralising
      antibodies, which resolves GP1-GP2 heterodimers associating into a chalice-shaped
      homotrimer; antibody Fab100 even bridges two adjacent protomers. GP's functional unit is
      the trimeric spike, so homotypic self-association is real and not an artefact.
    action: KEEP_AS_NON_CORE
    reason: >-
      Unlike bare protein binding, identical protein binding carries information here: it
      states that GP homo-oligomerises, which is required to build the spike. It is kept as
      non-core because the informative molecular functions are the receptor binding and
      membrane-fusion activities of the assembled trimer rather than the self-association
      itself, which is a structural prerequisite.
    supported_by:
      - reference_id: PMID:26917592
        supporting_text: which associate to form a chalice-shaped trimer
      - reference_id: file:EBOZM/GP/GP-uniprot.txt
        record_section: ["CC:SUBUNIT"]
        supporting_text: Homotrimer; each monomer consists of a GP1 and a GP2 subunit linked
