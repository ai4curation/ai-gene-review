- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: EXP
  original_reference_id: PMID:17545161
  qualifier: enables
  review:
    summary: >-
      The GP2 internal fusion peptide EBO16 folds into a 3(10)-helix in membrane-mimetic
      environments and interacts with detergent-resistant membrane fractions, with Trp8 and
      Phe12 required to maintain the structure inside the bilayer. Membrane and lipid
      engagement by the fusion loop is the physical basis of GP-mediated fusion.
    action: ACCEPT
    reason: >-
      The claim is correct and mechanistically central: the fusion peptide must insert into
      the target (endosomal) membrane for GP2 to fuse membranes, and UniProt annotates the
      fusion peptide as a sequence feature. The term is kept at this granularity because the
      study used SDS micelles and bulk detergent-resistant membranes and therefore identifies
      no lipid class; a more specific child such as a particular phospholipid binding term
      would overstate the evidence.
    supported_by:
      - reference_id: PMID:17545161
        supporting_text: EBO(16) can interact with detergent-resistant membrane fractions
      - reference_id: file:EBOZM/GP/GP-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: Low pH in endosomes induces an irreversible conformational change in
          GP2, releasing the fusion hydrophobic peptide.
- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IDA
  original_reference_id: PMID:17545161
  qualifier: enables
  review:
    summary: >-
      Same experimental basis as the EXP row above, coded as a direct assay (NMR and
