      supporting_text: shed GP is present in significant amounts in the blood of
        virus-infected animals
      full_text_unavailable: true
- id: PMID:17545161
  title: Structure of the Ebola fusion peptide in a membrane-mimetic environment and
    the interaction with lipid rafts.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached entry is abstract-only. The study is on a synthetic 16-mer (EBO16) corresponding
      to the GP2 internal fusion peptide, not on the intact glycoprotein, and the membrane
      mimetics are SDS micelles and bulk detergent-resistant membranes. It supports lipid
      binding by the fusion loop at that level of resolution, but it identifies no lipid
