- term:
    id: GO:0044165
    label: host cell endoplasmic reticulum
  evidence_type: IMP
  original_reference_id: PMID:21223600
  qualifier: part_of
  review:
    summary: >-
      CACAO row, and the paper does assert exactly this: full-length GP transiently expressed
      in HEK293T cells accumulated in a compartment that colocalised with a DsRed2-ER marker
      next to the nuclear membrane (Figure 1B), whereas a mucin-deleted GP did not (Figure
      2A). The mutant comparison is presumably why the row was coded IMP, although the
      observation on wild-type GP is a marker colocalisation, that is, an IDA. Endoplasmic
      reticulum residence is independently expected for a protein with a cleaved signal
      peptide, N- and O-glycosylation and furin processing in the trans-Golgi.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term matches what the paper shows and is biologically sound as a biosynthetic
      transit compartment, so it is kept; but three caveats keep it out of the core. The assay
      is transfection of 8 to 10 micrograms of plasmid for 24 hours with a protein that is
      itself cytotoxic, so accumulation may be an overexpression phenotype rather than the
      steady state during infection. The same study found no Golgi signal, which is hard to
      reconcile with the established furin cleavage of GP in the trans-Golgi and suggests the
      imaging did not capture the full itinerary. And the authors themselves note other work
      placing GP at the plasma membrane. GP does no work in the endoplasmic reticulum: it
      folds, oligomerises and is glycosylated there en route to the surface, so the functional
      locations are the host plasma membrane, the lipid raft and the virion membrane.
    supported_by:
      - reference_id: PMID:21223600
        supporting_text: Co-expression of Ebola GP with DsRed2-ER showed that GP had localized
