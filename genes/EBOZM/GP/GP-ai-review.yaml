        soluble GP1 plus truncated GP2 complexes from the cell surface
      supporting_text: Proteolytic cleavage taking place at amino-acid position D637 removes
        the transmembrane anchor and liberates complexes consisting of GP1 and truncated GP2
        (GP(2delta)) subunits from the cell surface.
      full_text_unavailable: true
    - statement: Shed GP circulates in infected animals and blocks virus-neutralising
