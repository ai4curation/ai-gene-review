id: Q05320
gene_symbol: GP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:128952
  label: Ebola virus - Mayinga, Zaire, 1976
description: >-
  GP is the envelope glycoprotein of Zaire ebolavirus and the only viral protein
  displayed on the virion surface. It is synthesised as a signal-peptide-bearing,
  heavily N- and O-glycosylated type I membrane precursor from the +1A edited GP mRNA,
  and is cleaved by host furin in the trans-Golgi into the receptor-binding subunit GP1
  and the membrane-anchored fusion subunit GP2, which remain disulfide-linked and
  assemble into chalice-shaped homotrimeric spikes (GP1,2). GP1 carries the
  receptor-binding region and a large, disordered mucin-like domain; attachment to target
  cells is assisted by host lectins (CD209/DC-SIGN, CLEC4M, CLEC10A) and integrins, after
  which virions are internalised mainly by clathrin-mediated endocytosis. In the acidified
  endosome, cathepsins B and L strip the glycan cap from GP1, exposing the site that binds
  the entry receptor NPC1; NPC1 engagement together with low pH and calcium triggers the
  class I fusion rearrangement of GP2, whose fusion peptide inserts into the endosomal
  membrane and drives fusion, delivering the nucleocapsid to the cytoplasm. In infected
  cells GP concentrates in cholesterol-dependent plasma-membrane lipid rafts, the assembly
  and budding site, where it is incorporated into filamentous virions and where it
  antagonises the restriction factor BST2/tetherin to permit virion release. GP also has
  pathogenic activities beyond entry: it down-modulates surface integrins and MHC class I,
  causing cell rounding, detachment and anoikis of endothelial cells; it engages host TLR4
  to kill bystander CD4+ T lymphocytes and to differentiate monocytes; and host ADAM17
  sheds a soluble GP1,2-delta ectodomain complex (shed GP) that circulates in infected
  animals, acts as a decoy for neutralising antibodies, and activates dendritic cells and
  macrophages through TLR4 while increasing vascular permeability.
functional_isoforms:
  - id: GP_SHED_GP
    name: Shed GP (GP1,2-delta)
    type: CLEAVAGE_PRODUCT
    description: >-
      Soluble ectodomain complex of GP1 with a C-terminally truncated GP2 (GP2-delta),
      released from the surface of infected cells by host ADAM17/TACE cleavage after D637,
      which removes the transmembrane anchor. Shed GP accumulates to high levels in the
      blood of infected animals and has two activities not shared with the membrane-anchored
      spike: it absorbs virus-neutralising antibodies (antibody decoy) and it binds and
      activates uninfected dendritic cells, macrophages and monocytes through TLR4, inducing
      cytokine secretion, costimulatory-molecule upregulation and increased vascular
      permeability. The secreted sGP and ssGP products of the same gene arise by RNA editing
      and are separate UniProt entries (P60170, Q9YMG2), so they are not isoforms of this
      entry.
    maps_to:
      - type: UNIPROT_CHAIN
        ids:
          - PRO_0000445686
        residues: 33-637
    isoform_specific_terms:
      - id: GO:0005576
        label: extracellular region
  - id: GP_GP1
    name: GP1 (receptor-binding subunit)
    type: CLEAVAGE_PRODUCT
    description: >-
      Furin-generated N-terminal subunit (33-501) carrying the receptor-binding region
      (54-201) and the mucin-like region (305-485). It is a peripheral membrane protein held
      on the virion by a disulfide bond to GP2. Endosomal cathepsin B/L removal of the glycan
      cap leaves a 19-kDa fragment that binds the entry receptor NPC1. The mucin-like region
      is required for the cytotoxic, cell-rounding activity and for CLEC10A binding.
    maps_to:
      - type: UNIPROT_CHAIN
        ids:
          - PRO_0000037486
        residues: 33-501
  - id: GP_GP2
    name: GP2 (fusion subunit)
    type: CLEAVAGE_PRODUCT
    description: >-
      Furin-generated C-terminal subunit (502-676), a single-pass type I membrane protein
      containing the internal fusion peptide (524-539), two coiled-coil heptad repeats
      (554-595, 615-634) and palmitoylation sites at C670/C672 required for lipid-raft
      partitioning. GP2 is the class I fusion machine: low endosomal pH and NPC1 engagement
      drive it through pre-hairpin to trimer-of-hairpins conformations, apposing and fusing
      the viral and endosomal membranes.
    maps_to:
      - type: UNIPROT_CHAIN
        ids:
          - PRO_0000037487
        residues: 502-676
existing_annotations:
- term:
    id: GO:0001907
    label: symbiont-mediated killing of host cell
  evidence_type: EXP
  original_reference_id: PMID:15051379
  qualifier: involved_in
  review:
    summary: >-
      Adenovirus-delivered GP in primary human cardiac microvascular endothelial cells
      caused loss of adhesion followed by apoptotic death, and conditioned medium did not
      transfer the effect, so the killing requires intracellular GP expression rather than a
      secreted factor. The term is correct for this phenotype.
    action: ACCEPT
    reason: >-
      Killing of host cells is one of GP's documented activities and not merely a side effect
      of overexpression: the cytotoxicity maps to the GP1 mucin-like region, has been seen in
      several cell types and delivery systems, and is a recognised contributor to the loss of
      vascular integrity in Ebola virus disease, so it is retained as part of the immune- and
      host-subversion arm of this review's core functions. Two caveats are recorded rather
      than acted on: delivery here is adenoviral overexpression, and UniProt marks the
      inference from cell detachment to haemorrhage as Probable. Kept at this granularity
      because the assay scores death of the GP-expressing host cell, which is exactly what
      the term asserts, and the mechanism proceeds through down-modulation of host integrins
      and MHC class I.
    supported_by:
      - reference_id: PMID:15051379
        supporting_text: Primary human cardiac microvascular endothelial cells (HCMECs)
          transduced with Ad-EGP displayed loss of cell adhesion from the plastic surface
          followed by cell death.
      - reference_id: PMID:15051379
        supporting_text: suggesting that EGP needs to be expressed intracellularly to exert
          its cytotoxic effect
- term:
    id: GO:0001907
    label: symbiont-mediated killing of host cell
  evidence_type: EXP
  original_reference_id: PMID:28542576
  qualifier: involved_in
  review:
    summary: >-
      GP added to isolated primary human CD4+ T cells killed them without infecting them;
      immunoprecipitation and flow cytometry showed GP binds the T cells through TLR4, and the
      TLR4 inhibitor CLI-095 rescued viability. This is direct, well-controlled support for
      GP-mediated killing of a host cell, here a bystander cell.
    action: ACCEPT
    reason: >-
      A mechanistically defined activity of GP itself: GP-TLR4 engagement causes apoptosis and
      necrosis of uninfected lymphocytes, the likely basis of the lymphopenia that correlates
      with fatal outcome, and UniProt curates it with experimental evidence. GP performs the
      binding, so the claim is about this gene product rather than about a host factor. The
      term covers both the cell-autonomous and the bystander mode, so no more specific term is
      needed.
    supported_by:
      - reference_id: PMID:28542576
        supporting_text: we demonstrate that EBOV directly binds to CD4+ T cells through
          interaction of GP with TLR4
      - reference_id: PMID:28542576
        supporting_text: The addition of the TLR4 inhibitor CLI-095 significantly reduced CD4+
          T cell death induced by GP.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:15103332
  qualifier: located_in
  review:
    summary: >-
      Ectodomain shedding by host ADAM17/TACE at D637 removes the transmembrane anchor and
      liberates soluble GP1 plus truncated GP2 complexes from the cell surface; shed GP was
      detected in large amounts in the blood of infected animals. The extracellular location
      of this cleavage product is established.
    action: ACCEPT
    reason: >-
      Direct experimental demonstration that a GP-derived product is released into the
      extracellular milieu, and the location is functionally meaningful: circulating shed GP
      is the antibody decoy and the TLR4 agonist. Strictly the claim is about the Shed GP
      chain (PRO_0000445686, residues 33-637) rather than the membrane-anchored spike, which
      is recorded under functional_isoforms rather than as an isoform qualifier on this row,
      since GOA carries no isoform field for it.
    supported_by:
      - reference_id: PMID:15103332
        supporting_text: Proteolytic cleavage taking place at amino-acid position D637 removes
          the transmembrane anchor and liberates complexes consisting of GP1 and truncated
          GP2 (GP(2delta)) subunits from the cell surface.
      - reference_id: PMID:15103332
        supporting_text: shed GP is present in significant amounts in the blood of
          virus-infected animals
- term:
