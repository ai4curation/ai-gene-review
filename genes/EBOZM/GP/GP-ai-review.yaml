- id: PMID:11877482
  title: 'Lipid raft microdomains: a gateway for compartmentalized trafficking of
    Ebola and Marburg viruses.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Directly supports both CACAO rows derived from it
      (GO:0045121 membrane raft, GO:0046761 viral budding from plasma membrane) with
      biochemical raft fractionation, a palmitoylation-site mutant, cholesterol depletion,
      confocal GM1 colocalisation, and electron microscopy of virus-like particle release from
      the plasma membrane. UniProt cites the same paper for the raft and host-cell-membrane
      locations.
  findings:
    - statement: Transfected Ebola and Marburg GP partition into lipid raft fractions, while a
        GP mutated at the palmitoylation sites C670/C672 does not
      supporting_text: As shown in Fig. 1 A and B, a significant fraction of Ebola and Marburg
        GPs were found to reside in rafts.
      reference_section_type: RESULTS
    - statement: Raft association of GP is cholesterol-dependent
      supporting_text: resulted in almost complete removal of Ebola GP from rafts
      reference_section_type: RESULTS
    - statement: GP colocalises with the raft marker GM1 in large plasma-membrane patches on
        intact cells
      supporting_text: a substantial portion of both of the GPs were found to colocalize with
        GM1 in large patches on the plasma membrane
      reference_section_type: RESULTS
    - statement: Coexpression of GP with VP40 directs both proteins into released particles
      supporting_text: coexpression of GPwt and VP40, directed the majority of both proteins
        into the supernatant
      reference_section_type: RESULTS
    - statement: GP-containing virus-like particles are released through discrete
        plasma-membrane platforms
      supporting_text: where a large number of particles that stain for GP exit through a
        small region of the plasma membrane
      reference_section_type: RESULTS
    - statement: The spikes on released particles are GP, shown by immunogold staining
      supporting_text: Immunogold staining of the VLPs with anti-Ebola GP antibodies
        demonstrated the identity of the spikes on the surface of the particles as Ebola GP
      reference_section_type: RESULTS
- id: PMID:15051379
  title: Ebola virus glycoprotein-mediated anoikis of primary human cardiac microvascular
    endothelial cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached entry is abstract-only, so figure-level detail could not be checked. The abstract
      states the assay, the cell type and the key control (conditioned-medium transfer), which
      is enough to judge the GO:0001907 row; it is a transduction-overexpression model, so the
