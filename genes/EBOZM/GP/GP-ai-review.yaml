- id: PMID:28542576
  title: Ebola virus glycoprotein directly triggers T lymphocyte death despite of
    the lack of infection.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Establishes the GP-TLR4 interaction on CD4+ T cells and the rescue
