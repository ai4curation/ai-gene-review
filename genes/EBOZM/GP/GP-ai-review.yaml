        resource: OTHER
        slot: Evidence_Code
        requested_change: REPOINT
        asserted_value: IMP
        corrected_value: IDA
        cause: OTHER
        confidence: PROBABLE
        explanation: >-
          The GO:0044165 (host cell endoplasmic reticulum) row for Q05320 from PMID:21223600
          is coded IMP. The localisation of the annotated protein, full-length Ebola GP, was
          determined by direct deconvolution fluorescence imaging of transfected cells
          co-expressing a DsRed2-ER marker (Figure 1B), which is a direct assay and therefore
          IDA. The mutant in the paper, GP lacking the mucin-like region, is a different
          construct that does not accumulate in the endoplasmic reticulum (Figure 2A); a
          mutant that loses the localisation supports a statement about the mucin-like region,
          not an IMP for the wild-type protein's location. The qualifier is also questionable:
          GP is located_in the host endoplasmic reticulum rather than part_of it. This row was
          assigned by CACAO, the GONUTS/Texas A and M community-curation programme.
        supported_by:
          - reference_id: PMID:21223600
            supporting_text: Co-expression of Ebola GP with DsRed2-ER showed that GP had
              localized within the ER (Figure 1B).
- term:
    id: GO:0045121
    label: membrane raft
  evidence_type: IDA
  original_reference_id: PMID:11877482
  qualifier: part_of
  review:
    summary: >-
      CACAO row that the cited paper supports squarely, and with unusual rigour for a
      single-reference cellular-component annotation. PMID:11877482 is a dedicated study of
      filovirus raft association: transfected Ebola GP partitioned into the raft fraction of
      sucrose gradients while a GM1 spot blot confirmed fraction quality (Fig. 1A and 1B); a
      GP mutated at the palmitoylation sites C670/C672 failed to reach rafts (Fig. 1B);
      cholesterol depletion with methyl-beta-cyclodextrin stripped GP out of the raft fraction
      and the raft-excluded transferrin receptor stayed soluble (Fig. 1C); and on intact cells
      GP colocalised with GM1 in large plasma-membrane patches by confocal microscopy (Fig.
      2A). GP was also found in raft fractions of Ebola-infected cells, not only transfected
      cells.
    action: ACCEPT
    reason: >-
      The CACAO term matches the assay exactly: it is neither a phenotype read as a process
      nor a single-image localisation, and it is internally controlled in both directions, by
      a mutant and a drug that abolish it and by a raft-excluded protein that does not
      partition with it. UniProt reaches the same conclusion from the same paper. The raft is
      the functionally relevant plasma-membrane subdomain for GP: it is the assembly and
      budding platform, and filovirus entry also requires intact rafts.
    supported_by:
      - reference_id: PMID:11877482
        supporting_text: a significant fraction of Ebola and Marburg GPs were found to reside
          in rafts
      - reference_id: PMID:11877482
