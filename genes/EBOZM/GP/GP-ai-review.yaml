      flagged as a source defect.
  findings:
    - statement: The GP2 fusion peptide interacts with the host membrane and leads to membrane
        fusion
      supporting_text: This region interacts with the cellular membrane of the host and leads
        to membrane fusion.
      full_text_unavailable: true
    - statement: The fusion peptide interacts with detergent-resistant membrane fractions,
        with Trp8 and Phe12 required for its structure in the bilayer
      supporting_text: EBO(16) can interact with detergent-resistant membrane fractions
      full_text_unavailable: true
    - statement: The peptide structure was determined in SDS micelles and detergent-resistant
        membranes, not with defined lipids
      supporting_text: insertion of the peptide was modeled by experiments in which the
        tryptophan fluorescence and (1)H NMR were monitored in the presence of sodium dodecyl
        sulfate micelles or in the presence of detergent-resistant membrane fractions
      full_text_unavailable: true
- id: PMID:20202662
  title: Ebola virus uses clathrin-mediated endocytosis as an entry pathway.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      The paper itself is sound and highly relevant, and it supports its GO:0046718 CACAO row
      exactly. It is recorded as MISCITED because of the other CACAO row keyed to it,
      GO:0030430 host cell cytoplasm IDA: the complete text (Materials and methods and Results
      recovered from PubMed Central, since the cached copy holds only abstract, introduction
      and discussion) contains no experiment localising GP. All imaging is of host
      eGFP-clathrin, labelled transferrin, transferrin receptor and mRFP-Eps15; the viral
      readout is GFP reporter infectivity. The judgment is about that one citation, not about
      the paper.
  findings:
    - statement: Four independent perturbations of the clathrin pathway block EbGP-mediated
        entry without affecting wild-type HIV or VSVg-pseudotyped HIV
      supporting_text: Inhibition of clathrin pathway using dominant-negative Eps15,
        siRNA-mediated knockdown of clathrin heavy chain, chlorpromazine and sucrose blocked
        EbGP pseudotyped HIV infection.
    - statement: Chlorpromazine and bafilomycin A1 also block entry of replication-competent
        Ebola virus, so entry is clathrin- and pH-dependent
      supporting_text: Also, both chlorpromazine and Bafilomycin A1 inhibited entry of
        infectious EBOV.
    - statement: The study's stated aim and conclusion concern the endocytic route of entry,
        not the localisation of the glycoprotein
      supporting_text: In this study we examined whether EBOV requires the clathrin-mediated
        endocytic pathway for entry.
      reference_section_type: INTRODUCTION
    - statement: The authors allow that Ebola virus may use additional entry routes in other
        settings
      supporting_text: it is also possible that EBOV could utilize other entry pathways in
        addition to clathrin-mediated endocytosis under different circumstances
      reference_section_type: DISCUSSION
- id: PMID:21223600
  title: Full-length Ebola glycoprotein accumulates in the endoplasmic reticulum.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Correctly cited for the claim it is used for, and full text was read. Rated LOW_QUALITY
      rather than VERIFIED because the single observation rests on transient transfection of 8
      to 10 micrograms of plasmid for 24 hours with a cytotoxic protein, uses co-expressed
      marker plasmids rather than endogenous markers, reports no Golgi signal despite the
      established furin cleavage of GP in the trans-Golgi, and is contradicted for the plasma
      membrane by work the authors themselves cite. Sufficient for a non-core location, not
      for a core one.
  findings:
    - statement: Transiently expressed full-length GP colocalises with a DsRed2-ER marker
      supporting_text: Co-expression of Ebola GP with DsRed2-ER showed that GP had localized
        within the ER (Figure 1B).
      reference_section_type: RESULTS
    - statement: GP lacking the mucin-like region does not accumulate in the endoplasmic
        reticulum
      supporting_text: it did not accumulate in the ER (Figure 2A)
      reference_section_type: RESULTS
    - statement: GP was not detected in the Golgi or in early or late endosomes in this assay
      supporting_text: Notably, GP was not found within late endosomes (Figure 1B), Golgi or
        early endosomes (data not shown).
      reference_section_type: RESULTS
    - statement: Other studies place GP at the plasma membrane in infected non-human primate
        tissue and in HeLa cells
      supporting_text: However, separate studies show that Ebola GP localizes in the plasma
        membrane of either tissues from experimentally infected non-human primates
      reference_section_type: DISCUSSION
