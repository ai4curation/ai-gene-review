- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:21987757
  qualifier: located_in
  review:
    summary: >-
      Bimolecular complementation imaging showed VP40-VP40 complexes concentrated
      at the plasma membrane of mammalian cells, which is where the matrix
      assembles.
    action: ACCEPT
    reason: >-
      This is a direct, sub-compartment-resolved observation in living mammalian
      cells, and it distinguishes the VP40-VP40 signal (plasma membrane) from the
      VP40-NP and NP-NP signal (dispersed cytoplasmic), so the plasma-membrane
      assignment is not a bulk-membrane default. It agrees with every other
      localisation study of VP40 and is the location of the core activity.
    supported_by:
    - reference_id: PMID:21987757
      supporting_text: "We demonstrate that VP40-VP40 complexes localized predominantly at the plasma membrane, whereas VP40-NP and NP-NP complexes displayed a more dispersed pattern throughout the cytoplasm."
- term:
