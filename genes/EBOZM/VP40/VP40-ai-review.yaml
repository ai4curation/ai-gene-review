    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0694
  review:
    summary: >-
      The octameric ring form of VP40 binds a specific single-stranded RNA
      sequence in a pocket formed at the dimer-dimer interface, so the
      keyword-derived RNA-binding term is correct and is a genuine second
      activity alongside the matrix function.
    action: ACCEPT
    reason: >-
      The 1.6 A crystal structure of the VP40 N-terminal domain octamer was solved
      in complex with RNA, and the octamer is detectable in infected cells, so
      this is not an in vitro artefact. UniProt assigns the octamer to genome
      replication and RNA binding, distinguishing it from the hexameric form that
      performs budding. The term is at the right granularity: the ligand is a
      short single-stranded sequence rather than a defined functional RNA class.
