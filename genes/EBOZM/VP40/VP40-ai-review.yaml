      granularity. This is not the single-assay-localization failure pattern: the
      raft association is replicated across systems within the paper and is
      independently corroborated by the detergent-resistant-membrane results cited
      in PMID:23297401. GO has no host-specific raft term, so GO:0045121 is the
      only available choice. The cached record is abstract-only and the GONUTS wiki
      page for this PMID was offline when checked, so the student's own figure
      citations could not be inspected; the abstract alone is explicit enough to
      support the row.
