- id: PMID:23663837
  title: 'The Ebola virus matrix protein deeply penetrates the plasma membrane: an
    important step in viral egress.'
  findings:
  - statement: VP40 penetrates 8.1 angstrom into the hydrocarbon core of the plasma
      membrane bilayer.
    supporting_text: "Experimental results indicate that VP40 penetrates 8.1 Å into the hydrocarbon core of the plasma membrane bilayer."
  - statement: VP40 itself deforms membranes, tubulating liposomes and vesiculating
      giant unilamellar vesicles, in a manner abolished by hydrophobic mutations.
    supporting_text: "VP40 also induces substantial changes to membrane curvature as it tubulates liposomes and induces vesiculation into giant unilamellar vesicles, effects that are abrogated by hydrophobic mutations."
  - statement: The same hydrophobic residues are required for plasma membrane
      localisation and for VLP formation and release from cells.
    supporting_text: "hydrophobic residues that penetrate deeply into the plasma membrane are essential for plasma membrane localization and virus-like particle formation and release from cells."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified with full text cached. The membrane-deformation result is the
      evidence that VP40 performs part of the work of budding rather than merely
      being required for it.
