- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:21987757
  qualifier: located_in
  review:
    summary: >-
      A dispersed cytoplasmic pool of VP40 exists, seen as VP40-NP complexes and
      as the monomer/dimer reservoir, but the matrix activity happens after
      recruitment to the plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cytoplasmic signal is real and directly observed: VP40-NP and NP-NP
