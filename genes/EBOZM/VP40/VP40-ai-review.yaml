      residues responsible are required for VLP formation and release. This is the
      core process term for the gene.
    action: ACCEPT
    reason: >-
      VP40 does the work of this process rather than merely being needed for it:
      it supplies the membrane-deforming activity directly, as shown by liposome
      tubulation and GUV vesiculation with purified protein, and the same
      hydrophobic residues required for deformation are required for particle
