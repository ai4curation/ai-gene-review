      number-and-brightness analysis independently shows the cytosolic pool is
      predominantly monomeric and dimeric. The term is as precise as that evidence
      allows. It is non-core because this pool is the pre-assembly reservoir: the
      oligomerisation, membrane deformation and budding that define VP40 occur at
      the plasma membrane, not in the cytoplasm.
