- term:
    id: GO:0046761
    label: viral budding from plasma membrane
  evidence_type: IMP
  original_reference_id: PMID:11333902
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the strongest of the six: Jasenosky et al. 2001 showed that
      VP40 expressed alone induces membrane-bound particle formation, that this
      depends on the N-terminal PPxY motif, and that C-terminal truncation
      abolishes it.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene: VP40 expressed in mammalian cells apart
      from all other viral proteins induces the formation of membrane-bound
      particles; mutation or loss of the conserved N-terminal PPxY motif markedly
      reduces particle formation; and truncation of the C-terminal 50 residues both
      disrupts hydrophobic membrane association and abolishes particle formation.
      The CACAO term matches this precisely and at the right granularity, and the
      mutant series makes it a genuine IMP rather than an inference from
      localisation. The authors' own conclusion, that VP40 alone possesses the
      information necessary to induce particle formation, is exactly the claim
      GO:0046761 encodes. The cached record is abstract-only and the GONUTS page
      was offline, but the abstract states each mutant result, so no deference
      problem arises.
    additional_reference_ids:
