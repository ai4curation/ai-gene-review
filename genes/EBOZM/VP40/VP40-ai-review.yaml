suggested_questions:
- question: >-
    Does VP40 contribute any activity to intracellular movement of the
    nucleocapsid, or is it required only at the plasma-membrane destination? The
    CACAO GO:0075733 annotation assumes the former while the NP/VP35/VP24
    sufficiency result argues the latter, and the distinction decides whether any
    transport term belongs on VP40 at all.
- question: >-
    GO has no host-specific membrane raft term, so VP40's raft residence must be
    annotated with the host-agnostic GO:0045121. Should a host cell membrane raft
    term be created to parallel the host cell plasma membrane and host cell
    endomembrane system series?
- question: >-
    Is the RNA-binding octamer a stoichiometric component of any ribonucleoprotein
    assembly in infected cells, or only a transient RNA-stabilised ring? This is
    what separates the accepted GO:0003723 activity from the GO:1990904 part_of
    claim marked over-annotated here.
- question: >-
    The host cell endomembrane system and host cell late endosome membrane rows on
    Q05128 rest entirely on similarity to Marburg VP40. Has the Zaire protein ever
    been localised to a resolved endomembrane compartment directly, and if not
    should these rows be downgraded or dropped from UniProt's Zaire record?
suggested_experiments:
- hypothesis: VP40 is required at the plasma-membrane assembly site but does not
    itself move nucleocapsids through the cytoplasm.
  description: >-
    Live-cell single-particle tracking of fluorescently tagged nucleocapsids in
    cells infected with a VP40-deficient recombinant virus (trans-complemented for
    growth), measuring nucleocapsid transport velocity and run length directly
    rather than inferring transport from a failure to arrive at the plasma
    membrane. This settles whether VP40 has any role in GO:0075733.
  experiment_type: live-cell imaging
- hypothesis: The endomembrane and late-endosome-membrane locations transferred from
    Marburg VP40 either hold or do not hold for the Zaire protein.
  description: >-
    Subcellular fractionation plus immuno-electron microscopy of Zaire
    ebolavirus-infected cells, probing specifically for VP40 on late endosomal and
    multivesicular-body membranes with compartment markers, to replace the
    Marburg-similarity basis of these annotations with direct evidence or to
    exclude them.
  experiment_type: immuno-electron microscopy
- hypothesis: The VP40 octamer binds viral genomic RNA in infected cells and is or
    is not part of a ribonucleoprotein assembly.
  description: >-
    RNA immunoprecipitation and sequencing (RIP-seq) of VP40 from infected cells,
    together with octamerisation-defective mutants, to identify the physiological
    RNA ligands of the octamer and determine whether VP40-RNA complexes contain
    viral genomic RNA and nucleocapsid proteins.
  experiment_type: RIP-seq
- hypothesis: VP40 suppresses RNA silencing by engaging a defined component of the
    host RNAi machinery, as VP30 and VP35 do.
  description: >-
    Test VP40 for interaction with Dicer, TRBP and PACT, and for effects on siRNA
    loading into Argonaute, so that the GO:0140533 annotation rests on a molecular
    mechanism rather than on a suppression phenotype alone.
  experiment_type: interaction and RNAi reconstitution assays
