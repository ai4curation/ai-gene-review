id: Q05128
gene_symbol: VP40
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:128952
  label: Ebola virus - Mayinga, Zaire, 1976
description: >-
  VP40 is the matrix protein of Zaire ebolavirus and the most abundant protein in
  the virion. It is a two-domain, conformationally plastic protein: the N-terminal
  domain drives self-association into dimers, hexamers and octamers, while the
  C-terminal domain binds and inserts into the cytoplasmic face of the host plasma
  membrane, with anionic lipids (phosphatidylserine and PI(4,5)P2) acting as the
  lipid determinants. At the plasma membrane inner leaflet, and enriched in
  detergent-resistant raft microdomains, VP40 oligomerises into the matrix layer
  that deforms the bilayer, recruits the nucleoprotein-containing ribonucleocapsid
  and, through two overlapping late-budding motifs (PTAP/PSAP and PPxY), recruits
  host ESCRT and ESCRT-associated factors (TSG101, NEDD4, ALIX, VPS4) and HECT E3
  ubiquitin ligases (SMURF2, WWP1, ITCH). VP40 expressed alone is sufficient to
  make and release virus-like particles, so it carries the whole structural
  programme for assembly and budding. A minor octameric ring form binds a specific
  single-stranded RNA sequence through a pocket at its dimer-dimer interface and
  acts in genome replication rather than in budding. VP40 also has host-directed
  activities away from the membrane: it suppresses RNA interference, it enters the
  nucleus and raises cyclin D1 transcription so that the cell cycle and
  extracellular-vesicle biogenesis are dysregulated, and it is packaged into
  secreted exosomes that reduce the viability of recipient immune cells.
