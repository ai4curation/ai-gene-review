  review:
    summary: >-
      Keyword-derived part_of claim that overstates the evidence: VP40 binds RNA as
      an octamer, but it is the matrix protein and is not an established subunit of
      a ribonucleoprotein complex in the infected cell or the virion.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The Ribonucleoprotein keyword follows from the RNA-binding octamer, and that
      activity is real (and accepted in this review as GO:0003723). But part_of a
      ribonucleoprotein complex is a structural membership claim, and the data do
      not reach it. The RNA-bound species is a crystallographic complex of the
      N-terminal domain with a short single-stranded sequence; VP40's role in the
      virion is the matrix layer beneath the envelope, not the nucleocapsid, and the
      authors could not detect the SDS-resistant octamer-RNA form in purified virus
      particles. The claim is not plainly false, since the octamer is detectable in
      infected cells, so this is an over-annotation to flag rather than an
      annotation to remove.
