- id: PMID:30169850
  title: Ebola Virus VP40 Modulates Cell Cycle and Biogenesis of Extracellular Vesicles.
  findings:
  - statement: Nuclear VP40 binds the cyclin D1 promoter and raises cyclin D1 levels,
      accelerating the cell cycle of producer cells.
    supporting_text: "VP40 clones were accelerated in growth due to cyclin D1 upregulation, and nuclear VP40 was found bound to the cyclin D1 promoter."
  - statement: Dysregulated cell cycling is linked to altered extracellular vesicle
      biogenesis.
    supporting_text: "Nuclear VP40 upregulates cyclin D1 levels, resulting in dysregulated cell cycle and EV biogenesis."
  - statement: VP40-containing extracellular vesicles induce apoptosis in recipient T
      cells and monocytes.
    supporting_text: "VP40 EVs induced apoptosis in recipient T cells and monocytes."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified with full text cached. Supports the cell-cycle perturbation
