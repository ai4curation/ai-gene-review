    reason: >-
      What the paper shows for this gene: VP40 oligomers are detected in lipid
      rafts in three independent systems (transfected mammalian cells,
      VP40-derived VLPs, and authentic Ebola virus particles), and C-terminal
      mutagenesis coordinately disrupts oligomerisation at the plasma membrane,
