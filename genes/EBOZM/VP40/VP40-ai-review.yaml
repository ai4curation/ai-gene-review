- term:
    id: GO:0046755
    label: viral budding
  evidence_type: IMP
  original_reference_id: PMID:16837071
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. McCarthy et al. 2006 built a luciferase-based budding assay and
      showed that a budding-deficient VP40 mutant loses luciferase from the VLP
      fraction, which supports a VP40 budding role; but the assay specifically
      measures release of particles from the cell surface, so the
      plasma-membrane-specific descendant is the better term.
    action: MODIFY
    reason: >-
      What the paper shows for this gene: VP40 expressed in mammalian cells buds as
      a VLP and incorporates co-expressed firefly luciferase, so luciferase in the
      VLP fraction is a direct quantitative readout of VP40 budding efficiency;
      co-expression of EBOV GP enhances release, and a budding-deficient VP40
      mutant significantly reduces luciferase in the VLP fraction. The CACAO term
      is supported by the student's own paper and is not a phenotype read as a
      process. The issue is granularity: the VLP fraction is material released from
      the cell surface, which is GO:0046761 viral budding from plasma membrane, a
      term this gene already carries with IDA and IMP support. The cached record is
      abstract-only and the GONUTS wiki page for this PMID could not be read (the
      wiki was offline), so the student's figure citations were unavailable; the
      abstract states the mutant result explicitly, so this is a refinement, not a
      challenge to the row.
    proposed_replacement_terms:
    - id: GO:0046761
      label: viral budding from plasma membrane
    supported_by:
    - reference_id: PMID:16837071
      supporting_text: "In contrast, when luciferase is co-expressed with a budding deficient mutant of VP40, luciferase levels in the VLP fraction decrease significantly."
    - reference_id: PMID:16837071
      supporting_text: "The VP40 matrix protein of Ebola virus (EBOV) is capable of budding from mammalian cells as a virus-like particle (VLP) and is the major protein involved in virus egress."
- term:
    id: GO:0046761
