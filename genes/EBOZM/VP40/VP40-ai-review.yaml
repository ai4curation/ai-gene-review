- id: PMID:10864502
  title: Structural characterization and membrane binding properties of the matrix
    protein VP40 of Ebola virus.
  findings:
  - statement: Cross-linking and electron microscopy show that C-terminally truncated
      VP40 self-associates into hexamers while the longer polypeptide is monomeric.
    supporting_text: "As indicated by chemical cross-linking studies and electron microscopy, the larger polypeptide was present in a monomeric form, whereas the truncated one formed hexamers."
  - statement: The C-terminal part of VP40 is required for efficient association with
      membranes containing negatively charged lipids.
    supporting_text: "Membrane association of truncated, hexameric VP40 was inefficient, indicating a membrane-recognition role for the C-terminal part."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary paper on Ebola VP40 (J Mol Biol 2000). Cached record
      is abstract-only, but the abstract states the cross-linking/EM oligomerisation
      and membrane-binding results used here, which is sufficient for the
      self-association claim.
- id: PMID:11333902
  title: Ebola virus VP40-induced particle formation and association with the lipid
    bilayer.
  findings:
  - statement: VP40 expressed alone in mammalian cells induces membrane-bound particle
      formation, dependent on its conserved N-terminal PPxY motif.
    supporting_text: "We found that VP40 is indeed able to induce particle formation when it is expressed in mammalian cells, and this process appeared to rely on a conserved N-terminal PPXY motif, as mutation or loss of this motif resulted in markedly reduced particle formation."
  - statement: Flotation gradient analysis demonstrates hydrophobic, salt-resistant
      association of VP40 with cellular membranes.
    supporting_text: "Flotation gradient analysis indicated that VP40 binds to membranes in a hydrophobic manner, as NaCl at 1 M did not release the protein from the lipid bilayer."
  - statement: VP40 alone carries the information needed for particle formation.
    supporting_text: "These findings demonstrate that VP40 alone possesses the information necessary to induce particle formation"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Virol 2001, PMC114926); the paper's subject is EBOV VP40
      itself, so the two CACAO rows citing it are not a paper-not-about-gene case.
      Cached record is abstract-only and PMC full text was not retrievable; the
      abstract states each mutant result relied on here.
- id: PMID:12679020
  title: The matrix protein VP40 from Ebola virus octamerizes into pore-like structures
    with specific RNA binding properties.
  findings:
  - statement: The X-ray structure shows VP40 N-terminal domains assembled into an
      octameric ring.
    supporting_text: "Here we present the X-ray structure of octameric VP40 assembled through its N-terminal domain (NTD)."
  - statement: The octamer binds a specific RNA sequence and this RNA-bound form is
      present in infected cells.
    supporting_text: "This strongly indicates, together with the RNA binding properties of full-length oligomeric VP40 in vitro, that octameric VP40 bound to a specific RNA sequence plays a role in the virus life cycle."
  - statement: The SDS-resistant octamer-RNA species was not detected in purified virus
      particles.
    supporting_text: "However, no high molecular weight band corresponding to the SDS-resistant form detected in virus-infected cells could be detected, indicating that octameric VP40 might not be abundantly present in virus particles (Figure 5C)."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified structural paper with full text cached. It is the primary basis
      for the RNA-binding activity and, equally, for declining the
      ribonucleoprotein-complex membership claim.
- id: PMID:14673115
  title: In vivo oligomerization and raft localization of Ebola virus protein VP40
    during vesicular budding.
  findings:
  - statement: VP40 oligomers are present in lipid rafts of mammalian cells, in VLPs
      and in authentic Ebola virus.
    supporting_text: "Here, we demonstrate VP40 oligomers in lipid rafts of mammalian cells, virus-like particles, and in the authentic Ebola virus."
  - statement: VP40 actively recruits the ESCRT-I component TSG101 into lipid rafts.
    supporting_text: "Furthermore, we demonstrate the active recruitment of TSG101 into lipid rafts by VP40."
  - statement: C-terminal mutagenesis coordinately disrupts oligomerisation at the plasma
      membrane, detergent-resistant membrane association and vesicular release.
    supporting_text: "By mutagenesis, we identify several critical C-terminal sequences that regulate oligomerization at the plasma membrane, association with detergent-resistant membranes, and vesicular release of VP40, directly linking these phenomena."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PNAS 2003, PMC307671). Cached record is abstract-only and PMC
      full text was not retrievable, and the GONUTS page for this PMID was offline
      when checked, so the CACAO student's figure citations could not be inspected;
      the abstract is explicit about the raft localisation in three systems.
- id: PMID:16837071
  title: A luciferase-based budding assay for Ebola virus.
  findings:
  - statement: VP40 buds from mammalian cells as a VLP and is the major protein driving
      EBOV egress.
    supporting_text: "The VP40 matrix protein of Ebola virus (EBOV) is capable of budding from mammalian cells as a virus-like particle (VLP) and is the major protein involved in virus egress."
  - statement: A budding-deficient VP40 mutant significantly reduces luciferase in the
      released VLP fraction, making luciferase a quantitative readout of VP40 budding.
    supporting_text: "In contrast, when luciferase is co-expressed with a budding deficient mutant of VP40, luciferase levels in the VLP fraction decrease significantly."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified methods paper (J Virol Methods 2006). It genuinely assays VP40
      budding, so the CACAO row citing it is supported; the paper's purpose is assay
      development, which is why the readout is particle release from the cell surface
      rather than a compartment-resolved mechanism. Cached record is abstract-only.
- id: PMID:21228243
  title: Ebolavirus proteins suppress the effects of small interfering RNA by direct
    interaction with the mammalian RNA interference pathway.
  findings:
  - statement: A screen of all EBOV proteins identified VP40, alongside VP30 and VP35,
      as an independent suppressor of RNA silencing.
    supporting_text: "In addition to viral protein 35 (VP35), we found that VP30 and VP40 independently act as SRSs."
  - statement: The molecular mechanism was resolved for VP30 and VP35, not for VP40.
    supporting_text: "Here, we present the molecular mechanisms of VP30 and VP35."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Virol 2011, PMC3067942). The VP40 claim is a screen-level
      suppression phenotype; the abstract explicitly limits the mechanistic analysis
      to VP30 and VP35, which is why the GO:0140533 row is kept as non-core rather
      than accepted as core. Cached record is abstract-only.
- id: PMID:21987757
  title: Characterization of filovirus protein-protein interactions in mammalian cells
    using bimolecular complementation.
  findings:
  - statement: VP40-VP40 complexes localise predominantly to the plasma membrane while
      VP40-NP and NP-NP complexes are dispersed in the cytoplasm.
    supporting_text: "We demonstrate that VP40-VP40 complexes localized predominantly at the plasma membrane, whereas VP40-NP and NP-NP complexes displayed a more dispersed pattern throughout the cytoplasm."
  - statement: VP40 self-association depends on the LPLGVA motif rather than on the
      PTAPPEY/PPPY late domains.
    supporting_text: "the formation of EBOV or MARV VP40-VP40 complexes was dependent on the previously characterized LPLGVA and LPLGIM motifs of EBOV and MARV VP40 proteins, respectively, indicating that these motifs are important for VP40 oligomerization and subsequent budding"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Infect Dis 2011, PMC3189979). Source of UniProt's
      experimentally evidenced host cytoplasm and host cell membrane locations for
      Q05128, and it distinguishes the two pools, which is what makes the plasma
      membrane assignment specific rather than a default. Cached record is
      abstract-only.
- id: PMID:23297401
  title: 'The Ebola virus matrix protein penetrates into the plasma membrane: a key
    step in viral protein 40 (VP40) oligomerization and viral egress.'
  findings:
  - statement: Hydrophobic C-terminal residues Leu213, Ile293, Leu295 and Val298 are
      required for plasma membrane penetration, plasma membrane localisation,
      oligomerisation and particle egress.
    supporting_text: "Mutagenesis of this hydrophobic region consisting of Leu 213 , Ile 293 , Leu 295 , and Val 298 demonstrated that membrane penetration is critical to plasma membrane localization, VP40 oligomerization, and viral particle egress."
  - statement: The paper's cellular readouts are plasma-membrane localisation scoring
      and VLP release, with no assay of viral or nucleocapsid movement within the cell.
    supporting_text: "Release of VLPs was not detectable for L213A or L295A, whereas I293A and V298A had significantly reduced VLP release."
  - statement: Wild-type VP40 is predominantly at the plasma membrane with VLP
      extensions, while the hydrophobic mutants become diffusely cytosolic.
    supporting_text: "WT EGFP-VP40 was predominantly localized to the PM with strong visual evidence of VLP extensions stemming from the PM"
  - statement: The cytoplasmic and premembrane pool of VP40 is predominantly monomeric
      and dimeric.
    supporting_text: "the majority of VP40 in the cytoplasm or premembrane zone in the current and previous study ( 24 ) is monomeric or dimeric"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified with full text cached, which is what allowed the two CACAO rows
      citing it to be judged on the paper's actual assays. The paper supports a
      plasma-membrane localisation and budding role but contains no transport
