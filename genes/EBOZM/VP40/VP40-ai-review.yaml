- term:
    id: GO:0033644
    label: host cell membrane
  evidence_type: IDA
  original_reference_id: PMID:11333902
  qualifier: part_of
  review:
    summary: >-
      CACAO row. Jasenosky et al. 2001 directly demonstrated VP40 membrane
      association by flotation gradient and Triton X-114 phase partitioning, so
      the claim is right; but the membrane VP40 associates with is the plasma
      membrane, which is the granularity the rest of the evidence (and UniProt's
      own curated location) supports.
    action: MODIFY
    reason: >-
      What the paper shows for this gene: VP40 expressed alone in mammalian cells
      floats with cellular membranes in a sucrose flotation gradient and is not
      released by 1 M NaCl, indicating hydrophobic rather than purely
      electrostatic membrane binding; Triton X-114 partitioning shows it has only
      minor integral-membrane character; and C-terminal truncation of 50 residues
      reduces membrane association and abolishes particle formation. The student's
      term is therefore supported, not a phenotype read as a location. The problem
      is granularity: a bulk flotation assay on total cellular membranes was
      annotated to the parent term GO:0033644, and the papers that resolve the
      compartment all place VP40 at the plasma-membrane inner leaflet (the
      descendant GO:0020002 this gene already carries from three EXP rows, and
      which is what UniProt's own SL-0375 "Host cell membrane" maps to). Replacing
      with GO:0020002 keeps the student's correct claim and adds the compartment
      the field has since established. Note GO:0033644 is not a root organelle
      term, so the organelle-policy exception does not apply to it.
    proposed_replacement_terms:
    - id: GO:0020002
      label: host cell plasma membrane
    additional_reference_ids:
    - PMID:23297401
    - file:genes/EBOZM/VP40/VP40-uniprot.txt
    supported_by:
    - reference_id: PMID:11333902
      supporting_text: "Flotation gradient analysis indicated that VP40 binds to membranes in a hydrophobic manner, as NaCl at 1 M did not release the protein from the lipid bilayer."
    - reference_id: PMID:23297401
      supporting_text: "WT EGFP-VP40 was predominantly localized to the PM with strong visual evidence of VLP extensions stemming from the PM"
- term:
    id: GO:0033644
    label: host cell membrane
  evidence_type: IMP
  original_reference_id: PMID:23297401
  qualifier: part_of
  review:
    summary: >-
      CACAO row. Adu-Gyamfi et al. 2013 used hydrophobic C-terminal mutants to
      show that membrane insertion is required for VP40 localisation; the paper's
      own assays are explicitly plasma-membrane-resolved, so the parent term
      GO:0033644 is less specific than the evidence in hand.
    action: MODIFY
    reason: >-
      What the paper shows for this gene: monolayer penetration assays (Fig. 2A)
      distinguish a plasma-membrane mimetic (critical surface pressure ~34 mN/m)
      from a nuclear-membrane mimetic (~25 mN/m), so insertion is
      plasma-membrane-selective; confocal imaging of HEK293 cells (Fig. 3) shows
      WT EGFP-VP40 at the plasma membrane with VLP extensions while L213A, I293A,
      L295A and V298A are diffusely cytosolic with only 16-21% of cells showing
      detectable PM localisation; the L303A control is unaffected; and Western
      blots of released VLPs (Fig. 8) show loss of egress for the same mutants.
      The CACAO term matches the result in kind but not in granularity: every
      assay in the paper reads out the plasma membrane specifically, and the
      control monolayer was chosen to exclude other cellular membranes. Replacing
      with the descendant GO:0020002, which this gene already carries, records the
      compartment the paper actually resolved.
    proposed_replacement_terms:
    - id: GO:0020002
      label: host cell plasma membrane
    supported_by:
    - reference_id: PMID:23297401
      supporting_text: "Mutagenesis of this hydrophobic region consisting of Leu 213 , Ile 293 , Leu 295 , and Val 298 demonstrated that membrane penetration is critical to plasma membrane localization, VP40 oligomerization, and viral particle egress."
    - reference_id: PMID:23297401
      supporting_text: "For I293A, L295A, and V298A, only 16–21% of cells exhibited detectable PM localization"
