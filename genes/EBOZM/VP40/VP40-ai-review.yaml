    supported_by:
    - reference_id: PMID:21228243
      supporting_text: "In addition to viral protein 35 (VP35), we found that VP30 and VP40 independently act as SRSs."
    - reference_id: PMID:21228243
      supporting_text: "Here, we present the molecular mechanisms of VP30 and VP35."
