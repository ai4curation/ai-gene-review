- term:
    id: GO:0075733
    label: intracellular transport of virus
  evidence_type: IMP
  original_reference_id: PMID:23297401
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the one genuine mis-assignment of the six. The cited paper
      contains no transport assay: its mutants are scored for plasma-membrane
      penetration, plasma-membrane localisation, oligomerisation and VLP release,
      which is budding, not movement of virus within the cell.
    action: MODIFY
    reason: >-
      GO:0075733 is defined as the directed movement of a virus, or part of a
      virus, within the host cell. What the paper actually shows for this gene:
      lipid monolayer penetration measurements in vitro (Fig. 2), confocal scoring
      of plasma-membrane localisation for L213A, I293A, L295A, V298A and the L303A
      control (Fig. 3), TIRF number-and-brightness oligomerisation analysis (Figs.
      4-7), and Western blotting of released VLPs (Fig. 8). None of these follows a
      virus or viral component moving through the cytoplasm; the mutant phenotype
      is failure to reach and insert into the plasma membrane and failure to
      release particles. This is the egress-read-as-transport variant of the
      phenotype-as-process pattern. The only transport statement in the paper is a
      citation to earlier work that the nucleocapsid is not effectively transported
      to the plasma membrane without VP40, which is consistent with VP40 being
      required at the destination rather than performing the movement; Takamatsu et
      al. (PubMed:29339477, in the UniProt reference list) subsequently concluded
      that NP, VP35 and VP24 are essential and sufficient for nucleocapsid
      transport, i.e. VP40 is not part of the transport machinery. The essence of
      the student's reading, that these mutants break the VP40 egress pathway, is
      sound, so this is a lateral correction to GO:0046761 viral budding from
      plasma membrane, the term the paper's assays actually read out and which this
      gene already carries. Note also that this row seeded the GO:0043657 host cell
      IEA by inter-ontology inference (GO_REF:0000108).
    proposed_replacement_terms:
    - id: GO:0046761
      label: viral budding from plasma membrane
    supported_by:
    - reference_id: PMID:23297401
      supporting_text: "Taken together, C-terminal domain membrane penetration is important for VP40 plasma membrane localization and critical to viral egress."
    - reference_id: PMID:23297401
      supporting_text: "Release of VLPs was not detectable for L213A or L295A, whereas I293A and V298A had significantly reduced VLP release."
- term:
