  evidence_type: IDA
  original_reference_id: PMID:14673115
  qualifier: part_of
  review:
    summary: >-
      CACAO row, and a well-chosen one: Panchal et al. 2003 directly demonstrated
      VP40 oligomers in lipid rafts of mammalian cells, in VLPs and in authentic
