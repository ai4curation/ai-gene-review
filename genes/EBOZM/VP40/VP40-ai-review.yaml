  review:
    summary: >-
      VP40 requires the plasma-membrane-restricted lipid PI(4,5)P2 for extensive
      oligomerisation at the cell surface and for VLP egress, confirming the
      plasma membrane as its functional site.
    action: ACCEPT
    reason: >-
      Depletion of PI(4,5)P2 with a plasma-membrane-targeted 5-phosphatase
