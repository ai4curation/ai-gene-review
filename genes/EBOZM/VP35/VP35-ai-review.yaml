- term:
    id: GO:0010629
    label: negative regulation of gene expression
  evidence_type: IDA
  original_reference_id: PMID:12829834
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Basler et al. showed that VP35 expression blocks virus-induced
      activation of host IRF3-responsive promoters (ISG54-CAT, ISG56-luciferase,
      IFN-alpha4-CAT) in Vero and 293T cells, and blocks IRF-3 phosphorylation,
      dimerization and nuclear translocation. Host gene expression is indeed
      reduced, but a root-level regulation-of-gene-expression term discards
      everything the experiment established.
    action: MODIFY
    reason: >-
      What the paper actually measures is the interferon-induction arm of
      innate immunity: reporter promoters that IRF-3 drives, plus native-gel
      dimerization and 32P-labelling of IRF-3 (Figs 1-4). The claim is sound,
      so this is not an over-annotation; it is the wrong granularity. For a
      virus protein the informative class is the symbiont-interaction branch,
      and the mechanism identified -- loss of virus-induced IRF-3
      phosphorylation, with no effect on the constitutively active IRF-3 5D
      mutant -- is exactly GO:0039548. The CACAO term matched the observation
      (less host gene expression) rather than the process the observation was
      reporting on.
    proposed_replacement_terms:
    - id: GO:0039548
      label: symbiont-mediated suppression of host cytoplasmic pattern recognition receptor
        signaling pathway via inhibition of IRF3 activity
    supported_by:
    - reference_id: PMID:12829834
      supporting_text: >-
        VP35 blocks virus-induced IRF-3 phosphorylation and subsequent IRF-3
        dimerization and nuclear translocation.
    - reference_id: PMID:12829834
      supporting_text: >-
        Expression of the influenza virus NS1 protein or the VP35 protein of
        Ebola virus Zaire dramatically decreased the activation of either
        reporter gene (Fig. 1A and B).
- term:
    id: GO:0019013
    label: viral nucleocapsid
  evidence_type: IDA
  original_reference_id: PMID:12191476
  qualifier: part_of
  review:
    summary: >-
      CACAO row, and a well-chosen one. Huang et al. showed by transmission
      electron microscopy that co-expression of NP, VP35 and VP24 in 293T cells
      is sufficient for spontaneous nucleocapsid assembly, together with a
      specific biochemical interaction among the three proteins. Later in situ
      cryo-electron tomography placed VP35 in the nucleocapsid's outer layer.
    action: ACCEPT
    reason: >-
      The CACAO term matches the assay: nucleocapsid-like structures were
      visualised by TEM and VP35 is one of only three proteins needed to make
      them. Our cached copy of this 2002 paper is abstract-only and the GONUTS
      wiki was offline when checked, so the student's figure-level evidence
      could not be inspected -- but the claim does not depend on it. UniProt
      curates VP35 as part of the nucleocapsid outer layer from the 2024 cryo-ET
      structures (PubMed:39293445, PDB 8USN/8UST), so the structural membership,
      not merely a requirement for assembly, is independently established. Core:
      VP35 is both a structural nucleocapsid protein and the polymerase
      cofactor acting on that structure.
    supported_by:
    - reference_id: PMID:12191476
      supporting_text: >-
        Expression of the nucleoprotein (NP) and virion-associated proteins VP35
        and VP24 led to spontaneous assembly of nucleocapsids in transfected
        293T cells by transmission electron microscopy.
    - reference_id: file:EBOZM/VP35/VP35-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Part of the external layer of the nucleocapsid, likely tethering the
        nucleocapsid to the matrix and membrane
- term:
    id: GO:0019079
    label: viral genome replication
  evidence_type: IDA
  original_reference_id: PMID:25865894
  qualifier: involved_in
  review:
    summary: >-
      VP35 is an essential cofactor of the filoviral RNA-dependent RNA
      polymerase, and the VP35-NP interface characterised here controls the
      switch between RNA-bound and free NP, i.e. between genome replication and
      encapsidation. Minigenome assays in this paper read out VP35-dependent
      RNA synthesis directly.
    action: ACCEPT
    reason: >-
      One of the two core functions. VP35 is one of four proteins required for
      filoviral genome RNA synthesis, it bridges polymerase L to the
      NP-encapsidated template, and the NPBP/NP structure shows how it keeps
      newly made NP competent for the template-loading step.
    supported_by:
    - reference_id: PMID:25865894
      supporting_text: >-
        Our results also show that the VP35 NPBP binding relieves NP
        oligomerization and NP-RNA binding by interacting with two distinct
        regions within NP that are important for viral RNA synthesis.
    - reference_id: file:EBOZM/VP35/VP35-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        VP35-NP interaction controls the switch between RNA-bound NP and free NP
        and thus the switch between genome replication and genome packaging into
        the nucleocapsid
- term:
    id: GO:0019083
    label: viral transcription
  evidence_type: IDA
  original_reference_id: PMID:25865894
  qualifier: involved_in
  review:
    summary: >-
      The same polymerase cofactor role, on the transcription side. VP35 is one
      of the four proteins essential for transcription of the EBOV genome, and
      the NPBP-NP interface is required for the minigenome reporter activity
      measured in this paper.
    action: ACCEPT
    reason: >-
      Core. Independent of this paper, VP35 is an obligate subunit of the
      transcribing polymerase complex: it tethers the catalytic L protein to the
      nucleocapsid and is one of NP, L, VP35, VP30 (PMID:23493393); the
      cryo-EM L-VP35 structure (PubMed:40164610) shows the bridging
      arrangement.
    additional_reference_ids:
    - PMID:23493393
    supported_by:
    - reference_id: PMID:23493393
      supporting_text: >-
        For transcription of the viral genome four viral proteins are essential:
        the nucleoprotein NP, the polymerase L, the polymerase cofactor VP35,
        and VP30.
    - reference_id: PMID:23493393
      supporting_text: >-
        The enzymatically active part of the viral polymerase L is bound to the
        nucleocapsid by interaction with the polymerase cofactor VP35
