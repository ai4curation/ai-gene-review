      uninformative and no specific VP35 function is supported.
    action: REMOVE
    reason: >-
      The directionality here runs host to virus: DRBP76 overexpression impairs
      the EBOV transcription/replication complex and the authors conclude it
      exerts an anti-EBOV function (PMID:21987769). So this interaction records
      something a host protein does to VP35, and licenses no molecular function
      for VP35. Per the protein-binding policy a bare GO:0005515 row with no
      informative replacement is removed as uninformative; this says nothing
      against the reported interaction, which IntAct records independently.
    supported_by:
    - reference_id: PMID:21987769
      supporting_text: >-
        Overexpression of DRBP76 did not alter the ability of VP35 to inhibit
        type I IFN production but did impair the function of the EBOV
        transcription/replication complex.
    - reference_id: PMID:21987769
      supporting_text: >-
        These data suggest that DRBP76, via its association with VP35, exerts an
        anti-EBOV function.
