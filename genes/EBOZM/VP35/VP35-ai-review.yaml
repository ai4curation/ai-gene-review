id: Q05127
gene_symbol: VP35
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:128952
  label: Ebola virus - Mayinga, Zaire, 1976
description: >-
  VP35 is the filoviral polymerase cofactor, the structural and functional
  counterpart of the phosphoprotein (P) of other Mononegavirales, and
  simultaneously the virus's principal antagonist of interferon induction. It
  has two functional halves: an N-terminal region comprising a short,
  intrinsically disordered nucleoprotein-binding peptide (residues 20-48) and a
  coiled-coil oligomerization domain, and a C-terminal interferon inhibitory
  domain (IID) that binds double-stranded RNA. In the host cytoplasm, where
  filoviral RNA synthesis takes place, oligomeric VP35 bridges the catalytic
  polymerase L to the NP-encapsidated genome and is one of the four proteins
  (NP, L, VP35, VP30) required for transcription of the viral genome; its
  N-terminal peptide additionally holds newly made NP in a monomeric, RNA-free
  state, so the VP35-NP interaction governs the switch between RNA-bound NP
  (replication/encapsidation) and free NP. VP35 is also a structural protein:
  co-expression of NP, VP35 and VP24 is sufficient for nucleocapsid assembly,
  and VP35 forms part of the nucleocapsid's outer layer. Through the IID it
  sequesters duplex RNA away from the cytoplasmic sensor RIG-I, and it binds
  and inhibits the IRF3-activating kinases IKBKE/IKKepsilon and TBK1, so that
  virus-induced IRF3 phosphorylation, dimerization and nuclear translocation --
  and hence type I interferon gene induction -- are blocked. It does not block
  signalling downstream of the interferon receptor, which in Ebola virus is the
  job of VP24. Narrower immune-evasion activities include promoting
  PIAS1-mediated SUMOylation of IRF7, antagonism of the dsRNA-activated kinase
  PKR/EIF2AK2, suppression of RNA silencing through binding of the Dicer
  partners TARBP2/TRBP and PRKRA/PACT, and impairment of dendritic-cell
  maturation with consequent failure of CD4+ T-cell priming. Loss of its
  dsRNA-binding residues attenuates the virus in vivo without abolishing its
  polymerase cofactor function, showing that the two core activities are
  separable.
