suggested_questions:
- question: >-
    Does VP35 inhibit IKBKE/TBK1 catalytically, as a competitive pseudo-substrate
    (it is itself phosphorylated by IKKepsilon), or only by steric occlusion of
    the substrate-docking surface? The answer decides whether protein kinase
    inhibitor activity or molecular sequestering activity is the correct
    molecular function for that arm.
- question: >-
    Is the reduction of surface MHC class II on VP35-expressing dendritic cells
    purely a consequence of arrested maturation, or does VP35 also act on the
    MHC class II processing and loading pathway itself? Only the latter would
    justify GO:0039505.
- question: >-
    How much of VP35's interferon antagonism in a real infection is contributed
    by the IRF7-SUMOylation arm, given that the dsRNA-binding mutants are
    already strongly attenuated in vivo?
- question: >-
    Does suppression of RNA silencing contribute measurably to Ebola virus
    replication in mammalian cells, or is it, as the plant assays suggest, an
    activity whose relevant host is not the mammalian one?
suggested_experiments:
- description: >-
    Reconstituted in vitro kinase assays with purified IKKepsilon or TBK1,
    recombinant IRF3, and a titration of VP35 oligomerization-competent and
    -deficient variants, to distinguish competitive from steric inhibition and
    to obtain an inhibition constant.
- description: >-
    Antigen-specific presentation assay (OVA-pulsed VP35-expressing dendritic
    cells plus OT-II CD4+ T cells) combined with surface and total MHC class II
    quantification and an invariant-chain processing readout, to test whether
    VP35 affects presentation beyond the maturation block.
- description: >-
    Recombinant EBOV bearing separation-of-function VP35 mutants (dsRNA-binding
    deficient R312A/K309A, PACT-binding deficient, and an IRF7-SUMOylation
    deficient variant if one can be defined) compared in primary human
    monocyte-derived dendritic cells for interferon induction versus genome
    replication, to apportion the interferon phenotype among the three arms.
- description: >-
    Cryo-electron tomography of nucleocapsids assembled with VP35 NPBP mutants,
    to test whether the NP-sequestering peptide and the outer-layer structural
    role can be uncoupled.
