- term:
    id: GO:0140313
    label: molecular sequestering activity
  evidence_type: EXP
  original_reference_id: PMID:25865894
  qualifier: enables
  review:
    summary: >-
      The VP35 NPBP peptide binds NP with high affinity and specificity,
      prevents NP oligomerization, and releases RNA from pre-formed NP-RNA
      complexes; size-exclusion chromatography showed NPBP-bound NP behaves as a
      1:1 heterodimer instead of eluting at the void volume.
    action: ACCEPT
    reason: >-
      This is the molecular-function description of one of VP35's two core
      activities. Binding a partner so as to prevent it from oligomerising and
      from engaging its RNA substrate is precisely molecular sequestering
      activity, and the 3.7 A NPBP/NP structure (PDB 4YPI) shows the occluded
      surfaces. It is also the mechanistic basis of the chaperone role UniProt
      curates for VP35 toward NP monomers.
    supported_by:
    - reference_id: PMID:25865894
      supporting_text: >-
        We identify an intrinsically disordered peptide derived from EBOV VP35
        (NPBP, residues 20-48) that binds NP with high affinity and specificity,
        inhibits NP oligomerization, and releases RNA from NP-RNA complexes in
        vitro.
    - reference_id: PMID:25865894
      supporting_text: >-
        In contrast to previous results for the peptide-free NP proteins (Figure
        1B–C), which eluted at the V0, all NPBP-bound NP proteins eluted at a
        volume consistent with a well-behaved heterodimer (one molecule of NP
        and one NPBP molecule) (Figure 6C), indicating that NPBP interaction
        also prevents oligomerization.
