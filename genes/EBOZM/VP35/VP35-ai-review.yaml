- id: PMID:12191476
  title: The assembly of Ebola virus nucleocapsid requires virion-associated proteins
    35 and 24 and posttranslational modification of nucleoprotein.
  findings:
  - statement: >-
      Co-expression of NP, VP35 and VP24 alone is sufficient for spontaneous
      nucleocapsid assembly in transfected 293T cells, and the three proteins
      interact specifically.
    supporting_text: >-
      Expression of the nucleoprotein (NP) and virion-associated proteins VP35
      and VP24 led to spontaneous assembly of nucleocapsids in transfected 293T
      cells by transmission electron microscopy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the abstract names VP35 explicitly, so the CACAO
      GO:0019013 row is on the right gene. Cached record is abstract-only
      (full_text_available: false), so figure-level evidence was not inspected;
      the GONUTS page for this PMID was offline when checked (2026-10-29).
  full_text_unavailable: true
- id: PMID:12829834
  title: The Ebola virus VP35 protein inhibits activation of interferon regulatory
    factor 3.
  findings:
  - statement: >-
      VP35 blocks virus-induced IRF-3 phosphorylation, dimerization and nuclear
      translocation, and therefore IRF3-dependent host gene induction, but has
      no effect on the constitutively active IRF-3 5D mutant.
    supporting_text: >-
      VP35 blocks virus-induced IRF-3 phosphorylation and subsequent IRF-3
      dimerization and nuclear translocation.
  - statement: >-
      VP35 does not inhibit signalling downstream of the type I interferon
      receptor, which is the finding that rules out GO:0039502 for this protein.
    supporting_text: >-
      Neither the Zaire or Reston VP35 proteins were able to inhibit
      IFN-β-induced activation of the ISG54 or the ISG56 promoters (Fig. 1C and
      D).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. The key paper for the
      induction-versus-response distinction that the GO:0039502 CACAO row gets
      wrong.
- id: PMID:16698997
  title: Ebola virus VP35 protein binds double-stranded RNA and inhibits alpha/beta
    interferon production induced by RIG-I signaling.
  findings:
  - statement: >-
      VP35 binds duplex RNA specifically and not ssRNA or dsDNA, with R312A and
      K309A impaired; it blocks RIG-I-induced IRF-3 activation.
    supporting_text: >-
      VP35 interacted specifically with poly(rI) · poly(rC), poly(rA) ·
      poly(rU), or in vitro-transcribed dsRNAs derived from EBOV sequences, and
      not with single-stranded RNAs (ssRNAs) or double-stranded DNA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Correctly cited by the CACAO row, but
      it supports interferon *production* terms; the title itself says
      "interferon production induced by RIG-I signaling", not interferon
      signalling.
- id: PMID:19153231
  title: Ebola virus protein VP35 impairs the function of interferon regulatory factor-activating
    kinases IKKepsilon and TBK-1.
  findings:
  - statement: >-
      VP35 physically interacts with IKBKE and TBK1, is phosphorylated by them
      in vitro, displaces IRF-3, IRF-7 and IPS-1 from IKKepsilon, and suppresses
      the IRF-3-directed kinase activity of IKKepsilon-containing lysates.
    supporting_text: >-
      These data suggest that VP35 exerts its IFN-antagonist function, at least
      in part, by blocking necessary interactions between the kinases
      IKKepsilon and TBK-1 and their normal interaction partners, including
      their substrates, IRF-3 and IRF-7.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; source of the IntAct GO:0005515 rows for Q14164 and
      Q9UHD2 and of the curated basis for KW-1223/KW-1224.
- id: PMID:19557165
  title: Ebola Zaire virus blocks type I interferon production by exploiting the host
    SUMO modification machinery.
  findings:
  - statement: >-
      VP35 interacts with IRF7, PIAS1 and Ubc9 and increases PIAS1-mediated
      SUMOylation of IRF7, repressing interferon transcription; it is not itself
      a SUMO ligase.
    supporting_text: >-
      VP35, while not itself a SUMO ligase, increased PIAS1-mediated SUMOylation
      of IRF7, and repressed Ifn transcription.
  - statement: >-
      In Ebola virus it is VP24, not VP35, that blocks the cellular response to
      secreted interferon.
    supporting_text: >-
      VP24 inhibits the cellular response to exogenous IFN by interacting with
      karyopherin α1, preventing the nuclear accumulation of
      tyrosine-phosphorylated Stat1 and Stat2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached; Figure 7 contains the SUMOylation
      titrations that the CACAO GO:0033235 row rests on.
- id: PMID:19828757
  title: The VP35 protein of Ebola virus impairs dendritic cell maturation induced
    by virus and lipopolysaccharide.
  findings:
  - statement: >-
      VP35 expressed in mouse dendritic cells prevents virus- and LPS-induced
      up-regulation of MHC class II, CD40, CD80 and CD86 and of IL-6, IL-12,
      TNF-alpha and IFN-alpha/beta; the N-terminus is required and the
      RNA-binding motif is not.
    supporting_text: >-
      When expressed in mouse immature DCs, Ebola virus VP35 prevents
      virus-stimulated expression of CD40, CD80, CD86 and major
      histocompatibility complex class II.
  - statement: >-
      VP35-expressing dendritic cells fail to activate allogeneic naive CD4+ T
      cells, which is the adaptive-immune endpoint of the paper.
    supporting_text: >-
      We conclude from these experiments that the VP35 protein attenuates the
      capacity of DCs to stimulate CD4 + T-cell activation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Correctly cited, but note the system is
      surrogate expression (HSV vector and retroviral transduction) in mouse
      bone-marrow DCs rather than EBOV infection, and MHC class II is a FACS
      maturation marker here, not a presentation assay - which is why the
      GO:0039505 row is marked over-annotated.
- id: PMID:21228243
  title: Ebolavirus proteins suppress the effects of small interfering RNA by direct
    interaction with the mammalian RNA interference pathway.
  findings:
  - statement: >-
      A screen of all EBOV proteins identified VP35, VP30 and VP40 as
      suppressors of RNA silencing; VP35 binds the Dicer partners TRBP and PACT
      independently of siRNA.
    supporting_text: >-
      VP35 directly interacts with Dicer partners TRBP and PACT in an
      siRNA-independent fashion and in the absence of effects on interferon
      (IFN).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cached record is abstract-only, but the abstract states
      the VP35 result and the mechanism explicitly, so the GO:0140533 IMP row is
      verifiable at the claim level.
  full_text_unavailable: true
- id: PMID:21987769
  title: DRBP76 associates with Ebola virus VP35 and suppresses viral polymerase function.
  findings:
  - statement: >-
      DRBP76/ILF3 associates with the VP35 IID and impairs the EBOV
      transcription/replication complex, acting as an antiviral host factor
      rather than a VP35 effector.
    supporting_text: >-
      These data suggest that DRBP76, via its association with VP35, exerts an
      anti-EBOV function.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only cache. Relevant to the VP35 interactome but
      the interaction's functional direction is host-to-virus, so it supports no
      VP35 molecular function.
  full_text_unavailable: true
- id: PMID:22238300
  title: Characterization of the RNA silencing suppression activity of the Ebola virus
    VP35 protein in plants and mammalian cells.
  findings:
  - statement: >-
      Wild-type VP35 blocks establishment of microRNA-directed silencing of a
      reporter in mammalian cells and has potent silencing-suppressor activity
      in plants.
    supporting_text: >-
      A reporter gene containing specific microRNA target sequences was used to
      demonstrate that prior expression of wild-type VP35 was able to block
      establishment of microRNA silencing in mammalian cells.
  - statement: >-
      Part of the mammalian reporter signal is non-specific translational
      enhancement rather than silencing suppression, and most of the specific
      activity is RNA-binding independent.
    supporting_text: >-
      The results suggest that enhanced reporter activity in the presence of
      VP35 is a composite of nonspecific translational enhancement and silencing
      suppression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cached record is abstract-only and the GONUTS page for
      this PMID could not be read (site offline, 2026-10-29), but the abstract
      states the microRNA-silencing result the CACAO GO:0060965 row cites.
  full_text_unavailable: true
- id: PMID:23493393
  title: 'Phosphorylation of Ebola virus VP30 influences the composition of the viral
    nucleocapsid complex: impact on viral transcription and replication.'
  findings:
  - statement: >-
      VP35 is one of the four proteins essential for transcription of the EBOV
      genome and tethers the catalytic polymerase L to the nucleocapsid; VP30
      binds the polymerase complex via VP35 in a phosphorylation-dependent way.
    supporting_text: >-
      For transcription of the viral genome four viral proteins are essential:
      the nucleoprotein NP, the polymerase L, the polymerase cofactor VP35, and
      VP30.
  - statement: >-
      VP35 is diffusely distributed through the cytoplasm of expressing cells.
    supporting_text: >-
      both VP30 and VP35 are diffusely distributed in the cytoplasm preventing
      colocalization analyses
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. The paper's focus is VP30, but VP35 is
      assayed throughout as the cofactor and its cytoplasmic distribution is
      reported directly, which is the basis of the EXP GO:0030430 row.
- id: PMID:23870315
  title: Mutual antagonism between the Ebola virus VP35 protein and the RIG-I activator
    PACT determines infection outcome.
  findings:
  - statement: >-
      VP35 disrupts the PACT-RIG-I interaction and inhibits PACT-induced RIG-I
      ATPase activity; reciprocally, PACT binding costs VP35 its association
      with the viral polymerase.
    supporting_text: >-
      Here, we show that EBOV VP35 inhibits PACT-induced RIG-I ATPase activity
      in a dose-dependent manner. The interaction of PACT with RIG-I is
      disrupted by wild-type VP35, but not by VP35 mutants that are unable to
      bind PACT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached; source of the IntAct GO:0005515 row for
      O75569 (PRKRA).
- id: PMID:25865894
  title: An Intrinsically Disordered Peptide from Ebola Virus VP35 Controls Viral
    RNA Synthesis by Modulating Nucleoprotein-RNA Interactions.
  findings:
  - statement: >-
      VP35 residues 20-48 form an intrinsically disordered NP-binding peptide
      that binds NP with high affinity, prevents NP oligomerization and releases
      RNA from NP-RNA complexes, occluding the NP surfaces needed for viral RNA
      synthesis.
    supporting_text: >-
      We identify an intrinsically disordered peptide derived from EBOV VP35
      (NPBP, residues 20-48) that binds NP with high affinity and specificity,
      inhibits NP oligomerization, and releases RNA from NP-RNA complexes in
      vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached; the DisProt annotations (GO:0140313,
      GO:0019079, GO:0019083) all trace to this paper and the PDB 4YPI
      structure.
- id: PMID:28679761
  title: The Host E3-Ubiquitin Ligase TRIM6 Ubiquitinates the Ebola Virus VP35 Protein
    and Promotes Virus Replication.
  findings:
  - statement: >-
      VP35 shows a diffuse, slightly granular cytoplasmic localization and is
      recruited into TRIM6 cytoplasmic bodies on co-expression.
    supporting_text: >-
      In contrast, VP35 showed a diffuse, slightly granular cytoplasmic
      localization, and in some cases it localized in apparent inclusion bodies
  - statement: >-
      VP35 is ubiquitinated at K309 by TRIM6, inhibits TRIM6-mediated type I
      interferon induction, and co-opts TRIM6 to support polymerase activity.
    supporting_text: >-
      we also found that TRIM6 enhances EBOV polymerase activity in a minigenome
      assay and TRIM6 knockout cells have reduced replication of infectious
      EBOV, suggesting that VP35 hijacks TRIM6 to promote EBOV replication
      through ubiquitination
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached; basis of the second EXP GO:0030430 row.
