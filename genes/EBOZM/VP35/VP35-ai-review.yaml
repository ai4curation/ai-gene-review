- term:
    id: GO:0033235
    label: positive regulation of protein sumoylation
  evidence_type: IMP
  original_reference_id: PMID:19557165
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the term matches the assay closely. Chang et al. found
      VP35 in a yeast two-hybrid screen with Ubc9 and PIAS1, showed VP35 binds
      PIAS1 and IRF7, and then showed in SUMOylation assays (Fig. 7) that VP35
      raises PIAS1-mediated SUMO3 conjugation of IRF7 above PIAS1 alone, and
      raises it dose-dependently even without PIAS1; wild-type but not
      conjugation-defective SUMO3 gave the shifted bands.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well supported and at a useful level of granularity: VP35 is explicitly
      not itself a SUMO ligase, so a positive-regulation term rather than a
      ligase activity is the right call, and that distinction is one the
      annotation gets right. It is kept as non-core because it is one narrower
      arm of VP35's interferon antagonism, rests on a single paper using
      overexpression in 293T cells, and is downstream of the dsRNA-sequestration
      and IRF3-kinase mechanisms that account for most of the IFN-antagonist
      phenotype. The IRF7-directed consequence is separately annotated as
      GO:0039557.
    supported_by:
    - reference_id: PMID:19557165
      supporting_text: >-
        VP35, while not itself a SUMO ligase, increased PIAS1-mediated
        SUMOylation of IRF7, and repressed Ifn transcription.
    - reference_id: PMID:19557165
      supporting_text: >-
        Importantly, in the presence of both PIAS1 and VP35, the levels of SUMO
        conjugated IRF7 were significantly greater than those expressing PIAS1
        alone.
- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IMP
  original_reference_id: PMID:16698997
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the one clear error in the set. Cardenas et al. showed
      that VP35 binds dsRNA (poly(rI).poly(rC) beads; R312A and K309A mutants
      impaired) and that VP35 blocks IRF-3 activation induced by RIG-I
      overexpression, i.e. it suppresses the pathway that *induces* type I
      interferon. GO:0039502 is about the type I interferon-mediated signalling
      pathway itself -- the receptor-proximal JAK/STAT response to secreted
      IFN -- which is a different arm.
    action: MODIFY
    reason: >-
      The companion paper from the same laboratory tested the arm this term
      names and found VP35 inactive on it: neither Zaire nor Reston VP35 could
      inhibit IFN-beta-induced ISG54 or ISG56 promoter activation
      (PMID:12829834, Fig. 1C and D). In Ebola virus it is VP24, not VP35, that
      blocks the cellular response to exogenous IFN, via karyopherin alpha1 and
      STAT1/STAT2 nuclear accumulation (PMID:19557165). So the annotation is on
      the wrong side of the interferon circuit. This is a MODIFY, not a REMOVE:
      the underlying claim -- VP35 suppresses the host type I interferon
      system -- is right, and the mutant-based experiments the student cited
      support the induction-side terms instead. GO:0039540 covers the RIG-I
      step the paper assays directly; GO:0039548 covers the IRF3 endpoint, which
      is the readout used throughout.
    proposed_replacement_terms:
    - id: GO:0039540
      label: symbiont-mediated suppression of host cytoplasmic pattern recognition receptor
        signaling pathway via inhibition of RIG-I activity
    - id: GO:0039548
      label: symbiont-mediated suppression of host cytoplasmic pattern recognition receptor
        signaling pathway via inhibition of IRF3 activity
    additional_reference_ids:
    - PMID:12829834
    supported_by:
    - reference_id: PMID:16698997
      supporting_text: >-
        These experiments indicate that VP35 blocks activation of IRF-3 induced
        by overexpression of RIG-I, a cellular helicase recently implicated in
        the activation of IRF-3 by either virus or dsRNA.
    - reference_id: PMID:12829834
      supporting_text: >-
        Neither the Zaire or Reston VP35 proteins were able to inhibit
        IFN-β-induced activation of the ISG54 or the ISG56 promoters (Fig. 1C
        and D).
    - reference_id: PMID:19557165
      supporting_text: >-
        VP24 inhibits the cellular response to exogenous IFN by interacting with
        karyopherin α1, preventing the nuclear accumulation of
        tyrosine-phosphorylated Stat1 and Stat2
- term:
    id: GO:0039505
    label: symbiont-mediated suppression of host antigen processing and presentation
      of peptide antigen via MHC class II
  evidence_type: IMP
  original_reference_id: PMID:19828757
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Jin et al. expressed VP35 in mouse bone-marrow-derived
      dendritic cells (HSV vector and retroviral transduction) and found that,
      unlike the empty vector, VP35 prevented virus- and LPS-induced
      up-regulation of MHC class II, CD40, CD80 and CD86 by FACS (Figs 2, 4,
      6), suppressed IL-6, IL-12, TNF-alpha and IFN-alpha/beta, and reduced the
      DCs' capacity to activate CD4+ T cells (Fig. 5).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MHC class II here is one of four surface markers read out by flow
      cytometry as an index of dendritic-cell maturation; nothing in the paper
      assays antigen processing, peptide loading, invariant-chain handling,
      MHC-II trafficking or presentation of a defined antigen. The CD4+ T-cell
      readout uses allogeneic naive T cells, which measures the DCs' overall
      stimulatory capacity rather than processing and presentation of a peptide
      antigen. The effect is also partly indirect, since exogenous type I IFN
      partially reverses it, placing the MHC-II change downstream of the
      interferon blockade that is VP35's documented activity. The claim is not
      invented -- surface MHC class II really is reduced -- so this is marked as
      over-annotated rather than removed, and the demonstrated endpoint, loss of
      adaptive priming, is captured by the GO:0039504 replacement proposed on
      the GO:0052562 row from this same paper. A classic phenotype-read-as-process
      annotation: the term names a mechanism the assay cannot see.
