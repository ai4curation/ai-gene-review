id: P26494
gene_symbol: phaC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:301
  label: Ectopseudomonas oleovorans
description: phaC1 encodes one of the two class II poly(3-hydroxyalkanoate) synthases of strain GPo1,
  currently classified as Ectopseudomonas oleovorans. It polymerizes hydroxyacyl-CoA precursors into intracellular
  medium-chain-length storage polyester. The two synthases can realize the same polymerization role; the
  original locus study did not resolve a clear substrate-specificity difference between them.
