  review:
    summary: Generalize the C4-specific PHB claim to the experimentally supported PHA biosynthetic process.
    action: MODIFY
    reason: GO:0042619 specifies a beta-hydroxybutyrate polymer. The target belongs to the class II PhaC
      group and the source-qualified GPo1 evidence concerns medium-chain-length PHA. The InterPro mapping
      and uncited UniProt PHB pathway line do not establish C4-only biosynthesis in this protein. GO:0042621
      retains the supported biosynthetic role. This generalization is not a claim that C4 acceptance is
      impossible.
    proposed_replacement_terms:
