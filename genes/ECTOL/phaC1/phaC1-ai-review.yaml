    summary: Acyltransferase chemistry is correct and can be refined to non-amino-acyl transfer.
    action: MODIFY
    reason: The publication-linked PHA synthesis function and class II PhaC classification support transfer
      of hydroxyacyl groups during polyester-chain extension. GO:0016747 is a supported descendant of
      GO:0016746; no more substrate-specific existing MF was found in the current searches.
