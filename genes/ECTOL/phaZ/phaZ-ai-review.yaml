id: P26495
gene_symbol: phaZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:301
  label: Ectopseudomonas oleovorans
description: PhaZ contributes to intracellular medium-chain-length poly(3-hydroxyalkanoate) mobilization
  in strain GPo1, currently classified as Ectopseudomonas oleovorans. It is an alpha/beta-hydrolase associated
  genetically with degradation of stored polyester. A leaky phaZ mutant retains polymer longer, and a
  phaC1/phaZ-containing fragment restores turnover-associated phenotypes. Polymer mobilization supports
  carbon and energy availability during nutrient limitation.
