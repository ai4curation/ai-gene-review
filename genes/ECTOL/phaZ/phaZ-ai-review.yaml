core_functions:
- description: Hydrolyzes ester bonds in intracellular medium-chain-length PHA during storage-polyester
    mobilization. The native genetic role is supported; exact product-size distribution and secondary
    lipid substrates remain unresolved.
  directly_involved_in:
  - id: GO:0042620
    label: poly(3-hydroxyalkanoate) metabolic process
  supported_by: *id001
  proposed_molecular_function: medium-chain-length poly(3-hydroxyalkanoate) depolymerase activity
proposed_new_terms:
- proposed_name: medium-chain-length poly(3-hydroxyalkanoate) depolymerase activity
  proposed_definition: Catalysis of the hydrolysis of ester bonds in medium-chain-length poly(3-hydroxyalkanoate),
    yielding shorter polyester chains and hydroxyalkanoate products.
  justification: GO:0050527 specifies poly(3-hydroxyoctanoate) with products of size1–5, whereas GPo1
    evidence establishes turnover of native mixed medium-chain-length polyester without a product-resolved
    purified assay. The proposed activity represents that specific substrate class without asserting a
    measured oligomer distribution; its GO0016788 genus remains valid.
  proposed_parent:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  supported_by: *id001
suggested_questions:
- question: Which oligomer and monomer products does purified GPo1 PhaZ release from defined native PHA
    substrates, and does it also hydrolyze monoacylglycerols?
- question: Where is native GPo1 PhaZ localized relative to PHA granules and bilayer membranes?
