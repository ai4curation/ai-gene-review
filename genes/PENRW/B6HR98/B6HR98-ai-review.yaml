    id: GO:0046421
    label: methylisocitrate lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:4.1.3.30
  review:
    summary: >-
      Electronic EC-to-GO mapping of an EC 4.1.3.30 catalytic-activity statement
      whose only evidence in the entry is an ARBA association rule. The
      specificity residue excludes this activity.
    action: REMOVE
    reason: >-
      2-methylisocitrate lyases of the PEP mutase/isocitrate lyase superfamily
      carry a proline at the position equivalent to Ser-308 of the C. parasitica
      oxaloacetase, where the proline packs against the substrate methyl group;
      B6HR98 has the serine, as do all characterised oxaloacetases (E. coli
      PrpB and A. niger dimethylmalate lyase have the proline in the same
      alignment). Identity to PrpB is 33.3%, background for the superfamily.
      The protein's established activity is oxaloacetate hydrolysis
      (PMID:21549851), and nothing in the entry supports a second, unrelated
      catalytic assignment: the UniProt CATALYTIC ACTIVITY line for EC 4.1.3.30
      is evidenced only by ARBA, an unvetted prediction.
    supported_by:
