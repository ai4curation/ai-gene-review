      resource: UNIPROT
      requested_change: REPOINT
      asserted_value: EC:4.1.3.1
      corrected_value: EC:3.7.1.1
      corrected_label: oxaloacetate acetylhydrolase (oxaloacetase)
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        UniProtKB:B6HR98 is named "Isocitrate lyase (EC 4.1.3.1)" with evidence
        ECO:0000256|PROSITE-ProRule:PRU10119, and the EC propagates into GOA as
        GO:0004451 and GO:0046421. The protein is Pc22g24830, shown
        experimentally to be the Penicillium chrysogenum oxaloacetate hydrolase:
        it was the only one of the candidate paralogs whose expression gave
        oxalic acid in S. cerevisiae, and its deletion abolished oxalate
        production (PMID:21549851). It carries Pfam PF13714 but not the
        isocitrate lyase domain PF00463, is 326 aa where isocitrate lyases are
        428-590 aa, and is 81.6% identical to Aspergillus niger OahA. The
        PS00161 signature behind PRU10119 is the catalytic-cysteine motif of the
        whole PEP mutase/isocitrate lyase superfamily and is matched equally by
        2,3-dimethylmalate lyase and 2-methylisocitrate lyase, so it cannot
        support an EC 4.1.3.1 assignment. The protein name and EC should be
        oxaloacetate acetylhydrolase / EC 3.7.1.1.
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: prosite_prorule
      requested_change: CHECK
      asserted_value: EC:4.1.3.1
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        PROSITE rule PRU10119 / pattern PS00161 (ISOCITRATE_LYASE,
        K-[KR]-C-G-H-[LMQR]) assigns the name "Isocitrate lyase" and EC 4.1.3.1
        to any match. The pattern covers the catalytic cysteine of the entire
        PEP mutase/isocitrate lyase superfamily: in this analysis it matched
        Aspergillus niger 2,3-dimethylmalate lyase (PDB 3FA3), Escherichia coli
        2-methylisocitrate lyase (P77541) and the Dianthus petal death protein
        (Q05957) as well as three characterised oxaloacetases, and PROSITE
        itself marks the site as active_site(?). Applying the rule to sequences
        that lack the isocitrate lyase domain PF00463 produces wrong names and
        EC numbers across the fungal oxaloacetase family (this entry,
        UniProtKB:A0A5M3MM75, UniProtKB:F8PSW8 and others). The rule should
        require the ICL domain, or assign only a superfamily-level description.
