  review:
    summary: >-
      ARBA rule assigning carbon-carbon lyase activity on superfamily
      membership. The C-C bond cleavage is real, but this enzyme cleaves it by
      hydrolysis, so the correct class is GO:0030603 oxaloacetase activity.
    action: MODIFY
    reason: >-
      GO:0016833 is defined as cleavage of a C-C bond "by other means than by
      hydrolysis or oxidation". Oxaloacetase hydrolyses oxaloacetate to oxalate
      and acetate (EC 3.7.1.1) and GO:0030603 sits under hydrolase activity
      acting on carbon-carbon bonds in ketonic substances, a different branch.
      This is a lateral correction, not a refinement: the essence of the row
      (C-C bond cleavage by this protein) is sound, and the replacement names
      the reaction that was established experimentally for Pc22g24830. Chen et
      al. note the formal ambiguity, that OAH would be a lyase if the
      oxaloacetate gem-diol bound pre-formed, but the GO class for EC 3.7.1.1 is
      the hydrolase one.
    proposed_replacement_terms:
