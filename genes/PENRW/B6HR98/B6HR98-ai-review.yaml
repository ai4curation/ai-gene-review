taxon:
  id: NCBITaxon:500485
  label: Penicillium rubens Wisconsin 54-1255
description: >-
  Cytosolic oxaloacetate acetylhydrolase (oxaloacetase, EC 3.7.1.1) of
  Penicillium rubens (Penicillium chrysogenum), encoded by locus Pc22g24830. It
  belongs to the phosphoenolpyruvate mutase/isocitrate lyase superfamily
  (Pfam PF13714), which assembles as a dimer of dimers of (alpha/beta)8 barrels
  with a mobile gating loop over each active site and requires a divalent metal
  cofactor. The enzyme hydrolyses the C(2)-C(3) bond of oxaloacetate to give
  oxalate and acetate, and it is the committed and sole route to secreted oxalic
  acid in this fungus: expressing it in a yeast that makes no oxalate confers
  oxalate production, and deleting it abolishes oxalate formation. The genome
  carries four oahA-like paralogs, and this is the one that oxalate formation
  depends on. Oxalate
  secretion acidifies the medium and complicates beta-lactam fermentation, and
  the gene is used as the oxalate-producing part in engineered yeasts.
