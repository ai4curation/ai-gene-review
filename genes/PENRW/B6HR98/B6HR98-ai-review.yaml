suggested_questions:
- question: >-
    What do the other Penicillium oahA paralogs do? Pc18g05100, the second
    transcriptionally correlated candidate, is 57.7% identical to Pc22g24830,
    gave no oxalate in yeast, and has proline rather than the marker serine at
    the Ser-308-equivalent position, as 2,3-dimethylmalate lyase does, so it is
    consistent with the marker; its own substrate is unknown. The remaining two
    paralogs have not been analysed here.
- question: >-
    Should UniProt's protein name and EC for this entry be corrected to
    oxaloacetate acetylhydrolase / EC 3.7.1.1, and should PROSITE rule PRU10119
    require the PF00463 isocitrate lyase domain before assigning EC 4.1.3.1?
suggested_experiments:
- description: >-
    Purify recombinant B6HR98 and measure kcat/Km for oxaloacetate against
    (2R,3S)-dimethylmalate and D-threo-isocitrate, with Mg2+ and Mn2+, to
    confirm the substrate preference directly rather than through the sequence
    marker and the in vivo phenotype.
- description: >-
    Make the S-to-P substitution at the Ser-308-equivalent position of B6HR98
    and test whether it reproduces the activity swap reported for the B. cinerea
    S260P mutant, which would establish the marker residue in this ortholog.
