      supporting_text: OAH contains a serine residue, Ser-308, and DMML contains a
        proline residue instead, Pro-240
    - reference_id: file:CONPW/A0A5M3MM75/A0A5M3MM75-bioinformatics/RESULTS.md
      supporting_text: Ser at the 308 position (DMML 3FA3 and E. coli PrpB have Pro;
        A. nidulans ICL has Asp)
