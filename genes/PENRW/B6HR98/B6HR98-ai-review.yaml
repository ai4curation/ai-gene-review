- term:
    id: GO:0004451
    label: isocitrate lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:4.1.3.1
  review:
    summary: >-
      Electronic EC-to-GO mapping of the EC 4.1.3.1 that PROSITE-ProRule
      PRU10119 placed on this entry. The protein is an oxaloacetase, not an
      isocitrate lyase, and the ProRule signature does not discriminate between
      the two.
    action: REMOVE
    reason: >-
      Three independent lines contradict the isocitrate lyase claim. (i) The
      genetics: of the two Penicillium candidates tested, only Pc22g24830
      conferred oxalic acid production on Saccharomyces cerevisiae, and its
      deletion eliminated oxalate formation in P. chrysogenum (PMID:21549851).
      (ii) The domain architecture: isocitrate lyases carry Pfam PF00463 and are
      428-590 residues, whereas this protein is 326 residues with PF13714 only,
      and P. rubens has its own PF00463 isocitrate lyases (B6HRS2, B6HVG1), so
      the glyoxylate-cycle enzyme is a different gene. (iii) The sequence: 81.6%
      identity to A. niger OahA and 68-70% to the two OAHs with enzymology,
      against about 30% to genuine isocitrate lyases, plus the OAH specificity
      serine aligned to Ser-308 of the C. parasitica OAH structure. The
      underlying PS00161 pattern K-[KR]-C-G-H-[LMQR] is the superfamily
      catalytic-cysteine motif and matched dimethylmalate lyase,
      2-methylisocitrate lyase and the petal death protein in the same analysis.
      This is a demonstrably wrong electronic mapping rather than a judgement
      against a curator.
