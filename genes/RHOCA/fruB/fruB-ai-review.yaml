id: P23388
gene_symbol: fruB(HI)
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1061
  label: Rhodobacter capsulatus
description: FruB(HI) is the soluble multiphosphoryl-transfer protein of the Rhodobacter capsulatus fructose
  PTS. Its N-to-C domain order is EIIA–HPr–EI, while phosphate flows from phosphoenolpyruvate through
  EI, HPr and EIIA before transfer to the membrane FruA component. The fused architecture supplies both
  PEP entry and the downstream protein phosphorelay. The three histidine phosphoacceptor sites were predicted
  by sequence comparison, rather than individually established by site-specific phosphorylation assays
  in the 1990 sequence study.
