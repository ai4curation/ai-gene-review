proposed_new_terms:
- proposed_name: PTS EIIA-to-EIIB phosphotransferase activity
  proposed_definition: Catalysis of phosphate transfer from the phosphorylated histidine of a phosphoenolpyruvate-dependent
    sugar phosphotransferase system EIIA domain to the cognate EIIB phosphoacceptor.
  justification: GO:0008965 captures PEP entry through enzyme I, not the downstream EIIA-to-EIIB protein
    relay. GO:0008982, GO:0022877 and GO:0090563 describe terminal transport-coupled transfer to a sugar
    rather than this protein-to-protein step. GO:0016772 is the proposed parent pending ontology-editor
    placement. The sequence-matched locus architecture and curated UniProt domain statement support the
    relay; target-specific purified pairwise kinetics and residue assays are not claimed. The broad transferase
    rows are MODIFY to the PEP-entry activity and this proposed relay activity.
  proposed_parent:
    id: GO:0016772
    label: transferase activity, transferring phosphorus-containing groups
  supported_by:
  - reference_id: PMID:2193161
    supporting_text: 'MTP consists of three moieties: a fructose-specific enzyme III

      (IIIfru)-like N-terminal moiety (residues 1 to 143) followed by an FPr(HPr)-like

      moiety (residues 157 to 245) and an enzyme I-like moiety (residues 273 to 827).'
  - reference_id: file:RHOCA/fruB/fruB-uniprot.txt
    record_section:
    - CC:DOMAIN
    supporting_text: 'The PTS EIIA type-2 domain is phosphorylated by phospho-HPr on

      CC       a histidyl residue. Then, it transfers the phosphoryl group to the PTS

      CC       EIIB type-2 domain.'
