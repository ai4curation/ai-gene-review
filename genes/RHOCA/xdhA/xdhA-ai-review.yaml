suggested_questions:
- question: How do the R. capsulatus xdh genes regulate hypoxanthine- and xanthine-responsive expression at the non-sigma54 xdhA promoter?
  experts:
  - bacterial molybdenum-enzyme experts
suggested_experiments:
- description: >-
    Mutate the two XdhA [2Fe-2S]-binding motifs and the PCMH FAD-binding domain
    separately, then assay purified XdhAB variants for xanthine-dependent NAD+
    reduction to separate assembly defects from electron-transfer defects.
  experiment_type: site-directed mutagenesis
