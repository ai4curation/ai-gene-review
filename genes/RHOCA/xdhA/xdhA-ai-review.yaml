id: O54050
gene_symbol: xdhA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1061
  label: Rhodobacter capsulatus
description: >-
  XdhA is the FAD- and [2Fe-2S]-binding electron-transfer subunit of the
  heterotetrameric Rhodobacter capsulatus XdhAB xanthine dehydrogenase. With the
  molybdopterin catalytic subunit XdhB, it supports NAD+-dependent oxidation of
  hypoxanthine to xanthine and xanthine to urate during xanthine utilization as a
  nitrogen source.
