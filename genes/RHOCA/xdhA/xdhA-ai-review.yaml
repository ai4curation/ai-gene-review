    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002888
  review:
    summary: XdhA's metal content is the iron of its two [2Fe-2S] clusters.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The row comes from the IPR002888 2Fe-2S-binding domain mapping. GO places
      2 iron, 2 sulfur cluster binding under metal cluster binding, not under
      metal ion binding, so the generic metal-ion claim is not entailed by the
      specific cofactor row and overstates free metal-ion binding. GO:0051537
      records the informative cofactor class.
    supported_by:
