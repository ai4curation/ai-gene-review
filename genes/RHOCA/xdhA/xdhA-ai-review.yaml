  review:
    summary: >-
      XdhA contributes the FAD/[2Fe-2S] electron-transfer half of the
      heterotetrameric XdhAB xanthine dehydrogenase.
    action: MODIFY
    reason: >-
      Replace the GOA enables relation with contributes_to. XdhA is an
      essential cofactor-bearing subunit of the active XdhAB enzyme, but the
      molybdopterin active site that hydroxylates xanthine is on XdhB.
    proposed_replacement_terms:
