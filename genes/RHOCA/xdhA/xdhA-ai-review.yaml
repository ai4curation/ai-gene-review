    label: xanthine dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR014307
  review:
    summary: >-
      XdhA contributes the FAD/[2Fe-2S] electron-transfer half of the
      heterotetrameric XdhAB xanthine dehydrogenase.
    action: MODIFY
    reason: >-
      The term is right for the XdhAB complex, but the relation is not: replace
      the GOA enables relation with contributes_to (same term). XdhA is an
      essential cofactor-bearing subunit of the active XdhAB enzyme, but the
      molybdopterin active site that hydroxylates xanthine is on XdhB. The
      qualifier error is recorded as a source defect.
    proposed_replacement_terms:
    - id: GO:0004854
      label: xanthine dehydrogenase activity
    supported_by:
    - reference_id: PMID:9515710
      supporting_text: region revealed two open reading frames, designated xdhA and xdhB, encoding
    - reference_id: PMID:19109249
      supporting_text: XdhA subunit harbors two [2Fe2S] clusters as well as a FAD cofactor
    - reference_id: file:RHOCA/xdhA/xdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR014307; Xanthine_DH_ssu.'
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: INTERPRO
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The InterPro2GO mapping of IPR014307 (xanthine dehydrogenase, small
        subunit) to GO:0004854 is emitted with enables. The signature defines
        the FAD/[2Fe-2S] subunit of a two-subunit enzyme whose molybdenum
        active site is on XdhB (PMID:19109249), so annotations from this
        subunit signature should use contributes_to.
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR016208
  review:
    summary: XdhA binds iron only as part of two [2Fe-2S] clusters.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The row comes from the IPR016208 superfamily mapping, which spans both
      XDH subunits and the fused eukaryotic enzymes. XdhA's iron is bound only
      within its two [2Fe-2S] clusters; iron-sulfur cluster binding is not a
      descendant of iron ion binding in GO, and GO:0051537 is the accurate
      cofactor term. Free iron ion binding is therefore an over-annotation.
    supported_by:
    - reference_id: file:RHOCA/xdhA/xdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR016208; Ald_Oxase/xanthine_DH-like.'
    - reference_id: PMID:19109249
      supporting_text: XdhA subunit harbors two [2Fe2S] clusters as well as a FAD cofactor
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002346
  - InterPro:IPR002888
  - InterPro:IPR016208
  review:
    summary: XdhA is a redox-active subunit whose FAD site reduces NAD+ with electrons received from the molybdenum center.
    action: KEEP_AS_NON_CORE
    reason: >-
      Within XdhAB the XdhA flavin is the site at which electrons are passed to
      NAD+, so a generic oxidoreductase claim is true of the subunit itself and
      no more specific subunit-level catalytic term exists. It is peripheral to
      the core description, which uses electron transfer activity plus
      contributes_to the two complete purine-base oxidations.
    supported_by:
    - reference_id: file:RHOCA/xdhA/xdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002346; Mopterin_DH_FAD-bd.'
