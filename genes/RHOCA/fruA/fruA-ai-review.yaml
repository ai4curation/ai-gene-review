  review:
    summary: Refine the broad transport activity to the fructose-specific net PTS reaction.
    action: MODIFY
    reason: The target is the fructose PTS permease, not a transporter of unspecified sugars. GO0022877
      is a current is_a descendant of this broad term. It describes the net upstream phosphohistidyl-carrier-to-fructose
      reaction; the immediate terminal donor within FruA is EIIB phosphocysteine. Retaining the net reaction
      does not assign a histidine catalytic intermediate to FruA.
    supported_by:
    - reference_id: PMID:2254279
      supporting_text: 'This gene codes for the fructose

        permease (molecular weight, 58,575; 578 aminoacyl residues), the fructose enzyme

        II (IIFru) of the phosphoenolpyruvate-dependent phosphotransferase system.'
