  review:
    summary: PTS group translocation is not carbohydrate/proton symport.
    action: REMOVE
    reason: The fructose PTS obtains its phosphoryl energy from PEP through FruB and the FruA EIIB component,
      producing intracellular fructose 1-phosphate. The fructose EIIC domain does not establish proton
      cotransport. This electronic InterPro symporter mapping conflates a PTS permease with a secondary
      proton symporter; the correction concerns that asserted coupling mechanism, not absence of all conceivable
      ion effects.
    supported_by:
