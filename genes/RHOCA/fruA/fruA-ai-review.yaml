- term:
    id: GO:0022877
    label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003353
  review:
    summary: The net fructose PTS reaction is supported.
    action: ACCEPT
    reason: GO0022877 states a net phosphohistidyl-protein-to-fructose transfer coupled to entry; the
      relay can include an intervening EIIB cysteine. It is not a claim that FruA itself uses histidine
      as its terminal donor. The sequenced Rhodobacter fructose permease and its conserved cysteine support
      this assignment, with the chemistry inferred rather than demonstrated by purified cysteine-mutant
      measurements.
    supported_by:
    - reference_id: PMID:2254279
      supporting_text: 'This gene codes for the fructose

        permease (molecular weight, 58,575; 578 aminoacyl residues), the fructose enzyme

        II (IIFru) of the phosphoenolpyruvate-dependent phosphotransferase system.'
    - reference_id: PMID:2254279
      supporting_text: 'The protein contains only two cysteyl residues, and only one of these residues

        is conserved between the two proteins. This residue is therefore presumed to

        provide the active-site thiol group which may serve as the phosphorylation site.'
