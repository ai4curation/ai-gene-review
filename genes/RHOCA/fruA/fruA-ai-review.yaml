id: P23387
gene_symbol: fruA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1061
  label: Rhodobacter capsulatus
description: FruA is the membrane EIIB'BC fructose phosphotransferase-system permease of Rhodobacter capsulatus.
  It couples fructose entry to formation of fructose 1-phosphate using phosphate supplied by the soluble
  fused FruB relay. The EIIB cysteine-dependent mechanism is inferred from conserved PTS domains and the
  characterized E. coli homolog; the duplicated N-terminal B-like region is not evidence for a second
  catalytic phosphoacceptor. The protein sequence was characterized from strain DSM938/37b4.
