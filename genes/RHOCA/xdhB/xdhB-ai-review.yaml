suggested_questions:
- question: Does R. capsulatus use the same XdhB molybdopterin active-site residues for hypoxanthine and xanthine oxidation in vivo?
  experts:
  - bacterial molybdenum-enzyme experts
suggested_experiments:
- description: >-
    Introduce nonconservative substitutions at XdhB active-site residues that
    contact hypoxanthine and xanthine, then compare mutant growth on xanthine
    and purified-enzyme NAD+ reduction with each purine substrate.
  experiment_type: site-directed mutagenesis
