  qualifier: enables
  supporting_entities:
  - InterPro:IPR016208
  review:
    summary: XdhB contains the molybdopterin catalytic center, not the XdhA iron-sulfur centers.
    action: REMOVE
    reason: >-
      The InterPro mapping crosses the multi-subunit enzyme boundary. Direct
      R. capsulatus sequence and structure papers place the FAD and two
      [2Fe-2S] clusters on XdhA, while XdhB contains the molybdopterin active
      site.
    supported_by:
    - reference_id: PMID:9515710
      supporting_text: sites for two [2Fe-2S] clusters and FAD
    - reference_id: PMID:19109249
      supporting_text: XdhB subunit contains the molybdenum cofactor
