- id: PMID:9515710
  title: Xanthine dehydrogenase from the phototrophic purple bacterium Rhodobacter
    capsulatus is more similar to its eukaryotic counterparts than to prokaryotic
    molybdenum enzymes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified original R. capsulatus xdhAB cloning and biochemical
      characterization; the abstract directly supports the split XdhA/XdhB
      cofactor assignment and alpha2beta2 purified enzyme.
  findings:
  - statement: The xdhA and xdhB open reading frames encode R. capsulatus xanthine dehydrogenase.
    supporting_text: region revealed two open reading frames, designated xdhA and xdhB, encoding
  - statement: XdhB was predicted to contain the molybdopterin cofactor.
    supporting_text: molybdopterin cofactor
  - statement: Mutants unable to grow on xanthine as sole nitrogen source led to the xdhAB locus.
    supporting_text: unable to grow with xanthine as sole
  - statement: Purified R. capsulatus XDH is an alpha2beta2 enzyme.
    supporting_text: alpha2beta2-subunit structure.
- id: PMID:11796116
  title: Crystal structures of the active and alloxanthine-inhibited forms of
    xanthine dehydrogenase from Rhodobacter capsulatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified R. capsulatus XDH crystal-structure paper; its abstract
      supports the enzyme's hypoxanthine-to-xanthine and xanthine-to-urate
      reactions and structural similarity to eukaryotic XDH.
  findings:
  - statement: R. capsulatus XDH oxidizes hypoxanthine to xanthine and then xanthine to urate while reducing NAD+.
    supporting_text: catalyzes the oxidation of hypoxanthine to xanthine
- id: PMID:19109249
  title: Mechanism of Substrate and Inhibitor Binding of Rhodobacter capsulatus
    Xanthine Dehydrogenase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text PMC paper with substrate-bound R. capsulatus XDH structures;
      directly corroborates the XdhA/XdhB cofactor split and placement of
      hypoxanthine and xanthine in the XdhB active site.
  findings:
  - statement: The 85-kDa XdhB subunit contains the molybdenum cofactor.
    supporting_text: XdhB subunit contains the molybdenum cofactor
  - statement: Substrate-bound structures placed hypoxanthine and xanthine at the XDH active site.
    supporting_text: substrates hypoxanthine, xanthine
