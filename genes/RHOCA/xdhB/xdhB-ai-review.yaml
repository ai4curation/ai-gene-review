id: O54051
gene_symbol: xdhB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1061
  label: Rhodobacter capsulatus
description: >-
  XdhB is the molybdopterin-cofactor catalytic subunit of the heterotetrameric
  Rhodobacter capsulatus XdhAB xanthine dehydrogenase. The XdhB active site
  hydroxylates hypoxanthine and xanthine, while the partner XdhA subunit carries
  the FAD and [2Fe-2S] centers that relay electrons to NAD+.
existing_annotations:
- term:
