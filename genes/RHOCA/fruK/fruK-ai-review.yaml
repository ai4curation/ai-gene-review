    summary: The soluble fructose-phosphate kinase acts in the cytosol.
    action: ACCEPT
    reason: FruK acts on the intracellular fructose-1-phosphate product of the PTS and ATP. The soluble
      kinase architecture supports cytosolic catalysis, without asserting experimental subcellular imaging.
