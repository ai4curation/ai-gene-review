  review:
    summary: Refine carbohydrate metabolism to fructose catabolism.
    action: MODIFY
    reason: FruK directly catalyzes conversion of the PTS product fructose1-phosphate to fructose1,6-bisphosphate
      in the fructose-utilization pathway. GO0006001 is an is_a/part_of descendant of carbohydrate metabolic
      process. This refines an existing process claim on a catalytic participant; it is not a new assertion
      based only on locus proximity or mutant necessity.
