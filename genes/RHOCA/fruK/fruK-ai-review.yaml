id: P23386
gene_symbol: fruK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1061
  label: Rhodobacter capsulatus
description: FruK is the soluble fructose-1-phosphate kinase encoded in the Rhodobacter capsulatus fructose-utilization
  operon. It phosphorylates fructose 1-phosphate with ATP to form fructose 1,6-bisphosphate, connecting
  fructose PTS uptake to central carbon metabolism. It belongs to the PfkB carbohydrate-kinase family;
  this membership does not make it a fructose-6-phosphate kinase. The sequenced protein originates from
  strain DSM938/37b4.
