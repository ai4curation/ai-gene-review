- term:
    id: GO:0034017
    label: trans-2-decenoyl-acyl-carrier-protein isomerase activity
  evidence_type: IDA
  original_reference_id: PMID:15980063
  qualifier: enables
  review:
    summary: >-
      Missing core activity: FabN isomerizes trans-2-decenoyl-ACP, the reaction
      that distinguishes it from the paralogous E. faecalis FabZ.
    action: NEW
    reason: >-
      Wang and Cronan showed that FabZ1 replaces E. coli FabA in vivo, which
      requires the isomerase reaction, and Lu et al. used in vitro biochemical
      analyses of EfFabN, EfFabZ and domain-swapped chimeras to define the
      determinants of isomerase activity. The protein enables the reaction
      itself, so the molecular function is warranted.
    supported_by:
    - reference_id: PMID:15980063
      supporting_text: >-
        One of these, termed
        EfFabN, carries out the isomerization reaction in vivo, whereas the other,
        EfFabZ, does not
    - reference_id: PMID:15980063
      supporting_text: >-
        Substitution of the beta3 and beta4 strands of EfFabZ with the corresponding
        strands from EfFabN was necessary and sufficient to convert EfFabZ into an
        isomerase.
