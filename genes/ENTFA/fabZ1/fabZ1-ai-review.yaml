suggested_questions:
- question: >-
    Does FabN also act as the general dehydratase of saturated fatty acid
    elongation in E. faecalis, or does the paralogous FabZ carry that load in
    vivo?
suggested_experiments:
- description: >-
    Measure dehydratase and isomerase activities of purified FabN and FabZ
    across 3-hydroxyacyl-ACP chain lengths, and profile membrane fatty acids of
    single deletion mutants grown with and without exogenous unsaturated fatty
    acids.
