- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000085106
  review:
    summary: >-
      Lipid A process transferred from Gram-negative FabZ rule; E. faecalis is a
      Gram-positive bacterium without lipopolysaccharide.
    action: REMOVE
    reason: >-
      In Gram-negative bacteria FabZ supplies (3R)-hydroxymyristoyl-ACP for lipid A
      synthesis. E. faecalis is a Gram-positive firmicute whose envelope has
      teichoic and lipoteichoic acids, not an outer membrane with
      lipopolysaccharide, and FabZ1 is characterized as the dehydratase/isomerase
      of unsaturated fatty acid synthesis. The rule-based transfer is a taxon
      mismatch.
    supported_by:
    - reference_id: PMID:15194690
      supporting_text: >-
        We report that the Gram-positive bacterium Enterococcus faecalis
        encodes a protein, annotated as FabZ1, that functionally replaces the E. coli
        FabA protein
