id: Q820V3
gene_symbol: fabZ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:226185
  label: Enterococcus faecalis V583
description: >-
  FabZ1, also called FabN, is a hotdog-fold (3R)-hydroxyacyl-[acyl-carrier-protein]
  dehydratase of Enterococcus faecalis type II fatty acid synthesis that also
  isomerizes trans-2-decenoyl-ACP to cis-3-decenoyl-ACP. This bifunctional
  dehydratase/isomerase activity introduces the cis double bond for
  oxygen-independent unsaturated fatty acid synthesis, and the protein can
  replace FabA in Escherichia coli. Its sequence is much closer to the
  general FabZ dehydratases than to proteobacterial FabA. Domain swapping with
  the paralogous E. faecalis FabZ, which only dehydrates, showed that the beta3
  and beta4 strands lining the substrate tunnel, rather than the active-site
  residues, confer isomerase activity.
