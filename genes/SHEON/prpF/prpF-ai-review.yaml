proposed_new_terms:
- proposed_name: methylaconitate isomerase activity
  proposed_definition: >-
    Catalysis of the isomerization of a methylaconitate isomer produced by
    aconitase-like 2-methylcitrate dehydratase (AcnD) to 2-methyl-cis-aconitate.
  justification: >-
    PrpF's physiological reaction has no GO term. The closest term, GO:0047614
    aconitate delta-isomerase activity, describes the unmethylated in vitro model
    reaction only. EC 5.3.3.- and RHEA:37751 (2-methyl-trans-aconitate =
    2-methyl-cis-aconitate) are the current reaction representations, but the identity
    of the AcnD product (4-methyl-cis-aconitate versus 2-methyl-trans-aconitate) is not
    settled. The definition is therefore written in terms of the product,
    2-methyl-cis-aconitate.
  proposed_parent:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  supported_by:
  - reference_id: PMID:29145506
    supporting_text: PrpF (SoPrpF) protein isomerizes the product of the SoAcnD dehydratase
      (putatively 4-methyl-cis-aconitate (4-MCA) to 2-methyl-cis-aconitate (2-MCA)
suggested_questions:
- question: >-
    Is the AcnD product 4-methyl-cis-aconitate (requiring a double-bond migration) or
    2-methyl-trans-aconitate (requiring cis/trans isomerization)? The answer decides
    whether RHEA:37751, as asserted in UniProt, or a positional-isomerase reaction
    describes PrpF.
- question: >-
    Which PTHR43709:SF2 members besides PrpF carry the AcnD-partner methylaconitate
    isomerase function? SF2 also holds methylitaconate isomerase (Mii) and fungal
    aconitate delta-isomerase (Adi1), and the PAINT node assigns only the EC 5.3.3-level
    term.
suggested_experiments:
- description: >-
    Determine the structure of the AcnD reaction product by NMR, using authentic
    standards of 4-methyl-cis-aconitate and 2-methyl-trans-aconitate, and measure PrpF
    kinetics (kcat/Km) on each isomer and on trans-aconitate.
  experiment_type: in vitro enzyme kinetics and NMR
- description: >-
    Delete prpF in S. oneidensis MR-1 itself (the existing in vivo data come from
    heterologous complementation in S. enterica) and test growth on propionate, and
    whether methylaconitate accumulates.
  experiment_type: gene deletion and growth phenotyping
