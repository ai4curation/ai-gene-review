core_functions:
- description: >-
    Cofactor-independent isomerase that converts the methylaconitate isomer made by the
    Fe/S 2-methylcitrate dehydratase AcnD (proposed to be 4-methyl-cis-aconitate) into
    2-methyl-cis-aconitate, the substrate of aconitase. Lys73 acts as the catalytic base
    in the inter-domain active site of the homodimer. The physiological activity is
    established by in vitro assay with the AcnD product and by in vivo mutant
    complementation (PMID:29145506). Isomerization of trans-aconitate to cis-aconitate is
    a weaker model-substrate activity (PMID:17567742).
