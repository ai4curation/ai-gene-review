- term:
    id: GO:0019543
    label: propionate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:14702315
  qualifier: involved_in
  review:
    summary: >-
      S. oneidensis acnD and prpF expressed together, but neither alone, restored growth
      of an S. enterica prpD mutant on propionate as the sole carbon and energy source,
      under both aerobic and anaerobic conditions.
    action: ACCEPT
    reason: >-
      The assay is heterologous complementation in Salmonella, closer to IGI/IMP than to
      a direct assay, but the conclusion holds. PrpF does part of the work of propionate
      catabolism: it catalyses the isomerization step between the AcnD dehydration and
      the aconitase hydration in the 2-methylcitric acid cycle (PMID:29145506). This is
      participation, not mere necessity, so the process annotation passes the
      participation test. GO's specific 2-methylcitrate cycle process terms
      (GO:0019629, GO:0019679) are obsolete, so propionate catabolic process is the most
      precise valid term. The 2004 paper did not identify PrpF's activity. It found
      that PrpF has no aconitase-like dehydratase or hydratase activity and speculated
      about an Fe/S repair role. Later work showed PrpF is an isomerase instead, but
      the process assignment stands.
    supported_by:
    - reference_id: PMID:14702315
      supporting_text: together, the AcnD and PrpF proteins restored the ability of a prpD
        mutant strain of Salmonella enterica to grow on propionate
    - reference_id: PMID:14702315
      supporting_text: Only the positive control ( prpD + ) and strains containing both
        the acnD + and prpF + plasmids grew anaerobically on propionate
- term:
    id: GO:0019543
    label: propionate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:17567742
  qualifier: involved_in
  review:
    summary: >-
      The structural and biochemical study proposes that PrpF's isomerase activity is
      an integral step of the AcnD-dependent 2-methylcitric acid cycle.
    action: ACCEPT
    reason: >-
      PMID:17567742 assigns PrpF an isomerase activity and places it in the
      2-methylcitric acid cycle. PMID:29145506 confirms this: PrpF isomerizes the AcnD
      product to the aconitase substrate, and PrpF variants at K73 or C107 cannot support
      growth on propionate. The gene product catalyses a step of the pathway, so the
      annotation is correct.
    supported_by:
    - reference_id: PMID:17567742
      supporting_text: The data reported here strongly support the argument that PrpF is
        responsible for the isomerization of 2-methylaconitate, the product of the dehydration
        of 2-methylcitrate by the AcnD enzyme.
    - reference_id: PMID:29145506
      supporting_text: variants with substitutions of residues K73 or C107 failed to support
        growth
