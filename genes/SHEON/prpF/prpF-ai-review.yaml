gene_symbol: prpF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  PrpF (SO_0342) is a 397-residue, cofactor-independent methylaconitate isomerase of
  the 2-methylcitric acid cycle of propionate catabolism in Shewanella oneidensis MR-1.
  In this organism the prp locus encodes the Fe/S aconitase-like 2-methylcitrate
  dehydratase AcnD together with PrpF instead of the cofactor-less dehydratase PrpD.
  AcnD dehydrates 2-methylcitrate to a methylaconitate isomer (proposed to be
  4-methyl-cis-aconitate) that aconitase cannot hydrate, and PrpF isomerizes it to
  2-methyl-cis-aconitate, the substrate that aconitase converts to 2-methylisocitrate.
  The two genes are needed together to restore growth on propionate of a Salmonella
  enterica prpD mutant, and neither works alone. PrpF has no dehydratase or hydratase
  activity of its own. It is a homodimer with the diaminopimelate epimerase-like
  (PrpF/DUF453, Pfam PF04303) fold: two alpha/beta domains with the active site in the
  cleft between them. The crystal structure with trans-aconitate bound places Lys73 as
  the catalytic base, with Cys107 nearby (Cys107 is oxidized to a sulfinic acid in the
  crystal), and both residues are required for activity in vivo. The purified protein
  slowly isomerizes trans-aconitate to cis-aconitate in vitro, a model reaction that
  shows its cis/trans and double-bond isomerase chemistry.
