- term:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  evidence_type: IDA
  original_reference_id: PMID:17567742
  qualifier: enables
  review:
    summary: >-
      Direct assay of purified S. oneidensis PrpF. It converts trans-aconitate to
      cis-aconitate (4.8 pmol/min/ug), and the crystal structure with trans-aconitate
      shows how the substrate is held in the inter-domain active site.
    action: ACCEPT
    reason: >-
      This is the founding biochemical evidence that PrpF is an isomerase. The assay used
      the unmethylated analogue, and the authors attribute the low rate to its not being
      the physiological substrate. A later paper from the same groups shows that PrpF
      isomerizes the AcnD product to 2-methyl-cis-aconitate, a reaction that both
      cis/trans isomerization and double-bond migration in a tricarboxylate fit
      (PMID:29145506). GO has no term specific to methylaconitate isomerization (see
      proposed_new_terms), so GO:0016863 (EC 5.3.3) is the most precise existing term
      that correctly covers the physiological reaction. The child term GO:0047614
      aconitate delta-isomerase activity matches the in vitro model reaction only, and
      curators did not use it, so it is not proposed here.
    supported_by:
    - reference_id: PMID:17567742
      supporting_text: Under the assay conditions used, PrpF-dependent synthesis of cis
        -aconitate was calculated to occur at 4.8
    - reference_id: PMID:17567742
      supporting_text: The lack of a more robust isomerase activity associated with PrpF
        may be due to the use of aconitate rather than 2-methylaconitate, the true substrate
        of the enzyme.
    - reference_id: PMID:29145506
      supporting_text: PrpF (SoPrpF) protein isomerizes the product of the SoAcnD dehydratase
        (putatively 4-methyl-cis-aconitate (4-MCA) to 2-methyl-cis-aconitate (2-MCA)
