    reference_section_type: ABSTRACT
  - statement: >-
      Purified PrpF has no aconitase-like (dehydratase/hydratase) activity. The
      accessory Fe/S-protection role proposed in this paper was later superseded by the
      isomerase assignment.
    supporting_text: No aconitase-like activity was found for PrpF
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC305763). This paper establishes that PrpF is required for
      the propionate pathway, using heterologous complementation in S. enterica. Its
      hypothesis that PrpF protects or repairs the AcnD Fe/S cluster was not supported:
      in the same paper PrpF did not stabilize AcnD, and later work identified PrpF as
      an isomerase (PMID:17567742, PMID:29145506).
