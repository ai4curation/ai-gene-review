  review:
    summary: >-
      PAINT IBA from ancestral node PTN002017920 (PTHR43709). The family's PAINT slice
      shows Q8EJW4 itself as the only seed of the IBD at this node.
    action: ACCEPT
    reason: >-
      The target is the experimental seed of the PAINT IBD that this IBA comes from.
      Seeing it in its own WITH/FROM is expected and is not circular: its IDA was the
      descendant evidence the PAINT curator used to place the function on the ancestral
      node. The IBA adds the claim that the C=C-transposing isomerase activity is
      inherited at that node, which fits the conserved diaminopimelate epimerase-like
      fold and catalytic lysine across PTHR43709. The family (aconitate isomerase-related)
      and subfamily SF2 contain enzymes that act on several different organic-acid
      substrates (methylaconitate, aconitate, methylitaconate). The PAINT curator placed
      only the general EC 5.3.3-level term on the node, with no substrate-specific child,
      and that level of specificity fits a family of mixed substrates.
