  review:
    summary: >-
      InterPro2GO mapping from the PrpF signature (IPR012709) to the generic isomerase
      activity term. True, but more general than the evidence for this protein supports.
    action: MODIFY
    reason: >-
      PrpF's isomerase activity has been shown directly in this species: the purified
      protein converts trans-aconitate to cis-aconitate (PMID:17567742), and it
      isomerizes the AcnD product to 2-methyl-cis-aconitate (PMID:29145506). Both
      reactions move or re-orient a C=C double bond within a tricarboxylate, which is
      what GO:0016863 (intramolecular oxidoreductase activity, transposing C=C bonds,
      EC 5.3.3) describes. This gene already carries GO:0016863 by IDA and IBA, so the
      generic parent should be refined to that term.
    proposed_replacement_terms:
