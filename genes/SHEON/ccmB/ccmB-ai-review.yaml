  review:
    summary: CcmB overproduction supports conditional cellular heme efflux in MR-1.
    action: KEEP_AS_NON_CORE
    reason: 'The MR-1 genomic-library, deletion/complementation and overexpression experiments show reduced
      cellular heme and increased extracellular heme by HPLC. They support conditional export capacity,
      not a demonstrated purified CcmB channel: whole-cell efflux does not isolate inner-membrane movement,
      exclude other host pumps, or resolve outer-membrane transit. Native untagged and His6 controls address
      the tag, not purified flux. E. coli CcmCD channel mapping challenges universal CcmB-conduit assignment
      but does not negate the MR-1 overexpression phenotype. Thus the inferred transport claim is retained
      only as non-core; native conduit identity remains unresolved.'
    supported_by:
    - reference_id: PMID:40026579
      supporting_text: The pigment in the supernatants in (F) was determined by HPLC and quantified.
    - reference_id: PMID:40167305
      supporting_text: Thus, CcmAB, and consequently ATP hydrolysis, are not required for heme transport
        to the CcmC WWD domain.
