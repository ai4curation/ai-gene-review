gene_symbol: ccmB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: CcmB is an integral inner-membrane component of the System I cytochrome c maturation machinery
  in Shewanella oneidensis MR-1. It associates with CcmA, CcmC and CcmD in heme handling and maturation.
  Overproduction promotes cellular heme efflux, while the identity of the native membrane-crossing heme
  conduit remains disputed.
