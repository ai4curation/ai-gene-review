- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  findings:
  - statement: In the E. coli system examined, CcmAB and ATP hydrolysis are not required for heme delivery
      to the CcmC WWD domain. This challenges a universal CcmB conduit model; it is not an MR-1 efflux
      result.
    supporting_text: Thus, CcmAB, and consequently ATP hydrolysis, are not required for heme transport
      to the CcmC WWD domain.
