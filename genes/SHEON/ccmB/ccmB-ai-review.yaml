  review:
    summary: MR-1 efflux phenotypes do not resolve autonomous CcmB membrane-crossing activity.
    action: UNDECIDED
    reason: PMID:40026579 reports decreased cellular heme and increased extracellular heme under MR-1
      CcmB overproduction, together with membrane association, mutagenesis and modeling. These observations
      support involvement in heme movement but do not isolate transport across the inner membrane by CcmB
      alone, exclude host transport components, or resolve outer-membrane transit. PMID:40167305 maps
      an alternative CcmCD route in E. coli and challenges the general CcmB-conduit model; it is not a
      negative MR-1 assay. The exact molecular activity is therefore unresolved rather than a positively
      established non-core transporter.
    supported_by:
    - reference_id: PMID:40026579
      supporting_text: The pigment in the supernatants in (F) was determined by HPLC and quantified.
    - reference_id: PMID:40167305
      supporting_text: Thus, CcmAB, and consequently ATP hydrolysis, are not required for heme transport
        to the CcmC WWD domain.
