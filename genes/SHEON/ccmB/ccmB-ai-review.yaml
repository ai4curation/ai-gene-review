  review:
    summary: CcmB participates in heme trafficking, without an asserted autonomous transmembrane conduit.
    action: ACCEPT
    reason: GO:0015886 covers movement into, out of or within a cell. Conserved CcmB participation in
      the CcmA-coupled machinery that releases holo-CcmE provides a positive mechanistic basis for the
      intracellular-handoff process; the direct release experiment is E. coli ortholog evidence, transferred
      explicitly to MR-1. Independently, MR-1 overproduction under ALA/iron supplementation increases
      measured extracellular heme, supporting conditional whole-cell movement. These lines support a component
      that performs heme-handling work, not merely a heme substrate. Neither identifies an autonomous
      CcmB channel or proves that normal native flux follows the overexpression route. The narrower molecular
      transporter claim is assessed separately as UNDECIDED.
    supported_by:
    - reference_id: PMID:16824107
      supporting_text: Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1 complex and
        ATP-dependent release of holoCcmE.
    - reference_id: PMID:40026579
      supporting_text: Results showed that the ccmB mutant did not release heme to levels above the detection
        limit but was able to do so when the ccmB gene was expressed with IPTG at 0.1 mM or above
