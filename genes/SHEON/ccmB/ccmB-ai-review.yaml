  review:
    summary: CcmB contributes to the MR-1 cytochrome c maturation machinery.
    action: ACCEPT
    reason: Functional rescue by CcmB and its participation in the CcmACD machinery corroborate the PAINT-inferred
      biosynthetic role. The exact heme conduit is disputed, but that disagreement does not erase participation
      in maturation. Neither donor count nor a target appearing among seeds is grounds to dismiss the
      inheritance assertion.
