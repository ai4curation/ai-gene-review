  review:
    summary: CcmB participates in cytochrome c maturation rather than generic cytochrome-complex assembly.
    action: MODIFY
    reason: This is a lateral correction from assembly of a cytochrome-containing complex to cytochrome
      c biosynthesis, already supported by an IBA row. Functional complementation and machinery interactions
      support CcmB participation; no direct heme-ligation catalysis by CcmB is asserted.
    supported_by:
