  review:
    summary: >-
      UniProt EXP annotation to aconitate hydratase (citrate = isocitrate),
      based on the 2004 enzymology of purified, reconstituted AcnD.
    action: MODIFY
    reason: >-
      GO:0003994 is defined as the full citrate = isocitrate interconversion
      through cis-aconitate. The cited paper (full text read) shows that AcnD
      dehydrates citrate to cis-aconitate and hydrates cis-aconitate, but does
      not use isocitrate or 2-methylisocitrate. AcnD therefore catalyses only
      the dehydration half-reaction, and acnD (with or without prpF) cannot
      replace aconitase in the TCA cycle of an S. enterica acnA acnB mutant.
      The isocitrate-forming reaction that GO:0003994 asserts is directly
      contradicted by the paper the annotation cites. The sound core of the
      annotation is a hydro-lyase activity on tricarboxylates; GO has no
      citrate-to-cis-aconitate term (the sub-reaction terms were made
      obsolete), and the physiological substrate is 2-methylcitrate. The row is
      therefore re-pointed to GO:0016836 hydro-lyase activity, which this gene
      already carries by IDA from the same paper.
