  review:
    summary: >-
      PAINT IBA from the family root node PTN000186700, seeded by vertebrate
      and fly IRP1/IRP2, and by Mycobacterium tuberculosis aconitase (O53166).
    action: REMOVE
    reason: >-
      Iron-responsive element binding is the apo-form mRNA-regulatory activity
      of the cytosolic aconitase/IRP branch. Placing it at the root of
      PTHR11670 over-propagates it onto AcnD, a dedicated
      2-methylcitrate dehydratase of the bacterial prp locus (IPR012708,
      TIGR02333) with no evidence of RNA binding. AcnD's in vivo role is fully
      accounted for by its dehydratase activity in propionate catabolism
      (PMID:14702315, PMID:29145506). The IRE is a eukaryotic mRNA element,
      and no RNA-binding role has been reported for any AcnD-clade protein.
    propagation_review:
