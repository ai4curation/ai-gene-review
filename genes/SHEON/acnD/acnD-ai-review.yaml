    supporting_text: These results indicate that both acnD and prpF are required to
      complement a prpD strain of S. enterica .
  - reference_id: PMID:29145506
    supporting_text: The different retention times and chromatographic behavior indicated
      to us that the dehydration product of SePrpD and SoAcnD were different compounds
  - reference_id: PMID:29145506
    supporting_text: Neither SeAcnA nor SeAcnB used the SoAcnD reaction product as substrate
proposed_new_terms:
- proposed_name: AcnD-type 2-methylcitrate dehydratase activity
  proposed_definition: >-
    Catalysis of the dehydration of (2S,3S)-2-methylcitrate to water and a
    methylaconitate isomer other than 2-methyl-cis-aconitate, which requires
    isomerization (by PrpF) before hydration by aconitase.
  justification: >-
    GO:0047547 2-methylcitrate dehydratase activity specifies
    2-methyl-cis-aconitate as product (the PrpD reaction, EC 4.2.1.79,
    RHEA:17725). The AcnD product differs from the PrpD product and is not an
    aconitase substrate (PMID:29145506). It is recorded as
    2-methyl-trans-aconitate by UniProt/Rhea (EC 4.2.1.117, RHEA:26522), but
    the authors infer 4-methylaconitate. Because the exact structure is
    unresolved, the term is defined by substrate and by the product's
    non-identity with 2-methyl-cis-aconitate. Name and definition match the
    proposal made for the Pseudomonas putida ortholog (genes/PSEPK/acnA-II).
    This is the same reaction as the existing proposal in
    projects/RHEA/rhea2go.sssom.yaml for RHEA:26522 / EC 4.2.1.117
    ('2-methylcitrate dehydratase (2-methyl-trans-aconitate forming) activity',
    also grounded on Q8EJW3 and PMID:14702315); the two should be submitted as
    one term. The product-neutral name is preferred because PMID:29145506
    disputes the 2-methyl-trans-aconitate product that the RHEA-based name
    fixes.
  proposed_parent:
    id: GO:0016836
    label: hydro-lyase activity
  supported_by:
  - reference_id: PMID:29145506
    supporting_text: The different retention times and chromatographic behavior indicated
      to us that the dehydration product of SePrpD and SoAcnD were different compounds
  - reference_id: PMID:29145506
    supporting_text: it is likely that 4-methylaconitate is the product of the AcnD enzyme
suggested_questions:
- question: >-
    Is the AcnD product 4-methyl-cis-aconitate or 2-methyl-trans-aconitate?
    The answer decides whether EC 4.2.1.117 / RHEA:26522, as asserted in
    UniProt, correctly describes AcnD.
- question: >-
    Should UniProt retain the EC 4.2.1.3 citrate = D-threo-isocitrate
    catalytic activity for AcnD, given that the cited paper found no activity
    with isocitrate?
- question: >-
    Which residue differences from TCA-cycle aconitases (for example the Asn
    following a cluster-ligating Cys, noted by Grimek and Escalante-Semerena)
    make AcnD accept 2-methylcitrate and release the product rather than
    rehydrating it?
suggested_experiments:
- description: >-
    Determine the structure of the purified AcnD product from
    (2S,3S)-2-methylcitrate by multi-dimensional NMR against authentic
    4-methyl-cis-aconitate and 2-methyl-trans-aconitate standards, and
    measure AcnD kinetics on 2-methylcitrate and citrate.
  experiment_type: in vitro enzymology and NMR
- description: >-
    Delete acnD in S. oneidensis MR-1 itself and test growth on propionate and
    accumulation of 2-methylcitrate, since existing in vivo data come from
    heterologous complementation in S. enterica.
  experiment_type: gene deletion and growth phenotyping
