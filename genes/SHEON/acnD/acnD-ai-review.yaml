gene_symbol: acnD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  AcnD (SO_0343) is an 867-residue iron-sulfur dehydratase of the
  aconitase/IPM isomerase family that replaces the cofactor-free
  2-methylcitrate dehydratase PrpD in the 2-methylcitric acid cycle of
  propionate catabolism in Shewanella oneidensis MR-1. It is encoded in the prp
  locus next to prpF. AcnD dehydrates (2S,3S)-2-methylcitrate, and less
  efficiently citrate, but does not use 2-methylisocitrate or isocitrate, so it
  performs only the first, dehydration half of an aconitase-type reaction and
  cannot replace aconitase in the tricarboxylic acid cycle. Its
  methylaconitate product differs from the 2-methyl-cis-aconitate made by PrpD
  and is not a substrate for aconitases. The product is proposed to be
  4-methyl-cis-aconitate, though UniProt and Rhea record it as
  2-methyl-trans-aconitate, and its structure has not been determined
  directly. The partner isomerase PrpF converts it to 2-methyl-cis-aconitate,
  which aconitase then hydrates to 2-methylisocitrate. AcnD and PrpF together,
  but neither alone, restore growth on propionate of a Salmonella enterica prpD
  mutant. Activity requires anoxic reconstitution of a [4Fe-4S] cluster with
  iron, sulfide and reductant, is lost with iron chelators and ferricyanide or
  on exposure to air, and the protein conserves the three cluster-ligating
  cysteines of mitochondrial aconitase.
