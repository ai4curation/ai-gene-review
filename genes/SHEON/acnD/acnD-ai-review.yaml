- term:
    id: GO:0016836
    label: hydro-lyase activity
  evidence_type: IDA
  original_reference_id: PMID:14702315
  qualifier: enables
  review:
    summary: >-
      Purified, Fe/S-reconstituted AcnD dehydrates 2-methylcitrate (about
      2.5-fold faster than citrate), shown by spectrophotometric assay and
      13C-NMR of the product.
    action: ACCEPT
    reason: >-
      The most precise correct GO molecular-function term available for the
      core activity. GO:0047547 2-methylcitrate dehydratase activity is
      defined with 2-methyl-cis-aconitate as product, which is the PrpD
      reaction. Later work from the same group showed by HPLC that the AcnD
      product is a different methylaconitate isomer that aconitases cannot
      use and that PrpF must isomerize to 2-methyl-cis-aconitate
      (PMID:29145506). That supersedes the 2004 NMR interpretation that the
      AcnD and PrpD products were identical. The AcnD product (proposed
      4-methyl-cis-aconitate by the authors, 2-methyl-trans-aconitate in
      UniProt/Rhea, EC 4.2.1.117) has no GO term, so the generic parent is the
      honest choice; a product-neutral child term is proposed under
      proposed_new_terms.
    supported_by:
    - reference_id: PMID:14702315
      supporting_text: The specific activity of AcnD for 2-MC was approximately 2.5-fold
        higher than that for citrate.
    - reference_id: PMID:29145506
      supporting_text: The different retention times and chromatographic behavior indicated
        to us that the dehydration product of SePrpD and SoAcnD were different compounds
    - reference_id: PMID:29145506
      supporting_text: it is likely that 4-methylaconitate is the product of the AcnD enzyme
- term:
    id: GO:0019543
    label: propionate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:14702315
  qualifier: involved_in
  review:
    summary: >-
      S. oneidensis acnD together with prpF, but neither alone, restored growth
      of an S. enterica prpD mutant on propionate as sole carbon and energy
      source, aerobically and anaerobically; purified AcnD dehydrates
      2-methylcitrate.
    action: ACCEPT
    reason: >-
      AcnD catalyses the dehydration step of the 2-methylcitric acid cycle,
      so it performs part of the work of propionate catabolism rather than
      merely being required for it. The in vivo evidence is heterologous
      complementation (closer to IGI/IMP than IDA), but the biochemistry of
      the purified protein independently establishes participation. The
      2-methylcitrate cycle process terms are obsolete in GO, so propionate
      catabolic process is the most precise valid term.
    supported_by:
    - reference_id: PMID:14702315
      supporting_text: These results indicate that both acnD and prpF are required to
        complement a prpD strain of S. enterica .
    - reference_id: PMID:14702315
      supporting_text: This study established, both in vitro and in vivo, the biochemical
        activity of a new enzyme involved in the 2-MC cycle of several prokaryotes.
