- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IDA
  original_reference_id: PMID:20018742
  qualifier: enables
  review:
    summary: >-
      As the extracellular subunit of MtrCAB, MtrC accepts electrons from MtrA and
      passes them to extracellular acceptors; the reconstituted complex moves electrons
      across a lipid bilayer.
    action: NEW
    reason: >-
      This is the carrier function, distinct from the reductase chemistry asserted by
      the metal-ion oxidoreductase row: MtrC transfers electrons between redox partners
      (MtrA on one side, soluble shuttles, minerals or electrodes on the other). It is
      shown directly by proteoliposome electron transfer with purified MtrCAB and by
      the modular reconstitution of the complex (PMID:20018742), and the MtrC-MtrA-MtrB
      stoichiometry of the conduit was established independently (PMID:17675441). Not
      an ancestor or descendant of the other terms proposed here.
    supported_by:
    - reference_id: PMID:20018742
      supporting_text: we present a spectro-potentiometric characterization of a trans-OM
        icosa-heme complex, MtrCAB, and demonstrate its capacity to move electrons across
        a lipid bilayer after incorporation into proteoliposomes
    - reference_id: PMID:20018742
      supporting_text: We propose a model for the modular organization of the MtrCAB complex
        in which MtrC is an extracellular element that mediates electron transfer to extracellular
        substrates
    - reference_id: PMID:17675441
      supporting_text: We show for the first time that MtrC, MtrA, and MtrB form a 198-kDa
        complex with a 1:1:1 stoichiometry.
- term:
    id: GO:0031240
    label: external side of cell outer membrane
  evidence_type: IDA
  original_reference_id: PMID:18502849
  qualifier: located_in
  review:
    summary: >-
      MtrC is a lipoprotein exposed on the outer face of the outer membrane, reached by
      externally added proteinase K and released extracellularly; its translocation
      there depends on the type II secretion system.
    action: NEW
    reason: >-
      No cellular-component row exists in GOA for this protein, and the surface
      orientation is not an incidental detail: it is what allows MtrC to contact
      insoluble minerals directly, and it is the premise of the terminal-reductase
      role. Proteinase K accessibility of intact cells and T2SS-dependent extracellular
      release establish the external side specifically (PMID:18502849), and immunolabel
      of MtrC along outer-membrane extensions is consistent (PMID:25143589). The
      lipobox and lipid modification are recorded on Q8EG34.
    supported_by:
    - reference_id: PMID:18502849
      supporting_text: MtrC and OmcA are cell surface-exposed lipoproteins important for
        reducing solid metal oxides.
    - reference_id: PMID:18502849
      supporting_text: Deletions of type II secretion system (T2SS) genes reduced their
        extracellular release and their accessibility to the proteinase K treatment
    - reference_id: PMID:25143589
      supporting_text: We also demonstrate that the outer membrane multiheme cytochromes
        MtrC and OmcA localize to these membrane extensions
- term:
    id: GO:0019645
    label: anaerobic electron transport chain
  evidence_type: IMP
  original_reference_id: PMID:16875436
  qualifier: involved_in
  review:
    summary: >-
      MtrC is the terminal electron-transfer step of the anaerobic respiratory chain
      that S. oneidensis runs to extracellular acceptors; deleting mtrC slows reduction
      of U(VI), Cr(VI) and Mn(IV)/Fe(III) oxides.
    action: NEW
    reason: >-
      MtrC does the work of this process rather than being consumed by it: it is the
      last carrier in the chain and performs the terminal electron transfer onto the
      acceptor, which is both demonstrated in vitro with the purified protein and
      required in vivo. Deletion phenotypes (PMID:16875436, PMID:21498755) establish
      necessity; the proteoliposome conduit experiment (PMID:20018742) establishes that
      the protein itself carries out the transfer. The comparator check supports the
      term rather than warning against it: other terminal reductases of anaerobic
      chains, such as E. coli NrfB in this same PANTHER family, carry GO:0019645.
    supported_by:
    - reference_id: PMID:16875436
      supporting_text: the outer membrane (OM) decaheme cytochrome MtrC (metal reduction),
        previously implicated in Mn(IV) and Fe(III) reduction, directly transferred electrons
        to U(VI)
    - reference_id: PMID:21498755
      supporting_text: the deletion of mtrC decreased the initial rate of Cr(VI) reduction
        by 43.5%
    - reference_id: PMID:20018742
      supporting_text: We propose a model for the modular organization of the MtrCAB complex
        in which MtrC is an extracellular element that mediates electron transfer to extracellular
