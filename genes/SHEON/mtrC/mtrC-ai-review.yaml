  review:
    summary: >-
      MtrC is a decaheme cytochrome: ten covalently attached c-type hemes were counted
      in the purified protein and placed in its 1.8 A crystal structure.
    action: NEW
    reason: >-
      Heme binding is the cofactor basis of every activity asserted for this protein,
      it is directly demonstrated for MtrC itself, and no row in GOA covers it. The
      hemes are seen in the crystal structure of S. oneidensis MtrC (PMID:26126857) and
      counted in independently purified protein (PMID:16788180). UniProt records ten
      heme c binding sites on Q8EG34 from the structures.
