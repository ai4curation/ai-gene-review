suggested_questions:
- question: >-
    Is a single molecular-function term adequate for a cell-surface multiheme
    cytochrome that both carries electrons within a conduit and reduces several
    unrelated metals, or does GO need a term for terminal reduction of an extracellular
    or insoluble acceptor?
- question: >-
    How much of the in vivo reduction of U(VI) and Cr(VI) proceeds by direct contact
    with MtrC versus by flavin shuttling, and does the flavocytochrome form change that
    balance?
- question: >-
    What determines the division of labour between MtrC and OmcA, given that OmcA is
    the faster Cr(VI) reductase in vitro while mtrC deletion is the more damaging
    lesion for several other acceptors?
suggested_experiments:
- experiment_type: kinetics on purified protein
  description: >-
    Measure reduction rates of the full metal panel CMMMech cares about (Fe(III) oxides,
    Mn(IV), U(VI), Cr(VI), V(V), Se(IV), Ag(I)) with the same purified MtrC preparation
    under one set of conditions, so that substrate preference can be compared across
    metals rather than across papers.
- experiment_type: targeted mutagenesis
  description: >-
    Compare metal reduction by cells carrying the CX8C-to-AX8A MtrC variant with wild
    type under strictly anaerobic conditions, to separate the flavocytochrome
    contribution from the heme-only pathway for each acceptor.
