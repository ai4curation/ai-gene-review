gene_symbol: mtrC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  MtrC (SO_1778, called OmcB in the early Myers literature) is a 671-residue decaheme
  c-type cytochrome lipoprotein of Shewanella oneidensis MR-1. It carries a signal
  peptide and a lipobox cysteine, is lipidated, and is translocated across the outer
  membrane by the type II secretion system so that it faces the extracellular side of
  the cell. There it is the terminal, cell-surface subunit of the MtrCAB
  porin-cytochrome complex: the beta-barrel MtrB spans the outer membrane and holds
  the periplasmic decaheme cytochrome MtrA, which receives electrons from the
  inner-membrane quinol dehydrogenase CymA and passes them to MtrC. Reconstituted
  MtrCAB moves electrons across a lipid bilayer. Purified MtrC reduces soluble
  Fe(III)-NTA, U(VI) and Cr(VI), and cells lacking mtrC are slower at reducing Mn(IV)
  and Fe(III) oxides, U(VI) and Cr(VI). MtrC forms a high-affinity complex with the
  second surface decaheme cytochrome OmcA, which raises Fe(III)-NTA reductase
  activity. Its crystal structure shows ten hemes in a staggered-cross arrangement
  across four domains, with a conserved CX8C disulfide (Cys444-Cys453) whose reductive
  cleavage allows reversible binding of flavin mononucleotide and conversion to a more
  reactive flavocytochrome. MtrC and OmcA are also present along the outer-membrane
  extensions ("nanowires") that S. oneidensis produces under electron-acceptor
  limitation.
