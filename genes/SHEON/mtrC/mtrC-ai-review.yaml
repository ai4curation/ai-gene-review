  review:
    summary: >-
      PAINT IBA from ancestral node PTN002858933 of PTHR35038 (multiheme cytochrome
      electron transporters). The IBD at that node was seeded by E. coli NrfB (P0ABL1)
      and S. oneidensis MccA/SirA (Q8EJI6), two multiheme cytochromes of the same
      family whose substrates (nitrite, sulfite) differ from MtrC's.
    action: MODIFY
    reason: >-
      The assertion is sound for MtrC: it descends from the node, and purified MtrC has
      measured redox activity on three different substrates, so the node placement does
      not need to be argued with. The node is deliberately generic because the family
      members reduce chemically unrelated substrates, but for MtrC itself the evidence
      is more specific. Every reaction demonstrated for the purified protein changes
      the oxidation state of a metal ion: Fe(III)-NTA (PMID:16788180), U(VI)
      (PMID:16875436) and Cr(VI) with Michaelis-Menten kinetics (PMID:21498755). That
      is exactly GO:0016722, an is_a child of this term, so this is a refinement rather
      than a rejection of the IBA. GO has no term for reduction of an insoluble metal
      oxide at a cell surface; the conduit aspect is captured separately by the
      electron transfer activity row below.
