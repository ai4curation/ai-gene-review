core_functions:
- description: >-
    Terminal reductase of the Mtr extracellular electron-transfer pathway. Sitting on
    the outer face of the outer membrane as the exposed subunit of MtrCAB, MtrC
    transfers electrons from its ten hemes onto acceptors the cell cannot take in:
    soluble Fe(III) chelates, U(VI), Cr(VI), and solid Mn(IV)/Fe(III) oxides. Activity
    on each metal is measured with purified protein, and deletion of mtrC slows the
    corresponding whole-cell reduction.
