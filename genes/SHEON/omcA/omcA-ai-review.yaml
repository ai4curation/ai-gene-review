core_functions:
- description: >-
    Cell-surface terminal reductase for extracellular metals. OmcA, exposed on the
    outer face of the outer membrane, binds mineral surfaces through a hematite-binding
    motif adjacent to heme 10 and reduces Fe(III) in solution and in solid hematite,
    Cr(VI) (faster than MtrC in vitro), and contributes to whole-cell reduction of
    U(VI) and MnO2. It works alongside MtrC, with which it forms a high-affinity
    complex that is a better Fe(III) reductase than either protein alone.
  molecular_function:
    id: GO:0016722
    label: oxidoreductase activity, acting on metal ions
  directly_involved_in:
  - id: GO:0019645
    label: anaerobic electron transport chain
  locations:
