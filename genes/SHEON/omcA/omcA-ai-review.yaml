id: Q8EG33
gene_symbol: omcA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  OmcA (SO_1779) is a 735-residue decaheme c-type cytochrome lipoprotein of Shewanella
  oneidensis MR-1 and the partner of MtrC on the cell surface. It is lipidated at
  Cys27, exported across the outer membrane by the type II secretion system, and
  exposed on the outer face of the outer membrane, where proteinase K added to intact
  cells degrades it. OmcA binds hematite with high affinity and transfers electrons
  directly to the mineral surface; its crystal structure places a hematite-binding
  motif next to heme 10, so that the electron-egress heme sits about 10 A from the
  mineral. Purified OmcA reduces soluble Fe(III)-NTA and is the faster of the two
  surface cytochromes on Cr(VI), and deleting omcA slows whole-cell reduction of
  Cr(VI), U(VI) and MnO2. OmcA forms a high-affinity complex with MtrC, which raises
  Fe(III)-NTA reductase activity above that of either protein alone; MtrC is charged
  by the MtrAB module of the outer-membrane conduit, so OmcA works as an accessory
  terminal reductase rather than as a subunit of MtrCAB itself. Like MtrC, OmcA binds
  flavin mononucleotide after reduction of a conserved disulfide and is found along the
  outer-membrane extensions called nanowires. Its expression falls in a fur deletion
  mutant, and a candidate Fur-binding site lies upstream of the gene.
existing_annotations:
- term:
    id: GO:0071281
    label: cellular response to iron ion
  evidence_type: EXP
  original_reference_id: PMID:15576789
  qualifier: involved_in
  review:
    summary: >-
      From the Fur modulon study: omcA transcript and OmcA protein both fall in a fur
      deletion mutant, and a candidate Fur-binding motif was found 43 bp upstream of
      the gene. The annotation reads that regulatory observation as participation in a
      cellular response to iron.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited experiments are real and the paper is cached in full, but they are a
      comparison of a fur deletion mutant with wild type under fixed aerobic and
      anaerobic conditions, not an iron-stimulus experiment: no iron concentration was
      varied in the work supporting this row, and the Fur site upstream of omcA is a
      computational motif prediction that the authors explicitly leave for future
      verification. What is shown is that omcA belongs to the Fur modulon. Even taking
      the regulatory result at face value, OmcA's own role is to reduce extracellular
      metals; a change in its abundance is something that happens to it, not work it
      performs in a response process, so the term overstates the claim rather than
      being flatly wrong. It is kept rather than removed because iron-responsive
      regulation of this cytochrome is a reasonable reading of the data, and because
      OmcA does act on Fe(III) as a respiratory acceptor.
    supported_by:
    - reference_id: PMID:15576789
      supporting_text: The gene omcA (SO1779), which encodes a decaheme cytochrome c ,
        exhibited significant decreases in both mRNA and protein abundance in the fur
        mutant and possessed a strong candidate Fur-binding site in its upstream region
    - reference_id: PMID:15576789
      supporting_text: Future research will focus on experimentally verifying the functionality
        of predicted Fur-binding regulatory motifs
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: GO:0071281
      confidence: SUSPECTED
      explanation: >-
        This GOA row (assigned by CollecTF, evidence EXP / ECO:0001808) cites
        PMID:15576789 for involvement of OmcA in cellular response to iron ion. The
        cited work measured omcA transcript and OmcA protein in a fur deletion mutant
        versus wild type and predicted a Fur-binding motif upstream of omcA
        computationally; no iron stimulus was applied in those experiments, and the
        paper states that verification of the predicted motifs is future work. A term
        about regulation of the gene by Fur, or a weaker evidence code, would fit the
        cited evidence better. Flagged for the assigning group to check rather than as
        a confirmed error, since the full curation rationale is not visible from the
        GAF row.
      supported_by:
      - reference_id: PMID:15576789
        supporting_text: Future research will focus on experimentally verifying the functionality
          of predicted Fur-binding regulatory motifs
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:24747425
  qualifier: enables
  review:
    summary: >-
      OmcA is a decaheme cytochrome; ten c-type hemes are resolved in its 2.7 A crystal
      structure and counted in independently purified protein.
    action: NEW
    reason: >-
      Heme binding is the cofactor basis of everything else OmcA does and is shown
      directly for this protein, yet GOA has no molecular-function row for it at all.
      The crystal structure of S. oneidensis OmcA resolves the heme chain and places
      heme 10 at the hematite-binding surface (PMID:24747425), and purified OmcA was
      confirmed to contain ten hemes (PMID:16788180). UniProt records the heme c
      binding sites on Q8EG33 from PDB 4LMH.
    supported_by:
    - reference_id: PMID:24747425
      supporting_text: The X-ray crystal structure of Shewanella oneidensis OmcA, an extracellular
        decaheme cytochrome involved in mineral reduction, was solved to a resolution
        of 2.7 Å.
    - reference_id: PMID:16788180
      supporting_text: Each purified cytochrome was confirmed to contain 10 hemes and
        exhibited Fe(III)-NTA reductase activity.
- term:
    id: GO:0016722
    label: oxidoreductase activity, acting on metal ions
  evidence_type: IDA
  original_reference_id: PMID:21498755
  qualifier: enables
  review:
    summary: >-
      Purified OmcA reduces metal ions: Fe(III)-NTA, Fe(III) in solid hematite, and
      Cr(VI) with apparent kcat 10.2 per second and Km 41 uM.
    action: NEW
    reason: >-
      Three independent assays of purified OmcA show reduction of a metal centre, which
      is what this term describes, and GOA carries no molecular-function annotation for
      this protein. Whole-cell deletions agree: removing omcA lowers Cr(VI) reduction
      by 53.4% (PMID:21498755), slows U(VI) reduction (PMID:16875436), and slows MnO2
      reduction by 45% (PMID:11133454). The term is kept at the metal-ion level
      because the demonstrated substrates span Fe, Cr, U and Mn and GO has no term for
      reduction of an insoluble metal oxide at a cell surface. The electron-carrier
      aspect is asserted separately below and is not an ancestor or descendant of this
      term.
    supported_by:
    - reference_id: PMID:21498755
      supporting_text: purified MtrC and OmcA reduced Cr(VI) with apparent k(cat) values
        of 1.2 ± 0.2 (mean ± standard deviation) and 10.2 ± 1 s(-1)
    - reference_id: PMID:16788180
      supporting_text: Each purified cytochrome was confirmed to contain 10 hemes and
        exhibited Fe(III)-NTA reductase activity.
    - reference_id: PMID:17061851
      supporting_text: The purified outer membrane bacterial protein OmcA binds densely
        to the surface of hematite (Fe2O3), permitting direct electron transfer to this
        solid mineral to reduce Fe (III)
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IDA
  original_reference_id: PMID:17061851
  qualifier: enables
  review:
    summary: >-
      OmcA passes electrons from its heme chain to an external acceptor surface,
      measured as a flux of about 1e13 electrons per square centimetre per second onto
      hematite, and exchanges electrons with MtrC in their joint complex.
    action: NEW
    reason: >-
      This is the carrier role, separate from the reductase chemistry row: OmcA accepts
      electrons from upstream carriers and delivers them onward to a mineral surface or
      to flavin shuttles. Direct electron transfer to hematite is measured on purified
      protein (PMID:17061851), the OmcA-MtrC complex is a better Fe(III)-NTA reductase
      than either protein alone, implying electron exchange between them
      (PMID:16788180), and the structure positions heme 10 about 10 A from the mineral
      surface, which is the geometry the transfer requires (PMID:24747425).
    supported_by:
    - reference_id: PMID:17061851
      supporting_text: permitting direct electron transfer to this solid mineral to reduce
        Fe (III) with an electron flux of about 1013 electrons /cm2/s
    - reference_id: PMID:16788180
      supporting_text: the OmcA-MtrC complex was observed to have enhanced Fe(III)-NTA
        reductase specific activity relative to either protein alone
    - reference_id: PMID:24747425
      supporting_text: forming a hydroxylated surface that would bring a heme 10 electron
        egress site to ∼10 Å of a mineral surface
- term:
    id: GO:0031240
    label: external side of cell outer membrane
  evidence_type: IDA
  original_reference_id: PMID:12904229
  qualifier: located_in
  review:
    summary: >-
      OmcA is a lipoprotein on the outer face of the outer membrane: it is degraded by
      proteinase K added to intact cells, labelled by cell-surface radioiodination, and
      released extracellularly in a type II secretion system-dependent way.
    action: NEW
    reason: >-
      GOA has no cellular-component row for this protein, and the surface orientation
      is what makes the rest of the biology possible: an acceptor like hematite or a
      chromate-bearing particle is never inside the cell. Three independent assays
      agree on the external side specifically, and the lipobox cysteine and lipid
      modification are recorded on Q8EG33. Immunolabel along outer-membrane extensions
      (PMID:25143589) is consistent corroboration.
    supported_by:
    - reference_id: PMID:12904229
      supporting_text: Immunofluorescence confirmed a prominent cell surface exposure of
        OmcA and a partial exposure of OmcB and the noncytochrome OM protein MtrB.
    - reference_id: PMID:15482439
      supporting_text: Both OmcA and OmcB are lipoproteins, and OmcA is cell surface exposed.
    - reference_id: PMID:18502849
      supporting_text: MtrC and OmcA are cell surface-exposed lipoproteins important for
        reducing solid metal oxides.
- term:
    id: GO:0019645
    label: anaerobic electron transport chain
  evidence_type: IMP
  original_reference_id: PMID:11133454
  qualifier: involved_in
  review:
    summary: >-
      OmcA acts at the terminal, extracellular end of the anaerobic respiratory chain
      of S. oneidensis: an omcA mutant reduces MnO2 45% more slowly than the parent
      while growing normally on soluble acceptors, and omcA deletion also slows Cr(VI)
      and U(VI) reduction.
    action: NEW
    reason: >-
      OmcA does part of the work of the process rather than merely being required for
      it: the purified protein itself carries out the terminal electron transfer onto
      Fe(III), Cr(VI) and mineral surfaces, so the perturbation phenotypes are read
      together with direct activity rather than on their own. The specificity of the
      omcA mutant phenotype is informative: growth on fumarate, nitrate, TMAO and
      thiosulfate and reduction of ferric citrate are unaffected, which places OmcA in
      the extracellular branch of the chain and not in the shared upstream segment. The
      comparator check supports the term: other terminal reductases of anaerobic
      respiratory chains, including E. coli NrfB in the same PANTHER family as these
      cytochromes, carry GO:0019645.
    supported_by:
    - reference_id: PMID:11133454
      supporting_text: OMCA1 and OMCB1 were 45 and 75% slower than MR-1, respectively,
        at reducing MnO(2)
    - reference_id: PMID:11133454
      supporting_text: The omcA mutant (OMCA1) resembled MR-1 in its growth on trimethylamine
        N-oxide (TMAO), dimethyl sulfoxide, nitrate, fumarate, thiosulfate, and tetrathionate
    - reference_id: PMID:21498755
      supporting_text: the deletion of omcA or both mtrC and omcA lowered the rate by 53.4%
        and 68.9%, respectively
references:
- id: PMID:15576789
  title: Transcriptomic and proteomic characterization of the Fur modulon in the metal-reducing
    bacterium Shewanella oneidensis.
  findings:
  - statement: >-
      omcA transcript and OmcA protein decrease in a fur deletion mutant, and a
      candidate Fur-binding site was predicted 43 bp upstream of omcA.
    supporting_text: The gene omcA (SO1779), which encodes a decaheme cytochrome c ,
      exhibited significant decreases in both mRNA and protein abundance in the fur
      mutant and possessed a strong candidate Fur-binding site in its upstream region
    reference_section_type: ABSTRACT
  - statement: >-
      The predicted Fur-binding motifs, including the one upstream of omcA, were not
      experimentally verified in this study.
    supporting_text: Future research will focus on experimentally verifying the functionality
      of predicted Fur-binding regulatory motifs
    reference_section_type: DISCUSSION
  - statement: >-
      omcA and omcB (SO1778, now MtrC) are down-regulated under both aerobic and
      anaerobic conditions in the fur mutant.
    supporting_text: omcA (SO1779; 5.9- and 4.8-fold), omcB (SO1778; 5.3- and 4-fold)
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC532403); the PMID resolves to the paper the GOA row cites.
      The issue is not the citation but what it supports: the experiments compare a fur
      mutant with wild type and predict a binding motif computationally, which is
      weaker than an iron-stimulus experiment. Recorded as a source defect on the
      annotation rather than as a reference problem.
- id: PMID:21498755
  title: Extracellular reduction of hexavalent chromium by cytochromes MtrC and OmcA
    of Shewanella oneidensis MR-1.
  findings:
  - statement: >-
      Purified OmcA reduces Cr(VI) with apparent kcat 10.2 per second and Km 41 uM,
      making it the faster of the two surface cytochromes on this substrate.
    supporting_text: purified MtrC and OmcA reduced Cr(VI) with apparent k(cat) values
      of 1.2 ± 0.2 (mean ± standard deviation) and 10.2 ± 1 s(-1)
    reference_section_type: ABSTRACT
  - statement: Deleting omcA lowers the whole-cell Cr(VI) reduction rate by 53.4%, and the double mutant by 68.9%.
    supporting_text: the deletion of omcA or both mtrC and omcA lowered the rate by 53.4%
      and 68.9%, respectively
    reference_section_type: ABSTRACT
  - statement: >-
      Without both cytochromes, Cr(III) precipitates are no longer formed outside the
      cell and are found in the cytoplasm instead.
    supporting_text: in mutant cells lacking both MtrC and OmcA, most Cr(III) precipitates
      were found inside the cytoplasm
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached entry is abstract-only, but the abstract states the kinetic constants, the
      mutant rates and the precipitate localization directly.
