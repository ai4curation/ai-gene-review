    supporting_text: purified MtrC and OmcA reduced Cr(VI) with apparent k(cat) values
      of 1.2 ± 0.2 (mean ± standard deviation) and 10.2 ± 1 s(-1)
  - reference_id: PMID:17061851
    supporting_text: The purified outer membrane bacterial protein OmcA binds densely
      to the surface of hematite (Fe2O3), permitting direct electron transfer to this
      solid mineral to reduce Fe (III)
  - reference_id: PMID:11133454
    supporting_text: OMCA1 and OMCB1 were 45 and 75% slower than MR-1, respectively, at
      reducing MnO(2)
- description: >-
    Outward electron carrier at the microbe-mineral interface. OmcA accepts electrons
    through its decaheme chain and passes them to acceptor surfaces and, in complex
    with MtrC, exchanges electrons with that partner; the crystal structure places the
    egress heme about 10 A from a bound mineral surface, which is the distance such
    transfer requires.
