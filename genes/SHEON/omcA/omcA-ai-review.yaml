  - reference_id: PMID:16788180
    supporting_text: the OmcA-MtrC complex was observed to have enhanced Fe(III)-NTA
      reductase specific activity relative to either protein alone
suggested_questions:
- question: >-
    Does OmcA receive its electrons from MtrC, from MtrA or MtrB directly, or from
    another conduit, given that it is not a stoichiometric subunit of the MtrCAB
    complex yet depends on that pathway in vivo?
- question: >-
    Is OmcA's advantage on Cr(VI) in vitro reflected in vivo, and what structural
    feature of the heme chain or substrate-binding surface accounts for the
    ten-fold difference in kcat relative to MtrC?
- question: >-
    Is omcA genuinely part of an iron-responsive regulon, and does the predicted Fur
    site upstream of the gene bind Fur and drive the expression change seen in the fur
    mutant?
suggested_experiments:
- experiment_type: regulatory assay
  description: >-
    Test the predicted Fur site upstream of omcA directly: electrophoretic mobility
    shift or DNA footprinting with purified Fur, plus a reporter fusion measured across
    a range of iron concentrations in wild type and a fur mutant. This would settle
    whether the existing cellular response to iron ion annotation can be grounded in an
    iron stimulus rather than in a fur deletion.
- experiment_type: single-cell mineral reduction
  description: >-
    Compare Cr(VI), U(VI) and Fe(III)-oxide reduction by the single omcA and mtrC
    mutants and the double mutant under identical anaerobic conditions with the same
    acceptor loading, to separate the contributions of the two surface cytochromes with
    one method rather than across papers.
