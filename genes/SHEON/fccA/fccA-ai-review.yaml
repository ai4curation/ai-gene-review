- id: PMID:19837833
  title: Periplasmic electron transfer via the c-type cytochromes MtrA and FccA of
    Shewanella oneidensis MR-1.
  findings:
  - statement: FccA is abundant in the periplasm of ferric citrate-reducing cells and is
      reduced by the inner-membrane cytochrome CymA in vitro.
    supporting_text: Both proteins are abundant in the periplasm of ferric
      citrate-reducing S. oneidensis cells.
  - statement: Electrons move in both directions between FccA and MtrA, so FccA can serve
      the route to mineral-phase Fe(III) as well as fumarate reduction.
    supporting_text: Hence, FccA could function in both the electron transport to
      fumarate and via MtrA to mineral-phase Fe(III).
  - statement: The deletion mutant's growth behaviour suggests FccA holds electrons
      transiently.
    supporting_text: Growth experiments with a DeltafccA deletion mutant suggest a role
      of FccA as a transient electron storage protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Appl Environ Microbiol 2009, PMC2794085); the source of
      the EXP periplasm annotation and of the hub/storage roles. Cached entry is
      abstract-only.
