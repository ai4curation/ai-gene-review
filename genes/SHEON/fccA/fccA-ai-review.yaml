- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:10581551
  qualifier: enables
  review:
    summary: >-
      The crystal structures resolve four covalently attached c-type hemes in the
      N-terminal cytochrome domain, which form the electron entry path to the flavin.
      No heme-binding annotation exists in GOA for this protein.
    action: NEW
    reason: >-
      Heme binding is not an inference from family membership here: the hemes were
      modelled in the 2.5-2.9 A structures of the enzyme with its substrate and product,
      UniProt lists the individual axial and covalent heme-binding residues as
      FT BINDING features with ECO:0000269|PubMed:10581551 and ECO:0007744 PDB evidence,
      and the COFACTOR block records four heme c per monomer. The hemes are what the
      protein uses to accept electrons from CymA, so the binding is directly part of the
      characterised mechanism.
    supported_by:
    - reference_id: PMID:10581551
      supporting_text: The soluble fumarate reductase of Shewanella putrefaciens MR-1 is
        a periplasmic tetraheme flavocytochrome c.
    - reference_id: file:SHEON/fccA/fccA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 4 heme c groups covalently per monomer.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IDA
  original_reference_id: PMID:19837833
  qualifier: enables
  review:
    summary: >-
      Beyond terminal fumarate reduction, purified FccA accepts electrons from CymA and
      exchanges them bidirectionally with MtrA in vitro, acting as a periplasmic
      electron carrier in the route to extracellular acceptors.
    action: NEW
    reason: >-
      This is a distinct activity from the catalytic reduction of fumarate, and it is
      shown directly rather than inferred: in vitro, CymA reduces both FccA and MtrA, and
      electrons move in both directions between FccA and MtrA. NMR mapping of the complexes
      shows FccA engaging CymA and MtrA through a single surface heme, the hallmark of a
      transient electron-transfer partner rather than a stable complex, and FccA and the
      small tetraheme cytochrome STC are functionally redundant carriers in this network,
      with phenotypes appearing only in the double mutant. The gene product itself carries
      the electrons, so it performs the work of the activity.
    supported_by:
    - reference_id: PMID:19837833
      supporting_text: Further experiments showing a bidirectional electron transfer
        between FccA and MtrA provided evidence for an electron transfer network in the
        periplasmic space of S. oneidensis.
    - reference_id: PMID:23067389
      supporting_text: both STC (small tetrahaem cytochrome c) and FccA (flavocytochrome
        c) interact with their redox partners, CymA and MtrA, through a single haem
    - reference_id: PMID:25635641
      supporting_text: Double deletion mutants showed either delayed growth or no growth
        with ferric iron, nitrate, dimethyl sulfoxide or fumarate as electron acceptor.
- term:
    id: GO:0009061
    label: anaerobic respiration
  evidence_type: IC
  original_reference_id: PMID:31175188
  qualifier: involved_in
  review:
    summary: >-
      FccA is the terminal reductase of fumarate respiration: it performs the final
      electron-accepting step of an anaerobic respiratory chain that runs from the
      menaquinol pool through CymA to FccA.
    action: NEW
    reason: >-
      The participation test is met directly, because the gene product catalyses the
      terminal step of the process rather than being required for or consumed by it. The
      chain is established on both sides: CymA reduces purified FccA and the soluble CymA
      derivative complements the fumarate-respiration defect of a cymA mutant, and loss of
      periplasmic FAD loading, which strips FccA of its cofactor, costs 80-90% of cellular
      fumarate reductase activity and slows growth on fumarate. The inference recorded
      here is the combination of the characterised enzymology with those physiological
      data, hence IC. The term is kept at anaerobic respiration because GO has no child
      term for fumarate respiration.
    supported_by:
    - reference_id: PMID:31175188
      supporting_text: uses a periplasmic flavocytochrome, FccA, both as a terminal
        fumarate reductase and as a periplasmic electron transfer hub for extracellular
        respiration of a variety of substrates
    - reference_id: PMID:31175188
      supporting_text: deletion of the inner membrane flavin adenine dinucleotide (FAD)
        exporter Bfe results in a 23% slower growth rate than that of the wild type during
        fumarate respiration and an 80 to 90% loss in fumarate reductase activity
    - reference_id: PMID:12899636
      supporting_text: We show here, by direct measurements of electron transfer between
        the purified proteins, that CymA(sol) efficiently reduces S. oneidensis fumarate
        reductase.
core_functions:
- description: >-
    Terminal fumarate reductase of the periplasm: accepts electrons at its four covalently
    bound c-type hemes, relays them through the non-covalently bound FAD, and uses them to
    reduce fumarate bound at the flavin to succinate (EC 1.3.2.4). The capping domain
    closes over the substrate site, and because all redox centres are in van der Waals
    contact the enzyme needs no additional carrier between heme and substrate.
  proposed_molecular_function: fumarate reductase (cytochrome) activity
  directly_involved_in:
  - id: GO:0009061
    label: anaerobic respiration
  locations:
  - id: GO:0042597
    label: periplasmic space
  supported_by:
  - reference_id: PMID:10581551
    supporting_text: In flavocytochrome c fumarate reductase, all redox centers are in
      van der Waals contact with one another, thus providing an efficient conduit of
      electrons from the hemes via the FAD to fumarate.
  - reference_id: PMID:31175188
    supporting_text: uses a periplasmic flavocytochrome, FccA, both as a terminal
      fumarate reductase and as a periplasmic electron transfer hub for extracellular
      respiration of a variety of substrates
- description: >-
    Periplasmic electron-transfer hub. Reduced by the inner-membrane menaquinol
    dehydrogenase CymA, with which it forms a 1:1 complex that biases CymA toward
    menaquinol oxidation, and exchanging electrons bidirectionally with the decaheme
    cytochrome MtrA, so that electrons can continue to the MtrCAB outer-membrane module
    and extracellular acceptors. The interactions are transient and made through a single
    surface heme, and the protein's large heme pool appears to act as a short-term
    electron store.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  locations:
  - id: GO:0042597
    label: periplasmic space
  supported_by:
  - reference_id: PMID:19837833
    supporting_text: Further experiments showing a bidirectional electron transfer
      between FccA and MtrA provided evidence for an electron transfer network in the
      periplasmic space of S. oneidensis.
  - reference_id: PMID:23799249
    supporting_text: CymA alone could only reduce MQ-7, while the CymA-Fcc3 complex
      catalyzed the reaction required to support anaerobic respiration, the oxidation
      of MQ-7
  - reference_id: PMID:23067389
    supporting_text: both STC (small tetrahaem cytochrome c) and FccA (flavocytochrome
      c) interact with their redox partners, CymA and MtrA, through a single haem
- description: >-
    Binds one FAD non-covalently in the C-terminal flavoprotein domain and four heme c
    groups covalently in the N-terminal tetraheme cytochrome domain; both cofactor sets
    are required for the electron conduit, and periplasmic FAD loading limits how much
    active enzyme the cell has.
  molecular_function:
