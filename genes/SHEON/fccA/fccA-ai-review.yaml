  - reference_id: file:SHEON/fccA/fccA-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: Note=Binds 4 heme c groups covalently per monomer.
proposed_new_terms:
- proposed_name: fumarate reductase (cytochrome) activity
  proposed_definition: >-
    Catalysis of the reaction: 2 Fe(II)-[cytochrome c] + fumarate + 2 H(+) = 2
    Fe(III)-[cytochrome c] + succinate. Corresponds to EC 1.3.2.4 and is carried out by
    the periplasmic flavocytochrome c fumarate reductases of Shewanella and related
    bacteria, in which c-type hemes within the same polypeptide deliver the electrons to
    a flavin that reduces fumarate.
  proposed_parent:
    id: GO:0016632
    label: oxidoreductase activity, acting on the CH-CH group of donors, cytochrome as
      acceptor
  justification: >-
    GO has terms for the NAD-linked (GO:0016156) and quinone-linked (GO:0008177)
    fumarate reductase/succinate dehydrogenase reactions, but none for the
    cytochrome-linked reaction of EC 1.3.2.4, so the best available term for the
    characterised activity of FccA and its orthologues is the unspecific
    GO:0016632. The reaction is standing EC chemistry with a RHEA entry
    (RHEA:77903) recorded by UniProt from experimental evidence, and it applies to a
    recognisable protein family (InterPro IPR010960, NCBIfam TIGR01813).
  supported_by:
  - reference_id: PMID:10581551
    supporting_text: In flavocytochrome c fumarate reductase, all redox centers are in
      van der Waals contact with one another, thus providing an efficient conduit of
      electrons from the hemes via the FAD to fumarate.
  - reference_id: file:SHEON/fccA/fccA-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: "Note=Binds 1 FAD per subunit."
suggested_questions:
- question: >-
    Does purified FccA reduce selenite directly, and if so with what kinetics relative to
    fumarate? The in vivo genetics and the competition with added fumarate point at the
    enzyme's active site, but no purified-protein selenite assay has been reported.
  experts:
  - Han-Qing Yu
  - Julea Butt
- question: >-
    Can the InterPro2GO mapping of IPR010960 (Flavocytochrome c) be changed from
    GO:0010181 FMN binding to GO:0071949 FAD binding, which is the flavin the
    characterised members of the family bind?
- question: >-
    How much of the cell's periplasmic electron pool is actually held on FccA hemes under
    acceptor limitation, and is the storage role physiologically distinguishable from
    FccA simply being abundant?
  experts:
  - Johannes Gescher
  - Ricardo O. Louro
suggested_experiments:
- hypothesis: >-
    FccA reduces selenite at its flavin site, making it a genuine selenite reductase
    rather than only an upstream requirement for periplasmic selenite reduction.
  description: >-
    Assay purified FccA anaerobically with a defined reductant (reduced CymA or a
    low-potential mediator) and selenite, following selenite consumption and Se(0)
    formation, and compare with fumarate as the acceptor in the same assay; test an
    active-site variant (for example the proton-donor residue at position 426) for loss
    of selenite but retention of heme reduction.
  experiment_type: in vitro enzymology with purified protein and site-directed variants
- hypothesis: >-
    Complementation restores selenite reduction in the fccA deletion, excluding
    polar/secondary effects of the deletion in non-growing cells.
  description: >-
    Express fccA in trans in the deletion background and repeat the non-growing-cell
    selenite reduction kinetics, including a catalytically dead variant as a control for
    whether the phenotype needs the enzyme's activity rather than just the protein.
  experiment_type: genetic complementation plus whole-cell reduction kinetics
- hypothesis: >-
    The FccA heme pool acts as a transient electron sink that buffers catabolism when no
    terminal acceptor is present.
  description: >-
    Follow heme redox state spectroscopically in whole cells and in periplasmic fractions
    of wild type, the fccA deletion and the fccA/cctA double deletion during an
    acceptor-free lactate pulse followed by acceptor addition, and quantify the electron
    equivalents released on reoxidation.
  experiment_type: whole-cell and fraction UV-visible spectroscopy of cytochrome redox
    poise
