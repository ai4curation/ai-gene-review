    record_section: ["CC:COFACTOR"]
    supporting_text: "Note=Binds 1 FAD per subunit."
  - reference_id: PMID:31175188
    supporting_text: deletion of the inner membrane flavin adenine dinucleotide (FAD)
      exporter Bfe results in a 23% slower growth rate than that of the wild type during
      fumarate respiration and an 80 to 90% loss in fumarate reductase activity
- description: >-
    Holds four covalently attached c-type hemes that form the electron entry path from
    CymA to the flavin and the surface used for transient interaction with partner
    cytochromes.
  molecular_function:
    id: GO:0020037
    label: heme binding
  supported_by:
