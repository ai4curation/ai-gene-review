- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010960
  review:
    summary: >-
      True but uninformative: the characterised activity is reduction of fumarate to
      succinate with the protein's own c-type hemes as the electron entry point
      (EC 1.3.2.4). The row should be refined to the CH-CH donor / cytochrome acceptor
      class.
    action: MODIFY
    reason: >-
      The family signature supports an oxidoreductase, and that much is right, but the
      evidence available for this protein is far more specific. The structures show
      fumarate and succinate bound at the flavin with the four hemes, FAD and substrate
      all in van der Waals contact, and UniProt records the reaction 2 Fe(III)-[cytochrome
      c] + succinate = fumarate + 2 Fe(II)-[cytochrome c] + 2 H(+) (EC 1.3.2.4) with
      experimental evidence. GO has no term for EC 1.3.2.4, so the most specific existing
      term that is fully supported is GO:0016632, oxidoreductase activity acting on the
      CH-CH group of donors with cytochrome as acceptor, which is a descendant of the
      annotated term; a new child term for the fumarate reductase (cytochrome) reaction is
      proposed separately.
