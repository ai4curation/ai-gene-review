      putrefaciens MR-1" is the strain now named S. oneidensis MR-1, so this is the same
      protein. Cached entry is abstract-only.
- id: PMID:12899636
  title: The tetraheme cytochrome CymA is required for anaerobic respiration with dimethyl
    sulfoxide and nitrite in Shewanella oneidensis.
  findings:
  - statement: Purified soluble CymA reduces S. oneidensis fumarate reductase directly, so
      no further protein is needed between the quinone pool and fumarate.
    supporting_text: We show here, by direct measurements of electron transfer between the
      purified proteins, that CymA(sol) efficiently reduces S. oneidensis fumarate
      reductase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Biochemistry 2003). The paper is framed around CymA but
      its electron-transfer measurements are to FccA. Cached entry is abstract-only.
- id: PMID:12196158
  title: The membrane-bound tetrahaem c-type cytochrome CymA interacts directly with the
    soluble fumarate reductase in Shewanella.
  findings:
  - statement: Truncated soluble CymA is an efficient electron donor for the soluble
      fumarate reductase flavocytochrome c3.
    supporting_text: Potentiometric studies suggest that there are two pairs of haems with
      potentials of -175 and -261 mV and that 'CymA is an efficient electron donor for the
      soluble fumarate reductase, flavocytochrome c(3).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Biochem Soc Trans 2002); cited by UniProt for the
      CymA-FccA electron transfer. Cached entry is abstract-only.
- id: PMID:22458729
  title: A functional description of CymA, an electron-transfer hub supporting anaerobic
    respiratory flexibility in Shewanella.
  findings:
  - statement: Reduced CymA forms a 1:1 complex with flavocytochrome c3 fumarate
      reductase.
    supporting_text: Spectroscopic studies suggest that CymA requires a non-haem co-factor
      for quinol oxidation and that the reduced enzyme forms a 1:1 complex with its redox
      partner Fcc3 (flavocytochrome c3 fumarate reductase).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Biochem J 2012); UniProt's ECO:0000269 source for the
      EC 1.3.2.4 catalytic-activity line. Cached entry is abstract-only.
- id: PMID:23799249
  title: Protein-protein interaction regulates the direction of catalysis and electron
    transfer in a redox enzyme complex.
  findings:
  - statement: Complex formation with FccA switches CymA from quinone reduction to the
      menaquinol oxidation that anaerobic respiration needs.
    supporting_text: Cyclic voltammetry revealed that CymA alone could only reduce MQ-7,
      while the CymA-Fcc3 complex catalyzed the reaction required to support anaerobic
      respiration, the oxidation of MQ-7.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Am Chem Soc 2013, PMC3823026); full text cached.
- id: PMID:23067389
  title: 'Mind the gap: cytochrome interactions reveal electron pathways across the
    periplasm of Shewanella oneidensis MR-1.'
  findings:
  - statement: FccA engages both CymA and MtrA through a single heme, forming transient
      rather than stable redox complexes.
    supporting_text: The results showed that both STC (small tetrahaem cytochrome c) and
      FccA (flavocytochrome c) interact with their redox partners, CymA and MtrA, through
      a single haem, avoiding the establishment of stable redox complexes capable of
      spanning the periplasmic space.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Biochem J 2013; an erratum is noted in Biochem J
      451:343). Cached entry is abstract-only.
- id: PMID:26175726
  title: Characterization of the periplasmic redox network that sustains the versatile
    anaerobic metabolism of Shewanella oneidensis MR-1.
  findings:
  - statement: FccA and STC compete for the same site on MtrA, but FccA does not interact
      with the MtrA homologue MtrD or with DmsE, so the redundancy is limited to the
      MtrCAB-OmcA route.
    supporting_text: Indeed, neither STC nor FccA interact with MtrD, the best replacement
      for MtrA, and only STC is able to interact with the decaheme cytochrome DmsE of the
      outer-membrane complex DmsEFABGH.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Front Microbiol 2015, PMC4484225); full text cached.
- id: PMID:25635641
  title: A dynamic periplasmic electron transfer network enables respiratory flexibility
    beyond a thermodynamic regulatory regime.
  findings:
  - statement: FccA and STC are overlapping periplasmic carriers; single mutants are
      nearly normal while the double mutant fails on several acceptors.
    supporting_text: Double deletion mutants showed either delayed growth or no growth
      with ferric iron, nitrate, dimethyl sulfoxide or fumarate as electron acceptor.
  - statement: Loss of both carriers is what limits electron transport, consistent with
      functional redundancy.
    supporting_text: Single mutants of either of these two cytochromes show only minor
      phenotypic changes, if at all.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (ISME J 2015, PMC4511935); full text cached.
- id: PMID:31175188
  title: 'Secreted Flavin Cofactors for Anaerobic Respiration of Fumarate and Urocanate by
    Shewanella oneidensis: Cost and Role.'
  findings:
  - statement: FccA serves both as the terminal fumarate reductase and as a periplasmic
      electron-transfer hub for extracellular respiration.
    supporting_text: uses a periplasmic flavocytochrome, FccA, both as a terminal fumarate
      reductase and as a periplasmic electron transfer hub for extracellular respiration
      of a variety of substrates
  - statement: Periplasmic FAD supply, via the inner-membrane exporter Bfe, limits
      cellular fumarate reductase activity.
    supporting_text: We demonstrate that deletion of the inner membrane flavin adenine
      dinucleotide (FAD) exporter Bfe results in a 23% slower growth rate than that of the
      wild type during fumarate respiration and an 80 to 90% loss in fumarate reductase
      activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Appl Environ Microbiol 2019). Cached entry is
      abstract-only.
- id: PMID:24435070
  title: Selenite reduction by Shewanella oneidensis MR-1 is mediated by fumarate reductase
    in periplasm.
  findings:
  - statement: Deleting fccA suppresses most of the early selenite reduction by
      non-growing cells, while nitrate- and nitrite-reductase mutants behave like wild
      type.
    supporting_text: Conversely, selenite reduction by ΔfccA was severely suppressed, with
      a 60% decrease in the reduction rate within the initial 12 h
    finding_review:
      finding_status: CURRENT
      review_notes: The measured defect is a rate reduction in a single deletion-mutant
        experiment without complementation, so it establishes a requirement rather than
        direct selenite-reductase catalysis by FccA.
  - statement: Added fumarate competes with selenite in wild-type cells, pointing at FccA
      itself as the site of reduction.
    supporting_text: Dosing of fumarate to the wild-type strain led to a significantly
      weakened selenite reduction, suggesting a competition between fumarate and selenite
      for FccA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Sci Rep 2014, PMC3894562); full text cached. The claim
      that FccA is "the terminal reductase of selenite" rests on mutant kinetics plus
      substrate competition; no purified-enzyme selenite assay is reported.
