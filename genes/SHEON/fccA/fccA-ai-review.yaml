id: P83223
gene_symbol: fccA
product_type: PROTEIN
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  FccA (flavocytochrome c3, SO_0970) is a soluble periplasmic flavocytochrome of
  Shewanella oneidensis MR-1 and the organism's terminal fumarate reductase. It is
  exported with a cleavable signal peptide and matures into a monomer carrying four
  covalently bound heme c groups in an N-terminal tetraheme cytochrome domain and one
  non-covalently bound FAD in a C-terminal flavoprotein domain related to succinate
  dehydrogenase/fumarate reductase flavoproteins, with a mobile capping domain over the
  active site. All redox centres lie in van der Waals contact, so electrons delivered to
  the hemes pass through the FAD to fumarate bound at the flavin, reducing it to
  succinate. Electrons reach FccA from the inner-membrane tetraheme menaquinol
  dehydrogenase CymA, and complex formation with FccA is what allows CymA to run in the
  menaquinol-oxidising direction. Besides terminal fumarate reduction, FccA is one of the
  two most abundant periplasmic cytochromes in anaerobic cells (with the small tetraheme
  cytochrome STC) and acts as a periplasmic electron-transfer hub: it exchanges electrons
  bidirectionally with the decaheme cytochrome MtrA of the MtrCAB outer-membrane module,
  providing a route to extracellular metal oxides, and its large heme pool appears to act
  as a transient electron store. FccA is also required for most of the early reduction of
  selenite to insoluble Se(0) by non-growing cells, a reaction that competes with fumarate
  for the enzyme.
