  review:
    summary: >-
      PANTHER node PTN000180369 (PTHR43400) carries a cytoplasm IBD seeded by soluble
      fumarate reductases of fungi and archaea, which are indeed intracellular. FccA is
      a Sec-exported periplasmic protein in a Gram-negative bacterium and is
      experimentally located in the periplasm, so the compartment assertion does not
      transfer to this descendant.
    action: REMOVE
    reason: >-
      The IBD at PTN000180369 is a reasonable reading of its seed set (two yeast soluble
      fumarate reductase genes and three archaeal/other proteins, all cytoplasmic), but
      the clade it covers includes bacterial flavocytochromes that are secreted across
      the inner membrane. P83223 carries a cleavable N-terminal signal peptide
      (FT SIGNAL 1..25; the mature chain is 26..596) and its hemes are attached by the
      periplasmic cytochrome c maturation system, so the mature protein cannot be
      cytoplasmic; UniProt records Periplasm as the experimentally supported location
      (ECO:0000269|PubMed:19837833), and the protein is purified from the periplasm of
      anaerobically grown cells. This is a compartment mismatch introduced by descent
      from a node whose seeds are all intracellular enzymes, not a defect in the node's
      own placement, so the target row should go rather than the node being rejected.
    supported_by:
    - reference_id: PMID:19837833
      supporting_text: Both proteins are abundant in the periplasm of ferric
        citrate-reducing S. oneidensis cells.
