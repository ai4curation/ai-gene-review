  review:
    summary: >-
      InterPro maps IPR024717, whose name is "Denitrification system component
      NapC/NirT/NrfH", to the denitrification pathway, and GOA applies it to every member
      of the signature including CymA. S. oneidensis does not denitrify.
    action: REMOVE
    reason: >-
      GO:0019333 is defined as reduction of nitrate to dinitrogen through nitrite, nitric
      oxide and nitrous oxide. S. oneidensis instead performs respiratory ammonification:
      nitrate is reduced to nitrite by NapA and nitrite to ammonium by NrfA. CymA is
      genuinely the quinol dehydrogenase for both steps that do occur, which is why the row
      looks plausible, but the pathway named is not the one it serves. This is a
      demonstrably wrong electronic mapping rather than a judgement call about an
      experimental annotation, so REMOVE applies. The underlying
      interpro2go line is the real defect: the family also contains NrfH, the quinol
      dehydrogenase of the ammonium-forming nitrite reductase complex, so the mapping is
      wrong for a whole branch of the family and not only for this protein.
