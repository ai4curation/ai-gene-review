id: Q8E8S0
gene_symbol: cymA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  CymA (SO_4591) is a 187-residue tetraheme c-type cytochrome of the NapC/NirT/NrfH
  family and the central quinol dehydrogenase of anaerobic respiration in Shewanella
  oneidensis MR-1. A single N-terminal transmembrane helix anchors it in the inner
  membrane with its four-heme catalytic domain in the periplasm, where three low-spin
  His/His hemes and one high-spin His/water heme lie next to the quinol-binding site.
  CymA oxidizes menaquinol and passes the electrons to periplasmic and outer-membrane
  acceptors: the flavocytochrome c3 fumarate reductase FccA, the small tetraheme
  cytochrome STC, the decaheme cytochrome MtrA of the MtrCAB conduit that reduces
  extracellular minerals, the periplasmic nitrate reductase NapA (through NapB), the
  nitrite reductase NrfA, and the DMSO reductase system. Menaquinone-7 is both its
  substrate and a required cofactor for turnover. Because one enzyme feeds all of these
  branches, deleting cymA abolishes reduction of Fe(III), Mn(IV), nitrate, nitrite,
  DMSO, V(V) and fumarate while leaving respiration on oxygen and TMAO intact, which
  makes CymA the shared entry point of the respiratory network that underlies
  Shewanella's dissimilatory metal reduction.
