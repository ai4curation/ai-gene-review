core_functions:
- description: >-
    Menaquinol dehydrogenase of the inner membrane. CymA oxidizes menaquinol at a site next
    to its high-spin heme and passes the electrons through its three low-spin hemes to
    periplasmic c-type cytochrome acceptors, measured directly with flavocytochrome c3
    fumarate reductase and with the decaheme MtrA. Menaquinone-7 is both its substrate and a
    bound cofactor, and the catalytic domain faces the periplasm where its partners are.
    This single activity serves every anaerobic branch except TMAO: the electrons leaving
    CymA reach FccA, the small tetraheme shuttle STC, the MtrCAB conduit that reduces
    extracellular Fe(III) and Mn(IV) minerals, the periplasmic nitrate reductase through
    NapB, the nitrite reductase NrfA and the DMSO reductase system, which is why deleting
    cymA abolishes Fe(III), Mn(IV), nitrate, nitrite, DMSO, V(V) and fumarate respiration
    while respiration on oxygen and TMAO continues.
