        InterPro's interpro2go file maps IPR024717 (NapC/NirT/NrfH) to GO:0019333
        denitrification pathway, which GOA applies as an IEA (GO_REF:0000002) to every
        member of the signature. The signature is a family of membrane-anchored multiheme
        quinol dehydrogenases that feed periplasmic reductases, and its members serve
