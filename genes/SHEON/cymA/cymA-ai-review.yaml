- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008121
  review:
    summary: >-
      Inter-ontology inference from GO:0008121, which sits under proton transmembrane
      transporter activity because the archetypal quinol-cytochrome-c reductase is the
      proton-translocating cytochrome bc1 complex. CymA has neither a proton channel nor a
      Q-cycle, and its curated reaction is written without a translocation term.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The quinol-cytochrome-c reductase term carries proton-transporter parents from the bc1
      Q-cycle, in which quinol oxidation at one side of the membrane is coupled to quinone
      reduction at the other through a dedicated proton path. CymA has neither a proton
      channel nor a Q-cycle: it is a single-pass protein with one N-terminal helix and its
      entire catalytic domain in the periplasm, and it oxidises menaquinol at a single
      periplasmic site. UniProt and Rhea model this entry's reaction accordingly: the curated
      CATALYTIC ACTIVITY statement (RHEA:11484) writes a quinol plus two Fe(III)-cytochrome c
      (out) going to a quinone, two Fe(II)-cytochrome c (out) and two H(+)(out), with H(+)
      appearing only as an (out) product and no H(+)(in) term at all, i.e. as a
      non-translocating reaction. That does not mean no proton crosses the membrane in this
      respiratory chain. Net H+ translocation in menaquinol-dependent respiration is a
      property of the redox loop as a whole: the cytoplasm-facing dehydrogenases (Nuo, Fdh,
      hydrogenase) take up protons from the cytoplasm to reduce menaquinone, those protons
      ride across on the menaquinol, and CymA performs the periplasmic release half-reaction.
      CymA therefore does share in the loop's vectorial chemistry rather than being irrelevant
      to it, but a protein-level involved_in proton transmembrane transport over-reads the
      bc1-derived parentage: it attributes to one half-reaction, catalysed entirely on the
      periplasmic face and modelled by UniProt/Rhea without a translocation term, a
      transport process that only the loop as a whole carries out. The row is marked over-annotated
      rather than removed because it is a mechanical consequence of a term the protein
      legitimately carries, and the fix belongs upstream in the inference rather than in this
      gene's annotation set.
    supported_by:
    - reference_id: file:SHEON/cymA/cymA-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "+ 2 H(+)(out); Xref=Rhea:RHEA:11484"
    - reference_id: PMID:22393052
      supporting_text: CymA is a monotopic membrane tetraheme c-type cytochrome belonging to
        the NapC/NirT family and central to anaerobic respiration in Shewanella sp.
    - reference_id: PMID:12899636
      supporting_text: It is located in the cytoplasmic membrane where the bulk of the protein
        is exposed to the periplasm, enabling it to transfer electrons to a series of redox
        partners.
- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IDA
  original_reference_id: PMID:22393052
  qualifier: enables
  review:
    summary: >-
      Protein-film electrochemistry of CymA shows a co-purifying quinone that can be stripped
      from the film and must be restored for turnover: menaquinone-7 is both the substrate
      and a bound cofactor of the enzyme.
    action: NEW
    reason: >-
      Quinone binding is a cofactor-binding molecular function demonstrated directly on this
      protein, and GOA has no row for it. The experiment is a clean gain-and-loss: removing
      the co-purified quinones leaves an apo film that is inactive yet structurally intact,
      and activity returns when MQ-7 is added back, which is what distinguishes a bound
      cofactor from a passing substrate. It is also independently located: HQNO, a menaquinol
      analogue, binds next to the high-spin heme and identifies the quinol site
      (PMID:22458729). The term is kept at quinone binding rather than a menaquinone-specific
      child, since GO has no menaquinone-binding term. This is a binding function and is
      neither an ancestor nor a descendant of GO:0008121 or GO:0020037.
    supported_by:
    - reference_id: PMID:22393052
      supporting_text: vesicle-bound menaquinone-7 is not only a substrate for this enzyme but
        is also required as a cofactor when converting other quinones
    - reference_id: PMID:22393052
      supporting_text: Here, removing the co-purified quinones does not perturb the structure
        of CymA, as activity is restored upon the addition of MQ-7.
    - reference_id: PMID:22458729
      supporting_text: binding of the menaquinol analogue, 2-heptyl-4-hydroxyquinoline-N-oxide,
        does not alter the mid-point potentials
