  review:
    summary: >-
      CymA is anchored by one N-terminal helix with its tetraheme catalytic domain facing the
      periplasm, which is the side its acceptors are on.
    action: NEW
    reason: >-
      The gene has membrane rows but no sub-membrane orientation row, and the orientation is
      what the biology turns on: every demonstrated acceptor of CymA (FccA, STC, MtrA, NapB,
      NrfA) is a periplasmic or periplasm-facing protein, so a cytoplasm-facing heme domain
      could not do the job. Two independent lines agree, which is the bar for adding an
      orientation term as an inference. First, topology: a single transmembrane helix at
      residues 13-33 with residues 34-187 periplasmic, and a soluble construct lacking only
      that anchor retains full activity and complements the deletion, showing the catalytic
      domain is an independent periplasmic module. Second, function: electron transfer to
      purified periplasmic cytochromes is measured directly. Asserted as IC, an inference
      drawn here from the topology and the partner set rather than from a single assay, and
      added beside the plasma membrane rows rather than replacing them.
    supported_by:
    - reference_id: PMID:12899636
      supporting_text: It is located in the cytoplasmic membrane where the bulk of the protein
        is exposed to the periplasm, enabling it to transfer electrons to a series of redox
        partners.
    - reference_id: PMID:12196158
      supporting_text: The 21 kDa c-type cytochrome CymA of the freshwater strain Shewanella
        oneidensis MR-1 has an N-terminal membrane anchor and a globular tetrahaem periplasmic
        domain.
    - reference_id: file:SHEON/cymA/cymA-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Periplasmic side
