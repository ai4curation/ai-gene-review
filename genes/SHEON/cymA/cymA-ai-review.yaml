suggested_questions:
- question: >-
    Does CymA itself reduce metals at a physiologically meaningful rate, or only through its
    cytochrome partners? Heterologous expression makes E. coli reduce Fe(III)-NTA and the
    purified protein has ferric-reductase activity in vitro, yet in MR-1 the demonstrated
    acceptors are c-type cytochromes and the mineral chemistry happens at MtrC and OmcA.
- question: >-
    What is the non-heme cofactor that the spectroscopy implies is needed for quinol
    oxidation, and is it the same bound menaquinone-7 that the electrochemistry identifies, or
    a second species?
- question: >-
    How is the electron flux partitioned between the competing branches when several acceptors
    are present at once? CymA is the single entry point for fumarate, DMSO, nitrate, nitrite
    and the mineral-reducing conduit, and the partner-binding sites on CymA that set this are
    not mapped.
- question: >-
    Why does TMAO respiration not require CymA when the E. coli homologues that seed its
    PANTHER node, TorC and TorY, are exactly the TMAO-reductase quinol dehydrogenases? Does S.
    oneidensis use a distinct quinol dehydrogenase for its TorA-type system?
suggested_experiments:
- experiment_type: biochemical reconstitution
  description: >-
    Reconstitute purified full-length CymA into proteoliposomes with defined menaquinone-7
    content and measure proton uptake and release on both sides during turnover with a
    cytochrome acceptor, with and without a co-reconstituted menaquinone-reducing
    dehydrogenase. Because the readout is which face the protons appear on, the vesicle
    population has to be shown to be uniformly oriented before it is interpreted: assay
    the fraction with the heme domain exposed using an impermeant oxidant, or by protease
    protection, and either select for a single orientation or correct the measured
    stoichiometry for the mixed fraction, since a mixed population would make the two
    faces indistinguishable. With CymA alone the expectation from the curated reaction is
    release of the quinol-derived protons to the lumenal (periplasmic-equivalent) side
    with no compensating uptake from the other face; a stoichiometry of H+ translocated
    per electron
    above that would show a translocating mechanism in CymA itself, which is what the
    inter-ontology proton-transport annotation assumes from the term's bc1-derived parentage.
    Running the full loop alongside would separate CymA's release half-reaction from the
    loop's net translocation.
- experiment_type: competition kinetics
  description: >-
    Measure CymA-to-partner electron transfer with FccA, STC and MtrA present together at
    physiological ratios, in membranes rather than in solution, to determine how the branch
    point is partitioned and whether partner binding is competitive at one site.
- experiment_type: comparative mutant panel
  description: >-
    Reduce V(V), Cr(VI), U(VI) and selenite with one acceptor loading and one assay in the
    wild type and in cymA, mtrC, omcA and fccA deletion strains. The current picture is
    assembled from papers using different conditions, which is why several CMMMech records
    can only mark the cytochrome evidence as partial.
