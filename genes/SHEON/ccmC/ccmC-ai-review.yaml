core_functions:
- description: >-
    Heme-handling inner-membrane protein of System I cytochrome c biogenesis. CcmC
    binds heme at the conserved tryptophan-rich WWD domain in a periplasmic loop, with
    two external histidines as the axial ligands to the heme iron, and attaches that
    heme to the apo form of the membrane-tethered chaperone CcmE to make holoCcmE -
    the committed first step of c-type cytochrome maturation. Binding is mutual and
    heme-dependent: CcmC traps heme only when apoCcmE is present, and CcmE binds CcmC
    stably only when heme is present. Release of holoCcmE needs ATP hydrolysis by CcmA
    with CcmB, so in their absence the CcmC:heme:CcmE complex accumulates as a stable
    dead end. The mechanism is established in Escherichia coli, where the axial ligands
    are His60 and His184. The S. oneidensis protein carries that same heme-binding site
    in its own sequence: a pairwise alignment of Q8EK42 against E. coli P0ABM1 is
    gap-free from the N-terminus through residue 184 at 58.8% identity, and maps the
    two axial histidines onto His60 and His184 of Q8EK42 with the WWD motif intact as
    WWVWD at Q8EK42 122-126. The assignment therefore rests on conservation of the
    characterised site in this protein, not on family membership alone, and is
    corroborated by the mutant phenotype, where loss of ccmC leaves the cell with no
    functionally active c-type cytochromes. The heme-attachment chemistry itself has
    not been assayed for the S. oneidensis protein.
  molecular_function:
    id: GO:0020037
    label: heme binding
  directly_involved_in:
  - id: GO:0017004
    label: cytochrome complex assembly
  - id: GO:1903607
    label: cytochrome c biosynthetic process
  - id: GO:0015886
    label: heme transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:20599545
    supporting_text: >-
      We conclude that the WWD domain and the conserved tryptophans that define this
      superfamily directly interact with heme, forming the specific heme binding site.
  - reference_id: PMID:20599545
    supporting_text: >-
      CcmC is necessary to attach heme to apoCcmE; thus, it is sometimes referred to as
      the holoCcmE synthase.
  - reference_id: PMID:29518410
    supporting_text: >-
      We conclude that CcmC trafficks heme via its WWD domain and propose the structural
      basis for stereochemical attachment of heme.
  - reference_id: PMID:16824107
    supporting_text: >-
      In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable dead-end
      complex, indicating high affinity binding of haem to CcmC.
  - reference_id: PMID:16875436
    supporting_text: we evaluated a mutant lacking all functionally active c-type cytochromes
  - reference_id: file:SHEON/ccmC/ccmC-bioinformatics/RESULTS.md
    supporting_text: >-
      Both axial histidines are conserved and fall at the **same positions in Q8EK42**,
      His60 and His184.
  knowledge_gaps:
  - gap_statement: >-
      The route by which heme reaches the periplasmic WWD domain of CcmC is
      undetermined: it is not known whether heme is conducted through a path inside the
      six-helix bundle or enters the external site directly from the lipid bilayer.
    boundary: >-
      The destination is established - the WWD domain is the heme binding site, with two
      external histidines as axial ligands - and so is the handoff to apoCcmE. What is
      missing is the preceding step. No heme binding site was found within the
      membrane-spanning helices of CcmC, in contrast to the System II protein CcsBA,
      which has one, and the only conserved intramembrane residue (Tyr139) is
      dispensable for heme loading.
    gap_kind:
    - BIOLOGY
    significance: >-
      Whether CcmC is a heme conduit or only a periplasmic heme-presenting platform
      decides whether a heme transmembrane transporter activity may be annotated to it
      at all, and bears on how the cell avoids releasing free heme into the periplasm.
    resolution: >-
      Sidedness assays on heme loading of the WWD domain, for example crosslinking or
      spectroscopy in CcmC variants that block a candidate internal path, or
      reconstitution with heme supplied from only one side of the bilayer.
    provenance:
    - reference_id: PMID:20599545
      supporting_text: It is still unclear how heme travels to the CcmC WWD domain to
        interact with CcmE.
    - reference_id: PMID:29518410
      supporting_text: >-
        In System I, composed of eight integral membrane proteins (CcmA–H), the first
        step in biogenesis involves putative heme transport through CcmC via the CcmABCD
        complex
suggested_questions:
- question: >-
    Does the Shewanella oneidensis CcmC protein form the same CcmC:heme:CcmE complex as
    the E. coli protein, and does the unusually large multiheme cytochrome complement of
    this organism place the Ccm system under a heme-flux constraint that E. coli does not
    face?
  experts:
  - Kranz RG
  - Sutherland MC
- question: >-
    Is heme loading of the CcmC WWD domain vectorial - does heme arrive through the
    protein - or does CcmC simply present heme that has partitioned into the bilayer? The
    answer decides whether GO:0015232 heme transmembrane transporter activity is ever
    appropriate for this family.
  experts:
  - Kranz RG
  - Richard-Fogal C
- question: >-
    PseudoCAP annotates Pseudomonas aeruginosa ccmC with catalase activity and five
    motility and biosynthesis processes from a single reference. Are these the pleiotropic
    phenotypes of a cytochrome c maturation mutant, and is the reference the intended one?
  experts: []
- question: >-
    GO has no molecular function term for the activity that distinguishes CcmC, namely
    attachment of heme to the conserved histidine of apoCcmE to form holoCcmE - the step
    for which the field uses the informal name holoCcmE synthase. The available terms are
    GO:0020037 heme binding, which this review takes as the core function but which does
    not capture the attachment, and GO:0015232 heme transmembrane transporter activity,
    which this review marks over-annotated because the conduit role is unproven. Should a
    term for the heme-to-apoCcmE attachment activity be created, and if so is it a
    transferase, a lyase or a chaperone-like activity? The analogous question applies to
    CcmF and CcsA, which attach heme to apocytochrome c. Recorded here as an ontology gap
    rather than as a proposed term because the right parent, and therefore the right
    definition, cannot be settled without a decision on the reaction chemistry.
  experts:
  - Kranz RG
  - Sutherland MC
suggested_experiments:
- hypothesis: >-
    CcmC of S. oneidensis MR-1 binds heme at its WWD domain and transfers it to CcmE by
    the same mechanism established in E. coli.
  description: >-
    Express the MR-1 ccmC with a purification tag in a ccmAB-deleted background and
    attempt to trap and purify a CcmC:heme:CcmE complex, scoring the diagnostic split
    alpha absorption of the dithionite-reduced complex and the covalent attachment of
    heme to CcmE. Substitute the two external histidines and the WWD tryptophans of the
    MR-1 protein to test that the heme site is conserved.
  experiment_type: heterologous expression, affinity purification and UV/Vis spectroscopy
- hypothesis: >-
    Ccm-mediated heme attachment, not apocytochrome synthesis, limits the rate at which
    MR-1 builds its extracellular electron transfer machinery.
  description: >-
    Place ccmC under a titratable promoter in MR-1 and measure, across expression levels,
    the holo-cytochrome content by heme stain and the rate of extracellular metal
    reduction, to determine whether maturation capacity is rate-limiting rather than
    merely required.
  experiment_type: conditional expression with heme staining and metal reduction kinetics
- hypothesis: >-
    CcmC has no catalase activity.
  description: >-
    Assay purified CcmC, and membranes from a ccmC-complemented strain, for hydrogen
    peroxide dismutation, as a direct falsification of the propagated GO:0004096
    annotation. A negative result with an appropriate positive control would support
    retraction of the PAINT IBD rather than leaving the inference to argument from fold.
  experiment_type: in vitro catalase assay
