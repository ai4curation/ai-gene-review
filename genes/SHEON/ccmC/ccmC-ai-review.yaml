  title: CcmC heme-binding site conservation in Q8EK42 versus E. coli P0ABM1
  findings:
  - statement: >-
      A global pairwise alignment of Q8EK42 against E. coli P0ABM1, computed in this
      repository, maps the two characterised axial histidines of E. coli CcmC onto
      His60 and His184 of Q8EK42 and finds the WWD motif intact at Q8EK42 122-126.
    supporting_text: >-
      Both axial histidines are conserved and fall at the **same positions in Q8EK42**,
      His60 and His184.
  - statement: >-
      The mapping is unambiguous because the alignment is gap-free from the N-terminus
      through residue 184 at 58.8% identity.
    supporting_text: >-
      The two proteins are 58.8% identical over the aligned length, and the alignment is
      ungapped from the N-terminus through residue 184
  - statement: >-
      The alignment is sequence-level evidence only; it does not demonstrate heme
      binding by Q8EK42 experimentally.
    supporting_text: >-
      It does **not** demonstrate heme binding by Q8EK42
