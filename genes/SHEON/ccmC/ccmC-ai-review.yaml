- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  findings:
  - statement: >-
      Heme binds CcmC with high affinity; when CcmA or CcmB is missing, holoCcmE stays
      bound to CcmC as a stable dead-end complex.
    supporting_text: >-
      In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable dead-end
      complex, indicating high affinity binding of haem to CcmC.
    reference_section_type: ABSTRACT
  - statement: >-
      The ATPase activity of the CcmA2B1C1 complex is spent on releasing holoCcmE rather
      than on pumping heme across the membrane.
    supporting_text: >-
      The mechanism involves an ATP-binding cassette (ABC) transporter that is required
      for release of the periplasmic haem chaperone CcmE to the last step of cytochrome c
      assembly.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Feissner et al. 2006, Mol Microbiol 61:219-231). Cached record is
      abstract-only and names no organism, so nothing is asserted here about which
      organism was assayed; it is cited only for the System I CcmABC mechanism its
      abstract states, which is relevant to this gene as a member of that system.
      Separately, this same PMID is the reference for six PseudoCAP IMP rows on
      the Pseudomonas aeruginosa ortholog Q9I3N5 (catalase activity, pyoverdine and
      glycolipid biosynthesis, pilus and flagellar motility) that the abstract does not
      report; that mismatch is recorded as a source defect on the GO:0004096 row rather
      than as a problem with this reference for the present review.
- id: PMID:16875436
  title: c-Type cytochrome-dependent formation of U(IV) nanoparticles by Shewanella oneidensis.
  findings:
  - statement: >-
      An S. oneidensis MR-1 strain disrupted in ccmC has no functionally active c-type
      cytochromes and was used as the cytochrome-null control.
    supporting_text: we evaluated a mutant lacking all functionally active c-type cytochromes
    reference_section_type: INTRODUCTION
  - statement: >-
      Only the cytochrome-maturation mutant abolished U(VI) reduction; deleting
      individual or paired outer-membrane cytochromes only slowed it.
    supporting_text: >-
      none of the mutants tested abolished the ability to reduce U(VI) as was seen with
      the CcmC
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified via DOI 10.1371/journal.pbio.0040268 (PLoS Biol 4:e268). Full text
