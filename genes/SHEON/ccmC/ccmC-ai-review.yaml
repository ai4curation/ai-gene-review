  supporting_entities:
  - InterPro:IPR045062
  review:
    summary: >-
      InterPro2GO mapping from the shared CcsA/CcmC signature to heme binding. This is
      the best-supported molecular function for the family and the one directly
      demonstrated for CcmC.
    action: ACCEPT
    reason: >-
      Heme binding by CcmC is established biochemically: the conserved tryptophans of
      the periplasmic WWD domain form the heme site, their substitution abolishes heme
      binding and function, and two external histidines act as the axial ligands to the
      heme iron (PMID:20599545). The binding is of high affinity, as shown by the stable
