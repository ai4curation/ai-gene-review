id: Q8EK42
gene_symbol: ccmC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:211586
  label: Shewanella oneidensis MR-1
description: >-
  CcmC (SO_0261) is a 248-residue polytopic inner-membrane protein of Shewanella
  oneidensis MR-1 and a member of the CcmC/CycZ/HelC family, one of the eight
  membrane components (CcmA-H) of System I cytochrome c biogenesis. It carries six
  transmembrane helices and the conserved tryptophan-rich WWD domain that defines the
  heme-handling superfamily it shares with CcmF and CcsA. The WWD domain lies in a
  periplasmic loop and forms the heme binding site; two external histidines provide
  the axial ligands to the heme iron. CcmC's step in the pathway is to bind heme at
  that external site and hand it to the membrane-tethered heme chaperone CcmE, which
  becomes covalently loaded to form holoCcmE; CcmC is therefore sometimes called the
  holoCcmE synthase. CcmC binds heme stably only when apoCcmE is present, and CcmE
  binds CcmC stably only when heme is present, so the three form a single complex.
  Release of holoCcmE from that complex requires ATP hydrolysis by CcmA together with
  CcmB, and in the absence of either subunit the CcmC:heme:CcmE complex accumulates as
  a dead end. HoloCcmE then delivers the heme to the CcmF/H cytochrome c synthetase for
  thioether attachment to the CXXCH motif of apocytochromes c. In S. oneidensis this
  pathway matures an unusually large complement of multiheme c-type cytochromes, and a
  strain disrupted in ccmC lacks all functionally active c-type cytochromes and cannot
  carry out c-type-cytochrome-dependent extracellular reduction of U(VI). Despite the
  legacy name "heme exporter protein C", the route by which heme reaches the
  periplasmic WWD domain has not been established, and no heme binding site within the
  membrane-spanning helices of CcmC has been found.
