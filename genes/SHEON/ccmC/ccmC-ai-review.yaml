- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003557
  review:
    summary: >-
      InterPro2GO mapping from the CcmC signature IPR003557 to a transmembrane
      transporter activity. CcmC does hand heme to CcmE at the periplasmic face, but
      that it translocates heme across the bilayer is still described as putative in the
      primary literature, and no intramembrane heme site has been found in CcmC.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is not plainly false - heme does end up on the outside of the membrane
      through CcmC - but it asserts a transport mechanism that has not been demonstrated.
      The route by which heme reaches the WWD domain is explicitly open (PMID:20599545),
      and the same work found no heme binding site within the membrane-spanning helices,
      in contrast to the System II protein CcsBA, which does have one. The 2018 mapping
      study still frames the step as "putative heme transport through CcmC"
      (PMID:29518410). The ATPase of the system, CcmA with CcmB, is spent on releasing
      holoCcmE from CcmC rather than on pumping heme (PMID:16824107), so the familiar
      "heme exporter" framing is not an ABC heme pump either. What is established for
      this protein is heme binding (GO:0020037, accepted below) and participation in
      heme trafficking to CcmE (GO:0015886, accepted below); the transmembrane
      transporter molecular function overstates that. It is marked over-annotated rather
      than removed because the mechanism remains an open question rather than a refuted
      one, and because no better molecular function term is available.
    supported_by:
    - reference_id: PMID:20599545
      supporting_text: It is still unclear how heme travels to the CcmC WWD domain to
        interact with CcmE.
    - reference_id: PMID:29518410
      supporting_text: >-
        In System I, composed of eight integral membrane proteins (CcmA–H), the first
        step in biogenesis involves putative heme transport through CcmC via the CcmABCD
        complex
    - reference_id: PMID:16824107
      supporting_text: >-
        The mechanism involves an ATP-binding cassette (ABC) transporter that is
        required for release of the periplasmic haem chaperone CcmE to the last step of
        cytochrome c assembly.
