      (file:SHEON/ccmC/ccmC-bioinformatics/RESULTS.md). The mapping therefore transfers
      on conserved site residues. Taken as the core molecular function of this gene.
    supported_by:
    - reference_id: PMID:20599545
      supporting_text: >-
        We conclude that the WWD domain and the conserved tryptophans that define this
        superfamily directly interact with heme, forming the specific heme binding site.
