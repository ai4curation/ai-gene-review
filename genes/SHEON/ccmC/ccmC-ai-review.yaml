- id: PMID:20599545
  title: The CcmC:heme:CcmE complex in heme trafficking and cytochrome c biosynthesis.
  findings:
  - statement: >-
      The conserved tryptophans of the periplasmic WWD domain of CcmC form the heme
      binding site; substituting them perturbs the heme spectrum and abolishes binding
      and function.
    supporting_text: >-
      We conclude that the WWD domain and the conserved tryptophans that define this
      superfamily directly interact with heme, forming the specific heme binding site.
    reference_section_type: RESULTS
  - statement: >-
      Two external histidines of CcmC are the axial ligands to the heme iron, and at
      least one is needed for stable heme binding.
    supporting_text: >-
      These results are consistent with His60 and His184 as axial ligands to the heme
      iron, at least one of which is required for stable binding of heme.
    reference_section_type: RESULTS
  - statement: CcmC is the protein that attaches heme to apoCcmE.
    supporting_text: >-
      CcmC is necessary to attach heme to apoCcmE; thus, it is sometimes referred to as
      the holoCcmE synthase.
    reference_section_type: INTRODUCTION
  - statement: >-
      How heme reaches the WWD domain of CcmC remains unknown, and no heme site was
      found within its membrane-spanning helices.
    supporting_text: It is still unclear how heme travels to the CcmC WWD domain to interact
      with CcmE.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Richard-Fogal and Kranz 2010, J Mol Biol 401:350-362). Full text
      cached; quotations taken from it. The primary evidence that CcmC's molecular
      function is heme binding at the WWD domain, and the explicit statement that the
      transport route is unresolved.
- id: PMID:29518410
  title: Structurally Mapping Endogenous Heme in the CcmCDE Membrane Complex for Cytochrome
    c Biogenesis.
  findings:
  - statement: >-
      Cysteine/heme crosslinking maps endogenous heme to the WWD domain of CcmC and
      supports heme trafficking by CcmC.
    supporting_text: >-
      We conclude that CcmC trafficks heme via its WWD domain and propose the structural
      basis for stereochemical attachment of heme.
    reference_section_type: ABSTRACT
  - statement: CcmC has six transmembrane domains and is required for heme delivery to CcmE.
    supporting_text: The CcmC protein, comprised of six TMDs, is necessary for heme delivery
      to CcmE
    reference_section_type: INTRODUCTION
  - statement: >-
      Heme transport through CcmC is still described as putative in the current
      literature.
    supporting_text: >-
      In System I, composed of eight integral membrane proteins (CcmA–H), the first step
      in biogenesis involves putative heme transport through CcmC via the CcmABCD complex
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Sutherland et al. 2018, J Mol Biol 430:1065-1080). Full text
      cached. Confirms the WWD heme site by crosslinking and is the source for the
      six-TMD topology and for the field's own "putative" framing of the transport step.
