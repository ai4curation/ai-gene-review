  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1.
  findings:
  - statement: The fde operon is induced by naringenin and chrysin, and a mutation in fdeA, the first
      gene of the operon, abolishes naringenin degradation.
    supporting_text: We show that this operon is involved in naringenin degradation and that its expression
