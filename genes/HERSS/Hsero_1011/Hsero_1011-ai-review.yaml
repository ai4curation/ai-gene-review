  label: Herbaspirillum seropedicae SmR1
description: Hsero_1011 (fdeI) encodes a fumarylacetoacetate hydrolase (FAH)-family protein with an N-terminal
  FAA_hydro_N domain and the C-terminal FAH catalytic domain, in the naringenin degradation (fde) locus
  of Herbaspirillum seropedicae SmR1. The FAH superfamily includes hydrolases, decarboxylases, isomerases
  and hydratases. KEGG assigns FdeI to the two late pathway reactions, decarboxylation of a flavonoid-derived
  beta-keto acid and dehydration of the resulting hydroxyketone; neither reaction has been tested, and
  KEGG marks both as unclear, so its molecular function is unresolved.
