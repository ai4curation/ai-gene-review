  review:
    summary: >-
      Correct but uninformative; the KEGG FdeI assignment predicts the more
      specific carboxy-lyase activity.
    action: MODIFY
    reason: >-
      FAH-family catalytic-domain membership supports enzymatic activity, and
      KEGG assigns FdeI to R13078, a decarboxylation of a flavonoid-derived
      beta-keto acid. Carboxy-lyase activity is the specific reaction class
      that prediction supports, matching the PP_3205 review. The second KEGG
      reaction (R13079, water elimination) is not asserted because KEGG marks
      it as unclear.
    proposed_replacement_terms:
