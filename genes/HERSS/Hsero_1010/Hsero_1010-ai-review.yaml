  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1.
  full_text_unavailable: true
  findings:
  - statement: >-
      The fde operon is induced by naringenin and chrysin, and a mutation in
      fdeA, the first gene of the operon, abolishes naringenin degradation.
    supporting_text: We show that this operon is involved in naringenin degradation and that its expression is induced by naringenin and chrysin, two closely related flavonoids.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Establishes operon-level involvement; the fdeA
      insertion may be polar on downstream fde genes, so it does not test
      individual downstream genes.
