product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:757424
  label: Herbaspirillum seropedicae SmR1
description: >-
  Hsero_1010 (fdeH) encodes a 196-residue cupin type-2 domain protein of the
  OryJ/VirC-like group in the naringenin degradation (fde) locus of
  Herbaspirillum seropedicae SmR1. KEGG co-assigns FdeH with the FdeC
  dioxygenase to the A-ring cleavage step, but FdeH has not been tested
  genetically or biochemically, and the cupin fold alone does not reveal
  whether it is a catalyst, a metal-binding accessory protein, or a
  structural partner.
