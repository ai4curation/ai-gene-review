  review:
    summary: Withdraw the inherited FdeH process proposal; an individual flavonoid-catabolic step has
      not been established.
    action: REMOVE
    reason: The conserved locus and orthology identify a candidate FdeH protein, but cupin membership
      and an associated locus do not identify its catalytic, structural or accessory contribution. The
      available whole-operon phenotype, including the probably polar fdeA insertion, does not show which
      step this individual protein performs. There is no independently assayed donor for this particular
      role; the corresponding BRADU comparator bll6423 likewise carries no process assertion. Retain the
      original source payload and row position while withdrawing the active proposal. The retired flag
      records this curator decision, not disappearance of an upstream GOA row or proof of biological absence.
      Native participation remains an open question. REMOVE records withdrawal of this earlier curator-authored
      NEW proposal, not removal of a current GOA assertion. It does not claim that the protein is biologically
      incapable of participating in flavonoid catabolism.
