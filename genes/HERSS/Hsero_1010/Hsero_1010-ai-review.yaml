knowledge_gaps:
- gap_statement: >-
    Whether FdeH is needed for naringenin degradation, and whether it is a
    catalyst, a metal-binding accessory protein or a structural partner of
    FdeC, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The KEGG co-assignment of FdeH to R13075 rests on locus context alone.
  resolution: >-
    Delete fdeH and test naringenin use; compare R13075 turnover by purified
    FdeC with and without FdeH and test FdeH metal binding.
  provenance:
  - reference_id: file:PSEPK/PP_3204/PP_3204-bioinformatics/RESULTS.md
    supporting_text: these records do not establish an independent molecular function for FdeH
suggested_experiments:
- description: >-
    Construct an fdeH deletion in SmR1, test growth on naringenin, and profile
    supernatants for accumulated 5,7,8-trihydroxyflavanone or later
    intermediates.
  experiment_type: genetics and targeted metabolomics
