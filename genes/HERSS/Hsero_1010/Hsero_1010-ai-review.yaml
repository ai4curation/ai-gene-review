- id: PMID:23125118
  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1.
  findings:
  - statement: The fde operon is induced by naringenin and chrysin, and a mutation in fdeA, the first
      gene of the operon, abolishes naringenin degradation.
    supporting_text: We show that this operon is involved in naringenin degradation and that its expression
      is induced by naringenin and chrysin, two closely related flavonoids.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; author-uploaded full text independently read in the comparative
      audit. The fdeA insertion was probably polar and failed complementation by fdeA alone. Induced WT
      extracts and H. rubrisubalbicans M1 show naringenin conversion; this is locus-level support, not
      an assay of each protein. See modules/bacterial_flavonoid_degradation-notes.md for access provenance.
knowledge_gaps:
- gap_statement: Whether FdeH is needed for naringenin degradation, and whether it is a catalyst, a metal-binding
    accessory protein or a structural partner of FdeC, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The KEGG co-assignment of FdeH to R13075 rests on locus context alone.
  resolution: Delete fdeH and test naringenin use; compare R13075 turnover by purified FdeC with and without
    FdeH and test FdeH metal binding.
  provenance:
  - reference_id: file:PSEPK/PP_3204/PP_3204-bioinformatics/RESULTS.md
    supporting_text: these records do not establish an independent molecular function for FdeH
  boundary: FdeH membership and pathway placement nominate a candidate; they do not establish which native
    flavonoid-catabolic step the target performs. The inherited process proposal is retired pending participation
    evidence.
suggested_experiments:
- description: Construct an fdeH deletion in SmR1, test growth on naringenin, and profile supernatants
    for accumulated 5,7,8-trihydroxyflavanone or later intermediates.
  experiment_type: genetics and targeted metabolomics
