    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001375
  review:
    summary: 'Over-propagated: the Peptidase S9 catalytic-domain signature reflects the alpha/beta-hydrolase
      fold, not a peptide substrate.'
    action: REMOVE
    reason: IPR001375 matches the catalytic alpha/beta-hydrolase domain only (residues 174-381 of 386);
      the protein has no N-terminal beta-propeller, and InterPro's family-level classification is the
      FrsA-like esterase family. The locus-specific KEGG assignment is a lactone hydrolysis step in flavonoid
      degradation. There is no evidence for peptide cleavage, so the InterPro2GO mapping is wrong for
      this subfamily, matching the decision for the P. putida ortholog PP_3195.
    supported_by:
