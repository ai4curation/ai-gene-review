- id: PMID:23125118
  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1.
  findings:
  - statement: The fde operon is induced by naringenin and chrysin, and a mutation in fdeA, the first
      gene of the operon, abolishes naringenin degradation.
    supporting_text: We show that this operon is involved in naringenin degradation and that its expression
      is induced by naringenin and chrysin, two closely related flavonoids.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; author-uploaded full text independently read in the comparative
      audit. The fdeA insertion was probably polar and failed complementation by fdeA alone. Induced WT
      extracts and H. rubrisubalbicans M1 show naringenin conversion; this is locus-level support, not
      an assay of each protein. See modules/bacterial_flavonoid_degradation-notes.md for access provenance.
