      locus and is assigned the lactone-hydrolysis step.'
    action: NEW
    reason: Curator inference from the naringenin induction and fdeA-mutant phenotype of the fde operon,
      the pathway paper's definition of the fde meta-pathway, the KEGG FdeB orthology assignment to R13077,
