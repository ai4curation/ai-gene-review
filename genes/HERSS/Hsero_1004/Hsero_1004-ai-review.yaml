  review:
    summary: Broad ester-hydrolase activity is supported by the FrsA-like esterase family membership and
      the KEGG lactone-hydrolysis assignment.
    action: ACCEPT
    reason: Independently of the ARBA prediction, the FrsA-like esterase family classification, the conserved
      GxSxG-type nucleophile motif shared with PP_3195, and the KEGG R13077 assignment (hydrolysis of
      a delta-lactone, an intramolecular carboxylic ester) support this term. A lactonase child is not
      asserted because the substrate is untested.
