  label: Herbaspirillum seropedicae SmR1
description: Hsero_1004 (fdeB) encodes an alpha/beta-hydrolase-fold protein of the FrsA-like esterase
  family in the naringenin degradation (fde) locus of Herbaspirillum seropedicae SmR1. Its C-terminal
  catalytic domain resembles the Peptidase S9 domain, but the protein lacks the beta-propeller that gates
  substrates in true prolyl-oligopeptidase-family peptidases. KEGG assigns FdeB to the hydrolytic opening
  of a flavonoid-derived delta-lactone after A-ring cleavage, a predicted carboxylic ester (lactone) hydrolase
  role that has not been tested experimentally.
existing_annotations:
