    summary: Withdraw the inherited process proposal pending evidence that this candidate executes a flavonoid-catabolic
      step.
    action: MARK_AS_OVER_ANNOTATED
    reason: The conserved locus and K26184 assignment identify a plausible FdeB candidate, but the inherited
      proposal relies on the untested R13077 assignment and similarity to another unassayed candidate.
      The broad hydrolase fold does not establish which native step the protein performs. Whole-operon
      phenotypes do not settle this individual role. Retain the original proposal row for provenance while
      withdrawing its assertion, consistently with the same-role BRADU bll6428 comparator; possible participation
      remains a knowledge gap rather than an asserted core process. The retired flag records deliberate
      withdrawal of this curator-authored proposal from the active set; it does not report disappearance
      of an upstream GOA annotation.
