proposed_new_terms:
- proposed_name: flavonoid 8-monooxygenase activity
  proposed_definition: >-
    Catalysis of the C-8 hydroxylation of a flavonoid using NAD(P)H and
    molecular oxygen, with incorporation of one oxygen atom into the flavonoid
    and reduction of the other oxygen atom to water.
  justification: >-
    Purified Hsero_1007/FdeE performs C-8 hydroxylation across several
    flavonoid classes, whereas GO:0016709 captures only the general reaction
    class. The same term is proposed in the PP_3199 review.
  proposed_parent:
    id: GO:0016709
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen
  supported_by:
  - reference_id: PMID:39107441
    supporting_text: Here, we present the fdeE, the FMO from Herbaspirillum seropedicae SmR1 that is a part of the naringenin degradation pathway and is active towards a wide range of flavonoids-flavanones, flavones, isoflavones, and flavonols.
suggested_questions:
- question: >-
    Does the Rieske protein FdeD (Hsero_1006), encoded next to fdeE, contribute
    to the in vivo C-8 hydroxylation, given that purified FdeE is active alone
    with NADPH?
suggested_experiments:
- description: >-
    Compare naringenin conversion and 8-hydroxynaringenin accumulation in an
    in-frame fdeD deletion versus wild type, and test whether added FdeD changes
    the rate or regioselectivity of purified FdeE.
  experiment_type: genetics and in vitro reconstitution
