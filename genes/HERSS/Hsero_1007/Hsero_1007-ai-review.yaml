- term:
    id: GO:0071949
    label: FAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002938
  review:
    summary: >-
      FdeE contains the FAD-binding domain of group A flavoprotein
      monooxygenases and its activity is consistent with tightly bound FAD.
    action: ACCEPT
    reason: >-
      The Pfam FAD_binding_3 domain spans almost the whole protein, and the
      enzyme study reports conserved FAD-binding motifs and activity without
      added FAD, consistent with a tightly bound flavin cofactor. FAD binding is
      a cofactor-binding property supporting the core monooxygenase activity.
    supported_by:
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR002938; FAD-bd.
    - reference_id: PMID:39107441
      supporting_text: This correlates with the hypothesis that FAD may remain tightly bound to these enzymes
