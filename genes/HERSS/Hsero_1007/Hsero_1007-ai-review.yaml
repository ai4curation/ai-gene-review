      identification (8-hydroxynaringenin) and NADPH dependence. The cached full text
      also gives kinetic constants for five flavonoids. GO has no
      flavonoid 8-monooxygenase term, so this reaction-class term is the most
      specific available; a new term is proposed below.
    supported_by:
    - reference_id: PMID:39107441
      supporting_text: Like LjF8H33 and RgF8H25, it showed an absolute requirement for NADPH, while the addition of FAD to the reaction mixture containing the NADPH coenzyme did not result in changes in activity, as also was described for LjF8H33.
    - reference_id: PMID:39107441
      supporting_text: However, a clear conclusion of evolutionary adaptation of fdeE to degrade naringenin, the most common flavonoid in plants is clearly observed.
