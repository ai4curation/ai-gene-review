  review:
    summary: >-
      An fdeE::Tn5 mutant cannot use naringenin as a carbon source and leaves
      naringenin unconverted, placing FdeE at the first step of naringenin
      catabolism.
    action: NEW
    reason: >-
      FdeE itself performs the first step of the pathway (the C-8
      monooxygenation), so this is participation, not merely necessity. GO
      defines flavonoid catabolic process as "The chemical reactions and
      pathways resulting in the breakdown of flavonoids, a group of phenolic
      derivatives containing a flavan skeleton", which covers naringenin
      degradation to oxaloacetate.
    supported_by:
    - reference_id: PMID:27059806
      supporting_text: a mutant incapable of utilizing naringenin as a carbon source was isolated. The Tn5 transposon was found to be inserted in the fdeE gene (Hsero_1007), which encodes a monooxygenase.
    - reference_id: PMID:27059806
      supporting_text: naringenin remained unaltered, suggesting that the FdeE protein is involved in the initial step of naringenin degradation.
