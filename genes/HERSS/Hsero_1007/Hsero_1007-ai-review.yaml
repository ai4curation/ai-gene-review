  label: Herbaspirillum seropedicae SmR1
description: >-
  Hsero_1007 (fdeE) encodes the FAD-dependent, NADPH-requiring flavoprotein
  monooxygenase that initiates naringenin degradation in Herbaspirillum
  seropedicae SmR1. A Tn5 insertion in fdeE abolishes growth on naringenin and
  leaves naringenin unconverted in culture supernatants, and the purified
  recombinant enzyme hydroxylates naringenin at C-8, giving
  5,7,8-trihydroxyflavanone (8-hydroxynaringenin), the substrate of the FdeC
  A-ring-cleaving dioxygenase. The enzyme also hydroxylates other flavanones,
  flavones, isoflavones and flavonols at C-8 in vitro, with the highest
  catalytic efficiency for naringenin. It is the experimentally characterized
  founding member of the FdeE orthology group within the broad PANTHER
  PTHR13789 flavoprotein monooxygenase family.
