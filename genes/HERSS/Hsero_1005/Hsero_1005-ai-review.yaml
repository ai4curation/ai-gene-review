  review:
    summary: >-
      Wrong activity: the EC 3.1.2.6 (glyoxalase II) number is a submitter
      label on a VOC-fold protein whose experimentally supported role is A-ring
      dioxygenation.
    action: REMOVE
    reason: >-
      Hydroxyacylglutathione hydrolase (glyoxalase II) belongs to the
      metallo-beta-lactamase fold, whereas this protein carries only the VOC
      domain of glyoxalase I/extradiol dioxygenases, so the "glyoxalase II"
      name conflates two unrelated folds. The fdeC mutant phenotype places the
      protein at the dioxygenation of 5,7,8-trihydroxyflavanone, and KEGG
      assigns glyoxalase II in this genome to a different gene (Hsero_3418,
      K01069) and Hsero_1005 to the FdeC group K26181. The EC-to-GO mapping is
      therefore built on a wrong submitter EC.
