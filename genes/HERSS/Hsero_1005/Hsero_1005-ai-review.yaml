  label: Herbaspirillum seropedicae SmR1
description: >-
  Hsero_1005 (fdeC) encodes the A-ring-cleaving dioxygenase of the naringenin
  degradation (fde) pathway of Herbaspirillum seropedicae SmR1. The protein
  has a vicinal oxygen chelate (VOC) fold, the glyoxalase/bleomycin-resistance/
  extradiol-dioxygenase superfamily that includes metal-dependent extradiol
  ring-cleavage dioxygenases. An fdeC mutant accumulates
  5,7,8-trihydroxyflavanone, the product of the FdeE monooxygenase, showing
  that FdeC acts immediately after FdeE to dioxygenate and open the
  hydroxylated A-ring. The enzyme has not been purified, so its metal
  cofactor and exact ring-cleavage product remain inferred.
