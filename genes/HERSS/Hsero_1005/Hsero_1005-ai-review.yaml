- description: >-
    Purify FdeC, measure oxygen consumption with 5,7,8-trihydroxyflavanone in
    the presence of Fe(II), Mn(II) or other metals, and identify the
    ring-cleavage product by LC-MS/MS and NMR.
  experiment_type: biochemical reconstitution and product identification
