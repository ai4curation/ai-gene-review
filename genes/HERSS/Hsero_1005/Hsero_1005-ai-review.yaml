  review:
    summary: >-
      Mutant metabolite profiling shows FdeC is the dioxygenase that cleaves
      the A-ring of 5,7,8-trihydroxyflavanone.
    action: NEW
    reason: >-
      Loss of fdeC causes accumulation of the FdeE product, which in wild type
      is dioxygenated and cleaved at the A-ring; with the VOC extradiol
      dioxygenase superfamily fold this supports a dioxygenase activity
      incorporating both oxygen atoms. No substrate-specific GO term exists,
      and the evidence (mutant phenotype, not purified enzyme) does not reach a
      narrower catechol-type term, so the dioxygenase reaction-class term is
      used, matching the PP_3197 review.
    supported_by:
    - reference_id: PMID:27059806
