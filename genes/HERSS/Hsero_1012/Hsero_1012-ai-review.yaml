  review:
    summary: UDP-glucose 4-epimerase assignment is unverified; alternative pathway placement does not
      establish that this activity is absent.
    action: UNDECIDED
    reason: The submitter-derived EC assertion is not supported by a substrate-specific assay in the inspected
      sources. The epimerase/dehydratase fold is compatible with multiple reactions; the FdeJ locus placement
      and separate GalE-group genes do not exclude UDP-glucose epimerization or multifunctionality. Retain
      uncertainty pending direct biochemical or discriminating evolutionary evidence. KEGG orthology is
      an alternative hypothesis, not a demonstrated contradiction.
