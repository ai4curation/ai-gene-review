knowledge_gaps:
- gap_statement: >-
    The reaction catalysed by FdeJ, and whether an epimerase/dehydratase-fold
    protein can release oxaloacetate from the A-ring cleavage product as KEGG
    proposes, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The R13076 step is the least constrained reaction in the pathway.
  resolution: >-
    Assay purified FdeJ with the FdeC cleavage product and NAD(P)(H), and test
    an fdeJ deletion for intermediate accumulation.
  provenance:
  - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
    supporting_text: 'R13076: (2E,4E)-2,4-Dihydroxy-4-[6-(4-hydroxyphenyl)-2,4-dioxodihydro-2H-pyran-3(4H)-ylidene]but-2-enoate + H2O <=> 5-(4-Hydroxyphenyl)-3-oxovalero-delta-lactone + Oxaloacetate; KEGG comment: unclear reaction; orthology: K26183  naringenin degradation protein FdeJ'
suggested_experiments:
- description: >-
    Couple purified FdeC and FdeJ with 5,7,8-trihydroxyflavanone and
    NAD(P)+/NAD(P)H, detecting oxaloacetate enzymatically and the lactone by
    LC-MS/MS.
  experiment_type: coupled enzyme assay
