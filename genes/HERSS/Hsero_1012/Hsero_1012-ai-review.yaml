- term:
    id: GO:0003978
    label: UDP-glucose 4-epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:5.1.3.2
  review:
    summary: The UDP-glucose-specific EC assertion is more precise than the available evidence supports.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003978 specifically describes UDP-glucose/UDP-galactose interconversion. Its EC2GO relation
      is correct, but the source EC 5.1.3.2 on D8J0X4 is an unvetted EMBL submitter assertion (ECO:0000313,
      ADJ62529.1). PF01370/IPR001509 supports an NAD-dependent epimerase/dehydratase fold with multiple
      substrate specificities, not this UDP-sugar reaction. The alternative FdeJ assignment and separate
      K01784 genes strengthen the need to withdraw the unsupported specific mapping; they are not a negative
      enzyme assay. MARK_AS_OVER_ANNOTATED records over-specificity while leaving possible activity unresolved,
      rather than making absence the burden of proof.
    supported_by:
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
      supporting_text: 'Hsero_1012 submitter name/EC ''UDP-glucose 4-epimerase'': SmR1 genes in the dedicated
        KO K01784: Hsero_2010, Hsero_4409; Hsero_1012 in K01784: False'
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
      supporting_text: 'KEGG mapping: `hse:Hsero_1012 -> ko:K26183` (fdeJ; naringenin degradation protein
        FdeJ)'
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: EC
      requested_change: DELETE_VALUE
      asserted_value: EC:5.1.3.2
      cause: OTHER
      confidence: PROBABLE
      explanation: TrEMBL D8J0X4 carries EC 5.1.3.2 solely from the EMBL submitter (ECO:0000313, ADJ62529.1).
        The broad PF01370/IPR001509 fold does not establish UDP-glucose specificity; KEGG instead places
        this protein in FdeJ, with dedicated K01784 genes Hsero_2010/Hsero_4409 elsewhere. Please remove
        the unsupported EC value pending substrate-specific evidence. This is a probable over-specific
        source assertion, not proof that UDP-glucose epimerization is impossible.
      supported_by:
      - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
        supporting_text: 'Hsero_1012 submitter name/EC ''UDP-glucose 4-epimerase'': SmR1 genes in the
