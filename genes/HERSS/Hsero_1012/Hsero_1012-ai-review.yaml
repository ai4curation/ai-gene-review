- term:
    id: GO:0046275
    label: flavonoid catabolic process
  evidence_type: IC
  original_reference_id: PMID:27059806
  qualifier: involved_in
  review:
    summary: Withdraw the inherited FdeJ process proposal; an individual flavonoid-catabolic step has
      not been established.
    action: REMOVE
    reason: The conserved locus and orthology identify a candidate FdeJ protein, but the epimerase/dehydratase
      fold does not establish the proposed oxaloacetate-releasing R13076 reaction. The available whole-operon
      phenotype, including the probably polar fdeA insertion, does not show which step this individual
      protein performs. There is no independently assayed donor for this particular role; the corresponding
      BRADU comparator bll6421 likewise carries no process assertion. Retain the original source payload
      and row position while withdrawing the active proposal. The retired flag records this curator decision,
      not disappearance of an upstream GOA row or proof of biological absence. Native participation remains
      an open question. REMOVE records withdrawal of this earlier curator-authored NEW proposal, not removal
      of a current GOA assertion. It does not claim that the protein is biologically incapable of participating
      in flavonoid catabolism.
    supported_by:
    - reference_id: PMID:23125118
      supporting_text: We show that this operon is involved in naringenin degradation and that its expression
        is induced by naringenin and chrysin, two closely related flavonoids.
    - reference_id: PMID:27059806
      supporting_text: After meta-cleavage of the A-ring, the subsequent metabolic steps generate oxaloacetic
        acid that is metabolized via the tricarboxylic acid cycle.
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
      supporting_text: 'KEGG mapping: `hse:Hsero_1012 -> ko:K26183` (fdeJ; naringenin degradation protein
        FdeJ)'
  retired: true
