id: D8J0X4
gene_symbol: Hsero_1012
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:757424
  label: Herbaspirillum seropedicae SmR1
description: >-
  Hsero_1012 (fdeJ) encodes an NAD(P)-binding Rossmann-fold protein of the
  NAD-dependent epimerase/dehydratase (extended short-chain
  dehydrogenase/reductase) family in the naringenin degradation (fde) locus of
  Herbaspirillum seropedicae SmR1. KEGG assigns FdeJ to the reaction that
  releases oxaloacetate from the A-ring cleavage product, a step KEGG marks as
  unclear. The fold does not by itself establish that chemistry, and no FdeJ
  protein has been characterized, so its molecular function is unresolved.
existing_annotations:
- term:
    id: GO:0003978
    label: UDP-glucose 4-epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:5.1.3.2
  review:
    summary: >-
      Unsupported: EC 5.1.3.2 is a submitter label on a pathway protein; SmR1
      has dedicated UDP-glucose 4-epimerase genes elsewhere.
    action: REMOVE
    reason: >-
      The EC number comes from the EMBL submission, not from analysis, and the
      PF01370 epimerase/dehydratase fold is shared by many sugar-nucleotide
      epimerases, dehydratases and reductases, so it does not identify
      UDP-glucose as the substrate. KEGG places Hsero_1012 in the FdeJ group
      and assigns the UDP-glucose 4-epimerase group (K01784) in this genome to
      Hsero_2010 and Hsero_4409. The gene sits in the fde locus, whose products
      act on flavonoid-derived intermediates, so the EC-derived GO term is an
      over-propagation of a generic fold label.
    supported_by:
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
      supporting_text: "Hsero_1012 submitter name/EC 'UDP-glucose 4-epimerase': SmR1 genes in the dedicated KO K01784: Hsero_2010, Hsero_4409; Hsero_1012 in K01784: False"
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
      supporting_text: 'KEGG mapping: `hse:Hsero_1012 -> ko:K26183` (fdeJ; naringenin degradation protein FdeJ)'
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: EC
      requested_change: DELETE_VALUE
      asserted_value: EC:5.1.3.2
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        TrEMBL D8J0X4 carries the submitter name "UDP-glucose 4-epimerase
        protein" and EC 5.1.3.2 (ECO:0000313, EMBL:ADJ62529.1). The protein is
        the FdeJ component of the fde naringenin-degradation locus; SmR1
        encodes separate GalE-group genes (Hsero_2010, Hsero_4409). The EC
        propagates to GO:0003978 through EC2GO and should be removed.
      supported_by:
      - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
        supporting_text: "Hsero_1012 submitter name/EC 'UDP-glucose 4-epimerase': SmR1 genes in the dedicated KO K01784: Hsero_2010, Hsero_4409; Hsero_1012 in K01784: False"
