taxon:
  id: NCBITaxon:757424
  label: Herbaspirillum seropedicae SmR1
description: Hsero_1012 (fdeJ) encodes an NAD(P)-binding Rossmann-fold protein of the NAD-dependent epimerase/dehydratase
  (extended short-chain dehydrogenase/reductase) family in the naringenin degradation (fde) locus of Herbaspirillum
  seropedicae SmR1. KEGG assigns FdeJ to the reaction that releases oxaloacetate from the A-ring cleavage
  product, a step KEGG marks as unclear. The fold does not by itself establish that chemistry, and no
  FdeJ protein has been characterized, so its molecular function is unresolved.
