- id: PMID:23125118
  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1.
  findings:
  - statement: The fde operon is induced by naringenin and chrysin, and a mutation in fdeA, the first
      gene of the operon, abolishes naringenin degradation.
    supporting_text: We show that this operon is involved in naringenin degradation and that its expression
      is induced by naringenin and chrysin, two closely related flavonoids.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; author-uploaded full text independently read in the comparative
      audit. The fdeA insertion was probably polar and failed complementation by fdeA alone. Induced WT
      extracts and H. rubrisubalbicans M1 show naringenin conversion; this is locus-level support, not
      an assay of each protein. See modules/bacterial_flavonoid_degradation-notes.md for access provenance.
knowledge_gaps:
- gap_statement: The reaction catalysed by FdeJ, and whether an epimerase/dehydratase-fold protein can
    release oxaloacetate from the A-ring cleavage product as KEGG proposes, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The R13076 step is the least constrained reaction in the pathway.
  resolution: Assay purified FdeJ with the FdeC cleavage product and NAD(P)(H), and test an fdeJ deletion
    for intermediate accumulation.
  provenance:
  - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
    supporting_text: 'R13076: (2E,4E)-2,4-Dihydroxy-4-[6-(4-hydroxyphenyl)-2,4-dioxodihydro-2H-pyran-3(4H)-ylidene]but-2-enoate
      + H2O <=> 5-(4-Hydroxyphenyl)-3-oxovalero-delta-lactone + Oxaloacetate; KEGG comment: unclear reaction;
      orthology: K26183  naringenin degradation protein FdeJ'
  boundary: FdeJ membership and pathway placement nominate a candidate; they do not establish which native
    flavonoid-catabolic step the target performs. The inherited process proposal is retired pending participation
    evidence.
suggested_experiments:
- description: Couple purified FdeC and FdeJ with 5,7,8-trihydroxyflavanone and NAD(P)+/NAD(P)H, detecting
    oxaloacetate enzymatically and the lactone by LC-MS/MS.
  experiment_type: coupled enzyme assay
suggested_questions:
- question: Does purified Hsero_1012 epimerize UDP-glucose, act on a flavonoid-derived substrate, or support
    both activities? The broad fold and other GalE genes do not discriminate these alternatives.
