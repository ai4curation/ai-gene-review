knowledge_gaps:
- gap_statement: >-
    Whether FdeD is needed for naringenin degradation, and which protein it
    accepts electrons from or donates them to, is unknown.
  boundary: >-
    An OpenScientist run (kgap-fded-electron-partner) confirms the suspicion in this gap's significance
    clause, eliminates three of the four established partner classes, and then reports that the genome
    cannot finish the job. The reading the databases imply is refuted: FdeE carries the PF01494
    signature of the PHBH/UbiH-like group A flavoprotein monooxygenases, which hold FAD as a tightly
    bound prosthetic group and are reduced directly by NAD(P)H, and the fde locus contains no
    flavin-reductase or ferredoxin-reductase domain at all. FdeD is therefore not the reductase of FdeE,
    and the KEGG association of the two is operon co-membership rather than a functional assignment,
    which is what this gap suspected. Having removed that reading, the reconstruction has nowhere to go.
    A survey of 37 reviewed Rieske proteins of 80 to 170 residues sorts them into four partner classes,
    and three are excluded here: no ring-hydroxylating oxygenase gene sits in the fde locus and the
    nearest complete system, about 300 genes away, already carries its own reductase; a Pfam scan for
    the diiron multicomponent monooxygenase hydroxylase domains returns zero hits across the whole
    genome; and FdeD has no membrane anchor and is not in a bc1 operon. The exclusion of the diiron
    class is the sharpest conflict in the analysis, because FdeD's own CPH ligand triad is the feature
    that points at it. The one locus-internal candidate left is reactivation of a VOC-family extradiol
    dioxygenase: FdeC sits 45 base pairs upstream, exactly the operon position xylE occupies relative to
    xylT, which is a strong functional precedent, but XylT and its relatives are plant-type
    four-cysteine ferredoxins rather than Rieske proteins, so the analogy supports the category and not
    a structural homology claim. Two further results narrow without closing. FdeD belongs to no
    characterised Rieske clade: its inter-cysteine spacing is 24 residues against 18 to 21 across all 21
    reviewed reference proteins and 19 to 20 across all 14 ring-hydroxylating ferredoxins without
    exception, while its fde-locus homologs span 24 to 29, a range that does not overlap the reference
    range at any value. And structure discriminates nothing: the model superposes equally well on a
    ring-hydroxylating ferredoxin, a diiron-monooxygenase ferredoxin and a mitochondrial bc1 Rieske
    domain, a spread of 0.33 Angstrom. On the requirement half, fdeD co-occurs with fdeE in 58 of 65
    genomes within six genes and 57 of 65 within two, and all four cluster ligands are retained in 40 of
    40 homologs collected, with no degenerate site anywhere; the local D8J0W8 record confirms Cys43,
    His45, Cys67 and His70 in its 112 residues. That is conservation under selection, and it rules out
    the degenerate-relic reading this gap raises. It is not a requirement, because the one pathway step
    with a purified enzyme runs without FdeD and no deletion has been made in any organism; eight of the
    65 fdeE-containing genomes carry no adjacent small Rieske gene, and in two of those the flanking
    genes are directly adjacent, which argues for genuine absence rather than an assembly gap. So the
    genome cannot distinguish FdeD being required from its being an accessory or orphan protein, which
    is the answer this gap's hypothesis named as possible. The run's one clean curation action is
    already taken here: it flags EC 2.7.1.50 and GO:0004417 hydroxyethylthiazole kinase activity,
    inherited from the EMBL submission in a protein whose entire length is one Rieske domain, and this
    review already removes that row; the local record confirms the EC carries submitter-imported
    evidence and that PF00355 Rieske is its only Pfam match, at protein-existence level 4. Three caveats
    the run states: the 89.2 per cent co-occurrence is a lower bound, since a 112-residue gene is easy
    to miss in a draft assembly and several of the windows lacking fdeD also lack other fde components
    and may not be naringenin-degradation loci at all; the CPH triad result rests on only three
    reference proteins in the diiron class; and its percent identities come from a custom alignment
    without a substitution matrix, so values near 20 per cent are approximate and should not be ranked
    against one another.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: >-
    Purified FdeE works with NADPH alone, so the KEGG co-assignment of FdeD to
    the hydroxylation step is untested and may be wrong.
  resolution: >-
    Delete fdeD in SmR1, measure growth on naringenin and intermediate
    accumulation, and test redox interaction of purified FdeD with FdeE and
    FdeC.
  provenance:
  - reference_id: PMID:39107441
    supporting_text: Like LjF8H33 and RgF8H25, it showed an absolute requirement for NADPH, while the addition of FAD to the reaction mixture containing the NADPH coenzyme did not result in changes in activity, as also was described for LjF8H33.
  - reference_id: file:HERSS/Hsero_1006/Hsero_1006-hypotheses/kgap-fded-electron-partner/openscientist.md
    supporting_text: >-
      FdeD is therefore not the reductase of FdeE, and the KEGG association of FdeD with the FdeE
      hydroxylation step is operon co-membership.
