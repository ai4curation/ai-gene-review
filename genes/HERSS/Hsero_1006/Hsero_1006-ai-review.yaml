references:
- id: file:HERSS/Hsero_1006/Hsero_1006-hypotheses/kgap-fded-electron-partner/openscientist.md
  title: OpenScientist reconstruction of FdeD's electron partner and its requirement in naringenin degradation
  findings:
  - statement: >-
      FdeE is a group A flavoprotein monooxygenase reduced directly by NAD(P)H and the locus holds no
      reductase domain, so FdeD is not its reductase; three of the four established Rieske partner
      classes are excluded by this genome, FdeD's inter-cysteine spacing of 24 places it outside every
      characterised clade, and structure discriminates nothing, so the partner is unresolved while
      synteny and intact ligands show selection without showing requirement.
    supporting_text: >-
      Synteny and ligand conservation establish that fdeD is under selection to keep an intact [2Fe-2S]
      cluster in the company of fdeE. They do not establish that any pathway step needs it
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified
      locally against D8J0W8: 112 residues with the cluster ligands Cys43, His45, Cys67 and His70 as
      stated, PF00355 Rieske as the only Pfam match, protein-existence level 4, and the EC 2.7.1.50 and
      GO:0004417 rows carrying submitter-imported evidence from the EMBL entry, which is the
      over-annotation the run flags and which this review already removes. Not verified: the 37-protein
      Rieske survey and its partner classes, the Pfam scans and their genome-wide absence calls, the
      locus-tag candidate assignments, the 65-genome synteny counts, the 40-homolog ligand survey, and
      the structural superpositions. The run confirms the alternative this gap's hypothesis raised, that
      FdeE needs no external carrier, and states plainly that the genome cannot distinguish requirement
      from accessory status. Its three caveats on the synteny lower bound, the three-protein diiron
      reference set and the matrix-free identity values are recorded in the boundary. No annotation
      action was changed.
