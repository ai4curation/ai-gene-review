core_functions:
- description: >-
    Rieske [2Fe-2S] cluster-binding protein of the fde naringenin-degradation
    locus; a role as an electron carrier for a pathway oxygenase is predicted
    but its partners are unknown.
  molecular_function:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  supported_by:
  - reference_id: file:HERSS/Hsero_1006/Hsero_1006-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: InterPro; IPR017941; Rieske_2Fe-2S.
knowledge_gaps:
- gap_statement: >-
    Whether FdeD is needed for naringenin degradation, and which protein it
    accepts electrons from or donates them to, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Purified FdeE works with NADPH alone, so the KEGG co-assignment of FdeD to
    the hydroxylation step is untested and may be wrong.
  resolution: >-
    Delete fdeD in SmR1, measure growth on naringenin and intermediate
    accumulation, and test redox interaction of purified FdeD with FdeE and
    FdeC.
  provenance:
  - reference_id: PMID:39107441
    supporting_text: Like LjF8H33 and RgF8H25, it showed an absolute requirement for NADPH, while the addition of FAD to the reaction mixture containing the NADPH coenzyme did not result in changes in activity, as also was described for LjF8H33.
suggested_experiments:
- description: >-
    Construct an in-frame fdeD deletion and test growth on naringenin, with
    LC-MS/MS of supernatants for accumulated intermediates; complement in
    trans.
  experiment_type: genetics and targeted metabolomics
