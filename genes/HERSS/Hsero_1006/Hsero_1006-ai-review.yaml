id: D8J0W8
gene_symbol: Hsero_1006
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:757424
  label: Herbaspirillum seropedicae SmR1
description: >-
  Hsero_1006 (fdeD) encodes a small (112-residue) Rieske [2Fe-2S] domain
  protein encoded between fdeC and fdeE in the naringenin degradation (fde)
  locus of Herbaspirillum seropedicae SmR1. The sequence carries the Rieske
  cluster-ligand motif (Cys43/His45 and Cys67/His70), consistent with an
  electron-transfer protein. KEGG associates FdeD with the FdeE naringenin
  hydroxylation step, but purified FdeE is active with NADPH alone and no
  experiment has tested FdeD, so its electron partners and its requirement in
  the pathway are unknown.
existing_annotations:
- term:
    id: GO:0004417
    label: hydroxyethylthiazole kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.7.1.50
  review:
    summary: >-
      Wrong activity: EC 2.7.1.50 is a submitter assignment on a 112-residue
      Rieske domain protein that has no kinase domain.
    action: REMOVE
    reason: >-
      The only domain detected is the Rieske [2Fe-2S] domain spanning residues
      1-105, leaving no room for the ribokinase-like fold of
      hydroxyethylthiazole kinase (ThiM). KEGG assigns no SmR1 gene to the ThiM
      group and places Hsero_1006 in the FdeD group. The EC-to-GO mapping
      rests on a wrong submitter EC.
    supported_by:
    - reference_id: file:HERSS/Hsero_1006/Hsero_1006-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR017941; Rieske_2Fe-2S.
    - reference_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
      supporting_text: "Hsero_1006 submitter name/EC 'hydroxyethylthiazole kinase': SmR1 genes in the dedicated KO K00878: none; Hsero_1006 in K00878: False"
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: EC
      requested_change: DELETE_VALUE
      asserted_value: EC:2.7.1.50
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        TrEMBL D8J0W8 carries EC 2.7.1.50 (hydroxyethylthiazole kinase) from the
        EMBL submission (ECO:0000313, EMBL:ADJ62523.1). The 112-residue protein
        consists of a single Rieske [2Fe-2S] domain and cannot contain the
        ThiM kinase fold. The EC propagates to GO:0004417 through EC2GO and
        should be removed.
      supported_by:
      - reference_id: file:HERSS/Hsero_1006/Hsero_1006-uniprot.txt
        record_section: ["DR:InterPro"]
        supporting_text: InterPro; IPR017941; Rieske_2Fe-2S.
- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017941
  - InterPro:IPR036922
  review:
    summary: >-
      The protein is a Rieske domain protein with the conserved cluster-ligand
      motif, supporting [2Fe-2S] cluster binding.
    action: ACCEPT
    reason: >-
      InterPro, Pfam and PROSITE all detect the Rieske domain, and the
      ProRule-annotated ligand positions 43, 45, 67 and 70 carry the expected
      Cys-X-His and Cys-X-X-His residues in the sequence. Cluster binding is
      the most specific function that can be asserted; no electron-transfer
      partner has been identified. This matches the PP_3198 review.
    supported_by:
    - reference_id: file:HERSS/Hsero_1006/Hsero_1006-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR017941; Rieske_2Fe-2S.
    - reference_id: file:HERSS/Hsero_1006/Hsero_1006-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 1 [2Fe-2S] cluster per subunit.
