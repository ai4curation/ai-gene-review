id: P09622
gene_symbol: DLD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DLD encodes dihydrolipoyl dehydrogenase, a FAD-dependent homodimer that transfers electrons
  from reduced protein-bound lipoyl groups to NAD+. It regenerates lipoyl cofactors as the shared E3 component
  of pyruvate, 2-oxoglutarate, branched-chain ketoacid and 2-oxoadipate dehydrogenase systems, and as
  the L protein of the glycine cleavage system. These functions connect carbohydrate oxidation, the tricarboxylic
  acid cycle and amino-acid degradation. The canonical precursor is imported into the mitochondrial matrix;
  a smaller nuclear OGDH pool supplies succinyl-CoA for KAT2A-mediated histone succinylation. DLD can
  also display a distinct proteolytic activity under conditions that alter its dimer interface, with physiological
  deployment less clearly established than its metabolic role. Alternative splicing produces shorter protein
  forms. DLD deficiency disrupts several metabolic systems, causing variable combinations of lactic acidosis,
  encephalopathy and liver dysfunction.
