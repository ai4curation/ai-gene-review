- id: PMID:15888450
  title: 'Novelty of the pyruvate metabolic enzyme dihydrolipoamide dehydrogenase in spermatozoa: correlation
    of its localization, tyrosine phosphorylation, and activity during sperm capacitation.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier/title checked against the saved publication record and available metadata.
      Normal cache and author-deposited indexed original read. Detailed sperm localization experiments
      are hamster, with additional mouse acrosomal staining; human anti-whole-PDH staining is not DLD-specific.
suggested_questions:
- question: What controls exposure of the DLD proteolytic interface in human cells, and which endogenous
    substrates are cleaved under physiological versus pathological conditions?
- question: Do the 410- and 461-residue natural DLD products retain lipoyl redox activity, proteolysis
    or mitochondrial import, and in which tissues are they translated?
- question: Should the serine-type peptidase definitions accommodate the experimentally proposed DLD serine/glutamate
    dyad, without requiring a catalytic triad?
knowledge_gaps:
- gap_statement: The physiological or pathological conditions that expose proteolytic activity
    of endogenous wild-type human DLD, and its directly cleaved substrates in native human
    cells, remain incompletely established.
  boundary: Purified human wild-type and mutant DLD cleave frataxin-derived substrates, with
    mutagenesis separating cleavage from lipoyl redox catalysis. Independent human protein
    preparations cleave IκBε, and mouse N9/brain experiments link DLD to stress-associated
    IκBε loss. These findings establish conditional activity and a candidate cellular substrate
    mechanism, but do not yet define a general evolved proteolytic role in native human cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Distinguishing regulated native proteolysis from cleavage favored by preparation,
    dimer destabilization or pathology is necessary before treating it as a core DLD function.
  resolution: Demonstrate substrate cleavage by endogenous wild-type DLD in defined human
    cell conditions, measure the associated oligomeric state, and separate proteolysis from
    secondary redox or proteasome effects.
  provenance:
  - reference_id: PMID:17404228
  - reference_id: PMID:29128334
suggested_experiments:
- hypothesis: A defined change in wild-type DLD oligomeric state can expose conditional proteolysis
    in human cells without requiring a disease-associated interface mutation.
  description: 'Compare unstressed and defined mitochondrial-stress conditions in human cells
    with endogenous DLD, matched DLD depletion and rescue by wild type or a sequence-verified
    proteolysis-deficient variant. Quantify DLD abundance, localization, oligomeric state
    and lipoyl-redox activity; map IκBε and other candidate cleavage products by targeted
    mass spectrometry. Test purified preparations under matched native and dimer-destabilizing
    conditions, with no-enzyme, substrate-only and contamination controls, and distinguish
    direct cleavage from proteasomal degradation. Sequence-verify the cleavage-deficient variants:
    mature-chain S456A/E431A correspond to precursor S491A/E466A after accounting for the
    35-residue mitochondrial transit peptide.'
  experiment_type: Endogenous perturbation/rescue, cleavage-site proteomics and matched biochemical
    reconstitution
