- term:
    id: GO:0004175
    label: endopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:17404228
  qualifier: enables
  review:
    summary: Propose the experimentally supported conditional proteolytic activity.
    action: NEW
    reason: Human recombinant DLD cleaves internal frataxin-derived peptide bonds, with mutagenesis and
      inhibitor controls distinguishing this activity from dehydrogenase catalysis. Independent human
      DLD preparations cleave human IκBε in PMID:29128334. Activity depends on the preparation and dimer-interface
      context; it is not a constitutive housekeeping protease claim. GO:0004175 fits the measured chemistry
      without imposing the catalytic triad explicitly required by the current serine-type child definitions;
      the first study supports a serine/glutamate dyad. No existing source MF is an ancestor or descendant
      of this new proposal, and no accompanying process or compartment is proposed.
    supported_by:
    - reference_id: PMID:17404228
      supporting_text: enabled the mouse, pig, or human enzyme to function as a protease.
    - reference_id: PMID:29128334
core_functions:
- description: As a FAD-dependent homodimer, DLD reoxidizes reduced lipoyl groups on E2 or GCSH carrier
    proteins and reduces NAD+. The same catalytic unit supports several mitochondrial ketoacid-dehydrogenase
    systems and glycine cleavage; it performs lipoyl regeneration rather than the E1 decarboxylation or
    E2 acyl-transfer reactions.
