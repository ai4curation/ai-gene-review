- description: After BMP-receptor phosphorylation, SMAD9 joins BMP-responsive SMAD complexes that move to the nucleus,
    bind BRE DNA, and attenuate BMP signaling as a dominant-negative feedback regulator of RNA polymerase II
    transcription.
