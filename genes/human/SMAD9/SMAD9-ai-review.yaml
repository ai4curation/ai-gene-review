id: O15198
gene_symbol: SMAD9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SMAD9 is a BMP-branch receptor-regulated SMAD transcription factor and feedback attenuator. BMP-family type
  I serine/threonine kinase receptors phosphorylate SMAD9, enabling it to participate in SMAD complexes that accumulate in
  the nucleus and bind BMP-responsive cis-regulatory DNA through the MH1 domain; compared with SMAD1 and SMAD5, SMAD9 has
  a distinct linker region and can form dominant-negative complexes that dampen BMP-driven RNA polymerase II transcription.'
