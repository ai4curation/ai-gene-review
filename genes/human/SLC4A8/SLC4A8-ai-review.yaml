id: Q2Y0W8
gene_symbol: SLC4A8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC4A8 encodes the electroneutral sodium-driven chloride/bicarbonate exchanger
  NDCBE (NDCBE1, NBC3, k-NBC3), a multi-pass (~12 transmembrane) plasma-membrane
  protein of the SLC4 bicarbonate-transporter family. NDCBE couples inward
  movement of Na+ together with bicarbonate (HCO3-) to outward movement of
  chloride, producing an electroneutral, DIDS-sensitive, Na+- and
  HCO3--dependent exchange of Cl- for HCO3-. By importing base equivalents it is
  a potent acid-extrusion mechanism and a key regulator of intracellular pH. It
  is highly expressed in the nervous system (hippocampal pyramidal neurons,
  dendrites and neuronal processes, and glia), where it sets neuronal/glial pH
  and intracellular chloride, and in the kidney, where it contributes to
  transepithelial NaCl/bicarbonate handling in the distal nephron. The
  cytoplasmic regulatory N-terminal domain forms a homodimer, binds Zn2+ (which
  negatively modulates transport), and the protein's several N- and C-terminal
  splice variants (NDCBE-A/B/C/D) differ in functional transport rate.
