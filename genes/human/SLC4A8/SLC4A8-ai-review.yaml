  review:
    summary: >-
      InterPro2GO mapping from SLC4 bicarbonate-transporter family signatures to
      the generic anion-antiporter activity. Correct but less specific than the
      demonstrated coupled activity.
    action: MODIFY
    reason: >-
      NDCBE is a solute:inorganic anion antiporter, so the claim is true, but the
      gene's demonstrated activity is the complete, coupled Na+-driven exchange of
      chloride for bicarbonate, for which a more specific GO term exists
      (GO:0140892) and is already asserted on this gene (IBA/IEA). GO:0005452 is a
      true is_a ancestor of GO:0140892; refine to the specific supported term.
    proposed_replacement_terms:
    - id: GO:0140892
      label: sodium,bicarbonate:chloride antiporter activity
    supported_by:
    - reference_id: file:human/SLC4A8/SLC4A8-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: chloride-HCO3(-) exchange with a Na(+):HCO3(-) stoichiometry of 2:1
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      asserted_value: "Na(+):HCO3(-) stoichiometry of 2:1"
      corrected_value: "Na(+):HCO3(-) stoichiometry of 1:2 (1 Na+ : 2 HCO3-)"
      confidence: PROBABLE
      requested_change: CHECK
      explanation: >-
        The UniProt CC FUNCTION line states a "Na(+):HCO3(-) stoichiometry of 2:1", but this
        is inverted relative to UniProt's own CC CATALYTIC ACTIVITY reaction on the same entry
        (2 hydrogencarbonate + chloride + Na+ per cycle = 1 Na+ : 2 HCO3-) and to the primary
        literature (PMID:11133997 states the stoichiometry is 1:2). NDCBE imports 1 Na+ with 2
        HCO3- in exchange for Cl-. Requesting the resource verify and correct the FUNCTION text.
      supported_by:
      - reference_id: file:human/SLC4A8/SLC4A8-uniprot.txt
        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: 'Reaction=2 hydrogencarbonate(out) + chloride(in) + Na(+)(out) = 2'
      - reference_id: PMID:11133997
        supporting_text: requires extracellular Na(+). The Na(+):HCO3(-) stoichiometry is 1:2.
