suggested_questions:
- question: >-
    In which human nephron segments and membrane domains (apical vs basolateral) is NDCBE expressed,
    and what is its quantitative contribution to distal-nephron NaCl reabsorption relative to the
    pendrin/NDCBE thiazide-sensitive pathway?
  experts: []
- question: >-
    Does IRBIT and/or 14-3-3 binding to the NDCBE N- and C-termini regulate its transport activity and
    trafficking in neurons, and is this isoform-dependent (NDCBE-A/B vs -C/D)?
  experts:
  - Parker MD
  - Boron WF
suggested_experiments:
- hypothesis: >-
    NDCBE sets the resting intracellular chloride and pH of hippocampal dendrites, thereby shaping
    GABAergic signalling and neuronal excitability.
  description: >-
    Combine SLC4A8 conditional knockout or knockdown in hippocampal neurons with simultaneous
    pH- and chloride-sensitive imaging (and GABA reversal-potential measurements) to quantify the
    direct contribution of NDCBE to dendritic pH/chloride homeostasis and its downstream effect on
    synaptic signalling.
  experiment_type: electrophysiology / live-cell ion imaging in conditional knockout neurons
- hypothesis: >-
    Zn2+ binding to the cytoplasmic regulatory domain is a physiological modulator of NDCBE transport.
  description: >-
    Measure NDCBE transport activity (pHi recovery, 36Cl flux) as a function of intracellular free Zn2+
    in wild-type vs Zn2+-site mutants (H167A/H169A/W80F) to determine whether Zn2+ regulation operates at
    physiological concentrations.
  experiment_type: structure-function transport assay
knowledge_gaps:
- gap_statement: >-
    The quantitative role of NDCBE in human distal-nephron NaCl reabsorption and its interplay with
    pendrin (the thiazide-sensitive electroneutral NaCl pathway) are not established in humans.
  boundary: >-
    NDCBE catalyses electroneutral Na+-driven chloride/bicarbonate exchange and is expressed in kidney;
    a pendrin/NDCBE-coupled NaCl-reabsorption pathway is characterized in rodent models.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    This pathway is a candidate target for diuretic therapy and blood-pressure regulation; its human
    relevance and magnitude are unresolved.
