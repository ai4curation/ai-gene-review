core_functions:
- description: 'Death-domain signalling adaptor of the Myddosome: recruited by MYD88-IRAK4 after IL-1R/TLR
    activation and, once phosphorylated by IRAK4, couples the receptor complex to TRAF6 ubiquitination
    and NF-kappaB activation, largely independently of its own weak catalytic activity.'
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
  - id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  - id: GO:0007249
    label: canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1902554
    label: serine/threonine protein kinase complex
  supported_by:
  - reference_id: PMID:20485341
    supporting_text: 'Instead, IRAK2 DD interacts with the MyD88: IRAK4 complex.'
  - reference_id: PMID:17878161
    supporting_text: Expression of IRAK-2, but not IRAK-1, led to TRAF6 ubiquitination, an event critical
      for NFkappaB activation.
  - reference_id: PMID:10383454
    supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation activity,
      they can reconstitute the IL-1 response in a 293 mutant cell line lacking IRAK.
  - reference_id: PMID:9374458
    supporting_text: Dominant negative forms of either attenuate IL-1R-mediated NF-kappaB activation.
suggested_questions:
- question: Does human IRAK2 have physiologically relevant protein kinase activity (mouse studies report
    atypical activity and S136/T140 autophosphorylation), and if so what are its substrates beyond itself?
- question: What experiment underlies the IMP annotation of IRAK2 to negative regulation of canonical
    NF-kappaB signal transduction from PMID:10383454, given that the abstract reports IRAK2 reconstituting
    IL-1 signalling?
- question: Why does IRAK2 dominate sustained myddosome signalling in mouse macrophages but appear largely
    redundant with IRAK1 in human macrophages?
suggested_experiments:
- description: Reconstitute IRAK1/IRAK2 double-knockout human macrophages with wild-type, K237A and N335D
    IRAK2 and compare TRAF6 ubiquitination, NF-kappaB activation and cytokine output to separate catalytic
    from scaffold functions.
- description: Use analog-sensitive IRAK2 and phosphoproteomics in human myeloid cells to test for direct
    IRAK2 substrates.
