- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: TAS
  original_reference_id: PMID:9374458
  qualifier: involved_in
  review:
    summary: TAS of protein phosphorylation from the paper identifying IRAK2 and MyD88 as proximal mediators
      of IL-1 signalling.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited abstract identifies IRAK2 as a required mediator of IL-1R-induced NF-kappaB activation
      but reports no kinase activity. In human assays IRAK2 shows only negligible autophosphorylation,
      and its kinase domain has Asn in place of the catalytic Asp. IRAK2 is itself phosphorylated by IRAK4
      (a substrate, not the phosphorylating agent). Later mouse work reports atypical kinase activity
      and autophosphorylation, but no physiological substrate has been established, and IRAK2 can reconstitute
      IL-1 signalling despite negligible activity. Its role is better captured as signaling adaptor activity;
      a protein phosphorylation process claim rests on weak, contested catalytic evidence.
    supported_by:
    - reference_id: PMID:10383454
      supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation activity,
        they can reconstitute the IL-1 response in a 293 mutant cell line lacking IRAK.
    - reference_id: file:human/IRAK2/IRAK2-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: Asn-335 is present instead of the conserved Asp which is expected to be an active
        site residue. This enzyme has been shown to be catalytically inactive.
    - reference_id: PMID:36865541
      supporting_text: Initially, IRAK2 was thought to be a pseudokinase due its low in vitro kinase activity
        and substitution of a key aspartate residue to asparagine in its kinase domain (45), but later
        studies rebutted this claim and demonstrated that IRAK2 does possess kinase activity, which is
        activated by IRAK4-mediated phosphorylation on its lysine 237.
