- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000719
  review:
    summary: InterPro2GO (protein kinase domain) mapping to ATP binding.
    action: KEEP_AS_NON_CORE
    reason: IRAK2 retains the ATP-binding lysine (K237) of the kinase fold, and mutating it abolishes
      cytokine induction in mouse cells, so nucleotide binding is likely. Its catalytic output is weak
      or atypical (Asn replaces the catalytic Asp) and its main role is as a signalling adaptor, so ATP
      binding is kept as non-core.
    supported_by:
    - reference_id: PMID:36865541
      supporting_text: Accordingly, point-mutated IRAK2 K237A fails to induce cytokine production, and
        no IRAK2 phosphorylation is observed in kinase-deficient IRAK4 macrophages (67, 77).
    - reference_id: file:human/IRAK2/IRAK2-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: Asn-335 is present instead of the conserved Asp which is expected to be an active
        site residue.
