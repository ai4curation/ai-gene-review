- term:
    id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:36865541
  qualifier: involved_in
  review:
    summary: NAS from a review of IRAK proteins in innate immune signalling.
    action: ACCEPT
    reason: IRAK2 is recruited by MYD88-IRAK4 into the myddosome after TLR stimulation and is required,
      redundantly with IRAK1, for MyD88-dependent TLR responses.
    supported_by:
    - reference_id: PMID:36865541
      supporting_text: The myddosome is a supramolecular signaling complex assembled upon dimerization
        of IL-1Rs and most TLRs (except TLR3), and is composed of MyD88, IRAK4, IRAK1 and/or IRAK2, in
        addition to TRAF6.
    - reference_id: PMID:38961291
      supporting_text: IRAK1 and IRAK2 appeared to be redundant, as double (but not single) knockouts
        abolished all responses to LPS
