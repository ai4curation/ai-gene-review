    label: regulation of cytokine-mediated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:10383454
  qualifier: involved_in
  review:
    summary: IMP of regulation of cytokine-mediated signaling pathway; IRAK2 reconstitutes the IL-1 response
      in IRAK1-deficient 293 cells.
    action: MODIFY
    reason: The experiment shows IRAK2 is a component that can carry the IL-1 signal, i.e. it participates
      in IL-1 signalling rather than regulating a cytokine pathway from outside. The specific pathway
      term is interleukin-1-mediated signaling pathway, which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0070498
      label: interleukin-1-mediated signaling pathway
    supported_by:
    - reference_id: PMID:10383454
      supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation activity,
        they can reconstitute the IL-1 response in a 293 mutant cell line lacking IRAK.
- term:
    id: GO:0002224
    label: toll-like receptor signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:38961291
  qualifier: involved_in
  review:
    summary: NAS of toll-like receptor signaling pathway from a study of endogenous TLR signalling (myddosome
