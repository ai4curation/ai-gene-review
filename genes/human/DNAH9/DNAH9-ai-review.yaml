    action: MODIFY
    reason: >-
      The interaction is real and informative: it is proposed to dock type 2 ODAs onto the
      doublet. Protein binding says nothing about this. ODAD1 is a subunit of the outer dynein
      arm docking complex (GO:0120228), so protein-containing complex binding is the closest
      informative existing term; a dedicated docking-complex binding term does not exist (see
      suggested_questions).
