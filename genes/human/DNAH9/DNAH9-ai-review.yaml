core_functions:
- description: >-
    Beta heavy chain and motor of the distal (type 2) outer dynein arms of respiratory cilia,
    partnered with DNAH5; minus-end-directed microtubule motor that powers beating of the
    distal ciliary segment. Its N-terminal tail binds the docking complex subunit ODAD1 (CCDC114),
    DNAH5 and DNAI2, and it is needed for distal ODAs to assemble. Expressed in nodal pit
    cells and required for normal left-right patterning.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0003351
    label: epithelial cilium movement involved in extracellular fluid movement
  locations:
  - id: GO:0120135
    label: distal portion of axoneme
  in_complex:
    id: GO:0036157
    label: outer dynein arm
  supported_by:
  - reference_id: PMID:30471717
    supporting_text: >-
      DNAH9 and its partner heavy chain DNAH5 localize to type 2 ODAs of the distal cilium
  - reference_id: PMID:30471717
    supporting_text: >-
      This confers a reduced beating frequency with a subtle beating pattern defect affecting
      the motility of the distal cilia portion.
  - reference_id: PMID:30471718
    supporting_text: >-
      We conclude that DNAH9 is essential for ODA type 2 assembly and our data indicate that
      docking of ODAs type 2 occurs via direct interaction of DNAH9 with the docking complex
      protein CCDC114.
  - reference_id: PMID:30471718
    supporting_text: >-
      Consistent with laterality defects in DNAH9 mutant individuals, we show by in situ hybridization
      that Dnah9 is expressed in pit cells of the mouse embryonic ventral node
  - reference_id: PMID:31178125
    supporting_text: >-
      the outer dynein arms (ODAs), through ATPase activity of their heavy chains (HCs), play
      a major role for cilia and flagella beating
suggested_questions:
- question: >-
    Is DNAH9 present in human sperm? PMID:31178125 reports DNAH9 absent from the sperm axoneme,
    while HPA immunofluorescence and a DNAH3 study were curated as sperm end piece/sperm flagellum.
    Could the antibodies cross-react with DNAH17?
- question: >-
    Should GO have a molecular function term for binding the outer dynein arm docking complex,
    to replace the protein binding annotation for the DNAH9-ODAD1 interaction?
- question: >-
    Why do the outer-arm beta heavy chains (DNAH9, DNAH11, DNAH17) receive only the generic
    dynein complex IBA, while the gamma chain DNAH5 inherits outer dynein arm and outer dynein
    arm assembly from node PTN002472868? Could an equivalent beta-chain node carry these terms?
suggested_experiments:
- description: >-
    Map the DNAH9-ODAD1 interface by crosslinking mass spectrometry or structure of the distal
    ODA-docking complex, and test docking-deficient DNAH9 mutants in airway cell rescue.
  experiment_type: structural biology and rescue
- description: >-
    Immunostain human sperm with several independent DNAH9 antibodies and DNAH9-null controls
    to settle whether DNAH9 is present in the sperm flagellum.
  experiment_type: immunofluorescence with genetic controls
