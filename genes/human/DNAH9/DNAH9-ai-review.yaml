id: Q9NYC9
gene_symbol: DNAH9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH9 (dynein axonemal heavy chain 9) is a beta-type heavy chain of the outer dynein arm
  (ODA), the ATPase motor that drives the beating of motile cilia by sliding outer doublet
  microtubules towards their minus ends. It has the dynein heavy chain architecture of an
  N-terminal tail that assembles into the arm and a C-terminal AAA+ motor head with a microtubule-binding
  stalk. In human respiratory cilia DNAH9 is restricted to the distal part of the axoneme,
  where it forms type 2 ODAs together with the gamma chain DNAH5 and the intermediate chain
  DNAI2; the proximal ODAs instead contain its paralog DNAH11, and human sperm ODAs contain
  a third beta paralog, DNAH17. DNAH9 binds the ODA docking complex subunit ODAD1 (CCDC114)
  through its N-terminal tail, which is thought to dock distal ODAs onto the doublet. DNAH9
  is expressed early in airway ciliogenesis, before cilia appear, and in pit cells of the
  embryonic node. Biallelic loss-of-function variants cause primary ciliary dyskinesia 40
  (CILD40). Distal type 2 ODAs are lost, cilia beat more slowly with a subtle waveform defect,
  and respiratory symptoms are mild, but situs inversus and other laterality defects are common.
