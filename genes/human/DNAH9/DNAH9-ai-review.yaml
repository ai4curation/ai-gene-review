  review:
    summary: >-
      PAINT annotation of cilium movement involved in cell motility at node PTN000743491,
      grounded largely in sperm-flagellar and protist dynein heavy chains.
    action: MODIFY
    reason: >-
      The node placement is reasonable for the dynein family as a whole, but DNAH9 is a respiratory-type
      outer dynein arm heavy chain. It is absent from the human sperm axoneme, where DNAH8
      and DNAH17 replace it, so in humans it drives cilia that move fluid (airway, and nodal
      cilia for left-right patterning) rather than cells. Cilium movement that moves extracellular
      fluid is the accurate process.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000743491
        source_label: PTN000743491
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Function holds for sperm-flagellar and protist dynein heavy chains; the human respiratory
          ODA heavy chains act in fluid-moving cilia.
    proposed_replacement_terms:
    - id: GO:0003351
      label: epithelial cilium movement involved in extracellular fluid movement
    supported_by:
    - reference_id: PMID:31178125
      supporting_text: >-
        We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin
        along the sperm axoneme, whereas the reverse picture is observed in respiratory cilia
