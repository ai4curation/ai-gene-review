- term:
    id: GO:0051959
    label: dynein light intermediate chain binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:103147
  - PANTHER:PTN000743491
  - RGD:71042
  - UniProtKB:Q14204
  review:
    summary: >-
      PAINT places light intermediate chain binding at the deep dynein heavy chain node PTN000743491.
      All the descendant experimental evidence comes from cytoplasmic dynein 1 heavy chain
      (human DYNC1H1, mouse and rat Dync1h1).
    action: REMOVE
    reason: >-
      Premise: the outer dynein arm contains no light intermediate chain subunit. It is built
      from heavy, intermediate and light chains (UniProt SUBUNIT, quoted below), whereas light
      intermediate chains (DYNC1LI1/2, DYNC2LI1) are subunits of cytoplasmic dyneins. An ODA
      heavy chain therefore has no light intermediate chain partner to bind, so the claim is
      not merely under-evidenced but unlikely to be correct. The PAINT node is too deep for
      this function: every WITH/FROM donor is a cytoplasmic dynein 1 heavy chain, and the
      axonemal ODA heavy-chain branch should not inherit the activity. This is an electronic
      inference contradicted on structural grounds, so REMOVE rather than
      MARK_AS_OVER_ANNOTATED.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000743491
        source_label: PTN000743491
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Deep dynein heavy chain node; light intermediate chain binding is grounded only
          in cytoplasmic dynein 1 heavy chains.
      - source_id: UniProtKB:Q14204
        source_label: DYNC1H1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Cytoplasmic dynein 1 heavy chain binds DYNC1LI1/2; axonemal outer arm dyneins have
          no LIC subunit.
