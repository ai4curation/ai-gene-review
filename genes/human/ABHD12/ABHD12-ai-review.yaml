core_functions:
- description: Hydrolyzes the sn-1 acyl ester of lysophosphatidylserine, controlling a bioactive lipid
    pool at the endoplasmic reticulum. Human assays establish this reaction; patient cells and mouse studies
    connect its loss to disrupted lipid homeostasis.
  molecular_function:
    id: GO:0120560
    label: phosphatidylserine lysophospholipase A1 activity
  directly_involved_in:
  - id: GO:0046475
    label: glycerophospholipid catabolic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:25290914
    supporting_text: hABHD12 catalyzed oleic acid release from LPS but not from LPA
  - reference_id: PMID:30237167
    supporting_text: hABHD12 has lyso-PS > 1-MAG > 2-MAG lipid substrate preference
  - reference_id: PMID:30237167
    supporting_text: mammalian ABHD12 has a predominant ER membrane localization
  - reference_id: PMID:25580854
- description: Hydrolyzes oxidized sn-2 acyl chains of phosphatidylserine to fatty acid and lysoPS, limiting
    oxidized lipid accumulation during oxidative/inflammatory stress. The demonstrated chemistry is distinct
    from hydrolysis of unoxidized diacyl phosphatidylserine.
  molecular_function:
    id: GO:0004623
    label: A2-type glycerophospholipase activity
  directly_involved_in:
  - id: GO:0006660
    label: phosphatidylserine catabolic process
  supported_by:
  - reference_id: PMID:30643283
    supporting_text: WT hABHD12 efficiently hydrolyzes lyso-PS and oxidized PS, at comparable rates, with
      no activity against PS
  - reference_id: PMID:30643283
    supporting_text: For PS and oxidized PS, quantifying both products yielded similar rates of product
      release.
suggested_questions:
- question: How do endogenous human ABHD12 pools partition between ER, cell surface and neuronal receptor-associated
    compartments, and which pools access secreted versus intracellular lipid substrates?
- question: What is the physiological contribution of human ABHD12 to protein depalmitoylation compared
    with ABHD17 enzymes, beyond the mouse-protein heterologous screen?
- question: Which cell states make 2-AG hydrolysis quantitatively important, and how do MAG, lysoPS and
    oxidized-PS turnover combine to shape context-dependent immune responses?
- question: Do the three annotated human alternative products differ in expression, membrane orientation
    or substrate activity? The reviewed GOA rows do not resolve an isoform-specific function.
