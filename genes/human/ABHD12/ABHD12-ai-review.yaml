  - PANTHER:PTN000957701
  - UniProtKB:Q8N2K0
  review:
    summary: MAG catabolism is a supported secondary lipid reaction.
    action: KEEP_AS_NON_CORE
    reason: ABHD12 itself cleaves monoacylglycerol ester bonds, providing direct process participation.
      The human substrate assays support this assertion, while lysoPS turnover is its major established
      homeostatic role. Retain the source assertion and its contextual endocannabinoid contribution; limited
      bulk-brain 2-AG effects do not disprove cell-specific MAG turnover.
    supported_by:
    - reference_id: PMID:22969151
    - reference_id: PMID:30237167
      supporting_text: hABHD12 has lyso-PS > 1-MAG > 2-MAG lipid substrate preference
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000957701
        source_status: SUPPORTS_TRANSFER
        comment: The seeded PAINT ancestral node carries the inherited assertion. Direct human experiments
          support this activity or compartment; target self-evidence is legitimate descendant evidence,
          not circularity. The imported PTHR12277 family inventory distinguishes ABHD12 from ABHD12B,
          but no uninspected branch placement is inferred from that inventory.
