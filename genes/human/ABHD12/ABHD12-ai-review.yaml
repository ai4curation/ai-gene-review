- term:
    id: GO:0050727
    label: regulation of inflammatory response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q99LR1
  - ensembl:ENSMUSP00000053558
  review:
    summary: Degradation of immunomodulatory lipids contributes to inflammatory regulation.
    action: KEEP_AS_NON_CORE
    reason: 'In PMID:25580854, thioglycollate-elicited mouse peritoneal macrophages lacking
      Abhd12 have elevated secreted lysoPS and cytokine release, and reducing ABHD16A-dependent
      lipid production suppresses these changes. PMID:30420694 adds active DO264 versus inactive
      (S)-DO271 controls, primary-human-macrophage lipid measurements, and heightened inflammatory
      lung responses in DO264-treated or Abhd12-null mice during LCMV clone 13 infection.
      These connect ABHD12 lipid degradation to inflammatory regulation without assigning
      cytokine-receptor activity. Retain the broad ortholog process as contextual: species,
      cell state, lipid substrate and stimulus constrain the immune direction.'
    supported_by:
    - reference_id: PMID:25580854
      supporting_text: ABHD12−/− macrophages produced greater amounts of cytokines, both basally
        and in response to LPS stimulation
    - reference_id: PMID:30420694
      supporting_text: both DO264-treated and ABHD12-/- mice displayed heightened immunological
        responses to lymphocytic choriomeningitis virus (LCMV) clone 13 infection
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q99LR1
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Q99LR1 participates in immunomodulatory lipid degradation. Primary
          human macrophage inhibition supports a conserved lipid-control mechanism, while
          organismal immune outcomes remain context dependent.
      - source_id: ensembl:ENSMUSP00000053558
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Q99LR1 participates in immunomodulatory lipid degradation. Primary
          human macrophage inhibition supports a conserved lipid-control mechanism, while
          organismal immune outcomes remain context dependent.
- term:
    id: GO:0052651
    label: monoacylglycerol catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
