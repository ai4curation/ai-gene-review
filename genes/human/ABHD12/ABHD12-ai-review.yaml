  review:
    summary: The inferred depalmitoylation process is an obsolete duplicate of molecular-function
      coverage.
    action: REMOVE
    reason: The seeded term is explicitly obsolete. The GO editors confirm in go-ontology
      issue 32290 and go-announcements issue 1174 that this activity should be represented
      as molecular function rather than this biological process. Remove the inferred BP while
      preserving the separately assessed GO:0008474 source row, now marked over-annotated
      at the human target. This does not negate the mouse PSD-95 palmitoylation experiment.
    supported_by:
