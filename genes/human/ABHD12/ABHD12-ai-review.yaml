id: Q8N2K0
gene_symbol: ABHD12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABHD12 is a membrane-associated serine hydrolase that degrades lysophosphatidylserine and
  oxidized phosphatidylserine. It is enriched at the endoplasmic reticulum and controls bioactive lipid
  pools implicated in neural and immune homeostasis. The human enzyme also hydrolyzes monoacylglycerols,
  including the endocannabinoid 2-arachidonoylglycerol; the importance of this activity depends on cell
  type and activation state. Its catalytic serine, aspartate and histidine residues and glycosylation
  support lipid hydrolysis. Biallelic loss-of-function variants cause PHARC, a progressive disorder featuring
  polyneuropathy, hearing loss, ataxia, retinitis pigmentosa and cataract.
