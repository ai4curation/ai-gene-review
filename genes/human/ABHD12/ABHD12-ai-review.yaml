- term:
    id: GO:0008474
    label: palmitoyl-(protein) hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q99LR1
  - ensembl:ENSMUSP00000053558
  review:
    summary: Mouse ABHD12 expression changes PSD-95 palmitate labeling, but direct human protein
      depalmitoylase chemistry is not established.
    action: MARK_AS_OVER_ANNOTATED
    reason: The MGI-linked mouse Abhd12 NM_024465 construct in PMID:27307232 reduces PSD-95
      palmitate labeling in HEK293T cells. This positive screen is preserved. However, the
      ABHD12 experiment does not isolate protein-thioester hydrolysis with ABHD12 catalytic-mutant
      or purified-substrate controls; the detailed catalytic and neuronal tests concern ABHD17.
      PMID:25580854 supports a lumenal/extracellular ABHD12 catalytic domain, consistent with
      the human UniProt topology placing catalytic residues 246/333/372 within residues 96-398.
      That orientation separates the active site from cytosolic PSD-95 palmitoyl cysteines,
      so the cellular labeling change does not by itself establish direct access and hydrolysis.
      GO:0008474 explicitly asserts palmitoyl-protein hydrolysis. Its transfer as a demonstrated
      human molecular function overstates this evidence; an indirect lipid effect or altered
      topology under overexpression is possible but was not demonstrated. This does not declare
      the mouse screen false or prove that no protein substrate can ever be hydrolyzed.
    supported_by:
    - reference_id: PMID:27307232
    - reference_id: PMID:25580854
      supporting_text: recombinant ABHD12, which showed detergent-dependent sensitivity to
        trypsin degradation
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q99LR1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The recorded mouse donor and its screen are real. Reduced PSD-95 palmitate
          labeling is an indirect cellular readout; ABHD12-specific catalytic controls and
          substrate access are unresolved, and lumenal catalytic topology limits the inference
          to direct human protein depalmitoylase chemistry. This is not a wrong-identifier
          or falsified-donor claim.
      - source_id: ensembl:ENSMUSP00000053558
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The recorded mouse donor and its screen are real. Reduced PSD-95 palmitate
          labeling is an indirect cellular readout; ABHD12-specific catalytic controls and
