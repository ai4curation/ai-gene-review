    label: glycerophospholipid catabolic process
  evidence_type: IDA
  original_reference_id: PMID:25290914
  qualifier: involved_in
  review:
    summary: Human ABHD12 directly degrades a glycerophospholipid substrate.
    action: ACCEPT
    reason: The cited PMID:25290914 human ABHD12 control releases oleate from 1-oleoyl-lysoPS. Lysophospholipids
      satisfy the GO definition of glycerophospholipids, which requires at least one O-acyl, O-alkyl or
      O-alkenyl group. Thus this process is directly performed by ABHD12 and is not inferred merely from
      a mutant phenotype.
