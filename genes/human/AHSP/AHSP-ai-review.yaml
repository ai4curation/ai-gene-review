    summary: >-
      Yeast two-hybrid screen hit with ZC3H12A (Regnase-1), an immune-cell endoribonuclease, from
      the CCSB human interactome pipeline. IntAct records this partner from two publications
      (PMID:16189514 and PMID:25416956) but both are CCSB Y2H against the same human ORFeome, so
      the repeat is assay reproducibility rather than orthogonal confirmation. MI-score 0.67.
