- term:
    id: GO:0005833
    label: hemoglobin complex
  evidence_type: NAS
  original_reference_id: PMID:12066189
  qualifier: part_of
  review:
    summary: >-
      The one clearly wrong annotation on this gene. AHSP is asserted to be part_of the
      haemoglobin complex, citing the discovery paper - whose own abstract states that AHSP forms
      a complex with free alpha-haemoglobin but NOT with haemoglobin A.
    action: REMOVE
    reason: >-
      Three independent grounds. (1) The cited reference says the opposite: AHSP forms a stable
      complex with free alpha-haemoglobin but not with beta-haemoglobin or haemoglobin A
      (alpha2beta2). (2) UniProt says the opposite, from two curated crystallographic papers.
      (3) The term definition excludes it - GO:0005833 is "an iron-containing, oxygen carrying
      complex... made up of two pairs of associated globin polypeptide chains", whereas the AHSP
      complex is a 1:1 heterodimer of one non-globin chain with one globin chain, and it is
      specifically not oxygen-carrying because binding drives the haem iron into the inert
      hexacoordinate ferric state. NAS is a non-experimental author-statement code, so the rule
      against overruling an unverifiable experimental call does not apply. The useful part of this
      finding is the cause: GO has no term for the complex AHSP actually forms, so the nearest
      available CC term was the tetramer - see proposed_new_terms.
    supported_by:
    - reference_id: PMID:12066189
      supporting_text: Stabilizing Protein (AHSP) is an abundant, erythroid-specific protein that
        forms a stable complex with free alpha-haemoglobin but not with beta-haemoglobin or
        haemoglobin A (alpha(2)beta(2)).
    - reference_id: PMID:12192002
      supporting_text: AHSP and alpha-globin are both monomeric in solution as determined by
        analytical ultracentrifugation and bind each other to form a complex with 1:1 subunit
        stoichiometry
