- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15550245
  qualifier: enables
  supporting_entities:
  - UniProtKB:P69905
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P69905
      label: HBA1/HBA2
  review:
    summary: >-
      The strongest binding datum AHSP has, and bare protein binding is the wrong term for it.
      This row records a 2.8 A crystal structure of AHSP bound to Fe(II) alpha-haemoglobin
      (PDB 1Y01), which maps the interface to the G and H helices of the globin and shows it
      recapitulating the alpha1-beta1 contact of HbA.
    action: MODIFY
    reason: >-
      CLAUDE.md forbids leaving an uninformative protein binding term where a more specific one
      exists, and a co-crystal structure is the strongest evidence a binding annotation can rest
      on. GO:0030492 hemoglobin binding is the most specific available term (its broad synonym is
      "globin binding"); no alpha-globin-specific or free-globin-chain binding term exists in GO.
      The partner is recorded machine-readably as a has_input extension so the substrate identity
      is not lost in the generalisation. Note the definitional imprecision carried over: GO:0030492
      is defined around the four-haem tetramer, which AHSP explicitly does not bind - see the
      GO:0030492 rows and the ONTOLOGY knowledge gap.
    proposed_replacement_terms:
    - id: GO:0030492
      label: hemoglobin binding
    supported_by:
    - reference_id: PMID:15550245
      supporting_text: The crystal structure of AHSP bound to Fe(II)-alphaHb reveals that AHSP
        specifically recognizes the G and H helices of alphaHb through a hydrophobic interface
        that largely recapitulates the alpha1-beta1 interface of hemoglobin.
    - reference_id: PMID:15550245
      supporting_text: The AHSP-alphaHb interactions are extensive but suboptimal, explaining why
        beta-hemoglobin can competitively displace AHSP to form HbA.
