      label: HBA1/HBA2
  review:
    summary: >-
      Proposed molecular function. UniProt annotates AHSP with the Chaperone keyword and GOA
      carries GO:0006457 protein folding as a process, but the gene has no chaperone molecular
      function at all - the only MF terms present are protein binding and hemoglobin binding. This
      row closes that gap with the term GO itself designates as the replacement for the obsoleted
      GO:0051082 unfolded protein binding.
    action: NEW
    reason: >-
      Direct evidence with purified human components: recombinant full-length human AHSP (102
      residues) and alpha-globin prepared from human blood. AHSP dissociates soluble apo-alpha
      aggregates, forms a 1:1 heterodimer, and shifts the globin from unfolded to partially folded
      forms. GO:0051082 was checked at QuickGO and is obsolete with no replaced_by, listing
      GO:0044183 and GO:0140309 under "consider"; GO:0140309 was rejected because its definition
      is a protein carrier activity that "escorts" the client and its term comment requires the
      client to be kept unfolded, neither of which AHSP does. GO:0044183 is the honest partial fit
      - the folding it produces is partial and haem-dependent rather than to the native state, so
      the residual mismatch is filed as an ONTOLOGY knowledge gap with a proposed term rather than
      being papered over. Species discipline: IDA rather than IMP because the assay is
      biochemical, and human rather than mouse material throughout.
    supported_by:
    - reference_id: PMID:20860551
      supporting_text: AHSP forms a heterodimeric complex with αo that inhibits αo aggregation and
        promotes αo folding in the absence of haem.
    - reference_id: PMID:20860551
      supporting_text: Addition of AHSP leads to dissociation of soluble αo aggregates, formation
        of a stable αo:AHSP dimer, and a dramatic shift from unfolded to partially folded forms of
        αo.
    - reference_id: PMID:20860551
      supporting_text: Hb A, αh and βh were obtained from human blood.
    - reference_id: PMID:12192002
      supporting_text: AHSP and alpha-globin are both monomeric in solution as determined by
        analytical ultracentrifugation and bind each other to form a complex with 1:1 subunit
        stoichiometry
- term:
    id: GO:1903427
    label: negative regulation of reactive oxygen species biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:23264625
  qualifier: involved_in
  review:
    summary: >-
      Proposed process term for the redox arm of AHSP's function, which GOA does not represent at
      all. Binding to AHSP converts the alpha-subunit haem iron to a bis-histidyl hexacoordinate
      ferric state that is chemically inert: it lowers the subunit redox potential from +40 to -78
      mV, slows the reaction of the iron with hydrogen peroxide, and abolishes detectable ferryl
      haem and protein-based radicals.
    action: NEW
    reason: >-
      The generic ROS term is the correct choice here rather than a species-specific child,
      because the literature implicates several species in sequence - autoxidation by molecular
      oxygen, hydrogen peroxide, ferryl haem and protein-based radicals - and no single one is the
      target. GO:1903427 was verified at QuickGO to be current and a descendant of GO:2000378, and
      the more specific biosynthetic branch is used because what AHSP suppresses is the generation
      of the species, not their downstream metabolism. The molecular-function framing was tested
      and rejected: GO:0016209 antioxidant activity requires the annotated entity to be itself
      more easily oxidized than the substance it protects or to trap free radicals, and all seven
      of its children are redox enzymes, whereas AHSP has no redox-active group and acts by
      remodelling its client's haem coordination sphere. That mismatch is filed as an ONTOLOGY
      knowledge gap. Evidence is IDA on purified human AHSP and human HbA alpha-subunits; a human
      IMP is independently available from AHSP knockdown in K562 and CD34+ erythroblasts and is
      cited as additional support rather than as a second row.
    additional_reference_ids:
    - PMID:15931225
    - PMID:26995402
    - PMID:18179859
    supported_by:
    - reference_id: PMID:23264625
      supporting_text: AHSP binding also dramatically reduces the redox potential of α-subunits,
        from +40 to -78 mV in 1 m glycine buffer, pH 6.0, at 8 °C, demonstrating independently
        that AHSP has a much higher affinity for Fe(III) versus Fe(II) α-subunits.
    - reference_id: PMID:15931225
      supporting_text: The alpha-haemoglobin-stabilizing protein (AHSP) binds alpha-haemoglobin
        (alphaHb), inhibits the ability of alphaHb to generate reactive oxygen species and
        prevents its precipitation on exposure to oxidant stress.
    - reference_id: PMID:26995402
      supporting_text: In the presence of Alpha-hemoglobin stabilizing protein (AHSP), which
        stabilizes the α-subunit in a redox inactive hexacoordinate conformation (thus unable to
        undergo the redox ferric/ferryl transition), Cys93 oxidation was substantially reduced in
        both proteins.
    - reference_id: PMID:18179859
      supporting_text: AHSP-knockdown cells demonstrated an increased ROS production and increased
        rate of apoptosis.
