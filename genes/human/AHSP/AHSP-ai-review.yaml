- term:
    id: GO:0020027
    label: hemoglobin metabolic process
  evidence_type: NAS
  original_reference_id: PMID:12066189
  qualifier: involved_in
  review:
    summary: >-
      A correct but unnecessarily vague parent term. What AHSP participates in is specifically the
      formation of haemoglobin, not its turnover or catabolism: it chaperones the alpha subunit
      into the tetramer and is required for normal haemoglobin production in human erythroid
      cells.
    action: MODIFY
    reason: >-
      GO:0042541 hemoglobin biosynthetic process was verified to be a descendant of GO:0020027 via
      QuickGO ancestors, so this is a specificity upgrade within the same branch rather than a
      change of meaning, and it removes the implication that AHSP is involved in haemoglobin
      catabolism, for which there is no evidence. Human support: shRNA knockdown of AHSP in
      hemin-induced K562 cells and EPO-induced CD34+ erythroblasts caused alpha-globin
      precipitation and a significant fall in haemoglobin formation.
    proposed_replacement_terms:
    - id: GO:0042541
      label: hemoglobin biosynthetic process
    supported_by:
    - reference_id: PMID:18179859
      supporting_text: RNA interference-mediated knockdown of AHSP expression resulted in
        considerable alphaHb precipitation, as well as in a significant decrease in HbF formation.
