core_functions:
- description: >-
    Chaperoning of free alpha-globin. AHSP binds monomeric alpha-globin 1:1 through a hydrophobic
    surface that reproduces the alpha1-beta1 contact of haemoglobin A, engaging the G and H
    helices of the globin. With haem-free alpha-globin it dissociates soluble aggregates and
    shifts the chain from an unfolded ensemble into a partially folded, haem-receptive state; with
    haem-loaded alpha-globin it holds the folded subunit soluble. Because the interface is
    deliberately weaker than the alpha1-beta1 contact it mimics, beta-globin displaces AHSP
    competitively, so the outcome of chaperoning is delivery into the HbA tetramer rather than
    sequestration. GO cannot express this cleanly: the folding produced is partial rather than
    native, and AHSP neither keeps its client unfolded nor translocates it, so GO:0044183 is used
    as the closest available term and the residual gap is recorded below.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  substrates:
  - id: UniProtKB:P69905
    label: HBA1/HBA2
  directly_involved_in:
  - id: GO:0050821
    label: protein stabilization
  - id: GO:0006457
    label: protein folding
  - id: GO:0042541
    label: hemoglobin biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15550245
    supporting_text: The crystal structure of AHSP bound to Fe(II)-alphaHb reveals that AHSP
      specifically recognizes the G and H helices of alphaHb through a hydrophobic interface that
      largely recapitulates the alpha1-beta1 interface of hemoglobin.
  - reference_id: PMID:15550245
    supporting_text: The AHSP-alphaHb interactions are extensive but suboptimal, explaining why
      beta-hemoglobin can competitively displace AHSP to form HbA.
  - reference_id: PMID:20860551
    supporting_text: AHSP forms a heterodimeric complex with αo that inhibits αo aggregation and
      promotes αo folding in the absence of haem.
  - reference_id: PMID:16901899
    supporting_text: The addition of betaHb to either Fe(II) or Fe(III) alphaHb.AHSP displaces
      AHSP to generate tetrameric (alpha(2)beta(2)) HbA species.
  - reference_id: PMID:12066189
    supporting_text: Moreover, AHSP specifically protects free alpha-haemoglobin from
      precipitation in solution and in live cells.
- description: >-
    Suppression of the haem redox chemistry of the bound alpha subunit. Binding remodels the haem
    pocket of alpha-globin so that both the proximal and the distal histidine coordinate the iron,
    a bis-histidyl hexacoordinate ferric state that is chemically inert. The consequences are
    measured: the subunit redox potential falls from +40 to -78 mV, the rate of reaction with
    hydrogen peroxide drops, ferryl haem and protein-based radicals become undetectable, and haem
    loss and precipitation are blocked, so the trapped subunit can later be reduced and recycled
    into functional HbA. The protection extends to the partner beta subunit, reducing betaCys93
    oxidation in HbA and HbE. This is an activity of the complex rather than of AHSP's own
    chemistry, so it is expressed here through the binding function and a process term; GO has no
    molecular function for it.
  molecular_function:
    id: GO:0030492
    label: hemoglobin binding
  substrates:
  - id: UniProtKB:P69905
    label: HBA1/HBA2
  directly_involved_in:
  - id: GO:1903427
    label: negative regulation of reactive oxygen species biosynthetic process
  - id: GO:0050821
    label: protein stabilization
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15931225
    supporting_text: Our findings reveal a striking bis-histidyl configuration in which both the
      proximal and the distal histidines coordinate the haem iron atom.
  - reference_id: PMID:15931225
    supporting_text: Moreover, conversion to the ferric bis-histidine configuration strongly and
      specifically inhibits redox chemistry catalysis and haem loss from alphaHb.
  - reference_id: PMID:23264625
    supporting_text: AHSP binding also dramatically reduces the redox potential of α-subunits,
      from +40 to -78 mV in 1 m glycine buffer, pH 6.0, at 8 °C, demonstrating independently that
      AHSP has a much higher affinity for Fe(III) versus Fe(II) α-subunits.
  - reference_id: PMID:16901899
    supporting_text: In contrast to free Fe(III) alphaHb hemichromes, AHSP-bound Fe(III) alphaHb
      does not precipitate and can be recycled into functional HbA.
  - reference_id: PMID:26995402
    supporting_text: In the presence of Alpha-hemoglobin stabilizing protein (AHSP), which
      stabilizes the α-subunit in a redox inactive hexacoordinate conformation (thus unable to
      undergo the redox ferric/ferryl transition), Cys93 oxidation was substantially reduced in
      both proteins.
proposed_new_terms:
- proposed_name: globin chaperone activity
  proposed_definition: >-
    Binding to a free globin chain, holding it in a soluble, aggregation-resistant state in which
    the reactivity of its haem iron is suppressed, and releasing it to a partner globin subunit
    for assembly into a haemoglobin multimer.
  proposed_parent:
    id: GO:0140597
    label: protein carrier activity
  justification: >-
    GO's two chaperone molecular functions partition the space by the client's folding state and
    AHSP's client falls in neither. GO:0044183 protein folding chaperone is for binding an
    unfolded protein "to fold it"; GO:0140309 unfolded protein holdase activity is for binding an
    unfolded protein and keeping it unfolded while escorting it elsewhere. AHSP does neither: it
    converts apo-alpha-globin from unfolded to partially folded and holds it there, and it holds
    haem-loaded alpha-globin in a crystallographically ordered, fully helical state. GO already
    handles this shape of activity once - GO:0140713 histone chaperone activity sits under
    GO:0140597 and describes binding a folded client, keeping it soluble, and depositing it into
    its final assembly. The proposed term is its sibling with "nucleosome" replaced by
    "haemoglobin tetramer", and the clause about haem reactivity is what distinguishes it from a
    generic carrier: suppression of the client cofactor's redox chemistry is an integral part of
    the activity, not a downstream consequence, and no existing GO molecular function expresses it
    (GO:0016209 antioxidant activity requires the annotated entity to be itself oxidized or to
    trap radicals, which AHSP is not and does not).
  supported_by:
  - reference_id: PMID:20860551
    supporting_text: Addition of AHSP leads to dissociation of soluble αo aggregates, formation of
      a stable αo:AHSP dimer, and a dramatic shift from unfolded to partially folded forms of αo.
  - reference_id: PMID:15931225
    supporting_text: Moreover, conversion to the ferric bis-histidine configuration strongly and
      specifically inhibits redox chemistry catalysis and haem loss from alphaHb.
  - reference_id: PMID:16901899
    supporting_text: The addition of betaHb to either Fe(II) or Fe(III) alphaHb.AHSP displaces
      AHSP to generate tetrameric (alpha(2)beta(2)) HbA species.
- proposed_name: AHSP-alpha-globin complex
  proposed_definition: >-
    A heterodimeric protein complex of one molecule of alpha-haemoglobin-stabilizing protein and
    one free alpha-globin chain, in which the alpha-globin haem iron adopts a hexacoordinate
    configuration. The complex is an intermediate in haemoglobin assembly and is distinct from the
    haemoglobin complex, which it does not contain.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  justification: >-
    This complex is defined crystallographically in both oxidation states (PDB 1Y01 at 2.8 A,
    1Z8U at 2.4 A) and its 1:1 stoichiometry was measured independently by analytical
    ultracentrifugation, gel filtration and amino acid analysis. GO has no term for it: an OLS
    search returns nothing for AHSP or alpha-globin complexes. The absence is not merely a
    coverage gap, it produced a wrong annotation - the GO:0005833 hemoglobin complex NAS row
    removed in this review exists because a curator with a well-defined complex to record had only
    the tetramer term available, even though the reference being cited states in its abstract that
    AHSP does not bind the tetramer.
  supported_by:
  - reference_id: PMID:12192002
    supporting_text: AHSP and alpha-globin are both monomeric in solution as determined by
      analytical ultracentrifugation and bind each other to form a complex with 1:1 subunit
      stoichiometry
  - reference_id: PMID:12066189
    supporting_text: Stabilizing Protein (AHSP) is an abundant, erythroid-specific protein that
      forms a stable complex with free alpha-haemoglobin but not with beta-haemoglobin or
      haemoglobin A (alpha(2)beta(2)).
knowledge_gaps:
- gap_statement: >-
    GO has no molecular function term for a chaperone that binds a folded or partially folded
    client, holds it soluble in situ without unfolding it or translocating it, and releases it to
    an assembly partner. GO:0044183 requires the chaperone to fold an unfolded client; GO:0140309
    requires it to keep the client unfolded and to escort it to an acceptor or a location.
  boundary: >-
    What is firmly established is the client's state in both regimes. Crystallography shows
    AHSP-bound alpha-globin as an ordered, fully helical globin in both the ferrous and ferric
    complexes, and NMR shows apo-alpha-globin shifted from unfolded to partially folded on AHSP
    binding and held there with conformational flexibility retained. So the client is neither
    unfolded, which excludes the holdase term, nor folded to the native state by AHSP, which makes
    the folding term only a partial fit.
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    AHSP is among the best structurally characterised chaperones in the human proteome - eight PDB
    entries, two of them co-crystal structures of the complex - and GO can currently say only that
    it binds haemoglobin. The gap is the same one that stranded the small heat-shock proteins when
    GO:0051082 was obsoleted without a suitable holdase term being created (repo issue #2222), but
    AHSP is blocked twice over: those genes hold genuinely unfolded clients and fail only the
    carrier clause, whereas AHSP fails both the unfolded clause and the carrier clause. Any
    resolution that only relaxes "escorts it to an acceptor molecule" would still not reach this
    gene.
  resolution: >-
    Create the proposed globin chaperone activity term as a sibling of GO:0140713 histone
    chaperone activity under GO:0140597 protein carrier activity, or more generally revise the
    holdase/foldase split so that the client's folding state is not the sole differentia. See
    proposed_new_terms.
  provenance:
  - reference_id: PMID:20860551
    supporting_text: Thus, AHSP can stabilize αo in solution whilst still retaining a large degree
      of conformational flexibility in the αo subunit.
  - reference_id: PMID:15931225
    supporting_text: To attain this unusual conformation, segments of alphaHb undergo drastic
      structural rearrangements, including the repositioning of several alpha-helices.
- gap_statement: >-
    GO has no molecular function term for suppressing the redox reactivity of a bound client's
    cofactor. AHSP does not itself react with oxygen or peroxide; it reconfigures the haem
    coordination sphere of the protein it binds.
  boundary: >-
    The chemistry is quantified: the alpha-subunit redox potential falls from +40 to -78 mV on
    AHSP binding, the rate of the initial hydrogen peroxide reaction with the iron drops, and
    ferryl haem and protein-based radicals become undetectable. What is missing is only the term,
    not the knowledge.
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    GO:0016209 antioxidant activity is the term an automated pipeline or an LLM will reach for -
    the affinage record for this gene proposes exactly that - and it is wrong, because its
    definition requires the antioxidant to be itself more easily oxidized than the substance
    protected or to trap free radicals. All seven is_a children of GO:0016209 are redox enzymes.
    Annotating AHSP there would assert a chemistry the protein does not have, and would place a
    haem-free, cofactor-free polypeptide among peroxidases and superoxide dismutases.
  resolution: >-
    Either a molecular function under GO:0003674 for cofactor-reactivity suppression in a bound
    client, or acceptance that this is only expressible as a biological process - the route taken
    here, with GO:1903427 negative regulation of reactive oxygen species biosynthetic process. The
    clause is also folded into the proposed globin chaperone activity definition.
  provenance:
  - reference_id: PMID:26995402
    supporting_text: In the presence of Alpha-hemoglobin stabilizing protein (AHSP), which
      stabilizes the α-subunit in a redox inactive hexacoordinate conformation (thus unable to
      undergo the redox ferric/ferryl transition), Cys93 oxidation was substantially reduced in
      both proteins.
- gap_statement: >-
    Whether AHSP has any function in the nucleus of maturing erythroblasts is unknown. A single
    imaging study reports the protein becoming predominantly nuclear in late erythroblasts and
    being expelled with the nucleus at enucleation, and no molecular activity, partner or
    consequence has been attached to that pool.
  boundary: >-
    Everything measured about AHSP is cytoplasmic: the complex with alpha-globin, the haem redox
    chemistry, the hand-off to beta-globin, and UniProt's experimentally supported subcellular
    location. The nuclear observation is an antibody-based localisation only.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    If real and functional, a nuclear pool would be a second activity for a protein currently
    understood as doing one thing. If it is passive entry of an 11.8 kDa protein with no NLS, or
    an antibody artefact, then annotating GO:0005634 from this study would place AHSP in a
    compartment where none of its known chemistry can occur. The distinction cannot be made from
    the published data, which is why no nucleus annotation is proposed here.
  resolution: >-
    Fractionation of staged primary erythroblasts with a tagged or endogenous-epitope AHSP and a
    second, independent antibody; and a size-matched inert control to test whether nuclear entry
    is passive.
  provenance:
  - reference_id: PMID:32629835
    supporting_text: Notably, sub-cellular location of AHSP is both in the cytoplasm and nucleus
      in the early erythroblasts while in the late stages of maturation AHSP is found
      predominantly in the nucleus, being expelled with it during enucleation.
suggested_questions:
- question: >-
    Should the GO:0005833 hemoglobin complex annotation on AHSP be removed consortium-wide, and
    should the AHSP-alpha-globin heterodimer be given its own complex term at the same time? The
    annotation contradicts the abstract of the reference it cites and the definition of the term,
    but the underlying cause is that GO has no term for the complex that actually exists.
  experts:
  - GO editorial office
  - UniProt
- question: >-
    Can the holdase/foldase split introduced when GO:0051082 was obsoleted be revised so that
    chaperones acting on folded or partially folded clients are expressible? AHSP fails both
    GO:0044183 (it does not fold its client to the native state) and GO:0140309 (it does not keep
    its client unfolded, and it does not escort it anywhere). GO:0140713 histone chaperone
    activity shows the pattern already exists for one client class; a globin sibling would follow
    the same precedent.
  experts:
  - GO editorial office
- question: >-
    GO:0030492 hemoglobin binding is defined around the four-haem tetramer, yet it is the term
    used for proteins that bind individual globin chains - including AHSP, which explicitly does
    not bind the tetramer. Should the definition be broadened to match the term's broad synonym
    "globin binding", or should a free-globin-chain binding child be created?
  experts:
  - GO editorial office
- question: >-
    Several AHSP annotations carry NAS or IBA evidence for terms that now have direct human
    experimental support - GO:0030492 has two co-crystal structures, GO:0050821 has purified human
    protein assays. There is currently no way in this schema to propose an evidence-code upgrade
    for a term already present in GOA, since NEW is rejected for such terms. Is a distinct action
    for "right term, weak code, here is the evidence" worth adding?
  experts:
  - ai-gene-review maintainers
- question: >-
    AHSP's PANTHER family PTHR15914 contains no human paralogue and a single subfamily, and the
    four IBA rows all trace to one mouse orthologue with its own experimental evidence from a
    single 2002 paper. Is this the right shape for a PAINT node, or would the annotations be
    better placed as ISO from mouse, making the single-study dependence visible?
  experts:
  - GO Central PAINT curators
suggested_experiments:
- hypothesis: >-
    AHSP acts on alpha-globin co-translationally or immediately post-translationally, before haem
    insertion, rather than only on the mature holo-subunit.
  description: >-
    Ribosome profiling with selective AHSP pulldown in differentiating human CD34+ erythroblasts,
    to test whether AHSP associates with nascent alpha-globin chains still on the ribosome. The
    apo-alpha-globin chaperone activity is established in vitro with purified components but has
    never been placed in time relative to translation and haem acquisition in cells.
  experiment_type: OTHER
- hypothesis: >-
    The nuclear AHSP pool reported in late erythroblasts is passive entry of a small protein
    rather than a regulated, functional localisation.
  description: >-
    Compare the subcellular distribution of endogenous AHSP with that of a size-matched inert
    reporter of similar molecular weight and charge in staged primary erythroblasts, using
    fractionation plus two independent antibodies, and test whether an AHSP fusion large enough to
    prevent passive diffusion still reaches the nucleus. This distinguishes a real nuclear
    function from diffusion and from antibody cross-reactivity.
  experiment_type: OTHER
- hypothesis: >-
    The proteasome interaction recovered by yeast two-hybrid reflects a genuine route by which
    AHSP-bound alpha-globin that fails to find a beta partner is delivered for degradation.
  description: >-
    Test whether AHSP co-immunoprecipitates with 20S proteasome subunits from human erythroblast
    lysates under conditions of alpha-globin excess (beta-globin knockdown or thalassaemic cells),
    and whether AHSP loss changes the rate of alpha-globin degradation. This is the one screen
    partner on this gene with a plausible mechanism behind it, and it is currently supported only
    by a single unreplicated binary assay.
  experiment_type: OTHER
- hypothesis: >-
    The AHSP-alpha-globin complex can be given a defined stoichiometry and composition in
    ComplexPortal, which would let GO import a complex term rather than requiring one to be
    authored de novo.
  description: >-
    Submit the heterodimer to ComplexPortal with the two crystal structures (1Y01, 1Z8U), the
    analytical ultracentrifugation stoichiometry and the isothermal titration calorimetry
    affinity, which together specify composition, stoichiometry and binding constant. A curated
    complex entry is the normal upstream route to a GO cellular component term.
  experiment_type: OTHER
