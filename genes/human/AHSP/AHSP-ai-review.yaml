id: Q9NZD4
gene_symbol: AHSP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AHSP is a small (102 residue, 11.8 kDa), all-alpha-helical, erythroid-restricted cytoplasmic
  protein that acts as a dedicated chaperone for free alpha-globin during haemoglobin assembly.
  Haemoglobin A is a tetramer of two alpha and two beta subunits, and alpha-globin that has not
  yet found a beta partner is unstable: it aggregates, loses haem, and its haem iron cycles
  through oxidation states that generate reactive oxygen species. AHSP binds monomeric
  alpha-globin with 1:1 stoichiometry through a hydrophobic surface that largely reproduces the
  alpha1-beta1 contact of the tetramer, engaging the G and H helices of the globin. Binding has
  three consequences. It keeps apo-alpha-globin soluble and shifts it from an aggregation-prone
  unfolded ensemble into a partially folded, haem-receptive state. It converts the haem iron of
  holo-alpha-globin into a ferric bis-histidyl hexacoordinate configuration in which both the
  proximal and distal histidines ligate the iron, a chemically inert arrangement that suppresses
  redox catalysis, blocks ferryl haem and protein-radical formation, and prevents haem loss and
  precipitation. And because the AHSP contacts are deliberately suboptimal relative to the
  alpha1-beta1 interface, beta-globin competitively displaces AHSP, so the protected alpha
  subunit is handed on to form HbA rather than sequestered. AHSP does not bind beta-globin or
  the assembled alpha2beta2 tetramer. Its expression is driven by GATA1 during erythroid
  maturation and rises through the erythroblast series. Loss of AHSP causes alpha-globin
  precipitation, raised reactive oxygen species and apoptosis in maturing erythroblasts, and the
  gene modifies the severity of beta-thalassaemia, where unpaired alpha-globin accumulates.
