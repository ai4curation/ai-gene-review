    reason: >-
      No orthogonal method, no co-purification, and no biological context linking the two proteins.
      AHSP is an erythroid-restricted 12 kDa cytosolic chaperone with one measured ligand;
      ZC3H12A is an inflammatory-response RNase of myeloid and lymphoid cells. Retained rather
      than removed because the interaction was seen in two separate screen publications, which is
      more than the singletons below, and because a Y2H positive is not evidence of absence. It
      should not be read as a functional partnership without a second method.
