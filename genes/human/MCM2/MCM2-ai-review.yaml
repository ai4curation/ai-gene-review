id: P49736
gene_symbol: MCM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MCM2 encodes one of the six AAA+ ATPase subunits of the nuclear MCM2-7 heterohexamer. The ring is loaded onto
  replication origins in G1, activated with CDC45 and GINS to form the CMG helicase in S phase, and then unwinds leading-strand
  template DNA during fork progression. MCM2 also has an N-terminal histone H3-H4-binding module implicated in parental histone
  handling at replication forks.'
existing_annotations:
- term:
    id: GO:0000228
    label: nuclear chromosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028418
  review:
    summary: Keep the nuclear chromosome localization.
    action: ACCEPT
    reason: MCM2 is a nuclear replication protein that loads onto chromatin as part of MCM2-7/CMG; this location is
      consistent with the complex's origin-licensing and fork-unwinding roles.
    supported_by:
    - reference_id: file:human/MCM2/MCM2-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Chromosome {ECO:0000305|PubMed:35585232}. Note=Associated with chromatin before the formation of
        nuclei and detaches from it as DNA replication progresses
- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000179907
  - SGD:S000000119
  review:
    summary: Keep break-induced replication as a non-core use of the replicative helicase.
    action: KEEP_AS_NON_CORE
    reason: Break-induced replication is a homologous-recombination repair context that uses the replication helicase
      machinery; it is plausible by PAINT for the MCM2-7 clade but peripheral to the main mitotic replication role.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11630/PTHR11630-paint.tsv
      supporting_text: GO:0000727
- term:
    id: GO:0000781
    label: chromosome, telomeric region
  evidence_type: HDA
  original_reference_id: PMID:19135898
  qualifier: located_in
  review:
    summary: Keep the telomeric-chromatin localization as non-core.
    action: KEEP_AS_NON_CORE
    reason: The PICh telomere proteomics row is plausible for a replicative helicase that can travel through telomeric
      chromatin, but the core location is chromatin/nuclear CMG rather than a telomere-specific pool.
    supported_by:
    - reference_id: PMID:19135898
      supporting_text: Purification of human telomeric chromatin using PICh identified the majority of known telomeric
        factors and uncovered a large number of novel associations
