- term:
    id: GO:0005664
    label: nuclear origin of replication recognition complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P97310
  - ensembl:ENSMUSP00000061923
  review:
    summary: MCM2 is loaded by ORC but is not a subunit of the ORC complex.
    action: REMOVE
    reason: The nuclear origin recognition complex is the ORC1-6 origin sensor. MCM2-7 is loaded at ORC-bound origins
      later and is a separate complex, so a part_of annotation to ORC overstates the relationship.
    supported_by:
    - reference_id: PMID:12364596
      supporting_text: Mcm binding follows ORC binding
    - reference_id: PMID:32453425
      supporting_text: CMG activation involves loading of the MCM2–7 proteins at origin DNA as an inactive double
        hexamer
