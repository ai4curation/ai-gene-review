- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001208
  - InterPro:IPR008045
  - InterPro:IPR018525
  - InterPro:IPR031327
  review:
    summary: Refine DNA binding to the ssDNA/3-prime to 5-prime helicase terms supported for the assembled CMG motor.
    action: MODIFY
    reason: DNA binding is correct but less precise than the evidence. Human CMG is the MCM2-7-containing helicase that
      binds a leading-strand ssDNA template and translocates 3-prime to 5-prime; the retained annotation should describe
      that complex activity, with this subunit contributing to it.
    proposed_replacement_terms:
    - id: GO:0017116
      label: single-stranded DNA helicase activity
    - id: GO:0043138
      label: 3'-5' DNA helicase activity
    supported_by:
    - reference_id: PMID:22474384
      supporting_text: translocates along the leading strand (3' to 5' direction). The complex hydrolyses ATP in the
        absence of DNA; unwinds duplex regions up to 500 bp
    - reference_id: PMID:22474384
      supporting_text: The isolated complex binds to ssDNA regions in the presence of magnesium and ATP
    - reference_id: PMID:32453425
      supporting_text: All MCM subunits contact DNA, from MCM2 at the 5'-end to MCM5 at the 3'-end of the DNA spiral
