- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P97310
  - ensembl:ENSMUSP00000061923
  review:
    summary: Keep DNA replication origin binding as non-core.
    action: KEEP_AS_NON_CORE
    reason: MCM2-7 is recruited to origins by ORC/CDC6/CDT1 and then encircles origin DNA; it is origin-associated
      rather than an autonomous origin-sequence reader, so this broader origin-binding activity is a secondary
      description beside CMG helicase activity.
    supported_by:
    - reference_id: PMID:12364596
      supporting_text: human Mcm proteins first assemble at or adjacent to bound ORC and move to other sites during
        genome replication
