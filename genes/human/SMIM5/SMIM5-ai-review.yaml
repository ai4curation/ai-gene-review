description: >-
  SMIM5 (formerly C17orf109) is a 77-amino-acid protein with a single predicted helical
  transmembrane segment (residues 32-52), immediately followed by a cluster of cysteine
  residues and a short basic, proline-rich C terminus. It is classed as a single-pass
  membrane protein on the basis of this sequence feature; its topology and the membrane in
  which it resides have not been determined experimentally. SMIM5 belongs to the
  SMIM5/SMIM18/SMIM22 family (Pfam PF15831). Of that family only SMIM22 has been studied
  functionally, and nothing about SMIM22 has been shown to apply to SMIM5. SMIM5 mRNA is
  enriched in kidney. Its reported partners come from a single proteome-scale yeast
  two-hybrid screen and include the cytosolic membrane-protein quality-control factor SGTA.
  Altered SMIM5 mRNA levels have been noted in several transcriptomic studies of disease
  tissue, but no molecular function, biological process or loss-of-function phenotype has
  been reported.
