  review:
    summary: >-
      HuRI yeast two-hybrid interaction between SMIM5 and SGTA, a cytosolic co-chaperone that
      handles exposed hydrophobic transmembrane domains of mislocalized membrane proteins.
    action: REMOVE
    reason: >-
      SGTA engages exposed hydrophobic transmembrane domains (PMID:23129660), so an SGTA hit
      for a single-pass transmembrane peptide is expected client recognition. It reports
      SMIM5's hydrophobic helix, not a function of SMIM5. No more informative molecular
      function is supported, so the row is removed rather than modified. Removal does not
      imply that the interaction is false.
