suggested_questions:
- question: >-
    Does SMIM5 share any activity with its family member SMIM22 (CASIMO1), which interacts
    with and raises the protein level of squalene epoxidase? The two proteins share a transmembrane region and
    a following cysteine cluster, but SMIM5 has not been tested.
- question: >-
    Is the cysteine cluster after the transmembrane helix S-palmitoylated, and does it
    determine which membrane SMIM5 occupies?
suggested_experiments:
- hypothesis: SMIM5 is an integral membrane protein of a defined organelle in kidney epithelium.
  description: >-
    Tag endogenous SMIM5 in a kidney epithelial cell line and determine its localization by
    co-staining with organelle markers and by carbonate extraction and protease protection,
    then test acyl-biotin exchange for palmitoylation of the post-transmembrane cysteines.
  experiment_type: localization and biochemical fractionation
