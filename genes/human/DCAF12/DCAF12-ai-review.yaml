description: DCAF12 (DDB1- and CUL4-associated factor 12) is the substrate-recognition subunit (substrate
  receptor) of a CRL4 (DDB1-CUL4A/B-RBX1) E3 ubiquitin-protein ligase of the DesCEND / C-end degron pathway.
  It recognises C-terminal acidic degrons - a diglutamate (and the alternative Glu-Leu) motif - and presents
  degron-bearing substrates (e.g. MOV10, MAGE-A3/A6) to the ligase for ubiquitination and proteasomal
  degradation. It acts in the nucleus and cytoplasm as part of the Cul4-RING complex.
