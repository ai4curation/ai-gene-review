suggested_questions:
- question: To what extent does FGFR1c, versus FGFR3c/FGFR4, mediate FGF23-alpha-Klotho signalling in the human renal proximal
    and distal tubule, and is FGFR1c required in vivo for FGF21-beta-Klotho action in human adipose tissue?
- question: Does nuclear FGFR1 have a kinase-dependent transcriptional function in vivo, and by what route (retrotranslocation,
    proteolytic release) does a full-length transmembrane receptor reach the nucleus?
- question: Are the FGFR1-5-HT1A heteroreceptor complexes reported by proximity/BRET assays reproducible by independent groups
    and relevant to neuronal FGFR1 signalling in vivo?
- question: Which FGFR1-specific (versus shared FGFR1-4) features explain the GnRH neuron requirement underlying Kallmann
    syndrome, e.g. FGF8-FGFR1c signalling or anosmin-1 modulation?
suggested_experiments:
- hypothesis: FGFR1c is the dominant FGFR paralog mediating FGF23 phosphaturic signalling in human kidney.
  description: Kidney organoid or primary tubular cell models with CRISPR knockout of FGFR1, FGFR3 and FGFR4 singly and in
    combination, measuring FGF23-induced ERK phosphorylation, EGR1 induction and NPT2a internalization in the presence of
    alpha-Klotho.
  experiment_type: genetic perturbation
- hypothesis: Nuclear FGFR1 regulates transcription through its kinase activity.
  description: Compare chromatin occupancy (CUT&RUN) and transcriptional output in cells expressing wild-type, kinase-dead
    (K514A) and nuclear-targeted FGFR1 variants, controlling for plasma membrane signalling with extracellular ligand-trap
    treatment.
  experiment_type: genomics
