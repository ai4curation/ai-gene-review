gene_symbol: FGFR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGFR1 (fibroblast growth factor receptor 1) is a single-pass type I transmembrane receptor tyrosine kinase with
  an extracellular region of up to three immunoglobulin-like domains (D1-D3, with an acidic box), a transmembrane helix, and
  a split cytoplasmic tyrosine kinase domain. Alternative splicing of the D3 exon generates IIIb and IIIc isoforms with different
  FGF ligand specificities; soluble and kinase-less forms also exist. FGF ligands bind D2-D3 together with heparan sulfate
  (paracrine FGFs) or with alpha-Klotho/beta-Klotho co-receptors (endocrine FGF23, FGF21, FGF19), inducing receptor dimerization
  and ordered trans-autophosphorylation (activation loop Y653/Y654 first, then Y463, Y583/585, Y730 and Y766). The active
  kinase phosphorylates the constitutively bound docking protein FRS2, which recruits GRB2-SOS to activate RAS-ERK and GRB2-GAB1-p85
  to activate PI3K-AKT, and phosphorylated Y766 recruits and activates PLC-gamma1 to hydrolyse PIP2. Signalling is terminated
  by CBL/NEDD4-mediated ubiquitination, endocytosis and lysosomal degradation. FGFR1 acts mainly at the plasma membrane, with
  endosomal and non-canonical nuclear pools. It is required for gastrulation and mesoderm patterning, skeletal and craniofacial
  development, and development of the GnRH neuronal system; FGFR1c with alpha-Klotho is the principal renal receptor for FGF23
  in phosphate homeostasis and, with beta-Klotho, mediates FGF21 action in adipose tissue. Gain-of-function variants cause
  Pfeiffer syndrome and osteoglophonic dysplasia, loss-of-function variants cause Kallmann syndrome/hypogonadotropic hypogonadism
  and Hartsfield syndrome, and FGFR1 amplification and fusions (e.g. in 8p11 myeloproliferative syndrome) are oncogenic.
