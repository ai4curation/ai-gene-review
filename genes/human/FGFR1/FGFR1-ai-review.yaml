existing_annotations:
- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: TAS
  original_reference_id: PMID:10748122
  qualifier: involved_in
  review:
    summary: FGFR1 activates ERK/MAPK signalling through FRS2-GRB2-SOS-RAS; the receptor is upstream of, not a component of,
      the MAP kinase phosphorelay itself.
    action: MODIFY
    reason: The receptor does not perform any step of the MAPK three-kinase phosphorelay; it initiates the cascade via FRS2/GRB2/SOS.
      The cited paper shows ligand-induced MAPK activation through FGFR1 (and a splice variant), which is better captured
      by positive regulation of MAPK cascade (GO:0043410), a term already carried by FGFR1 via IBA and experimental evidence.
    proposed_replacement_terms:
    - &id034
      id: GO:0043410
      label: positive regulation of MAPK cascade
    supported_by:
    - &id005
      reference_id: PMID:10748122
      supporting_text: FGF-1, FGF-2, and FGF-4 enhanced mitogen-activated protein kinase (MAPK) activity, increased steady-state
        c-fos mRNA levels, and stimulated proliferation through either receptor, whereas KGF was without effect.
    - &id036
      reference_id: file:human/FGFR1/FGFR1-uniprot.txt
      supporting_text: Phosphorylation of FRS2 triggers recruitment of GRB2, GAB1, PIK3R1 and SOS1, and mediates activation
        of RAS, MAPK1/ERK2, MAPK3/ERK1 and the MAP kinase signaling pathway, as well as of the AKT1 signaling pathway.
- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:7874169
  qualifier: involved_in
  review:
    summary: Gain-of-function FGFR1 P252R causes Pfeiffer syndrome (craniosynostosis, broad thumbs/toes), and FGFR1 variants
      cause osteoglophonic dysplasia, supporting a role in skeletal development.
    action: KEEP_AS_NON_CORE
    reason: Human genetics supports involvement of FGFR1 signalling in skeletal (especially craniofacial) development, but
      this is a developmental outcome of the core receptor activity rather than a core function per se.
    supported_by:
    - &id041
      reference_id: PMID:7874169
      supporting_text: Here we present evidence that mutations in the fibroblast growth factor receptor-1 (FGFR1) gene, which
        maps to 8p, cause one form of familial Pfeiffer syndrome.
    - &id033
      reference_id: PMID:15863030
      supporting_text: A variety of human skeletal dysplasias have been linked to specific point mutations in FGFR1, FGFR2
        and FGFR3 leading to severe impairment in cranial, digital and skeletal development.
- term:
    id: GO:0001764
    label: neuron migration
  evidence_type: TAS
  original_reference_id: PMID:15863030
  qualifier: involved_in
  review:
    summary: FGFR1 signalling is implicated in migration of neuronal cells, notably GnRH neurons (loss-of-function FGFR1 causes
      Kallmann syndrome) and anosmin-1-modulated chemotaxis of neuronal cells.
    action: KEEP_AS_NON_CORE
    reason: The cited review (PMID:15863030) supports cell migration as an FGFR output generally. Kallmann syndrome genetics
      (PMID:12627230) and anosmin-1/FGFR1 chemotaxis data (PMID:19696444) support a context-specific role in neuronal migration.
      This is a downstream developmental role, not a core function.
    additional_reference_ids:
    - PMID:12627230
    - PMID:19696444
    supported_by:
    - &id029
      reference_id: PMID:15863030
      supporting_text: A variety of signaling proteins are phosphorylated in response to FGF stimulation including Shc, phospholipase-Cgamma,
        STAT1, Gab1 and FRS2alpha leading to stimulation of intracellular signaling pathways that control cell proliferation,
        cell differentiation, cell migration, cell survival and cell shape.
    - reference_id: PMID:12627230
      supporting_text: We establish here that loss-of-function mutations in FGFR1 underlie KAL2 whereas a gain-of-function
        mutation in FGFR1 has been shown to cause a form of craniosynostosis.
    - reference_id: PMID:19696444
      supporting_text: anosmin-1 was shown to induce opposing effects during chemotaxis of human neuronal cells.
