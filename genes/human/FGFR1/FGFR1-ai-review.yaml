    review_notes: Cached abstract supports FGFR1 as a beta-Klotho co-receptor partner for FGF21 in adipocytes.
core_functions:
- description: 'Ligand-activated receptor tyrosine kinase for FGFs at the plasma membrane: binds FGF (with heparan sulfate
    or Klotho co-receptors), dimerizes, trans-autophosphorylates and phosphorylates FRS2 and PLC-gamma1 to initiate FGF receptor
    signalling.'
