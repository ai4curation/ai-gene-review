id: P16152
gene_symbol: CBR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CBR1 is a cytosolic monomeric short-chain dehydrogenase/reductase and NADPH-dependent carbonyl
  reductase with broad substrate specificity. It reduces xenobiotic carbonyls such as anthracyclines,
  quinones such as menadione, prostaglandins, S-nitrosoglutathione and glucocorticoids. Within
  the two human monomeric carbonyl reductases, CBR1 is the broad-spectrum paralog that carries
  the prostaglandin and glucocorticoid reactions not established for CBR3.
