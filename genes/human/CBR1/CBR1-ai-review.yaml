core_functions:
- description: >-
    CBR1 is a cytosolic NADPH-dependent carbonyl reductase that reduces aldehyde, ketone and
    quinone carbonyls, including xenobiotic anthracyclines and menadione, to the corresponding
    alcohols.
  molecular_function:
    id: GO:0004090
    label: carbonyl reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0006805
    label: xenobiotic metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:17344335
    supporting_text: Human carbonyl reductase 1 (CBR1) metabolizes endogenous and
      xenobiotic substrates
  - reference_id: PMID:18449627
    supporting_text: CBR1 reduces the anticancer anthracyclines doxorubicin and
      daunorubicin
- description: >-
    CBR1 reduces S-nitrosoglutathione with NADPH, a glutathione-linked nitrosothiol reductase
    activity supported by kinetic assays and by CBR1-dependent GSNO reduction in lung adenocarcinoma
    lysates.
  molecular_function:
    id: GO:0160163
    label: S-nitrosoglutathione reductase (NADPH) activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18826943
    supporting_text: hCBR1 dependent GSNO reduction occurs in A549 lung adenocarcinoma
      cell lysates
- description: >-
    CBR1 reduces cortisol to 20beta-dihydrocortisol with NADPH, creating a weak glucocorticoid-receptor
    agonist and contributing to glucocorticoid metabolism.
  molecular_function:
    id: GO:0004090
    label: carbonyl reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0008211
    label: glucocorticoid metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:28878267
    supporting_text: CBR1 catalyzes the NADPH- dependent production of
      20β-dihydrocortisol
proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous carbonyl substrates dominate CBR1 flux in human cytosol across liver,
    kidney, intestine and adipose tissue?
- question: >-
    How much does CBR1-dependent GSNO reduction contribute to cellular nitrosothiol homeostasis
    relative to other GSNO-metabolizing enzymes in primary human cells?
suggested_experiments:
- description: >-
    Use isotopically labelled cortisol, prostaglandin E2, menadione and GSNO substrates in
    CBR1 knockout and rescue human cell lines to compare CBR1-dependent flux across endogenous
    carbonyl-reduction reactions.
