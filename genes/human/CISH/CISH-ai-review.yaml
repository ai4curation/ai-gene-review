id: Q9NSE2
gene_symbol: CISH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CISH encodes cytokine-inducible SH2-containing protein, a SOCS-family SH2/SOCS-box adaptor induced by
  cytokine signaling. CIS binds phosphotyrosine motifs on activated cytokine receptors, including EPOR
  and IL3 receptor beta, and restrains JAK-STAT5-dependent cytokine responses as part of the classical
  SOCS negative-feedback system. Its C-terminal SOCS box is homologous to CRL5/ECS substrate-receptor
  modules, consistent with recruitment of Elongin BC-Cullin ubiquitin-ligase machinery to downregulate
  bound receptor complexes.
