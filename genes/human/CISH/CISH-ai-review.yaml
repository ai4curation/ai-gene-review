suggested_questions:
- question: Which human CISH cytokine-receptor substrates are directly ubiquitinated through a 
    CISH-containing CRL5/ECS complex rather than inhibited only by receptor phosphotyrosine 
    competition?
suggested_experiments:
- description: Reconstitute human CISH-ElonginBC-CUL5-RBX2 complexes with candidate phosphorylated 
    EPOR, GHR, PRLR, and IL3 receptor tails and assay receptor-tail ubiquitination directly.
