- id: file:human/YTHDF1/YTHDF1-deep-research-manual.md
  title: YTHDF1 manual evidence synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual synthesis used after Falcon and Perplexity-lite were unavailable.
core_functions:
- molecular_function:
    id: GO:1990247
    label: N6-methyladenosine-containing RNA reader activity
  description: YTHDF1 binds N6-methyladenosine in messenger RNA through its C-terminal YTH domain 
    and acts with YTHDF2 and YTHDF3 on a shared cytoplasmic pool of m6A-modified transcripts. The 
    common, well-supported output is transcript destabilization; YTHDF1 also has a reported 
    translation-initiation role, but that arm conflicts with the later unified model and is treated 
    as disputed rather than defining.
  directly_involved_in:
  - id: GO:0061157
    label: mRNA destabilization
  - id: GO:0043488
    label: regulation of mRNA stability
  locations:
  - id: GO:0000932
    label: P-body
  - id: GO:0010494
    label: cytoplasmic stress granule
  supported_by:
  - reference_id: PMID:32492408
    supporting_text: In contrast to the prevailing model, we show that DF proteins bind the same 
      m6A-modified mRNAs rather than different mRNAs.
  - reference_id: PMID:32492408
    supporting_text: Instead, the DF paralogs act redundantly to mediate mRNA degradation and 
      cellular differentiation.
  - reference_id: PMID:31292544
    supporting_text: The resulting mRNA-YTHDF complexes then partition into different endogenous 
      phase-separated compartments, such as P-bodies, stress granules or neuronal RNA granules.
suggested_questions:
- question: Under what cell types or stresses does endogenous YTHDF1 actively increase translation 
    initiation, and how much of the early ribosome-profiling effect survives acute codepletion of 
    all three YTHDF paralogs?
  experts:
  - RNA modification biology
  - Translational control
suggested_experiments:
- hypothesis: The positive translation effect attributed to YTHDF1 is context-specific and is masked
    or replaced by redundant mRNA decay in HeLa cells.
  description: Use degron-tagged YTHDF1, YTHDF2 and YTHDF3 alleles to compare acute single, double 
    and triple depletion in several cell types, then measure mRNA abundance and translation 
    efficiency by matched RNA-seq and ribosome profiling.
  experiment_type: acute protein degradation with ribosome profiling
