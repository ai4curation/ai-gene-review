id: Q9BYJ9
gene_symbol: YTHDF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: YTHDF1 is one of the three cytoplasmic YTHDF-family readers of N6-methyladenosine (m6A)
  in messenger RNA. Its C-terminal YTH domain recognizes the methylated RNA base, while its 
  N-terminal low-complexity region couples bound transcripts to ribonucleoprotein condensates, 
  including P-bodies and cytoplasmic stress granules. YTHDF1 shares m6A-modified targets with YTHDF2
  and YTHDF3 and participates with the paralog group in mRNA destabilization. A proposed 
  YTHDF1-specific translation initiation function is biologically plausible and supported by early 
  ribosome profiling and ribosome-binding experiments, but a later unified model found that DF 
  proteins do not induce translation in HeLa cells and instead act redundantly to mediate mRNA 
  degradation.
