id: O00220
gene_symbol: TNFRSF10A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TNFRSF10A, also called DR4 or TRAIL receptor 1, is a type I plasma-membrane TNF receptor superfamily
  member with extracellular cysteine-rich TRAIL-binding domains and an intracellular death domain. Binding of TNFSF10/TRAIL
  to cell-surface TNFRSF10A promotes receptor oligomerization in plasma-membrane rafts and assembly of a FADD- and
  CASP8/CASP10-containing death-inducing signaling complex that initiates TRAIL-activated extrinsic apoptosis. DR4
  trafficking and raft partitioning are regulated by ARAP1 and ZDHHC3/GODZ, decoy TRAIL receptors can restrain DR4
  signaling, and ligand-bound DR4 can also produce contextual NF-kappaB outputs.'
