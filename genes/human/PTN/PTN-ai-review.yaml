- term:
    id: GO:0002232
    label: leukocyte chemotaxis involved in inflammatory response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P63089
  - ensembl:ENSMUSP00000099073
  review:
    summary: leukocyte chemotaxis involved in inflammatory response is a supported downstream or 
      receptor-context effect of PTN ligand signaling.
    action: KEEP_AS_NON_CORE
    reason: This row is kept as non-core because PTN directly promotes Mac-1-dependent macrophage 
      migration to the secreted ligand, but leukocyte recruitment is an inflammatory cell-response 
      context outside the core PTPRZ/glycosaminoglycan mechanism.
    supported_by:
    - reference_id: PMID:28939773
      supporting_text: PTN induced a strong migratory response
