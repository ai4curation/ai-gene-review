id: P21246
gene_symbol: PTN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTN encodes pleiotrophin, a secreted glycosaminoglycan-binding growth factor of the pleiotrophin/midkine
  family. Mature PTN binds heparin and chondroitin-sulfate proteoglycan receptor complexes, with a well
  resolved PTPRZ branch in which ligand binding clusters and inhibits the PTPRZ phosphatase and thereby
  changes phosphorylation of downstream substrates involved in migration, oligodendrocyte differentiation
  and survival signaling.'
