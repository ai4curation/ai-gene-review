- reference_id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  access: Reused authentic PMC original Methods, Results and Table 1; independently retained author database
    target row. Supplementary peptide sequence unavailable.
  selected_locators:
  - Concise Methods; large-scale proteomics Results; Table 1 FXYD2 row and footnote; author database FXYD2
    row
  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC2637050/
  - https://esbl.nhlbi.nih.gov/Databases/UrinaryExosomes/
  reading: Pooled urine from eight healthy humans was fractionated and analyzed by tryptic LC-MS/MS. Table
    1 identifies FXYD2 with one unique peptide and seven spectra; the author database records historical
    NP_001671. This supports urinary-vesicle occurrence. Neither the old isoform-1 label nor the retained
    database row establishes which current natural product supplied the peptide.
- reference_id: PMID:24688018
  title: Route, mechanism, and implications of proton import during Na+/K+ exchange by native Na+/K+-ATPase
    pumps
  access: Authentic original selected Methods, Results and Discussion read; no figure-image or supplementary-data
    assessment.
  selected_locators:
  - Methods expression; Results exchange and proton-current sections; Discussion physiology/hybrid transport;
    Figure 3 model scope
  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC3971657/
  reading: Xenopus alpha1/beta3 pumps expressed in oocytes display conditional inward proton current.
    Mutations affect alpha1; a gamma helix occurs in the structural model, without an isolated human FXYD2
    perturbation. Pump-level electrochemical physiology is relevant, while the particular FXYD2 proton-transport
    assertion remains unresolved. This is not a wrong-gene or false-function finding.
  full_text_unavailable: false
- reference_id: PMID:35803952
  title: Cryo-EM structures of recombinant human sodium-potassium pump determined in three different states.
  access: 'Immutable main cached original: selected structural Results and expression/purification Methods
    read.'
  selected_locators:
  - Overall structures and Figures 1/5 captions; protein expression and purification Methods; selected
    E1/E2 Results
  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC9270386/
  reading: Human N-FLAG alpha1 BAA00061.1, C-Strep beta1 CAA27385.1 and untagged FXYD2 AAG37906.1 were
    coexpressed in HEK293F cells. Purified complexes yielded three cryo-EM states, directly supporting
    human gamma-subunit membership. Alpha-subunit ion/gating chemistry is not assigned to FXYD2, and the
    construct accession has not been mapped to a current natural-product sequence.
  full_text_unavailable: false
- reference_id: PMID:33231612
  title: FXYD protein isoforms differentially modulate human Na/K pump function
  access: 'Authentic original XML: molecular-biology/electrophysiology Methods, ion-affinity Results,
    Tables 1–3 and selected Discussion; no supplementary or figure-pixel assessment.'
  selected_locators:
  - Methods sections s4; Results s12/s13/s16; Figures 2–5 and 9–10/table text; Tables 1–3
  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC7690937/
  reading: Human FXYD2b with unmutated human alpha1/beta1 was expressed in Xenopus oocytes; endogenous
    current was bounded experimentally. Voltage clamp and excised-patch measurements show condition-dependent
    ion-affinity regulation. With intracellular K, Na K0.5 rises from 13.8±2.3 to 18.1±2.4 mM; the NMDG
    condition shows no significant difference. Turnover is not uniformly stimulated. These experiments
    establish pump regulation, not universal activation/inhibition or an exact current-isoform sequence
    assignment.
  full_text_unavailable: false
- reference_id: PMID:18075585
  title: Crystal structure of the sodium-potassium pump.
  access: Authentic abstract and publisher preview/figure descriptions only. The .pdf download is HTML
    subscription content, not an original PDF.
  selected_locators:
  - Abstract; publisher structural preview and figure descriptions
  urls:
  - https://doi.org/10.1038/nature06419
  reading: The pig renal alpha/beta/gamma pump structure contains two occluded rubidium ions and places
    gamma against alpha M9. Current pig Q58K79 GOA includes IDA activator, adaptor, transport and complex
    annotations from this paper. Structural association is supported, but the full experiments needed
    to verify activator and molecular-adaptor roles were not recovered; the transferred human activator/adaptor
    claims therefore remain unresolved.
  full_text_unavailable: true
- reference_id: PMID:12626497
  title: Structure-function relations of interactions between Na,K-ATPase, the gamma subunit, and corticosteroid
    hormone-induced factor.
  access: Indexed author-posted original selected Introduction, Methods, Results/Table I; publisher access
    failure is excluded.
  selected_locators:
  - Methods expression/transport assays; Table I and associated Results
  urls:
  - https://www.researchgate.net/publication/8029263_Structure-Function_Relations_of_Interactions_between_NaK-ATPase_the_Subunit_and_Corticosteroid_Hormone-induced_Factor
  reading: Rat CHIF and gamma a/b constructs and chimeras were tested in HeLa cells overexpressing rat
    alpha1. Ouabain-sensitive rubidium uptake and sodium-activation measurements distinguish CHIF from
    gamma; gamma raises the apparent sodium K0.5. This supports rat gamma association and modulation of
    pump-mediated transport, not a separate ion channel or uniform activation.
- reference_id: PMID:15280368
  title: Stress-induced expression of the gamma subunit (FXYD2) modulates Na,K-ATPase activity and cell
    growth.
  access: Indexed author-posted original selected Methods, stress/knockdown Results and Discussion; failed
    publisher PDF excluded.
  selected_locators:
  - Methods osmotic treatments and siRNA; Results/Figure 8 cell growth; selected Discussion
  urls:
  - https://www.researchgate.net/publication/8430314_Stress-induced_Expression_of_the_g_Subunit_FXYD2_Modulates_NaK-ATPase_Activity_and_Cell_Growth
  reading: In rat NRK-52E cells, hyperosmotic NaCl induces gamma a. Gamma-directed siRNA largely reverses
    reduced pump Vmax and slowed growth without changing alpha/beta abundance. These support stress-responsive
    expression and a contextual growth effect. They do not establish a dedicated human antiproliferative
    mechanism or its downstream signaling.
- reference_id: PMID:16757733
  title: Locations, abundances, and possible functions of FXYD ion transport regulators in rat renal medulla.
  access: Indexed author-posted original selected animal/antibody Methods and renal-localization Results.
  selected_locators:
  - Methods animals/antibodies
  - Results IMCD gamma localization; Figure 2B/C alpha1 colocalization
  - Separate gamma basolateral immunogold Results; no new figure-pixel reading
  urls:
  - https://www.researchgate.net/publication/7024851_Locations_abundances_and_possible_functions_of_FXYD_ion_transport_regulators_in_rat_renal_medulla
  reading: Indexed author-posted original selected animal/antibody Methods and renal-localization Results
    were read. Male Munich-Wistar rat kidney immunofluorescence localizes gamma with alpha1 in IMCD1 intercalated
    cells (Figure 2B) and IMCD2 cells (Figure 2C); the source also describes gamma basolateral immunogold
    labeling separately. The abstract's close double-label immunoelectron association concerns CHIF and
    is not substituted for the gamma Figure 2 result. This supports the rat-derived basolateral inference
    with segment, cell-type and antibody limits, not a human tissue assay or current-product equivalence.
- reference_id: PMID:15755730
  title: Na,K-ATPase from mice lacking the gamma subunit (FXYD2) exhibits altered Na+ affinity and decreased
    thermal stability.
  access: Retained indexed author-posted original selected Methods, Results and Discussion; publisher
    PDF 403 excluded.
  selected_locators:
  - Analysis of Na,K-ATPase from mutant kidneys; thermostability; Properties/Thermal Results and selected
    Discussion
  urls:
  - https://www.researchgate.net/publication/7978128_NaK-ATPase_from_Mice_Lacking_the_g_Subunit_FXYD2_Exhibits_Altered_Na_Affinity_and_Decreased_Thermal_Stability
  reading: Mouse Fxyd2 knockout kidney enzyme was assessed by ouabain-sensitive ATP hydrolysis, with five
    preparations per genotype. Knockout increases apparent Na affinity, leaves K affinity similar and
    modestly changes ATP affinity; thermal stability decreases. These are pump-regulation and stability
    measurements, not sodium-channel gating. Both splice variants and mixed kidney preparations limit
    product-specific interpretation.
- reference_id: PMID:11483503
  title: CHIF, a member of the FXYD protein family, is a regulator of Na,K-ATPase distinct from the gamma-subunit.
  access: Authentic PMC original selected Results, Methods and Discussion, retrieved as indexed original
    text; no figure pixels.
  selected_locators:
  - Results association/ion dependence and Figures 7–8/Table I; Methods transport and ouabain binding;
    Discussion
  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC149142/
  reading: Rat CHIF and gamma a/b coexpressed with Na,K pumps in Xenopus oocytes alter pump currents and
    ion-affinity readouts in different directions. Kidney-microsome association was also examined. ENaC
    was used to load sodium, not to establish direct gamma regulation of that channel. Limited human gamma/pump
    experiments concern ouabain binding, so rat transport results are not relabeled human.
- reference_id: PMID:12169672
  title: Phospholemman (FXYD1) associates with Na,K-ATPase and regulates its transport properties.
  access: Authentic PMC original selected Methods and Results retained in indexed source output.
  selected_locators:
  - Expression/electrophysiology Methods; ion-affinity Results; native association
  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC123281/
  reading: Dog phospholemman expressed with rat pump isoforms in Xenopus oocytes changes pump ion affinities;
    human pumps were used in binding experiments. Native association includes bovine heart and rat muscle.
    ENaC provides sodium loading; selected functional assays measure pump current, not sodium-channel
    gating. The result characterizes donor FXYD1 and does not make it the human FXYD2 product.
  full_text_unavailable: false
- reference_id: PMID:12657675
  title: Phospholemman, a single-span membrane protein, is an accessory protein of Na,K-ATPase in cerebellum
    and choroid plexus.
  access: Authentic PMC original selected Methods, Table 1 Results and association captions; no full figure-image
    audit.
  selected_locators:
