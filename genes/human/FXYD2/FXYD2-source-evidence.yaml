reference_assessments:
- id: PMID:9048881
  title: Cloning and expression of human cDNA encoding Na+, K(+)-ATPase gamma-subunit.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract only; full publisher article inaccessible. Human fetal-liver cDNA
      and Northern tissue-expression report; the historical 58-residue sequence is not equated with the
      current 66- or 64-residue products. The original TAS complex context is retained with independent
      later human structural support, not a claim that this early full paper was read.
  full_text_unavailable: true
- id: PMID:11062458
  title: Dominant isolated renal magnesium loss is caused by misrouting of the Na(+),K(+)-ATPase gamma-subunit.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract only; attempted publisher PDF is an HTML failure, and indexed author
      page supplies no full original. Human dominant renal magnesium-loss study reports the G41R variant
      and misrouting of the gamma subunit. This establishes relevant disease/trafficking context at abstract
      scope. G41R is an experimental/disease variant, not a third natural product; detailed trafficking
      assays were not independently read.
  full_text_unavailable: true
- id: PMID:11112438
  title: Genomic organization of the human FXYD2 gene encoding the gamma subunit of the Na,K-ATPase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract only; full original not recovered. Human FXYD2 genomic organization
      and alternative N termini are relevant to product provenance. Historical 66/68-residue descriptions
      are not silently substituted for current UniProt 66/64-residue products. Current sequences are independently
      reconstructed and matched to official FASTA; this paper is not a functional equivalence assay.
  full_text_unavailable: true
- id: PMID:15489334
  title: 'The status, quality, and expansion of the NIH full-length cDNA project: the Mammalian Gene Collection
    (MGC).'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Immutable main cache: bibliographic record and abstract read; the section headed Full
      Text contains the abstract only. The Mammalian Gene Collection resource paper describes full-ORF
      clone sequencing and cautions that some clone variants can be artifacts. Its appearance in official
      FXYD2 sequence provenance is relevant background, but no particular FXYD2 clone, current-product
      functional difference or expression profile was verified here.'
  full_text_unavailable: true
- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Reused authentic PMC original Methods, Results and Table 1; independently retained author
      database target row. Supplementary peptide sequence unavailable. Pooled urine from eight healthy
      humans was fractionated and analyzed by tryptic LC-MS/MS. Table 1 identifies FXYD2 with one unique
      peptide and seven spectra; the author database records historical NP_001671. This supports urinary-vesicle
      occurrence. Neither the old isoform-1 label nor the retained database row establishes which current
      natural product supplied the peptide.
  full_text_unavailable: false
- id: PMID:24688018
  title: Route, mechanism, and implications of proton import during Na+/K+ exchange by native Na+/K+-ATPase
    pumps
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Authentic original selected Methods, Results and Discussion read; no figure-image or
      supplementary-data assessment. Xenopus alpha1/beta3 pumps expressed in oocytes display conditional
      inward proton current. Mutations affect alpha1; a gamma helix occurs in the structural model, without
      an isolated human FXYD2 perturbation. Pump-level electrochemical physiology is relevant, while the
      particular FXYD2 proton-transport assertion remains unresolved. This is not a wrong-gene or false-function
      finding.
  full_text_unavailable: false
- id: PMID:35803952
  title: Cryo-EM structures of recombinant human sodium-potassium pump determined in three different states.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Immutable main cached original: selected structural Results and expression/purification
      Methods read. Human N-FLAG alpha1 BAA00061.1, C-Strep beta1 CAA27385.1 and untagged FXYD2 AAG37906.1
      were coexpressed in HEK293F cells. Purified complexes yielded three cryo-EM states, directly supporting
      human gamma-subunit membership. Alpha-subunit ion/gating chemistry is not assigned to FXYD2, and
      the construct accession has not been mapped to a current natural-product sequence.'
  full_text_unavailable: false
- id: PMID:33231612
  title: FXYD protein isoforms differentially modulate human Na/K pump function
