  reading: Human FXYD5 carrying an inserted FLAG tag was expressed in MDCK cells. Ouabain-sensitive rubidium
    uptake and pump-kinetic readouts establish donor pump regulation. ENaC-related expression manipulations
    do not demonstrate direct sodium-channel binding by FXYD5 or FXYD2. Selected construct/assay facts
    are verified; uninspected parts of the paper are not claimed as read.
  full_text_unavailable: true
