- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q58K79
  review:
    action: UNDECIDED
    summary: The activator-specific transfer is unresolved.
    reason: The exact pig Q58K79 donor has IDA GO:0001671 from PMID:18075585 with matching renal/pump
      context. Its accessible abstract and structural preview establish gamma-subunit association, but
      the full evidence for increased ATP hydrolysis was not recovered. Direct human FXYD2b experiments
      demonstrate condition-dependent pump regulation without uniform stimulation. Mixed effects do not
      refute conditional activation, so the original ISS, five extension atoms and alpha1 input are preserved
      while this more specific role remains unresolved.
    supported_by:
    - reference_id: PMID:18075585
    - reference_id: PMID:33231612
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-936897
  qualifier: located_in
  review:
    action: ACCEPT
    summary: The plasma membrane is the site of pump-complex function.
    reason: The retained Reactome R-HSA-936897 summary explicitly describes the alpha/beta/FXYD pump exchanging
      sodium and potassium across the plasma membrane. Human FXYD2b surface pump currents provide independent
      functional support. This location is retained without assigning the reaction catalysis or every
      cardiac pathway context in the summary to FXYD2.
    supported_by:
    - reference_id: Reactome:R-HSA-936897
    - reference_id: PMID:33231612
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9684068
  qualifier: located_in
  review:
    action: ACCEPT
    summary: Retain plasma-membrane localization in the glycoside-bound pump context.
    reason: The retained R-HSA-9684068 entry describes glycoside binding to the ATP1A:ATP1B:FXYD pump.
      The annotation is a plasma-membrane location, which is independently consistent with human FXYD2b
      functional pump expression. It does not assert that FXYD2 is the glycoside receptor or independently
      mediates Tat secretion; the summary chiefly attributes those endpoints to the catalytic pump component.
    supported_by:
    - reference_id: Reactome:R-HSA-9684068
    - reference_id: PMID:33231612
