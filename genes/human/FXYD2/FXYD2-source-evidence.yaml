  qualifier: part_of
  review:
    action: ACCEPT
    summary: Human structural experiments directly support pump-complex membership.
    reason: PMID:35803952 coexpressed untagged human FXYD2 AAG37906.1 with N-FLAG alpha1 and C-Strep beta1
      in HEK293F cells, purified the complex and determined three cryo-EM states. This directly supports
