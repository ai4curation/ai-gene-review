current_biological_synthesis:
  description: FXYD2 is a small single-pass membrane protein that serves as the gamma regulatory subunit
    of the sodium/potassium-transporting ATPase. Association with the catalytic alpha and beta subunits
    changes pump ion-affinity and transport properties in ways that depend on ionic conditions and subunit
    context. Renal basolateral expression connects this regulatory role to epithelial ion homeostasis.
    Human variants can cause renal magnesium wasting, which does not imply that FXYD2 itself is a magnesium
    transporter. UniProt documents two natural protein isoforms with distinct N termini; their sequences
    are defined, while their individual endogenous distributions and functional differences remain incompletely
    resolved.
  core_functions:
  - description: Regulates the sodium/potassium-transporting ATPase as its membrane-associated gamma subunit.
      Human FXYD2b expression experiments establish changes in pump ion-affinity readouts, and human alpha1/beta1/FXYD2
      structures establish complex membership. Regulation is condition dependent; this core does not specify
      uniform activation, isolated gamma ATP hydrolysis, sodium-channel gating or magnesium transport.
      Basolateral renal localization is supported by ortholog experiments rather than an asserted new
      human tissue assay.
    molecular_function:
      id: GO:0060590
      label: ATPase regulator activity
    directly_involved_in:
    - id: GO:0043269
      label: regulation of monoatomic ion transport
    locations:
    - id: GO:0005886
      label: plasma membrane
    - id: GO:0016323
      label: basolateral plasma membrane
    in_complex:
      id: GO:0005890
      label: sodium:potassium-exchanging ATPase complex
    supported_by:
    - reference_id: PMID:33231612
      supporting_text: The apparent affinity for Na+i was reduced (K0.5,Na+ increased) by FXYD1, FXYD2,
        and FXYD6
    - reference_id: PMID:35803952
    - reference_id: PMID:16757733
  alternative_products:
  - id: P54710-1
    name: 1 (A)
    description: UniProt displayed product, 66 residues. Its sequence was matched to the official FASTA
      and the actual family alignment. No isoform-exclusive transport mechanism is inferred from gene-level
      annotations or historical isoform names.
  - id: P54710-2
    name: 2 (B)
    sequence_note: VSP_001580
    description: UniProt described product, 64 residues, formed by replacing canonical residues 1–8 MTGLSMDG
      with MDRWYL. Reconstruction exactly matches the official product FASTA. The functional paper calls
      its human construct FXYD2b, but its construct sequence and the structural accession AAG37906.1 have
      not been independently joined to current product sequences.
  suggested_questions:
  - question: Under which sequence-verified human FXYD2 product, pump-subunit and ionic conditions is
      ATP hydrolysis or sodium export positively regulated, and do those conditions explain the positive
      family inference?
  - question: Does FXYD2 bridge distinct macromolecular partners in a way that meets a molecular-adaptor
      definition, beyond its established association with the Na,K-ATPase complex?
  - question: Does human FXYD2 alter the conditional proton flux of the sodium/potassium pump, and is
      that contribution physiologically important?
  - question: How do the two current natural products differ in endogenous renal localization and function,
      and which product-specific peptide supports the historical urinary-vesicle detection?
  suggested_experiments:
  - description: Compare sequence-verified human products A and B with defined alpha/beta pump partners
      under matched intracellular and extracellular ion conditions, measuring ouabain-sensitive pump current
      and ATP hydrolysis separately. Product-specific endogenous localization and peptide measurements
      would distinguish tissue expression from historical construct naming.
