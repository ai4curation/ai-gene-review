selected_source_readings:
- reference_id: PMID:9048881
  title: Cloning and expression of human cDNA encoding Na+, K(+)-ATPase gamma-subunit.
  access: Authentic abstract only; full publisher article inaccessible.
  selected_locators:
  - Abstract
  urls:
  - https://doi.org/10.1016/S0167-4781(96)00219-9
  reading: Human fetal-liver cDNA and Northern tissue-expression report; the historical 58-residue sequence
    is not equated with the current 66- or 64-residue products. The original TAS complex context is retained
    with independent later human structural support, not a claim that this early full paper was read.
  full_text_unavailable: true
- reference_id: PMID:11062458
  title: Dominant isolated renal magnesium loss is caused by misrouting of the Na(+),K(+)-ATPase gamma-subunit.
  access: Authentic abstract only; attempted publisher PDF is an HTML failure, and indexed author page
    supplies no full original.
  selected_locators:
  - Abstract
  urls:
  - https://doi.org/10.1038/81543
  reading: Human dominant renal magnesium-loss study reports the G41R variant and misrouting of the gamma
    subunit. This establishes relevant disease/trafficking context at abstract scope. G41R is an experimental/disease
    variant, not a third natural product; detailed trafficking assays were not independently read.
  full_text_unavailable: true
- reference_id: PMID:11112438
  title: Genomic organization of the human FXYD2 gene encoding the gamma subunit of the Na,K-ATPase.
  access: Authentic abstract only; full original not recovered.
  selected_locators:
  - Abstract
  urls:
  - https://doi.org/10.1006/bbrc.2000.3907
  reading: Human FXYD2 genomic organization and alternative N termini are relevant to product provenance.
    Historical 66/68-residue descriptions are not silently substituted for current UniProt 66/64-residue
    products. Current sequences are independently reconstructed and matched to official FASTA; this paper
    is not a functional equivalence assay.
  full_text_unavailable: true
- reference_id: PMID:15489334
