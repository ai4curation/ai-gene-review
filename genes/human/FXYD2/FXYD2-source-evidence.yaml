  urls:
  - https://www.researchgate.net/publication/7613942_Interaction_with_the_NaK-ATPase_and_Tissue_Distribution_of_FXYD5_Related_to_Ion_Channel
  reading: Mouse FXYD5 cDNA and tagged constructs were coexpressed with rat alpha1/pig beta1 in Xenopus
    oocytes; mouse kidney was used for native association. Ouabain-sensitive current/rubidium flux supports
    enhanced pump activity. Historical ion-channel-related naming is not a channel assay, and this is
    FXYD5 donor evidence rather than direct human FXYD2 activation.
- reference_id: PMID:18263667
  title: FXYD5 modulates Na+ absorption and is increased in cystic fibrosis airway epithelia.
  access: Indexed publisher-original selected Methods, Results and Figures 1–2 captions; direct publisher
    access 403, entire body not recovered.
  selected_locators:
