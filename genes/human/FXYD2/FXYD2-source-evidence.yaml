  urls:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC6742001/
  reading: Bovine choroid-plexus/cerebellar biochemical preparations and rat CNS localization are distinct.
    Anti-phospholemman C-terminal antibody reduces ouabain-sensitive ATPase activity in bovine preparations;
    Table 1 includes tissue and antibody controls. This is positive donor FXYD1 evidence, without an equivalent
    human FXYD2-specific conditional mechanism.
  full_text_unavailable: false
- reference_id: PMID:15563542
  title: Hypertrophy, increased ejection fraction, and reduced Na-K-ATPase activity in phospholemman-deficient
    mice.
  access: Indexed author-posted original selected Results/Table 2 and Discussion plus abstract; full Methods
    not independently read.
  selected_locators:
  - Results/Table 2 pump activity; selected Discussion; abstract
  urls:
  - https://www.researchgate.net/publication/8162938_Hypertrophy_increased_ejection_fraction_and_reduced_Na-K-ATPase_activity_in_phospholemman-deficient_mice
  reading: Phospholemman-deficient mouse cardiac preparations have reduced ouabain-sensitive ATPase activity
    and altered alpha2 abundance. The paper discusses primary versus secondary effects of hypertrophy.
    Its association preparation is pig heart, not mouse. These selected endpoints support donor pump regulation
    but do not establish a sodium-channel interaction.
- reference_id: PMID:17095720
  title: Phospholemman phosphorylation mediates the protein kinase C-dependent effects on Na+/K+ pump
    function in cardiac myocytes.
  access: Indexed author-posted original selected Methods and Results; no figure-image or supplement assessment.
  selected_locators:
  - Methods myocyte isolation, Na measurements and voltage clamp; Results PKC-dependent Na extrusion
  urls:
  - https://www.researchgate.net/publication/6701154_Phospholemman_phosphorylation_mediates_the_protein_kinase_C-dependent_effects_on_NaK_pump_function_in_cardiac_myocytes
  reading: Isolated ventricular myocytes from young adult wild-type and phospholemman-knockout mice were
    assayed by SBFI sodium decline and pump current. PKC stimulation raises sodium-extrusion Vmax in wild
    type but not knockout. Current measurements inactivate sodium channels, separating the pump assay.
    The phosphorylation-dependent FXYD1 result supports its positive-export donor annotation; it does
    not by itself demonstrate the same conditional mechanism in FXYD2.
- reference_id: PMID:16148001
  title: Interaction with the Na,K-ATPase and tissue distribution of FXYD5 (related to ion channel).
  access: Indexed author-posted original selected construct/transport Methods and Results/Figures 8–9.
  selected_locators:
