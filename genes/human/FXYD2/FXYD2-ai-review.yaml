id: P54710
gene_symbol: FXYD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FXYD2 is a small single-pass membrane protein that serves as the gamma regulatory subunit
  of the sodium/potassium-transporting ATPase. It associates with the catalytic alpha and beta subunits
  and modulates pump ion-affinity and transport properties. Human FXYD2b lowers the apparent affinity
  for intracellular sodium in alpha1/beta1 pumps when intracellular potassium is present; this difference
  disappears without intracellular potassium. Mouse kidney experiments also support a contribution to
  pump thermal stability. Renal basolateral expression connects this regulatory role to epithelial ion
  homeostasis. Human variants can cause renal magnesium wasting, which does not imply that FXYD2 itself
  is a magnesium transporter. Two N-terminal splice variants are documented; their individual endogenous
  distributions and functional differences remain incompletely resolved.
alternative_products:
- id: P54710-1
  name: 1 (A)
  description: Displayed 66-residue product with the N-terminal sequence MTGLSMDG. Its sequence matches
    the official FASTA and family alignment.
- id: P54710-2
  name: 2 (B)
  sequence_note: VSP_001580
  description: Described 64-residue product in which MDRWYL replaces residues 1–8 MTGLSMDG of the displayed
    sequence. Reconstruction matches the official product FASTA.
