  title: FXYD2 original contexts, source access, product sequences and extension mapping
core_functions:
- description: Regulates the sodium/potassium-transporting ATPase as its membrane-associated gamma subunit,
    contributing to sodium export and potassium import within the pump complex. Human FXYD2b lowers apparent
    intracellular sodium affinity in the presence of intracellular potassium, and human alpha1/beta1/FXYD2
    structures establish complex membership. Mouse knockout experiments additionally support pump thermal
    stability. These observations describe conditional regulation within the complex, not isolated gamma
    ATP hydrolysis or independent ion translocation. Basolateral renal localization is supported by ortholog
    experiments without asserting a new human tissue assay.
  molecular_function:
    id: GO:0060590
    label: ATPase regulator activity
  directly_involved_in:
