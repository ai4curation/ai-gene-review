  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:95778
  - PANTHER:PTN002566486
  - RGD:1304683
  - UniProtKB:P04695
  - UniProtKB:P11488
  review:
    summary: Rod outer segment, where transducin resides and signals in the dark.
    action: ACCEPT
    reason: Rod transducin is concentrated in the outer segment in darkness, partly bound to the disc membranes
      and, once activated, partly soluble in the outer segment cytoplasm, so outer segment is the appropriate level
      for an assay that does not resolve the disc membrane and for the IBA placed on the transducin-alpha-1 node
      (human GNAT1 is one of the seeds, which is expected). Mouse, rat and bovine studies show this directly; the
      PMID:2534964 IDA row is kept in deference to the curator, since the abstract-only cache shows only the cone-alpha
      staining and the cloning of the human rod gene. The more specific membrane location is captured by the GO:0120202
      rows.
    supported_by: &id001
    - reference_id: PMID:17507570
      supporting_text: In darkness, transducin is sequestered within the membrane-enriched outer segments of the
        rod cell. In light, it disperses throughout the entire neuron
    - reference_id: PMID:17881533
      supporting_text: In contrast to native G alpha(t), which resides in the outer segments of dark-adapted rods
