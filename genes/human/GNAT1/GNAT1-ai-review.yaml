    reason: Propagated from the Eukaryota root node of the G alpha family (IBA) and from InterPro (IEA). The term
      is right for the Gs/Gi branches but not for transducin, whose effector is the rod cGMP phosphodiesterase PDE6,
      reached through its inhibitory gamma subunits; no study on rod transducin from any species shows modulation
      of adenylate cyclase, and GO:0141190, which the gene carries, is not a descendant of GO:0007188. PAINT records
      no loss for this term on the transducin clade, so this is an over-propagation on biological grounds rather
      than a recorded loss.
    supported_by:
    - reference_id: PMID:33007200
      supporting_text: The structure reveals two GαT·GTP subunits engaging the PDE6 hetero-tetramer at both the
        PDE6 catalytic core and the PDEγ subunits, driving extensive rearrangements to relieve all inhibitory constraints
        on enzyme catalysis
    - reference_id: Reactome:R-HSA-74059
      supporting_text: activated transducin (GNAT1-GTP) sustains PDE6 activation allowing it to hydrolyze cGMP at
        a rate limited only by diffusional access to substrate
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000026392
        comment: Eukaryota root node of the G alpha family carrying the adenylate cyclase-modulating IBD; right
          for the Gs/Gi branches, but the transducin clade signals to PDE6 rather than adenylate cyclase. PAINT
          records no loss on the transducin lineage.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
