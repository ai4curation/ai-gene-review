  review:
    summary: Acyl binding, transferred from bovine N-acylation data.
    action: MARK_AS_OVER_ANNOTATED
    reason: The bovine donor paper shows that the N-terminal glycine of transducin alpha is covalently acylated
      with C12-C14 fatty acyl groups. GO binding terms describe non-covalent interactions, so a covalently attached
      acyl chain is a lipid modification (lipid anchor) of the protein, not acyl binding by it.
    supported_by:
