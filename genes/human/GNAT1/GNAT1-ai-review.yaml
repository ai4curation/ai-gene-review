id: P11488
gene_symbol: GNAT1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GNAT1 encodes the alpha subunit of rod transducin (Gt alpha-1, Galpha-t1), a heterotrimeric G protein
  alpha subunit of the G(i/o/t/z) subfamily expressed in retinal rod photoreceptors. Anchored by an N-terminal heterogeneous
  fatty acylation (myristoyl/lauroyl) and its association with Gbeta1/Ggamma1 (GNB1/GNGT1), it sits on the cytoplasmic
  surface of the rod outer segment disc membranes. Light-activated rhodopsin catalyses GDP-GTP exchange on the alpha
  subunit; GTP-bound Gt alpha separates from Gbeta-gamma and binds the inhibitory gamma subunits (PDE6G) of the
  rod cGMP phosphodiesterase PDE6, relieving their inhibition so that cGMP is hydrolysed and the cGMP-gated channels
  close. Signalling is terminated by its intrinsic GTPase, accelerated by the RGS9-Gbeta5-R9AP complex. Under bright
  light most of the protein moves from the outer segment to the inner segment, cell body and synaptic region, helping
  to adapt rod sensitivity, and returns in the dark with the help of UNC119. Rods use it as their only transducin:
  loss of function in mice abolishes rod responses, and human variants cause dominant (for example Nougaret G38D,
  Q200E) or recessive congenital stationary night blindness.'
