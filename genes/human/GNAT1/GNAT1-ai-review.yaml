core_functions:
- description: 'Rod transducin alpha subunit: as part of the GNAT1/GNB1/GNGT1 heterotrimer on the rod disc membrane
    it is activated by photoactivated rhodopsin (GDP-GTP exchange), and the GTP-bound alpha activates PDE6 by displacing
    its inhibitory gamma subunits; its intrinsic, RGS9-accelerated GTPase ends the signal.'
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0141190
    label: transducin-mediated opsin signaling pathway
  locations:
  - id: GO:0120202
    label: rod photoreceptor disc membrane
  in_complex:
    id: GO:0005834
    label: heterotrimeric G-protein complex
  supported_by:
  - reference_id: PMID:31300275
    supporting_text: activates the G-protein transducin (GT) by catalyzing GDP-GTP exchange on its α subunit (GαT)
  - reference_id: PMID:33007200
    supporting_text: The structure reveals two GαT·GTP subunits engaging the PDE6 hetero-tetramer at both the PDE6
      catalytic core and the PDEγ subunits, driving extensive rearrangements to relieve all inhibitory constraints
      on enzyme catalysis
  - reference_id: PMID:11095744
    supporting_text: These results indicate that most if not all rods use a single transducin type in phototransduction
suggested_questions:
- question: Does rod transducin alpha have a physiological role outside rods (taste cells, intestine, pineal), or
    are those reports cross-reactivity with gustducin or cone transducin?
- question: How do the dominant Nougaret G38D and the Q200E alleles differ mechanistically, given that one fails
    to activate PDE6 and the other is predicted to be GTPase-defective, yet both give stationary night blindness?
suggested_experiments:
- hypothesis: Q200E abolishes intrinsic and RGS9-accelerated GTP hydrolysis while preserving PDE6 activation.
  description: Express human GNAT1 wild type, G38D, Q200E and D129G and measure rhodopsin-catalysed nucleotide exchange,
    intrinsic and RGS9-Gbeta5-accelerated GTPase rates and PDE6 activation.
status: COMPLETE
