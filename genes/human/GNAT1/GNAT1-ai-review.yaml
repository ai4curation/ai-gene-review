  review:
    summary: Bitter taste detection, transferred from rat.
    action: MARK_AS_OVER_ANNOTATED
    reason: The rat donor study found rod transducin in taste cells and showed that denatonium activates it in vitro
      in the presence of taste-cell membranes; the authors state the role as a suggestion. Bitter transduction is
      carried mainly by gustducin (GNAT3), PAINT places the bitter-taste term on the cone transducin (GNAT2) node,
      not the GNAT1 node, and no evidence shows a role for human GNAT1 in taste.
    supported_by:
    - reference_id: PMID:7596440
      supporting_text: These results suggest that rod transducin transduces bitter taste
