- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic inference that ACTL8 acts in the actin cytoskeleton, from the deepest of the
      three PANTHER nodes cited anywhere in this gene's GOA record. This row is treated differently
      from the other ten IBA rows, and the reason is the clade the donating node covers rather than
      the quality of its donors.

      PTN002631484 donates GO:0015629 to eighteen human genes, spanning the conventional actins
      (ACTA1, ACTA2, ACTB, ACTC1, ACTG1, ACTG2), the POTE actin-fusion genes, and the divergent
      actin-like proteins ACTL8, ACTL9, ACTL10, ACTRT1, ACTRT2 and ACTRT3 - identity to beta-actin
      across that set runs from 33.7 to 100 per cent. That is a node whose reconstructed ancestral
      state genuinely is the shared actin-fold state, and the term it donates is correspondingly
      generic: "The part of the cytoskeleton (the internal framework of a cell) composed of actin
      and associated proteins. Includes actin cytoskeleton-associated complexes." So the breadth of
      this term is not a granularity failure - it is the true last common ancestor of a
      heterogeneous donor set, and no specificity upgrade is warranted. Of the 25 WITH/FROM tokens
      on this row, 24 resolve to protein entries and 23 of those carry their own IDA for the term,
      spanning 12 organisms; the exception is pig ACTB (Q6QAQ1), which carries IPI.

      A comparison across ACTL8's own relatives closes the argument. Of the eight divergent human
      actin-like and actin-related-T proteins, ACTL8 is the only one that receives an IBA from either
      narrow node: ACTL7A and ACTL7B draw on PTN001377938, PTN008986520 and PTN008986528, while
      ACTL9, ACTL10, ACTRT1, ACTRT2 and ACTRT3 all draw on PTN000940351 and this same deep node
      PTN002631484. The consequence is quantitative - ACTL8 carries 11 IBA rows against a median of 2
      across its seven relatives, a roughly five-fold inflation traceable to one tree placement.

      It is retained as non-core rather than accepted because no direct evidence places ACTL8 in
      this compartment. UniProt's own subcellular location for ACTL8 is Cytoplasm, cytoskeleton
      with evidence code ECO:0000250 - by similarity, and with no source entry cited - so the only
      non-phylogenetic support for cytoskeletal residence is itself a similarity statement.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correctly scoped family-level inference, and the only IBA row on this gene whose donating
      node spans the divergent actin-like proteins rather than the near-identical cytoplasmic
      actins. It is kept because it asserts nothing that the sequence contradicts, and marked
      non-core because no experiment has localised ACTL8 to the actin cytoskeleton and because a
      generic compartment term cannot represent the core of a gene whose activity is unknown.
