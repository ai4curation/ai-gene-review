      Neuronal developmental process inherited from beta-actin with a single protein donor, no
      expression evidence in neurons, and no structural basis for participating in actin dynamics.
      It is also downstream of the same node error as the axon and synapse rows, so it should be
      corrected with them rather than separately. GO_REF:0000033 rows like this one are exactly the
