  review:
    summary: >-
      Phylogenetic transfer of a neuronal developmental process, resting on two sources: the
      mis-placing node PTN007551913 and rat Actb, which carries its own IDA for axonogenesis. This
      is the thinnest support of any IBA row on the gene - a single protein donor.

      Axon outgrowth depends on regulated actin polymerisation in the growth cone. Assigning ACTL8
      to it requires both that ACTL8 be present in developing neurons and that it participate in
      actin dynamics there; neither is supported. ACTL8 is testis-enriched, has no reported
      neuronal expression, and has lost most of the polymerisation interface.
