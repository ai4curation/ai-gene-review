id: Q9H568
gene_symbol: ACTL8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACTL8 is a divergent, testis-enriched actin-family protein whose endogenous molecular function remains unresolved. It retains an actin fold, but substitutions at conventional actin contact surfaces suggest altered assembly properties; polymerization and filament association have not been established experimentally. Cytoplasmic ACTL8 has been detected in human tumor tissue. ACTL8 is also known as cancer/testis antigen 57 and is expressed in several carcinomas, where knockdown reduces proliferation, migration and invasion and alters PI3K/AKT/mTOR-MYC signaling. A breast-cancer study reports direct binding of the small molecule Momordin Ic by surface plasmon resonance and thermal shift assays and partial pathway rescue by MYC overexpression. These results provide a biochemical ligand and signaling context without yet identifying ACTL8’s normal testicular mechanism.
