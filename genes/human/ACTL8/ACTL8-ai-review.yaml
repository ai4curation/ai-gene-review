- term:
    id: GO:0098973
    label: structural constituent of postsynaptic actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      This is the only molecular function ACTL8 carries other than bare protein binding, and it is
      the row where the propagation failure is most direct, because the term names the exact
      property the sequence has lost. Its definition is "The action of a molecule that contributes
      to the structural integrity of a postsynaptic actin cytoskeleton" - a structural contribution
      to an actin network, in a postsynaptic compartment.

      Structural contribution to an actin network means being part of the polymer. Computing the
      F-actin protomer-protomer interface directly from PDB 6DJO gives 38 residues within 4.0
      angstrom of a neighbouring protomer; of these ACTL8 retains 8 identical and 3 conservatively
      substituted and has 24 non-conservative substitutions plus 3 deletions, so only 11 of 38
      positions are chemically compatible. Within the DNase-I binding loop, which makes the
      principal longitudinal contact and is anchored in the alignment by an invariant proline, 8 of
      10 contacts are non-conservative: R39 to C38, Q41 to E40, G42 to N41, V43 to P42, M44 to G43,
      V45 to P44, M47 to Y46, Q49 to R48. Beta-actin scores 37 identical plus 1 conservative on the
      same set, and Drosophila Arp53D - a genuinely divergent actin-like protein that does
      polymerise - scores 29 plus 4. Both tallies are unchanged under a second substitution matrix
      and gap model.

      The metric has to be read at its real strength, and the analysis itself supplies the limit.
      Ranked over the whole panel, ACTL8's 11 of 38 sits in a band with the other divergent
      actin-likes - ACTL7A 14, ACTL7B and ACTL9 16, ACTRT1 21 - and **human Arp3 (ACTR3) scores 8,
      below ACTL8**, with Arp2 at 22. Arp2 and Arp3 form the first protomer pair of a daughter
      filament at an Arp2/3 branch, so they demonstrably do occupy protomer positions in an
      actin-containing structure. A low score therefore bounds *canonical incorporation into a
      conventional two-stranded filament*; it does not establish that a protein cannot be part of any
      actin-containing assembly. Stated at that strength the structural half of this row shows the
      transferred structural role is unsupported rather than impossible - which is why the REMOVE
      rests on the postsynaptic half, below, and not on the tally alone.

      The postsynaptic half fails independently: the donors are human ACTB (EXP plus IDA x 3 plus
      IMP) and rat Actg1 (IDA x 2), and there is no evidence ACTL8 is present in a neuron at all.
      The donating node PTN002631586 contains only ACTB, ACTG1, ACTBL2, the five POTE genes and
      ACTL8, with ACTL8 the sole member below 90 per cent identity to beta-actin.
    action: REMOVE
    reason: >-
      The transferred molecular function is a structural contribution to an actin polymer in a
      postsynaptic compartment, and both halves are contradicted for ACTL8 by independent evidence.
      Structurally, only 11 of 38 filament-interface positions are compatible with beta-actin and 8
      of 10 D-loop contacts are non-conservatively substituted, so canonical protomer incorporation
      is unlikely and there is no positive basis for ACTL8 contributing structural integrity to an
      actin network - stated at that strength because human Arp3 scores lower still on the same
      metric while occupying a protomer position at an Arp2/3 branch. Contextually, ACTL8 is
      testis-enriched with no reported neuronal expression or synaptic localisation, while the
      donors' evidence is entirely from conventional actin in neurons. The donating node is a beta-actin subfamily in which ACTL8 is
      the only divergent member. This is a positive argument for removal rather than a hedge: the
      annotation asserts a specific physical property that the sequence lacks.
    supported_by:
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: '| ACTL8 (human actin-like 8) | 8 | 3 | 24 | 3 |'
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: '| Arp53D (Drosophila actin-like 53D; IBA donor) | 29 | 4 | 5 | 0 |'
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: '| ACTR3 (human Arp3) | 8 |'
    - reference_id: file:human/ACTL8/ACTL8-uniprot.txt
      supporting_text: 'DR   HPA; ENSG00000117148; Tissue enriched (testis).'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002631586
        source_label: PANTHER node containing ACTB, ACTG1, ACTBL2, five POTE genes and ACTL8
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Not a protein. QuickGO shows it donating GO:0005884 and GO:0098973 to nine human genes;
          eight are at least 90.7 per cent identical to beta-actin and ACTL8 is at 33.8 per cent.
          The ancestral state this node reconstructs is beta-actin's, not the actin family's.
      - source_id: UniProtKB:P60709
        source_label: ACTB, human beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Carries EXP, IDA x 3 and IMP for this term from PMID:18341992. The source annotation is
          strong experimental work on beta-actin; it simply does not extend to a 34 per cent
          identical paralog with a demolished protomer interface.
      - source_id: RGD:1304556
        source_label: Actg1, rat gamma-actin (P63259)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA x 2.
- term:
    id: GO:0005884
    label: actin filament
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic transfer of residence in an actin filament, from the same narrow node as
      GO:0098973. The term's definition is specific about what a filament is: "A filamentous
      structure formed of a two-stranded helical polymer of the protein actin and associated
      proteins."

      The interface analysis argues against ACTL8 forming such a polymer: 24 of 38 protomer-contact
      positions are non-conservatively substituted, 3 fall in a deletion, and the D-loop is almost
      entirely rewritten. Nothing in the human data places ACTL8 on a filament either.

      The tally does not settle the row on its own, and the reason is visible in the same analysis:
      ranked across the panel, ACTL8's 11 of 38 lies in a band with ACTL7A (14), ACTL7B and ACTL9
      (16) and ACTRT1 (21), and human Arp3 (ACTR3) scores 8 - lower than ACTL8 - while Arp2 scores
      22. Both Arps occupy protomer positions at an Arp2/3 branch, so the metric bounds canonical
      two-stranded protomer incorporation rather than filament association in general. That is
      exactly why this row is hedged rather than removed.

      This row is marked over-annotated rather than removed, and the difference from GO:0098973 is
      deliberate. GO:0098973 makes two extra claims - that ACTL8 performs a structural function,
      and that it does so postsynaptically - and both are separately contradicted. GO:0005884 says
      only that ACTL8 is active in an actin filament, and the definition's phrase "and associated
      proteins" leaves room for a non-polymerising protein to be present in the structure, for
      instance by capping or by sub-stoichiometric incorporation into a heteropolymer. That has not
      been tested, so it is unsupported rather than refuted.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Unsupported rather than demonstrably wrong. The residues that would let ACTL8 polymerise are
      largely gone, so it should not be presented as a filament component, but the term admits
      associated proteins as well as protomers and no experiment has asked whether ACTL8 binds or
      decorates F-actin. Deliberately weaker than the REMOVE on GO:0098973, which additionally
      asserts a structural role and a postsynaptic location. The polymerisation question is listed
      under suggested_experiments; a pyrene-actin or cosedimentation result would settle this row
      either way.
    supported_by:
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: '| ACTL8 (human actin-like 8) | 8 | 3 | 24 | 3 |'
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: '| ACTR3 (human Arp3) | 8 |'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002631586
        source_label: PANTHER node containing ACTB, ACTG1, ACTBL2, five POTE genes and ACTL8
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Not a protein; the beta-actin subfamily node described on the GO:0098973 row.
      - source_id: UniProtKB:P63261
        source_label: ACTG1, human gamma-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA for actin filament.
      - source_id: MGI:MGI:87906
        source_label: Actg1, mouse gamma-actin (P63260)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA for actin filament.
