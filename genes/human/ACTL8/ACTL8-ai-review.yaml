references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Source of all eleven IBA rows on ACTL8. Ten of them originate from two PANTHER nodes (PTN002631586, PTN007551913) whose only human member below 90.7 per cent identity to beta-actin is ACTL8 itself, at 33.8 per cent; the eleventh, GO:0015629, comes from a deeper node whose clade genuinely spans the divergent actin-like proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The GO_REF itself is correctly cited; the issue found here is with where ACTL8 sits in the PANTHER tree, not with the method. Clade membership was verified by querying QuickGO for each node's human targets and aligning each target to beta-actin.
