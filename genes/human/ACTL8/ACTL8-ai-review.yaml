      partner is informative enough to justify replacing the term with something meaningful. Here it
      is not, for three reasons. First, this row and the next are the same interaction: both cite
      CERT1, the second on isoform Q9Y5P4-2, so the record contains one pair, not two. Second, both
      references are the same laboratory's yeast two-hybrid pipeline, and the later paper describes
      itself as an expansion of the earlier search space - so this is one assay class from one
      group, not independent confirmation. Third, no orthogonal or functional validation of the
      ACTL8-CERT1 pair is reported anywhere, and no mechanism connects a divergent actin-fold
      protein to non-vesicular ceramide transfer between the endoplasmic reticulum and the Golgi.

      Kept as a record of the observation, but flagged: the honest reading is a screen hit awaiting
      independent validation, not an established interaction. Because no informative term can be
      chosen without knowing what the interaction does, MODIFY is not available here.
