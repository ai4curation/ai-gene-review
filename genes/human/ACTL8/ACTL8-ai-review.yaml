        source_label: Actg1, rat gamma-actin (P63259)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA x 4.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic transfer of cytoplasmic residence. This is the one row from the narrow
      beta-actin node that survives, because it happens to be independently verifiable in human
      tissue rather than only inferable from the tree.

      Immunohistochemistry on head-and-neck squamous carcinoma with an anti-ACTL8 antibody shows
      moderate focal cytoplasmic staining, described by the authors as confirming expression at the
      protein level. ACTL8 also has no signal peptide, no transmembrane segment and no
      organelle-targeting feature in its UniProt feature table, and it is recorded at PE 1 from
      proteomics. Cytoplasmic is therefore the compartment statement the human data actually
      supports, and it is the level at which ACTL8's localisation should currently be recorded.

      It is a generic term and so cannot be core, and the is_active_in relation is stronger than
      the evidence - the protein is present in the cytoplasm, but no activity has been localised
      anywhere. A curator revisiting this row should consider whether located_in is the better
      relation, and whether the immunohistochemistry in PMID:41129177 supports upgrading the
      evidence code.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct and, unusually for this gene, corroborated outside the phylogeny: anti-ACTL8
      immunohistochemistry on human tumour tissue gives cytoplasmic staining, and the protein
      carries no targeting signal that would put it elsewhere. Kept rather than marked
      over-annotated because nothing about it is inflated - it is the least specific and
      best-supported statement in the record. Non-core rather than accepted-as-core for internal
      consistency: core_functions is deliberately empty because no molecular function is
      established, so no row on this gene can be asserted as core, and a bare cytoplasm term could
      not carry that weight even if one could. The open question is the relation, not the term.
    supported_by:
    - reference_id: PMID:41129177
      supporting_text: >-
        we validated expression of ACTL8 via IHC, which revealed moderate focal cytoplasmic
        staining, confirming expression at the protein level
    - reference_id: file:human/ACTL8/ACTL8-uniprot.txt
      supporting_text: 'PE   1: Evidence at protein level;'
    - reference_id: file:human/ACTL8/ACTL8-deep-research-affinage.md
      supporting_text: ACTL8 protein is detected in the cytoplasm of tumor cells
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
