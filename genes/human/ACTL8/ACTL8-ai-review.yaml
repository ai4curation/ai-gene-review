      PANTHER nodes PTN002631586 and PTN007551913 each donate to nine human genes; eight are at
      least 90.7 per cent identical to beta-actin over their aligned actin block, and ACTL8 is the
      ninth at 33.8 per cent.
  - statement: >-
      Of 19 residues within 4.0 angstrom of ATP or its divalent cation in PDB 2BTF chain A, ACTL8
      retains 11 identical and 3 conservatively substituted, with 5 non-conservative substitutions
      (D157, K213, E214, T303, K336). The four conventional actins score 19 of 19 compatible.
  - statement: >-
      Of 38 residues within 4.0 angstrom of a neighbouring protomer in PDB 6DJO F-actin, ACTL8
      retains only 8 identical and 3 conservative, with 24 non-conservative substitutions and 3
      deletions; 8 of the 10 D-loop contacts are non-conservative. Both tallies are unchanged under
      a second substitution matrix and gap model.
  - statement: >-
      All 47 WITH/FROM tokens that resolve to protein entries carry their own experimental-code
      annotation for the term they donated, from 25 distinct reviewed Swiss-Prot proteins, so the
      failures on this gene are propagation failures and not weak sources.
  - statement: >-
      Ranked across the panel, ACTL8's 11 of 38 compatible interface positions sits in a band with
      ACTL7A (14), ACTL7B and ACTL9 (16) and ACTRT1 (21), and human Arp3/ACTR3 scores 8 - below
      ACTL8 - while Arp2 scores 22. Since both Arps occupy protomer positions at an Arp2/3 branch,
      the metric bounds canonical two-stranded protomer incorporation, not filament association in
      general.
  - statement: >-
      Of the eight divergent human actin-like / actin-related-T proteins, ACTL8 is the only one that
      receives an IBA from either narrow beta-actin node, and it carries 11 IBA rows against a median
      of 2 across the other seven.
  - statement: >-
      Of 32 human PTHR11937 members, only 7 have an experimentally supported molecular function once
      bare GO:0005515 protein binding is excluded, and among the eight divergent actin-like and
      actin-related-T members (ACTL7A, ACTL7B, ACTL8, ACTL9, ACTL10, ACTRT1, ACTRT2, ACTRT3) only
      ACTRT1 does. Most but not all of that set is testis-restricted - UniProt describes ACTRT3 as
      ubiquitously expressed - so it is grouped here by sequence divergence, not by tissue.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis written for this review. All inputs are fetched live from UniProt, RCSB and QuickGO
      at run time; RESULTS.md and results.json were verified byte-identical on a repeat run.
suggested_questions:
- question: >-
    Should ACTL8 be moved out of PANTHER's cytoplasmic-actin subfamily? Nodes PTN002631586 and
    PTN007551913 each cover nine human genes - ACTB, ACTG1, ACTBL2, POTEE, POTEF, POTEI, POTEJ,
    POTEKP and ACTL8 - and the first eight are all at least 90.7 per cent identical to beta-actin
    because each POTE protein carries a C-terminal actin-family domain (UniProt SIMILARITY) that is
    nearly identical to beta-actin. ACTL8 joins them
    at 33.8 per cent, a 57-percentage-point gap. As a result ACTL8 has inherited ten annotations
    that are really beta-actin's cell biology, including synapse, axon, axonogenesis and membership
    of the NuA4 complex. The deeper node PTN002631484, whose clade runs from 33.7 to 100 per cent
    identity, donates only the generic GO:0015629 and is the level at which ACTL8 should be
    receiving inferences - and it is where every one of ACTL8's own divergent relatives sits. Of the
    eight human actin-like / actin-related-T proteins, ACTL8 is the only one under either narrow
    node; ACTL7A and ACTL7B use PTN001377938, PTN008986520 and PTN008986528, and ACTL9, ACTL10,
    ACTRT1, ACTRT2 and ACTRT3 use PTN000940351 plus PTN002631484. ACTL8 consequently carries 11 IBA
    rows against a median of 2 for those relatives. Is the tree placement wrong, or is it right and
    the ancestral-state calls at these two nodes need restricting?
- question: >-
    Should GO:0035267 NuA4 histone acetyltransferase complex be reviewed for the other eight human
    descendants of PTN007551913, not only for ACTL8? The node assigns membership to ACTB, ACTG1,
    ACTBL2, ACTL8 and the five POTE genes. ACTB's membership is not in question - it has its own IDA
    and is named in the term's definition, alongside BAF53/ACTL6A, as an actin subunit of the human
    complex. That is the point: the definition specifies which paralog, so the other eight rows are
    all similarity transfers of a purification result. Complex membership is established by
    purifying a particular subunit and does not descend a family, so this looks like a systematic
    rather than a gene-specific problem.
- question: >-
    Why does UniProt's ECO:0000250 subcellular location for ACTL8 cite no source entry? The line
    reads "SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton {ECO:0000250}" with no UniProtKB accession
    after the code, so the similarity being invoked cannot be traced. GOA then converts it into an
    IEA (GO:0005856, GO_REF:0000044) that reads as independent of the phylogenetic annotations while
    resting on the same inference. Either the source entry should be added or the statement
    reconsidered - and given that the protein has been detected in the cytoplasm by
    immunohistochemistry, a plain Cytoplasm statement with ECO:0000269 would be better supported
    than the cytoskeletal one.
- question: >-
    Does ACTL8 bind ATP? Five of the 19 residues that contact ATP in beta-actin are
    non-conservatively substituted in ACTL8 (D157 to Tyr, K213 to Gln, E214 to Met, T303 to Asn,
    K336 to Asn), but the P1 phosphate loop, the Mg-coordinating Gln137 equivalent and the
    adenosine-contacting Gly301-Gly302 and Tyr306 equivalents are all intact. This is neither an
    intact site nor an ablated one, and no ATP-binding annotation exists for ACTL8 in either
    direction. A nucleotide-binding measurement would decide whether the gene deserves GO:0005524
    or a NOT annotation, and either outcome would be more informative than the current silence.
- question: >-
    Should a gene whose evolved function is unknown carry a description-only core function? The
    schema permits it - molecular_function is not a required slot on CoreFunction - so an entry
    saying "unknown, actin fold retained, no activity assigned" would validate and would silence the
    "No core functions defined" warning. This review leaves core_functions empty instead, on the view
    that a core function should assert something and that the warning is the correct signal for an
    MF-dark gene. If the project would rather have an explicit placeholder for the 25 of 32 human
    PTHR11937 members with no informative experimental molecular function, that is a convention worth
    settling once rather than per gene.
- question: >-
    Is there any GO representation for a cancer/testis antigen's phenotype in a tissue where it is
    ectopically expressed? Every functional experiment on ACTL8 is a knockdown in a tumour line
    that has reactivated a normally testis-restricted gene. The resulting proliferation and
    migration phenotypes are real and reproducible, but describing them as the gene's biological
    process conflates what a protein does when misexpressed with what it evolved to do. GO has no
    qualifier for this distinction, and ACTL8 is a clean example of why one might be useful.
- question: >-
    What does ACTL8 do in the testis? It is testis-enriched in HPA and strongly expressed in testis
    and pancreas, and three of its closest human relatives are characterised sperm proteins:
    UniProt describes ACTL7A as "Essential for normal spermatogenesis and male fertility" and
    required for sperm head morphology, acroplaxome formation and acrosome attachment; ACTL9 as a
    testis-specific protein acting in proacrosomal vesicle fusion and perinuclear theca formation;
    and ACTL7B as detected only in testis and, to a lesser extent, prostate. The clade is not
    uniform - ACTRT1's characterised activity is negative regulation of Hedgehog signalling through
    the GLI1 promoter, and ACTRT3 is described as ubiquitously expressed - so this is a lead rather
    than a presumption. None of ACTL8's literature examines the testis at all. If it does belong
    with the sperm-structural members, the annotations it needs are spermatogenesis and
    sperm-structure terms, and none is present.
- question: >-
    Is the ACTL8-CERT1 interaction real? It is the gene's only reported partner, recorded with
    NbExp=3 in IntAct, but both supporting references are the same laboratory's yeast two-hybrid
    pipeline and the second is an expansion of the first, so the apparent replication is not
    independent. No orthogonal assay, no functional follow-up, and no mechanism relating a divergent
    actin-fold protein to non-vesicular ceramide transport. A single co-immunoprecipitation would
    either make this the one informative molecular-function annotation available for ACTL8 or retire
    it.
- question: >-
    Should the GO:0030855 epithelial cell differentiation IEP be reconsidered? It comes from a
    two-dimensional gel study of Caco-2 differentiation in which 53 spots changed and 34 were
    identified by MALDI-TOF. Peptide-mass fingerprinting within the actin family is intrinsically
    difficult, and ACTL8 is testis-enriched while Caco-2 is intestinal. The full text is not
    available here so the identification cannot be checked, but a curator with access could confirm
    whether the ACTL8 spot assignment was supported by ACTL8-specific peptides.
suggested_experiments:
- hypothesis: >-
    ACTL8 does not polymerise into filaments, consistent with the loss of 24 of 38 protomer-contact
    positions and almost the entire D-loop.
  description: >-
    Express and purify recombinant ACTL8 and test it in the standard actin assays: pyrene-actin
    fluorescence for spontaneous polymerisation, high-speed cosedimentation for filament formation,
    and electron microscopy of any polymer formed. Then test the two alternatives the interface data
    do not exclude - co-polymerisation with beta-actin at sub-stoichiometric ratios, and binding to
    preformed F-actin without incorporation. A protein that neither polymerises nor binds F-actin
    would settle GO:0005884 and GO:0015629; one that decorates filaments would need an
    actin-binding molecular function rather than a filament-component location.
  experiment_type: biochemistry
- hypothesis: >-
    ACTL8 retains nucleotide binding despite losing five direct ATP contacts, because the P1 loop
    and the adenosine pocket are intact.
  description: >-
    Measure nucleotide binding to purified ACTL8 by isothermal titration calorimetry or a
    fluorescent ATP analogue, with beta-actin as a positive control and the five substituted
    positions reverted to their actin identities as a test of which substitutions matter. Include a
    malachite-green or HPLC hydrolysis assay, since the P2-loop aspartate is one of the residues
    lost. A clean negative result would justify a NOT ATP binding annotation, which for a protein
    named after the actin fold is more useful than the current absence of any statement.
  experiment_type: biochemistry
- hypothesis: >-
    ACTL8's physiological function is in spermatogenesis, in common with the other testis-restricted
    actin-like proteins, and is unrelated to its tumour phenotypes.
  description: >-
    Generate an Actl8 knockout mouse and examine fertility, sperm counts, sperm morphology and
    acrosome and perinuclear-theca ultrastructure - the phenotypes reported for ACTL7A and ACTL9,
    the two relatives with established sperm functions. In parallel, localise endogenous ACTL8 in human and mouse
    testis sections by immunofluorescence with a validated antibody. This is the experiment that
    would give ACTL8 its first physiological annotation rather than another cancer-cell-line
    phenotype.
  experiment_type: genetics
- hypothesis: >-
    ACTL8's effect on PI3K/AKT/mTOR phosphorylation in tumour cells is indirect, since no direct
    interaction with any pathway component has ever been shown.
  description: >-
    Perform proximity labelling from endogenously tagged ACTL8 in a tumour line that expresses it
    natively, such as MDA-MB-231, and compare the resulting proteome with an ACTL8 knockdown
    transcriptome from the same cells. If no PI3K, AKT or mTOR component is a proximity neighbour but
    upstream regulators change transcriptionally, the pathway effect is downstream of a
    transcriptional program and the annotation should stay on regulation-of-proliferation terms
    rather than becoming a signalling annotation.
  experiment_type: proteomics
- hypothesis: The ACTL8-CERT1 interaction detected in two CCSB yeast two-hybrid screens is a genuine
    physical interaction.
  description: >-
    Test the pair by co-immunoprecipitation of endogenous or tagged proteins in a cell line that
    expresses both, and by an orthogonal binary assay such as split luciferase or NanoBRET, using
    both CERT1 isoforms since the two screens used different ones. If confirmed, ask whether ACTL8
    affects ceramide transfer by measuring sphingomyelin synthesis after ACTL8 depletion. A
    confirmed and consequential interaction would give this gene its first informative
    molecular-function annotation.
  experiment_type: biochemistry
