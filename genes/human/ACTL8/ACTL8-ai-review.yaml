- term:
    id: GO:0045202
    label: synapse
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic transfer of beta- and gamma-actin's synaptic localisation. The donors are sound
      and heavily characterised - human ACTB carries EXP plus IDA x 5 plus IMP x 2 for this term,
      mouse Actb IDA x 6, mouse Actg1 IDA x 6, rat Actg1 IDA x 4 - so nothing here is wrong at
      source. The problem is the transfer.

      The donating node PTN007551913 has exactly nine human descendants: ACTB, ACTG1, ACTBL2,
      POTEE, POTEF, POTEI, POTEJ, POTEKP and ACTL8. Eight of the nine are at least 90.7 per cent
      identical to beta-actin over their aligned actin block - each POTE protein carries a
      C-terminal actin-family domain, per its UniProt SIMILARITY line, which is what places them
      here. ACTL8 is the ninth, at 33.8 per cent. Unlike the deep
      node behind GO:0015629, this donor set is not heterogeneous - it is a beta-actin subfamily,
      so its reconstructed ancestral state is beta-actin's cell biology in all but name, and
      transferring that to a protein 57 percentage points less similar than any other member is not
      a family-level inference.

      Nothing independent supports a synaptic pool of ACTL8. Expression is strongest in testis and
      pancreas, HPA classifies the gene as tissue-enriched in testis, and the only protein-level
      localisation reported anywhere is moderate focal cytoplasmic staining in head-and-neck
      carcinoma. Presence at a synapse is a claim about a cell type for which ACTL8 has no reported
      expression or localisation - and as on the axon row, that is absence of positive evidence rather
      than demonstrated absence, since HPA tissue-enrichment does not imply zero neuronal transcript
      and one of UniProt's cDNA clones came from brain.
    action: REMOVE
    reason: >-
      A cell-type-specific compartment inherited from near-identical cytoplasmic actins by a node
      that mis-places ACTL8. Two independent reasons: the donating clade is a beta-actin subfamily
      into which ACTL8 falls at 33.8 per cent identity while every other member exceeds 90 per
      cent, and the structural basis for a synaptic actin pool - incorporation into filaments - is
      the property ACTL8 has lost, with only 11 of 38 protomer-interface positions chemically
      compatible and 8 of 10 D-loop contacts non-conservatively substituted - a score that puts
      ACTL8 in a band with the other divergent actin-likes and above human Arp3, so it argues that
      canonical protomer incorporation is unlikely rather than that filament association is
      impossible. Removing this row does not require deciding what ACTL8 does; it requires only that
      it is not beta-actin, and that no evidence places it at a synapse.
    supported_by:
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: 'ACTL8 is 33.8% identical to beta-actin over its aligned block.'
    - reference_id: file:human/ACTL8/ACTL8-uniprot.txt
      supporting_text: 'DR   HPA; ENSG00000117148; Tissue enriched (testis).'
    - reference_id: PMID:41129177
      supporting_text: ACTL8 exhibited moderate cytoplasmic staining in a focal pattern (Figure 1C).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN007551913
        source_label: PANTHER node whose other eight human members are all at least 90.7 per cent
          identical to beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Not a protein and so carries no evidence of its own. It donates eight terms to ACTL8 and
          its human descendants are ACTB, ACTG1, ACTBL2, POTEE, POTEF, POTEI, POTEJ, POTEKP and
          ACTL8; only ACTL8 is below 90 per cent identity to beta-actin. This is the single node
          responsible for most of ACTL8's GO record.
      - source_id: UniProtKB:P60709
        source_label: ACTB, human beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Carries EXP, IDA x 5 and IMP x 2 for synapse. The source annotation is excellent;
          the transfer is not.
      - source_id: MGI:MGI:87904
        source_label: Actb, mouse beta-actin (P60710)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA x 6 plus IMP x 2. Five candidate entries for the MGI id, one reviewed.
      - source_id: MGI:MGI:87906
        source_label: Actg1, mouse gamma-actin (P63260)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA x 6 plus IMP x 2.
      - source_id: MGI:MGI:2444552
        source_label: Actbl2, mouse beta-actin-like protein 2 (Q8BFZ3)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          EXP x 2 plus IDA x 2. Notable because ACTBL2 is the nearest thing in this clade to a
