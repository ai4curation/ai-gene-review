- term:
    id: GO:0035267
    label: NuA4 histone acetyltransferase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: >-
      Phylogenetic transfer of membership in a specific multiprotein complex, from human ACTB
      (IDA x 2) via the node that mis-places ACTL8. This is the clearest error in the record,
      because the GO term's own definition names which actin belongs to the complex.

      GO:0035267 is defined as "A complex having histone acetylase activity on chromatin, as well
      as ATPase, DNA helicase and structural DNA binding activities... Subunits of the human complex
      include HTATIP/TIP60, TRRAP, RUVBL1, BUVBL2, beta-actin and BAF53/ACTL6A." The actin content
      of the human NuA4/TIP60 complex is therefore specified at the level of individual paralogs:
      beta-actin and the actin-related protein ACTL6A. Complex membership is a property of
      particular subunits, established by purification of that subunit, and it does not propagate
      down a family by sequence similarity - yet this node assigns it to gamma-actin, ACTBL2, ACTL8
      and the five POTE proteins as well. The definition says the subunits "include" beta-actin and
      BAF53/ACTL6A rather than "only", so it does not by itself exclude another actin paralog; what it
      does show is that the complex's actin content is recorded per paralog, from purification, and no
      purification places ACTL8 there.

      No purification, immunoprecipitation or proteomic study places ACTL8 in NuA4/TIP60 or in any
      other complex. ACTL8 is also a cytoplasmic, testis-enriched protein with no reported nuclear
      pool.
    action: REMOVE
    reason: >-
      Complex membership does not transfer by family similarity, and here the term's own definition
      settles it by naming beta-actin and ACTL6A as the complex's actin subunits. The annotation was
      generated by a node that assigns NuA4 membership to all nine of its human descendants. ACTB's
      row is the one that should stand: it has its own IDA and the term's definition names it. Of the
      remaining eight, ACTL8, ACTBL2 and the five POTE genes have no supporting purification at all,
      and ACTG1 is the borderline case - the definition says the human subunits "include" beta-actin
      and BAF53/ACTL6A rather than "only", so it does not exclude gamma-actin, but nor does anything
      place it there. There is no purification or proteomic evidence for ACTL8 in any complex, and no
      evidence of a nuclear pool.
    supported_by:
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: 'Donates to human genes: GO:0005737, GO:0007409, GO:0016020, GO:0019901, GO:0030424,
        GO:0035267, GO:0045202, GO:0048870 (71 human annotations).'
    - reference_id: file:human/ACTL8/ACTL8-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton {ECO:0000250}.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN007551913
        source_label: PANTHER node whose other eight human members are all at least 90.7 per cent
          identical to beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Not a protein. QuickGO shows this node assigning GO:0035267 to ACTB, ACTBL2, ACTG1,
          ACTL8, POTEE, POTEF, POTEI, POTEJ and POTEKP - nine human genes for a complex whose one
          conventional-actin subunit is beta-actin.
      - source_id: UniProtKB:P60709
        source_label: ACTB, human beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          IDA x 2, and named explicitly in the GO term definition as a subunit. The source
          annotation is exactly right and the transfer is exactly wrong.
- term:
    id: GO:0048870
    label: cell motility
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic transfer of involvement in cell motility from human ACTB (IBA plus IMP) via the
      mis-placing node. Unlike the other rows from that node, this one has a genuine human
      counterpart in the literature - but it points at a different term.

      The IBA reflects actin's role as the motility machinery itself: GO:0048870 is defined as "Any
      process involved in the controlled self-propelled movement of a cell that results in
      translocation of the cell from one place to another", and conventional actin is involved in
      it by being the polymer that generates the protrusion. ACTL8, with 24 of 38 protomer-contact
      positions non-conservatively substituted, has no demonstrated place in that machinery.

      What the human data show is regulation, and it belongs on a separate row rather than as a
      replacement term here. RNA-interference knockdown of ACTL8 reduces migration and invasion in
      triple-negative breast cancer cells, gastric cancer cells, oral squamous carcinoma cells and
      lung adenocarcinoma cells, across four independent laboratories, with shRNA knockdown also
      suppressing xenograft growth. No experiment shows ACTL8 in the cytoskeletal machinery; the
      phenotype is loss of a positive input into migration.

      This row was initially marked MODIFY with GO:0030335 as a replacement. That was wrong on
      mechanics. MODIFY changes the term but leaves the evidence code and reference untouched, so
      the replacement would still be an IBA on GO_REF:0000033 with PTN007551913 in WITH/FROM - which
      amounts to asking PAINT to reconstruct positive regulation of cell migration as the ancestral
      state at the very node this review argues mis-places ACTL8. It is not a supportable ancestral
      call either: beta-actin's own evidence for GO:0048870 is that it *is* the motility machinery,
      not that it regulates migration. So the IBA is removed on the same grounds as its sibling
      rows from that node, and the human RNAi evidence is recorded as a separate NEW row for
      GO:0030335 with evidence_type IMP - the same shape already used for GO:0008284, built from the
      same four papers.
    action: REMOVE
    reason: >-
      Transferred from the node that mis-places ACTL8, and the term asserts membership of the
      motility machinery itself - GO:0048870 covers "the controlled self-propelled movement of a
      cell", which conventional actin is involved in by being the polymer that generates the
      protrusion. ACTL8 has no demonstrated place in that machinery. Removed rather than modified
      because MODIFY would retain IBA/GO_REF:0000033 from PTN007551913 and merely swap the term,
      leaving an ancestral-state claim that beta-actin's own IMP does not support. The human
      evidence that ACTL8 influences migration is real and is preserved on a separate NEW GO:0030335
      IMP row, where the evidence code matches the experiments.
    supported_by:
    - reference_id: PMID:33883901
      supporting_text: the numbers of invasive and migrated cells were markedly repressed after ACTL8
        silencing
    - reference_id: PMID:39322809
      supporting_text: ACTL8 knockdown markedly reduced GC cell proliferation and inhibited migration
        and invasion.
    - reference_id: PMID:35051678
      supporting_text: >-
        knockdown of ACTL8 significantly inhibited the growth and mobility, arrested cell cycle and
        promoted apoptosis of TCA-83 and CAL27 cells
    - reference_id: PMID:31962007
      supporting_text: >-
        shACTL8 had a significant impact on proliferation, cell cycle progression, apoptosis,
        migration and invasion, angiogenesis and epithelial to mesenchymal transition (EMT) in A549
        cells.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN007551913
        source_label: PANTHER node whose other eight human members are all at least 90.7 per cent
          identical to beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Not a protein; the mis-placing node discussed on the synapse row.
      - source_id: UniProtKB:P60709
        source_label: ACTB, human beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Carries IMP for cell motility. Beta-actin is involved in motility by being the machinery;
          ACTL8's human evidence is that its depletion reduces migration, which is a regulatory
          relation and belongs on a regulation term.
- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Automatic mapping from UniProt's subcellular-location vocabulary. The WITH/FROM token
      UniProtKB-SubCell:SL-0090 is a controlled-vocabulary identifier rather than another gene's
      evidence, so unlike the IBA rows there is no donor protein to interrogate; the source is a
      UniProt annotation statement.

      Tracing it back gives the reason to flag this row. The statement it derives from is
      "SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton {ECO:0000250}" - ECO:0000250 is
      sequence-similarity evidence, and no source entry is cited after the code, so the similarity
      is untraceable. The chain is therefore: an uncited by-similarity curator statement becomes a
      controlled-vocabulary term, which becomes an IEA annotation that reads as independent of the
      IBA rows. It is not independent; it is a second rendering of the same family-level inference.

      The term itself has to be kept, and the reason is ontological rather than evidential.
      GO:0015629 actin cytoskeleton is a descendant of GO:0005856 cytoskeleton, so retaining the
      child while calling the parent an over-annotation would assert that ACTL8 is in the actin
      cytoskeleton but that saying "cytoskeleton" overshoots - which cannot both hold. This row was
      initially marked MARK_AS_OVER_ANNOTATED; that was inconsistent with keeping GO:0015629. The
      criticism it was carrying is a redundancy and provenance complaint, not an over-annotation, and
      that is recorded here and in the root_cause instead.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept because GO:0015629, which this review retains, is a descendant of GO:0005856, so the two
      rows must move together and cannot be given opposite verdicts. Non-core because it is the most
      generic possible localisation statement. What is wrong with it is not the term but its
      provenance: it re-encodes a UniProt ECO:0000250 subcellular-location statement that cites no
      source entry, so it adds no evidence and must not be counted as a second, independently-coded
      line of support for cytoskeletal residence. The uncited ECO:0000250 is worth reporting to
      UniProt, which is recorded in suggested_questions.
    supported_by:
    - reference_id: file:human/ACTL8/ACTL8-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton {ECO:0000250}.'
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - CIRCULAR_PROPAGATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0090
        source_label: UniProt subcellular-location vocabulary term for cytoskeleton
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          A controlled-vocabulary identifier, not a gene product, so it carries no evidence of its
          own. The UniProt statement behind it is ECO:0000250 by similarity with no source entry
          cited, which makes this annotation a re-encoding of the same family-level inference that
          the IBA rows already express.
