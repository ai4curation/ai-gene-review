- term:
    id: GO:0019901
    label: protein kinase binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic transfer of a binding term whose donors carry it by IPI rather than IDA - human
      ACTB has IBA plus IPI, rat Actb IBA plus IPI plus ISO. So the source evidence is
      interaction-detection, and the term itself ("Binding to a protein kinase, any enzyme that
      catalyzes the transfer of a phosphate group, usually from ATP, to a protein substrate") names
      an entire enzyme class rather than a partner.

      Conventional actin does associate with many kinases, but which kinase, and in what context,
      is what carries the biology; the parent term records none of it. There is no evidence that
      ACTL8 binds any kinase. Its only reported partner is CERT1, from yeast two-hybrid, which is
      not a protein kinase. Repository curation guidance discourages exactly this kind of
      uninformative binding annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Promiscuous, uninformative binding term transferred by the node that mis-places ACTL8, with
      no gene-specific support and no named partner. Marked over-annotated rather than removed
      because the donors' own evidence is real interaction data and because a protein of this fold
      binding some kinase somewhere is not falsifiable at this granularity - which is itself the
      objection. If a specific kinase is ever identified, the annotation should be replaced by an
      informative term with the partner recorded, not by this parent.
    supported_by:
