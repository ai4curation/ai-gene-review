        node are: **none**. ACTL8 carries 11 IBA rows against a median of 2 for its relatives.'
    - reference_id: file:human/ACTL8/ACTL8-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the actin family. {ECO:0000305}.'
