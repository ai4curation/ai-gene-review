- id: file:human/ACTL8/ACTL8-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACTL8 (human)
  findings:
  - statement: Machine-generated literature summary that surfaced the entire tumour-biology literature for ACTL8, none of which is represented in GOA. Its self-evaluation reports a faithfulness score of 85.7 per cent and no pairwise score, and all eight of its citations are numeric PMIDs.
  - statement: Used only as a lead. Every claim taken from it was re-read against the cached PMID, and no mechanistic assertion is sourced from its prose. Doing that check is what revealed that one of its eight cited papers, PMID:32125225, has been retracted.
    supporting_text: ACTL8 protein is detected in the cytoplasm of tumor cells
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Treated as a preliminary lead source rather than evidence, per its own header. It passed its internal gates, but it cites the retracted PMID:32125225 as a dated finding without flagging the retraction, and that paper is the sole source of its p21, E-cadherin and EMT-marker claims - so its narrative is partly built on withdrawn work. Its remaining claims were independently verified against the cited PMIDs and hold up. Marked LOW_QUALITY for the unflagged retracted citation, not because the summary is wrong.
- id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
  title: 'ACTL8: does the actin fold come with actin''s residues, and do its IBA sources transfer?'
  findings:
  - statement: PANTHER nodes PTN002631586 and PTN007551913 each donate to nine human genes; eight are at least 90.7 per cent identical to beta-actin over their aligned actin block, and ACTL8 is the ninth at 33.8 per cent.
  - statement: Of 19 residues within 4.0 angstrom of ATP or its divalent cation in PDB 2BTF chain A, ACTL8 retains 11 identical and 3 conservatively substituted, with 5 non-conservative substitutions (D157, K213, E214, T303, K336). The four conventional actins score 19 of 19 compatible.
  - statement: Of 38 residues within 4.0 angstrom of a neighbouring protomer in PDB 6DJO F-actin, ACTL8 retains only 8 identical and 3 conservative, with 24 non-conservative substitutions and 3 deletions; 8 of the 10 D-loop contacts are non-conservative. Both tallies are unchanged under a second substitution matrix and gap model.
  - statement: The analyzed experimental source annotations are grounded in curated experiments; whether each ancestral assertion transfers to ACTL8 is unresolved rather than settled by source counts or identity.
  - statement: Ranked across the panel, ACTL8's 11 of 38 compatible interface positions sits in a band with ACTL7A (14), ACTL7B and ACTL9 (16) and ACTRT1 (21), and human Arp3/ACTR3 scores 8 - below ACTL8 - while Arp2 scores 22. Since both Arps occupy protomer positions at an Arp2/3 branch, the metric bounds canonical two-stranded protomer incorporation, not filament association in general.
  - statement: Of the eight divergent human actin-like / actin-related-T proteins, ACTL8 is the only one that receives an IBA from either narrow beta-actin node, and it carries 11 IBA rows against a median of 2 across the other seven.
  - statement: Of 32 human PTHR11937 members, only 7 have an experimentally supported molecular function once bare GO:0005515 protein binding is excluded, and among the eight divergent actin-like and actin-related-T members (ACTL7A, ACTL7B, ACTL8, ACTL9, ACTL10, ACTRT1, ACTRT2, ACTRT3) only ACTRT1 does. Most but not all of that set is testis-restricted - UniProt describes ACTRT3 as ubiquitously expressed - so it is grouped here by sequence divergence, not by tissue.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The reproducible sequence/contact calculations and fetched annotation-recipient sets are useful. Inferring a misplaced tree node from recipient membership, alignment identity or donor count is not a phylogenetic reconstruction. The ACTR3 control demonstrates that low canonical-contact conservation does not exclude all structural filament roles.
