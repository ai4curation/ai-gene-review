- term:
    id: GO:0030855
    label: epithelial cell differentiation
  evidence_type: IEP
  original_reference_id: PMID:21492153
  qualifier: involved_in
  review:
    summary: >-
      The only non-phylogenetic biological-process annotation on the gene, made by UniProt with
      evidence code IEP from a Caco-2 differentiation proteomics study. The study compared
      proliferating with fully differentiated Caco-2 cells by two-dimensional gel electrophoresis:
      53 spots changed, of which 34 were identified by MALDI-TOF.

      IEP means inferred from expression pattern, and what this experiment establishes is that a
      protein's abundance changes as the cells differentiate. That is a correlation between
      expression and a process, not evidence that the protein participates in it - which is the
      standard objection to IEP supporting an involved_in qualifier, and it is sufficient on its
      own. A change in abundance during differentiation is equally consistent with ACTL8 being a
      passive marker of the differentiated state.

      Two further points are raised as questions rather than asserted as errors, because the full
      text is not in the cache and a UniProt curator read it: peptide-mass-fingerprint
      identification of a spot within the actin family is intrinsically difficult given the
      family's sequence conservation, and ACTL8 is testis-enriched in HPA while Caco-2 is an
      intestinal line. Neither is a basis for overruling the curator on the identification; both
      are reasons not to build on this row.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Expression-correlation evidence used to support involved_in. A single two-dimensional gel
      time course in one cell line shows that ACTL8 abundance changes as Caco-2 cells differentiate;
      it does not show that ACTL8 has a role in epithelial differentiation. Retained rather than
      removed because the observation itself is not disputed and the curator had the full text, but
      flagged so it is not read as a functional assignment. If ACTL8 does have a differentiation
      role, an IMP from knockdown would be needed to establish it.
