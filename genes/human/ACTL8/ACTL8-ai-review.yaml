- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic transfer of a membrane association from beta-actin. In conventional actin this
      annotation reflects the cortical network beneath the plasma membrane - actin is not an
      integral membrane protein, it is a polymer that a membrane is attached to. The term's
      definition is explicitly about a bilayer: "A lipid bilayer along with all the proteins and
      protein complexes embedded in it and attached to it."

      Two things make this a poor transfer. ACTL8's UniProt feature table contains no
      transmembrane segment, no signal peptide, no lipidation site and no membrane-binding region -
      the whole table is one CHAIN and two dbSNP variants. And the mechanism by which an actin
      becomes membrane-attached, cortical filament formation, is the capability ACTL8 has no support
      for: only 11 of 38 protomer-interface positions are chemically compatible with beta-actin,
      which in the panel ranking places it among the divergent actin-likes rather than uniquely low
      (human Arp3 scores 8), so this weighs against a cortical network without settling it.

      Marked over-annotated rather than removed because "membrane" is broad enough that a
      peripheral, indirect association cannot be excluded for any cytoplasmic protein, and because
      GO already treats bare membrane annotations as low-information. Nothing positive supports it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Uninformative compartment term whose only basis is beta-actin's cortical pool, transferred by
      the node that mis-places ACTL8. ACTL8 has no membrane-targeting feature of any kind, and the
      route by which an actin reaches a membrane - polymerisation into a cortical network - is
      precisely the property its interface substitutions argue against. Not removed because a
      peripheral association is unfalsifiable at this term's granularity; flagged so that it is not
      read as evidence of membrane residence.
    supported_by:
    - reference_id: file:human/ACTL8/ACTL8-bioinformatics/RESULTS.md
      supporting_text: '| ACTL8 (human actin-like 8) | 8 | 3 | 24 | 3 |'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN007551913
        source_label: PANTHER node whose other eight human members are all at least 90.7 per cent
          identical to beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Not a protein; the mis-placing node discussed on the synapse row.
      - source_id: UniProtKB:P60706
        source_label: ACTB, chicken beta-actin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA for membrane. Sound at source.
      - source_id: RGD:628837
        source_label: Actb, rat beta-actin (P60711)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA for membrane, plus ISS x 3.
- term:
    id: GO:0030424
    label: axon
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic transfer of beta- and gamma-actin's axonal pool, from the same node that
      produces the synapse row. Mouse Actb and Actg1 each carry IDA x 3 plus IMP for axon and rat
      Actb carries IDA, so the source annotations are solid; the transfer is the failure.

      Axonal localisation is a claim about a neuronal compartment. ACTL8 is testis-enriched in HPA,
      strongly expressed in testis and pancreas per UniProt, and has no reported neuronal
      expression or localisation. HPA tissue-enrichment does not imply zero neuronal transcript -
      one of UniProt's cDNA clones was in fact isolated from brain - so the point is the absence of
      any positive evidence for an axonal pool, not a demonstrated absence of the protein. Its only
      reported protein-level localisation is cytoplasmic staining in carcinoma tissue. As with synapse, the residual mechanism that would put an actin into an axonal
      cytoskeleton is filament incorporation, which the interface analysis argues against - though
      only at the strength that canonical protomer incorporation is unlikely, since human Arp3
      scores below ACTL8 on the same metric while occupying a protomer position at an Arp2/3 branch.
      The decisive point for this row is the absence of any neuronal evidence, not the tally.
    action: REMOVE
    reason: >-
      Neuronal compartment inherited from near-identical cytoplasmic actins through a node in which
      ACTL8 is the sole divergent member. No expression, imaging or proteomic evidence places ACTL8
      in a neuron, and the structural basis for the transferred property is absent. This is the
      same failure as the synapse and axonogenesis rows and should be corrected together with them.
    supported_by:
