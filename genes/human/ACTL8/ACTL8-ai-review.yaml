id: Q9H568
gene_symbol: ACTL8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTL8 is a divergent, testis-enriched member of the actin family whose molecular function has not
  been determined. The 366-residue protein retains the actin fold but is only about a third
  identical to cytoplasmic beta-actin, and structural comparison shows the divergence is
  concentrated exactly where actin's identity resides: most of the ATP phosphate- and
  adenosine-binding residues survive, whereas the great majority of the protomer-protomer contact
  surface that builds a filament, including almost the whole DNase-I binding loop, does not, which
  makes canonical incorporation into a two-stranded filament unlikely. Whether it polymerises at all
  has never been tested, and no biochemical activity, ligand or cellular structure has been assigned
  to it experimentally. Expression is strongest in testis and
  pancreas with weak placental expression, and the protein is detected by proteomics and by
  immunohistochemistry in the cytoplasm of tumour cells. ACTL8 is also known as cancer/testis
  antigen 57, and this accounts for essentially all of its functional literature: it is
  transcriptionally silent in most somatic tissues but reactivated in breast, gastric, oral
  squamous, lung and head-and-neck carcinomas, and in several of these high expression has been
  associated with poor survival.
  In that ectopic setting, RNA-interference knockdown reproducibly reduces proliferation,
  migration and invasion, increases apoptosis, slows cell-cycle progression and lowers
  PI3K/AKT/mTOR phosphorylation, and shRNA knockdown suppresses xenograft growth; no direct
  interaction with any pathway component has been demonstrated, so the route is unresolved and may
  be indirect. Its physiological role in the testis, the one tissue where it is normally abundant,
  remains unstudied. The only reported binding partner is the ceramide transfer protein CERT1,
  from yeast two-hybrid screening alone.
