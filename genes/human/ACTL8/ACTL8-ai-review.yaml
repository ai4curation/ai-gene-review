    reference_section_type: ABSTRACT
  - statement: Knockdown also suppressed A549 tumour growth in nude-mouse xenografts, the only in vivo evidence for ACTL8.
    supporting_text: nude mice revealed that ACTL8-knockdown inhibited A549 cell tumor growth.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available from PMC; both quotes verified verbatim. Provides the only in vivo data for ACTL8.
