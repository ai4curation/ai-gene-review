- id: PMID:33883901
  title: Actin-Like Protein 8 Promotes the Progression of Triple-Negative Breast Cancer via Activating PI3K/AKT/mTOR Pathway.
  findings:
  - statement: siRNA knockdown of ACTL8 in MDA-MB-231 and BT-549 triple-negative breast cancer cells reduced EdU incorporation and colony formation.
    supporting_text: silencing ACTL8 dramatically inhibited the proliferation in MDA-MB-231 and BT-549 cells relative Control and si-NC groups
    reference_section_type: RESULTS
  - statement: Knockdown reduced migration and invasion in transwell assays.
    supporting_text: the numbers of invasive and migrated cells were markedly repressed after ACTL8 silencing
    reference_section_type: RESULTS
  - statement: Knockdown lowered phospho-PI3K, phospho-AKT and phospho-mTOR without changing total protein levels. No direct interaction with any pathway component was tested, so the relation is correlative.
    supporting_text: silencing ACTL8 significantly reduced the phosphorylation level of PI3K, AKT and mTOR in MDA-MB-231 and BT-549 cells when compared with Control and si-NC groups
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read from PMC; all three quotes verified verbatim. The pathway conclusion is pharmacological and correlative rather than mechanistic - Wortmannin and 740Y-P modulate the phenotype but no ACTL8-pathway interaction is demonstrated. The methods section also describes the siRNA as targeting a "back-splice junction site", a circular-RNA term that does not apply to a linear mRNA knockdown, which is a reporting error worth noting.
