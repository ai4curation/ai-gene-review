        source_status: SUPPORTS_TRANSFER
        comment: >-
          The same mis-placing node that produces this gene's worst rows. It is recorded as
          supporting the transfer here only because cytoplasmic residence is the one property of
          beta-actin that is safe to assume for any soluble actin-fold protein, and because the
          human immunohistochemistry agrees independently.
      - source_id: UniProtKB:P60709
        source_label: ACTB, human beta-actin
        source_status: SUPPORTS_TRANSFER
        comment: IDA x 2 plus a large body of TAS for cytoplasm.
      - source_id: UniProtKB:P60706
