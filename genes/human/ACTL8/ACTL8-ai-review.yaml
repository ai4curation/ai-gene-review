- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IMP
  original_reference_id: PMID:33883901
  qualifier: involved_in
  review:
    summary: >-
      Proposed addition. Depletion of ACTL8 reduces proliferation in five studies covering four
      tumour types from four independent laboratories, using orthogonal proliferation readouts, and
      in one case a xenograft. The two lung-adenocarcinoma papers, PMID:31962007 and PMID:35116946,
      share a laboratory (Department of Thoracic Surgery, China-Japan Friendship Hospital, Beijing)
      and both use A549, so they are counted as one group.

      Triple-negative breast cancer: siRNA knockdown in MDA-MB-231 and BT-549 reduces EdU
      incorporation and colony formation. Gastric cancer: knockdown reduces proliferation, and
      overexpression raises PI3K/AKT/mTOR phosphorylation. Oral squamous carcinoma: knockdown
      inhibits growth, arrests the cell cycle and promotes apoptosis in TCA-83 and CAL27. Lung
      adenocarcinoma: knockdown inhibits proliferation in A549 with 504 differentially expressed
      genes and reduced FOXM1, STMN1, PLK1 and BIRC5; shRNA knockdown in A549 and NCI-H1975
      suppresses proliferation, colony formation and cell-cycle progression in vitro and tumour
      growth in nude mice. The direction is consistent everywhere.

      The evidence code is IMP because every experiment is RNA interference or ectopic
      overexpression, not a direct assay at native levels. It is proposed as non-core, and the
      reason is important: ACTL8 is a cancer/testis antigen, so in all of these systems it is
      ectopically expressed in a tissue that does not normally make it. Knocking down a protein the
      cell should not have tells you what it does when present, which is a genuine result, but it
      is not evidence about the gene's evolved physiological role - and that role, in the testis, has
      never been examined. No mechanism is available either: no paper demonstrates ACTL8 binding any
      PI3K, AKT or mTOR component, so "acts upstream of" in this literature means that knockdown
      lowers a phospho-signal, which an indirect route explains equally well.
    action: NEW
    reason: >-
      The most strongly and most reproducibly supported functional statement available for ACTL8,
      and currently absent from GOA entirely - the gene's whole experimental record in GO is two
      yeast two-hybrid rows and one expression-correlation row. Five studies across four tumour
      types and four independent laboratories, consistent in direction, with orthogonal readouts
      and an in vivo confirmation, justify the term. It is
      additive rather than corrective: it does not replace any existing row. Proposed as non-core
      because the phenotype is measured in cells with ectopic expression of a cancer/testis antigen
      and no molecular mechanism is established, so it records a real cellular consequence of ACTL8
      presence rather than the gene's physiological function.
