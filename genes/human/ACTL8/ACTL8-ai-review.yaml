  title: ACTL8 superseded propagation evidence and judgments
- id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
  title: PTHR11937 PAINT ancestral assertions
suggested_questions:
- question: Where does ACTL8 fall in the actual PTHR11937 tree and alignment relative to PTN002631484, PTN002631586 and PTN007551913, and is there evidence of gain or loss for each asserted function?
- question: Does ACTL8 form polymers, occupy specialized filament-associated structures or bind existing actin networks despite divergence from conventional actin contact residues?
- question: Do endogenous localization assays detect ACTL8 in neuronal compartments, peripheral membranes or the NuA4 complex in any physiological or disease context?
- question: What molecular step connects ACTL8 to cancer-cell migration and proliferation, and can the phenotypes be separated from general viability and metabolic effects?
- question: How do the reported Momordin Ic binding and MYC rescue results withstand full-text methodological review and orthogonal replication?
- question: Does ACTL8 bind or hydrolyze ATP, and how does its normal testicular function relate to its cancer-cell phenotypes?
- question: Is the CERT1 interaction reproduced with endogenous proteins, and does it alter ceramide transport?
- question: What ACTL8-specific peptides and expression changes support the Caco-2 differentiation IEP annotation?
suggested_experiments:
- hypothesis: ACTL8 has assembly and nucleotide-binding properties that differ from conventional actin.
  description: Compare purified ACTL8 with ACTB and ACTR3 using nucleotide-binding, hydrolysis, polymerization, co-sedimentation and imaging assays. Test both homopolymers and mixed or filament-associated assemblies, with appropriate positive controls.
  experiment_type: biochemistry
- hypothesis: ACTL8 acts at a definable molecular step upstream of the reported cancer-cell phenotypes.
  description: Combine endogenous tagging, interaction measurements, acute depletion and rescue with viability-controlled migration assays and pathway readouts. Use the reported MYC rescue and Momordin Ic binding as starting observations, without assuming that negative proximity labeling excludes an interaction.
  experiment_type: biochemistry
- hypothesis: ACTL8 has a physiological role in testicular cells.
  description: Localize validated endogenous ACTL8 across testicular cell types and examine fertility and sperm phenotypes after selective loss of function; compare these results with tumor-cell localization and signaling phenotypes.
  experiment_type: genetics
