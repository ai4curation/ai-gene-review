id: P10145
gene_symbol: CXCL8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Interleukin-8 (CXCL8) is a secreted Glu-Leu-Arg (ELR)-positive CXC chemokine produced by
  macrophages, monocytes, endothelial cells, and epithelial cells in response to bacterial products
  and pro-inflammatory cytokines. In the extracellular space, CXCL8 binds glycosaminoglycans such
  as heparan sulfate to establish immobilized haptotactic gradients on endothelial surfaces and
  engages the Gi-coupled seven-transmembrane receptors CXCR1 (IL8RA) and CXCR2 (IL8RB) on
  neutrophils and other leukocytes. Receptor activation triggers the interleukin-8-mediated
  signaling pathway, mobilizing intracellular calcium and driving neutrophil chemotaxis, firm
  integrin-mediated adhesion, degranulation, and respiratory burst at sites of infection and tissue
  injury.
existing_annotations:
- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: TAS
  original_reference_id: PMID:11483765
  qualifier: involved_in
  review:
    summary: >-
      CXCL8 is a secreted chemokine that stimulates endothelial cell proliferation and capillary
      sprouting as an extracellular regulator rather than executing the morphogenetic machinery of
      blood vessel formation itself; GOA already captures this role more precisely with
      GO:0045766 (positive regulation of angiogenesis).
    action: MODIFY
    reason: >-
      As a secreted signaling ligand, CXCL8 positively regulates angiogenesis via CXCR1/CXCR2 on
      endothelial cells rather than directly executing blood vessel morphogenesis; refine to
      GO:0045766 (positive regulation of angiogenesis), which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0045766
      label: positive regulation of angiogenesis
- term:
    id: GO:0002237
    label: response to molecule of bacterial origin
  evidence_type: IDA
  original_reference_id: PMID:19912257
  qualifier: involved_in
  review:
    summary: >-
      CXCL8 transcription and secretion are strongly induced in epithelial and mucosal tissues upon
      stimulation with bacterial lipopolysaccharide (PMID:10823949), reflecting its role as an
      inducible effector of innate bacterial sensing.
    action: KEEP_AS_NON_CORE
    reason: >-
      Valid inducible upstream response context (corroborated by LPS-induced IL-8 secretion in
      PMID:10823949; PMID:19912257 is abstract-only in the local cache and foregrounds A20), whereas
      the direct molecular function of secreted CXCL8 is chemokine receptor activation and
      neutrophil recruitment.
    supported_by:
    - reference_id: PMID:10823949
      supporting_text: >-
        Again in human organ cultures from fetuses compared to older children, IL-8 secretion was
        greater (LPS, 2.5-fold; IL-1beta, 200-fold) and mRNA activity after stimulation was
        comparably higher, suggesting that increased transcription of the IL-8 gene may account for
        the excessive response.
- term:
    id: GO:0005125
    label: cytokine activity
  evidence_type: IDA
  original_reference_id: PMID:8399143
  qualifier: enables
  review:
    summary: >-
      PMID:8399143 characterizes CXCL8 (IL-8) alongside GCP-2 (CXCL6) as a C-X-C chemokine that
      induces neutrophil chemotaxis and gelatinase B release; GO:0005125 (cytokine activity) is true
      but less specific than GO:0008009 (chemokine activity), which is annotated from the same
      paper.
    action: MODIFY
    reason: >-
      GO:0005125 (cytokine activity) is an ancestor of GO:0008009 (chemokine activity), which
      CXCL8 already carries from the same reference (PMID:8399143).
    proposed_replacement_terms:
    - id: GO:0008009
      label: chemokine activity
    supported_by:
    - reference_id: PMID:8399143
      supporting_text: >-
        On the basis of the conservation of four cysteine residues, the two molecules are to be
        classified within the C-X-C chemokine family, including IL-8.
