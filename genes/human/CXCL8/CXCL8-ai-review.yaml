suggested_questions:
- question: >-
    How do the tissue-predominant 77-amino-acid (endothelial) and 72-amino-acid (leukocyte)
    N-terminal proteolytic isoforms of CXCL8 differ in their in vivo partitioning between monomer
    and dimer states on endothelial heparan sulfate proteoglycans during neutrophil extravasation?
  experts:
  - Krishna Rajarathnam
  - Tracy M. Handel
  - Paul Proost
suggested_experiments:
- description: >-
    Perform time-resolved cryo-EM and single-molecule FRET on CXCR1 and CXCR2 reconstituted in
    lipid nanodiscs with monomeric versus dimeric CXCL8 (72-aa and 77-aa variants) and
    defined heparan sulfate oligosaccharides to determine how glycosaminoglycan co-engagement shapes
    Gi versus beta-arrestin coupling bias.
  hypothesis: >-
    Monomeric 72-aa CXCL8 preferentially stabilizes the canonical Gi-coupled active state of both
    CXCR1 and CXCR2, whereas dimeric and 77-aa CXCL8 shift receptor conformational equilibria
    toward differential beta-arrestin recruitment and receptor internalization.
  experiment_type: Cryo-EM and single-molecule FRET signaling bias assay
