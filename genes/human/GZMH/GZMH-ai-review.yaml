- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: IDA
  original_reference_id: PMID:17363894
  qualifier: involved_in
  review:
    summary: 'Proposed annotation for the function that defines granzyme H in the literature and is missing
      from its GO record: direct proteolytic attack on viral proteins in an infected cell.'
    action: NEW
    reason: 'Granzyme H performs the work of this process itself, which is the test that governs a proposed
      process term. Andrade et al. show it cleaving two adenoviral proteins in infected cells, and the
      consequence of one cleavage was isolated with a virus engineered to carry a granzyme H-resistant
      DNA-binding protein, so the antiviral effect is tied to the protease''s own catalysis rather than
      to its being required somewhere in a pathway. UniProt curates the same conclusion in its FUNCTION
      block. The comparator check argues for proposing rather than reading the absence as a convention,
      and it has a working positive control: among the seven granule effectors this project has reviewed,
      perforin carries GO:0051607 three times in its own GOA file, so the query can return a positive,
      and the six granzymes and granulysin carry it zero times. That absence is best explained by granzyme
      H''s annotation state rather than by a curation convention. It was an orphan granzyme with no known
      function when this paper was published, its GO record still has only twelve rows, and this is the
      one paper that gave it a function; perforin''s own GO:0051607 rows rest on knockout mice failing
      to clear a virus, which is necessity evidence, where granzyme H''s rests on direct cleavage of the
      viral substrate.'
    supported_by:
    - &id005
      reference_id: PMID:17363894
      supporting_text: granzyme H (gzmH), an orphan granzyme without known function, directly cleaves
        the adenovirus DNA-binding protein (DBP), a viral component absolutely required for viral DNA
        replication
    - reference_id: PMID:17363894
      supporting_text: These results provide the first evidence that granzymes can mediate antiviral activity
        through direct cleavage of viral substrates
    - reference_id: file:human/GZMH/GZMH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Participates in the antiviral response via direct cleavage of several proteins
        essential for viral replication.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      record: UniProtKB:P20718
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: ECO:0000269|PubMed:22156497, ECO:0000269|PubMed:23269243
      corrected_value: PMID:17363894
      cause: OTHER
      confidence: PROBABLE
      explanation: 'A query rather than an assertion. The antiviral sentence in the FUNCTION block of
        P20718 is evidenced to PubMed:22156497 and PubMed:23269243, and neither abstract mentions a virus:
        the first is the crystal-structure and substrate-specificity study, the second identifies SERPINB1
        as an inhibitor. The sentence describes what PMID:17363894 reports, which is named here as a candidate
        and was read at abstract level, located by a PubMed title search rather than inferred from memory.
        Both cited entries are cached abstract-only, so their full texts could in principle carry adenovirus
        experiments that the abstracts omit, which is why this is CHECK at PROBABLE rather than a confident
        repoint.'
