      cloning of the same protein under the name CSP-C, correctly cited for the sequence-level serine-protease
      assignment. As with the other 1990 paper, it is a poor reference for an apoptotic-process row.
suggested_questions:
- question: Granzyme H needs acidic residues at P3' and P4' as well as an aromatic residue at P1, which
    is a far narrower requirement than any other granzyme has. Does a search of the human proteome for
    that combined motif predict a tractable set of candidate host substrates, and do any of them sit in
    a pathway a killer cell would want to cut?
- question: Cleaving the adenoviral 100K protein restores granzyme B activity, so granzyme H can act by
    removing an inhibitor of another protease rather than by killing anything itself. Is that a general
    strategy against viral protease inhibitors, and should GO have a way to say that one gene product's
    role in a process is to relieve inhibition of another?
- question: SERPINB1 inhibits granzyme H inside the killer cell. Is that restraint also exported, in the
    sense that SERPINB1 in a target cell limits delivered granzyme H, and is the balance between them
    a determinant of which targets die?
suggested_experiments:
- hypothesis: Granzyme H kills target cells by cleaving a host substrate that its unusual P1-plus-acidic-P3'/P4'
    specificity selects, and the death that follows is not apoptotic.
  description: Deliver active granzyme H into target cells with perforin, alongside the catalytically
    dead S195A protein as a control, and identify cleaved host proteins by N-terminomics rather than by
    candidate testing. Score death in parallel for caspase dependence with a pan-caspase inhibitor and
    in caspase-3-null cells. The specificity requirement is sharp enough that the recovered cleavage sites
    can be checked against it, which would distinguish genuine granzyme H substrates from bystander proteolysis.
  experiment_type: N-terminomics with a catalytically inactive control
- hypothesis: The antiviral activity generalises beyond adenovirus to other viruses whose proteins carry
    the granzyme H motif.
  description: Infect cells with a panel of viruses, deplete or inhibit granzyme H selectively with the
    tetrapeptide chloromethylketone the structural study designed for it, and measure viral genome replication.
    For any virus that responds, identify the cleaved viral protein and repeat the resistant-substrate
    experiment that Andrade et al. used for the adenoviral DNA-binding protein, since that control is what
    separates a consequence of cleavage from a correlation.
  experiment_type: Viral panel with a selective inhibitor and resistant-substrate controls
