id: P20718
gene_symbol: GZMH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Granzyme H is a chymotrypsin-like serine protease stored in the cytolytic granules of
  natural killer cells, where it is expressed constitutively rather than on activation. It is delivered
  into a target cell together with perforin and the other granzymes, and its specificity sets it apart
  from the better-known granzymes: a Thr-Gly-Gly triad in the S1 pocket gives it a preference for bulky
  aromatic residues at P1, and an RKR motif found in no other granzyme makes it additionally require
  acidic residues on the leaving side of the scissile bond, at P3' and P4'. Two consequences of that
  narrow specificity are established. Granzyme H contributes to the death of the target cell, and in
  adenovirus-infected cells it cleaves viral proteins directly: the viral DNA-binding protein, which the
  virus needs in order to replicate its genome, and the 100K assembly protein, which the virus uses to
  inhibit granzyme B. Cleaving the second restores granzyme B activity, so the two granzymes act
  together against a viral defence that would otherwise block the host response. Granzyme H activity is
  restrained inside the killer cell itself by the intracellular inhibitor SERPINB1, which traps it in a
  covalent complex.
