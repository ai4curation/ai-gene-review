core_functions:
- molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  description: >-
    A chymase, cleaving after bulky aromatic residues, and with a second requirement that no
    other granzyme has: acidic residues on the leaving side of the bond, at P3' and P4', read by an RKR
    motif unique to this protease. Disrupting either the motif or those substrate residues abolishes activity,
    so the narrow specificity is a property of the enzyme rather than an artefact of the substrates tested.
    The two established uses of that activity both destroy their substrate. In an infected cell it cleaves
    the adenoviral DNA-binding protein, which the virus requires to replicate its genome, and the adenoviral
    100K protein, whose job is to inhibit granzyme B; the second cleavage restores granzyme B rather than
    activating anything itself. In an uninfected target cell it contributes to death by a route its own
    literature does not resolve, which is why this review places it on the granzyme-mediated pathway term
    rather than on apoptosis.
  directly_involved_in:
  - id: GO:0140507
    label: granzyme-mediated programmed cell death signaling pathway
  - id: GO:0051607
    label: defense response to virus
  - id: GO:0045071
    label: negative regulation of viral genome replication
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0044194
    label: cytolytic granule
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id001
  - reference_id: PMID:22156497
    supporting_text: an unusual RKR motif (Arg(39)-Lys(40)-Arg(41)), conserved only in GzmH, helps define
      the S3' and S4' binding regions, indicating the preference for acidic residues at the P3' and P4'
      sites
  - *id005
  knowledge_gaps:
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      No host substrate of granzyme H is established. The specificity is known to the level of individual
      subsites, and two viral substrates are known, but what it cleaves in an uninfected target cell,
      and therefore how it kills, is open. That gap is why this review cannot say whether the death it
      contributes to is apoptotic.
    dark_aspect: BP_DARK
