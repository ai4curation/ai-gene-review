- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: NAS
  original_reference_id: PMID:2193684
  qualifier: involved_in
  review:
    summary: Author statement placing the newly cloned protease in cell-mediated cytotoxicity, from a
      paper that assayed no death at all.
    action: MODIFY
    reason: 'The essence is right and the term is wrong in the same way it was wrong on perforin and granzyme
      A. Granzyme H does contribute to target-cell death, which UniProt curates from Liu et al. But apoptotic
      process attributes the death programme itself to granzyme H, and a granzyme''s position in that
      chain is upstream of it: the protease cleaves substrates in the target cell, and the dying cell
      runs the programme. GO:0140507 granzyme-mediated programmed cell death signaling pathway names exactly
      that position, is the term this project accepted on granzyme A, granzyme B and perforin, and is
      absent from granzyme H''s record, so the replacement fills a real gap rather than duplicating a
      row. Checked in the ontology: GO:0140507 is not a descendant of apoptotic process - its ancestors
      run through programmed cell death and signaling, not apoptosis - so this is the lateral kind of
      MODIFY that CLAUDE.md distinguishes from a refinement, and the replacement is deliberately not a
      child of the term it replaces. It also avoids committing this gene to the apoptotic route specifically, which its own literature
      does not establish. This row''s own evidence is a postulate in a 1990 cloning paper, stated as such
      in its abstract, which is why the code is NAS.'
    proposed_replacement_terms:
    - id: GO:0140507
      label: granzyme-mediated programmed cell death signaling pathway
    supported_by:
    - &id002
      reference_id: PMID:2193684
      supporting_text: in keeping with the postulated involvement in cytolysis, transcripts were detected
        only in cytotoxic cells
    - &id003
      reference_id: PMID:23269243
