    reason: The human loss-of-function study shows LRRC48/DRC3 missing from DRC4-deficient axonemes while
      several dynein-arm markers remain. As an integral scaffold DRC4 supplies structural work for localization/retention
      of the associated component. This is not an assertion that DRC4 transports all ciliary cargo or
      that every protein is lost.
    supported_by:
    - reference_id: PMID:26387594
- term:
