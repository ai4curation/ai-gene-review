      the N-DRC. Detailed DRC1/2/4 geometry is algal; human homologous models are fitted into respiratory-axoneme
      density. This is not a human sperm preparation or a DRC4-specific rescue experiment. The actual
      supplementary table is physical PDF page 11, with its header on page 10.
