- term:
    id: GO:0003341
    label: cilium movement
  evidence_type: NAS
  original_reference_id: PMID:37258679
  qualifier: involved_in
  review:
    summary: The N-DRC scaffold participates in ciliary movement.
    action: ACCEPT
    reason: The human respiratory structural inventory identifies O95995/478 in the N-DRC. Detailed scaffold
      geometry is resolved in algae and human homologous subcomplexes are placed in density. Human DRC4
      loss reduces ciliary beating amplitude while preserving several dynein-arm markers, consistent with
      structural participation in movement rather than motor ATPase catalysis.
    supported_by:
    - reference_id: PMID:37258679
    - reference_id: PMID:26387594
