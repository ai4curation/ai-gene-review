id: O95995
gene_symbol: DRC4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DRC4, also known as GAS8 or GAS11, is a coiled-coil structural protein of the nexin-dynein
  regulatory complex in motile cilia and flagella. It helps organize the axonemal scaffold linking neighboring
  microtubule doublets and coordinating ciliary bending. DRC4 also associates with microtubules and has
  reported accessory roles in Smoothened signaling and Golgi-associated interactions. Human DRC4 defects
  impair respiratory ciliary movement and can disrupt sperm flagellar structure.
alternative_products:
- name: '1'
  id: O95995-1
  description: The displayed product has 478 residues. Human respiratory structural inventories identify
    O95995 with this length. Human GAS8 C-terminal fragments used in Smoothened two-hybrid assays span
    residues 357–478 or 386–478; the accompanying cellular co-immunoprecipitation instead uses mouse Gas8.
    Neither these fragments nor clinical truncations define additional natural products.
- name: '2'
  id: O95995-2
  sequence_note: VSP_054805
  description: The official alternative product has 453 residues, with VSP_054805 removing residues 1–25
    of the displayed sequence. Antibody detection of two reported forms in the human respiratory study
    does not establish equivalent function or resolve the tested sequence for every localization or interaction.
    The shorter natural product is retained without assigning an untested isoform-specific activity.
