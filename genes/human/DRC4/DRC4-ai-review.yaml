  - ensembl:ENSMUSP00000090730
  review:
    summary: DRC4 participates in microtubule organization.
    action: ACCEPT
    reason: The source maps to mouse Gas8/Q60779, for which PMID:17366626 provides experimental microtubule
      association and organization evidence. Human DRC4 is a conserved N-DRC scaffold, and human ciliary
      structural defects independently support organization of the axonemal microtubule apparatus. The
      term also accommodates the reported nonaxonemal microtubule context and is not restricted to a purified
      human assay.
