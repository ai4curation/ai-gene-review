- id: PMID:10969087
  title: T lymphocyte-triggering factor of african trypanosomes is associated with the flagellar fraction
    of the cytoskeleton and represents a new family of proteins that are present in several divergent
    eukaryotes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic abstract explicitly reports a human GAS11 144-residue GFP fragment associated
      with microtubules in mammalian cells. Full target-specific construct Methods were not recovered.
      The trypanosome-focused title does not establish misattribution; no exact current human isoform
      is assigned.
- id: PMID:16643277
  title: 'Expanding the role of the dynein regulatory complex to non-axonemal functions: association of
    GAS11 with the Golgi apparatus.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache is abstract-only, but the original publisher text was separately recovered
      through its indexed Wiley page. Results and Methods distinguish human cell/airway detection and
      human tagged GAS11 from mouse recombinant Gas8 used with rodent Golgi membranes. COS7 Golgi and
      mouse mIMCD3 basal-body localization are positive; a specific transport or tether mechanism remains
      proposed rather than measured.
- id: PMID:21659505
  title: Growth Arrest Specific 8 (Gas8) and G protein-coupled receptor kinase 2 (GRK2) cooperate in the
    control of Smoothened signaling.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected normal cache is abstract-only. Separately recovered original PMC HTML Methods
      and Results establish human GAS8 C-terminal two-hybrid fragments against human SMO, but mouse full-length/engineered
      Gas8 in the co-immunoprecipitation and cellular assays. Significant GRK2-dependent signaling enhancement
      belongs to the GMAD–CT construct; full-length effects were variable and nonsignificant. Mouse knockdown
      and zebrafish perturbation/rescue are retained in their contexts. No supplementary-file or figure-pixel
      reading is claimed.
- id: PMID:26387594
  title: Loss-of-Function GAS8 Mutations Cause Primary Ciliary Dyskinesia and Disrupt the Nexin-Dynein
    Regulatory Complex.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached human Results, Methods and Discussion were independently read in the
      core consultation. Three biallelic truncation cases show GAS8 and DRC3 loss, preserved DNAH5/CCDC39/DNALI1,
      doublet misalignment and reduced beating amplitude. The mouse experiment concerns CCDC40 mutants,
      not Drc4 knockout. Reported antibody recognition of two forms does not authenticate functional equivalence
      of both official products. Supplemental images and movies were not independently inspected.
- id: PMID:27120127
  title: Mutations in GAS8, a Gene Encoding a Nexin-Dynein Regulatory Complex Subunit, Cause Primary Ciliary
    Dyskinesia with Axonemal Disorganization.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract reports human axonemal disorganization, reduced bending and DRC3
      mislocalization with CCDC39/40 expression preserved. Publisher routes failed and the author repository
      supplied metadata only. Curated positive assertions are retained with independent human corroboration;
      detailed imaging, construct or isoform Methods are not invented.
- id: PMID:27472056
  title: Mutation of Growth Arrest Specific 8 Reveals a Role in Motile Cilia Function and Human Disease.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual normal-cache Methods, Results and supplementary captions were read. The mouse
      intron-7 gene trap eliminates the normal band but retains an N-terminal Gas8–beta-geo fusion. Motile-ciliary
      defects are positive; tested MEF SAG-dependent Smo accumulation and developmental patterning are
      normal. These context-dependent findings neither erase the earlier positive signaling experiments
      nor establish that the residual fusion compensates. The A391V bead-flow caption describes a nonsignificant
      trend; no strong variant rescue effect is inferred.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI source pairs were retested and sequence-confirmed; this does not identify every pair
      as independently validated in native human cells.
    supporting_text: pairwise verification by quadruplicate retesting and sequence confirmation
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The genuine main section on HuRI generation describes three assay configurations, quadruplicate
      pairwise retesting and sequence confirmation. Exact DRC4 pairs, directions, features and parent-sequence
      ROGIDs were independently resolved from current IntAct records. A parent checksum is not proof of
      a full-length reagent when a separate sufficient-binding-region feature exists. Dataset-level orthogonal
      validation is not assigned to every DRC4 pair.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The cache flag is full_text_available:true, but the available text used here contains
      the abstract and contextual sections rather than a complete Methods read. The exact curated KRT27-bait/DRC4-prey
      record identifies anti-tag co-immunoprecipitation and spoke expansion. Independent HuRI supports
      the same binary pair; BioPlex alone is not a purified-contact assay.
- id: PMID:34169321
  title: Loss of DRC1 function leads to multiple morphological abnormalities of the sperm flagella and
    male infertility in human and mouse.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authenticated prior original-source advice was reused. Figure 4A and Methods show tagged
      DRC1–DRC4 association in HEK293T, but the introduced ORF species and exact sequence were not authenticated
      from the recovered text. The human host is not used to infer human construct identity. Structural
      coassembly is supported without a purified interface claim.
- id: PMID:37258679
