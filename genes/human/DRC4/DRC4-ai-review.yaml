    label: protein-containing complex assembly
  evidence_type: NAS
  original_reference_id: PMID:26387594
  qualifier: involved_in
  review:
    summary: Specify the structural axoneme-assembly role.
    action: MODIFY
    reason: The broad complex-assembly assertion concerns the N-DRC scaffold and loss of DRC3 from DRC4-deficient
      cilia. Axoneme assembly is the more informative biological process supported by the integrated human
      evidence. This is a biological specificity refinement, not a claimed literal ancestor-to-descendant
      relation to protein-containing complex assembly, and it does not imply assembly of the motor dynein
      complex itself.
