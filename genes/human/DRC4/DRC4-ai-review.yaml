suggested_questions:
- question: Which native human cell contexts require DRC4 for Smoothened regulation, and how do they differ
    from the mouse gene-trap MEF and developmental assays?
- question: Does the natural 1–25 deletion alter N-DRC incorporation or accessory localization, without
    assuming equivalence from antibody-recognized bands?
suggested_experiments:
- hypothesis: The two natural DRC4 products differ in their incorporation or accessory localization without
    necessarily differing in the core scaffold role.
  description: Compare sequence-verified O95995-1 and O95995-2 at matched near-endogenous expression in
    DRC4-deficient human ciliated cells. Measure N-DRC incorporation, DRC3 localization, beat amplitude
    and frequency separately, then assess Smoothened accumulation and signaling under defined stimulation.
    Include native-expression controls and quantify residual mutant fragments rather than assuming a complete
    null.
  experiment_type: Isoform-resolved complementation and localization
