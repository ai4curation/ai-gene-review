core_functions:
- description: 'DRC4 organizes the nexin-dynein regulatory complex that links neighboring axonemal microtubule
    doublets and supports ciliary bending. Its scaffold role incorporates conserved microtubule binding:
    mammalian Gas11 single-particle assays establish direct binding, and human GAS11 fragments associate
    with microtubules, although the exact construct sequence in the former study was not recovered. Detailed
    DRC4 coiled-coil architecture is resolved in algae; human respiratory reconstructions place homologous
    predicted subcomplexes in density. Human DRC4 loss removes LRRC48/DRC3 from axonemes, increases doublet
    misalignment and reduces beating amplitude while retaining DNAH5 and DNALI1. The scaffold therefore
    contributes structural work to axoneme assembly, maintenance of DRC3 in cilia, cilium movement and
    its regulation. Axoneme assembly covers the accepted broader microtubule-organization role. The same
    core encompasses flagellated sperm motility: human DRC4 variants associate with immotile, structurally
    abnormal sperm, and localization includes the sperm flagellum. Respiratory and sperm anatomical locations
    remain distinct from membership in the nexin-link complex. No motor ATPase activity or universal loss
    of dynein arms is inferred.'
