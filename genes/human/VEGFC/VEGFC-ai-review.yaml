- term:
    id: GO:0050918
    label: positive chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0042056
  review:
    summary: The positive chemotaxis row is retained as a broad downstream effect of VEGFC
      chemoattractant activity.
    action: KEEP_AS_NON_CORE
    reason: VEGFC is the extracellular chemoattractant rather than the moving cell, so the more
      natural process is induction of positive chemotaxis. Because GOA derives this row from the
      accepted chemoattractant-activity assertion, keep the broad process as a non-core downstream
      output.
    supported_by:
    - reference_id: PMID:19275959
      supporting_text: Modified Boyden chambers were used for chemotaxis assay
