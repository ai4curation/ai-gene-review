id: P49767
gene_symbol: VEGFC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VEGFC encodes vascular endothelial growth factor C, a secreted VEGF-family precursor whose
  N- and C-terminal propeptides are proteolytically removed to generate high-activity VEGF homology-domain
  dimers. Processed VEGFC activates VEGFR3/FLT4 and, after full maturation, VEGFR2/KDR, driving VEGF receptor
  signaling in lymphatic and vascular endothelial cells as well as peripheral mast-cell chemotaxis.'
