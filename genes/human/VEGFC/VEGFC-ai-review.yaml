suggested_questions:
- question: Which VEGFC phenotypic annotations transferred from rodents reflect direct receptor
    signaling by the ligand rather than secondary vascular remodeling?
suggested_experiments:
- description: Stimulation of primary human lymphatic endothelial cells with defined VEGFC
    processing intermediates, with VEGFR2- and VEGFR3-blocking antibodies, would separate
    receptor-specific proliferation, migration and sprouting outputs.
