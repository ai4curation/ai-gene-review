core_functions:
- description: Alpha4 contributes acetylcholine-recognition interfaces and pore/gating elements to neuronal
    nicotinic receptor heteropentamers. Human receptor currents and structural studies establish this
    ionotropic function, with two major alpha4beta2 stoichiometries and accessory-subunit-dependent calcium
    permeability and desensitization. Presynaptic receptor activity can modulate transmitter release,
    while receptor activation directly depolarizes the receptor-bearing cell. This synthesis represents
    subunit contribution rather than an alpha4-only channel, and does not assign identical behavior to
    both current splice products without construct mapping.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
  directly_involved_in:
  - id: GO:0007271
    label: synaptic transmission, cholinergic
  - id: GO:0099171
    label: presynaptic modulation of chemical synaptic transmission
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0097060
    label: synaptic membrane
  in_complex:
    id: GO:0005892
    label: acetylcholine-gated channel complex
  supported_by:
