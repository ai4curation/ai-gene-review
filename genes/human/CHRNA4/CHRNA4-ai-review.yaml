  review:
    summary: Retain the ortholog-supported neuronal excitability context.
    action: KEEP_AS_NON_CORE
    reason: The exact mouse O70174 donor has an IMP assertion from PMID:10235262; its authentic abstract
      reports loss of nicotine responses in raphe magnus/thalamic neurons after alpha4 disruption. This
      supports neuronal excitability but does not make alpha4 a voltage-gated channel executing every
      phase of an action potential. Retain the existing broad process non-core; the defining performed
      work is ligand-gated cation conductance.
