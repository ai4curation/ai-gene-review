id: P43681
gene_symbol: CHRNA4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNA4 encodes the alpha4 subunit of neuronal nicotinic acetylcholine receptors. Alpha4 commonly
  assembles with beta2 into pentameric acetylcholine-gated cation channels, contributing ligand-recognition
  interfaces and the shared transmembrane pore. Receptor activation depolarizes neurons and can modulate
  presynaptic transmitter release. The two major alpha4beta2 stoichiometries differ in agonist sensitivity,
  conductance and calcium permeability; accessory subunits further alter receptor behavior. Alpha4-containing
  receptors occur in somatodendritic and presynaptic compartments and respond to nicotine. Pathogenic
  pore-domain variants can alter receptor behavior and cause autosomal dominant sleep-related hypermotor
  epilepsy. A recent study also reports ventricular alpha4beta2 receptor activity in rodent models and
  pharmacological modulation of conduction in explanted failing human hearts.
