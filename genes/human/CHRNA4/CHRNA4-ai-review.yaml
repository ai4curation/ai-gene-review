- id: PMID:12189247
  title: A novel angiogenic pathway mediated by non-neuronal nicotinic acetylcholine receptors.
  findings:
  - statement: Endothelial alpha4 expression follows the nicotine/hypoxia response pattern, reported as
      data not shown; the causal angiogenesis experiments chiefly concern alpha7.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected full Methods and Results inspected in the genuine normal cache. The alpha4
      result is explicitly present and is not rejected because alpha7 dominates the paper. Citation identity
      was checked against the genuine normal PubMed metadata.
- id: PMID:14623738
  title: A Korean kindred with autosomal dominant nocturnal frontal lobe epilepsy and mental retardation.
  findings:
  - statement: A CHRNA4 Ser252Leu kindred had nocturnal epilepsy and cognitive impairment in tested affected
      family members.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic cached abstract read. Full original body not recovered; no isolated cognitive
      mechanism or variant electrophysiology is attributed to this clinical report. Citation identity
      was checked against the genuine normal PubMed metadata.
- id: PMID:16238698
  title: The cysteine-rich with EGF-like domains 2 (CRELD2) protein interacts with the large cytoplasmic
    domain of human neuronal nicotinic acetylcholine receptor alpha4 and beta2 subunits.
  findings:
  - statement: Engineered alpha4 intracellular-loop constructs associate with two CRELD2 products in yeast
      and in-vitro pull-down assays.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract and six exact source-linked IntAct records inspected. Full original
      body remains unavailable. Curated constructs are alpha4 331–600/331–381 and exact CRELD2 product
      fragments; no native topology encounter or full-length binary assay is inferred. Citation identity
      was checked against the genuine normal PubMed metadata.
- id: PMID:16332175
  title: Polymorphisms of the CHRNA4 gene encoding the alpha4 subunit of nicotinic acetylcholine receptor
    as related to the oxidative DNA damage and the level of apoptotic proteins in lymphocytes of the patients
    with Alzheimer's disease.
  findings:
  - statement: CHRNA4 polymorphisms associate with oxidative lesions and apoptotic/repair-protein levels
      in Alzheimer-disease lymphocytes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract read. Publisher challenge and bounded indexed searches did not recover
      the full original Methods/Results. Source-specific DNA-repair and oxidative-stress IMP assertions
      remain unresolved, not removed from abstract-only evidence. Citation identity was checked against
      the genuine normal PubMed metadata.
- id: PMID:17132685
  title: Ca2+ permeability of the (alpha4)3(beta2)2 stoichiometry greatly exceeds that of (alpha4)2(beta2)3
    human acetylcholine receptors.
