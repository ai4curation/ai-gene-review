    supporting_text: reflect only Ca 2+ flow through AChR channels
  - reference_id: PMID:27698419
    supporting_text: receptor constructs to acetylcholine and found them to behave similarly
  - reference_id: PMID:29720657
  - reference_id: PMID:12944511
suggested_questions:
- question: What target-specific neuromuscular evidence and historical PAINT node placement support the
    alpha4 neuromuscular-transmission assertion?
- question: Do CHRNA4 polymorphisms alter a defined oxidative-stress or repair response in lymphocytes,
    independently of disease severity and cell composition?
- question: How do the two current human splice products differ in receptor assembly, surface trafficking
    and channel behavior when their sequences are tested directly?
- question: Which engineered CRELD2 and high-throughput interaction capabilities occur in a native compartment
    with the exact tested product and membrane topology?
suggested_experiments:
- hypothesis: Human alpha4 splice products differ in assembly or trafficking rather than merely expression
    level.
  description: Express sequence-verified products at matched levels with defined beta2/accessory-subunit
    stoichiometries, then measure surface abundance, agonist currents and calcium permeability; distinguish
    full-length chains from assay fragments.
- hypothesis: The reported lymphocyte stress associations may reflect a receptor-dependent signaling effect
    rather than direct DNA repair.
  description: In an isogenic human lymphocyte model, perturb CHRNA4 and rescue defined products while
    measuring receptor currents, oxidative lesions, repair kinetics and cell-state covariates separately.
