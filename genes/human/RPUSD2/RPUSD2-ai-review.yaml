        comment: Deep RluA-family node whose rRNA evidence comes from bacterial RluA-F and yeast Pus5/Pus9-type
          members; human RPUSD2 knockout profiling finds only tRNA substrates and the authors place rRNA-activity
          loss on the eukaryotic RPUSD2 lineage.
    supported_by:
    - reference_id: PMID:41136621
      supporting_text: Compared with bacterial RluA, eukaryotic RPUSD2 has lost its activity towards rRNAs,
        while its function on tRNA Ψ32 is well maintained.
    - reference_id: PMID:41136621
