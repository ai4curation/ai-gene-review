    31 and 32 of the tRNA anticodon loop, established by knockout in two independent human cell-line studies
    for mitochondrial tRNAs (and in one study also for cytosolic tRNAs, plus Psi34 of cytosolic tRNA-Ile-TAT).
  molecular_function:
