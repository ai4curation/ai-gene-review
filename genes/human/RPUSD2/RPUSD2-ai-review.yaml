  label: Homo sapiens
description: 'RPUSD2 is a stand-alone RNA pseudouridine synthase of the RluA family (PANTHER PTHR21600:SF40),
  descended from the bacterial RluA lineage and retaining the catalytic aspartate of the RluA active site.
  It isomerizes specific uridines in the anticodon loop of tRNAs to pseudouridine: in human cells it is
  required for pseudouridine at positions 31 and 32 of mitochondrial tRNAs (including mt-tRNA-Leu(CUN),
  mt-tRNA-Pro and mt-tRNA-Cys), and one study also assigns it positions 31-32 of cytosolic tRNAs and the
  wobble position 34 of cytosolic tRNA-Ile-TAT. Recombinant RPUSD2 can also pseudouridylate pre-mRNA sequences
  in vitro. Unlike the ancestral bacterial RluA, no rRNA substrate has been detected. An N-terminal mitochondrial
  targeting signal is predicted, consistent with its mitochondrial tRNA substrates, but its subcellular
  distribution has not been directly imaged.'
