  review:
    summary: IBA from the deep RluA-family node PTN002727951, whose rRNA pseudouridine synthesis evidence
      comes from bacterial RluA-RluF and yeast Pus5/Pus9-type members. Two independent genome-wide pseudouridine
      profiling studies of RPUSD2-knockout human cells found only tRNA substrates, and the human mitochondrial
      16S rRNA RluA-family site is made by RPUSD4. The authors of the first study conclude that eukaryotic
      RPUSD2 has lost the ancestral rRNA activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'RPUSD2 sits in the clade below PTN002727951, so the propagation is mechanically correct,
      but there is target-specific evidence of substrate divergence: no RPUSD2-dependent rRNA site was
      detected in either knockout dataset, and the phylogenetic analysis in PMID:41136621 explicitly places
      rRNA activity loss on the eukaryotic RPUSD2 lineage. This is negative/absence evidence from cell-line
      profiling rather than a demonstrated inability, so the row is marked over-annotated rather than
      removed (consistent with the treatment of the same IBA on yeast RIB2, the other SF40 member reviewed
      here).'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002727951
        source_label: PTN002727951
