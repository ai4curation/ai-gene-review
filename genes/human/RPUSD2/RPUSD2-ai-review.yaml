    supporting_text: In mitochondrial tRNA, we identified 3 RPUSD2-dependent Ψ sites, and the modification
      levels of these sites were nearly abolished (dropped to 0.00%) after RPUSD2 knockout
  - reference_id: PMID:41136621
    supporting_text: RPUSD2 installs Ψ modification at position 31–32 in both cy-tRNAs and mt-tRNAs as
      well as the anticodon position 34 in cy-tRNAs
- description: tRNA pseudouridine(31) synthase activity on mitochondrial tRNA-Leu(CUN) and other tRNAs,
    an activity shared with yeast RluA-family Pus9.
  molecular_function:
    id: GO:0160152
    label: tRNA pseudouridine(31) synthase activity
  directly_involved_in:
