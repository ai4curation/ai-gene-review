      cy-tRNAs and mt-tRNAs as well as Ψ34 within the anticodon.
suggested_questions:
- question: Does RPUSD2 modify cytosolic tRNAs in vivo? PMID:41136621 (HCT116) reports cytosolic Psi31/32/34
    targets, whereas PMID:41698914 (HEK293T) found no confident cytosolic substrates. Is this cell-type
    dependent, isoform dependent, or a methodological difference?
- question: Where is RPUSD2 located? Both isoforms carry a predicted N-terminal mitochondrial targeting
    signal, but an enzyme acting on cytosolic tRNAs and pre-mRNA would also need a cytosolic or nuclear
    pool.
- question: Are the in vitro pre-mRNA targets of recombinant RPUSD2 (PMID:35051350) modified in an RPUSD2-dependent
    manner in cells?
suggested_experiments:
- description: Re-express wild-type and catalytic-dead (D274A) RPUSD2 in RPUSD2-knockout cells and quantify
    tRNA Psi31/Psi32/Psi34 and candidate pre-mRNA sites, to show that the knockout effects require RPUSD2
    catalysis (as was done for RPUSD1 D67A in PMID:41136621).
