id: P47871
gene_symbol: GCGR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GCGR is the class B1 G protein-coupled receptor for the pancreatic hormone glucagon. A seven-transmembrane
  protein of the plasma membrane, it captures glucagon with its extracellular N-terminal domain and transmembrane
  core, then couples mainly to Gs to activate adenylyl cyclase and raise cAMP, with additional Ca2+ mobilization.
  In liver this drives glycogenolysis and gluconeogenesis, making GCGR a central regulator of blood glucose
  and of the metabolic response to fasting; glucagon also controls hepatic amino-acid catabolism through
  it. Ligand binding promotes phosphorylation of the C-terminal tail and rapid receptor endocytosis. Biallelic
  loss-of-function variants cause Mahvash disease, with hyperglucagonemia, pancreatic alpha-cell hyperplasia,
  neuroendocrine tumors and hyperaminoacidemia.
