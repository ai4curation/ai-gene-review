core_functions:
- description: Plasma-membrane receptor for glucagon that couples to Gs to activate adenylyl cyclase,
    raising cAMP and driving hepatic glucose production.
  molecular_function:
    id: GO:0004967
    label: glucagon receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  - id: GO:0071377
    label: cellular response to glucagon stimulus
  supported_by:
  - reference_id: PMID:19657311
    supporting_text: GCGR is a G protein-coupled receptor that activates the stimulatory α G protein (Gs)
      and increases cAMP production upon glucagon binding
  - reference_id: PMID:8144028
    supporting_text: binds [125I]glucagon and transduces a signal leading to increases in the concentration
      of intracellular cyclic adenosine 3',5'-monophosphate
  - reference_id: PMID:30294546
    supporting_text: Phe320del GCGR are both expressed on the cell surface.
suggested_questions:
- question: How much of GCGR's control of hepatic amino-acid catabolism depends on Gs-cAMP versus Gq/Ca2+
    signaling, and do RAMP complexes bias this?
- question: Where does GCGR signal after ligand-induced endocytosis, and does endosomal signaling contribute
    to sustained gluconeogenic gene expression?
suggested_experiments:
- description: Compare surface-retained versus internalization-defective (tail phosphorylation mutant)
    GCGR in primary human hepatocytes for cAMP kinetics and gluconeogenic gene induction.
