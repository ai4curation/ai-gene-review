id: O14497
gene_symbol: ARID1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARID1A (BAF250A/p270) is a nuclear DNA-binding and assembly subunit of canonical
  mammalian SWI/SNF (cBAF) chromatin-remodeling complexes. Its ARID domain binds DNA without
  an established AT-rich sequence preference, while other regions associate with complex components
  and transcriptional regulators. ARID1A-containing complexes couple substrate engagement
  and regulatory recruitment to ATP-driven nucleosome remodeling by SMARCA4 or SMARCA2, supporting
  context-dependent transcriptional activation and repression. ARID1A and ARID1B occupy alternative
  positions in cBAF assemblies. ARID1A also participates in TOP2A-associated chromosome decatenation
  and contributes to developmental gene-regulatory programs; altered ARID1A function is associated
  with developmental disorders and cancer.
