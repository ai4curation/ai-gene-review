suggested_questions:
- question: How do ARID1A DNA contacts and transcription-factor recruitment divide locus selection
    between ARID1A- and ARID1B-containing assemblies?
- question: Which native human cell contexts switch ARID1A-containing complexes between receptor
    coactivation and HIC1-dependent repression?
- question: How does the BAF250a-TOP2A interface influence decatenation independently of global
    chromatin accessibility?
suggested_experiments:
- description: Compare defined endogenous ARID1A and ARID1B assemblies in neural progenitors
    and differentiated neurons, retaining isoform identity, quantitative subunit composition
    and chromatin-recruitment measurements.
