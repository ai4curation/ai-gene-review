- term:
    id: GO:1901981
    label: phosphatidylinositol phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phosphatidylinositol phosphate binding is inherited from a Eukaryota-root PAINT
      node seeded only by RUBCNL/Pacer; direct lipid binding has not been shown for Rubicon,
      and the available evidence argues against it.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only experimental seed for PTN002915557 is Pacer (Q9H714, IDA PMID:28306502).
      For Rubicon, a PtdIns(3)P bead pull-down was negative (PMID:19270693), and the RH-domain
      crystal structure shows that its FYVE-like zinc cluster lacks the basic residues needed
      for PI(3)P binding, the authors noting that Rubicon has not been reported to bind phospholipids
      (PMID:32632011). Rubicon membrane targeting is explained by binding to Rab7-GTP and
      PI3KC3-C2 instead. Lipid binding appears to be a Pacer-lineage property, not an established
      ancestral function.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002915557
        source_label: PTN002915557
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Eukaryota-root node seeded only by RUBCNL/Pacer lipid-strip binding (PMID:28306502);
          Rubicon was PtdIns(3)P-bead negative (PMID:19270693) and lacks FYVE basic residues
          (PMID:32632011).
    additional_reference_ids:
    - GO_REF:0000033
    - PMID:28306502
    - PMID:19270693
    - PMID:32632011
    supported_by:
    - reference_id: PMID:19270693
      supporting_text: Rubicon-EGFP was not pulled down by PtdIns(3)P-conjugated sepharose
        beads
    - reference_id: PMID:32632011
      supporting_text: Rubicon has not been reported to bind specifically to phospholipids
    - reference_id: PMID:32632011
      supporting_text: However, the Rubicon Zn cluster 1 lacks some of the basic residues
        required for canonical FYVE domain phosphatidylinositol 3-phosphate (PI[3]P) binding
