  review:
    summary: The Rubicon RH domain binds GTP-bound Rab7 directly; this targets Rubicon to
      late endosomes and is required for its autophagy-inhibitory function.
    action: NEW
    reason: Direct binding of the RH domain to Rab7-GTP is shown biochemically (PMID:20943950),
      by a 2.8 A co-crystal structure, and by interface mutants that abolish colocalization
      and relieve autophagy inhibition (PMID:32632011). Rab7 binding is an activity of Rubicon
      itself, not just a requirement. No GOA row currently captures it (only GO:0005515).
    additional_reference_ids:
    - PMID:32632011
    - PMID:20943950
    - PMID:20974968
    supported_by:
    - &id001
      reference_id: PMID:32632011
      supporting_text: Rubicon-mediated inhibition of autophagy requires the interaction of
        the C-terminal Rubicon homology (RH) domain of Rubicon with Rab7-GTP
