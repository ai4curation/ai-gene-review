id: Q92622
gene_symbol: RUBCN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RUBCN encodes Rubicon (RUN domain Beclin-1-interacting and cysteine-rich domain-containing
  protein), a negative regulator of late-stage autophagy and endolysosomal maturation. Its
  middle PI3K-binding region associates with the UVRAG-containing class III phosphatidylinositol
  3-kinase complex II (Beclin 1-VPS34-VPS15-UVRAG), contacting the Beclin 1 BARA domain, and
  inhibits VPS34 lipid kinase activity; its C-terminal zinc-cluster Rubicon homology (RH)
  domain binds GTP-bound Rab7, targeting Rubicon to late endosomes and lysosomes. By restraining
  PI3KC3-C2 and sequestering UVRAG from the HOPS tethering complex, Rubicon slows autophagosome
  maturation, autophagosome-lysosome fusion and endosome maturation. Rubicon expression rises
  with age and under lipid overload, and its loss enhances autophagic flux. In phagocytes
  Rubicon is also linked to NADPH oxidase-dependent phagosome functions and to feedback inhibition
  of CARD9 signalling downstream of pattern-recognition receptors.
