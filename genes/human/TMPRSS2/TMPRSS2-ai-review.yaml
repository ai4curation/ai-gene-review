  evidence_type: IDA
  original_reference_id: PMID:25122198
  qualifier: enables
  review:
    summary: TMPRSS2 is an experimentally supported cell-surface serine endopeptidase.
    action: ACCEPT
    reason: The cited study directly used substrate-library screening and pro-HGF cleavage to show that TMPRSS2 acts as a serine protease on extracellular substrates. GO:0004252 captures the catalytic activity at the right granularity.
    supported_by:
    - reference_id: PMID:25122198
      supporting_text: By screening combinatorial peptide libraries, we identified a spectrum of TMPRSS2 substrates that include pro-hepatocyte growth factor (HGF).
