id: O15393
gene_symbol: TMPRSS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TMPRSS2 encodes a type II transmembrane serine endopeptidase with an extracellular trypsin-like catalytic domain that is anchored at the plasma membrane and can be released after autocatalytic processing. It cleaves arginine- and lysine-flanked extracellular protein substrates, including pro-hepatocyte growth factor in prostate tumor models and coronavirus spike glycoproteins and ACE2 during viral entry. Several respiratory viruses exploit its cell-surface protease activity for envelope-glycoprotein priming, and seasonal human coronavirus HKU1 can also use TMPRSS2 itself as a host-cell receptor.'
