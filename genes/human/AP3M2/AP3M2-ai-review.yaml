    is broadly expressed, a second, non-neuronal function is being missed - and the zebrafish pigment-cell
    requirement and the human melanocyte enrichment point the same way.
  resolution: Cell-type-resolved protein-level measurement of AP3M2 versus AP3M1 in human tissues, and
