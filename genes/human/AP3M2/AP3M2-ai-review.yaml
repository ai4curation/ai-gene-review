      pigment cells, and GO's own definition of GO:0030123 says the complex 'is found associated with
      endosomal membranes'. This is the core site of action and is accepted as such."
    additional_reference_ids:
    - PMID:15051738
    supported_by:
    - reference_id: PMID:23247405
      supporting_text: Rab32 and Rab38 interact with AP-1, AP-3 and BLOC-2 on early/recycling
        endosome tubules, where cargo such as tyrosinase and Tyrp1 are loaded into vesicles or
        transport intermediates.
    - reference_id: PMID:15051738
      supporting_text: Here, we show by immuno-electron microscopy that AP-3 is associated with
        budding profiles evolving from a tubular endosomal compartment that also exhibits budding
        profiles positive for AP-1.
