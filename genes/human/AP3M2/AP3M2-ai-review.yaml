- term:
    id: GO:0035654
    label: clathrin-coated vesicle cargo loading, AP-3-mediated
  evidence_type: NAS
  original_reference_id: PMID:9545220
  qualifier: involved_in
  review:
    summary: Cargo loading into AP-3-coated vesicles - the AP-3-specific cargo-loading term, and the
      best statement in GOA of what this protein contributes to.
    action: ACCEPT
    reason: 'The term is defined as the formation of a complex between AP-3 subunits and the proteins
      to be transported, which is precisely the mu subunit''s job: mu adaptins are the tyrosine-signal
      recognition arm, mu3B itself binds YxxO signals, and the human AP-3 structure shows the complex
      rigidified around a LAMP1 tyrosine cargo peptide. In vivo the mu3B knockout loses vesicular GABA
      transporter from hippocampal synaptic vesicles while other vesicle proteins are unchanged, which
      is a cargo-selection phenotype. Accepted as a core process. This review modifies GO:0035615 and
      GO:0030131 because they commit AP-3 to clathrin, so consistency demands saying why the same objection
      does not carry here. It does apply to the wording: both the term name and the definition''s clause
      ''transported by a clathrin-coated vesicle'' inherit GO''s legacy framing of AP-3 as a clathrin
      coat. What differs is what the term picks out and what alternatives exist. GO:0035615 and GO:0030131
      are terms about clathrin adaptors that AP-3 was swept into, and each has a clean non-clathrin
      replacement already in GO (GO:0140312, GO:0030123). GO:0035654 is the opposite case: it was created
      for AP-3, its definition names the AP-3 heterotetramer, and there is no AP-3-specific cargo-loading
      term outside the clathrin branch - generalising to GO:0035459 vesicle cargo loading would throw
      away the AP-3 identity in order to drop an adjective. The remedy belongs to the ontology, not
      to this gene, and is recorded in proposed_new_terms.'
    additional_reference_ids:
    - PMID:9151686
    - PMID:15492041
    supported_by:
    - reference_id: PMID:9151686
      supporting_text: The presence of a μ subunit in the complex indicates that it plays a role in
        the sorting of proteins containing tyrosine-based signals
    - reference_id: PMID:15492041
      supporting_text: The amount of VGAT protein was decreased significantly in synaptosomal lysates
        from the hippocampus of μ3B−/−ΔNeo mice
    - reference_id: PMID:9545220
      supporting_text: A heterotetrameric complex termed AP-3 is involved in signal-mediated protein
        sorting to endosomal-lysosomal organelles.
