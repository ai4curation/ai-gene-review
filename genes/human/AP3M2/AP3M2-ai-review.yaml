- term:
    id: GO:0061534
    label: gamma-aminobutyric acid secretion, neurotransmission
  evidence_type: ISS
  original_reference_id: PMID:15492041
  supporting_entities:
  - UniProtKB:Q8R2R9
  review:
    summary: 'Required for inhibitory neurotransmission: deleting the mouse orthologue selectively impairs
      evoked GABA release. Nothing in GOA captures the one phenotype that distinguishes mu3B from every
      other AP-3 subunit.'
    action: NEW
    reason: 'The mu3B knockout is the only gene-specific in vivo experiment on this protein, and its
      central result is a transmitter-selective secretion defect: potassium-evoked GABA release is impaired
      while glutamate release is not, the vesicular GABA transporter is reduced in hippocampal synaptosomes
      while VGLUT1, VGLUT2, synaptophysin, synaptotagmin, VAMP2, rabphilin-3A and Rab3A are unchanged,
      and the animals develop spontaneous seizures. GOA records the GABA-ergic synapse as a location
      but nowhere records the process. The involvement is a requirement acting through cargo loading
      rather than agency over release itself, and the objection that this sits one step downstream of
      the mechanism is fair: GO:0016182 and GO:0035654 carry the mechanism and GO:0098982 carries the
      compartment. It is proposed anyway for two reasons. The defect is transmitter-selective rather
      than a general secretion failure - glutamate release, VGLUT1, VGLUT2 and the general synaptic
      vesicle proteins are all normal in the same animals - so the term records which secretory pathway
      depends on this subunit, which the mechanistic terms do not say. And it is the only in vivo result
      obtained by perturbing this gene rather than a partner subunit, so leaving it unrecorded loses
      the one piece of gene-specific physiology there is. Coded ISS with the mouse orthologue as donor,
      since the evidence is mouse-only and must not be presented as a human experiment.'
    supported_by:
    - reference_id: PMID:15492041
