    summary: Early endosome, asserted by ComplexPortal for the neuronal AP-3 complexes
      CPX-5053/CPX-5055 of which AP3M2 is the mu subunit. This is the compartment at which AP-3
      actually works.
    action: ACCEPT
    reason: "Independent immuno-electron microscopy settled a long-running controversy in favour of the
      endosome: AP-3 decorates budding profiles on tubular sorting endosomes and routes LAMP-1/CD63 from
