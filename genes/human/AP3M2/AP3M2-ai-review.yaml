  review:
    summary: trans-Golgi network, propagated from the PTHR10529 family-root node. Every gene-level donor
      behind this node's TGN assertion is an AP-1 or AP-4 medium subunit; no AP-3 mu subunit contributes
      to it.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005769
      label: early endosome
    reason: 'The IBD sits at PTN000055849, the root of a family that spans AP-1, AP-2, AP-3 and AP-4
      mu subunits plus the stonins, and its five gene donors resolve to Arabidopsis AP1M2 (AT1G60780),
      Arabidopsis AP4M (AT4G24550), yeast APM2 (S000001011), dog AP4M1 (E2RED8) and human AP4M1 (O00189).
      The TGN is the right compartment for AP-1 and AP-4; the PAINT curators evidently agree that it
      is subfamily-specific within this family, because the committed slice shows an IRD blocking GO:0005802
      one clade over, at the AP-2 node PTN000242370. For mammalian AP-3 the compartment question was
      resolved experimentally against the TGN: immuno-EM places AP-3 budding profiles on a tubular endosomal
      compartment, and GO''s own definition of the AP-3 complex says it is found on endosomal membranes.
      Modified to early endosome, which the gene already carries from ComplexPortal, rather than removed,
      since a Golgi-region pool of AP-3 is real and is retained on the separate GO:0005794 row.'
    additional_reference_ids:
