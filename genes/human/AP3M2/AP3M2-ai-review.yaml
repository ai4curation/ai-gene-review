id: P53677
gene_symbol: AP3M2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AP3M2 is the mu3B cargo-recognition subunit of the heterotetrameric AP-3 membrane-coat
  adaptor complex. Its C-terminal mu-homology domain recognizes tyrosine-based sorting motifs in
  membrane-protein tails. AP-3 selects cargo for transport through endosomal compartments to
  lysosomes, lysosome-related organelles and neuronal synaptic vesicles. Mammalian AP-3 can
  associate with clathrin and also functions through clathrin-independent routes. In neurons,
  mu3B-containing AP-3 promotes formation of a subset of synaptic vesicles from endosomes and
  supports their cargo composition; mouse loss of mu3B reduces vesicle abundance and impairs
  hippocampal GABA release. Human expression and non-neuronal vertebrate phenotypes indicate
  functions beyond the historical neuron-specific designation.
