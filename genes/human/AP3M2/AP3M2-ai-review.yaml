suggested_questions:
- question: Is the 'neuron-specific' description of mu3B still correct for the human protein, given
    that human expression atlases report low tissue specificity and the strongest single-cell signal
    in melanocytes?
  experts:
  - Hiroshi Ohno
  - Victor Faundez
- question: Does any cargo require mu3B rather than mu3A? The YxxPhi preferences of the two differ,
    but no cargo has been shown to depend on that difference, and the best-characterised
    AP-3B-dependent protein, VGAT, appears to use a dileucine signal read by sigma3 instead.
  experts:
  - Hiroshi Ohno
  - Juan S. Bonifacino
- question: The reconstituted human structure 9C5B uses AP3M1, as the existing sequence/structure
    mapping establishes. Does the AP3M2-containing complex show the same cargo-coupled
    conformational transitions and context-dependent clathrin recruitment?
  experts:
  - Richard W. Baker
- question: Is mu3B destabilised in AP3B2-null neurons, as beta3B is in mu3B-null brain? This
    determines whether DEE48 should be understood as loss of the beta3B subunit or of the entire
    neuronal AP-3B complex.
  experts:
  - Caroline W. Beck
  - Victor Faundez
suggested_experiments:
- hypothesis: Human AP3M2 acts in lysosome-related organelle biogenesis in pigment cells, not only
    in neurons.
  description: Knock out AP3M2 and, separately, AP3M1 in a human melanocytic line (e.g. MNT-1) and
    score melanosome maturation by electron microscopy together with tyrosinase and TYRP1
    localisation. A phenotype in the AP3M2 line would show the paralogue is used outside neurons and
    would connect the human melanocyte expression signal to the zebrafish iridophore requirement.
  experiment_type: CRISPR knockout with organelle ultrastructure and cargo localisation readout
- hypothesis: mu3B and mu3A confer different cargo repertoires on otherwise identical AP-3
    complexes.
  description: Reconstitute human AP-3 cores differing only in the mu subunit and compare their
    binding to a library of cytoplasmic-tail peptides, then validate the top differential hits by
    rescuing mu3B-null neurons with wild-type mu3B, mu3A, or a mu3B carrying the mu3A residues at
    the nine cargo-contacting positions identified in PDB 9C5B.
  experiment_type: In vitro reconstitution and peptide-array binding with knockout rescue
- hypothesis: AP3M2 contributes to endosomal synaptic-vesicle reformation; simultaneous assays can
    determine whether it also affects plasma-membrane retrieval under particular stimulation
    conditions.
  description: 'In cultured mu3B-null hippocampal neurons, separate the two vesicle-formation routes with
    pHluorin-tagged VGAT and VGLUT1: measure plasma-membrane retrieval kinetics after stimulation, and
    in parallel follow endosomal budding using a temperature-block and release protocol. AP-3B loss should
    leave retrieval kinetics intact while reducing the endosome-derived vesicle pool.'
  experiment_type: Live-cell pHluorin imaging in knockout neurons
- hypothesis: The mu3 linker amphipathic helix predicted here contributes to membrane binding by the
    neuronal complex.
  description: Express the AP3M2 139-156 segment as an mGreenLantern fusion and assay binding to
    supported lipid bilayers with high-salt and detergent washes, as was done for the mu3A helix,
    then test the effect of replacing its hydrophobic face on AP-3B recruitment to endosomes in
    neurons.
  experiment_type: Supported-lipid-bilayer pelleting assay with structure-guided mutagenesis
