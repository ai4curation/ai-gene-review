knowledge_gaps:
- gap_statement: It is not known whether human AP3M2 is functionally a neuronal protein. The
    'neuron-specific mu3B' description rests on a 1994 rat Northern blot, while human expression
    atlases report the gene detected in all tissues with low tissue specificity and its highest
    single-cell signal in melanocytes and spermatogenic cells, not neurons.
  boundary: The rodent restriction itself is solid, and the mouse knockout phenotype is
    unambiguously neurological. What is unestablished is that the human orthologue has the same
    restricted distribution, and therefore whether the human protein's principal role is the
    neuronal one.
  gap_kind:
