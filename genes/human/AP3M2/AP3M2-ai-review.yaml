proposed_new_terms:
- proposed_name: tyrosine-based sorting signal binding
  proposed_definition: Binding to a tyrosine-based sorting signal, a short peptide motif of the form
    YxxPhi (where Y is tyrosine, x is any amino acid and Phi is a bulky hydrophobic residue) located
    in the cytoplasmic tail of a transmembrane protein, which directs that protein into a vesicular
    transport pathway.
  justification: 'This is the activity of the medium (mu) subunits of the heterotetrameric adaptor protein
    complexes, and it is not confined to endocytosis: mu1 of AP-1 reads such signals at the trans-Golgi
    network, mu3 of AP-3 reads them on endosomes en route to lysosomes, and a mu4-specific signal routes
    a reporter into the endosomal-lysosomal system without being internalised from the plasma membrane
    at all. GO''s only molecular function term for the motif, GO:0089710 endocytic targeting sequence
    binding, is defined as directing ''internalization by clathrin-coated pits'' and its only ancestors
    are GO:0005515, GO:0005488 and GO:0003674, so there is no non-endocytic sibling available. The consequence
    is visible in this gene''s annotations: lacking any subunit-level term, the PAINT family-root node
    propagates the clathrin- and endocytosis-committed GO:0035615 to AP-3 and AP-4 medium subunits,
    and the review of AP3M2 can only record a contributes_to at the complex level. GO:0089710 would
    become a child of the new term.'
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:11139587
    supporting_text: The medium (mu) chains of the adaptor protein (AP) complexes AP-1, AP-2, and AP-3
      recognize distinct subsets of tyrosine-based (YXXphi) sorting signals found within the cytoplasmic
      domains of integral membrane proteins.
  - reference_id: PMID:11139587
    supporting_text: This chimera was targeted to the endosomal-lysosomal system without being internalized
      from the plasma membrane.
  - reference_id: PMID:9748267
    supporting_text: Other than for this common preference, each medium subunit favored specific sets
      of residues at the X and O positions; these preferences were consistent with the proposed roles
      of the different adaptor complexes in rapid endocytosis and lysosomal targeting.
  - reference_id: PMID:9151686
    supporting_text: The presence of a μ subunit in the complex indicates that it plays a role in the
      sorting of proteins containing tyrosine-based signals
- proposed_name: vesicle cargo loading, AP-3-mediated
  proposed_definition: Formation of a macromolecular complex between proteins of the AP-3 adaptor complex
    and the proteins and/or lipoproteins that are to be transported by the vesicle the complex coats.
  justification: 'GO:0035654 ''clathrin-coated vesicle cargo loading, AP-3-mediated'' is the only AP-3-specific
    cargo-loading term in GO, and this review accepts it as a core process for AP3M2 - but both its
    name and its definition''s clause ''transported by a clathrin-coated vesicle'' commit AP-3 to a
    coat it is not. UniProt describes AP-3 as ''an adaptor-related complex which is not clathrin-associated'';
    GO''s own definition of the AP-3 complex says ''AP-3 does not appear to associate with clathrin
    in all organisms''; and the structural work shows AP-3 recruited by Arf1 and polymerising through
    a second Arf1 molecule rather than onto a clathrin lattice. The commitment is not harmless: it is
    the same legacy framing that lets GO:0035615 and GO:0030131 reach AP-3 subunits, and this review
    modifies both of those for that reason. The cleanest fix is to drop ''clathrin-coated'' from GO:0035654
    and re-parent it under GO:0035459 vesicle cargo loading, leaving GO:0035652 clathrin-coated vesicle
    cargo loading for the AP-1 and AP-2 adaptors. Generalising annotations to GO:0035459 instead would
    discard the AP-3 identity in order to remove an adjective, which is why this gene''s row is accepted
    rather than modified.'
  proposed_parent:
    id: GO:0035459
    label: vesicle cargo loading
  supported_by:
  - reference_id: file:human/AP3M2/AP3M2-uniprot.txt
    supporting_text: not clathrin-associated. The complex is associated with the Golgi
  - reference_id: PMID:39705307
    supporting_text: our findings that AP-3 contains multiple AH domains and can co-opt Arf1 for homodimerization
      suggests that a clathrin-independent tubular coat for AP-3 is likely.
