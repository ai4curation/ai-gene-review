- term:
    id: GO:0008089
    label: anterograde axonal transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8R2R9
  - ensembl:ENSMUSP00000147967
  review:
    summary: Anterograde axonal transport, from mouse Ap3m2. The mouse annotation is an IMP citing a
      study whose only AP-3 allele is mocha (Ap3d1), which removes both AP-3A and AP-3B.
    action: KEEP_AS_NON_CORE
    reason: 'AP-3 really is required for cargo to reach neurites and nerve terminals - the cited study
      shows PI4KIIalpha fails to leave the cell body in AP-3-deficient brain, and UniProt states the
      same requirement - so the claim is not withdrawn. Two things keep it out of the core set. First,
      the gene-level evidence behind the transfer is complex-level: the perturbed gene is Ap3d1, not
      Ap3m2, so the result cannot be attributed to the mu3B-containing AP-3B specifically. Second, the
      term describes microtubule-based movement along the axon, whereas the step AP-3 performs is the
      upstream packaging of cargo into the carriers that are then moved. Retained as a peripheral, requirement-level
      involvement.'
    additional_reference_ids:
    - PMID:21998198
    supported_by:
    - reference_id: PMID:21998198
      supporting_text: Our findings indicate a novel vesicle transport mechanism requiring BLOC-1 and
        AP-3 complexes for cargo sorting from neuronal cell bodies to neurites and nerve terminals.
    - reference_id: PMID:21998198
      supporting_text: PI4KIIα is present in synapses, and its presynaptic levels are decreased in AP-3–null
        brains (Ap3d1mh/mh).
    - reference_id: file:human/AP3M2/AP3M2-uniprot.txt
      supporting_text: cell bodies for delivery into neurites and nerve terminals.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:Q8R2R9
        source_label: Ap3m2 (Mus musculus), the 1:1 orthologue
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The mouse donor annotation is an IMP citing PMID:21998198. The cached full text of
          that paper (24,083 words) contains no occurrence of Ap3m2, mu3B or AP-3B; every AP-3 allele
          it uses is mocha (Ap3d1mh/mh), which removes the shared delta subunit and so ablates AP-3A
          and AP-3B together. The transferred biology is real at the complex level but is not resolved
          to the mu3B-containing complex, which is why the human row is kept as non-core rather than
          accepted as core.
      - source_id: ensembl:ENSMUSP00000147967
        source_label: Ensembl protein for mouse Ap3m2
        source_status: SUPPORTS_TRANSFER
        comment: Orthology identifier only. Ensembl Compara projects the annotation mechanically once
          the orthology call is made; the judgement therefore rests entirely on the donor annotation,
          not on this identifier.
      residue_claims_not_applicable: The objection is to the gene-level resolution of the donor evidence.
