      mu1, mu2, and mu3 (A or B) subunits of the AP-1, AP-2, and AP-3 complexes, respectively, by
      screening a combinatorial XXXYXXO library using the yeast two-hybrid system.
  - reference_id: PMID:39705307
    supporting_text: Cryo-EM structure of AP-3 bound to Arf1 and LAMP1 cargo peptide on a lipid
      nanodisc.
  - reference_id: PMID:15051738
    supporting_text: Based on these data, we propose that AP-3 defines a novel pathway by which
      lysosomal membrane proteins are transported from tubular sorting endosomes to lysosomes.
