    reason: 'The donors resolve to yeast APM3 (P38153, the AP-3 mu subunit), yeast APM2 (P38700), yeast
      APM1 (Q00776, AP-1 mu) and human AP4M1 (O00189). In budding yeast AP-3 does carry cargo directly
