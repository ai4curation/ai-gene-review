description: 'AP3M2 is the mu-3B medium subunit of the heterotetrameric AP-3 adaptor complex, one of
  two interchangeable mu subunits that define the complex''s two forms. With the ubiquitous beta3A subunit
  and mu3A the complex is AP-3A; with the neuron-enriched beta3B subunit and mu3B it is AP-3B, and the
  two beta/mu pairings are obligate, so AP3M2 is the medium subunit of the neuronal complex. The shared
  delta and sigma3 subunits complete either form.


  AP-3 is a vesicle coat. It is recruited from the cytosol onto the cytoplasmic face of endosomal membranes
  by the small GTPase Arf1, selects transmembrane cargo through sorting signals in cargo cytoplasmic
  tails, and buds coated carriers that deliver that cargo to lysosomes and to lysosome-related organelles
  such as melanosomes and platelet dense granules. The complex reads two kinds of signal through two
  different subunits: acidic dileucine motifs through the sigma3 subunit, and tyrosine-based YxxPhi
  motifs through the medium subunit, which is the arm AP3M2 provides. Cargo engagement rigidifies the
  complex and licenses coat polymerisation, so cargo selection and vesicle formation are mechanically
  coupled. Unlike the AP-1 and AP-2 adaptors, AP-3 is not a clathrin coat, and its site of action is
  the tubular sorting endosome rather than the trans-Golgi network or the plasma membrane.


  In neurons the mu3B-containing complex has a distinct job: it generates a subset of synaptic vesicles
  by budding them from endosomal membranes, a route parallel to the dominant AP-2-dependent retrieval
  of vesicles from the presynaptic membrane, and it loads particular membrane proteins into those vesicles.
  Loss of mu3B in mouse reduces the number and size of synaptic vesicles, depletes the vesicular GABA
  transporter from hippocampal terminals while leaving the glutamate transporters and the general synaptic
  vesicle proteins untouched, selectively impairs evoked GABA release, lowers the threshold for hippocampal
  long-term potentiation, and produces spontaneous epileptic seizures. The same sorting machinery, acting
  with the BLOC-1 complex, is also required for membrane cargo to leave neuronal cell bodies for neurites
  and nerve terminals.


  Although the rodent transcript is confined to brain and spinal cord, the human gene is broadly expressed,
  with its strongest single-cell signal in melanocytes and spermatogenic cells, and the zebrafish gene
  named gene is required for the lysosome-related organelles that build guanine crystals in pigment
  cells - so the protein''s role outside the nervous system is likely wider than the historical neuron-specific
  description implies.'
