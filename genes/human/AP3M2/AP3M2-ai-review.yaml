existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026971
  review:
    summary: Generic cytoplasmic localisation asserted by an ARBA machine-learning rule. The claim is
      true of AP-3 - it is a cytosolic coat complex that cycles on and off membranes - but the rule's
      own published conditions cannot be satisfied by this protein.
    action: KEEP_AS_NON_CORE
    reason: 'AP-3 is recruited from cytosol onto membranes - brefeldin A strips the delta subunit off
      membranes and redistributes it to the cytoplasm - so a cytoplasmic location is not wrong, merely
      uninformative next to the Golgi, endosome and vesicle-membrane rows this gene already carries.
      The reason it is not simply accepted is a provenance defect: ARBA00026971 fetched from rest.uniprot.org
      has 2,388 condition sets, and filtering them for any of the seven InterPro signatures InterPro
      reports for P53677 (IPR001392, IPR011012, IPR018240, IPR022775, IPR028565, IPR036168, IPR050431)
      or for PTHR10529 leaves exactly two - one pairing IPR011012 with taxon Saccharomyces, the other
      pairing IPR022775 with the sigma-subunit families IPR016635 and IPR027156 that a mu subunit does
      not have. Neither can fire on a human mu adaptin, so the annotation is not reproducible from the
      rule as the API serves it today (the record carries no meaningful version, so an earlier revision
      may have differed). Kept, not removed, because the biology is sound; recorded here so the rule
      can be examined.'
    additional_reference_ids:
    - PMID:9151686
    supported_by:
    - reference_id: PMID:9151686
      supporting_text: Both proteins can be seen to have completely redistributed to the cytoplasm.
    - reference_id: file:human/AP3M2/AP3M2-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Golgi apparatus. Cytoplasmic vesicle membrane'
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: ARBA:ARBA00026971
        source_label: ARBA rule conferring GO:0005737
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: 'Rule with 2,388 condition sets conferring a single annotation (GO:0005737). Only two
          of those sets mention any signature AP3M2 carries: one requires IPR011012 together with taxon
          Saccharomyces, the other requires IPR016635 and IPR027156 alongside IPR022775. AP3M2 is human
          and is a mu, not a sigma, subunit, so neither fires. The conferred term is nevertheless biologically
          correct for a cytosolic coat adaptor.'
      residue_claims_not_applicable: The objection is to the rule's condition sets and to the term's
        generality, not to any residue of the protein.
