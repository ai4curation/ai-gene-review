core_functions:
- description: >-
    CERK phosphorylates ceramide to ceramide 1-phosphate on the cytoplasmic
    leaflet of the trans-Golgi network in a Mg2+-dependent lipid-kinase
    reaction. In the CERT/CERK/CPTP module, CERT1 supplies C16 ceramide from the
    ER to the Golgi, CERK generates C1P at the cytoplasmic TGN surface, and CPTP
    transfers C1P onward to other membranes.
  molecular_function:
    id: GO:0001729
    label: ceramide kinase activity
  directly_involved_in:
  - id: GO:0006672
    label: ceramide metabolic process
  locations:
  - id: GO:0160281
    label: cytoplasmic side of trans-Golgi network membrane
  supported_by:
  - reference_id: PMID:11956206
    supporting_text: >-
      Membrane but not cytosolic fractions from HEK293 cells transiently
      transfected with a hCERK expression vector readily phosphorylated ceramide
  - reference_id: PMID:17392267
    supporting_text: >-
      Confocal microscopy, subcellular fractionation, and surface plasmon
      resonance analysis were used to further localize CERK to the trans-Golgi
      network
  - reference_id: PMID:23863933
    supporting_text: >-
      the only established pathway for C1P production is via phosphorylation of
      ceramide by CERK at the cytoplasmic surface of the trans-Golgi/TGN
proposed_new_terms: []
suggested_questions:
- question: >-
    Which stimuli shift endogenous human CERK between TGN and plasma-membrane
    pools, and how do those pools contribute quantitatively to cellular C1P?
- question: >-
    Does the CERK PH domain read a particular phosphoinositide at the TGN in
    vivo, and how is that input coordinated with CERT1-supplied ceramide?
suggested_experiments:
- description: >-
    Quantitatively rescue CERK knockout cells with PH-domain and CXXXCXXC
    localization mutants and measure TGN, plasma-membrane and whole-cell C16:0
    C1P by compartment-resolved lipidomics.
- description: >-
    Use endogenous CERK tagging with TGN, Golgi and plasma-membrane markers to
    compare CERK residence under resting, hyperosmotic and inflammatory
    agonist-stimulated conditions.
