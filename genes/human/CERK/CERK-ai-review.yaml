id: Q8TCT0
gene_symbol: CERK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CERK is a peripheral membrane lipid kinase that phosphorylates ceramide to
  ceramide 1-phosphate. It is recruited by its N-terminal pleckstrin homology
  domain to Golgi/TGN and plasma-membrane pools, uses Mg2+ as the preferred
  divalent cation in vitro, and selectively acts on ceramide rather than on
  sphingosine, diacylglycerol or phosphatidylinositol. At the trans-Golgi
  network, CERK uses ceramide supplied from the endoplasmic reticulum by CERT1
  to make C1P on the cytoplasmic leaflet, where C1P can activate cytosolic
  phospholipase A2-alpha and is transferred onward by CPTP.
