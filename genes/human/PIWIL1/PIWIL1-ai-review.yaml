id: Q96J94
gene_symbol: PIWIL1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIWIL1 (Piwi-like protein 1/HIWI) is a germline-specific Argonaute
  family protein that binds piRNAs (24-32nt) to form effector ribonucleoprotein
  complexes mediating transposon silencing and gene regulation in male germ
  cells. Essential for spermatogenesis, PIWIL1 possesses RNA endonuclease
  activity through its PIWI domain, localizes to cytoplasmic granules including
  chromatoid bodies, and is aberrantly expressed in various cancers as a
  cancer-testis antigen.
existing_annotations:
  - term:
      id: GO:0005634
      label: nucleus
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: Nuclear PIWIL1 has been reported in a subset of colorectal tumors.
      action: KEEP_AS_NON_CORE
      reason: PMID:28634417 reports both cytoplasmic and nuclear PIWIL1 immunostaining in 13 of 110 colorectal
        carcinomas. This peer-reviewed tissue evidence supports a context-dependent nuclear pool without
        making the nucleus the principal germline location. The IBA is an ancestral localization assertion,
        not an assertion that every PIWI protein is exclusively nuclear; cytoplasmic enrichment alone did
        not justify removal.
      supported_by:
      - reference_id: PMID:28634417
        supporting_text: a small proportion of PIWIL1 was also expressed in the nucleus
      propagation_review:
        root_cause: NO_FAILURE_NON_CORE
        source_entities:
        - source_id: PANTHER:PTN001875625
          source_label: PTN001875625
          source_status: SUPPORTS_TRANSFER
          comment: The broad Argonaute ancestral nuclear-localization assertion is compatible with the human
            tumor localization evidence; conservation of the germline nuclear role is not established.
  - term:
      id: GO:0031047
      label: regulatory ncRNA-mediated gene silencing
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: PIWIL1 binds piRNAs to mediate gene silencing, particularly of transposable elements. This
        is a core function supported by extensive literature showing PIWIL1-piRNA complexes silence transposons
        through post-transcriptional cleavage and directing DNA methylation. The IBA annotation is well-supported
        by phylogenetic evidence.
      action: ACCEPT
      reason: PIWIL1 is the piRNA-guided effector for transposon and mRNA regulation. Target cleavage and
        recruitment of mRNA-decay machinery provide direct post-transcriptional mechanisms; this broad silencing
        term does not require PIWIL1 itself to catalyze DNA methylation.
      supported_by:
      - reference_id: file:human/PIWIL1/PIWIL1-uniprot.txt
        supporting_text: Acts as an endoribonuclease that cleaves transposon messenger RNAs.
  - term:
      id: GO:0004521
      label: RNA endonuclease activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: PIWIL1 possesses RNA endonuclease ("slicer") activity through its PIWI domain, which contains
        a conserved DDH catalytic motif resembling RNase H. This activity cleaves target RNAs complementary
        to bound piRNAs and is essential for transposon transcript degradation.
      action: ACCEPT
      reason: PIWIL1 has conserved RNA endonuclease activity that cleaves guide-complementary targets. This
        molecular-function call does not imply that mammalian PIWIL1 executes a canonical ping-pong amplification
        cycle.
      supported_by:
      - reference_id: file:human/PIWIL1/PIWIL1-uniprot.txt
        supporting_text: Acts as an endoribonuclease that cleaves transposon messenger RNAs.
  - term:
      id: GO:0034587
      label: piRNA processing
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: PIWIL1 participates in primary piRNA processing.
      action: ACCEPT
      reason: The accepted primary piRNA processing annotations already establish participation in this
        parent process. A more specific annotation does not falsify a broader IBA, and piRNA binding is
        not a cross-aspect replacement for this biological process. The PAINT assertion at PTN002339693
        is compatible with the conserved PIWI contribution to piRNA biogenesis. PMID:38491008 describes
        MIWI recruitment to the intermitochondrial cement for piRNA processing followed by loading-dependent
        transfer to chromatoid bodies, providing ortholog mechanistic support beyond the annotation hierarchy.
      propagation_review:
        root_cause: NO_FAILURE_CORE
        source_entities:
        - source_id: PANTHER:PTN002339693
          source_label: PTN002339693
          source_status: SUPPORTS_TRANSFER
          comment: PIWI-clade piRNA processing is compatible with the separately accepted primary-processing
            annotations on PIWIL1.
      supported_by:
      - reference_id: PMID:38491008
        supporting_text: 'MIWI initially assembling in the

          IMC for piRNA processing'
  - term:
      id: GO:0007283
      label: spermatogenesis
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: PIWIL1 is essential for spermatogenesis in mammals. Human
        mutations cause azoospermia (absence of sperm), and mouse knockouts show
        spermatogenic arrest. The protein is highly expressed in spermatocytes
        and spermatids where it maintains genomic integrity and regulates
        histone-to-protamine exchange.
      action: ACCEPT
      reason: Core biological process for PIWIL1. Strong evidence from human
        genetics (mutations cause male infertility) and mouse models (Miwi
        knockout causes sterility). PIWIL1 is required for multiple stages of
        spermatogenesis including meiosis and spermiogenesis. This is a defining
        function of the protein.
      supported_by:
        - reference_id: PMID:28552346
          supporting_text: We report germline mutations in human Piwi (Hiwi) in
            patients with azoospermia that prevent its ubiquitination and
            degradation... genetic defects are directly responsible for male
            infertility
        - reference_id: file:human/PIWIL1/PIWIL1-deep-research.md
          supporting_text: PIWIL1 is essential for normal gamete development,
            especially in male meiosis and spermiogenesis. It is highly
            expressed in spermatocytes and round spermatids, and is required for
            the progression of spermatogenesis
        - reference_id: file:human/PIWIL1/PIWIL1-deep-research-falcon.md
          supporting_text: '**39 infertile men** were reported to carry
            biallelic variants across **14 piRNA pathway genes including
            PIWIL1**, and affected tissue showed **reduced pachytene piRNAs**
            and **LINE1 expression in spermatogonia** consistent with transposon
            de-repression, supporting the piRNA pathway (including PIWIL1) as a
            major axis of human male infertility biology'
