- question: How should ATP7A-dependent SOD3 copper loading map to the carrier-versus-transporter distinction in GO0016532/GO0140104?
- question: What are the exact donor experiments and conservation limits for rows4,47,49,85,89?
- question: What are the physiological abundance and compartment-specific functions of the short cytosolic and exon10-skipped ER products?
- question: Which original experiment supports the PMID:10419525 IDA link to GO:2000121 in GOA/GO-CAM69ea894900001492, and does that evidence linkage require clarification separately from the supported SOD3 findings in PMID:16371425?
suggested_experiments:
- description: Distinguish direct Cu(I) handoff to SOD3 from lumenal copper availability using matched transport-active/inactive ATP7A and copper-binding controls.
- description: Use isoform-discriminating endogenous localization and abundance assays for the short cytosolic and ER-localized alternative products.
