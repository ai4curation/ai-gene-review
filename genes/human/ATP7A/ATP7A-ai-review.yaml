id: Q04656
gene_symbol: ATP7A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP7A is an ATP-driven Cu(I)-transporting P-type ATPase that supplies copper to secretory-pathway cuproenzymes and promotes cellular copper export. It resides predominantly at the trans-Golgi network under basal conditions and undergoes copper-responsive cycling through vesicular compartments and the plasma membrane. Copper delivery supports the activity of enzymes involved in pigmentation, catecholamine metabolism and connective-tissue maintenance, as well as neuronal copper homeostasis.
