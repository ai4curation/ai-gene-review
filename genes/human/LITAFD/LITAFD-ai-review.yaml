core_functions:
- description: >-
    Zinc-stabilised LITAF domain that is predicted to insert monotopically into the
    cytoplasmic leaflet of membranes, as LITAF and CDIP1 do. All zinc ligands and the
    hydrophobic insertion segment are conserved. Its organelle and any downstream role
    are untested.
