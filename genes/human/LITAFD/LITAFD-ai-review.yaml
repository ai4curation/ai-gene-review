  review:
    summary: >-
      Inherited from mouse Litaf (the only donor) through PANTHER node PTN000591246.
      LITAFD itself has never been tested, it is expressed mainly in testis, and it lacks
      the LITAF N-terminal region.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor evidence concerns LITAF in LPS-stimulated macrophages, where LITAF was
      first described as a TNF-alpha transcription regulator. That context does not
      obviously carry over to a testis-enriched paralog that is only the membrane-binding
      LITAF domain. The family members that have been characterised biochemically (LITAF,
      CDIP1) act through membrane insertion at endosomes. Cytokine regulation by LITAF is
      a cell-type-specific downstream outcome, not an intrinsic property of the domain.
      LITAFD is a real, conserved gene, so the product probably exists. The term is not
      shown to be wrong, but nothing supports it beyond inheritance from one mouse gene.
    supported_by:
    - reference_id: file:human/LITAFD/LITAFD-bioinformatics/RESULTS.md
      supporting_text: LITAFD consists of the LITAF domain and nothing else.
