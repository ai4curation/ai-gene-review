proposed_new_terms: []
suggested_questions:
- question: >-
    Is LITAFD protein detectable in testis (for example in spermatogenic cells), and does
    it localise to late endosomes/lysosomes like LITAF and CDIP1, or to a germ-cell
    compartment such as the acrosome?
- question: >-
    Should the PANTHER nodes carrying LITAF-specific biology (nucleus at PTN008386299,
    regulation of cytokine production at PTN000591246) be narrowed so that they do not
    cover the domain-only LITAFD subfamily (PTHR23292:SF27)?
suggested_experiments:
- description: >-
    Express tagged LITAFD in cultured cells and in testis tissue sections, and
    co-stain with markers for early endosomes, late endosomes and lysosomes, alongside
    zinc-ligand (C7/C10/C59/C62) mutants. This would test whether membrane association
    depends on zinc as it does for LITAF.
- description: >-
    Use targeted proteomics or an antibody to confirm the endogenous protein in human
    testis, raising protein existence above homology inference.
