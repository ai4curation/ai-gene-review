- term:
    id: GO:0098560
    label: cytoplasmic side of late endosome membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN008386299
  - UniProtKB:Q99732
  - UniProtKB:Q9H305
  review:
    summary: >-
      A defensible inheritance of the family's monotopic endosomal topology, which the
      LITAF domain supplies. It has not been tested for LITAFD.
    action: KEEP_AS_NON_CORE
    reason: >-
      CDIP1 and LITAF localise to late endosomes and lysosomes with the LITAF domain on
      the cytoplasmic face. LITAFD keeps the zinc knuckles and the hydrophobic segment
      that drive this insertion, so the transfer is plausible. However, its subcellular
      localisation has never been examined, and the N-terminal regions of LITAF and CDIP1
      that LITAFD lacks may contribute to compartment selection. The specific organelle
      is therefore kept as non-core rather than accepted.
    supported_by:
    - reference_id: PMID:27582497
      supporting_text: epitope-tagged CDIP1 localised predominantly to CD63-positive late
        endosomes as well as to LAMP1-positive compartments
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN008386299
        source_label: PTN008386299
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Seeded by CDIP1 IDA and LITAF localisation data; the domain responsible for
          the topology is retained in the target, but compartment specificity untested.
