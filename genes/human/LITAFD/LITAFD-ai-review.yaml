          The node is seeded only by mouse Litaf, from macrophage/LPS biology. Placing it
          above the testis-enriched LITAFD subfamily (PTHR23292:SF27) extends a
          cell-type-specific outcome to a paralog that has the domain alone.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN008386299
