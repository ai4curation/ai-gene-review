  review:
    summary: >-
      Nuclear localisation inherited from LITAF and CDIP1. LITAFD is a membrane-insertion
      domain with no other sequence, and there is no evidence for a nuclear pool.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      LITAF and CDIP1 carry nuclear annotations, linked to the proposed
      transcription-factor role of LITAF and to CDIP1 as a p53 target. However, both
      proteins integrate monotopically into endosomal membranes through the LITAF domain,
      which faces the cytoplasm. LITAFD has nothing beyond that domain and no nuclear
      targeting sequence, and its localisation has not been studied. The same node
      (PTN008386299) correctly carries the endosomal and lysosomal membrane terms. The
      nuclear term is the weakest of the three for a domain-only paralog, so it is
      flagged rather than removed.
    supported_by:
    - reference_id: PMID:27582497
      supporting_text: The related human protein, CDIP1 (cell death involved p53 target
        1), displays identical membrane topology, suggesting that this mode of membrane
        integration is conserved in LITAF family proteins.
    - reference_id: file:human/LITAFD/LITAFD-bioinformatics/RESULTS.md
