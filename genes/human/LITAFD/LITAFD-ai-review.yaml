gene_symbol: LITAFD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LITAFD is a 72-residue protein that consists of a single LITAF (SIMPLE-like) domain,
  the conserved C-terminal domain of the CDIP1/LITAF family. It shares about 47% identity
  with the LITAF domain of LITAF and about 37% with that of CDIP1, but has none of the
  proline-rich N-terminal sequence of either. Both cysteine-rich zinc-knuckle motifs
  (CPYC and CPVC) and the intervening hydrophobic amphipathic segment are conserved. In
  LITAF and CDIP1 this arrangement forms a zinc-stabilised domain that inserts
  monotopically into the cytoplasmic leaflet of endosomal and lysosomal membranes. LITAFD
  is therefore expected to be a zinc-binding peripheral membrane protein. The gene is
  conserved across vertebrates and is expressed predominantly in testis. Protein
  existence is inferred from homology only, and nothing is known about its localisation,
  binding partners or biological role.
