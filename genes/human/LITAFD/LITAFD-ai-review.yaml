- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000591207
  - UniProtKB:Q99732
  review:
    summary: >-
      Sound inheritance. All four zinc-ligand cysteines of LITAF, in two CXXC knuckles,
      are conserved in LITAFD (C7, C10, C59, C62), and LITAF binds one zinc per molecule.
    action: ACCEPT
    reason: >-
      Zinc binding is an intrinsic property of the LITAF domain. LITAF has direct
      evidence (1 mol/mol zinc, and mutating the ligands disrupts membrane association).
      LITAFD sits inside the family, and every ligand position is retained. This is the
      clearest molecular property that can be assigned to LITAFD, although it has not
      been measured on the LITAFD protein itself.
    supported_by:
    - reference_id: PMID:27582497
      supporting_text: Recombinant LITAF contains 1 mol/mol zinc, while mutation of predicted
        zinc-binding residues disrupts LITAF membrane association.
