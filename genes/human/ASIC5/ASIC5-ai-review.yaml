id: Q9NY37
gene_symbol: ASIC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASIC5 (BASIC; also INaC/BLINaC) is a member of the DEG/ENaC family of trimeric cation channels,
  forming a third subgroup beside the ASICs and ENaC. It forms amiloride-sensitive, highly Na+-selective
  channels that are not opened by protons but are activated by bile acids such as chenodeoxycholic acid,
  possibly indirectly through effects on the membrane. In rat it localizes to cholangiocytes lining the
  bile ducts, reportedly in the apical membrane, and in human it is expressed mainly in the small intestine.
  In mouse brain it is restricted to type II unipolar brush cells of the vestibulocerebellum, where it
  supports intrinsic excitability; Asic5-null mice are ataxic.
