- id: PMID:20479219
  title: Ancient origin of the integrin-mediated adhesion and signaling machinery.
  findings:
  - statement: Talin, vinculin and paxillin scaffolds originated before animals.
    supporting_text: Many of the scaffolding proteins (talin, vinculin, paxillin) most likely evolved
      in the common ancestor of amoebozoans and opisthokonts, where they had ancestrally different functions
      (as in present day amoebozoans).
core_functions:
- description: Talin-activated actin filament binding that couples integrin-based cell-matrix adhesions
    (focal adhesions, costameres, podosomes) to the actin cytoskeleton. The tail F-actin site is masked
    by the head; talin vinculin-binding sites bind D1 and open the molecule, reinforcing the integrin-talin-actin
    linkage under tension. This mechanism is shared with sponge vinculin and is the ancestral vinculin
    function.
