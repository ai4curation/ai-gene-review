    supporting_text: Thus, binding of talin to Op vinculin D1 releases autoinhibition for F-actin binding,
      similar to the behavior of vertebrate vinculin.
  - statement: Sponge vinculin binds talin but not a beta-catenin peptide.
    supporting_text: Moreover, Op vinculin bound talin but not β-catenin
  - statement: Vinculin/alpha-catenin family proteins are present in close outgroups of animals.
    supporting_text: VIN proteins link actin filaments to membrane proteins at the plasma membrane and
      are found in all animals and their close outgroups (choanoflagellates, chytridomycetes, apusozoa,
      amoebozoa)
