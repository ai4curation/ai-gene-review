suggested_questions:
- question: Is vinculin binding to beta-catenin ancestral or a bilaterian innovation? Sponge vinculin
    did not bind a beta-catenin peptide, but that peptide covered the alpha-catenin-binding region rather
    than the beta-catenin N-terminus that human vinculin uses (A50/M8P interface). Does sponge or Capsaspora
    vinculin bind full-length beta-catenin of its own species?
- question: Is the beta-catenin binding IBA at PANTHER node PTN005285701 placed too deep? Donors include
    a Dictyostelium vinculin/alpha-catenin family member, whose beta-catenin (Aardvark) binding is an
    alpha-catenin-type activity; should the vinculin clade inherit it?
- question: Does Capsaspora vinculin bind Capsaspora talin and become activated for F-actin binding, as
    sponge vinculin does, and does it reach integrin beta2 through talin in filopodial adhesions?
- question: Should GO have a term for paxillin binding, given the well-characterized vinculin-paxillin
    interaction and its use across the integrin adhesome?
suggested_experiments:
- experiment_type: Binding assay
  description: Measure binding of recombinant Capsaspora and choanoflagellate vinculins to their own talin
    VBS peptides, alpha-catenin and full-length beta-catenin (ITC or pull-down), and test talin-dependent
    F-actin co-sedimentation, to map which interfaces predate animals.
- experiment_type: Genetic perturbation
  description: Knock out or knock down vinculin in Capsaspora and score filopodial substrate adhesion,
    integrin beta2 patch formation and aggregation, to test whether the ancestral role is substrate adhesion.
- experiment_type: Structure-function rescue
  description: In vinculin-null human epithelial cells, rescue with human vinculin carrying swapped sponge
