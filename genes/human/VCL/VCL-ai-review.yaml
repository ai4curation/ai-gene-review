    label: focal adhesion
  - id: GO:0043034
    label: costamere
  supported_by:
  - *id001
  - *id020
  - *id012
  - *id021
- description: Binding to talin, the activating partner at integrin adhesions. Talin VBS helices bind
    the vinculin D1 head by helical bundle conversion and displace the tail; multiple VBSs allow talin
    to recruit several vinculins. Conserved in sponge vinculin.
  molecular_function: *id003
  directly_involved_in:
