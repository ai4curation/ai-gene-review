- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IDA
  original_reference_id: PMID:7816144
  qualifier: enables
  negated: true
  review:
    summary: 'NOT actin binding: intact purified vinculin does not co-sediment with or crosslink F-actin
      because the head-tail interaction masks the tail F-actin site.'
    action: REMOVE
    reason: The same paper shows that the vinculin tail binds F-actin directly and that the site is cryptic,
      not absent, in the closed molecule. Activation by talin, alpha-actinin or pathogen VBS peptides
      exposes it, and actin binding is a core, conserved vinculin activity (also shown for sponge vinculin).
      A NOT annotation states that the gene product lacks the activity, which the paper itself contradicts;
      the autoinhibition is regulation, not absence of function.
    supported_by:
    - reference_id: PMID:7816144
      supporting_text: Vinculin itself neither cosediments with nor crosslinks F-actin.
    - &id020
      reference_id: PMID:7816144
      supporting_text: an intramolecular association between the 95K head and 30K tail domains of vinculin
        masks an F-actin binding site present in the carboxy-terminal tail domain
    - *id001
    - &id021
      reference_id: PMID:29880641
      supporting_text: Thus, binding of talin to Op vinculin D1 releases autoinhibition for F-actin binding,
        similar to the behavior of vertebrate vinculin.
