id: P18206
gene_symbol: VCL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Vinculin (VCL) is a cytoplasmic actin-binding adaptor of the vinculin/alpha-catenin family
  that couples adhesion complexes to the actin cytoskeleton at both cell-matrix and cell-cell contacts.
  It has a helical-bundle head (domains D1-D4), a proline-rich hinge and a tail that binds actin filaments.
  In the resting molecule the head binds the tail and masks the F-actin site; binding of talin vinculin-binding
  sites (or of alpha-actinin, alpha-catenin, or bacterial talin mimics such as Shigella IpaA) to the D1
  domain opens the molecule so that the tail can engage actin. At integrin-based focal adhesions, podosomes
  and muscle costameres, talin-activated vinculin reinforces the integrin-talin-actin linkage under actomyosin
  tension, regulates adhesion growth and turnover, and restrains cell migration; its hinge recruits the
  Arp2/3 complex and SH3-domain adaptors such as vinexin and CAP/ponsin. At cadherin-based adherens junctions
  it binds alpha-catenin and beta-catenin, stabilizes E-cadherin at the cell surface, and is needed for
  assembly of the apical junctional complex; in endothelium it shifts between focal adhesions and VE-cadherin
  junctions according to local tension. A muscle-specific splice isoform, metavinculin, carries a tail
  insert, and VCL variants cause dilated and hypertrophic cardiomyopathy. The vinculin/alpha-catenin family
  predates animals: a vinculin ortholog in the unicellular holozoan Capsaspora localizes with integrin
  in adhesive filopodia, and sponge vinculin binds talin and is activated by it for F-actin binding, indicating
  that talin-activated actin coupling at cell-substrate contacts is ancestral, whereas the catenin links
  to cadherin junctions are best documented in bilaterians.'
