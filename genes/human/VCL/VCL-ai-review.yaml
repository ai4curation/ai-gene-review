  qualifier: involved_in
  review:
    summary: Vinculin knockdown/rescue in MCF10A mammary epithelial cells altered cell shape (loss of
      honeycomb morphology) and reduced cadherin-dependent adhesion by lowering surface E-cadherin.
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype is a change in cell morphology and cell-cell adhesion in a cultured monolayer,
