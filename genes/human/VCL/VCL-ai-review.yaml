  - *id024
- description: Binding to alpha-catenin and beta-catenin at cadherin-based adherens junctions, linking
    the cadherin-catenin complex to actin. Vinculin binding to the beta-catenin N-terminus stabilizes
    E-cadherin at the surface, and the alphaE-catenin-vinculin interaction organizes the apical junctional
    complex. Best documented in vertebrates; whether the catenin interfaces are ancestral is unresolved.
  molecular_function:
