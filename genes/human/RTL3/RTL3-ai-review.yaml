      Whether RTL3 binds DNA or RNA directly (and its sequence targets), and whether it
      acts as a direct transcription factor or through SOX9, are undetermined for the
      human protein.
    gap_kind:
    - BIOLOGY
proposed_new_terms: []
suggested_questions:
- question: >-
    Does RTL3 regulate SOX9/COL2A1 by binding DNA regulatory elements directly, by binding
    RNA, or indirectly through SOX9 protein, and what are its nucleic-acid targets
    (ChIP-seq/CLIP-seq)?
- question: >-
    Does the human RTL3 CCHC zinc knuckle coordinate zinc and bind nucleic acid in vitro,
    and is this activity abolished by Cys/His-to-Ala substitutions?
suggested_experiments:
- hypothesis: >-
    RTL3 acts as a nucleic-acid-binding gene-regulatory factor whose activity requires a
    functional CCHC zinc knuckle.
  description: >-
    Express recombinant RTL3 (or its CA-NC fragment) and test zinc-dependent nucleic-acid
    binding by EMSA/fluorescence anisotropy with wild-type versus CCHC Cys/His-to-Ala
    mutants; in parallel test whether the same mutants fail to rescue SOX9/COL2A1
    expression in RTL3-depleted chondrocytes.
- hypothesis: >-
    RTL3 is physiologically required for cartilage development and homeostasis.
  description: >-
    Characterise skeletal/cartilage phenotypes in Rtl3/Zcchc5-knockout mice and in RTL3
    loss-of-function human chondrocyte models, including COL2A1/SOX9 expression and matrix
    assays, and relate RTL3 loss to osteoarthritis.
