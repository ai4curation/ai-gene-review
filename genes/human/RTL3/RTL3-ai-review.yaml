- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001878
  - InterPro:IPR036875
  review:
    summary: >-
      InterPro2GO mapping from the CCHC zinc knuckle; the three conserved Cys and one His
      (C-x2-C-x4-H-x4-C) coordinate a structural zinc ion.
    action: ACCEPT
    reason: >-
      The CCHC knuckle is a bona fide zinc-coordinating module; the motif is present and
      conserved in RTL3 (human C-LYCGYPGHFARDC; mouse near-identical), so zinc binding is
      a sound structural inference. Accepted as a supporting molecular-function term.
    supported_by:
    - reference_id: PMID:16093683
      supporting_text: >-
        In addition, three Mar proteins have conserved the Gag CCHC zinc finger motif,
        suggesting a role in nucleic acid binding.
- term:
    id: GO:0032332
    label: positive regulation of chondrocyte differentiation
  evidence_type: IMP
  original_reference_id: PMID:33043724
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. In human chondrocytes RTL3 is required for SOX9 and COL2A1
      expression and matrix synthesis; siRNA knockdown reduces SOX9/COL2A1, and
      CRISPR Rtl3-null ATDC5 cells show impaired chondrogenic differentiation and reduced
      matrix deposition.
    action: NEW
    reason: >-
      RTL3 itself performs part of this process: it acts as a nuclear gene-regulatory
      factor (via its CCHC knuckle) that promotes the SOX9->COL2A1 chondrogenic program,
      so it participates rather than merely being required. The effect is direct and
      bidirectional (loss- and gain-of-function), and GOA has no biological-process term
      for RTL3. This captures the one experimentally demonstrated physiological role of
      the human protein.
    supported_by:
    - reference_id: PMID:33043724
      supporting_text: >-
        Loss-of-function and gain-of-function studies demonstrated a critical role of RTL3
        in the regulation of SOX-9 and COL2A1 expression and matrix synthesis during
        chondrogenesis.
    - reference_id: PMID:33043724
      supporting_text: >-
        ATDC5Rlt3−/− chondrocytes demonstrated a noticeable reduction in matrix deposition
        (Figure 7B, 7C) and impaired chondrogenic differentiation at each time point
        analyzed
- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:33043724
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. RTL3 depletion reduces the activity of a COL2A1 promoter
      reporter, and RTL3 is required for SOX9 and COL2A1 transcription in chondrocytes,
      indicating a role in positive transcriptional regulation.
    action: NEW
    reason: >-
      RTL3 is a nuclear CCHC protein that up-regulates SOX9 and COL2A1 mRNA; the effect
      on a COL2A1 promoter-reporter places the activity at the transcriptional level, and
      the molecular machinery it influences is RNA polymerase II transcription of these
      genes. RTL3 contributes the regulatory input (it is not merely required), satisfying
      participation. Conservatively proposed; whether RTL3 binds DNA directly or acts
      through SOX9 is unresolved.
    supported_by:
    - reference_id: PMID:33043724
      supporting_text: >-
        siRNA-mediated depletion of RTL3 in chondrocytes resulted in a significant reduction
        in COL2A1 promoter reporter activity suggesting that depletion of RTL3 affects
        COL2A1 expression at the transcriptional level
