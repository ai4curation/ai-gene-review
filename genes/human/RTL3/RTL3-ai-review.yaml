id: Q8N8U3
gene_symbol: RTL3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RTL3 (retrotransposon Gag-like protein 3; also ZCCHC5, MAR3/MART3) is an X-linked
  (Xq21.1) eutherian gene domesticated from the gag region of a Ty3/gypsy
  sushi-ichi-related LTR retrotransposon. The 475-residue protein has a largely
  disordered N-terminal half, a retroviral capsid (CA)-like domain and a single
  C-terminal CCHC-type zinc knuckle (C-x2-C-x4-H-x4-C) of the nucleocapsid type; it
  has no reverse transcriptase or integrase, and the aspartyl protease-like region
  that the ancestral element encoded in the -1 frame lies in a separate ORF in human,
  so the annotated human protein is non-catalytic. In human articular chondrocytes
  RTL3 is expressed in cartilage and synoviocytes, and loss- and gain-of-function
  experiments show it is needed for SOX9 and type II collagen (COL2A1) expression and
  cartilage matrix synthesis; this gene-regulatory activity requires the zinc knuckle,
  and RTL3 expression is reduced in osteoarthritic cartilage. Its mouse ortholog Zcchc5
  is expressed in fetal muscle progenitors and its overexpression restrains
  satellite-cell self-renewal. The protein is nuclear, consistent with a role as a
  nucleic-acid-binding gene-regulatory factor, although its direct DNA or RNA targets
  are unknown.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001878
  - InterPro:IPR036875
  review:
    summary: >-
      InterPro2GO mapping from the retroviral-type CCHC zinc knuckle
      (IPR001878/IPR036875). RTL3 retains an intact nucleocapsid-type
      C-x2-C-x4-H-x4-C knuckle (residues 443-462) whose removal abolishes RTL3's
      gene-regulatory activity in chondrocytes.
    action: ACCEPT
    reason: >-
      The zinc knuckle is the canonical nucleic-acid-binding module of retroviral and
      retrotransposon Gag nucleocapsids, was flagged as such when the Mar family was
      defined, and is the domain experimentally required for RTL3 function (a mutant
      lacking it loses activity). Direct binding to DNA or RNA has not been measured
      for RTL3, so the general term is as specific as the evidence allows; no DNA-vs-RNA
      child term can be chosen. Retained as the best available statement of RTL3's
      molecular activity.
    supported_by:
    - reference_id: PMID:16093683
      supporting_text: >-
        In addition, three Mar proteins have conserved the Gag CCHC zinc finger motif,
        suggesting a role in nucleic acid binding.
    - reference_id: PMID:33043724
      supporting_text: >-
        Gene regulatory activity of RTL3 requires the c-terminal CCHC zinc-finger binding
        domain.
    - reference_id: file:human/RTL3/RTL3-deep-research-openscientist.md
      supporting_text: >-
        three Mar proteins have conserved the Gag CCHC zinc finger motif, suggesting a
        role in nucleic acid binding
