core_functions:
- description: >-
    Nuclear nucleic-acid-binding gene-regulatory factor that, through its retroviral-type
    C-terminal CCHC zinc knuckle, promotes the SOX9->COL2A1 chondrogenic program and
    cartilage extracellular-matrix synthesis in chondrocytes.
