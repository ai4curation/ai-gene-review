      supporting_text: CFAP91, which begins at the base of RS2, interacts with the N-DRC
- term:
    id: GO:0003341
    label: cilium movement
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A8IH47
  review:
    summary: >-
      Transferred from Chlamydomonas FAP91. CSC loss impairs motility in Chlamydomonas,
      Tetrahymena CFAP91 knockouts beat in an uncoordinated manner at reduced frequency,
      and Trypanosoma TbCFAP91 knockdown impairs flagellar movement.
    action: ACCEPT
    reason: >-
      Consistent evidence across three organisms that CFAP91 is part of the axonemal
      machinery that produces and regulates ciliary beating: the CSC mediates regulatory
      signals from the radial spokes to the dynein arms and anti-FAP91 antibodies alter
      dynein-driven sliding (PMID:17967944); Tetrahymena knockouts swim about a hundred times
      slower (PMID:36552811); TbCFAP91 knockdown impairs flagellar movement (PMID:32161152).
      This row covers motile cilia generally, beyond sperm.
    supported_by:
    - reference_id: PMID:17967944
      supporting_text: In a microtubule sliding assay, the addition of antibodies generated against FAP91 to mutant axonemes with reduced dynein activity restores dynein activity to wild-type levels
    - reference_id: PMID:36552811
      supporting_text: CFAP91-KO cells swam about a hundred times slower than wild-type cells
    - reference_id: PMID:32161152
      supporting_text: Knockdown of TbCFAP91 using RNAi impaired flagellar movement led to CPC defects in Trypanosoma as observed in humans
