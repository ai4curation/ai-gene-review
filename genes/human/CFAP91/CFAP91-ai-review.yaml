core_functions:
- description: >-
    Central structural subunit of the calmodulin- and spoke-associated complex that spans
    the bases of radial spokes 2 and 3 on axonemal doublet microtubules, binding the RS3
    base subunits CFAP251 and CFAP61 and the spoke-base protein RSP3; it scaffolds radial
    spoke 3 assembly and relays regulatory signals from the spokes to the dynein arms,
    supporting normal beating of motile cilia and formation of the sperm flagellum. The
    accepted cilium movement annotation (Chlamydomonas, Tetrahymena and Trypanosoma
    evidence) is not listed separately because sperm flagellum assembly entails it:
    GO:0120316 is part_of flagellated sperm motility, which is_a cilium movement involved
    in cell motility, which is_a cilium movement. CFAP91 also extends into the base of
    radial spoke 2 (GO:0120341 radial spoke base 2, proposed in the radial spoke stalk
    MODIFY row); because in_complex holds a single term and radial spoke base terms are
    protein-containing complexes rather than locations, the RS3 base, where its
    scaffolding role in spoke assembly is documented, is recorded here.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
