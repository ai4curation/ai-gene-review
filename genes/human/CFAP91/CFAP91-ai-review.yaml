    label: radial spoke stalk
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: colocalizes_with
  supporting_entities:
  - UniProtKB:A8IH47
  review:
    summary: >-
      Transferred from Chlamydomonas FAP91 (A8IH47) with a colocalizes_with qualifier.
      FAP91 binds the spoke-base protein RSP3, and CFAP91 is located at the bases of RS2 and
      RS3 rather than in a spoke stalk.
    action: MODIFY
    reason: >-
      The claim that CFAP91 sits with the radial spokes is sound, but the location is the
      spoke base. Chlamydomonas FAP91 binds RSP3 at the base of the spoke (PMID:17967944);
      Tetrahymena Cfap91 localizes at the base of RS2 and RS3 (PMID:36552811); in the human
      axoneme CFAP91 begins at the RS2 base and links the RS3 base subunits
      (PMID:37258679). GO:0120341 radial spoke base 2 and GO:0120342 radial spoke base 3
      (both part_of a radial spoke, not of the stalk) state this directly; both are listed
      because CFAP91 spans the two bases. This is a lateral correction, not a refinement of
      the stalk term.
    proposed_replacement_terms:
    - id: GO:0120341
      label: radial spoke base 2
    - id: GO:0120342
      label: radial spoke base 3
    supported_by:
    - reference_id: PMID:17967944
      supporting_text: FAP91 directly interacts with radial spoke protein 3 (an AKAP), which is located at the base of the spoke
    - reference_id: PMID:36552811
      supporting_text: Tetrahymena Cfap91 localizes at the base of radial spokes RS2 and RS3 and likely plays a role in the radial spoke(s) positioning and stability
