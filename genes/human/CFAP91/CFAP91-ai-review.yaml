  - reference_id: PMID:40931011
    supporting_text: Cfap91 knockout (KO) mice exhibit impaired sperm flagellum formation and male infertility
proposed_new_terms:
- proposed_name: calmodulin- and spoke-associated complex
  proposed_definition: >-
    A protein complex located at the bases of radial spokes 2 and 3 on the A tubule of
    axonemal outer doublet microtubules of motile cilia and flagella, composed of CFAP91
    (FAP91/CaM-IP2), CFAP61 (FAP61/CaM-IP3) and CFAP251 (FAP251/CaM-IP4), that binds
    calmodulin and connects radial spokes 2 and 3 with the nexin-dynein regulatory
    complex.
  justification: >-
    The CSC is a defined three-subunit complex conserved from Chlamydomonas to human, but
    an OLS search of GO (2026-10-16; queries "calmodulin and spoke associated complex",
    "calmodulin- and spoke-associated complex", "CSC complex", "spoke-associated",
    "calmodulin complex") found no term for it; the nearest terms are the location terms
    GO:0120341 radial spoke base 2 and GO:0120342 radial spoke base 3. A complex term
    would let CFAP91, CFAP251 and CFAP61 carry in_complex. The same term is proposed in
    the CFAP61 and CFAP251 reviews. The parent given is protein-containing complex; the
    complex would also be part_of the axoneme.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  supported_by:
  - reference_id: PMID:17967944
    supporting_text: the CaM-IP2, -IP3, and -IP4 complex is associated with and localizes to the base of the radial spokes
  - reference_id: PMID:17967944
    supporting_text: BLAST searches reveal that CaM-IP2 (FAP91) is most similar to the human homologue of AAT-1
  - reference_id: PMID:22740634
    supporting_text: 'the CSC connects three major axonemal complexes involved in dynein regulation: RS2, the nexin-dynein regulatory complex (N-DRC), and RS3S'
suggested_questions:
- question: >-
    Do the short CFAP91 isoforms (AAT-1alpha, AAT-1S) that bind MYCBP/AMY-1 and AKAP1 have an
    endogenous, non-axonemal role (for example at mitochondria in spermatids or Leydig
    cells), or are these interactions overexpression artefacts?
- question: >-
    Is GO:0005200 structural constituent of cytoskeleton the right molecular function for
    non-catalytic axonemal scaffold subunits such as the CSC proteins, given that comparable
    proteins (LRRC23, CCDC39, CFAP61) currently carry no informative MF in GOA?
- question: >-
    Why is CFAP91 essential for sperm flagellum formation in mouse and human, while airway
    and ependymal cilia of Cfap91 knockout mice elongate normally? Is airway ciliary beating
    or RS3 occupancy affected?
suggested_experiments:
- hypothesis: >-
    Endogenous CFAP91 short isoforms are not mitochondrial in male germ cells.
  description: >-
    Use isoform-specific antibodies or endogenously tagged knock-in mice to localize the
    CFAP91 isoforms in spermatids, mature sperm and Leydig cells, combining
    immunofluorescence with mitochondrial markers and immuno-electron microscopy.
  experiment_type: localization
- hypothesis: >-
    CFAP91 loss removes RS3 and destabilizes the RS2 base in mammalian airway cilia, altering
    ciliary waveform despite normal ciliary length.
  description: >-
    Cryo-electron tomography with subtomogram averaging of tracheal cilia from Cfap91
    knockout mice, plus high-speed video analysis of ciliary beat frequency and waveform.
  experiment_type: structural biology / ciliary physiology
