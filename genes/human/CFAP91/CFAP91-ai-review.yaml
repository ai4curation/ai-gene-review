id: Q7Z4T9
gene_symbol: CFAP91
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFAP91 (cilia- and flagella-associated protein 91; also known as MAATS1 and AAT-1) is an
  axonemal protein of motile cilia and sperm flagella and the central subunit of the
  calmodulin- and spoke-associated complex (CSC) with CFAP61 and CFAP251. In the human
  respiratory axoneme it runs from the base of radial spoke 2 (RS2), contacts the
  nexin-dynein regulatory complex, and links the RS3 base subunits CFAP251 and CFAP61. The
  Chlamydomonas ortholog FAP91 binds the radial spoke base protein RSP3, and the CSC relays
  calcium/calmodulin-dependent regulatory signals from the radial spokes to the dynein
  arms. Loss of CFAP91 destabilizes the RS3 and RS2 bases and adjacent inner dynein arms in
  Tetrahymena, and in mouse sperm it is required for flagellar localization of the RS3
  proteins CFAP251 and LRRC23, acting as a scaffold for RS3 assembly. Biallelic variants
  cause spermatogenic failure 51, with multiple morphological abnormalities of the sperm
  flagellum, radial spoke and central pair defects, and male infertility; Cfap91 knockout
  mice are infertile with defective sperm flagellum formation, whereas their airway and
  ependymal cilia elongate normally. Alternative promoters and splicing produce several
  isoforms; some short isoforms, first described as AMY-1 (MYCBP)-binding partners that
  associate with AKAP1 and PKA, localize to the cytoplasm or mitochondria when expressed in
  somatic cell lines.
