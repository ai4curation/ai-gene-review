  - UniProtKB:P0DTC9
  review:
    summary: >-
      SARS-CoV-2 nucleoprotein recovered with PABPC1 in a comprehensive SARS-CoV-2-human
      interactome.
    action: REMOVE
    reason: >-
      Uninformative generic term. Host-virus interactions of PABPC1 are extensive and are
      summarised in UniProt's account of how viruses cleave, sequester or relocalise it;
      where one of them has a functional consequence for the gene, this review states it as
      a process row rather than as a bare binding row.
