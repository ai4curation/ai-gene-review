proposed_new_terms:
- proposed_name: PAM2 motif binding
  proposed_definition: >-
    Binding to a PABP-interacting motif 2 (PAM2), a short linear motif of about twelve to
    fifteen residues that docks as a pair of beta-turns into the peptide-binding groove of
    an MLLE/PABC domain.
  justification: >-
    Ninety-seven of this gene's 167 GOA rows are bare GO:0005515 protein binding, and a
    large share of them are the same molecular event: a PAM2 motif docking into the
    MLLE/PABC pocket of PABPC1. The clients include PAIP1, PAIP2, PAIP2B, the release
    factors GSPT1 and GSPT2, LARP1, LARP4, LARP4B, ataxin-2, HELZ, PAN3, TOB1, TOB2 and the
    GW182 proteins TNRC6A-C, and the recognition mode is structurally characterised for
    several of them. GO already carries region-level and motif-level binding terms such as
    GO:0070064 proline-rich region binding, so a PAM2 motif binding child of protein binding
    would let this class of rows be stated informatively instead of being removed as
    uninformative. It would also be usable on the other side of the interaction, since
    MLLE/PABC domains occur outside the PABP family (for example in the HECT E3 ligase where
    the domain was co-discovered).
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:14685257
    supporting_text: >-
      the PABC domain of PABP functions to recruit several translation factors possessing
      the PABP-interacting motif 2 (PAM2) to the mRNA poly(A) tail
    full_text_unavailable: true
  - reference_id: file:genes/human/PABPC1/PABPC1-uniprot.txt
    record_section: ["CC:DOMAIN"]
    supporting_text: >-
      The RNA-binding domains RRM1 and RRM2 and the C-terminus (last 138 amino acids)
      regions interact with the PABPC1-interacting motif-1 (PAM1) and -2 (PAM2) of PAIP1
  - reference_id: PMID:21063388
    supporting_text: >-
      a single amino acid substitution in the TNRC6A-C PAM2 motif abolishes the interaction
      with PABPC1. This mutation also impairs TNRC6s silencing activity
knowledge_gaps:
- gap_statement: >-
    It is not known what determines whether PABPC1 bound to a given mRNA licenses
    deadenylation or protects the tail from it.
  boundary: >-
    Both activities are established. PABPC1 recruits PAN3 and the Tob/CCR4-NOT deadenylases
    through its MLLE surface, and the positive-regulation annotations transferred from the
    ortholog rest on that; at the same time PABPC1 antagonises TUT4/TUT7 uridylation of
    polyadenylated mRNA and, in the mCRD bridging complex, impedes deadenylation outright.
    What is missing is the variable that selects between them -- tail length, PABPC1
    occupancy, the identity of the PAM2 client occupying the MLLE pocket, or a modification
    of PABPC1 itself. No experiment has varied one of these while reading out both outcomes
    on the same transcript.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The answer decides whether the opposite-sign deadenylation annotations on this gene
    describe two regulated states of one activity or two separable activities, and therefore
    whether they should be modelled as one node with context or as distinct functions.
  resolution: >-
    Reconstitute deadenylation on substrates of defined tail length with purified PAN2-PAN3,
    CCR4-NOT, TUT4/7 and PABPC1, titrating PABPC1 occupancy and adding each PAM2 client in
    turn, and read out both trimming rate and uridylation from the same reactions.
  provenance:
  - reference_id: PMID:25480299
    supporting_text: >-
      PABPC1 antagonizes uridylation of polyadenylated mRNAs, contributing to the
      specificity for short A-tails
  - reference_id: PMID:11051545
    supporting_text: >-
      Overexpression of these proteins stabilized mCRD-containing mRNA by impeding
      deadenylation
    full_text_unavailable: true
  - reference_id: file:genes/human/PABPC1/PABPC1-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: >-
      Interacts with PAN3 isoform 1/Pan3L and isoform 3/Pan3S (via N-terminus)
- gap_statement: >-
    Whether PABPC1 does any work inside a stress granule, or is simply carried into it on
    silenced mRNP, is unresolved.
  boundary: >-
    PABPC1 is the canonical stress-granule marker and its recruitment is mechanistically
    dependent on DDX3X, whose depletion blocks granule assembly and leaves PABPC1 in the
    nucleus. But granules are sites of translational silencing, so the activity PABPC1 is
    known for cannot be what it is doing there, and no granule-specific activity has been
    assigned to it. The PANTHER row that qualifies the granule location is_active_in asserts
    exactly the thing that has not been shown.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A stress-granule project needs to know whether PABPC1 is a structural contributor to the
    condensate, like the G3BP paralogs it binds, or a passenger whose presence only reports
    that polyadenylated mRNA is there. The two readings imply different module roles and
    different annotation qualifiers.
  resolution: >-
    Test granule assembly in cells depleted of PABPC1 and rescued with
    separation-of-function mutants -- poly(A)-binding-deficient RRM variants and MLLE
    variants that cannot dock PAM2 clients -- scoring condensate number, size and recovery
    kinetics rather than endpoint counts, and ask in parallel whether PABPC1 is required for
    the G3BP1/G3BP2-driven assembly step or only for granule mRNA content.
  provenance:
  - reference_id: PMID:21883093
    supporting_text: >-
      We established various stimuli as novel stressors that direct DDX3 with eIF4E and
      PABP1 into SGs, but not to processing bodies
    full_text_unavailable: true
  - reference_id: PMID:21883093
    supporting_text: >-
      down-regulation of DDX3 interfered with SG assembly, led to nuclear accumulation of
      PABP1 and reduced cell viability following stress
    full_text_unavailable: true
  - reference_id: PMID:21883093
    supporting_text: >-
      SGs (stress granules) aid cell survival by serving as sites of translational silencing
    full_text_unavailable: true
  - reference_id: file:genes/human/PABPC1/PABPC1-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: >-
      Interacts with G3BP1 and G3BP2
suggested_questions:
- question: >-
    Should GO acquire a PAM2 motif binding term? Close to sixty of this gene's generic
    protein-binding rows describe one structurally defined event, and there is no
    informative molecular function available to replace them with.
- question: >-
    Is is_active_in the right qualifier for a protein whose annotated location is the
    cytoplasmic stress granule, when stress granules are defined as sites of translational
    silencing? Several family members carry the same inherited qualifier.
- question: >-
    How should a gene that both impedes and promotes poly(A) tail shortening be represented?
    PABPC1 carries opposite-sign deadenylation annotations that are each well supported, and
    removing either would misstate the biology.
- question: >-
    Does PABPC1 belong in a stress-granule module as a core part or as an associated marker?
    It binds both G3BP paralogs and CAPRIN1's partner DDX3X, but no granule-specific
    activity has been demonstrated for it.
suggested_experiments:
- description: >-
    Map the positional dependence of NMD suppression quantitatively: insert a tethering site
    at defined distances from a reporter's termination codon, tether PABPC1 or
    MLLE-binding-deficient PABPC1 at each position, and measure both reporter decay and eRF3
    occupancy by crosslinking.
  hypothesis: >-
    PABPC1 antagonises NMD only within a defined distance of the stop codon, and the eRF3
    contact through its C-terminal 39 residues is necessary for the effect at every
    position.
  experiment_type: reporter tethering with crosslinking readout
- description: >-
    Separate the two sides of PABPC1's deadenylation relationship in vitro: reconstitute
    trimming of substrates with 20, 50 and 150 adenosines using purified PAN2-PAN3 and
    CCR4-NOT, with and without TUT4/7, across a PABPC1 titration and in the presence of each
    PAM2 client in turn.
  hypothesis: >-
    PABPC1 occupancy, not partner identity, is the variable that switches between licensing
    tail shortening and protecting the tail, with protection dominating once the tail is
    long enough to be fully coated.
  experiment_type: reconstituted biochemistry
- description: >-
    Ask whether PABPC1 contributes structurally to stress granules by rescuing
    PABPC1-depleted cells with RRM and MLLE separation-of-function mutants and scoring
    granule assembly kinetics alongside G3BP1/G3BP2 recruitment and granule mRNA content.
  hypothesis: >-
    PABPC1 is recruited to granules as a passenger on silenced polyadenylated mRNP and is
    dispensable for the G3BP-driven condensation step, so RRM mutants will fail to enter
    granules without reducing their number.
  experiment_type: rescue imaging with separation-of-function mutants
