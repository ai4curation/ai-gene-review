- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: IC
  original_reference_id: PMID:11991638
  qualifier: involved_in
  supporting_entities:
  - GO:0071013
  review:
    summary: >-
      Curator inference from PABPC1's detection in a purified native spliceosomal C complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only input to this inference is the companion cellular-component row: PABPC1 was
      seen by mass spectrometry in affinity-purified C complex. Nothing in that work, or
      anywhere else I could find, assays a contribution of PABPC1 to splice-site choice,
      catalysis or splicing efficiency, and the paper's own validation list names the
      second-step factors rather than PABPC1. The protein is cytoplasmic at steady state and
      reaches the nucleus only when mRNA export is blocked, so an abundant
      poly(A)-tail-binding protein co-purifying with a spliceosome assembled on a
      polyadenylated substrate is the expected passenger. The term is not flatly wrong --
      PABPC1 does shuttle and does bind pre-mRNA poly(A) -- but asserting participation in
      splicing overstates what was shown.
    supported_by:
    - reference_id: PMID:11991638
      supporting_text: >-
        Analysis by tandem mass spectrometry confirmed the presence of core snRNP proteins
        (SM and LSM), U2 and U5 snRNP-specific proteins, and the second step factors Prp16,
        Prp17, Slu7, and Prp22
      full_text_unavailable: true
    - reference_id: PMID:7908267
      supporting_text: >-
        confocal immunofluorescence microscopy with these antibodies reveals that it is
        localized exclusively to the cytoplasm
      full_text_unavailable: true
    - reference_id: PMID:21940797
      supporting_text: >-
        perturbations that block mRNA export recapitulate PABP relocalisation
