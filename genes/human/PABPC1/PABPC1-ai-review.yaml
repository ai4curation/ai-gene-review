- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:20573744
  qualifier: located_in
  review:
    summary: >-
      Cytoplasmic localisation of PABPC1 recorded from a study of LARP4B's stimulatory role
      in translation.
    action: TOO_GENERAL
    reason: >-
      Cytoplasm is true but imprecise on its own: it covers the cytosol, every cytoplasmic
      organelle and the granules, and this review asserts the specific compartments the
      protein actually occupies -- cytosol, cytoplasmic stress granule and cytoplasmic
      ribonucleoprotein granule -- each of which entails this term. Judging the term, not
      the evidence: the observation behind each of these rows is sound.
    supported_by:
    - reference_id: PMID:7908267
      supporting_text: >-
        confocal immunofluorescence microscopy with these antibodies reveals that it is
        localized exclusively to the cytoplasm
      full_text_unavailable: true
    - reference_id: PMID:21940797
      supporting_text: >-
        generally a diffuse cytoplasmic protein, it can be found in discrete foci such as
        stress and neuronal granules
