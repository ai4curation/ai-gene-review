- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:18799579
  qualifier: located_in
  review:
    summary: >-
      PABPC1 accumulates in the nucleus of rotavirus-infected cells after NSP3 evicts it
      from eIF4G.
    action: KEEP_AS_NON_CORE
    reason: >-
      Nuclear localisation of PABPC1 is real but conditional, which is why these rows are
      kept without being treated as a site of function. At steady state the protein is
      cytoplasmic; it accumulates in the nucleus when transcription is inhibited, when mRNA
      export is blocked, after UV, and when a viral protein evicts it from eIF4G -- and the
      mechanism established for that accumulation is loss of ongoing mRNA export rather than
      a nuclear job. Nothing assigns PABPC1 an activity that is executed in the nucleus.
    supported_by:
    - reference_id: PMID:18799579
      supporting_text: >-
        We show here that PABP-C1 evicted from eIF4G by NSP3 accumulates in the nucleus of
        rotavirus-infected cells
      full_text_unavailable: true
    - reference_id: PMID:18799579
      supporting_text: >-
        By evicting cytoplasmic poly(A) binding protein (PABP-C1) from translation
        initiation complexes, NSP3 shuts off the translation of cellular polyadenylated
        mRNAs
      full_text_unavailable: true
    - reference_id: PMID:7908267
      supporting_text: >-
        confocal immunofluorescence microscopy with these antibodies reveals that it is
        localized exclusively to the cytoplasm
      full_text_unavailable: true
