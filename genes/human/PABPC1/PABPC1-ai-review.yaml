- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11051545
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9H074
  review:
    summary: >-
      PAIP1 recovered with PABPC1 in the c-fos mCRD bridging-complex purification.
    action: REMOVE
    reason: >-
      Bare protein binding carries no functional information. This interaction is one of the
      PAM2-motif contacts made by the MLLE/PABC peptide-binding domain, whose shared
      activity is to recruit PAM2-bearing factors to the poly(A) tail; the functional
      content sits on the terms that say what each recruitment achieves -- translation
      activation, NMD antagonism, deadenylation, silencing. Removing the generic row does
      not question the interaction, which is structurally characterised. This review
      proposes a PAM2 motif binding term so that this large class of rows can be stated
      informatively.
