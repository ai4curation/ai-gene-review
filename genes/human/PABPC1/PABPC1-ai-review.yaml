core_functions:
- description: >-
    Poly(A)-dependent activation of translation initiation: PABPC1 coats the 3' poly(A) tail
    through its four RRMs and presents RRM2 to eIF4G in the cap-binding eIF4F complex,
    joining the two ends of the message into a closed loop that stimulates initiation.
    Poly(A) binding and eIF4G binding are allosterically coupled, so the activity is
    contingent on an intact tail, and it is the step that PAIP1 enhances and PAIP2/PAIP2B
    suppress by displacing the protein from poly(A). This is the activity whose disruption
    by MLLE-domain missense variants causes developmental delay.
