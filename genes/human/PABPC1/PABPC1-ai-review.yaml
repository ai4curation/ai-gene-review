id: P11940
gene_symbol: PABPC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PABPC1 is the major cytoplasmic poly(A)-binding protein of human cells and one of its most
  abundant proteins, present at roughly four micromolar. Four tandem RNA-recognition motifs
  form an N-terminal module that binds the 3' poly(A) tail of mRNA with nanomolar affinity
  and strong selectivity for adenosine, while a C-terminal MLLE/PABC domain is a
  peptide-binding module that docks PAM2 motifs and so recruits a large set of partners onto
  the tail. Through these two surfaces PABPC1 sets the fate of cytoplasmic mRNA. Bound to
  the tail it contacts eIF4G in the cap-binding eIF4F complex, closing the message into a
  loop and stimulating translation initiation; this activity is tuned up by PAIP1 and down
  by PAIP2, which displaces the protein from poly(A). The same tail-bound protein protects
  long poly(A) from the TUT4/TUT7 uridylation that commits an mRNA to decay, slows
  deadenylation as part of a bridging complex on coding-region instability determinants, and
  yet also recruits the PAN2-PAN3 and Tob/CCR4-NOT deadenylases, so it both licenses and
  restrains tail shortening depending on context. At the stop codon it binds the release
  factor eRF3 and competes with UPF1, which makes it an antagonist of nonsense-mediated
  decay for messages whose termination codon lies close to the tail. PABPC1 is a diffuse
  cytosolic protein that shuttles to the nucleus when mRNA export stalls, is a canonical
  component of cytoplasmic stress granules and of Staufen and IGF2BP1 transport granules,
  and reaches the leading edge of migrating cells with DDX3X. It is a recurrent target of
  viruses, which cleave, sequester or relocalise it to shut off host translation, and
  heterozygous de novo variants in its MLLE domain cause developmental delay with speech
  delay and autistic features.
