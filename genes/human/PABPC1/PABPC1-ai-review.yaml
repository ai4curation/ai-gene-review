    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12086624
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q04637
  review:
    summary: >-
      eIF4G recovered with PABPC1 in the structural study of rotavirus NSP3 competing for
      the same eIF4G surface.
    action: MODIFY
    reason: >-
      The policy prefers refinement to removal when the cited paper supports a more
      informative molecular function, and it does here: eIF4G1 is a translation initiation
      factor, the PABP-eIF4G contact is resolved to PABP's RRM2 and to a defined eIF4G
      peptide, and it is the interaction that closes the mRNA loop and stimulates
      initiation. Translation initiation factor binding states that, where protein binding
      states nothing. The gene does not yet carry the replacement term, so this is a genuine
      gain in information rather than a deduplication.
    proposed_replacement_terms:
    - id: GO:0031369
      label: translation initiation factor binding
    supported_by:
    - reference_id: PMID:23041282
      supporting_text: >-
        Our NMR and crystallographic data show that eIF4G interacts with the RRM2 domain of
        PABP
      full_text_unavailable: true
    - reference_id: PMID:11997512
      supporting_text: >-
        The PABP-eIF4G interaction brings about the circularization of the mRNA by joining
        its 5' and 3' termini, thereby stimulating mRNA translation
