core_functions:
- description: Secreted cystatin-like inhibitor of extracellular cysteine endopeptidases, represented
    in human fluids by low-molecular-weight kininogen and by the N-terminal domains shared with high-molecular-weight
    kininogen.
  molecular_function:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0045861
    label: negative regulation of proteolysis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:3488317
    supporting_text: one as low molecular weight kininogen
  - reference_id: PMID:3488317
    supporting_text: The enzyme inhibitory properties of the inhibitors were investigated by measuring
      inhibition and rate constants for their interactions with papain and human cathepsin B.
- description: Precursor of the vasoactive kinin hormones bradykinin and kallidin; plasma and tissue kallikreins
    release these peptides from high- and low-molecular-weight kininogen so that the kinins can activate
    B2 bradykinin receptors on target-cell plasma membranes.
  molecular_function:
    id: GO:0005179
    label: hormone activity
  directly_involved_in:
  - id: GO:0042311
    label: vasodilation
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: file:human/KNG1/KNG1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: The active peptide bradykinin is a potent vasodilatator that is released from HMW-kininogen
  - reference_id: PMID:1314587
    supporting_text: the human BK-2 receptor expressed in COS-7 cells binds BK with a KD of 0.13 nM
  - reference_id: PMID:1329734
    supporting_text: Binding studies demonstrated that HG10 encodes a high affinity BK receptor
- description: High-molecular-weight kininogen scaffolds prekallikrein and factor XI near factor XII at
    extracellular contact-activation surfaces, positioning zymogens for reciprocal activation and the
    intrinsic coagulation pathway.
  proposed_molecular_function: contact-system zymogen assembly scaffold activity
  directly_involved_in:
  - id: GO:0007597
    label: blood coagulation, intrinsic pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: file:human/KNG1/KNG1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: HMW-kininogen plays an important role in blood coagulation by helping to position
      optimally prekallikrein and factor XI next to factor XII
  - reference_id: Reactome:R-HSA-9857952
    supporting_text: In the context of the contact activation system, the binding of kininogen to either
      the C1QBP (gC1qR) homotrimer, C1QBP:CK1, or uPAR:CK1 complexes facilitate the assembly of kininogen,
      prekallikrein, and FXII into higher-order ternary complexes.
proposed_new_terms:
- proposed_name: contact-system zymogen assembly scaffold activity
  proposed_definition: A molecular scaffold activity that binds and positions plasma contact-system
    zymogens, such as prekallikrein or factor XI, near factor XII on a charged or cell-associated
    activating surface to promote reciprocal zymogen activation.
  justification: High-molecular-weight kininogen contributes to the intrinsic coagulation and kallikrein-kinin
    contact system by positioning prekallikrein and factor XI next to factor XII, but GO has no molecular
    function term for this nonenzymatic assembly role; generic binding terms do not capture the zymogen-organizing
    activity.
  supported_by:
  - reference_id: file:human/KNG1/KNG1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: HMW-kininogen plays an important role in blood coagulation by helping to position
      optimally prekallikrein and factor XI next to factor XII
  - reference_id: Reactome:R-HSA-9857952
    supporting_text: In the context of the contact activation system, the binding of kininogen to either
      the C1QBP (gC1qR) homotrimer, C1QBP:CK1, or uPAR:CK1 complexes facilitate the assembly of kininogen,
      prekallikrein, and FXII into higher-order ternary complexes.
suggested_questions:
- question: Would GO benefit from a specific kinin hormone activity term for bradykinin/kallidin precursor
    gene products such as KNG1, parallel to other curated peptide-hormone activities?
- question: What molecular-function term best captures high-molecular-weight kininogen assembly of prekallikrein
    and contact-activation proteins on endothelial or platelet surfaces?
suggested_experiments:
- description: Use purified human high- and low-molecular-weight kininogen isoforms with plasma kallikrein
    or tissue kallikrein and B2R-expressing reporter cells to compare isoform-specific kinin release and
    receptor activation.
