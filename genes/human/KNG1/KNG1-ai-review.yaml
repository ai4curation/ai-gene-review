    label: hormone activity
  evidence_type: IDA
  original_reference_id: PMID:1314587
  qualifier: enables
  review:
    summary: Kinin hormone activity mediated by the bradykinin peptide.
    action: ACCEPT
    reason: Bradykinin, the nonapeptide released from the KNG1 high-molecular-weight isoform, is the ligand
      for the human B2 bradykinin receptor characterized in both cloned-receptor studies. This is the
      molecular activity modeled for KNG1 in GO-CAM 6246724f00000632.
    supported_by:
    - reference_id: PMID:1314587
      supporting_text: the human BK-2 receptor expressed in COS-7 cells binds BK with a KD of 0.13 nM
    - reference_id: PMID:1329734
      supporting_text: Binding studies demonstrated that HG10 encodes a high affinity BK receptor
