- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IPI
  original_reference_id: PMID:11290596
  qualifier: enables
  supporting_entities:
  - UniProtKB:P04264
  review:
    summary: Cell-surface kininogen binding by CK1/uPAR.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IPI paper supports high-molecular-weight kininogen binding to the endothelial CK1/uPAR
      surface complex that assembles contact-activation proteins. GO:0005102 is over-specific because
      this evidence is for a scaffolded contact-activation receptor complex, not a classical ligand-signaling
      receptor pair.
    supported_by:
    - reference_id: PMID:11290596
      supporting_text: On HUVECs, CK1 and uPAR, but not gC1qR, colocalized to be a multiprotein receptor
        complex for HK binding, PK activation, and 2-chain urokinase plasminogen activation.
