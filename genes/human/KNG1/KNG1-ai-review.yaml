  review:
    summary: High-molecular-weight kininogen scaffolds contact activation.
    action: NEW
    reason: HMW-kininogen contributes structure to contact activation by carrying prekallikrein and factor
      XI next to factor XII on charged or cellular surfaces. A comparator check supports intrinsic-pathway
      participation rather than a substrate-only interpretation; F8 carries GO:0007597 for a nonenzymatic
      intrinsic-tenase cofactor role, and F12 carries GO:0007597 for the contact-system protease branch
      whose zymogens HMW-kininogen helps assemble.
    supported_by:
    - reference_id: file:human/KNG1/KNG1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: HMW-kininogen plays an important role in blood coagulation by helping to position
        optimally prekallikrein and factor XI next to factor XII
    - reference_id: Reactome:R-HSA-9857952
      supporting_text: In the context of the contact activation system, the binding of kininogen to either
        the C1QBP (gC1qR) homotrimer, C1QBP:CK1, or uPAR:CK1 complexes facilitate the assembly of kininogen,
        prekallikrein, and FXII into higher-order ternary complexes.
