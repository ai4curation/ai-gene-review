id: P01042
gene_symbol: KNG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KNG1 encodes secreted kininogen-1, the alternatively spliced precursor of high- and low-molecular-weight
  kininogens. Its N-terminal cystatin-like domains inhibit cysteine endopeptidases in extracellular fluids,
  while proteolysis of the high-molecular-weight isoform by plasma kallikrein and the low-molecular-weight
  isoform by tissue kallikrein liberates the vasoactive kinin peptides bradykinin and kallidin. High-molecular-weight
  kininogen also binds prekallikrein and endothelial or platelet surfaces during contact activation, and
  its cleaved domain 5 has anti-adhesive effects on vitronectin-dependent platelet and vascular-cell adhesion.
