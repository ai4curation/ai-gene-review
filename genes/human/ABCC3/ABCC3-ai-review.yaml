  review:
    summary: ABCC3 is a basolateral efflux transporter of liver, intestine and testis; there is no direct evidence that it functions at the blood-brain barrier, and the cited reference is a general BBB review that does not mention ABCC3.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited reference (PMID:26590417) is a general review of blood-brain barrier biology that does not mention ABCC3/MRP3. ABCC3 is characterized at basolateral/basal membranes of hepatocytes, enterocytes and Sertoli cells; its brain expression is low and no study demonstrates an ABCC3-mediated transport role at the BBB. The NAS annotation over-extends the gene's established localization.
