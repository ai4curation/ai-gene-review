id: O15438
gene_symbol: ABCC3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ABCC3 (MRP3; multidrug resistance-associated protein 3) is a 1527-residue, polytopic, ATP-binding cassette (ABC) transporter of the ABCC/MRP subfamily. Like its closest relative MRP1 and like MRP2, it has an N-terminal membrane-spanning extension (TMD0) plus the core two transmembrane-domain/two nucleotide-binding-domain architecture, and it couples ATP binding and hydrolysis to the primary active export of amphipathic organic anions. ABCC3 resides in the basolateral (sinusoidal) plasma membrane of polarized epithelia, principally hepatocytes and intestinal enterocytes, and in the basal membrane of testicular Sertoli and peritubular myoid cells, where it effluxes substrates from the cytosol into blood. Its best-characterized cargo are glucuronide conjugates (bilirubin mono- and bis-glucuronides; estradiol, estrone, estriol, testosterone, dihydrotestosterone and other steroid glucuronides; xenobiotic glucuronides such as etoposide glucuronide and acetaminophen glucuronide), together with glutathione S-conjugates including the cysteinyl leukotriene LTC4 and dinitrophenyl-glutathione, and some steroid and bile-acid sulfates. It transports free bile acids and salts only weakly and contributes an alternative sinusoidal escape route for conjugated bilirubin and bile acids that becomes important when the canalicular pump MRP2 is impaired (ABCC3 is strongly induced in cholestasis and in MRP2-deficient Dubin-Johnson syndrome). ABCC3 also confers low-level cellular resistance to anticancer drugs such as methotrexate, etoposide and teniposide by reducing their intracellular accumulation. It does not export free glutathione.'
