suggested_questions:
- question: What is the physiological contribution of ABCC3 to sinusoidal (basolateral) efflux of conjugated bilirubin and bile acids under normal versus cholestatic conditions, relative to ABCC4 and OSTalpha/beta?
- question: Does ABCC3 have any functionally meaningful role at the blood-testis barrier (basal Sertoli/peritubular myoid membrane), given its localization there but absence of functional transport data in testis?
suggested_experiments:
- hypothesis: ABCC3 is the principal basolateral escape route for conjugated bilirubin when canalicular MRP2 export fails.
  description: Compare biliary vs plasma appearance of mono- and bis-glucuronosyl bilirubin in Abcc3-null, Abcc2-null and double-null mice, and in primary human hepatocytes with ABCC3 knockdown, under baseline and cholestatic (bile-duct-ligation) conditions.
  experiment_type: genetic and biochemical
- hypothesis: ABCC3 at the Sertoli-cell basal membrane effluxes steroid glucuronides/sulfates across the blood-testis barrier.
  description: Vectorial transport assays of radiolabeled steroid glucuronides/sulfates across polarized Sertoli-cell monolayers with and without ABCC3 inhibition/knockdown, correlated with immunolocalization.
  experiment_type: transport assay
