id: Q7KZN9
gene_symbol: COX15
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COX15 is a multipass mitochondrial inner membrane enzyme that converts heme O to heme A by oxidation of its C8 methyl group to a formyl group. Heme A supplies the prosthetic groups of cytochrome c oxidase, linking this biosynthetic reaction to respiratory complex IV assembly and activity. Human COX15.1 partially restores heme A content and oxidase activity in deficient patient fibroblasts. Alternative splicing produces a 388-residue product with a different C terminus from the 410-residue displayed product; equal catalytic competence of the two products has not been established. Biallelic pathogenic variants cause mitochondrial complex IV deficiency, including severe infantile cardiomyopathy and neurological disease.
