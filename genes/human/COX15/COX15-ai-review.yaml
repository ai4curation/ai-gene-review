    review_notes: The inherited yeast-donor attribution is unverified because the historical source omitted WITH/FROM. The complete current record identifies bacterial CtaA/P12946; that resolves the current transfer but does not establish what donor was present in every historical version. Current same-term experimental records and official species identity were inspected.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT/PANTHER phylogenetic annotation transfers experimentally validated Cox15 family functions (heme A synthase activity, mitochondrial inner membrane localization, heme A biosynthetic process) to human COX15.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current PTHR23289 v19 topology, exact target MSA sequence and PTN000590786 ancestry were checked, together with ten literal source/term joins. The current slim chemistry differs from current GOA; no historical IBD-session replay is claimed. Human self-source evidence is legitimate.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: UniProtKB Subcellular Location vocabulary mapping yields the mitochondrial inner membrane localization annotation for COX15 from its curated SL keyword.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The current source is the UniProt location vocabulary SL-0168. It maps the curated inner-membrane location, not a donor-gene experiment.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: Curation of Human Protein Atlas immunofluorescence images supports COX15 mitochondrial localization at IDA evidence level.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current HPA ICC/IF summary reports supported main mitochondrial and additional nucleoplasmic localization. The experimental summary was read, not independently scored image pixels.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: A combined automated pipeline integrating multiple IEA methods produces high-confidence IEA annotations of COX15 to mitochondrial inner membrane and heme A synthase activity / heme A biosynthetic process.
    finding_review:
      finding_status: DISPUTED
      review_notes: The current combined mapping supports broad membrane, heme A synthase activity and heme A biosynthesis. Inner membrane is instead explicitly mapped by GO_REF:0000044. Thus the inherited inner-membrane attribution overgeneralizes this current mapping; the biological inner-membrane location remains supported.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete current sources combine distinct InterPro, EC, pathway and ARBA contributions. The inherited generalization overstates the current list: inner membrane is separately mapped by GO_REF:0000044, whereas this source includes broad membrane. Current ARBA FunFam-dependent branches are unresolved; the explicit InterPro mappings and independent biology remain positive.'
- id: PMID:12474143
  title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
  findings:
  - statement: Biallelic COX15 mutations cause isolated cytochrome c oxidase deficiency presenting as fatal infantile hypertrophic cardiomyopathy, establishing COX15 as a human COX deficiency disease gene alongside SCO2.
    supporting_text: This study establishes COX15 as an additional cause, along with SCO2, of fatal infantile, hypertrophic cardiomyopathy associated with isolated COX deficiency.
  - statement: COX15-deficient tissues show reduced heme A and accumulated heme O, mechanistically placing COX15 at the heme O → heme A step of the heme A biosynthetic pathway.
    supporting_text: Mitochondrial heme A content was reduced in the patient's heart and fibroblast mitochondria, and levels of heme O were increased in the patient's heart.
  - statement: COX15 re-expression rescues heme A content and COX activity in patient fibroblasts, demonstrating by functional complementation that reduced heme A availability is what stalls COX assembly.
    supporting_text: Expression of COX15 increased heme A content and rescued COX activity. These results suggest that reduced availability of heme A stalls the assembly of COX.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The selected cache is partial despite its full-text flag. Genuine original PMC Methods, Results, tables and Discussion were recovered separately and inspected: human COX15.1-only complementation, partial respiratory rescue, and heart versus fibroblast heme O differences. Native-gel antibodies detect respiratory subunits, not COX15 membership. The historical findings and quotations remain, with these assay limits.'
- id: PMID:26940873
  title: Analysis of Oligomerization Properties of Heme a Synthase Provides Insights into Its Function in Eukaryotes.
  findings:
  - statement: Eukaryotic Cox15 (heme A synthase) forms evolutionarily conserved homotypic complexes via hydrophobic interactions that are independent of heme levels and of catalytic activity, suggesting multimerization is a constitutive feature of the enzyme.
    supporting_text: Our results indicate that Cox15 exhibits homotypic interactions, forming highly stable complexes dependent upon hydrophobic interactions. This multimerization is evolutionarily conserved and independent of heme levels and heme a synthase catalytic activity.
  - statement: Four conserved histidines are essential for eukaryotic heme A synthase activity and cannot be substituted with other heme-ligating residues, consistent with their role in heme binding and catalysis.
    supporting_text: Four conserved histidine residues are demonstrated to be critical for eukaryotic heme a synthase activity and cannot be substituted with other heme-ligating amino acids.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine original PMC Methods, Results and Discussion supplement the unchanged abstract-only cache. Yeast constructs establish oligomerization and mutational effects; porcine kidney provides native-gel bands, and human patient cells provide steady-state protein measurements. No purified human heme-binding assay or equal splice-product activity is claimed.
- id: PMID:29128334
  title: A Map of Human Mitochondrial Protein Interactions Linked to Neurodegeneration Reveals New Mechanisms of Redox Homeostasis and NF-κB Signaling.
  findings:
  - statement: Reports a high-throughput human mitochondrial protein interaction map; provides the IPI evidence underlying the (uninformative) "protein binding" annotation for COX15 without identifying a specific biological role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The protected cache is partial. A genuine original author-lab PDF was read at selected Results and STAR Methods pages, including tagged HEK293 affinity purification and endogenous antibody IP. Three exact COX15–PRDX6 curated records map to official sequences. The target-specific supplemental image/table was not independently inspected, so record-level assay attribution remains explicit. The inherited generic finding is supplemented by the verified counterpart class, not a claim of causal regulation.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  findings:
  - statement: Quantitative mass-spectrometry-based mitochondrial proteomics confirms COX15 as a high-confidence mitochondrial protein and provides HTP evidence for mitochondrion localization.
    finding_review:
      finding_status: CURRENT
      review_notes: 'The inherited mitochondrial-proteomics finding is now directly verified in the original publisher Table S1: (A) row 239, group 7459/Q7KZN9/COX15, Class 1/Cluster 1/Class 1; (B) row 214, MitoCoP inclusion. The workbook MD5 matches the original PMC supplement metadata. This closes the earlier target-row access limit; it does not establish isoform-specific function or a direct inner-membrane measurement.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original article identity, selected Methods/Results and now the authentic Table S1 COX15 rows were checked. Publisher workbook https://ars.els-cdn.com/content/image/1-s2.0-S1550413121005295-mmc2.xlsx (SHA256 10690847c50567e11055d474fbe265fe5d699384f38437acd95734f0a87a9183), sheet (A) row 239 and sheet (B) row 214, positively supports target mitochondrial localization. Values group Q7KZN9 and Q7KZN9-2; no isoform-resolved activity is inferred.
- id: PMID:9878253
  title: Identification and characterization of human cDNAs specific to BCS1, PET112, SCO1, COX15, and COX11, five genes involved in the formation and function of the mitochondrial respiratory chain.
  findings:
  - statement: The human COX15 cDNA was identified as an ortholog of yeast COX15 and shown by in vitro import / protease-protection assay to be mitochondrially targeted, providing the original experimental evidence for human COX15 mitochondrial localization.
    supporting_text: Mitochondrial targeting of the human gene products, suggested by computer analysis of the protein sequences, was confirmed by an in vitro import and protease-protection assay.
  - statement: Sequence comparison shows extensive identity/similarity with yeast Cox15, including conservation of functional domains, justifying transfer of yeast Cox15 heme A synthase function to the human ortholog.
    supporting_text: Significant amino acid identity and similarity were demonstrated by comparison of the human with the corresponding yeast polypeptides. Sequence alignment revealed numerous colinear identical regions and the conservation of functional domains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and complete abstract support human mitochondrial import/protease protection. Original full text was not recovered after bounded publisher and repository attempts; precise subcompartment and respiratory-complex assertions remain differently resolved as explained per row.
  full_text_unavailable: true
- id: Reactome:R-HSA-189451
  title: Heme biosynthesis
  findings:
  - statement: Reactome curates COX15 as a participant in the broad heme biosynthesis pathway; the more specific heme A biosynthetic process (GO:0006784) and COX15-specific Reactome reaction better capture its function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual hasEvent path reaches 2995334 and its COX15 catalyst/reference. This establishes the specific heme A contribution within the broader pathway.
- id: Reactome:R-HSA-2995334
  title: COX15 transforms heme O to heme A
  findings:
  - statement: Reactome's reaction "COX15 transforms heme O to heme A" describes the COX15-catalysed final step of heme A biosynthesis and supports the heme A synthase activity (GO:0120547) annotation at TAS evidence level.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete current catalyst/entity/reference path resolves to Q7KZN9 and inner membrane. The historical monooxygenase wording of older sources is distinguished from the current net reaction definition; no detailed human atomic mechanism is claimed.
- id: Reactome:R-HSA-9865449
  title: Metallochaperone inserts Cu2+ into MT-CO1
  findings:
  - statement: Reactome places COX15 in a nine-subunit metallochaperone/biogenesis complex (COA3, COA5, COX10, dimeric COX11, COX15, COX16, COX19, SCO1, SCO2) that delivers Cu2+ to MT-CO1 during CIV assembly, coupling heme A supply to copper insertion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual target path through catalyst9865627/complex9865441/component2995350 was verified. Historical summary prose names COX10, whereas the current component list includes a COQ10A,B entity; that other-participant discrepancy is not silently rewritten into a target mechanism. COX15 location is explicit, but autonomous copper insertion is not established.
- id: Reactome:R-HSA-9865579
  title: MT-CO1 and MT-CO2 complexes associate, installing heme moieties
  findings:
  - statement: Reactome describes a dynamic metallochaperone complex including the heme A biosynthetic enzymes COX10 and COX15 alongside COX2 copper chaperones (COA6, SCO1, SCO2) that mediates association of MT-CO1 and MT-CO2 modules and installs heme moieties.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual target path through the metallochaperone model was reconstructed. The inherited summary and event-level heme-installation language are curated context, not direct experimental demonstration that COX15 inserts heme into both oxidase subunits.
- id: Reactome:R-HSA-9865630
  title: Metallochaperone inserts 2Cu2+ into MT-CO2
  findings:
  - statement: Reactome describes the SCO-containing metallochaperone complex (with COX15 as a member) inserting two Cu2+ ions into MT-CO2, linking COX15-derived heme A supply to the CuA assembly step of CIV.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual catalyst/complex/component path supports COX15 inner-membrane location. It does not independently establish COX15 copper-insertase activity or stable mature respiratory-complex membership.
- id: PMID:10893423
  title: 1-Cys peroxiredoxin, a bifunctional enzyme with glutathione peroxidase and phospholipase A2 activities.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete genuine abstract establishes separate phospholipase A2 and peroxidase activities with mutational controls. It supports partner class; full original Methods and precise species of every expression construct were not recovered here. Reviewed human PRDX6 identity is an independent class source.
suggested_questions:
- question: Does the 388-residue C-terminal alternative product retain heme A synthase activity, and does it cooperate with COX15.1 under endogenous expression conditions?
  experts:
  - Antonicka H
  - Shoubridge EA
- question: What direct human evidence distinguishes a heme-containing COX15 oligomer from transient membership in respiratory-chain assembly intermediates?
  experts:
  - Khalimonchuk O
  - Fox JL
- question: What role, if any, does the observed COX15–PRDX6 association play in mitochondrial lipid or redox physiology?
- question: How does newly synthesized heme A move from COX15 to cytochrome c oxidase without conflating catalytic synthesis with an untested insertase or scaffold activity?
  experts:
  - Khalimonchuk O
  - Shoubridge EA
- question: How is COX15 abundance and activity coordinated with COX10 (heme O synthase) and with CIV assembly demand to prevent heme O accumulation and mis-incorporation into non-COX targets?
  experts:
  - Antonicka H
  - Shoubridge EA
suggested_experiments:
- description: Compare sequence-verified COX15.1 and COX15.2 at matched expression in deficient human cells, measuring import, membrane topology, heme O/heme A by calibrated chromatography and respiratory rescue with catalytic-loss controls.
  hypothesis: The alternative C terminus changes COX15 product activity or import under matched expression conditions.
  experiment_type: matched human isoform complementation with heme quantification
- description: Resolve endogenous COX15 assemblies by reciprocal affinity isolation and native mass spectrometry with respiratory-subunit and heme measurements, distinguishing stable homo-oligomers from transient assembly intermediates.
  hypothesis: Human COX15 forms distinguishable stable oligomers and transient respiratory assembly associations.
  experiment_type: endogenous complex isolation and native mass spectrometry
- description: Test the PRDX6 association by reciprocal endogenous co-immunoprecipitation and purified membrane-compatible reconstitution, then separately assay phospholipase and peroxidase effects with appropriate catalytic controls.
  hypothesis: The COX15–PRDX6 association affects one or both PRDX6 catalytic activities under defined membrane conditions.
  experiment_type: reciprocal interaction assays with separate phospholipase and peroxidase measurements
- hypothesis: COX15 hands off heme A directly to nascent MT-CO1 within an assembly super-complex, rather than releasing heme A into the mitochondrial inner membrane bulk lipid bilayer.
  description: Use proximity labeling (BioID/TurboID) of catalytically active vs catalytically dead COX15 in human cells, combined with native-PAGE of CIV assembly intermediates, to map COX15 partners along the MT-CO1 hemylation pathway and detect a putative heme A channeling complex.
  experiment_type: proximity labeling combined with native CIV assembly profiling
- hypothesis: The four conserved histidines of COX15 are direct heme-A-pathway ligands whose mutation traps a covalent or non-covalent heme-bound intermediate.
  description: Express and purify recombinant human COX15 (and the conserved-histidine mutants) in membrane-mimetic systems; characterise heme content and electronic structure by UV-Vis, EPR, and resonance Raman; compare wild-type and mutant turnover with heme O substrate.
  experiment_type: spectroscopy of purified recombinant human heme A synthase
- hypothesis: Pathogenic COX15 substitutions can affect catalytic competence and oligomer stability to different extents.
  description: Compare isogenic human iPSC-derived cardiomyocytes carrying R217W and splice variants with wild-type controls. Measure heme A, oxidase activity, respiratory assembly intermediates and COX15 oligomeric state, using matched expression and independent catalytic and stability controls to distinguish the competing mechanisms.
  experiment_type: iPSC-cardiomyocyte disease modelling with native complex profiling
status: DRAFT
