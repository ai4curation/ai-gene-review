      is now retired because the current GOA uses a distinct combined source; retirement does not reject
      its biology.
  GO_REF:0000024:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The inherited yeast-donor attribution is unverified because the historical source omitted
      WITH/FROM. The complete current record identifies bacterial CtaA/P12946; that resolves the current
      transfer but does not establish what donor was present in every historical version. Current same-term
      experimental records and official species identity were inspected.
  GO_REF:0000033:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current PTHR23289 v19 topology, exact target MSA sequence and PTN000590786 ancestry
      were checked, together with ten literal source/term joins. The current slim chemistry differs from
      current GOA; no historical IBD-session replay is claimed. Human self-source evidence is legitimate.
  GO_REF:0000044:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The current source is the UniProt location vocabulary SL-0168. It maps the curated inner-membrane
      location, not a donor-gene experiment.
  GO_REF:0000052:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current HPA ICC/IF summary reports supported main mitochondrial and additional nucleoplasmic
      localization. The experimental summary was read, not independently scored image pixels.
  GO_REF:0000120:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete current sources combine distinct InterPro, EC, pathway and ARBA contributions.
      The inherited generalization overstates the current list: inner membrane is separately mapped by
      GO_REF:0000044, whereas this source includes broad membrane. Current ARBA FunFam-dependent branches
      are unresolved; the explicit InterPro mappings and independent biology remain positive.'
  PMID:12474143:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The selected cache is partial despite its full-text flag. Genuine original PMC Methods,
      Results, tables and Discussion were recovered separately and inspected: human COX15.1-only complementation,
      partial respiratory rescue, and heart versus fibroblast heme O differences. Native-gel antibodies
      detect respiratory subunits, not COX15 membership. The historical findings and quotations remain,
      with these assay limits.'
  PMID:26940873:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine original PMC Methods, Results and Discussion supplement the unchanged abstract-only
      cache. Yeast constructs establish oligomerization and mutational effects; porcine kidney provides
      native-gel bands, and human patient cells provide steady-state protein measurements. No purified
      human heme-binding assay or equal splice-product activity is claimed.
  PMID:29128334:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The protected cache is partial. A genuine original author-lab PDF was read at selected
      Results and STAR Methods pages, including tagged HEK293 affinity purification and endogenous antibody
      IP. Three exact COX15–PRDX6 curated records map to official sequences. The target-specific supplemental
      image/table was not independently inspected, so record-level assay attribution remains explicit.
      The inherited generic finding is supplemented by the verified counterpart class, not a claim of
      causal regulation.
  PMID:34800366:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original article identity, selected Methods/Results and now the authentic Table
      S1 COX15 rows were checked. Publisher workbook https://ars.els-cdn.com/content/image/1-s2.0-S1550413121005295-mmc2.xlsx
