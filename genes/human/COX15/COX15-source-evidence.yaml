reviewed_annotations:
- index: 0
  review:
    summary: Conserved heme A synthase activity is supported by phylogeny and human rescue.
    action: ACCEPT
    reason: Current PTHR23289 topology places the exact human 410-residue sequence beneath the recorded
      PTN000590786 ancestor. Current fission-yeast and budding-yeast same-term records include experimental
      support, while human COX15.1 rescue independently increases heme A. The current v19 GO-slim chemistry
      fields differ from current GOA; topology and MSA do not replay the historical IBD curation session.
      No target-specific loss of this activity is established. The tree and MSA response URLs/hashes,
      exact target node and root-to-target path are recorded under paint in COX15-source-evidence.yaml.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:12474143
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000590786
        source_status: SUPPORTS_TRANSFER
        comment: Current PTHR23289 v19 places the exact human sequence at descendant PTN002510931. Experimental
          yeast same-term records and human heme A rescue support conserved synthase activity. Current
          GO-slim fields do not reconstruct the historical IBD session.
- index: 1
  review:
    summary: The mitochondrial inner membrane is the conserved site of COX15 function.
    action: ACCEPT
    reason: The current target lies below PTN000590786. Current experimental location records are present
      for both yeast sources and human COX15; the target appearing among descendant evidence is legitimate
      grounding. Human import evidence and curated inner-membrane location agree with the multipass enzyme
      architecture. This is not an inference based on the number of donors.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:9878253
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000590786
        source_status: SUPPORTS_TRANSFER
        comment: The current target is a descendant of this recorded ancestral node. Yeast experimental
          inner-membrane records and direct human import/location evidence support the placement; human
          descendant evidence is legitimate grounding.
- index: 2
  review:
    summary: COX15 performs the heme A-forming step of the pathway.
    action: ACCEPT
    reason: The current family tree supports the recorded ancestral placement, with experimental heme
      A process records in both yeast sources and on the human target. Human COX15.1 complementation increases
      heme A, providing performed catalytic work rather than merely a downstream respiratory phenotype.
      The human self-source is not circular.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:12474143
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000590786
        source_status: SUPPORTS_TRANSFER
        comment: The current tree places human COX15 within this ancestral clade. Yeast experimental heme
          A process records and human COX15.1 rescue support performed pathway chemistry, without claiming
          a replay of the historical IBD curation.
- index: 3
  review:
    summary: The curated UniProt location maps specifically to the mitochondrial inner membrane.
    action: ACCEPT
    reason: The complete current source identifies UniProtKB-SubCell:SL-0168, a location vocabulary entry
      rather than a donor gene. Its mapping agrees with the curated target location, conserved multipass
      architecture and the reaction-specific Reactome entity.
    supported_by:
    - reference_id: GO_REF:0000044
    - reference_id: Reactome:R-HSA-2995334
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0168
        source_status: SUPPORTS_TRANSFER
        comment: This is the curated UniProt inner-membrane vocabulary mapping, not a donor protein. It
          agrees with target architecture and the reaction-specific Reactome entity.
- index: 4
  review:
    summary: The heme A process mapping agrees with the enzyme family and human evidence.
    action: ACCEPT
    reason: Current IPR003780 and IPR023754 both explicitly map to heme A biosynthesis; the complete source
      also retains UniPathway UPA00269. The human protein performs the terminal conversion of heme O to
      heme A, as supported by complementation and heme measurements. This does not assign all heme pathway
      reactions to COX15.
    supported_by:
    - reference_id: GO_REF:0000120
    - reference_id: PMID:12474143
    propagation_review:
      root_cause: NO_FAILURE_CORE
