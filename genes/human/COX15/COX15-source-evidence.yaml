      checksum: 98E9FD9D1D28EFC0
      comment:
      - 'FUNCTION Catalyzes the second reaction in the biosynthesis of heme A, a prosthetic group of mitochondrial
        cytochrome c oxidase (CcO) (PubMed:12474143). Heme A is synthesized from heme B by two sequential
        enzymatic reactions catalyzed by heme O synthase (HOS) and heme A synthase (HAS). HAS catalyzes
        the conversion of heme O to heme A by two successive hydroxylations of the methyl group at C8,
        in a reaction that involves matrix ferredoxin and ferredoxin reductase. The first hydroxylation
        forms heme I, the second hydroxylation results in an unstable dihydroxymethyl group, which spontaneously
        dehydrates, resulting in the formyl group of heme A (By similarity).CATALYTIC ACTIVITY Fe(II)-heme
        o + 2 A + H2O = Fe(II)-heme a + 2 AH2COFACTOR Porphyrin-containing compound metabolism; heme A
        biosynthesis; heme A from heme O: step 1/1.INTERACTION Predominantly found in tissues characterized
        by high rates of oxidative phosphorylation (OxPhos), including muscle, heart, and brain.DOMAIN
        The N-half (TM1-TM4) and C-half (TM5-TM8) domains are connected by an intracellular loop. Each
        domain is formed from four-helix bundles and they align in a pseudo twofold symmetry manner. The
        N-half domain is the substrate heme O binding domain and the C-half domain is the cofactor heme
        B binding domain.DISEASE The disease is caused by variants affecting the gene represented in this
        entry.SIMILARITY Belongs to the COX15/CtaA family. Type 2 subfamily.'
      description:
      - 'recommendedName: Heme A synthase COX15 shortName: HAS ecNumber evidence="2"1.17.99.9 alternativeName:
        Cytochrome c oxidase assembly protein COX15 homolog'
