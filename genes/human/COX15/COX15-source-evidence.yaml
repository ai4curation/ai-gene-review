    summation:
    - dbId: 9865873
      displayName: A metallochaperone complex consisting of nine subunits (COA3...
      text: A metallochaperone complex consisting of nine subunits (COA3, COA5, COX10, dimeric COX11,
        COX15, COX16, COX19, SCO1, SCO2) carries a copper cation from the outer side of the inner mitochondrial
        membrane, where it was delivered by the copper chaperone COX17, to the pre-assembled Complex IV
        on the inner side of the membrane, where it inserts the cation into the MT-CO1 subunit. This copper
        ion is frequently called CuB (Leary et al., 2013; Bode et al., 2015; Nývltová et al., 2022; reviewed
        in Ruiz et al., 2021).
      className: Summation
      schemaClass: Summation
  - dbId: 9865579
    displayName: MT-CO1 and MT-CO2 complexes associate, installing heme moieties
    stId: R-HSA-9865579
    compartment:
    - dbId: 70616
      displayName: mitochondrial inner membrane
      accession: '0005743'
      databaseName: GO
      definition: The inner, i.e. lumen-facing, lipid bilayer of the mitochondrial envelope. It is highly
        folded to form cristae.
      name: mitochondrial inner membrane
      url: https://www.ebi.ac.uk/QuickGO/term/GO:0005743
      className: Compartment
      schemaClass: Compartment
    summation:
    - dbId: 9865625
      displayName: Both MT-CO1 and MT-CO2 pre-assembly complexes bind together,...
      text: Both MT-CO1 and MT-CO2 pre-assembly complexes bind together, simultaneously installing heme
        moieties and associating with the COX7B, COX7C, and COX8A subunits. The assembly of catalytic
        metal redox centers (heme and copper) at MT-CO1 and MT-CO2 subunits of Complex IV must be coordinated
        because the accumulation of heme-containing Complex IV assembly intermediates lacking copper induces
        oxidative-stress mediated cytotoxicity. A dynamic metallochaperone complex involving the heme
        A biosynthetic enzymes COX10 and COX15, together with COX2-specific copper chaperones COA6, SCO1,
        and SCO2, catalyzes the insertion of two heme molecules into the MT-CO1 subunit, and one heme
        into the MT-CO2 subunit (Pacheu-Grau et al., 2015; Nývltová et al., 2022; reviewed in Čunátová
        et al., 2020; Rivett et al., 2021). The exact mechanism remains unclear, but the SURF1 subunit
        of MITRAC may act as an additional chaperone, for which there is evidence in bacterial models
        (Smith et al., 2005; Bundschuh et al., 2009). Mutations in SURF1 lead to complex IV deficiency
        (Zhu et al., 1998).
      className: Summation
      schemaClass: Summation
  - dbId: 9865630
    displayName: Metallochaperone inserts 2Cu2+ into MT-CO2
    stId: R-HSA-9865630
    compartment:
