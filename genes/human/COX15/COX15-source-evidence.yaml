  GO:0120547:
    definition:
      id: GO:0120547
      isObsolete: false
      name: heme A synthase activity
      definition:
        text: 'Catalysis of the reaction: Fe(II)-heme o + 2 acceptor + H2O = Fe(II)-heme a + 2 acceptor-H2.
          The conversion of heme o to heme a occcurs by two successive hydroxylations of the methyl group
          at C8 using water as the oxygen source. The first hydroxylation forms heme i, the second hydroxylation
          results in an unstable dihydroxymethyl group, which spontaneously dehydrates, resulting in the
          formyl group of heme A.'
        xrefs:
        - dbCode: PMID
          dbId: '30397130'
        - dbCode: RHEA
          dbId: '63388'
      aspect: molecular_function
      usage: Unrestricted
    url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0120547
    response_sha256: 215899fceb940f9e8bc26e0847da6ffb043ff1e05552a832738f759d17d2a780
