  review:
    summary: Retain the positive STX11 interaction without assigning a specific functional role.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:32296183 reports human Q13144–O75558/STX11 positives in pooled, array and validated
      yeast-two-hybrid records, with Gal4 fusion constructs and sequence-confirmed pair verification in
      the study workflow. The same protein pair is supported independently by the other study: binary
      screening in PMID:32296183 and cellular affinity capture in PMID:33961781. Retain the experimentally
      recorded generic interaction as non-core. These records do not establish an epsilon-specific functional
      role for the interaction, so selecting syntaxin binding solely from the partner name supplies no
      supported functional refinement. The interaction is not dismissed as false, nor is physiological
      occupancy a GO term requirement. Dataset-wide orthogonal validation is not assigned to this pair,
      the coimmunoprecipitation record remains association evidence, and no vesicle-transport role is
      inferred.'
