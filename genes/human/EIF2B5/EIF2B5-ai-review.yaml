    - reference_id: PMID:15723074
    - reference_id: file:human/EIF2B5/EIF2B5-source-evidence.md
- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q64350
  - ensembl:ENSRNOP00000002321
  review:
    summary: The positive-apoptosis term overstates the demonstrated phosphorylation-dependent role.
    action: MARK_AS_OVER_ANNOTATED
    reason: The exact rat Q64350 donor annotates positive regulation of apoptosis from PMID:11756553.
      Its Methods use sequence-confirmed rat epsilon S535A/S539A constructs in Rat1/PC12 cells. The nonphosphorylatable
      mutants preserve protein synthesis and protect against GSK3 overexpression, PI3K inhibition or serum-withdrawal
      apoptosis; the mechanism is loss of exchange activity during proapoptotic signaling, not active
      epsilon promoting apoptosis. Results 23–45 and Discussion 49–54 connect GSK3-dependent inhibition
      of epsilon-supported translation to cell death; tau phosphorylation and cycloheximide non-rescue
      are mechanistic controls. This is real pathway involvement, but it does not identify an active epsilon
      proapoptotic step. The term overstates that role; the judgment does not rest on lack of an effect
      from WT overexpression and does not assert universal absence of positive regulation. No opposite
      NEW annotation is manufactured.
