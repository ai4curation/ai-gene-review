id: Q13144
gene_symbol: EIF2B5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2B5 encodes the catalytic epsilon subunit of the cytosolic eukaryotic translation initiation
  factor 2B (eIF2B) complex. Its nucleotide-exchange activity promotes release of GDP from eIF2, allowing
  GTP binding and recycling of eIF2 for cytoplasmic translation initiation. Pathogenic EIF2B5 variants
  can impair substrate binding, complex assembly or exchange activity and cause leukoencephalopathy with
  vanishing white matter.
