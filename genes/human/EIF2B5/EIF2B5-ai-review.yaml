  original_reference_id: PMID:15054402
  qualifier: enables
  review:
    summary: Patient EIF2B5 variants reduce complex exchange activity.
    action: ACCEPT
    reason: PMID:15054402 measures GDP dissociation in EBV-transformed patient lymphoblast extracts using
      rat-liver eIF2 substrate. Table 1 identifies multiple EIF2B5 genotypes with reduced exchange activity;
      heterozygous relatives have normal activity. This is direct human genotype-to-complex-function evidence,
      not purified isolated epsilon or human-substrate proof. It supports the catalytic epsilon exchange
      assignment without assigning every mutant the same molecular defect.
