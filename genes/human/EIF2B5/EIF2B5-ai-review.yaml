    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10481074
  qualifier: enables
  supporting_entities:
  - UniProtKB:P49841
  review:
    summary: A functional GSK3 docking interaction supports protein kinase binding.
    action: MODIFY
    reason: 'The exact PMID:10481074 IntAct records concern human Q13144-derived engineered 534–547 peptides
      with substitutions and phosphoserine 544 assayed against GSK3B/P49841; they do not test intact native
      human epsilon. Independent PMID:11500362 Results and Figure 8 test full-length and C-terminally
      truncated rat epsilon: HA-tagged epsilon coimmunoprecipitates with GSK3 in HEK293 cells, and removal
      of the C-terminal region reduces association and efficient GSK3 phosphorylation. The immunoprecipitation
      detects GSK3 alpha and beta together, so it is not a beta-selective docking assay. This functional
      interaction, alongside the literal human peptide evidence and conservation of the mammalian region,
      supports protein kinase binding. Rat residue numbers and engineered constructs are not relabeled
      as unmodified human protein; no kinase activity is assigned to epsilon.'
    supported_by:
    - reference_id: PMID:10481074
    - reference_id: file:human/EIF2B5/EIF2B5-source-evidence.md
