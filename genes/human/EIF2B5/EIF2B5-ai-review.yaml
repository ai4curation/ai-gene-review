- term:
    id: GO:0043434
    label: response to peptide hormone
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q64350
  - ensembl:ENSRNOP00000002321
  review:
    summary: Regulation of epsilon-dependent exchange supports a contextual peptide-hormone response.
    action: KEEP_AS_NON_CORE
    reason: The literal rat donor Q64350 traces this annotation to PMID:8430778, whose inspected abstract
      compares diabetic-tissue eIF2B activity and NADPH/CKII effects without exposing a peptide-hormone
      challenge; that original donor experiment remains unresolved. The broader mammalian response claim
      is supported independently. PMID:8397507 reports insulin-dependent GSK3 inactivation in human-insulin-receptor-transfected
      CHO cells and identifies the largest eIF2B subunit as a kinase substrate; its abstract does not
      itself measure epsilon dephosphorylation after insulin. PMID:11500362 Introduction explicitly relates
      insulin-dependent GSK3 inactivation, epsilon dephosphorylation and eIF2B activation as prior experimental
      knowledge, while its own Results/Figure 8 establish a functional GSK3 docking region in rat epsilon.
      PMID:11756553 tests rat epsilon phosphosite mutants in Rat1/PC12 cells under GSK3, PI3K and serum-withdrawal
      perturbations, supporting the regulated translation mechanism but not supplying an insulin-challenge
      experiment. This combined evidence supports the broad response term as non-core because epsilon
      catalyzes the regulated exchange step. It does not establish a direct hormone receptor function,
      reproduce the unavailable donor assay, or convert rat phosphosite numbering into human numbering.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:8430778
    - reference_id: PMID:8397507
    - reference_id: file:human/EIF2B5/EIF2B5-source-evidence.md
    - reference_id: file:human/EIF2B5/EIF2B5-bioinformatics/RESULTS.md
    - reference_id: PMID:11500362
    - reference_id: PMID:11756553
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:Q64350
        source_status: UNRESOLVED
        comment: The literal donor trace to rat Q64350/PMID:8430778 is retained, but the specific donor
          hormone-challenge experiment remains unverified in the accessible abstract. Independent mammalian
          epsilon/GSK3 evidence in PMID:11500362, with context from PMID:8397507 and PMID:11756553, supports
          the broad response claim as non-core; it does not retroactively verify this source-specific
          transfer.
      - source_id: ensembl:ENSRNOP00000002321
        source_status: UNRESOLVED
        comment: The literal donor trace to rat Q64350/PMID:8430778 is retained, but the specific donor
          hormone-challenge experiment remains unverified in the accessible abstract. Independent mammalian
