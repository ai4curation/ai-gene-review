  evidence_type: IMP
  original_reference_id: PMID:15723074
  qualifier: involved_in
  review:
    summary: The myelination assertion remains unresolved beyond the accessible glial findings.
    action: UNDECIDED
    reason: PMID:15723074 links human EIF2B5 disease to white-matter pathology and altered astrocyte generation.
      Its accessible abstract reports readily generated normal-appearing oligodendrocytes but few abnormal
      astrocytes in patient cultures. These positive observations suggest glial pathophysiology but do
      not resolve the specific sheath-formation or maintenance experiment intended by GO:0042552. Full
