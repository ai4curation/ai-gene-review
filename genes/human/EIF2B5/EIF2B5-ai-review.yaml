    label: ovarian follicle development
  evidence_type: IMP
  original_reference_id: PMID:15507143
  qualifier: involved_in
  review:
    summary: Ovarian disease association does not establish a follicle-development step.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:15507143 screened 93 women with isolated premature ovarian failure for selected EIF2B2/EIF2B4/EIF2B5
      variants and found none. Its discussion proposes possible follicular mechanisms but does not assay
      follicle formation or maturation. The independently inspected PMID:12707859 does contain positive
      EIF2B5 ovarioleukodystrophy cases, including R113H homozygotes and an R113H/R195C case. Those clinical
      observations remain valid; they do not identify a follicle-development step performed by epsilon.
      This is a process-scope overstatement, not a denial of ovarian disease involvement.
