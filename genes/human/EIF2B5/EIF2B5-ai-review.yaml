- term:
    id: GO:0034976
    label: response to endoplasmic reticulum stress
  evidence_type: IMP
  original_reference_id: PMID:16041584
  qualifier: involved_in
  review:
    summary: Conserved epsilon activity participates in the cellular response to ER stress.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:16041584 reports heightened ATF4 induction in patient fibroblasts with eIF2B mutations
      despite similar broad translational inhibition and upstream kinase activation; the exact EIF2B5
      genotype and operative patient experiments remain unresolved because the retrieved publisher payload
      was an HTML challenge. The broad response claim has independent support: PMID:12388085 Results and
      Figure 1 describe endogenous mouse epsilon redistribution into stress granules after thapsigargin
      treatment, and PMID:11500362 describes the catalytic epsilon-containing eIF2B complex whose exchange
      activity is inhibited by phosphorylated eIF2 during stress. Epsilon contributes the exchange step
      controlling translation, rather than merely being required for a downstream phenotype. Together
      these observations support a conserved, contextual ER-stress response as non-core. They do not reconstruct
      the unavailable human IMP experiment, identify epsilon as the ER sensor, or assign transcription-factor
      activity to it.'
    supported_by:
    - reference_id: PMID:16041584
    - reference_id: file:human/EIF2B5/EIF2B5-source-evidence.md
    - reference_id: PMID:12388085
    - reference_id: PMID:11500362
- term:
    id: GO:0042552
    label: myelination
  evidence_type: IMP
  original_reference_id: PMID:14566705
  qualifier: involved_in
  review:
    summary: Clinical myelin pathology does not settle epsilon participation in myelination.
    action: UNDECIDED
    reason: The inspected PMID:14566705 Table 1 identifies EIF2B5 patients 7 and 8 with V430A/S447L and
      homozygous Y495C genotypes; clinical and MRI results document severe myelin abnormalities. These
      observations establish disease involvement but do not demonstrate a step performed by epsilon in
      myelin-sheath formation or maintenance. They also do not disprove such a step. Because the other
      existing myelination assertion rests on PMID:15723074, whose full operative Methods and supplementary
      experiments remain inaccessible, the shared biological claim cannot be resolved from the available
      evidence. Use UNDECIDED consistently for both myelination rows, retaining the positive clinical
      evidence without inferring absent experiments or manufacturing a process role from necessity.
    supported_by:
    - reference_id: PMID:14566705
    - reference_id: file:human/EIF2B5/EIF2B5-source-evidence.md
    - reference_id: PMID:15723074
