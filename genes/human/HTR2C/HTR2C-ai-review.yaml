id: P28335
gene_symbol: HTR2C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HTR2C encodes the serotonin (5-hydroxytryptamine) receptor 2C, a class A seven-transmembrane
  G-protein-coupled receptor of the plasma membrane. It couples to Gq/G11, activating phospholipase C-beta
  to generate DAG and IP3 and release intracellular Ca2+, and also engages PI3K, ERK and beta-arrestin-biased
  pathways. Expressed mainly in the central nervous system, it regulates appetite and feeding, mood and
  anxiety responses, and neuroendocrine output (POMC and CRH neurons), and its pre-mRNA is subject to
  A-to-I editing that tunes G-protein coupling.
