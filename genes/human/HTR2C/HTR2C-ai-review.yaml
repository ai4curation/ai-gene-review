suggested_questions:
- question: How does A-to-I RNA editing of HTR2C quantitatively reshape Gq coupling versus beta-arrestin-biased
    signaling in vivo?
- question: Which downstream effectors mediate HTR2C's distinct roles in appetite versus anxiety, and
    can they be targeted separately?
suggested_experiments:
- description: Compare Gq/PLC/Ca2+ and beta-arrestin recruitment across HTR2C editing isoforms in a defined
    cell system to map the editing-to-signaling relationship.
  experiment_type: pharmacology
- description: Neuron-type-specific HTR2C manipulation (POMC vs other circuits) with feeding and anxiety
    readouts to dissociate its behavioral roles.
  experiment_type: in vivo physiology
