- description: 'Catalytic subunit of calcineurin: Ca2+/calmodulin-dependent protein serine/threonine phosphatase.
    Ca2+/calmodulin binding to the regulatory-region CaM-binding domain displaces the autoinhibitory domain
    from the Fe/Zn active site, allowing dephosphorylation of PxIxIT/LxVP-docked substrates such as NFAT,
    Elk-1, DARPP-32, DNM1L, SSH1L and KLHL3.'
