id: Q08209
gene_symbol: PPP3CA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PPP3CA encodes calcineurin A alpha (CnA-alpha), one of three catalytic subunits of calcineurin
  (protein phosphatase 2B, EC 3.1.3.16), a Ca2+/calmodulin-activated protein serine/threonine phosphatase
  of the PPP family with a Fe3+/Zn2+ binuclear metal active site. CnA-alpha forms an obligate heterodimer
  with the Ca2+-binding regulatory subunit calcineurin B (PPP3R1); Ca2+ binding to CnB and Ca2+/calmodulin
  binding to the CaM-binding domain in the CnA regulatory region displace the C-terminal autoinhibitory
  domain from the active site. Substrates and regulators dock through PxIxIT motifs (pocket on CnA) and
  LxVP motifs (CnA/CnB interface), the latter being the site blocked by FKBP12-FK506 and cyclophilin-cyclosporin
  A. The best-known substrates are the NFATc transcription factors, whose dephosphorylation drives nuclear
  import and gene expression in T cell activation, cardiac hypertrophy, skeletal muscle fiber-type specification
  and neuronal plasticity; other direct substrates include Elk-1, DARPP-32, DNM1L (mitochondrial fission),
  SSH1L (cofilin activation), CRTCs, KLHL3 (renal WNK4/NCC regulation) and c-Myc. CnA-alpha is predominantly
  cytosolic and is anchored to specific sites by AKAP79/AKAP5 at the plasma membrane and dendritic spines
  and by calsarcins at the sarcomeric Z-disc. De novo PPP3CA variants cause neurodevelopmental disorders:
  catalytic-domain loss-of-function variants cause developmental and epileptic encephalopathy, and autoinhibitory-domain
  gain-of-function variants cause ACCIID syndrome.'
