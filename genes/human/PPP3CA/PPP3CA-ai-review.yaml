  findings:
  - statement: Calcineurin is a Ca2+/calmodulin-dependent Ser/Thr protein phosphatase acting through PxIxIT
      and LxVP substrate docking motifs.
    supporting_text: Calcineurin is a **Ca2+/calmodulin-dependent Ser/Thr protein phosphatase** that removes
      phosphate from serine/threonine residues of protein substrates
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Falcon report, used as leads only. Mostly secondary reviews (Lim 2023, Nolze 2023,
      Fonodi 2024) and clinical calcineurin-inhibitor trials; two primary papers (Masaki 2023, Castiglioni
      2024) were traced and cached. Minor error: gives the metal cofactors as Zn2+ and Fe2+, whereas UniProt
      and the crystal structures give Fe3+/Zn2+. No annotation action changed because of the report.'
