- description: Calmodulin binding through the CaM-binding domain of the CnA regulatory region, the activating
    input that relieves autoinhibition.
  molecular_function:
    id: GO:0005516
    label: calmodulin binding
  in_complex:
    id: GO:0005955
    label: calcineurin complex
  supported_by:
  - reference_id: PMID:18384083
    supporting_text: Upon binding of Ca2+ and calmodulin (Ca2+/CaM) to CaMBD, the autoinhibitory domains
      dissociate from the catalytic groove, thus activating the enzyme.
  - reference_id: PMID:24191726
    supporting_text: CaM binds CaN's regulatory domain (RD) and causes a conformational change that removes
      CaN's autoinhibitory domain (AID) from its catalytic site, activating CaN.
  - reference_id: PMID:19404396
    supporting_text: a high-resolution crystal structure of a complex between CaM and the CaM-binding
      domain of calcineurin A
suggested_questions:
- question: To what extent are PPP3CA (CnA-alpha) and PPP3CB (CnA-beta) functionally redundant for NFAT
    dephosphorylation in human T cells, given that the alpha holoenzyme shows higher catalytic efficiency
    toward Elk-1 but similar NFAT kinetics in vitro (PMID:19154138)?
- question: Should the calcineurin-NFAT signaling cascade (GO:0033173) be linked to T cell receptor signaling
    pathway (GO:0050852) in a GO-CAM or module, so that PPP3CA is represented in TCR signaling through
    its NFAT phosphatase activity rather than through a direct GO:0050852 annotation?
- question: The PMID:11005320 annotations (IDA enzyme binding, IDA calmodulin binding, IMP calcineurin-mediated
    signaling, IPI protein dimerization) cite a short SSCP polymorphism report; can a curator with the
    full text confirm what experiment supports them?
- question: Is a nuclear pool of PPP3CA (Reactome CaN:CaM:NFAT nuclear translocation) supported experimentally
    in human cells?
suggested_experiments:
- description: Isoform-selective knockout or degron depletion of PPP3CA versus PPP3CB in primary human
    CD4+ T cells, with NFATc1/NFATc2 dephosphorylation, nuclear import and IL2 expression readouts after
    TCR stimulation, to define isoform contributions.
- description: Phosphoproteomics in neurons expressing DEE-associated catalytic-domain loss-of-function
    versus ACCIID autoinhibitory-domain gain-of-function PPP3CA variants, to identify substrates whose
    dephosphorylation underlies the distinct phenotypes.
