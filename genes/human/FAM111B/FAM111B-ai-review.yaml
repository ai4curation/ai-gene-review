id: Q6SJ93
gene_symbol: FAM111B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAM111B is a predominantly nuclear serine endopeptidase with intrinsic self-cleavage activity.
  A smaller pool associates with the nuclear periphery near nuclear pore complexes, and cytoplasmic protein
  is also detected. Loss of FAM111B disrupts nuclear architecture, chromosome stability and telomere maintenance
  in human cell models; protease-active FAM111B is required to rescue the tested ultrafine-bridge phenotype.
  Its physiological cleavage targets remain unidentified. Substitutions associated with hereditary fibrosing
  poikiloderma can increase protease activity and disrupt DNA synthesis, transcription and cell survival.
  The respective activities and localization of the natural 734- and 704-residue products remain unresolved.
