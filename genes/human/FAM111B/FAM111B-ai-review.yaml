  review:
    summary: Purified wild-type human FAM111B directly performs controlled self-cleavage.
    action: NEW
    reason: PMID:32776417 Results Human FAM111A and FAM111B are active proteases, Figure 1H, Figure EV1E/G
      and Purification of recombinant FAM111 proteins describe full-length human FLAG-FAM111B purified
      from yeast JEL-1. Fragment formation in the wild-type preparation is lost with catalytic D544N and
