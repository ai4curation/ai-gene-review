      a required gene. This supports protein autoprocessing under the tested biochemical conditions. The
      current term includes processing carried out by the protein itself; it does not require proof that
      the observed cleavage is an obligatory physiological maturation step. Same-role annotation checks
      find this term on human FAM111A and HTRA2, while CAPN1 lacks an exact-term record in the bounded
      query; the proposal rests on the target assay rather than assumed pathway completeness. No existing
      FAM111B process assertion is an ancestor or descendant of this term, and the fixed-head GO-CAM index
      has no target entry. The assay does not resolve intramolecular versus intermolecular cleavage, physiological
