core_functions:
- description: Catalyzes internal peptide-bond cleavage, demonstrated by controlled self-cleavage of purified
    full-length human FAM111B with catalytic-mutant and inhibitor controls. The predominantly nuclear
    protein supports genome integrity in human cell models, but the physiological trans-substrate and
    the reaction linking proteolysis to nuclear or telomere phenotypes remain unresolved. Nuclear-peripheral
    localization is a spatial observation, not evidence of a lamin complex or of direct cleavage of a
    nuclear-pore protein. This self-processing is a directly executed reaction; its physiological purpose
    and whether cleavage occurs within one molecule or between FAM111B molecules remain unresolved.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  locations:
  - id: GO:0005634
    label: nucleus
