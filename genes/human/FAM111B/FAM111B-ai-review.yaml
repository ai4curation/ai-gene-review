  review:
    summary: The ancestral chromatin assertion is traceable, but chromatin association of human FAM111B
      remains unresolved at the resolution of the inspected target experiments.
    action: UNDECIDED
    reason: The actual PANTHER v19 tree, exact human FAM111B sequence and matching chromatin IBD at PTN002683271
      are verified. PMID:24561620 supplies positive FAM111A nascent-chromatin and PIP-dependent PCNA evidence;
      donor count is not a measure of its validity. PMID:32776417 Results on hereditary fibrosing poikiloderma
      reports that FAM111B lacks a recognizable PIP-box and is not enriched at DNA replication sites (Figure
      EV5A). Its depletion/knockout experiments also find normal basal DNA replication, PCNA chromatin
      loading and proliferation (Appendix Figure S2 as described in the main Results). Crucially, the
      paper reports the same basal dispensability for FAM111A, whose obstacle-dependent activity is independently
      established; this negative alone cannot refute the inherited stress-dependent claim. Only patient-associated
      FAM111B alleles, not wild type, produce the reported shutdown of DNA synthesis/transcription and
      associated toxicity. These mutant gain-of-activity phenotypes are not evidence that wild-type FAM111B
      normally performs the donor function. Current GO:0000785 denotes the organized chromosome-forming
      DNA-protein complex. PMID:37342232 Results 2.1/Figure 1 separates soluble material from a pellet
      that can include both chromatin and membranes, while detergent-resistant peripheral FAM111B associates
      with nuclear-pore components rather than lamins. These positive nuclear/peripheral observations
      do not resolve a chromatin-specific pool. Lack of replication-site enrichment supports a difference
      from the donor recruitment mechanism without excluding every chromatin interaction. Retain UNDECIDED
      because target-specific compartment applicability remains unresolved, not because the ancestral
      path is invalid or a universal loss has been demonstrated.
