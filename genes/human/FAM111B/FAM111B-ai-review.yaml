- term:
    id: GO:0031297
    label: replication fork processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002683271
  - UniProtKB:Q96PZ2
  review:
    summary: Verified inheritance of the fork-processing assertion is retained, but target-specific participation
      in restoring stalled replication forks is unresolved.
    action: UNDECIDED
    reason: 'The source IBD at PTN002683271 and the exact target path are verified. PMID:32165630 supports
      the FAM111A donor through replication-track progression under camptothecin or PARP-trapping stress,
      with rescue dependent on protease activity, PCNA interaction and ssDNA binding. GO:0031297 specifically
      concerns restoration and restart of a stalled replication fork. PMID:32776417 Results on hereditary
      fibrosing poikiloderma reports that FAM111B lacks a recognizable PIP-box and is not enriched at
      DNA replication sites (Figure EV5A). Its depletion/knockout experiments also find normal basal DNA
      replication, PCNA chromatin loading and proliferation (Appendix Figure S2 as described in the main
      Results). Crucially, the paper reports the same basal dispensability for FAM111A, whose obstacle-dependent
      activity is independently established; this negative alone cannot refute the inherited stress-dependent
      claim. Only patient-associated FAM111B alleles, not wild type, produce the reported shutdown of
      DNA synthesis/transcription and associated toxicity. These mutant gain-of-activity phenotypes are
      not evidence that wild-type FAM111B normally performs the donor function. PMID:37342232 Results
      2.4 explicitly concludes that FAM111B is dispensable for DNA repair in the tested setting: MCF7
      knockouts were not more sensitive to the tested replication/transcription inhibitors and DNA-damaging
      agents in a 72-hour resazurin assay. U2OS knockout growth defects prevented the same comparison
      in U2OS. Those survival endpoints do not directly measure fork restart. Positive U2OS mitotic DNA
      synthesis/ultrafine-bridge and telomere phenotypes, including wild-type versus protease-dead rescue,
      establish a protease-dependent genome-integrity role without identifying the stalled-fork restoration
      step. The target evidence warrants caution about functional divergence while leaving this specific
      inherited assertion UNDECIDED; it neither proves the donor mechanism in FAM111B nor establishes
      its absence under every obstacle or cell context.'
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:32165630
    - reference_id: PMID:32776417
    - reference_id: PMID:37342232
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002683271
        source_status: UNRESOLVED
        comment: Target descent from PTN002683271 and the actual FAM111A-derived fork-processing IBD are
          verified. Donor stressed-fork evidence is sound; target assays address partly different endpoints
          and suggest functional differences without demonstrating universal loss. Functional applicability,
          not tree placement, remains unresolved.
