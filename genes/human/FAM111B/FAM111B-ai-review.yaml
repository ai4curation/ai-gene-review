suggested_questions:
- question: Which endogenous substrates are directly cleaved by FAM111B, and how do those reactions connect
    controlled protease activity to nuclear architecture, chromosome stability and telomere maintenance?
- question: Does FAM111B participate directly in chromatin-associated fork recovery or DNA–protein crosslink
    removal under particular conditions, or do the observed genome-integrity effects arise through a distinct
    nuclear-peripheral mechanism?
- question: How do the natural 734- and 704-residue products differ in abundance, localization, protease
    regulation and contribution to cellular phenotypes?
suggested_experiments:
- description: Combine endogenous-level wild-type and catalytic-inactive FAM111B replacement with cleavage-site
    proteomics in matched human cells. Reconstitute cleavage of candidate substrates with purified human
    FAM111B, catalytic controls and inhibitor controls, measuring mapped peptide products separately from
    binding, protein abundance and nuclear or telomere phenotypes. Include self-cleavage as an assay control
    rather than assuming it identifies the physiological reaction.
  hypothesis: A direct substrate should yield reproducible FAM111B-dependent cleavage products in a defined
    system and show a mechanistically linked cellular phenotype; changes in abundance or co-association
    alone may instead reflect indirect effects.
- description: Compare matched human cell backgrounds with controlled FAM111B depletion and endogenous-level
    rescue, balancing basal proliferation and cell-cycle state. Measure chromatin-specific association,
    replication-track recovery and covalent DNA–protein adduct removal directly alongside nuclear-peripheral
    organization and the existing metabolic-survival endpoint. Use FAM111A perturbation as a mechanistic
    comparator without substituting its substrates or recruitment mechanism for those of FAM111B.
  hypothesis: A condition-specific fork or adduct-removal role would require a positive direct endpoint
    beyond drug survival; dissociation of those endpoints from peripheral or telomere defects would support
    a distinct mechanism without implying universal absence of an ancestral function.
- description: Establish product-specific endogenous expression with validated transcript and protein
    measurements, then compare matched levels of sequence-verified 734- and 704-residue products in localization,
    controlled protease and rescue assays. Distinguish natural products from engineered fragments, tags
    and hyperactive disease mutants, and control for differences in protein stability.
  hypothesis: The 30-residue N-terminal difference may alter regulation or distribution without requiring
    a different catalytic specificity; equivalent behavior is an outcome to test, not a premise of the
    experiment.
