  review:
    summary: The serine mechanism is incompatible with CTSK catalysis.
    action: REMOVE
    reason: The actual R-HSA-1592362 path assigns the shared catalyst activity 1604695 to a
      heterogeneous MMP3/CTSK/CTSV set. Its GO:0004252 serine-nucleophile label does not describe
      human CTSK, a papain-family cysteine endopeptidase. Official sequence features and the
      exact human mature-chain structure 1MEM identify the catalytic cysteine; the deposited
      inhibitor is covalently linked to its sulfur. Remove this mechanistically wrong MF transfer
      while retaining independently supported extracellular matrix roles and locations.
