suggested_questions:
- question: Why do the current PANTHER leaf GO-slim display fields mark CTSK catalytic and protein-catabolic
    terms NOT when the actual positive PTN000274640 IBDs have no relevant loss record on the
    CTSK path and human enzymology supports activity?
- question: Can the human tissue and recombinant-reagent identities in the complete original
    thyroid study be confirmed, while retaining its reported thyroglobulin-cleavage and localization
    observations?
- question: What CTSK-specific mechanism explains its human mitophagy-screen hit, and can it
    be distinguished from general lysosomal proteolysis without transferring the SREBF1 mechanism?
- question: Can the mixed Reactome catalyst sets be given chemistry compatible with their individual
    members, including CTSK’s cysteine mechanism, while preserving valid extracellular compartments
    and substrate contexts?
- question: Does CTSK-mediated degradation of bone matrix warrant a separate bone-resorption
    annotation beyond the existing collagen-catabolism and matrix-disassembly coverage, given
    that current human MMP9, MMP13 and MMP14 matrix-protease comparators also lack the bone-resorption
    term in the captured queries?
suggested_experiments:
- description: Test CTSK depletion and rescue with wild-type and catalytically inactive CTSK
    in the original mitophagy assay, measuring lysosomal competence, mitochondrial clearance
    and Parkin recruitment separately.
- description: Measure collagen and other matrix-protein cleavage under matched extracellular
    pH and glycosaminoglycan conditions, distinguishing substrate engagement from stable noncatalytic
    binding.
status: DRAFT
