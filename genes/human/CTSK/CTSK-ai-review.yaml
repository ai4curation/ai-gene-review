- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: HMP
  original_reference_id: PMID:24912190
  qualifier: involved_in
  review:
    summary: CTSK is a validated human RNAi-screen hit retained as contextual mitophagy involvement.
    action: KEEP_AS_NON_CORE
    reason: The original Results and Table 1 identify CTSK among 20 human hits in YFP-Parkin
      HeLa cells. Triplicate siRNA screening required scores more than three standard deviations
      from the negative control for both early Parkin translocation and later mitochondrial
      clearance after CCCP. This supports the existing HMP inference of contextual involvement.
      It does not establish a CTSK-specific mitochondrial substrate, direct mitochondrial proteolysis,
      selectivity for mitophagy, or a conserved core mechanism. The subsequent low-throughput
      rescue, lipogenesis and PINK1 experiments concern SREBF1 and other named factors, not
      CTSK. No independent contradiction of the CTSK screen result was found; a nonspecific
      lysosomal-flux explanation is not demonstrated by the inspected experiments.
    supported_by:
    - reference_id: PMID:24912190
    - reference_id: file:human/CTSK/CTSK-source-evidence.yaml
