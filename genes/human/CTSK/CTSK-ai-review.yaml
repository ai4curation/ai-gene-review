id: P43235
gene_symbol: CTSK
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTSK encodes cathepsin K, a papain-family cysteine endopeptidase synthesized as
  a 329-residue secretory precursor and processed to a mature 215-residue enzyme. It acts in
  lysosomal compartments and after secretion, with a prominent role in osteoclast degradation
  of collagen-rich bone matrix. Its proteolysis extends to several extracellular matrix proteins,
  and glycosaminoglycans modulate its collagenolytic activity. Specialized thyroid pools also
  participate in thyroglobulin proteolysis and hormone liberation. Loss of CTSK function causes
  pycnodysostosis, characterized by impaired bone remodeling and brittle, dense bone.
