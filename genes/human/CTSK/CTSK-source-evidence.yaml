catalytic_reconciliation:
  terms:
    retained: https://www.ebi.ac.uk/QuickGO/term/GO:0004197
    rejected_mechanism: https://www.ebi.ac.uk/QuickGO/term/GO:0004252
  conclusion: Human CTSK uses a cysteine nucleophile, not the serine triad required by GO:0004252.
    The three original serine TAS assertions are incompatible mechanism transfers, not uncertainty
    caused by an inaccessible article. Broad peptidase assertions are refined to cysteine endopeptidase.
  deposit_access: The 9033587 publication cache has no abstract and the paper was not read.
    Its associated 1MEM entry, polymer sequence and deposited coordinates were inspected separately.
