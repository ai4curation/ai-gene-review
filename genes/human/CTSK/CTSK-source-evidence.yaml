followup_assessment:
  mitophagy: The existing positive HMP assertion is contextual NC. The human Table 1 result
    is real; absence of a CTSK-specific mechanistic follow-up does not by itself contradict
    it. Neither direct mitochondrial proteolysis nor a nonspecific lysosomal-flux mechanism
    is established.
  collagen_binding: Non-core substrate engagement, consistent with the fibronectin/perlecan
    decisions. The single catalytic core retains collagen catabolism; no additional binding
    core.
  bone_scope:
    term: https://www.ebi.ac.uk/QuickGO/term/GO:0045453
    parent: https://www.ebi.ac.uk/QuickGO/term/GO:0046849
    typed_relationship: GO:0045453 part_of GO:0046849
    evidence: PMID:19834056 directly measures recombinant human CTSK digestion of collagen and
      mouse bone powder; mouse osteoclast/dentine and knockout experiments remain separately
      scoped. CTSK performs organic-matrix proteolysis, rather than merely being an affected
      substrate.
    comparison: Fresh human GO:0045453 descendant queries returned zero annotations for CTSK/P43235,
      MMP9/P14780, MMP13/P45452 and MMP14/P50281. Positive controls returned 82 human process
      records and 65 MMP13 annotations, so empty comparisons are not a failed service response.
      These are role-relevant extracellular matrix proteases, not identical osteoclast contexts.
    decision: No NEW or added core BP. The process relationship and comparative absence favor
      retaining the existing performed-chemistry coverage and asking a targeted annotation-scope
      question; absence is not treated as proof that CTSK never contributes to bone resorption.
  broad_processes: The two proteolysis and four protein-catabolism source assertions remain
    ACCEPT. Human cleavage of multiple matrix substrates plus thyroid protein catabolism supports
    their broader scope; replacing every source assertion with collagen catabolism would discard
    genuine noncollagen substrates. The core already selects more specific processes. The MF
    refinements correct enzyme chemistry and are not a rule requiring each independent broad
    BP source to be narrowed.
  surface_location: PMID:11082042 adds explicit abstract-level apical membrane and active surface-pool
    support to row 35. Its unresolved species/genotype details are distinct from the mouse Ctsb-deficient
    localization in PMID:12782676.
