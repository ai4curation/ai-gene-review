id: P05997
gene_symbol: COL5A2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL5A2 encodes the alpha-2 chain of type-V collagen, a secreted fibrillar extracellular-matrix protein. Its principal assembly contains two alpha-1(V) chains and one alpha-2(V) chain. Type-V collagen participates in heterotypic fibrils with type-I collagen and helps organize their architecture. The alpha-2 chain supports efficient incorporation of type-V collagen into the matrix; disruption of its structure alters fibril assembly and connective-tissue integrity, causing classical Ehlers-Danlos syndrome. Its structural contribution is particularly important in skin and corneal connective tissue. The precursor passes through the secretory pathway before extracellular processing and matrix incorporation.
