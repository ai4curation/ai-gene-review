        source_status: SUPPORTS_TRANSFER
        comment: Official IPR000885 response maps collagen C-terminal domain to the structural parent. The specific replacement is independently supported by COL5A2 assembly and the current collagen convention.
      root_cause: TERM_SCOPING_PROBLEM
