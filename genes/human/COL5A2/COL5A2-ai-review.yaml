    label: extracellular matrix structural constituent
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000885
  review:
    summary: Specify the collagen tensile-strength structural class.
    action: MODIFY
    reason: The original InterPro IPR000885 collagen C-terminal-domain mapping supports matrix structural activity. Human COL5A2 variants impair type-V assembly, and actual mouse Col5a2 pN-mutant matrix experiments show defective heterotrimer incorporation and abnormal type-I/V fibril organization. The current GO:0030020 comment explicitly permits extracellular-matrix collagens. This refinement does not present proteomic detection as an isolated-chain tensile assay.
    supported_by:
    - reference_id: PMID:9425231
    - reference_id: PMID:9783710
    - reference_id: PMID:15199158
    proposed_replacement_terms:
