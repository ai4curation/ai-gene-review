core_functions:
- description: Contributes the alpha-2(V) chain to type-V collagen heterotrimers and their incorporation into heterotypic extracellular fibrils, organizing matrix architecture and mechanical integrity. Human mutation evidence and mouse alpha2(V)-defective matrix studies support this structural assembly role; altered secretion, stability and assembly are not all experimentally separable in the mouse allele. Processing of the precursor is performed by other proteins.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005588
    label: collagen type V trimer
  locations:
  - id: GO:0031012
    label: extracellular matrix
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  supported_by:
  - reference_id: PMID:9425231
  - reference_id: PMID:9783710
  - reference_id: PMID:15199158
    supporting_text: the alpha1(V) homotrimer is excluded from incorporation into the heterotypic collagen fibrils
  - reference_id: PMID:21421911
suggested_questions:
- question: Which alpha2(V) interfaces determine incorporation of type-V heterotrimers into type-I/V fibrils, separately from effects on intracellular stability and secretion?
- question: Does the alpha2(V) chain participate in a native SMAD-binding mechanism, and which sequence-defined product and cellular compartment support that interaction?
- question: Which chain and receptor mediate the collagen-V-dependent reduction of endoderm differentiation observed in human stem-cell matrix assays?
suggested_experiments:
- description: Compare sequence-defined wild-type and disease-associated human alpha2(V) chains in matched heterotrimer assembly, secretion and matrix-incorporation assays, with chain-resolved mass spectrometry and fibril imaging.
- description: Test defined type-V chain compositions in the human stem-cell differentiation assay with receptor perturbations and matched matrix presentation, separating alpha2(V) contribution from whole-collagen effects.
status: DRAFT
