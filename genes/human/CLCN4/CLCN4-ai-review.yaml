id: P51793
gene_symbol: CLCN4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLCN4 encodes ClC-4, a voltage-dependent chloride:proton exchanger of intracellular membranes.
  Association with ClC-3 shapes its stability and routes it to endosomal, recycling-endosomal and lysosomal
  compartments, while unpartnered ClC-4 can accumulate in the endoplasmic reticulum. TMEM9-family partners
  further couple transporter stability to regulation of transport activity. ClC-4 supports neuronal endomembrane
  ion homeostasis. Pathogenic CLCN4 variants cause an X-linked neurodevelopmental disorder with intellectual
  disability and variable epilepsy and behavioral features; their effects on transport depend on voltage,
  pH and the associated ClC-3 partner.
