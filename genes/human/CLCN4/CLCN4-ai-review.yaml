      Historical family-tree, MSA and IBD reconstruction is unavailable; target self-inclusion is legitimate,
      not circular.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current source records authenticate the PAINT nodes and experimental descendant grounding.
      Historical family-tree, MSA and IBD reconstruction is unavailable; target self-inclusion is legitimate,
