references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro-based family, transporter and membrane mappings identify CLC transport biology
      but do not by themselves distinguish a channel from a coupled chloride/proton exchanger.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: InterPro-based family, transporter and membrane mappings identify CLC transport biology
      but do not by themselves distinguish a channel from a coupled chloride/proton exchanger.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings:
  - statement: The original ISS annotation names rat Clcn4 P51794; its current experimental early-endosome
      record is authenticated separately from the human sorting experiments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original ISS annotation names rat Clcn4 P51794; its current experimental early-endosome
      record is authenticated separately from the human sorting experiments.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
