- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: Current ARBA00026476 conditions match target sets 1 and 9; its channel output is refined
      using direct exchange evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current ARBA00026476 conditions match target sets 1 and 9; its channel output is refined
      using direct exchange evidence.
- id: PMID:10564087
  title: Identification of an acid-activated Cl(-) channel from human skeletal muscles.
  findings:
  - statement: The recovered abstract reports an acid-activated outward current from a human skeletal-muscle
      clone expressed in CHO cells. That positive observation is preserved while later direct proton assays
      resolve the exchange mechanism.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract directly reports human-clone-dependent currents. Full Methods
      and Results were not recovered; proton coupling is supported by the later exchange study, not assigned
      to this original assay.
- id: PMID:17023393
  title: The human ClC-4 protein, a member of the CLC chloride channel/transporter family, is localized
    to the endoplasmic reticulum by its N-terminus.
  findings:
  - statement: Full-length tagged human ClC-4 localizes with ER markers and fractions in HEK293 cells;
      separate mouse-brain fractionation is concordant. The early N-terminal retention model is distinguished
      from later partner-dependent sorting and CBS-linker results.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: External original Methods and Results support human HEK293 ER localization and separate
      mouse-brain fractionation. The selected repository cache remains abstract-only. The author-uploaded
      full text is readable at https://www.researchgate.net/publication/6772446 (Plasmids, human ClC-4
      localization and mouse-brain fractionation sections). Its proposed N-terminal determinant is distinct
      from the later partner-sorting model.
- id: PMID:23647072
  title: Exome sequencing reveals new causal mutations in children with epileptic encephalopathies.
  findings:
  - statement: Human G544R ClC-4 has greatly reduced oocyte current, with human HeLa localization and
      construct controls examined. Proton coupling is not directly measured by that experiment.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text human WT/G544R expression experiments support altered currents and localization;
      they do not directly measure proton coupling. The selected cache contains the inspected functional
      Results and Methods.
- id: PMID:25644381
  title: X-exome sequencing of 405 unresolved families identifies seven novel intellectual disability
    genes.
  findings:
  - statement: Human variant oocyte-current measurements support altered transport. Mouse neuronal knockdown/rescue
      and knockout morphology are separate evidence and do not establish another molecular activity.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text human variant-current assays and mouse neuronal experiments were assessed
      separately. Neuronal morphology is not direct evidence for another human molecular activity.
- id: PMID:27550844
  title: De novo and inherited mutations in the X-linked gene CLCN4 are associated with syndromic intellectual
    disability and behavior and seizure disorders in males and females.
  findings:
  - statement: Human WT and variant ClC-4 show ER localization in COS-7 cells and variant-dependent oocyte
      currents; most tested variants reduce current, whereas Asp15Asn is WT-like. Structural interpretation
      uses an algal model.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text functional experiments distinguish human COS-7 localization and oocyte currents
      from algal structural modeling. Asp15Asn retained WT-like activity under the tested conditions.
- id: PMID:28972156
  title: Preferential association with ClC-3 permits sorting of ClC-4 into endosomal compartments.
  findings:
  - statement: Human long ClC-4 associates with mouse ClC-3 splice variants, which determine endolysosomal
      versus recycling targeting. Unpartnered long protein accumulates in the ER; the tested short form
      is poorly expressed and lacks measured currents under these conditions.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text Results and Methods directly support partner-dependent sorting of human long
      ClC-4, including the mouse-astrocyte host comparison. The short construct had low expression; absent
      measured currents do not establish universal inactivity.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: The systematic human binary-interaction screen includes an exact positive CLCN4–ABHD5 pair
      in three literal two-hybrid records. General orthogonal validation of the dataset is not automatically
      assigned to this pair.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The screen is supported by three exact positive CLCN4–ABHD5 IntAct records. Dataset-wide
      validation is not assigned as a separate orthogonal test of this pair, and no native regulatory
      mechanism follows from the association.
- id: PMID:8069296
  title: A gene from the Xp22.3 region shares homology with voltage-gated chloride channels.
  findings:
  - statement: The original cloning study describes a predicted 760-residue protein homologous to voltage-gated
      chloride channels; the recovered abstract does not demonstrate coupled proton transport.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete abstract supports cloning and channel-family homology. Full original experimental
      details were not recovered; the later exchange mechanism is assessed independently.
- id: Reactome:R-HSA-2730692
  title: CLCN4/5/6 exchange Cl- for H+
  findings:
  - statement: The P51793 target is an alternative catalyst-set member for endosomal chloride/proton exchange,
      not a transported solute or an obligate CLCN4/5/6 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The P51793 target is an alternative catalyst-set member for endosomal chloride/proton
      exchange, not a transported solute or an obligate CLCN4/5/6 complex.
- id: Reactome:R-HSA-983712
  title: Ion channel transport
  findings:
  - statement: The broad ion-transport pathway contains the explicit CLC exchange reaction and its endosome-membrane
      P51793 entity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The broad ion-transport pathway contains the explicit CLC exchange reaction and its
      endosome-membrane P51793 entity.
- id: PMID:16034421
  title: Chloride/proton antiporter activity of mammalian CLC proteins ClC-4 and ClC-5.
  findings:
  - statement: Independent surface-pH experiments identify ClC-4/5 proton export; the authentic abstract
      supports exchange, while the original full Methods were not recovered.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract reports proton export by ClC-4/5. Full original Methods and exact
      ClC-4 construct details were not recovered.
- id: PMID:16034422
  title: Voltage-dependent electrogenic chloride/proton exchange by endosomal CLC proteins.
  findings:
  - statement: Voltage-clamp and pH measurements directly show ClC-4-dependent proton transport against
      its gradient. Mutant and channel controls distinguish coupling; the reported stoichiometry estimate
      is rough rather than a precise 2:1 determination.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: External original Results, figure legends and Methods directly establish ClC-4-dependent
      proton transport against its gradient. The selected repository cache remains abstract-only. The
      complete author PDF is available at https://leibniz-fmp.de/fileadmin/Data/Molecular_Physiology_Cell_Biology/Thomas_J._Jentsch/Publications/nature_2005_antiport.pdf
      (journal pages 424–427). The coupling estimate is rough and does not precisely determine a 2:1 ratio.
- id: PMID:40169677
  title: Endosomal chloride/proton exchangers need inhibitory TMEM9 β-subunits for regulation and prevention
    of disease-causing overactivity.
  findings:
  - statement: TMEM9-family proteins affect CLC transporter abundance and inhibit transport. Human ClC-4
      association and targeted ClC-3 transport-dead/ClC-4 vacuolization assays supply target evidence;
      numerous other assays concern ClC-3 or ClC-5 and are kept separate.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text human ClC-4 association and targeted vacuolization experiments support TMEM9-family
      regulation. Many current and domain-mapping experiments instead concern ClC-3/5; their outcomes
      are not reassigned to ClC-4.
- id: PMID:41439993
  title: Dominant Action of CLCN4 Neurodevelopmental Disease Variants in Heteromeric Endosomal ClC-3/ClC-4
    Transporters.
  findings:
  - statement: Human ClC-4 disease variants alter transport with mouse ClC-3c in voltage- and pH-dependent
      ways. Some effects differ from the corresponding homomer currents, limiting simple loss-of-function
      classifications.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text human ClC-4 with mouse ClC-3c experiments support voltage-, pH- and assembly-dependent
      variant effects. These are not native human-neuron or all-product measurements.
- id: PMID:40605603
  title: Endosomal 2Cl-/H+ exchangers regulate neuronal excitability by tuning Kv7/KCNQ channel density.
  findings:
  - statement: Mouse Clcn4 loss changes hippocampal network activity with regional specificity. The proposed
      downstream channel-trafficking model remains a hypothesis rather than an additional demonstrated
      human ClC-4 activity.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text mouse knockout electrophysiology supports regional neuronal effects. The downstream
      channel-trafficking model remains proposed rather than an additional demonstrated human ClC-4 activity.
