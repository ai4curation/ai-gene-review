suggested_questions:
- question: How do endogenous ClC-3 isoforms, TMEM9-family occupancy, voltage and luminal pH jointly set
    ClC-4 transport in human neuronal endosomes?
- question: What are the abundance, localization and transport roles of the shorter human CLCN4 product
    under native expression conditions?
- question: Which neuronal consequences of CLCN4 loss follow directly from altered organellar chloride/proton
    exchange, and which reflect secondary changes in partner stability or membrane trafficking?
suggested_experiments:
- description: Measure chloride and proton flux together in defined human ClC-4 assemblies with matched
    ClC-3 isoforms and TMEM9-family occupancy, using physiological endosomal voltage and pH ranges and
    independent surface/compartment abundance controls.
- description: Quantify endogenous long and short CLCN4 products in human neurons, then perform product-specific
    rescue with organellar ion sensors and compartment-resolved localization.
