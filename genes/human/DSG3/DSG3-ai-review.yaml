suggested_questions:
- question: What fraction of surface DSG3 is non-desmosomal in normal epithelium, and is
    the signalling pool a distinct species or simply cadherin not yet incorporated into
    desmosomes?
- question: Is DSG3 genuinely a component of tight junctions, or does it act on tight
    junctions indirectly through cortical actin and Rac1?
- question: Does DSG3 contribute to the cornified envelope or corneodesmosome in any
    epithelium, given that its expression is confined largely to the basal and spinous
    layers?
suggested_experiments:
- hypothesis: The non-junctional surface pool of DSG3, not the desmosomal pool, carries the
    Src and YAP signalling functions.
  description: Separate detergent-soluble and insoluble DSG3 pools after acute, reversible
    disruption of desmosomes, and test whether Src activation and phospho-YAP membrane
    retention track the soluble pool while adhesion strength tracks the insoluble pool.
- hypothesis: DSG3 trans-interacts homophilically as well as heterophilically with DSC3 at
    the keratinocyte surface.
  description: Single-molecule force spectroscopy with recombinant DSG3 and DSC3 ectodomains
    on living keratinocytes, in the presence and absence of calcium and of pemphigus
    vulgaris autoantibodies, measuring unbinding forces for each pairing.
- hypothesis: DSG3 is absent from the cornified envelope despite its membership in the
    cornification pathway.
  description: Immunogold electron microscopy and sequential-extraction immunoblotting of
    human epidermis, comparing DSG3 with DSG1 and DSC1 across the spinous, granular and
    cornified layers.
