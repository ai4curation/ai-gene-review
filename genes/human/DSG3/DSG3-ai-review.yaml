id: P32926
gene_symbol: DSG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Desmoglein-3 is a calcium-dependent desmosomal cadherin of stratified
  squamous epithelia, expressed throughout the basal and spinous layers of the epidermis
  and in oral, oesophageal and other mucosae. It is a single-pass type I membrane
  glycoprotein whose extracellular cadherin domains project from the cell surface and
  mediate adhesive trans-interactions between neighbouring keratinocytes, while its
  cytoplasmic tail couples the junction to the desmosomal plaque and the keratin
  intermediate filament network. Beyond the desmosomal pool, a detergent-soluble
  non-junctional pool at the cell surface acts as a signalling scaffold, regulating Src
  and E-cadherin at nascent adherens junctions, Rac1 and Cdc42 and cortical actin,
  p38MAPK-dependent keratinocyte migration, and membrane retention of phospho-YAP under
  mechanical strain. DSG3 is the autoantigen of pemphigus vulgaris, and loss of its
  adhesive function causes suprabasal acantholysis; loss in mice additionally releases
  telogen hairs from the follicle.
