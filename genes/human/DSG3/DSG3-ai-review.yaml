    label: desmosome assembly
  supported_by:
  - reference_id: PMID:19717567
    supporting_text: Desmocollin (Dsc) 1-3 and desmoglein (Dsg) 1-4, transmembrane proteins
      of the cadherin family, form the adhesive core of desmosomes.
  - reference_id: PMID:9701552
