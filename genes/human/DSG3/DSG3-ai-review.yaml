  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028309
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: DSG3 is a living-layer desmosomal cadherin, not a documented constituent of
      the cornified envelope.
    reason: The cornified envelope is the cross-linked protein scaffold of corneocytes, and
      its desmosomal residue, the corneodesmosome, is dominated by DSG1 and DSC1. DSG3 is
      expressed in the basal and spinous layers with only weak granular-layer expression,
      and no DSG3-specific localization experiment places it in the cornified envelope. The
      rule-based assignment follows family membership rather than observation.
    supported_by:
    - reference_id: file:human/DSG3/DSG3-uniprot.txt
      supporting_text: Expressed throughout the basal and spinous layer of the epidermis
        with weak expression in the granular layer
