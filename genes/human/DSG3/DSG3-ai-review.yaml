core_functions:
- description: Calcium-dependent adhesive cadherin of the desmosome. Its extracellular
    cadherin domains engage desmogleins and desmocollins on the opposing keratinocyte,
    while the cytoplasmic tail couples the junction to the plaque and the keratin
    cytoskeleton, giving stratified squamous epithelia their mechanical cohesion.
