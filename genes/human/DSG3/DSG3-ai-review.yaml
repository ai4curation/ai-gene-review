  - reference_id: file:human/DSG3/DSG3-uniprot.txt
    supporting_text: Homodimer (PubMed:19717567)
- description: Signalling scaffold at the keratinocyte surface. The non-junctional,
    detergent-soluble pool of DSG3 binds E-cadherin and RAC1 and assembles a complex with
    PKP1, YAP1 and YWHAG, through which it promotes adherens junction formation and
    cortical actin organisation, restrains p38MAPK signalling, and retains phospho-YAP at
    the plasma membrane during mechanical strain. The downstream processes are recorded as
    non-core annotations rather than as core processes of this activity.
