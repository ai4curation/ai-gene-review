suggested_questions:
- question: Does the calcium-homeostasis IBD at PTN000643505 describe a conserved ATP13A3 role, and what target-to-node placement or target-specific evidence supports retention or loss?
- question: What are the substrate selectivity and ATP-to-polyamine coupling ratio of purified ATP13A3, and which compartments support transport at endogenous expression?
- question: Do the annotated alternative products differ in expression or transport, given the source caution on product 2 and the absence of product-specific assays here?
suggested_experiments:
- hypothesis: Controlled reconstitution can distinguish intrinsic substrate transport from whole-cell uptake and endocytosis.
  description: Measure putrescine, spermidine and spermine flux in matched wild-type and D498N ATP13A3 preparations with defined orientation and gradients, ATP/no-ATP controls and parallel ATP hydrolysis. Separately test endogenous compartment-specific polyamine flux and calcium-homeostasis responses after controlled loss and rescue. These are proposed experiments, not reported results.
  experiment_type: Membrane reconstitution and compartment-specific cellular transport assays
