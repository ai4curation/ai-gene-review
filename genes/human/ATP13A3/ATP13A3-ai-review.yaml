description: ATP13A3 is a P5B-type ATPase that supports cellular uptake of polyamines, including putrescine, spermidine and spermine. Human ATP13A3 localizes predominantly to recycling endosomal membranes in studied expression systems, with additional early and late endosomal pools. Cellular uptake, complementation and endocytosis experiments support a role in releasing internalized polyamines from endosomes into the cytosol.
