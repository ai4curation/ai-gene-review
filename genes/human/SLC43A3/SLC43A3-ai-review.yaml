  - ensembl:ENSMUSP00000088227
  review:
    summary: Electronic transfer (Ensembl Compara) from the mouse ortholog A2AVZ9
      of a fatty-acid transport role that is itself only a "By similarity" regulatory
      statement, not a demonstrated fatty-acid transmembrane transport activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The direct experimental characterization of human SLC43A3 shows a facilitative,
      purine-selective nucleobase transporter that does not transport amino acids,
      and no study shows it carrying fatty acids across the membrane. The fatty-acid
      claim traces to the mouse ortholog's UniProt note that it "May regulate fatty
      acid (FA) transport in adipocytes... (By similarity)" — a putative regulatory
      role, not a transporter activity. Transferring this as fatty acid transmembrane
      transporter activity conflates a regulator with the transport machinery and
      over-states an inferred role. The claim is retained for the record but flagged
      as over-annotation rather than removed, because a regulatory contribution to
      adipocyte FA handling cannot be excluded.
    supported_by:
    - reference_id: file:human/SLC43A3/SLC43A3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: May regulate fatty acid (FA) transport in adipocytes,
    - reference_id: PMID:26455426
      supporting_text: none of them affected the adenine uptake activity of SLC43A3
        cells (see Supplementary Table S1 online), supporting a previous study indicating
        that SLC43A3 expression did not induce any amino acid transport activity in
        Xenopus oocytes
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:A2AVZ9
        source_label: Slc43a3 (mouse)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
