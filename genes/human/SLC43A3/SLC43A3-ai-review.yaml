proposed_new_terms: []
suggested_questions:
- question: What is the physiological consequence of SLC43A3/ENBT1 loss of function
    in humans, and does it contribute to hepatic or systemic purine homeostasis disorders?
- question: Does the mouse ortholog's reported role in regulating adipocyte fatty-acid
    transport reflect a direct molecular activity or an indirect/regulatory effect,
    and is any such role conserved in human SLC43A3?
suggested_experiments:
- description: Generate SLC43A3 knockout hepatocyte or intestinal models and measure
    endogenous purine nucleobase (adenine/guanine/hypoxanthine) flux and salvage-pathway
    flux to establish the in vivo physiological role.
- description: Directly test whether human SLC43A3 transports fatty acids (e.g. radiolabeled
    oleate uptake/efflux in a defined expression system) to confirm or refute the
    fatty-acid transport annotations inherited from the mouse ortholog.
- description: Use the recently determined cryo-EM structure (PDB 9L38) with mutagenesis
    to map the purine-nucleobase binding site and the determinants of purine-vs-pyrimidine
    and nucleobase-vs-amino-acid selectivity within the SLC43 family.
