  review:
    summary: Direct demonstration that SLC43A3 mediates saturable, Na+/H+-independent
      uptake of adenine; this is the activity that defines the protein (ENBT1).
    action: ACCEPT
    reason: Direct uptake assays in SLC43A3-expressing MDCKII/HEK293 cells showed
