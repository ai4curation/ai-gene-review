id: Q8NBI5
gene_symbol: SLC43A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC43A3 (also known as ENBT1/EEG1/FOAP-13) is a multi-pass plasma membrane
  protein of the solute carrier 43 family. Although it is classified by sequence homology
  within the SLC43 "system-L" amino acid transporter family (alongside LAT3/SLC43A1
  and LAT4/SLC43A2), it has been experimentally characterized as a sodium- and proton-independent
  (facilitative/equilibrative) purine-selective nucleobase transporter. It mediates
  the bidirectional, concentration-gradient-driven transport of the purine nucleobases
  adenine, guanine and hypoxanthine across the plasma membrane and does not transport
  nucleosides, pyrimidine nucleobases, xanthine, or (notably) amino acids. By supplying
  extracellular purine nucleobases to the intracellular salvage enzymes APRT and HPRT1,
  it supports the purine salvage pathway, and it is most highly expressed in the liver
  (localized to the basolateral/sinusoidal membrane of hepatocytes), lung and pancreas.
  As a purine analog transporter it also moves thiopurine drugs such as 6-mercaptopurine
  and azathioprine into and out of cells, making it pharmacologically relevant to thiopurine
  therapy.
