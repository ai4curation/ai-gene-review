id: P51690
gene_symbol: ARSL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARSL (arylsulfatase L, formerly ARSE) is a glycosylated sulfatase that acts in the Golgi
  lumen. It promotes removal of the 4-O-sulfate from chondroitin sulfate chains during proteoglycan maturation,
  linking glycan sulfation to cartilage and bone development. Its full physiological substrate range remains
  incompletely defined. Activity depends on a conserved catalytic cysteine that undergoes formylglycine
  maturation. ARSL also hydrolyzes artificial aryl-sulfate substrates. Pathogenic loss of function causes
  X-linked recessive chondrodysplasia punctata, with abnormal cartilage development and skeletal mineralization.
