    label: endoplasmic reticulum lumen
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028691
  review:
    summary: Retain ER-lumen localization during sulfatase maturation.
    action: KEEP_AS_NON_CORE
    reason: ARSL enters the secretory pathway and is a substrate of sulfatase maturation. The inspected
      Reactome precursor and modified human ARSE/P51690 participants are both placed in the ER lumen.
      This supports a processing-stage location, while mature enzyme activity is associated with the Golgi.
      Golgi localization does not negate transient ER residence. The exact ARBA rule predicates were not
      inspected; this judgment is independently supported by the human participant model.
    additional_reference_ids:
    - Reactome:R-HSA-1614362
