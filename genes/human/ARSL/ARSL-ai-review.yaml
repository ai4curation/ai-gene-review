- term:
    id: GO:0003943
    label: N-acetylgalactosamine-4-sulfatase activity
  evidence_type: IMP
  original_reference_id: PMID:42103217
  qualifier: enables
  review:
    summary: Propose the physiological GalNAc 4-O-desulfation activity supported by human ARSL rescue.
    action: NEW
    reason: Human wild-type ARSL, but not catalytic mutant C86A, corrects CS/DS 4-O-hypersulfation in
      rat RCS knockout cells. Golgi-enriched fractions from knockout and human-rescue cells also differ
      in their desulfation of added chondroitin sulfate. These complementary perturbation and fraction-assay
      results support the specific glycan activity. IMP records the human-construct rescue evidence; the
      experiment is not purified human enzyme kinetics or a complete substrate-range/endo-exo analysis.
      The current official GO definition describes GalNAc 4-sulfate hydrolysis in chondroitin/dermatan
      and contains no lysosomal-lumen clause; Golgi localization is preserved. This term is a sibling,
      not an ancestor or descendant, of the existing artificial aryl-sulfate activity. No direct TGF-beta
      signaling or new biological-process assertion is inferred.
    supported_by:
    - reference_id: PMID:42103217
      supporting_text: Reintroducing the wild-type but not the catalytically inactive hARSL (hARSL C86A)
        normalized 4-O-sulfation levels of CS/DS in RCS Arsl KO cells
      full_text_unavailable: false
    - reference_id: PMID:42103217
      supporting_text: 'To assess the ability of Arsl to directly desulfate chondroitin sulfate, we incubated
        exogenous CS molecules with Golgi-enriched fractions isolated from three RCS cell conditions:
        wild-type (WT), Arsl knockout (KO), and Arsl KO cells reconstituted with human ARSL (hARSL)'
      full_text_unavailable: false
    - reference_id: PMID:42103217
      supporting_text: Subsequent HPLC analysis of CS sulfation patterns revealed that 4-O-sulfation levels
        of CS were significantly elevated following incubation with Golgi fractions from Arsl KO cells,
        compared to those incubated with fractions from WT or hARSL-reconstituted cells
      full_text_unavailable: false
