id: P51690
gene_symbol: ARSL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARSL (arylsulfatase L, formerly ARSE) is a glycosylated sulfatase that acts in the Golgi
  lumen. Human ARSL rescue and Golgi-fraction experiments support 4-O-sulfated chondroitin as a likely
  physiological substrate, connecting sulfate removal during proteoglycan maturation with cartilage and
  bone development. Its activity depends on the conserved catalytic cysteine that undergoes formylglycine
  maturation. ARSL also hydrolyzes artificial aryl-sulfate substrates. Pathogenic loss of function causes
  X-linked recessive chondrodysplasia punctata, with abnormal cartilage development and skeletal mineralization.
existing_annotations:
- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:7720070
  qualifier: involved_in
  review:
    summary: Accept the role of ARSL in cartilage and skeletal development.
    action: ACCEPT
    reason: The original human genetic study connects loss of ARSL activity to CDPX. Recent human-enzyme
      rescue in rat chondrocytes and experiments on the medaka ortholog support a catalytic contribution
      through matrix glycan maturation. This is a review of the existing developmental assertion; the
      animal models are not human cartilage experiments.
    additional_reference_ids:
    - PMID:42103217
    supported_by:
    - reference_id: PMID:7720070
      supporting_text: 'Point mutations in one of these genes were identified in

        five patients with CDPX.'
      full_text_unavailable: true
