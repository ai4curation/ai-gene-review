core_functions:
- description: Rab11 effector and adaptor that links active Rab11 on recycling endosomes to the TRAPPIII
    complex (via TRAPPC8), supporting TRAPP-dependent RAB1 activation and a constitutive recycling-endosome-to-early-Golgi
    transport step that maintains the cycling pool of ATG9. Experimentally established in human cells;
    no GAP activity has been detected.
