  review:
    summary: IBA GTPase activator activity propagated from the family-root PAINT node PTN000537561 (PTHR47219),
      which is seeded by catalytically active TBC RabGAPs from yeast to human; TBC1D14 is not among the
      seeds.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'TBC1D14 sits inside PTHR47219 and keeps the TBC arginine finger (R472) and glutamine finger
      (Q508), so the root-node inference is phylogenetically reasonable. However, there is target-specific
      negative evidence: recombinant TBC1D14 showed no GAP activity against a panel of 47 Rabs, including
      its binding partner Rab11, and the Golgi/Shiga-toxin and autophagy effects of overexpression do
      not depend on the catalytic arginine (the R472A mutant still inhibits LC3 lipidation; the inactive
      point mutant blocks Shiga toxin transport). The TBC1D14-specific PAINT nodes (PTN000538677, PTN008586039),
      which are seeded by Q9P2M4 itself, carry location and autophagosome-assembly terms but no GAP term.
      Current evidence supports TBC1D14 acting as a Rab11 effector/TRAPP adaptor, not as a GAP. The data
      do not rule out GAP activity on an untested substrate, so this is flagged as over-annotation rather
      than removed.'
