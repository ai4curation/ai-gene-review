gene_symbol: TBC1D14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TBC1D14 is a TBC (Tre-2/Bub2/Cdc16) domain protein of the Rab GTPase-activating protein
  family. It is a peripheral membrane protein found on Rab11- and transferrin-receptor-positive recycling
  endosomes and on the Golgi apparatus, and it shifts towards the Golgi on amino-acid starvation. It keeps
  the TBC catalytic arginine and glutamine, but recombinant TBC1D14 has no detectable GAP activity towards
  47 Rabs, including Rab11, which it binds in the GTP-bound form. It acts instead as a Rab11 effector
  and adaptor: active Rab11 recruits it to recycling endosomes, and an N-terminal TRAPP-binding region
  (residues ~120-223) binds the TRAPPIII complex through TRAPPC8. This bridge supports TRAPP-dependent
  RAB1 activation and a constitutive transport step from peripheral recycling endosomes to the early Golgi
  that maintains the cycling pool of ATG9. Through this route TBC1D14 regulates starvation-induced autophagosome
  formation; its depletion increases starvation-induced LC3 lipidation, and its overexpression tubulates
  recycling endosomes and blocks autophagosome formation. It also binds the autophagy kinase ULK1, but
  its effect on ATG9 traffic is ULK1-independent.'
