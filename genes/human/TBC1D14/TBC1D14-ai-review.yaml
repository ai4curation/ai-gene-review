suggested_questions:
- question: TBC1D14 retains the TBC arginine and glutamine fingers yet shows no GAP activity on 47 Rabs.
    Is it a GAP for an untested Rab, or has its TBC domain been co-opted as a Rab11-binding effector module?
- question: Should the family-root GTPase activator activity IBA (PTN000537561) be blocked at the TBC1D14
    clade node, given the human negative biochemical data?
- question: Is 'molecular adaptor activity' the best MF for the Rab11-TRAPPIII bridge, or should a GO
    term for TRAPP complex binding be created?
suggested_experiments:
- description: Purify TBC1D14 TBC domain and test GAP activity on Rab1, Rab11 and the remaining Rabs with
    intrinsic hydrolysis controls; compare with an active TBC GAP carrying the same R/Q residues.
  experiment_type: in vitro biochemistry
- description: Reconstitute Rab11-GTP-dependent recruitment of TRAPPIII to liposomes with and without
    TBC1D14 or its TRAPP-binding region, and measure RAB1 GEF activity.
  experiment_type: in vitro reconstitution
- description: Knock out TBC1D14 in a zebrafish or cell model of a teleost and test ATG9 distribution
    and starvation-induced autophagy, to check conservation of the human mechanism for transfer to fish
    orthologs.
  experiment_type: genetic loss of function
