- term:
    id: GO:0071955
    label: recycling endosome to Golgi transport
  evidence_type: IMP
  original_reference_id: PMID:17562788
  qualifier: involved_in
  review:
    summary: 'IMP (Fuchs 2007): overexpressed TBC1D14 blocks Shiga toxin transport to the Golgi without
      affecting EGF uptake.'
    action: ACCEPT
    reason: 'The original evidence is an overexpression phenotype independent of the catalytic residue,
      which on its own would be weak. Lamb 2016 independently established the mechanism: TBC1D14 bridges
      Rab11-positive recycling endosomes to TRAPPIII, its depletion reduces RAB1 activation, and TBC1D14/TRAPPIII
      regulate a constitutive recycling-endosome-to-early-Golgi step that maintains the cycling pool of
      ATG9. This is the best-supported process for TBC1D14.'
    supported_by:
    - reference_id: PMID:17562788
      supporting_text: In the case of TBC1D14, although the Golgi was fragmented, Shiga toxin did not
        localize to these Golgi fragments, indicating there was a block in transport.
