  review:
    summary: ER-lumen pool modelled only as a FAM20C substrate in transit through the secretory pathway; over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Antithrombin is a secreted protein that passes through the ER en route to plasma. The Reactome FAM20C
      reaction places the generic secretory-substrate set, which includes antithrombin, in the ER lumen; this is
      transit, not residence, and there is no direct evidence of an ER-resident antithrombin pool with a function
      there. FAM20C-mediated phosphorylation is a post-translational modification of antithrombin, not an antithrombin
      activity. ER transit is not residence for a secreted protein.
    supported_by:
    - reference_id: Reactome:R-HSA-8952289
      supporting_text: Extracellular serine/threonine protein kinase FAM20C is an extracellular kinase that can
        phosphorylate a broad range of secreted protein.
