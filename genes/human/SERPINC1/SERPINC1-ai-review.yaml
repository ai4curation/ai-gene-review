core_functions:
- description: Heparin/heparan sulfate-activated serpin that inactivates the coagulation serine proteases thrombin,
    factor Xa, factor IXa and factor XIa by the suicide-substrate mechanism, forming an irreversible covalent
    complex; this is the principal plasma anticoagulant activity.
  molecular_function:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0030195
    label: negative regulation of blood coagulation
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: file:human/SERPINC1/SERPINC1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: AT-III inhibits thrombin, matriptase-3/TMPRSS7, as well as factors IXa, Xa and XIa
  - reference_id: PMID:20685328
    supporting_text: Antithrombin plays a key anticoagulant role by preventing the activation of procoagulant
      proteinases except at a site of injury
  - reference_id: PMID:11018075
    supporting_text: These findings suggest that antithrombin is essential for embryonic survival and that it
      plays an important role in regulation of blood coagulation in the myocardium and liver.
- description: Binds heparin and vascular heparan sulfate through a basic exosite; a specific pentasaccharide
    allosterically activates antithrombin toward factors Xa and IXa, and longer chains additionally bridge antithrombin
    and thrombin (template mechanism), accelerating protease inhibition by up to several thousand-fold.
  molecular_function:
    id: GO:0008201
    label: heparin binding
  directly_involved_in:
  - id: GO:0030195
    label: negative regulation of blood coagulation
  supported_by:
  - reference_id: PMID:16619025
    supporting_text: One of the principal regulatory mechanisms involves heparin activation of the serpin antithrombin
      (AT).
  - reference_id: PMID:15311269
    supporting_text: The structure reveals a template mechanism with antithrombin and thrombin bound to the same
      heparin chain.
  - reference_id: file:human/SERPINC1/SERPINC1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Its inhibitory activity is greatly enhanced in the presence of heparin.
suggested_questions:
- question: What is the molecular mechanism and physiological relevance of the anti-angiogenic activity of cleaved
    and latent antithrombin, and does it warrant a GO annotation and which cellular target?
- question: Should GO represent the native antithrombin heparin-binding exosite distinctly from the generic heparin-binding
    term, given its role as the pharmacological target of therapeutic heparins?
suggested_experiments:
- description: Define the endothelial-cell receptor or target of cleaved/latent antithrombin that mediates its
    anti-angiogenic effect, using crosslinking and loss-of-function assays, to establish whether a specific molecular
    function underlies the reported activity.
knowledge_gaps:
- gap_statement: The molecular target and mechanism by which conformationally altered (cleaved or latent)
    antithrombin inhibits angiogenesis are undetermined.
  boundary: Cleaved and latent antithrombin inhibit angiogenesis and tumour growth in mouse models, whereas
    native antithrombin does not, but no endothelial receptor or signalling pathway has been identified.
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: PMID:10489375
    supporting_text: Here it is shown that the cleaved conformation of antithrombin has potent antiangiogenic
      and antitumor activity in mouse models.
