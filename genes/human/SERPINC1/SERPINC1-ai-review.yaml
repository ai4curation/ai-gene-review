- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:16619025
  qualifier: enables
  review:
    summary: Antithrombin binds heparin/heparan sulfate through a basic site; the binding allosterically activates
      its protease-inhibitor function.
    action: NEW
    reason: Heparin binding is a defining, directly demonstrated molecular function of antithrombin and is missing
      from the human GOA (the mouse ortholog P32261 carries GO:0008201 only by ISO). The heparin-binding site is
      mapped to specific basic residues (UniProt BINDING heparin at positions 81, 161 and 177), and crystal structures
      of antithrombin with heparin pentasaccharide and with the ternary heparin-thrombin complex establish the
      interaction and its activating conformational change. This is a molecular-function binding term directly
      observed in structures, not a process term, so the process-participation test does not apply.
    supported_by:
    - reference_id: PMID:16619025
      supporting_text: One of the principal regulatory mechanisms involves heparin activation of the serpin antithrombin
        (AT).
    - reference_id: PMID:10966821
      supporting_text: Its activation by heparin, and specifically by a pentasaccharide core of heparin
    - reference_id: file:human/SERPINC1/SERPINC1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Its inhibitory activity is greatly enhanced in the presence of heparin.
- term:
    id: GO:0030195
    label: negative regulation of blood coagulation
  evidence_type: IMP
  original_reference_id: PMID:11018075
  qualifier: involved_in
  review:
    summary: Antithrombin limits coagulation in vivo; its loss causes fatal fibrin deposition and consumptive coagulopathy.
    action: NEW
    reason: Antithrombin itself performs the anticoagulant step (covalent inactivation of thrombin, FXa, FIXa and
      FXIa), so it participates in negative regulation of blood coagulation rather than merely being necessary for
      it. The complete-knockout mouse dies in utero with disseminated fibrin deposition and consumptive coagulopathy,
      and human deficiency causes thrombophilia. Comparator check (QuickGO, exact term, 2026-11-26) finds that the
      natural anticoagulants TFPI (P10646, IDA), protein C (P04070, IDA/TAS) and thrombomodulin (P07204, IDA/NAS/TAS)
      all carry GO:0030195 (positive control returns hits), while antithrombin P01008 carries none, so this is a
      genuine annotation gap for an effector that does the regulatory work.
    supported_by:
    - reference_id: PMID:11018075
      supporting_text: These findings suggest that antithrombin is essential for embryonic survival and that it
        plays an important role in regulation of blood coagulation in the myocardium and liver.
    - reference_id: PMID:20685328
      supporting_text: Antithrombin plays a key anticoagulant role by preventing the activation of procoagulant
        proteinases except at a site of injury
