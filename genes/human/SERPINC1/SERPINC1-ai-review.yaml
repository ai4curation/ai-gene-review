id: P01008
gene_symbol: SERPINC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Antithrombin-III is the principal serine protease inhibitor (serpin) of the plasma coagulation
  system. Synthesised mainly by the liver and secreted into blood, it inactivates thrombin and the coagulation
  factors Xa, IXa and XIa by the serpin suicide-substrate mechanism, forming an irreversible covalent complex
  that traps and distorts the protease. Its inhibitory activity is low in the circulating native form and is
  accelerated by orders of magnitude on binding heparin or vascular heparan sulfate, whose specific pentasaccharide
  core allosterically activates the molecule toward factors Xa and IXa, while longer glycosaminoglycan chains
  additionally bridge antithrombin and thrombin on the same chain (template mechanism). Antithrombin therefore
  acts as a major natural anticoagulant that confines clotting to sites of injury; its deficiency causes
  hereditary thrombophilia and its complete loss is embryonic-lethal in mice. Conformationally altered forms
  produced by reactive-loop cleavage or by conversion to the latent state (and pathological polymers) have
  additional reported anti-angiogenic activity.
