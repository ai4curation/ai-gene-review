    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:18923394
  qualifier: enables
  supporting_entities:
  - UniProtKB:P01008
  review:
    summary: Self-association is a domain-swapped serpin dimer, a model of pathological polymerisation rather than
      a native function.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited crystal structure is of a stable domain-swapped serpin dimer used to model the beta-sheet-expansion
      polymerisation that underlies serpinopathies (including antithrombin-deficiency thrombosis). Native antithrombin
      is a plasma monomer; self-association is a conformational-disease phenomenon, not a physiological homodimer
      function, so the identical-protein-binding row over-annotates it rather than being flatly wrong.
    supported_by:
    - reference_id: PMID:18923394
      supporting_text: Here we report the crystallographic structure of a stable serpin dimer which reveals a domain
        swap of more than 50 residues
