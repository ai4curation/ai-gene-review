      data and no independent replication.
core_functions:
- description: >-
    Nuclear microprotein that binds histone H2B with high affinity and associates with chromatin. It
    occupies many transcription start sites and, when overexpressed, mostly represses a broad
    RNA polymerase II transcriptional program. The mechanism is unknown; one hypothesis is that it acts
    like, or together with, the HMGN nucleosome-binding proteins.
