- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:33468658
  qualifier: involved_in
  review:
    summary: >-
      Overexpression of SEHBP-eGFP in HEK293T cells changed about 16.7% of expressed transcripts,
      84% of them downward. ChIP-seq of the same fusion found it at 8,900 loci, including 1,786
      transcription start sites, and at the most strongly regulated genes. This is the central
      functional claim of the only paper on SEHBP. The term is broad but appropriate: the direction is
      mixed (mostly repression, with some induction), and the mechanism is not known.
    action: ACCEPT
    reason: >-
      This is the curator's experimental annotation from the full text, and it is consistent with the
      chromatin association (H2B binding, ChIP occupancy at TSSs). Caveat: the evidence comes only from
      overexpression in one cell line. Direct and indirect effects have not been separated, and there is
      no loss-of-function data for the endogenous peptide.
    supported_by:
    - reference_id: PMID:33468658
      supporting_text: 16.7% of the active transcriptome (1,985 of 11,586 transcripts) was significantly
        modulated in RNA-seq experiments when compared to a vector control
    - reference_id: PMID:33468658
      supporting_text: Consistent with its role as a transcriptional regulator, SEHBP also occupied
        1,786 transcriptional start sites
- term:
    id: GO:0042393
    label: histone binding
  evidence_type: IDA
  original_reference_id: PMID:33468658
  qualifier: enables
  review:
    summary: >-
      SEHBP binds histone H2B. The evidence is co-IP of HA-H2B without crosslinking, co-IP of endogenous
      H2B, reciprocal pull-down of SEHBP with an anti-H2B antibody, and biolayer interferometry with
      recombinant proteins (Kd 25 +/- 0.4 nM). Histone H3 was not recovered. This is the best-characterised
      molecular activity of SEHBP. GO has no H2B-specific binding term, and reader activity is not
      justified because no dependence on histone modifications was tested.
    action: ACCEPT
    reason: >-
      Several independent methods, including a direct in vitro binding measurement, support specific
      binding of H2B.
    supported_by:
    - reference_id: PMID:33468658
      supporting_text: recombinant SEHBP and H2B strongly associate in vitro, as biolayer interferometry
        experiments determined their dissociation constant to be 25 ± 0.4 nM
    - reference_id: PMID:33468658
      supporting_text: Endogenous H2B protein could additionally be immunoprecipitated from HEK293T cells
        expressing SEHBP-FLAG, and SEHBP itself could be pulled down when an anti-H2B antibody was used
        for immunoprecipitation
