gene_symbol: ZNF689
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SEHBP (short ORF-encoded histone-binding protein) is a 46-amino-acid microprotein translated from
  an upstream open reading frame (uORF) in the 5' untranslated region of the ZNF689 mRNA; it is a
  separate gene product from the ZNF689 zinc-finger protein encoded downstream on the same
  transcript. The uORF is conserved across mammals and shows ribosome occupancy in several human cell
  lines. In HEK293T cells, tagged SEHBP is found in both the nucleus and the cytoplasm. It binds
  histone H2B tightly (in vitro dissociation constant about 25 nM, confirmed by co-immunoprecipitation)
  and can be crosslinked to the nucleosome-binding proteins HMGN1 and HMGN3. Overexpressed SEHBP occupies
  thousands of genomic loci, including many transcription start sites, and changes the expression
  of about one sixth of expressed transcripts, most of which go down. This suggests that SEHBP regulates
  RNA polymerase II transcription through chromatin, possibly in a way similar to the HMGN proteins.
  All functional data come from overexpression in a single cell line. The physiological role of the
  endogenous peptide has not been tested by loss of function.
