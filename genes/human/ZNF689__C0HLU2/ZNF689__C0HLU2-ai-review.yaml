  review:
    summary: >-
      Interaction with HMGN1 (P05114). HMGN1 was an AP-MS hit, but it was not recovered by
      non-crosslinked co-IP. The interaction was detected only as high-molecular-weight adducts after
      chemical crosslinking of overexpressed SEHBP-FLAG. Bare protein binding says nothing about
      function. No more informative MF term is supported: no specific HMGN-binding term exists, and
      the interaction itself is weakly characterised.
    action: REMOVE
    reason: >-
      Uninformative protein binding term, and the interaction rests only on crosslinking. The
      informative, well-supported binding activity of SEHBP (histone H2B) is already captured by
      GO:0042393 histone binding.
