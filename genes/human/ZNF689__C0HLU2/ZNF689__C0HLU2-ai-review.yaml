suggested_questions:
- question: >-
    Does endogenous SEHBP, made at its native level from the ZNF689 5' UTR, regulate transcription?
    All the transcriptomic and ChIP-seq data come from overexpressed eGFP fusions in HEK293T cells.
- question: >-
    Does SEHBP bind free H2B or nucleosomal H2B, and does binding depend on histone modifications? The
    answer decides whether chromatin binding, nucleosome binding or a histone reader activity term
    would be appropriate.
- question: >-
    Does translation of the SEHBP uORF regulate translation of the downstream ZNF689 zinc-finger protein
    in cis? Does SEHBP repression of zinc-finger genes include feedback on ZNF689 itself?
suggested_experiments:
- hypothesis: Endogenous SEHBP is needed for the transcriptional program seen on overexpression.
  description: >-
    Mutate the SEHBP start codon at the endogenous locus while keeping the ZNF689 coding sequence
    intact. Then measure transcriptome changes (RNA-seq) and genome occupancy of endogenously tagged
    SEHBP (CUT&RUN), and compare them with the overexpression signatures.
  experiment_type: genome editing, RNA-seq, CUT&RUN
- hypothesis: SEHBP binds H2B in the nucleosome context and alters chromatin accessibility.
  description: >-
    Measure SEHBP binding to reconstituted nucleosomes versus free H2A-H2B dimers, map the binding
    interface, and test whether binding-deficient mutants lose the effects on transcription and ATAC-seq
    accessibility.
  experiment_type: biochemistry, mutagenesis, ATAC-seq
