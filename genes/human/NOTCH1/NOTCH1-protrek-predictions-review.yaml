description: >-
  ProTrek sequence-to-text retrieval for human NOTCH1. At 2555 residues this is one of the cohort's
  longest queries, yet it scores normally (15.87) - unlike BRCA2, HTT and LRRK2 - which is consistent
  with NOTCH1 being built from many copies of one domain type (EGF-like repeats) rather than a heterogeneous
  multi-domain architecture. Four of the five calls are exact GOA matches, all specific developmental
  processes, and rank 3 is Notch binding. What the list does not contain is the receptor activity
  or the NICD transcriptional coactivator role - this review's first two core functions - so the model
  returns NOTCH1's phenotypes rather than its mechanism. Assessment: 3 correct not novel (CNN).
