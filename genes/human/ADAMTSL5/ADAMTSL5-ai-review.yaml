suggested_questions:
- question: >-
    PAINT recommendation, stated once for the whole family rather than per gene. Node
    PTN000347317 in PTHR13723 carries four IBD annotations, but their propagation to
    the eight human ADAMTSL/papilin members is incoherent: GO:0031012 reached 5 of 7
    non-catalytic members (missing ADAMTSL1 and PAPLN) and GO:0030198 reached only 3 of
    7 (missing ADAMTSL1, ADAMTSL3, ADAMTSL5 and PAPLN), while all four catalytic ADAMTS
    controls received all four terms. The sharpest case is human PAPLN, which received
    no IBA at all even though three of its own orthologs - Drosophila Ppn
    (FB:FBgn0003137), mouse Papln (MGI:MGI:2386139) and C. elegans mig-6/ppn-1
    (WB:WBGene00003242) - are seeds for GO:0031012 at that very node. Human ADAMTSL1
    likewise has no IBA at all despite being in the family (SF157). Is this a
    propagation-coverage gap rather than a set of deliberate curatorial exclusions, and
    can the node's terms be re-propagated across the clade?
  experts: []
- question: >-
    Related PAINT point, in the opposite direction. The family's loss of catalysis is
    modelled correctly - GO:0004222 and GO:0006508 reached all four catalytic ADAMTS
    controls and none of the seven ADAMTS-like members - but only ADAMTSL2 records this
    explicitly, via a NOT-qualified enables GO:0004222 IBA (IKR at node PTN002673039).
    For ADAMTSL1, ADAMTSL3, ADAMTSL4, ADAMTSL5, THSD4 and PAPLN the absence of
    catalytic activity is implicit, i.e. simply nothing propagated. Would placing the
    negation at the node ancestral to the whole non-catalytic clade make this
    informative loss explicit for all of them?
  experts: []
- question: >-
    Ontology issue. GO:0001527 microfibril is a part_of child of GO:0071953 elastic
    fiber, which asserts that every microfibril is part of an elastic fiber. This
    contradicts GO:0001527's own definition, which describes microfibrils as
    extracellular matrix components occurring independently or along with elastin, and
    contradicts the ciliary zonule - a fibrillin microfibril structure essentially
    devoid of elastin, and the reason FBN1 mutations cause ectopia lentis. Should the
    part_of be relaxed, or GO:0001527 re-parented under a fibrillin-microfibril concept
    independent of elastic fibre?
  experts: []
- question: >-
    UniProt/GOA discrepancy to reconcile. UniProt's cross-reference block carries
    GO:0001527 C:microfibril IDA:UniProtKB for ADAMTSL5, but GOA does not contain that
    annotation - QuickGO returns exactly 12 annotations for Q6ZMM2 and GO:0001527 is
    not among them. The gene's best-evidenced and most specific localisation is
    therefore missing from GOA, while a weaker review-derived TAS row to the broader
    parent GO:0071953 is present. Which record is stale?
  experts: []
- question: >-
    Does ADAMTSL5 have any demonstrable effect on fibrillin microfibril biology? The
    only test to date found no consistent difference in microfibril density and no
    discernible effect on assembly, in a single exogenous-protein assay reported as
    data not shown. Given that the protein binds both fibrillins and is proteolytically
    processed to release its NTR module, a loss-of-function experiment is needed before
    any extracellular matrix organization annotation is justified.
  experts:
  - Suneel S. Apte
  - Dieter P. Reinhardt
- question: >-
    What is the function, if any, of the released C-terminal NTR fragment? UniProt
    records that ADAMTSL5 is proteolytically cleaved to release an NTR-containing
    fragment, this fragment carries the heparin-binding activity, and it is detectable
    in mouse skeletal muscle, testis, kidney and heart. Is the cleavage regulated, and
    does the fragment have activity distinct from the full-length protein?
  experts:
  - Suneel S. Apte
  - Hannes L. Bader

suggested_experiments:
- hypothesis: >-
    If ADAMTSL5 modulates fibrillin microfibril assembly in vivo, loss of the gene will
    perturb microfibril architecture in the tissues where the protein is most abundant.
  description: >-
    Generate Adamtsl5-null mice and examine fibrillin microfibril architecture in
    skeletal muscle, cartilage, bone and the ciliary zonule by immunofluorescence and
    transmission electron microscopy. This is the loss-of-function test the field
    lacks, and it would settle whether any extracellular matrix organization annotation
    is warranted. Compare against the Adamtsl2 and Thsd4 nulls, whose microfibril
    phenotypes are established.
  experiment_type: Mouse knockout with tissue ultrastructure
- hypothesis: >-
    ADAMTSL5 binds a discrete N-terminal region shared by fibrillin-1 and fibrillin-2,
    and competes there with other microfibril-associated ADAMTSL proteins.
  description: >-
    Map the fibrillin-binding site. The primary paper showed ADAMTSL5 binds the
    N-terminal half of fibrillin-1 and both halves of fibrillin-2, with the N-terminal
    half binding more strongly. Narrow this with recombinant fibrillin subfragments and
    surface plasmon resonance to obtain an affinity and a domain-level site, then test
    competition with ADAMTSL2, ADAMTSL4 and THSD4.
  experiment_type: Surface plasmon resonance with recombinant fragments
- hypothesis: >-
    Release of the C-terminal NTR module is a regulated processing event that changes
    the protein's matrix-binding behaviour.
  description: >-
    Identify the protease that releases the NTR module and test whether the cleavage is
    regulated. Combine N-terminal sequencing or terminal-amine labelling of the
    released fragment with a protease-inhibitor panel in transfected cells, then ask
    whether the free NTR fragment and full-length ADAMTSL5 differ in heparin affinity
    and in microfibril decoration.
  experiment_type: Protease identification and N-terminomics
- hypothesis: >-
    Peri-cellular retention of secreted ADAMTSL5 depends on the NTR-heparan sulfate
    interaction rather than on protein-protein contacts with the matrix.
  description: >-
    Compare ADAMTSL5 deposition on wild-type CHO cells with the
    glycosaminoglycan-deficient pgsA-745 and pgsD-677 mutants, and after heparinase III
    treatment. If the NTR-heparin interaction is what anchors the protein, retention
    should be lost in the mutants while secretion itself is unaffected.
  experiment_type: Cell-surface retention in glycosaminoglycan-deficient mutants
- hypothesis: >-
    The reported effect of ADAMTSL5 on receptor tyrosine kinase levels in hepatocellular
    carcinoma is a genuine extracellular, matricrine activity requiring the
    heparin-binding NTR module.
  description: >-
    Test whether purified recombinant ADAMTSL5 added to the medium reproduces the
    changes in MET, EGFR and FGFR4 seen on knockdown, and whether the effect requires
    the NTR module. This would distinguish a bona fide extracellular signal from an
    intracellular or indirect consequence of depleting the gene, and would determine
    whether any signalling GO annotation is ever justified.
  experiment_type: Recombinant protein add-back with domain deletion

references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      Maps InterPro signature matches to GO terms. For ADAMTSL5 the relevant signature
      is IPR013273 ADAMTS/ADAMTS-like, whose sole GO mapping is GO:0030198
      extracellular matrix organization. The signature covers 26,580 proteins and spans
      both the catalytic ADAMTS proteases and the non-catalytic ADAMTS-like proteins.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The GO_REF itself is correctly applied - ADAMTSL5 genuinely matches IPR013273.
      The issue is the breadth of the signature, not a citation error. Verified the
      signature name, protein count and single GO mapping against the InterPro API.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT phylogenetic propagation. For ADAMTSL5 the single IBA row derives from
      PANTHER node PTN000347317 in family PTHR13723, with 16 protein donors. The GOA
      WITH/FROM field matches the cached PAINT seed list for that node exactly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified by resolving all 17 WITH/FROM tokens and confirming the seed set matches
      the cached PTHR13723 PAINT file exactly, plus the node id.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      Maps the UniProt Secreted subcellular location keyword (SL-0243) to GO:0005576
      extracellular region. Correct for ADAMTSL5, which has a signal peptide and
      experimentally demonstrated secretion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:23010571
  title: A disintegrin-like and metalloprotease domain containing thrombospondin type
    1 motif-like 5 (ADAMTSL5) is a novel fibrillin-1-, fibrillin-2-, and heparin-binding
    member of the ADAMTS superfamily containing a netrin-like module.
  findings:
  - statement: >-
      ADAMTSL5 is a secreted, N-glycosylated ~60 kDa glycoprotein. Recombinant protein
      is recovered from the conditioned medium of transfected HEK293F, COS-1 and CHO-K1
      cells and deposits into the peri-cellular and baso-lateral extracellular matrix.
    supporting_text: "Recombinant ADAMTSL5 is a secreted, N-glycosylated 60kDa"
  - statement: >-
      ADAMTSL5 binds heparin through its C-terminal NTR module in a salt-sensitive
      ionic interaction; only the NTR-containing C-terminal fragment is retained on
      heparin-agarose.
    supporting_text: "only the C-terminal fragment containing the NTR-module was retained by the heparin matrix"
  - statement: >-
      ADAMTSL5 binds both fibrillin-1 and fibrillin-2 and co-localises with assembled
      fibrillin microfibrils in fibroblast extracellular matrix - the first family
      member shown to bind both fibrillins.
    supporting_text: "Taken together, the findings are consistent with specific binding
      of ADAMTSL5 to fibrillin-1 and fibrillin-2 and to their macromolecular assemblies,
      i.e., fibrillin microfibrils."
  - statement: >-
      Critically, the same experiment found no effect of ADAMTSL5 on microfibril
      assembly, and direct binding to fibronectin was not supported. This is the only
      direct test of a matrix-organizing role for ADAMTSL5 and it was negative, though
      reported as data not shown.
    supporting_text: "did not identify a consistent difference"
  - statement: >-
      The ADAMTS-like proteins, including ADAMTSL5, have no catalytic domain and hence
      no proteolytic activity - the basis for rejecting any protease-derived functional
      inference for this gene.
    supporting_text: "In contrast to ADAMTS proteases, ADAMTSLs lack a catalytic domain"
  - statement: >-
      In mouse organogenesis ADAMTSL5 is broadly expressed, prominently in
      musculoskeletal tissues - skeletal muscle, cartilage and bone - and in many
      epithelia. Cartilage and bone are not elastic-fibre tissues.
    supporting_text: "Immunostaining during mouse organogenesis identified ADAMTSL5 in"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single defining paper for this gene and the source of all five IDA rows. Full
      text available and read in full; all quotes verified verbatim against the cached
      PMC text. Projection test negative - QuickGO shows it annotates only 2 entities
      (ADAMTSL5 and its mouse ortholog), so it is gene-specific curation rather than a
      complex- or family-wide projection. No retraction, erratum or expression of
      concern.
- id: PMID:23962539
  title: Elastic fibres in health and disease.
  findings:
  - statement: >-
      A general review of elastic fibre composition, assembly and disease. Its abstract
      does not mention ADAMTSL5. QuickGO shows it is used as the TAS reference for 66
      annotations across 62 distinct entities, 41 of which receive GO:0071953 elastic
      fiber - a bulk curation pass rather than a gene-specific traceable statement. The
      same pass assigned the more specific GO:0001527 microfibril to 15 other proteins.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Not miscited - the review is a legitimate source for elastic fibre composition,
      and TAS is the honest evidence code for it. But it is weak support for a
      gene-specific localisation: full text is unavailable, the abstract never names
      ADAMTSL5, and the same reference underpins 41 other elastic-fiber assignments.
      Flagged LOW_QUALITY on those grounds rather than MISCITED. Per campaign policy I
      did not REMOVE on an unverifiable full text; the row is MODIFIED to the specific
      term the gene's own IDA evidence supports.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      The HuRI systematic yeast two-hybrid screen, source of all three GO:0005515 rows
      for ADAMTSL5 (partners CYSRT1, KRTAP5-9 and FHL5). IntAct logs each partner under
      three sub-methods of the same experiment - two hybrid array, two hybrid prey
      pooling approach and validated two hybrid - all at MI-score 0.56, so UniProt's
      NbExp=3 is one screen counted three ways rather than three independent
      observations.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and a high-quality resource; the problem is not the paper but
      what a single unreplicated Y2H hit supports. All three ADAMTSL5 partners are
      extreme interaction hubs (517, 213 and 108 distinct IntAct partners against
      ADAMTSL5's 12) and all three are intracellular, so none is topologically
      accessible to a secreted ECM protein. All three accessions resolve to reviewed
      canonical Swiss-Prot entries at canonical lengths - no ORFeome or TrEMBL
      substitution.
- id: PMID:26621454
  title: Melanocyte antigen triggers autoimmunity in human psoriasis.
  findings:
  - statement: >-
      ADAMTSL5 is an HLA-C*06:02-presented melanocytic autoantigen recognised by a
      Valpha3S1/Vbeta13S1 CD8+ T cell receptor from a psoriasis patient, and ADAMTSL5
      stimulation induced IL-17A in CD8+ T cells from psoriasis patients only. The
      recognised peptide VRSRRCLRL maps to residues 67-75, inside the TSP type-1
      domain.
    supporting_text: "we identified ADAMTS-like protein 5 (ADAMTSL5) as an"
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Verified against the cached full text; peptide position confirmed independently
      against the UniProt sequence. Included for the description because it is the
      gene's best-known biology, but it generates no GO annotation - being presented as
      an MHC-bound peptide is a property of a degradation product in an
      antigen-presentation pathway, not a molecular function of the secreted
      glycoprotein. The record carries two Comment in entries, which are commentaries
      rather than corrections; no retraction or erratum.
- id: PMID:33197513
  title: ADAMTSL5 is an epigenetically activated gene underlying tumorigenesis and drug
    resistance in hepatocellular carcinoma.
  findings:
  - statement: >-
      ADAMTSL5 is activated by gene-body CpG island hypermethylation in mouse and human
      hepatocellular carcinoma. Depletion interfered with tumorigenic properties, while
      overexpression conferred tumorigenicity on pre-tumoural hepatocytes sensitised by
      modest MET expression.
    supporting_text: "ADAMTSL5 targeting interfered with tumorigenic properties of HCC"
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Used for the description but deliberately not used to
      propose a signalling GO term: the receptor tyrosine kinase changes are downstream
      readouts in a cancer model, and no mechanism connecting a secreted ECM
      glycoprotein to receptor levels has been established. Notably co-authored by
      Apte, who also authored the defining matrix paper. No retraction or erratum.
- id: file:genes/human/ADAMTSL5/ADAMTSL5-bioinformatics/RESULTS.md
  title: ADAMTSL5 bioinformatics analysis - WITH/FROM resolution, family propagation
    census, and interaction-partner assessment
  findings:
  - statement: >-
      All 16 protein donors on the GO:0031012 IBA row carry their own experimental
      IDA/HDA evidence for that term or a descendant, and the donor set spans four
      distinct locations, making GO:0031012 the correct least common ancestor.
    supporting_text: "All 16 protein donors carry their own experimental (IDA/HDA) annotation"
  - statement: >-
      Propagation from PANTHER node PTN000347317 is incoherent across the human family:
      GO:0031012 reached 5 of 7 non-catalytic members and GO:0030198 only 3 of 7, while
      human PAPLN received no IBA at all despite three of its own orthologs being seeds
      for GO:0031012 at that node.
    supporting_text: "PAPLN receives neither"
  - statement: >-
      The three GO:0005515 partners are extreme Y2H hubs (517, 213 and 108 distinct
      IntAct partners against ADAMTSL5's 12) and all are topologically inaccessible to
      a secreted protein.
    supporting_text: "CYSRT1 (A8MQ03) | 1670 | **517** | cornified envelope | 144 aa |"
  - statement: >-
      ADAMTSL5 has no zinc-binding metalloprotease motif - no HExxHxxGxxHD and no
      HExxH substring at all in its 481 residues - confirming the loss of catalysis
      independently of UniProt's CAUTION line.
    supporting_text: "no `HExxH` substring at all"
- id: file:genes/human/ADAMTSL5/ADAMTSL5-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADAMTSL5 (human)
  findings:
  - statement: >-
      Provider deep-research record. Its narrative of the fibrillin, heparin, psoriasis
      and hepatocellular carcinoma literature is broadly accurate and every citation is
      a numeric PMID, but its GO grounding proposes GO:0008289 lipid binding and
      GO:0098772 molecular function regulator activity, neither of which has any
      support - the demonstrated ligand is heparin, a glycosaminoglycan. Not imported.
    supporting_text: "GO:0008289 lipid binding"
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      gates_passed is False. The tripped gate is specifically the self-evaluation
      pairwise tie, not a faithfulness failure (faith_pct is 100.0), and no citation is
      a bioRxiv PMID:bio_* identifier. Marked LOW_QUALITY per campaign policy for a
      failed gate. Every claim used from it was re-verified against the cited PMID
      directly and is quoted from the PMID rather than from the provider prose; its GO
      grounding was rejected outright.
