      0.56, so it is unreplicated. The accession is the reviewed canonical Swiss-Prot
      entry at its canonical length (169 aa). Not REMOVE, for the same reason as the
      CYSRT1 row: the annotation records a real screen result, but the bare term
      conveys no function and the partner is not credible.
    supported_by:
