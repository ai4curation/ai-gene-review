core_functions:
- description: >-
    Binds fibrillin-1 and fibrillin-2 and decorates assembled fibrillin microfibrils in
    the extracellular matrix, acting as a microfibril-associated accessory glycoprotein
    rather than as a structural or enzymatic component of the microfibril itself.
