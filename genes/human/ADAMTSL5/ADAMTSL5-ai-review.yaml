- term:
    id: GO:0030198
    label: extracellular matrix organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      InterPro2GO transfer from IPR013273, a family signature that bundles the
      catalytic ADAMTS proteases together with the non-catalytic ADAMTS-like proteins.
      For the proteases, extracellular matrix organization follows from ECM
      proteolysis; ADAMTSL5 has no proteolytic activity, and the one direct test of
      matrix organization by ADAMTSL5 was negative.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Two independent legs. First, the source signature is too broad to carry this
      process. InterPro:IPR013273 is named "ADAMTS/ADAMTS-like", covers 26,580
      proteins, and carries exactly one GO mapping - this term. It matches ADAMTSL5
      legitimately, but the ECM-organizing role of the family's catalytic members is a
      consequence of their metalloprotease activity, which ADAMTSL5 does not have:
      UniProt flags the missing catalytic domain in a CAUTION line, the primary paper
      states the ADAMTSLs have no proteolytic activity, and a sequence scan finds no
      HExxHxxGxxHD zinc-binding signature - indeed no HExxH substring at all - in the
      481-residue sequence, with no peptidase signature among its InterPro matches.
      This is the familiar "a domain's name is not an activity" failure moved one
      aspect over, into a family signature too broad to carry a process. Second, the
      only direct experimental test was negative: adding ADAMTSL5 to fibroblast
      cultures produced no consistent difference in microfibril density and no
      discernible effect on microfibril assembly, and direct fibronectin binding was
      not supported either. Not REMOVE, deliberately: that negative is a "data not
      shown" result from a single exogenous-protein assay, so it shows no role has
      been demonstrated rather than refuting one, and UniProt itself only claims the
      protein may play a role in modulation of fibrillin microfibrils. A third
      argument was available and deliberately not used - ADAMTSL5 did not receive this
      term by IBA while ADAMTSL2, ADAMTSL4 and THSD4 did from the same node - because
      that node's propagation is incoherent family-wide (ADAMTSL1 and PAPLN received
      nothing at all), so the absence is more likely a coverage gap than a curatorial
      judgement.
    supported_by:
    - reference_id: PMID:23010571
      supporting_text: "In contrast to ADAMTS proteases, ADAMTSLs lack a catalytic domain"
    - reference_id: PMID:23010571
      supporting_text: "did not identify a consistent difference"
    - reference_id: file:genes/human/ADAMTSL5/ADAMTSL5-uniprot.txt
      supporting_text: "lacks the metalloprotease and disintegrin-like domains which are"
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: InterPro:IPR013273
        source_label: ADAMTS/ADAMTS-like (family signature, 26580 proteins)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Sole GO mapping is GO:0030198. The signature spans both catalytic ADAMTS
          proteases and non-catalytic ADAMTS-like proteins, so the mapping is sound for
          the protease members but does not transfer to a member that lost catalysis.

- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: >-
      Partner CYSRT1 (A8MQ03), from the HuRI yeast two-hybrid screen. An extreme Y2H
      hub (517 distinct IntAct partners) that localises to the cornified envelope,
      topologically inaccessible to a secreted ECM protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Assessed per partner, not per gene. CYSRT1 has 517 distinct interaction partners
      in IntAct across 1670 records, against 12 for ADAMTSL5 - the signature of a
      promiscuous two-hybrid prey rather than a specific partner. Its only annotated
      location is the cornified envelope, an intracellular keratinocyte structure that
      a signal-peptide secreted protein (ADAMTSL5 signal peptide 1-42) never
      encounters. The interaction is also unreplicated: IntAct logs it under three
      sub-methods of the same experiment - two hybrid array, two hybrid prey pooling
      approach, and validated two hybrid - all at MI-score 0.56, so the NbExp=3
      recorded in UniProt is one screen counted three ways, not three independent
      observations. No orthogonal assay exists. The accession resolves to the reviewed
      canonical Swiss-Prot entry at its canonical length (144 aa), so this is genuine
      screen noise rather than a mis-identified partner. Not REMOVE: the assay was
      performed and curated correctly by IntAct, it simply does not support a
      biologically meaningful binding function.
    supported_by:
    - reference_id: file:genes/human/ADAMTSL5/ADAMTSL5-bioinformatics/RESULTS.md
      supporting_text: "CYSRT1 (A8MQ03) | 1670 | **517** | cornified envelope | 144 aa |"

