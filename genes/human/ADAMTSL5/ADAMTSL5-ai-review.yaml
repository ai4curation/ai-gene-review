- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:23010571
  qualifier: enables
  review:
    summary: >-
      Core molecular function, mapped to a specific module. Heparin-agarose affinity
      chromatography showed salt-sensitive ionic binding, and only the C-terminal
      NTR-containing fragment was retained.
    action: ACCEPT
    reason: >-
      Directly demonstrated and unusually well localised within the protein. ADAMTSL5
      was depleted from medium by heparin-agarose, was not eluted by 0.15 or 0.3 M NaCl
      but was substantially eluted by 0.5 and 1 M NaCl, establishing an ionic
      interaction; and of the two fragments present in conditioned medium only the
      C-terminal NTR-containing one was retained, while the 33 kDa N-terminal fragment
      flowed through. This is consistent with the general heparin-binding property of
      NTR modules and gives the protein a plausible mechanism for its observed
      cell-surface and peri-cellular distribution via heparan sulfate proteoglycans.
      GO:0008201 is_a GO:0005539 glycosaminoglycan binding, which is the right level:
      the ligand assayed was heparin specifically. Retained as a core function.
    supported_by:
    - reference_id: PMID:23010571
      supporting_text: "only the C-terminal fragment containing the NTR-module was retained by the heparin matrix"
    - reference_id: PMID:23010571
      supporting_text: "indicative of an ionic interaction between ADAMTSL5 and heparin"

