- term:
    id: GO:0071953
    label: elastic fiber
  evidence_type: TAS
  original_reference_id: PMID:23962539
  qualifier: located_in
  review:
    summary: >-
      Bulk assignment from a review article used as the TAS source for 62 distinct
      entities. The gene's own experimental evidence supports the more specific
      GO:0001527 microfibril, which UniProt already records by IDA but GOA is missing.
    action: MODIFY
    reason: >-
      PMID:23962539 is a review whose abstract never mentions ADAMTSL5, and QuickGO
      shows it is used as the reference for 66 annotations over 62 distinct entities,
      41 of them receiving this same term - a bulk curation pass over the elastic fibre
      literature rather than a gene-specific traceable statement. Tellingly, the same
      curation from the same review assigned the more specific GO:0001527 microfibril
      to 15 other proteins including THSD4/ADAMTSL6, so the specific term was available
      and simply not chosen here. Meanwhile ADAMTSL5's own primary data demonstrates
      association with fibrillin microfibrils specifically, and UniProt already carries
      GO:0001527 microfibril by IDA for this protein - a term GOA does not have
      (QuickGO returns exactly 12 annotations for Q6ZMM2 and GO:0001527 is not among
      them). GO:0001527 is current, is not obsolete, and is a part_of child of
      GO:0071953, so replacing the review-derived parent with the evidence-backed child
      retains the parent by closure while gaining precision and aligns GOA with
      UniProt. The merged ADAMTSL4 review independently proposed GO:0001527 for its
      gene, which is useful convergent support. Note that elastic fibre is a poor fit
      on tissue grounds too: ADAMTSL5's strongest expression is in cartilage and bone,
      which are not elastic-fibre tissues.
    proposed_replacement_terms:
    - id: GO:0001527
      label: microfibril
    supported_by:
    - reference_id: PMID:23010571
      supporting_text: "co-localized with fibrillin microfibrils in the extracellular"
    - reference_id: file:genes/human/ADAMTSL5/ADAMTSL5-uniprot.txt
      supporting_text: "DR   GO; GO:0001527; C:microfibril; IDA:UniProtKB."

- term:
    id: GO:0050436
    label: microfibril binding
  evidence_type: IDA
  original_reference_id: PMID:23010571
  qualifier: enables
  review:
    summary: >-
      Core molecular function. Direct affinity co-isolation showed binding to both
      fibrillin-1 and fibrillin-2 and to assembled fibrillin microfibrils - ADAMTSL5 is
      the first family member shown to bind both fibrillins.
    action: ACCEPT
    reason: >-
      Well supported by two complementary assays in the same paper: myc-tagged ADAMTSL5
      co-isolated the N-terminal half of fibrillin-1 and both halves of fibrillin-2,
      with empty-vector controls showing no bead binding, and exogenous ADAMTSL5 added
      to fibroblast cultures decorated assembled fibrillin microfibrils. This is the
      most informative molecular function on the record and there is no more specific
      term available - GO has no fibrillin binding term (confirmed via OLS), and
      GO:0050436 is_a GO:0050840 extracellular matrix binding, so this is the
      appropriate level. Retained as a core function.
    supported_by:
    - reference_id: PMID:23010571
      supporting_text: "Taken together, the findings are consistent with specific binding
        of ADAMTSL5 to fibrillin-1 and fibrillin-2 and to their macromolecular assemblies,
        i.e., fibrillin microfibrils."

- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: IDA
  original_reference_id: PMID:23010571
  qualifier: located_in
  review:
    summary: >-
      Direct demonstration that secreted ADAMTSL5 deposits into fibroblast
      extracellular matrix, with a non-permeabilised staining control establishing the
      signal is extracellular. MGI-assigned.
    action: ACCEPT
    reason: >-
      The localisation was shown by immunostaining of fibroblast cultures exposed to
      ADAMTSL5, with two controls that make the call solid: empty-vector conditioned
      medium gave no signal, and staining without prior fixation reproduced the
      pattern, establishing that the decorated structures are extracellular rather
      than intracellular. UniProt records the same conclusion as an experimental
      subcellular location. One caveat recorded but not acted on: the assay used
      exogenous recombinant protein rather than protein at native levels, which by a
      strict reading leans toward IMP rather than IDA. I have not overturned the
      curator's call - for a secreted protein this is the standard assay and the
      non-permeabilised control addresses the main artefact.
    supported_by:
    - reference_id: PMID:23010571
      supporting_text: "suggesting that the stained structures were extracellular and corresponded to fibrillin-1 containing microfibrils in ECM"

