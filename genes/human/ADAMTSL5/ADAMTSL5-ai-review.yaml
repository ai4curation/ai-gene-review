id: Q6ZMM2
gene_symbol: ADAMTSL5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADAMTSL5 (ADAMTS-like protein 5; also known as THSD6) is a small secreted,
  N-glycosylated extracellular matrix glycoprotein of the ADAMTS superfamily. At 481
  amino acids it is by far the smallest family member, and it is built from a signal
  peptide, a single thrombospondin type-1 (TSP1) repeat, a cysteine-rich module, a
  spacer module, and a C-terminal netrin-like (NTR) module joined to the spacer by a
  proline-rich disordered segment. Unlike the ADAMTS metalloproteinases it resembles,
  ADAMTSL5 has no metalloprotease or disintegrin-like domain and no proteolytic
  activity; it is a matrix-binding glycoprotein rather than an enzyme. The secreted
  protein binds heparin through its NTR module in a salt-sensitive, ionic interaction,
  and binds both fibrillin-1 and fibrillin-2, co-localising with fibrillin microfibrils
  in the extracellular matrix deposited by cultured fibroblasts; it is the first family
  member shown to bind both fibrillins. Its distribution is peri-cellular and
  baso-lateral, and part of the pool is proteolytically processed to release the
  C-terminal NTR-containing fragment. In mouse development the protein is broadly
  expressed, most prominently in musculoskeletal tissues including skeletal muscle,
  cartilage and bone, and in many epithelia. Whether ADAMTSL5 modulates microfibril
  biology is unresolved: adding it to fibroblast cultures changed neither microfibril
  density nor assembly. Beyond the matrix, a nine-residue peptide from its TSP1 repeat
  is presented by HLA-C*06:02 on melanocytes and acts as a CD8+ T cell autoantigen in
  psoriasis, and the gene is epigenetically activated in hepatocellular carcinoma,
  where it supports tumorigenicity in MET-sensitised hepatocytes.
