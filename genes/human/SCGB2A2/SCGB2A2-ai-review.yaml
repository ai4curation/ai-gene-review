- term:
    id: GO:0030521
    label: androgen receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic annotation placed at the mammaglobin node on the evidence of the
      paralog SCGB2A1, whose own annotation records that the SCGB2A1 gene is induced by
      androgen (PMID:16020486). Being an androgen-regulated gene is not participation in
      androgen receptor signalling.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phylogenetic annotation is placed at the mammaglobin node on the evidence of a
      single descendant, the paralog SCGB2A1, whose experimental annotation comes from a
      study showing that the SCGB2A1 gene is induced by dihydrotestosterone through
      Sp-factor sites in its promoter (PMID:16020486). That finding makes SCGB2A1 a
      target gene of androgen receptor signalling, not a participant in it: a secreted
      secretoglobin whose transcription is an output of the pathway performs no step of
      the signal transduction. The fault lies in the term chosen for the seed, not in
      the placement of the node, and every member of the clade inherits it. The SCGB2A1
      review marks both its experimental and its phylogenetic row for this term as
      over-annotated for the same reason, and this row is treated alike. No evidence
      specific to SCGB2A2 (mammaglobin-A) places it in androgen receptor signalling.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000361706
        source_label: PTN000361706
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node groups the mammaglobins and its only recorded descendant evidence is
          human SCGB2A1. The placement of the node is not in question; the term given to it describes
          signal transduction, whereas the evidence shows an androgen-regulated target gene.
      - source_id: UniProtKB:O75556
        source_label: SCGB2A1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The direct-assay annotation of SCGB2A1 (PMID:16020486) shows that its gene is
          induced by dihydrotestosterone through Sp-factor sites in the promoter, which is regulation
          of the gene by the pathway and not participation of the protein in it. Nothing comparable
          has been examined for SCGB2A2.
      residue_claims_not_applicable: The problem is the scope of a process term (regulated by
        the pathway versus involved in it), not a residue-level capability, so no residue claim
        applies.
    supported_by:
    - reference_id: UniProt:Q13296
      supporting_text: "Belongs to the secretoglobin family. Lipophilin subfamily."
    - reference_id: PMID:16020486
      supporting_text: SCGB 2A1 is under androgen control in the androgen-responsive prostatic
        cell line LNCaP and can be induced more than 20-fold by dihydrotestosterone
    - reference_id: PMID:16020486
      supporting_text: we propose that SCGB 2A1 represents a new class of androgen target genes
        that are purely under indirect AR control mediated by DNA-bound Sp factors
