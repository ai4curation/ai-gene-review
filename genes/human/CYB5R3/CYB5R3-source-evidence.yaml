  definition_scope: Specific partner-binding terms describe the assayed protein class without
    transferring its activity or signaling function. GO:0050421 names cytochrome c, whereas
    the actual mARC system uses cytochrome b5. GO:1903958 and GO:0004517 describe arginine-dependent
    nitric-oxide-synthase chemistry; the actual source uses nitrite. The broad candidate GO:0098809
    has unresolved reaction wording.
  url_template: https://www.ebi.ac.uk/QuickGO/term/{GO_ID}
  followup_scope:
    row85: 'Over-annotation: redox partner/Hb-alpha binding is distinct from oxygen-carrying
      globin-complex membership. The 1992 full original remains unavailable.'
    row 93: 'Over-annotation: actual contributes_to b5/mARC system does not establish the cytochrome-c-defined
      GO0050421 class. Positive redox/NO-process evidence preserved; broad-parent wording remains
      a separate ontology question.'
    binding: Partner-class terms are assessed against exact positive pairs, construct sequences
      and independently established partner identities, without transferring partner activity
      or asserting native pathway participation.
    VAMP1: P23763-3 is officially named isoform 2, not isoform 3; original partner accession
      unchanged.
    ASGR1: The positive P07306 pair is refined to GO:0005102 using its established ligand-dependent
      receptor signaling class. No CYB5R3 agonism, ligand competition or JAK2–STAT3 effect is
      inferred.
    topology: The retained TNF/GRM2/GPR152 binding classes do not require an extracellular ligand-site
      contact. Official sequence-based cytoplasmic regions allow possible contact in principle,
      but the yeast assay maps no interface and does not demonstrate native colocalization or
      processing. GPR152 retains its probable/family-inferred receptor qualification.
    enzyme_binding: A broad catalytic-partner class supported by the pair and independent enzyme
      identity, without transferring catalysis or establishing enzyme regulation by CYB5R3;
      not a validator-only choice.
functional_product_classes:
- id: CYB5R3_MEMBRANE
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P00387-1
  description: The 301-residue M precursor contains the N-terminal membrane-association segment
    and yields the official Gly2-myristoylated chain 2–301. Its reductase activity operates
    at ER and mitochondrial outer membranes. The official record describes alternative promoter
    use and splicing; this class maps the functional membrane form without assigning every proteomic
    observation to that product.
- id: CYB5R3_SOLUBLE
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P00387-2
  description: The official 278-residue S product lacks canonical residues 1–23 and supports
    soluble erythroid methemoglobin reduction. PMID:9639531 reports an erythroid S transcript
    and soluble translation product, with internal initiation proposed in the accessible abstract.
    PMID:24500710 explicitly tests His-tagged human 278-residue isoform 2 in the reconstituted
    mARC system. This tested-product knowledge does not retrofit imported GOA isoform fields
    or establish that the chemistry is unique to this form. The 275-residue 1UMK crystal fragment
    is distinct.
