  target_role: CYB5R3 reductase activity is located at the ER. Other CYB5R3 molecules are inputs
    to other proteins’ ufmylation, deufmylation, reader or adaptor activities. UFSP2, UFL1,
    DDRGK1 and CDK5RAP3 activities are not assigned to CYB5R3.
