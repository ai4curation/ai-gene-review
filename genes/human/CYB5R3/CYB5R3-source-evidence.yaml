product_limits: The 301-aa membrane precursor, 278-aa soluble product and 334-aa product with
  an alternative N terminus are distinct. The mature 2–301 chain with myristoylation and the
  275-aa historical crystal or ΔN26 constructs are also distinguished. Equivalent function is
  not assumed for product 3.
primary_access:
- reference: PMID:10807796
  url: https://pubmed.ncbi.nlm.nih.gov/10807796/
  scope: 'Complete abstract read: human WT/C203Y recombinant enzyme, NADH kinetics and instability.
    Full original was not recovered; no unseen assay or exact modern residue-number conversion
    is claimed.'
- reference: PMID:1400360
  url: https://pubmed.ncbi.nlm.nih.gov/1400360/
  scope: 'Complete abstract directly supports human WT/variant NADH reductase kinetics and instability.
    Full original recovery failed. The precise hemoglobin-complex assertion remains unresolved;
    later vascular Hb-alpha evidence is kept distinct from this paper. Follow-up: the oxygen-carrying
    hemoglobin-complex claim is over-annotated by role/definition, without inventing an assay
    in the unavailable full original.'
- reference: PMID:14741744
  url: https://pubmed.ncbi.nlm.nih.gov/14741744/
  scope: Complete abstract identifies human HuH7 lipid-droplet-enriched proteomics, but no target-specific
    CYB5R3 table was recovered through bounded publisher routes. The location is UNDECIDED,
    not rejected because the abstract omits the target.
- reference: PMID:15502298
  url: https://pubmed.ncbi.nlm.nih.gov/15502298/
  scope: Complete abstract plus independently consulted recovered author PDF Methods/Results
    and PDB1UMK establish human FAD-containing reductase structure. The E. coli-expressed, thrombin-cleaved
    275-residue fragment (paper positions 26–300) is not the official 278-residue splice product.
    No full original was added to the immutable abstract-only cache.
- reference: PMID:15953014
  url: https://pubmed.ncbi.nlm.nih.gov/15953014/
  scope: 'Complete abstract read: human D239G retains stoichiometric FAD but changes nicotinamide-cofactor
    preference, reducing NADH specificity and increasing relative NADPH specificity. This variant
    result is retained alongside the WT NADH class; full original was not recovered.'
- reference: PMID:1898726
  url: https://pubmed.ncbi.nlm.nih.gov/1898726/
  scope: Complete abstract describes human recombinant Ser127Pro and NADH kinetics with cytochrome
    b5 acceptor. It positively supports the specific reaction; original residue labels are not
    silently converted to current precursor positions. Full original unavailable.
- reference: PMID:19946888
  url: https://pubmed.ncbi.nlm.nih.gov/19946888/
  scope: Complete abstract identifies YTS NK-cell membrane proteomics. The exact CYB5R3 table/peptide
    was not recovered; broad membrane localization is independently established, with no NK-specific
    compartment or isoform inference.
- reference: PMID:2019583
  url: https://pubmed.ncbi.nlm.nih.gov/2019583/
  scope: 'Complete abstract read: human cysteine variants and NADH/FAD kinetic measurements
    support the established reductase class. The paper does not make the tested cysteines essential.
    Full original unavailable.'
- reference: PMID:20833797
  url: https://pubmed.ncbi.nlm.nih.gov/20833797/
  scope: Complete abstract and limited indexed original preparation text concern human muscle
    mitochondrial phosphoproteomics. The actual CYB5R3 target table was not recovered. Independent
    MitoCoP target data corroborate mitochondrion localization without claiming this paper’s
    exact peptide or an inner-membrane/matrix assignment.
- reference: PMID:23123858
  url: https://pubmed.ncbi.nlm.nih.gov/23123858/
  scope: 'Actual primary Results/Fig.4 caption text and consulted Methods were read: Hb-alpha
    association in purified-protein and vascular systems, without Hb-beta in the endothelial
    context. The hemoglobin-alpha binding class is appropriate; oxygen-carrying tetramer membership
    is not inferred. Mouse arteries and human cocultures remain distinguished.'
- reference: PMID:24500710
  url: https://pubmed.ncbi.nlm.nih.gov/24500710/
  scope: 'Actual Methods/Results/Discussion read. Human His-tagged 278-aa CYB5R3 isoform2 supplies
    electrons through cytochrome b5 to mARC, whose molybdenum active site performs nitrite-to-NO
    reduction. This differs from the cytochrome-c-defined GO:0050421 and arginine/NADPH/O2 chemistry
    of GO:0004517. The positive reconstituted process contribution is retained. Follow-up: the
    actual b5 complex contribution does not establish the cytochrome-c-defined activity; row
    93 is over-annotated while NO-process contribution remains positive.'
- reference: PMID:30021884
  url: https://pubmed.ncbi.nlm.nih.gov/30021884/
  scope: Complete abstract and exact current CANX–CYB5R3 crosslink record were read. Record20
    specifies human U2OS, Triton-X100-soluble fraction of fractionated nuclei and Supplementary
    Table S2. The immutable cache is labeled full-text but lacks complete Methods/Results; original
    recovery failed. The positive record supports chaperone-class binding, not a purified assay
    or nuclear core function.
- reference: PMID:32296183
  url: https://pubmed.ncbi.nlm.nih.gov/32296183/
  scope: Selected complete primary assay/design Results and discussion were read; 55 literal
    human partner pairs independently join three current 42-field records each. All used ROGID
    sequence/taxon identities were reconstructed. The yeast-host assay establishes biophysical
    interactions, not native-human localization or pathway participation. Exact isoforms, unreviewed
    products and FXYD3/MFSD6/TMEM60 fragments remain explicit.
- reference: PMID:33961781
  url: https://pubmed.ncbi.nlm.nih.gov/33961781/
  scope: Complete abstract and exact current STOM/FUNDC2 anti-tag co-IP records were read. The
    two actual source records specify HEK293T and recorded tag context. Association is retained
    without purified-binary, isoform-specific or mechanistic claims; it remains separate from
    HuRI.
- reference: PMID:34800366
  url: https://pubmed.ncbi.nlm.nih.gov/34800366/
  scope: 'Genuine full primary XML and selected Methods/Results were read. The authentic publisher
    workbook was independently parsed: CYB5R3 row279 in sheetA and row252 in sheetB, with explicit
    MitoCoP membership and membrane measurements. The protein group contains multiple products;
    no isoform or matrix assignment is inferred.'
- reference: PMID:35271311
  url: https://pubmed.ncbi.nlm.nih.gov/35271311/
  scope: Genuine author PDF selected Methods/Results and author-hosted processed dataset were
    recovered. Exact CANX-bait/CYB5R3-prey row2364 is present in the 29,922-interaction table
    despite an empty current IntAct join. Endogenous HEK293T tagging, anti-mNeonGreen IP-MS
    and grouped CYB5R3 products are explicit; supplementary ZIP retrieval returned HTML, not
    a usable archive.
- reference: PMID:36543799
  url: https://pubmed.ncbi.nlm.nih.gov/36543799/
  scope: Selected complete Methods/Results/Discussion/caption-text entries read; no figure-pixel
    or independent supplementary-data review. Human endogenous/expressed CYB5R3 supports ER
    location. The activity assay measures NADH-dependent ferricyanide reduction; UFM1 conjugation
    promotes domain opening/FAD loss. UFBP1 recognizes the conjugated UFM1, and the proposed
    enhancement of UFBP1 ufmylation is not simplified into a direct binding or established separate
    activity of unmodified CYB5R3.
- reference: PMID:8119939
  url: https://pubmed.ncbi.nlm.nih.gov/8119939/
  scope: 'Complete abstract read: recombinant human F298-deletion enzyme has altered NADH kinetics/stability.
    Positive WT catalytic evidence supports the NADH-specific term; full original and exact
    historical sequence were not recovered.'
- reference: PMID:9207238
  url: https://pubmed.ncbi.nlm.nih.gov/9207238/
  scope: 'Complete abstract read: alternative human first exons in reticulocytes, liver, brain
    and HL-60 cells; this study did not identify an erythroid-specific transcript. The later
    9639531 result is treated as distinct evidence rather than attributed backward to this paper.
    Full original unavailable.'
- reference: PMID:9639531
  url: https://pubmed.ncbi.nlm.nih.gov/9639531/
  scope: Complete abstract identifies late erythroid S-transcript and soluble translation product
    in transfected HeLa cells; internal initiation is explicitly proposed rather than directly
    resolved in the accessible text. Full original recovery failed. Product-dependent location
    and reductase biology are positive, with exact assay/construct limits retained.
- reference: PMID:25244098
  url: https://pubmed.ncbi.nlm.nih.gov/25244098/
  scope: Actual publisher selected Results53/55/63 and Methods73/75, supplementary selection/fractionation
    legends and Table1 pixels were independently read. CYB5R3/IPI00328415 is a positive human
    neutrophil alpha-fraction detection (control/PLS138.6;0.27% intensity). Whole-organelle
    fractionation does not establish lumen versus membrane or secretion, and target peptides/products
    were not independently reconstructed. This source is corroboration, not claimed to be Reactome’s
    historical citation.
