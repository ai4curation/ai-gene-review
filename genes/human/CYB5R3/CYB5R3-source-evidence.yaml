  assay_limits:
    '32296183': 'The 55 pairs have 165 current records from yeast array, pooling and validated
      two-hybrid assays, with human sequence and taxon identities. Three explicit fragments
      are retained: FXYD3-3 58–144, MFSD6 329–791 and TMEM60 3–133. These interactions do not
      establish native human pathways or localization. Array, pooling and validated records
      are formats within one study, not three independent physiological validations. ROGIDs
      identify annotated backbones rather than native folding or processing in yeast.'
    '30021884': The exact CANX pair records crosslinking mass spectrometry in the Triton-X100-soluble
      fraction of fractionated U2OS nuclei, Supplementary Table S2. Complete original Methods
      and Results were not recovered.
    '33961781': The exact STOM and FUNDC2 pairs record anti-tag co-immunoprecipitation in HEK293T
      cells. These demonstrate association rather than purified binary binding.
    '35271311': The current literal IntAct pair is absent. The authentic author dataset corresponding
      to Table S4 contains the positive CANX-bait/CYB5R3-prey pair at CSV row 2364. Endogenous
      HEK293T anti-mNeonGreen IP-MS groups multiple CYB5R3 products and does not resolve their
      individual contributions.
    '23123858': The current literal pair is absent. The original purified-protein and vascular
      association evidence supports hemoglobin-alpha binding, without establishing membership
      in an oxygen-carrying tetramer.
