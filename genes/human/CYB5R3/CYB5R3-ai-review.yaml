id: P00387
gene_symbol: CYB5R3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYB5R3 is an FAD-containing NADH–cytochrome-b5 reductase that transfers
  reducing equivalents from NADH to cytochrome b5. Its N-terminally anchored, myristoylated
  membrane product acts at the endoplasmic reticulum and mitochondrial outer membrane,
  whereas a shorter soluble product is expressed during late erythroid maturation
  and supports methemoglobin reduction. Partner redox systems connect this chemistry
  to lipid metabolism and vascular nitric-oxide handling. Reconstituted CYB5R3–cytochrome-b5–mARC
  systems also support nitrite reduction, with mARC performing the terminal molybdenum-dependent
  reaction. Pathogenic variants can impair stability, FAD organization or nicotinamide-cofactor
  handling and cause recessive congenital methemoglobinemia.
alternative_products:
- name: 1 (M)
  id: P00387-1
  description: The displayed 301-residue M product has an N-terminal membrane-association
    segment and official mature chain 2–301 with Gly2 myristoylation. ER and mitochondrial-outer-membrane
    functions principally concern this membrane product; cytoplasmic-facing topology
    is partly supported by ortholog evidence.
- name: 2 (S)
  id: P00387-2
  sequence_note: VSP_010200
  description: The 278-residue S product is exactly reconstructed by deleting canonical
    residues 1–23 (VSP_010200). It begins at canonical Met24 and lacks the membrane-association
    segment. The human erythroid transcript supports soluble protein, and PMID24500710
    explicitly uses the 278-residue His-tagged isoform. Historical 275-residue crystal
    and ΔN26 constructs are not this exact product.
- name: '3'
  id: P00387-3
  sequence_note: VSP_042827
  description: The 334-residue product is exactly reconstructed by replacing canonical
    residues 1–7 with the official 40-residue alternative sequence (VSP_042827). Shared
    catalytic-domain sequence does not establish identical abundance, localization
    or partner-dependent activity; no equivalent-function claim is made.
