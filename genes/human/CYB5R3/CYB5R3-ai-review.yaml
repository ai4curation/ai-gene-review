core_functions:
- description: FAD-bound CYB5R3 transfers reducing equivalents from NADH to cytochrome
    b5. The membrane product supplies this reductase step at the ER and mitochondrial
    outer membrane; the soluble erythroid product supports methemoglobin reduction.
    The same electron-delivery chemistry can feed partner enzymes, including mARC,
    without transferring their terminal substrate chemistry to CYB5R3.
  molecular_function: *id001
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:36543799
    supporting_text: CYB5R3 catalyzes the transfer of reducing equivalents from NADH
      to cytochrome b5
  - reference_id: PMID:1898726
  - reference_id: PMID:9639531
  - reference_id: PMID:15502298
suggested_questions:
- question: Which CYB5R3 product and membrane topology account for its detection in
    azurophil-granule fractions, and is extracellular CYB5R3 released as soluble protein
    or membrane-associated material?
- question: Which exact GO molecular-function term should represent the CYB5R3 contribution
    to the cytochrome-b5/mARC nitrite-reducing system, given the cytochrome-c specificity
    of GO:0050421?
- question: Does the 334-residue product have distinct localization or redox-partner
    preferences, and which isoforms underlie the grouped mitochondrial and OpenCell
    proteomic identifications?
suggested_experiments:
- description: Compare the three sequence-verified human products in membrane targeting
    and matched NADH/cytochrome-b5 electron-transfer assays; distinguish the 278-residue
    product from historical 275-residue truncations.
functional_isoforms:
- id: CYB5R3_MEMBRANE
  name: Membrane-associated M product
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P00387-1
  description: The 301-residue M precursor contains the N-terminal membrane-association
    segment and yields the official Gly2-myristoylated chain 2–301. Its reductase
    activity operates at ER and mitochondrial outer membranes. The official record
    describes alternative promoter use and splicing; this class maps the functional
    membrane form without assigning every proteomic observation to that product.
- id: CYB5R3_SOLUBLE
  name: Soluble erythroid S product
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P00387-2
  description: The official 278-residue S product lacks canonical residues 1–23 and
    supports soluble erythroid methemoglobin reduction. PMID:9639531 reports an erythroid
    S transcript and soluble translation product, with internal initiation proposed
    in the accessible abstract. PMID:24500710 explicitly tests His-tagged human 278-residue
    isoform 2 in the reconstituted mARC system. This tested-product knowledge does
    not retrofit imported GOA isoform fields or establish that the chemistry is unique
    to this form. The 275-residue 1UMK crystal fragment is distinct.
status: DRAFT
