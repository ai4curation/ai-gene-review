suggested_questions:
- question: Does FITM2 physically tether the ER and a lipid droplet, beyond binding neutral lipid and
    supporting droplet biogenesis?
- question: How are neutral-lipid binding and acyl-CoA diphosphatase activity coupled in the native membrane,
    and does their coupling depend on substrate or cell state?
- question: Which early adipocyte differentiation effects persist when perturbation timing, knockdown
    strength and lipid-storage defects are separated?
suggested_experiments:
- description: Reconstitute human FITM2 in defined ER-like membranes and measure physical droplet-membrane
    contacts independently of lipid binding, lipid synthesis and droplet formation, with catalytic-histidine
    and neutral-lipid-binding perturbations controlled for folding and abundance.
- description: Compare early and late FITM2 perturbation in human adipocyte differentiation, measuring
    lineage markers, acyl-CoA products, triglyceride flux and droplet morphology with matched rescue constructs.
