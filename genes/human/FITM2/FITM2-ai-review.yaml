id: Q8N6M3
gene_symbol: FITM2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FITM2 (FIT2) is a multipass endoplasmic-reticulum membrane protein that hydrolyzes fatty-acyl-CoA
  to acyl-4-prime-phosphopantetheine and adenosine 3-prime,5-prime-bisphosphate. Its acyl-CoA diphosphatase
  activity supports ER lipid homeostasis and normal lipid-droplet formation. FIT2 also binds neutral lipids
  and promotes lipid-droplet formation and triglyceride storage in adipocytes and other cells.
  Biallelic pathogenic FITM2 variants cause a complex deafness-dystonia
  syndrome.
