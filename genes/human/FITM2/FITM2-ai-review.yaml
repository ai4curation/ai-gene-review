      differentiation. A secondary consequence of severe storage impairment is plausible but is not proved
      to explain the shRNA1 marker changes. Transferring participation in fat-cell differentiation therefore
      overshoots the demonstrated storage role. The later aP2-driven deletion in PMID:24519944 neither
      establishes nor excludes an earlier differentiation role. This judgment does not use the off-path
      family IBD as independent evidence against the separate mouse transfer.
