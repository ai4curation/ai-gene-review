  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The mouse evidence establishes impaired lipid storage more clearly than participation in adipocyte differentiation.
    reason: In PMID:18160536, PPARgamma, aP2 and adiponectin decreased in the strongest Fitm2 shRNA1
      condition, whereas shRNA2/3 retained broadly similar markers despite reduced droplets. The authors'
