- id: GO:0006641
  label: triglyceride metabolic process
  definition: The chemical reactions and pathways involving triglyceride, any triester of glycerol. The
    three fatty acid residues may all be the same or differ in any permutation. Triglycerides are important
    components of plant oils, animal fats and animal plasma lipoproteins.
- id: GO:0045444
  label: fat cell differentiation
  definition: The process in which a relatively unspecialized cell acquires specialized features of an
    adipocyte, an animal connective tissue cell specialized for the synthesis and storage of fat.
- id: GO:0170007
  label: endoplasmic reticulum-lipid droplet tether activity
  definition: The binding activity of a molecule that brings together a lipid droplet with an endoplasmic
    reticulum membrane, via membrane lipid binding, to establish membrane contact sites and mediate exchange
    and communication.
- id: GO:0010945
  label: coenzyme A diphosphatase activity
  definition: 'Catalysis of the reaction: an acyl-coenzyme A or its derivatives + H2O = adenosine 3'',5''-bisphosphate
    + an acyl-4''-phosphopantetheine + 2 H+. This reaction can also use coenzyme A as a substrate.'
