proposed_new_terms:
- proposed_name: albumin transcytosis
  proposed_definition: The directed transcellular transport of serum albumin across a polarized cell
    from one cellular surface to another via endocytic uptake, pH-dependent sorting in endosomes, and
    exocytic release.
  justification: GO currently provides GO:0002416 (IgG immunoglobulin transcytosis in epithelial cells
    mediated by FcRn immunoglobulin receptor) and parent GO:0045056 (transcytosis), which cannot be
    added as a NEW annotation on FCGRT because FCGRT already carries its descendant GO:0002416. A specific
    sibling term for albumin transcytosis is needed to represent FcRn-mediated transcellular albumin
    transport (PMID:28330995) without duplicating ancestor GO:0045056.
