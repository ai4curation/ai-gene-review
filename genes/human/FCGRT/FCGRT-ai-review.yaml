  evidence_type: NAS
  original_reference_id: PMID:7964511
  qualifier: involved_in
  review:
    summary: Core biological process of FCGRT in mediating transcellular transport of maternal IgG
      across polarized epithelial barriers.
    action: ACCEPT
    reason: Story et al. (1994) cloned human FCGRT (hFcRn) from placenta, demonstrated its pH-dependent
      binding to IgG at acidic pH, and established its conservation with rodent neonatal intestinal
      FcRn that mediates epithelial IgG transcytosis. Subsequent functional studies confirmed that
      human FcRn mediates bidirectional IgG transcytosis across placental syncytiotrophoblasts and
      intestinal epithelial cells.
    supported_by:
    - reference_id: PMID:7964511
      supporting_text: Like rat and mouse FcRn, hFcRn binds IgG preferentially at low pH, which may
        imply that IgG binds hFcRn in an acidic intracellular compartment during transport across
        the placenta.
      full_text_unavailable: true
    - reference_id: file:genes/human/FCGRT/FCGRT-uniprot.txt
      supporting_text: The resultant FcRn-IgG complexes are transcytosed across the intestinal epithelium
        and IgG is released from FcRn into blood or tissue fluids.
      record_section:
      - CC:FUNCTION
