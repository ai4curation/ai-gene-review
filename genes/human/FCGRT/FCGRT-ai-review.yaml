suggested_questions:
- question: How do tissue-specific differences in endosomal pH regulation and cytoplasmic tail phosphorylation
    (such as Ser334) modulate the balance between FcRn-mediated recycling versus bidirectional transcytosis
    of IgG and albumin across endothelial, placental, and hepatic cells?
- question: Does the non-overlapping pH-dependent binding of serum albumin (ALB) and monomeric IgG
    to the FCGRT-B2M heterodimer exhibit cooperative allostery during endosomal sorting in vivo?
suggested_experiments:
- description: Perform live-cell quantitative fluorescence lifetime and pH-ratiometric imaging of
    endogenous human FCGRT-B2M heterodimers simultaneously bound to fluorescently labeled monomeric
    IgG and serum albumin in polarized human syncytiotrophoblast and hepatic organoids to determine
    whether dual-ligand occupancy alters sorting kinetics between recycling endosomes and transcytotic
    vesicles.
  hypothesis: Simultaneous occupancy of the non-overlapping IgG and albumin binding sites on FCGRT
    stabilizes the heterodimer in sorting tubules without competitive displacement, but phosphorylation
    of Ser334 in the cytoplasmic tail selectively biases polarized sorting toward apical-to-basolateral
    transcytosis in epithelial barriers.
