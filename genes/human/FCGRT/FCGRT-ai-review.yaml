- id: PMID:31104841
  title: Human Neonatal Fc Receptor Is the Cellular Uncoating Receptor for Enterovirus
    B.
  findings:
  - statement: Human FcRn is an MHC class I-like heterodimer composed of the heavy alpha chain (FCGRT)
      and beta-2-microglobulin (B2M) that localizes to the cell surface and endosome membrane.
    supporting_text: FcRn is an MHC class I-like protein consisting of a heavy α chain encoded by
      the FCGRT gene, and a light β2-microglubulin (β2 m) chain encoded by the B2M gene.
  - statement: Confocal microscopy shows that FcRn is predominantly localized to intracellular compartments
      corresponding to the endosome membrane as well as the cell surface.
    supporting_text: Consistently, CD55 was mainly localized on the cell surface, whereas FcRn displayed
      substantial expression within the cytoplasm, presumably on the endosome membrane
  - statement: During Enterovirus B infection, the FCGRT subunit of FcRn binds the viral capsid canyon
      and induces pocket-factor release and capsid uncoating at acidic endosomal pH (pH 5.5).
    supporting_text: Here, we found that human neonatal Fc receptor (FcRn) is the uncoating receptor
      for major EV-B. FcRn binds to the virus particles in the "canyon" through its FCGRT subunit.
