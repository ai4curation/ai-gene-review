  title: Crystal structure and immunoglobulin G binding properties of the human major
    histocompatibility complex-related Fc receptor(,).
  full_text_unavailable: true
  findings:
  - statement: The 2.7 A crystal structure of human FcRn shows that although it is structurally related
      to class I MHC proteins, its alpha-1/alpha-2 groove is closed and lacks a functional peptide-binding
      groove, while binding human IgG with a 2:1 receptor:ligand stoichiometry.
    supporting_text: FcRn is related to class I MHC proteins but lacks a functional peptide binding
      groove.
    full_text_unavailable: true
- id: PMID:24469444
  title: Structural insights into neonatal Fc receptor-based recycling mechanisms.
  full_text_unavailable: true
  findings:
  - statement: Co-crystal structures of human FcRn bound concurrently to human serum albumin (HSA) and
      engineered IgG Fc show non-overlapping ligand interfaces, with HSA domain III making extensive
      contacts and FcRn His161 (mature numbering; His184 precursor) mediating pH-dependent albumin recycling.
    supporting_text: We report the three-dimensional structure of human neonatal Fc receptor (FcRn)
      bound concurrently to its two known ligands. More particularly, we solved the crystal structure
      of the complex between human FcRn, wild-type human serum albumin (HSA), and a human Fc engineered
      for improved pharmacokinetics properties (Fc-YTE).
    full_text_unavailable: true
- id: PMID:28330995
  title: Hepatic FcRn regulates albumin homeostasis and susceptibility to liver injury.
  full_text_unavailable: true
  findings:
  - statement: FcRn maintains circulating serum albumin homeostasis by mediating basal recycling and
      bidirectional transcytosis of albumin in polarized cells and directing hepatic albumin into the
      circulation rather than bile.
    supporting_text: In vitro models with polarized cells illustrate that FcRn mediates basal recycling
