id: P55899
gene_symbol: FCGRT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IgG receptor FcRn large subunit p51 (FCGRT) is a single-pass type I membrane glycoprotein
  that associates non-covalently with beta-2-microglobulin (B2M) to form the heterodimeric neonatal
  Fc receptor (FcRn). Structurally homologous to major histocompatibility complex (MHC) class I heavy
  chains, FCGRT possesses extracellular alpha-1, alpha-2, and Ig-like C1-type alpha-3 domains, but
  its alpha-1/alpha-2 groove is occluded and does not bind antigenic peptides. Instead, FcRn cycles
  between the endosome membrane and the plasma membrane, capturing the Fc region of monomeric immunoglobulin
  G (IgG) and serum albumin at acidic endosomal pH (pH 5.5-6.0) and releasing them at neutral extracellular
  pH (pH 7.4). Through this pH-dependent ligand sorting mechanism, FCGRT mediates transcellular maternal-fetal
  and intestinal IgG transport (transcytosis) as well as continuous endosomal recycling of circulating
  IgG and albumin in endothelial and hematopoietic cells to maintain their serum half-lives. During
  microbial infection, the FCGRT subunit of FcRn is hijacked in acidic endosomes as the cellular uncoating
  receptor for major Enterovirus B serotypes.
