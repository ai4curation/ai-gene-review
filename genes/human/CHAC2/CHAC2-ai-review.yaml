  label: Homo sapiens
description: >-
  CHAC2 is a cytosolic ChaC-family glutathione-specific
  gamma-glutamylcyclotransferase that cleaves reduced glutathione into
  5-oxo-L-proline and L-cysteinylglycine. It catalyzes the same EC 4.3.2.7
  reaction as the stress-induced paralog CHAC1, with similar specificity for
  reduced glutathione but roughly 10- to 20-fold lower catalytic efficiency in
  purified-enzyme assays. CHAC2 is constitutively expressed and is thought to
  mediate slow basal turnover of the cytosolic glutathione pool.
