id: Q9H5J4
gene_symbol: ELOVL6
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELOVL6 is a multipass endoplasmic-reticulum membrane enzyme that catalyzes the malonyl-CoA-dependent condensation step of fatty-acid elongation, with a strong preference for palmitoyl-CoA and a major role in C16-to-C18 acyl-chain synthesis. It also elongates monounsaturated substrates; weaker polyunsaturated activity has been detected in human membrane-fraction assays. Separate reductase and dehydratase enzymes complete each elongation cycle, and KAR/HSD17B12 stimulates ELOVL6 activity. ELOVL6 supplies acyl-chain precursors for membrane and storage lipids, including C18 ceramides, and performs an upstream step in routes that continue to very-long-chain fatty acids. Mammalian ELOVL6-dependent lipid composition influences hepatic insulin signaling, mitochondrial function and brown-adipose thermogenic adaptation.
