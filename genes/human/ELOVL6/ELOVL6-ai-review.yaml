- id: PMID:19575253
  title: Development of a high-density assay for long-chain fatty acyl-CoA elongases.
  findings:
  - statement: A Unifilter-96 GF/C plate assay was used to profile recombinant human ELOVLs; ELOVL1, -3 and -6 preferentially elongate saturated fatty acyl-CoAs, whereas ELOVL2 and ELOVL5 prefer polyunsaturated acyl-CoAs.
    supporting_text: ELOVL1, -3 and -6 preferably elongated the saturated fatty acyl-CoAs while ELOVL2 and ELOVL5 preferentially elongated the polyunsaturated fatty acyl-CoAs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract checked. Recombinant human ELOVL profiling supports positive activity and relative substrate preference; full tables were not accessible. Preference is not proof of absence of other substrate classes.
- id: PMID:20937905
  title: ELOVL1 production of C24 acyl-CoAs is linked to C24 sphingolipid synthesis.
  findings:
  - statement: The full study assays all seven human ELOVLs, localizes them to ER and reports CERS2 association with each. Individual substrate profiles and functional coupling must be distinguished.
    supporting_text: mammals have seven elongases (ELOVL1-7)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author manuscript and Figure 1 were obtained from HUSCAP despite the abstract-only publication cache. Human all-ELOVL substrate assays, ER localization and CERS2 association were checked. ELOVL1-focused regulation does not imply exclusive CERS2 association or exclude other ELOVL sphingolipid roles; detailed scope and artifact hash are in the manual assessment.
- id: PMID:25003994
  title: Two modes of regulation of the fatty acid elongase ELOVL6 by the 3-ketoacyl-CoA reductase KAR in the fatty acid elongation cycle.
  findings:
  - statement: Purified ELOVL6 reconstituted into proteoliposomes catalyzes the rate-limiting condensation step (C16:0-CoA + malonyl-CoA), with KM 1.22 uM for hexadecanoyl-CoA; its activity is stimulated ~3-fold by the 3-ketoacyl-CoA reductase KAR (HSD17B12) both independently of and dependent on KAR catalysis, indicating coordinated function within the elongation machinery.
    supporting_text: The FA elongase ELOVL6 is responsible for the conversion of C16-CoAs to C18-CoAs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and Figure 2D inspected. Purified ELOVL6 strongly favors C16:0; this does not universally negate weak activities under other assay conditions. KAR co-reconstitution stimulates condensation, while the Discussion explicitly limits claims of definitive physical interaction.
- id: PMID:26214738
  title: Regulation of mitochondrial morphology and function by stearoylation of TFR1.
  findings:
  - statement: Fly dElovl6 loss reduces C16:0-to-C18:0 elongase activity and C18:0 abundance. Human ELOVL6 expression rescues mutant lethality (Extended Data Fig1D), supporting conserved function; restoration of the C18:0 pool by the human transgene was not separately established in that panel.
    supporting_text: their lethality is rescued by human Elovl6
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text available. The human-ELOVL6 rescue of the fly dElovl6 mutant supports the IGI GO:0009922 and GO:0019367 annotations; also links ELOVL6's C18:0 product to mitochondrial regulation via TFR1 stearoylation.
- id: PMID:26628376
  title: Brown Adipose Tissue Thermogenic Capacity Is Regulated by Elovl6.
  findings:
  - statement: Elovl6 converts C16 saturated and monounsaturated fatty acids to C18 and is necessary for brown-adipose-tissue thermogenic capacity in mice; the human ISS/IEA cold-induced-thermogenesis annotations derive from this mouse work.
    supporting_text: Elovl6 acts to convert C16 saturated and monounsaturated fatty acids to C18 fatty acids
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; full text available. Mouse study underpinning the (non-core) cold-induced-thermogenesis annotation; corroborates the C16->C18 core function.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: Large-scale yeast two-hybrid (HuRI) reference interactome; the ELOVL6 binary hits (HMOX1, LCP2, RTP2) are the basis of the IntAct IPI "protein binding" annotations but carry no ELOVL6-specific functional interpretation.
    supporting_text: A reference map of the human binary protein interactome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary HuRI dataset and exact current IntAct target records support the reported interaction pairs. Generic protein binding is credible but non-core; no functional replacement is inferred from screening alone.
