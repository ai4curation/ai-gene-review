id: O94901
gene_symbol: SUN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SUN1 (Sad1/UNC-84 domain protein 1) is a widely expressed type II integral protein of the
  inner nuclear membrane and a core component of LINC (linker of nucleoskeleton and cytoskeleton) complexes.
  Its nucleoplasmic N-terminal region binds A-type lamins (preferentially prelamin A), emerin and short
  nesprin-2 isoforms; a single transmembrane segment is followed by luminal coiled coils that trimerize
  and a C-terminal SUN domain in the perinuclear space. SUN domain trimers bind the C-terminal KASH peptides
  of outer-nuclear-membrane nesprins (nesprin-1 to -4, KASH5 and JAW1/LRMP), with a conserved interchain
  disulfide, and trimers can pair into 6:6 or larger assemblies. The resulting nuclear-envelope-spanning
  bridges transmit forces between the cytoskeleton and the nuclear lamina, supporting nuclear positioning
  and movement, centrosome-nucleus coupling and nucleokinesis during neurogenesis and radial neuronal
  migration (redundantly with SUN2), nuclear mechanics and cell stiffness. In meiotic prophase, SUN1:KASH5
  complexes attach telomeres to the nuclear envelope and couple them to dynein-driven chromosome movements
  required for homolog pairing and fertility. SUN1, unlike SUN2, is also associated with nuclear pore
  complexes and helps determine their distribution. SUN1 accumulation is implicated in the pathology of
  lamin A-related progeroid and dystrophic laminopathies.
