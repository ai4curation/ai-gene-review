core_functions:
- description: Binds GATA-containing cis-regulatory DNA and recruits activating or repressive transcriptional
    partners to control RNA polymerase II transcription. This activity drives erythroid and megakaryocytic
    differentiation and contributes to eosinophil lineage commitment. Distinct FOG1-associated and Mediator/TAL1-associated
    complexes provide different regulatory contexts; these are not a single constitutive supercomplex.
