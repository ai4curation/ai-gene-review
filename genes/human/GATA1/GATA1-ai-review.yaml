suggested_questions:
- question: Which target-occupancy and cofactor-recruitment mechanisms distinguish the 335-residue splice
    product from full-length GATA1 and 330-residue GATA1s in matched human cells, beyond the established
    N-terminal transactivation and short-form-only erythropoietic differences?
- question: Which original assays support the unresolved source-specific glycoprotein-biosynthesis, Sertoli-development
    and absent-ligand apoptotic-process contexts? Accessible abstracts or distinct rescue conditions do
    not resolve those precise claims.
- question: Can the exact FBF1/Q8TES7-6 sequence be joined to the tested HI-II-14 clone for the GATA1–FBF1
    pair? Accession-to-gene identity and the positive gene-level pair are established; only that pair-specific
    clone equivalence remains unresolved.
- question: Does direct mapping of the original FOG1 interaction surface support the incoming C2H2-zinc-finger-domain
    term, given the need to distinguish GATA1 and FOG1 domain orientations?
suggested_experiments:
- description: Compare sequence-verified human P15976-1, P15976-2 and P15976-3 at matched expression in
    the same hematopoietic progenitor background, measuring chromatin occupancy, FOG1/Mediator recruitment
    and erythroid, megakaryocytic and eosinophil outputs separately.
- description: Resolve source-specific platelet glycoprotein effects by separating transcription, new
    protein synthesis, surface trafficking and turnover in matched wild-type and variant human megakaryocytic
    cells.
