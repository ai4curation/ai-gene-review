id: P15976
gene_symbol: GATA1
aliases:
- ERYF1
- GF1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATA1 is a zinc-finger transcription factor that recognizes GATA-containing regulatory DNA
  and organizes context-dependent transcriptional complexes in the nucleus. It activates and represses
  RNA polymerase II target genes during erythroid and megakaryocytic differentiation and helps specify
  eosinophil fate. Interactions with FOG1 and other cofactors couple DNA recognition to lineage-specific
  gene expression. Alternative translation initiation produces GATA1s, which lacks the N-terminal transactivation
  region. Short-form-only states impair human erythropoiesis and occur in Down-syndrome-associated transient
  abnormal myelopoiesis and acute megakaryoblastic leukemia.
alternative_products:
- id: P15976-1
  name: '1'
  sequence_note: Displayed 413-residue product, identical to the direct official canonical FASTA.
  description: The full-length natural sequence includes the N-terminal transactivation region and is
    the reference for domain and residue comparisons. Human short-form-only familial disease supports
    a requirement for full-length GATA1 in normal erythropoiesis (PMID:16783379). Human endogenous observations
    remain distinct from murine and engineered functional constructs.
- id: P15976-2
  name: '2'
  sequence_note: Described 335-residue product. VSP_014782 replaces canonical residues 290–413 with the
    46-residue alternative C terminus; the reconstruction equals direct FASTA.
  description: The retained HI-II-14 library GATA1 ORF6313 translates exactly to this 335-residue sequence.
    Its interaction table is gene-level and does not assign that clone separately to every pair. This
    product is distinct from GATA1s; no universal physiological function or loss is inferred from the
    alternative sequence.
- id: P15976-3
  name: 3 (GATA-1s)
  sequence_note: 'GATA-1s, 330 residues: canonical residues 1–83 are absent, with exact direct FASTA reconstruction.'
  description: Alternative translation initiation produces GATA1s lacking the first 83 residues and N-terminal
    transactivation region. Natural human K562 long/short proteins are directly observed. In PMID:8524811,
    the short-only mouse constructs retain DNA-binding specificity but have lower reporter transactivation
    than full-length constructs at comparable expression; mouse MEL heterodimer immunoprecipitation has
    separate scope. Inherited short-form-only human states impair erythropoiesis, while somatic short-form-only
    mutations occur in Down-syndrome-associated transient abnormal myelopoiesis and acute megakaryoblastic
    leukemia (PMID:16783379). These disease contexts do not make normal GATA1s expression alone sufficient
    for leukemia, or equate every historical construct with this exact human product.
