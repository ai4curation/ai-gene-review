description: GSX2 is a homeodomain transcription factor in developing forebrain progenitors. Human lateral
  ganglionic eminence-like cells show predominantly transcriptional repression. Mouse reporter assays
  show monomer-site repression and homodimer-site activation. Recessive human variants disrupt basal ganglia
  development.
