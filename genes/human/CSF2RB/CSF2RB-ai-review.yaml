    summary: The shared beta chain contributes cytokine recognition and transmembrane signaling.
    action: ACCEPT
    reason: The actual PTHR23037 v19 target sequence and tree place human CSF2RB below PTN000547990, which
      carries the exact cytokine-receptor IBD. Receptor reconstitution, beta-chain mutagenesis and ligand-contact
      experiments support a performed contribution to cytokine recognition and transmembrane signaling
      in the assembled receptor. Neither cytokine receptor activity nor its signaling-receptor parent
      requires a single chain to function in isolation. This source assertion remains biologically correct;
      the compact core separately records the cooperative activity as a contribution. The coreceptor refinement
      on the broader signaling-receptor row describes the shared-beta role more specifically and does
