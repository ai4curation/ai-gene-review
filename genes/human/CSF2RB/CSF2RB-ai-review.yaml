core_functions:
- description: Cooperates with the ligand-specific alpha chains to assemble signaling receptors for GM-CSF,
    IL-3 and IL-5, contributing ligand contacts and affinity conversion and coupling receptor engagement
    to associated JAK signaling at the plasma membrane. The beta chain is not itself a protein kinase;
    the alpha chains also contribute to productive signaling. In the 2024 tagged-receptor HeLa recruitment
    assay, beta associated most strongly with JAK1 FERM–SH2 constructs, with additional JAK2 and TYK2
    association; this is not a universal native kinase preference.
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  contributes_to_molecular_function:
    id: GO:0004896
    label: cytokine receptor activity
  directly_involved_in:
  - id: GO:0038157
    label: granulocyte-macrophage colony-stimulating factor signaling pathway
  - id: GO:0038156
    label: interleukin-3-mediated signaling pathway
  - id: GO:0038043
    label: interleukin-5-mediated signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:7957082
    supporting_text: essential for high affinity ligand-binding and signal transduction
  - reference_id: PMID:38614096
    supporting_text: can occur through receptor heterodimerization
suggested_questions:
- question: Does the six-residue extracellular insertion in P32927-2 change ligand-specific affinity,
    receptor assembly or signaling when compared under matched expression conditions?
- question: How do receptor assembly distributions vary with ligand, cell type and membrane compartment,
    given the different structural, live-cell and engineered-receptor assay contexts?
- question: Does CSF2RB itself participate in an immunoglobulin-mediated response corresponding to the
    broad ancestral IBD, beyond the established IL9R donor program?
- question: Can the first clause of the current GO:0005895 definition be corrected to agree with its IL-5
    receptor label and remaining definition?
- question: Should GO:0042021 be clarified to denote binding the GM-CSF cytokine, or should a distinct
    GM-CSF ligand-binding child of cytokine binding be created? Its current complex-binding wording differs
    from the corresponding IL-3 and IL-5 ligand-binding definitions.
suggested_experiments:
- hypothesis: The extracellular insertion may modify ligand-specific receptor behavior without changing
    the common membrane/signaling topology.
  description: Compare sequence-verified P32927-1 and P32927-2 with each matched alpha chain, controlling
    surface abundance, ligand affinity, JAK/STAT responses and cell survival/proliferation.
status: DRAFT
proposed_new_terms:
- proposed_name: granulocyte-macrophage colony-stimulating factor binding
  proposed_definition: Binding to granulocyte-macrophage colony-stimulating factor (GM-CSF).
  justification: Preserve the distinct GM-CSF ligand identity of an existing experimentally supported
    binding assertion. The current cytokine-binding child audit finds IL-3, IL-5 and G-CSF binding terms,
    whereas GO:0042021 explicitly names a GM-CSF complex. Resolve whether that existing term should be
    clarified or a separate ligand-binding term is needed; no autonomous beta-only binding or new process
    is asserted.
  proposed_parent:
    id: GO:0019955
    label: cytokine binding
  supported_by:
  - reference_id: PMID:18692472
  - reference_id: PMID:38614096
