id: P32927
gene_symbol: CSF2RB
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSF2RB encodes the shared transmembrane beta chain of the human GM-CSF, interleukin-3 and
  interleukin-5 receptors. It cooperates with ligand-specific alpha chains to form cytokine-binding receptor
  assemblies, stabilize high-affinity interactions and couple extracellular engagement to associated JAKs
  and intracellular signaling proteins. This supports cytokine-dependent survival, proliferation and activation
  of hematopoietic cells. The beta chain has no intrinsic kinase domain. Disrupted receptor function can
  impair pulmonary surfactant homeostasis and is associated with pulmonary alveolar proteinosis. Two sequence-defined
  products differ by a six-residue insertion in the extracellular region; their functional equivalence
  has not been established.
