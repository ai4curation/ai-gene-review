- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IDA
  original_reference_id: PMID:38326651
  qualifier: enables
  review:
    summary: Hoppe et al. determined a 2.74 A cryo-EM structure of human GPR161 in complex with heterotrimeric
      Gs, and showed by GloSensor cAMP and miniGs NanoBiT complementation that the receptor couples to
      Gs constitutively; a cholesterol-like sterol at an extrahelical TM6/TM7 site stabilises the Gs-coupled
      conformation, and mutating that site ablates cAMP production and miniGs recruitment.
    action: ACCEPT
    reason: 'This is the defining molecular function of the protein and is demonstrated directly in human
      cells and by structure. One nuance worth recording rather than acting on: GO:0004930''s definition
      speaks of combining with an extracellular signal, whereas GPR161 has no agonist - its own ECL2 occupies
      the orthosteric pocket and a membrane-derived sterol acts as the activating stimulus. The operative
      half of the definition, transmitting a signal across the membrane by activating an associated G
      protein, is exactly what the structure and the miniGs assays establish, so the term is the right
      one and no modification is warranted.'
    supported_by:
    - *id001
    - &id005
      reference_id: PMID:38326651
      supporting_text: Our combined biochemical, simulation, and signaling studies show that cholesterol,
        and potentially other sterols, can bind GPR161 to support interactions with Gs, thereby promoting
        cAMP production.
      reference_section_type: RESULTS
    - *id002
    - &id021
      reference_id: PMID:38326651
      supporting_text: the ECL2 of GPR161 forms a beta hairpin that folds over the extracellular face
        of the receptor to completely occlude the canonical orthosteric ligand binding pocket
      reference_section_type: RESULTS
