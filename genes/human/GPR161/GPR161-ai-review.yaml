- description: 'A-kinase anchoring: tethering the type I PKA holoenzyme to the ciliary membrane. An amphipathic
    helix in the GPR161 cytoplasmic tail binds PKA type I regulatory subunits directly - the only such
    element in any GPCR - positioning the kinase where it phosphorylates GLI2 and GLI3 and drives their
    processing into repressors. This arm, not cAMP production, is what suppression of GLI2 accumulation
    at the ciliary tip requires: a receptor that cannot couple to G(s) still represses ciliary GLI2, whereas
    one carrying the helix-breaking L465P substitution does not. Hedgehog-induced export of GPR161 removes
    the anchored PKA from the cilium together with the receptor, which is how pathway activation lifts
    the brake.'
