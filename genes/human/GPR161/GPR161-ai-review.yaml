core_functions:
- description: Constitutive, ligand-independent G(s)-coupled receptor activity that sustains a high local
    cAMP concentration. An ECL2 beta hairpin occupies the orthosteric pocket and a sterol bound between
    TM6 and TM7 stabilises the active state, so GPR161 engages heterotrimeric G(s)/GNAS without any agonist
    and drives adenylate cyclase. In the resting primary cilium this keeps cAMP high and PKA active, sustaining
    conversion of GLI2 and GLI3 into repressors; pools of the receptor in the plasma membrane and the
    periciliary recycling endosome, where accessible sterol is more abundant than in the ciliary membrane,
    contribute to the same output. Mutating the sterol site ablates cAMP production and G protein recruitment
    but leaves repression of ciliary GLI2 intact, so this arm is the dispensable one for the ciliary brake.
  molecular_function:
