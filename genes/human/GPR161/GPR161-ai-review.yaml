id: Q8N6U8
gene_symbol: GPR161
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GPR161 is a 529-residue orphan class A (rhodopsin-like) G protein-coupled receptor that
  concentrates in the membrane of the primary, non-motile cilium and acts as the principal brake on Hedgehog
  signalling in the resting cell. Unlike almost all other GPCRs it has no activating ligand: its second
  extracellular loop folds into a beta hairpin that occupies and occludes the canonical orthosteric pocket,
  rendering the receptor constitutively active, while a cholesterol-like sterol bound at an extrahelical
  site between transmembrane helices 6 and 7 stabilises the conformation that couples to heterotrimeric
  G(s). Through G(s)/GNAS it activates adenylate cyclase and sustains a high local cAMP concentration.
  GPR161 is additionally the only known GPCR carrying an A-kinase anchoring domain: an amphipathic helix
  in its cytoplasmic tail binds type I protein kinase A regulatory subunits (PRKAR1A, PRKAR1B) directly
  and tethers the PKA holoenzyme to the ciliary membrane. Anchored PKA phosphorylates GLI2 and GLI3, driving
  their proteolytic conversion into the transcriptional repressors GLI2R and GLI3R so that Hedgehog target
  genes stay off. The two arms are experimentally separable: a receptor that cannot couple to G(s) still
  keeps GLI2 out of the ciliary tip, whereas one that cannot bind PKA does not. GPR161 enters the cilium
  in a TULP3- and IFT-A-dependent manner; when Hedgehog ligand activates Smoothened, GPR161 is phosphorylated
  by GRK2, bound by beta-arrestin and exported by the BBSome and intraflagellar transport-B machinery
  into recycling endosomes, removing both the cAMP source and the anchored kinase from the organelle.
  Periciliary endosomal and plasma-membrane pools of the receptor, where accessible sterol is more abundant,
  also contribute to GLI repressor formation. Loss of Gpr161 in mouse is lethal in mid-gestation with
  ventralisation of the neural tube and defective Gli3 processing, and tissue-restricted loss causes polysyndactyly,
  cerebellar tumours and forebrain malformation; the receptor has also been reported to act as a mechanosensor
  of fluid shear stress guiding saltatory neuronal migration. In humans, germline GPR161 variants predispose
  to pediatric medulloblastoma and are found in spina bifida and pituitary stalk interruption syndrome.'
