- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B2RPY5
  review:
    summary: Transferred from mouse Gpr161, where conditional deletion in the limb bud causes derepressed
      Smoothened signalling and polysyndactyly, i.e. a skeletal patterning defect (mouse IMP, ECO:0000315,
      PMID:29222391 in the QuickGO record for UniProtKB:B2RPY5). Human GPR161 loss-of-function likewise
      produces skeletal and limb malformations.
    action: KEEP_AS_NON_CORE
    reason: 'Skeletal system development is a whole developmental programme executed by chondrocytes,
      osteoblasts and the signalling networks that pattern the skeleton. GPR161''s contribution is entirely
      upstream and indirect: it keeps the Hedgehog pathway off, and skeletal patterning goes wrong when
      it cannot. The transfer itself is sound: human GPR161 and mouse Gpr161 are direct orthologs in PANTHER
      subfamily PTHR22752:SF10, and the human and mouse receptors share both documented activities (constitutive
      Gs coupling and PKA anchoring). What is at issue is coreness, not correctness. GPR161 does not carry
      out a step of this developmental programme; it holds one signalling pathway off, and the tissue
      phenotype is what happens when that brake is released. Kept, marked non-core.'
    supported_by:
    - &id006
      reference_id: PMID:38326651
      supporting_text: Knockout of Gpr161 in mice is embryonically lethal, and the embryos display severe
        limb, facial, and early nervous system defects indicative of hyperactive Hedgehog signaling
      reference_section_type: INTRODUCTION
    - reference_id: file:human/GPR161/GPR161-uniprot.txt
      supporting_text: skeletal development, embryonic cerebellar development and forebrain
    - reference_id: file:human/GPR161/GPR161-notes.md
      supporting_text: are whole developmental programmes
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
