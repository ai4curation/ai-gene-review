- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:O75841
  review:
    summary: A single interaction with UPK1B (uroplakin 1B, a urothelial plaque tetraspanin) detected
      in HuRI, the systematic human binary interactome map built from nine genome-scale yeast two-hybrid
      screens. No follow-up assay, no cellular context and no functional consequence is reported for this
      pair, in HuRI or elsewhere.
    action: REMOVE
    reason: 'Bare GO:0005515 carries no functional information: it records that two proteins can associate
      without saying what GPR161 does. The repository policy is to modify such a row when the cited paper
      supports a more informative molecular function, and otherwise to remove it. Here no more informative
      term is available - UPK1B is not part of any described GPR161 mechanism (the mechanistic partners
      are PRKAR1A/PRKAR1B, GNAS, ARRB1/ARRB2, TULP3 and SMO, none of which appears among these IntAct
      rows), and the HuRI authors state explicitly that function does not follow from detection. Removal
      is a judgement about the annotation''s informativeness, not a claim that the reported interaction
      is false. GPR161''s informative molecular functions are captured separately by GO:0004930 and GO:0035591,
      and a PKA-specific binding term is proposed as a NEW row.'
    supported_by:
    - &id003
      reference_id: PMID:32296183
      supporting_text: We screened this search space a total of nine times with a panel of three Y2H assay
        versions
      reference_section_type: RESULTS
    - &id004
      reference_id: PMID:32296183
      supporting_text: the cellular function of most individual PPIs remains to be elucidated
      reference_section_type: DISCUSSION
