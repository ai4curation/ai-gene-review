suggested_questions:
- question: Which pool of GPR161 supplies the cAMP that matters in vivo? The ciliary Gs arm is dispensable
    for GLI2 repression in NIH 3T3 cells while the AKAP arm is essential, yet in zebrafish the AKAP function
    is not fully necessary for Hedgehog pathway suppression. Is the resolution tissue-specific division
    of labour between ciliary, periciliary-endosomal and plasma-membrane receptor?
- question: Is the extrahelical sterol the physiological activating stimulus for GPR161, or is mechanical
    force - the model invoked for the receptor's role in saltatory neuronal migration - the operative
    input, with cholesterol acting as a permissive cofactor?
- question: Should GO:0034237 protein kinase A regulatory subunit binding be added to the GPR161 GOA record,
    and does the GPR161-PKA type I assembly warrant a protein-containing complex term of its own?
- question: GPR161 sits in PANTHER family PTHR22752 alongside the orphan receptors GPR101, GPR176, GPR135,
    GPR61 and GPR62. Do any of those relatives retain a C-terminal AKAP element, and is PKA anchoring
    a GPR161-clade innovation or an older property of the family that was lost elsewhere?
suggested_experiments:
- hypothesis: The AKAP arm and the Gs arm of GPR161 act in different subcellular pools, so their relative
    importance depends on where the receptor is.
  description: Rescue Gpr161-null cells with cilium-targeted and cilium-excluded versions of wild-type
    GPR161, the sterol-site AAA mutant and the L465P AKAP mutant, and score both ciliary GLI2 accumulation
    and GLI3R production. Pair with compartment-resolved cAMP and PKA activity sensors in cilium, periciliary
    endosome and bulk plasma membrane.
  experiment_type: genetic rescue with compartment-targeted biosensors
- hypothesis: Cholesterol occupancy of the TM6/TM7 extrahelical site is the physiological stimulus that
    sets GPR161 output, so acutely changing accessible sterol should change ciliary cAMP through GPR161
    specifically.
  description: Acutely deplete or load accessible cholesterol in the ciliary and plasma membranes and
    measure ciliary cAMP in cells expressing wild-type GPR161 versus the sterol-site AAA mutant, which
    should be insensitive. Combine with the photoaffinity sterol analogues used to map the site in order
    to confirm occupancy changes in situ.
  experiment_type: acute sterol manipulation with ciliary cAMP readout
- hypothesis: GPR161 binds PKA type I regulatory subunits directly in human cells, which is the molecular
    interaction underlying its signaling adaptor activity.
  description: Quantify the GPR161-PRKAR1A and GPR161-PRKAR1B interaction for the human proteins by an
    orthogonal direct-binding method (isothermal titration calorimetry or surface plasmon resonance on
    the purified C-terminal helix, plus proximity ligation in cilia), comparing wild type with L465P,
    so the binding can be annotated on its own rather than only through its downstream consequence.
  experiment_type: quantitative direct binding and in situ proximity assay
- hypothesis: Mechanical shear, not a diffusible ligand, modulates GPR161 activity in migrating neurons.
  description: Apply controlled fluid shear to human neural progenitors and to GPR161-null cells rescued
    with wild type, the sterol-site mutant and the L465P mutant, reading out ciliary cAMP, PKA activity
    and migration speed, to test whether mechanosensitivity requires the Gs arm, the AKAP arm, or neither.
  experiment_type: controlled shear stress with live-cell signalling and motility readout
