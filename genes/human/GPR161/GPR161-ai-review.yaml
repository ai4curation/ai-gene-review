  review:
    summary: 'GPR161 is the only GPCR known to carry an A-kinase anchoring domain: an amphipathic helix
      in its cytoplasmic tail binds type I PKA regulatory subunits directly. Hoppe et al. showed that
      the helix-breaking L465P substitution reduces PKA-RI recruitment while leaving Gs coupling and cAMP
      production intact, and that this mutant - unlike the cAMP-dead sterol-site mutant - fails to keep
      GLI2 out of the ciliary tip. Anchoring PKA, not making cAMP, is what the ciliary brake requires.'
    action: ACCEPT
    reason: 'An exact fit to the term. GO:0035591 is defined as bringing protein and non-protein molecules
      together within a signalling pathway by tethering components and localising them to a specific part
      of the cell, which is what the AKAP helix does: it holds the PKA type I holoenzyme at the ciliary
      membrane where it phosphorylates GLI2 and GLI3. The mutant pair dissociates this activity from GO:0004930
      cleanly, so the two molecular functions on this gene product are complementary rather than redundant,
      and the curated GO-CAMs (693b3c0900000157, 693b3c0900000331, 693b3c0900000434) model GPR161 with
      exactly these two activity nodes.'
