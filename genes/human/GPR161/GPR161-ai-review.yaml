  review:
    summary: Mapped from UniProt subcellular location SL-0039 (Cell membrane). UniProt records GPR161
      as a multi-pass cell-membrane protein in addition to the cilium membrane, and the structure paper
      argues that the plasma-membrane pool, where accessible sterol is more abundant than in the ciliary
      membrane, can itself support cAMP production.
    action: ACCEPT
    reason: 'Correct and functionally relevant, not merely a default for a seven-transmembrane protein.
      The non-ciliary pools of GPR161 are an active part of the mechanism: both ciliary and extraciliary
      receptor contribute to GLI repressor formation in mouse. The more specific GO:0098804 non-motile
      cilium membrane, a descendant of this term, is annotated separately with direct evidence; keeping
      the parent records the extraciliary pool.'
