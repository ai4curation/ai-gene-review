      recruitment by human GPR161 in human cells and showed that the helix-breaking L465P substitution
      reduces it while leaving Gs coupling untouched, and that the same substitution abolishes repression
      of ciliary GLI2.
    action: NEW
    reason: 'GOA has the downstream consequence of this binding (GO:0035591 signaling adaptor activity)
      but not the binding itself, which is the specific, assayable molecular interaction the AKAP region
      performs. GO:0034237 is defined as binding to one or both regulatory subunits of protein kinase
      A, which is exactly what is measured. It is not redundant with GO:0035591: that term sits under
      GO:0060090 molecular adaptor activity and describes the tethering role, whereas GO:0034237 sits
      under GO:0005515 and names the partner, so neither is an ancestor of the other. It is proposed conservatively,
      as the informative binding term that the five generic GO:0005515 rows on this record fail to supply,
      and is the only NEW row here - no process term is proposed, because every Hedgehog-pathway process
      GPR161 participates in is already annotated and the transport and GLI-processing steps around it
      are performed by other gene products.'
    supported_by:
    - *id008
    - *id009
    - *id010
    - *id011
