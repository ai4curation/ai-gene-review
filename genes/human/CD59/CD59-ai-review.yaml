id: P13987
gene_symbol: CD59
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD59 is a glycosylphosphatidylinositol-anchored Ly6/uPAR-domain protein displayed on the external leaflet of human plasma membranes. It is a terminal complement regulator that binds nascent C5b-8 and C5b-9 membrane-attack-complex intermediates through complement C8 and C9 beta-hairpins, bends their membrane-inserting strands away from the bilayer, and thereby prevents pore formation and C9 polymerization. Lipid-anchored CD59 protects host cells, including blood and epithelial cells, from homologous complement-mediated lysis; soluble CD59 forms can retain complement binding but inhibit membrane attack complex assembly far less efficiently.
