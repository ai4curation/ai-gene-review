core_functions:
- description: GPI-anchored external plasma-membrane inhibitor of the terminal complement membrane attack complex that binds nascent C5b-8/C5b-9 via complement C8 and C9 and traps the pore-forming beta-hairpins before they can insert and polymerize into a lytic MAC pore.
  molecular_function:
    id: GO:0001848
    label: complement binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0001971
    label: negative regulation of activation of membrane attack complex
  - id: GO:1903660
    label: negative regulation of complement-dependent cytotoxicity
  supported_by:
  - reference_id: file:human/CD59/CD59-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Acts by binding to the beta-haipins of C8 (C8A and C8B) components of the assembling MAC, forming an intermolecular beta-sheet that prevents incorporation of the multiple copies of C9 required for complete formation of the osmolytic pore
  - reference_id: PMID:36797260
    supporting_text: CD59 directly engages both proteins within the nascent MAC to trap C5b8 and C5b9 assembly intermediates
  - reference_id: PMID:1698710
    supporting_text: protectin efficiently prevented cell lysis by human serum
suggested_questions:
- question: Which CD59 binding surfaces control complement C8/C9 inhibition versus pathogen hijacking by cholesterol-dependent cytolysins, and can antibodies or small molecules selectively alter one interface?
suggested_experiments:
- description: Mutate exposed residues on the GPI-anchored CD59 Ly6/uPAR domain and measure C5b-8 binding, C5b-9 binding, C9 polymerization and complement-dependent lysis in reconstituted nanodiscs and CD59-null human cells.
  experiment_type: structure-guided mutagenesis with complement-lysis and cryo-EM assays
