core_functions:
- description: 'Caprin-1 binds selected messenger RNAs through its C-terminal RGG motifs, choosing the cargo that its granules carry: MYC and CCND2 transcripts in proliferating cells and BDNF, CAMK2A, CREB1, MAP2, NTRK2, GRIN1 and KPNB1 transcripts in neurons, while excluding rRNA.'
