    label: cytoplasmic stress granule
  supported_by:
  - reference_id: PMID:27022092
    supporting_text: 'Caprin1/USP10 binding to G3BP is mutually exclusive: Caprin binding promotes, but USP10 binding inhibits, SG formation.'
  - reference_id: PMID:17210633
    supporting_text: Caprin-1 exhibits a highly conserved motif, F(M/I/L)Q(D/E)Sx(I/L)D that binds to the NTF-2-like domain of G3BP-1.
  - reference_id: PMID:36279435
    supporting_text: The C-terminal domain of Caprin-1 underwent spontaneous LLPS, whereas the N-terminal domain and GIM of Caprin-1 suppressed LLPS of G3BP1.
  - reference_id: PMID:35977029
    supporting_text: We validated that NDD-related de novo variants in newly implicated and known NDD genes, such as CAPRIN1, disrupt the interaction of the core SG network and interfere with SG formation.
suggested_questions:
- question: Full-length caprin-1 promotes stress-granule assembly, yet its isolated N-terminal domain and G3BP1-interacting motif suppress G3BP1 phase separation while its C-terminal IDR drives condensation. What sets the balance between the two halves in cells, and does the sign ever invert physiologically?
- question: Which mRNAs does human caprin-1 select in non-neuronal cells, and is the selection made by the RGG motifs alone or by the composition of the condensate the transcript enters?
- question: Is the CNOT7 recruitment that caprin-1 performs in reconstituted condensates a direct protein-protein adaptor contact, and if so which caprin-1 region makes it?
- question: Do the two CAPRIN1 disease mechanisms converge? Haploinsufficiency and the aggregation-prone P512L allele give different disorders, so it is unclear whether P512L acts purely by gain of aggregation or also by depleting normal granule function.
suggested_experiments:
- description: Rescue CAPRIN1-knockout human cells with separation-of-function alleles - GIM-dead (G3BP1 binding lost), RGG-deleted (mRNA binding lost) and IDR-swapped (condensation altered) - and score stress-granule assembly, target-mRNA translation and poly(A) tail length separately, to test which of the three core activities each phenotype actually requires.
- description: Perform CLIP on endogenous caprin-1 in a non-neuronal human cell line before and after arsenite stress, to establish the human target mRNA set and whether granule entry changes it.
- description: Reconstitute CAPRIN1 condensates with purified CCR4-NOT and test deadenylation with and without the candidate caprin-1 adaptor region, to decide whether GO:0060090 molecular adaptor activity should be refined to a deadenylase-recruitment term.
