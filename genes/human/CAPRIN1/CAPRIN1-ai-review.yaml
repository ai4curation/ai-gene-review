  - id: GO:0106288
    label: regulation of deadenylation-dependent decapping of nuclear-transcribed mRNA
  locations:
  - id: GO:0036464
    label: cytoplasmic ribonucleoprotein granule
  supported_by:
  - reference_id: file:human/CAPRIN1/CAPRIN1-uniprot.txt
    record_section: ["CC:DOMAIN"]
    supporting_text: The C-terminal disordered region undergoes liquid-liquid phase separation (LLPS) for the formation of a membraneless compartment that concentrates mRNAs with associated regulatory factors
  - reference_id: file:human/CAPRIN1/CAPRIN1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: In these cytoplasmic ribonucleoprotein granules, CAPRIN1 mediates recruitment of CNOT7 deadenylase, leading to mRNA deadenylation and degradation
  - reference_id: PMID:31439799
    supporting_text: We found that different FMRP serine/threonine and CAPRIN1 tyrosine phosphorylation patterns control phase separation propensity with RNA, including subcompartmentalization, and tune deadenylation and translation rates in vitro.
  - reference_id: PMID:17210633
    supporting_text: cells lacking Caprin-1 exhibited no changes in global rates of protein synthesis, suggesting that physiologically, the effects of Caprin-1 on translation were limited to restricted subsets of mRNAs
- description: Caprin-1 binds the NTF2-like domain of G3BP1 through a conserved G3BP1-interacting motif, competing with USP10 for the same pocket, and its binding shifts the G3BP1 switch towards condensation so that stress granules assemble. Loss-of-function variants that break this interaction interfere with granule formation.
  molecular_function:
