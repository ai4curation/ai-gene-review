- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:31439799
  qualifier: enables
  review:
    summary: The adaptor claim is right; the signaling-pathway restriction is not.
    action: MODIFY
    reason: What this paper and the curated record support is that CAPRIN1 brings the CNOT7 deadenylase together with condensed target mRNA, which is an adaptor activity. GO:0035591 is however defined as bringing molecules together in a signaling pathway, and deadenylase recruitment inside an mRNP condensate is RNA processing, not signal transduction. The parent term GO:0060090 molecular adaptor activity states exactly the supported claim with the signaling restriction dropped, so this is a generalising correction rather than a demotion of the curator's reading. Noted deliberately because the same term is used for the CAPRIN1 and FMR1 nodes of the production GO-CAM gomodel:63894f2500001378, so this is an explicit argument with a modelling decision.
    proposed_replacement_terms:
    - id: GO:0060090
      label: molecular adaptor activity
    supported_by:
