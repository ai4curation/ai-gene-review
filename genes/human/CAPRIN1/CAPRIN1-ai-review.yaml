id: Q14444
gene_symbol: CAPRIN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CAPRIN1 encodes caprin-1, a ubiquitously expressed cytoplasmic RNA-binding protein that packages selected messenger RNAs into membraneless ribonucleoprotein granules. It binds target transcripts through C-terminal RGG motifs and uses its long C-terminal intrinsically disordered region to undergo liquid-liquid phase separation, concentrating those mRNAs together with regulatory factors; ATP, tyrosine phosphorylation and O-GlcNAcylation tune how readily it condenses. A short motif in its central region binds the NTF2-like domain of G3BP1, in competition with USP10, and caprin-1 binding pushes that switch towards stress-granule assembly. Inside the condensates it represses translation of the transcripts it holds and recruits the CNOT7 deadenylase to shorten their poly(A) tails. The same machinery carries mRNAs to sites of local translation: caprin-1 is the human counterpart of the dendritic RNA-granule protein RNG105, and is also found in leading-edge granules of migrating cells and in P-bodies. Loss-of-function variants cause a neurodevelopmental disorder with language impairment, and an aggregation-prone missense allele causes childhood-onset ataxia with cerebellar degeneration. Despite historical names such as GPI-anchored protein p137, caprin-1 is not a membrane protein.'
