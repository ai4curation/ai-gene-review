      record_section: ["CC:FUNCTION"]
      supporting_text: In these cytoplasmic ribonucleoprotein granules, CAPRIN1 mediates recruitment of CNOT7 deadenylase, leading to mRNA deadenylation and degradation
    - reference_id: PMID:31439799
      supporting_text: We found that different FMRP serine/threonine and CAPRIN1 tyrosine phosphorylation patterns control phase separation propensity with RNA, including subcompartmentalization, and tune deadenylation and translation rates in vitro.
