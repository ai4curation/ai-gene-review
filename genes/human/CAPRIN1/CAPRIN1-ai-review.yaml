    label: cytosol
  - id: GO:0036464
    label: cytoplasmic ribonucleoprotein granule
  supported_by:
  - reference_id: PMID:17210633
    supporting_text: The carboxy-terminal region of Caprin-1 selectively bound mRNA for c-Myc or cyclin D2, this binding being diminished by mutation of the three RGG motifs and abolished by deletion of the RGG-rich region.
  - reference_id: file:human/CAPRIN1/CAPRIN1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: In neuronal cells, directly binds to several mRNAs associated with RNA granules, including BDNF, CAMK2A, CREB1, MAP2, NTRK2 mRNAs, as well as to GRIN1 and KPNB1 mRNAs, but not to rRNAs
- description: The C-terminal intrinsically disordered region of caprin-1 phase-separates and scaffolds a membraneless cytoplasmic compartment that concentrates bound mRNAs with their regulatory factors. Within that compartment caprin-1 represses translation of the held transcripts and acts as the adaptor that brings in the CNOT7 deadenylase, shortening their poly(A) tails. Condensation is tuned by ATP, by EPHA4-dependent tyrosine phosphorylation that drives co-condensation with FMRP, and by O-GlcNAcylation.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
