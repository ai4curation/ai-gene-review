- term:
    id: GO:0062029
    label: positive regulation of cytoplasmic stress granule assembly
  evidence_type: IDA
  original_reference_id: PMID:27022092
  qualifier: involved_in
  review:
    summary: 'Core: Caprin-1 binding to G3BP1 shifts the switch towards granule condensation.'
    action: ACCEPT
    reason: Promoting stress-granule assembly is one of CAPRIN1's two core activities. Caprin-1 and USP10 bind the same hydrophobic pocket of the G3BP1 NTF2-like domain through their G3BP1-interacting motifs and act in opposite directions, with Caprin-1 binding promoting assembly; RNA-dependent overexpression of caprin-1 is by itself enough to induce granules. The net positive sign holds even though the isolated N-terminal domain and GIM suppress G3BP1 phase separation while the C-terminal IDR drives it.
