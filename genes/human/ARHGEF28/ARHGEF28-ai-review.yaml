- term:
    id: GO:0048041
    label: focal adhesion assembly
  evidence_type: IMP
  original_reference_id: PMID:24006257
  qualifier: involved_in
  review:
    summary: Focal adhesion assembly (NEW, IMP). Rgnef-null fibroblasts are defective in adhesion formation
      on fibronectin; rescue needs Rgnef-FAK binding and an intact PH domain but not GEF activity. Rgnef
      therefore does work in adhesion assembly as a scaffold, the role in which talin carries this term.
    action: NEW
    reason: '[PMID:24006257 "Rgnef-null mouse embryo fibroblasts (MEFs) exhibit defects in adhesion formation,
      levels of FAK phosphotyrosine (pY)-397 and FAK localization to peripheral adhesions upon re-plating
      on FN. Rgnef re-expression rescues these defects, but requires Rgnef-FAK binding."] [PMID:24006257
      "These results support a scaffolding role for Rgnef in FAK localization and activation at early
      adhesions in a PH-domain-dependent but GEF-activity-independent manner."]'
    supported_by:
    - reference_id: PMID:24006257
      supporting_text: Rgnef-null mouse embryo fibroblasts (MEFs) exhibit defects in adhesion formation,
        levels of FAK phosphotyrosine (pY)-397 and FAK localization to peripheral adhesions upon re-plating
        on FN. Rgnef re-expression rescues these defects, but requires Rgnef-FAK binding.
