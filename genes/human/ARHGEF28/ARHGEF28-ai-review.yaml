id: Q8N1W1
gene_symbol: ARHGEF28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF28 (RGNEF, p190RhoGEF) is a large Lbc-family Rho guanine nucleotide exchange factor
  with an N-terminal IPT/TIG region, a DH/PH catalytic module and a long C-terminal region with coiled
  coils. Its DH/PH module activates RhoA but not Rac1 or Cdc42; the full-length protein is autoinhibited
  in vitro, and its PH domain binds active RhoA and Rac1, which promotes its access to RhoA-GDP. Endogenous
  protein is cytosolic, along microtubules, and at RhoA-rich plasma membrane regions. Downstream of fibronectin-integrin
  engagement it activates RhoA and, through a GEF-independent scaffolding role, recruits and activates
  FAK at early adhesions, supporting focal adhesion formation and cell migration. Its C-terminal region
  binds the neurofilament light chain mRNA, and RGNEF has been implicated in amyotrophic lateral sclerosis.
