      A real, multiply-assayed partner rather than screen noise, so the uninformative
      parent term can be replaced. Q96PM5 is RCHY1/Pirh2, a RING-type E3 ubiquitin
      transferase (EC 2.3.2.27), which makes GO:0031625 ubiquitin protein ligase
