- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:27018888
  qualifier: located_in
  review:
    summary: >-
      The cited reference contains no localisation experiment of any kind. What it
      shows is recovery of activity in a crude 100,000 g membrane pellet, which
      supports GO:0016020 membrane - separately annotated from the same paper - but
      not a plasma-membrane compartment call. The only study that did examine AIG1's
      localisation places it in the ER membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A phrase scan of the cached full text (full_text_available true) returns zero
      occurrences of 'plasma membrane', 'cell surface', 'immunofluoresc', 'confocal',
      'subcellular', 'localization' and 'localisation', against positive controls in
      the same file of 'membrane fraction' 3, 'membrane lysates' 9, 'transmembrane'
      29, 'HEK293T' 36 and 'FAHFA' 67, so the zeros are real absences rather than a
      broken scan. The only sentence in the paper that resembles a compartment claim
      is explicitly speculative about where the chemistry might occur, and the paper's
      topology statement is six prediction programs rather than an experiment. This is
      the same reasoning the merged ADTRP review applied to its byte-identical row,
      and the scan reproduces that review's counts exactly; the two genes then diverge
      on the conclusion, and the divergence is the point. ADTRP's plasma-membrane call
      stands independently on PMID:21868574, which imaged ADTRP with TFPI and
      caveolin-1 in endothelial lipid rafts, so that review could ACCEPT the term with
      only an attribution caveat. AIG1 has no equivalent paper: its UniProt
      SUBCELLULAR LOCATION line reads 'Cell membrane {ECO:0000269|PubMed:27018888}'
      and cites nothing else, so the entire plasma-membrane claim on this gene rests
      on a reference that does not make it. Meanwhile PMID:27040980 used a
      protease-protection assay to place AIG1 in the ER membrane, with an ER Ca2+
      functional readout. Not REMOVE: AIG1 is unambiguously a membrane protein and the
      term is unsupported rather than refuted, the cached text excludes supplementary
      figures, and the ER paper is a single study whose full text is not available.
      Marked over-annotated, with the compartment conflict recorded as a knowledge gap
      and a suggested experiment.
    supported_by:
    - reference_id: PMID:27018888
      supporting_text: Both KC01 and JJH260, but not THL or ABC34 also inhibited the FAHFA
        hydrolase activity of LNCaP cell lysates, which was mostly found in the membrane
        fraction
    - reference_id: PMID:27018888
      supporting_text: That these residues are generally predicted to be embedded within
        transmembrane domains of AIG1 and ADTRP indicates these enzymes could have evolved
        to perform hydrolytic chemistry within the cell membrane environment
    - reference_id: PMID:27040980
      supporting_text: Analyzing the topology of AIG1 in the ER membrane using a protease-protection
        assay suggested
