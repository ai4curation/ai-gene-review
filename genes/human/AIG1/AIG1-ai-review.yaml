- term:
    id: GO:0042758
    label: long-chain fatty acid catabolic process
  evidence_type: IMP
  original_reference_id: PMID:27018888
  qualifier: involved_in
  review:
    summary: >-
      Supported by shRNA knockdown of AIG1 in human LNCaP cells, which cut hydrolysis
      of an isotopically labelled PAHSA substrate by about 70 percent. The experiment
      is human, so IMP is the species-correct code.
    action: ACCEPT
    reason: >-
      Two independent human loss-of-function arms support it: two stable shRNA lines
      against AIG1 in LNCaP reduced conversion of doubly labelled 13C,2H-PAHSA to its
      free fatty acid and hydroxy fatty acid products by roughly 70 percent relative to
      a scrambled control, and two structurally distinct covalent inhibitors reduced the
      same conversion by 70-80 percent while their matched inactive control compounds
      did not. The same inhibitor pattern reproduced in primary human T cells. All
      systems are human, so IMP rather than ISS is correct. The process term is
      chemically sound for this reaction because ChEBI classifies the FAHFA substrate as
      a long-chain fatty acid anion. It remains the only process term GO can offer;
      there is no FAHFA-level biological process, which is recorded as an ontology
      knowledge gap.
    supported_by:
    - reference_id: PMID:27018888
      supporting_text: We next treated shAIG1 and shControl cells with 13C,2H-PAHSA and observed
        a ~70% reduction in hydrolysis products in the shAIG1 cells compared to shControl
        or uninfected cell lines
    - reference_id: PMID:27018888
      supporting_text: These results, taken together, indicate that AIG1 functions as a major
        FAHFA hydrolase in human cells.
