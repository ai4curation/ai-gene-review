- id: PMID:32152231
  title: AIG1 and ADTRP are endogenous hydrolases of fatty acid esters of hydroxy fatty
    acids (FAHFAs) in mice.
  findings:
  - statement: >-
      Elevated tissue FAHFAs are reported for Adtrp single knockouts and for AIG1/ADTRP
      double knockouts. The Aig1 single knockout is not reported as elevating tissue
      FAHFAs, so AIG1's individual in vivo contribution is not established here.
    supporting_text: Tissues from mice lacking ADTRP (Adtrp-KO), or both AIG1 and ADTRP (DKO)
      had higher concentrations of FAHFAs
  - statement: >-
      The specificity established in vitro holds in vivo: other lipid classes are
      unaffected by loss of the two enzymes.
    supporting_text: The levels of other lipid classes were unaltered indicating that AIG1
      and ADTRP specifically hydrolyze FAHFAs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The in vivo confirmation that this family sets endogenous FAHFA tone, quoted with its
      own limitation intact rather than truncated at the convenient point. Murine, so it
      supports no experimental evidence code on a human annotation. Absent from GOA
      entirely.
- id: PMID:38816388
  title: Inflammation causes insulin resistance in mice via interferon regulatory factor
    3 (IRF3)-mediated reduction in FAHFA levels.
  findings:
  - statement: >-
      Adipocyte AIG1 overexpression promotes high-fat-diet insulin resistance and
      pharmacological AIG1 inhibition reverses it, placing the enzyme downstream of IRF3
      in a metabolic pathway.
    supporting_text: Adipocyte-specific knockout of IRF3 protects male mice against high-fat
      diet-induced insulin resistance, whereas overexpression of IRF3 or AIG1 in adipocytes
      promotes insulin resistance on a high-fat diet.
  - statement: >-
      The effect requires catalysis: the T43A and H134A alleles do not reproduce it,
      tying the metabolic phenotype to the FAHFA hydrolase activity rather than to a
      separate scaffolding role.
    supporting_text: As before, FI3KO adipocytes exhibited elevated p-AKT level and insulin-stimulated
      glucose uptake, which was fully suppressible by WT AIG1 overexpression, but not two
      different alleles of Aig1 bearing mutations in the catalytic domain (T43A and H134A)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Every AIG1-specific experiment is murine - FI3KO/FI3OE adipocytes,
      mouse brain and kidney membrane proteomes, high-fat-diet mice - and the human SGBS
      adipocyte work concerns IRF3, not AIG1; the only hAIG1 strings in the text are inside
      the construct name shAIG1. Hence ISS rather than IMP on the annotation it supports.
      Absent from GOA.
- id: PMID:40303337
  title: AIG1 protects against doxorubicin-induced cardiomyocyte ferroptosis and cardiotoxicity
    by promoting ubiquitination-mediated p53 degradation.
  findings:
  - statement: >-
      Endogenous AIG1 and Pirh2 co-immunoprecipitate from cardiomyocytes, independently
      corroborating the interaction behind the single GO:0005515 row.
    supporting_text: Co-IP results similarly indicated that endogenous AIG1 strongly interacted
      with Pirh2 in cardiomyocytes under steady-state conditions
  - statement: >-
      AIG1 promotes Pirh2-dependent ubiquitination of p53; removing the AIG1 region
      required for Pirh2 binding reduces both the Pirh2-p53 association and p53
      ubiquitination.
    supporting_text: Importantly, the deletion of the 35-93 aa domain of AIG1 resulted in
      significant reductions in Pirh2-p53 interaction and p53 ubiquitination
  - statement: >-
      The interaction was mapped by deletion of residues 35-93, a span that removes an
      entire transmembrane helix, so it locates a requirement rather than a contact
      surface.
    supporting_text: The results showed that Pirh2 interacted with full-length AIG1 and the
      AIG1 Δ161-175 aa mutant, but not with the AIG1 Δ35-93 aa mutant when co-expressed in
      HEK293T cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Murine throughout - C57BL/6 mice, AAV9 cardiac transduction and the
      HL-1 mouse cardiomyocyte line - with the HEK293T truncation co-IPs not stating the
      species of the constructs, hence ISS. It is from a different Fudan department and
      author group than the 2011 yeast two-hybrid work, 14 years later and with different
      methods, so it is genuine corroboration of the Pirh2 interaction rather than a
      restatement. Absent from GOA.
- id: file:human/AIG1/AIG1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AIG1 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Trust gates passed and all seven citations are numeric PMIDs that resolve to papers
      genuinely about AIG1, with no bioRxiv identifiers in a PMID-shaped field and no
      retraction or expression of concern among them. Recall was good here: it surfaced
      four papers absent from GOA (PMID:27040980, PMID:32152231, PMID:38816388,
      PMID:40303337), two of which changed this review. Marked LOW_QUALITY solely for its
      own GO grounding block, which is wrong and was not imported - it lists GO:0140098
      'catalytic activity, acting on RNA' for a lipid hydrolase, and asserts GO:0005783
