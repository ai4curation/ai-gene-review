      A coverage gap: a catalysis-dependent effect of AIG1 on insulin signalling was
      demonstrated in adipocytes and produced no GO annotation on any species. Proposed
      as ISS because every AIG1-specific experiment in the paper is murine.
    action: NEW
    reason: >-
      In mouse adipocytes, AIG1 overexpression lowered insulin-stimulated AKT
      phosphorylation and glucose uptake, AIG1 knockdown reversed the same readouts in
      the opposite genetic background, and a selective covalent AIG1 inhibitor restored
      glucose homeostasis in vivo on a high-fat diet. Critically for a catalytic gene,
      the T43A and H134A alleles - the same two residues whose mutation abolishes FAHFA
      hydrolysis - failed to reproduce the wild-type effect, so the phenotype runs
      through the enzyme activity rather than through an unrelated scaffolding role,
      which is what makes it a function rather than a disease association. Evidence code
      is ISS and not IMP because the species check was run explicitly: FI3KO and FI3OE
      adipocytes are murine, the activity-based profiling was in mouse brain and kidney
      membranes, and the high-fat-diet work is in mice. The paper does use human SGBS
      adipocytes, but only for IRF3; the sole hAIG1 strings in the full text are inside
      the shRNA construct name shAIG1. Human AIG1 and mouse Aig1 are orthologues in a
      family whose Thr/His dyad is strictly conserved, and the human enzyme is the
      principal FAHFA hydrolase of human cells, so the orthology inference is
      well-founded - but it is an inference, and the code says so.
    supported_by:
    - reference_id: PMID:38816388
      supporting_text: Adipocyte-specific knockout of IRF3 protects male mice against high-fat
        diet-induced insulin resistance, whereas overexpression of IRF3 or AIG1 in adipocytes
        promotes insulin resistance on a high-fat diet.
    - reference_id: PMID:38816388
      supporting_text: As before, FI3KO adipocytes exhibited elevated p-AKT level and insulin-stimulated
        glucose uptake, which was fully suppressible by WT AIG1 overexpression, but not two
        different alleles of Aig1 bearing mutations in the catalytic domain (T43A and H134A)
- term:
    id: GO:0031398
    label: positive regulation of protein ubiquitination
  evidence_type: ISS
  original_reference_id: PMID:40303337
  qualifier: involved_in
  review:
    summary: >-
      The catalysis-independent half of AIG1's biology, currently represented in GO only
      by a bare protein binding row. AIG1 binding to Pirh2/RCHY1 promotes
      Pirh2-dependent ubiquitination of p53. Proposed as ISS because the functional work
      is murine.
    action: NEW
    reason: >-
      AIG1 knockdown reduced Pirh2 protein and Pirh2-p53 association, AIG1
      overexpression increased both, and deleting the AIG1 region required for Pirh2
      binding reduced p53 ubiquitination - a consistent gain- and loss-of-function pair
      with a readout on the ubiquitination step itself rather than only on p53 levels.
      This is the natural biological-process partner of the GO:0031625 binding term
      proposed on the GO:0005515 row, and neither has any representation in GOA today.
      Code is ISS because the experiments are in C57BL/6 mice, AAV9-transduced hearts and
      the murine HL-1 cardiomyocyte line; the HEK293T truncation co-IPs do not state the
      species of the constructs, so they cannot upgrade the code. GO has no
      p53-specific ubiquitination child, so GO:0031398 is the most specific available
      term. A deliberately weaker claim than the paper's: no residue- or surface-level
      mechanism is asserted, because the 35-93 deletion that maps the interaction removes
      an entire transmembrane helix and cannot separate a contact surface from loss of
      folding.
    supported_by:
    - reference_id: PMID:40303337
      supporting_text: Importantly, the deletion of the 35-93 aa domain of AIG1 resulted in
        significant reductions in Pirh2-p53 interaction and p53 ubiquitination
    - reference_id: PMID:40303337
      supporting_text: Mechanistically, AIG1 directly interacted with the Pirh2 E3
