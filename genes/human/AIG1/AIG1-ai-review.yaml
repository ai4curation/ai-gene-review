- id: PMID:27018888
  title: AIG1 and ADTRP are atypical integral membrane hydrolases that degrade bioactive
    FAHFAs.
  findings:
  - statement: >-
      Activity-based protein profiling identified AIG1 as a fluorophosphonate-reactive
      protein and established that it and ADTRP hydrolyse FAHFAs using conserved Thr and
      His residues.
    supporting_text: We show that AIG1, and the sequence-related homologous protein ADTRP,
      possess conserved Thr and histidine (His) residues required for FP reactivity and
      find that both enzymes hydrolyze the fatty-acid esters of hydroxy-fatty acid (FAHFA)
      class of lipids in vitro and in human cells.
  - statement: >-
      Thr43 is the nucleophile. Of fifteen individual Ser/Thr-to-Ala mutants only T43A
      lost probe labelling entirely.
    supporting_text: Among the 15 individual Ser/Thr-to-Ala mutant proteins evaluated, only
      the T43A mutant showed a complete loss of FP-labeling
  - statement: His134 is the general base; mutating it eliminates probe labelling.
    supporting_text: Mutation of His134 to Ala in AIG1 (H134A) eliminated FP-labeling
  - statement: >-
      Both catalytic residues are required for the FAHFA hydrolase activity itself, not
      only for probe reactivity.
    supporting_text: The FAHFA hydrolase activities of AIG1 and ADTRP were abolished by
      mutating their putative catalytic nucleophilic residues Thr-43 and Thr-47, respectively
  - statement: >-
      Specificity is restricted to FAHFAs; the common phospholipid and neutral lipid
      classes are not substrates.
    supporting_text: The membrane lysates of hAIG1- and hADTRP-transfected HEK293T cells
      showed negligible hydrolytic activity above a mock-transfected control proteome with
      the majority of tested lipid substrates
  - statement: Within the FAHFA class, branching distal from the carboxylate head group is preferred.
    supporting_text: AIG1 and ADTRP displayed a preference for FAHFAs with branching distal
      from the carboxylate head group of the lipids
  - statement: >-
      shRNA knockdown in human LNCaP cells cut PAHSA hydrolysis by about 70 percent,
      establishing AIG1 as the principal FAHFA hydrolase of human cells.
    supporting_text: We next treated shAIG1 and shControl cells with 13C,2H-PAHSA and observed
      a ~70% reduction in hydrolysis products in the shAIG1 cells compared to shControl or
      uninfected cell lines
  - statement: >-
      The activity partitions to the membrane fraction of untransfected human cells,
      which is the localisation evidence this paper supports.
    supporting_text: Both KC01 and JJH260, but not THL or ABC34 also inhibited the FAHFA
      hydrolase activity of LNCaP cell lysates, which was mostly found in the membrane fraction
  - statement: >-
      The suggestion that catalysis occurs within the bilayer is explicitly a
      prediction-based inference, not a localisation or topology measurement.
    supporting_text: That these residues are generally predicted to be embedded within transmembrane
      domains of AIG1 and ADTRP indicates these enzymes could have evolved to perform hydrolytic
      chemistry within the cell membrane environment
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining paper for this gene and the source of every experimental annotation on
      it. Full text cached and read in full. No retraction, erratum or expression of
      concern on the PubMed record. Reference projection check is negative: QuickGO
      returns eight annotations over exactly two entities, Q9NVV5 and Q96IZ2, so this is
      per-protein curation of the two proteins the paper characterises rather than a
      distribution across a set. One limitation, which is the basis of the two
      plasma-membrane verdicts: the paper contains no localisation experiment, so the
      GO:0005886 rows attributed to it are not supported by it.
- id: PMID:27040980
  title: Androgen-inducible gene 1 increases the ER Ca(2+) content and cell death susceptibility
    against oxidative stress.
  findings:
  - statement: >-
      A protease-protection assay placed AIG1 in the ER membrane with five transmembrane
      domains, a luminal N-terminus and a cytosolic C-terminus - a different compartment
      and a different topology from the UniProt record.
    supporting_text: Analyzing the topology of AIG1 in the ER membrane using a protease-protection
      assay suggested
  - statement: >-
      The functional readout is also ER-based, linking AIG1 overexpression to increased ER
      calcium content and oxidative-stress susceptibility.
    supporting_text: AIG1 over-expression slightly increased susceptibility to oxidative stress,
      which correlated with an increased ER Ca(2+) concentration in two different cell lines.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Directly relevant because it is the only study that examined where AIG1 is, and it
      contradicts the plasma-membrane call. Marked unverified rather than verified because
      full_text_available is false: the abstract does not state the species of the topology
      construct or the identity of the two cell lines, and the claim is unreplicated. Used
