- term:
    id: GO:0120573
    label: FAHFA hydrolase activity
  evidence_type: IMP
  original_reference_id: PMID:27018888
  qualifier: enables
  review:
    summary: >-
      The gene's core molecular function, established by mutating both catalytic
      residues in the human protein and by knocking the enzyme down in human cells.
      This is a measured activity on this protein, not a domain- or family-name
      inference.
    action: ACCEPT
    reason: >-
      The predicted defect class for a membrane hydrolase - a catalytic term inherited
      from a domain or family name while the residues are gone - is absent here, and the
      check was run rather than assumed. UniProt's feature table carries SITE 43 and
      SITE 134 'Important for catalytic activity', both ECO:0000269|PubMed:27018888, and
      both have MUTAGEN entries reading 'Loss of hydrolase activity'. The underlying
      experiments: of fifteen individual Ser/Thr-to-Ala mutants, only T43A abolished
      fluorophosphonate probe labelling; H134A did the same while two non-conserved His
      mutants had no effect; and both mutants lost FAHFA hydrolase activity outright.
      Substrate specificity was tested against a panel, with negligible activity on
      lyso- and phospholipids and on mono-, di- and tri-glycerides. Endogenous enzyme
      was then knocked down in human LNCaP cells with two shRNAs. Every system is human.
      Note also how thin the term is elsewhere: GO:0120573 has 495 annotations across
      all species and exactly two of them are experimental, this one and ADTRP's, both
      from this paper. The FlyBase assignment on a human annotation is unusual but not a
      defect - GO permits cross-database annotation and FlyBase curates the Drosophila
      family member.
    supported_by:
    - reference_id: PMID:27018888
      supporting_text: The FAHFA hydrolase activities of AIG1 and ADTRP were abolished by
        mutating their putative catalytic nucleophilic residues Thr-43 and Thr-47, respectively
    - reference_id: PMID:27018888
      supporting_text: Mutation of His134 to Ala in AIG1 (H134A) eliminated FP-labeling
    - reference_id: PMID:27018888
      supporting_text: Among the 15 individual Ser/Thr-to-Ala mutant proteins evaluated, only
        the T43A mutant showed a complete loss of FP-labeling
