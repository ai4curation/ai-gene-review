core_functions:
- description: >-
    Hydrolyses the internal ester bond of fatty acid esters of hydroxy fatty acids in a
    cellular membrane, releasing a free fatty acid and a hydroxy fatty acid and thereby
    terminating FAHFA signalling. Catalysis uses Thr43 as nucleophile and His134 as
    general base, both predicted to lie within transmembrane helices. AIG1 accounts for
    roughly 70 percent of PAHSA hydrolysis in human LNCaP cells and its inhibition
    blocks FAHFA hydrolysis in primary human T cells.
  molecular_function:
    id: GO:0120573
    label: FAHFA hydrolase activity
  directly_involved_in:
  - id: GO:0042758
    label: long-chain fatty acid catabolic process
  locations:
  - id: GO:0016020
    label: membrane
  substrates:
  - id: CHEBI:83670
    label: 9-PAHSA(1-)
  - id: CHEBI:83677
    label: 12-PAHSA(1-)
  - id: CHEBI:136282
    label: 9-[(9Z)-octadecenoyloxy]octadecanoate
  supported_by:
  - reference_id: PMID:27018888
    supporting_text: The FAHFA hydrolase activities of AIG1 and ADTRP were abolished by
      mutating their putative catalytic nucleophilic residues Thr-43 and Thr-47, respectively
  - reference_id: PMID:27018888
    supporting_text: These results, taken together, indicate that AIG1 functions as a major
      FAHFA hydrolase in human cells.
  - reference_id: PMID:32152231
    supporting_text: The levels of other lipid classes were unaltered indicating that AIG1
      and ADTRP specifically hydrolyze FAHFAs.
- description: >-
    Binds the RING-type E3 ubiquitin ligase RCHY1/Pirh2 and promotes Pirh2-dependent
    ubiquitination of p53. This is a non-core, catalysis-independent activity: it was
    found by yeast two-hybrid and characterised in murine cardiomyocytes, and no
    experiment has tested whether it requires the FAHFA hydrolase activity.
  molecular_function:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  directly_involved_in:
  - id: GO:0031398
    label: positive regulation of protein ubiquitination
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:40303337
    supporting_text: Co-IP results similarly indicated that endogenous AIG1 strongly interacted
      with Pirh2 in cardiomyocytes under steady-state conditions
  - reference_id: PMID:40303337
    supporting_text: Importantly, the deletion of the 35-93 aa domain of AIG1 resulted in
      significant reductions in Pirh2-p53 interaction and p53 ubiquitination
suggested_questions:
- question: >-
    GOA is shipping a superseded PAINT annotation for both members of PTHR10989's
    characterised clade. Node PTN001659973 carried GO:0016787 hydrolase activity dated
    20260528, but PANTHER replaced it with GO:0120573 FAHFA hydrolase activity on
    20260603; the current IBD.gaf gives the node only GO:0120573 and GO:0042758, and
    gene_association.paint_uniprot.gaf.gz already projects GO:0120573 by IBA onto both
    UniProtKB:Q9NVV5 (AIG1) and UniProtKB:Q96IZ2 (ADTRP). QuickGO nevertheless returns
    zero IBA annotations to GO:0120573 anywhere in GOA, and both genes still carry the
    GO:0016787 IBA. Is this simply an ingest lag, and if so when will the refresh land?
    Stated once for both genes: the merged ADTRP review reached KEEP_AS_NON_CORE on the
    byte-identical row from the pre-refresh data and should be revisited.
  experts:
  - GO Central / PAINT curators
  - GOA / UniProt-GOA pipeline
- question: >-
    UniProt evidence attribution for Q9NVV5. The SUBCELLULAR LOCATION line reads 'Cell
    membrane {ECO:0000269|PubMed:27018888}', but the cached full text of that paper
    contains no localisation experiment - zero occurrences of 'plasma membrane', 'cell
    surface', 'immunofluoresc', 'confocal', 'subcellular' or 'localization', against
    positive controls of 'membrane fraction' 3, 'membrane lysates' 9 and 'transmembrane'
    29 in the same file. What that paper supports is 'Multi-pass membrane protein'. Note
    the contrast with the paralogue: ADTRP's equivalent line cites PubMed:21868574 as
    well, which did image the protein at the cell surface, so ADTRP's compartment call
    has independent support and AIG1's does not. Should the ECO:0000269 compartment
    assertion be withdrawn on AIG1, or re-sourced?
  experts:
  - UniProt curators
- question: >-
    Where is AIG1 actually located, and what is its topology? UniProt gives six
    transmembrane helices with a cytoplasmic N-terminus, all from prediction
    (ECO:0000255, with the topological domains ECO:0000305 from a paper that ran no
    topology experiment). PMID:27040980 measured five transmembrane domains with a
    luminal N-terminus and a cytosolic C-terminus by protease protection, in the ER
    membrane, and reported an ER calcium phenotype. The two agree only on the cytosolic
    C-terminus. The compartment matters for interpretation: a plasma-membrane enzyme and
    an ER enzyme sample different FAHFA pools, and a cytosolic E3 ligase partner is
    accessible from either but only via the cytosolic face.
  experts:
  - Membrane protein topology
  - Lipid signalling
- question: >-
    Should the substrate-level process term GO:0042758 sit at PTN001659973, which PAINT
    scopes to taxon:2759 Eukaryota? The character conserved across that node is the
    Thr/His catalytic dyad, which licenses a claim about mechanism. Substrate has been
    established only for the two human members, and the node's non-animal recipients
    include fungal and plant proteins whose only reviewed representatives are curated as
    uncharacterised. The molecular function has just been refined at this node; the
    question is whether the process term should instead sit on the subclade where the
    seeds are.
  experts:
  - GO Central / PAINT curators
- question: >-
    Do AIG1's short splice isoforms retain any activity? Isoform 6 substitutes His134 and
    truncates at 135, and isoform 5 truncates at 138, so both lose the catalytic general
    base; isoform 3 deletes residues 48-99. No GOA annotation on this gene carries an
    isoform qualifier and no experiment has tested isoform-specific activity, so GO
    currently asserts the hydrolase function of a gene product whose annotated isoforms
    are not all capable of it.
  experts:
  - UniProt curators
  - Lipid signalling
suggested_experiments:
- hypothesis: >-
    AIG1 resides in the ER membrane rather than the plasma membrane, and the current
    plasma-membrane annotation is an over-read of a crude membrane fraction.
  description: >-
    Localise endogenous AIG1 in a cell line where it is abundant (LNCaP, or primary human
    T cells) by surface biotinylation with a membrane-impermeant reagent alongside
    immunofluorescence against ER, Golgi and plasma-membrane markers, and confirm by
    sucrose-gradient fractionation with compartment marker blots. Then repeat the in situ
    13C,2H-PAHSA hydrolysis assay on surface-stripped versus permeabilised cells to ask
    where the activity is executed, not merely where the protein sits. A negative surface
    result would settle two GOA rows and a UniProt line at once.
  experiment_type: localisation and topology
- hypothesis: >-
    The AIG1-Pirh2 interaction is independent of the FAHFA hydrolase activity, so the two
    functions are separable.
  description: >-
    Co-immunoprecipitate Pirh2 with wild-type AIG1 and with the T43A and H134A catalytic
    mutants, and measure p53 ubiquitination in each case; in parallel, test whether a
    covalent AIG1 inhibitor that occupies the active site (KC01 or JJH260) alters Pirh2
    binding. If catalytically dead AIG1 still binds Pirh2 and still supports p53
    ubiquitination, the two functions are genuinely separable and should be curated as
    such. Use a point-substitution or small-epitope strategy rather than the 35-93
    deletion, which removes a whole transmembrane helix.
  experiment_type: structure-function separation
- hypothesis: >-
    AIG1 alone controls tissue FAHFA levels in vivo, which the published double-knockout
    design leaves untested.
  description: >-
    Measure the full FAHFA isomer panel by LC-MS in tissues of Aig1 single-knockout mice,
    with Adtrp single-knockout and double-knockout littermates as the comparison set. The
    published in vivo study reports elevated FAHFAs for Adtrp-KO and for the double
    knockout but not for the Aig1 single knockout, so what is missing is a design in
    which AIG1 rather than ADTRP is the dominant hydrolase in the tissue assayed. Pick
    those tissues by measuring rather than by citation: the candidate profiles disagree
    (PMID:27018888 cites biogps for brain and macrophages, PMID:11266118's Northern blot
    gives heart, ovary, testis, liver and kidney), so quantify AIG1 and ADTRP activity
    side by side across a mouse tissue panel by competitive ABPP first, then run the
    lipidomics where the ratio is most favourable.
  experiment_type: genetic loss of function with lipidomics
- hypothesis: >-
    The short AIG1 isoforms that lack His134 are catalytically dead and may act as
    dominant negatives.
  description: >-
    Express isoforms 1, 3, 5 and 6 individually in HEK293T cells and assay each for
    fluorophosphonate probe reactivity and 9-PAHSA hydrolysis, then co-express each short
    isoform with the full-length enzyme and ask whether hydrolysis is suppressed below
    the full-length-alone level. Human dermal papilla and liver, where the alternative
    transcripts were originally detected, would be the tissues in which the result
    matters.
  experiment_type: isoform structure-function
knowledge_gaps:
- gap_statement: >-
    Where AIG1 executes its hydrolase activity is unresolved, and the two available
    answers are incompatible: GOA and UniProt say plasma membrane, while the only study
    that examined the question places the protein in the ER membrane with a different
    topology.
  boundary: >-
    Known: AIG1 is a polytopic membrane protein, and its activity partitions to the
    membrane fraction of human cells, so GO:0016020 membrane is secure. Unknown: which
    membrane. The plasma-membrane annotation is attributed to a paper containing no
    localisation experiment, and the ER assignment rests on one unreplicated
    protease-protection study whose full text is unavailable.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    The compartment determines which FAHFA pool the enzyme can reach and whether a
    cytosolic E3 ligase partner is accessible, and it is the difference between a
    cell-surface drug target and an intracellular one. Two GOA rows and a UniProt
    ECO:0000269 statement currently assert an answer that their cited evidence does not
    contain.
  provenance:
  - reference_id: PMID:27018888
    supporting_text: Both KC01 and JJH260, but not THL or ABC34 also inhibited the FAHFA
      hydrolase activity of LNCaP cell lysates, which was mostly found in the membrane fraction
  - reference_id: PMID:27040980
    supporting_text: Analyzing the topology of AIG1 in the ER membrane using a protease-protection
      assay suggested
- gap_statement: >-
    GO can express FAHFA hydrolysis as a molecular function but not as a biological
    process, so FAHFA catabolism has to be annotated with the much broader GO:0042758
    long-chain fatty acid catabolic process.
  boundary: >-
    Known and expressible: GO:0120573 FAHFA hydrolase activity exists, created 2026-03-14
    and anchored on twelve RHEA reactions. Absent: any process term at the FAHFA level. A
    QuickGO text search for FAHFA returns GO:0120573 and nothing else, and walking the
    ontology rather than only searching it gives the same answer - GO:1901569 fatty acid
    derivative catabolic process has five children (fatty acid primary amide, ketone
    body, icosanoid, fatty-acyl-CoA and fatty alcohol catabolic processes) and none
    covers FAHFAs.
  gap_kind:
  - ONTOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    GO:0042758 is chemically correct here, because ChEBI classifies 9-PAHSA(1-) as a
    long-chain fatty acid anion, but it is far broader than the demonstrated specificity
    and it is the term PAINT propagates from a pan-eukaryotic node. GO already models the
    thioester analogue as GO:0036115 fatty-acyl-CoA catabolic process, so the precedent
    exists. The merged ADTRP review files the corresponding proposed_new_terms entry
    ('fatty acid ester of hydroxy fatty acid catabolic process', parent GO:0042758); this
    review concurs and records the gap rather than duplicating the request.
  provenance:
  - reference_id: PMID:32152231
    supporting_text: The levels of other lipid classes were unaltered indicating that AIG1
      and ADTRP specifically hydrolyze FAHFAs.
- gap_statement: >-
    Whether AIG1 alone sets endogenous FAHFA tone in vivo is untested; the published
    genetic evidence comes from Adtrp single knockouts and AIG1/ADTRP double knockouts.
  boundary: >-
    Known: in human cells AIG1 accounts for roughly 70 percent of PAHSA hydrolysis, and
    loss of both enzymes raises tissue FAHFAs in mice without altering other lipid
    classes. Unknown: the contribution of AIG1 on its own in any tissue, which matters
    because the two enzymes are reported to have distinct expression profiles. That
    reported difference is itself unsettled and should not be treated as established:
    PMID:27018888's discussion cites biogps for AIG1 being broadest in brain and
    macrophages with ADTRP restricted to metabolic organs, whereas the Northern blot in
    PMID:11266118 puts human AIG1 highest in heart, ovary, testis, liver and kidney, and
    Human Protein Atlas records AIG1 as tissue-enhanced in liver.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Every in vivo statement about AIG1's physiological role currently inherits its
    support from an experiment in which the paralogue was also deleted. A tissue-matched
    single-knockout series would separate them.
  provenance:
  - reference_id: PMID:32152231
    supporting_text: Tissues from mice lacking ADTRP (Adtrp-KO), or both AIG1 and ADTRP (DKO)
      had higher concentrations of FAHFAs
- gap_statement: >-
    Whether AIG1's Pirh2/p53 function requires its hydrolase activity is unknown, so the
    gene has two functional descriptions with no established relation between them.
  boundary: >-
    Known: AIG1 binds Pirh2 and promotes Pirh2-dependent p53 ubiquitination in murine
    cardiomyocytes; separately, it hydrolyses FAHFAs through Thr43 and His134. Unknown:
    whether the catalytically dead T43A or H134A protein still binds Pirh2 and still
    supports p53 ubiquitination. The mapped requirement, residues 35-93, includes Thr43
    and a whole transmembrane helix, so the existing data cannot separate the two.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This review proposes both a hydrolase core function and a separate ubiquitin-ligase
    binding function. If the second turns out to require the first, they are one function
    and not two, and the core_functions split here would be wrong.
  provenance:
  - reference_id: PMID:40303337
    supporting_text: The results showed that Pirh2 interacted with full-length AIG1 and the
      AIG1 Δ161-175 aa mutant, but not with the AIG1 Δ35-93 aa mutant when co-expressed in
      HEK293T cells
  - reference_id: PMID:27018888
    supporting_text: The FAHFA hydrolase activities of AIG1 and ADTRP were abolished by
      mutating their putative catalytic nucleophilic residues Thr-43 and Thr-47, respectively
