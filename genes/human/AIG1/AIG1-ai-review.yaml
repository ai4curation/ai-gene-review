- term:
    id: GO:0042758
    label: long-chain fatty acid catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001659973
  - UniProtKB:Q96IZ2
  - UniProtKB:Q9NVV5
  review:
    summary: >-
      Correct for this gene, which holds the identical term by its own IMP from the
      same paper, and the substrate chemistry was verified rather than assumed. Unlike
      the molecular-function row from the same node, this term is still current in
      PANTHER's IBD.gaf.
    action: ACCEPT
    reason: >-
      The suspicion worth testing was a direction error: AIG1 releases free long-chain
      fatty acids rather than degrading one, so 'long-chain fatty acid catabolic
      process' could have been an inversion of the kind GO:2000738 produces. It is not.
      ChEBI classifies the substrate CHEBI:83670 9-PAHSA(1-) as a long-chain fatty acid
      anion - its hierarchical ancestors include 'fatty acid anion', 'long-chain fatty
      acid anion' and 'lipid' - so the FAHFA is itself a long-chain fatty acid and
      hydrolysing it is literally its breakdown. Every one of UniProt's twelve catalytic
      activity lines for this protein gives PhysiologicalDirection=left-to-right, i.e.
      the curated direction is hydrolysis. Node status was checked independently of the
      molecular-function row and differs from it: GO:0042758 is still present at
      PTN001659973 in the current IBD.gaf, dated 20251127, so this row is not stale. The
      node reaches well beyond the two characterised seeds, which is a legitimate
      upstream question about a substrate-level claim propagated on dyad conservation,
      and is recorded in suggested_questions rather than as a defect in this gene's row.
      Verdict matches the merged ADTRP review on the byte-identical row.
    supported_by:
    - reference_id: PMID:27018888
      supporting_text: These results, taken together, indicate that AIG1 functions as a major
        FAHFA hydrolase in human cells.
    - reference_id: PMID:32152231
      supporting_text: The levels of other lipid classes were unaltered indicating that AIG1
        and ADTRP specifically hydrolyze FAHFAs.
