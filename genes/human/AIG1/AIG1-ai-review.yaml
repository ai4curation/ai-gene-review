id: Q9NVV5
gene_symbol: AIG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AIG1 is a polytopic integral membrane threonine hydrolase that degrades fatty acid
  esters of hydroxy fatty acids (FAHFAs), a class of endogenous bioactive lipids in
  which a fatty acid is esterified to a hydroxyl group on a second fatty-acid
  backbone. It hydrolyses the internal ester bond to release a free fatty acid and a
  hydroxy fatty acid, preferring isomers whose branch point lies distal from the
  carboxylate head group, and it does not act on the common phospholipid or neutral
  lipid classes. Catalysis uses an unusual Thr/His dyad rather than a serine
  hydrolase fold: Thr43 is the nucleophile and His134 the general base, and both
  residues are predicted to sit within transmembrane helices, so the chemistry is
  thought to occur inside the bilayer where the FAHFA ester bond is buried. AIG1
  accounts for the majority of FAHFA hydrolysis in human prostate carcinoma cells and
  primary T cells, and together with its only paralogue ADTRP it constitutes the
  FAHFA-hydrolase arm of bioactive lipid turnover in mammals. Because FAHFAs are
  insulin-sensitising, degrading them is metabolically consequential: in mouse
  adipocytes AIG1 acts downstream of IRF3 to blunt insulin signalling in a manner
  requiring its catalytic residues. Independently of catalysis, AIG1 binds the RING
  E3 ubiquitin ligase RCHY1/Pirh2 and promotes Pirh2-dependent ubiquitination of p53.
  The gene symbol records its discovery as a dihydrotestosterone-inducible transcript
  in hair-follicle dermal papilla cells and says nothing about this activity.
