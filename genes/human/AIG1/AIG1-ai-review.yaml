    action: MODIFY
    reason: >-
      Partner resolution: UniProtKB:Q96PM5 is reviewed Swiss-Prot ZN363_HUMAN, 261 aa,
      'RING finger and CHY zinc finger domain-containing protein 1', EC 2.3.2.27 - the
      canonical entry at canonical length, not a TrEMBL ORFeome fragment. Because the
      partner is itself a ubiquitin-protein ligase, GO:0031625 'Binding to a ubiquitin
      protein ligase enzyme, any of the E3 proteins' is entailed by the interaction
      rather than inferred from a downstream model. Evidence strength was checked by
      expanding IntAct rather than trusting UniProt's NbExp=4, because a single screen
      can be logged as several sub-methods: the four IntAct records for this pair
      (experiment EBI-3895963, PMID:21988832) are four different assay types - '2
      hybrid', 'pull down', 'anti tag coip' and 'confocal microscopy' - so the count
      survives expansion. For contrast, 141 of AIG1's 161 IntAct interactions come from
      one publication logged as 'two hybrid array' + 'two hybrid prey pooling approach'
      + 'validated two hybrid' (47 each), and none of those reached GOA. Independent
      corroboration comes from a 2025 study that co-immunoprecipitated endogenous AIG1
      and Pirh2 from cardiomyocytes and confirmed it by proximity ligation. Two
      provenance caveats are recorded rather than glossed. First, the two yeast
      two-hybrid papers (PMID:21988832 and PMID:21622095) share an author and are both
      Fudan University work, so they are not two independent screens; PMID:40303337 is
      a different department 14 years later. Second, PMID:40303337 maps the interaction
      to AIG1 residues 35-93 by deletion, a span that removes TOPO_DOM 31..44, the
      whole of TRANSMEM 45..67 and TOPO_DOM 68..87, so it cannot distinguish a contact
      surface from loss of folding or membrane insertion; no binding-site claim is made
      here.
