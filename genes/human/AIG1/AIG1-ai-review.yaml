- id: PMID:11266118
  title: Cloning of androgen-inducible gene 1 (AIG1) from human dermal papilla cells.
  findings:
  - statement: >-
      AIG1 was cloned as a dihydrotestosterone-inducible transcript from human dermal
      papilla cells, which is the origin of the gene symbol. The paper reports
      expression and induction only.
    supporting_text: We isolated a novel cDNA clone, designated as AIG1 (Androgen-inducible
      Gene 1), whose expression was found to be inducible by androgen.
  - statement: >-
      The authors state that the function was not determined, which is why no GO
      biological process should rest on the androgen-induction observation.
    supporting_text: Further study will be needed to understand the functions of AIG1 in
      the androgen-regulated hair cycle.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited as the origin of the gene name, not as evidence of function. Induction by a
      hormone is an expression observation and is neither a molecular function nor a
      biological process; GOA correctly carries no annotation from this paper.
- id: PMID:21622095
  title: AIG1 is a novel Pirh2-interacting protein that activates the NFAT signaling
    pathway.
  findings:
  - statement: >-
      A yeast two-hybrid screen identified AIG1 as a Pirh2-interacting protein. The
      remainder of the paper is an expression-biomarker study in hepatocellular
      carcinoma.
    supporting_text: Here, we identified a novel Pirh2-interacting protein, AIG1, by yeast
      two-hybrid screening
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Two reservations, so nothing in this review rests on it. First, the abstract is
      internally inconsistent: it reads 'identified a novel Pirh2-interacting protein,
      AIG1, by yeast two-hybrid screening and confirmed its interaction with p53 both in
      vitro and in vivo', which literally attributes the confirmation to an AIG1-p53
      interaction rather than to AIG1-Pirh2; the full text is not cached. Second, it
      shares an author with PMID:21988832 and is from the same institution, so the two
      yeast two-hybrid reports are not independent screens. Its HCC survival analysis is
      a biomarker correlation and is not treated as evidence of function.
- id: PMID:21988832
  title: Toward an understanding of the protein interaction network of the human liver.
  findings:
  - statement: >-
      Source of the single GO:0005515 row. IntAct records four distinct assay types for
      the AIG1-RCHY1 pair from this study - two hybrid, pull down, anti tag coip and
