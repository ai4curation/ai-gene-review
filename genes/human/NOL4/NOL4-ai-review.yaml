core_functions:
- description: >-
    Nuclear protein distributed between the nucleolus and nucleoplasm, with
    separable basic segments that target it to the nucleolus and to the nucleus.
    No molecular activity has been established for human NOL4; it is therefore
    represented by location only.
  locations:
  - id: GO:0005730
    label: nucleolus
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:9813152
    supporting_text: These results suggest that this novel nucleolar protein has
      at least two distinct domains for directing to different subnuclear destinations.
  - reference_id: PMID:28125049
    supporting_text: In humans, NOL4 is expressed specifically in the fetal and adult
      brain and testis, and locates to the nucleoli in cultured cells [50], but their
      molecular functions remained uncharacterized.
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of NOL4 is undetermined: whether the conserved
      HTH_NOL4 region binds DNA or RNA, and whether human NOL4 acts as a
      transcriptional coregulator of Mblk-1 family factors (LCOR/LCORL) as its
      mouse ortholog does in reporter assays, has not been tested.
    boundary: >-
      Established are nucleolar/nucleoplasmic localization, brain/testis-restricted
      expression and, for mouse NOL4, binding to Mlr1/Mlr2 with modulation of their
      reporter activity in heterologous cells.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
suggested_questions:
- question: >-
    Does human NOL4 bind LCOR/LCORL (the human Mblk-1 family homologs) and modulate
    their transcriptional activity, as reported for mouse NOL4 with Mlr1/Mlr2?
- question: >-
    Is the "RNA binding" annotation from ProtInc (TAS, PMID:9813152) backed by any
    experiment in the full text, or is it an inference from nucleolar localization?
suggested_experiments:
- hypothesis: >-
    The conserved HTH_NOL4 region of NOL4 binds nucleic acid directly.
  description: >-
    Test nucleic-acid binding of the purified HTH_NOL4 region (EMSA against DNA and
    RNA probes; CLIP or RNA interactome capture in a NOL4-expressing neuroendocrine
    cell line) to determine whether NOL4 has a direct binding activity.
- hypothesis: >-
    Human NOL4 is a transcriptional coregulator of LCOR/LCORL, as its mouse ortholog
    is for Mlr1/Mlr2.
  description: >-
    Co-immunoprecipitation of endogenous NOL4 with LCOR/LCORL and CtBP1/2 in human
    neuronal or SCLC cells, combined with NOL4 knockout and RNA-seq/ChIP-seq of
    LCOR/LCORL targets.
