- id: PMID:25366156
  title: Splicing variants of NOL4 differentially regulate the transcription activity
    of Mlr1 and Mlr2 in cultured cells.
  findings:
  - statement: Mouse NOL4 splice variants interact with the Mblk-1 family transcription
      factors Mlr1 and Mlr2 and modulate their transactivation in reporter assays
      (Drosophila S2 cells). Mouse, not human; overexpression in a heterologous system.
    supporting_text: transactivation activity of Mlr1 was significantly suppressed
      by both NOL4-S and NOL4-SΔ, with almost complete suppression by NOL4-SΔ
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Only functional study of any NOL4 family member; performed on mouse
      Nol4 (P60954, same PANTHER subfamily SF17, 93.6% identity). Abstract only in
      cache. Used for context and suggested experiments, not for a NEW annotation;
      MGI annotates mouse Nol4 only with ND for MF and BP.
- id: PMID:28125049
  title: 'Mblk-1 Transcription Factor Family: Its Roles in Various Animals and Regulation
    by NOL4 Splice Variants in Mammals.'
  findings:
  - statement: Review summarizing that the molecular functions of NOL4 remain uncharacterized
      and that mouse NOL4 variants differentially regulate Mlr1/Mlr2.
    supporting_text: In humans, NOL4 is expressed specifically in the fetal and adult
      brain and testis, and locates to the nucleoli in cultured cells [50], but their
      molecular functions remained uncharacterized.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review by the same group as PMID:25366156; full text cached.
