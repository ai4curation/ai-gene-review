- term:
    id: GO:0005730
    label: nucleolus
  evidence_type: TAS
  original_reference_id: PMID:9813152
  qualifier: located_in
  review:
    summary: >-
      The cloning paper identified NOL4 as a nucleolar protein in a nuclear
      transportation trap screen and mapped a 30-residue segment sufficient for
      nucleolar targeting using fluorescent-tagged deletion constructs
      transiently expressed in COS-7 cells.
    action: ACCEPT
    reason: >-
      Although coded TAS, the source paper contains direct localization
      experiments. Note that these used overexpressed tagged constructs of a
      truncated original cDNA clone (UniProt flags BAA34576 as truncated and
      frameshifted), so residue numbers refer to that clone; endogenous protein
      is additionally seen in the nucleoplasm (HPA), indicating a
      nucleolar/nucleoplasmic distribution.
    supported_by:
    - reference_id: PMID:9813152
      supporting_text: This study reports cDNA isolation and partial characterization
        of a novel human nucleolar protein isolated by "nuclear transportation trap"
        described previously.
    - reference_id: PMID:9813152
      supporting_text: These results suggest that this novel nucleolar protein has
        at least two distinct domains for directing to different subnuclear destinations.
