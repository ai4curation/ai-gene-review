existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: TAS
  original_reference_id: PMID:9813152
  qualifier: enables
  review:
    summary: >-
      Traceable author statement (ProtInc) that NOL4 binds RNA, attributed to the
      original cloning paper. The cached abstract describes the domain content
      (a short region resembling an E. coli DNA helicase, acidic, basic NLS,
      serine-rich and coiled-coil regions) and states that the protein has no
      prominent similarity to other proteins; it reports no RNA-binding assay.
      No RNA-binding domain is annotated in the UniProt record (InterPro/Pfam
      only identify the NOL4/NOL4L family and HTH_NOL4 domains), and no RNA
      binding has been shown for NOL4 or its mouse ortholog in the literature
      I could find.
    action: UNDECIDED
    reason: >-
      The claim appears to be an inference from nucleolar localization rather
      than a demonstrated activity, but the full text of PMID:9813152 is not
      available, so I cannot rule out that the authors make a supported
      statement. Without accessible evidence, UNDECIDED rather than REMOVE. The
      HTH_NOL4 region, if anything, suggests a nucleic-acid (possibly DNA)
      binding fold, which also has not been tested.
    supported_by:
    - reference_id: PMID:9813152
      supporting_text: The cDNA encodes a putative polypeptide of 524 amino acids
        with a short Escherichia coli DNA helicase homologous region, an acid-rich
        domain, three potential base-rich nuclear localization signals (NLSs), a
        serine-rich domain, and a deduced coiled-coil domain. The protein has no
        known prominent similarities with any other protein in the protein databases.
- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      Human Protein Atlas immunofluorescence localizes NOL4 to the nucleoplasm.
      This is consistent with the nuclear-targeting segment (aa 372-401 of the
      original clone) that is sufficient for nuclear but not nucleolar
      localization, and with the nuclear immunostaining of NOL4 in small cell
      lung cancer and neuroendocrine tumour tissue.
    action: ACCEPT
    reason: >-
      Direct experimental localization, independently corroborated by deletion
      mapping and tissue immunohistochemistry. NOL4 appears to partition between
      nucleolus and nucleoplasm; both are retained as core locations.
    supported_by:
    - reference_id: PMID:9813152
      supporting_text: the adjacent region of 30 amino acids (position 372-401),
        which contains the third NLS, is sufficient for nuclear localization
    - reference_id: PMID:34065612
      supporting_text: brown nucleus staining of NOL4 is visible in tumor cells
    - reference_id: PMID:36282054
      supporting_text: NOL4 retains its nuclear immunoreactivity in areas of crush
        artifact or necrosis
