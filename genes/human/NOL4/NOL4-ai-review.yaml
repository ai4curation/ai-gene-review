gene_symbol: NOL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NOL4 (nucleolar protein 4, NOLP) is a 638-residue nuclear protein of the
  vertebrate NOL4/NOL4L family (PANTHER PTHR12449:SF17), defined by an
  N-terminal helix-turn-helix (HTH_NOL4) region followed by long acidic,
  serine-rich and basic disordered segments and a C-terminal coiled-coil
  region; it is produced as four splice isoforms. Its only experimentally
  established property in human is subcellular location: deletion mapping of
  fluorescent fusions showed that a basic 30-residue segment is sufficient for
  nucleolar targeting and an adjacent segment for nuclear targeting, and the
  endogenous protein is detected in the nucleoplasm and nuclei of tumour cells.
  Expression is largely restricted to brain and testis, and NOL4 is a
  cancer/testis antigen that marks small cell lung cancer and other
  neuroendocrine neoplasms; its promoter is frequently hypermethylated in head
  and neck and thyroid carcinomas. No molecular activity has been demonstrated
  for human NOL4. Its 1:1 mouse ortholog binds Mblk-1 family transcription
  factors (Mlr1/Mlr2) and splice variants modulate their transactivation in
  reporter assays, suggesting a role as a transcriptional coregulator that has
  not been tested for the human protein.
