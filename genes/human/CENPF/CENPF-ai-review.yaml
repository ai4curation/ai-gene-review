- term:
    id: GO:0070840
    label: dynein complex binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000429985
  - UniProtKB:P49454
  review:
    summary: PAINT IBA for dynein complex binding.
    action: UNDECIDED
    reason: 'CENP-F clearly associates with dynein complexes, but the best-characterized mechanism is
      indirect: CENP-F recruits NDE1/NDEL1, which bind dynein and LIS1. A direct CENP-F-dynein contact
      has not been demonstrated in the literature reviewed, and the human experimental source for this
      node (PMID:12974617) is abstract-only and reports dynein-dependent transport of CENP-F rather than
      binding. Separation-of-function work shows that CENP-F acts on kinetochore dynein through a direct
      interaction with NDE1 (a dynein ''brake''/tether), and CENP-F is not required for bulk kinetochore
      dynein-dynactin recruitment. The adaptor MF (GO:0030674) is a better description; retain the IBA
      pending evidence of direct binding.'
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000429985
        source_status: UNRESOLVED
        comment: Human CENPF IDA (PMID:12974617, abstract-only) reports dynein-mediated transport of CENPF;
          direct dynein binding versus NudE-mediated association unresolved.
    supported_by:
