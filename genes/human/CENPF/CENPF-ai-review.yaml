suggested_questions:
- question: Does CENP-F bind any cytoplasmic dynein subunit directly, or is all CENP-F-dynein association
    mediated by NDE1/NDEL1? The answer determines whether GO:0070840 dynein complex binding (IDA/IBA)
    should be retained or replaced by protein-macromolecule adaptor activity.
  experts:
  - kinetochore/dynein biochemists
  - PAINT curators for PTHR18874
- question: Is the G2/M regulatory role of CENP-F (from overexpression of truncation fragments) supported
    by any loss-of-function data outside the neural progenitor INM context?
  experts:
  - cell-cycle biologists
- question: What is the mechanistic basis of the ciliary phenotypes in CENPF deficiency (Stromme syndrome)
    - a direct role at subdistal appendages/axoneme with IFT88, or a consequence of mitotic/INM defects?
  experts:
  - cilia biologists
  - clinical geneticists
suggested_experiments:
- description: Reconstitute NUP133 N-terminal domain, CENP-F C-terminal fragment, NDE1/NDEL1, LIS1 and
    dynein-dynactin with purified proteins and test whether CENP-F binds dynein in the absence of NudE
    proteins.
  hypothesis: CENP-F associates with dynein only through NDE1/NDEL1.
  experiment_type: in vitro reconstitution / pull-down
- description: Replace endogenous CENP-F in radial glial progenitors with NUP133-binding-defective (Berto
    et al. interface) or NudE-binding-defective mutants and image apical INM.
  hypothesis: Both NUP133 and NDE1/NDEL1 binding are required for CENP-F's role in apical nuclear migration.
  experiment_type: in utero electroporation rescue with live imaging
