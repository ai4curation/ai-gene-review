core_functions:
- description: 'Kinetochore-microtubule coupler: at the outer kinetochore (corona) CENP-F binds microtubules
    through N- and C-terminal domains, tracks and harnesses force from depolymerizing microtubule ends,
    and contributes to attachment stability and force transduction (congression defects of CENP-F mutants
    depend mainly on its NDE1-binding region rather than on the microtubule-binding domains).'
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0051315
    label: attachment of mitotic spindle microtubules to kinetochore
  - id: GO:0051310
    label: metaphase chromosome alignment
  locations:
  - id: GO:0000776
    label: kinetochore
  supported_by:
  - *id024
  - *id023
  - *id012
  - *id001
  - *id004
  - reference_id: PMID:32207772
    supporting_text: We show that the two microtubule-binding domains make distinct contributions to attachment
      stability and force transduction but are dispensable for chromosome congression.
- description: 'Adaptor linking the NudE/NudEL-LIS1-dynein module to cellular platforms: bound to NUP133
    at nuclear pores in G2/prophase (centrosome-nucleus tethering; apical interkinetic nuclear migration)
    and to BUB1/CENP-E at kinetochores in mitosis, CENP-F recruits NDE1 and NDEL1, which in turn bind
    dynein and LIS1. Dynein recruitment by CENP-F is indirect; at kinetochores the CENP-F-NDE1 link mainly
    loads LIS1 and restrains dynein-mediated stripping of corona cargoes, while bulk kinetochore dynein
    recruitment is largely CENP-F-independent.'
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
