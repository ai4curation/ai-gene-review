gene_symbol: CENPF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Centromere protein F (CENP-F, mitosin) is a very large (~3100 aa) coiled-coil protein that
  is farnesylated at its C-terminal CAAX motif and whose abundance is cell-cycle regulated: it accumulates
  in the nucleus (nuclear matrix) during S and G2, and is degraded after mitosis. In late G2/prophase
  CENP-F is recruited to nuclear pore complexes by direct binding of its C-terminal leucine-zipper region
  to the NUP133 beta-propeller, where it acts as an adaptor that recruits the NudE-family proteins NDE1
  and NDEL1, and through them LIS1 and cytoplasmic dynein-dynactin, to the nuclear envelope. This NUP133-CENP-F-NDE1/NDEL1
  chain keeps centrosomes tethered to the nucleus at mitotic entry and, in radial glial progenitors of
  the developing cortex, drives the dynein-dependent apical (G2) phase of interkinetic nuclear migration.
  After nuclear envelope breakdown CENP-F becomes a component of the outer kinetochore (fibrous corona),
  recruited via BUB1 and CENP-E, where its two terminal microtubule-binding domains couple kinetochores
  to dynamic, including depolymerizing, microtubule ends, and where it again recruits NDE1/NDEL1-LIS1-dynein;
  it contributes to stable kinetochore-microtubule attachment, chromosome congression and accurate segregation,
  and through a direct interaction with NDE1 it limits dynein-mediated stripping of corona proteins. CENP-F
  is also found at spindle poles (by dynein-mediated poleward transport), the spindle midzone and midbody,
  and at cytokinesis it is recruited by the Miro GTPases to mitochondria to promote their microtubule-based
  redistribution into daughter cells. In ciliated cells it localizes to the mother-centriole subdistal
  appendages, basal body and axoneme. Biallelic truncating CENPF variants cause Stromme syndrome, a ciliopathy-like
  disorder with intestinal atresia, ocular anomalies, microcephaly and renal defects. CENP-F has additionally
  been reported to bind RB-family proteins and to repress ATF4 transactivation.'
