- term:
    id: GO:0047497
    label: mitochondrion transport along microtubule
  evidence_type: IMP
  original_reference_id: PMID:26259702
  qualifier: involved_in
  review:
    summary: At cytokinesis Miro recruits Cenp-F to mitochondria, where Cenp-F associates with growing
      microtubule tips and promotes anterograde mitochondrial movement toward the daughter-cell periphery.
    action: NEW
    reason: CENP-F is the microtubule-tip-associated linker in the Miro-CENP-F complex that couples mitochondria
      to growing microtubules (a structural contribution, like the Miro/RHOT proteins that carry this
      term). Loss of CENP-F or a Miro-binding-deficient CENP-F point mutant reduces mitochondrial spreading
      in cultured human cells; mice carrying the Miro-binding mutation develop normally, so this is a
      non-core, cell-cycle-restricted role with organismal redundancy.
    supported_by:
    - reference_id: PMID:26259702
      supporting_text: Thus, Miro and Cenp-F promote anterograde mitochondrial movement and proper mitochondrial
        distribution in daughter cells.
    - reference_id: PMID:26259702
      supporting_text: Cenp-F is recruited to mitochondria by Miro at the time of cytokinesis and associates
        with microtubule growing tips.
    - reference_id: PMID:30856164
      supporting_text: We observe that, despite the phenotypes apparent in cultured cells, mutant mice
        develop normally.
