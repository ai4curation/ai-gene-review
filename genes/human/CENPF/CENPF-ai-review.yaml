      supporting_text: Recent studies have demonstrated a role for CENP-F in indirectly recruiting dynein/dynactin
        to kinetochores via NudE and/or NudEL
    - &id021
      reference_id: PMID:24034252
      supporting_text: CENP-F, in turn, recruits NudE and NudEL, each of which bind directly to cytoplasmic
        dynein and its regulator LIS1
    - *id017
