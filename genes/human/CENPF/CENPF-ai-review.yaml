  original_reference_id: PMID:16252009
  qualifier: involved_in
  review:
    summary: CENP-F binds microtubules directly through two terminal domains, couples kinetochores to
      depolymerizing microtubule ends, and is required for stable kinetochore-microtubule attachment.
    action: NEW
    reason: 'CENP-F does part of the work: its microtubule-binding domains form load-bearing attachments
      to dynamic microtubule ends at the kinetochore corona. Depletion reduces cold-stable K-fibres and
      inter-kinetochore tension. The existing annotations capture the downstream alignment/segregation
      outcomes but not the attachment step itself.'
    supported_by:
