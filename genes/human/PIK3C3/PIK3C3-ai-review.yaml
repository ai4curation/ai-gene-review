    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-109699
  review:
    summary: Cytosol is a broad Reactome component assignment for PIK3C3 pathway events.
    action: KEEP_AS_NON_CORE
    reason: PIK3C3 complexes are cytosolic/peripheral membrane assemblies recruited to autophagy
      and endosomal membranes; the cytosol rows are retained as non-core pathway context rather
      than precise localization.
    proposed_replacement_terms:
    - id: GO:0000407
      label: phagophore assembly site
