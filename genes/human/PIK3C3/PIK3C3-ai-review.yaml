  review:
    summary: VPS34 functions on autophagy and endosomal membranes through class III PI3K
      complexes.
    action: ACCEPT
    reason: PIK3C3 generates PI3P for both ATG14-containing PI3KC3-C1 and UVRAG-containing
      PI3KC3-C2. Endosomal sorting is a conserved direct function of this catalytic subunit, and
      membrane/cytoplasmic locations remain valid at broader resolution. A project focus on
      autophagy is not a biological reason to demote the endosomal machinery or to call membrane
      association an over-annotation.
