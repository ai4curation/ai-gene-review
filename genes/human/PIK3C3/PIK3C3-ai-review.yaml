      supporting_text: '**PI3KC3 Complex I (PI3KC3-C1)**: VPS34 (**PIK3C3**) + **VPS15 (PIK3R4)**
        + **BECN1** + **ATG14**. This complex is classically associated with **autophagy initiation/autophagosome
        nucleation**.'
    - reference_id: file:human/PIK3C3/PIK3C3-deep-research-falcon.md
      supporting_text: '**PI3KC3 Complex II (PI3KC3-C2)**: VPS34 (**PIK3C3**) + **VPS15 (PIK3R4)**
        + **BECN1** + **UVRAG**, classically associated with **endocytic sorting/endosome maturation**
        and related trafficking.'
