      PI3KC3-C1/type I complex and the contextual endosomal PI3KC3-C2/type II complex.
    proposed_replacement_terms:
    - id: GO:0034271
      label: phosphatidylinositol 3-kinase complex, class III, type I
    - id: GO:0034272
      label: phosphatidylinositol 3-kinase complex, class III, type II
    supported_by:
    - reference_id: PMID:40442316
      supporting_text: PI3KC3-C1 contains one copy each of the lipid kinase VPS34, the
        pseudokinase VPS15 and the regulatory subunits BECN1 and ATG14
    - reference_id: PMID:40442316
      supporting_text: The former three subunits are also present in PI3KC3-C2 involved in
        endosomal sorting and late steps in autophagy, while ATG14 is uniquely involved in
        autophagy initiation5–7.
  qualifier: part_of
- term:
    id: GO:0042149
    label: cellular response to glucose starvation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: Glucose starvation response is a contextual autophagy input, not the core PIK3C3
      function.
    action: KEEP_AS_NON_CORE
    reason: Starvation-dependent autophagy is a supported context for VPS34 action, but the
      direct conserved role is PI3P production in autophagy and endosomal pathways.
    proposed_replacement_terms:
    - id: GO:0016236
      label: macroautophagy
    supported_by:
    - reference_id: PMID:25327288
      supporting_text: PIK-III acutely inhibits autophagy and de novo lipidation of LC3, and
        leads to the stabilization of autophagy substrates.
    - reference_id: file:human/PIK3C3/PIK3C3-deep-research-falcon.md
      supporting_text: VPS34-generated PI3P promotes recruitment of WIPI/ATG machinery to
        phagophore membranes, supporting autophagosome initiation and early biogenesis.
  qualifier: involved_in
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23878393
  review:
    summary: The interaction evidence does not make generic protein binding a useful
      molecular-function annotation.
    action: REMOVE
    reason: PIK3C3 interactions inform complex assembly and regulation, but protein binding does
      not identify the relevant molecular function. Removal follows project policy for this
      generic term and does not assert that the reported interaction is false.
    supported_by: []
  qualifier: enables
- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  review:
    summary: VPS34 functions on autophagy and endosomal membranes through class III PI3K
      complexes.
    action: ACCEPT
    reason: PIK3C3 generates PI3P for both ATG14-containing PI3KC3-C1 and UVRAG-containing
      PI3KC3-C2. Endosomal sorting is a conserved direct function of this catalytic subunit, and
      membrane/cytoplasmic locations remain valid at broader resolution. A project focus on
      autophagy is not a biological reason to demote the endosomal machinery or to call membrane
      association an over-annotation.
    supported_by:
    - reference_id: PMID:19946888
      supporting_text: The remaining species were largely involved in cellular processes and
        molecular functions that could be predicted to be transiently associated with membranes.
  qualifier: located_in
