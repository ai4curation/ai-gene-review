- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Generic kinase activity is too broad here. The reviewed molecular function for
      PIK3C3 should be the specific class III phosphatidylinositol 3-kinase activity term.
    action: MODIFY
    reason: Human VPS34 is a lipid kinase acting on phosphatidylinositol rather than a generic
      kinase activity in the GO-review sense. The specific MF term is available and better
      matches the direct biochemistry.
    proposed_replacement_terms:
    - id: GO:0016303
      label: 1-phosphatidylinositol-3-kinase activity
