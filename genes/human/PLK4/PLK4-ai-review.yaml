core_functions:
- description: PLK4 is an active centriole-associated protein serine/threonine kinase that initiates 
    procentriole assembly by assembling with CEP192, CEP152 and STIL-family scaffolds and by recruiting 
    centriole biogenesis factors.
  molecular_function: *id004
  directly_involved_in:
  - id: GO:0007099
    label: centriole replication
  locations:
  - id: GO:0120098
    label: procentriole
  - id: GO:0005814
    label: centriole
  supported_by:
  - *id001
  - reference_id: PMID:17681131
    supporting_text: overexpression of Polo-like kinase 4 (Plk4) in human cells induces centrosome 
      amplification through the simultaneous generation of multiple procentrioles
  - reference_id: PMID:24997597
    supporting_text: Plk4 relocalizes from the inner Cep192 ring to the outer Cep152 ring
- description: PLK4 phosphorylates centrosomal substrates such as FBXW5 and CEP131 to coordinate HsSAS-6 
    stability, centrosome copy number and centriolar-satellite organization.
  molecular_function: *id004
  directly_involved_in:
  - id: GO:0046601
    label: positive regulation of centriole replication
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0005813
    label: centrosome
  supported_by:
  - *id003
  - reference_id: PMID:30804208
    supporting_text: PLK4 phosphorylates CEP131 at Ser-78 to maintain centriolar satellite integrity.
