id: O00444
gene_symbol: PLK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PLK4 encodes the divergent polo-like kinase that nucleates procentriole assembly at parental centrioles.
  The kinase is recruited and positioned by CEP192, CEP152, STIL and related centriole scaffolds, phosphorylates
  centrosomal substrates such as FBXW5 and CEP131, and its abundance and activity must be restrained to prevent
  centriole overduplication and centrosome amplification.'
