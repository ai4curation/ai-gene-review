id: P08243
gene_symbol: ASNS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASNS is a cytosolic enzyme that makes L-asparagine from L-aspartate, glutamine and ATP. Its
  N-terminal glutaminase domain supplies nitrogen to the C-terminal synthetase domain, coupling glutamine
  hydrolysis to asparagine formation; human structural studies support a homodimer. The enzyme supplies
  asparagine for cellular metabolism and growth. Its expression responds to nutrient availability, and
  particular cancer-cell experiments link ASNS to survival during glucose deprivation and some drug treatments.
  Biallelic pathogenic variants cause asparagine synthetase deficiency, a severe neurodevelopmental disorder
  with microcephaly, developmental impairment and seizures.
