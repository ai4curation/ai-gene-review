      read. WT and R142A/R142I human proteins were expressed in Sf9 cells. PPi production is the measured
      readout; the stated 1:1 relationship to asparagine is inferred by analogy to the bacterial homolog.
      No whole supplement, raw EM maps, image pixels or isolated glutaminase assay audited.
  findings:
  - statement: Unmodified human ASNS forms a head-to-head dimer with glutaminase and synthetase domains.
    supporting_text: First, two monomers of unmodified human ASNS in the native state form a head-to-head
      dimer as a result of intermolecular interactions involving residues 31–34 in the adjacent N-terminal
      domains.
  - statement: Human WT and tunnel variants were compared under glutamine-fed and free-ammonia-fed in-vitro
      conditions using a PPi assay.
    supporting_text: The rate of inorganic pyrophosphate (PPi) production catalyzed by recombinant, WT
      human ASNS and two ammonia tunnel variants was determined in a continuous assay format using the
      EnzChek™ Pyrophosphate Assay Kit (Molecular Probes, Eugene, OR).
