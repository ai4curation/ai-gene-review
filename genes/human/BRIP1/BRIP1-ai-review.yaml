id: Q9BX63
gene_symbol: BRIP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRIP1 (FANCJ; historically BACH1) is a nuclear iron-sulfur DNA helicase that couples DNA-dependent ATP hydrolysis to 5'-to-3' translocation and strand separation. It unwinds forked duplex DNA and G-quadruplex structures, helping cells traverse DNA replication obstacles and maintain genome stability. BRIP1 binds the BRCT domains of BRCA1 through phosphorylated Ser990 and participates in homologous recombination repair. Its helicase activity and interaction with MLH1 also support the response to DNA interstrand crosslinks through a mechanism separable from BRCA1 binding. At DNA-protein crosslinks, its ATP-driven motor unfolds the protein adduct and exposes adjacent DNA, enabling SPRTN to proteolyze the protein component. RPA and BLM interact with BRIP1 and modulate its genome-maintenance functions. BRIP1 predominantly acts in the nucleoplasm and at stressed replication forks; its iron-sulfur cofactor maturation involves the CIA machinery. Biallelic pathogenic variants cause Fanconi anemia complementation group J, and monoallelic pathogenic variants confer ovarian-cancer susceptibility.
