    supporting_text: FANCJ unwound G4 DNA substrates in an ATPase-dependent manner
- description: ATP-driven BRIP1 motor activity unfolds a covalently DNA-bound protein adduct, exposing underlying DNA and enabling SPRTN to proteolyze the protein component. Purified human proteins support this mechanism; replication-coupled Xenopus experiments and selected translesion-synthesis reconstitutions define additional context-dependent roles. BRIP1 does not cleave DNA or replace SPRTN protease activity.
  molecular_function:
    id: GO:0043139
    label: 5'-3' DNA helicase activity
