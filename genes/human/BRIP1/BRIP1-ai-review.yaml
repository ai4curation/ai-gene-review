- term:
    id: GO:0106300
    label: protein-DNA covalent cross-linking repair
  evidence_type: IDA
  original_reference_id: PMID:36608669
  qualifier: involved_in
  review:
    summary: BRIP1 actively unfolds a covalent protein adduct to promote DPC repair.
    action: ACCEPT
    reason: Purified human FANCJ promotes unfolding of the HMCES protein adduct and enables human SPRTN to cleave that protein. Xenopus extract experiments also examine CMG bypass and replication-coupled repair. FANCJ is a backup to RTEL1 for some CMG-bypass events, and the TLS reconstitution distinguishes human Pol-eta approach from yeast Pol-zeta/Rev1 bypass. Do not claim DNA cleavage by a protease, universal dependence of SPRTN function, or unrestricted stimulation of every TLS polymerase.
    supported_by:
    - reference_id: PMID:36608669
