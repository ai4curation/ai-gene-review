- description: ATP-dependent G-quadruplex unwinding resolves structured DNA obstacles encountered during replication and repair. RPA stimulates this activity, whereas MSH2/MSH6 inhibits it in the reported biochemical assays; cellular telomestatin sensitivity supports a genome-maintenance role without proving that every genomic G4 is a BRIP1 substrate.
