core_functions:
- description: ATP-dependent 5'-to-3' DNA helicase activity couples ATP hydrolysis-driven translocation to unwinding of DNA repair intermediates. BRIP1 contributes to homologous recombination through BRCA1-associated functions and to the interstrand-crosslink response through helicase activity and MLH1 binding. The latter response can be restored independently of BRCA1 binding; the exact helicase-controlled step in crosslink repair remains incompletely resolved.
