core_functions:
- description: >-
    Very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase: catalyzes the dehydration of a
    very-long-chain (3R)-3-hydroxyacyl-CoA to the corresponding (2E)-enoyl-CoA + H2O
    (EC 4.2.1.134), the third step of the ER fatty acid elongation cycle, acting on a
    broad range of acyl chain lengths.
  molecular_function:
    id: GO:0102158
    label: very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase activity
  directly_involved_in:
  - id: GO:0030497
    label: fatty acid elongation
  - id: GO:0042761
    label: very long-chain fatty acid biosynthetic process
  locations:
