- id: PMID:10373328
  title: Cloning, mapping, and expression of two novel actin genes, actin-like-7A
    (ACTL7A) and actin-like-7B (ACTL7B), from the familial dysautonomia candidate
    region on 9q31.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      The paper itself is sound and correctly identified: it is the original cloning, mapping
      and expression description of ACTL7A and ACTL7B. It is miscited as the basis of the TAS
      annotations GO:0005200 structural constituent of cytoskeleton and GO:0005856
      cytoskeleton. It reports cDNA selection, direct genomic sequencing, linkage mapping in
      mouse and Northern expression analysis, with no biochemical, structural, localisation or
      phenotypic experiment; the only structural statement is the homology-based label
      actin-like. Those two GO terms therefore rest on a gene name rather than on data, and
      GO_REF:0000108 then derives GO:0007010 from one of them.
  findings:
  - supporting_text: Two novel human actin-like genes, ACTL7A and ACTL7B, were identified by
      cDNA selection and direct genomic sequencing from the familial dysautonomia candidate
      region on 9q31.
    reference_section_type: ABSTRACT
  - supporting_text: ACTL7A is expressed in a wide variety of adult tissues, while the ACTL7B
      message was detected only in the testis and, to a lesser extent, in the prostate.
    reference_section_type: ABSTRACT
- id: PMID:12672658
  title: Novel actin-like proteins T-ACTIN 1 and T-ACTIN 2 are differentially expressed
    in the cytoplasm and nucleus of mouse haploid germ cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The origin of the mouse nucleus annotation that the human IBA and ISS rows transfer, and
      the source of the mouse GO:0001673 male germ cell nucleus IDA, confirmed via QuickGO on
      Q9QY84. Also the earliest quantitative statement of the family's divergence from
      conventional actin. Abstract-only in the cache. Read this paper with the naming key in
      hand: T-ACTIN-1 is mACTL7B and T-ACTIN-2 is mACTL7A, so its localisation sentence assigns
      the nucleus to ACTL7A and the cytoplasm to the paralogue ACTL7B. Quoting that sentence in
      support of an ACTL7A cytoplasm annotation reads as evidence against the term, and it is
      cited here only on the nucleus rows and, with the paralogue caveat stated, on the
      cytoplasm propagation review.
  findings:
  - supporting_text: The mRNA sizes and deduced molecular masses of t-actin 1/mACTl7b and
      t-actin 2/mACTl7a were 2.2 kilobases (kb) and 1.8 kb, and Mr 43.1 x 10(3) and Mr 47.2 x
      10(3), respectively.
    reference_section_type: ABSTRACT
  - supporting_text: In contrast, only T-ACTIN-2 was present in sperm heads and tails.
    reference_section_type: ABSTRACT
  - supporting_text: Although the cellular locations of these two proteins are quite different
      (T-ACTIN-1 was found in the cytoplasm and T-ACTIN-2 was located in the nucleus), the
      expression of their proteins and mRNAs is controlled during development and limited
      during spermiogenesis.
    reference_section_type: ABSTRACT
  - supporting_text: The two deduced amino acid sequences had 60% homology, and they had
      approximately 40% homology with other actins.
    reference_section_type: ABSTRACT
