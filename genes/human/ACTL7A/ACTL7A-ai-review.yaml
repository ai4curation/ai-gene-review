- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      ACTL7A's core molecular function, and not a vague fallback: this term is the level GO's own
      phylogenetic pipeline deliberately chose for this clade, having explicitly rejected the
      specific child GO:0005200 on the same node and the same date.
    action: ACCEPT
    reason: >-
      The cached PAINT record for this family settles the level at which the structural claim
      should be made. At the ancestral actin node PTN000940351, GO:0005200 structural
      constituent of cytoskeleton is IBD-supported from experimentally annotated conventional
      actins and Arp2/Arp3 (seeds include UniProtKB:P60709 beta-actin, P61160 ARP2 and P61158
      ARP3). On descent into the divergent ARP branches it is then negated: PTN008986528, the
      node that carries ACTL7A, has GO:0005200 as an IRD with negated=true, and carries
      GO:0005198 by IBA instead - both rows dated 2025-08-05, and GO:0005198 appears nowhere
      else in the family table. So this row is not a parent left standing for want of a better
      term; it is the product of a single, deliberate, current curatorial act that replaced the
      child with the parent for exactly this clade. That judgement is independently what this
      review's own structure audit supports: ACTL7A's inter-protomer filament interface is
      42.3% identical to actin's against 93-100% for conventional actins, and the ATP-hydrolysis
      trigger His161 is replaced by tyrosine, so the route by which real actins earn GO:0005200
      is closed for ACTL7A. Meanwhile the claim GO:0005198 does make - contributing to the
      structural integrity of a complex - is exactly what the phenotypes show: knock-out
      spermatids lose subacrosomal F-actin entirely while retaining it elsewhere, their acrosomes
      peel off the nucleus, and patient sperm show irregular perinuclear theca. Accepted as the
      core molecular function on that basis. An earlier round of this review promoted GO:0005200
      here instead, arguing that ACTL7A's residence in GO:0033011 (a GO:0005856 descendant) made
      the specific term apply; that argument is withdrawn, because residing in a cytoskeletal
      structure is not the same as being a structural constituent of it, and because the IRD is
      dated after all of the knock-out and patient literature, so it cannot be dismissed as a
      judgement made without that evidence.
    supported_by:
    - reference_id: PMID:36734600
      supporting_text: Significantly, we found a complete loss of subacrosomal filamentous
        actin (F-actin) structures in knock-out spermatids suggesting a regulatory role for
        subacrosomal F-actin.
    - reference_id: PMID:36734600
      supporting_text: we propose that ACTL7A forms a unique testis-specific protein complex
        to anchor and stabilize acrosomal adherence to the acroplaxome at least in part by
        facilitating the presence of F-actin in the subacrosomal space
    - reference_id: file:human/ACTL7A/ACTL7A-bioinformatics/RESULTS.md
      supporting_text: '* **The filament interface is not retained.** ACTL7A matches actin at 42.3% of the 79 inter-protomer contact positions, versus 93.2% for conventional actins and 55.7% for Arp1, which does form a filament (in dynactin).'
    - reference_id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
      supporting_text: 'PTHR11937 PTN008986528 GO:0005198 F IBA false PANTHER:PTN000940351'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000940351
        source_label: ancestral actin node of PTHR11937
        source_status: SUPPORTS_TRANSFER
        comment: An internal tree node rather than a protein, but not therefore uninformative.
          It is the node at which GO:0005200 is IBD-supported from experimentally annotated
          conventional actins and Arp2/Arp3, and it is the seed for both the GO:0005198 IBA and
          the GO:0005200 IRD on the descendant ACTL7 node.
      - source_id: PANTHER:PTN008986528
        source_label: PANTHER node carrying ACTL7A
        source_status: SUPPORTS_TRANSFER
        comment: The decisive source. This node carries GO:0005198 by IBA and, on the same date
          of 2025-08-05, GO:0005200 as an IRD with negated set to true, which is an explicit
          rejection of the specific child for the clade containing ACTL7A rather than a silent
          omission. Recording this node as merely not-a-protein would drop the one fact about it
          that bears on the decision.
- term:
    id: GO:0001669
    label: acrosomal vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      ACTL7A lies in the subacrosomal layer between the acrosome and the nuclear envelope,
      not inside the acrosomal vesicle. Replace with perinuclear theca, which GO defines as
      including the subacrosomal layer.
    action: MODIFY
    reason: >-
      This is the compartment-resolution error that the 2011 structural paper explicitly
      corrected: ACTL7A was reassigned from the nucleus of spermatids and the acrosome to the
      subacrosomal layer, also called the acroplaxome. GO:0001669 is defined as the
      hydrolase-containing structure derived from the lysosome, with exact synonyms acrosome
      and acrosomal granule, so it denotes a membrane-bounded vesicle lumen; ACTL7A is a
      cytosolic and cytoskeletal protein on the outside of the inner acrosomal membrane and
      cannot be located_in it. The GO:0033011 perinuclear theca definition explicitly
      comprises a subacrosomal layer and the postacrosomal sheath, which is where every
      high-resolution observation of ACTL7A places it, and that term is already annotated to
      this gene by IDA. Modifying rather than removing because the biology is adjacent and
      the intent of the annotation is clear.
    proposed_replacement_terms:
    - id: GO:0033011
      label: perinuclear theca
    supported_by:
    - reference_id: PMID:21278383
      supporting_text: Previous observations have shown that Arp7A is expressed in testis and
        is associated with the nucleus of spermatids (18, 19). We have now extended these
        earlier studies and shown that Arp7A is actually localized in the subacrosomal layer,
        which is also known as the acroplaxome (40).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q9QY84
        source_label: mouse Actl7a
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The mouse acrosome annotation reflects the same light-microscopy resolution
          limit; the better-resolved mouse call is perinuclear theca (IDA PMID:41169243).
      - source_id: UniProtKB-SubCell:SL-0007
        source_label: UniProt SubCell acrosome
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Keyword-level mapping; carries no compartment resolution of its own.
