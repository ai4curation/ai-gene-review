      True but uninformative root-level compartment; the specific location, perinuclear
      theca, is separately annotated.
    action: KEEP_AS_NON_CORE
    reason: >-
      Every WITH/FROM token resolves inside the ACTL7 clade: mouse Actl7a and rat Actl7a carry
      experimental cytoplasm evidence, mouse Actl7b carries an IDA that needs the caveat below,
      and one token is ACTL7A itself, a self-referential IBA recording a PAINT curator's
      judgement rather than a circular inference. The term is not in doubt, because the true
      ortholog supports it independently. GO:0005737 is simply a parent of the informative
      terms already present, since perinuclear theca is a cytoplasm descendant, so it adds no
