id: Q9Y615
gene_symbol: ACTL7A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTL7A (Arp7A, T-actin 2) is a testis-enriched actin-related protein that provides
  structural scaffolding for the sperm head rather than acting as a conventional actin. It
  couples a 435-residue actin fold to a unique disordered 64-residue N-terminal extension
  that is not present in actin and that carries its best-defined biochemical activity: the
  extension binds the tandem LIM2-3 domains of testin (TES), forming an ACTL7A-TES-ENAH
  heterotrimer whose structure has been solved. ACTL7A concentrates in the subacrosomal
  layer of the perinuclear theca, the F-actin- and keratin-containing plate called the
  acroplaxome that lies between the developing acrosome and the nuclear envelope, and is
  also found transiently on the Golgi apparatus during acrosome biogenesis, in the germ-cell
  nucleus, and later in postacrosomal regions of the sperm head. Loss of ACTL7A abolishes
  subacrosomal filamentous actin specifically, without affecting F-actin elsewhere in the
  spermatid, and the acrosome then mislocalises its granule and peels away from the nucleus;
  ACTL7A therefore organises a spatially restricted actin network and anchors the acrosome to
  the nuclear envelope. It binds several other perinuclear-theca proteins, including ACTL9
  and cylicin-1. Its actin fold is intermediate in character: the nucleotide cleft is largely
  conserved, but the histidine that triggers ATP hydrolysis on filament incorporation and the
  bulk of the inter-protomer filament interface are not, and the protein does not assemble
  into filaments when expressed in somatic cells. In humans, bi-allelic ACTL7A variants cause
  autosomal-recessive spermatogenic failure 86, in which morphologically unremarkable sperm
  carry acrosomal and perinuclear-theca ultrastructural defects and fail to activate the
  oocyte because phospholipase C zeta is depleted or mislocalised, producing total
  fertilization failure or early embryonic arrest that can be bypassed by artificial oocyte
  activation.
