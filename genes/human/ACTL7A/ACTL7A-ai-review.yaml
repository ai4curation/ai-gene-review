      supporting_text: ACTL7A is expressed in a wide variety of adult tissues, while the
        ACTL7B message was detected only in the testis and, to a lesser extent, in the
        prostate.
- term:
    id: GO:0007343
    label: egg activation
  evidence_type: IMP
  original_reference_id: PMID:34727571
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. ACTL7A is an oocyte-activation-deficiency gene: patient
      variants deplete and mislocalise phospholipase C zeta so the oocyte never activates,
      and the defect is rescued by a calcium ionophore. GOA has nothing more specific than
      fertilization.
    action: NEW
    reason: >-
      GO:0007343 egg activation is a descendant of GO:0009566 fertilization and is exactly
      the step that fails when ACTL7A is lost. The human evidence is patient-variant based
      and mechanistically explicit: ACTL7A and phospholipase C zeta protein are both markedly
      reduced in the affected sperm, the phospholipase is mislocalised, calcium oscillations
      fail, and artificial oocyte activation by calcium ionophore rescues fertilization and
      yields a live birth. The same axis is reproduced in mouse knock-in and knock-out models
      and in three further independent patient reports. There is direct GO precedent for
      annotating a sperm-borne factor to this term on patient-variant evidence: human PLCZ1
      carries GO:0007343 with an IMP. This is additive; the existing fertilization
      annotations remain correct.
    supported_by:
    - reference_id: PMID:34727571
      supporting_text: Protein expression of ACTL7A and phospholipase C zeta, a key
        sperm-borne oocyte activation factor, was significantly reduced in the affected sperm
        compared to healthy controls, suggesting that the ACLT7A variants lead to an oocyte
        activation deficiency and TFF.
    - reference_id: PMID:34727571
      supporting_text: AOA by calcium ionophore (A23187) after ICSI successfully rescued the
        TFF and achieved a live birth for the patient with ACTL7A variants.
    - reference_id: PMID:32923619
      supporting_text: Furthermore, the sperm from ACTL7A/Actl7a-mutated men and mice showed
        reduced expression and abnormal localization of PLCζ as a potential cause of embryonic
        arrest and failure of fertilization.
    - reference_id: PMID:35863052
      supporting_text: The mutant sperm failed to activate the oocyte, and sperm-borne oocyte
        activation factor phospholipase C zeta (PLCζ) discharge accompanied by ACTL7A was
        observed, leading to total fertilization failure (TFF).
core_functions:
- description: >-
    Architectural component of the acroplaxome, the subacrosomal layer of the perinuclear theca,
    contributing to the structural integrity of the protein assembly there and required for the
    spatially restricted filamentous actin network that anchors the acrosome to the nuclear
    envelope during spermiogenesis. Loss of ACTL7A abolishes subacrosomal F-actin without
    affecting F-actin elsewhere in the spermatid; the acrosomal granule then mislocalises and the
    acrosome peels away from the nucleus. The molecular function is deliberately stated at the
    level of structural molecule activity rather than structural constituent of cytoskeleton:
    ACTL7A is not established as a constituent of the actin filaments themselves, GO's
    phylogenetic pipeline has explicitly negated the cytoskeletal-constituent term for this
    clade, and the sequence audit shows the filament interface by which real actins earn that
    term is not conserved.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0001675
    label: acrosome assembly
  - id: GO:0030036
    label: actin cytoskeleton organization
  - id: GO:0007286
    label: spermatid development
  locations:
  - id: GO:0033011
    label: perinuclear theca
  supported_by:
  - reference_id: PMID:36734600
    supporting_text: The KO spermatids did not lose F-actin in other cellular regions,
      indicating that ACTL7A is not globally required for F-actin formation within developing
      spermatids
  - reference_id: PMID:36734600
    supporting_text: we propose that ACTL7A forms a unique testis-specific protein complex to
      anchor and stabilize acrosomal adherence to the acroplaxome at least in part by
      facilitating the presence of F-actin in the subacrosomal space
  - reference_id: PMID:21278383
    supporting_text: We have now extended these earlier studies and shown that Arp7A is
      actually localized in the subacrosomal layer, which is also known as the acroplaxome
  knowledge_gaps:
  - gap_statement: >-
      It is not known whether ACTL7A is itself the filament-forming subunit of the
      subacrosomal actin network or instead nucleates, stabilises or anchors filaments built
      from conventional actin.
    boundary: >-
      Established: ACTL7A is indispensable for the presence of subacrosomal F-actin in mouse
      spermatids, the requirement is local rather than global, and ACTL7A co-precipitates
      with ARP2, MYO6, PFN4 and ACTN1. Also established: ACTL7A does not assemble into
      filaments when expressed in a somatic cell line, and its inter-protomer interface is
      only 42 percent identical to actin's, against 93 percent for conventional actins and 56
      percent for filament-forming Arp1.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      The distinction decides whether the correct molecular function is a polymerising actin,
      an actin nucleator, or a structural scaffold, and therefore which GO branch ACTL7A
      belongs in. It also determines whether the acroplaxome filaments seen by electron
      microscopy are actin, ARP, or mixed.
    resolution: >-
      Pyrene-actin polymerisation and total internal reflection fluorescence assays with
      recombinant full-length ACTL7A alone and mixed with actin; negative-stain or cryo-EM of
      any polymer formed; correlative light and electron microscopy or immuno-electron
      microscopy of the acroplaxome to ask whether its filaments contain ACTL7A, actin, or
      both.
    provenance:
    - reference_id: PMID:36734600
      supporting_text: As such, it is not yet clear whether ACTL7A may be the filament-forming
        actin in the acroplaxome, or whether its role is to nucleate, stabilize formation,
        and/or anchor F-actin formed by conventional ARPs to the nuclear surface.
    - reference_id: PMID:21278383
      supporting_text: Future studies will be required to establish the role of the
        Arp7A·Tes·Mena complex in the formation and function of the acroplaxome and whether it
        binds to and/or induces actin filament polymerization.
- description: >-
    Tandem-LIM-domain ligand. The disordered N-terminal extension unique to ACTL7A, and not
    the actin fold, binds the LIM2 and LIM3 domains of testin, forming an ACTL7A-TES-ENAH
    heterotrimer in the acroplaxome. Two small alanine side chains occupy equivalent apolar
    pockets in each LIM domain and an intervening GPAK linker binds the LIM2-LIM3 junction;
    substituting either alanine abolishes binding.
  molecular_function:
    id: GO:0030274
    label: LIM domain binding
  locations:
  - id: GO:0033011
    label: perinuclear theca
  supported_by:
  - reference_id: PMID:21278383
    supporting_text: The N-terminal 65-residue extension to the actin-like fold of Arp7A
      interacts directly with Tes.
  - reference_id: PMID:21278383
    supporting_text: Two alanine residues from Arp7A that occupy equivalent apolar pockets in
      both LIM domains as well as an intervening GPAK linker that binds the LIM2-3 junction
      are critical for the Arp7A-Tes interaction.
- description: >-
    Required for sperm-borne oocyte activation. ACTL7A retains phospholipase C zeta in the
    sperm head; when ACTL7A is truncated, degraded or fails to attach to the acroplaxome, the
    phospholipase is lost or mislocalised, the oocyte's calcium oscillations do not occur, and
    fertilization fails. The block is downstream of sperm entry, since it is bypassed by
    artificial oocyte activation with a calcium ionophore. No molecular_function is asserted
    for this core function deliberately: whether ACTL7A acts here through the same structural
    activity recorded above, by holding the postacrosomal sheath together, or through a direct
    interaction with the phospholipase is undetermined, and the knowledge gap below states
    that explicitly rather than letting a guessed activity stand in for it.
  directly_involved_in:
  - id: GO:0007343
    label: egg activation
  - id: GO:0009566
    label: fertilization
  locations:
  - id: GO:0033011
    label: perinuclear theca
  supported_by:
  - reference_id: PMID:34727571
    supporting_text: Protein expression of ACTL7A and phospholipase C zeta, a key sperm-borne
      oocyte activation factor, was significantly reduced in the affected sperm compared to
      healthy controls, suggesting that the ACLT7A variants lead to an oocyte activation
      deficiency and TFF.
  - reference_id: PMID:35863052
    supporting_text: The mutant sperm failed to activate the oocyte, and sperm-borne oocyte
      activation factor phospholipase C zeta (PLCζ) discharge accompanied by ACTL7A was
      observed, leading to total fertilization failure (TFF).
  knowledge_gaps:
  - gap_statement: >-
      The mechanism linking ACTL7A to phospholipase C zeta is undetermined: it is not known
      whether ACTL7A binds the phospholipase directly, whether it retains it indirectly by
      holding the postacrosomal sheath together, or whether the loss is a secondary
      consequence of cytoplasmic-droplet shedding.
    boundary: >-
      Established across five independent human and mouse studies: ACTL7A loss or
      mislocalisation is accompanied by reduced and mislocalised phospholipase C zeta, absent
      calcium oscillations, and total fertilization failure rescued by calcium ionophore. No
      direct ACTL7A-PLCZ1 interaction has been reported; the reported ACTL7A interactome is
      dominated by perinuclear-theca and cytoskeletal proteins.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Whether ACTL7A is a phospholipase carrier or a structural prerequisite determines
      whether the correct annotation is protein localisation to the postacrosomal sheath or a
      purely architectural role, and bears on whether the clinical rescue strategy generalises
      to other perinuclear-theca genes.
    resolution: >-
      Reciprocal co-immunoprecipitation and proximity labelling for ACTL7A and PLCZ1 in
      spermatids; quantitative imaging of the phospholipase in the ACTL7A G402S knock-in
      before and after droplet shedding; test whether the same mislocalisation occurs in ACTL9
      and CYLC1 mutants, which would indicate a shared architectural cause.
    provenance:
    - reference_id: PMID:35863052
      supporting_text: Furthermore, mutant ACTL7A failed to attach to the acroplaxome and was
        discharged by cytoplasmic droplets, which led to the absence of ACTL7A in epididymal
        spermatozoa in mice.
proposed_new_terms:
- proposed_name: acroplaxome
  proposed_definition: >-
    A cytoskeletal plate that forms the subacrosomal region of the perinuclear theca of
    developing spermatids and spermatozoa, lying between the inner acrosomal membrane and the
    nuclear envelope and containing filamentous actin and keratin 5, and which anchors the
    developing acrosome to the nuclear envelope. It is bounded caudally by a marginal ring
    apposed to the leading edge of the acrosome.
  justification: >-
    GO's perinuclear theca definition already names its two parts, a subacrosomal layer and,
    continuing caudally beyond the acrosomic system, the postacrosomal sheath, and GO has a
    term for the caudal part, GO:0033150 cytoskeletal calyx, but none for the subacrosomal
    layer. The gap has a concrete curation cost that this review encountered directly:
    ACTL7A's characterised location is the acroplaxome, and with no term available curators
    have had to choose between GO:0001669 acrosomal vesicle, which is the wrong compartment,
    its definition being the hydrolase-containing lysosome-derived structure with exact
    synonyms acrosome and acrosomal granule, and GO:0033011, which is correct but merges the
    subacrosomal and postacrosomal pools that ACTL7A demonstrably moves between during
    spermiogenesis. The same term is needed for a growing set of genes assigned to this
    structure, including ACTL9, CYLC1, ACTRT2, SPACA1, MYO6 and IZUMO3. OLS and QuickGO
    searches for acroplaxome and subacrosomal return no GO term.
  proposed_parent:
    id: GO:0033011
    label: perinuclear theca
  supported_by:
  - reference_id: PMID:21278383
    supporting_text: We have now extended these earlier studies and shown that Arp7A is
      actually localized in the subacrosomal layer, which is also known as the acroplaxome
  - reference_id: PMID:21278383
    supporting_text: The acroplaxome is a morphologically distinct junctional complex that is
      thought to play an important role in anchoring the acrosome to the nuclear envelope of
      round spermatids
- proposed_name: acrosome attachment to nuclear envelope
  proposed_definition: >-
    The process by which the developing acrosome becomes and remains physically anchored to
    the nuclear envelope of a spermatid, mediated by the intervening acroplaxome and involving
    linkage of the inner acrosomal membrane through subacrosomal cytoskeletal and theca
    proteins to nuclear envelope proteins.
  justification: >-
    GO:0001675 acrosome assembly is defined narrowly as the formation of the acrosome from the
    spermatid Golgi and so does not cover the distinct, separately mutable step of holding the
    formed acrosome onto the nucleus. That step is what fails in a coherent and expanding set
    of human infertility genes: ACTL7A loss causes acrosomes to peel off and bubble-shaped
    acrosomes, cylicin-1 loss causes acrosome detachment from the nucleus through an
    inner-acrosomal-membrane to nuclear-envelope sandwich with SPACA1 and FAM209, and ACTL9
    loss disorganises the perinuclear theca. Without a term, all of these are annotated to
    acrosome assembly, which conflates biogenesis with attachment and loses the shared
    mechanism.
  proposed_parent:
    id: GO:0001675
    label: acrosome assembly
  supported_by:
  - reference_id: PMID:38573307
    supporting_text: Cylicin-1 interacts with itself, several other PT proteins, the inner
      acrosomal membrane (IAM) protein SPACA1, and the nuclear envelope (NE) protein FAM209 to
      form an 'IAM-cylicins-NE' sandwich structure, anchoring the acrosome to the nucleus.
  - reference_id: PMID:36734600
    supporting_text: In addition to the acrosomal granule displacement defects, we also
      observed acrosomes peeling off in Actl7a KO spermatids, suggesting that ACTL7A-dependent
      F-actins also play a structural role for acrosomal anchoring and development
suggested_questions:
- question: >-
    Does ACTL7A bind ATP or ADP? The nucleotide cleft is 63 percent identical to actin's, well
    above the divergent SWI/SNF Arps at 37 percent, and two of five variants reported in
    SPGF86 patients map into it while none of four population polymorphisms do, yet no binding
    measurement exists. A negative result would justify dropping the actin-derived framing
    altogether; a positive one would make ATP binding a legitimate molecular function.
- question: >-
    Is the substitution of actin's His161 by tyrosine in ACTL7A functionally meaningful? In
    actin, flipping of this histidine on filament incorporation triggers ATP hydrolysis.
    ACTL7B retains the histidine while ACTL7A and ACTL9 do not, which suggests a
    within-family functional split worth testing rather than neutral drift.
- question: >-
    How much of ACTL7A's annotation set should transfer to its head-to-head paralogue ACTL7B,
    and how much should not? The two are the obvious candidates for cross-transfer, and this
    review found they are separable on three independent axes. Residues: ACTL7B keeps the
    His161 hydrolysis trigger that ACTL7A has lost, and has a better-conserved nucleotide cleft
    (68.4 versus 63.2 percent) but a worse-conserved filament interface (36.4 versus 42.3
    percent). Localisation: the study that first described both proteins put T-ACTIN-2 (ACTL7A)
    in the nucleus and in sperm heads and tails, and T-ACTIN-1 (ACTL7B) in the cytoplasm and
    not in sperm, although both were later found enriched in the acroplaxome. Expression: the
    original human survey detected ACTL7A message broadly but ACTL7B only in testis and
    prostate. Most consequentially for molecular function, ACTL7A's LIM-domain binding is
    carried by its N-terminal extension, and the equivalent extension in ACTL7B is reported to
    be distinct, so GO:0030274 should not be assumed to transfer between them. Mouse Actl7b is
    already a WITH/FROM donor on ACTL7A's cytoplasm IBA row, which is where the pair most needs
    watching.
- question: >-
    Should the acrosomal-vesicle annotations for ACTL7A be reassigned to the acroplaxome, and
    should GO gain a term for it? The only high-resolution study places ACTL7A in the
    subacrosomal layer and explicitly corrects earlier acrosome and nucleus assignments, but
    light-microscopy studies of patient sperm cannot distinguish the two compartments and GO
    has no term with which to state the difference.
- question: >-
    Should the ortholog-derived nucleus rows be refined to GO:0001673 male germ cell nucleus?
    Every observation of nuclear ACTL7A protein has been in a spermatocyte, spermatid or
    sperm, and the mouse ortholog carries that specific term by IDA from the same experiment
    the human ISS row transfers from. Two counter-considerations, neither decisive: the
    phylogenetic row's donor set includes fungal and protozoan Arps for which the germ-cell
    term is meaningless, so GO:0005634 is the right least common ancestor there; and no study
    has looked for ACTL7A protein in a somatic nucleus, so the germ-cell restriction is
    established by where the protein has been observed rather than by exclusion elsewhere.
    ACTL7A mRNA has been reported across many adult tissues, but a Northern survey does not
    speak to protein localisation and is not the reason for hesitating.
- question: >-
    What, if anything, does the intranuclear pool of ACTL7A do? It is reproducible across
    mouse germ-cell immunofluorescence, human sperm-nucleus proteomics and heterologous
    expression, where ACTL7A alone reorganises the nucleus, yet chromatin compaction is normal
    in the knock-out. Reported chromatin-remodeller links rest on a preprint and in-silico
    docking.
- question: >-
    Is the ACTL7A-TES-ENAH heterotrimer required in vivo? The complex is defined
    crystallographically and the interaction is abolished by single point substitutions, but no
    mouse carrying an interaction-null ACTL7A allele has been reported, so the complex's
    contribution to acroplaxome function is untested.
- question: >-
    Why is ACTL7A protein absent rather than merely dysfunctional in most patients?
    Truncating, missense and knock-in alleles alike lead to loss of ACTL7A from sperm, by
    degradation or by shedding in cytoplasmic droplets. Whether a quality-control pathway
    removes misfolded ACTL7A, and whether that is the proximate cause of phospholipase C zeta
    loss, is unknown.
suggested_experiments:
- hypothesis: >-
    ACTL7A binds a nucleotide but cannot hydrolyse it, because the cleft is conserved while
    the His161 hydrolysis trigger is not.
  description: >-
    Express and purify recombinant full-length human ACTL7A and the actin-fold-only construct
    lacking residues 1-64. Measure nucleotide binding by isothermal titration calorimetry and
    with a fluorescent nucleotide analogue such as etheno-ATP, and measure steady-state and
    single-turnover phosphate release with a malachite-green or EnzChek assay, in parallel with
    beta-actin as a positive control and a cleft mutant of ACTL7A as a negative control.
    Include the patient variants G246A, G362R and D75A, which the structure-guided audit
    places in or adjacent to the cleft, and test whether substituting histidine for tyrosine at
    the position equivalent to actin His161 restores hydrolysis.
  experiment_type: biochemistry
- hypothesis: >-
    ACTL7A does not homopolymerise but co-assembles with or caps conventional actin, explaining
    why subacrosomal F-actin is lost when it is absent.
  description: >-
    Perform pyrene-actin polymerisation assays with recombinant ACTL7A alone and titrated into
    actin, measuring nucleation lag, elongation rate and critical concentration; follow with
    total internal reflection fluorescence microscopy of labelled filaments to see whether
    ACTL7A incorporates, caps or bundles. Examine any polymer by negative-stain electron
    microscopy. Interpret against the finding that ACTL7A matches actin at only 42 percent of
    inter-protomer contact positions.
  experiment_type: in vitro reconstitution
- hypothesis: >-
    The acroplaxome filaments that disappear in Actl7a knock-out spermatids contain ACTL7A
    itself.
  description: >-
    Apply immunogold electron microscopy and expansion microscopy or cryo-electron tomography
    to wild-type round spermatids, using antibodies against ACTL7A, beta-actin and keratin 5,
    to determine the molecular composition of the subacrosomal filaments and the spatial
    relationship of ACTL7A to them. This directly addresses the 2011 observation that actin
    could not be detected in the subacrosomal layer of round spermatids while filaments were
    morphologically present.
  experiment_type: imaging
- hypothesis: >-
    The ACTL7A-TES interaction is required for acroplaxome integrity and male fertility.
  description: >-
    Generate a knock-in mouse carrying the alanine-to-tyrosine substitution at the ACTL7A
    residue equivalent to human Ala31 or Ala41, which abolishes TES binding in vitro without
    deleting the protein, and score fertility, acrosome attachment, subacrosomal F-actin by
    phalloidin, phospholipase C zeta localisation, and ACTL7A retention in epididymal sperm.
    This separates the LIM-binding activity from the rest of the protein.
  experiment_type: mouse genetics
- hypothesis: >-
    Phospholipase C zeta loss in ACTL7A mutants is an indirect consequence of
    perinuclear-theca failure rather than of a direct ACTL7A-phospholipase interaction.
  description: >-
    Test for a direct interaction by reciprocal co-immunoprecipitation and proximity labelling
    of ACTL7A and PLCZ1 in spermatids and in a heterologous co-expression system, then compare
    phospholipase C zeta localisation and abundance across ACTL7A, ACTL9 and CYLC1 mutant
    sperm. A shared phospholipase phenotype across structurally distinct theca mutants would
    establish the indirect model and support annotating ACTL7A to egg activation through an
    architectural role rather than as a carrier.
  experiment_type: interaction proteomics
