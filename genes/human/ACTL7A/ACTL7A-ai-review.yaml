  - supporting_text: sperm nuclei were obtained through CTAB treatment and isolated to over
      99.9% purity without any tail fragments, acrosome or mitochondria as assessed by optical
      microscopy and transmission electron microscopy
    reference_section_type: ABSTRACT
- id: PMID:32923619
  title: Disruption in ACTL7A causes acrosomal ultrastructural defects in human and
    mouse sperm as a novel male factor inducing early embryonic arrest.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding human-genetics paper for ACTL7A-related infertility and the source of the
      human acrosomal-vesicle IDA. Abstract-only in the cache, so the immunofluorescence
      figures could not be inspected; the localisation term is proposed for refinement to
      perinuclear theca on definitional grounds rather than on any doubt about the data.
  findings:
  - supporting_text: This mutation is deleterious and causes sperm acrosomal ultrastructural
      defects.
    reference_section_type: ABSTRACT
  - supporting_text: Furthermore, the sperm from ACTL7A/Actl7a-mutated men and mice showed
      reduced expression and abnormal localization of PLCζ as a potential cause of embryonic
      arrest and failure of fertilization.
    reference_section_type: ABSTRACT
- id: PMID:33626338
  title: Homozygous pathogenic variants in ACTL9 cause fertilization failure and male
    infertility in humans and mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt and GOA for the ACTL7A-ACTL9 interaction. The title foregrounds ACTL9,
      which is the interacting partner rather than the reviewed gene; that is normal and not a
      citation error. Independently valuable because ACTL9 loss reproduces the ACTL7A
      phenotype, with disorganised perinuclear theca, mislocalised phospholipase C zeta and
      failed calcium oscillations, which corroborates the interaction functionally.
  findings:
  - supporting_text: ACTL9 variations led to abnormal ultrastructure of the perinuclear theca
      (PT), and PLCζ was absent in the head and present in the neck of the mutant sperm, which
      contributed to failed normal calcium oscillations in oocytes and subsequent TFF.
    reference_section_type: ABSTRACT
- id: PMID:34727571
  title: Novel bi-allelic variants in ACTL7A are associated with male infertility
    and total fertilization failure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The clearest statement of the oocyte-activation mechanism and of its pharmacological
      rescue, and therefore the anchor for the proposed GO:0007343 egg activation annotation.
      Note that GOA records this reference with an IMP code for a cellular-component term,
      GO:0001669; the underlying data are immunofluorescence on patient sperm, which is
      IDA-shaped. Abstract-only in the cache.
  findings:
  - supporting_text: TEM showed that the ACTL7A variants caused ultrastructural defects in the
      acrosome and perinuclear theca.
    reference_section_type: ABSTRACT
  - supporting_text: Protein expression of ACTL7A and phospholipase C zeta, a key sperm-borne
      oocyte activation factor, was significantly reduced in the affected sperm compared to
      healthy controls, suggesting that the ACLT7A variants lead to an oocyte activation
      deficiency and TFF.
    reference_section_type: ABSTRACT
- id: PMID:35863052
  title: Pathogenic variant in ACTL7A causes severe teratozoospermia characterized
    by bubble-shaped acrosomes and male infertility.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the G402S variant used in the structure-guided variant mapping, and of the
      observation that mutant ACTL7A fails to attach to the acroplaxome and is shed in
      cytoplasmic droplets together with phospholipase C zeta. Abstract-only in the cache.
  findings:
  - supporting_text: The mutant sperm failed to activate the oocyte, and sperm-borne oocyte
      activation factor phospholipase C zeta (PLCζ) discharge accompanied by ACTL7A was
      observed, leading to total fertilization failure (TFF).
    reference_section_type: ABSTRACT
  - supporting_text: Furthermore, mutant ACTL7A failed to attach to the acroplaxome and was
      discharged by cytoplasmic droplets, which led to the absence of ACTL7A in epididymal
      spermatozoa in mice.
    reference_section_type: ABSTRACT
- id: PMID:35921706
  title: Actl7a deficiency in mice leads to male infertility and fertilization failure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      One of the two mouse studies underlying the mouse fertilization IMP that the human IEA
      and ISS fertilization rows transfer, confirmed via QuickGO on Q9QY84. Adds the ZPBP
      mislocalisation and reduced sperm-zona binding phenotypes. Abstract-only in the cache.
  findings:
  - supporting_text: Actl7a deficiency led to malformed formation of sperm acrosomes, male
      infertility, fertilization failure during in vitro fertilization (IVF) and
      intracytoplasmic sperm injection (ICSI), and reduced sperm-zona pellucida (ZP) binding
      ability.
    reference_section_type: ABSTRACT
- id: PMID:36574082
  title: A novel homozygous mutation in ACTL7A leads to male infertility.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Source of the D75A variant, which the structure-guided audit maps to actin Asp11 in the
      divalent-cation site. Reports ACTL7A protein degradation in patient sperm with irregular
      perinuclear theca and mislocalised phospholipase C zeta. The 3D-modelling claim about a
      lost hydrogen bond is in-silico and is not used to support any annotation. Abstract-only
      in the cache.
  findings:
  - supporting_text: We identified a novel homozygous missense mutation c.224A > C (p.D75A) in
      ACTL7A gene in two infertile brothers with teratozoospermia by whole-exome sequencing
      (WES).
    reference_section_type: ABSTRACT
- id: PMID:36734600
  title: Testis-specific actin-like 7A (ACTL7A) is an indispensable protein for subacrosomal-associated
    F-actin formation, acrosomal anchoring, and male fertility.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The decisive functional paper and the main basis for the proposed move from GO:0007010
      to GO:0030036, with full text available. Establishes that Actl7a knock-out spermatids
      lose subacrosomal F-actin completely while retaining F-actin elsewhere, documents the
      intranuclear pool by 3D confocal imaging, reports the co-immunoprecipitation set
      including a negative for ACTRT2, and states plainly that whether ACTL7A is itself the
      filament remains unresolved.
  findings:
  - supporting_text: Significantly, we found a complete loss of subacrosomal filamentous actin
      (F-actin) structures in knock-out spermatids suggesting a regulatory role for
      subacrosomal F-actin.
    reference_section_type: ABSTRACT
  - supporting_text: The KO spermatids did not lose F-actin in other cellular regions,
      indicating that ACTL7A is not globally required for F-actin formation within developing
      spermatids
    reference_section_type: DISCUSSION
  - supporting_text: As such, it is not yet clear whether ACTL7A may be the filament-forming
      actin in the acroplaxome, or whether its role is to nucleate, stabilize formation,
      and/or anchor F-actin formed by conventional ARPs to the nuclear surface.
    reference_section_type: DISCUSSION
- id: PMID:37667331
  title: Loss of ACTL7A causes small head sperm by defective acrosome-acroplaxome-manchette
    complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of the mouse spermatid development IMP that the human IEA and ISS rows
      transfer, confirmed via QuickGO on Q9QY84, with full text available. The PI3K/AKT/mTOR
      and PDLIM1 autophagy mechanism is a downstream proteomic correlate and is not used to
      support any annotation.
  findings:
  - supporting_text: Immunofluorescence and TEM analyses revealed that the deletion of ACTL7A
      damaged the formation of acrosome-acroplaxome-manchette complex, leading to
      abnormalities in the shaping of sperm heads.
    reference_section_type: ABSTRACT
- id: PMID:38573307
  title: Disruption in CYLC1 leads to acrosome detachment, sperm head deformity, and
    male in/subfertility in humans and mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt and GOA for the ACTL7A-cylicin-1 interaction. As with the ACTL9 paper,
      the title foregrounds the partner rather than the reviewed gene, which is expected. Also
      the clearest published description of the acrosome-to-nuclear-envelope anchoring module,
      and the main external justification for the proposed acrosome attachment to nuclear
      envelope term.
  findings:
  - supporting_text: Loss of cylicin-1 in mice leads to a high incidence of malformed sperm
      heads with acrosome detachment from the nucleus.
    reference_section_type: ABSTRACT
  - supporting_text: Cylicin-1 interacts with itself, several other PT proteins, the inner
      acrosomal membrane (IAM) protein SPACA1, and the nuclear envelope (NE) protein FAM209 to
      form an 'IAM-cylicins-NE' sandwich structure, anchoring the acrosome to the nucleus.
    reference_section_type: ABSTRACT
- id: PMID:41169243
  title: Perinuclear theca protein FNDC8 interacts with CCIN and ACTL7A to ensure
    proper sperm head shaping during spermiogenesis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Source of the mouse perinuclear theca IDA that the human GO_REF:0000107 row transfers,
      confirmed via QuickGO on Q9QY84, with full text available. Its primary subject is FNDC8;
      the ACTL7A content is the interaction and a summary of ACTL7A's established role, which
      is how it is used here.
  findings:
  - supporting_text: ACTL7A, another essential PT protein, is required for acrosome biogenesis
      and mediates the tethering of the acrosomal outer membrane to the nucleus.
    reference_section_type: RESULTS
- id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
  title: PANTHER PTHR11937 PAINT annotation table - per-node GO propagations and rejections
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The in-repo cache of GO's phylogenetic annotation decisions for this family, and decisive
      for the structural molecular-function question. Read together, its two rows for the node
      that carries ACTL7A show a single curatorial act rather than an omission: PTN008986528 gets
      GO:0005198 by IBA and GO:0005200 as an IRD with negated set to true, both dated 2025-08-05,
      while GO:0005200 is IBD-supported one level up at PTN000940351 from conventional actins and
      Arp2/Arp3. GO:0005198 occurs nowhere else in the table. Q9Y615 is confirmed in
      PTHR11937-entries.csv, so the negation covers ACTL7A directly. Dates in this file vary per
      row, so 2025-08-05 is a per-annotation date and not a bulk stamp.
  findings:
  - supporting_text: 'PTHR11937 PTN008986528 GO:0005200 F IRD true PANTHER:PTN000940351'
  - supporting_text: 'PTHR11937 PTN008986528 GO:0005198 F IBA false PANTHER:PTN000940351'
- id: file:human/ACTL7A/ACTL7A-bioinformatics/RESULTS.md
  title: ACTL7A actin-fold audit - structure-derived nucleotide-cleft and filament-interface
    conservation
  findings:
  - supporting_text: '* **Nucleotide cleft largely retained.** ACTL7A is 63.2% identical to actin across the 19 G-actin cleft positions (66.7% at the phosphate contacts), against 96.5% for conventional actins, 79.0% for Arp2/Arp3 and 36.9% for the divergent SWI/SNF Arps.'
  - supporting_text: '* **The cleft is under disease-relevant constraint.** 2/5 ACTL7A variants reported in SPGF86 patients map into the nucleotide cleft, which covers only 4.6% of the protein (binomial p = 0.0193); 0/4 population polymorphisms do.'
