- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Nuclear localisation of ACTL7A is genuine, but no nuclear molecular activity has been
      shown, so the is_active_in qualifier overstates what is known. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Resolving the five WITH/FROM tokens shows this is not a fold artefact even though the
      PANTHER family mixes cytoplasmic and nuclear actin-related proteins. Two sources are
      yeast and Candida ARP9, bona fide nuclear SWI/SNF-complex subunits with their own IDA
      nucleus evidence, and one is an unreviewed Trypanosoma protein; but the mouse ortholog
      Actl7a also carries its own experimental nucleus evidence, and mouse ACTL7A is seen
      inside spermatid nuclei by 3D confocal imaging. The term is therefore right. What is
      absent is any demonstrated nuclear function: the reported nuclear roles, namely HDAC
      association and docking on INO80 and SWI/SNF HSA domains, rest on a preprint and
      in-silico modelling. is_active_in asserts activity at this location, which the evidence
      does not reach, and ACTL7A's characterised function is at the acroplaxome, so this is
      non-core; located_in would be the safer qualifier. No specificity upgrade is proposed on
      this particular row, because the donor set is genuinely heterogeneous - a yeast SWI/SNF
      subunit, a Candida homologue, a trypanosome protein and two mammalian ACTL7 proteins - and
      GO:0005634 is the correct least common ancestor of what those donors support. The
      descendant GO:0001673 male germ cell nucleus would fit the mammalian evidence, but it
      would not fit the fungal and protozoan donors, so it belongs on the ortholog-specific ISS
      row if anywhere; see suggested_questions.
    supported_by:
    - reference_id: PMID:36734600
      supporting_text: Our intracellular localization data show ACTL7A to be dynamically
        present within the nucleus and subacrosomal space and later associated with
        postacrosomal regions of developing spermatids.
    - reference_id: PMID:12672658
      supporting_text: T-ACTIN-1 was found in the cytoplasm and T-ACTIN-2 was located in the
        nucleus
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:1343051
        source_label: mouse Actl7a (true ortholog)
        source_status: SUPPORTS_TRANSFER
        comment: Carries its own nucleus EXP/IDA (PMID:12672658, PMID:21278383,
          PMID:36734600) and the more specific GO:0001673 male germ cell nucleus by IDA.
      - source_id: SGD:S000004636
        source_label: S. cerevisiae ARP9
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Nuclear SWI/SNF and RSC complex subunit with nucleus IDA (PMID:11011149); a
          nuclear ARP, not an ACTL7 ortholog, so it supports the source not the transfer.
      - source_id: CGD:CAL0000196900
