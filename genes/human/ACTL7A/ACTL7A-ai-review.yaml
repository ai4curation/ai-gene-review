- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: TAS
  original_reference_id: PMID:10373328
  qualifier: enables
  review:
    summary: >-
      A gene-name-derived annotation that GO's own phylogenetic pipeline has since explicitly
      negated for this clade, and that this review's structure audit independently argues
      against. The defensible level, GO:0005198, is already on the gene.
    action: REMOVE
    reason: >-
      Three independent arguments converge on removal. First, the cited evidence does not exist:
      PMID:10373328 identified ACTL7A and ACTL7B by cDNA selection and genomic sequencing,
      mapped them, and surveyed expression by Northern blot. It contains no biochemistry, no
      localisation and no phenotype; the only structural statement in it is the homology-based
      label actin-like. TAS is not an experimental code, so removing this row overrules no
      curator who read data - it retracts an inference drawn from a gene name. Second, GO's own
      phylogenetic pipeline has ruled against the term for this clade. The cached PAINT record
      for PTHR11937 shows GO:0005200 IBD-supported at the ancestral actin node PTN000940351 from
      conventional actins and Arp2/Arp3, then negated on descent: PTN008986528, the node carrying
      ACTL7A, has GO:0005200 as an IRD with negated set to true, and carries the parent
      GO:0005198 by IBA instead, both rows dated 2025-08-05. That is a deliberate, current,
      gene-covering rejection, and it postdates the whole knock-out and patient-variant
      literature, so it cannot be set aside as a judgement made without that evidence. Third,
      this review's own structure audit argues the same way: the route by which real actins earn
      this term is filament formation, and ACTL7A's inter-protomer interface is 42.3% identical
      to actin's against 93 to 100% for conventional actins, with the ATP-hydrolysis trigger
      His161 replaced by tyrosine. Nothing is lost by removal, because the defensible level of
      the claim, GO:0005198 structural molecule activity, is already annotated to the gene and is
      accepted there as the core molecular function. The independently reviewed paralogue ACTL7B
      removed the same row on the same reasoning, so the pair ends up consistent. Recorded for
      completeness: an earlier round of this review accepted this term and promoted it to the
      core molecular function, arguing that ACTL7A's residence in GO:0033011, a GO:0005856
      descendant, made the specific term apply. That argument is withdrawn - residing in a
      cytoskeletal structure is not the same as being a structural constituent of it. One
      consequence of removal is worth flagging: GO_REF:0000108 uses this molecular-function term
      as the literal WITH/FROM for the GO:0007010 cytoskeleton organization row, so that row
      loses its basis too, which is part of why it is modified to the phenotype-supported
      GO:0030036 rather than left standing.
    supported_by:
    - reference_id: PMID:10373328
      supporting_text: Two novel human actin-like genes, ACTL7A and ACTL7B, were identified by
        cDNA selection and direct genomic sequencing from the familial dysautonomia candidate
        region on 9q31.
    - reference_id: PMID:12672658
      supporting_text: The two deduced amino acid sequences had 60% homology, and they had
        approximately 40% homology with other actins.
    - reference_id: file:human/ACTL7A/ACTL7A-bioinformatics/RESULTS.md
      supporting_text: '* **The ATP-hydrolysis trigger is not retained.** Of the 5 literature-defined catalytic positions ACTL7A keeps 3 (DQEVY); changed: D154->E, H161->Y. Every conventional actin and Arp1/Arp2/Arp3 in the panel keeps all of them.'
    - reference_id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
      supporting_text: 'PTHR11937 PTN008986528 GO:0005200 F IRD true PANTHER:PTN000940351'
    - reference_id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
      supporting_text: 'PTHR11937 PTN000940351 GO:0005200 F IBD false'
