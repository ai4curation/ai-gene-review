- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      The process is right but reached by the wrong route and far too general. The evidenced
      process is actin cytoskeleton organization, from the mouse knock-out's complete and
      spatially restricted loss of subacrosomal F-actin.
    action: MODIFY
    reason: >-
      The WITH/FROM field on this row is not a gene product but the GO term GO:0005200, so
      this is an inter-ontology molecular-function to biological-process inference from the
      gene's own 1999 TAS row, which is itself a name-derived annotation from a
      positional-cloning paper with no functional experiment. The process term therefore
      inherits weak evidence at second hand. Independent evidence supports a more specific
      term: Actl7a knock-out spermatids lose subacrosomal F-actin completely while retaining
      F-actin everywhere else, which is actin cytoskeleton organization, a child of
      GO:0007010. Neither human ACTL7A nor mouse Actl7a currently carries any annotation in
      that branch, so moving this row there fills a real gap rather than duplicating one.
      Whether ACTL7A is itself the filament or nucleates and anchors filaments made by
      conventional actins is explicitly unresolved, which is why the non-committal
      involved_in GO:0030036 is preferred over a polymerisation or nucleation term.
    proposed_replacement_terms:
    - id: GO:0030036
      label: actin cytoskeleton organization
    supported_by:
    - reference_id: PMID:36734600
      supporting_text: The KO spermatids did not lose F-actin in other cellular regions,
        indicating that ACTL7A is not globally required for F-actin formation within
        developing spermatids
    - reference_id: PMID:36734600
      supporting_text: it is not yet clear whether ACTL7A may be the filament-forming actin
        in the acroplaxome, or whether its role is to nucleate, stabilize formation, and/or
        anchor F-actin formed by conventional ARPs to the nuclear surface
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: GO:0005200
        source_label: structural constituent of cytoskeleton (inter-ontology link, not a
          gene product)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The source is the gene's own TAS row citing PMID:10373328, a cloning and
          mapping paper with no functional data, so the inferred process rests on a
          name-based assertion.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21278383
  qualifier: enables
  review:
    summary: >-
      The TES interaction is one of the best-characterised facts about this gene and deserves
      an informative term: ACTL7A's N-terminal extension is a tandem-LIM-domain ligand.
    action: MODIFY
    reason: >-
      The WITH/FROM accession resolves to UniProtKB:Q9UGI8, human testin (TES), a genuine
      partner rather than a screen artefact: the interaction was mapped biochemically to
      ACTL7A residues 28-49 and the LIM2 and LIM3 domains of TES, crystallised as a ternary
      complex with the ENAH EVH1 domain (PDB 2XQN), and abolished by single
      alanine-to-tyrosine substitutions at ACTL7A Ala31 or Ala41. GO:0030274 LIM domain
      binding is a GO:0005515 descendant that states exactly this and replaces an
      uninformative parent. Note that the binding surface is the disordered N-terminal
      extension unique to ACTL7A, not the actin fold.
    proposed_replacement_terms:
    - id: GO:0030274
      label: LIM domain binding
    supported_by:
    - reference_id: PMID:21278383
      supporting_text: The crystal structure of the 1-65(Arp7A)·LIM2-3(Tes)·EVH1(Mena)
        complex reveals that residues 28-49 of Arp7A contact the LIM2-3 domains of Tes.
    - reference_id: PMID:21278383
      supporting_text: The N-terminal 65-residue extension to the actin-like fold of Arp7A
        interacts directly with Tes.
