id: Q9UKV8
gene_symbol: AGO2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AGO2 encodes Argonaute-2, a small-RNA-guided effector of RNA silencing. It binds
  miRNA or siRNA guides and complementary target RNAs in RISC. Its PIWI endoribonuclease activity
  cleaves sufficiently paired targets, while recruitment of TNRC6/GW182-associated effectors represses
  translation and promotes deadenylation-dependent decay without target slicing. AGO2 also accepts
  guides during RISC maturation and directly cleaves selected short precursor hairpins, including
  pre-miR-451, in a Dicer-independent maturation pathway. It acts predominantly in cytoplasmic
  RNPs, with additional nuclear and context-specific neuronal pools. Heterozygous pathogenic variants
  cause a neurodevelopmental disorder through altered RNA-silencing function.'
alternative_products:
- name: '1'
  id: Q9UKV8-1
- name: '2'
  id: Q9UKV8-2
  sequence_note: VSP_037001
