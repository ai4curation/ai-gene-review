      knockdown effects, promoter ChIP, and association with PolII/TBP in human-cell
      experiments. Promoter/guide sequence substitutions support an RNA-guided complex
      mechanism. ChIP and reporter assays do not uniquely distinguish AGO2 sequence-specific
      DNA contact from recruitment through RNA/protein components. Remove the uninformative
      generic term under the binding-term policy, without asserting that the recorded
      interaction is absent. No partner enzymatic activity or unsupported adaptor function
      is substituted.
