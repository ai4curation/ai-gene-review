- term:
    id: GO:0035196
    label: miRNA processing
  evidence_type: NAS
  original_reference_id: PMID:28781232
  review:
    summary: AGO2 supports miRNA processing in the specified molecular or cellular context.
    action: ACCEPT
    reason: AGO2 contributes to production of functional miRNA through guide loading and
      RISC maturation, and as part of experimentally reconstituted
      precursor-processing/loading complexes. Dicer performs canonical RNaseIII cleavage;
      AGO2 binding, guide selection and passenger removal are distinct contributions. This
      general maturation role is shared across human Argonautes and is not justified solely
      by an AGO2-specific precursor pathway (PMID:19966796; PMID:18178619; PMID:23661684).
      PMID:28781232 principally measures mature AGO/GW182 recruitment rather than precursor
      cleavage; the functional maturation judgment is independently grounded in
      PMID:19966796 and PMID:18178619.
    supported_by:
    - reference_id: PMID:19966796
      supporting_text: "RISC assembly and dicing are uncoupled, and ATP greatly \nfacilitates
        RISC loading of small-RNA duplexes."
    - reference_id: PMID:18178619
      supporting_text: "The reconstituted RLC, containing one copy of \neach protein, has the
        dicing, slicing, guide-strand selection, and Ago2-loading \nactivities observed for the
        endogenous RLC."
    - reference_id: PMID:28781232
      supporting_text: miRNA binding increases hAgo's affinity to GW182
