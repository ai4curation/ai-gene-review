- term:
    id: GO:0000340
    label: RNA 7-methylguanosine cap binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  review:
    summary: AGO2 association with cap-containing complexes is established; intrinsic cap
      recognition remains disputed.
    action: UNDECIDED
    reason: PMID:17524464 proposed intrinsic MID-domain cap recognition. PMID:19159466
      challenges the motif structurally, and PMID:21475248 found no selective cap binding by
      the isolated MID domain or active recombinant AGO2 lacking its N-terminal proline-rich
      segment. In contrast, PMID:23409027 shows cap photocrosslinking/proximity in cellular
      AGO2 complexes enhanced by eIF4GI. These assay contexts do not resolve whether AGO2
      itself selectively recognizes the cap or is positioned there by cofactors. Direct
      cap-binding activity remains UNDECIDED; translation repression is independently
      retained.
    supported_by:
    - reference_id: PMID:23409027
      supporting_text: "Using a cap photo-crosslinking method, we show that Ago2 closely associates
        with \nthe cap structure."
    - reference_id: PMID:17524464
      supporting_text: "We propose that Ago2 represses the initiation of mRNA \ntranslation by
        binding to the m(7)G cap of mRNA targets"
    additional_reference_ids:
    - PMID:19159466
    - PMID:21475248
    - PMID:23409027
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniRule:UR000107560
        source_status: UNRESOLVED
        comment: UniRule:UR000107560 is the supplied rule source. Its internal conditions
          and evidence chain were not recovered. The target activity is assessed
          independently from primary AGO2 evidence; a positive target judgment is not a
          claim that this rule was independently validated.
