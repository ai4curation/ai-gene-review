core_functions:
- description: miRNA-guided AGO2 cleaves sufficiently complementary target mRNAs through its
    PIWI catalytic site. This is the endonucleolytic mechanism specified by the current
    GO:0035279 definition; target decay driven by recruited deadenylases is a separate
    activity.
  molecular_function:
    id: GO:0090624
    label: endoribonuclease activity, cleaving miRNA-paired mRNA
  directly_involved_in:
  - id: GO:0035279
    label: miRNA-mediated gene silencing by mRNA destabilization
  in_complex:
    id: GO:0016442
    label: RISC complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15260970
    supporting_text: "Purification of the \nFLAG/HA-epitope-tagged Ago containing complexes from
      different human cell lines \nrevealed that endonuclease activity is exclusively associated
      with Ago2."
- description: siRNA-loaded AGO2 recognizes complementary target mRNA and directly cleaves
    it through the PIWI endoribonuclease active site, executing siRNA-mediated
    endonucleolytic silencing.
  molecular_function:
    id: GO:0070551
    label: endoribonuclease activity, cleaving siRNA-paired mRNA
  directly_involved_in:
  - id: GO:0090625
    label: siRNA-mediated gene silencing by mRNA destabilization
  in_complex:
    id: GO:0016442
    label: RISC complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15260970
    supporting_text: "Exogenously introduced siRNAs also associate with Ago2 for guiding target
      RNA \ncleavage."
- description: AGO2 binds miRNA guides and target RNAs and recruits TNRC6/GW182-associated
    effectors to repress translation and promote poly(A)-tail shortening and subsequent
    decay. AGO2 supplies guide recognition and recruitment; PAN2–PAN3 and CCR4–CAF1 carry
    out deadenylation. P-body association is supported but visible granules are not
    obligatory sites for every silencing event.
  molecular_function:
    id: GO:0035198
    label: miRNA binding
  directly_involved_in:
  - id: GO:0035278
    label: miRNA-mediated gene silencing by inhibition of translation
  - id: GO:0060213
    label: positive regulation of nuclear-transcribed mRNA poly(A) tail shortening
  - id: GO:1900153
    label: positive regulation of nuclear-transcribed mRNA catabolic process,
      deadenylation-dependent decay
  in_complex:
    id: GO:0016442
    label: RISC complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:19324964
    supporting_text: "Ago2 recruits GW182 \nto the 3'-UTR of mRNA to mediate silencing"
  - reference_id: PMID:19838187
    supporting_text: "When tethered to mRNAs, all four human Ago proteins and \nTNRC6C are each
      able to recapitulate the two deadenylation steps."
  - reference_id: PMID:19838187
    supporting_text: "trigger very rapid mRNA decay \nby inducing accelerated biphasic deadenylation
      mediated by Pan2-Pan3 and \nCcr4-Caf1 deadenylase complexes followed by Dcp1-Dcp2 complex-directed
      decapping"
- description: AGO2 accepts small-RNA duplexes, retains the guide strand and releases or
    cleaves the passenger during RISC maturation. Reconstituted Dicer/TRBP/AGO2 complexes
    and cellular pre-RISC assays establish guide loading; canonical Dicer-mediated precursor
    cleavage is a distinct upstream step.
  molecular_function:
    id: GO:0003725
    label: double-stranded RNA binding
  directly_involved_in:
  - id: GO:0070922
    label: RISC complex assembly
  in_complex:
    id: GO:0070578
    label: RISC-loading complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:19966796
    supporting_text: "RISC assembly and dicing are uncoupled, and ATP greatly \nfacilitates RISC
      loading of small-RNA duplexes."
  - reference_id: PMID:19966796
    supporting_text: "central mismatches promote RISC loading, and seed or 3'-mid (guide position\
      \ \n12-15) mismatches facilitate unwinding."
  - reference_id: PMID:18178619
    supporting_text: "The reconstituted RLC, containing one copy of \neach protein, has the dicing,
      slicing, guide-strand selection, and Ago2-loading \nactivities observed for the endogenous
      RLC."
- description: AGO2 directly cleaves the short pre-miR-451 hairpin to an intermediate in a
    Dicer-independent maturation pathway. Recombinant human AGO2 supplies this catalytic
    step; subsequent 3-prime trimming is not attributed to AGO2. RNA endonuclease activity
    is used here because the substrate is a precursor hairpin, outside the mRNA substrates
    specified by the two target-slicing molecular functions.
  molecular_function:
    id: GO:0004521
    label: RNA endonuclease activity
  directly_involved_in:
  - id: GO:0031054
    label: pre-miRNA processing
  supported_by:
  - reference_id: PMID:20448148
    supporting_text: Incubation of human Ago2 (hAgo2) with pre-miR-451 but not pre-miR-430 resulted in a sharp 30-nt band corresponding with the predicted slicer cleavage product of miR-451 (Fig. 2B).
proposed_new_terms: []
suggested_questions:
- question: Does AGO2 itself recognize the mRNA cap selectively in a defined physiological
    complex, or do cap-proximity assays primarily report positioning by initiation factors
    and TNRC6-associated partners?
- question: What specific AGO2 action underlies the P-body assembly assertion in GO-CAM
    653b0ce600001283, given the separation between granule occupancy, depletion phenotypes
    and assembly mechanisms?
- question: In promoter-associated AGO2 complexes, which component makes the
    sequence-specific DNA contact and what contribution is made by promoter-associated RNA?
- question: How much does recombinant AGO2 inhibition of purified Dicer reflect
    protein-contact-mediated regulation versus substrate competition, and does it occur in
    endogenous loading complexes?
- question: What experiments underlie the historical EIF2C translation-initiation
    assertions, and which protein/construct and molecular step were actually tested?
suggested_experiments:
- description: Reconstitute cap-containing target complexes with full-length AGO2, defined
    guide RNA and selected eIF4GI/eIF4E/TNRC6 components; compare cap competition,
    site-specific crosslinking and repression while controlling guide loading and folding.
  experiment_type: biochemical reconstitution
  hypothesis: Selective cap recognition by AGO2 can be separated from recruitment into a
    cap-proximal complex.
- description: Compare purified Dicer inhibition by AGO2 variants that separate Dicer
    interaction from RNA binding, with substrate titration and physiological loading-complex
    components.
  experiment_type: enzyme kinetics and separation-of-function mutagenesis
  hypothesis: Protein-contact-dependent inhibition can be distinguished from substrate
    sequestration in the recombinant assay.
- description: Use endogenous AGO2 tagging, depletion/rescue and time-resolved granule
    imaging to distinguish entry into existing P-bodies from a direct contribution to their
    assembly.
  experiment_type: cell imaging and functional rescue
  hypothesis: AGO2 granule occupancy and assembly contribution can be experimentally
    separated.
