- term:
    id: GO:0033962
    label: P-body assembly
  evidence_type: IDA
  original_reference_id: PMID:31400113
  review:
    summary: The curated P-body assembly assignment requires clarification of AGO2's
      executing step.
    action: UNDECIDED
    reason: The abstract-only cache was supplemented by externally read PMC6755100
      Results/Figures 3–5 and 8. AGO2 depletion did not reduce visible P-body counts in the
      tested cells, whereas GW182/DDX6 depletion did; AGO2 also localized to granules. This
      is evidence against AGO2 being necessary for the measured assembly endpoint, not a
      direct demonstration that AGO2 never participates in assembly. GO-CAM 653b0ce600001283
      explicitly assigns AGO2 to GO:0033962 with IDA from this paper. The UNDECIDED judgment
      defers to that curated source assertion pending identification of the specific
      assembly action, as raised in suggested_questions. Granule occupancy alone does not
      establish assembly, and no redundant mechanism is assumed.
    supported_by:
    - reference_id: PMID:31400113
      supporting_text: "the important roles of GW182 and DDX6, but not Dicer, \nAgo2 and DCP1A,
        in PB formation"
