- term:
    id: GO:0031054
    label: pre-miRNA processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: AGO2 participates in precursor conversion; the precise ancestral processing
      mechanism remains unresolved.
    action: ACCEPT
    reason: 'The cached PAINT IBD places GO:0031054 at PTN000527278, with AGO2 itself among the
      legitimate experimental descendant sources. Human HEK293F extract assays in PMID:17671087
      Figure 1 show increased pre-let-7 conversion after AGO2 overexpression; the same Results
      report an AGO1 effect without displaying those data. These findings support a processing
      contribution without equating every Argonaute mechanism. Independent primary evidence establishes
      direct human AGO2 precursor cleavage: recombinant hAGO2 cleaved the short pre-miR-451 hairpin
      to a 30-nt intermediate in PMID:20448148 Figure 2B. Subsequent 3-prime trimming is a separate
      step. This substrate-specific reaction is distinct from Dicer cleavage of canonical pre-miRNAs
      and from guide loading. The target assertion is accepted, while the exact molecular contribution
      ancestral to all descendants is not independently reconstructed; AGO2-specific slicing alone
      does not validate that ancestral mechanism.'
    supported_by:
    - reference_id: PMID:17671087
    - reference_id: PMID:20448148
      supporting_text: Incubation of human Ago2 (hAgo2) with pre-miR-451 but not pre-miR-430 resulted in a sharp 30-nt band corresponding with the predicted slicer cleavage product of miR-451 (Fig. 2B).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000527278
        source_status: UNRESOLVED
        comment: The cached PTHR22891 table verifies the GO:0031054 IBD at PTN000527278 and
          includes AGO2 among experimental descendant evidence. Target self-evidence is
          legitimate. The precursor-conversion mechanism shared across the entire ancestral
          clade was not independently reconstructed. Human target processing is supported by
          PMID:17671087 and PMID:20448148, but AGO2-specific slicing is not proof that every
          descendant inherited that same mechanism. No target-specific loss or placement
          error is asserted.
    additional_reference_ids:
    - PMID:17671087
    - PMID:20448148
