id: Q9NVR5
gene_symbol: DNAAF2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF2, also called KTU, is a cytoplasmic dynein assembly factor that helps build outer and
  inner axonemal dynein arms before their delivery to motile cilia and flagella. It associates with other
  assembly factors and chaperone machinery, supporting heavy-chain stability and incorporation into dynein
  complexes. A cytosolic pool exchanges with dynamic dynein axonemal particles in vertebrate multiciliated
  cells. Loss of DNAAF2 disrupts respiratory-ciliary and sperm motility and causes primary ciliary dyskinesia.
alternative_products:
- name: '1'
  id: Q9NVR5-1
  description: The full-length natural product contains 837 residues.
- name: '2'
  id: Q9NVR5-2
  sequence_note: 'VSP_008390: deletion of canonical residues 622–669; 789 residues.'
  description: This natural splice product retains the N-terminal region and lacks an internal 48-residue
    segment. Its functional equivalence to the full-length product is unresolved.
