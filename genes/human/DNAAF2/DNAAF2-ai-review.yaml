suggested_questions:
- question: How do the two natural DNAAF2 products differ in abundance, localization and dynein-arm assembly
    activity?
- question: Which native DNAAF2 assemblies perform heavy-chain stabilization, and when does the DYX1C1
    heterodimer associate with Hsp70, SPAG1 or RUVBL proteins?
- question: Do endogenous human DNAAF2 basal-body-associated and nearby apical pools overlap DynAPs, or
    mark distinct stages of dynein-arm assembly and delivery?
- question: How closely does endogenous human DNAAF2 DynAP dynamics match the tagged Xenopus Ktu observations?
suggested_experiments:
- hypothesis: Natural DNAAF2 products may differ in assembly-factor recruitment without losing the entire
    preassembly role.
  description: Compare accession-verified products at matched expression in deficient human multiciliated
    cells, measuring dynein heavy-chain incorporation, partner association and ciliary motility with rescue
    and fraction-purity controls.
  experiment_type: Product-resolved rescue and complex assembly
- hypothesis: DNAAF2 couples a dynamic chaperone assembly to heavy-chain incorporation.
  description: Combine endogenous tagging, quantitative native-complex purification and defined-component
    reconstitution to separate direct contacts, transient co-chaperone associations and heavy-chain stabilization
    from downstream motility.
  experiment_type: Native and reconstituted assembly analysis
