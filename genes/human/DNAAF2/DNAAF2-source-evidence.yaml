followup_2026_10_17:
  localization:
    source_19052621: Medaka renal-tubule Results and Figure 1q,r show apical Ktu near gamma-tubulin-positive
      structures, but mostly without colocalization. Human Figure 2d separates cytoplasm from cilia only;
      unsuccessful human respiratory immunohistochemistry does not negate the medaka experiment.
    hpa: HPA002894 records basal body in ASC52telo, serum-starved hTERT-RPE1 and RPTEC/TERT1, with cilia
      and basal-body channels specified. Cytosol is also positive. The gene-level ICC/IF reliability is
      approved; no independent image-pixel interpretation is claimed.
    replacement_scope: Basal body is removed from all three cytoplasm replacement lists. It is represented
      once as a new HPA-sourced location assertion, separate from the imported source claims.
    pericentriolar_material: Not asserted; proximity with mostly absent gamma-tubulin colocalization does
      not establish membership in the microtubule-nucleating network.
    core_scope: Cytosol and DynAP remain the functional assembly pools; basal-body detection alone does
      not establish where the assembly activity occurs or a new trafficking function.
    supersedes: This follow-up supersedes the preceding cross-source replacement placement. The 22 imported
      source objects and actions remain unchanged; one distinct HPA location assertion is appended.
    public_sources:
    - https://www.proteinatlas.org/ENSG00000165506.xml
    - https://www.ebi.ac.uk/QuickGO/term/GO:0036064
    - https://www.ebi.ac.uk/QuickGO/term/GO:0000242
  chaperone_support: PMID19052621 Figure 4b,d and extract-IP/GST-pull-down Methods provide mouse Hsp70
    association. PMID29844425 Figures 4b and 5b provide human DNAAF2-DYX1C1-a LUMIER/SILAC association.
    Neither establishes purified human folding activity or a stable R2SD assembly. The positive short
    anchor is in annotation support, alongside the preserved R2SD limit.
  cfap300: The companion PMID29727693 Results and Figure S12 plus the UniProt Q9NVR5 subunit annotation
    corroborate the positive pair. They do not establish an identifier error in the original PMID29727692
    source; no formal citation replacement is asserted. The curation attribution question remains in notes.
  quotation_scope: Two new short exact anchors totaling 15 words from PMID19052621 occur once in annotation
    support. All inherited quotations remain unchanged; these source locators and paraphrases are not
    additional verbatim source text.
