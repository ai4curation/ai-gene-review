knowledge_gaps:
- gap_statement: 'ANKRD12''s molecular activity is unestablished: a co-regulator role rests on interaction
    and overexpression data only.'
  boundary: ANKRD12 is nuclear, binds the PAS region of p160 coactivators and the coactivator ADA3, and
    when overexpressed represses ADA3-dependent nuclear-receptor reporters. No endogenous perturbation
    of ANKRD12 has been reported, and its target genes and physiological role are unknown. Its paralog
    ANKRD11 is proposed in this repository for GO:0003712 transcription coregulator activity, but that
    rests on ANKRD11 knockdown data that ANKRD12 lacks, so no coregulator term is proposed here.
  gap_kind:
