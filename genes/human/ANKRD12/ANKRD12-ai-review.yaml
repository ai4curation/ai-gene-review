- id: PMID:18377363
  title: Ankyrin repeats-containing cofactors interact with ADA3 and modulate its co-activator function.
  findings:
  - statement: ANCO-1 and ANCO-2 are transcriptional co-regulators.
    supporting_text: 'ANCO (ankyrin repeats-containing cofactor)-1 and ANCO-2 are a family of unique transcriptional
      co-regulators with dual properties: they interact with both the co-activators and the co-repressors'
  - statement: Both ANCO-1 and ANCO-2 interact with ADA3.
    supporting_text: we provide new evidence to suggest further that ANCO-1 and ANCO-2 also interact with
      the co-activator ADA3
  - statement: ANCO-2 represses ADA3 co-activation in a reporter assay.
    supporting_text: Furthermore, a transient reporter assay revealed that both ANCO-1 and ANCO-2 repress
      ADA3-mediated transcriptional co-activation on nuclear receptors, whereas ANCO-1 stimulated p53-mediated
      transactivation.
  - statement: P/CAF complex subunits co-localize with ANCO-1 nuclear dots.
    supporting_text: Several subunits of the P/CAF {p300/CBP [CREB (cAMP-response-element-binding protein)-binding
      protein]-associated factor} complex, including ADA3, ADA2alpha/beta and P/CAF, showed co-localization
      with ANCO-1 nuclear dots
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The ADA3 interaction is reported for both ANCO-1 and ANCO-2; the C-terminal
      domain mapping and the P/CAF nuclear-dot co-localization are shown for ANCO-1. ANCO-2 also represses
      ADA3 co-activation in a reporter assay.
- id: file:human/ANKRD12/ANKRD12-deep-research-affinage.md
  title: Affinage mechanistic annotation for ANKRD12 (human)
  findings:
  - statement: ANKRD12 is otherwise uncharacterized.
    supporting_text: Beyond this single interaction and its functional consequence on nuclear receptor
      reporters, no further mechanistic detail has been characterized in the available corpus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Trust gates clear. Its ADA3-binding and reporter-repression claims hold for ANCO-2 (PMID:18377363).
      Its domain-mapping and P/CAF co-localization details are shown for ANCO-1, which its own dated-findings
      row notes.
