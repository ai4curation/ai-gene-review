description: ANKRD12 (ankyrin repeat domain-containing 12, also called ANCO-2) is a large nuclear ankyrin-repeat
  protein, paralogous to ANKRD11 (ANCO-1). The two are described as transcriptional co-regulators that
  interact with both co-activators and co-repressors. ANKRD12 binds the PAS region of the p160 nuclear
  receptor coactivators and the coactivator ADA3, and in reporter assays it represses ADA3-mediated co-activation
  of nuclear receptor targets. Its endogenous targets and physiological role are unknown.
