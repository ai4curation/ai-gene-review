description: ANKRD12 (ankyrin repeat domain-containing 12, also called ANCO-2) is a large nuclear ankyrin-repeat
  protein, paralogous to ANKRD11 (ANCO-1). The two are described as transcriptional co-regulators that
  interact with both co-activators and co-repressors. In reporter assays ANKRD12 represses ADA3-mediated
  co-activation of nuclear receptor targets. Little else is known about its function.
