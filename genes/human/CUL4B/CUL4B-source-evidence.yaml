interpretation_limits:
- The single core describes performed CRL4B scaffolding; no autonomous ubiquitin-transfer catalysis
  or new process annotation is added.
- CUL4A-centered papers are not used as evidence that CUL4B lacks the function. Source-specific
  uncertainty is preserved while independently established B-complex membership remains positive.
- GO:0070914 denotes UVDE/UVER incision and is distinguished from the demonstrated mammalian
  nucleotide-excision-repair contribution.
- The adipogenesis source distinguishes WDTC1-dependent suppression from confounded, opposing
  CUL4A/B knockdown phenotypes.
- 'PMID:30018425 supports shared CUL4A/B licensing and phase regulation: CUL4B-specific recruitment
  and association are measured, but individual depletion has no phase-distribution effect; combined
  depletion gives the reported phenotype. Origin ChIP is CUL4A-specific. Rows106/154 retain
  contextual NC with this separate support; the original16861906 B assay remains uninspected.'
- GO:0160072 describes performed assembly through binding. It is retained as the core molecular
  function while the historical contributes_to qualifier remains literal in its original annotation;
  no autonomous ubiquitin-transfer activity is inferred.
followup_evidence:
  chromatin:
    reference: PMID:23238014
    url: https://doi.org/10.1016/j.ccr.2012.10.024
    scope: Abstract-only support for CRL4B H2AK119 monoubiquitination and PRC2-associated repression.
      The single performed scaffold core includes GO:0040029; no autonomous ubiquitin transfer
      or equal activity of all three products is asserted. The original DCAF13, DNMT3A and PHGDH
      source judgments remain separate.
  urinary_exosome:
    reference: PMID:19056867
    table_url: http://dir.nhlbi.nih.gov/papers/lkem/exosome/
    locator: CUL4B / cullin 4B / NP_003579; one peptide; table reference 2 = Gonzales et al.,
      PMID:19056867.
    methods: Pooled urine from eight healthy volunteers; differential centrifugation and mass
      spectrometry. The authors manually checked single-peptide spectra. This is detection in
