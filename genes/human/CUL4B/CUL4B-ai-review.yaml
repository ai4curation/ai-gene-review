core_functions:
- description: CUL4B scaffolds DDB1-associated RING ubiquitin ligases, positioning substrate-recognition
    and catalytic components for protein ubiquitination. These complexes support proteasomal
    substrate turnover, nondegradative H2AK119 monoubiquitination with PRC2-associated transcriptional
    repression, and damaged-chromatin recognition during nucleotide-excision repair.
  molecular_function:
    id: GO:0160072
    label: ubiquitin ligase complex scaffold activity
  directly_involved_in:
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - id: GO:0006289
    label: nucleotide-excision repair
  - id: GO:0040029
    label: epigenetic regulation of gene expression
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0031465
    label: Cul4B-RING E3 ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:25970626
  - reference_id: PMID:22118460
    supporting_text: mobility of the ligase arm creates a defined ubiquitination zone
  - reference_id: PMID:22334663
    supporting_text: "ubiquitination of \nH2A Lys-119/Lys-120 is necessary for destabilization\
      \ of nucleosomes"
  - reference_id: PMID:23238014
    supporting_text: "CRL4B \npossesses an intrinsic transcription repressive activity by promoting\
      \ H2AK119 \nmonoubiquitination."
suggested_questions:
- question: Which N-terminally distinct CUL4B products assemble active ligases and enter the
    nucleus under physiological conditions?
- question: Which source-specific developmental, stress, epigenetic and miRNA phenotypes have
    direct CUL4B evidence rather than an unresolved CRL4-family or CUL4A attribution?
- question: What CUL4B-specific mechanism reconciles the WDTC1 complex association with the
    opposing, proliferation-confounded adipogenesis phenotypes in the original cullin knockdown
    experiment?
- question: Can the unavailable ARBA00085920 rule and the nonmatching ARBA00026330 branch be
    reconciled with the original annotation release while preserving the independently supported
    CUL4B complex and nuclear location?
status: DRAFT
