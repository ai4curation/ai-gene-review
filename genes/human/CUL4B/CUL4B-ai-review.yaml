id: Q13620
gene_symbol: CUL4B
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CUL4B is a cullin scaffold that organizes DDB1-associated RING E3 ubiquitin ligases.
  It connects substrate-receptor assemblies to RBX1-containing catalytic machinery, supporting
  substrate ubiquitination and proteasomal turnover. CRL4B also supports nondegradative H2AK119
  monoubiquitination and cooperates with PRC2 in repressive chromatin regulation. CUL4B-containing
  DDB2 complexes participate in damaged-DNA recognition and nucleotide-excision repair. CUL4B
  is enriched in the nucleus, with context-dependent cytoplasmic pools, and shares some functions
  with CUL4A while also assembling distinct regulatory complexes. Alternative products differ
  at the N terminus, including the nuclear-localization region.
