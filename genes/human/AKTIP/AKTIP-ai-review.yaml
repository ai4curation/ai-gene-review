# Suggested new annotations based on deep research
- term:
    id: GO:0000723
    label: telomere maintenance
  evidence_type: IMP
  original_reference_id: PMID:26110528
  review:
    summary: AKTIP supports telomere maintenance as a shelterin-associated replication factor.
    action: NEW
    reason: Direct association with shelterin and replication proteins, impaired PCNA recruitment
      and telomere-replication defects establish a structural contribution, beyond necessity alone.
      This proposal is independently supported by primary work, not inferred from a gap in other
      participants' annotations. No AKTIP entry was found in the cached GO-CAM index.
    supported_by:
    - reference_id: PMID:26110528
      supporting_text: 'AKTIP physically interacts with PCNA and

        the RPA70 DNA replication factor.'
    - reference_id: PMID:26110528
      supporting_text: 'AKTIP/Ft1 works in concert with TRF1 to facilitate telomeric DNA

        replication.'
