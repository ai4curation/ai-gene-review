    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      AKTIP localizes to the nucleus with enrichment at the nuclear rim in interphase,
      showing
      partial colocalization with lamins. In S phase, it transiently associates
      with telomeres
      (5-25% colocalization with TRF1 in asynchronous cells) (file:human/AKTIP/AKTIP-deep-research-falcon.md).
    action: ACCEPT
    reason: >-
      Nuclear localization is well-supported by multiple primary studies demonstrating
      nuclear rim
      enrichment, lamin interactions, and telomeric associations. The IBA annotation
      is consistent
      with the literature.
    additional_reference_ids:
    - file:human/AKTIP/AKTIP-deep-research-falcon.md
    supported_by:
    - reference_id: file:human/AKTIP/AKTIP-deep-research-falcon.md
      supporting_text: "Interphase: nuclear rim enrichment in puncta; intranuclear
        foci partially overlapping lamins; detergent-resistant nuclear signals"

- term:
    id: GO:0061631
    label: ubiquitin conjugating enzyme activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: AKTIP lacks the catalytic cysteine required for the E2 thioester-transfer reaction.
    action: REMOVE
    reason: The live GO:0061631 definition requires thioester-linked ubiquitin transfer involving
      cysteine sulfhydryl groups. PMID:26110528 identifies loss of the E2 catalytic cysteine,
      and PMID:18799622 characterizes FTS as an inactive E2 variant. The verified tree places
      AKTIP leaf PTN002545715 beneath the catalytic IBD PTN002514495. Thus target-specific catalytic-apparatus
      divergence, rather than an erroneous outside-clade claim, contradicts this intrinsic activity.
      It does not refute participation through a noncatalytic complex.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN002514495
        source_label: PTN002514495
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Live PANTHER v19 PTHR24068 tree connects root PTN002514495 to Q9H8T0 leaf PTN002545715.
          Newer local PAINT uses family PTHR24067 for the same persistent node. Target catalytic-cysteine
          replacement refutes this reaction; the NOT at PTN000630367 is not on the target path.
          See AKTIP-paint-lineage.json.
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
    supported_by:
    - reference_id: PMID:26110528
      supporting_text: AKTIP is a UEV protein that contains a UBC domain lacking the catalytic
        cysteine that mediates ubiquitin transfer.
- term:
    id: GO:0070534
    label: protein K63-linked ubiquitination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Retain the inherited K63-ubiquitination process as non-core; AKTIP-specific chain-assembly
      machinery remains unestablished.
    action: KEEP_AS_NON_CORE
    reason: The independently checked PAINT path places human Q9H8T0 at leaf PTN002545715 beneath
      IBD PTN000630262, through AKTIP subfamily node PTN004661315. The IBD includes experimentally
      characterized UBE2N descendants; the K63-negative IKR at PTN000630296 lies off the target
      path. The OpenScientist report did not reconstruct this ancestry, and its pairwise-identity/CDD
      and missing-interaction arguments do not demonstrate loss. Absence of the catalytic cysteine
      refutes intrinsic E2 chemistry but not noncatalytic process participation. PMID:36516775
      Figure 3 shows altered ERalpha polyubiquitination and CAND1/CUL2 interactions after AKTIP
      depletion, but does not establish K63 linkage or the proposed ligase-activity mechanism.
      That study therefore provides context, not direct confirmation of this exact process. Retain
      the curated phylogenetic inference without promoting it to a proven human core mechanism.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000630262
        source_label: PTN000630262
        source_status: SUPPORTS_TRANSFER
        comment: Confirmed positive IBD-to-target descent in live v19 PTHR24068; same PTNs occur
          in the newer local PTHR24067 slice. Neither K63 IKR PTN000630296 nor transferase IRD
          PTN000630367 is on the target path. The report supplies no target-specific loss of noncatalytic
          participation.
    supported_by:
    - reference_id: file:human/AKTIP/AKTIP-hypotheses/noncatalytic-k63-ubiquitination-and-lesion-bypass/openscientist.md
      supporting_text: Absence of interactome coverage cannot fully exclude a transient/condition-specific
        scaffold role.
    - reference_id: PMID:36516775
      supporting_text: The mechanism underpinning these altered protein interactions remains to
        be elucidated.
- term:
    id: GO:0006301
    label: DNA damage tolerance
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Retain the ancestral DNA-damage-tolerance inference as non-core while distinguishing
      it from demonstrated telomere-replication support.
    action: KEEP_AS_NON_CORE
    reason: QuickGO defines GO:0006301 as bypass of single-stranded DNA lesions during replication
      without removing the damage. PMID:26110528 Figures 6-7 establish PCNA/RPA70 association,
      PCNA recruitment and TRF1-linked telomere-replication effects, not a defined lesion-bypass
      readout. Nevertheless, the actual positive IBD at PTN000630262 is ancestral to Q9H8T0 leaf
      PTN002545715, and the DNA-damage-tolerance IKR at PTN000630296 is on another branch. The
      report mistakes pairwise subfamily separation for exclusion from the source clade and does
      not establish target-specific loss. Preserve the inherited process as non-core; the human
      TLS/template-switch mechanism remains a follow-up question. Catalytic inactivity alone cannot
      exclude a structural or cofactor contribution to this BP.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000630262
        source_label: PTN000630262
        source_status: SUPPORTS_TRANSFER
        comment: Both positive source-node placement and human target descent are verified. The
          source IBD includes UBE2N ortholog experiments; the report does not show that AKTIP
          lies outside the inferred ancestral clade. PTN000630296 IKR is not an ancestor. Human
          mechanistic specificity remains unestablished.
    supported_by:
    - reference_id: PMID:26110528
      supporting_text: GST pull down experiments using AKTIP-GST and 293T cell extracts revealed
        that AKTIP precipitates both PCNA and RPA70
    - reference_id: file:human/AKTIP/AKTIP-hypotheses/noncatalytic-k63-ubiquitination-and-lesion-bypass/openscientist.md
      supporting_text: Absence of interactome coverage cannot fully exclude a transient/condition-specific
        scaffold role.
