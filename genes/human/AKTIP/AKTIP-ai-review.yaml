- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      AKTIP is a core component of the FHF (FTS-Hook-FHIP) complex that links cytoplasmic
