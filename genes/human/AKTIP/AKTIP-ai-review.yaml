- id: file:human/AKTIP/AKTIP-uniprot.txt
  title: AKTIP-uniprot.txt evidence for AKTIP
  findings: []
- id: PMID:26110528
  title: AKTIP/Ft1, a New Shelterin-Interacting Factor Required for Telomere Maintenance.
  findings:
  - statement: AKTIP lacks the catalytic cysteine but directly associates with shelterin and
      replication factors to facilitate telomere replication.
    supporting_text: AKTIP is a UEV protein that contains a UBC domain lacking the catalytic
      cysteine that mediates ubiquitin transfer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full Results and Methods checked: Figure 5 purified TRF interactions, Figure
      6 PCNA/RPA70 pull-down from cell extracts and PCNA recruitment, Figure 7 TRF1 ChIP/BrdU.
      These demonstrate replication-associated roles; the tested readouts do not specifically
      establish lesion bypass or K63 chains.'
- id: PMID:34449766
  title: AKTIP interacts with ESCRT I and is needed for the recruitment of ESCRT III subunits
    to the midbody.
  findings:
  - statement: AKTIP participates structurally in the ESCRT machinery and recruits abscission
      factors at the midbody.
    supporting_text: 'AKTIP is a component of the ESCRT I module and functions in the recruitment
      of

      ESCRT III components required for abscission.'
- id: PMID:36516775
  title: AKTIP loss is enriched in ERα-positive breast cancer for tumorigenesis and confers
    endocrine resistance.
  findings:
  - statement: AKTIP-dependent protein turnover is context-specific and linked to CAND1/cullin
      regulation; it does not itself establish a K63 chain-assembly or DNA-lesion-bypass function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full Figure 3/S5 results and limitations checked: AKTIP depletion reduces
      ERalpha polyubiquitination, CAND1 depletion reverses that effect, and CUL2/CAND1/substrate
      interactions change. No K63 linkage is established; authors explicitly require validation
      of the proposed CUL2 activity mechanism. This context supports a noncatalytic ubiquitination-related
      role without proving the disputed exact BP.'
- id: PMID:18284681
  title: hMMS2 serves a redundant role in human PCNA polyubiquitination.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full human and mouse experiments checked. MMS2 loss and combined MMS2/UEV1A
      depletion preserve PCNA polyubiquitination under the tested conditions, while UBC13/RAD18
      depletion reduces it. The uncharacterized compensating activity is not identified as AKTIP;
      this is contextual evidence about catalytic versus noncatalytic subunits, not an AKTIP
      assay.
- id: file:human/AKTIP/AKTIP-hypotheses/noncatalytic-k63-ubiquitination-and-lesion-bypass/openscientist.md
  title: 'AKTIP noncatalytic K63 ubiquitination and lesion bypass: focused OpenScientist report'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Read the full report, citation index, and HTML/PDF report artifacts. Correctly
      distinguishes missing E2 catalytic cysteine and telomere-replication assays from lesion-bypass
      assays. Its proposed process refutation is not established: actual PAINT descent includes
      PTN000630262, experimentally seeded by UBE2N and orthologs, and its negative assertions
      are on other branches. Pairwise sequence identities, a distinct CDD model and missing
      IntAct partners do not demonstrate process loss. The artifacts contain rendered reports,
      not alignment code or raw interaction outputs. Independent PMID:36516775 supports a noncatalytic
      ubiquitination-related context but neither specifies K63 linkage nor proves the proposed
      CUL2 activity mechanism.'
