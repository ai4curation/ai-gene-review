  review:
    summary: Mark calcium channel activity as unsupported for PKD1L2.
    action: MARK_AS_OVER_ANNOTATED
    reason: calcium channel activity is propagated from generic family or domain information, but available
      PKD1L2 evidence does not establish an active calcium channel or calcium-transport role.
    supported_by:
    - reference_id: file:human/PKD1L2/PKD1L2-notes.md
      supporting_text: the well-characterized channel activities are in PKD2, PKD2L1, and the PKD1L3/PKD2L1
        heteromer, while PKD1L2 has no comparable direct calcium-channel or mechanotransduction evidence.
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003915
  review:
    summary: Mark calcium ion binding as unsupported for PKD1L2.
    action: MARK_AS_OVER_ANNOTATED
    reason: calcium ion binding is an InterPro2GO projection from the generic polycystin domain; available
      PKD1L2 evidence does not establish that the domain binds Ca(2+) in this receptor-like protein.
    supported_by:
    - reference_id: file:human/PKD1L2/PKD1L2-notes.md
      supporting_text: IPR003915-derived `calcium ion binding`, however, should not be kept as evidence that the
        poorly characterized PKD1L2 protein itself binds calcium.
