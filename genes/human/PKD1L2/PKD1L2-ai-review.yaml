gene_symbol: PKD1L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PKD1L2 encodes a large PKD1-like multi-pass membrane protein with receptor-like extracellular domains.
  It is predicted to reside in membranes and may couple through heterotrimeric G proteins, but the direct signaling
  or channel output of the human protein remains poorly characterized.'
