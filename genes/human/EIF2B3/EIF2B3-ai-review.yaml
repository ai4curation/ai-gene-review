- term:
    id: GO:0008135
    label: translation factor activity, RNA binding
  evidence_type: IDA
  original_reference_id: PMID:10900014
  qualifier: contributes_to
  review:
    summary: Human EIF2B gamma supports HCV-IRES translation, but its contribution to the RNA-binding
      function of the eIF2B complex remains unresolved.
    action: UNDECIDED
    reason: The imported contributes_to relation permits participation in a molecular function executed
      by the eIF2B complex; it does not require an isolated gamma subunit to bind RNA. PMID:10900014 establishes
      human EIF2B gamma-dependent HCV-IRES translation and cites PMID:1647211 for earlier EMCV-IRES binding.
      The authenticated abstract of that earlier paper reports positive RNA competition in rabbit reticulocyte
      lysates and binding capacity attributed to the combined designation eIF-2/2B. Its full Methods and
      Results remain unavailable, so the factor preparation, direct RNA-contacting entity and gamma contribution
      are unresolved; the designation alone does not establish a mixed preparation. The current human
      knockdown experiments do not distinguish a gamma contribution required for RNA binding from its
      exchange-factor or assembly role. Retain the positive complex-level possibility as UNDECIDED rather
      than declaring RNA binding absent or replacing the molecular function. The separate EIF2 gamma experiments
      and ribozyme-mediated RNA cleavage do not measure EIF2B gamma RNA contact.
      The current GO hierarchy does not entail this RNA-binding activity from GO:0003743.
      QuickGO records deletion of the GO:0003743 is_a GO:0008135 relation on 2025-02-12;
      both now have GO:0180051 as an ancestor. Their current is_a ancestor sets and the
      dated relation history are preserved in EIF2B3-evidence/ontology-review.json.
      Thus accepting contributes_to translation initiation factor activity does not
      settle the distinct RNA-binding claim. The source-specific access limitation remains.
    supported_by:
    - reference_id: PMID:10900014
    - reference_id: PMID:1647211
