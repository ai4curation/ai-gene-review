id: Q9NR50
gene_symbol: EIF2B3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2B3 encodes the gamma subunit of the cytosolic eukaryotic translation initiation factor
  eIF2B. Gamma associates with the catalytic epsilon subunit and helps assemble the multisubunit exchange
  factor. The complex releases GDP from eIF2, allowing GTP to bind and recycling eIF2 for another round
  of translation initiation. Regulation of eIF2B by phosphorylated eIF2alpha couples protein synthesis
  to cellular stress responses.
