  original_reference_id: PMID:18445686
  qualifier: located_in
  review:
    summary: Spindle (IDA). APC7 is seen on the spindle and on cytoplasmic microtubules; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: UniProt records, from PMID:18445686, that APC7 localizes to the spindle in metaphase and to
      cytoplasmic microtubules in interphase [file:genes/human/ANAPC7/ANAPC7-uniprot.txt "Note=Localizes
      to spindle during metaphase and to cytoplasmic"]. That screen targeted nuclear proteins acting on
      the mitotic spindle [PMID:18445686 "An important subset of mitotic microtubule-binding proteins
      localises to the nucleus in interphase and essentially contributes to spindle formation and function
      after nuclear envelope breakdown."]. These are locations of the APC/C, not APC7 functions.
