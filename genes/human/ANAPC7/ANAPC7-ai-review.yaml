- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0090
  review:
    summary: Cytoskeleton (IEA). APC7 is seen on the spindle and on cytoplasmic microtubules; kept as
      non-core.
    action: KEEP_AS_NON_CORE
    reason: UniProt records, from PMID:18445686, that APC7 localizes to the spindle in metaphase and to
      cytoplasmic microtubules in interphase [file:genes/human/ANAPC7/ANAPC7-uniprot.txt "Note=Localizes
      to spindle during metaphase and to cytoplasmic"]. That screen targeted nuclear proteins acting on
      the mitotic spindle [PMID:18445686 "An important subset of mitotic microtubule-binding proteins
      localises to the nucleus in interphase and essentially contributes to spindle formation and function
      after nuclear envelope breakdown."]. These are locations of the APC/C, not APC7 functions. GO:0005856
      cytoskeleton is an ancestor of GO:0015630 microtubule cytoskeleton, which this review also keeps,
      so it adds nothing.
    supported_by:
    - reference_id: file:genes/human/ANAPC7/ANAPC7-uniprot.txt
      supporting_text: Note=Localizes to spindle during metaphase and to cytoplasmic
- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: Regulation of mitotic cell cycle (NAS, review). True of the APC/C, but APC7 loss does not
      delay mitosis; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: In human cells, loss of APC7 did not lengthen mitosis [PMID:34942119 "Loss of APC7 failed
      to prolong the period between nuclear envelope breakdown (NEBD) and anaphase (length of mitosis)
      or the frequency of lagging chromosomes"], so mitotic roles are carried by the complex rather than
      depending on APC7.
    supported_by:
    - reference_id: PMID:34942119
      supporting_text: Loss of APC7 failed to prolong the period between nuclear envelope breakdown (NEBD)
        and anaphase (length of mitosis) or the frequency of lagging chromosomes
- term:
    id: GO:0007420
    label: brain development
  evidence_type: IMP
  original_reference_id: PMID:34942119
  qualifier: involved_in
  review:
    summary: Brain development (IMP). APC7 loss causes an intellectual disability syndrome; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Loss of APC7 causes intellectual disability [PMID:34942119 "Here, we report an intellectual
      disability syndrome caused by the loss of APC7, a core component of the E3 ubiquitin ligase anaphase
      promoting complex (APC)."], and APC7 drives Ki-67 degradation in neurons [PMID:34942119 "Collectively,
      our findings reveal that APC7 operates in the context of the E3 ubiquitin ligase Cdh1-APC to drive
      ubiquitination and degradation of Ki-67 primarily in neuronal heterochromatin in the brain."]. APC7's
      direct role is substrate recruitment to the APC/C; brain development is the downstream outcome.
    supported_by:
    - reference_id: PMID:34942119
      supporting_text: Here, we report an intellectual disability syndrome caused by the loss of APC7,
        a core component of the E3 ubiquitin ligase anaphase promoting complex (APC).
    - reference_id: PMID:34942119
      supporting_text: Collectively, our findings reveal that APC7 operates in the context of the E3 ubiquitin
        ligase Cdh1-APC to drive ubiquitination and degradation of Ki-67 primarily in neuronal heterochromatin
        in the brain.
