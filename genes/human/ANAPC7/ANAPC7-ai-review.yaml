- id: PMID:34942119
  title: APC7 mediates ubiquitin signaling in constitutive heterochromatin in the developing mammalian
    brain.
  findings:
  - statement: APC7 loss causes an intellectual disability syndrome.
    supporting_text: Here, we report an intellectual disability syndrome caused by the loss of APC7, a
      core component of the E3 ubiquitin ligase anaphase promoting complex (APC).
  - statement: APC7 is essential for substrate recruitment and ubiquitination.
    supporting_text: We find that APC7 is essential for stable recruitment and ubiquitination of substrates.
  - statement: The APC/C keeps its structure without APC7.
    supporting_text: Although the APC retains its structure in the absence of APC7, this core subunit
      is essential for recruiting and ubiquitinating substrates.
  - statement: APC7 drives Cdh1-APC degradation of Ki-67 in neuronal heterochromatin.
    supporting_text: Collectively, our findings reveal that APC7 operates in the context of the E3 ubiquitin
      ligase Cdh1-APC to drive ubiquitination and degradation of Ki-67 primarily in neuronal heterochromatin
      in the brain.
  - statement: APC7 is nuclear-enriched in brain.
    supporting_text: In fractionated lysates of the mouse cerebral cortex and cerebellum, APC7 and APC3
      were enriched in the nucleus relative to other APC subunits
  - statement: APC7 loss does not lengthen mitosis.
    supporting_text: Loss of APC7 failed to prolong the period between nuclear envelope breakdown (NEBD)
      and anaphase (length of mitosis) or the frequency of lagging chromosomes
  - statement: APC7 regulates constitutive heterochromatin.
    supporting_text: These results suggest that APC7 regulates constitutive heterochromatin.
  - statement: APC7 loss reduces pericentromeric major satellite transcription.
    supporting_text: Loss of APC7 reduced transcription of pericentromeric major satellite DNA, but did
      not change the expression of LINE-1 and IAP sequences derived from endogenous retroviruses
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Human genetics, mouse model, cryo-EM and biochemistry.
