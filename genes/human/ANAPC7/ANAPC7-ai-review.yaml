    label: anaphase-promoting complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0029879
  - PANTHER:PTN002649316
  - UniProtKB:Q9UJX3
  review:
    summary: Part of the anaphase-promoting complex. APC7 is a core TPR-lobe subunit; accepted.
    action: ACCEPT
    reason: APC7 is a TPR subunit of the APC/C that binds the coactivator C-termini [PMID:12956947 "In
      vitro, the C termini of CDC20 and CDH1 bind to the closely related TPR subunits APC3 and APC7."]
      and is essential for substrate recruitment and ubiquitination [PMID:34942119 "We find that APC7
      is essential for stable recruitment and ubiquitination of substrates."]. APC16 recruits it to APC3
      in the TPR lobe [PMID:25490258 "The structures show how one APC16 binds asymmetrically to the symmetric
      APC3 dimer and, together with biochemistry and prior data, explain how APC16 recruits APC7 to APC3"].
    supported_by:
    - reference_id: PMID:12956947
      supporting_text: In vitro, the C termini of CDC20 and CDH1 bind to the closely related TPR subunits
        APC3 and APC7.
    - reference_id: PMID:34942119
      supporting_text: We find that APC7 is essential for stable recruitment and ubiquitination of substrates.
    - reference_id: PMID:25490258
      supporting_text: The structures show how one APC16 binds asymmetrically to the symmetric APC3 dimer
        and, together with biochemistry and prior data, explain how APC16 recruits APC7 to APC3
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC7 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
