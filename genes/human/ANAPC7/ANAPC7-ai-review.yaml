existing_annotations:
- term:
    id: GO:0000792
    label: heterochromatin
  evidence_type: IMP
  original_reference_id: PMID:34942119
  qualifier: located_in
  review:
    summary: 'Heterochromatin (IMP). The IMP evidence is functional, not positional: APC7 loss deregulates
      constitutive heterochromatin. Modified to regulation of heterochromatin organization.'
    action: MODIFY
    reason: 'The paper places the substrate Ki-67, not APC7, in heterochromatin [PMID:34942119 "Collectively,
      our findings reveal that APC7 operates in the context of the E3 ubiquitin ligase Cdh1-APC to drive
      ubiquitination and degradation of Ki-67 primarily in neuronal heterochromatin in the brain."], and
      shows APC7 is enriched in the nucleus [PMID:34942119 "In fractionated lysates of the mouse cerebral
      cortex and cerebellum, APC7 and APC3 were enriched in the nucleus relative to other APC subunits"],
      so a heterochromatin location for APC7 is not shown. What the perturbation does show is an APC7-dependent
      effect on constitutive heterochromatin: APC7 loss reduces pericentromeric major satellite transcription
      [PMID:34942119 "Loss of APC7 reduced transcription of pericentromeric major satellite DNA, but did
      not change the expression of LINE-1 and IAP sequences derived from endogenous retroviruses"], and
      the authors conclude that APC7 regulates constitutive heterochromatin [PMID:34942119 "These results
      suggest that APC7 regulates constitutive heterochromatin."]. The Cdh1-APC with APC7 does the work,
      by degrading the heterochromatin-associated Ki-67, so GO:0120261 regulation of heterochromatin organization
      captures the finding.'
    supported_by:
    - reference_id: PMID:34942119
      supporting_text: Collectively, our findings reveal that APC7 operates in the context of the E3 ubiquitin
        ligase Cdh1-APC to drive ubiquitination and degradation of Ki-67 primarily in neuronal heterochromatin
        in the brain.
    - reference_id: PMID:34942119
      supporting_text: In fractionated lysates of the mouse cerebral cortex and cerebellum, APC7 and APC3
        were enriched in the nucleus relative to other APC subunits
    - reference_id: PMID:34942119
      supporting_text: Loss of APC7 reduced transcription of pericentromeric major satellite DNA, but
        did not change the expression of LINE-1 and IAP sequences derived from endogenous retroviruses
    - reference_id: PMID:34942119
      supporting_text: These results suggest that APC7 regulates constitutive heterochromatin.
    proposed_replacement_terms:
    - id: GO:0120261
      label: regulation of heterochromatin organization
