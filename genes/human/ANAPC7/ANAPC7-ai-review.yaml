id: Q9UJX3
gene_symbol: ANAPC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC7 (APC7) is a tetratricopeptide-repeat (TPR) subunit of the anaphase-promoting complex/cyclosome
  (APC/C), the E3 ubiquitin ligase that marks cell-cycle regulators and other substrates for proteasomal
  destruction. APC7 sits in the TPR lobe, where APC16 recruits it to APC3. It binds the C-termini of the
  coactivators CDC20 and CDH1. Without APC7 the APC/C keeps its structure but cannot stably recruit and
  ubiquitinate substrates. APC7 is enriched in the nucleus in brain, where APC/C-CDH1 needs it to degrade
  Ki-67, and its loss causes an intellectual disability syndrome. Loss of APC7 does not lengthen mitosis
  in human cells.
