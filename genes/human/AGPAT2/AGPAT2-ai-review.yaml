- term:
    id: GO:0001819
    label: positive regulation of cytokine production
  evidence_type: IMP
  original_reference_id: PMID:9212163
  qualifier: involved_in
  review:
    summary: The cited study reports enhanced cytokine production after LPAAT
      overexpression and IL-1beta stimulation.
    action: UNDECIDED
    reason: The abstract reports increased TNF-alpha and IL-6 transcription and
      synthesis in the LPAAT expression experiments. This is relevant positive evidence
      for GO:0001819, whose definition covers increased cytokine production; lipid
      enzymology does not preclude that contextual regulatory effect. The full
      experiment, beta-versus-alpha results and controls were not recovered, so the
