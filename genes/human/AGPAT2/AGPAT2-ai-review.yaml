id: O15120
gene_symbol: AGPAT2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGPAT2 (LPAAT-beta) is an endoplasmic-reticulum membrane acyltransferase
  that uses acyl-CoA to acylate lysophosphatidic acid at the sn-2 position, producing
  phosphatidic acid and CoA. This reaction supplies a central intermediate of
  glycerophospholipid and triacylglycerol synthesis. AGPAT2 also forms functional
  complexes with CDP-diacylglycerol synthases CDS1 and CDS2, supporting their stability
  and lipid flux through the CDP-diacylglycerol branch. In mammalian cell models, its
  PA-producing activity also supports DRP1-dependent formation of ER tubules. It is
  important for normal adipose tissue development; biallelic pathogenic variants cause
  congenital generalized lipodystrophy type 1, with severe loss of adipose tissue and
  metabolic disease.
