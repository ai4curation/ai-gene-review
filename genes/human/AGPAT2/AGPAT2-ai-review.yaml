core_functions:
- description: Acylates lysophosphatidic acid with acyl-CoA at the ER membrane to
    produce phosphatidic acid. This is the PA-forming step of glycerolipid synthesis,
    including the CDP-diacylglycerol route. Functional association with CDS1/2 supports
    flux into that phospholipid branch, while the cytidylyltransferase reaction itself
    is performed by CDS1/2.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0006654
    label: phosphatidic acid biosynthetic process
  - id: GO:0016024
    label: CDP-diacylglycerol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:15629135
    supporting_text: conversion of [(3)H]LPA to [(3)H]PA in the presence of
      oleoyl-coenzyme A
  - reference_id: PMID:21873652
    supporting_text: When co-expressed, both isoforms co-localize to the endoplasmic
      reticulum.
  - reference_id: PMID:34824276
    supporting_text_fulltext: AGPAT2 and CDS1/2 form complexes to promote the flux of PA
      into the CDP-DAG pathway.
