core_functions:
- description: >-
    CSTA binds and inhibits papain-like cysteine endopeptidases, including
    cathepsins, through the conserved type-1 cystatin active-site wedge. This
    protease-inhibitor activity is mainly cytosolic and can protect epidermal
    cell-cell adhesion from proteolytic weakening under mechanical stress.
  molecular_function:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0045861
    label: negative regulation of proteolysis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:20860624
    supporting_text: complex between wild-type human stefin A and wild-type human cathepsin B
  - reference_id: PMID:21944047
    supporting_text: diffuse cytoplasmic distribution
suggested_questions:
- question: >-
    Which endogenous cathepsins or other papain-like proteases are the relevant
    CSTA targets that maintain basal and suprabasal keratinocyte adhesion under
    mechanical stress?
- question: >-
    What route exposes CSTA to extracellular fluids and the cornified envelope,
    given that the conserved stefin lacks a cleavable secretion signal?
suggested_experiments:
- description: >-
    Rescue CSTA knockdown in human organotypic epidermis with wild-type CSTA and
    protease-binding-impaired mutants, then measure cathepsin substrate
    cleavage, desmosomal integrity and mechanical fragmentation in parallel.
