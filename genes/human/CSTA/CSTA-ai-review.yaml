id: P01040
gene_symbol: CSTA
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Cystatin-A, also called stefin A, is a small intracellular cystatin-family
  inhibitor of papain-like cysteine endopeptidases. It binds and inhibits
  cathepsins and related proteases through the conserved stefin wedge, acts
  mainly in the cytosol of keratinocytes, and is incorporated as a minor
  cornified-envelope component during terminal epithelial differentiation.
  Loss of CSTA causes exfoliative ichthyosis with weakened basal and
  suprabasal keratinocyte adhesion under mechanical stress.
