id: Q06210
gene_symbol: GFPT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GFPT1 (GFAT1) is a cytosolic glutamine–fructose-6-phosphate aminotransferase that initiates
  hexosamine biosynthesis. It converts glutamine and fructose 6-phosphate into glutamate and glucosamine
  6-phosphate, supplying the pathway to UDP-N-acetylglucosamine and hence substrates for glycosylation.
  UDP-N-acetylglucosamine inhibits the enzyme through feedback regulation. Human GFPT1 forms an asymmetric
  homodimer. Alternative splicing produces 699- and 681-residue proteins. Biallelic GFPT1 variants cause
  a congenital myasthenic syndrome with impaired neuromuscular transmission.
