id: P56704
gene_symbol: WNT3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'WNT3A is a secreted, palmitoleated canonical Wnt ligand. After PORCN/WLS-dependent secretion
  it binds Frizzled and LRP5/6 receptor complexes at the cell surface to stabilize beta-catenin and regulate
  TCF/LEF-dependent transcription, and this core signal is used in mesoderm, neural, synaptic and stem-cell
  contexts.'
