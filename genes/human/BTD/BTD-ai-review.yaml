id: P43251
gene_symbol: BTD
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Biotinidase (BTD; EC 3.5.1.12) is a secreted glycoprotein that hydrolyses
  biocytin and small biotinyl-peptides, releasing free biotin for reuse. It acts in
  biotin salvage after the breakdown of biotin-dependent carboxylases and in the utilization
  of dietary biotinyl compounds. The human serum enzyme belongs to the carbon–nitrogen
  hydrolase superfamily, with a nitrilase-like catalytic domain. Alternative products
  differ at their amino termini; the secretory form is well established, whereas the
  identity and activity of a proposed mitochondrial pool remain unresolved. Biallelic
  loss-of-function variants cause biotinidase deficiency, with secondary impairment
  of biotin-dependent carboxylases and neurological and cutaneous manifestations.
  Early biotin supplementation can prevent neurological damage, providing the rationale
  for newborn screening.
