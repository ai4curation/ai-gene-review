id: Q9H7T9
gene_symbol: AUNIP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AUNIP (Aurora kinase A and ninein-interacting protein, AIBp, C1orf135) is a DNA-binding protein
  that steers DNA double-strand break repair towards homologous recombination. It binds DNA, preferring
  structures resembling stalled replication forks, accumulates at breaks, and binds CtIP (RBBP8), which
  it brings to the break to drive CtIP-dependent end resection. Its loss lowers HR, raises non-homologous
  end joining and sensitizes cells, especially to replication-associated breaks. AUNIP also binds Aurora-A
  and ninein at centrosomes, and its depletion disturbs spindle-pole organization.
