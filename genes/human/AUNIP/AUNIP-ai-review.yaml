- term:
    id: GO:0000922
    label: spindle pole
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0448
  review:
    summary: Spindle pole (IEA). As AIBp, AUNIP binds Aurora-A and ninein. Its depletion produces asymmetric
      and multiple spindle poles, and it is proposed to be needed for the dynamic movement of Aurora-A
      at centrosomes and spindles. A single study supports this mitotic role, separate from the better-characterized
      DNA-repair function, so it is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:20596670 "siRNA-mediated elimination of AIBp from HeLa cells, results in a doughnut-like
      shape, asymmetrical spindle pole and multiple spindle pole formation."] [PMID:20596670 "These studies
      demonstrate that AIBp may not only be required for the dynamic movement of Aurora-A at the centrosomes
      and spindle apparatus during the cell cycle, but may also be important during brain tumorigenesis."]'
    supported_by:
    - reference_id: PMID:20596670
      supporting_text: siRNA-mediated elimination of AIBp from HeLa cells, results in a doughnut-like
        shape, asymmetrical spindle pole and multiple spindle pole formation.
    - reference_id: PMID:20596670
      supporting_text: These studies demonstrate that AIBp may not only be required for the dynamic movement
        of Aurora-A at the centrosomes and spindle apparatus during the cell cycle, but may also be important
        during brain tumorigenesis.
