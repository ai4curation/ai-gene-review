    summary: Centrosome (IDA, Human Protein Atlas immunofluorescence). The HPA antibody localizes AUNIP
      to the centrosome. That is consistent with its reported Aurora-A and ninein interactions, which
      are centrosomal partners. This is direct imaging evidence, but the centrosomal role is less characterized
      than the DNA-repair function, so it is kept as non-core.
