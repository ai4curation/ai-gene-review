- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: Automatic inter-ontology inference from the wide pore channel activity annotation (GO_REF:0000108).
    action: MARK_AS_OVER_ANNOTATED
    reason: A mechanical consequence of the GO:0022829 assignment, not an independent observation.
      'Transmembrane transport' denotes regulated translocation of solutes across a membrane; an
      MPEG1 pore is a lytic breach whose biological output is killing of an engulfed bacterium or
      wholesale leakage of endocytic contents into the cytosol. Even the antigen-translocation activity
      described in PMID:42618800 is escape through a breach rather than transport in the GO sense.
      The inference is also only as sound as the GO:0022829 assignment, whose definition fits gap
      junctions and porins rather than lytic pore formers.
