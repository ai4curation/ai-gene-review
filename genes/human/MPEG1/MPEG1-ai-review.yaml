- term:
    id: GO:0022829
    label: wide pore channel activity
  evidence_type: IDA
  original_reference_id: PMID:31537793
  qualifier: enables
  review:
    summary: 'Pore formation is the single molecular function of MPEG1: MACPF prepore oligomers convert
      to a giant transmembrane beta-barrel. The IDA rests on cryo-EM structures of both the soluble
      prepore and the membrane-bound state plus AFM of perforation.'
    action: ACCEPT
    reason: 'Core molecular function, and the only MF this gene carries. Kept as a single activity
      even though PMID:42618800 (EMBO J 2026) argues that the pore-forming species differs between
      contexts - full-length membrane-anchored protein for endocytic escape rather than the proteolytically
      released ectodomain - and that antigen translocation is pH-independent, in contrast to the
      acid-triggered prepore-to-pore transition characterised in PMID:31537793. Those are differences
      of regulation, topology and target membrane, not of chemistry: in both settings MPEG1 oligomerises
      and inserts a beta-barrel. GO''s molecular-function branch does not distinguish them, so the
      annotation is unchanged and the divergence is recorded here and in suggested_questions. Separately,
      note a definitional mismatch that is a family-wide ontology issue rather than an error in this
      annotation: GO:0022829 is defined in terms of energy-independent facilitated diffusion through
      an un-gated channel, with gap junctions and porins as examples, which does not describe an
      acid-gated lytic MACPF pore. GO:0140911 pore-forming activity is a better textual fit and is
      already carried by PRF1 via InterPro; adding it to MPEG1 would be an improvement. GO:0022829
      is retained because it is the term GO applies consistently across this protein class (PRF1,
      GSDMD, MPEG1), and changing it for MPEG1 alone would fragment the family.'
    supported_by:
    - reference_id: PMID:31537793
      supporting_text: We further discover that MPEG1 prepore-like assemblies can be induced to perforate
        membranes through acidification
    - reference_id: PMID:26402460
      supporting_text: Subsequently, Perforin-2 polymerizes and forms large clusters of 100 Å pores
        in the bacterial surface with Perforin-2 cleavage products present in bacteria.
    - reference_id: PMID:42618800
      supporting_text: we find that endocytic escape is mediated by full-length, membrane-anchored
        perforin-2 rather than by the proteolytically released ectodomain
    - reference_id: PMID:42618800
      supporting_text: Moreover, we show that perforin-2-mediated antigen translocation does not
        require low pH, explaining how perforin-2 can form pores in cross-presenting dendritic cells
        which do not acidify their phagosomes.
- term:
    id: GO:0061474
    label: phagolysosome membrane
  evidence_type: IDA
  original_reference_id: PMID:31537793
  qualifier: is_active_in
  review:
    summary: MPEG1 is active in the phagolysosome membrane, where it remains anchored while its pore-forming
      machinery faces the engulfed target.
    action: ACCEPT
    reason: 'Correct and specific site of action. PMID:42618800 reinforces rather than undermines
      this annotation: if endocytic escape is mediated by full-length, membrane-anchored perforin-2,
      then the active species is by definition resident in the compartment membrane. What that paper
      does contest is the accompanying interpretation from PMID:31537793 that the MABP-mediated orientation
      exists in order to spare the host membrane, since in cross-presenting dendritic cells the host
      compartment membrane is the one that gets perforated.'
    supported_by:
    - reference_id: PMID:31537793
      supporting_text: This unexpected mechanism of membrane interaction suggests that MPEG1 remains
        bound to the phagolysosome membrane while simultaneously forming pores in engulfed bacterial
        targets.
    - reference_id: PMID:31537793
      supporting_text: These data reveal that a multi-vesicular body of 12 kDa (MVB12)-associated
        β-prism (MABP) domain binds membranes such that the pore-forming machinery of MPEG1 is oriented
        away from the bound membrane.
    - reference_id: PMID:42618800
      supporting_text: we find that endocytic escape is mediated by full-length, membrane-anchored
        perforin-2 rather than by the proteolytically released ectodomain
