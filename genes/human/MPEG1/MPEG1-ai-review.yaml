core_functions:
- molecular_function:
    id: GO:0022829
    label: wide pore channel activity
  description: 'MPEG1 assembles into a homo-oligomeric MACPF pore. Soluble or membrane-tethered prepore
    rings and arcs convert to a giant transmembrane beta-barrel when two alpha-helical segments of
    each protomer refold into amphipathic beta-hairpins. The resulting large-diameter pore is used
    in two settings. In phagocytes it perforates the surface of engulfed bacteria from the phagolysosome
    membrane, killing them and permitting access of reactive oxygen and nitrogen species and hydrolases;
    acidification of the maturing phagolysosome triggers the prepore-to-pore transition. In cross-presenting
    dendritic cells the same activity breaches the antigen-containing endocytic compartment so that
    internalised antigen reaches the cytosol for proteasomal processing and MHC class I loading.
    These are treated here as one molecular function in two contexts rather than two activities:
    the reported differences concern which molecular species oligomerises (full-length membrane-anchored
    protein versus proteolytically released ectodomain), which membrane is perforated, and whether
    low pH is required - regulation, topology and target, none of which the molecular-function branch
    of GO distinguishes.'
  directly_involved_in:
  - id: GO:0042742
    label: defense response to bacterium
  - id: GO:0140367
    label: antibacterial innate immune response
  - id: GO:0042590
    label: antigen processing and presentation of exogenous peptide antigen via MHC class I
  locations:
  - id: GO:0061474
    label: phagolysosome membrane
  - id: GO:0030670
    label: phagocytic vesicle membrane
  - id: GO:0030659
    label: cytoplasmic vesicle membrane
  supported_by:
  - reference_id: PMID:31537793
    supporting_text: We further discover that MPEG1 prepore-like assemblies can be induced to perforate
      membranes through acidification
  - reference_id: PMID:26402460
    supporting_text: Subsequently, Perforin-2 polymerizes and forms large clusters of 100 Å pores
      in the bacterial surface with Perforin-2 cleavage products present in bacteria.
  - reference_id: PMID:31537793
    supporting_text: This unexpected mechanism of membrane interaction suggests that MPEG1 remains
      bound to the phagolysosome membrane while simultaneously forming pores in engulfed bacterial
      targets.
  - reference_id: PMID:37347855
    supporting_text: Mpeg1-/- mice failed to efficiently prime CD8+ T cells to cell-associated antigens,
      revealing an important role for perforin-2 in cytosolic entry of antigens during cross-presentation.
  - reference_id: PMID:42618800
    supporting_text: we find that endocytic escape is mediated by full-length, membrane-anchored
      perforin-2 rather than by the proteolytically released ectodomain
  - reference_id: PMID:42618800
    supporting_text: Moreover, we show that perforin-2-mediated antigen translocation does not require
      low pH, explaining how perforin-2 can form pores in cross-presenting dendritic cells which
      do not acidify their phagosomes.
suggested_questions:
- question: Does MPEG1 have one pore-forming molecular function deployed in two settings, or two
    mechanistically distinct pore-forming activities? PMID:42618800 reports that endocytic escape
    uses full-length membrane-anchored perforin-2 and does not require low pH, whereas the antibacterial
    pore characterised structurally in PMID:31537793 is acid-triggered. Is the difference one of
    regulation and topology only, or of the assembly pathway itself?
  experts:
  - GO molecular-function curators
  - MACPF/CDC structural biologists
- question: If the full-length, transmembrane-anchored protein makes the pore during cross-presentation,
    what is the function of the extensive proteolytic processing by endocytic proteases and of the
    released ectodomain? Is the ectodomain the antibacterial effector, an inactivation product, or
    something else?
- question: If acidification is not the trigger in cross-presenting dendritic cells, what is? Candidate
    triggers include lipid composition of the target membrane, redox state, a protease-generated
    conformational change, or local concentration reached on oligomerisation.
- question: How does the cell avoid catastrophic self-perforation if the pore-forming machinery is
    deployed from an anchor in the host compartment membrane? The MABP-orientation model of PMID:31537793
    was the previous answer; PMID:42618800 argues that in dendritic cells the host membrane is in
    fact the perforated one.
- question: Should MPEG1 also carry GO:0140911 pore-forming activity? GO:0022829 wide pore channel
    activity is defined in terms of un-gated facilitated diffusion through gap junctions and porins,
    which does not describe a gated lytic MACPF beta-barrel, yet it is the term used consistently
    across PRF1, GSDMD and MPEG1.
  experts:
  - GO ontology developers
- question: Do the mechanisms proposed by PMID:42618800 and PMID:41951589 describe the same cell
    biology? One places the critical event at the endocytic membrane (anchored pore, pH-independent
    escape) and the other at the plasma membrane and at endosomal pH control (macropinocytic uptake,
    restraint of acidification). Both agree perforin-2 is required for cross-presentation.
suggested_experiments:
- hypothesis: Endocytic escape requires the membrane anchor, whereas bacterial killing requires the
    released ectodomain.
  description: Reconstitute Mpeg1-null dendritic cells and macrophages with (i) wild-type perforin-2,
    (ii) a protease-resistant full-length variant that cannot be cleaved at the juxtamembrane site,
    and (iii) the ectodomain alone, then score cytosolic antigen delivery, CD8+ T cell priming and
    killing of intracellular bacteria in parallel in the same cells. A double dissociation would
    settle whether the two deployments use different species of the protein.
  experiment_type: structure-function complementation
- hypothesis: Pore formation in cross-presenting dendritic cells is triggered by something other
    than luminal acidification.
  description: Use liposomes and supported bilayers of defined composition with purified full-length
    (detergent- or nanodisc-reconstituted) and ectodomain-only perforin-2, and test prepore-to-pore
    conversion by AFM and release assays as a function of pH, lipid composition, redox state and
    protease exposure. Compare directly against the acid-triggered conversion reported in PMID:31537793.
  experiment_type: in vitro reconstitution
- hypothesis: The pore that mediates antigen escape is built in the host compartment membrane, not
    in an engulfed target.
  description: Apply cryo-electron tomography to antigen-containing compartments of wild-type and
    Mpeg1-null cross-presenting dendritic cells to visualise perforin-2 assemblies in situ and determine
    on which leaflet and in which membrane the barrels sit.
  experiment_type: in situ structural imaging
- hypothesis: The two deployments are separable genetically.
  description: Screen for MPEG1 point mutants that abolish killing of intracellular bacteria while
    preserving cross-presentation, and vice versa, and map them onto the MACPF, P2 and MABP domains
    and the juxtamembrane processing sites.
  experiment_type: genetic separation-of-function screen
