id: Q2M385
gene_symbol: MPEG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Macrophage-expressed gene 1 protein (perforin-2) is a pore-forming protein of the MACPF/CDC
  superfamily and the founding member of the MPEG1 family. It is constitutively expressed in macrophages,
  dendritic cells, neutrophils, natural killer cells and keratinocytes. The full-length isoform is
  a membrane protein of cytoplasmic vesicles, anchored by a C-terminal transmembrane helix, and an
  N-terminal MACPF domain is followed by a P2 region and an MVB12-associated beta-prism (MABP) membrane-binding
  domain. Vesicles carrying perforin-2 traffic to and fuse with bacterium-containing phagosomes,
  where the protein oligomerises into ring- and arc-shaped prepores that convert, on acidification,
  into giant beta-barrel transmembrane pores; the MABP domain holds the assembly on the phagolysosome
  membrane with the pore-forming machinery directed at the engulfed target. Perforin-2 is required
  for phagocyte killing of a broad range of Gram-positive, Gram-negative and acid-fast bacteria and
  for the bactericidal action of reactive oxygen and nitrogen species; loss-of-function variants
  in humans cause immunodeficiency 77, with recurrent skin and soft-tissue infection. In cross-presenting
  dendritic cells the same pore-forming activity permeabilises antigen-containing endocytic compartments
  so that internalised antigen escapes to the cytosol for proteasomal processing and presentation
  on MHC class I, and perforin-2-deficient mice prime CD8+ T cells poorly against cell-associated
  antigen. How pore formation differs between these two settings is unsettled: the protein is extensively
  processed by endocytic proteases, and it is disputed whether the species that perforates endocytic
  membranes is the released ectodomain or the full-length membrane-anchored protein, and whether
  acidification is required in dendritic cells, which do not acidify their phagosomes. A second,
  alternatively spliced isoform lacks the transmembrane domain, does not reach vesicle membranes,
  and is secreted.'
