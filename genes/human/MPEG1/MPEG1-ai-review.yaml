  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Infect Immun 2013). Primary evidence that perforin-2 knockdown
      permits Chlamydia trachomatis growth in macrophages; supports the Gram-negative defence annotation.
  title: Perforin-2 restricts growth of Chlamydia trachomatis in macrophages.
- id: PMID:26402460
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (eLife 2015). In vivo Mpeg1 knockout phenotype plus EM of 100 A
      pores on bacterial surfaces; the strongest single source for the antibacterial role.
  title: Perforin-2 is essential for intracellular defense of parenchymal cells and phagocytes against
    pathogenic bacteria.
- id: PMID:28705375
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Cell Immunol 2017). Establishes the two human isoforms and that
      only TM-containing perforin-2a reaches vesicle membranes while perforin-2b is secreted; the
      basis for treating the extracellular annotation as isoform-specific and non-core.
  title: Regulation of expression and trafficking of perforin-2 by LPS and TNF-α.
- id: PMID:30609079
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Exp Dermatol 2019). Human skin expression and anti-S. aureus activity;
      supports the Gram-positive defence annotation.
  title: Single cell analyses reveal specific distribution of anti-bacterial molecule Perforin-2
    in human skin and its modulation by wounding and Staphylococcus aureus infection.
- id: PMID:31537793
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nat Commun 2019). Source of the GO:0022829 IDA and of the acid-activation
      and MABP-orientation model that PMID:42618800 revisits.
  title: The cryo-EM structure of the acid activatable pore-forming immune effector Macrophage-expressed
    gene 1.
- id: PMID:33224153
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Front Immunol 2020). Human MPEG1 haploinsufficiency with impaired
      phagocyte bacterial killing; the only human genetic evidence.
  title: MPEG1/Perforin-2 Haploinsufficiency Associated Polymicrobial Skin Infections and Considerations
    for Interferon-γ Therapy.
- id: PMID:37347855
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Science 2023). Genetic screen identifying perforin-2 as the endocytic-escape
      effector of cross-presentation. Its released-ectodomain model is partly superseded by the same
      laboratory in PMID:42618800; the requirement for perforin-2 in cross-presentation is not in
      dispute.
  title: Perforin-2 is a pore-forming effector of endocytic escape in cross-presenting dendritic
    cells.
- id: PMID:41951589
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Cell Death Dis 2026). Independent replication that P2 loss impairs
      dendritic-cell cross-presentation and CD8+ T cell priming, though it attributes this to antigen
      uptake and restraint of endosomal acidification rather than to escape.
  title: Perforin-2 enhances antigen-specific CTL immune response by promoting cross presentation.
- id: PMID:42618800
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (EMBO J 2026, Laub/Chatterjee/Kozik). Abstract-only in the cache.
      Argues that endocytic escape uses full-length membrane-anchored perforin-2 rather than the
      released ectodomain and is pH-independent, and concludes that pore formation in antibacterial
      defence and in cross-presentation proceed by distinct mechanisms. Single paper, no published
      rebuttal; weighed accordingly.
  title: Anchoring of perforin-2 via the transmembrane domain is required for antigen escape into
    the cytosol.
existing_annotations:
- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: MPEG1 is required for killing of intracellular bacteria in phagocytes; this is the longest-standing
      and best-replicated role of the protein.
    action: ACCEPT
    reason: Core biological process. Supported by loss-of-function in mouse (systemic MRSA and Salmonella
      dissemination), by knockdown in human macrophages, and by a human haploinsufficiency phenotype.
      Nothing in the 2026 cross-presentation literature disputes the antibacterial role.
    supported_by:
    - reference_id: PMID:26402460
      supporting_text: Perforin-2 knockout mice are unable to control the systemic dissemination
        of methicillin-resistant Staphylococcus aureus (MRSA) or Salmonella typhimurium and perish
        shortly after epicutaneous or orogastric infection respectively.
    - reference_id: PMID:33224153
      supporting_text: We showed that haploinsufficiency of perforin-2 reduced the bactericidal capacity
        of human phagocytes.
