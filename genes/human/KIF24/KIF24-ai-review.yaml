- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:24421332
  qualifier: part_of
  review:
    summary: Protein-containing complex (IDA) from the Talpid3/CEP290 study, reflecting association of
      KIF24 with CP110-containing complexes.
    action: KEEP_AS_NON_CORE
    reason: The generic complex term is correct but uninformative; KIF24 associates with CP110-CEP97-Talpid3-containing
