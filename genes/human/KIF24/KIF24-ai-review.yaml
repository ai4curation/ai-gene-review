core_functions:
- description: ATP-dependent microtubule-depolymerizing kinesin-13 activity at the distal end of the mother
    centriole that remodels centriolar microtubules and suppresses inappropriate cilium formation in cycling
    cells; stimulated by NEK2 phosphorylation.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0007019
    label: microtubule depolymerization
  - id: GO:1902018
    label: negative regulation of cilium assembly
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:21620453
    supporting_text: Kif24 is able to bind and depolymerize microtubules in vitro.
  - reference_id: PMID:26290419
    supporting_text: We show that Kif24, a microtubule depolymerizing kinesin, is phosphorylated by Nek2,
      which stimulates its activity and prevents the outgrowth of cilia in proliferating cells, independent
      of Aurora A and HDAC6.
- description: 'Distal-cap maintenance: KIF24 recruits MPHOSPH9 to the mother centriole distal end, which
    recruits the CP110-CEP97 cap; KIF24 loss causes CP110 loss from mother centrioles in cells able to
    ciliate.'
  directly_involved_in:
  - id: GO:1902018
    label: negative regulation of cilium assembly
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:30375385
    supporting_text: Here we show that M-Phase Phosphoprotein 9 (MPP9) is recruited by Kinesin Family
      Member 24 (KIF24) to the distal end of mother centriole where it forms a ring-like structure and
      recruits CP110-CEP97 by directly binding CEP97.
  - reference_id: PMID:21620453
    supporting_text: We found that loss of Kif24 leads to the disappearance of CP110 from mother centrioles,
      specifically in cycling cells able to form cilia.
suggested_questions:
- question: Does NEK2-activated KIF24 actively depolymerize axonemal microtubules during G2/M cilium resorption,
    or does it act only at the centriole to prevent regrowth? This determines whether a cilium disassembly
    process annotation is warranted.
- question: Is the CP110-loss phenotype after KIF24 depletion fully explained by loss of MPHOSPH9 recruitment,
    or does KIF24 depolymerase activity contribute separately to cap retention?
suggested_experiments:
- description: Rescue KIF24-null RPE1 cells with motor-dead (ATPase-deficient) versus MPHOSPH9-binding-deficient
    KIF24 to separate depolymerase and cap-recruitment contributions to ciliogenesis suppression.
- description: Live imaging of axoneme length in cells expressing NEK2-phosphomimetic KIF24 to test direct
    axonemal depolymerization during cilium resorption.
