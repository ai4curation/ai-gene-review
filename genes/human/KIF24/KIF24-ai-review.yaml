  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT3G16630
  - PANTHER:PTN001537794
  review:
    summary: Microtubule (IBA).
    action: ACCEPT
    reason: KIF24 acts on microtubules, specifically centriolar microtubules at the mother centriole;
      the phylogenetic location inference for kinesin-13 family members is consistent.
