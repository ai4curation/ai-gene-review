- term:
    id: GO:0007018
    label: microtubule-based movement
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001752
  - InterPro:IPR019821
  - InterPro:IPR027640
  review:
    summary: Microtubule-based movement (IEA, InterPro kinesin motor domain).
    action: MARK_AS_OVER_ANNOTATED
    reason: Kinesin-13 family members, including KIF24, are not translocating motors; their motor domain
      acts at microtubule ends to depolymerize them. There is no evidence that KIF24 moves cargo along
      microtubules, so this generic kinesin mapping over-states the process.
    supported_by:
    - reference_id: PMID:21620453
      supporting_text: We have identified a protein, Kif24, that shares homology with the kinesin-13 subfamily
        of motor proteins
