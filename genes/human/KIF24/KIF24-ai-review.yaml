id: Q5T7B8
gene_symbol: KIF24
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KIF24 is a kinesin-13 family protein with a central kinesin motor domain that binds and depolymerizes
  microtubules in an ATP-dependent manner rather than walking along them. It localizes preferentially
  to the distal end of the mother centriole, where it interacts with CP110 and CEP97 and recruits MPHOSPH9,
  which in turn recruits the CP110-CEP97 distal cap. Through cap maintenance and depolymerization of centriolar
  microtubules, KIF24 suppresses inappropriate primary cilium formation in proliferating cells. Phosphorylation
  by NEK2 stimulates KIF24 depolymerizing activity, preventing cilium outgrowth or regrowth during the
  cell cycle and contributing to cilium resorption before mitosis. KIF24 depletion in cycling cells results
  in loss of CP110 from the mother centriole and promotes ciliation.
