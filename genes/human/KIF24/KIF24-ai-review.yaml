    supported_by:
    - reference_id: PMID:24421332
      supporting_text: Collectively, these data indicate that Talpid3 robustly binds to CP110 and more
        weakly associates with Cep97, Cep290, and Kif24.
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:26290419
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q5T7B8
  review:
    summary: Identical protein binding (IPI) from the NEK2-KIF24 study, which reports interaction between
      the amino- and carboxy-terminal regions of KIF24.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited study describes an intramolecular interaction between N- and C-terminal fragments
      that is proposed to keep KIF24 in a closed, autoinhibited conformation relieved by NEK2 phosphorylation.
      This is not evidence for a homo-oligomeric binding function and adds no functional information beyond
      the regulation already captured.
    supported_by:
