- term:
    id: GO:0003777
    label: microtubule motor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001537794
  - UniProtKB:Q5T7B8
  review:
    summary: Microtubule motor activity (IBA) for KIF24, a kinesin-13 family member.
    action: ACCEPT
    reason: KIF24 carries a kinesin motor domain and belongs to the kinesin-13 (internal motor) subfamily,
      whose motor domains use ATP to depolymerize microtubule ends rather than to translocate. GO has
      no separate microtubule depolymerase activity term, and kinesin-13 members are conventionally annotated
      with this motor activity term; the IDA shows ATP-dependent binding and depolymerization of microtubules
      in vitro. Accepted with the caveat that the activity is depolymerization, not cargo transport.
    supported_by:
    - reference_id: PMID:21620453
      supporting_text: Kif24 is able to bind and depolymerize microtubules in vitro.
    - reference_id: PMID:30375385
      supporting_text: KIF24, a member of the kinesin-13 family of proteins, interacts with CP110 and
        negatively regulates ciliogenesis
