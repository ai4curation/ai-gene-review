core_functions:
- description: Catalyzes sn-1 deacylation of glycerophospholipids, including phosphatidylinositol and
    phosphatidate, generating 2-acyl lysophospholipids and free fatty acids. PI hydrolysis generates LPI
    and is modulated by PA; the physiological substrate range and relative contributions vary with cellular
    lipid context.
