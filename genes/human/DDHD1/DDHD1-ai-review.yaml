- term:
    id: GO:0090141
    label: positive regulation of mitochondrial fission
  evidence_type: IDA
  original_reference_id: PMID:24599962
  qualifier: acts_upstream_of_or_within
  review:
    summary: Retain activity-dependent mitochondrial-fission regulation as non-core.
    action: KEEP_AS_NON_CORE
    reason: PMID:24599962 explicitly assays human FLAG-PA-PLA1/DDHD1 in HeLa cells. WT overexpression
      fragments mitochondria; two independent siRNAs elongate them and reduce CCCP-induced fragmentation;
      siRNA-resistant WT but not S537A rescues. These support activity-dependent positive regulation of
      mitochondrial fission, preserving the existing acts_upstream_of_or_within qualifier. This is a cell-context
      output of phospholipid metabolism, not an independent membrane-scission molecular function. MitoPLD/PA-probe
      experiments support a local PA model, but bulk mitochondrial PA/LPA and Drp1/Mfn distributions did
      not change. DDHD1 depletion did not produce the same phenotype in MEFs. Do not transfer mouse sperm
      phenotypes to human core biology.
    supported_by:
    - reference_id: PMID:24599962
