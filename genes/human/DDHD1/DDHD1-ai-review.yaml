  review:
    summary: The DDHD-domain metal-binding mapping remains unresolved.
    action: UNDECIDED
    reason: IPR004177 maps the DDHD domain to metal ion binding, but its official description presents
      the four conserved residues as a possible metal-binding site and says the domain function is unknown.
