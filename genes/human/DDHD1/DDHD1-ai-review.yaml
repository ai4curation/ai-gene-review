suggested_questions:
- question: Does purified human DDHD1 bind a metal ion directly, and if so what is its identity, occupancy
    and catalytic role?
- question: Which of the four encoded splice products have demonstrated phospholipase activity and membrane-access
    properties in physiological cells?
- question: Does the homooligomerization curated in UniProt influence DDHD1 phospholipase activity or
    access to membrane substrates, and how does the weaker association with DDHD2 contribute?
