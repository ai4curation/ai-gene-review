taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DDHD1 is an intracellular phospholipase A1 that removes the sn-1 acyl chain from glycerophospholipids,
  generating a free fatty acid and a 2-acyl lysophospholipid. Its substrates include phosphatidylinositol
  and phosphatidate, linking its activity to intracellular phospholipid turnover. A substantial pool is
  cytosolic, with access to membrane lipids depending on cellular context. Its catalytic activity can
  influence mitochondrial morphology, although this response varies between cell types. It is highly expressed
  in testis and is also expressed in brain and other tissues. Biallelic loss of DDHD1 function causes
  autosomal recessive spastic paraplegia 28 (SPG28).
