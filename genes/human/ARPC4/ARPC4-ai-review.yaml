id: P59998
gene_symbol: ARPC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARPC4 (p20-Arc) is one of the seven subunits of the Arp2/3 complex, the nucleator of branched
  actin filament networks. With ARPC2 (p34) it forms the structural core of the complex: the two associate
  through long C-terminal helices, ARPC4 contacts ARPC2, ARPC3 and ARPC5, and the ARPC2-ARPC4 surface
  is the main interface binding the side of the mother filament. The complex is cytosolic and drives lamellipodial
  protrusion, endocytic actin assembly and phagocytosis. It is also recruited to damaged chromatin, where
  nuclear actin polymerization clusters double-strand breaks for homology-directed repair.'
