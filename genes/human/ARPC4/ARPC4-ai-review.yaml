core_functions:
- description: Structural core subunit of the Arp2/3 complex that, with ARPC2, binds the mother filament
    to nucleate branched actin networks.
  contributes_to_molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0034314
    label: Arp2/3 complex-mediated actin nucleation
  in_complex:
    id: GO:0005885
    label: Arp2/3 protein complex
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11741539
    supporting_text: Expression of partial complexes revealed that a heterodimer of the p34 and p20 subunits
      constitutes a critical structural core of the complex, whereas the remaining subunits are peripherally
      located.
  - reference_id: PMID:20404198
    supporting_text: ARPC2 and ARPC4 comprise the major mother-filament-binding interface, consistent
      with earlier data from chemical cross-linking ( 19 ), Arp2/3 complex reconstitution ( 20 ), and
      antibody-inhibition experiments ( 21 ).
  - reference_id: PMID:11721045
    supporting_text: Subunits ARPC2 p34 and ARPC4 p20 in the core of the complex associate through long
      carboxyl-terminal alpha helices and have similarly folded amino-terminal alpha/beta domains.
proposed_new_terms: []
suggested_questions:
- question: How do ARPC4 post-translational modifications, such as UFMylation and bacterial-toxin ADP-ribosylation,
    change Arp2/3 nucleation in cells?
suggested_experiments:
- description: Test ARPC4 mother-filament-interface mutants for branch formation and DNA-break clustering
    in human cells.
