  review:
    summary: Structural constituent of cytoskeleton (IDA). ARPC4 is a structural core subunit of the Arp2/3
      complex, which is built into branched actin networks at branch points. Accepted, consistent with
      the ARPC1B review.
    action: ACCEPT
    reason: '[PMID:11741539 "Expression of partial complexes revealed that a heterodimer of the p34 and
