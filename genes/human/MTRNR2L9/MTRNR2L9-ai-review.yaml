    action: MARK_AS_OVER_ANNOTATED
    reason: "MTRNR2L9 is known only as a transcript (UniProt protein existence level 2); no peptide
      from this locus has been detected in any compartment, by mass spectrometry or otherwise.
      UniProt's Secreted and Cytoplasm lines for P0CJ76 are themselves ECO:0000250 by-similarity
      statements transferred from humanin (file:human/MTRNR2L9/MTRNR2L9-uniprot.txt), so both the ISS
      row (donor UniProtKB:Q8IVG9) and the subcellular-location IEA row state the same humanin claim,
      once directly and once via the controlled-vocabulary mapping. Secretion of humanin is not a
      generic property of the sequence: it depends on Leu9-Leu11 and on Pro19-Val20 [PMID:35372353],
      and Bodzioch et al. proposed on the alignment that position 19 is what decides whether a nuclear
      isoform is secreted at all [PMID:19477263]. HN9 is heavily substituted in the middle of the
      peptide but both secretion segments, Leu9-Leu11 and Pro19-Val20, are intact, so unlike the loci
      that have lost Pro19 there is no residue-level argument against secretion here. The claim may
      well be right if the peptide exists, so I mark it as an over-annotation rather than removing it:
      what is wrong is that it is asserted of this locus on the strength of humanin alone."
