suggested_questions:
- question: Is a peptide produced from the MTRNR2L9 locus at all? Everything annotated to this gene
    follows from the assumption that it is, and the assumption rests on an intact open reading frame
    plus RT-PCR detection of the transcript [PMID:19477263]. Targeted mass spectrometry of heart,
    kidney and testis for the HN9-specific sequence would settle it.
  experts:
  - Alan Saghatelian
  - Pinchas Cohen
  - Jonathan Wren
- question: Does a peptide whose secretion determinants are intact but whose effector core is
    substituted at Ser14, Glu15 and Ile16 behave as an inert secreted peptide, or as an antagonist of
    humanin itself? HN9 is the natural reagent for asking whether any nuclear humanin-like sequence
    could compete with humanin for its receptors without reproducing its activity, which would make
    these loci modulators rather than copies.
  experts:
  - Pinchas Cohen
- question: How should GO treat a family in which one member has all the experimental evidence and
    twelve nuclear copies have none? The present solution propagates humanin's activity to every copy
    through PANTHER:PTN002141596, which produces thirteen gene products annotated as receptor
    antagonists and apoptosis regulators on the strength of one mitochondrial peptide. A node
    restricted to MT-RNR2 plus MTRNR2L5, the two sequences with functional data, would say what is
    actually known.
- question: Is the male-specific Barrett oesophagus/adenocarcinoma signal at 6q11.1 [PMID:32918910]
    related to MTRNR2L9 at all, or only to its genomic neighbourhood? The marker was reported by
    nearest-gene label with KHDRBS2 as the other flank; fine-mapping or an eQTL analysis in
    oesophageal tissue would show whether this locus is implicated or merely adjacent.
suggested_experiments:
- description: Targeted (PRM) mass spectrometry of human heart, kidney and testis, and of plasma, for
    peptides unique to HN9, using the positions at which it differs from humanin (Pro3->Arg,
    Leu12->Ser, Ser14->Thr, Glu15->Ala, Ile16->Thr and Ala24->Thr) to design discriminating
    transitions. The TTATDLP region gives HN9 a more distinctive signature than most members of the
    family, so this is a more tractable experiment here than for the near-identical loci.
- description: Ribosome profiling or ORF-capture of the MTRNR2L9 transcript in a tissue where it is
    expressed, to test whether the predicted ORF is translated rather than merely transcribed.
- description: Synthesise the HN9 peptide and run it side by side with humanin in the assays that
    define humanin activity - staurosporine- and amyloid-beta-induced death, FPRL1 competition, BAX
    binding - as was done for HN5 alone [PMID:19477263]. Because HN9 substitutes three positions in
    the SEIDLP core while keeping Thr13 and both secretion segments, the comparison would test
    directly whether that core is required for receptor engagement as opposed to cytoprotection.
- description: Fine-mapping and oesophageal-tissue eQTL analysis of the 6q11.1 interval carrying
    rs112894788 [PMID:32918910], to determine whether the male-specific BE/EA association involves
    MTRNR2L9 expression or only a neighbouring element.
