id: P0CJ76
gene_symbol: MTRNR2L9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTRNR2L9 is a nuclear human locus on chromosome 6, at 6q11.1, that resembles the
  humanin small open reading frame of the mitochondrial large-subunit rRNA gene MT-RNR2, one of
  thirteen such MT-RNR2-like sequences in the human genome that are generally interpreted as nuclear
  insertions of mitochondrial DNA. Its predicted product, humanin-like 9 (HN9), is a 24-residue
  peptide (MARRGFSCLLLSTTATDLPVKRRT) that matches humanin at 18 of 24 aligned positions, differing by
  Pro3->Arg, Leu12->Ser, Ser14->Thr, Glu15->Ala, Ile16->Thr and Ala24->Thr; three of those changes
  fall inside the SEIDLP stretch that forms the core of humanin neuroprotective activity, while the
  Leu9-Leu11 and Pro19-Val20 segments that humanin needs for secretion are intact. The locus is
  transcribed: RT-PCR detects it in human tissues with high levels in heart, kidney and testis, and
  its transcript level changes after staurosporine and beta-carotene treatment of cultured cells.
  Whether a peptide is actually made from this transcript, and what it does, is unestablished: no HN9
  peptide has been detected in human tissue or fluid, no molecular activity has been measured for it,
  and no binding partner or receptor interaction has been reported. The humanin peptide from which it
  is named is cytoprotective and antiapoptotic, binds BAX, BID, BIM and IGFBP3 intracellularly and
  signals through FPRL1/FPR2 and a CNTFR-alpha/WSX-1/gp130 complex when secreted, but those
  properties were measured on the mitochondrially encoded peptide and on synthetic analogues of it,
  not on this gene product.'
