- id: PMID:3042787
  title: Nucleotide sequence of the human placental alkaline phosphatase gene. Evolution
    of the 5' flanking region by deletion/substitution.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The gene-defining paper for ALPP. Useful beyond its NAS annotation because
      it explicitly separates the three chromosome-2 alkaline phosphatase genes
      -- placental ALP-1, placental ALP-2 (now ALPG) and intestinal ALP -- and
      notes their nearly 90 percent exonic identity, which is the source of most
      isozyme misattribution in this family's literature.
- id: file:human/ALPP/ALPP-deep-research-falcon.md
  title: 'Deep research report: human ALPP / placental alkaline phosphatase (PLAP)'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Automated literature synthesis (Edison/falcon provider). Used here chiefly
      for its explicit warning against transferring ALPL's established
      pyrophosphatase and mineralization functions to ALPP, and for its account of
      what is and is not settled about placental expression. Its structural and
      enzymological claims were checked against the primary crystal structure
      paper and UniProt rather than accepted on their own.
