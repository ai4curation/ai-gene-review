- id: PMID:1939159
  title: Mutation of a single amino acid converts germ cell alkaline phosphatase to
    placental alkaline phosphatase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct activity measurements on PLAP, GCAP, GCAP point mutants and
      GCAP/PLAP chimeras expressed in COS-1 cells. The key result -- that position
      429 alone accounts for the differential L-leucine, EDTA and heat
      sensitivity that historically distinguished the two isozymes -- is what
      justifies treating ALPP and ALPG as separate functional entities despite
      their seven-residue difference. Correctly cited for both ALPP and ALPG.
- id: PMID:2133555
  title: Two alkaline phosphatase genes are expressed during early development in the
    mouse embryo.
  findings: []
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Cited in GOA as an IDA source for human ALPP alkaline phosphatase activity,
      but the abstract states plainly that the work is in mouse preimplantation
      embryos and that the method is reverse transcription PCR of transcripts. A
      transcript survey in another species cannot be direct evidence of the human
      enzyme's catalytic activity, and the gene it tracks is the mouse embryonic
      AP rather than a human ALPP orthologue in any strict sense. The annotated
      term is nonetheless correct on other evidence, so the annotation was
      accepted and only the citation flagged.
- id: PMID:2153284
  title: Selectivity of the cleavage/attachment site of phosphatidylinositol-glycan-anchored
    membrane proteins determined by site-specific mutagenesis at Asp-484 of placental
    alkaline phosphatase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Near-saturation mutagenesis of the GPI cleavage/attachment site of PLAP,
      the protein in which this processing was originally worked out. Cited by
      UniProt for the GPI anchor at Asp506 of the precursor. Used here as the
      direct evidence for the proposed GO:0009897 annotation, since it shows both
      that the mature protein is glycolipid-anchored and that blocking the
      attachment traps it in the endoplasmic reticulum with little activity.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rolland et al. binary yeast two-hybrid interactome. Correctly cited for the
      interactions it reports; the issue is interpretive rather than
      bibliographic. For ALPP it contributes only KRTAP partners, a recognised
      class of frequently recovered and rarely validated two-hybrid partners.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The HuRI reference interactome. Again correctly cited, but the ALPP partner
      list is long and dominated by keratin-associated proteins, so it supports
