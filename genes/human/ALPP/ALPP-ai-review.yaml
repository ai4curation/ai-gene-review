id: P05187
gene_symbol: ALPP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALPP encodes placental alkaline phosphatase (PLAP, the Regan isozyme), one of
  the three tissue-specific human alkaline phosphatases whose genes cluster on
  chromosome 2q34-q37 and which share 90-98% sequence similarity with each other
  while being only about 57% identical to tissue-nonspecific ALPL. Like its
  paralogues it is a GPI-anchored homodimeric metalloenzyme displayed on the
  outer leaflet of the plasma membrane, with each active site containing two
  Zn(2+) and one Mg(2+) and catalysis proceeding through a covalent phosphoseryl
  intermediate on the conserved active-site serine; a further structural Ca(2+)
  site and a mammalian-specific crown domain sit outside the catalytic centre.
  PLAP hydrolyses phosphate monoesters at alkaline pH with broad in vitro
  specificity, and two properties distinguish it biochemically from the other
  isozymes: exceptional heat stability, which is the classical basis for
  identifying it in serum, and uncompetitive inhibition by L-amino acids such as
  L-leucine and L-phenylalanine, attributable to Glu429 near the active site
  entrance. Expression is confined almost entirely to the syncytiotrophoblast of
  the placenta, where transcript levels rise several hundred-fold from first
  trimester to term, and the protein is highly polymorphic in the population.
  Despite decades of study its physiological substrate and its specific role in
  placental biology remain unresolved, so the well-defined pyrophosphatase and
  mineralization functions of ALPL should not be transferred to it. It is
  clinically prominent as an oncofetal marker: ectopic expression occurs in
  seminoma and other germ cell tumours, which is why it is under investigation as
  a solid-tumour immunotherapy target.
existing_annotations:
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The core molecular function, placed by PAINT at a deep node of the alkaline
      phosphatase family. The donor list spans bacterial, fungal and vertebrate
      members including E. coli PhoA (P00634), all four human isozymes and rodent
      orthologues, which is the expected shape for an ancient enzymatic activity.
    action: ACCEPT
    reason: >-
      Correct and independently supported for the human protein by direct assay
      (PMID:1939159) and by the 1.8 A crystal structure of PLAP (PMID:11124260).
      The IBA is also at the right level of specificity: it names the chemistry
      without committing to a physiological substrate, which matters here because
      unlike ALPL, ALPP has no established physiological substrate.
    supported_by:
    - reference_id: PMID:11124260
      supporting_text: >-
        The crystal structure, determined at 1.8-A resolution, reveals that
        during evolution, only the overall features of the enzyme have been
        conserved with respect to Escherichia coli.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      PLAP is GPI-anchored to the outer leaflet of the plasma membrane, with the
      catalytic domain facing the extracellular space, so the plasma membrane is
      genuinely where the enzyme acts and is_active_in is the correct qualifier.
      UniProt records the GPI anchor at Asp506 with experimental evidence
      (PMID:2153284).
    action: ACCEPT
    reason: >-
      Ecto-orientation is shared across the whole family and is what makes these
      enzymes ectophosphatases. The narrower node used for this IBA
      (PTN000904735, seeded from ALPL plus rat and mouse orthologues) reflects
      the vertebrate GPI-anchored membrane form specifically, which is the right
      placement.
