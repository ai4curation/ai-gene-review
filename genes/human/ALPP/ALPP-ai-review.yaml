- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  review:
    summary: >-
      Two hits from the Rolland et al. proteome-scale binary interactome map:
      KRTAP5-9 (P26371) and KRTAP4-12 (Q9BQ66). Both partners are
      keratin-associated proteins, a small cysteine-rich family that is among the
      most frequently recovered and least biologically interpretable classes of
      partner in yeast two-hybrid screens.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0005515 with no functional interpretation is uninformative by the
      project's own curation standard, and here there is a specific reason for
      caution rather than a general one: both recovered partners are KRTAPs,
      cysteine-rich hair-matrix proteins with no plausible route to encountering
      a GPI-anchored ectoenzyme of the syncytiotrophoblast. The screen is a
      legitimate high-throughput resource and the rows are not fabricated, but
      they should not be read as evidence that PLAP has a protein-binding
      function.
    supported_by:
    - reference_id: PMID:25416956
      supporting_text: >-
        A proteome-scale map of the human interactome network.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: >-
      Roughly thirty partners from the HuRI reference binary interactome. The list
      is dominated by keratin-associated proteins (Q5T5A8, Q5T5B0, Q5T752,
      Q5T753, Q5T754, Q5T871, Q5TA76, Q5TA77, Q5TA81, Q5TCM9, P26371 and others),
      with the remainder mostly coiled-coil and zinc-finger proteins.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Same assessment as the other interactome row, and more strongly: a partner
      list of thirty proteins in which one sticky family predominates is the
      classic signature of assay-driven rather than biology-driven recovery.
      Nothing in the set suggests a real complex or an adapter role for PLAP, and
      no follow-up study has validated any of these interactions. If any partner
      is later confirmed, it should be annotated with a specific term rather than
      with the uninformative parent.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: >-
        A reference map of the human binary protein interactome.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:1939159
  qualifier: enables
  review:
    summary: >-
      Direct measurement of alkaline phosphatase activity for PLAP, GCAP, three
      site-directed GCAP mutants and six GCAP/PLAP chimeras expressed in COS-1
      cells. The study established that a single residue at position 429 accounts
      for the classical differential sensitivity of PLAP and GCAP to L-leucine,
      EDTA and heat.
    action: ACCEPT
    reason: >-
      Direct assay of the human enzyme, and unusually informative for isozyme
      annotation: it shows that PLAP and GCAP differ by only seven residues yet
      are biochemically distinguishable, and pins the difference to Glu429 in
      PLAP. This is the experimental basis for treating ALPP and ALPG as distinct
      entities rather than interchangeable ones.
    supported_by:
    - reference_id: PMID:1939159
      supporting_text: >-
        We report that the differential reactivity of PLAP and GCAP depends
        critically on a single amino acid at position 429. GCAP with Gly-429 is
        strongly inhibited by L-leucine, EDTA, and heat, whereas PLAP with
        Glu-429 is resistant.
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Curator sequence-similarity transfer from mouse intestinal AP (P15693) of
      the catalytic magnesium site. The claim is correct, but the evidence code
      understates what is available: the 1.8 A crystal structure of human PLAP
      itself resolves the metal ensemble, and UniProt cites PubMed:11124260
      directly for the Mg(2+) coordinating residues at positions 64, 177 and 333.
    action: ACCEPT
    reason: >-
      Magnesium is one of the three catalytic metals in every alkaline
      phosphatase active site and is required for activity, so this is a genuine
      molecular function rather than incidental metal association. A curator
      revisiting this row could upgrade it from ISS to IDA on the strength of the
      human structure; the term itself needs no change.
    additional_reference_ids:
    - PMID:11124260
    supported_by:
    - reference_id: PMID:11124260
      supporting_text: >-
        The location of the active site at the bottom of a large valley flanked
        by an interfacial crown-shaped domain and a domain containing an extra
        metal ion on the other side suggest that the substrate of PLAP could be a
        specific phosphorylated protein.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Sequence-similarity transfer of the two catalytic zinc sites. As with
      magnesium, UniProt annotates the coordinating residues (64, 114, 338, 342,
      379, 380, 454) with direct evidence from the human PLAP structure rather
      than by similarity.
    action: ACCEPT
    reason: >-
      The binuclear zinc centre performs the chemistry, polarising the substrate
      phosphate and activating the serine nucleophile, so this is core to the
      catalytic function. The transfer is correct and the underlying human
      structural evidence is stronger than the ISS code implies.
    additional_reference_ids:
    - PMID:11124260
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:15907827
  qualifier: located_in
  review:
    summary: >-
      Cell-surface localisation from a study of GPI-specific phospholipase D
      expression in chronic myeloid leukaemia. The cached record is abstract-only
      and the abstract discusses GPI-PLD, CD55 and CD59 without mentioning
      alkaline phosphatase; PLAP is a standard GPI-PLD substrate, so it was very
      plausibly used in the assays reported in the full text, but that cannot be
      confirmed from what is cached here.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localisation claim is certainly true of PLAP on independent grounds --
      it is a GPI-anchored ectoprotein and its plasma membrane residence is
      annotated several times over -- so there is no case for removing it, and
      the curator will have seen the full text. It is kept as non-core because
      GO:0009986 is a less precise statement than the plasma membrane rows
      already present, not because the evidence is doubted. See the reference
      review for the citation caveat.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:2133555
  qualifier: enables
  review:
    summary: >-
      The term is right but the citation is a poor fit for it. The cited paper is
      a mouse preimplantation-embryo study that used reverse transcription PCR to
      show which of the mouse alkaline phosphatase genes are transcribed; it
      measured transcripts, in mouse, and its subject gene is the mouse embryonic
      AP rather than human ALPP.
    action: ACCEPT
    reason: >-
      Accepted because the assertion itself -- that ALPP enables alkaline
      phosphatase activity -- is beyond doubt and is directly supported by
      PMID:1939159, PMID:11124260 and the EC assignment, and because the full
      text is not available to me and the curator may have drawn on data the
      abstract does not describe. But the abstract states its organism and method
      explicitly, so the mismatch is worth recording rather than passing over: a
      transcript survey in mouse embryos is not a direct assay of human PLAP
      activity, and this row should not be counted as independent experimental
      support. Flagged in the reference review accordingly.
    supported_by:
    - reference_id: PMID:2133555
      supporting_text: >-
        Oligonucleotide primers were constructed from the three sequences and
        used in the reverse transcription-polymerase chain reaction technique to
        establish that two of the three AP isozymes are transcribed during
        preimplantation development.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: NAS
  original_reference_id: PMID:3042787
  qualifier: enables
  review:
    summary: >-
      Non-traceable author statement from the paper that sequenced the human
      placental ALP gene, which identifies it as encoding "the classic heat-stable
      placental alkaline phosphatase" and situates it among the three
      chromosome-2 ALP genes.
    action: ACCEPT
    reason: >-
      A weak evidence code attached to a correct and, in this case, foundational
      claim: this is the paper that defined the gene. The activity is
      independently established by direct assay, so nothing rests on the NAS
      alone. The paper is also useful for the isozyme-discrimination problem that
      pervades this family, since it explicitly distinguishes placental ALP-1
      from placental ALP-2 (now ALPG) and from intestinal ALP.
    supported_by:
    - reference_id: PMID:3042787
      supporting_text: >-
        One of these genes (the placental ALP-1) encodes the classic heat-stable
        placental alkaline phosphatase.
- term:
    id: GO:0009897
    label: external side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:2153284
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation. Every location row in GOA says "plasma membrane"
      or "cell surface" without recording which face of the membrane the enzyme
      occupies, even though ecto-orientation is the defining topological fact
      about this protein. PLAP was in fact the model protein in which GPI
      anchoring was worked out: near-saturation mutagenesis of the
      cleavage/attachment site showed that the C-terminal hydrophobic peptide is
      removed and the glycolipid attached at Asp-484 of the mature protein
      (Asp506 in the UniProt precursor numbering), and that substitutions
      blocking that processing leave the protein stuck in the endoplasmic
      reticulum with very low activity.
    action: NEW
    reason: >-
      A GPI anchor places the entire mature protein on the exoplasmic leaflet, so
      PLAP acts on extracellular phosphomonoesters and can be released into
      circulation by phospholipase cleavage -- which is why serum PLAP is
      measurable at all and why it works as a tumour marker. GO:0009897 is a
      descendant of GO:0005886 and therefore consistent with every existing
      location row; it records what those rows leave unstated. The same annotation
      is proposed for ALPL, ALPI and ALPG, since ecto-orientation is common to the
      whole family.
    additional_reference_ids:
    - PMID:11124260
    supported_by:
    - reference_id: PMID:2153284
      supporting_text: >-
        The COOH-terminal domain of pre-pro-PLAP provides a signal for processing
        during which a largely hydrophobic 29-residue COOH-terminal peptide is
        removed, and the PI-G moiety is added to the newly exposed Asp-484
        terminus.
    - reference_id: PMID:2153284
      supporting_text: >-
        The bulk of the PLAP protein produced by category II mutants and some
        produced by category I mutants were sequestered within the cell,
        apparently in the endoplasmic reticulum (ER).
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. In addition to the catalytic Zn/Zn/Mg centre,
      mammalian alkaline phosphatases carry a structural calcium site that has no
      counterpart in the bacterial enzyme; UniProt annotates four
      calcium-coordinating residues in ALPP (238, 291, 292, 307) by similarity to
      ALPL, where the identity of the metal was established by synchrotron X-ray
      fluorescence. The PLAP structure paper itself describes the enzyme as having
      "a domain containing an extra metal ion" alongside the crown domain.
    action: NEW
    reason: >-
      GOA gives ALPP zinc and magnesium but not calcium, which leaves the
      mammalian-specific part of its metal complement unrecorded. The evidence is
      ISS rather than IDA because the metal's identity was determined in the
      paralogue rather than in ALPP, which is the honest code here. Note that this
      site is structural: as UniProt states for ALPL, calcium binding does not
      influence phosphatase activity, so this is a real but non-catalytic
      molecular function.
    additional_reference_ids:
    - PMID:11124260
    supported_by:
    - reference_id: PMID:11124260
      supporting_text: >-
        The location of the active site at the bottom of a large valley flanked
        by an interfacial crown-shaped domain and a domain containing an extra
        metal ion on the other side suggest that the substrate of PLAP could be a
        specific phosphorylated protein.
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:11124260
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. PLAP is an obligate homodimer; the crystal
      structure resolves an unusually intimate interface in which a long
      N-terminal alpha-helix from one monomer wraps around the other and a
      residue from one subunit reaches into the active site of its partner.
      UniProt records the homodimer with four independent experimental
      references.
    action: NEW
    reason: >-
      This is the one binding term in this family worth asserting, because the
      dimer is a functional rather than an incidental unit: the structure
      attributes the allosteric behaviour specific to mammalian alkaline
      phosphatases to the quality of that interface, and in the ALPL paralogue
      monomeric mutants are catalytically dead. Recording it makes the family's
      quaternary requirement explicit and gives the two uninformative GO:0005515
      rows something concrete to be contrasted with.
    supported_by:
    - reference_id: PMID:11124260
      supporting_text: >-
        Allostery is probably favored by the quality of the dimer interface, by a
        long N-terminal alpha-helix from one monomer that embraces the other one,
        and similarly by the exchange of a residue from one monomer in the active
        site of the other.
core_functions:
- description: >-
    PLAP is a GPI-anchored, homodimeric, Zn/Zn/Mg-dependent phosphomonoesterase
    displayed on the external face of the syncytiotrophoblast plasma membrane,
    where it hydrolyses phosphate monoesters at alkaline pH through a covalent
    phosphoseryl intermediate. Two features distinguish it from its paralogues:
    exceptional heat stability, and uncompetitive inhibition by L-amino acids
    conferred by Glu429 at the active site entrance. Its physiological substrate
    in the placenta is not established, so unlike ALPL it cannot be assigned a
    specific metabolic process, and the pyrophosphatase and mineralization
    functions of ALPL should not be transferred to it.
  molecular_function:
    id: GO:0004035
    label: alkaline phosphatase activity
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:1939159
    supporting_text: >-
      We report that the differential reactivity of PLAP and GCAP depends
      critically on a single amino acid at position 429. GCAP with Gly-429 is
      strongly inhibited by L-leucine, EDTA, and heat, whereas PLAP with Glu-429
      is resistant.
  - reference_id: PMID:11124260
    supporting_text: >-
      In the neighborhood of the catalytic serine, the orientation of Glu-429, a
      residue unique to PLAP, and the presence of a hydrophobic pocket close to
      the phosphate product, account for the specific uncompetitive inhibition of
      PLAP by l-amino acids, consistent with the acquisition of substrate
      specificity.
  - reference_id: file:human/ALPP/ALPP-deep-research-falcon.md
    supporting_text: >-
      The clearest native biological evidence instead places ALPP on the
      syncytiotrophoblast surface, with exceptionally strong induction toward
      term
  knowledge_gaps:
  - gap_statement: >-
      No physiological substrate has been established for placental alkaline
      phosphatase. Its in vitro specificity is broad, and the substrates that are
      firmly established for the family -- inorganic pyrophosphate and pyridoxal
      5'-phosphate -- were defined through ALPL rather than through experiments on
      the placental enzyme. The crystal structure's suggestion that the substrate
      might be a specific phosphorylated protein remains untested.
    boundary: >-
      What is firmly established is the chemistry and the topology: PLAP
      hydrolyses phosphate monoesters at alkaline pH via a phosphoseryl
      intermediate, requires two Zn(2+) and one Mg(2+), works as a homodimer, and
      is GPI-anchored on the external face of the syncytiotrophoblast membrane
      where it is one of the most strongly induced proteins at term. What is dark
      is which molecule it acts on there, and to what end.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
proposed_new_terms: []
suggested_questions:
- question: >-
    What does placental alkaline phosphatase actually dephosphorylate in the
    placenta? The enzyme is one of the most strongly induced transcripts at term
    and reaches very high abundance on the syncytiotrophoblast surface, yet no
    physiological substrate has been demonstrated. The crystal structure suggests
    a phosphorylated protein rather than a small molecule, on the basis of the
    active site sitting at the bottom of a valley flanked by the crown domain.
- question: >-
    Is there a phenotype associated with loss of ALPP? The gene is highly
    polymorphic and null or near-null alleles are recognised, which would make
    human genetics the most direct route to a function, but no clear
    ALPP-deficiency phenotype has been described. Does redundancy with ALPG, or
    with soluble enzymes, mask it?
- question: >-
    What accounts for the almost complete restriction of ALPP to placenta despite
    roughly 90 percent exonic identity with ALPI and ALPG, and what drives its
    ectopic reactivation in seminoma and other tumours? Understanding the
    switching between the three chromosome-2 genes would clarify how much of the
    isozyme divergence is regulatory rather than catalytic.
- question: >-
    Does PLAP have any physiologically meaningful protein partner? The two
    interactome-derived GO:0005515 rows are dominated by keratin-associated
    proteins and look assay-driven, leaving the question genuinely open rather
    than answered.
suggested_experiments:
- hypothesis: >-
    PLAP's physiological substrate is a phosphorylated protein or peptide
    presented at the syncytiotrophoblast surface, rather than a small-molecule
    phosphomonoester.
  description: >-
    Compare the extracellular phosphoproteome and phosphometabolome of term
    placental explants or trophoblast organoids with and without a selective ALPP
    inhibitor, or after ALPP knockout, using a heat step to separate PLAP
    activity from other alkaline phosphatases. Substrates whose phosphorylation
    state shifts specifically on ALPP loss would be the first direct candidates,
    and the design controls for the isozyme-confusion problem that has made most
    published ALP substrate work uninformative about ALPP specifically.
  experiment_type: comparative phosphoproteomics with genetic and pharmacological perturbation
- hypothesis: >-
    The seven residues that differ between PLAP and GCAP, and Glu429 in
    particular, tune substrate preference rather than only inhibitor sensitivity.
  description: >-
    Extend the chimera and point-mutant panel of PMID:1939159 by profiling
    purified PLAP, GCAP and the position-429 variants against a broad
    phosphomonoester substrate library under matched conditions. If Glu429
    alters substrate preference and not merely L-leucine and heat sensitivity,
    that would give the first functional rationale for maintaining two nearly
    identical genes.
  experiment_type: comparative enzyme kinetics on engineered variants
- hypothesis: >-
    The keratin-associated protein interactions reported for ALPP in binary
    interactome screens are assay artefacts and do not occur in trophoblast.
  description: >-
    Test the reported KRTAP partners by co-immunoprecipitation and proximity
    labelling from term placental tissue and trophoblast cell lines, where both
    proteins would have to be co-expressed and topologically accessible for the
    interaction to be real. A negative result would justify demoting the two
    GO:0005515 rows outright rather than merely flagging them as over-annotated.
  experiment_type: interaction validation in a physiological cell type
