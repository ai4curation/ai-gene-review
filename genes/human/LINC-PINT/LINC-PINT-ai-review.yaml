core_functions:
- description: Nuclear circRNA-encoded peptide that represses transcription of RNA polymerase II target
    genes without binding DNA, by engaging transcriptional regulators. It binds PAF1 and promotes retention
    of the PAF1 complex at target promoters (CPEB1, SOX2, MYC), and binds the DNA-binding domain of FOXM1
    to reduce FOXM1-driven transcription (e.g. PHB2). No GO term captures the PAF1-complex interaction;
    the FOXM1 interaction is captured as DNA-binding transcription factor binding.
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:30367041
    supporting_text: PINT87aa overexpression or knocking down enhanced or decreased PAF1/CPEB1 promoter
      affinity, respectively
  - reference_id: PMID:30367041
    supporting_text: Further 2nd ChIP assay showed that PINT87aa and PAF1 were co-occupied in CPEB1 promoter
  - reference_id: PMID:33754036
    supporting_text: PINT87aa could bind to the DNA-binding domain of FOXM1, which was confirmed by co-IP
      results, indicating that PINT87aa-GFP and FOXM1 interacted with each other
  - reference_id: PMID:33754036
    supporting_text: found no significant change in FOXM1 mRNA and protein levels under PINT87aa overexpression
suggested_questions:
- question: Does PINT87aa act as a transcription corepressor (GO:0003714) in the GO sense, i.e. is it
    recruited to FOXM1-bound loci and does it reduce FOXM1 occupancy or activity there, or does it sequester
    FOXM1 off chromatin?
- question: Does PINT87aa slow RNA polymerase II elongation directly (e.g. increased promoter-proximal
    pausing at PAF1 targets), which would justify the more specific term negative regulation of transcription
    elongation by RNA polymerase II (GO:0034244)?
- question: How do the PAF1 and FOXM1 interactions relate; are they mediated by the same arginine-rich
    N-terminal region (PAF1-critical residues R20-S53; FOXM1-binding residues 30-36)?
- question: Has the peptide been detected in independent proteomic or ribosome-profiling datasets, and
    by laboratories other than the originating group?
suggested_experiments:
- hypothesis: PINT87aa, not the circRNA or linear lncRNA, mediates repression of PAF1 and FOXM1 targets.
  description: Mutate the PINT87aa start codon or introduce a frameshift in endogenous circPINTexon2 (preserving
    back-splicing and RNA levels), then measure PAF1/FOXM1 promoter occupancy, Pol II pausing (PRO-seq)
    and target expression, with rescue by wild-type versus binding-deficient (delta30-36) peptide.
  experiment_type: genome editing with peptide-specific loss of function and rescue
- hypothesis: PINT87aa forms a direct, stoichiometric complex with PAF1 complex and FOXM1 in cells at
    endogenous levels.
  description: Endogenous co-IP and proximity labelling (e.g. TurboID-tagged knock-in) in non-transformed
    cells (neural progenitors, hepatocytes), avoiding overexpression.
  experiment_type: endogenous interaction proteomics
