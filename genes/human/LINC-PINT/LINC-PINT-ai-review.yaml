taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PINT87aa is an 87-amino-acid nuclear peptide encoded within the long intergenic non-protein-coding
  RNA locus LINC-PINT (p53-induced transcript). It is not translated from the linear lncRNA: exon 2 of
  LINC-PINT is back-spliced into a predominantly cytoplasmic circular RNA (circPINTexon2), from which an
  internal open reading frame is translated cap-independently via an internal ribosome entry site. The
  endogenous peptide has been detected by antibody and mass spectrometry. The sequence is arginine-rich,
  contains a run of seven cysteines, and has no recognised domain outside its own Pfam family. In the
  nucleus PINT87aa binds the PAF1 subunit of the RNA polymerase II-associated factor (PAF1) complex, co-occupies
  target promoters with PAF1, and is proposed to retain PAF1 complex at promoters and thereby restrain
  transcription of PAF1-dependent genes such as CPEB1, SOX2 and MYC; it does not bind DNA itself. It also
  binds the DNA-binding domain of the forkhead transcription factor FOXM1 and reduces FOXM1-driven transcription
  of targets including PHB2. Overexpression suppresses proliferation of glioblastoma cells and induces
  growth arrest, senescence and reduced mitophagy in hepatocellular carcinoma cells; the peptide and its
  circRNA are expressed in brain, liver, kidney and stomach and are lower in glioblastoma and HCC than
  in non-tumour tissue. Functions reported for the linear LINC-PINT RNA (e.g. miRNA sponging, chromatin
  regulator recruitment) are separate from those of the peptide.'
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:30367041
  qualifier: involved_in
  review:
    summary: PINT87aa overexpression lowers, and knockdown raises, PAF1 occupancy at the CPEB1 promoter;
      overexpression represses mRNA of PAF1 target genes (CPEB1, SOX2, MYC) in glioblastoma tumour-initiating
      cells. Knockdown of the linear lncRNA does not affect these targets, so the effect is attributable
      to the circRNA-encoded peptide.
    action: ACCEPT
    reason: Gain- and loss-of-function data in the founding paper, together with direct PAF1 binding and
      promoter co-occupancy, support a role in repressing RNA polymerase II target genes. The independent
      FOXM1/PHB2 mechanism in HCC (PMID:33754036) points in the same direction. The more specific term
      negative regulation of transcription elongation by RNA polymerase II (GO:0034244) would go beyond
      the data, since Pol II elongation or pausing was not measured directly and the anchoring model is
      stated as an assumption. Caveat - all evidence comes from one research group, mostly with overexpression.
    supported_by:
    - reference_id: PMID:30367041
      supporting_text: PINT87aa overexpression or knocking down enhanced or decreased PAF1/CPEB1 promoter
        affinity, respectively
    - reference_id: PMID:30367041
      supporting_text: The mRNA of PAF1 downstream genes, including CPEB1, SOX-2, c-Myc, etc., was inhibited
        transcriptionally
    - reference_id: PMID:30367041
      supporting_text: LINC-PINT knockdown in SW1783 and Hs683 cells using specific ASOs increased cell
        viability but did not alter PAF1 downstream gene mRNA or protein levels
    - reference_id: PMID:33754036
      supporting_text: We confirmed that FOXM1 could promote the transcription of PHB2 and a negative regulatory
        effect of PINT87aa on PHB2 expression
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:30367041
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N7H5
  review:
    summary: Interaction with PAF1 (Q8N7H5), shown by IP-MS, co-IP in 293T cells and a purified-protein
      binding assay mapping the site to PAF1 residues 150-300.
    action: REMOVE
    reason: The PAF1 interaction is well supported and central to the proposed mechanism, but bare protein
      binding is uninformative. No GO molecular function term fits binding to the PAF1 elongation complex
      (PAF1 is not a DNA-binding transcription factor, so GO:0140297 does not apply). The biological consequence
      is captured by GO:0000122 and the nuclear location.
    supported_by:
    - reference_id: PMID:30367041
      supporting_text: A direct binding assay using purified proteins further indicated that PINT87aa interacts
        with the 150–300-aa domain of PAF1
    - reference_id: PMID:30367041
      supporting_text: Immunoprecipitation further confirmed a mutual PINT87aa/PAF1 interaction in 293T
        cells
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33754036
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q08050
  review:
    summary: Interaction with the forkhead transcription factor FOXM1 (Q08050), mapped to the FOXM1 DNA-binding
      domain; co-IP with a GFP-only negative control, and deletion of PINT87aa residues 30-36 abolishes binding.
    action: MODIFY
    reason: FOXM1 is a sequence-specific DNA-binding transcription factor and PINT87aa binds its DNA-binding
      domain, so DNA-binding transcription factor binding is a more informative term than protein binding.
      The binding is linked to reduced FOXM1-target transcription (PHB2) without change in FOXM1 levels.
    proposed_replacement_terms:
    - id: GO:0140297
      label: DNA-binding transcription factor binding
    supported_by:
    - reference_id: PMID:33754036
      supporting_text: PINT87aa could bind to the DNA-binding domain of FOXM1, which was confirmed by co-IP
        results, indicating that PINT87aa-GFP and FOXM1 interacted with each other
    - reference_id: PMID:33754036
      supporting_text: The co-IP results showed no interaction between the truncated PINT87aa-GFP and FOXM1
