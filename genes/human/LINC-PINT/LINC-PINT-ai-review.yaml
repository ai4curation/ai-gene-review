references:
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
- id: PMID:30367041
  title: A peptide encoded by circular form of LINC-PINT suppresses oncogenic transcriptional elongation
    in glioblastoma.
  findings:
  - statement: PINT87aa is translated via an IRES from circPINTexon2, a circRNA formed by back-splicing
      of LINC-PINT exon 2, and the endogenous peptide is detected by IP-MS.
    supporting_text: Endogenous immunoprecipitation using this antibody followed by LC-MS/MS in 293T cells
      further confirmed that the 10-kDa peptide sequences matched the predicted 87-aa sORF
  - statement: The coding circRNA is cytoplasmic whereas the linear lncRNA is nuclear.
    supporting_text: linear LINC-PINT largely localized to the nucleus, whereas circPINTexon2 was mostly
      cytoplasmic
  - statement: PINT87aa directly binds PAF1 and co-occupies the CPEB1 promoter with it; it is proposed
      to anchor PAF1 complex at promoters and pause Pol II elongation.
    supporting_text: We assumed that PINT87aa may work as an anchor and keep PAF1 complex on target genes’
      promoter, which sequentially pauses Pol II-induced mRNA elongation
  - statement: PINT87aa does not bind DNA itself.
    supporting_text: Although no evidence showed that PINT87aa directly binds to DNA and act as a transcription
      factor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper (Nat Commun 2018, PMC6203777); full text cached and read. PMID confirmed
      via PubMed E-utilities and the UniProt entry. Source of the PAF1 IPI, nucleus IDA and GO:0000122
      IMP annotations. Mostly overexpression in glioblastoma lines; elongation was inferred, not measured.
- id: PMID:33754036
  title: Cellular senescence in hepatocellular carcinoma induced by a long non-coding RNA-encoded peptide
    PINT87aa by blocking FOXM1-mediated PHB2.
  findings:
  - statement: PINT87aa binds the DNA-binding domain of FOXM1 and reduces FOXM1-driven PHB2 transcription,
      leading to reduced mitophagy and senescence of HCC cells when overexpressed.
    supporting_text: We confirmed that FOXM1 could promote the transcription of PHB2 and a negative regulatory
      effect of PINT87aa on PHB2 expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC7978318) and read; source of the FOXM1 IPI row. Shares authors
      (Zhang N, Zhao K) with PMID:30367041, so not independent replication. Senescence and mitophagy are
      overexpression phenotypes in tumour cell lines.
