- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002835170
  - UniProtKB:Q96DE5
  review:
    summary: Part of the anaphase-promoting complex. APC16 is a constitutive APC/C subunit; accepted.
    action: ACCEPT
    reason: 'APC16 is a constitutive human APC/C subunit needed for activity toward mitotic substrates
      [PMID:20392738 "APC16 is a bona fide subunit of human APC/C: it is present in APC/C complexes throughout
      the cell cycle, the phenotype of APC16-depleted cells copies depletion of other APC/C subunits,
      and APC16 is important for APC/C activity towards mitotic substrates."]. Structurally it binds the
      APC3 dimer and recruits APC7 [PMID:25490258 "The structures show how one APC16 binds asymmetrically
      to the symmetric APC3 dimer and, together with biochemistry and prior data, explain how APC16 recruits
      APC7 to APC3"].'
    supported_by:
    - reference_id: PMID:20392738
      supporting_text: 'APC16 is a bona fide subunit of human APC/C: it is present in APC/C complexes
        throughout the cell cycle, the phenotype of APC16-depleted cells copies depletion of other APC/C
        subunits, and APC16 is important for APC/C activity towards mitotic substrates.'
    - reference_id: PMID:25490258
      supporting_text: The structures show how one APC16 binds asymmetrically to the symmetric APC3 dimer
        and, together with biochemistry and prior data, explain how APC16 recruits APC7 to APC3
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC16 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
