- id: PMID:20392738
  title: APC16 is a conserved subunit of the anaphase-promoting complex/cyclosome.
  findings:
  - statement: APC16 is a constitutive human APC/C subunit needed for activity.
    supporting_text: 'APC16 is a bona fide subunit of human APC/C: it is present in APC/C complexes throughout
      the cell cycle, the phenotype of APC16-depleted cells copies depletion of other APC/C subunits,
      and APC16 is important for APC/C activity towards mitotic substrates.'
  - statement: APC16 homologs occur in metazoans, not fungi.
    supporting_text: APC16 sequence homologues can be identified in metazoans, but not fungi, by four
      conserved primary sequence stretches.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Founding identification of human APC16.
- id: PMID:21775471
  title: emb-1 encodes the APC16 subunit of the Caenorhabditis elegans anaphase-promoting complex.
  findings:
  - statement: emb-1/APC16 loss arrests worm embryos at meiosis I metaphase.
    supporting_text: temperature-sensitive mutants of emb-1 arrest as one-cell embryos in metaphase of
      meiosis I in a manner that is indistinguishable from embryos that have been depleted of known subunits
      of the anaphase-promoting complex or cyclosome (APC/C)
  - statement: emb-1 is needed for germline mitotic proliferation.
    supporting_text: In addition to its meiotic function, emb-1 is required for mitotic proliferation
      of the germline.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. C. elegans genetics.
- id: PMID:25490258
  title: 'Structure of an APC3-APC16 complex: insights into assembly of the anaphase-promoting complex/cyclosome.'
  findings:
  - statement: One APC16 binds the APC3 dimer and recruits APC7.
    supporting_text: The structures show how one APC16 binds asymmetrically to the symmetric APC3 dimer
      and, together with biochemistry and prior data, explain how APC16 recruits APC7 to APC3
  - statement: APC16 is in the Arc Lamp with CDC26 and APC13.
    supporting_text: The Arc Lamp contains the small subunits APC16, CDC26, and APC13, and tetratricopeptide
      repeat (TPR) proteins (APC7, APC3, APC6, and APC8) that homodimerize and stack with quasi-2-fold
      symmetry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. APC3-APC16 crystal structure.
- id: PMID:20813266
  title: The protein composition of mitotic chromosomes determined using multiclassifier combinatorial
    proteomics.
  findings:
  - statement: CENP-27/APC16 clusters with the APC/C.
    supporting_text: Interestingly, our clustering sorted CENP-27 as a component of the APC/C.
  - statement: The new centromere proteins localize to the outer kinetochore.
    supporting_text: The new centromere proteins all appeared to localize to the outer kinetochore, relative
      to CENP-C and HEC1 as standards
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Mitotic chromosome proteomics; APC16 named CENP-27.
- id: PMID:29033132
  title: Assembly and Function of Heterotypic Ubiquitin Chains in Cell-Cycle and Protein Quality Control.
  findings:
  - statement: K11/K48-branched chains are made by essential ligases.
    supporting_text: We show that K11/K48-linked chains are synthesized and processed by essential ubiquitin
      ligases and effectors
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Complex-level assay.
- id: PMID:16364912
  title: Localization of the coactivator Cdh1 and the cullin subunit Apc2 in a cryo-electron microscopy
    model of vertebrate APC/C.
  findings:
  - statement: The APC/C has essential roles in mitosis, meiosis and G1.
    supporting_text: essential functions in mitosis, meiosis, and G1 phase of the cell cycle
