id: Q96DE5
gene_symbol: ANAPC16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC16 (APC16, also called CENP-27) is a small, metazoan-specific subunit of the anaphase-promoting
  complex/cyclosome (APC/C), the E3 ubiquitin ligase that drives mitotic and meiotic progression by marking
  cyclins, securin and other cell-cycle regulators for proteasomal destruction. It is present in the APC/C
  throughout the cell cycle. In the TPR lobe (Arc Lamp) of the complex, one APC16 binds the APC3 homodimer
  and recruits APC7. APC16 is needed for APC/C activity toward mitotic substrates, and loss of the C.
  elegans ortholog emb-1 arrests embryos in metaphase of meiosis I. A mitotic pool of APC16 is found at
  the outer kinetochore.
existing_annotations:
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002835170
  - UniProtKB:Q96DE5
  review:
    summary: Kinetochore (IBA). APC16 was found at the outer kinetochore as CENP-27; kept as non-core,
      since this reflects the mitotic kinetochore pool of the APC/C.
    action: KEEP_AS_NON_CORE
    reason: In a chromosome proteomics screen, APC16 (named CENP-27) was sorted with the APC/C [PMID:20813266
      "Interestingly, our clustering sorted CENP-27 as a component of the APC/C."], and the newly tagged
      centromere proteins, CENP-27 among them, localized to the outer kinetochore [PMID:20813266 "The
      new centromere proteins all appeared to localize to the outer kinetochore, relative to CENP-C and
      HEC1 as standards"]. The APC/C is recruited to kinetochores in mitosis, so this is a sub-location
      of the complex, not a distinct APC16 function.
    supported_by:
    - reference_id: PMID:20813266
      supporting_text: Interestingly, our clustering sorted CENP-27 as a component of the APC/C.
    - reference_id: PMID:20813266
      supporting_text: The new centromere proteins all appeared to localize to the outer kinetochore,
        relative to CENP-C and HEC1 as standards
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      residue_claims_not_applicable: APC16 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
