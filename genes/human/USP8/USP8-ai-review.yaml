      its localization to endosomes.
  - reference_id: PMID:16520378
    supporting_text: UBPY function is essential for growth factor receptor down-regulation
- molecular_function:
    id: GO:0071889
    label: 14-3-3 protein binding
  description: Phosphorylation of Ser718 creates a 14-3-3-binding motif; bound 14-3-3 stabilises the autoinhibited
    conformation of USP8 and keeps it in the cytosol. Cushing disease hotspot mutations disrupt this motif
    and derepress catalytic activity.
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
