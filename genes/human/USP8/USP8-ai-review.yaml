- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:35271311
  qualifier: enables
  supporting_entities:
  - UniProtKB:P63104
  review:
    summary: USP8 binds the 14-3-3 protein YWHAZ; the interaction is mediated by the phospho-Ser718 14-3-3-binding
      motif of USP8 and is reproduced across targeted and proteome-scale studies.
    action: MODIFY
    reason: Generic protein binding is uninformative. The partner (YWHAZ) is a 14-3-3 protein, and USP8
      carries a phosphorylation-dependent 14-3-3-binding motif (Ser718) that restrains its catalytic activity
      and is the hotspot for Cushing disease mutations. The interaction is therefore recorded with the
      informative term 14-3-3 protein binding (GO:0071889). This is a regulatory binding activity, not
      the core catalytic function.
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
