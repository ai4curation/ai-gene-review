- term:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  evidence_type: IDA
  original_reference_id: PMID:18728397
  qualifier: enables
  review:
    summary: The cited paper screened deubiquitinating enzymes and tested ubiquitin-protease activity
      of USP39; the abstract does not mention USP8, but the curator read the full text, which is not cached
      here.
    action: ACCEPT
    reason: The abstract foregrounds USP39 (shown to lack DUB activity), and active USP-family enzymes
      are typically assayed alongside as comparators in such work; the curator who made this IDA had the
