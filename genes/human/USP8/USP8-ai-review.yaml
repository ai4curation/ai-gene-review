    summary: EPAS1 co-purifies with USP8; HIF1A is reported as a USP8 deubiquitination substrate.
    action: REMOVE
    reason: Generic protein binding is uninformative. Binding to EPAS1 reflects an enzyme-substrate relationship
      that is better represented by the cysteine-type deubiquitinase activity and protein deubiquitination
      annotations. Removal does not imply the interaction is false.
    supported_by:
    - reference_id: file:human/USP8/USP8-uniprot.txt
