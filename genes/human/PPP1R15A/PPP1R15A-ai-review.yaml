  findings:
  - statement: PP1 docks near the GADD34 C terminus (residues 483-619), in the region homologous to the HSV-1 ICP34.5
      virulence factor.
    supporting_text: affinity isolation of cellular GADD34/PP1 complexes showed that PP1 bound near the C terminus
      of GADD34 (amino acids 483 to 619), a region that shows sequence homology with the virulence factors ICP34.5
      of herpes simplex virus and NL-S of avian sarcoma virus
    reference_section_type: ABSTRACT
  - statement: The regulation is substrate-directed, since GADD34 inhibits PP1 action on phosphorylase a while the
      GADD34-bound PP1 is an active eIF2alpha phosphatase.
    supporting_text: While GADD34 inhibited PP1-catalyzed dephosphorylation of phosphorylase a, the GADD34-bound
      PP1 was an active eIF-2alpha phosphatase.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
