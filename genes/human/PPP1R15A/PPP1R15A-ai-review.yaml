    reticulum and promotes dephosphorylation of the alpha subunit of eukaryotic translation initiation factor 2.
  findings:
  - statement: Human GADD34 reverses ER-stress-induced eIF2alpha phosphorylation in cells, and the effect requires
      a bipartite C-terminal PP1-docking element (KVRF plus RARA).
    supporting_text: Structure-function studies identified a bipartite C-terminal domain in GADD34 that encompassed
      a canonical PP1-binding motif, KVRF, and a novel RARA sequence, both of which were required for PP1 binding.
    reference_section_type: ABSTRACT
  - statement: The N-terminal 180 residues target GADD34 to the ER, and GADD34 relocalizes PP1alpha there.
    supporting_text: Imaging of green fluorescent protein (GFP)-GADD34 proteins showed that the N-terminal 180 residues
      directed the localization of GADD34 at the ER and that GADD34 targeted the alpha isoform of PP1 to the ER.
    reference_section_type: ABSTRACT
  - statement: PP1 binding is necessary but not sufficient for eIF2alpha dephosphorylation in cells, pointing to
      a second required determinant later identified as the substrate-binding region.
    supporting_text: N-terminal deletions of GADD34 established that while PP1 binding was necessary, it was not
      sufficient to promote eIF-2 alpha dephosphorylation in cells.
