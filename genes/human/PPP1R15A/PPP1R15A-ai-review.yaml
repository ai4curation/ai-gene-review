core_functions:
- description: Stress-induced targeting subunit that assembles the eIF2alpha holophosphatase. It docks the PP1 catalytic
    subunit through a bipartite C-terminal KVRF/RARA element and binds phospho-eIF2alpha through a separate conserved
    central region, bringing the enzyme and its substrate together and so giving PP1 a selectivity for phospho-Ser51
    of eIF2alpha that the free catalytic subunit lacks. Because GADD34 is translated only when eIF2alpha is already
    phosphorylated, this terminates the integrated stress response, restoring cap-dependent initiation and attenuating
    PERK-branch signalling.
  molecular_function: *id020
  contributes_to_molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  directly_involved_in:
  - *id018
  - id: GO:0036490
    label: regulation of translation in response to endoplasmic reticulum stress
  - id: GO:1903898
    label: negative regulation of PERK-mediated unfolded protein response
  in_complex:
    id: GO:0000164
    label: protein phosphatase type 1 complex
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id003
  - *id022
  - *id014
  - *id016
  knowledge_gaps:
  - gap_statement: What sets the dwell time of the GADD34:PP1 holophosphatase on phospho-eIF2alpha, and hence how
      the depth and duration of the translational shut-off are tuned, is undetermined. No affinity, turnover number
      or competing partner has been measured for the assembled holoenzyme against its physiological substrate.
    boundary: 'The PP1-docking element and the substrate-binding region are both mapped, their independence is established
      structurally, and G-actin has been excluded as the specificity factor. What is missing is quantitative: how
      fast the complex works on phospho-eIF2alpha in vivo, and what competes for either site.'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    significance: This is the parameter that decides whether a stressed cell recovers or proceeds to death, since
