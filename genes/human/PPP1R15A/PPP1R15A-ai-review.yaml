  knowledge_gaps:
  - gap_statement: What the ER-localized pool of GADD34 does that the soluble pool cannot is undetermined, and so
      is the mechanism by which GADD34 distends the ER. Candidate answers - local control of ER-resident substrates,
      regulated turnover, delivery of PP1alpha away from competing targeting subunits - have not been discriminated
      experimentally.
    boundary: 'The targeting determinant is mapped to single residues on each face of the amphipathic helix, the
      insertion is known to be monotopic and cytoplasmic-side, and ER association is known to accelerate GADD34
      turnover. What is established not to depend on it is the phosphatase function itself: the largely cytosolic
      V25R mutant still assembles a working holoenzyme.'
