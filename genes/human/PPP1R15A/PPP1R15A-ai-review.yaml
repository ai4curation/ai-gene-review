- description: Membrane-targeting and enzyme-delivery function. An N-terminal amphipathic helix (residues 22-39)
    inserts monotopically into the cytoplasmic leaflet of the ER membrane via its hydrophobic face, and into the
    mitochondrial outer membrane via its polar face, carrying PP1alpha to the ER surface. This confines the phosphatase
    activity spatially, so that PP1 substrates away from the ER are unaffected, and it governs GADD34's own proteasomal
    turnover and its effect on ER morphology.
