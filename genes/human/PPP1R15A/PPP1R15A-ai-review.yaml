description: 'PPP1R15A (GADD34) is a stress-inducible, non-catalytic targeting subunit of protein phosphatase 1.
  Its C-terminal bipartite module, a canonical KVRF motif together with an adjacent RARA sequence, docks the PP1
  catalytic subunit, preferentially PP1alpha/PPP1CA, while a separate conserved central region binds the substrate
  eIF2alpha. Because the two interactions are independent, GADD34 works as an adaptor that gives PP1 a selectivity
  for phospho-Ser51 of eIF2alpha that the free catalytic subunit does not have. An N-terminal amphipathic helix
  inserts monotopically into the cytoplasmic leaflet of the endoplasmic reticulum membrane, and through the polar
  face of the same helix into the mitochondrial outer membrane, so the holophosphatase is assembled on the ER surface
  and PP1alpha is recruited there; a soluble cytosolic pool also exists and remains active. GADD34 is transcribed
  downstream of ATF4 and CHOP and translated only when eIF2alpha is phosphorylated, its 5''UTR upstream open reading
  frames gating expression, and it is then degraded rapidly by the proteasome. It therefore forms the negative-feedback
  arm of the integrated stress response, terminating the translational shut-off, damping PERK-mediated unfolded
  protein response signalling and restoring cap-dependent initiation. The same scaffolding chemistry is reused for
  other enzyme-substrate pairs, including Smad7-directed dephosphorylation of the TGF-beta type I receptor and CK1epsilon-directed
  phosphorylation of TDP-43 under chronic oxidative stress. Downstream consequences of restoring translation are
  pleiotropic and context-dependent: GADD34 permits lysosomal biogenesis and sustained autophagic flux during starvation,
  can allow pro-apoptotic proteins to accumulate during unresolved ER stress, and acts as an NF-kB-stimulated restriction
  factor against influenza A virus and HIV-1.'
