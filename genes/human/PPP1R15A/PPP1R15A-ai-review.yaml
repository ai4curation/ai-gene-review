suggested_questions:
- question: >-
    Does GADD34 inhibit influenza A virus RNA polymerase directly, or does restriction depend on its PP1-targeting
    activity toward eIF2alpha or another substrate?
- question: >-
    Several IPI rows (DisProt) for PPP1R15A and PPP1R15B list UniProtKB:Q9BY44 (EIF2A, eIF-2A) as the
    eIF2 partner; should these be repointed to EIF2S1 (P05198)?
suggested_experiments:
- description: >-
    Test PP1-binding-deficient (KVRF/RARA) and substrate-binding-deficient GADD34 mutants for influenza
    A restriction and polymerase activity in minigenome assays.
  hypothesis: >-
    GADD34 restricts influenza through PP1-mediated dephosphorylation of a specific substrate rather than
    by binding the viral polymerase.
