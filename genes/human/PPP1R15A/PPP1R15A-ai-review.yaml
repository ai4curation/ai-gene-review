suggested_questions:
- question: GADD34 is required for lysosomal biogenesis and sustained autophagic flux during starvation, but it
    performs no step of autophagy itself; it permits translation of the proteins that do. Is there a GO-sanctioned
    way to record such a permissive translational licence, or should it stay out of the annotation and live only
    in a pathway model?
- question: GO:0032058 (positive regulation of translational initiation in response to stress) is not currently
    a descendant of GO:0043558 (regulation of translational initiation in response to stress), although its name
    and definition suggest it should be. Is that placement deliberate, and if not, should GO:0032058 be re-parented?
- question: GADD34 scaffolds a kinase and its substrate (CK1epsilon and TDP-43) as well as a phosphatase and its
    substrate (PP1 and eIF2alpha). Should the two be captured as one enzyme-substrate adaptor activity with different
    clients, or as separate molecular functions?
- question: Both PPP1R15A and PPP1R15B target PP1 to eIF2alpha, one stress-induced and one constitutive. Do they
    differ in substrate repertoire beyond eIF2alpha, and is the paralog-specific determinant the substrate-binding
    region or the membrane anchor?
suggested_experiments:
- hypothesis: The selectivity of the GADD34:PP1 holophosphatase for phospho-eIF2alpha is set entirely by the mapped
    substrate-binding region of GADD34, with no contribution from a third factor.
  description: Reconstitute PP1alpha with full-length GADD34 and with the R15A 325-674 fragment, and measure steady-state
    kinetics against phospho-eIF2alpha and against a panel of other PP1 phospho-substrates (phosphorylase a, a TGFBR1
    phosphopeptide, phospho-TDP-43). Compare with holoenzymes carrying substrate-binding-region point mutants, to
    test whether specificity tracks with that region alone.
  experiment_type: in vitro reconstitution and enzyme kinetics
- hypothesis: The ER-localized pool of GADD34 has a function distinct from the soluble pool, beyond controlling
    its own turnover.
  description: Compare GADD34-null cells reconstituted with wild-type GADD34, with the cytosolic V25R mutant, and
    with a V25R variant fused to an orthogonal ER anchor, under ER, oxidative and amino-acid stress. Read out phospho-eIF2alpha
    kinetics, ATF4 and CHOP induction, ribosome profiling, ER morphology and survival, so that loss of ER targeting
    is separated from loss of the degradation signal.
  experiment_type: genetic complementation and translational profiling
- hypothesis: GADD34 restricts influenza A virus through its RNA-polymerase-inhibitor activity and not through its
    eIF2alpha phosphatase function.
  description: Test influenza A restriction in GADD34-null cells reconstituted with wild-type GADD34, with a PP1-binding-deficient
    mutant (VRF to ARA), with a substrate-binding-region deletion, and with the N-terminal 1-192 fragment that suffices
    for HIV-1 restriction. Measure viral polymerase activity in a minigenome assay alongside viral titre, which
    would also show whether the influenza and HIV-1 mechanisms coincide.
  experiment_type: virology and structure-function complementation
