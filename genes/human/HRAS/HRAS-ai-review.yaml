      Bare protein binding is uninformative. PDEdelta is a prenyl-binding solubilizing factor;
      the relationship is a lipid-anchor chaperone interaction without a more specific HRAS
      molecular function. Removal does not mean the interaction is false; it reflects the lack
      of functional information carried by bare GO:0005515, and the interaction remains recorded
      in the interaction databases and UniProt.
- term:
    id: GO:0050679
    label: positive regulation of epithelial cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:20154697
  review:
    summary: >-
      Activation of Ras (via DAB2IP/RasGAP loss) promotes prostate epithelial
      proliferation and metastasis, a downstream cancer-context phenotype.
    action: KEEP_AS_NON_CORE
    reason: >-
      Epithelial proliferation here arises from loss of the RasGAP DAB2IP in a
      metastatic prostate cancer model; it is a context-dependent downstream
      output rather than a core wild-type HRAS function.
    supported_by:
    - reference_id: PMID:20154697
      supporting_text: >-
        loss of the Ras GTPase-activating protein (RasGAP) gene DAB2IP induces
        metastatic prostate cancer in an orthotopic mouse tumor model.
- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IDA
  original_reference_id: PMID:9765203
  review:
    summary: >-
      Sustained Ras/MEK-MAPK signaling can promote proliferation, a
      context-dependent downstream outcome.
    action: KEEP_AS_NON_CORE
    reason: >-
      Proliferation is a canonical but context-dependent Ras output; the cited
      study links constitutive MEK/MAPK signaling to proliferation/senescence
      depending on context, so it is non-core.
    supported_by:
    - reference_id: file:human/HRAS/HRAS-deep-research-falcon.md
      supporting_text: >-
        RAS-ERK signaling dynamics can bias proliferation versus differentiation
        outputs, but these outcomes depend strongly on cell type and signaling
        kinetics.
- term:
    id: GO:0043410
    label: positive regulation of MAPK cascade
  evidence_type: IDA
  original_reference_id: PMID:9765203
  review:
    summary: >-
      HRAS positively regulates the MAPK cascade, a core proximal Ras output.
    action: ACCEPT
    reason: >-
      Positive regulation of the MAPK (RAF-MEK-ERK) cascade is the canonical
      proximal signaling output of HRAS-GTP and is a core process.
    supported_by:
    - reference_id: file:human/HRAS/HRAS-deep-research-falcon.md
      supporting_text: >-
        RAS proteins sit at the apex of the **RAF–MEK–ERK (MAPK) cascade**, and
        Ras-effector binding directly routes signals into MAPK outputs.
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IDA
  original_reference_id: PMID:17260967
  review:
    summary: >-
      HRAS binds GTP; the cited reference uses HRAS as a reference Ras-like GTP
      binding protein when characterizing the LRRK2 ROC domain.
    action: ACCEPT
    reason: >-
      GTP binding is a core, well-established molecular function of HRAS,
      regardless of the comparative context of the citing paper.
    supported_by:
    - reference_id: file:human/HRAS/HRAS-deep-research-falcon.md
      supporting_text: >-
        HRAS is a canonical RAS small GTPase that binds GDP/GTP with high
        affinity and functions as a nucleotide-dependent molecular switch.
- term:
    id: GO:0008285
    label: negative regulation of cell population proliferation
  evidence_type: IDA
  original_reference_id: PMID:9054499
  review:
    summary: >-
      Oncogenic Ras can negatively regulate proliferation by triggering
      premature senescence/G1 arrest in primary cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      This anti-proliferative (senescence) output is an oncogenic-Ras,
      context-dependent phenotype in primary cells and is not a core wild-type
      HRAS function.
    supported_by:
    - reference_id: PMID:9054499
      supporting_text: >-
        The arrest induced by ras is accompanied by accumulation of p53 and p16,
        and is phenotypically indistinguishable from cellular senescence.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11022048
  review:
    summary: >-
      IPI evidence that GTP-bound Ha-Ras binds the Ras-associating domain of phospholipase C
      epsilon (PLCE1, Q9P212) and stimulates its PIP2-hydrolysing activity.
    action: MODIFY
    reason: >-
      Bare protein binding is uninformative. PLCepsilon is an enzyme effector of Ras, so the
      interaction is better captured as enzyme binding.
    proposed_replacement_terms:
    - id: GO:0019899
      label: enzyme binding
    supported_by:
    - reference_id: PMID:11022048
      supporting_text: >-
        The Ras-associating domain of PLCepsilon specifically binds to the GTP-bound forms of Ha-
        Ras and Rap1A
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:2122974
  review:
    summary: >-
      IPI evidence relating Ras to the GTPase activating protein p120GAP (RASA1, P20936), whose
      overexpression reduces Ras-GTP levels in cells.
    action: MODIFY
    reason: >-
      Bare protein binding is uninformative. RASA1 is a Ras GAP, so the interaction is better
      captured as GTPase activating protein binding.
    proposed_replacement_terms:
    - id: GO:0032794
      label: GTPase activating protein binding
    supported_by:
    - reference_id: PMID:2122974
      supporting_text: >-
        Ras biochemical activity involves regulation of a GTP/GDP cycle and the GTPase activating
        protein (GAP)
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:9219684
  review:
    summary: >-
      IPI (crystal structure) evidence that GDP-bound H-Ras forms a complex with the GTPase-
      activating domain of p120GAP (RASA1).
    action: MODIFY
    reason: >-
      Bare protein binding is uninformative. The structure shows HRAS engaging its GAP, better
      captured as GTPase activating protein binding.
    proposed_replacement_terms:
    - id: GO:0032794
      label: GTPase activating protein binding
    supported_by:
    - reference_id: PMID:9219684
      supporting_text: >-
        The switch II region of Ras is stabilized by GAP-334, thus allowing glutamine-61 of Ras
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: NAS
  original_reference_id: PMID:8607982
  review:
    summary: >-
      HRAS transmits signals from growth factor receptors into downstream kinase
      cascades; the more specific term is Ras protein signal transduction.
    action: MODIFY
    reason: >-
      The broad signal transduction term should be replaced with the specific
      Ras protein signal transduction term, which the cited review explicitly
      describes.
    proposed_replacement_terms:
    - id: GO:0007265
      label: Ras protein signal transduction
    supported_by:
    - reference_id: PMID:8607982
      supporting_text: >-
        The ras p21 protooncogene products, H-ras, K-ras, and N-ras, transmit
        signals from growth factor receptors to a cascade of protein kinases
        that begins with the Raf protooncogene product.
- term:
    id: GO:0009887
    label: animal organ morphogenesis
  evidence_type: TAS
  original_reference_id: PMID:10848592
  review:
    summary: >-
      Organ morphogenesis is a distal developmental phenotype inferred from
      Ras/Ral involvement in myoblast chemotaxis and muscle development.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited study addresses Ras/Ral control of growth-factor-driven myoblast
      chemotaxis; organ morphogenesis is a far-downstream developmental outcome,
      not a proximal, direct HRAS molecular function.
    supported_by:
    - reference_id: PMID:10848592
      supporting_text: >-
        Expression of a dominant-negative mutant of Ras inhibited chemotaxis of
        C2C12 myoblasts in response to basic fibroblast growth factor (bFGF),
        hepatocyte growth factor (HGF), and insulin-like growth factor 1
        (IGF-1), key regulators of limb muscle development and skeletal muscle
        regeneration.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: TAS
  original_reference_id: PMID:10842192
  review:
    summary: >-
      A generic cytoplasm localization, consistent with the soluble/pre-membrane
      pool of HRAS.
    action: KEEP_AS_NON_CORE
    reason: >-
      Cytoplasmic localization is plausible for a fraction of HRAS, but the
      functionally meaningful locations are the plasma membrane and
      Golgi/endomembranes; this generic term is non-core.
    supported_by:
    - reference_id: file:human/HRAS/HRAS-deep-research-falcon.md
      supporting_text: >-
        prenylation drives nascent Ras proteins to **ER and Golgi** before
        subsequent trafficking to the plasma membrane
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: PMID:9020890
  review:
    summary: >-
      Ras localizes to the plasma membrane in platelets, consistent with its
      lipidation-dependent membrane targeting.
    action: ACCEPT
    reason: >-
      Plasma membrane localization is the principal signaling location of mature
      HRAS and is directly observed here.
    supported_by:
    - reference_id: PMID:9020890
      supporting_text: >-
        Immunofluorescence studies indicated that Ras was present in a
        peripheral rim pattern in fixed, permeabilized platelets, suggesting an
        intracellular, plasma membrane location.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: PMID:9880516
  review:
    summary: >-
      Lipidated H-Ras localizes to the plasma membrane; palmitoylation can
      target H-Ras to the membrane even without farnesylation.
    action: ACCEPT
    reason: >-
      Plasma membrane localization driven by H-Ras lipid modifications is a core
      localization annotation.
    supported_by:
    - reference_id: file:human/HRAS/HRAS-deep-research-falcon.md
      supporting_text: >-
        HRAS membrane association is essential for signaling, with lipid
        modifications enabling stable plasma membrane localization.
- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: TAS
  original_reference_id: PMID:10848592
  review:
    summary: >-
      Ras (with Ral) contributes to growth-factor-induced chemotactic migration
      of skeletal myoblasts, a cell-type-specific downstream output.
    action: KEEP_AS_NON_CORE
    reason: >-
      Chemotaxis is a plausible distal output of Ras signaling but is
      context-specific (myoblasts, via a Ras-Ral branch independent of MEK/PI3K
      here), so it is non-core relative to the GTPase switch function.
    supported_by:
    - reference_id: PMID:10848592
      supporting_text: >-
        Here, we demonstrate that Ras is involved also in the chemotactic
        response of skeletal myoblasts.
- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:9020890
  review:
    summary: >-
      HRAS is activated downstream of cell-surface receptors (e.g., thrombin and
      thromboxane A2 receptors) in platelets.
    action: KEEP_AS_NON_CORE
    reason: >-
      Acting downstream of cell-surface receptors is consistent with HRAS
      biology, but this broad process is a context for, rather than a more
      specific statement of, the core Ras protein signal transduction function.
    supported_by:
    - reference_id: PMID:9020890
      supporting_text: >-
        Activation of platelets with the thrombin receptor peptide42-50, the
        prostaglandin H2/thromboxane A2 mimetic U46619 or phorbol 12-myristate
        13-acetate induced a rapid increase in GTP-bound, activated Ras.
references:
- id: file:human/HRAS/HRAS-deep-research-falcon.md
  title: Falcon deep research synthesis for human HRAS
  findings:
  - statement: >-
      HRAS is a small GTPase molecular switch whose core GO annotations should
      prioritize GTP binding, GTPase activity, Ras protein signal transduction,
      positive regulation of MAPK cascade, and plasma membrane/Golgi membrane
      localization, while distal oncogenic mutant phenotypes should be curated
      conservatively.
    supporting_text: >-
      “Ras protein signal transduction” and “positive regulation of MAPK
      cascade” are generally **core** for HRAS, but very specific outcome terms
      (e.g., “cell cycle progression” as a default) should be restricted to
      contexts with strong, direct, wild-type evidence.
