id: P08962
gene_symbol: CD63
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CD63 (LAMP-3, tetraspanin-30) is a four-transmembrane-domain glycoprotein with a large,
  heavily N-glycosylated second extracellular loop and a C-terminal GYEVM lysosomal sorting motif. At
  steady state most of the protein resides on intracellular membranes: late endosomes, multivesicular
  bodies and their intraluminal vesicles, lysosomes, melanosomes and secretory granules such as platelet
  dense granules, neutrophil azurophil granules and endothelial Weibel-Palade bodies. It cycles to the
  plasma membrane, where it is exposed on the cell surface and is strongly up-regulated at the surface
  after degranulation, which makes it a classical activation marker of platelets, basophils and mast cells;
  intraluminal vesicles carrying CD63 are released as exosomes, for which it is a standard marker. As
  a tetraspanin it organizes membrane microdomains: it is a cell-surface binding partner for TIMP1, associates
  with beta1 integrin, CD9 and integrin alphaIIbbeta3, bridges VEGFR2 to beta1 integrin and controls VEGFR2
  internalization, and drives ESCRT-independent sorting of the PMEL luminal domain into intraluminal vesicles
  during melanosome biogenesis.'
