core_functions:
- description: 'Tetraspanin organizer of membrane microdomains: it associates laterally with partner receptors
    (beta1 integrin, VEGFR2, CD9, integrin alphaIIbbeta3) and with the extracellular ligand TIMP1, bringing
    receptors together and controlling their activation and internalization.'
  molecular_function:
    id: GO:0044877
    label: protein-containing complex binding
  directly_involved_in:
  - id: GO:1900746
    label: regulation of vascular endothelial growth factor signaling pathway
  - id: GO:2001046
    label: positive regulation of integrin-mediated signaling pathway
  - id: GO:0002092
    label: positive regulation of receptor internalization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:23632027
    supporting_text: CD63 serves to bridge between β1 integrin and VEGFR2 because CD63 silencing disrupted
      VEGFR2-β1 integrin complex formation
  - reference_id: PMID:16917503
    supporting_text: identified CD63 as a cell surface binding partner for TIMP-1
- description: Integral membrane protein of late endosomes, multivesicular bodies and lysosomes that drives
    ESCRT-independent sorting of cargo (the PMEL luminal domain) into intraluminal vesicles, a step required
    for melanosome biogenesis; the same intraluminal vesicles are released as exosomes.
  directly_involved_in:
  - id: GO:0035646
    label: endosome to melanosome transport
  - id: GO:0048757
    label: pigment granule maturation
  locations:
  - id: GO:0031902
    label: late endosome membrane
  - id: GO:0032585
    label: multivesicular body membrane
  - id: GO:0097487
    label: multivesicular body, internal vesicle
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0042470
    label: melanosome
  supported_by:
  - reference_id: PMID:21962903
    supporting_text: the tetraspanin CD63 directly participates in ESCRT-independent sorting of the PMEL
      luminal domain, but not of traditional ESCRT-dependent cargoes, to ILVs
  - reference_id: PMID:10793155
    supporting_text: the tetraspanin CD63/lamp3 distributes predominantly to the internal membranes of
      multivesicular-multilamellar late endosomes
suggested_questions:
- question: What fraction of total cellular CD63 is exposed at the plasma membrane in resting versus activated
    cells of each lineage, and how quickly does the surface pool turn over?
- question: How does CD63 select the PMEL luminal domain for ESCRT-independent intraluminal vesicle sorting
    - through direct binding, through local lipid ordering, or both?
suggested_experiments:
- hypothesis: The large second extracellular loop of CD63 is the surface-exposed element that binds TIMP1
    and determines antibody accessibility.
  description: Compare surface labelling and TIMP1 binding of cells expressing CD63 with loop-swap or
    loop-deletion mutants, quantifying surface versus total protein by ratiometric flow cytometry with
    pH-sensitive tags.
