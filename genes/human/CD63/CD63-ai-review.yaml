- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:15351990
  qualifier: located_in
  review:
    summary: CD63 cycles to the plasma membrane, where it associates with integrins and VEGFR2 and is
      exposed on the cell surface.
    action: ACCEPT
    reason: Surface biotinylation, flow cytometry of activated platelets and mast cells, co-immunoprecipitation
      with surface integrins and the TIMP1 binding studies all place a pool of CD63 in the plasma membrane;
      the large second extracellular loop is exposed outside the cell. Most of the protein is intracellular
      at steady state, but the surface pool is functionally important and increases after degranulation.
    supported_by:
    - reference_id: PMID:19640571
      supporting_text: Palmitoylation supports the association of tetraspanin CD63 with CD9 and integrin
        alphaIIbbeta3 in activated platelets
    - reference_id: PMID:16917503
      supporting_text: confirmed CD63 interactions with TIMP-1, integrin beta1, and their co-localizations
        on the cell surface of human breast epithelial MCF10A cells
    - reference_id: file:human/CD63/CD63-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
