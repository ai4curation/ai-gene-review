- id: PMID:25416781
  title: Human METTL20 is a mitochondrial lysine methyltransferase that targets the β subunit of electron
    transfer flavoprotein (ETFβ) and modulates its activity.
  findings:
  - statement: ETF is a mobile electron carrier that shuttles electrons from matrix FAD-containing dehydrogenases
      to the membrane-bound ETF quinone oxidoreductase, and is the third major provider of electrons to
      the respiratory-chain ubiquinone pool after complexes I and II. METTL20/ETFBKMT trimethylates ETFB
      Lys-200/Lys-203 near the recognition loop, reducing electron uptake from MCAD and GCDH.
    supporting_text: it is the third major provider of electrons to the ubiquinone pool of the mitochondrial
      respiratory chain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Direct-original reading: https://doi.org/10.1074/jbc.M114.614115. Read the actual human
      construct and protein-production Methods, ETF electron-transfer assay, and methylation/functional
      Results. Untagged mature Δ19-ETFalpha and full-length N-His6-ETFbeta were coexpressed in bacteria;
      human MCAD/GCDH assays use octanoyl-CoA/glutaryl-CoA and DCIP. Beta Lys200/Lys203 methylation and
      mutations change the assembled carrier’s activity. Isolated beta is reported unstable and is not
      the material used to establish equivalent independent turnover. Limits: The measured acceptor is
      DCIP, not a fully reconstituted ETFDH/ubiquinone/oxygen chain. METTL20 catalyzes methylation; ETFB
      is its substrate. No all-13-partner, 346-residue-product or autonomous beta activity inferred. The
      proposed recognition-loop explanation remains mechanistic interpretation. Captions/text read; no
      figure pixels. Database-lane reading: Identifier/title checked against saved primary metadata and
      actual full original. Methods16/21/24–26, Results43–48/55–59 and Discussion66 were read: human ORFs,
      mature untagged Δ19-alpha plus full-length His6-beta, beta methylation/mutants and MCAD/GCDH-to-DCIP
      transfer. Figures3/5 captions were read; no figure pixels or supplements in this lane. ETFBKMT performs
      methylation; ETF is the electron carrier. The DCIP assay does not directly test ETFDH/ubiquinone
      reduction or establish the 346-aa ETFB product.'
  full_text_unavailable: false
- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory Chain Function.
  findings:
  - statement: ETFB interacts with ETFA and ETFRF1/LYRM5; LYRM5 acts as an ETF deflavinase, removing FAD
      from the electron-transferring flavoprotein that shuttles electrons to coenzyme Q.
    supporting_text: LYRM5 interacts with and deflavinates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'https://doi.org/10.1016/j.molcel.2016.06.033. Read actual human-cell interaction workflow,
      Figure 5B–E Results/captions, clone/transfection Methods and ETF/LYRM5 purification/activity Methods.
      Endogenous ETFbeta enriches with LYRM5 in human cells; native-complex migration and recombinant
      co-purification/size-exclusion corroborate association. LYRM5/ETFRF1 inhibits and deflavinates ETF.
      Limits: Exact ETF construct residue/species provenance is not independently resolved from the main
      purification Methods. Human cell association is distinct from the recombinant preparation. No isolated
      binary beta–LYRM5 interface or ETFB deflavinase activity is inferred; no figure pixels inspected.'
  full_text_unavailable: false
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Proteome-scale BioPlex AP-MS interactome; source of the IntAct-curated ETFB interactions
      with ETFA and ETFRF1.
    supporting_text: BioPlex 3.0, results from affinity purification
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'https://doi.org/10.1016/j.cell.2021.04.011. Read actual human ORFeome/clone, 293T and
      HCT116 AP-MS, protein-inference and CompPASS Methods. Independently read original released network/bait
      tables: ETFA–ETFB and LYRM5–ETFB occur in both cell networks. Exact pairs and their source line
      numbers are replayed from the official downloads. Limits: 293T uses accession P38117, whereas HCT116
