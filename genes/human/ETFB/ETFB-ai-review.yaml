suggested_questions:
- question: Does the 346-residue ETFB product enter the mitochondrial matrix, assemble with ETFA and support
    donor-coupled electron transfer? Its altered N terminus is not equivalent to initiator-methionine
    removal from the 255-residue product.
- question: How does ETFB Lys200/Lys203 methylation change donor-specific electron-transfer kinetics and
    complex dissociation, beyond the MCAD and GCDH reactions tested with DCIP?
- question: Does S1P stabilize a defined ETF-containing assembly under endogenous conditions, or act through
    a transient association that promotes ETF abundance or flavination? Co-IP and a docking model do not
    determine obligatory subunit stoichiometry.
suggested_experiments:
- hypothesis: The alternative ETFB N terminus alters import or ETF assembly independently of the shared
    carrier domain.
  description: Compare sequence-verified 255- and 346-residue ETFB products for mitochondrial import and
    protease protection, processing, ETFA assembly, AMP/FAD occupancy and donor-coupled electron transfer.
    Include isolated subunits and matched ETFA–ETFB preparations to separate import, stability and carrier
    activity.
  experiment_type: Product-resolved import, assembly and biochemical reconstitution
- hypothesis: Beta-site methylation changes partner engagement rather than uniformly lowering all ETF-dependent
    flux.
  description: Compare methylated and unmethylated assembled human ETF with MCAD, GCDH and a choline-catabolic
    donor, measuring donor association/dissociation and electron transfer separately. Distinguish the
    donor-to-ETF half-reaction from downstream ETFDH/ubiquinone reduction.
  experiment_type: Partner-resolved binding and redox kinetics
- hypothesis: The S1P–ETF association has condition-dependent occupancy rather than obligatory 1:1:1 stoichiometry.
  description: Measure endogenous and reconstituted S1P–ETF stoichiometry using orthogonal native-mass
    and separation methods, alongside ETF stability, flavin occupancy and activity controls. Compare wild-type
    and interaction-defective S1P without inferring assembly solely from co-immunoprecipitation.
  experiment_type: Native assembly and cofactor-occupancy analysis
