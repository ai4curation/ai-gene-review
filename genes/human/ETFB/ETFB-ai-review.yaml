id: P38117
gene_symbol: ETFB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ETFB is the beta subunit of electron-transfer flavoprotein (ETF), a soluble mitochondrial-matrix
  heterodimer with ETFA. The complex receives electrons from flavoprotein dehydrogenases, including medium-chain
  acyl-CoA dehydrogenase (MCAD), glutaryl-CoA dehydrogenase (GCDH) and sarcosine dehydrogenase (SARDH),
  linking fatty-acid oxidation, amino-acid catabolism and choline degradation to respiration. ETF transfers
  these electrons to ETFDH, which reduces ubiquinone in the inner mitochondrial membrane; this route supplies
  the ubiquinone pool alongside respiratory complexes I and II. ETFB binds AMP and contributes to the
  architecture surrounding the complex’s single redox-active FAD. Its recognition-loop surface anchors
  MCAD in the ETF–MCAD complex, helping couple partner engagement to movement of the FAD-bearing domain.
  AMP is thought to stabilize the beta-subunit fold. Pathogenic ETFB variants cause multiple acyl-CoA
  dehydrogenase deficiency, also called glutaric acidemia type II.
