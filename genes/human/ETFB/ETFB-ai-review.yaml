- id: PMID:8962055
  title: Three-dimensional structure of human electron transfer flavoprotein to 2.1-A resolution.
  findings:
  - statement: The 2.1-A crystal structure of human ETF shows a heterodimer of three domains, the third
      contributed entirely by the beta subunit, with FAD in a cleft between subunits; ETF functions as
      an electron shuttle between primary flavoprotein dehydrogenases and ETF-ubiquinone oxidoreductase.
    supporting_text: third domain is made up entirely by the beta subunit
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Direct-original reading: https://doi.org/10.1073/pnas.93.25.14355. Read the actual
      Introduction, recombinant-human crystallization/structure Methods and operative Results, especially
      domains I–III, the alpha/beta interface, FAD contacts and AMP. The Introduction names isovaleryl-,
      glutaryl- and short/branched-chain dehydrogenase inputs in amino-acid catabolism; this is background
      synthesis, not a new multi-donor assay in the structure paper. The beta chain has resolved density
      Leu4–Ile255; domain III contains AMP, and the cleft containing FAD spans alpha and beta. Most FAD
      contacts are in the alpha domain, while beta Phe41/Tyr16 approach flavin methyl groups. AMP is proposed
      to stabilize beta structure. Limits: No figure-pixel inspection or new coordinate re-refinement.
      The structure establishes the assembled 255-residue beta framework, not autonomous beta electron
      transfer or equivalence of the 346-residue alternative product. The paper’s alpha introductory Q21
      statement differs from the current alpha sequence at that one position; no universal offset is inferred
      and beta residues are kept paper-numbered. Database-lane reading: Identifier/title checked against
      the original and saved primary metadata. Actual human ETF purification/crystallography and Results
      were read, including beta L4–I255 density (paper numbering), alpha/beta architecture and FAD/AMP
      contacts; Figures 3 and 4 captions were read, not their pixels or raw coordinates. The 1996 alpha
      Q21 numbering is not automatically equated with current alpha coordinates. The beta evidence concerns
      the canonical human heterodimer, not the 346-aa product or isolated-beta turnover.'
  full_text_unavailable: false
