id: Q9UQ84
gene_symbol: EXO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EXO1 (exonuclease 1) is a nuclear, Mg2+-dependent structure-specific nuclease of the XPG/RAD2
  (FEN1-like) family. Its N-terminal nuclease domain carries a robust 5''->3'' exonuclease that is most
  active on blunt or 5''-recessed duplex DNA, plus a FEN1-like 5''-flap endonuclease and an RNase H activity;
  its long, disordered C-terminal region binds partner proteins (MSH2, MLH1, MSH3, PCNA). In DNA mismatch
  repair EXO1 is the excision nuclease: activated by MutSalpha, it removes the error-containing strand
  from a nick 5'' to the mismatch, and with MutLalpha, PCNA and RFC it also supports excision directed
  from a 3'' nick. In double-strand break repair EXO1, recruited by MRN and CtIP and stimulated by BLM
  and RPA, performs long-range 5''->3'' end resection that creates the 3'' single-stranded tails needed
  for homologous recombination and ATR signalling; ATM- and CDK-dependent phosphorylation tunes how far
  it resects. At telomeres lacking POT1-TPP1, NBS1 recruits EXO1 to resect the C-strand, feeding alternative
  end joining. Mouse genetics also implicate Exo1 in meiosis, somatic hypermutation and class switch recombination.'
