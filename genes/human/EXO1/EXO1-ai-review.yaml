- id: file:human/EXO1/EXO1-notes.md
  title: EXO1 review notes and literature search record
core_functions:
- description: Excision nuclease of DNA mismatch repair. MutSalpha bound at a mismatch activates processive
    5'->3' degradation of the nicked strand by EXO1 until the mispair is removed; with MutLalpha, PCNA
    and RFC, EXO1 also supports excision directed by a 3' nick.
  molecular_function:
    id: GO:0051908
    label: double-stranded DNA 5'-3' DNA exonuclease activity
  directly_involved_in:
  - id: GO:0006298
    label: mismatch repair
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:14636568
    supporting_text: In the presence of RPA, ATP, and a mismatch, MutSalpha activates 5'-->3' excision
      by EXOI, and excision terminates after removal of the mispair.
  - reference_id: PMID:15225546
    supporting_text: While MutSalpha, EXOI, and RPA are sufficient to support hydrolysis directed by a
      5' strand break, 3' directed excision also requires MutLalpha, PCNA, and RFC.
  - reference_id: PMID:11809771
    supporting_text: Human exonuclease I is required for 5' and 3' mismatch repair.
- description: Long-range 5'->3' resection of DNA double-strand break ends, recruited by MRN and CtIP
    and stimulated by BLM and RPA, producing 3' ssDNA tails for homologous recombination; extent controlled
    by ATM-dependent phosphorylation. The same activity resects deprotected telomeres for alternative
    end joining.
  molecular_function:
    id: GO:0051908
    label: double-stranded DNA 5'-3' DNA exonuclease activity
  directly_involved_in:
  - id: GO:0000729
    label: DNA double-strand break processing
  - id: GO:0000724
    label: double-strand break repair via homologous recombination
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:21325134
    supporting_text: In the other, EXO1 resects the DNA and is stimulated by BLM, MRN, and RPA.
  - reference_id: PMID:21052091
    supporting_text: the localization of EXO1 to DSBs depends on both CtIP and MRN
  - reference_id: PMID:26240375
    supporting_text: no subsequent ATM-dependent phosphorylation of Exonuclease 1 (EXO1) leading to over
      extended resection by EXO1
  - reference_id: PMID:28216226
    supporting_text: formation of end-to-end chromosomal fusions requires EXO1 and ATR, but not CTIP
suggested_questions:
- question: Is the "cryptic" 3'->5' excision activity attributed to EXO1 in PCNA/RFC-dependent 3'-nick-directed
    mismatch repair intrinsic to EXO1, or does EXO1 play a structural role while another nuclease (e.g.
    MutLalpha endonuclease) supplies the 3' incision?
- question: Should the EXO1 IPI row keyed to PMID:2414623 (an unrelated 1985 ulcer-disease article) be
    repointed to the paper actually reporting the EXO1-MLH1 interaction?
suggested_experiments:
- description: Compare MMR excision directed by a 3' nick in extracts complemented with wild-type versus
    nuclease-dead (D173A) EXO1 in the presence of PCNA, RFC and MutLalpha, to separate a catalytic from
    a structural EXO1 role in 3'-directed repair.
