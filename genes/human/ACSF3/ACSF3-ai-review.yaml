suggested_questions:
- question: Which enzymes or pathways sustain mitochondrial malonyl-CoA production and mitochondrial fatty
    acid synthesis after ACSF3 loss, and how does their contribution vary among tissues and substrate
    conditions?
- question: How much of the mitochondrial dysfunction after ACSF3 deficiency results from malonate-mediated
    succinate dehydrogenase inhibition versus altered mitochondrial protein malonylation?
- question: 'How should GO represent the experimentally demonstrated methylmalonate-to-methylmalonyl-CoA
    ligase activity of human ACSF3, separately from the malonate-specific GO:0090409 activity: is an existing
    term suitable, or is a new molecular-function term needed?'
suggested_experiments:
- hypothesis: The contribution of ACSF3 to malonate clearance and mtFAS varies with alternative mitochondrial
    malonyl-CoA supply.
  description: Compare isogenic human ACSF3 knockout and rescued cells across differentiated cell types,
    with controlled perturbation of mitochondrial ACC1. Trace labelled malonate into malonyl-CoA and acyl-ACP
    products while measuring compartment-resolved malonate, protein lipoylation and malonylation. Include
    catalytic-dead rescue and matched substrate concentrations to separate catalysis from expression effects.
  experiment_type: Isotope tracing with genetic perturbation and biochemical rescue
