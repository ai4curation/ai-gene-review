  findings:
  - statement: Human ACSF3 knockout cells accumulate malonate.
    supporting_text: Consistent with its biochemical function, ACSF3 knockout (KO) cells have a 5-fold
      higher concentration of the enzyme's substrate, malonate, relative to control cells (Figure 1C).
    reference_section_type: RESULTS
  - statement: ACSF3 re-expression rescues mitochondrial protein malonylation; this supports malonyl-CoA
      donor production, not direct transferase activity.
    supporting_text: ACSF3 was required for mitochondrial protein malonylation, and transient re-expression
      of ACSF3 was sufficient to rescue the impaired mitochondrial malonylation in ACSF3 KO cells (Figure
      4B).
    reference_section_type: RESULTS
  - statement: DLAT and DLST lipoylation persists in ACSF3 knockout cells.
    supporting_text: No defects in lipoylation of DLAT (E2 of pyruvate dehydrogenase) or DLST (E2 of α-ketoglutarate
      dehydrogenase) were detected in ACSF3 KO cells
    reference_section_type: RESULTS
