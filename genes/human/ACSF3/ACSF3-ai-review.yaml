    action: TOO_GENERAL
    summary: Fatty acid metabolism is true but less informative than the separately retained biosynthetic
      role.
    reason: ACSF3 supplies malonyl moieties to mitochondrial fatty acid synthesis, making the metabolic
      parent true. Retained native GO0006633 already captures the informative biosynthetic direction.
      The original2007 activity interpretation is superseded by purified-enzyme specificity evidence,
      but the broad biological-process statement is not thereby false and should not be removed.
