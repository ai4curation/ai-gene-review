- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000644304
  - UniProtKB:Q4G176
  review:
    action: KEEP_AS_NON_CORE
    summary: The fatty acid biosynthesis IBA agrees with direct human ACSF3 evidence.
    reason: Human ACSF3 catalyzes the malonate-to-malonyl-CoA step that supplies malonyl moieties to mitochondrial
      fatty acid synthesis. The2011 study measures reduced malonate-derived acyl-ACP formation after ACSF3
      knockdown. This is a catalytic contribution rather than substrate necessity alone. Retain the pathway
      annotation without claiming ACSF3 is the sole source of mitochondrial malonyl-CoA or universally
      essential for lipoylation. PAINT PTN000644304 is seeded by human ACSF3; target self-inclusion is
      legitimate. Its ancestral placement remains unresolved in the retained family topology, so this
      review does not certify the clade-wide scope. Later human-cell studies show preserved lipoylation
      in ACSF3 knockout alone (PMID28479296) but strong combined effects with mitochondrial ACC1 disruption
      (PMID28986507), supporting a context-dependent contribution. Mouse knockout data (PMID42874924,
      abstract-only) and a rodent-cell preprint (PMID42239141) reinforce redundancy; neither establishes
      that human ACSF3 never contributes. A cache-only lineage-loss check was inconclusive because the
      PTHR43201 tree was unavailable. Positive IBD records were inspected, but no absence-of-IRD/IKR claim
      is made. The catalytic contribution is retained as non-core because its physiological extent is
      context dependent and overlapping supply routes sustain mtFAS in several models; the core synthesis
      centers on malonate clearance. Redundancy alone would not disprove the reaction or the pathway contribution.
    supported_by:
    - reference_id: PMID:21846720
      supporting_text: These results confirmed that ACSF3 is involved in the formation of the malonyl-ACP
        moieties required as substrates for the mitochondrial de novo fatty acid synthesis pathway.
    - reference_id: PMID:28479296
      supporting_text: No defects in lipoylation of DLAT (E2 of pyruvate dehydrogenase) or DLST (E2 of
        α-ketoglutarate dehydrogenase) were detected in ACSF3 KO cells
      reference_section_type: RESULTS
    - reference_id: PMID:28986507
      supporting_text: 'Simultaneous KD of ACSF3, encoding

        a mitochondrial malonyl-CoA synthetase previously implicated in the mtFAS

        process, resulted in almost complete ablation of protein lipoylation, indicating

        that these enzymes have a redundant function in mtFAS.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:42874924
      supporting_text: 'Mice with a double knockout of Acsf3 and

        Hlcs maintained mitochondrial lipoylation, demonstrating the highly redundant

        generation of mitochondrial malonyl-CoA.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:42239141
      supporting_text: malonate can enter the mtFAS pathway independently of ACSF3
      reference_section_type: RESULTS
    additional_reference_ids:
    - PMID:21846720
    - PMID:28479296
    - PMID:28986507
    - PMID:42874924
    - PMID:42239141
