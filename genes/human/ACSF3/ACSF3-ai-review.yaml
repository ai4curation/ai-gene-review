id: Q4G176
gene_symbol: ACSF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACSF3 is a mitochondrial matrix ATP-dependent CoA ligase that activates malonate and methylmalonate
  to their CoA thioesters. This reaction clears free dicarboxylic acids and supplies mitochondrial malonyl-CoA,
  including donor availability for lysine malonylation. ACSF3 can contribute malonyl units to mitochondrial
  fatty acid synthesis, alongside alternative sources whose importance varies with cellular context. Biallelic
  ACSF3 variants cause combined malonic and methylmalonic aciduria.
