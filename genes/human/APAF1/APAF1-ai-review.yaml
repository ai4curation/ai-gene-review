  review:
    summary: Cytochrome c binding is central to APAF1 activation, but there is no
      precise GO binding term and generic protein binding adds no value.
    action: REMOVE
    reason: The APAF1-cytochrome-c interaction is biologically real and is captured by
      APAF1 intrinsic-signaling and apoptosome annotations. GO:0005515 should be removed
      on the APAF1 side rather than replaced with a caspase-activator term that does not
      describe the binding event itself.
