existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: TAS
  original_reference_id: PMID:10383829
  qualifier: enables
  review:
    summary: The broad nucleotide-binding assertion is biologically sound for APAF1, but
      ATP binding is a better replacement for this row because the existing GOA already
      carries the ADP-binding child term and the original PMID is attached to an unrelated
      PTPRK paper.
    action: MODIFY
    reason: APAF1 is a nucleotide-controlled NB-ARC adaptor; the inactive protein is
      ADP-bound and cytochrome c plus dATP/ATP drive the nucleotide-dependent
      conformational cycle that builds the apoptosome. GO:0005524 captures the ATP side
      of the switch not otherwise present in GOA, whereas PMID:10383829 should not be
      used as APAF1 support.
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
    additional_reference_ids:
    - PMID:10393175
    supported_by:
    - reference_id: PMID:10393175
      supporting_text: Apaf-1 requires dATP/ATP hydrolysis to interact with cytochrome
        c, self-associate and bind to procaspase-9
- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EPV5
  - ensembl:ENSRNOP00000010869
  review:
    summary: The hypoxia row over-projects APAF1 apoptosome activity into a stimulus- or
      tissue-level outcome.
    action: MARK_AS_OVER_ANNOTATED
    reason: Loss of APAF1 can alter developmental or stress-response cell death
      outcomes, but APAF1 does the direct work of cytochrome-c-dependent apoptosome
      assembly in intrinsic apoptotic signaling. The more specific stimulus and anatomy
      terms should not be the core flat APAF1 process annotations.
