id: O14727
gene_symbol: APAF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'APAF1 is a cytosolic NB-ARC/WD40 scaffold that couples mitochondrial cytochrome
  c release to initiator caspase activation. Cytochrome c and dATP/ATP binding relieve the
  autoinhibited ADP-bound APAF1 monomer and promote APAF1 oligomerization into the apoptosome,
  where APAF1 CARD domains recruit procaspase-9 CARDs and concentrate CASP9 for activation
  of the intrinsic apoptotic caspase cascade.'
