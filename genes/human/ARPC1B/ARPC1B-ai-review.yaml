- id: PMID:34673575
  title: ARPC1B binds WASP to control actin polymerization and curtail tonic signaling in B cells.
  full_text_unavailable: false
  findings:
  - statement: Human patient-derived lymphoblastoid cells have cortical actin defects, and ARPC1B-containing
      complexes localize to the cortex.
    supporting_text: We found that ARPC1B complexes localized to the actin cortex of control LCL B cell
      lines and that lines derived from ARPC1B-deficient patients showed decreased and irregular cortical
      F-actin intensity (Figure 3A).
    full_text_unavailable: false
  - statement: Human Ramos knockout cells corroborate ARPC1B-dependent lamellipodia.
    supporting_text: Like LCLs, control Ramos cells also spontaneously formed lamellipodia in suspension,
      and these structures were entirely dependent on ARPC1B (Figure 1F).
    full_text_unavailable: false
  - statement: The VCA polymerization experiment uses cell lysates and therefore does not measure isolated
      ARPC1B nucleation.
    supporting_text: we opted to first grossly determine the maximum contribution of VCA-stimulated ARP2/3
      to the overall actin polymerization by performing pyrene-actin polymerization assays in the presence
      of B cell lysates derived from control or patient cells.
    full_text_unavailable: false
  - statement: WASP preferentially coimmunoprecipitates with ARPC1B relative to ARPC1A in the tested cellular
      assay; this is not a purified binary affinity determination.
    supporting_text: We found that WASP coimmunoprecipitated to a greater extent with ARPC1B as compared
      with ARPC1A with remarkable consistency (Figure 2, D and F)
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact PMID/DOI/PMC/title independently verified. Complete cached abstract, target Results/Figures
      1–3 and primary-cell, cell-line, polymerization, co-IP and ethics Methods read. Human LCL/Ramos
      and PBMC-derived B-cell provenance is explicit. Rabbit-muscle actin and lysate assays are not isolated
      ARPC1B biochemistry; whole-paper/supplement/figure-pixel reading is not claimed.
core_functions:
- description: ARPC1B supplies a structural subunit of the Arp2/3 complex that supports branched actin-network
    assembly and contributes to mother-filament engagement. In human cortical actin systems it enables
    organization of protrusive and cortical networks as part of this complex, rather than acting as an
    autonomous nucleator.
