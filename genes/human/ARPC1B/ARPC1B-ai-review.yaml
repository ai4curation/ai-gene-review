core_functions:
- description: ARPC1B provides a structural subunit of the Arp2/3 complex that coordinates regulated
    branched actin-network assembly. Human B-cell experiments connect ARPC1B-containing complexes
    to WASP-stimulated polymerization and cortical organization; reciprocal co-immunoprecipitation
    shows stronger WASP association with ARPC1B than ARPC1A under the tested cellular conditions.
  molecular_function:
