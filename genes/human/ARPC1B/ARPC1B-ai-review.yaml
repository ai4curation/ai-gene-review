id: O15143
gene_symbol: ARPC1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARPC1B is the p41-Arc WD-repeat subunit of the seven-subunit Arp2/3 complex. It
  supports regulated branched actin-network assembly and cortical actin organization, including
  WASP-stimulated polymerization in human B cells. ARPC1B-containing complexes have distinct
  activation and disassembly properties from ARPC1A-containing complexes. ARPC1B is enriched
  in hematopoietic cells and is a major ARPC1 isoform in platelets. Biallelic loss causes immunodeficiency
  with inflammatory disease and congenital thrombocytopenia, with defects in platelet and immune-cell
  actin organization.
