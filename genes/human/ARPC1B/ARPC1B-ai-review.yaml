- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25944859
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q5ZTM4
  review:
    summary: Human ARPC1B binds the bacterial serine/threonine kinase LegK2.
    action: MODIFY
    reason: The same-source human ORFeome constructs, binary yeast assays and positive HEK293T
      GST-LegK2/Flag-ARPC1B copurification support kinase recognition (PMID:25944859, Figure
      1 and Methods). GST/LegK1 controls and kinase-dead LegK2 binding distinguish recognition
      from catalysis. Figure 2 phosphothreonine assays with purified Acanthamoeba complex establish
      the LegK2 partner class separately from the human binding assay. Refine to protein serine/threonine
      kinase binding, GO:0120283; this is not ARPC1B kinase activity or a core endogenous signaling
      role. The canonical cache is abstract-only, so the actual quarantined original-body result
      and its public locator are recorded in the linked notes.
    proposed_replacement_terms:
    - id: GO:0120283
      label: protein serine/threonine kinase binding
    supported_by:
    - reference_id: file:human/ARPC1B/ARPC1B-notes.md
      supporting_text: Flag-tagged ARPC1B (45 kDa), but not Flag-tagged ARP3, was copurified
    - reference_id: file:human/ARPC1B/ARPC1B-notes.md
      supporting_text: The same paper's Figure 2 assay used purified Acanthamoeba Arp2/3 and
        recombinant LegK2 with phosphothreonine detection.
    - reference_id: PMID:25944859
      supporting_text: "LegK2 phosphorylates the ARPC1B and ARP3 subunits \nof the ARP2/3 complex."
      full_text_unavailable: true
