    summary: Human nuclear isoform assignment remains unresolved.
    action: UNDECIDED
    reason: PMID:29925947 identifies all seven Arp2/3 subunits in Xenopus chromatin proteomics
      and uses Arpc2 antibodies for human U2OS chromatin immunoprecipitation. These establish
      nuclear complex behavior, but the inspected experiments do not distinguish a human ARPC1B-containing
      nuclear complex from an ARPC1A-containing one. Unlike cytosol, which has independent human
      ARPC1B HPA localization, no comparably resolved target observation was established here.
