id: O15143
gene_symbol: ARPC1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARPC1B is the p41-Arc WD-repeat subunit of the Arp2/3 complex, a seven-subunit actin-nucleating
  assembly. It contributes structural organization and regulated activity of the complex, supporting branched
  actin networks and cortical actin organization in human cells. Complexes containing ARPC1B have distinct
  assembly and disassembly properties from ARPC1A-containing complexes. ARPC1B acts within the cytoplasmic
  actin machinery rather than as an autonomous actin nucleator.
