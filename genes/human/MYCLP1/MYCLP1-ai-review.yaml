id: P12525
gene_symbol: MYCLP1
product_type: PSEUDOGENE
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MYCLP1, also known as MYCL2, is an X-linked processed MYCL-related locus encoding a putative
  Myc-like bHLH protein. The sequence preserves Myc-family signatures, but UniProt classifies the protein
  evidence as uncertain and cautions that it may be a pseudogene product; no direct assay has established
  that an endogenous MYCLP1 protein dimerizes with MAX, binds DNA or regulates transcription.'
