- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: TAS
  original_reference_id: PMID:9425898
  qualifier: enables
  review:
    summary: G beta subunits have no GTPase activity.
    action: REMOVE
    reason: GTP hydrolysis is catalysed by the G alpha subunit. The cited paper shows that the GNB3-s splice variant,
      expressed with Galpha-i2 and Ggamma5, enhances stimulated GTPgammaS binding of the heterotrimer, i.e. beta-gamma
      supports the alpha subunit's nucleotide cycle. The beta subunit's contribution is captured as contributing
      to G protein activity of the heterotrimer (core_functions), not as enabling GTPase activity.
    supported_by:
    - reference_id: PMID:9425898
      supporting_text: Significant enhancement of stimulated GTPgammaS binding to Sf9 insect cells expressing G
        beta3-s together with G alpha(i)2 and G gamma5 indicates that this splice variant is biologically active.
