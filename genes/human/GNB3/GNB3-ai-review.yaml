id: P16520
gene_symbol: GNB3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNB3 encodes the beta-3 subunit of heterotrimeric G proteins, a seven-bladed WD-repeat propeller that
  forms an obligate dimer with a G gamma subunit. The beta-gamma dimer binds GDP-bound G alpha, is needed for receptor
  coupling of the heterotrimer, and after receptor activation is released to regulate effectors itself. GNB3 is
  expressed in many tissues; in the retina it is the beta subunit of cone transducin (with GNAT2 and GNGT2), where
  it sets the amount of transducin in the cone outer segment, and of the Go heterotrimer (GNAO1, GNB3, GNG13) coupled
  to mGluR6 in ON-bipolar cell dendrites, where released beta-gamma helps close the TRPM1 channel. Biallelic loss-of-function
  mutations cause autosomal-recessive congenital stationary night blindness with ON-bipolar dysfunction and reduced
  cone sensitivity. A common splice-promoting variant (C825T) is associated with hypertension and obesity.
