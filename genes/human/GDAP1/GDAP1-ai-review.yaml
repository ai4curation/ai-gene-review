- gap_statement: The intrinsic catalytic activity and endogenous ligand of membrane-embedded full-length
    GDAP1 remain unresolved.
  boundary: Organelle remodeling and construct-dependent glutathione conjugation or lipid binding are
    supported. These findings do not identify a physiological catalytic reaction of the native protein.
