  review:
    summary: Refine the CLCN7 interaction to transmembrane transporter binding.
    action: MODIFY
    reason: HuRI identifies CLCN7 P51798-1, ORF 6673, with GDAP1 ORF 2560; the current IntAct records
      retain the positive pair. The official CLCN7 record describes proton-coupled chloride exchange across
      the lysosomal membrane. The current GO:0044325 definition covers binding to a protein that enables
      transfer across a membrane, and its primary label is transmembrane transporter binding; ion channel
      binding is a narrower synonym. This established partner class supports a more informative binding
      assertion without treating the exchanger as a conventional chloride channel or transferring its
      transport activity, localization, or lysosomal function to GDAP1.
