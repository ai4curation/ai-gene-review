suggested_questions:
- question: Does membrane-embedded full-length GDAP1 catalyze glutathione conjugation under a physiological
    activation state, and which endogenous substrate would establish that role?
- question: Is thapsic acid an endogenous GDAP1 ligand, or an experimental probe of a pocket whose physiological
    ligand remains unidentified?
- question: How does the natural 290-residue product differ from the displayed protein in localization
    and organelle remodeling?
suggested_experiments:
- experiment_type: Matched natural-product and construct comparison
  description: Compare sequence-verified natural products with T288X, T318X and soluble ΔTM controls in
    membrane reconstitution. Measure conjugated products directly alongside ligand binding and membrane
    remodeling, using substrate-free, inactive-enzyme and membrane-only controls to distinguish these
    activities.
status: COMPLETE
