id: Q8TB36
gene_symbol: GDAP1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GDAP1 is a tail-anchored protein with a glutathione-transferase-like fold that associates
  with mitochondrial and peroxisomal membranes. Cellular evidence supports contributions to mitochondrial
  and peroxisomal fission. Its intrinsic catalytic activity and endogenous ligand remain unresolved. Pathogenic
  variants cause recessive and dominant peripheral neuropathies.
alternative_products:
- id: Q8TB36-1
  name: '1'
  sequence_note: Displayed 358-residue product.
  description: The canonical sequence retains the N-terminal GST-like domain and C-terminal membrane anchor.
    Engineered T288X, T318X and soluble ΔTM proteins are distinct experimental constructs, not additional
    natural products.
- id: Q8TB36-2
  name: '2'
  sequence_note: Residues 1–68 of the displayed sequence are absent, yielding 290 residues (VSP_038393).
  description: A naturally described product supported by transcript sequence evidence. HuRI identifies
    its target as Q8TB36-2/ORF2560, without a complete ORF-to-current-sequence identity proof. The current
    GOA target remains Q8TB36; neither unique function nor product-specific catalysis is established.
