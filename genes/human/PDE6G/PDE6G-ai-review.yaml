id: P18545
gene_symbol: PDE6G
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PDE6G encodes the inhibitory gamma subunit (Pgamma) of the rod photoreceptor cGMP phosphodiesterase
  PDE6, a small intrinsically disordered protein of 87 residues. Two copies bind the PDE6A/PDE6B catalytic dimer
  on the rod outer segment disc membranes: the C-terminus of each occludes the entrance to one catalytic site, keeping
  the enzyme inactive in darkness, and the central and N-terminal regions contact the GAF domains, where they cooperate
  with noncatalytic cGMP binding. Light-activated transducin alpha (GNAT1-GTP) binds Pgamma and displaces its C-terminus,
  activating cGMP hydrolysis; Pgamma also increases the affinity of activated transducin for the RGS9-GNB5-R9AP
  GTPase-activating complex, speeding shut-off of the response. Pgamma assists the chaperone-dependent folding of
  the catalytic subunits and is needed to maintain PDE6 activity: a biallelic splice mutation causes autosomal recessive
  early-onset retinitis pigmentosa (RP57). Outside the retina it is expressed at low levels and has been implicated
  in growth factor-stimulated ERK signalling in cultured cells.'
