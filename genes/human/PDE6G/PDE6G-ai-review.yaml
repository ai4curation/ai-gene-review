- term:
    id: GO:0141190
    label: transducin-mediated opsin signaling pathway
  evidence_type: ISS
  original_reference_id: PMID:33007200
  review:
    summary: Pgamma is the subunit through which transducin activates rod PDE6.
    action: NEW
    reason: 'Pgamma does part of the work of the pathway step rather than being its substrate: GNAT1-GTP binds Pgamma
      and moves its C-terminus away from the catalytic site, which is the activation event (bovine native PDE6).
      The catalytic subunits PDE6A and PDE6B carry this term by ISS from bovine; the same transfer applies to the
      human gamma subunit.'
    supported_by:
    - reference_id: PMID:33007200
      supporting_text: The nearly upside-down orientation of GαT·GTP in the GαT·GTP-PDE6 complex allows the Ras
        domain of GαT to displace the C-terminal end of the PDEγ subunit away from its position that blocks substrate
        (cGMP) access to the catalytic sites on the PDEα and PDEβ subunits
