id: P08173
gene_symbol: CHRM4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRM4 encodes the M4 muscarinic acetylcholine receptor, a seven-transmembrane acetylcholine
  receptor that preferentially couples to Gi/o proteins and inhibitory cyclic-AMP signaling. It contributes
  to neuronal cholinergic modulation and motor-circuit regulation. Different agonists can recruit different
  Gi subtypes with different efficacy. Plasma-membrane and neuronal synaptic localization support receptor
  signaling, whereas physical association with receptor activity-modifying proteins does not by itself
  establish a particular native signaling complex.
