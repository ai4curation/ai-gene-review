id: A5YKK6
gene_symbol: CNOT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNOT1 is the large organizing subunit of the CCR4-NOT complex. Its repeated helical
  domains hold catalytic deadenylases and regulatory modules together and provide binding surfaces
  for RNA-associated recruitment factors, including tristetraprolin, GW182/TNRC6 and Nanos proteins.
  These assemblies coordinate poly(A)-tail shortening, mRNA decay and translational repression. CNOT1
  acts in the cytoplasm and P-bodies and also participates in nuclear receptor-dependent transcriptional
  repression. It supplies scaffold and recruitment functions, while CNOT6/CNOT6L and CNOT7/CNOT8
  provide the complex’s nuclease chemistry. Cellular effects on stem-cell identity and survival depend
  on this broader control of gene expression.
