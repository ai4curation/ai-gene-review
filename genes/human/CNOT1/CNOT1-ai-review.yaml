suggested_questions:
- question: How do the four natural CNOT1 products differ in abundance, localization and recruitment
    of catalytic or regulatory modules?
- question: Which direct RNA contacts underlie the crosslink-capture findings, and how do they contribute
    relative to RNA recognition by recruited partner proteins?
- question: What is the precise original evidence for the ZFP36L1/BRF1 pair and for CNOT1 detection
    in the NK-cell membrane proteome?
- question: How does nuclear CNOT1 regulate receptor-dependent transcription, and when is RAR reporter
    repression mediated through RXR rather than a direct RAR contact?
suggested_experiments:
- description: Reconstitute matched complexes with the sequence-verified natural CNOT1 products and
    compare module occupancy, RNA binding and deadenylation while holding catalytic-subunit abundance
    constant.
  hypothesis: Alternative CNOT1 sequence segments change recruitment or assembly without conferring
    intrinsic RNase catalysis.
- description: Measure CNOT1 binding to purified RAR/RXR heterodimers and isolated receptors with
    controlled ligands, followed by receptor-interface mutants in transcriptional reporters.
  hypothesis: RAR-pathway repression can be mediated by an RXR-facing interface despite absent ligand-dependent
    binding to isolated RARα in the original assay.
