- id: file:human/CNOT1/CNOT1-source-evidence.json
  title: CNOT1 source records and evidence scope
  findings:
  - statement: Exact source identities, assay records, target-table entries, product features and
      access limits are recorded for reproducibility; biological support is provided by primary references.
core_functions:
- description: CNOT1 is a structural scaffold of CCR4-NOT that holds catalytic deadenylases and regulatory
    modules together and recruits them through interfaces for RNA-associated factors. Its MIF4G domain
    positions CAF1 with an accessible active site, while other regions organize the NOT and CNOT9
    modules. Human reconstitution and recruitment experiments demonstrate coordinated mRNA deadenylation
    and silencing. CNOT1 contributes to the assembled RNase activity without supplying nuclease catalysis
    itself. The work uses full-length proteins and engineered domains; the four natural products
    have not been compared equivalently.
