- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: The capture experiment supports mRNA binding.
    action: MODIFY
    reason: The original HeLa study combines covalent UV crosslinking with oligo(dT) capture and
      stringent LiCl/LiDS washes. Its Table S1 CNOT1 entry is enriched in crosslinked samples and
      absent from controls. The authors explain that this chemistry does not crosslink proteins to
      each other and discriminates against indirect mRNP subunits; they also recommend individual
      validation of high-probability screen hits. Retain mRNA binding at this high-throughput scope,
      without sequence specificity, an autonomous RNA-binding core, or proof for every product.
    supported_by:
    - reference_id: PMID:22658674
      supporting_text: "covalent UV crosslinking of RBPs to \nRNA"
    proposed_replacement_terms:
