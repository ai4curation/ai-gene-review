- term:
    id: GO:0050810
    label: regulation of steroid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Phylogenetic annotation for regulation of steroid biosynthesis. This captures StAR''s
      defining role as the ACUTE regulator of steroidogenesis: cholesterol delivery across the mitochondrial
      membranes is rate-limiting, and StAR abundance (a labile protein induced by tropic hormones)
      sets the pace of steroid output.'
    action: ACCEPT
    reason: 'STAR controls substrate delivery and thereby acutely changes steroidogenic flux: human
      STAR reconstitution increases pregnenolone production. This is a regulatory transport role,
      not a claim that STAR catalyzes steroid oxidation.'
    supported_by:
