  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: STAR-mediated cholesterol delivery participates in steroid hormone biosynthesis.
    action: MODIFY
    reason: Refine this broad steroid-biosynthesis annotation to the already annotated steroid hormone
      biosynthetic process. STAR supplies substrate through its own cholesterol-transfer activity;
      the evidence is functional reconstitution as well as human deficiency, not necessity alone.
      Adrenal and gonadal contexts are both supported.
    supported_by:
    - reference_id: PMID:7761400
      supporting_text: Human StAR, coexpressed in COS-1 cells with cytochrome P450scc and adrenodoxin,
        increased pregnenolone synthesis > 4-fold.
    - reference_id: PMID:7892608
      supporting_text: In three unrelated individuals with this disorder, steroidogenic acute regulatory
        protein, which enhances the mitochondrial conversion of cholesterol into pregnenolone, was
        mutated and nonfunctional
    - reference_id: PMID:12372832
      supporting_text: Thus StAR can transfer cholesterol between synthetic membranes without other
        protein components found in mitochondria.
