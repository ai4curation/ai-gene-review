id: P49675
gene_symbol: STAR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: STAR is a START-domain cholesterol-binding and transfer protein that promotes acute
  steroid hormone synthesis in adrenal and gonadal steroidogenic cells. It acts at the mitochondrial
  outer membrane to facilitate delivery of cholesterol to the inner-membrane enzyme CYP11A1, which
  converts cholesterol to pregnenolone. After acting, STAR is imported into the mitochondrial matrix.
  Its cholesterol-delivery function supports both adrenal and gonadal hormone production; loss-of-function
  variants cause congenital lipoid adrenal hyperplasia. Steroidogenic tissues such as the placenta
  can use STAR-independent cholesterol delivery.
