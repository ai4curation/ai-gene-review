  title: Collagen Fibril Assembly and Function.
  findings:
  - statement: This review covers collagen fibrils as the tension-resisting element of the extracellular
      matrix and the cellular machinery that regulates fibril nucleation, orientation and size; it
      does not name a step performed by a network-forming collagen IV chain.
    supporting_text: In developing tissues, however, in addition to the intrinsic self-assembly properties,
