- id: PMID:29853175
  title: Collagen Fibril Assembly and Function.
  findings:
  - statement: This review covers collagen fibril assembly generally, presenting fibrils as the
      major mechanical element of the matrix. It does not identify a COL4A4-performed step, which
      is why the derived fibril-organization row remains unresolved.
    supporting_text: Collagen fibrils are the major mechanical component in the extracellular
      matrix of a broad range of multicellular animals from echinoderms to vertebrates where they
      provide a stable framework for tissues.
    reference_section_type: ABSTRACT
  - statement: Fibril nucleation, orientation and size are regulated by cellular machinery in
      addition to the intrinsic self-assembly of collagen molecules.
    supporting_text: In developing tissues, however, in addition to the intrinsic self-assembly
      properties, there is cellular machinery that regulates fibril nucleation, spatial
      orientation, and fibril size, according to the tissue and stage of development.
    reference_section_type: ABSTRACT
