- id: PMID:17942953
  title: COL4A3/COL4A4 mutations producing focal segmental glomerulosclerosis and renal failure in
    thin basement membrane nephropathy.
  findings:
  - statement: Founder mutations in COL4A3 and COL4A4 segregate with thin basement membrane nephropathy
      across ten Cypriot families.
    supporting_text: Molecular studies identified founder mutations in both COL4A3 and COL4A4 genes
      in 10 families.
    reference_section_type: ABSTRACT
  - statement: Over a follow-up of up to three decades a substantial minority of heterozygous COL4A3/COL4A4
      carriers progressed to chronic renal failure and end-stage renal disease, so thin basement membrane
      nephropathy is not uniformly benign.
    supporting_text: During follow-up of up to three decades, 31 of these 82 patients (37.8%) developed
      chronic renal failure and 16 (19.5%) reached end-stage renal disease.
    reference_section_type: ABSTRACT
  - statement: The study is a clinical and genetic family study, and the authors leave open whether
      the mutations themselves or a further genetic modifier drives progression.
    supporting_text: We conclude that these particular COL4A3/COL4A4 mutations either predispose some
      patients to FSGS and chronic renal failure, or that thin basement membrane nephropathy sometimes
      coexists with another genetic modifier
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine abstract verifies human COL4A3/COL4A4 families, biopsy/renal outcomes
      and unresolved modifier explanations. Original full access failed; no variant-specific functional
      assay or isolated mechanical test is claimed.
  full_text_unavailable: true
