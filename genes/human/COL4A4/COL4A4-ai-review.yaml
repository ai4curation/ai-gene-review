- id: PMID:30443360
  title: 'Structures of collagen IV globular domains: insight into associated pathologies, folding
    and network assembly.'
  findings:
  - statement: Basement membranes are built on collagen IV scaffolds of triple-helical protomers
      that associate end-to-end into networks, the structural role to which alpha4(IV)
      contributes.
    supporting_text: Basement membranes are extracellular structures of epithelia and endothelia
      that have collagen IV scaffolds of triple α-chain helical protomers that associate end-to-
      end, forming networks.
    reference_section_type: ABSTRACT
  - statement: How the C-terminal noncollagenous domains select and assemble the
      alpha1alpha2alpha1 and alpha3alpha4alpha5 hetero-oligomers found in vivo is still unclear,
      so chain selection remains an open mechanistic question.
    supporting_text: The molecular mechanisms by which the noncollagenous C-terminal domains of
      α-chains direct the selection and assembly of the α1α2α1 and α3α4α5 hetero-oligomers found
      in vivo remain obscure.
    reference_section_type: ABSTRACT
  - statement: Recombinant alpha2 and alpha4 noncollagenous domains crystallized as homo-oligomers
      larger than the canonical hexamer, an architecture the authors treat as needing extrinsic
      constraints in vivo. This is why the isolated alpha4 assembly is kept distinct from native
      protomer composition.
    supporting_text: Crystal structures of the α2 and α4 non-collagenous domains generated by
      recombinant methods were also determined. These domains spontaneously form homo-oligomers
      that deviate from the canonical architectures
    reference_section_type: RESULTS
  - statement: Alport syndrome missense mutations cluster in the folding-nucleation core of the
      noncollagenous domain, suggesting a folding disorder rather than a loss of a catalytic
      activity.
    supporting_text: Alport's syndrome missense mutations concentrate within the core that
      nucleates the folding of the noncollagenous domain
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual human NC1 construct Methods, structures and assembly Results/Discussion
      read. Alpha4 crystal dodecamer is noncanonical; isolated alpha4 is monomeric in solution, mixed
      alpha345 yields alpha5 crystals and SPR tests alpha3/5. These are structural-interface data,
      not a native alpha345 reconstitution or autonomous adaptor assay.
