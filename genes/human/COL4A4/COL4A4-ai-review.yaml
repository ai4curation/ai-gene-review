    membrane nephropathy.
  findings:
  - statement: The alpha4 chain of type IV collagen is an important component of the glomerular basement
      membrane, and COL4A4 mutations are associated with thin basement membrane nephropathy.
    supporting_text: The alpha4 chain of the type 4 collagen family is an important component of the
      glomerular basement membrane (GBM) in the kidney.
    reference_section_type: ABSTRACT
  - statement: Complete COL4A4 sequencing in 45 Korean patients with thin basement membrane nephropathy
      found eight novel variants, two of them possibly pathogenic and absent from 286 control chromosomes.
    supporting_text: Two of these variants, G199R and G1606E, were possibly pathogenic variants affecting
      the phenotype. None of these variants were observed in 286 chromosomes from normal Korean control
      subjects.
    reference_section_type: ABSTRACT
  reference_review:
