- id: PMID:17942953
  title: COL4A3/COL4A4 mutations producing focal segmental glomerulosclerosis and renal failure in
    thin basement membrane nephropathy.
  findings:
  - statement: COL4A3/COL4A4 mutations account for roughly 40% of thin basement membrane nephropathy, a
      condition defined by microscopic hematuria.
    supporting_text: Mutations in the COL4A3/COL4A4 genes of type IV collagen have been found in
      approximately 40% of cases of thin basement membrane nephropathy, which is characterized by
      microscopic hematuria
    reference_section_type: ABSTRACT
  - statement: Founder mutations in COL4A3 and COL4A4 were identified in ten Cypriot families with thin
      basement membrane nephropathy.
    supporting_text: Molecular studies identified founder mutations in both COL4A3 and COL4A4 genes in 10
      families.
    reference_section_type: ABSTRACT
  - statement: A substantial fraction of heterozygous carriers progressed to chronic renal failure over
      decades of follow-up.
    supporting_text: During follow-up of up to three decades, 31 of these 82 patients (37.8%) developed
      chronic renal failure and 16 (19.5%) reached end-stage renal disease.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine abstract verifies human COL4A3/COL4A4 families, biopsy/renal outcomes
      and unresolved modifier explanations. Original full access failed; no variant-specific functional
      assay or isolated mechanical test is claimed.
  full_text_unavailable: true
- id: PMID:19675380
  title: Identification of novel variants in the COL4A4 gene in Korean patients with thin basement
    membrane nephropathy.
  findings:
  - statement: The alpha4(IV) chain is an important structural component of the glomerular basement
      membrane.
    supporting_text: The alpha4 chain of the type 4 collagen family is an important component of the
      glomerular basement membrane (GBM) in the kidney.
    reference_section_type: ABSTRACT
  - statement: Complete COL4A4 sequencing of 45 Korean thin-basement-membrane nephropathy patients
      identified two possibly pathogenic glycine-substitution variants absent from controls.
    supporting_text: Two of these variants, G199R and G1606E, were possibly pathogenic variants affecting
      the phenotype.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and original publisher PDF Methods/Results/Discussion read at
      https://ijmr.org.in/content/175/2009/129/5/pdf/IJMR-129-525.pdf . Human biopsy-confirmed patients
      and controls were sequenced; segregation and clinical comparisons are positive, but functional
      causality remains qualified by the authors. The normal selected abstract is preserved separately
      from this authentic external full text.
