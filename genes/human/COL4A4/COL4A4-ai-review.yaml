    structure and expression of the other alpha (IV) chains.
  findings:
  - statement: The complete human alpha4(IV) chain was sequenced as a 1,690-residue translation
      product yielding a 1,652-residue mature chain.
    supporting_text: The complete translation product has 1,690 amino acid residues and the
      processed alpha 4(IV) chain proper 1,652 residues.
    reference_section_type: ABSTRACT
  - statement: The chain comprises a 38-residue signal peptide, a 1,421-residue collagenous domain
      and a 231-residue NC1 domain, the signal peptide implying entry into the secretory pathway.
    supporting_text: There is a 38-residue putative signal peptide, a 1,421-residue collagenous
      domain starting with a 23-residue noncollagenous sequence, and a 231-residue NC1 domain.
    reference_section_type: ABSTRACT
  - statement: Alpha4(IV) belongs to the alpha2-like type IV collagen chains together with
      alpha2(IV) and alpha6(IV), and its fetal expression pattern closely resembles that of
      alpha3(IV).
    supporting_text: Analysis of the primary structure showed that the alpha 4(IV) chain belongs
      to the alpha 2-like type IV collagen chains together with alpha 2(IV) and alpha 6(IV).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
