- id: PMID:12193605
  title: Quaternary organization of the goodpasture autoantigen, the alpha 3(IV) collagen chain.
    Sequestration of two cryptic autoepitopes by intrapromoter interactions with the alpha4 and alpha5
    NC1 domains.
  findings:
  - statement: Physicochemical and immunochemical analysis of human glomerular NC1 hexamers gives
      a composition of (alpha3)2(alpha4)2(alpha5)2, containing cross-linked alpha3-alpha5
      heterodimers and alpha4-alpha4 homodimers.
    supporting_text: The hexamers were found to have a molecular composition of
      (alpha3)(2)(alpha4)(2)(alpha5)(2) and to contain cross-linked alpha3-alpha5 heterodimers and
      alpha4-alpha4 homodimers.
    reference_section_type: ABSTRACT
  - statement: The alpha3, alpha4 and alpha5 chains occur together in the same triple-helical
      protomer, which establishes alpha4(IV) membership in the collagen type IV trimer.
    supporting_text: these findings indicate that the alpha3, alpha4, and alpha5 chains occur
      together in the same triple-helical protomer
    reference_section_type: ABSTRACT
  - statement: In the glomerular basement membrane this protomer dimerizes through NC1-NC1
      interactions, with alpha3, alpha4 and alpha5 of one protomer meeting alpha5, alpha4 and
      alpha3 of the opposite one.
    supporting_text: In the GBM, this protomer dimerizes through NC1-NC1 domain interactions
    reference_section_type: ABSTRACT
  - statement: The immunodominant Goodpasture epitope is sequestered at the alpha3NC1/alpha5NC1
      interface and the E(B) epitope at the alpha3NC1/alpha4NC1 interface, so alpha4(IV)
      contributes directly to the assembled NC1 interface.
    supporting_text: whereas the E(B) epitope is sequestered at the interface between the
      alpha3NC1 and alpha4NC1 domains
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine abstract reports alpha3/alpha4/alpha5 NC1 composition, alpha4–alpha4
      crosslinked dimers and domain-association evidence for a shared protomer. Publisher routes
      failed and an HTTP200 Elsevier response contained only metadata; no original full Methods,
      exact species or construct scope was recovered. This is not evidence of an alpha4 homotrimer.
  full_text_unavailable: true
- id: PMID:22539938
  title: 'Tetrastatin, the NC1 domain of the α4(IV) collagen chain: a novel potent anti-tumor matrikine.'
  findings:
  - statement: Surface plasmon resonance shows that recombinant human NC1 alpha4(IV), named
      tetrastatin, binds alphaVbeta3 integrin with a KD of about 148 nM.
    supporting_text: showing that recombinant human NC1 α4(IV) binds to αvβ3 integrin
    reference_section_type: ABSTRACT
  - statement: An anti-alphaVbeta3 blocking antibody inhibited melanoma-cell adhesion to
      recombinant NC1 alpha4(IV) substratum, implicating that receptor in the fragment's activity.
    supporting_text: An anti-αvβ3 integrin blocking antibody inhibited cell adhesion on
      recombinant human NC1 α4(IV) substratum.
    reference_section_type: ABSTRACT
  - statement: Overexpressing NC1 alpha4(IV) in human melanoma cells reduced proliferation by 38%
      and invasion by 52% in vitro, and subcutaneous injection produced 80% smaller tumours in
      nude mice. These are isolated-fragment activities, distinct from the intact structural
      chain.
    supporting_text: The overexpression of NC1 α4(IV) in human UACC-903 melanoma cells strongly
      inhibited their in vitro proliferative (-38%) and invasive (-52%) properties.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual original Methods/Results read: human kidney-mRNA NC1(1–229), bacterial
      His-tagged protein, separate mammalian expression constructs, direct alphaVbeta3 SPR and partly
      antibody-sensitive melanoma adhesion. Melanoma growth/invasion and fragment comparisons are
      retained at their measured scopes. No endogenous proteolytic release, exact current-NC1 coordinate
      equivalence or full-domain antiangiogenesis is inferred.'
- id: PMID:32850867
  title: Angiogenesis Inhibition by a Short 13 Amino Acid Peptide Sequence of Tetrastatin, the α4(IV)
    NC1 Domain of Collagen IV.
  findings:
  - statement: A 13-residue sequence of the alpha4(IV) NC1 domain, QS-13, carries the anti-
      angiogenic activity and reduces Matrigel-plug vascularization by 65% in vivo.
    supporting_text: Fluorescence molecular tomography allows the measurement of a 65% decrease in
      Matrigel plug angiogenesis following QS-13 administration.
    reference_section_type: ABSTRACT
  - statement: QS-13 reduces endothelial migration and pseudotube formation in vitro and acts
      through alpha5beta1 integrin, a different receptor from the alphaVbeta3 engaged by full-
      length tetrastatin.
    supporting_text: QS-13 peptide decreases Human Umbilical Vein Endothelial Cells (HUVEC)
      migration and pseudotube formation in vitro.
    reference_section_type: ABSTRACT
  - statement: Tetrastatin, the alpha4(IV) NC1 domain, had previously been shown to inhibit tumour
      growth in a mouse melanoma model.
    supporting_text: We previously demonstrated that the α4 NC1 domain from type IV collagen,
      named Tetrastatin, inhibited tumor growth in a mouse melanoma model.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual Methods/Results read. Synthetic human-sequence QS-13 (P53420 residues1678–1690)
      and its biotinylated derivative bind alpha5beta1; HUVEC migration/pseudotubes and mouse Matrigel
      vascularization decrease, while HUVEC proliferation does not. Direct binding, adhesion blockade
      and angiogenic endpoints are distinct experiments; docking is a model. Natural peptide release/activity
      and corresponding full-NC1 antiangiogenesis remain unresolved.
- id: PMID:17239819
  title: Identification of novel short peptides derived from the alpha 4, alpha 5, and alpha 6 fibrils
    of type IV collagen with anti-angiogenic properties.
  findings:
  - statement: Eight 19- to 20-residue peptides derived from the alpha4, alpha5 and alpha6 chains
      of type IV collagen, named tetrastatins, pentastatins and hexastatins, suppress endothelial
      proliferation and migration in vitro.
    supporting_text: We have now identified eight novel 19- to 20-residue peptides derived from
      the alpha4, alpha5, and alpha6 fibrils of type IV collagen, which we have designated
      tetrastatins, pentastatins, and hexastatins, respectively.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected Methods/Results/Discussion inspected for distinct synthetic collagen-IV
      peptides and HUVEC response/migration assays. These 19–20-residue peptides are neither full
      NC1 nor QS-13. Table1 sequence cells are not present in this selected cache and were not independently
      recovered, so no exact sequence comparison or in-vivo validation is claimed.
core_functions:
- description: The alpha4 chain supplies the collagenous and NC1 structural elements of the alpha3/alpha4/alpha5
    type IV network in basement membranes, including the glomerular basement membrane. This network-forming
    matrix contribution is described by the existing collagen structural term; it does not assign
    processing or crosslink catalysis to the chain. The recombinant alpha4 NC1 noncanonical crystal
    is kept distinct from physiological protomer composition.
