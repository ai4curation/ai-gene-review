- term:
    id: GO:0030199
    label: collagen fibril organization
  evidence_type: NAS
  original_reference_id: PMID:29853175
  qualifier: involved_in
  review:
    action: UNDECIDED
    reason: GO:0030199 concerns processes determining collagen fibril size and arrangement, and is
      a child of extracellular matrix organization. COL4A4 forms a type IV network, but not being
      a fibrillar collagen does not establish that it cannot influence fibrils. The complete PMID:29853175
      abstract describes fibril assembly generally and does not identify a COL4A4-performed step;
      the original full text remains unavailable after the documented retrieval failures. Retain
      source-specific uncertainty rather than infer either participation or contradiction from collagen
      class alone. Independently established type IV trimer membership is a separate claim. This
      differs from the older merged COL4A1 REMOVE judgment because that collagen-class-based exclusion
      exceeds the available source evidence; the reopened COL4A1 assessment likewise retains UNDECIDED
      for this source.
    supported_by:
    - reference_id: PMID:29853175
    summary: The available review abstract discusses fibril assembly; the COL4A4-specific basis of
      this NAS assertion remains unverified.
