id: P53420
gene_symbol: COL4A4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL4A4 encodes the alpha4 chain of type IV collagen, a secreted structural component
  of basement membranes. It assembles with alpha3 and alpha5 chains into collagen IV protomers whose
  terminal interactions organize the glomerular basement-membrane network. The collagenous region
  and C-terminal NC1 domain contribute to this architecture; COL4A4 variants are associated with
  thin-basement-membrane nephropathy and Alport-spectrum kidney disease. Isolated recombinant human
  NC1, termed tetrastatin, binds integrin alphaVbeta3 and inhibits melanoma-cell growth and invasion
  in experimental systems. A synthetic C-terminal peptide, QS-13, binds alpha5beta1 and reduces endothelial
  migration and experimental vascularization, a fragment activity distinct from the intact structural
  chain.
