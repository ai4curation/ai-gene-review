- id: PMID:29853175
  title: Collagen Fibril Assembly and Function.
  findings:
  - statement: Collagen fibrils self-assemble from purified collagen molecules, so the review concerns
      intrinsic fibril assembly rather than a COL4A4-performed step.
    supporting_text: Collagen fibrils can assemble spontaneously from purified solutions of collagen
      molecules.
    reference_section_type: ABSTRACT
  - statement: In tissues, cellular machinery regulates fibril nucleation, orientation and size; the review
      does not name the gene products providing it.
    supporting_text: In developing tissues, however, in addition to the intrinsic self-assembly properties,
      there is cellular machinery that regulates fibril nucleation, spatial orientation, and fibril size,
      according to the tissue and stage of development.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Correct article identity and complete review abstract authenticated, but original
      publisher/repository full downloads failed. The specific target passage underlying the NAS
      assertions remains unverified. Independently established type IV membership can be retained,
      whereas the source-specific fibril-organization assertion remains undecided; no wrong-identifier
      or disproven-biology claim.
  full_text_unavailable: true
- id: PMID:30443360
  title: 'Structures of collagen IV globular domains: insight into associated pathologies, folding
    and network assembly.'
  findings:
  - statement: Crystal structures of recombinant alpha4 NC1 were determined alongside other type IV NC1
      domains.
    supporting_text: Crystal structures of the α2 and α4 non-collagenous domains generated by recombinant
      methods were also determined.
    reference_section_type: ABSTRACT
  - statement: Isolated alpha4 NC1 forms a noncanonical homo-oligomer with more subunits than the native
      hexamer.
    supporting_text: These domains spontaneously form homo-oligomers that deviate from the canonical
      architectures since they have a higher number of subunits (dimers of tetramers and of hexamers,
      respectively).
    reference_section_type: ABSTRACT
  - statement: The results indicate that extrinsic mechanisms restrict NC1 self-assembly in vivo, so the
      isolated-chain oligomer is not the native protomer.
    supporting_text: These findings provide insight into noncollagenous domain folding, while supporting the
      in vivo operation of extrinsic mechanisms for restricting the self-assembly of noncollagenous domains.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual human NC1 construct Methods, structures and assembly Results/Discussion
      read. Alpha4 crystal dodecamer is noncanonical; isolated alpha4 is monomeric in solution, mixed
      alpha345 yields alpha5 crystals and SPR tests alpha3/5. These are structural-interface data,
      not a native alpha345 reconstitution or autonomous adaptor assay.
