- id: PMID:30443360
  title: 'Structures of collagen IV globular domains: insight into associated pathologies, folding
    and network assembly.'
  findings:
  - statement: Basement membrane collagen IV scaffolds are built from triple alpha-chain helical protomers
      that associate end-to-end into networks, with the alpha1alpha2alpha1 and alpha3alpha4alpha5 hetero-oligomers
      found in vivo.
    supporting_text: Basement membranes are extracellular structures of epithelia and endothelia that
      have collagen IV scaffolds of triple α-chain helical protomers that associate end-to-end, forming
      networks.
    reference_section_type: ABSTRACT
  - statement: Recombinant alpha2 and alpha4 non-collagenous domains self-assemble into homo-oligomers
      larger than the canonical dimer-of-trimers, which the authors read as evidence that extrinsic
      mechanisms restrict self-assembly in vivo.
    supporting_text: These domains spontaneously form homo-oligomers that deviate from the canonical
      architectures since they have a higher number of subunits (dimers of tetramers and of hexamers,
      respectively).
    reference_section_type: ABSTRACT
  - statement: Alport syndrome missense mutations concentrate in the folding-nucleating core of the
      non-collagenous domain, suggesting a folding disorder.
    supporting_text: Alport's syndrome missense mutations concentrate within the core that nucleates
      the folding of the noncollagenous domain
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual human NC1 construct Methods, structures and assembly Results/Discussion
      read. Alpha4 crystal dodecamer is noncanonical; isolated alpha4 is monomeric in solution, mixed
      alpha345 yields alpha5 crystals and SPR tests alpha3/5. These are structural-interface data,
      not a native alpha345 reconstitution or autonomous adaptor assay.
