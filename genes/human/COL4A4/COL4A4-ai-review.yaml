core_functions:
- description: The alpha4 chain supplies the collagenous and NC1 structural elements of the alpha3/alpha4/alpha5
    type IV network in basement membranes, including the glomerular basement membrane. This network-forming
    matrix contribution is described by the existing collagen structural term; it does not assign
    processing or crosslink catalysis to the chain. The recombinant alpha4 NC1 noncanonical crystal
    is kept distinct from physiological protomer composition.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005587
    label: collagen type IV trimer
  locations:
  - id: GO:0005604
    label: basement membrane
  directly_involved_in:
  - id: GO:0032836
    label: glomerular basement membrane development
  supported_by:
  - reference_id: PMID:12193605
    supporting_text: these findings indicate that the alpha3, alpha4, and alpha5 chains occur together
      in the same triple-helical protomer
    reference_section_type: ABSTRACT
  - reference_id: PMID:30443360
    supporting_text: These findings provide insight into noncollagenous domain folding, while supporting
      the in vivo operation of extrinsic mechanisms for restricting the self-assembly of noncollagenous
      domains.
    reference_section_type: ABSTRACT
  - reference_id: PMID:17942953
    supporting_text: Molecular studies identified founder mutations in both COL4A3 and COL4A4 genes
      in 10 families.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19675380
    supporting_text: The alpha4 chain of the type 4 collagen family is an important component of the
      glomerular basement membrane (GBM) in the kidney.
    reference_section_type: ABSTRACT
suggested_questions:
- question: Which COL4A4 NC1 fragments are released naturally in human basement membranes, at what
    concentrations, and do they retain the integrin interactions measured with recombinant tetrastatin?
- question: Is the QS-13 sequence liberated in a stable receptor-active form in vivo, and does it
    regulate vascularization at endogenous concentrations rather than only after synthetic-peptide
    administration?
- question: How do native alpha3/alpha4/alpha5 NC1 contacts differ from the noncanonical isolated
    alpha4 crystal assembly, and which disease substitutions perturb protomer assembly versus later
    network incorporation?
- question: What specific COL4A4-performed mechanism, if any, controls collagen fibril size or arrangement
    in the source underlying the existing NAS annotation, as distinct from type IV network formation?
suggested_experiments:
- description: Use sequence-resolved mass spectrometry of human basement-membrane turnover samples
    to identify endogenous COL4A4 fragments, then test purified native and matched recombinant preparations
    in receptor-controlled binding assays.
  hypothesis: Natural cleavage products differ in abundance or receptor specificity from the full
    recombinant NC1 and synthetic QS-13 preparations.
- description: Reconstitute sequence-defined human alpha3/alpha4/alpha5 protomers with wild-type
    or disease-associated alpha4, measuring incorporation, NC1 contacts and network ultrastructure
    separately from crosslink chemistry supplied by peroxidasin.
  hypothesis: Some alpha4 variants disrupt chain assembly or network architecture without conferring
    a catalytic processing defect on COL4A4.
- description: Compare full NC1 and exact QS-13 in receptor-loss/rescue endothelial assays, separating
    adhesion, migration, proliferation and vascularization endpoints at matched exposure.
  hypothesis: The synthetic C-terminal ligand and full NC1 have distinct receptor and endothelial-response
    profiles.
status: COMPLETE
