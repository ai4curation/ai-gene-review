  - statement: Tetrastatin, the C-terminal noncollagenous domain of alpha4(IV), has anti-tumour
      activity mediated by integrin alphaVbeta3, an extracellular fragment activity distinct from
      the intact chain's structural role.
    supporting_text: Tetrastatin, the non-collagenous C-terminal domain of collagen alpha-4(IV)
      has anti-tumor activity in a human melanoma model,  decreasing proliferative and invasive
      properties of melanoma cells.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact cached event identity/summary and current content-service paths to P53420
      inspected. The tetrastatin event describes the extracellular NC1 fragment binding alphaVbeta3.
      Direct recombinant human NC1 binding in PMID:22539938 independently supports this fragment
      context. Preserve the source location without equating the soluble experimental NC1 preparation
      with all forms of intact collagen IV. The complete cached event summary and current participant
      traversal were inspected. The event’s cited primary papers were not all independently reread.
- id: Reactome:R-HSA-8944265
  title: Association of procollagen type IV
  findings:
  - statement: The C-terminal propeptide drives association of three alpha chains into a trimeric
      non-helical procollagen, fixing composition and register before helix nucleation.
    supporting_text: The C-terminal propeptide is essential for the association of three alpha
      chains into a trimeric non-helical procollagen.
    reference_section_type: DATABASE_ENTRY
  - statement: Chain alignment sets trimer composition and register and nucleates the triple helix
      at the C-terminus, which then zips towards the N-terminus.
    supporting_text: Alignment determines the composition of the trimer, brings the individual
      chains into the correct register and initiates formation of the triple helix at the
      C-terminus, which then proceeds to the N-terminus in a zipper-like fashion
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact cached event identity/summary and current content-service paths to P53420
      inspected. The complete Reactome type IV procollagen association event and literal current
      component/member paths reach P53420 in ER-luminal collagen material. This supports precursor
      localization during biosynthesis. The chain provides or carries the collagen structure, while
      other proteins perform processing or transport; retain the original location without assigning
      their catalytic/export functions. The event’s cited primary papers were not all independently
      reread.
