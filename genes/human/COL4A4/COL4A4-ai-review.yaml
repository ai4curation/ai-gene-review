- id: PMID:17942953
  title: COL4A3/COL4A4 mutations producing focal segmental glomerulosclerosis and renal failure in
    thin basement membrane nephropathy.
  findings:
  - statement: Founder mutations in COL4A3 and COL4A4 were identified in 10 of 13 Cypriot families
      segregating thin basement membrane nephropathy, establishing COL4A4 loss of function as a
      cause of thin glomerular basement membranes.
    supporting_text: Molecular studies identified founder mutations in both COL4A3 and COL4A4
      genes in 10 families.
    reference_section_type: ABSTRACT
  - statement: COL4A3/COL4A4 mutations account for roughly 40% of thin basement membrane
      nephropathy cases.
    supporting_text: Mutations in the COL4A3/COL4A4 genes of type IV collagen have been found in
      approximately 40% of cases of thin basement membrane nephropathy
    reference_section_type: ABSTRACT
  - statement: A substantial fraction of heterozygous carriers progressed to chronic renal failure
      or end-stage renal disease over decades of follow-up, so the thin-membrane phenotype is not
      benign.
    supporting_text: During follow-up of up to three decades, 31 of these 82 patients (37.8%)
      developed chronic renal failure and 16 (19.5%) reached end-stage renal disease.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
