id: Q92851
gene_symbol: CASP10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CASP10 is a tandem-death-effector-domain initiator caspase recruited by FADD to Fas/CD95 and TRAIL death-inducing
  signaling complexes and to related cytosolic death platforms. Proximity-induced CASP10 activation generates an Asp-directed
  cysteine endopeptidase that can mature downstream caspases; prodomain-only isoforms can instead scaffold NF-kappaB signaling,
  and a CASP10-c-FLIP(L) protease complex has a survival role in myeloma cells by cleaving BCLAF1 to restrain autophagic cell
  death.'
