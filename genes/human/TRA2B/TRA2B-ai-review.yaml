- term:
    id: GO:0048026
    label: positive regulation of mRNA splicing, via spliceosome
  evidence_type: IDA
  original_reference_id: PMID:15009664
  qualifier: involved_in
  review:
    summary: >-
      Positive regulation of spliceosomal mRNA splicing is supported for MAPT exon 10 and other
      enhancer-dependent targets.
    action: ACCEPT
    reason: >-
      The cached abstract for the original paper does not name TRA2B, so the curator's full-text
      assessment is retained and independently corroborated by direct TRA2B binding and
      RNA-interference studies on the same MAPT enhancer.
    supported_by:
    - reference_id: PMID:12649279
