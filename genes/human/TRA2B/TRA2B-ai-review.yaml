      supporting_text: >-
        Small interfering RNA-mediated suppression of endogenous SF2/ASF and Tra2beta
        significantly reduces exon 10 splicing.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19282290
  qualifier: enables
  supporting_entities:
  - UniProtKB:P84586
  review:
    summary: >-
      The WITH/FROM accession P84586 resolves to rat Rbmxrtl, an hnRNP G retrogene-like pre-mRNA
      splicing regulator, so the interaction is more informative than generic protein binding.
    action: MODIFY
    reason: >-
      The source paper characterizes hnRNP G-family proteins as supraspliceosomal regulators of
      alternative splice-site selection. Splicing factor binding therefore records the verified
      partner class while remaining secondary to TRA2B's RNA-binding activity.
    proposed_replacement_terms:
    - id: GO:1990935
      label: splicing factor binding
    supported_by:
    - reference_id: PMID:19282290
      supporting_text: >-
        hnRNP G is part of the supraspliceosome, where it regulates alternative splice site
        selection in a concentration-dependent manner.
