  review:
    summary: >-
      TRA2B regulates spliceosomal exon choice rather than catalysing constitutive pre-mRNA
      splicing.
    action: MODIFY
    reason: >-
      The founding biochemical study explicitly found no constitutive-splicing activity and
      instead demonstrated sequence-specific activation of enhancer-dependent splicing. The
      regulatory alternative-splicing term captures the activity without implying that TRA2B
      performs the core transesterification reaction.
    proposed_replacement_terms:
    - id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:9546399
      supporting_text: >-
        Neither Tra2 protein functioned in constitutive splicing in vitro, but both activated
        enhancer-dependent splicing in a sequence-specific manner and restored it after
        inhibition with competitor RNA.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:9546399
  qualifier: located_in
  review:
    summary: >-
      Nuclear or nucleoplasmic localization is appropriate for a sequence-specific pre-mRNA
      splicing regulator.
    action: ACCEPT
    reason: >-
      This localization agrees with direct microscopy showing nuclear TRA2B in SC35-positive
      speckles. The localization is a core setting for its RNA-splicing activity.
    supported_by:
    - reference_id: PMID:9212162
      supporting_text: >-
        htra2-beta1 is a nuclear protein that colocalizes with SC35 in a speckled pattern.
- term:
    id: GO:1990825
    label: sequence-specific mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:21399644
  qualifier: enables
  review:
    summary: >-
      Direct structural and mutational evidence establishes sequence-specific recognition of an
      AGAA element by the TRA2B RNA-recognition motif.
    action: NEW
    reason: >-
      GOA contains only broader RNA- and mRNA-binding terms. This term captures the
      experimentally demonstrated molecular specificity and is the best representation of
      TRA2B's core molecular function.
    supported_by:
    - reference_id: PMID:21399644
      supporting_text: >-
        The central 5'-AGAA-3' motif is specifically recognized by residues from the β-sheet of
        the RRM and by residues from both extremities flanking the RRM.
- term:
    id: GO:0048025
    label: negative regulation of mRNA splicing, via spliceosome
  evidence_type: IDA
  original_reference_id: PMID:12761049
  qualifier: involved_in
  review:
    summary: >-
      TRA2B can repress exon incorporation as well as activate it, depending on the exon and
      cellular context.
    action: NEW
    reason: >-
      Existing GOA records the general and positive regulatory activities but omits the directly
      demonstrated repressive direction. The paper reports several exons for which hTra2beta
      acts as a repressor.
    supported_by:
    - reference_id: PMID:12761049
      supporting_text: >-
        We show here that hnRNP G and hTra2beta have opposite effects upon the incorporation of
        several exons, both being able to act as either an activator or a repressor.
