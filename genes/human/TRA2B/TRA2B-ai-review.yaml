core_functions:
- description: >-
    Binds purine-rich sequences in pre-mRNA exonic splicing enhancers through its RRM and
    cooperates with splicing factors and snRNP machinery to regulate exon selection. Sequence
    specificity is the defining molecular feature represented here; the accepted pre-mRNA
    binding annotation independently captures the precursor-RNA substrate. Depending on RNA and
    partner context, TRA2B promotes or represses exon inclusion, while TRA2A can compensate at
    many endogenous targets.
  molecular_function:
    id: GO:1990825
    label: sequence-specific mRNA binding
  directly_involved_in:
  - id: GO:0048024
    label: regulation of mRNA splicing, via spliceosome
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0005681
    label: spliceosomal complex
  supported_by:
  - reference_id: PMID:21399644
    supporting_text: >-
      The central 5'-AGAA-3' motif is specifically recognized by residues from the β-sheet of
      the RRM and by residues from both extremities flanking the RRM.
  - reference_id: PMID:9546399
    supporting_text: >-
      Neither Tra2 protein functioned in constitutive splicing in vitro, but both activated
      enhancer-dependent splicing in a sequence-specific manner and restored it after inhibition
      with competitor RNA.
  - reference_id: PMID:10339552
    supporting_text: >-
      The results suggest a model for ESE function in which the SRm160/300 splicing coactivator
      promotes critical interactions between ESE-bound "activators" and the snRNP machinery of
      the spliceosome.
  - reference_id: PMID:12761049
    supporting_text: >-
      We show here that hnRNP G and hTra2beta have opposite effects upon the incorporation of
      several exons, both being able to act as either an activator or a repressor.
  - reference_id: PMID:25208576
    supporting_text: >-
      Here we find simultaneous--but not individual--depletion of Tra2α and Tra2β induces
      substantial shifts in splicing of endogenous Tra2β target exons, and that both
      constitutive and alternative target exons are under dual Tra2α-Tra2β control.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous exons require TRA2B specifically, rather than redundant TRA2A/TRA2B
    activity, across human cell types and physiological expression ranges?
- question: >-
    Which positional RNA-binding, local sequence, partner, and phosphorylation features
    determine whether TRA2B promotes or represses exon inclusion?
- question: >-
    Are the short TRA2B isoform 2 and N-terminally truncated isoform 3 stable endogenous
    products with distinct RNA targets or regulatory activities?
suggested_experiments:
- hypothesis: >-
    TRA2B has both paralog-redundant and cell-type-specific direct splicing targets that are
    masked by TRA2A compensation.
  description: >-
    Introduce rapid endogenous degrons for TRA2B and TRA2A in several differentiated human cell
    types and compare acute single and joint depletion by TRA2B/TRA2A eCLIP and short- plus
    long-read RNA sequencing. Rescue from a matched locus with wild-type TRA2B or an RRM
    RNA-contact-defective mutant, and classify as direct targets only events with nearby binding
    and wild-type-specific rescue.
  experiment_type: Acute degron perturbation, eCLIP, and RNA sequencing
- hypothesis: >-
    Motif position, local RNA architecture, partner abundance, and RS-domain phosphorylation
    determine whether TRA2B activates or represses exon inclusion.
  description: >-
    Test a massively parallel minigene library varying AGAA/GAA and structured CAA elements,
    their position relative to splice sites, and adjacent regulator motifs under titrated TRA2B
    expression and perturbation of TRA2A, RBMX, SR proteins, CLK kinases, and SRPK kinases.
    Validate predictive sequence features by base editing representative endogenous exons.
  experiment_type: Massively parallel splicing reporter and endogenous base editing
- hypothesis: >-
    TRA2B isoform 3 retains RNA binding but has altered partner recruitment, whereas isoform 2
    is unstable or lacks splicing-regulatory activity.
  description: >-
    Establish endogenous expression of each isoform by long-read RNA sequencing and targeted
    proteomics, then perform matched single-copy isoform rescue in an acute TRA2B-depletion
    background. Compare nuclear localization, eCLIP profiles, protein interactomes, and rescue
    of direct splicing events.
  experiment_type: Isoform-resolved proteomics, eCLIP, and functional rescue
