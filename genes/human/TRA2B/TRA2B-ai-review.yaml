    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12165565
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0DJD3
  - UniProtKB:P38159
  review:
    summary: >-
      Direct interactions with RBMY1A1 and RBMX are more informatively represented as splicing
      factor binding than as generic protein binding.
    action: MODIFY
    reason: >-
      The WITH/FROM partners P0DJD3 and P38159 are RBMY1A1 and RBMX, and the paper directly shows
      specific binding of hnRNP-G/RBM proteins to Htra2-beta1 in an exon-inclusion mechanism.
      Splicing factor binding preserves that informative partner class.
    proposed_replacement_terms:
    - id: GO:1990935
      label: splicing factor binding
    supported_by:
    - reference_id: PMID:12165565
      supporting_text: >-
        hnRNP-G and RBM non-specifically bind RNA, but directly and specifically bind
        Htra2-beta1, an SR-like splicing factor which we have previously shown to stimulate
        inclusion of exon 7 through a direct interaction with the AG-rich ESE in SMN2 exon 7
        pre-mRNA.
