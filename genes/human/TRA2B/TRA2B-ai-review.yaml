- term:
    id: GO:0043484
    label: regulation of RNA splicing
  evidence_type: IMP
  original_reference_id: PMID:10749975
  qualifier: involved_in
  review:
    summary: >-
      The experiment establishes regulation of enhancer-dependent pre-mRNA splicing but does not
      restrict TRA2B's regulatory program to alternative target exons.
    action: MODIFY
    reason: >-
      Perturbing the RBM interaction domain inhibited splicing of a TRA2B-bound enhancer
      substrate. The spliceosome-specific regulatory parent captures this result and remains
      compatible with later evidence that TRA2 proteins control both constitutive and alternative
      target exons.
    proposed_replacement_terms:
    - id: GO:0048024
      label: regulation of mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:10749975
      supporting_text: >-
        Incubation with the protein interaction domain of RBM inhibited splicing in vitro of a
        specific pre-mRNA substrate containing an essential enhancer bound by Tra2beta.
