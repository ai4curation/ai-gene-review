id: P62995
gene_symbol: TRA2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TRA2B is an SR-like nuclear splicing regulator whose central RNA-recognition motif binds
  AGAA/GAA-rich and structured CAA elements in pre-mRNAs. Through its arginine/serine-rich
  regions and interactions with other splicing factors, it couples bound exonic elements to
  spliceosomal machinery and controls exon selection, promoting or repressing inclusion
  according to RNA and partner context. Established targets include MAPT, SMN2, CHEK1, AGER, and
  the TRA2B poison exon that mediates negative autoregulation; TRA2A compensates for TRA2B at
  many endogenous targets.
