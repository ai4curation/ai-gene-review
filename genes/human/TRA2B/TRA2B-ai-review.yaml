- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: >-
      The annotation captures TRA2B RNA recognition but is less specific than the established
      sequence-selective activity of its RNA-recognition motif.
    action: MODIFY
    reason: >-
      Biochemical and structural studies show direct recognition of AGAA/GAA-rich and structured
      CAA elements in pre-mRNAs. Sequence-specific mRNA binding is therefore more informative
      than generic nucleic acid, RNA, or mRNA binding.
    proposed_replacement_terms:
    - id: GO:1990825
      label: sequence-specific mRNA binding
    supported_by:
    - reference_id: PMID:21399644
      supporting_text: >-
        The central 5'-AGAA-3' motif is specifically recognized by residues from the β-sheet of
        the RRM and by residues from both extremities flanking the RRM.
