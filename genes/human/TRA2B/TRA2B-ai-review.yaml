- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003742
  - PANTHER:PTN000391532
  - RGD:1306751
  - RGD:1565256
  - UniProtKB:P62995
  - UniProtKB:Q13595
  review:
    summary: >-
      The family-level annotation correctly places TRA2B in spliceosomal mRNA splicing, but
      describes it as core machinery rather than as a regulator of splice-site choice.
    action: MODIFY
    reason: >-
      TRA2B regulates both constitutive and alternative target exons, so the general regulatory
      parent GO:0048024 is more accurate here than the alternative-only child. It also avoids
      implying that TRA2B performs the core splicing reaction.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
    proposed_replacement_terms:
    - id: GO:0048024
      label: regulation of mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:25208576
      supporting_text: >-
        Here we find simultaneous--but not individual--depletion of Tra2α and Tra2β induces
        substantial shifts in splicing of endogenous Tra2β target exons, and that both
        constitutive and alternative target exons are under dual Tra2α-Tra2β control.
