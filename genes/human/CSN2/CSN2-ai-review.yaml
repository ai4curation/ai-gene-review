gene_symbol: CSN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
aliases:
- Beta-casein
- CASB
description: >-
  CSN2 encodes beta-casein, a secreted, intrinsically disordered phosphoprotein that is
  the dominant casein of human milk (roughly 70-80% of the casein fraction; human milk
  lacks alpha-s2-casein and contains little alpha-s1-casein). It is synthesized by
  mammary alveolar epithelial cells during lactation, phosphorylated in the secretory
  pathway and secreted into the alveolar lumen. Human beta-casein occurs as six
  phosphoforms carrying 0-5 phosphates on serine/threonine residues clustered near the
  N-terminus; this phosphorylated cluster binds calcium, and the protein self-associates
  through its hydrophobic C-terminal region. Together with colloidal calcium phosphate
  and the surface-located kappa-casein (CSN3), beta-casein assembles into casein
  micelles, colloidal particles that keep calcium phosphate in a stable supersaturated
  suspension and deliver calcium, phosphate and amino acids to the suckling infant.
  Caseins belong to the secretory calcium-binding phosphoprotein (SCPP) gene cluster on
  chromosome 4q13. Mice lacking the orthologous gene still lactate and assemble smaller
  micelles, so beta-casein shapes milk composition and micelle size without being
  individually essential. Gastric and intestinal proteolysis of beta-casein releases
  peptides (for example caseinophosphopeptides, casomorphin-like and ACE-inhibitory
  peptides) that show bioactivities in vitro; these are properties of digestion
  products rather than activities of the secreted protein.
