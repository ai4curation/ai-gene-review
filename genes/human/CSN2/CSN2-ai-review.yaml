    phosphoseryl cluster and, with colloidal calcium phosphate and kappa-casein,
    self-assembles into casein micelles in the mammary alveolar lumen, sequestering
    calcium phosphate in a stable colloidal suspension that supplies calcium, phosphate
    and amino acids to the suckling infant.
