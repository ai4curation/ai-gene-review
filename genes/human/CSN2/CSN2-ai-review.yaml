- term:
    id: GO:0006816
    label: calcium ion transport
  evidence_type: TAS
  original_reference_id: PMID:2387396
  qualifier: involved_in
  review:
    summary: >-
      Author statement inferred from the calcium-binding capacity of beta-casein and
      the role of milk in supplying calcium to the infant.
    action: REMOVE
    reason: >-
      GO calcium ion transport is the directed movement of calcium into, out of, within
      or between cells by an agent such as a transporter or pore. Beta-casein is not a
      transporter: it binds calcium and colloidal calcium phosphate in the alveolar
      lumen and milk, keeping the mineral in a stable suspension, and is itself
      secreted as cargo. Delivery of calcium to the infant by drinking milk is not a
      cellular calcium transport process. The biology is captured by calcium ion
      binding and by the proposed calcium ion sequestering activity. The cited paper is
      a cDNA sequencing report with no transport experiment.
    supported_by:
    - reference_id: PMID:2387396
      supporting_text: A cDNA of 1065 bp encoding the human milk beta-casein was cloned
        and sequenced
