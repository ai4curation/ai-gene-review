proposed_new_terms:
- proposed_name: casein micelle
  proposed_definition: >-
    A colloidal protein-mineral particle, typically 50-500 nm in diameter, found in the
    milk of mammals and formed in the lumen of mammary alveoli from calcium-sensitive
    phosphorylated caseins (alpha-s1, alpha-s2 and beta-casein) associated with
    nanoclusters of amorphous calcium phosphate, and stabilized at its surface by
    kappa-casein.
  justification: >-
    The casein micelle is the defining supramolecular assembly of all casein gene
    products and the place where they act, but GO has no cellular component for it;
    caseins can currently only be annotated to extracellular region. A specific term
    would let alpha-, beta- and kappa-caseins be annotated to their shared structure
    across mammals.
suggested_questions:
- question: >-
    Calcium ion sequestering activity (GO:0140314) is used here as an approximation:
    beta-casein's phosphoseryl clusters actually sequester nanoclusters of amorphous
    calcium phosphate rather than free calcium ions. Should GO add a more precise term
    (for example calcium phosphate sequestering activity) for the calcium-sensitive
    caseins?
- question: >-
    Does the phosphorylation level of human beta-casein (0P to 5P forms), set by the
    Golgi kinase FAM20C, regulate the calcium-phosphate carrying capacity and size of
    human casein micelles in vivo, and does it vary over lactation?
- question: >-
    Is the cysteine-protease inhibition reported for milk beta-casein detectable at
    physiological casein concentrations in milk or in the infant stomach, and is it
    mediated by intact protein or only by released peptides?
suggested_experiments:
- hypothesis: >-
    The number of phosphates on human beta-casein determines how much calcium phosphate
    each micelle can hold without precipitation.
  description: >-
    Express recombinant human beta-casein in mammary epithelial cells with wild-type or
    serine-to-alanine variants at Thr18/Ser21/Ser23/Ser24/Ser25, reconstitute micelles
    with kappa-casein and calcium phosphate, and measure micelle size, colloidal calcium
    and phosphate content, and precipitation thresholds.
