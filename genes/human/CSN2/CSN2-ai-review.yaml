- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:11949848
  review:
    summary: >-
      Phosphorylated human beta-casein binds Ca2+ and, together with kappa-casein and
      inorganic phosphate, assembles into micelles that hold calcium phosphate in a
      stable colloidal form instead of letting it precipitate.
    action: NEW
    reason: >-
      Captures the core molecular role of the calcium-sensitive caseins: binding
      calcium (and calcium phosphate nanoclusters) via phosphoseryl clusters so that
      the ion is held in micelles rather than precipitating, keeping milk
      supersaturated in calcium phosphate. Consistent with the treatment of
      alpha-s1-casein (CSN1S1) in this repository. Beta-casein is the dominant
      calcium-sensitive casein in human milk, so the activity is carried mainly by it
      in humans. The term is an approximation, since caseins sequester calcium
      phosphate nanoclusters rather than free calcium ions (see suggested_questions).
    supported_by:
    - reference_id: PMID:11949848
