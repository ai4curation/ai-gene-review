core_functions:
- description: >-
    Sodium-independent, membrane-potential-dependent transmembrane transport of prostaglandins
    across the plasma membrane. PGT is a secondary active anion exchanger that couples
    prostaglandin uptake to efflux of intracellular monovalent anions (principally glycolytic
    lactate), operating bidirectionally; it mediates cellular uptake of extracellular
    prostaglandins for metabolic clearance and signal termination (delivering them to the
    cytoplasm for HPGD-mediated oxidation).
