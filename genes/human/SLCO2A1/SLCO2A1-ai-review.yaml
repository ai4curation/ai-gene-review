id: Q92959
gene_symbol: SLCO2A1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLCO2A1 encodes OATP2A1, the prostaglandin transporter (PGT), a 12-transmembrane
  multi-pass plasma membrane protein of the SLCO/OATP (organic anion transporting
  polypeptide; TC 2.A.60) family. PGT is the prototypical prostaglandin transporter: it
  mediates Na+-independent, membrane-potential-dependent transmembrane transport of
  prostaglandins (mainly PGE2, PGE1, PGE3, PGF2alpha, PGD2, PGH2) and thromboxane B2. Rather
  than a Na+- or proton-coupled symporter, it is a secondary active anion exchanger that
  couples prostaglandin uptake to the efflux of intracellular monovalent anions, principally
  lactate generated by glycolysis, and can operate bidirectionally. Its major physiological
  role is cellular uptake of extracellular prostaglandins for metabolic clearance and signal
  termination: imported prostaglandins are delivered to the cytoplasm where
  15-hydroxyprostaglandin dehydrogenase (HPGD) oxidizes and inactivates them. PGT is broadly
  expressed (notably lung, kidney, spleen, heart, endometrium, ovary, and the basal membrane
  of Sertoli cells at the blood-testis barrier) and participates in processes such as
  transcellular prostaglandin release, renal sodium balance, endometrial decidualization and
  ovulation. Loss-of-function variants cause primary hypertrophic osteoarthropathy
  (PHOAR2/pachydermoperiostosis), isolated digital clubbing, and are associated with chronic
  enteropathy, reflecting failure to clear PGE2.
