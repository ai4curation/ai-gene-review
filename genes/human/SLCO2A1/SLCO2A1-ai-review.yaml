proposed_new_terms: []
suggested_questions:
- question: >-
    PGT localizes apically in some epithelia (for vectorial PG release) and basolaterally/basally
    in others. What determines its polarized targeting in a given cell type, and should GO capture
    this context-dependence rather than a single membrane sub-location?
- question: >-
    Under non-glycolytic conditions PGT is reported to use counter-substrates other than lactate.
    Which physiological anions serve as counter-substrates in vivo, and does this alter the
    direction (uptake vs efflux) of prostaglandin transport?
suggested_experiments:
- description: >-
    Cryo-EM structures of SLCO2A1 are now available (e.g. PDB 8KGI, 9JUQ). Combine structure-guided
    mutagenesis of the central substrate cavity with PGE2/lactate flux assays to map the
    prostaglandin and counter-anion binding sites and test the proposed PG/lactate antiport
    stoichiometry.
- description: >-
    Use polarized epithelial monolayers (e.g. MDCK) with apical vs basolateral PGT targeting to
    directly measure vectorial (transcellular) prostaglandin release and quantify the contribution
    of PGT-mediated uptake to HPGD-dependent PG clearance/signal termination.
