- id: PMID:28418331
  title: Collagen IV and basement membrane at the evolutionary dawn of metazoan tissues.
  findings:
  - statement: Collagen IV is absent from unicellular sister groups of animals (choanoflagellates, filastereans,
      amoebozoans, apusozoans).
    supporting_text: unicellular protists (Choanozoa, Filasterea, Amoebozoa, Apusozoa) do not contain
      collagen IV as determined by genomic analyses
  - statement: Collagen IV and basement membranes are present in ctenophores, placozoans and homoscleromorph
      sponges; demosponges and hexactinellids lack both.
    supporting_text: Placozoa contains the necessary components for a BM, including collagen IV, laminin,
      perlecan, and nidogen
  - statement: Homoscleromorph sponges have basement membranes with collagen IV.
    supporting_text: In Porifera, the ECM of homoscleromorph sponges contains basement membranes (Boute
      et al., 1996), with collagen IV and laminin, but no spongin
  - statement: Choanoflagellates have collagenous GXY repeats and laminin-like domains but no complete
      ECM components.
    supporting_text: collagenous GXY repeats were identified in Monosiga, Salpingoeca, and Dictyost
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed esummary checked; full text read. Primary source for the animal-specific origin
      of collagen IV.
- id: PMID:24344311
  title: A unique covalent bond in basement membrane is a primordial innovation for tissue evolution.
  findings:
  - statement: The sulfilimine cross-link of collagen IV, made by peroxidasin, is conserved throughout
      Eumetazoa and arose at the Porifera-Cnidaria divergence.
    supporting_text: the cross-link is conserved throughout Eumetazoa and arose at the divergence of Porifera
      and Cnidaria over 500 Mya
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed esummary checked; full text cached.
