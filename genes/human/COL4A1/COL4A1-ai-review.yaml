  - reference_id: PMID:24344311
  - reference_id: PMID:23065703
    supporting_text: thickening of the capillary basement membrane in the skin was
      documented
- description: The COL4A1_ARRESTEN NC1-derived cleavage-product class has an activity
    distinct from the precursor’s matrix role. Experimentally applied human arresten
    preparations engage endothelial cell surfaces through a cell-based alpha1beta1-integrin
    interaction and suppress angiogenic responses. Nonretracted antibody-controlled
    attachment and alpha1-integrin-null comparisons support this scoped ligand activity;
    whole-cell binding does not establish purified-integrin affinity. The preparations
    include tagged/refolded recombinant material and do not test every natural isoform
    or establish endogenous concentrations. The retracted 2005 signaling study is
    excluded from positive support.
  molecular_function:
    id: GO:0005178
    label: integrin binding
