id: P02462
gene_symbol: COL4A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL4A1 encodes the alpha1 chain of type IV collagen, a network-forming
  constituent of basement membranes. The NC1-containing chain combines with COL4A2
  in alpha1(IV)2alpha2(IV) protomers; associations through the C-terminal NC1 and
  N-terminal 7S regions connect protomers into a matrix network. Peroxidasin-dependent
  sulfilimine cross-links stabilize adjoining NC1 domains. This network supports tissue
  architecture and vascular, renal and other basement membranes, and pathogenic COL4A1
  variants can disrupt their organization and integrity. Proteolysis can release the
  NC1-derived fragment arresten, which interacts with endothelial cell surfaces and
  suppresses angiogenic responses in experimental fragment preparations. Alternative
  splicing also produces a shortened chain lacking the NC1 region. The collagen IV
  gene family extends beyond animals to the filasterean Ministeria vibrans, whereas
  organized basement membranes have a distinct and variable distribution among animal
  lineages.
