  original_reference_id: PMID:18775695
  review:
    action: NEW
    reason: 'Administered recombinant human NC1-derived arresten itself performs extracellular
      ligand work: controlled endothelial attachment/survival experiments and Matrigel/tumor
      assays show an alpha1-integrin-dependent reduction of angiogenic responses.
      This is not an inference from precursor cleavage or knockout necessity alone.
      The earlier nonretracted human-arresten study corroborates the effect. The scope
      is the tested released/engineered fragment preparations, not all precursor/alternative
      products; the 2005 retracted article is excluded. Typed is_a/part_of ancestor/descendant
      coverage against every original and replacement term is disjoint. Same-role
      processed canstatin and tumstatin carry direct IDA annotations to this term;
      the exact endostatin query was empty and is not treated as a negative finding.
      More specific branching/sprouting/adhesion-regulation descendants are not independently
      resolved, and the current GO-CAM index has no target match. The structured COL4A1_ARRESTEN
      cleavage-product class records this restriction; its official 1445-1669 mapping
      identifies the natural-chain feature, not identical endpoints for every engineered
      preparation.'
    supported_by:
    - reference_id: PMID:18775695
      supporting_text: the number of blood vessels decreased to 60% of control
    - reference_id: PMID:10811134
    summary: Applied human NC1-derived arresten suppresses angiogenic responses with
      alpha1-integrin-dependent assay controls.
- term:
    id: GO:0005178
    label: integrin binding
  evidence_type: IDA
  original_reference_id: PMID:18775695
  review:
    action: NEW
    summary: Applied human arresten/NC1 engages endothelial alpha1beta1 integrin in
      controlled cell-attachment assays.
    reason: 'This assertion is limited to the COL4A1_ARRESTEN cleavage-product class
      and the tested human NC1-derived preparations, not every intact chain or splice
      product. In the nonretracted 2008 study, an alpha1beta1-blocking antibody reduced
      wild-type mouse lung endothelial attachment to immobilized recombinant human
      arresten, whereas alpha1-null cells lacked that antibody-sensitive response;
      IgG and fibronectin controls distinguish the ligand/receptor interaction. The
      human HUVEC anti-alpha1/anti-beta1 attachment experiments in the separate 2000
      paper corroborate it. These are cell-based binding assays, not purified-integrin
      affinity measurements; tagged/refolded constructs, collagenase-isolated placental
      material and endogenous cleavage products are not assumed equivalent. The retracted
      2005 paper supplies no support. The effective annotations contain neither this
      term nor an ancestor/descendant: row 3 retains original GO:0005515 as provenance
      but replaces its output with GO:0005518. The child GO:0098640 can describe the
      coated-substrate attachment context. Broad GO:0005178 is used here for the shared
      receptor-engagement activity across attachment and soluble-fragment inhibition;
      a second, redundant child assertion is not added. Existing arresten mapping
      and core retain this product restriction.'
    supported_by:
    - reference_id: PMID:18775695
      supporting_text: the attachment of the wild type MLEC was reduced to half
    - reference_id: PMID:10811134
