      in Ministeria vibrans. This corrects a blanket filasterean absence claim; it
      does not establish a basement membrane or a performed human-like structural
      role in the unicellular organism.
- id: PMID:42265479
  title: A unicellular relative links aggregative multicellularity to animal origins.
  findings:
  - statement: Ministeria vibrans upregulates its alpha type IV collagen, with other
      ECM genes, during cell aggregation.
    supporting_text: Diverse ECM-related genes were also upregulated, including alpha
      type IV collagen
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual primary Results report increased expression of alpha type
      IV collagen among ECM-related genes during Ministeria aggregation. Expression
      supports regulation in that model, not a demonstrated matrix mechanism.
- id: PMID:28418331
  title: Collagen IV and basement membrane at the evolutionary dawn of metazoan tissues.
  findings:
  - statement: Collagen IV is absent from unicellular sister groups of animals (choanoflagellates,
      filastereans, amoebozoans, apusozoans).
    supporting_text: do not contain collagen IV as determined by genomic analyses
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:28726632
      - PMID:42265479
      review_notes: Correct for the genomes surveyed (choanoflagellates, Capsaspora),
        but not for Filasterea as a whole. A later genome survey found a canonical
        type IV collagen gene in the filasterean Ministeria vibrans, and a 2026 study
        found it upregulated during Ministeria aggregation. The basement membrane
        itself remains animal-specific.
      supported_by:
      - reference_id: PMID:28726632
      - reference_id: PMID:42265479
  - statement: Collagen IV and basement membranes are present in ctenophores, placozoans
      and homoscleromorph sponges; demosponges and hexactinellids lack both.
    finding_review:
      finding_status: DISPUTED
      review_notes: The historical statement conflates molecular toolkit with an organized
        basement membrane and overgeneralizes ctenophores. This same paper explicitly
        reports absent basement membranes in Trichoplax and Mnemiopsis, while Beroe,
        Pleurobrachia and homoscleromorph sponges are positive. Preserve the historical
        wording for provenance but do not use its blanket distribution claim.
      supported_by:
      - reference_id: PMID:28418331
  - statement: Homoscleromorph sponges have basement membranes with collagen IV.
  - statement: Choanoflagellates have collagenous GXY repeats and laminin-like domains
      but no complete ECM components.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual original evolutionary Methods/Results/Discussion inspected.
      Some ctenophores and homoscleromorph sponges show basement membranes; Trichoplax
      and Mnemiopsis lack organized basement membranes despite relevant components.
      Historical finding statements are retained with explicit corrections; the separate
      Ministeria discovery supersedes blanket unicellular absence.
- id: PMID:24344311
  title: A unique covalent bond in basement membrane is a primordial innovation for
    tissue evolution.
  findings:
  - statement: The sulfilimine cross-link of collagen IV, made by peroxidasin, is
      conserved throughout Eumetazoa and arose at the Porifera-Cnidaria divergence.
    supporting_text: the cross-link is conserved throughout Eumetazoa and arose at
      the divergence of Porifera and Cnidaria over 500 Mya
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:28418331
      review_notes: The original human sulfilimine measurements and peroxidasin-dependent
        chemistry remain supported, but the universal Eumetazoa distribution is too
        broad. The later study distinguishes sulfilimine-bearing bilaterian/cnidarian
        material, with a Hydra exception, from the surveyed ctenophores, which lack
        the required NC1 residues and instead show an alternative cysteine-loop cross-linking
        mechanism. Preserve the historical finding statement without treating it as
        universal phyletic conservation.
      supported_by:
      - reference_id: PMID:28418331
        supporting_text: this cross-link is absent in Ctenophora
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual human NC1 mass-spectrometric results establish sulfilimine
      cross-links; peroxidasin performs oxidant generation. Other species and zebrafish
      peroxidasin perturbation are separate assays. The inherited universal conservation
      statement is retained with a DISPUTED finding review because the later PMID28418331
      distinguishes ctenophore cysteine-loop cross-links and the Hydra exception.
