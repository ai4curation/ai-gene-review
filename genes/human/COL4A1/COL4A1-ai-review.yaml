- term:
    id: GO:0001569
    label: branching involved in blood vessel morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:20818663
  qualifier: involved_in
  review:
    summary: HANAC patients with COL4A1 glycine substitutions in the CB3[IV] region show arterial retinal
      tortuosity and systemic angiopathy; the curator inferred a role in blood vessel branching.
    action: UNDECIDED
    reason: Only the abstract is available. It reports retinal arterial tortuosity and small vessel disease
      but does not mention vessel branching or sprouting, which is what GO:0001569 describes. The curator
      may have seen branching data in the full text, so this is left undecided rather than removed. If
      kept, it is a downstream, non-core consequence of the structural basement-membrane role.
    supported_by:
    - &id002
      reference_id: PMID:20818663
      supporting_text: All six known mutations associated with the HANAC phenotype are localized within
        the CB3[IV] fragment of COL4A1, which encompasses major integrin-binding sites.
