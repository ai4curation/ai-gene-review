      cells
  - reference_id: PMID:18775695
suggested_questions:
- question: At endogenous concentrations, which released COL4A1 NC1 fragments occur
    in human tissues, and how do their receptor interactions differ from the tagged
    or refolded arresten preparations?
- question: Does the 519-residue alternative COL4A1 product enter any extracellular
    complex, and what processing, stability and tissue distribution distinguish it
    from the NC1-containing chain?
- question: Which specific COL4A1-performed step supports the existing branching,
    fibril-organization and epithelial-differentiation source assertions? Full source
    access and assay/product attribution could resolve their present uncertainty.
- question: What does Ministeria type IV collagen do during aggregation, and which
    ancestral PAINT node placements distinguish collagen presence from organized basement-membrane
    function? Current sequence presence/expression alone does not settle those roles.
- question: How do HANAC CB3[IV] variants affect integrin engagement relative to network
    assembly, and which effects explain tissue-specific matrix phenotypes?
suggested_experiments:
- description: Compare defined native-like and tagged human arresten preparations
    in receptor-controlled endothelial assays, measuring direct receptor association
    and angiogenic endpoints at quantified physiological concentrations.
  hypothesis: The released NC1 ligand retains an integrin-dependent activity, but
    receptor affinity and response depend on processing and preparation.
- description: Track each authentic COL4A1 splice product through secretion, NC1-dependent
    association and extracellular matrix incorporation using product-specific sequence
    tags and controls.
  hypothesis: The short product lacking NC1 does not reproduce the canonical chain’s
    assembly and released-fragment functions.
- description: Compare wild-type and HANAC CB3[IV] network preparations for ultrastructure
    and cell-receptor engagement, distinguishing the matrix from separately applied
    NC1 fragments.
  hypothesis: Variant-specific effects on matrix assembly and cell interaction can
    differ without assigning collagen catalytic processing activity.
functional_isoforms:
- id: COL4A1_ARRESTEN
  name: Arresten / alpha1(IV) NC1-derived fragment
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000390482
    residues: 1445-1669
  description: Arresten is the NC1-derived cleavage-product class, distinct from the
    matrix-forming precursor. The UniProt mapping describes the 225-residue arresten
    chain in the 1669-residue reference protein. Experimentally applied human arresten
    preparations engage endothelial cell-surface alpha1beta1 integrin and inhibit
    angiogenic responses. The 2000 recombinant construct starts at the SVDH sequence
    at residue 1441 and contains vector-derived residues; the 2008 preparations include
    tagged, denatured/refolded recombinant NC1 material and separate half-domain constructs.
    Those experiments are not all assays of an untagged native 1445-1669 chain, and
    they do not establish endogenous fragment concentrations. The 519-residue alternative
    splice product lacks NC1 and is not included in this functional class.
  isoform_specific_terms:
  - id: GO:0005178
    label: integrin binding
  - id: GO:0016525
    label: negative regulation of angiogenesis
