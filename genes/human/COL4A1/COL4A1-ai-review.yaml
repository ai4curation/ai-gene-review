id: P02462
gene_symbol: COL4A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'COL4A1 encodes the alpha1 chain of type IV collagen, the network-forming collagen of basement
  membranes. The chain has an N-terminal 7S domain, a long Gly-X-Y triple-helical domain with frequent
  interruptions, and a C-terminal non-collagenous NC1 domain. In the endoplasmic reticulum two alpha1(IV)
  chains and one alpha2(IV) chain fold into the alpha1alpha1alpha2(IV) protomer, the major collagen IV
  of all basement membranes. After secretion, protomers join end to end, through NC1 hexamers at the C-termini
  and 7S tetramers at the N-termini, into a sheet-like network that is stabilized by sulfilimine cross-links
  between NC1 domains, formed by the basement-membrane peroxidase peroxidasin. With laminins, nidogens
  and perlecan, this network gives basement membranes mechanical strength and provides binding sites for
  cell receptors such as integrins. Dominant COL4A1 mutations, mostly glycine substitutions in the triple
  helix and also haploinsufficient alleles, weaken vascular and other basement membranes and cause porencephaly,
  cerebral small vessel disease with hemorrhage, and HANAC syndrome (angiopathy, nephropathy, aneurysms
  and muscle cramps). The C-terminal NC1 fragment, arresten, can be released by proteolysis. Collagen
  IV is an animal innovation: it is found with basement membranes in ctenophores, placozoans, homoscleromorph
  sponges, cnidarians and bilaterians, but genome surveys find no collagen IV in choanoflagellates, Capsaspora
  or other unicellular relatives of animals.'
