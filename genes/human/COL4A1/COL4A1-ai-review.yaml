core_functions:
- description: 'Structural constituent of the basement membrane: as the alpha1 chain of the alpha1alpha1alpha2(IV)
    protomer, COL4A1 assembles into the cross-linked collagen IV network that gives basement membranes
    mechanical strength and scaffolds other basement-membrane components. This function has no counterpart
    in unicellular relatives of animals, which lack collagen IV; it arose with animals.'
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0071711
    label: basement membrane organization
  locations:
  - id: GO:0005604
    label: basement membrane
  in_complex:
    id: GO:0005587
    label: collagen type IV trimer
  supported_by:
  - reference_id: PMID:12011424
    supporting_text: Triple-helical collagen IV protomers associate through their N- and C-termini forming
      a three-dimensional network, which provides basement membranes with an anchoring scaffold and mechanical
      strength.
  - reference_id: PMID:12011424
    supporting_text: The major collagen IV protomers detected in all basement membranes consist of two
      α1(IV) chains and one α2(IV) chain
  - reference_id: PMID:23065703
    supporting_text: Moreover, thickening of the capillary basement membrane in the skin was documented,
      similar to reports in patients with COL4A1 missense mutations.
  - reference_id: PMID:28418331
    supporting_text: Moreover, collagen IV is absent in unicellular sister-groups.
suggested_questions:
- question: IBA process and component terms on the collagen IV clade (basement membrane, ECM structural
    constituent) cannot propagate to unicellular holozoans because they have no collagen IV orthologs;
    do any TreeGrafter/InterPro2GO mappings from isolated GXY-repeat or laminin-like domains in choanoflagellates
    nevertheless assign basement-membrane terms to unicellular proteins?
- question: Ctenophore collagen IV lacks the Met/Lys pair that forms the sulfilimine bond and is stabilized
    by a different cross-link; should the human sulfilimine-dependent network properties be described
    separately from the ancestral metazoan collagen IV scaffold function?
- question: Should a GO term capture the anti-angiogenic activity of the NC1 fragment arresten, and is
    that activity physiological at endogenous levels?
- question: Do HANAC mutations in the CB3[IV] integrin-binding region act mainly through altered integrin
    binding rather than through network instability, and would a cell adhesion molecule binding (e.g.
    integrin binding) term be justified for COL4A1?
suggested_experiments:
- description: Express a ctenophore or placozoan collagen IV in Col4a1-null mouse embryoid bodies or C.
    elegans emb-9/let-2 mutants and test basement membrane assembly and stability.
  hypothesis: The protomer-network scaffold function is conserved from early-branching animals, while
    sulfilimine cross-linking is required only for the mechanical demands of eumetazoan tissues.
- description: Compare integrin binding and network assembly of recombinant alpha1alpha1alpha2(IV) carrying
    HANAC (CB3[IV]) versus porencephaly glycine substitutions.
  hypothesis: HANAC mutations specifically reduce integrin alpha1beta1/alpha2beta1 binding without abolishing
    secretion, whereas other glycine mutations mainly impair folding and secretion.
