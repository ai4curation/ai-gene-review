core_functions:
- description: The NC1-containing COL4A1 chain contributes the physical alpha1(IV)2alpha2(IV)
    network of basement membranes. Human placental NC1 architecture establishes interchain
    contacts and opposing trimer interfaces; clinical tissue evidence links chain
    defects to matrix disorganization. This network-forming structural function includes
    collagen-partner binding and provides mechanical stability. COL4A1 supplies the
    cross-linked residues, while peroxidasin supplies oxidant-generating catalysis.
    The short 519-residue alternative product lacks NC1 and is not presumed functionally
    equivalent.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
