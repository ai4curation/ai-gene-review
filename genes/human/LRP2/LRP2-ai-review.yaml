core_functions:
- description: >-
    At the apical plasma membrane of absorptive epithelia, LRP2 functions as a
    multiligand cargo receptor that couples extracellular cargo binding to
    clathrin-dependent receptor-mediated endocytosis. Cytoplasmic FXNPXY motifs recruit
    endocytic adaptors, and the receptor passes through coated carriers and endosomes,
    where acidic pH drives cargo release before receptor recycling. Direct experiments
    support uptake of clusterin and survivin, while conserved mammalian studies support
    additional vitamin-carrier, hormone, protein, and metal-carrier cargos. The cargo
    repertoire is tissue-specific, and no single ligand explains all LRP2 biology.
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  directly_involved_in:
  - id: GO:0006898
    label: receptor-mediated endocytosis
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: PMID:14528014
    supporting_text: "We found that ARH also binds \nto the first FXNPXY motif of megalin in two-hybrid, pull-down and \ncoimmunoprecipitation assays. ARH colocalizes with megalin in clathrin coated \npits and in recycling endosomes in the Golgi region."
    reference_section_type: ABSTRACT
  - reference_id: PMID:36750096
    supporting_text: |-
      Here, we report high-resolution cryoelectron
      microscopy structures of LRP2 isolated from mouse kidney, at extracellular and
      endosomal pH. The structures reveal LRP2 to be a molecular machine that adopts a
      conformation for ligand binding at the cell surface and for ligand shedding in
      the endosome.
    reference_section_type: ABSTRACT
  - reference_id: PMID:23825075
    supporting_text: "Finally, by surface plasmon resonance we were able to demonstrate that survivin \nbinds megalin and cubilin and that megalin knockout mice lose survivin through \nthe urine."
    reference_section_type: ABSTRACT
- description: >-
    In choroid-plexus epithelium, LRP2 acts as a cargo receptor for transcytotic
    delivery across the blood-CSF interface. Mixed rodent and human evidence supports
    binding of circulating leptin at the epithelial receptor and its transport into
    brain. This is a specialized epithelial deployment of the LRP2 endocytic cycle;
    reduced receptor abundance in aging or Alzheimer-disease samples is correlative
    and does not establish patient-level causality.
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  directly_involved_in:
  - id: GO:0045056
    label: transcytosis
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: PMID:17324488
    supporting_text: |-
      We have used different immunoassays and lentiviral vectors to analyze
      the role of megalin in the transport of leptin in rodents and humans. We
      demonstrate that circulating leptin is transported into the brain by binding to
      megalin at the choroid plexus epithelium.
    reference_section_type: ABSTRACT
knowledge_gaps:
- gap_statement: >-
    The endogenous human LRP2 cargo repertoire and quantitative uptake contribution in
    each expressing tissue are incompletely defined.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    LRP2 binds many chemically distinct cargos, but much of the mechanistic evidence is
    from mouse, rat, rabbit, or heterologous minireceptor systems. Family architecture
    alone cannot assign every proposed ligand to human LRP2.
  resolution: >-
    Endogenously perturb and rescue LRP2 in human proximal-tubule, choroid-plexus, and
    placental models, then quantify uptake of a defined ligand panel together with
    surface and endosomal proteomics.
  provenance:
  - reference_id: PMID:7768901
    supporting_text: |-
      Only cells that expressed gp330
      endocytosed and degraded radiolabeled apoJ.
    reference_section_type: ABSTRACT
- gap_statement: >-
    Ligand-specific interfaces and the complete adaptor architecture of full-length
    human LRP2 during its endocytic conformational cycle remain unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    A full-length human cryo-EM entry is available without an associated publication,
    while the published pH-dependent structural mechanism used receptor purified from
    mouse kidney. Neither resource defines all human cargo or adaptor interfaces.
  resolution: >-
    Determine ligand- and adaptor-bound structures of endogenous human LRP2 at surface
    and endosomal pH, and test interface variants by quantitative uptake and recycling
    assays.
  provenance:
  - reference_id: PMID:36750096
    supporting_text: |-
      LRP2 forms a homodimer, the conformational transformation of which
      is governed by pH-sensitive sites at both homodimer and intra-protomer
      interfaces.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The cargo-specific mechanisms linking LRP2 loss to the pleiotropic features of
    Donnai-Barrow/facio-oculo-acoustico-renal syndrome are not established.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Human genetics establishes disease causality, but kidney, neural, ocular, auditory,
    and developmental phenotypes may reflect different cargos and tissue-specific
    transport routes.
  resolution: >-
    Pair patient-derived isogenic organoid models with cargo-resolved uptake assays and
    tissue-specific rescue to connect individual receptor defects to defined
    developmental and homeostatic pathways.
  provenance:
  - reference_id: PMID:17632512
    supporting_text: |-
      By studying multiplex
      families, we mapped this disorder to chromosome 2q23.3-31.1 and identified LRP2
      mutations in six families with Donnai-Barrow syndrome and one family with
      facio-oculo-acoustico-renal syndrome.
    reference_section_type: ABSTRACT
- gap_statement: >-
    Proteolytic processing, soluble-receptor release, and nuclear-tail signaling by
    endogenous human LRP2 remain insufficiently characterized.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    These processing routes are prominent in transferred annotations and non-human
    studies, but they should not be confused with named human isoforms or assumed to
    occur uniformly across tissues.
  resolution: >-
    Map endogenous human LRP2 cleavage products by N-terminomics and pulse-chase
    proteomics, localize each product, identify responsible proteases, and test
    transcriptional consequences of the released cytoplasmic fragment.
- gap_statement: >-
    It is unknown whether any human LRP2 splice transcripts produce stable functional
    protein isoforms with distinct trafficking or cargo specificity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The reviewed human record contains no curated alternative products, so soluble or
    processed receptor forms and non-human splice products cannot be treated as human
    isoforms.
  resolution: >-
    Use long-read RNA sequencing and junction-specific proteomics across LRP2-expressing
    human epithelia, followed by isoform-resolved surface delivery and cargo-uptake
    assays for any reproducibly detected products.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which extracellular cargos are directly internalized by endogenous human LRP2 in
    kidney, choroid plexus, placenta, eye, and inner ear?
  experts:
  - Renal epithelial transport experts
  - LDL-receptor-family biologists
- question: >-
    How do pH-dependent LRP2 conformational changes coordinate ligand release, adaptor
    exchange, and receptor recycling in human cells?
  experts:
  - Structural biologists
  - Endocytic trafficking experts
- question: >-
    Which LRP2-dependent cargo pathways explain individual renal, neural, ocular, and
    auditory features of Donnai-Barrow syndrome?
  experts:
  - Human geneticists
  - Developmental physiologists
- question: >-
    Does endogenous human LRP2 undergo regulated ectodomain shedding and
    cytoplasmic-tail nuclear signaling, and in which tissues?
  experts:
  - Receptor proteolysis experts
  - Nuclear signaling experts
- question: >-
    Are any noncanonical human LRP2 transcripts translated into stable receptors with
    distinct localization or cargo preferences?
  experts:
  - Long-read transcriptomics experts
  - Proteogenomics experts
suggested_experiments:
- hypothesis: >-
    Human LRP2 has a tissue-specific endogenous cargo repertoire rather than a uniform
    set of ligands across all absorptive epithelia.
  description: >-
    Generate matched LRP2 knockout and rescue models from human proximal-tubule,
    choroid-plexus, and placental organoids, then perform quantitative ligand uptake,
    surface proteomics, and endosomal cargo profiling.
  experiment_type: tissue-resolved receptor cargo profiling
- hypothesis: >-
    The pH-regulated LRP2 homodimer reorganizes cargo and adaptor interfaces during the
    surface-to-endosome transition.
  description: >-
    Determine full-length human LRP2 structures with selected cargos and cytoplasmic
    adaptors at extracellular and endosomal pH, then test interface variants by uptake,
    release, and recycling kinetics.
  experiment_type: structural endocytic-cycle analysis
- hypothesis: >-
    Distinct cargo-uptake defects drive separable components of Donnai-Barrow syndrome.
  description: >-
    Introduce representative patient variants into isogenic kidney, neural, ocular,
    and inner-ear organoids, quantify cargo-specific transport, and rescue with
    wild-type or interface-selective receptor constructs.
  experiment_type: variant-resolved organoid physiology
- hypothesis: >-
    Endogenous human LRP2 processing generates tissue-restricted extracellular and
    cytoplasmic products with distinct functions.
  description: >-
    Combine pulse-chase labeling, N-terminomics, subcellular fractionation, protease
    perturbation, and nuclear transcriptomics in naturally expressing human epithelia.
  experiment_type: endogenous receptor processing analysis
- hypothesis: >-
    The reviewed 4,655-residue receptor is the predominant functional human LRP2
    protein product.
  description: >-
    Integrate long-read transcript sequencing with junction-specific targeted
    proteomics and isoform-specific surface-delivery and cargo-uptake assays across
    multiple human tissues.
  experiment_type: isoform-resolved transcript and protein validation
