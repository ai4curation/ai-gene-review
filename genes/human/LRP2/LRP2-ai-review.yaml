      domain-based calcium-binding inference, not direct biochemical measurement of
      full-length human LRP2.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Current manual orthology-transfer method reference. Biological claims must
      retain the source-species and assay boundary because much LRP2 physiology
      was established in mouse, rat, rabbit, or other vertebrate models.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
