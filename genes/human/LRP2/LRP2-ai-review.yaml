id: P98164
gene_symbol: LRP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP2, also called megalin, is a 4,655-residue type-I single-pass cargo receptor
  expressed at the apical surface of absorptive epithelia, especially renal proximal
  tubules and choroid plexus. Its large LDL-receptor-family ectodomain binds diverse
  protein, lipoprotein, vitamin-carrier, hormone, and metal-carrier cargos, often in
  cooperation with cubilin, while cytoplasmic sorting motifs recruit endocytic
  adaptors. LRP2 enters clathrin-coated carriers, releases cargo in acidic endosomes,
  and recycles to the cell surface; in specialized epithelia it can also support
  transcytosis. This receptor cycle underlies renal reclamation and tissue-specific
  delivery or clearance of extracellular macromolecules. Biallelic human LRP2 variants
  cause Donnai-Barrow/facio-oculo-acoustico-renal syndrome, consistent with important
  functions in kidney, brain, eye, ear, and embryonic development. The reviewed human
  protein has no curated alternative protein products.
