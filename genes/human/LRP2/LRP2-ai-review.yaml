- id: PMID:23275343
  title: 'Gentamicin binds to the megalin receptor as a competitive inhibitor using
    the common ligand binding motif of complement type repeats: insight from the nmr
    structure of the 10th complement type repeat domain alone and in complex with gentamicin.'
  findings:
  - statement: >-
      The study solved the NMR structure of human megalin complement repeat 10
      and modeled its interaction with gentamicin from NMR titration data.
    supporting_text: >-
      To address this gap in our knowledge, we have solved the NMR structure of
      the 10th complement type repeat of human megalin and investigated its
      interaction with gentamicin.
    reference_section_type: ABSTRACT
  - statement: >-
      Gentamicin bound with low affinity through a common acidic LDLR-family
      ligand-binding motif involving Trp1126 and Asp1129/Asp1131/Asp1133.
    supporting_text: >-
      Gentamicin binds to megalin with low affinity and exploits the common
      ligand binding motif previously described (Jensen, G. A., Andersen, O. M.,
      Bonvin, A. M., Bjerrum-Bohr, I., Etzerodt, M., Thogersen, H. C., O'Shea,
      C., Poulsen, F. M., and Kragelund, B. B. (2006) J. Mol. Biol. 362, 700–716)
      utilizing the indole side chain of Trp-1126 and the negatively charged
      residues Asp-1129, Asp-1131, and Asp-1133.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct structural and binding evidence for one human LRP2 repeat and a
      polybasic drug ligand. It does not establish that this isolated repeat
      captures all affinity or trafficking properties of full-length receptor,
      and no treatment recommendation is inferred.
