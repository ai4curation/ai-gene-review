- id: PMID:12713445
  title: Selective interaction of megalin with postsynaptic density-95 (PSD-95)-like
    membrane-associated guanylate kinase (MAGUK) proteins.
  full_text_unavailable: true
  findings:
  - statement: >-
      Yeast interaction cloning and overexpression co-immunoprecipitation
      identified PSD-95/DLG4 as a megalin cytoplasmic-tail partner.
    supporting_text: |-
      Using interaction
      cloning in yeast, we identified the membrane-associated guanylate kinase family
      member postsynaptic density-95 (PSD-95) as an interaction partner for megalin.
      PSD-95 and a truncated version of megalin were co-immunoprecipitated from
      HEK-293 cell lysates overexpressing the two proteins, which confirmed the
      interaction.
    reference_section_type: ABSTRACT
  - statement: >-
      The megalin C-terminal PDZ-binding motif interacted with the PSD-95 PDZ2
      domain, with selective binding among related MAGUK proteins.
    supporting_text: |-
      We found that the interaction between the two proteins is mediated by
      the binding of the C-terminus of megalin, which has a type I PSD-95/ Drosophila
      discs-large/zona occludens 1 (PDZ)-binding motif, to the PDZ2 domain of PSD-95.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Targeted interaction and motif-mapping evidence. Much of the confirmation
      used overexpressed/truncated proteins in HEK293 cells; it supports selective
      MAGUK binding but not a universal stable signaling complex. The local cache
      is abstract-only.
- id: PMID:14528014
  title: The adaptor protein ARH escorts megalin to and through endosomes.
  full_text_unavailable: true
  findings:
  - statement: >-
      ARH/LDLRAP1 binds the first megalin FXNPXY motif and colocalizes with
      megalin along clathrin-coated and recycling-endosome routes.
    supporting_text: "We found that ARH also binds \nto the first FXNPXY motif of megalin in two-hybrid, pull-down and \ncoimmunoprecipitation assays. ARH colocalizes with megalin in clathrin coated \npits and in recycling endosomes in the Golgi region."
    reference_section_type: ABSTRACT
  - statement: >-
      ARH increased lactoferrin uptake through megalin minireceptors in polarized
      canine kidney cells.
    supporting_text: "Expression of ARH in Madin-Darby canine kidney cells \nexpressing megalin mini-receptors enhances megalin-mediated uptake of \n125I-lactoferrin, a megalin ligand."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct adaptor-binding and trafficking evidence, including a functional
      uptake assay. The model uses megalin minireceptors and canine kidney cells;
      it supports the conserved endocytic mechanism rather than an exclusively
      human assay. The local cache is abstract-only.
- id: PMID:15126248
  title: Megalin mediates renal uptake of heavy metal metallothionein complexes.
  full_text_unavailable: true
  findings:
  - statement: >-
      Metallothionein bound megalin but not cubilin in direct surface plasmon
      resonance assays, with divalent-cation dependence.
    supporting_text: |-
      First, MT binds megalin, but not
      cubilin, in direct surface plasmon resonance studies. Binding of MT occurs at a
      single site with a K(d) approximately 10(-4) and, as with other megalin ligands,
      depends on divalent cations.
    reference_section_type: ABSTRACT
  - statement: >-
      Antibody competition, uptake competition, and colocalization support
      megalin-mediated metallothionein uptake in rat-derived renal/yolk-sac
      systems.
    supporting_text: |-
      Anti-megalin antisera, but not control sera, displace >90% bound MT from rat
      renal brush-border membranes. Megalin ligands including beta(2)-microglobulin
      and also recombinant MT fragments compete for uptake by megalin-expressing rat
      yolk sac BN-16 cells. Third, megalin and fluorescently labeled MT colocalize in
      BN-16 cells, as shown by fluorescent microscopic techniques.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct ligand-binding and uptake evidence for metallothionein-heavy-metal
