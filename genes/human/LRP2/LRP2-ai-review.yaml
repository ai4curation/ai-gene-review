  full_text_unavailable: true
  findings:
  - statement: >-
      miR-146a overexpression in SH-SY5Y cells reduced LRP2 expression and Akt
      activation while increasing caspase-3 and apoptosis.
    supporting_text: |-
      Overexpression of miRNA-146a in
      SH-SY5Y cells significantly decreased Lrp2 expression, resulting in a reduction
      of Akt activation and induction of proapoptotic caspase-3, thereby increasing
      cell apoptosis.
    reference_section_type: ABSTRACT
  - statement: >-
      The proposed Alzheimer-disease contribution is an inference from a cultured
      neuroblastoma-cell perturbation, not direct patient-tissue causality.
    supporting_text: |-
      Thus, specific miRNA-146a regulation may contribute to AD by
      downregulating the Lrp2/Akt pathway.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Targeted regulatory perturbation in a human neuroblastoma-derived cell
      line. It supports miR-146a-sensitive LRP2 translation and an associated Akt/
      apoptosis phenotype in that model, not a core LRP2 molecular activity or
      a proven causal mechanism in human Alzheimer disease. The cache metadata
      classifies the record as comment/editorial despite experimental abstract
      content, so claims are kept strictly to the cached text.
- id: PMID:27798286
  title: Megalin Is Predominantly Observed in Vesicular Structures in First and Third
    Trimester Cytotrophoblasts of the Human Placenta.
  full_text_unavailable: true
  findings:
  - statement: >-
      Human first-trimester and term placenta showed predominant LRP2/megalin
      expression in cytotrophoblasts, with limited syncytiotrophoblast signal.
    supporting_text: |-
      By immunohistochemical analyses
      of first trimester and term human placenta, we showed that megalin is
      predominantly expressed in cytotrophoblasts, the highly proliferative cells in
      placenta. Only limited amounts of megalin could be detected in
      syncytiotrophoblasts and least in term placenta syncytiotrophoblasts.
    reference_section_type: ABSTRACT
  - statement: >-
      Placental megalin associated with endolysosomal structures; the observed
      distribution argued against maternal nutrient uptake as its main placental
      role.
    supporting_text: |-
      Immunocytochemical analyses furthermore showed that placental megalin associates
      with structures of the endolysosomal apparatus. Combined, our results clearly
      place placental megalin in the context of endocytosis and trafficking of
      ligands. However, due to the limited expression of megalin in
      syncytiotrophoblasts, especially in term placenta, it appears that the main role
      for placental megalin is not to mediate uptake of nutrients from the maternal
      bloodstream, as previously proposed.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human tissue localization across placental stages. It supports a
      cytotrophoblast/endolysosomal context and explicitly weakens a broad
      maternal-nutrient-uptake claim. The local cache is abstract-only.
