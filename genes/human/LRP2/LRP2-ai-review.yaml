- id: PMID:36750096
  title: Structures of LRP2 reveal a molecular machine for endocytosis.
  findings:
  - statement: >-
      Cryo-EM structures of mouse-kidney LRP2 at extracellular and endosomal pH
      showed ligand-receptive and ligand-shedding conformations.
    supporting_text: |-
      Here, we report high-resolution cryoelectron
      microscopy structures of LRP2 isolated from mouse kidney, at extracellular and
      endosomal pH. The structures reveal LRP2 to be a molecular machine that adopts a
      conformation for ligand binding at the cell surface and for ligand shedding in
      the endosome.
    reference_section_type: ABSTRACT
  - statement: >-
      LRP2 forms a pH-regulated homodimer whose interfaces change during the
      endocytic conformational transition.
    supporting_text: |-
      LRP2 forms a homodimer, the conformational transformation of which
      is governed by pH-sensitive sites at both homodimer and intra-protomer
      interfaces.
    reference_section_type: ABSTRACT
  - statement: >-
      A subset of human deleterious missense variants was structurally consistent
      with impaired homodimer assembly.
    supporting_text: |-
      A subset of LRP2 deleterious missense variants in humans appears to
      impair homodimer assembly.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Decisive mechanistic structure of endogenous mouse-kidney LRP2, with
      extracellular/endosomal pH states and human-variant mapping. The receptor
      sequence and mechanism are highly conserved, but the isolated protein and
      structural states are mouse, while variant effects are structure-based
      interpretations rather than functional assays in human cells.
