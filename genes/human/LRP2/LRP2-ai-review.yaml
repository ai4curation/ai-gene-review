    supporting_text: "Immunoelectron microscopy also showed \napical localization of survivin in human kidneys. Furthermore, in polarized \nhuman primary tubular cells endogenous as well as external recombinant survivin \nis stored in the apical region of the cells. Costaining of survivin and megalin \nby immunohistochemistry and immunoelectron microscopy confirmed colocalization."
