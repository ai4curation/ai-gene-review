- id: PMID:17324488
  title: Megalin mediates the transport of leptin across the blood-CSF barrier.
  full_text_unavailable: true
  findings:
  - statement: >-
      Rodent and human analyses supported leptin binding to megalin at
      choroid-plexus epithelium and transport into brain.
    supporting_text: |-
      We have used different immunoassays and lentiviral vectors to analyze
      the role of megalin in the transport of leptin in rodents and humans. We
      demonstrate that circulating leptin is transported into the brain by binding to
      megalin at the choroid plexus epithelium.
    reference_section_type: ABSTRACT
  - statement: >-
      Reduced megalin expression in aging and Alzheimer-disease contexts
      correlated with reduced leptin entry, but this is correlative disease
      evidence.
    supporting_text: |-
      Indeed, the downregulation of megalin
      expression in physiological and pathological situations such as aging and
      Alzheimer's disease was correlated with poor entry of leptin into the brain.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mixed rodent/human primary evidence for a choroid-plexus leptin-transport
      role. The aging/Alzheimer association is correlation and must not be turned
      into a human causal disease mechanism. The local cache is abstract-only.
