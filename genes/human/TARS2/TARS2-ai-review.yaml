id: Q9BW92
gene_symbol: TARS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TARS2 encodes the nuclear-encoded mitochondrial threonyl-tRNA synthetase, a homodimeric class II aminoacyl-tRNA
  synthetase imported into the mitochondrial matrix. It activates L-threonine with ATP and transfers it
  to mitochondrial tRNA(Thr), and its editing domain hydrolyses serine mischarged onto tRNA(Thr) (post-transfer
  proofreading). The resulting Thr-tRNA(Thr) is required for translation of the thirteen mtDNA-encoded
  oxidative phosphorylation subunits. Biallelic TARS2 variants reduce charged mitochondrial tRNA(Thr)
  and cause an early-onset mitochondrial encephalomyopathy with multiple respiratory-chain defects (COXPD21).
