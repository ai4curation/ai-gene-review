suggested_questions:
- question: >-
    Does the non-canonical interaction of TARS2 with Rag GTPases reported for mTORC1 signalling occur
    at physiological TARS2 levels outside mitochondria, and does it contribute to disease phenotypes independently
    of tRNA(Thr) charging?
- question: >-
    Why does partial loss of TARS2 aminoacylation activity produce a predominantly neurological phenotype
    despite ubiquitous expression?
suggested_experiments:
- description: >-
    Measure steady-state charging of mt-tRNA(Thr) and mitochondrial translation rates in iPSC-derived
    neurons and cardiomyocytes carrying patient TARS2 alleles, with and without rescue by catalytically
    dead versus editing-dead TARS2.
