core_functions:
- description: >-
    Aminoacylates mitochondrial tRNA(Thr) with threonine in an ATP-dependent two-step reaction (threonyl-adenylate
    formation, then transfer to tRNA), and uses post-transfer editing to clear serine mischarged onto
    tRNA(Thr), supplying Thr-tRNA(Thr) for synthesis of the mtDNA-encoded respiratory-chain subunits in
    the mitochondrial matrix.
  molecular_function:
    id: GO:0004829
    label: threonine-tRNA ligase activity
