    action: ACCEPT
    reason: >-
      Inferred from the deacylase MF, and the inference holds - the purified enzyme clears Ser mischarged
      onto tRNA(Thr) by post-transfer editing, which is what this term names. Retained as core alongside
      the GO:0002161 core function below. Proofreading is in service of accurate aminoacylation, which is
      not the same as being part of it: the reaction is a distinct one on a distinct substrate, and without
      it serine would be incorporated into the mtDNA-encoded respiratory-chain subunits.
