  - reference_id: PMID:24827421
    supporting_text: >-
      Severe decrease in the aminoacylated tRNAThr was observed in P2 fibroblasts.
- description: >-
    Hydrolyses Ser mischarged onto mitochondrial tRNA(Thr), the post-transfer editing reaction that makes
    the aminoacylation above accurate. This is a second catalytic activity rather than an aspect of the
    first: the chemistry is deacylation of a finished aminoacyl-tRNA, the substrate is the erroneous
    product, and the purified enzyme's proofreading was assayed as an activity separable from Thr
    activation and aminoacylation. It is listed as core because mischarging would otherwise put serine
    into every mtDNA-encoded respiratory-chain subunit, and because the P282L disease allele loses
    proofreading alongside charging.
  molecular_function:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
