  title: DHCR7 source evidence and access guide
  findings: []
suggested_questions:
- question: What molecular contacts or catalytic contributions does DHCR7 make within
    the EBP–DHCR7 cholesterol-epoxide hydrolase complex?
- question: Which DHCR7 membrane pools are present under basal conditions, and how
    do plasma-membrane or mitochondrial associations relate to ER-localized sterol
    synthesis?
- question: What mechanism explains the asymmetric dependence of DHCR7 activity on
    DHCR24 in the cholesterol-synthesis enzyme assembly?
suggested_experiments:
- description: Reconstitute human EBP and DHCR7 separately and together in defined
    membranes, quantify epoxide-to-triol products, and compare substrate binding with
    catalytic turnover to resolve their subunit contributions.
- description: Combine endogenous-tag imaging and controlled organelle fractionation
    with sterol flux measurements to relate DHCR7 compartmental pools to cholesterol
    production and ferroptosis susceptibility.
status: DRAFT
