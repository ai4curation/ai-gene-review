id: Q9UBM7
gene_symbol: DHCR7
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DHCR7 is a membrane-bound, NADPH-dependent sterol reductase that reduces
  the C7–C8 double bond of 7-dehydrocholesterol to produce cholesterol. It acts principally
  at the endoplasmic reticulum membrane and also contributes with EBP to microsomal
  cholesterol-5,6-epoxide hydrolysis. By consuming 7-dehydrocholesterol, a sterol
  that can interrupt membrane lipid autoxidation, DHCR7 influences cellular susceptibility
  to ferroptosis. Its association with DHCR24 couples the activities of terminal cholesterol-synthesis
  enzymes.
