  review:
    summary: Joint cholesterol-epoxide hydrolase activity does not establish an autonomous
      DHCR7 hydrolase.
    action: MARK_AS_OVER_ANNOTATED
    reason: Human DHCR7 and EBP coexpression reconstituted the activity in COS-7 cells, and
      their knockdown reduced it in MCF-7 cells. Differential kinetics suggest a substrate-binding
