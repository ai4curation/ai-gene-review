    with independent membrane-bound protein evidence, without asserting exclusive localization.
ontology:
  definitions_url: https://www.ebi.ac.uk/QuickGO/term/
  specificity: GO:0005789 is a descendant of ER and membrane; GO:0006695 is a descendant of sterol
    biosynthesis; GO:0047598 is a descendant of the broad NAD(P)-linked CH–CH oxidoreductase class.
  ferroptosis: GO:0160020 includes any process increasing ferroptosis frequency, rate or extent;
    a metabolic effect is compatible and need not be an execution activity.
  cofactor: GO:0050661 includes reduced NADPH binding.
  enzyme_binding: GO:0019899 is binding to a protein with catalytic activity; no target-mediated
    enzyme activation requirement.
curation_scope:
  generic_binding_policy: https://github.com/ai4curation/ai-gene-review/blob/d77f71b566bd5ee0e87e410083f71e5b6f27036b/projects/CLINGEN_MENDELIAN.md#curation-instructions
  new_annotations: 0
  reason: Existing assertions plus contribution-aware core synthesis cover the supported roles; membrane-fraction
    observations are discussed without adding speculative location rows.
reference_verification_scope:
  publications: Verification records the identified paper and the explicitly stated inspected evidence; it does not imply that every original table, supplement or figure was accessed.
  method_references: GO_REF entries identify the annotation method. Target applicability is assessed separately through the cited rule, mapping, phylogeny, donor or localization evidence.
  reactome: Verification covers the selected public event, catalyst and target-entity paths listed above, not an exhaustive audit of the entire graph.
  membrane_refinement: Both GO:0016020 rows are refined to GO:0005789 from the combined human evidence. The YTS source retains its original identity and does not become an ER-localization experiment.
  epoxide_hydrolase: UniProt records EC 3.3.2.11 and the DHCR7 subunit name, while its FUNCTION section leaves each component's precise role unresolved. The contribution-aware core preserves complex activity without assigning autonomous DHCR7 epoxide hydrolysis.
