gene: DHCR7
accession: UniProtKB:Q9UBM7
scope: Authored evidence guide; navigation and synthesis, not an independent experimental source.
  All 31 original annotation source objects remain exact.
official_product:
  accession: Q9UBM7
  length: 475
  alternative_products: []
  scope: One official sequence. Tags, host expression systems and disease variants are experimental
    contexts; no natural short product is inferred.
core_synthesis:
- activity: GO:0047598
  process: GO:0006695
  location: GO:0005789
  interpretation: Intrinsic NADPH-dependent delta-7 sterol reduction. Cofactor binding belongs to
    this catalytic unit.
- contributes_to_activity: GO:0033963
  location: GO:0005789
  interpretation: Joint EBP–DHCR7 epoxide-hydrolase activity; no autonomous DHCR7 epoxide hydrolysis,
    invented subunit molecular function or unverified complex identifier.
primary_sources:
- reference: PMID:9465114
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC19210/
  locator: 'Materials and Methods: expression in S. cerevisiae and enzyme assays; Results: molecular
    cloning and functional expression; sterol conversion chromatograms.'
  construct_scope: Full 475-residue human cDNA expressed in yeast microsomes, including untagged
    and N-terminal myc expression constructs. These are experimental constructs, not evidence for
    natural alternative products.
  finding: Mock-negative microsomal conversion of 7-dehydrocholesterol to cholesterol requires NADPH.
    Ergosterol and lathosterol show lower but nonzero turnover; no absolute substrate exclusivity
    is inferred.
  access: Normal cache is abstract-only. Selected original Methods/Results were independently read
    from the genuine PMC article.
- reference: PMID:20615952
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2922168/
  locator: 'Results: expression and knockdown of D8D7I and DHCR7; Figure 4A–I; Discussion paragraph
    comparing kinetic effects; Materials and Methods.'
  construct_scope: Human DHCR7 and EBP in COS-7 reconstitution; human MCF-7 knockdown. Rat-liver
    microsomes supply the distinct pharmacological inhibitor experiments.
  finding: Single expression increases ChEH activity 1.8-fold (EBP) or 2.6-fold (DHCR7); coexpression
    increases it 8.5-fold. DHCR7 knockdown changes apparent substrate affinity without a significant
    Vmax change, whereas EBP knockdown lowers Vmax. The inferred division of labor is a hypothesis,
    not proof of isolated-subunit chemistry.
  exact_primary_anchor: DHCR7 cooperates in the binding of substrates to ChEH
  access: Normal cache is abstract-only; selected original passages were read. Supplemental retrieval
    failed and its complete contents were not read.
  correction:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2930442/
    doi: 10.1073/pnas.1010447107
    scope: Complete notice and displayed Table 1 read. A printer error affected online table formatting;
      the print table was correct. This concerns rat-liver inhibitor constants, not the human reconstitution
      or knockdown results.
- reference: PMID:25637936
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4373745/
  locator: 'Materials and Methods: plasmids, cell culture/transfection, immunoprecipitation and LC-MS/MS;
    Results/Figure 2 reciprocal co-IP; DHCR7-versus-DHCR24 perturbation experiments.'
  construct_scope: Human DHCR7-myc from HeLa cDNA and human DHCR24-V5 in CHO-7; initial IP also detects
    endogenous hamster DHCR7.
  finding: Reciprocal association supports enzyme binding. DHCR24 loss reduces DHCR7 activity, whereas
    DHCR7 loss did not reduce DHCR24 activity in these experiments. No DHCR7-mediated activation
    of DHCR24 or proven substrate channeling is claimed.
  exact_primary_anchor: Overexpressed DHCR7 coimmunoprecipitates DHCR24.
  access: Cache flag is full-text true, but its extraction lacks Methods. The actual full PMC article
    was independently recovered and selected Methods/Results read.
  correction:
    reference: PMID:25924892
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4409284/
    scope: Complete correction read. Figure 1 changes a chemical label from 24,25-dihydroxylanosterol
      to 24,25-dihydrolanosterol; the association experiments are unchanged.
- reference: PMID:32694168
  original_url: https://www.mbblab.net/wp-content/uploads/2020/11/jcsTMEM147SI.pdf
  doi: 10.1242/jcs.245357
  locator: Main article pp. 6–7, cholesterol-homeostasis Results; pp. 11–12, expression constructs
    and co-IP/LC-MS/MS Methods; supplemental Figure S4 caption. The author PDF includes both main
    article and supplement despite its SI filename.
  construct_scope: Human HeLa Kyoto TMEM147-GFP affinity purification; GFP-only negative control
    and TMEM129-GFP comparator; two independent experiments and six TMT channels.
  finding: DHCR7 is an affinity-purification hit and its protein/transcript abundance declines after
    TMEM147 silencing. This supports association without establishing a purified direct interface
    or transferring TMEM147 translocon function to DHCR7.
  exact_primary_anchor: DHCR7 was one of the proteins identified
  access: Normal cache is abstract-only; selected author-PDF main and supplemental text read. No
    figure-pixel inspection claim.
- reference: PMID:38297129
  original_url: https://push-zb.helmholtz-munich.de/deliver.php?id=35931
  doi: 10.1038/s41586-023-06878-9
  locator: Author proof PDF p. 2, initial knockout/flux Results; p. 8, Figure 5; pp. 13 and 15, Extended
    Data Figures 2 and 3; reporting-summary cell-line section.
  construct_scope: Mouse Pfa1 fibroblasts and human HT1080 knockout/reconstitution are distinct.
    Additional human cancer contexts include SK-N-DZ and Burkitt lymphoma.
  finding: DHCR7 depletion accumulates 7-dehydrocholesterol and reduces ferroptosis susceptibility;
    SC5D dependence and rescue support the metabolic mechanism. Cellular conversion does not replace
    the independent direct reductase assay.
  access: The cache is abstract-only. The recovered file is an author proof with queries, not the
    final version of record; selected Results/captions/reporting summary were read, not an unavailable
    full Methods section.
  correction:
    reference: PMID:41876850
    doi: 10.1038/s41586-026-10403-z
    url: https://www.nature.com/articles/s41586-026-10403-z
    locator: Nature 652, E5 (2026), full one-page correction.
    scope: Extended Data Fig. 2a,b blanks came from commercial resazurin/SpectraMax measurements
      rounded to 50 fluorescence units; later experiments used homemade reagent/SPARK-Tecan with
      unrounded mean blanks. Two alternative normalizations retain the effects and conclusions, according
      to the authors. The correction text was read fully; supplementary reanalysis plots were not
      independently read.
- reference: PMID:38297130
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11298758/
  locator: 'Results: DHCR7 knockout/re-expression and SC5D epistasis; Extended Data Figure 7; Methods:
    enzyme activity, plasmids, plasma membrane extraction and mitochondria extraction.'
  construct_scope: Human HEK293T experiments and immunopurified FLAG-tagged human DHCR7; other animal/cell
    experiments are not treated as direct human protein assays.
  finding: The purified-immunoprecipitate assay measures NADPH consumption with 7-dehydrocholesterol,
    not direct cholesterol product identification. Fractionation detects DHCR7 in plasma-membrane
    and mitochondrial preparations, without proving exclusive or universal localization. Ferroptosis
    regulation is a contextual consequence of substrate removal.
  access: Full XML cache; selected Results, Methods and captions read. No blanket whole-paper/figure-pixel
    claim.
- reference: PMID:9878250
  original_url: https://pubmed.ncbi.nlm.nih.gov/9878250/
  doi: 10.1006/geno.1998.5615
  locator: Complete abstract.
  finding: DHCR7 and TM7SF2 are explicitly ER-localized, in contrast to inner-nuclear-membrane LBR.
    The separately curated outer-nuclear-membrane result remains unresolved.
  access: Abstract-only; bounded publisher recovery failed. The paper is not rejected because its
    title foregrounds LBR.
- reference: PMID:19946888
  original_url: https://pubmed.ncbi.nlm.nih.gov/19946888/
  doi: 10.1002/jms.1696
  locator: Complete abstract, YTS membrane-proteomics workflow.
  finding: The curator-assigned membrane observation is retained as compatible evidence. Its
    review is refined to ER membrane using independent human localization and microsomal evidence;
    the DHCR7 target table and NK-cell membrane subcompartment remain unverified.
  access: Abstract-only after failed publisher recovery.
- reference: PMID:25307054
  original_url: https://pubmed.ncbi.nlm.nih.gov/25307054/
  doi: 10.1038/nature13797
  locator: Complete abstract, official G4SW86 function/cofactor record and literal QuickGO IDA GO:0050661
    donor assertion.
  finding: Bacterial MaSR1 is an NADPH-bound sterol-reductase structural homolog; it is not a DHCR7
    ortholog or evidence for transfer of its delta-14 substrate chemistry. Human NADPH-dependent
    catalysis supplies independent target support.
  access: Abstract and curated donor records inspected; no independent complete-original or residue-level
    binding-site alignment claim.
