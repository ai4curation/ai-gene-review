suggested_questions:
- question: Which NKX2-5 target genes in the atrioventricular node and conduction system mediate the dosage-sensitive
    recruitment/retention of conduction myocytes, and are they direct NKE-bound targets?
- question: Does human NKX2-5 form functionally relevant homodimers on DNA, given that the homeodomain-DNA
    crystal structure shows no direct contact between the two bound homeodomains?
- question: Is the NKX2-5 activity in non-cardiac contexts (pulmonary endothelium, T-ALL) physiological
    or a consequence of ectopic expression, and should such contexts be represented in GO?
suggested_experiments:
- hypothesis: NKX2-5 haploinsufficiency reduces occupancy at a subset of low-affinity NKE-containing enhancers
    controlling AV node and atrial septum genes.
  description: Perform CUT&RUN for NKX2-5 together with GATA4 and TBX5 in isogenic wild-type and NKX2-5
    heterozygous human iPSC-derived atrial and AV-node-like cardiomyocytes, integrated with ATAC-seq and
    RNA-seq.
  experiment_type: genome-wide DNA-binding and transcriptomic profiling
- hypothesis: Disease-associated missense variants outside the homeodomain (e.g. R25C, P236H) impair cooperative
    activation with GATA4/TBX5 rather than DNA binding.
  description: Quantify DNA binding (EMSA/SELEX), partner binding (co-IP, BLI) and synergistic reporter
    activation for a panel of patient variants, and rescue assays in NKX2-5 null iPSC-cardiomyocytes.
  experiment_type: variant functional characterization
