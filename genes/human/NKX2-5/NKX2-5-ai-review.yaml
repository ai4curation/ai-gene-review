- description: Sequence-specific RNA polymerase II DNA-binding transcription factor that binds NKE (TNAAGTG/TAAG)
    cis-regulatory elements via its NK-2 homeodomain and activates cardiac target genes such as NPPA/ANF
    and GATA4 (and context-dependently represses others such as CTNNB1).
