id: P52952
gene_symbol: NKX2-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NKX2-5 (CSX) is an NK-2 class homeodomain transcription factor, the vertebrate ortholog of
  Drosophila tinman, expressed in cardiac progenitors of the first and second heart fields and in embryonic
  and adult myocardium, as well as in spleen mesenchyme and pharyngeal/thyroid primordia. Its homeodomain
  binds NKE (TNAAGTG) elements in promoters and enhancers of cardiac genes such as NPPA/ANF, GATA4, MYL2
  and miR-143/145; a C-terminal autorepressive domain makes it a modest activator on its own, and it activates
  or represses targets in combination with partner transcription factors, notably GATA4 and TBX5 (plus
  SRF/myocardin and coactivators such as FBLIM1/Cal and CAMTA2). Activity is modulated by casein kinase
  II phosphorylation and SUMOylation. In the mouse it is required for heart looping, ventricular myocyte
  specialization, second heart field/outflow tract development and formation of the atrioventricular node
  and conduction system in a dosage-dependent manner. Heterozygous loss-of-function variants in humans
  cause secundum atrial septal defect with progressive atrioventricular conduction block, and also ventricular
  septal defect, tetralogy of Fallot and other congenital heart defects; variants are also associated
  with congenital asplenia and thyroid dysgenesis.
