core_functions:
- description: BLNK provides noncatalytic docking sites that assemble B-cell receptor signaling
    effectors. SYK-dependent phosphorylation enables recruitment of SH2-containing proteins,
    while proline-rich motifs bind SH3-domain adaptors. The resulting complexes couple receptor
    activation to PLCgamma-dependent calcium signaling and other downstream responses. BLNK
    supplies the organizing scaffold; SYK, BTK and PLCgamma supply their respective catalytic
    reactions.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0050853
    label: B cell receptor signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9697839
    supporting_text: 'interfaces the B cell

      receptor-associated Syk tyrosine kinase with PLCgamma'
  - reference_id: PMID:11606584
  - reference_id: PMID:21822214
  - reference_id: Reactome:R-HSA-9606151
- description: BLNK combines multivalent CIN85 binding with amino-terminal lipid-vesicle attachment
    to organize signaling condensates. Reconstitution with purified human SLP65 fragments,
    CIN85 and vesicles establishes the physical scaffold mechanism, while human SLP65 mutant
    complementation in chicken DT40 cells links granule formation to B-cell receptor responses.
    This evidence supports a condensate-organizing activity without asserting that every endogenous
    human granule has the identical reconstructed ultrastructure.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - id: GO:0050853
    label: B cell receptor signaling pathway
  supported_by:
  - reference_id: PMID:32051419
    supporting_text: all three components necessary for in vitro phase separation
  - reference_id: PMID:25140054
  - reference_id: PMID:21822214
