id: Q8WV28
gene_symbol: BLNK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLNK (SLP-65/BASH) is a noncatalytic adaptor that organizes signaling downstream
  of the B-cell antigen receptor. Its phosphorylated tyrosines and proline-rich motifs recruit
  effectors including phospholipase Cgamma, VAV, GRB2 and NCK, coupling SYK-dependent receptor-proximal
  events to calcium mobilization and downstream signaling. Constitutive association with CIN85
  and binding to lipid vesicles help assemble cytoplasmic signaling granules that can be recruited
  to activated receptor sites at the plasma membrane. BLNK supplies docking and spatial organization,
  while associated kinases and phospholipases perform the enzymatic reactions. Disruption
  of human BLNK can arrest the transition from pro-B to pre-B cells and cause antibody deficiency.
