- question: Does the ancestral RTK-signaling assertion at PTHR14098 PTN001019935 reflect a
    demonstrated BLNK receptor-tyrosine-kinase pathway distinct from its BCR role, and how
    does the experimental Clnk evidence support that node placement?
- question: Which exact BLNK domain/peptide pairs and affinity measurements underlie PMID:24728074
    interactions with AR and KIT, and which BLNK peptide was used in the PMID:16969585 BTK
    SH2 study?
- question: How do the historical long/short SLP-65 constructs map onto the three current
    UniProt alternative products, and how do endogenous human BLNK granules compare with the
    reconstructed CIN85–vesicle condensates?
