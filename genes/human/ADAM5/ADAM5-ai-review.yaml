id: Q6NVV9
gene_symbol: ADAM5
product_type: PSEUDOGENE
aliases:
- ADAM5P
- TMDC2
- tMDC II
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADAM5 is a unitary pseudogene at human chromosome 8p11.22, in a genomic neighbourhood
  that also carries the testis-expressed ADAM (a disintegrin and metalloproteinase) genes
  ADAM2, ADAM9, ADAM18 and the ADAM3A pseudogene. Its orthologue, historically called tMDC
  II, is a testis-specific type-I transmembrane protein: it is displayed on the sperm
  surface in macaque and identified in sperm plasma membrane preparations in pig, and the
  gene is conserved in mouse, rat and guinea pig. Its function has been established
  in mouse, where ADAM5 assembles with ADAM2 and ADAM3 into a sperm-surface complex; knockout
  males are severely subfertile, their spermatozoa lose ADAM2 and ADAM3, fail to transit the
  uterotubal junction and bind the zona pellucida poorly. Like all its orthologues, the
  ancestral protein is a non-catalytic member of the family, lacking the zinc-binding
  residues of a working metalloprotease.
  The human locus is transcribed - multiple alternatively spliced testis transcripts have
  been cloned and the RefSeq is the non-coding NR_001448 - but every characterised human
  transcript carries deletions and in-frame termination codons relative to the macaque
  orthologue, and a macaque anti-tMDC II antiserum detects no product on Western blots of
  human testis or sperm extracts. The 412-residue UniProt sequence is a putative conceptual
  translation: aligned to the 756-residue macaque protein it shows a single 246-residue
  internal deletion that removes the signal peptide, essentially the whole metalloprotease
  domain and the transmembrane anchor, and truncates the disintegrin domain. No human ADAM5
  protein has been detected, and no molecular activity, subcellular location or biological
  process has been established for this locus. The loss is not isolated: five other
  testis-expressed ADAM genes - ADAM1A, ADAM1B, ADAM3A, ADAM3B and ADAM6, dispersed across
  chromosomes 8, 12, 14 and 16 - are also pseudogenes in humans, so the sperm ADAM adhesion
  complex characterised in rodents is only partly reconstructible in humans.
