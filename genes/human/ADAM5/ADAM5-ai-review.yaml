existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      Correct. No molecular function has been established for the human ADAM5 locus, and
      the record positively indicates that no protein product exists to carry one.
    action: ACCEPT
    reason: >-
      The root ND annotation records that a curator looked and found no data, which is
      exactly the state of this locus. HGNC types ADAM5 as a pseudogene, its RefSeq is the
      non-coding NR_001448, UniProt assigns PE 5 (Uncertain) and cautions that it could be
      a pseudogene product, and all eleven EMBL cross-references on the entry are
      NOT_ANNOTATED_CDS. The primary paper reports that every human tMDC II transcript is
      non-functional through deletions and in-frame stop codons, and that a macaque
      anti-tMDC II antiserum gives no signal on human testis or sperm extract - a measured
      protein-level negative, not merely an absence of reports.
      Note that the family name is not evidence of an activity here, and the structural
      test agrees with the curator: the 412-residue putative translation contains no
      HExxHxxGxxHD zinc-binding motif and in fact no HExxH substring at all, and aligned to
      macaque ADAM5 only 6.6% of the Peptidase M12B domain has any human counterpart. Even
      the intact orthologues are non-catalytic; UniProt attaches "Not expected to have
      protease activity" to all five reviewed ADAM5 entries. So there is no candidate
      molecular function to substitute for the root term, and nothing here to modify or
      remove.
    supported_by:
    - reference_id: PMID:10417343
      supporting_text: >-
        all of which are also non-functional owing to the presence of deletions and
        in-frame termination codons, when compared with the macaque orthologue, a finding
        which is further supported by the lack of immunoreactivity on Western blots of
        human testis and sperm extracts probed with a macaque anti-tMDC II polyclonal
        antiserum
    - reference_id: PMID:41263505
      supporting_text: >-
        While ADAM5 is a pseudogene in humans, our results provide valuable insights into
        the function of ADAM family proteins in mammalian reproduction.
    - reference_id: file:human/ADAM5/ADAM5-uniprot.txt
      supporting_text: 'CAUTION: Could be the product of a pseudogene. Not expected to have'
    - reference_id: file:human/ADAM5/ADAM5-bioinformatics/RESULTS.md
      supporting_text: >-
        Human ADAM5 contains **no `HExxH` substring anywhere in its 412 residues**.
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: >-
      Correct, and independently supported: the putative human product has lost both the
      signal peptide and the transmembrane anchor, so it could not reach the sperm surface
      where its orthologues act even if it were translated.
    action: ACCEPT
    reason: >-
      No subcellular location has been demonstrated for a human ADAM5 product, and none can
      be transferred from the orthologues. The macaque and mouse proteins are type-I
      transmembrane sperm-surface antigens, but alignment of the human putative translation
      to macaque ADAM5 gives 0.000 coverage of the macaque signal peptide (1-16) and 0.000
      coverage of the transmembrane helix (699-719). A product with neither secretory
      targeting nor a membrane anchor is not a candidate for any membrane or cell-surface
      term. This is the cellular-component counterpart of the molecular-function argument
      and it is an additional reason to keep the root ND rather than import a location by
      similarity.
    supported_by:
    - reference_id: file:human/ADAM5/ADAM5-bioinformatics/RESULTS.md
      supporting_text: >-
        the **signal peptide** and the **transmembrane helix** are lost outright, and the
        disintegrin domain is itself truncated because the deletion cuts through it
    - reference_id: PMID:10645274
      supporting_text: >-
        we have localized a number of these MDC proteins (fertilin alpha, fertilin beta,
        tMDC I, tMDC II and tMDC III) to spermatogenic cells
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: >-
      Correct. The sperm-fertilisation role established for ADAM5 is a property of the
      intact orthologues; no biological process has been demonstrated for the human locus.
    action: ACCEPT
    reason: >-
      The temptation on this gene is to import the orthologue's biology. Adam5-null mice
      are severely subfertile, their sperm fail to transit the uterotubal junction and bind
      the zona pellucida poorly, and ADAM2 and ADAM3 levels fall on the mutant sperm - but
      the same paper states that ADAM5 is a pseudogene in humans, and the human protein has
      never been detected. Transferring a fertilisation process term to this locus on
      orthology alone would be exactly the propagation error this review exists to catch,
      and GOA has correctly not done it.
      A separate, RNA-level hypothesis exists - that the ADAM5 pseudogene transcript acts
      as a competing endogenous RNA for miR-122b-5p and thereby modulates ADAM9 - but it
      rests on a predicted binding site plus a copy-number association, not on a
      demonstrated activity, and it would concern the transcript rather than a protein. It
      is recorded under knowledge_gaps rather than annotated.
    supported_by:
    - reference_id: PMID:41263505
      supporting_text: >-
        Adam5 KO sperm failed to transit the uterotubal junction (UTJ) and displayed severe
        defects in zona pellucida (ZP) binding, phenotypes that resemble those observed in
        Adam2 and Adam3 knockout mice.
    - reference_id: PMID:41263505
      supporting_text: >-
        While ADAM5 is a pseudogene in humans, our results provide valuable insights into
        the function of ADAM family proteins in mammalian reproduction.
knowledge_gaps:
- gap_statement: >-
    Whether the human ADAM5 locus produces any polypeptide at all is undetermined. The only
    direct test is a single 1999 Western blot with a heterologous (macaque) antiserum, which
    was negative; no targeted assay with a human-sequence-specific reagent has been reported.
  boundary: >-
    Firmly established: the locus is transcribed, with multiple alternatively spliced testis
    transcripts and two independent full-length cDNA clones; the transcripts carry deletions
    and in-frame termination codons relative to the macaque orthologue; HGNC, NCBI and
    UniProt all type it as a pseudogene or uncertain product; and no MS peptide evidence is
    mapped to Q6NVV9 in the EBI Proteins API, where human ADAM2, human ADAM18 and mouse
    Adam5 all return peptides.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    A transcribed unitary pseudogene with a residual open reading frame is the classic
    setting for a low-abundance or truncated product that a heterologous antibody would
    miss. Resolving it either closes the gene out cleanly or reopens it as a real, if
    degenerate, gene product.
  resolution: >-
    Targeted parallel-reaction-monitoring mass spectrometry on human testis and ejaculated
    sperm using proteotypic peptides chosen from the retained C-terminal half of the
    putative translation, together with ribosome profiling of human testis over the ADAM5
    transcripts.
  provenance:
  - reference_id: PMID:10417343
    supporting_text: >-
      a finding which is further supported by the lack of immunoreactivity on Western blots
      of human testis and sperm extracts probed with a macaque anti-tMDC II polyclonal
      antiserum
- gap_statement: >-
    Whether the ADAM5 pseudogene transcript has a function of its own as a regulatory RNA is
    unknown. The proposed competing-endogenous-RNA mechanism rests on a predicted miRNA
    binding site and a copy-number association, with no direct demonstration that the ADAM5
    transcript binds miR-122b-5p or that it is required for the observed ADAM9 change.
  boundary: >-
    Established: inherited copy number of the ADAM3A/ADAM5 pseudogene pair associates with
    oropharyngeal squamous cell carcinoma risk in a two-stage study, higher copy number
    accompanies higher ADAM9 expression, and the ADAM5 sequence is highly homologous to the
    ADAM9 3'-UTR. Not established: any measured interaction, or that ADAM5 rather than
    ADAM3A or another element in the amplicon carries the effect.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    If real, this would be a function of the locus that survives the loss of its protein,
    and it would be the only reason to annotate ADAM5 at all - but at the RNA level, not as
    a metalloproteinase.
  resolution: >-
    Direct interaction evidence - miRNA pulldown or AGO-CLIP showing miR-122b-5p occupancy
    on the ADAM5 transcript - plus a loss-of-function test in which knocking down the ADAM5
    transcript alone changes ADAM9 levels, with ADAM3A copy number held constant.
  provenance:
  - reference_id: PMID:36553675
    supporting_text: >-
      ADAM5 shared a highly homologous sequence with the ADAM9 3'-UTR, predicted to be a
      binding site for miR-122b-5p.
- gap_statement: >-
    It is not known how the human sperm ADAM adhesion complex is constituted, given that
    five of its rodent components - ADAM1A, ADAM1B, ADAM3A, ADAM3B and ADAM5 - are
    pseudogenes in humans. Whether a reduced ADAM2-based complex forms, whether another
    protein substitutes, or whether humans have dispensed with the mechanism is
    undetermined.
  boundary: >-
    Established in mouse: ADAM5 is part of an ADAM2-ADAM3-ADAM5 complex, its loss reduces
    ADAM2 and ADAM3 on sperm, and the null is severely subfertile with failed uterotubal
    junction transit. Established in human: the gene is a pseudogene, as are ADAM1A, ADAM1B,
    ADAM3A, ADAM3B and ADAM6 by HGNC locus type, while ADAM2, ADAM7 and ADAM18 remain
    protein-coding.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    The rodent sperm-ADAM literature is routinely used to reason about human fertilisation.
    The extent of the human losses sets a limit on that transfer, and marks which
    rodent-derived annotations should not be propagated to human genes.
  resolution: >-
    Interaction proteomics on human ejaculated sperm to determine what, if anything, ADAM2
    partners with in the absence of ADAM3 and ADAM5, compared side by side with the mouse
    complex.
  provenance:
  - reference_id: PMID:41263505
    supporting_text: >-
      Western blot analysis revealed a significant reduction in the levels of ADAM2 and
      ADAM3 in Adam5 KO spermatozoa, supporting the previous finding that ADAM5 interacts
      with these proteins to form a complex.
  - reference_id: PMID:22926424
    supporting_text: >-
      Some of these sperm ADAMs are assembled into potentially functional complexes,
      including ADAM1B-ADAM2, ADAM2-ADAM3-ADAM4, ADAM2-ADAM3-ADAM5, and ADAM2-ADAM3-ADAM6.
suggested_questions:
- question: >-
    Should GO annotate pseudogenes at all, and if so is a set of three root ND annotations
    the right representation? Six testis-expressed ADAM genes are HGNC-typed pseudogenes in
    human - ADAM1A and ADAM1B (12q24), ADAM3A and ADAM5 (8p11.22), ADAM3B (16q12.1) and
    ADAM6 (14q32.33) - and ADAM5 is the only one of the six with a UniProt accession, so it
    alone appears in GOA. The current three ND rows are
    harmless and arguably correct, but they carry none of what is actually known - that the
    locus is transcribed and that its protein has been looked for and not found. If GO
    wishes to retain such entries, a machine-readable way to say "this is a pseudogene, and
    that is why the aspects are ND" would be more informative than ND alone.
  experts:
  - GO Consortium ontology and annotation policy
  - UniProt
- question: >-
    GO:0004222 metalloendopeptidase activity is annotated to ADAM5 orthologues and to human
    ADAM2, ADAM18 and ADAM7 by IEA:InterPro (IPR001590) and by IBA (PANTHER:PTN000224844),
    yet none of these proteins has any HExxH zinc-binding core in its sequence, and UniProt
    states of mouse Adam5 in the same entry that it is "Not expected to have protease
    activity". Measured across all 331 Swiss-Prot reviewed members of PANTHER PTHR11905 - the
    reviewed subset of a 29,886-protein family - this is not a handful of exceptions: 204 of
    204 members that retain the zinc site carry GO:0004222, and so do 37 of the 40 that have
    the Peptidase M12B fold but no HExxH core at all (92%). Losing the catalytic site
    therefore has almost no effect on whether a member receives the activity term. Human
    ADAM5 is clean only because pseudogenisation deleted the fold the signature matches on.
    Since GO:0004222 is defined as catalysis in which "one or two metal ions hold the water
    molecule in place", should the InterPro2GO mapping from IPR001590 and the PANTHER node
    PTN000224844 be restricted to members that retain the zinc-binding motif?
  experts:
  - PAINT / GO Central
  - InterPro
- question: >-
    Should the human ADAM5 UniProt entry's DOMAIN 111..199 "Disintegrin" feature be revised?
    Aligned to macaque ADAM5, the human sequence has a 246-residue internal deletion fused
    after residue 162, so this annotated domain straddles the junction: residues 111-162
    correspond to macaque 144-195, upstream of the macaque disintegrin domain, and only
    residues 163-199 correspond to real disintegrin sequence (macaque 442-478). The feature
    describes a fusion created by the deletion rather than a conserved intact domain.
  experts:
  - UniProt
- question: >-
    The 2026 mouse knockout showing ADAM5 is required for zona pellucida binding and
    uterotubal junction transit is not yet reflected in GO annotations on mouse Adam5, which
    still holds no experimental biological-process annotation for fertilisation. Should this
    paper be curated for the mouse gene, with the human gene explicitly excluded from the
    propagation on pseudogene grounds?
  experts:
  - MGI
  - PAINT / GO Central
suggested_experiments:
- hypothesis: >-
    The human ADAM5 locus produces no detectable polypeptide in testis or sperm, and the
    1999 negative Western blot was not a false negative caused by the heterologous macaque
    antiserum failing to recognise the divergent human sequence.
  description: >-
    Targeted parallel-reaction-monitoring mass spectrometry on human testis lysate and
    ejaculated sperm, using synthetic heavy-labelled proteotypic peptides selected from the
    retained C-terminal half of the putative 412-residue translation - the region that
    aligns to macaque ADAM5 at 84% identity and is therefore genuinely encoded if anything
    is translated. Human ADAM2 and ADAM18 peptides serve as positive controls, since both
    return mapped peptides in existing repositories while ADAM5 returns none.
  experiment_type: targeted mass spectrometry
- hypothesis: >-
    The ADAM5 pseudogene transcript acts as a competing endogenous RNA that sequesters
    miR-122b-5p and thereby raises ADAM9 expression.
  description: >-
    Test the two steps the association study leaves open. First, demonstrate occupancy
    directly by AGO2 CLIP or biotinylated-miRNA pulldown in an oropharyngeal cell line,
    asking whether miR-122b-5p is recovered on the ADAM5 transcript. Second, knock down the
    ADAM5 transcript alone with antisense oligonucleotides in a line with fixed ADAM3A copy
    number, and measure ADAM9 mRNA and protein. A luciferase reporter carrying the
    ADAM5-homologous segment of the ADAM9 3'-UTR, with and without the predicted seed match
    mutated, provides the specificity control.
  experiment_type: RNA interaction and reporter assay
- hypothesis: >-
    In the absence of ADAM3 and ADAM5, human sperm ADAM2 either forms a reduced complex or
    is replaced in the sperm adhesion machinery by a different protein.
  description: >-
    Immunoprecipitate ADAM2 from human ejaculated sperm plasma membrane preparations and
    identify partners by LC-MS/MS, running mouse sperm in parallel as the reference in which
    the ADAM2-ADAM3-ADAM5 complex is known to form. The comparison states directly how much
    of the rodent complex survives in humans and identifies any substitute component, which
    is the information needed before any rodent sperm-ADAM annotation is propagated to a
    human gene.
  experiment_type: interaction proteomics
references:
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The GO reference behind all three annotations on this gene. Its use here is correct:
      ND records that a curator found no data, which is the accurate state of a locus whose
      protein product has been sought and not found.
- id: PMID:10417343
  title: Transcripts encoding the sperm surface protein tMDC II are non-functional in the
    human.
  full_text_unavailable: true
  findings:
  - statement: >-
      Every characterised human tMDC II (ADAM5) transcript is non-functional, carrying
      deletions and in-frame termination codons relative to the macaque orthologue, and no
      protein is detected on Western blots of human testis or sperm extract with a macaque
      anti-tMDC II antiserum.
    supporting_text: >-
      all of which are also non-functional owing to the presence of deletions and in-frame
      termination codons, when compared with the macaque orthologue, a finding which is
      further supported by the lack of immunoreactivity on Western blots of human testis
      and sperm extracts probed with a macaque anti-tMDC II polyclonal antiserum
  - statement: >-
      The loss is not isolated: two other sperm MDC proteins of the same clade, fertilin
      alpha and tMDC I, had already been shown to be non-functional in humans.
    supporting_text: >-
      Of these, two (fertilin alpha and tMDC I) have recently been shown to be
      non-functional in the human.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The gene's primary reference, and the ECO:0000269 source for UniProt's FUNCTION line.
      PubMed record checked for retraction, erratum and expression of concern via
      CommentsCorrections/RefType: none. The paper has no DOI in PubMed; a Crossref
      bibliographic lookup resolves it to 10.1042/bj3410771 with empty update-to and
      updated-by fields, so there is no correction with a null PubMed id either. Cached
      abstract only; the quoted claims are both in the abstract.
- id: PMID:41263505
  title: ADAM5 is required for sperm-zona pellucida binding and sperm oviduct migration†.
  full_text_unavailable: true
  findings:
  - statement: >-
      Mouse Adam5 knockouts are severely subfertile with structurally normal, motile sperm
      that fail to transit the uterotubal junction and bind the zona pellucida poorly.
    supporting_text: >-
      Adam5 KO sperm failed to transit the uterotubal junction (UTJ) and displayed severe
      defects in zona pellucida (ZP) binding, phenotypes that resemble those observed in
      Adam2 and Adam3 knockout mice.
  - statement: >-
      ADAM5 acts through complex membership rather than catalysis: its loss reduces ADAM2
      and ADAM3 protein levels on spermatozoa.
    supporting_text: >-
      Western blot analysis revealed a significant reduction in the levels of ADAM2 and
      ADAM3 in Adam5 KO spermatozoa, supporting the previous finding that ADAM5 interacts
      with these proteins to form a complex.
  - statement: >-
      The authors state explicitly that ADAM5 is a pseudogene in humans, bounding the
      transfer of their mouse results.
    supporting_text: >-
      While ADAM5 is a pseudogene in humans, our results provide valuable insights into the
      function of ADAM family proteins in mammalian reproduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The decisive current paper for this gene and absent from the affinage record, which
      returned no content at all for ADAM5; found by searching the orthologue and the
      family rather than the human symbol. PMID verified against PubMed (Biol Reprod 2026,
      10.1093/biolre/ioaf254); no CommentsCorrections of any type, and Crossref shows empty
      update-to, updated-by and relation. Its value here is twofold: it establishes what
      the intact orthologue does, and it supplies a 2026 primary-literature statement of
      the human pseudogene status from authors with every incentive to claim human
      relevance. Cached abstract only; all three quoted findings are in the abstract.
- id: PMID:36553675
  title: Association of Inherited Copy Number Variation in ADAM3A and ADAM5 Pseudogenes
    with Oropharynx Cancer Risk and Outcome.
  findings:
  - statement: >-
      The ADAM5 pseudogene transcript is proposed to act as a competing endogenous RNA for
      miR-122b-5p through homology to the ADAM9 3'-UTR - a predicted binding site, not a
      measured interaction.
    supporting_text: >-
      ADAM5 shared a highly homologous sequence with the ADAM9 3'-UTR, predicted to be a
      binding site for miR-122b-5p.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited only for the RNA-level hypothesis recorded under knowledge_gaps, and
      deliberately not used to support any annotation: the mechanism rests on a
      sequence-based prediction plus a copy-number association in 152 cases and 155
      controls, and the amplicon contains ADAM3A as well as ADAM5, so the effect is not
      attributed to ADAM5 by the design. PMID verified against PubMed; no corrections, and
      Crossref update-to/updated-by are empty. Worth recording that verifying this citation
      caught a bug in my own checking script: an unanchored .//ArticleId XPath returned a
      DOI from the article's reference list (10.1002/pros.23950, The Prostate) instead of
      the article's own 10.3390/genes13122408.
- id: PMID:22926424
  title: 'Testicular and epididymal ADAMs: expression and function during fertilization.'
  full_text_unavailable: true
  findings:
  - statement: >-
      Sperm ADAMs assemble into defined complexes, ADAM2-ADAM3-ADAM5 among them, placing
      the ancestral ADAM5 function in adhesion complex assembly rather than proteolysis.
    supporting_text: >-
      Some of these sperm ADAMs are assembled into potentially functional complexes,
      including ADAM1B-ADAM2, ADAM2-ADAM3-ADAM4, ADAM2-ADAM3-ADAM5, and ADAM2-ADAM3-ADAM6.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Background review, used for the complex composition that the 2026 knockout paper
      corroborates independently. PMID verified against PubMed; no corrections; Crossref
