      abstract.
- id: PMID:10645274
  title: The MDC family of proteins and their processing during epididymal transit.
  full_text_unavailable: true
  findings:
  - statement: >-
      In macaque, tMDC II is localised to spermatogenic cells and processed during
      epididymal transit, retaining its disintegrin domain on mature spermatozoa.
    supporting_text: >-
      we have localized a number of these MDC proteins (fertilin alpha, fertilin beta, tMDC
      I, tMDC II and tMDC III) to spermatogenic cells and demonstrated that they are
      processed as spermatozoa pass through the epididymis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Establishes the orthologous protein's sperm localisation in the very species used as
      the alignment reference, which is what makes the human loss of signal peptide and
      transmembrane anchor interpretable. Explicitly not used to annotate the human gene.
      PMID verified against PubMed; no corrections; no DOI in PubMed and none required, as
      nothing load-bearing rests on it.
- id: PMID:28296340
  title: Lactadherin is a candidate oviduct Lewis X trisaccharide receptor on porcine
