  findings:
  - statement: >-
      Porcine ADAM5 was identified by LC-MS/MS as one of two sperm plasma membrane proteins
      binding sulfated Lewis X, indicating a carbohydrate-adhesion role for the intact
      orthologue.
    supporting_text: >-
      that bound sulfated Lewis X, ADAM5, which spermatozoa, was confidently identified
  reference_review:
