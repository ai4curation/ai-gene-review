- id: file:human/ADAM5/ADAM5-bioinformatics/RESULTS.md
  title: ADAM5 (human, Q6NVV9) — catalytic-motif, ortholog-length and GO-census analysis
  findings:
  - statement: >-
      The 412-residue human putative translation contains no HExxHxxGxxHD zinc-binding
      motif and no HExxH core at all, while ADAM10, ADAM17, ADAM9 and ADAM19 all return an
      intact motif - so the scan discriminates rather than simply failing to find anything.
    supporting_text: >-
      Human ADAM5 contains **no `HExxH` substring anywhere in its 412 residues**.
  - statement: >-
      Aligned to macaque ADAM5, the human sequence shows a single 246-residue internal
      deletion, and the signal peptide, Peptidase M12B domain and transmembrane helix are
      all lost while the propeptide, disintegrin and EGF-like regions are retained.
    supporting_text: >-
      the **signal peptide** and the **transmembrane helix** are lost outright, and the
      disintegrin domain is itself truncated because the deletion cuts through it
  - statement: >-
      Measured over all 331 Swiss-Prot reviewed members of PANTHER PTHR11905 (the reviewed
      subset of a 29,886-protein family), 37 of the 40 members that have the Peptidase M12B
      fold but no HExxH zinc core still carry GO:0004222, against 204 of 204 for members
      with the site intact - so the annotation does not discriminate on the catalytic site.
    supporting_text: >-
      Losing the zinc-binding site has almost no effect on whether a reviewed family member
      is annotated with metalloendopeptidase activity
  - statement: >-
      The catalytic over-annotation the family invites is present on ADAM5's orthologues
      and coding paralogues but not on human ADAM5, because the pipelines key on presence
      of the M12B fold rather than on integrity of the zinc site.
    supporting_text: >-
      The pipelines that place `GO:0004222` on this clade key on **presence of the M12B
      fold, not on integrity of the zinc site**, so every close relative of ADAM5 that
      retains the fold receives the activity term despite lacking the catalytic residues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Local reproducible analysis committed alongside this review. Re-fetches every value
      from UniProt and QuickGO on each run, asserts numberOfHits == len(results) on every
      paginated query, asserts the motif scan discriminates in both directions, and asserts
      the lost/retained feature ordering with no threshold. The --self-test mode
      break-tests each guard and was itself verified to fail with the expected messages
      when a guard is disabled. A fresh run reproduces the committed RESULTS.md and
      results.json byte-identically.
