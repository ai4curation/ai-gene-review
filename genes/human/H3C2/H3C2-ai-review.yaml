id: P68431
gene_symbol: H3C2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'H3C2 (formerly HIST1H3B) is one of ten replication-dependent genes in the HIST1 cluster on chromosome 6p22 that
  encode the identical canonical histone H3.1 protein (UniProt P68431). H3.1 is a core histone: through its histone-fold domain
  it pairs with histone H4 to form H3-H4 heterodimers, two of which make up the central (H3-H4)2 tetramer of the nucleosome
  octamer around which ~147 bp of DNA is wrapped. Its expression is restricted largely to S phase, and newly synthesized H3.1-H4
  dimers are handed through a chaperone network (NASP, ASF1, MCM2, DNAJC9) to CAF-1, which deposits them onto newly replicated
  DNA in a DNA-synthesis-coupled manner, in contrast to the replacement variant H3.3. Nucleosomal H3.1 compacts DNA and limits
  its accessibility, and its N-terminal tail and core residues carry extensive post-translational modifications (lysine methylation
  and acetylation, serine/threonine phosphorylation, glutamine serotonylation and others) that are recognized by reader proteins
  and help determine transcriptional state, heterochromatin formation, DNA repair and chromosome segregation. Somatic K27M
  and G34 mutations in H3.1/H3.3 genes are oncohistone drivers in pediatric gliomas.'
