- term:
    id: GO:0032200
    label: telomere organization
  evidence_type: TAS
  original_reference_id: PMID:17675446
  qualifier: involved_in
  review:
    summary: Telomere organization (TAS) citing a study of yeast Dot1-mediated H3K79 methylation required for telomeric silencing.
    action: KEEP_AS_NON_CORE
    reason: H3 K79 methylation is required for heterochromatic silencing at telomeres, and H3-containing nucleosomes form
      telomeric chromatin, but the cited work is in S. cerevisiae and concerns H3 as an enzyme substrate. A non-core, chromatin-context
      role.
    supported_by:
    - reference_id: PMID:17675446
      supporting_text: Saccharomyces cerevisiae cells lacking Dot1 exhibit a complete loss of H3K79 methylation and defects
        in heterochromatin-mediated silencing.
- term:
