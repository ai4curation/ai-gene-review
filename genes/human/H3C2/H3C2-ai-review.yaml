      the histone-fold structure that the assembly step depends on (scaffold case), so involvement in nucleosome assembly
      is appropriate. The paper shows H3.1 (Val89) is a poor substrate for tNASP relative to H3.3, but H3.1 still assembles
      into nucleosomes via CAF-1 and other chaperones.
    supported_by:
    - reference_id: PMID:25615412
      supporting_text: the H3.3 Ile89 residue, corresponding to the H3.1 Val89 residue, is responsible for the tNASP-mediated
        nucleosome assembly with H3.3
    - *id009
