- term:
    id: GO:0040029
    label: epigenetic regulation of gene expression
  evidence_type: IDA
  original_reference_id: PMID:16267050
  qualifier: involved_in
  review:
    summary: Epigenetic regulation of gene expression (IDA). Quantitative mass spectrometry showed that H3.1, H3.2 and H3.3
      carry distinct patterns of post-translational modifications.
    action: KEEP_AS_NON_CORE
    reason: 'H3 tails are the substrate and scaffold of the histone code: the modified residues are part of H3.1 itself and
      are read by effector proteins, so H3.1 does contribute structurally to epigenetic gene regulation (scaffold case). However,
      the regulatory activity lies largely with writers, erasers and readers, so this is kept as non-core.'
    supported_by:
    - reference_id: PMID:16267050
      supporting_text: quantitative mass spectrometry analysis of human H3.1, H3.2, and H3.3 showed modification differences
        between these three H3 variants, suggesting that they may have different biological functions
- term:
    id: GO:0045296
    label: cadherin binding
  evidence_type: HDA
  original_reference_id: PMID:25468996
  qualifier: enables
  review:
    summary: Cadherin binding (HDA) from a quantitative proteomic E-cadherin interactome study.
    action: REMOVE
    reason: Histone H3.1 is a nuclear chromatin protein; its detection in an E-cadherin affinity-purification proteome reflects
      the abundance and stickiness of histones in such pulldowns rather than a cadherin-binding molecular function. No independent
      evidence supports H3.1 binding cadherins.
- term:
    id: GO:0046982
    label: protein heterodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009072
  review:
    summary: Protein heterodimerization activity (IEA, histone-fold InterPro). H3 forms an obligate histone-fold handshake
      heterodimer with H4; two H3-H4 dimers form the (H3-H4)2 tetramer.
    action: ACCEPT
    reason: The H3-H4 heterodimer is the fundamental building unit of the nucleosome and the form in which H3.1 is handled
      by chaperones and deposited; this is a more informative MF than generic protein binding.
    supported_by:
    - *id003
