core_functions:
- description: Core histone that, as part of the H3-H4 heterodimer/tetramer, forms the structural center of the nucleosome
    octamer that wraps and compacts genomic DNA into chromatin.
  molecular_function:
    id: GO:0030527
    label: structural constituent of chromatin
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0000786
    label: nucleosome
  directly_involved_in:
  - id: GO:0006334
    label: nucleosome assembly
  supported_by:
  - reference_id: file:human/H3C2/H3C2-uniprot.txt
    supporting_text: Core component of nucleosome.
  - reference_id: PMID:21636898
    supporting_text: In the nucleosome, two copies of each core histone, H2A, H2B, H3 and H4, form a histone octamer which
      wraps 146 base pairs of DNA around itself.
  - reference_id: PMID:14718166
    supporting_text: Deposition of the major histone H3 (H3.1) is coupled to DNA synthesis during DNA replication and possibly
      DNA repair
- description: Forms an obligate histone-fold heterodimer with histone H4; H3.1-H4 dimers are the units handled by histone
    chaperones (CAF-1) and deposited onto DNA during replication-coupled nucleosome assembly.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  locations:
  - id: GO:0005634
    label: nucleus
  directly_involved_in:
  - id: GO:0006334
    label: nucleosome assembly
  supported_by:
  - reference_id: PMID:14718166
    supporting_text: these complexes possess one molecule each of H3.1/H3.3 and H4, suggesting that histones H3 and H4 exist
      as dimeric units that are important intermediates in nucleosome formation
proposed_new_terms: []
suggested_questions:
- question: Do the ten H3.1-encoding genes (H3C1-H3C12) differ in transcriptional output across the cell cycle or tissues
    such that H3C2 contributes a distinct fraction of the H3.1 pool, or are they functionally redundant at the protein level?
- question: Should the many reader/chaperone interactions annotated to H3.1 as generic protein binding instead be represented
    on the partner side (histone binding, methylated histone binding) or via GO-CAM has_input relations, rather than on the
    histone?
suggested_experiments:
- description: Allele-specific CRISPR knockout or tagging of H3C2 versus other H3.1 genes, combined with quantitative proteomics
    of H3.1 incorporation, to determine the contribution of H3C2 to the replication-coupled H3.1 pool.
