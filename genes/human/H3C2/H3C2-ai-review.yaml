    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:14718166
  qualifier: part_of
  review:
    summary: Protein-containing complex (IDA). Epitope-tagged H3.1 was purified from HeLa cells as a predeposition complex
      containing CAF-1 and one H3.1-H4 dimer.
    action: KEEP_AS_NON_CORE
    reason: Correct but very general; the specific complex (H3.1-H4 bound by CAF-1) is a chaperone-histone deposition intermediate.
      The nucleosome term captures the functional complex.
    supported_by:
