- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: TAS
  original_reference_id: PMID:8510758
  qualifier: enables
  review:
    summary: >-
      The paper that cloned FUS, as the CHOP fusion partner in myxoid liposarcoma, describes it as
      a nuclear RNA-binding protein.
    action: ACCEPT
    reason: >-
      A TAS needs an author statement, and this is the founding one; the RNA-binding domain is precisely
      the part that the TLS-CHOP translocation replaces, which is the paper's own argument. Superseded
      in precision by the later direct assays, but not in conflict with them.
    supported_by:
    - reference_id: PMID:8510758
      supporting_text: >-
        TLS is a novel nuclear RNA-binding protein with extensive sequence similarity to EWS, the
        product of a gene commonly translocated in Ewing's sarcoma.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
