- id: PMID:22563080
  title: Requirements for stress granule recruitment of fused in sarcoma (FUS) and TAR 
    DNA-binding protein of 43 kDa (TDP-43).
  findings:
  - statement: >-
      Stress-granule recruitment of FUS requires that the protein first be mislocalised to the cytoplasm;
      the RGG/zinc-finger RNA-binding region is the main determinant, with the glycine-rich and RRM
      regions contributing little and the glutamine-rich region dispensable.
    supporting_text: >-
      We determined the requirements for SG recruitment of FUS and TDP-43 and found that cytoplasmic
      mislocalization is a common prerequisite for SG recruitment of FUS and TDP-43.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not a GOA reference for FUS; added by this review because it is the domain-mapping study behind
      the decision not to annotate FUS to a stress-granule term. Cytoplasmic mislocalisation is shown
      to be a prerequisite for FUS entering stress granules, with the RGG zinc-finger region doing
      most of the work. Abstract-only in our cache (PMC returned 403), so only the abstract is quoted.
- id: PMID:23092511
  title: Endogenous TDP-43, but not FUS, contributes to stress granule assembly via G3BP.
  findings:
  - statement: >-
      Stress-granule initiation and assembly proceed normally in cells depleted of endogenous FUS,
      so FUS is not a stress-granule assembly factor; TDP-43 and G3BP are.
    supporting_text: >-
      We also demonstrate that endogenous TDP-43 and FUS do not have overlapping functions in this
      cellular process as SG initiation and assembly occur normally in the absence of FUS.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not a GOA reference for FUS; added by this review as the direct loss-of-function test of whether
      endogenous FUS is needed for stress-granule formation. It is not: initiation and assembly are
      normal in FUS-depleted cells, whereas TDP-43 depletion impairs assembly. An erratum exists (Mol
      Neurodegener 2015;10:45); it does not touch this conclusion.
- id: PMID:24090136
  title: Amyotrophic lateral sclerosis-linked FUS/TLS alters stress granule assembly and 
    dynamics.
  findings:
  - statement: >-
      Association of FUS with stress granules is a mutant-specific phenotype: endogenous wild-type
      FUS is not found in stress granules under most reported stress conditions, and the mutant protein
      perturbs granule dynamics rather than building granules.
    supporting_text: >-
      Since only the mutants, but not the endogenous wild-type FUS, are associated with stress granules
      under most of the stress conditions reported to date, the relationship between FUS and stress
      granules represents a mutant-specific phenotype and thus may be of significance in mutant-induced
      pathogenesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not a GOA reference for FUS; added by this review because it states the wild-type/mutant distinction
      explicitly and quantifies the mutant's effect. Mutant FUS delays granule assembly, speeds disassembly
      and enlarges granules, in proportion to how cytoplasmic the mutant is -- a gain-of-toxic effect
      on granules, not a normal FUS function.
core_functions:
- molecular_function:
    id: GO:0003723
    label: RNA binding
  description: >-
    FUS binds single-stranded RNA through the combination of its RRM (285-371), RGG stretches and
    RanBP2-type zinc finger (422-453), with a reported 5'-AGGUAA-3' preference, engaging nascent pre-mRNAs,
    its own pre-mRNA and pri-miRNAs. This is the activity on which every downstream role depends:
    it is required for FUS self-assembly and chromatin binding, it provides the specificity for alternative-splicing
    and mRNA-stability regulation, and RNA is an obligatory component of FUS condensates in vitro.
  directly_involved_in:
  - id: GO:0008380
    label: RNA splicing
  - id: GO:0000381
    label: regulation of alternative mRNA splicing, via spliceosome
  - id: GO:0031053
    label: primary miRNA processing
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:27378374
    supporting_text: >-
      TAF15 and FUS exhibit similar binding patterns in introns, are enriched in 3' untranslated regions
      and alter genes distinct from TDP-43.
    reference_section_type: ABSTRACT
  - reference_id: file:human/FUS/FUS-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Binds to ssRNA containing the consensus sequence 5'-AGGUAA-3'
  - reference_id: PMID:38070499
    supporting_text: >-
      while both LCD and RBD bind RNA, RBD drives RNA engagement and multivalent complex formation
    reference_section_type: ABSTRACT
- molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  description: >-
    Acting through its N-terminal low-complexity domain together with its RNA-binding region, FUS
    self-oligomerises and scaffolds dynamic, RNA-dependent, membraneless condensates. The assembled
    state stays structurally disordered and recruits clients, including the RNA polymerase II C-terminal
    domain. It is switched off physiologically by transportin-1 binding the PY-NLS and by phosphorylation
    of the low-complexity domain, and it ages into an aggregated state in vitro, faster for ALS-mutant
    protein.
  directly_involved_in:
  - id: GO:0140694
    label: membraneless organelle assembly
  - id: GO:0051260
    label: protein homooligomerization
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:38070499
    supporting_text: >-
      Fused in sarcoma (FUS) is an archetypal phase separating protein asymmetrically divided into
      a low complexity domain (LCD) and an RNA binding domain (RBD).
    reference_section_type: ABSTRACT
  - reference_id: PMID:26455390
    supporting_text: >-
      We report that the N-terminal low-complexity domain of the RNA-binding protein Fused in Sarcoma
      (FUS LC) is structurally disordered and forms a liquid-like phase-separated state resembling
      RNP granules.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29677513
    supporting_text: >-
      We show that the importin karyopherin-β2/transportin-1 inhibits LLPS of FUS. This activity depends
      on tight binding of karyopherin-β2 to the C-terminal proline-tyrosine nuclear localization signal
      (PY-NLS) of FUS.
    reference_section_type: ABSTRACT
- molecular_function:
    id: GO:0003682
    label: chromatin binding
  description: >-
    Self-assembled FUS occupies active chromatin, tethered there by the SAP domain of SAFB1 in a DNA-dependent
    manner. Chromatin binding requires both N-terminal self-assembly (residues 1-164) and RNA binding,
    and is what positions FUS on transcribing genes, where it couples transcription to RNA processing.
    It is separable from the alternative-splicing function and is strongly reduced by ALS mutations.
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:25453086
    supporting_text: >-
      we found that a significant portion of nuclear FUS was bound to active chromatin and that the
      ALS mutations dramatically decreased FUS chromatin binding ability
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - reference_id: PMID:27731383
    supporting_text: >-
      FUS and SAFB1, abundant in chromatin-bound fraction, interact in a DNA-dependent manner.
    reference_section_type: RESULTS
- molecular_function:
    id: GO:0003712
    label: transcription coregulator activity
  description: >-
    FUS regulates transcription without binding DNA sequence-specifically: it bridges RNA polymerase
    II and U1 snRNP so that splicing is coupled to transcription, acts as an androgen-receptor coactivator
    (recruited to the PSA enhancer and transactivating when tethered to a basal promoter), and in
    other contexts represses AR-mediated transcription together with SAFB1. The bidirectionality is
    why the coregulator term, not only the coactivator child, belongs here.
  directly_involved_in:
