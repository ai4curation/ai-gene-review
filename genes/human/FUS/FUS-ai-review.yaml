knowledge_gaps:
- gap_statement: >-
    Whether endogenous wild-type FUS is ever recruited into cytoplasmic stress granules, and if so
    under which stress and by what mechanism, is unresolved. The published tests are negative or mutant-dependent:
    stress-granule initiation and assembly proceed normally in FUS-depleted cells, recruitment of
    FUS requires prior cytoplasmic mislocalisation, and the association is described by its investigators
    as a mutant-specific phenotype. Only a handful of stressors (arsenite, heat shock, hyperosmolarity)
    have been tested, and mostly on tagged or overexpressed protein.
  boundary: >-
    What is known: ALS-mutant and NLS-defective FUS enters stress granules through its RGG/zinc-finger
    region and perturbs granule dynamics. What is not known: whether the endogenous protein does so
    under any physiological stress.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    This is the question that decides whether FUS belongs in a stress-granule model at all, or only
    in the disease version of one. It cannot be settled by reading: it needs an endogenous-tagging
    experiment across stressors.
  provenance:
  - reference_id: PMID:23092511
    supporting_text: >-
      We also demonstrate that endogenous TDP-43 and FUS do not have overlapping functions in this
      cellular process as SG initiation and assembly occur normally in the absence of FUS.
    reference_section_type: ABSTRACT
  - reference_id: PMID:22563080
    supporting_text: >-
      We determined the requirements for SG recruitment of FUS and TDP-43 and found that cytoplasmic
      mislocalization is a common prerequisite for SG recruitment of FUS and TDP-43.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - reference_id: PMID:24090136
    supporting_text: >-
      Since only the mutants, but not the endogenous wild-type FUS, are associated with stress granules
      under most of the stress conditions reported to date, the relationship between FUS and stress
      granules represents a mutant-specific phenotype and thus may be of significance in mutant-induced
      pathogenesis.
    reference_section_type: ABSTRACT
- gap_statement: >-
    Whether FUS performs the homologous-pairing step at a double-strand break in cells, or only facilitates
    the reaction carried out by RAD51, is unknown. The strand-annealing and D-loop activities were
    measured on purified protein in 1999 and have not been placed in a cellular repair pathway, which
    is why the existing GO annotation is a regulation term rather than `double-strand break repair
    via homologous recombination`.
  boundary: >-
    What is known: purified FUS anneals complementary strands and drives ATP-independent D-loop formation;
    the activity is lost in TLS-CHOP; FUS is phosphorylated by ATM and DNA-PK on DNA damage and forms
    liquid compartments at damage sites. What is not known: which entity does the strand invasion
    at a real break, and whether FUS acts catalytically or as a condensate that concentrates the repair
    machinery.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    The answer decides between a regulation term and a direct participation term, and between FUS
    as a recombination mediator and FUS as a damage-site scaffold.
  provenance:
  - reference_id: PMID:10567410
    supporting_text: >-
      More important, it promotes the uptake of a single-stranded oligonucleotide into a homologous
      superhelical DNA to form a D-loop.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - reference_id: PMID:26317470
    supporting_text: >-
      We show that, in cells, FUS forms liquid compartments at sites of DNA damage and in the cytoplasm
      upon stress.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- gap_statement: >-
    The direction and target selectivity of FUS's effect on mRNA stability are not understood. Depleting
    FUS in human neural progenitors stabilised 330 transcripts and destabilised 44, while the qRT-PCR-validated
    FUS-bound subset did not change at all, so neither `mRNA stabilization` nor `mRNA destabilization`
    describes what FUS does; what decides which bound transcript responds, and in which direction,
    is unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Until this is resolved the process can only be annotated at the direction-neutral parent, and
    FUS's contribution to the ALS transcriptome cannot be predicted from its binding map.
  provenance:
  - reference_id: PMID:27378374
    supporting_text: >-
      We identified 299 and 330 genes that were highly stabilized (increased half-life), as well as
      132 and 44 genes that were highly destabilized (decreased half-life) upon loss of TAF15 and
      FUS, respectively
    reference_section_type: RESULTS
  - reference_id: PMID:27378374
    supporting_text: >-
      FUS depletion did not appear to have an effect on mRNA stability of these transcripts
    reference_section_type: RESULTS
suggested_questions:
- question: >-
    Should GO record any stress-granule term for FUS? The literature says the association is a property
    of cytoplasmically mislocalised (ALS-mutant) FUS and that endogenous FUS is dispensable for granule
    assembly, yet FUS is routinely listed among stress-granule proteins in reviews and in pathway
    resources. If GO wants to capture mutant-specific localisation at all, it needs a mechanism for
    variant-conditional annotation, since annotating the wild-type gene product would be wrong.
  experts:
  - GO cell-component curators
  - stress-granule biologists
- question: >-
    Is `GO:1990000 amyloid fibril formation` the right term for reversible, phosphorylation-dissolvable
    low-complexity-domain polymers? Its definition says "insoluble fibrous protein aggregates", and
    the FUS papers annotated to it explicitly contrast their fibrils with pathogenic amyloid. A distinction
    between labile functional polymers and irreversible amyloid would let FUS, TDP-43 and the other
    RNP-granule proteins be annotated correctly.
  experts:
  - GO ontology editors
  - biomolecular condensate community
- question: >-
    Does FUS act as a recombinase-like homologous-pairing factor in vivo, or is the 1999 D-loop activity
    better understood as the in vitro signature of a DNA-binding condensate scaffold that concentrates
    repair factors at breaks?
  experts:
  - DNA double-strand break repair community
- question: >-
    FUS, EWSR1 and TAF15 share an architecture, a PANTHER node and most of their annotations. Which
    of the FET-family functions are genuinely shared and which are paralog-specific? The CLIP comparison
    in PMID:27378374 found FUS and TAF15 affecting distinct mRNA populations, which argues the annotations
    are currently more uniform than the biology.
  experts:
  - FET protein community
  - PAINT curators
suggested_experiments:
- hypothesis: >-
    Endogenous wild-type FUS is not recruited to cytoplasmic stress granules under any physiological
    stress; previous positive reports reflect tagged, overexpressed or NLS-mutant protein.
  description: >-
    Knock in a fluorescent tag at the endogenous FUS locus in a near-diploid human line and in iPSC-derived
    motor neurons, and image granule partitioning across a stressor panel (arsenite, heat shock, hyperosmolarity,
    ER stress, mitochondrial inhibition, proteasome inhibition) with G3BP1 and TIA1 as granule markers
    and a knock-in-tagged TARDBP line as the positive comparison. Score the fraction of granules containing
    FUS and the FUS partition coefficient, rather than presence/absence, and run the same panel on
    an isogenic P525L knock-in to anchor the mutant comparison.
  experiment_type: endogenous-tagging live-cell imaging
- hypothesis: >-
    FUS determines the direction of its effect on a bound mRNA's stability through where in the transcript
    it binds -- intronic/promoter-proximal binding coupling to destabilisation, 3'-UTR binding to
    stabilisation.
  description: >-
    In human neural progenitors, combine FUS eCLIP with metabolic labelling (SLAM-seq or TT-seq) half-life
    measurement in control and FUS-knockdown cells, then stratify half-life changes by binding position,
    binding density and motif content. Validate the two strongest predicted classes with reporter
    constructs carrying the FUS-bound element in its native position versus a scrambled control.
  experiment_type: eCLIP plus metabolic-labelling RNA stability profiling
- hypothesis: >-
    FUS's contribution to double-strand break repair is as a condensate that concentrates repair factors,
    not as a strand-pairing enzyme.
  description: >-
    Compare separation-of-function FUS alleles at a defined break (DSB reporter plus laser microirradiation):
    a variant that retains DNA binding but cannot phase separate (low-complexity domain replaced by
    an inert flexible linker) against one that phase separates but carries mutations in the C-terminal
    region required for D-loop activity. Read out RAD51 and BRCA1 recruitment kinetics, homologous-recombination
    reporter efficiency, and D-loop activity of each purified variant in vitro. If only the condensate-competent
    allele rescues repair, the regulation term is right and the participation term is not.
  experiment_type: separation-of-function allele series with DSB reporters
- hypothesis: >-
    The pri-miRNA subset whose processing depends on FUS is defined by co-transcriptional FUS occupancy
    at the miRNA locus rather than by pri-miRNA sequence.
  description: >-
    Pair FUS ChIP-seq and pri-miRNA CLIP with small-RNA sequencing in FUS-depleted and rescued cells,
    and test whether moving a FUS-dependent pri-miRNA hairpin into a FUS-free locus (and vice versa)
    transfers the dependency. This would also establish whether the proposed GO:0031053 annotation
    should carry a `has input` restriction to a defined pri-miRNA set.
  experiment_type: ChIP-seq/CLIP plus small-RNA sequencing with locus swaps
