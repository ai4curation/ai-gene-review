    label: positive regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0003713
  review:
    summary: >-
      GO's inter-ontology inference derives positive regulation of transcription from FUS's transcription
      coactivator activity.
    action: ACCEPT
    reason: >-
      A logical consequence of the IDA coactivator row, and independently supported by that paper's
      own loss- and gain-of-function results on AR target genes. Kept at this level: the row's evidence
      is the MF-to-BP mapping, which identifies no polymerase, so there is nothing in it to refine,
      and no more specific positive-regulation term is asserted elsewhere in this review that would
      make it uninformative. Note that FUS also represses AR-mediated transcription in other hands
      (PMID:27731383), so the positive direction is context-specific rather than the whole story.
    supported_by:
    - reference_id: PMID:21909421
      supporting_text: >-
        Thus, FUS is a novel co-activator of AR in prostate cancer cells.
      reference_section_type: ABSTRACT
    - reference_id: PMID:21909421
      supporting_text: >-
        FUS displayed a strong intrinsic transactivation capacity in prostate cancer cells when tethered
        to basal promoters using the GAL4 system.
      reference_section_type: ABSTRACT
- term:
    id: GO:0048255
    label: mRNA stabilization
  evidence_type: IDA
  original_reference_id: PMID:27378374
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Actinomycin-D half-life measurements after FUS knockdown in human neural progenitors change
      the stability of FUS-bound transcripts -- but mostly in the opposite direction to the annotated
      term.
    action: MODIFY
    reason: >-
      FUS clearly regulates the stability of its targets, so the claim behind the row is sound, but
      the direction is wrong. In this paper's own counts, losing FUS *stabilised* 330 transcripts
      and destabilised only 44, i.e. FUS predominantly destabilises its targets; and for the qPCR-validated
      subset FUS depletion changed stability not at all. The honest term is the direction-neutral
      parent, `GO:0043488 regulation of mRNA stability`; `GO:0061157 mRNA destabilization` would over-read
      a mixed result. This is a lateral/sign correction, not a refinement, so the replacement is not
      a descendant.
    proposed_replacement_terms:
    - id: GO:0043488
      label: regulation of mRNA stability
    source_defects:
    - defect_type: WRONG_TERM
      resource: MGI
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0048255
      corrected_value: GO:0043488
      corrected_label: regulation of mRNA stability
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The annotation of GO:0048255 mRNA stabilization to FUS (P35637) from PMID:27378374 states
        the opposite direction to the paper's result. The paper reports that upon loss of FUS 330
        genes were highly stabilized (increased half-life) and only 44 highly destabilized, so FUS
        acts predominantly to destabilize its bound transcripts; the authors also state that FUS depletion
        did not appear to affect the stability of the qRT-PCR-validated subset. Because the effect
        is mixed, the direction-neutral parent GO:0043488 regulation of mRNA stability is the term
        the evidence supports, rather than GO:0061157 mRNA destabilization. Confidence is PROBABLE
        rather than CONFIRMED: the figures behind the counts were not re-analysed, and a curator may
        have been annotating a specific stabilized target not identified in the text.
      supported_by:
      - reference_id: PMID:27378374
        supporting_text: >-
          We identified 299 and 330 genes that were highly stabilized (increased half-life), as well
          as 132 and 44 genes that were highly destabilized (decreased half-life) upon loss of TAF15
          and FUS, respectively
        reference_section_type: RESULTS
      - reference_id: PMID:27378374
        supporting_text: >-
          FUS depletion did not appear to have an effect on mRNA stability of these transcripts
        reference_section_type: RESULTS
    supported_by:
    - reference_id: PMID:27378374
      supporting_text: >-
        We identified 299 and 330 genes that were highly stabilized (increased half-life), as well
        as 132 and 44 genes that were highly destabilized (decreased half-life) upon loss of TAF15
        and FUS, respectively
      reference_section_type: RESULTS
    - reference_id: PMID:27378374
      supporting_text: >-
        FUS depletion did not appear to have an effect on mRNA stability of these transcripts
      reference_section_type: RESULTS
    - reference_id: PMID:27378374
      supporting_text: >-
        In human neural progenitors, TAF15 and FUS affect turnover of their RNA targets.
      reference_section_type: ABSTRACT
- term:
    id: GO:0051260
    label: protein homooligomerization
  evidence_type: IDA
  original_reference_id: PMID:25453086
  qualifier: involved_in
  review:
    summary: >-
      FUS self-assembles in the nucleus of mammalian cells through its N-terminal QGSY-rich region,
      residues 1-164, and this is required for chromatin binding.
    action: ACCEPT
    reason: >-
      Direct, with the oligomerisation element mapped and a downstream requirement demonstrated. Also
      recorded by UniProt. Homo-oligomerisation is the process form of the self-association that makes
      FUS a condensate scaffold, so it belongs in the kept set.
    supported_by:
    - reference_id: PMID:25453086
      supporting_text: >-
        The N-terminal QGSY (glutamine-glycine-serine-tyrosine)-rich region (amino acids 1-164) mediates
        FUS self-assembly in the nucleus of mammalian cells and the self-assembly is essential for
        its chromatin binding and transcription activation.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        Self-oligomerizes (via N-terminal region) (PubMed:25453086). Oligomerization is essential
        for chromatin binding (PubMed:25453086).
- term:
    id: GO:0098978
    label: glutamatergic synapse
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P56959
  - ensembl:ENSMUSP00000101858
  review:
    summary: >-
      Ensembl Compara projects a SynGO annotation for glutamatergic synapse from mouse Fus (P56959)
      onto human FUS.
    action: KEEP_AS_NON_CORE
    reason: >-
      A SynGO-derived annotation on mouse Fus projected onto human FUS by Ensembl Compara. The claim
      is plausible and UniProt carries the matching neuronal role, but only by similarity, and no
      human experiment for this location is cited. Kept rather than removed -- there is no biological
      argument against a neuronal FUS pool, and synaptic localisation of FET proteins is well described
      in rodents -- but it is a cell-type-restricted location peripheral to FUS's core nuclear function,
      so non-core. Not refined further: a projection stops where the donor annotation stops.
    supported_by:
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        In neuronal cells, plays crucial roles in dendritic spine formation and stability, RNA transport,
        mRNA stability and synaptic homeostasis (By similarity).
