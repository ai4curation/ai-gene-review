- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P56959
  - ensembl:ENSMUSP00000101858
  review:
    summary: >-
      Ensembl Compara projects cytoplasmic localisation from mouse Fus onto human FUS.
    action: KEEP_AS_NON_CORE
    reason: >-
      FUS does shuttle, and a cytoplasmic pool is real in neurons, so the row is not false. But in
      a eukaryote `cytoplasm` subsumes every non-nuclear organelle and says little more than "not
      nuclear"; it is never a core location, and this review names no location that GO places under
      cytoplasm, so TOO_GENERAL does not apply either. The row is a propagation, which stops at cytoplasm
      by construction, so it cannot be MODIFYed to a resolved compartment. Kept as non-core; the synaptic-cytosol
      rows below are the only resolved cytoplasmic locations on this gene and they are projections
      too.
    supported_by:
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        In neuronal cells, plays crucial roles in dendritic spine formation and stability, RNA transport,
        mRNA stability and synaptic homeostasis (By similarity).
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IDA
  original_reference_id: PMID:26124092
  qualifier: involved_in
  review:
    summary: >-
      FUS bridges RNA polymerase II and U1 snRNP in a coupled transcription-splicing reaction, and
      U1 snRNP no longer associates with the polymerase in FUS-knockdown extracts.
    action: TOO_GENERAL
    reason: >-
      True of FUS, but uninformative on its own: it does not say which polymerase, and `GO:0006357
      regulation of transcription by RNA polymerase II`, which this review accepts on the PMID:25453086
      row, already entails it. This row's own evidence is in fact RNA polymerase II-specific -- the
      assay is a coupled RNAP II transcription-splicing reaction and the measured contact is with
      POLR2A -- so GO could equally repoint this row to GO:0006357, which FUS already carries. Either
      way the general term should not be the level at which this evidence is recorded. The action
      is TOO_GENERAL rather than MODIFY so that both rows for this term make one consistent claim;
      nothing here says the claim is false.
    supported_by:
    - reference_id: PMID:26124092
      supporting_text: >-
        we found that U1 snRNP does not interact with RNAP II in FUS knockdown extracts
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:26124092
      supporting_text: >-
        our data lead to a model that FUS functions in coupling transcription to splicing via mediating
        an interaction between RNAP II and U1 snRNP
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        Interacts with SNRNP70 and POLR2A; these interactions couple RNA transcription and splicing
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
