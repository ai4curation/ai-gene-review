    reference_section_type: DISCUSSION
- molecular_function:
    id: GO:0003697
    label: single-stranded DNA binding
  description: >-
    A separable biochemical activity of the same protein: purified FUS binds single- and double-stranded
    DNA, anneals complementary strands, and promotes ATP-independent uptake of a single-stranded oligonucleotide
    into homologous supercoiled DNA to form a D-loop. The activity is lost in the TLS-CHOP oncoprotein,
    which lacks the C-terminal region. Listed as a core function because it is a distinct, directly
    measured molecular activity of FUS, though whether FUS performs the pairing step at a break in
    cells, rather than facilitating it, is still open.
  directly_involved_in:
