- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:18509338
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35637
  review:
    summary: >-
      FUS co-precipitates with itself in the study of CCND1-promoter ncRNAs that allosterically regulate
      FUS-bound CBP/p300.
    action: KEEP_AS_NON_CORE
    reason: >-
      FUS self-association is real and mechanistically important -- it is what chromatin binding and
      condensate formation depend on -- and `identical protein binding` is informative enough to keep
      (it is not bare GO:0005515). It is kept as non-core rather than accepted because the function
      GO should record for this behaviour is `molecular condensate scaffold activity` (GO:0140693),
      which this review accepts as core; self-binding is the mechanism underneath it, not the activity
      itself.
    supported_by:
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        Self-oligomerizes (via N-terminal region) (PubMed:25453086). Oligomerization is essential
        for chromatin binding (PubMed:25453086).
