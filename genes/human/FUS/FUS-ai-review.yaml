- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: EXP
  original_reference_id: PMID:38070499
  qualifier: enables
  review:
    summary: >-
      Purified full-length FUS undergoes RNA-dependent liquid-liquid phase separation, with the RNA-binding
      domain driving droplet formation and the low-complexity domain buffering it.
    action: ACCEPT
    reason: >-
      Direct, quantitative reconstitution with defined components, plus the matching cell-based readout.
      Condensate scaffold activity is a core molecular function of FUS: it is the activity the archetypal
      phase-separating RBP is studied for, and it is what the low-complexity and RNA-binding domains
      jointly produce.
    supported_by:
    - reference_id: PMID:38070499
      supporting_text: >-
        Fused in sarcoma (FUS) is an archetypal phase separating protein asymmetrically divided into
        a low complexity domain (LCD) and an RNA binding domain (RBD).
      reference_section_type: ABSTRACT
    - reference_id: PMID:38070499
      supporting_text: >-
        We find that RBD drives RNA-dependent phase separation but forms large and irregularly shaped
        droplets that are rescued by LCD in trans.
      reference_section_type: ABSTRACT
- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:26317470
  qualifier: enables
  review:
    summary: >-
      FUS forms liquid compartments in cells at sites of DNA damage and in the cytoplasm under stress,
      reconstituted in vitro, and these droplets age into an aggregated state faster when the protein
      carries a patient mutation.
    action: ACCEPT
    reason: >-
      The paper that established FUS as a phase-separating protein in cells as well as in vitro, and
      which states explicitly that the dynamic liquid compartment is the physiological form. Independent
      support for the same core activity. (The cytoplasmic compartments reported here are not called
      stress granules, and this review does not annotate FUS to stress granules -- see the knowledge
      gap.)
    supported_by:
    - reference_id: PMID:26317470
      supporting_text: >-
        We show that, in cells, FUS forms liquid compartments at sites of DNA damage and in the cytoplasm
        upon stress.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:26317470
      supporting_text: >-
        We conclude that the physiological role of FUS requires forming dynamic liquid-like compartments.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:26317470
      supporting_text: >-
        we demonstrate that liquid droplets of FUS protein convert with time from a liquid to an aggregated
        state, and this conversion is accelerated by patient-derived mutations
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:26455390
  qualifier: enables
  review:
    summary: >-
      NMR on the FUS low-complexity domain shows a liquid-like phase-separated state that stays disordered
      and directly binds the RNA polymerase II C-terminal domain.
    action: ACCEPT
    reason: >-
      Residue-level evidence that the scaffold is a dynamic, disordered assembly rather than a static
      structure, and that it has a client: the polymerase CTD. That client is what links this molecular
      function to FUS's transcription and splicing roles.
    supported_by:
    - reference_id: PMID:26455390
      supporting_text: >-
        We report that the N-terminal low-complexity domain of the RNA-binding protein Fused in Sarcoma
        (FUS LC) is structurally disordered and forms a liquid-like phase-separated state resembling
        RNP granules.
      reference_section_type: ABSTRACT
    - reference_id: PMID:26455390
      supporting_text: >-
        This state directly binds the C-terminal domain of RNA polymerase II.
      reference_section_type: ABSTRACT
    - reference_id: PMID:26455390
      supporting_text: >-
        we find that FUS LC retains disordered secondary structure even in the liquid phase-separated
        state
      reference_section_type: ABSTRACT
