- term:
    id: GO:0003697
    label: single-stranded DNA binding
  evidence_type: IDA
  original_reference_id: PMID:10567410
  qualifier: enables
  review:
    summary: >-
      Purified FUS binds single-stranded DNA and takes a single-stranded oligonucleotide up into a
      homologous duplex.
    action: NEW
    reason: >-
      GOA carries the downstream process row from this paper (GO:1905168) but gives FUS no DNA-binding
      molecular function at all, even though UniProt keywords the protein DNA-binding and the paper
      measures the binding directly. Single-strand binding is the specific activity the D-loop reaction
      requires, since it is the invading strand FUS has to hold. Comparator check (QuickGO, goId=GO:0003697,
      taxonId=9606, exact usage, 383 annotations): proteins in the same role -- the ones that bind
      and pair ssDNA, e.g. RAD51, DMC1, SSBP1 -- do carry this term, so the absence on FUS is a gap
      rather than a convention. The query returns positives, so the comparison is not a false negative.
    supported_by:
    - reference_id: PMID:10567410
      supporting_text: >-
        hPOMp75/TLS binds both single- and double-stranded DNAs and mediates annealing of complementary
        DNA strands.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:10567410
      supporting_text: >-
        More important, it promotes the uptake of a single-stranded oligonucleotide into a homologous
        superhelical DNA to form a D-loop.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:10567410
      supporting_text: >-
        DNA annealing and D-loop formation catalyzed by hPOMp75/TLS require Mg(2+) and are ATP-independent.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
