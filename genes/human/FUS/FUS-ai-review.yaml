  original_reference_id: PMID:10567410
  qualifier: enables
  review:
    summary: >-
      The same preparation of purified FUS binds double-stranded DNA and anneals complementary strands.
    action: NEW
    reason: >-
      The other half of the measurement in the same sentence of the same paper, and a sibling rather
      than an ancestor or descendant of the ssDNA term above, so the two are not redundant. Duplex
      binding is what the D-loop reaction needs on the recipient side: FUS has to engage the supercoiled
      homologous duplex to invade it. Kept separate from `GO:0003682 chromatin binding`, which is
      about the nucleosomal template, not naked duplex DNA.
    supported_by:
    - reference_id: PMID:10567410
      supporting_text: >-
        hPOMp75/TLS binds both single- and double-stranded DNAs and mediates annealing of complementary
        DNA strands.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:10567410
      supporting_text: >-
        More important, it promotes the uptake of a single-stranded oligonucleotide into a homologous
        superhelical DNA to form a D-loop.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0031053
    label: primary miRNA processing
  evidence_type: IMP
  original_reference_id: PMID:23232809
  qualifier: involved_in
  review:
    summary: >-
      FUS is recruited co-transcriptionally to miRNA loci, binds the corresponding pri-miRNAs, and
      is required for DROSHA occupancy there and for mature miRNA output.
    action: NEW
    reason: >-
      Which entity performs the step: DROSHA does the cleaving, and FUS binds the pri-miRNA and brings
      the nuclease to it co-transcriptionally -- the cofactor/positioning form of participation, with
      a functional readout (FUS depletion lowers both chromatin-bound DROSHA and mature miRNA levels).
      Comparator check (QuickGO, goId=GO:0031053, taxonId=9606, exact usage, 59 annotations, so the
      query does return positives): the same-role cofactors that promote Drosha-mediated processing
      without being the nuclease carry exactly this term involved_in -- DDX5 (IMP), SRRT (IMP), SRSF3
      (IMP), HNRNPA2B1 (IDA), METTL3 (IDA) -- alongside DROSHA and DGCR8 themselves. The regulation
      branch is not the convention here: GO:2000636 has only two human annotations (BMP4 and TGFB1).
      Neither this term nor an ancestor or descendant of it is currently on FUS; GOA records this
      paper only as a bare GO:0005515 row with DROSHA, which this review removes, so the paper's functional
      content would otherwise be lost.
    supported_by:
    - reference_id: PMID:23232809
      supporting_text: >-
        We also show that FUS/TLS is recruited to chromatin at sites of their transcription and binds
        the corresponding pri-microRNAs. Moreover, FUS/TLS depletion leads to decreased Drosha level
        at the same chromatin loci.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:23232809
      supporting_text: >-
        Limited FUS/TLS depletion leads to a reduced microRNA biogenesis
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:23232809
      supporting_text: >-
        we show that the FUS/TLS (fused in sarcoma/translocated in liposarcoma) protein, associated
        with familial forms of Amyotrophic Lateral Sclerosis (ALS), contributes to the biogenesis
        of a specific subset of microRNAs
      reference_section_type: ABSTRACT
      full_text_unavailable: true
