- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:19251627
  qualifier: located_in
  review:
    summary: >-
      The paper reporting FUS mutations as a cause of familial ALS states that wild-type FUS is normally
      predominantly nuclear, whereas the mutants accumulate in the cytoplasm of neurons.
    action: ACCEPT
    reason: >-
      FUS is a nuclear protein; this is the single best-established fact about its localisation and
      the contrast that defines ALS-FUS pathology (mutant protein mislocalises to the cytoplasm).
      The nucleus term is informative and is kept, with the sub-compartment added separately rather
      than substituted: the nucleoplasm rows below record the punctate, nucleolus-excluded distribution
      UniProt describes.
    supported_by:
    - reference_id: PMID:19251627
      supporting_text: >-
        The FUS/TLS protein binds to RNA, functions in diverse processes, and is normally located
        predominantly in the nucleus.
