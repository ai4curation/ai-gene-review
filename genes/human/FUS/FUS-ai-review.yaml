- term:
    id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  evidence_type: IDA
  original_reference_id: PMID:10567410
  qualifier: involved_in
  review:
    summary: >-
      Purified FUS (as POMp75) anneals complementary DNA strands and promotes uptake of a single-stranded
      oligonucleotide into homologous supercoiled DNA to form a D-loop, the committed step of homologous
      recombination.
    action: ACCEPT
    reason: >-
      Deliberately kept as a regulation term rather than promoted to `GO:0000724 double-strand break
      repair via homologous recombination`. The homologous pairing is measured directly, and ATP-independently,
      on purified protein, so FUS does the chemistry of a recombination step in vitro; but there is
      no evidence here that FUS performs that step at a break in cells rather than facilitating the
      reaction, and the curator's hedged term is the right reading of what was shown. UniProt reads
      the same paper the same way. The activity is lost in the TLS-CHOP oncoprotein, which is a useful
      specificity control.
    supported_by:
    - reference_id: PMID:10567410
      supporting_text: >-
        hPOMp75/TLS binds both single- and double-stranded DNAs and mediates annealing of complementary
        DNA strands.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:10567410
      supporting_text: >-
        More important, it promotes the uptake of a single-stranded oligonucleotide into a homologous
        superhelical DNA to form a D-loop.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:10567410
      supporting_text: >-
        The formation of a D-loop is an essential step in DNA double-strand break repair through recombination.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Plays a role in DNA repair mechanisms by promoting D-loop formation and homologous recombination
        during DNA double-strand break repair
- term:
    id: GO:1990000
    label: amyloid fibril formation
  evidence_type: EXP
  original_reference_id: PMID:28942918
  qualifier: involved_in
  review:
    summary: >-
      Solid-state NMR of fibrils formed by the isolated FUS low-complexity domain, which the authors
      contrast explicitly with pathogenic amyloid.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:1990000 is defined as the generation of "insoluble fibrous protein aggregates", and both
      papers cited for this term on FUS go out of their way to say that what they measured is not
      that. The assemblies are reversible, dynamic, non-polymorphic polymers of the isolated low-complexity
      domain that dissolve when DNA-PK phosphorylates the fibril core, and the companion structural
      work calls them "reversible amyloid" (PMID:29610493). The biologically meaningful content --
      that the low-complexity domain self-polymerises to build a dynamic assembly -- is already carried
      by `GO:0140693 molecular condensate scaffold activity` and `GO:0140694 membraneless organelle
      assembly`, both accepted here. Genuine, irreversible FUS amyloid is a disease-state feature
      of ALS/FTD inclusions, not a normal FUS process. Marked over-annotated rather than removed:
      the term is not flatly wrong, since the fibrils are real and beta-sheet, and these are direct
      in vitro measurements.
    supported_by:
    - reference_id: PMID:28942918
      supporting_text: >-
        Unlike pathogenic amyloid fibrils, FUS-LC fibrils lack hydrophobic interactions within the
        core and are not polymorphic at the molecular structural level.
      reference_section_type: ABSTRACT
    - reference_id: PMID:28942918
      supporting_text: >-
        From the 214-residue LC domain of FUS (FUS-LC), a segment of only 57 residues forms the fibril
        core, while other segments remain dynamically disordered.
      reference_section_type: ABSTRACT
    - reference_id: PMID:28942918
      supporting_text: >-
        Phosphorylation of core-forming residues by DNA-dependent protein kinase blocks binding of
        soluble FUS-LC to FUS-LC hydrogels and dissolves phase-separated, liquid-like FUS-LC droplets.
      reference_section_type: ABSTRACT
