    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR035979
  review:
    summary: >-
      InterPro2GO maps the RBD/RRM structural superfamily signature IPR035979 on FUS to the generic
      parent of RNA binding.
    action: TOO_GENERAL
    reason: >-
      FUS's RNA binding is asserted directly elsewhere in this review (EXP, HDA, IDA) and accepted,
      and `nucleic acid binding` is entailed by it. The term is imprecise on its own -- it does not
      say which nucleic acid -- and this row's own evidence, a match to a structural superfamily that
      occurs in both DNA- and RNA-binding proteins, cannot resolve that, so this is TOO_GENERAL rather
      than MODIFY. FUS does additionally bind DNA, which this review proposes separately as GO:0003697
      and GO:0003690 from PMID:10567410, so the broad term is not false either.
    supported_by:
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: >-
        Belongs to the RRM TET family.
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:25453086
  qualifier: enables
  review:
    summary: >-
      Fractionation and ChIP show that a substantial pool of nuclear FUS is bound to active chromatin,
      and that self-assembly via the N-terminal QGSY-rich region is required for it.
    action: ACCEPT
    reason: >-
      Direct assay on the endogenous human protein, with a mapped requirement (N-terminal self-assembly
      and RNA binding) and a functional consequence (transcription activation). Chromatin binding
      is one of FUS's core molecular functions: it is what places FUS on transcribing genes, where
      the transcription-splicing coupling and pri-miRNA processing roles happen.
    supported_by:
    - reference_id: PMID:25453086
      supporting_text: >-
        we found that a significant portion of nuclear FUS was bound to active chromatin and that
        the ALS mutations dramatically decreased FUS chromatin binding ability
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:25453086
      supporting_text: >-
        The N-terminal QGSY (glutamine-glycine-serine-tyrosine)-rich region (amino acids 1-164) mediates
        FUS self-assembly in the nucleus of mammalian cells and the self-assembly is essential for
        its chromatin binding and transcription activation.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:25453086
      supporting_text: >-
        In addition, RNA binding is also required for FUS self-assembly and chromatin binding.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
