id: P35637
gene_symbol: FUS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FUS (fused in sarcoma, also called TLS, translocated in liposarcoma) is a ubiquitously expressed
  526-residue nuclear DNA/RNA-binding protein and the founding member of the FET family, which it
  shares with EWSR1 and TAF15. Its architecture is a long N-terminal QGSY-rich low-complexity region,
  three RGG-rich stretches, a single RRM and a RanBP2-type zinc finger, ending in a proline-tyrosine
  nuclear localisation signal; most of the protein outside the RRM and zinc finger is intrinsically
  disordered. FUS binds single-stranded RNA, with a reported 5'-AGGUAA-3' preference, and engages
  thousands of transcripts in vivo, concentrating in introns and 3' untranslated regions. Through
  the combination of its low-complexity and RNA-binding regions it is an archetypal phase-separating
  protein: it self-oligomerises and scaffolds dynamic, RNA-dependent, membraneless condensates, a
  behaviour switched off by transportin-1 binding its PY-NLS and by phosphorylation of the low-complexity
  domain. Functionally, self-assembled FUS binds active chromatin via a SAFB1 tether and couples transcription
  to RNA processing: it bridges RNA polymerase II and U1 snRNP so that splicing follows transcription,
  regulates alternative splicing of its targets (including repression of its own exon 7, which routes
  the skipped isoform to nonsense-mediated decay), regulates the stability of bound mRNAs, recruits
  DROSHA co-transcriptionally to pri-miRNA loci, and acts as a coregulator of nuclear-receptor-driven
  transcription. A separable biochemical activity is homologous DNA pairing: purified FUS binds single-
  and double-stranded DNA, anneals complementary strands and promotes ATP-independent D-loop formation,
  consistent with a role in double-strand break repair by homologous recombination. In neurons it
  is additionally implicated in dendritic spine formation, RNA transport and synaptic homeostasis.
  FUS is one of the principal amyotrophic lateral sclerosis genes: PY-NLS variants cause ALS6 with
  or without frontotemporal dementia by driving the protein into the cytoplasm, where it forms inclusions,
  and recurrent translocations fuse the N-terminal region to DDIT3, ERG or ATF1 in myxoid liposarcoma,
  acute myeloid leukaemia and angiomatoid fibrous histiocytoma.
