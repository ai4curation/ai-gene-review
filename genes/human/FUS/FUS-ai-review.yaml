- term:
    id: GO:0043484
    label: regulation of RNA splicing
  evidence_type: IDA
  original_reference_id: PMID:25453086
  qualifier: involved_in
  review:
    summary: >-
      FUS regulates alternative splicing of its targets, and this activity is genetically separable
      from its chromatin-binding/transcription-activation function.
    action: MODIFY
    reason: >-
      Right claim, available at greater depth: what this paper assayed is alternative splicing regulation
      specifically, which it separates from transcription activation in the same domain-mapping experiments.
      `GO:0000381` is the is_a descendant that says so. FUS's best-characterised single event, repression
      of its own exon 7 with the skipped isoform degraded by NMD (PMID:24204307), is the same kind
      of regulation. A refinement, not a decomposition.
    proposed_replacement_terms: &id001
    - id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:25453086
      supporting_text: >-
        Functionally, the chromatin binding is required for FUS transcription activation, but not
        for alternative splicing regulation.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:24204307
      supporting_text: >-
        We demonstrated that FUS is a repressor of exon 7 splicing and that the exon 7-skipped splice
        variant is subject to nonsense-mediated decay (NMD).
      reference_section_type: ABSTRACT
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Also binds its own pre- mRNA and autoregulates its expression; this autoregulation mechanism
        is mediated by non-sense-mediated decay
