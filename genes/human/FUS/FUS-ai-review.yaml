- term:
    id: GO:0003712
    label: transcription coregulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000579998
  - UniProtKB:P35637
  review:
    summary: >-
      PAINT places transcription coregulator activity at PTN000579998, the FET-family node shared
      by FUS, EWSR1 and TAF15.
    action: ACCEPT
    reason: >-
      Reading the phylogeny rather than the donor count: the IBD sits at the node for the FET family,
      whose members are all chromatin-associated transcription coregulators, and FUS is inside that
      clade with no evidence of loss. FUS appearing in its own WITH/FROM is expected and not circular
      -- it marks that experimental grounding exists on the target itself (PMID:21909421). The term
      is not redundant with the more specific `transcription coactivator activity` accepted below,
      because FUS also acts as a corepressor: it binds and inhibits CBP/p300 histone acetyltransferase
      activity at the CCND1 promoter in response to DNA damage (PMID:18509338), and represses AR-mediated
      transcription with SAFB1 (PMID:27731383). Only the coregulator term covers both directions.
    supported_by:
    - reference_id: PMID:18509338
      supporting_text: >-
        Here we show that an RNA-binding protein, TLS (for translocated in liposarcoma), serves as
        a key transcriptional regulatory sensor of DNA damage signals that, on the basis of its allosteric
        modulation by RNA, specifically binds to and inhibits CREB-binding protein (CBP) and p300
        histone acetyltransferase activities on a repressed gene target, cyclin D1 (CCND1) in human
        cell lines
      reference_section_type: ABSTRACT
    - reference_id: PMID:27731383
      supporting_text: >-
        They coordinately regulated the alternative splicing and repressed AR -mediated transcription
        in vitro.
      reference_section_type: DISCUSSION
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        DNA/RNA-binding protein that plays a role in various cellular processes such as transcription
        regulation, RNA splicing, RNA transport, DNA repair and damage response
- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:21909421
  qualifier: enables
  review:
    summary: >-
      Endogenous FUS co-immunoprecipitates with the androgen receptor in LNCaP cells, is recruited
      to the PSA enhancer, transactivates when tethered to a basal promoter, and is required for full
      AR activity.
    action: ACCEPT
    reason: >-
      A complete coactivator case on the endogenous protein: partner, chromatin occupancy at a defined
      response element, intrinsic transactivation in a GAL4 assay, and loss- and gain-of-function
      effects on target-gene output. Independently corroborated by PMID:27731383, which finds FUS
      and SAFB1 acting together on AR.
    supported_by:
    - reference_id: PMID:21909421
      supporting_text: >-
        Chromatin immunoprecipitation experiments showed that FUS was recruited to ARE III of the
        enhancer region of the PSA gene.
      reference_section_type: ABSTRACT
    - reference_id: PMID:21909421
      supporting_text: >-
        FUS displayed a strong intrinsic transactivation capacity in prostate cancer cells when tethered
        to basal promoters using the GAL4 system.
      reference_section_type: ABSTRACT
    - reference_id: PMID:21909421
      supporting_text: >-
        Thus, FUS is a novel co-activator of AR in prostate cancer cells.
      reference_section_type: ABSTRACT
