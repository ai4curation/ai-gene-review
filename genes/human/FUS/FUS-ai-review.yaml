      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0008380
    label: RNA splicing
  evidence_type: IDA
  original_reference_id: PMID:26124092
  qualifier: involved_in
  review:
    summary: >-
      Splicing fails in the coupled transcription-splicing system unless FUS is present during the
      transcription reaction, because FUS is what delivers U1 snRNP to the polymerase.
    action: ACCEPT
    reason: >-
      FUS does part of the work of splicing rather than merely being needed near it: it supplies the
      RNAP II-U1 snRNP bridge that commitment-complex formation depends on, and removing FUS abolishes
      both the bridge and the splicing. That is the cofactor/scaffold form of participation, so `involved_in
      RNA splicing` is right. UniProt reads the same paper the same way.
    supported_by:
    - reference_id: PMID:26124092
      supporting_text: >-
        we found that FUS must be present during the transcription reaction in order for splicing
        to occur
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:26124092
      supporting_text: >-
        we found that U1 snRNP does not interact with RNAP II in FUS knockdown extracts
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: file:human/FUS/FUS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Binds to nascent pre-mRNAs and acts as a molecular mediator between RNA polymerase II and
        U1 small nuclear ribonucleoprotein thereby coupling transcription and splicing
