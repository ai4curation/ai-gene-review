    summary: Signaling receptor binding to AMHR2, from mapping the AMH-binding surface of the receptor.
      An experimental row on a general term; modified to the type II receptor term.
    action: MODIFY
    reason: AMH binds its dedicated type II receptor AMHR2 [PMID:34155118 "AMH is a member of the transforming
      growth factor beta (TGF-β) family, which has evolved to signal through its own dedicated type II
      receptor, AMH receptor type II (AMHR2)."], shown structurally [PMID:34155118 "we solved the X-ray
      crystal structure of AMH bound to the extracellular domain of AMHR2 to a resolution of 2.6Å."] and
      biochemically after proprotein cleavage [PMID:20861221 "Here we show that anti-Müllerian hormone
      (AMH), a TGF-β family ligand involved in reproductive development, must be cleaved to bind its type
      II receptor (AMHRII), but dissociation of the pro-region from the mature C-terminal dimer is not
      required for this initial interaction."]. AMHR2 is a type II TGF-beta family receptor, so GO:0005114
      is the specific term. [PMID:14750901 "AMH and its type II receptor (AMHR-II) are involved in the
      regression of the Müllerian ducts in the male embryo, and in gonadal functions in the adult."]
