- id: PMID:14750901
  title: 'The anti-Müllerian hormone type II receptor: insights into the binding domains recognized by
    a monoclonal antibody and the natural ligand.'
  findings:
  - statement: AMH and AMHR2 act in Müllerian regression and adult gonadal function.
    supporting_text: AMH and its type II receptor (AMHR-II) are involved in the regression of the Müllerian
      ducts in the male embryo, and in gonadal functions in the adult.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Maps the AMH-binding surface of AMHR2.
- id: PMID:20861221
  title: Processing of anti-mullerian hormone regulates receptor activation by a mechanism distinct from
