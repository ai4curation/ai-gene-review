    label: ovarian follicle development
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P27106
  review:
    summary: Ovarian follicle development, by similarity. A directionless parent of the accepted negative-regulation
      rows, which carry AMH's actual role; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Besides duct regression, AMH regulates folliculogenesis in women [PMID:34155118 "Anti-Müllerian
      hormone (AMH), or Müllerian-inhibiting substance, is a protein hormone that promotes Müllerian duct
      regression during male fetal sexual differentiation and regulation of folliculogenesis in women."];
      its restraint of follicle recruitment is established mainly in rodents. AMH restrains follicle development
      rather than driving it, which the negative-regulation term (accepted, core) states and this parent
      does not.
    supported_by:
    - reference_id: PMID:34155118
      supporting_text: Anti-Müllerian hormone (AMH), or Müllerian-inhibiting substance, is a protein hormone
        that promotes Müllerian duct regression during male fetal sexual differentiation and regulation
        of folliculogenesis in women.
