id: P03971
gene_symbol: AMH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMH (anti-Müllerian hormone, Müllerian-inhibiting substance) is a secreted homodimeric glycoprotein
  hormone of the TGF-beta superfamily. It is made as a precursor whose cleavage frees a C-terminal TGF-beta-like
  domain that stays non-covalently bound to the large N-terminal prodomain until the complex engages the
  receptor. AMH signals through its own dedicated type II receptor, AMHR2, together with shared type I
  BMP receptors, activating SMAD signalling. In the male fetus, AMH from Sertoli cells causes regression
  of the Müllerian ducts, which would otherwise form the uterus, oviducts and upper vagina, as part of
  male sex differentiation. In females, AMH made by granulosa cells of growing follicles restrains follicle
  recruitment and growth, and its serum level is used clinically as a marker of ovarian reserve.
