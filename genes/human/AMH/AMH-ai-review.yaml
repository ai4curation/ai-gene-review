- id: PMID:3754790
  title: Isolation of the bovine and human genes for Müllerian inhibiting substance and expression of
    the human gene in animal cells.
  findings:
  - statement: Recombinant human MIS/AMH causes Müllerian duct regression in vitro.
    supporting_text: Animal cells transfected with the human gene secrete biologically active MIS, which
      causes regression of the rat Müllerian duct in vitro.
  - statement: AMH has a TGF-beta-like C-terminal domain.
    supporting_text: A comparison of the bovine and human MIS proteins reveals a highly conserved C-terminal
      domain that shows marked homology with human transforming growth factor-beta
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Cloning of human AMH.
- id: PMID:2974034
  title: Proteolytic processing of mullerian inhibiting substance produces a transforming growth factor-beta-like
    fragment.
  findings:
  - statement: MIS causes Müllerian duct regression.
    supporting_text: Mullerian inhibiting substance (MIS) is a differentiation factor that causes the
      Mullerian duct to regress during the development of the male reproductive tract.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Proteolytic processing to the TGF-beta-like form.
- id: PMID:12834017
  title: Sexual differentiation.
  findings:
  - statement: Sex determination precedes sex differentiation.
    supporting_text: Male or female phenotype develops through a cascade of processes which initiate with
      sex determination and follow with sex differentiation.
  - statement: Sertoli-cell AMH removes female internal genitalia.
    supporting_text: Antimullerian hormone (AMH) secreted by Sertoli cells inhibits the development of
      female internal genitalia
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Review; basis for modifying sex determination to male sex differentiation.
- id: PMID:14695376
  title: Requirement of Lim1 for female reproductive tract development.
  findings:
