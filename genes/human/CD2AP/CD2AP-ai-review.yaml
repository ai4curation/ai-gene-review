    label: actin cytoskeleton
  evidence_type: TAS
  original_reference_id: PMID:10339567
  qualifier: located_in
  review:
    summary: Actin-cytoskeleton association is a central location for CD2AP.
    action: ACCEPT
    reason: The original colocalization evidence is corroborated by direct filament binding and human
      recombinant capping. This component identifies where the molecular functions act rather than inferring
      a motor, polymerase or GAP activity.
