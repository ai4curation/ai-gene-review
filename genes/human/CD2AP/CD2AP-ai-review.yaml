- term:
    id: GO:0065003
    label: protein-containing complex assembly
  evidence_type: TAS
  original_reference_id: PMID:10339567
  qualifier: involved_in
  review:
    summary: CD2AP performs physical work in protein-complex assembly.
    action: ACCEPT
    reason: The original paper demonstrates distinct partner-binding regions and homotypic interactions,
      while the human epithelial study directly identifies CD2AP-associated junctional assemblies. CD2AP
      supplies the organizing contacts rather than merely being a required downstream substrate. No additional
      redundant NEW assembly process is needed.
    additional_reference_ids:
    - PMID:22891260
    - PMID:23090967
    supported_by:
    - reference_id: PMID:10339567
