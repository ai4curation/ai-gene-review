id: Q9Y5K6
gene_symbol: CD2AP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD2AP is a multivalent cytoplasmic adaptor that connects membrane-associated protein complexes
  with the actin cytoskeleton. Its three SH3 domains, proline-rich regions and C-terminal interaction
  region organize selected receptor, trafficking and junctional partners. Full-length human CD2AP also
  binds actin filaments and caps their barbed ends in reconstitution experiments, providing a mechanism
  for stabilizing junctional actin. This activity is distinct from binding and regulating heterodimeric
  actin-capping protein through its CPI motif. CD2AP contributes to epithelial junction organization and
  to podocyte cytoskeletal integrity; its effects on migration and signaling depend on the cellular context
  and associated proteins. Human loss-of-function variants are associated with glomerular disease.
