    label: substrate-dependent cell migration, cell extension
  evidence_type: TAS
  original_reference_id: PMID:10339567
  qualifier: involved_in
  review:
    summary: Cell extension and substrate-dependent migration are contextual CD2AP outcomes.
    action: KEEP_AS_NON_CORE
    reason: The original human CMS expression study changes cytoskeletal arrangement and cell extension.
      Later junctional experiments show that CD2AP can restrain migration by stabilizing adhesion. Retain
      this broad TAS without imposing uniformly promigratory action or duplicating migration ancestors
      in the core synthesis.
    additional_reference_ids:
    - PMID:24322428
- term:
