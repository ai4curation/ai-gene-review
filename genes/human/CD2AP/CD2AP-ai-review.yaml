core_functions:
- molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  description: CD2AP uses distinct SH3 and proline-rich interaction regions to organize selected membrane-associated
    and junctional protein assemblies. It binds SH3-containing partners through its own proline-rich regions
    and recognizes other proline-rich partners through its SH3 domains. In epithelial complexes it helps
    position actin regulators, including SH3BP1 and CapZ; SH3BP1 supplies GAP catalysis. These dynamic
    organizing interactions do not imply one invariant complex stoichiometry.
  directly_involved_in:
  - id: GO:0065003
    label: protein-containing complex assembly
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0001726
    label: ruffle
  - id: GO:0031252
    label: cell leading edge
  - id: GO:0070161
    label: anchoring junction
  supported_by:
  - reference_id: PMID:10339567
  - reference_id: PMID:22891260
    supporting_text: "both were required for normal Cdc42 signaling and junction \nformation"
  - reference_id: PMID:23090967
    supporting_text: 'CD2AP functions to facilitate the recruitment of actin

      capping protein'
- molecular_function:
    id: GO:0051015
    label: actin filament binding
  description: CD2AP directly binds actin filaments. Full-length human recombinant protein caps barbed
    ends and suppresses both addition and loss of actin subunits, whereas a C-terminal truncation retains
    filament binding without the full capping activity. Junctional experiments connect this stabilization
    with cytoskeletal structural integrity. Binding and allosteric regulation of heterodimeric capping
    protein by CD2AP CPI-region fragments is a distinct, construct-dependent mechanism and does not negate
    the full-length protein’s own capping activity.
  directly_involved_in:
  - id: GO:0007015
    label: actin filament organization
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  - id: GO:0005884
    label: actin filament
  - id: GO:0005911
    label: cell-cell junction
  supported_by:
  - reference_id: PMID:12217865
  - reference_id: PMID:24322428
    supporting_text: CD2AP inhibits actin polymerization and depolymerization by capping actin barbed
      ends
  - reference_id: PMID:16707503
  - reference_id: PMID:20625546
proposed_new_terms: []
suggested_questions:
- question: How do full-length CD2AP barbed-end capping and its CPI-mediated regulation of heterodimeric
    capping protein change with phosphorylation, partner occupancy and native junctional concentration?
  experts:
  - Actin dynamics and epithelial junction specialists
- question: Which CD2AP domain interactions stabilize native human podocyte slit-diaphragm architecture,
    and how do those mechanisms differ between biallelic loss and heterozygous susceptibility variants?
  experts:
  - Podocyte cell biologists
  - Renal genetics specialists
- question: Which original mouse donor experiments establish nuclear-envelope lumen, podosome, growth-cone
    and neuromuscular-junction localization or synapse organization, as distinct from perinuclear cytoplasm
    and broader neuronal effects?
  experts:
  - GO cellular-component curators
  - Neuronal cytoskeleton specialists
suggested_experiments:
- description: Compare matched full-length human CD2AP, the filament-binding C-terminal truncation and
    CPI/interface mutants in purified barbed-end assays and epithelial rescue experiments, measuring filament
    turnover, CP occupancy, spatial Cdc42 activity and junctional resistance to mechanical stress.
  hypothesis: Direct end capping and partner-mediated actin regulation are separable contributions whose
    balance depends on CD2AP domain context.
  experiment_type: Purified reconstitution with matched cellular rescue
