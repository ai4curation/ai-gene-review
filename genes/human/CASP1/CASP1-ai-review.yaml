id: P29466
gene_symbol: CASP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CASP1 (caspase-1; interleukin-1 beta converting enzyme, ICE) is the prototypical inflammatory
  caspase, a cysteine-dependent aspartate-specific endopeptidase of the clan CD peptidase family. It is
  expressed mainly in monocytes, macrophages and other immune cells and is synthesized as an inactive
  cytosolic zymogen comprising an N-terminal caspase-recruitment domain (CARD), a large (p20) catalytic
  subunit bearing the His/Cys catalytic dyad, an interdomain linker, and a small (p10) subunit. The active
  enzyme is a heterotetramer of two antiparallel p20/p10 heterodimers. Caspase-1 is the effector protease
  of canonical inflammasomes: cytosolic pattern-recognition receptors (NLRP1, NLRP3, NLRC4/NAIP, AIM2,
  pyrin) assemble, directly or through the bipartite adaptor ASC/PYCARD, into platforms that cluster procaspase-1
  via homotypic CARD-CARD interactions, driving proximity-induced autoproteolysis and activation. Once
  active, caspase-1 cleaves the precursors of the proinflammatory cytokines interleukin-1 beta and interleukin-18
  into their mature, secreted, receptor-binding forms, and cleaves gasdermin-D to release its pore-forming
  N-terminal fragment, which permeabilizes the plasma membrane to drive the lytic, proinflammatory cell
  death pyroptosis and the release of mature IL-1 family cytokines. Caspase-1 also processes additional
  substrates (including caspase-7, cGAS, sphingosine kinase 2 and ZNFX1) and contributes to apoptosis
  in some overexpression and disease contexts. It acts in the cytosol and is central to innate immune
  defense against microbial infection and to the pathology of autoinflammatory diseases.'
