- term:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:96544
  - PANTHER:PTN008720308
  - UniProtKB:P29466
  review:
    summary: 'Core molecular function: CASP1 is a cysteine-dependent, Asp-specific endopeptidase, the
      effector protease of inflammasomes.'
    action: ACCEPT
    reason: Extensively supported by direct assays and the phylogenetic IBA. CASP1 was purified and cloned
      as a heterodimeric cysteine protease that matures pro-IL-1beta, and its catalytic residues (His237/Cys285)
      and p20/p10 architecture are established. This is the defining activity of the gene product.
    supported_by:
    - reference_id: PMID:1574116
      supporting_text: A novel heterodimeric cysteine protease is required for interleukin-1 beta processing
        in monocytes
    - reference_id: PMID:32109412
      supporting_text: 'The pyroptosis execution protein GSDMD is cleaved by inflammasome-activated

        caspase-1'
