existing_annotations:
- term:
    id: GO:0002221
    label: pattern recognition receptor signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:21918512
  qualifier: involved_in
  review:
    summary: CASP1 is the effector protease downstream of pattern-recognition receptors, not itself a
      PRR.
    action: MODIFY
    reason: These NAS annotations place CASP1 in PRR signalling because inflammasomes act downstream of
      cytosolic PRRs. CASP1 does not bind a PAMP/DAMP; it is the terminal protease of the inflammasome.
      The precise term is inflammasome-mediated signaling pathway (GO:0141084), whose definition is "starts
      with a ligand binding to a PRR, assembly of the inflammasome complex, leading to the activation
      of CASP1".
    supported_by:
    - reference_id: PMID:29196474
      supporting_text: Inflammasome activation and assembly at a glance
    proposed_replacement_terms:
    - id: GO:0141084
      label: inflammasome-mediated signaling pathway
