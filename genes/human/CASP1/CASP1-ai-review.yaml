core_functions:
- description: 'Cysteine-type endopeptidase (ICE) activity: the inflammasome effector protease. Procaspase-1
    is clustered and autoactivated through CARD-CARD interactions, then cleaves its physiological substrates
    after an Asp (YVAD consensus) using the His237/Cys285 catalytic dyad.'
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0140447
    label: cytokine precursor processing
  in_complex:
    id: GO:0061702
    label: canonical inflammasome complex
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1574116
    supporting_text: A novel heterodimeric cysteine protease is required for interleukin-1 beta processing
      in monocytes
  - reference_id: PMID:32051255
    supporting_text: 'pro-caspase-1 IDL cleavage is necessary for pyroptosis induced by both

      ASC-dependent and ASC-independent inflammasomes'
- description: 'Maturation of the proinflammatory cytokines IL-1 beta and IL-18: caspase-1 cleaves pro-IL-1
    beta (at Asp116-Ala117) and pro-IL-18 (at Asp36-Tyr37) to their active, secreted, receptor-binding
    forms. This is the defining physiological output of caspase-1.'
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0032731
    label: positive regulation of interleukin-1 beta production
  - id: GO:0032741
    label: positive regulation of interleukin-18 production
  - id: GO:0140448
    label: signaling receptor ligand precursor processing
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:2787508
    supporting_text: mutation of Asp116----Ala116 rendered the IL-1 beta precursor resistant to cleavage
      by the processing activity
  - reference_id: PMID:9334240
    supporting_text: 'caspase-1, which

      cleaves prohIL-18 at the Asp36-Tyr37 site to generate the mature hIL-18'
- description: Cleavage of gasdermin-D to execute pyroptosis. Autoprocessed caspase-1 engages full-length
    GSDMD through both its active site and an exosite that binds the GSDMD C-terminal domain, cleaving
    the interdomain linker to release the pore-forming N-terminal fragment that drives lytic, proinflammatory
    pyroptotic cell death and IL-1 cytokine release.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0141201
    label: pyroptotic cell death
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:26375003
    supporting_text: Caspase-1 and caspase-4/5/11 specifically cleaved the linker between the amino-terminal
      gasdermin-N and carboxy-terminal gasdermin-C domains in GSDMD, which was required and sufficient
      for pyroptosis
  - reference_id: PMID:32553275
    supporting_text: 'This "exosite" interface

      endows an additional function for the GSDMD C-terminal domain as a caspase-recruitment module'
- description: 'CARD-mediated recruitment and self-assembly: the caspase-1 CARD engages activators (directly
    for NLRC4/CARD8, or via the ASC adaptor for NLRP3/AIM2/pyrin) and polymerizes into a filament, enabling
    proximity-induced autoprocessing of the zymogen into the active p20/p10 enzyme.'
  molecular_function:
    id: GO:0050700
    label: CARD domain binding
  directly_involved_in:
  - id: GO:0016540
    label: protein autoprocessing
  in_complex:
    id: GO:0061702
    label: canonical inflammasome complex
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:24630722
    supporting_text: ASC thus nucleates CARD filaments of caspase-1, leading to proximity-induced activation
  - reference_id: PMID:27043298
    supporting_text: we determined the structure of the human caspase-1 CARD domain (caspase-1(CARD))
      filament by cryo-electron microscopy
suggested_questions:
- question: Beyond IL-1 beta, IL-18 and GSDMD, which caspase-1 substrates (e.g. cGAS, caspase-7, SPHK2,
    ZNFX1) are cleaved at physiological enzyme levels in vivo versus only on overexpression, and what
    is the biological weight of each?
- question: What distinguishes the ASC-dependent (NLRP3/AIM2) from the ASC-independent (NLRC4/CARD8) mode
    of caspase-1 activation in terms of cytokine-maturation versus pyroptosis output?
- question: Which of the catalytically inactive splice isoforms (delta, epsilon) act as endogenous dominant-negative
    regulators of caspase-1 in human cells, and under what conditions?
suggested_experiments:
- description: Degradomics (N-terminomics / TAILS) in primary human macrophages with inflammasome activation,
    comparing CASP1-knockout and catalytically dead (C285A) reconstitution, to define the physiological
    caspase-1 substrate repertoire at endogenous enzyme levels.
- description: Separation-of-function reconstitution of CASP1 variants defective in GSDMD-exosite binding
    versus cytokine cleavage, to test independently the contributions of pyroptosis and IL-1/IL-18 maturation
    to host defense and autoinflammation.
