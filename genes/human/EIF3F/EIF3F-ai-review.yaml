- term:
    id: GO:0140492
    label: metal-dependent deubiquitinase activity
  evidence_type: IDA
  original_reference_id: PMID:21124883
  qualifier: enables
  review:
    summary: Generalize the positive human DUB assay without claiming a metal mechanism.
    action: MODIFY
    reason: The original directly reports cleavage by human GST-full-length EIF3F and an MPN fragment
      in bacterial extracts; mouse active-probe, mutant and rescue experiments are separate. UniProt curates
      activated NOTCH1 deubiquitination and a requirement for DTX1 association from PMID:21124883. In
      that study, partial depletion of endogenous human EIF3F increased ubiquitinated murine activated
      Notch constructs, with rescue by murine wild-type but not the MPN mutant; DTX1 enabled the observed
      Notch-eIF3f association. These are positive cellular findings supporting the curated Notch context.
      The authors leave the precise monoubiquitinated Notch substrate form unresolved and retain an associated-DUB
      caveat. The inspected Methods and figure panels support DUB activity but contain no purified human
      metal-dependence experiment. GO:0101005 retains the activity while leaving its metal or thiol mechanism
      unassigned.
    supported_by:
    - reference_id: PMID:21124883
    proposed_replacement_terms:
    - id: GO:0101005
      label: deubiquitinase activity
