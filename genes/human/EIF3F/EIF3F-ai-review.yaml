id: O00303
gene_symbol: EIF3F
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF3F is an MPN-domain subunit of the cytosolic eukaryotic translation initiation factor
  3 (eIF3) complex. It contacts eIF3H and eIF3M within the assembly and contributes to the formation and
  function of translation preinitiation complexes. Its reported deubiquitinase activity has been linked
  to DTX1-associated regulation of activated NOTCH1; the catalytic mechanism remains incompletely defined.
