    label: formation of cytoplasmic translation initiation complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000106280
  review:
    summary: The rule supports initiation more broadly than the large-subunit joining step.
    action: MODIFY
    reason: UR000106280 genuinely applies to the human HAMAP MF_03005 record and emits this term. However,
      GO:0001732 specifically describes large-subunit joining and initiation-factor release. The experimentally
      supported EIF3F contribution is assembly and function of eIF3-containing preinitiation complexes;
      the rule does not independently establish an EIF3F-specific role at that later joining step. Use
      cytoplasmic translational initiation without denying the literal rule output.
    supported_by:
    - reference_id: GO_REF:0000104
    - reference_id: PMID:17581632
    - reference_id: PMID:18599441
    proposed_replacement_terms:
