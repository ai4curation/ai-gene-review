  review:
    summary: hNR1 cRNA injected into oocytes gave currents activated by glutamate or NMDA in the presence of glycine.
    action: REMOVE
    reason: The full text was read. Every experiment is two-electrode voltage clamp of oocytes injected with hNR1
      cRNA alone; there is no ligand-binding assay. Glutamate sensitivity is a dose-response curve of current (EC50
      3.7 uM) fitted to a binding isotherm, and the currents were small (4 to 60 nA). The paper itself notes that
      NR1 co-expressed with NR2 subunits gives about 100-fold larger currents. Later structural and mutagenesis
      work shows that the GluN1 ligand-binding domain binds glycine or D-serine and that glutamate binds the GluN2
      subunit; the glutamate sensitivity of oocytes expressing NR1 alone is generally attributed to an endogenous
      Xenopus GluN2 partner. The receptor complex responds to glutamate, which the NMDA receptor activity term already
      records; the binding term on GluN1 itself is not supported.
