    supporting_text: NMDA receptors require both glycine and glutamate for activation with NR1 and NR2 forming glycine
      and glutamate sites, respectively
  - reference_id: PMID:28105280
    supporting_text: The N-methyl-d-aspartate receptor (NMDAR) is an ionotropic glutamate receptor, gated by the
      endogenous coagonists glutamate and glycine, permeable to Ca2+ and Na+
  - reference_id: PMID:17047094
