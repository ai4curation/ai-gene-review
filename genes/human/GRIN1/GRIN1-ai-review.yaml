id: Q05586
gene_symbol: GRIN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN1 encodes GluN1, the obligatory subunit of NMDA-type ionotropic glutamate receptors. Two GluN1
  subunits assemble with two GluN2 (A-D) and/or GluN3 (A-B) subunits into a heterotetrameric cation channel in the
  neuronal plasma membrane, concentrated in the postsynaptic density of excitatory synapses on dendritic spines.
  GluN1 binds the co-agonist glycine or D-serine, while GluN2 subunits bind glutamate; opening of GluN1/GluN2 channels
  also requires depolarisation to relieve voltage-dependent Mg2+ block, so the receptor detects coincident pre-
  and postsynaptic activity. The open channel conducts Na+, K+ and Ca2+, and the calcium influx triggers long-term
  changes in synaptic strength that underlie learning and memory. With GluN3 subunits, GluN1 instead forms glycine-gated
  cation channels with low calcium permeability. Its C-terminal tail binds calmodulin. De novo and biallelic GRIN1
  variants cause a neurodevelopmental disorder with intellectual disability, movement abnormalities and seizures.
