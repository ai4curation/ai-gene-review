- term:
    id: GO:0001540
    label: amyloid-beta binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35439
  review:
    summary: Transferred from rat GluN1 (PMID:17308309), where an antibody to the NR1 extracellular domain reduced
      binding of amyloid-beta oligomers to neurons and the oligomers co-immunoprecipitated with NMDA receptor subunits.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The donor study does not show that GluN1 itself binds amyloid-beta: the authors conclude only that
      the oligomers bind to or near NMDA receptors. A direct binding function for GluN1 goes beyond that evidence.'
    supported_by:
    - reference_id: PMID:17308309
      supporting_text: ADDLs bind to or in close proximity to NMDA-Rs, triggering neuronal damage through NMDA-R-dependent
        calcium flux
- term:
    id: GO:0004972
    label: NMDA glutamate receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - FB:FBgn0010399
  - PANTHER:PTN001451205
  - UniProtKB:Q05586
  review:
    summary: PAINT places NMDA receptor activity at PTN001451205, the GluN1 clade, seeded by fly Nmdar1 and by human
      GRIN1 itself.
    action: ACCEPT
    reason: 'GluN1 is the obligatory glycine-binding subunit of every NMDA receptor, so the human protein sits inside
      the clade that inherited the activity and has its own experimental grounding (PMID:7679115, PMID:7685113).
      The contributes_to form is the accurate one: the channel needs a GluN2 partner.'
    supported_by:
    - reference_id: file:human/GRIN1/GRIN1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Component of N-methyl-D-aspartate (NMDA) receptors (NMDARs) that function as heterotetrameric,
        ligand-gated cation channels with high calcium permeability and voltage-dependent block by Mg(2+)
    - reference_id: PMID:7679115
      supporting_text: Expression in Xenopus oocytes demonstrated that the single protein encoded by the cloned
        cDNA possesses the electrophysiological and pharmacological properties characteristic of the NMDA receptor,
        including Ca2+ permeability, voltage-dependent Mg2+ block, and inhibition by selective antagonists such
        as Zn2+ and channel blockers
