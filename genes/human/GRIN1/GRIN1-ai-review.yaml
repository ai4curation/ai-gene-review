- question: Where and when do glycine-gated GluN1/GluN3 receptors operate in the human brain, and what fraction
    of GluN1 is assembled into them rather than into GluN2-containing receptors?
- question: Do presynaptic GluN1-containing receptors exist at human cortical and hippocampal synapses, and are
    they ionotropic there?
- question: Was the sodium channel activity annotation from PMID:21376300 based on direct recordings of sodium current,
    and was glutamate binding in PMID:7685113 measured by ligand binding or inferred from currents?
- question: Should the mouse Grin1 annotation to propylene metabolic process (PMID:21795692) be corrected at source,
    so that it stops propagating to orthologs?
suggested_experiments:
- hypothesis: Glycine-gated GluN1/GluN3A receptors contribute a measurable tonic excitatory conductance in human
    neurons.
  description: Record glycine-evoked currents in human iPSC-derived cortical neurons and in resected human cortical
    tissue in the presence of glycine-receptor and GluN2-selective blockers, with and without the GluN1 glycine-site
    antagonist CGP-78608 (which unmasks GluN1/GluN3A currents), and after GRIN3A knockdown.
  experiment_type: patch-clamp electrophysiology with pharmacology and knockdown
- hypothesis: Amyloid-beta oligomers do not bind GluN1 directly but associate with a neighbouring surface protein.
  description: Measure binding of defined amyloid-beta oligomer preparations to purified human GluN1-GluN2B receptors
    reconstituted in nanodiscs by surface plasmon resonance, and compare oligomer binding to neurons with and without
    acute GluN1 depletion.
  experiment_type: in vitro binding assay with purified receptor
