    supporting_text: Component of N-methyl-D-aspartate (NMDA) receptors (NMDARs) that function as heterotetrameric,
      ligand-gated cation channels with high calcium permeability and voltage-dependent block by Mg(2+)
- description: The ligand-binding domain of GluN1 binds the co-agonist glycine (or D-serine). Occupancy of this
    site is required, together with glutamate binding to GluN2, for the channel to open.
  molecular_function:
