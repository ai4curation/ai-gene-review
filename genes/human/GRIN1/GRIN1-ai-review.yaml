core_functions:
- description: GluN1 is an obligatory, pore-forming subunit of the NMDA receptor. Together with GluN2 subunits it
    forms a glutamate- and glycine-gated cation channel that is blocked by Mg2+ at resting potential and conducts
    calcium when open. At excitatory synapses this current contributes the slow component of the postsynaptic response
    and supplies the calcium signal that induces synaptic plasticity.
  contributes_to_molecular_function:
    id: GO:0004972
    label: NMDA glutamate receptor activity
  directly_involved_in:
  - id: GO:0035235
    label: ionotropic glutamate receptor signaling pathway
  - id: GO:0098976
    label: excitatory chemical synaptic transmission
  - id: GO:0097553
    label: calcium ion transmembrane import into cytosol
  - id: GO:0060079
    label: excitatory postsynaptic potential
  - id: GO:0048167
    label: regulation of synaptic plasticity
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  - id: GO:0043197
    label: dendritic spine
  in_complex:
    id: GO:0017146
    label: NMDA selective glutamate receptor complex
  supported_by:
  - reference_id: PMID:7679115
    supporting_text: Expression in Xenopus oocytes demonstrated that the single protein encoded by the cloned cDNA
      possesses the electrophysiological and pharmacological properties characteristic of the NMDA receptor, including
      Ca2+ permeability, voltage-dependent Mg2+ block, and inhibition by selective antagonists such as Zn2+ and
      channel blockers
  - reference_id: PMID:7685113
    supporting_text: Expressed hNR1 homomeric receptor channels exhibit the high Ca2+ permeability characteristic
      of neuronal NMDA receptors
  - reference_id: PMID:28228639
    supporting_text: GluN1-G620R/GluN2A complexes showed a mild reduction in trafficking, a ~2-fold decrease in
      glutamate and glycine potency, a strong decrease in sensitivity to Mg2+ block
  - reference_id: PMID:34321660
    supporting_text: we describe the cryo-electron microscope structures of human GluN1-GluN2A and GluN1-GluN2B
      NMDA receptors in complex with S-ketamine, glycine and glutamate
  - reference_id: PMID:15317856
    supporting_text: The most severe deficit was observed in the postsynaptic density (PSD) fraction
  - reference_id: PMID:8980238
    supporting_text: Adult mice lack NMDA receptor-mediated synaptic currents and long-term potentiation in the
      CA1 synapses and exhibit impaired spatial memory but unimpaired nonspatial learning
  - reference_id: file:human/GRIN1/GRIN1-uniprot.txt
