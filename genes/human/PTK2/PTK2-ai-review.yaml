  - reference_id: PMID:14676198
    supporting_text: N-WASP is phosphorylated by FAK at a conserved tyrosine residue, Tyr(256)
  - reference_id: PMID:12391143
    supporting_text: Autophosphorylation of FAK on Tyr-397 is a critical event, allowing binding of Src family kinases
      and activation of signal transduction pathways
  - reference_id: PMID:9636140
    supporting_text: tyrosine phosphorylation of paxillin and FAK elicited by stimulation of muscarinic m3 receptors
      with the acetylcholine analog carbachol is inhibited by soluble peptides containing the arginine-glycine-aspartate
      motif
  - reference_id: PMID:19525103
    supporting_text: FAK is in a unique signaling position to modulate RhoGTPase activity in space and time, thereby
      affecting various steps (integrin activation, leading edge formation, FA turnover, and trailing edge retraction)
      needed for efficient directional cell migration
  - reference_id: PMID:20479219
    supporting_text: bona fide FAK are only present in Metazoa and C. owczarzaki
- description: Phosphotyrosine scaffold for SH2-domain proteins. Autophosphorylated Tyr397 docks the Src SH2 domain
    to form the FAK-Src dual kinase complex. Further phosphotyrosines such as Tyr925 bind the GRB2 SH2 domain, and
    the Tyr397 site also brings in p120RasGAP and PI3K, coupling integrins to Ras/MAPK and PI3K/Akt signalling.
  molecular_function:
