id: Q05397
gene_symbol: PTK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTK2 encodes focal adhesion kinase (FAK), a cytoplasmic non-receptor protein tyrosine kinase with
  an N-terminal FERM domain, a central kinase domain, proline-rich regions and a C-terminal focal adhesion targeting
  (FAT) domain. Integrin engagement, and also growth factor and G protein-coupled receptor signalling, triggers
  autophosphorylation of Tyr397, which creates an SH2 docking site for Src family kinases. Src then phosphorylates
  the FAK activation loop and further sites that recruit Grb2, PI3K and p120RasGAP, forming a dual FAK-Src kinase
  complex. FAK is targeted to focal adhesions through FAT domain binding to paxillin and talin. It phosphorylates
  substrates such as p130Cas/NEDD9 and N-WASP and controls Rho-family GTPase GEFs and GAPs, so it regulates focal
  adhesion assembly and turnover, cell spreading, directional migration, proliferation and anchorage-dependent survival.
  A smaller nuclear pool uses the FERM domain as a scaffold that promotes Mdm2-dependent p53 degradation. A kinase-dead
  C-terminal isoform (FRNK) inhibits FAK signalling. FAK is essential for mouse embryonic development, including
  vascular, cardiac and neural development. It is part of an integrin adhesome that predates animals: canonical
  FAK with the full domain set is present in the filasterean Capsaspora owczarzaki, which also uses integrin-based
  adhesion to a substrate, whereas the choanoflagellates examined lack canonical FAK and have only a FAK-related
  kinase domain.'
