suggested_questions:
- question: Does Capsaspora FAK localise to the integrin beta2/vinculin patches in adherent-stage filopodia, and
    is it activated (Tyr397-equivalent autophosphorylation) on fibronectin-coated substrate? This would show whether
    FAK acts at adhesions before animals.
- question: Choanoflagellates lack canonical FAK, and M. brevicollis has only a FAK-related kinase domain. Was FAK
    lost in choanoflagellates together with integrins and the IPP complex, and does the FAK-related kinase domain
    retain any adhesion-linked role?
- question: Which partner-specific interfaces (FAT-paxillin LD motifs, FAT-talin, FERM-integrin, pTyr397-Src SH2)
    are conserved in Capsaspora FAK and its adhesome partners? Which arose in animals?
- question: Is the JUN kinase binding annotation from PMID:10925297 a JAK/JNK mix-up? The abstract describes an
    indirect Jak2-FAK association via STAT3.
- question: GO has no MF term for binding of paxillin-family LD motifs, which is the main focal adhesion targeting
    mechanism of FAK, Pyk2 and related proteins. Would such a term be useful?
suggested_experiments:
- description: Generate a FAK knockout or a kinase-dead knock-in in Capsaspora owczarzaki and measure substrate
    adhesion, filopodial integrin patch formation and aggregation, to test whether FAK is required for integrin
    adhesion in a unicellular holozoan.
- description: Express recombinant Capsaspora FAK and test Tyr397-equivalent autophosphorylation, binding of Capsaspora
    Src SH2, and FAT binding to Capsaspora paxillin LD motifs, alongside human FAK.
- description: Phosphoproteomics of human FAK-null cells rescued with wild-type, kinase-dead or Y397F FAK, to separate
    the catalytic and scaffolding contributions to adhesion turnover.
