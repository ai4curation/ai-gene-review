- id: PMID:20479219
  title: Ancient origin of the integrin-mediated adhesion and signaling machinery.
  findings:
  - statement: Canonical FAK is found only in Metazoa and Capsaspora owczarzaki.
    supporting_text: bona fide FAK are only present in Metazoa and C. owczarzaki
  - statement: Capsaspora FAK has all the interaction domains of animal FAK.
    supporting_text: C. owczarzaki FAK have all of the functional domains involved in its protein–protein interactions
  - statement: Choanoflagellates lack canonical FAK; M. brevicollis has only a FAK-related tyrosine kinase domain.
    supporting_text: M. brevicollis has a gene encoding a tyrosine kinase domain that, by phylogenetic analysis,
      seems to be related to FAK
  - statement: The apusozoan Amastigomonas has most of the integrin adhesome but lacks FAK and c-Src.
    supporting_text: including all of the components of the canonical metazoan complex, except for the signaling
      molecules FAK and c-Src
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Source for presence of canonical FAK in Capsaspora and its absence (FAK-related
      kinase domain only) in M. brevicollis and Proterospongia.
- id: PMID:32857975
  title: Integrin-Mediated Adhesion in the Unicellular Holozoan Capsaspora owczarzaki.
  findings:
  - statement: Capsaspora adheres to substrate through actin-dependent filopodia during its adherent stage.
    supporting_text: during the adherent life stage, C. owczarzaki adheres to surfaces using actin-dependent filopodia
  - statement: Capsaspora integrin beta2 and vinculin form patches in filopodia; FAK was not examined.
    supporting_text: We show that integrin β2 and its associated protein vinculin localize as distinct patches in
      the filopodia
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Shows integrin/vinculin-based substrate adhesion in Capsaspora; does not test FAK.
core_functions:
- description: Non-receptor tyrosine kinase at integrin adhesions. Integrin clustering triggers FAK autophosphorylation
    at Tyr397. FAK then phosphorylates substrates such as p130Cas/NEDD9 and N-WASP, transducing outside-in integrin
    signals that control focal adhesion turnover and directional cell migration. Canonical FAK with these domains
    is present in Capsaspora, so this kinase-at-adhesions role probably predates animals, though it has not been
    tested outside animals.
