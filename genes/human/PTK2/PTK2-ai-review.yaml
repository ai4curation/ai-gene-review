- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: TAS
  original_reference_id: PMID:20552554
  qualifier: involved_in
  review:
    summary: angiogenesis (TAS, review PMID:20552554 on FAK in early development).
    action: KEEP_AS_NON_CORE
    reason: The review summarises knockout and conditional-knockout data placing FAK in development of the placenta
      and of cardiovascular and other organ systems. FAK acts here through its general integrin-signalling, adhesion-turnover
      and migration functions in the relevant cell types, so angiogenesis is a downstream, animal-specific developmental
      context rather than a core function.
    supported_by:
    - reference_id: PMID:20552554
      supporting_text: Various published data supported the role of the molecule in the development of the placenta,
        as well as of several organ systems, like the musculoskeletal, nervous, cardiovascular, genitourinary and
        respiratory organ systems
