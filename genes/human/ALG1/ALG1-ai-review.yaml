suggested_questions:
- question: Which native human ALG1 assemblies with ALG2 or ALG11 control reaction efficiency? Yeast interaction
    models and human heterologous rescue do not by themselves establish the composition or stoichiometry of a human
    complex.
- question: How do residual catalytic activity, membrane association and protein abundance jointly influence variant-specific
    ALG1-CDG severity? The 2016 yeast CPY assay did not rank patient clinical severity.
suggested_experiments:
- description: Extend the recombinant human ALG1 membrane-dependence assay in PMID:40328714 to clinically relevant
    variants in matched membrane reconstitution assays, measuring first mannose transfer, protein abundance
    and membrane association. Test ALG2 and ALG11 addition separately to distinguish intrinsic catalytic defects
    from changes in assembly or substrate transfer.
  hypothesis: Some variants alter membrane-supported catalysis or assembly without producing the same quantitative
    defect in heterologous growth and CPY glycosylation assays.
