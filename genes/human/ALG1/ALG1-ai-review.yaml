id: Q9BT22
gene_symbol: ALG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALG1 is an endoplasmic reticulum beta-1,4-mannosyltransferase that catalyzes the first mannose addition
  during dolichol-linked oligosaccharide assembly. It uses GDP-mannose to convert GlcNAc2-PP-dolichol to Man1GlcNAc2-PP-dolichol
  on the cytoplasmic face of the ER membrane, producing the substrate for ALG2. This catalytic step builds the glycan
  precursor subsequently transferred to proteins during N-linked glycosylation. Biallelic pathogenic variants cause
  ALG1-CDG, an autosomal recessive disorder with variable multisystem and neurodevelopmental manifestations, including
  severe early-lethal presentations.
