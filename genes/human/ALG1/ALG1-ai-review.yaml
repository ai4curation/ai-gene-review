core_functions:
- description: 'Chitobiosyldiphosphodolichol beta-mannosyltransferase (EC 2.4.1.142): using GDP-mannose as donor,
    ALG1 transfers the first mannose onto the chitobiose core GlcNAc2-PP-dolichol via a beta-1,4 linkage to form
    Man1GlcNAc2-PP-dolichol, the first mannosylation step of dolichol-linked oligosaccharide (LLO) assembly, on
    the cytoplasmic face of the ER membrane. The product is the substrate for ALG2, the next enzyme in the pathway.'
  molecular_function:
    id: GO:0004578
    label: chitobiosyldiphosphodolichol beta-mannosyltransferase activity
  directly_involved_in:
  - id: GO:0006488
    label: dolichol-linked oligosaccharide biosynthetic process
  - id: GO:0006487
    label: protein N-linked glycosylation
  locations:
  - id: GO:0098554
    label: cytoplasmic side of endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:14973778
    supporting_text: Incubation of fibroblast extracts with [(14)C]GlcNAc(2)-PP-dolichol and GDP-mannose indicated
      a severely reduced activity of the beta 1,4-mannosyltransferase, elongating GlcNAc(2)-PP-dolichol to Man(1)GlcNAc(2)-PP-dolichol
      at the cytosolic side of the endoplasmic reticulum.
  - reference_id: PMID:26931382
    supporting_text: while wild-type hALG1 cDNA fully restored both normal growth and full CPY glycosylation
  - reference_id: file:human/ALG1/ALG1-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Endoplasmic reticulum membrane'
