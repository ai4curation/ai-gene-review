- term:
    id: GO:0007288
    label: sperm axoneme assembly
  evidence_type: IMP
  original_reference_id: PMID:32791035
  qualifier: involved_in
  review:
    summary: >-
      Biallelic loss-of-function CFAP58 variants cause MMAF with disorganised axonemes; axonemal markers
      SPAG6 and SPEF2 are depleted, and a knock-in mouse shows failed central-pair assembly during spermiogenesis.
    action: ACCEPT
    reason: >-
      Core process. Human sperm TEM and marker loss (PMID:32791035), independent families with loss of
      the central pair (PMID:40675161), radial spoke damage (PMID:42799967), and mouse knockouts all point
      to a role in building the sperm axoneme. CFAP58 is itself a flagellar coiled-coil protein enriched
      in the flagellum during its formation, so it contributes structure to the process rather than acting
      only upstream; its precise structural position remains to be resolved.
    supported_by:
    - &id006
      reference_id: PMID:32791035
      supporting_text: >-
        Transmission electron microscopy demonstrated striking flagellar defects with axonemal and mitochondrial
        sheath malformations.
    - &id010
      reference_id: PMID:32791035
      supporting_text: >-
        the abundances of axoneme ultrastructure markers SPAG6 and SPEF2 and a mitochondrial sheath protein,
        HSP60, were significantly reduced in the spermatozoa from men harboring bi-allelic CFAP58 variants.
    - &id013
      reference_id: PMID:40675161
      supporting_text: >-
        the CFAP58 mutation disrupts CP assembly during spermiogenesis, leading to disorganization of
        axonemal proteins in both human and mouse sperm flagella.
