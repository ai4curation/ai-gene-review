core_functions:
- description: >-
    Flagellar coiled-coil protein, concentrated in the sperm midpiece, that is required during spermiogenesis
    for assembly of the sperm axoneme (central pair and radial spoke integrity) and of the midpiece mitochondrial
    sheath; loss causes MMAF and male infertility (SPGF49). Its molecular activity and exact structural
    position within the flagellum are unknown. Both assembly terms are listed because the requirement
    is flagellum-wide, not axoneme-only: CFAP58-deficient sperm show mitochondrial-sheath malformation
    and HSP60 depletion in the midpiece, where CFAP58 is concentrated, alongside the axonemal (central
    pair and radial spoke) defects, so sperm flagellum assembly (GO:0120316) covers a requirement that
    sperm axoneme assembly (GO:0007288) alone does not. Whether the midpiece contribution is direct
    or secondary to axonemal failure is unresolved, which is why sperm mitochondrial sheath assembly
    (GO:0120317) itself is kept as non-core.
  directly_involved_in:
  - id: GO:0007288
    label: sperm axoneme assembly
  - id: GO:0120316
    label: sperm flagellum assembly
  locations:
  - id: GO:0036126
    label: sperm flagellum
