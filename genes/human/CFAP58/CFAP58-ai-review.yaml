- term:
    id: GO:0120229
    label: protein localization to motile cilium
  evidence_type: IMP
  original_reference_id: PMID:32791035
  qualifier: involved_in
  review:
    summary: >-
      In sperm from men with biallelic CFAP58 variants, the axonemal markers SPAG6 and SPEF2 and the mitochondrial
      sheath protein HSP60 are reduced.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Reduced flagellar levels of other proteins in a mutant that fails to build the axoneme and mitochondrial
