id: Q5T655
gene_symbol: CFAP58
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFAP58 (cilia- and flagella-associated protein 58) is a testis-enriched coiled-coil protein of the mammalian
  sperm flagellum. In human and mouse sperm it is distributed along the entire flagellum and concentrated
  in the midpiece. It is required for spermiogenesis: loss of CFAP58 disrupts assembly of the sperm axoneme,
  including loss of the central pair, damage to radial spokes and depletion of axonemal proteins such
  as SPAG6 and SPEF2, and also causes mitochondrial sheath malformation in the midpiece and abnormal manchette
  organisation and sperm head shaping. In mice CFAP58 interacts with IFT88 and CCDC42 and has been proposed
  to stabilise cargo proteins during intramanchette and intraflagellar transport. In somatic cells mouse
  Cfap58 is found at the centrosome and supports primary cilium elongation, and its expression is repressed
  by Notch signalling. Biallelic loss-of-function variants cause spermatogenic failure 49, a male infertility
  with asthenoteratozoospermia and multiple morphological abnormalities of the sperm flagellum, which
  can be overcome by intracytoplasmic sperm injection.
