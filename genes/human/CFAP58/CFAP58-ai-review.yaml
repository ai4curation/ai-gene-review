- term:
    id: GO:0007219
    label: Notch signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B2RW38
  - ensembl:ENSMUSP00000070533
  review:
    summary: >-
      Transferred from mouse Cfap58, reported to be required for primary cilium and sperm midpiece elongation
      'via modulation of the Notch signaling pathway'. The data show that pharmacological Notch inhibition
      raises Cfap58 expression and lengthens primary cilia and the sperm midpiece.
    action: REMOVE
    reason: >-
      The underlying observation places Cfap58 downstream of Notch: its expression rises when Notch signalling
      is inhibited (PMID:31904090). No component of the pathway (receptor, ligand processing, NICD or
      CSL transcriptional activity) is shown to depend on CFAP58 protein, so CFAP58 does none of the work
      of Notch signalling and is at most a Notch-regulated target. Being regulated by a pathway is not
      participation in it. Both the ISS and the derived IEA rows rest on this single mouse study.
    supported_by: &id005
    - reference_id: PMID:31904090
      supporting_text: >-
        Inhibition of Notch signaling elevated not only the expression level of Cfap58 in vitro and in
        vivo, but also the length of the primary cilia and sperm midpiece.
