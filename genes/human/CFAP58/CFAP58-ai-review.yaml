suggested_questions:
- question: >-
    Where exactly does CFAP58 sit in the sperm flagellum: on the doublet microtubules at the radial spoke
    base, in the central apparatus, or in a peri-axonemal midpiece structure? It is not among the central-apparatus
    proteins assigned in the mouse sperm in situ structure.
- question: >-
    Is the mitochondrial sheath defect in CFAP58-deficient sperm a direct consequence of a midpiece function
    of CFAP58, or secondary to axonemal failure?
suggested_experiments:
- hypothesis: >-
    CFAP58 is a doublet-associated protein at the radial spoke base of the sperm axoneme.
  description: >-
    Map CFAP58 in mouse sperm by in situ cryo-ET subtomogram averaging of doublet microtubules from wild-type
    versus Cfap58-null sperm, combined with AlphaFold-guided density assignment and immunogold labelling.
  experiment_type: structural biology
