id: Q6P1J9
gene_symbol: CDC73
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDC73 encodes parafibromin, a nuclear component of the polymerase-associated factor 1 complex
  (PAF1C). It associates with RNA polymerase II and helps coordinate transcription elongation with recruitment
  of mRNA 3′-end processing factors. These functions depend on interactions within the transcription machinery
  rather than an intrinsic RNA-cleavage or histone-modifying activity. Parafibromin also engages beta-catenin
  and influences context-dependent transcriptional programs, proliferation and differentiation. Loss of
  CDC73 function underlies hyperparathyroidism–jaw tumor syndrome and predisposes to parathyroid tumors.
