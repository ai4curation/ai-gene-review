  review:
    summary: CDC73 associates with BRAF V600E in tagged validation assays; retain this mutant-context
      association as non-core.
    action: KEEP_AS_NON_CORE
    reason: The exact human CDC73–BRAF pair is recorded under PMID:35512704 in split-luciferase complementation
      (IntAct EBI-52381121 and EBI-52381451) and GST pulldown (EBI-63973061). The linked primary Results/Methods
      and Figure 4/S4 context identify the validation construct as BRAF V600E; CDC73 is the tagged binding
      partner. This is a mutant-context association and does not establish unqualified wild-type BRAF
      binding or a normal CDC73 signaling role. A separate BRET record, EBI-63680630, encodes a position-600
      mutation with no effect, whereas the pulldown record encodes increased interaction strength; the
      exact allele-specific BRET comparison is not resolved by the inspected extract and is not generalized.
      No kinase activity is assigned to CDC73.
