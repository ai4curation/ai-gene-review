  review:
    summary: The original study supports a substoichiometric RTF1 association with human PAF1C.
    action: KEEP_AS_NON_CORE
    reason: 'Selected full Results of the original PMID:16024656 distinguish stable purification from
      coimmunoprecipitation: RTF1 was absent from the conventionally and affinity-purified core, but anti-PAF1,
      anti-PolII and anti-RTF1 immunoprecipitations recovered substoichiometric associations among RTF1,
      polymerase and PAF1C subunits (reported with Supplementary Figure 4). The supplementary image was
      not independently inspected. This supports a complex-associated interaction, not an isolated CDC73–RTF1
      binary interface. Later PMID:20178742 provides separate human-complex corroboration. The source-specific
      full-text URL and short excerpt are in CDC73-notes.md.'
    supported_by:
    - reference_id: PMID:16024656
    - reference_id: PMID:20178742
