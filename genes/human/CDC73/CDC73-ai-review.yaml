core_functions:
- description: Associates with RNA polymerase II in PAF1C and helps couple productive transcription elongation
    to recruitment of mRNA 3′-end processing factors. Human coimmunoprecipitation establishes complex-associated
    binding, without isolating a binary CDC73–PolII interface or a CDC73 catalytic processing activity.
  molecular_function:
    id: GO:0000993
    label: RNA polymerase II complex binding
  directly_involved_in:
  - id: GO:0032968
    label: positive regulation of transcription elongation by RNA polymerase II
  - id: GO:0031442
    label: positive regulation of mRNA 3'-end processing
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0016593
    label: Cdc73/Paf1 complex
  supported_by:
  - reference_id: PMID:15923622
  - reference_id: PMID:20178742
  - reference_id: PMID:19136632
  - reference_id: PMID:21329879
- description: Binds beta-catenin and connects the nuclear Wnt transcription complex to PAF1C-dependent
    transcription. Human parafibromin and Drosophila Hyrax experiments support this conserved coactivator
    role; direct beta-catenin engagement distinguishes it from a nonspecific consequence of altered transcription
    or cell proliferation.
  molecular_function:
    id: GO:0008013
    label: beta-catenin binding
  directly_involved_in:
  - id: GO:0030177
    label: positive regulation of Wnt signaling pathway
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0016593
    label: Cdc73/Paf1 complex
  supported_by:
  - reference_id: PMID:16630820
    supporting_text: bind directly to the C-terminal region of beta-catenin/Armadillo
  - reference_id: PMID:29774127
suggested_questions:
- question: Which CDC73 contacts recruit CPSF/CstF independently of changes in PAF1C stability, and how
    broadly is this coupling required across endogenous human genes?
- question: Do native SHP2 isoforms show measurable CDC73 binding without substrate-trapping mutations,
    and which original constructs support each existing partner accession?
- question: Which exact PICh target entry and endodermal differentiation experiment underlie the unresolved
    source annotations?
suggested_experiments:
- description: Map CDC73 separation-of-function interfaces in endogenous human cells, preserving PAF1C
    abundance, then compare PolII occupancy, CPSF/CstF recruitment and nascent RNA 3′ processing with
    rescue controls.
