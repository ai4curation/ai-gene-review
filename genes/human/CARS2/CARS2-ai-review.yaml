id: Q9HA77
gene_symbol: CARS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CARS2 is the nuclear-encoded mitochondrial cysteinyl-tRNA synthetase. After import into mitochondria it charges mitochondrial tRNA(Cys) with cysteine for mitochondrial translation. CARS2 also catalyzes pyridoxal-phosphate-dependent production of cysteine persulfide and longer cysteine polysulfides from cysteine, linking the mitochondrial CysRS paralog to endogenous persulfide synthesis, protein cysteine polysulfidation, and mitochondrial bioenergetics.
