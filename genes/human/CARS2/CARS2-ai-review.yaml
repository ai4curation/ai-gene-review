proposed_new_terms:
- proposed_name: cysteine persulfide synthase activity
  proposed_definition: Catalysis of the PLP-dependent formation of cysteine hydropersulfide or longer cysteine polysulfides from cysteine.
  justification: Human CARS2 and other cysteinyl-tRNA synthetases catalyze sulfur transfer from cysteine to cysteine, yielding S-sulfanyl-L-cysteine and alanine as represented by RHEA:78543. GO:0031071 cysteine desulfurase activity does not fit this reaction because it names transfer from L-cysteine to an acceptor or sulfur carrier rather than to another cysteine, and the CARS2 UniProt GO cross-references still map only the ligase activity.
  proposed_parent:
    id: GO:0016783
    label: sulfurtransferase activity
  supported_by:
  - reference_id: PMID:29079736
    supporting_text: Markedly reduced persulfide formation in CARS2 KO cells was recovered by adding back WT CARS2.
  - reference_id: file:genes/human/CARS2/CARS2-uniprot.txt
    record_section:
    - FT:MUTAGEN
    supporting_text: 'KIIK->AIIA: No effect on cysteine--tRNA ligase activity. Loss of cysteine persulfide synthase activity.'
  - reference_id: file:genes/human/CARS2/CARS2-uniprot.txt
    record_section:
    - FT:MUTAGEN
    supporting_text: 'KMSK->AMSA: No effect on cysteine--tRNA ligase activity. Loss of cysteine persulfide synthase activity.'
  - reference_id: file:genes/human/CARS2/CARS2-uniprot.txt
