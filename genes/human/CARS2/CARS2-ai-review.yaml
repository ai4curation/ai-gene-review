suggested_questions:
- question: How much of CARS2-dependent cysteine persulfide production is independent of tRNA charging in human mitochondria under physiological cysteine and PLP concentrations?
  experts: []
suggested_experiments:
- description: Compare separation-of-function CARS2 variants in human CARS2-null cells for mitochondrial tRNA(Cys) charging, recombinant cysteine persulfide synthesis, and rescue of mitochondrial protein synthesis and low-molecular-weight persulfide pools.
  hypothesis: The established KIIK/KMSK and Cys78/Cys257 separation-of-function mutants should distinguish the mitochondrial flux carried by the cysteine-persulfide synthase activity from the tRNA-charging activity in intact cells.
