    supporting_text: 'C->D: No effect on cysteine persulfide synthase activity; when associated with D-78. Loss of cysteine--tRNA ligase activity; when associated with D-78.'
  - reference_id: file:genes/human/CARS2/CARS2-uniprot.txt
