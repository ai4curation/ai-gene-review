[project]
name = "apln-bioinformatics"
version = "0.1.0"
description = "Sequence and provenance analyses supporting the GO annotation review of human APLN (apelin)"
readme = "README.md"
authors = [
    { name = "Chris Mungall", email = "cjm@berkeleybop.org" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
apln-bioinformatics = "apln_bioinformatics:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
