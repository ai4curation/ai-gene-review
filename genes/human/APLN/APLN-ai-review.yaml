- term:
    id: GO:0090278
    label: negative regulation of peptide hormone secretion
  evidence_type: ISS
  original_reference_id: PMID:15231996
  supporting_entities:
  - UniProtKB:Q9R0R3
  review:
    summary: 'Apelin is a diuretic neuropeptide that opposes vasopressin: it inhibits vasopressin neuron
      activity, lowers plasma vasopressin and increases diuresis. The human record captures only the
      drinking half of this biology.'
    action: NEW
    reason: GO:0042756 drinking behavior is already annotated by ISS from rat, and it records the intake
      side of apelin's role in fluid balance. The output side is at least as well documented and is
      missing entirely. Apelin is co-localised with vasopressin in magnocellular supraoptic neurons,
      inhibits their phasic electrical activity, reduces plasma vasopressin and increases diuresis in
      vivo; water deprivation moves apelin and vasopressin in opposite directions, which is the signature
      of a counter-regulatory pair rather than a pharmacological artefact. The same laboratory's earlier
      work, which is the source of the existing drinking-behaviour annotation, already reported decreased
      vasopressin release after central apelin injection. Vasopressin is a peptide hormone, so GO:0090278
      applies directly and is more informative than its broad alternative GO:0050878 regulation of body
      fluid levels; the ideal term, negative regulation of vasopressin secretion, does not exist, although
      ten sibling peptide hormones have one, and is proposed separately. Coded ISS rather than IMP because
