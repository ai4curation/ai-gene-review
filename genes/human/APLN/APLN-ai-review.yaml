  review:
    summary: Apelin is a potent positive inotrope. The human rows transfer a rat IMP, with independent
      genetic support from Apln-null mice. Automatic Ensembl Compara transfer.
    action: KEEP_AS_NON_CORE
    reason: 'This is the best-supported of the organismal terms on the gene. Apelin is described as
      the most potent inotrope in the heart in vitro (PMID:28137936), and unlike the other physiological
      rows it has genuine loss-of-function backing: aged Apln-knockout mice develop progressive impairment
      of cardiac contractility and systolic dysfunction (PMID:17673668), and both apelin-null and APJ-null
      mice show basal contractile decrements and striking loss of exercise capacity (PMID:19767528).
      The donor chain is thinner than the biology: rat Apln''s GO:0045823 is an IMP from PMID:26611206,
      a paper whose subject is apela/ELABELA and in which apelin appears as the comparator agonist,
      and which contains no Apln mutant. Kept as non-core because it is an organ-level readout of apelin
      receptor signalling rather than a second molecular function of the gene product.'
    supported_by:
    - reference_id: PMID:26611206
      supporting_text: just like the fellow receptor agonist apelin, apela increases cardiac contractility
        and induces coronary vasodilation already in the nanomolar level
    - reference_id: PMID:28137936
      supporting_text: In heart, apelin is reportedly the most potent inotrope in vitro
    - reference_id: PMID:17673668
      supporting_text: aged Apelin knockout mice developed progressive impairment of cardiac contractility
        associated with systolic dysfunction in the absence of histological abnormalities
    - reference_id: PMID:17673668
      supporting_text: These genetic data show that the endogenous peptide Apelin is crucial to maintain
        cardiac contractility in pressure overload and aging.
    - reference_id: PMID:19767528
      supporting_text: Under basal conditions, both apelin and APJ null mice that survived to adulthood
        manifested modest decrements in contractile function.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q9R0R3
        source_label: Apln (rat, Swiss-Prot APEL_RAT)
