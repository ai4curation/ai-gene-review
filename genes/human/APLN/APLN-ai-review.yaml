- term:
    id: GO:0060183
    label: apelin receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:11359874
  qualifier: involved_in
  review:
    summary: Apelin-17 and pyroglutamyl-apelin-13 inhibit forskolin-stimulated cAMP and drive receptor
      internalisation in cells expressing the apelin receptor; N-terminally truncated fragments are
      inactive.
    action: ACCEPT
    reason: 'A clean pharmacological demonstration of the pathway, with an internal specificity control:
      K17F and pE13F are active while R10F and G5F are not, so the response depends on the intact peptide
      and is not a non-specific effect. The receptor is rat and the cells are CHO, but the peptides
      are the human ones - human, rat, mouse and bovine apelin-13 and apelin-17 are identical residue
      for residue - so this is the human gene product engaging its receptor. Core function.'
    supported_by:
    - reference_id: PMID:11359874
      supporting_text: Stimulation of this receptor by the apelin fragments K17F (Lys1-Phe-Arg-Arg-Gln-Arg-Pro-Arg-Leu-Ser-His-Lys-Gly-Pro-Met-Pro-Phe17)
        and pE13F (pGlu5-Arg-Pro-Arg-Leu-Ser-His-Lys-Gly-Pro-Met-Pro-Phe17) resulted in a dose-dependent
        inhibition of forskolin-induced cAMP production and promoted its internalization.
    - reference_id: PMID:11359874
      supporting_text: In contrast, the apelin fragments R10F (Arg8-Leu-Ser-His-Lys-Gly-Pro-Met-Pro-Phe17)
        and G5F (Gly13-Pro-Met-Pro-Phe17) were inactive.
    - reference_id: PMID:11359874
      supporting_text: We established a stable Chinese hamster ovary (CHO) cell line expressing a gene
        encoding the rat apelin receptor fused to the enhanced green fluorescent protein, to investigate
        internalization and the pharmacological profile of the apelin receptor.
    - reference_id: file:human/APLN/APLN-bioinformatics/RESULTS.md
      supporting_text: A "rat" or "bovine" apelin-17 in a pharmacology paper is, residue for residue,
        the human gene product.
- term:
    id: GO:0060183
    label: apelin receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:22810587
  qualifier: involved_in
  review:
    summary: Apelin acting on human APJ inhibits adenylyl cyclase through Gi, raises pERK, generates
      inositol phosphates and recruits beta-arrestin.
    action: ACCEPT
    reason: 'The most complete single description of the pathway on the human receptor: cAMP inhibition
      that is pertussis-toxin sensitive, dose-dependent IP1 accumulation via the promiscuous Galpha16
      reporter, ERK phosphorylation, and beta-arrestin recruitment. The paper''s headline is that APJ
      also signals independently of apelin in response to stretch; that is a receptor property and is
      correctly not annotated to APLN. Core function.'
    supported_by:
    - reference_id: PMID:22810587
      supporting_text: apelin addition decreased cAMP levels in the APJ-HEK cells
    - reference_id: PMID:22810587
      supporting_text: These data agree with previous reports21 and demonstrate that Gαi transduces
        the signal initiated by apelin binding to APJ.
    - reference_id: PMID:22810587
      supporting_text: Stretch did not increase IP1 production whereas apelin did so in a dose-responsive
        manner
    - reference_id: PMID:22810587
      supporting_text: Using a β-arrestin/APJ complementation assay, apelin was found to induce a dose-dependent
        increase in β-arrestin signaling, as expected
    - reference_id: PMID:22810587
      supporting_text: In contrast, mice lacking apelin (the endogenous APJ ligand) remain sensitive,
        suggesting an apelin-independent function of APJ.
- term:
    id: GO:0060183
    label: apelin receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:38428423
  qualifier: involved_in
  review:
    summary: Cryo-EM structures of apelin-bound APLNR-Gi1 complexes, with the residues controlling G-protein
      versus beta-arrestin bias identified.
    action: ACCEPT
    reason: 'Structural evidence for the pathway at its first step: the peptide occupies the orthosteric
      site of APLNR in complex with Gi1, and structure-guided redesign produced biased agonists, which
      only makes sense if the native ligand engages both arms. UniProt records two APLN residues from
      this work - SITE 75 and SITE 77, ''Important for the balance between G(i) and beta-arrestin pathways
      induced by apelin-13-APLNR system'' - so the paper assigns pathway-determining roles to positions
      in this gene product, not only to the receptor. Core function.'
