proposed_new_terms:
- proposed_name: negative regulation of vasopressin secretion
  proposed_definition: Any process that decreases the rate, frequency or extent of the regulated release
    of vasopressin from a cell.
  justification: 'GO:0030103 vasopressin secretion exists but has no regulation children, while its
    parent GO:0090278 negative regulation of peptide hormone secretion already has ten hormone-specific
    children - calcitonin, somatostatin, corticotropin-releasing hormone, corticotropin, growth hormone,
    glucagon, substance P, prolactin, thyroid-stimulating hormone and insulin. Vasopressin is conspicuously
    missing. Apelin is the clearest case needing it: it is co-localised with vasopressin in magnocellular
    hypothalamic neurons, inhibits their phasic activity, and lowers plasma vasopressin with a corresponding
    increase in diuresis, and this is its best-characterised central action. The term would also serve
    the several other neuropeptides and receptors known to modulate vasopressin release. Without it
    the biology has to be recorded against the generic parent, which loses the identity of the hormone.'
  proposed_parent:
    id: GO:0090278
    label: negative regulation of peptide hormone secretion
