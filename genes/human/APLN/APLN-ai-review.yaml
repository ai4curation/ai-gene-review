- term:
    id: GO:0005179
    label: hormone activity
  evidence_type: IDA
  original_reference_id: PMID:22810587
  qualifier: enables
  review:
    summary: Apelin acting on human APJ expressed in HEK cells inhibits cAMP accumulation in a pertussis-toxin-sensitive
      manner, raises pERK and recruits beta-arrestin - receptor-ligand activity measured directly on
      the human receptor.
    action: ACCEPT
    reason: 'GO:0005179 is a child of GO:0048018 receptor ligand activity and its definition is explicitly
      permissive about route - ''carried (sometimes in the bloodstream) to another organ or group of
      cells'' - so a peptide that acts mostly in an autocrine/paracrine mode still satisfies it. This
      is the core molecular function of the gene product and the assays here are on the human receptor.
      One caveat belongs on the record rather than on the action: the best human measurement of circulating
      apelin, in PMID:28137936, concludes the peptides look more like locally released mediators than
      circulating hormones, so ''hormone'' should be read as ''receptor agonist'' rather than as a claim
      about endocrine delivery. The activity belongs to the cleaved peptides (apelin-13/-17), not to
      the 77-residue precursor, which UniProt records as PRO chains.'
