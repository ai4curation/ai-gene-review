knowledge_gaps:
- gap_statement: Which processed apelin peptide does what, in which tissue, is unresolved - and the
    gene record cannot express the difference, because every annotation is made against the 77-residue
    precursor rather than against the chains UniProt already defines.
  boundary: 'Firmly established: the precursor yields apelin-36, -31, -28, -17 and -13; furin cleaves
    proapelin directly to apelin-13 with no longer intermediates; apelin-13 and, less abundantly, apelin-17
    are the predominant endogenous forms in plasma and hypothalamus; the peptides differ in receptor
    residence time, in their G-protein versus beta-arrestin bias, and in susceptibility to ACE2; and
    UniProt carries PRO chain identifiers PRO_0000001760 to PRO_0000001763 for four of them. Equally
    established: not one GO annotation on this gene is made against a chain identifier.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Apelin analogues are being developed as cardiovascular drugs precisely because the forms
    differ in bias and stability. A record that treats them as one entity cannot support that distinction,
    and cannot say which form a given physiological claim rests on. It also makes the gene look like
    a protein with a dozen activities rather than a precursor for a small set of peptides.
  resolution: 'Two separable steps. Biologically: measure the tissue distribution of each processed
    form with form-specific assays, and repeat the key physiological perturbations with each. Curationally:
    annotate against the existing PRO chain identifiers, as UniProt already does for the isoform-level
    GO:0005179 and GO:0005576 rows it carries on PRO_0000001763 in other species.'
  provenance:
  - reference_id: PMID:24251091
    supporting_text: We show direct cleavage of proapelin to apelin-13 by proprotein convertase subtilisin/kexin
      3 (PCSK3, or furin) in vitro, with no production of longer isoforms.
  - reference_id: PMID:15231996
    supporting_text: We first characterized the predominant molecular forms of endogenous hypothalamic
      and plasma apelin as corresponding to apelin 13 and, to a lesser extent, to apelin 17.
  - reference_id: PMID:27217402
    supporting_text: We examined the ability of angiotensin-converting enzyme 2 (ACE2) to cleave and
      inactivate pyr-apelin 13 and apelin 17, the dominant apelin peptides.
  - reference_id: file:human/APLN/APLN-uniprot.txt
    supporting_text: Several active peptides may be produced by proteolytic processing
- gap_statement: Whether apelin should be treated as a hormone or as a locally released autocrine/paracrine
    mediator is unsettled, and the ontology forces a choice that the data do not support.
  boundary: 'Established: apelin is detectable in human plasma, at 0.26 nmol/L, and the authors of that
    measurement conclude the concentration is more consistent with local release than with circulating
    hormone action. Also established: apelin is secreted in very large amounts into colostrum, at 14
    to 93 pmol/ml, which is an exocrine route entirely. GO:0005179 hormone activity is defined permissively
    enough to cover both, because it says ''sometimes in the bloodstream'', and its own comment points
    to GO:0048018 receptor agonist activity as an alternative.'
  gap_kind:
  - BIOLOGY
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: 'The choice determines what a reader infers about where apelin acts and over what distance,
    and it propagates: three rows on this gene assert hormone activity, and the term is transferred
    to the rodent and bovine orthologs by ISS and IEA. If apelin is mostly paracrine, every one of those
    rows is conveying something slightly false about the route.'
  resolution: Biologically, a measurement of the arteriovenous gradient of each apelin form across a
    vascular bed, and of local interstitial concentration, would show whether circulating apelin is
    a signal or a spillover. Ontologically, the question is whether GO wants GO:0005179 to be about
    the route of delivery or only about the agonist relationship; if the former, apelin belongs under
    GO:0048018 instead.
  provenance:
