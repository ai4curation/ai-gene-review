- term:
    id: GO:0045776
    label: negative regulation of blood pressure
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9R0R3
  - ensembl:ENSRNOP00000100018
  review:
    summary: Apelin is a vasodepressor. The human rows transfer a rat IMP whose cited paper reports
      no blood-pressure effect; the biology is nonetheless well established from other work. Automatic
      Ensembl Compara transfer.
    action: KEEP_AS_NON_CORE
    reason: 'Two things have to be separated here. The claim is true: apelin-12, -13 and -36 lower mean
      arterial pressure in anaesthetised rats in a nitric-oxide-dependent way (PMID:11384769), apelin
      infusion lowers systolic blood pressure in wild-type but not APJ-null mice (PMID:22810587), and
      ACE2 knockout potentiates the hypotensive action of the apelin peptides (PMID:27217402). The propagation
      chain, however, is weak: the only donor is rat Apln, whose GO:0045776 is an IMP citing PMID:11359874,
      and that paper''s abstract reports the opposite result for its own blood-pressure readout - central
      pE13F decreased water intake but did not affect blood pressure. The cache is abstract-only so
      a peripheral-route experiment in the full text cannot be excluded, and the curator read what we
      cannot; but on the accessible record the cited evidence does not establish this term, and the
      same sentence is what legitimately supports the drinking-behaviour row. Kept, because the function
      is real and supported elsewhere, but non-core: it is an organismal haemodynamic readout of receptor
      activation, not a second activity of the gene product. Raised as a question for UniProt.'
    supported_by:
    - reference_id: PMID:11359874
      supporting_text: central injection of pE13F significantly decreased water intake in dehydrated
        normotensive rats but did not affect blood pressure
    - reference_id: PMID:11384769
      supporting_text: mean arterial pressure after the administration of apelin-12, apelin-13, and
        apelin-36 at a dose of 10 nmol/kg in anaesthetized rats was reduced by 26+/-5, 11+/-4, and 5+/-4
        mm Hg, respectively
    - reference_id: PMID:11384769
      supporting_text: In the presence of a nitric oxide (NO) synthase inhibitor, the effect of apelin-12
        on blood pressure was abolished.
    - reference_id: PMID:22810587
      supporting_text: Apelin infusion significantly decreased systolic blood pressure in WT animals
        but not in APJ-KO mice
    - reference_id: PMID:27217402
      supporting_text: In ACE2 knockout mice, hypotensive action of pyr-apelin 13 and apelin 17 was
        potentiated
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:Q9R0R3
        source_label: Apln (rat, Swiss-Prot APEL_RAT)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Rat Apln, GO:0045776 IMP from PMID:11359874 (verified on the rat record via the GO
          API). That paper's abstract states central pE13F 'did not affect blood pressure'. The vasodepressor
          effect of apelin is real but comes from PMID:11384769 and PMID:22810587, neither of which
          is cited by the donor annotation.
      - source_id: ensembl:ENSRNOP00000100018
        source_label: rat Apln protein - resolves to Q9R0R3, the same entity as the UniProtKB donor
          on this row
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: 'Resolves to Q9R0R3: one donor under two identifiers, so the weakness is not offset
          by a second, independent source.'
      residue_claims_not_applicable: The weakness is in the donor's citation, not in any sequence feature
        of human apelin.
