      reading does not. Automatic Ensembl Compara transfer.
    action: KEEP_AS_NON_CORE
    reason: 'Traced to its origin, this row means something different from what it looks like. The mouse
      donor''s GO:0060976 is an IMP from PMID:28890073, a paper whose thesis is that the ELABELA-APJ
      axis, not apelin, is what sinus-venosus-derived coronary progenitors require. Its apelin data
      are a measured negative plus an opposite-sign phenotype: Apelin-knockout animals did not phenocopy
      the Apj-knockout coronary defect, and Apelin-deficient hearts showed increased coronary growth
      with earlier full coverage than wild type. Since GO:0060976 is an unsigned developmental process
      used with involved_in, an Apln-null with accelerated coronary coverage is still involvement, so
      the term itself transfers correctly and should not be removed. What does not transfer is the gloss
      UniProt places on the same evidence, ''Plays a role in early coronary blood vessels formation
      (By similarity)'', which reads as a positive requirement. GO offers no regulation-of-coronary-vasculature-development
      child to move to, so the honest action is to keep the term as non-core with the direction recorded
      here. This is also the one row where the ELABELA/apelin confound genuinely reaches APLN, and the
      wider literature agrees the two ligands are separable: apelin-null mice develop normally while
      APJ-null mice do not (PMID:19767528, PMID:22810587).'
    supported_by:
    - reference_id: PMID:28890073
