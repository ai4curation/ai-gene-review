core_functions:
- description: 'Endogenous agonist of the apelin receptor APLNR. The peptides released from the precursor
    - predominantly apelin-13, pyroglutamyl-apelin-13 and apelin-17 - bind APLNR in the extracellular
    space and activate it, coupling it to Gi so that adenylyl cyclase is inhibited and cAMP falls, and
    activating ERK1/2. Agonism requires the intact peptide: fragments truncated past the N-terminal
    Arg-Pro-Arg-Leu motif are inactive, and removal of the single C-terminal phenylalanine by ACE2 inactivates
    the peptide. This is the molecular act from which every other apelin phenotype follows.'
  supported_by:
  - reference_id: PMID:9792798
    supporting_text: Synthetic peptides derived from the C-terminal amino acid sequence of bovine preproapelin
      were capable of specifically promoting the acidification rate in the cells expressing the APJ
      receptor in a range from 10(-7) to 10(-10) M, indicating that apelin is an endogenous ligand for
      the APJ receptor.
  - reference_id: PMID:22810587
    supporting_text: apelin addition decreased cAMP levels in the APJ-HEK cells
  - reference_id: PMID:22810587
    supporting_text: These data agree with previous reports21 and demonstrate that Gαi transduces the
