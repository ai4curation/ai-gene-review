  - reference_id: PMID:11359874
    supporting_text: In contrast, the apelin fragments R10F (Arg8-Leu-Ser-His-Lys-Gly-Pro-Met-Pro-Phe17)
      and G5F (Gly13-Pro-Met-Pro-Phe17) were inactive.
