- term:
    id: GO:0007595
    label: lactation
  evidence_type: TAS
  original_reference_id: PMID:10525157
  qualifier: involved_in
  review:
    summary: Legacy ProtInc row inferred from apelin being abundant in mammary gland and secreted into
      colostrum and milk. That is expression and localisation, not participation in milk release.
    action: REMOVE
    reason: 'GO:0007595 is defined as ''the regulated release of milk from the mammary glands and the
      period of time that a mother lactates to feed her young''. What the cited paper reports is abundance:
      apelin mRNA highest in the mammary gland of pregnant rats, rising through pregnancy and lactation
      to a peak around parturition, and 14-93 pmol/ml of peptide in bovine colostrum. Apelin is therefore
      a constituent of milk - a localisation fact the gene already carries on ten other rows as GO:0005576
      - and the paper contains no perturbation of apelin with a milk-release or milk-yield readout.
      Inferring a biological process from an expression profile is precisely the inference GO asks curators
      not to make, and nothing published since supplies the missing experiment: targeted PubMed searches
      pairing apelin with lactation, milk ejection and oxytocin return no study that perturbs apelin
      and measures milk release. The nearby real biology runs the other way - apelin acts centrally
      on vasopressin neurons and was studied in lactating rats for that reason (PMID:15231996) - which
      is a body-fluid role, not a lactation role, and is proposed separately here as GO:0050878.'
    additional_reference_ids:
    - PMID:15231996
    supported_by:
