- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: TAS
  original_reference_id: PMID:10525157
  qualifier: enables
  review:
    summary: 'Legacy ProtInc statement that apelin binds a signalling receptor. True but uninformative:
      the receptor is known and named, and the specific term is already on the gene.'
    action: MODIFY
    reason: 'GO:0031704 apelin receptor binding is a descendant of this term via GO:0001664 G protein-coupled
      receptor binding (QuickGO ancestors), and the gene already carries GO:0031704 from an IDA in native
      human left ventricle. The generic parent therefore adds nothing that the specific child does not
      say better, and ''signaling receptor binding'' does not record which receptor. This is a granularity
      fix, not a disagreement with the curator: the cited paper is precisely about the apelin/APJ pairing.'
    proposed_replacement_terms:
