          inotropy panel is not visible here. The term is independently supported by Apln-null mouse
          data (PMID:17673668, PMID:19767528) that the donor does not cite.
      - source_id: ensembl:ENSRNOP00000100018
        source_label: rat Apln protein - resolves to Q9R0R3, the same entity as the UniProtKB donor
          on this row
        source_status: SUPPORTS_TRANSFER
