gene_symbol: APLN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Apelin is the endogenous peptide agonist of the apelin receptor APLNR (APJ), a Gi-coupled
  G-protein-coupled receptor. It is made as a 77-residue preproprotein: a cleaved signal peptide, a
  propeptide, and a C-terminal tail that is processed into a family of short bioactive peptides named
  for their length - apelin-36, -31, -28, -17 and -13, the last of which is frequently N-terminally
  cyclised to pyroglutamyl apelin-13. Furin cleaves the proprotein directly to apelin-13, and apelin-13
  and apelin-17 are the predominant endogenous forms in plasma and hypothalamus. The active part of
  the molecule is extraordinarily conserved: the twelve C-terminal residues are essentially invariant
  across vertebrates, and human, rat, mouse and bovine apelin-13 and apelin-17 are identical, with divergence
  confined to the portion of the precursor that is trimmed away. Both ends of the peptide are required
  for activity - an N-terminal Arg-Pro-Arg-Leu motif for receptor recognition and the C-terminal phenylalanine
  for activation - and that terminal phenylalanine is also what sets the balance between the receptor''s
  G-protein and beta-arrestin outputs.


  Binding of apelin to APLNR activates Gi, inhibiting adenylyl cyclase and lowering cAMP, while also
  activating ERK1/2 and recruiting beta-arrestin, which desensitises and internalises the receptor.
  Signalling is terminated proteolytically: angiotensin-converting enzyme 2 removes the single C-terminal
  phenylalanine, and the truncated peptides are much less active, making ACE2 a negative regulator of
  the whole axis. The peptide is secreted and acts largely in an autocrine or paracrine fashion; it
  circulates in human plasma only at subnanomolar concentrations, and it is also secreted in large amounts
  into colostrum and milk.


  Physiologically the apelin-APLNR axis is best characterised in the cardiovascular system and in fluid
  balance. Apelin is among the most potent positive inotropes known in the heart; it lowers blood pressure
  through a nitric-oxide-dependent vasodilator mechanism; and mice lacking apelin, although viable,
  fertile and outwardly normal, lose cardiac contractility with ageing and pressure overload and show
  markedly reduced exercise capacity. In the brain, apelin is co-expressed with vasopressin in magnocellular
  hypothalamic neurons, inhibits their activity, lowers circulating vasopressin and promotes diuresis,
  and reduces water intake in dehydrated animals - acting as a counter-regulator of vasopressin in body-fluid
  homeostasis. In the vasculature apelin is induced by hypoxia through HIF-1alpha, marks sprouting endothelium,
  and in pulmonary artery endothelial cells sustains transcription of miR-424 and miR-503, which restrain
  FGF2 and FGFR1 and thereby limit endothelial and smooth-muscle proliferation; this axis is lost in
  pulmonary arterial hypertension. Apelin also improves whole-body glucose utilisation in rodents. The
  receptor it acts through is shared with a second, structurally unrelated endogenous ligand, ELABELA/Toddler,
  and the two ligands are separable: apelin-null and APLNR-null animals have different, sometimes opposite,
  developmental phenotypes.'
