suggested_questions:
- question: 'For the PAINT curators of PTHR15953: the family carries exactly one node-level annotation,
    an IBD for GO:0005576 at PTN001041490. Apelin receptor binding (GO:0031704) and the apelin receptor
    signalling pathway (GO:0060183) are experimentally annotated in human, rat, mouse and zebrafish,
    and the peptide''s C-terminal twelve residues are 97-98.5% invariant across all 333 members. Is
    there a reason these were not placed at the same node, or is this simply unfinished?'
- question: 'For UniProt: rat Apln carries GO:0045776 negative regulation of blood pressure as an IMP
    from PMID:11359874, and that paper''s abstract reports that central pE13F ''did not affect blood
    pressure''. The same sentence is what supports the drinking-behaviour annotation from the same paper.
    Apelin''s vasodepressor action is well established, but from PMID:11384769 and PMID:22810587. What
    supports the blood-pressure annotation as cited? This row reaches human APLN twice, by ISS and by
    Ensembl Compara IEA.'
- question: 'For UniProt: the mouse Apln GO:0060976 coronary vasculature development IMP cites PMID:28890073,
    which reports that Apelin-knockout animals did not phenocopy the Apj-knockout coronary defect and
    that Apelin-deficient hearts showed increased coronary growth - the opposite direction. The unsigned
    GO term still applies, but the FUNCTION line transferred to human APLN reads ''Plays a role in early
    coronary blood vessels formation'', which implies the opposite sign. Should that comment be reworded?'
- question: 'For UniProt: four APLN rows cite PMID:28137936 and two of them are coded IMP (GO:0005179,
    GO:0060183). That paper contains no APLN mutant or knockdown; its apelin data are synthetic-peptide
    pharmacology run as a comparator to ELABELA. Should these be IDA? The same question applies to rat
    Apln GO:0045823 IMP from PMID:26611206, which is an apela paper.'
- question: 'For GOA and UniProt jointly: UniProt defines four PRO chain identifiers for this entry
    (PRO_0000001760 to PRO_0000001763) and almost every annotation on the gene is really about apelin-13
    or apelin-17 rather than about the 77-residue precursor. Would annotations against those chain identifiers
    be accepted, as they already are for some orthologs?'
- question: 'For UniProt: apelin-17 has no PEPTIDE feature on this entry, although it is one of the
    two predominant endogenous forms (PMID:15231996), is the form used in most central work as K17F,
    and is one of the two peptides whose ACE2 cleavage was characterised (PMID:27217402). Should it
    be added alongside apelin-36, -31, -28 and -13?'
- question: 'For GO: apelin is annotated to GO:0005179 hormone activity three times, yet the best human
    measurement of the circulating peptide concludes it looks ''more indicative of peptides acting as
    locally released autocrine/paracrine mediators than as circulating hormones''. Does GO intend GO:0005179
    to carry a claim about route of delivery, given its definition says ''sometimes in the bloodstream''
    and its comment points to GO:0048018?'
suggested_experiments:
- hypothesis: The physiological roles currently attributed to apelin are carried by different processed
    forms in different tissues, and the precursor-level record conflates them.
  description: Raise or commission form-specific immunoassays that discriminate apelin-36, apelin-17,
    apelin-13 and pyroglutamyl-apelin-13, validated against synthetic standards and against ACE2-cleaved
    products, and map their absolute concentrations across plasma, heart, hypothalamus, adipose tissue
    and colostrum. Then repeat the three defining physiological readouts - inotropy in an isolated heart,
    blood pressure in vivo, and central vasopressin release - with each form at matched receptor occupancy
    rather than matched mass dose. The prediction from the processing data is that apelin-13 dominates
    everywhere and that apelin-36's reported effects are largely a slow-off-rate artefact of high dosing.
  experiment_type: quantitative peptidomics plus matched-occupancy pharmacology
- hypothesis: Apelin is a paracrine mediator rather than a circulating hormone, so its molecular-function
    annotation should be a receptor agonist term and not a hormone term.
  description: Measure the arteriovenous gradient of each apelin form across a defined vascular bed
    in vivo, together with interstitial concentration by microdialysis in heart and skeletal muscle,
    and compare local concentration with the receptor's measured affinity in human tissue (pKi about
    8.85 for pyroglutamyl-apelin-13 in human left ventricle). A hormone should reach receptor-saturating
    concentrations at the target from the circulation; a paracrine mediator should show local concentrations
    far above plasma and a net release gradient at the site of production.
  experiment_type: in vivo arteriovenous sampling and microdialysis
- hypothesis: Loss of endogenous apelin, as opposed to infusion of exogenous peptide, does not impair
    glucose handling - meaning the metabolic literature describes pharmacology rather than physiology.
  description: Phenotype apelin-null mice, which are viable, fertile and outwardly normal, with a hyperinsulinaemic-euglycaemic
    clamp and tissue-specific 2-deoxyglucose uptake on chow and on high-fat diet, alongside wild-type
    littermates and alongside wild-type animals receiving an ACE2-resistant apelin analogue. This is
    the loss-of-function control the field has never published, and it is the experiment that decides
    whether any metabolic GO annotation on this gene is warranted.
  experiment_type: mouse metabolic phenotyping of a knockout
- hypothesis: The opposite coronary phenotypes of Apln-null and Apela-null mice reflect the two ligands
    driving different APLNR output arms rather than different amounts of the same signal.
  description: In sinus-venosus-derived coronary progenitors, compare apelin and ELABELA head to head
    for Gi activation, beta-arrestin recruitment and receptor internalisation at matched occupancy,
    then test whether a G-protein-biased apelin analogue such as WN561 and a beta-arrestin-biased one
    reproduce the Apln-null and Apela-null coronary phenotypes respectively when delivered to the developing
    heart. A bias explanation predicts that the two knockouts can be phenocopied pharmacologically in
    wild-type embryos; a dosage explanation predicts they cannot.
  experiment_type: biased-agonist pharmacology in a developmental model
