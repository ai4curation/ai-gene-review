      receptor. The cryo-EM structures of APLNR-Gi1 complexes with apelin bound make the coupling explicit.
      GO:0007193 is the mechanism-level sibling of GO:0060183 and both belong on a Gi-coupled receptor''s
      ligand; adding it is what makes the record say that apelin is an inhibitory-Gi agonist rather
