  review:
    summary: Central injection of pyroglutamyl-apelin-13 reduced water intake in dehydrated rats; the
      human rows are ortholog transfers of that rat IMP. Automatic Ensembl Compara transfer.
    action: KEEP_AS_NON_CORE
    reason: 'The donor annotation is sound and the transfer is safe at the level of the ligand: rat
      Apln carries GO:0042756 as an IMP from PMID:11359874, whose abstract states that central pE13F
      significantly decreased water intake in dehydrated normotensive rats, and the rat and human apelin-13
      and apelin-17 peptides are identical. The wider picture supports it - apelin inhibits vasopressin
      neuron activity and vasopressin release, and acts as a diuretic counteracting vasopressin (PMID:15231996).
