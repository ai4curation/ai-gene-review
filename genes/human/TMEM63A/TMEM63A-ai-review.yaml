- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: TMEM63A reaches the plasma membrane, where its stretch-activated currents are recorded and
      where it acts in oligodendrocytes.
    action: ACCEPT
    reason: Correct. Note that native TMEM63A is predominantly endolysosomal in several cell types, and
      much of the plasma membrane electrophysiology uses heterologous over-expression; the plasma membrane
      pool is nonetheless real, being reported in native oligodendrocytes and in neutrophil granule/plasma
      membrane proteomics.
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleic acid binding inferred from a structural superfamily match, with no functional basis.
    action: REMOVE
    reason: 'Fold-only electronic inference that is demonstrably inapplicable. The InterPro matches for
      O94886 include SSF54928 ''RNA-binding domain, RBD'' mapping to IPR035979 ''RNA-binding domain superfamily'',
      and IPR012677 ''Nucleotide-binding alpha-beta plait domain superfamily''. Both are homologous-superfamily
      hits on the CSC1/OSCA1-like cytosolic domain (IPR027815), which adopts an RRM-like alpha-beta plait
      fold. An RRM-like fold is a common scaffold and carries no implication of nucleic acid binding on
      its own; no OSCA or TMEM63 protein has ever been reported to bind nucleic acid, and TMEM63A is an
      11-transmembrane integral membrane channel of the lysosomal and plasma membranes. The pipeline is
      not even self-consistent: the paralog TMEM63B, which has the same cytosolic domain, carries no such
      annotation. This is exactly the class of wrong electronic inference that should be removed rather
      than demoted.'
