core_functions:
- molecular_function:
    id: GO:0140135
    label: mechanosensitive monoatomic cation channel activity
  description: TMEM63A forms a monomeric, small-conductance, high-threshold cation channel that opens
    in response to membrane tension and to hypo-osmotic swelling, admitting Ca2+ and other cations. This
    is its single unambiguous molecular function. In oligodendrocytes the resulting Ca2+ transients report
    membrane stretch and are used to match myelin sheath geometry to axon caliber; in alveolar epithelial
    cells the same conductance converts lung inflation into the Ca2+ signal that triggers lamellar body
    exocytosis. The protein retains the structural capacity of its superfamily to open a lipid pathway
    in the same groove, but unlike TMEM63B it does not act as a scramblase in resting cells.
  directly_involved_in:
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0031901
    label: early endosome membrane
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:37543036
    supporting_text: Functional analyses demonstrated that TMEM63s are bona fide mechanosensitive ion
      channels, characterized by small conductance and high thresholds.
  - reference_id: PMID:30382938
    supporting_text: Here, we show that various members of the OSCA and TMEM63 family of proteins from
      plants, flies, and mammals confer mechanosensitivity to naïve cells.
  - reference_id: PMID:41483808
    supporting_text: we identified TMEM63A as a key mechanosensitive channel in oligodendrocytes. TMEM63A
      enabled oligodendrocytes to sense membrane stretch and translate it into Ca2+ signals.
  - reference_id: PMID:38127458
    supporting_text: Activation of TMEM63A/B channels during cell stretch facilitated the release of surfactant
      and ATP from LBs fused with the plasma membrane.
suggested_questions:
- question: Is the NOT|enables phospholipid scramblase annotation on TMEM63A best read as 'this protein
    is not a scramblase' or as 'this protein does not scramble under resting cellular conditions'? Purified
    hTMEM63A translocates lipids in giant unilamellar vesicles and stretched cells expressing mTMEM63A
    expose phosphatidylserine, yet the same 2026 study reports no scrambling in the unstimulated cellular
    context, and the paralog survey that grounds the NOT annotation used a resting pro-B cell assay.
  experts:
  - Katsumori Segawa
  - Charles D Cox
  - Ben Corry
  - Yuta Miyata
- question: If TMEM63A can scramble lipids when sufficiently stretched, does that contribute to the oligodendrocyte
    and lysosomal-morphology phenotypes, which both involve large membrane shape changes? The Neuron 2026
    account is framed purely in terms of Ca2+ signalling.
  experts:
  - Amit Agarwal
  - Charles D Cox
- question: Why does the TMEM63A V53M disease substitution cause a transient hypomyelinating leukodystrophy
    that resolves in childhood, while the homologous TMEM63B V44M causes a progressive epileptic encephalopathy,
    when both substitutions disrupt the same hydrophobic latch and both create constitutive scrambling?
  experts:
  - Wang Zheng
  - Jeffrey R Holt
  - Huanghe Yang
- question: Where does TMEM63A act in oligodendrocytes - at the plasma membrane of the growing sheath,
    or in the endolysosomal compartment where the native protein is most abundant?
  experts:
  - Amit Agarwal
  - Mitra Djannatian
suggested_experiments:
- hypothesis: TMEM63A scrambling is force-gated rather than absent, so the NOT annotation is condition-specific.
  description: Repeat the pro-B cell paralog comparison that grounds the NOT annotation while applying
    calibrated mechanical stimulation (cyclic uniaxial stretch or high-speed pressure clamp) rather than
    assaying at rest, scoring annexin V binding for TMEM63A, TMEM63B and TMEM63C side by side in the same
    Tmem63b-null background.
  experiment_type: comparative cellular scramblase assay under controlled mechanical load
- hypothesis: The oligodendrocyte myelination phenotype depends on TMEM63A ion conduction and not on any
    lipid-translocation activity.
  description: Rescue Tmem63a-null oligodendrocytes with wild-type TMEM63A, with a pore mutant that abolishes
    cation conduction, and with a groove mutant that abolishes lipid translocation while preserving current
    (using the separable bottleneck residues identified by coarse-grained MD), then measure sheath length,
    g-ratio and retraction frequency in vivo.
  experiment_type: structure-function rescue in oligodendrocyte lineage cells
- hypothesis: The nucleic acid binding annotation is a fold artefact with no experimental correlate.
  description: If any confirmation is thought necessary before removal, perform RNA immunoprecipitation
    or CLIP on tagged TMEM63A and an electrophoretic mobility shift assay with the purified CSC1/OSCA1-like
    cytosolic domain. The expected and predicted outcome is no specific nucleic acid binding.
  experiment_type: RNA immunoprecipitation and in vitro binding assay
