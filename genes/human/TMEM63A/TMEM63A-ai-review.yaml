- term:
    id: GO:0017128
    label: phospholipid scramblase activity
  evidence_type: IDA
  original_reference_id: PMID:39716028
  qualifier: enables
  negated: true
  review:
    summary: 'NOT annotation: in a scramblase-null cellular background, human TMEM63A - unlike TMEM63B
      - did not confer phospholipid scrambling.'
    action: ACCEPT
    reason: 'This is a negative assertion (NOT|enables) and it is correct as made. The source study deliberately
      compared paralogs in Tmem63b-deficient pro-B cells and found that scramblase activity tracked with
      TMEM63B orthology rather than with family membership, which is why the paralog carries the positive
      annotation and TMEM63A the negative one. The 2026 reconstitution work initially looks contradictory,
      since purified hTMEM63A does translocate lipids in giant unilamellar vesicles, but the same paper
      states that this is not the case in the cellular context, and reports cellular phosphatidylserine
      exposure only when cells are actively stretched. The two results are therefore about gating state
      rather than identity: TMEM63A retains the structural capacity to scramble but does not do so under
      resting cellular conditions. The V53M channelopathy substitution makes the same point from the other
      direction - it CREATES constitutive scrambling, which presupposes that the wild-type protein does
      not scramble. The NOT annotation is accepted, with the condition-dependence recorded here and the
      unresolved question moved to suggested_questions rather than being used to overturn a curator''s
      IDA.'
    supported_by:
    - reference_id: PMID:39716028
      supporting_text: We expressed human TMEM63 paralogs, TMEM63B orthologs, and plant OSCA1.1 in Tmem63b-deficient
        mouse pro-B cells and found that vertebrate TMEM63B orthologs exhibit scramblase activity at the
        PM.
    - reference_id: PMID:41617699
      supporting_text: Results from our experimental scrambling assays show that WT TMEM63A translocates
        lipids in GUVs but this is not the case in the cellular context.
