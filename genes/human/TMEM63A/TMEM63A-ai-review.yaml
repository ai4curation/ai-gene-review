id: O94886
gene_symbol: TMEM63A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Mechanically activated, Ca2+-permeable cation channel of the TMEM63/OSCA (CSC1) family.
  TMEM63A is an 11-transmembrane protein that, unusually for its structural superfamily, functions as
  a monomer with a single highly restricted pore, and it gates by the force-from-lipids principle: membrane
  stretch or hypo-osmotic swelling opens a small-conductance, high-threshold cation conductance that carries
  Ca2+ into the cell. Native TMEM63A is predominantly endolysosomal, residing in lysosomal and early endosomal
  membranes and in the limiting membrane of alveolar lamellar bodies, but it also reaches the plasma membrane
  in oligodendrocytes and in heterologous expression. In oligodendrocytes it is the mechanosensor that
  lets the cell gauge axon caliber, converting membrane stretch into Ca2+ signals that set myelin sheath
  length and thickness; its loss produces shorter and thinner sheaths on large axons, ectopic myelination
  of very small axons, and increased sheath retraction. In alveolar epithelium TMEM63A acts together with
  TMEM63B to convert lung inflation into the Ca2+ signal that drives lamellar body exocytosis and pulmonary
  surfactant secretion, and in Drosophila and mouse the orthologue shapes lysosomal membrane morphology.
  Heterozygous missense variants in the pore-forming region cause transient infantile hypomyelinating
  leukodystrophy. Unlike its paralog TMEM63B, TMEM63A does not behave as a phospholipid scramblase in
  cells: the purified protein can translocate lipids when reconstituted into vesicles and stretched cells
  expressing it expose phosphatidylserine, but under resting cellular conditions no scrambling is detected,
  and the disease substitution V53M is notable precisely because it confers constitutive scrambling that
  the wild-type protein lacks.'
existing_annotations:
- term:
    id: GO:0005227
    label: calcium-activated cation channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Ca2+-permeable, stretch-gated cation channel annotated with a term that asserts gating by
      Ca2+ binding.
    action: MODIFY
    reason: 'The essence is right - TMEM63A is a Ca2+-permeable cation channel - but the term names the
      wrong gating stimulus. GO:0005227 is defined as a channel that opens ''when a calcium cation has
      been bound by the channel complex or one of its constituent parts'', and every experimental user
      of the term in GOA is a genuinely Ca2+-gated channel (KCNN4, SLO1/SLO2, TRPM4, TMEM16A). TMEM63A
      opens in response to membrane stretch, with Ca2+ as a permeant ion that carries the resulting signal,
      as the oligodendrocyte work states directly. The provenance of the slip is visible in the electronic
      pipeline: the InterPro family behind the IEA row is named ''Calcium permeable stress-gated cation
      channel 1-like'' (IPR045122) yet is mapped to the calcium-activated term, and the same conflation
      sits behind the plant OSCA annotations that seed the phylogenetic node. Replace with the mechanosensitive
      cation channel term plus a plain calcium channel term, which together capture what was measured
      without asserting Ca2+ gating. The identical change is proposed for the paralog TMEM63B.'
    proposed_replacement_terms:
    - id: GO:0140135
      label: mechanosensitive monoatomic cation channel activity
    - id: GO:0005262
      label: calcium channel activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001404773
        source_label: OSCA/TMEM63 ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node correctly captures a conserved stress-gated, Ca2+-permeable cation channel;
          the GO term chosen for it names Ca2+ as the gating ligand instead. The phylogenetic placement
          is not being challenged - only the term.
      - source_id: MGI:MGI:2387609
        source_label: Tmem63b (mouse)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse IDA rests on PMID:31243992, titled 'Overexpression of Osmosensitive Ca(2+)-Permeable
          Channel TMEM63B', which reports Ca2+ permeability and hyperosmolarity gating, not Ca2+-dependent
          gating.
      - source_id: UniProtKB:Q5T3F8
        source_label: TMEM63B (human paralog)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Carries the same term-choice problem; the identical MODIFY is proposed in the TMEM63B
          review.
