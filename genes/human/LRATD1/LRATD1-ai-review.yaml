- id: PMID:16820875
  title: A gene encoding a family with sequence similarity 84, member A (FAM84A) enhanced
    migration of human colon cancer cells.
  full_text_unavailable: true
  findings:
  - statement: >-
      FAM84A was frequently upregulated in colorectal cancer, while its expression
      was not detected across the surveyed normal tissues except testis.
    supporting_text: >-
      Using genome-wide cDNA microarray analysis, we identified a number of genes
      whose expression was up-regulated frequently in colorectal cancer. One of
      these was a gene termed FAM84A that was not expressed in any of the 23 normal
      tissues examined except the testis.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Immunocytochemistry placed FAM84A at a peripheral subcellular membrane region
      specifically away from contacts with neighboring cells.
    supporting_text: >-
      Although immuno-cytochemical staining revealed localization of FAM84A protein
      in the subcellular membrane region, the staining was limited to the region
      lacking attachment with neighboring cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Exogenous FAM84A increased motility in mouse NIH3T3 cells, and Ser38
      phosphorylation was associated with cell morphology.
    supporting_text: >-
      In addition, we found that exogenous FAM84A expression increased cell motility
      in NIH3T3 cells, and that phosphorylation of serine 38 of FAM84A was associated
      with morphology of cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PMID/title and abstract quotes are verified in the local cache. This is the
      principal direct study supporting the localization, motility, and morphology
      annotations, but only the abstract is cached and the motility assay used
      heterologous mouse NIH3T3 cells with exogenous FAM84A.
- id: PMID:21424122
  title: Nuclear receptor CAR-regulated expression of the FAM84A gene during the development
    of mouse liver tumors.
  findings:
  - statement: >-
      In a phenobarbital-promoted mouse liver tumor model, Fam84a induction depended
      on CAR and protein was detected cytoplasmically during tumor development.
    supporting_text: >-
      Western blotting demonstated that FAM84A protein expression increased in mouse
      liver after PB treatment; however, the FAM84A protein in liver and liver tumors
      was not phosphorylated at the serine 38 residue, which has been reported to
      correlate with morphological changes in cells. Immunohistochemistry analysis
      revealed the cytoplasmic localization of FAM84A protein and its expression during
      tumor development in normal tissues (especially in hepatocytes around the central
      vein), eosinophilic foci, adenomas and carcinomas.
    reference_section_type: ABSTRACT
  - statement: >-
      Mouse FAM84A overexpression increased migration in HepG2 but not detectably in
      Huh7 cells, demonstrating a strong cell-context boundary.
    supporting_text: >-
      The migration rates in cells over-expressing FAM84A were significantly higher
      (P<0.01) than in control cells (187±20.9 and 120±17.3, respectively, Fig.
      7B). We also used Huh7 cells for the migration experiment, but a clear difference
      was not observed (data not shown). These data indicate that FAM84A plays an
      important role in acceleration of cell migration, but this depends on the cell
      type.
    reference_section_type: RESULTS
  - statement: >-
      Ser38 phosphorylation was not detected in the mouse liver/cancer contexts,
      limiting generalization of the earlier morphology-associated phosphosite.
    supporting_text: >-
      However, we did not detect serine 38 phosphorylation in over-expressed FAM84A
      protein in cancer cells, or induced FAM84A protein in mouse liver by PB treatment,
      neither in the FAM84A protein expressed in liver tumors.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and quotes are verified. Most expression data concern a
      CAR-dependent mouse liver tumor-promotion model, while the functional assay
      ectopically expressed mouse FAM84A in human liver-cancer cells. The paper's
      speculation connecting the FAM84A alias NSE1 to the Smc5/6-complex Nse1 is a
      naming conflation and is not accepted as evidence for LRATD1 genomic-stability
      function.
