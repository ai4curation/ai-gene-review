- id: PMID:33751775
  title: The direct miR-874-3p-target FAM84A promotes tumor development in papillary
    thyroid cancer.
  findings:
  - statement: >-
      Knockdown of FAM84A reduced migration and invasion in two human papillary
      thyroid cancer cell lines.
    supporting_text: >-
      Collectively, these results indicated that knockdown of FAM84A significantly
      suppressed the migration and invasion ability of PTC cells in vitro.
    reference_section_type: RESULTS
  - statement: >-
      FAM84A appeared mainly cytoplasmic in papillary thyroid cancer cells, while
      knockdown reduced nuclear beta-catenin.
    supporting_text: >-
      Immunofluorescence analysis indicated that FAM84A was mainly located in
      cytoplasm, β‐catenin was located both in cytoplasm and in nuclei, and that
      downregulation of FAM84A inhibited expression of nuclear β‐catenin.
    reference_section_type: RESULTS
  - statement: >-
      Reporter and binding assays supported direct regulation of the FAM84A 3' UTR
      by miR-874-3p in papillary thyroid cancer cells.
    supporting_text: >-
      Then, the dual‐luciferase reporter assay showed that overexpression of
      miR‐874‐3p significantly reduced the relative luciferase activity of the
      wild‐type FAM84A (Fig. 6E,F).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. The perturbation and rescue
      experiments reinforce a role in tumor-cell behavior, but all mechanistic claims
      are bounded to papillary thyroid cancer models; altered EMT/Wnt readouts do not
      demonstrate that LRATD1 is itself a pathway enzyme or direct beta-catenin partner.
- id: PMID:34956690
  title: Binding Affinity Determines Substrate Specificity and Enables Discovery of
    Substrates for N-Myristoyltransferases.
  findings:
  - statement: >-
      Chemical-proteomic labeling identified LRATD1, its paralog LRATD2, and ERICH5
      as candidate human NMT1/2 substrates.
    supporting_text: >-
      However, three proteins LRATD1 (LRAT domain-containing 1, also called FAM84A or
      neurological sensory protein 1 NSE1), LRATD2 (FAM84B/NSE2), and ERICH5
      (glutamate-rich protein 5) demonstrated clear fluorescence signals in the Alk12
      treated samples compared to the control without Alk12 treatment, and the signals
      were hydroxylamine-resistant, suggesting that they are potentially N-myristoylated.
    reference_section_type: RESULTS
  - statement: >-
      NMT inhibition and loss of labeling in Gly2-to-Ala mutants confirmed LRATD1 and
      LRATD2 separately as NMT1/2 substrates.
    supporting_text: >-
      Alk12 labeling signals decreased with the treatment of NMT inhibitor in LRATD1,
      LRATD2, and ERICH5 and were completely removed in G2A mutants, confirming
      LRATD1, LRATD2, and ERICH5 as substrates of NMT1/2 (Figure 4C).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. This is direct evidence that
      overexpressed human LRATD1 can receive an N-terminal myristoyl modification in
      HEK293T cells. It establishes LRATD1 as an NMT substrate, not as a metabolic
      enzyme, and it tests LRATD2 separately rather than licensing paralog transfer.
core_functions: []
knowledge_gaps:
- gap_statement: >-
    The molecular activity of LRATD1 is unknown, including whether its LRAT-like
    domain has any catalytic or noncatalytic ligand-binding function.
  boundary: >-
    LRATD1 contains a sequence-classified LRAT-like domain and affects cell
    morphology and motility in perturbation assays, but no substrate, product,
    catalytic reaction, or direct regulatory mechanism has been demonstrated.
    The domain name alone does not establish retinoid acyltransferase or lipid
    metabolic activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Identifying the molecular activity is necessary to connect the observed cell
    behaviors to a causal biochemical mechanism and to define any core GO-CAM
    activity for LRATD1.
  resolution: >-
    Structure-guided biochemical screening and endogenous interaction analysis,
    coupled to domain- and active-site-residue perturbation, would distinguish
    enzymatic, lipid-binding, and adaptor mechanisms.
  provenance:
  - reference_id: PMID:21424122
    supporting_text: >-
      The physiological function of FAM84A remains unknown, but our results
      suggest that FAM84A is up-regulated by CAR during the development of liver
      tumors, and may play an important role in the progression of liver cancer
      by increasing cell migration.
- gap_statement: >-
    The normal human physiological process controlled by LRATD1 is unknown.
  boundary: >-
    Motility and morphology effects have been reproduced in heterologous
    overexpression and human tumor-cell perturbation systems, but no endogenous
    requirement has been established in a normal human tissue or organoid.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    This gap prevents tumor-associated migration phenotypes from being interpreted
    as the normal evolved function of LRATD1.
  resolution: >-
    Endogenous loss, rescue, and lineage-resolved phenotyping in primary human
    cells from tissues with verified LRATD1 protein expression would establish
    its physiological process.
- gap_statement: >-
    The functional consequence and endogenous prevalence of LRATD1
    N-myristoylation are unknown.
  boundary: >-
    NMT inhibition and Gly2 mutation abolish chemical-proteomic labeling of
    overexpressed LRATD1 in HEK293T cells, establishing it as an NMT substrate,
    but not showing how the modification changes localization or activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Myristoylation could explain the peripheral cytoplasmic localization and
    context-dependent motility phenotype, but that causal link remains untested.
  resolution: >-
    Endogenous N-terminal proteomics and wild-type versus G2A rescue experiments
    should test modification occupancy, membrane association, partner selection,
    and motility effects.
  provenance:
  - reference_id: PMID:34956690
    supporting_text: >-
      Alk12 labeling signals decreased with the treatment of NMT inhibitor in
      LRATD1, LRATD2, and ERICH5 and were completely removed in G2A mutants,
      confirming LRATD1, LRATD2, and ERICH5 as substrates of NMT1/2 (Figure 4C).
- gap_statement: >-
    The expression, localization, molecular activity, and biological effects of
    LRATD1 isoform 2 are unknown.
  boundary: >-
    Isoform 2 retains Gly2 and Ser38 but replaces residues 146-292, disrupting
    most of the annotated residues 133-228 LRAT-like domain; published functional
    studies do not identify which isoform was tested endogenously.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The large domain-disrupting alternative segment could create substantial
    isoform-specific behavior, so shared-function assumptions are unsafe.
  resolution: >-
    Isoform-specific RNA and N-terminal/C-terminal proteomics followed by
    endogenous-locus isoform rescue would establish expression and functional
    differences.
- gap_statement: >-
    No endogenous molecular partner has been validated for LRATD1.
  boundary: >-
    Binary screens report ARHGEF5, cytoglobin, and ATXN10 contacts, but these
    unrelated candidates have not been shown to form endogenous, functional
    complexes with LRATD1.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Partner validation may reveal whether LRATD1 is an adaptor or regulator and
    could connect its peripheral localization to morphology and motility.
  resolution: >-
    Endogenous reciprocal co-immunoprecipitation, proximity labeling, and
    interaction-dependent rescue should test the screen candidates and discover
    context-specific partners without assuming stable-complex membership.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does the LRAT-like domain of LRATD1 catalyze any reaction, bind a defined
    lipid or protein ligand, or instead provide a noncatalytic structural module?
- question: >-
    Is endogenous LRATD1 required for morphology or motility in any normal human
    cell lineage, and how does that function differ from tumor-cell phenotypes?
- question: >-
    Does Gly2-dependent N-myristoylation control LRATD1 peripheral localization,
    partner selection, stability, or motility effects?
- question: >-
    Which of the reported ARHGEF5, cytoglobin, and ATXN10 screen contacts are
    endogenous and functionally relevant, if any?
- question: >-
    Is LRATD1 isoform 2 expressed as a stable protein, and does disruption of most
    of the LRAT-like domain change localization or function?
suggested_experiments:
- hypothesis: >-
    LRATD1 uses its LRAT-like domain as a noncatalytic interaction module rather
    than as a retinoid or lipid acyltransferase.
  description: >-
    Purify the folded domain and screen retinoid, phospholipid, and acyl-donor
    panels by orthogonal activity and binding assays, including catalytic-residue
    candidates and domain-disrupting controls. In parallel, compare endogenous
    partner proteomes after acute deletion of the domain.
  experiment_type: biochemistry and proteomics
- hypothesis: >-
    N-myristoylation targets LRATD1 to a peripheral cytoplasmic membrane-associated
    pool required for its effects on cell motility.
  description: >-
    Introduce an endogenous Gly2-to-Ala mutation and an acute LRATD1 degron in
    human tumor cells with verified expression. Measure N-myristoylation by
    N-terminal proteomics, membrane partitioning by fractionation and live-cell
    imaging, and migration after rescue with wild-type or G2A LRATD1.
  experiment_type: cell biology and chemical proteomics
- hypothesis: >-
    LRATD1 controls a conserved morphology/motility program only in selected cell
    states rather than universally.
  description: >-
    Perform matched endogenous knockout and rescue across normal primary cells
    and colorectal, thyroid, and liver tumor models, quantifying morphology,
    adhesion, single-cell migration, invasion, and immediate signaling changes.
    Use acute degradation to separate primary from transcriptionally secondary
    effects.
  experiment_type: comparative functional genomics
- hypothesis: >-
    One or more interaction-screen candidates mediate the LRATD1 motility phenotype.
  description: >-
    Test endogenous LRATD1 contacts with ARHGEF5, cytoglobin, and ATXN10 using
    reciprocal affinity purification, proximity labeling, and microscopy, then
    disrupt each contact by endogenous interface mutation and assess rescue of
    motility and morphology.
  experiment_type: interaction proteomics
- hypothesis: >-
    LRATD1 isoform 2 is a stable, functionally distinct protein because its
    alternative C terminus disrupts most of the LRAT-like domain.
  description: >-
    Quantify isoform-specific transcripts and unique peptides across normal and
    tumor tissues, then compare endogenous-locus isoform-1 and isoform-2 rescue
    for stability, myristoylation, localization, partner proteomes, and cell
    behavior.
  experiment_type: isoform-resolved proteomics
