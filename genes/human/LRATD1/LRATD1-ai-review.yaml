id: Q96KN4
gene_symbol: LRATD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRATD1, historically called FAM84A, is a small cytoplasmic protein with an
  LRAT-like domain and a peripheral distribution that is enriched away from
  cell-cell contacts in colorectal-cancer cells. Human LRATD1 can receive an
  N-terminal Gly2-dependent myristoyl modification from NMT1/2 in HEK293T-cell
  assays. Exogenous expression increases motility in mouse NIH3T3 fibroblasts,
  and Ser38 phosphorylation has been associated with altered cell morphology;
  migration effects vary by cell type. Loss-of-function experiments in human
  papillary-thyroid-cancer cells also reduce migration and invasion. These data
  establish a context-dependent relationship to cell morphology and motility,
  but the molecular activity and normal-tissue physiological role of LRATD1 are
  unknown. The LRAT-like domain has not been shown to catalyze retinoid or lipid
  metabolism. Two human isoforms are recorded; isoform 2 replaces most of the
  annotated LRAT-like domain with an alternative C terminus, and its expression
  and function have not been characterized.
