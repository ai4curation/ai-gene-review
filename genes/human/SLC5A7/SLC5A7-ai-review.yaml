      supporting_text: 'the choline uptake and

        choline-induced current are Na+ and Cl- dependent'
    - reference_id: PMID:40972734
      supporting_text: 'SLC5A7 displayed over tenfold higher intrinsic

        clearance than any of the others.'
    proposed_replacement_terms:
    - id: GO:0005307
      label: choline:sodium symporter activity
