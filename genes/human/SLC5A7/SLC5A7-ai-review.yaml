    label: acetylcholine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1927126
  - PANTHER:PTN000929655
  - RGD:69270
  - UniProtKB:Q9GZV3
  review:
    summary: CHT1 supplies choline through the uptake step of acetylcholine biosynthesis.
    action: ACCEPT
    reason: 'The transporter itself performs substrate delivery into the presynaptic biosynthetic compartment.
      This established upstream transport contribution supports involvement in the multistep biosynthetic
      process even though CHAT, rather than CHT1, catalyses acetyl transfer. The original human expression
      studies and neuromuscular disease experiments corroborate the role. Original ancestral source: PANTHER:PTN000929655.'
    supported_by:
    - reference_id: PMID:11068039
      supporting_text: 'Na(+)-dependent, high-affinity choline uptake in cholinergic neurons is the

        rate-limiting step in acetylcholine synthesis.'
    - reference_id: PMID:27569547
