- term:
    id: GO:0006836
    label: neurotransmitter transport
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-264642
  qualifier: involved_in
  review:
    summary: The release-cycle pathway includes choline uptake, but CHT1 does not thereby transport acetylcholine.
    action: MARK_AS_OVER_ANNOTATED
    reason: Reactome R-HSA-264642 includes synthesis, loading and release as well as precursor uptake.
      CHT1 performs choline uptake for resynthesis; the cited pathway membership does not itself establish
      movement of the acetylcholine transmitter specified by this cycle. Retain the actual choline-transport
      and cholinergic-transmission claims. This is a scope problem in the broad process projection, not
      evidence that the transporter lacks its established physiological contribution.
    supported_by:
    - reference_id: Reactome:R-HSA-264642
    - reference_id: PMID:11027560
      supporting_text: 'Expression of hCHT cDNA in COS-7 cells

        results in saturable, Na(+)/Cl(-)-dependent choline uptake'
    - reference_id: PMID:17005849
      supporting_text: 'the choline uptake and

        choline-induced current are Na+ and Cl- dependent'
- term:
    id: GO:0007271
    label: synaptic transmission, cholinergic
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1927126
  - PANTHER:PTN002913667
  review:
    summary: Choline replenishment is a performed step in cholinergic synaptic transmission.
    action: ACCEPT
    reason: 'SLC5A7 transports the precursor into presynaptic terminals for repeated acetylcholine synthesis.
      Human congenital myasthenic physiology is paired with direct mutant uptake measurements, so participation
      is grounded in a transport step and not solely a loss-of-function phenotype. Neuromuscular transmission
      is one demonstrated context of this conserved cholinergic role. Original ancestral source: PANTHER:PTN002913667.'
    supported_by:
    - reference_id: PMID:27569547
      supporting_text: Specific CHT-mediated choline uptake was severely impaired for all mutants tested
    - reference_id: PMID:11027560
      supporting_text: 'Expression of hCHT cDNA in COS-7 cells

        results in saturable, Na(+)/Cl(-)-dependent choline uptake'
