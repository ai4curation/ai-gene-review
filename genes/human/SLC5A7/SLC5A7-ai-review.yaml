  review:
    summary: CHT1 has a conserved somatodendritic pool in addition to terminal enrichment.
    action: ACCEPT
    reason: 'The rat motor-unit study explicitly localizes CHT1 to perikaryon, dendrites and axon by immunohistochemistry.
