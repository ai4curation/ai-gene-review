id: Q9GZV3
gene_symbol: SLC5A7
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC5A7 (CHT1) is a high-affinity, sodium-dependent choline transporter that replenishes the
  cytosolic choline used by choline acetyltransferase in cholinergic neurons. Uptake is electrogenic and
  chloride dependent. The protein cycles between the presynaptic plasma membrane, early endosomes and
  synaptic vesicles; the intracellular pool regulates availability of active transporter at the cell surface.
  Human variants that impair choline uptake cause motor-neuron disease or congenital myasthenic syndrome
  with episodic apnea. Choline transport, rather than acetylcholine transport or acetylation, is its immediate
  molecular activity.
existing_annotations:
- term:
    id: GO:0005307
    label: choline:sodium symporter activity
  evidence_type: EXP
  original_reference_id: PMID:11027560
  qualifier: enables
  review:
    summary: CHT1 directly couples choline uptake to sodium-dependent transport.
    action: ACCEPT
    reason: Human cDNA expression and uptake assays establish the reaction, while voltage clamp distinguishes
      electrogenic uptake from a fixed charge-to-substrate stoichiometry. The original uptake, variant
      and topology studies reinforce this same activity. Chloride dependence is real, but the older ion-substitution
      study interpreted chloride as regulatory; no fixed chloride cotransport ratio is asserted.
    supported_by:
    - reference_id: PMID:11027560
      supporting_text: 'Expression of hCHT cDNA in COS-7 cells

        results in saturable, Na(+)/Cl(-)-dependent choline uptake'
    - reference_id: PMID:17005849
      supporting_text: 'the choline uptake and

        choline-induced current are Na+ and Cl- dependent'
