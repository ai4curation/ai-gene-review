- term:
    id: GO:0015220
    label: choline transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:11027560
  qualifier: enables
  review:
    summary: The supported choline transporter is specifically a sodium-coupled symporter.
    action: MODIFY
    reason: The broad choline-transporter term is correct, but direct human ion-dependence and uptake
      experiments warrant the already-present choline:sodium symporter activity. The 2025 comparative
      transport study additionally confirms SLC5A7 uptake capacity; its cell-system kinetic estimates
      need not equal older estimates in different preparations.
    supported_by:
    - reference_id: PMID:11027560
      supporting_text: 'Expression of hCHT cDNA in COS-7 cells

        results in saturable, Na(+)/Cl(-)-dependent choline uptake'
