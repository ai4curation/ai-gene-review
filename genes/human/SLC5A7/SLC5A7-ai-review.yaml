    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1927126
  - PANTHER:PTN002913658
  - RGD:69270
  - UniProtKB:Q9GZV3
  review:
    summary: CHT1 has an active plasma-membrane pool.
    action: ACCEPT
    reason: 'The human transporter produces cell-surface uptake, and human mutant imaging plus native
      neuromuscular-junction staining independently supports the surface pool. Constitutive internalization
      does not negate plasma-membrane localization. Reactome transport reactions refer to this uptake
      step rather than an intracellular-vesicle transport mechanism. Original ancestral source: PANTHER:PTN002913658.'
    supported_by:
    - reference_id: PMID:27569547
      supporting_text: We observed CHT membrane immunolabeling for the five investigated missense mutations
    - reference_id: file:human/SLC5A7/SLC5A7-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'Localization at the plasma membrane is transient due

        CC       to the rapid endocytosis of SLC5A7/CHT1 via the clathrin-mediated

        CC       pathway'
