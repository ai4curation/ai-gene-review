id: P21741
gene_symbol: MDK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MDK encodes midkine, a secreted heparin- and chondroitin-sulfate-binding growth factor of
  the pleiotrophin family. The mature extracellular ligand binds glycosaminoglycan-bearing receptor complexes
  including PTPRZ1, glypican/syndecan proteoglycans, integrins, ALK, LRP-family receptors, and NOTCH2
  to control adhesion, migration, survival and inflammatory recruitment in cell-type-specific contexts.'
alternative_products:
- name: '1'
  id: P21741-1
- name: 2 (tMKA)
  id: P21741-2
  sequence_note: VSP_047452
existing_annotations:
- term:
    id: GO:0001662
    label: behavioral fear response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P12025
  - ensembl:ENSMUSP00000068413
  review:
    summary: behavioral fear response overstates a tissue, phenotype, or generic signaling 
      consequence of MDK ligand activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: MDK is a secreted glycosaminoglycan-binding growth factor, but this annotation is an 
      orthology-only or generic downstream phenotype that does not identify a direct human MDK 
      activity in the named process.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: UniProtKB:P12025
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Orthology or rule transfer to human MDK supports the conserved secreted 
          growth-factor activity better than this high-level tissue, phenotype, or generic signaling
          context.
      - source_id: ensembl:ENSMUSP00000068413
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Orthology or rule transfer to human MDK supports the conserved secreted 
          growth-factor activity better than this high-level tissue, phenotype, or generic signaling
          context.
    supported_by:
    - reference_id: file:genes/human/MDK/MDK-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: In addition plays a role in hippocampal development, working memory, auditory
        response, early fetal adrenal gland development and the female reproductive system (By 
        similarity).
    - reference_id: file:genes/human/MDK/MDK-notes.md
      supporting_text: Orthology-only transfers for high-level mouse behavioral, reproductive, 
        adrenal, auditory, brain-region-development, and generic transcription/signaling phenotypes 
        were treated as over-annotations
- term:
    id: GO:0002232
    label: leukocyte chemotaxis involved in inflammatory response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P12025
  - ensembl:ENSMUSP00000068413
  review:
    summary: leukocyte chemotaxis involved in inflammatory response is a supported downstream or 
      tissue-context effect of MDK ligand signaling.
    action: KEEP_AS_NON_CORE
    reason: 'This row is kept as non-core: MDK is a secreted growth factor and cytokine, and the process
      reflects a receptor-mediated cellular response or injury/developmental context rather than a separate
      molecular activity of the ligand.'
    supported_by:
    - reference_id: file:genes/human/MDK/MDK-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: mediates neutrophils and macrophages recruitment to the sites of inflammation
