- term:
    id: GO:0007162
    label: negative regulation of cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P12025
  - ensembl:ENSMUSP00000068413
  review:
    summary: negative regulation of cell adhesion is the opposite direction
      from the accessible MK-glypican-2 adhesion evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The MK-glypican-2 study supports induction of N2a adhesion and neurite
      outgrowth, not inhibition of adhesion. MDK can regulate adhesion
      downstream of heparan-sulfate receptors, but this opposite-polarity
      mouse projection is not supported by the row's cited evidence.
    supported_by:
    - reference_id: PMID:12084985
      supporting_text: Substratum-bound MK or poly-L-lysine induced cell adhesion
