- term:
    id: GO:0002286
    label: T cell activation involved in immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P12025
  - ensembl:ENSMUSP00000068413
  review:
    summary: T cell activation involved in immune response is a supported downstream or 
      tissue-context effect of MDK ligand signaling.
    action: KEEP_AS_NON_CORE
    reason: 'This row is kept as non-core because the T-cell effect is supported through MDK modulation
      of dendritic cells and NFAT/Th1 signaling, but remains an immune branch downstream of the extracellular
      cytokine/growth-factor activity.'
    supported_by:
    - reference_id: file:genes/human/MDK/MDK-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: suppresses the development of tolerogenic dendric cells thereby inhibiting 
        the differentiation of regulatory T cells and also promote T cell expansion through NFAT 
        signaling and Th1 cell differentiation
