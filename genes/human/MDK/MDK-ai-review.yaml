- term:
    id: GO:1904399
    label: heparan sulfate binding
  evidence_type: IDA
  original_reference_id: PMID:12084985
  qualifier: enables
  review:
    summary: MDK is a secreted heparin/chondroitin-sulfate-binding growth factor; heparan sulfate 
      binding fits its conserved ligand function.
    action: ACCEPT
    reason: MDK is cleaved and secreted, then acts as a glycosaminoglycan-binding growth factor for 
      PTPRZ1, GPC2/SDC3, integrin, ALK, LRP and NOTCH receptor contexts. This annotation captures 
      the core extracellular ligand activity or location rather than a tissue-specific outcome.
    supported_by:
    - reference_id: file:genes/human/MDK/MDK-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Secreted protein that functions as a cytokine and growth factor
    - reference_id: PMID:9384573
      supporting_text: Basic residues on the beta-sheet of the C-terminal domain form another 
        heparin-binding site
