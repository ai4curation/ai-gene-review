    supporting_text: >-
      MDK- or PTN-binding promotes oligomerization of the enzyme, inhibiting
      its catalytic activity
  - reference_id: Reactome:R-HSA-9700121
    supporting_text: >-
      PTN- and MDK-binding to the chondroitin sulphate moieties of PTPRZ
      promote oligomerization of the phosphatase
  - reference_id: file:genes/human/MDK/MDK-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Interacts (via C-terminal) with PTPRZ1 (via chondroitin sulfate chains)
suggested_questions:
- question: Should GO add or use receptor-specific binding terms for PTPRZ-bearing 
    chondroitin-sulfate proteoglycans so MDK/PTN ligand functions can be curated more specifically 
    than growth factor activity?
- question: Which mouse Mdk phenotype transfers identify direct extracellular ligand effects and 
    which should be represented only in pathway models downstream of the receptors?
suggested_experiments:
- description: Compare endogenous MDK-dependent PTPRZ clustering and phosphatase inhibition in human
    neural or oligodendrocyte-lineage cells with matched PTPRZ chondroitin-sulfate editing to 
    separate MDK-specific from PTN-specific receptor contexts.
