core_functions:
- description: Acts extracellularly as a heparin/heparan-sulfate/chondroitin-sulfate-binding
    growth factor and cytokine that engages proteoglycan and non-proteoglycan
    receptors, including PTPRZ1, glypican-2, syndecan-3, integrins and
    LRP-family receptor complexes.
  molecular_function:
    id: GO:0008083
    label: growth factor activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: file:genes/human/MDK/MDK-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Secreted protein that functions as a cytokine and growth factor
  - reference_id: PMID:9384573
    supporting_text: Basic residues on the beta-sheet of the C-terminal domain form another 
      heparin-binding site
  - reference_id: file:genes/human/MDK/MDK-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Interacts (via C-terminal) with PTPRZ1 (via chondroitin sulfate chains)
- description: >-
    Inhibits chondroitin-sulfate-modified PTPRZ receptor phosphatase activity
    by binding the receptor ectodomain and promoting PTPRZ oligomerization,
    linking the extracellular glycosaminoglycan-binding ligand to ALK tyrosine
    phosphorylation and downstream signaling.
  molecular_function:
