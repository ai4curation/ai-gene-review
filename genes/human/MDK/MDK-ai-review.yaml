- term:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9700120
  qualifier: enables
  review:
    summary: >-
      MDK inhibits PTPRZ protein-tyrosine-phosphatase activity by clustering
      chondroitin-sulfate-modified PTPRZ receptor complexes.
    action: NEW
    reason: >-
      Reactome models MDK and PTN as extracellular ligands that bind the
      chondroitin-sulfate chains on PTPRZ, cluster the receptor, and inhibit
      its catalytic activity. The direct MDK-PTPRZ chondroitin-sulfate
      interaction is already supported in the MDK UniProt record, so protein
      phosphatase inhibitor activity captures this receptor-specific branch
      more precisely than generic growth factor activity alone.
    supported_by:
    - reference_id: Reactome:R-HSA-9700120
      supporting_text: >-
        MDK- or PTN-binding promotes oligomerization of the enzyme, inhibiting
        its catalytic activity
    - reference_id: file:genes/human/MDK/MDK-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts (via C-terminal) with PTPRZ1
- term:
    id: GO:0007185
    label: cell surface receptor protein tyrosine phosphatase signaling pathway
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9700121
  qualifier: involved_in
  review:
    summary: >-
      MDK acts in PTPRZ receptor signaling by binding and clustering the
      chondroitin-sulfated receptor.
    action: NEW
    reason: >-
      Reactome places MDK at the PTPRZ ligand step and the following
      PTPRZ-oligomerization step. Because MDK binding inhibits PTPRZ and
      increases ALK tyrosine phosphorylation downstream, this row records the
      direct receptor protein tyrosine phosphatase signaling context of the
      extracellular ligand.
    supported_by:
    - reference_id: Reactome:R-HSA-9700121
      supporting_text: >-
        PTN- and MDK-binding to the chondroitin sulphate moieties of PTPRZ
        promote oligomerization of the phosphatase
    - reference_id: Reactome:R-HSA-9700120
      supporting_text: >-
        Binding of PTN and MDK to PTPRZ therefore results in increased ALK
        tyrosine phosphorylation
