core_functions:
- description: Component of the MKS/tectonic transition-zone complex. It is required for MKS1 and TMEM67
    to localize to the transition zone, for tissue-specific ciliogenesis, and for the diffusion barrier
    that keeps membrane proteins in or out of the cilium. No specific molecular activity has been defined.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - *id004
  - *id003
  - *id008
  - *id006
  - reference_id: PMID:21725307
    supporting_text: Cell types that do not require Tctn1 for ciliogenesis require it to localize select
      membrane-associated proteins to the cilium, including Arl13b, AC3, Smoothened and Pkd2.
suggested_questions:
- question: What is the topology of TCTN1 at the transition zone? Is it held at the extracellular or lumenal
    face by binding to TCTN2/TMEM216/TMEM67, and is any of it secreted in vivo?
- question: Is the Hedgehog phenotype of Tctn1 mutants entirely explained by loss of ciliary Smoothened
    and ARL13B, or does TCTN1 have a separate signaling role?
suggested_experiments:
- description: Map TCTN1 topology at the transition zone with protease-protection and surface-labelling
    assays on non-permeabilized ciliated cells, and test for secreted TCTN1 in conditioned medium from
    cells expressing untagged endogenous protein.
- description: Combine domain-deletion rescue of Tctn1-null MEFs with assays for MKS1/TMEM67 recruitment
    and ciliary Smoothened entry to map the parts of TCTN1 needed for complex assembly versus gate function.
