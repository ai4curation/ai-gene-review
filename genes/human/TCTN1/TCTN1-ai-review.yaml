  - MGI:MGI:3603820
  - PANTHER:PTN002307865
  review:
    summary: Cilium assembly (IBA; IEA and ISS from mouse Tctn1).
    action: ACCEPT
    reason: Tctn1 is essential for ciliogenesis in a tissue-specific manner in mouse (Garcia-Gonzalo et
      al. 2011), and the MKS module establishes early basal body/transition zone membrane attachment during
      ciliogenesis. As a structural component of the transition zone, TCTN1 contributes directly to building
      the ciliary base, and this is an appropriate process annotation. A more specific term, ciliary transition
      zone assembly (GO:1905349), would also be justified but the existing term is acceptable.
    supported_by:
    - reference_id: PMID:21725307
      supporting_text: found that it is essential for ciliogenesis in some, but not all, tissues
