  review:
    summary: UniProt subcellular-location mapping (Secreted, by curator inference from the signal peptide)
      to extracellular region.
    action: MARK_AS_OVER_ANNOTATED
    reason: TCTN1 has an N-terminal signal peptide. The founding Tectonic paper described the family as
      secreted and transmembrane proteins. However, UniProt notes that the full-length protein might not
      be secreted. Endogenous and tagged TCTN1 concentrates at the ciliary transition zone as part of
      a membrane-spanning MKS/tectonic complex. Secretion of native full-length TCTN1 has not been demonstrated,
      so extracellular region overstates the evidence.
    supported_by:
    - &id001
      reference_id: PMID:21725307
      supporting_text: Tctn1 belongs to a family of signal sequence-containing proteins conserved among
        eukaryotes that generate cilia or flagella.
    - reference_id: PMID:16357211
      supporting_text: This protein, named Tectonic, is the founding member of a previously undescribed
        family of evolutionarily conserved secreted and transmembrane proteins.
    - &id002
      reference_id: PMID:21725307
      supporting_text: We demonstrate that Tctn1 forms a membrane-spanning transition zone complex with
        JBTS and MKS proteins, and identify human TCTN1 as a novel JBTS gene.
