core_functions:
- description: Luminal/extracellular-facing component of the MKS (tectonic) module at the ciliary transition
    zone; contributes to assembly of the transition-zone gate that supports ciliogenesis and confines
    membrane proteins (e.g. ARL13B, SMO, PKD2) to the ciliary membrane. No defined molecular activity
    is known.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
