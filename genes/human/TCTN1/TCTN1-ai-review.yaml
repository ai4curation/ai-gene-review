    id: GO:1904491
    label: protein localization to ciliary transition zone
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:3603820
  - PANTHER:PTN002684890
  review:
    summary: Protein localization to ciliary transition zone (IBA, IEA from mouse, NAS from Chih et al.
      2011).
    action: ACCEPT
    reason: Localization of MKS-module components to the transition zone is interdependent (Chih et al.
      2011), and Tctn1 is required for localization of ciliary membrane proteins (Garcia-Gonzalo et al.
      2011). The IBA reflects a conserved role of tectonic proteins in assembling the TZ gate. Accepted,
      although this is best regarded as part of transition-zone assembly rather than a separable transport
      activity.
