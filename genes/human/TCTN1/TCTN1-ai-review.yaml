taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TCTN1 (tectonic-1) is a conserved signal-peptide protein of the tectonic family. It is a
  component of the MKS (tectonic-like) complex at the ciliary transition zone, together with TCTN2, TCTN3,
  MKS1, TMEM216, TMEM67, B9D1, CC2D2A and CEP290. This membrane-spanning assembly acts as a diffusion
  barrier that keeps the ciliary membrane a distinct signaling compartment. TCTN1 is required for MKS1
  and TMEM67 to reach the transition zone, for ciliogenesis in some tissues such as the embryonic node
  and neural tube, and for ciliary localization of membrane-associated proteins such as ARL13B, adenylyl
  cyclase 3, Smoothened and PKD2. Through these ciliary roles it is needed for full Hedgehog pathway activation
  and repression in the neural tube and limb, acting downstream of Smoothened and RAB23. A TCTN1 mutation
  causes Joubert syndrome.
