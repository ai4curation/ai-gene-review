    label: ciliary transition zone
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - reference_id: PMID:21725307
    supporting_text: Tctn1 forms a complex with multiple ciliopathy proteins associated with Meckel and
      Joubert syndromes, including Mks1, Tmem216, Tmem67, Cep290, B9d1, Tctn2 and Cc2d2a
  - reference_id: PMID:21725307
    supporting_text: Components of this complex co-localize at the transition zone, a region between the
      basal body and ciliary axoneme
  - reference_id: PMID:21725307
    supporting_text: Cell types that do not require Tctn1 for ciliogenesis require it to localize select
      membrane-associated proteins to the cilium, including Arl13b, AC3, Smoothened and Pkd2
  - reference_id: PMID:22179047
    supporting_text: acts as a diffusion barrier to maintain the cilia membrane as a compartmentalized
      signalling organelle
  - reference_id: file:human/TCTN1/TCTN1-deep-research-falcon.md
    supporting_text: The supported model is that a TCTN1-containing complex slows lateral membrane-protein
      diffusion sufficiently for active sorting systems to remove inappropriate cargo.
suggested_questions:
- question: How is TCTN1, which lacks a transmembrane segment, retained at the transition zone - by direct
    binding to TCTN2/TCTN3 or TMEM-family MKS-module subunits on the luminal side of the ciliary membrane?
- question: Is any free TCTN1 secreted from cells, and if so does the extracellular pool have a function
    distinct from the transition-zone pool?
- question: Does the Hedgehog-pathway phenotype of Tctn1 mutants reflect anything beyond loss of ciliary
    SMO/ARL13B gating, i.e. is a direct Hedgehog-signalling role for TCTN1 needed to explain its dual
    activator/repressor phenotype?
suggested_experiments:
- description: Super-resolution (expansion or STED) mapping of endogenous TCTN1 relative to TCTN2, TMEM67
    and MKS1 in RPE-1 cells, combined with protease-protection assays, to establish its luminal topology
    at the transition zone.
  experiment_type: super-resolution microscopy
- description: TCTN1 knockout RPE-1 or IMCD3 cells rescued with signal-peptide or N-glycosylation mutants
    to test which features are required for transition-zone retention and ciliary membrane gating (SMO,
    ARL13B, INPP5E ciliary levels).
  experiment_type: genetic rescue
