id: Q2MV58
gene_symbol: TCTN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Tectonic-1 (TCTN1) is a signal-peptide-bearing protein of the tectonic family (with TCTN2
  and TCTN3) that lacks a transmembrane segment and is a component of the MKS (tectonic-like) module of
  the primary cilium transition zone. Together with MKS1, B9D1, B9D2, CC2D2A, TMEM67, TMEM216, TMEM231
  and TCTN2 it forms a transition-zone complex that acts as a ciliary gate, establishing membrane-to-axoneme
  connections at the ciliary base and restricting diffusion of membrane proteins between the plasma membrane
  and the ciliary membrane. Loss of Tctn1 in mouse disrupts ciliogenesis in some tissues and, in others,
  prevents ciliary accumulation of membrane proteins such as ARL13B, adenylyl cyclase III, Smoothened
  and polycystin-2, causing defective Hedgehog signalling and ventral neural tube patterning. Biallelic
  TCTN1 mutations cause Joubert syndrome (JBTS13).
