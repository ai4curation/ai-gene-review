  review:
    summary: Extracellular region, inferred electronically (combined IEA) from the mouse ortholog and
      the UniProt 'Secreted' keyword.
    action: KEEP_AS_NON_CORE
    reason: TCTN1 has an N-terminal signal peptide (residues 1-22) and no transmembrane segment, and the
      founding Tectonic paper describes the family as secreted and transmembrane proteins. Topologically
      TCTN1 therefore sits on the luminal/extracellular face of membranes, which is consistent with this
      term. However, UniProt notes the full-length protein might not be secreted, and the functionally
      relevant pool is the one retained at the ciliary transition zone as part of the MKS/tectonic complex
      (Garcia-Gonzalo et al. 2011). Kept as a non-core location.
    supported_by:
    - reference_id: PMID:16357211
      supporting_text: founding member of a previously undescribed family of evolutionarily conserved
        secreted and transmembrane proteins
    - reference_id: PMID:21725307
      supporting_text: Components of this complex co-localize at the transition zone, a region between
        the basal body and ciliary axoneme
