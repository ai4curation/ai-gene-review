core_functions:
- description: Leucine-accepting tRNA that reads the UUA and UUG (UUR) leucine codons of
    mtDNA-encoded mRNAs on the mitoribosome, delivering leucine during mitochondrial
    translation. Efficient UUG reading depends on the taurine modification at the wobble uridine.
  molecular_function:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  directly_involved_in:
  - id: GO:0032543
    label: mitochondrial translation
  supported_by:
  - reference_id: PMID:15477592
    supporting_text: the WT mt tRNA Leu(UUR) was efficient in decoding both the UUA and UUG codons
      and showed no activity with the UUC noncognate codon.
  - reference_id: PMID:12549915
    supporting_text: The combined effects of the reductions in the steady-state levels and the
      aminoacylated fraction of tRNA(Leu(UUR)) are likely to contribute to the decreases in the
      rates of mitochondrial translation observed in mutant cells.
suggested_questions:
- question: Should GO curators annotate mtDNA-encoded tRNAs (RNAcentral ids) directly to mitochondrial
    translation rather than relying on the generic Rfam-derived translation inference?
  experts:
  - GO RNA annotation curators
- question: Does the reduced UUA decoding seen with native m.3243A>G tRNA (beyond the UUG defect of
    an unmodified wild-type tRNA) reflect the D-loop mutation's effect on tRNA structure, ribosome
    interaction, or EF-Tu binding?
  experts:
  - mitochondrial translation biochemists
suggested_experiments:
- description: Mitoribosome profiling in m.3243A>G cybrids at graded heteroplasmy to quantify
    UUG versus UUA codon-specific stalling in each mtDNA-encoded mRNA.
  experiment_type: ribosome profiling
  hypothesis: Translation of UUG-rich mtDNA ORFs (notably ND subunits) is preferentially stalled,
    explaining complex I deficiency in MELAS.
