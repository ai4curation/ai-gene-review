- id: PMID:15477592
  title: Codon-specific translational defect caused by a wobble modification deficiency in
    mutant tRNA from a human mitochondrial disease.
  findings:
  - statement: Wild-type mt tRNA-Leu(UUR) decodes both UUA and UUG codons in an in vitro
      mitochondrial translation system and binds both codons at the ribosomal A site.
    supporting_text: the WT mt tRNA Leu(UUR) was efficient in decoding both the UUA and UUG
      codons and showed no activity with the UUC noncognate codon.
  - statement: Removing the wobble taurine modification alone gives a UUG-specific decoding
      defect.
    supporting_text: This "operated" mt tRNA(Leu(UUR)) without the taurine modification showed
      severely reduced UUG translation but no decrease in UUA translation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Kirino et al. 2004 PNAS); full text cached; directly measures
      codon decoding by native and modified tRNA-Leu(UUR).
- id: PMID:10660592
  title: Modification defect at anticodon wobble nucleotide of mitochondrial tRNAs(Leu)(UUR)
    with pathogenic mutations of mitochondrial myopathy, encephalopathy, lactic acidosis, and
    stroke-like episodes.
  findings:
  - statement: MELAS 3243 and 3271 mutant tRNAs are less stable and lack the wobble uridine
      modification, but are still accurately charged with leucine.
    supporting_text: accurate aminoacylation with leucine without any misacylation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Yasukawa et al. 2000 JBC).
- id: PMID:12549915
  title: The pathogenic A3243G mutation in human mitochondrial tRNALeu(UUR) decreases the efficiency
    of aminoacylation.
  findings:
  - statement: tRNA-Leu(UUR) is charged by human mitochondrial leucyl-tRNA synthetase; the native
      A3243G tRNA is aminoacylated about 25-fold less efficiently.
    supporting_text: Native A3243G mutant tRNA(Leu(UUR)) was 25-fold less efficiently aminoacylated
      in vitro, compared to native wild-type tRNA(Leu(UUR)).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Park, Davidson and King 2003 Biochemistry).
- id: PMID:15893315
  title: Wobble modification deficiency in mutant tRNAs in patients with mitochondrial diseases.
  findings:
  - statement: The wobble modification deficiency of MELAS tRNA-Leu(UUR) is seen across nuclear
      backgrounds and in patient tissues.
    supporting_text: The wobble modification deficiency results in defective translation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Yasukawa et al. 2005 FEBS Lett); abstract only.
- id: PMID:17132941
  title: Human mitochondrial diseases associated with tRNA wobble modification deficiency.
  findings:
  - statement: Review summarising the codon-biased translation defect of unmodified MELAS tRNA-Leu(UUR).
    supporting_text: the translational activity of MELAS mt tRNA(Leu(UUR)) lacking wobble modification
      is more depressed in decoding of UUG codon than UUA codon
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Kirino and Suzuki 2005 RNA Biol, review); abstract only.
- id: PMID:2102678
  title: A mutation in the tRNA(Leu)(UUR) gene associated with the MELAS subgroup of mitochondrial
    encephalomyopathies.
  findings:
  - statement: Identification of m.3243A>G in tRNA-Leu(UUR) as the MELAS mutation.
    supporting_text: Here we report an A-to-G transition mutation at nucleotide pair 3,243 in
      the dihydrouridine loop of mitochondrial tRNA(Leu)(UUR) that is specific to patients with
      MELAS.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Goto, Nonaka and Horai 1990 Nature); disease genetics, not normal
      function.
