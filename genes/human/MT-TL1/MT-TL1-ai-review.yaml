id: URS000061A10B_9606
gene_symbol: MT-TL1
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MT-TL1 encodes mitochondrial tRNA-Leu(UUR), one of the 22 transfer RNAs encoded by
  mitochondrial DNA (on the heavy strand, between the 16S rRNA and ND1 genes). After
  processing from the polycistronic transcript, it is charged with leucine by the
  mitochondrial leucyl-tRNA synthetase and, in the mitochondrial matrix, acts as the
  adaptor that reads the leucine UUA and UUG codons of the 13 mtDNA-encoded mRNAs on the
  mitoribosome. Its anticodon wobble uridine carries a nuclear-enzyme-installed
  5-taurinomethyl modification that is required for efficient UUG decoding. Pathogenic
  variants, most often m.3243A>G, cause MELAS and maternally inherited diabetes and
  deafness; the mutant tRNA is less abundant, less efficiently aminoacylated and lacks the
  wobble taurine modification, giving a codon-biased defect in mitochondrial translation.
