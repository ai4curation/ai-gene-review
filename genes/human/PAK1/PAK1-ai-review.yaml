      label: MAPK cascade
    evidence_type: IDA
    original_reference_id: PMID:8805275
    qualifier: involved_in
    negated: true
    review:
      summary: Narrow the NOT MAPK-cascade row to the unsupported ERK1/2 branch.
      action: MODIFY
      reason: PMID:8805275 showed that constitutively active human PAK1 specifically activates
        the JNK MAPK pathway and not the extracellular signal-regulated MAPK pathway, so the
        negated broad MAPK cascade row should be narrowed to the ERK1/2 cascade rather than
        removed as wholly wrong.
      proposed_replacement_terms:
        - id: GO:0070371
          label: ERK1 and ERK2 cascade
      supported_by:
        - reference_id: PMID:8805275
          supporting_text: Expression of the hPAK1(L107F) allele in mammalian cells led to specific
            activation of the Jun N-terminal kinase MAP kinase pathway
