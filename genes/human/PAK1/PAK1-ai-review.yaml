id: Q13153
gene_symbol: PAK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PAK1 encodes a group I p21-activated serine/threonine kinase that is activated by
  GTP-bound CDC42 and RAC1 at cytoplasmic, membrane-proximal, focal-adhesion, ruffle, centrosomal
  and nuclear sites. It phosphorylates substrates in LIMK/cofilin, RAF/MAPK, microtubule-nucleation
  and stress-response pathways to regulate actin organization, adhesion, migration, proliferation
  and selected nuclear damage-response outputs.
alternative_products:
