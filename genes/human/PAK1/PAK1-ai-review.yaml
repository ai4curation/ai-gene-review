core_functions:
  - description: PAK1 acts as a CDC42/RAC-regulated protein serine/threonine kinase that
      autophosphorylates and phosphorylates LIMK1, RAF1, MAPK6/MAPK4-associated substrates and other
      effectors to connect small-GTPase activation to cytoskeletal and MAPK signaling.
    molecular_function:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    directly_involved_in:
      - id: GO:0032956
        label: regulation of actin cytoskeleton organization
      - id: GO:0043408
        label: regulation of MAPK cascade
    locations:
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - reference_id: PMID:10559936
        supporting_text: Pak1 phosphorylates LIM-kinase at threonine residue 508 within LIM-kinase's
