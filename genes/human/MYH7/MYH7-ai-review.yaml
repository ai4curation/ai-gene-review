suggested_questions:
- question: GO has no term for the regulated sequestration of myosin heads in the interacting-heads motif / super-relaxed
    state, a property of the MYH7 motor itself (stabilized by intramolecular head-head and head-S2 interfaces, released
    by HCM mutations and phosphorylation, and pharmacologically targeted by mavacamten). Should a molecular function
    or process term be created so that this regulated state can be annotated to cardiac and other class II myosins?
  experts:
  - GO editors
  - cardiac myosin biophysicists
- question: How is the balance between the super-relaxed (IHM) and disordered-relaxed states of beta-cardiac myosin
    controlled in vivo, and how much of it is set by MYH7 itself versus MyBP-C, titin and regulatory light chain
    phosphorylation?
  experts:
  - muscle physiologists
  - structural biologists of the thick filament
- question: Why do distal-rod MYH7 variants produce skeletal myopathies (Laing distal myopathy, myosin storage myopathy)
    usually without cardiomyopathy, despite the same protein being abundant in ventricular thick filaments?
  experts:
  - neuromuscular geneticists
  - myosin rod assembly specialists
- question: Should myosin heavy chains themselves carry striated muscle myosin thick filament assembly (GO:0071688)?
    Their rods self-assemble into the filament, but current annotations of this term go to assembly factors (UNC-45,
    UNC-89, MyBP-C) rather than to the myosins.
  experts:
  - GO editors
  - GOA curators
suggested_experiments:
- description: Quantify the fraction of beta-cardiac myosin heads in the super-relaxed state (mant-ATP single turnover)
    and in the ordered off state (X-ray diffraction) in human iPSC-cardiomyocytes or engineered heart tissue carrying
    HCM, DCM and LVNC head-domain variants, with and without mavacamten.
  hypothesis: HCM variants reduce, and DCM variants increase or leave unchanged, the sequestered head fraction.
  experiment_type: biochemical and structural assays in isogenic human cardiomyocyte models
- description: Express full-length MYH7 carrying Laing distal myopathy and myosin storage myopathy rod variants
    in cardiomyocytes and slow skeletal myotubes and compare thick-filament incorporation, turnover and aggregation
    by live imaging and proteomics.
  hypothesis: Rod variants impair thick-filament incorporation or degradation in a cell-type-dependent manner that
    explains skeletal-predominant disease.
  experiment_type: cell-based assembly and turnover assays
