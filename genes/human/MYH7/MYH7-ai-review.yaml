  review:
    summary: Contractile economy and force kinetics of human myocardium scale with beta-MHC content.
    action: MODIFY
    reason: MYH7 is the force-generating motor of ventricular myocardium, so it participates directly in cardiac
      muscle contraction. 'Regulation of the force of heart contraction' implies a modulatory role (e.g. beta-adrenergic
      or calcium-handling control); here the data show that the intrinsic properties of the beta-MHC motor set force
      kinetics and economy, which is execution of contraction, not its regulation. Replace with cardiac muscle contraction.
