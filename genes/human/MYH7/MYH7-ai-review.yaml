- term:
    id: GO:0008307
    label: structural constituent of muscle
  evidence_type: IDA
  original_reference_id: PMID:19336582
  review:
    summary: The MYH7 rod (light meromyosin) is the building block of the striated-muscle thick filament backbone;
      rod variants that impair coiled-coil formation or filament assembly cause myosin storage myopathy and Laing
      distal myopathy.
    action: NEW
    reason: 'Besides its motor activity, MYH7 is the principal structural component of the thick filaments of ventricular
      and slow skeletal muscle: its rod self-assembles into bipolar filaments through charged 28-residue repeats,
      skip residues and the assembly-competent domain. Comparator check (QuickGO): other muscle myosin heavy chains
      already carry GO:0008307, namely human MYH8 (NAS, PMID:2715179), human MYH11 (IMP, PMID:16444274), C. elegans
      unc-54 (IDA, PMID:3320053) and Drosophila Mhc (IMP, PMID:8995523), so this is an established convention that
      MYH7 lacks rather than a novel use of the term.'
    supported_by:
    - reference_id: PMID:19336582
      supporting_text: Although the head region is responsible for myosin's ATPase and actin binding properties,
        the rod region functions to incorporate myosin into bipolar thick filaments through charge based interactions
        between adjacent rods
    - reference_id: PMID:14520662
      supporting_text: Our findings indicate that the mutated residue of slow/beta-cardiac MyHC is essential for
        the assembly of thick filaments in skeletal muscle
    - reference_id: PMID:26150528
      supporting_text: The rod of sarcomeric myosins directs thick filament assembly and is characterized by the
        insertion of four skip residues that introduce discontinuities in the coiled-coil heptad repeats
    - reference_id: file:human/MYH7/MYH7-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Forms regular bipolar thick filaments that, together with actin thin filaments, constitute
        the fundamental contractile unit of skeletal and cardiac muscle.
