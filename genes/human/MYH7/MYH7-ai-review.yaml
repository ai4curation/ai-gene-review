gene_symbol: MYH7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MYH7 encodes myosin-7, the slow/beta-cardiac myosin heavy chain (beta-MHC, MyHC-slow), a class II
  sarcomeric myosin and the predominant myosin heavy chain of the human cardiac ventricles and of slow, oxidative
  type 1 skeletal muscle fibres. Two heavy chains dimerize through a long alpha-helical coiled-coil rod and each
  binds an essential and a regulatory light chain at the IQ-containing lever arm, forming the hexameric muscle myosin
  molecule. The N-terminal motor domain is an actin-activated Mg-ATPase: it binds ATP at a P-loop pocket and F-actin
  through conserved actin-binding loops, and couples ATP hydrolysis to a lever-arm power stroke that slides thin
  filaments toward the sarcomere centre. The rod, particularly the light meromyosin segment with its 28-residue
  charge repeats, skip residues and assembly-competent domain, packs into the bipolar thick filaments of the A band.
  Beta-MHC is a slow, economical motor compared with alpha-MHC (MYH6), and the beta/alpha ratio sets the kinetics
  and energetic cost of contraction. Its activity is regulated by a folded-back ''interacting-heads motif'' in which
  the two heads lie back on their own S2 tail against the thick-filament backbone; this sequestered state corresponds
  to a super-relaxed state with very slow ATP turnover, is modulated by myosin-binding protein C and light chain
  phosphorylation, and is stabilized by the inhibitor mavacamten. Head-domain variants cause hypertrophic cardiomyopathy,
  frequently by destabilizing the sequestered state, as well as dilated cardiomyopathy and left ventricular non-compaction,
  whereas variants in the distal rod cause Laing early-onset distal myopathy and myosin storage myopathy by disrupting
  coiled-coil formation and thick-filament assembly.'
