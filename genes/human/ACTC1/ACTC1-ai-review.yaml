id: P68032
gene_symbol: ACTC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACTC1 encodes cardiac alpha-actin, a nucleotide-binding structural protein that
  polymerizes into the thin filaments of striated-muscle sarcomeres. ACTC1-containing filaments
  interact with myosin to support contractile force and movement under troponin–tropomyosin
  regulation. Actin also hydrolyzes its bound ATP as part of filament assembly and turnover.
  Cardiac alpha-actin is a major sarcomeric actin isoform in the human heart and is prominent
  in early fetal skeletal muscle.
