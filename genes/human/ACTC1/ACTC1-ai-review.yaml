    label: microfilament motor activity
  evidence_type: IDA
  original_reference_id: PMID:16611632
  qualifier: enables
  review:
    action: REMOVE
    summary: ACTC1 supplies the filament substrate for the myosin motor.
    reason: GO:0000146 requires ATP-driven movement along a microfilament. The actual 16611632
      Methods/Results place cardiac myosin on the motility surface and use it to move recombinant
      human WT/E99K actin filaments; the force assay likewise uses myosin as motor. Assigning
      this motor activity to ACTC1 is a mechanistic mismatch, not a wrong-gene inference from
      an abstract. Intrinsic actin ATPase and structural functions remain valid; no replacement
      motor term is proposed.
    supported_by:
    - reference_id: PMID:16611632
      supporting_text: 'Actin-activated ATPase measurements using the expressed actins and
        beta-cardiac

        myosin'
    - reference_id: PMID:19799913
      supporting_text: Actin filament velocity was determined for WT and each mutant actin
        moving over a coverslip surface coated with rabbit β-cardiac myosin
    additional_reference_ids:
    - PMID:19799913
