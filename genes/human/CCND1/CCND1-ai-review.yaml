    label: cyclin-dependent protein serine/threonine kinase activator activity
  evidence_type: IDA
  original_reference_id: PMID:19237565
  qualifier: enables
  review:
    summary: 'Core molecular function: cyclin D1 is the activating subunit of CDK4/CDK6.'
