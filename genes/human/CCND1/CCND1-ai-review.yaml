- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P25322
  - ensembl:ENSMUSP00000091495
  review:
    summary: Orthology-transferred assertion that cyclin D1 enables protein kinase 
      activity.
    action: REMOVE
    reason: 'Wrong in kind: cyclin D1 is a non-catalytic regulatory subunit with no kinase
      domain (UniProt describes it as the "Regulatory component of the cyclin D1-CDK4 (DC)
      complex", and the only domain annotated is the cyclin N-terminal domain, residues 28-152).
      The phosphotransfer chemistry is performed by CDK4/CDK6; cyclin D1 contributes activation
      and substrate specificity, which is already annotated as GO:0061575/GO:0016538. The
      donor mouse Ccnd1 annotation is itself a role conflation between the holoenzyme and
      its regulatory subunit.'
    supported_by:
    - reference_id: PMID:19237565
      supporting_text: The cyclin D1-cyclin-dependent kinase 4 (CDK4) complex is a key 
        regulator of the transition through the G(1) phase of the cell cycle.
    - reference_id: PMID:8114739
      supporting_text: endogenous cdk6 from human cell extracts is an active kinase 
        which can phosphorylate pRB, the product of the retinoblastoma tumor suppressor 
        gene
    - reference_id: file:human/CCND1/CCND1-deep-research-falcon.md
      supporting_text: catalysis is performed by CDK4/6, with RB1 and related pocket 
        proteins serving as prominent holoenzyme substrates
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P25322
        source_label: Ccnd1
        source_status: SOURCE_BAD
        comment: Mouse Ccnd1 is likewise a non-catalytic cyclin; the transferred 
          catalytic term is wrong at source.
