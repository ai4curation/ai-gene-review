- term:
    id: GO:0005815
    label: microtubule organizing center
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN007424001
  - PomBase:SPBC2G2.09c
  - PomBase:SPBC582.03
  - RGD:2294
  - SGD:S000006323
  - UniProtKB:O95067
  - UniProtKB:P14635
  - UniProtKB:P41002
  review:
    summary: Phylogenetically propagated claim that cyclin D1 is active at the 
      microtubule organizing center.
    action: REMOVE
    reason: 'Arguing the node placement rather than a similarity score: every traceable donor
      for this IBA is a mitotic cyclin - human CCNB1 (P14635), CCNB2 (O95067) and CCNF (P41002),
      the fission yeast cyclins SPBC2G2.09c and SPBC582.03, and budding yeast S000006323 -
      for which centrosome/spindle-pole-body association is a class-specific property tied
      to mitotic entry and spindle function. The assertion therefore sits at a node ancestral
      to the D-type cyclins while describing a B/F-cyclin behaviour. D-type cyclins perform
      a different job (mitogen-dependent CDK4/6 activation in G1), and no human, mouse or
      rat literature places cyclin D1 activity at the MTOC; UniProt lists only nucleus, cytoplasm
      and nuclear membrane. The target is outside the clade in which the annotated behaviour
      arose.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN007424001
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral cyclin node; the MTOC behaviour it carries is attested only 
          in the mitotic-cyclin descendants.
      - source_id: UniProtKB:P14635
        source_label: CCNB1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mitotic B-type cyclin; centrosomal localisation is specific to its 
          mitotic role.
      - source_id: UniProtKB:P41002
        source_label: CCNF
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Cyclin F, another non-D-type cyclin with centrosomal function.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-75822
  qualifier: located_in
  review:
    summary: Reactome-derived cytosolic localisation, reflecting cyclin D1 export, 
      ubiquitination and proteasomal degradation and cytoplasmic holoenzyme assembly.
    action: ACCEPT
    reason: 'Consistent with the experimentally supported cytoplasmic pool: Thr286-phosphorylated
      cyclin D1 is relocalised to the cytoplasm and degraded there, and cyclin D-CDK4/6 complexes
      form in the cytosol before nuclear import. A finer-grained restatement of the accepted
      cytoplasm annotation.'
    supported_by: &id002
    - reference_id: PMID:29279382
      supporting_text: cyclin D1 levels are maintained at steady state by 
        phosphorylation-dependent nuclear export and subsequent proteolysis in the 
        cytoplasm
    - reference_id: PMID:20399237
      supporting_text: TM4SF5 enhanced trafficking of CDK4 and cyclin D1 into the 
        nucleus and induced complex formation between them.
