- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:9106657
  qualifier: located_in
  review:
    summary: Cyclin D1 is also cytoplasmic; complex assembly and Thr286-dependent 
      export/degradation occur there.
    action: ACCEPT
    reason: 'Genuine second pool rather than contamination: cyclin D1 is exported from the
      nucleus after Thr286 phosphorylation and is ubiquitinated and degraded in the cytoplasm,
      and UniProt lists "Cytoplasm" with experimental support. Cytoplasmic cyclin D1-CDK4
      also assembles there before import.'
    supported_by:
    - reference_id: PMID:9106657
      supporting_text: cyclin D1 and p21 bind concomitantly to cdk4 during the in vivo 
        assembly of cdk4/cyclin D1 complexes
