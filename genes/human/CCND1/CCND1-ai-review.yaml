  review:
    summary: Cyclin D1 is a subunit of the cyclin D-CDK4/CDK6 kinase holoenzyme.
    action: ACCEPT
    reason: 'Cyclin D1 is an obligate subunit of the CDK4 and CDK6 holoenzymes: complex formation
      is what confers kinase activity and substrate specificity on the catalytic partner,
      and the cyclin D1-CDK4 heterodimer has been solved crystallographically. UniProt: "Interacts
      with either CDK4 or CDK6 protein kinase to form a serine/threonine kinase holoenzyme
      complex".'
    supported_by:
    - reference_id: PMID:8114739
      supporting_text: The cdk6 kinase is associated with cyclins D1, D2, and D3 in 
        lysates of human cells and is activated by coexpression with D-type cyclins in 
        Sf9 insect cells.
    - reference_id: PMID:19237565
      supporting_text: we report the crystal structure of CDK4 in complex with cyclin D1
        at a resolution of 2.3 A
