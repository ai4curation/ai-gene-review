- id: file:human/CCND1/CCND1-deep-research-falcon.md
  title: Falcon deep research report for CCND1
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: LLM-generated synthesis (Edison/Falcon) of cyclin D1 reviews and 
      primary literature. Its core claims match UniProt and the cached primary papers 
      (non-catalytic CDK4/6 activator, RB-E2F axis, Thr286/XPO1 export and CRL4(AMBRA1) 
      turnover, CIP/KIP-assisted assembly and import, CDK-independent corepressor and HR
      roles, cyclin D1b caveat). The secondary reviews it cites are not in the local 
      publications cache and were not independently verified, so correctness is left 
      UNVERIFIED; no annotation action in this review rests on it alone.
  findings: []
core_functions:
- description: Mitogen-responsive regulatory subunit that binds and activates CDK4, 
    forming the cyclin D1-CDK4 holoenzyme that phosphorylates RB-family pocket proteins 
    in the nucleus during G1 and thereby derepresses E2F and drives the G1/S transition.
  molecular_function:
    id: GO:0061575
    label: cyclin-dependent protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  - id: GO:1900087
    label: positive regulation of G1/S transition of mitotic cell cycle
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0097128
    label: cyclin D1-CDK4 complex
  supported_by:
  - reference_id: PMID:19237565
    supporting_text: The cyclin D1-cyclin-dependent kinase 4 (CDK4) complex is a key 
      regulator of the transition through the G(1) phase of the cell cycle.
  - reference_id: PMID:19237565
    supporting_text: we report the crystal structure of CDK4 in complex with cyclin D1 
      at a resolution of 2.3 A
  - reference_id: PMID:33854239
    supporting_text: Increased levels of cyclin D promote cell division by activating 
      cyclin-dependent kinases 4 and 6 (hereafter, CDK4/6), which in turn phosphorylate 
      and inactivate the retinoblastoma tumour suppressor.
  - reference_id: PMID:7603984
    supporting_text: the pRB is the critical target acted upon by cyclin D-dependent 
      kinases in the G1 phase of the cell cycle
- description: Binds and activates CDK6 in the alternative cyclin D1-CDK6 holoenzyme, 
    which phosphorylates RB in mid-G1 and links growth-factor stimulation to S-phase 
    entry.
  molecular_function:
    id: GO:0061575
    label: cyclin-dependent protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0097131
    label: cyclin D1-CDK6 complex
  supported_by:
  - reference_id: PMID:8114739
    supporting_text: The cdk6 kinase is associated with cyclins D1, D2, and D3 in 
      lysates of human cells and is activated by coexpression with D-type cyclins in Sf9
      insect cells.
  - reference_id: PMID:8114739
    supporting_text: endogenous cdk6 from human cell extracts is an active kinase which 
      can phosphorylate pRB, the product of the retinoblastoma tumor suppressor gene
  - reference_id: PMID:8114739
    supporting_text: This timing suggests that cdk6, and by analogy its homolog cdk4, 
      links growth factor stimulation with the onset of cell cycle progression.
- description: 'CDK-independent transcriptional corepressor: recruited to promoters by the
    zinc-finger factor INSM1 via its cyclin box, cyclin D1 bridges INSM1 to HDAC1/HDAC3 and
    represses NEUROD1 and insulin gene transcription.'
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0017053
    label: transcription repressor complex
  supported_by:
  - reference_id: PMID:16569215
    supporting_text: we conclude that INSM1 recruits cyclin D1 and HDACs, which confer 
      transcriptional repressor activity
  - reference_id: PMID:16569215
    supporting_text: INSM1 interacts with HDAC-1 and -3 and that this interaction is 
      mediated through cyclin D1
  - reference_id: PMID:18417529
    supporting_text: The mechanism for transcriptional repression of the insulin gene by
      INSM1 is mediated through the recruitment of cyclin D1 and histone deacetylase-3 
      to the insulin promoter.
  - reference_id: PMID:19124461
    supporting_text: The proline-rich N-terminal portion of INSM1 is required for cyclin
      D1 binding.
proposed_new_terms: []
suggested_questions:
- question: Should cyclin D1's role as the substrate of CRL4(AMBRA1), SCF(FBXO31), 
    APC/C-CDC27 and FBXO32 be made machine-readable as has_input on those ligase 
    activities, rather than left implicit? At present the substrate relationship 
    surfaces only as bare protein-binding rows on CCND1 and as over-annotated 
    DNA-damage-response process terms.
  experts:
  - Pagano M
  - Sage J
- question: Is the reported CDK-independent contribution of cyclin D1 to homologous 
    recombination (RAD51 loading at damage sites, not reproduced by CDK4/6 inhibition) a
    distinct molecular function that warrants its own annotation, or a consequence of 
    altered cell-cycle distribution?
- question: Cyclin D1b differs from canonical cyclin D1a in its C terminus, lacking the 
    Thr286 degron, and behaves differently towards the androgen receptor. Should 
    AR-related and localisation annotations derived from cyclin D1b studies carry an 
    isoform qualifier rather than being asserted for P24385 as a whole?
  experts:
  - Knudsen KE
suggested_experiments:
- hypothesis: The transcriptional corepressor function of cyclin D1 is separable from 
    CDK4/6 activation and does not require kinase activity.
  description: Compare endogenous-locus knock-in of a kinase-dead-binding cyclin D1 
    (e.g. the K112E-equivalent allele that cannot activate CDK4/6) with a cyclin-box 
    mutant that cannot bind INSM1, then measure nascent transcription (TT-seq) and 
    promoter occupancy (ChIP-seq for cyclin D1, INSM1, HDAC3) at NEUROD1 and INS in a 
    neuroendocrine line.
  experiment_type: separation-of-function genetics with nascent transcriptomics and 
    ChIP-seq
- hypothesis: Cyclin D1 has no activity of its own at the microtubule organizing center,
    contrary to the phylogenetically propagated GO:0005815 annotation.
  description: Acute degron-mediated depletion of endogenous cyclin D1 with quantitative
    imaging of centrosome composition and duplication, plus centrosome-fraction 
    proteomics comparing cyclin D1 with CCNB1 and CCNF as positive controls.
  experiment_type: targeted protein degradation with imaging and organelle proteomics
- hypothesis: The rat-derived "response to X" annotations reflect CCND1 transcription 
    rather than participation of cyclin D1 in each response.
  description: For a panel of the annotated stimuli (estradiol, glucocorticoid, calcium,
    hypoxia), compare wild-type cells with cells in which CCND1 promoter induction is 
    blocked but cyclin D1 protein is supplied constitutively, and test whether the 
    stimulus-specific downstream response is preserved.
  experiment_type: promoter-uncoupling/complementation assay
