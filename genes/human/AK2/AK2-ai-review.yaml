- term:
    id: GO:0072542
    label: protein phosphatase activator activity
  evidence_type: IDA
  original_reference_id: PMID:24548998
  qualifier: enables
  review:
    summary: Human AK2 directly binds and activates DUSP26 in a distinct noncanonical activity.
    action: NEW
    reason: The original human recombinant-protein experiments show AK2 association with DUSP26 and increased
      phosphatase activity on pNPP and Plk-phosphorylated FADD. AK2 alone lacks this phosphatase activity,
      AK3 and FADD controls do not stimulate DUSP26, and kinase-defective AK2 K28E retains activation. Thus
      AK2 performs the activating step, while DUSP26 performs dephosphorylation. GO:0072542 has the matching
      binding-plus-activation definition, and local AMBRA1 and CALM1 experimental annotations establish the
      same regulatory role as legitimate usage. Its parents are enzyme-regulator terms, not kinase or generic
      binding ancestors of an existing AK2 term. No exact AK2 entry was found in the cached GO-CAM index. This
      is a bounded activity proposal from tagged recombinant and human-cell experiments; native complex stoichiometry
      and its contribution to reticular dysgenesis remain unresolved. No proliferation, apoptosis or differentiation
      BP is proposed from necessity evidence.
    supported_by:
    - reference_id: PMID:24548998
      supporting_text: AK2 forms a complex with dual-specificity phosphatase 26 (DUSP26) phosphatase and stimulates
        DUSP26 activity independently of its AK activity.
