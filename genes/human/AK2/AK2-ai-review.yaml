core_functions:
- description: Catalyzes reversible phosphate transfer between ATP and AMP, forming two ADP molecules in the
    forward direction and ATP plus AMP in the reverse direction. The mitochondrial intermembrane-space enzyme
    thereby balances adenine nucleotides; ATP binding, AMP/ATP metabolism and ADP formation are aspects of
    this single catalytic unit. Both tested human AK2A and AK2B are active. The compartment assignment includes
    conserved mammalian localization evidence, whereas human enzyme purification directly establishes catalysis.
  molecular_function:
    id: GO:0004017
    label: AMP kinase activity
  directly_involved_in:
  - id: GO:0015949
    label: nucleobase-containing small molecule interconversion
  - id: GO:0006172
    label: ADP biosynthetic process
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: Reactome:R-HSA-110145
    supporting_text: Mitochondrial adenylate kinase 2 (AK2) catalyzes the reaction of AMP and ATP to form two
      molecules of ADP
  - reference_id: Reactome:R-HSA-110144
    supporting_text: Localization of AK2 specifically to the mitochondrial intermembrane space is inferred
      from studies of the homologous rat enzyme (Criss 1970).
  - reference_id: PMID:9504408
    supporting_text: 'Each of the recombinant proteins, AK2A and AK2B, was expressed in

      Escherichia coli cells, and the purified recombinant proteins were enzymatically

      active.'
suggested_questions:
- question: How much endogenous AK2-dependent DUSP26 activation occurs in primary human hematopoietic cells,
    and does it contribute to reticular dysgenesis independently of adenylate homeostasis? Direct recombinant
    activation is established, but its general physiological importance and native complex stoichiometry are
    unresolved.
- question: Which of the six human AK2 sequence isoforms populate mitochondrial, nuclear and stress-released
    pools? Direct catalytic assays cover AK2A and AK2B, not all products.
- question: Can the target-specific AK2 peptide evidence in the B-cell exosome supplement be recovered and
    distinguished from the MHC-II co-immunoprecipitated subset?
- question: Does human sperm show the mouse ortholog's mitochondrial-sheath localization and what fraction
    of local adenylate flux depends on AK2? The retained donor annotations do not establish a motility mechanism.
