id: P54819
gene_symbol: AK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AK2 is a mitochondrial intermembrane-space adenylate kinase that reversibly transfers a phosphate
  between ATP and AMP to form two ADP molecules. This reaction balances adenine nucleotides and supplies ADP
  without hydrolyzing ATP to free phosphate. Human AK2A and AK2B are catalytically active isoforms; the activities
  and localization of all six sequence products are less fully resolved. Biallelic deficiency causes reticular
  dysgenesis, with severe myeloid and lymphoid defects and sensorineural deafness. Human hematopoietic studies
  connect the differentiation defect to disrupted nucleotide and metabolic homeostasis. AK2 also has a distinct,
  experimentally demonstrated interaction with DUSP26 that increases protein-phosphatase activity independently
  of adenylate-kinase catalysis in recombinant assays and cultured human cells.
