- term:
    id: GO:0006338
    label: chromatin remodeling
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0017136
  review:
    action: REMOVE
    summary: Chromatin remodeling is inferred only from the inherited histone-deacetylase IBA, which does not hold for SIRT5.
    reason: This is a logical inference from GO:0017136 (histone deacetylase activity, NAD-dependent), which this review refines
      away from SIRT5 because its deacetylase activity is ~500-fold weaker than SIRT1 and it does not affect global acetylation
      in vivo. No study shows SIRT5 participates in chromatin remodeling; increased histone succinylation in Sirt5 KO cells
      does not establish a remodeling role. Removing the derived process is an argument about the electronic inference, not
      an experimental annotation.
    supported_by:
    - &id013
      reference_id: PMID:22076378
      supporting_text: The catalytic efficiency (kcat/Km) of Sirt5 was about 500-fold lower than that of Sirt1.
    - &id011
      reference_id: PMID:23806337
      supporting_text: SIRT5 deficiency does not significantly impact global Lys acetylation
- term:
    id: GO:0006476
    label: protein deacetylation
  evidence_type: IDA
  original_reference_id: PMID:18680753
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: In vitro deacetylation of cytochrome c does not establish a physiological protein-deacetylation role for SIRT5.
    reason: Schlicker et al. found SIRT5 deacetylated none of the matrix proteins tested and only cytochrome c in vitro; Reactome
      notes the significance is unknown. Later work shows deacetylation is 29 to >1000-fold less efficient than desuccinylation/demalonylation
      and that Sirt5 loss does not change global lysine acetylation or CPS1 K44/K287 acetylation in vivo. The weak activity
      is captured by the MF term GO:0034979 (kept non-core); the process claim overstates it. A curator NOT for the same process
      exists (PMID:22076378).
    supported_by:
    - reference_id: PMID:18680753
      supporting_text: Sirt5, in contrast to Sirt3, deacetylates none of the mitochondrial matrix proteins tested.
