id: Q9NXA8
gene_symbol: SIRT5
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIRT5 is an NAD-dependent protein lysine deacylase that efficiently removes succinyl, malonyl
  and glutaryl groups. Its mitochondrial and extramitochondrial substrates connect deacylation to nitrogen
  metabolism, redox control and other metabolic pathways. Protein deacetylation is comparatively weak
  and does not define its principal substrate preference.
