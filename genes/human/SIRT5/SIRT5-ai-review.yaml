- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-70635
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: SIRT5 regulates the urea cycle by activating CPS1 through desuccinylation and deglutarylation; it performs no
      urea-cycle reaction itself.
    reason: 'SIRT5 does not catalyse a step of the urea cycle; it removes inhibitory succinyl and glutaryl groups from CPS1,
      the first enzyme of the cycle, increasing its activity (mouse KO and human cell knockdown). GO has no ''regulation of
      urea cycle'' term, so the Reactome pathway-membership TAS is retained as a non-core regulatory involvement rather than
      refined. It is not a core function: the core activity is the deacylase reaction on CPS1.'
    supported_by:
    - &id020
      reference_id: PMID:24703693
      supporting_text: Glutarylation of CPS1 inhibits its activity, but can be reserved by SIRT5.
    - &id007
      reference_id: Reactome:R-HSA-9955504
      supporting_text: Knockdown of SIRT5 leads to hyperglutarylation of CPS1 and reduced CPS1 enzymatic activity, consistent
        with a role for SIRT5 in activating the enzyme.
    - &id012
      reference_id: PMID:22076378
      supporting_text: For Lys1291, succinylation level increased dramatically in Sirt5 KO mice compared with the level in
        wt mice
- term:
    id: GO:0003950
    label: NAD+ poly-ADP-ribosyltransferase activity
  evidence_type: TAS
  original_reference_id: PMID:17456799
  qualifier: enables
  negated: true
  review:
    action: ACCEPT
    summary: 'NOT NAD+ poly-ADP-ribosyltransferase activity: no sirtuin, and specifically not SIRT5, has been shown to synthesize
      poly-ADP-ribose.'
    reason: 'The curator''s negative statement from this review (abstract-only in our cache) is consistent with the biochemistry:
      SIRT5 uses NAD+ as an acyl acceptor (forming 2''-O-acyl-ADP-ribose) in a deacylation reaction, the same mechanism as
      class I sirtuin deacetylation, and the ADP-ribosyltransferase activities reported in the family are attributed to other
      members (SIRT4/SIRT6 and bacterial CobB nodes in PAINT), not to the SIRT5 subfamily node PTN000119399. We have no evidence
      contradicting the curator, so the NOT is accepted.'
    supported_by:
    - &id028
      reference_id: PMID:17456799
      supporting_text: Certain sirtuins have in addition an ADP-ribosyltransferase activity.
    - &id017
      reference_id: PMID:22076378
      supporting_text: Thus, the mechanism for Sirt5-catalyzed desuccinylation or demalonylation is similar to the deacetylation
        mechanism of Class I sirtuins.
