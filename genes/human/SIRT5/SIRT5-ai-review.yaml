id: Q9NXA8
gene_symbol: SIRT5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIRT5 is an NAD+-dependent protein lysine deacylase of the sirtuin family that preferentially removes negatively
  charged acyl groups (succinyl, malonyl and glutaryl) from lysine residues, transferring the acyl group to ADP-ribose and
  releasing nicotinamide. Tyr102 and Arg105 in its acyl-binding pocket recognize the acyl carboxylate, and its deacetylase
  activity is weak by comparison. Synthesized with an N-terminal mitochondrial transit peptide, it acts mainly in the mitochondrial
  matrix (also the intermembrane space), with a substantial cytosolic pool and a minor nuclear pool. It is a major regulator
  of cellular lysine succinylation and glutarylation; characterized substrates include CPS1 (activated, supporting urea-cycle
  ammonia disposal during fasting), HMGCS2 (ketogenesis), SHMT2 (serine catabolism), SOD1 (antioxidant defence), and the pyruvate
  dehydrogenase and succinate dehydrogenase complexes.
