suggested_questions:
- question: Should GO provide a 'regulation of urea cycle' term so that SIRT5 (a CPS1-activating deacylase) can be annotated
    as a regulator rather than as involved_in the urea cycle itself?
- question: Does the weak in vitro deacetylase activity of SIRT5 (cytochrome c, H3K9ac peptide) have any physiological substrate,
    given that Sirt5 loss does not alter global or CPS1 acetylation?
suggested_experiments:
- description: Quantitative sub-mitochondrial fractionation (matrix vs intermembrane space vs inner membrane) of endogenous
    SIRT5 in human hepatocytes, to settle the inner-membrane projection and the size of the IMS pool.
