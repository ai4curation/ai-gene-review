  review:
    summary: The specific spermatogenesis assignment requires donor-specific physiological evidence.
    action: UNDECIDED
    reason: This electronic transfer concerns a specialized physiological response rather than the established
      receptor mechanism. Ghrelin receptor conservation and endocrine expression do not by themselves
      validate the direction, tissue, developmental state or stimulus named by this term. The relevant
      donor experiment has not been resolved, so the annotation is not accepted or rejected solely from
      general ghrelin biology.
