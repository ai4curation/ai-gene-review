id: Q92847
gene_symbol: GHSR
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GHSR is a seven-transmembrane ghrelin receptor that couples to heterotrimeric G proteins.
  Binding of acylated ghrelin activates pathways regulating growth-hormone release and energy balance,
  and the receptor also has substantial constitutive activity. In mammalian neurons it can participate
  in receptor heteromers, while peripheral immune and reproductive effects depend on tissue context. Ghrelin
  is distinct from growth-hormone-releasing hormone and oxytocin.
