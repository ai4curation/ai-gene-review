  review:
    summary: Ghrelin/growth-hormone-secretagogue receptor activity is the core molecular function.
    action: ACCEPT
    reason: Receptor cloning, endogenous ligand identification and modern ghrelin-bound receptor structures
      establish this specific function. The full-length horse receptor retains the seven-transmembrane
      architecture and 95.1% identity, supporting transfer of ligand class and receptor mechanism; the
      equine expression paper verifies GHSR1a transcripts but is not a ligand-binding assay.
    supported_by:
