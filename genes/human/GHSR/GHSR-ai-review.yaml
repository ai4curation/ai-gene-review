  review: &id009
    summary: 'Learning: a behavioral outcome downstream of GHSR''s hippocampal synaptic role.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse source (PMID:26590421) shows GHSR inactivation impairs DRD1-dependent memory. The
      receptor's own contribution is the coreceptor activity and the regulation of synaptic plasticity,
      which are kept. Learning is an organismal behavioral phenotype of that perturbation, not a process
      the receptor performs. The donor is mouse Ghsr Q99P50, a one-to-one ortholog in the same PANTHER
      subfamily (PTHR24243:SF7), so the receptor and its coupling properties are conserved.
    supported_by:
