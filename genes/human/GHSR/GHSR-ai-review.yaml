  review: &id001
    summary: Ghrelin (growth hormone secretagogue) receptor activity is the defining molecular function
      of GHSR1a.
    action: ACCEPT
    reason: GHSR was cloned as the G protein-coupled target of synthetic growth hormone secretagogues
      (PMID:8688086); acyl-ghrelin was then purified as its specific endogenous ligand (PMID:10604470)
      and confirmed as a full agonist (PMID:11322507). Cryo-EM structures of the human receptor bound
      to octanoylated ghrelin and G protein show the ligand in the orthosteric pocket (PMID:35027551),
      and Ghsr-null mice lose ghrelin-evoked GH release and feeding (PMID:15070777). The IBA comes from
      PAINT node PTN002797666, a GHSR-specific Euteleostomi clade seeded by human, rat and pig receptors;
      Q92847 is in PANTHER subfamily SF7 inside that clade. The target appearing in its own WITH/FROM
      reflects its experimental grounding.
    supported_by:
    - &id015
      reference_id: PMID:10604470
      supporting_text: We now report the purification and identification in rat stomach of an endogenous
        ligand specific for GHS-R.
    - reference_id: PMID:11322507
      supporting_text: We also confirmed that the endogenous ligand ghrelin is a full agonist of the GHS-R.
    - &id002
      reference_id: PMID:35027551
      supporting_text: active ghrelin receptor-Go complex bound to the endogenous agonist ghrelin
    - &id021
      reference_id: PMID:35027551
      supporting_text: an acylated modification, typically an octanoyl group, of the hydroxyl group of
        the Ser+3 residue is required for the biological action of ghrelin as the unacylated form of ghrelin
        does not bind or activate the ghrelin receptor at all
    - reference_id: file:human/GHSR/GHSR-uniprot.txt
      supporting_text: PTHR24243:SF7; GROWTH HORMONE SECRETAGOGUE RECEPTOR TYPE 1
