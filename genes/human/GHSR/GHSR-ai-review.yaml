suggested_questions:
- question: GO-CAM 67f85f2b00000823 (Ghrelin-GHSR pair leading to G-alphaQ activation) gives GHSR the
    activity GO:0016520 growth hormone-releasing hormone receptor activity, and gives ghrelin GO:0016608
    growth hormone-releasing hormone activity. By their definitions those terms describe the GHRH-GHRHR
    pair. Should the model use GO:0001616 growth hormone secretagogue receptor activity for GHSR, and
    should the human and rat GO:0016520 IDA rows be moved to GO:0001616?
- question: How much of GHSR's physiological signaling in human tissues comes from constitutive activity
    rather than ghrelin, and does the GHSR1b isoform regulate this in vivo?
suggested_experiments:
- description: In human iPSC-derived hypothalamic or spinal neurons, compare GHSR knockout, a constitutive-activity-dead
    variant (A204E) and LEAP2 treatment. Readouts would be DRD1/DRD2-evoked Gq signaling and ghrelin responses,
    to separate ligand-dependent from constitutive functions in human cells.
