id: Q92847
gene_symbol: GHSR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GHSR encodes the ghrelin receptor (growth hormone secretagogue receptor type 1a), a 366-residue
  class A seven-transmembrane G protein-coupled receptor of the plasma membrane. It binds the stomach
  hormone ghrelin, whose Ser3 octanoyl group is required for binding, as well as synthetic growth hormone
  secretagogues. Ligand binding activates mainly Gq/11-phospholipase C-IP3/Ca2+ signaling, with additional
  Gi/o, G12/13 and beta-arrestin coupling. The receptor has high ligand-independent (constitutive) activity,
  which LEAP2 suppresses as an inverse agonist. In the anterior pituitary and hypothalamus (arcuate GHRH
  and AgRP/NPY neurons) GHSR signaling stimulates pulsatile growth hormone release and appetite. Human
  variants that remove constitutive activity cause short stature. In other neurons GHSR can also act without
  ghrelin, forming heteromers with dopamine DRD1 and DRD2 receptors and redirecting their signaling. This
  supports hippocampal synaptic plasticity and spinal control of defecation. Peripheral effects include
  anti-inflammatory actions on immune cells and gut prokinetic effects. Splicing also produces a truncated
  five-transmembrane isoform (GHSR1b) that does not bind ghrelin and dampens GHSR1a surface expression
  and signaling.
