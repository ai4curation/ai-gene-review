  review:
    summary: '''spermatogenesis'' is projected from a rat expression-pattern (IEP) annotation, not from
      evidence of receptor function.'
    action: REMOVE
    reason: 'The rat source annotation (checked in QuickGO, 2026-10-20) is IEP: it records that rat Ghsr
      transcript or protein levels change under this condition. An expression change does not show that
      the receptor carries out the response, and an expression pattern is not a function that can be transferred
      by orthology. Nothing in the human literature reviewed here supports the claim independently. This
      Ensembl Compara row (GO_REF:0000107) projects an annotation from rat Ghsr O08725, a one-to-one ortholog
      in the same PANTHER subfamily (PTHR24243:SF7) and below the GHSR PAINT node PTN002797666, so the
      orthology is sound; the question is whether the rat claim itself holds and transfers.'
