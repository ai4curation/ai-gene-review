  review:
    summary: Immune-cell membrane organization/cytoskeletal effects require the stated tissue context.
    action: KEEP_AS_NON_CORE
    reason: The human primary GHSR immune-cell study supplies these IDA observations. Retain the human
      observation as non-core; the corresponding horse annotation lacks a verified horse cellular context,
      and receptor conservation alone does not establish membrane-raft partitioning or actin remodeling
      in that tissue.
