  review:
    summary: Neuronal receptor-heteromer roles are context-specific and distinct from ghrelin ligand recognition.
    action: KEEP_AS_NON_CORE
    reason: The curated mammalian synthesis describes GHSR/DRD1 or GHSR/DRD2 heteromers in synaptic plasticity
      and defecation. Broad neuronal/coreceptor effects are retained as non-core evolutionary inferences;
      precise synapse subdivisions and postsynaptic organization require inspection of the donor experiment.
      No heteromer claim establishes oxytocin receptor activity.
    supported_by:
    - reference_id: file:human/GHSR/GHSR-uniprot.txt
      supporting_text: 'by forming

        CC       a heteromer with the dopamine receptors DRD1 and DRD2 in neurons'
