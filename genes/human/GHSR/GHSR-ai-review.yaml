      this consistent evidence; the human row keeps positive regulation of appetite. This Ensembl Compara
      row (GO_REF:0000107) projects an annotation from rat Ghsr O08725, a one-to-one ortholog in the same
      PANTHER subfamily (PTHR24243:SF7) and below the GHSR PAINT node PTN002797666, so the orthology is
