id: Q8N726
gene_symbol: CDKN2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human ARF is the 132-residue p14ARF tumor suppressor encoded in an alternative reading
  frame of CDKN2A, structurally unrelated to p16INK4A. Full-length ARF binds and inhibits MDM2,
  supporting p53 stability, cell-cycle arrest and senescence. It also associates with other regulatory
  proteins, modulates SUMO ligases and can promote apoptosis in defined contexts. ARF occupies
  nucleolar and nucleoplasmic pools that redistribute with stress and binding partners. Internally
  initiated smARF lacks residues 1–47; mitochondrial localization of short and full-length products
  depends on the construct and cellular context and is not uniformly exclusive.
