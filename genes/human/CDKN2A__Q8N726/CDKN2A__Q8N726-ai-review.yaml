core_functions:
- description: Full-length human p14ARF binds and inhibits MDM2, reducing p53 ubiquitination and
    supporting p53-dependent arrest and senescence. Its nuclear trafficking and partner interactions
    regulate this mechanism; the structurally unrelated p16 protein and untested shorter products
    are not assigned this core by locus membership.
