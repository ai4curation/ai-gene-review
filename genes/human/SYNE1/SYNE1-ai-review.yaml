suggested_questions:
- question: Which nesprin-1 isoforms directly recruit dynein-dynactin (via BICD2 or other adaptors) or
    kinesin-1 in migrating neurons, as opposed to nesprin-2 whose motor recruitment is better defined?
- question: Is the nucleolar localization of nesprin-1 (IDA from the p50Nesp1 paper) reproducible and
    isoform-specific?
suggested_experiments:
- description: Isoform-selective (KASH-deletion vs CH-domain deletion) nesprin-1 alleles in hindbrain/cerebellar
    neurons on a nesprin-2 null background, with live imaging of nucleus-centrosome coupling to separate
    actin- versus microtubule-motor-coupled nuclear migration.
