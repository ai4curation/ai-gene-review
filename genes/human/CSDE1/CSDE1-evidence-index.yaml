    id: SL-0496
    definition: Stress granules are dense non-membrane bound aggregations in the cytosol composed of proteins
      and RNAs that appear when the cell is under stress. The aggregates are mostly composed of stalled
      translation initiation complexes. They are 100-200 nm in size. Stress granules can also precipitate
      the formation of toxic protein aggregates such as those seen during the progression of certain types
      of neurological disease.
    content: Cytoplasm, Stress granule
    statistics:
      reviewedProteinCount: 256
      unreviewedProteinCount: 30642
    category: Cellular component
    geneOntologies:
    - goId: GO:0010494
      name: cytoplasmic stress granule
    isA:
    - name: Cytoplasmic ribonucleoprotein granule
      id: SL-0495
      definition: Cytoplasmic ribonucleoprotein granule is a collective term for distinct protein and
        RNA foci inside the cytoplasm, including processing bodies (P-bodies), U snRNP bodies (U-bodies),
        stress granules, neuronal ribonucleoprotein granule (neuronal transport granule) and germ granules
        (germline granules).
      content: Cytoplasm, Cytoplasmic ribonucleoprotein granule
      note: The synonym "cytoplasmic body/bodies" is also used to indicate cytoplasmic speckles or foci.
        In this case, the location "Cytoplasmic ribonucleoprotein granule" does not apply.
      category: Cellular component
      geneOntologies:
      - goId: GO:0036464
        name: cytoplasmic ribonucleoprotein granule
      synonyms:
      - Cytoplasmic mRNP granule
      - Cytoplasmic mRNP granules
      - mRNP granule
      - mRNP granules
      references:
      - PubMed=25531407
      - ' DOI=10.4161/15476286.2014.972208'
      partOf:
      - name: Cytoplasm
        id: SL-0086
        definition: The cytoplasm is the content of a cell within the plasma membrane and, in eukaryotics
          cells, surrounding the nucleus. This three-dimensional, jelly-like lattice interconnects and
          supports the other solid structures. The cytosol (the soluble portion of the cytoplasm outside
          the organelles) is mostly composed of water and many low molecular weight compounds. In eukaryotes,
          the cytoplasm also contains a network of cytoplasmic filaments (cytoskeleton).
        content: Cytoplasm
        keyword:
          name: Cytoplasm
          id: KW-0963
        category: Cellular component
        geneOntologies:
        - goId: GO:0005737
          name: cytoplasm
