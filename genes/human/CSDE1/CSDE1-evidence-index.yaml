  SL0230:
    name: P-body
    id: SL-0230
    definition: P-bodies are dynamic non-membrane bound cytoplasmic structures. These discrete foci function
      in mRNA decay (decapping and breakdown), RNA- mediated gene silencing (microRNA and siRNA-based
      gene silencing), mRNA surveillance (or quality control) and translational control. In addition to
      being sites of mRNA degradation, P-bodies can temporarily sequester mRNAs away from the translation
      machinery. P-bodies are present in unstressed cells, but are further induced in response to various
      stresses.
    content: Cytoplasm, P-body
    statistics:
      reviewedProteinCount: 424
      unreviewedProteinCount: 56251
    category: Cellular component
    geneOntologies:
