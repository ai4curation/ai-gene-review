    name: mCRD-mediated mRNA stability complex
    definition:
      text: A protein complex that binds to, and promotes stabilization of, mRNA molecules containing
        the major coding region instability determinant (mCRD) by bridging the mCRD domain and the poly(A)
        tail of the mRNA. In human, it consists of CSDE1, HNRPD, PABPC1, PAIP1 and SYNCRIP.
