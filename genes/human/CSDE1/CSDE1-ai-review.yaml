id: O75534
gene_symbol: CSDE1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSDE1 (UNR) is a cytoplasmic RNA-binding protein with multiple cold-shock domains
  that coordinates RNA with regulatory protein partners. It modulates translation and mRNA
  stability through transcript- and ribonucleoprotein-specific interactions, including the
  c-FOS coding-region determinant/poly(A)-binding-protein assembly, internal ribosome entry
  sites, and miRNA-induced silencing complexes. Its effects on stabilization and turnover
  depend on translation and complex state. CSDE1 also associates with stress granules and
  selected lncRNAs in defined cellular contexts. Alternative splicing changes N-terminal and
  internal protein sequences.
