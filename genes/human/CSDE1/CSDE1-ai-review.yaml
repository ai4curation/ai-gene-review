core_functions:
- description: Directly recognizes mRNA sequences, including c-FOS coding-region elements
    and exposed loops or bulges in structured viral IRES RNA. This RNA-contact function is
    distinct from coordinating protein partners and does not imply duplex-RNA specificity.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15314026
    supporting_text: directly binds mCRD
  - reference_id: PMID:17947529
    supporting_text: binding of Unr to the IRES
- description: Binds RNA and coordinates regulatory proteins with RNA to control cytoplasmic
    translation and transcript stability. In the c-FOS mCRD assembly, direct PABP association
    links coding-region recognition to poly(A)-tail regulation; effects on stabilization versus
    turnover depend on translation and ribonucleoprotein state. CSDE1 also associates with
    AGO2-containing miRNA silencing complexes and decapping factors. These are additional
    contexts for post-transcriptional regulation; they do not establish a role in core miRISC
    assembly or CCR4-NOT recruitment.
  molecular_function:
    id: GO:0140517
    label: protein-RNA adaptor activity
  directly_involved_in:
  - id: GO:0006417
    label: regulation of translation
  - id: GO:0043488
    label: regulation of mRNA stability
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15314026
    supporting_text: only PABP displays direct interaction with UNR in a RNA-independent manner.
  - reference_id: PMID:10049359
    supporting_text: Recombinant unr acts synergistically with recombinant PTB to stimulate
      translation dependent on the rhinovirus IRES.
  - reference_id: PMID:11051545
    supporting_text: stabilized mCRD-containing mRNA by impeding deadenylation
  - reference_id: PMID:32161113
    supporting_text: interacts with AGO2 within miRNA-induced silencing complex
suggested_questions:
- question: Which target-specific experiment supports the P-body location attributed to CSDE1
    in PMID:32354837, distinct from localization of its 4E-T partner?
- question: How do RNA occupancy, PABP association and ribosome transit determine whether
    CSDE1 stabilizes an mCRD transcript or permits CCR4-dependent deadenylation?
- question: Which functional differences can be assigned to each of the five official protein
    sequences, rather than to study-specific isoform labels or tags?
suggested_experiments:
- description: Compare sequence-verified endogenous CSDE1 variants at matched abundance using
    transcript-specific translation and poly(A)-tail measurements, while independently measuring
    transcript stability.
- description: Test endogenous CSDE1 localization with validated reagents and P-body markers
    across defined basal and stress conditions, separating target localization from recruitment
    of 4E-T.
