- term:
    id: GO:0070966
    label: nuclear-transcribed mRNA catabolic process, no-go decay
  evidence_type: IMP
  original_reference_id: PMID:15314026
  qualifier: involved_in
  review:
    action: MODIFY
    reason: UNR perturbation and PABP competition affect CCR4-dependent deadenylation and
      decay of an mCRD reporter. Initiation blockade or premature termination upstream of
      mCRD stabilizes the reporter, unlike the stalled-elongation surveillance specified by
      no-go decay. CCR4, not CSDE1, supplies the nuclease activity. CSDE1 itself binds the
      coding-region RNA and directly contacts PABP to organize the functional RNA-protein
      assembly, so participation is supported by molecular work as well as perturbation. GO:0000288
      describes the multistep pathway, not just nuclease catalysis; the absence of intrinsic
      nuclease activity is therefore not a reason to replace it with a regulation-only term.
    proposed_replacement_terms:
    - id: GO:0000288
      label: nuclear-transcribed mRNA catabolic process, deadenylation-dependent decay
    summary: Replace no-go decay with the demonstrated deadenylation-dependent process.
    supported_by:
    - reference_id: PMID:15314026
      supporting_text: deadenylation step is coupled to ongoing translation
