    relevance: HIGH
    correctness: VERIFIED
    review_notes: The combined sources are actual ARBA00093068 and InterPro IPR002209. P61328 FunFam 2.80.10.50:FF:000001
      plus Primates matches ARBA set 1, output GO:0008083. InterPro maps IPR002209 to the same term and
      identifies human P61328, length 243, at residues 15–216. Matching and provenance are verified; growth-factor
