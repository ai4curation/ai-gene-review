id: P61328
gene_symbol: FGF12
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF12 (FHF1) is an intracellular member of the fibroblast growth factor family that binds
  voltage-gated sodium channels and modulates their gating, contributing to neuronal excitability. Its
  long FGF12A and short FGF12B splice products differ at the amino terminus. FGF12 also has nuclear and
  nucleolar pools and associates with NOLC1, TCOF1 and galectins; the productive nuclear process served
  by these associations remains unresolved. Short recombinant FGF12 can activate FGF receptors and survival
  signaling in cultured cells without a mitogenic response in the tested systems. Pathogenic FGF12 variants
  can cause developmental and epileptic encephalopathy through disturbed channel regulation.
