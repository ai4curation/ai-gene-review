    summary: FGF12 has a supported nucleolar pool in the human cell systems studied.
    action: KEEP_AS_NON_CORE
    reason: PMID:36411431 reports tagged FGF12 nucleolar enrichment by imaging, dyskerin colocalization
      and nucleolar fractionation (Results lines 191–193; Figure 1D–F; Methods lines 102, 120–122 and
