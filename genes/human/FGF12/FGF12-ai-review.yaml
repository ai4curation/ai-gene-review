  review:
    summary: FGF12 associates with TCOF1 in nucleolar protein complexes; preserve the imported FGF12B
      interaction context.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:36411431 detects TCOF1 among recombinant FGF12-His pull-down partners and confirms recovery
      by immunoblotting (Results lines 185–196; Figures 1B and 2A). Tagged cellular FGF12 also co-purifies
      and gives proximity signals with TCOF1 (lines 208–218; Figure 3A–D). These are positive association
      results, not a purified binary reconstitution. Preserve imported P61328-2 and partner Q13428. The
      unchanged UniProt INTERACTION record assigns the same pair to P61328-2; this records curated provenance
      rather than a separate experiment. Cellular constructs are explicitly a isoforms in Methods line
      102. Recombinant short-chain numbering at line 108 is not a complete sequence-to-accession proof;
      do not transfer the tagged-a localization findings to isoform 2. A more specific scaffold-binding
      function is not established: the official term describes binding a signaling scaffold, whereas this
      paper establishes nucleolar co-complex association and leaves its functional output unresolved.
      Retain the supported generic interaction as non-core under the ClinGen instruction.'
    supported_by:
    - reference_id: PMID:36411431
