references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The full preserved PTHR11486 TSV was read, not just its positive target joins: 35 rows
      comprise 23 positive IBDs and 12 negated IRDs. The verified human P61328 path contains 11 IBDs and
      seven IRDs. At PTN000160077 the IRDs negate GO:0005576, GO:0005104, GO:0008083, GO:0008284, GO:0008543,
      GO:0030334 and GO:0043410; each literal WITH/FROM is PANTHER:PTN000160075, the corresponding same-term
      positive ancestral IBD node. These are curated rapid-divergence judgments, not seven negative experiments.
      Positive ancestral donor lists do not identify negative experimental donors, and publication-level
      independence from historical FHF studies is not established by these records. The four other path
      IBDs match imported nucleus, cytoplasm, sodium-channel regulator and neurogenesis contexts. All
      17 off-path rows are accounted for. API version 19 leaf PTN002479516 lies below both nodes and its
      MSA sequence exactly matches canonical human P61328 (243 aa). The complete target path and leaf
      are present in the size-limited tree prefix; no complete-tree or short-isoform activity claim is
      made. Compact evidence now verifies the complete TSV inventory and all seven loss-to-gain joins.
      Later receptor/release evidence must be assessed against these negative judgments by construct and
      endpoint, without counting propagated channels as independent measurements or generalizing GO-slim
      NOT summaries to broader functions.'
