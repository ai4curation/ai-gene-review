    review_notes: Actual ARBA00028183 and ARBA00027428 records were read for target-relevant conditions.
      P61328 FunFam 2.80.10.50:FF:000001 plus Haplorrhini matches zero-based set 21 of ARBA00028183 (GO:0007267);
