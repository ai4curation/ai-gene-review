id: Q69YN2
gene_symbol: CWF19L1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CWF19L1 is a nucleoplasmic CWF19-family protein that associates with
  spliceosomal proteins and supports pre-mRNA splicing. Human cell experiments connect
  it to U5 snRNP and PRPF19-complex components and show altered alternative splicing
  after its depletion. A conserved Drn1-like capacity to stimulate RNA lariat debranching
  is inferred from phylogeny and yeast biochemistry; direct activation of human DBR1
  by CWF19L1 has not been established. The canonical protein contains 538 amino acids,
  while alternative splicing produces shorter 242- and 401-residue forms. Biallelic
  loss-of-function variants cause a recessive ataxia syndrome with intellectual disability
  and cerebellar hypoplasia.
alternative_products:
