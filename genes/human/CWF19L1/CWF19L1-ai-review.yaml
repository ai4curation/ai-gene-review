core_functions:
- description: Associates with splicing factors and contributes to pre-mRNA splicing
    in the nucleoplasm. Human co-IP and splicing-reporter/RNA-seq experiments support
    this role; the HuRI CWF19L2 interaction supplies a specific binding assertion
    without proving that this single contact mediates the splicing phenotype.
  directly_involved_in:
  - id: GO:0000398
    label: mRNA splicing, via spliceosome
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:39542248
  - reference_id: PMID:32296183
- description: Conserved Drn1-like activation of RNA lariat debranching enzyme is
    inferred from the authenticated PAINT placement and direct yeast Drn1–Dbr1 biochemistry.
    This is an enzyme-activator role, not intrinsic RNA cleavage. Direct activity
    of human CWF19L1 and its exact native intron-complex stage remain unestablished.
  molecular_function:
    id: GO:0061632
    label: RNA lariat debranching enzyme activator activity
  supported_by:
  - reference_id: PMID:24919400
  - reference_id: GO_REF:0000033
suggested_questions:
- question: Does human CWF19L1 directly stimulate DBR1, and does this explain any
    of its measured alternative-splicing effects?
- question: Under which native substrates or spliceosome stages does human CWF19L1
    associate with excised introns, given the CWF19L2-specific recruitment in the
    trapped human ILS structures?
- question: Do the 242- and 401-residue products differ from the 538-residue protein
    in stability, localization, partner binding or splicing activity?
suggested_experiments:
- hypothesis: Human CWF19L1 can enhance DBR1-dependent lariat turnover without acting
    as a nuclease itself.
  description: Compare purified human DBR1 alone and with each sequence-verified CWF19L1
    product using branched RNA, with protein-alone controls, matched protein concentrations
    and stability measurements. In parallel, test rescue of splicing defects in CWF19L1-depleted
    cells without assuming that the biochemical and cellular phenotypes share one
    mechanism.
  experiment_type: Biochemical reconstitution and matched cellular rescue
status: COMPLETE
