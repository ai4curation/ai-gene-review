  review:
    action: UNDECIDED
    reason: The authentic current PAINT tree and MSA place CWF19L1 beneath the stated
      IBD at PTN000249204; the literal donor identities and on-path positive assertion
      are valid. However, the actual human ILS study PMID:30728453 explicitly identifies
      CWF19L2 rather than CWF19L1 in the post-mRNA-release complexes. Its HeLa/MINX
      preparation uses excess dominant-negative PRP43 T429A and stabilization during
      purification, so it does not establish universal exclusion of CWF19L1. Fission-yeast
      PMID:24442611 Table 1 detects the L1-branch Mug161/Drn1 donor weakly in low
      salt, while Cwf19 is robust across preparations; zero quantitation is not proof
      of nonbinding. The newer human CWF19L1 co-IP/splicing study does not resolve
      this exact spliceosome stage. These source-specific tensions leave the inherited
      complex-membership assertion unresolved without claiming a wrong-gene source,
      global evolutionary loss or failure of the PAINT placement.
