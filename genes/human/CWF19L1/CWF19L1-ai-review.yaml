- term:
    id: GO:0061632
    label: RNA lariat debranching enzyme activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000249205
  - SGD:S000003325
  review:
    action: ACCEPT
    reason: The current PAINT IBD is genuinely on the target path at PTN000249205
      and is grounded in budding-yeast Drn1 (SGD:S000003325/P53255). In PMID:24919400,
      purified yeast Drn1 binds Dbr1 and enhances Dbr1-dependent turnover of a branched
      RNA substrate, whereas Drn1 alone does not cleave it. This matches the current
      definition of an RNA lariat debranching enzyme activator. Retain the considered
      ancestral inference with its actual experimental donor. Neither the human alternative-splicing
      study nor the CWF19L2-specific debranching study demonstrates this activity
      directly for human CWF19L1. Stable membership of the trapped post-release complex
      is not required for transient or soluble activation, so the separate uncertainty
      in row 6 does not invalidate this inference.
