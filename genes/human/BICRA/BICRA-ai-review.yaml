    reason: PMID:21555454 positively supports BRD4 association and activation of selected target-gene
      transcription. The current official GO:0140537 definition concerns increasing a transcription regulator's
      activity, and its usage comment explicitly excludes activity at the promoter; GO:0003713 instead
      concerns coactivation at a genomic locus. The selected BICRA experiments do not distinguish these
      spatial mechanisms. Positive transcript changes therefore support GO:0045893 without by themselves
      settling GO:0140537. The paper's NSD3/JMJD6 promoter ChIP is not a BICRA experiment. Retain UNDECIDED
