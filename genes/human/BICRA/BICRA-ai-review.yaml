gene_symbol: BICRA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BICRA (GLTSCR1) is a nuclear, noncatalytic component of the GBAF or non-canonical BAF chromatin-remodeling
  complex. It occupies a position mutually exclusive with its paralog BICRAL and helps establish the composition
  of a complex containing BRD9, a SMARCA2 or SMARCA4 ATPase, and selected shared BAF subunits. BICRA associates
  with chromatin and with BRD4, connecting this regulatory complex to transcriptional control. It supports
  activation of selected BRD4 target genes, while other transcriptional and cell-growth effects depend
  on the cellular context. BICRA itself has not been shown to carry out the ATP hydrolysis measured in
  the associated complex.
