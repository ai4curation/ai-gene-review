core_functions:
- description: BICRA helps assemble and specify a GBAF chromatin-remodeling complex and associates it
    with BRD4-linked transcriptional regulation. Its contribution is noncatalytic; the SMARCA2/SMARCA4-containing
    complex supplies the ATP-dependent remodeling activity.
  contributes_to_molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0140288
    label: GBAF complex
  supported_by:
  - reference_id: PMID:29374058
    supporting_text: GLTSCR1/BICRAL are mutually exclusive subunits of GBAF that can, in part, define
      SWI/SNF complex stoichiometry.
  - reference_id: PMID:29374058
    supporting_text: GBAF complexes display robust DNA-stimulated ATPase activity
  - reference_id: PMID:21555454
  - reference_id: Reactome:R-HSA-9932443
suggested_questions:
- question: Which BICRA-specific experiments distinguish activation of BRD4 away from promoters from recruitment
    or coactivation within a chromatin-bound GBAF assembly?
- question: Which exact BICRA peptides and interaction records underlie the NCK1 and CRK annotations from
    PMID:17474147 and PMID:35044719, and do they support native full-length interactions?
- question: How do BICRA and BICRAL contributions to GBAF-dependent stem-cell identity differ when paralog
    compensation is measured directly?
