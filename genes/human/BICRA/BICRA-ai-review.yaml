id: Q9NZM4
gene_symbol: BICRA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BICRA (GLTSCR1) is a nuclear, noncatalytic component of the GBAF or non-canonical BAF chromatin-remodeling
  complex. It occupies a position mutually exclusive with its paralog BICRAL and helps establish the composition
  of a complex containing BRD9, a SMARCA2 or SMARCA4 ATPase, and selected shared BAF subunits. BICRA associates
  with chromatin and links BRD4 to chromatin-remodeling machinery, supporting regulation of selected target
  genes in a context-dependent manner. BICRA haploinsufficiency causes a neurodevelopmental disorder in
  humans; studies in zebrafish and flies connect its conserved chromatin-complex role with developmental
  and chromatin-regulatory phenotypes.
