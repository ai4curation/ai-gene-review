- term:
    id: GO:0050860
    label: negative regulation of T cell receptor signaling pathway
  evidence_type: ISS
  original_reference_id: PMID:7542801
  qualifier: involved_in
  review:
    summary: >-
      CD5 is an inhibitory coreceptor that dampens TCR signalling in
      thymocytes and T cells.
    action: NEW
    reason: >-
      This is the best-established function of CD5 and is missing from GOA.
      CD5-deficient thymocytes are hyperresponsive to TCR stimulation, and
      thymic selection is shifted. The cytoplasmic tail is required, and it
      recruits c-CBL and other negative regulators after TCR-induced
      phosphorylation. In human T cells, CD5 is physically part of the
      TCR/CD3-zeta/LCK complex. Participation test: CD5 does part of the work
      by docking the inhibitory effectors, so it is not merely required.
      Comparator: GO:0050859 (the parallel BCR term) is already annotated to
      CD5. Human loss-of-function corroborates the mouse data: CRISPR deletion
      of CD5 in primary human CAR/TCR-engineered T cells enhances their
      activation and effector function (PMID:39028827, identified via the
      falcon deep research).
    additional_reference_ids:
    - PMID:11313384
    - PMID:23376399
    - PMID:32434911
    - PMID:1384049
    - PMID:39028827
    supported_by:
    - reference_id: PMID:7542801
      supporting_text: These observations indicate that CD5 can influence the
        fate of developing thymocytes by acting as a negative regulator of
        TCR-mediated signal transduction.
    - reference_id: PMID:11313384
      supporting_text: Substitution of endogenous CD5 with a transgene encoding
        a truncated form of the protein failed to rescue the CD5(-/-) phenotype,
        demonstrating that the cytoplasmic domain of CD5 is required for its
        inhibitory function.
    - reference_id: PMID:23376399
      supporting_text: These results support the notion that the distal
        cytoplasmic domain of CD5, including Y463, plays a relevant role in the
        downmodulation of TCR signals in thymocytes via c-Cbl.
    - reference_id: PMID:1384049
      supporting_text: CD5 was found to act as a tyrosine kinase substrate induced
        by TCR/CD3 ligation
    - reference_id: PMID:39028827
      supporting_text: In this study, we found that CD5 inhibits CAR T cell activation
        and that knockout (KO) of CD5 using CRISPR-Cas9 enhances the antitumor effect
        of CAR T cells in multiple hematological and solid cancer models.
    - reference_id: file:human/CD5/CD5-deep-research-falcon.md
      supporting_text: The best-supported primary annotation is an antigen-receptor-associated
        signaling regulator, predominantly restraining the strength of T-cell receptor
        (TCR) signaling.
