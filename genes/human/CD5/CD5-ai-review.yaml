suggested_questions:
- question: >-
    What is the physiological extracellular ligand of CD5 on T cells? Candidates
    include CD72, an uncharacterised B-cell ligand, homophilic CD5 interaction
    and fungal beta-glucans. Does ligand engagement matter for its inhibitory
    function, or does CD5 act constitutively within the TCR complex?
- question: >-
    Should GO capture inhibitory coreceptor function as a molecular function,
    rather than only as signaling receptor activity plus a negative regulation
    process?
suggested_experiments:
- hypothesis: >-
    CD5 inhibits TCR signalling independently of extracellular ligand
    engagement.
  description: >-
    Express ectodomain-truncated or SRCR-domain-swapped CD5 in CD5-deficient
    human T cells (CRISPR knockout of primary T cells) and compare TCR-induced
    calcium flux, ERK activation and proliferation with full-length and
    cytoplasmic-truncated CD5.
- hypothesis: >-
    Tyr429 phosphorylation and c-CBL docking are required for CD5-mediated
    inhibition in human T cells, as in mouse.
  description: >-
    Reconstitute CD5-knockout human T cells with Y429F (mouse numbering,
    mapped to the human residue) and C-terminal deletion mutants, then measure
    recruitment of the signalosome by AP-MS and TCR signal outputs.
