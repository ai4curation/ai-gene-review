core_functions:
- description: >-
    Inhibitory coreceptor at the T-cell plasma membrane. It associates with
    the TCR/CD3-zeta complex, is phosphorylated by Src kinases on TCR
    engagement, and docks c-CBL, CIN85, CRKL, UBASH3A and SHIP1 to dampen TCR
    signalling. This tunes thymocyte selection and limits peripheral Treg
    induction.
  molecular_function:
    id: GO:0038023
    label: signaling receptor activity
  directly_involved_in:
  - id: GO:0050860
    label: negative regulation of T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:7542801
    supporting_text: These observations indicate that CD5 can influence the fate
      of developing thymocytes by acting as a negative regulator of TCR-mediated
      signal transduction.
  - reference_id: PMID:32434911
    supporting_text: We found that T cell receptor (TCR) engagement induces the
      selective phosphorylation of CD5 tyrosine 429, which serves as a docking
      site for proteins with adaptor functions (c-Cbl, CIN85, CRKL), connecting
      CD5 to positive (PI3K) and negative (UBASH3A, SHIP1) regulators of TCR
      signaling.
  - reference_id: PMID:1385158
    supporting_text: between 10%-20% of cell surface CD5 was associated with the
      TcR/CD3 complex
- description: >-
    Negative regulation of B cell receptor signalling in CD5+ B-1 B cells. CD5
    associates with membrane IgM and recruits SHP-1, which limits BCR-induced
    proliferation.
  molecular_function:
    id: GO:0038023
    label: signaling receptor activity
  directly_involved_in:
  - id: GO:0050859
    label: negative regulation of B cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8943203
    supporting_text: Thus the B cell receptor-mediated signaling is negatively
      regulated by CD5 in normal B-1 cells.
  - reference_id: PMID:10540344
    supporting_text: These data support a model whereby CD5 negatively regulates
      antigen receptor-mediated growth signals by recruiting SHP-1 into the BCR
      complex in B-1 cells.
