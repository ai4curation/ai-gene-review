id: P06127
gene_symbol: CD5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CD5 is a single-pass type I transmembrane glycoprotein of the group B
  scavenger receptor cysteine-rich (SRCR) superfamily, with three extracellular
  SRCR domains and a cytoplasmic tail carrying tyrosine phosphorylation sites.
  It is expressed on all T cells and thymocytes and on the B1a subset of B
  cells. In T cells, CD5 associates with the TCR/CD3-zeta complex and the Src
  kinases LCK and FYN, becomes tyrosine phosphorylated within seconds of TCR
  engagement, and recruits inhibitory and adaptor proteins (c-CBL, CIN85,
  CRKL, UBASH3A, SHIP1, PI3K; SHP-1 in B-1 cells). Through this signalosome it
  acts as an inhibitory coreceptor that dampens antigen receptor signalling;
  its surface level scales with the strength of TCR signals during thymic
  selection, allowing it to tune selection outcomes and later to restrain
  peripheral regulatory T cell induction. In B-1 B cells it similarly limits
  BCR-induced growth signals, and in human B cells it promotes ERK1/2
  activation and IL-10 production. Proposed extracellular ligands include CD72
  (disputed) and an uncharacterised B-cell surface ligand; the ectodomain also
  binds fungal (1->3)-beta-D-glucans.
