gene_symbol: MT-RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Small humanin-like peptide 4 (SHLP4) is a predicted 26-residue peptide and a 16S-rRNA sORF
  peptide: its open reading frame lies inside MT-RNR2, the mitochondrial 16S ribosomal RNA gene, in the
  same stretch of mitochondrial DNA that encodes humanin. The six small humanin-like peptides SHLP1-SHLP6
  were identified by an in silico search of this region and named by analogy with humanin, with which
  they share a genomic neighbourhood rather than sequence similarity. The only reported activity is that
  synthetic SHLP4 at 100 nM promoted proliferation of murine NIT-1 beta-cells, in the same screen that
  assigned cytoprotective effects to SHLP2 and SHLP3 and a pro-apoptotic effect to SHLP6; unlike SHLP2
  and SHLP3 it did not increase viability or reduce apoptosis. The peptide was detected by immunoblot
  in mouse liver and prostate. No receptor, binding partner, subcellular location or structural information
  has been reported, and UniProt classifies the entry as PE4 (predicted). How much of this is translated
  in vivo is unresolved. The peptides are read with the cytoplasmic genetic code, yet no route is known
  by which an mtDNA-encoded transcript reaches cytoplasmic ribosomes, nor by which a peptide made in the
  matrix would be exported; and the same region of mitochondrial DNA is present in the nuclear genome
  as MT-RNR2-like (NUMT-derived) copies, so antibody-based detection cannot be attributed to the mitochondrial
  locus with certainty.'
aliases:
- SHLP4
suggested_questions:
- question: Is the proliferative effect of SHLP4 receptor-mediated, and in which cells? The single observation
    is a BrdU increase in one murine beta-cell line at 100 nM (PMID:27070352). No molecular target is
    known, so nothing about SHLP4's own activity can be stated, and no GO term is proposed.
- question: Does SHLP4 share a receptor with SHLP2? SHLP2 and SHLP4 were the two peptides that promoted
    proliferation in the same assay, which makes ACKR3/CXCR7 a testable candidate for SHLP4.
- question: Is SHLP4 translated in human tissue? Detection is by custom antibody in mouse liver and prostate,
    with the usual MT-RNR2-like ambiguity, and the entry is PE4.
suggested_experiments:
- description: Test synthetic SHLP4 for beta-arrestin recruitment and cAMP modulation at ACKR3/CXCR7 and
    across an arrayed GPCR panel, with SHLP2 as a positive control.
  hypothesis: SHLP4 acts through ACKR3/CXCR7 or a related receptor, which would explain the shared proliferative
    phenotype.
- description: Replicate the proliferation result in primary human beta-cells and in a second proliferative
    assay (EdU plus cell counting) across a concentration series, to establish that the effect is real
    and concentration-appropriate.
  hypothesis: SHLP4 promotes beta-cell proliferation reproducibly and at concentrations compatible with
    endogenous levels.
