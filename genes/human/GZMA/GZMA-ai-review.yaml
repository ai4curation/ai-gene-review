gene_symbol: GZMA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Tryptase of the cytotoxic lymphocyte granule and the granzyme that kills without caspases.
  Granzyme A is one of the most abundant proteases in the cytolytic granules of CD8 T cells and natural
  killer cells, made with a signal peptide and an activation dipeptide and secreted into the immunological
  synapse on degranulation, from where perforin delivers it into the target cell. It differs from granzyme
  B in the two ways that matter: it cleaves after lysine or arginine rather than after aspartate, so it
  cannot substitute for caspases on their substrates, and it is an obligate disulfide-linked homodimer
  rather than a monomer. Its killing is correspondingly different. Granzyme A cleaves gasdermin B, releasing
  the pore-forming N-terminal fragment that assembles in the plasma membrane and executes lytic pyroptotic
  death, and the same cleaved gasdermin forms pores in bacterial membranes, which is how NK cells use
  this axis against cytosolic pathogens. It also runs a nuclear programme: it cleaves the nucleosome assembly
  protein SET after Lys189, which frees the endoplasmic-reticulum-associated SET complex to translocate
  and nick DNA, and it destroys the oxidative repair enzyme APEX1 by cleaving it after Lys31, which potentiates
  the death it is causing. It cleaves lamin B efficiently enough to disrupt the nuclear lamina, and does
  so about fifty times more readily than granzyme B. The death it produces shows single-stranded DNA nicking
  rather than the oligonucleosomal fragmentation of apoptosis and proceeds under caspase blockade, which
  is why the older description of granzyme A as apoptosis-inducing has given way to a pyroptotic account.'
