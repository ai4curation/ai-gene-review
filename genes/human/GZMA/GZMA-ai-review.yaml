suggested_questions:
- question: Should granzyme A keep any apoptosis-framed annotation? This review re-levels both the apoptotic
    process and positive-regulation-of-apoptosis rows on the grounds that the death is caspase-independent
    and gasdermin B-dependent, but granzyme A does produce DNA damage and was described as apoptosis-inducing
    for two decades, so a curator may prefer to keep one of them.
  experts:
  - Judy Lieberman
  - Zhibin Zhang
- question: How much of granzyme A killing survives in GSDMB-negative targets? GSDMB expression is tissue-restricted,
    so the SET-complex and APEX1 nuclear programme may be the dominant route in most cells. If so, the
    pyroptosis terms describe a minority of granzyme A deaths and the record is weighted the wrong way.
  experts:
  - Judy Lieberman
  - Zhiwei Zhou
- question: Do the differences between GSDMB isoforms and cleavage products mean the GZMA-GSDMB axis cannot
    be read uniformly across cell types? One of the cited papers reports that distinct isoforms and cleavage
    processes control pyroptosis and mitochondrial damage differently.
  experts:
  - Ana I Robles
  - Jose Palacios
- question: Granzyme A and granzyme B are delivered through the same perforin pore and share the granzyme-mediated
    cell death pathway term, yet their substrate programmes barely overlap. Is a single pathway term the
    right representation, or should the tryptase and Asp-ase routes be distinguishable in the ontology?
  experts:
  - Pascale Gaudet
  - Judy Lieberman
suggested_experiments:
- hypothesis: The nuclear SET-complex programme, not gasdermin B pyroptosis, is the dominant route of
    granzyme A killing in the majority of target cells, which do not express GSDMB.
  description: In isogenic targets differing only in GSDMB expression, deliver purified granzyme A with
    perforin and score lytic death, single-stranded DNA nicking, SET and APEX1 cleavage and lamin B integrity
    side by side. Repeating this across a panel of primary cell types with measured GSDMB levels would
    establish which route predominates where, and so whether the pyroptosis terms or the nuclear ones
    should be read as this gene's core process.
  experiment_type: Isogenic GSDMB panel with route-specific readouts
- hypothesis: Granzyme A contributes to bacterial killing by activating gasdermin B against the bacterial
    membrane, and not merely by killing the infected host cell.
  description: Reconstitute GZMA-cleaved GSDMB with intracellular Listeria or Shigella in host cells and
    in cell-free systems, and compare bacterial viability with host-cell lysis as separate readouts, using
    a non-cleavable GSDMB and a catalytically dead granzyme A as controls. Separating bacteriolysis from
    host pyroptosis would determine whether the proposed defense-response-to-bacterium annotation describes
    a direct antibacterial effect or a consequence of killing the host cell.
  experiment_type: Reconstituted bacteriolysis with separated readouts
- hypothesis: The granzyme A dimer is obligate for killing, so dimerisation is a core molecular function
    rather than an incidental property.
  description: Engineer monomeric granzyme A by substituting the interchain cysteine, confirm folding
    and active-site integrity, then compare catalytic efficiency on peptide substrates against activity
    on GSDMB, SET and APEX1 and against perforin-dependent killing. A monomer that retains peptidase activity
    but loses substrate cleavage or killing would establish the dimer as functionally obligatory.
  experiment_type: Interchain-cysteine mutagenesis with paired biochemistry and killing assays
