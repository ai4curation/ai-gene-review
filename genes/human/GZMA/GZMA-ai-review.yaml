    label: apoptotic process
  evidence_type: TAS
  original_reference_id: PMID:12524539
  qualifier: involved_in
  review:
    summary: Author-statement row placing granzyme A in the apoptotic process.
    action: MODIFY
    reason: The era's framing, superseded by the mechanism. Granzyme A kills in a caspase-independent
      way - the crystal-structure paper says so in those words, and the death it causes shows single-stranded
      DNA nicking rather than the oligonucleosomal fragmentation of apoptosis - and the current account
      of how it kills is cleavage of gasdermin B, which unleashes a pore-forming fragment and makes the
      death pyroptotic. GO:1902483 cytotoxic T cell pyroptotic cell death is already asserted on this
      gene by direct assay and names what actually happens, so it is proposed as the replacement. Modified
      rather than removed because granzyme A certainly drives target cell death; it is the kind of death
      that is mis-stated.
    proposed_replacement_terms:
    - id: GO:1902483
      label: cytotoxic T cell pyroptotic cell death
