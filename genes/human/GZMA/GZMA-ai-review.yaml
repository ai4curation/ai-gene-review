  review:
    summary: Proposed annotation for the NK-cell arm of granzyme A killing, absent from this record as
      it was from PRF1's.
    action: NEW
    reason: 'The same gap this project found and filled on PRF1, in the same pathway. Granzyme A is delivered
      by perforin into targets killed by NK cells as well as by cytotoxic T cells, and the cited paper
      is an NK-cell study: it asks whether NK cells activate GSDMB as host protection against a cytosolic
      pathogen, and shows GZMA-cleaved GSDMB forming pores. The comparator check supports proposing it
      rather than reading the absence as a convention: GZMB, the granzyme in the same granule and the
      same role, carries GO:0042267 by both IDA and IMP, and the term''s human annotations include granule-trafficking
      factors more peripheral to killing than a granzyme is. Participation is not a necessity artefact
      - granzyme A performs the proteolysis that kills. Note that the gene does carry the lineage-neutral
      GO:0140507 and the T-cell-specific GO:1902483, so the NK arm is the one lineage left unstated.'
