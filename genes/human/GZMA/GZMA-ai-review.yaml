core_functions:
- molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  description: 'A tryptase activity, cleaving after lysine or arginine, carried by an obligate disulfide-linked
    homodimer. Those two properties separate granzyme A from granzyme B as completely as their shared
    delivery route unites them: granzyme A cannot stand in for caspases, and it kills without them. Its
    substrates fall into two programmes. At the membrane it cleaves gasdermin B to release a pore-forming
    fragment, which executes pyroptotic death of the target and, in NK cells, perforates bacterial membranes.
    In the nucleus it cleaves SET to free the SET complex for DNA nicking, destroys the oxidative repair
    enzyme APEX1, and cleaves lamin B some fifty times more readily than granzyme B does. So the same
    catalytic function is both activating and destructive depending on the substrate, which is why this
    record carries protein maturation and protein catabolic process side by side.'
