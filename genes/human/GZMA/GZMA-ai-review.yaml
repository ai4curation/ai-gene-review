  review:
    summary: Author-statement row for positive regulation of apoptosis, from the Ape1 study.
    action: MODIFY
    reason: The claim is sound but inherits the same apoptosis framing as the plain apoptotic-process
      row above. What the cited paper shows is that destroying APEX1's repair function potentiates granzyme
      A-mediated death, which is positive regulation of cell death; and the death in question is caspase-independent
      and gasdermin B-dependent rather than apoptotic. GO:0043068 positive regulation of programmed cell
      death is current and is the accurate generalisation, since GO:1902483, the specific death this gene
      causes, sits under programmed cell death. Note that GO:0010942 positive regulation of cell death,
