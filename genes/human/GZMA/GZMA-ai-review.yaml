  description: 'Granzyme A functions as a disulfide-linked homodimer, which the crystal structure resolved
    and which is not incidental: the dimer is the active species, and the structure paper ties this architecture
    to the caspase-independent killing that distinguishes granzyme A from the monomeric granzyme B. Recorded
    as a core function rather than as an interaction because the oligomeric state is part of what the
    enzyme is.'
