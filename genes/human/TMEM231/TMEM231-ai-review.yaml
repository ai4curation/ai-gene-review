core_functions:
- description: Transmembrane MKS-module component that organizes the MKS part of the ciliary transition
    zone, being required (interdependently with B9D1) for TZ localization of B9D1, TMEM67 and MKS1.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  - id: GO:1905349
    label: ciliary transition zone assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - *id015
  - *id013
  - *id014
  - *id007
  - *id006
- description: As part of the TZ diffusion barrier, controls ciliary membrane composition (ARL13B, ADCY3,
    PKD2, INPP5E), thereby supporting Sonic hedgehog signalling and, in some tissues, ciliogenesis.
  directly_involved_in:
  - id: GO:0032880
    label: regulation of protein localization
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0060170
    label: ciliary membrane
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - *id016
  - reference_id: PMID:22179047
    supporting_text: The complex that we have described is essential for normal cilia function and acts
      as a diffusion barrier to maintain the cilia membrane as a compartmentalized signalling organelle.
suggested_questions:
- question: Does TMEM231, with septin 2, mark the site of the future transition zone before other MKS
    components arrive, i.e. is it an early nucleator of MKS-module assembly?
  experts: []
- question: How do disease variants (e.g. those causing OFD3 versus MKS) differ quantitatively in their
    ability to restore B9D1 recruitment and ARL13B ciliary localization?
  experts: []
suggested_experiments:
- hypothesis: TMEM231 recruitment precedes and templates the MKS module at the ciliary base.
  description: Live imaging of endogenously tagged TMEM231, B9D1, MKS1 and TCTN2 during serum-starvation-induced
    ciliogenesis in RPE1 cells, with and without SEPT2 depletion, to order MKS-module arrival at the mother
    centriole.
  experiment_type: live-cell imaging
