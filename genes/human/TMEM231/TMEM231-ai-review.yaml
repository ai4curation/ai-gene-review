- term:
    id: GO:1905349
    label: ciliary transition zone assembly
  evidence_type: IMP
  original_reference_id: PMID:25869670
  qualifier: involved_in
  review:
    summary: Tmem231 is required in mouse cells to assemble the MKS part of the transition zone (TZ localization
      of B9d1, Tmem67 and Mks1). The paper's own conclusion is that TMEM231 organizes the transition zone.
    action: NEW
    reason: 'Participation test: TMEM231 is a structural transmembrane constituent of the TZ MKS module
      and is required for incorporation of its partners (scaffold case), not merely necessary upstream.
      GO:1905349 replaces the obsoleted GO:0097711 and is currently annotated to very few genes (CEP290,
      CCDC66, DZIP1L), so absence for MKS subunits reflects an under-populated term rather than a curation
      convention. This matches the module''s assignment of TZ assembly to the MKS module.'
    supported_by:
    - &id015
      reference_id: PMID:25869670
      supporting_text: TMEM231, mutated in orofaciodigital and Meckel syndromes, organizes the ciliary
        transition zone.
    - *id013
    - *id014
