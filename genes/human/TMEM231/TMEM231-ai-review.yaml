- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2685024
  - PANTHER:PTN000378535
  - WB:WBGene00020825
  review:
    summary: Knockdown of the TMEM231/B9D1/CC2D2A complex reduces cilia formation, and mouse knockouts
      show ciliogenesis defects in some tissues. Tmem231-/- MEFs nonetheless ciliate.
    action: ACCEPT
    reason: TMEM231 contributes to cilium assembly in a tissue-dependent manner, as for other MKS-module
      components. Its primary role is building the TZ and controlling ciliary membrane composition. The
      process annotation is acceptable but should not be read as an absolute requirement for axoneme formation.
    supported_by:
    - &id011
      reference_id: PMID:22179047
      supporting_text: Disruption of the complex in vitro causes a reduction in cilia formation and a
        loss of signalling receptors from the remaining cilia.
    - *id001
    - &id012
      reference_id: PMID:25869670
      supporting_text: Thus, Tmem231 and B9d1 are essential for controlling the composition of the ciliary
        membrane, but are not essential for ciliogenesis.
