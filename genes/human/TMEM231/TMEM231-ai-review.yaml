id: Q9H6L2
gene_symbol: TMEM231
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TMEM231 is a conserved two-pass transmembrane protein of the MKS (tectonic) module of the
  ciliary transition zone, found only in ciliated organisms. It reaches the basal body early in ciliogenesis,
  before and independently of intraflagellar transport, in a septin-dependent manner, and becomes a biochemical
  component of the MKS complex with B9D1, B9D2, MKS1, TCTN1-3, CC2D2A and TMEM17. TMEM231 and B9D1 are
  needed for each other's transition-zone localization and for that of TMEM67 and MKS1, so TMEM231 helps
  organize the MKS part of the transition zone. Through this it maintains the ciliary diffusion barrier
  and the ciliary membrane composition (ARL13B, ADCY3, PKD2, INPP5E), supports tissue-dependent ciliogenesis
  and is required for Sonic hedgehog signalling. Variants cause Joubert syndrome 20, Meckel syndrome 11
  and oral-facial-digital syndrome type 3.
