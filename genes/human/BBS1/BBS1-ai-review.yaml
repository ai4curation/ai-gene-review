    - PMID:20603001
- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: NAS
  original_reference_id: PMID:19081074
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: BBS1 contributes to cilium assembly in the experimentally annotated contexts.
    reason: "Retain the established ciliogenesis annotation without asserting an absolute requirement
      in every cell type: ciliary cargo defects can occur with preserved cilium length. BBSome-dependent
      membrane biogenesis supports the process; the existing source/evidence remains distinct from other
      subunits' specific tubulin effects."
    additional_reference_ids:
    - PMID:17574030
    - PMID:24939912
