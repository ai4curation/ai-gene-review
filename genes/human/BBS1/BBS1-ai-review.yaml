suggested_questions:
- question: Which receptor-tail contacts with BBS1 are direct in a purified human BBSome, and how 
    does cargo binding alter its interaction with ARL6?
- question: How do BBS1-dependent cargo transport and cilium maintenance contribute separately to 
    motile-cilium phenotypes across mammalian tissues?
suggested_experiments:
- hypothesis: Receptor-tail recognition and ARL6-dependent membrane recruitment can be separated by 
    BBS1 mutations.
  description: Test structure-guided variants in purified human BBSome receptor-tail binding and 
    ARL6-binding assays, followed by matched cellular measurements of receptor trafficking, cilium 
    abundance and length. Compare these readouts rather than inferring universal ciliogenesis 
    failure from altered cargo distribution.
  experiment_type: binding biochemistry and ciliary cargo transport
