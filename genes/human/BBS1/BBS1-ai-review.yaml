  qualifier: enables
  review:
    action: ACCEPT
    summary: BBS1 associates with the ciliary signaling receptor PTCH1.
    reason: PMID:22228099 includes human BBS1 constructs in reciprocal immunoprecipitation and 
      receptor-tail mapping experiments in 293T cells. These support the specific receptor-binding 
      function, separately from the mouse genetic and ciliary-accumulation results. Cell-lysate 
      association is not represented as a purified binary-affinity measurement. The original IPI 
      source is therefore retained as core cargo recognition.
