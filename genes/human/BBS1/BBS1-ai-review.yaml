- term:
    id: GO:0060170
    label: ciliary membrane
  evidence_type: IDA
  original_reference_id: PMID:19081074
  qualifier: located_in
  review:
    action: ACCEPT
    summary: BBS1 acts with the BBSome at ciliary membranes.
    reason: Membrane-associated BBSome cargo sorting supports this core localization. The 
      BBIP1-focused paper does not transfer BBIP1-specific cytoplasmic tubulin activities to BBS1.
