- term:
    id: GO:0061512
    label: protein localization to cilium
  evidence_type: IMP
  original_reference_id: PMID:23943788
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: BBS1 contributes to localization of membrane cargo and the BBSome to cilia.
    reason: 'Ciliary cargo localization is central to BBSome function. The original PMID:23943788 IMP
      attribution is retained with curator deference: its available cached text emphasizes BBS4 and CEP290,
      omits Results and Methods, and does not expose the BBS1-specific experiment. Independent PMID:24939912
      evidence directly supports BBS1-dependent polycystin-1 ciliary targeting, with general plasma-membrane
      delivery preserved. The quotation is corroboration from that separate paper, not verification of
      the uninspected experiment in the original source.'
    additional_reference_ids:
    - PMID:20603001
    - PMID:24939912
    supported_by:
    - reference_id: PMID:24939912
      supporting_text: depletion or mutation of BBS1, but not depletion of BBS5 and BBS8, or 
        knockout of BBS4, impairs ciliary trafficking of PC1
