- term:
    id: GO:0061629
    label: RNA polymerase II-specific DNA-binding transcription factor binding
  evidence_type: IPI
  original_reference_id: PMID:22302990
  qualifier: enables
  review:
    action: MODIFY
    summary: BBS1 associates with RNF2, a ubiquitin protein ligase.
    reason: The original partner is RNF2/Q99496. Primary Figure 3C and corresponding Results 
      explicitly include tagged BBS1-RNF2 co-immunoprecipitation; the BBS7-focused abstract does not
      negate it. RNF2 is a PRC1 ubiquitin ligase rather than the sequence-specific DNA-binding 
      transcription factor required by the original term. Refine the partner class without asserting
      BBS1 ligase activity, a purified binary interaction, or BBS7-specific yeast/endogenous assays.
    additional_reference_ids:
    - PMID:22302990
    proposed_replacement_terms:
    - id: GO:0031625
      label: ubiquitin protein ligase binding
  supporting_entities:
  - UniProtKB:Q99496
