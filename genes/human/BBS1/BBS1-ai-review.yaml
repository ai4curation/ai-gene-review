id: Q8NFJ9
gene_symbol: BBS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS1 is a subunit of the BBSome, a membrane-trafficking coat composed of BBS1, BBS2, 
  BBS4, BBS5, BBS7, TTC8/BBS8, BBS9 and BBIP1. Its N-terminal beta-propeller binds GTP-loaded ARL6, 
  helping recruit the complex to membranes. BBS1 also associates with cytoplasmic regions of 
  signaling receptors, including Smoothened, Patched1 and the leptin receptor. These contacts 
  contribute to cargo recognition and the regulated composition of ciliary membranes. BBS1 has 
  cytoplasmic, centrosomal and ciliary pools and supports ciliary trafficking in sensory and other 
  ciliated cells. Loss of BBS1 disrupts receptor trafficking and cilium function and causes 
  Bardet–Biedl syndrome.
