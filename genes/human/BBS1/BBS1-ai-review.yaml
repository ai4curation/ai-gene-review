core_functions:
- description: Binds active ARL6 through its N-terminal beta-propeller, contributing to recruitment 
    of the BBSome to the ciliary membrane. Human recombinant domain-binding measurements support 
    this interaction; ARL6 supplies the GTPase activity.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
