- term:
    id: GO:1905515
    label: non-motile cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:17980398
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: BBS1 contributes to cilium assembly in the experimentally annotated contexts.
    reason: 'Retain the established ciliogenesis annotation without asserting an absolute requirement
      in every cell type: ciliary cargo defects can occur with preserved cilium length. This human BBS1/BBS10
      patient OCT study reports disrupted photoreceptor architecture and poorly identifiable connecting
      cilia; the available cache lacks Methods and does not directly resolve an assembly step. Retention
      defers to the existing IMP interpretation and the broader experimental ciliogenesis literature,
      not a new mechanistic claim from imaging.'
