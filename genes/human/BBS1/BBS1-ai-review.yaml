- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IDA
  original_reference_id: PMID:18762586
  qualifier: located_in
  review:
    action: ACCEPT
    summary: BBS1 has a centrosomal/basal-body-associated pool relevant to ciliary recruitment.
    reason: Retain the curator-supported localization alongside ciliary localization. PMID:18762586 
