    label: ciliary membrane
  in_complex:
    id: GO:0034464
    label: BBSome
  supported_by:
  - reference_id: PMID:25402481
    supporting_text: HsBBS1N bound HsARL6ΔN–GTP with a Kd of 0.54μM
- description: Recognizes signaling-receptor cargo as part of the BBSome. Human-cell 
    co-immunoprecipitation and receptor-tail mapping support associations with Smoothened and 
    Patched1. These contacts contribute to the complex's role in controlling receptor localization 
    at cilia; the assays do not establish purified binary affinities for each receptor.
  molecular_function:
