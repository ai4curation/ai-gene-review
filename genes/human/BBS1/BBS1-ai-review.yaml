    label: regulation of cilium beat frequency involved in ciliary motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Bbs1-mutant airway cilia have altered beating, supporting a non-core motile-cilium 
      role.
    reason: The mouse MGI IMP donor annotation links the beat-frequency phenotype to PMID:18299575. 
      Retain the electronic transfer as physiological context; BBS1 is not thereby a dynein motor or
      a universal ciliogenesis factor.
    additional_reference_ids:
    - PMID:18299575
    supported_by:
    - reference_id: PMID:18299575
      supporting_text: ciliary beat frequency was reduced in Bbs mutant mice.
  supporting_entities:
  - UniProtKB:Q3V3N7
  - ensembl:ENSMUSP00000055321
