gene_symbol: ROCK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ROCK1 is a RhoA/RhoB/RhoC-activated AGC serine/threonine protein kinase that phosphorylates
  cytoskeletal and myosin-phosphatase substrates to control actomyosin contractility, stress-fiber and
  focal-adhesion assembly, membrane blebbing, cell motility and several specialized differentiation or
  neuronal signaling outputs.'
