suggested_questions:
- question: Should TICAM1 carry a process term for RIPK1/RIPK3-dependent cell death (e.g. necroptotic
    signaling or extrinsic apoptotic signaling)? The RHIM-containing C-terminus induces RIPK1/FADD/caspase-8-dependent
    apoptosis on overexpression and Reactome models RIPK3:TRIF necroptosis, but no GOA row captures this,
    and human evidence beyond overexpression was not found in the cached literature.
- question: Is TLR5 signaling through TRIF (reported in intestinal epithelial cells, largely from mouse
    knockouts) robust enough to annotate TICAM1 to GO:0034146 toll-like receptor 5 signaling pathway,
    given that IRF3 activation was not observed in that setting?
- question: Is the mitochondrial localization of a DDX1-DDX21-DHX36-TICAM1 helicase complex (reported
    in mouse myeloid dendritic cells) reproducible in human cells, or should the mitochondrion annotations
    be retired?
- question: Does the TICAM1 N-terminal domain (IFIT-like fold) have an activity of its own, for example
    as a regulatory or autoinhibitory module, beyond its role in recruiting TRAF6 and TBK1?
suggested_experiments:
- description: In TICAM1-knockout human macrophages or epithelial cells, reconstitute wild-type TICAM1,
    a RHIM-mutant, a TRAF6-motif mutant and a pLxIS (S210A) mutant, then stimulate with poly(I:C) and
    LPS and measure IRF3 phosphorylation, NF-kappaB activation, IFNB1 output and cell death (apoptosis
    vs necroptosis with caspase inhibition).
  hypothesis: The three effector-recruitment modules of TICAM1 are separable, and the RHIM module is required
    for TLR3/TLR4-induced cell death in human cells at endogenous expression levels.
  experiment_type: genetic complementation in knockout cells
- description: Live-cell imaging of endogenously tagged TICAM1 with TLR3, TICAM2 and organelle markers
    (EEA1, LAMP1, TOM20) after poly(I:C) or LPS stimulation in primary human dendritic cells.
  hypothesis: TICAM1 signaling speckles assemble at the cytoplasmic face of endosomes and not at mitochondria
    in human cells.
  experiment_type: live-cell imaging
