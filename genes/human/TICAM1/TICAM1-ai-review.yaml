id: Q8IUC6
gene_symbol: TICAM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TICAM1 (TRIF, TIR domain-containing adapter molecule 1) is a cytoplasmic signaling adaptor
  of the MyD88-independent branch of Toll-like receptor signaling. Its C-terminal TIR domain engages the
  TIR domain of endosomal TLR3 directly after double-stranded RNA recognition, and of TLR4 through the
  sorting adaptor TICAM2 (TRAM) after LPS-induced receptor internalization into endosomes. From this position
  TICAM1 recruits distinct effectors through separate motifs: TRAF6 through N-terminal TRAF6-binding motifs
  (NF-kappaB and MAPK activation via TAK1), TRAF3 and the kinase TBK1/IKBKE (via its N-terminal region),
  and RIPK1 and RIPK3 through a C-terminal RHIM region (NF-kappaB activation, caspase-8-dependent apoptosis
  or necroptosis). TBK1 phosphorylates Ser210 in the TICAM1 pLxIS motif, which then binds IRF3 and positions
  it for TBK1-mediated activation, driving IFN-beta and interferon-stimulated gene expression. TICAM1
  is diffuse in the cytosol at rest and forms signaling speckles upon stimulation; its abundance and activity
  are controlled by ubiquitination (TRIM38, TRIM8), selective autophagy and inhibitory partners such as
  SARM1, and it is cleaved by several viral proteases as an immune-evasion strategy.'
