core_functions:
- description: 'Signaling adaptor of TLR3 and of the endosomal (TRAM-dependent) arm of TLR4: engages the
    receptor TIR domain and recruits TRAF6, TRAF3, TBK1 and RIPK1 through distinct motifs; the TBK1-phosphorylated
    pLxIS motif recruits IRF3 for its activation, driving type I interferon production, while the TRAF6/RIPK1
    branch activates canonical NF-kappaB.'
