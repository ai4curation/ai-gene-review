- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029053
  review:
    summary: Cell surface receptor signaling pathway (ARBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0002224 toll-like receptor signaling pathway is not classified under cell surface receptor
      signaling pathway (checked in OLS). TICAM1 signals mainly downstream of endosomal TLR3 and of TLR4
      after internalization into endosomes, so the cell-surface framing is misleading; the TLR pathway
      terms capture the process correctly.
    supported_by:
    - *id007
    - reference_id: PMID:36865541
      supporting_text: Most TLRs employ MyD88 as signaling adaptor, with the exceptions being TLR3 that
        signals exclusively via TRIF and TLR4 that uses both TRIF and MyD88 (2).
