- term:
    id: GO:0002224
    label: toll-like receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:12471095
  qualifier: involved_in
  review:
    summary: TICAM1 (TRIF) was identified as a TIR-domain adaptor that associates with TLR3 and mediates
      the MyD88-independent arm of TLR signaling.
    action: ACCEPT
    reason: 'Direct evidence in the discovery paper: TRIF associates with TLR3, and dominant-negative
      TRIF blocks TLR3-driven NF-kappaB and IFN-beta promoter activation and TLR2/4/7-driven NF-kappaB
      activation. TICAM1 performs the adaptor step of the pathway, so participation is direct. The more
      specific TLR3, TLR4 and TRIF-dependent terms are also accepted.'
    supported_by:
    - &id009
      reference_id: PMID:12471095
      supporting_text: TRIF associated with TLR3 and IFN regulatory factor 3.
    - &id012
      reference_id: PMID:12471095
      supporting_text: Dominant-negative TRIF inhibited TLR3-dependent activation of both the NF-kappaB-dependent
        and IFN-beta promoters.
    - &id013
      reference_id: PMID:12471095
      supporting_text: A dominant-negative form of TRIF inhibited TLR2-, TLR4-, and TLR7-dependent NF-kappaB
        activation.
