suggested_questions:
- question: What exact original experiments and identifier mapping support the CD40-PIK3R1 IPI assertion
    from PMID:26210919 and the mechanical-stimulus IEP assertion from PMID:19593445?
- question: Which ligand presentation states and cell types select CD40-TRAF2/3 versus TRAF6 complexes,
    and how does secreted isoform II alter native membrane-receptor signaling?
- question: What original NAS provenance maps PMID:9468137 to platelet activation, separately from the
    independent CD40 receptor evidence in PMID:12676820?
- question: Which original donor experiments and ARBA conditions support steady-state calcium homeostasis,
    as distinct from the observed transient calcium rise after CD40 engagement?
suggested_experiments:
- hypothesis: Ligand presentation and receptor-tail contacts determine CD40 signaling branch selection
    independently of receptor abundance.
  description: Compare expression-matched human CD40 tail mutants and membrane versus soluble CD40L using
    ligand-binding controls, timed TRAF recruitment, calcium imaging and canonical/noncanonical NF-kappaB
    measurements; test secreted isoform II separately.
  experiment_type: genetic and biochemical
