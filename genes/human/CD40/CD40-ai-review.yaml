- molecular_function:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  description: Cytoplasmic-tail motifs bind TRAF ubiquitin ligases and recruit them to the
    activated receptor complex. Human CD40-tail complexes with TRAF2 and TRAF6 establish
    distinct docking interfaces, while tail mapping and recruitment experiments connect
    these contacts to signaling. This docking activity is a molecular facet of the same
    ligand-triggered receptor unit; the recruited enzymes perform ubiquitin transfer.
  directly_involved_in:
