  review:
    summary: Qualified CD40 association with mouse OTUD7B is retained.
    action: KEEP_AS_NON_CORE
    reason: Selected original receptor-complex assays use mouse M12 B cells stably expressing human CD40,
      distinct from mouse Otud7b-knockout B-cell phenotypes. Anti-human CD40 stimulation and precipitation,
      TRAF3 knockdown and Otud7b UBA-domain controls support recruitment to the signaling complex. The
      exact B2RUR8 mouse partner and Xeno designation are preserved. This is not demonstrated purified
      binary CD40–OTUD7B recognition, and the deubiquitinase partner is not assigned the ligase class
      of neighboring TRAF proteins.
    supported_by:
    - reference_id: PMID:23334419
