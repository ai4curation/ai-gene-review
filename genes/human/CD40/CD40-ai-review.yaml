core_functions:
- molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  description: Recognizes CD40L at the cell surface and couples ligand engagement to cytoplasmic TRAF
    recruitment, enabling immune activation and B-cell responses. Ligand recognition and receptor-tail
    docking form one signal-transduction unit; recruited TRAF proteins and kinases perform the enzymatic
    steps. The membrane receptor, not the secreted alternative product, supplies this transmembrane activity.
  directly_involved_in:
