  review:
    summary: CD40 binds the ubiquitin ligase TRAF2.
    action: MODIFY
    reason: The original human TRAF2/CD40 peptide co-crystal establishes a physical docking interface.
      Official PDB entries 1CZZ/1D00 identify the same source; isolated peptide/domain constructs are
      distinguished from intact ligand-stimulated receptors. GO:0031625 records the verified enzyme class
      of the exact binding partner. It neither assigns ubiquitin-transfer chemistry to CD40 nor asserts
      that the original interaction assay measured catalysis.
