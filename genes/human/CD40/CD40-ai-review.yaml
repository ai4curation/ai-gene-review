id: P25942
gene_symbol: CD40
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD40 is a type I membrane receptor for CD40 ligand (CD154/TNFSF5). Its extracellular region
  recognizes ligand, while cytoplasmic motifs recruit TRAF proteins and organize signaling that activates
  NF-kappaB and MAP kinase pathways. This receptor activity helps antigen-presenting cells coordinate
  immune responses and enables B-cell activation, proliferation and differentiation together with other
  inputs such as IL4. CD40 also mediates context-dependent inflammatory, endothelial and tumor-cell responses.
  It has no intrinsic protein kinase or ubiquitin ligase activity. The membrane isoform supplies
  transmembrane signaling, whereas an alternatively spliced product is secreted. Biallelic loss of functional
  CD40 causes immunodeficiency with hyper-IgM type 3.
