core_functions:
- description: Reversibly binds and carries circulating ligands, including bilirubin, fatty acids
    and heme. The soluble protein supplies binding and exchange capacity; membrane translocation is
    performed by other proteins.
  molecular_function:
    id: GO:0140104
    label: molecular carrier activity
  directly_involved_in:
  - id: GO:0015723
    label: bilirubin transport
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:20705604
    supporting_text: "human serum albumin could\nbe one of these possible partners as it removes hemin
      bound to ECL3"
    full_text_unavailable: true
  - reference_id: PMID:1157293
    supporting_text: "The tight binding\ncapacity of a pool of normal adult human serum was found to be
      20 mg/dl of\nserum."
    full_text_unavailable: true
  - reference_id: Reactome:R-HSA-9661432
    supporting_text: "ALB-bound BIL is a water-soluble\n  complex and is transported to the liver where
      it is selectively absorbed by hepatocytes."
  - reference_id: file:human/ALB/ALB-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
- description: Buffers oxidant toxicity in extracellular fluid, including metal-associated oxidant
    stress. Human albumin and its N-terminal DAHK peptide protect cultured neurons; this does not
    imply albumin has every catalytic antioxidant mechanism of heme enzymes.
  molecular_function:
    id: GO:0016209
    label: antioxidant activity
  directly_involved_in:
  - id: GO:0098869
    label: cellular oxidant detoxification
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:14726550
    supporting_text: "HSA provided complete protection\nat a concentration of 37.5 micromol/L and 50%
      protection at 3.75 micromol/L."
    full_text_unavailable: true
  - reference_id: PMID:14726550
    supporting_text: "Murine cortical cultures were exposed to oxidative stress generated by\nhydrogen
      peroxide and by a mixture of copper plus ascorbic acid."
    full_text_unavailable: true
  - reference_id: file:human/ALB/ALB-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
suggested_questions:
- question: Which physiological albumin pools and molecular forms mediate the nutrient-response
    process inferred at the albumin-family ancestral node?
- question: Does native human albumin directly bind VvhA, and which interface accounts for its
    effect on hemolysin oligomerization?
- question: Which albumin proteoforms are present in sperm nuclei and extracellular-vesicle
    preparations, and are they internal cargo, surface-associated protein or soluble carryover?
- question: How much of extracellular albumin antioxidant protection arises from metal sequestration
    versus its free thiol and ligand-dependent chemistry in human tissues?
- question: How do albumin concentration and ligand occupancy affect its contribution to plasma
    colloid osmotic pressure?
