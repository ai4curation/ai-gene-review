id: P02768
gene_symbol: ALB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Albumin is a secreted, abundant plasma protein that maintains colloid osmotic pressure
  and carries a wide range of endogenous and exogenous ligands. Its binding pockets accommodate
  fatty acids, bilirubin, heme, drugs and metal ions, coupling reversible sequestration to delivery
  or exchange with other molecules. Human albumin accepts hemin from the extracellular domain of
  ABCG2 and can transfer heme to hemopexin. It also buffers oxidant toxicity, with its metal-binding
  N-terminal region contributing to protection under experimental oxidative stress. Albumin is
  synthesized as a secretory precursor; transient secretory and platelet-granule pools are distinct
  from its principal extracellular site of action. Loss of albumin causes analbuminemia, whereas
  some binding-site variants alter thyroid-hormone affinity and produce familial dysalbuminemic
  hyperthyroxinemia.
