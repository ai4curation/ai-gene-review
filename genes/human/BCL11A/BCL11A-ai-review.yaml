core_functions:
- description: 'Directly represses RNA polymerase II transcription through sequence-specific regulatory
    DNA binding and cofactor engagement. The best resolved example is BCL11A-XL repression of gamma-globin
    in adult erythroid cells: its C-terminal zinc-finger array recognizes a distal promoter motif, and
    disruption of this interaction relieves repression. This role is distinct from context-dependent transcriptional
    activation and does not assign chromatin-remodeling ATPase chemistry to BCL11A.'
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:29606353
    supporting_text: repression of γ-globin gene expression requires direct binding of BCL11A to the distal
      promoter motif.
suggested_questions:
- question: Which target-specific evidence supports BCL11A activity at the postsynapse, distinct from
    nuclear CASK-associated transcription?
- question: Does BCL11A directly organize SUMO conjugation on other substrates, or does nuclear-body recruitment
    principally reflect its own modification?
- question: How do isoform composition, tetramerization and cofactor availability determine whether BCL11A
    represses or activates a particular target promoter?
