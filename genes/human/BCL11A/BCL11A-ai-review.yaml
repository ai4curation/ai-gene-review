gene_symbol: BCL11A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCL11A is a zinc-finger transcriptional regulator expressed in hematopoietic and neural tissues.
  Its longer isoforms act in the nucleus, associate with chromatin and nuclear bodies, and interact with
  transcriptional cofactors, including BAF chromatin-remodeling complexes. In adult erythroid cells, the
  XL isoform directly binds gamma-globin promoters through its C-terminal zinc-finger array and represses
  fetal-globin expression. BCL11A also regulates lymphoid and neuronal gene programs, with activating
  or repressive effects depending on the cellular context. Alternative splicing changes its zinc-finger
  complement and subcellular distribution. In COS7 expression experiments, GFP-tagged S was predominantly
  cytoplasmic and relocated to nuclear bodies when coexpressed with Gal4DBD-fused XL or L. Heterozygous
  loss of function causes a neurodevelopmental disorder that can include persistent fetal hemoglobin.
