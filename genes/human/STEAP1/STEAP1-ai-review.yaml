core_functions:
- description: Homotrimeric six-transmembrane heme b-binding protein at the plasma membrane; lacks NADPH-binding
    domain and intrinsic ferric reductase activity, with a possible electron-transfer role in STEAP heterotrimers.
  molecular_function:
