description: STEAP1 (six-transmembrane epithelial antigen of the prostate 1) is a multi-pass plasma membrane
  protein of the STEAP metalloreductase family that assembles as a homotrimer. Each protomer has six transmembrane
  helices with cytoplasmic N- and C-termini and binds a heme b cofactor near the extracellular leaflet.
  Unlike STEAP2-4, STEAP1 lacks the cytoplasmic NADPH-binding oxidoreductase domain and on its own shows
  no cellular ferric reductase activity; its transmembrane heme domain can reduce Fe(III) when supplied
  with electrons from a STEAP4 NADPH domain, suggesting a possible role within STEAP heterotrimers. STEAP1
  is expressed mainly in prostate epithelium and is strongly overexpressed at the cell surface of prostate
  and other cancers, where its extracellular helices are targeted by therapeutic antibodies.
