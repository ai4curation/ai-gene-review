suggested_questions:
- question: Does STEAP1 form heterotrimers with STEAP2 or STEAP4 in native prostate cells, and do these
    mediate Fe(III)/Cu(II) reduction at the cell surface?
- question: What, if anything, is the physiological electron donor for the STEAP1 heme in the absence
    of an NADPH domain?
suggested_experiments:
- description: Co-immunoprecipitation and native mass spectrometry of endogenous STEAP family proteins
    in LNCaP cells, combined with cell-surface ferric reductase assays after STEAP1 knockdown.
