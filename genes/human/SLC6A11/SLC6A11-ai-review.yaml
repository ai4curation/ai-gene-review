suggested_questions:
- question: >-
    What fraction of brain GAT-3 is astrocytic versus neuronal in human, and does
    the balance shift in epilepsy or other disorders?
- question: >-
    Is guanidinoacetate transport by GAT-3 physiologically significant for brain
    creatine/guanidinoacetate homeostasis in humans, or mainly a pharmacological
    observation?
suggested_experiments:
- description: >-
    Cell-type-resolved immuno-EM / single-cell proteomics of human cortex and
    hippocampus to quantify GAT-3 distribution across astrocytic processes versus
    neuronal membranes.
- description: >-
    Structure-guided transport assays (building on the human GAT-3 cryo-EM structures)
    to define substrate selectivity and the Na+/Cl-/GABA coupling stoichiometry
    quantitatively, including beta-alanine, taurine and guanidinoacetate.
