core_functions:
- description: >-
    Sodium- and chloride-dependent reuptake/clearance of GABA from the extracellular
    and perisynaptic space, driven by the inwardly directed Na+ and Cl- electrochemical
    gradients (about 2 Na+ and 1 Cl- co-transported per GABA). Carried out at the
    plasma membrane, predominantly by astrocytes, terminating and recycling GABAergic
    neurotransmission.
