id: P48066
gene_symbol: SLC6A11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A11 encodes GABA transporter 3 (GAT-3), a sodium- and chloride-dependent
  secondary-active symporter of the SLC6/neurotransmitter:sodium symporter (SNF,
  LeuT-fold) family. The protein is a multi-pass integral plasma-membrane
  transporter (12 transmembrane helices) that couples the inward movement of GABA
  to the co-transport of sodium and chloride down their electrochemical gradients,
  with a stoichiometry of about two Na+ and one Cl- per GABA. GAT-3 is expressed
  predominantly in astrocytes, where it clears GABA from the extracellular and
  perisynaptic space, terminating and recycling GABAergic signalling. Besides GABA,
  it transports beta-alanine and, with lower efficiency, taurine and hypotaurine,
  and it also takes up the creatine precursor guanidinoacetate. It is brain-enriched
  and is a pharmacological target (inhibited selectively by SNAP-5114).
