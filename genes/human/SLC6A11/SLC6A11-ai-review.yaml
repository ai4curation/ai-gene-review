- term:
    id: GO:0051936
    label: gamma-aminobutyric acid reuptake
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-888593
  qualifier: involved_in
  review:
    summary: >-
      Core biological process: GAT-3 performs Na+/Cl--dependent clearance/reuptake of
      GABA from the extracellular/perisynaptic space.
    action: ACCEPT
    reason: >-
      This is the specific process the transporter carries out and the most
      informative BP term; curated by Reactome. GAT-3 is the entity that performs the
      GABA transport step, satisfying the participation test. (For glial clearance this
      is uptake into astrocytes; "reuptake" is the standard GO term for GAT-family GABA
      clearance.)
