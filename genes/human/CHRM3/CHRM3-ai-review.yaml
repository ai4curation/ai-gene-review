id: P20309
gene_symbol: CHRM3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CHRM3 encodes the M3 muscarinic acetylcholine receptor, a seven-transmembrane receptor that
  predominantly activates Gq/11, phospholipase C and calcium signaling. It regulates smooth-muscle contraction
  and exocrine secretion, including intestinal and salivary responses. The receptor can occupy basolateral
  epithelial membranes, and TMEM147 can retain a pool in the endoplasmic reticulum. Its signaling repertoire
  is context dependent: human M3 associates with NALCN in heterologous cells, while a Src-dependent, G-protein-independent
  channel response was studied in a mouse pancreatic beta-cell line.'
