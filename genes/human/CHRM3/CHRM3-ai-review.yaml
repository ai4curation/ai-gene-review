  review:
    summary: M3 promotes smooth-muscle contraction through muscarinic signaling.
    action: MODIFY
    reason: 'The conserved regulatory process can be refined to the positive regulation already assigned
      to M3, consistent with its calcium-linked contractile role. Tissue-specific coupling and other muscarinic
      subtypes do not invalidate this supported direction. Original ancestral source: PANTHER:PTN002797896.'
    supported_by:
    - reference_id: PMID:14744253
    - reference_id: file:human/CHRM3/CHRM3-uniprot.txt
    proposed_replacement_terms:
