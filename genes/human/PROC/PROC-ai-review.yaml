suggested_questions:
- question: Does IntAct's PMID:15248212 interaction for protein C name the intended matrix metalloproteinase (MMP15
    in the record, MMP-2 in the abstract)?
- question: Should the APC-specific PAR1 activation be represented by a dedicated process term, analogous to GO:0070493
    thrombin-activated receptor signaling pathway?
