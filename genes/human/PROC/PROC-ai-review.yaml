id: P04070
gene_symbol: PROC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Protein C is a vitamin K-dependent plasma glycoprotein made in the liver and secreted as a two-chain
  serine protease zymogen, with an N-terminal Gla domain, two EGF-like domains and a trypsin-like protease domain.
  On the endothelial surface, thrombin bound to thrombomodulin cleaves its activation peptide, a reaction accelerated
  when the Gla domain binds the endothelial protein C receptor (EPCR). Activated protein C (APC), bound to phospholipid
  membranes and helped by protein S and factor V, inactivates coagulation factors Va and VIIIa by limited proteolysis,
  which limits thrombin generation. Bound to EPCR, APC also cleaves protease-activated receptor 1 at a non-canonical
  site, starting biased signalling that protects endothelial barrier function and has anti-apoptotic and anti-inflammatory
  effects. Inherited protein C deficiency causes venous thrombosis, and severe homozygous deficiency causes neonatal
  purpura fulminans.
