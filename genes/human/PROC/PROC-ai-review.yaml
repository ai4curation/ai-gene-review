  review:
    summary: ER location from mutant protein C retained in transfected cells; not the endogenous protein; a real
      biosynthetic pool, peripheral to the function.
    action: KEEP_AS_NON_CORE
    reason: 'PROC is a secreted plasma protein, and these rows record its biosynthetic ER or Golgi pool. The evidence
      is direct on the gene product: wild-type as well as mutant protein C co-localises with PDI and GM130 in transfected
      cells. ORGANELLES rule 7 keeps a secretory protein''s ER row as KEEP_AS_NON_CORE when there is direct evidence
      on the gene, and the same reading applies to the Golgi; the location is real but peripheral to the protein''s
      function in plasma.'
    supported_by:
    - reference_id: PMID:22531345
      supporting_text: Immunofluorescence staining revealed that the mutant protein was mainly located in the endoplasmic
        reticulum.
