- term:
    id: GO:0036297
    label: interstrand cross-link repair
  evidence_type: IMP
  original_reference_id: PMID:24507776
  qualifier: involved_in
  review:
    summary: The recovered original leaves the particular ERCC6L2 role in interstrand-crosslink repair
      unresolved.
    action: UNDECIDED
    reason: The current term concerns removal of an interstrand crosslink and restoration of DNA. PMID:24507776
      actual siRNA/viability Methods and Results show reduced A549 survival after 48 hours of MMC exposure,
      together with damage-response and ROS-associated endpoints. This supports a genotoxic-stress role
      but does not settle whether ERCC6L2 performs work in crosslink repair itself, tolerance or repair
      of secondary DNA breaks. PMID:27185855 documents mild MMC sensitivity/chromosomal aberrations with
      non-classic Fanconi responses and a long-form phleomycin rescue; PMID:32355287 reports no cisplatin
      sensitivity in its tested mouse screen while establishing end-joining functions. Neither result
      proves universal absence of an ICL role. Retain mechanistic uncertainty despite actual original
      access, consistently with the valid PAINT ancestry; an isolated biochemical assay is not treated
      as a universal prerequisite.
    supported_by:
    - reference_id: PMID:24507776
    - reference_id: PMID:27185855
    - reference_id: PMID:32355287
    additional_reference_ids:
    - PMID:27185855
    - PMID:32355287
- term:
    id: GO:0097680
    label: double-strand break repair via classical nonhomologous end joining
  evidence_type: IDA
  original_reference_id: PMID:32355287
  qualifier: involved_in
  review:
    summary: ERCC6L2 contributes to classical nonhomologous end joining without performing ligation itself.
    action: ACCEPT
    reason: PMID:32355287 Results Figures 2–5 combine mouse B-cell Cas9-directed joining, XLF-redundant
      V(D)J repair, mutant complementation and repair-factor recruitment with human U2OS damage sensitivity/recruitment
      and HEK293T interaction evidence. In mouse cells, ERCC6L2 promotes MRI/CYREN and XRCC4–ligase-IV
      loading and proper joining; human U2OS cells also show a smaller XRCC4 recruitment effect. These
      assays support participation in the end-joining machinery, not merely a generic survival consequence,
      while species and construct boundaries remain explicit. Human 1,561-residue and mouse 1,537-residue
      constructs are separately named in Table S2. The normal signal-joint fidelity reported under different
      conditions in PMID:27185855 does not contradict a context-dependent, partly redundant NHEJ role.
      Accept this existing process assertion without assigning DNA ligase activity or blanket function
      to the 712-residue product.
    supported_by:
    - reference_id: PMID:32355287
    - reference_id: PMID:27185855
    additional_reference_ids:
    - PMID:27185855
- term:
    id: GO:0097680
    label: double-strand break repair via classical nonhomologous end joining
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00093742
  review:
    summary: Classical end joining is supported beyond the matching electronic rule.
    action: ACCEPT
    reason: The actual ARBA00093742 rule requires target FunFams 3.40.50.10810:FF:000019 and 3.40.50.300:FF:000821
      plus Eukaryota; all match Q5T890. Independent PMID:32355287 Results Figures3–7 and Methods demonstrate
      NHEJ-factor association, ligase-complex recruitment, XLF-dependent genetic redundancy and altered
      end-joining orientation, chiefly in mouse B cells/MEFs; human U2OS damage recruitment/sensitivity
      and HEK293T association are distinct experiments. These support an active end-joining role rather
      than disease association alone. PMID:41741470 additionally identifies a purified human nucleotide-dependent
      short-overhang DNA-melting activity compatible with processing staggered ends. Neither source makes
      ERCC6L2 the DNA ligase, an obligatory factor for every NHEJ substrate, or a functionally equivalent
      enzyme in all three natural products.
    supported_by:
