core_functions:
- description: ERCC6L2 unwinds short-overhang DNA duplexes in a repair-associated activity. The ATP-dependent
    component is supported by ATP versus AMP-PNP and K154A controls using purified human Q5T890-1 (1,550
    residues), rather than a separate ATP-hydrolysis measurement. Melting requires RPA or mtSSB under
    the tested conditions and includes a residual ATP-independent component. Cellular and genetic evidence
    links ERCC6L2 to classical end joining; the precise coupling of this biochemical activity to the joining
    machinery remains unresolved.
