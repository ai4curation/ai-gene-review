  review:
    summary: ERCC6L2 participates in the cellular response to nuclear DNA breaks.
    action: ACCEPT
    reason: PMID:37014751 Results Figure 5A–G, Methods for phleomycin treatment/native BrdU staining,
      and the reported laser-recruitment experiment connect ERCC6L2 to damage-site mobilization and control
      of DNA-end processing. ERCC6L2-deficient human U2OS cells accumulate more pRPA and directly detected
      single-stranded BrdU signal after breaks, without a matching increase in gamma-H2AX foci in the
      compared condition. This supports a response and processing role rather than merely susceptibility
      to damage. It does not assign nuclease chemistry, universal fork protection, or a PCNA-activation
      mechanism to ERCC6L2; the article reports no nascent-strand protection difference in its hydroxyurea
      assay. Accept the existing broad response term.
