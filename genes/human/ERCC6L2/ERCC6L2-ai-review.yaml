id: Q5T890
gene_symbol: ERCC6L2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC6L2 is an SNF2-family DNA repair factor that contributes to classical nonhomologous end
  joining and regulates DNA-break end processing. Long human products localize to the nucleus, centromeres
  and induced damage sites. PCNA binding involves an atypical PIP motif around residues 790–811 in the
  tested 1,561-residue construct. ERCC6L2 limits excess resection after DNA damage in several human-cell
  assays; under prolonged ATM inhibition, its C-terminal condensate-associated stabilization of CtIP instead
  supports resection. These regulatory effects have not been mechanistically equated with its purified
  motor activity. Purified human Q5T890-1, the 1,550-residue product, displays ATP-stimulated short-overhang
  duplex melting with a single-stranded DNA-binding protein, with residual ATP-independent melting and
  unresolved coupling to end joining. The historical 712-residue construct has distinct localization and
  fails to replace the long product in the tested damage-rescue assay. Earlier A549 experiments also show
  conditional mitochondrial trafficking and a ROS-associated response, without independently resolving
  all endogenous products.
