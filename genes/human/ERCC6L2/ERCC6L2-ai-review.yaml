id: Q5T890
gene_symbol: ERCC6L2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC6L2 is an SNF2-family DNA repair factor that contributes to classical nonhomologous end
  joining and genome stability. The 1,561-residue human product localizes to the nucleus, centromeres
  and induced DNA-damage sites, associates with end-joining factors, and binds PCNA through a C-terminal
  interaction motif. Purified human Q5T890-1, the 1,550-residue product, displays ATP-stimulated melting
  of short-overhang DNA duplexes in the presence of a single-stranded DNA-binding protein. This activity
  separates short-overhang duplex ends in vitro, although its precise coupling to the end-joining machinery
  remains unresolved. The 712-residue product has a distinct localization pattern and does not replace
  the long product in the tested DNA-damage rescue assay.
