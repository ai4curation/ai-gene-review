          limits.
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IDA
  original_reference_id: PMID:41741470
  isoform: Q5T890-1
  review:
    summary: Purified human Q5T890-1 has an ATP-dependent component of short-overhang duplex-unwinding
      activity.
    action: NEW
    reason: PMID:41741470 Figure 5 and protein-purification/helicase Methods directly measure strand separation
      by the purified human 1,550-residue sequence independently verified as Q5T890-1. ATP enhances unwinding
      relative to AMP-PNP/no ATP, and K154A loses that enhancement while retaining DNA binding. These
      controls support an ATP-hydrolysis-coupled component by inference, not a separately quantified ATP-hydrolysis
      assay. Residual ATP-independent melting and the requirement for RPA or mtSSB under the tested conditions
      remain explicit. This proposed MF records experimentally established activity absent from the imported
      annotation set; it is not added to remove a validation warning. No directional motor, general translocase,
      exonuclease activity or extension to the 1,561-/712-residue products is inferred. The dsDNA-dependent
      ATPase specificity of GO:0036121 is not independently resolved by these short-overhang unwinding
      experiments.
    supported_by:
    - reference_id: PMID:41741470
