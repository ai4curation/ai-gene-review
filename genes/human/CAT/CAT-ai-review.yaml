  review:
    summary: Catalase has no aminoacylase activity.
    action: REMOVE
    reason: The Ensembl Compara donor is mouse Cat, but catalase is a heme peroxidase-family
      oxidoreductase that decomposes hydrogen peroxide; there is no biochemical evidence that
      mammalian catalase hydrolyzes N-acyl-amino-acid amides.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: UniProtKB:P24270
        source_label: mouse Cat aminoacylase donor
        source_status: SOURCE_BAD
        comment: This molecular function is incompatible with the catalase reaction and appears to
          be a donor-side misannotation, not a human paralog difference.
