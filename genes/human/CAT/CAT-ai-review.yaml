id: P04040
gene_symbol: CAT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CAT encodes the human monofunctional heme catalase, a homotetrameric NADPH-binding enzyme
  that is imported to the peroxisomal matrix through its noncanonical C-terminal PTS1 and disproportionates
  hydrogen peroxide to water and oxygen. This activity removes peroxisomal and other cellular hydrogen
  peroxide, with secondary antioxidant roles in keratinocyte UV stress, neutrophil granules, and extracellular
  vesicles.'
