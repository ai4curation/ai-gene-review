suggested_questions:
- question: Do FOXO-activated CAT gene-expression Reactome events need to emit any protein
    localization row, given that they regulate CAT transcription rather than catalase protein
    transport?
- question: Should UniProt/GOA repoint or remove the PMID:10514471 antioxidant-activity row from
    CAT, since the abstract supports HsPMP20 rather than catalase?
suggested_experiments:
- description: Use endogenous tagging and organelle markers in primary human neutrophils to
    distinguish catalase in peroxisomes from catalase in secretory or ficolin-rich granule lumen
    pools before and after degranulation.
