core_functions:
- description: PLK3 is an active polo-like protein serine/threonine kinase that phosphorylates TP53-family, 
    CHEK2, CDC25A/CDC25C, ATF2, HIF1A and BCL2L1 substrates to couple genotoxic, oxidative, osmotic and 
    hypoxic stresses to cell-cycle checkpoint and cell-fate responses.
