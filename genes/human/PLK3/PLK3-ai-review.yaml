id: Q9H4B4
gene_symbol: PLK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PLK3 encodes an active polo-like serine/threonine kinase with an N-terminal kinase domain and C-terminal
  polo-box domain. PLK3 phosphorylates cell-cycle and stress-response substrates including CDC25A, CDC25C, CHEK2,
  TP53, TP73, HIF1A, ATF2, BCL2L1 and VRK1, and acts from cytoplasmic, nuclear, nucleolar, Golgi and centrosomal
  locations to regulate stress checkpoints, G1/S entry, cytokinesis and Golgi disassembly.'
existing_annotations:
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028571
  review:
    summary: Accept PLK3 regulation of G1/S entry.
    action: ACCEPT
    reason: PLK3 is an active G1 polo-like kinase required for cyclin E expression and entry into S phase; the
      ARBA projection is broad but its G1/S claim matches direct human PLK3 depletion evidence.
    supported_by:
    - reference_id: PMID:17264206
      supporting_text: Plk3 is required for cyclin E expression and entry into S phase.
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:17264206
  qualifier: involved_in
  review:
    summary: Accept the direct PLK3 G1/S-entry row.
    action: ACCEPT
    reason: The cited RNAi study directly places human PLK3 in G1/S entry by showing that PLK3 is G1-regulated
      and required for cyclin E expression and S-phase entry after serum stimulation.
    supported_by:
    - reference_id: PMID:17264206
      supporting_text: Plk3 is required for cyclin E expression and entry into S phase.
- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: TAS
  original_reference_id: PMID:16481012
  qualifier: involved_in
  review:
    summary: Mark G2/M transition as over-annotated for the CHEK2 checkpoint paper.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:16481012 supports PLK3 phosphorylation of CHEK2 in a DNA-damage checkpoint linking ATM, 
      CHEK2, CDC25C and CDC2; that is a G2/M checkpoint response rather than a normal positive role in the 
      G2/M transition itself.
    supported_by:
    - reference_id: PMID:16481012
      supporting_text: These data describe a functional role for Plk3 in a pathway linking ATM, Plk3, Chk2, 
        Cdc25C and Cdc2 in cellular response to DNA damage.
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:19490146
  qualifier: involved_in
  review:
    summary: Keep PLK3 inhibition of p73-mediated transcription as a secondary stress response.
    action: KEEP_AS_NON_CORE
    reason: PLK3 binds and phosphorylates TP73/p73 and thereby inhibits p73-mediated transcriptional 
      activation and pro-apoptotic output after cisplatin; this is a real stress-response branch, not the 
      central PLK3 kinase role.
    supported_by:
    - reference_id: PMID:19490146
      supporting_text: Luciferase reporter assays and RT-PCR experiments revealed that Plk3 inhibits 
        p73-mediated transcriptional activity.
- term:
    id: GO:0000302
    label: response to reactive oxygen species
  evidence_type: IDA
  original_reference_id: PMID:11447225
  qualifier: involved_in
  review:
    summary: Accept PLK3 response to oxidative stress.
    action: ACCEPT
    reason: Oxidative stress activates PLK3, and PLK3 phosphorylates p53/TP53 on Ser20 after H2O2 treatment as
      part of the oxidative-stress response.
    supported_by:
    - reference_id: PMID:11447225
      supporting_text: Polo-like kinase-3 (Plk3) activity was also activated upon H(2)O(2) treatment, and this
        activation was ATM-dependent.
