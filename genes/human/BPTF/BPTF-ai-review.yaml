    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached Abstract section and metadata; no complete-paper, figure-image or supplement
      audit. Opening full text and bounded Results were read; ChIP Methods were also read for 27141965.
      The abstract and bounded Results directly distinguish BPTF PHD recognition of methylated H3K4 from
      bromodomain binding to acetylated H4. Several H4 acetylated peptides bind, whereas the tested mononucleosomal
