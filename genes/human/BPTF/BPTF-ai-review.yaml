id: Q12830
gene_symbol: BPTF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BPTF is a large regulatory subunit of nuclear NURF chromatin-remodeling complexes. Its C-terminal
  PHD–bromodomain module recognizes combinations of histone methylation and acetylation, helping recruit
  and stabilize NURF on chromatin. The associated ISWI ATPase drives nucleosome remodeling, while BPTF
  supplies chromatin recognition and regulatory interactions. These activities regulate transcription
  at developmental and differentiation-associated loci. Histone-mark recognition varies with nucleosome
  context and the combination of modifications. Historical FAC1 constructs also display sequence-specific
  DNA binding, transcriptional repression and regulated nuclear/cytoplasmic localization. Alternative
  splicing alters internal regions of BPTF.
