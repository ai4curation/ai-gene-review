id: Q12830
gene_symbol: BPTF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BPTF is a large chromatin-recognition subunit of nuclear NURF complexes. Its C-terminal PHD
  finger recognizes H3K4me3, and the adjacent bromodomain recognizes acetylated H4, including H4K16ac
  in a coupled nucleosome-recognition mechanism. These contacts help recruit or stabilize NURF at regulatory
  chromatin. NURF can contain either SMARCA1/SNF2L or SMARCA5/SNF2H as its ATP-hydrolyzing motor; complex
  activity depends on the motor and its splice form. BPTF supplies histone recognition and regulatory
  interactions that support transcription at developmental and differentiation-associated loci. Historical
  FAC1 constructs also display sequence-specific DNA binding, transcriptional repression and regulated
  nuclear/cytoplasmic localization. Alternative splicing alters internal regions of BPTF.
