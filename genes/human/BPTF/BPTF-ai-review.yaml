core_functions:
- description: Reads modified histones through the coupled PHD–bromodomain module to recruit or stabilize
    NURF on chromatin, thereby contributing to ATP-dependent nucleosome remodeling and transcriptional
    regulation. The ISWI motor supplies ATP hydrolysis; BPTF supplies histone recognition and regulatory
    interactions.
