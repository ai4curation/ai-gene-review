suggested_questions:
- question: How do the historical FAC1 constructs and antibody epitopes map to the current BPTF products
    1, 2 and 4, and which reported activities extend to each complete product?
- question: What target-specific assays or screen rows establish the BPTF interactions assigned to the
    CERF comparison, epidermal differentiation study and OpenCell?
- question: Which BPTF-specific developmental perturbations support the two brain-development annotations,
    independently of the SNF2L neurite-outgrowth manipulation?
- question: Can the original rat donor experiments resolve dendritic localization and the cellular response
    to nerve growth factor, and can the BPTF exosome peptide record be recovered?
- question: How do histone-tail accessibility, combined modifications and the composition of intact NURF
    complexes shape the substrate preferences measured with isolated BPTF reader modules?
