  review:
    action: MODIFY
    summary: BPTF reads modified histones through its coupled PHD–bromodomain module.
    reason: 'PMID:21596426 directly measures BPTF bromodomain binding to acetylated H4 peptides and reconstituted
      nucleosomes, and examines the tandem PHD–bromodomain with methylated H3K4. Peptide recognition is
      broader than the tested nucleosome preference: H4K12ac, H4K16ac and H4K20ac bind as peptides, whereas
      the tested mononucleosomal enhancement favors H3K4me3 with H4K16ac. Full-length BPTF mutant ChIP
      at HOXA9 links the coupled recognition module to chromatin recruitment/stabilization. Together with
      the established NURF-subunit role, this supports GO:0140566 histone reader activity, whose definition
      includes chromatin-protein adaptor function, rather than generic protein binding. Preserve the original
      H4 accession P62805; no unique histone gene, universal mark exclusivity, new BPTF isoform mapping
      or histone-modifying catalysis is inferred.'
    proposed_replacement_terms:
    - id: GO:0140566
      label: histone reader activity
    supported_by:
    - reference_id: PMID:21596426
