core_functions:
- description: The bromodomain-proximal PHD finger recognizes H3K4me3 and helps recruit or stabilize NURF
    on chromatin. This is the H3-recognition arm of a coupled PHD–bromodomain mechanism. BPTF contributes
    targeting and regulation to NURF remodeling; the associated ISWI motor supplies ATP hydrolysis.
  molecular_function:
    id: GO:0140002
    label: histone H3K4me3 reader activity
  contributes_to_molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0016589
    label: NURF complex
  supported_by:
  - reference_id: PMID:21596426
  - reference_id: file:human/BPTF/BPTF-uniprot.txt
  - reference_id: PMID:16728976
    supporting_text: |-
      chromatin-remodelling complex, mediates a direct preferential association with
      H3K4me3 tails.
  - reference_id: PMID:16728978
    supporting_text: |-
      BPTF PHD finger exhibits a
      modest preference for K4me3- over K4me2-containing H3 peptides
  - reference_id: PMID:18042461
- description: The adjacent bromodomain recognizes H4K16ac as the acetyl-histone arm of the same coupled
    NURF-recruitment mechanism. In the tested mononucleosomes, H4K16ac enhances engagement alongside PHD
    recognition of H3K4me3, and intact reader pockets support full-length BPTF recruitment at HOXA9. Peptide
    binding to other acetyl-H4 sites limits claims of universal H4K16ac exclusivity.
  molecular_function:
    id: GO:0140046
    label: histone H4K16ac reader activity
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0016589
    label: NURF complex
  supported_by:
  - reference_id: PMID:21596426
