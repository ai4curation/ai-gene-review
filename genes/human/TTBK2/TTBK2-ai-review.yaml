  - UniProtKB:O00139
  review:
    summary: >-
      IGI with KIF2A: TTBK2 antagonizes KIF2A-dependent microtubule depolymerization.
    action: KEEP_AS_NON_CORE
    reason: >-
      TTBK2 acts as an EB1/3-dependent microtubule plus-end tracking kinase that phosphorylates and inhibits
      KIF2A in migrating HeLa cells. This is supported experimentally but represents a secondary, non-ciliary
      function relative to its essential role in initiating ciliogenesis, so it is retained as non-core.
    supported_by:
    - &id006
      reference_id: PMID:26323690
      supporting_text: TTBK2 depletion reduced MT lifetime (facilitated shrinkage and suppressed rescue)
        and impaired HeLa cell migration, and these phenotypes were partially restored by KIF2A co-depletion.
    - &id014
      reference_id: PMID:26323690
      supporting_text: These findings indicate that TTBK2 with EB1/3 phosphorylates KIF2A and antagonizes
        KIF2A-induced depolymerization at MT plus ends for cell migration.
