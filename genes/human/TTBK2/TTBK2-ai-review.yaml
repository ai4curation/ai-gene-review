core_functions:
- description: "Protein serine/threonine kinase recruited by CEP164 to the distal appendages of the mother\
    \ centriole,\n   where it phosphorylates ciliogenesis substrates (CEP83, MPHOSPH9, CEP164) to trigger\
    \ removal of the CP110-CEP97 cap,\n   ciliary vesicle docking and IFT recruitment, thereby initiating\
    \ primary cilium assembly."
  molecular_function:
