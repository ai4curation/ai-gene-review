      direct TTBK2 substrate.
suggested_questions:
- question: Which TTBK2 phosphorylation events (on CEP83, MPHOSPH9, CEP164, CEP97 or others) are individually
    necessary and sufficient for CP110-CEP97 cap removal?
- question: Does TTBK2 phosphorylate tau or other neuronal substrates physiologically, and does this contribute
    to SCA11 independently of cilia?
suggested_experiments:
- description: Use analog-sensitive TTBK2 knock-in cells with thiophosphate labelling to map direct substrates
    at the mother centriole during serum starvation, then test phospho-null substrate mutants for CP110
    removal and ciliogenesis.
