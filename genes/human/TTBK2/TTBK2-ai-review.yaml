id: Q6IQ55
gene_symbol: TTBK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TTBK2 (tau tubulin kinase 2) is a casein kinase 1-family serine/threonine kinase with an N-terminal
  catalytic domain and a long C-terminal region that targets it to the mother centriole and to microtubule
  plus ends. It prefers substrates primed by a phosphotyrosine at the +2 position. At the onset of ciliogenesis,
  the distal appendage protein CEP164 binds TTBK2 and recruits it to the mother centriole, where TTBK2
  phosphorylates distal appendage and cap regulators, including CEP83 and MPHOSPH9; MPHOSPH9 phosphorylation
  leads to its degradation and to removal of the ciliogenesis-suppressing CP110-CEP97 cap, after which
  IFT machinery is recruited and the axoneme grows. TTBK2 is essential for primary cilium formation in
  vivo and also supports cilium stability and ciliary trafficking after initiation. Through EB1/EB3 binding
  it also tracks microtubule plus ends and phosphorylates and inhibits KIF2A, stabilizing microtubules
  in migrating cells. Dominant truncating TTBK2 variants that inhibit its kinase activity cause spinocerebellar
  ataxia type 11.
