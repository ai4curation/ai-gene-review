  review:
    summary: CDC14A regulates cilium growth through protein dephosphorylation.
    action: MODIFY
    reason: 'Human RPE1 experiments connect direct DBN1 dephosphorylation to control of ciliary
      growth. A regulation-of-assembly term captures this mechanism better than an undifferentiated
      assembly claim. GO:1902018 negative regulation of cilium assembly describes the tested RPE1
      direction: loss of phosphatase activity lengthens cilia and overexpression reduces ciliation.
      It is not selected as the general replacement because zebrafish morpholino depletion instead
      shortens kinocilia, whereas germline mouse and zebrafish mutants can have normal kinocilium
      lengths. The parent GO:1902017 preserves regulatory participation without generalizing one
      direction across those cell and perturbation contexts. The original PAINT node is preserved.'
    supported_by:
