id: Q9UNH5
gene_symbol: CDC14A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDC14A is a cysteine-dependent protein phosphatase with a strong preference for proline-directed
  phosphoserine substrates. Centrosomal and cytoplasmic CDC14A dephosphorylates drebrin and regulates
  actin-dependent primary cilium growth, while other protein substrates connect it to cell-cycle
  regulation. Its intracellular distribution varies with cell state and protein form and includes
  centrosomal, cytoplasmic and nuclear pools; in vertebrate sensory hair cells it also occupies
  kinocilia and stereocilia. Biallelic pathogenic variants cause hearing loss, sometimes accompanied
  by male infertility. Catalytic competence and intracellular targeting can be separable, with the
  C-terminal region contributing to functions required for hearing.
