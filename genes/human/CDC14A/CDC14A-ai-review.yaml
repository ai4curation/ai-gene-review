core_functions:
- description: Dephosphorylates protein substrates with a strong preference for proline-directed
    phosphoserine sites. Centrosomal and cytoplasmic pools regulate cilium growth through protein
    dephosphorylation, including drebrin and centrosomal actin regulation. Cell-cycle substrate
    regulation is context dependent and does not require an indispensable yeast-like mitotic-exit
    role.
  molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  directly_involved_in:
  - id: GO:1902017
    label: regulation of cilium assembly
  locations:
