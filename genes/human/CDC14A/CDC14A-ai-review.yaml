  review:
    summary: Physiological nucleolar activity of wild-type CDC14A is unresolved.
    action: UNDECIDED
    reason: The qualifier is is_active_in, which requires activity in the nucleolus rather than
      possible nuclear access. Selected human experiments distinguish centrosomal CDC14A from nucleolar
      CDC14B; nucleolar accumulation of an export-defective CDC14A mutant does not establish wild-type
      activity there. These target observations weigh against a constitutive wild-type nucleolar
      role, but do not exclude every cell-state-specific nucleolar function. UNDECIDED therefore
      records unresolved biology, not a rule that biological evidence cannot challenge an IBA without
      a tree reconstruction. The complete PAINT node reconstruction was not inspected, and no erroneous-node
      or paralog-misattribution claim is made.
    supported_by:
    - reference_id: PMID:12134069
    - reference_id: PMID:11901424
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
