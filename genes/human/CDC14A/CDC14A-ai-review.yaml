    summary: Exact human protein-phosphotyrosine catalysis remains unresolved.
    action: UNDECIDED
    reason: The original recombinant-enzyme abstract describes dual-specificity kinetics, but its
      precise human protein-phosphotyrosine substrate assays were not accessible. Later human catalytic-domain
