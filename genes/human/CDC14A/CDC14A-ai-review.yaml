  - reference_id: PMID:33328327
suggested_questions:
- question: Which endogenous hair-cell phosphoprotein substrates link CDC14A catalysis and C-terminal
    targeting to hearing, and do the five human products differ in those interactions?
- question: Can a direct human protein-phosphotyrosine substrate assay and physiological substrate
    establish the breadth of CDC14A tyrosine catalysis?
- question: Which cell states reconcile reported human RNAi cytokinesis defects with apparently
    normal cytokinesis after CDC14A/CDC14B deletion, and is wild-type nucleolar activity demonstrable?
suggested_experiments:
- description: In human inner-ear organoid hair cells, compare matched-expression full-length,
    catalytically inactive and C-terminally truncated CDC14A with acute loss/rescue; measure
    localization and substrate phosphorylation before attributing hearing-related effects to
    cilium length alone.
- description: Compare acute depletion and verified knockout in the same human cell background,
    with endogenous rescue, live cytokinesis timing and phosphoprotein measurements; use matched
    serine-, threonine- and tyrosine-phosphorylated substrates to separate catalytic specificity
    from cell-state effects.
