  review:
    summary: Retain the ancestral microtubule-organization inference as non-core.
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT ancestral assertion is retained, with human centrosomal and spindle localization
      and deregulation phenotypes compatible with a regulatory role. The inspected microtubule-regrowth
      assay in PMID:12134069, however, used transient GFP-hCDC14A expression: high expression abolished
      centrosomal nucleation, while low expression did not. This does not establish microtubule
      organization as a principal normal human function. The drebrin/Arp2 mechanism in PMID:30467237
      concerns actin and cilium regulation, not a demonstrated microtubule-organization step. Reported
      COS-7 colocalization in PMID:29293958 used transfected GFP-tagged mouse Cdc14a and does not
      supply an endogenous human organization assay. Normal mitotic timing in RPE1 CDC14A/CDC14B
      knockouts limits an indispensable-role claim without disproving every regulatory contribution.
      Preserve the original PAINT node and term but remove this process from the core synthesis.'
    supported_by:
    - reference_id: PMID:11901424
    - reference_id: PMID:12134069
    - reference_id: PMID:15263015
    - reference_id: PMID:30467237
