description: DNAJC28 (C21orf55/C21orf78) is a poorly characterized member of the DnaJ/HSP40
  (J-domain) co-chaperone family encoded on chromosome 21. It contains a canonical
  J domain together with a predicted coiled-coil region, and its N-terminus resembles
  a mitochondrial-targeting presequence, suggesting it may act as a mitochondrial
  J-domain co-chaperone. By analogy to other J-domain proteins it is presumed to assist
  HSP70-type chaperones in protein folding, but no substrate, partner chaperone, or
  cellular process has been experimentally established. It is expressed in brain, testis,
  uterus, spleen and liver (tissue-enhanced in testis) and is phosphorylated at Thr-347.
existing_annotations:
- term:
    id: GO:0001659
    label: temperature homeostasis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      PAINT places temperature homeostasis at PANTHER:PTN001166000, a 12-leaf mammalian
      DNAJC28 node, on a single seed, rhesus macaque DNAJC28 (UniProtKB:F7DMN9). The seed
      row is an IMP citing PMID:39911280, a comparative genomics paper that contains no
      mutant and no temperature measurement for DNAJC28.
    action: REMOVE
    reason: >-
      Human DNAJC28 sits inside the seeded clade (child node PTN001166001, 11 therian
      leaves, which also holds the macaque seed), so the placement is not the problem.
      The seed is. PMID:39911280 compares the genomes and transcriptomes of cynomolgus and
      rhesus macaques. For DNAJC28 it reports a positive selection call (its Table 1 lists
      Ks, Ka/Ks and divergence time for DNAJC28 as NA) and a higher blood mRNA level in
      Chinese rhesus than in cynomolgus macaques by qRT-PCR. No DNAJC28 allele was tested
      for a phenotype, no gene was perturbed and no body temperature was measured, so an
      IMP for temperature homeostasis has nothing under it; the link to thermoregulation is
      the authors' interpretation of a selection scan. With its only seed unsupported the
      IBD asserts a process that has not been shown for any member of the clade, and
      nothing on the human protein, which has no characterized process at all, supplies
      independent support. The row is removed on bad-seed grounds, and the fix belongs at
      the seed row and at the PAINT node.
