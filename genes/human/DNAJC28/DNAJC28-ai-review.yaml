      confidence: CONFIRMED
      explanation: >-
        The row annotates rhesus macaque DNAJC28 (UniProtKB:F7DMN9) to GO:0001659
        temperature homeostasis by IMP from PMID:39911280. The full text (PMC11793050) was
        read. The paper is a comparative genomics study of cynomolgus and rhesus macaques.
        Its evidence on DNAJC28 is a positive selection call, with Ks, Ka/Ks and divergence
