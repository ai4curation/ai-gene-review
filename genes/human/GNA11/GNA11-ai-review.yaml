id: P29992
gene_symbol: GNA11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNA11 encodes G alpha 11, a Gq-family heterotrimeric G protein alpha subunit. Receptor-stimulated
  GDP/GTP exchange activates PLC beta signaling, linking extracellular stimuli to inositol trisphosphate,
  diacylglycerol and calcium-dependent responses. G11 acts on the cytoplasmic plasma-membrane surface
  and shares some physiological roles with Gq, including endocrine, vascular and developmental signaling.
  Receptor specificity, cellular expression and compensatory overlap determine which paralog contributes
  in each tissue.
