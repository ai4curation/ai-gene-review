  review:
    summary: GNA11 is a guanine-nucleotide-binding G alpha subunit that switches between GDP- and GTP-bound
      states and hydrolyzes bound GTP.
    action: ACCEPT
    reason: GNA11 is a guanine-nucleotide-binding G alpha subunit that switches between GDP- and GTP-bound
      states and hydrolyzes bound GTP. Receptor/effector biochemistry and nucleotide-state experiments
      support the intrinsic molecular switch. This is distinct from the GAP activity of RGS proteins;
      activated or nucleotide-defective mutants are controls, not substitutes for the wild-type function.
    additional_reference_ids:
    - PMID:31073061
    - PMID:15331768
    supported_by:
    - reference_id: PMID:31073061
    - reference_id: PMID:15331768
