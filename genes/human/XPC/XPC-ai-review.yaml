id: Q01831
gene_symbol: XPC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'XPC is the large DNA-damage-recognition subunit of the XPC-RAD23-CETN2 complex, a nuclear and chromatin-associated
  sensor that initiates global-genome nucleotide-excision repair by binding helix-distorting, unpaired-base DNA structures
  and recruiting TFIIH for lesion verification. Beyond repair, the same trimeric complex can act at selected promoters as
  a transcriptional coactivator that recruits KAT2A/ATAC and promotes H2A.Z.1 acetylation.'
alternative_products:
- name: '1'
  id: Q01831-1
- name: '2'
  id: Q01831-2
  sequence_note: VSP_046344
- name: 3 (B)
  id: Q01831-3
  sequence_note: VSP_055890, VSP_055891
existing_annotations:
- term:
    id: GO:0000109
    label: nucleotide-excision repair complex
  evidence_type: IDA
  original_reference_id: PMID:11259578
  qualifier: part_of
  review:
    summary: The XPC complex is the relevant NER complex.
    action: TOO_GENERAL
    reason: PMID:11259578 supports a functional interaction between XPC-HR23B and TFIIH during early NER, but GO:0000109
      is less precise than the accepted XPC complex annotations in this review.
    supported_by:
    - reference_id: PMID:11259578
      supporting_text: At physiological ionic strength, TFIIH associated with significant amounts of XPC-HR23B and XPG
        but not other repair factors. The strongest interaction was between TFIIH and XPC-HR23B, indicating a coupled
        role of these proteins in early steps of repair.
- term:
    id: GO:0000404
    label: heteroduplex DNA loop binding
  evidence_type: TAS
  original_reference_id: PMID:19941824
  qualifier: enables
  review:
    summary: Keep heteroduplex DNA loop binding as part of XPC damage sensing.
    action: ACCEPT
    reason: This TAS row is consistent with the XPC complex recognizing unpaired bases and looped or bubble-like DNA
      structures during the first stage of mammalian NER damage recognition.
    supported_by:
    - reference_id: PMID:19941824
      supporting_text: For mammalian nucleotide excision repair (NER), DNA lesions are recognized in at least two steps
        involving detection of unpaired bases by the XPC protein complex and the subsequent verification of injured
        bases.
- term:
    id: GO:0000405
    label: bubble DNA binding
  evidence_type: TAS
  original_reference_id: PMID:19941824
  qualifier: enables
  review:
    summary: Keep bubble DNA binding as part of XPC damage sensing.
    action: ACCEPT
    reason: This TAS row is consistent with the XPC complex binding distorted single-/double-strand junction structures,
      which is the biochemical basis for its broad NER lesion recognition.
    supported_by:
    - reference_id: PMID:12509299
      supporting_text: Although XPC-HR23B showed significantly higher affinity for single-stranded DNA than
        double-stranded DNA, specific secondary structures of DNA, involving a single- and double-strand junction, were
        strongly preferred by the complex.
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: ISS
  original_reference_id: PMID:33937266
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P51612
  review:
    summary: Keep chromatin as a core XPC repair site.
    action: ACCEPT
    reason: Mouse Xpc and human XPC both act on genomic chromatin; direct GFP-XPC photobleaching showed repeated
      chromatin association and dissociation in mammalian nuclei.
    supported_by:
    - reference_id: PMID:18682493
      supporting_text: Photobleaching experiments showed that XPC constantly associates with and dissociates from
        chromatin in the absence of DNA damage.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018326
  - InterPro:IPR018327
  - InterPro:IPR018328
  review:
    summary: Mark generic DNA binding as too general.
    action: TOO_GENERAL
    reason: The InterPro beta-hairpin mapping captures a real DNA-binding fold, but XPC is more specifically a
      distorted-/damaged-DNA sensor with accepted damaged DNA, heteroduplex, bubble, and DNA damage sensor annotations.
    supported_by:
    - reference_id: PMID:12509299
      supporting_text: Although XPC-HR23B showed significantly higher affinity for single-stranded DNA than
        double-stranded DNA, specific secondary structures of DNA, involving a single- and double-strand junction, were
        strongly preferred by the complex.
- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: IDA
  original_reference_id: PMID:12509299
  qualifier: enables
  review:
    summary: Keep damaged DNA binding.
    action: ACCEPT
    reason: Purified XPC-HR23B discriminates UV-damaged DNA from undamaged DNA, supporting the direct damaged-DNA
      binding activity that underlies GG-NER initiation.
    supported_by:
    - reference_id: PMID:10873465
      supporting_text: Electrophoretic mobility-shift competition measurements revealed a 400-fold preference for
        binding of XPC-hHR23B to UV damaged over non-damaged DNA.
- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00089041
  - UniProtKB:P51612
  - ensembl:ENSMUSP00000032182
  - InterPro:IPR004583
  review:
    summary: Keep damaged DNA binding from the XPC/Rad4 family mapping.
    action: ACCEPT
    reason: The XPC/Rad4 family assignment is consistent with the experimentally established role of XPC-HR23B as the
      earliest NER damage detector.
    supported_by:
    - reference_id: PMID:9734359
      supporting_text: 'Using a novel DNA damage recognition-competition assay, we identified XPC-HR23B as the earliest damage
        detector to initiate NER: it acts before the known damage-binding protein XPA.'
- term:
    id: GO:0003697
    label: single-stranded DNA binding
  evidence_type: IDA
  original_reference_id: PMID:12509299
  qualifier: enables
  review:
    summary: Keep single-stranded DNA binding as a non-core biochemical activity.
    action: KEEP_AS_NON_CORE
    reason: Purified XPC-HR23B binds ssDNA, although its evolved activity is recognition of distorted duplex and
      junction structures rather than ssDNA alone.
    supported_by:
    - reference_id: PMID:12509299
      supporting_text: Although XPC-HR23B showed significantly higher affinity for single-stranded DNA than
        double-stranded DNA, specific secondary structures of DNA, involving a single- and double-strand junction, were
        strongly preferred by the complex.
- term:
    id: GO:0003697
    label: single-stranded DNA binding
  evidence_type: TAS
  original_reference_id: PMID:8168482
  qualifier: enables
  review:
    summary: Keep single-stranded DNA binding as a non-core biochemical activity.
    action: KEEP_AS_NON_CORE
    reason: The purified XP-C repair complex had high affinity for ssDNA; this supports the binding observation but is
      less specific than the complex's distorted-duplex damage sensor activity.
    supported_by:
    - reference_id: PMID:8168482
      supporting_text: The complex has a high affinity for ssDNA and consists of two tightly associated proteins of 125
        and 58 kDa.
- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:29973595
  qualifier: enables
  review:
    summary: Keep XPC transcription coactivator activity as non-core.
    action: KEEP_AS_NON_CORE
    reason: Human XPC directly supports Pol II transcription by recruiting KAT2A/ATAC to E2F1-bound promoters, a
      reproducible secondary activity of the XPC-RAD23-CETN2 complex.
    supported_by:
    - reference_id: PMID:29973595
      supporting_text: XPC interacts with the histone acetyltransferase KAT2A and specifically triggers the recruitment
        of the KAT2A-containing ATAC complex to the promoters of down-expressed genes.
- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:31527837
  qualifier: enables
  review:
    summary: Keep XPC transcription coactivator activity as non-core.
    action: KEEP_AS_NON_CORE
    reason: The XPC-RAD23-CEN2 complex licenses KAT2A-dependent H2A.Z.1 acetylation at transactivated promoters,
      supporting a secondary transcription coactivator function.
    supported_by:
    - reference_id: PMID:31527837
      supporting_text: Expression of these genes also depends on the DNA repair complex XPC-RAD23-CEN2. We established
        that XPC-RAD23-CEN2 interacts both with H2A.Z and KAT2A to drive the recruitment of the HAT at promoters and
        license H2A.Z acetylation.
