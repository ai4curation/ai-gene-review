core_functions:
- description: distorted-DNA sensing by the XPC-RAD23-CETN2 complex to initiate global-genome nucleotide-excision repair
  molecular_function:
    id: GO:0140612
    label: DNA damage sensor activity
  directly_involved_in:
  - id: GO:0006289
    label: nucleotide-excision repair
  locations:
  - id: GO:0005654
    label: nucleoplasm
  - id: GO:0000785
    label: chromatin
  - id: GO:0090734
    label: site of DNA damage
  in_complex:
    id: GO:0071942
    label: XPC complex
  supported_by:
  - reference_id: PMID:9734359
    supporting_text: 'Using a novel DNA damage recognition-competition assay, we identified XPC-HR23B as the earliest damage
      detector to initiate NER: it acts before the known damage-binding protein XPA.'
  - reference_id: PMID:19941824
    supporting_text: For mammalian nucleotide excision repair (NER), DNA lesions are recognized in at least two steps
      involving detection of unpaired bases by the XPC protein complex and the subsequent verification of injured bases.
  - reference_id: PMID:11279143
    supporting_text: We demonstrate that nearly all XPC complexes contain CEN2, that CEN2 interacts directly with XPC,
      and that CEN2, in cooperation with HR23B, stabilizes XPC, which stimulates XPC NER activity in vitro.
suggested_questions:
- question: Which XPC-RAD23-CETN2 promoter targets and transcription factors require XPC directly in endogenous human
    stem or somatic cells, as opposed to reflecting context-specific Oct4/Sox2 or E2F1 coactivator branches?
suggested_experiments:
- description: Separate XPC damage-sensing mutants from RAD23B/CETN2 assembly mutants in rescue cells and compare
    UV-damage recruitment, TFIIH recruitment, and KAT2A/ATAC promoter recruitment to define which surfaces support NER
    versus transcriptional coactivation.
