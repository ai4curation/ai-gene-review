id: O75496
gene_symbol: GMNN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Geminin restricts DNA replication licensing by binding CDT1 and preventing productive MCM
  engagement. It also regulates transcription through AP4-associated repression and selected Hox proteins.
  APC/C-dependent degradation during mitosis limits its abundance. Stabilizing GMNN variants can cause
  autosomal-dominant Meier-Gorlin syndrome, linking replication control to human growth.
product_type: PROTEIN
alternative_products: []
