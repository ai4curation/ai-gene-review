description: Geminin restricts DNA replication licensing by binding and inhibiting CDT1. It also regulates
  transcription through promoter-associated repressor complexes and inhibition of selected Hox proteins.
  Its abundance and subcellular distribution vary with cell-cycle and binding-partner context.
