    summary: Acrosomal vesicle, from the UniProt subcellular-location mapping, which itself is by similarity
      to the hamster sperm protein P26h. Human DCXR is identical (bar one residue) to the epididymal sperm-surface
      protein P34H, which is acquired by sperm in the corpus epididymidis.
