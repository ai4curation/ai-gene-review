core_functions:
- description: 'NADPH-dependent L-xylulose reductase: reduces L-xylulose to xylitol in the glucuronate-xylulose
    (pentose) pathway, the step lost in pentosuria. Directly measured for the human enzyme and placed
    by PAINT at PTN001211870, which covers vertebrate and nematode DCXR orthologs.'
  molecular_function:
    id: GO:0050038
    label: L-xylulose reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0005997
    label: xylulose metabolic process
  - id: GO:0042840
    label: D-glucuronate catabolic process
  supported_by:
  - &id013
    reference_id: PMID:11882650
    supporting_text: The purified recombinant proteins of the five species were about 100-kDa homotetramers
      with NADPH-linked reductase activity for alpha-dicarbonyl compounds, catalyzed the oxidoreduction
      between xylitol and l-xylulose
  - reference_id: PMID:22042873
    supporting_text: L-xylulose reductase was not detectable in protein lysates from subjects' cells and
      high levels of xylulose were detected in their sera
  - reference_id: PMID:40737316
    supporting_text: The product of the BKGD reaction is substrate of L-xylulose reductase (DCXR).
- description: 'NADPH-dependent alpha-dicarbonyl (diacetyl) reductase: reduces diacetyl, 2,3-pentanedione,
    isatin and related alpha-dicarbonyls to alpha-hydroxyketones, with micromolar KM values lower than
    those for sugars. Measured for the human enzyme and also placed at PTN001211870.'
  molecular_function:
