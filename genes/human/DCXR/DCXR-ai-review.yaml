  - reference_id: file:human/DCXR/DCXR-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=acetoin + NADP(+) = diacetyl + NADPH + H(+);
suggested_questions:
- question: Is the physiological role of DCXR in renal proximal tubule (xylitol as osmolyte) or its alpha-dicarbonyl
    reductase activity (detoxification of diacetyl/methylglyoxal-type compounds) the main selective constraint,
    given that pentosuria is clinically benign?
- question: What does DCXR do on epididymal sperm as P34H, and does it require catalytic activity?
- question: The PAINT node PTN001211870 propagates L-xylulose and carbonyl reductase activity but not
    D-glucuronate catabolic process; should the pathway term be placed at the node, given that the full
    CRYL1-C11orf54-DCXR pathway is conserved in deuterostomes (PMID:40737316)?
suggested_experiments:
- description: Measure L-xylulose and alpha-dicarbonyl reductase kinetics for zebrafish and C. elegans
    orthologs side by side with human DCXR to test whether substrate preference is conserved across PANTHER
    subfamilies SF2 and SF3.
- description: Metabolomic profiling (L-xylulose, xylitol, diacetyl, methylglyoxal adducts) of DCXR-knockout
    kidney cells under hyperosmotic stress to test the osmolyte hypothesis.
