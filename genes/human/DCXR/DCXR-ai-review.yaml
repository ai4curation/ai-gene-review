id: Q7Z4W1
gene_symbol: DCXR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DCXR (dicarbonyl/L-xylulose reductase; also diacetyl reductase and the sperm protein P34H)
  is a 244-residue NADPH-dependent short-chain dehydrogenase/reductase that forms a homotetramer. It reduces
  L-xylulose to xylitol in the glucuronate-xylulose (pentose) pathway, downstream of the L-gulonate 3-dehydrogenase
  CRYL1 and the beta-keto-L-gulonate decarboxylase C11orf54, and it reduces alpha-dicarbonyl compounds
  such as diacetyl, 2,3-pentanedione and isatin to the corresponding alpha-hydroxyketones. It prefers
  NADPH over NADH. Crystal structures with NADP(H) show the SDR Rossmann fold and catalytic Asn107/Ser136/Tyr149/Lys153
  tetrad, and a reversible Cys138-Cys150 active-site disulfide that can tune activity. DCXR is abundant
  in kidney, liver and epididymis; in rodent kidney it lies on the apical (brush-border) membranes of
  proximal tubules, where xylitol production may contribute to osmoregulation. On epididymal sperm the
  same protein is the surface antigen P34H, whose role there is unclear. Biallelic loss-of-function variants
  cause pentosuria, a benign inborn error with urinary excretion of L-xylulose.
