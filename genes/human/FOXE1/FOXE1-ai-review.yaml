id: O00358
gene_symbol: FOXE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXE1 is a nuclear forkhead transcription factor that binds cis-regulatory DNA and controls
  gene expression in thyroid and craniofacial development. Its targets include the thyroid differentiation
  genes TG and TPO and the developmental regulators MSX1 and TGFB3. It acts with other transcription factors,
  including ELK1, in promoter-dependent gene regulation. FOXE1 is required for normal thyroid formation
  and palate development. Biallelic pathogenic variants cause Bamforth–Lazarus syndrome, characterized
  by thyroid dysgenesis and craniofacial malformations.
