    review_notes: Authentic Europe PMC original XML recovered after direct-page challenges. Selected Methods,
      Results, captions and Discussion read; no figure pixels or supplements. The pBROAD3 construct uses
      the mouse ROSA26 promoter and an explicitly mouse TTF2 coding insert. Pronuclear transgenesis, PCR/Southern
      confirmation, palatal RNA/protein and immunohistochemistry accompany cleft-palate observations.
      Controls show changing expression during E12.5–E15.5; the transgene disrupts that temporal pattern
      and is associated with persistent medial-edge epithelial expression and unfused shelves. Broad transgenic
      overexpression is distinct from endogenous loss or cell-specific rescue. The authors leave effects
      on apoptosis, EMT and migration for future work; none is measured as a downstream mechanism here.
      Results and Discussion differ over E13.5 significance, so no uniform all-stage increase is asserted.
      This mouse study does not directly assay human FOXE1; the separate 21177256 loss experiment remains
      independently attributed.
