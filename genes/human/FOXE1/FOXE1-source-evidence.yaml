      and Foxe1 migration Results; no pixels or supplements. Mouse Foxe1 deletion and spatially restricted
      rescue support thyroid-bud migration. The rescue construct explicitly inserts rat Foxe1 coding sequence
      NM138909 into the mouse Titf1 locus; it restores bud migration when surrounding pharyngeal endoderm
      lacks Foxe1. This is mouse loss plus rat-cDNA rescue, not direct human functional evidence or a
      pure mouse-protein rescue. It establishes a developmental program and spatial competence, not direct
      physical movement by a transcription factor. Foxe1-deprived Pax8-null buds can also migrate, with
      residual-expression/compensation explanations left open.
