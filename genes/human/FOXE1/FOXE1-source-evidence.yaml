identity:
  accession: O00358
  displayed_length: 373
  sequence_sha256: be34d037962aa145106d559cd4b4091c07b67ba2e5e33c9ffdf2af718546b514
  alternative_products: 0
  limits: No O00358-1 invented. Historical 367/376-aa descriptions, allelic polyalanine tracts, mutant
    constructs, residues 164–373 and the verified eDBD 31–164 remain distinct; historical full-length
    constructs have not been silently mapped to the current sequence.
description: FOXE1 is a nuclear forkhead transcription factor that recognizes regulatory DNA and controls
  gene expression in thyroid and craniofacial developmental contexts. Human FOXE1 binds tested TG, TPO,
  MSX1 and TGFB3 regulatory sequences and activates target-promoter reporters; association with ELK1 also
  supports promoter-dependent regulation. Rat Foxe1 represses selected thyroid promoters under defined
  cofactor conditions. Human loss-of-function alleles disrupt thyroid and palate development, while mouse
  genetics links Foxe1 to thyroid-primordium migration and hair-follicle organization. Its effects depend
  on expression level, target context and the particular allele.
core_functions:
- description: Recognizes forkhead regulatory sequences and regulates Pol II transcription in the nucleus.
    Human promoter-binding, tagged chromatin-occupancy and reporter experiments establish this activity;
    effects depend on promoter, cofactors and FOXE1 abundance. Rat ortholog assays additionally demonstrate
    promoter-specific repression.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:9697705
  - reference_id: PMID:21177256
  - reference_id: PMID:24219130
  - reference_id: PMID:28473536
  - reference_id: PMID:27852061
  - reference_id: PMID:9214635
suggested_questions:
- question: Which promoter and cofactor features determine activation versus repression by endogenous
    human FOXE1, and how much of the ELK1-associated response requires FOXE1 DNA recognition?
- question: How do FOXE1 variants alter target regulation through protein abundance, DNA recognition and
    regulatory capacity, and which of those changes affect thyroid-primordium migration?
suggested_experiments:
- hypothesis: FOXE1 regulatory direction depends on promoter/cofactor context rather than a uniform activation
    program.
  description: In a human thyroid model with verified endogenous FOXE1 and ELK1 expression, compare acute
    FOXE1 depletion and near-endogenous rescue with a DNA-recognition mutant. Measure nascent TG/TPO transcripts
    and a selected ELK1-responsive target alongside matched protein abundance, nuclear access and targeted
    FOXE1/ELK1 chromatin occupancy. Test the relevant promoter motifs separately; distinguish occupancy
    and co-association from direct binary contact. Include viability and expression-level controls.
  experiment_type: Targeted perturbation, transcription and promoter-occupancy assays
- hypothesis: Variant effects on FOXE1 abundance and target regulation can be separated from secondary
    changes in tissue formation.
  description: Compare WT, S57N and R73S FOXE1 at matched expression in a validated thyroid epithelial
    differentiation model. Measure protein abundance/stability, target RNA and protein, and spatial organization
    or bud-movement endpoints where the model reproduces them. Use temporal induction and matched rescue
    to separate early tissue-patterning effects from later transcriptional responses. Treat this as a
    test of human conservation, not as confirmation of the published rat-cDNA mouse rescue.
  experiment_type: Controlled variant comparison in a thyroid developmental model
source_followup_questions:
- Can the original PMID:20484477 F137S Methods, promoter substrates and controls be recovered to adjudicate
  its three source-specific TF, binding and transcription assertions?
- What target-specific developmental evidence supports the PMID:9169137 morphogenesis citation beyond
  its authentic cloning abstract?
- Can the historical rat or alternate Ensembl source for the insulin-response assertion be reconstructed,
  and does it establish a FOXE1-mediated response rather than insulin-regulated FOXE1 expression?
- What functional evidence, beyond the human expression pattern in PMID:15494458, establishes FOXE1 participation
  in thymus or chordate pharynx development?
- Can historical full-length construct sequences be mapped to the current displayed sequence without treating
  allele-dependent polyalanine length or older protein-length descriptions as splice products?
