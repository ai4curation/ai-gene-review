review_decisions:
- raw_index_zero_based: 0
  original_context_sha256: d492805e4a8d419f708e6b7ef4b28a7d656c01dd760ea20c471ba42f79575084
  review:
    summary: FOXE1 recognizes Pol II regulatory DNA through its forkhead domain.
    action: ACCEPT
    reason: The authentic PTHR11829 tree places human O00358 beneath the positive PTN000930906 IBD node,
      with an exact 373-aa target MSA match. Human WT FOXE1 EMSA, competitor/supershift controls and promoter
      experiments in 9697705 and 21177256 independently support cis-regulatory sequence recognition. The
      phylogenetic assertion is consistent with the target biology; it is not a donor-count inference
      or a claim that every ancestral source was newly assayed.
    supported_by:
    - reference_id: PMID:9697705
    - reference_id: PMID:21177256
- raw_index_zero_based: 1
  original_context_sha256: f4d193741f2b10ce4d92a0a4fef496a07c1e6d37cc78314c66a90d3b8481b428
  review:
    summary: Conserved Pol II DNA-binding transcription-factor activity is defining for FOXE1.
    action: ACCEPT
    reason: The positive PTN000930906 IBD is on the verified human target path. Human FOXE1 DNA binding
      and transcriptional reporter responses in 12165566, 21177256 and 24219130 establish the core activity.
      O00358 appearing among descendant evidence is legitimate target experimental support. Current versus
      retained historical donor-list differences do not alter the verified node descent or justify rewriting
      the original source groups.
    supported_by:
    - reference_id: PMID:12165566
    - reference_id: PMID:21177256
    - reference_id: PMID:24219130
- raw_index_zero_based: 2
  original_context_sha256: 626d16972e3f83385beda7071971f86a8bf17b3a2680261d937a13bdd5b986c2
  review:
    summary: The rat-derived TF inference agrees with direct human FOXE1 assays.
    action: ACCEPT
    reason: The captured A6IJB5 donor has an experimental TF annotation from 9214635. That paper assays
      rat TTF2, including DNA binding and promoter-specific repression in a human HeLa host. Separate
      human FOXE1 binding/reporter studies establish conservation of the general Pol II TF activity. The
      original IEA and alternative Ensembl identifier remain intact; the rat insert is not relabeled as
      human and the Ensembl source annotation is not claimed independently reconstructed.
    supported_by:
    - reference_id: PMID:9214635
    - reference_id: PMID:9697705
    - reference_id: PMID:21177256
- raw_index_zero_based: 3
  original_context_sha256: 08caf632d4505de5d14c4d6dbf18f712ed3b52bb4b926c311a168942a36334fd
  review:
    summary: The forkhead TF classification matches the experimentally demonstrated activity.
    action: ACCEPT
    reason: TFClass 3.3.1 is the original classification source. Sequence-specific binding together with
      target-promoter regulation by human FOXE1 in 9697705 and 21177256 supports the Pol II DNA-binding
      TF term beyond the classification alone. This retains the imported ISA provenance without presenting
      it as an additional experimental assay.
    supported_by:
    - reference_id: PMID:9697705
    - reference_id: PMID:21177256
- raw_index_zero_based: 4
  original_context_sha256: 0f52a65836b0f6ca3b8c45291000b433d50282c806bd74c42f4237fe6dce8ac2
  review:
    summary: Human S57N comparison supports WT FOXE1 transcription-factor activity.
    action: ACCEPT
    reason: In 12165566, sequence-checked human WT and S57N constructs were compared by TG-site binding
      and a synthetic reporter containing rat TPO sites. WT activates the reporter, while S57N retains
      reduced binding and partial activation. This supports human FOXE1 TF activity; neither complete
      S57N loss nor endogenous human promoter occupancy follows from this reporter.
    supported_by:
    - reference_id: PMID:12165566
- raw_index_zero_based: 5
  original_context_sha256: 3d82e0460198a3cc59b0452c5d3c18da5841c6537182b753ba0302e735fed017
  review:
    summary: Human R102C comparison supports WT promoter activation coupled to DNA recognition.
    action: ACCEPT
    reason: The selected 16882747 Methods and Results compare human WT and R102C FOXE1 using TG-probe
      EMSA and a human TPO promoter reporter in 293-EBNA cells with TTF1 coexpression. WT binds and activates,
      whereas R102C has negligible activity in those assays. The core TF assertion is supported without
      treating the historical 367-aa description as a reconstructed current natural product.
    supported_by:
    - reference_id: PMID:16882747
- raw_index_zero_based: 6
  original_context_sha256: 6da51bbc6611a84cb8b4ebf71f3ad6ff65b315ffa303d91109835e427e1522ad
  review:
    summary: The N132D study measures FOXE1 TF activity without establishing variant causality.
    action: ACCEPT
    reason: The 20094846 study uses human WT and N132D inserts in HepG2 cells, a TG-probe binding assay
      and a separate human TPO promoter reporter. These experiments support TF capacity. The reported
      quantitative binding descriptions conflict, and the authors conclude N132D is not the cause of thyroid
      dysgenesis in the patient; neither issue erases the WT activity or makes the variant a proven disease
      allele.
    supported_by:
    - reference_id: PMID:20094846
- raw_index_zero_based: 7
  original_context_sha256: 71829631db572c4f4ac9b952dd97aa5dc93f9bd3cf1260148204ec617ec0a2cb
  review:
    summary: F137S-specific TF assay details remain unverified.
    action: UNDECIDED
    reason: The authentic 20484477 abstract reports failed DNA binding and negligible transfection activity
      for human F137S, consistent with known FOXE1 biology. Bounded attempts did not recover the original
      Methods, promoter substrates and controls. The source-specific IMP context therefore remains undecided;
      positive evidence from other FOXE1 variants is not substituted for the unread experiment.
    supported_by:
    - reference_id: PMID:20484477
- raw_index_zero_based: 8
  original_context_sha256: 9e7a7a8a23c356ef03647bc2fdc3a9db56425f5e8cc36de104fc4cb43a8e4a0e
  review:
    summary: Human FOXE1 regulates MSX1 and TGFB3 promoter activity.
    action: ACCEPT
    reason: In 21177256, sequence-checked human FOXE1 constructs in 293-EBNA cells regulate MSX1/TGFB3
      expression and promoter reporters. Nuclear-extract binding controls and tagged ChIP provide complementary
      evidence. Mouse palate transcript effects are a separate developmental result. These human assays
      establish the TF activity without claiming purified affinity, endogenous untagged occupancy or a
      native human palate perturbation.
    supported_by:
    - reference_id: PMID:21177256
- raw_index_zero_based: 9
  original_context_sha256: 441fd8d8bf4d93251c14ffee69b0caba10315ea71fd79f3de1944aa9dd1029bb
  review:
    summary: WT and R73S human FOXE1 have measurable transcription-factor activity.
    action: ACCEPT
    reason: Selected original 24219130 Methods and Results show human WT and R73S FOXE1 acting on human
      TG/TPO reporters in HEK293 cells, with matched protein abundance and no detected EMSA binding difference.
      The R73S reporter increase supports altered activity rather than universal loss across disease-associated
      variants. Primary-thyrocyte TG protein abundance is a distinct endpoint with higher mutant FOXE1
      abundance; it is not a direct endogenous transcription-rate measurement.
    supported_by:
    - reference_id: PMID:24219130
- raw_index_zero_based: 10
  original_context_sha256: b7e1ce6d066c291fd67f772734db65b86bc45a52d096a71f42124cf5c1b19f17
  review:
    summary: Generic DNA binding adds no specificity beyond the retained regulatory sequence-binding activity.
    action: TOO_GENERAL
    reason: The rat donor and human EMSA studies support real DNA binding, but GO:0000978 is an official
      descendant of GO:0003677 and specifies the relevant regulatory recognition. Retain the original
      rat/Ensembl IEA source context while treating this generic term as redundant functional coverage,
      not as a false interaction with DNA.
    supported_by:
    - reference_id: PMID:9214635
    - reference_id: PMID:9697705
- raw_index_zero_based: 11
  original_context_sha256: 354254f088ba14b7f271ef661daeabb4b730d3d0549192f4518f2aba75b23920
  review:
    summary: The domain-based TF assignment is represented more precisely by Pol II-specific TF activity.
    action: TOO_GENERAL
    reason: The three original InterPro sources agree with FOXE1 being a forkhead transcription factor.
      GO:0000981 is an official descendant of GO:0003700 and captures the supported human promoter-regulatory
      activity. The electronic domain assertion is sound but supplies no distinct activity beyond that
      retained term.
    supported_by:
    - reference_id: PMID:9697705
    - reference_id: PMID:21177256
- raw_index_zero_based: 12
  original_context_sha256: 88fe9dd46bdf99df58bd172e08f647b7c13eb420e554071ed844f1c93833a151
  review:
    summary: The original WT/A65V experiment supports the retained, more specific Pol II TF activity.
    action: TOO_GENERAL
    reason: In 9697705, human WT FOXE1 binds a TG probe and activates a synthetic reporter, whereas A65V
      has negligible activity with comparable nuclear protein abundance. The experimentally supported
      TF mechanism is represented by the more specific GO:0000981 already retained. This classification
      does not question the original IDA experiment or erase its source-specific evidence.
    supported_by:
    - reference_id: PMID:9697705
- raw_index_zero_based: 13
  original_context_sha256: 8cb73eada411c20d444691f52144fd37836fe16b0c221d109fffb44f961a3d9a
  review:
    summary: FOXE1 associates with the DNA-binding transcription factor ELK1 in human thyroid and cellular
      interaction assays.
    action: MODIFY
    reason: The original study supports FOXE1 association with ELK1, an established RNA polymerase II-specific
      DNA-binding transcription factor. Tagged proteins co-immunoprecipitated in human NThy thyroid cells,
      endogenous proteins co-immunoprecipitated from human Graves thyroid tissue, and a mammalian two-hybrid
      assay tested FOXE1 residues 164–373 with full-length ELK1. These source-specific results justify
      the more informative transcription-factor-binding class. Co-IP and cellular two-hybrid evidence
      do not establish purified binary affinity or a unique interface; the authors explicitly allow endogenous
      ELK1-mediated bridging for some truncation results. The refinement preserves the original human
      interaction context and does not assign every assay to full-length FOXE1 or assert direct FOXE1
      contact with the TERT DNA sequence.
    proposed_replacement_terms:
    - id: GO:0061629
      label: RNA polymerase II-specific DNA-binding transcription factor binding
    supported_by:
    - reference_id: PMID:27852061
- raw_index_zero_based: 14
  original_context_sha256: 075c7d9437f977b86e41c866df4ae58dc86a404e94d27b33420d62dac8dc50f7
  review:
    summary: The electronic sequence-binding term is broader than the retained cis-regulatory recognition
      term.
    action: TOO_GENERAL
    reason: The InterPro forkhead assignments are consistent with sequence recognition, while retained
      GO:0000978 is a verified descendant of GO:0043565. Direct measured human DNA-binding contexts remain
      separately accepted. The domain-only row adds no distinct substrate or locus specificity and is
      not converted into an experimental assertion.
    supported_by:
    - reference_id: PMID:9697705
    - reference_id: PMID:28473536
- raw_index_zero_based: 15
  original_context_sha256: 56beb586473d071fc0feb533ee0fc8bffc288a8f448d767355440abefb8c7732
  review:
    summary: Human WT FOXE1 recognizes the tested TG sequence with specificity controls.
    action: ACCEPT
    reason: In 12165566, translated human FOXE1 and transfected 293-EBNA nuclear extracts form TG-probe
      complexes; equal protein and antibody-supershift controls support attribution to FOXE1. S57N retains
      diminished binding. This directly measured recognition capacity is integral to TF function, although
      it is not purified equilibrium binding or endogenous chromatin occupancy.
    supported_by:
    - reference_id: PMID:12165566
- raw_index_zero_based: 16
  original_context_sha256: 46366fc49e86babb2a8d40a184f34412e6b2cb273f2920ce64916481bfd2a37f
  review:
    summary: Human WT FOXE1 binds the TG probe, with R102C disrupting the measured interaction.
    action: ACCEPT
    reason: The selected 16882747 Methods identify a TG oligonucleotide and equal in-vitro translation
      comparisons. WT binds while R102C has negligible binding. The sequence-specific DNA-binding assertion
      is supported within that extract-based assay; a reporter using human TPO is a separate regulatory
      experiment.
    supported_by:
    - reference_id: PMID:16882747
- raw_index_zero_based: 17
  original_context_sha256: c9f8fa92fd8d8ecaf5563597756108bfe14e552f2220d61aa31446011d552c59
  review:
    summary: The N132D study supports TG-probe recognition despite inconsistent quantitative wording.
    action: ACCEPT
    reason: The actual 20094846 Methods and Figure 3 identify a TG promoter probe with unlabeled competition
      in HepG2 nuclear extracts. Abstract/Results shorthand instead calls the binding target TPO, and
      Results/Discussion differ over effect size. The specified probe and competition support sequence-specific
      recognition, but no reconciled magnitude or causal N132D disease interpretation is asserted.
    supported_by:
    - reference_id: PMID:20094846
- raw_index_zero_based: 18
  original_context_sha256: fb163f2b72d4c57ae65440b97e3891431bd86874bc65481ceb8c24df42fc118f
  review:
