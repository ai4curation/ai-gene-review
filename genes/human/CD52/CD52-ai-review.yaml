core_functions:
- description: >-
    Soluble, GPI-cleaved CD52 acts as an immunosuppressive ligand for the inhibitory receptor
    Siglec-10. Its alpha-2,3-sialylated N-glycan, assisted by bound HMGB1 Box B, engages Siglec-10,
    inducing Siglec-10 ITIM phosphorylation and SHP1 recruitment, which dampens T cell receptor
    signaling and T cell activation.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0050868
    label: negative regulation of T cell activation
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:23685786
    supporting_text: Soluble CD52 bound to the inhibitory receptor Siglec-10 and impaired phosphorylation of the T cell receptor-associated kinases Lck and Zap70 and T cell activation.
  - reference_id: PMID:29997173
    supporting_text: CD52-Fc induced tyrosine phosphorylation of Siglec-10 and was recovered from T cells complexed with HMGB1 and Siglec-10 in association with SHP1 phosphatase and the T cell receptor (TCR).
  - reference_id: PMID:31507595
    supporting_text: Soluble CD52 is released from the surface of activated T cells and mediates immune suppression via its glycan moiety.
suggested_questions:
- question: >-
    Is Siglec-10 the receptor through which soluble CD52 inhibits TLR/NF-kappaB signaling in
    monocytes, macrophages and dendritic cells, or is a different Siglec or receptor involved?
- question: >-
    Does membrane-bound (GPI-anchored) CD52 have a cell-intrinsic signaling role distinct from the
    soluble form, e.g. the reported costimulatory effects of CD52 ligation on T cells, and is any
    such role physiological rather than antibody-induced?
- question: >-
    Does epididymal CD52 acquired by sperm contribute to immune tolerance of sperm in the female
    reproductive tract, and which glycoforms are present on sperm CD52?
- question: >-
    Should GO capture the HMGB1-sequestering role of soluble CD52 (binding HMGB1 Box B) as a
    distinct molecular function, given that it is also a prerequisite for Siglec-10 engagement?
suggested_experiments:
- hypothesis: Soluble CD52 inhibits innate immune NF-kappaB signaling through Siglec-10.
  description: >-
    Treat SIGLEC10-knockout and wild-type human monocyte-derived macrophages with sialylated CD52-Fc
    before LPS stimulation and measure NF-kappaB activation and cytokine output; complement with
    Siglecg (the mouse Siglec-10 ortholog) knockout mice in the LPS endotoxemia model.
  experiment_type: genetic knockout and signaling assay
- hypothesis: Sperm-associated CD52 suppresses female immune responses to sperm.
  description: >-
    Compare uterine leukocyte activation and anti-sperm antibody formation after insemination with
    sperm from Cd52-deficient versus wild-type males, and test glycan-dependent suppression with
    desialylated sperm CD52.
  experiment_type: in vivo reproductive immunology
