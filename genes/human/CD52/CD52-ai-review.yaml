- term:
    id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  evidence_type: IDA
  original_reference_id: PMID:8223854
  qualifier: involved_in
  review:
    summary: >-
      Cross-linking of cell-bound anti-CDw52 (F(ab')2) induced cytoplasmic calcium fluxes in
      unprimed human monocytes, as did cross-linking of other GPI-anchored antigens.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The observation is real but reflects antibody-induced clustering of GPI-anchored proteins,
      which the authors conclude is a general feature of GPI-linked antigens rather than a
      specific function of CD52. There is no evidence that endogenous CD52 engagement by a
      physiological ligand raises cytosolic calcium; its characterized physiological role is
      inhibitory (soluble CD52 acting through Siglec-10). Not removed because it is an
      experimental observation, but it should not be taken as a CD52 biological process.
    supported_by:
    - reference_id: PMID:8223854
      supporting_text: Cross-linking of cell-bound anti-CD14, -CDw52 and -CD55 induced cytoplasmic calcium fluxes and oxidative bursts in unprimed human monocytes similar to those observed following Fc gamma R cross-linking.
