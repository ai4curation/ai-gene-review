gene_symbol: CD52
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CD52 (CAMPATH-1 antigen; epididymal protein HE5) is a very small glycosylphosphatidylinositol
  (GPI)-anchored glycoprotein whose mature peptide is only about 12 amino acids long and serves
  mainly as a scaffold for the GPI anchor and a large, heavily sialylated N-linked glycan. It is
  abundant on the surface of mature lymphocytes, monocytes, macrophages, eosinophils, NK cells and
  dendritic cells, and is also secreted by epithelial cells of the epididymis and vas deferens into
  seminal fluid, from which it is acquired by the sperm membrane. On immune activation the GPI anchor
  is cleaved by phospholipase and soluble CD52 is released; its alpha-2,3-sialylated N-glycan, with
  the assistance of bound HMGB1 (Box B), engages the inhibitory receptor Siglec-10, triggering
  Siglec-10 phosphorylation and SHP1 recruitment and thereby dampening T cell receptor signaling,
  B cell receptor signaling and Toll-like receptor/NF-kappaB-driven inflammatory responses in
  innate immune cells. CD52 is the target of the lymphocyte-depleting therapeutic antibody
  alemtuzumab.
