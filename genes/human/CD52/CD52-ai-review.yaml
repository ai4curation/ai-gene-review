  review:
    summary: >-
      IBA to the CD52 family node (PTN000385637) whose experimental grounding is the human CD52 IDA
      from antibody cross-linking experiments (PMID:8223854).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The sole experimental basis is calcium flux in monocytes after artificial F(ab')2
      cross-linking of CDw52, which the source paper itself interprets as a generic property of
      GPI-anchored proteins (CD14, CD55, CD16, CD24, CD59 behave the same), not a specific CD52
      function. The physiological signalling role of CD52 is as a soluble Siglec-10 ligand that
      inhibits activation. Propagating calcium-elevation as an inherited family function is
      therefore an over-annotation. The target appearing in its own WITH/FROM is expected and is
      not the problem here; the issue is the nature of the underlying assay.
    propagation_review:
