      supporting_text: Heterogeneous nuclear ribonucleoprotein C1/C2, previously known as a general RNA binding protein, provides a sequence-specific DNA recognition element for LARC, and the LARC DNA-recognition sequence is essential for the enhancement of transcription by HS2.
    - reference_id: PMID:16217013
      supporting_text: LARC binds to the hypersensitive 2 (HS2)-Maf recognition element (MARE) DNA in a sequence-specific
        manner and remodels nucleosomes.
