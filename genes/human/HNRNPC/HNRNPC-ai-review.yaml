  original_reference_id: PMID:16010978
  qualifier: enables
  review:
    summary: HNRNPC binds poly(U) tracts.
    action: ACCEPT
    reason: HNRNPC was purified on poly(U) sepharose (PMID:16010978) and its binding preference for U-tracts underlies
      its competition with U2AF65 (PMID:23374342); this is the most informative MF.
    supported_by:
    - reference_id: PMID:16010978
      supporting_text: The 40 kDa uPAR 3'UTR Bp was purified using poly (U) sepharose and identified as heterogeneous
        nuclear ribonucleoprotein C (hnRNPC).
    - reference_id: PMID:23374342
      supporting_text: Quantitative iCLIP data show that the RNA-binding protein hnRNP C competes with the splicing
        factor U2AF65 at many genuine and cryptic splice sites.
    - reference_id: file:human/HNRNPC/HNRNPC-uniprot.txt
      supporting_text: Interacts with poly-U tracts in the 3'-UTR or 5'-UTR of mRNA and modulates the stability and the level of translation of bound mRNA molecules (PubMed:12509468, PubMed:16010978, PubMed:7567451, PubMed:8264621).
