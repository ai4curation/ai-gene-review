existing_annotations:
- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: IC
  original_reference_id: PMID:11991638
  qualifier: involved_in
  supporting_entities:
  - GO:0071013
  review:
    summary: Loss of m6A-dependent HNRNPC binding alters alternative splicing of target mRNAs.
    action: MODIFY
    reason: HNRNPC regulates splice-site choice (suppression of cryptic Alu exons by competition with U2AF65; m6A-switch-dependent
      alternative splicing) rather than performing the splicing reaction; regulation of alternative splicing is
      more precise.
    proposed_replacement_terms:
    - id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:25719671
      supporting_text: these m(6)A-switch-regulated HNRNPC-binding activities affect the abundance as well as alternative splicing of target mRNAs, demonstrating the regulatory role of m(6)A-switches on gene expression and RNA maturation.
    - reference_id: PMID:23374342
      supporting_text: Quantitative iCLIP data show that the RNA-binding protein hnRNP C competes with the splicing
        factor U2AF65 at many genuine and cryptic splice sites.
    - reference_id: PMID:23374342
      supporting_text: Loss of hnRNP C leads to formation of previously suppressed Alu exons, which severely disrupt
        transcript function.
