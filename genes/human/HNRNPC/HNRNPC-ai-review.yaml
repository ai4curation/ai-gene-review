id: P07910
gene_symbol: HNRNPC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'HNRNPC (heterogeneous nuclear ribonucleoprotein C1/C2) is an abundant nuclear RNA-binding protein
  with a single RRM that assembles as a (C1)3C2 heterotetramer. The tetramer binds uridine-rich stretches of nascent
  RNA polymerase II transcripts cooperatively (about 230-240 nucleotides per tetramer) and nucleates the packaging
  of pre-mRNA into 40S hnRNP particles. By binding long unstructured RNA it acts as a molecular ruler that sorts
  transcripts longer than about 200-300 nucleotides to the mRNA export route rather than the snRNA route. HNRNPC
  regulates pre-mRNA splicing, notably by competing with U2AF65 at poly(U) tracts to suppress the inclusion of cryptic
  Alu-derived exons genome-wide, and its binding is enhanced at sites where N6-methyladenosine opens local RNA structure
  (m6A-switch). It also binds poly(U) elements in 3''-UTRs to influence mRNA stability. Beyond RNA, hnRNP C1/C2
  can bind specific DNA elements: it provides sequence-specific DNA recognition to a beta-globin LCR remodelling
  complex and occupies vitamin D response elements in a cyclical, competitive manner with the VDR-RXR heterodimer;
  constitutive overexpression of this VDRE-binding activity causes a VDR-normal form of hereditary vitamin D-resistant
  rickets.'
