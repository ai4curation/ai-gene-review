- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory
    Chain Function.
  findings:
  - statement: Affinity-enrichment mass spectrometry map of mitochondrial protein interactions around uncharacterised proteins; the ADCK2-ANT2 association reported here is a high-throughput interaction data point supporting only protein binding.
    supporting_text: To reveal functions for these proteins (termed MXPs), we assessed condition-specific protein-protein interactions for 50 select MXPs using affinity enrichment mass spectrometry.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Source of an ADCK2-ANT2 IntAct interaction; supports only "protein binding".
- id: PMID:27641616
  title: TSPO ligands stimulate ZnPPIX transport and ROS accumulation leading to the
    inhibition of P. falciparum growth in human blood.
  findings:
  - statement: TSPO2 and VDAC were found together in a complex in the membranes of mature erythrocytes, which lack mitochondria; this is the observation behind the note that ANT isoforms may be present in non-mitochondrial membranes.
    supporting_text: TSPO2 and VDAC are present in the membranes of mature RBCs in a unique protein complex that changes the affinity of TSPO ligands after Pf infection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available; detects ANT isoforms in erythrocyte (non-mitochondrial)
      membranes as part of a TSPO2-VDAC complex, the basis for UniProt's note that
      ANT2 may localize to non-mitochondrial membranes (the GO:0016020 IDA).
- id: PMID:31883789
  title: Human-Specific ARHGAP11B Acts in Mitochondria to Expand Neocortical Progenitors
    by Glutaminolysis.
  findings:
  - statement: The human-specific protein ARHGAP11B is imported into mitochondria where it binds the adenine nucleotide translocase and inhibits the mitochondrial permeability transition pore - the strongest human-cell evidence for ANT2 involvement in mPTP regulation.
    supporting_text: Here, we show that ARHGAP11B is imported into mitochondria, where it interacts with the adenine nucleotide translocase (ANT) and inhibits the mitochondrial permeability transition pore (mPTP).
    full_text_unavailable: true
  - statement: Pharmacological inhibition of ANT function or of mPTP opening phenocopies ARHGAP11B-driven basal progenitor expansion, functionally linking ANT activity to the mPTP.
    supporting_text: BP expansion by ARHGAP11B requires its presence in mitochondria, and pharmacological inhibition of ANT function or mPTP opening mimic BP expansion by ARHGAP11B.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows human-specific ARHGAP11B enters mitochondria, interacts with ANT and
      inhibits the mPTP to expand basal progenitors; the key experimental support for
      ANT2's mPTP/apoptosis role in human cells.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: SLC25A5 is a member of the stringently defined human mitochondrial high-confidence proteome (MitoCoP), corroborating mitochondrial localization.
    supporting_text: We classified >8,000 proteins in mitochondrial preparations of human cells and defined a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      High-confidence mitochondrial proteome; supports mitochondrial localization.
- id: PMID:35266954
  title: The E3 ligase TRIM1 ubiquitinates LRRK2 and controls its localization, degradation,
    and toxicity.
  findings:
  - statement: Quantitative interactome study of LRRK2 that identified TRIM1; an ANT2 entry arising from this dataset is a large-scale interaction hit and does not characterise ANT2 function.
    supporting_text: We performed quantitative mass spectrometry-based interactome studies to identify 48 novel LRRK2 interactors, including the microtubule-associated E3 ubiquitin ligase TRIM1 (tripartite motif family 1).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Source of an LRRK2-ANT2 IntAct interaction; supports only "protein binding".
- id: Reactome:R-HSA-163215
  title: SLC25A5,6 dimers exchange ATP for ADP across the mitochondrial inner membrane
  findings:
  - statement: 'Reactome reaction for the core function: SLC25A5 (the fibroblast ANT isoform) works as a homodimeric antiporter that exports matrix ATP in exchange for cytosolic ADP across the mitochondrial inner membrane, maintaining a high matrix ADP:ATP ratio.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for the ADP/ATP exchange at the inner membrane; directly
      supports the core antiporter function and inner-membrane location.
- id: Reactome:R-HSA-180905
  title: Association of Vpr with ANT1
  findings:
  - statement: Host-virus reaction in which HIV-1 Vpr binds the permeability transition pore component ANT1 and triggers membrane permeabilization; annotated to the ANT1 paralogue, so for SLC25A5 it serves only to place the carrier at the inner membrane as part of the pore complex.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Reactome host-virus reaction (HIV-1 Vpr/ANT); used here only to place ANT2 at
      the mitochondrial inner membrane.
- id: Reactome:R-HSA-9837978
  title: LONP1 binds mitochondrial inner membrane proteins
  findings:
  - statement: Reactome reaction in which the matrix AAA protease LONP1 binds inner-membrane substrate proteins; SLC25A5 appears as a LONP1-bound substrate, which supports its inner-membrane location and implies proteolytic turnover control.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction placing ANT2 among LONP1-bound inner-membrane proteins;
      supports inner-membrane location.
- id: Reactome:R-HSA-9838004
  title: LONP1 degrades mitochondrial inner membrane proteins
  findings:
  - statement: Reactome reaction in which LONP1 degrades bound inner-membrane proteins including SLC25A5; relevant to carrier turnover and quality control rather than to the transport function itself.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction placing ANT2 among LONP1-degraded inner-membrane proteins;
      supports inner-membrane location.

suggested_questions:
- question: >-
    Which of the ANT2-specific phenotypes reported in human cells (mitochondrial
    permeability transition pore regulation, uncoupling/proton leak, mitophagy) are
    genuinely isoform-specific, and which are shared properties of the ANT family that
    have been transferred to SLC25A5 by paralogy?
  experts: []
- question: >-
    Is SLC25A5 a structural constituent of the mitochondrial permeability transition
    pore, or a regulator that modulates a pore formed by other components? The ANT
    knockout literature supports a regulatory role, but many annotations still read as
    structural.
  experts: []
- question: >-
    Does the reported MMXD (MMS19-MIP18-XPD) complex membership reflect a genuine
    extramitochondrial pool of ANT2, or co-purification of an abundant inner-membrane
    carrier? No mechanism links an ADP/ATP antiporter to cytosolic Fe-S cluster
    trafficking or chromosome segregation.
  experts: []
- question: >-
    What accounts for the reciprocal ANT1/ANT2 expression pattern between differentiated
    and proliferating or glycolytic cells, and does ANT2 operate with a different net
    directionality (ATP import) under those conditions?
  experts: []

suggested_experiments:
- hypothesis: >-
    SLC25A5 regulates rather than constitutes the mitochondrial permeability transition
    pore.
  description: >-
    Use isogenic SLC25A5 knockout cells, and cells with all three ANT isoforms deleted,
    reconstituted with transport-dead ANT2 point mutants, then measure calcium-retention
    capacity, mPTP opening by calcein-cobalt quenching, and swelling in isolated
    mitochondria. Retention of pore activity in the absence of ANT2, or in the presence
    of transport-dead ANT2, would separate the regulatory from the structural model.
  experiment_type: isogenic knockout and transport-dead rescue with calcium-retention assays
- hypothesis: >-
    The MMXD complex association of ANT2 is a co-purification artefact rather than a
    genuine extramitochondrial function.
  description: >-
    Perform reciprocal immunoprecipitation of MMS19, MIP18 and XPD in cells expressing
    epitope-tagged ANT2, combined with proximity labelling from a cytosolically exposed
    bait and with subcellular fractionation controls, to test whether ANT2 is present
    outside the inner membrane in stoichiometric amounts and whether MMXD assembly
    survives ANT2 depletion.
  experiment_type: reciprocal co-IP and proximity labelling with fractionation controls
- hypothesis: >-
    SLC25A5 and SLC25A4 differ quantitatively in transport kinetics or directionality,
    accounting for their reciprocal tissue and proliferative expression.
  description: >-
    Reconstitute purified recombinant human ANT2 and ANT1 into proteoliposomes and
    compare ADP/ATP exchange kinetics, membrane-potential dependence and directional
    bias side by side under matched conditions, then test whether swapping isoforms in
    cells alters the cytosolic ATP/ADP ratio measured with a genetically encoded sensor.
  experiment_type: proteoliposome transport assay with in-cell ATP/ADP sensor readout
