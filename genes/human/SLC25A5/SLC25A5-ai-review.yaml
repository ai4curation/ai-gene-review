references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: InterPro2GO mapping of the mitochondrial carrier (MCF) domain signature; it yields only the high-level transmembrane transport parent process and cannot resolve the ADP/ATP substrate specificity of SLC25A5.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      InterPro2GO pipeline; assigns only the high-level "transmembrane transport"
      parent process.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings:
  - statement: Curator-judged ISS transfer from the well-characterised paralogue SLC25A4 (P51881), the source of the core ADP/ATP antiporter molecular function, inner-membrane location and adenine-nucleotide transport processes for SLC25A5.
  - statement: The same ISS transfer also supplies the secondary uncoupling, permeability transition pore and mitophagy-related annotations; these are by-similarity assertions from the paralogue rather than direct evidence for ANT2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      ISS transfer from the well-characterized paralog P51881; correctly assigns the
      core antiporter MF, inner-membrane location and ADP/ATP transport processes,
      plus the secondary uncoupling/mPTP/mitophagy roles.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAN-GO/GO_Central phylogenetically-inferred (IBA) annotations, which correctly propagate the ADP/ATP antiporter activity, mitochondrial inner-membrane location and ATP transport process across the deeply conserved ANT clade.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAN-GO/GO_Central phylogenetic annotations; correctly captures the core
      antiporter MF, inner-membrane location, ATP-transport process and the mPTP-
      associated roles.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: Immunofluorescence-based curation (HPA) supporting mitochondrial localization of SLC25A5; imaging cannot distinguish the inner membrane from other mitochondrial sub-compartments.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      HPA immunofluorescence supporting mitochondrial localization.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings:
  - statement: Ensembl Compara orthology projection from the mouse orthologue, the source of the secondary proton-transport/uncoupling, permeability transition pore, mitophagy, thermogenesis and differentiation annotations; all are By-similarity and are treated as non-core here.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Ensembl Compara transfer from the mouse orthologue; provides the secondary
      uncoupler/proton-transport/mPTP/mitophagy/thermogenesis and differentiation
      annotations, all By-similarity and treated here as non-core.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings:
  - statement: Inter-ontology logical inference propagated "adenine transport" from an upstream "adenine transmembrane transporter activity" assertion. ANT2 exchanges ADP for ATP, i.e. adenine nucleotides, not free adenine, so this inferred term carries the wrong substrate.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Inter-ontology inference produced "adenine transport" from the incorrect
      "adenine transmembrane transporter activity"; ANT transports adenine
      nucleotides, not free adenine, so the inferred term has the wrong substrate.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA machine-learning rule assigning mitochondrion localization from sequence features; the compartment is correct but the term is coarse relative to the inner-membrane assignment supported by experimental and ISS evidence.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      ARBA-assigned mitochondrion localization; correct compartment.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined multi-method IEA pipeline; for SLC25A5 it converges on the core ADP/ATP antiporter activity, mitochondrial inner-membrane location and mitochondrial ADP and ATP transport processes, in agreement with the manual and phylogenetic evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Multiple-method IEA pipeline; correctly assigns the core antiporter MF, inner-
      membrane location and mitochondrial ADP/ATP transport processes.
- id: PMID:17715127
  title: Regulation of insulin secretion by SIRT4, a mitochondrial ADP-ribosyltransferase.
  findings:
  - statement: ANT2 and ANT3 were recovered by mass spectrometry as SIRT4 co-immunoprecipitating proteins, the source of the SIRT4-SLC25A5 interaction record.
    supporting_text: Mass spectrometry analysis of proteins that coimmunoprecipitate with SIRT4 identified insulindegrading enzyme and the ADP/ATP carrier proteins, ANT2 and ANT3.
    full_text_unavailable: true
  - statement: The study's focus is SIRT4 and insulin secretion; the ANT2 association is an interaction data point and supports only an uninformative protein-binding assignment for SLC25A5.
    supporting_text: These observations define a new role for mitochondrial SIRT4 in the regulation of insulin secretion.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Source of a SIRT4-ANT2 IntAct interaction; the paper is primarily about SIRT4
      and insulin secretion. Supports only an uninformative "protein binding".
- id: PMID:18063578
  title: The layered structure of human mitochondrial DNA nucleoids.
  findings:
  - statement: Formaldehyde cross-linking distinguished core nucleoid proteins in direct contact with mtDNA from metabolic proteins merely co-purifying with native nucleoids; ANT2's presence in the native preparation is therefore association, not nucleoid membership.
    supporting_text: Several other metabolic proteins and chaperones identified in native nucleoids, including ATAD3, were not observed to cross-link to mtDNA.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      ANT co-purifies with mtDNA nucleoids but the study notes several metabolic
      proteins in native nucleoids did not cross-link to mtDNA; association rather
      than functional nucleoid membership.
- id: PMID:19116139
  title: Capsaicin binds to prohibitin 2 and displaces it from the mitochondria to
    the nucleus.
  findings:
  - statement: The cached record is abstract-only. The abstract reports identification of prohibitin 2 as the capsaicin target and its displacement from the mitochondria to the nucleus, and does not mention ANT2 or any nucleotide-transport assay; the full text was not available for this review, so the nucleotide-transport activity attributed to this reference could not be verified from the cached record.
    supporting_text: We show that capsaicin binds to prohibitin (PHB) 2, which is normally localized to the inner mitochondrial membrane, and induces its translocation to the nucleus.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      This capsaicin/prohibitin-2 paper is cited (IMP) for ANT2 nucleotide-transport
      activity and adenine nucleotide transport, but it does not measure ANT2
      transport; it supports only a prohibitin-2 co-purification (protein binding).
- id: PMID:19130895
  title: Enzymatically inactive adenylate kinase 4 interacts with mitochondrial ADP/ATP
    translocase.
  findings:
  - statement: Proteomic and co-precipitation experiments showed that the mitochondrial ADP/ATP translocases interact with adenylate kinase 4, a physiologically plausible adenine-nucleotide-handling partner.
    supporting_text: Proteomic studies revealed that the mitochondrial ADP/ATP translocases (ANTs) interacted with AK4 and higher amount of ANT was co-precipitated with AK4 when cells were exposed to H(2)O(2) treatment.
  - statement: The authors propose that the ANT interaction underlies the cytoprotective effect of AK4 under stress; the evidence nevertheless supports only protein binding as a molecular function for ANT2.
    supporting_text: It is likely that the interaction with the mitochondrial inner membrane protein ANT is important for AK4 to exert the protective benefits to cells under stress.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available; demonstrates co-immunoprecipitation of ANT with AK4,
      a physiologically plausible adenine-nucleotide-handling interaction. Supports
      only "protein binding" as an MF.
- id: PMID:19154410
  title: Identification of C2orf18, termed ANT2BP (ANT2-binding protein), as one of
    the key molecules involved in pancreatic carcinogenesis.
  findings:
  - statement: C2orf18/ANT2BP was shown to localise to mitochondria and to interact with ANT2, defining the ANT2-binding protein and linking ANT2 to membrane-potential and energy homeostasis.
    supporting_text: We showed that C2orf18 was localized in the mitochondria and it could interact with adenine nucleotide translocase 2 (ANT2), which is involved in maintenance of the mitochondrial membrane potential and energy homeostasis, and was indicated some roles in apoptosis.
    full_text_unavailable: true
  - statement: siRNA knockdown of the ANT2 partner C2orf18 induced apoptosis and suppressed growth of pancreatic cancer cells; the phenotype is attributed to C2orf18, so proliferation/apoptosis annotations for ANT2 itself are indirect.
    supporting_text: Knockdown of C2orf18 by small-interfering RNA in PDAC cell lines resulted in induction of apoptosis and suppression of cancer cell growth, suggesting its essential role in maintaining viability of PDAC cells.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; identifies the ANT2-binding protein ANT2BP/C2orf18/SLC35F6
      and links ANT2 to PDAC-cell proliferation and apoptosis. Source of the
      proliferation and OMM-permeabilization/apoptosis IMP annotations.
- id: PMID:19725078
  title: Proteomic analysis of increased Parkin expression and its interactants provides
    evidence for a role in modulation of mitochondrial function.
  findings:
  - statement: SLC25A5 was recovered among 14 tandem-affinity-purified interactants of the E3 ubiquitin ligase Parkin, the basis for the specific ubiquitin protein ligase binding annotation.
    supporting_text: Tandem affinity purification/MS revealed 14 potential interactants of Parkin; CKB, DBT, HSPD1, HSPA9, LRPPRC, NDUFS2, PRDX6, SLC25A5, TPI1, UCHL1, UQCRC1, VCL, YWHAZ, YWHAE.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Tandem-affinity-purification/MS lists SLC25A5 among Parkin (E3 ligase)
      interactants; supports the specific "ubiquitin protein ligase binding" MF.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings:
  - statement: Large-scale membrane-proteome catalogue of an NK-like cell line; detection of the abundant ANT2 carrier here supports only the over-general membrane location and adds nothing about function.
    supporting_text: Mass spectrometric analysis identified 1843 proteins with high confidence scores.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput membrane-proteome detection; supports only the over-general
      "membrane" location.
- id: PMID:20797633
  title: MMXD, a TFIIH-independent XPD-MMS19 protein complex involved in chromosome
    segregation.
  findings:
  - statement: ANT2 was identified as a component of the TFIIH-independent MMXD (MMS19-MIP18-XPD) complex, the basis for the GO:0071817 MMXD complex annotation.
    supporting_text: Instead, it included FAM96B (now designated MIP18), Ciao1, and ANT2.
    full_text_unavailable: true
  - statement: Knockdown of MMXD components caused improper chromosome segregation and abnormal nuclei, linking the complex - though not ANT2 specifically - to mitotic chromosome segregation.
    supporting_text: The siRNA-mediated knockdown of MMS19, MIP18, or XPD led to improper chromosome segregation and the accumulation of nuclei with abnormal shapes.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Directly identifies ANT2 as a component of the MMXD (MMS19-MIP18-XPD) complex
      implicated in chromosome segregation; basis of the GO:0071817 IDA annotation.
- id: PMID:20833797
  title: Phosphoproteome analysis of functional mitochondria isolated from resting
    human muscle reveals extensive phosphorylation of inner membrane protein complexes
    and enzymes.
  findings:
  - statement: Phosphoproteomic survey of mitochondria isolated from human skeletal muscle; ANT2 is detected among phosphorylated inner-membrane transporters, which supports mitochondrial localization but not a specific function.
    supporting_text: We also assigned phosphorylation sites in mitochondrial proteins involved in amino acid degradation, importers and transporters, calcium homeostasis, and apoptosis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput mitochondrial phosphoproteome; supports mitochondrial
      localization.
- id: PMID:21370995
  title: Expression of leucine-rich repeat kinase 2 (LRRK2) inhibits the processing
    of uMtCK to induce cell death in a cell culture model system.
  findings:
  - statement: LRRK2 was shown to interact with permeability transition pore components including ANT, the source of the LRRK2-ANT2 interaction record.
    supporting_text: We have identified several novel LRRK2 interacting proteins and showed that LRRK2 can interact with three components of the PTPC (permeability transition pore complex) including ANT (adenine nucleotide translocator), VDAC (voltage-dependent anion channel) and uMtCK
    full_text_unavailable: true
  - statement: LRRK2 expression increases the ANT-VDAC association implicated in permeability transition pore opening, consistent with ANT2 participating in mPTP regulation.
    supporting_text: In addition, the expression of both wild-type and mutant forms of LRRK2 promotes the interaction between ANT and VDAC, which plays a role in permeabilization transition pore opening.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Source of an LRRK2-ANT2 IntAct interaction; supports only "protein binding".
- id: PMID:21630459
  title: Proteomic characterization of the human sperm nucleus.
  findings:
  - statement: Catalogue of proteins detected in isolated human sperm nuclei; a nuclear location for this abundant mitochondrial inner-membrane carrier is most parsimoniously explained as co-purification background rather than genuine nuclear residence.
    supporting_text: With this approach, 403 different proteins have been identified from the isolated sperm nuclei.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Sperm-nucleus proteome; the "nucleus" localization for this abundant
      mitochondrial carrier is most likely a co-purification background hit.
- id: PMID:2168878
  title: The human fibroblast adenine nucleotide translocator gene. Molecular cloning
    and sequence.
  findings:
  - statement: Genomic cloning and sequencing of the human fibroblast adenine nucleotide translocator gene (ANT2/SLC25A5). The cached record is abstract-only and describes sequence-level work; no transport assay and no localization experiment are described in the abstract, and the full text was not available for this review.
    supporting_text: We report the cloning and sequencing of the gene expressed in human fibroblasts.
    full_text_unavailable: true
  - statement: The paper characterises the ANT2 promoter and relates promoter differences to cell-type-specific and proliferation-associated expression of the three ANT genes.
    supporting_text: Differences among the sequence motifs of the 5'-flanking region of the three human translocase genes could account for differences in their cell type-specific and proliferation-associated expression.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Genomic cloning/sequence of the fibroblast (ANT2) gene; no transport assay and
      no localization experiment, yet cited (TAS) for "adenine transmembrane
      transporter activity" (wrong substrate) and "plasma membrane" location.
- id: PMID:22658674
  title: Insights into RNA biology from an atlas of mammalian mRNA-binding proteins.
  findings:
  - statement: UV-crosslinking mRNA interactome capture in HeLa cells; abundant mitochondrial membrane proteins are recurrent nonspecific hits in this assay, so the resulting RNA binding assignment is not a credible molecular function for ANT2.
    supporting_text: We identify 860 proteins that qualify as RBPs by biochemical and statistical criteria, adding more than 300 RBPs to those previously known
    full_text_unavailable: true
  reference_review:
