    correctness: LOW_QUALITY
    review_notes: >-
      High-throughput mRNA-interactome capture; abundant mitochondrial membrane
      proteins are frequent nonspecific hits, so the "RNA binding" MF is not a
      credible molecular function for ANT2.
- id: PMID:24725412
  title: Ribosomal protein s15 phosphorylation mediates LRRK2 neurodegeneration in
    Parkinson's disease.
  findings:
  - statement: Study of LRRK2-mediated ribosomal protein s15 phosphorylation in Parkinson's disease models; the ANT2 record derived from it is an interaction-screen by-product with no functional characterisation of ANT2.
    supporting_text: Here, we show that ribosomal protein s15 is a key pathogenic LRRK2 substrate in Drosophila and human neuron PD models.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
