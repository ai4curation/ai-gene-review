- id: PMID:11153919
  title: 'The human dynein intermediate chain 2 gene (DNAI2): cloning, mapping, expression pattern, and
    evaluation as a candidate for primary ciliary dyskinesia.'
  findings:
  - statement: Human DNAI2 was cloned and mapped, with trachea/testis expression; the screened twelve
      cases had no coding mutation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached and publisher abstracts were inspected. Full original Methods remain
      unavailable; the negative screen is not a functional disproof.
- id: PMID:18950741
  title: DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm.
  findings:
  - statement: Human DNAI2 occupies respiratory axonemes and sperm flagella; pathogenic alleles disrupt
      outer-arm incorporation and ultrastructure.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Methods/Results/Discussion were inspected. The abstract reverses the
      DNAI1-mutant proximal/distal comparison; the body supports proximal retention and distal loss. An
