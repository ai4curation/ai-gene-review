suggested_questions:
- question: Does human DNAI2 occupy the extracellular-facing oocyte membrane, as inferred from the mouse
    oocyte-surface annotation, and which topology controls distinguish that pool from adjacent cytoplasm?
- question: How does the natural 12-residue deletion in Q9GZS0-2 affect outer-arm incorporation, partner
    contacts and ciliary motility?
- question: Which light- and heavy-chain contacts are direct for human DNAI2, and how do they change between
    DynAP assembly intermediates and the mature outer arm?
suggested_experiments:
- description: Compare sequence-verified Q9GZS0-1 and Q9GZS0-2 at matched expression in DNAI2-deficient
    human airway cultures, measuring outer-arm incorporation, partner association and ciliary beat without
    assuming the natural deletion reproduces a disease allele.
- description: Test the proposed oocyte-surface pool with extracellular-accessibility and permeabilization
    controls, orthogonal antibodies and endogenous tagging in an appropriate species-matched system.
