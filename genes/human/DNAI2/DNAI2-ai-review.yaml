  review:
    summary: Retain the motor-complex contribution, but distinguish it from autonomous motor activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003777 specifically denotes movement along a microtubule driven by ATP hydrolysis. DNAI2
      is the noncatalytic intermediate chain of the outer-arm motor; the heavy chains supply its motor
      and ATPase domains, as distinguished in PMID:18950741. Thus an unqualified intrinsic motor activity
      exceeds the established DNAI2 mechanism, although its contribution to that activity is real and
