id: Q9GZS0
gene_symbol: DNAI2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAI2 is a WD-repeat intermediate-chain component of outer axonemal dynein arms. It participates
  in the organization of the heavy- and light-chain motor assembly that drives motile cilia and sperm
  flagella. During multiciliated-cell differentiation, DNAI2 occupies cytoplasmic assembly pools before
  incorporation into the axoneme; conserved orthologs also concentrate in dynein axonemal particles. Human
  loss-of-function variants disrupt outer-arm organization and cause primary ciliary dyskinesia, often
  with laterality abnormalities.
alternative_products:
- name: '1'
  id: Q9GZS0-1
  sequence_note: Displayed 605-residue protein. The reviewed human localization and interaction experiments
    are not established to distinguish the two current natural products.
- name: '2'
  id: Q9GZS0-2
  sequence_note: 593 residues; VSP_036541 removes canonical residues 450–461. This natural 12-residue
    deletion is distinct from the disease-associated 49-residue exon-11 deletion in PMID:18950741. Sequence
    reconstruction alone does not establish equivalent activity or inactivity.
