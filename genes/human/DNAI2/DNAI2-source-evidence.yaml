core_scope: Heavy-chain and light-chain binding are represented as complementary entries within the same structural
  intermediate-chain role. Motor activity remains a contribution to the outer-arm complex, not an autonomous ATPase.
  Axoneme is the mature anatomical pool, outer dynein arm the complex, and DynAP the conserved preassembly compartment.
  There is no separate folding/chaperone core.
source_limits:
- 11153919 original Methods remain unavailable; its negative patient screen does not refute function.
- 18547164 has a positive mouse surface-localization abstract; extracellular-facing topology and human transfer
  remain unresolved.
- 18950741 abstract proximal/distal reversal and inconsistent Results type-number label are not propagated.
- Unversioned NM_023036 construct designation is not proof of a current natural isoform.
- Protected publication caches and source annotation dictionaries remain unchanged.

followup_2026_10_17:
  binding_basis: Both existing chain-binding IBAs descend from PTN000277823. The accepted binding classes are
    represented explicitly without claiming that all source assays resolve a purified human interface.
  heavy_chain_context: PMID29916806 Figure 4A uses human nasal-cell proximity ligation; Figures 4C-E show
    mouse tissue complexes. The endogenous immunoprecipitation Methods also describe human airway cultures;
    this additional protocol is not treated as a purified interaction assay. PMID33263282 Figure 3B and AP-MS Methods
    use Xenopus GFP-Dnai2, with matched GFP-only controls, and recover heavy- and light-chain partners.
  light_chain_donor: PMID25830415 Figure 1H and in-vitro binding Results test WDR34/WDR60 with TCTEX1D2;
    this is ancestral donor-system evidence, not a human DNAI2 assay.
