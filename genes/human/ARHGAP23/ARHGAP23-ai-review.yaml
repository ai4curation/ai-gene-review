    reason: >-
      Kept for the same reason as the RHOA row: the membership is sourced rather than inferred
      from the domain, and two independent cellular biosensor experiments support it. The
      evidence is nonetheless weaker than for RhoA, and this review says so rather than letting
      the two identical GO rows imply equal confidence. PMID:27226243 measured Rac1 in the same
