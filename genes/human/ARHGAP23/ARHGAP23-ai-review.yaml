id: Q9P227
gene_symbol: ARHGAP23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARHGAP23 is a large (1491-residue) multidomain Rho GTPase-activating protein built on the
  PDZ - pleckstrin-homology - RhoGAP architecture it shares with its closest paralog ARHGAP21.
  Its Rho-GAP domain is intact: the catalytic arginine finger is present at position 942, in
  register with the arginine resolved in the p50RhoGAP:RhoA transition-state structure, and at
  the structurally defined GAP:GTPase interface the protein is residue-for-residue almost
  identical to the experimentally active ARHGAP21. Cellular assays place its activity on RhoA
  and on Rac1 but not on Cdc42, although the two substrates have been measured in different
  systems and one study that saw RhoA suppression saw no Rac1 activation, so the Rac1 arm is
  cell-type dependent rather than settled; no assay on purified protein has been reported.
  ARHGAP23 acts where cells contact something. In migrating cells it is held by the planar
  cell polarity protein Prickle1 at the non-protrusive lateral cortex that flanks active
  lamellipodia, and losing either partner raises GTP-bound RhoA, increases myosin light-chain
  phosphorylation and disorganizes the actomyosin network - a spatial restriction of RhoA that
  confines where a cell can protrude. In keratinocytes it is bound by the junctional scaffold
  plakophilin 4, which lowers its association with RhoA and thereby licenses cortical RhoA
  activity and the cortical actin ring; when plakophilin 4 is absent, ARHGAP23 suppresses
  cortical RhoA from the cytoplasm and stress fibres form instead. It is also enriched at
  focal adhesions, with a pericentric distribution within each adhesion, and in endothelial
  cells it is one of a small set of proteins that bind VE-cadherin. Its reported cellular
  consequences - adhesion maturation, dendritic spine maturation, cell shape fluctuation
  during migration - are all downstream of the same job: locally inactivating Rho-family
  GTPases at a membrane where a junction, an adhesion or a polarity cue has specified that
  contractility should be kept off.
