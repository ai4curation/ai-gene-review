  review:
    summary: >-
      The compartment attached to the RHOA GAP reaction, projected onto every member. A
      cytosolic pool of ARHGAP23 is real and is functionally implicated in the keratinocyte
      work, but it is not where the protein does most of its reported work, and this row is not
