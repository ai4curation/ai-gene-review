core_functions:
- description: >-
    Spatially restricted inactivation of Rho-family GTPases at a cell-contact surface. ARHGAP23
    is a catalytically intact RhoGAP whose arginine finger at position 942 is reciprocally in
    register with the arginine resolved in the p50RhoGAP:RhoA transition-state structure, and
    which is residue-identical to the experimentally active paralog ARHGAP21 at 22 of the 25
    positions that contact the GTPase or the transition state in that structure. Its measured
    activity in cells is on RhoA and on Rac1 and not on Cdc42. What distinguishes it from a
    generic RhoGAP is where it acts: it is held at the non-protrusive lateral cortex by the
    planar cell polarity protein Prickle1, and removing either partner raises GTP-bound RhoA and
    disorganizes the actomyosin network, while adding ARHGAP23 back lowers RhoA as effectively
    as the inhibitor C3 transferase. The molecular function is recorded as GO:0005096 because GO
    no longer has substrate-specific GAP-activity terms; the substrate is carried instead on the
    process terms.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0035024
    label: negative regulation of Rho protein signal transduction
  - id: GO:0035021
    label: negative regulation of Rac protein signal transduction
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:27226243
    supporting_text: Moreover, overexpressing Arhgap23 in MDA/shPk1 cells suppressed the elevation
      of active RhoA to a similar level as treatment with the active RhoA inhibitor, C3 transferase
      (Supplementary Fig. 3d).
  - reference_id: PMID:27226243
    supporting_text: In migrating cells, we find that Pk1 and Arhgap21/23 are located at
      non-protrusive membranes that are lateral to active protrusions.
  - reference_id: PMID:28114311
    supporting_text: A Rac FRET biosensor [39] confirmed that shRNA against ARHGAP23 increased Rac1
      activity to levels indistinguishable from constitutively active Raichu Rac V12 (Fig 5D and
      5E), demonstrating that ARHGAP23 functions as a novel Rac1 GAP in adhesion maturation of
      migratory CHO.K1 cells as well as synapse maturation in neurons.
  - reference_id: file:human/ARHGAP23/ARHGAP23-bioinformatics/RESULTS.md
    supporting_text: At the 25 interface positions mapped in both, ARHGAP23 and RHG21_HUMAN carry
      the **same residue at 22**
- description: >-
    A plakophilin-4-regulated pool that sets where cortical contractility is permitted. In
    keratinocytes ARHGAP23 co-purifies with plakophilin 4 while its close paralog ARHGAP21 does
    not, and plakophilin 4 binding lowers ARHGAP23's association with RhoA. The consequence is
    directional: with plakophilin 4 present, cortical RhoA is protected and a cortical actin
    ring forms; without it, ARHGAP23 suppresses cortical RhoA from the cytoplasm and stress
    fibres appear instead, and depleting ARHGAP23 in those cells abolishes them. A junctional
    association is seen in a second cell type, where ARHGAP23 is one of four proteins that bind
    VE-cadherin in endothelium - an interaction result rather than a localization one, which is
    why no junction term is asserted here. Recorded as a distinct core function from the
    cortical one because the regulator, the compartment and the readout differ, and because it
    is the clearest case in which ARHGAP23 and ARHGAP21 behave differently. It is recorded
    separately rather than merged into the cortical function above because the two differ in
    the thing GO cannot otherwise express for this protein: not the activity, which is the
    same, but which regulator licenses it and therefore when it is allowed to run. Prickle1
    delivers ARHGAP23 to the lateral cortex so that RhoA is kept off there; plakophilin 4 does
    the opposite, binding ARHGAP23 and lowering its access to RhoA so that cortical RhoA is
    permitted. Cytosol is deliberately not listed as a location here even though the
    keratinocyte experiment reads out a cytoplasmic pool, because that pool is the PKP4-knockout
    condition - an engineered background - and the two GOA cytosol rows are kept as non-core for
    the same reason.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0035024
    label: negative regulation of Rho protein signal transduction
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:38970683
    supporting_text: ARHGAP21 did not co-purify with PKP4. In contrast, the GAPs ARHGAP23, ARHGAP24,
      and RACGAP1 co-precipitated.
  - reference_id: PMID:38970683
    supporting_text: In PKP4-KO cells, ARHGAP23 depletion correlated with a loss of stress fibers,
      suggesting that ARHGAP23 is active in the PKP4-KO cell cytoplasm to reduce cortical RhoA
      activity and suppress cortical ring formation.
  - reference_id: PMID:42006337
    supporting_text: The core VE-cadherin interactome includes known catenin proteins as well as
      ARVCF, ARHGAP23, KEAP1, and NGLY1.
knowledge_gaps:
- gap_statement: >-
    No GO molecular-function term can record which GTPase ARHGAP23 acts on. GO:0005100 "Rho
    GTPase activator activity" is obsolete and merged into GO:0005096, which now carries "Rho
    GAP activity", "Rho GTPase activator activity", "Rac GAP activity" and "Rac GTPase activator
    activity" as narrow synonyms and has no is_a children. The consequence is visible in this
    gene's own record: three GO:0005096 rows descend from a RHOA reaction, a RAC1 reaction and a
    phylogenetic node whose experimental grounding is a Cdc42 GAP, and all three are identical.
  boundary: >-
    The substrate profile itself is not unknown. A cellular FRET screen scored ARHGAP23
    significantly active on RhoA and Rac1 and inactive on Cdc42, and Reactome models the RHOA
    and RAC1 reactions separately. The information exists, is curated upstream, and is destroyed
    at the point of GO annotation.
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Substrate specificity is the only thing that distinguishes one of the 66 human RhoGAPs from
    another. A molecular-function branch that cannot express it makes every member of the family
    look interchangeable, which is precisely the condition under which annotation transfer
    between paralogs goes unchallenged - the failure mode that produced a false GAP-activity
    assertion for ARHGAP11B and a residue-free one for ARHGAP36 elsewhere in this batch.
  resolution: >-
    Either restore substrate-specific children under GO:0005096, or establish a convention for
    recording the GTPase as an input on the activity. The process branch already solves the
    problem - GO:0035024 and GO:0035021 exist and are used in this review - so the asymmetry
    between the two branches is the concrete thing to raise with the ontology editors.
- gap_statement: >-
    It is not known whether ARHGAP23's catalytic arginine is required for its measured activity,
    and the one published point mutant described as its arginine-finger mutant does not target
    that residue. ARHGAP23-R986K, from the family-wide screen, mutates an arginine that aligns
    to ARHGAP1 R323 - inside the GAP:GTPase interface but not in contact with the transition
    state - while the annotated arginine finger is R942, which aligns to ARHGAP1 R282.
  boundary: >-
    The residue itself is firmly established: R942 is UniProt's annotated Site, it is
    reciprocally in register with ARHGAP1's structurally resolved arginine finger, and the
    surrounding interface is essentially identical to that of an experimentally active paralog.
    What is missing is the functional test, and the mutant that exists was used for localization
    imaging rather than as an activity control - the screen's catalytic controls were ARHGAP11A,
    ARHGAP40, ARHGAP4, FAM13A and SYDE2.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Every assertion that ARHGAP23 is a GAP currently rests on cellular assays in which the
    protein's own catalysis was never isolated from its scaffolding and localization roles. A
    catalytically dead mutant that still localizes correctly is the standard way to separate the
    two, and for this protein the field believes it has one when it does not. The discrepancy
    also means a curator reading the supplementary table would record the wrong residue.
  resolution: >-
    An in-vitro GAP assay on the isolated Rho-GAP domain against RhoA, Rac1 and Cdc42 with R942
    mutated as the negative control, and a side-by-side comparison of R942K and R986K in the
    cellular biosensor assay to establish which position the activity depends on.
  provenance:
  - reference_id: file:human/ARHGAP23/ARHGAP23-bioinformatics/RESULTS.md
    supporting_text: It is **not** the residue UniProt annotates as the arginine finger, which is 942.
  - reference_id: file:human/ARHGAP23/ARHGAP23-bioinformatics/RESULTS.md
    supporting_text: So of 2 known GAP-dead controls, the residue test calls 1 of them `retained`.
- gap_statement: >-
    No ligand is known for ARHGAP23's PDZ domain, and the domain has never been assayed. It was
    one of ten PDZ domains that could not be amplified for the human PDZome resource, so it is
    absent from the one systematic experimental survey of human PDZ binding.
  boundary: >-
    The domain is real and is the defining feature of the ARHGAP21/ARHGAP23 architecture;
    UniProt places it at residues 71-155. The only published ARHGAP23 PDZ-ligand claim, a PTEN
    C-terminal peptide, comes from docking with no experimental validation.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Every characterized ARHGAP23 interaction is with a junctional or polarity scaffold -
    plakophilin 4, Prickle1, VE-cadherin, alpha-catenin - which is exactly the class of partner
    a PDZ domain would be expected to engage. If the PDZ domain is the targeting module, it
    explains how one enzyme is directed to several different membrane addresses; if it is not,
    something else is doing that work and has not been identified.
  provenance:
  - reference_id: PMID:23722234
    supporting_text: Note that the PDZ domains of AHNAK2, ARHGAP23, LIMK1, SHANK3, SHROOM2,
      SHROOM3, SIPA1, SNTB2, SYNPO2L, and TJP1-PDZ1 are missing from the resource as a result of
      unsuccessful amplification.
suggested_questions:
- question: >-
    GO:0005100 "Rho GTPase activator activity" is obsolete and merged into GO:0005096, whose
    narrow synonyms now include the Rho, Rac, Ras, Rab, Ran, Ral, Rap, ARF and Sar GAP
    activities, and which has no is_a children. Was the intention that substrate specificity
    move to the process branch, where GO:0035024 and GO:0035021 still exist? If so, the
    convention is not discoverable from the annotations: for ARHGAP23, three GO:0005096 rows
    derived from a RHOA reaction, a RAC1 reaction and a Cdc42-grounded phylogenetic node are
    textually identical, and the specificity is recoverable only by reading the Reactome
    reaction names.
  experts: []
- question: >-
    Should the InterPro2GO mapping from IPR000198 (RhoGAP domain) emit GO:0007165 signal
    transduction? A GAP terminates Rho signalling rather than transducing it, and GO:0035024 is
    not a descendant of GO:0007165, so the mapping places every RhoGAP-domain protein on the
    participant branch rather than the regulator branch. This affects the whole family, not just
    ARHGAP23.
  experts: []
- question: >-
    Is ARHGAP23's Rac1-directed activity cell-type dependent? Two cellular biosensor studies
    report it (PMID:28114311 in CHO.K1 and neurons, PMID:32203420 in the family-wide screen),
    but PMID:27226243 measured Rac1 in MDA-MB-231 cells in the same experiment that showed RhoA
    elevation on ARHGAP21/23 knockdown and found active Rac1 decreased rather than increased. Is
    the decrease an indirect consequence of Rho-Rac antagonism, or does ARHGAP23 act only on
    RhoA in that cell type?
  experts: []
- question: >-
    Which domain targets ARHGAP23 to its several membrane addresses? The protein is recruited to
    the lateral cortex by Prickle1, is found in complex with plakophilin 4, is enriched at focal
    adhesions, and binds VE-cadherin, yet its PDZ domain has never been assayed - it failed
    amplification for the human PDZome. Plakophilin 4 has a PDZ-binding motif, which makes the
    PDZ domain the obvious candidate, but that has not been tested.
  experts: []
- question: >-
    What PMID:28114311 measures for ARHGAP23 is focal adhesion *maturation* - knockdown gives
    nascent adhesions, overexpression gives enlarged ones - but the nearest GO term is
    GO:0051893 regulation of focal adhesion *assembly*, whose only neighbours are the signed
    forms and GO:0048041. Is maturation intended to fall under assembly, or is this the same
    expressivity gap as the missing substrate-specific GAP activity terms, one branch over? The
    annotation proposed here uses GO:0051893 because it is the closest available, not because
    the fit is exact.
  experts: []
- question: >-
    Does anything distinguish ARHGAP23 from ARHGAP21 functionally beyond expression pattern?
    They share the PDZ-PH-RhoGAP architecture, are treated as a redundant pair in the Prickle1
    work, and are annotated from the same PANTHER node. The one clean discrimination in the
    literature points the other way from the usual assumption: plakophilin 4 co-purifies
    ARHGAP23 but not ARHGAP21, and the ARHGAP21 experimental grounding is a Cdc42 GAP activity
    that ARHGAP23's own screen scores negative.
  experts: []
suggested_experiments:
- description: >-
    Purify the isolated ARHGAP23 Rho-GAP domain (residues 905-1097) and measure single-turnover
    GTP hydrolysis against RhoA, Rac1 and Cdc42, with the R942A or R942K mutant as the negative
    control and a purified ARHGAP1 domain as the positive control. This is the assay the field
    has never done for this protein - the systematic in-vitro survey of the family omitted it -
    and it would simultaneously establish the intrinsic substrate preference and whether R942 is
    the catalytic residue.
- description: >-
    Express R942K and R986K side by side in the cellular FRET biosensor assay used in
    PMID:32203420, reading out RhoA and Rac1. This directly resolves the discrepancy between the
    residue the literature treats as ARHGAP23's arginine finger and the one UniProt and the
    transition-state structure identify, and it is a small addition to an assay that already
    works for this protein.
- description: >-
    Delete or mutate the PDZ domain (residues 71-155) and ask which of ARHGAP23's localizations
    survive: the Prickle1-dependent lateral cortex, the plakophilin-4-associated pool, and the
    focal-adhesion pool. Since the domain could not be amplified for the human PDZome, a
    domain-swap with the ARHGAP21 PDZ domain would be an informative parallel arm - it would
    test whether the one documented difference between the paralogs, plakophilin 4 binding, is
    PDZ-encoded.
- description: >-
    Repeat the RhoA and Rac1 pulldowns of PMID:27226243 in MDA-MB-231 cells with ARHGAP23
    silenced alone rather than together with ARHGAP21, and in parallel in a cell type where the
    Rac1 result was positive. The published experiments knock the two paralogs down together, so
    the conflicting Rac1 result cannot currently be attributed to either protein.
- description: >-
    Generate an Arhgap23 knockout mouse or, more cheaply, a conditional lymphatic-endothelial
    knockout, given that Arhgap23 is a FOXC1/FOXC2 target reduced in lymphatic-endothelial
    Foxc1;Foxc2 double knockouts. No loss-of-function organismal phenotype exists for this gene
    in any species, which is why every process statement in this review rests on cell culture.
