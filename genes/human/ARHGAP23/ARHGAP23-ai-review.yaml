          The signature genuinely identifies a RhoGAP domain in ARHGAP23; the defect is in the
          term the mapping emits, which casts a negative regulator of a pathway as a participant
          in it. This is a property of the InterPro2GO mapping and applies to every protein
          carrying this signature, not to ARHGAP23 specifically.
    supported_by:
    - reference_id: PMID:27226243
      supporting_text: Moreover, overexpressing Arhgap23 in MDA/shPk1 cells suppressed the elevation
        of active RhoA to a similar level as treatment with the active RhoA inhibitor, C3 transferase
        (Supplementary Fig. 3d).
    - reference_id: PMID:28114311
      supporting_text: A Rac FRET biosensor [39] confirmed that shRNA against ARHGAP23 increased
        Rac1 activity to levels indistinguishable from constitutively active Raichu Rac V12 (Fig 5D
