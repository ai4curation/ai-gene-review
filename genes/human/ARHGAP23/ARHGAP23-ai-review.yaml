- id: PMID:19199708
  title: Proteomic analysis of human parotid gland exosomes by multidimensional protein
    identification technology (MudPIT).
  findings:
  - statement: >-
      A bulk MudPIT inventory of human parotid-gland exosomes. ARHGAP23 is one identification in
      a large catalogue; the study reports no enrichment, no functional follow-up and no
      secretion mechanism for it.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for what it is - a mass-spectrometry inventory. It supports detection in
      an exosome preparation, not residence in a compartment where the protein does anything.
- id: Reactome:R-HSA-8981637
  title: RHOA GAPs stimulate RHOA GTPase activity
  findings:
  - statement: >-
      A set-level reaction whose catalyst is the defined entity "GTPase activator activity of
      RHOA GAPs", so every member receives GO:0005096 and GO:0005829 by TAS. Unlike the
      analogous case for ARHGAP11B in this batch, ARHGAP23's membership is explicitly sourced in
      Reactome's own summary text, which lists it with a citation.
    supporting_text: ARHGAP23 (Müller et al. 2020)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The reaction is sound and the set membership is justified: the cited source is the
      RhoGEF/RhoGAP FRET specificity screen, which scores ARHGAP23 significantly active on RhoA.
      Marked MEDIUM rather than HIGH because the GO term the reaction emits cannot carry the
      RHOA specificity that is the whole content of the reaction.
- id: Reactome:R-HSA-9012999
  title: RHO GTPase cycle
  findings:
  - statement: >-
      A pathway-membership projection: every participant in the RHO GTPase cycle receives
      GO:0051056 by TAS. It says that ARHGAP23 belongs to the cycle, not what it does in it.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, and true of this gene. Its weakness is granularity, not accuracy - the
      direct evidence supports a specific negative-regulation term that this projection cannot
      reach.
- id: Reactome:R-HSA-9013144
  title: RAC1 GAPs stimulate RAC1 GTPase activity
  findings:
  - statement: >-
      The RAC1 counterpart of R-HSA-8981637, with the same set-level catalyst construction.
      Reactome's summary sources ARHGAP23's membership to two publications, the earlier of which
      is the Rac FRET biosensor study PMID:28114311 (Martin-Vilchez et al. 2017).
    supporting_text: 'ARHGAP23 (Martin Vilchez et al. 2017; Müller'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Sound and sourced, but the underlying Rac1 evidence is less consistent than the RhoA
      evidence. PMID:28114311 and PMID:32203420 both report Rac1 activity, while PMID:27226243
      found active Rac1 decreased rather than increased on ARHGAP21/23 knockdown. Recorded here
      because the GO row that results is indistinguishable from the RhoA one.
- id: PMID:27226243
  title: A lateral signalling pathway coordinates shape volatility during cell migration.
  findings:
  - statement: >-
      Establishes ARHGAP23 as a RhoA suppressor held at the non-protrusive lateral cortex by the
      planar cell polarity protein Prickle1. Knockdown of Prickle1 or of ARHGAP21/23 raises
      GTP-bound RhoA; overexpressing ARHGAP23 reverses the elevation in Prickle1-knockdown
      cells, to the same degree as the RhoA inhibitor C3 transferase.
    supporting_text: Moreover, overexpressing Arhgap23 in MDA/shPk1 cells suppressed the elevation
      of active RhoA to a similar level as treatment with the active RhoA inhibitor, C3 transferase
      (Supplementary Fig. 3d).
  - statement: >-
      Also the clearest evidence against a simple Rac1-GAP reading: in the same experiment, and
      the same cells, ARHGAP21/23 knockdown decreased rather than increased active Rac1.
    supporting_text: Following siRNA-mediated knockdown of either Pk1 or Arhgap21/23, the level of
      GTP-bound, active RhoA was significantly enhanced (Fig. 4a), and active Rac1 was either
      unchanged or decreased, respectively
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title-verified against the cached full text; in NCBI's curated gene2pubmed set for GeneID
      57636. The single most informative paper for this gene, and the automated provider missed
      it because the title names a phenotype rather than the gene. Loss and gain of function are
      both reported, with a pharmacological comparator.
- id: PMID:28114311
  title: RhoGTPase Regulators Orchestrate Distinct Stages of Synaptic Development.
  findings:
  - statement: >-
      Direct cellular evidence for Rac1-directed GAP activity, by Rac FRET biosensor: shRNA
      against ARHGAP23 raised Rac1 activity to the level of a constitutively active Rac probe.
      The same study shows ARHGAP23 knockdown yields nascent adhesions and its overexpression
      increased adhesion maturation, and in rat hippocampal neurons two independent shRNAs
      produced immature, filopodial spines.
    supporting_text: A Rac FRET biosensor [39] confirmed that shRNA against ARHGAP23 increased Rac1
      activity to levels indistinguishable from constitutively active Raichu Rac V12 (Fig 5D and
      5E), demonstrating that ARHGAP23 functions as a novel Rac1 GAP in adhesion maturation of
      migratory CHO.K1 cells as well as synapse maturation in neurons.
  - statement: >-
      Overexpression phenotype at focal adhesions, the reciprocal of the knockdown result.
    supporting_text: Conversely, cells expressing GFP-tagged ARHGAP23 exhibited increased adhesion
      maturation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title-verified against the cached full text. The title names the family, not the gene,
      which is why the automated provider missed it. This is the source Reactome cites for
      ARHGAP23's membership in the RAC1 GAP set (as "Martin Vilchez et al. 2017").
- id: PMID:32203420
  title: Systems analysis of RhoGEF and RhoGAP regulatory proteins reveals spatially organized
    RAC1 signalling from integrin adhesions.
  findings:
  - statement: >-
      A cellular FRET-biosensor screen over the human RhoGEF/RhoGAP family. In the Fig. 1b Source
      Data, ARHGAP23 scores significantly on RhoA (normalised delta-R/R0 -0.364, p = 2.9e-05) and
      on Rac1 (-0.372, p = 2.9e-06) and not on Cdc42 (+0.197, no p-value, flag 0), and
      Supplementary Table 2 records the resulting call as the dual RhoA+Rac1 class. The same
      table's literature columns list nothing under "in vitro". These numbers are parsed from the
      publisher's open Source Data by the committed script, not transcribed.
  - statement: >-
      Its Supplementary Table 4 describes the ARHGAP23 TIRF construct as a GAP-deficient arginine
      finger mutant, and the supplementary figure names it ARHGAP23-R986K. Position 986 is a real
      arginine in the canonical sequence, and the screened cDNA (NP_001186346.1, 1491 aa) is the
      same length as Q9P227, so the numbering is comparable - but 986 is not the arginine finger.
      It aligns to ARHGAP1 R323, which sits in the 1TX4 interface but does not contact the
      transition-state ligands, whereas the annotated finger ARHGAP1 R282 (equivalent to ARHGAP23
      R942) does. The mutant was used for localization only; the proteins whose arginine-finger
      mutants validated the activity screen were ARHGAP11A, ARHGAP40, ARHGAP4, FAM13A and SYDE2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title verified. Main text is paywalled and absent from PMC, so no quote from it is used
      here; every claim attributed to this paper comes from the publisher's open Supplementary
      Information and Source Data, which the committed analysis downloads and parses. The
      residue-numbering discrepancy above is recorded as a discrepancy, not as a correction of
      the paper - the structural argument favours R942 but only an experiment settles it.
- id: PMID:38970683
  title: Plakophilin 4 controls the spatio-temporal activity of RhoA at adherens junctions to
    promote cortical actin ring formation and tissue tension.
  findings:
  - statement: >-
      ARHGAP23 co-purifies with plakophilin 4 from keratinocytes while its close paralog ARHGAP21
      does not, which is the cleanest published discrimination between the two proteins.
    supporting_text: ARHGAP21 did not co-purify with PKP4. In contrast, the GAPs ARHGAP23, ARHGAP24,
      and RACGAP1 co-precipitated.
  - statement: >-
      Functional consequence: in PKP4-knockout keratinocytes ARHGAP23 depletion abolishes stress
      fibres, placing an active cytoplasmic ARHGAP23 pool upstream of cortical RhoA suppression.
    supporting_text: In PKP4-KO cells, ARHGAP23 depletion correlated with a loss of stress fibers,
      suggesting that ARHGAP23 is active in the PKP4-KO cell cytoplasm to reduce cortical RhoA
      activity and suppress cortical ring formation.
  - statement: >-
      Localization: overexpressed ARHGAP23 is found at the cell cortex, independently of the
      Prickle1-dependent lateral cortex result in PMID:27226243.
    supporting_text: overexpressed ARHGAP23 partially localized at the cell cortex where it could
      inactivate RhoA to prevent cortical actin ring formation and led to increased stress fibers
      in WT cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title-verified against the cached full text. One of the three papers the automated provider
      did return, and it is genuinely central. Note that the paper's own framing of why ARHGAP23
      was tested is a family-level guess ("ARHGAP23 is similar to ARHGAP21"); the result then
      separated the two proteins rather than confirming the analogy.
- id: PMID:42006337
  title: VE-cadherin interaction proteomics identifies ARVCF as stabilizer of endothelial adherens
    junctions.
  findings:
  - statement: >-
      ARHGAP23 is one of four proteins identified as core VE-cadherin interactors in endothelial
      cells. The paper's co-immunoprecipitation and co-localization follow-up was performed on
      ARVCF, not on ARHGAP23, so this is an interaction result and not a localization result for
      this gene.
    supporting_text: The core VE-cadherin interactome includes known catenin proteins as well as
      ARVCF, ARHGAP23, KEAP1, and NGLY1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Title-verified against the cached full text. Supports a junctional association in a second
      cell type (endothelium) alongside the keratinocyte data, but carries no functional or
      localization experiment specific to ARHGAP23, so it is not used to support any annotation
      here on its own.
- id: PMID:15254754
  title: Identification and characterization of human ARHGAP23 gene in silico.
  findings:
  - statement: >-
      The original in-silico identification of the gene and its PDZ-PH-RhoGAP domain
      architecture, and the source of UniProt's tissue-specificity statement. It contains no
      functional assay.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, which is sufficient for what it is cited for here (gene
      structure and domain architecture). Contributes no evidence about activity.
- id: PMID:15793564
  title: Golgi-localized GAP for Cdc42 functions downstream of ARF1 to control Arp2/3 complex and
    F-actin dynamics.
  findings:
  - statement: >-
      The experimental grounding of the PANTHER node from which ARHGAP23's IBA descends: this is
      the paper behind ARHGAP21's own enables GO:0005096 IDA. Its measured substrate is Cdc42 at
      the Golgi, which is not the substrate profile later measured for ARHGAP23.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited only to trace what the IBA node rests on; not used to support any substrate claim
      for ARHGAP23. Cached record is abstract-only. The evidence code was checked against
      genes/human/ARHGAP21/ARHGAP21-goa.tsv, which carries "enables GO:0005096 IDA PMID:15793564".
- id: PMID:27481945
  title: 'Deciphering the Molecular and Functional Basis of RHOGAP Family Proteins: A SYSTEMATIC
    APPROACH TOWARD SELECTIVE INACTIVATION OF RHO FAMILY PROTEINS.'
  findings:
  - statement: >-
      The systematic in-vitro kinetic study of the human RHOGAP family. It is cited here for a
      negative: ARHGAP23 is not among the representatives it purified and assayed, which is why
      this review states that no purified-protein GAP assay exists for this gene.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Title verified, so the identifier resolves to the intended paper; UNVERIFIED refers to the
      claim, not the citation. The cached record is abstract-only, so the non-selection of
      ARHGAP23 could not be confirmed from the cache and rests on an external full-text check. What is
      independently verifiable, and what the negative claim actually leans on, is that the Müller
      2020 supplementary table of RhoGEF/RhoGAP specificities leaves its "in vitro" literature
      columns empty for ARHGAP23 while filling the "in vivo" and "reference" columns.
      That substitute is no longer a manual reading either: analyze_arhgap23.py parses
      Supplementary Table 2, reads the column groups from the header rows rather than assuming
      them, and aborts if the "in vitro" block cannot be found - so an absent column can never be
      reported as an empty one, which is the way this particular negative could go wrong.
- id: PMID:23722234
  title: 'The human PDZome: a gateway to PSD95-Disc large-zonula occludens (PDZ)-mediated
    functions.'
  findings:
  - statement: >-
      ARHGAP23's PDZ domain could not be amplified and is absent from the human PDZome resource,
      so no experimental PDZ-ligand profile exists for this protein.
    supporting_text: Note that the PDZ domains of AHNAK2, ARHGAP23, LIMK1, SHANK3, SHROOM2,
      SHROOM3, SIPA1, SNTB2, SYNPO2L, and TJP1-PDZ1 are missing from the resource as a result of
      unsuccessful amplification.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Title-verified against the cached full text. Cited to delimit a knowledge gap rather than
      to support an annotation.
- id: PMID:33446330
  title: Replication and meta-analyses nominate numerous eosinophilic esophagitis risk genes.
  findings:
  - statement: >-
      ARHGAP23 is the named gene at the 17q12 eosinophilic-esophagitis risk locus. A
      genotype-phenotype association with no functional follow-up on the protein.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Background only. Deliberately not used to support any GO annotation: a GWAS locus assigns a
      gene to a region, not a function to a protein.
- id: PMID:32510325
  title: Shear stimulation of FOXC1 and FOXC2 differentially regulates cytoskeletal activity
    during lymphatic valve maturation.
  findings:
  - statement: >-
      The only in-vivo genetic handle on the gene: Arhgap23 transcript is reduced in
      lymphatic-endothelial Foxc1;Foxc2 double-knockout mouse embryos, and FOXC1/FOXC2 bind
      conserved regions of the locus. This is upstream transcriptional regulation of the gene,
      not evidence about the protein's activity.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited for context only - it is the nearest thing to an in-vivo phenotype in the literature,
      and even that is indirect. No annotation here depends on it.
- id: PMID:38022849
  title: Pan‑cancer analysis identified ARHGAP23 as a potential biomarker for pancreatic
    adenocarcinoma.
  findings:
  - statement: >-
      A database-mining expression analysis. It performs no experiment on the protein, and its
      opening functional premise inverts the direction of GAP action.
  reference_review:
    relevance: NONE
    correctness: LOW_QUALITY
    review_notes: >-
      Listed so that its absence from the evidence base is deliberate rather than accidental: it
      is one of only two papers with ARHGAP23 in the title, so an automated pass is likely to
      weight it heavily. It states that ARHGAP23 is known to activate RHO-GTPase, which is the
      opposite of what a GTPase-activating protein does, and it contains no primary data.
- id: file:human/ARHGAP23/ARHGAP23-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARHGAP23 (human)
  findings:
  - statement: >-
      The machine-fetched Affinage record. Its trust gates passed (accession Q9P227, human,
      self-evaluation "win"), and its mechanistic narrative is accurate: it identifies ARHGAP23
      as a cytoplasmic RhoA suppressor regulated by PKP4 at junctions, and its own grounding
      lists cytosol and plasma membrane as the localizations.
    supporting_text: ARHGAP23 is a multidomain RhoGAP-family protein that functions as a
      cytoplasmic suppressor of RhoA activity at cell-cell junctions
  - statement: >-
      Its coverage, however, is three citations, and its closing claim is false. Three papers
      that directly measure ARHGAP23 GAP activity - PMID:27226243, PMID:28114311 and
      PMID:32203420 - are absent from it, and none of the three names the gene in its title.
      This is recorded because passing trust gates certifies that the citations returned are
      real, not that the decisive ones were found.
    supporting_text: the enzymatic GAP activity and domain functions of ARHGAP23 have not been
      experimentally characterized in the available corpus
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Cited both for what it got right and for what it missed. Every citation it returned
      resolves and is correctly used, so nothing here is a citation error; the defect is
      coverage, and the resulting explicit assertion that no experimental characterization
      exists is contradicted by three papers found by an independent search of Europe PMC and
      NCBI gene2pubmed. Flagged LOW_QUALITY rather than MISCITED for that reason.
- id: file:human/ARHGAP23/ARHGAP23-bioinformatics/RESULTS.md
  title: ARHGAP23 retains the RhoGAP arginine finger — and that is not evidence of activity
  findings:
  - statement: >-
      Reciprocal arginine-finger test: ARHGAP1's structurally resolved finger (R282, PDB 1TX4)
      maps onto ARHGAP23 R942, which is ARHGAP23's own annotated Site, and ARHGAP23 R942 maps
      back onto ARHGAP1 R282. The same holds against ARHGAP21 R1184.
    supporting_text: '| RHG01_HUMAN (Q07960, resolved in 1TX4) | 282R | 942 | **R** | yes | yes | **yes** |'
  - statement: >-
      Calibration on controls run through the identical code path: of two proteins known to be
      GAP-dead, the residue test calls one retained. Retention is therefore not evidence of
      activity, while loss would have been evidence against it.
    supporting_text: So of 2 known GAP-dead controls, the residue test calls 1 of them `retained`.
  - statement: >-
      At the 25 GAP:GTPase interface positions computed from 1TX4, ARHGAP23 carries the same
      residue as the experimentally active paralog ARHGAP21 at 22 of them.
    supporting_text: At the 25 interface positions mapped in both, ARHGAP23 and RHG21_HUMAN carry
      the **same residue at 22**
  - statement: >-
      Percent interface conservation does not discriminate active from dead in this control set -
      the GAP-dead ARHGAP11B scores above the experimentally active ARHGAP21 - so it is reported
      as context and not used as an argument.
    supporting_text: '**This metric does not order the subjects by activity.**'
  - statement: >-
      The published ARHGAP23-R986K "arginine finger mutant" does not target the annotated
      arginine finger, and the position it does target does not contact the transition state.
    supporting_text: It is **not** the residue UniProt annotates as the arginine finger, which is 942.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Committed, reproducible analysis in genes/human/ARHGAP23/ARHGAP23-bioinformatics. Every
      number is emitted by analyze_arhgap23.py from fetched UniProt records, PDB 1TX4 and the
      publisher's supplementary files; the script carries a --self-test and a separate committed
      mutation_test.py that breaks each guard and asserts the self-test catches it, with a
      silent negative control.
existing_annotations:
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008592632
  - UniProtKB:Q5T5U3
  review:
    summary: >-
      The core molecular function, and a well-founded IBA. The node's named donor is ARHGAP21,
      which carries its own experimental GO:0005096 IDA, and ARHGAP23 has since acquired direct
      cellular evidence of its own, so the phylogenetic inference and the target-specific data
      agree.
    action: ACCEPT
    reason: >-
      Three things had to hold for this to be more than a domain-presence guess, and all three
      do. First, the donor is real: genes/human/ARHGAP21/ARHGAP21-goa.tsv carries "enables
      GO:0005096 IDA PMID:15793564", so the node was placed on experimental descendant evidence
      rather than on similarity. Second, the catalytic machinery is intact in the target - the
      committed analysis maps ARHGAP1's structurally resolved arginine finger (R282, PDB 1TX4)
      onto ARHGAP23 R942 reciprocally, and finds ARHGAP23 identical to the active paralog at 22
      of the 25 positions that contact RhoA or the transition state in that structure. Third,
      and decisively, ARHGAP23 no longer needs the inference: three independent cellular studies
      measure GAP activity directly.

      The residue argument is deliberately not overstated. Retention of the arginine is not
      evidence of activity - one of the two known GAP-dead controls in the same analysis passes
      the same test, and ARHGAP11B, reviewed earlier in this batch, keeps its arginine while two
      IDA rows record that it has no activity. The residue result removes an objection; it does
      not make the case. The case is made by the experiments.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN008592632
        source_label: PANTHER ancestral node for the ARHGAP21/ARHGAP23 PDZ-PH-RhoGAP clade
        source_status: SUPPORTS_TRANSFER
        comment: >-
          ARHGAP21 receives its own IBA from this same node, which is the expected pattern for a
          node seeded by that gene's experimental annotation rather than a sign of circularity.
      - source_id: UniProtKB:Q5T5U3
        source_label: human ARHGAP21, the closest paralog and the node's experimental grounding
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Carries enables GO:0005096 by IDA from PMID:15793564. Its measured substrate there is
          Cdc42, which is not ARHGAP23's measured profile - but GO:0005096 asserts no substrate,
          so the transfer of this term is unaffected. The substrate divergence is recorded as a
          knowledge gap rather than as a propagation failure.
      residue_claims:
      - claim_type: RETAINED
        anchor:
          accession: UniProtKB:Q07960
          position: 282
          residue: R
          sequence_version: 1
        target:
          accession: UniProtKB:Q9P227
          position: 942
          residue: R
          sequence_version: 2
        role: arginine finger; stabilizes the GTP hydrolysis transition state
        method: STRUCTURE
        comment: >-
          Anchor position is ARHGAP1's own UniProt-annotated arginine finger, resolved in PDB
          1TX4 (p50RhoGAP:RhoA:GDP:AlF4). The correspondence was established by aligning the two
          Rho-GAP domains and was required to hold in both directions, and the target position is
          ARHGAP23's own annotated Site. Recorded as RETAINED, with the explicit caveat in
          review.reason that retention is not evidence of activity in this family.
    supported_by:
    - reference_id: file:human/ARHGAP23/ARHGAP23-bioinformatics/RESULTS.md
      supporting_text: '| RHG01_HUMAN (Q07960, resolved in 1TX4) | 282R | 942 | **R** | yes | yes | **yes** |'
    - reference_id: PMID:27226243
      supporting_text: Moreover, overexpressing Arhgap23 in MDA/shPk1 cells suppressed the elevation
        of active RhoA to a similar level as treatment with the active RhoA inhibitor, C3 transferase
        (Supplementary Fig. 3d).
    - reference_id: PMID:28114311
      supporting_text: A Rac FRET biosensor [39] confirmed that shRNA against ARHGAP23 increased
        Rac1 activity to levels indistinguishable from constitutively active Raichu Rac V12 (Fig 5D
        and 5E), demonstrating that ARHGAP23 functions as a novel Rac1 GAP in adhesion maturation
        of migratory CHO.K1 cells as well as synapse maturation in neurons.
