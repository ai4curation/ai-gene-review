- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      The InterPro2GO mapping from the RhoGAP domain signature IPR000198. It is not merely vague
      - it is on the wrong branch. A GAP does not transduce a signal; it terminates one, which
      makes it a regulator of signal transduction rather than a participant in it.
    action: MODIFY
    reason: >-
      This is a genuine branch difference rather than a granularity complaint, and that was
      checked rather than assumed: GO:0035024 and GO:0035021 are both descendants of GO:0051056
      regulation of small GTPase mediated signal transduction and neither is a descendant of
      GO:0007165, confirmed against api.geneontology.org and OLS4. So the replacement is not a
      specialization of the existing term; it moves the assertion from "participates in signal
      transduction" to "negatively regulates Rho/Rac signal transduction", which is what the
      evidence supports.

      The direction is not inferred from the domain. PMID:27226243 shows that removing ARHGAP23
      raises GTP-bound RhoA and that adding it back lowers RhoA to the level achieved by the
      inhibitor C3 transferase; PMID:28114311 shows that removing it raises Rac1 to
      constitutively-active levels. Both replacement terms are proposed because both substrates
      have direct cellular evidence, with the caveat recorded elsewhere in this review that the
      Rac1 evidence is less consistent across cell types than the RhoA evidence. A curator who
      wanted to be maximally conservative could take GO:0035024 alone.
