- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:19199708
  qualifier: located_in
  review:
    summary: >-
      A single identification in a bulk MudPIT inventory of human parotid-gland exosomes.
      Nothing about ARHGAP23's biology predicts or requires an extracellular location, and no
      study has followed the observation up.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not removed, because the detection is a real measurement and the annotation honestly
      carries the HDA code that says so. Marked over-annotated because "located_in extracellular
      exosome" reads as a statement about where the protein resides and functions, which this
      evidence does not support. ARHGAP23 has no signal peptide and no transmembrane segment in
      its UniProt record, is a 1491-residue protein whose every characterized pool is on the
      inner face of a membrane or in the cytoplasm, and the study reports no enrichment, no
      orthogonal validation and no secretion route for it.

      The generic caution about large mass-spectrometry inventories applies with particular
      force to a protein that is Tdark in Pharos and has no orthogonal localization data outside
      the handful of papers reviewed here. Retaining it as over-annotated keeps the observation
      visible to anyone who later finds a reason for it, without letting it stand alongside the
      experimentally grounded localizations proposed below.
- term:
    id: GO:0005938
    label: cell cortex
  evidence_type: IDA
  original_reference_id: PMID:27226243
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation. ARHGAP23 is localized to the cell cortex, specifically the
      non-protrusive lateral cortex flanking active lamellipodia, and its presence there
      requires the planar cell polarity protein Prickle1.
    action: NEW
    reason: >-
      This is the localization the gene's mechanism actually depends on, and it is missing from
      the record entirely - GOA currently offers only cytosol, twice, from a Reactome
      compartment label. Two independent studies in different cell types support it. In
      MDA-MB-231 cells ARHGAP23 is at the lateral cortex and disappears from the periphery when
      Prickle1 is knocked down, which is a positional dependency rather than a static image. In
      keratinocytes overexpressed ARHGAP23 is at the cell cortex, where the authors interpret it
      as inactivating RhoA to prevent cortical ring formation.

      GO:0005938 rather than a plasma-membrane term because what is observed is the region just
      beneath the membrane, and because the functional claim is about a cortical actomyosin
      network rather than about membrane insertion - the protein has no transmembrane segment.
      The Prickle1 dependence is recorded in the reason rather than as a separate term because
      GO's localization terms cannot express what recruits a protein.
