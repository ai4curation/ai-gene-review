  review:
    summary: >-
      A well-founded IBA, and the only annotation on this gene with substantial evidence
      behind it. The WITH/FROM field cites MGI:MGI:1913523, which is mouse Aamdc itself, and
      that gene carries both IDA and IMP annotations to this same term from PMID:22279136.
      Reading the source shows the evidence is bidirectional: overexpression of the mouse
      protein was sufficient to drive 3T3-L1 preadipocyte differentiation in the absence of
      insulin, acting through CREB phosphorylation and transcriptional activity, while siRNA
      knockdown caused preadipocyte apoptosis during adipogenesis. This is precisely the
      situation IBA exists for - a solid ortholog phenotype transferred to a human gene that
      has no experimental data of its own - and it is why UniProt's human FUNCTION line is
      an ECO:0000250 by-similarity statement about adipogenesis. Accept as the core
      biological process.
