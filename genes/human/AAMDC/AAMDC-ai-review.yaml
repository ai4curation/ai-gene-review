        RabGAP1L, and that AAMDC, RabGAP1L, and Rab7a colocalize in endolysosomes.
core_functions:
- description: >-
    Promotion of adipocyte differentiation. This is the best-evidenced role of the protein,
    established for the mouse ortholog by bidirectional perturbation: overexpression is
    sufficient to drive preadipocyte differentiation without insulin, raising CREB
    phosphorylation and transcriptional activity and inducing adipogenic regulators and
    mature adipocyte markers, while knockdown causes caspase-3-dependent preadipocyte
    apoptosis. The human protein is inferred to share this role by orthology (IBA) and has
    no experimental adipogenesis data of its own. No molecular function is assigned, because
    none is known - the biochemical activity of this Mth938-domain protein remains
    undetermined.
  directly_involved_in:
