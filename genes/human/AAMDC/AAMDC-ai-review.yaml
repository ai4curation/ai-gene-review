  - statement: >-
      Overexpression of the mouse AAMDC ortholog (LOC66273 isoform 2, "LI2") was sufficient
      to drive 3T3-L1 preadipocyte differentiation without insulin, acting through CREB
      phosphorylation and transcriptional activity.
    supporting_text: >-
      Our results indicated that LI2 was sufficient to drive preadipocyte differentiation
      via modulating the phosphorylation level and transcriptional activity of CREB,
      coincident with expression of several adipogenic regulators and mature adipocyte
      markers, without insulin treatment.
  - statement: >-
      Knockdown of the protein caused preadipocyte apoptosis via caspase-3 activation during
      adipogenesis, giving loss-of-function support alongside the gain-of-function result.
    supporting_text: >-
      knockdown of the LI2 protein resulted in preadipocyte apoptosis via caspase-3
      activation during adipogenesis
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation. Not cited by GOA for the human gene, but it is
      the source of the mouse Aamdc IDA and IMP annotations to GO:0045600 from which the human
      IBA derives, so it was read directly to check whether that IBA is well founded. It is:
      the evidence is bidirectional (overexpression sufficient, knockdown deleterious).
      Abstract-only cache, but both claims used are explicit in the abstract.
- id: PMID:33772001
  title: The oncogene AAMDC links PI3K-AKT-mTOR signaling with metabolic reprograming
    in estrogen receptor-positive breast cancer.
  findings:
  - statement: >-
      Ectopic AAMDC expression alone is sufficient to activate AKT signalling and to support
      estrogen-independent tumour growth, establishing a causal rather than correlative role
      in PI3K-AKT-mTOR activation.
    supporting_text: >-
      Ectopic AAMDC expression is sufficient to activate AKT signaling, resulting in
      estrogen-independent tumor growth.
  - statement: >-
      AAMDC controls PI3K-AKT-mTOR signalling, the translation of ATF4 and MYC, and the
      transcriptional activity of AAMDC-dependent promoters.
    supporting_text: >-
      We show that AAMDC controls PI3K-AKT-mTOR signaling, regulating the translation of
      ATF4 and MYC and modulating the transcriptional activity of AAMDC-dependent promoters.
  - statement: >-
      AAMDC regulates expression of metabolic enzymes of the one-carbon folate and methionine
      cycles and of lipid metabolism.
    supporting_text: >-
      We uncover that AAMDC regulates the expression of several metabolic enzymes involved
      in the one-carbon folate and methionine cycles, and lipid metabolism.
  - statement: >-
      AAMDC interacts with the Rab GTPase-activating protein RABGAP1L, and AAMDC, RABGAP1L
      and RAB7A colocalise in endolysosomes.
    supporting_text: >-
      we provide evidence that AAMDC can interact with the RabGTPase-activating protein
      RabGAP1L, and that AAMDC, RabGAP1L, and Rab7a colocalize in endolysosomes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text matches the cited title. The only substantial human functional study of
      AAMDC and the source of both proposed new annotations. Note the authors' own hedging on
      the RABGAP1L interaction ("can interact", "we provide evidence"), which is why the
      endolysosome annotation is proposed as non-core with the colocalisation caveat stated.
- id: PMID:36789094
  title: Solanine Represses Gastric Cancer Growth by Mediating Autophagy Through
    AAMDC/MYC/ATF4/Sesn2 Signaling Pathway.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation. Recorded deliberately without deriving an
      annotation from it. It is the second human functional study of AAMDC and does corroborate
      the MYC/ATF4 axis outside breast cancer, placing AAMDC upstream of MYC, ATF4 and Sesn2 in
      gastric cancer cells. It is set aside because the experimental frame is the pharmacology
      of solanine rather than AAMDC itself - AAMDC enters as a rescue arm, where its
      overexpression reverses solanine's effect on autophagy - and the affinage report that
      surfaced it grades the finding Low confidence. An autophagy-related process annotation
      would need a study designed around AAMDC.
- id: file:human/AAMDC/AAMDC-bioinformatics/RESULTS.md
  title: Is a molecular function assignable to AAMDC from its family?
  findings:
  - statement: >-
      Family-wide analysis of Pfam PF04430 (DUF498) run for this review: of 13 reviewed
      Swiss-Prot members, none carries an experimentally supported molecular function term or a
      UniProt CATALYTIC ACTIVITY block, and four carry an explicit GO:0003674 ND. The absence of
      a molecular function for AAMDC is a property of the whole family rather than an oversight
      on this gene.
    supporting_text: >-
      No member of this family carries any experimentally supported molecular
      function term.
  - statement: >-
      The one characterised branch of the family is NDUFAF3, an assembly factor for
      mitochondrial complex I in every organism studied - a non-catalytic protein that binds
      subunits and helps build a complex. The family signal therefore points away from a hidden
      enzymatic activity and toward an assembly or chaperone-like role.
    supporting_text: >-
      NDUFAF3 is an **assembly factor, not an
      enzyme**: it has no catalytic activity, it binds subunits and helps build a complex,
      and it is not part of the finished complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible analysis written for this review (analyze_mth938.py), re-runnable, with every
      figure fetched at run time from the InterPro, UniProt and QuickGO REST APIs. Added in
      response to PR review feedback asking that the central negative finding - that no
      molecular function is justifiable - be tested rather than merely asserted. The result
      substantiates it and goes further, indicating where to look instead. A first version of
      the script claimed to query InterPro but only interpolated a hardcoded accession; that was
      corrected after review, and the report now records InterPro's own entry name and protein
      count. Failed API calls are distinguished from genuinely empty results in both the script
      and the report, since a silent fetch failure would otherwise manufacture the negative
      finding this analysis exists to test.
- id: file:human/AAMDC/AAMDC-deep-research-affinage.md
  title: Affinage mechanistic annotation for AAMDC (human)
  findings:
  - statement: >-
      Machine-fetched Affinage record (trust gates passed) describing AAMDC as an oncogenic
      PI3K-AKT-mTOR regulator amplified in ER-positive breast cancer that interacts with
      RABGAP1L and colocalises with RAB7A at endolysosomes, and explicitly noting that the
      biochemical activity of AAMDC itself has not been characterised.
    supporting_text: >-
      Beyond these findings, the biochemical activity of AAMDC itself and the structural
      basis of its signaling and RabGAP1L interaction have not been characterized in the
      available corpus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      External precomputed LLM research, treated as a preliminary source; every claim used was
      re-verified against PMID:33772001. Two things are worth recording. First, its
      mechanism_profile reports molecular_activity as none, which is the correct answer for
      this protein and a useful negative signal - the provider did not invent a function.
      Second, it covers only the human cancer literature and does not mention the mouse
      adipogenesis work that underpins the gene's name and its single best-supported GO
      annotation, so the IBA assessment had to be done outside the report.
