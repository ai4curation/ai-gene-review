- description: >-
    Activation of PI3K-AKT-mTOR signalling in human cells. AAMDC is an oncogene in the
    11q13.5-14.1 amplicon that defines the IntClust2 subgroup of estrogen receptor-positive
    breast cancer, where ectopic expression alone is sufficient to activate AKT and to
    support estrogen-independent tumour growth. Downstream it controls translation of ATF4
    and MYC and the expression of one-carbon folate, methionine and lipid metabolic enzymes,
    and it has been reported to assemble with RABGAP1L and RAB7A at endolysosomes. As with
    adipogenesis, the mechanism by which AAMDC produces these effects is unknown, so no
