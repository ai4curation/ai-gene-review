- term:
    id: GO:0036019
    label: endolysosome
  evidence_type: IDA
  original_reference_id: PMID:33772001
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation, offered with an explicit caveat. AAMDC was reported to
      interact with the Rab GTPase-activating protein RABGAP1L, and AAMDC, RABGAP1L and
      RAB7A were shown to colocalise in endolysosomes. RAB7A is a canonical late
      endosome/lysosome marker, so the compartment assignment is coherent. However the
      evidence is imaging colocalisation from a single study, and the authors themselves
      hedge ("we provide evidence that AAMDC can interact"). Colocalisation is weaker than
      co-residence in a complex, so this is proposed as a secondary, non-core location that
      does not displace the well-supported cytoplasmic annotation.
    action: NEW
    reason: >-
      Records a specific, mechanistically interesting compartment that GOA lacks entirely,
      while flagging that it rests on single-study colocalisation rather than fractionation
      or a defined complex. "Non-core" here means secondary to the cytoplasmic annotation,
      not excluded: the term is retained in core_functions.locations for the PI3K-AKT-mTOR
      function alongside GO:0005737, because it is the only compartment reported for the
      RABGAP1L/RAB7A association that function describes. Note also that GO:0036019
      endolysosome is a specific hybrid intermediate compartment; light-microscopy
      colocalisation with RAB7A cannot by itself distinguish it from late endosome
      (GO:0005770) or lysosome (GO:0005764), so the exact compartment term should be treated
      as provisional pending fractionation or marker-resolved imaging.
    supported_by:
    - reference_id: PMID:33772001
      supporting_text: >-
        we provide evidence that AAMDC can interact with the RabGTPase-activating protein
        RabGAP1L, and that AAMDC, RabGAP1L, and Rab7a colocalize in endolysosomes.
core_functions:
- description: >-
    Promotion of adipocyte differentiation. This is the best-evidenced role of the protein,
    established for the mouse ortholog by bidirectional perturbation: overexpression is
    sufficient to drive preadipocyte differentiation without insulin, raising CREB
    phosphorylation and transcriptional activity and inducing adipogenic regulators and
    mature adipocyte markers, while knockdown causes caspase-3-dependent preadipocyte
    apoptosis. The human protein is inferred to share this role by orthology (IBA) and has
    no experimental adipogenesis data of its own. No molecular function is assigned, because
    none is known - the biochemical activity of this Mth938-domain protein remains
    undetermined.
