id: Q9H7C9
gene_symbol: AAMDC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AAMDC is a small cytoplasmic Mth938-domain protein whose biochemical activity is
  still unknown; it is the founding member of the AAMDC family and, despite having
  a solved structure, has no assigned catalytic or binding activity. Its name comes
  from work on the mouse ortholog, where the protein is highly expressed in white
  adipose tissue and is both sufficient and required for preadipocyte
  differentiation: overexpression drives 3T3-L1 differentiation without insulin, by
  raising CREB phosphorylation and transcriptional activity, while knockdown causes
  caspase-3-dependent preadipocyte apoptosis. In human cells AAMDC is best known as
  an oncogene within the 11q13.5-14.1 amplicon that defines the IntClust2 subgroup
  of estrogen receptor-positive breast cancer. There it drives PI3K-AKT-mTOR
  signalling - ectopic expression alone is enough to activate AKT and to support
  estrogen-independent tumour growth - and through that axis controls the
  translation of ATF4 and MYC and the expression of enzymes of the one-carbon
  folate, methionine and lipid metabolic pathways. AAMDC has also been reported to
  interact with the Rab GTPase-activating protein RABGAP1L and to colocalise with
  RABGAP1L and RAB7A at endolysosomes. All of the described effects are downstream
  cellular consequences; what AAMDC does biochemically to produce them remains the
  central open question about this protein.
