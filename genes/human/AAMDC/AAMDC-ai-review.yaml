suggested_questions:
- question: >-
    What does AAMDC actually do biochemically? This is the central gap. AAMDC has no
    molecular function annotation of any kind, mouse Aamdc carries an explicit GO:0003674
    molecular_function ND (no data), and the affinage mechanism profile reports no molecular
    activity either. The protein has a solved structure and a defined Mth938 domain, yet
    every described effect - adipogenesis, AKT activation, ATF4/MYC translation - is a
    downstream cellular consequence rather than an activity.
- question: >-
    Do the Mth938 domain and its bacterial and archaeal homologues suggest a conserved
    activity that could be tested directly? A structure-guided comparison with characterised
    Mth938-fold proteins might propose a candidate biochemical function where cell-biological
    approaches have not.
- question: >-
    Is the AAMDC-RABGAP1L interaction direct and stoichiometric, and does AAMDC regulate
    RABGAP1L's GAP activity toward RAB7A? If so, AAMDC would acquire a genuine molecular
    function and a mechanistic link between its endolysosomal localisation and its effect on
    mTOR signalling, which is itself regulated at the lysosome.
- question: >-
    Are the adipogenesis role in mouse and the PI3K-AKT-mTOR role in human cancer cells the
    same underlying activity in two contexts, or genuinely different functions? AKT
    signalling is central to adipogenesis, so a single mechanism is plausible and would
    consolidate two currently disconnected literatures.
- question: >-
    Does human AAMDC promote adipocyte differentiation? The GO:0045600 annotation is entirely
    IBA from mouse. Direct testing in human preadipocytes would convert this gene's
    best-supported annotation into experimental evidence, or reveal a species difference.
suggested_experiments:
- hypothesis: >-
    AAMDC modulates RABGAP1L GAP activity toward RAB7A, coupling it to lysosomal mTORC1
    signalling.
  description: >-
    Reconstitute purified AAMDC, RABGAP1L and RAB7A in vitro and measure RAB7A GTP hydrolysis
    with and without AAMDC, then test in cells whether AAMDC depletion changes the RAB7A-GTP
    load and mTORC1 recruitment to lysosomes.
  experiment_type: in vitro reconstitution and cell biology
- hypothesis: >-
    The Mth938 domain has a conserved biochemical activity detectable by unbiased screening.
  description: >-
    Screen purified recombinant AAMDC against broad metabolite, nucleotide and metal panels by
    thermal shift and native mass spectrometry to identify any bound ligand or cofactor,
    combined with structure-based comparison to characterised Mth938-fold proteins. Aimed
    squarely at the missing molecular function.
  experiment_type: biophysics and structural bioinformatics
- hypothesis: >-
    AAMDC's adipogenic and oncogenic roles are the same activity in different contexts.
  description: >-
    Compare the transcriptional and phosphoproteomic response to AAMDC gain and loss of
    function in 3T3-L1 preadipocytes and in IntClust2 breast cancer lines, testing in
    particular whether the adipogenic effect requires AKT and whether the oncogenic effect
    requires CREB.
  experiment_type: comparative functional genomics
- hypothesis: >-
    The five neurodegeneration-panel interactions are aggregation artefacts, not biology.
  description: >-
    Re-test the AAMDC interactions with APP, HTT, ATXN3, DNM2 and GDAP1 by
    co-immunoprecipitation at endogenous expression levels, and check whether AAMDC scores as
    a promiscuous partner across unrelated aggregation-prone baits. A negative result would
    justify removing these annotations outright rather than only flagging them.
  experiment_type: interaction validation
