  review:
    summary: Positive GRB14 binding is established; attribution of the tested CNGA1 construct to the human
      target remains unresolved.
    action: UNDECIDED
    reason: Exact MINT records map P29973 to bovine GRB14/Q5ICW4 in positive physical assays. The original
      main text and supplement establish GRB14 association, but do not explicitly identify the CNGA1 plasmid
      species. The full-length forward and reverse primers agree with bovine CNGA1 terminal sequences
      rather than either inspected human RefSeq version; a separate CTR-primer discrepancy prevents treating
      primers as whole-plasmid sequencing. Human NP_000078.2 is 690 residues, so length alone is not diagnostic.
      The interaction is not rejected, and neither a wrong-gene conclusion nor a verified direct human
      pair is asserted. UNDECIDED concerns that source-to-target attribution, not the genericity of protein
      binding; the documented interaction is neither negated nor removed.
    supported_by:
    - reference_id: PMID:20890309
