id: P29973
gene_symbol: CNGA1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNGA1 is the pore-forming alpha subunit of the rod photoreceptor cyclic-nucleotide-gated
  cation channel. Three CNGA1 subunits assemble with one CNGB1 subunit in the native channel at the rod
  outer-segment plasma membrane. Intracellular cGMP binding promotes pore opening and cation influx; the
  light-driven fall in cGMP closes the channel and reduces the rod dark current. CNGA1 can also form functional
  homomeric channels in expression systems. Human pathogenic variants can impair channel abundance, targeting
  or function and cause recessive retinitis pigmentosa.
