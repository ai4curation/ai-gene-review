core_functions:
- description: CNGA1 contributes the cGMP-binding and pore-forming machinery of the rod CNGA1/CNGB1 channel,
    coupling intracellular ligand recognition to cation conduction. The physiological assembly has three
    alpha subunits and one beta subunit; experimentally expressed CNGA1 homotetramers also conduct. Human
    structural preparations use defined N-terminal truncations with full-length functional comparisons,
    and direct calcium-permeability support additionally comes from bovine recombinant channels. cAMP
    binding and partial activation remain secondary capabilities within this single channel mechanism.
  contributes_to_molecular_function:
