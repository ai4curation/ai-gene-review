suggested_experiments:
- hypothesis: Human CNGA1 retains the GRB14 contact reported for the original channel preparations.
  description: Sequence-verify human and bovine full-length CNGA1 and the corresponding C-terminal fragments,
    then compare matched GRB14 binding and cGMP-dependent currents with expression and localization controls.
    Keep isolated-domain binding distinct from native retinal regulation.
  experiment_type: Construct-resolved interaction and electrophysiology
- hypothesis: Disease variants can affect surface abundance independently of single-channel gating.
  description: Compare surface-normalized currents, ligand concentration responses and single-channel
    behavior for sequence-verified human variants in both homomeric and 3:1 CNGA1/CNGB1 preparations.
  experiment_type: Surface quantification and patch-clamp analysis
