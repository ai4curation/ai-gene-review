  review:
    summary: Han et al. showed that Hedgehog signalling activates Gli2 through phosphorylation on sites conserved
      with the Fused sites on Ci, carried out by the two Fu-family kinases ULK3 and mFu/STK36. The annotation was
      made on the human gene by FlyBase curators from a paper that does the Drosophila and the mammalian experiments
      side by side.
    action: ACCEPT
    reason: Core. This is the paper that established Fu-family phosphorylation of Ci/GLI as the conserved activation
      mechanism, working out the fly sites (Ser218 and Ser1230 on Ci, primed for CK1) and then showing the same
      logic operates on Gli2 through ULK3 and STK36. Accepting a molecular function from an IMP is appropriate here
      because the kinase requirement is read out as loss of a specific phosphorylation event on a named substrate,
      and the same activity is independently confirmed in vitro on purified protein (PMID:38096226).
    additional_reference_ids:
    - PMID:38096226
    supported_by:
    - reference_id: PMID:31279575
      supporting_text: Here, we demonstrate that Hh stimulates the phosphorylation of Ci by the Ser/Thr kinase Fused
        (Fu) and that Fu-mediated phosphorylation of Ci promotes its activation.
    - reference_id: PMID:31279575
