- term:
    id: GO:0001222
    label: transcription corepressor binding
  evidence_type: IDA
  original_reference_id: PMID:10806483
  qualifier: enables
  review:
    summary: The STK36-SUFU interaction, reported by Murone et al. and annotated using a term that names SUFU as
      a transcription corepressor. The interaction is well replicated - IntAct records three experiments, and an
      independent in situ proximity ligation assay detected it on endogenous protein in HeLa cells (PMID:25241761).
    action: KEEP_AS_NON_CORE
    reason: 'Retained because the binding event is real and the term at least says something specific about the
      partner, but not promoted to core, for two reasons. First, STK36 does not act on SUFU: its catalytic target
      is GLI, and the effect on SUFU is indirect - phosphorylation of Ci/GLI alters its affinity for SUFU rather
      than STK36 modifying SUFU itself (PMID:31279575). Second, the premise that SUFU is a transcription corepressor
      rests on TAS-only rows in SUFU''s own GOA record, and the review of SUFU in this repository keeps its corepressor
      activity as a non-core annotation. Making the STK36 side core would place more weight on that premise than
      the evidence behind it supports. The cached record for PMID:10806483 holds citation metadata only, with no
      abstract text, so the paper itself could not be read. It was adjudicated instead against the structured UniProt
      annotations that cite it with experimental evidence codes, and against later experimental rows that reach
      the same conclusion.'
