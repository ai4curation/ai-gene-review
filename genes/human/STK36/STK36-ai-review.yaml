  review:
    summary: STK36-DMWD interaction reported by a systematic yeast two-hybrid screen of about 500 neurodegeneration-related
      proteins, which generated roughly 30,000 candidate interactions across some 5,000 proteins (PMID:32814053).
      No functional follow-up connects DMWD to STK36.
    action: REMOVE
    reason: Removal is not a claim that the two-hybrid result is false, and IntAct records three experiments for
      the pair. It is a statement that the row carries no functional information and that nothing supports a more
      informative molecular function. DMWD has no established role in Hedgehog signalling, in motile or primary
      ciliogenesis, or as a kinase substrate of STK36, so neither an adaptor term nor a kinase-activity term can
      be justified from this evidence, and inventing one would be exactly the error the protein-binding policy warns
      against. The five rows this screen contributed to STK36 all fall the same way.
