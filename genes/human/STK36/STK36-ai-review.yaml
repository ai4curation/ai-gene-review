  review:
    summary: 'Direct demonstration of serine/threonine kinase activity: immunopurified STK36 phosphorylates GST-Gli2N
      in vitro, and a second in vitro assay shows it phosphorylates a ULK4 peptide spanning Thr1021. Activation-loop
      autophosphorylation on Thr158/Ser159 was used as the readout of activation, with the kinase-dead form as control
      (PMID:38096226).'
