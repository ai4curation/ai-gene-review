suggested_questions:
- question: UniProt records, from the original Murone paper, that GLI2 requires a function of STK36 that does not
    need an active catalytic site. What is that non-catalytic activity? If it is a scaffolding or adaptor role it
    would deserve a molecular function of its own, but no mechanism has been proposed in twenty-five years and the
    claim currently rests on a kinase-dead rescue in overexpression.
  experts: []
- question: Do STK36 and ULK3 phosphorylate GLI2 in the same cells, or does each dominate in a particular tissue?
    Epistasis places them in parallel pathways, and the difference decides whether the absence of a Hedgehog phenotype
    in Stk36-null mice reflects true redundancy or a division of labour that the assayed tissues happened not to
    reveal.
  experts: []
- question: Is the central-pair function of STK36 catalytic? The PCD alleles are loss-of-function rather than kinase-dead
    point mutants, and no axonemal substrate has been identified, so it remains open whether STK36 phosphorylates
    a central-pair component or contributes structurally through its interactions with KIF27 and SPAG16.
  experts: []
- question: STK36 partners with a Costal-2-family kinesin in both of its roles - KIF7 in the ciliary tip GLI complex
    and KIF27 in central-pair construction. Is that a conserved ancestral Fused-kinesin module that the two vertebrate
    paralogue pairs inherited and specialised, or convergence? A reconstruction across the PTHR22983 and PTHR24115
    trees would answer it.
  experts: []
- question: Human STK36 has two isoforms differing by a 21-residue deletion (VSP_051983, residues 838-858) in the
    uncharacterised C-terminal region, and isoform 2 was cloned from brain. No GOA row for STK36 is isoform-qualified.
    Do the isoforms differ in ULK4 binding, ciliary targeting, or between motile and primary cilia?
  experts: []
suggested_experiments:
- hypothesis: The Hedgehog and motile-ciliogenesis functions of STK36 are genetically separable, and only the former
    requires catalytic activity.
  description: 'Generate knock-in mice and human airway-epithelial lines carrying the kinase-dead (Lys33 or activation-loop
    Ala) STK36 allele alongside the null, and score both functions in parallel: Gli2 Ser230/232 phosphorylation
    and Ptch1/Gli1 induction for the Hedgehog arm, and transmission electron microscopy of the central pair plus
    ciliary beat analysis for the motile arm. If the kinase-dead allele reproduces the null ciliary phenotype, the
    axonemal role is catalytic and a substrate should be sought; if it rescues ciliary structure while failing in
    Hedgehog signalling, STK36 contributes structurally to the central pair and the two functions are cleanly separable.'
  experiment_type: kinase-dead knock-in with paired signalling and ultrastructural readouts
- hypothesis: The axonemal role of STK36 involves phosphorylation of a central-pair or radial-spoke component.
  description: Perform quantitative phosphoproteomics on isolated axonemes from wild-type and STK36-null multiciliated
    cultures, differentiated in air-liquid interface so that central-pair assembly occurs in situ, and restrict
    the analysis to the known central-pair and radial-spoke proteome. Validate the strongest STK36-dependent sites
    by in vitro kinase assay with immunopurified STK36, and test phospho-null substitutions for the central-pair
    defect. A named substrate would convert the current IMP-based axoneme-assembly annotation into a mechanistic
    one.
  experiment_type: axoneme-restricted quantitative phosphoproteomics with in vitro validation
- hypothesis: STK36 and ULK3 are redundant rather than tissue-specialised in vertebrate Hedgehog signalling.
  description: Build single and compound conditional alleles of Stk36 and Ulk3 in mouse and compare Hedgehog-dependent
    patterning across several tissues - neural tube, limb bud, growth plate - quantifying Gli2 Ser230/232 phosphorylation
    and target-gene output in each. Redundancy predicts that neither single mutant is affected anywhere while the
    double mutant phenocopies loss of GLI activation; specialisation predicts tissue-restricted single-mutant phenotypes.
    The result determines whether the smoothened-pathway annotations for STK36 should carry a tissue qualifier.
  experiment_type: compound conditional mouse genetics with quantitative pathway readouts
