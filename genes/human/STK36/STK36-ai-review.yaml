  review:
    summary: 'Smoothened signaling pathway from PAINT node PTN001122621. The donor set is exactly the one that makes
      this node interpretable: Drosophila fu (FB:FBgn0001079), mouse Stk36 (MGI:MGI:1920831), human STK36 itself
      and a zebrafish gene - the Fused-family clade, with experimental evidence in protostome and deuterostome members.'
    action: ACCEPT
    reason: 'The node placement is sound and the target is squarely inside the clade that inherited the function:
      human STK36 and Drosophila fu share PANTHER subfamily PTHR22983:SF6, which is direct classification support
      for the orthology rather than a pathway analogy. Human STK36 appearing in its own WITH/FROM list is expected
      here, not circular - it has its own experimental annotations for this term, which are among the descendant
      evidences a PAINT curator would have used, and the IBA then adds the claim that the role is inherited rather
      than lineage-specific. One apparent conflict has to be addressed before accepting any Hedgehog annotation
      for STK36: mouse knockouts respond normally to Hedgehog. Merchant et al. found normal neural-tube cell-fate
      specification and unaffected target-gene induction, and Wilson et al. state flatly that mouse Fu mutants seem
      to respond normally to Hh signalling. The resolution is paralogue redundancy, and it is now demonstrated rather
      than assumed: two Fu-family kinases phosphorylate Gli2 in mammals, and knocking down ULK3 and ULK4 together
      reduces Gli2 phosphorylation further while knocking down STK36 and ULK4 together does not, placing STK36 and
      ULK4 in one pathway and ULK3 in parallel (PMID:38096226). A single knockout of one of two redundant kinases
      is expected to be phenotypically silent, so the mouse result is not evidence against the activity. Two further
      observations confirm the activity is retained in mammals: mouse Fu rescues the Hedgehog-dependent defects
      of zebrafish fu mutants, where the requirement is not redundant (PMID:19305393), and mouse Fu knockdown severely
      impaired Hedgehog signalling in a cell line (PMID:18600476).'
