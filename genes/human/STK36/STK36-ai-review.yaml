id: Q9NRP7
gene_symbol: STK36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'STK36 (Fused homolog) is a 1315-residue serine/threonine protein kinase (EC 2.7.11.1) and the vertebrate
  orthologue of Drosophila Fused, with which it shares PANTHER subfamily PTHR22983:SF6. Its N-terminal kinase domain
  is activated by trans-autophosphorylation of the activation loop on Thr158 and Ser159 in response to Hedgehog
  stimulation, and is followed by a long C-terminal region of unknown structure. STK36 has two distinct roles. In
  Hedgehog signalling it is one of two vertebrate Fused-family kinases, with ULK3, that convert the latent GLI transcription
  factors into their activator form: at the tip of the primary cilium, in a complex with the pseudokinase ULK4 that
  bridges kinase to substrate, STK36 phosphorylates GLI2 on Ser230 and Ser232 - sites conserved with the Fused sites
  on Cubitus interruptus - which weakens the GLI-SUFU interaction and permits GLI nuclear entry and target-gene
  transcription. STK36 also phosphorylates ULK4 itself on Thr1021 and Thr1023, and the two proteins depend on each
  other to accumulate at the ciliary tip. Independently of Hedgehog signalling, STK36 is required to build the central
  pair apparatus of motile 9+2 cilia, where it sits between the radial spokes and the central pair and works with
  the kinesin KIF27 and central-pair structural proteins. Because ULK3 can substitute for it in Hedgehog signalling,
  mouse knockouts develop normally and respond normally to Hedgehog, but die postnatally of progressive hydrocephalus
  from defective ependymal ciliary beating and disrupted cerebrospinal fluid flow. In humans, biallelic loss of
  function causes primary ciliary dyskinesia 46, with a central-pair axonemal defect, disordered ciliary orientation
  and no situs abnormality. STK36 is cytoplasmic and axonemal, with a low-level nuclear pool, and is expressed most
  highly in adult testis germ cells and in respiratory epithelium.'
