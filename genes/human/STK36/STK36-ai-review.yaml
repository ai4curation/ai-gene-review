core_functions:
- description: Fused-family serine/threonine kinase activity that converts GLI into its activator form at the ciliary
    tip. On Hedgehog stimulation STK36 autophosphorylates its activation loop on Thr158 and Ser159 and accumulates
    at the tip of the primary cilium together with the pseudokinase ULK4 and GLI2, where it phosphorylates GLI2
    on Ser230 and Ser232 - the sites corresponding to the Fused sites on Drosophila Ci. The phosphorylation weakens
    the GLI-SUFU interaction and licenses GLI nuclear entry and target-gene transcription. STK36 also phosphorylates
    ULK4 on Thr1021/Thr1023, which is what recruits ULK4 to the tip, so the two proteins are mutually dependent
    for the localisation this step requires. ULK3 performs the same phosphorylation in parallel, which is why mouse
    knockouts of STK36 alone show no Hedgehog phenotype while the biochemical activity is fully conserved from Drosophila
    Fused.
