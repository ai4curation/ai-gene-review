  review:
    summary: Post-embryonic development transferred automatically from mouse Stk36 through Ensembl Compara. The
      mouse annotation rests on PMID:16055717, where fused knockout mice develop normally and then fail to thrive
      postnatally from progressive hydrocephalus.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Not wrong, but an over-annotation. The mouse evidence behind this term is that knockouts are born in
      normal ratios and develop normally, then fail to thrive within two weeks with communicating hydrocephalus
      and early mortality. That is a whole-organism outcome at the end of a long causal chain: STK36 phosphorylates
      its substrates, which is needed to build the central pair apparatus of motile cilia, which is needed for ependymal
      ciliary beating, which is needed for cerebrospinal fluid circulation, the failure of which causes hydrocephalus
      and hence the failure to thrive. The source paper itself frames the connection as conjecture - "possibly by
      regulating the CSF homeostasis or ciliary function". STK36 does not execute post-embryonic development in
      any sense the term intends, and the specific ciliary terms on this record already capture what it does do.
      The row is marked rather than removed because the genetic dependency is real and the phenotype is the reason
      STK36 was pursued as a disease gene at all.'
    additional_reference_ids:
    - PMID:16055717
    - PMID:37584603
