- description: 'Kinase activity required to construct the central pair apparatus of motile cilia. In motile 9+2
    cilia STK36 is an axonemal protein positioned between the radial spokes and the central pair, interacts with
    the Costal-2-family kinesin KIF27 and with known central-pair structural components, and is the first identified
    regulatory component of central-pair assembly. Loss of STK36 gives motile cilia with a central-pair defect,
    disordered orientation and reduced number, which in humans causes primary ciliary dyskinesia without laterality
    defects and in mouse causes progressive postnatal hydrocephalus through failure of ependymal ciliary beating
    and cerebrospinal fluid circulation. This function is separable from Hedgehog signalling: primary cilia and
    Hedgehog responses are intact in the same mutants.'
