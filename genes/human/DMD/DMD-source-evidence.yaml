gene: DMD
uniprot: P11532
scope: Public source and assay guide for the reviewed annotations. Source dictionaries remain as imported;
  stronger independent evidence is explicitly distinguished from the original annotation source.
policy:
  url: https://github.com/ai4curation/ai-gene-review/blob/da7850aa314a89131f63dbfec98d7e4d983fba54/projects/CLINGEN_MENDELIAN.md#curation-instructions
  application: Supported generic interactions are retained as non-core when a more informative class or
    mechanism is not established. Partner identity alone is not used to manufacture a physiological function.
core_scope:
  mechanism: Long dystrophin anchors cortical cytoskeletal networks to the membrane DGC and organizes
    associated proteins. Binding partners are integrated into this role rather than given one core per
    partner.
  product_limit: Seventeen official sequences are distinguished from engineered fragments and historical
    antibody bands; short products do not automatically inherit the long-product actin anchor.
  assembly: Transgenic recruitment and biochemical co-isolation in PMID:9214383 support organization of
    a DGC assembly. RyR/calstabin consequences of dystrophin loss are not relabeled as a direct channel-complex
    assembly assay.
  nos: Positive purified-fragment BLI and syntrophin-dependent physiological recruitment are both retained.
    Uncertainty concerns the native direct contact, not the existence of association.
primary_sources:
- reference_id: PMID:7592992
  url: https://doi.org/10.1074/jbc.270.45.27305
  locator: Methods, recombinant fusion proteins and in-vitro translation; Results, cysteine-rich-region
    truncations
  scope: Human DMD GST fragments expressed in bacteria and rabbit DAG1 tails translated in vitro; native
    rabbit muscle/brain extracts are separate experiments.
- reference_id: PMID:10932245
  url: https://www.rcsb.org/structure/1EG4
  locator: Original fragment-binding Results and structure deposition 1EG4
  scope: Human DMD 3046–3306 and DAG1 881–895 peptide; the fragment complex does not define every contact
    in native DGC.
- reference_id: PMID:10801490
  url: https://www.rcsb.org/structure/1DXX
  locator: Primary deposition, entity sequence and experimental information
  scope: Human 246-residue N-terminal construct, C10S/C188S relative to current canonical sequence; apo
    crystal, no bound actin. Original Methods remained inaccessible.
- reference_id: PMID:9214383
  url: https://pubmed.ncbi.nlm.nih.gov/9214383/
  locator: Methods, DGC purification and immunofluorescence; Results, Δ71–74 dystrophin and syntrophin–dystrobrevin
    complexes; Discussion
  scope: Mouse transgenic recruitment and co-purification support assembly organization; exact stoichiometry
    remains a model, not a purified ternary reconstitution.
- reference_id: PMID:39663457
  url: https://pubmed.ncbi.nlm.nih.gov/39663457/
  locator: Native rabbit DGC Results and cryo-EM Methods; recombinant domain-association experiments
  scope: Rabbit hindlimb DGC and rabbit constructs; modeled domain fitting and unresolved flexible regions
    limit interface claims.
- reference_id: PMID:39663450
  url: https://pubmed.ncbi.nlm.nih.gov/39663450/
  locator: Native mouse DGC Results, cytoplasmic subcomplex and preparation/structure Methods
  scope: Mouse skeletal muscle; dystrobrevin assignment and domain fitting are not assays of each human
    alternative product.
- reference_id: PMID:1454857
  url: https://pubmed.ncbi.nlm.nih.gov/1454857/
  locator: Original pages 11642–11644, fractionation Methods and postsynaptic-density Results/figures
  scope: Rat cortical PSD fractionation and mdx mouse comparisons; no synaptic-vesicle fraction is inferred.
- reference_id: PMID:34575126
  url: https://pubmed.ncbi.nlm.nih.gov/34575126/
  locator: Methods and Results, TOM22 mitochondrial purification, repeat washing, RT-PCR and ATP5A co-immunoprecipitation
  scope: Human mitochondrial pool with controls; historical Dp71b/ab assignments do not establish a specific
    current accession or matrix-facing inner-membrane topology.
- reference_id: PMID:15024025
  url: https://pubmed.ncbi.nlm.nih.gov/15024025/
  locator: Original Methods, Kir2.2-tail constructs and tissue pull-down; Results and Discussion, syntrophin
    PDZ interface
  scope: Rat brain/heart extracts and channel-tail constructs; capture of a DGC is distinct from direct
    DMD–PDZ recognition.
- reference_id: PMID:26378238
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4705953/
  locator: Binding Methods, Figure 2 and BLI Results; mutation/folding controls; SAXS/modeling Results
  scope: 'Purified R16–17 and immobilized nNOS PDZ: equilibrium Kd about 50 micromolar, multiphasic kinetics.
    Atomic contacts are modeled; not every construct species was independently resolved.'
- reference_id: PMID:29790927
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6097012/
  locator: Results/Figures 2–5; Discussion; Methods, Mice, Peptides, Pull-down assays, Immunofluorescence
    and AAV
  scope: Human SLR peptides with mouse homogenates; mdx versus mdx/Snta-null rescue and dCT/Dtna-null
    comparisons. Does not re-test the 2015 BLI assay.
- reference_id: PMID:27225184
  url: https://pubmed.ncbi.nlm.nih.gov/27225184/
  locator: Human atrial localization and reciprocal co-immunoprecipitation Results/Methods
  scope: Native human association, not purified binary affinity or a defined interface.
- reference_id: PMID:20080623
  url: https://pubmed.ncbi.nlm.nih.gov/20080623/
  locator: Results, RyR2 modification, calstabin2 association, calcium release, heart-rate variability
    and S107/NAC treatment
  scope: Mouse mdx cardiac effects are downstream of dystrophin deficiency; unchanged basal heart rate
    is distinguished from reduced variability and arrhythmia.
- reference_id: PMID:19198614
  url: https://pubmed.ncbi.nlm.nih.gov/19198614/
  locator: Results, RyR1/calstabin1 association, calcium leak and channel-directed intervention
  scope: Mouse skeletal-muscle channel destabilization is not an assay of DMD physically assembling the
    RyR–calstabin complex.
- reference_id: PMID:21677768
  url: https://pubmed.ncbi.nlm.nih.gov/21677768/
  locator: Cardiomyocyte sodium/calcium-current Methods and Results; dystrophin/utrophin genotype comparison
  scope: Mouse dystrophin loss reduces sodium-current density; additional utrophin loss and channel-gating
    effects are separated.
- reference_id: PMID:21886794
  url: https://pubmed.ncbi.nlm.nih.gov/21886794/
  locator: Methods, GST-Dp71 and nuclear extracts; Results, proliferation and lamin association
  scope: Human bacterial GST-Dp71 with rat PC12 nuclear extracts; no purified binary lamin interface.
- reference_id: PMID:30280653
  url: https://pubmed.ncbi.nlm.nih.gov/30280653/
  locator: Separately recovered indexed Figure 2 caption only
  scope: Normal full-text flag is true but the cache omits most of the review. The caption supports scaffold
    context; a complete original read is not claimed.
- reference_id: PMID:12895031
  url: https://pubmed.ncbi.nlm.nih.gov/12895031/
  locator: Complete cached abstract
  scope: mdx/MyoD double-mutant fetal diaphragm and pulmonary-hypoplasia context; not a DMD-only pulmonary
    experiment.
- reference_id: PMID:16000376
  url: https://pubmed.ncbi.nlm.nih.gov/16000376/
  locator: Original keratin-binding assays and K8/K19 perturbation Results
  scope: Human DMD N-terminal domain directly binds K19. Expression of a fusion construct does not make
    DMD a peptide-biosynthesis enzyme.
- reference_id: PMID:9356463
  url: https://pubmed.ncbi.nlm.nih.gov/9356463/
  locator: C-terminal binding Results and Figure 4 assembly model
  scope: Targeted DMD–dystrobrevin binding; an assembly model alone is not treated as an assembly experiment.
- reference_id: PMID:21115837
  url: https://pubmed.ncbi.nlm.nih.gov/21115837/
  locator: Dystrophin-related complex isolation and alpha-catulin/PLC beta2 binding Results
  scope: Independent scaffold evidence supports the alpha-catulin partner class; it does not assign PLC
    catalysis to DMD.
- reference_id: PMID:16803572
  url: https://pubmed.ncbi.nlm.nih.gov/16803572/
  locator: Complete cached abstract and separately curated interaction records
  scope: Positive human platelet cytoskeletal associations retained; unavailable original leaves several
    precise pair and filopodium assertions unresolved.
