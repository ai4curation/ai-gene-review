products:
- accession: P11532-1
  name: 1 (Dystrophin-4, Dp427m)
  url: https://www.uniprot.org/uniprotkb/P11532-1
  description: 'Official sequence length: 3685 amino acids. Long dystrophin with the N-terminal actin-binding
    region, spectrin-like rod and C-terminal membrane-complex interfaces. The Dp427 products differ at
    their extreme N termini; the integrated anchoring mechanism is supported without assuming identical
    tissue expression.'
