suggested_questions:
- question: Which receptors, gamma partners and effectors use endogenous GNB4 in human peripheral nerves?
  experts: []
- question: Does beta4 bind and activate PLCB2 directly? COS7 IP3 responses alone do not establish that
    binding-dependent activity.
  experts: []
suggested_experiments:
- description: Compare endogenous GNB4 complexes and receptor responses in human sensory-neuron and Schwann-cell
    models, using isogenic variants and wild-type rescue.
  hypothesis: The affected receptor and effector combinations depend on cell type.
