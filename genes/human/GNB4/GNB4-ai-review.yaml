id: Q9HAV0
gene_symbol: GNB4
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNB4 is a 340-residue WD-repeat beta subunit of heterotrimeric G proteins. Together with
  gamma and alpha subunits, it supports GPCR signaling and effector regulation. GNB4 is present in peripheral-nerve
  axons and Schwann cells. Dominant missense variants can impair signaling and cause Charcot-Marie-Tooth
  neuropathy.
