  review:
    summary: >-
      IDA nuclear localization from a LIFEdb high-throughput GFP-fusion
      localization screen (GO_REF:0000054). Overexpressed fusion-protein screens
      are prone to mislocalization artifacts, and the biologically established
      location of NDUFAF3 is the mitochondrial inner membrane, where it acts as a
      complex I assembly factor. Per policy this experimental annotation is not
      removed. The nuclear pool has no established function and likely reflects the
