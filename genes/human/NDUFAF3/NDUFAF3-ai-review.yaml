- term:
    id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  evidence_type: IMP
  original_reference_id: PMID:19463981
  qualifier: involved_in
  review:
    summary: >-
      Direct experimental (IMP) evidence for the core biological process:
      NDUFAF3 loss-of-function in patients causes isolated complex I deficiency,
      and GFP-complementation demonstrated that NDUFAF3 is required for complex I
      assembly. This is the central, best-supported function of the gene. Accept
      as core.
    action: ACCEPT
    reason: >-
      The strongest evidence in the record: five complex I-deficient patients from three
      families all carried NDUFAF3 mutations, and pathogenicity was established
      prospectively by NDUFAF3-GFP baculovirus complementation of patient fibroblasts, so
      the phenotype is attributable to loss of this protein rather than to linkage. Unlike
      a substrate, NDUFAF3 performs part of the work of the process - it binds and
      stabilizes the nascent IP subcomplex - which is what licenses `involved_in`.
    supported_by:
    - reference_id: PMID:19463981
      supporting_text: >-
        We found that NDUFAF3 is a genuine mitochondrial complex I assembly protein
        that interacts with complex I subunits.
      reference_section_type: ABSTRACT
core_functions:
- description: >-
    NDUFAF3 is an assembly factor required for biogenesis of mitochondrial
    respiratory chain complex I. Acting at the mitochondrial inner membrane, it
    tightly associates with its partner factor NDUFAF4 and with the iron-sulfur
    core subunits NDUFS2 and NDUFS3 to nucleate and stabilize an early membrane-arm
    assembly intermediate. It associates transiently with assembly intermediates
    and is not a subunit of the mature holoenzyme; loss of function causes isolated
    complex I deficiency.
  directly_involved_in:
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:19463981
    supporting_text: >-
      We found that NDUFAF3 is a genuine mitochondrial complex I assembly protein
      that interacts with complex I subunits.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19463981
    supporting_text: >-
      Furthermore, we show that NDUFAF3 tightly interacts with NDUFAF4 (C6ORF66),
      a protein previously implicated in complex I deficiency.
    reference_section_type: ABSTRACT
  - reference_id: file:human/NDUFAF3/NDUFAF3-uniprot.txt
    supporting_text: >-
      Essential factor for the assembly of mitochondrial
      NADH:ubiquinone oxidoreductase complex (complex I).
    reference_section_type: DATABASE_ENTRY
proposed_new_terms: []
suggested_questions:
- question: >-
    What is the precise molecular activity of NDUFAF3 during complex I assembly
    (e.g. scaffolding/bridging of NDUFS2-NDUFS3 with NDUFAF4, membrane insertion
    chaperoning), and could a specific molecular function term beyond generic
    protein binding be defined for it?
  experts:
  - Nijtmans LG
  - Saada A
- question: >-
    NDUFAF3 is homologous to the bacterial SecF/SecD/YajC membrane-insertion gene
    cluster. Does NDUFAF3 retain any insertase or insertase-adaptor activity, i.e. does
    it help thread the mitochondrially encoded ND subunits into the inner membrane, or
    is the homology purely a shared fold with no retained mechanism?
  experts:
  - Huynen MA
  - Nijtmans LG
- question: >-
    UniProt records a nuclear localization for NDUFAF3 by similarity only, and a LIFEdb
    GFP-fusion screen produced an IDA nucleus annotation. Is there any endogenous nuclear
    pool of NDUFAF3 with a function, or should both annotations be treated as artefacts
    of overexpressed tagged constructs?
  experts: []
- question: >-
    The two NDUFAF3 missense variants G77R and R122P and the Leigh-syndrome variant A165V
    give very different clinical severities. Do they differ in which partner interaction
    they disrupt - NDUFAF4 binding versus NDUFS2/NDUFS3 binding - and does that explain
    the phenotypic range from fatal neonatal disease to Leigh syndrome?
  experts:
  - Saada A
- question: >-
    Splice isoform b (Q9BU61-2) lacks residues 1-57, the region that would normally carry
    mitochondrial targeting information, yet it still binds NDUFAF4 in IntAct (NbExp=8) -
    so the 1-57 region is not required for the partner-factor interaction. Is this isoform
    translated in vivo, where does it localize, and does it have any assembly-factor
    activity, or does it bind NDUFAF4 outside the mitochondrion?
  experts: []
suggested_experiments:
- hypothesis: >-
    NDUFAF3 bridges the NDUFAF4 partner factor to the NDUFS2/NDUFS3 iron-sulfur
    core subunits to nucleate the early membrane-arm assembly intermediate.
  description: >-
    Structural and biochemical characterization (e.g. cryo-EM of stalled assembly
    intermediates, crosslinking-MS) of the NDUFAF3-NDUFAF4-NDUFS2-NDUFS3 module,
    combined with structure-guided separation-of-function mutants tested for
    complex I assembly rescue in NDUFAF3-null cells.
  experiment_type: structural and functional interaction analysis
