id: Q9BU61
gene_symbol: NDUFAF3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NDUFAF3 (also known as C3orf60) is a nucleus-encoded, mitochondrially imported
  assembly factor for mitochondrial respiratory chain complex I (NADH:ubiquinone
  oxidoreductase). It is not a structural subunit of the mature holoenzyme and has
  no catalytic activity. NDUFAF3 associates with the mitochondrial inner membrane
  and acts early in complex I biogenesis, tightly interacting with its partner
  factor NDUFAF4 and with the iron-sulfur (IP) core subunits NDUFS2 and NDUFS3 to
  help nucleate and stabilize an early membrane-arm assembly intermediate. Like
  other complex I assembly factors, it associates transiently with assembly
  intermediates and dissociates from the fully assembled complex. Biallelic
  loss-of-function variants in NDUFAF3 cause isolated mitochondrial complex I
  deficiency (nuclear type 18), with phenotypes ranging from fatal neonatal
  mitochondrial disease to Leigh syndrome.
alternative_products:
- name: a
  id: Q9BU61-1
  description: >-
    Canonical 184-residue isoform (sequence displayed in UniProt). This is the form
    characterized in the primary disease/assembly study and the one carrying the
    MC1DN18 variants G77R, R122P and A165V.
- name: b
  id: Q9BU61-2
  sequence_note: VSP_041086
  description: >-
    Splice isoform lacking residues 1-57 (VSP_041086), i.e. the N-terminal region that
    precedes the conserved NDUFAF3 core. The splice event itself is reported only from a
    cDNA (ECO:0000303, PubMed:15489334), and no endogenous expression, localization or
    assembly-factor activity has been demonstrated for the isoform. It does, however,
    retain binding to its partner factor NDUFAF4 despite the missing 1-57 region:
    UniProt records four Q9BU61-2-specific IntAct interactions, with NDUFAF4 at NbExp=8,
    alongside RBCK1, REL and SNRPA. Since the N-terminus of a nucleus-encoded
    mitochondrial protein normally carries its targeting information, isoform b would
    not be expected to reach the inner membrane, but this has not been tested.
