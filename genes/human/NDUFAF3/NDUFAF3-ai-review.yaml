- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory
    Chain Function.
  findings:
  - statement: >-
      Condition-specific protein-protein interactions were assessed for 50 mitochondrial
      proteins of unclear function (MXPs) by affinity-enrichment mass spectrometry,
      connecting them to respiratory chain processes; this is the assay behind the
      NDUFAF3-NDUFAF4 edge from this paper.
    supporting_text: "interactions for 50 select MXPs using affinity enrichment mass spectrometry"
