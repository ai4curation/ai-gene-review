  - statement: >-
      The same approach validated C17orf89 (NDUFAF8) as a complex I assembly factor whose
      disruption markedly reduced CI activity, demonstrating that the map can identify
      genuine CI assembly factors - though it did not do so for NDUFAF3, already known.
    supporting_text: "C17orf89 as a complex I (CI) assembly factor. Disruption of C17orf89 markedly"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mitochondrial affinity-enrichment MS interaction map; contributes an IntAct
      NDUFAF3-NDUFAF4 IPI consistent with the core partnership. Full text cached.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      HuRI is a systematic all-by-all yeast two-hybrid screen of about 90% of the
      protein-coding genome, yielding 52,569 verified binary PPIs among 8,275 proteins;
      this is the source of the many non-mitochondrial NDUFAF3 partners.
    supporting_text: "we refer to HI-III-20 as a reference map of the human binary protein interactome (HuRI)"
    reference_section_type: RESULTS
  - statement: >-
      The authors note that the cellular function of most individual PPIs in the map
      remains to be elucidated, which is why a HuRI-derived 'protein binding' annotation
      conveys no molecular function for NDUFAF3.
    supporting_text: "the cellular function of most individual PPIs remains to be elucidated"
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Binary (HuRI) interactome reference map; source of many high-throughput
      NDUFAF3 interactions, most without mitochondrial context, underlying the
