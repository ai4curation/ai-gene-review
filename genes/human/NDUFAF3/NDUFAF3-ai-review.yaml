- id: PMID:19463981
  title: Mutations in NDUFAF3 (C3ORF60), encoding an NDUFAF4 (C6ORF66)-interacting
    complex I assembly protein, cause fatal neonatal mitochondrial disease.
  findings:
  - statement: >-
      Homozygosity mapping and sequencing in five complex I-deficient patients from three
      unrelated families identified mutations in NDUFAF3 (C3ORF60) in all of them, and
      pathogenicity was confirmed by NDUFAF3-GFP baculovirus complementation of patient
      fibroblasts.
    supporting_text: "patients harbored mutations in the NDUFAF3 (C3ORF60) gene, of which the"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      NDUFAF3 is a genuine mitochondrial complex I assembly protein that interacts with
      complex I subunits - the primary evidence for the core biological process and for
      the assembly-factor (rather than subunit) role.
    supporting_text: "We found that NDUFAF3 is a genuine mitochondrial complex I assembly"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      NDUFAF3 tightly interacts with NDUFAF4 (C6ORF66), a protein already implicated in
      complex I deficiency; UniProt records the interaction set as NDUFAF4, NDUFS2 and
      NDUFS3 from this same study.
    supporting_text: "Furthermore, we show that NDUFAF3 tightly interacts with NDUFAF4 (C6ORF66),"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Gene-conservation analysis links NDUFAF3 to the bacterial membrane-insertion gene
      cluster SecF/SecD/YajC and to C8ORF38, suggesting that several complex I disease
      genes encode proteins that cooperate during assembly.
    supporting_text: "NDUFAF3 to bacterial-membrane-insertion gene cluster SecF/SecD/YajC and to"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary study establishing NDUFAF3 as a genuine mitochondrial complex I
      assembly protein that interacts with complex I subunits and tightly with
      NDUFAF4, localizes to the mitochondrial inner membrane, and whose mutations
      cause complex I deficiency. Supports the core BP, IDA location, and SUBUNIT
      interactions. Abstract-only in cache; claims verified against the abstract
      and the UniProt record.
