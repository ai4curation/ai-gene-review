  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic (IBA) propagation of the core biological process for this gene.
      This is the well-supported, evolutionarily conserved role of NDUFAF3 as a
      complex I assembly factor, directly demonstrated experimentally in human by
      the disease-causing loss-of-function study (PMID:19463981). Accept as core.
    action: ACCEPT
    reason: >-
      The PAINT node placing complex I assembly on this family is supported by direct
      experimental work on the human gene itself: patient loss-of-function mutations
      cause isolated complex I deficiency and NDUFAF3-GFP complementation restored it.
      NDUFAF3 appearing among the descendants that grounded the node is expected, not
      circular. No evidence of lineage-specific loss argues against the placement.
