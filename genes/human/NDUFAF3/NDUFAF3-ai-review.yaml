    reason: >-
      LIFEdb localizes N- or C-terminally GFP-tagged, overexpressed constructs; for a
      nucleus-encoded mitochondrial protein whose targeting information lies at the
      N-terminus, a tag placed there is a well-known source of mislocalization, and
      overexpression saturates import. No nuclear function has ever been reported for
      NDUFAF3, and the only physiological location supported by a directed assay is the
      inner membrane. Per policy an experimental annotation is not removed, so it is kept
      as non-core. No primary publication is attached to this GO_REF, so no literature
      quote is offered.
