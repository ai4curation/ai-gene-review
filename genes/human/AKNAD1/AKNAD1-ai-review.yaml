  review:
    summary: Microtubule, inherited from the PANTHER node at the AKNA/AKNAD1 duplication. It is the only
      functional statement for AKNAD1, which has no experimental data; accepted as a phylogenetic inference.
    action: ACCEPT
    reason: AKNAD1 is the paralog of AKNA [file:genes/human/AKNAD1/AKNAD1-uniprot.txt "Belongs to the
      AKNA family."], sharing the AKNA domain (Pfam PF12443). The PAINT curator placed this term at the
      node ancestral to both paralogs, which spans vertebrates, amphioxus and sea urchin, using mouse
      Akna as the experimental donor. The richer Akna functions - centrosome, delamination, epithelial-to-mesenchymal
      transition - were deliberately placed only on the AKNA-specific subtree. That split is a judgment
      that microtubule association is ancestral to the family while the centrosomal program is AKNA-specific.
      There is no AKNAD1-specific evidence of loss or divergence to argue against it, so the inference
      is accepted. It remains a single inherited location with no activity behind it; see the knowledge
      gap.
    supported_by:
    - reference_id: file:genes/human/AKNAD1/AKNAD1-uniprot.txt
      supporting_text: Belongs to the AKNA family.
    - reference_id: file:genes/human/AKNAD1/AKNAD1-deep-research-affinage.md
      supporting_text: No mechanistic discoveries found in literature.
