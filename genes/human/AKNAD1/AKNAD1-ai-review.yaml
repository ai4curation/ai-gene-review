id: Q5T1N1
gene_symbol: AKNAD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AKNAD1 (AKNA domain-containing protein 1) is an uncharacterized paralog of the centrosomal
  microtubule organizer AKNA. It shares AKNA's conserved AKNA domain and has a central coiled-coil region,
  and is a little over half AKNA's length (836 versus 1439 residues). Its gene is present across vertebrates.
  No experimental study of its molecular function, localization or biological role has been published;
  by inheritance from the family ancestor it is predicted to associate with microtubules.
