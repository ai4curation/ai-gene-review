- id: PMID:20813920
  title: Piezo1 and Piezo2 are essential components of distinct mechanically activated
    cation channels.
  findings:
  - statement: >-
      Mouse Piezo2 is sufficient to drive mechanically activated nonselective cation
      currents in N2A and HEK293T cells and is required for a rapidly adapting MA
      current subset in dorsal-root-ganglion neurons.
    supporting_text: >-
      We found that Piezo1 is required for MA currents in Neuro2A cells and
      Piezo2 is required for a subset of MA currents in DRG neurons.
    reference_section_type: DISCUSSION
- id: PMID:24717433
  title: Piezo2 is required for Merkel-cell mechanotransduction.
  findings:
  - statement: >-
      Mouse Piezo2 is expressed in Merkel cells, and Piezo2 deletion abolishes
      mechanically activated Merkel-cell currents.
    supporting_text: none of Piezo2-deficient Merkel cells (n=13) showed MA currents
    reference_section_type: RESULTS
- id: PMID:25471886
  title: Piezo2 is the major transducer of mechanical forces for touch sensation
    in mice.
  findings:
  - statement: >-
      Mouse Piezo2 localizes to low-threshold mechanoreceptors, and deleting it from
      adult sensory neurons and Merkel cells impairs touch and most rapidly adapting
      DRG mechanically activated currents.
    supporting_text: >-
      mice lacking Piezo2 in both adult sensory neurons and Merkel cells exhibit
      a profound loss of touch sensation
    reference_section_type: ABSTRACT
- id: PMID:26551544
  title: Piezo2 is the principal mechanotransduction channel for proprioception.
  findings:
  - statement: >-
      Mouse Piezo2 is expressed in proprioceptive endings and is required for most
      rapidly adapting currents in proprioceptive neurons and for stretch-evoked
      muscle-afferent activity.
    supporting_text: >-
      Together, our results indicate that Piezo2 is the major mechanotransducer
      of mammalian proprioceptors.
    reference_section_type: ABSTRACT
- id: PMID:28002412
  title: Piezo2 senses airway stretch and mediates lung inflation-induced apnoea.
  findings:
  - statement: >-
      Mouse Piezo2 in sensory neurons mediates airway stretch sensing and respiratory
      reflexes in a specialized mechanosensory context.
    supporting_text: >-
      Piezo2 is an airway stretch sensor and that Piezo2-mediated
      mechanotransduction within various airway-innervating sensory neurons is
      critical for establishing efficient respiration
    reference_section_type: ABSTRACT
- id: PMID:33057202
  title: PIEZO2 in sensory neurons and urothelial cells coordinates urination.
  findings:
  - statement: >-
      PIEZO2-dependent mechanosensation in lower urinary tract sensory neurons and
      urothelial cells coordinates bladder-stretch sensing and urinary reflexes.
    supporting_text: >-
      PIEZO2 in lower urinary tract tissues, where it is required for
      low-threshold bladder-stretch sensing and urethral micturition reflexes
    reference_section_type: ABSTRACT
- id: PMID:38228630
  title: The Piezo channel is a mechano-sensitive complex component in the mammalian
    inner ear hair cell.
  findings:
  - statement: >-
      Mouse Pz2 was reported at hair-cell stereocilia and cuticular plate membranes,
      providing the direct source for the transferred hair-cell location rows.
    supporting_text: >-
      the mouse utilizes Piezo1 (Pz1) and Piezo2 (Pz2) isoforms as MET-complex
      components
    reference_section_type: ABSTRACT
- id: PMID:41349545
  title: Renal PIEZO2 is an essential regulator of renin.
  findings:
  - statement: >-
      Mouse Piezo2 in cells of the renin lineage is required for normal JG-cell
      calcium oscillations and renin regulation, supporting a specialized renal
      baroreceptor context.
    supporting_text: >-
      PIEZO2 is expressed in renin-producing juxtaglomerular granular cells and
      is required for their calcium dynamics in vivo
    reference_section_type: ABSTRACT
