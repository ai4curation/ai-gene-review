suggested_questions:
- question: >-
    Does human PIEZO2 have a conserved mechanosensory role in juxtaglomerular or
    mesangial cells comparable to the mouse renal renin-lineage phenotype?
  experts:
  - renal mechanotransduction experts
- question: >-
    Should the mouse Pz2 hair-cell stereocilium and cuticular-plate pool be
    treated as a pore-forming MET component or as a specialized, still-contested
    localization context?
  experts:
  - inner-ear hair-cell mechanotransduction experts
suggested_experiments:
- description: >-
    Record mechanically activated currents and calcium dynamics from human
    PIEZO2-expressing juxtaglomerular-like or mesangial cells before and after
    PIEZO2 perturbation to test conservation of the mouse renal mechanism.
  hypothesis: >-
    PIEZO2 directly contributes to mechanically gated calcium signals in human
    renal mural cells.
