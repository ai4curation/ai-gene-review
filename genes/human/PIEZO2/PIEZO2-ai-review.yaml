    Force-gated cation influx at the plasma membrane of mechanosensory endings
    and accessory cells, converting indentation or stretch into rapid
    depolarizing Na+, K+ and other cation flux that initiates touch,
    Merkel-cell and proprioceptive mechanotransduction.
