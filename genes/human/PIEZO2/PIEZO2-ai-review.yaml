id: Q9H5I5
gene_symbol: PIEZO2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PIEZO2 is a large multi-pass plasma-membrane cation channel whose pore opens
  rapidly when the surrounding membrane or sensory ending is mechanically
  deformed. It converts indentation and stretch into nonselective cation flux in
  sensory neurons and specialized mechanosensory cells, with major mammalian
  roles in touch, Merkel-cell signaling, proprioception, airway and bladder stretch
  reflexes, and juxtaglomerular calcium dynamics that regulate renin.
