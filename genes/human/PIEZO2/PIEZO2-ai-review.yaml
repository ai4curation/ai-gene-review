    supporting_text: N2A and HEK293T cells transfected with Piezo2 and gene
      encoding GFP showed large MA currents
  - reference_id: PMID:24717433
    supporting_text: none of Piezo2-deficient Merkel cells (n=13) showed MA currents
  - reference_id: PMID:26551544
