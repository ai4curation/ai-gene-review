id: P59990
gene_symbol: KRTAP12-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 12-1 (KAP12.1) is a 96-residue high-sulfur keratin-associated protein of the KAP12 family, encoded within introns of TSPEAR in the chromosome 21q22.3 KAP gene domain. Its expression is restricted to hair root cells, in a narrow region of the hair fibre cuticle about 20 cell layers above the dermal papilla. The cysteine-rich protein is a component of the keratin-associated matrix that is disulfide cross-linked with keratins in the hardened hair cuticle.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:P26371
  review:
    summary: High-throughput binary interaction (IPI, PMID:25416956) of KRTAP12-1 with KRTAP5-9 (UniProtKB:P26371), annotated only as bare protein binding.
    action: REMOVE
    reason: Bare protein binding (GO:0005515) is uninformative and is removed under the project protein-binding policy. This row comes from a high-throughput binary interaction screen (yeast two-hybrid or a related assay). Small cysteine-rich keratin-associated proteins are among the most frequently recovered preys in these screens, and they are recovered with hundreds of unrelated partners that are not expressed in hair-forming trichocytes. Removal does not mean the reported interaction is false. The informative function of this protein is its structural role in the disulfide cross-linked hair keratin matrix, which is captured elsewhere in this review.
    supported_by:
    - &id001
      reference_id: file:human/KRTAP12-1/KRTAP12-1-uniprot.txt
      supporting_text: which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins
