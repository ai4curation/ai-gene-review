  review:
    summary: Aldehyde dehydrogenase (NAD+) activity, inherited from a deep ALDH-superfamily PANTHER node.
      ALDH16A1 has lost the catalytic cysteine and glutamate and the human protein is inactive; removed
      as a pseudoenzyme over-propagation.
    action: REMOVE
    reason: 'ALDH16A1 belongs to the ALDH superfamily [file:genes/human/ALDH16A1/ALDH16A1-uniprot.txt
      "CC   -!- SIMILARITY: Belongs to the aldehyde dehydrogenase family."] but has lost the catalytic
      residues [file:genes/human/ALDH16A1/ALDH16A1-uniprot.txt "CC   -!- CAUTION: The active site cysteine
      and glutamate residues are not"], and the recombinant human protein is inactive [PMID:30529746 "In
      contrast, human ALDH16A1 apparently lacks measurable aldehyde oxidation activity, suggesting that
      it is a pseudoenzyme, consistent with the absence of the catalytic Cys in its sequence."], whereas
      the bacterial ALDH16 that keeps them is a working enzyme [PMID:30529746 "Loktanella ALDH16 is found
      to be a bona fide enzyme, exhibiting NAD+-binding, ALDH activity, and esterase activity."]. An independent
      study confirms the loss [PMID:40897711 "Surprisingly, ALDH16A1 lacks ALDH enzymatic activity, but
      binds to the anti-ferroptotic oxidoreductase thioredoxin (TXN), facilitating its translocation to
      the lysosome and subsequent degradation."]. The PAINT node placement is right for the superfamily,
      and ALDH16A1 sits inside that clade; the objection is target-specific evidence of loss. Catalytic-residue
      loss is shared by the mammalian and fish ALDH16A1 sequences, and direct assay of the human protein
      finds no aldehyde oxidation, so the inherited activity does not hold for this gene.'
    supported_by:
    - reference_id: PMID:30529746
      supporting_text: In contrast, human ALDH16A1 apparently lacks measurable aldehyde oxidation activity,
        suggesting that it is a pseudoenzyme, consistent with the absence of the catalytic Cys in its
        sequence.
    - reference_id: file:genes/human/ALDH16A1/ALDH16A1-uniprot.txt
      supporting_text: 'CC   -!- CAUTION: The active site cysteine and glutamate residues are not'
    - reference_id: PMID:40897711
      supporting_text: Surprisingly, ALDH16A1 lacks ALDH enzymatic activity, but binds to the anti-ferroptotic
        oxidoreductase thioredoxin (TXN), facilitating its translocation to the lysosome and subsequent
        degradation.
    - reference_id: file:genes/human/ALDH16A1/ALDH16A1-deep-research-affinage.md
      supporting_text: ALDH16A1 is a catalytically inactive member of the aldehyde dehydrogenase superfamily
        that operates as a pseudoenzyme scaffold
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      residue_claims_not_applicable: The loss of the catalytic cysteine and glutamate is recorded by UniProt's
