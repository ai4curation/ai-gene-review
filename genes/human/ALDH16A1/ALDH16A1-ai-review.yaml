core_functions: []
knowledge_gaps:
- gap_statement: ALDH16A1 is a pseudoenzyme whose molecular function is not established.
  boundary: Catalytic inactivity is shown directly. The only reported activity is binding and inhibition
    of thioredoxin by active-site occlusion, from a single 2025 study in lung cancer cells; it is not
    yet replicated, and maspardin binding has no known functional consequence. No molecular function is
    therefore annotated.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: ALDH16A1 is a gout-associated locus; knowing what the inactive protein does would explain
    how its variants affect urate handling.
  resolution: Replicate direct TXN binding and inhibition with purified proteins and test whether the
    C-terminal domain or the ALDH fold mediates it; if confirmed, GO:0004857 enzyme inhibitor activity
    would apply.
  provenance:
  - reference_id: PMID:30529746
    supporting_text: In contrast, human ALDH16A1 apparently lacks measurable aldehyde oxidation activity,
      suggesting that it is a pseudoenzyme, consistent with the absence of the catalytic Cys in its sequence.
  - reference_id: PMID:40897711
    supporting_text: Meanwhile, ALDH16A1 directly inhibits TXN's oxidoreductase function by occluding
      its active site.
  - reference_id: PMID:19184135
    supporting_text: Immunoprecipitation of maspardin with identification of coprecipitating proteins
      by mass spectrometry revealed the aldehyde dehydrogenase ALDH16A1 as an interacting protein.
proposed_new_terms: []
suggested_questions:
- question: Does the gout-associated ALDH16A1 variant act through thioredoxin, maspardin or another partner,
    given that the protein has no catalytic activity?
suggested_experiments:
- description: In vitro TXN insulin-reduction assay with purified ALDH16A1, with the bacterial ALDH16
    and a TXN-binding-deficient mutant as controls.
