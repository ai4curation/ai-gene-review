- id: PMID:40897711
  title: Targeting ALDH16A1 mediated thioredoxin lysosomal degradation to enhance ferroptosis susceptibility
    in SMARCA4-deficient NSCLC.
  findings:
  - statement: ALDH16A1 binds TXN and promotes its lysosomal degradation.
    supporting_text: Surprisingly, ALDH16A1 lacks ALDH enzymatic activity, but binds to the anti-ferroptotic
      oxidoreductase thioredoxin (TXN), facilitating its translocation to the lysosome and subsequent
      degradation.
  - statement: Active-site occlusion is inferred from an AlphaFold2 model.
    supporting_text: potentially inhibiting its oxidoreductase function by blocking its active site (Cys32-Cys35),
      as implied by the binding model predicted by AlphaFold2.
  - statement: ALDH16A1 levels do not change whole-lysate ALDH activity.
    supporting_text: manipulating SMARCA4 or ALDH16A1 levels did not alter intracellular ALDH activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Single 2025 study. Its inactivity test is a whole-lysate total-ALDH
      kit, consistent with but weaker than the recombinant assay in PMID:30529746. TXN binding rests on
      co-IP and a cellular activity assay; the active-site occlusion stated in the abstract comes from
      an AlphaFold2 model. Recorded as a knowledge gap rather than a NEW row.
