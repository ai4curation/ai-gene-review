id: Q8IZ83
gene_symbol: ALDH16A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALDH16A1 is an atypical member of the aldehyde dehydrogenase superfamily with an extra C-terminal
  domain. Unlike the bacterial ALDH16, which is an active NAD+-dependent aldehyde dehydrogenase and esterase,
  human ALDH16A1 has lost the catalytic cysteine and glutamate and shows no aldehyde oxidation activity,
  while retaining the ALDH dimer fold; it is a pseudoenzyme. It binds the spastic paraplegia protein maspardin
  (SPG21). A recent study reports that it binds thioredoxin, occludes its active site and promotes its
  lysosomal degradation, sensitizing lung cancer cells to ferroptosis. Genetic variation in ALDH16A1 is
  associated with serum uric acid levels and gout, and mice lacking it show altered renal urate transporter
  expression.
