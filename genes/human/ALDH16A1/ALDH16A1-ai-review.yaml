  review:
    summary: Aldehyde dehydrogenase (NAD+) activity, inherited from a deep ALDH-superfamily PANTHER node.
      ALDH16A1 has lost the catalytic cysteine and glutamate and the human protein is inactive; removed
      as a pseudoenzyme over-propagation.
    action: REMOVE
    reason: 'ALDH16A1 belongs to the ALDH superfamily [file:genes/human/ALDH16A1/ALDH16A1-uniprot.txt
      "CC   -!- SIMILARITY: Belongs to the aldehyde dehydrogenase family."] but has lost the catalytic
      residues [file:genes/human/ALDH16A1/ALDH16A1-uniprot.txt "CC   -!- CAUTION: The active site cysteine
      and glutamate residues are not"], and the recombinant human protein is inactive [PMID:30529746 "In
      contrast, human ALDH16A1 apparently lacks measurable aldehyde oxidation activity, suggesting that
      it is a pseudoenzyme, consistent with the absence of the catalytic Cys in its sequence."], whereas
      the bacterial ALDH16 that keeps them is a working enzyme [PMID:30529746 "Loktanella ALDH16 is found
      to be a bona fide enzyme, exhibiting NAD+-binding, ALDH activity, and esterase activity."]. The
      same study finds no esterase activity [PMID:30529746 "In contrast, esterase activity assays with
      HsALDH16A1 were negative."] and no NAD(H) binding [PMID:30529746 "In contrast, neither NAD+ nor
      NADH induced a positive shift in Tm for HsALDH16A1 (Fig. 6B)."] for the human protein. Alignment
      confirms the lost dyad [file:genes/human/ALDH16A1/ALDH16A1-bioinformatics/RESULTS.md "- **Nucleophile.**
      In human, mouse and zebrafish ALDH16A1 the ALDH2 Cys319 column falls in a gap: the NQGQC catalytic-cysteine
      motif is absent and the region does not align."], [file:genes/human/ALDH16A1/ALDH16A1-bioinformatics/RESULTS.md
      "- **General base.** The ALDH2 Glu285 column is occupied by a non-glutamate residue (Ala272 in human
      and mouse, Ser265 in zebrafish), and the ELGGK general-base motif is absent, so this single-column
      placement is low confidence."], while the frog ortholog keeps it [file:genes/human/ALDH16A1/ALDH16A1-bioinformatics/RESULTS.md
      "- **Positive controls.** The classical ALDHs and the frog ALDH16 ortholog (Q28CF4) retain both
      residues of the catalytic dyad, at Cys309 and Glu275 in the frog."]. A later whole-lysate assay
      is consistent [PMID:40897711 "manipulating SMARCA4 or ALDH16A1 levels did not alter intracellular
      ALDH activity"]. The PAINT node placement is right for the superfamily, and ALDH16A1 sits inside
      that clade; the objection is target-specific evidence of loss, shared by the mammalian and fish
      ALDH16A1 sequences in the alignment, together with direct assays of the human protein, so the inherited
      activity does not hold for this gene.'
