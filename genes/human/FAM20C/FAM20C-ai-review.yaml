  review:
    summary: FAM20C occupies the Golgi membrane before stress-dependent redistribution.
    action: ACCEPT
    reason: PMID:32149426 Figure 3 shows WT FAM20C-mApple with GM130 in human HepG2 cells before thapsigargin
      treatment, followed by reversible redistribution toward the PDI-positive ER. The KDEL-tagged retention
      construct is a separate engineered control. Independent human HeLa extraction and fluorescence-protease-protection
      experiments in PMID:34349020 Figure 1 establish membrane integration and a lumen-facing C-terminal
      domain. This supports the Golgi membrane pool without treating every secreted or processed form
      as membrane-bound. Neither these engineered preparations nor their host cells establish activity
      of the natural 252-residue product, which lacks residues 1–332.
