suggested_questions:
- question: Is the natural 252-residue FAM20C product detectably expressed as a stable protein, and how
    do its localization and kinase activity compare with the 584-residue precursor and processed 93–584
    form?
- question: Which FAM20C processing state performs phosphorylation in the ER during stress, and is a soluble
    mature 93–584 ER pool present independently of the membrane precursor and secreted mature protein?
- question: How much does threonine phosphorylation contribute to endogenous FAM20C function, and which
    protein-context features permit it despite the strong serine preference and negative corresponding
    short-peptide assays?
suggested_experiments:
- hypothesis: If the natural shorter transcript produces a stable protein, its missing N-terminal region
    may change trafficking or catalysis relative to the longer precursor; this must be tested independently
    of engineered deletion constructs.
  description: Combine isoform-resolved RNA analysis with targeted proteomics for discriminating peptides
    and matched expression of sequence-verified 584- and 252-residue products. Measure protein stability,
    membrane association, secretion and phosphorylation of a controlled protein substrate, normalizing
    to recovered protein and including catalytic-dead controls. Keep the processed 93–584 preparation
    as a separate comparator.
- hypothesis: Stress-associated ER phosphorylation may be performed by a membrane-associated precursor,
    a soluble processed species, or both under different conditions.
  description: In human cells, combine a validated endogenous C-terminal tag, pulse-chase analysis, membrane
    extraction, protease protection and N-terminal mass spectrometry before, during and after ER stress.
    Resolve membrane, ER-soluble and extracellular fractions and measure PDI phosphorylation in parallel.
    Use compartment and fraction-integrity controls; establish that the tag preserves processing and avoid
    relying on KDEL retention as evidence for a native pool.
- hypothesis: If protein-context-dependent threonine phosphorylation contributes physiologically, endogenous
    site occupancy should respond to loss of FAM20C and rescue by active kinase.
  description: Quantify IGFBP1 Thr193 and Ser194 independently with validated phosphopeptide standards
    in matched human cells lacking FAM20C and rescued with WT or D478A protein. Control substrate abundance
    and secretion, distinguish singly and multiply phosphorylated peptides, and compare full protein with
    the corresponding short-peptide substrates. Expand to additional threonine sites only after target-specific
    localization is secure.
