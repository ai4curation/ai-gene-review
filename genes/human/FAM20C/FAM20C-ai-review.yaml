gene_symbol: FAM20C
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAM20C is a secretory-pathway protein kinase with a strong serine preference and measured
  threonine activity in protein substrates. Its intracellular form is a membrane protein with a lumen-facing
  catalytic region, concentrated in the Golgi and able to redistribute to the endoplasmic reticulum during
  stress. Proteolytic processing can release an active secreted form beginning at Asp93. FAM20C phosphorylates
  extracellular matrix and enamel proteins, as well as secretory-pathway proteins including protein disulfide
  isomerase and Ero1α. These reactions contribute to biomineralization and context-dependent ER proteostasis.
  FAM20A enhances FAM20C kinase activity. The natural 584- and 252-residue products are distinct from
  the processed 93–584 chain; activity and localization of the shorter natural product remain unresolved.
