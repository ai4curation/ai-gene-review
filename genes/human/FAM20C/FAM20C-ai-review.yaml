core_functions:
- description: Transfers phosphate from ATP to serine and threonine residues in protein substrates, with
    serine preferred. Human WT-versus-D478A experiments establish protein-substrate phosphorylation, including
    distinct IGFBP1 Thr193 and Ser194 sites. The same catalytic activity phosphorylates enamel matrix
    proteins and supplies a performed step supporting enamel mineralization. The intracellular precursor
    has a lumen-facing domain in Golgi and stress-associated ER membranes; active secreted preparations
    form a separate pool. Mn-ATP and Mg-ATP support human kinase assays, while the metal-bound crystal
    is from worm Fam20. The data do not establish native metal occupancy, a freely soluble mature 93–584
    ER-lumen pool, or equivalent activity of the natural 252-residue product.
