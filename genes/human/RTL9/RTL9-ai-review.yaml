core_functions:
- description: Microglial lysosomal innate immune effector required, via its C-terminal retroviral Gag
    capsid-like region, for degradation of phagocytosed fungal cell-wall material (zymosan); whether RTL9
    is itself a glucan-degrading enzyme or a cofactor/adaptor of lysosomal degradation is unknown.
  directly_involved_in:
  - id: GO:0071226
    label: cellular response to molecule of fungal origin
  locations:
