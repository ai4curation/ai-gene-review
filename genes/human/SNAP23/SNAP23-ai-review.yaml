  review:
    summary: IBA from PAINT node PTN000447754, seeded only by Drosophila Snap25 (FBgn0011288); human SNAP23 is not a donor.
    action: MARK_AS_OVER_ANNOTATED
    reason: Synaptic vesicle priming and fusion at the presynaptic active zone are carried out in vertebrate neurons by SNAP25 (and SNAP47), not SNAP23. SNAP23 is the ubiquitously expressed paralog (PTHR19305:SF4), functioning in constitutive and regulated exocytosis in non-neuronal cells; no study in this review shows SNAP23 in presynaptic vesicle cycling. The node lies above the vertebrate SNAP23/SNAP25 duplication, and the synaptic role was retained by SNAP25. The general activity (fusogenic SNARE) is inherited, but the synapse-specific process is an over-propagation to SNAP23.
