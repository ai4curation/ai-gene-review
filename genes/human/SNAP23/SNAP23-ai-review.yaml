  review:
    summary: Immunohistochemistry of human parathyroid tissue detected SNAP-23.
    action: KEEP_AS_NON_CORE
    reason: SNAP23 is a palmitoyl-anchored peripheral membrane protein on the cytosolic face of the plasma membrane and of intracellular membranes, so it lies within the cytoplasm as GO defines it. Tissue IHC cannot resolve the membrane compartment, so the term is about as precise as this evidence allows, but it is not informative of function.
    supported_by:
    - &id009
      reference_id: PMID:18457912
      supporting_text: SNAP-23 and VAMP were evenly expressed in all studied parathyroid tissues using immunohistochemistry and/or Western blot analysis.
