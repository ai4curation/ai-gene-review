id: O00161
gene_symbol: SNAP23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SNAP23 (synaptosomal-associated protein 23) is the ubiquitously expressed member of the SNAP-25 family of Qbc-SNAREs. It has no transmembrane segment. It carries two SNARE motifs (Qb and Qc t-SNARE coiled-coil domains) joined by a cysteine-rich linker, and S-palmitoylation of that linker anchors it to the cytoplasmic face of the plasma membrane. SNAP23 pairs with a syntaxin (STX4, STX11, STX3 and others) and a vesicular R-SNARE (VAMP3, VAMP7, VAMP8, VAMP4) to form the four-helix SNARE bundle that fuses vesicles or secretory granules with the plasma membrane. It thereby acts in constitutive and regulated exocytosis in non-neuronal cells, including histamine release by mast cells, mediator release by granulocytes, cytokine secretion, lytic granule release by cytotoxic lymphocytes with STX11, and recycling of surface receptors such as TLR4 from endosomes. Its neuronal paralog SNAP25 carries out synaptic vesicle exocytosis. Smaller pools of SNAP23 are found on granule, phagosome
  and endosome membranes. A splice isoform (SNAP-23b) lacks the palmitoylated linker region.
