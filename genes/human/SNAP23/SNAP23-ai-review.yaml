core_functions:
- description: 'Plasma membrane Qbc-SNARE: contributes two SNARE motifs to the four-helix SNARE complex with a syntaxin (STX4, STX11, STX3) and an R-SNARE (VAMP3/7/8), driving fusion of exocytic vesicles and secretory granules with the plasma membrane in non-neuronal cells (mast cells, granulocytes, cytotoxic lymphocytes, secretory cells). Experimentally established with human proteins and in human primary cells.'
  supported_by:
  - &id021
    reference_id: PMID:8663154
    supporting_text: we have identified a 23-kDa protein from human B lymphocytes (termed SNAP-23) that binds tightly to multiple syntaxins and synaptobrevins/VAMPs in vitro
  - reference_id: PMID:12556468
    supporting_text: SNAP-23N can assemble spontaneously with the coiled-coil domains from SNAP-23C, syntaxin-4, and VAMP-3 to form a heterotetrameric complex.
  - reference_id: PMID:18253931
    supporting_text: Inhibition of SNAP-23, STX-4, VAMP-7 or VAMP-8, but not VAMP-2 or VAMP-3, resulted in a markedly reduced high-affinity IgE receptor-mediated histamine release.
  - reference_id: PMID:24373201
    supporting_text: Specific knockdown of SNAP-23 or VAMP-3 decreased the exocytosis of IL-6 and TNFα
  - reference_id: PMID:28265073
    supporting_text: lipid-anchored STX11 and its cognate SNARE proteins mainly support exchange of lipids but not cytoplasmic content between cells, resembling hemifusion
  - reference_id: file:human/SNAP23/SNAP23-uniprot.txt
