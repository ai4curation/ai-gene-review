suggested_questions:
- question: Does the immunological synapse IDA from PMID:26771955 rest on SNAP23 imaging in a figure or supplement? The cached text discusses only STX11 and Munc18-2.
- question: Should the PTN000447754 synaptic vesicle priming and active-zone fusion terms be pruned from the SNAP23 branch, given that vertebrate SNAP23 is the non-neuronal paralog?
- question: Is there direct evidence in human cells (not mouse J774) that SNAP23 mediates TLR4 or other receptor recycling to the plasma membrane?
suggested_experiments:
- description: Knock out SNAP23 in human primary macrophages or THP-1 cells and measure surface TLR4 recovery after LPS-induced internalisation, with rescue by wild-type versus palmitoylation-deficient SNAP23.
  hypothesis: Palmitoyl-anchored SNAP23 is the plasma membrane Qbc-SNARE for TLR4 recycling in human macrophages.
- description: Use immuno-EM or proximity biotinylation from an outer mitochondrial membrane bait in human myotubes to test whether SNAP23 resides on mitochondria or only at contact sites.
  hypothesis: The SNAP23 signal near mitochondria in muscle comes from lipid droplet or ER contacts, not from a mitochondrial pool.
