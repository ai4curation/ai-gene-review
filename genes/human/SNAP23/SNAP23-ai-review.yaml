  review:
    summary: Confocal immunofluorescence of human vastus lateralis showed punctate intracellular SNAP23 staining that colocalised with cytochrome c oxidase (r = 0.50).
    action: MARK_AS_OVER_ANNOTATED
    reason: A Pearson coefficient of 0.5 at light-microscopy resolution shows proximity, not that SNAP23 is part of the mitochondrion. There is no fractionation, protease protection or EM evidence for a mitochondrial pool, and SNAP23 has no mitochondrial targeting signal. The observation may reflect SNAP23 at lipid droplet-mitochondria contacts or nearby membranes.
