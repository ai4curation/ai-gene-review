- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:41224739
  qualifier: enables
  review:
    summary: 'Lipid-anchored CLMB tethers calcineurin to membranes: calcineurin colocalises with wild-type CLMB
      at membranes but becomes cytosolic with a PxIxIT-mutant CLMB.'
    action: NEW
    reason: 'CLMB itself performs the anchoring step: its own lipid modifications attach it to membranes and its
      own PxIxIT motif captures calcineurin, so the activity belongs to CLMB rather than to its partner. Comparable
      calcineurin-anchoring proteins (e.g. AKAP5) are characterised as membrane scaffolds. This is more informative
      than protein phosphatase 2B binding alone and is the activity named by the gene symbol.'
    supported_by:
    - *id010
    - &id011
      reference_id: PMID:41224739
      supporting_text: Thus, CLMB recruits calcineurin to membranes primarily via PxIxT-mediated binding.
    - &id012
      reference_id: PMID:41224739
      supporting_text: In contrast, when co-expressed with CLMBIxITMut, this colocalization was greatly reduced,
        and calcineurin was predominantly cytosolic.
    - *id007
