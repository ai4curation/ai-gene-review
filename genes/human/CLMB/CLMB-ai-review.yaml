suggested_questions:
- question: Is CLMB net-inhibitory to calcineurin (sequestering it from RIIbeta, as proposed in brown adipocytes,
    PMID:40355556) or a membrane-targeting scaffold that promotes dephosphorylation of LxVP-only membrane substrates
    (PMID:41224739)? The answer decides between protein phosphatase inhibitor activity and an adaptor/regulator
    MF.
- question: Should the thermogenesis annotations use positive regulation of cold-induced thermogenesis (GO:0120162)
    rather than adaptive thermogenesis, given that CLMB modulates beta3-adrenergic PKA signalling rather than producing
    heat itself?
- question: Is the UNC119 interaction (repeated Y2H hits) a physiological route for transporting myristoylated CLMB
    between membranes, analogous to other UNC119 cargo?
suggested_experiments:
- hypothesis: CLMB-dependent membrane recruitment of calcineurin alters RIIbeta phosphorylation in human brown adipocytes.
  description: In human brown/beige adipocytes, replace endogenous CLMB with wild-type, G2A (non-myristoylated),
    IxIT-mutant or T44A CLMB and measure membrane calcineurin, RIIbeta phospho-Ser, PKA activity and UCP1-dependent
    respiration after beta3-agonist stimulation.
  experiment_type: genetic rescue with structure-function mutants
