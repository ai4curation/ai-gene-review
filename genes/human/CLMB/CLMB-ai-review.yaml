gene_symbol: CLMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Calcimembrin (CLMB; formerly C16orf74, also MICT1) is a 76-aa intrinsically disordered microprotein
  of the DUF4597 family that lacks transmembrane segments and associates with the cytoplasmic face of the plasma
  membrane through N-myristoylation of Gly2 and reversible S-acylation of Cys7 and Cys14. It carries a composite
  LxVPxIxIT calcineurin-docking motif (33-LDVPDIIIT-41) whose PxIxIT part, when Thr44 is phosphorylated, binds the
  catalytic subunit of calcineurin (PPP3CA) with very high affinity, recruiting calcineurin to membranes. CLMB is
  itself dephosphorylated by calcineurin through its LxVP motif in multimeric complexes, so the CLMB:calcineurin
  ratio, CLMB phosphorylation and dynamic acylation tune membrane calcineurin signalling. It is highly expressed
  in brown and beige adipocytes and induced by cold; there it limits calcineurin-mediated dephosphorylation of the
  PKA regulatory subunit RIIbeta, prolonging beta3-adrenergic PKA signalling and promoting thermogenesis, as shown
  in mouse brown adipose tissue and human beige adipocytes. CLMB is overexpressed in pancreatic and other carcinomas,
  where high expression is associated with invasion and poor prognosis.
