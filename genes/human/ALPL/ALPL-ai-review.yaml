- term:
    id: GO:0140928
    label: inhibition of non-skeletal tissue mineralization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      This annotation states the biology backwards. It is an Ensembl Compara
      transfer of a mouse Alpl IDA whose source experiment (PMID:21490328) found
      the opposite of what the term asserts: overexpressing TNAP in cultured
      aortas increased calcification, because TNAP destroys extracellular PPi,
      the endogenous inhibitor. The genes that genuinely perform this process --
      ENPP1, ANKH, ABCC6 -- make or export PPi; TNAP is their antagonist.
    action: REMOVE
    reason: >-
      GO:0140928 is defined as a homeostatic process that acts "by preventing
      mineralization of non-skeletal tissue", so involved_in asserts a positive
      contribution to preventing ectopic mineral. TNAP contributes in the
      opposite direction, and the strongest human-relevant evidence says so
      explicitly: in pseudoxanthoma elasticum, TNAP expression and activity are
      increased in ABCC6-mutant cells and a selective TNAP inhibitor prevents
      and attenuates ectopic calcification in vitro and in vivo (PMID:28592560).
      An inhibitor that blocks the process cannot be blocking a protein that
      performs it. This is precisely the case where an over-propagated electronic
      inference can be argued against on biological grounds. Either a NOT
      qualifier or, better, a new term for the promoting direction (proposed
      below) would capture the real relationship; the annotation as written
      should not stand.
    supported_by:
    - reference_id: PMID:28592560
      supporting_text: >-
        ABCC6 mutant cells additionally had increased expression and activity of
        tissue-nonspecific alkaline phosphatase (TNAP), an enzyme that degrades
        pyrophosphate, a major inhibitor of calcification.
    - reference_id: PMID:28592560
      supporting_text: >-
        A selective and orally bioavailable TNAP inhibitor prevented calcification
        in ABCC6 mutant cells in vitro and attenuated both the development and
        progression of calcification in Abcc6-/- mice in vivo, without the
        deleterious effects on bone associated with other proposed treatment
        strategies.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: MGI:MGI:87983
        source_label: Alpl
        source_status: SOURCE_BAD
        comment: >-
          Mouse Alpl carries an IDA to GO:0140928 from PMID:21490328, whose
          abstract states that overexpression of TNAP increased calcification of
          cultured aortas and that TNAP inhibition reduced PPi hydrolysis by 50
          percent. The paper's inhibitory arm concerns NPP1 and the PPi it
          generates, not TNAP, so the source annotation inverts the sign.
