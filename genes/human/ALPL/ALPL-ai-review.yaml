- id: PMID:36699639
  title: Gene Therapy Using Recombinant AAV Type 8 Vector Encoding TNAP-D(10) Improves the Skeletal Phenotypes
    in Murine Models of Osteomalacia.
  full_text_unavailable: false
  findings:
  - statement: AAV8 carries human mineral-targeted TNAP-D10; its skeletal-rescue and short-term safety
      outcomes were measured in mouse models.
    supporting_text: 'Virus vector encoding the human TNAP‐D10 cDNA

      Recombinant AAV8 encoding mineral‐targeted TNAP (AAV8‐TNAP‐D10; aka ARU‐2801) was generated using
      the HEK293 cell line as previously reported.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary PubMed identity/title/DOI 10.1002/jbm4.10709 independently verified. The exact
      normal source24 record is now cached. XML Methods, vector construction heading, mouse models, Results/Figures1-8
      and relevant Discussion/CKD limits read. Methods explicitly identify human TNAP-D10 cDNA packaged
      in AAV8 using HEK293 cells. This human engineered mineral-targeted enzyme is tested in AlplPrx1/Prx1
      and Phospho1-null mouse hosts with AAV8-GFP controls. Serum activity/PPi and skeletal morphology
      improve, while dentoalveolar changes are limited. No treatment-associated ectopic calcification
      increase was seen in the bounded observation window, including CKD challenge; this does not establish
      that native ALPL intrinsically inhibits nonskeletal mineralization or that lifetime treatment is
      risk-free. Construct identity is now resolved beyond the prior abstract-only assessment. The explicit
      human TNAP-D10 cDNA Methods resolves the prior abstract-only construct uncertainty. This is an engineered
      mineral-targeted human protein delivered to mouse hosts, not native human compartment localization.
      No increase in ectopic calcification over the tested short window is a treatment-safety result,
      not evidence that native ALPL inhibits non-skeletal mineralization.
