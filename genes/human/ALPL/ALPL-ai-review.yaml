- term:
    id: GO:0033883
    label: pyridoxal phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Rhea mapping for PLP + H2O = pyridoxal + phosphate, one of the two
      best-established natural reactions of TNAP and the one that explains the
      neurological phenotype of severe hypophosphatasia.
    action: ACCEPT
    reason: >-
      Directly demonstrated for human TNAP in fibroblasts (PMID:2220817) and in
      recombinant enzyme kinetics (PMID:12162492). Because phosphorylated PLP
      cannot cross membranes, this extracellular reaction gates cellular vitamin
      B6 supply, making it a core rather than incidental activity.
    supported_by:
    - reference_id: PMID:2220817
      supporting_text: >-
        TNS-ALP acts physiologically as a lipid-anchored PEA and PLP
        ectophosphatase
- term:
    id: GO:0043262
    label: ADP phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Rhea mapping for ADP + H2O = AMP + phosphate, the middle step of stepwise
      extracellular ATP degradation by TNAP. ADP hydrolysis by matrix vesicles
      was measured directly and shown to depend on TNAP (PMID:19874193).
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine capability with supporting kinetics, but an ancillary one:
      purinergic nucleotide turnover is shared with the ENPP, CD39 and CD73
      systems and is not the reaction whose loss produces the ALPL disease
      phenotype.
    supported_by:
    - reference_id: PMID:19874193
      supporting_text: >-
        The lack of TNAP had the most pronounced effect on the hydrolysis of all
        physiologic substrates.
- term:
    id: GO:0050187
    label: phosphoamidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Despite the generic-sounding label, this term is defined narrowly as
      N-phosphocreatine + H2O = creatine + phosphate (EC 3.9.1.1). UniProt
      assigns it to human ALPL only by similarity to mouse P09242, on the basis
      of the mitochondrial futile creatine cycle work.
    action: KEEP_AS_NON_CORE
    reason: >-
      Phosphocreatine hydrolysis is well supported in mouse thermogenic
      adipocytes but has not been demonstrated for human TNAP, and it operates in
      a tissue and compartment far removed from the mineralization role. Keeping
      it flagged as non-core preserves the claim while making clear it rests on
      cross-species inference.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      TNAP reaches the extracellular region proper when its GPI anchor is
      cleaved, releasing catalytically active soluble enzyme into extracellular
      fluid and serum -- the basis of the routine serum alkaline phosphatase
      assay.
    action: KEEP_AS_NON_CORE
    reason: >-
      True but unspecific. The enzyme's functional address is the outer leaflet
      of the plasma membrane and the matrix vesicle membrane; the soluble pool is
      a released form. Worth keeping because circulating TNAP is clinically
      central, but it is not where the protein does its defining work.
- term:
    id: GO:0006580
    label: ethanolamine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Follows from TNAP's phosphoethanolamine phosphatase activity, known since
      the fibroblast work of 1990 (PMID:2220817) and recently quantified against
      human recombinant enzyme, where phosphoethanolamine is hydrolysed about as
      efficiently as PPi (PMID:41145834).
    action: ACCEPT
    reason: >-
      Elevated phosphoethanolamine is a diagnostic hallmark of hypophosphatasia,
      which is direct human evidence that TNAP carries flux through this
      metabolite in vivo. The 2025 work moves this from "substrate of uncertain
      significance" to a defined step feeding cellular ethanolamine uptake and
      phospholipid synthesis.
    supported_by:
    - reference_id: PMID:41145834
      supporting_text: >-
        Recombinant TNAP hydrolyzes phosphocholine and phosphoethanolamine with
        similar efficiency than PPi.
- term:
    id: GO:0016462
    label: pyrophosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: >-
      The parent term covering hydrolysis of any pyrophosphate bond, which spans
      nucleoside triphosphatases and much else besides. The specific reaction
      TNAP performs, and the one that matters biologically, is hydrolysis of
      inorganic pyrophosphate.
    action: MODIFY
    reason: >-
      GO:0004427 is a descendant of GO:0016462 and is directly supported for this
      protein by human recombinant enzyme kinetics. Annotating to the broad
      parent obscures the fact that the physiologically decisive substrate is
      inorganic PPi rather than a nucleotide anhydride.
    proposed_replacement_terms:
    - id: GO:0004427
      label: inorganic diphosphate phosphatase activity
- term:
    id: GO:0019695
    label: choline metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Now supported by direct human evidence rather than orthology alone: TNAP
      dephosphorylates phosphocholine, and this is the step that lets hepatocytes
      take up choline during fasting for phosphatidylcholine and VLDL synthesis
      (PMID:41145834).
    action: ACCEPT
    reason: >-
      TNAP-knockout mice develop liver steatosis and reduced serum triglycerides
      mirroring choline deficiency, and pharmacological TNAP inhibition lowers
      blood and liver choline, so the process assertion has both loss-of-function
      and pharmacological support in addition to the enzymology.
    supported_by:
    - reference_id: PMID:41145834
      supporting_text: >-
        In summary, TNAP is the phosphatase enabling cellular choline uptake
        during fasting, participating in hepatic lipid metabolism.
- term:
    id: GO:0030282
    label: bone mineralization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Electronic orthology transfer of the core biological process, duplicating
      the IBA and ISS rows.
    action: ACCEPT
    reason: >-
      Correct, and independently established in human by the hypophosphatasia
