      proteome carries little functional weight on its own, and prostatic
      exosomes are not a site where TNAP is known to act. The functionally
      meaningful vesicle annotation is GO:0065010, the matrix vesicle.
    supported_by:
    - reference_id: PMID:23533145
      supporting_text: >-
