- term:
    id: GO:0036005
    label: response to macrophage colony-stimulating factor
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Orthology transfer of a rodent stimulus-response annotation, presumably from
