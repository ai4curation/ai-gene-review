existing_annotations:
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The core molecular function of ALPL, placed by PAINT at the node where the
      alkaline phosphatase family activity arose. Human TNAP has direct enzymatic
      evidence for this activity from recombinant enzyme kinetics (PMID:12162492)
      and from mutant expression studies (PMID:33821301), so the phylogenetic
      assertion and the experimental record agree exactly.
    action: ACCEPT
    reason: >-
      Alkaline phosphatase activity is the defining, evolutionarily ancient
      function of this family and the activity whose loss causes hypophosphatasia.
      The IBA sits at the right level of specificity: it names the enzymatic
      chemistry (phosphate monoester hydrolysis at alkaline pH optimum) without
      over-committing to any single physiological substrate, which is appropriate
      for an enzyme whose substrate range is genuinely broad.
    supported_by:
    - reference_id: PMID:12162492
      supporting_text: >-
        We characterized the kinetic behavior, inhibition, and heat stability
        properties of each mutant using the artificial substrate
        p-nitrophenylphosphate (pNPP) at pH 9.8.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      TNAP is a GPI-anchored ectoenzyme whose catalytic domain faces the
      extracellular space, so the plasma membrane is genuinely where it acts.
      The is_active_in qualifier is the correct one, and the assertion is
      confirmed directly in human cells by phosphatidylinositol-specific
      phospholipase C release and by dephosphorylation of membrane-impermeable
      substrates by intact monolayers (PMID:2220817).
    action: ACCEPT
    reason: >-
      Ecto-orientation on the plasma membrane is not incidental localisation but
      the topological basis of the enzyme's function: it acts on extracellular
      PPi, PLP and phosphoesters at the cell-matrix interface. A more precise
      term exists (GO:0009897, external side of plasma membrane) and is proposed
      as a NEW annotation below, but the IBA as written is correct.
    supported_by:
    - reference_id: PMID:2220817
      supporting_text: >-
        digestion with phosphatidylinositol-specific phospholipase C (PI-PLC)
        released about 80% of the ALP activity
- term:
    id: GO:0030282
    label: bone mineralization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      The core biological process. TNAP hydrolyses extracellular PPi, the
      principal inhibitor of hydroxyapatite propagation, at skeletal
      mineralization fronts; loss-of-function alleles in ALPL cause
      hypophosphatasia, whose cardinal feature is defective bone mineralization
      (PMID:9781036).
    action: ACCEPT
    reason: >-
      Human Mendelian genetics gives this process assertion unusually strong
      causal support, and the phylogenetic placement is consistent with the
      biomineralization role being ancestral to the vertebrate TNAP clade. No
      argument against the node placement is available: the target carries its
      own experimental grounding for the same process.
    supported_by:
    - reference_id: PMID:9781036
      supporting_text: >-
        Hypophosphatasia is an inherited disorder characterised by defective bone
        mineralisation and deficiency of serum and tissue liver/bone/kidney
        alkaline phosphatase (L/B/K ALP) activity.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Electronic assertion of the core catalytic function, duplicating the IBA
      and the two IDA rows for the same term.
    action: ACCEPT
    reason: >-
      Correct and at the right granularity. Duplication across evidence codes is
      expected and carries no penalty; this row simply records that the automated
      pipelines independently reach the same conclusion as the experimental
      literature.
- term:
    id: GO:0004427
    label: inorganic diphosphate phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Rhea-based mapping of the diphosphate + H2O = 2 phosphate reaction. This is
      the single most physiologically important reaction TNAP catalyses, and it
      is directly measured for human recombinant enzyme at physiological pH in
      PMID:12162492 and for matrix-vesicle TNAP in PMID:19874193.
    action: ACCEPT
    reason: >-
      This is the reaction that links ALPL to biomineralization: removal of PPi
      lifts the brake on hydroxyapatite propagation while supplying Pi. The Rhea
      mapping is more specific than the generic alkaline phosphatase term and is
      fully supported experimentally, so it belongs in the core function set.
    supported_by:
    - reference_id: PMID:12162492
      supporting_text: >-
        We also determined the ability of the mutants to metabolize two natural
        substrates of TNAP, that is, pyridoxal-5'-phosphate (PLP) and inorganic
        pyrophosphate (PPi), at physiological pH.
- term:
    id: GO:0005758
    label: mitochondrial intermembrane space
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Derives from the mouse work showing that in thermogenic adipocytes TNAP is
      tethered to mitochondrial membranes by its GPI anchor and hydrolyses
      N-phosphocreatine as part of the futile creatine cycle. UniProt records the
      human mitochondrial localisation only by similarity to mouse P09242; there
      is no direct human evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mouse evidence for mitochondrial TNAP in brown/beige fat is real and
      has been reinforced by later work on UCP1-independent thermogenesis, so
      this should not be removed. But it is a tissue-restricted, non-canonical
      localisation transferred electronically into human, topologically unusual
      for a GPI-anchored protein, and entirely separate from the ectoenzyme role
      that defines ALPL. Non-core is the honest classification until human
      cells are examined directly.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Electronic support for the canonical GPI-anchored plasma membrane
