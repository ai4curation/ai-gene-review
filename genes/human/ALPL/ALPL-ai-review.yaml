- term:
    id: GO:0008253
    label: 5'-nucleotidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Rhea mapping for hydrolysis of a nucleoside 5'-phosphate to the nucleoside
      plus phosphate, i.e. the AMP-to-adenosine step of TNAP's stepwise
      ectonucleotidase action.
    action: KEEP_AS_NON_CORE
    reason: >-
      TNAP genuinely dephosphorylates AMP, and this contributes to extracellular
      adenosine production and purinergic tone. But in most tissues this step is
      dominated by the dedicated ecto-5'-nucleotidase NT5E/CD73, and the
      quantitative contribution of TNAP is context-dependent. It is a real
      catalytic capability rather than a defining physiological role.
    supported_by:
    - reference_id: file:human/ALPL/ALPL-deep-research-falcon.md
      supporting_text: >-
        Nevertheless, the quantitative importance of TNAP relative to dedicated
        ectonucleotidases is cell- and context-dependent.
- term:
    id: GO:0016791
    label: phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from the alkaline phosphatase domain to the generic
      parent term "phosphatase activity", which loses the alkaline pH optimum
      and every substrate-specific detail that makes this enzyme interesting.
    action: MODIFY
    reason: >-
      The InterPro signature that generated this row (IPR001952
      Alkaline_phosphatase) licenses a far more specific term. GO:0004035 is a
      descendant of GO:0016791 and is already directly supported for this
      protein, so annotating only to the parent adds nothing and dilutes the
      record.
    proposed_replacement_terms:
    - id: GO:0004035
      label: alkaline phosphatase activity
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Rhea mapping for ATP + H2O = ADP + phosphate. TNAP does hydrolyse ATP: in
      osteoblast-derived matrix vesicles ATP is the main substrate hydrolysed,
      and TNAP is the enzyme responsible (PMID:19874193).
    action: KEEP_AS_NON_CORE
    reason: >-
      The chemistry is real, but the term carries an unhelpful connotation. It
      normally labels ATPases that couple hydrolysis to work (transport, motor
      activity, remodelling); TNAP instead strips the terminal phosphate as a
      promiscuous phosphomonoesterase, with no energy coupling. Retaining it as
      non-core records the ectonucleotidase capability without implying TNAP is
      an ATPase in the usual sense.
    supported_by:
    - reference_id: PMID:19874193
      supporting_text: >-
        We conclude that TNAP is the enzyme that hydrolyzes both ATP and PP(i) in
        the MV compartment.
- term:
    id: GO:0031966
    label: mitochondrial membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Electronic transfer of the mouse thermogenic-adipocyte mitochondrial
