- term:
    id: GO:0042822
    label: pyridoxal 5'-phosphate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      The process-level counterpart of TNAP's PLP phosphatase activity. Because
      PLP cannot cross the plasma membrane, extracellular dephosphorylation by
      TNAP is the obligatory step that makes vitamin B6 available to cells,
      including in the brain.
    action: ACCEPT
    reason: >-
      Core. Elevated circulating PLP is a defining biochemical marker of
      hypophosphatasia and B6-responsive seizures are part of the severe
      phenotype, so this process assertion is validated by human genetics, not
      just by the in vitro enzymology.
    supported_by:
    - reference_id: PMID:12162492
      supporting_text: >-
        Because abnormalities in PLP metabolism have been shown to cause epileptic
        seizures in mice null for the TNAP gene, these kinetic data help explain
        the variable expressivity of epileptic seizures in hypophosphatasia
        patients.
- term:
    id: GO:0051384
    label: response to glucocorticoid
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Orthology transfer of a rodent expression-response annotation.
      Glucocorticoids are classical inducers of alkaline phosphatase in
