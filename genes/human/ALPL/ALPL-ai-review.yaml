      and phosphoethanolamine with similar efficiency than PPi.'
  - *id003
- description: Recombinant human TNAP hydrolyzes phosphocreatine to creatine and inorganic phosphate at
    near-physiological pH. Mouse thermogenic adipocytes use this chemistry in the mitochondrial futile
    creatine cycle. The human molecular activity is directly measured; a human mitochondrial location
    or thermogenic process is not asserted by this core entry.
  molecular_function:
