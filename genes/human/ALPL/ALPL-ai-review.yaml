id: P05186
gene_symbol: ALPL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALPL encodes tissue-nonspecific alkaline phosphatase (TNAP/TNSALP), a
  homodimeric, GPI-anchored ectoenzyme displayed on the outer leaflet of the
  plasma membrane and on the membranes of osteoblast- and chondrocyte-derived
  matrix vesicles, with its catalytic domain facing the extracellular space.
  Each subunit carries a metal-dependent active site with two Zn(2+) and one
  Mg(2+), plus a mammalian-specific structural Ca(2+) site and a crown domain
  that mediates association with the collagenous mineralizing matrix;
  dimerization is obligatory for catalysis, which is why many hypophosphatasia
  alleles act dominant-negatively. The enzyme is a broad-specificity
  phosphomonoesterase with an alkaline pH optimum, but only a few of its
  substrates are physiologically important. Chief among them is extracellular
  inorganic pyrophosphate (PPi): by hydrolysing PPi to two phosphate ions TNAP
  removes the principal inhibitor of hydroxyapatite propagation and
  simultaneously raises local inorganic phosphate, and this single reaction
  accounts for its essential role in skeletal and dental (including acellular
  cementum) mineralization. It also hydrolyses pyridoxal 5'-phosphate to
  pyridoxal, the membrane-permeant vitamin B6 vitamer, so that B6-dependent
  neurotransmitter synthesis can proceed in the brain -- the basis of the
  B6-responsive seizures seen in severe deficiency -- and dephosphorylates
  phosphoethanolamine and phosphocholine, the latter enabling hepatocyte choline
  uptake for phosphatidylcholine and VLDL synthesis. Additional, more
  context-dependent activities include stepwise hydrolysis of extracellular
  ATP to ADP, AMP and adenosine, dephosphorylation of lipopolysaccharide, and,
  in thermogenic adipocytes, hydrolysis of N-phosphocreatine within the futile
  creatine cycle. Loss-of-function variants cause hypophosphatasia across a
  spectrum from lethal perinatal disease to isolated odonto-hypophosphatasia;
  conversely, excess TNAP activity in vascular smooth muscle promotes ectopic
  calcification.
