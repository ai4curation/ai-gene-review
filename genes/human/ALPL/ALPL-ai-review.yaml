    label: external side of plasma membrane
  - id: GO:0065010
    label: extracellular membrane-bounded organelle
  supported_by:
  - &id002
    reference_id: PMID:12162492
    supporting_text: 'We also determined the ability of the mutants to metabolize two natural

      substrates of TNAP, that is, pyridoxal-5''-phosphate (PLP) and inorganic

      pyrophosphate (PPi), at physiological pH.'
  - reference_id: PMID:19874193
    supporting_text: 'We conclude that TNAP is the enzyme that hydrolyzes both ATP and

      PP(i) in the MV compartment.'
  - reference_id: PMID:9781036
    supporting_text: 'Hypophosphatasia is an inherited disorder characterised by defective bone

      mineralisation and deficiency of serum and tissue liver/bone/kidney alkaline

      phosphatase (L/B/K ALP) activity.'
- description: TNAP dephosphorylates extracellular pyridoxal 5'-phosphate to pyridoxal at the outward-facing
    cell surface, making vitamin B6 available for cellular uptake and cofactor metabolism. Human fibroblast
    and recombinant-enzyme assays establish the reaction; neurological consequences of severe deficiency
    include disrupted B6-dependent metabolism.
  molecular_function:
    id: GO:0033883
    label: pyridoxal phosphatase activity
  directly_involved_in:
