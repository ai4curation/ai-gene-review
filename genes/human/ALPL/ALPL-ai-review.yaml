- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:9781036
  qualifier: involved_in
  review:
    summary: >-
      Author statement drawn from a hypophosphatasia mutation survey. The
      underlying claim is sound -- ALPL loss of function causes a skeletal
      disease -- but the term chosen is a broad developmental process, whereas
      the defect is specifically in mineralization of an otherwise normally
      patterned skeleton.
    action: MODIFY
    reason: >-
      Hypophosphatasia is a mineralization disorder, not a patterning or
      morphogenesis disorder: cartilage and bone are formed and osteoid is
      deposited, but hydroxyapatite deposition fails, producing rickets and
      osteomalacia. GO:0030282 states this precisely and is already supported by
      several other lines of evidence, so the broad developmental term should be
      replaced rather than kept alongside it.
    proposed_replacement_terms:
    - id: GO:0030282
      label: bone mineralization
    supported_by:
    - reference_id: PMID:9781036
      supporting_text: >-
        Hypophosphatasia is an inherited disorder characterised by defective bone
        mineralisation and deficiency of serum and tissue liver/bone/kidney
        alkaline phosphatase (L/B/K ALP) activity.
- term:
    id: GO:0009897
    label: external side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:2220817
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation filling a real gap: GOA places ALPL at the plasma
      membrane but never records which face of it, even though the ecto-orientation
      is the single most functionally consequential fact about this protein's
      localisation and was established experimentally in human cells in 1990.
      Fedde and Whyte showed by three independent arguments that fibroblast TNAP
      faces outward -- intact and disrupted monolayers dephosphorylate the
      membrane-impermeable substrates PEA and PLP at similar rates, brief acid
      exposure inactivates over 90 percent of activity, and PI-PLC releases about
      80 percent of it.
    action: NEW
    reason: >-
      Topology is what makes TNAP an ectoenzyme rather than an intracellular
      phosphatase: its substrates -- extracellular PPi, PLP, PEA, phosphocholine,
      nucleotides -- are all outside the cell, and PLP and PEA in particular
      cannot cross the membrane, which is why the enzyme must act on the outer
      leaflet for cellular vitamin B6 uptake to occur at all. GO:0009897 is a
      descendant of GO:0005886 and so does not conflict with any existing row; it
      simply records what the existing rows leave unstated. The evidence is IDA
      on human cells, and the same conclusion is reached independently by the
      GPI-anchor demonstrations in PMID:25982064 and by the UniProt GPI-anchor
      annotation at Ser501.
    additional_reference_ids:
    - PMID:25982064
    supported_by:
    - reference_id: PMID:2220817
      supporting_text: >-
        Normal fibroblast ALP is linked to the outside of the plasma membrane,
        since in intact cell monolayers (1) dephosphorylation rates of the
        membrane-impermeable substrates PEA and PLP in the medium at physiologic
        pH were similar to those observed with disrupted cell monolayers, (2)
        brief exposure to acidic medium resulted in greater than 90%
        inactivation of the total ALP activity, and (3) digestion with
        phosphatidylinositol-specific phospholipase C (PI-PLC) released about 80%
        of the ALP activity.
    - reference_id: PMID:2220817
      supporting_text: >-
        The majority of the detectable ALP activity, however, appeared to be
        properly lipid anchored in ecto-orientation.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:41145834
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. GOA gives ALPL a calcium ion binding term but no
      zinc or magnesium term, even though the catalytic centre of every alkaline
      phosphatase is a trinuclear Zn/Zn/Mg site and the human TNAP crystal
      structure resolves it directly. Drevet Mulard et al. solved human TNAP and
      report the three essential catalytic-site cations -- two zinc ions and one
      magnesium ion -- alongside the calcium at the CA cluster that is already
      annotated.
    action: NEW
    reason: >-
      This is the metal chemistry that performs catalysis, as distinct from the
      structural calcium site that UniProt notes does not influence activity, so
      its absence from GOA is a conspicuous gap rather than a stylistic omission.
      The evidence is IDA on the human protein: metals identified in an
      experimentally determined structure of human TNAP, not inferred from
      placental alkaline phosphatase. UniProt independently annotates Zn(2+)
      coordination at His60, Asp110, Asp337, His341, Asp378, His379 and His454.
      Zinc coordination is also mechanistically load-bearing for interpreting
      hypophosphatasia alleles, several of which fall in or adjacent to the metal
      site.
    supported_by:
    - reference_id: PMID:41145834
      supporting_text: >-
        The same divalent cations were identified, including the three essential
        cations in the catalytic site (two zinc ions and one magnesium ion),
        along with a calcium ion at the CA cluster, as seen in the apo structure
        of the enzyme (PDB codes 7YIV or 7YIW).
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:41145834
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation, the counterpart of the zinc row. The third
      catalytic metal in the human TNAP active site is magnesium, resolved in the
      same structures; UniProt places it at Asp60, Thr173 and Glu332.
    action: NEW
    reason: >-
      The Zn/Zn/Mg triad is a single catalytic unit and annotating only part of
      it would leave the record incomplete. As with zinc, the evidence is direct
      structural determination of the human enzyme rather than transfer from
      placental alkaline phosphatase, and the magnesium site is distinct from the
      already-annotated structural calcium site.
    supported_by:
    - reference_id: PMID:41145834
      supporting_text: >-
        The same divalent cations were identified, including the three essential
        cations in the catalytic site (two zinc ions and one magnesium ion),
        along with a calcium ion at the CA cluster, as seen in the apo structure
        of the enzyme (PDB codes 7YIV or 7YIW).
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:23688511
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. TNAP is an obligate homodimer, and dimerisation is
      a functional requirement rather than an incidental oligomeric state:
      N417S reaches the cell surface with normal glycosylation yet fails to
      assemble into a dimer and is catalytically dead, and substituting Asn417
      with aspartate or glutamine abolishes dimerisation the same way. P108L
      behaves identically in an independent study and, being monomeric, poisons
      the wild-type enzyme.
    action: NEW
    reason: >-
      Ordinarily a protein-binding term would be too uninformative to be worth
      adding, but this one is mechanistically load-bearing and explains a clinical
      phenomenon that nothing else in the annotation set accounts for: autosomal
      dominant hypophosphatasia. Dominant-negative alleles such as G82R and P108L
      act by forming inactive heterodimers with wild-type subunits, which is only
      possible because the functional unit is a dimer. The evidence is direct --
      SDS-PAGE and sucrose density gradient centrifugation resolving the dimer,
      in two independent laboratories and mutant backgrounds -- and UniProt
      records the subunit structure as a homodimer.
    additional_reference_ids:
    - PMID:25982064
    - PMID:33821301
    supported_by:
    - reference_id: PMID:23688511
      supporting_text: >-
        Importantly, this mutant failed to assemble into a dimer structure, which
        is needed for the catalytic function of TNSALP, as evidenced by newly
        developed SDS-PAGE as well as sucrose-density-gradient centrifugation.
    - reference_id: PMID:25982064
      supporting_text: >-
        Importantly, TNSALP (WT) largely formed a functional dimeric structure,
        while TNSALP (P108L) was found to be present as a monomer in the cell.
core_functions:
- description: >-
    TNAP is a GPI-anchored, homodimeric, Zn/Zn/Mg-dependent alkaline
    phosphomonoesterase displayed on the external face of the plasma membrane and
    on the membrane of osteoblast- and chondrocyte-derived matrix vesicles. At
    skeletal and dental mineralization fronts it hydrolyses extracellular
    inorganic pyrophosphate, the principal endogenous inhibitor of hydroxyapatite
    propagation, thereby lowering the local PPi/Pi ratio and permitting mineral
    to nucleate within matrix vesicles and then to grow into the collagenous
    extracellular matrix. Loss of this activity causes hypophosphatasia, and its
    excess in vascular smooth muscle promotes ectopic calcification.
  molecular_function:
    id: GO:0004427
    label: inorganic diphosphate phosphatase activity
  directly_involved_in:
  - id: GO:0030282
    label: bone mineralization
  - id: GO:0071529
    label: cementum mineralization
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0065010
    label: extracellular membrane-bounded organelle
  supported_by:
  - reference_id: PMID:12162492
    supporting_text: >-
      We also determined the ability of the mutants to metabolize two natural
      substrates of TNAP, that is, pyridoxal-5'-phosphate (PLP) and inorganic
      pyrophosphate (PPi), at physiological pH.
  - reference_id: PMID:19874193
    supporting_text: >-
      We conclude that TNAP is the enzyme that hydrolyzes both ATP and PP(i) in
      the MV compartment.
  - reference_id: PMID:9781036
    supporting_text: >-
      Hypophosphatasia is an inherited disorder characterised by defective bone
      mineralisation and deficiency of serum and tissue liver/bone/kidney
      alkaline phosphatase (L/B/K ALP) activity.
- description: >-
    The same active site dephosphorylates extracellular pyridoxal 5'-phosphate to
    pyridoxal. Because PLP cannot cross the plasma membrane whereas pyridoxal can,
    this extracellular reaction is the obligatory gateway for cellular vitamin B6
    uptake, including across the blood-brain barrier, and so supplies the cofactor
    for B6-dependent neurotransmitter synthesis. Severe TNAP deficiency raises
    circulating PLP while starving the brain of usable B6, which is the mechanism
    of the pyridoxine-responsive seizures of infantile hypophosphatasia.
  molecular_function:
    id: GO:0033883
    label: pyridoxal phosphatase activity
  directly_involved_in:
  - id: GO:0042822
    label: pyridoxal 5'-phosphate metabolic process
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:2220817
    supporting_text: >-
      TNS-ALP acts physiologically as a lipid-anchored PEA and PLP
      ectophosphatase
  - reference_id: PMID:12162492
    supporting_text: >-
      Three mutations ( E174G, E174K, and E281K) were found to retain normal or
      slightly subnormal catalytic efficiency toward pNPP and PPi but not against
      PLP.
- description: >-
    TNAP dephosphorylates extracellular phosphocholine and phosphoethanolamine
    with efficiency comparable to PPi hydrolysis, enabling cellular uptake of
    choline and ethanolamine for phospholipid synthesis. In liver this supports
    phosphatidylcholine production and hence VLDL assembly and triglyceride
    export, and its loss produces steatosis in TNAP-knockout mice; in patients,
    failure of this reaction is why phosphoethanolamine accumulates and serves as
    a diagnostic marker of hypophosphatasia.
  molecular_function:
    id: GO:0052731
    label: phosphocholine phosphatase activity
  directly_involved_in:
  - id: GO:0019695
    label: choline metabolic process
  - id: GO:0006580
    label: ethanolamine metabolic process
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:41145834
    supporting_text: >-
      Recombinant TNAP hydrolyzes phosphocholine and phosphoethanolamine with
      similar efficiency than PPi.
  - reference_id: PMID:41145834
    supporting_text: >-
      In summary, TNAP is the phosphatase enabling cellular choline uptake during
      fasting, participating in hepatic lipid metabolism.
proposed_new_terms:
- proposed_name: promotion of non-skeletal tissue mineralization
  proposed_definition: >-
    A process in which a gene product increases the deposition of calcium
    phosphate mineral in tissue that is not normally mineralized, for example by
    degrading extracellular inorganic pyrophosphate or other endogenous
    inhibitors of hydroxyapatite propagation in vascular or soft tissue.
  justification: >-
    GO currently offers GO:0140928 "inhibition of non-skeletal tissue
    mineralization" but no term for the opposite direction, which forces
    curators of PPi-degrading enzymes into a directionally incorrect annotation.
    ALPL is the clearest case: its mouse IDA to GO:0140928 traces to an
    experiment (PMID:21490328) in which TNAP overexpression increased aortic
    calcification, and a selective TNAP inhibitor attenuates ectopic
    calcification in Abcc6-/- mice (PMID:28592560). A term in the promoting
    direction would let this well-supported biology be recorded correctly instead
    of being either dropped or expressed as a NOT annotation. ENPP1, ANKH and
    ABCC6 would remain on GO:0140928; ALPL and other ectophosphatases that
    consume PPi would take the new term.
  supported_by:
  - reference_id: PMID:28592560
    supporting_text: >-
      A selective and orally bioavailable TNAP inhibitor prevented calcification
      in ABCC6 mutant cells in vitro and attenuated both the development and
      progression of calcification in Abcc6-/- mice in vivo, without the
      deleterious effects on bone associated with other proposed treatment
      strategies.
suggested_questions:
- question: >-
    Is the mitochondrial localisation of TNAP, and its role in phosphocreatine
    hydrolysis within the futile creatine cycle, reproducible for the human
    protein in human thermogenic adipocytes? All current human annotations for
    this compartment and activity are orthology or similarity transfers from
    mouse, and a GPI-anchored ectoenzyme reaching the mitochondrial
    intermembrane space is topologically unusual enough to warrant direct
    confirmation.
- question: >-
    How is the substrate hierarchy of TNAP set in vivo? Recombinant human enzyme
    hydrolyses phosphocholine and phosphoethanolamine about as efficiently as
    PPi, yet the skeletal phenotype of hypophosphatasia is dominated by PPi
    accumulation. Is the ordering determined by local substrate concentration,
    by compartmentalisation on matrix vesicles versus the hepatocyte surface, or
    by competition with other ectophosphatases?
  experts:
  - David Magne
  - Jose Luis Millan
- question: >-
    Do individual hypophosphatasia alleles separate the choline and ethanolamine
    branch from the PPi and PLP branches, as E174G, E174K and E281K already do
    for PLP versus PPi? If so, do carriers of such alleles show hepatic lipid or
    choline abnormalities distinct from their skeletal phenotype?
- question: >-
    What determines whether TNAP activity is beneficial or harmful in a given
    tissue? The same PPi-degrading reaction that is essential in bone drives
    ectopic calcification in the vasculature in pseudoxanthoma elasticum and
    ENPP1 deficiency, and TNAP inhibitors are being developed on that basis.
    Understanding the tissue-level control of TNAP expression and activity is
    the key to a therapeutic window.
suggested_experiments:
- hypothesis: >-
    Human TNAP, like mouse TNAP, localises to mitochondria in thermogenic
    adipocytes and hydrolyses N-phosphocreatine there.
  description: >-
    Determine whether human TNAP localises to mitochondria in primary or
    iPSC-derived human brown and beige adipocytes, using proximity labelling and
    submitochondrial fractionation combined with protease-protection assays, and
    test whether SBI-425 or another selective TNAP inhibitor blocks
    phosphocreatine hydrolysis in isolated human adipocyte mitochondria. This
    would replace the current chain of ISS and IEA inferences behind GO:0005758,
    GO:0031966, GO:0050187, GO:0140651 and GO:0120162 with direct human evidence,
    or refute them.
  experiment_type: subcellular localisation and enzyme assay
- hypothesis: >-
    The relative catalytic efficiency of TNAP across its physiological substrates
    is tuned by distinct structural regions, so that hypophosphatasia alleles
    dissociate the substrate branches from one another.
  description: >-
    Measure the catalytic efficiency of purified human TNAP against PPi, PLP,
    phosphoethanolamine, phosphocholine, ATP, ADP and AMP under a single matched
    set of physiological conditions, and repeat with a panel of hypophosphatasia
    mutants spanning the active site, the dimer interface, the crown domain and
    the calcium site. A unified substrate-preference matrix would place the
    recently added phosphocholine and phosphoethanolamine reactions on the same
    quantitative footing as the classical ones and show which structural regions
    tune substrate choice.
  experiment_type: comparative enzyme kinetics
- hypothesis: >-
    TNAP is the dominant hydrolase for both ATP and PPi in human matrix vesicles,
    as it is in murine ones.
  description: >-
    Use matrix vesicles isolated from human osteoblast cultures, with TNAP
    knocked down or pharmacologically inhibited, to test directly in human cells
    the conclusion drawn from murine vesicles that TNAP is the dominant hydrolase
    for both ATP and PPi in this compartment, and to quantify how much of the
    mineral-forming capacity of the vesicle depends on it.
  experiment_type: matrix vesicle kinetics with genetic and pharmacological perturbation
- hypothesis: >-
    In human vascular smooth muscle, TNAP promotes rather than prevents
    non-skeletal mineralization, contrary to what the GO:0140928 annotation
    asserts.
  description: >-
    Overexpress and separately inhibit TNAP in human vascular smooth muscle cells
    under calcifying conditions, measuring mineral deposition and extracellular
    PPi in parallel. This would provide the human counterpart of the murine
    aortic experiment underlying the GO:0140928 annotation, and settle on human
    evidence whether ALPL promotes rather than prevents non-skeletal
    mineralization.
  experiment_type: cell-based calcification assay
