    supporting_text: recombinant human TNAP hydrolyzes PCr robustly (Extended Data Fig. 1e–g).
suggested_questions:
- question: How broadly does endogenous human TNAP localize to the intermembrane space of thermogenic
    adipocytes? Human recombinant phosphocreatine hydrolysis is established, whereas the detailed mitochondrial
    targeting and thermogenic-flux experiments read here are mouse studies.
- question: Should extracellular ATP-to-ADP/Pi phosphatases use GO:0017111, given the energy-coupling
    comment and ATP-dependent-activity parent relationship of GO:0016887 despite its reaction-based definition?
- question: Does ALPL perform a separable step in osteoblast fate acquisition beyond its established mineralization
    chemistry? The recovered full PMID:16210410 measures induction during early lineage commitment, rather
    than demonstrating that step.
- question: Can the ALPL peptide-level identification and purification context in the PMID:23533145 exosome
    supplement be recovered to resolve its source-specific localization assertion?
- question: How do substrate concentration, pH, compartment and allosteric regulation set the relative
    in-vivo fluxes of TNAP toward PPi, nucleotides, PLP, phosphocholine, phosphoethanolamine and phosphocreatine?
    The 2026 glycerol-regulation report is relevant, but its complete Methods/Results were not recovered
    in this audit.
- question: Which positive process term best represents TNAP-promoted non-skeletal calcification? GO:0140928
    has the opposite sign for the traced experiments; a new opposite-direction term is not claimed to
    be absent without a complete ontology search.
suggested_experiments:
- hypothesis: Human thermogenic-adipocyte TNAP uses a mitochondrial phosphocreatine-hydrolysis mechanism
    analogous to the measured mouse pathway.
  description: Combine endogenous human ALPL tagging, knockout-controlled fractionation and protease protection
    with isotope-resolved phosphocreatine turnover and respiration. Distinguish mitochondrial targeting
    from the already established recombinant human enzyme reaction.
  experiment_type: localization and isotope-resolved metabolic flux
- hypothesis: The relative contribution of TNAP substrates depends on tissue context and human disease
    allele.
  description: Compare matched physiological-pH kinetics of human TNAP variants on PPi, ATP, ADP, AMP,
    PLP, phosphocholine, phosphoethanolamine and phosphocreatine, then test selected separable defects
    in human mineralizing and hepatocyte models. Measure uptake and lipoprotein secretion directly rather
    than inferring flux solely from growth or lipid accumulation.
  experiment_type: comparative enzymology and cell-based flux
