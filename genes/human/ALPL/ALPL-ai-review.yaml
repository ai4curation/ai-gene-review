      contributes to, osteoblast differentiation; it measures abundance before
      and after induction. The biology argues the other way too: in
      hypophosphatasia and in Alpl-null models osteoblasts differentiate and lay
      down matrix, and what fails is mineralization of that matrix. The
      annotation is not fabricated -- ALPL is genuinely an osteoblast product --
      but it over-reads an expression correlate as a role in differentiation,
      and GO:0030282 bone mineralization already captures what ALPL actually
      does in these cells.
    supported_by:
    - reference_id: PMID:16210410
      supporting_text: >-
        For example, alkaline phosphatase (ALP), versican core protein, and
        tenascin increased 27-, 12-, and 4-fold, respectively, and fatty acid
        synthase decreased sixfold.
