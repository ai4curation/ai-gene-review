- term:
    id: GO:0052731
    label: phosphocholine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: >-
      Electronic assertion of an activity that has since been demonstrated
      directly on human recombinant TNAP, with structures resolving phosphocholine
      in the active site (PMID:41145834).
    action: ACCEPT
    reason: >-
      Now among the best-characterised TNAP reactions: kinetically comparable to
      PPi hydrolysis, structurally visualised, and connected to a physiological
      output (hepatic choline uptake and triglyceride export). The electronic row
      anticipated what the experimental IDA row now confirms.
    supported_by:
    - reference_id: PMID:41145834
      supporting_text: >-
        X-ray diffraction and cryo-EM identified the residues in TNAP's active
        site interacting with phosphocholine, PPi and the TNAP inhibitor.
- term:
    id: GO:0052732
    label: phosphoethanolamine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Electronic assertion of an activity with unusually old and direct human
      support: phosphoethanolamine dephosphorylation by TNAP was demonstrated in
      normal and hypophosphatasia fibroblasts in 1990 (PMID:2220817).
    action: ACCEPT
    reason: >-
      Urinary phosphoethanolamine remains a diagnostic criterion for
      hypophosphatasia, which is human in vivo confirmation that TNAP is the
      enzyme responsible for clearing this metabolite.
    supported_by:
    - reference_id: PMID:2220817
      supporting_text: >-
        Hypophosphatasia fibroblasts were markedly deficient (2%-5% control
        values) in alkaline and physiologic ALP activity when 4-MUP, PLP, and PEA
        were used as substrate.
- term:
    id: GO:0055062
    label: phosphate ion homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      TNAP liberates inorganic phosphate from PPi and from phosphomonoesters at
      mineralization sites, so it contributes to the local PPi/Pi ratio that
      governs hydroxyapatite propagation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Directionally correct but framed at the wrong scale. TNAP's effect is on
      the local extracellular PPi/Pi balance at the mineralization front, not on
      organismal phosphate homeostasis, which is governed by FGF23, PTH and renal
      transporters. Serum phosphate is characteristically normal or high in
      hypophosphatasia, so this is not where the gene's phenotype lives.
- term:
    id: GO:0055074
    label: calcium ion homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Orthology transfer of the calcium homeostasis annotation that also exists
      as an experimental row from the pseudoxanthoma elasticum work
      (PMID:28592560).
    action: KEEP_AS_NON_CORE
    reason: >-
      Indirect. TNAP acts on phosphate-containing substrates, not on calcium; any
      effect on calcium is a consequence of altered calcium-phosphate deposition.
      Retained because TNAP activity demonstrably changes where calcium mineral
      is deposited, but it is not a calcium-handling protein.
- term:
    id: GO:0065010
    label: extracellular membrane-bounded organelle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: is_active_in
  review:
    summary: >-
