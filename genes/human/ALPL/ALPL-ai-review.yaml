      ATP energy is shown here. Refine to the immediate reaction parent GO:0017111, whose definition includes
      hydrolysis of a ribonucleoside triphosphate without that restriction. ATP is the measured substrate;
      this does not assert that every NTP is hydrolyzed. Preserve the positive chemistry and original
      source rather than reclassifying it as weak incidental activity.
