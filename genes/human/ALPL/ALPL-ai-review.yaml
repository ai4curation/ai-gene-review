id: P05186
gene_symbol: ALPL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALPL encodes tissue-nonspecific alkaline phosphatase (TNAP), a glycosylated, metal-dependent
  homodimer that commonly acts as a GPI-anchored ectoenzyme on cell surfaces and mineralizing matrix vesicles.
  Its active site contains zinc and magnesium, with a separate structural calcium site. TNAP hydrolyzes
  extracellular inorganic pyrophosphate, removing an inhibitor of hydroxyapatite propagation, and also
  releases phosphate from nucleotides. These activities support skeletal and dental mineralization. It
  dephosphorylates pyridoxal 5'-phosphate to pyridoxal, supporting cellular vitamin B6 availability, and
  hydrolyzes phosphocholine and phosphoethanolamine in recombinant human enzyme, serum and cell-based
  assays. The latter reactions supply choline and ethanolamine; mouse studies connect their perturbation
  to hepatic lipid metabolism. Recombinant human TNAP also hydrolyzes phosphocreatine. A mitochondrial
  TNAP pool drives phosphocreatine turnover and the futile creatine cycle in mouse thermogenic adipocytes,
  while direct human tissue targeting remains less well resolved. Loss-of-function ALPL variants cause
  hypophosphatasia with defective mineralization and, in severe cases, vitamin B6-related neurological
  manifestations. Increased TNAP activity can promote pathological soft-tissue calcification.
