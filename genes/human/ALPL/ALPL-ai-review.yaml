  - *id002
- description: TNAP hydrolyzes phosphocholine and the related phosphoethanolamine substrate, releasing
    choline and ethanolamine. Purified human enzyme, human serum and human-cell surface assays establish
    this extracellular chemistry. HuH-6 growth rescue is consistent with choline availability; mouse liver/plasma
    metabolite and lipid phenotypes support hepatic context without establishing direct TNAP transport
    activity or human VLDL secretion flux.
  molecular_function:
