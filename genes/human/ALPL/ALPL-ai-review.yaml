- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Reflects TNAP's enrichment on mineralizing membranes and matrix vesicles
      embedded in the collagenous matrix, and the collagen-binding loop in its
      mammalian-specific crown domain (PMID:11395499).
    action: KEEP_AS_NON_CORE
    reason: >-
      Locational shorthand for a real feature -- the enzyme works at the
      cell-matrix interface where nascent mineral forms -- but as a located_in
      assertion for a GPI-anchored membrane protein it is loose. The more precise
      statements are plasma membrane, external side, and matrix vesicle
      membrane, all of which are separately annotated.
- term:
    id: GO:0032496
    label: response to lipopolysaccharide
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Orthology transfer of a rodent response annotation. TNAP can dephosphorylate
      the lipid A moiety of LPS, which has been proposed as an anti-inflammatory
      detoxification mechanism, though in the gut this role belongs mainly to the
      intestinal isozyme ALPI.
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible and consistent with the enzyme's broad substrate tolerance, but
      peripheral to ALPL's defining biology and not established in human cells.
      Note also that "response to" terms describe the cell's reaction to a
      stimulus, which is a weaker and different claim than "dephosphorylates
      LPS"; the annotation should not be read as evidence for the catalytic
      claim.
- term:
