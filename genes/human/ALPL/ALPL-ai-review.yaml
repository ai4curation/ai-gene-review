    review_notes: >-
      High-throughput urinary exosome inventory (1132 proteins). Appropriate
      support for an HDA extracellular exosome location and nothing more; kidney
      is a high-TNAP tissue, so the detection is expected.
- id: PMID:19874193
  title: Kinetic analysis of substrate utilization by native and TNAP-, NPP1-, or
    PHOSPHO1-deficient matrix vesicles.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Genetic dissection of substrate hydrolysis in osteoblast-derived matrix
      vesicles, establishing TNAP as the dominant hydrolase for both ATP and PPi
      in that compartment. Directly supports the matrix vesicle (GO:0065010) and
      PPi hydrolysis annotations. The vesicles are murine, so the human
      application is by extension.
- id: PMID:2220817
  title: 'Alkaline phosphatase (tissue-nonspecific isoenzyme) is a phosphoethanolamine
    and pyridoxal-5''-phosphate ectophosphatase: normal and hypophosphatasia fibroblast
    study.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational human paper establishing both the PEA and PLP ectophosphatase
      activity and the ecto-orientation on the plasma membrane, with paired
      normal and hypophosphatasia fibroblasts. The membrane-impermeable substrate
      argument is what justifies the is_active_in qualifier and the proposed
      GO:0009897 annotation.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic
    secretions in urine.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Shotgun proteomics of prostatic-secretion exosomes (~900 proteins).
      Supports only a high-throughput vesicle location; no functional
      information about ALPL in this tissue.
- id: PMID:23688511
  title: An asparagine at position 417 of tissue-nonspecific alkaline phosphatase
    is essential for its structure and function as revealed by analysis of the N417S
    mutation associated with severe hypophosphatasia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cleanly separates trafficking from catalysis: N417S is glycosylated and
      surface-delivered but monomeric and inactive. Supports the plasma membrane
      annotation and is the primary evidence for the proposed GO:0042803
      homodimerization annotation.
- id: PMID:25982064
  title: Molecular phenotype of tissue-nonspecific alkaline phosphatase with a proline
    (108) to leucine substitution associated with dominant odontohypophosphatasia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Independent replication of the dimerisation requirement in a different
      mutant and laboratory, with explicit demonstration of GPI anchoring by
      PI-PLC digestion, and a direct dominant-negative effect on wild-type
      enzyme.
- id: PMID:28592560
  title: Ectopic calcification in pseudoxanthoma elasticum responds to inhibition
    of tissue-nonspecific alkaline phosphatase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes that TNAP activity drives rather than restrains ectopic
      calcification: TNAP is upregulated in ABCC6-mutant cells and a selective
      inhibitor prevents calcification in vitro and in Abcc6-/- mice. This is the
      decisive evidence against the GO:0140928 annotation and the basis of the
      proposed replacement term.
- id: PMID:33821301
  title: Novel mutation in the ALPL gene with a dominant negative effect in a Japanese
    family.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct enzymatic assay of a novel G82R allele in transfected cells showing
      complete loss of activity plus suppression of wild-type TNSALP. Supports
      the GO:0004035 IDA and corroborates the dominant-negative mechanism that
      the homodimer annotation explains.
- id: PMID:41145834
  title: TNAP dephosphorylates phosphocholine and phosphoethanolamine and participates
    in triglyceride transport from the liver to the bloodstream.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The most informative recent primary paper on this gene. Combines kinetics
      on purified human TNAP, pharmacological inhibition in human serum,
      hepatocyte experiments, a knockout steatosis phenotype, and X-ray and
      cryo-EM structures resolving both the substrate contacts and the Zn/Zn/Mg/Ca
      metal sites. Supports the phosphocholine and phosphoethanolamine
      activities, the choline and ethanolamine process terms, and the proposed
      zinc and magnesium binding annotations.
- id: PMID:9781036
  title: Identification of fifteen novel mutations in the tissue-nonspecific alkaline
    phosphatase (TNSALP) gene in European patients with severe hypophosphatasia.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mutation survey in 13 European hypophosphatasia families. Establishes the
      gene-disease relationship and the allelic heterogeneity, but it is a
      genetics paper and does not itself characterise protein function, which is
      why the broad GO:0001501 term drawn from it is better replaced by
      GO:0030282.
- id: file:human/ALPL/ALPL-deep-research-falcon.md
  title: 'Deep research report: human ALPL / tissue-nonspecific alkaline phosphatase
    (TNAP)'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Automated literature synthesis (Edison/falcon provider). Used here mainly
      for its explicit ranking of how well established each TNAP function is,
      which matches the core versus non-core split adopted in this review: PPi
      and PLP are treated as securely established, phosphoethanolamine as an
      established substrate of less certain systems importance, nucleotide
      turnover as context-dependent, and the phosphocreatine/thermogenesis role
      as emerging and largely preclinical. Its primary claims were checked
      against the cached primary literature and UniProt rather than accepted on
      their own; the report cites reviews by DOI rather than PMID, so no
      individual citation from it is relied on as a standalone source here.
- id: Reactome:R-HSA-8940388
  title: GPLD1 hydrolyses GPI-anchors from proteins
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction documenting the GPI-anchor cleavage that releases TNAP
      from the membrane into extracellular fluid, which is the mechanistic basis
      for both the plasma membrane and extracellular region TAS annotations.
