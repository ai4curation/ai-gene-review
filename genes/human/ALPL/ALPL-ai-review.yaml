    summary: >-
      Human osteoblasts producing 1alpha,25-(OH)2D3 from 25-(OH)D3 showed induced
      alkaline phosphatase activity, osteocalcin and CYP24 expression, and
      mineralization -- an autocrine/paracrine vitamin D effect on osteoblast
