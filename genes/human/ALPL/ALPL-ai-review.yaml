      The evidence is expression-pattern (IEP) and the term is a stimulus-response
      term, so what it records is that ALPL is a vitamin D-responsive gene in
      human osteoblasts, not a function of the protein. That is a real and
      well-documented regulatory relationship worth keeping, but it says nothing
      about the enzyme's activity.
    supported_by:
