core_functions:
- description: TNAP hydrolyzes extracellular inorganic pyrophosphate at mineralizing cell and matrix-vesicle
    surfaces, removing an inhibitor of hydroxyapatite propagation. Its additional nucleotide phosphatase
    activities supply local Pi. Mouse vesicle experiments and human TNAP enzymology support this integrated
    mineralization mechanism; intravesicular crystal initiation also involves other Pi-generating pathways
    and is not assigned exclusively to TNAP.
  molecular_function:
    id: GO:0004427
    label: inorganic diphosphate phosphatase activity
  directly_involved_in:
