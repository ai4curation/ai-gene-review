suggested_questions:
- question: >-
    Which functions of STK3 are ancestral? Can human STK3 replace Capsaspora coHpo or S. rosetta hippo,
    restoring cytoplasmic coYki and normal cell shape? And conversely, can the unicellular kinases rescue
    YAP/TAZ localization in MST1/2-deficient human cells, as the Acanthamoeba Hippo ortholog does?
- question: >-
    Is SARAH-mediated homodimerization and SAV1 heterodimerization conserved in coHpo and S. rosetta hippo?
    In particular, do unicellular SAV1 orthologs form the WW-mediated 2:2 heterotetramer described for
    human SAV1-MST2?
- question: >-
    Which functions of the paralog pair STK3/STK4 are specific to STK3? Many annotations, such as FOXO
    nuclear translocation, PRDX1 phosphorylation and ATG8-family binding, rest on MST1 data or on joint
    MST1/2 knockdowns, and STK3 binds ATG8-family proteins much more strongly than STK4.
- question: >-
    Is the STK3-NEK2A centrosome disjunction role Hippo-independent, and does it predate animals? Choanoflagellates
    and Capsaspora have centrosomes, while fungal Hippo-like kinases that lost SARAH act in mitotic exit
    and septation.
suggested_experiments:
- hypothesis: >-
    The restraint of Yorkie/YAP by Hippo kinases is ancestral and interchangeable across holozoans.
  description: >-
    Express human STK3 in Capsaspora coHpo-/- cells, and express coHpo in MST1/MST2 double-knockout human
    cells. Score Yorkie/YAP nuclear localization, LATS/Warts hydrophobic-motif phosphorylation and, in
    Capsaspora, the contractile elongated-cell phenotype.
  experiment_type: cross-species complementation
- hypothesis: STK3 has paralog-specific functions not shared with STK4.
  description: >-
    Compare STK3-only and STK4-only knockout cells, each rescued with wild-type, kinase-dead or SARAH-deleted
    constructs, for LATS/MOB1 phosphorylation, ATG8-dependent autophagy flux and centrosome disjunction.
  experiment_type: genetic loss-of-function and rescue
- hypothesis: SARAH-mediated dimerization is an ancestral regulatory mechanism.
  description: >-
    Purify SARAH domains of human STK3, Capsaspora coHpo and S. rosetta hippo and measure their oligomeric
    state (SEC-MALS, AUC) alone and with the cognate SAV1/RASSF SARAH domains.
  experiment_type: biophysical characterization
