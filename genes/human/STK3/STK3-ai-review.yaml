core_functions:
- description: >-
    Initiating serine/threonine kinase of the hippo kinase cascade. SARAH-dimerized, autophosphorylated
    STK3, with SAV1, phosphorylates and activates LATS1/2 and MOB1A/B in the cytoplasm, leading to inhibitory
    phosphorylation and cytoplasmic retention of YAP1/TAZ. This kinase-cascade activity is ancestral:
    the Capsaspora ortholog restrains Yorkie in the cytoplasm and can phosphorylate Drosophila Warts and
    Yorkie. Its use to restrain proliferation and tissue size is an animal-specific co-option.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0035329
    label: hippo signaling
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id016
  - *id034
  - *id022
  - *id017
  - *id018
  - *id035
- description: >-
    SARAH-domain-mediated homodimerization, which is required for trans-autophosphorylation of Thr-180
    and kinase activation. RASSF5 competes with this by forming a SARAH heterodimer, and the SAV1 heterodimer,
    assembled into a 2:2 complex through SAV1 WW domains, supports activation.
  molecular_function:
    id: GO:0042803
    label: protein homodimerization activity
  directly_involved_in:
  - id: GO:0035329
    label: hippo signaling
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id023
  - *id024
  - *id036
  - *id028
- description: >-
    Centrosomal kinase activity: STK3 phosphorylates NEK2A, promoting NEK2A recruitment to centrosomes
    and phosphorylation of the linker proteins C-Nap1 and rootletin, which allows centrosome disjunction.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0071539
    label: protein localization to centrosome
  locations:
  - id: GO:0005813
    label: centrosome
