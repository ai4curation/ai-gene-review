  review:
    summary: >-
      IPI with SAV1. The cited study shows that STK3 forms a SARAH-domain-mediated heterodimer with this
      partner.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The paper supports heterodimerization through the C-terminal
      SARAH coiled coils, which is the regulatory mode of these partners (SAV1 promotes, RASSF5 blocks,
      trans-autophosphorylation of the STK3 homodimer). Replaced with protein heterodimerization activity.
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    supported_by:
    - &id021
      reference_id: PMID:29063833
      supporting_text: >-
        Our structural and biochemical studies reveal that SAV1 and MST2 heterodimerize through their
        SARAH domains.
