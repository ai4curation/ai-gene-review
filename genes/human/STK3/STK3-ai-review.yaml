id: Q13188
gene_symbol: STK3
aliases:
- MST2
- KRS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  STK3 (MST2) is a cytoplasmic serine/threonine protein kinase of the STE20 GCKII subfamily and the closer
  paralog of STK4 (MST1); together they are the mammalian orthologs of Drosophila Hippo. The protein has
  an N-terminal kinase domain, a linker containing a caspase-3 cleavage site, and a C-terminal SARAH coiled-coil
  domain. Through the SARAH domain STK3 forms homodimers, which allow trans-autophosphorylation of the
  activation loop (Thr-180), and heterodimers with SAV1 and the RASSF proteins, which respectively promote
  or restrain this activation. The SLMAP-STRIPAK PP2A complex dephosphorylates and inactivates it. Active
  STK3, scaffolded by SAV1, phosphorylates LATS1/2 and MOB1A/B, which leads to LATS-mediated phosphorylation
  and cytoplasmic retention of the transcriptional coactivators YAP1 and WWTR1/TAZ. STK3 is therefore
  the initiating kinase of hippo signaling, which restrains proliferation and tissue growth in animals
  and mediates contact inhibition. STK3 also phosphorylates SAV1 and NEK2A; NEK2A phosphorylation promotes
  NEK2A recruitment to centrosomes and centrosome disjunction. STK3 is cleaved by caspase-3 during apoptosis,
  and the released kinase fragment enters the nucleus and promotes cell death. It interacts with ATG8-family
  proteins through an LIR motif and phosphorylates LC3B. Kinases combining a kinase domain with a SARAH
  domain predate animals: they occur in amoebozoans and in unicellular holozoans. The Capsaspora ortholog
  coHpo restrains the Yorkie ortholog in the cytoplasm and limits a contractile cell state without affecting
  proliferation. Knockout of the choanoflagellate ortholog leaves rosette size unchanged. The kinase activity
  and the restraint of Yorkie/YAP are therefore ancestral, whereas control of proliferation, tissue size
  and apoptosis appears to be animal-specific.
