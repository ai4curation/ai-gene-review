- id: PMID:38729842
  title: >-
    Assembling a Hippo: the evolutionary emergence of an animal developmental   signaling pathway.
  findings:
  - statement: Hippo kinase is the most ancient core Hippo component.
    supporting_text: >-
      among the core Hippo pathway components, the Hippo kinase appears most ancient, and is present in
      amoebozoans such as Dictyostelium discoideum and Acanthamoeba castellanii
  - statement: >-
      Ancestral role is cytoskeletal; proliferation/tissue size control is a later co-option.
    supporting_text: >-
      The deep conservation of cytoskeletal regulation by the Hippo pathway indicates an ancestral role
      for the Hippo pathway in cytoskeletal regulation, implying a subsequent co-option of the pathway
      to constrain proliferation and tissue size in animals.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review of the evolutionary assembly of the Hippo pathway; source for ancestral vs co-opted functions.
