knowledge_gaps:
- gap_statement: Whether human ATOSA regulates transcription, which genes it controls, and whether it
    acts through a Porthos ortholog (DDX family helicase) are unknown.
  boundary: >-
    Established; domain conservation with fly Atossa, and the ability of mouse ATOSA/ATOSB to
    rescue the fly atossa mutant (cross-species complementation). Human Protein Atlas
    immunofluorescence reports nucleoplasm; ATOSA is not in OpenCell. Not established by any
    cited vertebrate study; DNA or chromatin binding, target genes, partners, or any
    physiological role. An OpenScientist run (kgap-atosa-porthos-axis) splits this gap into
    three parts with three different answers. The helicase identification is settled: fly
    Porthos is pths/CG9253, already named an ATP-dependent RNA helicase DDX47 in UniProt, and
    its single human ortholog is DDX47 by reciprocal best hit in both directions, with 13 of 13
    orthology tools agreeing against 2 of 13 for the runner-up and an independent alignment
    giving 71.3 per cent identity over 449 residues. Whether human ATOSA acts through DDX47 is
    unresolved rather than refuted: no DEAD-box or DEAH-box protein appears in any public
    interaction record for this entry, the available records being yeast two-hybrid and
    text-mining only, co-expression with DDX47 ranks 24th of 36 helicase genes and sits at the
    quantification floor, and the Human Protein Atlas places ATOSA in nucleoplasm against DDX47
    in nucleoli; two affinity-proteomics resources could not be queried, so the search is
    incomplete. One detail reframes the question: the fly paper reports that nuclear Atossa
    increases porthos mRNA, not that the two proteins form a complex, so a human
    ATOSA-DDX47 binding claim would exceed the fly precedent before any missing human data is
    considered. The third part is the one that matters for annotation. Asserting DNA-binding or
    transcription-factor activity is an over-annotation risk: the only well-folded module with a
    recognisable fold is a HORMA domain over residues 1-230, which is a peptide-binding fold,
    the sequence contains no zinc finger, RING, PHD, AT-hook, HMG box, homeodomain or bZIP basic
    region, and ATOSA is absent from the human transcription factor census. The local Q32MH5
    record is consistent with that reading: it carries Pfam Chromosome_seg and DUF4210 and no
    zinc-finger feature, and its FUNCTION line calling the protein a transcription regulator
    carries ECO:0000250 from the mouse entry, a similarity transfer that itself rests on the
    single fly publication. This review's core function already hedges the transcription role as
    predicted by orthology, and GOA carries no transcription term, so no annotation action
    follows; the hedge is now better justified than before. The run notes that a fold assignment
    is not a function, so a HORMA domain at 8 to 10 per cent identity could in principle have
    lost closure-motif binding.
