knowledge_gaps:
- gap_statement: Whether human ATOSA regulates transcription, which genes it controls, and whether it
    acts through a Porthos ortholog (DDX family helicase) are unknown.
  boundary: 'Established: domain conservation with fly Atossa, and the ability of mouse ATOSA/ATOSB to
    rescue the fly atossa mutant (cross-species complementation). Human Protein Atlas immunofluorescence
    reports nucleoplasm; ATOSA is not in OpenCell. Not established by any cited vertebrate study: DNA
    or chromatin binding, target genes, partners, or any physiological role.'
