references:
- id: file:human/ATOSA/ATOSA-hypotheses/kgap-atosa-porthos-axis/openscientist.md
  title: OpenScientist analysis of the ATOSA-Porthos axis and ATOSA's DNA-binding claims
  findings:
  - statement: >-
      Fly Porthos maps unambiguously to human DDX47, but no interaction evidence links ATOSA to
      any helicase, and ATOSA's only recognisable fold is a peptide-binding HORMA domain with no
      DNA-binding motif anywhere in the sequence, so transcription-factor activity should not be
      asserted.
    supporting_text: >-
      Asserting DNA-binding or transcription-factor activity for ATOSA is over-annotation.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The 1076-residue length, the absence of any zinc-finger feature, the Pfam Chromosome_seg
      and DUF4210 assignments and the ECO:0000250 similarity evidence behind the UniProt
      transcription-regulator FUNCTION line were confirmed in the local Q32MH5 record. The
      orthology scores, the Foldseek HORMA assignment and its TM-scores, the interaction-database
      queries, the GTEx co-expression ranking and the transcription-factor census check were not
      independently verified; the run states that two affinity-proteomics resources could not be
      reached, so its interaction search is incomplete by its own account.
