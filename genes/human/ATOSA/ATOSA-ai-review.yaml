- id: PMID:35319107
  title: Macrophage mitochondrial bioenergetics and tissue invasion are boosted by an Atossa-Porthos axis
    in Drosophila.
  findings:
  - statement: Fly Atossa is a nuclear protein with TADs and NLSs.
    supporting_text: Atos also displays two trans‐activating domains (TADs) common among transcription
      factors, three nuclear localization signals (NLS), and a nuclear export signal (NES).
  - statement: Mouse FAM214A/B rescue the fly atossa mutant.
    supporting_text: Expression in macrophages of either mFAM214A or B in atosPBG rescued the germband
      invasion defect as efficiently as the Drosophila protein itself (Fig 2E and F) and restored the
      normal number of macrophages on the yolk neighboring the extended germband (Fig EV2E).
  - statement: Atossa raises Porthos and metabolic-enzyme mRNAs.
    supporting_text: First, nuclear Atossa increases mRNA levels of Porthos, a DEAD-box protein, and of
      two metabolic enzymes, lysine-α-ketoglutarate reductase (LKR/SDH) and NADPH glyoxylate reductase
      (GR/HPR), thus enhancing mitochondrial bioenergetics.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; Drosophila study with mouse-ortholog rescue. The only functional study of
      the family.
