suggested_questions:
- question: Does ATOSA regulate mitochondrial bioenergetics or invasion in mammalian macrophages, and
    which DEAD-box helicase, if any, is its Porthos counterpart?
suggested_experiments:
- description: Knock out ATOSA (and ATOSB) in human or mouse macrophages and profile transcription, translation
    of metabolic enzymes, respiration and tissue invasion; localize endogenous ATOSA.
