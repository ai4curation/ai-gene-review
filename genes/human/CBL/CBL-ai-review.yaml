    label: phosphotyrosine residue binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR024159
  review:
    summary: InterPro Cbl TKB/PTB domain mapping to phosphotyrosine residue binding.
    action: ACCEPT
    reason: The N-terminal TKB domain (4H + EF-hand + SH2-like) binds pTyr motifs (e.g. EGFR pY1045, SPRY2 pY55,
