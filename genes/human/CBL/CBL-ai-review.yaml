id: P22681
gene_symbol: CBL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CBL (c-Cbl) is a cytoplasmic RING-type ubiquitin E3 ligase and signaling adaptor that is recruited
  to activated tyrosine-kinase complexes. Its N-terminal tyrosine kinase-binding module recognizes selected
  phosphotyrosine motifs, while a linker and RING domain recruit an E2 ubiquitin-conjugating enzyme; Tyr371
  phosphorylation helps relieve autoinhibition. Its proline-rich region binds SH3-domain adaptors, and phosphorylated
  CBL can itself recruit SH2-domain partners. CBL ubiquitinates receptors and associated signaling proteins,
  contributing to receptor trafficking and attenuation of growth-factor signals. Ubiquitination can also regulate
  signaling without accelerating degradation: CBL and CBLB redundantly modify ligand-engaged LAG3, enabling
  its inhibitory activity in T cells. CBL can act through noncatalytic interactions as well, with context-dependent
  effects on survival signaling. It acts in the cytosol and on the cytoplasmic side of membrane-associated
  complexes. Germline CBL variants cause a Noonan-like disorder with variable predisposition to juvenile myelomonocytic
  leukemia; disease-associated linker/RING variants can disrupt ubiquitination and receptor trafficking.'
