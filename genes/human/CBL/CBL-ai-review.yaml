- term:
    id: GO:0043066
    label: negative regulation of apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:18070883
  qualifier: involved_in
  review:
    summary: SPRY2 promotes serum-induced survival by sequestering c-Cbl; c-Cbl loss abolishes the SPRY2 requirement.
    action: REMOVE
    reason: 'The paper (full text available) shows the opposite direction for CBL: free c-Cbl down-regulates growth
      factor receptors and thereby opposes the anti-apoptotic action of serum, while SPRY2 protects cells by sequestering
      CBL; a dominant-negative Cbl-TKB preserved survival. The anti-apoptotic function belongs to SPRY2. CBL is
      at most an indirect positive regulator of apoptosis here, so ''negative regulation of apoptotic process''
      is contradicted.'
    supported_by:
    - reference_id: PMID:18070883
      supporting_text: endogenous hSPRY2-mediated regulation of apoptosis requires c-Cbl and is manifested by the
        ability of hSPRY2 to sequester c-Cbl and thereby augment signaling via growth factor receptors.
    - reference_id: PMID:18070883
      supporting_text: the tyrosine kinase binding domain of c-Cbl (Cbl-TKB) protected against down-regulation of
        the growth factor receptors such as EGFR and preserved the anti-apoptotic actions of serum when hSpry2 was
        silenced.
