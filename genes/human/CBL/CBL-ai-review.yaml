- id: PMID:19546888
  title: Cbl negatively regulates JNK activation and cell death.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical header and abstract read. Complete header/abstract and selected complete
      primary Results/Methods/Discussion and supplemental captions were read from the normal XML cache.
      Rat neuronal knockdown/death assays, human CBL constructs and human HEK293 biochemical tests support
      contextual suppression of MLK/JNK death signaling. CBL and CBLB differ in several overexpression
      tests; double knockdown does not isolate one paralog. MLK stabilization and RING-defective protection
      argue against assuming simple E3-mediated MLK destruction. The precise interaction mechanism remains
      unresolved; no universal survival role is asserted.
core_functions:
- description: CBL recruits an E2 through its RING domain and promotes ubiquitin transfer to selected receptor
    and signaling substrates. This activity helps attenuate receptor signaling and directs endocytic sorting;
    CBL is an E3 rather than an E2 or a HECT-type thioester enzyme. In the LAG3 context, CBL and CBLB can
    redundantly assemble K63-linked chains that alter signaling-tail membrane association without measurably
    shortening LAG3 half-life. Substrate fate is therefore context dependent. In human osteoblasts, FGFR2
    recruits CBL to plasma-membrane raft microdomains where increased CBL–PI3K association accompanies PI3K
    ubiquitination and degradation; this is a defined signaling context, not a universal location for every
    substrate.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0070534
    label: protein K63-linked ubiquitination
  - id: GO:0070086
    label: ubiquitin-dependent endocytosis
  - id: GO:0042059
    label: negative regulation of epidermal growth factor receptor signaling pathway
  - id: GO:0040037
    label: negative regulation of fibroblast growth factor receptor signaling pathway
  - id: GO:0050860
    label: negative regulation of T cell receptor signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0045121
    label: membrane raft
  supported_by:
  - reference_id: PMID:10514377
    supporting_text: 'recruits and allosterically activates an E2 ubiquitin-conjugating enzyme

      through its RING domain'
  - reference_id: PMID:22266821
  - reference_id: PMID:15465819
  - reference_id: PMID:11997436
  - reference_id: PMID:21596750
  - reference_id: PMID:40101708
  - reference_id: PMID:18374639
    supporting_text: 'FGFR2 and Cbl interact in raft

      micro-domains'
- description: The TKB module recognizes selected phosphorylated tyrosine motifs on kinases and regulatory
    proteins, positioning CBL in substrate or regulatory complexes. Structures and binding measurements establish
    this recognition independently of whether each intact partner is ultimately ubiquitinated. Positive partner
