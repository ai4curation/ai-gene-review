  review:
    summary: InterPro-based ubiquitin-protein transferase activity.
    action: ACCEPT
    reason: 'CBL is a RING-type E3 ubiquitin ligase: its TKB domain recognises phosphotyrosine motifs on substrates
      and its RING recruits and activates E2 enzymes (UbcH5/UbcH7), transferring ubiquitin to substrates. The more
      specific GO:0061630 is the preferred core term but this parent is correct.'
