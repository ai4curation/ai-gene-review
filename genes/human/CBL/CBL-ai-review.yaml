  review:
    summary: FGF stimulation recruits CBL to tyrosine-phosphorylated FRS2alpha via GRB2 SH3 domains, and CBL ubiquitinates
      FGFR and FRS2alpha, contributing to receptor down-regulation.
    action: NEW
    reason: 'Participation test: CBL performs the attenuating step itself (E3-catalysed ubiquitination of FGFR1
      and FRS2alpha), not merely being required for it. Comparator check: this is the same role CBL already carries
      for EGFR (GO:0042059, IBA/IMP/TAS), and other FGFR feedback inhibitors in the same role (SPRY1/2, SULF1) carry
      GO:0040037. Further support for FGFR2 ubiquitination by CBL in osteoblasts/hMSCs. FRS2alpha-null cells show
      only partial loss of FGFR down-regulation, so CBL is one of several redundant mechanisms.'
