- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A8I6G3R2
  - ensembl:ENSRNOP00000079790
  review:
    summary: Retain a contextual DNA-damage response with the mechanistic controls distinguished from
      abundance changes.
    action: KEEP_AS_NON_CORE
    reason: PMID:19546888 tests camptothecin-treated rat neuronal cells, including combined Cbl/Cbl-b
      knockdown that sensitizes PC12 cells to death. Human-cell knockdown and human c-Cbl construct experiments
      place a suppressive action at MLK-to-MKK/JNK signaling, although the precise noncatalytic interaction
      mechanism remains unresolved. The DNA-damage experiment is not merely a measurement of Cbl disappearance,
      but the double-knockdown result does not isolate CBL from CBLB. Retain the broad transferred response
      as non-core with these model and redundancy limits, without assigning CBL a DNA-repair enzyme activity.
    additional_reference_ids:
    - PMID:19546888
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:19546888
      supporting_text: 'sensitized neuronal cells to death promoted by NGF

        deprivation or DNA damage'
