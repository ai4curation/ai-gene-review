- term:
    id: GO:0008584
    label: male gonad development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A8I6G3R2
  - ensembl:ENSRNOP00000079790
  review:
    summary: Male gonad development remains a narrower unresolved claim than the established testicular
      phenotype.
    action: UNDECIDED
    reason: 'The prior claim that Cbl-null mice are fertile and lack a gonadal phenotype is contradicted
      by PMID:16301331: the paper reports disrupted seminiferous germ-cell organization, loss of postmeiotic
      cells and predominantly male hypofertility. However, GO:0008584 concerns progression of the male
      gonad to its mature structure. The inspected experiments principally resolve adult germ-cell homeostasis
      and androgen-dependent apoptosis; an earlier developmental apoptotic defect is proposed in the Discussion
      as ongoing work. The precise developmental step behind this rat-to-human assertion remains unresolved.
      Preserve the source and positive testicular evidence without equating adult hypofertility with a
      demonstrated human gonad-development mechanism.'
    additional_reference_ids:
    - PMID:16301331
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:16301331
