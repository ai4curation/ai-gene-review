suggested_questions:
- question: For FGFR1-4, what fraction of ligand-induced receptor ubiquitination and degradation depends on CBL
    recruited through FRS2alpha-GRB2 versus direct TKB binding or other E3s (e.g. CBLB, NEDD4), given only partial
    loss of FGFR down-regulation in FRS2alpha-null cells?
- question: Which annotation source underlies the IPI 'protein binding' row citing PMID:5668240 (a peracetic acid
    chemistry paper), and what is the correct reference for the CBL-INPPL1 interaction?
- question: Does CBL-mediated LAG3 ubiquitination change LAG3 protein abundance (justifying 'protein stabilization'),
    or only its membrane-tail conformation?
- question: Should the IMP 'negative regulation of apoptotic process' from PMID:18070883 be transferred to SPRY2,
    since the data show SPRY2 sequesters CBL to preserve survival signalling?
suggested_experiments:
- hypothesis: CBL ubiquitinates FGFR1 and FRS2alpha in human cells and this ubiquitination limits FGF-induced ERK
    duration.
  description: In CBL-knockout (and CBL/CBLB double-knockout) human fibroblasts, re-express wild-type, RING-dead
    (C381A) or TKB-dead (G306E) CBL; measure FGF2-induced FGFR1/FRS2alpha ubiquitination, FGFR1 internalisation
    and degradation, and pERK kinetics.
  experiment_type: Genetic knockout and rescue with domain mutants
- hypothesis: GRB2-mediated recruitment through FRS2alpha, not direct TKB binding, is the dominant route for CBL
    to FGFRs.
  description: Compare FGFR ubiquitination in cells expressing FRS2alpha with GRB2-binding tyrosines mutated versus
    FGFR with candidate TKB-binding sites mutated.
  experiment_type: Site-directed mutagenesis and ubiquitination assays
