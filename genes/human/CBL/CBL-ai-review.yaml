core_functions:
- description: RING-type E3 ubiquitin ligase that recognises activated, tyrosine-phosphorylated receptor tyrosine
    kinases (EGFR, PDGFR, FGFR, MET, KIT, EPH, TRK) through its TKB domain, or indirectly via GRB2, and mono-/polyubiquitinates
    them to drive clathrin-mediated internalisation and lysosomal degradation, terminating growth factor signalling.
