suggested_questions:
- question: What original reference and assay underlie the CBL–INPPL1 binding row carrying PMID:5668240? The
    cached record is a peracetic-acid paper; no replacement identifier has been verified.
- question: Does the FLT1 binding annotation in PMID:18273061 refer to the engineered phosphopeptide or another
    assay, given the reported absence of wild-type peptide binding in that experiment?
- question: How should GO:0050821 protein stabilization apply to CBL-dependent LAG3 tail conformation? The
    primary study finds no increased LAG3 half-life, but the definition also refers to structural integrity
    and existing LAG3 GO-CAMs explicitly model stabilization; that correspondence remains unresolved.
- question: What direct human source evidence resolves the rat-derived gonad-development, hypoxia, starvation
    and other contextual response assertions, separating an executed CBL role from cell-composition changes
    or expression alone?
- question: Which assay supports CBL membership in the flotillin complex rather than transient association,
    and what evidence identifies CBL itself in the E-cadherin proteomics row?
- question: What same-role E3 comparator coverage best evaluates the genuine historical GO:0040037 FGFR-downregulation
    proposal? Existing target GO-CAMs represent LAG3 rather than FGFR; no new process assertion is added here.
- question: Which molecular interaction explains RING-independent CBL suppression of MLK-to-MKK signaling,
    and how does this protective context coexist with pro-apoptotic CBL effects in other cells?
- question: Which GRB2 domains or indirect complexes account for the CBL interactions in the unresolved original
    screening contexts, especially the phosphorylation-dependent network? Demonstrated SH3-mediated recruitment
    is not assumed to explain every GRB2 association.
suggested_experiments:
- hypothesis: CBL ubiquitinates FGFR1 and FRS2alpha in human cells and this ubiquitination limits FGF-induced
    ERK duration.
  description: In CBL-knockout (and CBL/CBLB double-knockout) human fibroblasts, re-express wild-type, RING-dead
    (C381A) or TKB-dead (G306E) CBL; measure FGF2-induced FGFR1/FRS2alpha ubiquitination, FGFR1 internalisation
    and degradation, and pERK kinetics.
  experiment_type: Genetic knockout and rescue with domain mutants
- hypothesis: GRB2-mediated recruitment through FRS2alpha, not direct TKB binding, is the dominant route for
    CBL to FGFRs.
  description: Compare FGFR ubiquitination in cells expressing FRS2alpha with GRB2-binding tyrosines mutated
    versus FGFR with candidate TKB-binding sites mutated.
  experiment_type: Site-directed mutagenesis and ubiquitination assays
