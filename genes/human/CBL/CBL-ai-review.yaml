- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:5668240
  qualifier: enables
  supporting_entities:
  - UniProtKB:O15357
  review:
    summary: IPI 'protein binding' (with INPPL1/SHIP2) citing PMID:5668240, a 1968 paper on the stability of peracetic
      acid solutions.
    action: REMOVE
    reason: The cited PMID resolves to an unrelated chemistry paper ('[Stability of diluted solutions of peracetic
      acid]') and cannot be the source of a CBL-INPPL1 interaction; the identifier is almost certainly erroneous.
      In any case 'protein binding' is uninformative. Removal does not imply the CBL-SHIP2 interaction is false.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:7657591
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00533
  review:
    summary: IPI interaction of CBL with P00533 (PMID:7657591); the partner is a receptor tyrosine kinase recruited
      by CBL for ubiquitination.
    action: MODIFY
    reason: 'Generic ''protein binding'' is uninformative. The cited study supports a more specific binding mode:
      the partner is a receptor tyrosine kinase recruited by CBL for ubiquitination. This reflects CBL''s adaptor/substrate-recognition
      role, not a catalytic activity; the core activity of CBL remains ubiquitin protein ligase activity.'
    proposed_replacement_terms:
    - *id006
    supported_by:
    - reference_id: PMID:7657591
      supporting_text: associates with activated EGF receptor in vivo
