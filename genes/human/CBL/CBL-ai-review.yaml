id: P22681
gene_symbol: CBL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CBL (c-Cbl) is a cytoplasmic RING-type E3 ubiquitin ligase and multidomain adaptor that terminates
  signalling by activated tyrosine kinases. Its N-terminal tyrosine kinase-binding (TKB) domain, a four-helix bundle,
  a calcium-binding EF-hand and a variant SH2 domain, recognises phosphotyrosine motifs on activated receptor tyrosine
  kinases (EGFR, PDGFR, MET, KIT, FLT1/3, EPH receptors) and non-receptor kinases (SRC family, SYK, ZAP70). A linker
  helix and RING finger recruit and allosterically activate E2 enzymes (UbcH5/UbcH7), and phosphorylation of linker
  Tyr371 relieves autoinhibition. CBL can also be recruited indirectly: its C-terminal proline-rich region binds
  SH3 domains of GRB2, which links it to FRS2alpha after FGF stimulation, and of CIN85/CD2AP and endophilin-associated
  endocytic adaptors. CBL mono- and polyubiquitinates (including K63-linked chains) activated receptors and associated
  adaptors such as FRS2alpha and Sprouty/Spred proteins, which drives clathrin-mediated internalisation and lysosomal
  degradation and limits the duration of EGF, FGF, PDGF and other growth factor signals. In lymphocytes it dampens
  T-cell receptor signalling, for example via K63-linked ubiquitination of LAG3. Tyrosine-phosphorylated CBL also
  acts as a docking site for CRK/CRKL and the p85 subunit of PI3K. Germline and somatic loss-of-function mutations
  in the linker/RING region cause a Noonan-like RASopathy and juvenile myelomonocytic leukaemia and occur in other
  myeloid neoplasms.'
