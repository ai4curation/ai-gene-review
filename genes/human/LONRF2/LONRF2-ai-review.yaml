suggested_questions:
- question: >-
    Which E2 enzymes, ubiquitin-chain linkages, and degradation pathways are used by
    LONRF2 for abnormal TDP-43, hnRNP M, artificial misfolded proteins, and ALDOA?
- question: >-
    Which endogenous neuronal substrates account for pathological protein accumulation,
    neurite shortening, and motor-neuron degeneration after LONRF2 loss?
- question: >-
    Is ALDOA a physiological LONRF2 substrate outside endometrial-cancer cells, and are
    the glycolytic and tumor phenotypes specific to that disease context?
- question: >-
    Do isoforms 1 and 2 differ because isoform 2 lacks the N-terminal TPR-repeat region,
    and which isoform was used in the published functional experiments?
- question: >-
    Is the N-terminal RING-like region at residues 143-193 an intact zinc-binding
    catalytic module, an atypical regulatory element, or a degenerate remnant?
suggested_experiments:
- hypothesis: >-
    LONRF2 uses a restricted set of E2 enzymes to ubiquitinate abnormal protein
    substrates with defined chain topologies.
  description: >-
    Reconstitute sequence-verified full-length LONRF2 with an E1, ubiquitin, and a panel
    of human E2 enzymes, using abnormal TDP-43, hnRNP M, and ALDOA as substrates. Compare
    wild type with RING-disrupting variants and identify substrate sites and chain
    linkages by quantitative mass spectrometry.
  experiment_type: reconstituted ubiquitination assay
- hypothesis: >-
    A limited endogenous substrate set connects LONRF2 ligase activity to neuronal
    protein homeostasis and survival.
  description: >-
    Acutely degrade endogenous LONRF2 in human iPSC-derived motor neurons, then integrate
    diGly ubiquitin-remnant proteomics, insoluble-proteome profiling, pulse-chase turnover,
    and longitudinal neurite and survival measurements. Rescue with wild-type but not
    RING-disrupted LONRF2 and biochemically validate prioritized direct substrates.
  experiment_type: acute neuronal perturbation and ubiquitin proteomics
- hypothesis: >-
    LONRF2-dependent ALDOA ubiquitination is context-dependent rather than a universal
    determinant of glycolysis.
  description: >-
    Compare endogenous LONRF2 knockout and rescue across endometrial-cancer cells,
    nontransformed endometrial cells, and neurons, measuring ALDOA ubiquitination,
    half-life, glycolytic flux, and abundance. Include ALDOA mutants at mapped
    ubiquitination sites to test causality without assuming a particular chain linkage.
  experiment_type: comparative substrate-validation study
- hypothesis: >-
    The N-terminal truncation in isoform 2 changes substrate selection or localization
    while retaining RING-dependent ligase capacity.
  description: >-
    Express sequence-verified isoforms from the same genomic landing site at matched
    levels and compare localization, proximity interactomes, misfolded-protein binding,
    E2 engagement, ubiquitination of validated substrates, and rescue of neuronal
    LONRF2-loss phenotypes.
  experiment_type: isoform-comparative functional analysis
- hypothesis: >-
    The N-terminal RING-like region is structurally and functionally distinct from the
    conserved C-terminal RING.
  description: >-
    Measure zinc stoichiometry and determine the structure of residues 143-193, then
    introduce ligand-disrupting variants into full-length LONRF2 and compare them with
    C-terminal RING variants in reconstituted ubiquitination, substrate binding, and
    cellular turnover assays.
  experiment_type: structural and comparative domain-function analysis
