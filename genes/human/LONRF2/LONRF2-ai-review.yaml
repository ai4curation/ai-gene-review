- id: PMID:37474791
  title: LONRF2 is a protein quality control ubiquitin ligase whose deficiency causes
    late-onset neurological deficits.
  findings:
  - statement: LONRF2 is a protein-quality-control ubiquitin ligase induced in post-mitotic
      senescent cells and predominantly expressed in neurons under unperturbed conditions.
    supporting_text: Here, we show that LONRF2 is a bona fide protein quality control
      ubiquitin ligase induced in post-mitotic senescent cells. Under unperturbed conditions,
      LONRF2 is predominantly expressed in neurons.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LONRF2 recognizes and ubiquitylates structurally abnormal RNA-binding
      proteins and artificial misfolded substrates.
    supporting_text: LONRF2 binds and ubiquitylates abnormally structured TDP-43 and
      hnRNP M1 and artificially misfolded proteins.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Loss of Lonrf2 causes age-dependent motor-neuron degeneration and
      cerebellar ataxia in mice.
    supporting_text: Lonrf2-/- mice exhibit age-dependent TDP-43-mediated motor neuron
      (MN) degeneration and cerebellar ataxia.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LONRF2 loss impairs motor-neuron survival and neurite maintenance and
      permits accumulation of pathological protein assemblies.
    supporting_text: Mouse induced pluripotent stem cell-derived MNs lacking LONRF2
      showed reduced survival, shortening of neurites and accumulation of pTDP-43
      and G3BP1 after long-term culture.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct primary characterization in cellular models, mouse knockout
      models, mouse iPSC-derived motor neurons and human ALS iPSC-derived motor neurons.
      Establishes ligase activity, misfolded-substrate recognition, neuronal protein
      quality control and neuroprotective consequences. Only the abstract is locally
      cached, so finer assay details should not be asserted without full text.
- id: PMID:42442502
  title: The ubiquitin ligase LONRF2 inhibits glycolysis and malignant phenotypes in
    endometrial cancer through aldolase a degradation.
  findings:
  - statement: ALDOA was identified as a LONRF2 interaction partner by immunoprecipitation
      and mass spectrometry.
    supporting_text: Aldolase A (ALDOA) was identified as a LONRF2-interacting protein
      via immunoprecipitation and nano-liquid chromatography-tandem mass spectrometry.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LONRF2 promotes ALDOA ubiquitylation and degradation.
    supporting_text: LONRF2 interacted with ALDOA and induced its ubiquitination and
      degradation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: In endometrial cancer cells, LONRF2 overexpression suppresses growth,
      glycolysis, migration and invasion.
    supporting_text: LONRF2 overexpression inhibited the growth, glycolysis, migration,
      and invasion of KLE cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct primary evidence for ALDOA as a LONRF2-regulated degradation
      substrate and for a context-specific effect on glycolysis in endometrial cancer.
      The cancer phenotype is non-core context; the substrate result independently
      corroborates the E3 ligase mechanism. Only the abstract is locally cached.
- id: file:human/LONRF2/LONRF2-bioinformatics/RESULTS.md
  title: LONRF2 comparative domain analysis results
  findings:
  - statement: >-
      LONRF2 lacks the AAA+ ATPase and protease machinery that defines an active Lon
      peptidase, despite retaining a Lon N-terminal substrate-binding-domain homolog.
    supporting_text: >-
      More decisively, the targeted presence matrix finds no AAA+ ATPase domain/core
      (IPR003593/IPR003959), Lon protease family call (IPR004815), peptidase S16 active
      site (IPR008268), or Lon proteolytic domain (IPR008269) in LONRF2. All five are
      present in the LONP1 control.
  - statement: >-
      The C-terminal RING call is strongly supported, whereas the N-terminal RING-like
      call remains structurally and biochemically unresolved.
    supporting_text: >-
      Thus, this workflow does not establish that the first broad call is an intact
      canonical zinc-coordinating RING; it may be atypical or degenerate and would
      require structural or biochemical validation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible comparison of reviewed LONRF proteins with RNF4 and LONP1 controls.
      The analysis supports architecture and presence/absence claims only; direct
      PMID:37474791 evidence remains primary for ubiquitin-ligase activity.
