gene_symbol: LONRF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LONRF2 is a RING-type ubiquitin E3 ligase that recognizes abnormally structured
  and misfolded proteins and promotes their ubiquitination as part of protein quality
  control. Directly studied substrates include abnormal TDP-43 and hnRNP M as well as
  artificial misfolded proteins. LONRF2 is predominantly expressed in neurons under
  unperturbed conditions; loss in mouse and motor-neuron models causes pathological
  protein accumulation, reduced neuronal survival, shortened neurites, motor-neuron
  degeneration, and cerebellar ataxia. In endometrial-cancer cells, LONRF2 also
  ubiquitinates and promotes degradation of ALDOA, with context-specific effects on
  glycolysis and malignant phenotypes. LONRF2 contains TPR repeats, a RING region,
  and a Lon N-terminal substrate-binding-domain homolog, but lacks the AAA+ ATPase
  and proteolytic domains that define Lon peptidases.
  Two isoforms are annotated; isoform 2 lacks the N-terminal 243 residues, but the
  isoforms have not been functionally compared.
