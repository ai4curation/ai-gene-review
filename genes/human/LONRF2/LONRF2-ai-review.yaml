core_functions:
- description: >-
    Acts as a RING-type ubiquitin protein ligase in protein quality control, promoting
    ubiquitination of abnormally structured and misfolded protein substrates. Directly
    reported substrates include abnormal TDP-43 and hnRNP M; the available abstract does
    not define the E2 enzyme, ubiquitin-chain linkage, or tested isoform. ALDOA is an
    independently reported degradation substrate in endometrial-cancer cells, but that
    context-specific axis is not generalized to the neuronal protein-quality-control role.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0006515
    label: protein quality control for misfolded or incompletely synthesized proteins
  substrates:
  - id: UniProtKB:Q13148
    label: TAR DNA-binding protein 43
  - id: UniProtKB:P52272
    label: heterogeneous nuclear ribonucleoprotein M
  - id: UniProtKB:P04075
    label: fructose-bisphosphate aldolase A
  supported_by:
  - reference_id: PMID:37474791
    supporting_text: >-
      LONRF2 binds and ubiquitylates abnormally structured TDP-43 and hnRNP M1 and
      artificially misfolded proteins.
  - reference_id: PMID:42442502
    supporting_text: >-
      LONRF2 interacted with ALDOA and induced its ubiquitination and degradation.
- description: >-
    Recognizes misfolded or abnormally structured protein substrates, providing the
    substrate-selection activity coupled to the LONRF2 ubiquitin-ligase reaction. This
    assignment is based on direct binding to abnormal TDP-43, hnRNP M, and artificial
    misfolded proteins and does not imply generic binding to normal ribonucleoprotein
    complexes or membership in a stable complex.
  molecular_function:
