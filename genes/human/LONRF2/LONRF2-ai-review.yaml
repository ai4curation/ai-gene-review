knowledge_gaps:
- gap_statement: >-
    The E2 enzyme requirements, ubiquitin-chain architecture, and immediate degradation
    machinery used by LONRF2 remain unresolved in the locally available evidence.
  boundary: >-
    LONRF2 directly binds and ubiquitinates abnormal TDP-43, hnRNP M, artificial
    misfolded proteins, and ALDOA, but both direct studies are cached as abstracts and
    neither abstract specifies chain linkage, E2 choice, or a reconstituted reaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    These mechanistic details determine how LONRF2 selects ubiquitination outcomes and
    whether different substrate classes use the same reaction pathway.
  resolution: >-
    Reconstitute full-length LONRF2 with a panel of human E2 enzymes and defined
    substrates, quantify ubiquitin transfer and chain topology by mass spectrometry,
    and test proteasome and autophagy dependencies in matched cellular assays.
  provenance:
  - reference_id: PMID:37474791
    supporting_text: >-
      LONRF2 binds and ubiquitylates abnormally structured TDP-43 and hnRNP M1 and
      artificially misfolded proteins.
- gap_statement: >-
    Whether the N-terminal InterPro RING-like region at residues 143-193 is an intact
    zinc-coordinating RING or an atypical or degenerate remnant is unresolved.
  boundary: >-
    The C-terminal RING at residues 448-487 has conserved-site support and strong
    family conservation, whereas the N-terminal call lacks an IPR017907 conserved-site
    overlap and has low identity to the RNF4 control. Sequence analysis alone cannot
    determine metal occupancy, fold integrity, or catalytic contribution.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving the first region will establish whether LONRF2 contains one functional
    RING module or a second structurally distinct zinc-binding element.
  resolution: >-
    Determine the structure and zinc stoichiometry of the isolated N-terminal region,
    then compare full-length wild type and ligand-disrupting variants in reconstituted
    ubiquitin-transfer and cellular substrate-turnover assays.
  provenance:
