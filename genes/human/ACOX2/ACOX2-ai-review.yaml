- term:
    id: GO:0005504
    label: fatty acid binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The ancestral fatty-acid-binding assertion needs evaluation separately from
      acyl-CoA substrate recognition.
    action: UNDECIDED
    reason: >-
      The recorded PAINT lineage places the fatty-acid-binding IBD at PTN000097533 on the
      Q99424 path. Rat Acox2 and Acox3 are the experimental descendants; source tracing identifies
      older rat substrate studies, but their full free-acid-binding evidence could not be
      adjudicated. GO:0005504 denotes fatty-acid binding, not automatically recognition of
      a CoA ester. Neither preferred ester substrates nor incomplete donor access establishes
      loss of the ancestral function. Retain UNDECIDED without rejecting PAINT on donor count
      or assuming that acyl-CoA oxidases cannot bind free acids.
      Independent family-level context in PMID:16672280 is positive: rat ACOX1
      (ACO-II; structure 2DDH, UniProt P07872) contains a free C12 fatty acid in its
      active-site crevice after hydrolysis of the cocrystallized dodecanoyl-CoA.
      This establishes that an acyl-CoA oxidase can bind the free acid, but it is
      not the uninspected Acox2/Acox3 descendant experiment underlying this IBD
      and does not by itself resolve transfer of that activity to human ACOX2.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000097533
        source_label: PTN000097533
        source_status: UNRESOLVED
        comment: Actual ancestral IBD recovered on the target path; the distinction
          between free-acid binding and acyl-CoA recognition requires evidence, not
          inference from the preferred substrate.
    supported_by:
    - reference_id: PMID:16672280
      supporting_text: >-
        The crystalline complex possessed, in the active-site crevice, only the fatty
        acid moiety that had been formed through hydrolysis of the thioester bond.
