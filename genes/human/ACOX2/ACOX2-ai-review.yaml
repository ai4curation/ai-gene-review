- description: Oxidizes (2S)-pristanoyl-CoA to (2E)-pristenoyl-CoA using oxygen and FAD
    in the peroxisomal matrix, generating hydrogen peroxide and initiating
    branched-chain fatty-acid beta-oxidation. Human ACOX3 has overlapping activity
    toward this substrate; the relative tissue contributions are incompletely resolved.
