    action: MODIFY
    reason: >-
      The cached PAINT IBD at PTN008508564 contains human and rat descendants. Human target
      evidence is legitimate grounding, not circular. The exact rat assay remains unresolved,
      but the independently verified human reaction and current term definition establish
      the target-level chemistry mismatch. GO:0033791 currently defines a 25R-substrate hydroxylation
