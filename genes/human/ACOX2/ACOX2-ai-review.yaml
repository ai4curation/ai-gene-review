suggested_questions:
- question: >-
    What is the relative in vivo contribution of ACOX2 vs ACOX3 to pristanoyl-CoA /
    branched-chain fatty acid beta-oxidation in human tissues, given the reported redundancy?
- question: >-
    Do the STRN3 and DYNLT1 interactions reported in high-throughput screens have any
    physiological relevance to ACOX2 peroxisomal function or regulation?
- question: Should GO:0033791 be corrected or split to distinguish its formal
    25R-to-24R,25R hydroxylation (RHEA:15733/EC:1.17.99.3) from THCA-CoA oxidase
    chemistry (RHEA:46728)? Until resolved, GO:0003997 captures the verified chemistry
    but loses machine-readable THCA-CoA substrate specificity.
- question: What is the native oligomeric state of human ACOX2, and can the reported
    preparation-dependent molecular masses be reconciled?
- question: Do the rat descendants supporting fatty-acid binding establish binding to
    free acids, and how does that activity transfer to human ACOX2?
- question: Does homogeneous or recombinant human ACOX2 oxidize C24/C26 acyl-CoAs at a
    measurable rate, independently of other peroxisomal oxidases?
suggested_experiments:
- description: >-
    Measure purified human ACOX2 kinetics and product identities with THCA-CoA epimers, DHCA-CoA,
    pristanoyl-CoA and C10/C16/C24/C26-CoA, controlling for hydratase contamination and free-fatty-acid
    binding. Compare native assembly across purification conditions.
- description: >-
    Tissue-specific metabolic profiling (bile-acid intermediates, branched-chain fatty acids)
    in ACOX2-knockout vs ACOX3-knockout models to disentangle the overlapping branched-chain
    fatty acid roles.
