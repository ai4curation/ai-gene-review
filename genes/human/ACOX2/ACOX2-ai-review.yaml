id: Q99424
gene_symbol: ACOX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACOX2 is a FAD-dependent acyl-CoA oxidase (EC 1.3.3.6) that acts in the peroxisomal matrix.
  It oxidizes branched-chain fatty acyl-CoA esters, including pristanoyl-CoA, and the C27
  bile-acid intermediates THCA-CoA and DHCA-CoA. Its oxygen-dependent dehydrogenation produces
  an enoyl-CoA and hydrogen peroxide, initiating peroxisomal beta-oxidation and bile-acid
  side-chain shortening. ACOX2 is active on THCA-CoA and shares pristanoyl-CoA activity with
  ACOX3. Recombinant human ACOX2 also shows weaker activity toward C10 and C16 straight-chain
  acyl-CoAs. The protein carries a C-terminal SKL peroxisomal targeting signal and is most
  abundant in heart, liver, and kidney among the tissues examined. Biallelic loss of function
  causes congenital bile acid synthesis defect 6, with accumulation of C27 bile-acid intermediates
  and variable liver disease.
