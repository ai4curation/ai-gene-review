id: Q9H211
gene_symbol: CDT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDT1 is a nuclear replication licensing factor that recruits MCM2–7 to DNA with ORC and CDC6,
  enabling formation of pre-replicative complexes. Its DNA/chromatin contacts and MCM-binding domains
  support helicase loading; geminin binding and regulated turnover constrain licensing. CDT1 also restrains
  early-S-phase DNA synthesis through inhibition of CMG-dependent fork progression. During mitosis it
  binds microtubules and associates with Hec1/NDC80 at kinetochores to support stable spindle attachments.
  Human hypomorphic variants impair replication licensing and cause Meier-Gorlin syndrome.
