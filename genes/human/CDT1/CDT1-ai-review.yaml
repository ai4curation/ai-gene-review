  review:
    summary: The cited study establishes regulated licensing interactions, not checkpoint signaling.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:14672932 Experimental Procedures and Results/Figs. 1–6 assay Cdt1–Cdc6/MCM association,
      chromatin MCM loading, serum regulation and geminin inhibition. Human CDT1 rescues geminin-blocked
      MCM loading in rat REF52 cells; human HeLa/293 and mouse NIH/3T3 assays have distinct scopes. These
      experiments do not establish the signal-transduction step required by GO:0000076. This is a source-specific
      overextension from replication control, not a claim that CDT1 can never affect checkpoints.
