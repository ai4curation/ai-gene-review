  review:
    summary: 'BNLN overexpression increased glucose-stimulated insulin secretion in INS-1 cells and in mouse and human islets; an ATG-deleted construct had no effect and Tunar shRNA knockdown reduced GSIS in mouse islets.'
    action: KEEP_AS_NON_CORE
    reason: 'Well-supported phenotype, and the ATG-deletion control ties it to the peptide rather than the RNA, but it is a downstream physiological consequence of altered beta-cell Ca2+ handling rather than something the peptide itself executes. Retained as non-core; the core role is at the level of ER Ca2+ homeostasis/SERCA binding.'
    supported_by:
    - reference_id: PMID:34513312
      supporting_text: "To verify that this effect was mediated by the translated micropeptide and not the RNA transcript, we transfected INS-1 cells with the 2nd ATG-deletion BNLN construct (which does not produce the micropeptide) and found that this construct did not affect GSIS"
