    reason: 'Multiple orthogonal interaction assays; together with the mouse SERCA2 co-IP (PMID:35036403) this establishes TUNAR as a SERCA-binding ER membrane micropeptide. A direction-specific regulator term (ATPase inhibitor activity GO:0042030, as for ERLN; or transporter activator activity GO:0141109, as for STRIT1/DWORF) is not supported because the two studies infer opposite effects (possible SERCA3 inhibition in beta cells, possible SERCA2 activation in neurons) and neither measured pump activity. ATPase binding is therefore the most informative defensible MF and is kept as core.'
