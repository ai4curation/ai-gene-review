description: >-
  TUNAR encodes pTUNAR (also called BNLN, beta cell and neural cell-regulin), a 48-amino-acid
  microprotein translated from a transcript long annotated as the long non-coding RNA TUNAR
  (TUNA, LINC00617; megamind in zebrafish). The peptide is highly conserved across vertebrates
  and carries a single C-terminal transmembrane helix that anchors it in the endoplasmic
  reticulum membrane. There it binds sarco/endoplasmic reticulum Ca2+-ATPases: SERCA3 (ATP2A3)
  in pancreatic beta cells, where the interaction increases at high glucose, and SERCA2
  (ATP2A2) in neural cells. Its sequence lacks the xLFxxF motif of the regulin family
  (phospholamban, sarcolipin, myoregulin, endoregulin) and is unrelated to DWORF, so it appears
  to be an independently evolved SERCA-binding micropeptide. Altering its level changes ER and
  cytosolic Ca2+ handling, but the direction differs by cell type. In glucose-stimulated beta
  cells, overexpression lowers ER Ca2+, raises cytosolic Ca2+, reduces ER stress signalling and
  enhances glucose-stimulated insulin secretion. In mouse neural cells, overexpression enlarges
  the ER Ca2+ store and speeds cytosolic Ca2+ clearance, consistent with SERCA2 activation. The
  mRNA is enriched in insulin-producing beta cells of the islet and in the central nervous
  system. Loss of the peptide in mouse embryonic stem cells promotes neural differentiation,
  and its overexpression reduces neurite formation, so pTUNAR acts as a Ca2+-dependent brake
  on neural differentiation. Whether it activates or inhibits SERCA pump activity directly has
  not been measured.
