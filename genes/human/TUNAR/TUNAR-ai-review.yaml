suggested_questions:
- question: >-
    Does pTUNAR/BNLN change SERCA pump kinetics directly, and in which direction? Beta-cell data
    (SERCA3; lower ER Ca2+) suggest inhibition, whereas neural data (SERCA2; faster cytosolic
    Ca2+ clearance) suggest activation. The answer decides whether GO:0042030 ATPase inhibitor
    activity, GO:0141109 transporter activator activity, or only the direction-neutral
    GO:1901894 regulation of ATPase-coupled calcium transmembrane transporter activity should be
    added, in line with ERLN and STRIT1 (DWORF).
- question: >-
    Is the opposite sign of the Ca2+ effect explained by SERCA isoform (SERCA3 vs SERCA2b) or by
    competition with other SERCA regulins expressed in each cell type (e.g. endoregulin with SERCA3)?
- question: >-
    Is the extracellular-vesicle pool of pTUNAR (seen for the overexpressed mouse peptide)
    physiologically relevant, or a by-product of overexpression?
suggested_experiments:
- hypothesis: pTUNAR directly alters SERCA2b and SERCA3 Ca2+-ATPase kinetics.
  description: >-
    Co-reconstitute purified synthetic pTUNAR with SERCA2b or SERCA3a in proteoliposomes, or
    co-express them in HEK293 microsomes, and measure Ca2+-dependent ATPase activity (Vmax and
    KCa), with phospholamban and DWORF as inhibitor and activator controls. Add FRET or
    crosslinking to test whether pTUNAR occupies the regulin groove.
- hypothesis: Endogenous pTUNAR is required for normal beta-cell Ca2+ oscillations and GSIS.
  description: >-
    Mutate the pTUNAR start codon in mouse beta cells or human stem-cell-derived beta cells,
    leaving the lncRNA intact as in the mESC knockout, and measure ER and cytosolic Ca2+
    oscillations, ER stress markers and glucose-stimulated insulin secretion.
