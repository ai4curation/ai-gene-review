core_functions:
- description: >-
    pTUNAR is a single-pass ER-membrane micropeptide that binds SERCA Ca2+-ATPases (SERCA3 in
    pancreatic beta cells, SERCA2 in neural cells) and modulates Ca2+ exchange between the ER
    lumen and the cytosol. The sign of the effect on SERCA pumping appears to depend on cell type:
    ER Ca2+ is lowered in glucose-stimulated beta cells but raised in neurons. Pump activity has
    not been measured directly, so the molecular function is recorded as SERCA (ATPase) binding
    rather than as activator or inhibitor activity.
  molecular_function:
    id: GO:0051117
    label: ATPase binding
  directly_involved_in:
