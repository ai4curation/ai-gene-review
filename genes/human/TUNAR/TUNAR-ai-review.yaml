  review:
    summary: 'Overexpression of BNLN lowered ER Ca2+ (ER-GCaMP6-150 biosensor) in glucose-stimulated INS-1 cells; BNLN binds SERCA3.'
    action: ACCEPT
    reason: 'The ER Ca2+ effect is measured directly and the peptide sits in the ER membrane bound to the ER Ca2+ pump, so it plausibly acts in, rather than merely upstream of, ER Ca2+ homeostasis. The mouse neuronal study (PMID:35036403) also finds altered ER Ca2+ store, although in the opposite direction, so the term (direction-neutral) is the appropriate level. Core process.'
