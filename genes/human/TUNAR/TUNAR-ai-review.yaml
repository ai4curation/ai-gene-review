    supporting_text: We further validated this interaction by co-immunoprecipitation (coIP)-western
      blot analysis in HEK293 cells with BNLN and SERCA3 overexpression
  - reference_id: PMID:34513312
    supporting_text: Overexpression of BNLN lowered [Ca2+]ER level in the high glucose (17 mM) condition
  - reference_id: PMID:35036403
    supporting_text: pTUNAR localizes in the membrane of the endoplasmic reticulum where it co-localizes
      and interacts with SERCA2
  - reference_id: PMID:35036403
    supporting_text: This is consistent with pTUNAR acting as a modulator of calcium dynamics via
      SERCA family proteins, which seems to be context and cell-type dependent.
