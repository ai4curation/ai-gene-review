id: Q96JB1
gene_symbol: DNAH8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH8 (dynein axonemal heavy chain 8; mouse Dnahc8) is a gamma-type outer dynein arm (ODA) heavy chain,
  the sperm-specific paralog of DNAH5. It is a 4490-residue motor protein with an N-terminal tail that
  assembles with the other ODA subunits, a ring of six AAA+ domains (AAA1 carries the hydrolytic ATP site),
  and a coiled-coil stalk ending in a microtubule-binding domain, and it generates force towards microtubule
  minus ends. DNAH8 is expressed in germ cells from early spermatocytes to late spermatids, is detected
  in the cytoplasm of spermatocytes during dynein preassembly, and in mature sperm lies along the flagellar
  axoneme, concentrated in the principal piece. In human sperm the ODA heavy chains are DNAH8 (gamma)
  and DNAH17 (beta), whereas respiratory cilia use DNAH5, DNAH9 and DNAH11 and lack DNAH8. DNAH8 and DNAH17
  depend on each other for stable incorporation into the sperm axoneme. Bi-allelic loss-of-function variants
  cause male infertility with asthenoteratozoospermia and multiple morphological abnormalities of the
  sperm flagella (MMAF; spermatogenic failure 46) without respiratory disease, and Dnah8-knockout male
  mice are sterile with MMAF; ICSI can achieve pregnancy. Mouse t-haplotype alleles of Dnahc8 contribute
  to the curlicue sperm-tail phenotype. Knockout and cancer studies also link DNAH8 to androgen signalling
  (an androgen-regulated gene in prostate cancer, and reduced fetal testosterone in knockout mice), but
  how an axonemal motor would do this is unexplained.
