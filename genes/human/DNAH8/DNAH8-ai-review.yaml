core_functions:
- description: >-
    Force-generating gamma heavy chain of the sperm outer dynein arm. Paired with the beta heavy chain
    DNAH17, DNAH8 uses ATP hydrolysis in its AAA1 site to walk towards microtubule minus ends, producing
    sliding between doublet microtubules that powers beating of the sperm flagellum. DNAH8 and DNAH17
    are required for each other's stable incorporation, and loss of DNAH8 causes MMAF and male infertility
    while motile cilia are spared.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0030317
    label: flagellated sperm motility
  locations:
  - id: GO:0036126
    label: sperm flagellum
  - id: GO:0005930
    label: axoneme
  in_complex:
    id: GO:0036157
    label: outer dynein arm
  supported_by:
  - reference_id: PMID:31178125
    supporting_text: >-
      the outer dynein arms (ODAs), through ATPase activity of their heavy chains (HCs), play a major
      role for cilia and flagella beating
  - reference_id: PMID:31178125
    supporting_text: >-
      We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin along
      the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus explaining
      the phenotype restricted to sperm cells.
  - reference_id: PMID:32619401
    supporting_text: >-
      DNAH8 is essential for sperm flagellar formation and that bi-allelic deleterious DNAH8 variants
      lead to male infertility with MMAF
  - reference_id: file:human/DNAH8/DNAH8-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Produces force towards the minus ends of microtubules
suggested_questions:
- question: >-
    Does DNAH8 form a heterodimeric outer arm with DNAH17 in every position along the sperm flagellum,
    or do midpiece and principal-piece ODAs differ in heavy-chain composition (the mouse protein is reported
    to be confined to the principal piece)?
- question: >-
    Do DNAH8 and DNAH17 assemble with the same intermediate chains, light chains and docking complex (ODAD1-4)
    as the respiratory DNAH5/DNAH9/DNAH11 arms, or are there sperm-specific ODA subunits?
- question: >-
    Is the reported link between DNAH8 and androgen signalling (prostate cancer AR activity, fetal testosterone
    in knockout mice) a direct, non-axonemal function, or a secondary effect of germ-cell or ciliary defects?
suggested_experiments:
- description: >-
    Cryo-electron tomography with subtomogram averaging of Dnah8-/- and Dnah17-/- mouse sperm axonemes
    to define the position and interdependence of the two heavy chains within the outer arm.
  experiment_type: cryo-electron tomography
- description: >-
    Purify sperm outer arm dynein (or recombinant DNAH8 motor domain) and measure ATPase activity and
    microtubule gliding, to confirm minus-end-directed motor activity of the gamma chain directly.
  experiment_type: in vitro motility assay
