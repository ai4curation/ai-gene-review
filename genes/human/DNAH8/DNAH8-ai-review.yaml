- term:
    id: GO:0060285
    label: cilium-dependent cell motility
  evidence_type: NAS
  original_reference_id: PMID:9373155
  qualifier: involved_in
  review:
    summary: >-
      Cilium-dependent cell motility, from the early testis dynein heavy chain survey.
    action: MODIFY
    reason: >-
      DNAH8 supplies the force-generating heavy-chain motor component of the sperm outer dynein arm,
      so it performs part of flagellar movement rather than merely marking infertility. Human
      localization places DNAH8 along sperm axonemes but not the examined respiratory cilia
      (PMID:31178125), making flagellated sperm motility the informative refinement. Human DNAH8
      variants and the Dnah8-knockout mouse phenotype independently support the sperm-flagellar
      requirement (PMID:32619401; PMID:32681648); these phenotypes are not measurements of purified
      motor kinetics. A bounded current QuickGO comparison recovers the same process on mouse Dnah1
      and Dnah11 with IMP records and on Dnah7a, Dnah7b and Dnah7c with electronic records. This
      supports the annotation convention for sperm axonemal motor subunits, not equivalent
      experimental proof for all comparators or an independent human assay. The original NAS source
      remains unchanged; the later human and mouse evidence supports the specific replacement.
    supported_by:
    - reference_id: PMID:9373155
      supporting_text: >-
        axonemal dyneins are essential for motility of cilia and flagella
    - reference_id: PMID:31178125
      supporting_text: >-
        We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin along
        the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus explaining
        the phenotype restricted to sperm cells.
    - reference_id: PMID:32619401
      supporting_text: >-
        Dnah8-knockout male mice also presented typical MMAF phenotypes and sterility.
    - reference_id: PMID:32681648
      supporting_text: >-
        a loss-of-function mutation in DNAH8 can cause male infertility with MMAF and that DNAH8 is
        essential for sperm flagellar formation
    proposed_replacement_terms:
    - id: GO:0030317
      label: flagellated sperm motility
