- id: PMID:31178125
  title: Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated
    Male Infertility Due to Asthenozoospermia.
  findings:
  - statement: >-
      DNAH8 and DNAH17, but not DNAH5/9/11, are the ODA heavy chains of the human sperm axoneme; DNAH17-mutant
      sperm lose DNAH8.
    supporting_text: >-
      We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin along
      the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus explaining
      the phenotype restricted to sperm cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (PMC6612517). Establishes the sperm-specific ODA heavy chain composition.
