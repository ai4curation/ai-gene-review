  evidence_type: IMP
  original_reference_id: PMID:17558416
  qualifier: involved_in
  review:
    summary: Depleting hnRNP A1 reduces processing of pri-miR-18a and lowers endogenous pre-miR-18a levels, so
      hnRNP A1 is required for the conversion of this primary transcript to its precursor.
    action: NEW
    reason: 'hnRNP A1 does part of the work of the process rather than merely being necessary for it: it binds
      the primary transcript and remodels it so that the Microprocessor can cleave, which is the auxiliary-factor
      role this term is used for. The entity performing the cleavage is Drosha, and no catalytic claim is made
      here. Comparator check (QuickGO by term id, verified to return positives): the same class of auxiliary factors
      carries it - DDX5 (IMP), SRSF3 (IMP), SRRT, PUS10 - and so does the paralogue HNRNPA2B1 (IDA), which is
      the decisive comparator since its annotation rests on the same kind of evidence. IMP: the experiments are
      RNAi depletion.'
    supported_by:
    - reference_id: PMID:17558416
      supporting_text: HeLa cells depleted of hnRNP A1 have reduced in vitro processing activity with pri-miR-18a
        and also show reduced abundances of endogenous pre-miR-18a.
    - reference_id: PMID:17558416
      supporting_text: Furthermore, we show that hnRNP A1 is required for miR-18a-mediated repression of a target
