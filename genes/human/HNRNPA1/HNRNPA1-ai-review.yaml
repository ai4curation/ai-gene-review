id: P09651
gene_symbol: HNRNPA1
product_type: PROTEIN
status: COMPLETE
description: 'Heterogeneous nuclear ribonucleoprotein A1 is one of the most abundant nuclear RNA-binding proteins.
  Its N-terminal half is a pair of tandem RNA recognition motifs - historically purified as the fragment UP1 -
  and its C-terminal half is a glycine-rich low-complexity, prion-like domain that contains an RGG box and the
  M9 shuttling sequence. The tandem RRMs read short single-stranded sequences, and one specificity explains most
  of the biology: UG/G-rich motifs in introns and exons of pre-mRNA, and the same UUAGGG-type repeat in telomeric
  DNA and in the telomeric long non-coding RNA TERRA. Through that activity the protein packages nascent pre-mRNA
  into hnRNP particles, is a component of the spliceosome including the catalytic step 2 complex, and acts as
  a sequence-specific repressor of splicing that sets splice-site choice on defined targets - repressing pyruvate
  kinase exon 9 in favour of exon 10, shifting the Bcl-x and AGER/RAGE isoform ratios - and it accompanies polyadenylated
  mRNA to the cytoplasm, shuttling continuously by way of the M9 signal read by transportin-1. Related activities
  include binding the primary transcript of miR-18a and licensing its Drosha-dependent processing, and binding
  the internal ribosome entry site of APAF1 to repress its translation, which enteroviral 3C protease relieves
  by cleaving the protein. The low-complexity domain is a second, structural activity: it drives liquid-liquid
  phase separation, the resulting droplets recruit the disordered regions of other granule proteins, and in cells
  the protein moves from the nucleus into cytoplasmic stress granules under p38/Mnk1-2 signalling. A steric-zipper
  motif inside that domain makes the same region aggregation-prone, and mutations that strengthen it convert reversible
  condensation into self-seeding fibril formation, causing multisystem proteinopathy - inclusion body myopathy
  with Paget disease of bone and frontotemporal dementia - and amyotrophic lateral sclerosis, while a deletion
  in the same region causes a dominant distal myopathy; a separate ALS variant disrupts the M9 nuclear localisation
  signal instead, trapping the protein in cytoplasmic inclusions. At telomeres the protein has a bidirectional
  role in vitro, relieving TERRA-mediated inhibition of telomerase when the two are balanced and sequestering
  the telomeric primer when in excess.'
