core_functions:
- description: 'Sequence-specific binding of intronic and exonic elements in pre-mRNA through the tandem RRMs,
    repressing use of the adjacent splice site and so setting alternative splice-site choice. This is the activity
    the protein is named for: an inhibitory hnRNP A1/A2 site lies immediately downstream of the pyruvate kinase
    exon 9 5'' splice site, blocking that site through the RGG box shifts the PKM1/PKM2 ratio, and the same activity
    controls the Bcl-x and AGER isoform choices. The protein carries it out as a component of spliceosomal complexes,
    including the catalytic step 2 complex.'
