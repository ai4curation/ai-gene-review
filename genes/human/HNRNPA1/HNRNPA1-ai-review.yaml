existing_annotations:
- term:
    id: GO:0000381
    label: regulation of alternative mRNA splicing, via spliceosome
  evidence_type: IMP
  original_reference_id: PMID:25689357
  qualifier: involved_in
  review:
    summary: 'Core process. hnRNP A1 is a sequence-specific repressor of splicing that changes splice-site choice
      on defined targets: it controls the mRAGE/esRAGE ratio of the AGER transcript, and the same activity sets
      the PKM exon 9/exon 10 choice.'
    action: ACCEPT
    reason: 'The claim is the gene''s central biological process and rests on loss- and gain-of-function in the
      cited paper, corroborated by independent work on PKM and on Bcl-x. The evidence code (IMP) fits: the experiments
      are knockdown and overexpression, not a direct assay of the purified protein.'
    additional_reference_ids:
    - PMID:20010808
    - PMID:28985503
    supported_by:
    - reference_id: PMID:25689357
      supporting_text: Glucose deprivation induced an increased ratio of mRAGE/esRAGE via up-regulation of hnRNP
        A1 and down-regulation of Tra2beta-1.
    - reference_id: PMID:17371836
      supporting_text: Finally, Sam68 interacted with heterogenous nuclear RNP (hnRNP) A1, and depletion of hnRNP
        A1 or mutations that impair this interaction attenuated Bcl-x(s) splicing.
