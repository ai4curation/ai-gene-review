suggested_questions:
- question: Should prion-like-domain client proteins that scaffold condensates in vitro - hnRNP A1, FUS, TDP-43,
    hnRNP A2/B1 - ever receive GO:0034063 stress granule assembly, or is the current convention (the term for
    nucleators only, with molecular condensate scaffold activity and the stress granule location for clients)
    the intended one? All four are annotated to GO:0140693 or proposed for it here, and none to GO:0034063.
  experts:
  - GO Consortium cell-component and condensate curators
- question: Two GO:0019904 protein domain specific binding rows on HNRNPA1 cite papers (PMID:10332027, PMID:10749975)
    whose abstracts concern the hnRNP G family - RBMY, RBMX, hnRNP G-T - and whose With/From values are the partners
    of those proteins. Can a UniProt curator with the full texts confirm whether hnRNP A1 was assayed, or whether
    the intended subject is RBMX?
  experts:
  - UniProt curators
- question: Is there scope for a molecular function term for internal-ribosome-entry-site binding? hnRNP A1's
    repression of APAF1 translation, and its enhancement of enteroviral IRES activity, are both mediated by binding
    a structured 5' UTR element, and the only existing term is the process GO:0075522 IRES-dependent viral translational
    initiation.
  experts:
  - GO Consortium molecular function curators
suggested_experiments:
- hypothesis: hnRNP A1's low-complexity domain contributes to the material properties of stress granules but is
    not required for their assembly.
  description: 'Delete the low-complexity domain at the endogenous HNRNPA1 locus (and in an HNRNPA1/HNRNPA2B1
    double background, given the documented redundancy of the two paralogues in splicing), then measure arsenite-induced
    granule number, size and persistence, and granule material state by fluorescence recovery after photobleaching
    and by 1,6-hexanediol sensitivity. Separating assembly from material state is the point: a wild-type granule
    count with slowed internal dynamics would support a scaffold contribution without supporting a stress granule
    assembly annotation.'
- hypothesis: hnRNP A1 licenses the processing of a defined set of primary microRNAs sharing its UG/G-rich binding
    motif, not pre-miRNA hairpins generally.
  description: Map binding transcriptome-wide on primary transcripts by individual-nucleotide-resolution CLIP
    in Drosha-depleted cells, so pri-miRNAs are not consumed, and pair it with small-RNA sequencing after acute
    hnRNP A1 degradation. Test whether the pri-miRNAs whose processing drops are those carrying the motif, and
    whether RRM point mutants and an RGG-box deletion separate binding from the processing requirement.
- hypothesis: Repression of APAF1 translation by hnRNP A1 operates in unstressed cells and sets the apoptotic
    threshold, rather than being a feature of enteroviral infection.
  description: Degrade hnRNP A1 acutely with a degron tag in uninfected cells and measure APAF1 protein by immunoblot
    and APAF1 IRES activity with a bicistronic reporter, alongside polysome profiling of endogenous APAF1 mRNA.
    Rescue with a construct lacking the 3C protease cleavage site, and with an RRM mutant that cannot bind the
    5' UTR, to show the effect runs through binding.
knowledge_gaps:
- gap_statement: Whether hnRNP A1's condensate scaffold activity is required for stress granules to form or to
    behave as liquids in cells is unknown. The reconstitution evidence that it can scaffold a condensate is strong,
    and depleting it impairs recovery from stress, but no experiment separates a requirement for granule assembly
    or material state from the loss of its nuclear splicing and export functions.
  boundary: 'Known: the low-complexity domain is sufficient for phase separation in vitro; hnRNP A1 droplets recruit
    other granule proteins'' disordered regions; the protein enters stress granules on p38/Mnk1-2 signalling and
    mRNA binding is required for entry; depletion slows recovery from stress. Unknown: whether granules still
    assemble, and with what material properties, when hnRNP A1 is removed or its low-complexity domain deleted
    at the endogenous locus.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: This is the gap that decides whether stress granule assembly is an annotatable process for hnRNP
    A1. GO currently gives GO:0034063 to the nucleators (G3BP1/2, TIA1, UBAP2L, ATXN2) and to none of the prion-like-domain
    client proteins, including FUS, TDP-43 and HNRNPA2B1, and this review follows that convention rather than
    proposing the term.
- gap_statement: 'The scope of hnRNP A1''s role in microRNA biogenesis is unknown: miR-18a is the one primary
    transcript whose processing has been shown to require it, and whether the pre-miRNA hairpins recovered in
    interactome screens are bound by the same surface, and to the same effect, has not been tested.'
  boundary: 'Known: specific binding to pri-miR-18a before Drosha processing, and a processing requirement shown
    by depletion; recovery with many distinct pre-miRNA hairpins in a pull-down compendium. Unknown: which other
    primary transcripts depend on it, whether binding is through the RRMs or the RGG box, and whether pre-miRNA
    binding has any functional consequence.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Determines whether the microRNA role is a single-target curiosity or a general activity worth
    annotating more broadly, and whether the existing hairpin-binding annotation describes the same activity.
