- term:
    id: GO:0006405
    label: RNA export from nucleus
  evidence_type: IC
  original_reference_id: PMID:8521471
  qualifier: involved_in
  supporting_entities:
  - GO:0051168
  review:
    summary: Curator inference that hnRNP A1 carries RNA out of the nucleus - the functional reading of the M9
      shuttling data and the claim UniProt curates as its function.
    action: ACCEPT
    reason: 'This is the participation claim that the shuttling evidence actually supports: hnRNP A1 binds pre-mRNA
      in the nucleus and accompanies poly(A) mRNA to the cytoplasm, so it performs part of the export work rather
      than merely being exported. Kept as core. The companion rows are treated differently for exactly this reason
      - the generic nuclear-export row is refined to this term, and the import row is marked an over-annotation
      because there hnRNP A1 is the cargo.'
    supported_by:
    - reference_id: PMID:8521471
      supporting_text: strengthen the suggestion that A1 and other shuttling hnRNPs function as carriers for RNA
        during export to the cytoplasm
    - reference_id: file:human/HNRNPA1/HNRNPA1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: transport of poly(A) mRNA from the nucleus to the cytoplasm
- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: Membrane localisation from a high-throughput membrane-fraction proteomic dataset.
    action: MARK_AS_OVER_ANNOTATED
    reason: hnRNP A1 has no transmembrane segment, lipid anchor or signal peptide anywhere in the UniProt feature
      table. Recovery in a membrane fraction is the expected behaviour of an abundant, phase-separating RNA-binding
      protein and does not support a membrane location. The same dataset produced the same row on the paralogue
      HNRNPA2B1, where this project also marked it an over-annotation. Not removed outright because the detection
      itself is real; it is the interpretation as a location that exceeds the evidence.
- term:
    id: GO:0019904
    label: protein domain specific binding
  evidence_type: IPI
  original_reference_id: PMID:10332027
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0DJD4
  review:
    summary: Protein domain specific binding towards RBMY1C, from a paper whose abstract is entirely about the
      hnRNP G family rather than hnRNP A1.
    action: UNDECIDED
    reason: I cannot verify this row. The cited paper is a two-hybrid study of RBM/RBMY partners that identifies
      T-STAR/etoile, a SAM68 relative, and concludes that 'RBM and other hnRNP G family members are candidate
      downstream targets'; neither the title nor the abstract mentions hnRNP A1, and the With/From value (RBMY1C)
      is one of the two proteins the paper does pair. The cached record is abstract-only, so the full text could
      well assay hnRNP A1 - it is the classic 5'-splice-site modulator and a natural comparator in this work -
      and repository policy forbids asserting a wrong-gene attribution on that basis. UNDECIDED rather than REMOVE,
      with the question filed upstream as a check. Note separately that the term itself carries little functional
      information.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      slot: DB_Object_ID
      requested_change: CHECK
      asserted_value: UniProtKB:P09651
      cause: UNKNOWN
      confidence: SUSPECTED
