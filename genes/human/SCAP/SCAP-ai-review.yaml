core_functions:
- description: 'Cholesterol sensor of the ER membrane: the sterol-sensing domain binds cholesterol, which changes
    SCAP''s conformation, promotes binding to INSIG1/INSIG2 and hides the MELADL export signal, so SREBP export
    stops when ER cholesterol is high.'
  molecular_function:
    id: GO:0032935
    label: sterol sensor activity
  directly_involved_in:
  - id: GO:0032933
    label: SREBP signaling pathway
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  in_complex:
    id: GO:0032937
    label: SREBP-SCAP-Insig complex
  supported_by:
  - reference_id: PMID:15260976
    supporting_text: cholesterol acts by binding with high affinity and specificity to the 767 amino acid octahelical
      membrane region of SCAP
  - reference_id: PMID:17428920
    supporting_text: Cholesterol acts by binding to the SREBP-escort protein Scap, thereby causing Scap to bind
      to anchor proteins called Insigs.
  - reference_id: PMID:33446483
    supporting_text: A 25HC molecule is sandwiched between the S4 to S6 segments in Scap and TMs 3 and 4 in Insig-2
      in the luminal leaflet of the membrane.
- description: 'ER-export escort (cargo receptor) for SREBP-1 and SREBP-2: SCAP binds SREBP via its WD40 domain
    and, when sterols are low, binds Sar1-Sec23/Sec24 through MELADL, loading the SCAP-SREBP complex into COPII
    vesicles for transport to the Golgi, where S1P/S2P release the active SREBP transcription factor that induces
    cholesterol synthesis.'
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  directly_involved_in:
  - id: GO:0090110
    label: COPII-coated vesicle cargo loading
  - id: GO:0032933
    label: SREBP signaling pathway
  - id: GO:0045542
    label: positive regulation of cholesterol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0012507
    label: ER to Golgi transport vesicle membrane
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:0032936
    label: SREBP-SCAP complex
  supported_by:
  - reference_id: PMID:15899885
    supporting_text: Sec23/24 binding to Scap requires the hexapeptide sequence MELADL located in a cytoplasmic
      loop of Scap. This hexapeptide acts as a sterol-regulated ER sorting signal.
  - reference_id: PMID:12242332
    supporting_text: In sterol-depleted cells, SCAP escorts SREBPs to the Golgi where the SREBPs are processed by
      two membrane-bound proteases
  - reference_id: PMID:32432943
    supporting_text: In hepatic Scap -deficient mice, all three SREBFs in the nucleus reduced dramatically, leading
      to an 80% decrease of cholesterol and fatty acid synthesis rate in the liver.
suggested_questions:
- question: Should GO gain a specific child of cargo receptor activity for sterol-regulated ER export of SREBPs
    (an 'SREBP escort' activity), or is GO:0038024 cargo receptor activity the intended term for SCAP's role? SCAP
    carries no informative molecular function in GOA beyond sterol binding.
- question: The human GO-CAM gocams/6205c24300000880 (SREBP regulation and retention by the SREBP-SCAP complex)
    has no SCAP activity node; the SREBP-SCAP complex appears only as an input to INSIG sequestering activity. Should
    SCAP be added with sterol sensor activity and cargo receptor activity (part of COPII-coated vesicle cargo loading),
    causally upstream of S1P/S2P cleavage of SREBP?
- question: Is the ComplexPortal-derived 'regulation of transcription by RNA polymerase II' annotation for every
    SREBP-SCAP complex subunit intended? SCAP acts in the ER/Golgi membrane upstream of SREBP release and has no
    transcriptional activity of its own.
- question: How does SCAP's direct binding of 25-hydroxycholesterol at the SCAP-INSIG-2 interface relate to the
    model in which oxysterols act only by binding INSIG? Does SCAP contribute to oxysterol sensing as a composite
    site?
suggested_experiments:
- description: Reconstitute purified human SCAP (wild type, Y298C, D443N and Loop1/Loop7 mutants) in proteoliposomes
    with defined cholesterol content and measure Sec23/Sec24 (Sar1-GTP) binding and INSIG association, to define
    the cholesterol threshold and cooperativity of the human sensor.
  experiment_type: in vitro biochemical reconstitution
  hypothesis: Human SCAP switches from COPII-binding to INSIG-binding at a sharp ER cholesterol threshold (~5% of
    ER lipid), set by the SSD.
- description: 'Map the retrograde Golgi-to-ER return of SCAP: live imaging of endogenously tagged SCAP in SPRING1,
    PAQR3 and COPI-depleted human cells, with S1P inhibition, to identify the retrieval signal and the proteins
    that release SCAP from the Golgi.'
  experiment_type: genome editing / live-cell imaging
  hypothesis: SCAP return to the ER uses a COPI-dependent signal that becomes available after SREBP cleavage and
    requires SPRING1.
