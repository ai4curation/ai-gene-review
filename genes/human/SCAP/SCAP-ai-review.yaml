id: Q12770
gene_symbol: SCAP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SCAP (SREBP cleavage-activating protein, SREBF chaperone) is a polytopic membrane protein of the endoplasmic
  reticulum that acts as the cell's cholesterol sensor and as the escort that delivers the membrane-bound transcription
  factors SREBP-1 and SREBP-2 from the ER to the Golgi. Its N-terminal eight-transmembrane region contains a sterol-sensing
  domain that binds cholesterol, and its C-terminal cytosolic WD40 domain binds the regulatory domain of SREBPs,
  forming a stable SREBP-SCAP complex. When ER cholesterol is low, a cytosolic loop of SCAP exposes the MELADL sorting
  signal, which is bound by the COPII proteins Sar1-Sec23/Sec24, so the SCAP-SREBP complex is packaged into COPII
  vesicles and travels to the Golgi; there the proteases S1P and S2P release the SREBP transcription-factor domain,
  which activates genes for cholesterol and fatty-acid synthesis and LDL uptake. SCAP then returns to the ER. When
  ER cholesterol rises, cholesterol binding to luminal loop 1 changes SCAP's conformation, promoting binding to
  the ER anchor proteins INSIG1/INSIG2 (which also bind oxysterols), masking MELADL and retaining the complex in
  the ER. This gives end-product feedback control of cellular cholesterol. The Golgi protein PAQR3, the E3 ligases
  RNF139 and RNF145, and the Golgi factor SPRING1 modulate SCAP trafficking.
