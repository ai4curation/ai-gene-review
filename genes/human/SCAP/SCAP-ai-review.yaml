- term:
    id: GO:0032935
    label: sterol sensor activity
  evidence_type: IDA
  original_reference_id: PMID:15260976
  review:
    summary: SCAP binds cholesterol in its sterol-sensing membrane domain and responds with a conformational change
      that controls COPII binding.
    action: NEW
    reason: 'Sterol sensor activity (binding to and responding, e.g. by conformational change, to changes in the
      cellular level of a sterol) is the defining activity of SCAP and is not represented in GOA, which carries
      only sterol binding. Purified SCAP membrane domain binds cholesterol with high affinity and specificity; cholesterol
      changes SCAP conformation (trypsin protection), is proposed to disrupt the luminal Loop1-Loop7 interaction
      (still unproven, PMID:27068746), and hides the cytosolic MELADL signal from COPII. Comparator check: this
      term is carried by other cholesterol sensors such as SLC38A9 and OSBPL1A, so its absence from SCAP is a gap
      rather than a convention. The data are largely from hamster Scap; the human Scap-INSIG-2 structure shows the
      same sterol-sensing domain arrangement.'
    supported_by:
    - reference_id: PMID:15260976
      supporting_text: cholesterol acts by binding with high affinity and specificity to the 767 amino acid octahelical
        membrane region of SCAP
    - reference_id: PMID:12963821
      supporting_text: the conformation of SCAP is altered in vitro by addition of cholesterol to ER membranes
    - reference_id: PMID:27068746
      supporting_text: When ER cholesterol rises, it binds to Loop1. We hypothesized that this causes dissociation
        from Loop7, abrogating COPII binding.
    - reference_id: PMID:17428919
      supporting_text: Cysteine labeling shows that both binding events produce a conformational change near the
        MELADL sequence, abrogating COPII binding but not anti-MELADL binding.
- term:
    id: GO:0038024
    label: cargo receptor activity
  evidence_type: IDA
  original_reference_id: PMID:15899885
  review:
    summary: SCAP binds its SREBP cargo through the WD40 domain and the COPII Sec23/Sec24 coat through the MELADL
      signal, recruiting SREBP into COPII vesicles.
    action: NEW
    reason: 'SCAP''s escort role matches the definition of cargo receptor activity: a membrane-spanning protein
      that binds cargo and coat adaptors at the same time to recruit cargo into nascent vesicles. SREBPs bind SCAP
      from synthesis onward and cannot leave the ER without it; Sar1-dependent Sec23/24 binding to SCAP requires
      MELADL, and blocking MELADL blocks SCAP-SREBP movement. Comparator check: other ER-exit COPII cargo receptors
      (CNIH1/CNIH2 by IBA, LMAN1, MIA3) carry this term. GO has no SREBP-specific escort term; see suggested_questions.'
    supported_by:
    - reference_id: PMID:15899885
      supporting_text: Sec23/24 binding to Scap requires the hexapeptide sequence MELADL located in a cytoplasmic
        loop of Scap. This hexapeptide acts as a sterol-regulated ER sorting signal.
    - reference_id: PMID:17428919
      supporting_text: anti-MELADL blocks COPII binding in vitro, and microinjection of Fab anti-MELADL blocks Scap.SREBP
        movement in cells
    - reference_id: PMID:12242332
      supporting_text: In sterol-depleted cells, SCAP escorts SREBPs to the Golgi where the SREBPs are processed
        by two membrane-bound proteases
    - reference_id: PMID:32432943
      supporting_text: Without SCAP, SREBFs in the ER are unstable and cannot translocate to the Golgi apparatus.
