id: O15121
gene_symbol: DEGS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DEGS1, also called DES1, is a membrane sphingolipid delta-4 desaturase (EC 1.14.19.17) that
  converts dihydroceramide to ceramide by introducing a trans double bond into the N-acyl sphingoid backbone.
  Its oxygen- and cytochrome-b5-dependent reaction supplies ceramide for complex sphingolipid synthesis.
  The protein contains conserved histidine-rich membrane-desaturase motifs and is predicted to span the
  membrane multiple times. It acts principally at the cytoplasmic face of the endoplasmic reticulum and
  is enriched at ER–mitochondrial contact domains; mitochondrial localization has also been reported in
  specific cellular contexts. Disruption of this lipid conversion causes hypomyelinating leukodystrophy
  18 and disturbs myelin and membrane homeostasis. Retinol isomerization is experimentally supported,
  while its physiological contribution to retinal chromophore regeneration remains unsettled.
