core_functions:
- description: Catalyzes the oxygen- and cytochrome-b5-dependent delta-4 desaturation of N-acylsphinganine
    to N-acylsphing-4-enine in ceramide biosynthesis, at the cytoplasmic face of the ER membrane, including
    ER–mitochondrial contact regions.
  molecular_function:
    id: GO:0042284
    label: sphingolipid delta-4 desaturase activity
  directly_involved_in:
  - id: GO:0046513
    label: ceramide biosynthetic process
  locations:
  - id: GO:0098554
    label: cytoplasmic side of endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:11937514
  - reference_id: PMID:30620338
  - reference_id: PMID:36951944
    supporting_text: DEGS1 was present in several cell compartments, although it was significantly
      enriched in the MAM fraction
  - reference_id: Reactome:R-HSA-428259
    supporting_text: enzyme associated with the cytosolic face of the endoplasmic reticulum
  - reference_id: file:human/DEGS1/DEGS1-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=an N-acylsphinganine + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = an N-acylsphing-4-enine
      + 2 Fe(III)-[cytochrome b5] + 2 H2O;
proposed_new_terms: []
suggested_questions:
- question: Under which physiological cellular and species contexts does DEGS1 retinol-isomerase activity
    materially contribute to visual chromophore regeneration, independently of its effects on sphingolipid
    composition?
- question: Which endogenous human DEGS1 pools reside within mitochondrial membranes, and which reside
    in adjacent ER contact domains, under basal and altered myristoylation conditions?
suggested_experiments:
- description: Resolve endogenous human DEGS1 membrane topology and ER-contact versus mitochondrial residence
    using validated compartment markers and orthogonal localization assays.
- description: Compare human DEGS1 desaturation and retinol-isomerization activities in matched reconstituted
    preparations and active-site variants. Quantify both products with authentic standards, and control
    protein abundance, folding, membrane insertion and electron-donor availability, so loss of activity
    can be distinguished from misfolding or mistargeting.
