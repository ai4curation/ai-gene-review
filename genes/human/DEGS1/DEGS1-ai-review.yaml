- id: PMID:11937514
  title: Identification and characterization of a sphingolipid delta 4-desaturase family.
  findings:
  - statement: Human DES1 expressed in sur2-deficient yeast produces delta-4-unsaturated sphingolipids;
      the assay measures hydrolyzed cellular products. Minor hydroxylated products accompany predominant
      desaturation, preventing an absolute exclusion of hydroxylase side activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identity verified; selected indexed original Methods and Results read. Full-length human
      DES1 in sur2-deficient yeast produces delta-4-unsaturated sphingolipids. This is a hydrolyzed cellular-product
      assay, not purified free-sphinganine turnover. Small hydroxylated signals across human/fly/fungal
      constructs prevent an absolute no-side-activity claim.
- id: PMID:1317856
  title: Subcellular localization and membrane topology of serine palmitoyltransferase, 3-dehydrosphinganine
    reductase, and sphinganine N-acyltransferase in mouse liver.
  findings:
  - statement: Mouse-liver serine palmitoyltransferase, 3-dehydrosphinganine reductase and sphinganine
      N-acyltransferase activities were localized to the cytosolic face of the ER. These are upstream
      sphingolipid-pathway findings, not an independently verified human DEGS1 topology measurement.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PMID and title verified; full original unavailable. The abstract specifies mouse-liver
      upstream enzymes. It cannot independently resolve the target-specific leaflet evidence; no wrong-gene
      inference is made.
- id: PMID:16120614
  title: Serinc, an activity-regulated protein family, incorporates serine into membrane lipid synthesis.
  findings:
  - statement: SERINC proteins facilitate serine incorporation into membrane lipids; rat SERINC1 colocalizes
      with lipid biosynthetic enzymes in the ER. This provides pathway and compartment context without
      establishing which DEGS1-specific experiment underlies the imported annotation.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PMID and title verified; abstract available but original inaccessible. The DEGS1-specific
      topology experiment underlying the source annotation remains unverified.
- id: PMID:19647031
  title: 'N-Myristoylation targets dihydroceramide Delta4-desaturase 1 to mitochondria: partial involvement
    in the apoptotic effect of myristic acid.'
  findings:
  - statement: Myristoylation targets part of recombinant DES1 to mitochondria in COS-7 cells; native
      desaturase activity is detected in both ER and mitochondria of rat hepatocytes. Myristoylatable
      and unmyristoylatable constructs differ in the reported apoptotic response.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: PMID, title and abstract verified. The full original was not recovered. Positive myristoylation/localization
      observations are retained with unresolved recombinant construct species, membrane topology and fraction-purity
      controls.
- id: PMID:23143414
  title: Identification of DES1 as a vitamin A isomerase in Müller glial cells of the retina.
  findings:
  - statement: Human DES1 expression increases retinol isomerization in 293T-cell homogenates and partially
      rescues the retinoid/visual phenotype of Rpe65-deficient mice. Purified-enzyme and Müller-cell knockdown
      experiments use chicken DES1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods and Results read. Human expression-cell activity and mouse rescue with
      human DES1 are distinct from chicken purified-enzyme and chicken Müller-cell knockdown experiments.
      Positive biochemical retinol activity does not by itself settle a universal physiological cone-visual-cycle
      role.
- id: PMID:24209621
  title: A four-step cycle driven by PI(4)P hydrolysis directs sterol/PI(4)P exchange by the ER-Golgi
    tether OSBP.
  findings:
  - statement: OSBP couples ER–Golgi tethering and sterol transfer to PI(4)P countertransport and Sac1-dependent
      hydrolysis. This is lipid-contact-site context; the specific DEGS1 sphingomyelin result remains
      unresolved.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PMID and title verified; only abstract/metadata recovered. The DEGS1-specific sphingomyelin
      IDA evidence could not be adjudicated. The title naming OSBP is not grounds for declaring misattribution.
- id: PMID:30620337
  title: Loss of the sphingolipid desaturase DEGS1 causes hypomyelinating leukodystrophy.
  findings:
  - statement: Human DEGS1 deficiency increases dihydroceramide relative to ceramide and causes hypomyelinating
      leukodystrophy. Zebrafish knockdown links disturbed lipid ratios to reduced myelinating oligodendrocytes
      and locomotor defects.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine publisher original Methods and Results read, supplementing a cached extraction
      lacking those sections. Human patient lipidomics and zebrafish knockdown support desaturation-dependent
      lipid and myelin phenotypes; no purified human enzyme assay is claimed.
- id: PMID:30620338
  title: DEGS1-associated aberrant sphingolipid metabolism impairs nervous system function in humans.
  findings:
  - statement: Human A280V DEGS1 has reduced cellular activity and stability. WT and mutant constructs
      predominantly overlap ER markers, and patient fibroblasts and DEGS1-null HAP1 cells accumulate dihydrosphingolipids.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine JCI original Methods and Results read separately from the immutable abstract-only
      cache. Sequence-verified human constructs, ER imaging, patient fibroblasts and human HAP1 knockouts
      support localization and cellular desaturation; labeled-base hydrolysis is not purified free-sphinganine
      turnover.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: The human binary interaction map contains DEGS1 pairs with ARLN and SEMA4G in validated
      two-hybrid records. These physical positives do not establish a physiological signaling or enzymatic
      role for DEGS1 in those partnerships.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original HuRI retesting/sequence-confirmation methods and exact human IntAct pairs to
      ARLN Q8WVX3-2 and SEMA4G Q9NTN9-2 were read. Positive pair evidence is retained; no endogenous physiological
      complex or pair-specific orthogonal validation is inferred.
- id: PMID:34080016
  title: Glucosylceramide and galactosylceramide, small glycosphingolipids with significant impact on
    health and disease.
  findings:
  - statement: Ceramide supplies the substrate for glucosylceramide and galactosylceramide synthesis,
      while UGCG and UGT8 perform sugar transfer. DEGS1 contributes precursor chemistry rather than the
      glycosyltransferase reaction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full review biosynthesis sections read. It describes ceramide supply and assigns sugar
      transfer to UGCG/UGT8. It is contextual synthesis, not a newly observed direct DEGS1 assay.
- id: PMID:9188692
  title: 'The product of the MLD gene is a member of the membrane fatty acid desaturase family: overexpression
    of MLD inhibits EGF receptor biosynthesis.'
  findings:
  - statement: Human MLD/DEGS1 is a detergent-extractable membrane protein with conserved histidine motifs
      and ER localization. Its overexpression selectively reduces EGF-receptor biosynthesis relative to
      the tested PDGF-receptor comparison.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PMID, title and complete abstract verified; full original unavailable. The abstract
      supports human ER localization and membrane association. Contextual plasma-membrane retention is
      independently corroborated by the Reactome model, without claiming recovery of the original localization
      assay. Positive later human sphingolipid chemistry refines the historical fatty-acid pathway description.
- id: Reactome:R-HSA-1660661
  title: Sphingolipid de novo biosynthesis
  findings: []
- id: Reactome:R-HSA-428259
  title: DEGS1 dehydrogenates dihydroceramide
  findings:
  - statement: The DEGS1-catalyzed conversion of dihydroceramide to ceramide is placed on the cytosolic
      face of the ER; detailed stoichiometry and cofactor requirements incorporate evidence from rat microsomes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official event/catalyst/entity records assign DEGS1 ER-membrane desaturation. The event
      notes that detailed reaction stoichiometry and cofactor requirements derive from rat microsome work.
- id: Reactome:R-HSA-6799350
  title: Exocytosis of specific granule membrane proteins
  findings:
  - statement: DEGS1 is included in a specific-granule membrane protein set transported to the plasma
      membrane during exocytosis, providing a context-specific localization model.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official event inputs and outputs trace through explicit sets to O15121 in specific-granule
      and plasma membranes. This supports context-specific TAS locations; the underlying proteomic peptide
      assignments were not independently audited.
- id: file:human/DEGS1/DEGS1-uniprot.txt
  title: UniProtKB entry O15121 (DEGS1_HUMAN)
  findings:
  - statement: UniProt records the core catalytic activity (EC 1.14.19.17; N-acylsphinganine plus O2 plus
      Fe(II)-cytochrome b5 giving N-acylsphing-4-enine), ER and mitochondrion membrane localization, DEGS-subfamily
      membership, and causation of HLD18.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated UniProt record for O15121; the source of the file supporting quotes.
- id: PMID:36951944
  title: Sphingolipid desaturase DEGS1 is essential for mitochondria-associated membrane integrity.
  findings:
  - statement: DEGS1 is enriched at ER–mitochondrial contact domains in human fibroblasts and human brain
      fractions. Its deficiency alters lipid composition, contact geometry and downstream MAM functions
      without establishing additional DEGS1 catalytic reactions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original human fibroblast imaging and human brain fractionation establish MAM enrichment,
      with mouse supporting experiments. Downstream PS/PE and cholesteryl-ester changes do not establish
      additional DEGS1 catalytic activities.
- id: PMID:30645148
  title: Conditional deletion of Des1 in the mouse retina does not impair the visual cycle in cones.
  findings:
  - statement: Conditional deletion of Des1 in mouse Müller cells preserves cone sensitivity and rapid
      dark adaptation under the tested conditions, limiting an obligatory role in cone pigment regeneration.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original mouse Müller-cell conditional-deletion Methods and Results read. Normal cone
      responses and rapid dark adaptation limit obligatory visual-cycle claims; residual whole-retinal
      activity and cell-type specificity constrain generalization.
- id: PMID:32238432
  title: Non-photopic and photopic visual cycles differentially regulate immediate, early, and late phases
    of cone photoreceptor-mediated vision.
  findings:
  - statement: Zebrafish degs1 knockout does not eliminate the tested larval photopic visual responses,
      limiting claims of universal visual-cycle essentiality.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original zebrafish degs1 knockout/genotyping and 5-dpf visual Results read. Normal tested
      photopic behavior limits essentiality under these conditions; age, assay sensitivity and compensation
      prevent a universal negative claim.
