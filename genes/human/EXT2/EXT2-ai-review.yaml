- id: ComplexPortal:CPX-8307
  title: EXT1-EXT2 heparan sulfate biosynthesis complex
  findings: []
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: Live official CPX-8307 response verifies the human Q16394/Q93063 heterodimer and original-paper
      links. Its GO:0043541 component cross-reference denotes a different dolichol-synthesis complex,
      while current GO:0120504 represents EXT1–EXT2. A separate function-prose linkage query is recorded.
      These defects do not invalidate the experimentally established assembly. No upstream report has
      been sent.
core_functions:
- description: Add N-acetylglucosamine from UDP-GlcNAc in alpha-1,4 linkage to a GlcA-terminated heparan
    sulfate acceptor through the EXT2 GT-A catalytic domain. This is the principal GlcNAc-transfer step
    of the Golgi EXT1–EXT2 elongation complex. Human-complex product assays and catalytic substitutions
    support direct participation in proteoglycan chain synthesis. EXT2 also contributes as an assembled
    subunit to the complex’s beta-1,4-GlcA transfer, whose principal catalytic site is EXT1 GT-B. This
    complex contribution is distinct from the low positive GlcA activity reported for the older separately
    expressed soluble EXT2 preparation.
  molecular_function:
    id: GO:0050508
    label: glucuronosyl-N-acetylglucosaminyl-proteoglycan 4-alpha-N-acetylglucosaminyltransferase activity
  directly_involved_in:
  - id: GO:0015012
    label: heparan sulfate proteoglycan biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:0120504
    label: EXT1-EXT2 complex
  supported_by:
  - reference_id: PMID:12907669
  - reference_id: PMID:36402845
  - reference_id: PMID:36593275
  - reference_id: PMID:35137078
  contributes_to_molecular_function:
    id: GO:0050509
    label: N-acetylglucosaminyl-proteoglycan 4-beta-glucuronosyltransferase activity
suggested_questions:
- question: What accounts for the low GlcA-transfer activity measured in the older soluble human EXT2
    preparation, and does that capacity contribute measurably to chain extension by an intact human EXT1–EXT2
    complex?
- question: How do the three source-described human EXT2 products differ in expression, membrane localization,
    EXT1 assembly and GlcNAc-transfer activity?
suggested_experiments:
- hypothesis: Preparation integrity, partner content and acceptor conditions help explain the difference
    between the older positive soluble-EXT2 GlcA result and the predominant EXT1 GlcA site in modern heterocomplex
    assays.
  description: Compare sequence-verified human full-length and soluble EXT2 preparations with matched
    EXT1–EXT2 complexes using the older oligosaccharide acceptors and modern defined primers. Quantify
    intact enzyme, endogenous EXT1 carryover and assembly before measuring both single-sugar transfers
    and product-resolved chain extension. Include catalytic substitutions, donor-omission controls and
    membrane-reconstituted complexes to separate positive capacity from its quantitative contribution
    in the assembled enzyme.
  experiment_type: Controlled biochemical comparison and product analysis
- hypothesis: Sequence differences among the 718-, 728- and 751-residue products may alter abundance,
    trafficking or complex activity without having identical effects on each property.
  description: Verify each transcript and protein sequence, then compare matched-expression constructs
    in an EXT2-deficient human cell background. Measure protein abundance, Golgi and ER distribution,
    EXT1 association and cell-surface heparan sulfate alongside enzyme assays on intact purified complexes.
    Normalize activity to stable assembled protein and retain endogenous transcript/protein measurements
    to distinguish a construct phenotype from physiological product usage.
  experiment_type: Product-specific cellular complementation and enzymology
