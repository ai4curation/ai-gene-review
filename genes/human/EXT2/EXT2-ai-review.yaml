- term:
    id: GO:0000271
    label: polysaccharide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:12907669
  qualifier: involved_in
  review:
    summary: The demonstrated biosynthetic work is heparan-sulfate chain elongation.
    action: MODIFY
    reason: PMID:12907669 shows strong polymerization by the soluble human EXT1–EXT2 preparation, while
      EXT2 alone gives a small single-GlcA extension rather than appreciable chain elongation. Independent
      human heterocomplex experiments in PMID:36593275 identify EXT2-mediated GlcNAc transfer and directly
      elongate glypican-1-associated chains. Replace the broad polysaccharide process with the already-carried
      heparan sulfate proteoglycan process. This is a lateral evidence-based specificity correction, not
      a claim of current ontology ancestry or that EXT2 synthesizes the core protein and linker.
    supported_by:
    - reference_id: PMID:12907669
    - reference_id: PMID:36593275
    proposed_replacement_terms:
    - id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
- term:
    id: GO:0001503
    label: ossification
  evidence_type: IMP
  original_reference_id: PMID:9326317
  qualifier: involved_in
  review:
    summary: EXT2 has a supported skeletal-developmental phenotype distinct from its core catalytic reaction.
    action: KEEP_AS_NON_CORE
    reason: The complete scanned PMID:9326317 original identifies EXT2 mutations segregating with hereditary
      multiple exostoses in human families, including truncating variants and D227N, and documents osteocartilaginous
      outgrowths and variable skeletal severity. Its operative assays are family genotyping and clinical
      assessment, not a cell-based bone-formation assay. Retain this curator-assigned ossification phenotype
      as a non-core developmental consequence of EXT2 dysfunction, without claiming that EXT2 directly
      deposits bone or that the study resolves the affected ossification step.
    supported_by:
    - reference_id: PMID:9326317
