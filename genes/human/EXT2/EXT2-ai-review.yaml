id: Q93063
gene_symbol: EXT2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EXT2 is a type II membrane glycosyltransferase that forms the EXT1–EXT2 complex in the Golgi.
  Its C-terminal GT-A domain supplies the principal alpha-1,4-N-acetylglucosaminyl-transfer reaction,
  adding N-acetylglucosamine from UDP-GlcNAc to glucuronic-acid-terminated chains. Alternating with the
  principal glucuronyl-transfer reaction of EXT1, this activity elongates the heparan sulfate backbone
  on proteoglycans. Disruption of EXT2 impairs heparan sulfate synthesis and causes hereditary multiple
  exostoses, a disorder characterized by cartilage-capped skeletal outgrowths.
