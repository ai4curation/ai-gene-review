  review:
    summary: EXT2 binding to EXT1 is more specifically supported as protein heterodimerization.
    action: MODIFY
    reason: The actual BioPlex 293T interaction table records Q93063-2 and Q16394 at line 8626, with pInt
      0.99473832262035. Its A/B ordering is undirected and does not identify the individual immunoprecipitation
      that generated the edge, even though both genes occur in the bait inventory. Methods describes C-terminal
      FLAG–HA human ORFeome constructs and anti-HA capture. Preserve the literal historical product label
      without equating an unverified insert sequence to all current EXT2 products. The absent HCT116 pair,
      where neither target is a listed bait, is not negative evidence. Independently purified human EXT1–EXT2
      complexes in PMID:36402845 and PMID:36593275 establish a functional heterodimer with this exact
      gene partner, supporting GO:0046982. This refinement uses the structural evidence; it does not infer
      dimer stoichiometry or current-product equivalence from the BioPlex edge.
