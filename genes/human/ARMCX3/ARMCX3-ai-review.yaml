id: Q9UH62
gene_symbol: ARMCX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMCX3 (ALEX3) is a eutherian-specific armadillo-repeat protein of the X-linked ARMCX cluster,
  which arose from the ancestral gene ARMC10. It is an integral mitochondrial outer-membrane protein.
  In neurons, mouse Armcx3 regulates mitochondrial dynamics and trafficking, interacting in a Ca2+-dependent
  manner with the kinesin/MIRO/TRAK2 transport complex. It forms a complex with Galpha-q that lets G protein-coupled
  receptor signalling control mitochondrial trafficking, and CNS loss of Armcx3 causes neuronal death
  and motor deficits. Non-canonical Wnt/PKC signalling promotes its degradation. On the outer membrane
  it also binds the transcription factor Sox10 and enhances Sox10-dependent transcription.
