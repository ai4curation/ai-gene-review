  title: The Eutherian Armcx genes regulate mitochondrial trafficking in neurons and interact with Miro
    and Trak2.
  findings:
  - statement: Armcx3 regulates neuronal mitochondrial trafficking via Kinesin/Miro/Trak2.
    supporting_text: Furthermore, we demonstrate that Armcx3 expression levels regulate mitochondrial
      dynamics and trafficking in neurons, and that Alex3 interacts with the Kinesin/Miro/Trak2 complex
      in a Ca(2+)-dependent manner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
