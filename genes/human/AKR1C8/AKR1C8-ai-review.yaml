- id: PMID:25726376
  title: Functional consequences of knocking down porcine prostaglandin synthases in SK-6 swine kidney
    cell line.
  findings:
  - statement: Pig PGFS, named AKR1CL1 in GenBank, was knocked down in swine kidney cells.
    supporting_text: knock down porcine mPGES-1 and PGFS (also named as AKR1CL1 in GenBank)
  - statement: Knockdown confirmed the identity of PGFS by reduced PGF2alpha.
    supporting_text: These results confirmed the identities of PGFS and mPGES-1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Pig, not human, and the abstract identifies the gene only by its GenBank
      name; that this is the ortholog of human AKR1C8 is not established, so it is used only for a knowledge
      gap.
- id: file:genes/human/AKR1C8/AKR1C8-uniprot.txt
  title: UniProtKB entry Q5T2L2 (AKCL1_HUMAN)
  findings:
  - statement: AKR1C8 is an aldo/keto reductase.
    supporting_text: Belongs to the aldo/keto reductase family.
  - statement: AKR1C8 was formerly AKR1C8P and is also called AKR1CL1.
    supporting_text: Synonyms=AKR1C8P, AKR1CL1;
  - statement: UniProt annotates Tyr58 as the active site.
    supporting_text: FT   ACT_SITE        58
- id: file:genes/human/AKR1C8/AKR1C8-bioinformatics/RESULTS.md
  title: AKR1C8 catalytic tetrad check
  findings:
  - statement: The catalytic tetrad is conserved.
    supporting_text: All four catalytic tetrad residues are conserved in AKR1C8 at D53, Y58, K87 and H120.
  - statement: Tetrad conservation does not inform substrate specificity.
    supporting_text: A conserved tetrad is consistent with NADP(H)-dependent carbonyl reductase activity
      but does not establish it, and it says nothing about substrate specificity, which differs among
      AKR1C enzymes.
- id: file:genes/human/AKR1C8/AKR1C8-notes.md
  title: AKR1C8 review notes
  findings:
  - statement: The pig PGFS gene is not established as the ortholog studied.
    supporting_text: Whether that gene is the pig PGFS cDNA that the 2014 knockdown study targeted is
      not established from the abstract, so the PGF synthase role is recorded as a gap and not transferred.
- id: file:genes/human/AKR1C8/AKR1C8-deep-research-affinage.md
  title: Affinage mechanistic annotation for AKR1C8 (human)
  findings:
  - statement: Affinage calls AKR1C8 a prostaglandin F synthase, from pig data.
    supporting_text: AKR1C8 (AKR1CL1) is a prostaglandin F synthase (PGFS) responsible for PGF2α production
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Trust gates clear, and the cited PMIDs are real. But its headline claim that AKR1C8
      is a prostaglandin F synthase transfers a pig knockdown result to human on the strength of a shared
      GenBank alias, without establishing orthology. Its other finding (adipogenesis, PMID:28673084) comes
      from a pig transcriptome screen and was not used.
