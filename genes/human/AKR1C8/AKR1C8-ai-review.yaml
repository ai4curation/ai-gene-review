id: Q5T2L2
gene_symbol: AKR1C8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AKR1C8 is a member of the AKR1C subfamily of aldo-keto reductases, the cytosolic NAD(P)H-dependent
  enzymes that reduce ketone and aldehyde groups of steroids, prostaglandins and xenobiotics. It was long
  annotated as a pseudogene (AKR1C8P) in the AKR1C cluster on chromosome 10 but encodes a 326-residue
  protein with about 68% identity to AKR1C1, and it retains the complete catalytic tetrad (Asp53, Tyr58,
  Lys87, His120). Its substrates, expression pattern and physiological role have not been studied in human.
  A pig gene recorded in GenBank as AKR1CL1 acts as a prostaglandin F synthase.
