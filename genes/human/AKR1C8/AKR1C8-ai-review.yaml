knowledge_gaps:
- gap_statement: The substrates and physiological role of AKR1C8 are unknown; it has never been assayed.
  boundary: The tetrad is intact, so activity is plausible, but AKR1C paralogs at this level of identity
    differ in steroid and prostaglandin preference. A pig gene called AKR1CL1 in GenBank makes PGF2alpha,
    but the abstract does not establish that it is the ortholog of human AKR1C8, so prostaglandin F synthase
    activity is not transferred.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: AKR1C enzymes control local steroid hormone and prostaglandin levels; an uncharacterized
    active paralog in the cluster could contribute to either.
  resolution: Express recombinant AKR1C8 and assay NADPH-dependent reduction of 5alpha-dihydrotestosterone,
    progesterone, 20alpha-hydroxysteroids and PGH2/PGD2 against AKR1C1-4 as controls.
  provenance:
  - reference_id: PMID:25726376
    supporting_text: knock down porcine mPGES-1 and PGFS (also named as AKR1CL1 in GenBank)
  - reference_id: file:genes/human/AKR1C8/AKR1C8-notes.md
    supporting_text: Whether that gene is the pig PGFS cDNA that the 2014 knockdown study targeted is
      not established from the abstract, so the PGF synthase role is recorded as a gap and not transferred.
  - reference_id: file:genes/human/AKR1C8/AKR1C8-bioinformatics/RESULTS.md
    supporting_text: A conserved tetrad is consistent with NADP(H)-dependent carbonyl reductase activity
      but does not establish it, and it says nothing about substrate specificity, which differs among
      AKR1C enzymes.
proposed_new_terms: []
suggested_questions:
- question: Is the pig prostaglandin F synthase recorded as AKR1CL1 the ortholog of human AKR1C8, or of
    another AKR1C cluster member?
- question: Is AKR1C8 expressed as protein in any human tissue, given its long annotation as a pseudogene?
suggested_experiments:
- description: Steroid and prostaglandin substrate panel for recombinant AKR1C8 with AKR1C1-4 as comparators.
