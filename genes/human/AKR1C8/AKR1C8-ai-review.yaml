  findings:
  - statement: A neurodegenerative-disease yeast two-hybrid interactome.
    supporting_text: connects ∼5,000 human proteins via ∼30,000 candidate interactions and is generated
      by systematic yeast two-hybrid
  reference_review:
    relevance: LOW
