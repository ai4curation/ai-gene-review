  review:
    summary: Alcohol dehydrogenase (NADP+) activity, from an ARBA rule. This is the generic AKR reaction
      and is consistent with the intact tetrad, but it is untested; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: AKR1C8 is an AKR1C-family aldo-keto reductase [file:genes/human/AKR1C8/AKR1C8-uniprot.txt
      "Belongs to the aldo/keto reductase family."] and keeps the full catalytic tetrad [file:genes/human/AKR1C8/AKR1C8-bioinformatics/RESULTS.md
      "All four catalytic tetrad residues are conserved in AKR1C8 at D53, Y58, K87 and H120."], aligning
      at 68% identity to AKR1C1 [file:genes/human/AKR1C8/AKR1C8-bioinformatics/RESULTS.md "| AKR1C8 |
      Q5T2L2 | 326 | 68% | D53 | Y58 | K87 | H120 |"]. NADP(H)-dependent interconversion of alcohols and
      carbonyls is the reaction common to the AKR1C family, so this is the most defensible specific activity.
      It is still only inferred, and is kept as non-core rather than accepted as a characterized function.
    supported_by:
    - reference_id: file:genes/human/AKR1C8/AKR1C8-bioinformatics/RESULTS.md
      supporting_text: All four catalytic tetrad residues are conserved in AKR1C8 at D53, Y58, K87 and
        H120.
    - reference_id: file:genes/human/AKR1C8/AKR1C8-bioinformatics/RESULTS.md
      supporting_text: A conserved tetrad is consistent with NADP(H)-dependent carbonyl reductase activity
        but does not establish it, and it says nothing about substrate specificity, which differs among
        AKR1C enzymes.
