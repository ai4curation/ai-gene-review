- id: PMID:36173926
  title: Cell-trafficking impairment in disease-associated LPA6 missense mutants and
    a potential pharmacoperone therapy for autosomal recessive woolly hair/hypotrichosis.
  findings:
  - statement: Eight of nine tested disease-associated LPA6 missense variants were loss-of-function in exogenous LPA-response assays.
    supporting_text: >-
      In our exogenous expression experiments, all mutants except S3T failed to
      respond to LPA, indicating that they are loss-of-function mutants.
  - statement: Five disease-associated LPA6 variants had reduced cell-surface expression because of ER retention.
    supporting_text: >-
      Among the nine mutants, five (D63V, G146R, N246D, L277P and C278Y) displayed
      impaired expression at the cell surface because of endoplasmic reticulum (ER)
      retention, indicating that these mutants are trafficking-defective, as reported
      in other disease-associated GPCRs.
  - statement: Alkyl-OMPT rescued surface expression of D63V and N246D, and the rescued N246D receptor was functional.
    supporting_text: >-
      Notably, alkyl-OMPT, a potent synthetic agonist for LPA6 restored the defective
      cell surface expression of two of the ER-retained mutants, D63V and N246D,
      possibly by its chaperoning function that allows them to escape intracellular
      retention as well as proteasomal degradation. Furthermore, the
      alkyl-OMPT-rescued N246D mutant was shown be functional.
  full_text_unavailable: true
  reference_review:
