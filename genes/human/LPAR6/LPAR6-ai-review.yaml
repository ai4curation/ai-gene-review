core_functions:
- description: >-
    Acts at the plasma membrane as an LPA-activated GPCR. Direct ligand-binding and
    receptor-deorphanization studies establish LPA recognition, with greater
    activity of 2-acyl-LPA than 1-acyl-LPA in a heterologous assay. The strongest
    recurring proximal output is G12/13-G13-dependent Rho activation; Gi-dependent
    calcium and ERK signaling and direct Gq coupling are supported in specified
    expression systems. LPA-bound LPAR6-mini-G13 and LPAR6-mini-Gq structures and
    functional mutagenesis define activated coupling states, not constitutive stable
    complexes. Human hair-follicle expression and recessive loss-of-function
    genetics connect this receptor activity to maintenance of hair growth and
    texture, but the follicular branch weights and downstream effectors remain
    unresolved.
  molecular_function:
    id: GO:0070915
    label: lysophosphatidic acid receptor activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  - id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:18297070
    supporting_text: >-
      Furthermore, we identified oleoyl-L-alpha-lysophosphatidic acid (LPA), a
      bioactive lipid, as a ligand for P2Y5 in reporter gene and radioligand binding
      experiments.
  - reference_id: PMID:19386608
    supporting_text: >-
      Here we report that p2y5 is a novel LPA receptor coupling to the G13-Rho
      signaling pathway.
  - reference_id: PMID:19386608
    supporting_text: >-
      We also found that 2-acyl-LPA had higher activity to p2y5 than 1-acyl-LPA.
  - reference_id: PMID:19679818
    supporting_text: >-
      Together these indicate that P2Y5 activation by LPA induces an increase in
      [Ca(2+)](i) and ERK1/2 phosphorylation through G(alpha)(i).
  - reference_id: PMID:39847322
    supporting_text: >-
      We resolved the structures of the LPA-bound LPAR6/G13 and LPA-bound LPAR6/Gq
      complexes at resolutions of 3.06 Å and 2.89 Å, respectively, using single
      particle cryo-EM analysis
knowledge_gaps:
- gap_statement: >-
    The quantitative G12/13, Gq, Gi/o, and beta-arrestin coupling profile of
    endogenous human LPAR6 is unresolved across native cell types.
  boundary: >-
    G13-Rho is supported by multiple recombinant studies and a human endothelial
    knockdown phenotype, while Gi and Gq are supported in defined heterologous or
    engineered systems. Cryo-EM resolves mini-G13 and mini-Gq interfaces but does
    not measure coupling weights in native hair-follicle cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Native branch selection is likely to determine how the same receptor controls
    hair-follicle architecture and other tissue-specific responses.
  resolution: >-
    Measure endogenous LPAR6 with parallel G12/13, Gq, Gi/o, beta-arrestin, Rho,
    calcium, ERK, and cyclic-nucleotide biosensors in human inner-root-sheath,
    epidermal, and endothelial models.
- gap_statement: >-
    The endogenous LPA molecular species that occupy LPAR6 in human tissues and the
    physiological significance of its reported 2-acyl-LPA preference are unknown.
  boundary: >-
    Recombinant assays show greater activity of 2-acyl- than 1-acyl-LPA, whereas the
    structural preparations used 1-acyl-LPA because 2-acyl-LPA is unstable. FPP can
    activate LPAR6 in heterologous assays but is not established as an endogenous
    human LPAR6 ligand.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Local ligand composition could control receptor occupancy, potency, and branch
    bias in the hair follicle and vascular compartments.
  resolution: >-
    Combine extracellular and membrane lipidomics with endogenous LPAR6 knockout,
    genomic rescue, and branch-resolved dose-response measurements using stabilized
    1-acyl- and 2-acyl-LPA species.
- gap_statement: >-
    The proximal LPAR6 signaling branch and downstream effectors that maintain human
    hair-shaft growth and texture are not defined.
  boundary: >-
    Human biallelic loss-of-function genetics and inner-root-sheath expression
    establish the follicular requirement, but most coupling experiments used
    receptor-null rodent or other heterologous cells rather than native human
    follicular cells.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Resolving the cell type and signaling branch would connect the receptor's core
    molecular activity to the human phenotype without transferring model-specific
    adhesion or contraction outputs.
  resolution: >-
    Perturb endogenous LPAR6 and individual G-protein branches in human follicle
    organoids containing Henle and Huxley lineages, with rescue by wild-type receptor
    and quantitative hair-shaft morphogenesis readouts.
- gap_statement: >-
    Why different disease-associated LPAR6 missense variants cause trafficking
    failure versus surface-expressed signaling failure, and which defects are
    pharmacologically rescuable, remains incompletely resolved.
  boundary: >-
    Five tested variants showed ER retention and impaired surface expression, while
    several other loss-of-function variants reached the surface. Alkyl-OMPT rescued
    surface expression of only D63V and N246D in an exogenous system, and clinical
    efficacy has not been established.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Mechanistic stratification is required before genotype-specific rescue can be
    evaluated as a therapeutic strategy.
  resolution: >-
    Compare folding, export, degradation, ligand binding, coupling, and rescue across
    a complete variant panel in endogenously expressed human follicular models.
- gap_statement: >-
    Functionally distinct endogenous LPAR6 protein isoforms and stable
    receptor-specific interaction partners have not been established.
  boundary: >-
    Multiple transcript accessions do not demonstrate distinct protein isoforms.
    Disease-tested sequences are allelic variants, the cryo-EM receptor-G-protein
    assemblies are activated states, and the four HuRI pairs are screen-level binary
    detections without targeted physiological validation.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Unsupported isoform or complex claims could misattribute tissue-specific
    trafficking and signaling mechanisms.
  resolution: >-
    Reconcile full-length transcripts by long-read sequencing and proteomics, and
    test endogenous proximity-labeling candidates by reciprocal interaction,
    colocalization, and genetic epistasis assays.
proposed_new_terms: []
suggested_questions:
- question: >-
    What are the endogenous G12/13, Gq, Gi/o, and beta-arrestin coupling weights of
    human LPAR6 in inner-root-sheath, epidermal, and endothelial cells?
- question: >-
    Which 1-acyl- and 2-acyl-LPA species occupy LPAR6 in native human tissues, and is
    FPP physiologically relevant to the receptor?
- question: >-
    Which LPAR6-dependent branch and downstream effectors maintain human hair-shaft
    growth and texture?
- question: >-
    Which disease-associated LPAR6 alleles fail by misfolding, defective export,
    ligand recognition, or G-protein coupling, and which can be rescued safely?
- question: >-
    Are any endogenous LPAR6 protein isoforms or stable regulatory partners
    functionally distinct?
suggested_experiments:
- hypothesis: >-
    Native human LPAR6 favors G12/13-G13 signaling, while the relative Gi and Gq
    contributions vary by cell type and LPA species.
  description: >-
    Endogenously tag or minimally modify LPAR6 in human inner-root-sheath,
    epidermal, and endothelial models, then measure G12/13, Gq, Gi/o,
    beta-arrestin, Rho, calcium, ERK, and cyclic-nucleotide responses to matched
    1-acyl- and 2-acyl-LPA panels with G-alpha knockout and genomic rescue controls.
  experiment_type: endogenous coupling and ligand-bias profiling
- hypothesis: >-
    Local enrichment of 2-acyl-LPA drives preferential LPAR6 activation in the human
    hair-follicle compartment.
  description: >-
    Quantify extracellular and membrane LPA species in microdissected follicular
    compartments, then combine LPAR6 knockout/rescue with stabilized ligand
    competition and branch-resolved signaling measurements in follicle organoids.
  experiment_type: native ligand lipidomics and receptor occupancy
- hypothesis: >-
    LPAR6-G12/13-Rho signaling in inner-root-sheath cells is required for normal
    hair-shaft morphogenesis.
  description: >-
    Build human follicle organoids with lineage-restricted LPAR6 knockout and rescue,
    perturb G12/13, Rho, Gi, and Gq branches independently, and quantify sheath-cell
    mechanics, shaft curvature, growth, and differentiation over time.
  experiment_type: human follicle signaling epistasis
- hypothesis: >-
    Trafficking-defective and surface-expressed signaling-defective LPAR6 alleles
    require distinct rescue strategies.
  description: >-
    Introduce representative patient alleles at the endogenous locus in follicular
    cells and measure folding, ER retention, surface delivery, degradation, ligand
    occupancy, and G-protein coupling before and after alkyl-OMPT or matched
    pharmacological-chaperone treatment.
  experiment_type: endogenous variant mechanism and rescue stratification
- hypothesis: >-
    A subset of screen-derived LPAR6 partners reproducibly regulates receptor
    trafficking or signaling in a native-expression context.
  description: >-
    Perform endogenous LPAR6 proximity labeling in follicular and endothelial cells,
    test overlap with EMP1, SEC22A, SMIM3, and RPRM, and require reciprocal
    interaction, colocalization, perturbation, and rescue before assigning a stable
    regulatory relationship.
  experiment_type: endogenous partner validation
