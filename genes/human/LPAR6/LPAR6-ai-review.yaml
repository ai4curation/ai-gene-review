- id: PMID:18297070
  title: G protein-coupled receptor P2Y5 and its ligand LPA are involved in maintenance
    of human hair growth.
  findings:
  - statement: Human P2RY5/LPAR6 was identified as an LPA-responsive GPCR through reporter-gene and radioligand-binding experiments.
    supporting_text: >-
      Furthermore, we identified oleoyl-L-alpha-lysophosphatidic acid (LPA), a
      bioactive lipid, as a ligand for P2Y5 in reporter gene and radioligand binding
      experiments.
  - statement: Homozygous truncating P2RY5 variants segregated with autosomal recessive hypotrichosis, linking the receptor to maintenance of human hair growth.
    supporting_text: >-
      We mapped an autosomal recessive form of this disorder to chromosome
      13q14.11-13q21.33, and identified homozygous truncating mutations in P2RY5,
      which encodes an orphan G protein-coupled receptor.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract were verified. This is direct human genetic and ligand-response evidence, but the abstract-only cache does not expose the plasma-membrane assay underlying the IDA localization annotation.
- id: PMID:18297072
  title: Disruption of P2RY5, an orphan G protein-coupled receptor, underlies autosomal
    recessive woolly hair.
  findings:
  - statement: Pathogenic P2RY5 variants were found in six linked families with autosomal recessive woolly hair.
    supporting_text: >-
      In all cases, we discovered pathogenic mutations in P2RY5, which encodes a G
      protein-coupled receptor and is a nested gene residing within intron 17 of the
      retinoblastoma 1 (RB1) gene.
  - statement: P2RY5 is expressed in the Henle and Huxley layers of the human hair-follicle inner root sheath.
    supporting_text: >-
      P2RY5 is expressed in both Henle's and Huxley's layers of the inner root sheath
      of the hair follicle.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract were verified. This independently establishes the human woolly-hair genetics and follicular expression context; it does not itself identify the ligand or signaling pathway.
- id: PMID:19386608
  title: Identification and characterization of a novel lysophosphatidic acid receptor,
    p2y5/LPA6.
  findings:
  - statement: Human p2y5 was functionally identified as LPA6 and coupled to G13-Rho signaling in heterologous receptor-null cell assays.
    supporting_text: >-
      Here we report that p2y5 is a novel LPA receptor coupling to the G13-Rho
      signaling pathway.
  - statement: Endogenous p2y5 contributed to LPA-induced contraction in human umbilical-vein endothelial cells.
    supporting_text: >-
      LPA-induced contraction of human umbilical vein endothelial cells was
      suppressed by small interfering RNA knockdown of endogenously expressed p2y5.
  - statement: LPAR6 responded more strongly to 2-acyl-LPA than to 1-acyl-LPA.
    supporting_text: >-
      We also found that 2-acyl-LPA had higher activity to p2y5 than 1-acyl-LPA.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract were verified. This is a decisive primary receptor-deorphanization and signaling study; most mechanistic assays used human LPAR6 expressed in rat receptor-null cell lines, while the contraction/knockdown experiment used human endothelial cells.
- id: PMID:19679818
  title: P2Y5 is a G(alpha)i, G(alpha)12/13 G protein-coupled receptor activated by
    lysophosphatidic acid that reduces intestinal cell adhesion.
  findings:
  - statement: LPA activation of heterologously expressed P2Y5 engaged Gi-sensitive calcium and ERK signaling.
    supporting_text: >-
      Together these indicate that P2Y5 activation by LPA induces an increase in
      [Ca(2+)](i) and ERK1/2 phosphorylation through G(alpha)(i).
  - statement: LPA- or FPP-activated P2Y5 engaged a G12/13-Rho-ROCK-sensitive reporter pathway.
    supporting_text: >-
      The activation of P2Y5 by LPA or FPP induced the activity of a serum response
      element (SRE)-linked luciferase reporter that was inhibited by the RGS domain of
      p115RhoGEF, C3 exotoxin, and Y-27632, suggesting the involvement of
      G(alpha)(12/13), Rho GTPase, and ROCK, respectively.
  - statement: LPA, but not FPP, activation of P2Y5 reduced adhesion in the intestinal-cell model.
    supporting_text: >-
      These observations correlate with our subsequent finding that P2Y5 activation
      by LPA, and not FPP, reduced intestinal cell adhesion.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract were verified. This directly supports Gi and G12/13-Rho signaling and an alternative agonist response, but the adhesion phenotype comes from CHO and rat intestinal hBRIE 380i expression systems and should not be generalized as established human intestinal physiology.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI is a large systematic map of human binary protein interactions rather than a targeted LPAR6 mechanistic study.
    supporting_text: >-
      Here we present a human 'all-by-all' reference interactome map of human binary
