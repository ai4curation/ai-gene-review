  - statement: Mutagenesis validated key polar LPAR6 residues that recognize the LPA headgroup and glycerol moiety.
    supporting_text: >-
      Mutants R256A6.62, Y252A6.58, and W177A5.31, which disrupt polar interactions
      with the phosphate head of LPA, largely decrease receptor activity
  - statement: The structure and BRET mutagenesis distinguish G13- and Gq-selective receptor contacts.
    supporting_text: >-
