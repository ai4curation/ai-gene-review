id: P43657
gene_symbol: LPAR6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAR6, historically called P2Y5/P2RY5, is a class-A seven-transmembrane G
  protein-coupled receptor that recognizes extracellular lysophosphatidic acid at
  the plasma membrane. Human LPAR6 expressed in receptor-null rodent cells responds
  preferentially to 2-acyl-LPA over 1-acyl-LPA and most consistently activates a
  G12/13-Rho pathway; Gi-dependent calcium and ERK responses and Gq coupling are
  also supported in defined heterologous systems. Knockdown of endogenous LPAR6
  suppresses LPA-induced contraction of human endothelial cells, providing a
  bounded native-human link to the recombinant signaling results. Cryo-EM
  structures of engineered, LPA-bound human LPAR6 with mini-G13 or mini-Gq define
  the ligand pocket and distinct coupling contacts, with functional mutagenesis
  supporting both interfaces and stronger G13 coupling. These structures represent
  activated signaling states rather than constitutive stable complexes. LPAR6 is
  expressed in human skin and hair follicles, including Henle and Huxley layers of
  the inner root sheath. Biallelic loss-of-function variants cause autosomal
  recessive woolly hair and hypotrichosis, establishing an essential role in hair
  growth and texture. Several disease-associated missense forms are retained in the
  endoplasmic reticulum and fail to reach the cell surface, whereas other
  surface-expressed variants are signaling defective; these are allelic forms, not
  protein isoforms. Variant-specific rescue by the synthetic agonist alkyl-OMPT and
  activation by farnesyl pyrophosphate have been observed in expression systems but
  do not establish general clinical rescue or an alternative endogenous human
  ligand.
