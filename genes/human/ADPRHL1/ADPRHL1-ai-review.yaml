      finding is the paper's central, quantified result, measured on four independent markers
      and closed by a pharmacological rescue, and it has no annotation in GOA at all. The
      sarcomere finding is a qualitative supplementary-figure observation with no
      quantification, and the process it would support is already annotated here and refined
      by the GO:0055005 row below - so a third overlapping myofibril term drawn from the
      weaker of the paper's two observations would add granularity the observation does not
      carry. GO:0045214 sarcomere organization was considered on that basis and declined.
