existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012108
  review:
    summary: >-
      This is the ancestral catalytic magnesium site transferred onto a protein in which
      that site has been dismantled. The row comes from interpro2go, which maps
      IPR012108 "ADP-ribosylarginine hydrolase" to GO:0000287, GO:0003875 and GO:0051725;
      ADPRHL1 matches IPR012108 because the entry's single member signature, PIRSF016939,
      does not separate the active ARH1 proteins from the inactive ARH2 ones. Of the
      1282 proteins in IPR012108, 11 are reviewed Swiss-Prot entries, and 7 of those 11
      are the entries Swiss-Prot itself names "Inactive ADP-ribosyltransferase ARH2" and
      annotates with a CAUTION that they lack the metal-binding residues. So a majority
      of the entry's own curated members are curated as catalytically dead, and the entry
      still supplies the metal-binding term. UniProt states the loss directly on this
      accession, and a residue census confirms it against a matched control: of ADPRH's
      six UniProt-annotated Mg(2+) ligands, ADPRHL1 keeps the coordinating oxygen at only
      three and loses it at three. Written as ADPRH position to ADPRHL1 residue, the
      survivors are Ser54 to Ser56, Asp55 to Asp57 and Asp302 to Glu304, and the losses
      are Asp56 to Asn58, Asp304 to Ala306 and Ser305 to Ala307. The decisive one is Asp56 to
      Asn58, because aspartate-to-asparagine at a vicinal catalytic aspartate is the very
      substitution used to abolish this family's activity experimentally - PMID:17075046
      kills ARH3's reaction by replacing Asp77 and Asp78 with asparagine. The comparison
      is controlled rather than asserted: Dictyostelium ADPRH, a genuine ARH1 at 48.4%
      identity to human ADPRH - the same distance as ADPRHL1's 42.6-47.7% - retains 13 of
      20 ligand sites and all six Mg(2+) donors, while every ADPRHL1 orthologue retains
      6-7 sites and 2-3 donors. Retention is therefore not tracking sequence distance.
      One counter-consideration is recorded rather than suppressed: PMID:27217161's model
      notes that Asp100 of ADPRHL1 could provide an alternative coordination site for
      metals. That is a hedged modelling suggestion, presented in the source as an
      obstacle to substrate docking rather than as a functional site, and never tested -
      it does not support the annotation, whose provenance is specifically the ancestral
      catalytic site.
    action: REMOVE
    reason: >-
      Removed on the term's own provenance rather than by importing the hydrolase result.
      Magnesium binding as such has never been assayed on ARH2, and three of ADPRH's six
      Mg(2+) donor positions do survive, so the honest statement is not that ADPRHL1 binds
      no metal. All positions in this paragraph are given in ADPRH numbering, with the
      ADPRHL1 residue after the arrow: retained are Ser54 to Ser56, Asp55 to Asp57 and
      Asp302 to Glu304; lost are Asp56 to Asn58, Asp304 to Ala306 and Ser305 to Ala307.
      That reconciles with PMID:27217161, which reports three of the four critical
      aspartates lost with only Asp55 conserved - its verbatim sentence is quoted in this
      row's supported_by below, and nothing in this paragraph is a quotation. It uses a
      different denominator and a stricter criterion: its four are Asp55, Asp56, Asp302 and
      Asp304, and it scores Asp302 to Glu304 as lost because the residue is no longer an
      aspartate, whereas the donor test used here scores it retained because a glutamate
      still contributes a carboxylate oxygen. Both statements describe the same alignment. What is refuted is the only
      thing that put this term here: the row exists solely as interpro2go's mapping of
      IPR012108, that mapping describes the catalytic Mg(2+) centre of the active ARH1
      members, and that centre is demonstrably dismantled - UniProt's own CAUTION records
      the metal-binding residues as absent, and the losses include the vicinal Asp56, the
      position whose aspartate-to-asparagine substitution abolishes the paralogue's
      activity. There is no independent support for the term anywhere in the clade: all
      seven reviewed ARH2 orthologues hold it by the same single IEA route. With its sole
      basis refuted and no measurement on either side, REMOVE rather than
      MARK_AS_OVER_ANNOTATED - though the latter would also have been defensible, and the
      caveat in the summary about ADPRHL1 Asp100, the one position in this row's reasoning
      cited in ADPRHL1 rather than ADPRH numbering, is why.
    supported_by:
    - reference_id: file:human/ADPRHL1/ADPRHL1-uniprot.txt
      supporting_text: lacks the metal-binding and substrate-binding residues
    - reference_id: PMID:27217161
      supporting_text: >-
        Three of the four critical aspartates of ADPRH have been lost in mammalian
        ADPRHL1 (hADPRH D56, D302, D304 lost, only D55 is conserved), suggesting that
        ADPRHL1 cation binding may be compromised.
    - reference_id: PMID:36497109
      supporting_text: >-
        ARH2 (so far) does not exhibit any enzymatic activities [70], consistent with
        differences in primary sequences from critical residues found in ARH1 (e.g.,
        54-SDDT-57, 302-DSDS-305)
    - reference_id: file:human/ADPRHL1/ADPRHL1-bioinformatics/RESULTS.md
      supporting_text: Retention therefore is not tracking sequence distance here.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: InterPro:IPR012108
        source_label: ADP-ribosylarginine hydrolase (InterPro family, member signature PIRSF016939)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The signature is sound for the ARH1 members that justify it and unsound for the
          ARH2 members that outnumber them: 7 of the entry's 11 reviewed members are
          "Inactive ADP-ribosyltransferase ARH2" entries carrying a
          lack-of-catalytic-residues CAUTION. The three other InterPro signatures ADPRHL1
          matches - IPR050792, IPR005502 and IPR036705 - map to nothing in interpro2go,
          which is the internal control showing this is one over-reaching entry rather
          than a careless pipeline.
- term:
    id: GO:0003875
    label: ADP-ribosylarginine-[protein] hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00088955
  - InterPro:IPR012108
  review:
    summary: >-
      The activity this term names has been measured on ARH2 and was not found. Ono et al.
      assayed recombinant ARH2 alongside ARH1 and ARH3 and report it inactive; the Moss
      laboratory's family review states the negative across the whole assay panel and,
      specifically for the reaction this term describes, that ARH2 does not appear to be
      responsible for hydrolysis of the ADP-ribose-acceptor linkage. UniProt records the
      same on this entry. Two independent automatic routes deliver the term anyway and
      neither examines a residue. The first is interpro2go via IPR012108. The second is
      the ARBA rule cited in this row's own WITH/FROM: ARBA00088955 has a single condition
      set, FunFam id 1.10.4080.10:FF:000002 AND taxon Mammalia, and this entry's
      cross-reference reads "FunFam; 1.10.4080.10:FF:000002; ADP-ribosylarginine hydrolase
      isoform X1". That FunFam contains both the active ARH1 proteins and the inactive ARH2
      ones (ARH3 sits in FF:000001), so the rule is keyed on a structural family whose name
      asserts an activity that half its members have lost. The rule's taxon clause makes a
      testable prediction and GOA confirms it: the five mammalian ARH2 orthologues receive
      GO:0003875 via GO_REF:0000120 while Xenopus and zebrafish receive it via GO_REF:0000002
      instead. Across all seven reviewed ARH2 orthologues, GO:0003875, GO:0000287 and
      GO:0051725 are held 21 times and every single one is IEA - no experimental, ISS or
      IBA support exists anywhere in the clade. PAINT, by contrast, gets this right: the
      GO:0003875 IBA reaches 20 gene products from node PTN009030515 and all 20 are ADPRH
      orthologues, with no ARH2 among them. The specificity question was also asked in the
      other direction and answered no: no ARH2 orthologue carries any ARH3-type term
      (GO:0140290, GO:0004649, GO:0140292 all return zero), and the residue census scores
      ADPRHL1 at 6-7 of ARH3's 17 sites against 14-17 for the ARH3 clade itself. ADPRHL1 is
      not a misfiled serine hydrolase; it is not a hydrolase.
    action: REMOVE
    reason: >-
      A catalytic activity that was directly assayed on this protein and not detected,
      arriving from two fold-based pipelines neither of which inspects the catalytic
      residues. The field's own caveat - that the negative was obtained with model
      substrates - is why no replacement hydrolase term is proposed rather than why the
      term is kept: GO cannot express "might hydrolyse something unidentified", and
      inventing a general hydrolase term to hold that hedge would be an over-annotation
      of the opposite sign.
    supported_by:
    - reference_id: PMID:17075046
      supporting_text: >-
        The rate of O-acetyl-ADP-ribose hydrolysis by recombinant ARH3 was 250-fold that
        observed with ARH1; ARH2 and poly(ADP-ribose) glycohydrolase were inactive.
    - reference_id: PMID:36497109
      supporting_text: >-
        ARH2 does not appear to be responsible for hydrolysis of ADP-ribose-acceptor
        linkage.
    - reference_id: PMID:32726316
      supporting_text: >-
        The sequence changes suggest binding of ADP-ribosylated protein substrates and
        cation-mediated catalysis are both abolished in Adprhl1 and biochemical assays
        have confirmed the lack of any comparable enzymatic activity
    - reference_id: file:human/ADPRHL1/ADPRHL1-uniprot.txt
      supporting_text: showing no activity against O-acetyl-ADP-ribose
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: ARBA:ARBA00088955
        source_label: ARBA rule, FunFam 1.10.4080.10:FF:000002 AND taxon Mammalia gives GO:0003875
        source_status: SOURCE_BAD
        comment: >-
          The rule's whole condition set is a CATH FunFam membership plus a taxon. The
          FunFam is named "ADP-ribosylarginine hydrolase isoform X1" and contains ADPRH and
          ADPRHL1 alike, so the rule grants a catalytic molecular function on the strength
          of a family name. Its Mammalia clause is visible in GOA as the split between
          GO_REF:0000120 for the five mammalian ARH2 orthologues and GO_REF:0000002 for the
          frog and zebrafish ones.
      - source_id: InterPro:IPR012108
        source_label: ADP-ribosylarginine hydrolase (InterPro family, member signature PIRSF016939)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Same entry as on the GO:0000287 and GO:0051725 rows; 7 of its 11 reviewed members
          are Swiss-Prot "Inactive ADP-ribosyltransferase ARH2" entries.
