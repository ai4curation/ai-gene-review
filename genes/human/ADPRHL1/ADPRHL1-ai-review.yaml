- term:
    id: GO:0051725
    label: protein de-ADP-ribosylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012108
  review:
    summary: >-
      The biological process that the absent hydrolase activity would carry out, transferred
      from the same IPR012108 signature and falling with it. The direction of this term was
      checked explicitly rather than assumed, because this family is exactly where reaction
      direction goes wrong: GO:0051725 is the removal of ADP-ribose, which is the correct
      direction for an ARH-family protein, so this is not the error of annotating a protein
      as performing the modification it removes. It fails for a different reason - ADPRHL1
      has never been shown to remove ADP-ribose from anything, and was assayed for exactly
      that and found inactive. Nothing else in the literature supports the process either.
      The closest is PMID:35816343, in which a germline p.Asp78Val allele expressed in
      prostate cells activates PARP1 and raises poly(ADP-ribose) levels while wild-type
      ADPRHL1 suppresses proliferation; that is consistent with wild-type ADPRHL1 restraining
      cellular ADP-ribosylation somehow, but it is ectopic expression of a single variant
      in cancer cell lines with no demonstration that ADPRHL1 acts on ADP-ribose itself,
      and it cannot support a de-ADP-ribosylation annotation. Note that Asp78 is not one of
      the ligand positions in the residue census, so the variant does not bear on the
      catalytic question either.
