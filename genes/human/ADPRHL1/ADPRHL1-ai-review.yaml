- term:
    id: GO:0003242
    label: cardiac chamber ballooning
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6AZR2
  review:
    summary: >-
      A sound ortholog transfer. The WITH/FROM entity is correct for an ISS row - the
      sequence-similar protein, not a partner - and it resolves to ARHL1_XENLA, a reviewed
      Swiss-Prot entry for Xenopus laevis adprhl1, 354 aa, a 1:1 ortholog at 74.6% aligned
      identity (published as 75%). Its own annotation is IMP from PMID:27217161, where
      morpholino knockdown of all Adprhl1 variants prevents outgrowth of the ventricle while
      leaving cardiomyocyte number, electrical conduction and myofibrillar gene expression
      intact. A fully paginated reference-projection test on that PMID returns 3 annotations
      over 1 entity, so this is one curator reading one paper about one gene, not a bulk
      import and not a complex-level phenotype spread across a set. The mammalian evidence
      is thinner but not contradictory: mice lacking Adprhl1 exons 3-4 are normal, but that
      allele still produces the smaller ADPRHL1 species and so is not a null. ADPRHL1 is
      heart- and skeletal-muscle-enriched in human tissue and expressed in left ventricle
      myocardium, and human variants in the locus associate with ventricular conduction
      phenotypes, so nothing about the human gene argues against the transfer.
    action: ACCEPT
    reason: >-
      Legitimate ISS from a reviewed 1:1 ortholog at 75% identity whose underlying evidence
      is a specific, single-gene loss-of-function experiment in the same organ.
    supported_by:
    - reference_id: PMID:27217161
      supporting_text: >-
        Morpholino oligonucleotide-mediated knockdown of all Adprhl1 variants inhibits
        striated myofibril assembly and prevents outgrowth of the ventricle.
    - reference_id: PMID:36497109
      supporting_text: >-
        ARH2 is a cytoplasmic protein expressed primarily in heart and skeletal muscle and
        may be involved in cardiac myofibril assembly and cardiac chamber outgrowth
