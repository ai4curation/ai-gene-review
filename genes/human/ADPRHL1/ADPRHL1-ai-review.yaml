id: Q8NDY3
gene_symbol: ADPRHL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADPRHL1 (ARH2) is a catalytically inactive member of the ADP-ribosylglycohydrolase
  family, expressed almost exclusively in striated muscle and most strongly in the
  heart. It retains the all-alpha ADP-ribosylhydrolase fold of its active paralogues
  ADPRH (ARH1, an ADP-ribosylarginine hydrolase) and ADPRS (ARH3, a serine/poly(ADP-ribose)
  hydrolase), but has lost the aspartate pair that coordinates the catalytic magnesium
  ions and the serines that grip the adenosine-ribose of the substrate, and recombinant
  ARH2 shows no hydrolase activity in the assays that detect ARH1 and ARH3 activity.
  Its function instead depends on the vestigial substrate cleft: the two adjacent serines
  that bind adenosine-ribose in ADPRH are replaced in ADPRHL1 by a di-arginine motif
  (Arg271-Arg272), and deleting one to four residues from that loop abolishes ventricular
  myofibril assembly in Xenopus without touching any catalytic residue. Loss of ADPRHL1
  blocks striated myofibril assembly and outgrowth of the cardiac ventricle in frog
  embryos, and knockout in human embryonic stem cell-derived cardiomyocytes disorganises
  sarcomeres, reduces beta-1 integrin, paxillin and phosphorylated FAK, and impairs
  focal adhesion formation, calcium transients and electrical conduction through
  excessive activation of the ROCK-myosin II pathway. Epitope-tagged protein localises
  to stripes flanking the Z-disc, consistent with the sarcomeric and myofibrillar
  localisation recorded for the protein. No ligand, substrate or binding partner has
  been identified, so the molecular activity underlying these roles remains undefined.
