    review_notes: >-
      Cached abstract-only, so nothing is asserted here beyond what the abstract states, and
      both quoted claims are in the abstract. Found by searching the family rather than the
      gene symbol - no ADPRHL1-keyed query returns a paper titled for ARH3 - and it is absent
      from the affinage record. UniProt cites this PMID as the experimental evidence for the
      mouse ARH2 entry's inactivity. No retraction, erratum or Crossref update-to.
- id: PMID:36497109
  title: ARH Family of ADP-Ribose-Acceptor Hydrolases.
  findings:
  - statement: >-
      The family review's statement of ARH2's enzymatic status, with the specific sequence
      motifs whose loss explains it. The ARH1 motifs quoted, 54-SDDT-57 and 302-DSDS-305,
      correspond exactly to the UniProt-annotated magnesium ligands used as the reference set
      in this review's residue census.
    supporting_text: >-
      ARH2 (so far) does not exhibit any enzymatic activities [70], consistent with
      differences in primary sequences from critical residues found in ARH1 (e.g.,
      54-SDDT-57, 302-DSDS-305)
  - statement: >-
      The statement bearing specifically on the reaction that GO:0003875 and GO:0051725
      name.
    supporting_text: >-
      ARH2 does not appear to be responsible for hydrolysis of ADP-ribose-acceptor linkage.
  - statement: >-
      The authors' own caveat, recorded because it is the reason no replacement hydrolase
      term is proposed and the reason this review does not claim ADPRHL1 is biochemically
      inert.
    supporting_text: >-
      However, the lack of ARH2 catalytic activity may be the result of the use of model
      substrates.
  - statement: >-
      The expression pattern and the biological role attributed to ARH2 by the family's own
      reviewers.
    supporting_text: >-
      ARH2 is a cytoplasmic protein expressed primarily in heart and skeletal muscle and may
      be involved in cardiac myofibril assembly and cardiac chamber outgrowth
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      A review, used for the family-level statement of enzymatic status and for its explicit
      caveat, not as a primary source for any measurement; the underlying measurement is
      cited separately as PMID:17075046. From the laboratory that characterised all three ARH
      proteins. Absent from the affinage record. No retraction, erratum or Crossref update-to.
- id: PMID:35816343
  title: A Recurrent ADPRHL1 Germline Mutation Activates PARP1 and Confers Prostate
    Cancer Risk in African American Families.
  findings:
  - statement: >-
      A recurrent germline p.Asp78Val allele segregating in African-American prostate cancer
      families; the mutant activates PARP1 and increases the DNA damage response, an effect
      reversed by olaparib.
    supporting_text: the ADPRHL1 mutant activates PARP1
  - statement: >-
      Ectopic wild-type ADPRHL1 restrains proliferation in prostate cancer cells. Suggestive
      of a link to cellular ADP-ribosylation but not evidence that ADPRHL1 itself acts on
      ADP-ribose, so no annotation is proposed from it.
    supporting_text: >-
      expression of the wild-type ADPRHL1 in prostate cancer cells suppressed cell
      proliferation and oncogenesis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and internally sound, but deliberately not used for any annotation: it
      is ectopic expression in cancer cell lines, one variant in one ancestry group, and it
      demonstrates no biochemical activity of ADPRHL1. Asp78 is not among the ligand
      positions in the residue census, so it does not bear on the catalytic question either.
      Crossref shows is-supplemented-by and has-preprint relations and no update-to.
- id: PMID:40801020
  title: Inhibition of ARH2 by pH/ROS-responsive nanosystem for improved lung adenocarcinoma
    immunochemotherapy.
  findings:
  - statement: >-
      siRNA knockdown of ARH2 delivered by nanoparticle in lung adenocarcinoma models; ARH2
      is reported to promote M2 macrophage polarisation via FPR2, PI3K and AKT. A different
      tissue and the opposite direction from the prostate work, and rated low confidence by
      the provider that surfaced it.
    supporting_text: >-
      ARH2 promotes M2 macrophage polarization and suppresses immune responses by regulating
      the FPR2/PI3K/AKT signaling pathway
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and genuinely about ARH2, but not used for any annotation. It is a
      drug-delivery study whose gene-function claims rest on siRNA in tumour models, and its
      direction contradicts the tumour-suppressor reading of PMID:35816343 in a different
      tissue. Recorded so the next reviewer knows it was read and set aside.
- id: PMID:34492228
  title: Histone deacetylase 4 deletion broadly affects cardiac epigenetic repression
    and regulates transcriptional susceptibility via H3K9 methylation.
  findings:
  - statement: >-
      Identifies the Adprhl1 promoter as a target of HDAC4, MEF2 and SUV39H1 repression in
      cardiomyocytes. This concerns regulation of the gene, not a function of the protein,
      and yields no annotation.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only, so nothing is asserted about its full text and no quote is taken
      from it. Included for completeness because affinage cites it; a gene whose promoter is
      a repression target is not thereby annotated with a function.
- id: PMID:16278211
  title: Identification and characterization of a mammalian 39-kDa poly(ADP-ribose)
    glycohydrolase.
  findings:
  - statement: >-
      The reference both Xenopus papers cite for ARH2's lack of comparable enzymatic
      activity. Cached abstract-only, and the abstract does not itself mention ARH2, so no
      claim in this review rests on it - the biochemical negative is anchored to
      PMID:17075046 and PMID:36497109 instead.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Listed because it is the citation the primary literature uses for ARH2's inactivity,
      but marked unverified rather than verified: only the abstract is cached, the abstract
      is about ARH3, and this review declines to assert what a paper's unavailable full text
      contains. Nothing here depends on it.
- id: PMID:12070318
  title: The family of toxin-related ecto-ADP-ribosyltransferases in humans and the
    mouse.
  findings:
  - statement: >-
      UniProt's reference 1 for the ADPRHL1 isoform-1 mRNA. It surveys the
      ecto-ADP-ribosyltransferase (ARTC) family, which is a different family from the ARH
      hydrolases, and is the most likely origin of the word transferase in Q8NDY3's
      recommended name.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited by UniProt for a sequence submission only. Noted here solely in support
      of the nomenclature correction request; no functional claim about ARH2 is drawn from
      it, and its full text is not available.
- id: file:human/ADPRHL1/ADPRHL1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADPRHL1 (human)
  findings:
  - statement: >-
      The provider record used as a starting lead, recorded for provider evaluation rather
      than cited as evidence. Its narrative is broadly accurate and all six of its citations
      were individually verified to concern ADPRHL1 or ARH2 - which is not a given, since on
      the sibling gene ADPRH the same provider returned citations resolving to papers about
      entirely different proteins.
  - statement: >-
      Its recall, however, missed every source that decides this review's molecular function
      verdicts: PMID:17075046 (the only direct measurement that ARH2 is inactive, titled for
      ARH3), PMID:36497109 (the family review that states the negative across the assay
      panel and supplies the model-substrate caveat) and PMID:16278211 (the reference the
      primary literature cites for ARH2's inactivity). All three were found by searching the
      family rather than the gene symbol.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      gates_passed True, six citations, all numeric PMIDs with no bioRxiv identifiers in a
      PMID-shaped field, and each verified against PubMed to be about ADPRHL1/ARH2. No
      retraction or erratum among them. Used only as a lead: no sentence from it is quoted
      as supporting_text anywhere in this review, per the campaign rule that provider prose
      must not carry a mechanistic claim. The repo validator's warning that no annotation
      references this file is therefore expected and is left standing rather than silenced
      by inventing a citation.
- id: file:human/ADPRHL1/ADPRHL1-uniprot.txt
  title: UniProtKB entry Q8NDY3 (ARHL1_HUMAN), Inactive ADP-ribosyltransferase ARH2
  findings:
  - statement: >-
      The curated record states the catalytic loss twice - once in FUNCTION and once in
      CAUTION - and its feature table contains zero BINDING and zero ACT_SITE features.
      ADPRH (P54922) has 14 such features spanning 20 distinct residue positions and
      ADPRS (Q9NX46) 14 spanning 17; ADPRHL1 has none at all.
    supporting_text: lacks the metal-binding and substrate-binding residues
  - statement: >-
      The FUNCTION line's statement of the measured negative, attributed by similarity to
      the rat and mouse entries.
    supporting_text: showing no activity against O-acetyl-ADP-ribose
  - statement: >-
      The input to the SubCell IEA row, itself ECO:0000250|UniProtKB:Q6AZR2 and therefore
      not independent of the ISS row.
    supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, myofibril, sarcomere'
  - statement: >-
      Corroborates the QuickGO finding that this gene has no IBA annotation, which is a
      deliberate PAINT judgement rather than a coverage gap.
    supporting_text: 0 GO annotations based on evolutionary models.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      All four quotes hand-verified with grep -F against the file in this worktree, each on a
      single physical line so that no UniProt CC continuation is crossed. The repo's
      reference validator does not check file: quotes, so this was done by hand.
- id: file:human/ADPRHL1/ADPRHL1-bioinformatics/RESULTS.md
  title: 'ADPRHL1 (ARH2, Q8NDY3): catalytic-site census against its active paralogues'
  findings:
  - statement: >-
      The identity-matched control that turns the residue observation into an argument.
      Dictyostelium ADPRH, a genuine ARH1 at 48.4% identity - the same distance as ADPRHL1's
      42.6-47.7% - keeps 13 of 20 ligand sites and all six magnesium donors, while every
      ADPRHL1 orthologue keeps 6-7 sites and 2-3 donors.
    supporting_text: Retention therefore is not tracking sequence distance here.
  - statement: >-
      The low-identity active controls pointing the same way from the other side, and the
      reason the result cannot be explained by sequence divergence alone.
    supporting_text: 'Two low-identity active enzymes point the same way: DraG at 27.5% keeps 9, and the'
  - statement: >-
      The independent reproduction of the sibling ADPRH review's panel, split into the
      objective channel (residue and mapped position) and the metric channel (class label).
    supporting_text: identical on all 25 calls
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by the committed script catalytic_site_census.py, which fetches every
      sequence and feature live from UniProt, caches them, self-tests, break-tests its own
      reproduction gate, and regenerates this file byte-identically. Its two external checks
      reproduce published identity figures (46.6% versus 46%, 74.6% versus 75%). All quotes
      taken from it were hand-verified with grep -F because the repo validator skips file
      references.
