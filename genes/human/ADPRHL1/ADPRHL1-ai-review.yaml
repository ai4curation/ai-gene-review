- id: PMID:27217161
  title: The cardiac-restricted protein ADP-ribosylhydrolase-like 1 is essential for
    heart chamber outgrowth and acts on muscle actin filament assembly.
  findings:
  - statement: >-
      The experimental root of all three ISS rows. Morpholino knockdown of all Adprhl1
      variants in Xenopus laevis blocks striated myofibril assembly and prevents ventricle
      outgrowth, without affecting cardiomyocyte number, calcium signal propagation or
      myofibrillar gene expression.
    supporting_text: >-
      Morpholino oligonucleotide-mediated knockdown of all Adprhl1 variants inhibits
      striated myofibril assembly and prevents outgrowth of the ventricle.
  - statement: >-
      Structural modelling on the ADPRH crystal structure 3HFW identifies the specific
      losses in the ADPRHL1 active site, listing them in ADPRH numbering.
    supporting_text: >-
      Three of the four critical aspartates of ADPRH have been lost in mammalian ADPRHL1
      (hADPRH D56, D302, D304 lost, only D55 is conserved), suggesting that ADPRHL1 cation
      binding may be compromised.
  - statement: >-
      The same modelling records a hedged possibility that a different aspartate could
      coordinate metal, which is why the GO:0000287 verdict is argued from the annotation's
      derivation rather than from a flat claim that ADPRHL1 binds no metal.
    supporting_text: >-
      Of particular note is the aspartate, D100, that could provide an alternative
      coordination site for metals but whose presence interferes with the phosphate groups
      of forcibly docked ADP.
  - statement: >-
      The source of the sarcomere localisation, obtained with over-expressed N-terminally
      tagged protein.
    supporting_text: Recombinant Adprhl1 can localize to stripes adjacent to the Z-disc
  - statement: >-
      The caveat on that localisation, from the same study - the endogenous protein could
      not be detected in situ, so no endogenous localisation exists in any species.
    supporting_text: >-
      immunocytochemistry of hearts using the same antibody was not sufficiently sensitive
      to detect endogenous Adprhl1 protein in situ
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified against the cached full text. Fully paginated reference-projection test
      returns 3 annotations over 1 entity (Q6AZR2), so this is one curator reading one paper
      about one gene rather than a bulk import. No retraction, erratum or Crossref update-to.
