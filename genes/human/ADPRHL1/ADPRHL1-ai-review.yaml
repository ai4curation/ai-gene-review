      A more specific term than the existing GO:0055003 row, curated for the orthologous
      gene from a later paper, which failed to propagate because the two Xenopus papers were
      curated onto different accessions of the same gene. Added rather than substituted for
      GO:0055003, because that row correctly reflects the donor it cites.
    supported_by:
    - reference_id: PMID:32726316
      supporting_text: >-
        Mutant alleles encode discrete loss of 1, 3 or 4 amino acids from a di-arginine
        (Arg271-Arg272) containing peptide loop at the centre of the ancestral
        ADP-ribosylhydrolase site.
    - reference_id: PMID:32726316
      supporting_text: >-
        Thus despite lacking catalytic activity, it is the modified (adenosine-ribose)
        substrate binding cleft of Adprhl1 that fulfils an essential role during heart
        formation.
    - reference_id: PMID:37880701
      supporting_text: the arrangement of sarcomeres was less regular
- term:
    id: GO:0051894
    label: positive regulation of focal adhesion assembly
  evidence_type: IMP
  original_reference_id: PMID:37880701
  qualifier: involved_in
  review:
    summary: >-
      Proposed addition from the only functional experiment ever performed on the human
      protein, which contributes nothing to GOA at present - a fully paginated
      reference-projection test on PMID:37880701 returns zero annotations over zero
      entities. CRISPR knockout of ADPRHL1 in human H9 embryonic stem cell-derived
      cardiomyocytes reduces beta-1 integrin, phosphorylated FAK, paxillin and talin, and
      impairs focal adhesion formation; the cells detach from the culture surface, and
      calcium transients and microelectrode-array conduction are perturbed. Inhibiting ROCK
      or myosin II restores focal adhesions and rescues the electrical and calcium
      phenotypes, placing the defect downstream of excessive ROCK-myosin II activity. The
      direction matters and is stated by the experiment: knockout decreases focal adhesion
      formation, so wild-type ADPRHL1 promotes it. The regulation term rather than the bare
      GO:0048041 is chosen deliberately - ADPRHL1 is not a structural component of focal
      adhesions and the paper's mechanism is regulatory and indirect, running through the
      ROCK-myosin II pathway. Evidence code is IMP: this is a genetic knockout scored by
      phenotype, not a direct assay of ADPRHL1 acting on a focal adhesion. No term is
      proposed for the calcium and conduction phenotypes, which the same experiments show
      are downstream of the adhesion defect and are rescued by relieving it. One caveat
      recorded rather than argued away: the paper's own model makes the focal adhesion defect
      downstream of de-repressed ROCK-myosin II, so a curator might reasonably prefer a
      Rho-kinase-pathway term over the focal adhesion one. This row stays on the phenotype
      that was actually measured, on four markers, and rescued - the pathway step is inferred
      from RNA-seq and inhibitor sensitivity, and no assay places ADPRHL1 on ROCK itself.
    action: NEW
    reason: >-
      Direct human loss-of-function evidence for a regulatory role in focal adhesion
      assembly, in the correct direction, currently absent from GOA entirely.
    supported_by:
    - reference_id: PMID:37880701
      supporting_text: suggesting that ADPRHL1 deficiency disrupts the FAs in these cells
    - reference_id: PMID:37880701
      supporting_text: >-
        the expression of Paxillin, a structural protein in FAs, in KO-CM was markedly
        reduced
    - reference_id: PMID:37880701
      supporting_text: >-
        Our results demonstrated that ADPRHL1-deficient cardiomyocytes exhibited abnormal
        adhesion, calcium transients and electrophysiological activity.
core_functions:
- description: >-
    Cleft-dependent, catalysis-independent scaffolding activity required for striated
    myofibril assembly in the growing cardiac ventricle. ADPRHL1 is a pseudoenzyme whose
    ancestral ADP-ribosylhydrolase site has been converted into a di-arginine-containing
    surface (Arg271-Arg272 in place of ADPRH's adenosine-ribose-binding Ser269 and Ser270);
    small in-frame deletions in that loop abolish ventricular myofibril assembly while
    leaving cardiomyocyte specification, myofibrillar gene expression and electrical
    conduction intact. Epitope-tagged protein sits in stripes flanking the Z-disc. The
    ligand or partner engaged by the modified cleft is unknown, so no molecular function
    term is asserted.
  directly_involved_in:
  - id: GO:0055005
    label: ventricular cardiac myofibril assembly
  - id: GO:0003242
    label: cardiac chamber ballooning
  locations:
  - id: GO:0030017
    label: sarcomere
  supported_by:
  - reference_id: PMID:32726316
    supporting_text: >-
      Thus despite lacking catalytic activity, it is the modified (adenosine-ribose)
      substrate binding cleft of Adprhl1 that fulfils an essential role during heart
      formation.
  - reference_id: PMID:27217161
    supporting_text: >-
      Morpholino oligonucleotide-mediated knockdown of all Adprhl1 variants inhibits
      striated myofibril assembly and prevents outgrowth of the ventricle.
- description: >-
    Restraint of the ROCK-myosin II pathway in cardiomyocytes, permitting focal adhesion
    assembly. Loss of ADPRHL1 in human embryonic stem cell-derived cardiomyocytes
    over-activates ROCK-myosin II, reduces beta-1 integrin, phosphorylated FAK, paxillin
    and talin, and impairs focal adhesion formation, cell attachment, calcium handling and
    electrical conduction; pharmacological inhibition of ROCK or of myosin II restores
    them. Whether ADPRHL1 acts on the pathway directly is not established. No location is
    given for this function deliberately: focal adhesions and costameres are not the
    sarcomere, and the only compartment ever reported for the protein is the sarcomere, so
    carrying it over here would assert a place this activity has not been shown to occupy.
  directly_involved_in:
  - id: GO:0051894
    label: positive regulation of focal adhesion assembly
  supported_by:
  - reference_id: PMID:37880701
    supporting_text: >-
      Our results demonstrated that ADPRHL1-deficient cardiomyocytes exhibited abnormal
      adhesion, calcium transients and electrophysiological activity.
  - reference_id: PMID:37880701
    supporting_text: >-
      the expression of Paxillin, a structural protein in FAs, in KO-CM was markedly
      reduced
knowledge_gaps:
- gap_statement: >-
    ADPRHL1 has no known molecular function. No ligand, no substrate, no verified protein
    partner and no measured biochemical activity of any kind has been reported. The
    genetics say the vestigial substrate cleft is what matters, but what that cleft binds
    is undetermined - the 2020 study lists it as an open question, asking whether Adprhl1
    retains binding for a partially degraded ADP-ribose derivative such as phospho-ribose,
    or whether the cleft is itself a target for ADP-ribosylation.
  boundary: >-
    Established: the protein exists and is detected by mass spectrometry (UniProt PE 1); it
    folds on the all-alpha ADP-ribosylglycohydrolase scaffold; it is inactive against
    O-acetyl-ADP-ribose and against the ADP-ribose-acceptor linkages that ARH1 and ARH3
    cleave; three of six magnesium-coordinating positions and both adenosine-ribose serines
    are lost; and one to four residue deletions in the Arg271-Arg272 loop abolish
    ventricular myofibril assembly. Not established: any binding activity, any partner, and
    whether the loop acts as a binding surface, a protein-protein interface or something
    else. IntAct returns zero interactions for Q8NDY3, against 17 for ADPRH and 35 for
    ADPRS by the same query, so this is a real absence and not a failed lookup.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Every molecular function currently in GOA for this gene is removed by this review, so
    after it the gene has no MF annotation at all. That is the honest state: ADPRHL1 is an
    essential cardiac protein with a completely undefined activity, and the family review
    itself cautions that the in vitro negatives may reflect the use of model substrates
    rather than genuine inertness.
  resolution: >-
    Identify what the Arg271-Arg272 cleft binds - for example by photo-crosslinking or
    pull-down from cardiomyocyte extracts using wild-type versus loop-deleted ADPRHL1 as
    bait - and re-test hydrolase activity against physiological ADP-ribosylated cardiac
    substrates rather than the small-molecule model substrates used so far.
  provenance:
  - reference_id: PMID:36497109
    supporting_text: >-
      However, the lack of ARH2 catalytic activity may be the result of the use of model
      substrates.
  - reference_id: PMID:36497109
    supporting_text: Function of ARH2 would be an interesting area of future study.
- gap_statement: >-
    The subcellular localisation of endogenous ADPRHL1 has never been imaged, in any
    species. Every localisation statement in the record - UniProt's SUBCELLULAR LOCATION
    line, the SubCell IEA row and the ISS row - descends from a single Xenopus experiment
    using transgenically over-expressed, N-terminally epitope-tagged protein.
  boundary: >-
    Established: over-expressed tagged Xenopus Adprhl1 localises to stripes flanking the
    Z-disc and a diffuse stripe at the H-zone; human ADPRHL1 is heart-, skeletal-muscle- and
    tongue-enriched and expressed in left ventricle myocardium; and human ADPRHL1 knockout
    disorganises sarcomeres. Not established: where the endogenous protein is, at native
    abundance, in any species - the antibody raised against the protein was not sensitive
    enough to detect it in situ - and nothing at all about the human protein's location.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Two of the seven GOA rows are this one observation, and it is the only positive evidence
    for the cellular component. If the tagged construct mislocalises, both rows are wrong
    together and there is no independent check anywhere in the record.
  resolution: >-
    Endogenous immunofluorescence or a knock-in fluorescent tag at the native locus in human
    iPSC-derived cardiomyocytes, with the ADPRHL1 knockout line as the specificity control.
  provenance:
  - reference_id: PMID:27217161
    supporting_text: >-
      immunocytochemistry of hearts using the same antibody was not sufficiently sensitive
      to detect endogenous Adprhl1 protein in situ
- gap_statement: >-
    Whether a mammal actually requires ADPRHL1 for heart development is untested. The only
    published mammalian allele deletes exons 3-4, and those animals are normal - but the
    allele still produces the smaller ADPRHL1 protein species, so it is not a null and
    cannot answer the question.
  boundary: >-
    Established: loss of all Adprhl1 variants in Xenopus prevents ventricle outgrowth; loss
    in human embryonic stem cell-derived cardiomyocytes impairs adhesion, calcium handling
    and conduction; and mice lacking exons 3-4 are viable and normal while retaining the
    small protein species, which localises the essential activity to the C-terminal portion.
    Not established: the phenotype of a true mammalian null. As of the 2022 family review no
    Arh2-deficient mouse had been reported; a knockout has since been described only in a
    preprint with no PubMed identifier, which this review does not rely on.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  significance: >-
    Three of the seven GOA rows are ISS transfers of Xenopus developmental phenotypes into
    human. They are sound as ortholog inferences, but no mammalian loss-of-function result
    yet tests them, and the one mammalian allele that exists is hypomorphic by construction.
  resolution: >-
    A conditional or full mouse Adprhl1 null in which loss of both the 40 kDa and the
    smaller protein species is confirmed by western blot, phenotyped for chamber
    morphogenesis and myofibril organisation.
  provenance:
  - reference_id: PMID:32726316
    supporting_text: >-
      Mice lacking Adprhl1 exons 3-4 are normal but production of the smaller ADPRHL1
      species is unaffected
  - reference_id: PMID:32726316
    supporting_text: What is the precise composition of the smaller 23 kDa Adprhl1 protein?
suggested_questions:
- question: >-
    To InterPro and GO Central: IPR012108 "ADP-ribosylarginine hydrolase" maps to GO:0000287,
    GO:0003875 and GO:0051725, but a majority of its own reviewed members are pseudoenzymes.
    Of the entry's 1282 proteins, 11 are Swiss-Prot; 4 are named "ADP-ribosylhydrolase ARH1"
    and 7 are named "Inactive ADP-ribosyltransferase ARH2", each carrying a CAUTION that it
    lacks the metal-binding and substrate-binding residues. The result is 21 IEA annotations
    across seven ARH2 orthologues with no experimental, ISS or IBA support anywhere behind
    them. Either the entry should be split so that PIRSF016939's ARH1 and ARH2 branches are
    separate signatures, or the three GO mappings should be withdrawn from it. Note the
    contrast that shows this is one entry and not a systemic problem: the other three
    signatures ADPRHL1 matches - IPR050792, IPR005502 and IPR036705 - map to nothing at all,
    and PAINT independently reaches the correct answer, giving GO:0003875 to 20 ADPRH
    orthologues from node PTN009030515 and to no ARH2 protein.
  experts:
  - InterPro curators
  - GO Central
- question: >-
    To UniProt (ARBA): rule ARBA00088955 assigns GO:0003875 on a single condition set, FunFam
    id 1.10.4080.10:FF:000002 AND taxon Mammalia. That FunFam is named "ADP-ribosylarginine
    hydrolase isoform X1" and contains ADPRH and ADPRHL1 alike - P54922, Q8NDY3, Q8BGK2,
    Q5XIB3, Q3ZBM1, Q5RCJ0, Q6AZR2 and Q5XJB9 all match it, while ARH3 sits in FF:000001. The
    rule therefore grants a catalytic molecular function to five mammalian pseudoenzymes on
    the strength of a structural family's name, in entries whose own CAUTION line says the
    catalytic residues are absent. A negative taxon or a negative condition excluding the ARH2
    orthologues would fix it.
  experts:
  - UniProt ARBA developers
- question: >-
    To UniProt (nomenclature): Q8NDY3's RecName is "Inactive ADP-ribosyltransferase ARH2", and
    the same name is used for all seven ARH2 orthologues. Transferase is the wrong reaction
    direction. The entry's own SIMILARITY line assigns it to the ADP-ribosylglycohydrolase
    family, its AltName is "[Protein ADP-ribosylarginine] hydrolase-like protein 1", and no
    ARH-family protein has been proposed to add ADP-ribose. Suggest "Inactive
    ADP-ribosylhydrolase ARH2", consistent with ADPRH_HUMAN "ADP-ribosylhydrolase ARH1" and
    ADPRS_HUMAN "ADP-ribosylhydrolase ARH3". This name is what GOA prints in the GENE NAME
    column of every ADPRHL1 annotation.
  experts:
  - UniProt nomenclature curators
- question: >-
    To GOA and Xenbase: the ISS pipeline and Xenbase are curating the same Xenopus laevis gene
    onto different accessions, and one whole paper is invisible as a result. All three of
    human ADPRHL1's ISS rows transfer from UniProtKB:Q6AZR2 (ARHL1_XENLA, Swiss-Prot), which
    carries the 2016 morpholino paper. Xenbase curated the 2020 CRISPR paper (PMID:32726316)
    onto A0A8J0UG54 and A0A8J0UIM8, TrEMBL entries for adprhl1.L, giving GO:0055005,
    GO:0030041 and GO:0036342 by IMP - none of which has reached any mammalian orthologue.
    Merging or cross-linking those accessions would let the later evidence propagate.
  experts:
  - GOA curators
  - Xenbase curators
- question: >-
    To GOA: PMID:37880701 is the only functional experiment ever performed on human ADPRHL1 -
    a CRISPR knockout in H9 embryonic stem cell-derived cardiomyocytes - and it contributes
    zero annotations. Beyond the focal adhesion term proposed here, it supports human IMP
    evidence for GO:0055003, which the gene currently holds only by ISS from frog.
  experts:
  - GOA curators
- question: >-
    To the ADPRH reviewers (paint/ADPRH, PR 2332): the two reviews were run independently and
    agree on every residue and mapped position across the five shared positions and five
    shared accessions. They differ on the class label at seven of those calls, because that
    review scores substitutions with hand-defined conservative groups while this one used
    BLOSUM62. The difference is entirely at aspartate-to-asparagine and serine-to-alanine,
    which BLOSUM62 scores positively. This review resolves the clash in favour of the ADPRH
    review by adding a third, mechanism-anchored test - whether the coordinating carboxylate
    or hydroxyl oxygen survives - which calls both substitutions lost. The anchor is that
    aspartate-to-asparagine at a vicinal catalytic aspartate is exactly the substitution
    PMID:17075046 uses to abolish ARH3 activity. Recorded here rather than silently absorbed.
  experts:
  - ai-gene-review PAINT campaign reviewers
suggested_experiments:
- description: >-
    Identify what the Arg271-Arg272 cleft binds. Express wild-type ADPRHL1 and the
    loop-deletion alleles characterised in PMID:32726316 as tagged baits in human iPSC-derived
    cardiomyocytes and compare interactomes; a partner lost specifically by the loop deletions
    is a candidate for the molecular function that this review could not annotate.
- description: >-
    Re-test hydrolase activity against physiological substrates. The published negatives used
    O-acetyl-ADP-ribose and other model substrates; the family review flags that as a possible
    explanation for the null result. Assay recombinant ADPRHL1 against ADP-ribosylated proteins
    purified from cardiac muscle, and against phospho-ribosylated derivatives, which the 2020
    paper raises as a candidate remaining ligand.
- description: >-
    Image endogenous ADPRHL1. Knock a fluorescent tag into the native ADPRHL1 locus in human
    iPSCs, differentiate to cardiomyocytes, and image against the knockout line as the
    specificity control. This would give the first localisation of the protein at native
    abundance in any species and the first in human, and would test whether the Z-disc-flanking
    distribution seen with over-expressed tagged Xenopus protein is genuine.
- description: >-
    Make a true mammalian null. The existing mouse allele deletes exons 3-4 and still produces
    the smaller ADPRHL1 species. A full knockout, verified by loss of both protein species on
    western blot, would test whether the Xenopus chamber-outgrowth requirement holds in a
    mammal and would validate or refute the three ISS rows in this review.
- description: >-
    Determine which ADPRHL1 protein species matters. The 40 kDa and 23 kDa forms differ in
    abundance across development and the mouse exon 3-4 allele separates them genetically.
    Define the 23 kDa species by mass spectrometry and test the two forms separately for rescue
    of the knockout phenotype in human cardiomyocytes.
references:
- id: GO_REF:0000002
