- term:
    id: GO:0055003
    label: cardiac myofibril assembly
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6AZR2
  review:
    summary: >-
      The best-supported annotation on this gene, and the only one with independent human
      evidence behind it. The ISS is faithful to its donor: Q6AZR2 holds GO:0055003 by IMP
      from PMID:27217161, where knockdown blocks striated myofibril assembly and
