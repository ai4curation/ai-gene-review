    reason: >-
      A faithful ortholog transfer of a specific loss-of-function phenotype, now also
      supported by a human knockout. Left unmodified because the row correctly reflects the
      term its cited donor holds; the refinement is proposed additively below.
    supported_by:
    - reference_id: PMID:27217161
