core_functions:
- description: Calcium/calmodulin-responsive transmembrane adenylyl cyclase that catalyzes ATP
    conversion to cAMP at the plasma membrane and couples Gs-activated GPCR inputs plus calcium
    signals to local cAMP production.
  molecular_function:
    id: GO:0008294
    label: calcium- and calmodulin-responsive adenylate cyclase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0006171
    label: cAMP biosynthetic process
  - id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  supported_by:
  - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Catalyzes the formation of the signaling molecule cAMP in response to G protein
      signaling. Mediates responses to increased cellular Ca(2+)/calmodulin levels
  - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=ATP = 3',5'-cyclic AMP + diphosphate
  - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
    record_section:
    - CC:ACTIVITY REGULATION
    supporting_text: Activated by G(s) G alpha protein GNAS. Inhibited by G(i) G alpha protein
      GNAI1.
  - reference_id: PMID:8314585
    supporting_text: The activity of the chimeric gene product and its sensitivity to calmodulin and
      calcium were indistinguishable from those of the bovine type I adenylyl cyclase.
proposed_new_terms: []
suggested_questions:
- question: Which transmembrane adenylyl cyclase isoforms, if any, mediate FSHR-to-cAMP signaling in
    human FSH target cells?
- question: Which mouse Adcy1 synaptic and circadian roles have direct evidence for conservation in
    human neurons or retina?
suggested_experiments:
- description: Measure isoform-resolved cAMP production after FSHR activation in an FSH-responsive
    human granulosa-cell model after ADCY1, ADCY3, ADCY6 and ADCY9 knockdown or knockout.
  experiment_type: isoform-resolved receptor-effector test
