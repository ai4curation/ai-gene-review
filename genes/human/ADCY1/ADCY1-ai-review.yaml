  review:
    summary: Forskolin response reflects experimental activation of adenylyl cyclases.
    action: KEEP_AS_NON_CORE
    reason: Forskolin pharmacologically activates adenylyl cyclases and rescues cAMP-dependent
      hippocampal LTP in mouse AC1 mutants when applied at high concentration. This is a real but
      non-physiological response context for an adenylyl cyclase.
