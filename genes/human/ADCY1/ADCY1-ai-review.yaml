  review:
    summary: Cytoplasmic ADCY1 signal from mouse is kept as a non-core, lower-resolution location.
    action: KEEP_AS_NON_CORE
    reason: The core location of ADCY1 is the plasma membrane and membrane rafts. Cytoplasm is less
      precise for a multi-pass membrane cyclase, but the reviewed UniProt record also carries a
      cytoplasmic location inferred from mouse cochlear hair-cell work, so the row is kept as
      peripheral rather than removed.
    supported_by:
    - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Cytoplasm {ECO:0000250|UniProtKB:O88444}
