id: Q08828
gene_symbol: ADCY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADCY1 encodes adenylyl cyclase type 1, a multi-pass plasma-membrane enzyme enriched in neural
  and endocrine tissues. The enzyme converts ATP to cAMP downstream of stimulatory G protein signaling
  and is directly activated by Ca(2+)/calmodulin, allowing calcium influx and receptor signals to converge
  on local cAMP production. Ortholog studies place AC1 in hippocampal and retinal circuits where calcium-stimulated
  cAMP contributes to synaptic plasticity, long-term potentiation, memory and retinal circadian physiology.'
existing_annotations:
- term:
    id: GO:0003008
    label: system process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026405
  review:
    summary: The ARBA system-process call is too broad for a membrane adenylyl cyclase.
    action: MARK_AS_OVER_ANNOTATED
    reason: ADCY1 has a clear molecular role in G protein- and calcium/calmodulin-regulated cAMP
      synthesis; the annotation gives only a root-level physiological process and does not specify
      which ADCY1-dependent system process is meant.
    supported_by:
    - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalyzes the formation of the signaling molecule cAMP in response to G
        protein signaling. Mediates responses to increased cellular Ca(2+)/calmodulin levels
- term:
    id: GO:0003091
    label: renal water homeostasis
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-432040
  qualifier: involved_in
  review:
    summary: The vasopressin water-homeostasis event is a generic adenylyl-cyclase step rather than
      ADCY1-specific evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: Renal water homeostasis is downstream of vasopressin receptor signaling through cAMP in
      collecting-duct cells, but the cached Reactome event summarizes the AQP2 translocation pathway
      and does not identify ADCY1 as the physiological cyclase isoform. The ADCY1 review should keep
      the catalytic cAMP-synthesis activity without assigning this kidney-specific homeostasis
      process to type 1 adenylyl cyclase.
    supported_by:
    - reference_id: Reactome:R-HSA-432040
      supporting_text: The permeability of the epithelium is regulated by vasopressin, which
        activates the phosphorylation and subsequent translocation of AQP2 from intracellular
        vesicles to the plasma membrane.
