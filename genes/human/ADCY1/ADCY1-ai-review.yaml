        fraction, AC1 localized strongly to the PSD with minimal expression in the PAZ.
- term:
    id: GO:0098978
    label: glutamatergic synapse
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:O88444
  - ensembl:ENSMUSP00000020706
  review:
    summary: Mouse AC1 contributes to glutamatergic hippocampal synapses.
    action: KEEP_AS_NON_CORE
    reason: The mossy fiber to CA3 and Schaffer collateral to CA1 hippocampal synapses are
      glutamatergic. Mouse AC1 is expressed in these circuits and is required for mossy-fiber LTP,
      so the glutamatergic-synapse context is plausible but peripheral.
    supported_by:
    - reference_id: PMID:9547227
      supporting_text: These data indicate that coupling of Ca2+ to activation of AC1 is crucial for
        mossy fiber LTP
    - reference_id: PMID:17335981
      supporting_text: AC1 protein increased in abundance in the neonatal hippocampus from postnatal
        days 7-14. By adulthood, abundant AC1 protein expression was observed in the mossy fiber
        tract in the hippocampus
