  review:
    summary: Mouse AC1/AC8 calcium-stimulated cAMP production supports late-phase LTP.
    action: KEEP_AS_NON_CORE
    reason: AC1 and AC8 are redundant for hippocampal late-phase LTP and long-term memory in mouse.
      That supports a non-core orthology-propagated role in promoting synaptic potentiation,
      downstream of ADCY1 catalytic cAMP production.
