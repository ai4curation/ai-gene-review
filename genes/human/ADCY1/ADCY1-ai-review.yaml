  - ensembl:ENSMUSP00000020706
  review:
    summary: Mouse AC1 is present in postsynaptic-density membrane fractions.
    action: KEEP_AS_NON_CORE
    reason: The mouse donor paper localized AC1 robustly to synaptosomal postsynaptic density
      fractions. The human row is an orthology transfer of that neuronal sublocation and is kept as
      non-core.
