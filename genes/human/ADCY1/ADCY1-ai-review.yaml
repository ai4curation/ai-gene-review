  - ensembl:ENSMUSP00000020706
  review:
    summary: The neuroinflammatory-response transfer rests on a mouse AC1/AC8 double-knockout pain
      phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor paper showed that AC1 and AC8 together in anterior cingulate cortex are needed
      for inflammatory allodynia behavior in mouse. That is downstream physiology of
      calcium-stimulated cAMP signaling, not evidence that ADCY1 itself executes a neuroinflammatory
      process.
    supported_by:
