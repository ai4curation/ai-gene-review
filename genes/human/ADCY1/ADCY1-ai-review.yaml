  review:
    summary: ADCY1 is a multi-pass plasma-membrane adenylyl cyclase.
    action: ACCEPT
    reason: 'Plasma membrane is the core cellular component for the human type 1 adenylyl cyclase: the
      human adrenal study detected ADCY1 at the membrane and the UniProt record treats it as a cell-membrane
      multi-pass protein. The Reactome TAS rows all use ADCY1 in plasma-membrane adenylyl-cyclase events,
      and the location itself is correct even where the upstream pathway context is not ADCY1-specific.'
    supported_by:
    - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Cell membrane {ECO:0000269|PubMed:11549699}; Multi-pass membrane protein
    - reference_id: PMID:11549699
      supporting_text: adenylyl cyclase 1 was detected in cells at the membrane level
