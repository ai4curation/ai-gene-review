  review:
    summary: ADCY1 is a bona fide transmembrane adenylyl cyclase.
    action: ACCEPT
    reason: ADCY1 catalyzes conversion of ATP to cAMP, so adenylate cyclase activity is a core
      molecular function. The bovine type 1 ortholog P19754 is the experimental source for the
      orthology transfer, and the human cloning paper showed that the human C-terminal half produced
      a calcium/calmodulin-sensitive enzyme when substituted into the bovine type 1 protein.
    supported_by:
    - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=ATP = 3',5'-cyclic AMP + diphosphate
    - reference_id: PMID:8314585
      supporting_text: The activity of the chimeric gene product and its sensitivity to calmodulin
        and calcium were indistinguishable from those of the bovine type I adenylyl cyclase.
