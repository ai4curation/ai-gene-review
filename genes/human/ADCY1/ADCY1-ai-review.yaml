  review:
    summary: Mouse AC1 couples presynaptic Ca(2+) to cAMP/PKA in mossy-fiber LTP.
    action: KEEP_AS_NON_CORE
    reason: Mossy-fiber LTP is a presynaptic hippocampal form of plasticity, and AC1 loss impairs it
      while downstream forskolin responsiveness remains intact. That supports a presynaptic
