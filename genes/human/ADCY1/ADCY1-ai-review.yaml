  review:
    summary: ADCY1 is a bona fide transmembrane adenylyl cyclase.
    action: ACCEPT
    reason: ADCY1 catalyzes conversion of ATP to cAMP, so adenylate cyclase activity is a core
      molecular function. The PAINT IBD at PTN002899368 places the shared adenylate-cyclase reaction
      on the eukaryotic class-4/guanylyl-cyclase family, and Q08828 belongs to the type 1 subfamily.
    supported_by:
    - reference_id: file:human/ADCY1/ADCY1-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=ATP = 3',5'-cyclic AMP + diphosphate
