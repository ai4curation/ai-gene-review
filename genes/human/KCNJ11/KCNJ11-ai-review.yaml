id: Q14654
gene_symbol: KCNJ11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KCNJ11 encodes Kir6.2, the pore-forming subunit of the ATP-sensitive potassium (KATP) channel.
  Four Kir6.2 subunits form an inward-rectifier K+-selective pore that assembles with four sulfonylurea
  receptor subunits (SUR1/ABCC8 in pancreatic beta cells and neurons; SUR2A/SUR2B/ABCC9 in cardiac, skeletal
  and smooth muscle) into a hetero-octameric channel at the plasma membrane. Cytoplasmic ATP binding to
  Kir6.2 closes the pore, whereas MgADP acting through SUR opens it, so the channel couples cellular energy
  state to membrane excitability. In beta cells, rising glucose metabolism increases the ATP/ADP ratio
  and closes KATP channels, depolarizing the membrane and triggering calcium-dependent insulin secretion;
  open channels hold the cell hyperpolarized and restrain insulin release. Loss-of-function variants cause
  congenital hyperinsulinism (familial hyperinsulinemic hypoglycemia type 2), whereas gain-of-function
  variants that reduce ATP sensitivity cause transient or permanent neonatal diabetes, sometimes with
  developmental delay and epilepsy (DEND) reflecting neuronal and muscle KATP channels.
