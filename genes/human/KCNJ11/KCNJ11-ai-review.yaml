core_functions:
- description: Forms the K+-selective inward-rectifier pore of the ATP-sensitive potassium (KATP) channel,
    gated closed by cytoplasmic ATP binding to Kir6.2, conducting potassium across the plasma membrane
    to set membrane potential in excitable cells.
  molecular_function: *id001
  directly_involved_in:
  - *id002
  - id: GO:0042391
    label: regulation of membrane potential
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008282
    label: inward rectifying potassium channel
  supported_by:
  - reference_id: file:human/KCNJ11/KCNJ11-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Inward rectifier potassium channel that forms the pore of ATP-sensitive potassium
      channels (KATP), regulating potassium permeability as a function of cytoplasmic ATP and ADP concentrations
      in many different cells
  - reference_id: PMID:7502040
    supporting_text: Coexpression with the sulfonylurea receptor SUR reconstituted an inwardly rectifying
      potassium conductance of 76 picosiemens that was sensitive to adenosine triphosphate (ATP) (IKATP)
  - reference_id: PMID:29286281
    supporting_text: human pancreatic KATP channel, containing the ABC transporter SUR1 and the inward-rectifier
      K+ channel Kir6.2
  - reference_id: PMID:12860923
    supporting_text: mutation of three positively charged residues, R50, K185 and R201, impairs the ability
      of ATP to close the channel
- description: In pancreatic beta cells, the Kir6.2/SUR1 KATP channel couples glucose metabolism (ATP/ADP
    ratio) to membrane potential; open channels restrain, and their closure triggers, insulin secretion.
    Loss of function causes congenital hyperinsulinism; gain of function causes neonatal diabetes.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0046676
    label: negative regulation of insulin secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008282
    label: inward rectifying potassium channel
  supported_by:
  - reference_id: PMID:8923010
    supporting_text: Closure of ATP-sensitive potassium channels in pancreatic islet beta-cells initiates
      a cascade of events that leads to insulin secretion.
  - reference_id: PMID:8923010
    supporting_text: Kir6.2 is necessary, although not sufficient, for normal regulation of insulin release
  - reference_id: PMID:15583126
    supporting_text: increased K(ATP) currents hyperpolarize pancreatic beta cells and impair insulin
      secretion
  - reference_id: PMID:15115830
    supporting_text: Because ATP-sensitive potassium (K(ATP)) channels mediate glucose-stimulated insulin
      secretion from the pancreatic beta cells
suggested_questions:
- question: How do the stoichiometric contributions of individual mutant Kir6.2 subunits within the tetramer
    determine whether a variant causes isolated neonatal diabetes or the DEND spectrum, and can this predict
    sulfonylurea responsiveness?
- question: Do mitochondrial or intracellular pools of Kir6.2 reported in some tissues contribute functionally,
    or are they trafficking intermediates?
suggested_experiments:
- description: Systematic deep mutational scanning of Kir6.2 co-expressed with SUR1 measuring surface
    expression, ATP IC50 and open probability, to classify hyperinsulinism (loss-of-function) versus neonatal
    diabetes (gain-of-function) variants.
