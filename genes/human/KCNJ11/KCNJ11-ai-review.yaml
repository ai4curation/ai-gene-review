  review:
    summary: ISS annotation to ATPase-coupled monoatomic cation transmembrane transporter activity.
    action: REMOVE
    reason: Kir6.2 is a passive, gated K+ channel pore; it has no ATPase domain and does not couple ATP
      hydrolysis to cation transport. Nucleotide binding inhibits the pore rather than energizing transport.
      The term describes a different mechanism (a P-type or ABC pump).
