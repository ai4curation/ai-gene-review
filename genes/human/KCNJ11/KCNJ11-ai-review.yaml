  review:
    summary: IDA to voltage-gated potassium channel activity from a study of Kir6.2 membrane targeting
      by ankyrin-B. Kir6.2 is a ligand (ATP/ADP)-gated inward rectifier, not a voltage-gated (Kv-type)
      channel.
    action: MODIFY
    reason: Kir6.2 lacks a voltage-sensor domain; its gating is controlled by intracellular adenine nucleotides
      and PIP2, and rectification arises from internal Mg2+/polyamine block. The assayed channel activity
      is better captured by ATP-activated (ATP-sensitive) inward rectifier potassium channel activity.
    supported_by:
    - reference_id: file:human/KCNJ11/KCNJ11-uniprot.txt
