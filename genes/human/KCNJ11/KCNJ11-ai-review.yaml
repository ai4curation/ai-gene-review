        ability of ATP to close the channel
    - reference_id: file:human/KCNJ11/KCNJ11-deep-research-falcon.md
      supporting_text: ATP is an intracellular **inhibitory gating ligand**, not the ion transported through
        the pore, and Kir6.2 is not an enzyme.
