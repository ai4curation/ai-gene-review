existing_annotations:
- term:
    id: GO:0071359
    label: cellular response to dsRNA
  evidence_type: ISS
  original_reference_id: PMID:36162816
  qualifier: involved_in
  review:
    summary: Proposed by orthology to mouse Rtl5, whose knockout delays removal of injected dsRNA analog
      from the brain.
    action: NEW
    reason: Human RTL5 is the 1:1 ortholog of mouse Rtl5 (same PANTHER subfamily PTHR15503:SF36, conserved
      acidic character). Mouse RTL5 accumulates on injected dsRNA and its knockout delays dsRNA clearance
      with no effect on LPS clearance, showing a specific role in the dsRNA response. No human experimental
      data exist, so ISS.
    supported_by:
    - reference_id: PMID:36162816
      supporting_text: Experiments using Rtl6 or Rtl5 knockout mice provided additional evidence that
        RTL6 and RTL5 act as factors against LPS and dsRNA, respectively, in the brain
    - reference_id: PMID:36162816
      supporting_text: indicating that, without RTL5, dsRNA removal was significantly delayed in the brain
    - reference_id: PMID:36162816
      supporting_text: In the case of LPS injection in the Rtl5 KO mice, the LPS removal activity was
        essentially unaffected.
    - reference_id: file:human/RTL5/RTL5-deep-research-openscientist.md
      supporting_text: Structurally, AlphaFold modeling confirms the protein consists of a single ordered
        Gag/capsid-like domain flanked by large, disordered, acidic segments
