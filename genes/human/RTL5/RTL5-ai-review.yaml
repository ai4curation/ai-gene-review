suggested_questions:
- question: Does RTL5 bind dsRNA directly (and with what affinity and length/sequence preference), or
    does it accumulate on dsRNA only as part of larger RTL5/RTL6 assemblies?
- question: How is RTL5, which lacks a signal peptide, released from microglia into the extracellular
    space?
- question: Is the pituitary ACTH phenotype of Rgag4/Rtl5 knockdown reproduced in Rtl5 knockout mice,
    and is it related to the microglial function?
- question: Does RTL5 retain any capsid-like self-assembly, given its single ordered Gag capsid-like domain
    flanked by long acidic disordered regions?
suggested_experiments:
- description: Recombinant RTL5 (full length and capsid-like domain) binding assays with dsRNA, poly(I:C),
    ssRNA and CpG DNA by EMSA or fluorescence anisotropy, plus negative-stain EM for higher-order assemblies.
- description: Quantitative clearance kinetics of labeled poly(I:C) and live RNA-virus challenge in Rtl5
    KO versus wild-type brain, with readouts of interferon response and viral load.
- description: Pituitary hormone (ACTH, POMC) measurements and stress-axis testing in Rtl5 knockout mice.
