core_functions:
- description: Microglia-derived extracellular innate immune factor that accumulates on double-stranded
    RNA (and unmethylated CpG DNA) in the brain and is required for prompt clearance of dsRNA; the underlying
    biochemical activity (direct nucleic-acid binding or assembly into PAMP-sequestering granules) is
    not yet defined.
