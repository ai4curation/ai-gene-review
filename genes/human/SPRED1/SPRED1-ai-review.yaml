  review:
    summary: Binding to the receptor tyrosine kinase KIT (stem cell factor receptor). SPRED proteins were
      originally isolated as KIT/c-Fms-interacting proteins and share a central KIT-binding domain (KBD).
    action: KEEP_AS_NON_CORE
    reason: KIT binding via the KBD is well established for SPRED family members (transferred here from
      mouse Spred1), but its functional consequence is less clear than the NF1-recruitment mechanism.
      Retain as a non-core binding function.
