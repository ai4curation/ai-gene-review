- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:22751498
  review:
    summary: SPRED1 binds neurofibromin via its EVH1 domain and, via its C-terminal SPR domain, brings
      it to the plasma membrane where NF1 inactivates Ras; membrane targeting (rescued by a CAAX fusion)
      and NF1 binding are both required.
    action: NEW
    reason: 'This is the molecular activity by which SPRED1 suppresses Ras-ERK signalling and is not represented
      by any existing annotation (only ''protein binding'' to NF1). SPRED1 itself performs the work: it
      is the bridge between NF1 and the membrane; NF1 performs GAP catalysis, and SPRED1 does not alter
      GAP activity. Supported by cell biology (Stowe 2012), biochemistry (Dunzendorfer-Matt 2016) and
      structure (Yan 2020).'
    supported_by:
    - *id007
    - *id006
    - &id018
      reference_id: PMID:27313208
      supporting_text: Binding is compatible with simultaneous binding of Ras and does not interfere with
        GAP activity.
    - &id019
      reference_id: PMID:32697994
      supporting_text: This inhibition of RAS is thought to occur primarily through SPRED1 binding and
        recruitment of neurofibromin, a RasGAP, to the plasma membrane.
    - reference_id: file:human/SPRED1/SPRED1-deep-research-falcon.md
      supporting_text: SPRED1 therefore has no catalytic reaction, enzyme substrate specificity or transport
        substrate of its own.
- term:
    id: GO:0046580
    label: negative regulation of Ras protein signal transduction
