  original_reference_id: PMID:22751498
  review:
    summary: SPRED1 overexpression reduced and SPRED1 depletion increased EGF-stimulated Ras-GTP levels;
      the effect requires neurofibromin.
    action: NEW
    reason: 'SPRED1 acts at the level of Ras itself (Ras-GTP), upstream of RAF/ERK, by delivering the
      RasGAP NF1 to membrane Ras. Participation test: SPRED1 performs the adaptor/recruitment step that
      the GAP-catalysed inactivation depends on (scaffold-type contribution). Comparator check: the Sprouty
      feedback regulators SPRY1, SPRY2 and SPRY4 carry this term (IBA), as does NF1 (IEA); SPRED1 lacks
      it only because SPREDs sit in a separate PANTHER family (PTHR11202).'
    supported_by:
