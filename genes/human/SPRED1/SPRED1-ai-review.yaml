core_functions:
- description: 'Membrane-recruitment adaptor for the RasGAP neurofibromin: the EVH1 domain binds the NF1
    GRD (GAPex) and the SPR domain anchors SPRED1 at the plasma membrane, positioning NF1 to inactivate
    Ras-GTP and thereby suppress growth-factor-induced Ras-ERK signalling (negative feedback). SPRED1
    is non-catalytic and does not change NF1 GAP activity.'
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0046580
    label: negative regulation of Ras protein signal transduction
  - id: GO:0070373
    label: negative regulation of ERK1 and ERK2 cascade
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id015
  - *id007
  - *id017
  - *id018
  - *id019
  - *id016
- description: 'Secondary kinase-regulatory activity via the C-terminal cysteine-rich domain: direct inhibition
    of the cofilin kinase TESK1 (attenuating stress-fibre formation) and competition with substrates for
