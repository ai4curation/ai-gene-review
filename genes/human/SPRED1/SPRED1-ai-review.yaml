- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26635368
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21359
  review:
    summary: Hirata et al. mapped the SPRED1 EVH1 domain binding to the N- and C-terminal helices of the
      neurofibromin GAP-related domain (GRD) by Y2H and co-IP, and Legius-syndrome EVH1 mutations that
      reduced binding also lost ERK suppression.
    action: MODIFY
    reason: Interaction with neurofibromin (NF1, P21359) is the central mechanistic interaction of SPRED1,
      but 'protein binding' does not say what NF1 is. GTPase activating protein binding captures the specific
      partner class; the functional consequence (membrane recruitment of the RasGAP) is captured by the
      proposed core MF protein-membrane adaptor activity.
    proposed_replacement_terms:
    - id: GO:0032794
      label: GTPase activating protein binding
    supported_by:
    - &id016
      reference_id: PMID:26635368
      supporting_text: These data clearly demonstrate that SPRED1 inhibits the Ras-ERK pathway by recruiting
        neurofibromin to Ras through the EVH1-GRD interaction
    - &id017
      reference_id: PMID:27313208
      supporting_text: Here we show that the EVH1 domain of Spred1 binds to the noncatalytic (GAPex) portion
        of the GAP-related domain (GRD) of neurofibromin.
