suggested_questions:
- question: Does SPRED1 also inhibit RAF activation independently of neurofibromin (as originally proposed
    by Wakioka et al. 2001), or is all of its ERK-suppressive activity NF1-dependent in physiological
    settings?
- question: What is the physiological role of SPRED1 binding to KIT via the KBD, and does KIT-dependent
    tyrosine phosphorylation regulate NF1 recruitment?
- question: Is the reported nuclear/nucleoplasmic SPRED1 signal real and functional, or an antibody/overexpression
    artefact?
- question: Which zDHHC enzymes S-acylate endogenous SPRED1 and does acylation (versus SPR-domain lipid/caveolin
    binding) determine membrane targeting?
suggested_experiments:
- description: Compare ERK and Ras-GTP suppression by wild-type SPRED1 in NF1-null versus NF1-reconstituted
    isogenic cells to quantify any NF1-independent (e.g. RAF-directed) activity.
- description: Endogenous tagging of SPRED1 (CRISPR knock-in) with live imaging to determine its native
    distribution between plasma membrane, cytosol and nucleus under growth-factor stimulation.
- description: Map S-acylation sites in the SPR domain and test acylation-deficient mutants for membrane
    localization and NF1 recruitment.
