id: Q7Z699
gene_symbol: SPRED1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SPRED1 (Sprouty-related, EVH1 domain-containing protein 1) is a non-catalytic, membrane-associated
  adaptor that negatively regulates growth-factor receptor tyrosine kinase signalling through the Ras-RAF-MEK-ERK
  (MAPK) cascade. It has an N-terminal EVH1 domain, a central KIT-binding domain (KBD) and a C-terminal
  cysteine-rich Sprouty (SPR) domain. The EVH1 domain binds the non-catalytic GAPex region of the neurofibromin
  (NF1) GAP-related domain with high affinity, and the SPR domain (which mediates homo/heterodimerization
  with SPRED2 and is S-acylated) targets SPRED1 to the inner leaflet of the plasma membrane, including
  raft/caveolar domains. SPRED1 thereby recruits the RasGAP neurofibromin to membrane-bound Ras, lowering
  Ras-GTP and downstream ERK activation; SPRED1 itself does not alter NF1 GAP activity. SPRED1 also binds
  KIT and several kinases (it inhibits the cofilin kinase TESK1 and modulates DYRK1A substrate phosphorylation),
  and its expression is controlled in endothelial and progenitor cells by miR-126 and miR-1. Heterozygous
  loss-of-function mutations cause Legius syndrome, a neurofibromatosis type 1-like RASopathy, and SPRED1
  loss is a driver in mucosal melanoma.
