- term:
    id: GO:0019211
    label: phosphatase activator activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6809680
  qualifier: enables
  review:
    summary: Reactome states MTMR12 binding enhances MTM1 PI3P phosphatase activity. The primary data
      show that MTMR12 immunoprecipitates carry MTM1-dependent activity and that MTMR12 controls MTM1
      abundance and localization, not that it increases MTM1 specific activity.
    action: MODIFY
    reason: No experiment shows that MTMR12 increases the catalytic rate of MTM1; the higher activity
      of full-length vs deltaSID immunoprecipitates reflects co-precipitated MTM1. Gupta et al. state
      that MTMR12 regulates MTM1 via protein levels rather than enzymatic activity. 'Activator' is therefore
      over-specific; the broader GO:0019208 phosphatase regulator activity (binds to and modulates the
      activity of a phosphatase) fits a non-catalytic adapter that controls MTM1 stability and location.
    proposed_replacement_terms:
    - id: GO:0019208
      label: phosphatase regulator activity
    supported_by:
    - *id008
    - *id004
    - *id009
