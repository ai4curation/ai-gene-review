      record_section: ["CC:CAUTION"]
      supporting_text: lacks the conserved active site cysteine residue at position 391 in the dsPTPase
        catalytic loop and does not have phosphatase activity
    - &id008
      reference_id: PMID:23818870
      supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting protein
        levels instead of modulating the enzymatic activity
