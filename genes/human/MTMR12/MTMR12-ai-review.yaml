description: 'MTMR12 (3-phosphatase adapter protein, 3-PAP) is a catalytically inactive member of the
  myotubularin family of phosphoinositide 3-phosphatases. It has the PH-GRAM and myotubularin phosphatase-like
  domains but lacks the active-site cysteine of the CX5R motif, and recombinant protein has no phosphatase
  activity. MTMR12 forms heteromeric complexes with the active lipid phosphatases myotubularin (MTM1)
  and MTMR2; the MTM1 interaction is direct and requires the region 449-558, which is missing in isoform
  3. In cells, MTMR12 is cytosolic and on punctate vesicles and relocates MTM1 from the plasma membrane
  to the cytoplasm. In skeletal muscle (shown for mouse) it co-localizes with MTM1 at triads and partly
  with the sarcoplasmic reticulum. Its main physiological role appears to be maintaining MTM1 protein
  levels: MTMR12 depletion lowers MTM1 in mammalian muscle cells and zebrafish, producing a myotubular
  myopathy-like phenotype, and MTM1 and MTMR12 stabilize each other in human patient myotubes.'
