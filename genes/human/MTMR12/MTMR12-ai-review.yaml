- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: ISS
  original_reference_id: PMID:23818870
  review:
    summary: 'Loss of MTMR12 lowers myotubularin protein: siRNA knockdown of Mtmr12 in mouse C2C12 cells
      and morpholino knockdown in zebrafish both reduce MTM1 protein, and destabilizing MTM1 mutations
      in human patient myotubes reduce MTMR12, indicating mutual stabilization within the complex.'
    action: NEW
    reason: 'Participation: MTMR12 performs the stabilizing step itself, by binding MTM1 directly through
      its 449-558 region. Comparator: MTMR9, the inactive partner of MTMR6/MTMR8 in the same family and
      the same adapter role, carries GO:0050821 by IDA. Evidence species: the knockdown data are from
      mouse (Q80TA6, same PANTHER subfamily SF37) and zebrafish orthologs, so for human this is an ortholog-based
      inference; the human-specific evidence is the direct binding and the reciprocal reduction of MTMR12
      in XLMTM patient myotubes.'
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: SiRNA-mediated knockdown of Mtmr12 in C2C12 myoblasts or differentiated myotubes
        resulted in decreased levels of myotubularin protein compared to scrambled control siRNAs
    - *id008
    - *id009
