core_functions:
- description: Catalytically inactive adapter subunit that binds the active PI 3-phosphatase MTM1 (and
    MTMR2) in the cytoplasm and regulates it non-catalytically, by maintaining MTM1 protein levels and
    relocating it from the plasma membrane to the cytosol. Binding is shown directly for the human proteins;
    stabilization of MTM1 is shown in mouse and zebrafish orthologs (same PANTHER subfamily SF37).
  molecular_function:
