  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1660516
  qualifier: involved_in
  review:
    summary: Reactome attaches MTMR12 to the reaction 'PI3P is dephosphorylated to PI by MTM1:MTMR12'
      within 'Synthesis of PIPs at the early endosome membrane', and this has been mapped to phosphatidylinositol
      biosynthetic process.
    action: MARK_AS_OVER_ANNOTATED
    reason: The step is a phosphoinositide dephosphorylation catalysed by MTM1, not de novo PI biosynthesis,
      and MTMR12 lacks the catalytic cysteine and is enzymatically inactive. PAINT propagated GO:0046856
      phosphatidylinositol dephosphorylation and the 3-phosphatase activity from PTN000086845 to the active
      members but not to MTMR12, which we treat as a deliberate decision. MTMR12 acts on this process
      only indirectly, by stabilizing and localizing MTM1; it does not perform the step.
    supported_by:
    - reference_id: PMID:11504939
      supporting_text: insect cell-expressed 3-PAP recombinant protein was catalytically inactive
