suggested_questions:
- question: Does MTMR12 change the specific activity or substrate preference (PI3P vs PI(3,5)P2) of MTM1,
    as MTMR9 does for MTMR6/8, or does it act only through MTM1 abundance and localization?
- question: Should the Reactome reaction 'PI3P is dephosphorylated to PI by MTM1:MTMR12' map MTMR12 to
    a phosphatidylinositol biosynthetic process at all, given that MTMR12 is non-catalytic?
- question: What is the identity of the punctate cytoplasmic vesicles to which MTMR12 localizes in non-muscle
    cells?
suggested_experiments:
- description: Measure MTM1 kinetic parameters on PI3P and PI(3,5)P2 with purified MTM1 alone versus reconstituted
    MTM1:MTMR12 heterodimer, normalizing for MTM1 amount.
- description: Cycloheximide-chase and ubiquitination assays of endogenous MTM1 in human MTMR12-knockout
    myoblasts, with rescue by wild-type versus deltaSID (isoform 3) MTMR12, to establish the stabilization
    mechanism in human cells.
