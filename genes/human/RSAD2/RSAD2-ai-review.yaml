proposed_new_terms:
- proposed_name: S-adenosyl-L-methionine-dependent CTP dehydratase activity
  proposed_definition: >-
    Catalysis of the reaction: CTP + AH2 + S-adenosyl-L-methionine =
    3'-deoxy-3',4'-didehydro-CTP + 5'-deoxyadenosine + L-methionine + A + H2O + H+. The
    reaction proceeds by radical S-adenosyl-L-methionine chemistry: a [4Fe-4S] cluster
    reductively cleaves S-adenosyl-L-methionine to a 5'-deoxyadenosyl radical, which
    abstracts the 4'-hydrogen of the CTP ribose and allows loss of the 3'-hydroxyl group,
    yielding the 3'-deoxy-3',4'-didehydro product without rearrangement of the carbon
    skeleton.
  justification: >-
    This is the physiological activity of viperin/RSAD2 (EC 4.2.-.-, RHEA:65944), the
    source of the antiviral chain terminator ddhCTP, and the activity for which the
    protein was renamed S-adenosylmethionine-dependent nucleotide dehydratase (SAND).
    GO has no matching term: QuickGO and OLS searches for "ddhCTP", "CTP dehydratase",
    "didehydro-CTP" and "nucleotide dehydratase" (checked 2026-10-18) return no
    candidate, so the only available annotation is the root GO:0003824 catalytic
    activity. The term should sit under GO:0016836 hydro-lyase activity, beside the
    other radical-SAM dehydratase-type activities.
  proposed_parent:
    id: GO:0016836
    label: hydro-lyase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:65944
      label: CTP + AH2 + S-adenosyl-L-methionine = 3'-deoxy-3',4'-didehydro-CTP +
        5'-deoxyadenosine + L-methionine + A + H2O + H(+)
  supported_by:
  - reference_id: PMID:29925952
    supporting_text: all available NMR and MS data are consistent with the Rvip-catalyzed
      conversion of CTP to 3′-deoxy-3′,4′-didehydro-cytidine triphosphate (ddhCTP)
  - reference_id: PMID:30872404
    supporting_text: IRAK1 and TRAF6 increase viperin activity ∼10-fold
  - reference_id: file:human/RSAD2/RSAD2-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=CTP + AH2 + S-adenosyl-L-methionine = 3'-deoxy-3',4'-
suggested_questions:
- question: >-
    Is the mitochondrial inner-membrane localization of viperin (GO:0005743) compatible
    with a peripheral, cytosol-facing protein, or does it reflect co-fractionation with
    the trifunctional protein after vMIA-driven relocalization? The distinction matters
    because the inner-membrane row is currently indistinguishable from the
    outer-membrane row in the annotation set.
  experts:
  - Peter Cresswell
  - Jun-Young Seo
- question: >-
    Does human viperin positively regulate interferon-beta production (GO:0032728) in its
    own right, beyond the TLR7/TLR9 pathway-level terms already annotated? The mouse
    knockout and the HSV-1 gD reporter data point that way, but the pathway terms may
    already be the appropriate level of assertion.
  experts:
  - Tatsuya Saitoh
  - E Neil G Marsh
- question: >-
    Which cellular polymerases or nucleotide-pool enzymes protect the host from ddhCTP,
    given that viperin-expressing cells accumulate ddhCTP to about 30% of the CTP pool
    without loss of viability?
  experts:
  - Steven C Almo
  - Tyler L Grove
- question: >-
    Is the FPPS-dependent lipid-raft mechanism reported for influenza A virus release a
    separate function of viperin, or a downstream consequence of ddhCTP production and
    ER membrane remodelling? No GO process term is proposed here pending an answer.
  experts:
  - Peter Cresswell
suggested_experiments:
- hypothesis: >-
    The antiviral activity of human viperin against a given virus is proportional to the
    sensitivity of that virus's polymerase to ddhCTP, and is abolished by catalytically
    dead but correctly localized viperin.
  description: >-
    Complement viperin-knockout human cells with wild-type viperin, the
    C83A/C87A/C90A cluster-null mutant, and a localization-matched mutant retaining the
    N-terminal helix but lacking catalysis, then challenge with a ddhCTP-sensitive
    flavivirus and a ddhCTP-insensitive picornavirus while measuring intracellular
    ddhCTP by LC-MS. This separates catalysis-dependent from interaction-based antiviral
    effects virus by virus.
  experiment_type: genetic complementation with metabolite quantification
- hypothesis: >-
    The adaptor function of viperin in TLR7/9 signalling is genetically separable from
    its CTP dehydratase activity.
  description: >-
    In primary human plasmacytoid dendritic cells, replace endogenous viperin with
    catalytically inactive (cluster-null) or IRAK1/TRAF6-binding-deficient variants and
    measure TLR7/TLR9-induced IFN-beta, IRAK1 K63-ubiquitination and ddhCTP levels in
    parallel. A clean separation would justify annotating the adaptor activity and the
    enzymatic activity as distinct core functions in human cells, as is currently
    inferred from mouse and reconstitution data.
  experiment_type: structure-function rescue in primary human cells
- hypothesis: >-
    The CD4+ T-cell Th2 phenotype of viperin-deficient mice reflects the lipid-body
    scaffolding function rather than ddhCTP synthesis.
  description: >-
    Compare Th2 cytokine output and GATA3 activation in T cells from mice expressing
    catalytically dead versus scaffold-deficient viperin knock-in alleles, instead of the
    whole-gene knockout used previously. This would show whether the T-cell role should
    remain a non-core annotation or be mechanistically attached to one of the core
    functions, and whether it is expected to hold in human T cells.
  experiment_type: knock-in mouse genetics with immunophenotyping
