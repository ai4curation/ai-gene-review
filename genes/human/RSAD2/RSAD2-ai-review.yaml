id: Q8WXG1
gene_symbol: RSAD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RSAD2 encodes viperin (also called cig5 or SAND, S-adenosylmethionine-dependent
  nucleotide dehydratase), an interferon-inducible radical S-adenosyl-L-methionine
  (SAM) enzyme of the innate antiviral response. Viperin binds a single [4Fe-4S]
  cluster through the cysteines of a CX3CX2C motif (Cys83/Cys87/Cys90) together with
  an exchangeable SAM molecule, and uses the resulting 5'-deoxyadenosyl radical to
  dehydrate cytidine triphosphate, converting CTP to 3'-deoxy-3',4'-didehydro-CTP
  (ddhCTP) with release of 5'-deoxyadenosine and L-methionine. ddhCTP is a diffusible
  chain terminator for the RNA-dependent RNA polymerases of flaviviruses such as
  dengue, West Nile, Zika and hepatitis C virus, so viperin inhibits viral genome
  synthesis through the small molecule it makes rather than by acting on the
  polymerase itself; picornavirus polymerases are comparatively insensitive, and
  additional, interaction-based antiviral mechanisms have been described for several
  viruses. The protein is a peripheral membrane protein anchored by an N-terminal
  amphipathic helix (residues 1-42) to the cytosolic face of the endoplasmic
  reticulum and to lipid droplets, which are also the assembly and replication sites
  of many viruses; during infection it is redistributed to the Golgi apparatus and,
  when bound by the human cytomegalovirus protein vMIA/UL37, to mitochondria, where
  its interaction with the trifunctional protein lowers ATP output and paradoxically
  benefits that virus. Independently of catalysis, viperin acts as a scaffold in
  TLR7/TLR9 signalling in plasmacytoid dendritic cells, recruiting IRAK1 and TRAF6 to
  lipid bodies and promoting K63-linked ubiquitination of IRAK1 and IRF7-driven type
  I interferon production; reciprocally, IRAK1 and TRAF6 stimulate its CTP
  dehydratase activity about tenfold. Further, less direct roles reported in mouse
  include facilitation of T-cell-receptor-driven GATA3 activation and optimal T-helper
  2 cytokine production in CD4+ T cells. Viperin levels are controlled by HAT1-mediated
  acetylation of Lys197 followed by UBE4A-dependent Lys6-linked polyubiquitination of
  Lys206 and proteasomal degradation.
