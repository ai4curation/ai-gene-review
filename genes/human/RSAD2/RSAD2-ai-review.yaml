    reason: >-
      Following the RADICAL_SAM project rule for generic rows, the specific reaction
      the gene is shown to catalyse should replace GO:0003824. GO currently has no term
      for the CTP to ddhCTP dehydration (QuickGO/OLS searches for "ddhCTP", "CTP
      dehydratase" and "didehydro-CTP" return nothing), so the replacement is the new
      term requested in proposed_new_terms; its proposed parent is GO:0016836
      hydro-lyase activity.
