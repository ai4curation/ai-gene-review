  review:
    summary: >-
      Root-level catalytic activity from InterPro2GO radical-SAM signatures. Viperin is
      a bona fide enzyme whose reaction is known in detail: it dehydrates CTP to
      3'-deoxy-3',4'-didehydro-CTP (ddhCTP) using SAM and a [4Fe-4S] cluster
      (PMID:29925952, PMID:30872404).
