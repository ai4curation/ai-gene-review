core_functions:
- description: >-
    Viperin is a radical SAM enzyme that dehydrates cytidine triphosphate, converting
    CTP to 3'-deoxy-3',4'-didehydro-CTP (ddhCTP) with release of 5'-deoxyadenosine and
    L-methionine. Acting on the cytosolic nucleotide pool from the cytosolic face of
    the ER membrane and from lipid droplets, it supplies a diffusible chain terminator
    that flavivirus RNA-dependent RNA polymerases incorporate, thereby blocking viral
    genome synthesis; this is the interferon-induced antiviral mechanism of the protein.
  proposed_molecular_function: S-adenosyl-L-methionine-dependent CTP dehydratase activity
