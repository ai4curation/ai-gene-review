    - reference_id: PMID:21527675
      supporting_text: the viral protein vMIA resulted in viperin relocalization from
        the endoplasmic
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002724426
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral node for the viperin/RSAD2 clade; the human IDA from
          PMID:21527675 is among the descendant evidences supporting the node, so the
          target's own appearance in WITH/FROM is expected rather than circular.
