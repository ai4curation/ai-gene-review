    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002724426
  - UniProtKB:Q8WXG1
  review:
    summary: >-
      Phylogenetic propagation of mitochondrial localization within the viperin clade,
      seeded in part by the human experimental annotation. Mitochondrial viperin is real
      but is the product of infection-driven relocalization: HCMV vMIA/UL37 binding
      moves viperin from the ER to mitochondria (PMID:21527675).
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim is not false, and the IBD node placement is consistent with the human
      IDA, so it should not be removed. However this is a conditional, virus-coopted
      location rather than the site where viperin normally acts, which is the cytosolic
      face of the ER and lipid droplets (PMID:19074433, PMID:30872404). Kept as
      non-core.
