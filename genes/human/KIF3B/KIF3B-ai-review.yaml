- description: Outside cilia, KIF3A/KIF3B transports membranous organelles and vesicles toward microtubule
    plus ends, including anterograde axonal and dendritic transport in neurons (non-ciliary use of the
    same motor).
  molecular_function:
    id: GO:0008574
