suggested_questions:
- question: 'How do dominant KIF3B motor-domain (E250Q) and stalk (L523P) variants lengthen cilia: by
    altering kinesin-2 processivity, IFT train size, or tip turnover?'
  experts:
  - Davis EE
  - Katsanis N
- question: Is the reported role of KIF3B in mitotic spindle organization direct (motor activity on spindle
    microtubules) or secondary to centrosome/cilium cycle defects?
