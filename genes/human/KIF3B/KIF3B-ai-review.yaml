- description: KIF3B is an ATP-driven plus-end-directed microtubule motor subunit of heterotrimeric kinesin-2
    that acts as the anterograde intraflagellar transport motor, binding IFT-B and carrying IFT trains
    to the ciliary tip; it is required for cilium assembly (nodal, primary and photoreceptor cilia).
  molecular_function:
    id: GO:0008574
    label: plus-end-directed microtubule motor activity
