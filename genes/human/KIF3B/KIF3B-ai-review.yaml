id: O15066
gene_symbol: KIF3B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KIF3B is a kinesin-2 family motor subunit that forms an obligate heterodimer with KIF3A;
  the KIF3A/KIF3B heterodimer associates with the accessory subunit KAP3 (KIFAP3) to form heterotrimeric
  kinesin-2 (kinesin II). KIF3B has an N-terminal kinesin motor domain with microtubule-stimulated ATPase
  activity, a coiled-coil stalk that pairs with KIF3A, and a C-terminal tail that binds KAP3 and IFT-B
  components such as IFT20. The complex moves processively toward microtubule plus ends and is the principal
  anterograde intraflagellar transport (IFT) motor, so KIF3B is essential for assembly of nodal, primary
  and photoreceptor cilia; mouse Kif3b knockouts lack nodal cilia and have randomized left-right asymmetry,
  and heterozygous human KIF3B variants cause an autosomal-dominant ciliopathy with retinitis pigmentosa,
  elongated cilia and impaired rhodopsin transport. Outside cilia, KIF3A/KIF3B transports membranous organelles
  and vesicles anterogradely in axons and dendrites (including NMDA receptor GRIN2A-containing vesicles)
  and contributes to mitotic spindle organization. KIF3B localizes to cilia (notably the ciliary tip),
  centrosome, microtubules, cytoplasm and neuronal dendrites.
