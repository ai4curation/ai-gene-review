- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      Nuclear localisation, mapped from the UniProt subcellular location vocabulary.
    action: ACCEPT
    reason: >-
      IPO13 is a shuttling transport receptor. It is in the nucleus when it releases
      import cargo and loads export cargo with RanGTP, and nucleocytoplasmic shuttling of
      IPO13 has been observed directly (PMID:16809634). A compartment that is part of the
      transport cycle is a legitimate location for this receptor.
    supported_by:
    - reference_id: PMID:16809634
      supporting_text: >-
        demonstrated developmental regulation of IPO13 nucleocytoplasmic shuttling
    - reference_id: file:human/IPO13/IPO13-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm. Nucleus."
- term:
    id: GO:0005635
    label: nuclear envelope
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000270925
  - UniProtKB:Q9Y5L0
  review:
    summary: >-
      IBA placing the family's activity at the nuclear envelope, seeded from
      transportin-3 (TNPO3, Q9Y5L0).
    action: KEEP_AS_NON_CORE
    reason: >-
      Importin-beta-like receptors do their translocation work at the nuclear pore
      complexes in the nuclear envelope, so the PAINT placement is reasonable for the
      whole PTHR12363 family. The node is shared by the importin-13 and transportin-3
      branches. No experiment shows IPO13 enriched at the nuclear rim, and the primary
      documented compartments are the cytoplasm and nucleus. The location is consistent
      with the mechanism but not specifically demonstrated for IPO13, so it is kept as
      non-core rather than accepted as a core location.
