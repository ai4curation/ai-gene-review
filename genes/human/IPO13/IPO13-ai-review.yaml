id: O94829
gene_symbol: IPO13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Importin-13 (IPO13, also called karyopherin 13 or LGL2) is a 963-residue member of
  the importin-beta (karyopherin-beta) superfamily of nucleocytoplasmic transport
  receptors, built from about 20 HEAT repeats that fold into a flexible ring or
  superhelix. It belongs to the transportin-3/importin-13 PANTHER family (PTHR12363)
  and to the importin-13 subfamily (SF33). IPO13 is a bidirectional transport receptor.
  As an importin it binds folded cargo proteins in the cytoplasm and carries them
  through the nuclear pore. Characterised import cargoes include the SUMO E2 enzyme
  UBC9 (UBE2I), the exon-junction-complex heterodimer MAGOH-RBM8A (Mago-Y14), paired-type
  homeodomain transcription factors such as PAX6, PAX3 and ARX, the histone-fold
  heterodimers NF-YB/NF-YC and CHRAC-15/CHRAC-17, and the glucocorticoid receptor. In
  the nucleus, RanGTP binding releases these cargoes, either by direct competition (UBC9)
  or by steric hindrance (Mago-Y14). As an exportin, IPO13 binds the translation
  initiation factor eIF1A cooperatively with RanGTP in the nucleus and carries it to the
  cytoplasm, where eIF1A is released as import cargo loads. Crystal structures of human
  IPO13 with RanGTP, with UBC9, and with RanGTP plus eIF1A show that it recognises cargo
  by shape and charge complementarity over folded domains rather than through a linear
  NLS or NES. Proteomic screens have identified several hundred candidate cargoes in both
  directions. IPO13 shuttles between the cytoplasm and the nucleus. It is broadly
  expressed and is enriched in fetal lung, brain and heart. A homozygous missense variant
  (p.R111C) has been reported in a family with recessive ocular coloboma,
  microphthalmia and cataract.
existing_annotations:
- term:
    id: GO:0005049
    label: nuclear export signal receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000270925
  - SGD:S000002984
  review:
    summary: >-
      IBA from PANTHER node PTN000270925 assigning nuclear export receptor activity.
      Experimental work on human IPO13 directly supports it. IPO13 exports eIF1A:
      it binds eIF1A cooperatively with RanGTP, as shown by the IPO13-RanGTP-eIF1A crystal
      structure, and overexpressing wild-type IPO13, but not an eIF1A-binding mutant,
      depletes eIF1A from the nucleus in HeLa cells.
    action: ACCEPT
    reason: >-
      IPO13 sits in PANTHER subfamily PTHR12363:SF33 (importin-13), inside the clade that
      the PAINT node covers, and has its own experimental export biochemistry. The export
      activity was first shown in vitro (PMID:11447110). It was later explained
      structurally and confirmed in cells (PMID:23435562), and proteomics extended it to
      further export cargoes (PMID:29666159, PMID:27993670). GO defines the "nuclear export
      signal" broadly enough to cover a folded-domain export determinant such as eIF1A's,
      so the term fits. The PTHR12363 family review leaves the family-wide distribution of
      GO:0005049 UNRESOLVED. This row concerns only the importin-13 subfamily, where the
      activity is experimentally established in human. This is a core function, alongside
      import.
    supported_by:
    - reference_id: PMID:11447110
      supporting_text: >-
        Unexpectedly, Imp13 also shows export activity towards the translation initiation
        factor eIF1A and is thus a case where a single importin beta-like receptor
        transports different substrates in opposite directions.
    - reference_id: PMID:23435562
      supporting_text: >-
        eIF1A binds at the inner surface of the Imp13 C-terminal arch adjacent and
        concomitantly to RanGTP illustrating how eIF1A can be exported by Imp13.
    - reference_id: PMID:23435562
      supporting_text: >-
        Overexpression of Imp13 causes an accumulation of wild-type (wt) eIF1A in the
        cytoplasm ( Figure 4A ), indicating that Imp13 can bind and export eIF1A in vivo .
