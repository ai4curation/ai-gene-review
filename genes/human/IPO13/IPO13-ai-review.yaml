- term:
    id: GO:0006606
    label: protein import into nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G62600
  - FB:FBgn0031456
  - PANTHER:PTN000270925
  - RGD:620071
  - SGD:S000002984
  - SGD:S000005686
  - UniProtKB:O94829
  - UniProtKB:Q9Y5L0
  review:
    summary: >-
      IBA for protein import into nucleus, from PAINT node PTN000270925. IPO13 itself is
      one of the experimental donors.
    action: ACCEPT
    reason: >-
      IPO13 is an import receptor. It carries UBC9 and Mago-Y14 (PMID:11447110,
      PMID:20122403), PAX6, PAX3 and CRX (PMID:15143176), NF-YB/NF-YC
      (PMID:15964792), CHRAC-15/CHRAC-17 (PMID:19218565), the glucocorticoid receptor
      (PMID:16809634) and myopodin (PMID:17828378). It does the work of the process
      directly as the carrier. Its appearance in its own WITH/FROM list reflects its own
      experimental grounding and is not circular. Core function.
    supported_by:
    - reference_id: PMID:11447110
      supporting_text: >-
        It accounts for nuclear accumulation of the SUMO-1/sentrin-conjugating enzyme
        hUBC9 and mediates import of the RBM8 (Y14) protein, and is therefore referred to
        as importin 13 (Imp13).
    - reference_id: PMID:15143176
      supporting_text: >-
        Ran-dependent import of Pax6 by Kap13 was shown to occur by using a
        digitonin-permeabilized cells assay.
- term:
    id: GO:0006606
    label: protein import into nucleus
  evidence_type: IDA
  original_reference_id: PMID:15964792
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      IDA from nuclear import assays showing that the NF-YB/NF-YC histone-fold
      heterodimer is imported in an importin 13-dependent manner.
    action: ACCEPT
    reason: >-
      Permeabilised-cell import assays and binding studies show that IPO13 recognises and
      imports only the NF-YB/NF-YC heterodimer (PMID:15964792). The same was later shown
      for the CHRAC-15/CHRAC-17 and p12/CHRAC-17 heterodimers (PMID:19218565). This is
      direct evidence of IPO13 acting as the import carrier.
    supported_by:
    - reference_id: PMID:15964792
      supporting_text: >-
        While NF-YA is imported by an importin beta-mediated pathway, the NF-YB/NF-YC
        heterodimer is translocated into the nucleus in an importin 13-dependent manner.
    - reference_id: PMID:19218565
      supporting_text: >-
        Our results from in vitro nuclear import assays with permeabilized cells and in
        vivo cotransfection experiments reveal that importin 13 facilitates nuclear import
        of both histone fold heterodimers.
