      structure (PMID:20122403, PDB 2X19) and the IPO13-RanGTP-eIF1A structure
      (PMID:23435562), with an estimated K_D below 100 nM. RanGTP binding is the
      regulatory step that sets the direction of transport, so it is a core part of the
      receptor mechanism. GO:0031267 is the most specific term available.
    supported_by:
    - reference_id: PMID:20122403
      supporting_text: >-
