core_functions:
- description: >-
    Bidirectional nucleocytoplasmic transport receptor, import branch. In the cytoplasm,
    IPO13 binds folded cargo proteins through shape and charge complementarity. The
    cargoes include the SUMO E2 UBC9, the EJC heterodimer Mago-Y14, paired-type
    homeodomain transcription factors (PAX6, PAX3, CRX, ARX), histone-fold heterodimers
    (NF-YB/NF-YC, CHRAC-15/CHRAC-17) and the glucocorticoid receptor. IPO13 carries
    them through the nuclear pore. In the nucleus, RanGTP binding releases the cargo.
    Established experimentally for human IPO13 by binding, permeabilised-cell import,
    siRNA and crystal-structure data.
  molecular_function:
    id: GO:0061608
    label: nuclear import signal receptor activity
  directly_involved_in:
  - id: GO:0006606
    label: protein import into nucleus
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11447110
    supporting_text: >-
      It accounts for nuclear accumulation of the SUMO-1/sentrin-conjugating enzyme hUBC9
      and mediates import of the RBM8 (Y14) protein, and is therefore referred to as
      importin 13 (Imp13).
  - reference_id: PMID:15143176
    supporting_text: >-
      Ran-dependent import of Pax6 by Kap13 was shown to occur by using a
      digitonin-permeabilized cells assay.
  - reference_id: PMID:21139563
    supporting_text: >-
      In the cytoplasm, Imp13 associates with different cargoes such as Mago-Y14 and
      Ubc9, and facilitates their import into the nucleus where RanGTP binding promotes
      the release of the cargo.
- description: >-
    Bidirectional nucleocytoplasmic transport receptor, export branch. In the nucleus,
    IPO13 binds eIF1A cooperatively with RanGTP, as shown by the IPO13-RanGTP-eIF1A
    crystal structure, and exports it to the cytoplasm. There, eIF1A is released when
    import cargo loads. IPO13 also exports EIF4G2 and HMG20A. Established experimentally
    for human IPO13.
  molecular_function:
    id: GO:0005049
    label: nuclear export signal receptor activity
  directly_involved_in:
  - id: GO:0006611
    label: protein export from nucleus
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:11447110
    supporting_text: >-
      Unexpectedly, Imp13 also shows export activity towards the translation initiation
      factor eIF1A and is thus a case where a single importin beta-like receptor
      transports different substrates in opposite directions.
  - reference_id: PMID:23435562
    supporting_text: >-
      Finally, we demonstrate that Imp13 is able to bind and export eIF1A in vivo and that
      its function is essential.
  - reference_id: PMID:27993670
    supporting_text: >-
      as well as that of Imp13 to act as a nuclear exporter for both EIF4G2 and HMG20A,
      and as a nuclear importer for GR.
- description: >-
    Direct binding of RanGTP, the regulatory step that sets the direction of transport.
    RanGTP displaces import cargo, either by direct competition for the same surface
    (UBC9) or by steric hindrance (Mago-Y14), and binds cooperatively with export cargo
    (eIF1A). Shown by human IPO13-RanGTP crystal structures (PDB 2X19, 3ZJY).
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20122403
    supporting_text: >-
      The 2.8 A structure of human Imp13 bound to RanGTP reveals how Mago-Y14 is released
      in the nucleus by a steric hindrance mechanism.
  - reference_id: PMID:21139563
    supporting_text: >-
      The structure shows an uncommon mode of cargo-karyopherin recognition with Ubc9
      binding at the N-terminal portion of Imp13, occupying the entire RanGTP-binding
      site.
suggested_questions:
- question: >-
    Which of the roughly 255 proteomically identified IPO13 substrates are imported and
    which are exported in cells, and how does IPO13 decide direction for cargoes that
    bind surfaces not used by UBC9, Mago-Y14 or eIF1A?
- question: >-
    Does the p.R111C variant associated with coloboma and microphthalmia selectively
    impair import of specific cargoes, such as PAX6 or other paired-type homeodomain
    factors, rather than causing a general loss of IPO13 function?
- question: >-
    Imp13 suppresses UBC9 autosumoylation in vitro. Does this have a regulatory role in
    cells, or is it a side effect of cargo shielding during transport?
suggested_experiments:
- description: >-
    Knock in the R111C variant at the endogenous IPO13 locus in human cells or retinal
    organoids. Then quantify nuclear import of PAX6, PAX3, UBC9 and Mago-Y14, and export
    of eIF1A, to test whether the variant causes cargo-selective transport defects.
  experiment_type: genome editing with quantitative localisation imaging
- description: >-
    Use auxin-inducible degradation of endogenous IPO13 combined with nuclear and
    cytoplasmic fractionation proteomics. This would distinguish direct import and export
    cargoes from the indirect effects of loss of viability seen with siRNA.
  experiment_type: acute protein depletion with subcellular proteomics
