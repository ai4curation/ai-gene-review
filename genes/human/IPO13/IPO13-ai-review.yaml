        in the nucleus by a steric hindrance mechanism.
    - reference_id: PMID:23435562
      supporting_text: >-
        The K D value for RanGTP binding to Imp13, although not accurately calculated due
        to the upper detection limit of the method, falls in the low nanomolar or picomolar
        range (<100 nM)
