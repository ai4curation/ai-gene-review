core_functions:
- description: Biliverdin export across the mitochondrial inner membrane. ABCB10 is a homodimeric ABC
    transporter whose ATPase cycle drives translocation of biliverdin from the matrix to the cytosol;
    conserved transmembrane arginines couple substrate binding to ATPase stimulation, and the transport
    cycle is captured structurally in apo and biliverdin-bound states. This is the protein's defining
    activity and it replaces the long-assumed but disproven export of the heme precursor 5-aminolevulinic
    acid.
