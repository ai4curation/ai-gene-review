- description: Support of erythroid heme and hemoglobin production, by regulatory and organisational routes
    rather than by transporting a heme-pathway intermediate. ABCB10's ATP-hydrolysis activity is required
    for hemoglobinization; its loss represses the heme-biosynthesis transcriptional programme through
    Bach1, partially rescuable by ALAS2 or GATA1 overexpression, and destabilises mitoferrin-1 so that
