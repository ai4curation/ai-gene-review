gene_symbol: ABCB10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ABCB10 is a homodimeric ATP-binding cassette transporter of the mitochondrial inner membrane,
  delivered there by an unusually long presequence and assembling into homodimers and higher oligomers.
  It exports the tetrapyrrole biliverdin from the mitochondrial matrix to the cytosol, a substrate assignment
  established by direct transport assay and confirmed by cryo-EM structures of the apo and biliverdin-bound
  states. The protein was for many years assumed instead to export 5-aminolevulinic acid, the first committed
  heme precursor, but that model was tested directly and ruled out. Its ATPase cycle is the functional
  core: catalytic Walker A/B and C-loop residues are required, conserved transmembrane arginines mediate
  biliverdin-induced ATPase stimulation, and activity is tuned by cardiolipin and by glutathione redox
  status. ABCB10 is nonetheless required for hemoglobinization, but indirectly - its loss represses the
  heme-biosynthesis transcriptional programme through Bach1 and destabilises mitoferrin-1, reducing mitochondrial
  iron import - and it physically organises mitochondrial iron-heme machinery, forming a complex in which
  dimeric ferrochelatase bridges ABCB7 and ABCB10 homodimers. Loss of ABCB10 causes mitochondrial and
  lysosomal iron accumulation, elevated reactive oxygen species and failure of erythropoiesis. Its exported
  product also acts outside erythroid cells, where bilirubin derived from the exported biliverdin has
  been implicated in limiting hepatic glucose handling and beta-cell insulin secretion.'
