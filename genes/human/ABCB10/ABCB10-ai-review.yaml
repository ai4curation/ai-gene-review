proposed_new_terms:
- proposed_name: biliverdin transmembrane transporter activity
  proposed_definition: Enables the transfer of biliverdin from one side of a membrane to the other. Biliverdin
    is the linear tetrapyrrole produced by heme oxygenase cleavage of heme.
  justification: 'GO already resolves tetrapyrrole transport at substrate level on both sides of this
    gap: GO:0015232 heme transmembrane transporter activity for the cyclic tetrapyrrole, and bilirubin
    transport terms for the downstream reduced product. Biliverdin, the linear tetrapyrrole sitting between
    them, has no transport term at all. That is a sharper statement of the gap than ''no biliverdin term
    exists'': the ontology covers the step before and the step after, and skips this one.


    ABCB10 is the characterised biliverdin exporter of the mitochondrial inner membrane, established by
    transport of biliverdin by purified protein reconstituted into liposomes and by cryo-EM structures
    of the apo and biliverdin-bound transporter, yet the most specific molecular function available for
    it is the family-level GO:0140359 ABC-type transporter activity. The gap matters because substrate
    identity is the single most consequential fact about this protein: it is what distinguishes the current
    model from the disproven 5-aminolevulinic acid export model, and what connects mitochondrial heme
    catabolism to cytosolic bilirubin signalling.


    The proposed parent is GO:0005310 dicarboxylic acid transmembrane transporter activity, which is how
    GO already places the closest existing term: GO:0015127 bilirubin transmembrane transporter activity
    is a direct is_a child of GO:0005310 (verified against QuickGO). Biliverdin, like bilirubin, carries
    two propionate side chains, so the subsumption is true rather than merely convenient.proposed_parent
    is an is_a assertion, so it would entail that every biliverdin transporter is a heme transporter -
    heme is the cyclic tetrapyrrole, biliverdin its ring-opened catabolite, and a curator importing that
    would reclassify ABCB10 under heme transport, reintroducing the confusion the review exists to remove.
    Note also that GO:0015232 and GO:0015127 are not in a chain: GO:0015232 is a direct child of GO:0022857
    while GO:0015127 sits in the carboxylic-acid branch, so heme, biliverdin and bilirubin are siblings.
    A shared tetrapyrrole-transport grouping over all three would be a genuine improvement to the ontology,
    but it is a restructuring proposal rather than an available parent, and is recorded here as such.'
  proposed_parent:
    id: GO:0005310
    label: dicarboxylic acid transmembrane transporter activity
  supported_by:
  - reference_id: PMID:34011630
    supporting_text: ABCB10 exports mitochondrial biliverdin, driving metabolic maladaptation in obesity.
  - reference_id: file:human/ABCB10/ABCB10-deep-research-affinage.md
    supporting_text: biliverdin/bilirubin export rather than direct ALA or dALA transport is the established
      substrate axis
suggested_questions:
- question: Should the three GO:0006783 heme biosynthetic process annotations be re-curated as regulation?
    PMID:28808058 directly rules out ALA transport by ABCB10, so the gene does not carry a heme-pathway
    intermediate; its effect is transcriptional (via Bach1) and organisational (via mitoferrin-1 stabilisation).
    GO:0070455 positive regulation of heme biosynthetic process is already annotated on this gene and
    describes what is actually shown.
- question: What is the physiological consequence of biliverdin export, and is bilirubin the effector?
    The exported biliverdin is reduced to bilirubin in the cytosol, which has been implicated in limiting
    hepatic glucose handling and beta-cell insulin secretion. Whether that signalling role, rather than
    erythroid heme metabolism, is ABCB10's principal function in non-erythroid tissue is unresolved.
- question: How does an exporter of a heme catabolite end up being required for heme synthesis? The Bach1
    and mitoferrin-1 routes are both documented, but whether removing biliverdin from the matrix is itself
    the signal - as PMID:28808058 suggests when it says the transported substrate provides a signal that
    optimizes hemoglobinization - has not been tested directly.
- question: Is the mitochondrial unfolded protein response phenotype a distinct function or a downstream
    consequence? ABCB10 depletion reduces the UPRmt, but ABCB10 loss also causes iron accumulation and
    elevated ROS, either of which could account for it indirectly.
- question: Does the ABCB7-ferrochelatase-ABCB10 complex have a transport function beyond the sum of its
    parts, for instance substrate channelling between iron import, heme synthesis and biliverdin export?
    The architecture is known but the functional consequence of the assembly is not.
suggested_experiments:
- hypothesis: Removal of biliverdin from the matrix is itself the signal that optimises hemoglobinization.
  description: Compare ABCB10-null erythroid cells rescued with wild-type ABCB10 against rescue with a
    transport-dead but ATPase-competent variant, and against wild-type cells in which matrix biliverdin
    is lowered by an orthogonal route such as biliverdin reductase targeting. If matrix biliverdin clearance
    is the signal, the orthogonal route should rescue hemoglobinization without ABCB10.
  experiment_type: cell biology and genetics
- hypothesis: The ABCB7-FECH-ABCB10 assembly channels substrates between iron import, heme synthesis and
    biliverdin export.
  description: Use structure-guided interface mutations that disrupt the ferrochelatase bridge without
    destabilising either transporter, then measure mitochondrial iron import, heme synthesis flux and
    biliverdin export independently, to test whether the assembly does more than co-localise its components.
  experiment_type: structure-function
- hypothesis: ABCB10's non-erythroid function is bilirubin-mediated signalling rather than heme metabolism.
  description: Compare tissue-specific ABCB10 knockouts in liver and pancreatic beta cells with matched
    biliverdin reductase manipulation, measuring glucose handling and insulin secretion, to establish
    whether the metabolic phenotypes track the exported product rather than the transporter itself.
  experiment_type: mouse physiology
