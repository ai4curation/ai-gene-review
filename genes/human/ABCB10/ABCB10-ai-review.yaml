- term:
    id: GO:0006783
    label: heme biosynthetic process
  evidence_type: NAS
  original_reference_id: PMID:30765471
  qualifier: involved_in
  review:
    summary: 'This row is NOT the ALA-export inference the other two GO:0006783 rows rest on, and needs
      its own argument. It is a ComplexPortal NAS assignment from PMID:30765471, which identified a crosslinking/MS-defined
      complex of ferrochelatase (FECH), ABCB7 and ABCB10 and titled it "required for heme biosynthesis".
      That curator was asserting complex-level participation via FECH - the terminal enzyme of the pathway
      - not that ABCB10 itself transports a heme intermediate, so rebutting ALA transport does not engage
      this evidence.

      The term is still wrong for ABCB10, on narrower grounds. An annotation inherited from a partner''s
      catalytic role is a complex-level attribution, and ABCB10''s own demonstrated contribution to hemoglobinization
      is regulatory: ATP-hydrolysis-dependent relief of Bach1 repression of the heme transcriptional programme,
      and stabilisation of mitoferrin-1 for mitochondrial iron import. GO:0070455 positive regulation
      of heme biosynthetic process, already on this gene by ISS, says that without asserting that ABCB10
      carries out a step. The FECH association itself is not lost - it is carried by the complex-membership
      annotations this review retains, which is where a complex-level fact belongs.'
    action: MODIFY
    reason: Complex-level attribution inherited from a partner (ferrochelatase) rather than a demonstrated
      ABCB10 activity. ABCB10's own contribution to the pathway is regulatory and the regulation term
      is already present on this gene. This reasoning is deliberately different from the other two GO:0006783
      rows, which rest on the disproven ALA-export model; that argument does not apply to a ComplexPortal
      complex-membership assignment.
    proposed_replacement_terms:
    - id: GO:0070455
      label: positive regulation of heme biosynthetic process
    supported_by:
    - reference_id: PMID:30765471
      supporting_text: we identified a complex formed of ferrochelatase (FECH), ABCB7 and ABCB10 and characterized
        its overall architecture
    - reference_id: PMID:28808058
      supporting_text: 'Abcb10 silencing resulted in an alteration in the heme biosynthesis

        transcriptional profile due to repression by the transcriptional regulator

        Bach1'
