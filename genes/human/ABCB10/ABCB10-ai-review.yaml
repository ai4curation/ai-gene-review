  qualifier: involved_in
  review:
    summary: 'The historical model for this annotation has been disproven, and the term now invites precisely
      the reading the field discarded. ABCB10 was long assumed to export 5-aminolevulinic acid (ALA),
      the first committed heme precursor, which would make it a direct participant in heme biosynthesis.
      PMID:28808058 tested that directly and ruled it out: inhibiting ALA dehydratase caused ALA to accumulate
      equally in control and Abcb10-knockdown cells, showing that reducing Abcb10 does not affect ALA
      export. The actual transported substrate is biliverdin, a heme catabolite rather than a precursor.


      ABCB10 nevertheless is required for hemoglobinization, but indirectly: its ATP-hydrolysis activity
      is critical, loss of it represses the heme-biosynthesis transcriptional programme through Bach1
      (partially rescuable by ALAS2 or GATA1 overexpression), and it stabilises mitoferrin-1 to support
      mitochondrial iron import. That is regulation of the pathway, not participation in it, and GO:0070455
      positive regulation of heme biosynthetic process - already annotated on this gene by ISS - says
      exactly that.'
    action: MODIFY
    reason: ABCB10 does not transport a heme-pathway intermediate; its effect on heme biosynthesis is
      regulatory and indirect. The regulation term is already present on this gene and is what the evidence
      supports.
    proposed_replacement_terms:
    - id: GO:0070455
      label: positive regulation of heme biosynthetic process
    supported_by:
    - reference_id: PMID:28808058
      supporting_text: 'demonstrating that reductions in Abcb10 do not affect ALA

        export from mitochondria and indicating that Abcb10 does not transport ALA.'
    - reference_id: PMID:28808058
      supporting_text: 'our findings rule out that Abcb10

        transports ALA and indicate that Abcb10''s ATP-hydrolysis activity is critical

        for hemoglobinization and that the substrate transported by Abcb10 provides a

        signal that optimizes hemoglobinization.'
    - reference_id: PMID:28808058
      supporting_text: 'Abcb10 silencing resulted in an alteration in the heme biosynthesis

        transcriptional profile due to repression by the transcriptional regulator

        Bach1'
