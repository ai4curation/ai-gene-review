id: P50440
gene_symbol: GATM
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATM encodes L-arginine:glycine amidinotransferase (AGAT), the enzyme catalysing the first,
  rate-limiting step of creatine biosynthesis. It transfers an amidino group from arginine to glycine,
  forming guanidinoacetate and ornithine; GAMT then methylates guanidinoacetate to creatine. The principal
  mitochondrial homodimer acts in the intermembrane compartment through a Cys407–His303–Asp254 catalytic
  system and an amidino-cysteine intermediate. Expression is broad and highest in kidney. Recombinant
  human GATM also accepts other amino compounds in vitro, without established physiological flux for each
  reaction. Biallelic loss causes AGAT deficiency (cerebral creatine deficiency syndrome 3), with cognitive
  and muscle impairment. Distinct dominant aggregation-prone variants cause Fanconi renotubular syndrome
  1 with proximal tubular dysfunction and kidney failure. Adipocyte GATM supports thermogenic capacity
  in mouse models.
core_functions:
- description: Transfers the amidino group of arginine to glycine to supply guanidinoacetate for creatine
    synthesis. The mitochondrial homodimer has broader acceptor activity in vitro; that substrate range
    does not establish separate physiological pathways.
  molecular_function:
    id: GO:0015068
    label: glycine amidinotransferase activity
  directly_involved_in:
  - id: GO:0006601
    label: creatine biosynthetic process
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: PMID:9218780
    supporting_text: "catalyses the committed step in \ncreatine biosynthesis"
  - reference_id: PMID:3800397
  - reference_id: PMID:36543883
  - reference_id: PMID:9148748
  substrates:
  - id: CHEBI:32682
    label: L-arginine
  - id: CHEBI:57305
    label: glycine
alternative_products:
- id: P50440-1
  name: 1 (Mitochondrial)
  description: Displayed 423-residue precursor with an annotated N-terminal mitochondrial
    targeting segment. The engineered AT38/AT56 proteins begin at canonical residues
    38/56 and are not natural alternative products.
- id: P50440-2
  name: 2 (Cytoplasmic)
  sequence_note: VSP_000235 replaces canonical residues 1–37 with MNILK, producing
    391 residues.
  description: The original human kidney cDNA X86401.1 encodes this exact sequence.
    Cytoplasmic localization is a UniProt assignment and was presented as a possibility
    in the inspected original paper; the sequence record does not establish a localization
    experiment.
- id: P50440-3
  name: '3'
  sequence_note: VSP_039871 replaces canonical residues 388–423 with MYNK, producing
    391 residues.
  description: The alternative C terminus changes the region containing canonical
    catalytic Cys407. This sequence difference raises an activity question but is
    not a measured inactivity result or a demonstration of a distinct physiological
    function.
proposed_new_terms: []
suggested_questions:
- question: What are the endogenous locations, processing states and catalytic activities
    of the three sequence-defined human GATM products?
- question: Do the non-glycine acceptor reactions carry appreciable flux at physiological
    substrate concentrations?
- question: Do the specific interaction partners alter GATM activity or localization
    in the cells where both proteins are expressed?
suggested_experiments:
- experiment_type: Natural-product localization and activity
  description: Express sequence-verified natural products at matched levels and compare endogenous localization,
    processing and arginine/glycine turnover; include engineered AT38/AT56 only as separate controls.
  hypothesis: The three natural products may differ in processing, compartment or catalytic activity;
    sequence variation alone does not establish the outcome.
- experiment_type: Substrate flux tracing
  description: Use isotope tracing to compare guanidinoacetate synthesis with non-glycine products under
    physiological substrate conditions, with GATM loss and rescue controls.
  hypothesis: Non-glycine acceptor activity may contribute measurable cellular flux under some conditions,
    but in-vitro turnover alone does not establish that contribution.
