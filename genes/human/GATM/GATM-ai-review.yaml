    summary: Cognitive impairment is an established consequence of GATM deficiency.
    action: MARK_AS_OVER_ANNOTATED
    reason: Formal cognitive testing and treatment observations establish genuine impairment in AGAT deficiency.
      They do not identify GATM performing information acquisition, processing, storage or retrieval.
