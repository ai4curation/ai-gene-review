id: O43542
gene_symbol: XRCC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: XRCC3 (X-ray repair cross-complementing protein 3) is one of the five human RAD51 paralogs,
  a RecA/RAD51-family protein with an N-terminal domain and a C-terminal Walker A/B ATPase domain. All
  of its characterized activities are exerted as the obligate partner of RAD51C in the CX3 (RAD51C-XRCC3)
  heterodimer, and CX3 also assembles with RAD51D-XRCC2 into the X3CDX2 (DX2-CX3) tetramer, with RAD51
  into an autoinhibited RAD51-X3C octamer, and with BCDX2 into a BCDX2-CX3-RAD51 supercomplex. Within
  these assemblies XRCC3 contacts RAD51 directly; X3CDX2 caps the 5' end of RAD51-ssDNA filaments (XRCC2
  forming the cap) and stabilizes them, and XRCC3-containing complexes stimulate RAD51-mediated strand
  exchange and D-loop formation. CX3 binds Holliday junctions and fork junctions, acts downstream of RAD51
  recruitment in BRCA1-BRCA2-dependent homologous recombination, and influences late steps of recombination,
  including gene-conversion tract length and GEN1-associated Holliday junction resolution in mitotic cells.
  During replication stress XRCC3 associates with nascent DNA at stalled forks, contributes to protection
  of nascent strands, and, uniquely among the paralog complexes, promotes ATP-hydrolysis-dependent restart
  of stalled and collapsed forks; ATM/ATR phosphorylation of XRCC3 Ser225 is required for RAD51 chromatin
  loading, HR repair and recovery of collapsed (but not stalled) forks. CX3 also recruits the FANCM translocase
  to R-loops to suppress transcription-replication conflicts. XRCC3 participates in recombination-mediated
  telomere trimming (t-loop deletion / t-circle formation) and is found in mitochondria, where RAD51C/XRCC3
  associates with the nucleoid and supports mtDNA replication and copy number. XRCC3-deficient cells are
  hypersensitive to DNA cross-linking agents and ionizing radiation and are chromosomally unstable; germline
  variants are associated with breast cancer susceptibility.
