- term:
    id: GO:0000722
    label: telomere maintenance via recombination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000534587
  - UniProtKB:O43542
  review:
    summary: XRCC3 participates in homologous-recombination events at telomeres (t-loop deletion / t-circle
      formation).
    action: KEEP_AS_NON_CORE
    reason: XRCC3-dependent telomeric recombination is experimentally supported in human cells (t-loop
      HR deletion, telomere trimming), but it is a context-specific deployment of its general HR mediator
      role rather than a core function.
    supported_by:
    - reference_id: PMID:15507207
      supporting_text: TRF2DeltaB-induced deletions depended on XRCC3, a protein implicated in Holliday
        junction resolution, and created t-loop-sized telomeric circles
- term:
    id: GO:0000722
    label: telomere maintenance via recombination
  evidence_type: IMP
  original_reference_id: PMID:15507207
  qualifier: involved_in
  review:
    summary: TRF2-deltaB-induced catastrophic telomere deletions generating t-loop-sized telomeric circles
      depend on XRCC3.
    action: KEEP_AS_NON_CORE
    reason: Valid experimental evidence of XRCC3-dependent telomeric HR; non-core because it reflects
      the general HR machinery acting at telomeres (and this process actually shortens telomeres).
    supported_by:
    - reference_id: PMID:15507207
      supporting_text: TRF2DeltaB-induced deletions depended on XRCC3, a protein implicated in Holliday
