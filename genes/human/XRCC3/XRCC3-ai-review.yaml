- term:
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:23149936
  qualifier: involved_in
  review:
    summary: Epistasis places CX3 downstream of RAD51 recruitment in the BRCA1-BRCA2-dependent HR pathway,
      with a marked effect on HR frequency.
    action: ACCEPT
    reason: Core function. XRCC3 deficiency reduces DSB-induced HR; structural/biochemical studies now
      show the CX3/X3CDX2 complexes engage RAD51 filaments and stimulate strand exchange, providing a
      mechanism for this role.
    supported_by:
    - reference_id: PMID:23149936
      supporting_text: the CX3 complex acts downstream of Rad51 recruitment but still has a marked impact
        on the measured frequency of homologous recombination
    - reference_id: PMID:23438602
      supporting_text: XRCC3 phosphorylation is required for chromatin loading of RAD51 and HR-mediated
        repair of double-strand breaks
