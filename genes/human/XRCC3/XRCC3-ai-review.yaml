suggested_questions:
- question: Which XRCC3-containing assembly (CX3, RAD51-X3C octamer, X3CDX2, or BCDX2-CX3) executes each
    cellular role - HR, stalled-fork restart, collapsed-fork recovery, R-loop suppression - and does GO
    need a complex term for X3CDX2 (RAD51C-RAD51D-XRCC2-XRCC3), which currently has none?
- question: Is the reported XRCC3 role in Holliday junction resolution (with GEN1) a direct activity of
    CX3 on junctions, or a downstream consequence of its 5' capping/stabilization of RAD51 filaments and
    D-loops?
- question: Does XRCC3 ATP hydrolysis (required for fork restart and RAD51 disengagement) contribute to
    strand-exchange stimulation, given that X3CDX2 shows minimal ATPase activity?
suggested_experiments:
- description: Separation-of-function XRCC3 mutants that disrupt the RAD51-contacting loop insertion versus
    the RAD51C or DX2 interfaces, tested in cells for HR (DR-GFP), stalled versus collapsed fork restart,
    and R-loop suppression.
  hypothesis: Distinct XRCC3 interfaces specify distinct paralog assemblies and thus separable cellular
    functions.
- description: Reconstitution of D-loop / Holliday junction processing with purified CX3 or X3CDX2 plus
    GEN1 to test whether XRCC3-containing complexes directly promote branch migration or junction cleavage.
  hypothesis: XRCC3 affects junction resolution indirectly via D-loop stabilization rather than direct
    stimulation of GEN1.
