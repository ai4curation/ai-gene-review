core_functions:
- description: 'As the RAD51-contacting subunit of CX3 and of the X3CDX2 (DX2-CX3) assembly, XRCC3 regulates
    the RAD51 nucleoprotein filament: X3CDX2 stably caps the 5'' end of RAD51-ssDNA filaments and anchors
    them, and XRCC3-containing complexes stimulate RAD51-mediated strand exchange and D-loop formation.
    This acts downstream of RAD51 recruitment in BRCA1-BRCA2-dependent homologous recombination repair
    of DNA double-strand breaks. Strand-exchange stimulation is assigned contributes_to because it is
    a property of the paralog complexes.'
  supported_by:
