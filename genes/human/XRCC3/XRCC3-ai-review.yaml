    supporting_text: the XRCC3 complex stably caps the 5' termini of RAD51 filaments to promote homologous pairing
  - reference_id: PMID:41196948
    supporting_text: The XRCC3 complex, and to a lesser extent the CX3 complex, stimulated RAD51-mediated
      strand invasion
  - reference_id: PMID:42020761
    supporting_text: RAD51–X3C displayed significantly enhanced DNA strand exchange activity over RAD51
      alone across the protein concentrations tested
  - reference_id: PMID:41772053
    supporting_text: When RPA was added before RAD51, BCDX2-CX3 and CX3 strongly stimulated D-loop formation
  - reference_id: PMID:23149936
    supporting_text: the CX3 complex acts downstream of Rad51 recruitment but still has a marked impact
      on the measured frequency of homologous recombination
  - reference_id: PMID:42682019
    supporting_text: the X3CDX2 complex also caps the RAD51 nucleofilament at the 5′ end, with XRCC3 directly
      interacting with RAD51 and XRCC2 forming the cap
