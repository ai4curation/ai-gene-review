id: P15529
gene_symbol: CD46
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD46 (membrane cofactor protein) is a type I membrane glycoprotein with four extracellular
  complement-control domains and alternatively spliced extracellular and cytoplasmic regions.
  It binds C3b and C4b and acts as a cofactor for their proteolytic inactivation by complement
  factor I, protecting host cell surfaces from complement injury. In human T cells, CD46 also
  provides a costimulatory signal with the T-cell receptor and helps regulate the transition
  from inflammatory responses to IL-10-producing regulatory responses. Its extracellular interaction
  with Jagged1 regulates the availability of this ligand for Notch receptors. Cytoplasmic tail
  variants differ in signaling and interaction capacity. CD46 is also present on the inner acrosomal
  membrane of human sperm and can be exploited as an entry receptor by certain pathogens, including
  the Edmonston strain of measles virus. Impaired complement regulation by some CD46 variants
  predisposes to atypical hemolytic uremic syndrome.
