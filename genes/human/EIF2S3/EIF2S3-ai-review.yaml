    review_notes: The human alpha/beta/gamma substrate complex was expressed in yeast and purified using
      beta-His and alpha-FLAG handles. Its composition supports eIF2 subunit association. The exchange
      activity and ISRIB response belong to eIF2B; eIF2 gamma is the nucleotide-bearing substrate, not
      the guanine nucleotide exchange factor.
