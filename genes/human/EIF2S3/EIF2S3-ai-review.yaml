  review:
    summary: Human EIF2S3 perturbation supports its initiation-factor role in HCV-IRES translation.
    action: ACCEPT
    reason: The original study separately targets human eIF2 gamma and eIF2B gamma. RzHCV2 and four additional
      gamma-directed validation ribozymes reduce HCV-IRES-driven protein output in HeLa reporter cells,
      with reporter RNA and cap-dependent-expression controls. The EIF2S3 result supports translation-initiation
      factor activity in this measured viral-IRES context. Cleavage of synthetic EIF2S3 RNA is performed
      by the ribozyme and is not an RNA-binding assay of the encoded gamma protein.
