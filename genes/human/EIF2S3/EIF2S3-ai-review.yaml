  review:
    summary: Gamma participates in formation of the translation preinitiation complex.
    action: ACCEPT
    reason: The exact PTN000562153 IBD is on the human target path and is grounded in the preserved fission-
      and budding-yeast records. Gamma carries GTP and initiator tRNA within the eIF2 ternary complex
      that joins the small ribosomal subunit; it supplies part of the assembly machinery rather than merely
      being a downstream translation product. Human loss-of-function and complex/tRNA recovery experiments
      are concordant. The phylogenetic assertion is not a pairwise similarity claim.
    supported_by:
