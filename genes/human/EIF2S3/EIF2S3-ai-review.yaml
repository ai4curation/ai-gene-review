    - reference_id: PMID:31836389
- term:
    id: GO:0002183
    label: cytoplasmic translational initiation
  evidence_type: IMP
  original_reference_id: PMID:31836389
  qualifier: involved_in
  review:
    summary: Human patient-cell and isogenic-control experiments support cytoplasmic translation initiation.
    action: ACCEPT
    reason: PMID:31836389 compares EIF2S3 frameshift patient-derived iPSCs with control cells and includes
      CRISPR-corrected isogenic controls. Reduced polysomes and protein synthesis, altered upstream-ORF
      reporter translation, and impaired eIF2/initiator-tRNA complex recovery establish a translation-initiation
      defect. The gamma subunit performs part of the initiation machinery; selective induction of stress
      transcripts is compatible with reduced bulk translation. ISRIB rescues several outputs through eIF2B
      and is not evidence that EIF2S3 itself has nucleotide-exchange activity.
    supported_by:
    - reference_id: PMID:31836389
