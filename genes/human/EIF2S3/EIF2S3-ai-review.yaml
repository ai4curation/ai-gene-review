  review:
    summary: The GTPase-domain mapping matches the catalytic nucleotide cycle of eIF2 gamma.
    action: ACCEPT
    reason: The target has the specific eIF2-gamma GTPase architecture as well as the mapped IPR000795
      domain. RHEA:19669 describes GTP hydrolysis, not guanine nucleotide exchange. Gamma contains the
      guanine-nucleotide site; the physiologic hydrolysis cycle is regulated by the initiation machinery,
      including eIF5. The shared domain is interpreted in this target context rather than as evidence
      for an elongation-factor function or autonomous unrestricted hydrolysis.
