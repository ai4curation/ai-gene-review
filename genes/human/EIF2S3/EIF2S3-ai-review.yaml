    summary: The reported interaction with METTL15 isoform 4 is retained as a non-core binding observation.
    action: KEEP_AS_NON_CORE
    reason: PMID:32814053 uses a yeast two-hybrid matrix with reporter retesting; the exact pair, alternative-product
      identifier and any fragment interval are preserved in the literal IntAct records. Array, pooling
      and validated records are stages of this workflow, not three independent assay classes. The tested
      68-279 interval belongs to the explicitly recorded alternative product A6NJ78-4. Its altered C-terminal
      sequence overlaps the methyltransferase region; the saved evidence does not establish a specific
      active-enzyme class for this assayed product. The positive interaction remains valid without an
      assertion that the fragment is inactive. This does not establish an endogenous human complex or
      an orthogonal mammalian interaction assay for this pair.
