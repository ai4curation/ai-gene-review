id: P41091
gene_symbol: EIF2S3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2S3 encodes the gamma subunit of the cytosolic eukaryotic translation initiation factor
  eIF2. Gamma provides the guanine-nucleotide-binding and GTPase center and engages initiator methionyl-tRNA.
  Together with the alpha and beta subunits, it forms the eIF2–GTP–Met-tRNAi ternary complex that delivers
  initiator tRNA to the small ribosomal subunit. Its eIF5-regulated nucleotide cycle supports progression
  through translation initiation, and eIF2B promotes exchange of bound GDP for GTP to recycle eIF2.
