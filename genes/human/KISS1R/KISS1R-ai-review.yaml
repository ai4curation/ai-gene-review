- id: PMID:11387329
  title: AXOR12, a novel human G protein-coupled receptor, activated by the peptide
    KiSS-1.
  findings:
  - statement: >-
      AXOR12 (GPR54/KISS1R) was cloned from human brain and is activated with high potency by
      KiSS-1-derived peptides sharing a C-terminal amidated motif, with receptor protein localized
      to neurons.
    supporting_text: >-
      High potency agonism, indicative of a cognate ligand, was evident from peptides derived
      from the gene KiSS-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified deorphanization of human GPR54/AXOR12. Abstract-only in cache; supports
      neuropeptide receptor activity (IDA) and the general GPCR signalling framing.
- id: PMID:11457843
  title: The metastasis suppressor gene KiSS-1 encodes kisspeptins, the natural ligands
    of the orphan G protein-coupled receptor GPR54.
  findings:
  - statement: >-
      Kisspeptins bind human and rat GPR54 with low-nanomolar affinity and stimulate PIP2
      hydrolysis, Ca2+ mobilization and MAPK phosphorylation — the Gq/11-PLC pathway.
    supporting_text: >-
      They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
      hamster ovary K1 cells and stimulated PIP(2) hydrolysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Core deorphanization/signalling paper; establishes GPCR activity and PLC-activating GPCR
      signalling. Abstract-only in cache but the signalling readouts are stated explicitly.
- id: PMID:14573733
  title: The GPR54 gene as a regulator of puberty.
  findings:
  - statement: >-
      Loss-of-function GPR54 mutations cause autosomal-recessive hypogonadotropic hypogonadism in
      humans and mice; the receptor is essential for GnRH physiology and puberty.
    supporting_text: >-
      Mutations in GPR54, a G protein-coupled receptor gene, cause autosomal recessive idiopathic
      hypogonadotropic hypogonadism in humans and mice, suggesting that this receptor is essential
      for normal gonadotropin-releasing hormone physiology and for puberty
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Landmark human+mouse genetics establishing the HPG-axis role; IMP for GO:0032278.
- id: PMID:15598687
  title: Two novel missense mutations in g protein-coupled receptor 54 in a patient
    with hypogonadotropic hypogonadism.
  findings:
  - statement: >-
      Compound-heterozygous GPR54 variants C223R (profoundly impaired signalling) and R297L (mild
      reduction) cause hypogonadotropic hypogonadism.
    supporting_text: >-
      the C223R variant was found to exhibit profoundly impaired signaling
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Second IHH kindred; functional characterization of loss-of-function variants.
- id: PMID:18772143
  title: Disease-causing mutation in GPR54 reveals the importance of the second intracellular
    loop for class A G-protein-coupled receptor function.
  findings:
  - statement: >-
      The IHH mutation L148S abolishes GPR54 PI-hydrolysis and ERK responses and blocks catalytic
      activation of Galpha_q, without affecting expression, surface trafficking, ligand binding,
      or Galpha binding.
    supporting_text: >-
      this mutation does not prevent GPR54 from reaching the plasma membrane in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text available. Supplies direct human evidence for plasma-membrane localization,
      PLC-activating signalling, GPCR activity, and GPR54-Galpha_q binding (the basis for the
      GO:0001965 MODIFY of the GNAQ IPI row).
- id: PMID:18977201
  title: Physical association of GPR54 C-terminal with protein phosphatase 2A.
  findings:
  - statement: >-
      The GPR54 C-terminal proline/arginine-rich region binds the PP2A catalytic subunit directly
      (Y2H and pull-down with retained phosphatase activity).
    supporting_text: >-
      The GPR54 C-ter bound directly to purified recombinant PP2A-C
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Specific interaction evidence behind the PPP2CA IPI; basis for the GO:0051721 MODIFY.
      Functional consequence for the receptor is undefined.
- id: PMID:28154160
  title: Tubby family proteins are adapters for ciliary trafficking of integral membrane
    proteins.
  findings:
  - statement: >-
      KISS1R-GFP localizes to primary cilia and its steady-state ciliary level depends on TULP3.
    supporting_text: >-
      with GPR83 and KISS1R, the steady-state ciliary levels were significantly decreased with
      respect to the control
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text available; supports the cilium IDA. The assay uses overexpressed KISS1R-GFP in RPE
      cells, so ciliary localization is real but kept as non-core.
- id: PMID:24982149
  title: Primary cilia enhance kisspeptin receptor signaling on gonadotropin-releasing
    hormone neurons.
  findings:
  - statement: >-
      Kiss1r is enriched in primary cilia of mouse GnRH neurons, and disrupting those cilia
      reduces kisspeptin-mediated GnRH neuronal activity.
    supporting_text: >-
      disruption of cilia selectively on GnRH neurons leads to a significant reduction in
      kisspeptin-mediated GnRH neuronal activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse evidence that ciliary KISS1R localization is functionally relevant in GnRH neurons.
- id: PMID:34939256
  title: The electrophysiologic properties of gonadotropin-releasing hormone neurons.
  findings:
  - statement: >-
      Kisspeptin via Kiss1r depolarizes GnRH neurons through inhibition of multiple K+ currents and
      activation of TRPC-like cation channels; Kiss1r in GnRH neurons is necessary and sufficient
      for these effects, puberty and fertility.
    supporting_text: >-
      Kisspeptin receptor (Kiss1r) expression in GnRH neurons is both necessary and sufficient for
      kisspeptin-10 effects on GnRH neuron firing and LH secretion, for puberty and overall fertility
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text review; basis for the depolarization and cation-transport downstream rows.
- id: PMID:39083597
  title: Multiplexed mapping of the interactome of GPCRs with receptor activity-modifying
    proteins.
  findings:
  - statement: >-
      A multiplexed GPCR-RAMP interactome screen reports KISS1R among GPCRs interacting with RAMPs;
      functional significance is not established.
    supporting_text: >-
      we identified 122 GPCRs that showed strong evidence for interaction with at least one RAMP
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full-text available. High-throughput interactome; the RAMP1/2/3 IPI rows are bare protein
      binding with no established function, so removed under the protein-binding policy.
- id: PMID:38346942
  title: Kisspeptin-10 binding to Gpr54 in osteoclasts prevents bone loss by activating
    Dusp18-mediated dephosphorylation of Src.
  findings:
  - statement: >-
      Kp-10/Gpr54 recruits active SRC and DUSP18 at the receptor C-terminus and drives DUSP18-mediated
      SRC(Y416) dephosphorylation, suppressing osteoclast differentiation/activity and bone resorption;
      Kiss1/Gpr54/Dusp18 knockout mice show osteoclast hyperactivation and bone loss.
    supporting_text: >-
      GPR54 activation by its natural ligand Kisspeptin-10 (Kp-10) causes Dusp18 to
      dephosphorylate Src at Tyr 416
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text available (has a 2024 author correction, PMID:39702286). Mechanism largely in mouse
      (whole-body + LysM-Cre osteoclast cKO) with human giant-cell-tumour osteoclast confirmation;
      basis for the bone/osteoclast and molecular-adaptor rows.
- id: PMID:18434521
  title: Kisspeptin depolarizes gonadotropin-releasing hormone neurons through activation
    of TRPC-like cationic channels.
  findings:
  - statement: >-
      Kisspeptin depolarizes GnRH neurons mainly by activating TRPC-like nonselective cation channels
      and, to a lesser extent, inhibiting Kir channels.
    supporting_text: >-
      kisspeptin depolarizes GnRH neurons through
      activating TRPC-like channels and, to a lesser extent, inhibition of Kir
      channels
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse electrophysiology; ionic mechanism behind the cation-transport downstream row.
- id: PMID:11414709
  title: FMRFamide-related neuropeptides are agonists of the orphan G-protein-coupled
    receptor GPR54.
  findings:
  - statement: >-
      Human/mouse/rat GPR54 are ~85% identical and are activated by RF/RW-amide neuropeptides through
      the Galpha_q pathway.
    supporting_text: >-
      invertebrate neuropeptides of the RFamide and RWamide family that were able to activate GPR54
      at microM range through the G(alpha)q pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes Gq coupling and the RF-amide agonist motif; source of the mouse IDA rows.
- id: PMID:12944565
  title: Hypogonadotropic hypogonadism due to loss of function of the KiSS1-derived
    peptide receptor GPR54.
  findings:
  - statement: >-
      A consanguineous IHH family carries a homozygous GPR54 deletion, independently establishing
      that GPR54 loss of function causes hypogonadotropic hypogonadism.
    supporting_text: >-
      The present study shows that loss of function of GPR54 is a cause of IHH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent IHH genetics paper (de Roux 2003), corroborating Seminara 2003.
- id: PMID:18272894
  title: A GPR54-activating mutation in a patient with central precocious puberty.
  findings:
  - statement: >-
      The GPR54 R386P variant causes central precocious puberty by prolonging kisspeptin-induced
      intracellular signalling (gain of function).
    supporting_text: >-
      this mutation leads to prolonged activation of intracellular signaling pathways in response
      to kisspeptin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Gain-of-function human genetics; the mirror of the loss-of-function IHH phenotype.
- id: PMID:25147978
  title: KISS1R signals independently of Gαq/11 and triggers LH secretion via the β-arrestin
