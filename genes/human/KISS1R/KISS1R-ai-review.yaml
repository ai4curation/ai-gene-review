core_functions:
- description: >-
    Plasma-membrane G protein-coupled receptor for the kisspeptin neuropeptides, coupling to
    Gq/11 to activate phospholipase C-beta (PIP2 hydrolysis, Ca2+ mobilization); on hypothalamic
    GnRH neurons this signalling drives GnRH secretion and thereby positively regulates pituitary
    gonadotropin release, puberty and fertility.
  molecular_function:
    id: GO:0008188
    label: neuropeptide receptor activity
  directly_involved_in:
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  - id: GO:0007218
    label: neuropeptide signaling pathway
  - id: GO:0032278
    label: positive regulation of gonadotropin secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:11457843
    supporting_text: >-
      They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
      hamster ovary K1 cells and stimulated PIP(2) hydrolysis
  - reference_id: PMID:14573733
    supporting_text: >-
      Mutations in GPR54, a G protein-coupled receptor gene, cause autosomal recessive idiopathic
      hypogonadotropic hypogonadism in humans and mice, suggesting that this receptor is essential
      for normal gonadotropin-releasing hormone physiology and for puberty
proposed_new_terms: []
suggested_questions:
- question: >-
    What is the physiological significance of KISS1R coupling to Gi/o (seen structurally and in
    dissociation assays) alongside its canonical Gq/11 coupling, and of its interactions with
    RAMP1/2/3?
- question: >-
    How much do the Gq/11 and the G protein-independent beta-arrestin arms each contribute to
    kisspeptin-driven GnRH and LH secretion in humans, as opposed to mouse models?
suggested_experiments:
- description: >-
    Quantify Galpha subtype coupling (Gq/11, Gi/o, G12/13, Gs) and beta-arrestin recruitment for
    endogenous kisspeptins (KP-54, KP-10) at human KISS1R in parallel BRET/NanoBiT assays, and
    test disease variants (L148S, R386P) across both arms to resolve their separate contributions.
  hypothesis: >-
    The Gq/11-PLC arm dominates acute GnRH-neuron excitation, while the beta-arrestin arm provides
    a slower, desensitization-coupled ERK signal that shapes sustained gonadotropin output.
- description: >-
    Test the cell-autonomy of KISS1R osteoclast suppression in human osteoclasts differentiated
    from CD14+ monocytes, comparing Kp-10 effects on differentiation, SRC(Y416) phosphorylation
    and resorption with and without KISS1R knockdown and DUSP18 depletion.
  hypothesis: >-
    Kp-10/KISS1R suppresses human osteoclast resorption cell-autonomously through DUSP18-mediated
    SRC dephosphorylation, independent of the hypothalamic-pituitary-gonadal axis.
