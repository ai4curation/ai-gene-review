id: Q969F8
gene_symbol: KISS1R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Plasma-membrane class A (rhodopsin-like) seven-transmembrane G protein-coupled receptor
  (GPR54 / AXOR12 / hOT7T175), the cognate receptor for the kisspeptins — the C-terminally
  amidated RF-amide peptides (kisspeptin-54/metastin, -14, -13 and the minimal decapeptide
  kisspeptin-10) cleaved from the KISS1 precursor. Ligand binding couples the receptor to
  Gq/11, activating phospholipase C-beta to hydrolyse PIP2 and raise intracellular calcium,
  with downstream PKC, ERK1/2 and p38 MAPK signalling; the receptor additionally engages a
  G protein-independent beta-arrestin pathway to ERK and can couple Gi/o. Its defining
  physiological role is as the output receptor on hypothalamic gonadotropin-releasing hormone
  (GnRH) neurons: kisspeptin acting through KISS1R depolarises GnRH neurons (by inhibiting
  inwardly-rectifying K+ channels and opening TRPC-like cation channels) and drives GnRH
  secretion, which in turn controls pituitary gonadotropin (LH/FSH) release, puberty and
  fertility. Human loss-of-function variants cause autosomal-recessive normosmic
  hypogonadotropic hypogonadism, and a gain-of-function variant causes central precocious
  puberty. The same receptor was originally identified through its anti-metastatic,
  anti-proliferative and anti-invasive ("metastin") signalling in tumour cells and
  trophoblast, and more recently implicated in osteoclast suppression of bone resorption.
