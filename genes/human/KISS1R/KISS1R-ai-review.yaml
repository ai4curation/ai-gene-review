    supporting_text: >-
      we demonstrated that KISS1R can couple to the Gi/o pathway besides the well-known Gq/11 pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text available; structural/functional evidence for secondary Gi/o coupling.
- id: Reactome:R-HSA-379048
  title: Liganded Gq/11-activating GPCRs act as GEFs for Gq/11
