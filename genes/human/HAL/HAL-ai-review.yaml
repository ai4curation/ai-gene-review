- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: >-
      BioPlex 3.0 is a proteome-scale affinity-purification mass-spectrometry
      interaction network covering about half the human proteome; HAL appears in it
      only as one node of a genome-wide screen, with RPS19BP1 (Q86WX3) as its
      reported partner, and the study assigns no function to that association.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Through affinity-purification mass spectrometry, we have created two
      proteome-scale, cell-line-specific interaction networks.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput AP-MS interactome study (BioPlex 3.0). Correctly cited as the
      source of a proteome-scale HAL-RPS19BP1 (Q86WX3) protein-binding interaction,
      but it does not address HAL's catalytic or biological function.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: >-
      A multimodal U2OS cell map built from biophysical interactions plus
      immunofluorescence for over 5,100 proteins; it is the second, independent
      proteome-scale source of the HAL-RPS19BP1 interaction. HAL is not
      individually characterized and is not placed in an annotated assembly with
      RPS19BP1, so the study supports the existence of the interaction but not any
      molecular function for it.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Here we construct a global map of human subcellular architecture through
      joint measurement of biophysical interactions and immunofluorescence images
      for over 5,100 proteins in U2OS osteosarcoma cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput multimodal (AP-MS + immunofluorescence) cell-map study.
      Correctly cited as source of a proteome-scale HAL-RPS19BP1 interaction; HAL is
      not individually characterized (the "HAL" text hits refer to the HALT protease
      inhibitor reagent).
- id: Reactome:R-HSA-70899
  title: histidine => urocanate + NH4+
  findings:
  - statement: >-
      Reactome curates the HAL reaction as cytosolic, converting histidine to
      urocanate plus ammonium. This is the basis for both the cytosol location
      annotation and the preference for GO:0005829 over the broader GO:0005737
      cytoplasm IEA.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      Cytosolic histidine ammonia lyase (HAL) catalyzes the reaction of histidine
      to form urocanate and NH4+
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for cytosolic HAL converting histidine to urocanate + NH4+;
      supports the molecular function and cytosolic location.
- id: Reactome:R-HSA-70921
  title: Histidine catabolism
  findings:
  - statement: >-
      The major route of histidine catabolism proceeds in four steps to glutamate,
      converting one tetrahydrofolate to 5-formiminotetrahydrofolate; HAL catalyzes
      the first of these steps, which is what places HAL inside the process rather
      than merely upstream of it.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      The major pathway of histidine catabolism, annotated here, proceeds in four
      steps to yield glutamate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome histidine catabolism pathway; HAL catalyzes its first step. Supports
      the L-histidine catabolic process annotation.
