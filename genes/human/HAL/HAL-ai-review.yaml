id: P42357
gene_symbol: HAL
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HAL (histidine ammonia-lyase, histidase; EC 4.3.1.3) catalyzes the first and
  committed step of L-histidine catabolism, the non-oxidative deamination of
  L-histidine to trans-urocanate (urocanic acid) plus ammonia. It is a member of
  the PAL/histidase (aromatic amino acid ammonia-lyase) family and uses an
  autocatalytically formed 4-methylideneimidazol-5-one (MIO) prosthetic group,
  generated by cyclization and dehydration of an internal Ala-Ser-Gly tripeptide,
  as its catalytic electrophile. The active enzyme is a homotetramer that acts in
  the cytosol. In the liver, this reaction initiates the pathway that degrades
  histidine ultimately to L-glutamate; in the skin/epidermis, the urocanate product
  is a major UV-absorbing chromophore of the stratum corneum. Expression is
  enriched in liver and skin. Loss-of-function variants cause the autosomal
  recessive inborn error of metabolism histidinemia, characterized by elevated
  histidine and reduced urocanate in body fluids.
alternative_products:
- name: '1'
  id: P42357-1
  description: >-
    Canonical 657-residue isoform (sequence displayed in UniProt P42357). This is
    the form that carries the complete PAL/histidase fold, including the
    MIO-forming Ala-Ser-Gly tripeptide (5-imidazolinone crosslink, residues
    253-255), and to which all functional and disease annotations refer.
- name: '2'
  id: P42357-2
  sequence_note: VSP_044704
  description: >-
    Alternatively spliced isoform in which the C-terminal 69 residues (589-657) of
    the canonical sequence are replaced by the tripeptide 'FGK'. Reported from
    full-length cDNA sequencing (PubMed:14702039); no isoform-specific function or
    catalytic activity has been measured, so no annotation is assigned to it.
- name: '3'
  id: P42357-3
  sequence_note: VSP_046003
  description: >-
    Alternatively spliced isoform lacking residues 1-208, i.e. the entire
    N-terminal region preceding the MIO-forming Ala-Ser-Gly tripeptide (253-255).
    Reported from full-length cDNA sequencing (PubMed:14702039); because the
    histidase active site is built across the subunit interfaces of the
    homotetramer, this truncation would be expected to compromise assembly and
    catalysis, but this has not been tested and no annotation is assigned to it.
existing_annotations:
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetically inferred (IBA) annotation to the histidine catabolic
      process. This is the correct, core biological process for HAL: it catalyzes
      the first committed step of L-histidine degradation. Consistent with the
      UniProt pathway annotation and the enzymatic reaction.
    action: ACCEPT
    reason: >-
      ACCEPT because HAL itself performs a step of this process: it catalyzes the
      committed first reaction (step 1/3) of L-histidine degradation to
      L-glutamate, so the involved_in qualifier is literally true rather than a
      necessity or substrate relationship. The PAN-GO/GO_Central node placement is
      sound for this family: histidine ammonia-lyase is the defining activity of
      the PAL/histidase clade and is experimentally characterized in bacterial,
      rodent and human members, with human loss of function causing histidinemia
      (PMID:15806399). Retained as core.
    supported_by:
    - reference_id: file:human/HAL/HAL-uniprot.txt
      supporting_text: >-
        glutamate; N-formimidoyl-L-glutamate from L-histidine: step 1/3.
