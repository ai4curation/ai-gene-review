suggested_questions:
- question: >-
    Human HAL is annotated with phosphothreonine at 637 and phosphoserine at 648
    only by similarity to the rat enzyme. Are these sites phosphorylated in human
    liver or epidermis, and does phosphorylation of the C-terminal tail modulate
    histidase activity, homotetramer stability, or turnover?
- question: >-
    Epidermal HAL supplies trans-urocanate as the major UV-absorbing chromophore of
    the stratum corneum, while hepatic HAL initiates histidine degradation. Are the
    two pools of enzyme regulated by distinct mechanisms, and does the skin pathway
    terminate at urocanate rather than continuing to glutamate?
- question: >-
    Do the two alternatively spliced isoforms (P42357-2, lacking the C-terminal 69
    residues; P42357-3, lacking residues 1-208) produce stable protein in liver or
    skin, and do they retain any catalytic activity or act as dominant-negative
    subunits within the homotetramer?
- question: >-
    Rat Hal is the source of the transferred "cellular response to nutrient"
    annotation. Which step of that response actually involves HAL - is the enzyme
    only a transcriptional/translational target of dietary histidine, or does
    histidase flux itself feed back onto nutrient-sensing signalling?
suggested_experiments:
- hypothesis: >-
    The four histidinemia missense substitutions (R206T, R208L, P259L, R322P)
    reduce histidine ammonia-lyase activity directly, rather than only
    destabilizing the protein, and P259L in particular impairs autocatalytic MIO
    formation because it lies adjacent to the Ala-Ser-Gly tripeptide at 253-255.
  description: >-
    Express and purify recombinant human HAL (wild type and each of the four
    disease variants) and measure steady-state kinetics of histidine deamination
    (Km, kcat) spectrophotometrically by trans-urocanate formation at 277 nm.
    Quantify MIO content independently (borohydride reduction / mass spectrometry of
    the 253-255 crosslink) and assess homotetramer assembly by size-exclusion
    chromatography, so that catalytic defects can be separated from folding and
    cofactor-maturation defects.
  experiment_type: recombinant enzyme kinetics with cofactor and oligomeric-state analysis
- hypothesis: >-
    The alternatively spliced isoforms P42357-2 and P42357-3 are catalytically
    inactive, and co-expression of P42357-3 with the canonical isoform lowers
    specific activity by incorporating into the homotetramer.
  description: >-
    Express each isoform individually and in combination with canonical HAL in a
    histidase-null background, then assay histidine ammonia-lyase activity in
    lysates, determine the oligomeric state of the products by native gel and
    size-exclusion chromatography, and test whether tagged isoform 3 co-purifies
    with the canonical subunit. This distinguishes an inert product from a
    dominant-negative one and would establish whether either isoform warrants
    isoform-specific annotation.
  experiment_type: isoform co-expression, activity assay and complex composition analysis
- hypothesis: >-
    The HAL-RPS19BP1 association detected in two proteome-scale screens has no
    effect on histidase activity and is not reproducible by low-throughput methods
    in cells that express both proteins endogenously.
  description: >-
    Attempt to reproduce the interaction by reciprocal endogenous
    co-immunoprecipitation and by proximity labelling in a cell line expressing both
    HAL and RPS19BP1, then test whether RPS19BP1 depletion or addition of purified
    RPS19BP1 changes histidine ammonia-lyase kinetics. A negative result would
    support leaving the generic protein-binding annotation removed; a positive one
    would identify the informative molecular function this review could not propose.
  experiment_type: targeted interaction validation with activity readout
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      Source of three IEA annotations on HAL, each driven by a different InterPro
      signature: IPR008948 (L-aspartase-like superfamily) yields the root term
      catalytic activity, IPR022313 (PAL/histidase region) yields the parent term
      ammonia-lyase activity, and IPR005921 (histidine ammonia-lyase) yields
      cytoplasm. All three are true but less specific than the terms HAL already
      carries, which is why they are marked over-annotated or modified rather than
      removed.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the InterPro2GO pipeline behind the generic catalytic
      activity, ammonia-lyase activity and cytoplasm rows. The mappings are
      accurate for the matched signatures; the imprecision is inherent to
      superfamily-level domain matching, not a citation error.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAN-GO/GO_Central phylogenetic inference assigns human HAL the histidine
      ammonia-lyase activity (GO:0004397) and the L-histidine catabolic process
      (GO:0006548). Both are inherited from a well-supported ancestral node of the
      PAL/histidase family and are independently corroborated for human HAL by
      electronic and experimental annotations to the same terms.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAN-GO/GO_Central phylogenetic annotations correctly assign HAL the core
      histidine ammonia-lyase activity and histidine catabolic process. The node
      placement is not in question: histidase activity is the defining function of
      this family and is experimentally established in bacterial, rodent and human
      members.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings:
  - statement: >-
      Source of the orthology-transferred "cellular response to nutrient"
      (GO:0031670) annotation, taken from rat Hal (UniProtKB:P21213,
      ENSRNOP00000006971). The orthology assignment is correct, but the transferred
      term describes dietary regulation of histidase abundance rather than a process
      that HAL itself carries out.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
