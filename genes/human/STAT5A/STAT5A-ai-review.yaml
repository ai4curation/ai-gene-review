- description: 'Cytokine/hormone-receptor-activated, sequence-specific RNA polymerase II transcription
    factor: upon JAK-mediated phosphorylation at Tyr-694 and SH2-dependent dimerization, activated STAT5A
    binds gamma-activated sequence (GAS) elements in cis-regulatory regions of target genes and activates
    their transcription, recruiting coactivators (NCOA1/SRC-1, CBP/p300).'
