id: Q9H221
gene_symbol: ABCG8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCG8 (sterolin-2) is an ABC-family half-transporter that forms an obligate functional heterodimer
  with ABCG5. At apical membranes of intestinal enterocytes and hepatocytes, the complex couples ATP hydrolysis
  to export of neutral sterols, including cholesterol and plant sterols, into the intestinal lumen or bile. This
  limits net dietary sterol absorption and supports elimination of sterols from the body. Each subunit contributes
  a transmembrane domain and elements of two asymmetric nucleotide-binding sites; ABCG8 supplies the signature
  region of the transport-essential catalytic site. Loss-of-function variants cause autosomal recessive sitosterolemia,
  with sterol accumulation and increased cardiovascular risk.
