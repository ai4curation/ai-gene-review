  review:
    summary: ABCG8 contributes to nucleotide binding by the ABCG5–ABCG8 transporter.
    action: ACCEPT
    reason: The source purified recombinant human G5/G8 from Pichia and measured nucleotide trapping with fluoroaluminate/fluoroberyllate.
      Its contribution-qualified assertion fits the composite nucleotide sites. Later structures establish strong
      asymmetry between those sites; ABCG8 contributes the signature region to the active site, so this is not
      a claim that isolated ABCG8 has the same ATP-binding properties as ABCG5.
