    supporting_text: To obtain diffraction-quality crystals, human G5 and G8 were coexpressed in Pichia pastoris12,
      and tandem affinity chromatography was used to purify stable, monodisperse G5G8 heterodimers that retained
      ATPase activity (Extended Data Fig. 1).
  - reference_id: PMID:16893193
    supporting_text: Copurified ABCG5/G8 displayed low but significant ATPase activity with a V(max) of approximately
      15 nmol min(-)(1) mg(-)(1).
  - reference_id: PMID:27144356
    supporting_text: Expression of wild-type (WT) G5 together with WT G8 resulted in a ~30-fold increase in cholesterol
      transport into bile.
  - reference_id: PMID:12208868
    supporting_text: The fractional absorption of dietary cholesterol was reduced by about 50%, and biliary cholesterol
      levels were increased more than fivefold.
