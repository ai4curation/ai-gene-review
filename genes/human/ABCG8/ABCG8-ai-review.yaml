suggested_questions:
- question: Which conserved effector steps, beyond changed Abcg8 transcript abundance, explain the rat nutrient,
    drug and exercise response annotations in human enterocytes or hepatocytes?
- question: How do the two ABCG8 isoforms differ in assembly, trafficking and transport? The seeded annotations
    are not isoform-resolved, so no isoform-specific function is inferred.
- question: What fraction of the reduced dietary-cholesterol absorption after human G5/G8 transgene expression
    arises from enterocyte efflux versus altered biliary sterol delivery? The 2002 experiment does not separate
    these contributions.
suggested_experiments:
- description: Measure directional cholesterol and sitosterol transport in matched human polarized enterocyte
    and hepatocyte models with controlled ABCG5/ABCG8 expression, alongside surface localization and ATPase-coupling
    controls. Test diet- or drug-response conditions independently of transporter abundance.
  hypothesis: Changes in ABCG8 abundance and changes in intrinsic transport efficiency contribute differently
    to context-dependent sterol flux.
