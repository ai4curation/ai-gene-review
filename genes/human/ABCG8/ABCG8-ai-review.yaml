core_functions:
- description: As the ABCG8 half of the ABCG5–ABCG8 heterodimer, contributes transmembrane structure and a signature
    region of the active composite nucleotide site to MgATP-powered neutral-sterol export. The transporter operates
    at apical enterocyte and hepatocyte membranes, supporting cholesterol/phytosterol elimination into the lumen
    and bile and limiting net dietary sterol absorption. ATP binding, ATP hydrolysis and heterodimer formation
    are integrated parts of this transport mechanism, rather than separate autonomous ABCG8 activities. Human
    biochemical, structural and transgenic reconstitution evidence complements mouse purified sterol-transfer
    assays.
