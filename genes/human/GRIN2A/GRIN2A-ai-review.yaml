    label: amyloid-beta binding
  evidence_type: TAS
  original_reference_id: PMID:26719327
  qualifier: enables
  review:
    summary: Transferred as a direct amyloid-beta binding function for GluN2A, cited to a review of amyloid-beta receptors.
    action: MARK_AS_OVER_ANNOTATED
    reason: A recent review of amyloid-beta receptors states that no direct binding of amyloid-beta oligomers to NMDA
      receptor subunits has been reported; the receptor's role in amyloid-beta toxicity is downstream of oligomer
      binding to other surface proteins. A direct binding function for GluN2A goes beyond the evidence.
    supported_by:
    - reference_id: PMID:26719327
      supporting_text: However, no direct binding of AβO to NMDAR subunits has been reported.
