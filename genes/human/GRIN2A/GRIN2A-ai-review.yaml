core_functions:
- description: GluN2A is a glutamate-binding, pore-forming subunit of the NMDA receptor. Together with GluN1 it forms
    a glutamate- and glycine-gated cation channel that is blocked by Mg2+ at resting potential and conducts Na+, K+
    and Ca2+ when open. At excitatory synapses this current contributes the slow component of the postsynaptic response
    and supplies the calcium signal that induces synaptic plasticity.
