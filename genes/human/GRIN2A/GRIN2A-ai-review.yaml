    label: glutamate binding
  evidence_type: IDA
  original_reference_id: PMID:26875626
  review:
    summary: GluN2A provides the glutamate-binding site of the NMDA receptor; its ligand-binding domain is co-crystallised
      with L-glutamate and bears the glutamate-contacting residues.
    action: NEW
    reason: 'Unlike GRIN2B, GRIN2A has no glutamate-binding annotation, yet glutamate binding is a defining molecular
      function of every GluN2 subunit: GluN1 forms the glycine site and GluN2 forms the glutamate site. UniProt records
      L-glutamate binding residues on GluN2A with experimental/structural evidence, and channel activation requires
      glutamate binding to the GluN2 subunit.'
