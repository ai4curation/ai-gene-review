suggested_questions:
- question: At mature human forebrain synapses, what fraction of NMDA receptors are diheteromeric GluN1/GluN2A versus
    triheteromeric GluN1/GluN2A/GluN2B, and does GluN2A content set a distinct plasticity rule in human neurons?
- question: Do the loss-of-function GRIN2A variants associated with schizophrenia and the gain-of-function variants
    associated with epilepsy converge on the same postsynaptic signalling events, or on different ones?
- question: Is the high-affinity N-terminal-domain zinc site of GluN2A occupied by synaptically co-released zinc under
    physiological conditions, and how much tonic inhibition does it provide?
suggested_experiments:
- hypothesis: Epilepsy-associated gain-of-function and schizophrenia-associated loss-of-function GRIN2A variants have
    opposite effects on NMDA receptor-dependent calcium signalling and synaptic plasticity in human neurons.
  description: Introduce representative GOF and LOF GRIN2A variants into isogenic human iPSC-derived cortical neurons
    by knock-in, and measure glutamate-evoked NMDA currents, single-channel Ca2+ permeability, and LTP/LTD at their
    synapses.
  experiment_type: patch-clamp electrophysiology and calcium imaging in isogenic iPSC neurons
- hypothesis: Synaptically co-released zinc tonically inhibits GluN2A-containing receptors through the high-affinity
    N-terminal-domain site.
  description: Record NMDA EPSCs at GluN2A-rich human synapses in the presence and absence of a high-affinity zinc
    chelator and of N-terminal-domain-disrupting mutations, to quantify the tonic zinc inhibition contributed by the
    GluN2A site.
  experiment_type: slice electrophysiology with zinc chelation and mutagenesis
