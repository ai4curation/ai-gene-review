    action: MODIFY
    reason: The cited study measures binding of the NMDA receptor GluN2 C-terminus to the first two PDZ domains of PSD-95
      and SAP102. That supports the more informative PDZ domain binding rather than bare protein binding, as the
      protein-binding policy asks when the paper identifies a specific interaction. The GluN2 tail ends in the
