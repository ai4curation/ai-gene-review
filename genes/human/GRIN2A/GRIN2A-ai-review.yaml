id: Q12879
gene_symbol: GRIN2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN2A encodes GluN2A (NR2A, glutamate [NMDA] receptor subunit epsilon-1), one of the four GluN2 subunits
  of NMDA-type ionotropic glutamate receptors. Two GluN1 subunits assemble with two GluN2 subunits (and sometimes
  GluN3) into a heterotetrameric cation channel in the neuronal plasma membrane, concentrated in the postsynaptic
  density of excitatory synapses on dendritic spines. GluN2A provides the glutamate-binding site (GluN1 binds the
  co-agonist glycine or D-serine), and its large extracellular N-terminal and ligand-binding domains, transmembrane
  pore region and long intracellular C-terminal tail set the receptor's deactivation kinetics, open probability, voltage-dependent
  Mg2+ block, Ca2+ permeability and high-affinity (nanomolar) zinc inhibition. Channel opening requires glutamate
  plus glycine binding and membrane depolarisation to relieve Mg2+ block, so the receptor acts as a coincidence detector;
  the resulting Na+, K+ and Ca2+ flux, and especially Ca2+ entry, drives long-term synaptic potentiation and other
  forms of synaptic plasticity. GluN2A becomes the predominant GluN2 subunit at mature forebrain synapses. Its C-terminal
  tail binds PDZ-domain scaffolds of the PSD-95/DLG family and other postsynaptic partners. De novo and inherited
  GRIN2A variants cause an epilepsy-aphasia spectrum, focal epilepsies, developmental delay and intellectual disability,
  and rarer variants confer risk of schizophrenia.
