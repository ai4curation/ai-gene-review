- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Extracellular localization derived from the UniProt "Secreted" subcellular
      location of the short isoform 2 (isoform A), which lacks the transmembrane
      segment and associates with basement membranes.
    action: KEEP_AS_NON_CORE
    reason: Correct but isoform-restricted. The short usherin isoform A is secreted
      and found in basement membranes of many tissues (PMID:12433396), consistent
      with this SL-0243 mapping. The functionally central long isoform b is a
      single-pass transmembrane protein acting at stereocilia ankle links and the
      photoreceptor periciliary membrane, so a bare extracellular-region location is
      not the core picture of the gene product; the basement-membrane pool is kept
      as a secondary, non-core localization.
    supported_by:
    - reference_id: PMID:12433396
      supporting_text: Usherin is a basement membrane protein encoded by the USH2A
        gene.
- term:
    id: GO:0045494
    label: photoreceptor cell maintenance
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: ARBA electronic annotation of the retinal core function; USH2A loss
      causes retinitis pigmentosa, i.e. progressive failure of photoreceptor
      survival, in humans and in mouse models.
    action: ACCEPT
    reason: This matches the human IMP annotation from USH2A patients (PMID:10090909)
      and the well-established requirement of the USH2 complex at the photoreceptor
      periciliary membrane for long-term photoreceptor survival (UniProt FUNCTION,
      by similarity to mouse Q2QI47). Retinal degeneration in USH2A patients
      documents progressive photoreceptor loss (PMID:15671307). Core retinal
      function.
    supported_by:
    - reference_id: PMID:15671307
      supporting_text: USH2C and USH2A manifest photoreceptor disease with rod- and
        cone-mediated visual losses and thinning of the outer nuclear layer.
