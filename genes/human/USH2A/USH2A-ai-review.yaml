- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: TAS
  original_reference_id: PMID:36964137
  review:
    summary: Proposed NEW annotation. No GOA line captures the primary molecular
      activity of the usherin ectodomain, which is structural rather than
      catalytic - it is one of the fibrous components of the ankle links that
      physically interconnect stereocilia at their bases in developing hair
      bundles, and it contributes to the architecture of the photoreceptor
      periciliary membrane as part of the USH2 complex.
    action: NEW
    reason: The existing MF annotations (PDZ domain binding, myosin binding,
      collagen binding) describe how usherin is anchored and trafficked, but not
      what it does - the phenotype-defining activity is formation of extracellular
      structural links. The ankle-link literature explicitly describes USH2A and
      ADGRV1 as the transmembrane adhesion proteins whose ectodomains form the
      extracellular linkages of the ankle-link mesh, a structural contribution to
      the ankle link and USH2 complex that GO:0005198 captures without asserting an
      unassayed adhesion-receptor activity.
    supported_by:
    - reference_id: PMID:36964137
      supporting_text: both USH2A and ADGRV1 are transmembrane adhesion proteins
        that form extracellular linkages
    - reference_id: PMID:36964137
      supporting_text: Ankle links, a mesh of thin fibers connecting stereocilia at
        their basal regions, are indispensable for coordinating stereociliary
        development and thus are essential for hearing
core_functions:
- description: Structural adhesion fiber of the transient ankle links of developing
    hair bundles. The enormous usherin ectodomain (laminin N-terminal, laminin
    EGF-like and laminin G-like domains plus ~35 fibronectin III repeats) extends
    from the stereociliary base membrane and, together with ADGRV1, forms the
    extracellular ankle-link fibers that interconnect stereocilia at their bases
    during hair-bundle development (mouse ~P2-P12), coordinating stereocilia
    organization in differentiating inner-ear hair cells and thereby enabling
    hearing.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0060113
    label: inner ear receptor cell differentiation
  - id: GO:0035315
    label: hair cell differentiation
  - id: GO:0007605
    label: sensory perception of sound
  locations:
  - id: GO:0002141
    label: stereocilia ankle link
  - id: GO:0060171
    label: stereocilium membrane
  in_complex:
    id: GO:0002142
    label: stereocilia ankle link complex
  supported_by:
  - reference_id: PMID:36964137
    supporting_text: Ankle links, a mesh of thin fibers connecting stereocilia at
      their basal regions, are indispensable for coordinating stereociliary
      development and thus are essential for hearing
  - reference_id: PMID:36964137
    supporting_text: both USH2A and ADGRV1 are transmembrane adhesion proteins
      that form extracellular linkages
- description: PDZ-scaffold engagement by the cytoplasmic tail. The short usherin
    cytoplasmic tail ends in a class-I PDZ-binding motif (DTHL) that binds PDZ
    domains of the scaffold proteins whirlin (WHRN, PDZ1/PDZ2) and PDZD7
    (PDZ1/PDZ2); these multivalent PDZ-PBM interactions drive condensation
    (liquid-liquid phase separation) of the quaternary USH2 complex
    (USH2A-ADGRV1-WHRN-PDZD7) and anchor usherin and its partners at the
    stereociliary base membrane of hair cells and the periciliary membrane of
    photoreceptors; binding of MYO7A-family myosins to the cytoplasmic region
    couples the complex to its delivery and anchoring machinery.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  directly_involved_in:
  - id: GO:0072659
    label: protein localization to plasma membrane
  - id: GO:0060113
    label: inner ear receptor cell differentiation
  locations:
  - id: GO:0060171
    label: stereocilium membrane
  - id: GO:1990075
    label: periciliary membrane compartment
  in_complex:
    id: GO:1990696
    label: USH2 complex
  supported_by:
  - reference_id: PMID:20440071
    supporting_text: the first and second PDZ domains of PDZD7 interact with
      USH2A by coimmunoprecipitation studies
  - reference_id: PMID:25406310
    supporting_text: both WHRN and PDZD7 are required for the complex formation
      with USH2A and GPR98. In this USH2 quaternary complex, WHRN prefers to bind
      to USH2A, whereas PDZD7 prefers to bind to GPR98.
  - reference_id: PMID:36964137
    supporting_text: WHRN and PDZD7 orchestrate ADGRV1 and USH2A to assemble the
      ALC through liquid-liquid phase separation (LLPS)
- description: Structural organizer of the photoreceptor periciliary membrane. As
    part of the USH2 complex concentrated in the periciliary membrane compartment
    of the apical inner segment surrounding the connecting cilium, usherin supports
    the architecture of this membrane microdomain at the inner-to-outer segment
    boundary; this activity is required for long-term photoreceptor survival, and
    its loss causes the progressive photoreceptor degeneration (retinitis
    pigmentosa) and visual loss of Usher syndrome type 2A and RP39.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0045494
    label: photoreceptor cell maintenance
  - id: GO:0050953
    label: sensory perception of light stimulus
  locations:
  - id: GO:1990075
    label: periciliary membrane compartment
  - id: GO:0001917
    label: photoreceptor inner segment
  in_complex:
    id: GO:1990696
    label: USH2 complex
  supported_by:
  - reference_id: file:human/USH2A/USH2A-deep-research-falcon.md
    supporting_text: Transmembrane usherin is concentrated around the
      **connecting cilium/periciliary membrane region**, at the boundary between
      the metabolically active inner segment and the photosensitive outer
      segment.
  - reference_id: PMID:15671307
    supporting_text: USH2C and USH2A manifest photoreceptor disease with rod- and
      cone-mediated visual losses and thinning of the outer nuclear layer.
