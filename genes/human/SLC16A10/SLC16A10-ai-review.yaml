- id: PMID:11827462
  title: 'The human T-type amino acid transporter-1: characterization, gene organization,
    and chromosomal location.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Discovery/characterization paper for human TAT1/SLC16A10. Establishes Na+-independent
      transport of the aromatic amino acids tryptophan, tyrosine, phenylalanine and L-dopa in
      Xenopus oocytes, the 515-aa/12-TM topology, and KM values. Abstract-only in cache;
      functional conclusions deferred to the curator-read full text. PubMed-verified.
- id: PMID:15918515
  title: Reabsorption of neutral amino acids mediated by amino acid transporter LAT2
    and TAT1 in the basolateral membrane of proximal tubule.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Immunohistochemistry places LAT2 and TAT1 together in the basolateral membrane of the
      human renal proximal tubule and frames their joint role in basolateral reabsorption of
      neutral/aromatic amino acids. Supports basolateral plasma membrane and the epithelial
      efflux role. PubMed-verified.
- id: PMID:18337592
  title: Effective cellular uptake and efflux of thyroid hormone by human monocarboxylate
    transporter 10.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Demonstrates that hMCT10 facilitates bidirectional (uptake and efflux) transport of T3
      and T4 in COS1 cells, is at least as active as MCT8, and localizes to the plasma
      membrane; T3 uptake is competed by aromatic amino acids. Supports thyroid hormone
      transporter activity and thyroid hormone transport. PubMed-verified.
- id: PMID:21315799
  title: The thyroid hormone transporters MCT8 and MCT10 transport the affinity-label
    N-bromoacetyl-[(125)I]T3 but are not modified by it.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Confirms hMCT10 facilitates transport of the T3 affinity label (without covalent
      modification), corroborating that MCT10 is a genuine thyroid hormone transporter.
      Source of the ARUK-UCL IDA thyroid-hormone annotations. PubMed-verified.
- id: PMID:28754537
  title: Functional analysis of human aromatic amino acid transporter MCT10/TAT1 using
    the yeast Saccharomyces cerevisiae.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Yeast complementation assay establishes the facilitated-diffusion (pH-gradient
      independent) mechanism of MCT10, plasma-membrane localization in HEK293T, and that the
      N81K SNP abolishes tryptophan import without affecting expression/localization,
      identifying N81 as a substrate-pathway residue. PubMed-verified.
