id: Q8TF71
gene_symbol: SLC16A10
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC16A10 encodes MCT10 (monocarboxylate transporter 10), also called TAT1 (T-type
  aromatic amino acid transporter 1), a 12-transmembrane major facilitator superfamily
  protein that catalyses sodium-, proton- and chloride-independent facilitated
  (equilibrative, bidirectional) transport of aromatic amino acids across the plasma
  membrane. Its substrates are the aromatic L-amino acids L-tryptophan, L-tyrosine and
  L-phenylalanine (and L-DOPA), transported with low affinity and in either direction
  according to the substrate gradient; this is the basis of the classical "system T"
  activity. Unlike the proton-coupled lactate transporters MCT1-MCT4 of the same family,
  MCT10 is not a proton symporter. MCT10 is also an efficient facilitative transporter of
  the iodothyronine thyroid hormones T3 and T4, which are aromatic amino acid derivatives,
  and is as active a thyroid hormone transporter as MCT8. In polarized epithelia of the
  renal proximal tubule and intestine it resides in the basolateral membrane, where, acting
  together with the basolateral exchanger LAT2 (SLC7A8) and apical uptake systems such as
  B0AT1 (SLC6A19), it provides the efflux limb that completes transepithelial reabsorption
  of aromatic and neutral amino acids. It is strongly expressed in kidney and skeletal
  muscle.
