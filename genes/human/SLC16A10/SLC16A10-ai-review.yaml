core_functions:
- description: >-
    Sodium-, proton- and chloride-independent facilitated (equilibrative, bidirectional)
    transport of aromatic amino acids (L-tryptophan, L-tyrosine, L-phenylalanine and L-DOPA)
    across the plasma membrane - the classical "system T" activity. In polarized renal and
    intestinal epithelia MCT10 sits in the basolateral membrane and provides the efflux limb
    for transepithelial reabsorption of aromatic amino acids.
