proposed_new_terms: []
suggested_questions:
- question: >-
    Does the GO classification of thyroid hormone transmembrane transporter activity
    (GO:0015349), which sits under active/secondary-active transport, adequately represent
    MCT10's demonstrated facilitative, equilibrative (non-coupled) transport mechanism?
- question: >-
    Are any of the three HuRI binary interactors (FUNDC2, TMEM14B, INSIG2) functionally
    relevant to MCT10 folding, trafficking or activity, or are they screen artifacts?
- question: >-
    What is the physiological consequence of MCT10 loss in humans - does it produce an aromatic
    aminoaciduria or altered peripheral thyroid hormone handling, given its basolateral efflux
    role alongside LAT2?
suggested_experiments:
- description: >-
    Use the recent cryo-EM structures (PDB 9GSZ, 9HHQ) together with substrate docking and
    mutagenesis around N81 to map the shared binding determinants for aromatic amino acids and
    iodothyronines and define the facilitative transport cycle.
- description: >-
    Characterize Slc16a10 knockout mice (and/or human loss-of-function variants) for aromatic
    amino acid handling in intestine/kidney and for tissue thyroid hormone content, to establish
    the in vivo physiological role of basolateral MCT10.
- description: >-
    Electrophysiological/radiotracer flux assays to confirm the absence of ion coupling and to
    quantify bidirectional (efflux vs uptake) selectivity for aromatic amino acids versus T3/T4.
