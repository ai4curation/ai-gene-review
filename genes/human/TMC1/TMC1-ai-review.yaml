gene_symbol: TMC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Polytopic membrane protein of the transmembrane channel-like (TMC) family and the pore-forming
  subunit of the mechanoelectrical transduction (MET) channel at the tips of the shorter-row stereocilia
  of cochlear and vestibular hair cells. TMC1 assembles as a dimer with a TMEM16-like fold and, together
  with the auxiliary subunits TMIE, LHFPL5, CIB2/CIB3 and TOMT and the tip-link protein PCDH15, forms
  the complex that converts hair-bundle deflection into a cation current. The channel is gated by
  mechanical force transmitted through the tip link rather than by membrane voltage, is non-selective
  among cations and is highly permeable to calcium; deafness-causing point mutations in the pore
  region change single-channel conductance, calcium permeability and reversal potential. TMC2 is
  co-expressed transiently in the neonatal cochlea and persistently in vestibular hair cells, which
  is why TMC1 loss in humans causes deafness (DFNA36, DFNB7/11) without vestibular failure while
  loss of both proteins abolishes mechanotransduction entirely. Whether TMC1 additionally performs
  lipid scrambling is unsettled: hair cells require TMC1 or TMC2 for phosphatidylserine externalisation,
  and reconstituted TMC1 translocates phospholipids in a cholesterol-dependent manner, but the distinction
  between an essential permissive role and direct lipid translocation by TMC1 itself has not been
  resolved in peer-reviewed work.'
