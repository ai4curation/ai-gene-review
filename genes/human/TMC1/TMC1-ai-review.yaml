core_functions:
- description: TMC1 is the pore-forming subunit of the mechanoelectrical transduction channel at
    the tips of hair-cell stereocilia. It assembles as a dimer with a TMEM16-like fold, and its S4-S7
    helices line a permeation pathway whose conductance, calcium permeability and reversal potential
    are set by TMC1 residues. The channel is opened by tension delivered through the PCDH15 tip link
    rather than by membrane voltage, and it conducts cations non-selectively with high calcium permeability,
    converting hair-bundle deflection into the receptor current of hearing and balance. The activity
    is recorded as a contribution to a complex-level function because the working channel also requires
    TMIE, LHFPL5, CIB2/CIB3 and TOMT, and because TMC2 can substitute for TMC1 where it is expressed.
  contributes_to_molecular_function:
    id: GO:0140135
    label: mechanosensitive monoatomic cation channel activity
  in_complex:
    id: GO:0034703
    label: cation channel complex
  directly_involved_in:
  - id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  - id: GO:0070588
    label: calcium ion transmembrane transport
  locations:
  - id: GO:0032426
    label: stereocilium tip
  - id: GO:0060171
    label: stereocilium membrane
  supported_by:
  - reference_id: PMID:30138589
    supporting_text: The data provide compelling evidence that TMC1 is a pore-forming component of
      sensory transduction channels in auditory and vestibular hair cells.
  - reference_id: PMID:39674179
    supporting_text: our study provides evidence that human TMC1/2 are pore-forming, mechanically
      activated ion channels, supporting their roles as mechanotransduction channels in hair cells.
  - reference_id: PMID:22105175
    supporting_text: Tmc1(Δ)Tmc2(Δ) mice had profound vestibular dysfunction, deafness, and structurally
      normal hair cells that lacked all mechanotransduction activity
  - reference_id: PMID:23871232
    supporting_text: The data demonstrate TMC1 and TMC2 are components of hair cell transduction
      channels and contribute to permeation properties.
proposed_new_terms:
- proposed_name: mechanoelectrical transduction channel complex
  proposed_definition: A cation channel complex located at the tip of a hair-cell stereocilium that
    opens in response to tension applied through the tip link, composed of pore-forming transmembrane
    channel-like subunits together with auxiliary subunits.
  justification: There is no cellular-component term for the hair-cell MET complex. The nearest available
    term is GO:0034703 cation channel complex, which does not distinguish this assembly from any
    other cation channel. The complex has a defined and conserved composition (TMC1 or TMC2, TMIE,
    LHFPL5, CIB2 or CIB3, with TOMT required for trafficking and PCDH15 forming the tip link), and
    its subunits are individually annotated in GOA without a shared complex term to attach them to.
  proposed_parent:
    id: GO:0034703
    label: cation channel complex
suggested_questions:
- question: 'Is TMC1 itself a lipid scramblase, or only necessary for scrambling that another protein
    performs? The peer-reviewed hair-cell genetics establishes necessity but the authors explicitly
    leave the mechanism open, and the only direct translocation assay is in a preprint. Two distinguishing
    experiments are already implied by the published work: does a TMC1 pore mutant that preserves
    ion conduction abolish scrambling (and vice versa), and does the correlation between FM1-43 permeation
    and PS externalisation survive separation of the two pathways?'
- question: Should channel activity and scramblase activity be annotated as one dual-function protein,
    as they now are for TMEM63B, or should TMC1 be handled differently? The TMEM16 and TMEM63/OSCA
    precedents both allow a single groove to pass ions and lipids with separate bottleneck residues,
    so a dual annotation is not inherently contradictory - what is missing for TMC1 is replication
    of the direct assay outside one laboratory and outside a preprint.
- question: Is phosphatidylserine externalisation in hair cells a physiological process or a pathological
    one? It is triggered by blocking transduction and by deafness alleles, which suggests it reports
    hair-cell distress rather than normal function; if so, GO:0017121 on TMC1 describes a disease
    mechanism rather than a normal biological role.
- question: The human GOA carries GO:0009897 external side of plasma membrane by orthology from a
    mouse IDA. For a ten-transmembrane protein with cytoplasmic termini, what observation does that
    annotation encode, and is it distinguishable from detection of an extracellular loop epitope?
suggested_experiments:
- description: Purify human TMC1 with TMIE and CIB2, reconstitute into proteoliposomes of defined
    cholesterol content, and measure ion conduction and phospholipid translocation on the same preparation,
    in a laboratory independent of the group that reported the preprint result. A dual measurement
    on one preparation is what distinguishes genuine dual function from an assay-specific artefact.
- description: Engineer TMC1 pore mutations that separate the two activities - a conduction-dead
    but scrambling-competent mutant and its converse - and knock them into mice, following the strategy
    that resolved the equivalent question for TMEM63B disease variants. If no such separation can
    be engineered, that is itself informative about a shared pathway.
- description: Record from plasma-membrane-localised human TMC1 in the CRISPRi-modified heterologous
    system while simultaneously imaging annexin-V binding, to test whether scrambling accompanies
    mechanical gating in a cell that contains no other hair-cell-specific machinery.
- description: Test whether TMC1-dependent PS externalisation occurs in unstressed hair cells in
    vivo at physiological sound levels, rather than only after pharmacological block or in deafness-allele
    carriers, to decide whether the process is physiological or pathological.
