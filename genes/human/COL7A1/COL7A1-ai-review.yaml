  qualifier: enables
  review:
    summary: Human collagen VII directly binds reconstituted collagen I fibrils.
    action: NEW
    reason: Recombinant human full-length 2,944-aa COL7A1 and an NC1-containing mini-collagen
      bound embryonic-chicken collagen I fibrils in dose-dependent assays; a shortened
      NC1 construct lacking the relevant von Willebrand A segment did not. Selective
      tag-transfer cross-linking corroborates binding. Separate purified human NC1
      assays support collagen IV binding. Current typed ancestry of collagen binding
      does not include GO:0005515 and its ancestors/descendants overlap no retained
      source term; neither collagen-V-specific binding nor the cell-matrix-adhesion-specific
      child is established by these matrix-to-matrix assays. This adds an observed
      MF within the structural account, not a new process, receptor claim, native
      cross-link chemistry or equal activity of both splice products.
