  review:
    summary: The Kunitz-like region does not establish the transferred protease-inhibitor activity.
    action: REMOVE
    reason: 'Both cited InterPro entries genuinely carry the inhibitor mapping, but original human
      NC2/COL experiments contradict that transfer: the recombinant segment did not inhibit trypsin
      or chymotrypsin at the tested excesses, whereas aprotinin protected the substrate. Collagenase-isolated
      NC2 was also reported inactive, and thrombin/plasmin negatives were reported without displayed
      data. Remove this automatic activity inference without adding a universal NOT assertion or
      claiming that every protease, processed form or splice product was tested. The same region
      has positive assembly evidence.'
