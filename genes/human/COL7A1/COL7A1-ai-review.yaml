id: Q02388
gene_symbol: COL7A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL7A1 encodes the alpha1 chain of collagen VII, the principal structural protein of
  anchoring fibrils at epithelial basement membranes. Three alpha1(VII) chains form a long interrupted
  triple helix flanked by NC1 and NC2 regions. NC1 binds matrix ligands, including fibrillar collagen
  I, collagen IV and laminin 332; C-terminal interactions organize antiparallel assemblies that mature
  into anchoring fibrils linking the basement membrane to underlying connective tissue. Human skin
  and reconstituted matrix experiments support this mechanical attachment function. Pathogenic variants
  cause dystrophic epidermolysis bullosa, with fragile dermal–epidermal adhesion. The two annotated
  splice products differ by a 32-residue segment in the collagenous region; their individual assembly
  and binding properties have not been comprehensively compared.
alternative_products:
- name: '1'
  id: Q02388-1
  description: Displayed 2,944-residue product. Recombinant full-length human evidence explicitly
    uses this length; domain-fragment experiments have their own construct scope.
- name: '2'
  id: Q02388-2
  sequence_note: VSP_024026
  description: 2,912-residue product with the exact VSP_024026 deletion of displayed residues 1869–1900.
    NC1 and NC2 regions remain, but equal assembly, binding or tissue deposition has not been established
    by the inspected experiments.
