suggested_questions:
- question: How does the 32-residue collagenous deletion alter collagen VII assembly, fibril attachment
    and tissue distribution compared with the displayed product?
- question: What chemical interactions account for the exceptional stability of native collagen VII–banded-fibril
    connections?
- question: Does a defined endogenous NC2 processing state inhibit a protease not addressed by the
    original negative assays, or is its principal role structural?
- question: Which steps of collagen VII trafficking depend directly on the complete MIA3 MOTH region,
    and how do those contacts change during cargo release?
suggested_experiments:
- description: Compare both sequence-verified human products in matched secretion, matrix-binding
    and anchoring-fibril reconstitution assays, with product-specific peptides.
  hypothesis: The central deletion alters assembly or mechanical attachment without necessarily removing
    the conserved NC1/NC2 interactions.
- description: Analyze purified native collagen VII–collagen I complexes by sensitive cross-link
    mass spectrometry and selective bond-cleavage controls.
  hypothesis: Specific covalent or unusually stable noncovalent contacts explain the resistance observed
    in human skin extracts.
status: DRAFT
