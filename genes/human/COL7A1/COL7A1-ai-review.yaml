- description: Collagen VII supplies homotrimeric structural units of anchoring fibrils that link
    epithelial basement membranes to underlying connective tissue. NC1 matrix contacts and C-terminal
    antiparallel assembly produce a mechanically stabilizing extracellular connection. Human full-length
    binding and domain-assembly experiments establish complementary parts of this mechanism; individual
    splice-product behavior remains incompletely resolved.
