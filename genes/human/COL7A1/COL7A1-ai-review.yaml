core_functions:
- description: Collagen VII supplies homotrimeric structural units of anchoring fibrils
    that link epithelial basement membranes to underlying connective tissue. NC1-mediated
    collagen binding and C-terminal antiparallel assembly are complementary parts
    of this mechanically stabilizing extracellular connection. Recombinant human full-length
    and NC1-containing constructs bind collagen I fibrils, while purified NC1 also
    binds collagen IV; these matrix contacts anchor the structural assembly. Individual
    splice-product behavior remains incompletely resolved.
