      transport; supports membership and transporter activity but not a specific MF
      beyond the general term.
- id: PMID:19129463
  title: Mechanisms of pH-gradient driven transport mediated by organic anion polypeptide
    transporters.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (abstract). Establishes that OATPs/Oatps act as anion exchangers,
      that low extracellular pH stimulates transport (higher substrate affinity), and
      that transport is accompanied by bicarbonate efflux. Primary support for the
      secondary-active anion-exchange mechanism and pH sensitivity.
- id: PMID:20358049
  title: Transport of thyroid hormones is selectively inhibited by 3-iodothyronamine.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Directly demonstrates OATP1A2-mediated T3 and T4 transport
      (selectively inhibited by 3-iodothyronamine); experimental basis, with the curated
      UniProt Rhea catalytic activities, for the proposed thyroid hormone transmembrane
      transporter activity (GO:0015349).
- id: PMID:25132355
  title: 'Differential cellular expression of organic anion transporting peptides
    OATP1A2 and OATP2B1 in the human retina and brain: implications for carrier-mediated
    transport of neuropeptides and neurosteriods in the CNS.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (abstract). Localizes OATP1A2 to retinal and brain neurons and
      identifies substance P and vasoactive intestinal peptide as OATP1A2 substrates.
      Supports plasma-membrane localization and polyspecific (neuropeptide) transport.
- id: PMID:35307651
  title: Localization of Xenobiotic Transporters Expressed at the Human Blood-Testis
    Barrier.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text verified. Immunohistology localizes OATP1A2 to the basal membrane of
      human Sertoli cells, supporting a basal (blood-testis barrier) uptake role; the
      basal localization is the direct basis for the basal plasma membrane IDA.
