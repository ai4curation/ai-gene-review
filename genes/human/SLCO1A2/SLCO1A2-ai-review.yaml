proposed_new_terms: []
suggested_questions:
- question: >-
    GO obsoleted the grouping terms 'sodium-independent organic anion transmembrane
    transporter activity' (GO:0015347) and 'organic anion transmembrane transporter
    activity' (GO:0008514) as unnecessary/confusing. For polyspecific OATPs such as
    OATP1A2 there is now no single MF term capturing sodium-independent amphipathic
    organic-anion uptake. Should a curation convention (e.g. combining bile-acid,
    secondary-active and substrate-specific terms) or a new grouping term be adopted?
- question: >-
    OATP1A2 has a C-terminal PDZ-binding motif that binds many PDZ-domain scaffolds
    (DLG1-4, MPDZ, PATJ, SCRIB, PDZK1, MAGI1/2, GRIP1/2, etc.). Would a specific
    molecular-function/adaptor annotation (PDZ-mediated membrane targeting/retention) be
    warranted over bare protein binding, and which interactions are functionally
    load-bearing for OATP1A2 surface localization and polarity?
suggested_experiments:
- description: >-
    Reconstitute purified OATP1A2 in proteoliposomes with defined internal/external anion
    composition to directly test obligatory bicarbonate (or glutathione/steroid-conjugate)
    counter-exchange and quantify the coupling stoichiometry and pH dependence.
- description: >-
    Use polarized epithelial models (e.g. MDCK, Caco-2) and tissue-specific knock-in
    reporters to map what determines OATP1A2 apical vs basal targeting, and test which
    C-terminal PDZ interactions control its surface delivery and membrane polarity.
- description: >-
    Quantify the physiological contribution of OATP1A2 to thyroid hormone and neurosteroid
    uptake at the blood-brain barrier and in neurons (e.g. isoform-specific knockdown with
    T3/T4 and DHEAS flux measurements) to establish its in vivo role beyond in vitro
    substrate capability.
