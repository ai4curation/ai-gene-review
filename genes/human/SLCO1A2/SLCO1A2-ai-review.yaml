core_functions:
- description: >-
    Sodium-independent uptake transport of bile salts across the plasma membrane. OATP1A2
    mediates cellular influx of unconjugated (cholate, deoxycholate) and conjugated
    (taurocholate, glycocholate, taurochenodeoxycholate, tauroursodeoxycholate) bile acids,
    contributing to intestinal bile-acid absorption and enterohepatic recycling.
