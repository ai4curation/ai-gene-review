id: P46721
gene_symbol: SLCO1A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLCO1A2 encodes OATP1A2 (OATP-A), a 12-transmembrane plasma-membrane member of the
  organic anion transporting polypeptide (OATP/SLCO) family. It is a sodium-independent,
  polyspecific uptake transporter that mediates cellular influx of a broad range of
  amphipathic organic anions. Transport is not coupled to Na+ and is not proton symport;
  rather OATP1A2 behaves as an electroneutral anion exchanger, with bicarbonate acting as
  the probable intracellular counter-anion, and its activity is pH-sensitive (stimulated
  at low extracellular pH via a conserved TM3 histidine). Characterised endogenous
  substrates include conjugated and unconjugated bile salts (taurocholate, cholate,
  glycocholate, taurochenodeoxycholate), steroid conjugates (dehydroepiandrosterone
  3-sulfate, estrone 3-sulfate, 17beta-estradiol 17-O-glucuronide), thyroid hormones
  (T3 and T4), prostaglandin E2, all-trans-retinol, bilirubin, and the neuropeptides
  substance P and vasoactive intestinal peptide; it also transports many drugs and
  xenobiotics (fexofenadine, methotrexate, paclitaxel, statins, ouabain, fluoroquinolones).
  The protein is expressed in brain neurons, retina, intestine, cholangiocytes, kidney and
  testis, and shows tissue-dependent membrane polarization (apical/luminal in enterocyte
  brush border and blood-brain barrier endothelium; basal in Sertoli cells of the
  blood-testis barrier), consistent with roles in intestinal bile-acid absorption,
  barrier transport of organic anions and signalling molecules, and drug disposition.
