- term:
    id: GO:0006805
    label: xenobiotic metabolic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9748784
  qualifier: involved_in
  review:
    summary: >-
      OATP1A2 participates in drug/xenobiotic handling (Drug ADME) by transporting drugs
      into cells. Its role is uptake transport, not metabolism, so the accurate term is
      xenobiotic transmembrane transport.
    action: MODIFY
    reason: >-
      OATP1A2 performs transmembrane transport of xenobiotic drugs (e.g. methotrexate,
      fexofenadine, statins, fluoroquinolones); it does not chemically metabolize them.
      This is a lateral reclassification from the metabolic-process term to the transport
      term supported by this row's own evidence (drug ADME/transport). GO:0006855 is not a
      descendant of GO:0006805, so this is a correction, not a refinement.
    proposed_replacement_terms:
    - id: GO:0006855
      label: xenobiotic transmembrane transport
    supported_by:
    - reference_id: UniProtKB:P46721
      supporting_text: Involved in the uptake of clinically used drugs
      record_section:
      - CC:FUNCTION
