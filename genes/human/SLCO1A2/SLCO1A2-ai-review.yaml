  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002261135
  - RGD:620228
  - RGD:70985
  - UniProtKB:O94956
  - UniProtKB:Q9NYB5
  review:
    summary: >-
      OATPs mediate polyspecific uptake as electroneutral anion exchangers, exchanging
      organic anions for intracellular bicarbonate; this antiport (uphill substrate
      transport coupled to the counter-anion gradient) is captured by secondary active
      transmembrane transporter activity. Core molecular function (mechanism).
    action: ACCEPT
    reason: >-
      Mechanistically supported core MF. UniProt and PMID:19129463 establish bicarbonate
      counter-exchange and pH-stimulated transport; GO places this transport class under
      secondary active transporter activity.
    supported_by:
    - reference_id: UniProtKB:P46721
