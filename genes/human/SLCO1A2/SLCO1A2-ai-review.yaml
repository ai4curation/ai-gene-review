    supporting_text: Na(+)-independent transporter that mediates the cellular uptake of a broad range of organic anions such as the endogenous bile salts cholate and deoxycholate, either in their unconjugated or conjugated forms (taurocholate and glycocholate)
    record_section:
    - CC:FUNCTION
- description: >-
    Polyspecific, sodium-independent uptake of amphipathic organic anions by electroneutral
    anion exchange. OATP1A2 exchanges organic anions for intracellular bicarbonate and is
    stimulated at low extracellular pH (via a conserved TM3 histidine, His-107). Substrates
    include steroid conjugates (DHEAS, estrone 3-sulfate, 17beta-estradiol 17-glucuronide),
    thyroid hormones (T3, T4), prostaglandin E2, all-trans-retinol, neuropeptides (substance
    P, VIP) and numerous drugs/xenobiotics, underpinning barrier transport of organic anions
    and drug disposition.
