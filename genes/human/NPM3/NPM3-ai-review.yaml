gene_symbol: NPM3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NPM3 (nucleoplasmin 3) is a small, acidic, ubiquitously expressed member of the nucleoplasmin/nucleophosmin
  family of nuclear chaperones. It is mainly in the granular component of the nucleolus and in the nucleoplasm.
  NPM3 binds the N-terminal oligomerisation domain of NPM1/B23 to form hetero-oligomers (pentamers with
  a 4:1 NPM3:NPM1 ratio, which assemble into decamers). On its own, NPM3 binds core histones but has little
  histone chaperone activity. In the NPM1-NPM3 complex its C-terminal region acts as a histone chaperone
  that supports nucleosome assembly and sperm chromatin decondensation. NPM3 also damps NPM1's RNA binding
  and modulates ribosome biogenesis. In the DNA damage response, NPM3 binds RUVBL1 directly and promotes
  assembly of the RUVBL1-TIP60 complex, histone H4K16 acetylation and homologous recombination repair.
  The E3 ligase DTX3 counteracts this by K27-linked ubiquitination and proteasomal degradation of NPM3.
