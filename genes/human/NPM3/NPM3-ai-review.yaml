- term:
    id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:42958702
  qualifier: involved_in
  review:
    summary: Proposed from the literature-scan paper. In HK1 cells, NPM3 knockdown reduced HR reporter
      activity without changing NHEJ, and NPM3 overexpression restored HR in DTX3-overexpressing cells.
    action: NEW
    reason: 'This is a regulation term, and NPM3 meets it through a direct mechanism, not an indirect
      phenotype. NPM3 binds RUVBL1 directly (GST pull-down) and promotes RUVBL1-TIP60 complex assembly
      and H4K16 acetylation. That acetylation limits 53BP1 accumulation at DSBs and favours HR, and NPM3
      overexpression rescues HR in DTX3-overexpressing cells. The pathway specificity is internally controlled:
      HR changes but NHEJ does not. The paper is one study in cancer cell lines, so the row is non-core,
      but it is NPM3''s first experimental process annotation in DNA repair. Comparator: GO:1905168 is
      in wide use (106 human annotations in QuickGO, 2026-11-26) for regulators of HR that act through
      chromatin.'
    supported_by:
    - reference_id: PMID:42958702
      supporting_text: HRR efficiency was significantly reduced by NPM3 knockdown, whereas NHEJ activity
        was unaffected
    - reference_id: PMID:42958702
      supporting_text: A GST pull‐down assay further demonstrated a direct NPM3–RUVBL1 interaction (Figure
        S8C).
    - reference_id: PMID:42958702
      supporting_text: Collectively, these findings indicated that NPM3 promotes HRR and contributes to
        tumor cell radioresistance.
