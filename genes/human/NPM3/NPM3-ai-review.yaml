    relevance: HIGH
    correctness: VERIFIED
    review_notes: Literature-scan lead (issue 7141). Full text read. The paper is about DTX3, but it contains
      direct experiments on NPM3 in HK1 nasopharyngeal carcinoma cells. These include NPM3 knockdown reducing
      HRR (DR-GFP reporter) but not NHEJ, endogenous and exogenous co-IP and GST pull-down showing direct
      NPM3-RUVBL1 binding, NPM3 promoting RUVBL1-TIP60 assembly and H4K16Ac, and NPM3 overexpression restoring
      HRR in DTX3-overexpressing cells. It supports a NEW positive regulation of DSB repair via HR (IMP).
      The DTX3 ubiquitination of NPM3 Lys102 describes NPM3 as a substrate and is not annotated on NPM3.
