suggested_questions:
- question: Does NPM3 act as a chaperone that assembles RUVBL1-TIP60 (a protein-macromolecule adaptor),
    or does it stabilise the complex on chromatin? Does it do this alone or as part of an NPM1-NPM3 oligomer?
suggested_experiments:
- description: Reconstitute RUVBL1-TIP60 assembly in vitro with purified NPM3, NPM1-NPM3 and an NPM3 mutant
    that cannot bind NPM1. In cells, map the RUVBL1-binding region and test whether a non-binding NPM3
    mutant fails to rescue HR (DR-GFP) after NPM3 knockdown.
  experiment_type: in vitro complex reconstitution and HR reporter rescue
