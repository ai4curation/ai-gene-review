id: Q9NXH9
gene_symbol: TRMT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TRMT1 is the human tRNA guanine(26)-N2 dimethyltransferase. Alternative isoforms
  occupy mitochondrial and nucleo-cytoplasmic pools, where the enzyme uses
  S-adenosyl-L-methionine to install N2,N2-dimethylguanosine at position 26 of
  mitochondrial-encoded and nuclear-encoded tRNAs. TRMT1-dependent m2,2G26
  formation supports tRNA stability, translation, proliferation and oxidative-stress
  survival, and loss-of-function TRMT1 variants disrupt tRNA modification in cells
  from patients with autosomal-recessive intellectual disability.
