suggested_questions:
- question: >-
    Does full-length human AADAC directly hydrolyze diacylglycerol, and what are its
    preferred DAG molecular species and kinetic parameters relative to triacylglycerol,
    cholesteryl ester, and small-acyl xenobiotic substrates?
- question: >-
    How do xenobiotics and membrane lipids reach the lumen-facing AADAC catalytic region:
    by passive partitioning, intramembrane access, lipid translocation, or a dedicated ER
    transport mechanism?
- question: >-
    In native human liver and intestine, how much does AADAC contribute to DAG and
    triacylglycerol flux, lipid-droplet mobilization, and VLDL production across
    nutritional and disease states relative to other ER hydrolases?
- question: >-
    Are cholesterol acetate, N-acetylserotonin, melatonin, or N-acetyltryptamine
    physiologically important AADAC substrates in human tissues at endogenous
    concentrations, or only context-specific in-vitro substrates?
suggested_experiments:
- hypothesis: >-
    Human AADAC directly hydrolyzes a restricted set of diacylglycerol molecular species
    through its serine-hydrolase active site.
  description: >-
    Purify full-length human AADAC and reconstitute it in oriented ER-like proteoliposomes.
    Compare wild-type protein with a catalytic-serine mutant across a panel of defined DAG
    species, triacylglycerols, cholesteryl esters, and established small-acyl drug
    substrates; quantify monoacylglycerol and fatty-acid products by targeted mass
    spectrometry and determine kinetic parameters.
  experiment_type: oriented-membrane recombinant enzymology and lipidomics
- hypothesis: >-
    AADAC catalytic activity makes a measurable, tissue-dependent contribution to human
    hepatic and intestinal neutral-lipid flux and VLDL assembly.
  description: >-
    Perform AADAC knockout or CRISPRi followed by wild-type versus catalytic-dead rescue in
    primary human hepatocytes and intestinal organoids. Use stable-isotope tracing and
    quantitative lipidomics to measure DAG, triacylglycerol, monoacylglycerol, lipid-droplet
    turnover, and secreted lipoproteins, with CES2 perturbation as a pathway-specific
    comparator.
  experiment_type: human-cell genetic rescue and stable-isotope lipid flux analysis
- hypothesis: >-
    Substrate access to AADAC depends on presentation to the ER-lumenal face rather than
    unrestricted exposure from the cytosol.
  description: >-
    Use sealed microsomes or oriented proteoliposomes with independently verified AADAC
    topology, selectively deliver membrane-permeant and membrane-impermeant substrate
    analogs to either face, and combine protease protection with transport or lipid-flip
    inhibition to distinguish passive partitioning from carrier-dependent access.
  experiment_type: sided ER-membrane substrate-access assay
- hypothesis: >-
    The reported sterol-acetate and pineal-indole reactions contribute measurable flux in
    only selected human tissues or physiological states.
  description: >-
    In human hepatic, intestinal, and pineal-relevant cell models with verified endogenous
    AADAC, use knockout and wild-type versus catalytic-dead rescue together with
    isotope-labeled cholesterol acetate, N-acetylserotonin, melatonin, and
    N-acetyltryptamine at physiological concentrations. Quantify substrate-product flux and
    compare it with established xenobiotic deacetylation controls.
  experiment_type: tissue-context genetic rescue and targeted metabolite tracing
