  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text verified. Human AADAC was assayed by complementation in S. cerevisiae,
      not in a native human sterol pathway. This supports cholesterol-acetate hydrolase
      capacity but only weakly supports a physiological human sterol-metabolic role.
