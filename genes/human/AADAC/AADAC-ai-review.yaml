      rescues the sterol acetate accumulation phenotype of say1 Δ-mutant cells indicates
      that the human aryl acetamide deacetylase acts on cholesterol acetate and thus has
      overlapping substrate specificity with Say1 in vivo , even though the enzyme has
      been identified as an N -deacetylase based on its in vitro activity against aryl
      acetamide ( Probst et al , 1994 ).
    reference_section_type: DISCUSSION
  - statement: >-
      The study did not establish the corresponding sterol-acetylation pathway in human
      cells.
    supporting_text: >-
      Incubation of HepG2 hepatoma cells with radiolabeled pregnenolone, however, did not
      reveal any conversion to pregnenolone acetate or export of modified pregnenolone
      into the culture media, indicating that the substrate specificity of a putative
      lipid acetylase, if present in mammals, is different from that of yeast cells (data
      not shown).
