id: P22760
gene_symbol: AADAC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AADAC is a single-pass type II endoplasmic-reticulum membrane serine
  hydrolase/deacetylase expressed most strongly in liver and gastrointestinal
  tissues. Its lumen-facing catalytic region hydrolyzes small acyl groups from
  structurally diverse amide and ester xenobiotics, thereby altering drug activation,
  exposure, and toxicity in a substrate-dependent manner. AADAC also contributes to
  ER-associated neutral-lipid mobilization: ortholog experiments directly support
  hydrolysis of endogenous diacylglycerol, whereas human-cell perturbations establish
  effects on lipid storage and lipoprotein production without yet defining the direct
  human lipid substrate. Cholesteryl-acetate and pineal-indole hydrolysis are
  experimentally supported context-specific activities whose physiological importance
  in humans remains unresolved.
existing_annotations:
- term:
    id: GO:0046340
    label: diacylglycerol catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915008
  - PANTHER:PTN002745055
  review:
    summary: >-
      AADAC-family evidence supports hydrolysis of endogenously synthesized
      diacylglycerol and therefore a direct role in diacylglycerol catabolism. The
      exact biochemical evidence is strongest for mouse Aadac expressed in rat
      hepatoma cells; human AADAC has complementary cellular evidence for hepatic
      neutral-lipid lipolysis.
    action: ACCEPT
    reason: >-
      The mouse ortholog is an appropriate close donor and was reported to hydrolyze
      endogenously synthesized diacylglycerol (PMID:19654421). Human AADAC knockdown
      and re-expression alter cellular triacylglycerol lipolysis (PMID:23542347),
      supporting conservation while leaving purified-human substrate kinetics as an
      evidence gap.
    additional_reference_ids:
    - PMID:19654421
    - PMID:23542347
    supported_by:
    - reference_id: PMID:19654421
      supporting_text: >-
        Although AADA shares similarity with HSL and like HSL showed hydrolytic activity
        toward endogenously synthesized DG, we did not observe any in vitro activity of
        AADA toward membrane-associated TG or CE.
    - reference_id: PMID:23542347
      supporting_text: >-
        The re-introduction of AADAC to infected cells restored cellular TG lipolysis,
        indicating a role for HCV-mediated downregulation of AADAC in this process.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1915008
        source_label: mouse Aadac
        source_status: SUPPORTS_TRANSFER
        comment: Close ortholog with experimental diacylglycerol-hydrolysis evidence.
      - source_id: PANTHER:PTN002745055
        source_label: AADAC family tree node
        source_status: SUPPORTS_TRANSFER
        comment: Phylogenetic node connecting the experimentally supported mouse and human proteins.
- term:
    id: GO:0120516
    label: diacylglycerol lipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1915008
  - PANTHER:PTN002745055
  review:
    summary: >-
      Phylogenetic inference of diacylglycerol lipase activity is consistent with
      experimental hydrolysis of endogenously synthesized diacylglycerol by mouse Aadac
      and AADAC-dependent neutral-lipid lipolysis in human hepatoma cells.
    action: ACCEPT
    reason: >-
      The term captures the best-resolved endogenous lipid substrate reported for the
      ortholog. Evidence for the exact reaction is direct in the mouse-ortholog cell
      system (PMID:19654421), whereas the human data are cellular rather than a purified
      human enzyme assay (PMID:23542347); that boundary is retained rather than treated
      as evidence against a conservative IBA transfer.
    additional_reference_ids:
    - PMID:19654421
    - PMID:23542347
    supported_by:
    - reference_id: PMID:19654421
      supporting_text: >-
        Based on our findings, we propose a model where AADA hydrolyzes DG synthesized
        within the ER compartment.
    - reference_id: PMID:23542347
      supporting_text: >-
        Defective lipolysis of cellular TG stores and VLDL production were also observed
        in HuH7.5 cells stably expressing a short hairpin RNA targeting AADAC expression,
        proving AADAC deficiency contributes to these defective pathways.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1915008
        source_label: mouse Aadac
        source_status: SUPPORTS_TRANSFER
        comment: Close ortholog with experimental endogenous diacylglycerol-hydrolysis evidence.
      - source_id: PANTHER:PTN002745055
        source_label: AADAC family tree node
        source_status: SUPPORTS_TRANSFER
        comment: The family placement supports transfer to human AADAC.
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1915008
  - PANTHER:PTN002745055
  - UniProtKB:P22760
  review:
    summary: >-
      AADAC is a single-pass type II endoplasmic-reticulum membrane enzyme whose
      catalytic domain faces the lumen. The IBA localization agrees with independent
      human microsomal and endoplasmic-reticulum evidence.
    action: ACCEPT
    reason: >-
      Human recombinant and tissue-fractionation work places AADAC in the endoplasmic
      reticulum and finds activity in liver microsomes rather than cytosol
      (PMID:19339378). The mouse ortholog therefore supports, rather than drives, an
      otherwise well-established human localization.
    additional_reference_ids:
    - PMID:19339378
    supported_by:
    - reference_id: PMID:19339378
      supporting_text: >-
        AADAC is specifically expressed in the endoplasmic reticulum. Flutamide hydrolase
        activity was highly detected in human liver microsomes (K(m), 794 +/- 83 microM;
        V(max), 1.1 +/- 0.0 nmol/min/mg protein), whereas the activity was extremely low
        in human liver cytosol.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1915008
        source_label: mouse Aadac
        source_status: SUPPORTS_TRANSFER
      - source_id: PANTHER:PTN002745055
        source_label: AADAC family tree node
        source_status: SUPPORTS_TRANSFER
      - source_id: UniProtKB:P22760
        source_label: human AADAC recipient
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Self-reference: the target is its own IBD seed, which is expected rather
          than circular -- its own IDA/TAS annotation to this term is one of the
          descendant evidences behind the IBD. The IBA then asserts the additional
