- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:15219944
  qualifier: involved_in
  review:
    summary: >-
      Ectopic overexpression of AIE-75/harmonin in SW480 colorectal cancer cells
      (which do not express it) suppressed growth via G2/M arrest with mitotic
      slippage; PP2A catalytic subunits bound its PDZ domains in yeast two-hybrid.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The assay is forced overexpression in a heterologous cancer cell line that
      normally lacks the protein; an arrest phenotype under overexpression does not
      establish that wild-type harmonin functions in the G2/M transition in any
      physiological context. The annotation also inverts the observation (expression
      induced arrest, i.e. blocked transition, rather than harmonin being a
      participant in the transition). No corroborating cell-cycle role for harmonin
      exists in two decades of subsequent literature, which uniformly characterizes
      it as an adhesion/cytoskeleton scaffold. The cached record for PMID:15219944
      is abstract-only (full text not available), so per curation policy the
      experimental IMP is not removed outright; it is marked as an over-annotation
      arising from a non-physiological overexpression experiment.
    supported_by:
    - reference_id: PMID:15219944
      supporting_text: Expression of AIE-75 suppressed growth of SW480 cells in vitro in correlation with the expression levels. It was due mainly to G2/M phase cell cycle arrest associated with mitotic slippage, resulting in emergence of hyperploid giant-nucleated or multi-nucleated cells.
