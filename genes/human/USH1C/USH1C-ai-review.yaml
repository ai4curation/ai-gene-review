- id: PMID:10209257
  title: Isoforms of the human PDZ-73 protein exhibit differential tissue expression.
  findings:
  - statement: Anti-PDZ-73 (harmonin) antibodies show strong cytoplasmic and prominently
      apical staining in small intestinal epithelium; multiple isoforms with differential
      tissue expression were defined.
    supporting_text: Immunohistochemical staining with anti-PDZ 73 monoclonal antibodies
      showed strong cytoplasmic reactivity in epithelial cells of the small intestine,
      colon and kidney tubules, with a prominent apical staining pattern in cells
      of the small intestine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; pre-Usher-era characterization of harmonin
      (as PDZ-73/AIE-75) establishing isoform diversity and apical epithelial localization.
- id: PMID:10973247
  title: A defect in harmonin, a PDZ domain-containing protein expressed in the inner
    ear sensory hair cells, underlies Usher syndrome type 1C.
  findings:
  - statement: USH1C encodes harmonin; patient mutations cause USH1 (deafness, vestibular
      dysfunction, retinitis pigmentosa), and in the mouse inner ear harmonin is expressed
      specifically in sensory hair cells.
    supporting_text: We showed that, in the mouse inner ear, only the sensory hair
      cells express harmonin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Gene-discovery paper for USH1C; abstract-only cache but the abstract
      itself states the key claims used here.
- id: PMID:11311560
  title: Interaction of MCC2, a novel homologue of MCC tumor suppressor, with PDZ-domain
    Protein AIE-75.
  findings:
  - statement: MCC2 binds the first PDZ domain of AIE-75/harmonin via its C-terminal
      -DTFL motif (yeast two-hybrid).
    supporting_text: MCC2 protein binds the first PDZ domain of AIE-75 with its C-terminal
      amino acids -DTFL.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Direct PDZ1-ligand mapping, but the physiological relevance of the
      MCC2 interaction was never established in later literature.
- id: PMID:11398101
  title: Mutations of the protocadherin gene PCDH15 cause Usher syndrome type 1F.
  findings:
  - statement: Reports PCDH15 mutations in USH1F families; USH1C is mentioned only
      as background in the introduction listing identified USH1 genes.
    supporting_text: 'Genes for three of these loci have been identified: Usher syndrome
      type 1B ( USH1B [MIM 276903 ]; Weil et al. 1995 ), Usher syndrome type 1C (
      USH1C [MIM 276904 ]; Bitner-Glindzicz et al. 2000 ; Verpy et al. 2000 )'
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Full text available and concerns PCDH15/USH1F; it contains no experimental
      data on USH1C, so the three USH1C IMP annotations citing it appear to carry
      a misassigned reference. The corresponding GO terms are nonetheless correct
      for USH1C on the basis of the USH1C patient phenotype (PMID:10973247), so the
      annotations were accepted with the citation issue flagged here.
- id: PMID:15219944
  title: Expression of AIE-75 PDZ-domain protein induces G2/M cell cycle arrest in
    human colorectal adenocarcinoma SW480 cells.
  findings:
  - statement: Ectopic overexpression of AIE-75/harmonin in SW480 cells suppresses
      growth via G2/M arrest with mitotic slippage; PP2A catalytic subunits bind its
      PDZ domains in yeast two-hybrid.
    supporting_text: Expression of AIE-75 suppressed growth of SW480 cells in vitro
      in correlation with the expression levels. It was due mainly to G2/M phase cell
      cycle arrest associated with mitotic slippage
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: Heterologous overexpression in a cancer cell line lacking endogenous
      harmonin; not evidence of physiological cell-cycle function, and never corroborated.
      Basis for the REMOVE recommendation on GO:0000086.
- id: PMID:16464467
  title: An isoform of GTPase regulator DOCK4 localizes to the stereocilia in the
    inner ear and binds to harmonin (USH1C).
  findings:
  - statement: DOCK4-Ex49, a Rac GEF isoform present along stereocilia, binds harmonin
      in yeast two-hybrid, suggesting a possible Rac signaling link to stereociliary
      actin organization.
    supporting_text: we showed its localization in the inner ear within the hair bundles
      along the stereocilia
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; interaction reported directly in the abstract.
      The proposed Rac-DOCK4-harmonin pathway has not been further substantiated.
- id: PMID:20142502
  title: The structure of the harmonin/sans complex reveals an unexpected interaction
    mode of the two Usher syndrome proteins.
  findings:
  - statement: The harmonin N-domain plus PDZ1 form a supramodule that binds the SANS
      SAM domain and PDZ-binding motif, locking the two scaffolds into a highly stable
      complex; USH1 patient mutations destabilize it.
    supporting_text: We further show that the synergistic PDZ1/SAM and PDZ1/carboxyl
      PDZ binding-motif interactions, between harmonin and Sans, lock the two scaffold
      proteins into a highly stable complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural basis of the harmonin-SANS interaction; supports the
      adaptor-activity replacement for the bare protein-binding annotation.
- id: PMID:21330445
  title: Proteomic analysis of the enterocyte brush border.
  findings:
  - statement: Harmonin is identified in the isolated enterocyte brush border proteome
      among actin-membrane linkers and validated by apical microvillar immunostaining
      in CACO-2 BBE cells.
    supporting_text: All three probes produced striking punctate staining at the apical
      surface, representative of microvillar labeling
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:23704327
  title: The giant spectrin βV couples the molecular motors to phototransduction and
    Usher syndrome type I proteins along their trafficking route.
  findings:
  - statement: Spectrin betaV associates with harmonin (and SANS) and is proposed
      to couple USH1 proteins and opsin to actin- and microtubule-based motors in
      photoreceptors.
    supporting_text: We showed that spectrin βV also associates with two USH1 proteins,
      sans (USH1G) and harmonin (USH1C).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; basis of the spectrin binding (GO:0030507)
      annotation, kept as non-core.
- id: PMID:24725409
  title: Intestinal brush border assembly driven by protocadherin-based intermicrovillar
    adhesion.
  findings:
  - statement: Harmonin binds the cytoplasmic domains of CDHR2/CDHR5 with myosin-7b,
      promotes their localization to microvillar tips, and harmonin-deficient mice
      show severe brush border defects.
    supporting_text: The cytoplasmic domains of microvillar protocadherins interact
      with the scaffolding protein, harmonin, and myosin-7b, which promote localization
      to microvillar tips.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational IMAC paper; supports the microvillus/brush border location
      and assembly annotations and the adaptor-activity replacement.
