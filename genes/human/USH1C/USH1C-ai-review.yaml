- term:
    id: GO:0050885
    label: neuromuscular process controlling balance
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      USH1C patients have vestibular dysfunction/areflexia because harmonin is
      required for vestibular hair-cell mechanotransduction; the balance defect is
      sensory (vestibular), not neuromuscular.
    action: MODIFY
    reason: >-
      The underlying biology is real - loss of harmonin abolishes vestibular function
      - but 'neuromuscular process controlling balance' mischaracterizes the
      mechanism: the defect is in vestibular hair-cell sensory transduction, not in a
      neuromuscular process. GO:0050957 'equilibrioception' (already annotated by IMP
      from PMID:10973247) is the accurate term. Recommend the ARBA mapping be
      replaced by equilibrioception.
    proposed_replacement_terms:
