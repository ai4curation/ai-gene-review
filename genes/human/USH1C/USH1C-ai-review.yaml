core_functions:
- description: >-
    PDZ-domain scaffold/adaptor of the upper tip-link density of mature hair-cell
    stereocilia: together with SANS (USH1G) and MYO7A, harmonin (principally the
    hair-bundle-enriched b isoforms) anchors the cytoplasmic tail of the CDH23
    tip-link cadherin to the stereociliary actin core, maintaining a mechanically
    robust tip-link insertion for mechanoelectrical transduction in cochlear and
    vestibular hair cells, underlying sound perception and equilibrioception.
  supported_by:
