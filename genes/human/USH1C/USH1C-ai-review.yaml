- term:
    id: GO:0030046
    label: parallel actin filament bundle assembly
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Long harmonin-b isoforms bind F-actin directly and bundle actin filaments
      (shown for mouse harmonin b, Boeda et al. 2002); stereocilia and microvilli
      cores are parallel actin bundles.
    action: ACCEPT
    reason: >-
      Core activity of the b isoform class: direct actin binding/bundling is what
      lets harmonin-b anchor membrane complexes into the parallel actin core of the
      stereocilium. Transfer from mouse Q9ES64 is appropriate; the actin association
      is also recorded by UniProt and the deep research.
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: '**Actin-cytoskeleton coupling:** recruitment of MYO7A/MYO7B and direct actin association by long harmonin-b isoforms.'
