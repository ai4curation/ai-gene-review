- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20142502
  qualifier: enables
  review:
    summary: >-
      Crystallographic/biophysical study showing that the harmonin N-domain-PDZ1
      supramodule binds the SANS (USH1G) SAM domain and PDZ-binding motif, locking
      the two Usher scaffolds into a highly stable complex.
    action: MODIFY
    reason: >-
      The interaction is real, specific and mechanistically characterized, but bare
      'protein binding' is uninformative. The paper demonstrates harmonin acting as a
      scaffold that stably tethers SANS within the USH1 protein network - this is
      better captured by GO:0030674 protein-macromolecule adaptor activity.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:20142502
      supporting_text: We further show that the synergistic PDZ1/SAM and PDZ1/carboxyl PDZ binding-motif interactions, between harmonin and Sans, lock the two scaffold proteins into a highly stable complex.
