id: Q9Y6N9
gene_symbol: USH1C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  USH1C encodes harmonin, a multivalent PDZ-domain scaffold protein whose alternative
  splicing generates three isoform classes (a, b and c). Harmonin is not an enzyme,
  transporter or channel; its core activity is to assemble cadherin-family adhesion
  receptors, companion scaffolds (SANS/USH1G or ANKS4B) and myosin-VII motors into
  mechanically robust membrane-cytoskeleton junctions at the tips of actin-based
  protrusions. In cochlear and vestibular hair cells, harmonin (principally the
  hair-bundle-enriched b isoforms, which also directly bind and bundle F-actin)
  concentrates at the upper tip-link density of mature stereocilia, where together
  with MYO7A and SANS it anchors the CDH23 tip-link cadherin to the stereociliary
  actin core and tunes mechanoelectrical transduction; during hair-bundle development
  it additionally associates with the transient ankle-link/USH2 complex, binding the
  cytoplasmic tails of usherin (USH2A) and ADGRV1 and thereby bridging the USH1 and
  USH2 protein networks. In intestinal enterocytes harmonin is a central scaffold of
  the intermicrovillar adhesion complex (IMAC), recruiting and activating ANKS4B and
  MYO7B and linking the protocadherins CDHR2 and CDHR5 to actin at microvillar tips
  to drive brush border assembly and control microvillus organization and length. In
  the retina, harmonin (mainly isoform a1) is found in photoreceptor inner and outer
  segments, calyceal processes, synapses and Mueller glia, and is required for
  long-term photoreceptor maintenance. Biallelic loss-of-function variants in USH1C
  cause Usher syndrome type 1C (congenital profound sensorineural deafness,
  vestibular areflexia and progressive retinitis pigmentosa) and some forms of
  nonsyndromic deafness (DFNB18).
