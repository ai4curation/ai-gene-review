existing_annotations:
- term:
    id: GO:0060122
    label: inner ear receptor cell stereocilium organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Harmonin is required for normal development and organization of hair-cell
      stereociliary bundles; harmonin-deficient mice have disorganized bundles and
      the protein is expressed specifically in inner ear sensory hair cells
      [PMID:10973247].
    action: ACCEPT
    reason: >-
      This is a core function of harmonin. The founding paper showed hair-cell-specific
      expression in the inner ear and identified USH1C mutations in deaf USH1C patients
      [PMID:10973247], and mouse models (deaf circler) show abnormal hair-bundle
      morphology when harmonin is lost (summarized in the deep research). The IBA is
      seeded from mouse Ush1c and PANTHER node PTN002750520 and is phylogenetically
      sound.
    supported_by:
    - reference_id: PMID:10973247
      supporting_text: We showed that, in the mouse inner ear, only the sensory hair cells express harmonin.
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: Harmonin-deficient or isoform-disrupted mouse hair cells exhibit abnormal bundle morphology and altered MET currents/adaptation.
- term:
    id: GO:0005929
    label: cilium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Harmonin's principal sites of action are actin-based protrusions (stereocilia,
      microvilli), which are not cilia; however, harmonin has been reported in the
      photoreceptor ciliary/periciliary region and harmonin-a1 can rescue a
      primary-cilium phenotype in USH1C patient fibroblasts.
    action: KEEP_AS_NON_CORE
    reason: >-
      Stereocilia are actin-based and are not cilia in the GO sense, so this term does
      not capture harmonin's main sites of action. There is nonetheless genuine
      evidence connecting harmonin to ciliary biology in photoreceptors and patient
      fibroblasts (deep research: harmonin-a1 delivery reversed a primary-cilium
      phenotype in patient-derived fibroblasts), and the PAINT donors include mouse,
      rat and whirlin-family members with ciliary localization. Keep, but as a
      non-core, secondary localization rather than a core site of harmonin action.
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: showed that harmonin-a1 delivery could reverse a primary-cilium phenotype in patient-derived fibroblasts.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Harmonin is a cytoplasmic peripheral scaffold that acts immediately beneath the
      plasma membrane, anchoring the cytoplasmic tails of transmembrane cadherins
      (CDH23, CDHR2/CDHR5, USH2A, ADGRV1) to the actin cytoskeleton.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong - harmonin genuinely works at the membrane-cytoskeleton interface,
      binding transmembrane protein tails - but 'plasma membrane' is very general for
      a submembranous scaffold, and its functional sites are much better captured by
      the specific terms already annotated (stereocilium tip, microvillus, brush
      border, stereocilia ankle link complex). Keep as a correct but non-core,
      coarse-grained localization.
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: Harmonin-b is concentrated at the **upper tip-link density** of stereocilia, immediately below the plasma membrane where CDH23 enters the taller stereocilium.
- term:
    id: GO:0001917
    label: photoreceptor inner segment
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Harmonin localizes to photoreceptor compartments including the inner segment;
      human retinal studies place harmonin in photoreceptors (inner/outer segments,
      synapses) and Mueller glia.
    action: ACCEPT
    reason: >-
      The retinal localization of harmonin is well documented (rodent
      immunolocalization transferred by ISS from mouse Q9ES64, and human retina
      RNA-seq/immunolocalization summarized in the deep research). USH1C patients
      develop retinitis pigmentosa, consistent with a genuine retinal site of action.
      Phylogenetically reasonable IBA seeded by mouse and rat experimental data.
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: Protein was detected in rod outer segments, cone presynaptic pedicles, Müller-glial endfeet and apical microvilli, and Müller-glia–photoreceptor adhesive junctions at the outer limiting membrane
- term:
    id: GO:0002142
    label: stereocilia ankle link complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: >-
      During hair-bundle development harmonin associates with the transient
      ankle-link (USH2) complex at the stereocilium base, binding the cytoplasmic
      tails of usherin (USH2A) and ADGRV1 and bridging the USH1 and USH2 protein
      networks.
    action: ACCEPT
    reason: >-
      Harmonin is unusual in belonging to both hair-cell scaffolding complexes: the
      upper tip-link density of mature stereocilia and the transient ankle-link/USH2
      complex of developing bundles (with USH2A, ADGRV1, whirlin, PDZD7). Its PDZ1
      binds the C-terminal PDZ-binding motifs of USH2A and ADGRV1 (Reiners 2005), and
      UniProt records the USH2A interaction. The IBA is seeded from mouse
      experimental annotations and is phylogenetically sound. Accepted as a bona fide,
      developmentally transient complex membership.
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: Harmonin PDZ1 recognizes C-terminal motifs in usherin/USH2A and ADGRV1, providing a physical bridge between USH1 and USH2 networks.
- term:
    id: GO:0032426
    label: stereocilium tip
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Harmonin-b concentrates at the upper tip-link density, immediately below the
      point where the CDH23 tip link inserts near the tip of the taller stereocilium,
      anchoring the tip-link apparatus to the actin core.
    action: ACCEPT
    reason: >-
      Core localization for the hearing function: the UTLD sits at/near the
      stereocilium tip of the taller row, and harmonin-b is one of its defining
      components together with MYO7A and SANS. IBA propagated from mouse and rat
      experimental data; consistent with UniProt ('Detected at the tip of cochlear
      hair cell stereocilia').
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: Harmonin-b is concentrated at the **upper tip-link density** of stereocilia, immediately below the plasma membrane where CDH23 enters the taller stereocilium. There it forms part of a CDH23–harmonin–SANS–MYO7A assembly that anchors mechanically loaded tip links to the actin core.
