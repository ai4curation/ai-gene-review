    label: upper tip-link density
  evidence_type: ISS
  original_reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
  qualifier: is_active_in
  review:
    summary: >-
      Proposed new annotation refining the existing stereocilium tip (GO:0032426)
      localization: harmonin-b is a defining component of the upper tip-link
      density, the electron-dense plaque at the upper insertion point of the CDH23
      tip link, where it acts with MYO7A and SANS to anchor the tip link to the
      actin core.
    action: NEW
    reason: >-
      GO has a precise term for harmonin's principal site of action in mature
      stereocilia (GO:1990435, a cellular anatomical entity), and mouse
      immunolocalization consistently places harmonin-b at the UTLD; the existing
      GOA set stops at the more general stereocilium tip. Transfer to human is
      warranted on the same basis as the accepted ISS/IBA stereocilium annotations.
    supported_by:
    - reference_id: file:human/USH1C/USH1C-deep-research-falcon.md
      supporting_text: Harmonin-b is concentrated at the **upper tip-link density** of stereocilia, immediately below the plasma membrane where CDH23 enters the taller stereocilium. There it forms part of a CDH23–harmonin–SANS–MYO7A assembly that anchors mechanically loaded tip links to the actin core.
