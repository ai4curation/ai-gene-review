- description: 'Structural subunit required for TCR-CD3 complex assembly: as the CD3 delta-epsilon heterodimer
    it associates with the TCR alpha/beta chains in the ER, packs its extracellular domain against the
    TCR constant domains, and contributes a transmembrane helix to the barrel that holds the TCR alpha/beta
    helices, enabling export and surface expression of the receptor.'
