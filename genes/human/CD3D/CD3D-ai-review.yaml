suggested_questions:
- question: Does CD3D itself (rather than the TCR-CD3 complex) warrant 'enables transmembrane signaling
    receptor activity', or should the CD3 subunits be annotated contributes_to this activity, given that
    ligand binding is performed by the TCR alpha/beta chains?
- question: Is the MHC class II receptor activity (contributes_to) annotation from PMID:1323144 an intended
    assertion, given that MHC class restriction is determined by the clonotypic TCR and coreceptor rather
    than the invariant CD3 delta chain?
- question: What is the non-redundant signaling contribution of the single CD3 delta ITAM relative to
    the CD3 gamma, epsilon and zeta ITAMs, as distinct from its role in receptor assembly?
suggested_experiments:
- description: Reconstitute CD3D-deficient T cells (or thymocytes) with CD3D variants carrying ITAM tyrosine-to-phenylalanine
    substitutions that preserve assembly, and compare surface TCR levels, ZAP-70 recruitment and positive
    selection to separate the signaling and assembly roles of CD3 delta.
- description: Map the functional relevance of the reported CD3 delta interaction with CD4/CD8 coreceptors
    by structure-guided mutagenesis of the CD3 delta extracellular domain.
