- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96EQ0
  review:
    summary: High-throughput binary Y2H interactome (HuRI) reporting CD3D interaction with SGTB (Q96EQ0).
    action: REMOVE
    reason: Bare protein binding carries no functional information. The interaction with the cytosolic
      co-chaperone SGTB comes from a systematic yeast two-hybrid screen and has no demonstrated role in
      CD3D function; removal does not assert the interaction is false. No more informative MF is supported
      by this paper.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: A reference map of the human binary protein interactome.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: NAS
  original_reference_id: PMID:1831653
  qualifier: located_in
  review:
    summary: Fetal-liver T-lineage precursor clones expressed cytoplasmic (intracellular) CD3 delta and
      epsilon without surface CD3.
    action: KEEP_AS_NON_CORE
    reason: CD3 delta is a type I transmembrane protein; intracellular staining reflects CD3 chains retained
      in the secretory pathway (ER/Golgi) of cells lacking a complete TCR, not a cytosolic protein. The
      broad GO cytoplasm term technically includes these compartments, so the annotation is not wrong,
      but it is not informative about where CD3D functions (plasma membrane TCR-CD3 complex).
    supported_by:
    - reference_id: PMID:1831653
      supporting_text: Both clones were found to express cytoplasmic CD3 delta and CD3 epsilon Ag while
        CD3- NK clones isolated from PBL were negative for them.
