- description: 'Signal-transducing subunit of the TCR-CD3 antigen receptor: the CD3 delta ITAM is phosphorylated
    by LCK after peptide-MHC engagement and, with the other CD3 ITAMs, transmits the receptor signal across
    the plasma membrane to initiate T cell receptor signaling.'
