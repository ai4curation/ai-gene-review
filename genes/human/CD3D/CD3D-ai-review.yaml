id: P04234
gene_symbol: CD3D
aliases:
- CD3 delta
- T3D
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD3D encodes CD3 delta, an invariant single-pass type I transmembrane glycoprotein of the
  T cell antigen receptor (TCR)-CD3 complex. It has an N-terminal extracellular immunoglobulin-like domain,
  a transmembrane helix with an acidic residue, and a short cytoplasmic tail carrying one immunoreceptor
  tyrosine-based activation motif (ITAM). CD3 delta pairs with CD3 epsilon to form a CD3 delta-epsilon
  heterodimer that assembles in the endoplasmic reticulum with the TCR alpha chain; together with CD3
  gamma-epsilon and the CD3 zeta homodimer it forms the octameric TCR-CD3 complex (1:1:1:1 TCR alpha-beta:CD3
  gamma-epsilon:CD3 delta-epsilon:CD3 zeta-zeta), in which the CD3 extracellular domains pack against
  the TCR constant domains and the transmembrane helices form a barrel around the TCR helices. CD3 delta
  is thus needed for correct assembly and surface expression of the receptor. Upon peptide-MHC engagement,
  LCK phosphorylates the CD3 delta ITAM, which with the other CD3 ITAMs recruits ZAP-70 and initiates
  TCR signaling; the complex is also ubiquitinated after activation and constitutively internalized via
  clathrin-mediated endocytosis. CD3 delta is expressed mainly in T cells and is essential for thymocyte
  development; biallelic loss-of-function variants cause a T-negative, B-positive, NK-positive severe
  combined immunodeficiency (IMD19).
