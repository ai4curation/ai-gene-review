- term:
    id: GO:0002250
    label: adaptive immune response
  evidence_type: NAS
  original_reference_id: PMID:29789755
  qualifier: involved_in
  review:
    summary: CD3 delta is an invariant signaling subunit of the TCR-CD3 complex, the antigen receptor
      of alpha-beta and gamma-delta T cells, and so acts in the adaptive immune response.
    action: KEEP_AS_NON_CORE
    reason: Correct but very broad; the specific process CD3D executes is T cell receptor signaling (GO:0050852),
      which is retained as core. The NAS source is a review of TCR signalling regulation (abstract only).
      Kept as a high-level, non-core process.
    supported_by:
    - reference_id: PMID:29789755
      supporting_text: The remarkable T cell receptor (TCR) performs essential functions in the initiation
        of intracellular signals required for T cell development, repertoire selection and effector responses
        to foreign antigens.
- term:
    id: GO:0002376
    label: immune system process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027799
  review:
    summary: ARBA machine-learning IEA to the root immune system process term.
    action: KEEP_AS_NON_CORE
    reason: True but uninformative; superseded by the specific TCR signaling pathway annotation. Retained
