    summary: IDA contributes_to MHC class II receptor activity, attributed to a study of activation-induced
      ubiquitination of TCR zeta and CD3 delta (abstract only in cache).
    action: KEEP_AS_NON_CORE
    reason: As a subunit of the TCR-CD3 complex, CD3D contributes to the complex's recognition of peptide-MHC
      and signal transduction, so a contributes_to receptor activity is biologically sound. However, MHC
