  review:
    summary: Complex membership supports the curator-inferred receptor activity.
    action: ACCEPT
    reason: The original abstract establishes CD3 delta-epsilon assembly with TCR chains, corroborated
      by the modern human structure. Its historical double-TCR-heterodimer model is not required for this
      inference and is not adopted. Receptor activity is interpreted at the assembled-complex level.
