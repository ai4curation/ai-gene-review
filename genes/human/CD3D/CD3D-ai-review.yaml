id: P04234
gene_symbol: CD3D
aliases:
- CD3 delta
- T3D
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD3D encodes CD3 delta, a single-pass type I membrane glycoprotein that supplies structural
  and signaling functions within the T cell antigen receptor complex. Its extracellular immunoglobulin-like
  domain and transmembrane helix form a CD3 delta-epsilon heterodimer that supports assembly of the receptor.
  Its cytoplasmic tail contains one immunoreceptor tyrosine-based activation motif, providing a phosphorylation-dependent
  signaling interface. Human CD3 delta is present in both alpha-beta and gamma-delta TCR-CD3 complexes.
  The clonotypic TCR chains recognize ligand, while the associated CD3 chains couple recognition to intracellular
  signaling. CD3D supports T cell receptor signaling and thymocyte development; biallelic loss-of-function
  variants cause immunodeficiency 19, a form of severe combined immunodeficiency.
