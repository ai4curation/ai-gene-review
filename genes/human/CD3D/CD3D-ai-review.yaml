- term:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:31461748
  review:
    summary: 'CD3 delta, as the CD3 delta-epsilon heterodimer, provides structural support for assembly
      of the TCR-CD3 receptor complex: its extracellular domain packs against the TCR alpha/beta constant
      domains and connecting peptides, and its transmembrane helix contributes to the transmembrane barrel
      that accommodates the TCR alpha/beta helices.'
    action: NEW
    reason: 'Participation test: CD3 delta itself contributes the structure on which receptor assembly
      depends (it is one of the packing partners, not a substrate), matching the term definition ''provides
      a physical support for the assembly of a multiprotein receptor signaling complex''. Comparator check:
      the paralogous subunits in the same role, CD3E and CD3G, already carry GO:0030159 in human GOA (NAS),
      so this fills a gap rather than defying a convention. Surface TCR expression and thymocyte development
      fail without CD3D, consistent with this structural role.'
    supported_by:
    - reference_id: PMID:31461748
      supporting_text: Assembly of the extracellular domains of TCR-CD3 is mediated by the constant domains
        and connecting peptides of TCRαβ that pack against CD3γε-CD3δε
    - *id002
    - *id003
