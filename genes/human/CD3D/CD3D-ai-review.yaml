- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: NAS
  original_reference_id: PMID:1831653
  qualifier: located_in
  review:
    summary: Human fetal-liver clones expressed intracellular CD3 delta without surface CD3.
    action: KEEP_AS_NON_CORE
    reason: The complete abstract identifies fetal-liver clones FL121/125 with cytoplasmic CD3 delta/epsilon
      and negative adult peripheral-blood CD3-negative NK controls. It supports intracellular localization,
      not a resolved ER or Golgi compartment, nor a soluble cytosolic topology. Preserve the broad NAS
      as a contextual location.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:11390434
  qualifier: is_active_in
  review:
    summary: Human Jurkat surface measurements support plasma-membrane TCR-CD3 localization.
    action: ACCEPT
    reason: The inspected primary Results and Methods distinguish anti-TCR alpha-beta and OKT3 surface
      measurements, vector controls, and unchanged CD28/HLA class I controls. This supports the receptor-complex
      location. The separate TRIM coimmunoprecipitation experiment did not detect CD3 delta and is not
      misrepresented as direct TRIM-CD3D binding.
