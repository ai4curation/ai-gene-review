- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000060280
  - UniProtKB:P04234
  - UniProtKB:P07766
  - UniProtKB:P09693
  review:
    summary: PAINT places transmembrane signaling receptor activity at the CD3 gamma/delta ancestral node
      (PTN000060280); CD3D transmits the antigen-receptor signal across the membrane through its single
      cytoplasmic ITAM as a subunit of the TCR-CD3 complex.
    action: ACCEPT
    reason: CD3D does not itself bind peptide-MHC (the TCR alpha/beta chains do), but the CD3 chains are
      the signal-transducing subunits of the receptor; their transmembrane helices form the barrel into
      which the TCR alpha/beta helices insert and their ITAMs are phosphorylated by LCK upon engagement.
      The activity is exerted as part of the complex, which is how GO conventionally annotates CD3 subunits
      (CD3E and CD3G carry the same IBA from this node). Accepted as the core MF, understood as a contribution
      to the TCR-CD3 receptor activity.
    supported_by:
    - &id002
      reference_id: PMID:31461748
      supporting_text: The transmembrane segment of the CD3 complex adopts a barrel-like structure formed
        by interaction of the two transmembrane helices of CD3ζζ with those of CD3γε and CD3δε.
    - &id001
      reference_id: Reactome:R-HSA-202165
      supporting_text: the TCR complex include 10 ITAMs with one ITAM in each of the CD3 chains including
        the three tandem ITAMs in each zeta chains.
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IC
  original_reference_id: PMID:9485181
  qualifier: enables
  supporting_entities:
  - GO:0042105
  review:
    summary: Curator inference from membership of the alpha-beta TCR complex (GO:0042105, from the same
      paper).
    action: ACCEPT
    reason: Consistent with the IBA; CD3 delta-epsilon dimers assemble with TCR alpha/beta and are required
      for the receptor complex to reach the cell surface and signal. Accepted, with the understanding
      that the activity is a property of the assembled complex.
    supported_by:
