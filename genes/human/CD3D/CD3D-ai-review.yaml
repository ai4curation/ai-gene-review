core_functions:
- molecular_function:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  contributes_to_molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  description: CD3 delta-epsilon supplies extracellular and transmembrane contacts that organize the TCR-CD3
    receptor, while the CD3 delta cytoplasmic ITAM provides a phosphorylation-dependent signaling interface.
    This is a nonenzymatic structural and signaling contribution to the assembled receptor, including
    human alpha-beta and gamma-delta complexes. Ligand recognition belongs to the clonotypic TCR chains;
    in a class-II-restricted alpha-beta complex, CD3D contributes to the complex-level MHC class II receptor
    activity without itself determining class restriction.
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0042101
    label: T cell receptor complex
  supported_by:
  - reference_id: PMID:31461748
    supporting_text: The octameric TCR-CD3 complex is assembled with 1:1:1:1 stoichiometry
      of TCRαβ:CD3γε:CD3δε:CD3ζζ.
  - reference_id: PMID:38657677
    supporting_text: In humans, the TCRγ and TCRδ chains associate with three CD3
      dimeric subunits—CD3εγ, CD3εδ and CD3ζζ
  - reference_id: Reactome:R-HSA-202165
    supporting_text: the TCR complex include 10 ITAMs with one ITAM in each of the
      CD3 chains including the three tandem ITAMs in each zeta chains.
  - reference_id: PMID:31848223
    supporting_text: The TCR mediates recognition of antigenic peptides bound to
      MHC molecules (pMHC), whereas the CD3 molecules transduce activation signals
      to the T cell.
  - reference_id: PMID:32047259
    supporting_text: 'TCRαβ first binds with CD3δε, then CD3γε joins in the intermediate
      complex and finally CD3ζζ is incorporated to form the integrated complex'
  - reference_id: PMID:32047259
    supporting_text: CD3δ CD and CD3γ CD cannot independently recruit Lck, which
      explains why they are exposed in the cytosol but not spontaneously phosphorylated
      in resting T cells
suggested_questions:
- question: Should the CD3D GO:0004888 transmembrane signaling receptor activity rows
    use contributes_to rather than enables, given that ligand binding is performed
    by the clonotypic TCR alpha/beta or gamma/delta chains and CD3D contributes a
    signaling subunit to the assembled receptor?
- question: What signaling contribution of the CD3 delta ITAM remains nonredundant after controlling for
    receptor assembly and matched surface expression?
- question: How does the annotated alternative product lacking residues 92–136 affect assembly, localization
    and signaling, given that this interval includes the canonical transmembrane helix?
- question: Should human CD3D be annotated part_of GO:0042106 gamma-delta T cell
    receptor complex? Human CD3E, CD3G and CD247 carry this term from the murine
    gamma-delta stoichiometry paper, and human cryo-EM structures plus Siegers et
    al. 2007 support CD3 delta-epsilon in human gamma-delta TCR-CD3 complexes; CD3D
    incorporation may therefore be species- or subset-dependent.
suggested_experiments:
- description: Compare wild-type CD3D with ITAM tyrosine-to-phenylalanine variants in a CD3D-deficient
    receptor reconstitution system, matching surface receptor abundance before measuring phosphorylation,
    ZAP70 recruitment and activation. This separates signaling-interface effects from altered assembly.
- description: Measure CD3 delta incorporation and receptor signaling across primary human gamma-delta
    T cell subsets using subunit-resolved biochemical measurements, distinguishing receptor composition
    from cell abundance and controlling for antibody accessibility.
