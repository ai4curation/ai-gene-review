- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      An inter-ontology inference whose literal WITH/FROM field is not a gene product but the GO
      term GO:0005200, i.e. it is derived entirely from the molecular-function row above and
      carries no evidence independent of it. It is therefore exactly as strong as that row and no
      stronger, and it is marked at the same level.

      The two merged siblings that share this byte-identical row diverge, and both routes are
      unavailable here. ACTL7A modified it to the more specific GO:0030036 actin cytoskeleton
      organization, but that was earned by a knock-out phenotype in which Actl7a-null spermatids
      lose subacrosomal F-actin; ACTL10 has no phenotype to support any process term, and the one
      paper to look at mouse Actl10 in a germline context states that its mutants have not been
      linked to germline biology. ACTL7B removed it outright, but only because the GO:0005200 row
      it derives from was itself removed; here that row is marked over-annotated rather than
      removed, so removing the derived row would assert more than the review does about its basis.
      ACTR10 kept it as non-core on the grounds that it is true but uninformative - which is
      defensible for a gene with a demonstrated cytoskeletal role, and is precisely what ACTL10
      lacks. ACTRT3, which merged with the byte-identical row, also kept it as non-core, and its
      reason is the one that shows why ACTL10 cannot follow: it holds that the term "is true at
      this level of generality and should not be removed" because ACTRT3 is a perinuclear-theca
      scaffold component required for acrosome assembly. Truth at that level of generality is
      exactly what is unestablished for ACTL10, which has no demonstrated involvement in
      organising anything. So for ACTR10 and ACTRT3 the row is true but uninformative, whereas for
      ACTL10 it is unsupported - a difference that MARK_AS_OVER_ANNOTATED records and
      KEEP_AS_NON_CORE would hide.

      Marked over-annotated rather than kept: read as an assertion that ACTL10 participates in
      organising the cytoskeleton, this row overstates what is known, because its entire basis is a
      molecular-function inference that this review has judged an over-annotation.

      The coded diagnosis records the circularity rather than weak source evidence, matching the
      merged ACTR10 and ACTRT3 reviews, which both give this source CIRCULAR_OR_REDUNDANT. The
      defect here is not that the source's evidence is weak - the source is not a gene product at
      all and carries no evidence to weigh - but that the chain transfers from another transfer on
      the same gene. SOURCE_EVIDENCE_WEAK would also contradict this review's own finding on the
      row above, where every donor was shown to carry its own experimental annotation. ACTL7A and
      ACTL7B use the weak-source values instead, which is right for them because their source row
      is a 1999 TAS with genuinely weak evidence, and wrong here.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Wholly derivative of the GO:0005200 row, whose literal WITH/FROM it is, and therefore no
      stronger than that row, which is itself marked as an over-annotation. No independent
      evidence, no phenotype and no localisation support a cytoskeleton-organisation role for
      ACTL10, so the annotation is retained for traceability but should not be read as evidence
      that ACTL10 organises anything. It is not modified to the more specific GO:0030036, because
      the phenotype that earned that term for ACTL7A has no counterpart in ACTL10.
    supported_by:
    - reference_id: PMID:35180326
      supporting_text: Actl10 and 1700003F12Rik mutant mice have not been linked to germline biology
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: GO:0005200
        source_label: >-
          The GO term structural constituent of cytoskeleton, used as the literal WITH/FROM of this
          row by the GO_REF:0000108 inter-ontology pipeline
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          A GO term, not a gene product, so it carries no evidence of its own. Its own basis on
          this gene is the IBA row above, which this review marks as an over-annotation.
core_functions: []
proposed_new_terms: []
suggested_questions:
- question: >-
    Does the human ACTL10 protein begin where UniProt, RefSeq and MANE say it does? The reviewed
    245-residue sequence starts in the middle of the actin fold. The MANE transcript is
    single-exon, and translating its 555-nucleotide leader in the CDS reading frame gives 167
    uninterrupted codons immediately upstream of the annotated initiator whose translation is
    unmistakably actin, including the phosphate-binding loop 1 motif that the annotated protein
    lacks. Extending the sequence raises the global alignment score against Sapajus apella ACTL10
    from 1117 to 1835 at 96.5 per cent identity, and the Met1 of both Sapajus and Callithrix
    ACTL10 aligns to a human CTG codon at chr20:33667129 rather than an ATG. This looks like loss
    of the ancestral initiator with the reading frame still intact, and it should be settled by
    N-terminal proteomics or ribosome profiling rather than by sequence analysis. It is offered to
    UniProt, Ensembl and RefSeq as a data-quality report, and it matters for GO because every
    residue-level argument about this protein currently rests on a sequence that stops short of
    the nucleotide-binding loop.
  experts:
  - UniProt curator
  - Ensembl and RefSeq gene-model annotators
  - proteomics
- question: >-
    Should PAINT extend its GO:0005200 IRD negation to the remaining divergent-actin branch? Within
    PTHR11937, GO:0005200 structural constituent of cytoskeleton is asserted by IBD at exactly one
    node, PTN000940351, and then negated by IRD at eight descendant nodes covering Arp2, Arp3,
    Arp5, Arp6, Arp8, ACTL6A/B, ACTR1A/B and ACTL7A/7B, with the parent GO:0005198 substituted at
    the ACTL7 node. QuickGO shows that the ten human genes still receiving the term from
    PTN000940351 are the four conventional muscle actins ACTA1, ACTA2, ACTC1 and ACTG2, where it is
    plainly correct, plus six divergent proteins: ACTL9, ACTL10, ACTR10, ACTRT1, ACTRT2 and
    ACTRT3. Of those six only ACTR10 has independent evidence for the term, as a dynactin subunit.
    A single node-level negation, or a drop to GO:0005198 as was done for ACTL7A/7B, would
    therefore correct five genes at once. The merged ACTR8 review independently reached the same
    tally of eight IRD negatives against one IBD positive, and asked whether the ARP8 node could
    serve as a template for extending the IRD discipline to the divergent actin-like nodes that
    lack it; this question supplies the concrete target list for that proposal rather than
    restating it. It is stated once here with all affected genes named rather than repeated in
    each gene's review. A narrower recommendation on the same row: it is propagated with the
    qualifier `enables`, while the companion GO:0015629 row is propagated with `is_active_in`.
    For a protein with no measured molecular function, `is_active_in` presupposes the very thing
    that is unknown, and `located_in` would express what the phylogenetic inference actually
    supports. Both qualifiers are correct for the conventional-actin donors and over-assert on
    this target, so the qualifier choice may be worth revisiting at the same time as the term.
  experts:
  - PAINT and GO Central curators
- question: >-
    Is it intended that Arp2 and Arp3 seed the ancestral GO:0005200 assertion while the same term
    is negated at their own clade nodes? UniProtKB:P61160 (ACTR2/Arp2) and UniProtKB:P61158
    (ACTR3/Arp3) are two of the ten seeds of the GO:0005200 IBD at PTN000940351, and QuickGO
    confirms each holds its own IDA for the term, yet PAINT carries IRD negations of GO:0005200 at
    PTN000233596 and PTN000233796, the Arp2 and Arp3 clade nodes. Because IRD blocks propagation
    rather than deleting a direct annotation this is not strictly contradictory, but the ancestral
    state is being supported by proteins whose own clades have been excluded from it, which is
    worth confirming as deliberate.
  experts:
  - PAINT and GO Central curators
- question: >-
    What does ACTL10 do in the testis? This is the one tissue where the gene is normally abundant
    and it is entirely unstudied. The gene is tissue-enriched in testis in human, enriched in
    testis and expressed in spermatids in mouse, and the cloned cDNA came from testis, yet no
    localisation, partner, ligand or phenotype has ever been reported, and Pharos classifies the
    protein as Tdark. Given that ACTL7A, ACTL7B and ACTL9 all have essential and specific roles in
    the acrosome, acroplaxome and nuclear-membrane region of the spermatid, is ACTL10 part of the
    same machinery?
  experts:
  - spermatogenesis
  - cell biology
- question: >-
    Does ACTL10 bind a nucleotide, and does it polymerise? These are the two questions the
    structural analysis raises without answering. Repaired to include the upstream reading frame,
    ACTL10 keeps 15 of 19 actin nucleotide-contact positions as chemically compatible with an
    intact phosphate-binding loop 1, which makes nucleotide binding plausible but untested; and it
    keeps only 11 of 38 filament protomer-interface positions, against 33 of 38 for a divergent
    actin that does polymerise, which makes canonical filament incorporation unlikely but also
    untested. Neither is measured, which is why this review proposes no molecular function.
  experts:
  - biochemistry
  - structural biology
suggested_experiments:
- description: >-
    Determine the true N-terminus of the human ACTL10 protein. Immunoprecipitate or affinity-enrich
    ACTL10 from human testis and perform N-terminal mass spectrometry, and in parallel inspect
    testis ribosome-profiling data for initiation over the annotated 5-prime leader. This
    distinguishes a genuinely N-terminally shortened human protein from initiation at a non-AUG
    codon or an unannotated upstream exon, and it settles which sequence any future structural or
    biochemical work should use.
- description: >-
    Test nucleotide binding directly on both candidate forms. Express the annotated 245-residue
    protein and the extended form that includes the upstream reading frame, and compare ATP and ADP
    binding by isothermal titration calorimetry or a fluorescent nucleotide-exchange assay. The
    prediction from the residue analysis is that only the extended form binds, because
    phosphate-binding loop 1 lies entirely within the upstream region.
- description: >-
    Test polymerisation and co-assembly. Assay the purified protein alone for salt-induced
    polymerisation by pyrene-actin fluorescence and by negative-stain or cryo-electron microscopy,
    and separately test whether it co-assembles into or caps filaments of conventional beta-actin.
    A negative result alone would be weak, so include Drosophila Arp53D as a positive control for a
    divergent actin that does polymerise.
- description: >-
    Localise the endogenous protein in testis. Use validated antibodies or an epitope-tagged
    knock-in allele for immunofluorescence across the stages of spermiogenesis, co-staining for
    F-actin and for acroplaxome and manchette markers, to establish whether ACTL10 occupies the
    same subacrosomal compartment as ACTL7A and ACTL9. This is the single most informative missing
    fact, because it would give the first experimental cellular-component annotation for the gene.
- description: >-
    Identify partners and complexes without prior hypothesis. Immunoprecipitate tagged ACTL10 from
    testis or from a spermatid-like cell model and identify co-purifying proteins by quantitative
    mass spectrometry, with size-exclusion or blue-native fractionation to test whether it travels
    as a monomer or in an assembly. IntAct currently holds zero interactions for Q5JWF8, so any
    reproducible partner would be the first.
