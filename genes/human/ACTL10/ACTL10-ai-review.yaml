id: Q5JWF8
gene_symbol: ACTL10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTL10 is a divergent, testis-enriched member of the actin family whose molecular function,
  ligands, binding partners and subcellular location are all unknown. It is one of the small group
  of vertebrate actin-like proteins that retain the actin fold at roughly a third identity to
  cytoplasmic beta-actin while sharing none of beta-actin's characterised cell biology. Structural
  comparison shows the divergence is distributed unevenly. Measured on the reading frame extended
  to include the upstream actin-homologous coding sequence, the nucleotide pocket is largely intact,
  including a well-conserved phosphate-binding loop 1; the reviewed 245-residue sequence does not
  reach that loop at all. Most of the protomer-protomer contact surface that builds a two-stranded
  filament is not conserved on either sequence, so incorporation into a
  conventional actin filament is unlikely although it has never been tested. Whether the protein
  binds a nucleotide, polymerises, or joins any complex is unmeasured. Expression is the
  best-established fact about it: the gene is tissue-enriched in testis in human and in mouse,
  with expression in spermatids, the cloned cDNA came from testis, and the protein is detected by
  proteomics. No knockout phenotype has been linked to germline biology in mouse, and the human
  gene appears in the literature almost exclusively as a row in methylation-array and
  transcriptome tables; the single gene-focused study is a survival correlation in cytogenetically
  normal acute myeloid leukaemia, which reports no molecular mechanism. A notable feature of the
  human gene record is that the reviewed 245-residue sequence begins in the middle of the actin
  fold: the genome carries a further stretch of actin-homologous coding sequence immediately
  upstream, in the same reading frame and free of stop codons, which encodes the nucleotide-binding
  loop that the annotated protein lacks and which is retained as protein in other primates.
existing_annotations:
- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic inference placing ACTL10 in the actin cytoskeleton, from PANTHER node
      PTN002631484. This row is byte-identical to the corresponding row in the already-merged
      ACTL8 review - the same node and the same twenty-five WITH/FROM tokens - and it is resolved
      the same way, for the same reason, which is a property of the node rather than of either
      gene.

      PTN002631484 spans the conventional actins, the POTE actin-fusion genes and the divergent
      actin-like proteins including ACTL8, ACTL9, ACTL10 and ACTRT1-3, so identity to beta-actin
      across its human descendants runs from about a third to 100 per cent. The term it donates is
      correspondingly generic. That breadth is therefore not a granularity failure: the term is the
      true last common ancestor of a heterogeneous donor set, and GRANULARITY_MISMATCH would be
      the wrong call because the donors do not agree on anything more specific. No specificity
      upgrade is warranted.

      Verified independently rather than read off the sibling review: QuickGO confirms
      PTN002631484 donates this term to exactly eighteen human genes - ACTA1, ACTA2, ACTB, ACTBL2,
      ACTC1, ACTG1, ACTG2, ACTL8, ACTL9, ACTL10, ACTRT1, ACTRT2, ACTRT3 and the five POTE genes.
      So this row is one projection across eighteen genes with identical evidence, not an
      independent finding about ACTL10, and the same is true of the GO:0005200 row below, which
      shares this row's reference GO_REF:0000033. That is the correct reading of a family-level
      inference and it is why the row is non-core.

      One thing this check ruled out. The merged ACTL8 review's central finding is that PANTHER
      mis-placed ACTL8 inside the narrow beta/gamma-actin subfamily, inflating its record about
      five-fold. Querying QuickGO directly for all eight divergent human actin-like and
      actin-related-T proteins confirms that finding and shows it does not extend to ACTL10:
      ACTL8 alone sits under the narrow nodes PTN002631586 and PTN007551913 and carries eleven IBA
      rows, against a median of two for the other seven, and ACTL10 has exactly two and sits under
      neither narrow node. ACTL10 is therefore correctly placed; its problem is not mis-placement.

      The donor set is strong rather than weak. Of twenty-five WITH/FROM tokens, twenty-four are
      protein identifiers, all twenty-four resolve, and all twenty-four carry their own
      experimental-code annotation for this term or a descendant, spanning twelve organisms. Two
      resolve only to unreviewed TrEMBL entries (Candida ACT1 and C. elegans act-5); that is
      recorded rather than hidden, and both still carry their own IDA, so their weakness is one of
      name provenance, not evidence provenance.

      It is kept because it asserts nothing that ACTL10's sequence contradicts - ACTL10 is a
      genuine divergent actin, about 35 per cent identical to beta-actin, and on the extended
      reading frame actin's phosphate-binding loop 1 is conserved, though the reviewed 245-residue
      sequence stops short of it - and it is marked non-core because nothing places ACTL10
      in any compartment experimentally. Unlike ACTL8, whose UniProt entry at least offers a
      by-similarity cytoplasm/cytoskeleton location, ACTL10's entry carries no SUBCELLULAR LOCATION
      line at all; its only CC line in the entire record is a bare family-membership statement with
      evidence code ECO:0000305, which is curator inference rather than similarity to a named
      entry. A generic compartment term cannot represent the core of a gene whose activity is
      unknown.

      One qualifier point, raised because it asserts more than the evidence does. This row carries
      is_active_in, which states that ACTL10 carries out its molecular function in the actin
      cytoskeleton. No molecular function has been measured for ACTL10 at all, so is_active_in
      presupposes exactly what is unknown; located_in would say what the inference actually
      supports, namely residence, without committing to activity. The donors do justify
      is_active_in for themselves, since conventional actins demonstrably act in the actin
      cytoskeleton, so this is a transfer artefact of the same kind as the term's breadth rather
      than a curator error. The term is left unchanged and the action stays KEEP_AS_NON_CORE,
      because the compartment call is defensible and swapping a qualifier is a GOA-side change
      rather than a term-level one; it is recorded here and raised for PAINT as the narrower of the
      two recommendations on this gene.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correctly scoped family-level inference from a node at the right depth for a divergent actin,
      with every protein donor carrying its own experimental evidence. Retained because the
      sequence is consistent with it, marked non-core because no experiment has localised ACTL10
      anywhere and UniProt offers not even a by-similarity location. Resolved identically to the
      byte-identical row in the merged ACTL8 review, so the two reviews agree.
    supported_by:
    - reference_id: file:human/ACTL10/ACTL10-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the actin family. {ECO:0000305}.'
    - reference_id: file:human/ACTL10/ACTL10-bioinformatics/RESULTS.md
      supporting_text: 'Carrying their own experimental-code annotation for this term or a descendant:
        **24**.'
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
