- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic inference of a specific molecular function from PANTHER node PTN000940351, on a
      protein for which no molecular function of any kind has been measured. This row is
      byte-identical to the corresponding row in the merged ACTR10 review, which accepted it as
      core; it is resolved differently here, and the ground of the difference is gene-specific
      evidence rather than a difference of method.

      Why ACTR10's ACCEPT does not transfer: ACTR10 is a bona fide dynactin subunit, and its
      accepted reason is that its own contribution to dynactin's structural integrity is exactly
      what this molecular function expresses. ACTL10 has no known complex, no known location, no
      phenotype and no biochemistry, so there is no corresponding gene-specific basis. Why the
      REMOVE that ACTL7A and ACTL7B applied to their GO:0005200 rows also does not transfer: both
      of those rested on two grounds that are absent here. Theirs was a TAS row citing a paper that
      contained no functional experiment, whereas this is a live IBA whose ten protein donors all
      carry their own experimental evidence; and PAINT had explicitly negated the term at their
      node PTN008986528, whereas PAINT has not negated it on ACTL10's branch.

      What the donor analysis does and does not license. All eleven WITH/FROM tokens were resolved:
      ten are proteins, ten of ten resolve, and ten of ten carry their own experimental-code
      annotation for the term - mouse and rat Actg1 by IDA, yeast ACT1 and ARP1 by IDA, yeast ARP10
      by IPI, human ACTB by EXP, IDA and IMP, human ACTR2 and ACTR3 by IDA, and two Dictyostelium
      actins by IDA. So SOURCE_WEAK_OR_INFERRED and SOURCE_EVIDENCE_WEAK are contradicted by the
      analysis itself; the defect is not in the sources but in the transfer, hence
      PROPAGATION_BAD.

      Two further checks, both of which sharpen the call. First, this row is also a
      many-genes-one-source projection: QuickGO shows PTN000940351 donating the term to exactly ten
      human genes with identical evidence, and the row shares its reference GO_REF:0000033 with the
      GO:0015629 row above, so the two rows are not independent of each other either - six of these
      ten protein donors also appear on that row. Second, and more telling, the four donors that
      are unique to this row, and therefore the only ones that make it more specific than a generic
      actin-cytoskeleton call, are yeast Arp1, yeast Arp10, human Arp2 and human Arp3. Arp2
      (P61160) and Arp3 (P61158) are seeds at PTN000233596 and PTN000233796 respectively, and those
      are two of the eight nodes at which PAINT has IRD-negated this very term; yeast Arp1 is a
      dynactin filament subunit, and the centractin clade node PTN007551901 also carries an IRD
      negation. So the specificity of this row rests largely on donors drawn from clades that GO's
      own pipeline has excluded from the term they are donating.

      The substantive argument is structural, and it was rebuilt on a corrected sequence. The route
      by which real actins earn this term is filament formation. Measured on PDB 6DJO, the 38
      inter-protomer contact positions are 38 of 38 chemically compatible in beta-actin and
      alpha-skeletal actin, and 33 of 38 in Drosophila Arp53D, a divergent actin that does
      polymerise; ACTL10 scores 11 of 38, the same as ACTL8 and the same as the independently
      annotated Sapajus ACTL10. That is a real degradation of the polymerisation surface and it is
      stable under a second substitution matrix and gap model.

      REMOVE is nevertheless not earned, and the control that refuses it is one this review
      computed itself: human Arp3 scores 8 of 38, below ACTL10, and Arp3 does form actin-like
      protomer contacts as the first protomer pair of a daughter filament at an Arp2/3 branch. A
      low score on this metric therefore bounds canonical incorporation into a conventional
      two-stranded filament; it does not show that a protein cannot be a structural component of
      any actin-containing assembly. The complementary evidence points the other way as well: the
      nucleotide pocket is well preserved on the extended reading frame, 15 of 19 contact positions
      chemically compatible with a fully intact phosphate-binding loop 1, which is better than ACTL8
      and better than ACTL7A. On the reviewed 245-residue sequence the loop is not present to score
      at all, which is the point of the correction rather than a competing measurement. So
      this is not a fold that has lost actin's residues, and no argument from residue decay is
      available.

      The term is marked over-annotated rather than removed: it is not clearly false, but it
      asserts a specific molecular function for a protein with no functional data, propagated from
      a node whose term GO's own phylogenetic pipeline has judged non-transferable to eight other
      divergent-actin clades, dropping to the parent GO:0005198 where it wanted to retain anything
      at all.

      Why it is not MODIFY to that parent, which is what the merged ACTRT3 review did with this
      same row. ACTRT3's generalisation is well founded, and explicitly so: its reason states that
      GO:0005198 is supported for ACTRT3 because it is a component of the perinuclear theca's
      protein scaffold and contributes to its structural integrity, so generalising moves the row
      from an unsupported specific claim onto a supported general one. ACTL10 has no counterpart to
      that. It is in no known complex or assembly, has no known location, no phenotype and no
      binding partner, and GO:0005198 is defined by contribution to the structural integrity of a
      complex or assembly - so substituting it would exchange one unsupported assertion for a
      slightly less specific unsupported assertion, and would newly place a molecular function on
      a gene for which none is supported - ACTL10's only existing MF row is the GO:0005200 under
      discussion here. Neither ACTL10 nor ACTRT3 already carries GO:0005198, so for
      ACTRT3 the MODIFY adds a defensible term and for ACTL10 it would add an undefensible one.
      Flagging the existing row as an over-annotation says exactly as much as the evidence
      supports and no more. This is the same kind of gene-specific discrimination ACTRT3 itself
      uses to distinguish its verdict from ACTR10's ACCEPT.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A specific molecular function asserted on a protein with no measured function of any kind.
      The polymerisation surface through which actins earn this term is substantially degraded in
      ACTL10 (11 of 38 interface positions compatible, against 38 of 38 for beta-actin and 33 of 38
      for a divergent actin that does polymerise), and PAINT has already negated this exact term at
      eight sibling divergent-actin nodes, including the clades of three of the four donors that
      are unique to this row. REMOVE is withheld because the review's own control
      declines to support it: Arp3 scores lower still and does make actin-like protomer contacts,
      so the metric bounds canonical filament incorporation rather than all structural roles, and
      the nucleotide site is well preserved rather than decayed. Every donor annotation is itself
      sound, so the failure is in the transfer rather than in the sources.
    supported_by:
    - reference_id: file:human/ACTL10/ACTL10-bioinformatics/RESULTS.md
      supporting_text: 'and then **negated on descent at 8 nodes**:'
    - reference_id: file:human/ACTL10/ACTL10-bioinformatics/RESULTS.md
      supporting_text: 'Carrying their own experimental-code annotation for this term or a descendant:
        **10**.'
    - reference_id: file:human/ACTL10/ACTL10-uniprot.txt
      supporting_text: 'DR   Pharos; Q5JWF8; Tdark.'
    - reference_id: PMID:32742462
      supporting_text: Actin-like 10 (ACTL10) is a member of the actin family; however, to the best
        of our knowledge, there are very few studies on the ACTL10 gene.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000940351
        source_label: >-
          PANTHER ancestral actin node; the one node at which PAINT asserts GO:0005200 by IBD, and
          from which it has negated the term by IRD at eight descendant divergent-actin nodes
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Not a protein, so it carries no evidence of its own. Recorded because the node is the
          whole of the case: QuickGO shows it donating this term to exactly ten human genes, the
          four conventional muscle actins plus ACTL9, ACTL10, ACTR10 and ACTRT1-3, while PAINT has
          negated the same term below it at Arp2, Arp3, Arp5, Arp6, Arp8, ACTL6A/B, ACTR1A/B and
          ACTL7A/7B.
      - source_id: MGI:MGI:87906
        source_label: Actg1 (Mus musculus, P63260, Swiss-Prot)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'Own evidence in QuickGO for this term or a descendant: IBAx1, IDAx1, ISOx2.'
      - source_id: RGD:1304556
        source_label: Actg1 (Rattus norvegicus, P63259, Swiss-Prot)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'Own evidence in QuickGO for this term or a descendant: IBAx1, IDAx2, ISOx1.'
      - source_id: SGD:S000001171
        source_label: ARP1 (Saccharomyces cerevisiae (strain ATCC 204508 / S288c), P38696, Swiss-Prot)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Own evidence in QuickGO for this term or a descendant is a single IDA. Yeast Arp1 is a
          dynactin filament subunit, so it is the donor most relevant to ACTR10, which is a
          dynactin subunit and accepted the term, and least relevant to ACTL10, which is in no
          known complex.
      - source_id: SGD:S000001855
