    review_notes: >-
      The GO_REF backing both IBA rows. Verified by working through the underlying PAINT record for
      PTHR11937 cached in this repository and by resolving all 36 WITH/FROM tokens across the two
      rows against UniProt and QuickGO; every protein donor carries its own experimental evidence,
      so the inference is well-founded at source even where this review judges the transfer wrong.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Backs the GO:0007010 row. Verified that the row's WITH/FROM is the GO term GO:0005200 rather
      than a gene product, which is what makes the annotation wholly derivative of the
      molecular-function row on the same gene.
- id: PMID:32742462
  title: Prognostic role of ACTL10 in Cytogenetic Normal Acute Myeloid Leukemia.
  findings:
  - statement: >-
      The only gene-focused study of ACTL10 in the literature is a TCGA correlation of RNA
      expression and DNA methylation with survival in cytogenetically normal AML. It reports no
      molecular function, localisation, partner or phenotype, and its authors state that the gene
      is essentially unstudied. It therefore supports no GO annotation.
    supporting_text: Actin-like 10 (ACTL10) is a member of the actin family; however, to the best
      of our knowledge, there are very few studies on the ACTL10 gene.
  - statement: >-
      The study's own conclusion is explicitly prognostic rather than mechanistic, and it names
      mechanism as the outstanding gap.
    supporting_text: future research should focus on investigating the molecular mechanisms
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached, and checked for retraction; the PubMed publication type is
      plain Journal Article. Relevance is LOW despite ACTL10 being in the title, because the paper
      is a survival correlation on TCGA data with no functional experiment, so it informs the
      review only by confirming that the gene is uncharacterised. Recorded because the affinage
      record for this gene returned zero discoveries and zero citations, and an empty provider
      record is not evidence that literature is absent; this paper is what an independent Europe
      PMC search found.
- id: PMID:35180326
  title: The Wnt1-Cre2 transgene is active in the male germline.
  findings:
  - statement: >-
      Mouse Actl10 is testis-enriched at the tissue level and moderately expressed in spermatids,
      corroborating the human testis-enrichment call in an independent species and dataset.
    supporting_text: Actl10 and 1700003F12Rik were both enriched in testis at the tissue level
  - statement: >-
      No germline phenotype has been linked to Actl10 mutant mice. This is the authors' own
      statement about the state of knowledge, made while surveying the genes flanking the
      Wnt1-Cre2 insertion site, and it is the basis for declining to modify the GO:0007010 row to a
      more specific process term as the ACTL7A review did on the strength of a knock-out phenotype.
    supporting_text: Actl10 and 1700003F12Rik mutant mice have not been linked to germline biology
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached, no retraction. Actl10 appears only because it flanks the
      Wnt1-Cre2 insertion site, so the paper is not about this gene; the whole surrounding
      paragraph was read before quoting, and it is careful to give Actl10 expression without
      function, which is exactly how it is used here. Relevance MEDIUM rather than HIGH because it
      establishes expression and the absence of a linked phenotype, not function.
- id: file:human/ACTL10/ACTL10-uniprot.txt
  title: UniProtKB entry Q5JWF8 (ACL10_HUMAN), Actin-like protein 10
  findings:
  - statement: >-
      The entry contains no FUNCTION, SUBCELLULAR LOCATION or SUBUNIT comment. Its only CC line is
      a family-membership statement whose evidence code ECO:0000305 is curator inference rather
      than similarity to a named entry, and the only sequence feature is the chain itself.
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the actin family. {ECO:0000305}.'
  - statement: >-
      The protein is nevertheless detected, so the correct statement is that no functional or
      biochemical characterisation exists, not that there is no data of any kind.
    supporting_text: 'PE   1: Evidence at protein level;'
  - statement: The gene is tissue-enriched in testis in human.
    supporting_text: 'DR   HPA; ENSG00000288649; Tissue enriched (testis).'
  - statement: >-
      GO's curated set for this gene consists of two phylogenetic inferences and nothing else, and
      Pharos independently classifies the protein as a dark target.
    supporting_text: 'DR   PAN-GO; Q5JWF8; 2 GO annotations based on evolutionary models.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched by just fetch-gene. Every quoted span was checked to be a verbatim substring
      lying on a single physical line of the file, because the repository validator does not check
      quotes taken from file references.
- id: file:human/ACTL10/ACTL10-bioinformatics/RESULTS.md
  title: 'ACTL10: is the Swiss-Prot sequence the protein, and what do its two IBA rows rest on?'
  findings:
  - statement: >-
      The human genome encodes 167 uninterrupted in-frame codons immediately upstream of Q5JWF8's
      annotated initiator, within the single-exon MANE transcript's own 5-prime leader, and their
      translation is actin, including the phosphate-binding loop 1 motif absent from the annotated
      protein. The reading frame is proven rather than assumed, by first asserting that the
      annotated CDS translates to the Swiss-Prot sequence.
    supporting_text: After the last stop there are **167 uninterrupted codons** running straight
      into the annotated initiator
  - statement: >-
      Twenty of the thirty-eight filament-interface positions previously scored as gaps for ACTL10
      are not substitutions but positions the annotated sequence never reaches. Repaired, ACTL10
      scores 11 of 38 chemically compatible, identical to ACTL8 and to Sapajus ACTL10, rather than
      the 5 of 18 that made it look like the most degraded actin relative in the family.
    supporting_text: counts contact positions the query sequence does not reach at all - an absence
      in the annotation
  - statement: >-
      The five nucleotide-site positions the annotated sequence fails to reach are exactly actin's
      phosphate-binding loop 1, and the extended reading frame retains all five as four identical
      residues plus one conservative substitution. The nucleotide pocket is therefore preserved,
      not decayed, which removes any residue-decay argument for removing ACTL10's function
      annotation.
    supporting_text: motif that grips the nucleotide beta-phosphate, and the most diagnostic
      single feature of the actin fold
  - statement: >-
      Within PTHR11937, GO:0005200 is asserted by IBD at the single node PTN000940351 and then
      negated by IRD at eight descendant nodes covering every divergent-actin clade PAINT has
      curated, while ten human genes still receive it from PTN000940351: four conventional muscle
      actins plus ACTL9, ACTL10, ACTR10 and ACTRT1-3.
    supporting_text: 'and then **negated on descent at 8 nodes**:'
  - statement: >-
      ACTL10 orthologue lengths do not follow the phylogeny; in four of four sister-taxon pairs
      tested, two members of one mammalian family carry different annotated lengths, which is what
      first indicated a gene-model rather than a biological explanation.
    supporting_text: If the variation were biological it would track the species tree. It does not
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by the committed analyze_actl10.py; a fresh run was verified to reproduce both
      RESULTS.md and results.json byte-for-byte, so the report cannot silently diverge from the
      code. The script asserts that it reproduces the committed ACTL8 analysis's
      filament-interface tallies on three shared rows before drawing any conclusion, and that
      guard was tested by deliberately breaking it in two ways. Every quoted span was grep-checked
      as a verbatim substring.
