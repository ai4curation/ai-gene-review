- term:
    id: GO:0003100
    label: regulation of systemic arterial blood pressure by endothelin
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000356323
  - UniProtKB:P05305
  - UniProtKB:P14138
  - UniProtKB:P20800
  review:
    summary: Synthetic ET-2 produces pressor responses; endothelin family role in systemic blood pressure.
    action: KEEP_AS_NON_CORE
    reason: Synthetic human ET-2 is a strong vasoconstrictor and pressor peptide in vivo (PMID:2649896), and the
      PAINT node PTN000356323 places this term at the root of the endothelin family. The contribution of endogenous
      EDN2 (as opposed to EDN1) to systemic arterial blood pressure has not been established; Edn2-null mice show
      growth, thermoregulatory, lung and ovulatory phenotypes (PMID:23676500, PMID:24763822). Kept as non-core.
    supported_by: &id001
    - reference_id: PMID:2649896
      supporting_text: Synthetic ET-1, ET-2, and ET-3 were prepared according to the deduced amino acid sequences,
        and the biological activities were assayed by contraction of isolated porcine coronary artery strips and
        by intravenous injection to anesthetized rats. All these synthetic peptides produced strong vasoconstrictor
        and pressor responses.
