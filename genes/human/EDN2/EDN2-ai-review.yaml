core_functions:
- description: Secreted peptide hormone that binds and activates EDNRA and EDNRB with ET-1-like affinity, initiating
    Gq/11-phospholipase C-activating endothelin receptor signalling that raises cytosolic calcium and drives smooth
    muscle contraction (vasoconstriction and, distinctively, ovarian follicle-wall contraction at ovulation).
  molecular_function:
    id: GO:0005179
    label: hormone activity
  directly_involved_in:
  - id: GO:0086100
    label: endothelin receptor signaling pathway
  - id: GO:0160135
    label: phospholipase C-activating endothelin receptor signaling pathway
  - id: GO:0042310
    label: vasoconstriction
  - id: GO:0045987
    label: positive regulation of smooth muscle contraction
  - id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:1917960
    supporting_text: Upon incubation with cultured cells, the mass contents of inositol 1,4,5-trisphosphate and
      intracellular calcium level were substantially increased by 10 nM ET-1, ET-2, and ET-3, but not by big-ET
  - reference_id: PMID:2649896
    supporting_text: Synthetic ET-1, ET-2, and ET-3 were prepared according to the deduced amino acid sequences,
      and the biological activities were assayed by contraction of isolated porcine coronary artery strips and by
      intravenous injection to anesthetized rats. All these synthetic peptides produced strong vasoconstrictor and
      pressor responses.
suggested_questions:
- question: Should EDN2 be annotated to ovulation (GO:0030728), given that granulosa-cell EDN2 triggers EDNRA-dependent
    follicle-wall contraction and its loss impairs follicle rupture in mice, or does GO reserve that process for
    the effectors of follicle rupture?
- question: Does endogenous EDN2 contribute to systemic arterial blood pressure in humans, or are its pressor effects
    pharmacological, with blood-pressure control carried by EDN1?
- question: The receptor-specific binding term endothelin B receptor binding sits at the endothelin PAINT node PTN000356323;
    should the node carry receptor ligand activity (hormone activity) instead, as for other ligand families in the
    LIGANDS_IN_SIGNALING project?
suggested_experiments:
- hypothesis: Human granulosa-cell EDN2 is required for follicle rupture, as in mice.
  description: Measure EDN2 expression timing in human periovulatory follicles and test EDNRA-selective antagonists
    on contraction of human follicle-wall explants.
  experiment_type: Ex vivo tissue contraction assay with receptor-selective antagonists
