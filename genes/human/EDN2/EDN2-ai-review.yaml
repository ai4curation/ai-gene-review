id: P20800
gene_symbol: EDN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Endothelin-2 (EDN2) encodes a 178-residue preproprotein that is processed into the secreted 21-amino-acid
  bicyclic peptide endothelin-2 ([Trp6,Leu7]endothelin, ET-2), which differs from endothelin-1 at two positions.
  Mature ET-2 acts in the extracellular space as a high-affinity agonist of both endothelin receptors, EDNRA (ETA)
  and EDNRB (ETB), with affinities equal to ET-1, activating Gq/11-phospholipase C signalling, IP3 production and
  cytosolic calcium rise in target cells. ET-2 is a potent constrictor of vascular and other smooth muscle and is
  positively inotropic on human myocardium. Unlike the widely expressed ET-1, ET-2 is produced in restricted sites
  such as the intestine, lung and the granulosa cells of periovulatory ovarian follicles, where its transient release
  contracts the follicle wall through EDNRA to trigger follicle rupture at ovulation. In mice, loss of Edn2 causes
  impaired ovulation and, globally, growth retardation, hypothermia, internal starvation and emphysema with juvenile
  lethality. ET-2 also acts as a chemoattractant and activator for macrophages through EDNRB.
