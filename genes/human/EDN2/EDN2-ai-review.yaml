    label: angiogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P22389
  - ensembl:ENSMUSP00000030384
  review:
    summary: Projected from a mouse retinal Edn2 overexpression study in which excess Edn2 inhibited angiogenesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse source (PMID:24043815) shows that constitutive ectopic overexpression of Edn2 inhibits retinal
      angiogenesis indirectly, through EDNRA-dependent factors made by the neural retina. This is a gain-of-function
      perturbation, not evidence that endogenous EDN2 takes part in angiogenesis, and the effect is the opposite
      of promotion.
    supported_by:
    - reference_id: PMID:24043815
      supporting_text: Here, we report that constitutive overexpression of Endothelin-2 (Edn2) in the mouse retina
        perturbs vascular development by inhibiting endothelial cell migration across the retinal surface and subsequent
        endothelial cell invasion into the retina.
