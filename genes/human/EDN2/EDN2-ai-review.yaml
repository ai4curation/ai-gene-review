  findings:
  - statement: EDN2 contracts rat oviduct through ETA, not ETB.
    supporting_text: Isometric tension analysis indicated that EDN2 was a potent oviductal constrictor and that
      the contractile effect of EDN2 was mediated by the ET(A) and not the ET(B) receptor subtype.
- id: PMID:23676500
  title: Endothelin-2 deficiency causes growth retardation, hypothermia, and emphysema in mice.
  findings:
