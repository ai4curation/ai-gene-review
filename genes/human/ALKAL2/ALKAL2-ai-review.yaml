suggested_questions:
- question: Does native human ALKAL2 activate ALK as a Cys66 disulfide-linked dimer or as a monomer? Cys66
    is primate-specific, so the answer affects whether the mechanism transfers to non-primate orthologs
    (e.g. equids).
- question: GO:0030298 'receptor signaling protein tyrosine kinase activator activity' derives from obsolete
    GO:0004716 (cytoplasmic kinases downstream of a receptor) yet is used for ligands of transmembrane
    RTKs such as ALK. Should it be merged into or clarified against GO:0030297?
suggested_experiments:
- description: Compare ALK activation by wild-type ALKAL2 and a C66 mutant (or a non-primate ortholog
    lacking Cys66) at physiological ligand concentrations on primary neural crest-derived cells, to resolve
    the dimer versus monomer activation mechanism in a native context.
  experiment_type: biochemical/cell-based receptor activation assay
