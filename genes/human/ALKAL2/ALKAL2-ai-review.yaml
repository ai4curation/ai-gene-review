      mapping, Cys66-mediated dimerization, activity of the augmentor-domain fragment on ALK and LTK,
      MAPK and neurite outgrowth readouts.'
- id: PMID:34646012
  title: Structural basis of cytokine-mediated activation of ALK family receptors.
  findings:
  - statement: ALKAL2 drives ALK-dependent Ba/F3 cell proliferation.
    supporting_text: ALKAL1- and ALKAL2-dependent proliferation of Ba/F3 cells expressing ALK.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Crystal structures of ALK/LTK cytokine complexes; reports ALKAL2 as
      a monomeric three-helix bundle; ALK-dependent Ba/F3 proliferation; heparin effects are on ALK, not
      ALKAL2.
- id: PMID:34819673
  title: Mechanism for the activation of the anaplastic lymphoma kinase receptor.
  findings:
  - statement: ALKAL2 is anchored to the membrane through its alpha1 helix, which is required for ALK
      activation.
    supporting_text: Our data provide strong evidence for the key role of the ALKAL2 α1 helix in ALK activation,
      presumably by anchoring ALKAL2 to the membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Cryo-EM/NMR/X-ray of ALK-ECR with ALKAL2; dimeric-ligand model; ALKAL2
      alpha1 helix contacts the membrane and is required for ALK activation (KDKFLKH->EDEFLEE mutant).
