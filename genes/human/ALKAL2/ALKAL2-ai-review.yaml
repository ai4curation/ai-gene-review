    label: receptor signaling protein tyrosine kinase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002010604
  - UniProtKB:Q6UX46
  - UniProtKB:Q6UXT8
  - ZFIN:ZDB-GENE-100922-116
  - ZFIN:ZDB-GENE-110411-243
  - ZFIN:ZDB-GENE-111115-2
  review:
    summary: PAINT IBA from node PTN002010604 (ALKAL1/ALKAL2 clade), grounded by human ALKAL2 and ALKAL1
      and zebrafish alkal genes.
    action: MODIFY
    reason: 'ALKAL2 binds the extracellular region of the transmembrane receptor tyrosine kinases ALK
      and LTK and activates them, which is established directly in human cells and with purified human
      proteins. The essence of the annotation is therefore sound, but GO:0030298 is the wrong sibling:
      its ''receptor signaling protein tyrosine kinase'' wording derives from obsolete GO:0004716 ''signal
      transducer, downstream of receptor, with protein tyrosine kinase activity'' (whose exact synonym
      is ''receptor signaling protein tyrosine kinase activity''), i.e. cytoplasmic kinases acting downstream
      of a receptor. ALK and LTK are themselves transmembrane receptor tyrosine kinases, so the correct
      term is the sibling GO:0030297 transmembrane receptor protein tyrosine kinase activator activity
      (directly positively regulates GO:0004714). This is a lateral correction, not a refinement; the
      receptor-ligand character is also captured by GO:0005125 cytokine activity. The PAINT node placement
      itself is sound: both vertebrate ALKAL subfamilies (PTHR28676:SF1 and SF2) have experimental ligand
      activity, and human ALKAL2 appears among the donors because its own experimental annotation grounds
      the node.'
    proposed_replacement_terms:
    - &id010
      id: GO:0030297
      label: transmembrane receptor protein tyrosine kinase activator activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002010604
        source_status: SUPPORTS_TRANSFER
        comment: ALKAL ancestral node spanning PTHR28676 SF1 (ALKAL1) and SF2 (ALKAL2); placement is sound
          because both human paralogs activate ALK/LTK experimentally. The issue is only the choice of
          sibling term (GO:0030298 vs GO:0030297).
      - source_id: UniProtKB:Q6UX46
        source_status: SUPPORTS_TRANSFER
        comment: The target's own experimental annotation grounds the node; expected, not circular.
      - source_id: UniProtKB:Q6UXT8
        source_status: SUPPORTS_TRANSFER
        comment: Human ALKAL1 (SF1) ligand activity toward LTK/ALK supports placing the activity at the
          shared node.
    supported_by:
    - *id009
    - &id012
      reference_id: PMID:26630010
      supporting_text: AUG-α binds and robustly activates both ALK and LTK
