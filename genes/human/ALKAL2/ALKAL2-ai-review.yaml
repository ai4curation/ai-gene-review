id: Q6UX46
gene_symbol: ALKAL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALKAL2 (ALK and LTK ligand 2; also FAM150B or augmentor-alpha) is a small secreted cytokine
  of the ALKAL family. After removal of its signal peptide, the mature protein has a variable N-terminal
  region and a C-terminal augmentor domain, a three-helix bundle held together by two intramolecular disulfide
  bonds. ALKAL2 binds the extracellular regions of the receptor tyrosine kinases ALK and LTK and activates
  both. It is the more potent of the two human ALKAL ligands toward ALK, whereas ALKAL1 acts mainly on
  LTK. Cryo-EM and crystal structures show that ALKAL2 binding drives receptor dimerization and makes
  the receptor extracellular region lie flat against the cell surface. A positively charged helix in ALKAL2
  then contacts the membrane, and this contact is needed for full ALK activation. Whether ALKAL2 acts
  as a disulfide-linked dimer (through the primate-specific Cys66) or as a monomer is disputed between
  studies. Receptor activation leads to tyrosine phosphorylation and to MAPK (ERK1/2, ERK5) signaling.
  In ALK-expressing cell lines this signaling promotes neurite outgrowth, transformation and cytokine-independent
  proliferation. ALKAL2 is broadly expressed, with the highest levels in the adrenal gland. It lies in
  the chromosome 2p region that is often gained in neuroblastoma, and overexpressing it in mice potentiates
  MYCN-driven neuroblastoma in an ALK-dependent manner.
