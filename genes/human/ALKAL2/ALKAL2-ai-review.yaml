- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:34819673
  qualifier: located_in
  review:
    summary: After binding ALK, ALKAL2 associates with the cell membrane through its positively charged
      alpha1 helix; mutating that helix (KDKFLKH->EDEFLEE) abolishes membrane association and impairs
      ALK activation.
    action: MODIFY
    reason: The location is right but general. ALKAL2 is a secreted ligand that associates peripherally
      with the outer (extracellular) face of the plasma membrane, via electrostatic attraction to the
      negatively charged lipid surface, while bound to ALK. It has no transmembrane segment. GO:0009897
      external side of plasma membrane (part_of plasma membrane) states this more precisely.
    proposed_replacement_terms:
    - &id003
      id: GO:0009897
      label: external side of plasma membrane
    supported_by:
    - &id004
      reference_id: PMID:34819673
      supporting_text: Our data provide strong evidence for the key role of the ALKAL2 α1 helix in ALK
        activation, presumably by anchoring ALKAL2 to the membrane.
    - reference_id: PMID:34819673
      supporting_text: The rearrangement of ALK-ECRABR upon ALKAL2 binding described above could be further
        stabilized by electrostatic attraction between ALKAL2’s positively charged surface and the membrane’s
        negatively charged surface
