id: Q6NUM6
gene_symbol: TYW1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TYW1B is a human paralogue of the tRNA 4-demethylwyosine synthase TYW1. The two proteins
  are about 96% identical, and TYW1B is encoded on chromosome 7. TYW1B shares TYW1's
  domain layout: an N-terminal flavodoxin-like domain and a C-terminal radical
  S-adenosyl-L-methionine (SAM) domain with an intact CX3CX2C [4Fe-4S]-binding motif. In
  TYW1 and its yeast and archaeal orthologues, these domains catalyse the pyruvate-dependent
  conversion of N1-methylguanosine 37 in tRNA(Phe) into 4-demethylwyosine, the second step
  of wybutosine biosynthesis. Canonical TYW1B differs from TYW1 at the cofactor sites. It
  lacks the flavodoxin phosphate-binding loop that binds FMN in TYW1. In place of the
  segment with two of the three cysteines that coordinate the auxiliary, pyruvate-binding
  [4Fe-4S] cluster, it has an alternative sequence. No experimental study of TYW1B
  activity, localisation or physiological role has been reported. Whether TYW1B makes any
  contribution to wybutosine synthesis, or is a catalytically impaired copy of TYW1, is
  unknown.
