- term:
    id: GO:0102521
    label: tRNA-4-demethylwyosine synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:36347
  - EC:4.1.3.44
  review:
    summary: >-
      Combined IEA from the UniProt EC 4.1.3.44 / RHEA:36347 assignment. That assignment is
      itself by similarity to yeast Tyw1 (ECO:0000250). No experimental activity has been
      reported for TYW1B.
    action: UNDECIDED
    reason: >-
      The reaction needs pyruvate bound at the auxiliary [4Fe-4S] cluster (PMID:23043105,
      PMID:36326713). Canonical TYW1B lacks two of that cluster's three cysteine ligands and
      the FMN phosphate-binding loop (file:human/TYW1B/TYW1B-bioinformatics/RESULTS.md).
      Loss of TYW1 alone abolishes OHyW in human ES cells (PMID:38706838). Together these
      make full activity unlikely, but none of it is a direct test of TYW1B. With no
      experiment either way, the row is UNDECIDED rather than ACCEPT (which would rest on
      transfer by similarity alone) or REMOVE (which would rest on inference alone).
    supported_by:
    - reference_id: file:human/TYW1B/TYW1B-uniprot.txt
      supporting_text: Evidence={ECO:0000250|UniProtKB:Q08960};
    - reference_id: file:human/TYW1B/TYW1B-bioinformatics/RESULTS.md
