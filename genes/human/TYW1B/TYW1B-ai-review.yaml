- term:
    id: GO:0031591
    label: wybutosine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000358104
  - SGD:S000006128
  review:
    summary: >-
      PAINT IBA from PTN000358104, grounded in yeast Tyw1. TYW1B is a very recent duplicate
      of TYW1, so it falls inside the clade that inherited the function. However, there is
      TYW1B-specific sequence divergence at the catalytic cofactor sites.
    action: UNDECIDED
    reason: >-
      The node placement is sound for TYW1, and TYW1B is phylogenetically inside it. An IBA
      can still be challenged where there is target-specific evidence of divergence. Here,
      canonical TYW1B has lost two of the three auxiliary [4Fe-4S]-cluster cysteines
      (TYW1 C381 and C394, which align to the Pyrococcus abyssi ligands). In the archaeal
      enzyme that cluster binds the pyruvate cosubstrate (PMID:23043105). TYW1B has also
      lost the flavodoxin phosphate-binding loop. No TYW1B activity or knockout data exist.
      In TYW1-knockout human ES cells OHyW is undetectable (PMID:38706838), so TYW1B does not
      make up for TYW1 loss in those cells, if the knockout was paralogue-specific. The
      sequence and genetic evidence argue against participation without disproving it, so
      the row is UNDECIDED rather than REMOVE.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000358104
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The TYW1-family ancestral node is well placed, with yeast Tyw1 experimentally
          required for yW. TYW1B descends from it through a recent duplication of TYW1. In
          canonical TYW1B, the auxiliary-cluster cysteines (TYW1 C381/C394) and the
          flavodoxin phosphate-binding loop are replaced, so possible loss of activity is
          specific to the target. The divergence is inferred from sequence and has not been
          tested.
      - source_id: SGD:S000006128
        source_label: TYW1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Yeast Tyw1 is the experimental donor. It keeps all the cofactor motifs that
          canonical TYW1B lacks.
    supported_by:
    - reference_id: file:human/TYW1B/TYW1B-bioinformatics/RESULTS.md
      supporting_text: In TYW1B, C381 aligns to P325 and
        C394 has no counterpart; only C407 (TYW1B C343) is retained.
    - reference_id: PMID:23043105
