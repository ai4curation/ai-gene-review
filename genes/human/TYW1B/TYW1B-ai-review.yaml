core_functions: []
knowledge_gaps:
- gap_statement: >-
    It is unknown whether TYW1B is made as a stable protein with any tRNA
    4-demethylwyosine synthase activity, or whether it is a catalytically impaired copy of
    TYW1 with no role in wybutosine biosynthesis.
  boundary: >-
    TYW1B is about 96% identical to TYW1 and keeps the radical SAM cysteine triad. Canonical
    TYW1B lacks the flavodoxin FMN phosphate-binding loop and two of the three
    auxiliary-cluster cysteines. In human ES cells, knockout of TYW1 alone abolishes
    hydroxywybutosine. No biochemical or genetic study of TYW1B exists, and its catalytic
    activity is annotated only by similarity to yeast Tyw1.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    This decides whether TYW1B is a second human wybutosine enzyme, possibly redundant with
    TYW1 in some tissues, or a non-functional paralogue. That in turn affects how TYW1
    deficiency and TYW1B variants found in genomic studies should be interpreted.
  resolution: >-
    Detect TYW1B-specific peptides in human tissue. Express and reconstitute recombinant
    TYW1B and assay imG-14 formation on m1G37-tRNA(Phe). Complement TYW1-null human cells
    with TYW1B and measure OHyW by LC-MS.
  provenance:
  - reference_id: file:human/TYW1B/TYW1B-bioinformatics/RESULTS.md
    supporting_text: On this sequence evidence alone, canonical TYW1B is not expected to
      have the full tRNA 4-demethylwyosine synthase activity of TYW1.
  - reference_id: file:human/TYW1B/TYW1B-uniprot.txt
    supporting_text: Evidence={ECO:0000250|UniProtKB:Q08960};
suggested_questions:
- question: >-
    Is a TYW1B protein, distinguishable from TYW1 by unique peptides, detectable in any
    human tissue? Do any TYW1B transcripts keep the TYW1-like exons that encode the FMN
    loop and the auxiliary-cluster cysteines?
- question: >-
    Did the TYW1 knockout in hESCs (PMID:38706838) leave TYW1B intact? If so, does TYW1B
    lack activity, or is it simply not expressed in ES cells?
- question: >-
    Is TYW1B conserved as a separate gene outside great apes, or is it a recent
    duplication that is decaying?
suggested_experiments:
- hypothesis: Canonical TYW1B cannot form imG-14 because it lacks auxiliary-cluster
    ligands.
  description: >-
    Anaerobically reconstitute recombinant TYW1B and TYW1 side by side. Measure iron, sulfide
    and FMN content, and do EPR for cluster number. Assay pyruvate-dependent imG-14
    formation on m1G37-tRNA(Phe) by LC-MS. Include TYW1B with the TYW1 auxiliary-cluster
    segment restored as a gain-of-function control.
  experiment_type: in vitro enzymology
- hypothesis: TYW1B does not restore wybutosine synthesis in TYW1-null human cells.
  description: >-
    Express TYW1B or TYW1 cDNA in TYW1-knockout cells that have been checked for an intact
    TYW1B locus. Quantify OHyW and imG-14 in tRNA(Phe) by LC-MS/MS.
  experiment_type: genetic complementation
