suggested_questions:
- question: GO has no neural plate border formation/specification term; GO:0014029 neural crest formation is used for border
    specifiers (Msx1, Pax3, Zic1, Gbx2, Hes4). Should a dedicated border term be created, given that Msx genes also contribute
    to epidermal and non-crest border derivatives?
- question: No Msx protein in any species carries a neural crest process term, although frog loss- and gain-of-function data
    (Tribulo 2003, Monsoro-Burq 2005, Khadka 2006) are strong. Should the X. laevis msx1.L/msx1.S TrEMBL entries receive the
    IMP rows directly, rather than relying on ISS to human?
- question: In mouse, Msx1/Msx2 double mutants form crest but show cranial/cardiac crest mispatterning, migration delay and
    apoptosis (PMID:16221730). Do mammals use Msx genes at the border at all, or has the requirement shifted to later crest
    development (e.g. GO:0014032 or GO:0001755 by IGI)?
- question: The human inner ear development rows derive from a mouse IMP to Satokata and Maas 1994, whose abstract reports
    middle ear (malleus) defects. Is GO:0048839 a mis-mapping for GO:0042474 middle ear morphogenesis?
- question: Mouse Msx1 GO:0001837 epithelial to mesenchymal transition is sourced to PMID:11023873, a tissue-recombination
    study of epithelial-mesenchymal interactions. Should the mouse source annotation be reviewed?
- question: Is MSX1 acting as a repressor at the neural plate border (as in tooth), and what are its direct targets there
    (pax3, zic1)? Is the border activity DNA-binding dependent?
suggested_experiments:
- description: CUT&RUN for endogenous Msx1 in gastrula/neurula Xenopus border explants to test whether Msx1 directly occupies
    pax3 and zic1 regulatory elements, and whether it binds crest specifier enhancers (which would justify GO:0014034).
- description: Replace Xenopus msx1 with amphioxus Msx in the msx1 morphant rescue and animal-cap induction assays to separate
    protein evolution from cis-regulatory evolution of the border-to-crest link.
- description: Conditional Msx1/Msx2 deletion in mouse neural plate border ectoderm (before crest specification) to test whether
    mammals require Msx genes for crest induction, scoring Pax3, Snai2, Sox10 and Foxd3.
