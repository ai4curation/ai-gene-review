- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: ISS
  original_reference_id: PMID:15691759
  review:
    summary: 'Msx1 is a BMP-responsive neural plate border specifier: induced at the border by intermediate BMP levels, it
      activates pax3 and zic, and through them the crest specifiers, and it is required for neural crest formation (Xenopus).'
    action: NEW
    reason: 'Synthesis across lines of evidence (all in Xenopus or mouse; human is the project proxy). (1) Expression: msx1
      is a direct BMP target expressed in the neural folds at an intermediate BMP level (Tribulo 2003). (2) Gain of function:
      inducible msx1 induces snail, slug and foxd3; in neuralized ectoderm Msx1 is sufficient for multiple early crest genes
      and induces Pax3 and Zic cell-autonomously (Monsoro-Burq 2005). (3) Loss of function: dominant-negative Msx and msx1/msx2
      morpholinos abolish crest markers, with Msx1/Msx2 compensating each other (Tribulo 2003; Khadka 2006). (4) Epistasis:
      Pax3 acts downstream of Msx1; snail/slug rescue the Msx dominant negative; Gbx2 is upstream of Msx1. (5) Conservation:
      amphioxus Msx is expressed at the neural plate edge and is BMP-responsive (Yu 2008), so the border role is ancestral.
      Network layer: border specifier, upstream of Pax3/Zic1. GO:0014029 (formation of the border region of ectoderm) fits
      this, as for pax3-a, zic1, gbx2 and hes4-a. GO:0014036 would overstate it, and GO:0014034 is not added because, unlike
      Pax3/Zic1, Msx1 has not been shown to bind crest specifier enhancers. Participation: Msx1 is a transcription factor
      acting inside the border cells, not a signal or substrate. Comparator check (QuickGO 2026-10-05): no Msx protein in
      any species (human, mouse, chicken, zebrafish, X. laevis, X. tropicalis) carries any neural crest branch term under
      any evidence; the frog msx entries are TrEMBL with only IBA rows. Same-layer peers pax3-a, zic1 and hes4-a carry GO:0014029
      by IMP, so the absence is an uncurated literature gap, not a convention. Evidence is ISS from Xenopus; in mammals Msx1/Msx2
      double mutants form crest but show cranial/cardiac crest patterning and survival defects.'
    additional_reference_ids:
    - PMID:14627721
    - PMID:16586351
    - PMID:19736322
    - PMID:18562679
    - PMID:16221730
    supported_by:
    - reference_id: PMID:14627721
