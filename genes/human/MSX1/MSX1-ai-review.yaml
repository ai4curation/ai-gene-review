id: P28360
gene_symbol: MSX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MSX1 (Msh homeobox 1, formerly HOX7) is a nuclear homeodomain transcription factor of the Msh/Msx family. It
  binds TAAT-core DNA elements and acts mainly as a transcriptional repressor of RNA polymerase II genes, both through sequence-specific
  binding (with cofactors such as PIAS1 that target it to repressed loci at the nuclear periphery) and through contacts with
  the basal transcription machinery; in some contexts it activates targets (e.g. Stra8 in fetal germ cells). MSX1 is expressed
  at sites of epithelial-mesenchymal interaction, notably the neural crest-derived mesenchyme of the face, dental papilla,
  palate, limb bud and nail bed, and it is induced by BMP signalling. In tooth development it is required in the dental mesenchyme
  for progression beyond the bud stage, sustaining mesenchymal BMP4 expression and later restraining premature odontoblast
  differentiation by repressing Bmp2, Bmp4 and Lef1. Heterozygous loss-of-function variants cause selective tooth agenesis
  (oligodontia), sometimes with cleft lip/palate, and Witkop tooth-and-nail syndrome; Msx1-null mice have cleft secondary
  palate, arrested tooth buds and craniofacial bone defects. Earlier in development, Msx genes are BMP-responsive neural plate
  border specifiers: in frog embryos Msx1 acts upstream of Pax3 and Zic to initiate neural crest formation, and in mouse Msx1
  and Msx2 together are needed for patterning and survival of cranial and cardiac neural crest. Msx expression at the edge
  of the neural plate is shared with amphioxus, indicating that this border role predates vertebrates.'
