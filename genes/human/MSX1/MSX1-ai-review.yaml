  evidence_type: IDA
  original_reference_id: PMID:15705871
  qualifier: involved_in
  review:
    summary: IDA from the p53/apoptosis overexpression study; any cell shape change reflects apoptosis in cancer cells, not
      a developmental role.
    action: MARK_AS_OVER_ANNOTATED
    reason: Single study (Park et al. 2005) in which Msx1 was overexpressed in cancer cell lines and xenografts; the cached
      record is abstract-only. No developmental or loss-of-function evidence ties endogenous MSX1 to p53 signalling, and MSX1
      mutations cause tooth/craniofacial phenotypes, not p53-related ones. A cell morphogenesis annotation from apoptotic
      or growth-arrest morphology overstates the biology. Kept as over-annotated rather than removed because the full text
      was not seen.
    supported_by:
    - reference_id: PMID:15705871
      supporting_text: Overexpression of homeobox Msx1 induced apoptosis of cancer cells harboring nonfunctional wild-type
        p53 and suppressed growth of human tumor xenografts in nude mice.
