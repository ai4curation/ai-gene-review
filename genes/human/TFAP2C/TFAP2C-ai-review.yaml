taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Transcription factor AP-2 gamma (AP-2gamma, TFAP2C; also known as ERF-1) is a nuclear, sequence-specific DNA-binding
  transcription factor of the AP-2 family. It binds GC-rich GCC(N3)GGC-type elements as a homodimer or as a heterodimer with
  other AP-2 proteins (notably AP-2alpha), using a basic region and a C-terminal helix-span-helix dimerization domain, and
  an N-terminal proline-rich domain mediates transactivation. It mainly activates RNA polymerase II target genes, with the
  coactivators CITED2 and p300/CBP, and represses selected targets such as SOD2 and CDKN1A. KCTD1, SUMOylation on Lys-10 and
  cytoplasmic retention by WWOX restrain its activity. AP-2gamma is a lineage regulator of early mammalian development. In
  the embryo it activates trophectoderm genes and is required for trophoblast and placental development, and in human trophoblast
  stem cells it primes extravillous trophoblast enhancers. In the germ line it acts with SOX17, PRDM1 and GATA3/2 to specify
  primordial germ cells, inducing SOX17 and OCT4 and suppressing somatic fates, and it maintains early germ cells. In the
  vertebrate embryonic ectoderm it is expressed in non-neural ectoderm and transiently at the neural plate border, where,
  as a partner of AP-2alpha, it contributes to border induction and is required together with AP-2alpha for neural crest induction;
  it is later replaced by AP-2beta in crest progenitors and persists in the epidermis. It also acts redundantly with AP-2alpha
  in epidermal differentiation, and in mammary epithelium and cortical progenitors. In breast cancer it regulates luminal
  genes including ESR1, FOXA1 and RET, and it is highly expressed in seminoma and other germ cell tumours.
