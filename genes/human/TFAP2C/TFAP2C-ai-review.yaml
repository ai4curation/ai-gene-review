    supporting_text: ERF-1 activates ER gene transcription by binding to the imperfect palindrome CCCTGCGGGG within the promoter
      of the ER gene
  - reference_id: PMID:11278550
    supporting_text: another AP-2-responsive gene, c-erbB-3, was transactivated by AP-2
  - reference_id: PMID:22735262
