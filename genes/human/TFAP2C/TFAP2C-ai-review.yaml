suggested_questions:
- question: Chick knockdown places TFAP2C upstream of MSX1/PAX7/ZIC1/GBX2, whereas in zebrafish tfap2a/tfap2c double loss
    leaves pax3/msxb/zic2b intact. Is the AP-2 position relative to the other border genes species-specific, and does it matter
    for GO:0014029 versus a future neural plate border term?
- question: Zebrafish tfap2c carries GO:0014036 by IGI from double knockdown with tfap2a. Should IGI-based specification terms
    be propagated to TFAP2C orthologs when single-paralog data (chick) place TFAP2C before specification?
- question: Should the TFAP2A-TFAP2C heterodimer (and TFAP2A-TFAP2B) be represented as complexes, or should the partner switch
    be captured only as GO-CAM causal edges (TFAP2A/C activates TFAP2B; TFAP2B represses TFAP2C)?
- question: Epidermis development and mammary gland roles of AP-2gamma rest mainly on combined Tfap2a/Tfap2c mouse knockouts.
    Should these be annotated to TFAP2C (IGI) given the redundancy?
- question: 'The IMP to negative regulation of gene expression, epigenetic (PMID:24413532) needs full-text review: does TFAP2C
    loss cause epigenetic silencing of ESR1, or is TFAP2C the activating partner of MTA1?'
suggested_experiments:
- description: Single and combined TFAP2A/TFAP2C knockout in human pluripotent stem cell-derived neural plate border and cranial
    neural crest models, with CUT&RUN for each paralog, to test whether the chick TFAP2A/C to TFAP2A/B partner switch operates
    in human.
- description: Map TFAP2B occupancy and enhancer deletion at the TFAP2C locus in chick or human crest models to test whether
    TFAP2B repression of TFAP2C is direct.
- description: Test whether lamprey AP-2 paralogs show a TFAP2C-like transient border expression and a TFAP2B-like crest expression,
    to date the subfunctionalisation of border and crest AP-2 roles.
