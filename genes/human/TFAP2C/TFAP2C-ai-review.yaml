- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: ISS
  original_reference_id: PMID:31848212
  review:
    summary: AP-2gamma is a gastrula-stage neural plate border factor. In chick it is enriched at the border, heterodimerises
      with TFAP2A, co-occupies most TFAP2A border-induction peaks, and is required for border gene expression (MSX1, PAX7,
      ZIC1, GBX2) but not for crest specification genes; it is then lost from the crest. In zebrafish, tfap2a and tfap2c together
      are cell-autonomously required during gastrulation for crest induction.
    action: NEW
    reason: 'Human TFAP2C has no neural crest term. Layer: border, not crest specifier. TFAP2C acts only during border induction
      and is switched off in crest progenitors by TFAP2B; its knockdown leaves specification genes unaffected and it cannot
      replace TFAP2B in specification. The term is therefore GO:0014029 (formation of the ectodermal border region) rather
      than GO:0014034/GO:0014036, matching the project convention for border genes and the TFAP2A review. Participation: TFAP2C
      is a DNA-binding TF that co-occupies border enhancers with TFAP2A as a heterodimer, so it does part of the work. Comparator
      (QuickGO 2026-10-08): zebrafish tfap2c carries GO:0014032 (IGI) and GO:0014036 (IGI); zebrafish and mouse Tfap2a carry
      crest terms; no TFAP2B/C/D/E in human, mouse, rat, chicken or Xenopus carries any, and mouse Tfap2c nulls die before
      crest forms. So the absence is a coverage gap. GO:0014036 on zebrafish tfap2c comes from double knockdown with tfap2a
      and is not transferred, because chick data place TFAP2C itself before specification. ISS because the evidence is from
      chick and zebrafish orthologs; the role is shared redundantly with TFAP2A.'
    supported_by:
    - reference_id: PMID:31848212
      supporting_text: although TFAP2C was enriched at the neural plate border, it was lost in the neural crest lineage at
        later stages and its expression became restricted to the presumptive epidermis
    - reference_id: PMID:31848212
      supporting_text: TFAP2C knockdown during induction resulted in a down-regulation of the neural plate border markers
        MSX1, PAX7, ZIC1, and GBX2 but had no significant effects on the expression of specification genes FOXD3, ETS1, SOX9,
        and SOX10
    - reference_id: PMID:31848212
      supporting_text: TFAP2A/C heterodimers mediate neural plate border induction, whereas TFAP2A/B heterodimers promote
        neural crest specification
    - reference_id: PMID:31848212
      supporting_text: Pulldown of TFAP2A with streptavidin beads resulted in co-IP of both FLAG-tagged TFAP2B and TFAP2C,
        confirming that these factors form heterodimers in avian embryos
    - reference_id: PMID:31848212
      supporting_text: overexpression of TFAP2C does not adequately rescue the expression of specification genes
    - reference_id: PMID:17258188
      supporting_text: simultaneous inhibition of tfap2a and tfap2c utterly prevents neural crest induction, supporting a
        conserved role for Tfap2-type activity in neural crest induction
    - reference_id: PMID:17258188
      supporting_text: Because tfap2c expression is rapidly down regulated in neural crest, Tfap2a/c function in neural crest
        induction must occur during gastrula stage.
- term:
    id: GO:0007281
    label: germ cell development
  evidence_type: IMP
  original_reference_id: PMID:31875561
  review:
    summary: 'TFAP2C is a core component of the human primordial germ cell specification circuit: TFAP2C-null hESCs fail to
      make hPGCLCs, TFAP2C acts upstream of PRDM1 to induce SOX17 and to block somatic fates, it binds and requires the OCT4
      naive enhancer, and with GATA3/2 and SOX17 it is sufficient to induce hPGCLCs. In mouse, PGCs are specified without
      Tfap2c but are lost by E8.0.'
    action: NEW
    reason: 'Human TFAP2C has no germline process term despite direct human loss- and gain-of-function evidence. Participation:
      TFAP2C is the DNA-binding TF that activates SOX17/OCT4 regulatory elements and represses somatic programmes in the nascent
      germ line. Comparator (QuickGO 2026-10-08): mouse Prdm1 carries GO:0007281 (IGI) and mouse Tfap2c carries GO:0030718
      germ-line stem cell population maintenance (IMP, PMID:19776388); human PRDM1 and SOX17 carry no germ cell term, so this
      is a coverage gap. GO:0007281 (from formation of the PGC onwards) is chosen because GO has no primordial germ cell specification
      term.'
    supported_by:
    - reference_id: PMID:31875561
      supporting_text: TFAP2C functions in the TFAP2A+ progenitors upstream of PRDM1 to regulate the expression of SOX17
    - reference_id: PMID:31875561
      supporting_text: This serves to protect hPGCLCs from crossing the Weismann's barrier to adopt somatic cell fates
    - reference_id: PMID:30590035
      supporting_text: deleting the TFAP2C-bound naive enhancer at the OCT4 locus (also called POU5F1) results in impaired
        OCT4 expression and a negative effect on hPGCLC identity
    - reference_id: PMID:33608411
      supporting_text: GATA3 or GATA2, immediate BMP effectors, combined with SOX17 and TFAP2C, generated hPGCLCs
    - reference_id: PMID:19776388
      supporting_text: In the mutant animals, PGCs were specified but were lost around E 8.0.
- term:
    id: GO:0001829
    label: trophectodermal cell differentiation
  evidence_type: ISS
  original_reference_id: PMID:38243114
  review:
    summary: AP-2gamma is a trophectoderm/trophoblast lineage TF. In mouse it binds late TE genes with CDX2 in blastocysts
      and later extra-embryonic ectoderm genes, and loss of Tfap2c causes extra-embryonic failure and lethality at E7.5. In
      human trophoblast stem cells it is the early-stage TF that pre-occupies extravillous trophoblast enhancers.
    action: NEW
    reason: Mouse Tfap2c carries GO:0001829 by IMP (PMID:20404091, PMID:38243114; QuickGO 2026-10-08), but human TFAP2C received
      only the ICM and morula IEAs. The trophectoderm role is the best-established in vivo function of the gene in mammals,
      and human TSC data show the same lineage-regulator behaviour. ISS from mouse.
    supported_by:
    - reference_id: PMID:38243114
      supporting_text: Upon trophoblast commitment, TFAP2C left early ICM genes but acquired binding to late TE genes in blastocysts,
        where it co-bound with CDX2
    - reference_id: PMID:26811378
      supporting_text: Loss of TFAP2C in mouse leads to developmental defects in the extra-embryonic compartment with lethality
        at embryonic day (E)7.5
    - reference_id: PMID:38346993
      supporting_text: TFAP2C pre-occupies the regulatory elements of the inactive extravillous trophoblast-active genes during
        the early stage of differentiation
    - reference_id: file:human/TFAP2C/TFAP2C-deep-research-falcon.md
      supporting_text: TFAP2C is a temporally restricted early regulator that pre-occupies relatively inaccessible EVT-active
        loci
