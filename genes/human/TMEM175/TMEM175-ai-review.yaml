core_functions:
- molecular_function:
    id: GO:0022841
    label: potassium ion leak channel activity
  description: TMEM175 forms the constitutively open, voltage-independent K+ leak conductance of
    endosomal and lysosomal membranes. It is a tetrameric channel lacking the canonical TVGYG selectivity
    filter, selective for K+, Rb+ and Cs+ over Na+. By carrying this leak it sets the endolysosomal
    membrane potential, which in turn supports luminal pH stability and normal autophagosome-lysosome
    fusion.
