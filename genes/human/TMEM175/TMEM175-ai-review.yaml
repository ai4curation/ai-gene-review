id: Q9BSA9
gene_symbol: TMEM175
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Constitutively active, voltage-independent cation channel of the endosomal and lysosomal
  membrane, and the protein responsible for the K+ conductance of these organelles. TMEM175 is structurally
  unrelated to canonical potassium channels: it has two repeats of six transmembrane segments and
  lacks the TVGYG selectivity filter, achieving K+ selectivity by a distinct mechanism, and it assembles
  as a tetramer (a dimer of two-domain subunits in animals). The channel sets the membrane potential
  of endolysosomes and thereby supports luminal pH stability and normal fusion with autophagosomes.
  Channel activity is modulated by luminal pH, by arachidonic acid, and by LAMP1/LAMP2. Whether TMEM175
  additionally acts as a physiologically important proton-leak pathway is unresolved: several groups
  report proton-selective conduction at acidic luminal pH, while others find that the protein predominantly
  conducts K+ in lysosomes and that loss of TMEM175 alkalinizes rather than acidifies the lumen.
  Variants at the TMEM175 locus are associated with Parkinson''s disease risk.'
