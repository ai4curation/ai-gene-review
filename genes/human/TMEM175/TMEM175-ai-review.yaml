- term:
    id: GO:0015252
    label: proton channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Electronic assignment of proton channel activity from the InterPro signature.
    action: KEEP_AS_NON_CORE
    reason: The proton-conductance assignment is contested. Three independent groups reported H+
      conduction by TMEM175 (PMID:35333573, PMID:35750034, PMID:37390818), but Riederer et al. 2026
      report that in lysosomes TMEM175 predominantly conducts K+, that the native lysosomal H+ leak
      is vanishingly small, and that TMEM175 knockout alkalinizes rather than acidifies lysosomes
      - the opposite of the proton-leak prediction (PMID:41134537). A same-year PNAS study maintains
      proton-selective conductance at acidic luminal pH (PMID:41533442), and a Journal of Cell Biology
      commentary frames the question as open (PMID:41295951). Retained, because the underlying recordings
      are real and a channel can be genuinely H+-permeable without that being its physiological role,
      but demoted from core pending resolution.
