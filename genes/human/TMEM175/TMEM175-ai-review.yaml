  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - reference_id: PMID:26317472
    supporting_text: Here, we directly recorded organelle K(+) conductance and discovered a major
      K(+)-selective channel KEL on endosomes and lysosomes. KEL is formed by TMEM175, a protein
      with unknown function.
  - reference_id: PMID:32228865
    supporting_text: Transmembrane protein 175 (TMEM175) was recently identified as a constitutively-active
      potassium (K+) selective channel expressed in lysosomal membranes responsible for establishing
      a membrane potential across the lysosomal membrane
  - reference_id: PMID:41134537
    supporting_text: Thus, we conclude that the primary function of lysosomal TMEM175 is to conduct
      K+, not protons.
