id: P20023
gene_symbol: CR2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CR2 (CD21) is a complement-fragment receptor expressed at the cell surface,
  with an extracellular array of complement-control repeats, a single membrane-spanning
  segment and a short cytoplasmic tail. It recognizes C3-derived ligands and participates
  in B-cell co-receptor complexes that amplify antigen responses. CR2 also binds CD23
  and Epstein–Barr virus gp350/220; the latter interaction supports viral attachment
  and entry. Interferon-alpha and DNA interactions have been reported in defined experimental
  contexts. Four protein products differ within the extracellular region, while the
  N-terminal ligand-binding domains and membrane anchor are retained.
alternative_products:
- name: A
  id: P20023-1
  description: The official displayed sequence is 1033 residues, with signal peptide
    1–20, extracellular residues 21–971, predicted transmembrane segment 972–999 and
    cytoplasmic tail 1000–1033. Source studies using SCR1–2 or soluble repeat constructs
    do not establish equivalent activity of every full-length product.
- name: B
  id: P20023-2
  sequence_note: VSP_001208, VSP_001209
  description: 'Exact reconstruction yields 1007 residues: VSP_001208 deletes canonical
    499–524 and VSP_001209 replaces 525–556 with a 32-residue sequence. These changes
    affect the central extracellular repeat region; the N-terminal ligand-binding
    domains and C-terminal membrane anchor remain. No matched all-product functional
    comparison was found.'
- name: C
  id: P20023-3
  sequence_note: VSP_001210
  description: 'Exact reconstruction yields 1092 residues: VSP_001210 replaces canonical
    Lys659 with a 60-residue segment. The insertion is in the extracellular repeat
    region; retention of the N-terminal ligand-binding domains does not establish
    equal affinity, trafficking or signaling of this full-length product.'
- name: D
  id: P20023-4
  sequence_note: VSP_001210, VSP_001211
  description: 'Exact reconstruction yields 1084 residues: the VSP_001210 extracellular
    insertion is accompanied by deletion of canonical 716–723 through VSP_001211.
    The signal peptide, N-terminal binding region and membrane anchor remain in sequence,
    without a product-specific functional equivalence claim.'
