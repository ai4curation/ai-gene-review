core_functions:
- description: Recognizes C3-derived complement ligands at the B-cell surface and
    contributes to co-receptor signaling that amplifies B-cell activation. The same
    complement-receptor activity accommodates C3d, C3dg and iC3b; association with
    CD19-containing complexes provides signaling context without attributing catalytic
    kinase activity to CR2.
