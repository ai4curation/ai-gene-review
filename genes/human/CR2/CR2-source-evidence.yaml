        comment:
        - FUNCTION Serves as a receptor for various ligands including complement component CD3d, HNRNPU OR IFNA1
          (PubMed:1849076, PubMed:21527715, PubMed:7753047). When C3d is bound to antigens, attaches to C3d on B-cell
          surface and thereby facilitates the recognition and uptake of antigens by B-cells (PubMed:21527715). This
          interaction enhances B-cell activation and subsequent immune responses. Forms a complex with several partners
          on the surface of B-cells including CD19, FCRL5 and CD81, to form the B-cell coreceptor complex that plays
          a crucial role in B-cell activation and signaling (PubMed:1383329, PubMed:30107486). Also induces specific
          intracellular signaling separately from the BCR and CD19 by activating the tyrosine kinase SRC, which
          then phosphorylates nucleolin/NCL and triggers AKT and GSK3 kinase activities in a SYK/CD19-independent
          manner (PubMed:12938232). Acts as a ligand for CD23 (FcepsilonRII), a low-affinity receptor for IgE, which
          is expressed on B-cells and other immune cells, and thus participates in the regulation of IgE production
          (PubMed:1386409).FUNCTION (Microbial infection) Acts as a receptor for Epstein-Barr virus.SUBUNIT Interacts
          (via Sushi domain 1 and 2) with C3 (PubMed:11387479, PubMed:21527715). Interacts with CD19 (PubMed:1702139).
          Part of a complex composed of CD19, CR2/CD21, CD81 and IFITM1/CD225 in the membrane of mature B-cells
          (PubMed:1383329). Interacts (via Sushi domain 1 and 2) with FCER2 (via the C-terminus). Interacts with
          CD23 (PubMed:1386409). Interacts with FCRL5 (PubMed:30107486). Interacts with CR1 (PubMed:1708808). Interacts
          with INFNA1 (PubMed:1849076).SUBUNIT (Microbial infection) Interacts with Epstein-Barr virus gp350 protein.INTERACTION
          Mature B-lymphocytes, T-lymphocytes, pharyngeal epithelial cells, astrocytes and follicular dendritic
          cells of the spleen.DISEASE Disease susceptibility is associated with variants affecting the gene represented
          in this entry.DISEASE The disease is caused by variants affecting the gene represented in this entry.SIMILARITY
          Belongs to the receptors of complement activation (RCA) family.
