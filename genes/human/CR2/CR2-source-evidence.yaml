      comments:
      - texts:
        - evidences:
          - evidenceCode: ECO:0000250
            source: UniProtKB
            id: P20023
          value: Serves as a receptor for various ligands including complement component CD3d, HNRNPU OR IFNA1.
            When C3d is bound to antigens, attaches to C3d on B-cell surface and thereby facilitates the recognition
            and uptake of antigens by B-cells. This interaction enhances B-cell activation and subsequent immune
            responses. Forms a complex with several partners on the surface of B-cells including CD19, FCRL5 and
            CD81, to form the B-cell coreceptor complex that plays a crucial role in B-cell activation and signaling.
            Also induces specific intracellular signaling separately from the BCR and CD19 by activating the tyrosine
            kinase SRC, which then phosphorylates nucleolin/NCL and triggers AKT and GSK3 kinase activities in a
            SYK/CD19-independent manner. Acts as a ligand for CD23 (FcepsilonRII), a low-affinity receptor for IgE,
            which is expressed on B-cells and other immune cells, and thus participates in the regulation of IgE
            production
        commentType: FUNCTION
      - texts:
        - evidences:
          - evidenceCode: ECO:0000250
            source: UniProtKB
            id: P20023
          value: Interacts (via Sushi domain 1 and 2) with C3. Interacts with CD19. Part of a complex composed of
            CD19, CR2/CD21, CD81 and IFITM1/CD225 in the membrane of mature B-cells. Interacts (via Sushi domain
            1 and 2) with FCER2 (via the C-terminus). Interacts with CD23. Interacts with FCRL5. Interacts with
            CR1. Interacts with INFNA1
        commentType: SUBUNIT
      - commentType: SUBCELLULAR LOCATION
