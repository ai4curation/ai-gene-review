          value: Acts as a cofactor for complement factor I, a serine protease which protects autologous cells against
            complement-mediated injury by cleaving C3b and C4b deposited on host tissue. Also acts as a decay-accelerating
            factor, preventing the formation of C4b2a and C3bBb, the amplification convertases of the complement
            cascade. Plays a crucial role in early embryonic development by maintaining fetomaternal tolerance.
            Also acts as a costimulatory factor for T-cells which favors IL-4 secretion
        commentType: FUNCTION
      - texts:
