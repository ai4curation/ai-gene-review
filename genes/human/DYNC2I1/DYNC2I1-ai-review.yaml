  - reference_id: GO_REF:0000033
- description: Within the same asymmetric dynein-2 assembly, the C-terminal WD-repeat propeller of DYNC2I1
    contacts a DYNC2H1 heavy-chain tail and links the intermediate/light-chain block to that motor tail.
    This is a subunit-binding interface of the assembled motor.
  molecular_function:
    id: GO:0045504
    label: dynein heavy chain binding
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:31451806
- description: DYNC2I1 associates with the complementary DYNC2I2 intermediate chain in the dynein-2 intermediate/light-chain
    block that connects the two heavy-chain tails. This records the partner-class interaction within the
    same assembly; complex capture does not by itself establish an isolated binary affinity.
  molecular_function:
    id: GO:0045505
    label: dynein intermediate chain binding
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:27173435
