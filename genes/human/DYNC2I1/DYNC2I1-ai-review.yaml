core_functions:
- description: DYNC2I1 binds the TCTEX1D2–DYNLT1/DYNLT3 light-chain module and organizes the dynein-2
    intermediate/light-chain assembly. Its complementary heavy-chain and DYNC2I2 contacts connect this
    scaffold to the two motor tails. Through these structural interfaces it contributes to minus-end-directed
    motor activity during retrograde IFT and the return of components used in cilium formation and maintenance.
    The ciliary base and the modeled tip-turnaround state are complementary locations in this transport
    cycle.
  molecular_function:
    id: GO:0045503
    label: dynein light chain binding
  contributes_to_molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  locations:
  - id: GO:0097546
    label: ciliary base
  - id: GO:0097542
    label: ciliary tip
  directly_involved_in:
