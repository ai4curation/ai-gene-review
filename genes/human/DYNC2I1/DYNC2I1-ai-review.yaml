id: Q8WVS4
gene_symbol: DYNC2I1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2I1 (WDR60, FAP163 homolog) is one of the two non-identical WD40-repeat intermediate
  chains of cytoplasmic dynein-2, the retrograde intraflagellar transport (IFT) motor of cilia. Its C-terminal
  beta-propeller binds the tail of one dynein-2 heavy chain (DYNC2H1 copy A). Its extended N-terminal
  region heterodimerizes with WDR34 (DYNC2I2) and binds the TCTEX1D2–DYNLT1/DYNLT3 light-chain dimer.
  Together with WDR34 and the light chains it forms the intermediate/light-chain block that bridges and
  asymmetrically positions the two heavy chains, so that dynein-2 can dock onto anterograde IFT-B trains
  in its autoinhibited form. WDR60 is concentrated at the ciliary base and pericentrosomal region and
  is also present in the cilium. Loss of WDR60 reduces dynein-2 assembly and IFT binding, causes accumulation
  of IFT and ciliary GPCRs in cilia (defective retrograde trafficking), and impairs transition-zone integrity.
  Biallelic WDR60 variants cause short-rib thoracic dysplasia 8 (Jeune and short-rib polydactyly syndromes).
  In cycling cells WDR60 has also been seen at spindle poles and the interphase MTOC.
