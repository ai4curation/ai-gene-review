id: Q8WVS4
gene_symbol: DYNC2I1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2I1 (WDR60) is a WD40-repeat intermediate chain of cytoplasmic dynein-2, the motor that
  returns intraflagellar transport components and cargo toward the ciliary base. Its C-terminal propeller
  contacts a dynein heavy-chain tail, while its N-terminal region associates with DYNC2I2 and dynein light
  chains to organize the asymmetric motor assembly. DYNC2I1 supplies binding and structural interfaces
  rather than ATP-driven force generation. It acts in ciliary protein trafficking and cilium assembly,
  with prominent ciliary-base and centrosomal pools. Biallelic variants cause skeletal ciliopathies.
