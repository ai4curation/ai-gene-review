core_functions:
- description: Non-catalytic intermediate chain of cytoplasmic dynein-2. Its beta-propeller binds heavy
    chain A and its N-terminus binds WDR34 and the TCTEX1D2–DYNLT light-chain dimer. In this way it assembles
    the asymmetric IC–LC block that bridges the two heavy chains, and it contributes to the minus-end-directed
    motor activity that drives retrograde IFT.
  contributes_to_molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  locations:
  - id: GO:0097546
    label: ciliary base
  - id: GO:0005929
    label: cilium
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:31451806
    supporting_text: DHC2TAIL-A and -B, are bound by the β-propeller of WDR60 and WDR34 respectively,
      mainly via bundle 3
  - reference_id: PMID:29742051
    supporting_text: These observations indicate that retrograde trafficking of the IFT machinery is severely
      impaired in the absence of WDR60.
- description: Adaptor-like binding of dynein-2 light chains (TCTEX1D2–DYNLT1/DYNLT3) through a conserved
    region upstream of the WD40 domain. This binding is needed for full dynein-2 assembly and normal retrograde
    trafficking.
  molecular_function:
    id: GO:0045503
    label: dynein light chain binding
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:29742051
    supporting_text: Although WDR60 did not demonstrate a binary interaction with any other subunit (Figure
      1B), we found that it interacts with the TCTEX1D2–DYNLT1/DYNLT3 dimer via its conserved region upstream
      of the WD40 domain
- description: Required, as part of dynein-2-driven IFT, for cilium assembly and maintenance, including
    maintenance of a functional transition zone and bidirectional IFT.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  supported_by:
  - reference_id: PMID:30320547
    supporting_text: Both proteins are required to maintain a functional transition zone and for efficient
      bidirectional intraflagellar transport.
proposed_new_terms: []
suggested_questions:
- question: Do WDR60 and TCTEX1D2 have a genuine non-ciliary role with dynein-1 at spindle poles and MTOCs
    in cycling cells, as suggested by their mitotic localization?
- question: Why does WDR60 loss still allow axoneme extension when WDR34 loss does not, given that both
    bridge the dynein-2 heavy chains?
suggested_experiments:
- hypothesis: WDR60 contributes to mitotic dynein-1 function independently of dynein-2.
  description: In WDR60-knockout HeLa or RPE1 cells, quantify spindle assembly, spindle-pole focusing
    and mitotic timing, and test whether WDR60 co-purifies with dynein-1 heavy chain in mitotic extracts.
  experiment_type: knockout phenotyping and biochemistry
