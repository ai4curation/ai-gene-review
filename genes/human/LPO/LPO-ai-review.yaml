- id: PMID:12626341
  title: Lactoperoxidase and human airway host defense.
  full_text_unavailable: true
  findings:
  - statement: Normal human airway secretions contain catalytically active LPO, with LPO expression localized to bronchial submucosal glands.
    supporting_text: The data showed that normal human airway secretions contained LPO enzyme activity (0.65 +/- 0.09 microg/mg secreted protein; n = 17), and Western blots of secretions demonstrated bands of the expected sizes for LPO.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The human airway LPO system uses physiologic thiocyanate and has LPO-dependent antibacterial activity against several airway pathogens.
    supporting_text: Finally, as expected based on the known antibacterial spectrum of the LPO system, airway secretions showed LPO-dependent activity against Pseudomonas aeruginosa.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. This is direct human airway evidence, but the cache is abstract-only and does not resolve every component of the epithelial peroxide-generating system.
- id: PMID:19059195
  title: Molecular heterogeneity and alternative splicing of human lactoperoxidase.
  findings:
  - statement: Human LPO produces multiple splice forms that retain the secretion signal while differing in propeptide-encoding exons.
    supporting_text: Two mRNAs omit propeptide encoding exons while retaining the 5' exon encoding the secretion signal, consistent with the heterogeneity and suggesting a possible functional role for the propeptide.
    reference_section_type: ABSTRACT
  - statement: Recombinant human LPO V1 and propeptide-skipping V3 are both secreted and catalytically active in the insect-cell expression system.
    supporting_text: Both variants were secreted and were active although V1 was completely processed (see below).
    reference_section_type: RESULTS
  - statement: Human salivary LPO includes a larger, at least partially unprocessed proLPO form.
    supporting_text: These data showed that a significant portion of immunoreactive LPO in secretions contains the exon 4-peptide and thus was at least partially unprocessed, in contrast to the reported N-termini for human LPO from milk determined by Edman degradation [14].
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text, title, human splice products, secretion, activity, and salivary-protein observations verified. The variants were assayed heterologously, and the propeptide's endogenous function remains unresolved.
- id: PMID:19199708
  title: Proteomic analysis of human parotid gland exosomes by multidimensional protein identification technology
    (MudPIT).
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PMID and title verified. This is a broad human parotid-exosome proteomics dataset and supports presence/provenance only; the accessible article text does not provide an LPO-specific mechanism.
- id: PMID:24248522
  title: Salivary protein profiles are linked to bitter taste acceptance in infants.
  full_text_unavailable: true
  findings:
  - statement: LPO-containing salivary protein bands were detected in infant saliva and associated with greater bitter-solution acceptance, without establishing a direct LPO mechanism.
    supporting_text: while higher abundance of bands containing lactoperoxidase, prolactin-inducible protein and S-type cystatins was associated to a higher bitterness acceptance.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. The finding is an association from mixed-protein bands, not a direct biochemical or causal function of LPO.
- id: PMID:6295491
  title: The peroxidation of thiocyanate catalysed by myeloperoxidase and lactoperoxidase.
  full_text_unavailable: true
  findings:
  - statement: LPO catalyzes thiocyanate oxidation to hypothiocyanite with strong dependence on pH and substrate concentrations.
    supporting_text: Peroxidation of SCN- to OSCN-, catalysed by myeloperoxidase and lactoperoxidase, was studied.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Thiocyanate can competitively inhibit LPO with respect to hydrogen peroxide under acidic conditions, bounding simple substrate models.
    supporting_text: At low pH values, both SCN- and H+ inhibited myeloperoxidase and lactoperoxidase competitively with respect to H2O2.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. The biochemical enzyme source is not identified in the abstract, so these kinetics should not be represented as direct human-protein evidence.
- id: PMID:8964511
  title: Cloning and sequence analysis of the human salivary peroxidase-encoding cDNA.
  full_text_unavailable: true
  findings:
  - statement: A human salivary peroxidase/LPO cDNA encodes an approximately 67-kDa unglycosylated translation product.
    supporting_text: In a rabbit reticulocyte lysate transcription/translation system, the cDNA produces a major protein of approx. 67 kDa, which corresponds to the calculated molecular weight of unglycosylated hSPO.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title, human cDNA identity, and in-vitro translation result verified. This establishes product identity/size, not mature glycosylation, secretion, or catalytic activity.
- id: PMID:9083001
  title: Autocatalytic processing of heme by lactoperoxidase produces the native protein-bound prosthetic group.
  full_text_unavailable: true
  findings:
  - statement: Hydrogen peroxide drives autocatalytic heme modification and covalent attachment in recombinant LPO.
    supporting_text: Reaction of the purified heme. apoLPO complex with H2O2 results in both autocatalytic modification of the heme and covalent attachment to the protein.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Covalent heme attachment increases LPO peroxidative activity.
    supporting_text: The peroxidative activity of LPO increases in proportion to the extent of covalently bound heme.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. The baculovirus/reconstitution system establishes an LPO autocatalytic maturation mechanism, but the abstract does not identify the LPO species and should not be labeled direct endogenous human evidence.
- id: PMID:1988011
  title: 'Lactoperoxidase-catalyzed oxidation of thiocyanate by hydrogen peroxide: 15N nuclear magnetic resonance and optical spectral studies.'
  full_text_unavailable: true
  findings:
  - statement: Hypothiocyanite formation is a principal, condition-dependent product of the LPO/thiocyanate/hydrogen-peroxide system.
    supporting_text: The formation of hypothiocyanite ion (OSCN-) as one of the oxidation products correlated well with the activity of the LPO/SCN-/H2O2 system and was maximum when the concentrations of the H2O2 and SCN- were nearly the same and the pH was less than 6.0.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Thiocyanate binding is required for oxidation and is lost at alkaline pH.
    supporting_text: Since thiocyanate does not bind to LPO above this pH, the binding of thiocyanate to LPO is considered to be prerequisite for the oxidation of thiocyanate.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. These are direct LPO-system chemistry measurements, but enzyme species is not stated in the abstract.
- id: PMID:6951512
  title: Different molecular forms of human salivary lactoperoxidase.
  full_text_unavailable: true
  findings:
  - statement: Human salivary LPO was observed in two molecular forms interpreted as a monomer and a reversible aggregate.
    supporting_text: The two different molecular forms shown to exist probably represent a monomer and an aggregate.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Thiocyanate can promote disaggregation of salivary LPO preparations.
    supporting_text: The presence of substrate (SCN-) could cause some disaggregation suggesting that the mechanism of the dissociation is influenced by the substrate.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. This is direct human salivary evidence, but “monomer and aggregate” is explicitly probabilistic and should not be converted into an obligate physiological oligomeric state.
- id: PMID:24928513
  title: Uric acid and thiocyanate as competing substrates of lactoperoxidase.
  full_text_unavailable: true
  findings:
  - statement: Urate is an alternative bovine-LPO substrate that competes with thiocyanate and suppresses hypothiocyanite production.
    supporting_text: At physiologically relevant concentrations, urate competed effectively with thiocyanate, the main substrate of LPO for oxidation, and inhibited production of hypothiocyanite.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Human saliva supports peroxidase-dependent urate oxidation, providing physiological context without proving that every reaction is LPO-specific.
    supporting_text: When hydrogen peroxide was added to saliva, oxidation of urate was dependent on its concentration and peroxidase activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. Direct kinetics used bovine LPO; the human-saliva experiment is mixed-system evidence and must not be presented as purified human-LPO specificity.
- id: PMID:18191143
  title: Crystal structure of lactoperoxidase at 2.4 A resolution.
  full_text_unavailable: true
  findings:
  - statement: Caprine LPO is a single-chain heme peroxidase with two covalent heme ester linkages.
    supporting_text: The structure confirms that the heme group is covalently linked to the protein through two ester linkages involving carboxylic groups of Glu258 and Asp108 and modified methyl groups of pyrrole rings A and C, respectively.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The LPO distal cavity contains a structured proton-relay path relevant to catalysis.
    supporting_text: Two histidine residues and six buried water molecules are connected through a hydrogen-bonded chain from the distal heme cavity to the surface of protein molecule and seemingly form the basis of proton relay for catalytic action.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. This is caprine structural evidence; conserved human residues support cautious transfer, but species-specific post-translational details are not directly established.
- id: PMID:22187667
  title: 'Structural evidence for the order of preference of inorganic substrates in mammalian heme peroxidases: crystal structure of the complex of lactoperoxidase with four inorganic substrates, SCN, I, Br and Cl.'
  full_text_unavailable: true
  findings:
  - statement: LPO binds thiocyanate, iodide, bromide, and chloride at distinct positions on the distal heme side.
    supporting_text: The structure determination of the complex of LPO with above four substrates showed that all of them occupied distinct positions in the substrate binding site on the distal heme side.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The crystallographic substrate positions imply a binding preference of bromide over chloride, thiocyanate, and iodide under the structural conditions used.
    supporting_text: Therefore, according to the locations of four substrate anions, the order of preference for binding to lactoperoxidase is observed as Br(-) > Cl(-) > SCN(-) > I(-).
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and abstract verified. This is non-human LPO crystallography and describes binding-site occupancy/preferences, not necessarily physiological product flux in human secretions.
- id: PMID:36463312
  title: Excess iodine exposure acutely increases salivary iodide and antimicrobial hypoiodous acid concentrations in humans.
  findings:
  - statement: Acute iodide loading in humans increases salivary iodide and hypoiodous acid, supporting hypohalous chemistry by the salivary LPO system.
    supporting_text: The large iodine load delivered by the angiographic dye, several 100-fold in excess of the U.S. Recommended Daily Allowance for iodine (150 µg/day), significantly increased salivary iodide and HOI levels compared with baseline levels, whereas there was no significant change in salivary SCN- and OSCN- levels.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full cached article, PubMed title, and human saliva measurements verified. This is a system-level intervention with supraphysiologic iodide exposure, not purified human-LPO kinetics or evidence that HOI dominates normally.
