core_functions:
- description: >-
    Catalyzes the extracellular hydrogen-peroxide-dependent oxidation of
    thiocyanate to hypothiocyanous acid/hypothiocyanite in mucosal secretions.
    This oxidant-generating chemistry contributes directly to antibacterial
    humoral defense in saliva, milk, and the airway surface liquid. The core
    assignment does not extend to every alternative donor observed in vitro or
    to broad downstream oxidative-stress phenotypes.
  molecular_function:
    id: GO:0036393
    label: thiocyanate peroxidase activity
  directly_involved_in:
  - id: GO:0019731
    label: antibacterial humoral response
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:6295491
    supporting_text: Peroxidation of SCN- to OSCN-, catalysed by myeloperoxidase and lactoperoxidase, was studied.
  - reference_id: PMID:12626341
    supporting_text: Thus, a functional LPO system exists in human airways and may contribute to airway host defense against infection.
knowledge_gaps:
- gap_statement: >-
    The occupancy, covalent attachment, and maturation pathway of heme in
    endogenous human LPO have not been established directly; key mechanistic and
    structural assignments derive from recombinant or non-human LPO.
- gap_statement: >-
    The abundance and processing of canonical LPO, incompletely processed LPO,
    and UniProt isoform 2 across saliva, milk, and airway secretions are unknown.
    Isoform 2 deletes residues 26-108, extending beyond the annotated propeptide
    into the canonical mature chain, so activity of a recombinant
    propeptide-deleted construct does not establish its endogenous function.
- gap_statement: >-
    Physiological partitioning among thiocyanate, iodide, bromide, urate, and
    other donors remains incompletely quantified under the pH, peroxide flux,
    and substrate concentrations found in different human secretions.
- gap_statement: >-
    The tissue-specific peroxide sources and physical or functional coupling of
    LPO to DUOX-family oxidases in salivary, mammary, and airway epithelia remain
    incompletely resolved.
- gap_statement: >-
    The biological effects of propeptide removal or retention on LPO folding,
    secretion, stability, and antimicrobial activity are not known.
- gap_statement: >-
    Human salivary preparations contain monomeric and reversibly aggregated LPO,
    but the native oligomeric state and physiological significance of this
    behavior in intact secretions are unresolved.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which molecular forms and processing states of LPO predominate in human
    saliva, milk, and airway surface liquid?
- question: >-
    Is UniProt isoform 2 translated and secreted endogenously, and does its
    residues 26-108 deletion alter heme loading, stability, or catalysis?
- question: >-
    How is covalent heme attachment established in human LPO, and what fraction
    of endogenous enzyme carries fully matured heme?
- question: >-
    How do physiological pH, peroxide delivery, and competing donors determine
    HOSCN/OSCN, HOI, and other oxidant production in each secretion?
- question: >-
    Which epithelial peroxide-generating system supplies LPO in each tissue,
    and is coupling based on proximity or on diffusible peroxide alone?
- question: >-
    Does reversible aggregation modulate LPO persistence or antimicrobial
    activity in native human secretions?
suggested_experiments:
- description: >-
    Apply isoform-resolved targeted proteomics and N-terminomics to fresh human
    saliva, milk, and airway surface liquid to quantify canonical, propeptide-
    retaining, and residues-26-108-deleted LPO forms.
  hypothesis: >-
    LPO processing and isoform abundance differ by secretory tissue, with
    canonical mature LPO predominant but measurable incompletely processed forms.
- description: >-
    Use CRISPR-edited human salivary- and airway-gland organoids to express each
    endogenous LPO splice form separately and measure secretion, heme loading,
    thiocyanate turnover, and bacterial killing.
  hypothesis: >-
    The residues-26-108 deletion changes LPO maturation or stability even if the
    secreted protein retains measurable peroxidase activity.
- description: >-
    Analyze affinity-purified endogenous human LPO by intact-mass spectrometry,
    heme-peptide mapping, and structural spectroscopy.
  hypothesis: >-
    Endogenous human LPO carries the conserved covalent heme architecture inferred
    from recombinant and non-human lactoperoxidases.
- description: >-
    Reconstitute human LPO at secretion-matched concentrations while varying pH,
    hydrogen-peroxide flux, thiocyanate, iodide, bromide, and urate, and quantify
    products by orthogonal chemical assays.
  hypothesis: >-
    Thiocyanate dominates at basal physiological concentrations, whereas donor
    competition and pH shift oxidant partitioning in a tissue-specific manner.
- description: >-
    Perturb DUOX enzymes and LPO independently in differentiated human airway and
    salivary organoids, then measure extracellular peroxide, HOSCN/OSCN, and
    pathogen survival with genetic rescue controls.
  hypothesis: >-
    Epithelial DUOX activity supplies peroxide required for LPO-dependent
    antimicrobial chemistry at mucosal surfaces.
