id: P22079
gene_symbol: LPO
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPO encodes lactoperoxidase, a secreted, heme-dependent mammalian peroxidase
  expressed in salivary and mammary glands and in airway submucosal glands. In
  saliva, milk, and airway secretions, LPO uses hydrogen peroxide to oxidize
  thiocyanate to hypothiocyanous acid/hypothiocyanite, an antimicrobial oxidant
  that inhibits bacteria at mucosal surfaces. Human airway secretions contain LPO
  activity and support LPO-dependent antibacterial activity against several airway
  pathogens. LPO can also oxidize iodide and other donors under suitable chemical
  conditions, but thiocyanate is the best-supported physiological substrate and
  product partitioning depends on pH, peroxide supply, and competing substrates.

  The canonical precursor comprises a signal peptide at residues 1-26, a propeptide
  at residues 27-80, and a mature chain at residues 81-712. Human secretions contain
  both processed and partially unprocessed LPO, and the function of propeptide
  retention is unresolved. The mature enzyme binds heme and calcium and is
  glycosylated and disulfide-bonded. Autocatalytic peroxide-dependent covalent heme
  attachment and the detailed distal heme-pocket architecture are supported mainly
  by recombinant or non-human LPO studies; their transfer to human LPO is strongly
  supported by conservation but is not a direct endogenous-human structural
  observation. UniProt isoform 2 lacks residues 26-108, spanning the signal/
  propeptide boundary and the N terminus of the canonical mature chain. Although a
  propeptide-deleted recombinant variant was secreted and active, the endogenous
  abundance, processing, localization, and physiological function of isoform 2 are
  not established.
