  title: Lactoperoxidase (LPO) produces OSCN-
  findings:
  - statement: Reactome models human LPO Compound I oxidation of thiocyanate to hypothiocyanite.
    supporting_text: The Reactome event describes the halogenation cycle where LPO-derived Compound I catalyzes the oxidation of thiocyanate ion (SCN-) to hypothiocyanite ion (OSCN-).
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
