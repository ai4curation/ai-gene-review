core_functions:
- description: Acts at the plasma membrane as a Wnt receptor/coreceptor - its Frizzled-like cysteine-rich
    domain binds WNT5A/WNT5B - and as a dimerization-activated tyrosine kinase that autophosphorylates
    and phosphorylates the scaffold YWHAB, transducing non-canonical Wnt signals that promote polarized
    cell migration, osteogenesis and skeletal development while antagonizing canonical WNT3A signalling.
  molecular_function:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0043235
    label: signaling receptor complex
  directly_involved_in:
  - id: GO:0007169
    label: cell surface receptor protein tyrosine kinase signaling pathway
  - id: GO:0030335
    label: positive regulation of cell migration
  supported_by:
  - reference_id: PMID:17717073
    supporting_text: Antibody-mediated dimerization causes receptor autophosphorylation and induces functional
      consequences of its signaling
  - reference_id: PMID:17717073
    supporting_text: Purified Ror2 phosphorylates 14-3-3beta in vitro, confirming 14-3-3beta as the first
      identified Ror2 substrate.
  - reference_id: file:human/ROR2/ROR2-uniprot.txt
    supporting_text: May act as a receptor for wnt ligand WNT5A which may result in the inhibition of
      WNT3A-mediated signaling
  - reference_id: PMID:19486338
    supporting_text: Treatment of osteosarcoma cell lines with siRNA against ROR2 significantly inhibited
      cell proliferation and migration.
suggested_questions:
- question: How much of ROR2 signalling requires its own catalytic activity, given reports of both autophosphorylation
    with a defined substrate and very weak in vitro kinase activity?
- question: Which Wnt ligands bind the ROR2 cysteine-rich domain with physiologically relevant affinity
    in human tissues, and how do ROR1 and ROR2 divide that ligand space?
- question: Do brachydactyly B1 (dominant, intracellular truncating) and Robinow syndrome (recessive)
    mutations act through different mechanisms - dominant-negative receptor complexes versus simple loss
    of function?
suggested_experiments:
- description: Kinase-dead (ATP-binding site mutant) versus wild-type ROR2 knock-in in human chondrocyte
    or mesenchymal stem cell models, scoring WNT5A-dependent migration, YWHAB phosphorylation and osteogenic
    differentiation, to quantify the contribution of catalysis.
- description: Surface-restricted ligand binding assays (BLI or cell-surface SPR) with purified ROR2 cysteine-rich
    domain against the human WNT panel, to establish which Wnts are direct ligands.
- description: Proximity labelling from the ROR2 intracellular domain in cells stimulated with WNT5A,
    to define the kinase and scaffold complex (TAK1, PRTB, 14-3-3) assembled on the activated receptor.
