id: Q01974
gene_symbol: ROR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ROR2 is a single-pass type I transmembrane receptor tyrosine kinase of the ROR family, with
  an extracellular immunoglobulin-like domain, a Frizzled-like cysteine-rich domain and a kringle domain,
  and an intracellular tyrosine kinase domain followed by serine/threonine- and proline-rich motifs. The
  cysteine-rich domain binds Wnt ligands, notably WNT5A, and ROR2 acts as a receptor or coreceptor for
  non-canonical Wnt/planar cell polarity signalling, where it antagonizes canonical WNT3A-driven signalling
  and promotes polarized cell migration. Its kinase domain retains measurable but weak activity: antibody-induced
  homodimerization causes autophosphorylation and ROR2 phosphorylates the scaffold YWHAB/14-3-3beta to
  promote osteogenesis, while other work reports very little in vitro tyrosine kinase activity, so the
  receptor also works through recruited kinases such as TAK1. ROR2 is expressed highly in the early embryo,
  is required for cartilage, growth plate and skeletal development, and is re-expressed in tumours including
  osteosarcoma, where it supports proliferation and migration. Loss-of-function mutations cause autosomal
  recessive Robinow syndrome and dominant brachydactyly type B1.'
