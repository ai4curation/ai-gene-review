  review:
    summary: ROR2 is a transmembrane receptor tyrosine kinase.
    action: ACCEPT
    reason: The protein has an extracellular ligand-binding region, a single transmembrane segment and
      an intracellular kinase domain, and dimerization at the cell surface triggers autophosphorylation
      and downstream signalling.
    supported_by:
    - reference_id: PMID:17717073
      supporting_text: We demonstrate that Ror2 homodimerizes at the cell surface, and that dimerization
        can be induced by a bivalent antibody.
    - reference_id: PMID:1334494
      supporting_text: The cytoplasmic portion contains the tyrosine kinase-like domain which (in Ror2)
        appears to be associated with protein kinase activity in vitro
