id: Q8IWQ3
gene_symbol: BRSK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRSK2 (SAD-A) is an AMPK-related protein serine/threonine kinase with an N-terminal
  catalytic domain and regulatory UBA and KA1 regions. LKB1-dependent activation enables phosphorylation
  of protein substrates, including tau, and conserved SAD-kinase signaling helps establish
  neuronal axon-dendrite polarity and organize neuronal projections. BRSK2 is cytoplasmic,
  with mitotic centrosomal localization and stress-dependent recruitment to the endoplasmic
  reticulum. In pancreatic beta-cell models, SAD-A binds and phosphorylates PAK1 and influences
  cytoskeletal remodeling and glucose-stimulated insulin secretion. Its abundance is controlled
  by ubiquitin-dependent turnover, and it interacts with VCP/p97 in an ER-associated degradation
  context.
