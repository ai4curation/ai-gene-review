core_functions:
- description: LKB1-activated protein serine/threonine phosphorylation supports conserved
    SAD-kinase signaling in neuronal polarity. Tau is a demonstrated substrate, and combined
    SAD A/B loss disrupts axonal polarization in mouse neurons; those combined-loss assays
    do not resolve the individual contribution of BRSK2. Context-specific PAK1, cell-cycle
    and ERAD effects are reviewed separately. ATP binding and the tau-kinase subactivity are
    parts of this single catalytic unit.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0030010
    label: establishment of cell polarity
  - id: GO:0007409
    label: axonogenesis
  - id: GO:0050770
    label: regulation of axonogenesis
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:14976552
  - reference_id: PMID:21985311
    supporting_text: phosphorylated S262 and S356 in KxGS motifs
  - reference_id: PMID:18268107
    supporting_text: SAD A/B kinase double knockout neurons lacked
suggested_questions:
- question: What does the PMID:22713462 corrigendum change, and does the complete study establish
    apoptosis-pathway participation or a kinase-independent protective regulatory effect?
- question: Does BRSK2 directly alter VCP ATP-hydrolysis kinetics or substrate extraction,
    beyond VCP binding and changes in ERAD-substrate abundance?
- question: Which exact mouse Brsk2 experiment supports epithelial planar-polarity microtubule
    organization, and what is the current replacement for the GOA-labelled obsolete GO:1904152?
- question: Can BRSK2-specific synaptic-vesicle clustering and distal-axon localization be
    separated from SAD-B/BRSK1 or combined SAD-kinase evidence?
- question: How do the six recorded alternative products differ in catalytic activity, localization
    and context-specific insulin-secretion effects?
