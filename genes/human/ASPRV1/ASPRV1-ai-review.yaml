  review:
    summary: Protein autoprocessing (NEW, IDA). Like retroviral proteases, recombinant ASPRV1 auto-activates
      by cleaving itself, generating the 14 kDa active SASP14 form. Dominant ichthyosis mutations cluster
      near the autocleavage sites and disrupt this step. The protein cleaves itself, so it is the agent
      of the process.
