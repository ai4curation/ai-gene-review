  label: Homo sapiens
description: ASPRV1 (SASPase, skin aspartic protease) is a retroviral-like aspartic protease expressed
  in the epidermis and other stratified epithelia. It has a predicted N-terminal transmembrane helix.
  Its precursor auto-activates by self-cleavage, releasing the active protease domain, which cleaves the
  linker peptides of profilaggrin to generate filaggrin monomers needed for stratum corneum hydration
  and barrier function. Mice lacking it accumulate misprocessed profilaggrin and have dry skin. Heterozygous
  missense mutations near the autocleavage sites impair autoactivation and filaggrin processing and cause
  dominantly inherited lamellar ichthyosis with palmoplantar keratoderma.
