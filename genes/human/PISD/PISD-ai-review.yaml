taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PISD encodes the type I pyruvoyl-dependent phosphatidylserine decarboxylase
  that converts phosphatidylserine to phosphatidylethanolamine in the
  mitochondrial inner membrane. The proenzyme self-cleaves to generate the
  membrane-associated beta chain and the pyruvoyl-containing alpha chain needed
  for decarboxylase activity. Human cells express a canonical mitochondrial
  isoform, PISD-M, and an alternatively spliced PISD-LD isoform whose N-terminal
  targeting element partitions between mitochondria and lipid droplets according
  to lipid-droplet availability.
