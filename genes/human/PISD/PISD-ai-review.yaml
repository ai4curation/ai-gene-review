- id: PMID:30488656
  title: The homozygous variant c.797G>A/p.(Cys266Tyr) in PISD is associated with
    a Spondyloepimetaphyseal dysplasia with large epiphyses and disturbed mitochondrial
    function.
  findings:
  - statement: Patient fibroblasts carrying the homozygous Cys266Tyr PISD variant had
      fragmented mitochondria and ethanolamine-responsive MG-132 sensitivity, consistent
      with disruption of the PISD-dependent PE pathway.
  reference_review:
    review_notes: >-
      Abstract-only cache. The abstract is sufficient for the PE-biosynthesis
      context of the GOA row but not for mechanistic claims about the variant.
- id: PMID:30858161
  title: PISD is a mitochondrial disease gene causing skeletal dysplasia, cataracts,
    and white matter changes.
  findings:
  - statement: Compound-heterozygous PISD patient fibroblasts had reduced conversion
      of PS into PE, mitochondrial fragmentation that could be rescued by lyso-PE or
      wild-type PISD, and reduced self-processing of the R277Q PISD variant.
- id: PMID:33593792
  title: Conditional targeting of phosphatidylserine decarboxylase to lipid droplets.
  findings:
  - statement: PISD has a mitochondrial PISD-M isoform and an alternatively spliced
      PISD-LD isoform that conditionally targets lipid droplets versus mitochondria;
      PISD knockdown reduced TAG synthesis without visibly reducing droplet formation.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: MitoCoP provides a high-confidence mitochondrial-proteome data set;
      the cached manuscript text does not include its supplementary PISD row.
