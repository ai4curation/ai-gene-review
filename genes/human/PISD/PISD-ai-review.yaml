proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous human tissues use the PISD-LD isoform for lipid-droplet PE
    production, and what fraction of TAG storage control is direct lipid-droplet
    PISD activity rather than a secondary consequence of mitochondrial PE
    depletion?
- question: >-
    Which inner-membrane proteases respond directly to altered mitochondrial PE
    levels in PISD-deficient cells?
suggested_experiments:
- description: >-
    Selectively knock down or CRISPR-edit PISD-LD-specific exons while leaving
    PISD-M intact, then measure lipid-droplet phospholipid composition and TAG
    incorporation during oleate loading.
- description: >-
    Rescue PISD patient fibroblasts with processing-defective and
    catalytically-dead PISD alleles expressed at physiological levels to
    separate PE-depletion effects from possible protease load caused by
    unprocessed precursor.
