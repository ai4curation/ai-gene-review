core_functions:
- description: >-
    No molecular activity or biological process is known for SMIM14. This entry records
    only its experimentally established location as a single-pass ER membrane protein
    with a lumenal N terminus and asserts no function.
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:24499674
    supporting_text: Taken together, our results suggest that C4orf34 is a novel ER
      resident, type I transmembrane protein that might play a role in ER functions.
suggested_questions:
- question: >-
    Is the SMIM14-FATE1 interaction, recovered in two independent yeast two-hybrid
    screens, detectable between the endogenous proteins, and does it place SMIM14 at
    ER-mitochondria contact sites?
- question: >-
    Given its high expression in hepatocytes, does SMIM14 loss affect any hepatic ER
    function such as lipoprotein secretion, lipid synthesis or Ca2+ handling?
suggested_experiments:
- hypothesis: SMIM14 is enriched at ER-mitochondria contact sites through FATE1.
  description: >-
    Co-immunoprecipitate endogenous SMIM14 and FATE1 from a cell line expressing both,
    and compare the distribution of endogenously tagged SMIM14 between bulk ER and
    mitochondria-associated membranes by fractionation and proximity ligation.
- hypothesis: SMIM14 contributes to a hepatocyte ER function.
  description: >-
    Delete SMIM14 in hepatocyte-derived cells (HepG2, or primary or iPSC-derived
    hepatocytes) and measure ER Ca2+ stores, unfolded protein response markers,
    triglyceride and apolipoprotein B secretion, and cholesterol synthesis.
