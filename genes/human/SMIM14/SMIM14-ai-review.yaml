    reason: >-
      Bare protein binding carries no functional information, and no more informative
      molecular function can be supported. The SMIM14-FATE1 pair is recovered in two
      independent yeast two-hybrid screens (this one and HuRI) and is
      compartment-compatible, since FATE1 is an ER/mitochondria membrane protein, but its
      functional meaning has not been tested. Removal does not imply that the interaction
      is false.
