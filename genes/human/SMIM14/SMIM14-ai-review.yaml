- id: PMID:24499674
  title: Characterization of the cellular localization of C4orf34 as a novel endoplasmic
    reticulum resident protein.
  findings:
  - statement: Tagged SMIM14 co-localises with calnexin and Sec61 and is an ER-resident
      single-pass membrane protein.
    supporting_text: Taken together, our results suggest that C4orf34 is a novel ER
      resident, type I transmembrane protein that might play a role in ER functions.
  - statement: ER retention maps to the transmembrane segment, not to a canonical
      retention motif.
    supporting_text: our results suggest that TMD of hC4orf34 might have an ER retention
      signal.
  - statement: SMIM14 transcript levels do not change during tunicamycin-induced ER
      stress.
    supporting_text: This result indicates that gene expression of hC4orf34 is not
      changed by ER stress (Fig. 4).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The only study of SMIM14 itself (full text cached). Localisation and
      topology data are sound for overexpressed constructs. The proposed roles in Ca2+
      homeostasis and ER stress are speculative and untested (the single ER-stress
      experiment was negative). The abstract's claim of conservation to invertebrates is
      not shown for C4orf34, whose alignment covers only vertebrates.
