description: >-
  SMIM14 (formerly C4orf34) is a 99-amino-acid (about 10.7 kDa) single-pass membrane
  protein of the endoplasmic reticulum, conserved across vertebrates (Pfam DUF2615). Its
  single transmembrane helix (residues 50-70) is internal, with no cleavable signal
  peptide; the 49-residue N-terminal segment faces the ER lumen and the short
  proline-rich C-terminal tail faces the cytosol. Tagged SMIM14 co-localises with the ER
  markers calnexin and Sec61 and is retained in the ER by its transmembrane segment, as
  it carries no canonical ER retention motif. The mouse transcript is found in all tissues
  examined, and in human the transcript is most abundant in liver and hepatocytes. SMIM14
  expression is not induced by tunicamycin-triggered ER stress. No molecular activity or
  biological process has been demonstrated; the reported interactions are yeast
  two-hybrid hits without functional follow-up.
