    reason: Synthesis row resting on UniProtKB-SubCell SL-0204, which UniProt curated from the peroxisomal MAVS
      work; concordant with the EXP row on the same term.
    supported_by:
    - reference_id: PMID:20451243
      supporting_text: Here, we report that the RIG-I-like receptor (RLR) adaptor protein MAVS is located on peroxisomes
        and mitochondria.
- term:
    id: GO:0005778
    label: peroxisomal membrane
  evidence_type: IDA
  original_reference_id: PMID:20451243
  qualifier: located_in
  review:
    action: ACCEPT
    summary: Peroxisomal MAVS is a membrane protein of the peroxisome, anchored like its mitochondrial counterpart.
    reason: Direct evidence, and the sub-compartment that makes the peroxisomal signalling arm coherent. Kept
      rather than treated as redundant with the peroxisome row, following projects/ORGANELLES.md.
    supported_by:
    - reference_id: PMID:20451243
      supporting_text: Here, we report that the RIG-I-like receptor (RLR) adaptor protein MAVS is located on peroxisomes
        and mitochondria.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IMP
  original_reference_id: PMID:20451243
  qualifier: involved_in
  review:
    action: MODIFY
    summary: 'True but uninformative at this level: the signal transduction MAVS performs is cytoplasmic pattern-recognition
      receptor signalling.'
    reason: Correct but far less specific than the evidence supports. The cited work assigns MAVS to organelle-restricted
      RLR signalling with distinct output kinetics. Replace with GO:0002753 cytoplasmic pattern recognition receptor
      signaling pathway, an is_a descendant the gene already carries from two IDA rows.
    proposed_replacement_terms:
    - id: GO:0002753
      label: cytoplasmic pattern recognition receptor signaling pathway
    supported_by:
    - reference_id: PMID:20451243
      supporting_text: Upon viral infection, peroxisomal MAVS induces the rapid interferon-independent expression
        of defense factors that provide short-term protection, whereas mitochondrial MAVS activates an interferon-dependent
        signaling pathway with delayed kinetics, which amplifies and stabilizes the antiviral response.
- term:
    id: GO:0019901
    label: protein kinase binding
  evidence_type: IPI
  original_reference_id: PMID:16127453
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13546
  review:
    action: MODIFY
    summary: MAVS binds protein kinases, but the kinases it engages are serine/threonine kinases, for which the
      gene already carries the specific term.
    reason: Correct but less specific than the evidence supports. The WITH entry is RIPK1 (Q13546), a serine/threonine
      kinase, and every kinase MAVS is shown to recruit (TBK1, IKKalpha/beta/epsilon) is of that class. Replace
      with GO:0120283 protein serine/threonine kinase binding, an is_a descendant the gene already carries from
      PMID:18818105.
    proposed_replacement_terms:
    - id: GO:0120283
      label: protein serine/threonine kinase binding
    supported_by:
    - reference_id: PMID:16177806
      supporting_text: Here we describe Cardif, a new CARD-containing adaptor protein that interacts with RIG-I
        and recruits IKKalpha, IKKbeta and IKKvarepsilon kinases by means of its C-terminal region, leading to
        the activation of NF-kappaB and IRF3.
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:16858409
  qualifier: enables
  review:
    action: MODIFY
    summary: 'Same refinement as the molecular adaptor row: the adaptor activity demonstrated here is signalling
      adaptor activity.'
    reason: Correct but general. GO:0030674 sits between molecular adaptor activity and signaling adaptor activity;
      the TRAF3-TIM interaction it rests on is a signalling event. Replace with GO:0035591 signaling adaptor activity,
      an is_a descendant the gene already carries.
    proposed_replacement_terms:
    - id: GO:0035591
      label: signaling adaptor activity
    supported_by:
    - reference_id: PMID:16858409
      supporting_text: Cardif-mediated IFNalpha induction occurs through a direct interaction between the TRAF
        domain of TRAF3 and a TRAF-interaction motif (TIM) within Cardif.
- term:
    id: GO:0031966
    label: mitochondrial membrane
  evidence_type: IDA
  original_reference_id: PMID:20451243
  qualifier: located_in
  review:
    action: MODIFY
    summary: True, but the mitochondrial membrane MAVS occupies is specifically the outer membrane.
    reason: Correct but less specific than the evidence supports, and GO:0031966 is a generic membrane term rather
      than a root organelle term, so the refinement rule applies. Replace with GO:0005741 mitochondrial outer
      membrane, a part_of descendant the gene already carries from EXP and IDA rows. Several GO-CAM models also
      type MAVS at GO:0031966, so this is a granularity suggestion for them too, not a correction of the biology.
    proposed_replacement_terms:
    - id: GO:0005741
      label: mitochondrial outer membrane
    supported_by:
    - reference_id: PMID:16125763
      supporting_text: The transmembrane domain targets MAVS to the mitochondria, implicating a new role of mitochondria
        in innate immunity.
    - reference_id: PMID:20451243
      supporting_text: Here, we report that the RIG-I-like receptor (RLR) adaptor protein MAVS is located on peroxisomes
        and mitochondria.
