suggested_questions:
- question: Is GO:0140693 molecular condensate scaffold activity the intended term for prion-like signalling polymers
    such as the MAVS CARD filament, whose cryo-EM structure is an ordered helical assembly rather than a phase-separated
    condensate? GO uses it for MAVS in two GO-CAM models, so if that is deliberate the definition and synonyms
    ('phase separation nucleation activity') may need widening; if not, an ordered-signalling-polymer scaffold
    term is missing.
  experts:
  - GO ontology editors
  - innate immune signalling structural biologists
- question: Are GO:0060337 type I interferon-mediated signaling pathway and GO:0060340 its positive regulation
    being used across RLR pathway genes for interferon induction rather than for the IFNAR-initiated response?
    Three rows on MAVS alone use interferon-response terms for interferon-production experiments, which suggests
    a systematic labelling confusion worth auditing across RIGI, IFIH1, TBK1, IRF3 and STING1.
  experts:
  - GOA curators
- question: What determines the partition of MAVS between the mitochondrial outer membrane and the peroxisomal
    membrane, and do the two pools exchange? The functional consequence is established (interferon-independent
    early defence from peroxisomes, interferon-dependent amplification from mitochondria) but the targeting determinant
    in a single tail anchor is not.
  experts:
  - organelle protein targeting
  - innate immunity
suggested_experiments:
- hypothesis: MAVS maintains outer-membrane translocase assembly directly, so loss of TOM assembly precedes and
    does not result from mitochondrial fragmentation and mitophagy.
  description: Degron-tag endogenous MAVS in A549 and THP-1 cells and follow a depletion time course. At each
    time point measure TOM40/TOM22/TOM70 abundance and TOM complex assembly by blue-native PAGE, import of radiolabelled
    preproteins into isolated mitochondria, membrane potential by TMRM, network morphology, and mitophagic flux
    (mt-Keima). Repeat in ATG5-null and PRKN-null backgrounds to ask whether blocking mitophagy preserves import,
    and rescue with signalling-incompetent MAVS (CARD-deleted, pLxIS S442A) to test whether the maintenance function
    is separable from adaptor activity.
  experiment_type: inducible protein degradation with mitochondrial import and assembly assays
- hypothesis: The MAVS species that activates TBK1-IRF3 in infected cells is an ordered helical CARD filament,
    not a liquid-like condensate.
  description: Infect cells expressing endogenously tagged MAVS with Sendai virus and image the outer membrane
    by cryo-electron tomography with subtomogram averaging to test whether the in situ assemblies share the 4.2
    A filament symmetry. In parallel, measure subunit exchange by FRAP and single-molecule photobleaching on the
    same structures, and correlate assembly state cell-by-cell with phospho-IRF3 immunofluorescence; include TRIM31
    knockout and MAVS K10/K311/K461R cells to test whether K63 ubiquitination changes the material state rather
    than only the amount of assembly.
  experiment_type: correlative cryo-electron tomography and live-cell biophysics
- hypothesis: The mitochondrial and peroxisomal MAVS pools are established by distinct targeting determinants
    within the single C-terminal tail anchor and do not interconvert.
  description: Scan the tail anchor by systematic substitution (helix length, flanking charge, hydrophobicity)
    in a MAVS-null background and score steady-state partition by immuno-electron microscopy and organelle fractionation
    with marker controls for mitochondria-associated ER membranes. Test interconversion by compartment-selective
    photoconversion or self-labelling pulse-chase, and read out which interferon programme each variant supports
    using the rapid interferon-independent and delayed interferon-dependent gene sets that distinguish the two
    pools.
  experiment_type: tail-anchor mutagenesis with organelle fractionation and pulse-chase imaging
knowledge_gaps:
- gap_statement: 'Whether MAVS maintenance of the outer-membrane translocase is an activity of MAVS at the membrane
    or a downstream consequence of the mitochondrial quality-control collapse that follows its loss is undetermined:
    the direction of causality between loss of TOM complex assembly and the fragmentation, depolarisation and
    mitophagy seen in MAVS-null cells has not been established.'
  boundary: 'Firmly established: MAVS is a tail-anchored outer-membrane protein; it interacts with TOMM70, which
    recruits TBK1/IRF3 via Hsp90; and MAVS-null cells show reduced TOM core-subunit abundance, impaired protein
    import, fragmented and depolarised mitochondria, increased mitophagy, and loss of an interferon-independent
    antiviral state that MAVS re-expression restores.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Decides whether MAVS has a second, non-signalling molecular function in mitochondrial biogenesis,
    which would be the first such role for an RLR adaptor and would change how interferon-independent antiviral
    phenotypes of MAVS loss are interpreted.
  resolution: Acute, inducible depletion (degron or auxin-inducible degradation) rather than chronic knockout,
    with a time course comparing TOM assembly (blue-native PAGE, radiolabelled preprotein import) against the
    onset of fragmentation and mitophagy, plus rescue with signalling-dead MAVS (CARD or pLxIS mutants) to separate
    adaptor activity from the maintenance function.
  provenance:
  - reference_id: PMID:42808786
    supporting_text: Loss of MAVS leads to severe mitochondrial fragmentation, depolarization, and mitophagy,
      accompanied by diminished mitochondrial bioenergetics and protein import.
    full_text_unavailable: true
  - reference_id: PMID:42808786
    supporting_text: Mechanistically, MAVS maintains mitochondrial integrity by maintaining the expression and
      assembly of the translocase of the outer membrane complex and sustaining the abundance of its core components.
    full_text_unavailable: true
  - reference_id: PMID:20628368
    supporting_text: In this study, we identified translocases of outer membrane 70 (Tom70), a mitochondrial import
      receptor, to interact with MAVS upon RNA virus infection.
- gap_statement: 'The physical nature of the signalling-competent MAVS assembly in cells is unresolved: it is
    not known whether the species that activates TBK1-IRF3 in vivo is the ordered helical CARD filament seen by
    cryo-EM, a liquid-like condensate, or a heterogeneous mixture, nor what sets its size or lifetime on the membrane.'
  boundary: 'Firmly established: purified and native MAVS CARD forms helical filaments (4.2 A cryo-EM, C1 symmetry);
    RIG-I CARD tetramers nucleate them; filament formation can be reconstituted in vitro; and K63 ubiquitination
    at K10, K311 and K461 by TRIM31 promotes aggregation in cells.'
