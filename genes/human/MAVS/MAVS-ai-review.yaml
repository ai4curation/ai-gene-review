core_functions:
- description: Signalling adaptor of the RIG-I-like receptor pathway. On the cytosolic face of the mitochondrial
    outer membrane, MAVS receives the CARD signal from activated RIG-I or MDA5, polymerises, and assembles a signalosome
    that recruits TRAF E3 ligases and the TBK1/IKK kinases; phosphorylation of its pLxIS motif then docks IRF3
    for activation, driving type I interferon production and canonical NF-kappaB signalling. MAVS contributes
    binding surfaces and no catalysis.
