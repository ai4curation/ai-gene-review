        domain of TRAF3 and a TRAF-interaction motif (TIM) within Cardif.
    - reference_id: PMID:16127453
      supporting_text: Overexpression of IPS-1 induced type I interferon and interferon-inducible genes through
        activation of IRF3, IRF7 and NF-kappaB transcription factors.
