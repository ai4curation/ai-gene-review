      once full text is available.
  full_text_unavailable: true
existing_annotations:
- term:
    id: GO:0000151
    label: ubiquitin ligase complex
  evidence_type: NAS
  original_reference_id: PMID:21200404
  qualifier: part_of
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: MAVS recruits ubiquitin ligases; it is not a subunit of a ubiquitin ligase complex.
    reason: Not entirely wrong but an over-reading of a scaffold relationship. The cited paper maps a TRAF-interacting
      motif at aa450-468 through which MAVS binds the E3 ligase TRAF3, and MAVS is also a substrate of TRIM31,
      SMURF1, MARCHF5 and ITCH. Recruiting and being modified by E3 ligases is adaptor behaviour, already captured
      by GO:0035591; part_of a ubiquitin ligase complex asserts that MAVS is a constituent of the catalytic machinery,
      which no experiment here shows. The row is NAS, so no curator-read full text is being second-guessed.
    supported_by:
    - reference_id: PMID:21200404
      supporting_text: In this study, we demonstrate that C-terminus of MAVS harbors a novel TRAF3-binding site
        in the aa450-468 region of MAVS.
    - reference_id: PMID:21200404
      supporting_text: Onset of antiviral and inflammatory responses to viral pathogens necessitates the regulated
        spatiotemporal recruitment of signaling adapters, kinases and transcriptional proteins to the mitochondrial
        antiviral signaling protein (MAVS).
- term:
    id: GO:0002218
    label: activation of innate immune response
  evidence_type: IDA
  original_reference_id: PMID:20628368
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: 'MAVS activates, rather than merely participates in, the innate immune response: engagement of its
      CARD switches the pathway on.'
    reason: Correct and informative about direction. Tom70 recruitment to activated MAVS delivers TBK1/IRF3 to
      mitochondria; MAVS overexpression alone induces IFN-beta. Kept as-is.
    supported_by:
    - reference_id: PMID:20628368
      supporting_text: In this study, we identified translocases of outer membrane 70 (Tom70), a mitochondrial
        import receptor, to interact with MAVS upon RNA virus infection.
    - reference_id: PMID:16127453
      supporting_text: Overexpression of IPS-1 induced type I interferon and interferon-inducible genes through
        activation of IRF3, IRF7 and NF-kappaB transcription factors.
- term:
