- term:
    id: GO:0042307
    label: positive regulation of protein import into nucleus
  evidence_type: IDA
  original_reference_id: PMID:18818105
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: IRF3 nuclear accumulation is the readout of MAVS signalling, not a nuclear-import step MAVS participates
      in.
    reason: Same over-reading as the RNA polymerase II row. What MAVS does is present a phosphorylated pLxIS motif
      that docks IRF3 for TBK1 phosphorylation; nuclear import follows from IRF3 dimerisation and is carried out
      by the import machinery. MAVS contributes no import receptor, cargo-recognition or nuclear-pore function.
      The IRF3-binding (GO:0140297) and interferon-production terms record the same experiments without asserting
      a role in protein import.
    supported_by:
    - reference_id: PMID:18818105
      supporting_text: MITA also interacted with IRF3 and recruited the kinase TBK1 to the VISA-associated complex.
    - reference_id: PMID:25636800
      supporting_text: Phosphorylated MAVS and STING then bind to a positively charged surface of interferon regulatory
        factor 3 (IRF3) and thereby recruit IRF3 for its phosphorylation and activation by TBK1.
