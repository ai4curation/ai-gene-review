- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16127453
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13158
  review:
    action: REMOVE
    summary: Bare protein binding records that an interaction was detected without saying what MAVS does.
    reason: 'Removed under the generic-protein-binding policy: GO:0005515 carries no functional information, and
      removal does not mean the reported interaction is false. MAVS is an interaction hub with more than ninety
      such rows; the informative content of its binding activity is captured by CARD domain binding, identical
      protein binding, protein serine/threonine kinase binding and DNA-binding transcription factor binding. Where
      this row''s partner is a regulator, a substrate-modifying E3 or a viral antagonist, the relationship belongs
      in a GO-CAM model or in the partner''s own review, not in a bare binding annotation on MAVS.'
