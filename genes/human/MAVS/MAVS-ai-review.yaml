description: 'MAVS (mitochondrial antiviral-signaling protein, also known as IPS-1, Cardif and VISA) is the signalling
  adaptor of the cytosolic RNA-sensing arm of innate immunity. It is a tail-anchored protein: a single C-terminal
  transmembrane segment inserts it into the mitochondrial outer membrane, and a second pool is anchored in the
  peroxisomal membrane, with the N-terminal CARD, the proline-rich region and the TRAF-interaction motifs all
  facing the cytosol. When RIG-I or MDA5 detects viral double-stranded or 5''-triphosphate RNA in the cytosol,
  the sensor''s tandem CARDs template the nucleation of MAVS CARD into helical, prion-like filaments that propagate
  along the membrane; filament assembly is the switch that converts a transient RNA-binding event into a sustained,
  amplified signal. The assembled MAVS signalosome recruits TRAF E3 ligases (TRAF1, TRAF2, TRAF3 and TRAF6) and,
  through them, the kinases TBK1, IKKepsilon and IKKalpha/IKKbeta. TBK1 and IKK phosphorylate conserved serine/threonine
  clusters in MAVS, and the phosphorylated pLxIS motif then docks IRF3 so that TBK1 can phosphorylate and activate
  it; in parallel the NF-kappaB branch is switched on. The outputs are type I interferons, interferon-stimulated
  genes and proinflammatory cytokines and chemokines including IL-6, TNF, CCL5 and CXCL10. The two organellar
  pools are not redundant: peroxisomal MAVS drives rapid, interferon-independent expression of defence factors,
  while mitochondrial MAVS drives a slower interferon-dependent programme that amplifies and sustains the response.
  MAVS has a second adaptor role outside interferon induction, recruiting NLRP3 to mitochondria and promoting
  NLRP3 inflammasome assembly and IL-1beta production, and the same pathway senses bacterial as well as viral
  nucleic acid through RNA-polymerase-III-derived RNA. Because MAVS is the chokepoint of the pathway it is a favourite
  target of viral antagonists, which cleave it (hepatitis C virus NS3/4A, Seneca Valley virus 3C), sequester it
  (SARS-CoV-2 M and ORF9b), block its interaction with RIG-I (respiratory syncytial virus NS1) or reroute it to
  lysosomes (Epstein-Barr virus BILF1). Its activity is tuned by a dense layer of ubiquitination, phosphorylation,
  palmitoylation and UFMylation events, and work published in 2026 additionally implicates MAVS in maintaining
  expression and assembly of the mitochondrial outer-membrane translocase, giving it an interferon-independent
  contribution to mitochondrial integrity and to viral restriction.'
