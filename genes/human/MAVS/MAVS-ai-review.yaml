- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: EXP
  original_reference_id: PMID:20451243
  qualifier: located_in
  review:
    action: ACCEPT
    summary: A pool of MAVS is on peroxisomes, where it drives a separate, interferon-independent arm of the antiviral
      response.
    reason: Root organelle term with direct evidence; peroxisomal MAVS is not an artefact of fractionation but
      a functionally distinct pool, shown by organelle-restricted MAVS-Pex and MAVS-Mito constructs with different
      output kinetics. The sub-compartment is separately annotated (GO:0005778), so the root term needs no addition.
    supported_by:
    - reference_id: PMID:20451243
      supporting_text: Here, we report that the RIG-I-like receptor (RLR) adaptor protein MAVS is located on peroxisomes
        and mitochondria.
    - reference_id: PMID:20451243
      supporting_text: Upon viral infection, peroxisomal MAVS induces the rapid interferon-independent expression
        of defense factors that provide short-term protection, whereas mitochondrial MAVS activates an interferon-dependent
        signaling pathway with delayed kinetics, which amplifies and stabilizes the antiviral response.
