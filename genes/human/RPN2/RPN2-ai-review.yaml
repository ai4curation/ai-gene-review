references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      InterPro2GO mapping of the ribophorin II domain signature supplies RPN2's IEA
      annotations to oligosaccharyltransferase complex (GO:0008250) and to the generic
      membrane term (GO:0016020); the OST-complex mapping is correct but the membrane
      term is less informative than the ER membrane localization supported elsewhere.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings:
  - statement: >-
      Curator sequence-similarity transfer from an experimentally characterized ortholog
      supplies the ISS annotation of RPN2 to endoplasmic reticulum (GO:0005783), consistent
      with the conserved ER-membrane localization of ribophorin II across vertebrates.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT phylogenetic inference places RPN2 within the ribophorin II family clade whose
      members are OST subunits, supporting the IBA annotations to oligosaccharyltransferase
      complex (GO:0008250) and protein N-linked glycosylation (GO:0006487).
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      UniProt subcellular-location keyword mapping supplies the IEA annotations of RPN2 to
      endoplasmic reticulum (GO:0005783) and endoplasmic reticulum membrane (GO:0005789),
      matching the multi-pass ER membrane topology recorded in the UniProt entry.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: >-
      Curated immunofluorescence data (Human Protein Atlas) support the IDA annotation of
      RPN2 to endoplasmic reticulum (GO:0005783).
- id: PMID:10660554
  title: Retention of subunits of the oligosaccharyltransferase complex in the endoplasmic
    reticulum.
  full_text_unavailable: true
  findings:
  - statement: >-
      Ribophorin II (RII, RPN2) is one of three type I ER transmembrane proteins that, with
      DAD1, form the oligomeric complex carrying oligosaccharyltransferase activity.
    supporting_text: >-
      In this study, we have identified ER localization domains within the three type I
      transmembrane proteins, ribophorin I (RI), ribophorin II (RII), and OST48. Together
      with DAD1, these membrane proteins form an oligomeric complex that has
      oligosaccharyltransferase (OST) activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      RPN2 carries ER-retention information independently in its transmembrane and
      cytoplasmic domains, accounting for its steady-state ER-membrane residence.
    supporting_text: >-
      We have previously shown that ER retention information is independently contained
      within the transmembrane and the cytoplasmic domain of RII
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The isolated lumenal domain of RPN2 is stabilized and retained in the ER when
      co-expressed with OST48, indicating direct RPN2-OST48 assembly within the OST complex.
    supporting_text: >-
      In the case of the Tac chimera containing only the luminal domain of RII, which by
      itself exits from the ER and is rapidly degraded, it is retained in the ER and becomes
      stabilized when coexpressed with OST48.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Identifies ER-retention determinants in ribophorin I, ribophorin II (RII) and OST48;
      confirms RII is an OST subunit and an ER membrane protein. Used by GOA only for the broad
      "protein modification process" TAS annotation, which understates the specific role.
- id: PMID:15835887
  title: Proteomic analysis of mammalian oligosaccharyltransferase reveals multiple
    subcomplexes that contain Sec61, TRAP, and two potential new subunits.
  full_text_unavailable: true
  findings:
  - statement: >-
      Ribophorin II is present in all mammalian OST subcomplexes isolated from actively
      translating ribosomes, establishing it as a constitutive OST subunit.
    supporting_text: >-
      All known mammalian OST subunits (STT3-A, ribophorin I, ribophorin II, OST48, and
      DAD1) were present in all complexes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The OST activity that RPN2 contributes to is the co-translational transfer of
      high-mannose sugars onto nascent polypeptides in the rough ER lumen.
    supporting_text: >-
      Oligosaccharyltransferase (OST) catalyzes the cotranslational transfer of high-mannose
      sugars to nascent polypeptides during N-linked glycosylation in the rough endoplasmic
      reticulum lumen.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      RPN2-containing OST complexes are heterogeneous and associate with Sec61 and, in the
      largest form, with the TRAP complex.
    supporting_text: >-
      Both remained stably associated with heterotrimeric Sec61alphabetagamma, while
      OSTC(III) also contained the tetrameric TRAP complex.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Proteomic dissection of mammalian OST subcomplexes; supports RPN2 as a component of the
      OST enzyme and its contribution to the complex-level glycotransferase activity.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  full_text_unavailable: true
  findings:
  - statement: >-
      RPN2 was detected in a high-throughput membrane-proteome survey of the NK-like YTS cell
      line; the study assigns no function and only supports generic membrane association.
    supporting_text: >-
      Mass spectrometric analysis identified 1843 proteins with high confidence scores. On
      the basis of the presence of transmembrane regions or evidence of posttranslational
      modifications and prediction algorithms, approximately 40% of the identified proteins
      were predicted as plausible membrane proteins.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput NK-cell membrane proteome; RPN2 detected as a membrane protein. Only
      supports the generic "membrane" localization, not a specific function.
- id: PMID:24965446
  title: Host factors that interact with the pestivirus N-terminal protease, Npro,
    are components of the ribonucleoprotein complex.
  findings:
  - statement: >-
      The RPN2 interaction reported here arises from a mass-spectrometry survey of host
      proteins bound to the pestivirus Npro protease, a viral-infection context that does not
      define an endogenous RPN2 molecular function.
    supporting_text: >-
      Here we used mass spectrometry to identify a new role for N(pro) through its
      interaction with over 55 associated proteins, mainly ribosomal proteins and
      ribonucleoproteins
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Pestivirus Npro interactome; source of a bare protein-binding IPI annotation. Interaction
      is in an infection context and does not define RPN2's endogenous molecular function.
- id: PMID:28169274
  title: Armc5 deletion causes developmental defects and compromises T-cell immune
    responses.
  findings:
  - statement: >-
      The RPN2-ARMC5 interaction derives from a yeast two-hybrid screen for ARMC5 partners;
      the study's functional conclusions concern ARMC5, not RPN2.
    supporting_text: >-
      Yeast 2-hybrid assays identify 16 ARMC5-binding partners.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      ARMC5 knockout / T-cell study; source of a bare protein-binding IPI (RPN2-ARMC5). Does not
      inform RPN2's core molecular function.
- id: PMID:29290612
  title: Removal of RTF2 from Stalled Replisomes Promotes Maintenance of Genome Integrity.
  full_text_unavailable: true
  findings:
  - statement: >-
      This study characterizes DDI1/DDI2 shuttle proteins in replication-fork restart; the
      RPN2-DDI2 interaction it reports is incidental to RPN2's ER glycosylation function.
    supporting_text: >-
      We further show that the proteasomal shuttle proteins DDI1 and DDI2 are required for
      RTF2 removal from stalled forks.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Replisome/genome-integrity study; source of the RPN2-DDI2 protein-binding IPI, also
      recorded in UniProt as "Interacts with DDI2". Interaction is real but does not define
      RPN2's molecular function.
- id: PMID:31831667
  title: Cryo-electron microscopy structures of human oligosaccharyltransferase complexes
    OST-A and OST-B.
  full_text_unavailable: true
  findings:
  - statement: >-
      Humans express two distinct OST complexes, the co-translational OST-A and the
      post-translocational OST-B, both resolved by cryo-EM; RPN2 (ribophorin-II) is a subunit
      of each.
    supporting_text: >-
      Mammals express two distinct OST complexes that act in a cotranslational (OST-A) or
      posttranslocational (OST-B) manner. Here, we present high-resolution cryo-electron
      microscopy structures of human OST-A and OST-B.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      OST-A and OST-B share an overall architecture and differ chiefly in the catalytic
      subunit (STT3A vs STT3B) and its complex-specific partner (DC2 vs MAGT1), while the
      ribophorins remain common core subunits.
    supporting_text: >-
      Although they have similar overall architectures, structural differences in the
      catalytic subunits STT3A and STT3B facilitate contacts to distinct OST subunits, DC2 in
      OST-A and MAGT1 in OST-B.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The reaction catalyzed by the RPN2-containing complexes is transfer of a high-mannose
      glycan onto secretory proteins in the ER.
    supporting_text: >-
      Oligosaccharyltransferase (OST) catalyzes the transfer of a high-mannose glycan onto
      secretory proteins in the endoplasmic reticulum.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Definitive structural characterization of both human OST complexes; establishes RPN2 as a
      core subunit of OST-A and OST-B and its role in N-linked glycosylation. Cached record is
      abstract-only (full_text_available: false).
- id: PMID:32707033
  title: Kinase Interaction Network Expands Functional and Disease Roles of Human
    Kinases.
  findings:
  - statement: >-
      The RPN2-POMK interaction comes from a large-scale affinity-purification map of over
      300 human kinases, a discovery-scale dataset that assigns no specific function to RPN2.
    supporting_text: >-
      Here, we present a comprehensive mass-spectrometry-based analysis of a human kinase
      interaction network covering more than 300 kinases.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput kinase interaction network; source of a bare protein-binding IPI
      (RPN2-POMK). Does not inform RPN2's core molecular function.
- id: PMID:36697828
  title: Visualization of translation and protein biogenesis at the ER membrane.
  findings:
  - statement: >-
      Cryo-electron tomography of native ER membranes resolves an atomic model of the most
      abundant translocon variant, comprising SEC61, TRAP and the RPN2-containing
      oligosaccharyltransferase complex A (OSTA).
    supporting_text: >-
      The near-complete atomic model of the most abundant ER translocon variant comprising
      the protein-conducting channel SEC61, TRAP and the oligosaccharyltransferase complex A
      (OSTA) reveals specific interactions of TRAP with other translocon components.
    reference_section_type: ABSTRACT
  - statement: >-
      The ribosome-translocon complex in which OST-A operates governs N-glycosylation of
      nascent proteins alongside their synthesis, translocation, membrane insertion and
      folding.
    supporting_text: >-
      It governs the synthesis, translocation, membrane insertion, N-glycosylation, folding
      and disulfide-bond formation of nascent proteins.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-ET of the native ER translocon; resolves the SEC61-OSTA-TRAP translocon (with RPN2 in
      OSTA) as the most abundant translocon and confirms OST-A's co-translational
      N-glycosylation role.
- id: PMID:38670073
  title: Positive selection CRISPR screens reveal a druggable pocket in an oligosaccharyltransferase
    required for inflammatory signaling to NF-κB.
  full_text_unavailable: true
  findings:
  - statement: >-
      Genome-wide CRISPR screening identifies the RPN2-containing OST-A complex as
      specifically required for N-glycosylation and cell-surface delivery of TLR4,
      demonstrating substrate selectivity between the two OST complexes.
    supporting_text: >-
      we discovered that the LPS receptor Toll-like receptor 4 (TLR4) is specifically
      dependent on the oligosaccharyltransferase complex OST-A for N-glycosylation and
      cell-surface localization
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Cryo-EM of the OST-A complex shows the inhibitor NGI-1 bound in the STT3A catalytic
      site trapping the dolichyl-PP-linked donor glycan, confirming that catalysis resides in
      STT3A rather than in accessory subunits such as RPN2.
    supporting_text: >-
      These variants, in conjunction with cryoelectron microscopy studies, revealed that
      NGI-1 binds the catalytic site of STT3A, where it traps a molecule of the donor
      substrate dolichyl-PP-GlcNAc2-Man9-Glc3, suggesting an uncompetitive inhibition
      mechanism.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      CRISPR/cryo-EM study of the STT3A-containing OST-A complex; supports RPN2 as an OST-A
      subunit and OST-A's role in N-glycosylation of TLR4. Cached record is abstract-only.
- id: PMID:9642163
  title: 'Interleukin-2 induces N-glycosylation in T-cells: characterization of human
    lymphocyte oligosaccharyltransferase.'
  full_text_unavailable: true
  findings:
  - statement: >-
      Ribophorin II was identified by N-terminal sequencing among the four predominant
      proteins of an 85-fold purified human lymphocyte oligosaccharyltransferase preparation,
      giving direct biochemical evidence for RPN2 as an OST subunit.
    supporting_text: >-
      After solubilization and 85-fold purification from salt-washed microsomes, the enzyme
      preparation contained four predominant proteins. N-terminal sequence analysis
      identified the proteins as ribophorin I, ribophorin II (doublet), and a 50-kDa
      homologue of Wbp1, a yeast protein essential for N-glycosylation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The purified RPN2-containing enzyme accounts for the N-glycosylation activity of human
      lymphocytes, which rises about ten-fold upon mitogen activation.
    supporting_text: >-
      N-glycosylation activity increased 10-fold after mitogen activation of PBLs.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The RPN2-containing oligosaccharyltransferase activity localizes predominantly to the
      microsomal (ER) fraction of lymphocytes.
    supporting_text: >-
      The enzyme mediating N-glycosylation in lymphocytes was localized predominantly but not
      entirely to a microsomal organelle by subcellular fractionation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Biochemical purification of human lymphocyte OST; N-terminal sequencing identified
      ribophorin I and ribophorin II as OST components. Direct experimental support for OST
      membership and N-glycosylation involvement. Cached record is abstract-only.
- id: Reactome:R-HSA-446209
  title: Transfer of N-glycan to the protein
  findings:
  - statement: >-
      Reactome names RPN2 (ribophorin 2) as one of the subunits of the ER-membrane OST
      complex that transfers the 14-sugar lipid-linked oligosaccharide en bloc onto nascent
      protein, and notes that an RPN2 mutation causes a congenital disorder of glycosylation.
    supporting_text: >-
      This reaction is catalyzed by the oligosaccharyltransferase (OST) complex, comprising
      at least seven proteins; DAD1 (Dolichyl-diphosphooligosaccharide--protein
      glycosyltransferase subunit DAD1), DDOST (OST48 in yeast), RPN1 (ribophorin 1), RPN2
      (ribophorin 2), OST4, TUSC3 (N33), MAGT1 (magnesium transporter protein 1) and either
      STT3A or STT3B
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      The acceptor specificity of the RPN2-containing OST complex is the Asn-X-Thr/Ser
      sequon, and not all such sites are used in vivo.
    supporting_text: >-
      The signal for glycosylation is the consensus sequence Asn - X - Thr/Ser, where the
      first amino acid is always Asn, the second can be any amino acid except for Pro, and
      the third position may be Thr, Ser or Cys, with a preference for the first
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9694793
  title: Spike protein gets N-glycosylated
  findings:
  - statement: >-
      RPN2 is listed as an OST-complex participant in the ER N-glycosylation of the
      SARS-CoV-2 spike protein; this is a substrate-specific reaction record rather than
      evidence for a distinct RPN2 function.
    supporting_text: >-
      Glycosyltransferases in the endoplasmatic reticulum are responsible for the attachment
      of numerous high-mannose N-glycans on the SARS-CoV-2 spike protein.
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9816276
  title: CDH1 is N-glycosylated on asparagine residues in endoplasmic reticulum
  findings:
  - statement: >-
      RPN2 participates as an OST subunit in ER N-glycosylation of E-cadherin, a
      substrate-level reaction record that supports the generic ER-membrane localization
      rather than a CDH1-specific RPN2 role.
    supporting_text: >-
      All four glycosylated asparagines in CDH1 conform with the glycosylation sequon
      Asn-X-Thr/Ser which is glycosylated in the endoplasmic reticulum (ER) through transfer
      of the preassembled, high-mannose oligosaccharide
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9918962
  title: E is N-glycosylated
  findings:
  - statement: >-
      RPN2 appears as an OST-complex participant in the ER N-glycosylation of the dengue
      virus E glycoprotein; a host-pathway reaction record, not evidence of a virus-specific
      RPN2 function.
    supporting_text: >-
      DENV-2 E protein is known to be N-glycosylated at Asn-67 and Asn-153 (Asn-347 and
      Asn-433 of the polyprotein, respectively), a process requiring, among others, the
      oligosaccharyl transferase activity of the host OST complex
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9918988
  title: pre-M is N-glycosylated
  findings:
  - statement: >-
      RPN2 appears as an OST-complex participant in ER N-glycosylation of the dengue virus
      prM protein; a substrate-level reaction record supporting only ER-membrane
      localization.
    supporting_text: >-
      Dengue virus pre-prM is N-glycosylated at Asn-7, Asn-31, Asn-52, and Asn-69 (Asn-121,
      Asn-145, Asn-166 and Asn-183 of the polyprotein), requiring, among others, the
      oligosaccharyl transferase activity of the OST complex
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9919011
  title: Pre-NS1 folds and is N-glycosylated
  findings:
  - statement: >-
      RPN2 appears as an OST-complex participant in the co-folding N-glycosylation of dengue
      virus NS1; a substrate-level record supporting ER-membrane localization only.
    supporting_text: >-
      Pre-NS1 protein, while being folded, is glycosylated at Asn-130 and Asn-207 (Asn-905
      and Asn-982 in the polyprotein, respectively).
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9931286
  title: CD274 N-linked glycosylation in ER
  findings:
  - statement: >-
      RPN2 appears as an OST-complex participant in the ER N-glycosylation of PD-L1 (CD274);
      the catalytic role in the record is attributed to STT3A/STT3B, consistent with RPN2
      being a non-catalytic subunit.
    supporting_text: >-
      PD-L1 is N-glycosylated at N192, N200 and N219 by the OST complex (STT3A and STT3A) in
      the ER lumen.
    reference_section_type: DATABASE_ENTRY
suggested_questions:
- question: >-
    Does RPN2 make a defined mechanistic contribution to OST catalysis or substrate
    selection - for example acceptor-sequon presentation or lipid-linked oligosaccharide
    handoff - or is its role purely structural, stabilizing the STT3A/STT3B core? A
    contributes_to GO:0004579 annotation is currently justified only at the complex level.
  experts:
  - Locher KP
  - Ramírez AS
  - Kelleher DJ
  - Gilmore R
- question: >-
    Do the OST-A and OST-B complexes differ in their requirement for RPN2, and is the
    reported CDG-associated RPN2 variant selectively deleterious to one of the two complexes?
  experts:
  - Locher KP
  - Contessa JN
  - Lampson BL
- question: >-
    Is RPN2's large lumenal domain a bona fide chaperone/substrate-recruitment module for
    nascent glycoproteins, which would justify a more specific molecular function term than
    structural molecule activity?
  experts:
  - Kreibich G
  - Gilmore R
  - Förster F
suggested_experiments:
- hypothesis: >-
    RPN2 is required for assembly and stability of both OST-A and OST-B, and its loss
    reduces N-glycosylation site occupancy globally rather than for a defined substrate class.
  description: >-
    Generate RPN2 knockout and degron-tagged HEK293 or HAP1 lines, then quantify OST-A
    (STT3A) and OST-B (STT3B) complex integrity by blue-native PAGE and interaction
    proteomics, and measure site-specific N-glycosylation occupancy across the glycoproteome
    by intact-glycopeptide mass spectrometry after PNGase F/Endo H in 18O water. Compare the
    occupancy signature with that of STT3A and STT3B single knockouts to test whether RPN2
    loss phenocopies both.
  experiment_type: knockout glycoproteomics and native complex analysis
- hypothesis: >-
    The lumenal domain of RPN2 contacts nascent acceptor polypeptides and contributes to
    sequon presentation rather than acting only as a scaffold.
  description: >-
    Perform site-specific photo-crosslinking (incorporating p-benzoyl-phenylalanine at
    lumenal-domain positions guided by the OST-A/OST-B cryo-EM structures) in ER microsomes
    translating defined glycoprotein substrates, and identify crosslinked nascent chains by
    mass spectrometry. Complement with cryo-EM of OST-A stalled on a ribosome-nascent-chain
    complex to look for RPN2-substrate density.
  experiment_type: site-specific photo-crosslinking and structural analysis
- hypothesis: >-
    RPN2 loss-of-function variants cause a congenital disorder of glycosylation through
    destabilization of the OST core rather than through loss of an RPN2-specific catalytic
    contribution.
  description: >-
    Reconstitute patient-derived RPN2 variants in RPN2-null cells and assay OST complex
    assembly (blue-native PAGE, STT3A/STT3B steady-state levels), in vitro
    oligosaccharyltransferase activity on a synthetic acceptor peptide with purified
    complexes, and transferrin/ApoC-III isoform profiling as a clinical CDG readout.
  experiment_type: variant complementation and in vitro OST activity assay
