- term:
    id: GO:0007339
    label: binding of sperm to zona pellucida
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008053906
  - RGD:1565454
  review:
    summary: Propagated assertion that IZUMO1 mediates sperm binding to the zona pellucida.
    action: REMOVE
    reason: Contradicted by the knockout phenotype. Izumo1-null sperm bind to and penetrate the zona pellucida
      normally and fail only at fusion with the egg plasma membrane. IZUMO1 is not exposed until the acrosome
      reaction and binds oolemmal JUNO, not zona proteins. Recognition of the egg plasma membrane is captured
      by sperm-egg recognition.
    supported_by: &id005
    - reference_id: PMID:15759005
      supporting_text: They produced normal-looking sperm that bound to and penetrated the zona pellucida
        but were incapable of fusing with eggs.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN008053906
        source_status: UNRESOLVED
        comment: Ancestral Izumo-family node carrying zona-binding; contradicted for IZUMO1 by the mouse
          knockout in which null sperm bind and penetrate the zona normally.
      - source_id: RGD:1565454
        source_status: UNRESOLVED
        comment: Rat Izumo1 descendant evidence not inspected; may reflect a sperm-binding assay not resolving
          zona versus oolemma.
