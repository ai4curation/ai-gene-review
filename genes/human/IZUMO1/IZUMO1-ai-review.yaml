id: Q8IYV9
gene_symbol: IZUMO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IZUMO1 is a sperm-specific single-pass type I membrane protein of the Izumo family, built
  from an N-terminal four-helix IZUMO domain, a beta-hairpin hinge and an immunoglobulin-like domain.
  It resides in the acrosomal membranes of the sperm head and becomes exposed on the sperm plasma membrane
  (equatorial segment) only after the acrosome reaction. There its ectodomain binds the GPI-anchored egg
  receptor JUNO (IZUMO1R) in a 1:1 complex, and in humans also engages the oolemmal receptor FCRL3/MAIA,
  providing the essential adhesion between gamete membranes that precedes sperm-egg fusion. IZUMO1 forms
  a conserved trimeric complex with SPACA6 and TMEM81 on sperm. Loss of Izumo1 in mice causes male sterility
  because sperm penetrate the zona pellucida but cannot fuse with the egg.
