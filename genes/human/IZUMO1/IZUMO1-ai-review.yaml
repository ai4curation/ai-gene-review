  review:
    summary: IZUMO1 binds the egg membrane protein JUNO (IZUMO1R), which is annotated as its receptor.
    action: MODIFY
    reason: The JUNO interaction is direct and well established, including in humans, but JUNO is a GPI-anchored
      adhesion receptor with no demonstrated signaling output. The binding acts in heterotypic gamete
      adhesion, so the adhesion-specific binding term (already carried by the gene through IBA) describes
      the activity more accurately than signaling receptor binding.
