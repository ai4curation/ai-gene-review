  - PANTHER:PTN008053906
  review:
    summary: IZUMO1 is often described as the ligand of the JUNO receptor.
    action: MARK_AS_OVER_ANNOTATED
    reason: IZUMO1 does bind JUNO, but receptor ligand activity (a signaling receptor activator) asserts
      that binding changes the activity of the receptor. JUNO is a GPI-anchored protein with no known
      signaling function, and the interaction is a gamete adhesion event. Its binding activity is better
      captured by protein binding involved in heterotypic cell-cell adhesion.
    supported_by: &id011
    - reference_id: file:human/IZUMO1/IZUMO1-uniprot.txt
      supporting_text: The ligand-receptor interaction probably does not act as a membrane 'fusogen'.
    - reference_id: PMID:24739963
