core_functions:
- description: Sperm surface adhesion molecule that, after the acrosome reaction, binds the egg receptor
    JUNO (and human FCRL3/MAIA) via its ectodomain to tether sperm to the oolemma, an essential step preceding
    sperm-egg membrane fusion.
  molecular_function:
    id: GO:0086080
    label: protein binding involved in heterotypic cell-cell adhesion
  locations:
  - id: GO:1990913
    label: sperm head plasma membrane
  - id: GO:0002080
    label: acrosomal membrane
  directly_involved_in:
  - id: GO:0035036
    label: sperm-egg recognition
  - id: GO:0007342
    label: fusion of sperm to egg plasma membrane involved in single fertilization
  supported_by:
  - reference_id: PMID:27309808
    supporting_text: The central β-hairpin region of IZUMO1 provides the main platform for JUNO binding
  - reference_id: PMID:15759005
    supporting_text: They produced normal-looking sperm that bound to and penetrated the zona pellucida
      but were incapable of fusing with eggs.
suggested_questions:
- question: Is IZUMO1 itself part of the fusion machinery, or does it only provide adhesion while another
    sperm or egg protein acts as the fusogen?
- question: How do JUNO and FCRL3/MAIA binding events coordinate in time on the human oolemma?
suggested_experiments:
- description: Reconstitute human IZUMO1-SPACA6-TMEM81 complexes on cells or proteoliposomes and measure
    binding to JUNO and FCRL3/MAIA and any induced membrane fusion.
  experiment_type: biochemical reconstitution
