id: Q9NQ38
gene_symbol: SPINK5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SPINK5 encodes LEKTI (lympho-epithelial Kazal-type-related inhibitor), a secreted multidomain serine
  protease inhibitor of about 1,064 residues with an N-terminal signal peptide and 15 Kazal-like inhibitory
  domains, two of them classical three-disulfide Kazal domains and 13 of a two-disulfide variant. It is
  expressed in differentiated layers of stratified epithelia, most strongly in the granular and upper
  spinous layers of the epidermis, and in thymus, oral and vaginal mucosa and tonsils. The precursor is
  N-glycosylated, cleaved by furin after leaving the endoplasmic reticulum into single- and multidomain
  fragments, transported in epidermal lamellar granules and secreted into the extracellular spaces of the
  upper stratum granulosum and stratum corneum. Purified and recombinant LEKTI fragments inhibit the
  epidermal kallikreins KLK5 (its strongest target), KLK7 and KLK14, as well as trypsin, plasmin and other
  serine proteases; binding to KLK5 is tight at neutral pH and released at acidic pH, so the epidermal pH
  gradient restricts kallikrein activity to the outermost stratum corneum. By holding these proteases in
  check LEKTI limits degradation of corneodesmosomal desmoglein 1, profilaggrin processing,
  cathelicidin processing and KLK5-PAR2-driven inflammatory signalling. Loss-of-function mutations cause
  Netherton syndrome, a severe ichthyosis with hair shaft defects and atopy, and Spink5-deficient mice
  reproduce the skin barrier failure.
