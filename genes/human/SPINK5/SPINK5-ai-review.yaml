- id: file:human/SPINK5/SPINK5-bioinformatics/RESULTS.md
  title: SPINK5 PANTHER 19 tree placement
  findings:
  - statement: The serine-type endopeptidase inhibitor IBD node PTN000099251 covers only therian SPINK5
      orthologs; fly CG32354 and Fs share only a Bilateria node with SPINK5.
core_functions:
- description: >-
    Secreted LEKTI and its furin-generated single- and multidomain fragments act as tight-binding
    inhibitors of serine endopeptidases. Their main physiological targets are the epidermal kallikreins
    KLK5, KLK7 and KLK14 in the extracellular space of the upper epidermis, where inhibition of KLK5 is
    released at the acidic pH of the outer stratum corneum. The activity is established by direct assays
    with native and recombinant human protein; the PAINT inference places it at the Theria node, so it is
    shared by mammalian orthologs but not by invertebrate members of PTHR10913.
  molecular_function:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  locations:
  - id: GO:0005615
    label: extracellular space
  - id: GO:0097209
    label: epidermal lamellar body
  supported_by:
  - reference_id: PMID:17596512
    supporting_text: All LEKTI fragments, except D1, showed specific and differential inhibition of human
      kallikreins 5, 7, and 14.
  - reference_id: PMID:17596512
    supporting_text: We demonstrated that pH variations govern this interaction, leading to the release of
      active KLK5 from the complex at acidic pH.
  - reference_id: PMID:16307658
    supporting_text: LEKTI domain 6 is a potent inhibitor of hK5 and hK7
  - reference_id: PMID:12667078
    supporting_text: rLEKTI inhibited the serine proteinases plasmin, subtilisin A, cathepsin G, human
      neutrophil elastase, and trypsin, but not chymotrypsin.
  - reference_id: PMID:15675955
    supporting_text: is secreted in the extracellular spaces of the superficial stratum granulosum
  - reference_id: file:human/SPINK5/SPINK5-bioinformatics/RESULTS.md
    supporting_text: Its 12 leaves are the therian SPINK5 orthologs only
  knowledge_gaps:
  - gap_statement: Which of the 15 LEKTI domains inhibit which kallikreins in vivo is not settled. Domain
      1 has no inhibitory activity, and the physiological contributions of the different furin fragments
      and the three C-terminal isoforms have not been separated.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is the reported inhibition of caspase 14 (a cysteine protease) by LEKTI physiologically
    relevant, given that full-length LEKTI did not inhibit papain or cathepsins K, L or S?
- question: The serine-type endopeptidase inhibitor IBD is placed at the Theria node PTN000099251. Do
    non-mammalian vertebrate SPINK5-like proteins in PTHR10913 retain kallikrein-inhibitory activity, or
    is the narrow placement a lack of data rather than evidence of absence?
- question: Should a GO term for regulation of corneocyte desquamation exist? LEKTI controls the timing
    of corneodesmosome cleavage by KLK5 and KLK7 without performing the cleavage itself.
suggested_experiments:
- description: Express individual LEKTI furin fragments (D5, D6, D8-D11, D9-D15) in Spink5-null mouse
    epidermis or human Netherton keratinocyte organotypic cultures and measure KLK5, KLK7 and KLK14
    activity, desmoglein 1 integrity and barrier function, to assign in vivo targets to each fragment.
  experiment_type: rescue with domain fragments
