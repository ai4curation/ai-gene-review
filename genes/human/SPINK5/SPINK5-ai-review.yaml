    supporting_text: An inhibitory effect of HF7665 on trypsin activity is demonstrated.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original isolation and cloning of LEKTI; abstract-only cache.
- id: PMID:12915442
  title: LEKTI proteolytic processing in human primary keratinocytes, tissue distribution
    and defective expression in Netherton syndrome.
  findings:
  - statement: LEKTI is expressed in granular and upper spinous epidermis and processed by furin after
      leaving the ER.
    supporting_text: rapidly processed in a post-endoplasmic reticulum compartment
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
