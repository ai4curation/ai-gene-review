- id: PMID:15675955
  title: LEKTI is localized in lamellar granules, separated from KLK5 and KLK7, and
    is secreted in the extracellular spaces of the superficial stratum granulosum.
  findings:
  - statement: LEKTI is carried in lamellar granules separately from KLK5 and KLK7 and secreted earlier.
    supporting_text: the LG system transports and secretes LEKTI earlier than KLK7 and KLK5
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:15680911
  title: Consequences of C-terminal domains and N-terminal signal peptide deletions
    on LEKTI secretion, stability, and subcellular distribution.
  findings:
  - statement: Signal peptide required for ER import and secretion; LD-1-6 inhibits trypsin.
    supporting_text: Recombinant LD-1-6 specifically inhibited the trypsin activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
