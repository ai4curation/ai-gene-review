  review:
    summary: Ensembl Compara transfer from mouse Spink5 (Q148R4), whose annotation rests on increased
      epidermal antimicrobial activity in Spink5-deficient mice, attributed to unchecked kallikrein
      processing of cathelicidin.
    action: KEEP_AS_NON_CORE
    reason: The mouse ortholog lies inside the same therian PAINT clade as human SPINK5 (PTN000099251),
      so the orthology transfer is sound. The regulatory link is mechanistic rather than a distant
      phenotype; LEKTI inhibits KLK5 and KLK7, and these proteases activate the cathelicidin precursor.
      It is a downstream consequence of the core kallikrein-inhibitor activity, so it is kept as non-core.
