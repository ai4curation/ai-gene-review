- id: PMID:17596512
  title: LEKTI fragments specifically inhibit KLK5, KLK7, and KLK14 and control desquamation
    through a pH-dependent interaction.
  findings:
  - statement: Furin-generated LEKTI fragments inhibit KLK5, KLK7 and KLK14; binding to KLK5 is tight and
      released at acidic pH.
    supporting_text: We demonstrated that pH variations govern this interaction, leading to the release of
      active KLK5 from the complex at acidic pH.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Key paper defining physiological targets; full text cached.
- id: PMID:12667078
  title: 'Inhibition of serine proteinases plasmin, trypsin, subtilisin A, cathepsin G, and elastase
    by LEKTI: a kinetic analysis.'
  findings:
  - statement: Recombinant full-length LEKTI inhibits several serine proteinases but not chymotrypsin or
      cysteine proteinases.
    supporting_text: rLEKTI did not inhibit the cysteine proteinase papain or cathepsin K, L, or S.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:16307658
  title: hK5 and hK7, two serine proteinases abundant in human skin, are inhibited by LEKTI domain
    6.
  findings:
  - statement: LEKTI domain 6 inhibits KLK5 and KLK7.
    supporting_text: LEKTI domain 6 is a potent inhibitor of hK5 and hK7, whereas LEKTI domain 15 exhibits
      inhibitory activity on plasmin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:20533828
  title: 'New role for LEKTI in skin barrier formation: label-free quantitative proteomic identification
    of caspase 14 as a novel target for the protease inhibitor LEKTI.'
  findings:
  - statement: Full-length LEKTI and recombinant fragments inhibit caspase 14 in vitro.
    supporting_text: we demonstrate that caspase 14 is inhibited by full-length LEKTI and 5 recombinant
      fragments of LEKTI to varied extents
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Single in vitro study of cysteine-protease inhibition, not independently replicated in
      the literature reviewed here. It conflicts in part with the absence of papain and cathepsin
      inhibition reported in PMID:12667078. Not used to support a GO term.
- id: PMID:10835624
  title: Mutations in SPINK5, encoding a serine protease inhibitor, cause Netherton syndrome.
  findings:
  - statement: SPINK5 loss-of-function mutations cause Netherton syndrome.
    supporting_text: These results disclose a critical role of SPINK5 in epidermal barrier function and
      immunity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:16374478
  title: SPINK5, the defective gene in netherton syndrome, encodes multiple LEKTI isoforms derived from
    alternative pre-mRNA processing.
  findings:
  - statement: Three LEKTI isoforms differ in their C-terminal domains and are translated in keratinocytes.
    supporting_text: SPINK5 generates three classes of transcripts encoding three different LEKTI isoforms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:12684009
  title: 'Homologous proteins with different folds: the three-dimensional structures of domains 1 and
    6 of the multiple Kazal-type inhibitor LEKTI.'
  findings:
  - statement: Domain 6 adopts a Kazal-like inhibitor fold; domain 1 does not and inhibits no protease
      tested.
    supporting_text: No proteinase has been found to be inhibited by domain 1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:15619623
  title: Spink5-deficient mice mimic Netherton syndrome through degradation of desmoglein 1 by epidermal
    protease hyperactivity.
  findings:
  - statement: Spink5-null mice show desmoglein 1 degradation from kallikrein-like hyperactivity and loss
      of skin barrier.
    supporting_text: LEKTI deficiency causes abnormal desmosome cleavage in the upper granular layer through
      degradation of desmoglein 1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:15590704
  title: Lethal, neonatal ichthyosis with increased proteolytic processing of filaggrin in a mouse model
    of Netherton syndrome.
  findings:
  - statement: Spink5 R820X mice have lethal barrier failure and increased profilaggrin processing.
    supporting_text: revealed a substantial increase in the proteolytic processing of profilaggrin into
      its constituent filaggrin monomers
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:19414552
  title: Kallikrein 5 induces atopic dermatitis-like lesions through PAR2-mediated thymic stromal lymphopoietin
    expression in Netherton syndrome.
  findings:
  - statement: In LEKTI deficiency, free KLK5 activates PAR2 and drives TSLP-mediated inflammation.
    supporting_text: unregulated kallikrein (KLK) 5 directly activates proteinase-activated receptor 2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:17012259
  title: Kallikrein-mediated proteolysis regulates the antimicrobial effects of cathelicidins in skin.
  findings:
  - statement: Spink5-deficient mouse epidermis has increased cathelicidin-dependent antimicrobial
      activity.
    supporting_text: Epidermal extracts of these animals show a significant increase in antimicrobial
      activity compared with controls
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source of the mouse IMP annotations transferred to human by Ensembl Compara.
- id: PMID:16601670
  title: Serine protease activity and residual LEKTI expression determine phenotype in Netherton syndrome.
  findings:
  - statement: In Netherton patients, residual LEKTI inversely correlates with serine protease activity
      and disease severity.
    supporting_text: The magnitude of SP activation correlated with both the barrier defect and clinical
      severity, and inversely with residual LEKTI expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
