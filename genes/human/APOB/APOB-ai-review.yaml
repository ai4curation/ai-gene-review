- id: file:human/APOB/APOB-notes.md
  title: APOB research notes
  findings: []
core_functions:
- description: ApoB is the persistent lipid-binding structural scaffold of apoB-containing lipoproteins,
    directly contributing to particle assembly and transport. ApoB48 serves intestinal chylomicrons; apoB100
    serves hepatic VLDL, IDL and LDL. This carrier role spans chylomicrons and their remnants, VLDL, IDL
    and LDL; VLDL is the representative complex recorded below.
  molecular_function:
    id: GO:0005319
    label: lipid carrier activity
  locations:
  - &id001
    id: GO:0005576
    label: extracellular region
  - id: GO:0005788
    label: endoplasmic reticulum lumen
  - id: GO:0005790
    label: smooth endoplasmic reticulum
  in_complex:
    id: GO:0034361
    label: very-low-density lipoprotein particle
  directly_involved_in:
  - id: GO:0006869
    label: lipid transport
  - id: GO:0030301
    label: cholesterol transport
  - id: GO:0034379
    label: very-low-density lipoprotein particle assembly
  - id: GO:0042953
    label: lipoprotein transport
  supported_by:
  - reference_id: PMID:4363408
    supporting_text: 'Purified lymph and plasma chylomicrons and

      plasma very low density lipoproteins (VLDL) produced displacement curves in the

      assay system which paralleled those produced by pure LDL.'
    full_text_unavailable: true
  - reference_id: PMID:1917954
    supporting_text: "IDL is a lipoprotein that \ncontains both apoB-100 and apoE."
    full_text_unavailable: true
  - reference_id: PMID:27138255
    supporting_text: 'TANGO1 binds TALI, and both interact

      with apolipoprotein B (ApoB) and are necessary for the recruitment of

      ApoB-containing lipid particles to ER exit sites for their subsequent export.'
    full_text_unavailable: false
  - reference_id: PMID:39662503
    supporting_text: 'an approximately 61-nm-long continuous

      amphipathic β-sheet that wraps around the LDL particle like a belt.'
    full_text_unavailable: false
  - reference_id: PMID:26224785
    full_text_unavailable: false
- description: ApoB100 presents recognition surfaces for LDL receptors, coupling lipid-particle carriage
    to receptor-mediated clearance. The intestinal apoB48 product lacks the canonical apoB100 LDLR-binding
    region; remnant uptake can instead use apoE.
  molecular_function:
    id: GO:0050750
    label: low-density lipoprotein particle receptor binding
  locations:
  - *id001
