id: P04114
gene_symbol: APOB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Apolipoprotein B is the persistent lipid-binding scaffold of triglyceride- and cholesterol-rich
  lipoproteins. Hepatic apoB100 forms the structural framework of VLDL and remains on IDL and LDL as the
  particles are remodelled in circulation. Intestinal RNA editing produces the shorter apoB48 product,
  which supports chylomicron assembly and persists in chylomicron remnants. Nascent apoB acquires lipid
  in the endoplasmic reticulum with assistance from microsomal triglyceride transfer protein and is exported
  as lipoprotein cargo. ApoB100 also presents LDL-receptor recognition surfaces that couple lipid carriage
  to particle clearance. ApoB48 lacks the canonical apoB100 LDLR-binding region; apoE can instead mediate
  remnant recognition. Intracellular quality-control pools coexist with the principal extracellular carrier
  role.
