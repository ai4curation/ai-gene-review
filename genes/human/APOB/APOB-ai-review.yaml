      here are preliminary modelling.
- id: PMID:39663455
  title: Structure of apolipoprotein B100 bound to the low-density lipoprotein receptor.
  findings:
  - statement: The reported receptor-complex structure identifies apoB100–LDLR binding interfaces; exact
      primary Methods remain unread.
    supporting_text: 'One binding interface is formed between several

      small-ligand-binding modules of LDLR and a series of basic patches that are

      scattered along a β-belt formed by apoB100, encircling LDL.'
  full_text_unavailable: true
  reference_review:
