    reason: The InterPro carrier mapping agrees with apoB lipid-associated amphipathic domains and the
      actual human LDL structural study 39662503. ApoB provides the persistent lipid-binding scaffold
      of circulating particles, fitting lipid carrier activity. This does not equate bulk particle carriage
      with the narrower aqueous cholesterol-transfer reaction.
