- term:
    id: GO:0030521
    label: androgen receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000361706
  - UniProtKB:O75556
  review:
    summary: Phylogenetic propagation across the mammaglobin/prostatein clade of an
      "androgen receptor signaling pathway" involvement that, for these secretoglobins,
      reflects being androgen-regulated target genes rather than signaling components.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mammaglobin/prostatein secretoglobins (including rat prostatein, an
      androgen-induced secretory protein) are transcriptional targets under androgen
      control, not transducers of androgen receptor signaling. GO:0030521 is a nuclear-receptor
      signal-transduction pathway "ending with regulation of a downstream cellular
      process, e.g. transcription"; a secreted protein whose gene is an output of
      that regulation does not perform any step of the pathway. The phylogenetic involved_in
      annotation therefore over-annotates the androgen relationship (it is regulation
      of, not participation in). Kept rather than removed because androgen responsiveness
      is genuinely characteristic of the clade.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000361706
        source_label: PTN000361706
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The mammaglobin/prostatein clade node is correctly androgen-associated
          (prostatein and mammaglobins are androgen-regulated secretory proteins),
          but the IBD term "androgen receptor signaling pathway" conflates being an
          androgen-regulated target gene with participating in signal transduction.
          Clade membership is sound; the term is mis-scoped for secreted output proteins.
      - source_id: UniProtKB:O75556
        source_label: O75556
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Target appears in its own WITH/FROM, reflecting the experimental
          androgen-regulation datum (PMID:16020486) that helped seed the node; that
          datum shows transcriptional regulation of SCGB2A1, not participation in
          AR signal transduction.
      residue_claims_not_applicable: This is a process-scoping/role-conflation issue
        (regulated-by vs involved-in), not a point-residue capability question, so
        no residue-level claim applies.
    supported_by:
    - reference_id: PMID:16020486
      supporting_text: SCGB 2A1 is under androgen control in the androgen-responsive
        prostatic cell line LNCaP and can be induced more than 20-fold by dihydrotestosterone
- term:
    id: GO:0030521
    label: androgen receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:16020486
  qualifier: involved_in
  review:
    summary: The IDA reflects that SCGB2A1 transcription is directly induced by androgen
      (DHT) via an Sp-family site in its promoter in LNCaP cells, i.e. SCGB2A1 is
      a downstream androgen-responsive target gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: Xiao et al. demonstrated androgen (DHT) induction of SCGB2A1 expression
      through its promoter, establishing SCGB2A1 as a transcriptional target of androgen/AR
      signaling. Being an androgen-regulated output gene is not the same as the secreted
      protein being involved_in the androgen receptor signaling pathway (GO:0030521),
      which denotes the nuclear-receptor signal-transduction cascade itself. The annotation
      over-states the relationship (regulated by, not participating in). No clean "response
      to androgen" GO term exists for a MODIFY replacement (GO:0071393 is progesterone;
      GO:0071394 is testosterone-specific whereas the inducer is DHT), so the row is
      marked as over-annotated rather than re-pointed.
    supported_by:
    - reference_id: PMID:16020486
      supporting_text: can be induced more than 20-fold by dihydrotestosterone
    - reference_id: file:human/SCGB2A1/SCGB2A1-deep-research-openscientist.md
      supporting_text: the androgen receptor is recruited but does not bind DNA directly
