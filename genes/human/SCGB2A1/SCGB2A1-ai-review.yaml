- id: PMID:9720917
  title: Lipophilin, a novel heterodimeric protein of human tears.
  findings:
  - statement: SCGB2A1 (lipophilin C / mammaglobin B) is secreted into human tears,
      where it forms a head-to-head heterodimer with lipophilin A (SCGB1D1); the family
      is typically steroid-regulated and steroid-binding.
    supporting_text: We identified a novel heterodimeric protein, lipophilin AC, in
      human tears
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary study. Establishes the secreted tear localization
      and the lipophilin AC heterodimer with SCGB1D1 (the basis for the heterodimerization-activity
      MODIFY). O95968 = SCGB1D1 (lipophilin A).
- id: PMID:16020486
  title: Secretoglobin 2A1 is under selective androgen control mediated by a peculiar
    binding site for Sp family transcription factors.
  findings:
  - statement: SCGB2A1 is an androgen-responsive target gene, induced >20-fold by
      DHT in LNCaP prostate cells via an Sp-family promoter site; it is a downstream
      output of androgen signaling rather than a signaling component.
    supporting_text: SCGB 2A1 is under androgen control in the androgen-responsive
      prostatic cell line LNCaP and can be induced more than 20-fold by dihydrotestosterone
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary study. Documents transcriptional androgen
      regulation of SCGB2A1 (target gene), which is why the "androgen receptor signaling
      pathway" involved_in annotation is judged an over-annotation.
- id: PMID:16395610
  title: Immunohistochemical analysis of secretoglobin SCGB 2A1 expression in human
    ocular glands and tissues.
  findings:
  - statement: SCGB2A1 is expressed in all ocular glands and eyelid/conjunctival epithelium
      and secreted into the tear film; expression tracks androgen-receptor-positive
      tissues and the protein most likely binds hydrophobic ligands.
    supporting_text: expression of SCGB 2A1 in all ocular glands
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; immunohistochemical localization supporting the
      secreted/extracellular annotation and the androgen-association context.
