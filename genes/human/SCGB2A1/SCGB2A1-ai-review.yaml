description: SCGB2A1 (Secretoglobin family 2A member 1), also known as mammaglobin-B,
  lipophilin C, lacryglobin or mammaglobin-2, is a small (~10 kDa) secreted glycoprotein
  of the secretoglobin superfamily, lipophilin subfamily, and a paralog of mammaglobin-A
  (SCGB2A2). It is secreted into tears and other exocrine fluids and is expressed
  in ocular glands and in steroid-responsive tissues such as prostate, breast, uterus,
  ovary and testis. SCGB2A1 associates head-to-head with lipophilin A (secretoglobin
  1D1) to form the heterodimeric "lipophilin AC" complex, and, like other members
  of the uteroglobin/prostatein family, is thought to bind small hydrophobic ligands
  such as steroids. Its expression is under androgen control. Its precise physiological
  function remains uncertain.
