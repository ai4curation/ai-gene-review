suggested_questions:
- question: What is the physiological ligand of the SCGB2A1-SCGB1D1 (lipophilin AC)
    heterodimer, and does the complex bind and transport steroids/androgens in tears
    or prostatic fluid?
- question: Does SCGB2A1 have a function in the tear film (e.g. lipid-layer stability
    or antimicrobial activity) beyond being an androgen-regulated secretory marker?
suggested_experiments:
- description: Reconstitute the recombinant SCGB2A1-SCGB1D1 heterodimer and test binding
    to a panel of steroids (androgens, estramustine) and phospholipids by ligand-binding/ITC
    assays.
- description: Measure SCGB2A1-SCGB1D1 complex abundance in tears across sex and androgen
    status to test whether androgen regulation translates into protein-level changes
    in the tear film.
