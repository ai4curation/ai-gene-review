- id: file:human/VPS26A/VPS26A-uniprot.txt
  title: UniProtKB record for human VPS26A
  findings:
  - statement: VPS26A is an essential component of the retromer cargo-selective complex
      required for endosome-to-TGN retrieval and SNX27-dependent endocytic recycling.
    supporting_text: Acts as a component of the retromer cargo-selective complex (CSC).
      The CSC is believed to be the core functional component of retromer or respective
      retromer complex variants acting to prevent missorting of selected transmembrane
      cargo proteins into the lysosomal degradation pathway.
    record_section: *id016
core_functions:
- description: Arrestin-fold cargo-recognition subunit of the heterotrimeric retromer
    cargo-selective complex (VPS35-VPS26A-VPS29) that forms the binding site for canonical
    omega-Phi-[L/M] sorting motifs with VPS35 and SNX3 for endosome-to-Golgi retrieval,
    and binds the SNX27 PDZ domain to drive endosome-to-plasma-membrane recycling.
