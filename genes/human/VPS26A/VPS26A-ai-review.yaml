- id: PMID:11102511
  title: 'Human orthologs of yeast vacuolar protein sorting proteins Vps26, 29, and
    35: assembly into multimeric complexes.'
  findings:
  - statement: Human VPS35, VPS29, and VPS26 assemble into a cytosolic and membrane-associated
      multimeric retromer complex.
    supporting_text: 'We report the cloning and characterization of human orthologs
      of three additional components of the complex: Vps26p, Vps29p, and Vps35p. ...
      Furthermore, hVps35, hVps29, and hVps26 have been found in membrane-associated
      and cytosolic compartments.'
- id: PMID:15078903
  title: Role of the mammalian retromer in sorting of the cation-independent mannose
    6-phosphate receptor.
  findings:
  - statement: Human VPS26, VPS29, and VPS35 localize to tubular domains of early
      endosomes where CI-MPR is concentrated prior to transport to the TGN.
    supporting_text: In particular, retromer is associated with tubular-vesicular
      profiles that emanate from early endosomes or from intermediates in the maturation
      from early to late endosomes.
  - statement: RNAi depletion of retromer subunits causes missorting and lysosomal
      turnover of CI-MPR.
    supporting_text: Depletion of retromer by RNA interference increases the lysosomal
      turnover of the CI-MPR, decreases cellular levels of lysosomal hydrolases, and
      causes swelling of lysosomes.
- id: PMID:16190980
  title: A novel mammalian retromer component, Vps26B.
  findings:
  - statement: Mammalian retromer consists of VPS26A or VPS26B together with VPS29
      and VPS35 on endosomal membranes.
    supporting_text: The mammalian retromer protein complex, which consists of three
      proteins--Vps26, Vps29, and Vps35--in association with members of the sorting
      nexin family of proteins, has been implicated in the trafficking of receptors
      and their ligands within the endosomal/lysosomal system of mammalian cells.
- id: PMID:16732284
  title: The retromer subunit Vps26 has an arrestin fold and binds Vps35 through its
    C-terminal domain.
  findings:
  - statement: VPS26 adopts an arrestin-like two-lobed beta-sandwich fold and binds
      the N-terminus of VPS35.
    supporting_text: The structure of human Vps26A at 2.1-A resolution reveals two
      curved beta-sandwich domains connected by a polar core and a flexible linker.
      Vps26 has an unpredicted structural relationship to arrestins. The Vps35-binding
      site on Vps26 maps to a mobile loop spanning residues 235-246, near the tip
      of the C-terminal domain.
- id: PMID:17891154
  title: Functional architecture of the retromer cargo-recognition complex.
  findings:
  - statement: The C-terminal alpha-helical solenoid of VPS35 wraps around the metallophosphoesterase
      fold of VPS29 to form the rigid scaffold of the retromer cargo-recognition complex.
    supporting_text: Here we report the crystal structure of a VPS29-VPS35 subcomplex
      showing how the metallophosphoesterase-fold subunit VPS29 (refs 14, 15) acts
      as a scaffold for the carboxy-terminal half of VPS35. VPS35 forms a horseshoe-shaped,
      right-handed, alpha-helical solenoid, the concave face of which completely covers
      the metal-binding site of VPS29, whereas the convex face exposes a series of
      hydrophobic interhelical grooves.
- id: PMID:18193037
  title: Wingless secretion requires endosome-to-Golgi retrieval of Wntless/Evi/Sprinter
    by the retromer complex.
  findings:
  - statement: Loss of retromer causes lysosomal degradation of Wntless and impairs
      Wnt secretion.
    supporting_text: Following dissociation from Wingless, Wntless is internalized
      and returns to the Golgi apparatus in a retromer-dependent manner. Without the
      retromer-dependent recycling route, Wingless secretion is impaired and, as electron
      microscopy suggests, Wntless is diverted to a degradative compartment.
- id: PMID:19619496
  title: The retromer coat complex coordinates endosomal sorting and dynein-mediated
    transport, with carrier recognition by the trans-Golgi network.
  findings: []
- id: PMID:20682791
  title: A protein interaction network for Ecm29 links the 26 S proteasome to molecular
    motors and endosomal components.
  findings:
  - statement: VPS26A localizes to endosomal vesicles.
    supporting_text: Another membrane-associated component identified in similar analyses
      was Vps26A, which IF images show is present on a subset of Ecm29-positive vesicles
  - statement: VPS26A mediates retrograde transport from endosomes to the TGN.
    supporting_text: Vps26A is a component of the retromer complex that regulates
      retrograde protein transport from endosomes to the trans -Golgi network on specific
      clathrin-coated carriers linked to the adaptors AP1 and epsinR
- id: PMID:21602791
  title: SNX27 mediates retromer tubule entry and endosome-to-plasma membrane trafficking
    of signalling receptors.
  findings:
  - statement: SNX27 serves as an essential adaptor protein linking beta2-adrenergic
      receptors to Rab4-positive retromer tubules for endosome-to-plasma-membrane
      recycling.
    supporting_text: Here we show that sequence-directed sorting occurs at the level
      of entry into retromer tubules and that retromer tubules are associated with
      Rab4. Furthermore, we show that sorting nexin 27 (SNX27) serves as an essential
      adaptor protein linking β2ARs to the retromer tubule.
- id: PMID:21725319
  title: A SNX3-dependent retromer pathway mediates retrograde transport of the Wnt
    sorting receptor Wntless and is required for Wnt secretion.
  findings: []
- id: PMID:22431521
  title: The role of ceroid lipofuscinosis neuronal protein 5 (CLN5) in endosomal
    sorting.
  findings:
  - statement: Recruitment of the retromer complex to endosomal membranes prevents
      lysosomal degradation of sortilin and CI-MPR.
    supporting_text: We demonstrate that in CLN5-depleted HeLa cells, the lysosomal
      sorting receptors sortilin and cation-independent mannose 6-phosphate receptor
      (CI-MPR) are degraded in lysosomes due to a defect in recruitment of the retromer
      (an endosome-to-Golgi compartment trafficking component).
- id: PMID:23563491
  title: A global analysis of SNX27-retromer assembly and cargo specificity reveals
    a function in glucose and metal ion transport.
  findings:
  - statement: Direct interaction of the SNX27 PDZ domain with the retromer subunit
      VPS26 is necessary and sufficient to prevent lysosomal degradation and maintain
      surface recycling of SNX27 cargo.
    supporting_text: Furthermore, we establish that direct interaction of the SNX27
      PDZ domain with the retromer subunit VPS26 is necessary and sufficient to prevent
      lysosomal entry of SNX27 cargo.
- id: PMID:24152121
  title: The Vps35 D620N mutation linked to Parkinson's disease disrupts the cargo
    sorting function of retromer.
  findings: []
- id: PMID:24747528
  title: Pharmacological chaperones stabilize retromer to limit APP processing.
  findings: []
- id: PMID:24980502
  title: Retromer binding to FAM21 and the WASH complex is perturbed by the Parkinson
    disease-linked VPS35(D620N) mutation.
  findings: []
- id: PMID:25136126
  title: A unique PDZ domain and arrestin-like fold interaction reveals mechanistic
    details of endocytic recycling by SNX27-retromer.
  findings:
  - statement: An exposed beta-hairpin in the SNX27 PDZ domain binds a groove in the
      arrestin-like fold of VPS26A, increasing SNX27 affinity for PDZ-binding motifs
      by an order of magnitude.
    supporting_text: Crystal structures and NMR experiments reveal that an exposed
      β-hairpin in the SNX27 PDZ domain engages a groove in the arrestin-like structure
      of the vacuolar protein sorting 26A (VPS26A) retromer subunit. The structure
      establishes how the SNX27 PDZ domain simultaneously binds PDZ-binding motifs
      and retromer-associated VPS26. Importantly, VPS26A binding increases the affinity
      of the SNX27 PDZ domain for PDZ- binding motifs by an order of magnitude, revealing
      cooperativity in cargo selection.
- id: PMID:26172538
  title: Retromer Ensures the Degradation of Autophagic Cargo by Maintaining Lysosome
    Function in Drosophila.
  findings:
  - statement: Loss of retromer function causes accumulation of undigested cargo and
      autophagic structures in enlarged lysosomes.
    supporting_text: Here we show that the late stages of autophagy and endocytosis
      are impaired in Vps26 and Vps35 deficient Drosophila larval fat body cells,
      but formation of autophagosomes and endosomes is not compromised.
- id: PMID:26220253
  title: 'Retromer: Structure, function, and roles in mammalian disease.'
  findings:
  - statement: Retromer mediates retrograde transport of transmembrane cargo from
      endosomes to the Golgi.
    supporting_text: Retrograde transport from the endosome to the Golgi is mediated
      by a 5 protein complex known as the retromer.
