- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IDA
  original_reference_id: PMID:22431521
  qualifier: located_in
  review:
    summary: VPS26A is recruited to the cytoplasmic surface of the endosome membrane.
    action: ACCEPT
    reason: Structural and cell biological studies show that VPS26A directly contacts
      SNX3 and membrane-proximal cargo tails on the cytoplasmic leaflet of the endosome
      membrane (PMID:27889239, PMID:27385586, PMID:22431521).
    supported_by:
    - &id017
      reference_id: PMID:27889239
      supporting_text: Here, we present an X-ray crystallographic analysis of a four-component
        complex comprising the VPS26 and VPS35 subunits of retromer, the sorting nexin
        SNX3, and a recycling signal from the divalent cation transporter DMT1-II.
        This analysis identifies a binding site for canonical recycling signals at
        the interface between VPS26 and SNX3. In addition, the structure highlights
        a network of cooperative interactions among the VPS subunits, SNX3, and cargo
        that couple signal-recognition to membrane recruitment.
    - &id009
      reference_id: PMID:27385586
      supporting_text: Retromer is a heterotrimeric complex that associates with endosomal
        membranes and facilitates the retrograde sorting of multiple receptors, including
        the cation-independent mannose 6-phosphate receptor for lysosomal enzymes.
    - &id010
      reference_id: PMID:22431521
      supporting_text: We demonstrate that in CLN5-depleted HeLa cells, the lysosomal
        sorting receptors sortilin and cation-independent mannose 6-phosphate receptor
        (CI-MPR) are degraded in lysosomes due to a defect in recruitment of the retromer
        (an endosome-to-Golgi compartment trafficking component).
    - &id011
      reference_id: PMID:30072228
      supporting_text: Retromer, an ancient multi-protein complex, is essential for
        the retrieval and recycling of hundreds of transmembrane proteins.
