  evidence_type: EXP
  original_reference_id: PMID:15078903
  qualifier: located_in
  review:
    summary: Cytoplasm localization is true but too broad; refine to cytosol and endosome
      membrane.
    action: MODIFY
    reason: VPS26A cycles between a soluble cytosolic pool and the cytoplasmic face
      of endosomal membranes as part of the retromer complex; GO:0005737 (cytoplasm)
      is refined to GO:0005829 (cytosol) and GO:0010008 (endosome membrane).
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    - id: GO:0010008
      label: endosome membrane
    supported_by:
    - &id001
      reference_id: PMID:15078903
      supporting_text: In particular, retromer is associated with tubular-vesicular
        profiles that emanate from early endosomes or from intermediates in the maturation
        from early to late endosomes.
    - &id002
      reference_id: file:human/VPS26A/VPS26A-uniprot.txt
      supporting_text: Acts as a component of the retromer cargo-selective complex
        (CSC). The CSC is believed to be the core functional component of retromer
        or respective retromer complex variants acting to prevent missorting of selected
        transmembrane cargo proteins into the lysosomal degradation pathway.
      record_section: &id016
      - CC:FUNCTION
