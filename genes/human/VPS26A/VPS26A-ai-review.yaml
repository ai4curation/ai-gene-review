- id: PMID:27385586
  title: Parkinson Disease-linked Vps35 R524W Mutation Impairs the Endosomal Association
    of Retromer and Induces α-Synuclein Aggregation.
  findings:
  - statement: Retromer is a heterotrimeric complex that associates with endosomal
      membranes and facilitates retrograde receptor sorting, and the Parkinson disease-associated
      VPS35 R524W variant impairs endosomal retromer association and induces alpha-synuclein
      aggregation.
    supporting_text: Retromer is a heterotrimeric complex that associates with endosomal
      membranes and facilitates the retrograde sorting of multiple receptors, including
      the cation-independent mannose 6-phosphate receptor for lysosomal enzymes.
- id: PMID:27889239
  title: Structural Mechanism for Cargo Recognition by the Retromer Complex.
  findings:
  - statement: X-ray crystal structure of the VPS26-VPS35-SNX3-DMT1-II complex identifies
      the canonical recycling signal binding site at the interface between VPS26 and
      SNX3.
    supporting_text: Here, we present an X-ray crystallographic analysis of a four-component
      complex comprising the VPS26 and VPS35 subunits of retromer, the sorting nexin
      SNX3, and a recycling signal from the divalent cation transporter DMT1-II. This
      analysis identifies a binding site for canonical recycling signals at the interface
      between VPS26 and SNX3. In addition, the structure highlights a network of cooperative
      interactions among the VPS subunits, SNX3, and cargo that couple signal-recognition
      to membrane recruitment.
