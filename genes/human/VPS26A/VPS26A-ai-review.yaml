  findings:
  - statement: VPS29 is shared between the retromer complex (VPS35-VPS26-VPS29) and
      the retriever complex (VPS35L-VPS26C-VPS29).
    supporting_text: We have called this complex 'retriever'; it is a heterotrimer
      composed of DSCR3, C16orf62 and VPS29, and bears striking similarity to retromer.
