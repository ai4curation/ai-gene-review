id: O75436
gene_symbol: VPS26A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Vacuolar protein sorting-associated protein 26A (VPS26A) is the arrestin-fold
  subunit of the heterotrimeric retromer cargo-selective complex (VPS35-VPS26-VPS29)
  on early and tubular endosomal membranes. Its C-terminal lobe binds the N-terminal
  alpha-helical solenoid of VPS35, while its interface with VPS35 and SNX3 directly
  recognizes canonical omega-Phi-[L/M] sorting motifs in retrograde cargoes such as
  CI-MPR (IGF2R), sortilin, Wntless, and DMT1-II for endosome-to-Golgi retrieval,
  and its beta-sandwich surface binds the PDZ domain of SNX27 to drive endosome-to-plasma
  membrane recycling of transmembrane receptors.
