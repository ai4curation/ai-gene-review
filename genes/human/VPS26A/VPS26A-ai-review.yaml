- term:
    id: GO:0005769
    label: early endosome
  evidence_type: EXP
  original_reference_id: PMID:16190980
  qualifier: located_in
  review:
    summary: VPS26A localizes to early endosomes where retromer sorts transmembrane
      cargoes.
    action: ACCEPT
    reason: Multiple independent studies demonstrate that VPS26A localizes to early
      endosomes, particularly their tubular sorting domains, to retrieve CI-MPR and
      other receptors.
    supported_by:
    - *id001
    - &id004
      reference_id: PMID:16190980
      supporting_text: The mammalian retromer protein complex, which consists of three
        proteins--Vps26, Vps29, and Vps35--in association with members of the sorting
        nexin family of proteins, has been implicated in the trafficking of receptors
        and their ligands within the endosomal/lysosomal system of mammalian cells.
    - &id005
      reference_id: PMID:16732284
      supporting_text: The structure of human Vps26A at 2.1-A resolution reveals two
        curved beta-sandwich domains connected by a polar core and a flexible linker.
        Vps26 has an unpredicted structural relationship to arrestins. The Vps35-binding
        site on Vps26 maps to a mobile loop spanning residues 235-246, near the tip
        of the C-terminal domain.
    - *id003
