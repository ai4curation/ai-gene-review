- id: PMID:19897484
  title: B-cell CLL/lymphoma 10 (BCL10) is required for NF-kappaB production by both canonical and noncanonical
    pathways and for NF-kappaB-inducing kinase (NIK) phosphorylation.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact normal PMID/DOI/PMC identity verified. The complete cached HTML-derived abstract,
      Introduction, Experimental Procedures, Results and Discussion were read; figures and supplements
      were not visually inspected. BCL10 silencing reduced carrageenan-induced p52/RelB responses in human
      NCM460 cells and mouse fibroblasts, and reduced NIK phosphorylation. This establishes a stimulus-dependent
      upstream signaling role, not direct BCL10 kinase chemistry.
core_functions:
- description: Organizes CARD-BCL10-MALT1 signaling assemblies that couple receptor stimulation to NF-kappaB
    activation. CARD-mediated BCL10 polymerization links upstream CARD proteins to MALT1 and downstream
    ubiquitin-dependent effector recruitment; BCL10 provides the assembling platform while MALT1, ubiquitin
    enzymes and kinases perform their respective catalytic steps.
