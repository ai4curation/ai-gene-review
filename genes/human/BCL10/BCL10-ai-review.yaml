- id: PMID:19897484
  title: B-cell CLL/lymphoma 10 (BCL10) is required for NF-kappaB production by both canonical and noncanonical
    pathways and for NF-kappaB-inducing kinase (NIK) phosphorylation.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact normal PMID/DOI/PMC identity verified. The complete cached HTML-derived abstract, Introduction,
      Experimental Procedures, Results and Discussion were read; figures and supplements were not visually inspected.
      BCL10 silencing reduced carrageenan-induced p52/RelB responses in human NCM460 cells and mouse fibroblasts,
      and reduced NIK phosphorylation. This establishes a stimulus-dependent upstream signaling role, not direct
      BCL10 kinase chemistry.
- id: PMID:19810754
  title: Structural basis for the lack of E2 interaction in the RING domain of TRAF2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete abstract and selected primary paragraphs 49, 50, 53 and 55 describe lack of E2 interaction
      and activity under tested conditions while leaving possible activation mechanisms open. These negative results
      provide historical biochemical context; they do not require concurrent catalytic activity for a TRAF2-binding
      annotation. Normal PMID/title and official primary record checked. No full-paper, original-image or complete
      supplement audit. This source is retained as negative/contextual evidence in additional_reference_ids rather
      than positive support for the ligase-binding replacement. Its tested negative result is not marked overturned
      by a different cofactor/substrate condition.
- id: PMID:20577214
  title: Sphingosine-1-phosphate is a missing cofactor for the E3 ubiquitin ligase TRAF2.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Complete abstract and selected primary Results paragraphs 14–16 describe S1P-dependent recombinant
      TRAF2 activity and tests excluding co-purified cIAPs from that preparation. This supports the E3 partner class,
      without claiming the original BCL10 binding assays measured catalysis or S1P dependence. Normal PMID/title
      and official primary record checked. No full-paper, original-image or complete supplement audit. The disputed
      classification concerns generalization of the cellular SPHK1 requirement: later mouse knockout experiments
      found preserved TNF signaling in Sphk1-deficient fibroblasts and keratinocytes despite dependence on Traf2
      (https://pmc.ncbi.nlm.nih.gov/articles/PMC4769158/; abstract and selected Results read online). This cellular
      comparison does not itself retest or overturn the purified S1P-dependent TRAF2 assay. The biochemical finding
      remains conditional evidence for the partner class, alongside the separate MLST8 substrate study. The later
      primary paper is linked as external context only; its normal cache was absent and no formal reference or superseding
      finding is added.'
- id: PMID:28489822
  title: TRAF2 and OTUD7B govern a ubiquitin-dependent switch that regulates mTORC2 signalling.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier/title/DOI verified against PubMed. Complete abstract and selected primary Results paragraphs
      12–17 describe TRAF2-dependent K63 ubiquitination of MLST8 in a separate substrate context. This corroborates
      the TRAF2 E3 partner class, not a BCL10 mechanism. No original-image, full-paper or complete supplement audit.
core_functions:
- description: Organizes CARD-BCL10-MALT1 signaling assemblies that couple receptor stimulation to NF-kappaB activation.
    CARD-mediated BCL10 polymerization links upstream CARD proteins to MALT1 and downstream ubiquitin-dependent
    effector recruitment; BCL10 provides the assembling platform while MALT1, ubiquitin enzymes and kinases perform
    their respective catalytic steps.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0045121
    label: membrane raft
  in_complex:
    id: GO:0032449
    label: CBM complex
  supported_by:
  - reference_id: PMID:24074955
    supporting_text: formation of Bcl10 filaments is crucial for MALT1 activation.
  - reference_id: PMID:15125833
    supporting_text: "only these oligomeric forms of BCL10 and \nMALT1 can activate IKK in vitro."
  - reference_id: PMID:17287217
suggested_questions:
- question: Which BCL10-containing molecular assembly underlies the reported nuclear transcriptional activity, and
    how does it differ from cytoplasmic CBM signaling?
- question: Can the source experiments or curators resolve the NF-kappaB protein-binding, microtubule-location,
    mechanical-stimulus and inflammasome-versus-apoptosis annotations identified here?
- question: Which human cell types require BCL10 for the noncanonical NIK/p100/p52 pathway, independently of its
    effects on canonical NF-kappaB and p100 abundance?
suggested_experiments:
- description: Compare wild-type and assembly-interface BCL10 mutants at matched near-endogenous abundance in lymphocytes
    and fibroblasts, measuring CBM assembly, MALT1 activity, NEMO recruitment and separate canonical versus noncanonical
    NF-kappaB readouts.
