  review:
    summary: Refine the curated TRAF2 interaction to ubiquitin protein ligase binding.
    action: MODIFY
    reason: The source is the HuRI binary interaction map. Its exact supplementary pair and an endogenous complex
      were not independently verified. The IPI partner Q12933 is TRAF2. Its E3 ligase classification is supported
      by cofactor-dependent biochemical activity in PMID:20577214 and a separate substrate context in PMID:28489822.
      GO:0031625 identifies this binding partner class; catalytic activity need not be measured in the BCL10 interaction
      assay. Earlier negative biochemical results in PMID:19810754 concern tested conditions and do not invalidate
      the partner-class refinement. This assigns neither ubiquitin-ligase activity nor activation of TRAF2 to BCL10.
      The existing cIAP2 binding row represents a separate partner and provenance.
