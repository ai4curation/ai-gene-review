  review:
    summary: Leave NEMO association with ubiquitinated BCL10 unresolved.
    action: UNDECIDED
    reason: Selected GST-NEMO pull-down and endogenous coimmunoprecipitation Results in stimulated Jurkat cells
      detect ubiquitinated BCL10, while unmodified BCL10 and ubiquitin-binding-defective NEMO(L329P) do not support
      that association. NEMO reads the attached ubiquitin chains; BCL10 is the modified recruitment platform, not
      the ubiquitin-binding reader. The source IPI supports a modification-dependent protein association but does
      not establish a direct interface between the unmodified BCL10 polypeptide and NEMO or a new BCL10 ubiquitin-binding
      activity, so leave the broad GO:0005515 assertion undecided.
