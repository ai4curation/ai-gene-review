id: O95999
gene_symbol: BCL10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCL10 is a noncatalytic immune signaling adaptor with an N-terminal caspase recruitment domain.
  Activated CARD-containing proteins, including CARD9, CARD11 and CARD14, nucleate BCL10 assemblies that
  recruit and organize MALT1 and downstream signaling machinery. These cytoplasmic and membrane-associated
  CARD-BCL10-MALT1 complexes promote canonical NF-kappaB activation through regulated ubiquitin and kinase
  signaling. BCL10 self-association also provides a platform for MALT1 activation. The adaptor supports
  antigen-receptor responses in lymphocytes and selected innate responses, with dependence varying by
  receptor and cell type. Biallelic loss of BCL10 causes combined immunodeficiency, whereas dysregulated
  expression or activating signaling assemblies can contribute to lymphoma. Nuclear localization, transcriptional
  coactivation and effects on apoptosis occur in particular experimental or pathological contexts.
