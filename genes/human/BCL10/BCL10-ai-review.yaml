suggested_questions:
- question: Which BCL10-containing molecular assembly underlies the reported nuclear transcriptional activity,
    and how does it differ from cytoplasmic CBM signaling?
- question: Can the source experiments or curators resolve the NF-kappaB protein-binding, microtubule-location,
    mechanical-stimulus and inflammasome-versus-apoptosis annotations identified here?
- question: Which human cell types require BCL10 for the noncanonical NIK/p100/p52 pathway, independently
    of its effects on canonical NF-kappaB and p100 abundance?
suggested_experiments:
- description: Compare wild-type and assembly-interface BCL10 mutants at matched near-endogenous abundance
    in lymphocytes and fibroblasts, measuring CBM assembly, MALT1 activity, NEMO recruitment and separate
    canonical versus noncanonical NF-kappaB readouts.
