    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        The UniProt ISS row independently asserts calcium-activated cation-channel
        activity enabled by PKD1L3. PKD1L3 is a channel-forming subunit of the
