    - reference_id: file:human/PKD1L3/PKD1L3-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: the Pkd1l3-Pkd2l1 heteromer, when expressed in cells
        does not respond to acid stimuli used to evoke proton currents in taste
        cells
