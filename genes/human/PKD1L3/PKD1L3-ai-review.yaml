id: Q7Z443
gene_symbol: PKD1L3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PKD1L3 encodes a PKD1-like membrane protein that coassembles with PKD2L1/TRPP3 in an acid-gated heteromeric
  cation channel. Mutagenesis of PKD1L3 changes ion selectivity of the PKD1L3/PKD2L1 channel, indicating that PKD1L3
  contributes directly to the pore rather than acting solely as a trafficking subunit.'
existing_annotations:
- term:
    id: GO:0001581
    label: detection of chemical stimulus involved in sensory perception of sour taste
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q2EG98
  review:
    summary: Mark detection of chemical stimulus involved in sensory perception of sour taste as too strong
      for PKD1L3.
    action: MARK_AS_OVER_ANNOTATED
    reason: Direct channel evidence supports acid-gated PKD1L3/PKD2L1 activity in heterologous cells, but
      mouse genetics no longer support a positive in-vivo sour-receptor process annotation for PKD1L3.
    supported_by:
    - reference_id: file:human/PKD1L3/PKD1L3-notes.md
      supporting_text: The same study found normal chorda tympani responses in Pkd1l3 knockout mice and normal
        glossopharyngeal responses in single and double knockouts, so positive sour-taste process and
        sour-taste receptor rows are over-annotations for PKD1L3.
