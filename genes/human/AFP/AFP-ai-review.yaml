- id: PMID:33009373
  title: AFP promotes HCC progression by suppressing the HuR-mediated Fas/FADD apoptotic pathway.
  findings:
  - statement: Alpha-fetoprotein and HuR were seen to colocalise in the cytoplasm of hepatoma cell lines,
      which is human evidence for an intracellular pool independent of the mouse orthologue transfer that
      GOA actually records.
    supporting_text: partial colocalization of AFP and HuR was observed in the cytoplasm of HuH7 and HepG2
      cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. Used here only for the localisation observation, which is the
      part that is directly imaged. The signalling model built on it concerns AFP-producing hepatoma cells
      rather than the fetal plasma protein, so it informs a non-core localisation call and nothing more.
- id: PMID:8607965
  title: Expression of serum albumin and of alphafetoprotein in murine normal and neoplastic primitive
    embryonic structures.
  findings:
  - statement: In this study alpha-fetoprotein protein was not detected by immunostaining in the embryos
      examined; the positive protein signal was serum albumin.
    supporting_text: antibodies to SA gave a positive reaction in embryos of 7 days, while AFP was not
