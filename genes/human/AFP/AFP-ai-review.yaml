  review:
    summary: 'Correct and core. Alpha-fetoprotein is a constitutively secreted plasma protein: it has
      a cleaved 18-residue signal peptide, no transmembrane segment, and it was originally purified and
      sequenced from human fetal cord serum, amniotic fluid and hepatoma ascites. This is the compartment
      in which every measured ligand-binding property was determined, and it is also what makes the cytosolic
      and nuclear partners reported in high-throughput screens topologically implausible.'
    action: ACCEPT
    reason: 'The evidence route is combinatorial rather than ARBA, drawing on four InterPro albumin-family
      signatures, the UniProt SubCell term SL-0243 and the mouse orthologue, and all of those converge
      on the same conclusion that direct measurement gives. The mature chain is defined as residues 19
      to 609 after a signal peptide confirmed by direct protein sequencing of plasma-derived protein,
      and the clinical assays that made this protein famous all measure it in serum or amniotic fluid.
      Unlike the cytoplasm row, this localisation does not depend on the mouse projection at all: dropping
      UniProtKB:P02772 from the evidence set would leave the call unchanged. Accepted as a core location.'
