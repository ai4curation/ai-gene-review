- term:
    id: GO:0005504
    label: fatty acid binding
  evidence_type: IDA
  original_reference_id: PMID:38678117
  qualifier: enables
  review:
    summary: Proposed. The cryo-EM structure of human alpha-fetoprotein resolves four fatty acids bound
      in subdomains IIA, IIA/IIB, IIIA and IIIB, and the bound species were identified chemically by GC-MS
      as palmitate, at 57.42 per cent of total fatty acid, and stearate. PDB entry 8X1N deposits palmitic
      acid as a ligand of the human protein. UniProt independently states that the protein binds fatty
      acids as well as serum albumin does. GOA carries no fatty acid term for AFP, and PAINT places GO:0005504
      at no node of PTHR11385 despite serum albumin holding it by two separate IDAs.
    action: NEW
    reason: This is the best-evidenced molecular function of the protein and the clearest gap in its GO
      record. Three things make it an IDA rather than an inference from the albumin fold. First, the lipid
      was not modelled from density shape alone, because gas chromatography-mass spectrometry on fatty
      acids extracted from the purified protein identified which species were present, so the chemical
      identity is measured rather than assumed. Second, the fatty acids were carried by the protein through
      purification rather than soaked in, so the sites are occupied under ordinary conditions. Third,
      the sites are located in named subdomains of this protein's own structure rather than transferred
      from an albumin structure, and the authors superpose AFP on the HSA-palmitate complex separately.
      The honest caveat is that the protein was recombinant, expressed in HEK293F cells rather than purified
      from fetal serum, so the fatty acids are those available in that medium; this bears on which fatty
      acid predominates, not on whether the protein binds fatty acids. GO:0005504 is a descendant of the
      GO:0036094 already annotated by IBA, so this refines an existing row rather than contradicting it.
    supported_by:
    - reference_id: PMID:38678117
      supporting_text: We observed and identified certain structural features of AFP, including N-glycosylation
        at Asn251, four natural fatty acids bound to distinct domains, and the coordination of metal ions
        by residues His22, His264, His268, and Asp280.
    - reference_id: PMID:38678117
