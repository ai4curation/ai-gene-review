        AFP
    - reference_id: PMID:38678117
      supporting_text: These FA binding sites are located in AFP substructures IIA, IIA/IIB, IIIA, and
        IIIB, respectively
- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IDA
  original_reference_id: PMID:80265
  qualifier: enables
  review:
    summary: 'Proposed. Alpha-fetoprotein purified from human umbilical cord serum and from the ascites
      of a hepatoma patient binds one copper(II) ion per molecule above pH 6, measured by equilibrium
      dialysis and gel filtration. The site was localised by two independent chemical arguments: it is
      lost when histidyl residues are destroyed by methylene-blue photooxidation, and it is reconstituted
      by a synthetic undecapeptide corresponding to the protein''s amino terminus. UniProt already encodes
      the conclusion as a Cu(2+) binding feature at residue 22 with ECO:0000269 evidence to this paper.
      GOA has no copper term.'
    action: NEW
    reason: 'This is a measurement on the human protein, from human tissue, with the binding site mapped,
      rather than a property inherited from serum albumin. It is also the clearest instance of the coverage
      problem on this gene, because UniProt has carried an experimentally evidenced copper-binding residue
      for decades and no GO annotation reflects it. The structural work corroborates it independently
      and from a different direction: PMID:38678117 resolves a metal site coordinated by His22, His264,
      His268 and Asp280, and His22 is the same residue UniProt annotates as the Cu(2+) ligand, so a 1978
      solution measurement and a 2024 structure converge on one position. The pH dependence reported in
      PMID:80265, with binding falling to 0.5 mol per mol at pH 5.4, close to the pKa of the imidazole
      group, is itself consistent with histidine coordination. GO:0005507 is a descendant of the GO:0036094
      already annotated by IBA, so this specifies an existing row. This row is deliberately the specific
      one of a parent/child pair: the companion GO:0046872 row carries the structure''s finding that the
      same site binds several metals, while copper is named here because copper is the only metal for
      which a stoichiometry and a mapped site exist on the human protein.'
    supported_by:
    - reference_id: PMID:80265
      supporting_text: Alpha-fetoprotein bound 1 mol of copper(II) ion per mol of protein above pH 6.0
    - reference_id: PMID:80265
      supporting_text: Photooxidation of alpha-fetoprotein in the presence of methylene blue resulted
        in the loss of the copper(II)-binding ability of the protein in parallel with the destruction
        of the histidyl residues.
    - reference_id: PMID:80265
      supporting_text: A synthetic amino-terminal undecapeptide of alpha-fetoprotein also bound copper(II)
        ion.
    - reference_id: PMID:38678117
      supporting_text: We observed and identified certain structural features of AFP, including N-glycosylation
        at Asn251, four natural fatty acids bound to distinct domains, and the coordination of metal ions
        by residues His22, His264, His268, and Asp280.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IDA
  original_reference_id: PMID:38678117
  qualifier: enables
  review:
    summary: 'Proposed, at the generality the measurement supports. The cryo-EM structure of human alpha-fetoprotein
      resolves a tetrahedral metal site in domain IA coordinated by His22, His264, His268 and Asp280,
      and the authors tested it directly: they mutated all four residues to alanine and measured metal
      content of wild-type and mutant protein by ICP-MS. The mutant lost magnesium, aluminium, nickel
      and zinc alike, and they conclude the four residues can bind different types of metal ion. The metal
      was carried from the culture medium rather than added, so the site is occupied under ordinary conditions.'
    action: NEW
    reason: 'This row was first proposed as GO:0008270 zinc ion binding and has been generalised after
      review, because the paper''s own wet-lab metal experiment argues against zinc specificity rather
      than merely failing to establish it. Zinc entered the model as a modelling choice - the authors
      write that they selected Zn2+ to fit into the density map, having reasoned from a similar motif
      in Cu,Zn-superoxide dismutase - and the density is explicitly described as an average that may cover
      more than one metal species. Against that, the ICP-MS assay on the H22A/H264A/H268A/D280A mutant
      is a direct measurement on the human protein, and it shows the site losing four chemically dissimilar
      metals at once. Weighing a deposited ligand identity above the paper''s own measurement would be
      the wrong way round. GO:0046872 metal ion binding is therefore the term the evidence supports, and
      it is still a descendant of the GO:0036094 already annotated by IBA, so the row remains a refinement
      rather than a restatement. Note that this does not weaken the companion copper row: GO:0005507 rests
      on a different and independent line of evidence, an equilibrium-dialysis stoichiometry on protein
      purified from human tissue with the site mapped chemically to histidine, which is exactly the kind
      of measurement the structure paper does not provide for zinc. Specific where a specific metal was
      measured, general where only a metal was. The ICP-MS result also supplies the first independent
      evidence on the human protein for UniProt''s otherwise unsourced nickel claim. Two things a curator
      will reasonably ask about this pair. First, GO:0005507 copper ion binding is a descendant of GO:0046872,
      so why both: because they rest on different experiments making different claims, and neither subsumes
      the other in evidence. The copper row asserts a measured 1:1 stoichiometry with a chemically mapped
      site, from PMID:80265; this row asserts something the copper row cannot, namely that the same four-residue
      site engages several chemically dissimilar metals, which is what the AFP-4mut ICP-MS actually shows.
      Dropping the general term would discard the promiscuity result, and dropping the specific one would
      discard the only quantitative metal measurement on this protein. Second, nickel is among the metals
      lost in the mutant, so why is GO:0016151 nickel cation binding not proposed alongside: because the
      ICP-MS gives a relative reduction in molar ratio in a supplementary panel, not a stoichiometry or
      an affinity, and that is a weaker basis than the copper work by some distance. GO:0046872 already
      covers nickel, so the evidence is represented without asserting a specificity the data do not carry.
      The same reasoning would extend to magnesium and aluminium, which is itself a reason to stop at
      the parent.'
    supported_by:
    - reference_id: PMID:38678117
      supporting_text: The findings indicated a reduction in the molar ratio of metal to protein in the
        mutant AFP-4mut, specifically for elements such as magnesium, aluminum, nickel and zinc
    - reference_id: PMID:38678117
      supporting_text: This implies that the identified four amino acids in AFP possess the capacity to
        bind to different types of metal ions
    - reference_id: PMID:38678117
      supporting_text: After we selected Zn2+ fit into the density map
    - reference_id: PMID:38678117
      supporting_text: This could be due to the presence of multiple metal ions at this binding site,
        and the metal ion density being obtained through an averaging algorithm
    - reference_id: PMID:38678117
      supporting_text: We observed and identified certain structural features of AFP, including N-glycosylation
        at Asn251, four natural fatty acids bound to distinct domains, and the coordination of metal ions
        by residues His22, His264, His268, and Asp280.
    - reference_id: PMID:38678117
      supporting_text: the presence of metal ions was not intentionally introduced during the protein
        extraction process
core_functions:
- description: Extracellular carriage of long-chain fatty acids in fetal plasma. Alpha-fetoprotein is
    the fetal counterpart of serum albumin and binds fatty acids at four sites distributed across subdomains
    IIA, IIA/IIB, IIIA and IIIB of the three-domain albumin fold. The identity of the bound species is
    measured rather than assumed, because gas chromatography-mass spectrometry of lipid extracted from
    the purified human protein identifies palmitate as the dominant species at 57.42 per cent of total
    fatty acid, with stearate the other major peak, and the deposited structure 8X1N contains palmitic
    acid. The ligands are retained through purification rather than soaked in, so the sites are occupied
    under ordinary conditions. Because the protein is the dominant plasma protein of the fetus at a time
    when serum albumin has not yet taken over, this binding activity is the best-supported molecular function
    the gene has, and it is the one the whole albumin family is built around.
  supported_by:
  - reference_id: PMID:38678117
    supporting_text: We observed and identified certain structural features of AFP, including N-glycosylation
      at Asn251, four natural fatty acids bound to distinct domains, and the coordination of metal ions
      by residues His22, His264, His268, and Asp280.
  - reference_id: PMID:38678117
    supporting_text: it was identified that palmitic acid (C16:0) was the most abundant FA bound to AFP
  - reference_id: file:human/AFP/AFP-uniprot.txt
    supporting_text: Belongs to the ALB/AFP/VDB family.
  molecular_function:
    id: GO:0005504
    label: fatty acid binding
  locations:
  - id: GO:0005576
    label: extracellular region
  knowledge_gaps:
  - gap_statement: Binding is established; delivery is not. No experiment on the human protein demonstrates
      the second half of a carrier activity, namely release of a bound fatty acid to an acceptor or at
      a destination.
    gap_kind:
    - BIOLOGY
    - CURATION
    status: OPEN
    significance: This is why GO:0140104 molecular carrier activity, which serum albumin holds by experimental
      evidence, is deliberately not proposed in this review, and why no fatty acid transport process term
      is proposed either. Rounding binds fatty acids and circulates in fetal plasma up to transports fatty
      acids to the fetus would be an inference, not a reading of the data.
  - gap_statement: Which fatty acids the protein actually carries in human fetal plasma has not been measured
      on protein purified from fetal serum.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: The structural work used recombinant protein from HEK293F cells, so the observed composition
      reflects that medium. Whether docosahexaenoic acid, the species most often invoked in the placental
      transfer argument, is bound at meaningful occupancy in vivo is therefore open.
- description: 'Extracellular binding of transition metal ions through an amino-terminal histidine site.
    Alpha-fetoprotein purified from human cord serum and from hepatoma ascites binds one copper(II) ion
    per molecule above pH 6, with binding falling to half a mole per mole near the pKa of the imidazole
    group, abolished by photooxidative destruction of histidyl residues, and reproduced by a synthetic
    undecapeptide from the protein''s amino terminus. The structure of the human protein places a tetrahedral
    metal site in domain IA formed by His22, His264, His268 and Asp280, with His22 the same residue UniProt
    annotates as the copper ligand, so a solution measurement from 1978 and a 2024 cryo-EM model identify
    the same position. The site differs from serum albumin''s, which substitutes a water molecule for
    one of the histidines, and this is the structural basis for the higher zinc affinity reported for
    alpha-fetoprotein. The identity of the metal is not settled and the paper''s own measurement says
    it is promiscuous: mutating all four residues to alanine reduces bound magnesium, aluminium, nickel
    and zinc together by ICP-MS, and zinc entered the structural model only because the authors selected
    it to fit an averaged density. Copper is named as the molecular function here because copper is the
    one metal for which a stoichiometry and a site have actually been measured on the human protein; the
    accompanying GO:0046872 annotation carries the general capacity the structure supports.'
  supported_by:
  - reference_id: PMID:80265
    supporting_text: Alpha-fetoprotein bound 1 mol of copper(II) ion per mol of protein above pH 6.0
  - reference_id: PMID:80265
    supporting_text: A synthetic amino-terminal undecapeptide of alpha-fetoprotein also bound copper(II)
      ion.
  - reference_id: PMID:38678117
    supporting_text: We observed and identified certain structural features of AFP, including N-glycosylation
      at Asn251, four natural fatty acids bound to distinct domains, and the coordination of metal ions
      by residues His22, His264, His268, and Asp280.
  - reference_id: PMID:38678117
    supporting_text: The findings indicated a reduction in the molar ratio of metal to protein in the
      mutant AFP-4mut, specifically for elements such as magnesium, aluminum, nickel and zinc
  - reference_id: PMID:38678117
    supporting_text: Previous studies have demonstrated that AFP exhibits a higher affinity for Zn2+ than
      HSA
  molecular_function:
    id: GO:0005507
    label: copper ion binding
  locations:
  - id: GO:0005576
    label: extracellular region
  knowledge_gaps:
  - gap_statement: Which metal the amino-terminal site prefers in vivo is unresolved.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: The 1978 solution work measured copper by equilibrium dialysis; the 2024 structure models
      zinc from an averaged density the authors say may contain more than one metal species, while its
      ICP-MS assay on the four-alanine mutant shows magnesium, aluminium, nickel and zinc all falling
      together; and UniProt's function line names nickel without pointing to a measurement. The structure
      paper also reports that alpha-fetoprotein has a higher affinity for Zn(2+) than human serum albumin,
      attributing the difference to an additional histidine, but that is a citation to earlier work rather
      than a measurement made there. A titration of the purified human protein across Cu(II), Zn(II) and
      Ni(II) would settle which metal the site actually prefers.
  - gap_statement: Whether metal binding has any physiological consequence is untested.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: The proposal in the structural work that the site relates to superoxide dismutase-like
      chemistry, and the observation that the motif is better conserved in viviparous than oviparous animals,
      are suggestions rather than measurements, so no biological process term is proposed on the strength
      of them.
proposed_new_terms:
- proposed_name: bilirubin binding
  proposed_definition: Binding to bilirubin, a linear tetrapyrrole produced by the reduction of biliverdin
    during the catabolism of heme, and transported in blood plasma bound to carrier proteins.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  justification: 'GO can express bilirubin transport as a process, GO:0015723, and bilirubin transmembrane
    transporter activity, GO:0015127, but it has no molecular function term for simply binding bilirubin.
    This is a real gap rather than an oversight about an obscure ligand. Plasma carriage of bilirubin
    by albumin-family proteins is textbook physiology, it underpins the clinical management of neonatal
    jaundice, and it is directly measured for alpha-fetoprotein: two independent methods, difference spectroscopy
    and the Jacobsen peroxidase assay, give 1:1 stoichiometry and dissociation constants between 2.6 and
    7.4 x 10^-7 M on protein purified from human cord serum and from hepatoma ascites. Because no molecular
    function term exists, that measurement cannot be captured in GO at all, and UniProt''s statement that
    alpha-fetoprotein binds bilirubin less well than serum albumin does is likewise unrepresentable. A
    parent of GO:0046906 tetrapyrrole binding is appropriate because bilirubin is an open-chain tetrapyrrole
    and the definition of GO:0046906 covers compounds containing four pyrrole nuclei linked through alpha-position
    carbons. The term would immediately serve serum albumin as well as alpha-fetoprotein, and plausibly
    the bilirubin-binding glutathione S-transferases and the substrates already modelled under GO:0015723.'
  supported_by:
  - reference_id: PMID:89900
    supporting_text: 1 mol of each alpha-fetoprotein bound 1 mol of bilirubin at pH 8.3
  - reference_id: PMID:89900
    supporting_text: the dissociation constants of the complexes of bilirubin with fetal alpha-fetoprotein
      and hepatoma-derived alpha-fetoprotein were 2.6 x 10(-7) and 5.0 x 10(-7) M, respectively
  - reference_id: PMID:89900
    supporting_text: These results indicate that alpha-fetoprotein may function as a carrier protein for
      bilirubin as has been shown for serum albumin.
suggested_questions:
- question: For PAINT, a node-placement question about PTHR11385 as a whole rather than about AFP alone.
    The family has seven IBD assignments. Three subfamily nodes each carry the specific ligand of their
    subfamily - vitamin E on PTN000147369 for afamin, vitamin D on PTN002604574 for the vitamin D-binding
    proteins, enterobactin on PTN008319942 for the albumins - while the family root PTN000147344 carries
    the general parent GO:0036094. That design is sound. Two things follow from it that are worth examining.
    First, PTHR11385:SF7, the alpha-fetoprotein subfamily, has no assignment at all, so AFP is the only
    one of the four human members that inherits no ligand term; a subfamily node exists and is empty.
    Second, GO:0005504 fatty acid binding sits at no node in the family, although serum albumin holds
    it by two independent IDAs, rat albumin by IDA, mouse Afp by UniProt function statement, and human
    AFP by the structural work cited here. Fatty acid binding looks like the property that most clearly
    transfers family-wide, and it is the one property that PAINT has not placed anywhere.
  experts: []
- question: 'Also for PAINT, and affecting every member of PTHR11385 rather than AFP specifically: is
    GO:0031667 response to nutrient levels sustainable at PTN000147344? Tracing the donors'' own evidence
    leaves three experimental papers. One expressed recombinant human serum albumin from a rice sucrose-starvation-inducible
    promoter, where the starvation response belongs to the plant promoter. One added albumin to serum-free
    medium at 29-49 mg/ml and challenged cells with drugs that release endoplasmic reticulum calcium.
    One measured serum albumin concentration as a readout of nutritional status in rats. The remaining
    donor rows are ISS or ISO copies of the first two. This review removes the term from AFP, but the
    same argument applies to the node and therefore to ALB, GC and AFM as well.'
  experts: []
- question: Should GOA import the human AFP ligand measurements at all? Two of them, copper binding from
    PMID:80265 and bilirubin binding from PMID:89900, are from 1978 and 1979 and have been sitting in
    UniProt's function line and feature table since. The copper site is encoded as a binding feature at
    residue 22 with ECO:0000269 evidence, which is a curated experimental assertion, yet there is no corresponding
    GO annotation. Is the absence a deliberate age or quality judgement, or simply a gap? If it is a judgement,
    the 2024 structure independently locating a metal site on the same His22 is new grounds to revisit
    it.
  experts: []
- question: What is the AFP receptor? The literature invokes a cell-surface AFPR to explain receptor-mediated
    uptake of AFP by embryonic, hepatoma and gastric tumour cells, and the AFP drug-delivery work depends
    on it, but no molecular identity has been established. Glypican-3 is now a validated direct binding
    partner of secreted AFP at the cell membrane, verified with purified proteins against a negative control.
    Is glypican-3 the receptor, one of several, or an abundant co-purifying surface partner with no uptake
    role?
  experts: []
- question: 'A UniProt question rather than a GO one, now partly answered. The function line states that
    the protein binds nickel, but the feature table records only the Cu(2+) site and no reference in the
    entry is flagged for nickel the way PubMed:80265 is flagged for copper and PubMed:89900 for bilirubin.
    PMID:38678117 supplies the first independent measurement bearing on it: its ICP-MS assay on the H22A/H264A/H268A/D280A
    mutant shows nickel among the metals lost along with magnesium, aluminium and zinc, so the amino-terminal
    site does engage nickel on the human protein. That does not tell us where UniProt''s assertion came
    from, and it is worth asking whether the original basis was a measurement on alpha-fetoprotein or
    a transfer from serum albumin''s amino-terminal metal site - but the claim itself now has support
    that UniProt could cite.'
  experts: []
- question: How should GO represent a protein that is clinically important purely as a concentration?
    Nothing in the ontology distinguishes what alpha-fetoprotein does from what its level indicates, and
    the distinction is not merely philosophical here, because it has already produced a defective annotation.
    The rat albumin IEP that helps underpin this family's GO:0031667 is an experiment in which albumin
    concentration falls with malnutrition and recovers with refeeding, that is a biomarker measurement
    that has become a process annotation. The same confusion is waiting in AFP's own much larger biomarker
    literature.
  experts: []
suggested_experiments:
- hypothesis: The fatty acids bound by alpha-fetoprotein in vivo differ from those it acquires in HEK293F
    culture medium, and include docosahexaenoic acid.
  description: Purify alpha-fetoprotein from human fetal cord serum and determine its bound fatty acid
    composition by GC-MS, alongside serum albumin from the same donors. The existing composition comes
    from recombinant protein grown in HEK293F medium, so it reports what that medium supplied. This would
    establish which fatty acids the protein actually carries in the fetal circulation, and in particular
    whether docosahexaenoic acid, the species most often invoked in the placental transfer argument, is
    present at a meaningful occupancy.
  experiment_type: Lipid extraction and gas chromatography-mass spectrometry on protein purified from
    native human fetal serum
- hypothesis: Alpha-fetoprotein does not merely bind fatty acids but releases them to an acceptor, which
    would license GO:0140104 molecular carrier activity.
  description: Test the carrier half of the activity directly. Load purified human alpha-fetoprotein with
    a labelled fatty acid and measure transfer to acceptor membranes or to cells, with serum albumin as
    a positive control and a ligand-site mutant as a negative. Binding is well established and delivery
    is not, which is the single reason GO:0140104 molecular carrier activity is not proposed in this review.
    A positive result would justify that term and a transport process term; a negative result would be
    equally informative, because it would mean the fetal protein is a reservoir rather than a shuttle.
  experiment_type: Ligand transfer assay from purified loaded protein to acceptor membranes or cells,
    with serum albumin as positive control and a site mutant as negative
- hypothesis: The amino-terminal His22 site of alpha-fetoprotein binds Cu(II), Zn(II) and Ni(II) with
    a measurable preference order, and the extra histidine relative to serum albumin accounts for its
    higher zinc affinity.
  description: Settle the metal identity by isothermal titration calorimetry on the purified human protein
    across Cu(II), Zn(II) and Ni(II), with the His22 position mutated as a control. The 1978 equilibrium
    dialysis work measured copper, the 2024 structure models zinc from a density the authors say may average
    over several species, and UniProt's function line adds nickel without a flagged measurement. One titration
    series resolves three partially conflicting assertions and would also test whether the extra histidine
    relative to serum albumin does confer the higher zinc affinity that has been attributed to it.
  experiment_type: Isothermal titration calorimetry across three metals with a His22 point mutant as control
- hypothesis: Glypican-3 is a receptor for secreted alpha-fetoprotein, and its core protein is sufficient
    for uptake.
  description: Ask whether glypican-3 mediates uptake of alpha-fetoprotein. Compare internalisation of
    labelled AFP by hepatoma cells with and without GPC3 knockout, using the heparan-sulfate-free glypican-3
    mutant to confirm that the core protein is sufficient, as the binding data indicate. This converts
    a validated physical interaction into a functional claim or refutes it, and it bears directly on whether
    glypican-3 is the long-postulated AFP receptor.
  experiment_type: Labelled-ligand internalisation in GPC3-knockout versus wild-type hepatoma cells, rescued
    with full-length or heparan-sulfate-free glypican-3
- hypothesis: Human alpha-fetoprotein binds estrogens far more weakly than mouse alpha-fetoprotein, which
    is what excludes the mouse reproductive phenotype from the human gene.
  description: Measure estrogen binding by human and mouse alpha-fetoprotein side by side under identical
    conditions, using protein purified from the respective fetal sera. The species difference is asserted
    throughout the literature and underlies the judgement that the mouse knockout phenotype must not be
    transferred to the human gene, but the quantitative comparison is old and method-heterogeneous. Since
    this asymmetry is what licenses excluding the mouse reproductive annotations from human AFP, it deserves
    a modern direct measurement.
  experiment_type: Side-by-side equilibrium binding measurement on protein purified from human and mouse
    fetal serum under identical conditions
knowledge_gaps:
- gap_statement: This gene's GO problem is coverage rather than over-annotation, and the review should
    be read that way.
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  status: NARROWING
  significance: 'Human AFP''s entire GO record is eight annotations over six distinct terms, with no experimental
    molecular function beyond three protein binding IPI rows and no experimental biological process row
    at all. Set against that: two solution-binding studies on protein purified from human tissue, a cryo-EM
    structure resolving four fatty acids and a metal site, six FAM20C phosphosites with ECO:0000269 evidence,
    and two human null-allele reports. None of those produced a GO annotation. Exactly one existing row,
    GO:0031667, is an over-annotation.'
  resolution: Three new molecular function rows are proposed here from measurements that already exist,
    and a missing bilirubin binding term is proposed to GO.
- gap_statement: What alpha-fetoprotein is for in humans is unknown, and the usual answer given is a rodent
    answer.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: In mouse, Afp-null females are infertile and the phenotype is attributed to estrogen binding;
    human alpha-fetoprotein has essentially no estrogen-binding capacity, and humans homozygous for null
    alleles are asymptomatic with normal development and normal male reproduction. The human null reports
    say nothing about female reproduction, which is the one place the mouse phenotype would predict a
    defect, so the strongest human evidence has a gap precisely where it would be most informative.
- gap_statement: Whether the intracellular alpha-fetoprotein described in hepatocellular carcinoma is
    a distinct functional pool or a by-product of very high biosynthetic flux is unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: A secreted protein at extreme expression levels will be abundant in the secretory pathway
    and detectable in cytoplasmic fractions, so colocalisation alone does not establish a cytosolic pool
    with access to cytosolic partners such as HuR, HSP90 and PTEN. This matters because most of the mechanistic
    AFP literature depends on that pool being real and topologically cytosolic, and because it is the
    reason the GO:0005737 row here is kept as non-core rather than accepted.
- gap_statement: The functional significance of alpha-fetoprotein glycosylation is unresolved even though
    it carries the clinical assay.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: AFP-L3, the core-fucosylated glycoform, is a distinct approved tumour marker, and tumour-derived
    and cord-derived protein differ in glycan composition, but whether glycosylation alters ligand binding,
    receptor recognition or the reported immunosuppressive activity has not been established.
