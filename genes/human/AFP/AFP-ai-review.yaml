id: P02771
gene_symbol: AFP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Alpha-fetoprotein is the major plasma protein of the mammalian fetus and the closest paralogue
  of serum albumin. It is a 609-residue, single-chain, three-domain member of the ALB/AFP/VDB family,
  made with a cleaved 18-residue signal peptide, N-glycosylated at Asn251, disulfide-rich, phosphorylated
  on six serines by FAM20C in the endoplasmic reticulum lumen, and constitutively secreted. Synthesis
  is restricted to the visceral and yolk-sac endoderm and the fetal liver; concentrations peak around
  the 12th-16th week of gestation, fall to trace levels after birth, and rise again when hepatocytes or
  germ-cell tumours re-acquire the fetal expression programme.

  Its molecular function is reversible binding of small hydrophobic and metal ligands in the albumin fold.
  A cryo-EM structure of the human protein resolves four fatty acids occupying sites in subdomains IIA,
  IIA/IIB, IIIA and IIIB, with palmitate and stearate identified by GC-MS as the species actually bound,
  and a metal ion coordinated by His22, His264, His268 and Asp280. Direct binding assays on protein purified
  from human cord serum and hepatoma ascites show one Cu(II) per molecule, dependent on an amino-terminal
  histidine, and one bilirubin per molecule with sub-micromolar affinity. The ligand repertoire overlaps
  serum albumin''s but is not identical to it: human alpha-fetoprotein binds copper, nickel, fatty acids
  and, less well than albumin, bilirubin, whereas high-affinity estrogen binding, which is a defining
  property of rodent alpha-fetoprotein and the basis of the female-infertility phenotype of Afp-null mice,
  is essentially absent from the human protein.

  Beyond ligand carriage the protein has no established physiological role. Humans homozygous for null
  AFP alleles are asymptomatic with normal fetal development and normal male reproduction, so the protein
  is dispensable in humans. In hepatocellular carcinoma an intracellular pool has been reported to engage
  HuR, HSP90 and PTEN and to modulate apoptotic and PI3K/AKT signalling, and the secreted protein binds
  the cell-surface proteoglycan glypican-3 through its core protein; these are cancer-cell observations
  rather than properties of the fetal plasma protein. Clinically the protein is used as a concentration
  readout in prenatal screening and in hepatocellular and germ-cell tumour management, which is a diagnostic
  application and not a biological activity.'
