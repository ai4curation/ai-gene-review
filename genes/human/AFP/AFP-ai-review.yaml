- id: PMID:12297623
  title: Alpha-fetoprotein, the major fetal serum protein, is not essential for embryonic development
    but is required for female fertility.
  findings:
  - statement: The mouse knockout phenotype is sex-limited - null males are normal and fertile, null females
      are infertile through hypothalamic-pituitary dysfunction.
    supporting_text: Whereas mutant homozygous adult males are viable and fertile, AFP null females are
      infertile.
  - statement: The authors attribute the phenotype specifically to estrogen binding, which is the property
      that distinguishes rodent from human alpha-fetoprotein and the reason this phenotype must not be
      transferred to the human gene.
    supporting_text: It is most likely that AFP acts by virtue of its capacity to bind estrogen, because
      the infertility phenotype of the Afp knockout mice resembles that of female animals exposed perinatally
      to estrogens
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. Cited as the boundary of what may be transferred to human AFP,
      not as support for a human annotation. Mouse UniProt P02772 states the protein binds estrogens;
      human UniProt states that only a small percentage, under two per cent, of human AFP shows estrogen-binding
      properties. The corresponding mouse IMP process rows have in fact not been propagated to human AFP,
      which this review reports as a check that came back negative.
