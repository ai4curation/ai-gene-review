  review:
    summary: 'The right term reached by a route that does not support it. GOA records this as an Ensembl
      Compara projection from mouse Afp, whose entire basis is a single MGI IDA from PMID:8607965, a paper
      whose own abstract reports that alpha-fetoprotein protein was not detected by immunostaining in
      the systems studied, with only serum albumin visible and AFP present as mRNA. The term nonetheless
      survives, on human evidence that GOA does not cite: confocal imaging shows AFP colocalising with
      HuR in the cytoplasm of HuH7 and HepG2 hepatoma cells.'
    action: KEEP_AS_NON_CORE
    reason: 'Two separate judgements, kept apart deliberately. On provenance, this is a one-hop projection
      resting on one mouse annotation, and the cited paper''s abstract states that AFP was not detected
      during the period examined while serum albumin was, with the intracellular-AFP claim appearing as
      a background citation to earlier work rather than as this study''s result. Only the abstract is
      cached, so this is recorded as support that cannot be confirmed from the available record rather
      than as a curator error, and the mouse IDA itself is not second-guessed. On the term, an intracellular
      pool of AFP in AFP-producing hepatoma cells is independently supported in human cells by direct
      imaging, so removing the term would discard something true. It is non-core rather than core for
      two reasons: the physiological protein is a constitutively secreted plasma protein with a cleaved
      signal peptide, and the cytoplasmic pool is described specifically in hepatoma lines, which is a
      disease context rather than the fetal setting in which this gene does its work. Kept, downgraded,
      and with the recorded provenance flagged so that the reason it is kept is not confused with the
      reason GOA gives.'
    supported_by:
