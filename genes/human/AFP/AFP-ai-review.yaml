- id: PMID:26808496
  title: Comparative Proteomics Reveals Important Viral-Host Interactions in HCV-Infected Human Liver
    Cells.
  findings:
  - statement: An affinity purification of HCV envelope glycoprotein E2 complexes from infected human
      hepatoma cells recovered 85 cellular proteins, of which alpha-fetoprotein was one of three taken
      forward and confirmed as an E2 binding partner.
    supporting_text: were further validated as novel E2 binding partners
    reference_section_type: ABSTRACT
  - statement: The confirmation was a co-immunoprecipitation between two over-expressed proteins in 293T
      cells, which is weaker evidence than an assay with purified components; the paper's functional follow-up
      was on UGT1, not on alpha-fetoprotein.
    supporting_text: To this end, we subcloned AFP, UDP-glucose:glycoprotein glucosyltransferase 1 (UGT1),
      and Cdc2 in a Flag-tagged expression plasmid and co-transfected with a HCV E2 expression plasmid
      into 293T cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; no retraction, erratum or expression of concern. Correctly supports
      a physical interaction between alpha-fetoprotein and a viral envelope protein. It does not support
      any activity-level claim, and the WITH/FROM accession Q99IB8-PRO_0000045596 was confirmed against
      UniProt to be Envelope glycoprotein E2, residues 384-750.
- id: PMID:39822733
  title: 'A proteomic atlas of glypican-3 interacting partners: Identification of alpha-fetoprotein and
    other extracellular proteins as potential immunotherapy targets in liver cancer.'
  findings:
  - statement: The alpha-fetoprotein-glypican-3 interaction was validated outside the mass-spectrometry
      screen using purified proteins with a negative control, so it is not a screen artefact.
    supporting_text: The results show that AFP pulls down GPC3, but not MUC16, a control protein
  - statement: Binding is to the glypican-3 core protein rather than to its heparan sulfate chains, because
      a glypican-3 mutant lacking those chains still precipitates alpha-fetoprotein. This is why a proteoglycan-binding
      term would misdescribe the interaction.
    supporting_text: suggesting that the GPC3 core protein might bind AFP
  - statement: The authors state the core-protein conclusion directly.
    supporting_text: Our results indicate that the core protein of GPC3 is involved in binding with AFP.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. The cached copy initially carried full_text_available false,
      which was stale - PMC11737099 holds the full text and a forced re-fetch retrieved it. Reading it
      changed this review's conclusion, because the heparan-sulfate-free mutant result rules out the proteoglycan-binding
      term that the abstract alone would have supported. No functional consequence of the interaction
      is measured anywhere in the paper.
- id: PMID:38678117
  title: Structural characteristics of alpha-fetoprotein, including N-glycosylation, metal ion and fatty
    acid binding sites.
  findings:
  - statement: The first structure of human alpha-fetoprotein resolves four bound fatty acids and a metal-ion
      site formed by three histidines and an aspartate.
    supporting_text: We observed and identified certain structural features of AFP, including N-glycosylation
      at Asn251, four natural fatty acids bound to distinct domains, and the coordination of metal ions
      by residues His22, His264, His268, and Asp280.
  - statement: The bound lipids were identified chemically rather than inferred from density shape, with
      palmitate the dominant species at 57.42 per cent of total fatty acid.
    supporting_text: it was identified that palmitic acid (C16:0) was the most abundant FA bound to AFP
  - statement: The four fatty acid sites map to defined subdomains of the albumin fold.
    supporting_text: These FA binding sites are located in AFP substructures IIA, IIA/IIB, IIIA, and IIIB,
      respectively
  - statement: The metal was acquired by the protein from its growth environment rather than added by
      the experimenters, which argues the site is occupied under ordinary conditions.
    supporting_text: the presence of metal ions was not intentionally introduced during the protein extraction
      process
  - statement: The identity of the bound metal is modelled as zinc but the authors record a caveat that
      the density may average over more than one metal species.
    supporting_text: This could be due to the presence of multiple metal ions at this binding site, and
      the metal ion density being obtained through an averaging algorithm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. This is the single most function-relevant paper on human AFP
      and it is absent from GOA and absent from the affinage record, which is the campaign's recall lesson
      in concrete form. Caveats noted rather than glossed - the protein is recombinant from HEK293F rather
      than native fetal serum, and the authors themselves qualify the metal assignment.
- id: PMID:80265
  title: Copper(II)-binding ability of human alpha-fetoprotein.
  findings:
  - statement: Alpha-fetoprotein purified from human umbilical cord serum and from hepatoma ascites binds
      one copper(II) ion per molecule above pH 6.
    supporting_text: Alpha-fetoprotein bound 1 mol of copper(II) ion per mol of protein above pH 6.0
  - statement: The site was mapped chemically to histidine, by loss of binding on selective photooxidation
      of histidyl residues.
    supporting_text: Photooxidation of alpha-fetoprotein in the presence of methylene blue resulted in
      the loss of the copper(II)-binding ability of the protein in parallel with the destruction of the
      histidyl residues.
  - statement: The activity was reconstituted from a synthetic peptide corresponding to the protein's
      amino terminus, localising the site to that region.
    supporting_text: A synthetic amino-terminal undecapeptide of alpha-fetoprotein also bound copper(II)
      ion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. Old but directly on point, and performed on protein purified
      from human tissue rather than on a recombinant or a family member. UniProt already encodes this
      as a Cu(2+) binding feature at residue 22 with ECO:0000269 evidence to this PMID, yet GOA carries
      no copper term, which is the clearest single coverage gap on this gene.
- id: PMID:89900
  title: alpha-Fetoprotein as a carrier protein in plasma and its bilirubin-binding ability.
  findings:
  - statement: Alpha-fetoprotein from human cord serum and from hepatoma ascites binds bilirubin at 1:1
      stoichiometry with sub-micromolar dissociation constants, measured by two independent methods.
    supporting_text: 1 mol of each alpha-fetoprotein bound 1 mol of bilirubin at pH 8.3
  - statement: The affinities were determined as dissociation constants in the 10^-7 M range for both
      fetal and tumour-derived protein.
    supporting_text: the dissociation constants of the complexes of bilirubin with fetal alpha-fetoprotein
      and hepatoma-derived alpha-fetoprotein were 2.6 x 10(-7) and 5.0 x 10(-7) M, respectively
  - statement: The authors draw the carrier conclusion explicitly, by analogy with serum albumin.
    supporting_text: These results indicate that alpha-fetoprotein may function as a carrier protein for
      bilirubin as has been shown for serum albumin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. Directly measured on human protein. It cannot currently be expressed
      in GO because no bilirubin binding molecular function term exists - see proposed_new_terms.
- id: PMID:15280901
  title: Congenital deficiency of alpha feto-protein.
  findings:
  - statement: Individuals homozygous for a frameshift null allele of AFP are healthy, which places a
      hard ceiling on how essential any biological process annotated to this gene can be.
    supporting_text: The affected individuals were asymptomatic and presented normal development.
  - statement: The authors state the dispensability conclusion for development and male reproduction.
    supporting_text: deficiency of AFP is compatible with human normal fetal development and further reproduction
      in males
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; clean. Human loss-of-function genetics, and the single most important
      constraint on process-level annotation of this gene. Note it does not speak to female reproduction,
      which is where the mouse phenotype lies.
- id: PMID:18854864
  title: A new mutation in the AFP gene responsible for a total absence of alpha feto-protein on second
    trimester maternal serum screening for Down syndrome.
  findings:
  - statement: A second, independent null allele of AFP again produced normal fetal development and birth,
      so the first report is not an isolated observation.
    supporting_text: Despite this, fetal development and birth were normal.
  reference_review:
