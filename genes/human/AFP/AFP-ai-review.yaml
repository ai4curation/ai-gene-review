- id: file:human/AFP/AFP-uniprot.txt
  title: UniProt entry P02771 (FETA_HUMAN), alpha-fetoprotein
  findings:
  - statement: UniProt assigns the protein to the albumin family, which is the basis of the PANTHER PTHR11385
      placement and of every phylogenetic inference on this gene.
    supporting_text: Belongs to the ALB/AFP/VDB family.
  - statement: The subcellular location is secreted, which is what makes the cytosolic and nuclear partners
      from high-throughput screens topologically implausible.
    supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Both quotes were verified verbatim against the committed file and both lie wholly within
      a single physical line, so neither crosses a CC continuation, which the repository validator does
      not check for file references. The entry also carries a Cu(2+) binding feature at residue 22 with
      ECO:0000269 to PubMed:80265, a signal peptide at residues 1 to 18, three Albumin domains, and six
      FAM20C phosphosites; those are cited in prose rather than quoted because the relevant text spans
      line breaks.
- id: file:human/AFP/AFP-deep-research-affinage.md
  title: Affinage mechanistic annotation for AFP (human)
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Machine-generated provider record; the script reported trust gates clear, and all 17
      of its citations are numeric PubMed identifiers with no bioRxiv DOIs in PMID-shaped fields. Precision
      is therefore fine. Recall and framing are not, and both were measured rather than asserted. Of its
      17 citations, 0 appear in AFP''s GOA record and 1 are cited in this review (PMID:33009373). It misses
      PMID:38678117, the cryo-EM structure of human AFP that resolves the fatty acid and metal sites and
      is the single most function-relevant paper on this gene, and it misses both direct ligand-binding
      measurements, PMID:80265 for copper and PMID:89900 for bilirubin, although UniProt flags both. More
      important than the omissions is what the record is about: a large part of its narrative concerns
      the transcriptional regulation of the AFP gene by FOXM1, HBP1/HBx and gp96/NR5A2 and the -119 HNF1
      promoter variant. Those are functions of the regulators, not of alpha-fetoprotein, and the rest
      is hepatocellular carcinoma cell biology in which AFP concentration is the readout. Ligand binding,
      which is what the protein does, is absent from the record entirely. Nothing in this review rests
      on it, and no sentence from it is used as supporting_text; it is recorded here because the curatorial
      assessment of a provider record belongs in references[].reference_review.'
existing_annotations:
- term:
    id: GO:0031667
    label: response to nutrient levels
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000147344
  - RGD:2085
  - RGD:2667
  - UniProtKB:P02768
  - UniProtKB:P19121
  review:
    summary: 'A family-node inference whose entire experimental foundation fails on reading. Not one alpha-fetoprotein,
      from any species, is a seed on this row - the donors are serum albumin from human, rat and chicken,
      and vitamin D-binding protein from rat. Querying each donor''s own evidence under this branch leaves
      exactly three experimental papers, and all three measure something other than the protein participating
      in a response to nutrient levels: a rice sucrose-starvation promoter driving recombinant albumin
      production, exogenous albumin at 29-49 mg/ml protecting cells from drug-induced ER calcium release,
      and albumin concentration used as a nutritional-status biomarker in rats. Everything else in the
      donor set is an ISS or ISO copy of the same two human ALB annotations.'
    action: REMOVE
    reason: 'Two independent lines carry this, with a third recorded as an observation rather than an
      argument. The observation first, so that it is not mistaken for load-bearing: the seed list contains
      no member of the alpha-fetoprotein subfamily, so no ortholog-strength inference is available on
      this row. That is worth noting but it is not itself a defect, because an IBA is a judgement about
      a node rather than a pairwise transfer, and AFP descends from PTN000147344 whichever members happened
      to seed it. The removal rests on the next two points. First, the donors'' own evidence does not
      support the term even for the donors. Human ALB holds this term by the same IBA; its only experimental
      rows in the branch are GO:0009267 by IDA from PMID:16245148 and GO:0072732 by IDA from PMID:16153637.
      PMID:16245148 expressed human serum albumin from the rice alphaAmy3 sucrose-starvation-inducible
      promoter in rice suspension culture, so the starvation response is the plant promoter''s and albumin
      is the recombinant cargo. PMID:16153637 supplemented serum-free medium with 29-49 mg/ml albumin
      and challenged cells with dotarizine, flunarizine, thapsigargin and cyclopiazonic acid, which release
      endoplasmic reticulum calcium pharmacologically; that is not a nutrient level. Rat Alb adds one
      IEP, PMID:20227002, in which serum albumin concentration falls under fetal protein malnutrition
      and recovers afterwards, which is albumin as a readout of nutritional status and precisely the concentration-is-not-a-function
      error. Chicken ALB contributes only ISS copies of the two human ALB rows plus an unrelated response-to-vitamin-A
      IDA. So the apparent breadth of the donor set is one pair of experiments counted repeatedly. Second,
      the target''s own biology gives no independent support: two unrelated human families homozygous
      for null AFP alleles are asymptomatic with normal fetal development, which is difficult to reconcile
      with participation in a nutrient-response process. This is a node-level defect rather than an AFP-level
      one, and the recommendation to PAINT is stated once in suggested_questions rather than repeated
      here.'
    supported_by:
    - reference_id: PMID:16245148
      supporting_text: Mature form of HSA was expressed under the control of the sucrose starvation-inducible
        rice alpha Amy3 promoter
    - reference_id: PMID:16153637
      supporting_text: In serum-free medium, albumin (29 or 49 mg/ml) fully prevented the apoptotic effects
        of dotarizine, flunarizine and cyclopiazonic acid.
    - reference_id: PMID:20227002
      supporting_text: there was a restoration of serum glucose, total protein, and albumin concentrations,
        which were reduced by fetal malnutrition
    - reference_id: PMID:15280901
      supporting_text: The affected individuals were asymptomatic and presented normal development.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000147344
        source_label: PANTHER internal tree node, family root of PTHR11385, not a protein
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The root node of PTHR11385. Its reach is the whole serum-albumin-related family, so this
          term is asserted over ALB, AFP, GC and AFM alike. Compare the three other PAINT nodes on this
          family, which each place a specific ligand term on a single subfamily; this row is the only
          one that places a process term at the root.
      - source_id: RGD:2085
        source_label: Alb (Rattus norvegicus), rat serum albumin
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Resolved through the RGD REST API. Its only experimental row in this branch is GO:0007584
          by IEP from PMID:20227002, where serum albumin concentration is a readout of nutritional status;
          its GO:0009267 and GO:0072732 rows are ISS and ISO copies of human ALB's.
      - source_id: RGD:2667
        source_label: Gc (Rattus norvegicus), vitamin D-binding protein
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Resolved through the RGD REST API as rat Gc. A vitamin D carrier rather than an alpha-fetoprotein,
          and no experimental response-to-nutrient-levels evidence was found for it. QuickGO rejects RGD
          identifiers in geneProductId with HTTP 400, so its evidence was approached through the rat UniProt
          accession; reported as a resolution route rather than left silent.
      - source_id: UniProtKB:P02768
        source_label: ALB (Homo sapiens), serum albumin, Swiss-Prot, 609 aa
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The pivotal donor. It does not hold this term experimentally - its own GO:0031667 is
          the same IBA. Its two supporting IDAs are PMID:16245148, a rice-promoter recombinant expression
          study, and PMID:16153637, an exogenous-albumin cytoprotection study. Every other donor's ISS
          or ISO row copies these two.
      - source_id: UniProtKB:P19121
        source_label: ALB (Gallus gallus), serum albumin, Swiss-Prot, 615 aa
        source_status: CIRCULAR_OR_REDUNDANT
        comment: Contributes no independent evidence. Its GO:0009267 and GO:0072732 rows are both ISS
          with human ALB P02768 as the with/from, so counting it as a separate donor double-counts the
          same two human experiments. Its one IDA in the branch, GO:0033189 response to vitamin A, is
          a different stimulus.
- term:
    id: GO:0036094
    label: small molecule binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000147344
  - RGD:2085
  - RGD:2667
  - UniProtKB:P02768
  - UniProtKB:P02769
  - UniProtKB:P02774
  - UniProtKB:P08835
  - UniProtKB:P19121
  - UniProtKB:P43652
  review:
    summary: 'Correct, and general for the right reason. The instinct to call a broad term a granularity
      failure does not survive looking at the donor set, which is genuinely heterogeneous: serum albumin
      holds fatty acid, pyridoxal phosphate, oxygen, enterobactin and copper binding; vitamin D-binding
      protein holds vitamin D binding; afamin holds vitamin E binding. Small molecule binding is the least
      common ancestor of that list, not a curator declining to be specific. PAINT''s own design confirms
      the reading, because it put the general term at the family root and the specific ligand terms on
      the three subfamily nodes.'
    action: ACCEPT
    reason: 'Checked against the rule that a general term is only a granularity defect when the donors
      agree. They do not. Resolving all eight non-node seeds gives serum albumin from four species, human
      vitamin D-binding protein, human afamin, rat albumin and rat vitamin D-binding protein, and querying
      their own annotations gives ligands as different as palmitate, pyridoxal phosphate, molecular oxygen,
      enterobactin, copper, vitamin D and vitamin E. GO:0036094 is the correct common parent of those,
      and QuickGO ancestry confirms that both GO:0005504 fatty acid binding and GO:0005507 copper ion
      binding are descendants of it, so the term does cover AFP''s own measured ligands rather than merely
      sitting alongside them. The term is also true of AFP on the target''s own evidence, independently
      of the phylogeny: UniProt records copper, nickel, fatty acid and bilirubin binding, with an experimentally
      evidenced Cu(2+) site at His22. The right response is therefore additive rather than corrective
      - accept the family-level term and supply AFP''s specific measured ligands as new annotations, which
      is what this review does. Note also what the donor set does not contain: no alpha-fetoprotein from
      any species is a seed, so the inference is entirely from the paralogous subfamilies.'
    supported_by:
