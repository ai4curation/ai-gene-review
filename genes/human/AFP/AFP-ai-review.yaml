- id: PMID:16245148
  title: Production of human serum albumin by sugar starvation induced promoter and rice cell culture.
  findings:
  - statement: The starvation-inducibility in this study is a property of the rice alpha-amylase 3 promoter
      used to drive expression; human serum albumin is the recombinant cargo protein.
    supporting_text: Mature form of HSA was expressed under the control of the sucrose starvation-inducible
      rice alpha Amy3 promoter
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reclassified from MISCITED to VERIFIED after review. The field records this reference's
      status in THIS document, and here the paper is cited correctly and for exactly what it shows - it
      is GOA and PAINT that rest an albumin-family response-to-nutrient-levels annotation on it. This
      is a recombinant-protein yield paper. It is the sole experimental basis of human ALB's GO:0009267
      cellular response to starvation IDA, which is in turn one of only three experimental rows underpinning
      the GO:0031667 family node that propagates to AFP. The starvation response belongs to a plant promoter,
      not to the albumin-family protein.
- id: PMID:16153637
  title: Albumin prevents mitochondrial depolarization and apoptosis elicited by endoplasmic reticulum
    calcium depletion of neuroblastoma cells.
  findings:
  - statement: Albumin was applied as a culture-medium supplement at 29-49 mg/ml and the stimulus was
      pharmacological release of endoplasmic reticulum calcium, not a change in nutrient levels.
    supporting_text: In serum-free medium, albumin (29 or 49 mg/ml) fully prevented the apoptotic effects
      of dotarizine, flunarizine and cyclopiazonic acid.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reclassified from MISCITED to VERIFIED after review. The field records this reference's
      status in THIS document, and here the paper is cited correctly and for exactly what it shows - it
      is GOA and PAINT that rest an albumin-family response-to-nutrient-levels annotation on it. Sound
      pharmacology, but it does not show that albumin participates in a response to nutrient levels. It
      is the basis of human ALB's GO:0072732 cellular response to calcium ion starvation IDA, which reaches
      AFP through the same family node.
- id: PMID:20227002
  title: Recovery of rat growth and lipid profiles in adult rats subjected to fetal protein malnutrition
    with a fructose-rich diet.
  findings:
  - statement: Serum albumin concentration was used as a readout of nutritional status; the protein is
      the thing being measured, not an agent participating in the response.
    supporting_text: there was a restoration of serum glucose, total protein, and albumin concentrations,
      which were reduced by fetal malnutrition
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reclassified from MISCITED to VERIFIED after review. The field records this reference's
      status in THIS document, and here the paper is cited correctly and for exactly what it shows - it
      is GOA and PAINT that rest an albumin-family response-to-nutrient-levels annotation on it. This
      is the only experimental row in the entire GO:0031667 donor set that concerns the endogenous protein,
