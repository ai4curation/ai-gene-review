- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26808496
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q99IB8-PRO_0000045596
  review:
    summary: A genuine interaction with a viral protein, recorded with a term that hides what is most
      informative about it. The partner accession resolves to Envelope glycoprotein E2, residues 384 to
      750 of the hepatitis C virus genotype 2a JFH-1 polyprotein, which is a protein of a different species.
      GO has a term for exactly this situation, and the closest paralogue ALB already carries it by IDA.
    action: MODIFY
    reason: 'GO:0140272 exogenous protein binding is defined as binding to a protein or protein complex
      from a different species, for example a pathogen molecule binding to a host protein, which is a
      literal description of this row. Replacing GO:0005515 with it loses nothing and records the cross-species
      character that is the only generalisable thing the experiment shows. The precedent is not hypothetical:
      human serum albumin, the closest paralogue, holds GO:0140272 by IDA, so this brings AFP into line
      with how the family is already curated rather than inventing a treatment. The interaction itself
      is adequately supported but not strong. It was found in an affinity purification of E2 complexes
      from infected hepatoma cells and then confirmed by co-immunoprecipitation of Flag-tagged AFP with
      E2 in co-transfected 293T cells, that is with both partners over-expressed, and the paper''s functional
      follow-up went to UGT1 rather than to AFP. So this is a real binding event with no measured consequence,
      which is why it is not proposed as a core function. Note also that AFP is secreted and E2 is a viral
      envelope glycoprotein that transits the same secretory pathway, so unlike most of AFP''s high-throughput
      partners the two are topologically capable of meeting.'
    proposed_replacement_terms:
    - id: GO:0140272
      label: exogenous protein binding
    supported_by:
    - reference_id: PMID:26808496
      supporting_text: were further validated as novel E2 binding partners
    - reference_id: PMID:26808496
      supporting_text: To this end, we subcloned AFP, UDP-glucose:glycoprotein glucosyltransferase 1 (UGT1),
        and Cdc2 in a Flag-tagged expression plasmid and co-transfected with a HCV E2 expression plasmid
        into 293T cells.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:39822733
  qualifier: enables
  supporting_entities:
  - UniProtKB:P51654
  review:
    summary: Glypican-3, and the one AFP interaction that survives every check applied to it. IntAct holds
      three records that are not sub-methods of a single screen - a cell-based co-immunoprecipitation
      in HepG2, an in vitro co-immunoprecipitation, and a pull-down typed as a direct interaction with
      host recorded as In vitro - at MI-score 0.59, the highest of any of AFP's twenty-one interaction
      records. Glypican-3 is a heparan sulfate proteoglycan, so the informative term is available and
      bare protein binding understates what is known.
    action: MODIFY
    reason: 'Corrected after review. This row was first kept at bare GO:0005515 on the argument that because
      a glypican-3 mutant lacking heparan sulfate chains still precipitates AFP, the binding is to the
      core protein and a proteoglycan term would misdescribe it. That reasoning confused two different
      objects. GO:0043394 is defined as binding to a proteoglycan, that is to the glycoprotein itself,
      and GO has separate terms for binding the glycosaminoglycan moiety - GO:0008201 heparin binding
      and GO:1904399 heparan sulfate binding. Checked against QuickGO rather than inferred from the label.
      So the heparan-sulfate-free mutant result rules out a glycosaminoglycan-binding term while leaving
      GO:0043394 untouched: it shows the sugar chains are not required for the interaction, not that the
      partner is not a proteoglycan. Glypican-3 is a GPI-anchored heparan sulfate proteoglycan, and the
      cell-based co-immunoprecipitation and the membrane colocalisation were both done on the native,
      glycanated protein. The interaction itself is well supported and orthogonally validated: purified
      Fc-tagged AFP pulls down GPC3-His while failing to pull down MUC16-His as a negative control, which
      distinguishes this row sharply from the eight yeast two-hybrid partners in IntAct, all of them cytosolic
      or nuclear and so topologically inaccessible to a constitutively secreted protein. It remains non-core
      in substance - no downstream signalling, proliferation or migration consequence is measured anywhere
      in the paper, so no activity-level term is available - but MODIFY is the right action because a
      strictly more informative term does exist and the earlier objection to it does not hold.'
    supported_by:
    - reference_id: PMID:39822733
      supporting_text: The results show that AFP pulls down GPC3, but not MUC16, a control protein
    - reference_id: PMID:39822733
      supporting_text: suggesting that the GPC3 core protein might bind AFP
    - reference_id: PMID:39822733
      supporting_text: Our results indicate that the core protein of GPC3 is involved in binding with
        AFP.
    knowledge_gaps:
    - gap_statement: The AFP literature invokes a cell-surface AFP receptor, AFPR, repeatedly, but its
        molecular identity has never been established.
      gap_kind:
      - BIOLOGY
      status: OPEN
      significance: Glypican-3 is a validated, membrane-localised, directly binding partner of secreted
        AFP, which makes it a testable candidate for that receptor. Nothing in the present evidence establishes
        that it performs the role, and the AFP drug-delivery literature depends on the receptor existing.
    proposed_replacement_terms:
    - id: GO:0043394
      label: proteoglycan binding
- term:
    id: GO:0005737
