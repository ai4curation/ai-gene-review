- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952289
  qualifier: located_in
  review:
    summary: Correct but incidental. The Reactome reaction behind this row is FAM20C phosphorylates FAM20C
      substrates, which is annotated to the endoplasmic reticulum lumen compartment, and AFP is on the
      substrate list with real backing, because UniProt records six FAM20C phosphoserines on AFP at Ser-111,
      Ser-115, Ser-117, Ser-344, Ser-444 and Ser-445, each carrying ECO:0000269 to PMID:26091039. So the
      protein demonstrably is in the ER lumen. It is there because every secreted protein passes through
      it.
    action: KEEP_AS_NON_CORE
    reason: Retained because it is true and experimentally underpinned, and marked non-core because it
      is a biosynthetic transit compartment rather than a site of action. Alpha-fetoprotein has a cleaved
      signal peptide and is constitutively secreted; the ER lumen is where it is folded, disulfide-bonded,
      glycosylated at Asn251 and phosphorylated by FAM20C, not where it binds its ligands or encounters
      glypican-3. Distinguishing the two is the point of the non-core action here. No modification is
      proposed, because the term is already at the right granularity for what it describes, and a TAS
      to a Reactome reaction whose substrate assignment traces to an ECO:0000269-backed phosphosite set
      is a sounder provenance than most electronic routes on this gene.
