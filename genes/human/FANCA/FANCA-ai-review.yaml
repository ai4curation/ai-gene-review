      author-page Figure 1, 2, 3 and 5 captions were separately read. No figure pixels or supplementary
      Methods/figures were inspected. Fanca-null mouse Tregs have defective suppressive activity and altered
      Foxp3 target-gene output despite comparable measured numbers and Foxp3 expression. This is positive
      donor evidence for contextual immune functional maturation under the current broad differentiation
      definition, not a direct human assay, resolved precursor trajectory or direct FANCA–Foxp3 biochemical
      mechanism. Earlier failed full-text routes and selected author-page captures are preserved; the
      later genuine normal fetch contains the full main.'
suggested_questions:
- question: How are FANCA's assembly contacts, single-stranded DNA binding and annealing activity coordinated
    in native repair assemblies, and which separation-of-function variants distinguish ICL repair from
    SSA without changing protein abundance or partner assembly?
- question: Do the natural 1455-, 1424- and 297-residue products differ in expression, nuclear or cytoplasmic
    distribution, partner assembly and DNA-directed activity?
suggested_experiments:
- description: Compare sequence-verified human FANCA and separation-of-function variants at matched abundance
    in FA-core reconstitution, purified DNA-binding/annealing reactions and matched human ICL and SSA
    reporter assays. Quantify partner coassembly and FANCD2 monoubiquitination separately from DNA binding,
    annealed product formation and repair outcomes. Include RAD52 and FANCG perturbations without assuming
    that either substitutes for FANCA in every context.
  hypothesis: Distinct contacts or conformational requirements may separate assembly from annealing; retention
    of binding or monoubiquitination alone need not restore the annealing-dependent repair endpoint.
- description: Establish product-specific transcripts and proteins with isoform-discriminating measurements,
    then compare matched endogenous-level expression and rescue by the three sequence-verified natural
    products. Measure subcellular distribution, complex assembly and purified DNA-directed activities,
    controlling for protein stability and distinguishing engineered truncations from natural products.
  hypothesis: The terminal differences may alter expression, localization or assembly and DNA-directed
    function; activity and localization of the short product cannot be inferred from an antibody antigen
    absent from its sequence.
