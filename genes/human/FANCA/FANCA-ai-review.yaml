    annealing. Purified human FANCA directly binds single-stranded DNA and anneals complementary oligonucleotides
    and partially duplex substrates; it also performs strand exchange in defined reactions without added
    ATP. Mutants can retain DNA binding while losing annealing, so binding alone does not account for
    the reaction. Human U2OS knockout and complementation connect the annealing activity to the SSA reporter,
    including a D598N separation from FANCD2 monoubiquitination. The RAD52 comparison supports separable
    contributions in that tested system, not universal RAD52 independence or an assigned role in every
    homologous-recombination pathway. No ATPase, nuclease, invariant oligomeric assembly or equivalence
    of the three natural products is inferred.
