id: O15360
gene_symbol: FANCA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCA organizes protein interactions within the Fanconi anemia core complex, supporting its
  assembly and repair of DNA interstrand cross-links. It has nucleoplasmic and chromatin-associated pools,
  as well as cytoplasmic complexes. FANCA provides separable contacts for FANCG and FAAP20; ubiquitin
  transfer to FANCI–FANCD2 is performed by FANCL and UBE2T. FANCA also binds single-stranded DNA and promotes
  ATP-independent DNA annealing and strand exchange. Its annealing activity contributes to double-strand
  break repair via single-strand annealing in human cells and can be separated experimentally from FANCD2
  monoubiquitination. Biallelic pathogenic variants cause Fanconi anemia complementation group A, with
  chromosome instability and susceptibility to bone marrow failure and malignancy. The relative biological
  functions of the natural 1455-, 1424- and 297-residue products remain unresolved.
