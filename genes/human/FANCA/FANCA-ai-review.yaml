  review:
    summary: Retain a source-bounded role in double-strand break repair via single-strand annealing.
    action: NEW
    reason: PMID:30057198 combines purified human FANCA-mediated annealing/strand-exchange reactions with
      human U2OS SSA reporter knockdown, knockout and complementation assays. The biochemical experiments
      establish that FANCA itself performs annealing rather than merely being required for another enzyme’s
      reaction. Separation-of-function mutants, including the D598N comparison, distinguish the observed
      SSA role from FANCD2 monoubiquitination; RAD52 perturbation provides a comparator within the tested
      system. These results support GO:0045002 at that cellular and construct scope, without making all
      repair contexts RAD52-independent or assigning an ATPase or nuclease activity. The broad imported
      DNA-repair row is refined to the independently supported ICL and SSA roles; this inherited specific
      proposal preserves the SSA experimental context, rather than adding another biological function.
      ICL repair and SSA repair are mutually non-ancestral in the captured typed closure. The three natural
      FANCA products were not compared for functional equivalence.
    supported_by:
    - reference_id: PMID:30057198
      supporting_text: The SA and SE activities of FANCA directly explain its role in homology-directed
        DSB repair.
    - reference_id: PMID:30057198
      supporting_text: Our cell-based DSB repair assay further demonstrates that FANCA contributes to
        the repair of DNA double strand breaks independently of the FA pathway and RAD52 in human cells.
core_functions:
- description: Supplies a protein-organizing scaffold for assembly and functional integrity of the Fanconi
    anemia nuclear complex during interstrand cross-link repair. Human FANCA has separable FANCG- and
    FAAP20-associated contact regions, and restoring FAAP20 abundance in FANCA-deficient cells does not
    restore its coassociation with FANCG and FANCM. This supports coordinated assembly beyond partner
    stabilization alone, without establishing a purified ternary stoichiometry or a direct FANCA–FANCF
    interface. FANCA participates in nuclear and chromatin-associated repair assemblies; it is not the
    FANCL/UBE2T ubiquitin-transfer enzyme, and FAAP20's ubiquitin/Rev1 recognition is a distinct partner
    activity. Historical full-length and engineered-fragment assays do not establish equivalent function
    of all three natural FANCA products.
