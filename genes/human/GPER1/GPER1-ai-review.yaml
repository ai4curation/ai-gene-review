        is directly coupled to the receptor, indicating GPR30 is a G protein-coupled receptor (GPCR), and also increased
        adenylyl cyclase activity
    - reference_id: PMID:21149639
      supporting_text: We conclude that GPER1-mediated stimulation of cAMP production and β-arrestin2 recruitment
        occur in the PM.
    - reference_id: PMID:19931550
      supporting_text: croaker and human GPER have very similar estrogen binding characteristics, typical of estrogen
        membrane receptors, and activate the same estrogen signaling pathways via stimulatory G proteins (Gs) resulting
        in increased cAMP production
    - reference_id: Reactome:R-HSA-9036301
      supporting_text: Binding of E2 to GPER induces the exchange of GDP for GTP on the G alpha (s) heterotrimer
        G protein, activating it
    - reference_id: file:human/GPER1/GPER1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: G protein-coupled estrogen receptor that binds to 17-beta-estradiol (E2) with high affinity,
        leading to rapid and transient activation of numerous intracellular signaling pathways
