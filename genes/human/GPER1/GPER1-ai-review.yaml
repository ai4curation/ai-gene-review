      label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
    supported_by:
    - &id005
      reference_id: PMID:15705806
      supporting_text: Activating GPR30 by estrogen resulted in intracellular calcium mobilization and synthesis
        of phosphatidylinositol 3,4,5-trisphosphate in the nucleus
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0032962
      cause: OTHER
      confidence: PROBABLE
      explanation: PMID:15705806 (Revankar et al. 2005) reports GPR30-dependent synthesis of phosphatidylinositol
        3,4,5-trisphosphate (PIP3) in the nucleus. The annotation uses GO:0032962 positive regulation of inositol
        trisphosphate biosynthetic process, which refers to soluble IP3. Unless the full text also measured IP3,
        the term appears to confuse PIP3 with IP3; the PI3K output is already annotated as GO:0051897 from the same
        paper.
      supported_by:
      - *id005
- term:
