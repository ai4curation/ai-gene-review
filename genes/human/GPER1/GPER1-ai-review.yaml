suggested_questions:
- question: Is 17beta-estradiol the physiological agonist of GPER1, given that some groups (e.g. Otto et al. 2008)
    detect no specific estradiol binding or GPER1-dependent cAMP/calcium responses?
- question: Should GO:0030284 nuclear estrogen receptor activity on GPER orthologs (IDA, IBA from PTN002795969,
    and Ensembl projections) be systematically repointed to GO:0038054, and should GO:0030520 on the same PAINT
    node be changed to a receptor-neutral term?
- question: Does GPER1 genuinely localize to and act within the nucleus (chromatin association at the cyclin D1
    promoter), or do nuclear signals reflect nuclear-envelope membranes or antibody cross-reactivity?
- question: Which heterotrimeric G proteins (Gs versus Gi/o) does GPER1 couple to in native cells, and does this
    account for opposite effects on ERK/Akt in different cell types?
suggested_experiments:
- description: Radioligand and fluorescent-ligand binding with GPER1-null versus reconstituted cells (including
    purified receptor in nanodiscs) to settle whether estradiol binds GPER1 directly, with BRET-based G-protein
    activation sensors to define coupling specificity.
  experiment_type: binding assay / BRET G-protein activation
- description: Validate nuclear GPER1 claims with knockout-validated antibodies and epitope-tagged endogenous GPER1
    (CRISPR knock-in), combined with ChIP-qPCR at the cyclin D1 promoter in GPER1-knockout controls.
  experiment_type: imaging / ChIP
