  review:
    summary: GPER1 is in the ER, where its main steady-state pool resides.
    action: ACCEPT
    reason: Endoplasmic reticulum is a root organelle term, so under the organelle policy it is kept rather than
      modified to a sub-compartment. The evidence is whole-organelle co-localization, which cannot by itself separate
      ER membrane from lumen. The sub-compartment is added rather than substituted, and is already asserted in this
      review by the GO:0005789 endoplasmic reticulum membrane rows (EXP and IEA, accepted) and in core_functions.
      The ER is where GPER1 binds estrogen and signals in many cell types, so the row is core.
