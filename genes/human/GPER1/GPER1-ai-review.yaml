- term:
    id: GO:0002695
    label: negative regulation of leukocyte activation
  evidence_type: IDA
  original_reference_id: PMID:23285008
  qualifier: involved_in
  review:
    summary: The study measured endothelial adhesion-molecule expression, not leukocytes.
    action: MARK_AS_OVER_ANNOTATED
    reason: Chakrabarti & Davidge measured ICAM-1/VCAM-1 in HUVEC; no leukocyte activation was assayed. Reduced
      endothelial adhesion molecules might reduce leukocyte recruitment, but 'negative regulation of leukocyte activation'
      overstates the evidence. The finding is captured by negative regulation of inflammatory response.
    supported_by:
    - reference_id: PMID:23285008
      supporting_text: Treatment with the selective GPR30 agonist G-1 partially attenuated the TNF induced upregulation
        of pro-inflammatory proteins such as intercellular cell adhesion molecule-1 (ICAM-1) and vascular cell adhesion
        molecule-1 (VCAM-1).
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:20551055
  qualifier: enables
  review:
    summary: ChIP of GPR30 together with phosphorylated EGFR at the cyclin D1 promoter in CAFs.
    action: MARK_AS_OVER_ANNOTATED
    reason: GPER1 is a seven-transmembrane GPCR. Changes in target-gene transcription (c-fos, CTGF, cyclin D1) follow
      from ERK/EGFR signaling. Madeo & Maggiolini propose a nuclear GPER1/EGFR complex at the cyclin D1 promoter,
      but this has not been independently established, and a direct transcriptional role of a 7TM receptor is mechanistically
      unexplained. Terms that place GPER1 in transcription regulation are therefore over-annotations of an indirect
      signaling effect.
    supported_by:
    - reference_id: PMID:20551055
      supporting_text: E2 stimulates a physical interaction between GPR30 and phosphorylated EGFR, recruiting them
        to the cyclin D1 gene promoter
