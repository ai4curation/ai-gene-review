id: Q99527
gene_symbol: GPER1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPER1 (G protein-coupled estrogen receptor 1; formerly GPR30) is a class A rhodopsin-family seven-transmembrane
  receptor that binds 17beta-estradiol with nanomolar affinity and mediates rapid, non-genomic estrogen signaling,
  distinct from the nuclear estrogen receptors ESR1 and ESR2. Ligand binding activates heterotrimeric G proteins,
  stimulating adenylyl cyclase (Gs/cAMP), calcium mobilization and Src-dependent release of HB-EGF that transactivates
  EGFR, leading to PI3K/AKT and ERK1/2 activation. GPER1 is found at the plasma membrane, where it signals and recruits
  beta-arrestin2, and in the endoplasmic reticulum; it is constitutively endocytosed through clathrin-coated pits,
  traffics through Rab11 recycling endosomes to the trans-Golgi network and is degraded by the proteasome. Its C-terminal
  PDZ-binding motif engages scaffold proteins (DLG4/MAGUKs, NHERF1), and it associates with RAMP3. Through these
  signals GPER1 contributes to cardiovascular (vasodilation, cardioprotection, smooth muscle proliferation), metabolic
  (insulin secretion, adiposity), reproductive, immune and neural physiology, and to estrogen-driven growth of breast
  and other cancers. Whether estradiol is its physiological ligand has been debated, but binding and Gs coupling
  are conserved between human and teleost GPER.
