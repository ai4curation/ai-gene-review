  - UniProtKB:Q99527
  review:
    summary: PAINT IBA from node PANTHER:PTN002795969 (GPER subfamily of PTHR24226, GPR182/GPER1), with human GPER1
      and mouse Gper1 as descendant evidence; the node and the clade are correct (all members are GPER 7TM receptors),
      but the term propagated is the nuclear-receptor activity.
    action: MODIFY
    reason: GO:0030284 is defined as 'A nuclear receptor activity regulated by estrogen binding and modulating the
      transcription of specific gene sets transcribed by RNA polymerase II' and is_a GO:0003707 nuclear steroid
      receptor activity, under DNA-binding transcription factor activity (GO:0003700). GPER1 is a class A seven-transmembrane
      GPCR (Pfam 7tm_1, PROSITE G_PROTEIN_RECEP_F1) with no nuclear-receptor zinc-finger DNA-binding domain or nuclear-receptor
      ligand-binding domain, flagged by rule FRR:0009. The papers behind the experimental rows show estrogen binding
      coupled to heterotrimeric G-protein (Gs) activation, adenylyl cyclase stimulation and calcium mobilization,
      i.e. exactly the definition of GO:0038054 G protein-coupled estrogen receptor activity ('Combining with estrogen
      and transmitting the signal across the membrane by activating an associated G-protein'). Thomas et al. explicitly
      describe GPR30 as unrelated to nuclear estrogen receptors. The essence of the annotation (GPER1 is an estrogen
      receptor) is retained; the receptor class is wrong. Estradiol binding by GPER1 remains contested (Otto et
      al. 2008 found no specific binding), but the IUPHAR naming, independent binding data from two groups and conservation
      of binding in fish GPER support keeping the receptor activity at the GPCR term. The PANTHER node itself is
      appropriate (it contains only GPER orthologs, and GPER estrogen binding/Gs signaling is conserved to fish);
      the defect is the term choice, which was inherited from the experimental GO:0030284 annotations on human and
      mouse GPER. The IBD should be placed with GO:0038054 instead.
