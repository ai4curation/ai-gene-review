  review:
    summary: GPER1 binds 17beta-estradiol and signals through heterotrimeric G proteins (Gs/cAMP; also Gi/o-dependent
      Src/EGFR transactivation). This is the core molecular function.
    action: ACCEPT
    reason: Directly supported for human GPER1 by membrane binding plus Gs activation (Thomas et al. 2005), cAMP
      production and beta-arrestin2 recruitment at the plasma membrane (Sanden et al. 2011), conservation of estrogen
      binding and Gs signaling in fish GPER (Thomas et al. 2010), and Reactome curation. Binding has been disputed
      (Otto et al. 2008), noted as a suggested question, but the weight of evidence and IUPHAR nomenclature support
      the term.
