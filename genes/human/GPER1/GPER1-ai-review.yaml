- term:
    id: GO:0032962
    label: positive regulation of inositol trisphosphate biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:15705806
  qualifier: involved_in
  review:
    summary: Revankar et al. 2005 reported synthesis of phosphatidylinositol 3,4,5-trisphosphate (PIP3, a membrane
      lipid) in the nucleus after GPR30 activation; GO:0032962 concerns soluble inositol trisphosphate (IP3).
    action: MODIFY
    reason: The cached abstract explicitly describes PIP3, a product of PI3K, not inositol 1,4,5-trisphosphate.
      GO has no PIP3 biosynthesis regulation term, and the PI3K output is already captured from the same paper by
      GO:0051897 positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction. Full
      text was not available, so a source_defects entry asks the curators to check whether IP3 was in fact measured.
    proposed_replacement_terms:
