    reason: GPER1 is a seven-transmembrane GPCR. Changes in target-gene transcription (c-fos, CTGF, cyclin D1) follow
      from ERK/EGFR signaling. Madeo & Maggiolini propose a nuclear GPER1/EGFR complex at the cyclin D1 promoter,
      but this has not been independently established, and a direct transcriptional role of a 7TM receptor is mechanistically
      unexplained. Terms that place GPER1 in transcription regulation are therefore over-annotations of an indirect
      signaling effect.
    supported_by:
    - reference_id: PMID:20551055
      supporting_text: CAFs respond to physiologic concentrations of 17beta-estradiol (E2) by rapidly inducing extracellular
        signal-regulated kinase phosphorylation and immediate early gene expression, including c-fos and connective
        tissue growth factor, and cyclin D1
    - reference_id: PMID:20551055
      supporting_text: E2 stimulates a physical interaction between GPR30 and phosphorylated EGFR, recruiting them
        to the cyclin D1 gene promoter
