  review:
    summary: GPER1 is a GPCR that transduces estrogen signals through heterotrimeric G proteins.
    action: ACCEPT
    reason: Core process for a GPCR. GPER1 couples to Gs (cAMP) and, via Gbetagamma/Src, to EGFR transactivation,
      so the general GPCR signaling pathway term is appropriate across rows (IBA, IEA, TAS, IMP).
    supported_by:
    - reference_id: PMID:15539556
      supporting_text: E2 treatment of transfected cell membranes caused activation of a stimulatory G protein that
        is directly coupled to the receptor, indicating GPR30 is a G protein-coupled receptor (GPCR), and also increased
        adenylyl cyclase activity
    - reference_id: Reactome:R-HSA-9036301
      supporting_text: Binding of E2 to GPER induces the exchange of GDP for GTP on the G alpha (s) heterotrimer
        G protein, activating it
    - reference_id: file:human/GPER1/GPER1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Stimulates cAMP production, calcium mobilization and tyrosine kinase Src inducing the release
        of heparin-bound epidermal growth factor (HB-EGF) and subsequent transactivation of the epidermal growth
        factor receptor (EGFR), activating downstream signaling pathways such as PI3K/Akt and ERK/MAPK
