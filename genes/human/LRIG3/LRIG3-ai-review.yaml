core_functions:
- description: >-
    At the plasma membrane, LRIG3 acts as a signaling-receptor regulator in the
    LRIG/ERBB system. It associates with LRIG1 through extracellular regions, opposes
    LRIG1 negative regulatory activity, and stabilizes ERBB receptors. This is a
    receptor-modulating activity rather than autonomous receptor or enzymatic activity,
    and the endogenous stoichiometry and receptor spectrum remain unresolved.
  molecular_function:
    id: GO:0030545
    label: signaling receptor regulator activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23723069
    supporting_text: Lrig3 opposes Lrig1 negative regulatory
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- description: >-
    In mouse inner-ear development, Lrig3 and Ntn1 form cross-repressive expression
    domains that determine where the lateral canal pouch fuses. Lrig3 loss expands
    Ntn1, disrupts canal morphogenesis and causes circling behavior, while reducing
    Ntn1 dosage rescues the defect. ERBB association is experimentally separable from
    this process, and direct human developmental evidence is lacking.
  directly_involved_in:
  - id: GO:0048752
    label: semicircular canal morphogenesis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19004851
    supporting_text: Lrig3 is necessary
    reference_section_type: ABSTRACT
  - reference_id: PMID:20126551
    supporting_text: unlikely to contribute to Lrig3-dependent processes of inner ear morphogenesis.
    reference_section_type: ABSTRACT
knowledge_gaps:
- gap_statement: The endogenous human receptor partners, binding interfaces, and
    direction of LRIG3-mediated receptor regulation remain incompletely defined.
  boundary: Human-cell evidence supports LRIG1 cross-talk and ERBB stabilization, but
    does not establish a universal receptor set, obligate complex, or catalytic mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Resolving this mechanism is necessary to distinguish normal receptor
    regulation from tumor-cell-specific signaling behavior.
  resolution: Quantify endogenous LRIG3 complexes and receptor abundance, activation,
    trafficking, and degradation after LRIG3 perturbation and domain-resolved rescue.
  provenance:
  - reference_id: PMID:23723069
    supporting_text: Lrig3 opposes Lrig1 negative regulatory
- gap_statement: The extent to which the mouse Lrig3-Ntn1 inner-ear mechanism is conserved
    in human otic development is unknown.
  boundary: Mouse genetics strongly establishes lateral-canal morphogenesis, but no
    direct human developmental assay or LRIG3 disease mechanism is available.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Human conservation would connect the strongest normal developmental
    phenotype to LRIG3 biology without over-transferring auditory phenotypes of LRIG1/2.
  resolution: Test LRIG3 loss and rescue in human otic organoids with spatial NTN1,
    basement-membrane remodeling, and epithelial-fusion readouts.
  provenance:
  - reference_id: PMID:19004851
    supporting_text: Lrig3 is necessary
- gap_statement: The physiological source, protease, and normal target tissues of soluble
    LRIG3 are unresolved.
  boundary: Soluble LRIG3 and NETO2-dependent macrophage effects are demonstrated in
    glioma systems; ADAM17 abundance correlates with release but direct cleavage is not established.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Establishing release and target-cell specificity is essential before
    treating the glioma-derived ectodomain as a normal intercellular signal.
  resolution: Map endogenous LRIG3 cleavage sites and protease dependence, then compare
    soluble LRIG3 abundance and NETO2-dependent responses across normal and tumor tissues.
  provenance:
  - reference_id: PMID:36639372
    supporting_text: The expression or activity of ADAM17 in glioma cells
- gap_statement: The localization and functions of the two curated LRIG3 isoforms have
    not been compared.
  boundary: Isoform 2 replaces the canonical N-terminal 79 residues, but sequence
    difference alone does not establish altered topology, stability, trafficking, or function.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Isoform-specific processing could alter the extracellular architecture
    underlying receptor association or shedding.
  resolution: Express isoforms at matched endogenous levels and compare maturation,
    surface delivery, LRIG1/ERBB association, cleavage, and functional rescue.
proposed_new_terms: []
suggested_questions:
- question: Which endogenous ERBB or other receptor complexes contain LRIG3 in normal
    human tissues, and how does LRIG3 oppose LRIG1 within those complexes?
- question: Is the Lrig3-Ntn1 boundary mechanism conserved in human otic development,
    and what signal connects membrane LRIG3 to NTN1 transcription?
- question: Which protease generates soluble LRIG3 in vivo, and is NETO2 a physiological
    target outside the glioma microenvironment?
- question: Do the two curated LRIG3 isoforms differ in membrane delivery, receptor
    regulation, developmental rescue, or ectodomain release?
suggested_experiments:
- description: Endogenously tag LRIG3 in normal human epithelial and neural models;
    combine quantitative interactomics with receptor phosphorylation, surface turnover,
    and LRIG1 epistasis after acute LRIG3 depletion and rescue.
- description: Generate LRIG3-null human otic organoids and perform spatial transcriptomics,
    NTN1 imaging, basement-membrane analysis, and isoform-specific rescue during canal-like
    epithelial morphogenesis.
- description: Map soluble-LRIG3 termini by N-terminomics in patient-derived glioma and
    normal neural cultures, perturb candidate proteases including ADAM17, and test NETO2-dependent
    macrophage responses with cleavage-resistant rescue constructs.
- description: Compare the two curated LRIG3 isoforms using matched genomic knock-in
    constructs and measure maturation, plasma-membrane residence, vesicle localization,
    LRIG1/ERBB association, and ectodomain release.
