gene_symbol: LRIG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRIG3 is a type-I single-pass membrane protein with an extracellular region containing
  15 leucine-rich repeats and three immunoglobulin-like domains, followed by a long
  cytoplasmic tail. At the plasma membrane it associates with the LRIG/ERBB regulatory
  system: LRIG3 opposes LRIG1-mediated negative regulation and stabilizes ERBB receptors,
  although ERBB association does not explain every LRIG3-dependent developmental role.
  Mouse Lrig3 restricts Ntn1 expression to pattern the lateral semicircular canal, and
  Xenopus Lrig3 contextually modulates WNT and FGF signaling during neural-crest formation.
  In glioblastoma models, full-length and soluble LRIG3 suppress growth, invasion and
  angiogenesis through MET-PI3K-AKT-associated effects; glioma-derived soluble LRIG3
  also binds NETO2 on tumor-associated macrophages and limits M2-like polarization.
  These tumor and nonhuman developmental contexts do not establish a single universal
  LRIG3 pathway. Two curated isoforms differ at the N terminus, but their functions have
  not been compared directly.
