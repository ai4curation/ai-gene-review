    summary: >-
      Targeted co-immunoprecipitation shows LRIG3 in a stable complex with LRIG1, while
      functional experiments show that LRIG3 opposes LRIG1 and stabilizes ErbB
      receptors.
    action: MODIFY
    reason: >-
      Generic protein binding loses the experimentally demonstrated function. The
      paper supports LRIG3 as a signaling-receptor regulator: it associates with LRIG1
      through the ectodomains, restricts LRIG1 negative action, and increases ErbB
      receptor stability. GO:0030545 captures receptor modulation without claiming
      that LRIG3 is itself a receptor or that it enzymatically activates receptors.
      This activity is distinct from the negative receptor regulation characteristic
      of LRIG1 and from LRIG2's context-dependent behavior.
