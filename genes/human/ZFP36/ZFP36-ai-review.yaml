      decay
  evidence_type: IDA
  original_reference_id: PMID:23644599
  qualifier: involved_in
  review:
    summary: Accepted nuclear-transcribed mRNA catabolic process,
      deadenylation-dependent decay as core TTP-family mRNA decay biology.
    action: ACCEPT
    reason: nuclear-transcribed mRNA catabolic process, deadenylation-dependent
      decay is part of the conserved ZFP36 activity of binding AU-rich 3'-UTR
      elements and recruiting mRNA-decay machinery to promote deadenylation,
      decapping, P-body delivery, or 3'-UTR-mediated transcript destabilization.
    supported_by: &id002
    - &id010
