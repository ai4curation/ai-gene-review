- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029221
  - UniProtKB:P22893
  - ensembl:ENSMUSP00000057815
  review:
    summary: Marked MAPK cascade as stimulus or kinase-context over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence places ZFP36 downstream of MAPK/p38 regulation rather
      than as an executing kinase-cascade component, so the broad MAPK-cascade
      process overstates the TTP-family RNA-regulator role.
