core_functions:
- description: ZFP36 binds AU-rich 3'-UTR elements in short-lived mRNAs and acts
    as a protein-RNA sequence-specific adaptor that recruits deadenylation,
    decapping, exosome, and 5'-to-3' decay factors, thereby promoting cytosolic
    3'-UTR-mediated mRNA destabilization.
  molecular_function:
    id: GO:0035925
    label: mRNA 3'-UTR AU-rich region binding
  directly_involved_in:
  - id: GO:0061158
    label: 3'-UTR-mediated mRNA destabilization
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0000932
    label: P-body
  supported_by:
