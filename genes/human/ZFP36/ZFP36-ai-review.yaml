id: P26651
gene_symbol: ZFP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ZFP36 encodes tristetraprolin, the prototype human TTP-family tandem
  CCCH zinc-finger RNA-binding protein. ZFP36 binds AU-rich elements in target mRNA
  3''-UTRs and recruits cytoplasmic mRNA-decay enzymes, including CCR4-NOT, decapping,
  exosome, and XRN1 factors, to promote deadenylation, decapping, P-body delivery,
  and rapid decay of inflammatory and other short-lived transcripts.'
