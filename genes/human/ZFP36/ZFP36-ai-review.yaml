- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P22893
  - ensembl:ENSMUSP00000057815
  review:
    summary: Removed transcription-regulation row.
    action: REMOVE
    reason: ZFP36 is an AU-rich-element RNA-binding mRNA decay factor, and
      PMID:21784977 identified CCL3 mRNA as a direct ZFP36/TTP target. The cited
      biology is post-transcriptional target-mRNA destabilization rather than
      regulation of RNA polymerase II transcription.
    supported_by: &id001
    - reference_id: PMID:21784977
      supporting_text: we have identified CCL3 mRNA as the most abundantly bound
        TTP target mRNA
