suggested_questions:
- question: Which endogenous ARE-containing transcripts are direct ZFP36 targets
    in each human inflammatory cell state, and which decay route dominates for
    each target?
  experts: []
suggested_experiments:
- description: Combine endogenous ZFP36 CLIP-seq, nascent transcription
    controls, and acute degron-mediated ZFP36 depletion in primary human
    macrophages to assign direct destabilized transcripts and decay routes after
    LPS stimulation.
  experiment_type: CLIP-seq plus acute protein depletion
