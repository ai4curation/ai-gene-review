- term:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002648882
  - WB:WBGene00003864
  - WB:WBGene00003865
  review:
    summary: Kept translation-repressor PAINT transfer as non-core conserved
      TTP-family activity.
    action: KEEP_AS_NON_CORE
    reason: The PTN002648882 row transfers mRNA regulatory element binding
      translation repressor activity from the Eumetazoa node to human ZFP36,
      which is inside that clade, and human TTP-family evidence independently
      supports ARE-mRNA translational silencing. The activity is a conserved
      output of the core ARE-binding decay adaptor mechanism rather than a
      separate core function for ZFP36.
    supported_by:
    - reference_id: file:interpro/panther/PTHR12547/PTHR12547-paint.tsv
      supporting_text: "PTHR12547\tPTN002648882\tGO:0000900\tF\tIBD\tfalse\tWB:WBGene00003864|WB:WBGene00003865\t\
        taxon:6072\t20250819"
    - reference_id: PMID:17369404
      supporting_text: TTP and BRF-1 deliver ARE-mRNAs to processing bodies
        (PBs), cytoplasmic assemblies of mRNAs, and associated factors that
        promote translational silencing and mRNA decay
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002648882
        source_status: SUPPORTS_TRANSFER
        comment: The row is placed at the Eumetazoa PTN002648882 node, so the
          human TTP-family paralogs are inside the transfer clade; the worm IBD
          seeds are compatible with a conserved translation-repression output.
