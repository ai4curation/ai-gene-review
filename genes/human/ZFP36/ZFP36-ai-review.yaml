      supporting_text: TTP can bind directly to the AU-rich element (ARE) in
        TNF-alpha mRNA
    - &id011
      reference_id: PMID:12748283
      supporting_text: TTP and its related proteins stimulated the deadenylation
        of ARE-containing, polyadenylated transcripts
    - &id012
      reference_id: PMID:15687258
      supporting_text: TTP protein family functions as a molecular link between
        ARE-containing mRNAs and the mRNA decay machinery by recruitment of mRNA
        decay enzymes
