    consequences are unresolved.
- name: '8'
  id: O75140-8
  sequence_note: VSP_014936, VSP_014938
  description: 1503-residue product lacking reference residues 624–701 and 1089–1110. The DEP-domain sequence
    is retained; distinct activity is not established.
- name: '9'
  id: O75140-9
  sequence_note: VSP_014937
  description: 1594-residue product replacing reference residues 724–733 with one methionine. The DEP-domain
    sequence is retained; distinct activity is not established.
- name: '1'
  id: O75140-1
  sequence_note: VSP_014937, VSP_014938
  description: 1572-residue product with the same 724–733 replacement as product 9 and deletion of reference
    residues 1089–1110. The DEP-domain sequence is retained; historical isoform names do not establish
    product-specific activity.
