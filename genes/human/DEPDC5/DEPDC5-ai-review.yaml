      read; separate Methods/SI and figure pixels not inspected. Human HEK293T co-IP separates DEPDC5/NPRL2/NPRL3
      GATOR1 from GATOR2; tagged DEPDC5 associates with RagA/C and localizes to the lysosomal surface.
      DEPDC5 depletion prevents amino-acid-dependent mTORC1 shutoff. Purified GATOR1 accelerates RagA/B
      GTP hydrolysis, without GDP-release stimulation in the tested assay. These experiments establish
      complex-level GAP activity, not autonomous DEPDC5 catalysis. Fly perturbations are distinguished
      from human-cell data.
