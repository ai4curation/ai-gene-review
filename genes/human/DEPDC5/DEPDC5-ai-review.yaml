id: O75140
gene_symbol: DEPDC5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DEPDC5 is the large regulatory subunit of GATOR1, a complex that suppresses mTORC1 signaling
  during amino acid deprivation. At the lysosomal surface, DEPDC5 organizes the NPRL2–NPRL3 module and
  contacts Rag GTPases in distinct binding states. It helps coordinate substrate engagement and Rag nucleotide
  loading, while NPRL2 provides the catalytic arginine finger for GTP hydrolysis. KICSTOR recruits GATOR1
  to lysosomes, enabling nutrient signals to control this growth-regulatory pathway.
alternative_products:
- name: '10'
  id: O75140-10
  description: Displayed 1603-residue product with the annotated DEP domain at residues 1187–1262. It
    provides the reference sequence for structural feature coordinates.
- name: '2'
  id: O75140-2
  sequence_note: VSP_014933, VSP_014934
  description: 559-residue product with an altered terminal segment and loss of reference residues 560–1603,
    including the DEP domain. It is the exact product in the eight HuRI interaction annotations; those
    assays do not establish its GATOR1 function.
- name: '4'
  id: O75140-4
  sequence_note: VSP_014938
  description: 1581-residue product lacking reference residues 1089–1110; the annotated DEP-domain sequence
    is retained. Distinct functional effects are not established.
- name: '5'
  id: O75140-5
  sequence_note: VSP_014941
  description: 1552-residue product with a replaced C-terminal segment beginning at reference residue
    1460. The DEP-domain sequence is retained; its functional effect is unresolved.
- name: '6'
  id: O75140-6
  sequence_note: VSP_014936, VSP_014939, VSP_014940
  description: 1229-residue product lacking reference residues 624–701, with an altered segment beginning
