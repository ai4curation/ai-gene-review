- id: PMID:23723238
  title: A Tumor suppressor complex with GAP activity for the Rag GTPases that signal amino acid sufficiency
    to mTORC1.
  findings:
  - statement: Human HEK293T co-IP separates DEPDC5/NPRL2/NPRL3 GATOR1 from GATOR2; tagged DEPDC5 associates
      with RagA/C and localizes to the lysosomal surface. DEPDC5 depletion prevents amino-acid-dependent
      mTORC1 shutoff. Purified GATOR1 accelerates RagA/B GTP hydrolysis, without GDP-release stimulation
      in the tested assay. These experiments establish complex-level GAP activity, not autonomous DEPDC5
      catalysis. Fly perturbations are distinguished from human-cell data.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
