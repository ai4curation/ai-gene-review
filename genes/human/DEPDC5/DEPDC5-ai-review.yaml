- id: PMID:28199306
  title: KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1.
  findings:
  - statement: Endogenous-level FLAG-DEPDC5 identifies KICSTOR. Endogenous complex co-IP, imaging of tagged
      GATOR1 components and purified lysosomes show that KICSTOR recruits GATOR1 to lysosomes. KICSTOR
      loss disperses GATOR1 and weakens Rag/GATOR2 association. Several localization assays use NPRL2
      as the GATOR1 marker rather than imaging DEPDC5 directly; whole-complex inference and the independent2013
      DEPDC5 localization support the location. Amino-acid-insensitive recruitment does not imply inactive
      GATOR1 in all conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independently reviewed original. Selected original XML Results, Methods and controls
      read; no figure-pixel or whole-SI claim. Endogenous-level FLAG-DEPDC5 identifies KICSTOR. Endogenous
      complex co-IP, imaging of tagged GATOR1 components and purified lysosomes show that KICSTOR recruits
      GATOR1 to lysosomes. KICSTOR loss disperses GATOR1 and weakens Rag/GATOR2 association. Several localization
      assays use NPRL2 as the GATOR1 marker rather than imaging DEPDC5 directly; whole-complex inference
      and the independent 2013 DEPDC5 localization support the location. Amino-acid-insensitive recruitment
      does not imply inactive GATOR1 in all conditions.
- id: PMID:29590090
  title: Architecture of the human GATOR1 and GATOR1-Rag GTPases complexes.
  findings:
  - statement: Human GATOR1 structures and biochemical assays identify DEPDC5 interfaces for NPRL2 and
      RagA. DEPDC5 alone has no measured GAP activity; NPRL2/NPRL3 performs it at higher concentrations.
      Mutating the RagA-contacting critical strip increases GAP kinetics, showing that this binding state
      restrains the catalytic module. DEPDC5 assembly mutants fail to restore amino-acid regulation in
      knockout cells. Engineered 1–720 truncations and point mutants are not natural short isoforms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independently reviewed original. Original Results and selected figure/extended-data
      captions read, including purification overview; separate Methods/SI and image pixels not inspected.
      Human GATOR1 structures and biochemical assays identify DEPDC5 interfaces for NPRL2 and RagA. DEPDC5
      alone has no measured GAP activity; NPRL2/NPRL3 performs it at higher concentrations. Mutating the
      RagA-contacting critical strip increases GAP kinetics, showing that this binding state restrains
      the catalytic module. DEPDC5 assembly mutants fail to restore amino-acid regulation in knockout
      cells. Engineered 1–720 truncations and point mutants are not natural short isoforms. The SAMTOR
      co-IP establishes association, but this paper does not establish the methionine-dependent direction
      stated in the UniProt SUBUNIT note; the separate SAMTOR study is discussed in the source guide.
