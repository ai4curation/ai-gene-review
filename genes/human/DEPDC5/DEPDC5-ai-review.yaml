- id: PMID:29123071
  title: SAMTOR is an S-adenosylmethionine sensor for the mTORC1 pathway.
  full_text_unavailable: false
  findings:
  - statement: Methionine starvation strengthens SAMTOR association with GATOR1/KICSTOR, whereas restoring
      methionine or SAM weakens this interaction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The primary original Results and Figures 1, 3 and 4 were read. Endogenously tagged DEPDC5
      co-IP in human HEK293T cells and ligand-addition experiments establish regulation of the SAMTOR–GATOR1/KICSTOR
      interaction. Methionine starvation lowers SAM and increases the interaction; readdition reverses
      it. SAMTOR is the metabolite sensor. This supplies regulatory context, not direct ligand sensing
      or a new catalytic activity of DEPDC5. Separate supplementary Methods and figure pixels were not
      inspected.
core_functions:
- description: DEPDC5 binds Rag GTPases and organizes their engagement with GATOR1 at the lysosomal surface.
    Its contacts with RagA regulate access to the catalytic module, while an auxiliary RagC interface
    helps coordinate nucleotide loading. DEPDC5 contributes to the complex's GAP activity and amino-acid-dependent
    suppression of mTORC1; NPRL2 supplies the catalytic arginine finger.
