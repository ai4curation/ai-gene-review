suggested_questions:
- question: What switches GATOR1 between inhibitory and catalytic Rag-binding states at the lysosomal
    membrane? The spatial model does not establish this trigger.
- question: Which naturally occurring DEPDC5 products preserve GATOR1 assembly, Rag engagement and nutrient
    regulation? Short-product interaction evidence alone does not establish full-length function.
- question: Does endogenous, untagged DEPDC5 undergo KLHL22-dependent degradation after amino-acid refeeding
    across independently validated detection methods?
