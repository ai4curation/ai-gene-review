core_functions:
- molecular_function:
    id: GO:0045296
    label: cadherin binding
  description: Binds extracellular cadherin partners through calcium-stabilized repeats. CDH23-PCDH15
    links connect stereocilia within a sensory hair bundle and transmit mechanical force, whereas separate
    homophilic contacts can mediate adhesion between cells. These are distinct contact contexts of the
    same broad cadherin-binding activity.
  directly_involved_in:
