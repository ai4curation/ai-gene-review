- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Retain the inherited neuron-projection-development role as a secondary, phylogenetically inferred process.
    action: KEEP_AS_NON_CORE
    reason: PTHR24026 places this process at PTN004649584. CDH23 is a multidomain adhesion protein with multiple isoforms and expression outside hair cells. The reviewed sources do not demonstrate loss of the inherited developmental function. Lack of a target-neuron experiment and predominance of the hair-bundle literature are not sufficient grounds to reject the IBD. The specific human neuronal mechanism remains unresolved after the focused report. The report's zebrafish retinal morphology and optokinetic results are limited to those assays and do not establish loss of every human neuron-projection role; its lack-of-target-experiment objection does not overturn the IBD.
    supported_by:
    - reference_id: file:interpro/panther/PTHR24026/PTHR24026-paint.tsv
