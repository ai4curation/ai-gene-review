    label: cadherin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: CDH23 binds cadherin partners through its extracellular adhesion domains.
    action: ACCEPT
    reason: The PTN008601603 inference is consistent with the established CDH23-PCDH15 tip-link partnership and with homophilic ectodomain interactions. PMID:31729176 uses mouse EC1-2 constructs and human A549-cell adhesion, with conserved interacting residues; this is ortholog biochemical support rather than a purified-human-ectodomain assay. Harmonin binding is a separate intracellular PDZ-domain interaction, not itself cadherin binding.
