    label: beta-catenin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The inherited beta-catenin-binding assertion remains unresolved despite a distinct harmonin
      linkage and junctional colocalization.
    action: UNDECIDED
    reason: 'The PAINT IBD is at PTN008601603. PMID:12485990 Discussion reports absent classical R1/R2
      beta-catenin-binding motifs and establishes a separate harmonin interface; its statement about absent
      catenins is limited to developing hair bundles and unpublished observations. PMID:22413011 uses
      beta-catenin as a junction marker, while PMID:30747484 Results section 3.1/Fig. 1 explicitly reports
      CDH23/beta-catenin colocalization in native human A549 contacts. Its Discussion proposes MAGI-1
      as a possible bridge, without a demonstrated CDH23-beta-catenin binding assay. Thus the targeted
      human MF remains unresolved: colocalization does not establish it, but motif divergence and another
      binding partner do not prove universal loss. The preserved OpenScientist report incorrectly denies
      the catenin passage; it cannot close this evidence gap.'
