  review:
    summary: CDH23 binds the PDZ2 domain of harmonin through its cytoplasmic region.
    action: MODIFY
    reason: PMID:22879593 was read in the authentic author manuscript at Protein Preparation and Results/Figs.
      4-6, and the normal cache refresh has now independently recovered the complete PMC3460447 text.
      It tests human CDH23 cytoplasmic tails with or without exon68 and human harmonin-a. PBM deletion/NTD-site
      perturbations and binding/assembly measurements distinguish the C-terminal PDZ-binding motif from
      the two NTD-binding sites; the PDZ interface is further resolved by the human-CDH23-tail/isolated
      mouse-harmonin-PDZ2 assay in PMID:12485990 Fig. 6. Retain the supported PDZ-domain-binding refinement
      for this interface. Do not relabel the exon68/NTD interface or self-association as PDZ binding,
      or call the recombinant assembly an in-vivo measurement of anchorage strength.
