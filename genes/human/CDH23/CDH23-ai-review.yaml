- term:
    id: GO:0045494
    label: photoreceptor cell maintenance
  evidence_type: IMP
  original_reference_id: PMID:16679490
  qualifier: involved_in
  review:
    summary: The Usher syndrome cohort supports CDH23 contributions to auditory, vestibular and retinal function.
    action: KEEP_AS_NON_CORE
    reason: PMID:16679490 directly sequences CDH23 among the five USH1 genes and identifies pathogenic genotypes in patients selected for the combined deafness, vestibular dysfunction and retinal-degeneration phenotype. Retain the sensory annotation from this curated human genetic evidence. Hearing and balance fit the established sensory-hair-cell adhesion mechanism; the retinal phenotypes remain secondary roles here, with their exact cellular mechanism less resolved.
    supported_by:
    - reference_id: PMID:16679490
      supporting_text: Mutations found in CDH23 , PCDH15 , and USH1C were overwhelmingly truncation mutations.
    - reference_id: PMID:16679490
      supporting_text: vestibular dysfunction, and retinal degeneration.
