- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:22879593
  qualifier: enables
  review:
    summary: Exon68-dependent self-association of the CDH23 cytoplasmic tail supports anchoring-assembly
      formation.
    action: ACCEPT
    reason: PMID:22879593 author-manuscript Protein Preparation and Results/Fig. 4 test human CDH23 cytoplasmic
      tails. Analytical ultracentrifugation resolves the +exon68 tail as a dimer and the -exon68 tail
      as a monomer. The isolated GB1-exon68 construct instead forms nonspecific aggregates; flanking tail
      sequences help stabilize the dimer. Thus the supported assertion is exon68-dependent self-association
      of the tested tail, not stable homodimerization by the isolated peptide or every splice product.
      Results/Figs. 5-6 show that these contacts promote multivalent CDH23/harmonin assembly, a mechanistically
      relevant part of the sensory anchoring apparatus.
    supported_by:
    - reference_id: PMID:22879593
      supporting_text: exon68 can induce dimer formation of the cadherin23 cytoplasmic tail
    - reference_id: PMID:22879593
      supporting_text: The GB1-exon68 protein forms nonspecific aggregates
- term:
    id: GO:0006816
    label: calcium ion transport
  evidence_type: IMP
  original_reference_id: PMID:17234811
  qualifier: involved_in
  review:
    summary: The calcium-process annotation needs separation of mechanical channel coupling from calcium-pump
      assays.
    action: UNDECIDED
    reason: The full PMID:17234811 Results, Discussion and Methods were re-read. CDH23 T1999S is a segregating
      family variant discussed as a hearing-loss modifier and previously reported polymorphism; the healthy
      father and brother also carry it. The calcium-clearance experiments test PMCA2 splice variants/G283S/G293S
      in CHO cells, while hair-cell calcium imaging and mechanotransduction-current measurements compare
      PMCA2-mutant/knockout mice. No CDH23-specific calcium-handling assay is established by those experiments,
      and the paper leaves an effect of the CDH23-harmonin-myosin complex on PMCA2 open. A tip-link protein
      can nevertheless participate structurally in channel gating without being a pump. Preserve UNDECIDED
      for this precise source-linked process; neither pump-activity exclusion nor the broader hearing
      phenotype settles it.
    supported_by:
    - reference_id: PMID:17234811
      supporting_text: Whether the tripolar complex has any role in the function of PMCA2 is an open question.
