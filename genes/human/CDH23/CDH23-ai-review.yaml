- term:
    id: GO:0098609
    label: cell-cell adhesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: CDH23 contributes directly to adhesive contacts between cells as well as to stereociliary
      links.
    action: ACCEPT
    reason: CDH23 inhibitory antibody and CDH23-directed RNAi reduce homotypic MCF-7 adhesion and MCF-7/fibroblast
      aggregation in PMID:22413011 Results/Fig. 3. These are genuine contacts between human cells, distinct
      from links between stereocilia of one hair cell. PMID:30747484 independently measures endogenous
      CDH23 silencing, aggregation and transwell migration in human HEK293T cells. Mouse EC1-2 homodimer
      biophysics and adhesion of native-CDH23-expressing human A549 cells in PMID:31729176 provide complementary
      molecular support; the purified construct is not human. This evidence supports the existing adhesion
      assertion without assigning a metastatic signaling activity.
    supported_by:
    - reference_id: PMID:22413011
    - reference_id: PMID:30747484
    - reference_id: PMID:31729176
