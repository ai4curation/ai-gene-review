- molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  description: Binds harmonin PDZ domains through the CDH23 cytoplasmic tail, contributing to sensory
    stereociliary anchoring assemblies. The directly resolved PDZ2 interaction is separate from harmonin
    N-terminal-domain recognition and exon68-dependent CDH23 self-association; harmonin supplies the actin-binding
    activity.
  locations:
  - id: GO:0032420
    label: stereocilium
  supported_by:
  - reference_id: PMID:12485990
    supporting_text: harmonin, via its PDZ2 domain, binds to cadherin 23.
  - reference_id: PMID:22879593
