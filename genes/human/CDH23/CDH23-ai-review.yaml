- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:22879593
  qualifier: enables
  review:
    summary: CDH23 binds the PDZ2 domain of harmonin through its cytoplasmic region.
    action: MODIFY
    reason: The original interaction studies support a more informative molecular function than generic protein binding. PMID:12485990 directly tests isolated harmonin PDZ domains in binding assays, and PMID:22879593 describes the C-terminal PDZ-binding motif within multivalent CDH23-harmonin assemblies. Use PDZ domain binding for this specific interface; other N-terminal-domain interactions and self-association are not being relabeled as PDZ binding.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:12485990
      supporting_text: Both the PDZ1–PDZ2 peptide (amino acids 138–403) of harmonin and the PDZ2 domain alone (amino acids 189–307) bound to the cadherin 23 cytodomain, whereas binding was not observed with either PDZ1 or PDZ3
    - reference_id: PMID:22879593
      supporting_text: 'the NTD-binding motif, the

        exon68 peptide, and the C-terminal PDZ binding motif'
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:22879593
  qualifier: enables
  review:
    summary: Self-association of CDH23 contributes to adhesive and anchoring assemblies.
    action: ACCEPT
    reason: PMID:22879593 explicitly reports homodimerization of the exon68-encoded cytoplasmic peptide and its contribution to CDH23-harmonin polymer formation. This is functionally relevant to the stereociliary anchoring apparatus, rather than incidental binding. The result is construct/isoform dependent; retain the original source fields without implying that every splice isoform contains exon68.
    supported_by:
    - reference_id: PMID:22879593
      supporting_text: 'The exon68 peptide can promote the

        cadherin23/harmonin polymer formation via either binding to harmonin NTD or

        self-dimerization.'
- term:
    id: GO:0006816
    label: calcium ion transport
  evidence_type: IMP
  original_reference_id: PMID:17234811
  qualifier: involved_in
  review:
    summary: The calcium-process annotation needs separation of mechanical channel coupling from calcium-pump assays.
    action: UNDECIDED
    reason: PMID:17234811 studies CDH23 genetic variation in a family with PMCA2-associated deafness, but its calcium-clearance and current assays test PMCA2 variants and PMCA2-mutant mice. The paper explicitly leaves CDH23-harmonin involvement in PMCA2 function open. CDH23 need not itself be a pump to participate structurally in calcium entry through mechanotransduction, so the previous categorical exclusion on that basis was invalid. The cited IMP process and broader mechanotransduction evidence require adjudication before accepting or rejecting this precise calcium claim. The focused report correctly assigns the pump assays to PMCA2 but again treats absence of pump activity as excluding structural participation in a transport process. It does not resolve the specific IMP source claim, so human follow-up remains necessary.
    supported_by:
    - reference_id: PMID:17234811
      supporting_text: Whether the tripolar complex has any role in the function of PMCA2 is an open question.
    - reference_id: file:human/CDH23/CDH23-hypotheses/catenin-neuronal-and-calcium-process-scope/openscientist.md
      supporting_text: Neither the entry (MET channel) nor the export (PMCA2) route is CDH23.
