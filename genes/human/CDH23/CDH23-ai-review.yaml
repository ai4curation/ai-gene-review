id: Q9H251
gene_symbol: CDH23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDH23 encodes cadherin-23, a large calcium-dependent adhesion protein with multiple splice
  isoforms. In sensory hair cells, its extracellular region contributes to the upper part of stereociliary
  tip links and its cytoplasmic tail binds harmonin, supporting hair-bundle organization and mechanotransduction.
  CDH23 can also form homophilic adhesive contacts; experiments in human epithelial cell lines link its
  expression to cell aggregation and migration behavior. Pathogenic variants cause nonsyndromic hearing
  loss or Usher syndrome with auditory, vestibular and retinal involvement.
