existing_annotations:
- term:
    id: GO:0098609
    label: cell-cell adhesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: CDH23 contributes directly to adhesive contacts between cells as well as to stereociliary links.
    action: ACCEPT
    reason: Human MCF-7 cell adhesion is reduced by CDH23 inhibitory antibody and RNAi (PMID:22413011); human HEK293T perturbations independently support an aggregation function (PMID:30747484). Thus cell-cell adhesion is not justified solely by tip links between stereocilia of one cell. Calcium-dependent extracellular homophilic binding is supported by ortholog ectodomain experiments (PMID:31729176). The IBA at PTN008601603 in PTHR24026 is compatible with these target-cell findings.
    supported_by:
    - reference_id: PMID:22413011
      supporting_text: RNAi treatment significantly reduced the ability of MCF-7 cells to participate in homotypic adhesion.
    - reference_id: PMID:31729176
      supporting_text: supporting that EC1‐2 domains of Cdh23 are enough to mediate the Ca2+‐dependent cell–cell adhesion.
- term:
    id: GO:0016477
    label: cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: CDH23-mediated adhesion contributes to cell migration behavior in human cultured cells.
    action: KEEP_AS_NON_CORE
    reason: 'The cell-migration IBD is at PTN008601603 in PTHR24026. PMID:30747484 directly tests CDH23 expression and silencing in human HEK293T cells: silencing decreases aggregation and increases transwell migration. Its adhesive activity supplies a physical contribution to the migratory context. Retain this inherited process as a secondary role; the prominent sensory tip-link function does not establish loss of migration-related function.'
    supported_by:
    - reference_id: PMID:30747484
      supporting_text: Overall, the transwell assay and hanging‐drop assay jointly indicated that silencing of Cdh23 expression resulted in decreased cell aggregation and enhanced cell migration.
- term:
    id: GO:0008013
    label: beta-catenin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Classical catenin-binding motifs are absent, but the scope of the inherited catenin interaction remains unresolved.
    action: UNDECIDED
    reason: The relevant IBD is at PTN008601603 in PTHR24026. PMID:12485990 reports absence of consensus R1/R2 beta-catenin-binding sites and an alternative harmonin linkage; its absence-of-catenin observation is limited to growing hair bundles and is described as unpublished. PMID:30747484 and PMID:22413011 instead show CDH23 at beta-catenin-positive human cell contacts. Colocalization does not establish direct binding or membership of a catenin complex, but sensory specialization and motif differences alone do not adjudicate every isoform or tissue. Leave the distinct molecular-function and complex-membership assertions unresolved after the focused review. The OpenScientist report incorrectly states that PMID:30747484 never mentions catenin; its full text expressly reports colocalization and proposes MAGI-1 as a possible bridge. This is not direct binding evidence, but it prevents adopting the report's categorical exclusion. Direct binding and indirect complex membership remain separate human follow-up questions.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN008601603
        source_label: PTN008601603
        source_status: UNRESOLVED
        comment: Classical motif loss is a mechanistic concern; target-cell colocalization supplies context but not a direct interaction assay. Ancestral interaction and complex membership require separate adjudication.
    supported_by:
    - reference_id: PMID:12485990
      supporting_text: cadherin 23 lacks the consensus R1 and R2 binding sites for β-catenin
    - reference_id: PMID:30747484
      supporting_text: We observed distinct puncta at the cell–cell boundaries that were co‐localized with β‐catenin
