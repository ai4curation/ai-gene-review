id: P55011
gene_symbol: SLC12A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC12A2 encodes NKCC1 (Na-K-2Cl cotransporter 1), an electroneutral secondary-active cation-chloride
  cotransporter of the SLC12 family that imports one Na+, one K+ and two Cl- ions across the plasma membrane
  using the inwardly directed Na+ gradient established by the Na/K-ATPase. It is a homodimeric multi-pass
  membrane protein with 12 transmembrane helices and large cytoplasmic N- and C-terminal domains, and
  is inhibited by the loop diuretics bumetanide and furosemide. Transport activity is switched on by phosphorylation
  of N-terminal threonines by the SPAK (STK39) and OSR1 (OXSR1) kinases acting downstream of WNK kinases.
  NKCC1 is broadly expressed and in epithelia resides mainly on the basolateral membrane, where it mediates
  the ion-uptake step for transepithelial salt and fluid secretion; in the inner ear it is essential for
  endolymph K+ secretion. By accumulating chloride it sets the intracellular Cl- concentration, which
  in immature neurons renders GABA-A signaling depolarizing, and it drives regulatory volume increase
  and cell-volume homeostasis. Loss-of-function variants cause sensorineural deafness (DFNA78) and the
  multisystem Kilquist and Delpire-McNeill syndromes.
