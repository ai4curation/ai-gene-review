    supported_by:
    - reference_id: PMID:12946942
      supporting_text: "Similar anomalous behavior was also observed for inhibition of\n        bumetanide-sensitive\
        \ 36Cl- uptake, e.g., Na+-K+-2Cl- -cotransporter (NKCC-1)."
