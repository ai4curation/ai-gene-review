proposed_new_terms: []
suggested_questions:
- question: In which human epithelia is NKCC1 apically rather than basolaterally localized, and what trafficking
    determinants (e.g. phosphorylation, scaffold interactions) specify its polarity?
- question: Is NH4+ transport by NKCC1 physiologically significant in vivo, or primarily an in vitro manifestation
    of K+-site promiscuity?
suggested_experiments:
- description: Quantify endogenous NKCC1-mediated NH4+ flux versus K+ flux in polarized epithelia using
    isotopic (14C-methylammonium / 86Rb) uptake with bumetanide controls, to establish the in vivo relevance
    of ammonium transport.
- description: Define NKCC1 membrane polarity determinants by domain swapping and phosphosite mutagenesis
    in polarized epithelial models (e.g. choroid plexus vs colonic crypt), tracking apical versus basolateral
    targeting.
