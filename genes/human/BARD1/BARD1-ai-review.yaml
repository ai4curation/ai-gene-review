- id: PMID:34321665
  title: Mechanisms of BRCA1-BARD1 nucleosome recognition and ubiquitylation.
  findings:
  - statement: Structural, binding and ubiquitination experiments establish BARD1 nucleosome recognition
      and positioning of the BRCA1–BARD1 ligase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed/PMC identity verified, DOI10.1038/s41586-021-03716-8, PMC8680157. Read
      the full Introduction, Results and Discussion and selected production, nucleosome, ubiquitination
      and fluorescence-polarization Methods. Recombinant human sequences include engineered RING fusion,
      isolated domains and near-full-length BARD1; these are not equivalent to all alternative products.
      The author correction adds a citation/sentence. Figure pixels and all supplementary material were
      not inspected.
- id: PMID:28976962
  title: BRCA1-BARD1 promotes RAD51-mediated homologous DNA pairing.
  findings:
  - statement: Purified BRCA1–BARD1 stimulates RAD51-mediated synaptic complex and DNA-joint formation;
      BARD1 contact mutants distinguish RAD51 stimulation from DNA binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed/PMC identity verified, DOI10.1038/nature24060, PMC5800781. Read the
      complete abstract, selected original Results and Methods and Extended Data1–10 captions; then matched
      the normal XML-extracted record. The BARD1 AAE mutant and deletion experiments, together with complementary
      BRCA1 mutants, support contributed recombinase activation. Complex expression and fragment assays
      are distinguished. No autonomous BARD1 recombinase or BRCA2-like loading claim; no complete supplementary/figure-image
      audit.
- id: PMID:39261729
  title: Promotion of DNA end resection by BRCA1-BARD1 in homologous recombination.
  findings:
  - statement: BRCA1–BARD1 stimulates reconstituted long-range DNA-end resection involving EXO1 and BLM/WRN–DNA2
      pathways.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed/PMC identity verified, DOI10.1038/s41586-024-07910-2, PMC11539920. Read
      the complete abstract, Introduction and selected EXO1, functional-module Results and purification
      Methods, with the normal XML-extracted record now available. BARD1 DNA-binding contributions are
      separated from the nuclease and helicase activities of its partners. Double-strand-break end-resection
      assays do not resolve the narrower replication-fork resection assertion. No complete-paper, figure-image
      or all-supplement claim.
core_functions:
- description: Recognizes ubiquitin-modified nucleosomes and unmodified H4K20 to recruit BRCA1–BARD1 to
    damaged post-replicative chromatin and position its H2A ubiquitination machinery. The N-terminal H2A
    ubiquitin marks recognized by BARD1 are distinct from the C-terminal H2A lysines modified by the heterodimer.
