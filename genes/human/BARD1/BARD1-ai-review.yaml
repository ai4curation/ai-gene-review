- term:
    id: GO:0120230
    label: recombinase activator activity
  evidence_type: IDA
  original_reference_id: PMID:28976962
  qualifier: contributes_to
  review:
    action: NEW
    summary: BARD1 contributes to BRCA1–BARD1-mediated activation of RAD51.
    reason: Purified BRCA1–BARD1 stimulates RAD51-dependent synaptic complex formation and DNA strand
      invasion. BARD1 RAD51-contact mutants retain DNA binding but lose efficient RAD51 interaction and
      stimulation; complementary BRCA1 mutants also impair the activity. This establishes a complex-contributed
      recombinase activator function, rather than autonomous strand-exchange catalysis by BARD1. The existing
      DNA-binding and homologous-recombination annotations do not capture this molecular activity. The
      short primary-source anchor is recorded once in the corresponding core function.
