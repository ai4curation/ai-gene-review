id: Q99728
gene_symbol: BARD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BARD1 is the BRCA1-associated RING-domain protein that combines nuclear chromatin recognition
  with regulation of DNA repair. Its N-terminal RING forms a heterodimer with BRCA1, while its ankyrin
  repeats and tandem BRCT domains recognize nucleosomes bearing unmethylated H4K20 and damage-induced
  H2A ubiquitin marks. This recognition recruits and positions the BRCA1–BARD1 complex on post-replicative
  chromatin. BARD1 contributes to the complex's ubiquitin ligase activity toward C-terminal H2A lysines;
  BRCA1 supplies the demonstrated E2-binding interface. Through separate DNA-binding and RAD51 contacts,
  the heterodimer promotes homologous DNA pairing and stimulates DNA-end resection machinery during homologous
  recombination. BARD1 also participates in context-dependent regulation of RNA processing, protein stability
  and cell survival.
