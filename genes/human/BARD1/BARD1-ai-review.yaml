      unresolved. Preserve the curated positive RNA-binding assertion as non-core, without treating that
      experiment as a purified binary-binding assay or asserting the disputed XIST-localization model.
      The canonical cache is abstract-only; selected original Results were read separately by root. Source
      assertion: PMID:12419249.'
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:12890688
  qualifier: contributes_to
  review:
    summary: BARD1 contributes to the E3 ubiquitin ligase activity of BRCA1–BARD1.
    action: MODIFY
    reason: 'The relevant chemistry is E3-mediated substrate ubiquitination, which is more specific than
      generic ubiquitin transferase activity. BARD1 stabilizes and positions the heterodimer; the observed
      E2 interface is on BRCA1. This is a contribution to complex activity, not an autonomous E1/E2 or
      isolated-BARD1 enzyme claim. Existing source fields, including contributes_to where present, are
      retained. Source assertion: PMID:12890688.'
