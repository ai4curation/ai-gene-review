- term:
    id: GO:0010855
    label: adenylate cyclase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The biology behind this term is real - the cleaved ADGRV1 beta subunit couples to
      G-alpha(i) and lowers cAMP - but the receptor does not itself bind and inhibit
      adenylate cyclase; inhibition is indirect, via Gi signaling. The MF term is at the
      wrong mechanistic level.
    action: MODIFY
    reason: >-
      GO:0010855 is defined as binding to and reducing the activity of adenylate
      cyclase. ADGRV1 acts as a receptor upstream of G-alpha(i); the cyclase inhibition
      is a downstream pathway effect (UniProt: couples to GNAI1/2/3 "inhibiting
      adenylate cyclase (AC) activity and cAMP production", by similarity to mouse
      Vlgr1). The biology is better represented as an adenylate cyclase-inhibiting GPCR
      signaling pathway annotation plus the existing GPCR activity MF.
    proposed_replacement_terms:
    - id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
- term:
    id: GO:0032420
    label: stereocilium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
