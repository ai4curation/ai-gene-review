- id: PMID:10976914
  title: Sequence similarities between a novel putative G protein-coupled receptor and Na+/Ca2+
    exchangers define a cation binding domain.
  findings:
  - statement: Human VLGR1a surface localization and calcium binding by isolated two/four-repeat
      fragments are demonstrated.
    supporting_text: Bacterial fusion proteins containing two or four repeats specifically bind 45Ca
      in overlay experiments; binding is competed poorly by Mg2+ but competed well by neomycin,
      Al3+, and Gd3+.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached primary abstract directly identifies human recombinant receptor surface biotinylation and
      calcium overlay with two/four isolated repeats. Full paper unavailable. The tested receptor was
      the 1,967-residue form later named VLGR1a; no assay of all 35 repeats is claimed.
  full_text_unavailable: true
- id: PMID:11606593
  title: Very large G protein-coupled receptor-1, the largest known cell surface protein, is highly
    expressed in the developing central nervous system.
  findings:
  - statement: The historical paper defines VLGR1 isoforms and maps expression in developing mouse
      CNS and eye; its longest human sequence is reported as 6,307 residues.
    supporting_text: The longest gene product, VLGR1b, is 6307 amino acids (6298 amino acids in
      mice) due to a much larger ectodomain containing 35 calcium exchanger beta repeats and a
      pentraxin homology domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached primary abstract checked; full original DOI 10.1074/jbc.M108929200 independently read on
      2026-09-26 through the author article at https://www.researchgate.net/publication/11743200_Very_Large_G_Protein-coupled_Receptor-1_the_Largest_Known_Cell_Surface_Protein_Is_Highly_Expressed_in_the_Developing_Central_Nervous_System
      . Its 2002 expression experiment uses mouse embryos; discussion pp. 790–792 labels cell-adhesion
      and neural-development mechanisms as speculation. The cache remains abstract-only. Historical 6,307-residue
      numbering is not substituted for current UniProt 6,306-residue VLGR1b.
  full_text_unavailable: true
- id: PMID:12402266
  title: A nonsense mutation of the MASS1 gene in a family with febrile and afebrile seizures.
  findings:
  - statement: A MASS1/ADGRV1 nonsense mutation (S2652X) segregates with febrile and afebrile
      seizures in one family, suggesting loss of function can confer seizure susceptibility.
    supporting_text: a nonsense mutation (S2652X) causing a deletion of the C-terminal 126 amino
      acid residues was identified in one family with febrile and afebrile seizures
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached primary abstract verified: one seizure family with S2652X among 48 screened families. Full
      text unavailable; no penetrance estimate or definitive common seizure mechanism is inferred.
  full_text_unavailable: true
- id: PMID:14740321
  title: Mutations in the VLGR1 gene implicate G-protein signaling in the pathogenesis of Usher
    syndrome type II.
  findings:
  - statement: Four isoform-specific truncating VLGR1 mutations establish VLGR1/ADGRV1 as the USH2C
      gene, implicating it in congenital hearing loss and progressive retinitis pigmentosa.
    supporting_text: These results establish VLGR1 as the USH2C gene and implicate the protein,
      which is the largest cell surface receptor known (McMillan et al. 2002 ), in the pathogenesis
      of USH2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full primary human genetic study supports ADGRV1/USH2C hearing loss and retinal degeneration.
      Its receptor-family discussion does not directly demonstrate G protein coupling or biochemical self-cleavage.
  full_text_unavailable: false
- id: PMID:15203201
  title: The human and mouse repertoire of the adhesion family of G-protein-coupled receptors.
  findings:
  - statement: VLGR1 belongs to the 33-member human adhesion GPCR family of membrane-bound 7TM
      receptors with long multi-domain N-termini.
    supporting_text: The adhesion G-protein-coupled receptors (GPCRs) (also termed LN-7TM or EGF-7TM
      receptors) are membrane-bound proteins with long N-termini containing multiple domains.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached primary abstract verifies the human/mouse adhesion-GPCR repertoire survey. Full text unavailable;
      supports family classification and membrane architecture, not an individual receptor coupling experiment.
  full_text_unavailable: true
- id: PMID:15671307
  title: Disease expression in Usher syndrome caused by VLGR1 gene mutation (USH2C) and comparison
    with USH2A phenotype.
  findings:
  - statement: USH2C patients show pan-retinal photoreceptor dysfunction (rod greater than cone) and
      outer nuclear layer thinning, i.e. progressive photoreceptor degeneration.
    supporting_text: USH2C and USH2A manifest photoreceptor disease with rod- and cone-mediated
      visual losses and thinning of the outer nuclear layer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached primary clinical abstract verifies USH2C rod/cone dysfunction and outer nuclear layer thinning.
      Full text unavailable. Photoreceptor maintenance is a more precise account of that phenotype than
      maintenance of organ identity, whose live ontology parent is negative regulation of cell differentiation.
  full_text_unavailable: true
- id: PMID:16434480
  title: The DFNB31 gene product whirlin connects to the Usher protein network in the cochlea and
    retina by direct association with USH2A and VLGR1.
  findings:
  - statement: Whirlin directly associates with VLGR1b and USH2A and co-localizes with them at
      photoreceptor connecting cilium, outer limiting membrane, and synaptic regions.
    supporting_text: we provide evidence that whirlin directly associates with USH2A isoform b and
      VLGR1b, two proteins that we previously reported to be part of the Usher protein interactome
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract and full primary author PDF independently read on 2026-09-26: https://www.ag-wolfrum.bio.uni-mainz.de/files/2019/01/VanWijk_et_al_2006_Whirlin_Usher_Network_HumMolGen.pdf
      . Methods p. 762 specify human tail/whirlin constructs. Figure 4 establishes WHRN PDZ1/PBM-dependent
      binding, while Figure 5 tests cytoplasmic retention of a 150-residue VLGR1b tail in COS-1 cells.
      Rodent tissue immunolocalization has a separate scope. The cache remains abstract-only, hence its
      unavailable flag; full-text access itself succeeded externally.
  full_text_unavailable: true
