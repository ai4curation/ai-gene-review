    label: stereocilia ankle link
  - id: GO:0060171
    label: stereocilium membrane
  in_complex:
    id: GO:0002142
    label: stereocilia ankle link complex
  supported_by:
  - reference_id: PMID:17567809
    supporting_text: Several lines of evidence indicate that very large G-protein-coupled receptor 1
      (Vlgr1) makes up the ankle links that connect the stereocilia of hair cells at their base.
  - reference_id: PMID:17567809
    supporting_text: the MET currents elicited by mechanical stimulations of the hair bundle in the
      stimulatory direction were impaired in P7 Vlgr1 −/− OHCs compared with wild-type, whereas
      these currents were not affected in Vlgr1 −/− IHCs at the same stage.
- description: >-
    The cytoplasmic C-terminal PDZ-binding motif docks ADGRV1 onto whirlin and PDZD7 in the USH2 protein
    network. This provides a molecular connection between the membrane receptor and intracellular scaffold,
    supporting localization of sensory-complex partners. Photoreceptor periciliary localization and human
    degeneration phenotypes link this architecture to photoreceptor maintenance and visual function; the
    detailed quaternary interaction map was reconstructed with mouse protein fragments.
  molecular_function:
