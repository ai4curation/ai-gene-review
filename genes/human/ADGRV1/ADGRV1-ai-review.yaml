- id: PMID:20440071
  title: PDZD7 is a modifier of retinal disease and a contributor to digenic Usher syndrome.
  findings:
  - statement: PDZD7 PDZ2 binds the GPR98/ADGRV1 C-terminal PDZ-binding motif (Y2H and co-IP), and
      Pdzd7 knockdown reduces Gpr98 localization at the photoreceptor connecting cilium in
      zebrafish.
    supporting_text: We confirmed this interaction by coimmunoprecipitation studies and showed that
      it is mediated by the PDZ2 domain of PDZD7 and the PDZ-binding motif of GPR98.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full primary paper read. GPR98 PDZ-binding-motif/PDZD7 PDZ2 interaction is directly tested;
      zebrafish perturbation/localization and human genetic findings have distinct scopes. It is not a
      universal proof that all Usher syndrome is oligogenic.
  full_text_unavailable: false
