- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      ADGRV1 has experimentally supported G protein-coupled receptor activity, with construct-dependent
      coupling.
    action: ACCEPT
    reason: >-
      The mouse donor is the Adgrv1 ortholog, and independent human VLGR1a/CTF experiments in PMID:35630584
      support receptor-mediated second-messenger signaling. Those experiments use the shorter VLGR1a isoform
      and engineered C-terminal constructs; they do not measure coupling of intact VLGR1b in native human
      hair cells or photoreceptors. GPCR activity is supported without assigning one physiological G protein
      to every receptor pool.
    supported_by:
    - reference_id: PMID:35630584
      supporting_text_fulltext: Overexpressing VLGR1a revealed a dose-dependent increase of cAMP
    - reference_id: PMID:24962568
