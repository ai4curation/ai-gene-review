- id: PMID:25406310
  title: Whirlin and PDZ domain-containing 7 (PDZD7) proteins are both required to form the
    quaternary protein complex associated with Usher syndrome type 2.
  findings:
  - statement: Mouse-derived cytoplasmic and PDZ fragments reconstitute a USH2A–GPR98–WHRN–PDZD7
      complex; WHRN and PDZD7 have different binding preferences.
    supporting_text: Importantly, both WHRN and PDZD7 are required for the complex formation with
      USH2A and GPR98. In this USH2 quaternary complex, WHRN prefers to bind to USH2A, whereas PDZD7
      prefers to bind to GPR98.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full primary paper read, including cloning and pull-down methods. Mouse retinal cDNA and
      mouse cytoplasmic/PDZ fragments underpin the reconstructed quaternary complex. The GPR98 tail binds
      WHRN PDZ1 and preferentially PDZD7; no intact human receptor stoichiometry was measured.
  full_text_unavailable: false
