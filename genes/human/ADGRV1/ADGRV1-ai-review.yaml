core_functions:
- description: >-
    G protein-coupled receptor signaling through the seven-transmembrane region. Human VLGR1a and engineered
    C-terminal constructs show context-dependent Gs/Gq/Gi coupling; mouse beta-subunit assays support
    a Gi-dependent adenylate cyclase-inhibiting pathway. These experiments establish signaling capacity
    at the cell surface, while the coupling and activation state of intact VLGR1b in native sensory cells
    remain unresolved.
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:35630584
    supporting_text_fulltext: Overexpressing VLGR1a revealed a dose-dependent increase of cAMP
  - reference_id: PMID:24962568
    supporting_text_fulltext: The cleaved VLGR1 β-subunit constitutively coupled to Gαi and was
      regulated by the VLGR1 α-subunit, a disease-associated mutation, and PDZD7.
  knowledge_gaps:
  - gap_statement: Which receptor isoforms, activation states and G proteins mediate ADGRV1
      signaling in native human hair cells and photoreceptors?
    boundary: Human VLGR1a/CTF and mouse receptor-fragment assays establish G protein coupling;
      structural and genetic studies independently establish sensory-cell functions.
    provenance:
    - reference_id: PMID:35630584
      supporting_text_fulltext: A physiological role for these signaling switches in VLGR1 remains
        to be determined.
- description: >-
    The ADGRV1 ectodomain supplies a structural constituent of transient stereocilia ankle links in developing
    cochlear hair bundles. Together with its membrane anchor and intracellular partners, it maintains
    cohesive bundle geometry and supports directional mechanotransduction. Mouse mutants show altered
    organization and reduced excitatory transduction currents in outer hair cells, while inner hair cells
    retain current amplitude at the examined stage. Calcium binding is directly measured for isolated
    repeat fragments, not all 35 repeats in the intact fiber.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0060122
    label: inner ear receptor cell stereocilium organization
  - id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  - id: GO:0007605
    label: sensory perception of sound
  locations:
