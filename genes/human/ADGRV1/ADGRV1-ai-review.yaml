- term:
    id: GO:0010855
    label: adenylate cyclase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Gi-coupled ADGRV1 signaling suppresses cAMP in cell assays; a pathway term captures the demonstrated
      mechanism.
    action: MODIFY
    reason: >-
      The live GO:0010855 definition requires binding to and decreasing the activity of adenylate cyclase.
      PMID:24962568 establishes Gi-dependent signaling using mouse Vgain and beta-subunit constructs,
      PTX sensitivity and G protein chimeras, rather than a direct receptor-cyclase inhibitory interaction.
      Replace with GO:0007193 while retaining the separate GPCR molecular-function annotations. This is
      a mechanistic scope correction, not a claim that every possible physical contact with cyclase has
      been excluded.
    proposed_replacement_terms:
    - id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    supported_by:
    - reference_id: PMID:24962568
      supporting_text_fulltext: The cleaved VLGR1 β-subunit constitutively coupled to Gαi and was
        regulated by the VLGR1 α-subunit, a disease-associated mutation, and PDZD7.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN002928248
        source_status: UNRESOLVED
        comment: >-
          PAINT ancestral assertion assessed against the primary evidence described above. The tree/alignment
          was not reconstructed; no target-specific loss is inferred from donor count. The specific inhibitor
          MF needs a mechanistic scope correction despite conserved receptor signaling.
