id: Q8WXG9
gene_symbol: ADGRV1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADGRV1 (VLGR1, GPR98 or MASS1) is a large adhesion G protein-coupled receptor whose longest human isoform
  has approximately 6,300 residues. Its extracellular region contains 35 Calx-beta repeats, EAR/EPTP repeats
  and a pentraxin-like domain, followed by a GAIN/GPS region and seven transmembrane helices. Isolated
  Calx-beta repeat fragments bind calcium. The receptor supplies an extracellular structural component
  of transient ankle links between neighboring stereocilia in developing cochlear hair bundles. Its C-terminal
  PDZ-binding motif docks onto whirlin and PDZD7 in the USH2 protein network, organizing sensory-cell
  membrane complexes with usherin. In photoreceptors, ADGRV1 localizes around the connecting cilium and
  supports photoreceptor maintenance. G protein coupling depends on receptor construct and cellular context:
  human VLGR1a and C-terminal constructs support Gs/Gq/Gi signaling in heterologous cells, while mouse
  C-terminal beta-subunit experiments demonstrate Gi-dependent suppression of cAMP. Intracellular ER-associated
  pools and roles in calcium homeostasis have also been reported. Biallelic pathogenic variants cause
  Usher syndrome type 2C, with congenital sensorineural hearing loss and progressive retinal degeneration.
  Neural expression and reported seizure-associated variants provide additional disease context, with
  less established human causal mechanisms than for Usher syndrome.
