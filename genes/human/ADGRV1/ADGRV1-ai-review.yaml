- id: PMID:10976914
  title: Sequence similarities between a novel putative G protein-coupled receptor
    and Na+/Ca2+ exchangers define a cation binding domain.
  findings:
  - statement: The VLGR1 ectodomain contains Calx-beta repeats that specifically bind
      calcium in vitro, and recombinant VLGR1 is expressed at the surface of transfected
      cells.
    supporting_text: Bacterial fusion proteins containing two or four repeats specifically
      bind 45Ca in overlay experiments; binding is competed poorly by Mg2+ but competed
      well by neomycin, Al3+, and Gd3+.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original characterization of VLGR1; abstract-only cache but directly
      supports the calcium ion binding IDA and cell surface IDA annotations.
- id: PMID:11606593
  title: Very large G protein-coupled receptor-1, the largest known cell surface protein,
    is highly expressed in the developing central nervous system.
  findings:
  - statement: VLGR1b (6,307 aa) is the largest known cell surface protein, with 35
      Calx-beta repeats and a pentraxin homology domain, and is highly expressed in
      the developing CNS and eye.
    supporting_text: The longest gene product, VLGR1b, is 6307 amino acids (6298 amino
      acids in mice) due to a much larger ectodomain containing 35 calcium exchanger
      beta repeats and a pentraxin homology domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defines the full-length VLGR1b isoform and the developmental CNS
      expression pattern underlying the NAS annotations.
- id: PMID:12402266
  title: A nonsense mutation of the MASS1 gene in a family with febrile and afebrile
    seizures.
  findings:
  - statement: A MASS1/ADGRV1 nonsense mutation (S2652X) segregates with febrile and
      afebrile seizures in one family, suggesting loss of function can confer seizure
      susceptibility.
    supporting_text: a nonsense mutation (S2652X) causing a deletion of the C-terminal
      126 amino acid residues was identified in one family with febrile and afebrile
      seizures
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Single-family evidence; the authors themselves note MASS1 is unlikely
      to explain most febrile seizures in their cohort.
- id: PMID:14740321
  title: Mutations in the VLGR1 gene implicate G-protein signaling in the pathogenesis
    of Usher syndrome type II.
  findings:
  - statement: Four isoform-specific truncating VLGR1 mutations establish VLGR1/ADGRV1
      as the USH2C gene, implicating it in congenital hearing loss and progressive
      retinitis pigmentosa.
    supporting_text: These results establish VLGR1 as the USH2C gene and implicate
      the protein, which is the largest cell surface receptor known (McMillan et al.
      2002 ), in the pathogenesis of USH2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary human genetic evidence for the hearing/vision
      IMP annotations.
- id: PMID:15203201
  title: The human and mouse repertoire of the adhesion family of G-protein-coupled
    receptors.
  findings:
  - statement: VLGR1 belongs to the 33-member human adhesion GPCR family of membrane-bound
      7TM receptors with long multi-domain N-termini.
    supporting_text: The adhesion G-protein-coupled receptors (GPCRs) (also termed
      LN-7TM or EGF-7TM receptors) are membrane-bound proteins with long N-termini
      containing multiple domains.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Family-survey basis for the TAS annotations; appropriate for family-level
      claims only.
- id: PMID:15671307
  title: Disease expression in Usher syndrome caused by VLGR1 gene mutation (USH2C)
    and comparison with USH2A phenotype.
  findings:
  - statement: USH2C patients show pan-retinal photoreceptor dysfunction (rod greater
      than cone) and outer nuclear layer thinning, i.e. progressive photoreceptor degeneration.
    supporting_text: USH2C and USH2A manifest photoreceptor disease with rod- and cone-mediated
      visual losses and thinning of the outer nuclear layer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Clinical phenotyping of USH2C; supports photoreceptor maintenance
      biology, and the "maintenance of animal organ identity" mapping from it is contorted
      (see MODIFY review).
- id: PMID:16434480
  title: The DFNB31 gene product whirlin connects to the Usher protein network in
    the cochlea and retina by direct association with USH2A and VLGR1.
  findings:
  - statement: Whirlin directly associates with VLGR1b and USH2A and co-localizes
      with them at photoreceptor connecting cilium, outer limiting membrane, and synaptic
      regions.
    supporting_text: we provide evidence that whirlin directly associates with USH2A
      isoform b and VLGR1b, two proteins that we previously reported to be part of
      the Usher protein interactome
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; establishes the whirlin-VLGR1b direct interaction
      behind the IPI annotation. The cytoplasm IDA from this paper could not be verified
      from the abstract.
- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  findings:
  - statement: ADGRV1 was detected among 1,132 proteins in a high-throughput proteomic
      profile of human urinary exosomes.
    supporting_text: Here, we used LC-MS/MS to profile the proteome of human urinary
      exosomes.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: HT survey; incidental exosomal detection, not informative about
      core function.
- id: PMID:20440071
  title: PDZD7 is a modifier of retinal disease and a contributor to digenic Usher
    syndrome.
  findings:
  - statement: PDZD7 PDZ2 binds the GPR98/ADGRV1 C-terminal PDZ-binding motif (Y2H
      and co-IP), and Pdzd7 knockdown reduces Gpr98 localization at the photoreceptor
      connecting cilium in zebrafish.
    supporting_text: We confirmed this interaction by coimmunoprecipitation studies
      and showed that it is mediated by the PDZ2 domain of PDZD7 and the PDZ-binding
      motif of GPR98.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; supports the PDZ-binding-motif interaction (IPI)
      and the periciliary localization dependence.
- id: PMID:23382219
  title: Structural basis for endosomal trafficking of diverse transmembrane cargos
    by PX-FERM proteins.
  findings:
  - statement: PX-FERM sorting nexins (SNX17/27/31) bind sorting motifs in a wide
      array of transmembrane cargos including GPCRs; the ADGRV1-specific data underlying
      the signaling receptor complex IDA are in screen/SI material not present in
      the cached text.
    supporting_text: We further show that the PX-FERM proteins share a promiscuous
      ability to bind a wide array of putative cargo molecules, including receptor
      tyrosine kinases, and propose a model for their coordinated molecular interactions
      with membrane, cargo, and regulatory proteins.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Paper is about SNX17/27/31 cargo recognition; ADGRV1/GPR98 is not
      named in the cached text, so the specific evidence for the GO:0043235 IDA could
      not be inspected.
- id: PMID:25406310
  title: Whirlin and PDZ domain-containing 7 (PDZD7) proteins are both required to
    form the quaternary protein complex associated with Usher syndrome type 2.
  findings:
  - statement: USH2A, GPR98/ADGRV1, WHRN and PDZD7 form a quaternary USH2 complex;
      WHRN and PDZD7 are both required, PDZD7 preferentially binds GPR98, and the
      four proteins colocalize at the ankle-link region of developing hair bundles.
    supporting_text: Importantly, both WHRN and PDZD7 are required for the complex
      formation with USH2A and GPR98. In this USH2 quaternary complex, WHRN prefers
      to bind to USH2A, whereas PDZD7 prefers to bind to GPR98.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; definitive biochemical evidence for USH2 complex
      membership and the ankle-link localization statements.
