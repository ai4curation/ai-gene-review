    reason: >-
      GOA offers no molecular-function term for the ectodomain's link-forming role,
      which is the mechanistic basis of the ankle-link complex CC and stereocilium
      organization BP annotations. GO:0005198 captures a structural fiber constituent
      without asserting cell-cell adhesion (the links join stereocilia of one hair
      cell) or overstating the in vitro calcium binding of the Calx-beta repeats,
      which is a domain property rather than the link-forming activity. ISS because
      the evidence is from mouse Vlgr1.
    supported_by:
    - reference_id: PMID:17567809
      supporting_text: Several lines of evidence indicate that very large
        G-protein-coupled receptor 1 (Vlgr1) makes up the ankle links that connect the
        stereocilia of hair cells at their base.
core_functions:
- description: >-
    Adhesion G protein-coupled receptor activity at the base of hair-cell stereocilia
    and the photoreceptor periciliary membrane: after GAIN-domain autoproteolysis at
    the GPS site, the membrane-embedded 7TM beta subunit couples to G-alpha(i)
    proteins, driving an adenylate cyclase-inhibiting GPCR signaling pathway that
    lowers cAMP.
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  directly_involved_in:
  - id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0060171
    label: stereocilium membrane
  supported_by:
  - reference_id: PMID:14740321
    supporting_text: The VLGR1 protein belongs to a 33-member subgroup of the large
      N-terminal family B (LNB) seven-transmembrane (7TM) receptors.
  - reference_id: PMID:10976914
    supporting_text: As demonstrated by cell surface labeling with a biotin derivative,
      the recombinant protein is expressed on the surface of transfected mammalian cells.
  - reference_id: file:human/ADGRV1/ADGRV1-uniprot.txt
    supporting_text: 'FUNCTION: [ADGRV1 subunit beta]: Cleaved ADGRV1 beta-subunit
      couples with G-alpha(i)-proteins, GNAI1/2/3, and constitutively inhibits
      adenylate cyclase (AC) activity with a stronger effect than full ADGRV1.'
- description: >-
    Structural constituent of the transient ankle links: the giant ectodomain
    contributes the extracellular fiber connecting the bases of neighboring
    stereocilia in developing cochlear hair bundles as part of the ankle-link (USH2)
    complex, holding the developing hair bundle in its organized, cohesive
    architecture and thereby supporting mechanotransduction and hearing. The 35
    Calx-beta repeats bind calcium in vitro, a domain property that likely
    stabilizes the ectodomain fiber but is not itself the link-forming activity.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0060122
    label: inner ear receptor cell stereocilium organization
  - id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  - id: GO:0007605
    label: sensory perception of sound
  locations:
