    label: stereocilia ankle link
  - id: GO:0060171
    label: stereocilium membrane
  in_complex:
    id: GO:0002142
    label: stereocilia ankle link complex
  supported_by:
  - reference_id: PMID:10976914
    supporting_text: Bacterial fusion proteins containing two or four repeats specifically
      bind 45Ca in overlay experiments; binding is competed poorly by Mg2+ but competed
      well by neomycin, Al3+, and Gd3+.
  - reference_id: PMID:25406310
    supporting_text: In hair cells, proteins encoded by the four genes are colocalized
      at the ankle link region of the mechanosensitive structure, the hair bundle, during
      development
- description: >-
    PDZ domain binding via the cytoplasmic C-terminal PDZ-binding motif, which docks
    the receptor onto the PDZ scaffold proteins whirlin (WHRN) and PDZD7 to assemble
    the quaternary USH2 complex with usherin; in photoreceptors this anchors ADGRV1
    in the periciliary membrane compartment of the apical inner segment surrounding
    the connecting cilium, supporting long-term photoreceptor cell maintenance and
    visual perception.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  directly_involved_in:
  - id: GO:0045494
    label: photoreceptor cell maintenance
  - id: GO:0007601
    label: visual perception
  locations:
