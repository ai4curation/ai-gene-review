id: Q8WXG9
gene_symbol: ADGRV1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADGRV1 (also known as VLGR1, GPR98 and MASS1) is the largest known G protein-coupled
  receptor (~6,300 residues, ~700 kDa for the full-length VLGR1b isoform) and a member of
  the adhesion GPCR family. Its enormous extracellular region contains 35 calcium-binding
  Calx-beta repeats, EAR/EPTP repeats and a pentraxin-like domain, followed by a GAIN
  domain in which the receptor is autoproteolytically cleaved at the GPS site into a
  non-covalently associated extracellular alpha subunit and a membrane-embedded
  seven-transmembrane beta subunit. ADGRV1 is a core transmembrane component of the USH2
  protein complex. In developing cochlear hair cells its ectodomain forms the transient
  ankle links that connect the bases of neighboring stereocilia, while its cytoplasmic
  C-terminal PDZ-binding motif is bound by the PDZ scaffold proteins whirlin (WHRN) and
  PDZD7, which bridge it to usherin (USH2A); this ankle-link complex is required for
  hair-bundle organization and normal mechanosensory hair cell development. In retinal
  photoreceptors, ADGRV1, usherin and whirlin form the periciliary membrane complex at
  the apical inner segment surrounding the connecting cilium, which supports
  photoreceptor cell maintenance and protein trafficking toward the outer segment. The
  cleaved beta subunit can couple to G-alpha(i) (and, context-dependently, G-alpha(s)
  and G-alpha(q)) proteins, inhibiting adenylate cyclase and cAMP production. Biallelic
  ADGRV1 mutations cause Usher syndrome type 2C (congenital sensorineural hearing loss
  with progressive retinitis pigmentosa); heterozygous variants have been associated
  with febrile seizure susceptibility, and the orthologous mouse Mass1/frings mutation
  causes audiogenic seizures. The gene is broadly expressed during development, with
  prominent expression in the ventricular zone of the developing central nervous system.
