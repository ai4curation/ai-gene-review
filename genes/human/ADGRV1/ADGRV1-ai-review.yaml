- term:
    id: GO:0071277
    label: cellular response to calcium ion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Reflects mouse-derived evidence that VLGR1 responds to extracellular calcium
      (sensed via its Calx-beta repeats) to activate PKA/PKC signaling, in the context
      of myelination in the auditory pathway. Real but peripheral to the core
      structural/sensory role.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Calx-beta ectodomain binds calcium [PMID:10976914], and UniProt (by similarity
      to mouse Q8VHN7) records that in response to extracellular calcium ADGRV1
      activates PKA and PKC to regulate MAG stability in myelin-forming cells. This is
      experimentally grounded in the mouse but is a modulatory/context-specific
      signaling role rather than the core ankle-link/periciliary function; retain as
      non-core.
    supported_by:
    - reference_id: PMID:10976914
      supporting_text: Bacterial fusion proteins containing two or four repeats specifically
        bind 45Ca in overlay experiments; binding is competed poorly by Mg2+ but competed
        well by neomycin, Al3+, and Gd3+.
