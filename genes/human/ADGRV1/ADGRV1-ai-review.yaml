existing_annotations:
- term:
    id: GO:0007601
    label: visual perception
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetically propagated annotation consistent with strong human genetic and
      animal-model evidence: ADGRV1 is the USH2C gene, and its loss causes progressive
      retinitis pigmentosa; ADGRV1 is part of the photoreceptor periciliary membrane
      complex with usherin and whirlin.
    action: ACCEPT
    reason: >-
      Core function. Human USH2C patients with biallelic ADGRV1 mutations develop
      retinitis pigmentosa with rod and cone dysfunction [PMID:14740321, PMID:15671307],
      and ADGRV1 localizes to the photoreceptor periciliary/connecting cilium region as
      part of the USH2 complex [PMID:20440071, PMID:16434480]. The IBA reflects sound
      family-level judgment grounded in experimental data.
    supported_by:
    - reference_id: PMID:15671307
      supporting_text: The siblings with VLGR1 mutation showed abnormal photoreceptor-mediated
        function in all retinal regions, and there was greater rod than cone dysfunction.
- term:
    id: GO:0001965
    label: G-protein alpha-subunit binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Adhesion GPCR whose cleaved beta subunit couples to G-alpha subunits (Gai, and
      context-dependently Gas/Gaq in heterologous assays; mouse Vlgr1 data transferred
      by UniProt). Informative molecular-function annotation consistent with the
      receptor's GPCR architecture.
    action: ACCEPT
    reason: >-
      Coupling of the ADGRV1/VLGR1 7TM (beta) subunit to G-alpha(i) proteins, with
      inhibition of adenylate cyclase, is documented in the mouse ortholog and captured
      in the UniProt function annotation; the family (adhesion GPCR/secretin-like 7TM)
      context makes G-alpha binding a phylogenetically reasonable assertion. Direct
      demonstration in native human sensory cells is still lacking, but the annotation
      is well supported at the family level.
    supported_by:
    - reference_id: file:human/ADGRV1/ADGRV1-uniprot.txt
      supporting_text: Couples to G-alpha(i)-proteins, GNAI1/2/3, G-alpha(q)-proteins,
        GNAQ, as well as G-alpha(s)-proteins, GNAS, inhibiting adenylate cyclase (AC)
        activity and cAMP production.
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      ADGRV1 is an adhesion-family GPCR with a canonical seven-transmembrane domain,
      GAIN/GPS autoproteolysis and demonstrated G-protein coupling of the cleaved beta
      subunit in cell-based assays (mouse ortholog). Core molecular function.
    action: ACCEPT
    reason: >-
      The 7TM architecture, GPS cleavage into alpha/beta subunits, tethered-agonist
      (Stachel) activation paradigm and Gai/Gas coupling in heterologous systems support
      genuine receptor activity, even though the endogenous extracellular ligand remains
      unidentified [PMID:10976914, PMID:14740321]. Appropriate core MF term at the right
      level of specificity.
    supported_by:
    - reference_id: PMID:14740321
      supporting_text: The VLGR1 protein belongs to a 33-member subgroup of the large
        N-terminal family B (LNB) seven-transmembrane (7TM) receptors.
    - reference_id: file:human/ADGRV1/ADGRV1-uniprot.txt
      supporting_text: 'FUNCTION: [ADGRV1 subunit beta]: Cleaved ADGRV1 beta-subunit
        couples with G-alpha(i)-proteins, GNAI1/2/3, and constitutively inhibits
        adenylate cyclase (AC) activity with a stronger effect than full ADGRV1.'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      ADGRV1 is a multi-pass plasma-membrane receptor active at the stereociliary and
      periciliary membrane; a generic "is_active_in cytoplasm" assertion is not where
      this receptor performs its characterized functions.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      All well-characterized ADGRV1 functions (ankle-link formation, periciliary
      membrane complex, GPCR signaling) occur at the plasma membrane/cell projections;
      UniProt subcellular location is cell membrane, stereocilium membrane, and
      photoreceptor inner segment. While intracellular pools (e.g. biosynthetic or
      ER-associated) have been reported in cultured cells, "cytoplasm" as the active
      location is uninformative and likely an over-propagation; plasma membrane and
      stereocilium terms capture the biology.
