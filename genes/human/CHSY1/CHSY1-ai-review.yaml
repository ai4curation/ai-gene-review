id: Q86X52
gene_symbol: CHSY1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHSY1 is a type-II Golgi membrane glycosyltransferase that elongates
  the chondroitin backbone of proteoglycans. Its luminal catalytic region alternately
  adds glucuronic acid through a beta1,3 linkage and N-acetylgalactosamine through
  a beta1,4 linkage, using UDP-sugar donors. CHSY1 forms functional polymerase complexes
  with CHPF or CHPF2, which support complex assembly and activity, while CHSY1 supplies
  both sugar-transfer reactions. The resulting chains can subsequently be modified
  by sulfotransferases. CHSY1-dependent chondroitin production contributes to extracellular-matrix
  organization and skeletal development. A soluble CHSY1 pool has also been detected
  in primary human fibroblast conditioned medium; its processing and the relationship
  between chondroitin synthesis and altered NOTCH signaling remain incompletely resolved.
