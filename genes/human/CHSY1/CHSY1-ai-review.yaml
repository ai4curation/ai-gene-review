  title: Structural basis of chondroitin sulfate backbone polymer synthesis.
  findings:
  - statement: Human CHSY1 domain mutants separate GlcA transfer from GalNAc transfer,
      with product MS supporting the two reactions in polymerase complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Genuine normal full cache. Selected Methods 68–71/89/93/96 and
      Results 27/34/39–43 were read: human Q86X52 aa32–802 expressed as tagged soluble
      ectodomain; both CHSY1 catalytic domains tested with CHPF partners, bikunin
