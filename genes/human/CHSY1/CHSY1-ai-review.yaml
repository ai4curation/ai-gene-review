core_functions:
- description: The C-terminal GT7 domain of CHSY1 transfers GalNAc from UDP-GalNAc
    to the terminal GlcA of a chondroitin acceptor, creating a beta1,4 linkage. This
    is one of two coupled catalytic steps in Golgi chondroitin backbone elongation.
    CHPF or CHPF2 supports the polymerase complex, while CHSY1 supplies the sugar-transfer
    chemistry.
  molecular_function:
    id: GO:0047238
    label: glucuronosyl-N-acetylgalactosaminyl-proteoglycan 4-beta-N-acetylgalactosaminyltransferase
      activity
  directly_involved_in:
  - id: GO:0050650
    label: chondroitin sulfate proteoglycan biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:11514575
  - reference_id: PMID:12716890
  - reference_id: PMID:41298522
  - reference_id: PMID:42204168
    supporting_text: GT7 domains transfer β1,4-GalNAc residues to the growing CS chain
- description: The N-terminal GT31 domain of CHSY1 transfers GlcA from UDP-GlcA to
    the terminal GalNAc of a chondroitin acceptor, creating a beta1,3 linkage. Alternation
    with its GalNAc-transfer reaction extends the same proteoglycan chain within the
    Golgi. This backbone synthesis precedes modification by sulfotransferases.
  molecular_function:
    id: GO:0050510
    label: N-acetylgalactosaminyl-proteoglycan 3-beta-glucuronosyltransferase activity
  directly_involved_in:
  - id: GO:0050650
    label: chondroitin sulfate proteoglycan biosynthetic process
