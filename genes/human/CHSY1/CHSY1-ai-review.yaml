- id: PMID:41298522
  title: Structural basis for human chondroitin sulfate chain polymerization.
  findings:
  - statement: Purified CHSY1–CHPF or CHSY1–CHPF2 complexes extend glycan acceptors,
      and full-length CHSY1 catalytic mutants fail to restore cellular chondroitin
      production.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full cache. Selected Results and Methods cover truncated
      human CHSY1 aa68–802, cleaved N-terminal purification tags, heterodimer reconstitution
      and full-length FLAG-tagged cellular complementation. Cryo-EM and detailed structural
      mutants primarily concern CHSY3–CHPF; CHSY1 atomic coordinates are modeled.
  full_text_unavailable: false
