  - reference_id: PMID:42204168
    supporting_text: GT31 domains of the CHSYs catalyze β1,3-GlcA transfer
suggested_questions:
- question: How is the soluble CHSY1 pool generated in human fibroblasts, and is it
    catalytically active with a CHPF partner outside the Golgi?
- question: Do the NOTCH readouts after CHSY1 loss reflect altered chondroitin-dependent
    signaling or direct modification of a receptor or ligand, and what is the experimentally
    established glycan substrate?
- question: How do CHPF versus CHPF2 partnerships alter CHSY1 stability, acceptor
    selection and chain-length control in native tissues?
- question: Can the original PMID 19946888 target peptide/table record and the PMID
    14975935 erratum be recovered to complete the source-specific localization and
    nutrient-response checks?
suggested_experiments:
- description: Reconstitute matched human CHSY1–CHPF and CHSY1–CHPF2 complexes on
    defined proteoglycan acceptors, normalizing enzyme abundance and integrity while
    measuring each transfer step and product chain length separately.
- description: Map the N- and C-termini and partner composition of endogenous extracellular
    CHSY1, then compare its activity with Golgi-associated material using both UDP-sugars
    and verified glycan acceptors.
- description: Measure NOTCH glycopeptides alongside chondroitin products after CHSY1
    perturbation and rescue with matched catalytic mutants, distinguishing direct
    receptor modification from an indirect matrix-dependent signaling effect.
