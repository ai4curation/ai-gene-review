  - term:
      id: GO:0052816
      label: long-chain fatty acyl-CoA hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000116
    qualifier: enables
    supporting_entities:
      - RHEA:40783
    review:
      summary: ABCD1 preparations exhibit fatty-acyl-CoA thioesterase activity.
      action: ACCEPT
      reason: PMID:29397936 reports ACOT activity in reconstituted ABCD proteins, and
        PMID:33500543 directly measures NBD-acyl-CoA hydrolysis by human ABCD1
        preparations with matched control protein, substrate-competition,
        chemical-inhibition and covalent-labeling experiments. Retain the reported
        hydrolase activity and substrate-class mappings. The assay relies heavily on
        fluorescent substrate analogues and competition, so it does not fully establish
        native substrate kinetics, the catalytic residue or an obligatory
        cleavage/re-esterification mechanism in every transport cycle. Structural work
        PMID:35013584 explicitly leaves the chemistry unsettled.
      additional_reference_ids:
        - PMID:29397936
        - PMID:33500543
        - PMID:35013584
      propagation_review:
        root_cause: NO_FAILURE_CORE
        source_entities:
          - source_id: RHEA:40783
            source_status: SUPPORTS_TRANSFER
            comment: The fetched UniProt catalytic-activity record explicitly identifies
              RHEA:40783 as docosanoyl-CoA hydrolysis, linked to PMID:33500543. This
              verifies the reaction identity rather than an independent enzyme experiment.
              The underlying study uses analogue hydrolysis and native-acyl-CoA
              competition; the existing substrate-class assertion is retained with
              unresolved native kinetics and obligatory coupling to transport.
