id: P33897
gene_symbol: ABCD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCD1 encodes ALDP, a peroxisomal membrane ABC half-transporter that
  assembles principally as a homodimer. It recognizes fatty-acyl-CoA substrates,
  especially saturated very-long-chain species, and couples ATP utilization to import
  supporting peroxisomal beta-oxidation and fatty-acid homeostasis. Biochemical
  preparations exhibit acyl-CoA thioesterase activity, although whether native transport
  releases intact acyl-CoA or a fatty acid after thioester cleavage remains unresolved.
  PEX19 recognizes nascent ABCD1 as a membrane-protein client during targeting. Loss of
  ABCD1 function causes X-linked adrenoleukodystrophy, with accumulation of
  very-long-chain fatty acids and tissue-dependent neurological and adrenal injury.
  Mitochondrial dysfunction, oxidative stress, inflammation and axonal/myelin pathology
  can follow the primary lipid-handling defect.
