      proposed_replacement_terms:
        - id: GO:0005778
          label: peroxisomal membrane
  - term:
      id: GO:0005765
      label: lysosomal membrane
    evidence_type: IDA
    original_reference_id: PMID:16946495
    qualifier: located_in
    review:
      summary: The non-peroxisomal location was observed during heterologous
        overexpression, not established as normal human residence.
      action: MARK_AS_OVER_ANNOTATED
      reason: The full publisher PDF of PMID:16946495
        (https://www.jstage.jst.go.jp/article/bpb/29/9/29_9_1836/_pdf/-char/en) reports
        ALDPHis distributed among mitochondria, lysosomes and ER in baculovirus-infected
        Sf21 insect cells. At later times nuclear aggregates appeared. These are real
        model-system observations, but extrapolating them to physiological human
        lysosomal, ER or mitochondrial location overstates that experiment. Native
        peroxisomal membrane localization is independently supported; the derived UniProt
        subcellular-location mapping inherits this context problem.
      additional_reference_ids:
        - PMID:16946495
        - PMID:14533738
      supported_by:
        - reference_id: PMID:16946495
          supporting_text_fulltext: including mitochondria, lysosomes and ER
