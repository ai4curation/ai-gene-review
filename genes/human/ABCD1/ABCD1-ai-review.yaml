        source_entities:
          - source_id: ARBA:ARBA00084953
            source_status: UNRESOLVED
            comment: The rule identifier is recorded in GOA, but its learned predicates
              and training support were not independently inspected. The annotation-level
              judgment rests on the cited primary ABCD1 biology, not validation of the
              internal ARBA rule. The ARBA assignment is consistent with altered
              fatty-acid pools, oxidation and compensatory elongation after ABCD1
              deficiency. Retain the broad regulatory association as non-core; the
              activity-centered description is acyl-CoA-dependent import supplying
              peroxisomal catabolism.
