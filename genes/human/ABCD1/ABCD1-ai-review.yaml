  - id: file:human/ABCD1/ABCD1-deep-research-falcon.md
    title: ABCD1 functional-annotation research report (Falcon)
    findings: []
core_functions:
  - description: Imports fatty-acyl-CoA-derived substrates into peroxisomes using ATP,
      principally as an ABCD1 homodimer, supplying beta-oxidation and maintaining
      fatty-acid homeostasis. Saturated C24/C26 substrates are especially characteristic.
      The input is recognized as an acyl-CoA ester; whether native membrane crossing
      retains that ester or includes cleavage and reactivation remains unresolved.
    molecular_function:
      id: GO:0015607
      label: ABC-type fatty-acyl-CoA transporter activity
    directly_involved_in:
      - id: GO:0015910
        label: long-chain fatty acid import into peroxisome
      - id: GO:0006635
        label: fatty acid beta-oxidation
      - id: GO:0055089
        label: fatty acid homeostasis
    locations:
      - id: GO:0005778
        label: peroxisomal membrane
    supported_by:
      - reference_id: PMID:18757502
        supporting_text: ALDP can function as a homodimer
      - reference_id: PMID:21145416
        supporting_text: rescue of beta-oxidation activity was best with C24:0 and C26:0
          as substrates.
      - reference_id: PMID:23671276
        supporting_text: the β-oxidation defect in X-ALD is directly caused by ABCD1
          dysfunction
      - reference_id: PMID:35013584
        supporting_text: It is currently unclear whether the fatty acyl chain is separated
          from its CoA ester for subsequent re-esterification
  - description: Exhibits fatty-acyl-CoA hydrolysis in reconstituted preparations,
      proposed to assist fatty-acid import. This biochemical subactivity is supported by
      analogue hydrolysis, covalent labeling, substrate competition and chemical
      perturbation; the native substrate kinetics, catalytic residues and obligatory
      coupling to each transport cycle remain unresolved. The generic hydrolase term
      deliberately preserves the measured biochemical scope without claiming that
      competition with native VLC acyl-CoAs provides a complete chain-specific kinetic
      demonstration.
    molecular_function:
      id: GO:0047617
      label: fatty acyl-CoA hydrolase activity
    locations:
      - id: GO:0005778
        label: peroxisomal membrane
    supported_by:
      - reference_id: PMID:33500543
        supporting_text: The expressed ABCD1 possessed both ATPase and ACOT activities.
      - reference_id: PMID:35013584
        supporting_text: It is currently unclear whether the fatty acyl chain is separated
          from its CoA ester for subsequent re-esterification
suggested_questions:
  - question: Does native human ABCD1 move intact acyl-CoA, or does its measured
      thioesterase subactivity cleave substrates during transport and require
      intraperoxisomal reactivation?
  - question: Which residues catalyze ABCD1 ACOT activity, and can hydrolysis be separated
      genetically from ATPase, folding and substrate binding?
  - question: What source experiments resolve the cross-species interaction in
      PMID:10551832, ABCD2-associated binding row in PMID:17609205, ABCD1 client assay in
      PMID:20531392, and biosynthetic mouse transfers in PMID:16223892 and PMID:18854420?
  - question: How do ABCD1/ABCD2/ABCD3 combinations and tissue-specific expression alter
      native substrate spectra without conflating rescue capacity with the dominant
      physiological transporter?
suggested_experiments:
  - description: Reconstitute purified, orientation-defined human ABCD1 with isotopically
      distinguishable acyl and CoA labels, monitor both molecules and thioester integrity
      on each side of the membrane, and compare matched ATPase/ACOT perturbations while
      controlling passive lipid partitioning.
  - description: Quantify native acyl-CoA chain-length-specific hydrolysis and flux in
      gene-corrected human cells and purified complexes, separating direct catalytic
      products from competitive binding or ATPase-stimulation readouts.
