  - term:
      id: GO:0140359
      label: ABC-type transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    supporting_entities:
      - InterPro:IPR011527
    review:
      summary: The generic ATP-driven transporter activity can be made substrate-specific.
      action: MODIFY
      reason: ABCD1 is a genuine ATP-coupled peroxisomal transporter, unlike regulatory
        ABC-family proteins. The established substrate-recognition and
        genetic-complementation evidence supports ABC-type fatty-acyl-CoA transporter
        activity. Its exact thioester-cleavage sequence remains unresolved; the refinement
        identifies substrate and energy coupling, not a fully proven chemical
        intermediate.
      additional_reference_ids:
