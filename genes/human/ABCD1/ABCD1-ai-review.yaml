  - term:
      id: GO:0030497
      label: fatty acid elongation
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    qualifier: involved_in
    supporting_entities:
      - UniProtKB:P48410
      - ensembl:ENSMUSP00000002084
    review:
      summary: Increased elongation after Abcd1 loss is a verified phenotype, but the
        basis for assigning ABCD1 participation in elongation remains unresolved.
      action: UNDECIDED
      reason: The mouse donor PMID:26108493 reports increased microsomal C20:0-CoA
        elongation in three-week-old Abcd1-deficient brain. This perturbation establishes
        an effect on elongation, not that ABCD1 performs an elongation step. ABCD1
        supplies peroxisomal fatty-acid import, whereas this assay measures microsomal
        chain extension. The full original study and any experiment establishing direct
        participation were not recovered. Preserve the transferred assertion for curator
        follow-up, without converting it into a new regulation annotation or claiming that
        the donor experiment is wrong. The existing GO:0019217 row separately retains a
        broad non-core metabolic association.
      additional_reference_ids:
        - PMID:26108493
      propagation_review:
        root_cause: UNRESOLVED
        source_entities:
          - source_id: UniProtKB:P48410
            source_status: UNRESOLVED
            comment: P48410 and ENSMUSP00000002084 identify the same mouse Abcd1 donor,
              not independent experiments. The accessible original abstract shows
              increased microsomal elongation after Abcd1 deficiency. The full study was
              unavailable, so the evidence establishing participation rather than a
              downstream metabolic response remains unverified. No replacement regulation
              term is asserted.
          - source_id: ensembl:ENSMUSP00000002084
            source_status: UNRESOLVED
            comment: P48410 and ENSMUSP00000002084 identify the same mouse Abcd1 donor,
              not independent experiments. The accessible original abstract shows
              increased microsomal elongation after Abcd1 deficiency. The full study was
              unavailable, so the evidence establishing participation rather than a
              downstream metabolic response remains unverified. No replacement regulation
              term is asserted.
      supported_by:
        - reference_id: PMID:26108493
          supporting_text: microsomal fatty acid elongation activity is stimulated in
            abcd1-deficient mice
