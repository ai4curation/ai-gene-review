    evidence_type: IDA
    original_reference_id: PMID:17761426
    qualifier: located_in
    review:
      summary: Peroxisomal membrane is the specific established intracellular location.
      action: MODIFY
      reason: The human tissue distribution study PMID:17761426 supports intracellular
        ABCD1 staining, and multiple independent targeting and localization studies place
        the functional transporter in the peroxisomal membrane. Refining the broad
        cytoplasm term does not imply that cytoplasm excludes membrane-bound organelles or
        that the original staining was soluble.
