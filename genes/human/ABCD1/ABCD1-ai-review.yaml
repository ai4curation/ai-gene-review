      label: alpha-linolenic acid metabolic process
    evidence_type: TAS
    original_reference_id: Reactome:R-HSA-2046106
    qualifier: involved_in
    review:
      summary: Polyunsaturated-fatty-acid pathway participation is broader and less
        characteristic than saturated VLCFA import.
      action: KEEP_AS_NON_CORE
      reason: The Reactome pathway includes peroxisomal import of elongated
        polyunsaturated intermediates for a final shortening step. ABCD1 has overlapping
        substrate capacity with ABCD2/3, but PMID:21145416 favors C24:0/C26:0 for ABCD1
        and polyunsaturated substrates for ABCD2. PMID:11500517 reports normal DHA
        synthesis in X-ALD fibroblasts. Retain the curated pathway context as non-core
        without asserting that ABCD1 is uniquely required for DHA/DPA synthesis.
      additional_reference_ids:
