      label: peroxisome organization
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN004256010
      - UniProtKB:P28288
      - UniProtKB:P33897
    review:
      summary: Peroxisome-organization evidence reflects a complementation context beyond
        the main transport activity.
      action: KEEP_AS_NON_CORE
      reason: PMID:9425230 reports that ABCD1 or ABCD3 expression can rescue peroxisome
        biogenesis in Pex2-deficient cells. This provides evidence for the existing broad
        organization assertion but does not establish ABCD1 as the primary
        import/insertion machinery. The original 1993 homology-based source is less
        specific; later complementation supports a contextual interpretation. For PAINT,
        retain the inherited broad association without treating donor count or ABCD1
        self-inclusion as circular.
      additional_reference_ids:
        - PMID:9425230
