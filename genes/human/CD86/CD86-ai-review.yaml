existing_annotations:
- term:
    id: GO:0002639
    label: positive regulation of immunoglobulin production
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P42082
  review:
    summary: 'ISS transfer from mouse Cd86 (P42082): CD86 engagement on B cells regulates IgG1 production.'
    action: KEEP_AS_NON_CORE
    reason: Based on mouse studies of CD86 'reverse' signalling in B cells (UniProt, By similarity). Plausible
      and consistent with CD86 expression on activated B cells, but this is a secondary B-cell-intrinsic
      role; the core function of CD86 is as the APC ligand for CD28/CTLA4. No direct human evidence was
      found in the cached literature.
    supported_by:
    - reference_id: file:human/CD86/CD86-uniprot.txt
      supporting_text: Also involved in the regulation of B cells function, plays a role in regulating
        the level of IgG(1) produced.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11279501
  qualifier: enables
  supporting_entities:
  - UniProtKB:P16410
  review:
    summary: IPI binding of CD86 to CTLA4 (the CD28/CTLA4 receptors for B7 ligands) reported in PMID:11279501.
    action: MODIFY
    reason: The interaction with CTLA4 is real and is the essence of CD86 function, but generic 'protein
      binding' is uninformative. The partner is a signaling receptor for which CD86 is the established
      ligand, so the binding is better captured as signaling receptor binding (GO:0005102); the functional
      consequence is captured separately by receptor ligand activity (GO:0048018), which CD86 already
      carries by IDA/IBA.
    proposed_replacement_terms:
    - &id001
      id: GO:0005102
      label: signaling receptor binding
    supported_by:
    - reference_id: PMID:11279501
      supporting_text: the 3.2-A resolution structure of the complex between the disulphide-linked homodimer
        of human CTLA-4 and the receptor-binding domain of human B7-2
    - reference_id: PMID:7513726
      supporting_text: ETC-1 also bound to both CD28-Ig and CTLA4-Ig fusion proteins.
    - reference_id: file:human/CD86/CD86-uniprot.txt
      supporting_text: Acts as the primary auxiliary signal augmenting the MHC/TCR signal in naive T-cells
        by acting as a ligand for the CD28 receptor
