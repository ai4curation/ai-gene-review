core_functions:
- description: 'Costimulatory ligand on antigen-presenting cells: the CD86 IgV domain binds CD28 on T
    cells to deliver the antigen-independent second signal that augments TCR signalling and drives T cell
    proliferation and IL-2 production; the same ligand is bound by the inhibitory receptor CTLA4.'
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0031295
    label: T cell costimulation
  - id: GO:0050862
    label: positive regulation of T cell receptor signaling pathway
  - id: GO:0042102
    label: positive regulation of T cell proliferation
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:7694363
    supporting_text: We have cloned a counter-receptor of CD28 and CTLA-4, termed B7-2.
  - reference_id: PMID:7694363
    supporting_text: B7-2 also costimulates IL-2 production and T cell proliferation.
  - reference_id: PMID:7527824
    supporting_text: both CD80 and CD86 transfectants efficiently costimulated anti-CD3 mAb-induced proliferation
      and the secretion of IL-2 and IFN-gamma
  - reference_id: PMID:12196291
    supporting_text: B7-2 binds the two receptors more weakly than B7-1
  - reference_id: file:human/CD86/CD86-uniprot.txt
    supporting_text: Acts as the primary auxiliary signal augmenting the MHC/TCR signal in naive T-cells
      by acting as a ligand for the CD28 receptor
suggested_questions:
- question: Does human CD86 transduce 'reverse' signals into B cells or dendritic cells (as reported for
    mouse Cd86 regulating IgG1 and NF-kB), and if so which cytoplasmic-tail motifs and partners mediate
    it?
- question: What is the physiological contribution of the soluble/alternatively spliced CD86 isoforms
    (deltaTM, deltaEC, isoform 2) to tuning CD28 versus CTLA4 engagement in vivo?
- question: Should the CD86-CTLA4 relationship (CTLA4-mediated trans-endocytosis of CD86) be represented
    on CTLA4 (has input CD86) rather than as a process annotation on CD86?
suggested_experiments:
- description: CRISPR knockout of CD86 versus CD80 in primary human monocyte-derived DCs, followed by
    co-culture with naive CD4 T cells to quantify the CD86-specific contribution to early IL-2 production
    and proliferation.
- description: Mutagenesis of the human CD86 cytoplasmic tail in B cells to test for cell-intrinsic signalling
    (NF-kB, IgG production) upon CD28-Ig or CTLA4-Ig engagement.
