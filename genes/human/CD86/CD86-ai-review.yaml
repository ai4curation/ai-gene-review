id: P42081
gene_symbol: CD86
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CD86 (B7-2) is a type I transmembrane glycoprotein of the immunoglobulin superfamily (IgV
  and IgC ectodomains, short cytoplasmic tail) expressed on antigen-presenting cells, including B cells,
  monocytes and dendritic cells, where it is constitutive at low level and rapidly upregulated on activation.
  Its ectodomain is a ligand for two T cell receptors: CD28, which delivers the antigen-independent costimulatory
  ''second signal'' that, together with TCR engagement, drives naive T cell proliferation, IL-2 production
  and effector differentiation; and CTLA4, a higher-affinity inhibitory receptor that competes CD86 away
  from CD28 and can strip it from APCs. Compared with CD80, CD86 is monomeric, binds both receptors with
  lower affinity and with less bias toward CTLA4, and is expressed earlier, making it a key early costimulatory
  ligand. Surface levels are regulated by MARCH8-mediated ubiquitination and lysosomal degradation, and
  CD86 is also found on APC-derived exosomes. Studies in mouse suggest CD86 engagement can also signal
  back into B cells to modulate IgG1 production and NF-kB activity. It is the target of the CTLA4-Ig therapeutics
  abatacept and belatacept.'
