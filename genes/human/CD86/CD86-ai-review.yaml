- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IC
  original_reference_id: PMID:10606960
  qualifier: is_active_in
  review:
    summary: 'IC: CD86 surface expression on tumour-infiltrating T cells and APCs (flow cytometry), inferring
      plasma membrane.'
    action: ACCEPT
    reason: CD86 is a single-pass type I membrane protein detected on the cell surface by FACS; plasma
      membrane is correct and core to its function as a cell-surface ligand.
    supported_by:
    - reference_id: PMID:10606960
      supporting_text: Costimulation of T lymphocytes by the leucocyte surface molecules CD80 and CD86
        expressed on antigen-presenting cells (APC) is required for the development of T cell responses.
    - reference_id: file:human/CD86/CD86-uniprot.txt
      supporting_text: Cell membrane
