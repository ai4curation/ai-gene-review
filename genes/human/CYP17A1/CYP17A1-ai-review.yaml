core_functions:
- description: 'Steroid 17-alpha-hydroxylase activity (EC 1.14.14.19): as a microsomal cytochrome P450
    monooxygenase, CYP17A1 hydroxylates the C21 steroids pregnenolone and progesterone at C17 to yield
    17-alpha-hydroxypregnenolone and 17-alpha-hydroxyprogesterone, the obligatory precursors for cortisol
    (glucocorticoid) biosynthesis, using O2 and electrons from NADPH via cytochrome P450 reductase.'
  molecular_function:
    id: GO:0004508
    label: steroid 17-alpha-monooxygenase activity
  directly_involved_in:
  - *id002
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - *id001
- description: Oxidative C17-C20 side-chain cleavage of 17alpha-hydroxysteroids to C19 androgen precursors
    plus acetate (EC1.14.14.32; RHEA:50244 and RHEA:14753). Human CYP17A1 strongly favors 17alpha-hydroxypregnenolone
    to DHEA over the Delta4 route to androstenedione. Cytochrome b5 stimulates coupling and can donate
    the second electron; no exclusive allosteric mechanism is assumed.
  directly_involved_in:
  - id: GO:0006702
    label: androgen biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:40340376
    supporting_text: In contrast, the 17,20-lyase reaction involves cleavage of a carbon-carbon bond rather
      than the equivalent of oxygen insertion into a carbon-hydrogen bond
  - *id001
  proposed_molecular_function: steroid 17,20-lyase activity
- description: 'Heme binding: CYP17A1 is a heme-thiolate cytochrome P450 whose heme prosthetic group (iron
    axially coordinated by Cys442) is essential for its monooxygenase/lyase catalysis; heme/iron binding
    is the supporting cofactor function underpinning both catalytic activities.'
  molecular_function:
    id: GO:0020037
    label: heme binding
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:22266943
    supporting_text: bind the haem iron
