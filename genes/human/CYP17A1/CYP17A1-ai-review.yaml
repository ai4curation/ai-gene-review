id: P05093
gene_symbol: CYP17A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP17A1 is an endoplasmic-reticulum membrane heme cytochrome P450 expressed in human adrenal
  cortex and gonads. Its 17alpha-hydroxylase activity converts pregnenolone and progesterone to their
  17alpha-hydroxy derivatives, supplying cortisol synthesis and androgen precursors. Its distinct oxidative
  17,20-lyase reaction removes the C17 side chain to produce C19 steroids. Human lyase activity strongly
  favors the Delta5 substrate 17alpha-hydroxypregnenolone, yielding DHEA; 17alpha-hydroxyprogesterone
  is a much poorer lyase substrate. POR supplies reducing equivalents from NADPH, and cytochrome b5 enhances
  lyase coupling and can supply the second electron. Loss-of-function variants impair corticosteroid and
  sex-steroid synthesis.
