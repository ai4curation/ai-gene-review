id: Q13625
gene_symbol: TP53BP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TP53BP2 encodes ASPP2, an ankyrin-repeat/SH3 scaffold that binds p53-family transcription factors and biases their nuclear transcriptional output toward pro-apoptotic genes. ASPP2 also occupies cytoplasmic, perinuclear and epithelial-junction pools, binds regulators such as Bcl-2, RELA, PP1, DDX42 and APP-BP1/NAE1, and links these interactions to apoptosis, NEDD8-dependent cell-cycle control and epithelial plasticity.'
alternative_products:
