- term:
    id: GO:0002039
    label: p53 binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001538228
  - UniProtKB:Q13625
  - WB:WBGene00000146
  review:
    summary: Accept p53 binding by ASPP2.
    action: ACCEPT
    reason: ASPP2 was defined as a p53-binding ASPP-family protein, its C-terminal ankyrin/SH3 region binds p53-family core domains, and the IBA/InterPro rows propagate this conserved ASPP1/2 activity onto the correct human ASPP2 subfamily.
    supported_by:
    - reference_id: PMID:11684014
      supporting_text: ASPP proteins interact with p53 and specifically enhance p53-induced apoptosis but not cell cycle arrest.
    - reference_id: PMID:14729977
      supporting_text: By binding to p63 and p73 in vitro and in vivo, ASPP1 and ASPP2 stimulate the transactivation function of p63 and p73 on the promoters of Bax, PIG3, and PUMA but not mdm2 or p21(WAF-1/CIP1).
    - reference_id: file:human/TP53BP2/TP53BP2-deep-research-manual.md
      supporting_text: TP53BP2 encodes ASPP2, a pro-apoptotic ASPP-family scaffold whose best-supported molecular function is binding TP53-family transcription factors through its C-terminal ankyrin-repeat/SH3 region.
