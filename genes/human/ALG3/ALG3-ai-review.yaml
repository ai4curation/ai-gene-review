id: Q92685
gene_symbol: ALG3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALG3 is a multipass endoplasmic reticulum membrane glycosyltransferase that initiates
  the lumenal extension of the lipid-linked N-glycan precursor. It transfers mannose from
  dolichyl-phosphate-mannose to Man5GlcNAc2-PP-dolichol in an alpha-1,3 linkage, forming
  Man6GlcNAc2-PP-dolichol. This sixth-mannose addition builds the precursor used in protein N-linked
  glycosylation. Biallelic pathogenic variants cause ALG3 congenital disorder of glycosylation, with
  accumulation of truncated precursors and abnormal protein glycosylation. Human cells also express
  processed ALG3 species and interacting forms whose additional functions remain less well defined.
