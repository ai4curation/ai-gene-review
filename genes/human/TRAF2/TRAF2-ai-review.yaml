- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: EXP
  original_reference_id: PMID:26620909
  qualifier: enables
  review:
    summary: TRAF2 has a RING domain, and recombinant TRAF2 free of cIAPs catalyses K63-linked ubiquitination
      of RIP1 and itself in vitro, but only in the presence of sphingosine-1-phosphate. PAINT places ubiquitin-protein
      transferase activity at the vertebrate TRAF2 node (PTN002562154). However, the TRAF2 RING interface
      is structurally unable to engage Ubc13-type E2s, Sphk1 is dispensable for TRAF2 function in vivo,
      and the TRAF2 RING is dispensable for MAVS signaling, where its E3 activity is redundant with LUBAC.
    action: KEEP_AS_NON_CORE
    reason: 'The activity is supported by in vitro reconstitution and is accepted by PAINT, so it is not
      removed. It is non-core: most TRAF2 signaling output can be explained by recruitment of cIAP1/2
      and other E3s, and genetic tests show the RING is often dispensable. Cell-based ubiquitination results
      (GbetaL/MLST8, NLRC5) do not separate TRAF2 catalysis from that of associated cIAPs.'
    supported_by:
    - &id006
      reference_id: PMID:20577214
      supporting_text: In agreement with previous studies 20,21, incubation of purified RIP1 with recombinant
        TRAF2, ubiquitin, the ubiquitin-activating enzyme E1, and Ubc13/Uev1a, an E2 that facilitates
        Lys 63 polyubiquitination, failed to produce ubiquitinated RIP1. Remarkably however, addition
        of S1P induced efficient TRAF2-mediated ubiquitination of RIP1 (Fig. 3a).
    - &id007
      reference_id: PMID:19810754
      supporting_text: 'These structural differences prevent TRAF2 from interacting with Ubc13

        and other related E2s via steric clash and unfavorable interfaces. Our

        structural observation should prompt a re-evaluation of the role of TRAF2 in

        TNFalpha signaling and may indicate that TRAF2-associated proteins such as cIAPs

        may be the ubiquitin ligases for NF-kappaB signaling.'
    - &id008
      reference_id: PMID:23951545
      supporting_text: whereas the E3 ligase activity of TRAF2 is redundant with that of LUBAC in the
        Traf2-dependent pathway downstream of MAVS
    - &id009
      reference_id: PMID:26701909
      supporting_text: 'Keratinocyte-specific deletion of Traf2, but not

        Sphk1 deficiency, disrupted TNF mediated NF-κB and MAP kinase signalling'
