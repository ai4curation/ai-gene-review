- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: EXP
  original_reference_id: PMID:26620909
  qualifier: enables
  review:
    summary: 'Intrinsic TRAF2 ubiquitin-transfer activity is contested at the mechanistic level: the RING/E2
      structural and biochemical study finds an unfavorable E2 interface, whereas a later purified-protein
      study reports S1P-dependent RIP1 ubiquitination and excludes detectable cIAP1/2 contamination. The
      positive assay cannot be discarded from the negative study alone, nor can cIAP recruitment establish
      TRAF2 catalysis. A universal autonomous E3 assignment remains unresolved.'
    action: UNDECIDED
    reason: 'Intrinsic TRAF2 ubiquitin-transfer activity is contested at the mechanistic level: the RING/E2
      structural and biochemical study finds an unfavorable E2 interface, whereas a later purified-protein
      study reports S1P-dependent RIP1 ubiquitination and excludes detectable cIAP1/2 contamination. The
      positive assay cannot be discarded from the negative study alone, nor can cIAP recruitment establish
      TRAF2 catalysis. A universal autonomous E3 assignment remains unresolved.'
    supported_by: &id005
    - &id026
      reference_id: PMID:19810754
      supporting_text: 'These structural differences prevent TRAF2 from interacting with Ubc13

        and other related E2s via steric clash and unfavorable interfaces. Our

        structural observation should prompt a re-evaluation of the role of TRAF2 in

        TNFalpha signaling and may indicate that TRAF2-associated proteins such as cIAPs

        may be the ubiquitin ligases for NF-kappaB signaling.'
    - &id017
      reference_id: PMID:20577214
      supporting_text: In agreement with previous studies 20,21, incubation of purified RIP1 with recombinant
        TRAF2, ubiquitin, the ubiquitin-activating enzyme E1, and Ubc13/Uev1a, an E2 that facilitates
        Lys 63 polyubiquitination, failed to produce ubiquitinated RIP1. Remarkably however, addition
        of S1P induced efficient TRAF2-mediated ubiquitination of RIP1 (Fig. 3a).
