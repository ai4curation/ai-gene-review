  supporting_entities:
  - UniProtKB:O60260
  review:
    summary: TRAF2 forms stable complexes with the cIAP1/cIAP2 E3 ligases (one cIAP per TRAF2 trimer)
      and is also reported in complexes with other E3s such as Parkin; it is therefore part of ubiquitin
      ligase complexes.
    action: ACCEPT
    reason: Membership of TRAF2-cIAP E3 assemblies is directly shown by reconstitution of the cIAP1 BIR1-TRAF2
      coiled-coil complex. This holds whether or not TRAF2 itself contributes catalysis.
    supported_by:
    - &id001
      reference_id: PMID:20447407
      supporting_text: 'To fulfill

        this role, cIAPs must be recruited to the receptor complex by

        TNF-receptor-associated factor (TRAF) 2. In this study, we reconstituted the

        complex between baculoviral IAP repeat (BIR) 1 of cIAP1 and the coiled-coil

        region of TRAF2, solved the structure of BIR1 from cIAP1, and mapped key binding

        residues on each molecule using mutagenesis.'
    - &id002
      reference_id: PMID:20447407
      supporting_text: 'Biophysical analysis indicates that

        a single BIR1 domain binds the trimeric TRAF2 coiled-coil domain.'
