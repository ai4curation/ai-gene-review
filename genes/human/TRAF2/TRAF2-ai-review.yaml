  review:
    summary: The full text assays TRAF2-driven NF-kappaB as a TNFR2 comparison and explicitly contrasts
      it with TLR/TRAF6 signaling. This supports TRAF2-dependent NF-kappaB activity but does not directly
      resolve the broader TLR-pathway annotation. The specific annotation should be traced without assuming
      absence of all TRAF2 involvement in TLR biology.
    action: UNDECIDED
    reason: The full text assays TRAF2-driven NF-kappaB as a TNFR2 comparison and explicitly contrasts
      it with TLR/TRAF6 signaling. This supports TRAF2-dependent NF-kappaB activity but does not directly
      resolve the broader TLR-pathway annotation. The specific annotation should be traced without assuming
      absence of all TRAF2 involvement in TLR biology.
    supported_by:
    - &id024
      reference_id: PMID:26458771
      supporting_text: In contrast, TIFAB did not repress κB-site activation after transfection of TRAF2,
        a functionally related paralog of TRAF6 (Fig. 5 I). TIFAB represses TRAF6-, but not TRAF2-mediated
        NF-κB activation, implying that TIFAB selectively inhibits TLR/TRAF6-dependent NF-κB stimuli while
        having no effect on TNFR2/TRAF2-dependent NF-κB stimuli.
