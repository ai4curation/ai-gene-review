- term:
    id: GO:0002224
    label: toll-like receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:26458771
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'The cited study (TIFAB) uses TRAF2 only as a comparator: TIFAB does not repress TRAF2-driven
      NF-kappaB, which the authors attribute to TNFR2/TRAF2 rather than TLR/TRAF6 signaling.'
    action: UNDECIDED
    reason: The cited text does not show TRAF2 acting in a TLR pathway; if anything it contrasts TRAF2
      with the TLR/TRAF6 branch. Other work (TICAM1 ubiquitination, MAVS-dependent signaling) suggests
      TRAF2 can act in innate-immune pathways, so the claim is not rejected, but this reference does not
      support it.
    supported_by:
    - &id026
      reference_id: PMID:26458771
      supporting_text: In contrast, TIFAB did not repress κB-site activation after transfection of TRAF2,
        a functionally related paralog of TRAF6 (Fig. 5 I). TIFAB represses TRAF6-, but not TRAF2-mediated
        NF-κB activation, implying that TIFAB selectively inhibits TLR/TRAF6-dependent NF-κB stimuli while
        having no effect on TNFR2/TRAF2-dependent NF-κB stimuli.
