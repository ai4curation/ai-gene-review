id: Q12933
gene_symbol: TRAF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TRAF2 is a cytoplasmic adaptor that organizes TNF receptor superfamily signaling complexes.
  Its C-terminal TRAF region engages receptors and associated proteins, while oligomerization and recruitment
  of cIAP ubiquitin ligases connect receptor activation to NF-kappaB, MAP kinase signaling and regulation
  of cell survival. TRAF2 also participates in selected immune-receptor and ER-stress signaling assemblies.
  Intrinsic ubiquitin-ligase activity has been reported in cofactor-dependent assays but remains mechanistically
  contested.
