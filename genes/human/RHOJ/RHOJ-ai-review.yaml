    label: G protein activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.6.5.2
  review:
    action: UNDECIDED
    summary: G protein activity requires a functional guanine-nucleotide-regulated signaling protein.
      The short product retains the N-terminal switch/effector region but loses key C-terminal features
      of the reference G-domain. Its signaling competence cannot be inferred from the full-length gene.
    supported_by:
    - *id001
    - reference_id: PMID:27660391
      supporting_text: 'Chimeras of TCL and TC10

        revealed amino acids 121-129 of TCL contributed to the differences in nucleotide

        loading.'
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001806
  - InterPro:IPR003578
  - InterPro:IPR005225
  - UniRule:UR002201975
  review:
    action: UNDECIDED
    summary: Several N-terminal nucleotide-contact residues are retained, but reference guanine-contact
      residue 136 is missing and a further contact at 177 is not conserved. The incomplete binding pocket
      makes GTP binding uncertain even though the full-length protein binds and hydrolyzes GTP.
    supported_by:
    - *id001
    - *id002
