id: G3V4H1
gene_symbol: RHOJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RHOJ (TCL, TC10-like) encodes a Cdc42-subfamily Rho GTPase that is expressed
  predominantly in vascular endothelial cells. The canonical 214-residue protein
  (Q9H4E5) cycles between GDP- and GTP-bound states with rapid intrinsic nucleotide
  exchange and measurable intrinsic GTP hydrolysis, is prenylated at a C-terminal
  CAAX box and localizes to the plasma membrane, early endosomes and focal adhesions.
  In GTP-bound form it engages CRIB-domain effectors and the cytoplasmic domain of
  PlexinD1, and it regulates endothelial migration, lumen and tube formation,
  focal-adhesion number and actomyosin contractility, integrating VEGF and Sema3E
  guidance cues during angiogenesis. G3V4H1 is a 153-residue product of an
  Ensembl transcript annotated as a nonsense-mediated decay target (RHOJ-204). It is
  identical to canonical RHOJ for residues 1-103, which include the N-terminal
  extension, the P-loop, switch I and the DTAGQE motif. The remaining 50 residues are
  an unrelated, predicted-disordered proline-rich tail. This tail replaces the
  guanine-base recognition motifs (G4 and G5), the distal loop that regulates
  nucleotide loading, and the prenylated C terminus. No experiment has tested whether
  this product is made, folds, or binds guanine nucleotide.
existing_annotations:
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001806
  - UniRule:UR002201975
  review:
    summary: >-
      Canonical RHOJ is an active GTPase, and PAINT places GTPase activity at the
      Rho-family root node PTN000632671 with Q9H4E5 among the experimental seeds. The
      IEA here, however, is a domain-signature transfer onto G3V4H1, whose
      signatures match only the shared N-terminal 103 residues. It lacks the G4/G5
      guanine-recognition motifs and the C-terminal half of the G domain.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GTPase activity is a true function of the RHOJ gene. Full-length TCL hydrolyzes
      GTP (PMID:10967094), and the Rho-family IBD node supports inheritance of the
      function by the RHOJ lineage. The annotation is made to G3V4H1, though, and that
      product is unlikely to carry out the reaction. G3V4H1 comes from an Ensembl
      nonsense-mediated-decay transcript. After residue 103 its sequence diverges into
      a proline-rich, predicted-disordered tail. The tail lacks the NKxD/TQxD (G4) and
      SAK/SAL (G5) motifs that recognize the guanine base and lacks the distal loop
      (canonical residues 121-129) that controls nucleotide loading
      (PMID:27660391). A half G domain is not expected to fold into a
      hydrolysis-competent pocket. Because the claim is right for the gene but not supported for
      this product, it is marked as an over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:10967094
      supporting_text: >-
        In vitro, TCL shows rapid GDP/GTP exchange and displays higher GTP
        dissociation and hydolysis rates than TC10.
    - reference_id: PMID:27660391
      supporting_text: >-
        Chimeras of TCL and TC10 revealed amino acids 121–129 of TCL contributed to the
        differences in nucleotide loading.
    - reference_id: file:human/RHOJ/RHOJ-bioinformatics/RESULTS.md
      supporting_text: 'Exact shared N-terminal prefix: residues 1-103; downstream sequence
        is divergent.'
    - reference_id: file:human/RHOJ/RHOJ-bioinformatics/RESULTS.md
      supporting_text: '| ENST00000557447 (G3V4H1 source) | RHOJ-204 | nonsense_mediated_decay
        | False | 153 |'
- term:
    id: GO:0003925
    label: G protein activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.6.5.2
  review:
    summary: >-
      This annotation is an EC-to-GO mapping from EC 3.6.5.2. The EC number on
      G3V4H1 is itself an ARBA rule prediction. G protein activity (a
      nucleotide-regulated molecular switch) is appropriate for canonical RHOJ. It
      is not supported for a product that lacks the guanine-recognition half of the
      G domain and the membrane-targeting C terminus.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Canonical RHOJ acts as a GTP-dependent switch. Its GTP-bound form binds PAK and
      PlexinD1, and its membrane localization follows its activation state
      (PMID:27660391, PMID:32347571). G3V4H1 keeps switch I and the start of switch
      II, but the switch cycle depends on a G domain that can bind nucleotide. That
      requires the G4/G5 motifs, which this product does not have. The protein also
      lacks the CAAX prenylation site that brings canonical RHOJ to membranes, so a
      signaling switch function is not supported for this product. The term is
      consistent with the GTPase activity row: true for the gene, over-annotated for
      this product.
    supported_by:
    - reference_id: PMID:27660391
      supporting_text: >-
        These results indicate that TCL localization is dependent on its activation
        state but also suggest the N terminus somehow influences or facilitates the
        activation of wild-type TCL.
    - reference_id: PMID:32347571
      supporting_text: >-
        In the GTP-bound state, RhoJ interacts with the cytoplasmic domain of
        PlexinD1.
    - reference_id: file:human/RHOJ/RHOJ-bioinformatics/RESULTS.md
      supporting_text: '| Lipidation: S-farnesyl cysteine | 211-211 | False | 0 | 0 |'
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001806
  - InterPro:IPR003578
  - InterPro:IPR005225
  - UniRule:UR002201975
  review:
    summary: >-
      G3V4H1 keeps the residues that contact the GTP phosphates and Mg2+ (P-loop
      residues 31-36, switch I T53, DTAGQE D75/G78). It lacks the canonical
      guanine-base contacts at residue 136 (G4) and 177 (G5), and it lacks the
      distal loop that regulates nucleotide loading. Specific GTP binding is
      therefore not supported for this product, although it is a property of
      canonical RHOJ.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Canonical RHOJ binds GTP (PMID:10967094, PMID:27660391), and the Rho-family
      PAINT node propagates GTP binding to this lineage. Guanine specificity in Ras
      superfamily G domains depends on the G4 and G5 loops, which lie downstream of
      the point where G3V4H1 diverges. Even in the full-length protein, nucleotide
      loading is sensitive to remote sequence changes: deleting four N-terminal
      residues or swapping loop 121-129 alters mant-GTP loading (PMID:27660391).
      A product missing roughly half of the fold is unlikely to bind GTP with the
      specificity this term implies. This matches the other two rows and gives a
      consistent judgement: the term is correct for the gene but over-annotated
      for this NMD-transcript product.
    supported_by:
    - reference_id: PMID:27660391
      supporting_text: >-
        More interestingly, however, the deletion of the N terminus of TC10 did not
        affect its ability to load with mant-GTP, whereas deletion of the TCL N
        terminus significantly disrupted mant-GTP binding.
    - reference_id: file:human/RHOJ/RHOJ-bioinformatics/RESULTS.md
      supporting_text: '| Binding site:  | 136-136 | False | 0 | 0 |'
    - reference_id: file:human/RHOJ/RHOJ-bioinformatics/RESULTS.md
      supporting_text: '| Binding site:  | 177-177 | False | 1 | 0 |'
