core_functions: []
suggested_questions:
- question: Is the G3V4H1 polypeptide (RHOJ-204, an NMD-annotated transcript) translated
    and stable in endothelial cells, or is the transcript degraded before appreciable
    protein accumulates?
- question: If expressed, does the N-terminal half-G-domain fragment bind guanine
    nucleotide or sequester CRIB effectors or PlexinD1 in a dominant-negative manner?
suggested_experiments:
- description: Targeted mass spectrometry for peptides spanning the unique G3V4H1
    junction and tail (residues ~100-153) in HUVEC lysates, with and without NMD
    inhibition (UPF1 knockdown or cycloheximide), to establish whether the product
    exists.
- description: Express recombinant G3V4H1 and test folding (CD/thermal shift) and
    mant-GTP/mant-GDP binding alongside canonical RHOJ as a positive control.
