core_functions: []
suggested_questions:
- question: Does any G3V4H1 polypeptide (residues 1-103 of RHOJ plus a 3'-UTR-encoded proline-rich tail)
    accumulate in endothelial cells, or is the ENST00000557447 transcript removed by nonsense-mediated decay
    before appreciable translation? Proteomic support for this entry could come from peptides in the shared
    residues 1-103 rather than from the unique tail.
- question: Should the gene-level RHOJ GTPase annotations (GTPase activity, GTP binding, plasma membrane,
    angiogenesis-related processes) be curated on the canonical Q9H4E5 entry instead of on electronically
    annotated alternative gene models such as G3V4H1?
suggested_experiments:
- description: Targeted mass spectrometry or immunoblotting with an antibody raised against the unique
    G3V4H1 C-terminal tail in HUVECs, with and without NMD inhibition (UPF1 knockdown or cycloheximide),
    to test whether the product is made at all.
- description: If the product is detectable, express recombinant G3V4H1 and measure mant-GTP binding and
    intrinsic GTP hydrolysis beside full-length RHOJ, to test whether the half G-domain binds guanine nucleotide.
