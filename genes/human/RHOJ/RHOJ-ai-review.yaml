- id: PMID:27660391
  title: TCL/RhoJ Plasma Membrane Localization and Nucleotide Exchange Is Coordinately
    Regulated by Amino Acids within the N Terminus and a Distal Loop Region.
  findings:
  - statement: Residues 17-20 of the RHOJ N-terminal extension and the distal loop
      121-129 regulate nucleotide loading and plasma-membrane localization; RHOJ
      localization depends on activation state.
    supporting_text: >-
      Chimeras of TCL and TC10 revealed amino acids 121–129 of TCL contributed to the
      differences in nucleotide loading.
