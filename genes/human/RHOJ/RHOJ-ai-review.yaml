id: G3V4H1
gene_symbol: RHOJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RHOJ is a Cdc42-related small GTPase that regulates endothelial cytoskeletal organization
  and vascular morphogenesis. The 153-residue human G3V4H1 product shares its first 103 residues with
  the 214-residue reference RHOJ but has a divergent C-terminal portion that does not preserve the complete
  reference nucleotide-binding architecture or prenylated tail. Its nucleotide binding, hydrolysis and
  membrane association are unresolved.
existing_annotations:
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001806
  - UniRule:UR002201975
  review:
    action: UNDECIDED
    summary: Full-length RHOJ/TCL hydrolyzes GTP, but G3V4H1 preserves only the first 103 reference residues
      before a highly divergent tail. The complete nucleotide-binding architecture is not retained. Lack
      of exact-product biochemical measurements prevents assigning either normal hydrolysis or an active
      GTPase-deficient state.
    supported_by:
    - &id002
      reference_id: PMID:10967094
      supporting_text: 'In vitro, TCL shows rapid GDP/GTP

        exchange and displays higher GTP dissociation and hydolysis rates than TC10.'
    - &id001
      reference_id: file:human/RHOJ/RHOJ-bioinformatics/RESULTS.md
      supporting_text: '| Binding site:  | 136–136 | 0 / 1 | 0 |'
- term:
