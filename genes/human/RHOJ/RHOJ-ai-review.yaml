    review_notes: Full text cached. The N-terminal determinants are retained in G3V4H1
      but the 121-129 loop and CAAX terminus are not.
- id: PMID:21148427
  title: RhoJ/TCL regulates endothelial motility and tube formation and modulates actomyosin
    contractility and focal adhesion numbers.
  findings:
  - statement: Endogenous RHOJ localizes to focal adhesions and promotes endothelial
      motility and tube formation while restraining actomyosin contractility.
    supporting_text: >-
      RhoJ is endothelial-expressed in vivo, activated by vascular endothelial growth
      factor, localizes to focal adhesions, regulates endothelial cell migration and
      tube formation, and modulates actomyosin contractility and focal adhesion
      numbers.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; gene-level (canonical protein) background for the
      description.
- id: PMID:21628409
  title: RhoJ is an endothelial cell-restricted Rho GTPase that mediates vascular morphogenesis
    and is regulated by the transcription factor ERG.
  findings:
  - statement: RHOJ is an ERG target with endothelial-restricted expression and is
      required for endothelial lumen formation.
    supporting_text: >-
      Knock-down of RhoJ similarly resulted in a marked reduction in the ability of
      ECs to form lumens.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Gene-level background; does not address G3V4H1.
