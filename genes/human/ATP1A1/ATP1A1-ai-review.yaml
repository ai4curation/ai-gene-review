suggested_questions:
- question: Which original ATP1A1 target observations resolve the remaining sperm-flagellar,
    postsynaptic-density, membrane-raft and extracellular-vesicle localizations, and the LCK
    pair?
- question: Does proton influx or phosphomonoester hydrolysis contribute measurably to physiological
    human alpha1 pump function under defined conditions?
suggested_experiments:
- description: Measure coupled sodium/potassium flux and any proton current in matched human
    alpha1/beta/FXYD complexes under defined pH, voltage and ion conditions, separating wild-type
    behavior from variant-induced leaks.
- description: Resolve uncertain specialized localizations with endogenous alpha1-specific
    detection and appropriate fractionation, enrichment and paralog controls.
