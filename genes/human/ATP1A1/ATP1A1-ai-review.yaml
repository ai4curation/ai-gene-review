- id: PMID:10636900
  title: Transport and pharmacological properties of nine different human Na, K-ATPase
    isozymes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All nine human alpha/beta combinations were expressed in Xenopus
      oocytes. Complete normal abstract and selected original author-hosted Introduction/Methods
      were read, including pulse-chase, assembly immunoprecipitation and voltage-clamp
      methods. Human proteins in a frog host are direct human-protein evidence. Complete
      Results, supplementary data and figure pixels were not read. Source identity
      and title are preserved from the normal fetched record; this entry does not
      certify uninspected data. Official identity or the matching original paper was
      independently checked; verification is limited to the findings and access scope
      described here.
  full_text_unavailable: true
