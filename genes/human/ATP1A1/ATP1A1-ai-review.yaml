    reason: PMID11546672 measures ouabain binding in isolated human membrane preparations;
      those inspected assays alone do not establish a cellular response. Independent PMID10636900
      Methods, voltage-dependence Results and Figure 6 compare currents before and after 100
      micromolar ouabain in intact Xenopus oocytes expressing human alpha1/beta1, with endogenous
      currents subtracted. This functional inhibition is a change in cellular activity consistent
      with GO:0071383, and ouabain is classified as a steroid hormone. Retain the existing
      assertion as non-core using this additional evidence, without attributing the current
      assay to PMID11546672 or inferring a general endocrine-signaling function. The official
      ChEBI record explicitly asserts CHEBI:472805 (ouabain) is_a CHEBI:26764 (steroid hormone),
      independently of its is_a CHEBI:38092 (cardenolide glycoside) relation. This retention
      is bounded to the pharmacological effect on cellular pump current in the stated Xenopus
      host, not a rule that any ligand binding by any enzyme establishes a physiological response
      process.
