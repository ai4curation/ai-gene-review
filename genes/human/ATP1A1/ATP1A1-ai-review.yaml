core_functions:
- description: Hydrolyzes ATP to export three sodium ions and import two potassium
    ions across the plasma membrane, maintaining the gradients used for membrane potential
    and secondary transport.
  molecular_function:
    id: GO:0005391
    label: P-type sodium:potassium-exchanging transporter activity
  in_complex:
    id: GO:0005890
    label: sodium:potassium-exchanging ATPase complex
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0036376
    label: sodium ion export across plasma membrane
  - id: GO:1990573
    label: potassium ion import across plasma membrane
  supported_by:
  - reference_id: PMID:10636900
    supporting_text: 'all

      human isozymes are functional but differ in their turnover rates depending on

      the alpha isoform.'
    full_text_unavailable: true
  - reference_id: PMID:35803952
    supporting_text: 'During each Post-Albers cycle, NKA exchanges three

      cytoplasmic sodium ions for two extracellular potassium ions'
    full_text_unavailable: false
suggested_questions:
- question: Which original ATP1A1 target observations resolve the remaining sperm-flagellar,
    postsynaptic-density, membrane-raft and extracellular-vesicle localizations, and
    the LCK pair?
- question: Does proton influx or phosphomonoester hydrolysis contribute measurably
    to physiological human alpha1 pump function under defined conditions?
suggested_experiments:
- description: Measure coupled sodium/potassium flux and any proton current in matched
    human alpha1/beta/FXYD complexes under defined pH, voltage and ion conditions,
    separating wild-type behavior from variant-induced leaks.
- description: Resolve uncertain specialized localizations with endogenous alpha1-specific
    detection and appropriate fractionation, enrichment and paralog controls.
