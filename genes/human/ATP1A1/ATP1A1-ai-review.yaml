- term:
    id: GO:0086064
    label: cell communication by electrical coupling involved in cardiac conduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00098243
  review:
    summary: The cardiac intercellular electrical-coupling term exceeds the demonstrated
      pump/contractility mechanism.
    action: MARK_AS_OVER_ANNOTATED
    reason: The annotation is too specific for the established pump/contractility
      evidence. GO:0086064 concerns current passing between adjacent cytoplasms through
      intercellular protein channels. The cited mouse beta1-knockout paper measures
      secondary alpha1 reduction, pump activity and cardiac calcium/contractile physiology,
      not that intercellular step. This is a process-scope overannotation, not a title-based
      beta1 misattribution or a denial of ATP1A1 cardiac relevance. Preserve the original
      TAS/ARBA assertions and do not manufacture a new process.
