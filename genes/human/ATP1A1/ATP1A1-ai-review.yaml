id: P05023
gene_symbol: ATP1A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP1A1 encodes the catalytic alpha1 subunit of the sodium/potassium ATPase, a
  widely expressed P-type ion pump in the plasma membrane. Its transmembrane ion-binding sites
  and cytoplasmic ATPase domains couple ATP hydrolysis to export of three sodium ions and
  import of two potassium ions. Alpha1 assembles with a beta subunit and can associate with
  FXYD regulatory proteins. This electrogenic exchange maintains sodium and potassium gradients
  that support membrane potential, cell-volume control and secondary transport. Membrane polarity
  and partner-dependent regulation vary between tissues.
