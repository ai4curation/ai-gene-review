- id: PMID:10636900
  title: Transport and pharmacological properties of nine different human Na, K-ATPase isozymes.
  findings:
  - statement: Human alpha/beta isozymes expressed in Xenopus oocytes show functional pump
      currents and isoform-dependent ouabain pharmacology; the protein species and host remain
      distinct.
    supporting_text: isoform-specific differences exist in the K(+)/ouabain antagonism
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All nine human alpha/beta combinations were expressed in Xenopus oocytes.
      Complete normal abstract and selected original author-hosted Introduction/Methods were
      read, including pulse-chase, assembly immunoprecipitation and voltage-clamp methods.
      Human proteins in a frog host are direct human-protein evidence. Complete Results, supplementary
      data and figure pixels were not read. Source identity and title are preserved from the
