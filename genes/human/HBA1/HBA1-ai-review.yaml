- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:21805676
  qualifier: located_in
  review:
    summary: Hemoglobin can occur extracellularly in release, scavenging and degradation contexts.
    action: KEEP_AS_NON_CORE
    reason: Retain PMID:21805676 as a contextual extracellular-location assertion. The independent haptoglobin
      pathway positively establishes cell-free alpha/beta hemoglobin. This does not imply conventional
      secretion, a physiological extracellular oxygen-delivery system, or participation in microbial proteolysis
      by the globin substrate. GO:0005576 remains valid; the commonly suggested GO:0005615 refinement
      is obsolete in live QuickGO.
    supported_by:
    - reference_id: Reactome:R-HSA-2168885
      supporting_text: Each haptoglobin dimer can bind two hemoglobin dimers, each containing hemoglobin
        alpha and hemoglobin beta.
    - reference_id: PMID:19740759
      supporting_text: Haptoglobins (Hp) bind with extracellular Hb
