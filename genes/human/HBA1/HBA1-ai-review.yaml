- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10390349
  qualifier: enables
  supporting_entities:
  - UniProtKB:P68871
  review:
    summary: The demonstrated globin association has a specific hemoglobin-assembly role.
    action: MODIFY
    reason: The original PMID:10390349 study examines ligand binding and crystal structures of alpha/beta
      hemoglobin mutants; its abstract does not establish assembly kinetics. The refinement to GO:0046982
      protein heterodimerization activity rests on the separately cited alpha-beta dimer and AHSP-displacement
      experiments (PMID:1552945 and PMID:15550245), together with the native alpha/beta interaction assertion.
      These directly establish the heterodimeric building block of hemoglobin, rather than inferring a
      molecular role from a screening partner alone. The original reference and partner remain unchanged.
      Mutant ligand behavior is not assigned to wild-type HBA1, and the refinement does not imply chaperone
      activity.
    supported_by:
    - reference_id: PMID:1552945
      supporting_text: they dissociate into alpha beta dimers that are cleared rapidly by renal filtration
    - reference_id: PMID:15550245
      supporting_text: why beta-hemoglobin can competitively displace AHSP to form HbA
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
