- term:
    id: GO:0015670
    label: carbon dioxide transport
  evidence_type: NAS
  original_reference_id: PMID:11159543
  qualifier: involved_in
  review:
    summary: Alpha-containing hemoglobin contributes directly to carbon dioxide carriage.
    action: ACCEPT
    reason: This retained NAS assertion is supported by the independent Reactome synthesis of N-terminal
      carbamation and the Haldane effect. Globin supplies its own reversible CO2-binding chemistry, so
      this is active carriage rather than a passive requirement for another enzyme. CO2 carriage is distinct
      from heme binding of carbon monoxide, and carbonic-anhydrase catalysis is not assigned to HBA1.
      The original structural/variant source alone is not treated as a direct assay of every transport
      step.
    supported_by:
    - reference_id: Reactome:R-HSA-1237325
      supporting_text: chemical reaction (carbamation) of the N-terminal valines of HbA by CO2
    - reference_id: Reactome:R-HSA-1247668
      supporting_text: facilitates the exchange of CO2 for O2 in the lungs
