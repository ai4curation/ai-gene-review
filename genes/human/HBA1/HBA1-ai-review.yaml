id: P69905
gene_symbol: HBA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HBA1 encodes one of the two identical human alpha-globin protein products. Heme-bound alpha
  chains assemble with beta-like globins into hemoglobin heterotetramers, including adult HbA and HbA2,
  fetal HbF and embryonic Gower-2. In erythrocytes, these assemblies reversibly bind oxygen and couple
  cooperative oxygen loading and unloading to proton binding and carbon dioxide carriage. Alpha-globin
  is also expressed in vascular endothelial cells, where its heme redox chemistry influences nitric oxide
  availability. Cell-free hemoglobin associates with haptoglobin during scavenging and can undergo damaging
  peroxide-dependent reactions. Alpha-globin-derived peptides have receptor-modulatory activities that
  depend on sequence and processing; these activities are distinct from those of the intact oxygen-carrier
  protein.
