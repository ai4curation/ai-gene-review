functional_isoforms:
- id: HBA1_MATURE_ALPHA
  name: Mature alpha-globin
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000052653
    residues: 2-142
  description: Mature alpha-globin after initiator-methionine removal. The identical HBA1/HBA2 protein
    product binds heme and contributes to hemoglobin gas transport; most protein-level assays do not distinguish
    its locus of origin.
- id: HBA1_HEMOPRESSIN
  name: Hemopressin segment
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000455882
    residues: 96-104
  description: UniProt-annotated internal segment PVNFKLLSH. PMID:18077343 studied the different rat sequence
    PVNFKFLSH. The human/mouse-sequence nine-mer has pharmacological evidence in administered rodent experiments
    (PMID:20505104), while human plasma evidence in PMID:22952224 concerns longer N-terminally extended
    pepcans. Those results do not establish endogenous human nine-mer abundance or assign cannabinoid-receptor
    activity to intact alpha-globin.
core_functions:
- description: Reversibly binds oxygen through its heme group as the alpha subunit of hemoglobin heterotetramers.
    Cooperative oxygen loading and unloading are coupled to proton binding and reversible N-terminal carbamation,
    contributing to carbon dioxide carriage and pulmonary release.
  molecular_function:
    id: GO:0005344
    label: oxygen carrier activity
  directly_involved_in:
  - id: GO:0015671
    label: oxygen transport
  - id: GO:0015670
    label: carbon dioxide transport
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005833
    label: hemoglobin complex
  supported_by:
  - reference_id: PMID:11307949
    supporting_text: its intrinsic oxygen affinity and response to the allosteric regulators chloride
      and 2,3-diphosphoglycerate
  - reference_id: PMID:16765986
    supporting_text: a hydrogen bond to exist between the distal histidine and oxygen ligand of both the
      alpha and beta-subunits
  - reference_id: Reactome:R-HSA-1237325
    supporting_text: chemical reaction (carbamation) of the N-terminal valines of HbA by CO2
  - reference_id: Reactome:R-HSA-1247668
    supporting_text: facilitates the exchange of CO2 for O2 in the lungs
knowledge_gaps:
- gap_statement: Whether the human nine-residue hemopressin sequence occurs endogenously, and its physiological
    abundance, source and receptor contribution, remain unresolved.
  boundary: The original CB1 study uses the rat-sequence peptide; a human/mouse-sequence nine-mer was
    administered pharmacologically to rodents; human plasma evidence identifies longer pepcans. These
    are distinct sequence and processing contexts.
  gap_kind:
  - BIOLOGY
  resolution: Measure endogenous human nine-mer separately from extended pepcans, with sequence-resolved
    quantification and receptor assays at measured concentrations.
  provenance:
  - reference_id: PMID:18077343
    supporting_text: hemopressin (PVNFKFLSH)
  - reference_id: PMID:22952224
    supporting_text: rodent brain extracts and human and mouse plasma
suggested_questions:
