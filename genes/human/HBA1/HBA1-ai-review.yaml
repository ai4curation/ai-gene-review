  - UniProtKB:P69892
  review:
    summary: Alpha-globin contributes heme-dependent oxygen carriage in hemoglobin.
    action: ACCEPT
    reason: GO_REF:0000033 is retained in the established respiratory-gas transport context. Human alpha-containing
      hemoglobins have measured oxygen affinity and cooperative function, corroborated by structural oxygen-binding
      evidence. Experiments on recombinant or variant assemblies support the alpha-chain role without
      making their altered affinity a property of wild-type HBA1. Protein-level experiments generally
      apply to the identical HBA1/HBA2 product. Where the original source is abstract-only or bibliographic-only,
      this decision rests on the independently accessible biochemical evidence and curated assertion,
      not a claim to have read its full text.
    supported_by:
    - reference_id: PMID:11307949
      supporting_text: its intrinsic oxygen affinity and response to the allosteric regulators chloride
        and 2,3-diphosphoglycerate
    - reference_id: PMID:16765986
      supporting_text: a hydrogen bond to exist between the distal histidine and oxygen ligand of both
        the alpha and beta-subunits
