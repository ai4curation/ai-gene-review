- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:9830011
  qualifier: enables
  supporting_entities:
  - UniProtKB:P68871
  review:
    summary: The demonstrated globin association has a specific hemoglobin-assembly role.
    action: MODIFY
    reason: The PMID:9830011 context concerns structural or assembly experiments on alpha-containing hemoglobin,
      rather than an otherwise uncharacterized screening pair. Alpha association with the beta-like globin
      partner forms the heterodimeric building block of the hemoglobin tetramer. GO:0046982 protein heterodimerization
      activity captures this demonstrated association more precisely than generic protein binding. This
      is not an assertion of protein chaperone activity or of altered mutant behavior in the normal alpha
      chain.
    supported_by:
    - reference_id: PMID:1552945
      supporting_text: they dissociate into alpha beta dimers that are cleared rapidly by renal filtration
    - reference_id: PMID:15550245
      supporting_text: why beta-hemoglobin can competitively displace AHSP to form HbA
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
