- term:
    id: GO:0098809
    label: nitrite reductase activity
  evidence_type: IDA
  original_reference_id: PMID:36302779
  qualifier: enables
  review:
    summary: Deoxygenated human alpha-globin directly reduces nitrite to nitric oxide.
    action: NEW
    reason: PMID:36302779 directly assays purified human alpha-globin with nitrite and measures formation
      of the ferrous-NO product under reducing, low-oxygen conditions. The globin heme performs the reduction;
      this is molecular activity rather than an inference from a vascular knockout phenotype. Use the
      current general GO:0098809 because GO:0050421 nitrite reductase (NO-forming) activity explicitly
      specifies cytochrome c in its reaction, which this dithionite-supported assay does not establish;
      GO:0008942 instead specifies NAD(P)H-dependent ammonium formation. Live QuickGO and OLS confirm
      this scope, and human myoglobin carries a direct-assay annotation to GO:0098809. No ancestral or
      descendant nitrite-reductase term is already present among the seeded annotations. Retain this as
      a contextual non-core activity outside the principal respiratory-carrier core. Mouse endothelial
      deletion and exercise experiments do not establish a human vascular-process annotation, and NO generation
      does not resolve the separate native NO-transport assertion. The protein assay applies to the identical
      HBA1/HBA2 alpha-globin product and does not identify its locus of origin.
    supported_by:
    - reference_id: PMID:36302779
      supporting_text: Human alpha globin (4 μM) or hemoglobin A (4 μM) were reacted with sodium nitrite
        (0.25–4 mM) in the presence of 1 mM sodium dithionite in 0.1 M sodium phosphate buffer, pH 7.4,
        at 25 °C.
      reference_section_type: METHODS
    - reference_id: PMID:36302779
      supporting_text: First, isolated deoxyferrous alpha globin was reacted with nitrite in the presence
        of sodium dithionite (Na2S2O4) to form NO-bound ferrous alpha globin
      reference_section_type: RESULTS
