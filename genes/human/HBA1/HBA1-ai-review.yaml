  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1237325
  qualifier: located_in
  review:
    summary: Hemoglobin carries respiratory gases in the erythrocyte cytosol.
    action: ACCEPT
    reason: The Reactome context places alpha-containing hemoglobin in the cytosolic gas-exchange or methemoglobin-reduction
      cycle. The alpha chain is a substrate of the reductase in the latter reaction; cytosolic location
      does not assign reductase catalysis to HBA1.
    supported_by:
