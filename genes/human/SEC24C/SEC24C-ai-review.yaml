core_functions:
- description: 'Cargo adaptor: as the COPII cargo-selection subunit, SEC24C recognises sorting signals
    in ER-membrane cargo (SNAREs via IxM motifs, STING1, GPI-anchored proteins via TMED10) and bridges
    them to the COPII coat for packaging into ER-to-Golgi transport vesicles.'
