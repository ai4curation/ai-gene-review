id: P53992
gene_symbol: SEC24C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SEC24C is the cargo-selection subunit of the coat protein complex II (COPII), which forms
  transport vesicles at endoplasmic-reticulum exit sites for anterograde ER-to-Golgi traffic. Within the
  inner COPII coat it pairs with a SEC23 subunit (the Sec23/24 complex) and, with SAR1-GTP and the Sec13/31
  outer cage, deforms the ER membrane and concentrates cargo. SEC24C recognises specific sorting signals
  in transmembrane cargo and cargo receptors: IxM motifs in the SNAREs GOSR2 and STX5, ER-exit motifs
  in STING1, and GPI-anchored proteins via the receptor TMED10. Its cargo repertoire overlaps with the
  paralogue SEC24D and differs from SEC24A/SEC24B. A structural zinc finger is part of the Sec24 fold.'
