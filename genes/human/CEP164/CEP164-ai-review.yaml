suggested_questions:
- question: Is there any genuine nuclear pool of CEP164 or DNA damage response function, given conflicting
    siRNA and knockout data?
- question: How is CEP164-TTBK2 binding regulated during the cell cycle and by centrosomal PI4P, and does
    TTBK2 phosphorylation of CEP164 feed back on distal appendage assembly?
suggested_experiments:
- description: In CEP164-knockout RPE-1 cells, rescue with WW-domain mutants that abolish TTBK2 binding
    versus mutants that abolish Rabin8 binding, to separate the TTBK2-recruitment and vesicle-docking
    contributions to ciliogenesis.
