      remains challenge-blocked. Five DAP components include CEP164. The detailed docking perturbation is CEP83,
      not a CEP164-only assay; independent human sources corroborate CEP164 location and assembly role.
- id: PMID:24982133
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full primary PMC HTML Results, figures and Methods independently read despite unchanged
      abstract-only cache. Human cDNAs, RPE1 loss/rescue and HEK293T co-IP; WW-dependent recruitment and TTBK2–CEP164
      targeting fusions support performed recruitment. No intrinsic kinase-activator function is inferred.
