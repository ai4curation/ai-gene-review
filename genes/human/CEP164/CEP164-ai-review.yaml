id: Q9UPV0
gene_symbol: CEP164
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP164 is a coiled-coil and WW-domain protein of mother-centriole distal appendages, extending toward
  their outer membrane-docking region. Its N-terminal region directly binds TTBK2 and recruits the kinase to the
  mother centriole, enabling early events in primary-cilium assembly. The C-terminal region targets CEP164 to appendages
  and binds Rabin8; CEP164 also supports ciliary membrane organization and centrosomal Rab8 accumulation; recent
  ultrastructure places its requirement after initial small-vesicle docking, in vesicle enlargement. Rab8 association
  in cell extracts is distinct from the direct Rabin8 interaction. Biallelic CEP164 variants cause a ciliopathy
  that can include nephronophthisis and retinal degeneration. Reported nuclear localization and DNA-damage-response
  functions remain contextually disputed.
