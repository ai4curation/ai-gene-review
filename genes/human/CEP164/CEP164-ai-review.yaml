      review_notes: Later human RPE1 knockout FIB-SEM retains small vesicles near distal appendages while enlargement
        is impaired. This challenges obligatory initial docking, not the original Rabin8 binding or broader ciliogenesis
        contribution.
      supported_by:
      - reference_id: PMID:42288497
        supporting_text: CEP164 is dispensable for MC docking to ciliary associated membranes.
