id: Q9UPV0
gene_symbol: CEP164
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CEP164 (centrosomal protein of 164 kDa) is a large coiled-coil protein that forms the outermost part
  of the distal appendages (ciliary transition fibers) of the mother centriole, extending to the appendage
  tip close to the membrane-docking site. It is recruited downstream of CEP83 and SCLT1 and remains on
  the centriole throughout the cell cycle. CEP164 is essential for primary cilium formation. Its N-terminal
  WW domain binds the kinase TTBK2 directly and recruits it to the mother centriole, where TTBK2 triggers
  removal of the CP110-CEP97 cap and recruitment of IFT machinery; a TTBK2 fusion to the CEP164 centriole-targeting
  domain is sufficient to rescue ciliogenesis in CEP164-depleted cells. CEP164 also binds Rabin8 and RAB8
  and is required to dock preciliary vesicles to the mother centriole. Biallelic CEP164 variants cause
  nephronophthisis 15 with retinal degeneration. A role in the nuclear DNA damage response has been reported
  but was not reproduced in CEP164-null cells.
