- id: PMID:42288497
  title: Characterization of membrane structures regulating primary ciliogenesis by quantitative isotropic ultrastructure
    imaging.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full selected Fig. 3 Results and cell-culture/CRISPR/CLEM Methods read. Human RPE1 KO and GFP-CEP164
      rescue; six KO reconstructions, five DAV-only quantified cells. Docking is operationally within 30 nm. Supports
      membrane-expansion scope, not autonomous membrane-fusion activity.
core_functions:
- description: Binds TTBK2 through its N-terminal WW-domain region and recruits it to mother-centriole distal appendages
    to initiate cilium assembly. Human domain-mutant and targeted-fusion rescue experiments establish the recruitment
    role. This is kinase binding and positioning, not CEP164 kinase or kinase-activator activity. A complementary
    C-terminal Rabin8-binding route contributes ciliary membrane organization and Rab8 accumulation; direct Rab8
    contact and a specific CEP164-mediated ternary bridge remain unestablished. Recent human-cell ultrastructure
    refines an obligatory initial-docking model toward membrane expansion after small-vesicle docking. The Rabin8
    evidence remains a distinct interaction route; it does not establish an additional GEF or defined ternary-adaptor
    activity for CEP164.
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0005813
    label: centrosome
  - id: GO:0005814
    label: centriole
  in_complex:
    id: GO:0097539
    label: ciliary transition fiber
  supported_by:
  - reference_id: PMID:24982133
    supporting_text: complex formation is crucial for the recruitment of TTBK2 to basal bodies
  - reference_id: PMID:34499853
    supporting_text: CEP164-NTD binding does not stimulate TTBK2 autophosphorylation
  - reference_id: PMID:23253480
    supporting_text: 6His-Rabin8 bound to MBP-Cep164-C but not to MBP alone
  - reference_id: PMID:29789620
  - reference_id: PMID:42288497
suggested_questions:
- question: Do cell-type or construct differences explain the positive nuclear CEP164 reports and HPA staining versus
    the negative localization/DDR results in genome-edited cells? Matched endogenous tagging and antibody controls
    in the same cell lines would distinguish these possibilities.
- question: How does the direct CEP164–Rabin8 contact promote vesicle docking relative to the TTBK2-recruitment
    route, given that direct CEP164–Rab8 binding and centrosomal Rabin8 recruitment were not demonstrated in the
    tested purified-protein/imaging assays?
suggested_experiments:
- description: Compare endogenous-tag CEP164 localization with HPA037606 and HPA061504 staining in matched parental
    and CEP164-null A-431, U-251MG and RPE-1 cells, before and after defined DNA damage; pair imaging with expression-matched
    rescue.
