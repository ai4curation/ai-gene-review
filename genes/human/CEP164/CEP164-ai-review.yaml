    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full selected Results and Methods: human CEP1641–109/TTBK21074–1087 binding and peptide-fusion/nanobody-assisted
      structures; RPE1 rescue. Full-length constructs report CEP164 T988S and TTBK2 L8P natural variants. Isolated
      CEP164 NTD did not enhance TTBK2 autophosphorylation. A structure of the entire intact appendage is not claimed.'
  title: Molecular mechanisms underlying the role of the centriolar CEP164-TTBK2 complex in ciliopathies.
  findings: []
- id: PMID:23253480
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full selected Results/Figs. 6–8 and Methods distinguish direct purified CEP164-C–Rabin8 binding
      from Rab8 association in extracts. Purified Rab8a-T22N did not bind in the tested assay; centrosomal Rabin8
      was not detectably imaged. Human-cell perturbation supports docking and Rab8 recruitment, not CEP164 GEF activity.
      Its obligatory initial-docking interpretation is separately marked disputed by 42288497.
  title: Cep164 mediates vesicular docking to the mother centriole during early steps of ciliogenesis.
  findings:
