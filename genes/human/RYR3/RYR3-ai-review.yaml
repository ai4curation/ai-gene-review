id: Q15413
gene_symbol: RYR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RYR3 encodes a ryanodine-sensitive calcium-release channel that forms large homotetrameric channels
  in sarcoplasmic or endoplasmic-reticulum membranes. Its channel core releases stored Ca2+ into the cytosol and
  is allosterically regulated by cytosolic Ca2+, adenine nucleotides, caffeine, magnesium and ryanodine.
