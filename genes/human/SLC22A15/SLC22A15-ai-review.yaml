core_functions:
- description: Polyspecific, low-affinity transport of zwitterionic amino-acid betaines and
    derivatives across the plasma membrane. SLC22A15 takes up (and can efflux) a chemically
    related set of small zwitterions, with glycine betaine a directly demonstrated substrate
    and ergothioneine, carnosine and creatine among its preferred/high-fold substrates. It is
    low-affinity and its definitive coupling mechanism (sodium symport vs sodium-modulated
    facilitated diffusion) and physiological substrate remain unresolved.
  molecular_function:
