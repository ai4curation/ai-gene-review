taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A15 (FLIPT1, "Fly-like putative transporter 1") is a 547-residue,
  multi-pass plasma-membrane protein of the SLC22 / organic cation transporter (OCT/OCTN/OAT)
  family within the major facilitator superfamily. Long classified as an orphan transporter,
  it was characterized as a polyspecific, low-affinity transporter that prefers zwitterions
  (amino-acid betaines and their derivatives) over organic cations, and essentially excludes
  anions. Demonstrated substrates include glycine betaine, carnitine and acetylcarnitine
  (transported bidirectionally), ergothioneine, carnosine, creatine, N,N-dimethylglycine
  and glycylsarcosine, together with weaker cationic substrates such as thiamine, MPP+ and
  cimetidine; it does not transport agmatine. Transport is sodium-dependent but lithium can
  substitute for sodium, and the carrier also mediates facilitative efflux, so the precise
  coupling mechanism (sodium symport versus sodium-modulated facilitated diffusion) is not
  settled. The protein is broadly expressed, with highest levels in kidney and brain. Its
  physiological role, principal in vivo substrate(s) and the basis of reported genetic
  associations (albuterol response, tumour growth) remain to be established.
