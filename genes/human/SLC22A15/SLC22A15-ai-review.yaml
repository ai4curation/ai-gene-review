suggested_questions:
- question: What is the physiological role and principal in vivo substrate of SLC22A15? The
    protein transports many zwitterions in vitro at low affinity, but which of these (if any)
    it handles physiologically in kidney, brain or other tissues, and whether it contributes
    to ergothioneine, carnosine or carnitine homeostasis in vivo, is unknown.
- question: What is the transport mechanism and coupling stoichiometry? Uptake is sodium-dependent
    yet lithium substitutes for sodium and the carrier also effluxes substrates, leaving open
    whether SLC22A15 is a sodium symporter or a facilitated carrier allosterically modulated
    by sodium.
- question: What is the mechanistic basis of the reported genetic associations of SLC22A15
    with albuterol (anti-asthmatic) response and with tumour growth, given its newly defined
    zwitterion-transport function?
suggested_experiments:
- description: Generate and phenotype Slc22a15-knockout mice (and human loss-of-function
    carriers) with targeted and untargeted metabolomics of plasma, kidney and brain to identify
    which zwitterions (ergothioneine, carnosine, carnitine/acylcarnitines, creatine, betaine)
    accumulate or are depleted, establishing the physiological substrate(s).
- description: Reconstitute purified SLC22A15 in proteoliposomes and measure ergothioneine,
    carnosine, betaine and carnitine flux under controlled sodium/lithium gradients and
    membrane potential, with electrophysiology, to resolve the coupling mechanism and
    electrogenicity.
- description: Map tissue- and polarity-specific localization of endogenous SLC22A15
    (e.g. apical vs basolateral in kidney tubule and at the blood-brain barrier) by validated
    antibody immunohistochemistry to define where it acts in vivo.
