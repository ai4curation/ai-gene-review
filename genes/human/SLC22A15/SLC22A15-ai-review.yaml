  review:
    summary: Proposed new annotation - SLC22A15 directly transports carnitine (and acetylcarnitine)
      bidirectionally; a well-supported substrate-specific MF absent from GOA.
    action: NEW
    reason: >-
      Carnitine transport is directly demonstrated: saturable [14C]-carnitine uptake (Km = 99
      uM, the highest-affinity of the four substrates kinetically characterized) plus quinidine-sensitive
      carnitine efflux, and UniProt curates (R)-carnitine(in)=(R)-carnitine(out) and
      O-acetyl-(R)-carnitine catalytic activities to this paper with experimental evidence
      (ECO:0000269|PubMed:33124720). SLC22A15 was historically designated a carnitine transporter
      on phylogenetic grounds, now experimentally confirmed. The specific non-obsolete MF
      GO:0015226 captures this and is absent from GOA; added as a conservative NEW annotation.
      Carnitine is a quaternary-ammonium betaine but is not an amino-acid betaine (GO:0015199),
      so the two MF terms are complementary, not redundant.
    supported_by:
    - reference_id: PMID:33124720
      supporting_text: In our studies, SLC22A15 transports ergothioneine and carnitine, although
        ergothioneine seems to be preferred over carnitine
    - reference_id: PMID:33124720
      supporting_text: our experiments indicated that SLC22A15 was able to efflux carnitine
        and this process was inhibited by quinidine
    - &uni_func_carn
