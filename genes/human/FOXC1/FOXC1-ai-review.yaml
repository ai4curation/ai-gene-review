id: Q12948
gene_symbol: FOXC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXC1 is a forkhead-family nuclear transcription factor that recognizes defined regulatory
  DNA sequences and activates transcription through regions flanking its winged-helix DNA-binding domain.
  Its demonstrated targets include FOXO1 in human ocular cells. Protein partners and growth-factor signaling
  can alter its transcriptional output or stability. FOXC1 contributes to eye, cardiovascular, renal,
  skeletal and mesenchymal developmental programs; in some settings it acts through signals produced by
  surrounding mesenchyme rather than within the responding tissue. Proliferation, migration and differentiation
  effects vary with cellular context. In selected cancer cells, FOXC1 also associates with GLI2 and enhances
  GLI2-dependent transcription, a context distinct from direct FOXC1 binding to its own target motifs.
