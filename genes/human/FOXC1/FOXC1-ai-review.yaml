  review:
    summary: FOXC1 variation is associated with abnormal anterior-eye development.
    action: KEEP_AS_NON_CORE
    reason: PMID:9792859 reports human family and sporadic anterior-segment cases carrying FKHL7/FOXC1
      variants, with murine expression as corroboration. The accessible original abstract supports the
