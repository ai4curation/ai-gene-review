      assays and clinical subgroup claims were not replayed.
- id: PMID:10704385
  title: Murine forkhead/winged helix genes Foxc1 (Mf1) and Foxc2 (Mfh1) are required for the early organogenesis
    of the kidney and urinary tract.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The authentic abstract directly describes mouse Foxc1 renal/ureteric phenotypes and
      compound Foxc1/Foxc2 dosage effects. Q61850 is mouse Foxc2, but the same paper also studies Foxc1;
      this is not a wrong-paralog conclusion. Full experimental detail remains unverified.
- id: PMID:28223138
  title: Foxc1 and Foxc2 are necessary to maintain glomerular podocytes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The authentic abstract and limited previews support dose-dependent mouse Foxc1/Foxc2
      podocyte integrity. The precise negative RNA-polymerase-II regulation assay was not recovered. Inhibition
      of FOXC1 by its partners does not supply the missing direction.
- id: PMID:24590069
  title: Foxc1 is a critical regulator of haematopoietic stem/progenitor cell niche formation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The authentic abstract describes Foxc1-dependent mesenchymal hematopoietic niche formation,
      CAR-cell identity and support of stem/progenitor abundance. These do not by themselves establish
      stem/progenitor-intrinsic differentiation; the exact positive-differentiation assay remains unresolved.
- id: PMID:22171010
  title: Forkhead box transcription factor FoxC1 preserves corneal transparency by regulating vascular
    growth.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Results and Discussion show that mouse corneal neural-crest stromal
      Foxc1 loss promotes blood and lymphatic growth; endothelial deletion alone does not reproduce it.
      SU5416 reduces the blood-vessel genotype difference, with no significant corresponding lymphatic
      rescue. The experiments concern the cornea, whereas GO:0036438 explicitly concerns lens transparency;
      those transfers remain UNDECIDED.
- id: PMID:25808752
  title: The transcription factor Foxc1 is necessary for Ihh-Gli2-regulated endochondral ossification.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The authentic abstract supports mouse Foxc1 involvement in Ihh-Gli2-dependent endochondral
      ossification. The downloaded purported original PDF was a challenge response. Exact core-promoter
      binding Methods were not recovered, and the separate human GLI2 paper cannot supply that assay.
- id: PMID:18187037
  title: Forkhead transcription factors regulate expression of the chemokine receptor CXCR4 in endothelial
    cells and CXCL12-induced cell migration.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods and Results support mouse endothelial Foxc1 expression/perturbation,
      Cxcr4 reporter output and CXCL12-dependent migration. The reported promoter ChIP is for Foxc2 only.
      No direct Foxc1 occupancy claim is transferred from that ChIP.
- id: PMID:19668217
  title: FOXC1 is required for normal cerebellar development and is a major contributor to chromosome
    6p25.3 Dandy-Walker malformation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods and Results combine human regional-variation evidence with
      mouse mesenchymal Foxc1 loss and cerebellar consequences. The developmental contribution is non-cell-autonomous
      from surrounding mesenchyme, not evidence that Foxc1 acts intrinsically in cerebellar neurons.
