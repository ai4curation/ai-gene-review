- term:
    id: GO:0000792
    label: heterochromatin
  evidence_type: IDA
  original_reference_id: PMID:15684392
  qualifier: located_in
  review:
    summary: FOXC1 can accumulate in HP1alpha-rich nuclear regions under partner-dependent inhibition.
    action: KEEP_AS_NON_CORE
    reason: PMID:15684392 separates retained FOXC1 DNA binding from partner-dependent inhibition of its
      reporter output. FOXC1 remains nuclear in FLNA-deficient M2 and FLNA-restored A7 cells, while A7
      cells show increased HP1alpha-region overlap. FLNA/PBX1-dependent attenuation is inhibition of FOXC1,
      not evidence that FOXC1 itself represses the partner. The heterochromatin-associated localization
      is conditional on the studied melanoma-cell/FLNA setting. Retain that pool without presenting it
      as the universal location of active FOXC1 or evidence that FOXC1 catalyzes heterochromatin assembly.
