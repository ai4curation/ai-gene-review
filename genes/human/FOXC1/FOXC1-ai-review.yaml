  review:
    summary: FOXC1 recognizes transcriptional cis-regulatory DNA.
    action: TOO_GENERAL
    reason: PMID:17210863 compares human WT and patient L130F constructs using COS-7 immunofluorescence
      and normalized extract EMSA, and a HeLa six-site reporter. WT is nuclear, binds the tested site
      and activates the reporter; mutant defects are not WT absences. Structural interpretation used a
      homology model. The underlying binding activity is valid, but this term is broader than the retained
      GO:0000978 cis-regulatory sequence-specific binding assertion. Official ancestry supports the specificity
      distinction; the original source and its experimental limits remain preserved.
