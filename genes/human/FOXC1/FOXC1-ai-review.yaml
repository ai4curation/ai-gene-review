      treated as the current full-length protein or additional natural products.
- id: PMID:9792859
  title: Mutations of the forkhead/winged-helix gene, FKHL7, in patients with Axenfeld-Rieger anomaly.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The authentic original abstract supports human FKHL7/FOXC1 variation associated with
