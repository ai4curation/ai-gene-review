gene_symbol: SSTR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SSTR2 (somatostatin receptor type 2) is a class A rhodopsin-like G protein-coupled receptor
  with seven transmembrane helices, an extracellular N-terminus and a cytoplasmic C-terminal tail. It
  binds the peptide hormones somatostatin-14 and somatostatin-28 (and cortistatin) at the cell surface
  and couples to pertussis toxin-sensitive Gi/o proteins to inhibit adenylyl cyclase, suppress voltage-gated
  calcium entry and modulate phosphotyrosine phosphatase, PI3K and MAPK signaling. Through these pathways
  it inhibits hormone secretion (for example from pancreatic islet and pituitary cells) and exerts cytostatic,
  antiproliferative effects. Agonist binding triggers receptor phosphorylation, beta-arrestin recruitment
  and endocytosis; SSTR2 can homodimerize and heterodimerize with SSTR3 and SSTR5. It is highly expressed
  in neuroendocrine tumours and is the main target of somatostatin-analogue drugs.
