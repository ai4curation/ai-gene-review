inherited:
  base: 7c5b72198f108cdc0b945c4b6504be515e024440
  review_literal_yaml: |
    id: P51570
    gene_symbol: GALK1
    product_type: PROTEIN
    status: INITIALIZED
    taxon:
      id: NCBITaxon:9606
      label: Homo sapiens
    description: >-
      GALK1 is the human galactokinase, a cytosolic ATP-dependent enzyme (EC 2.7.1.6)
      that catalyzes the phosphorylation of alpha-D-galactose to alpha-D-galactose
      1-phosphate, consuming ATP and producing ADP. This is the first committed,
      phosphorylation step of galactose catabolism in the Leloir pathway, which
      ultimately converts dietary galactose into glucose 1-phosphate for entry into
      glycolysis. The enzyme uses an ordered ternary-complex kinetic mechanism in
      which ATP binds first, followed by galactose, and it displays strict specificity
      for the galactose configuration at carbons 4 and 6 of the sugar ring (D-galactose
      and 2-deoxy-D-galactose are substrates, whereas D-glucose, D-fucose, L-arabinose
      and N-acetyl-D-galactosamine are not). GALK1 is a member of the GHMP kinase
      superfamily (GalK subfamily) and functions as a homodimer. Loss-of-function
      variants cause autosomal recessive galactokinase deficiency (galactosemia type II,
      GALAC2), whose principal manifestation is early-onset cataracts resulting from
      accumulation of the galactose-derived polyol galactitol in the lens.
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with GO
        terms
      findings: []
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: >-
          InterPro2GO pipeline. Correctly transfers galactokinase and ATP-binding terms
          from GHMP-kinase/galactokinase InterPro signatures, but also assigns generic
          parent MF terms (kinase activity, phosphotransferase) that are less informative
          than the specific galactokinase activity term.
    - id: GO_REF:0000033
      title: Annotation inferences using phylogenetic trees
      findings: []
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: >-
          PAN-GO/GO_Central phylogenetic (IBA) annotations. The three IBA calls
          (galactokinase activity, galactose metabolic process, cytosol) match the
          experimentally established function and localization of the human enzyme.
    - id: GO_REF:0000120
      title: Combined Automated Annotation using Multiple IEA Methods
      findings: []
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: >-
          Combined automated (ARBA/ensembl/RHEA/EC) pipeline. Correctly infers
          galactokinase activity and Leloir-pathway galactose catabolism.
    - id: PMID:7542884
      title: Comparison of the enzymatic activities of human galactokinase GALK1 and a
        related human galactokinase protein GK2.
      findings: []
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: >-
          Demonstrates that GALK1 (expressed in COS cells) produces high galactokinase
          activity and is the major galactose-metabolizing enzyme, distinguishing it from
          the related GK2 protein. Basis for the EXP and IDA galactokinase-activity
          annotations.
    - id: PMID:12694189
      title: Functional analysis of disease-causing mutations in human galactokinase.
      findings: []
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: >-
          Purified recombinant human GALK1 characterized kinetically (ordered ternary
          mechanism, ATP first; KM ~970 uM galactose, ~34 uM ATP) and multiple
          disease-causing variants assayed. Basis for galactokinase-activity and
          ATP-binding IDA annotations and the EC 2.7.1.6 catalytic-activity assertion.
    - id: PMID:14596685
      title: Sugar recognition by human galactokinase.
      findings: []
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: >-
          Full-text available. Establishes substrate/sugar recognition of the human
          enzyme: D-galactose and 2-deoxy-D-galactose are substrates; D-glucose,
          D-fucose, L-arabinose and N-acetyl-D-galactosamine are not phosphorylated.
          Basis for the galactose-binding IDA annotation.
    - id: PMID:15024738
      title: Biochemical characterization of two GALK1 mutations in patients with galactokinase
        deficiency.
      findings: []
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: >-
          Biochemical characterization of the V32M and R239Q GALK1 variants in patients,
          showing drastic reduction of GALK activity, establishing pathogenicity and the
          enzyme's role in galactose metabolism (IMP).
    - id: PMID:8908517
      title: Fine structure of the human galactokinase GALK1 gene.
      findings: []
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: >-
          In vitro translation shows the GALK1 protein is cytosolic and not associated
          with the ER membrane. Basis for the cytoplasm IDA and the NOT|membrane IDA
          (informative negation).
    - id: PMID:19056867
      title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
      findings: []
      reference_review:
        relevance: LOW
        correctness: VERIFIED
        review_notes: >-
          High-throughput urinary exosome proteomics; GALK1 detected as one of many
          co-purifying proteins. Localization is incidental, not a functional site for
          this soluble metabolic enzyme.
    - id: PMID:19946888
      title: Defining the membrane proteome of NK cells.
      findings: []
      reference_review:
        relevance: LOW
        correctness: LOW_QUALITY
        review_notes: >-
          High-throughput NK-cell membrane proteome. The resulting "membrane"
          localization is a proteomic co-purification and is directly contradicted by the
          curated NOT|located_in membrane IDA (PMID:8908517).
    - id: PMID:32296183
      title: A reference map of the human binary protein interactome.
      findings: []
