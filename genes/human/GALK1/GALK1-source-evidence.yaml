  - location: review.existing_annotations[21].review.supported_by[0]
    reference_id: PMID:12694189
    text: Human galactokinase (GALK1) was expressed in and purified from Escherichia coli. The recombinant
      enzyme was both soluble and active.
    text_sha256: 5a732508c83c2003907ca71a0c3c5ddaa9bd3d2f9016654d7780023246e5550c
  - location: review.existing_annotations[22].review.supported_by[0]
    reference_id: PMID:12694189
    text: the most likely kinetic mechanism of the enzyme was an ordered ternary complex one in which
      ATP is the first substrate to bind
    text_sha256: 73b45de0e1dbc5e0367c9367e276ac141abff50dc1b95a884096a3e49f0afdbf
  - location: review.existing_annotations[23].review.supported_by[0]
    reference_id: PMID:14596685
    text: D-galactose and 2-deoxy-D-galactose are substrates for the enzyme, but N-acetyl-D-galactosamine,
      L-arabinose, D-fucose and D-glucose are all not phosphorylated.
    text_sha256: 623a47db48a1b19435a2ed95059a5e5b8dd49f19e4e7d4f535f50f93829f084d
  - location: review.existing_annotations[24].review.supported_by[0]
