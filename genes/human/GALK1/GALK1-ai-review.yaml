id: P51570
gene_symbol: GALK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GALK1 is a cytosolic galactokinase that uses ATP to phosphorylate galactose at carbon 1, producing
  galactose 1-phosphate for the Leloir pathway. Human enzyme kinetics support an ordered mechanism in which ATP
  binds before galactose. Loss of activity impairs galactose utilization and causes galactokinase-deficiency galactosemia,
  particularly cataracts associated with galactitol accumulation. Recombinant human GALK1 also phosphorylates 2-deoxygalactose
  in vitro; its physiological use as a substrate is unresolved.
core_functions:
- description: Catalyzes ATP-dependent galactose phosphorylation in cytosol, committing the sugar to the Leloir
    catabolic pathway.
  molecular_function:
    id: GO:0004335
    label: galactokinase activity
  directly_involved_in:
  - id: GO:0033499
    label: D-galactose catabolic process, Leloir pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:12694189
    supporting_text: The sugar is phosphorylated at position 1 at the expense of ATP.
  - reference_id: PMID:8908517
suggested_questions:
- question: Does native human GALK1 remain predominantly monomeric under physiological conditions, and do the Cys391-linked
    dimers seen in the engineered crystal preparation occur in cells?
- question: What target peptides and fractionation controls underlie the YTS GALK1 membrane-proteomics annotation,
    and can any conditional peripheral association be distinguished from microsomal insertion?
- question: Does the robust 2-deoxygalactose phosphorylation observed with purified human GALK1 contribute to any
    physiological metabolic role?
suggested_experiments:
- description: Measure oligomeric state and galactose turnover of sequence-verified untagged human GALK1 under reducing
    cytosolic conditions, with matched tagged and Cys391-substituted controls, while distinguishing changes in folding
    or abundance from assembly effects.
