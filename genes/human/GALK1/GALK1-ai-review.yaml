      full variant-level Methods were not inspected.
  full_text_unavailable: true
- id: PMID:14596685
  title: Sugar recognition by human galactokinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Results, Methods and Figure 3 caption read. Recombinant human GALK1 phosphorylates
      galactose and robustly phosphorylates 2-deoxygalactose in vitro; four tested alternative sugars are not phosphorylated
      under the reported conditions. Physiological use of the alternate substrate is unresolved. The introductory
      structural image is bacterial L.lactis, not a human complex; human binding is independently supported by PMID:15590630.
      Km is not equated with binding affinity.
  full_text_unavailable: false
  findings:
  - statement: Recombinant human enzyme recognizes galactose and 2-deoxygalactose as substrates under the tested
      conditions; physiological alternate-substrate use remains unresolved.
    supporting_text: "D-galactose and \n2-deoxy-D-galactose are substrates for the enzyme"
