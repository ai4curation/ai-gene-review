- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: The GALK1-specific YTS membrane-proteomics context remains unresolved.
    action: UNDECIDED
    reason: 'The authentic PMID:19946888 abstract describes isolated YTS-cell membranes treated with reagents reported
      to remove peripheral proteins, with additional TFE treatment in an effort to remove remaining nonintegral
      proteins. It does not establish complete removal: the authors describe both plausible integral candidates
      and associated proteins, and conclude that membranes contain integral and stably associated proteins. Absence
      of a predicted transmembrane segment or signal peptide does not assign GALK1 to a particular measured fraction.
      The GALK1-specific table, peptide assignment and complete assay context remain unadjudicated. The negative
      reticulocyte/canine-microsome assay in PMID:8908517 supports its separate NOT context but cannot resolve all
      associations in YTS cells. Retain UNDECIDED for this specific positive HDA claim, without asserting contamination
      or an experimentally refuted localization.'
    supported_by:
    - reference_id: PMID:19946888
    - reference_id: PMID:8908517
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IDA
  original_reference_id: PMID:8908517
  qualifier: located_in
  negated: true
  review:
    summary: The original experiment supports the retained NOT-membrane assertion in its tested microsomal context.
    action: ACCEPT
    reason: This original is NOT|located_in, not a positive membrane annotation. In PMID:8908517, human GALK1 translated
      in rabbit reticulocyte lysate remained proteinase-K accessible in the presence of canine pancreatic microsomes
      and stayed in the supernatant after pelleting at both neutral and carbonate pH (Results/Figure3 and expression
      Methods). Retain negated:true and the original source. This supports absence of insertion/association in that
      assay; it does not establish that no partner-dependent peripheral association can ever occur in YTS or another
      cell type.
    supported_by:
    - reference_id: PMID:8908517
