  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 16.51) and absent from GOA. The VEGF-A complex is the disulfide-linked
      homodimer that is VEGFA's functional unit; naming it is correct and specific. Correct and novel,
      with the caveat that the term does not distinguish the pro- and anti-angiogenic isoforms.
