id: P15692
gene_symbol: VEGFA
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for VEGFA. Four of the five calls are exact GOA matches and they
  recover all three of this review's core molecular functions - receptor binding, growth factor activity
  and chemoattractant activity - which is complete coverage and the best human result in the cohort.
  Rank 1 adds the VEGF-A complex, absent from GOA. What no call captures is the isoform biology this
  review flags as critical: VEGF165B binds VEGFR2 without activating it and is anti-angiogenic, so
  a single protein-level annotation set is known to be misleading here - a limitation of whole-sequence
  retrieval, which has one embedding per accession. Assessment: 1 correct novel (COR), 2 correct not
  novel (CNN).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/human/VEGFA/VEGFA-uniprot.txt
