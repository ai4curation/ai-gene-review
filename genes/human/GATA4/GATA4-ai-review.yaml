  review:
    summary: 'IBA: negative regulation of transcription by RNA polymerase II, inherited from the GATA
      family node.'
    action: KEEP_AS_NON_CORE
    reason: GATA4 is predominantly an activator, but genome-wide studies in human iPSC-cardiomyocytes
      show that GATA4 together with TBX5 is needed to repress non-cardiac (endothelial/endocardial) genes,
      and FOG2 can convert GATA4 into a repressor on some promoters. The family-level IBA is therefore
      biologically sound for GATA4, but repression is secondary to its activator role.
    supported_by:
    - reference_id: PMID:27984724
      supporting_text: the GATA4-G296S mutation led to failure of GATA4 and TBX5-mediated repression at
        non-cardiac genes
