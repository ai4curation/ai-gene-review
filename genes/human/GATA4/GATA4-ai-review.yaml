core_functions:
- description: Sequence-specific RNA polymerase II DNA-binding transcription factor that binds GATA motifs
    in cis-regulatory regions (including within compacted chromatin) and activates target genes such as
    NPPA, AMH and ID2; with TBX5 it also represses non-cardiac genes in cardiomyocytes.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:21220346
    supporting_text: we performed EMSA, which showed WT GATA4 binding to the GATA4-responsive element
      on the AMH promoter
  - reference_id: PMID:24000169
    supporting_text: the GATA4 mutants were consistently associated with diminished DNA-binding affinity
      and decreased transcriptional activity
  - reference_id: PMID:11864602
    supporting_text: HNF3 and GATA-4, but not NF-1, C/EBP, and GAL4-AH, bound their sites in compacted
      chromatin and opened the local nucleosomal domain in the absence of ATP-dependent enzymes
  - reference_id: PMID:27984724
    supporting_text: In human cardiomyocytes, GATA4 broadly co-occupied cardiac enhancers with TBX5
- description: Binds partner DNA-binding transcription factors (NKX2-5, TBX5, SMAD4, NR5A1) through its
    zinc fingers, forming cooperative complexes that synergistically activate cardiac and gonadal target
    promoters; disease mutations selectively disrupt these interactions.
  molecular_function:
    id: GO:0061629
    label: RNA polymerase II-specific DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
