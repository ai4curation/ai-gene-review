    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:9312027
    supporting_text: The synergy involves physical Nkx2-5-GATA-4 interaction, seen in vitro and in vivo,
      which maps to the C-terminal zinc finger of GATA-4 and a C-terminus extension
  - reference_id: PMID:12845333
    supporting_text: the Gata4 mutation abrogated a physical interaction between Gata4 and TBX5
  - reference_id: PMID:21330551
    supporting_text: SMAD4 efficiently precipitated wild-type GATA4
  - reference_id: PMID:21220346
    supporting_text: both the WT and mutant GATA4 proteins retained their ability to interact with NR5A1
