id: P43694
gene_symbol: GATA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATA4 is a GATA-family zinc-finger transcription factor with two GATA-type C4 zinc fingers;
  the C-terminal finger recognizes (A/T)GATA(A/G) motifs in promoters and enhancers and the N-terminal
  finger stabilizes DNA binding and recruits FOG cofactors (ZFPM2/FOG2). It is a nuclear, predominantly
  activating RNA polymerase II transcription factor that can engage its sites in compacted chromatin,
  and it acts combinatorially with partner DNA-binding factors (NKX2-5, TBX5, SMAD4, NR5A1, MEF2, HAND2)
  and coregulators to drive tissue-specific gene programs such as NPPA/NPPB in heart and AMH/SRY in gonad.
  In the heart GATA4 is expressed in precardiac mesoderm, myocardium and endocardium, where it promotes
  cardiomyocyte proliferation and survival, right ventricle and atrioventricular canal/endocardial cushion
  morphogenesis and septation; heterozygous mutations cause atrial, ventricular and atrioventricular septal
  defects, tetralogy of Fallot and bicuspid aortic valve. GATA4 also acts in endoderm derivatives (foregut,
  liver bud, ventral pancreas, intestinal epithelium) and, with FOG2 and NR5A1, in Sertoli cells for testis
  determination and differentiation.
