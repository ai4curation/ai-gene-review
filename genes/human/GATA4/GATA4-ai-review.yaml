suggested_questions:
- question: Which cardiac and endodermal GATA4 functions are masked by redundancy with GATA5 and GATA6,
    given that Gata4-null cardiomyocytes still differentiate?
- question: Does GATA4 act as a bona fide pioneer factor at cardiac enhancers in vivo (as it does on compacted
    albumin-enhancer chromatin in vitro), and is TBX5 recruitment dependent on prior GATA4-driven opening?
- question: Should GATA4's FOG2-dependent repressive activity on some promoters be captured with a context-specific
    transcription repressor annotation in human?
suggested_experiments:
- hypothesis: GATA4 opens chromatin at a subset of cardiac enhancers before TBX5/NKX2-5 binding.
  description: Time-resolved ATAC-seq and CUT&RUN for GATA4, TBX5 and NKX2-5 during human iPSC cardiac
    differentiation using degron-tagged GATA4 to test acute loss of accessibility.
  experiment_type: genome-wide chromatin accessibility and occupancy profiling
- hypothesis: Gonad-restricted DSD mutations (e.g. G221R) differ from cardiac-only mutations by disrupting
    FOG2 binding rather than partner-TF synergy.
  description: Systematically profile FOG2, NR5A1, TBX5, NKX2-5 and SMAD4 binding and reporter synergy
    for a panel of patient GATA4 variants.
  experiment_type: variant functional characterization
