id: P38398
gene_symbol: BRCA1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRCA1 is a nuclear tumor-suppressor protein that organizes DNA damage responses and homologous-recombination
  repair through several distinct molecular activities. Its N-terminal RING domain engages ubiquitin-conjugating
  enzymes in a ligase heterodimer with BARD1, modifying nucleosomal histones and other substrates; ubiquitin
  linkage and substrate specificity depend on the E2 and biochemical context. Tandem C-terminal BRCT repeats
  recognize phosphorylated protein motifs, while a central DNA-binding region and protein-interaction
  interfaces cooperate with BARD1 to promote DNA-end resection and recruitment of repair factors. BRCA1-containing
  assemblies also influence damage checkpoints, transcriptional regulation and context-dependent centrosome
  and metabolic responses. Pathogenic germline variants cause hereditary breast and ovarian cancer predisposition.
  Alternative products and experimental fragments need not share the complete set of activities of full-length
  BRCA1.
