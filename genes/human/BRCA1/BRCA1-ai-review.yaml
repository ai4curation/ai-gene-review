core_functions:
- molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  description: The BRCA1 RING engages E2 enzymes in the BRCA1–BARD1 ubiquitin-ligase heterodimer. The
    complex ubiquitinates nucleosomal H2A C-terminal lysines and other substrates to support repair-associated
    chromatin regulation. K6-linked autoubiquitination is one experimentally observed product; other E2
    partners support different linkages. BARD1 supplies modified-chromatin recognition surfaces, while
    BRCA1 supplies the E2-engaging RING interface. This is distinct from assigning an intrinsic ubiquitin-modified-histone
    reader site to BRCA1.
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0031436
    label: BRCA1-BARD1 complex
  supported_by:
  - reference_id: PMID:12890688
    supporting_text: resulting complex functions as an E3 ubiquitin ligase
  - reference_id: PMID:17873885
  - reference_id: PMID:34321665
    supporting_text: "RING domains17 in BRCA1-BARD1 orient an E2 \nubiquitin-conjugating enzyme atop the\
      \ nucleosome"
- molecular_function:
    id: GO:0051219
    label: phosphoprotein binding
  description: The tandem BRCT region recognizes phosphorylated protein motifs, including phosphoserine-containing
    segments of BRIP1/BACH1, CtIP and Abraxas, and helps organize distinct damage-response assemblies.
    This protein-recognition activity is separate from direct DNA binding and does not give BRCA1 the
    helicase or nuclease activity of its partners. Phosphorylated ACCA provides an additional, non-core
    metabolic context for the same broad recognition chemistry.
  directly_involved_in:
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15125843
    supporting_text: "phosphorylated serine 990 \nand phenylalanine 993 of BACH1 anchor the binding to\
      \ BRCA1"
  - reference_id: PMID:16101277
  - reference_id: PMID:17525340
  - reference_id: PMID:16326698
- molecular_function:
    id: GO:0003677
    label: DNA binding
  description: A DNA-binding module in the central BRCA1 region cooperates with a separate BARD1 DNA-binding
    module in the heterodimer. Purified-protein and single-molecule experiments link these modules to
    stimulation of long-range resection by EXO1 and BLM–DNA2 or WRN–DNA2. BRCA1 helps position and support
    the resection machinery; it is not the helicase or nuclease. Fragment assays establish BRCA1 DNA affinity,
    whereas intact-complex and BARD1-mutant experiments establish additional context without making every
    result a BRCA1-specific mutant assay.
  directly_involved_in:
  - id: GO:0000724
    label: double-strand break repair via homologous recombination
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0031436
    label: BRCA1-BARD1 complex
  supported_by:
  - reference_id: PMID:15571721
    supporting_text: "polypeptides from the central region \nare able to mediate interactions with DNA\
      \ and p53"
  - reference_id: PMID:39261729
    supporting_text: BRCA1 and BARD1 harbour stand-alone modules
status: COMPLETE
suggested_questions:
- question: Which endogenous substrates and E2-dependent ubiquitin products explain the separable repair
    and tumor-suppressive activities of full-length BRCA1–BARD1, and how do ligase-defective mutants compare
    with mutants that retain DNA binding and partner assembly?
- question: Can the original interaction tables and self-association assays resolve the source-specific
    UNDECIDED rows, including whether recorded screen partners represent direct contacts, co-complex associations
    or proximity measurements?
- question: Which of the eight named UniProt alternative products retain each DNA-binding, RING and BRCT
    activity? Existing unqualified GOA objects do not demonstrate functional equivalence of all products.
- question: Does the available evidence justify a BRCA1 contributes_to relationship for the BRCA1–BARD1
    histone-reader function, while retaining the direct modified-histone recognition site on BARD1?
- question: Which assays distinguish BRCA1 participation in productive stalled-fork resection from fork
    protection, general DSB-end resection and downstream phenotypes?
