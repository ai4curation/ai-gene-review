suggested_questions:
- question: Does CXCL17 signal through MRGPRX1, MRGPRX2 and MAS1 at physiologically attainable concentrations,
    or are those micromolar responses an in vitro property of a cationic peptide? The answer decides
    how much of CXCL17 biology is GPR25 biology, without bearing on whether GPR25 is a CXCL17 receptor.
  experts:
  - Zhan-Yun Guo
  - James E Pease
- question: Is the TGF-beta-induced role of GPR25 in lung and liver tissue-resident memory CD8 T cell
    formation downstream of CXCL17, or a ligand-independent output? Gpr25-deficient cells entered
    tissues normally and failed at a later step, which is not obviously a chemotaxis phenotype.
  experts:
  - Pandurangan Vijayanand
  - Hayley Feng
- question: Should GO acquire a child term for lymphocyte homing to mucosal barrier epithelia? GPR25
    is currently annotated with lymphocyte migration into lymphoid organs, which the primary data
    explicitly exclude, and the accurate alternative is the uninformative general migration term.
  experts: []
- question: Does GPR25 have additional endogenous agonists, and is CXCL17 its only ligand? The receptor
    was assayed against a panel of one ligand family; no counter-screen of orphan ligands has been
    reported.
  experts:
  - Eugene C Butcher
  - Borja Ocón
suggested_experiments:
- hypothesis: The tissue-resident memory phenotype of GPR25 loss requires CXCL17 binding.
  description: Transfer wild-type, Gpr25-null and Gpr25 W95A/R178A-reconstituted CD8 T cells into
    wild-type and Cxcl17-null recipients, infect, and score tissue entry and subsequent TRM differentiation
    including TCF1 acquisition, separating the entry step from the residency step.
  experiment_type: Adoptive transfer with receptor pocket mutants in ligand-null hosts
- hypothesis: CXCL17 does not reach concentrations at mucosal surfaces sufficient to activate MRGPRX1,
    MRGPRX2 or MAS1.
  description: Quantify CXCL17 protein in airway, gastric and biliary mucosal lavage and tissue by
    targeted mass spectrometry, and compare with the measured EC50 values at GPR25 and at the three
    MRGPRs determined side by side in one laboratory with one ligand preparation.
  experiment_type: Quantitative ligand measurement plus matched pharmacology
- hypothesis: GPR25 has a structurally defined CXCL17 binding mode consistent with the two-step model.
  description: Determine a cryo-EM structure of the CXCL17-GPR25-G protein complex and test the predicted
    N-terminal orientation contacts and the Trp95, Arg178 and Arg264 pocket contacts by mutagenesis
    in both chemotaxis and beta-arrestin assays.
  experiment_type: Structural biology with structure-guided mutagenesis
- hypothesis: GPR25 responds to ligands other than CXCL17.
  description: Screen GPR25 against a broad orphan-ligand and chemoattractant library in a beta-arrestin
    recruitment assay, with the W95A pocket mutant as a counter-screen to distinguish orthosteric
    from allosteric or assay-artefact hits.
  experiment_type: Deorphanization counter-screen
