taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Class A G protein-coupled receptor of the lymphocyte plasma membrane, and the receptor
  for the chemoattractant cytokine CXCL17. GPR25 was cloned in 1997 and remained an orphan for nearly
  three decades before three independent laboratories, using in vivo homing assays, beta-arrestin
  recruitment and TGF-alpha shedding in transfected cells, and chemotaxis of transfected pre-B cells,
  converged on CXCL17 as its agonist; site-directed mutagenesis in two of those studies identified
  the same orthosteric pocket residues, Trp95 and Arg178, as essential, and activation depends on
  the conserved C-terminal fragment of CXCL17. Because CXCL17 is produced by the epithelia of the
  airways, oral cavity, stomach, and biliary and genitourinary tracts - the non-intestinal mucosae
  - the GPR25-CXCL17 axis provides the tissue-selective chemoattractant pathway for those barrier
  surfaces, complementing the separately known homing systems for intestine and skin. GPR25 is induced
  on innate lymphocytes before they leave the bone marrow and is imprinted in secondary lymphoid tissue
  on activated B and T cells; it marks tissue-resident memory B and T cells and regulatory T cells
  in non-intestinal mucosae and lung, and is also expressed on T cells in cerebrospinal fluid. Adoptive
  transfer shows that GPR25 drives homing into mucosal barrier tissues but not into intestine, peripheral
  lymph nodes or spleen. Independently of chemotaxis, GPR25 is induced by TGF-beta signalling and
  is required for efficient formation of lung and liver tissue-resident memory CD8 T cells. CXCL17
  itself is promiscuous - it also activates MRGPRX1, MRGPRX2 and MAS1 at micromolar concentrations,
  through a mechanism that does not require its C-terminal fragment - and whether CXCL17 should be
  classified as a chemokine at all is debated; neither question undermines GPR25 as one of its receptors.'
