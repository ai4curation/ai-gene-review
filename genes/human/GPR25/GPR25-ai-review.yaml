- term:
    id: GO:0016494
    label: C-X-C chemokine receptor activity
  evidence_type: IDA
  original_reference_id: PMID:39293486
  qualifier: enables
  review:
    summary: GPR25 identified as the lymphocyte receptor for CXCL17, with chemotaxis in vitro and
      CXCL17-dependent homing to non-intestinal mucosal tissues in vivo.
    action: ACCEPT
    reason: 'Core molecular function, and the strongest deorphanization in this review batch. Three
      independent laboratories using three different assay platforms agree: Ocón et al. (Nature 2024,
      in vivo adoptive-transfer homing in wild-type and Cxcl17-null recipients), Hu et al. (FEBS J
      2025, beta-arrestin recruitment and TGF-alpha shedding in HEK293T cells with an EC50 near 100
      nM and no activity at seventeen other GPCRs), and Yang, Giblin and Pease (Basic Clin Pharmacol
      Toxicol 2026, chemotaxis of L1.2 pre-B transfectants to nanomolar CXCL17). The last two independently
      converged on the same orthosteric residues, Trp95 and Arg178, as essential. A fourth laboratory
      provides in vivo genetics for GPR25 function in tissue-resident memory CD8 T cells (PMID:41270189).
      The residual controversy in the literature concerns the ligand, not the receptor: CXCL17 also
      activates MRGPRX1, MRGPRX2 and MAS1, but only at micromolar concentrations and through a determinant
      that does not require the C-terminal fragment on which GPR25 activation depends, so CXCL17 promiscuity
      does not weaken the GPR25 assignment. A separate proposal to reclassify CXCL17 as a chemoattractant
      distinct from the chemokine family is a question about the ligand''s nomenclature and does not
      affect this term, whose scope covers C-X-C-named chemokine ligands.'
    supported_by:
    - reference_id: PMID:39293486
      supporting_text: Here we leveraged diverse omics datasets to identify GPR25 as a lymphocyte
        receptor for CXCL17
    - reference_id: PMID:42207165
      supporting_text: In conclusion, we verify GPR25 as a bona fide CXCL17 receptor and suggest a
        two-step model of GPR25 activation
- term:
    id: GO:0016494
    label: C-X-C chemokine receptor activity
  evidence_type: IDA
  original_reference_id: PMID:40279398
  qualifier: enables
  review:
    summary: CXCL17 activates human GPR25 with an EC50 near 100 nM and no effect on seventeen other
      receptors tested; alanine substitution of the predicted pocket residues Trp95 or Arg178 abolishes
      the response.
    action: ACCEPT
    reason: 'Core molecular function, independently replicated. The structure-guided mutagenesis here
      was reproduced by a separate laboratory in a different cell background, which also recovered
      Trp95 and Arg178 (plus Arg264) as required for the chemotactic response. The residual controversy
      concerns CXCL17''s promiscuity rather than GPR25''s identity as one of its receptors: the MRGPR
      responses need micromolar ligand and survive C-terminal truncation, whereas GPR25 activation
      is abolished by removing three C-terminal residues.'
    supported_by:
    - reference_id: PMID:40279398
      supporting_text: we identified the rarely studied orphan G protein-coupled receptor 25 (GPR25)
        as a receptor of CXCL17
    - reference_id: PMID:40279398
      supporting_text: Alanine replacement of W95 or R178 of human GPR25, two conserved residues in
        the predicted orthosteric ligand binding pocket, almost abolished its response to CXCL17.
    - reference_id: PMID:41167449
      supporting_text: However, removal of C-terminal residues from CXCL17 did not affect its activation
        of these three MRGPRs, even though this region is essential for GPR25 activation.
