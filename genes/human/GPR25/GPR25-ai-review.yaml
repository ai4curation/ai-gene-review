core_functions:
- molecular_function:
    id: GO:0016494
    label: C-X-C chemokine receptor activity
  description: GPR25 is the lymphocyte receptor for CXCL17. The conserved C-terminal fragment of CXCL17
    inserts into an orthosteric pocket whose Trp95 and Arg178 are required for activation, with the
    receptor N-terminus providing an initial orientation step; occupancy triggers G protein signalling
    and beta-arrestin recruitment and drives RhoA-dependent cytoskeletal and integrin changes. The
    functional output is chemotaxis, and in vivo the axis delivers lymphocytes from blood to the barrier
    epithelia of the airways, oral cavity, stomach, and biliary and genitourinary tracts, where CXCL17
    is made - and specifically not to intestine, peripheral lymph nodes or spleen. Independently, GPR25
    is induced by TGF-beta and is required for efficient formation of lung and liver tissue-resident
    memory CD8 T cells.
  directly_involved_in:
  - id: GO:0070098
    label: chemokine-mediated signaling pathway
  - id: GO:0048247
    label: lymphocyte chemotaxis
  - id: GO:0072676
    label: lymphocyte migration
  locations:
  - id: GO:0005886
    label: plasma membrane
  knowledge_gaps:
  - gap_statement: Whether the TGF-beta-induced requirement for GPR25 in tissue-resident memory CD8
      T cell formation is downstream of CXCL17 binding, or a separate output of the receptor, is undetermined.
    boundary: GPR25 as a CXCL17 receptor and as a driver of homing into non-intestinal mucosae is
      established by three independent laboratories. What is not established is the ligand dependence
      of the residency phenotype, since Gpr25-deficient T cells entered tissues normally and failed
      at a later differentiation step.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: If the residency function is ligand-independent or uses a second ligand, then blocking
      CXCL17 and deleting GPR25 would have different immunological consequences, which matters for
      any therapeutic use of this axis.
    resolution: Test tissue-resident memory formation in Cxcl17-null recipients and with GPR25 pocket
      mutants that cannot respond to CXCL17 but retain surface expression.
    provenance:
    - reference_id: PMID:41270189
      supporting_text: Using adoptive transfer, we found that Gpr25-deficient T cells infiltrated
