proposed_new_terms:
- proposed_name: phosphatidylethanolamine-dependent ceramide phosphoethanolamine synthase activity
  proposed_definition: 'Catalysis of the reaction: ceramide + phosphatidylethanolamine = ceramide
    phosphoethanolamine + 1,2-diacyl-sn-glycerol. This activity transfers a phosphoethanolamine group
    from PE to ceramide.'
  supported_by:
  - reference_id: PMID:19506037
    supporting_text: Although formation of NBD-CPE was stimulated by addition of PE, addition of
      either PC or CDP-ethanolamine had no effect
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  justification: The live GO:0002950 label resembles this activity, but its definition specifies
    CDP-ethanolamine and CMP rather than phosphatidylethanolamine and DAG. PMID:19506037 tests this
    donor distinction directly. Keep the chemically distinct PE-dependent capacity under broad GO:0016780
    until an exact term or corrected GO definition exists; no GO:0002950 assertion is added.
- proposed_name: phosphatidylethanolamine phospholipase C activity
  proposed_definition: 'Catalysis of the reaction: phosphatidylethanolamine + H2O = 1,2-diacyl-sn-glycerol
    + phosphoethanolamine. This activity specifically hydrolyzes PE to generate DAG and phosphoethanolamine.'
  supported_by:
  - reference_id: PMID:37586586
    supporting_text: SMSr is a phosphatidylethanolamine phospholipase C that promotes nonalcoholic
      fatty liver disease
- proposed_name: ceramide sensor activity
  proposed_definition: The ability to detect and respond to ceramide concentration changes in the
    endoplasmic reticulum, regulating ceramide homeostasis through enzymatic conversion to prevent
    ceramide-induced cellular stress.
  supported_by:
  - reference_id: PMID:19506037
    supporting_text: SMSr as a key regulator of ceramide homeostasis that seems to operate as a sensor
      rather than a converter of ceramides in the ER
suggested_questions:
- question: How does SAMD8 sense ceramide levels in the ER - is it through direct binding, allosteric
    regulation, or changes in oligomerization state?
  experts:
  - Joost Holthuis (Utrecht University) - corresponding author on key SAMD8 papers
  - Ceramide/sphingolipid metabolism experts
- question: What determines whether SAMD8 acts primarily as a CPE synthase versus PE-PLC in different
    tissues or metabolic states?
  experts:
  - Hepatic lipid metabolism specialists
  - NAFLD researchers
- question: What is the fate of the trace amounts of CPE produced by SAMD8 - is it rapidly degraded
    or does it have signaling functions?
  experts:
  - Lipidomics experts
  - Sphingolipid catabolism researchers
- question: How should GO represent SMSr-dependent ceramide biosynthetic participation versus regulation
    of the pathway? PMID:40998032 establishes mouse PE-sensitive SPT regulation and co-IP, while
    human evidence is coexpression; a direct human mechanism and reverse CPE reaction remain unresolved.
suggested_experiments:
- experiment_type: Biochemical mechanism and structure
  description: Use the existing human SMSr structures from PMID:38388831 to design matched full-length
    assays for PE/DAG-dependent CPE synthesis, residual PC-dependent SM synthesis and reverse reactions;
    reconstitute SPT with controlled PE and SMSr to distinguish lipid-mediated regulation from physical
    coupling.
  hypothesis: Relative headgroup-transfer and hydrolysis activities depend on membrane/substrate
    conditions, while PE-mediated SPT regulation need not imply a direct catalytic interaction.
- experiment_type: Live cell ceramide imaging
  description: Track real-time ER ceramide levels using fluorescent sensors while manipulating SAMD8
    activity or expression
  hypothesis: SAMD8 activity increases proportionally with ER ceramide levels until a threshold is
    reached, acting as a homeostatic sensor
- experiment_type: Tissue-specific knockout studies
  description: Generate conditional SAMD8 knockouts in brain, liver, and pancreatic beta cells to
    assess tissue-specific functions
  hypothesis: SAMD8 deficiency in neurons leads to age-dependent neurodegeneration due to ceramide
    accumulation, while liver-specific knockout protects against NAFLD
status: COMPLETE
