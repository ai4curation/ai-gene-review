- term:
    id: GO:2000303
    label: regulation of ceramide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:19506037
  review:
    summary: SMSr contributes to ceramide-homeostasis regulation in human cultured cells, with complementary
      mouse evidence linking PE metabolism to SPT regulation.
    action: ACCEPT
    reason: 'This annotation accurately reflects SAMD8 role as a key regulator of ceramide homeostasis.
      The cited paper demonstrates that blocking SAMD8 causes ceramide accumulation and that it operates
      as a ceramide sensor. PMID:40998032 provides a plausible mechanistic connection: mouse overexpression
      and high-fat-diet loss change SPT activity, PE supplementation reverses SPTLC2 elevation and
      reduces microsomal SPT activity, and SPTLC2 co-immunoprecipitates with tagged SMSr. Human evidence
      in that study is coexpression, and the exact PE-to-SPT mechanism remains open; do not describe
      a demonstrated direct binary switch in human cells.'
    supported_by:
    - reference_id: PMID:19506037
      supporting_text: We find that the latter phenotype is not caused by depletion of CPE but rather
        a consequence of ceramide accumulation in the ER. Our results establish SMSr as a key regulator
        of ceramide homeostasis that seems to operate as a sensor rather than a converter of ceramides
        in the ER.
    - reference_id: PMID:40998032
      supporting_text: We found that SPTLC2 co-immunoprecipitated with SMSr-Flag (Fig. 5E)
