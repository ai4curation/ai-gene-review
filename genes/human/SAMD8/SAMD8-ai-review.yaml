  title: SAMD8 transfers phosphatidyl from PE onto C16DH CER
  findings: []
- id: PMID:37586586
  title: Sphingomyelin synthase-related protein SMSr is a phosphatidylethanolamine phospholipase
    C that promotes nonalcoholic fatty liver disease
  findings:
  - statement: SAMD8 functions primarily as a phosphatidylethanolamine-specific phospholipase C (PE-PLC),
      hydrolyzing PE to generate DAG and phosphoethanolamine
    supporting_text: Sphingomyelin synthase-related protein SMSr is a phosphatidylethanolamine phospholipase
      C that promotes nonalcoholic fatty liver disease
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: SAMD8 deficiency attenuates high-fat diet/fructose-induced fatty liver and NASH by
      increasing hepatic PE levels
    supporting_text: We found that SMSr/PE-PLC deficiency attenuated high-fat diet/fructose-induced
      fatty liver and NASH, and attenuated glucosylceramide accumulation-induced NASH, fibrosis,
      and tumor formation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: NASH patients show higher liver SAMD8 expression and lower plasma PE/PC ratios; PE
      levels negatively correlate with inflammatory markers
    supporting_text: plasma TNFα levels were negatively correlated with PE
    reference_section_type: RESULTS
    full_text_unavailable: false
- id: PMID:28659495
  title: Ceramide phosphoethanolamine synthase SMSr is a target of caspase-6 during apoptotic cell
    death
  findings:
  - statement: SAMD8 is specifically cleaved by caspase-6 during apoptosis at conserved aspartate
      between SAM domain and first transmembrane span
    supporting_text: Treatment of cells with staurosporine resulted in proteolytic cleavage of SMSr-V5
      but not of its caspase-resistant counterpart, SMSrCR-V5 (Figure 3C), hence confirming that
      Asp118 and Asp120 are the principle caspase cleavage sites in SMSr
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: Serves as negative regulator of ceramide-induced apoptosis; cleavage during apoptosis
      removes this protective function
    supporting_text: While this finding is in line with a role of SMSr as negative regulator of ceramide-induced
      cell death
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  - statement: High brain expression raises potential involvement in neurodegenerative disorders
      where caspase-6 is implicated
    supporting_text: As SMSr constitutes the principle CPE synthase in brain [38], it would be of
      interest to explore whether its proteolytic cleavage by caspase-6 has any relevance in the
      pathogenesis of neurodegenerative diseases
    reference_section_type: DISCUSSION
    full_text_unavailable: false
