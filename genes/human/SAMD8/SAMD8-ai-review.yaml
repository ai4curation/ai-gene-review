  review:
    summary: Retain the existing proposal for C-type glycerophospholipase activity, with substrate
      and construct scope made explicit.
    action: NEW
    reason: PMID:33621517 measures hydrolysis of several glycerophospholipids by purified human SMSr
      lacking its SAM domain and confirms PAP and PI-PLC activities for full-length human SMSr immunoprecipitated
