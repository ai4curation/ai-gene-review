- id: file:human/SAMD8/SAMD8-deep-research-falcon.md
  title: Falcon (Edison) deep research on SAMD8/SMSr function
  findings:
  - statement: SMSr is an ER-resident multi-pass membrane enzyme of the sphingomyelin synthase family
      whose SAM domain controls oligomerization and ER retention; recent work reframes it as a PE-PLC
      regulating hepatic PE and DAG signaling
    supporting_text: Historically, SMSr has been studied as a **ceramide phosphoethanolamine (CPE)
      synthase** (a “trace” phosphosphingolipid pathway), but recent work (2023) argues that in vivo
      its dominant role may be **phosphatidylethanolamine phospholipase C (PE‑PLC)** activity that
      regulates hepatic PE levels and promotes NAFLD/NASH phenotypes.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: SMSr interacts with DGKδ via its SAM domain, contributing DAG that DGKδ converts into
      defined PA species, defining a ceramide-independent DAG-to-PA signaling axis
    supporting_text: SMSr contributes to **DAG generation** (via PLC-like chemistry), which is then
      converted by DGKδ into defined PA species
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Useful PLC/ER/DGK synthesis critically reused. Dominant PE-PLC physiology remains
      tissue- and condition-dependent; it does not invalidate measured CPE transfer or broad human
      substrate assays.
