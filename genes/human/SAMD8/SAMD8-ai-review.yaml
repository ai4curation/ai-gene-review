- id: PMID:40998032
  title: Sphingomyelin synthase-related protein is a regulator of serine palmitoyltransferase.
  findings:
  - statement: Human liver/adipose datasets show SMSr/SPT coexpression without establishing causal
      direction.
    supporting_text: the directionality of the relationship cannot easily be assessed with observational
      human RNA-seq data.
    reference_section_type: RESULTS
  - statement: Mouse liver microsomal PE supplementation reduces SPT activity, and tagged SMSr co-immunoprecipitates
      with SPTLC2; these assays complement high-fat-diet knockout and overexpression phenotypes.
    supporting_text: We found that PE supplementation significantly reduced SPT activity in a dose-dependent
      fashion (Fig. 5D).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary methods, results and figure captions read. Human liver/adipose findings
      are observational expression analyses; mouse overexpression, high-fat-diet knockout, PE intervention,
      liver microsomal SPT assay and tagged co-IP support a conditional regulatory mechanism. Co-IP
      is not direct binary binding; exact PE-to-SPT mechanism remains unresolved. Low/undetectable
      CPE does not revoke independently demonstrated human CPE catalytic capacity.
- id: PMID:34332077
  title: Sphingomyelin synthase related protein is a mammalian phosphatidylethanolamine phospholipase
    C.
  findings:
  - statement: Direct human recombinant assays support PE-PLC but do not detect sphingomyelin synthesis
      under their conditions.
    supporting_text: Indeed, rSMSr produced NBD-CPE (Fig. 3A) but not NBD-SM (Fig. 3B).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary read. Recombinant human cDNA expressed in Sf9 supports PE-PLC/CPE
      activity and condition-specific negative SMS/PC/PA assays; mouse liver work establishes in-vivo
      PE/DAG effects. Broader specificity differs from PMID:33621517; the PI comparison is limited
      by spontaneous TopFluor-PI hydrolysis.
