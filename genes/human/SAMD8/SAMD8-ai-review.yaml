      nucleotide donor. This source-term correction does not claim that every possible CDP-choline
      assay is negative. GO:0002950 is not an alternative: it specifies CDP-ethanolamine/CMP, whereas
      the measured CPE reaction uses PE/DAG. An exact donor-specific ontology term is proposed separately.'
