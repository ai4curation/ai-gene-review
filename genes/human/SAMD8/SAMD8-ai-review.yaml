      independently confirms PE-PLC activity of recombinant human SMSr but finds no PC/PA hydrolysis
      and an inconclusive fluorescent-PI comparison with substrate background hydrolysis. The two 2021
      studies disagree over broader specificity; this supports retaining the broad PLC class while
      leaving the physiological substrate spectrum conditional.
