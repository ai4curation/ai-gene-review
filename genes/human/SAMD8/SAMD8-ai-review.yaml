    id: GO:0033188
    label: sphingomyelin synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: SAMD8 strongly favors CPE production; the extent of residual sphingomyelin synthase capacity
      requires reconciliation.
    action: UNDECIDED
    reason: The current PTHR21290 IBD for sphingomyelin synthase activity remains at PTN000480004.
      PMID:19506037 directly distinguishes SMSr CPE synthesis from conventional SM synthesis, while
      the updated UniProt account informed by PMID:38388831 describes little or no SMS activity. A
      substrate preference is not equivalent to demonstrated zero turnover. The 2024 full mechanistic
      assays, including gain-of-function mutants and wild-type controls, need focused assessment before
      a categorical loss claim. Withdraw the absolute removal and the erroneous replacement by the
      CDP-choline reaction. The completed OpenScientist report recommends rejection, but explicitly
      did not retrieve PMID:38388831; it therefore does not resolve the modern wild-type residual-activity
      controls. Newly accessed PMID:34332077 directly reports no NBD-SM in its recombinant human assay,
      strengthening the condition-specific negative evidence. Retain UNDECIDED pending the full 2024
      comparison rather than equate little or no activity with a universal exclusion.
