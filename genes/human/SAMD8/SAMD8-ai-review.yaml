      and mouse SPT-activity, PE-rescue and SPTLC2 co-IP experiments. This is substantive pathway-regulatory
      work, not evidence of a ceramide-forming reaction by SMSr; whether GO:0046513 encompasses this
      role versus the separate regulation term remains the specific curator question. The report omitted
