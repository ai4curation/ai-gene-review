  review:
    summary: The inherited CDP-choline-specific term conflates nucleotide-donor chemistry with SMS-family
      phospholipid headgroup transfer.
    action: MODIFY
    reason: 'Live GO:0047493 defines CDP-choline + ceramide = CMP + H+ + sphingomyelin. Source-node
      PTN000480004 is genuinely ancestral to human SAMD8 leaf PTN002501711, but its SMS1/SMS2 source
