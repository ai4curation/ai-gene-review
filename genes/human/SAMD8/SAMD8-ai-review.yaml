id: Q96LT4
gene_symbol: SAMD8
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SAMD8 (SMSr) is a multipass membrane enzyme enriched in the endoplasmic reticulum, with
  a small Golgi pool observed in cultured human cells. It transfers phosphoethanolamine from phosphatidylethanolamine
  to ceramide, producing ceramide phosphoethanolamine and diacylglycerol. SAM-domain-mediated oligomerization
  promotes ER retention. Human biochemical studies also demonstrate glycerophospholipid-hydrolyzing
  activities, whose substrate range and relative importance depend on construct and assay conditions.
  Acute perturbations in cultured cells disrupt ceramide homeostasis and can trigger mitochondrial
  apoptosis, whereas stable loss can be tolerated; mouse studies connect PE hydrolysis to hepatic
  lipid metabolism and conditional regulation of serine palmitoyltransferase (SPT). Human liver and
  adipose transcriptomes show coexpression with SPT genes, while direct mechanistic SPT experiments
  have been performed in mice.
