- id: PMID:19506037
  title: Sphingomyelin synthase-related protein SMSr controls ceramide homeostasis in the ER.
  findings:
  - statement: SAMD8 produces only trace amounts of CPE (~300-fold less than SMS1-derived SM) despite
      having detectable CPES activity in vitro
    supporting_text: the CPE levels in HeLa or CHO-K1 cells are exceedingly low (∼0.03 mol%, i.e.,
      300-fold lower than SM; see Fig. 5 A)
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: 'Functions as a ceramide sensor: blocking SAMD8 causes marked ceramide accumulation
      in ER, leading to ER exit site fragmentation and Golgi collapse'
    supporting_text: We propose that SMSr is a CPES with dual activity as ceramide sensor to control
      ceramide homeostasis in the ER and that the latter process is critical for the integrity of
      the early secretory pathway.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: Localizes specifically to ER membrane via N-terminal SAM domain; SAM domain removal
      causes redistribution to Golgi
    supporting_text: hSMSr-V5 gave a reticular and nuclear envelope staining pattern and colocalized
      with the ER marker protein disulfide isomerase
    reference_section_type: RESULTS
    full_text_unavailable: false
