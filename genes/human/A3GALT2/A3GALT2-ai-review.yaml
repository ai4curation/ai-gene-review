- id: PMID:18630988
  title: 'Humans lack iGb3 due to the absence of functional iGb3-synthase: implications for
    NKT cell development and transplantation.'
  findings:
  - statement: Extensive cross-exon RT-PCR failed to detect correctly spliced A3GALT2/iGb3S
      mRNA in the tested adult tissues and dendritic cells.
    supporting_text: Despite using numerous primer combinations, including forward primers from
      exons 2, 3, or 4 with a reverse primer from exon 5 (Figure 2C), we were unable to detect
      any products of the correct size to suggest spliced iGb3S mRNA in any human tissue examined
      (Figure 2D), even when a high cycle number (up to 40) was used (unpublished data).
    reference_section_type: RESULTS
  - statement: Rat/human chimeras carrying most or all of the human catalytic domain did not
      synthesize the Gal-alpha(1,3)-Gal epitope.
    supporting_text: The chimeric molecule containing the majority of the catalytic domain of
      human iGb3S (rat/human(exon5)-iGb3S) was unable to synthesise the Galα(1,3)Gal epitope
      as staining was not observed with 15.101 or human anti-Gal Ig (Figure 3B). A second chimeric
      molecule comprising the entire human catalytic domain, exon 4 together with exon 5 (rat/human(exon4,5)-iGb3S),
      was also unable to synthesize Galα(1,3)Gal (Figure 3B).
    reference_section_type: RESULTS
  - statement: The inactive chimeras were translated and showed Golgi-like trafficking, arguing
      against failed expression or gross mistargeting in that assay.
    supporting_text: Detection of the FLAG epitope in both chimeric enzymes confirmed that the
      absence of Galα(1,3)Gal synthesis was not due to impaired translation or expression (Figure
      S2A). As glycosyltransferases are integral membrane proteins of the Golgi complex where
      oligosaccharides are synthesized, perinuclear staining (Golgi-like) confirmed correct
      trafficking of the chimeric enzymes (Figure S2B).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Direct full-text human expression and functional study, but its categorical
      inactivity conclusion is contested by PMID:23378701. Functional testing used rat/human
      chimeras rather than native full-length human protein.
- id: PMID:23378701
  title: 'Lack of iGb3 and Isoglobo-Series Glycosphingolipids in Pig Organs Used for Xenotransplantation:
    Implications for Natural Killer T-Cell Biology.'
  findings:
  - statement: The assembled human iGb3S construct produced MS-detectable iGb3 and iGb4 after
      CHO-cell overexpression, but activity was very weak and no B4/B5/B6 elongation was detected.
    supporting_text: Our results showed that human iGb3 synthase initiated the synthesis of
      both iGb3 (Fig. 6A) and iGb4 (Fig. 6B), as measured by LIT-MSn technology. However, the
      human iGb3 synthase showed very weak activity even in the CHO cell transfection experiment
      and could not further elongate iGb3 to B4, B5, and B6 GSLs (Table 1).
    reference_section_type: RESULTS
  - statement: Exon 1 and the start of exon 2 were introduced by an amplification primer rather
      than recovered as an intact endogenous full-length transcript.
    supporting_text: The exon 1 and the beginning of exon 2 were directly added by PCR reaction
      using a long primer F1
    reference_section_type: METHODS
  - statement: iGb3 signature ions were found in monocyte-derived dendritic-cell preparations
      from five donors, but product detection does not causally identify A3GALT2 as the source.
    supporting_text: iGb3 signature ions were present in all of the five human dendritic cell
      samples generated from monocytes obtained from five different healthy donors (Fig. 1A),
      representing 1.2% to 10.8% of the iGb3/Gb3 isomer mixtures in some iGb3-containing MS1
      trihexosylceramide ions.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods and Figure 6/Table 1 independently re-read in cache and live
      PMC. Reconstructed human ORF assembled from pediatric-thymus cDNA fragments plus primer-derived
      5-prime sequence produces weak iGb3/iGb4 after CHO transfection and GFP sorting, with
      mock-transfected controls. Pig-organ title does not negate these human-construct experiments.
      This does not establish endogenous human protein or flux.
- id: PMID:18056651
  title: Sensitive detection of isoglobo and globo series tetraglycosylceramides in human thymus
    by ion trap mass spectrometry.
  findings:
  - statement: Ion-trap mass spectrometry identified iGb4 in human thymus, an indirect observation
      compatible with isoglobo-series synthesis but not attributable to A3GALT2 by this experiment.
    supporting_text: report the identification of isoglobotetraglycosylceramide in a CHO cell
      line transfected by iGb3 synthase, as well as in human thymus.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract verifies human-thymus iGb4 detection. This is indirect product-presence
      evidence and does not demonstrate A3GALT2 expression or causation; full text is unavailable
      in the cache.
- id: PMID:28406212
  title: Human knockouts and phenotypic analysis in a cohort with a high rate of consanguinity.
  findings:
  - statement: Two predicted p.Thr106SerfsTer4 homozygotes had markedly reduced fasting C-peptide
      and insulin; the authors explicitly considered human A3GALT2 biology uncertain.
    supporting_text: Alpha-1,3-galactosyltransferase 2 (encoded by A3GALT2) catalyzes the formation
      of the Gal-α1-3Galβ1-4GlcNAc-R (α-gal) epitope; the biological role of this enzyme in
      humans is uncertain.17 At A3GALT2, we identified two participants homozygous for a frameshift
      mutation, p.Thr106SerfsTer4. Compared with non-carriers, p.Thr106SerfsTer4 homozygotes
      both had dramatically reduced concentrations of fasting C-peptide (−97.4%; P = 6 × 10−12)
      and insulin (−92.3%; P = 1 × 10−4).
    reference_section_type: RESULTS
  - statement: The study cautions that predicted loss-of-function calls require experimental
      confirmation of transcript or protein loss.
    supporting_text: However, for any given pLoF, experimental validation will be required to
      prove loss of gene function (e.g., targeted assays such as RT-PCR of transcript and/or
      Western blot of protein to confirm its absence in the relevant tissue).
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Only two homozygotes carried the predicted frameshift; loss of A3GALT2 protein
      or function was not experimentally validated, and the association does not establish a
      mechanism. Its opening claim that A3GALT2 makes the Gal-alpha(1,3)-Gal-beta(1,4)-GlcNAc-R
      epitope is a secondary functional gloss, not a measurement in this study, and is not accepted
      here because it conflates GGTA1-type LacNAc specificity with iGb3S glycolipid chemistry.
      Retained only as phenotype context, not core-function support.
- id: PMID:30696937
  title: Amino acid substitutions at sugar-recognizing codons confer ABO blood group system-related
    α1,3 Gal(NAc) transferases with differential enzymatic activity.
  findings:
  - statement: The paper summarizes prior evidence as indicating that humans lack functional
      A3GALT2/iGb3S activity.
    supporting_text: For instance, humans may have functional AT and/or BT, depending on the
      polymorphic status at the ABO genetic locus, but they carry none of the functional GBGT1,
      A3GALT2, or GGTA1 genes nor exhibit any of FS, iGb3S, or GT activities26–29.
    reference_section_type: INTRODUCTION
  - statement: The iGb3S construct experimentally tested in this work was rat, not human.
    supporting_text: 'Firstly, we performed polymerase chain reaction (PCR) using appropriate
      primers and rat A3galt2-201 cDNA cloned in pCMV SPORT6 vector (OriGene) as template, subcloned
      the amplified DNA fragment into pSG5 vector (Stratagene), obtaining the rat iGb3S construct:
      R_A3GALT2.'
    reference_section_type: METHODS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Useful only as family and substrate background. Although it states that human
      A3GALT2 is nonfunctional, all iGb3S constructs and activity experiments in this paper
      used rat A3galt2, so it is not direct human evidence.
- id: PMID:32915357
  title: APOL1 polymorphism modulates sphingolipid profile of human podocytes.
  findings:
  - statement: A3GALT2 RNA was undetectable in the authors' whole-transcriptome analysis of
      immortalized human podocytes; the underlying result was not shown.
    supporting_text: 'gene expression level of A3GALT2 was undetectable in whole-transcriptome
      analysis generated in human immortalized podocytes (HPs) and downloaded from the NCBI
      SRA database (accession number: SUB7456861; data not shown).'
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: A3GALT2 is incidental to an APOL1/podocyte study. The negative expression
      result is data-not-shown from one immortalized podocyte model and cannot support organism-wide
      non-expression.
- id: PMID:10854427
  title: Expression cloning of a new member of the ABO blood group glycosyltransferases, iGb3
    synthase, that directs the synthesis of isoglobo-glycosphingolipids.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Accession A0A4Z3 and source title/abstract verified as rat placental iGb3
      synthase; abstract demonstrates glycolipid preference, not complete glycoprotein exclusion.
      The precise LacNAc acceptor assay underlying the UniProt RHEA:13013 statement remains
      unverified from accessible text. No source-miscitation claim is made.
- id: PMID:17298992
  title: Long-term evolution of the CAZY glycosyltransferase 6 (ABO) gene family from fishes
    to mammals--a birth-and-death evolution model.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified PubMed abstract is a 2007 comparative-genomics study. Its broad nonfunctional-human-GT6
      conclusion predates the conflicting 2013 human reconstruction experiment and cannot substitute
      for reconciling those assays. Full text unavailable in official cache; not used to negate
      target activity.
- id: file:human/A3GALT2/A3GALT2-hypotheses/human-enzyme-constructs-and-glycan-substrate-specificity/openscientist.md
  title: 'Human A3GALT2 enzyme constructs and glycan substrate specificity: focused OpenScientist
    report'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Full report and four artifacts read. Its pivotal claim that PMID:23378701
      contains no human positive experiment was inferred from the pig-focused abstract and is
      contradicted by full Methods, Figure 6 and Table 1. It also overlooks Figure 5 reverse-mutant
      experiments in PMID:18630988. Q3V1N9 is mouse, not rat: human U3KPV4 N253 aligns to rat
      A0A4Z3 Y252 and mouse Q3V1N9 Y283 in sequence version 1. The reported sequence identities/GTEx
      values lack reproducible raw artifacts. The source studies genuinely disagree in construct
      and assay scope; the report does not resolve the NOT or independently establish LacNAc
      exclusion.'
knowledge_gaps:
- gap_statement: It is unknown whether an intact endogenous full-length A3GALT2
    transcript and protein are expressed in any human cell type or developmental
    state.
  boundary: The 2008 study failed to detect correctly spliced RNA in the adult
    tissues and dendritic cells tested, whereas the 2013 study recovered separate
    pediatric-thymus cDNA fragments and supplied exon 1 and part of exon 2 by primer;
    UniProt remains at transcript-level protein evidence.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: Without endogenous full-length expression, neither catalytic nor
    localization claims can be assigned physiological significance.
  resolution: Demonstrate every exon junction in a native transcript and detect
    an A3GALT2-specific endogenous protein in the same human cell or tissue.
  provenance:
  - reference_id: PMID:18630988
    supporting_text: Despite using numerous primer combinations, including forward
      primers from exons 2, 3, or 4 with a reverse primer from exon 5 (Figure 2C),
      we were unable to detect any products of the correct size to suggest spliced
      iGb3S mRNA in any human tissue examined (Figure 2D), even when a high cycle
      number (up to 40) was used (unpublished data).
  - reference_id: PMID:23378701
    supporting_text: The exon 1 and the beginning of exon 2 were directly added
      by PCR reaction using a long primer F1
- gap_statement: Whether endogenous human A3GALT2 catalyzes any measurable reaction
    or contributes causally to physiological iGb3 or iGb4 flux is unresolved.
  boundary: A reconstructed human coding sequence produced MS-detectable iGb3 and
    iGb4 after CHO-cell overexpression, but the authors characterized the activity
    as very weak; an earlier human-catalytic-domain chimera study was negative.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: This determines whether A3GALT2 is an active human glycosyltransferase
    or a retained, weakly competent sequence without a physiological catalytic role.
  resolution: In a human cell with verified endogenous protein, combine A3GALT2
    knockout and wild-type rescue with isomer-resolved quantitative lipidomics and
    isotope tracing; independently reproduce activity with verified full-length
    protein and matched acceptor panels.
  provenance:
  - reference_id: PMID:23378701
    supporting_text: However, the human iGb3 synthase showed very weak activity
      even in the CHO cell transfection experiment and could not further elongate
      iGb3 to B4, B5, and B6 GSLs (Table 1).
- gap_statement: The native subcellular location and membrane topology of endogenous
    human A3GALT2 protein are unknown.
  boundary: The sequence predicts an N-terminal type-II membrane signal anchor,
    but Golgi-like localization was observed only for chimeras whose targeting
    segments were rat-derived; UniProt transfers the Golgi statement by similarity.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: Compartment and topology determine which lipid or glycoconjugate
    acceptors a putative lumenal glycosyltransferase can encounter.
  resolution: Endogenously tag verified A3GALT2 protein and combine organelle-resolved
    imaging with protease protection and glycosylation-accessibility assays.
  provenance:
  - reference_id: PMID:18630988
    supporting_text: The other rat exons encode the cytoplasmic tail, transmembrane
      domain, and stalk that anchors the molecule in the lipid bilayer.
core_functions: []
suggested_questions:
- question: Is an endogenous full-length A3GALT2 transcript and protein expressed
    in any human cell type, tissue, or developmental state?
- question: Does endogenous human A3GALT2 causally generate iGb3 or iGb4, rather
    than merely retaining very weak catalytic capacity when an assembled coding
    sequence is overexpressed?
- question: If endogenous A3GALT2 protein exists, does it localize to Golgi cisternae
    or vesicles with the predicted type-II membrane topology, and what native
    biochemical activity and substrate specificity does it have?
suggested_experiments:
- hypothesis: A full-length A3GALT2 transcript and protein are expressed only in
    a restricted human cell type or developmental window.
  description: Survey fetal and adult thymic populations, monocyte-derived dendritic
    cells, and other candidate tissues using long-read RNA sequencing or RACE across
    every exon junction, followed by targeted proteomics and an independently validated
    A3GALT2-specific antibody to establish endogenous full-length transcript and protein.
  experiment_type: expression analysis
- hypothesis: Endogenous A3GALT2 is responsible for low-level human iGb3 and iGb4
    biosynthesis.
  description: In a human cell type with verified endogenous A3GALT2 protein, combine
    CRISPR knockout with wild-type and catalytic-site-mutant rescue, stable-isotope
    UDP-galactose tracing, and isomer-resolved quantitative LC-MS/MS of iGb3, iGb4,
    and precursor lipids to test causal glycosphingolipid flux.
  experiment_type: genome editing and lipidomics
- hypothesis: Native human A3GALT2 is a Golgi type-II membrane protein with weak
    lactosylceramide alpha-1,3-galactosyltransferase activity.
  description: Introduce a minimally disruptive tag at the endogenous locus for
    super-resolution microscopy, organelle fractionation, and membrane-topology
    mapping; in parallel, compare verified full-length human, rat, and catalytic-site-mutant
    proteins in the same reconstituted membrane enzymology assay with lactosylceramide
    and N-acetyllactosaminide acceptors.
  experiment_type: endogenous localization and comparative enzymology
