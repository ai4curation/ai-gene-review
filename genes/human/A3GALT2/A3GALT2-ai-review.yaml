      indirect product-presence evidence and does not demonstrate A3GALT2 expression
      or causation; full text is unavailable in the cache.
- id: PMID:28406212
  title: Human knockouts and phenotypic analysis in a cohort with a high rate of consanguinity.
  findings:
  - statement: Two predicted p.Thr106SerfsTer4 homozygotes had markedly reduced
      fasting C-peptide and insulin; the authors explicitly considered human A3GALT2
      biology uncertain.
    supporting_text: Alpha-1,3-galactosyltransferase 2 (encoded by A3GALT2) catalyzes
      the formation of the Gal-α1-3Galβ1-4GlcNAc-R (α-gal) epitope; the biological
      role of this enzyme in humans is uncertain.17 At A3GALT2, we identified two
      participants homozygous for a frameshift mutation, p.Thr106SerfsTer4. Compared
      with non-carriers, p.Thr106SerfsTer4 homozygotes both had dramatically reduced
      concentrations of fasting C-peptide (−97.4%; P = 6 × 10−12) and insulin (−92.3%;
      P = 1 × 10−4).
    reference_section_type: RESULTS
  - statement: The study cautions that predicted loss-of-function calls require
      experimental confirmation of transcript or protein loss.
    supporting_text: However, for any given pLoF, experimental validation will
      be required to prove loss of gene function (e.g., targeted assays such as
      RT-PCR of transcript and/or Western blot of protein to confirm its absence
      in the relevant tissue).
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Only two homozygotes carried the predicted frameshift; loss of A3GALT2
      protein or function was not experimentally validated, and the association
      does not establish a mechanism. Its opening claim that A3GALT2 makes the
      Gal-alpha(1,3)-Gal-beta(1,4)-GlcNAc-R epitope is a secondary functional gloss,
      not a measurement in this study, and is not accepted here because it conflates
      GGTA1-type LacNAc specificity with iGb3S glycolipid chemistry. Retained only
      as phenotype context, not core-function support.
