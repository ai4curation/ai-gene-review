  review:
    summary: The precise LacNAc reaction remains unresolved independently of weak human iGb3-synthase
      capacity.
    action: UNDECIDED
    reason: GO:0047276 requires Gal-beta1,4-GlcNAc, whereas the verified human CHO experiment
      in PMID:23378701 measures products derived from lactosylceramide, Gal-beta1,4-Glc-ceramide.
      Positive activity on that acceptor neither proves nor excludes LacNAc use. The ISS source
      and corresponding UniProt RHEA:13013 statement trace specifically to rat A0A4Z3 and PMID:10854427;
