- id: PMID:18630988
  title: 'Humans lack iGb3 due to the absence of functional iGb3-synthase: implications
    for NKT cell development and transplantation.'
  findings:
  - statement: Extensive cross-exon RT-PCR failed to detect correctly spliced
      A3GALT2/iGb3S mRNA in the tested adult tissues and dendritic cells.
    supporting_text: Despite using numerous primer combinations, including forward
      primers from exons 2, 3, or 4 with a reverse primer from exon 5 (Figure 2C),
      we were unable to detect any products of the correct size to suggest spliced
      iGb3S mRNA in any human tissue examined (Figure 2D), even when a high cycle
      number (up to 40) was used (unpublished data).
    reference_section_type: RESULTS
  - statement: Rat/human chimeras carrying most or all of the human catalytic
      domain did not synthesize the Gal-alpha(1,3)-Gal epitope.
    supporting_text: The chimeric molecule containing the majority of the catalytic
      domain of human iGb3S (rat/human(exon5)-iGb3S) was unable to synthesise the
      Galα(1,3)Gal epitope as staining was not observed with 15.101 or human anti-Gal
      Ig (Figure 3B). A second chimeric molecule comprising the entire human catalytic
      domain, exon 4 together with exon 5 (rat/human(exon4,5)-iGb3S), was also unable
      to synthesize Galα(1,3)Gal (Figure 3B).
    reference_section_type: RESULTS
  - statement: The inactive chimeras were translated and showed Golgi-like trafficking,
      arguing against failed expression or gross mistargeting in that assay.
    supporting_text: Detection of the FLAG epitope in both chimeric enzymes confirmed
      that the absence of Galα(1,3)Gal synthesis was not due to impaired translation
      or expression (Figure S2A). As glycosyltransferases are integral membrane proteins
      of the Golgi complex where oligosaccharides are synthesized, perinuclear staining
      (Golgi-like) confirmed correct trafficking of the chimeric enzymes (Figure S2B).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Direct full-text human expression and functional study, but its
      categorical inactivity conclusion is contested by PMID:23378701. Functional
      testing used rat/human chimeras rather than native full-length human protein.
- id: PMID:23378701
  title: 'Lack of iGb3 and Isoglobo-Series Glycosphingolipids in Pig Organs Used for
    Xenotransplantation: Implications for Natural Killer T-Cell Biology.'
  findings:
  - statement: The assembled human iGb3S construct produced MS-detectable iGb3
      and iGb4 after CHO-cell overexpression, but activity was very weak and no
      B4/B5/B6 elongation was detected.
    supporting_text: Our results showed that human iGb3 synthase initiated the synthesis
      of both iGb3 (Fig. 6A) and iGb4 (Fig. 6B), as measured by LIT-MSn technology.
      However, the human iGb3 synthase showed very weak activity even in the CHO
      cell transfection experiment and could not further elongate iGb3 to B4, B5,
      and B6 GSLs (Table 1).
    reference_section_type: RESULTS
  - statement: Exon 1 and the start of exon 2 were introduced by an amplification
      primer rather than recovered as an intact endogenous full-length transcript.
    supporting_text: The exon 1 and the beginning of exon 2 were directly added
      by PCR reaction using a long primer F1
    reference_section_type: METHODS
  - statement: iGb3 signature ions were found in monocyte-derived dendritic-cell
      preparations from five donors, but product detection does not causally identify
      A3GALT2 as the source.
    supporting_text: iGb3 signature ions were present in all of the five human dendritic
      cell samples generated from monocytes obtained from five different healthy
      donors (Fig. 1A), representing 1.2% to 10.8% of the iGb3/Gb3 isomer mixtures
      in some iGb3-containing MS1 trihexosylceramide ions.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Key contrary full-text report of weak human activity. The assay
      used CHO overexpression and mass spectrometry, and the tested ORF was assembled
      from thymic cDNA fragments with exon 1 and the start of exon 2 supplied by
      a PCR primer, so it does not establish endogenous protein or physiological
      flux.
