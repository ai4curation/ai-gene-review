id: U3KPV4
gene_symbol: A3GALT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  A3GALT2 encodes a predicted GT6-family single-pass type II membrane protein
  homologous to mammalian isoglobotriaosylceramide synthase. Human catalytic
  activity remains unresolved: rat-human catalytic-domain chimeras lacked
  detectable activity, whereas a reconstructed human coding sequence produced
  only very weak iGb3 and iGb4 after overexpression in CHO cells. Endogenous
  full-length transcript and protein expression, subcellular localization, and
  physiological glycosphingolipid flux remain unestablished.
