id: Q9UPW5
gene_symbol: AGTPBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGTPBP1 encodes cytosolic carboxypeptidase 1 (CCP1), a zinc-dependent protein deglutamylase.
  It hydrolyzes terminal alpha-linked glutamates from polyglutamylated tubulin side chains and from gene-encoded
  tubulin C termini, generating delta2- and delta3-tubulin. On the tubulin substrates examined, CCP1 shortens
  glutamate chains without removing the gamma-linked branching glutamate. This activity controls microtubule
  modification and supports neuronal integrity. CCP1 is predominantly studied in the cytoplasmic microtubule
  system; nuclear distribution and a mitochondrial-associated pool have also been reported. Reported non-tubulin
  substrates include myosin light-chain kinase; KLF4 deglutamylation is described in reprogramming studies. Biallelic loss-of-function
  variants cause childhood-onset neurodegeneration with cerebellar atrophy, affecting the central and
  peripheral nervous systems.
