core_functions:
- description: Hydrolyzes terminal alpha-linked glutamate residues from tubulin C termini and polyglutamate
    side chains, controlling the glutamylation state of the cytoplasmic microtubule system. On the tested
    tubulin substrates it shortens side chains without cleaving their gamma-linked branch point. Tubulin
    recognition and zinc-dependent carboxypeptidase chemistry form one integrated activity; non-tubulin
    deglutamylation is an extension of substrate scope rather than a separate catalytic mechanism.
  molecular_function:
    id: GO:0004181
    label: metallocarboxypeptidase activity
  directly_involved_in:
  - id: GO:0035609
    label: C-terminal protein deglutamylation
  - id: GO:0035610
    label: protein side chain deglutamylation
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0015630
    label: microtubule cytoskeleton
  supported_by:
  - reference_id: PMID:22170066
    supporting_text: 'Purified CCP1 produced delta2-tubulin

      from purified porcine brain α-tubulin or polymerized HEK293T microtubules.'
  - reference_id: PMID:22170066
    supporting_text: CCP1 removed Glu residues from the polyglutamyl side chains
suggested_questions:
- question: Which full experiments underlying the mouse photoreceptor/Purkinje differentiation and olfactory-bulb
    development annotations distinguish developmental participation from maintenance of mature neurons,
    and how do those findings transfer to human AGTPBP1?
- question: What fraction of endogenous human CCP1 resides in mitochondria or nuclei, and which substrates
    are directly processed in each compartment? Existing rodent fractionation and nuclear staining do
    not by themselves identify compartment-specific catalysis.
- question: Which human CCP1 isoforms account for the documented localization and substrate activities?
    The three sequence products are preserved, but most experiments do not resolve them.
- question: Does the effect on mitochondrial fusion arise entirely through tubulin-dependent motility,
    or are additional CCP1 substrates involved? Catalytic-dependence and transport results support participation
    but do not settle this causal route.
