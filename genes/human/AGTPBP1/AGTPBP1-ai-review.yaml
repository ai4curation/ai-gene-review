- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000834
  review:
    summary: Refine broad proteolysis to the two directly measured glutamate-removal processes.
    action: MODIFY
    reason: The M14 domain correctly indicates hydrolytic peptide-bond cleavage, but the human assays
      identify protein modification rather than indiscriminate protein turnover. CCP1 removes gene-encoded
      terminal glutamates and shortens polyglutamylated side chains. GO:0035609 and GO:0035610 distinguish
      those two measured processes. They are sibling protein-modification terms, not claimed to be formal
      children of proteolysis; no redundant NEW annotation is added.
    additional_reference_ids:
    - PMID:22170066
    - PMID:24022482
    supported_by:
    - reference_id: PMID:22170066
      supporting_text: 'Purified CCP1 produced delta2-tubulin

        from purified porcine brain α-tubulin or polymerized HEK293T microtubules.'
    - reference_id: PMID:22170066
      supporting_text: CCP1 removed Glu residues from the polyglutamyl side chains
    proposed_replacement_terms:
    - id: GO:0035609
      label: C-terminal protein deglutamylation
    - id: GO:0035610
      label: protein side chain deglutamylation
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: InterPro:IPR000834
        source_status: SUPPORTS_TRANSFER
        comment: The peptidase-domain mapping captures genuine hydrolysis but not the demonstrated substrate-specific
