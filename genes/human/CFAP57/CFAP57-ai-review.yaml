      Human Protein Atlas immunofluorescence localizes CFAP57 to cilia.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports. CFAP57 is an axonemal component
      of motile cilia: it localizes throughout the axoneme of human nasal and tracheal
      motile cilia (PMID:32764743) and to sperm flagella (PMID:41466333), its orthologs are
      found only in organisms that assemble inner dynein arms (PMID:31483737), and it has
      no known role in primary cilia. GO:0031514 motile cilium (an is_a descendant of
      cilium) is the appropriate term; the more specific sperm flagellum location is
      already carried and accepted.
