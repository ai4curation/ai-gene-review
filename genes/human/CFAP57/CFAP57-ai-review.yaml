  title: FAP57/WDR65 targets assembly of a subset of inner arm dyneins and connects to
    regulatory hubs in cilia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text in cache. Chlamydomonas ida8/bop2 mutants, proteomics and cryo-ET with gold
      labelling; defines FAP57 as an extended axonemal structure needed for docking of
      inner dyneins g and d.
  findings:
  - statement: FAP57 targets or stabilizes the attachment of a subset of inner dyneins.
    supporting_text: Collectively, these observations strongly suggested that FAP57 targets or stabilizes the attachment of these dyneins to their unique binding sites in the 96 nm repeat
  - statement: FAP57 forms an extended structure interconnecting IDAs and regulatory complexes.
    supporting_text: Cryo-electron tomography coupled with epitope tagging and gold labeling reveal that FAP57 forms an extended structure that interconnects multiple IDAs and regulatory complexes
- id: PMID:32764743
  title: Mutation of CFAP57, a protein required for the asymmetric targeting of a subset
    of inner dynein arms in Chlamydomonas, causes primary ciliary dyskinesia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text in cache. Single PCD subject with a homozygous CFAP57 variant; CFAP57 in the
      axoneme of human airway cilia; reduced beat frequency and altered waveform in patient
      cells and hTEC knockdown; Chlamydomonas fap57 mutants. Human genetic evidence rests on
      one individual.
  findings:
  - statement: CFAP57 localizes throughout the axoneme of human airway cilia.
    supporting_text: In normal human nasal epithelial cells, CFAP57 localizes throughout the ciliary axoneme
  - statement: Loss of axonemal CFAP57 reduces beat frequency and alters waveform.
    supporting_text: A reduced beat frequency and an alteration in ciliary waveform was observed
- id: PMID:36752199
  title: Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities
    of the flagella in humans and mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text in cache. Three Pakistani MMAF families and a knock-in mouse model; loss of
      the long CFAP57 isoform removes inner dynein arms, especially single-headed IDAs, from
      sperm flagella. Basis of the SPGF95 disease entry.
  findings:
  - statement: Loss of long-isoform CFAP57 disrupts inner dynein arm assembly in sperm.
    supporting_text: Subsequent examinations of the spermatozoa from Cfap57-mutant mice revealed that CFAP57 deficiency disrupted the inner dynein arm (IDA) assembly in sperm flagella and that single-headed IDAs were more likely to be affected
  - statement: The mouse model recapitulates MMAF.
    supporting_text: A mouse model mimicking the mutation (c.2872C>T) was generated and recapitulated the typical MMAF phenotype of CFAP57-mutated individuals
- id: PMID:41466333
  title: Mutations in CFAP57 disrupt the localization of MYH10 and IFT88, leading to
    flagellogenesis failure in humans and mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text in cache. Additional CFAP57 variants and a mutant mouse with MMAF; CFAP57
      localizes to sperm flagella. The proposed MYH10/IFT88 mechanism is single-study and is
      not used for annotation.
  findings:
  - statement: CFAP57 localizes to sperm flagella.
    supporting_text: Immunofluorescence analysis confirmed that both MYH10 and CFAP57 localize to the sperm flagella
  - statement: CFAP57 mutant mice reproduce MMAF and infertility.
    supporting_text: CRISPR-Cas9-generated CFAP57 mutant mice recapitulated human MMAF phenotypes, exhibiting structural flagellar defects and complete infertility
- id: PMID:41793497
  title: A novel CFAP57 nonsense mutation causes asthenozoospermia in a consanguineous
