suggested_questions:
- question: >-
    Do the long and short CFAP57 isoforms have tissue-specific roles, with the long isoform
    required in sperm and the short isoform sufficient in airway cilia? This would explain
    why most men with CFAP57 variants affecting only the long transcript lack respiratory
    symptoms, while a single PCD subject has been reported.
- question: >-
    Should CFAP57 also be annotated to GO:0120316 sperm flagellum assembly? Biallelic
    loss-of-function causes MMAF in human and mouse, but the primary defect appears to be
    inner dynein arm docking. An OLS hierarchicalAncestors query (2026-10-16) shows that
    GO:0120316 is_a GO:0044458 motile cilium assembly, part_of GO:0030317 flagellated
    sperm motility and part_of GO:0007286 spermatid development; through GO:0030317 (is_a
    GO:0060294 cilium movement involved in cell motility, is_a GO:0003341 cilium movement)
    it is a descendant of cilium movement, which is proposed here, and through GO:0007286
    (part_of GO:0048515 spermatid differentiation, part_of GO:0007283 spermatogenesis) of
    spermatogenesis. If it were adopted it would replace cilium movement in core functions
    rather than be added beside it, at the cost of the airway evidence.
- question: >-
    Is GO:0005200 structural constituent of cytoskeleton the right molecular function for
    non-catalytic axonemal docking scaffolds such as CFAP57, CCDC39 and CCDC40, which
    currently carry no informative MF in GOA?
suggested_experiments:
- hypothesis: >-
    The short CFAP57 isoform is sufficient for inner dynein arm docking in airway cilia but
    not in sperm flagella.
  description: >-
    Generate mice lacking only the short isoform or only the long isoform; analyze tracheal
    and sperm axonemes by cryo-electron tomography with subtomogram averaging to quantify
    inner dynein arm g/d occupancy, and measure ciliary beat frequency and sperm motility.
  experiment_type: mouse genetics / structural biology
