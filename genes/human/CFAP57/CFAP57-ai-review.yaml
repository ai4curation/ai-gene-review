- term:
    id: GO:0036159
    label: inner dynein arm assembly
  evidence_type: IMP
  original_reference_id: PMID:36752199
  review:
    summary: >-
      Proposed process. CFAP57 targets and stabilizes the binding of a subset of inner
      dynein arms in Chlamydomonas, and its loss disrupts inner dynein arm assembly in human
      and mouse sperm flagella.
    action: NEW
    reason: >-
      Participation: CFAP57 is not a dynein subunit, but it supplies the structure on which
      specific inner dynein arms dock. FAP57 forms an extended structure contacting multiple
      IDAs and stabilizes the binding of IDA g and, to a lesser extent, IDA d
      (PMID:31483737); patient sperm show a normal 9+2 axoneme lacking IDAs, and Cfap57
      mutant mouse sperm lose single-headed IDAs although the dynein proteins are still
      synthesized (PMID:36752199). This is the scaffold case: the dynein assembles onto a
      site CFAP57 helps form. Comparator check (QuickGO, 2026-10-16): CCDC39 and CCDC40,
      axonemal docking/ruler proteins that specify attachment sites for IDAs and other
      complexes, carry GO:0036159 by IMP in human. The term is not an ancestor or
      descendant of the other terms proposed here or carried by CFAP57.
    supported_by:
    - reference_id: PMID:31483737
      supporting_text: Collectively, these observations strongly suggested that FAP57 targets or stabilizes the attachment of these dyneins to their unique binding sites in the 96 nm repeat
    - reference_id: PMID:36752199
      supporting_text: Subsequent examinations of the spermatozoa from Cfap57-mutant mice revealed that CFAP57 deficiency disrupted the inner dynein arm (IDA) assembly in sperm flagella and that single-headed IDAs were more likely to be affected
    - reference_id: PMID:36752199
      supporting_text: Ultrastructural analysis of the sperm flagella from CFAP57-mutated individuals revealed the presence of a normal 9 + 2 structure with only IDAs’ absence
- term:
    id: GO:0003341
    label: cilium movement
  evidence_type: IMP
  original_reference_id: PMID:32764743
  review:
    summary: >-
      Proposed process. Loss of axonemal CFAP57 reduces ciliary beat frequency and alters
      waveform in human airway cells and in Chlamydomonas.
    action: NEW
    reason: >-
      Patient nasal cells lacking axonemal CFAP57 and CFAP57-knockdown tracheobronchial
      cells show reduced beat frequency and altered waveform, and fap57 Chlamydomonas swim
      slowly with altered waveforms (PMID:32764743). CFAP57 participates as an axonemal
      structural element that positions the inner dynein motors and interconnects them with
      regulatory complexes (PMID:31483737), not as a remote requirement. Comparator check
      (QuickGO, 2026-10-16): CCDC39 and CCDC40 carry GO:0003341 by IMP. The human airway
      evidence is a single PCD subject plus knockdown in cultured cells, so the term is
      proposed for motile cilia in general. GO:0120316 sperm flagellum assembly was not also
      proposed: an OLS hierarchicalAncestors query (2026-10-16) shows it is_a GO:0044458
      motile cilium assembly and part_of GO:0030317 flagellated sperm motility, and
      GO:0030317 is_a GO:0060294 cilium movement involved in cell motility, which is_a
      GO:0003341 cilium movement, so the two would be an ancestor/descendant pair; it is
      raised as a question instead.
    supported_by:
    - reference_id: PMID:32764743
      supporting_text: A reduced beat frequency and an alteration in ciliary waveform was observed
    - reference_id: PMID:32764743
      supporting_text: Knockdown of CFAP57 in human tracheobronchial epithelial cells (hTECs) recapitulates these findings
    - reference_id: PMID:32764743
      supporting_text: Two independent, insertional fap57 Chlamydomonas mutant strains show reduced swimming velocity and altered waveforms
- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: ISS
  original_reference_id: PMID:31483737
  review:
    summary: >-
      Proposed molecular function. CFAP57 has no known enzymatic activity; it is an
      extended WD40/coiled-coil structural element of the axoneme.
    action: NEW
    reason: >-
      CFAP57 has no molecular function annotation. Its established activity is structural,
      within the axoneme (a cytoskeletal structure): FAP57 forms an extended structure along
      the doublet that interconnects multiple IDAs and regulatory complexes
      (PMID:31483737). The term matches the CFAP61 review in this repository for axonemal
      scaffold subunits; because comparable proteins carry no informative MF in GOA, the
      choice is also raised as a question.
    supported_by:
    - reference_id: PMID:31483737
      supporting_text: Cryo-electron tomography coupled with epitope tagging and gold labeling reveal that FAP57 forms an extended structure that interconnects multiple IDAs and regulatory complexes
core_functions:
- description: >-
    Extended structural element bound along the axonemal doublet microtubule that
    interconnects inner dynein arms with regulatory complexes and targets or stabilizes the
    docking of a subset of single-headed inner dynein arms (dyneins g and d in
    Chlamydomonas) in the 96-nm repeat, supporting normal ciliary and sperm flagellar
    beating; the long isoform is required in sperm flagella.
