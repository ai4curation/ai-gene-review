    label: diaphragm development
  evidence_type: IMP
  original_reference_id: PMID:20799323
  qualifier: involved_in
  review:
    summary: The cited study nominates DISP1 as a candidate contributor to diaphragm development.
    action: UNDECIDED
    reason: The full PMID:20799323 Methods and Results identify a mosaic de novo human A1471G
      variant in a congenital diaphragmatic hernia case and demonstrate wild-type mouse Disp1
      expression in the pleuroperitoneal fold. They do not establish the variant effect with
      a DISP1 functional assay or test diaphragm development after a controlled DISP1 perturbation.
      The lineage-tracing experiment concerns Shh-expressing cells, not Disp1, and the authors
      explicitly leave the DISP1 mechanism and mutant diaphragm phenotype unresolved. Preserve
      the imported IMP assertion as undecided rather than conclude that the association is
      false or that a causal diaphragm function has been demonstrated. This decision is based
      on the accessed full original, not the title or an abstract-only inference.
