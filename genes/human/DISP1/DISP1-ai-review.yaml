- id: PMID:19184110
  title: Truncating loss-of-function mutations of DISP1 contribute to holoprosencephaly-like microform
    features in humans.
  findings:
  - statement: Two human families carried truncating DISP1 variants associated with craniofacial microforms
      of holoprosencephaly; both affected daughters inherited the variant from a clinically unaffected
      mother.
  - statement: The corresponding truncations impaired SHH export when modeled in murine Disp1 in Drosophila
      S2R+ cells; wild-type human DISP1 was not functional in that assay system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full cached original selected Methods, Results and Discussion were read. Human
      clinical findings are distinguished from the murine construct assay in Drosophila cells. Both
      affected daughters had normal reported brain imaging; the paper does not establish uniform severe
      holoprosencephaly or complete penetrance of heterozygous loss of function.
