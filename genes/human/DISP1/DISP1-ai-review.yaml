- id: PMID:34845226
  title: Structural insights into proteolytic activation of the human Dispatched1 transporter
    for Hedgehog morphogen release.
  findings:
  - statement: Human DISP1 directly binds SHH and supports SCUBE-dependent release of the
      lipid-modified ligand from human cells.
  - statement: Proteolytic processing improves SHH binding and release; structural analysis
      resolves protein recognition while leaving the lipid termini and precise SCUBE handoff
      unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent selected original Methods, Results and text captions were read.
      Human wild-type and 3C constructs supply functional assays; transport-inactive human
      NNN supplies the principal structural preparations. Mouse SCUBE2 was used with human
      DISP1/SHH. Some interface-mutant release defects can include altered surface delivery,
      particularly N81A. No full figure-pixel or supplemental-data reanalysis is claimed.
- id: PMID:34707294
  title: Dispatched uses Na(+) flux to power release of lipid-modified Hedgehog.
  findings:
  - statement: Mouse DISP1 uses sodium-dependent conformational coupling to support release
      of lipid-modified Hedgehog to SCUBE2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent selected original Methods, Results and text captions were read.
      The mouse Disp1-A construct deletes residues 3–171 from the 1521-residue protein; it
      is not a human natural isoform. Structural SHH was unlipidated mouse residues 26–189,
      whereas the release assays used lipid-modified ligand in mouse embryonic fibroblasts.
      The evidence informs human mechanism by ortholog comparison; it does not establish direct
      human sodium-flux measurements or a precise coupling stoichiometry.
- id: PMID:22902404
  title: Dispatched and scube mediate the efficient secretion of the cholesterol-modified
    hedgehog ligand.
  findings:
  - statement: Mouse DispA binds cholesterol-modified human SHH and cooperates with SCUBE2
      to release signaling-active ligand.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent selected original Results, captions and main Methods were read.
      Mouse transporter, human SHH and human 293T host cells must remain distinct. The study
      includes direct medium-release immunoblots in addition to reporter cocultures, with
      serum-free controls. Limited SCUBE2-mediated release without DispA under some conditions
      precludes universal absolute necessity wording. No independent reading of the complete
      supplement is claimed.
