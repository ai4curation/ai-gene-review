  qualifier: involved_in
  review:
    summary: Recombinant VWF A1 domain supports flow-dependent platelet adhesion; A1 mutations mapping
      the GPIb site reduce adhesion.
    action: MODIFY
    reason: Correct but general. The assay measures platelet adhesion to an immobilized VWF substrate,
