      supporting_text: The stoichiometry of binding was one ADAMTS13 per two von Willebrand factor monomers,
        and the K(d) was 14 nm.
    - reference_id: PMID:16221672
      supporting_text: ADAMTS13 controls the multimeric size of circulating von Willebrand factor (VWF)
        by cleaving the Tyr1605-Met1606 bond in theA2 domain.
