suggested_questions:
- question: Should GO have a specific 'coagulation factor VIII binding' molecular function term (or is
    protein carrier chaperone the intended home) for VWF D'D3 binding to FVIII?
- question: Is GO:0005201 extracellular matrix structural constituent appropriate at PANTHER node PTN000885756
    for VWF, given that VWF's matrix role is adhesive bridging rather than structural integrity?
- question: How exactly does elongational force convert A1 into a high-affinity GPIb-alpha binding state
    in full-length multimers in vivo, and which autoinhibitory modules are released?
- question: Does VWF act directly in endothelial angiogenic signaling (e.g. via integrin alphaVbeta3 or
    VEGFR2), or is the angiogenic phenotype of VWF deficiency an indirect consequence of disrupted Weibel-Palade
    body storage of angiopoietin-2?
- question: What is the physiological role, if any, of the circulating VWF propeptide binding to integrin
    alpha4beta1 on leukocytes?
suggested_experiments:
- hypothesis: Tensile force on VWF multimers relieves A1 autoinhibition by flanking sequences, increasing
    GPIb-alpha affinity.
  description: Single-molecule force spectroscopy (optical tweezers) on full-length VWF and A1 flanking-region
    mutants, measuring GPIb-alpha bond lifetimes as a function of force.
  experiment_type: biophysics
- hypothesis: The D'D3 interface for FVIII is the determinant of FVIII plasma survival.
  description: Cryo-EM of the full FVIII-D'D3 complex combined with mouse Vwf knock-in of type 2N variants
    to correlate interface disruption with FVIII half-life.
  experiment_type: structural biology
