  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:98941
  - PANTHER:PTN002602369
  - UniProtKB:P04275
  review:
    summary: PAINT IBA for blood coagulation at the VWF subfamily node (PTN002602369), grounded in human
      and mouse VWF experimental data.
    action: ACCEPT
    reason: VWF contributes to coagulation both by forming the primary platelet plug scaffold and by carrying
      and stabilizing FVIII, an essential cofactor of the intrinsic tenase; VWD type 3 causes secondary
      FVIII deficiency. The IBA node placement within the VWF clade is sound.
    supported_by:
    - *id006
    - &id008
      reference_id: PMID:9759493
      supporting_text: Von Willebrand factor (VWF) is a blood glycoprotein that is required for normal
        hemostasis
    - reference_id: file:human/VWF/VWF-deep-research-falcon.md
      supporting_text: region binds FVIII and protects it from premature clearance and proteolysis; VWF
        deficiency consequently lowers circulating FVIII.
    additional_reference_ids:
    - file:human/VWF/VWF-deep-research-falcon.md
