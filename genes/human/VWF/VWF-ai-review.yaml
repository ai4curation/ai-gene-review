  review:
    summary: PAINT IBA propagation of ECM structural constituent to VWF from a broad node of the VWF-domain/mucin/SCO-spondin
      family (PTHR11339).
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0005201 describes contribution to the structural integrity of the ECM. VWF is deposited
      into the subendothelial matrix and binds collagens, but its role there is that of an adhesive bridge
      that captures platelets under flow, not a load-bearing structural component of the matrix. VWD causes
      bleeding, not connective-tissue fragility. Matrisome classification ('ECM glycoprotein') is supported
      by the ECM location annotations instead. The PTN000885756 node spans diverse VWD-domain proteins;
      for VWF itself the adhesive bridging function is the better-supported description.
