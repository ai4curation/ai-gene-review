id: P04275
gene_symbol: VWF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'von Willebrand factor (VWF) is a very large, multimeric plasma glycoprotein synthesized
  by vascular endothelial cells and megakaryocytes. The precursor carries a propeptide (D1D2, von Willebrand
  antigen II) that acts as a pH-dependent intramolecular chaperone/oxidoreductase: pro-VWF dimerizes via
  C-terminal cystine-knot domains in the ER and is assembled into disulfide-linked multimers via D3 domains
  in the acidic Golgi, then packed as helical tubules into endothelial Weibel-Palade bodies or platelet
  alpha granules for regulated secretion. In plasma and the subendothelial matrix, VWF is the essential
  bridging molecule of primary hemostasis: its A3 (and A1) domains bind exposed collagens, and under high
  shear the elongated multimers expose A1 to capture platelets via glycoprotein Ib-alpha (GPIb-IX-V),
  while an RGD motif in C4 engages integrin alphaIIb-beta3 to support firm adhesion and platelet aggregation.
  VWF also binds coagulation factor VIII through D''D3, acting as its carrier and protecting it from clearance.
  Multimer size is regulated by ADAMTS13 cleavage within the force-sensitive A2 domain. Deficiency or
  dysfunction causes von Willebrand disease (types 1, 2A/2B/2M/2N, 3), the most common inherited bleeding
  disorder.'
