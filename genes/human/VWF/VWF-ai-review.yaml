  review:
    summary: VWF binds the metalloprotease ADAMTS13 with nM affinity (Kd 14 nM, spacer domain required);
      VWF is the physiological substrate of ADAMTS13.
    action: KEEP_AS_NON_CORE
    reason: The binding is experimentally solid, but VWF binds ADAMTS13 as its substrate (cleavage at
      Tyr1605-Met1606 in A2), so protease binding describes how VWF size is regulated rather than a function
      VWF executes in hemostasis. Retained as non-core.
    additional_reference_ids:
