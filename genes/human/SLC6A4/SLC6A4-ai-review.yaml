  review:
    summary: Amino-acid transport inherited from a broad SLC6 node (PTN000907004) that spans amino-acid
      transporting members; SERT transports serotonin, not amino acids.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD at node PTN000907004 aggregates the amino-acid-transporting SLC6 branches (B0AT/proline/
      glycine/GABA-type members). SERT belongs to the monoamine clade (with DAT and NET) whose substrate is
      serotonin; it has no demonstrated amino acid transport activity. The term over-propagates a sibling-clade
      substrate specificity onto the serotonin transporter.
