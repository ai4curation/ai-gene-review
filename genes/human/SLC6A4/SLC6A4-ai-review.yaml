    supporting_text: The serotonin transporter (SERT) terminates serotonergic signalling through the
      sodium- and chloride-dependent reuptake of neurotransmitter into presynaptic neurons
  - reference_id: PMID:7681602
    supporting_text: Transfection of one of these cDNAs into HeLa cells yields a high-affinity (Km = 463 nM),
      Na(+)- and Cl(-)-dependent 5HT transport activity
  - reference_id: file:human/SLC6A4/SLC6A4-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Serotonin transporter that cotransports serotonin with one Na(+) ion in exchange for one
      K(+) ion and possibly one proton in an overall electroneutral transport cycle
proposed_new_terms: []
suggested_questions:
- question: Does the uncoupled, serotonin-gated cation conductance of SERT have a defined physiological
    role in setting neuronal resting potential or excitability, distinct from its symport activity?
- question: To what extent does peripheral (platelet/enterocyte) SERT-mediated serotonin uptake, versus
    central neuronal reuptake, account for the systemic phenotypes associated with SLC6A4 variants?
suggested_experiments:
- description: Conditional, tissue-specific Slc6a4 knockouts (raphe neurons vs platelets vs enterocytes)
    with quantitative 5-HT flux and behavioral/physiological readouts to partition central from peripheral
    contributions of serotonin reuptake.
- description: Combined electrophysiology and transport assays on SERT reconstituted in defined lipid
    environments to measure the stoichiometry and physiological impact of the uncoupled cation conductance
    relative to the coupled symport cycle.
