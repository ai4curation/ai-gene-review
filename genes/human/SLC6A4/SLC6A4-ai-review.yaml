id: P31645
gene_symbol: SLC6A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Sodium- and chloride-dependent serotonin transporter (SERT/5-HTT) of the
  SLC6/neurotransmitter sodium symporter (SNF) family. SERT is a polytopic plasma-membrane
  protein (12 transmembrane helices, LeuT fold) that performs secondary-active, electroneutral
  reuptake of serotonin (5-HT), cotransporting one serotonin with Na+ and Cl- into the cell
  with K+ (and possibly a proton) countertransported, driven by the transmembrane Na+/Cl-
  gradients. In serotonergic neurons it clears 5-HT from the synaptic cleft back into
  presynaptic terminals, terminating and recycling the signal and maintaining serotonin
  homeostasis in the central nervous system. Peripherally it mediates high-affinity uptake of
  plasma 5-HT into platelets, where it is stored in dense granules, and clearance of mucosal
  5-HT by enterocytes; serotonergic tone supplied through SERT contributes to cortical and
  enteric nervous system development. SERT also exhibits a serotonin-gated, transport-uncoupled
  cation conductance. It is the pharmacological target of SSRI and tricyclic antidepressants and
  of cocaine and amphetamines.
