core_functions:
- description: Secondary-active (Na+- and Cl--coupled) reuptake of serotonin across the plasma
    membrane, with K+ (and possibly a proton) countertransported, terminating and recycling
    serotonergic signaling and maintaining serotonin homeostasis.
  molecular_function:
    id: GO:0005335
    label: serotonin:sodium:chloride symporter activity
  directly_involved_in:
