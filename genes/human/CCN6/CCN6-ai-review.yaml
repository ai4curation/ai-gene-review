- term:
    id: GO:0031994
    label: insulin-like growth factor I binding
  evidence_type: IPI
  original_reference_id: PMID:23424195
  qualifier: enables
  review:
    summary: Human CCN6 binds IGF-I with weak affinity in the tested recombinant-protein system.
    action: NEW
    reason: PMID:23424195 tests IGF1, so GO:0031994 is the specific child of insulin-like growth
      factor binding supported by this IPI assertion. Recombinant-protein coimmunoprecipitation
      and SPR establish binding; the reported affinity is approximately 30 micromolar for immobilized
      WISP3, not the high affinity of canonical IGFBPs. The isolated IGFBP-like domain is insufficient
      for full binding. Deletion of the GCGCC motif does not abolish interaction, whereas the poorly
      expressed GLYC-deletion construct was not interpretable as a binding test. Cell-based association
      and response controls complement these assays. Separate human WISP3/mouse BMP4 conditioned-medium
      coassociation is not evidence for the IGF1-only row and is not added as another NEW assertion.
      Official definition/parents, positive IGFBP2/IGFBP3/IGFBP5 comparator coverage and the local
      GO-CAM index were checked; the parent growth-factor-binding proposal is replaced, not duplicated.
    supported_by:
    - reference_id: PMID:23424195
      supporting_text: 'WISP3 binds

        to insulin-like growth factor 1 (IGF1)'
  supporting_entities:
  - UniProtKB:P05019
