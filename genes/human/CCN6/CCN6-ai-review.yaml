suggested_questions:
- question: Which CCN6 integrin and heparin interfaces and target cell states implement the retained
    inherited binding, adhesion and positive-differentiation roles? The original PAINT IBD/tree
    remains an audit target, not evidence against inheritance.
- question: Does human CCN6 occupy the solid phase of interstitial extracellular matrix in cartilage,
    and what original target assay supports the GO:0140149 IDA mapping to the CCN1-focused narrative
    in PMID:23825719 and the separate electronic donor assertion? Nonstructural regulatory activity
    does not itself exclude this location.
- question: What molecular interaction or activity explains mitochondrial CCN6 effects, and why
    do chondrocyte and mammary-cell perturbations give different respiratory and ROS responses?
- question: Which source experiments distinguish the two UniProt products, and how do extracellular
    and intracellular pools contribute separately to progressive pseudorheumatoid dysplasia?
