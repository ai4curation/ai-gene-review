- id: PMID:15140407
  title: WISP3 (CCN6) is a secreted tumor-suppressor protein that modulates IGF signaling in inflammatory
    breast cancer.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract read; original Methods, Results, captions and Discussion
      were separately inspected at https://pmc.ncbi.nlm.nih.gov/articles/PMC1502087/ (DOI10.1593/neo.03316).
      Human SUM149 recipient cells exposed to WISP3-containing versus empty-vector conditioned
      medium show reduced IGF-I-stimulated IGF1R/IRS1/ERK activation. Total receptor normalization
      and source-cell constructs are described in the external body. The authors expressly leave
      another induced soluble mediator possible, so this study alone is not a purified ligand-binding
      or sole-sequestration assay. The normal cache remains abstract-only despite its PMCID; external
      body access is separately disclosed.
core_functions:
- description: Secreted human CCN6 binds IGF-I and modulates its availability and cellular responses.
    Recombinant-protein assays establish weak binding, approximately 30 micromolar in the reported
    SPR system, with more than the IGFBP-like domain required for full interaction. Human conditioned-medium
    experiments independently show reduced IGF1R-pathway activation. Together these support an
    extracellular binding and negative-regulation role, while the conditioned-medium data do not
    isolate sequestration as the sole causal mechanism. This does not assign receptor kinase activity
    or a universal response direction across other ligands and tissues.
