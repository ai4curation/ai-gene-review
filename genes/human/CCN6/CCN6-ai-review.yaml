core_functions:
- description: Human CCN6 binds IGF1 and associates with BMP4, modulating ligand availability
    and downstream responses in extracellular communication. Recombinant human WISP3–IGF1 interaction
    establishes an own binding activity; human WISP3/mouse BMP4 conditioned-medium assays provide
    a separate, explicitly cross-species ligand context. This does not establish receptor kinase
    activity or transfer zebrafish Wisp3 Wnt-coreceptor binding to human CCN6.
