  review:
    summary: Retain inherited positive regulation of differentiation as a non-core, cell-state-dependent
      role.
    action: KEEP_AS_NON_CORE
    reason: The positive ancestral assertion at PTN000142750 is retained with curator deference. CCN-family
      primary experiments include promotion and restoration of chondrocyte differentiation, while
      other family members and cellular states show opposing effects; the family therefore cannot
      be assigned a universal direction from architecture alone. Human CCN6 inhibition of IGF1-driven
      hypertrophy and of BMP-induced alkaline-phosphatase responses does not demonstrate loss of every
      positive differentiation role. Those target experiments are not positive-differentiation assays,
      and cartilage disease alone is not used as one. Retain the existing broad inherited role as
      non-core while the responsible target cell state and original IBD evidence remain unresolved.
    additional_reference_ids:
    - PMID:17823661
    - PMID:23424195
