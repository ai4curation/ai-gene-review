  review:
    summary: Retain the inherited integrin-binding activity as non-core, with its biochemical interface
      unresolved.
    action: KEEP_AS_NON_CORE
    reason: The PAINT assertion at PTN000142750 is a considered phylogenetic inference and does not
      require a separately published purified human-target assay to remain valid. Reviewed CCN6 contains
      TSP1 and CTCK domains, including CTCK residues 268–342; this is compatible with the family binding
      architecture and supplies no evidence of target loss. Family experimental studies distinguish
      several integrin-recognition sites across different domains, so the CTCK feature alone does
      not prove a particular CCN6 interface. Retain the curator-supported activity as non-core. The
      original IBD/tree/alignment and exact target interface remain unverified; this is an access
      qualification, not the reason to reject the inherited activity.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000142750
        source_status: UNRESOLVED
        comment: The exact ancestral node is preserved. Retention defers to the curated inheritance
          with the biological limits stated in the review; the original IBD, tree and alignment were
          not independently inspected.
