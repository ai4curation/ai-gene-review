gene_symbol: CCN6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCN6, also called WISP3, is a secreted, cysteine-rich CCN-family protein involved
  in cartilage homeostasis and extracellular regulation of growth-factor responses. Human CCN6
  binds IGF1 and associates with BMP4 in experimental systems, modifying their cellular effects.
  An intracellular pool localizes to mitochondria and influences respiration and reactive oxygen
  species in a cell-context-dependent manner. Biallelic pathogenic variants cause progressive
  pseudorheumatoid dysplasia.
