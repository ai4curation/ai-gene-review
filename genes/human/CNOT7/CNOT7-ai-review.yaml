core_functions:
- description: CNOT7 is the CAF1 DEDD nuclease subunit of human CCR4-NOT. Bound to the CNOT1 MIF4G domain and paired 
    with CNOT6 or CNOT6L, it hydrolyzes mRNA poly(A) tails to drive cytoplasmic deadenylation-dependent decay. Its 
    catalytic role is reused after recruitment by TNRC6/GW182, tristetraprolin-family proteins, TOB/BTG proteins and 
    CAPRIN1/FMRP condensates.
