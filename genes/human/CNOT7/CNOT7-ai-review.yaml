id: Q9UIV1
gene_symbol: CNOT7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CNOT7 is a DEDD-family CAF1 deadenylase and catalytic subunit of the human CCR4-NOT core complex. It binds the
  CNOT1 MIF4G scaffold, acts as the alternative partner to CNOT8 opposite CNOT6 or CNOT6L, and hydrolyzes poly(A) tails during
  cytoplasmic mRNA decay. Recruitment by RNA-binding adaptors such as GW182/TNRC6, tristetraprolin-family proteins, TOB proteins
  and CAPRIN1/FMRP condensates brings CNOT7-containing CCR4-NOT to selected mRNAs for deadenylation-dependent repression or
  decay; CNOT7 also has a contextual nuclear role in STAT1-associated interferon transcriptional repression.'
alternative_products:
