suggested_questions:
- question: Which human transcripts preferentially use CNOT7 rather than CNOT8 as the CAF1 nuclease in the CCR4-NOT core
    complex?
- question: How often does CNOT7 act in its STAT1-associated nuclear role compared with cytoplasmic mRNA deadenylation?
suggested_experiments:
- description: Reconstitute matched human CCR4-NOT complexes containing CNOT7 or CNOT8 with identical CNOT6/CNOT6L and 
    adaptor inputs and compare target RNA deadenylation kinetics.
  hypothesis: CNOT7 and CNOT8 provide overlapping but not identical CAF1 nuclease modules for adaptor-recruited 
    CCR4-NOT.
