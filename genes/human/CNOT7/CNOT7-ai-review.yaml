core_functions:
- description: CNOT7 is the CAF1 DEDD nuclease subunit of human CCR4-NOT. Bound to the CNOT1 MIF4G domain and paired 
    with CNOT6 or CNOT6L, it hydrolyzes mRNA poly(A) tails to drive cytoplasmic deadenylation-dependent decay. Its 
    catalytic role is reused after recruitment by TNRC6/GW182, tristetraprolin-family proteins, TOB/BTG proteins and 
    CAPRIN1/FMRP condensates.
  molecular_function:
    id: GO:0004535
    label: poly(A)-specific ribonuclease activity
  directly_involved_in:
  - id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  - id: GO:0000288
    label: nuclear-transcribed mRNA catabolic process, deadenylation-dependent decay
  in_complex:
    id: GO:0030015
    label: CCR4-NOT core complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15769875
    supporting_text: both human factors degrade poly(A) tails
  - reference_id: PMID:19276069
    supporting_text: hCaf1 most closely resembled the catalytic domain of yeast Pop2 and human poly(A)-specific ribonuclease
  - reference_id: PMID:31320642
    supporting_text: CCR4-NOT is a conserved multiprotein complex which regulates eukaryotic gene expression principally via shortening of poly(A) tails
suggested_questions:
- question: Which human transcripts preferentially use CNOT7 rather than CNOT8 as the CAF1 nuclease in the CCR4-NOT core
    complex?
- question: How often does CNOT7 act in its STAT1-associated nuclear role compared with cytoplasmic mRNA deadenylation?
suggested_experiments:
- description: Reconstitute matched human CCR4-NOT complexes containing CNOT7 or CNOT8 with identical CNOT6/CNOT6L and 
    adaptor inputs and compare target RNA deadenylation kinetics.
  hypothesis: CNOT7 and CNOT8 provide overlapping but not identical CAF1 nuclease modules for adaptor-recruited 
    CCR4-NOT.
