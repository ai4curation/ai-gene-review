id: P30532
gene_symbol: CHRNA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human alpha5 is an accessory structural and pore-modifying subunit, requiring other alpha
  and beta subunits for functional surface channels. D398N changes calcium permeability and desensitization
  in alpha4beta2alpha5, but these effects do not generalize to alpha3-containing combinations. These pentameric
  membrane proteins couple extracellular acetylcholine recognition to cation flux and neuronal excitability.
  Alpha5 modifies receptor permeability, desensitization and sensitivity to nicotine in a partner-dependent
  manner.
