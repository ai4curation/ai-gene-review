  review:
    action: UNDECIDED
    summary: The PAINT assertion traces to PTN000436077.
    reason: The PAINT assertion traces to PTN000436077. Human functional assembly supports a neuronal
      cholinergic receptor, but does not establish participation at a neuron-to-muscle synapse. Autonomic
      ganglion transmission upstream of muscle contraction is not itself that synapse. The historical
      IBD evidence and any target-specific neuromuscular pool remain unresolved; neither a short donor
      list nor lack of a muscle assay establishes evolutionary loss.
    supported_by:
    - reference_id: PMID:20881005
    - reference_id: PMID:8663494
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000436077
        source_status: UNRESOLVED
        comment: Ancestral node is identified from the seeded row; its exact neuromuscular evidence and
          target tissue scope have not been reconstructed. Current target receptor studies establish neuronal
          assemblies, not a negative neuromuscular assay.
