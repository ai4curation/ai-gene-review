id: P09038
gene_symbol: FGF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Fibroblast growth factor 2 (basic FGF) is a heparin-binding member of the paracrine FGF family
  with a beta-trefoil fold. The 18 kDa AUG-initiated form lacks a signal peptide and is exported by unconventional
  secretion, translocating directly across the plasma membrane in a PI(4,5)P2- and heparan sulfate proteoglycan-dependent
  manner. Extracellular FGF2 is stored on heparan sulfate in the cell surface and extracellular matrix
  and binds FGFR1-FGFR4 (preferring the IIIc splice forms of FGFR1 and FGFR2), forming 2:2:2 FGF2-FGFR-heparan
  sulfate complexes that dimerize and activate the receptor tyrosine kinases, driving FRS2-RAS-MAPK, PI3K-AKT
  and PLCgamma signaling. These signals make FGF2 a potent mitogen, chemotactic and survival factor for
  endothelial, mesenchymal, neural and other cells, contributing to angiogenesis, wound healing and cortical
  neurogenesis; knockout mice are viable but show reduced cortical neuron density and delayed wound healing.
  CUG-initiated high-molecular-weight isoforms are retained intracellularly and localize to the nucleus,
  and internalized FGF2 can also reach the nucleus via CEP57 and importins; these intracrine activities
  are less well defined.
