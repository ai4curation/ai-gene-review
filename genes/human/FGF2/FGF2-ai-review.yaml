  review:
    summary: FGF2 was supplied to metanephric explants in a study of BMP4 function; FGF2 supports metanephric
      mesenchyme and ureteric bud growth in culture.
    action: KEEP_AS_NON_CORE
    reason: Curator-made annotation from an explant study focused on BMP4 (abstract only available). FGF2
      as an exogenous inductive growth factor in kidney explants is plausible, but branching morphogenesis
      is a tissue-level developmental outcome, not the core ligand activity; Fgf2 knockout mice have no
      reported kidney branching defect.
