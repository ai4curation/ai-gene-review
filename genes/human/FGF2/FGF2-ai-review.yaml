core_functions:
- description: Extracellular FGF2 binds FGFR1-FGFR4 ligand-binding (D2-D3) domains and, with heparan sulfate,
    induces receptor dimerization and kinase activation, initiating FGFR signaling with MAPK/ERK and PI3K-AKT
    outputs that drive mitogenic and migratory responses.
  molecular_function:
    id: GO:0005104
    label: fibroblast growth factor receptor binding
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  - id: GO:0043410
    label: positive regulation of MAPK cascade
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:10490103
    supporting_text: Two FGF2:FGFR1 complexes form a 2-fold symmetric dimer.
  - reference_id: PMID:10830168
    supporting_text: we have determined the crystal structures of FGF1 and FGF2 complexed with the ligand
      binding domains (immunoglobulin-like domains 2 [D2] and 3 [D3]) of FGF receptor 1 (FGFR1) and FGFR2,
      respectively
  - reference_id: PMID:2161540
    supporting_text: The receptor is phosphorylated upon stimulation with both FGFs, DNA synthesis is
      stimulated, and a proliferative response is produced in cells expressing the receptor
  - reference_id: file:human/FGF2/FGF2-uniprot.txt
    supporting_text: Acts as a ligand for FGFR1, FGFR2, FGFR3 and FGFR4
  - reference_id: PMID:16756958
    supporting_text: FGF2, which is mitogenic on endothelial cells and hepatocytes stimulates a sustained
      MAPK activation in both cell types
- description: FGF2 binds heparin/heparan sulfate via a basic surface canyon; heparan sulfate proteoglycans
    store and present FGF2 and stabilize the FGF2-FGFR complex, acting as essential co-receptors for signaling.
  molecular_function:
    id: GO:0008201
    label: heparin binding
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:11030354
    supporting_text: heparin makes numerous contacts with both FGF and FGFR, thereby augmenting FGF-FGFR
      binding
  - reference_id: PMID:10490103
    supporting_text: A positively charged canyon formed by a cluster of exposed basic residues likely
      represents the heparin-binding site.
  - reference_id: file:human/FGF2/FGF2-deep-research-falcon.md
    supporting_text: Heparan sulfate proteoglycans (HSPGs) function as essential cofactors for FGF2 signaling,
      not merely as passive binding sites
proposed_new_terms: []
suggested_questions:
- question: What molecular activity do nuclear high-molecular-weight FGF2 isoforms perform (e.g. with
    API5/FIF or in nuclear bodies), and is any of it independent of FGFR signaling?
- question: Should FGF2's self-oligomerization and membrane-pore formation during unconventional secretion
    be captured as participation in its own export (GO protein secretion terms), given that FGF2 itself
    forms the translocation intermediate?
- question: Is the reported histone H3K9me2/3 reader activity transferred from rat Fgf2 supported by direct
    binding data, or is it a misannotation?
- question: How essential is integrin alphaVbeta3 binding for FGF2-FGFR signaling in vivo, independent
    of the originating laboratory's mutant-based model?
suggested_experiments:
- description: Knock-in mice expressing only 18 kDa or only HMW FGF2 isoforms, profiled for nuclear interactors
    (proximity labeling) and transcriptional effects.
  experiment_type: genetic manipulation/proteomics
  hypothesis: HMW FGF2 isoforms have FGFR-independent nuclear functions distinct from secreted 18 kDa
    FGF2.
- description: Isothermal titration and nucleosome pull-down assays of recombinant human HMW and LMW FGF2
    with H3K9me2/3-modified peptides and nucleosomes.
  experiment_type: biochemistry
  hypothesis: FGF2 does not directly read H3K9 methylation; any association is indirect.
- description: Compare signaling by wild-type and integrin-binding-defective FGF2 (K119E/R120E, K125E)
    in ITGB3-knockout versus wild-type endothelial cells with matched FGFR1 levels.
  experiment_type: cell signaling
  hypothesis: If integrin binding is required, the mutant defect will be abolished in ITGB3-null cells.
