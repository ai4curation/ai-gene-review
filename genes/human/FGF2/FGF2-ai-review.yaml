- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:11030354
  review:
    summary: FGF2 binds heparin/heparan sulfate through a basic surface canyon; heparin contacts both
      FGF2 and FGFR in the 2:2:2 signaling complex.
    action: NEW
    reason: 'Heparin/heparan sulfate binding is a defining, directly demonstrated activity of FGF2 (crystal
      structures, heparin affinity) and is required for stable FGF2-FGFR complex assembly, yet no heparin-binding
      row is present for human FGF2. Comparator: FGF1 (same role) carries GO:0008201 by IDA/IMP. This
      is a molecular function of FGF2 itself, not a process-participation claim.'
    supported_by:
    - reference_id: PMID:11030354
      supporting_text: heparin makes numerous contacts with both FGF and FGFR, thereby augmenting FGF-FGFR
        binding
    - reference_id: PMID:10490103
      supporting_text: A positively charged canyon formed by a cluster of exposed basic residues likely
        represents the heparin-binding site.
    - reference_id: file:human/FGF2/FGF2-uniprot.txt
      supporting_text: This protein binds heparin more strongly than does aFGF.
    - reference_id: file:human/FGF2/FGF2-deep-research-falcon.md
      supporting_text: Heparan sulfate proteoglycans (HSPGs) function as essential cofactors for FGF2
        signaling, not merely as passive binding sites
