      supporting_text: LIMP-2 (lysosomal integral membrane protein 2), the receptor for intracellular
        GCase trafficking to the lysosome
- term:
    id: GO:0005044
    label: scavenger receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0002939
  - FB:FBgn0010435
  - MGI:MGI:1196458
  - PANTHER:PTN000230217
  - RGD:2301
  - UniProtKB:P16671
  review:
    summary: Scavenger receptor activity propagated from the CD36/SR-B ancestral node.
    action: MODIFY
    reason: The node assertion fits CD36 and SCARB1, which bind modified lipoproteins and fatty acids
      at the cell surface, but SCARB2 has diverged - it works inside the endolysosomal system as the sorting
      receptor for glucosylceramidase and has no established scavenging ligand. The supported molecular
      function for this member is cargo receptor activity.
    proposed_replacement_terms:
    - id: GO:0038024
      label: cargo receptor activity
    supported_by:
    - reference_id: PMID:29199275
      supporting_text: LIMP-2 is a receptor for the trafficking of glucocerebrosidase (GCase) from the
        endoplasmic reticulum to lysosomes
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000230217
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The scavenger-receptor activity of the CD36/SR-BI members of this family is well supported,
          but SCARB2 acts in the lumen of the endolysosomal system as a cargo receptor, so the activity
          does not transfer to this member.
