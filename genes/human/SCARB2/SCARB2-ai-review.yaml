- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: TAS
  original_reference_id: PMID:25202012
  qualifier: enables
  review:
    summary: Transmembrane signalling receptor activity asserted in a review.
    action: MODIFY
    reason: SCARB2 is not a signalling receptor; it is a sorting/cargo receptor that binds GBA1 in the
      lumen and delivers it to the lysosome. The supported molecular function is cargo receptor activity,
      which this gene already carries with experimental evidence.
    proposed_replacement_terms:
    - id: GO:0038024
      label: cargo receptor activity
    supported_by:
