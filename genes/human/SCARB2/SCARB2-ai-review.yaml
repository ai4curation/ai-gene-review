id: Q14108
gene_symbol: SCARB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SCARB2 (LIMP-2) is an abundant, heavily glycosylated type III double-pass membrane protein
  of the CD36/SR-B family whose large luminal domain, containing a hydrophobic tunnel, faces the lumen
  of the endosome-lysosome system. It resides principally in the limiting membrane of lysosomes and late
  endosomes, where it serves as the mannose-6-phosphate-independent sorting receptor that binds newly
  synthesized glucosylceramidase (GBA1) in the endoplasmic reticulum through a coiled-coil segment of
  its luminal domain and delivers it to the lysosome; loss of SCARB2 depletes lysosomal GBA1 activity.
  Lipid binding switches its oligomeric state - a crystal structure of the luminal domain dimer with bound
  cholesterol and phosphatidylcholine shows that lipid binding converts the GBA1-binding monomer into
  a dimer that prefers phosphatidylserine - and LIMP-2 facilitates phospholipid transport in cells. Overexpression
  enlarges endosomes and lysosomes, indicating a role in organelle biogenesis. A minor cell-surface pool
  serves as the entry receptor for enterovirus 71. Biallelic loss-of-function mutations cause action myoclonus-renal
  failure syndrome, and SCARB2 variants modify Parkinson disease and Gaucher disease phenotypes.
