core_functions:
- description: Acts as the mannose-6-phosphate-independent sorting receptor for glucosylceramidase - binding
    GBA1 through a coiled-coil segment of its luminal domain in the endoplasmic reticulum, carrying it
    through the secretory pathway and releasing it in the acidic lysosome - so that loss of SCARB2 depletes
    lysosomal GBA1 protein and activity.
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0031902
    label: late endosome membrane
  directly_involved_in:
  - id: GO:0006622
    label: protein targeting to lysosome
  supported_by:
  - reference_id: PMID:18022370
    supporting_text: Affinity-chromatography experiments revealed that the lysosomal integral membrane
      protein LIMP-2 is a specific binding partner of beta-glucocerebrosidase.
  - reference_id: PMID:18022370
    supporting_text: beta-glucocerebrosidase activity and protein levels were severely decreased in LIMP-2-deficient
      mouse tissues.
  - reference_id: file:human/SCARB2/SCARB2-uniprot.txt
    supporting_text: 'FUNCTION: Acts as a lysosomal receptor for glucosylceramidase (GBA1) targeting.'
suggested_questions:
- question: Is the lipid-transport activity of LIMP-2 physiologically significant in human lysosomes,
    or is it chiefly a regulatory switch controlling GBA1 binding through the monomer-dimer equilibrium?
- question: How large is the cell-surface pool of SCARB2 in human tissues, and is it regulated, given
    that it determines susceptibility to enterovirus 71 entry?
- question: Does SCARB2 carry cargo other than GBA1 to the lysosome?
suggested_experiments:
- description: Quantitative surface biotinylation plus total membrane proteomics across human cell types
    to measure the fraction of SCARB2 at the plasma membrane and whether it changes with lysosomal stress
    or EV71 infection.
- description: Structure-guided mutants that block the luminal hydrophobic tunnel but preserve GBA1 binding,
    assayed for lysosomal phospholipid composition and GBA1 delivery, to separate the two activities.
- description: Proteomic comparison of lysosomal content in SCARB2-null versus wild-type human cells to
    test whether other hydrolases depend on SCARB2 for delivery.
