  review:
    summary: PLP is the catalytic cofactor of this alanine aminotransferase.
    action: ACCEPT
    reason: The class-I aminotransferase family and curated cofactor assignment support PLP dependence.
      Human GPT2 structure PDB 3IHJ, described by Reactome, contains PLP; human GPT sequence/biochemistry
