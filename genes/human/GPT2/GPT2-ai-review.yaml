  label: Homo sapiens
description: 'GPT2 encodes the mitochondrial alanine aminotransferase ALT2, a pyridoxal 5''-phosphate-dependent
  enzyme that reversibly transfers an amino group between L-alanine and 2-oxoglutarate to form pyruvate and
  L-glutamate. Its reaction links alanine turnover, nitrogen transfer and mitochondrial carbon metabolism.
  Depending on substrate supply and cellular context, it can generate alanine and 2-oxoglutarate or consume
  alanine to make pyruvate. Human disease variants reduce catalytic activity and cause a neurodevelopmental
  disorder; mouse models link loss of GPT2 to altered alanine metabolism, anaplerosis and postnatal brain growth.
  Recombinant canonical ALT2 is active, whereas one tested alternative splice form lacks detectable activity.
  The cytosolic paralog is GPT/ALT1.'
