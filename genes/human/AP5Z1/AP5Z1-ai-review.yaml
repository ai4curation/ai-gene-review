- term:
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:20613862
  qualifier: involved_in
  review:
    summary: A reproducible homologous-recombination phenotype is retained outside the trafficking core.
    action: KEEP_AS_NON_CORE
    reason: The original two independent esiRNAs impaired human-cell DR-GFP repair and a mouse-orthologue
      BAC rescued the phenotype. The later AP-5 study explicitly regarded these data as robust while suggesting
      an indirect explanation. Neither study measured helicase catalysis or established AP5Z1 as a direct
      DNA-repair machine; uncertainty about mechanism does not negate the source IMP.
    supported_by:
    - reference_id: PMID:20613862
      supporting_text: Stable expression of mouse KIAA0415 in the human DR-GFP cell line rendered this
        cell line resistant to the human esiRNAs, authenticating a role of KIAA0415 in HR-DSBR
      full_text_unavailable: false
    - reference_id: PMID:22022230
      supporting_text: The DNA repair phenotype appears to be robust and on-target, because the authors
        were able to rescue it with RNAi-resistant KIAA0415. However, the phenotype could be indirect.
      full_text_unavailable: false
