- term:
    id: GO:0007040
    label: lysosome organization
  evidence_type: NAS
  original_reference_id: PMID:40175557
  qualifier: involved_in
  review:
    summary: AP5Z1 contributes to maintaining lysosomal organization.
    action: ACCEPT
    reason: AP5Z1 contributes structural machinery for endolysosomal sorting. Human AP5Z1-deficient fibroblasts
      and AP5Z1-depleted HeLa cells accumulate abnormal multilamellar endolysosomes, supporting the existing
      lysosome-organization annotation. The later assembled-complex membrane-remodeling work is corroborating
      context, not an isolated AP5Z1 remodeling assay.
    supported_by:
    - reference_id: PMID:26085577
      supporting_text: Note that the loss of AP-5 ζ led to the accumulation of enlarged morphologically
        defined endosomal structures filled with aberrant storage material, typically containing bands
        of striated material, multiple exaggerated membrane whorls and many intraluminal vesicles.
      full_text_unavailable: false
    - reference_id: PMID:40175557
      supporting_text: "Our findings reveal that the \nAP5-SPG11-SPG15 complex can bind PI3P molecules,\
        \ sense membrane curvature and \ndrive membrane remodeling in vitro."
      full_text_unavailable: true
    - reference_id: file:human/AP5Z1/AP5Z1-notes.md
