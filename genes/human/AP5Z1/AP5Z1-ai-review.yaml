suggested_questions:
- question: Which AP-5 or accessory-subunit surfaces connect native cargo receptors to the membrane-remodeling
    scaffold, and does AP5Z1 contact cargo directly?
- question: How does AP5Z1 perturbation influence homologous recombination, and is the effect separable
    from trafficking-dependent signaling?
- question: Which present-day AP5Z1 alternative products account for the reported nuclear and cytoplasmic
    protein species?
- question: Does the AP5Z1–NUP93 HuRI pair reproduce with endogenous proteins and defined constructs?
suggested_experiments:
- description: Reconstitute defined human AP-5–SPG11–SPG15 complexes with cargo receptors and separation-of-function
    zeta interface mutants, measuring cargo association and membrane remodeling independently.
- description: Compare repair and endosomal-retrieval rescue by isoform-resolved AP5Z1 constructs expressed
    at matched abundance to separate nuclear and trafficking mechanisms.
