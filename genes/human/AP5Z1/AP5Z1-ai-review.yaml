      the SPG11/SPG15 scaffold, with mouse zeta used in the resolved structural assembly. Together these
      findings support a contribution to the assembled cargo adaptor. The SPG15 N-terminal fragment pulls
      down cargo but not AP5Z1; therefore no autonomous zeta cargo interface, cargo motif specificity
      or purified human-zeta activity is asserted. The 2013 paper alone proposed, rather than demonstrated,
      cargo sorting.
