id: O43299
gene_symbol: AP5Z1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AP5Z1 encodes the zeta large subunit of adaptor protein complex 5 (AP-5), a clathrin-independent
  sorting assembly associated with late endosomes and lysosomes. AP-5 cooperates with SPG11 and ZFYVE26/SPG15
  in membrane organization and retrieval of selected cargo toward the Golgi. AP5Z1 supplies part of the
  structural assembly rather than an established autonomous cargo-binding or helicase activity. Loss of
  AP5Z1 disrupts endolysosomal morphology and causes hereditary spastic paraplegia 48. Nuclear pools and
  an experimentally supported homologous-recombination phenotype have also been reported, but their relationship
  to membrane trafficking remains unresolved.
