id: P49961
gene_symbol: ENTPD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ENTPD1 encodes CD39/NTPDase1, a cell-surface ectonucleotidase that hydrolyzes extracellular
  nucleoside triphosphates and diphosphates. Its ATP and ADP hydrolysis produces AMP and inorganic
  phosphate and requires divalent cations. By removing extracellular platelet-activating ADP,
  CD39 suppresses platelet aggregation and modulates extracellular nucleotide signaling. Conversion
  of the resulting AMP to adenosine requires a separate ecto-5-prime-nucleotidase such as CD73.
  The full-length protein has a large extracellular catalytic region flanked by membrane-spanning
  segments; reported alternative products differ at their termini or within this region and
  are not all functionally characterized.
