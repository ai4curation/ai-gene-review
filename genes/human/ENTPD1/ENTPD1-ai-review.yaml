core_functions:
- description: Hydrolyzes extracellular ribonucleoside triphosphates and nucleoside diphosphates
    at the cell surface in a divalent-cation-dependent apyrase reaction. ATP is converted successively
    through ADP to AMP, releasing inorganic phosphate at each step. Removal of extracellular
    ADP contributes to endothelial inhibition of platelet aggregation. Conversion of AMP to
    adenosine is a separate reaction performed by ecto-5'-nucleotidase/CD73.
  molecular_function:
    id: GO:0004050
    label: apyrase activity
  directly_involved_in:
  - id: GO:0009134
    label: nucleoside diphosphate catabolic process
  - id: GO:0009203
    label: ribonucleoside triphosphate catabolic process
  - id: GO:0090331
    label: negative regulation of platelet aggregation
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
