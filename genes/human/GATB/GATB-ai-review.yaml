suggested_questions:
- question: Which identity elements of mt-tRNA(Gln) does human GATB recognise, and how does GatCAB act
    on Glu-tRNA(Gln) but not on mt-tRNA(Glu) charged by the same EARS2?
- question: Why did fibroblasts of GATB patients, unlike those of QRSL1 and GATC patients, show clear
    respiratory chain deficiencies under standard culture conditions?
suggested_experiments:
- description: Assay ATP-dependent Glu-tRNA(Gln) phosphorylation and amidation by recombinant human GatCAB
    carrying GATB patient variants (for example Phe136Leu), with ammonia supplied directly versus from
    glutamine, to separate kinase and amidation defects from loss of GatA coupling.
