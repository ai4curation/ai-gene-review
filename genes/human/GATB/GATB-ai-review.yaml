    label: mitochondrial translation
  evidence_type: IMP
  original_reference_id: PMID:19805282
  qualifier: involved_in
  review:
    summary: Mitochondrial translation (IMP).
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept as non-core context, not core. GatCAB transamidates Glu-tRNA(Gln) to Gln-tRNA(Gln),
      preparing the charged tRNA that mitochondrial translation consumes; it does not itself
      perform a step of translation on the mitoribosome. The knockdown and patient data show
      that GatCAB is necessary for mitochondrial protein synthesis, which is necessity evidence,
      not participation. The MTO1 review takes the same line for a tRNA-preparing enzyme. The
      core process for this subunit is GO:0019988 charged-tRNA amino acid modification.
    supported_by:
    - reference_id: PMID:19805282
      supporting_text: When any of the hGatCAB subunits were inactivated by siRNA-mediated knock down
        in human cells, the Glu-charged form of tRNA(Gln) accumulated and defects in respiration could
        be observed.
    - reference_id: PMID:30283131
      supporting_text: Patients present with metabolic cardiomyopathy and have defective Gln-mt-tRNAGln
        acylation, resulting in reduced mitochondrial protein translation with an influence of the amount
        of glutamine available.
    - reference_id: PMID:30283131
      supporting_text: The expression of the transgene in the affected subject’s fibroblasts resulted
        in a complete rescue of the respiratory chain enzyme deficiencies, indicating that indeed the
        GATB gene variants in this subject caused the enzyme deficiencies
- term:
    id: GO:0050567
    label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000183793
  - UniProtKB:O75879
  review:
    summary: Contributes to glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity (IBA).
    action: ACCEPT
    reason: Core activity. Recombinant human GatCAB converts Glu-tRNA(Gln) to Gln-tRNA(Gln) in vitro;
      GATB is the subunit that activates and amidates the tRNA-bound glutamate. contributes_to correctly
      reflects that the activity belongs to the complex.
    supported_by:
    - reference_id: PMID:19805282
      supporting_text: We successfully reconstituted in vitro Gln-tRNA(Gln) formation catalyzed by the
        recombinant mtGluRS and hGatCAB.
    - reference_id: file:human/GATB/GATB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: This subunit probably recognizes tRNA(Gln) and mediates the transamidation of misloaded
        Glu by catalyzing formation of the activated gamma-phospho- intermediate and its subsequent aminolysis
        using ammonia produced by the gatA subunit
    - reference_id: PMID:30283131
      supporting_text: In GatB, Phe136 mutated in P1A is located in a hydrophobic region, in close proximity
        to the catalytic residues of the amidotransferase site and to the GatA–GatB interface
