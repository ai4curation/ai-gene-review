core_functions:
- description: Amidotransferase (B) subunit of the mitochondrial GatCAB glutamyl-tRNA(Gln) amidotransferase;
    recognises Glu-tRNA(Gln), activates the tRNA-bound glutamate with ATP and amidates it with ammonia
    from QRSL1, providing the only mitochondrial source of correctly charged Gln-tRNA(Gln) for mitochondrial
    protein synthesis.
  contributes_to_molecular_function: *id002
  directly_involved_in:
