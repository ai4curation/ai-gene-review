- term:
    id: GO:0050567
    label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:17521
  - EC:6.3.5.7
  - UniRule:UR000375771
  review:
    summary: Glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity from the Rhea/EC 6.3.5.7 mapping.
    action: ACCEPT
    reason: Correct core activity. GATB carries the amidotransferase site, but the reaction requires the
      glutaminase activity of QRSL1 within GatCAB, so the activity is more precisely expressed with the
      contributes_to qualifier used in this gene's IBA and IDA rows.
    supported_by:
    - reference_id: file:human/GATB/GATB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=L-glutamyl-tRNA(Gln) + L-glutamine + ATP + H2O = L-glutaminyl- tRNA(Gln)
        + L-glutamate + ADP + phosphate + H(+);
    - reference_id: PMID:30283131
      supporting_text: In the bacterial GatCAB complex, GatA and GatB possess the catalytic amidase and
        kinase functions, respectively, while GatC serves as a stabilizing linker between them16.
- term:
    id: GO:0070681
    label: obsolete glutaminyl-tRNAGln biosynthesis via transamidation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000183793
  - SGD:S000000176
  - UniProtKB:O75879
  review:
    summary: Obsolete term glutaminyl-tRNAGln biosynthesis via transamidation (IBA).
    action: MODIFY
    reason: The biology is correct (GatCAB converts Glu-tRNA(Gln) to Gln-tRNA(Gln)), but GO:0070681 is
      obsolete as a pathway-variant term and GO says such annotations need review rather than automatic
      migration. Because GatCAB amidates glutamate already attached to tRNA(Gln), the process is captured
      by charged-tRNA amino acid modification, consistent with the GATC and QRSL1 reviews; the activity
      is captured by GO:0050567.
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
    supported_by:
    - reference_id: PMID:19805282
      supporting_text: We successfully reconstituted in vitro Gln-tRNA(Gln) formation catalyzed by the
        recombinant mtGluRS and hGatCAB.
    - reference_id: PMID:30283131
      supporting_text: mt-tRNAGln is indirectly charged by a transamidation reaction involving the GatCAB
        aminoacyl-tRNA amidotransferase complex.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000183793
        source_status: SUPPORTS_TRANSFER
        comment: The GatB-family node correctly carries the transamidation function to human GATB; only
          the term has since been obsoleted, so the row is re-expressed with GO:0019988.
      residue_claims_not_applicable: No residue-level claim is propagated.
