id: O75879
gene_symbol: GATB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GATB (glutamyl-tRNA(Gln) amidotransferase subunit B, mitochondrial; formerly PET112) is
  the GatB subunit of the heterotrimeric mitochondrial glutamyl-tRNA(Gln) amidotransferase GatCAB, formed
  with QRSL1 (GatA) and GATC. Mammalian mitochondria lack a glutaminyl-tRNA synthetase: EARS2 misacylates
  tRNA(Gln) with glutamate, and GatCAB converts Glu-tRNA(Gln) to Gln-tRNA(Gln). GATB, a member of the
  GatB/GatE family, is the tRNA-recognising and amidotransferase subunit: with ATP and Mg2+ it phosphorylates
  the tRNA-bound glutamate to a gamma-phospho intermediate and amidates it with ammonia supplied by the
  QRSL1 glutaminase. The complex is the only mitochondrial source of Gln-tRNA(Gln) and is required for
  mitochondrial protein synthesis. Biallelic GATB variants cause combined oxidative phosphorylation deficiency
  41 (COXPD41), a lethal infantile metabolic cardiomyopathy with lactic acidosis and respiratory chain
  deficiency.'
