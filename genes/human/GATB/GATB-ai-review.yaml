  review:
    summary: catalytic activity from InterPro/UniRule mapping of GatB/GatE family domains.
    action: MODIFY
    reason: 'Correct but more general than necessary: catalytic activity is an ancestor of glutaminyl-tRNA
      synthase (glutamine-hydrolyzing) activity (EC 6.3.5.7), the reaction to which GATB contributes the
      ATP-dependent activation and amidation of tRNA-bound glutamate. The specific term should be used,
      with the activity understood as that of the GatCAB complex.'
    proposed_replacement_terms: &id001
    - &id002
      id: GO:0050567
      label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
