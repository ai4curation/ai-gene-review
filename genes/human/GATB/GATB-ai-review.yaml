- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HTP
  original_reference_id: PMID:34800366
  qualifier: located_in
  review:
    summary: Mitochondrion (HTP, PMID:34800366).
    action: ACCEPT
    reason: GATB is a nuclear-encoded mitochondrial protein. Human PET112 is imported into mitochondria
      in vitro, V5-tagged GatB is strictly mitochondrial in U2OS cells, and the protein is found in the
      mitochondrial proteome. GatCAB charges the mitochondrially encoded tRNA(Gln).
    supported_by:
    - reference_id: file:human/GATB/GATB-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion'
    - reference_id: PMID:30283131
      supporting_text: A transient transfection experiment in U2OS cells revealed that the location of
        the V5-GatB protein was strictly mitochondrial, confirming correct cellular localization and is
        compatible with its function as part of the mitochondrial GatCAB complex
