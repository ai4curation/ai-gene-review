- id: PMID:33139953
  title: BAHCC1 binds H3K27me3 via a conserved BAH module to mediate gene silencing and oncogenesis.
  findings:
  - statement: The BAHCC1 BAH domain reads H3K27me3 and enforces silencing.
    supporting_text: We report that a conserved bromo-adjacent homology (BAH) module of BAHCC1 (BAHCC1BAH)
      'recognizes' H3K27me3 specifically and enforces silencing of H3K27me3-demarcated genes in mammalian
      cells.
  - statement: A mouse BAH mutant causes partial postnatal lethality.
    supporting_text: In mice, introduction of a germline mutation at Bahcc1 to disrupt its H3K27me3 engagement
      causes partial postnatal lethality, supporting a role in development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; structural, biochemical, ChIP-seq and mouse genetics.
- id: PMID:40592879
  title: BAHCC1 binds H4K20me1 to facilitate the MCM complex loading and DNA replication.
  findings:
  - statement: The BAHCC1 Tudor domain reads H4K20me1 and recruits MCM to origins.
    supporting_text: Here, we report that an evolutionarily conserved tandem Tudor domain (TTD) in BAHCC1
      (BAHCC1TTD) selectively reads H4K20me1 for facilitating replication origin activation and DNA replication.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; HeLa knockouts and the Tudor-dead mutant.
- id: PMID:37924516
  title: Super-enhancer-driven expression of BAHCC1 promotes melanoma cell proliferation and genome stability.
  findings:
  - statement: BAHCC1 regulates E2F/KLF cell-cycle and DNA-repair genes in melanoma.
    supporting_text: Integrative genomics analyses reveal that BAHCC1 is a transcriptional regulator controlling
      expression of E2F/KLF-dependent cell-cycle and DNA-repair genes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; melanoma context.
  full_text_unavailable: true
- id: PMID:32969152
  title: Regulation of neuronal commitment in mouse embryonic stem cells by the Reno1/Bahcc1 locus.
  findings:
  - statement: Bahcc1 loss arrests neuronal commitment in mouse ES cells.
    supporting_text: Loss of either Reno1 or Bahcc1 leads to an early arrest in neuronal commitment, failure
      to induce a neuronal gene expression program, and to global reduction in chromatin accessibility
      at regions that are marked by the H3K4me3 chromatin mark at the onset of differentiation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse ES cells; developmental context, not annotated.
