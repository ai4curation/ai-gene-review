suggested_questions:
- question: Can a single BAHCC1 molecule read H3K27me3 and H4K20me1 at once on the same nucleosome, and
    how does it choose between Polycomb silencing and origin licensing during the cell cycle?
suggested_experiments:
- description: Use separation-of-function BAH-cage and Tudor (Y1993A) knock-in alleles in one cell line
    to measure H3K27me3-target silencing and origin licensing independently across the cell cycle.
