description: BAHCC1 (BAH and coiled-coil domain-containing protein 1) is a large nuclear chromatin reader
  with two histone-mark-binding modules. Its C-terminal bromo-adjacent homology (BAH) domain directly
  recognizes H3K27me3 through an aromatic cage, colocalizing BAHCC1 with Polycomb-marked genes. There,
  with associated transcriptional corepressors, it enforces their silencing. A tandem Tudor domain reads
  H4K20me1 and recruits BAHCC1 and the MCM helicase to replication origins, promoting origin activation.
  BAHCC1 supports leukemia and melanoma cell proliferation, and is needed for neuronal commitment of mouse
  ES cells. Disrupting its H3K27me3 binding in mice causes partial postnatal lethality.
