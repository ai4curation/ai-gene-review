- description: Removes the abasic-site-terminated 5' flap generated when DNA polymerase beta or delta
    performs strand-displacement synthesis at a repaired lesion, completing the long-patch branch of base
    excision repair. The same reaction operates on mitochondrial DNA together with DNA2.
