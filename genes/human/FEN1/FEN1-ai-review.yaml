- term:
    id: GO:0009650
    label: UV protection
  evidence_type: TAS
  original_reference_id: PMID:8007985
  qualifier: involved_in
  review:
    summary: TAS of UV protection, derived from the ability of the human cDNA to rescue the UV sensitivity
      of an S. pombe rad2 null mutant.
