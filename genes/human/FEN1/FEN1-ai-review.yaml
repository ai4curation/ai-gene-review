proposed_new_terms: []
suggested_questions:
- question: Does the catalytically inactive mitochondrial isoform FENMIT (P39748-2) have a distinct biological
    role, and should isoform-resolved GO annotations separate it from the nuclease-competent isoform 1?
- question: Is the rat-derived 'memory' annotation projected onto human FEN1 supported by any direct evidence,
    or does it reflect a distal consequence of impaired genome maintenance in post-mitotic neurons?
- question: GO lacks a PCNA-binding molecular function term, so the functionally decisive FEN1-PCNA PIP-box
    interaction can only be recorded as 'protein binding'. Would a 'sliding clamp binding' or 'PCNA binding'
    MF term be warranted?
- question: Which of FEN1's non-canonical roles (telomeric C-strand processing, microhomology-mediated
    end joining, sister chromatid cohesion) reflect direct enzymatic participation versus indirect consequences
    of defective Okazaki fragment maturation?
suggested_experiments:
- description: Separation-of-function alleles that uncouple the endonuclease, exonuclease and RNase H
    modes of FEN1, assayed for Okazaki fragment maturation, long-patch BER and R-loop resolution in the
    same cell background, to establish which activity each process actually requires.
- description: Isoform-selective depletion and re-expression of FENMIT versus isoform 1 to test whether
    the mitochondrial phenotypes attributed to FEN1 depend on nuclease activity or on RNA-flap binding
    alone.
- description: DRIP-seq or R-ChIP in FEN1-depleted cells with and without oxidative damage, to determine
    the genomic scope of FEN1-dependent R-loop resolution and whether it is restricted to BER-associated
    loci.
- description: Quantitative measurement of metal preference (Mg2+ versus Mn2+) for human FEN1 under physiological
    intracellular metal concentrations, to test whether the manganese-binding annotation reflects anything
    beyond in vitro substitution.
