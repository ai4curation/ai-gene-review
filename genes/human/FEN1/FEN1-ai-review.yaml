existing_annotations:
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Phylogenetic (PANTHER PTN000118792) inference that FEN1 acts in DNA replication. True but
      under-specified: the replication role of FEN1 is confined to lagging-strand Okazaki fragment maturation,
      where it removes the RNA/DNA primer flap displaced by DNA polymerase delta.'
    action: MODIFY
    reason: FEN1 is not a general replication factor; its documented replication activity is the cleavage
      of 5' flaps generated during Okazaki fragment processing, leaving a ligatable nick. GO:0033567 (DNA
      replication, Okazaki fragment processing) captures this precisely and is supported for the human
      protein by structural and biochemical work.
    proposed_replacement_terms:
    - id: GO:0033567
      label: DNA replication, Okazaki fragment processing
    additional_reference_ids:
    - PMID:9778254
    - PMID:36672839
    supported_by:
    - reference_id: PMID:9778254
      supporting_text: Flap endonuclease (FEN-1) removes 5' overhanging flaps in DNA repair and processes
        the 5' ends of Okazaki fragments in lagging strand DNA synthesis.
    - reference_id: PMID:36672839
      supporting_text: Flap endonuclease 1 (FEN1) is an essential enzyme that removes RNA primers and
        base lesions during DNA lagging strand maturation and long-patch base excision repair (BER).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000118792
        source_label: FEN1 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: Node-level 'DNA replication' is correct for the family but every characterized member
          acts specifically in Okazaki fragment maturation.
      - source_id: SGD:S000001596
        source_label: RAD27
        source_status: SUPPORTS_TRANSFER
        comment: Yeast orthologue's replication role is likewise restricted to Okazaki fragment processing.
      - source_id: MGI:MGI:102779
        source_label: Fen1
        source_status: SUPPORTS_TRANSFER
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic inference that FEN1 acts in DNA repair. FEN1 participates in more than one repair
      route - long-patch base excision repair, flap trimming during microhomology-mediated end joining,
      and processing of damaged replication intermediates - so the grouping term is appropriate here.
    action: ACCEPT
    reason: Unlike the replication annotation, which maps to a single pathway, FEN1's repair contributions
      genuinely span several sub-pathways; the specific children (GO:0006284 base-excision repair, GO:0006287
      base-excision repair gap-filling) are separately annotated, so retaining the parent as an IBA statement
      is reasonable rather than over-general.
    supported_by:
    - reference_id: PMID:36672839
      supporting_text: Flap endonuclease 1 (FEN1) is an essential enzyme that removes RNA primers and
        base lesions during DNA lagging strand maturation and long-patch base excision repair (BER).
    - reference_id: PMID:8131753
      supporting_text: The repair of some types of DNA double-strand breaks is thought to proceed through
        DNA flap structure intermediates.
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic inference that FEN1 acts in DNA recombination. FEN1 does trim 5' flaps at recombination
      and end-joining intermediates, but this is a peripheral consequence of its structure-specific nuclease
      activity rather than a dedicated recombination function.
    action: KEEP_AS_NON_CORE
    reason: No experimental evidence assigns FEN1 a strand-exchange, resection or Holliday-junction resolution
      role; it explicitly fails to cleave Holliday junctions. Its involvement in recombination-associated
      repair is limited to removing displaced flaps, which is already captured by the flap endonuclease
      MF and the end-joining BP annotations.
    supported_by:
    - reference_id: PMID:8131753
      supporting_text: Other branch structures, including Holliday junctions, are also not cleaved by
        FEN-1.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Phylogenetic inference that FEN1 is active in the nucleus. This is the principal compartment
      in which FEN1 acts on nuclear replication and repair intermediates, and it is confirmed by direct
      immunostaining of the human protein.
    action: ACCEPT
    reason: Human FEN1 is a nuclear enzyme (nucleolar at steady state, redistributing to nucleoplasm after
      damage); the is_active_in qualifier is correct because its substrates are nuclear replication and
      repair intermediates.
    supported_by:
    - reference_id: PMID:12427278
      supporting_text: Flap endonuclease 1 (FEN-1) is a nuclear enzyme involved in DNA metabolism, such
        as replication, repair, and recombination.
    - reference_id: PMID:7961795
      supporting_text: A nuclear 42-kDa 5'-->3'-exonuclease, DNase IV, was found previously in animal
        tissues.
- term:
    id: GO:0017108
    label: 5'-flap endonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic inference of 5'-flap endonuclease activity. This is the defining catalytic activity
      of FEN1 and is demonstrated directly for the human enzyme.
    action: ACCEPT
    reason: Core molecular function. The purified human enzyme cleaves 5' single-stranded flap strands
      specifically, and the reaction is abolished by active-site mutations, establishing that FEN1 itself
      enables the activity.
    supported_by:
    - reference_id: PMID:8131753
      supporting_text: The enzyme described here, flap endonuclease-1 (FEN-1), cleaves DNA flap strands
        that terminate with a 5' single-stranded end.
    - reference_id: PMID:8621570
      supporting_text: Mutants D34A, D86A, and D181A lost their cleavage activity completely but retained
        substrate binding ability
- term:
    id: GO:0008409
    label: 5'-3' exonuclease activity
  qualifier: enables
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Phylogenetic inference of 5'-3' exonuclease activity. FEN1 has a genuine 5'-3' exonuclease
      activity, acting on nicked and gapped double-stranded DNA using the same active site as the flap
      endonuclease reaction.
    action: ACCEPT
    reason: Directly demonstrated for the purified human enzyme, and mutations that alter substrate engagement
      (R70A) selectively eliminate the exonuclease mode, showing it is an intrinsic property of FEN1.
      GO:0008409 is retained rather than narrowed because an IBA annotation records the family-level consensus;
      the human-specific narrowing to a dsDNA 5'-3' term is carried by the GO:0008309 MODIFY on PMID:8131753,
      which is the entry whose cited evidence establishes the duplex specificity.
    supported_by:
    - reference_id: PMID:8131753
      supporting_text: In addition to endonuclease activity, FEN-1 has a 5'-3' exonuclease activity which
        is specific for double-stranded DNA.
    - reference_id: PMID:11986308
      supporting_text: Mutation of the Arg-70 significantly reduced flap endonuclease activity and eliminated
        exonuclease activity.
- term:
