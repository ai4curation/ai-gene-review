    reason: The only evidence is heterologous complementation of a fission yeast phenotype; no experiment
      shows that human FEN1 protects human cells from UV. Human FEN1 is not a nucleotide excision repair
      enzyme (that role belongs to its paralog XPG/ERCC5), so annotating 'UV protection' to FEN1 risks
      conflating the two family members.
    supported_by:
    - reference_id: PMID:8007985
      supporting_text: Human cDNA has 55% amino acid sequence identity to the rad2 gene and is able to
        complement the UV sensitivity of the rad2 null mutant.
- term:
    id: GO:0062176
    label: R-loop processing
  evidence_type: IDA
  original_reference_id: PMID:36672839
  qualifier: involved_in
  review:
    summary: FEN1 endonucleolytically cleaves the RNA strand of R-loops, and is recruited to R-loops in
      human fibroblasts, resolving them through the base excision repair pathway. No R-loop process term
      is currently annotated to FEN1.
    action: NEW
    reason: This is a distinct biological process supported by direct evidence in human cells and in reconstituted
      assays, and it is the process context for FEN1's otherwise orphaned RNA-DNA hybrid ribonuclease
      activity (GO:0004523). Recruitment increases after oxidative DNA damage, tying the activity to BER.
    supported_by:
    - reference_id: PMID:36672839
      supporting_text: We showed that FEN1 specifically employed its endonucleolytic cleavage activity
        to remove the RNA strand in an R-loop during BER.
    - reference_id: PMID:36672839
      supporting_text: We further demonstrated that FEN1 was recruited to R-loops in normal human fibroblasts
        and senataxin-deficient (AOA2) fibroblasts, and its R-loop recruitment was significantly increased
        by oxidative DNA damage.
    - reference_id: PMID:36672839
      supporting_text: Our study provides the first evidence that FEN1 endonucleolytic cleavage can result
        in the resolution of R-loops via the BER pathway, thereby maintaining genome integrity.
core_functions:
- description: Cleaves the 5' single-stranded flap displaced by DNA polymerase delta during lagging-strand
    synthesis, incising one nucleotide into the annealed duplex of the double-flap substrate so that the
    RNA/DNA primer is removed and a directly ligatable nick remains. PCNA binding targets and stimulates
    this reaction at the replication fork.
