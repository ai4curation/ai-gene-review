- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: TAS
  original_reference_id: PMID:8007985
  qualifier: enables
  review:
    summary: TAS of damaged DNA binding, traced to the 1994 paper that cloned the human homolog of S.
      pombe rad2. That study reported sequence conservation and complementation of UV sensitivity; it
      did not assay binding to damaged DNA.
    action: REMOVE
    reason: FEN1 is a structure-specific nuclease that recognizes the geometry of a double-flap junction,
      not chemically damaged bases; substrate discrimination is by branch structure, and it does not cleave
      substrates lacking the complete flap. No study establishes preferential binding of human FEN1 to
      damaged DNA, and the cited reference contains no such experiment.
    supported_by:
    - reference_id: PMID:8007985
      supporting_text: Human cDNA has 55% amino acid sequence identity to the rad2 gene and is able to
        complement the UV sensitivity of the rad2 null mutant.
    - reference_id: PMID:8131753
      supporting_text: Furthermore, efficient flap cleavage requires the presence of the entire flap structure.
        Substrates missing one strand are not cleaved by FEN-1.
