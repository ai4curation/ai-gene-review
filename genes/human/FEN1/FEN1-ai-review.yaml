description: 'FEN1 (flap endonuclease 1, also called DNase IV and maturation factor 1) is a structure-specific,
  magnesium-dependent nuclease of the XPG/RAD2 family. Its principal activity is 5''-flap endonuclease
  cleavage: it threads onto the free 5'' end of a displaced single-stranded flap, tracks to the flap base,
  and incises one nucleotide into the annealed duplex of a double-flap substrate, leaving a nick that
  DNA ligase I can seal. The same two-metal-ion active site supports a 5''-to-3'' exonuclease activity
  on nicked and gapped double-stranded DNA and an RNase H activity on RNA:DNA hybrids, which lets FEN1
  remove ribonucleotide-containing flaps and incise the RNA strand of R-loops. During lagging-strand replication
  FEN1 carries out Okazaki fragment maturation, cleaving the RNA/DNA primer flap displaced by DNA polymerase
  delta; in long-patch base excision repair it removes the abasic-site-terminated flap generated by strand-displacement
  synthesis. It is targeted to these sites by PCNA, which binds a C-terminal PIP box and stimulates cleavage
  10- to 50-fold, and is further modulated by the RecQ helicases WRN and BLM, by MUS81 complexes, DDX11
  and WDR4, and by acetylation, phosphorylation and arginine methylation of its C-terminal region. FEN1
  acts principally in the nucleus, concentrating in nucleoli at steady state and redistributing to the
  nucleoplasm after DNA damage; a pool also functions in mitochondria alongside DNA2, and an alternatively
  initiated isoform, FENMIT, is mitochondrial and catalytically inactive but binds RNA flaps and R-loops.
  By preventing flaps from equilibrating into structures that seed duplications and deletions, FEN1 is
  a major determinant of repeat tract and overall genome stability.'
