id: O14896
gene_symbol: IRF6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interferon regulatory factor 6 (IRF6) is a developmentally specialized IRF-family
  DNA-binding transcriptional regulator that controls epithelial proliferation and differentiation
  programs, especially in epidermal, craniofacial and mammary epithelia. It localizes between
  cytoplasmic and nuclear pools, binds SERPINB5/maspin, and is linked to epithelial
  tumor-suppressive cell-cycle arrest rather than canonical interferon induction.
