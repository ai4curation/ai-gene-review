- term:
    id: GO:0046596
    label: regulation of viral entry into host cell
  evidence_type: IMP
  original_reference_id: PMID:28272419
  qualifier: involved_in
  review:
    summary: >-
      ACP2 influences influenza virus membrane fusion.
    action: KEEP_AS_NON_CORE
    reason: >-
      ACP2 depletion impairs influenza entry at the endosomal membrane-fusion step; this is
      a host-pathogen phenotype rather than ACP2 core lysosomal phosphatase role.
    supported_by:
    - reference_id: file:genes/human/ACP2/ACP2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Plays a crucial role in the membrane fusion step of the influenza A and B viruses
        entry process.
    - reference_id: PMID:28272419
      supporting_text: >-
        our study has provided new insight into the complex network of virus-host interactions
        during viral entry
