- term:
    id: GO:0007040
    label: lysosome organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87882
  - PANTHER:PTN000170534
  review:
    summary: >-
      Lysosome organization is over-propagated from mouse ACP2.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000170534
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse Acp2 supports lysosomal hydrolase biology, not conserved ACP2 activity
          as a lysosome organizer.
    reason: >-
      ACP2 acts enzymatically on lysosomal phosphomonoesters after delivery to lysosomes;
      the current human evidence supports lysosomal acid phosphatase activity and a secondary
      viral-entry phenotype, not a core role organizing lysosomes.
    supported_by:
    - reference_id: file:genes/human/ACP2/ACP2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Lysosomal acid phosphatase that catalyzes the hydrolysis of orthophosphoric monoesters
        to alcohols and phosphate under acidic conditions
