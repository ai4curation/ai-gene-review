id: P11117
gene_symbol: ACP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACP2 encodes lysosomal acid phosphatase, a type I membrane histidine acid phosphatase that
  is delivered to lysosomes, processed from a membrane-bound precursor to a soluble luminal
  enzyme, and hydrolyzes phosphate monoesters at acidic pH. Its lysosomal activity is implicated
  in mannose-6-phosphate processing of delivered lysosomal proteins and can influence influenza
  A and B viral membrane fusion in host endolysosomes.
