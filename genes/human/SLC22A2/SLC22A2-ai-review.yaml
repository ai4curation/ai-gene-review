id: O15244
gene_symbol: SLC22A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC22A2 encodes organic cation transporter 2 (OCT2/hOCT2), a 12-transmembrane-domain plasma-membrane protein of the SLC22 family within the major facilitator superfamily. OCT2 is an electrogenic, voltage-dependent, Na+-independent, bidirectional (facilitated-diffusion) polyspecific uniporter for organic cations: transport is driven by the membrane potential and the substrate concentration gradient rather than by ion coupling. It is expressed predominantly at the basolateral membrane of renal proximal tubule cells, where it carries out the first step of tubular secretion of organic cations from blood into the tubular epithelium, and is also present in CNS neurons (including the dopaminergic substantia nigra), airway ciliated epithelium, hepatocytes, and the blood-testis and blood-brain barriers. Its broad substrate range includes endogenous monoamine neurotransmitters (dopamine, noradrenaline, adrenaline, serotonin, histamine, tyramine), the neuromodulators cyclo(his-pro) and
  salsolinol, choline, acetylcholine, thiamine, creatinine, N-1-methylnicotinamide, guanidine, the polyamines agmatine, putrescine and spermidine, prostaglandins E2/F2-alpha, and many cationic drugs and xenobiotics (metformin, cisplatin, oxaliplatin, amantadine, memantine, cimetidine, tetraethylammonium, MPP+). Through these activities OCT2 contributes to renal clearance of cationic compounds, interstitial/extraneuronal monoamine handling in the CNS, and the disposition of many clinically important drugs.'
