core_functions:
- description: Electrogenic, Na+-independent, membrane-potential-driven bidirectional (facilitated) uptake of organic cations across the renal proximal-tubule basolateral membrane - the first step in renal tubular secretion of cationic drugs, xenobiotics and endogenous cations. The prototypical quaternary-ammonium cations (tetraethylammonium, 1-methylnicotinamide, MPP+, choline) are directly demonstrated substrates, captured by GO:0015651; the broader polyspecificity (creatinine, guanidine, metformin and other non-quaternary organic cations) reflects the same activity but has no dedicated non-obsolete GO MF term, since GO:0015101 organic cation transmembrane transporter activity was obsoleted as an unnecessary grouping term (so the substrate-specific terms carry the function, as for the paralogs OCT1/OCT3).
