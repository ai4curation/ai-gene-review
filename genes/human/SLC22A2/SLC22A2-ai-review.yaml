suggested_questions:
- question: 'Ontology gap: GO:0015101 organic cation transmembrane transporter activity (and the BP GO:0015695) were obsoleted as "unnecessary and confusing grouping terms" with no replacement, yet the Na+-independent polyspecific OCT uniport activity shared by OCT1/OCT2/OCT3 has no single live MF term (GO:0070715 is Na+-dependent; GO:0140968 is a MATE-type cation:proton antiporter). The function is currently split across substrate-specific terms (quaternary ammonium GO:0015651, monoamine GO:0008504, thiamine GO:0015234). Should GO provide a properly scoped non-grouping organic-cation MF term, or is the substrate-specific representation the intended model?'
- question: What is the in vivo quantitative contribution of OCT2 to CNS interstitial monoamine homeostasis relative to the high-affinity presynaptic transporters (DAT/NET/SERT) and to OCT3/PMAT, given its low substrate affinities (Km in the 0.1-2 mM range)?
- question: Which residues/structural features of OCT2 (now that a cryo-EM structure, PDB 8ET9, is available) determine its polyspecificity and the difference between its influx and efflux specificities noted in early electrophysiology?
- question: How much of inter-individual variability in renal clearance of metformin, cisplatin and creatinine is attributable to OCT2 coding variants (e.g. A270S) versus regulation by tyrosine phosphorylation (YES1) and cGMP?
suggested_experiments:
- description: Reconstitute purified human OCT2 in proteoliposomes and measure electrogenic cation flux under controlled membrane potential and pH to confirm the Na+-independent uniporter mechanism and quantify the efflux/influx asymmetry for representative substrates (TEA, MPP+, dopamine).
- description: Polarized renal proximal-tubule epithelial or organoid models with endogenously tagged OCT2 to resolve the basolateral-vs-luminal localization controversy (UniProt CAUTION) and measure vectorial secretion of creatinine and metformin.
- description: Slc22a2-knockout or OCT2-silenced models to quantify the in vivo role of OCT2 in cisplatin nephrotoxicity and in brain MPTP/dopaminergic toxicity, separating transport (necessity) from downstream toxic consequences.
