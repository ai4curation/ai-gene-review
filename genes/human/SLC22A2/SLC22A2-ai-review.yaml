- term:
    id: GO:0015179
    label: L-amino acid transmembrane transporter activity
  evidence_type: IMP
  original_reference_id: PMID:23864433
  qualifier: enables
  review:
    summary: Real in vitro activity, but an over-annotation of OCT2's function.
    action: MARK_AS_OVER_ANNOTATED
    reason: Reflects low-affinity handling of cationic amino acids (L-arginine Km >10 mM) by a polyspecific cation carrier; dedicated cationic-amino-acid transporters CAT2A/CAT2B (SLC7A2) perform physiological L-amino acid transport. Real in vitro activity of marginal physiological relevance.
    supported_by:
    - reference_id: PMID:23864433
      supporting_text: ADMA and L-arginine are substrates of human CAT2A, CAT2B, OCT2 and MATE1
