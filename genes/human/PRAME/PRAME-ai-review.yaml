id: P78395
gene_symbol: PRAME
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRAME (preferentially expressed antigen in melanoma) is an intracellular leucine-rich-repeat
  protein, the founding member of a primate-expanded family, normally expressed in testis and aberrantly
  overexpressed in melanoma, leukaemias and many other cancers. It is a substrate-recognition subunit
  of a Cullin2-RING (CRL2) E3 ubiquitin ligase, binding Elongin C and targeting substrates such as truncated
  selenoproteins exposing C-terminal degrons for polyubiquitination and proteasomal degradation. In the
  nucleus it associates with chromatin at NFY-bound active promoters and enhancers, and it acts as a dominant
  repressor of retinoic acid receptor signaling by binding liganded RARs and recruiting Polycomb (EZH2),
  thereby blunting RA-induced differentiation, growth arrest and apoptosis. PRAME is a cancer-testis antigen
  whose HLA-presented peptides are recognized by cytotoxic T cells.
