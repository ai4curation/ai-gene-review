suggested_questions:
- question: Is there any genuine cell-surface pool of PRAME, given its lack of a signal peptide or transmembrane
    segment, or do membrane immunostaining results reflect antibody cross-reactivity or peripheral association?
- question: What are the endogenous nuclear substrates of CRL2(PRAME) at NFY-bound promoters, and is RAR
    repression mediated through its ligase activity?
suggested_experiments:
- description: Non-permeabilized versus permeabilized flow cytometry and surface biotinylation with validated
    PRAME antibodies in PRAME-knockout and overexpressing leukaemia cells to test for any cell-surface
    exposure.
