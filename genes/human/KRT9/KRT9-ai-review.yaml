core_functions:
- description: Structural subunit of the suprabasal keratin intermediate filament network of palmoplantar epidermis. The K9
    rod pairs with a type II keratin in a coiled-coil heterodimer that polymerises into keratin filaments, adding mechanical
    resilience to weight- and friction-bearing skin.
  molecular_function:
    id: GO:0030280
    label: structural constituent of skin epidermis
  directly_involved_in:
  - id: GO:0045109
    label: intermediate filament organization
  locations:
  - id: GO:0045095
    label: keratin filament
  supported_by:
  - reference_id: PMID:23962810
    supporting_text: K9 is required for terminal differentiation and maintaining the mechanical integrity of palmoplantar
      epidermis.
  - reference_id: PMID:23962810
    supporting_text: ultrastructural analyses of the localized phenotype showed cytolysis-associated suprabasal splits with
      a significant reduction of keratin filaments.
  - reference_id: PMID:10218578
    supporting_text: Double staining of K9 and the endogenous keratin revealed the incorporation of de novo synthesized K9
      into the keratin network.
  - reference_id: PMID:8647270
    supporting_text: the plasmid CMX vector containing normal keratin 9 cDNA showed normal keratin network formation, whereas
      the vector with a G to A point mutated keratin 9 cDNA showed disrupted keratin filaments with droplet formation in the
      cells.
  - reference_id: file:human/KRT9/KRT9-uniprot.txt
    supporting_text: Structural component of intermediate filaments in suprabasal keratinocytes of palmoplantar epidermis.
      Forms heteropolymers with a type II keratin, assembling into keratin intermediate filament networks that maintain the
      mechanical integrity of the palmoplantar epidermis.
suggested_questions:
- question: 'Which type II keratin is the in vivo heterodimer partner of K9 in suprabasal palmoplantar keratinocytes: K1 (co-expressed,
    but unchanged in Krt9-null footpad), K5 (reduced in the knockout, but basal), K2, or K6C (proposed from proteomics)?'
- question: Does K9 bind 14-3-3 sigma directly, through which region, and is retention of YAP1 in the cytoplasm a property
    of filamentous K9 or of a soluble pool? Should this be represented in GO as protein sequestering activity once the primary
    data can be read in full?
- question: 'What does K9 add that K10, its closest paralog and co-expressed neighbour, does not: filament bundling, a different
    partner, or signalling through the head and tail domains?'
- question: Is the proteomic detection of K9 in tears, exosomes and other non-volar samples ever endogenous, or always handling
    contamination from fingertip skin?
suggested_experiments:
- hypothesis: K9 heterodimerises with K1 in suprabasal palmoplantar keratinocytes.
  description: Cross-link and immunoprecipitate K9 from human plantar epidermis and mouse footpad under conditions that preserve
    heterodimers (urea-resistant dimers), identify the co-purifying type II keratin by quantitative mass spectrometry, and
    confirm with proximity ligation in tissue sections and in vitro co-assembly of recombinant K9 with K1, K2, K5 and K6C.
  experiment_type: biochemical / proteomic
- hypothesis: EPPK variants at the helix initiation motif poison filament elongation at sub-stoichiometric ratios, whereas
    K9 absence only lowers filament density.
  description: Co-assemble recombinant wild-type K9 with graded fractions of R163W, N161S or L458P K9 and a type II partner
    in vitro, and measure filament length, bundling and network mechanics by electron microscopy and rheology; compare with
    assemblies lacking K9.
  experiment_type: in vitro reconstitution / biophysics
- hypothesis: The K9 14-3-3 sigma interaction requires a phosphorylated head-domain serine and is independent of filament
    incorporation.
  description: Map the 14-3-3 sigma binding site with K9 truncations and serine-to-alanine mutants in keratinocytes under
    compression, test assembly-incompetent K9 for binding and YAP1 retention, and measure YAP1 target gene expression.
  experiment_type: cell biology / mutagenesis
knowledge_gaps:
- gap_statement: The type II keratin with which K9 forms its obligate heterodimer in palmoplantar epidermis has not been identified
    experimentally.
  boundary: K9 is a type I keratin that incorporates into keratin filaments and is co-expressed with K1, K2 and K10 in suprabasal
    volar keratinocytes. In Krt9-null footpad K1 is unchanged while K5 and K2 fall; K6C has been proposed from proteomics
    and modelling.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: The partner defines the heterodimer interface that EPPK variants disrupt and determines which keratin network
    is poisoned by mutant K9.
  resolution: Direct identification of K9-containing heterodimers from native palmoplantar epidermis, with reconstitution
    of the candidate pairs in vitro.
  provenance:
  - reference_id: PMID:23962810
    supporting_text: As no change in the quantity or distribution of K1 was observed in Krt9−/− footpads, K9 may not interact
      with K1 here.
  - reference_id: PMID:37467889
    supporting_text: identifying the interaction partner is an essential first step in revealing EPPK pathogenesis
- gap_statement: How K9 confers the special mechanical and signalling properties of palmoplantar epidermis beyond what the
    co-expressed K1/K10 network provides is not understood, including the mechanism by which it restrains YAP1.
  boundary: K9 is required for the structural integrity and terminal differentiation of mouse footpad epidermis, and has been
    reported to interact with 14-3-3 sigma and keep YAP1 cytoplasmic.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It bears on whether keratoderma in EPPK follows from filament fragility alone or also from deregulated mechanosignalling,
    and on YAP1 inhibition as a therapy.
  resolution: Structure-function dissection of K9 domains for 14-3-3 sigma binding and YAP1 retention, separated from filament
    assembly, in keratinocytes and knock-in mice.
  provenance:
  - reference_id: PMID:23962810
    supporting_text: its functional significance is poorly understood.
  - reference_id: PMID:41000774
    supporting_text: Surprisingly little is known about the ontogeny, regulation and significance of Krt9 /K9.
