  - UniProtKB:Q99456
  review:
    summary: IBA from the type I keratin node PTN002757528, seeded by mouse keratin knockout phenotypes and human KRT25.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The ancestral annotation generalises tissue phenotypes of other type I keratins (hair follicle and simple-epithelium
      keratins) to every member of the clade. For K9 there is no evidence of a morphogenetic role: Krt9-null mice are born
      at Mendelian ratios with normally formed footpad epidermis that later develops calluses at stress-bearing sites, a maintenance
      and differentiation defect in an already formed epithelium (PMID:23962810). K9 is a late differentiation product of
      suprabasal palmoplantar keratinocytes (PMID:7507869). The term is not demonstrably false for the family, so it is marked
      as an over-annotation for KRT9. The PTHR23239 family review leaves this node UNRESOLVED: every seed is a mammalian mutant
      phenotype, and the node also reaches fish keratins that have no seed.'
    supported_by:
    - reference_id: PMID:23962810
      supporting_text: K9 is required for terminal differentiation and maintaining the mechanical integrity of palmoplantar
        epidermis.
    - reference_id: PMID:7507869
      supporting_text: Differentiation of human plantar and palmar epidermis is characterized by the suprabasal synthesis
        of a major special intermediate-sized filament (IF) protein, the type I (acidic) cytokeratin 9 (CK 9).
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN002757528
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: IBD seeded only by mammalian mutant phenotypes (Krt12, Krt16, Krt17, Krt25, Krt27), several annotated by
          MGI as acts_upstream_of_or_within; the family review could not separate morphogenesis from tissue fragility.
