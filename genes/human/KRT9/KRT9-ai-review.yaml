id: P35527
gene_symbol: KRT9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRT9 encodes keratin 9 (K9), a type I (acidic) keratin made almost exclusively by suprabasal, terminally differentiating
  keratinocytes of the thick ridged epidermis of palms and soles. Like all keratins it has a central alpha-helical rod (coils
  1A, 1B and 2 joined by linkers) flanked by glycine- and serine-rich head and tail domains; the rod forms a parallel coiled-coil
  heterodimer with a type II keratin, and dimers assemble through tetramers and unit-length filaments into 10 nm keratin intermediate
  filaments. K9 is the most abundant differentiation-specific keratin of volar epidermis, where it is added to the K1/K10
  network and reinforces the cytoskeleton of a tissue that bears weight and friction; its type II partner in vivo has not
  been established. Its expression is switched on after birth, depends on signals from palmoplantar dermal fibroblasts and
  on keratin 16, and responds to mechanical load. Mice lacking K9 develop footpad calluses with suprabasal cytolysis, depleted
  keratin filaments, impaired terminal differentiation and induction of the stress keratins K6 and K16, whereas heterozygous
  null mice are normal. Heterozygous missense and small in-frame variants clustered at the two ends of the rod, above all
  in the helix initiation motif of coil 1A, act in a dominant-negative manner by poisoning filament assembly and cause epidermolytic
  palmoplantar keratoderma. K9 has also been reported to bind 14-3-3 sigma and retain the mechanosensitive co-activator YAP1
  in the cytoplasm of palmoplantar keratinocytes.
