- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: HDA
  original_reference_id: PMID:22664934
  qualifier: located_in
  review:
    summary: High-throughput proteomics identification of K9 in tear fluid of breast cancer patients and controls.
    action: MARK_AS_OVER_ANNOTATED
    reason: K9 is an intracellular keratin filament protein whose expression is confined to suprabasal keratinocytes of palm
      and sole (PMID:10201533, PMID:7507869), and it is one of the skin keratins that enter mass spectrometry samples during
      handling (PMID:39761842). A hit in tear fluid of breast cancer patients and controls is therefore not evidence that
      extracellular region is a site where K9 resides or acts. The cached text of the paper does not name keratin 9, so the
      identification presumably sits in a supplementary table that was not read and no passage of the paper itself can be
      quoted for this row; the detection itself is not disputed, which is why the row is marked as an over-annotation and
      not removed.
    supported_by:
    - reference_id: PMID:10201533
      supporting_text: keratin 9 is exclusively expressed in the palmoplantar suprabasal keratinocyte layers
    - reference_id: PMID:39761842
      supporting_text: identifying keratins using mass spectrometry analysis is challenging due to potential contamination
        from skin cells and hair during sample handling.
