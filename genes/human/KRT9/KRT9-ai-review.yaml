  review:
    summary: Ensembl Compara transfer from mouse Krt9 (Q6RHW0), whose IMP annotation rests on a neo-cassette insertion allele
      with sperm tail anomalies.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The rodent evidence is real but thin: K9 was found in the perinuclear ring of the rat spermatid manchette (PMID:11071770),
      and mice carrying a neo cassette in Krt9 intron 6, which make wild-type K9 plus a truncated protein, show ectopic manchettes
      and coiled sperm tails yet are fertile (PMID:16015579). The allele produces a truncated keratin, so the phenotype may
      reflect a poisonous product and not loss of a K9 role in spermiogenesis. No testis expression or reproductive phenotype
      has been reported for human KRT9, and EPPK is a skin-limited disorder. The transfer to the human gene overstates what
      is known.'
    supported_by:
