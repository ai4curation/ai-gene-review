  review:
    summary: High-throughput proteomics identification of K9 in isolated human sperm nuclei.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'K9 is an intracellular keratin filament protein whose expression is confined to suprabasal keratinocytes of palm
      and sole (PMID:10201533, PMID:7507869), and it is one of the skin keratins that enter mass spectrometry samples during
      handling (PMID:39761842). A hit in isolated human sperm nuclei is therefore not evidence that nucleus is a site where
