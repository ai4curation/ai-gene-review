    action: ACCEPT
    reason: 'K9 is a keratin intermediate filament subunit: wild-type K9 expressed in MDCK and DJM-1 cells forms a normal
      keratin network, and de novo K9 incorporates into the endogenous network in mouse skin (PMID:8647270, PMID:10218578).
      GO:0030280 is a sibling under structural molecule activity, not a descendant of this term, so both are kept.'
