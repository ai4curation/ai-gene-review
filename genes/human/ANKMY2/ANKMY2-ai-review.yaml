    - reference_id: PMID:32702291
      supporting_text: Ankmy2 binds to multiple adenylyl cyclases, determining their maturation and trafficking
        to primary cilia.
    - reference_id: PMID:21124868
      supporting_text: Indeed, we demonstrate that DAF-25 is required for proper DAF-11 ciliary localization.
