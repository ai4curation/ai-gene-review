  - ensembl:ENSMUSP00000039484
  review:
    summary: 'Enzyme binding (IEA, from mouse Ankmy2 binding guanylyl cyclase GC1). Correct: ANKMY2 binds
      guanylyl and adenylyl cyclases; accepted.'
    action: ACCEPT
    reason: The IEA's donor evidence is the mouse Ankmy2 interaction with the photoreceptor guanylyl cyclase
      GC1 [PMID:21124868 "Furthermore, the functional interaction is evolutionarily conserved, as mouse
      Ankmy2 interacts with guanylyl cyclase GC1 from ciliary photoreceptors."], and Ankmy2 also binds
      multiple adenylyl cyclases [PMID:32702291 "Ankmy2 binds to multiple adenylyl cyclases, determining
      their maturation and trafficking to primary cilia."]. Enzyme binding spans both the guanylyl and
      adenylyl cyclase interactions, whereas GO:0008179 adenylate cyclase binding would cover only the
      latter, so the broader term is kept for this row. The adenylyl-cyclase role is named separately
      in core_functions.
    supported_by:
    - reference_id: PMID:21124868
      supporting_text: Furthermore, the functional interaction is evolutionarily conserved, as mouse Ankmy2
