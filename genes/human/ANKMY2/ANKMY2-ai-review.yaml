      fractionation and immunofluorescence"], and [PMID:32702291 "Endogenous Ankmy2 also fractionated
      into the cytosolic fraction"]; this cytosol evidence is from rodent cells. ANKMY2 acts upstream
      of the cilium, on adenylyl cyclase maturation and trafficking [PMID:32702291 "Ankmy2 binds to multiple
      adenylyl cyclases, determining their maturation and trafficking to primary cilia."], so cytosol
      is the supported location.'
