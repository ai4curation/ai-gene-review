- id: PMID:32702291
  title: Ankmy2 Prevents Smoothened-Independent Hyperactivation of the Hedgehog Pathway via Cilia-Regulated
    Adenylyl Cyclase Signaling.
  findings:
  - statement: Ankmy2 binds adenylyl cyclases and controls their maturation and ciliary trafficking.
    supporting_text: Ankmy2 binds to multiple adenylyl cyclases, determining their maturation and trafficking
      to primary cilia.
  - statement: Ankmy2 is cytosolic and not enriched in cilia.
    supporting_text: expressing LAPANKMY2 in NIH 3T3 cells was confirmed to be a predominantly cytosolic
      protein, but not enriched in cilia, using subcellular fractionation and immunofluorescence
  - statement: Endogenous Ankmy2 fractionates with the cytosol.
    supporting_text: Endogenous Ankmy2 also fractionated into the cytosolic fraction
  - statement: Ankmy2 knockouts have increased Hedgehog signaling and ventralized neural tubes.
    supporting_text: Knockout embryos have increased Hedgehog signaling and completely open neural tubes
      showing co-expansion of all ventral neuroprogenitor markers, comparable to the loss of the Hedgehog
      receptor Patched1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Mouse knockouts and cell biology.
- id: PMID:41474822
  title: Lack of ANKMY2 suppresses kidney cystogenesis in embryonic- and adult-onset polycystic kidney
    disease.
  findings:
  - statement: ANKMY2 knockdown lowers ciliary ADCY3 in human kidney cells.
    supporting_text: Finally, as ANKMY2 knockdown similarly reduces ciliary ADCY3 levels in both normal
      human kidney cells and human ADPKD cyst-lining cells, targeting ANKMY2 can be highly significant
      for translational relevance.
  - statement: Knockdown significantly reduced ciliary ADCY3 in NHK and ADPKD cells.
    supporting_text: We found that efficient knockdown of ANKMY2 significantly reduced ciliary levels
      of ADCY3 in both NHK and ADPKD cells compared to control siRNA-treated cells
  - statement: ANKMY2 controls ciliary adenylyl cyclase trafficking in mouse and human kidney cells.
    supporting_text: Mechanistically, ANKMY2 controlled the ciliary trafficking of multiple adenylyl cyclases
      in mouse and human kidney epithelial cells without disrupting cilia while retaining cellular pools.
  - statement: Loss of ANKMY2 suppresses cystogenesis in Pkd1 models.
    supporting_text: In kidney-specific Ankmy2/Pkd1 knockout mice, loss of ANKMY2 suppressed early postnatal
      cystogenesis and significantly extended survival in an embryonic-onset Pkd1 deletion model.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Includes normal human kidney and ADPKD cells, the human evidence for the
      NEW row. Its 2026 erratum (doi:10.1371/journal.pgen.1012049) only replaces a mis-uploaded S1 Data
      file.
- id: PMID:21124868
  title: Localization of a guanylyl cyclase to chemosensory cilia requires the novel ciliary MYND domain
    protein DAF-25.
  findings:
  - statement: DAF-25 is required for DAF-11 ciliary localization.
    supporting_text: Indeed, we demonstrate that DAF-25 is required for proper DAF-11 ciliary localization.
  - statement: Mouse Ankmy2 binds guanylyl cyclase GC1.
    supporting_text: Furthermore, the functional interaction is evolutionarily conserved, as mouse Ankmy2
      interacts with guanylyl cyclase GC1 from ciliary photoreceptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. C. elegans genetics plus the mouse GC1 interaction behind the enzyme-binding
      IEA.
- id: PMID:25077969
  title: Role of the ANKMY2-FKBP38 axis in regulation of the Sonic hedgehog (Shh) signaling pathway.
  findings:
  - statement: ANKMY2 depletion lowers, and overexpression raises, Shh signaling in MEFs.
    supporting_text: Depletion or overexpression of ANKMY2 resulted in down- and up-regulation of Shh
      signaling, respectively, in mouse embryonic fibroblasts.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32702291
      review_notes: Ankmy2 knockout embryos show increased, not decreased, Hedgehog signaling. The later
        study notes this conflict with the earlier knockdown and overexpression work.
      supported_by:
      - reference_id: PMID:32702291
        supporting_text: Knockout embryos have increased Hedgehog signaling and completely open neural
          tubes showing co-expansion of all ventral neuroprogenitor markers, comparable to the loss of
          the Hedgehog receptor Patched1.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Abstract-only. Earlier cell-culture study reporting the opposite direction of Hedgehog
      regulation to the knockout embryos of PMID:32702291.
