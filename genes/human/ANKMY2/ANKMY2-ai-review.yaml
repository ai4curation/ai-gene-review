  review:
    summary: Proposed. ANKMY2 is required for adenylyl cyclases to reach primary cilia, including in human
      kidney cells.
    action: NEW
    reason: '[PMID:41474822 "We found that efficient knockdown of ANKMY2 significantly reduced ciliary
      levels of ADCY3 in both NHK and ADPKD cells compared to control siRNA-treated cells"] [PMID:41474822
      "Mechanistically, ANKMY2 controlled the ciliary trafficking of multiple adenylyl cyclases in mouse
      and human kidney epithelial cells without disrupting cilia while retaining cellular pools."] ANKMY2
      does part of the work: it binds the cyclases and determines their maturation and trafficking to
      cilia [PMID:32702291 "Ankmy2 binds to multiple adenylyl cyclases, determining their maturation and
      trafficking to primary cilia."]. Comparator: the worm ortholog DAF-25 (Q9N3Q8, a member of the same
      PANTHER subfamily PTHR24150:SF8), which localizes the guanylyl cyclase DAF-11 to cilia [PMID:21124868
      "Indeed, we demonstrate that DAF-25 is required for proper DAF-11 ciliary localization."], carries
      GO:0097499 by IMP from PMID:21124868 (checked in QuickGO). Primary cilia are non-motile, so the
      non-motile cilium term fits.'
    supported_by:
    - reference_id: PMID:41474822
      supporting_text: We found that efficient knockdown of ANKMY2 significantly reduced ciliary levels
        of ADCY3 in both NHK and ADPKD cells compared to control siRNA-treated cells
    - reference_id: PMID:41474822
      supporting_text: Mechanistically, ANKMY2 controlled the ciliary trafficking of multiple adenylyl
        cyclases in mouse and human kidney epithelial cells without disrupting cilia while retaining cellular
