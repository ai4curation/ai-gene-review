gene_symbol: ANKMY2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKMY2 (ankyrin repeat and MYND domain-containing 2) is a cytosolic protein that binds membrane
  nucleotidyl cyclases and is needed for their maturation and delivery to primary cilia. Mouse ANKMY2
  binds several adenylyl cyclases and the photoreceptor guanylyl cyclase GC1. Without it, adenylyl cyclase
  III is lost from neuroepithelial cilia, ciliary cAMP signaling fails to make GLI repressors, and Hedgehog
  target genes are derepressed independently of Smoothened, so knockout embryos have ventralized, open
  neural tubes and die mid-gestation. In mouse and human kidney epithelial cells it controls ciliary adenylyl
  cyclase trafficking, and its loss suppresses cyst formation in Pkd1-deficient kidneys. The worm ortholog
  DAF-25 localizes a guanylyl cyclase to sensory cilia.
