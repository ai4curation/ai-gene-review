suggested_questions:
- question: Is ANKMY2 a chaperone for adenylyl cyclase folding and ER export, or a trafficking adaptor?
    Where in the secretory pathway does it act?
suggested_experiments:
- description: Follow adenylyl cyclase glycosylation and ER exit in Ankmy2 knockout cells, and map the
    ANKMY2 binding site on ADCY3.
