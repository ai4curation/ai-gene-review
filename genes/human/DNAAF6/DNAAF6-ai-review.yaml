gene_symbol: DNAAF6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF6 is a 214-residue cytoplasmic assembly factor required for formation of outer and inner
  axonemal dynein arms. It associates with the dynein intermediate chain DNAI2 and other assembly factors,
  and is enriched at the trans-Golgi network in human ciliated airway cells. A predicted CS-like domain
  supports a role in chaperone-associated assembly; a distinct PIH domain is not supported by the current
  domain assignment. Loss of DNAAF6 disrupts ciliary and sperm flagellar motility and causes X-linked
  primary ciliary dyskinesia, with variable residual dynein arms and laterality phenotypes.
