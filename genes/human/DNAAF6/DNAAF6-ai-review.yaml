gene_symbol: DNAAF6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF6 is a 214-residue cytoplasmic assembly factor required for formation of outer and
  inner axonemal dynein arms. It associates with the dynein intermediate chain DNAI2 and other assembly
  factors, and is enriched at the trans-Golgi network in human ciliated airway cells. It belongs to
  the PIH/CS dynein-assembly-factor family and contains a predicted CS-like domain, rather than a
  distinct PIH domain. Loss of DNAAF6 disrupts ciliary and sperm flagellar motility and causes X-linked
  primary ciliary dyskinesia, with variable residual dynein arms and laterality phenotypes.
