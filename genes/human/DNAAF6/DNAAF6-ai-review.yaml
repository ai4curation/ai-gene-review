- id: PMID:30354218
  title: NOX4 (NADPH Oxidase 4) and Poldip2 (Polymerase δ-Interacting Protein 2) Induce Filamentous Actin
    Oxidation and Promote Its Interaction With Vinculin During Integrin-Mediated Cell Adhesion.
  findings:
  - statement: Human aortic smooth-muscle POLDIP2 knockdown reduces actin–vinculin association and focal-adhesion
      maturation. The actin–vinculin response to POLDIP2 overexpression depends on NOX4, supporting an
      upstream cytoskeletal-regulatory role rather than demonstrated direct actin crosslinking. This is
      partner-class evidence, not a DNAAF6-dependent process.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified against the separately recovered original Methods (https://pmc.ncbi.nlm.nih.gov/articles/PMC6206888/#P13),
      Results and Figure 6 caption (https://pmc.ncbi.nlm.nih.gov/articles/PMC6206888/#F6). Methods defines
      HASMs as human aortic smooth muscle cells; the caption explicitly identifies HASMs for the POLDIP2
      knockdown and NOX4-control experiments. The normal fetched cache contains main text but omits these
      captions; its full_text_available flag is unchanged. The evidence guide provides two short original
      excerpts and precise locators. Figure pixels were not independently scored. This paper supports
      the POLDIP2 partner class and does not assay DNAAF6.
core_functions:
- description: Supports cytoplasmic preassembly of outer and inner axonemal dynein arms through an
    assembly-factor mechanism that includes DNAI2 association. Human reciprocal co-immunoprecipitation
    and loss-of-function arm defects support this integrated function. Human HSP90-fragment Y2H and
    native mouse Hsp70/Hsp90 associations connect DNAAF6 to chaperone-associated assembly, while recruitment
    of those chaperones into a defined maturation complex remains a mechanistic model. Trans-Golgi
    enrichment is demonstrated in human airway cells; the binding assays do not establish the location
    or complete composition of the active assembly complex.
  molecular_function:
    id: GO:0045505
    label: dynein intermediate chain binding
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005802
    label: trans-Golgi network
  supported_by:
  - reference_id: PMID:28041644
    supporting_text: cytoplasmic preassembly process of both ODA types and IDAs
  - reference_id: PMID:28176794
    supporting_text: PIH1D3–DNAI2 interaction was destroyed by introduction of the missense mutation
  - reference_id: PMID:24421334
  knowledge_gaps:
  - gap_statement: The direct contact geometry and biochemical contribution of DNAAF6 to DNAI2/dynein
      maturation remain unresolved.
    gap_kind:
    - BIOLOGY
    boundary: Human tag-swapped co-IP and disease-variant loss establish association, while ortholog
      native complexes support chaperone-associated assembly. Purified binding, folding kinetics and
      complete complex architecture were not established in the evaluated experiments.
    resolution: Reconstitute DNAAF6 with DNAI2 and defined assembly partners, measuring direct binding
      and maturation while controlling variant abundance, stability and localization.
