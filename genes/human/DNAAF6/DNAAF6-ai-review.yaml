  - statement: Human disease-associated DNAAF6 deficiency disrupts outer and inner dynein-arm assembly;
      sequence-confirmed human constructs support DNAAF2/DNAAF4 association, with HSP90 tested as
      fragments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine original Results, relevant Methods and captions support human dynein-arm
      assembly and source-specific binding/localization. Human and ortholog assays, disease variants
      and model architecture are distinguished in the source guide.
