- id: file:human/DNAAF6/DNAAF6-evidence-guide.md
  title: DNAAF6 source and evidence guide
  findings: []
core_functions:
- description: Supports cytoplasmic preassembly of outer and inner axonemal dynein arms through an assembly-factor
    mechanism that includes DNAI2 association. Human reciprocal co-immunoprecipitation and loss-of-function
    arm defects support this integrated function. Trans-Golgi enrichment is demonstrated in human airway
    cells; the binding assay does not by itself establish the location or complete composition of the
    active assembly complex.
  molecular_function:
    id: GO:0045505
    label: dynein intermediate chain binding
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005802
    label: trans-Golgi network
  supported_by:
  - reference_id: PMID:28041644
  - reference_id: PMID:28176794
  - reference_id: PMID:24421334
  knowledge_gaps:
  - gap_statement: The direct contact geometry and biochemical contribution of DNAAF6 to DNAI2/dynein
      maturation remain unresolved.
    gap_kind:
    - BIOLOGY
    boundary: Human tag-swapped co-IP and disease-variant loss establish association, while ortholog native
      complexes support chaperone-associated assembly. Purified binding, folding kinetics and complete
      complex architecture were not established in the evaluated experiments.
    resolution: Reconstitute DNAAF6 with DNAI2 and defined assembly partners, measuring direct binding
      and maturation while controlling variant abundance, stability and localization.
suggested_questions:
- question: How do the cytoplasmic and trans-Golgi-associated DNAAF6 pools contribute to dynein maturation,
    and do additional HPA-reported pools reflect tissue-specific functions?
