  title: X-linked primary ciliary dyskinesia due to mutations in the cytoplasmic axonemal dynein assembly
    factor PIH1D3.
  findings:
  - statement: Human tagged DNAAF6 and DNAI2 associate with swapped tags and controls; a missense
      variant and three truncating variants lose the co-IP signal. Human airway imaging supports TGN
      enrichment, and residual dynein arms and motility vary among affected individuals.
  reference_review:
