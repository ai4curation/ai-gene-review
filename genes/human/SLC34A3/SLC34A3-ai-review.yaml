suggested_questions:
- question: Which phosphorylation or PDZ-scaffold interactions control human SLC34A3 insertion
    into and retrieval from the proximal-tubule brush border?
- question: Which HHRH missense variants primarily impair NaPi-IIc transport kinetics, and which
    primarily impair folding or apical trafficking?
suggested_experiments:
- description: Express recurrent HHRH missense variants in polarized human proximal-tubule cells
    and measure both apical surface delivery and two-sodium-to-one-phosphate transport.
- description: Map the SLC34A3 cytoplasmic-tail interactome under low-phosphate, PTH and FGF23
    stimulation to distinguish direct trafficking adaptors from binary interactome bystanders.
