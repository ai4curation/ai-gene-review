id: Q8N130
gene_symbol: SLC34A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC34A3 encodes NaPi-IIc, a multi-pass type II sodium/phosphate cotransporter
  of the renal proximal-tubule brush-border membrane. It imports extracellular inorganic
  phosphate together with two sodium ions in an electroneutral reaction, complementing
  SLC34A1/NaPi-IIa in proximal tubular phosphate reabsorption and renal phosphate conservation.
  Biallelic loss-of-function variants cause hereditary hypophosphatemic rickets with hypercalciuria
  through reduced renal phosphate reabsorption, hypophosphatemia, increased 1,25-dihydroxyvitamin
  D and hypercalciuria.
