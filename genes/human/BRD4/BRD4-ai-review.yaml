core_functions:
- description: Recognizes acetylated H4 and H3 in regulatory chromatin and brings together histones with
    transcriptional effectors. H4 recognition is supported across biochemical and cellular studies; H3K9ac
    and H3K27ac recognition is linked to bromodomain-dependent chromatin recruitment. The coupled recognition
    and recruitment mechanism supports transcription at active regulatory regions.
  molecular_function:
    id: GO:0140566
    label: histone reader activity
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:20871596
  - reference_id: PMID:23317504
  - reference_id: PMID:29379197
  - reference_id: PMID:29176719
    supporting_text: we confirmed the binding of transfected BRD4WT to JMJD6, NSD3 and H4ac
- description: Coactivates transcription through physical engagement of DNA-binding transcription factors,
    including acetylated RelA and regulated p53, and recruitment of P-TEFb or ET-domain-associated regulatory
    proteins. This non-histone interaction arm cooperates with histone reading. The long product recruits
    P-TEFb, whose CDK9 subunit performs the phosphorylation assigned to it in this mechanism; ET-dependent
    effector recruitment provides a separable P-TEFb-independent route.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0032968
    label: positive regulation of transcription elongation by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:19103749
  - reference_id: PMID:21555454
  - reference_id: PMID:23317504
    supporting_text: endogenous Brd4 associates with endogenous p53
  - reference_id: PMID:24360279
suggested_questions:
- question: Which human BRD4 preparations and activation states account for the positive and negative
    intrinsic kinase assays, and can clean separation-of-function mutants distinguish BRD4 catalysis from
    recruited kinases?
- question: How do the intrinsic histone acetyltransferase activity reported in PMID:27159561 and p300-dependent
    acetylation contributions separate under endogenous human conditions, considering the reported biochemical
    controls and the corrected Figure 2c?
- question: Can the individual H4-mark peptide-array results in the curated reader source be inspected
    alongside nucleosome-context and full-length recruitment assays?
- question: How do the three named BRD4 products partition ET-mediated regulation, P-TEFb recruitment
    and condensin-II-associated chromatin insulation?
- question: Which exact mouse experiment underlies the curated Th17-lineage ISS transfer, and how directly
    does its mechanism extend to human BRD4?
