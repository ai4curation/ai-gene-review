  review:
    action: UNDECIDED
    summary: Intrinsic BRD4 serine/threonine kinase activity remains experimentally disputed.
    reason: The original positive report (PMID:22509028) and later mouse-protein assays (PMID:34688663)
      support intrinsic phosphorylation, whereas an independent study found none with human BRD4 residues
      1–698 expressed in E. coli or Sf21 (PMID:24860166). The negative study explicitly allows preparation
      or activation requirements; it does not establish absence from every human BRD4 form. Species, construct
      and assay differences remain unresolved. This is not a donor-count, self-source or absent-domain
      objection. The PAINT node/MSA and donor experiments were not independently reconstructed; the source
      inference and all supporting entities are preserved.
