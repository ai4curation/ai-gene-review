id: O60885
gene_symbol: BRD4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRD4 is a nuclear BET-family chromatin reader and transcriptional coregulator. Its tandem
  bromodomains recognize acetylated histones and selected acetylated transcription factors, while its
  extraterminal region recruits regulatory partners. The long product links regulatory chromatin and transcription
  factors to P-TEFb, promoting RNA polymerase II elongation, and BRD4 can also recruit effectors through
  a P-TEFb-independent pathway. These interactions support stimulus-responsive gene expression and the
  maintenance of transcriptional programs across cell division. Alternative products differ in their C-terminal
  regions; the studied isoform B recruits condensin II and restricts DNA-damage signaling through chromatin
  compaction. BRD4 also binds papillomavirus E2 proteins, and BRD4-NUTM1 fusions have oncogenic activities
  distinct from those of the native protein.
