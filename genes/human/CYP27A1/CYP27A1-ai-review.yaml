functional_isoforms:
- id: CYP27A1_MATURE
  name: Mature mitochondrial CYP27A1
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000003618
    residues: 34-531
  description: The current 531-residue precursor contains a mitochondrial targeting segment at residues
    1–33; its annotated mature chain contains 498 residues. This processing product performs mitochondrial
    sterol oxidation and associates with the matrix side of the inner membrane. It is not a separately
    spliced isoform. The 1991 human cDNA study predicted this processing boundary; the present review
    does not claim direct sequencing of the human mature N terminus. Recombinant preparations can alter
    the N terminus, so their construct boundaries are not silently equated with the intact precursor.
suggested_questions:
- question: How much does CYP27A1 contribute to vitamin D3 25-hydroxylation in specific human tissues
    and physiological states, beyond the catalytic capacity measured in recombinant systems?
- question: Should the historical GO:0047748 label and vitamin-D process placement be clarified to match
    their current reaction and part_of definitions without resurrecting obsolete GO:0036378?
- question: How is matrix-facing CYP27A1 substrate access coordinated with sterol movement across mitochondrial
    membranes and with adrenodoxin availability?
suggested_experiments:
- description: Measure isotope-labeled cholesterol, bile-acid-intermediate and vitamin D3 flux in matched
    human cells after selective CYP27A1 depletion and rescue, quantifying enzyme abundance and redox-partner
    availability. Distinguish direct catalytic products from downstream signaling and compare CYP2R1-dependent
    D3 conversion.
