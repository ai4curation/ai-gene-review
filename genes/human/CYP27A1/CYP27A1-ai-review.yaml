id: Q02318
gene_symbol: CYP27A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP27A1 is a mitochondrial heme-thiolate cytochrome P450 that oxidizes the terminal side
  chain of cholesterol and several oxygenated sterols. Using electrons supplied through adrenodoxin and
  adrenodoxin reductase, it forms a side-chain alcohol and can carry out further oxidation to an aldehyde
  and carboxylic acid. These reactions supply bile-acid intermediates and contribute to cholesterol disposal.
  The precursor is imported into mitochondria and processed to a mature enzyme associated peripherally
  with the matrix face of the inner membrane. CYP27A1 also hydroxylates vitamin D3 at C25 and generates
  oxysterols with context-dependent signaling activities. Loss of CYP27A1 activity causes cerebrotendinous
  xanthomatosis.
