core_functions:
- description: Heme-dependent oxidation of the terminal side chain of cholestane intermediates through
    alcohol and aldehyde to carboxylic acid supplies bile-acid precursors. Adrenodoxin and adrenodoxin
    reductase deliver the reducing equivalents. The mature enzyme associates peripherally with the matrix
    face of the mitochondrial inner membrane.
  molecular_function:
    id: GO:0047748
    label: cholestanetetraol 26-dehydrogenase activity
  directly_involved_in:
  - id: GO:0006699
    label: bile acid biosynthetic process
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:1708392
    supporting_text: multiple oxidation reactions (R-CH3----R-CH2OH----R-COOH) at carbon 27 of sterol
      intermediates
  - reference_id: PMID:19401463
- description: Heme-dependent cholesterol side-chain hydroxylation generates 26(27)-hydroxycholesterol,
    followed by further oxidation to an aldehyde and cholestenoic acid. This supplies the acidic bile-acid
    pathway and contributes to cholesterol catabolism. The enzyme acts at the matrix-facing inner-membrane
    interface; not every oxysterol molecule is assumed to have the same downstream fate.
  molecular_function:
    id: GO:0031073
    label: cholesterol 26-hydroxylase activity
  directly_involved_in:
  - id: GO:0006707
    label: cholesterol catabolic process
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:9660774
    supporting_text: further oxidize 27-hydroxycholesterol giving first an aldehyde and then 3beta-hydroxy-5-cholestenoic
      acid
  - reference_id: PMID:12077124
