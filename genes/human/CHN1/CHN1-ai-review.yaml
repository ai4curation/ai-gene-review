id: P15882
gene_symbol: CHN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHN1 encodes alpha-chimaerin Rac GTPase-activating proteins that promote GTP hydrolysis on
  Rac and restrain Rac-dependent cytoskeletal signaling. The alpha2 product contains an N-terminal SH2
  domain in addition to a lipid-responsive C1 region and a C-terminal GAP domain; alpha1 has a different
  N terminus. Alpha2 associates with Eph receptors and couples guidance cues to spatially regulated Rac
  signaling in developing axons. Mouse and chick studies establish roles in growth-cone responses and
  motor-axon trajectory selection, while human dominant gain-of-function variants cause Duane retraction
  syndrome and strengthen Rac inactivation. Cytosolic alpha2 can redistribute toward membranes after stimulation.
  In human alpha2, C1-dependent diacylglycerol recognition helps control membrane recruitment, while intramolecular
  contacts restrain ligand access.
