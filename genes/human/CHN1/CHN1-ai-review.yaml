core_functions:
- description: Alpha-chimaerin accelerates GTP hydrolysis on Rac, providing a regulated signaling step
    that couples guidance-receptor input to axonal cytoskeletal responses. Original purified human alpha2
    experiments establish GAP activity; Rho and CDC42 were negative only under the tested assay conditions.
    Mouse/chick receptor association and GAP/SH2 perturbations establish performed regulation of axon
    extension and EphA-linked motor-axon guidance. Human-cell Rac-GTP measurements corroborate activity,
    while WT and mutant overexpression effects are dosage-sensitive. The older constructs were not sequence-aligned
    to all current products; receptor binding and alpha2 developmental assays do not establish universal
    all-product function. Human alpha2 C1-dependent diacylglycerol recognition helps position the GAP
    at membranes; intramolecular autoinhibition and additional inputs make ligand binding distinct from
    sufficient GAP activation.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
