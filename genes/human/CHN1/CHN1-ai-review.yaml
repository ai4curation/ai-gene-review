suggested_questions:
- question: How do the three sequence-verified human CHN1 products differ in receptor coupling, Rac-substrate
    preference and membrane recruitment at endogenous expression?
- question: How does Eph-dependent recruitment control local Rac inactivation when receptor coexpression
    alone does not consistently increase bulk GAP activity?
- question: Do the verified CHN1 interactions with HEMK1, MAPK1 and ANKK1 occur in the same endogenous
    cellular compartment, and what consequence follows from binding?
- question: How do endogenous diacylglycerol species and additional receptor inputs regulate membrane
    recruitment and Rac-GAP activity of each sequence-verified human CHN1 product, and what are their
    direct ligand affinities?
suggested_experiments:
- hypothesis: Spatial recruitment rather than a uniform increase in bulk catalytic activity controls the
    alpha2 guidance response.
  description: At matched endogenous expression, combine sequence-verified human alpha2, SH2-disruptive
    and GAP-inactive alleles with Eph stimulation and spatial Rac biosensors in human motor-neuron growth
    cones; measure local Rac kinetics, membrane recruitment and directional turning separately from total
    Rac-GTP.
- hypothesis: Human CHN1 products differ in regulated catalytic output.
  description: Purify all three sequence-verified human products and compare Rac, Rho and CDC42 hydrolysis
    across defined lipid conditions, with catalytic controls; independently test receptor association
    so that binding and enzyme activity remain separable.
