  label: Homo sapiens
description: 'MYCL encodes L-Myc, a nuclear Myc-family bHLH-LZ transcription factor. Like MYC and MYCN,
  L-Myc has conserved Myc and bHLH regions and is inferred to heterodimerize with MAX to bind regulatory
  DNA and regulate RNA polymerase II transcription, but it has a much smaller direct functional literature
  than MYC or MYCN.'
