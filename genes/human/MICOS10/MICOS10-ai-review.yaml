    label: SAM complex
  evidence_type: HDA
  original_reference_id: PMID:26477565
  qualifier: part_of
  review:
    summary: >-
      Complexome profiling found MICOS subunits co-migrating with SAMM50, MTX2 and MTX3 in a
      membrane bridging subcomplex and with DNAJC11 and MTX1 in the full MIB complex. The SAM
      complex term was projected onto MIC10 from that co-migration.
    action: REMOVE
    reason: >-
      The SAM complex (GO:0001401) is defined as an outer membrane complex that sorts and
      assembles imported outer membrane proteins. MIC10 is an integral inner membrane protein
      and is not a SAM subunit; the cited paper places it in MICOS and in the larger MIB
      bridging assemblies that contain SAM components. The evidence is captured correctly by
      the MIB complex (GO:0140275) row from the same paper, which is accepted. The same SAM
      complex row is removed in the APOO and APOOL reviews for the same reason.
    supported_by:
    - reference_id: PMID:26477565
      supporting_text: 'We find three main forms of the complex: A) The MICOS complex, containing
        all the MICOS proteins, B) a membrane bridging subcomplex, containing in addition SAMM50,
        MTX2 and the previously uncharacterized MTX3, and C) the complete MIB complex containing
        in addition DNAJC11 and MTX1.'
    - reference_id: PMID:22114354
      supporting_text: Thus we concluded that MINOS1 was an integral membrane protein of the
        inner membrane in human mitochondria.
