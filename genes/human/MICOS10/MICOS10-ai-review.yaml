- term:
    id: GO:0180020
    label: membrane bending activity
  evidence_type: ISS
  original_reference_id: PMID:25955211
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96VH5
  review:
    summary: >-
      Proposed new annotation: MIC10 bends lipid membranes through oligomerisation of its
      glycine-motif transmembrane hairpin.
    action: NEW
    reason: >-
      Purified yeast Mic10 (Q96VH5) induces curvature in model membranes, and glycine-motif
      oligomerisation mutants lose this activity and fail to form crista junctions in vivo;
      SGD records this as membrane bending (GO:0097753, IDA). Human MIC10 retains both
      GxGxGxG motifs (TM1 IGTGFGLGIV, TM2 AFGSGMGLGMA) and the basic inter-TM loop, and
      simulations of the MIC10 subcomplex support cardiolipin-assisted oligomerisation that
      stabilises curvature. This is a molecular function performed by MIC10 itself, the
      activity GO now uses for OPA1 and ESCRT-III proteins. Human protein has not been
      tested in vitro, hence ISS.
    supported_by:
    - reference_id: PMID:25955211
      supporting_text: We show that Mic10 spans the inner membrane in a hairpin topology and
        that its ability to sculpt membranes depends on oligomerization through a
        glycine-rich motif.
    - reference_id: PMID:25955211
      supporting_text: Oligomerization mutants fail to induce curvature in model membranes
    - reference_id: PMID:25955210
      supporting_text: The four-glycine motifs are dispensable for interaction of Mic10 with
        other MICOS subunits but are crucial for the formation of large Mic10 oligomers.
    - reference_id: PMID:42647630
      supporting_text: However, while Mic10 can act alone to form oligomers, which, in turn,
        causes membrane bending (22, 23), it is not solely responsible for the formation and
        maintenance of cristae (22).
core_functions:
- description: >-
    Core inner membrane subunit of the MICOS complex at crista junctions. MIC10 oligomerises
    through glycine motifs in its transmembrane hairpin to bend the inner membrane, and within
    the MIC10 subcomplex (with MIC13, MIC26 and MIC27) it is needed for normal crista junctions
    and lamellar cristae.
