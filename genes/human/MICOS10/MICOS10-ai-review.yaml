taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MICOS10 (MIC10, MINOS1) encodes a 78-amino-acid integral protein of the mitochondrial
  inner membrane and is a core subunit of the mitochondrial contact site and cristae
  organizing system (MICOS). It has two closely spaced hydrophobic segments, each carrying a
  conserved glycine-rich (GxGxGxG) motif, separated by a short basic loop, and is thought to
  span the membrane as a hairpin with its C terminus in the intermembrane space. MIC10 is the
  most widespread MICOS subunit across eukaryotes. Together with MIC13, MIC26 and MIC27 it
  forms the MIC10 subcomplex, which joins the MIC60-MIC19-MIC25 subcomplex at crista
  junctions in a MIC13-dependent step; through MIC60 the complex associates with the outer
  membrane SAMM50-metaxin machinery and DNAJC11 to form the intermembrane space bridging
  (MIB) complex. In yeast, Mic10 oligomerises through its glycine motifs and bends lipid
  membranes, and this membrane-sculpting activity is needed to form crista junctions. Human
  cells lacking MIC10 lose most crista junctions and lamellar cristae, which are replaced by
  tube-like, onion-like or spherical inner membrane structures, while MIC60 subcomplexes
  persist. Biallelic loss-of-function variants cause a hepatocerebral mitochondrial DNA
  depletion syndrome with abnormal cristae and impaired respiration, rescued in patient
  fibroblasts by re-expression of MIC10.
