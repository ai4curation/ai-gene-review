proposed_new_terms: []
suggested_questions:
- question: >-
    Does purified human MIC10 bend membranes in vitro as yeast Mic10 does, and does this
    depend on cardiolipin and on the two GxGxGxG motifs?
- question: >-
    Does human MIC10, like yeast Mic10, bind dimeric F1Fo-ATP synthase and promote its
    oligomerisation (PMID:28315355)? A positive result would support
    mitochondrial proton-transporting ATP synthase complex binding (GO:0140260), which yeast
    MIC10 already carries.
- question: >-
    Is the Cys58Ser variant found in trans to an exon-1 deletion in MICOS10-related
    hepatocerebral mtDNA depletion syndrome (PMID:39510533) a loss-of-function allele on its
    own, and how does a cristae defect lead to mtDNA depletion?
suggested_experiments:
- description: >-
    Reconstitute purified human MIC10 (wild type and glycine-motif mutants) into liposomes of
    defined cardiolipin content and measure tubulation or curvature by cryo-EM, followed by
    rescue of MIC10-knockout cells with the same mutants scored for crista junction number.
- description: >-
    Co-immunoprecipitate or crosslink human MIC10 with ATP synthase from wild-type and
    MIC10-knockout cells and test ATP synthase oligomer levels by BN-PAGE.
