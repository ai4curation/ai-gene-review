- term:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:20956529
  qualifier: enables
  review:
    summary: DACH1 binds the promoter regions of target genes (DACH1-responsive element).
    action: ACCEPT
    reason: 'DACH1 binds DNA through its DD1/Dachbox-N domain: the crystal structure shows a winged-helix/forkhead-like
      DNA binding motif (PMID:12057194), Dach binds chromatin independently of Eya and binds naked DNA with lower
      affinity (PMID:12215533), and DACH1 represses through direct binding to target promoters containing the DACH1-responsive
      element, with ChIP-seq sites co-localizing with FOX motifs (PMID:20956529). Sequence specificity is less well
      characterised than for classical TFs (no independent high-resolution motif), but the curator-reviewed full-text
      evidence and structural support justify retaining the annotation. DNA binding is a secondary mode relative
      to its predominant corepressor role.'
    supported_by:
    - reference_id: PMID:20956529
      supporting_text: Thus, DACH1 represses gene transcription through direct DNA binding to the promoter region
        of target genes by recruiting the transcriptional co-regulator, TCERG1.
    - reference_id: PMID:12215533
      supporting_text: Dach binds to chromatin DNA by itself, not being tethered by GAL4-Eya3. Dach also binds to
        naked DNA with lower affinity. The conserved DD1 domain is responsible for binding to DNA.
