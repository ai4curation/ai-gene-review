id: Q9UI36
gene_symbol: DACH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DACH1 (Dachshund homolog 1) is a nuclear transcriptional regulator of the Ski/Sno/Dachshund family
  and the vertebrate ortholog of Drosophila dachshund. It has an N-terminal Dachbox-N (DD1) domain whose crystal
  structure shows a winged-helix/forkhead-like DNA-binding fold, and a C-terminal Dachbox-C coiled-coil. DACH1 acts
  mainly as a transcriptional corepressor: it binds NCoR/HDAC3 and SIN3A corepressor complexes, partners with SIX
  homeodomain factors (SIX1, SIX6) as a component of the conserved Six-Eya-Dach network that controls precursor
  proliferation in organogenesis, and represses TGF-beta/SMAD4, AP-1/c-Jun (cyclin D1) and FOX-dependent transcription.
  EYA phosphatase activity can switch SIX1-DACH complexes from repression to activation through coactivator (CBP)
  recruitment. DACH1 also binds chromatin and DNA directly through DD1 and represses genes carrying a DACH1-responsive
  element, recruiting TCERG1. It is expressed in developing eye, limb, kidney and brain, and is a tumor suppressor
  in breast, prostate and glioma contexts, where it restrains proliferation and tumor-initiating activity (e.g.
  by repressing cyclin D1 and FGF2).'
