core_functions:
- description: 'DACH1 is a nuclear transcriptional corepressor: recruited by DNA-bound partners (SIX homeodomain
    factors, SMAD4, c-Jun) it brings NCoR/HDAC3 and SIN3A corepressor complexes to target promoters via its Dachbox-N
    (DS) domain, repressing genes such as cyclin D1, p27Kip1 and TGF-beta/SMAD targets; in the Six-Eya-Dach network
    EYA phosphatase activity can switch SIX1-DACH from repression to activation.'
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0030512
    label: negative regulation of transforming growth factor beta receptor signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16980615
    supporting_text: DACH1 repressed cyclin D1 through a novel mechanism via a c-Jun DNA-binding partner, requiring
      the DACH1 alpha-helical DS domain which recruits corepressors to the local chromatin.
  - reference_id: PMID:14525983
    supporting_text: NCoR enhanced DACH1 repression, and the repression of TGF-beta-induced AP-1 or Smad signaling
      by DACH1 required the DACH1 DS domain.
  - reference_id: PMID:14525983
    supporting_text: DACH1 participates in the negative regulation of TGF-beta signaling by interacting with NCoR
      and Smad4.
  - reference_id: PMID:14628042
    supporting_text: The phosphatase function of Eya switches the function of Six1-Dach from repression to activation,
      causing transcriptional activation through recruitment of co-activators.
- description: DACH1 can also bind chromatin and DNA directly through its winged-helix-like DD1 domain and repress
    transcription from promoters bearing the DACH1-responsive element, recruiting the co-regulator TCERG1; this
    direct DNA-binding repressor mode is supported by structural, biochemical and reporter data, though its sequence
    specificity is less well defined than its corepressor role.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20956529
    supporting_text: Thus, DACH1 represses gene transcription through direct DNA binding to the promoter region
      of target genes by recruiting the transcriptional co-regulator, TCERG1.
  - reference_id: PMID:12057194
    supporting_text: The protein forms an alpha/beta structure containing a DNA binding motif similar to that found
      in the winged helix/forkhead subgroup of the helix-turn-helix family.
  - reference_id: PMID:12215533
    supporting_text: Dach binds to chromatin DNA by itself, not being tethered by GAL4-Eya3. Dach also binds to
      naked DNA with lower affinity. The conserved DD1 domain is responsible for binding to DNA.
suggested_questions:
- question: What is the intrinsic DNA sequence specificity of the DACH1 DD1 domain (e.g. by SELEX or PBM), and what
    fraction of DACH1 ChIP-seq peaks reflect direct binding versus tethering by FOX, SIX, SMAD or AP-1 partners?
- question: Should the module annoton for Dachshund be refined from transcription coregulator activity (GO:0003712)
    to transcription corepressor activity (GO:0003714), given that activation appears to depend on EYA/CBP recruitment?
suggested_experiments:
- description: Compare genome-wide occupancy of wild-type DACH1 and a DD1 DNA-contact mutant (CUT&RUN) in kidney
    progenitor or breast epithelial cells, with SIX1/SIX2 co-occupancy, to separate direct DNA binding from partner-tethered
    corepression.
- description: Protein-binding microarray or HT-SELEX of the purified DACH1 DD1 domain to define whether it has
    a reproducible sequence-specific motif.
