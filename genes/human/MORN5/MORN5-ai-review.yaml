core_functions:
- description: Sperm flagellar protein needed in mouse for mitochondrial sheath integrity, mitochondrial
    energetics and male fertility. Its molecular activity is unknown.
  locations:
  - id: GO:0036126
    label: sperm flagellum
  supported_by:
  - reference_id: PMID:28742876
    supporting_text: Further analysis of the latter three proteins showed that they were all associated
      with cytoskeletal structures in the sperm flagellum.
  - reference_id: PMID:43076034
    supporting_text: These findings establish MORN5 as a previously unrecognized regulator of sperm mitochondrial
      homeostasis and male fertility.
suggested_questions:
- question: Does mouse Morn5 sit at the outer mitochondrial membrane of the midpiece or on the flagellar
    cytoskeleton? A crude "mitochondrial fraction" from sperm or testis cannot tell these apart. MORN5
    has no N-terminal presequence or transmembrane segment (my own reading of the sequence), so matrix
    or inner-membrane residence is unlikely.
suggested_experiments:
- hypothesis: MORN5 links the mitochondrial sheath to the flagellar cytoskeleton.
  description: In mouse sperm, do immunogold EM and expansion microscopy of Morn5 against outer-membrane,
    inner-membrane and fibrous-sheath markers. Then crosslink and immunoprecipitate with mass spectrometry
    to find direct partners.
  experiment_type: immuno-EM localisation and crosslinking IP-MS
knowledge_gaps:
- gap_statement: It is unknown what MORN5 does at the sperm midpiece. It could be a structural link between
    the mitochondrial sheath and the flagellar cytoskeleton, a membrane-binding MORN scaffold, or a regulator
    of respiratory-chain assembly or mitochondrial quality control.
  boundary: Mouse KO sperm have mitochondrial sheath defects, low ATP and low complex II/III activity,
    and Morn5 is enriched in mitochondrial fractions and associated with respiratory-chain proteins. Which
    partners it binds directly, which side of the outer mitochondrial membrane it sits on, and whether
    its MORN repeats bind lipids have not been tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  provenance:
  - reference_id: PMID:43076034
    supporting_text: MORN5 was enriched in mitochondrial fractions and associated with respiratory-chain
      and mitochondrial quality-control proteins.
