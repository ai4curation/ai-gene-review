- id: PMID:43076034
  title: MORN5 is required for sperm mitochondrial homeostasis and male fertility.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Literature-scan lead (issue 7138). Only the abstract is available; Europe PMC lists
      no open full text. It reports human WES variants, including a destabilising frameshift, and two
      mouse Morn5 KO lines with male infertility. The KO phenotype includes low sperm count and motility,
      mitochondrial sheath defects, lower membrane potential, ATP and complex II/III activity, and more
      ROS and DNA fragmentation. Morn5 is enriched in mitochondrial fractions and associates with respiratory-chain
      and quality-control proteins. These are the first loss-of-function data for MORN5. No annotation
      was proposed, because the abstract does not show what MORN5 itself does (see notes).
  full_text_unavailable: true
