gene_symbol: MORN5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MORN5 is a small protein of 161 residues made almost entirely of three MORN (membrane occupation
  and recognition nexus) repeats. It is expressed mainly in male germ cells. It is present in human and
  mouse sperm, and in mouse sperm it is associated with detergent-insoluble cytoskeletal structures of
  the flagellum. Mouse Morn5 knockouts are male-infertile. Their sperm are reduced in number and motility,
  with defects of the midpiece mitochondrial sheath, lower mitochondrial membrane potential and ATP, lower
  electron transport chain complex II/III activity, and more oxidative stress. Morn5 protein is enriched
  in mitochondrial fractions. Rare MORN5 variants, including a frameshift that destabilises the protein,
  occur in men with idiopathic infertility. In chick, MORN5 is expressed in craniofacial mesenchyme and
  is linked to BMP signalling. No molecular activity has been defined.
