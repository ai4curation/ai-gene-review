core_functions:
- description: PRKAB2 supplies a non-catalytic beta scaffold for AMPK alpha/beta/gamma heterotrimers.
    It binds the catalytic alpha subunit, bridges alpha to the gamma nucleotide-sensing subunit, and places
    a carbohydrate-binding module in the cytosolic and nuclear AMPK complex, including the skeletal-muscle-enriched
    alpha2/beta2/gamma1 combination that can be selectively activated by small molecules.
