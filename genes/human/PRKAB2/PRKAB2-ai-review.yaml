id: O43741
gene_symbol: PRKAB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRKAB2 encodes the beta-2 scaffolding subunit of the AMP-activated protein kinase (AMPK)
  heterotrimer. AMPK beta subunits bridge the catalytic alpha subunit to the adenine-nucleotide-sensing
  gamma subunit, and beta-2-containing complexes are abundant in skeletal muscle and are direct targets
  of beta-2-selective AMPK activators that regulate cellular energy homeostasis.
alternative_products:
- name: '1'
  id: O43741-1
- name: '2'
  id: O43741-2
  sequence_note: VSP_055820, VSP_055821
existing_annotations:
- term:
    id: GO:0004679
    label: AMP-activated protein kinase activity
  evidence_type: IDA
  original_reference_id: PMID:21399626
  qualifier: contributes_to
  review:
    summary: AMP-activated protein kinase activity of the heterotrimer, with PRKAB2 contributing as a
      non-catalytic beta scaffold.
    action: ACCEPT
    reason: The annotation is explicitly qualified contributes_to, so it does not claim that PRKAB2 is
      the catalytic kinase. PRKAB2 is part of the AMPK alpha/beta/gamma holoenzyme and is required for
      the complex architecture that enables the alpha subunit to catalyze AMP-activated protein kinase
      activity.
    supported_by:
    - &id003
      reference_id: PMID:21399626
      supporting_text: AMPK is a heterotrimeric complex comprising an α catalytic subunit and two regulatory
        subunits (β and γ)1.
