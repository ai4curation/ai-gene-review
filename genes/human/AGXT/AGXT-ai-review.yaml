id: P21549
gene_symbol: AGXT
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human AGXT encodes a liver-enriched, pyridoxal 5'-phosphate (PLP)-dependent aminotransferase
  that acts as a homodimer in the peroxisomal matrix. It transfers the amino group of L-alanine to glyoxylate,
  producing pyruvate and glycine and limiting the glyoxylate available for oxalate formation. A second
  substrate reaction, L-serine:pyruvate transamination, produces hydroxypyruvate and alanine and contributes
  to serine breakdown in human liver preparations. PEX5 recognizes its C-terminal KKL targeting signal
  together with contacts in the folded C-terminal domain. Loss of activity, aggregation, or altered intracellular
  targeting of AGXT causes primary hyperoxaluria type 1.
