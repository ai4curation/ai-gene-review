suggested_questions:
- question: What fraction of serine disposal in living human liver is carried by AGXT under different
    nutritional states, given positive human in-vitro flux and rabbit-only in-vivo tracer evidence in
    PMID:10347152?
- question: Does the cysteine chemistry measured for purified AGXT in PMID:18492492 contribute appreciable
    flux in human hepatocytes, and what coupled reaction best describes the observed half-transamination
    and pyruvate processing?
- question: How do folding kinetics, PEX5 recognition and intracellular context determine the different
    targeting outcomes observed for the same minor-allele variants across expression systems?
suggested_experiments:
- description: Measure labelled serine-to-hydroxypyruvate and glyoxylate-to-glycine flux in human hepatocyte
    models with AGXT loss and matched catalytic rescue, preserving peroxisomal targeting.
- description: Measure cysteine-derived products with purified normal human AGXT and in matched hepatocytes
    over physiological substrate concentrations, separating beta-elimination, half-transamination and
    net coupled turnover.
