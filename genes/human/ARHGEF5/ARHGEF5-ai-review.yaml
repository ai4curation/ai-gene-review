suggested_questions:
- question: Is SH3-mediated autoinhibition relieved physiologically by SRC SH3 engagement, by ODAM, or
    by Gbetagamma?
- question: Which ARHGEF5 isoforms account for the ruffle/filopodia phenotype (suggesting Rac/Cdc42 activity)
    versus the RhoA/ROCK stress-fibre phenotype?
suggested_experiments:
- description: Confirm the RhoA/RhoB-strong, RhoC/RhoG-weak substrate range with the human protein (UniProt
    records it only by similarity to mouse), and test whether SRC binding to the SH3 domain relieves autoinhibition
    in cells.
