- id: PMID:19713215
  title: Regulation of immature dendritic cell migration by RhoA guanine nucleotide exchange factor Arhgef5.
  findings:
  - statement: Mouse Arhgef5 activates RhoA and RhoB strongly and RhoC/RhoG weakly.
    supporting_text: Arhgef5 can strongly activate RhoA and RhoB and weakly RhoC and RhoG, but not Rac1,
      RhoQ, RhoD, or RhoV, in transfected human embryonic kidney 293 cells.
  - statement: Arhgef5 is needed for immature dendritic cell migration.
    supporting_text: Arhgef5 deficiency did not affect chemotaxis of mouse macrophages, T and B lymphocytes,
      and bone marrow-derived mature dendritic cells (DC), but it abrogated MIP1alpha-induced chemotaxis
      of immature DCs and impaired migration of DCs from the skin to lymph node.
  - statement: Gbetagamma binds and stimulates Arhgef5.
    supporting_text: In addition, Gbetagamma interacts with Arhgef5 and can stimulate Arhgef5-mediated
      activation of RhoA in an in vitro assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse Arhgef5 and knockout mice; source of the substrate panel used by UniProt
      and Reactome.
