id: Q12774
gene_symbol: ARHGEF5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF5 (TIM, ephexin3) is a 1,597-residue Rho guanine nucleotide exchange factor of the
  ephexin subfamily, first cloned as a transforming oncogene. It activates RhoA and acts upstream of RhoA/ROCK
  signalling, driving peripheral stress fibres, myosin light chain phosphorylation and cell rounding;
  overexpression in COS-7 and NIH-3T3 cells has also been reported to produce ruffles and filopodia. It
  is required for Src-induced podosome formation, where it binds the Src SH3 domain, is tyrosine-phosphorylated
  by Src and activates RhoA. In ameloblasts and junctional epithelium its SH3 domain binds ODAM in an
  integrin-ODAM-ARHGEF5-RhoA pathway that supports epithelial attachment to the tooth. Its exchange activity
  is autoinhibited through its SH3 domain, which peptides engaging the SH3 domain relieve; with Src it
  forms a ternary complex with phosphoinositide 3-kinase, and in mouse Gbetagamma binds and stimulates
  it. In mice Arhgef5 is needed for chemotaxis of immature dendritic cells and their migration from skin
  to lymph nodes. It is mainly cytoplasmic.
