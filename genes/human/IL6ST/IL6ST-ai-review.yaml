  qualifier: acts_upstream_of
  review:
    summary: Platelet aggregation is a specialized GPVI/gp130 cross-activation output.
    action: KEEP_AS_NON_CORE
    reason: PMID:31145836 showed that platelet gp130/JAK/STAT3 signaling cooperates with GPVI
      in lipid rafts and that blocking this pathway reduces collagen-induced platelet
      reactivity. Platelet aggregation is a narrow downstream outcome of that
      cross-talk.
    supported_by:
    - reference_id: PMID:31145836
