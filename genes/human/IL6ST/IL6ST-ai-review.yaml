id: P40189
gene_symbol: IL6ST
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IL6ST encodes gp130, the shared signal-transducing receptor beta chain
  for the IL-6 family of cytokines. Membrane gp130 homodimerizes in IL-6 and IL-11
  receptor complexes or heterodimerizes with partners such as LIFR, OSMR or IL27RA
  to couple extracellular cytokine binding to JAK-family kinase activation, receptor
  tyrosine phosphorylation, and recruitment of STAT, MAPK and PI3K signaling pathways.
  A soluble gp130 isoform binds the IL-6:soluble-IL6R complex and antagonizes IL-6
  trans-signaling in the extracellular space.
