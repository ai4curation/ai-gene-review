  supporting_entities:
  - GO:0034097
  review:
    summary: LIF/OSM activation of gp130-LIFR can feed acute inflammation as a broad cytokine
      output.
    action: KEEP_AS_NON_CORE
    reason: PMID:8999038 supports gp130 signaling with LIFR after LIF or oncostatin M
      stimulation. Acute inflammatory responses sit downstream of those receptor
