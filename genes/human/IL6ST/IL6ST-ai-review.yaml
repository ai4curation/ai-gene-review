- description: Reconstitute IL-6-, IL-11-, OSM-, LIF-, CNTF- and IL-27-bound human
    gp130 complexes with JAK1/JAK2/TYK2 perturbations and phosphoproteomic readouts.
  experiment_type: biochemistry
