id: Q14833
gene_symbol: GRM4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GRM4 encodes metabotropic glutamate receptor 4 (mGluR4), a group III class C G protein-coupled
  receptor for the neurotransmitter glutamate. It is a seven-transmembrane protein of the neuronal plasma
  membrane with a large extracellular Venus flytrap domain that binds glutamate, and it functions as a
  homodimer and as mGlu2-mGlu4 heterodimers. mGluR4 couples to Gi/o proteins: glutamate binding inhibits
  adenylyl cyclase and lowers cAMP, and also activates the MAPK/ERK pathway. Located predominantly at
  presynaptic terminals, it acts as an autoreceptor that suppresses neurotransmitter release, is strongly
  expressed in the cerebellum, and is a drug target in Parkinson''s disease and other CNS disorders.'
