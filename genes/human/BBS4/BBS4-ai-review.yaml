- id: PMID:24500759
  title: BBS4 directly affects proliferation and differentiation of adipocytes.
  findings:
  - statement: In mouse 3T3-F442A cells, stable Bbs4 silencing altered proliferation, adipogenic
      marker expression, lipid droplets and triglyceride accumulation. Selected knockdown and overexpression
      experiments showed opposing proliferation effects.
  - statement: The perturbation evidence supports the existing non-core adipocyte context beyond
      expression alone; the molecular step remains unresolved, and this does not assign transcription-factor
      or lipid-catalytic activity to BBS4.
