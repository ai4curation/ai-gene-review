      evidence does not establish a more specific activity for this pair, and limited mechanistic
      specificity is not evidence that the interaction is incorrect.
core_functions:
- description: Acts as a pericentriolar adaptor through interactions with PCM1 and DCTN1/p150-glued.
    These interactions support PCM1 positioning and centrosomal microtubule anchoring. Cell experiments
    support a dynein-associated recruitment model, while allowing that BBS4 also retains PCM1 after
    transport. Cooperation with DISC1 contributes to PCM1 and ninein localization.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0071539
    label: protein localization to centrosome
  - id: GO:0034454
    label: microtubule anchoring at centrosome
  locations:
  - id: GO:0034451
    label: centriolar satellite
  - id: GO:0005813
    label: centrosome
  supported_by:
  - reference_id: PMID:15107855
    supporting_text: functions as an adaptor of the p150(glued) subunit
  - reference_id: PMID:18762586
    supporting_text: PCM1 forms a complex with DISC1 and BBS4
- description: Contributes as a BBSome subunit to protein localization at cilia. Human retinal pigment
    epithelial cell depletion experiments support a requirement for BBS4 in BBSome ciliary entry,
    even though much of the remaining complex can remain assembled. The contribution is dependent
    on cargo and cell context and does not establish autonomous receptor recognition by BBS4.
  directly_involved_in:
