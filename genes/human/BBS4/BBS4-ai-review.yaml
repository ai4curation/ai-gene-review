- id: PMID:30665891
  title: BBS4 is required for intraflagellar transport coordination and basal body number in mammalian
    olfactory cilia.
  findings:
  - statement: Bbs4-null olfactory sensory neurons had fewer and shorter cilia, fewer basal bodies
      and altered IFT-A/B transport coordination. Residual cilia retained entry of tested olfactory
      signaling proteins and BBSome reporters.
  - statement: Adenoviral BBS4 expression partly restored ciliary length and olfactory responses
      in mature neurons, without restoring cilium or basal-body numbers in the reported interval.
      These limits prevent a universal cargo-entry or complete-rescue claim.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal abstract and selected normal Results104,108,114,120,126,132,138
      read. Assay context described in those Results; no whole Methods, image-pixel or supplementary-file
      audit.
