id: Q96RK4
gene_symbol: BBS4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS4 is a tetratricopeptide-repeat protein and a subunit of the BBSome, an eight-subunit
  complex involved in the localization of membrane proteins at cilia. It occurs at centriolar satellites,
  centrosomes and ciliary structures. BBS4 interacts with PCM1 and the dynactin subunit DCTN1/p150-glued,
  supporting recruitment or retention of pericentriolar proteins and the organization of centrosomal
  microtubules. Its cooperation with DISC1 helps position PCM1 and associated proteins such as ninein
  near centrosomes. Within the BBSome, BBS4 contributes to ciliary trafficking and connects the complex
  with satellite proteins including CEP131 and CEP290. These functions have different requirements
  across cargoes and cell types; BBS4 loss does not prevent every form of cilium formation or ciliary
  protein transport. Biallelic pathogenic variants cause a Bardet-Biedl syndrome ciliopathy with
  retinal, metabolic and other organ involvement.
