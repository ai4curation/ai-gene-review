    supporting_text: All BBSome subunits are required for BBSome ciliary entry.
proposed_new_terms: []
suggested_questions:
- question: What is the relative contribution of dynein-mediated PCM1 recruitment and retention at
    centriolar satellites to BBS4's adaptor function?
- question: Which ciliary cargoes require BBS4 contacts directly, and which depend on its contribution
    to the architecture or trafficking of the BBSome?
- question: What experiment and annotation context support the nuclear-retention annotation, and
    is there direct evidence for BBS4 nuclear residence?
suggested_experiments:
- description: Combine acute BBS4 depletion with live PCM1 tracking and separation-of-function mutants
    affecting PCM1 or DCTN1 interaction to distinguish recruitment from retention, and compare these
    immediate effects with subsequent cell-division changes.
- description: Compare ciliary trafficking of several defined receptor cargoes after BBS4 depletion
    and rescue, while measuring BBSome assembly and localization, to separate cargo-specific requirements
    from effects on the complex.
