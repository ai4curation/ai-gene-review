suggested_questions:
- question: >-
    Does NDUFA12 make any contribution to Complex I catalysis beyond structural
    stabilization - for example by influencing the conformational state of the
    N/Q-module junction or the rate of quinone-site turnover - or is the UniProt
    statement that it is 'believed not to be involved in catalysis' complete?
- question: >-
    NDUFA12 and its paralog NDUFAF2 can occupy the same site, with NDUFAF2 substituting
    in NDUFA12-knockout cells. Is the NDUFA12-containing complex functionally distinct
    from the NDUFAF2-containing one, and is the NDUFA12-for-NDUFAF2 exchange the
    physiological last step of Complex I maturation?
- question: >-
    If Complex I assembly is largely preserved in NDUFA12-knockout cells, what is the
    mechanism by which biallelic NDUFA12 loss-of-function causes Complex I deficiency
    and Leigh syndrome in patients - reduced holoenzyme stability, impaired turnover,
    or a tissue-specific requirement not seen in cultured cells?
- question: >-
    Is the alternative-splicing isoform Q9UI09-2, which replaces residues 58-145 with
    a six-residue peptide, expressed as a stable protein in any tissue, and does it
    behave like the MC1DN23 truncating variant VAR_081459?
- question: >-
    Is NDUFA12 a physiological substrate of mitochondrial cyclin B1/Cdk1, and if so
    does its phosphorylation alter Complex I activity or only the cell-cycle-coupled
    respiratory response reported for CI subunits collectively?
suggested_experiments:
- hypothesis: >-
    NDUFA12 is a purely structural subunit whose loss destabilizes the mature Complex I
    holoenzyme without blocking its assembly, because NDUFAF2 occupies the vacated site.
  description: >-
    In NDUFA12-knockout cells, compare holoenzyme half-life and steady-state amount by
    pulse-chase labelling and blue-native PAGE against wild type, and determine by
    quantitative proteomics of the isolated complex whether NDUFAF2 stoichiometrically
    replaces NDUFA12. Re-express wild-type NDUFA12 and an NDUFAF2-binding-site mutant to
    test whether restoring the subunit, rather than merely restoring any occupant of the
    site, is what restores stability.
  experiment_type: Pulse-chase and blue-native PAGE with quantitative proteomics
- hypothesis: >-
    The residual Complex I in NDUFA12-null cells is catalytically impaired at the
    quinone-reduction step rather than at NADH oxidation, consistent with NDUFA12's
    position at the N/Q-module junction.
  description: >-
    Measure NADH:ubiquinone oxidoreductase, NADH:ferricyanide (flavin-site) and
    NADH:decylubiquinone activities separately in mitochondria from wild-type,
    NDUFA12-knockout and patient-derived cells, and determine the proportion of complex
    in the deactive state. Divergence between flavin-site and quinone-site activities
    would localize the defect.
  experiment_type: Segmental respiratory-chain enzymology
- hypothesis: >-
    Cryo-EM of Complex I purified from NDUFA12-knockout cells will show NDUFAF2 bound in
    the NDUFA12 site with local disorder of the adjacent N- and Q-module elements.
  description: >-
    Purify Complex I from wild-type and NDUFA12-knockout human cells and determine
    single-particle cryo-EM structures of both, comparing occupancy and local resolution
    at the NDUFA12/NDUFAF2 site and the surrounding matrix-arm subunits. This would
    establish directly whether NDUFAF2 substitution is structurally equivalent.
  experiment_type: Single-particle cryo-electron microscopy
- hypothesis: >-
    The Q9UI09-2 splice isoform, which lacks residues 58-145, is not incorporated into
    Complex I and phenocopies the MC1DN23 truncating variant.
  description: >-
    Quantify the abundance of the two NDUFA12 splice isoforms across human tissues by
    isoform-resolved RNA-seq and targeted proteomics, then express each isoform in
    NDUFA12-knockout cells and assay incorporation into the holoenzyme by blue-native
    PAGE and rescue of Complex I activity.
  experiment_type: Isoform-resolved expression profiling with knockout complementation
