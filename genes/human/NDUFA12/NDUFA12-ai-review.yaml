- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: NAS
  original_reference_id: PMID:10830904
  qualifier: enables
  review:
    summary: >-
      'Enables NADH dehydrogenase (ubiquinone) activity' is an over-annotation for
      NDUFA12: UniProt states it is 'believed not to be involved in catalysis', and it
      is a supernumerary structural subunit, not a redox catalytic subunit. This
      complex-level activity is carried out by the core (NDUFS/NDUFV/ND) subunits.
      NDUFA12 should be represented as contributing_to this activity (via structural
      molecule activity), not as enabling it directly. The NAS derives from the enzyme
      name in the original cDNA paper, not from a demonstrated catalytic activity of
      this subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited paper is a cDNA characterization and mutation screen of the hydrophobic
      fraction subunits; it reports no enzymological assay of the 17.2-kDa protein, so
      the MF assignment reflects the name of the parent enzyme rather than a measured
      activity. The redox chemistry requires FMN and the Fe-S cluster chain carried by
      the NDUFV/NDUFS core subunits, none of which NDUFA12 possesses. The correct
      representation is contributes_to GO:0008137 with a structural molecule activity
      MF, which is how core_functions records it.
    supported_by:
    - reference_id: file:human/NDUFA12/NDUFA12-uniprot.txt
      supporting_text: "involved in catalysis."
    - reference_id: PMID:10830904
      supporting_text: "17.2-kDa cDNA sequences of the hydrophobic (HP) fraction of the complex."
      reference_section_type: ABSTRACT
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
core_functions:
- description: >-
    NDUFA12 (B17.2) is a non-catalytic accessory (supernumerary) structural subunit
    of the peripheral (matrix) arm of mitochondrial Complex I, near the N/Q-module
    junction. It does not independently catalyze NADH oxidation, quinone reduction,
    or proton translocation; instead it provides a structural molecule activity that
    stabilizes the mature holoenzyme and thereby contributes to the complex-level
    NADH:ubiquinone oxidoreductase activity, supporting electron transfer from NADH
    to ubiquinone within a fully assembled, functional Complex I. No biological
    process is asserted as a direct involvement, for the same reason that the
    complex-level process annotations above are held as non-core: the steps of
    electron transfer from NADH to ubiquinone are performed by the FMN- and
    Fe-S-cluster-bearing core redox subunits, which NDUFA12 does not possess, and
    assembly of the complex is driven by the assembly factors - UniProt records that
    complex I assembly is unaffected in NDUFA12-knockout cells because the NDUFAF2
    paralog substitutes at the same site. The structural contribution NDUFA12 does
    make is recorded by contributes_to GO:0008137 rather than by a process term.
