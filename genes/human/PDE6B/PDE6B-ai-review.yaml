- term:
    id: GO:0043153
    label: entrainment of circadian clock by photoperiod
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P23440
  - ensembl:ENSMUSP00000031456
  review:
    summary: Circadian entrainment; the mouse evidence used rd1 to remove the photoreceptors.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source is a mouse IMP (PMID:30240620) in which the Pde6b rd1 mutation served as a tool to eliminate
      rods and cones before testing UVA photoentrainment. Slower re-entrainment of rd1 mice shows that photoreceptors
      contribute light input to the clock, not that PDE6B has a role in entrainment beyond rod phototransduction
      itself.
    supported_by: &id007
    - reference_id: PMID:30240620
      supporting_text: In the rd1/rd1 retina, most rods degenerate rapidly (within the first week after birth) and
        all rods disappear completely by about 7 weeks of age.
