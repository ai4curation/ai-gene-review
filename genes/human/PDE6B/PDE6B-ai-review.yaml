id: P35913
gene_symbol: PDE6B
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PDE6B encodes the beta catalytic subunit of the rod photoreceptor cGMP phosphodiesterase (PDE6), a
  heterotetramer of one PDE6A, one PDE6B and two inhibitory PDE6G subunits. Like PDE6A, it has two N-terminal GAF
  domains, the first binding cGMP at a non-catalytic allosteric site, and a C-terminal two-metal (Zn2+/Mg2+) phosphodiesterase
  domain with its own active site that hydrolyses 3',5'-cyclic GMP to GMP. Its C-terminal CaaX motif is geranylgeranylated
  (PDE6A is farnesylated), anchoring the enzyme to the cytoplasmic surface of the rod outer segment disc membranes
  at the disc rims; the prenyl-binding protein PDE6D assists its delivery to the outer segment. In darkness the
  PDE6G C-termini block both active sites; light-activated transducin alpha (GNAT1-GTP), two molecules per enzyme,
  displaces them, and the burst of cGMP hydrolysis closes the cGMP-gated channels and hyperpolarises the rod. Biallelic
  loss-of-function variants cause autosomal recessive retinitis pigmentosa (RP40), and the mouse rd1 and rd10 retinal
  degeneration models are Pde6b alleles; a heterozygous His258Asn variant in the second GAF domain causes autosomal
  dominant congenital stationary night blindness.
