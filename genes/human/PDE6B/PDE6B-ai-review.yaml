    id: GO:0047555
    label: 3',5'-cyclic-GMP phosphodiesterase activity
  directly_involved_in:
  - id: GO:0141190
    label: transducin-mediated opsin signaling pathway
  locations:
  - id: GO:0120202
    label: rod photoreceptor disc membrane
  in_complex:
    id: GO:7770030
    label: rod photoreceptor phosphodiesterase 6 complex
  supported_by:
  - reference_id: PMID:20940301
    supporting_text: In this study, we have demonstrated that the catalytic PDE6A and PDE6B subunits are enzymatically
      equivalent.
  - reference_id: PMID:33007200
    supporting_text: The C-terminus of each PDEγ subunit binds at the entrance of the active site of each catalytic
      domain
suggested_questions:
- question: 'How does the dominant His258Asn variant, in the second (GAFb) domain, cause stationary night blindness
    rather than degeneration: by weakening PDE6G inhibition (constitutive activity) or by blunting activation?'
suggested_experiments:
- hypothesis: The CSNB His258Asn variant weakens PDE6G-mediated inhibition, giving constitutive basal PDE6 activity
    that desensitises rods.
  description: Measure basal and transducin-stimulated cGMP hydrolysis and PDE6G binding affinity of PDE6 carrying
    the variant in a knock-in mouse or Xenopus rod expression system.
