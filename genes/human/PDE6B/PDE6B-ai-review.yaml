core_functions:
- description: 'Catalytic beta subunit of rod PDE6: its own active site hydrolyses cGMP, within the PDE6A/PDE6B/PDE6G2
    complex on the rod disc membrane, when light-activated transducin relieves PDE6G inhibition; the resulting fall
    in cGMP closes the rod CNG channels.'
