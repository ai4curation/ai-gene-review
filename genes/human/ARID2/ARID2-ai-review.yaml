- id: file:human/ARID2/ARID2-notes.md
  title: ARID2 literature and curation notes
  findings: []
core_functions:
- description: Bind DNA and contribute to PBAF-dependent chromatin remodeling and promoter-selective transcriptional
    regulation. ATP hydrolysis is supplied by BRG1 rather than ARID2.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  contributes_to_molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0016586
    label: RSC-type complex
  supported_by:
  - reference_id: PMID:15640446
    supporting_text: Analysis of ARID2 in the DNA pull-down assay (Figure 4) indicates that it binds DNA
      without sequence specificity
    full_text_unavailable: false
  - reference_id: PMID:8895581
    supporting_text: Complexes containing BRG1 can disrupt nucleosomes
    full_text_unavailable: true
  - reference_id: Reactome:R-HSA-9932440
    supporting_text: ARID2 is a core component of the base module of the pBAF complex
  - reference_id: PMID:15985610
    supporting_text: "The selectivity by PBAF requires a novel subunit, BAF200, but not the previously\
      \ \ndescribed PBAF-specificity subunit, BAF180 (Polybromo)."
    full_text_unavailable: true
  - reference_id: file:human/ARID2/ARID2-notes.md
    supporting_text: BAF200 depletion reduces BAF180 abundance and prevents normal IFITM1 induction; IFITM3
      instead depends on BAF250a.
- description: Support RAD51 recruitment and homologous-recombination repair of DNA double-strand breaks.
    The precise contribution of BRG1-containing and BRG1-independent assemblies remains unresolved.
  directly_involved_in:
  - id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:28381560
    supporting_text: 'Baf200 and Rad51 are

      present in the same complex'
    full_text_unavailable: true
  - reference_id: PMID:28381560
    supporting_text: 'Baf200 plays an important function by facilitating homologous

      recombination-dependent processes, such as recruitment of Rad51 (a key component

      of homologous recombination) to DSBs, homology-directed repair, and cell

      survival after DNA damage.'
    full_text_unavailable: true
  - reference_id: file:human/ARID2/ARID2-notes.md
    supporting_text: Efficient RAD51 recruitment to individual homologous-recombination sites nevertheless
      decreases after loss of either ARID2 or BRG1.
  knowledge_gaps:
  - gap_statement: The molecular activity linking ARID2–RAD51 association to productive repair and the
      contributions of distinct ARID2 complexes remain incompletely resolved.
    boundary: Human cell experiments establish a repair recruitment role. Binding and bulk loading persist
      without BRG1, while efficient site-specific recruitment is impaired; these are different measurements.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: NARROWING
    resolution: Separate RAD51-binding interfaces from complex-assembly and ATPase-dependent effects using
      endogenous separation-of-function alleles, site-specific recruitment measurements and repair assays.
    provenance:
    - reference_id: file:human/ARID2/ARID2-notes.md
      supporting_text: The proposed division of labor between distinct complexes remains a hypothesis.
suggested_questions:
- question: Which ARID2-containing assembly recruits RAD51 at each repair stage, and which effects require
    BRG1 catalytic activity rather than its structural presence?
suggested_experiments:
- hypothesis: ARID2 RAD51 recruitment and PBAF assembly can be separated genetically.
  description: Test endogenous ARID2 interface variants with preserved abundance and PBAF assembly, measuring
    RAD51 association, bulk versus site-specific recruitment, and homologous-recombination repair alongside
    BRG1 ATPase controls.
  experiment_type: Separation-of-function genetics and chromatin recruitment assays
