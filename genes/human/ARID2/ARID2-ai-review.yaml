id: Q68CP9
gene_symbol: ARID2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARID2, also called BAF200, is a nuclear DNA-binding subunit that specifies the PBAF branch
  of mammalian SWI/SNF chromatin-remodeling complexes. It supports PBAF assembly and promoter-selective
  transcriptional regulation while contributing to remodeling powered by the BRG1 ATPase. Its ARID region
  binds DNA without an established sequence preference. ARID2 also associates with RAD51 and promotes
  its recruitment during homologous-recombination repair of DNA double-strand breaks. ARID2-containing
  assemblies with and without BRG1 have been recovered, indicating that its repair interactions cannot
  be reduced to a single fixed complex composition.
