- term:
    id: GO:1903020
    label: positive regulation of glycoprotein metabolic process
  evidence_type: IGI
  original_reference_id: PMID:21680502
  qualifier: involved_in
  review:
    summary: >-
      Positive regulation of glycoprotein metabolic process. A metabolic reading of what is
      really a transport observation.
    action: MODIFY
    reason: >-
      The IGI comes from PMID:21680502, where the finding is that RAB1A and RAB1B together
      are needed for herpes simplex virus 1 envelope glycoproteins to move from the ER to
      the assembly compartment, where they undergo glycosylation. RAB1B does not act on the
      glycosylation chemistry; it delivers the substrate to the compartment that performs
      it, so any effect on glycoprotein metabolism is a downstream consequence of
      anterograde transport. GO:0006888 states this directly and is already annotated to the
      gene from the same experiment. Redirected there rather than left as a metabolic claim
      the evidence does not make.
    proposed_replacement_terms:
    - id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    supported_by:
    - reference_id: PMID:21680502
      supporting_text: Rab1 activity is required for anterograde transport of viral envelope proteins to post-ER compartments for virus assembly
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15796781
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from eleven IPI experiments; uninformative, and it is hiding the
      Legionella interaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding says nothing about what the gene
      product does. Several of the partners here are individually informative in ways the
      term erases: RABIF/MSS4 is a nucleotide exchange factor, OCRL is an inositol
      5-phosphatase recruited by Rab1, LRRK2 phosphorylates Rab GTPases in its switch II
      region and RAB1B is not the canonical LRRK2 substrate, and UniProtKB:Q5ZWZ3 is a
      Legionella pneumophila protein - the pathogen effector system that hijacks host Rab1
      by acting as its exchange factor and AMPylating it. A host-pathogen interaction of
      that significance deserves better than a bare binding term.
- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:20458337
  qualifier: located_in
  review:
    summary: >-
      Extracellular exosome, from a single high-throughput proteomics dataset.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RAB1B is a prenylated cytoplasmic-leaflet GTPase of the early secretory pathway with
      no route to the exosome lumen or surface. Detection in an exosome preparation is
      expected for an abundant membrane-trafficking protein and reflects the co-purification
      behaviour of such preparations rather than a functional location. This is one of the
      most frequently over-applied CC terms in the human annotation corpus.
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IDA
  original_reference_id: PMID:20937701
  qualifier: enables
  review:
    summary: >-
      GTP binding, directly demonstrated.
    action: ACCEPT
    reason: >-
      Nucleotide binding is the other half of the switch and is what the P-loop and switch
      regions exist for. Core.
