- term:
    id: GO:0090557
    label: establishment of endothelial intestinal barrier
  evidence_type: IMP
  original_reference_id: PMID:23885123
  qualifier: involved_in
  negated: true
  review:
    summary: >-
      NOT establishment of endothelial intestinal barrier. Two separate problems: the
      supporting evidence cannot be located in the cached full text, and the term names the
      wrong cell layer for the study it cites.
    action: UNDECIDED
    reason: >-
      On the evidence: the cached full text of PMID:23885123 runs to roughly 155 kB and
      mentions Rap2c some ninety times, but contains no occurrence of Rab1 or RAB1B. The
      annotation may rest on a supplementary screen figure not captured in the cache, and
      per project policy an experimental annotation is not overruled on the strength of an
      incomplete cache, so this is left UNDECIDED rather than removed. On the term:
      GO:0090557 is defined as a barrier between endothelial cell layers of the intestine,
      whereas PMID:23885123 is explicitly about intestinal epithelial tight junctions. GO
      has establishment of endothelial barrier, of skin barrier, of blood-brain barrier and
      of Sertoli cell barrier, but no term for the intestinal epithelial barrier, which is
      presumably why an endothelial term was used for an epithelial experiment. A
      replacement is proposed under proposed_new_terms. Resolving the evidence question
      needs the paper's supplementary data.
    supported_by:
    - reference_id: PMID:23885123
      supporting_text: Intestinal barrier function is regulated by epithelial tight junctions
- term:
    id: GO:2000785
    label: regulation of autophagosome assembly
  evidence_type: IMP
  original_reference_id: PMID:20545908
  qualifier: involved_in
  review:
    summary: >-
      Regulation of autophagosome assembly, the accurate rendering of what PMID:20545908
      actually demonstrates.
    action: KEEP_AS_NON_CORE
    reason: >-
      Dominant-negative RAB1B and RAB1B siRNA both impair LC3 puncta formation and LC3-II
      processing, so RAB1B is genuinely required for autophagosome biogenesis. The
      regulation framing is right for a gene that supplies membrane and machinery through
      the secretory pathway rather than acting on the phagophore itself. Non-core: a
      downstream consequence of the ER-to-Golgi function, not a separate activity.
    supported_by:
    - reference_id: PMID:20545908
      supporting_text: We present evidence indicating that the activity of both proteins is required for autophagosome formation.
- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IDA
  original_reference_id: PMID:20545908
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane. RAB1B is a secretory-pathway GTPase acting upstream
      of the phagophore, not a resident of its membrane.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. RAB1B differs from the other
      genes in that triage set. ATG9A, WIPI2, ATG16L1 and ATG12 are phagophore-membrane
      proteins and their assertions move to GO:0061908 or the proposed phagophore membrane
      term. What PMID:20545908 shows for RAB1B is that its activity, and functional ER exit
      sites, are required for autophagosome formation, and that the autophagic and secretory
      pathways intersect before the brefeldin A block - a requirement located upstream, at
      the ER, not a residency on the phagophore bilayer. The site-level term GO:0000407 is
      therefore the appropriate destination rather than a membrane term, and the functional
      claim is already carried by GO:2000785. The second assertion has
      UniProtKB-SubCell:SL-0221 as its only source, so it is also an SL propagation.
    proposed_replacement_terms:
    - id: GO:0000407
      label: phagophore assembly site
    supported_by:
    - reference_id: PMID:20545908
      supporting_text: We present evidence indicating that the activity of both proteins is required for autophagosome formation.
    - reference_id: PMID:20545908
      supporting_text: the autophagic and secretory pathways intersect at a level preceding the brefeldin A blockage
- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IGI
  original_reference_id: PMID:21680502
  qualifier: involved_in
  review:
    summary: >-
      Endoplasmic reticulum to Golgi vesicle-mediated transport. RAB1B's principal
      biological process.
    action: ACCEPT
    reason: >-
      RAB1B is the Rab of the early secretory pathway, governing tethering and fusion of
      COPII carriers at the ERGIC and cis-Golgi. Supported here by an IGI with RAB1A, the
      paralog it acts redundantly with. Core.
    supported_by:
    - reference_id: PMID:21680502
      supporting_text: Rab1 activity is required for anterograde transport of viral envelope proteins to post-ER compartments for virus assembly
- term:
    id: GO:0019068
    label: virion assembly
  evidence_type: IMP
  original_reference_id: PMID:21680502
  qualifier: involved_in
  negated: true
  review:
    summary: >-
      Virion assembly, annotated twice from one paper with opposite polarity - an IMP NOT
      and an IGI positive. Read together they are a correct paralog-redundancy record, not a
      contradiction.
    action: ACCEPT
    reason: >-
      PMID:21680502 treats RAB1A and RAB1B as a redundant pair throughout, writing Rab1a/b,
      and the phenotype appears when the pair is removed. Depleting RAB1B alone gives no
      effect, which is what the IMP NOT|involved_in records; depleting it together with
      RAB1A blocks trafficking of herpes simplex virus 1 glycoproteins from the ER to the
      assembly compartment so that unenveloped particles accumulate, which is what the IGI
      with UniProtKB:P62820 records. This is exactly how GO intends genetic redundancy to be
      captured and it is worth preserving as a model; a curator seeing only one of the two
      would draw the wrong conclusion. Both retained as stated.
    supported_by:
    - reference_id: PMID:21680502
      supporting_text: In the absence of Rab1a/b, the viral glycoproteins are unable to traffic from the endoplasmic reticulum to the assembly compartment, and thus unenveloped particles build up in the cytoplasm.
