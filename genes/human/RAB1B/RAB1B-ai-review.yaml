- term:
    id: GO:0012505
    label: endomembrane system
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Endomembrane system, propagated from about seventy donor genes across plants, fungi,
      flies, worms, Dictyostelium and mammals.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term covers essentially every intracellular membrane compartment, and the donor
      list spans most of the Rab family in most eukaryotic lineages. What it establishes is
      that Rabs act on membranes, which is definitional. Zero discriminating power for this
      gene, which already has four specific compartment membranes annotated.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001292747
        source_label: Rab GTPase superfamily node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Around seventy donor genes across plants, fungi, flies, worms, Dictyostelium and
          mammals, spanning most of the Rab family. The transfer is valid and the term is
          true; it simply says that Rabs act on intracellular membranes, which is
          definitional. Nothing about this gene follows from it that is not already stated by
          its four specific compartment-membrane annotations.
- term:
    id: GO:0043025
    label: neuronal cell body
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Neuronal cell body with an is_active_in qualifier, from a PANTHER node distinct from
      the one used for this gene's other IBAs.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      is_active_in asserts a site where the gene product carries out its molecular function,
      which is a considerably stronger claim than located_in. The objection is to the term
      and qualifier, not to the phylogenetic inference: a neuron-restricted site of action
      for a ubiquitously expressed secretory-pathway Rab is a strong statement, and the
      donors are a divergent fly Rab and rat Rab1a whose cell-body localization reflects
      where the protein was looked for. That RAB1B's IBAs are anchored at three different
      PANTHER nodes is normal - different functions arise at different depths in a family,
      and PAINT anchors each where the curator judged it to have originated - so it is not
      itself evidence against this annotation. What would settle it is direct evidence that
      RAB1B does secretory-pathway work specifically in the neuronal cell body.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: FB:FBgn0035155
        source_label: RabX6 (Drosophila melanogaster)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          RabX6 is a divergent Drosophila Rab, not a Rab1 ortholog, so a neuronal localization
          for it is weak grounds for asserting where human RAB1B is active.
      - source_id: RGD:619736
        source_label: Rab1a (rat)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Rat Rab1a is a genuine ortholog of the RAB1 pair, but a cell-body localization in
          neurons reflects where the protein was looked for rather than a neuron-restricted
          function, and it does not license an is_active_in claim on the human paralog.
      - source_id: PANTHER:PTN001178334
        source_label: PANTHER node anchoring the neuronal cell body assertion
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Anchoring this term at a different node from the gene's other IBAs is expected -
          different functions arise at different depths and PAINT places each where the
          curator judged it to have originated. The concern is the is_active_in qualifier
          rather than the node placement.
