id: Q9H0U4
gene_symbol: RAB1B
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RAB1B is the Rab GTPase of the early secretory pathway. Like all Rabs it is a nucleotide
  switch: prenylated at its C terminus, held in the cytosol by GDI when inactive, delivered to
  membranes and loaded with GTP by an exchange factor, and returned to the GDP state by a
  GTPase-activating protein. In the GTP state it recruits tethering factors that capture
  COPII-derived carriers leaving endoplasmic reticulum exit sites and hold them at the
  ER-Golgi intermediate compartment and cis-Golgi for fusion. Sustaining that flux is what
  keeps the Golgi ribbon compact, and knocking RAB1B down fragments the Golgi. RAB1B is
  largely redundant with its paralog RAB1A, and the genetics reflect this: phenotypes such as
  the block in herpes simplex virus 1 glycoprotein trafficking appear when both are removed
  and not when RAB1B alone is. Because autophagosome formation draws membrane and machinery
  from the early secretory pathway, RAB1B activity and functional ER exit sites are also
  required for autophagosomes to form, a requirement that sits upstream of the phagophore
  rather than on it. RAB1B is a favoured target of intracellular pathogens: Legionella
  pneumophila effectors recruit it to the bacterial vacuole, act as its exchange factor and
  covalently modify it.
