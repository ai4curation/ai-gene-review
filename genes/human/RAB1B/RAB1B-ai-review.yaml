- term:
    id: GO:0007030
    label: Golgi organization
  evidence_type: IMP
  original_reference_id: PMID:26209634
  qualifier: involved_in
  review:
    summary: >-
      Golgi organization, supported by IMP in a systematic Rab knockdown screen.
    action: ACCEPT
    reason: >-
      A genome-wide siRNA screen of human Rabs found that knocking down any one of six
      Golgi-resident Rabs, RAB1B among them, fragments the Golgi, and that re-expression of
      the respective Rab rescues it. Maintaining compact Golgi morphology is a direct
      consequence of sustained ER-to-Golgi flux, so this is core rather than incidental.
