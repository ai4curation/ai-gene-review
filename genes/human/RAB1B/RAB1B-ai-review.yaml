      consequence of sustained ER-to-Golgi flux, so this is core rather than incidental.
    supported_by:
    - reference_id: PMID:26209634
      supporting_text: induced fragmentation of the Golgi in HeLa-S3 cells and that its phenotype was rescued by re-expression of their respective
