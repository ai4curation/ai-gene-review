core_functions:
- description: >-
    Cycles between GTP- and GDP-bound states as the switch that governs the endoplasmic
    reticulum to Golgi step. In the active state it recruits tethering effectors that capture
    COPII carriers leaving ER exit sites and hold them at the ERGIC and cis-Golgi for fusion,
    and sustaining that flux is what maintains compact Golgi morphology.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
