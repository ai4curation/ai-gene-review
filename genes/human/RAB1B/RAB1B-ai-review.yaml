proposed_new_terms:
- proposed_name: establishment of intestinal epithelial barrier
  proposed_definition: >-
    The establishment of a barrier between epithelial cell layers of the intestine, mediated
    by tight junctions, that exerts specific and selective control over paracellular passage
    of water and solutes.
  proposed_parent:
    id: GO:0090557
    label: establishment of endothelial intestinal barrier
  justification: >-
    GOA carries a NOT|involved_in annotation of this gene to GO:0090557, which is defined for
    a barrier between endothelial cell layers of the intestine, citing PMID:23885123 - a study
    of intestinal epithelial tight junctions. GO has establishment of endothelial barrier,
    establishment of skin barrier, establishment of blood-brain barrier and establishment of
    Sertoli cell barrier, but nothing for the intestinal epithelial barrier, which is the most
    studied epithelial barrier there is. The absence forces epithelial results onto an
    endothelial term. The proposed_parent given here is the nearest existing sibling for
    orientation; the correct placement is alongside GO:0090557 under a shared barrier
    parent rather than beneath it.
suggested_questions:
- question: >-
    The GO:0090557 NOT annotation cites PMID:23885123, whose cached full text does not mention
    Rab1 anywhere. Does the supporting evidence sit in supplementary data, and if so which
    figure? A negative annotation is only useful if its basis can be traced.
- question: >-
    RAB1B and RAB1A are functionally redundant, and PMID:21680502 records this correctly with
    a paired IMP NOT and IGI on the same term. How many other RAB1B annotations transferred
    from RAB1A would fail a single-knockdown test, and should redundant paralog pairs be
    annotated as a unit?
- question: >-
    Legionella pneumophila DrrA/SidM acts as a RAB1 exchange factor and AMPylates the switch
    II region. Should host proteins targeted this way carry a molecular function annotation
    reflecting that they are substrates of pathogen effectors, or is that properly the
    pathogen's annotation?
- question: >-
    RAB1B's IBAs are anchored at three PANTHER nodes for different aspects (PTN001292747,
    PTN000634320, PTN001178334), which is the expected PAINT pattern. But the neuronal cell
    body assertion carries is_active_in rather than located_in. Is that qualifier warranted
    for a housekeeping secretory-pathway Rab, and how does PAINT decide between the two when
    the descendant evidence is localization?
suggested_experiments:
- description: >-
    Single versus double knockdown of RAB1A and RAB1B across the phenotypes currently
    annotated to RAB1B alone - Golgi morphology, ER-to-Golgi cargo transport, autophagosome
    formation - to establish which are genuinely RAB1B-specific and which require loss of the
    redundant pair, and so which annotations should carry IGI rather than IMP.
- description: >-
    Live imaging of endogenously tagged RAB1B during starvation-induced autophagy, scoring
    whether it is ever detected on LC3-positive phagophore membranes or only at ER exit sites
    upstream. This directly tests the reading proposed here, that the GO:0034045 annotation
    reflects an upstream requirement rather than residency on the phagophore.
- description: >-
    Immunoprecipitation of RAB1B from intestinal epithelial monolayers with and without JAM-A
    knockdown, together with transepithelial resistance measurement after RAB1B knockdown, to
    resolve whether the negative barrier annotation is supported and to supply evidence for
    the proposed epithelial barrier term.
