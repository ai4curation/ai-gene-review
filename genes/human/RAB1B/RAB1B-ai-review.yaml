- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane. RAB1B is a secretory-pathway GTPase acting upstream
      of the phagophore, not a resident of its membrane.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. RAB1B differs from the other
      genes in that triage set. ATG9A, WIPI2, ATG16L1 and ATG12 are phagophore-membrane
      proteins and their assertions move to GO:0061908 or the proposed phagophore membrane
      term. What PMID:20545908 shows for RAB1B is that its activity, and functional ER exit
      sites, are required for autophagosome formation, and that the autophagic and secretory
      pathways intersect before the brefeldin A block - a requirement located upstream, at
      the ER, not a residency on the phagophore bilayer. The site-level term GO:0000407 is
      therefore the appropriate destination rather than a membrane term, and the functional
      claim is already carried by GO:2000785. The second assertion has
      UniProtKB-SubCell:SL-0221 as its only source, so it is also an SL propagation.
    proposed_replacement_terms:
    - id: GO:0000407
      label: phagophore assembly site
    supported_by:
    - reference_id: PMID:20545908
      supporting_text: We present evidence indicating that the activity of both proteins is required for autophagosome formation.
    - reference_id: PMID:20545908
      supporting_text: the autophagic and secretory pathways intersect at a level preceding the brefeldin A blockage
- term:
    id: GO:0048471
    label: perinuclear region of cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Perinuclear region of cytoplasm, from UniProtKB-SubCell:SL-0198 alone; a restatement
      of Golgi position, not an additional location.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The Golgi ribbon in most cultured mammalian cells sits in the perinuclear region, so a
      Golgi-resident protein will always appear perinuclear. SL-0221 is the only source; no
      experiment on this gene distinguishes a perinuclear pool from the Golgi pool. An
      SL-unique annotation of the kind catalogued in projects/SL.md.
- term:
    id: GO:1903020
    label: positive regulation of glycoprotein metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      Positive regulation of glycoprotein metabolic process. A metabolic reading of what is
      really a transport observation.
    action: MODIFY
    reason: >-
      The IGI comes from PMID:21680502, where the finding is that RAB1A and RAB1B together
      are needed for herpes simplex virus 1 envelope glycoproteins to move from the ER to
      the assembly compartment, where they undergo glycosylation. RAB1B does not act on the
      glycosylation chemistry; it delivers the substrate to the compartment that performs
      it, so any effect on glycoprotein metabolism is a downstream consequence of
      anterograde transport. GO:0006888 states this directly and is already annotated to the
      gene from the same experiment. Redirected there rather than left as a metabolic claim
      the evidence does not make.
    proposed_replacement_terms:
    - id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    supported_by:
    - reference_id: PMID:21680502
      supporting_text: Rab1 activity is required for anterograde transport of viral envelope proteins to post-ER compartments for virus assembly
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21378754
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from eleven IPI experiments; uninformative, and it is hiding the
      Legionella interaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding says nothing about what the gene
      product does. Several of the partners here are individually informative in ways the
      term erases: RABIF/MSS4 is a nucleotide exchange factor, OCRL is an inositol
      5-phosphatase recruited by Rab1, LRRK2 phosphorylates Rab GTPases in its switch II
      region and RAB1B is not the canonical LRRK2 substrate, and UniProtKB:Q5ZWZ3 is a
      Legionella pneumophila protein - the pathogen effector system that hijacks host Rab1
      by acting as its exchange factor and AMPylating it. A host-pathogen interaction of
      that significance deserves better than a bare binding term.
