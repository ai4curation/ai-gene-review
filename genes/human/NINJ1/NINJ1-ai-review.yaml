id: Q92982
gene_symbol: NINJ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Ninjurin-1 is a small, widely expressed plasma-membrane protein of four alpha helices:
  two transmembrane helices (alpha3, alpha4) and two amphipathic helices (alpha1, alpha2) that are
  sequestered in the bilayer in the resting state. It is the executioner of plasma membrane rupture
  (PMR), the terminal, active step of lytic cell death. On a death signal, NINJ1 leaves its autoinhibited
  dimer, exposes the hydrophilic faces of alpha1 and alpha2 and polymerises laterally into branched
  filaments and rings in the plasma membrane; these amphipathic assemblies cap membrane edges and
  release membrane fragments, so the membrane is lost rather than merely perforated. PMR discharges
  damage-associated molecular patterns such as HMGB1 and LDH and thereby amplifies inflammation.
  NINJ1 acts downstream of gasdermins in pyroptosis and of MLKL in necroptosis, after apoptosis,
  during ferroptosis and after osmotic swelling, and it can also rupture membranes of glucose-starved
  macrophages independently of any known cell-death program; how its filaments finish the job - by
  excising membrane disks or by opening very large pores - is still argued. NINJ1 was originally
  characterised as a homophilic cell adhesion molecule induced by nerve injury, adhering through
  a short extracellular N-terminal adhesion motif, and it retains non-lytic activities: it promotes
  monocyte transendothelial migration, angiogenesis, and, together with ninjurin-2, haematopoietic
  stem and progenitor cell amplification via canonical WNT signalling, a function that persists in
  PMR-deficient mutants. A secreted form generated by cleavage has separate chemotactic and anti-inflammatory
  activity. Whether the adhesive and the membrane-destabilising activities are two uses of the same
  amphipathic helices, or genuinely separate functions, is unresolved.'
