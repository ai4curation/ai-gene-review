- term:
    id: GO:0141201
    label: pyroptotic cell death
  evidence_type: IDA
  original_reference_id: PMID:36468682
  qualifier: involved_in
  review:
    summary: NINJ1 carries out the terminal membrane-rupture step of pyroptosis, downstream of gasdermin
      pore formation.
    action: ACCEPT
    reason: 'Best-evidenced of the cell-death contexts in which NINJ1 acts, with four human IDAs
      and the phylogenetic inference. Worth stating plainly that NINJ1 is not pyroptosis-specific:
      it performs the same act after apoptosis, in necroptosis and in ferroptosis, and in glucose-starved
      macrophages it ruptures membranes with no known death program engaged at all. The term is accepted
      as a genuine context of the one core activity, not as evidence of pathway specificity.'
    supported_by:
    - reference_id: PMID:37196676
      supporting_text: Here we describe an anti-NINJ1 monoclonal antibody that specifically targets
        mouse NINJ1 and blocks oligomerization of NINJ1, preventing PMR.
    - reference_id: PMID:42270656
      supporting_text: In glucose-starved macrophages, NINJ1 ruptures membranes independently of
        known cell death programs.
