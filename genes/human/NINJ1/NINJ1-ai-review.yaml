- term:
    id: GO:0019835
    label: cytolysis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: NINJ1 execution of plasma membrane rupture, that is, the loss of membrane integrity
      and release of cytoplasmic contents at the end of lytic cell death.
    action: ACCEPT
    reason: 'The core biological process and the closest term GO currently offers to plasma membrane
      rupture. Directly demonstrated: Ninj1-null macrophages die but fail to release LDH and HMGB1
      and remain as persistent ballooned corpses.'
    supported_by:
    - reference_id: PMID:33472215
      supporting_text: Ninj1-/- macrophages exhibited impaired PMR in response to diverse inducers
        of pyroptotic, necrotic and apoptotic cell death, and were unable to release numerous intracellular
        proteins including HMGB1 (a known DAMP) and LDH (a standard measure of PMR).
- term:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Homophilic trans-interaction between NINJ1 molecules on apposed cell surfaces, mediated
      by a short extracellular N-terminal adhesion motif.
    action: ACCEPT
    reason: 'Retained as a second, genuine core function rather than a historical artefact. The original
      characterisation used cell-aggregation assays and mapped the adhesive determinant to an 11-residue
      extracellular region, and competitive peptides from that region block both aggregation and
      neurite outgrowth; the same motif was later shown to bind endogenous NINJ1 in a pull-down.
      Independent support that NINJ1 has real non-lytic biology comes from PMR-deficient Ninj1 mutants
      that nevertheless retain a haematopoietic function. The caveat, recorded rather than hidden:
      that haematopoietic role was traced to canonical WNT signalling, not to the adhesion motif,
      so the adhesive activity has not yet been tied to a current mechanism, and the same extracellular
      helices serve the rupture activity.'
    supported_by:
    - reference_id: PMID:9261151
      supporting_text: Aggregation assays were used to demonstrate that ninjurin-mediated adhesion
        requires divalent cations and is an energy-dependent process.
    - reference_id: PMID:9261151
      supporting_text: The critical domain for ninjurin-mediated homophilic adhesion was localized
        to an 11-residue region (between Pro26 and Asn37) by mutagenesis and by employing synthetic
        oligopeptides as competitive inhibitors of ninjurin-mediated adhesion.
    - reference_id: PMID:42481508
      supporting_text: Ninj1 deficiency reduced HSPC, neutrophil and erythrocyte numbers, whereas
        PMR-deficient Ninj1 mutants demonstrated that this function is independent of PMR.
- term:
    id: GO:0140912
    label: membrane destabilizing activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'NINJ1 binds the plasma membrane and destroys its integrity: it polymerises into amphipathic
      filaments whose hydrophilic face caps a membrane edge, so membrane material is shed rather
      than merely perforated.'
    action: ACCEPT
    reason: The core molecular function, and the single best-evidenced thing NINJ1 does. Supported
      by six independent IDAs (forward-genetic screen, antibody blockade, two cryo-EM structures,
      reconstitution with recombinant protein) plus the phylogenetic inference. The mechanistic detail
      is still argued - Degen et al. and Dai and colleagues describe filaments that cap or solubilise
      membrane fragments, whereas Sahoo et al. also see less frequent pore-like assemblies - but
      every model is an instance of this term, so the disagreement is about mechanism, not about
      whether the activity exists.
    supported_by:
    - reference_id: PMID:37198476
      supporting_text: Our data thus suggest that, during lytic cell death, the extracellular α-helices
        of NINJ1 insert into the plasma membrane to polymerize NINJ1 monomers into amphipathic filaments
        that rupture the plasma membrane.
    - reference_id: PMID:38614101
      supporting_text: This structural observation suggests that NINJ1 can form membrane disks, consistent
        with membrane fragmentation by recombinant NINJ1.
    - reference_id: PMID:39667936
      supporting_text: This structural feature and other evidence point to a PMR mechanism by which
        NINJ1 filaments wrap around and solubilize membrane fragments and, less frequently, form
        pores in the plasma membrane.
    - reference_id: PMID:33472215
      supporting_text: Mechanistically, NINJ1 used an evolutionarily conserved extracellular domain
        for oligomerization and subsequent PMR.
- term:
    id: GO:0141201
    label: pyroptotic cell death
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: NINJ1 carries out the terminal membrane-rupture step of pyroptosis, downstream of gasdermin
      pore formation.
    action: ACCEPT
    reason: 'Best-evidenced of the cell-death contexts in which NINJ1 acts, with four human IDAs
      and the phylogenetic inference. Worth stating plainly that NINJ1 is not pyroptosis-specific:
      it performs the same act after apoptosis, in necroptosis and in ferroptosis, and in glucose-starved
      macrophages it ruptures membranes with no known death program engaged at all. The term is accepted
      as a genuine context of the one core activity, not as evidence of pathway specificity.'
    supported_by:
    - reference_id: PMID:37196676
      supporting_text: Here we describe an anti-NINJ1 monoclonal antibody that specifically targets
        mouse NINJ1 and blocks oligomerization of NINJ1, preventing PMR.
    - reference_id: PMID:42270656
      supporting_text: In glucose-starved macrophages, NINJ1 ruptures membranes independently of
        known cell death programs.
