  - reference_id: PMID:37198476
    supporting_text: Our data thus suggest that, during lytic cell death, the extracellular α-helices
      of NINJ1 insert into the plasma membrane to polymerize NINJ1 monomers into amphipathic filaments
      that rupture the plasma membrane.
  - reference_id: PMID:38614101
    supporting_text: Therefore, NINJ1-mediated membrane disk formation is different from gasdermin-mediated
      pore formation, resulting in membrane loss and plasma membrane rupture.
  - reference_id: PMID:42270656
    supporting_text: In glucose-starved macrophages, NINJ1 ruptures membranes independently of known
      cell death programs.
- description: NINJ1 mediates homophilic adhesion between apposed cell surfaces through a short extracellular
    N-terminal adhesion motif, the activity for which the protein was originally named. Cell-aggregation
    assays localised the adhesive determinant to an 11-residue extracellular segment, peptides from
    that segment competitively block both aggregation and ninjurin-promoted neurite outgrowth, and
    the same peptide binds endogenous NINJ1. This activity underlies monocyte adhesion to and transmigration
    across endothelium. It is retained as a second core function rather than as history because PMR-deficient
    Ninj1 mutants retain a physiologically important, conserved role in haematopoietic stem and progenitor
    cell amplification, showing that ninjurins do real work outside membrane rupture; that role,
    however, was mapped to canonical WNT signalling and has not been shown to require the adhesion
    motif, so the link between the two remains to be made.
