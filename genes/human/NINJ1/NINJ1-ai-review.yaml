- term:
    id: GO:0007399
    label: nervous system development
  evidence_type: TAS
  original_reference_id: PMID:9261151
  qualifier: involved_in
  review:
    summary: Nervous-system development, from the founding characterisation of ninjurin as a nerve
      injury-induced adhesion molecule that promotes neurite outgrowth from DRG neurons.
    action: KEEP_AS_NON_CORE
    reason: A developmental context in which the adhesion activity is used, not a core function.
      Note that the same paper reports ninjurin is widely expressed in adult and embryonic tissues,
      mostly epithelial, so the neural framing reflects how the gene was found rather than where
      it principally acts.
