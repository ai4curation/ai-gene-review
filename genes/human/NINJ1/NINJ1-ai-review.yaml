- term:
    id: GO:0098631
    label: cell adhesion mediator activity
  evidence_type: IDA
  original_reference_id: PMID:33028854
  qualifier: enables
  review:
    summary: Parent adhesion-mediator term, from the N-NAM peptide study and by orthology from rat
      Ninj1.
    action: MODIFY
    reason: Correct in kind but under-specific. The demonstrated activity is homophilic NINJ1-NINJ1
