- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:26677008
  qualifier: enables
  review:
    summary: Direct binding of biotinylated LPS to NINJ1, mapped to residues 81-100.
    action: KEEP_AS_NON_CORE
    reason: A real pull-down result, but a single-laboratory finding in transfected HEK293T lysates
      that has not been independently reproduced, has no structural counterpart in the several cryo-EM
      structures of NINJ1, and is not part of the rupture mechanism. The residues implicated (81-100)
      lie outside the alpha1/alpha2 amphipathic region that carries the characterised activity. Kept
      because it is experimental, demoted because it is unreplicated and mechanically unconnected
      to the rest of NINJ1 biology.
    supported_by:
    - reference_id: PMID:26677008
      supporting_text: Notably, pull-down assays using lysates from HEK293T cells transfected with
        human or mouse Ninjurin1 and biotinylated LPS (LPS-biotin) showed that LPS directly bound
        Ninjurin1.
- term:
    id: GO:0002232
    label: leukocyte chemotaxis involved in inflammatory response
  evidence_type: IDA
  original_reference_id: PMID:22162058
  qualifier: involved_in
  review:
    summary: NINJ1 blockade abrogates monocyte adhesion to and migration across blood-brain-barrier
      endothelial cells and reduces myeloid infiltration in EAE.
    action: KEEP_AS_NON_CORE
    reason: A well-controlled experimental result, but a tissue- and cell-type-specific consequence
      of the adhesion activity rather than a function NINJ1 protein performs in its own right.
    supported_by:
    - reference_id: PMID:22162058
      supporting_text: Moreover, Ninjurin-1 neutralization specifically abrogated the adhesion and
        migration of human monocytes across BBB-ECs, without affecting lymphocyte recruitment.
- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IDA
  original_reference_id: PMID:33028854
  qualifier: involved_in
  review:
    summary: Homophilic adhesion between cells expressing NINJ1.
    action: ACCEPT
    reason: The biological-process counterpart of the retained cell-cell adhesion mediator activity,
      supported by aggregation assays in the founding work, by the N-NAM peptide study and by the
      phylogenetic inference across the ninjurin family including the Drosophila members.
    supported_by:
    - reference_id: PMID:9261151
      supporting_text: Aggregation assays were used to demonstrate that ninjurin-mediated adhesion
        requires divalent cations and is an energy-dependent process.
- term:
    id: GO:0034113
    label: heterotypic cell-cell adhesion
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: Adhesion between cells of different types, for example monocytes to endothelium, transferred
      from mouse Ninj1.
    action: KEEP_AS_NON_CORE
    reason: Consistent with the demonstrated role of NINJ1 in monocyte transendothelial migration,
      but this human annotation is orthology-based only, and the underlying adhesion is homophilic
      NINJ1-NINJ1 binding between two cell types rather than a distinct heterotypic activity.
- term:
    id: GO:0034145
    label: positive regulation of toll-like receptor 4 signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: Positive regulation of TLR4 signalling, transferred from mouse Ninj1.
    action: KEEP_AS_NON_CORE
    reason: 'Rests on the same single-laboratory LPS-binding study as the lipopolysaccharide binding
      annotation, propagated through the mouse ortholog. Kept for consistency with that annotation
      and demoted for the same reason: unreplicated and unconnected to the structurally characterised
      activity.'
- term:
    id: GO:0042692
    label: muscle cell differentiation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: Muscle cell differentiation, transferred from mouse Ninj1.
    action: KEEP_AS_NON_CORE
    reason: UniProt records the striated-muscle role for NINJ1 only as 'By similarity'; there is
      no direct human evidence and no proposed mechanism. Retained as a low-confidence peripheral
      annotation.
- term:
    id: GO:0045766
    label: positive regulation of angiogenesis
  evidence_type: IDA
  original_reference_id: PMID:33028854
  qualifier: involved_in
  review:
    summary: An N-terminal adhesion-motif peptide that antagonises endogenous NINJ1 promotes endothelial
      proliferation, migration and tube formation, implying that NINJ1 itself restrains these.
    action: KEEP_AS_NON_CORE
    reason: 'Downstream tissue-level physiology, and note the direction of the underlying experiment:
      the pro-angiogenic effect was produced by suppressing endogenous NINJ1 with the N-NAM peptide,
      so ''positive regulation of angiogenesis'' is not the most transparent reading of that result.
      Retained as peripheral rather than corrected, because this is an experimental annotation whose
      full text was read by the curator and the rat orthology transfer agrees with it.'
    supported_by:
    - reference_id: PMID:33028854
      supporting_text: We found that N-NAM promotes proliferation, migration, and tube formation
        of HUVECs and demonstrate that the suppression of endogenous Ninj1 is responsible for the
        N-NAM-mediated pro-angiogenic effects.
- term:
    id: GO:0050729
    label: positive regulation of inflammatory response
  evidence_type: IDA
  original_reference_id: PMID:26677008
  qualifier: involved_in
  review:
    summary: NINJ1 amplifies inflammation, both by releasing DAMPs when it ruptures the membrane
      and, per the LPS study, by supporting LPS-driven nitric oxide and TNF-alpha output.
    action: ACCEPT
    reason: 'Core downstream process: the biological point of NINJ1-mediated rupture is that it converts
      a dying cell into a source of pro-inflammatory DAMPs, which is why NINJ1 blockade is anti-inflammatory
      in liver injury models.'
    supported_by:
    - reference_id: PMID:37196676
      supporting_text: Accordingly, serum levels of lactate dehydrogenase, the liver enzymes alanine
        aminotransaminase and aspartate aminotransferase, and the DAMPs interleukin 18 and HMGB1
        were reduced.
