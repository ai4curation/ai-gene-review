- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:37198476
  qualifier: is_active_in
  review:
    summary: NINJ1 is a multi-pass integral protein of the plasma membrane, and this is where it
      oligomerises and ruptures the bilayer.
    action: ACCEPT
    reason: Core location, established by cryo-EM and super-resolution imaging of NINJ1 assemblies
      in the membranes of dying cells and consistent across the IBA, the UniProt mapping and four
      independent IDAs.
    supported_by:
    - reference_id: PMID:37198476
      supporting_text: Super-resolution microscopy reveals that NINJ1 clusters into structurally
        diverse assemblies in the membranes of dying cells, in particular large, filamentous assemblies
        with branched morphology.
- term:
    id: GO:0051260
    label: protein homooligomerization
  evidence_type: IDA
  original_reference_id: PMID:37196676
  qualifier: involved_in
  review:
    summary: Activation converts NINJ1 from an autoinhibited dimer into long branched filaments and
      rings in the plasma membrane; this self-association is the activation step itself.
    action: ACCEPT
    reason: Core. Two cryo-EM structures resolve the filament, an antibody that blocks oligomerisation
      blocks rupture, and glycine - the classical cytoprotectant - acts by preventing NINJ1 clustering.
      Oligomerisation and membrane destabilisation are not separable events for this protein.
    supported_by:
    - reference_id: PMID:36468682
      supporting_text: Next, we show that glycine prevents NINJ1 clustering by either direct or indirect
        mechanisms.
    - reference_id: PMID:37198476
      supporting_text: A cryo-electron microscopy structure of NINJ1 filaments shows a tightly packed
        fence-like array of transmembrane α-helices.
