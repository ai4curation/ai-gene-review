- term:
    id: GO:0045766
    label: positive regulation of angiogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: An N-terminal adhesion-motif peptide that antagonises endogenous NINJ1 promotes endothelial
      proliferation, migration and tube formation, implying that NINJ1 itself restrains these.
    action: KEEP_AS_NON_CORE
    reason: 'Downstream tissue-level physiology, and note the direction of the underlying experiment:
      the pro-angiogenic effect was produced by suppressing endogenous NINJ1 with the N-NAM peptide,
      so ''positive regulation of angiogenesis'' is not the most transparent reading of that result.
      Retained as peripheral rather than corrected, because this is an experimental annotation whose
      full text was read by the curator and the rat orthology transfer agrees with it.'
    supported_by:
    - reference_id: PMID:33028854
      supporting_text: We found that N-NAM promotes proliferation, migration, and tube formation
        of HUVECs and demonstrate that the suppression of endogenous Ninj1 is responsible for the
        N-NAM-mediated pro-angiogenic effects.
- term:
    id: GO:0098631
    label: cell adhesion mediator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: Parent adhesion-mediator term, from the N-NAM peptide study and by orthology from rat
