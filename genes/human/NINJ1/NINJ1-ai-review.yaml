- term:
    id: GO:0097707
    label: ferroptosis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: NINJ1 requirement for the rupture step of ferroptosis, transferred from mouse Ninj1.
    action: ACCEPT
    reason: The orthology transfer rests on a well-controlled study showing that NINJ1 oligomerises
      during ferroptosis and that Ninj1 deficiency protects against ferroptosis-associated rupture
      while leaving lipid peroxidation, calcium influx and swelling intact - that is, NINJ1 acts
      at the same terminal step here as elsewhere, not in ferroptosis initiation.
    supported_by:
    - reference_id: PMID:38396301
      supporting_text: We report that NINJ1 oligomerizes during ferroptosis, and that Ninj1-deficiency
        protects macrophages and fibroblasts from ferroptosis-associated PMR.
    - reference_id: PMID:38396301
      supporting_text: Mechanistically, we find that NINJ1 is dispensable for the initial steps of
        ferroptosis, such as lipid peroxidation, channel-mediated calcium influx, and cell swelling.
