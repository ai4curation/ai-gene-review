- id: PMID:28375145
  title: Crystal structures of human 3-hydroxyanthranilate 3,4-dioxygenase with native and
    non-native metals bound in the active site.
  findings:
  - statement: Human 3HAO is a non-heme iron extradiol ring-cleaving dioxygenase; crystal structures
      show native iron bound in the active site.
    reference_section_type: ABSTRACT
    supporting_text: 3HAO is a non-heme iron-containing, ring-cleaving extradiol dioxygenase that
      catalyzes the addition of both atoms of O2 to the kynurenine pathway metabolite
      3-hydroxyanthranilic acid (3-HANA) to form quinolinic acid (QUIN).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifier/title verified. Original human structural and biophysical sections were inspected via
      PMC8493610. The crystal contains oxidized Fe(III); anaerobic Fe(II) loading and catalytic-cofactor
      interpretation are distinguished from this crystal state. Bacterial mechanism descriptions are identified
      as such.
- id: PMID:28792876
  title: NAD Deficiency, Congenital Malformations, and Niacin Supplementation.
  findings:
  - statement: Biallelic loss-of-function variants in HAAO (and KYNU) reduce enzyme activity, cause
      systemic NAD deficiency, and produce a congenital malformation syndrome; niacin
      supplementation prevents defects in mice.
    reference_section_type: ABSTRACT
    supporting_text: Variants were identified in two genes that encode enzymes of the kynurenine
      pathway, 3-hydroxyanthranilic acid 3,4-dioxygenase (HAAO) and kynureninase (KYNU).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifier/title and abstract verified; original indexed results corroborate human variant assays
      and NAD deficiency. Mouse niacin rescue is kept separate from human disease evidence.
- id: PMID:2967497
  title: 3-Hydroxyanthranilate oxygenase activity is increased in the brains of Huntington disease
    victims.
  findings:
  - statement: 3-hydroxyanthranilate oxygenase activity is detectable in human brain and is
      increased in the striatum of Huntington disease brains.
    reference_section_type: ABSTRACT
    supporting_text: The activity of 3-hydroxyanthranilate oxygenase is increased in Huntington
      disease brains as compared to control brains.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Identifier/title and abstract verified. The reported human postmortem association is retained as
      a finding. Full causal evidence for neuronal homeostasis was not accessible, so that annotation
      remains UNDECIDED.
