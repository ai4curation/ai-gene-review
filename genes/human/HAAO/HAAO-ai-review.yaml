- id: PMID:12007609
  title: 'Cloning of human 3-hydroxyanthranilic acid dioxygenase in Escherichia coli: characterisation
    of the purified enzyme and its in vitro inhibition by Zn2+.'
  findings:
  - statement: >-
      Recombinant human HAAO catalyzes the reaction leading to quinolinate, requires Fe(II), and is inhibited
      by Zn2+ in vitro.
    reference_section_type: ABSTRACT
    supporting_text: The recombinant human protein, obtained in E. coli, retains its enzymatic
      activity which can occur only in the presence of Fe(II)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifier/title and abstract verified. Supports recombinant human enzyme activity, Fe(II) dependence
      and Zn inhibition. Full original methods were not accessible; the abstract does not name the second
      inhibitory metal or establish a cellular zinc/cadmium response.
