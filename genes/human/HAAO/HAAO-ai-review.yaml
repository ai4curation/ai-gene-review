id: P46952
gene_symbol: HAAO
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HAAO is a cytosolic, non-heme Fe(II)-dependent dioxygenase that opens the ring of 3-hydroxyanthranilate
  to form 2-amino-3-carboxymuconate semialdehyde (ACMS). Its monomeric bicupin structure coordinates catalytic
  iron through two histidines and a glutamate. ACMS can spontaneously cyclize to quinolinate, supplying
  a precursor for NAD+ synthesis through the kynurenine pathway of tryptophan degradation. ACMSD can divert
  this intermediate by decarboxylation. Biallelic loss-of-function HAAO variants impair NAD+ synthesis
  and cause congenital malformations.
