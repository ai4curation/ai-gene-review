core_functions:
- description: Lumenal lysosomal exoglycosidase that hydrolyses terminal alpha-L-fucose
    residues, including the alpha1,6-linked core fucose of N-glycans, from glycoproteins,
    glycolipids and oligosaccharides; core defucosylation enables AGA to complete
    N-glycoprotein degradation.
