suggested_experiments:
- description: Lysosomal glycomics of FUCA1-null human iPSC-derived neurons with and
    without FUCA2 knockdown.
  experiment_type: glycomics
  hypothesis: FUCA2 contributes residual lysosomal fucosidase activity that limits
    glycoasparagine storage.
