core_functions:
- description: Lysosomal alpha-L-fucosidase removes terminal fucose from glycoconjugates, contributing
    directly to glycoprotein-derived glycan and glycolipid breakdown. Human enzyme and cell studies support
    this catalytic role; mouse knockout storage studies independently support the conserved core-defucosylation
    pathway.
  molecular_function:
    id: GO:0004560
    label: alpha-L-fucosidase activity
  directly_involved_in:
  - id: GO:0006516
    label: glycoprotein catabolic process
  - id: GO:0019377
    label: glycolipid catabolic process
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:27491075
    supporting_text: Homozygous knockout mice completely lack α-L-fucosidase activity in all tested organs
      leading to highly elevated amounts of the core-fucosylated glycoasparagine Fuc(α1,6)-GlcNAc(β1-N)-Asn
  - reference_id: PMID:27491075
    supporting_text: It is known that α1,6-(core)-fucosylation sterically inhibits the lysosomal aspartyl-glucosaminidase
      (AGA; EC 3.5.1.26)
  - reference_id: PMID:39796208
    supporting_text: This enzyme is responsible for breaking down fucose-containing glycoproteins, glycolipids,
      and oligosaccharides within the lysosome
  - reference_id: PMID:4074382
    supporting_text: Studies on fibroblasts from patients with less than 5% of normal alpha-L-fucosidase
      activity (fucosidosis) showed 8 of 11 patients synthesized no detectable alpha-fucosidase protein
  - reference_id: PMID:19666478
  - reference_id: PMID:9741689
  - reference_id: Reactome:R-HSA-5693807
suggested_questions:
- question: How much do the extracellular and neutrophil-granule pools contribute to physiological substrate
    turnover compared with lysosomal FUCA1?
- question: How is extracellular FUCA1 partitioned between soluble enzyme and vesicle-associated pools,
    and which cellular sources contribute to its detection in urinary vesicle preparations?
suggested_experiments:
- description: Lysosomal glycomics of FUCA1-null human iPSC-derived neurons with and without FUCA2 knockdown.
  experiment_type: glycomics
  hypothesis: FUCA2 contributes residual lysosomal fucosidase activity that limits glycoasparagine storage.
