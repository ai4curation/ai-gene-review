    approved_review: &id066
      action: ACCEPT
      summary: Retain inherited alpha-L-fucosidase catalysis.
      reason: The actual PTHR10030 IBD is at AN0/PTN000003123, on the exact human AN252/PTN002467369 lineage.
        It is not restricted to a guessed metazoan node. Human FUCA1 is a legitimate experimental descendant
        source; the off-lineage fly NOT/IRD does not assert human loss. Human recombinant enzyme and patient
        fibroblast evidence independently support this core activity.
      supported_by:
      - &id091
        reference_id: PMID:27491075
        supporting_text: Homozygous knockout mice completely lack α-L-fucosidase activity in all tested
          organs leading to highly elevated amounts of the core-fucosylated glycoasparagine Fuc(α1,6)-GlcNAc(β1-N)-Asn
      - &id092
        reference_id: PMID:4074382
        supporting_text: Studies on fibroblasts from patients with less than 5% of normal alpha-L-fucosidase
          activity (fucosidosis) showed 8 of 11 patients synthesized no detectable alpha-fucosidase protein
      - reference_id: GO_REF:0000033
      - reference_id: PMID:19666478
