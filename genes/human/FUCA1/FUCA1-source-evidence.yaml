historical_selected_reading:
  status: PRIVATE_ROOT_SELECTED_SOURCE_READING_AND_PROVISIONAL_DIRECTIONS
  time: '2026-11-01T02:29:43.033210+00:00'
  source_reads:
  - reference: PMID:19666478
    scope: Cached full text read, especially Results alpha-L-fucosidase secretion and Methods description;
      title/identity independently confirmed by PubMed XML.
    finding: The paper explicitly prepared and characterized human FUCA1 alongside FUCA2, comparing handling
      of C6-modified fucose substrates/inhibitors. Human FUCA1 enzymatic evidence is real. The infection,
      coculture secretion, adhesion and Lewis-x experiments concern FUCA2 and do not establish those roles
      for FUCA1.
    limits: Supplementary Table S1/Fig S6 numerical kinetic data not yet inspected; no invented constants
      or infection function.
  - reference: PMID:4074382
    scope: Complete cached and independently retrieved PubMed abstract.
    finding: Human fibroblast pulse-chase and immunoprecipitation distinguish active53-kDa precursor and
      mature50-kDa fucosidase. Patient fibroblasts with low activity show absent protein or impaired processing.
      Supports human catalytic identity without asserting a cytosolic enzyme.
    limits: Abstract-only. Do not invent full-text localization experiments.
  - reference: PMID:1873910
    scope: Complete cached and independently retrieved PubMed abstract.
    finding: Human lymphoid culture pulse-chase documents partial secretion in controls and hypersecretion
      of catalytically inefficient patient material. Supports a secondary extracellular pool.
    limits: Culture-specific secretion does not establish extracellular primary physiological activity
      or a separate natural isoform.
  - reference: PMID:9741689
    scope: PubMed abstract and original publisher indexed Results on pure enzyme conversion and normal/mutant
      fibroblast glycolipid turnover.
    finding: Lysosomal degradation of radiolabeled blood-group A glycolipid was measured in human fibroblasts.
      Purified alpha-L-fucosidase poorly attacked intact branched A-6-2 but converted the isolated pentaglycosylceramide
      intermediate into the next product; fucosidosis cells accumulated the expected intermediate.
    limits: Selected publisher text read, not every figure/assay. Supports glycolipid catabolism without
      claiming indiscriminate cleavage of intact branched substrates.
  - reference: PMID:27491075
    scope: Cached abstract plus selected full-text Results on knockout validation/storage, Discussion
      and storage-analysis Methods; initial full output was truncated, so no whole-paper reading claim.
    finding: 'This is a mouse knockout study: absence of assayed tissue/lysosomal fucosidase and core-fucosylated
      glycoasparagine accumulation. Discussion cites prior work for inhibition of AGA by core fucose.
      It supports conserved lysosomal glycan degradation and the disease mechanism, but is not a direct
      human IMP experiment.'
    limits: The inherited NEW row uses human target with mouse IMP support; a later decision must address
      that evidence/scope. It cannot simply inherit an unqualified human experimental claim. Fuca2 upregulation
      did not restore activity in these mice; do not present compensation as established.
  - reference: PMID:11698403
    scope: Complete cached and independent PubMed abstract.
    finding: Drosophila genomic survey identifies fucose-metabolism enzymes and compares mammalian pathways.
      The human FUCA1 catalytic term is independently correct; the abstract supplies no direct human biochemical
      assay.
    limits: Do not infer absence of human discussion from title alone; no full-text inspection yet.
  - reference: PMID:32296183
    scope: Original cached human interactome Results/Methods context plus eleven exact source-qualified
      IntAct MITAB records.
    finding: 'All three annotated human partners have positive two-hybrid evidence with FUCA1 construct6–466:
      CIB1 three records, MED10 three, UBQLN2 five. Pool/array and validated-two-hybrid records retain
      negative=false. These establish assay interactions, not endogenous full-length lysosomal complexes.'
    limits: No individual orthogonal MAPPIT/GPCA validation claimed. Curated record identities/construct
      fields are exact; cohort-level validation is separate.
  - reference: PMID:19056867
    scope: Retained original PMC HTML table1 text and headers, reused without downloading duplicate paper.
    finding: FUCA1 appears in urinary-exosome Table1 with Pep1 and ID1. Preserving HDA as non-core is
      supported; the original QuickGO urine extension must remain explicit.
    limits: Table text inspected, not image pixels; single-peptide proteomic identification is not evidence
      of an exosome-specific catalytic role.
  - reference: Reactome:R-HSA-5693807
    scope: Current original event→catalyst5693808→FUCA1tetramer5693805 plus cached summary.
    finding: Reaction explicitly assigns alpha-L-fucosidase catalysis to lysosomal FUCA1 tetramer, hydrolysing
      fucosylated N-glycoprotein substrate to N-glycoprotein and free fucose.
    limits: Still verify exact complex protein reference/member on next targeted query; cache itself remains
      unchanged.
  - reference: Reactome:R-HSA-6798751
    scope: Current original event→inputset6798742/outputset6806184.
    finding: Both sets contain separate FUCA1 entities, residues32–466, in azurophil granule lumen and
      extracellular region respectively. This models transported cargo; it does not establish FUCA1 as
      machinery executing exocytosis.
    limits: TAS model evidence, not a gene-specific localization experiment in the cached narrative.
  - reference: GO original terms/ancestry
    scope: Official term definitions and is_a/part_of ancestors retained.
    finding: Lysosomal lumen is part_of lysosome; combined ancestry includes cytoplasm. Glycoprotein catabolism,
      glycoside catabolism and glycolipid catabolism are distinct here; none of these three is an ancestor
      of another. Glycoprotein catabolism has a protein-catabolic parent, but its definition includes
      glycan-bearing proteins.
    limits: Combined ancestry is not an is_a-only edge claim. No redundancy rejection from a presumed
      unverified edge.
  - reference: GO comparator query
    scope: Current exact-term query for MAN2B1O00754/GLB1P16278/NEU1Q99519, five results total.
    finding: Same-role lysosomal hydrolases MAN2B1 and GLB1 have GO0006516, including experimental evidence;
      NEU1 has no exact row in this query. There is no systematic convention excluding glycan-removing
      hydrolases from this process.
    limits: Comparator conventions do not substitute for FUCA1-specific evidence; this supports continued
      evaluation of the inherited authored row, not a final NEW decision.
