current_authored_annotations:
- stored_index: 25
  annotation:
    term:
      id: GO:0006516
      label: glycoprotein catabolic process
    evidence_type: IC
    original_reference_id: PMID:19666478
    supporting_entities:
    - GO:0004560
    - GO:0043202
    review:
      action: NEW
      summary: Infer participation in lysosomal glycoprotein catabolism from human fucosidase catalysis
        and its established substrate context.
      reason: This is an authored IC inference from alpha-L-fucosidase activity (GO:0004560) in the lysosomal
        lumen (GO:0043202). PMID:19666478 explicitly characterizes human FUCA1 enzymatic activity; the
        human Reactome:R-HSA-5693807 reaction identifies FUCA1 as the catalyst removing fucose from an
        N-glycoprotein substrate. FUCA1 itself performs the hydrolytic step, rather than being cargo or
        merely required for another enzyme to act. Human patient fibroblast activity/processing evidence
        in PMID:4074382 supports the enzyme identity. The source combination supports process participation
        but is not presented as a direct human glycoprotein-turnover IMP assay; the mouse storage experiments
        in PMID:27491075 are separate corroboration. The official term includes breakdown of glycan-bearing
        proteins and has a protein-catabolic parent. Same-role human lysosomal hydrolases MAN2B1 and GLB1
        carry the term, including an IC MAN2B1 annotation inferred from its glycosidase activity. Retained
        ontology ancestry shows that this term is neither an ancestor nor a descendant of the existing
        fucose, glycoside or glycolipid process terms; the broad carbohydrate-metabolism row is independently
        TOO_GENERAL. No local GO-CAM index entry for FUCA1 was found. The earlier human IMP row based
        on a mouse study remains retired in the inherited archive; this separately attributed IC proposal
        does not revive that evidence claim.
      supported_by:
      - reference_id: PMID:19666478
      - reference_id: Reactome:R-HSA-5693807
      - reference_id: PMID:4074382
      - reference_id: PMID:27491075
