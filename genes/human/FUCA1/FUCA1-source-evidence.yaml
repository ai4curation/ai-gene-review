status: GENUINE_NATIVE_RECONCILIATION_AND_APPROVED_FUCA1_REVIEW
inherited_review:
  id: P04066
  gene_symbol: FUCA1
  product_type: PROTEIN
  status: COMPLETE
  taxon:
    id: NCBITaxon:9606
    label: Homo sapiens
  description: FUCA1 encodes tissue alpha-L-fucosidase (EC 3.2.1.51), a glycoside hydrolase family 29
    exoglycosidase that acts as a soluble acid hydrolase in the lysosomal lumen. It removes terminal alpha-L-fucose
    residues from the glycan chains of glycoproteins, glycolipids and free oligosaccharides, including
    the alpha1,6-linked core fucose on the asparagine-proximal N-acetylglucosamine of N-glycans. Removal
    of core fucose is a prerequisite for the final step of lysosomal N-glycoprotein degradation, because
    core fucosylation blocks cleavage of the GlcNAc-Asn bond by aspartylglucosaminidase (AGA). A fraction
    of the enzyme is secreted, and it is also stored in neutrophil azurophil granules. Biallelic loss
    of FUCA1 causes fucosidosis, a progressive neurodegenerative glycoproteinosis with lysosomal storage
    and urinary excretion of fucose-rich oligosaccharides and glycoasparagines.
