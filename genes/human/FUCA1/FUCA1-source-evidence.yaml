native_seed:
  yaml_text: "id: P04066\ngene_symbol: FUCA1\nproduct_type: PROTEIN\nstatus: COMPLETE\ntaxon:\n  id: NCBITaxon:9606\n\
    \  label: Homo sapiens\ndescription: FUCA1 encodes tissue alpha-L-fucosidase (EC 3.2.1.51), a glycoside\
    \ hydrolase\n  family 29 exoglycosidase that acts as a soluble acid hydrolase in the lysosomal\n \
    \ lumen. It removes terminal alpha-L-fucose residues from the glycan chains of glycoproteins,\n  glycolipids\
    \ and free oligosaccharides, including the alpha1,6-linked core fucose\n  on the asparagine-proximal\
    \ N-acetylglucosamine of N-glycans. Removal of core fucose\n  is a prerequisite for the final step\
    \ of lysosomal N-glycoprotein degradation, because\n  core fucosylation blocks cleavage of the GlcNAc-Asn\
    \ bond by aspartylglucosaminidase\n  (AGA). A fraction of the enzyme is secreted, and it is also stored\
    \ in neutrophil\n  azurophil granules. Biallelic loss of FUCA1 causes fucosidosis, a progressive neurodegenerative\n\
    \  glycoproteinosis with lysosomal storage and urinary excretion of fucose-rich oligosaccharides\n\
    \  and glycoasparagines.\nexisting_annotations:\n- term:\n    id: GO:0004560\n    label: alpha-L-fucosidase\
    \ activity\n  evidence_type: IBA\n  original_reference_id: GO_REF:0000033\n  qualifier: enables\n\
    \  supporting_entities:\n  - AGI_LocusCode:AT2G28100\n  - FB:FBgn0285958\n  - PANTHER:PTN000003123\n\
    \  - UniProtKB:P04066\n  - UniProtKB:Q2KIM0\n  - UniProtKB:Q9BTY2\n  - dictyBase:DDB_G0274391\n  review:\n\
    \    summary: Phylogenetic inference of alpha-L-fucosidase activity for the GH29 metazoan\n      tissue\
    \ fucosidase clade; consistent with the experimentally established activity\n      of human FUCA1.\n\
    \    action: ACCEPT\n    reason: Core catalytic activity, confirmed by loss of all alpha-L-fucosidase\
    \ activity\n      in Fuca1-null mice and by fucosidosis patient cells.\n    supported_by:\n    - &id001\n\
    \      reference_id: PMID:27491075\n      supporting_text: Homozygous knockout mice completely lack\
    \ α-L-fucosidase activity\n        in all tested organs leading to highly elevated amounts of the\
