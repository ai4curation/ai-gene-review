id: P51124
gene_symbol: GZMM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Granzyme M, also called Met-ase, is a serine protease stored in the granules of natural killer cells
  and other large granular lymphocytes, where it is expressed constitutively rather than on activation.
  Its specificity is the feature it is named for: it is chymotrypsin-like in fold but cuts after
  methionine, leucine or norleucine, a preference shared with no other human granzyme. Delivered into a
  target cell with perforin, it attacks two classes of substrate. One is the cytoskeleton: it cleaves
  the actin-membrane linker ezrin and alpha-tubulin, disturbing tubulin polymerisation and
  disorganising the microtubule network, and it does so without needing caspases. The other releases
  the cell's brake on apoptosis: it truncates survivin at Leu-138, which destabilises the survivin-XIAP
  complex, leads to XIAP degradation and amplifies activation of caspase-9 and caspase-3, so the death
  it causes is caspase-dependent even though its own proteolysis is not. Nucleophosmin is a third
  substrate. Inside the killer cell the protease is restrained by SERPINB4, which forms a covalent
  complex with it and is itself cleaved after a leucine; tumour cells that express SERPINB4 highly,
  such as squamous cell carcinomas, resist granzyme M-induced death.
