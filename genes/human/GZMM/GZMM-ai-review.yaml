    action: ACCEPT
    reason: >-
      Accepted, and granzyme M is the one granzyme in this batch where apoptotic process is the right
      word rather than a loose one. Its death route is established as caspase-dependent: cleaving
      survivin at Leu-138 destabilises the survivin-XIAP complex, XIAP is then degraded, and caspase-9
