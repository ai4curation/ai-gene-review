core_functions:
- molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  description: >-
    A Met-ase: chymotrypsin-like in fold but cutting after methionine, leucine or norleucine, a
    specificity no other human granzyme has and the one the protein is named for. Two uses of it are
    established, and they are different in kind. Against the cytoskeleton the activity is destructive
    and self-sufficient - ezrin and alpha-tubulin are cleaved directly, tubulin polymerisation is
    disturbed and the microtubule network disorganises, with no requirement for caspases or other
    cysteine proteases. Against the apoptotic machinery it is permissive rather than executing: the
    protease removes four residues from survivin, and everything after that is done by other proteins,
    so granzyme M causes caspase-dependent death without cleaving a caspase. That split is why this
    record carries proteolysis and the granzyme pathway term as core while protein maturation is kept
    only as a non-core clade inheritance.
  directly_involved_in:
  - id: GO:0140507
    label: granzyme-mediated programmed cell death signaling pathway
  - id: GO:0006915
    label: apoptotic process
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0044194
    label: cytolytic granule
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id001
  - *id007
  - *id008
  knowledge_gaps:
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      Whether the cytoskeletal and the survivin-XIAP arms are both needed for granzyme M to kill, or
      whether either alone suffices, is not established. The two were shown in separate studies with
      separate readouts, and the kinetics differ - alpha-tubulin is cleaved more efficiently than ezrin
      - so the order in which they matter during real NK killing is open.
    dark_aspect: BP_DARK
