- term:
    id: GO:0140507
    label: granzyme-mediated programmed cell death signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:20406824
  qualifier: involved_in
  review:
    summary: >-
      Proposed annotation for the term that names what a granzyme does in a dying cell, which this
      record lacks while every other reviewed granzyme carries it.
    action: NEW
    reason: >-
      Granzyme M performs the step itself, which is the test a proposed process term has to pass: it
      cleaves survivin at a sequenced site, and the consequences - loss of the survivin-XIAP complex,
      XIAP degradation, caspase-9 and caspase-3 activation - follow from that cleavage. The comparator
      check supports proposing rather than reading the absence as a convention, and it has a working
      positive control: among the granule effectors this project has reviewed, granzyme A, granzyme B
      and perforin all carry GO:0140507 in their own GOA files and granzyme K carries it by IBA, so the
      term is the normal one for this role and the query can return a positive. Granzyme M and granzyme
      H are the two that lack it, and both are the less-studied granzymes rather than exceptions in
      kind. Note this is a different repair from the one made on granzyme H, where the existing
      apoptotic-process rows were re-levelled onto this term instead; here apoptotic process is
      correct and kept, so the pathway term is added beside it rather than in place of it. The two
      terms do not entail each other - GO:0140507 sits under programmed cell death and signaling, not
      under apoptotic process - so this is added coverage rather than redundancy.
    supported_by:
    - *id008
    - *id005
    - *id006
