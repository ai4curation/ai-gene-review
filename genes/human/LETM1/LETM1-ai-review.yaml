core_functions:
- description: >-
    Electroneutral mitochondrial K+/H+ exchanger of the inner membrane: extrudes matrix K+
    in exchange for H+, controlling mitochondrial osmotic volume, matrix K+ content and the
    pH gradient, and thereby preventing matrix swelling.
  molecular_function:
    id: GO:0015386
    label: potassium:proton antiporter activity
  directly_involved_in:
  - id: GO:0140141
    label: mitochondrial potassium ion transmembrane transport
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:36055214
    supporting_text: >-
      bi-allelic LETM1 variants are associated with defective mitochondrial K+ efflux, swollen
      mitochondrial matrix structures
  - reference_id: PMID:36321428
    supporting_text: >-
      Originally identified as the mitochondrial K+ /H+ exchanger, LETM1 was also considered
      as a candidate for the mitochondrial CHE.
- description: >-
    Organisation of the mitochondrial inner membrane: LETM1 oligomeric complexes maintain
    cristae structure and tubular mitochondrial morphology, and purified LETM1 deforms membranes
    into invaginations in vitro.
  directly_involved_in:
  - id: GO:0007007
    label: inner mitochondrial membrane organization
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:32139798
    supporting_text: >-
      the LETM1 protein changes the shapes of the membranes of in vitro-reconstituted proteoliposomes,
      leading to the formation of invaginated membrane structures on artificial liposomes
  - reference_id: PMID:18628306
    supporting_text: >-
      LETM1 downregulation caused mitochondrial swelling and cristae disorganization
suggested_questions:
- question: >-
    Does LETM1 itself carry K+ and H+, or does it act as a regulatory subunit of a K+/H+ exchange
    complex that includes TMBIM5 or other partners?
- question: >-
    Is the Ca2+/H+ antiport measured with reconstituted LETM1 physiologically relevant in
    any cell type, or is it a property of the purified protein that is superseded in vivo
    by TMBIM5?
- question: >-
    Does the matrix EF-hand of LETM1 bind Ca2+ at physiological matrix concentrations, and
    does Ca2+ binding regulate K+/H+ exchange?
suggested_experiments:
- description: >-
    Reconstitute purified human LETM1, alone and with TMBIM5, in proteoliposomes and measure
    K+/H+ and Ca2+/H+ exchange side by side with ion-selective fluorophores, to define its
    intrinsic substrate selectivity.
- description: >-
    Measure Ca2+ binding by the isolated LETM1 matrix domain (isothermal titration calorimetry)
    and test whether EF-hand mutants alter K+/H+ exchange in LETM1-null cells.
