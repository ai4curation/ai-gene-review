id: O95202
gene_symbol: LETM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LETM1 (leucine zipper-EF-hand-containing transmembrane protein 1) is a nuclear-encoded mitochondrial
  inner-membrane protein with a single transmembrane segment and a large matrix-exposed C-terminal
  region containing a LETM (ribosome-binding type) domain, coiled-coils and an EF-hand motif.
  It assembles into high-molecular-weight homo-oligomeric complexes whose assembly depends
  on BCS1L, and it interacts with the Ca2+/H+ exchanger TMBIM5. LETM1 is the principal mediator
  of electroneutral K+/H+ exchange across the inner membrane, extruding matrix K+ in exchange
  for protons and thereby controlling mitochondrial osmotic volume, matrix ion composition
  and the pH component of the proton-motive force. Loss of LETM1 causes matrix swelling, cristae
  disorganisation, fragmentation of the mitochondrial network and defective assembly of respiratory-chain
  complexes, and LETM1 can deform membranes in reconstituted proteoliposomes. A role as an
  electroneutral Ca2+/H+ antiporter was proposed from RNAi and liposome reconstitution studies,
  but subsequent work indicates that TMBIM5, not LETM1, is the physiological mitochondrial
  Ca2+/H+ exchanger and that LETM1 levels do not set Ca2+ extrusion rates; LETM1 nevertheless
  influences mitochondrial Ca2+ homeostasis. Haploinsufficiency of LETM1 has been implicated
  in features of Wolf-Hirschhorn syndrome, and biallelic variants cause a childhood-onset
  mitochondrial neurodegenerative disorder with defective mitochondrial K+ efflux and respiratory-chain
  deficiency.
