      cell-based studies dispute that this is a physiological function, so the process is
      over-annotated for LETM1. Not removed, deferring to the curator's reading of the full
      text.
    supported_by:
    - reference_id: PMID:19797662
      supporting_text: >-
        RNAi knockdown, overexpression, and liposome reconstitution of the purified Letm1
        protein demonstrate that Letm1 is a mitochondrial Ca2+/H+ antiporter.
    - reference_id: PMID:24898248
      supporting_text: >-
        NCLX overexpression enhanced the rates of Ca(2+) efflux, whereas increasing LETM1
        levels had no impact on Ca(2+) extrusion.
