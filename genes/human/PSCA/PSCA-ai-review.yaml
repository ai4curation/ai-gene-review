suggested_questions:
- question: Which nicotinic receptor subtypes does PSCA modulate in prostate and bladder epithelium, where
    it is most abundant but where cholinergic signalling is less studied than in brain?
- question: Does the reported in vitro cell-proliferation inhibition by PSCA depend on its nicotinic receptor
    modulation, or on a separate activity of the LU domain?
- question: Is the soluble, phospholipase-released form of PSCA biologically active, for example as a
    diffusible nicotinic receptor modulator?
suggested_experiments:
- description: Electrophysiological recording of defined nAChR subtype combinations (alpha4beta2, alpha7,
    alpha3beta2) co-expressed with GPI-anchored or soluble PSCA, to quantify the direction and subtype
    selectivity of PSCA modulation.
- description: Surface-restricted proximity labelling from PSCA in human prostate epithelial and urothelial
    cells, to identify its physiological surface partners outside the nervous system.
- description: PSCA knockout and re-expression in human cortical neuron cultures, measuring nicotinic
    currents and ERK signalling, to test whether the elevated PSCA seen in Alzheimer cortex is sufficient
    to blunt cholinergic responses.
