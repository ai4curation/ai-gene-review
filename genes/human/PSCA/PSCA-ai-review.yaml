id: O43653
gene_symbol: PSCA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PSCA encodes prostate stem cell antigen, a small glycosylphosphatidylinositol (GPI)-anchored
  glycoprotein of the Ly-6/uPAR (LU domain, three-finger) superfamily that is displayed on the outer face
  of the plasma membrane. It is expressed in prostate basal and secretory epithelium, bladder urothelium,
  stomach and colon neuroendocrine cells, placenta and kidney, is strongly overexpressed in prostate and
  bladder carcinoma, and is also present in human cerebral cortex. Like other Ly-6 (lynx-type) proteins,
  PSCA binds nicotinic acetylcholine receptor subunits - it forms stable complexes with the alpha-4 subunit
  CHRNA4 - and dampens nicotinic signalling, reducing nicotine-induced ERK phosphorylation. Being GPI-anchored,
  PSCA can be released from the surface by phospholipase cleavage and is recovered in prostatic exosomes.
  Common PSCA promoter and N-terminal-extension polymorphisms modify susceptibility to gastric and bladder
  cancer, and PSCA protein is elevated in Alzheimer disease frontal cortex.
