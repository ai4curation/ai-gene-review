knowledge_gaps:
- gap_statement: 'Whether ER-beta has any function outside the nucleus in a human cell is undetermined.
    The mitochondrial pool is the specific case: its mass-spectrometric identification did not survive
    reanalysis, and the immunocytochemistry behind it used antibodies of the class later shown non-specific.'
  boundary: 'The nuclear function is established: the receptor binds estrogen response elements, occupies
    an estrogen-responsive promoter in chromatin, binds coactivators and corepressors, and human mutations
    change its transactivation. The one validated antibody gives nuclear staining, and in only a few
    tissues.'
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: Non-genomic and mitochondrial estrogen signalling is widely invoked for ER-beta-selective
    agonists, so whether there is a non-nuclear pool decides how those compounds should be understood;
    it also decides whether the mitochondrion annotation removed in this review should ever return.
  resolution: 'Localize endogenous ER-beta in a human cell type that expresses it (granulosa, Leydig
    or lymphoid) with reagent-independent methods: a knock-in tag at the endogenous locus with imaging
    and fractionation, or targeted mass spectrometry on purified organelles with isotope-labelled peptide
    standards, each with an ESR2-null control.'
  provenance:
  - reference_id: PMID:28643774
    supporting_text: We conclude that only one antibody, the rarely used monoclonal PPZ0506, specifically
      targets ERβ in immunohistochemistry
    reference_section_type: ABSTRACT
  - reference_id: PMID:16563354
    supporting_text: However, fragmentation of these peptides shows that they are not from ERbeta
    reference_section_type: ABSTRACT
  - reference_id: PMID:16563354
    supporting_text: Our conclusion is that ERbeta cannot be identified by MALDI-TOF from a mixture
      of mitochondrial proteins resolved on SDS-PAGE
    reference_section_type: ABSTRACT
- gap_statement: What determines whether agonist-bound ER-beta activates or represses a given promoter
    is unknown. The receptor binds N-CoR and SMRT in the presence of agonists, the opposite of ER-alpha,
    yet activates ERE reporters in the same ligand state.
  boundary: 'The two outcomes are each documented: estradiol-dependent activation of ERE-driven reporters,
    and estradiol-dependent repression at an AP-1 element and at the CRH-BP promoter, where repression
    survives mutation of the ERE, AP-1, CRE, GATA and NF-kB sites. Agonist-dependent corepressor binding
    through an LXXLL-like motif in the N-CoR C-terminus is established in vitro and in vivo.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: ER-beta is pursued as a target precisely because it opposes ER-alpha in some contexts;
    without knowing what switches its direction, the effect of an ER-beta-selective ligand on any particular
    gene cannot be predicted.
  resolution: 'Compare coregulator occupancy and transcriptional output at matched activated and repressed
    target genes in one cell type, with the agonist held constant: quantify N-CoR, SMRT and p160 recruitment
    at each locus, and test whether swapping the response element or the flanking factor binding sites
    inverts the outcome.'
  provenance:
  - reference_id: PMID:12904255
    supporting_text: we report that estrogen receptor beta (ERbeta) binds N-CoR and SMRT in the presence
      of agonists, but not antagonists, in vitro and in vivo
    reference_section_type: ABSTRACT
  - reference_id: PMID:15345745
