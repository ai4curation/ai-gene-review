      ER-beta and several other nuclear receptors ligand-independently. Supports the enzyme-binding
      row, kept as non-core because the coactivator function was demonstrated for ER-alpha.
- id: PMID:12904255
  title: ERbeta Binds N-CoR in the Presence of Estrogens via an LXXLL-like Motif in the N-CoR C-terminus.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. ER-beta binds N-CoR and SMRT in the presence of agonists but not
      antagonists, in vitro and in vivo, through a PLTIRML sequence in the N-CoR C-terminus resembling
      a coactivator LXXLL motif, and histone-deacetylase inhibition potentiates ER-beta AF-2 activity.
