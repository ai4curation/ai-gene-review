- id: PMID:15024130
  title: Mitochondrial localization of estrogen receptor beta.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Abstract-only cache. Reports mitochondrial ER-beta from immunocytochemistry with two
