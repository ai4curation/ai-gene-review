    mechanism defined in mouse is untested. The human reports describe gonadal dysgenesis and streak
    gonads, which is earlier and more severe than the mouse follicle-maturation defect.
  boundary: 'In mouse the lesion is well localized: ER-beta-null granulosa cells under-respond to FSH
