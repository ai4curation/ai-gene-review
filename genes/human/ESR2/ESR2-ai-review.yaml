description: 'ESR2 encodes estrogen receptor beta (ER-beta, NR3A2), one of the two estrogen receptors
  and a ligand-regulated nuclear transcription factor of the NR3 subfamily. It has the canonical nuclear
  receptor architecture: a modulating N-terminal region carrying a ligand-independent activation function,
  a DNA-binding domain built from two C4 zinc fingers that is almost identical to that of ER-alpha,
  a hinge, and a C-terminal ligand-binding domain whose helix 12 carries the ligand-dependent activation
  function. It binds 17beta-estradiol with low-nanomolar affinity, comparable to ER-alpha, and also
  binds other estrogens, phytoestrogens such as genistein, and antiestrogens; 27-hydroxycholesterol
  acts on it as an endogenous selective modulator. The liganded receptor acts in the nucleus, binding
  estrogen response elements as a homodimer or as a heterodimer with ER-alpha and recruiting coactivator
  and corepressor complexes on chromatin, and it can also be recruited through other DNA-bound factors
  at AP-1 elements. Which direction it takes is element- and ligand-dependent: it activates ERE-driven
  transcription, yet estradiol-bound ER-beta represses transcription at an AP-1 site and at the human
  CRH-BP promoter, and it binds N-CoR and SMRT in the presence of agonists rather than in their absence.
  Its distribution is narrow for a receptor of this family. The only anti-ER-beta antibody that survives
  systematic validation detects the protein in ovarian granulosa cells, testicular Leydig cells, adrenal
  glandular cells and lymphoid cells, matching transcript data, and not in breast; much of the older
  literature on ER-beta localization and tissue distribution rests on antibodies later shown to be non-specific.
  The best-supported physiology is ovarian: the receptor transduces estradiol in granulosa cells of
  the preovulatory follicle, where it is needed for the full FSH response and for follicle maturation
  and efficient ovulation, a dominant-negative ESR2 mutation causes ovarian dysgenesis with primary
  amenorrhoea, and other ESR2 variants, including ones that increase transactivation in assay, are reported
  in 46,XY differences of sex development. In breast cancer cell models ER-beta restrains estradiol-driven
  proliferation, opposing ER-alpha. Alternative splicing of the C-terminus produces several isoforms;
  isoform 2 (ER-beta-cx) cannot bind ligand or DNA and instead heterodimerizes preferentially with ER-alpha
  and inhibits it, so it is an inhibitor of the pathway rather than a receptor.'
