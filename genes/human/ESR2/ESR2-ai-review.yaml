suggested_questions:
- question: Which human cell types express ER-beta protein at a level sufficient to carry a transcriptional
    response, now that the antibody literature has been reset and only one clone is validated?
- question: Does ER-beta act as an obligate partner of ER-alpha in cells expressing both, or independently?
    The ligand-selective dimer measurements imply that the ratio of homodimer to heterodimer, not the
    amount of receptor, sets the response.
- question: Is ER-beta-cx (isoform 2) expressed as protein at levels able to inhibit ER-alpha in a human
    tissue, or is its dominant-negative activity confined to overexpression?
suggested_experiments:
- description: Tag ESR2 at its endogenous locus in a human cell type that expresses it, and localize
    and quantify the protein by imaging, fractionation and targeted mass spectrometry against an ESR2-null
    control. This settles the non-nuclear question without depending on antibody specificity.
  experiment_type: endogenous tagging with imaging and targeted proteomics
- description: Hold the agonist constant and map coregulator occupancy at an activated and a repressed
    ER-beta target gene in the same cells, then swap response elements and flanking factor sites to
    test whether the element or its context determines the direction of the transcriptional effect.
  experiment_type: chromatin immunoprecipitation with reporter element swaps
- description: Differentiate iPSC-derived granulosa-like cells carrying the human ESR2 dominant-negative
    variant and wild-type controls, and test FSH-driven aromatase, LHCGR and PTGS2 induction, to ask
    whether the human ovarian failure follows the granulosa-cell mechanism defined in Esr2-null mice.
  experiment_type: isogenic human cell model with hormone stimulation
