  description: 'A C-terminally altered splice form that is an inhibitor of estrogen signalling rather
    than a receptor. It has no detectable ligand binding, forms no shifted complex on an estrogen response
    element, and has no ligand-dependent transactivation; instead it heterodimerizes preferentially
    with ER-alpha rather than with ER-beta, inhibits ER-alpha DNA binding, and has dominant-negative
    activity against ER-alpha transactivation. The transcript is found in testis, ovary, thymus and
    prostate. The activity is therefore inhibition of another transcription regulator through heterodimerization,
    not antagonism of agonist binding to a receptor, and it must not be attributed to the gene as a
    whole: the canonical receptor measured in the same paper binds estradiol at 0.6 nM and binds EREs
    normally. All five full-length isoforms diverge at one position inside predicted helix 10 of the
    ligand-binding domain, which is why C-terminal splicing changes ligand competence rather than DNA
    recognition.'
