- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: PMID:15024130
  qualifier: located_in
  review:
    summary: The single mitochondrial row rests on immunocytochemistry with two anti-ER-beta antibodies
      in rodent cells plus MALDI-TOF identification of ER-beta peptides in a 50-65 kDa band from human
      heart mitochondria, and the same paper reports no nuclear translocation of ER-beta on estradiol
      treatment.
    action: REMOVE
    reason: Both pillars have since failed. An independent reanalysis of the mass-spectrometric identification
      found that the peptide masses matching ER-beta do not fragment as ER-beta peptides, and concluded
      that ER-beta cannot be identified this way from a mitochondrial protein mixture; the original
      authors replied that their own heart spectra were not the ones reanalysed, so the dispute is on
      the record but no replication with a validated reagent exists. Independently, of thirteen anti-ER-beta
      antibodies tested systematically only PPZ0506 proved specific in immunohistochemistry, and with
      it ER-beta protein is nuclear and confined to a few tissues, so colocalization obtained with other
      clones is not evidence of location. The paper's additional claim of nuclear exclusion contradicts
      the nuclear rows kept in this review, which are supported by promoter occupancy in chromatin.
      A mitochondrial pool of ER-beta may yet be real, but no current evidence supports annotating it.
    supported_by:
    - reference_id: PMID:15024130
      supporting_text: In immunocytochemistry studies, ERbeta was detected with two ERbeta antibodies
        and found to colocalize almost exclusively with a mitochondrial marker in rat primary neuron,
        primary cardiomyocyte, and a murine hippocampal cell line
