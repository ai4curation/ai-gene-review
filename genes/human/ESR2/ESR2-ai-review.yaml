core_functions:
- description: 'Ligand-regulated nuclear receptor activity: estradiol-bound ER-beta binds estrogen response
    elements as a homodimer or an ER-alpha heterodimer, recruits coactivator and corepressor complexes
    on chromatin, and sets the transcriptional output of RNA polymerase II promoters in the responding
    cell. In granulosa cells of the preovulatory follicle this is the step by which estradiol augments
    the FSH response that drives follicle maturation.'
