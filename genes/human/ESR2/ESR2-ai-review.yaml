- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: IMP
  original_reference_id: PMID:30113650
  qualifier: involved_in
  review:
    summary: 'ER-beta transduces estradiol inside the granulosa cell of the maturing follicle. A woman
      with a dominant-negative ESR2 mutation has streak gonads and complete ovarian failure, and in
      mouse the receptor is required for the preovulatory follicle to progress: Esr2-null granulosa
      cells respond incompletely to FSH, with less aromatase activity and insufficient LH receptor,
      follicles fail to progress from early to large antral stage, and ovulation is reduced.'
    action: NEW
    reason: 'The participation test is met by the receptor''s own step rather than by necessity alone:
      the granulosa cell is the cell that differentiates, ER-beta is the receptor in that cell (nuclear
      ER-beta protein in human ovarian granulosa cells is the one tissue-level signal obtained with
      the single validated antibody), and the estradiol signal it transduces is what augments the FSH
      response driving follicle maturation. The comparator check agrees: FSHR, the other receptor acting
      in the same cell on the same process, carries GO:0001541. Human genetics gives the evidence code
      used here; the mouse data locate the defect in the follicle and are cited as corroboration rather
      than as the primary support. The narrower mouse-only claims — granulosa cell differentiation and
      ovulation — are deliberately not proposed, since their support is entirely in Esr2-null mice.
      Limitation, stated on the row rather than left to the reader: the human arm is a single case
      report, of one woman with a heterozygous dominant-negative allele, streak gonads and primary
      amenorrhoea, and the cached record for it is abstract-only. Its authors frame the phenotype as
      ovarian determination and/or maintenance, which is earlier and more severe than a follicle-stage
      defect, so the human genetics establishes that the receptor is required for the ovary while the
      stage specificity this term carries — arrest between early and large antral follicle, in granulosa
      cells that under-respond to FSH — comes from Esr2-null mouse follicles and from nowhere else. The
      row is therefore proposed at a granularity no human experiment yet fixes, and whether the human
      phenotype runs through the mouse granulosa-cell mechanism at all is carried in this review as an
      open BIOLOGY knowledge gap rather than treated as settled.'
    supported_by:
    - reference_id: PMID:30113650
      supporting_text: We identified a loss-of-function heterozygous mutation of a highly conserved
        residue in ESR2 that disrupts estradiol-dependent signaling and has a dominant negative effect,
        most likely due to failure to interact with its coactivator, nuclear coactivator 1
      reference_section_type: ABSTRACT
    - reference_id: PMID:30113650
