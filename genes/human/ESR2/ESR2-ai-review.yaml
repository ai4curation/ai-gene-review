- id: PMID:8769313
  title: 'ER beta: identification and characterization of a novel human estrogen receptor.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only cache. The human cloning paper: 96% identity to ER-alpha in the DNA-binding
      domain and 58% in the ligand-binding domain, expression in thymus, spleen, ovary and testis by
      Northern blot, and estradiol-dependent transactivation of an ERE reporter in CHO cells, with ICI-164384
      acting as an antagonist. Used here for the receptor''s activity and pathway rows. Its cell-cell
      signaling annotation is the one claim the paper does not support, and that row is corrected rather
      than kept.'
- id: PMID:9048584
  findings: []
  title: Comparison of the ligand binding specificity and transcript tissue distribution of estrogen
    receptors alpha and beta.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Rat ER-beta ligand-binding specificity (Kd 0.4 nM for iodo-estradiol)
      with a full competition series, and the rat tissue distribution. This is the donor-side evidence
      behind the ISS steroid-binding row (UniProtKB:Q62986), and it is itself estradiol binding, which
      is why that row is refined rather than accepted at the parent level.
- id: PMID:9278514
  findings: []
  title: Differential ligand activation of estrogen receptors ERalpha and ERbeta at AP1 sites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only cache. The AP-1 result: estradiol activates through ER-alpha and inhibits
      through ER-beta, while tamoxifen, raloxifene and ICI-164384 are activators with ER-beta. This
      is why the undirected regulation-of-Pol-II-transcription term is kept and both directional children
      are retained.'
- id: PMID:9325313
  findings: []
  title: Human estrogen receptor beta binds DNA in a manner similar to and dimerizes with estrogen receptor
    alpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Gel-shift comparison of human ER-alpha and ER-beta DNA binding,
      including the demonstration that the two receptors dimerize with each other and that the ER-alpha
      DNA-binding domain suffices for it. Independent support for the heterodimerization claim.
- id: PMID:9636657
  title: Cloning and characterization of human estrogen receptor beta isoforms.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Defines the ER-beta isoform series and shows that the full-length
      isoforms form DNA-binding homodimers and heterodimers with each other and with ER-alpha; all five
      diverge inside predicted helix 10 of the ligand-binding domain, which is why C-terminal splicing
      changes ligand competence. Supports the homodimerization annotation proposed here.
- id: PMID:9671811
  title: 'Molecular cloning and characterization of human estrogen receptor betacx: a potential inhibitor
    ofestrogen action in human.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only cache (PMC blocked). Two separate contributions: the measured affinities
      of ER-alpha and ER-beta for estradiol (0.2 and 0.6 nM), and the characterization of ER-beta-cx,
      which has no ligand binding, no ERE shift, no ligand-dependent transactivation, and dominant-negative
      activity against ER-alpha through preferential heterodimerization. The second set of results is
      isoform-specific and is recorded here as such.'
- id: PMID:9861029
  findings: []
  title: Generation and reproductive phenotypes of mice lacking estrogen receptor beta.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Abstract-only cache. The Esr2-null mouse: normal development and fertility but fewer
      and smaller litters from reduced ovarian efficiency, with the authors concluding that ER-beta
      is essential for normal ovulation efficiency. Mouse evidence, cited as corroboration of the human
      ovarian phenotype.'
- id: PMID:10469641
  findings: []
  title: Structure of the ligand-binding domain of oestrogen receptor beta in the presence of a partial
    agonist and a full antagonist.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Abstract-only cache. Crystal structure of the ER-beta ligand-binding domain with
      genistein and raloxifene: genistein occupies the same hydrophobic pocket as estradiol while helix
      12 adopts the antagonist-like position. Cited for the identity of the ligand pocket, not for a
      GO row of its own.'
- id: PMID:10749889
  title: Estrogen receptor alpha rapidly activates the IGF-1 receptor pathway.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Abstract-only cache. The ER-beta result in this paper is negative: estradiol-bound
      ER-alpha, but not ER-beta, phosphorylates and binds the IGF-1 receptor and is required for IGF-1-stimulated
      ERE reporter activity. Its two TAS rows on ESR2 are therefore background statements rather than
      findings, and nothing in this review rests on its experiments.'
- id: PMID:11181953
  title: Role of estrogen receptor beta in estrogen action.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Abstract-only cache of a review, cited by six TAS rows. The review itself is sound,
      but its abstract does not state the individual claims the rows carry, so each is supported here
      from primary work: the ligand-binding papers, the cloning and transactivation papers, and for
      the growth claim the T47D induction experiment (PMID:14745018), which measures proliferation rather
      than cell growth.'
- id: PMID:11279242
  title: The human homologue of the yeast DNA repair and TFIIH regulator MMS19 is an AF-1-specific coactivator
