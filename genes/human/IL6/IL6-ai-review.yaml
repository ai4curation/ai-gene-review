id: P05231
gene_symbol: IL6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IL6 encodes interleukin-6, a secreted pleiotropic cytokine central to immunity, the acute-phase
  response, haematopoiesis, tissue regeneration and metabolism. It binds the interleukin-6 receptor (IL6R)
  and the resulting complex engages the signal-transducing subunit IL6ST/gp130 (in membrane-bound classic,
  soluble-receptor trans-, and cell-contact cluster signaling), activating the JAK-STAT3 (and MAPK/PI3K)
  cascades. IL6 drives B- and T-cell responses, hepatic acute-phase protein synthesis and a very wide
  range of inflammatory and homeostatic programs.
