core_functions:
- description: The long alsin protein forms a functional self-associated Rab5 exchange factor.
    Its VPS9-containing C-terminal region promotes GDP release from Rab5, and regulated recruitment
    from the cytosol to early endosomal membranes couples this exchange to endosome fusion
    and membrane transport. Oligomerization supports activity; the core does not require a
    fixed native subunit count or direct Rac1 exchange catalysis.
