id: Q96Q42
gene_symbol: ALS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Alsin, encoded by ALS2, is a multidomain Rab5 guanine-nucleotide exchange factor
  that promotes endosomal membrane trafficking. The long isoform contains an N-terminal RCC1-like
  region, central DH/PH domains, MORN motifs and a C-terminal VPS9 domain. Functional self-association
  and the VPS9-containing region support Rab5 nucleotide exchange and endosome fusion. Cytosolic
  alsin can be recruited to membrane ruffles and nascent macropinosomes downstream of activated
  Rac1. Neuronal endosomal and somatodendritic pools connect this trafficking function to
  neuronal maintenance; recessive loss-of-function variants cause juvenile motor neuron disorders.
