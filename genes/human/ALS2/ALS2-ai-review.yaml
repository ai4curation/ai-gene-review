- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:15247254
  qualifier: enables
  review:
    summary: The directly measured activity is Rab5 nucleotide exchange, not stimulation of
      GTP hydrolysis.
    action: MODIFY
    reason: Full PMID:15247254 Methods and Figure 5 quantify loss of preloaded tritiated GDP
      from Rab5A. The results distinguish catalytic exchange from substrate binding; they
      do not assay GTP hydrolysis. Live GO:0005096 requires stimulation of hydrolysis. Refine
      this source-specific annotation to GO:0005085, the actual exchange mechanism. This does
      not assert that every conceivable ALS2 hydrolysis effect has been excluded. The replacement
      converges on the existing GO:0005085 contribution-to-exchange annotation from this paper;
      consolidate the biological claim without implying that an isolated monomer is sufficient.
    proposed_replacement_terms:
    - id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    supported_by:
    - reference_id: PMID:15247254
      supporting_text: This homo-oligomerization is crucial for the Rab5GEF activity in vitro
        and the ALS2-mediated endosome enlargement in the cells.
