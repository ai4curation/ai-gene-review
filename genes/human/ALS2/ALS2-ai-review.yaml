  review:
    summary: Self-associated ALS2 contributes to Rab5 guanine-nucleotide exchange.
    action: ACCEPT
    reason: Preserve the original contributes_to qualification. Full PMID:15247254 Methods
      and Figure 5 measure dissociation of preloaded tritiated GDP from Rab5A with affinity-isolated
      ALS2 expressed in COS-7 cells. Oligomerization-defective constructs retain Rab5 binding
      but lose exchange. The study supports a functional oligomeric unit without requiring
      a particular native stoichiometry.
    additional_reference_ids:
    - PMID:30224357
    supported_by:
    - reference_id: PMID:15247254
      supporting_text: This homo-oligomerization is crucial for the Rab5GEF activity in vitro
        and the ALS2-mediated endosome enlargement in the cells.
