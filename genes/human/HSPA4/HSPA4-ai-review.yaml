  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013126
  review:
    summary: Generic InterPro2GO mapping from the Hsp70 family; Hsp110 function relies on nucleotide
      exchange, not ATP hydrolysis, and PAINT did not propagate ATP hydrolysis to the Hsp110 clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IPR013126 mapping applies the ATPase activity of canonical Hsp70s to every family member.
      In PTHR45639, PAINT curators placed GO:0016887 at the canonical Hsp70 node (PTN000452648) but not
      at the Hsp110 node from which HSPA4 inherits its other IBAs, which is a deliberate decision.
      Experimentally, the Hsp110 effect on the human Hsp70 machine relies on nucleotide exchange, not on
      its own ATPase activity, and the Apg2 studies measure stimulation of the Hsc70 ATPase rather than
      HSPA4-catalysed hydrolysis. Some Hsp110s show weak intrinsic ATPase activity, so the term is not
      demonstrably false, but it overstates HSPA4 function.
    supported_by:
    - reference_id: PMID:22990239
      supporting_text: This Hsp110 effect relies on nucleotide exchange, not on ATPase activity, implying
        ATP-driven chaperoning is not required.
    - reference_id: file:interpro/panther/PTHR45639/PTHR45639-paint.tsv
