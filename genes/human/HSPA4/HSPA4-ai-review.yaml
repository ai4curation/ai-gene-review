  - SGD:S000006027
  - UniProtKB:Q92598
  review:
    summary: 'adenyl-nucleotide exchange factor activity: Apg2/HSPA4 acts as a cytosolic Hsp110 nucleotide-exchange
      factor that supports Hsc70-mediated protein refolding and disaggregation. Primary biochemical experiments
      identify the mechanism and distinguish it from the RAC Hsp70 paralog.'
    action: ACCEPT
    reason: Apg2/HSPA4 acts as a cytosolic Hsp110 nucleotide-exchange factor that supports Hsc70-mediated
      protein refolding and disaggregation. Primary biochemical experiments identify the mechanism and
      distinguish it from the RAC Hsp70 paralog.
    supported_by:
    - &id001
      reference_id: PMID:30521813
      supporting_text: 'Hsp110s support the refolding of

        aggregated polypeptides acting as specialized nucleotide exchange factors of

        Hsp70. We have studied how Apg2, one of the three human Hsp110s, regulates the

        activity of Hsc70 (HspA8), the constitutive Hsp70 in our cells.'
