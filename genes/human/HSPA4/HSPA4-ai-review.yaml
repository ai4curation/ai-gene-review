id: P34932
gene_symbol: HSPA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPA4, also called Apg2, is an Hsp110-family chaperone that serves as a nucleotide-exchange
  factor for Hsc70. Together with Hsp70 and J-domain co-chaperones it supports refolding and disaggregation
  of proteins. Its substrate-binding and distinctive C-terminal regions tune Hsc70 engagement and nucleotide
  exchange.
