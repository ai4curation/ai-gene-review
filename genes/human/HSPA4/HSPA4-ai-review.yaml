gene_symbol: HSPA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPA4 (Apg2, HSPH2) is one of the three cytosolic Hsp110-family proteins of humans,
  an 840-residue member of the Hsp70 superfamily with an N-terminal actin-fold nucleotide-binding
  domain, a beta-sandwich substrate-binding domain carrying the acidic insertion characteristic of
  Hsp110s, an alpha-helical lid and a metazoan-specific C-terminal extension. Rather than acting as
  a conventional ATP-hydrolysis-driven foldase, HSPA4 binds the nucleotide-binding domain of the
  constitutive Hsp70 HSPA8 (Hsc70) and acts as its nucleotide-exchange factor, accelerating ADP/ATP
  exchange and thus substrate release. With DNAJB1 and Hsc70 it forms the metazoan disaggregase
  system that solubilises and refolds amorphous and ordered protein aggregates. Its activity is
  biphasic. Substoichiometric HSPA4 stimulates the Hsc70 cycle, aggregate binding and refolding,
  whereas excess HSPA4 arrests the cycle; the acidic subdomain and the C-terminal extension tune the
  stability of the Hsc70-HSPA4 complex and the rate of nucleotide exchange. HSPA4 is a soluble
  cytosolic protein, is also found in nuclear and extracellular-vesicle proteomes, and is detected
  in many tissues.
