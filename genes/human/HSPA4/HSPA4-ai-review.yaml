- id: file:human/HSPA4/HSPA4-uniprot.txt
  title: UniProtKB P34932 (HSP74_HUMAN) flat file
  findings: []
core_functions:
- description: Nucleotide-exchange factor for the cytosolic Hsp70 HSPA8 (Hsc70). HSPA4 binds the
    Hsc70 nucleotide-binding domain and accelerates nucleotide exchange, thereby setting the pace of
    substrate binding and release in the Hsc70/J-protein cycle; it is inherited from the Hsp110 clade
    and directly demonstrated for human Apg2.
  molecular_function:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:36167183
    supporting_text: During aggregate reactivation, Apg2 performs as a specialized nucleotide exchange
      factor
  - reference_id: PMID:30521813
    supporting_text: 'Apg2 shows a biphasic behavior: at low concentration, it stimulates the ATPase
      cycle of Hsc70, binding of the chaperone to protein aggregates and the refolding activity of the
      system'
suggested_questions:
- question: Does HSPA4 have measurable intrinsic ATP hydrolysis activity, and is it required for any
    HSPA4 function in cells, given that Hsp110-mediated disaggregation relies on nucleotide exchange?
- question: What HSPA4-specific result in PMID:15644312 supports the Tom40 import and assembly
    annotations, and would protein insertion into mitochondrial outer membrane (GO:0045040) be the more
    accurate process for the Tom40 substrate?
suggested_experiments:
- description: Compare steady-state ATPase rates of purified HSPA4 and an ATP-binding-site mutant with
    HSPA8 under identical conditions, and test whether the mutant still supports Hsc70/DNAJB1
    disaggregation of luciferase aggregates.
