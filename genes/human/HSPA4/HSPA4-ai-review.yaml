  review:
    summary: Experimental annotation from a study of human Tom40 import; the HSPA4-specific experiment
      is not visible in the cached abstract and the full text could not be retrieved.
    action: UNDECIDED
    reason: The cached abstract describes the import and assembly of the outer-membrane channel Tom40
      and implicates Hsp90 in precursor delivery; it does not mention HSPA4. The curator presumably saw
      an HSPA4-related result in the full text (not retrievable here), so the annotation is not
      rejected. Note, however, that Tom40 is an outer-membrane protein, so even if HSPA4 assists Tom40
      precursor delivery, GO:0045040 protein insertion into mitochondrial outer membrane would describe
