    summary: Membrane (UniProt SubCell IEA, from one predicted helix). The prediction is borderline and
      no experiment localizes ANKAR; undecided.
    action: UNDECIDED
    reason: UniProt's membrane assignment rests on one predicted helix (residues 309-329) in a 1,434-residue
      ankyrin/ARM-repeat protein. A hydropathy scan finds [file:genes/human/ANKAR/ANKAR-bioinformatics/RESULTS.md
      "the predicted transmembrane helix is borderline"], and [file:genes/human/ANKAR/ANKAR-bioinformatics/RESULTS.md
      "a window inside an ankyrin repeat, which is a soluble fold, scores about as high"]. No study has
      localized ANKAR [file:genes/human/ANKAR/ANKAR-deep-research-affinage.md "Beyond this genomic and
      expression characterization, no direct experiments have established its biochemical activity, binding
      partners, or specific cellular function in the available corpus"]. The protein could be membrane-anchored
      or soluble; the evidence does not decide it.
