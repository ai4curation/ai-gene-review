  review:
    summary: Membrane (UniProt SubCell IEA, from one predicted helix). The prediction is borderline and
      no experiment localizes ANKAR; undecided.
    action: UNDECIDED
    reason: UniProt's membrane assignment rests on one predicted helix (residues 309-329, ECO:0000255)
      in a 1,434-residue ankyrin/ARM-repeat protein. The segment is the protein's most hydrophobic stretch
      [file:human/ANKAR/ANKAR-bioinformatics/RESULTS.md "The two highest-scoring windows in the whole
      protein start at 312 (1.69) and 311 (1.66), both inside the annotated segment."], which favours
      the prediction. But the AlphaFold model places it in a folded region [file:human/ANKAR/ANKAR-bioinformatics/RESULTS.md
      "AlphaFold models 309-329 as a confident helix within a well-ordered region, packed about as densely
      as a typical ordered residue."], which looks more like a buried helix in a soluble domain. No study
      has localized ANKAR [file:human/ANKAR/ANKAR-deep-research-affinage.md "Beyond this genomic and expression
      characterization, no direct experiments have established its biochemical activity, binding partners,
      or specific cellular function in the available corpus"]. [file:human/ANKAR/ANKAR-bioinformatics/RESULTS.md
      "The evidence does not decide between a single-pass membrane protein and a soluble ankyrin/ARM protein."]
    supported_by:
    - reference_id: file:human/ANKAR/ANKAR-bioinformatics/RESULTS.md
      supporting_text: The two highest-scoring windows in the whole protein start at 312 (1.69) and 311
        (1.66), both inside the annotated segment.
    - reference_id: file:human/ANKAR/ANKAR-bioinformatics/RESULTS.md
      supporting_text: AlphaFold models 309-329 as a confident helix within a well-ordered region, packed
        about as densely as a typical ordered residue.
    - reference_id: file:human/ANKAR/ANKAR-bioinformatics/RESULTS.md
