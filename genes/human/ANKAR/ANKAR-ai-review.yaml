  label: Homo sapiens
description: ANKAR (ankyrin and armadillo repeat-containing protein) is a large, uncharacterized protein
  of about 1,430 residues, conserved among mammals, with five ankyrin repeats and six armadillo repeats,
  which are protein-interaction folds. One hydrophobic segment is predicted to be a membrane-spanning
  helix, but the prediction is marginal. The gene, on chromosome 2q32, is expressed in many tissues with
  extensive alternative splicing. Its location, partners and function are unknown.
