- term:
    id: GO:0099171
    label: presynaptic modulation of chemical synaptic transmission
  evidence_type: ISS
  original_reference_id: PMID:26030848
  review:
    summary: 'Presynaptic neurexin-3 sets release properties at specific synapses: in olfactory bulb it is required
      for GABA release (through its intracellular sequences), in olfactory bulb and prefrontal cortex it enables
      normal inhibitory release probability through trans-synaptic dystroglycan binding, and a human-derived A687T
      missense variant increases excitatory release probability.'
    action: NEW
    reason: 'NRXN3-specific biology that the existing rows do not capture; NRXN3 has no neurotransmitter secretion
      row. Participation: NRXN3 resides in the presynaptic active zone membrane and its own sequences determine
      release (loss reduces GABA release; a point mutation in its extracellular domain increases release probability),
      so it does part of the work of the presynaptic modulation rather than merely being required. The effect is
      synapse-, region- and sex-specific (opposite effects in male and female ventral subiculum), so a direction-neutral
      modulation term fits. Comparator check: SynGO annotates mouse Nrxn3 to GO:0099171 by IDA/IMP from this study,
      mouse Nrxn2 carries it from a hippocampal study, and the NRXN2 review added it as NEW. GO:0099171 is not an
      ancestor or descendant of GO:0099557 (both sit under modulation of chemical synaptic transmission), so the
      two capture distinct presynaptic and trans-synaptic aspects. Evidence is from mouse (ISS).'
    supported_by:
    - reference_id: PMID:26030848
      supporting_text: In cultured neurons and acute slices of the olfactory bulb, however, intracellular sequences
        of presynaptic neurexin-3 were selectively required for GABA release.
    - reference_id: PMID:26030848
      supporting_text: In olfactory bulb, by contrast, presynaptic Nrxn3α/β KO revealed an essential role in enabling
        presynaptic GABA release.
    - reference_id: PMID:36997523
      supporting_text: Neurexin-3 enables a normal release probability at inhibitory synapses via a trans-synaptic
        feedback signaling loop consisting of presynaptic Neurexin-3 and postsynaptic dystroglycan.
    - reference_id: PMID:31578233
      supporting_text: neurexin-3αA687T unexpectedly produced the first neurexin presynaptic gain-of-function phenotype
    - reference_id: PMID:34879268
      supporting_text: Nrxn3 knockout impairs synapse density, postsynaptic strength, and inhibitory postsynaptic
        current (IPSC) amplitude at PV-RS synapses in males, but enhances presynaptic release and IPSC amplitude
        in females
