      NMDA receptor levels, and enhanced postsynaptic AMPA receptor endocytosis
  - reference_id: PMID:26030848
    supporting_text: extracellular sequences of presynaptic neurexin-3 mediated trans-synaptic regulation of postsynaptic
      AMPA receptors
  - reference_id: PMID:26030848
    supporting_text: suggesting that neurexin-mediated trans-synaptic interactions stabilize postsynaptic AMPARs
      in cultured hippocampal neurons independent of neurexin-mediated intracellular signaling
  - reference_id: PMID:31005376
    supporting_text: In contrast, alternative splicing of neurexin-3 at SS4 suppressed AMPA-receptor-mediated, but
      not NMDA-receptor-mediated, synaptic responses
  - reference_id: PMID:34135511
    supporting_text: Surprisingly, binding to the same GluD1-Cbln2 complex enables Nrxn1SS4+ to enhance NMDARs but
      not AMPARs, whereas binding of Nrxn3SS4+ to the GluD1-Cbln2 complex suppresses AMPARs but not NMDARs
  - reference_id: PMID:36205393
