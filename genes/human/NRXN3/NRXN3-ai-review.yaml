suggested_questions:
- question: Should GO:0099557 trans-synaptic signaling by trans-synaptic complex, modulating synaptic transmission
    be used for all three neurexins (NRXN1 and NRXN2 were modified to its parent GO:0099545), given that the SS4-dependent
    neurexin-cerebellin-GluD1 signals modulate receptor responses without changing synapse number?
- question: 'How does NRXN3 enable GABA release in olfactory bulb: is it the PDZ-binding motif (CASK/Mint recruitment),
    another intracellular sequence, or dystroglycan-dependent feedback? The two published rescue studies emphasize
    different domains.'
- question: The GPI-anchored NRXN3 AS5 proteoform lacks the transmembrane and cytoplasmic domains; should it be
    represented as a distinct isoform in UniProt, and do its functions differ from transmembrane neurexin-3?
- question: Is there any functional variant-to-mechanism evidence for the NRXN3 associations with alcohol, opioid
    and nicotine dependence (e.g. the SS5-adjacent rs8019381 altering membrane-anchored vs soluble isoform ratio),
    or should these remain unannotated genetic associations?
- question: BHF-UCL IGI rows pair the alpha and beta entries (Q9Y4C0 with Q9HDB5) because most ASD deletions remove
    exons of both; is IGI the appropriate code for patient CNVs affecting two products of one gene?
suggested_experiments:
- hypothesis: Human NRXN3 SS4+ splice variants suppress AMPA-receptor responses through CBLN2-GRID1 in human neurons,
    as in mouse hippocampus.
  description: Isogenic human iPSC-derived excitatory neurons engineered to constitutively include or exclude NRXN3
    SS4, with GRID1 or CBLN2 knockout; measure AMPA/NMDA EPSC ratios and surface GluA1.
