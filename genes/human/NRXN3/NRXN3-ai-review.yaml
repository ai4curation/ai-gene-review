- term:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  evidence_type: ISS
  original_reference_id: PMID:22262843
  review:
    summary: Neurexin-3 on one cell binds latrophilin-1, neuroligins or LRRTM2 on an apposed cell and holds the
      two cells together; NRXN3 is the presynaptic half of these trans-synaptic adhesion bridges.
    action: NEW
    reason: 'Same activity and reasoning as the NEW rows in the NRXN1 and NRXN2 reviews, here with neurexin-3-specific
      data. Participation: NRXN3 itself is one half of the adhesive bond - neurexin-3-beta-expressing cells aggregate
      with latrophilin-1-expressing cells, and neurexin-3-alpha-expressing cells aggregate with neuroligin- and
      LRRTM2-expressing cells in trans. Comparator check: other synaptic adhesion molecules in the same role (CLSTN1,
      contactins, CD200) carry this term, and the neurexin trans-synaptic adhesion module uses it for the neurexin
      hub. The existing cell adhesion molecule binding and neuroligin family protein binding rows describe the partner,
      not the adhesive activity. Evidence is from rodent neurexin-3 (ISS).'
    supported_by:
    - reference_id: PMID:22262843
      supporting_text: CL1-binding to neurexin-2β and -3β also mediates intercellular adhesion.
    - reference_id: PMID:22262843
      supporting_text: Strikingly, we found that cells expressing either of these two neurexins formed aggregates
        with CL1-expressing cells
