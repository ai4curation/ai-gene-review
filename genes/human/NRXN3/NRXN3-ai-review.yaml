  review:
    summary: IBA to the very general signal transduction, from the broad node PTN002309037 spanning neurexins and
      related LNS proteins.
    action: MODIFY
    reason: 'NRXN3 signalling is trans-synaptic and modulatory: presynaptic neurexin-3, depending on splice site
      4, controls postsynaptic AMPA receptor levels and endocytosis without changing synapse number, acting through
      its extracellular sequences via a neurexin-3(SS4+)-cerebellin-GluD1 complex; and in olfactory bulb and prefrontal
      cortex a presynaptic neurexin-3 / postsynaptic dystroglycan loop sets inhibitory release probability. Generic
      signal transduction implies an intracellular cascade that is not established for neurexin. NRXN1 and NRXN2
      were modified to GO:0099545 trans-synaptic signaling by trans-synaptic complex; for NRXN3 its child GO:0099557
      (...modulating synaptic transmission) is chosen, because the NRXN3-specific data are all about modulating
      transmission, and mouse Nrxn3 already carries GO:0099557 by IDA from the GluD1 study.'
    proposed_replacement_terms:
    - id: GO:0099557
      label: trans-synaptic signaling by trans-synaptic complex, modulating synaptic transmission
    supported_by:
    - reference_id: PMID:23827676
      supporting_text: constitutive inclusion of SS4 in presynaptic neurexin-3 decreased postsynaptic AMPA, but
        not NMDA receptor levels, and enhanced postsynaptic AMPA receptor endocytosis
    - reference_id: PMID:26030848
      supporting_text: extracellular sequences of presynaptic neurexin-3 mediated trans-synaptic regulation of postsynaptic
        AMPA receptors
    - reference_id: PMID:34135511
      supporting_text: Surprisingly, binding to the same GluD1-Cbln2 complex enables Nrxn1SS4+ to enhance NMDARs
        but not AMPARs, whereas binding of Nrxn3SS4+ to the GluD1-Cbln2 complex suppresses AMPARs but not NMDARs
    - reference_id: PMID:36997523
      supporting_text: Neurexin-3 enables a normal release probability at inhibitory synapses via a trans-synaptic
        feedback signaling loop consisting of presynaptic Neurexin-3 and postsynaptic dystroglycan.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002309037
