  review:
    summary: IBA from the neurexin clade node PTN002227321 (transmembrane signaling receptor activity).
    action: KEEP_AS_NON_CORE
    reason: NRXN3 is the presynaptic partner through which postsynaptic ligands act, and in olfactory bulb its GABA-release
      function requires the intracellular sequences, so a receptor-like role is defensible. However, its best-defined
      function (trans-synaptic control of postsynaptic AMPA receptors in hippocampus) needs only the extracellular
      domain and works independently of intracellular signalling, and no transmembrane signal cascade downstream
      of NRXN3 is established. The core activity is better captured by the adhesion-mediator and trans-synaptic
      signaling terms; retained as non-core, as for NRXN1 and NRXN2.
    supported_by:
    - reference_id: PMID:26030848
      supporting_text: In cultured neurons and acute slices of the olfactory bulb, however, intracellular sequences
        of presynaptic neurexin-3 were selectively required for GABA release.
    - reference_id: PMID:26030848
      supporting_text: suggesting that neurexin-mediated trans-synaptic interactions stabilize postsynaptic AMPARs
        in cultured hippocampal neurons independent of neurexin-mediated intracellular signaling
    - reference_id: PMID:1621094
      supporting_text: The neurexins were discovered by the identification of one member of the family as the receptor
        for alpha-latrotoxin.
