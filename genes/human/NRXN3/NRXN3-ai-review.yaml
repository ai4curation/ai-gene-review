core_functions:
- description: Presynaptic trans-synaptic adhesion molecule. From the presynaptic (active zone) membrane, NRXN3
    LNS domains bind postsynaptic neuroligins, LRRTM2, latrophilin-1 and dystroglycan, forming trans-synaptic complexes
    that physically link pre- and postsynaptic membranes and align the nanoscale organization of excitatory synapses;
    ligand choice is regulated by splice site 4.
  molecular_function:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0099560
    label: synaptic membrane adhesion
  locations:
  - id: GO:0042734
    label: presynaptic membrane
  - id: GO:0048787
    label: presynaptic active zone membrane
  in_complex:
    id: GO:0098820
    label: trans-synaptic protein complex
  supported_by:
  - reference_id: PMID:22262843
    supporting_text: CL1-binding to neurexin-2β and -3β also mediates intercellular adhesion.
  - reference_id: PMID:31578233
    supporting_text: To test whether A687T alters interactions with NL1–3 and LRRTM2 in trans , we used a HEK cell
      aggregation assay.
  - reference_id: PMID:31578233
    supporting_text: Under normal circumstances, Nrxn3α WT SS4− interacts with NL1 and LRRTM2
  - reference_id: PMID:11470830
    supporting_text: The second LNS domain of all three α-neurexins (neurexin 1α, 2α, and 3α) formed tight Ca2+-dependent
      complexes with dystroglycan, suggesting that all α-neurexins bind to dystroglycan
  - reference_id: PMID:37543682
    supporting_text: we identify neurexin-3 as a critical presynaptic adhesion molecule that regulates excitatory
      synapse nano-organization in hippocampus
  - reference_id: PMID:37543682
    supporting_text: endogenous neurexin-1 and neurexin-3 form discrete and non-overlapping SSDs that are enriched
      opposite their postsynaptic ligands
- description: Trans-synaptic modulator of postsynaptic glutamate receptors. Presynaptic neurexin-3, through its
    extracellular domain and SS4 alternative splicing, controls postsynaptic AMPA-receptor levels, endocytosis and
    LTP recruitment without changing synapse number; SS4-containing neurexin-3 acts through a cerebellin-2 (or cerebellin-1)
    bridge to postsynaptic GluD1, in a circuit-dependent manner that is distinct from NRXN1 (NMDA receptors) and
    NRXN2.
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
