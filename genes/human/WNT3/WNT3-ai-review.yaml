description: 'WNT3 is a secreted Wnt-family ligand that engages Frizzled receptors to activate canonical
  beta-catenin/TCF signaling. It is required for early embryonic patterning and limb development in humans
  and vertebrate models, and human WNT3 activates Frizzled-dependent reporter signaling in cultured cells.'
