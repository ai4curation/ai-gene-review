id: Q9UPZ9
gene_symbol: CILK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CILK1 (ciliogenesis associated kinase 1; intestinal cell kinase, ICK; MRK) is a serine/threonine
  protein kinase of the RCK (ros-cross-hybridizing kinase) group within the CMGC family, closely related
  to MAK and MOK. It is activated by dual phosphorylation of a TDY motif in its activation loop (Tyr autophosphorylation
  plus Thr phosphorylation by CDK-activating kinase-like activity). CILK1 is transported along the cilium
  with intraflagellar transport (IFT) trains and concentrates at the ciliary tip, where it phosphorylates
  the kinesin-2 subunit KIF3A and regulates the switch of IFT trains from anterograde to retrograde movement.
  Loss of CILK1 causes accumulation of IFT-A, IFT-B and BBSome components at ciliary tips, elongated or
  malformed primary cilia and defective Hedgehog signalling, so CILK1 acts as a negative regulator of
  cilium length. A nuclear pool has also been described. Homozygous loss-of-function mutations cause the
  lethal ciliopathy endocrine-cerebro-osteodysplasia (ECO) syndrome.
