  review:
    summary: Intraciliary anterograde transport (IEA from mouse). CILK1 regulates IFT at the ciliary tip; loss accumulates IFT components at tips and overexpression accumulates IFT-B at tips.
    action: ACCEPT
    reason: CILK1 acts within the IFT system by phosphorylating the anterograde motor subunit KIF3A; its role is regulatory rather than as transport machinery, but the annotation is consistent with the ortholog evidence.
