suggested_questions:
- question: Why does CILK1 loss elongate cilia in some cell types but impair ciliogenesis in others, and
    which KIF3A or IFT phosphosites mediate each outcome?
- question: Does the nuclear pool of CILK1 have a function independent of cilia?
- question: How redundant are CILK1, MAK and MOK in cilium length control in human tissues?
suggested_experiments:
- hypothesis: KIF3A phosphorylation by CILK1 at the ciliary tip is sufficient to set IFT turnaround and
    cilium length.
  description: Express phospho-null and phospho-mimetic KIF3A in CILK1-null human RPE1 cells and measure
    IFT turnaround (live imaging) and cilium length.
  experiment_type: Phosphosite rescue with live IFT imaging
- hypothesis: CILK1 and MAK act redundantly in cells co-expressing both.
  description: Single and double knockouts in a cell line expressing both kinases, scoring cilium length
    and tip IFT accumulation.
  experiment_type: Combinatorial genetic knockout
