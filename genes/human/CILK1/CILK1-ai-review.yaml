core_functions:
- description: CILK1 is a serine/threonine kinase that enters cilia and concentrates at the ciliary tip, where it phosphorylates the kinesin-2 subunit KIF3A and regulates IFT turnaround and transport, so controlling ciliogenesis, cilium length and ciliary localization of Hedgehog pathway components.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0042073
    label: intraciliary transport
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0097542
    label: ciliary tip
  - id: GO:0005929
    label: cilium
  substrates:
  - id: UniProtKB:Q9Y496
    label: KIF3A
  supported_by:
  - reference_id: PMID:24797473
    supporting_text: ICK directly phosphorylated Kif3a, while inhibition of this Kif3a phosphorylation affected ciliary formation
  - reference_id: PMID:24853502
    supporting_text: these results indicate that ICK plays a crucial role in controlling ciliary length
proposed_new_terms: []
suggested_questions:
- question: Should CILK1's IFT role be captured with regulation terms (e.g. regulation of intraciliary anterograde/retrograde transport, GO:1905796/GO:1905799) rather than direct participation in intraciliary transport, given that it is a kinase acting on the motor rather than part of the transport machinery?
- question: Why does CILK1 loss elongate cilia in fibroblasts but impair ciliogenesis in some neuronal progenitors, and is a negative regulation of cilium assembly annotation warranted?
- question: Is nuclear localization of endogenous CILK1 physiologically relevant (e.g. for activation by CCRK), or an artefact of overexpression?
suggested_experiments:
- description: Phospho-proteomics of cilia from CILK1-knockout versus kinase-dead knock-in human cells to identify substrates beyond KIF3A (e.g. IFT-B subunits) and map the sites.
- description: Live imaging of IFT train turnaround at the ciliary tip in CILK1-null and KIF3A phospho-site mutant cells to test whether KIF3A phosphorylation alone accounts for CILK1's effect on IFT.
