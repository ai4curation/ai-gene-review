id: Q9UPZ9
gene_symbol: CILK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CILK1 (ciliogenesis associated kinase 1; formerly ICK, intestinal cell kinase, or MRK) is a serine/threonine protein kinase of the CMGC group. It is closely related to MAK and to C. elegans DYF-5 and Chlamydomonas LF4, and has a MAPK-like TDY activation motif. Full activation needs autophosphorylation of Tyr-159 followed by phosphorylation of Thr-157 by the CDK-activating kinase CCRK/CDK20. CILK1 travels into the cilium and concentrates at the ciliary tip, where it phosphorylates the kinesin-2 motor subunit KIF3A and regulates IFT turnaround and the speed of intraflagellar transport. Loss of CILK1 causes IFT-A, IFT-B and BBSome components to accumulate at ciliary tips, mislocalizes Hedgehog pathway components and changes cilium length; in many cell types cilia become elongated, while some neuronal progenitors show defective ciliogenesis. Overexpressed GFP-tagged CILK1 has been seen in the nucleus. A recessive CILK1 R272Q mutation, which impairs kinase activity and nuclear localization, causes the neonatal lethal ciliopathy endocrine-cerebro-osteodysplasia (ECO). Other variants cause cranioectodermal dysplasia, and heterozygous variants are associated with juvenile myoclonic epilepsy.
