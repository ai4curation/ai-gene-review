- term:
    id: GO:1902856
    label: negative regulation of non-motile cilium assembly
  evidence_type: ISS
  original_reference_id: PMID:24853502
  qualifier: involved_in
  review:
    summary: Proposed NEW annotation. Loss or kinase-dead/ECO-mutant ICK elongates primary cilia, and
      ICK knockdown lengthens cilia of renal epithelial cells; ICK restrains primary cilium length.
    action: NEW
    reason: 'GO has no cilium-length term; length restriction is represented as negative regulation of
      (non-motile) cilium assembly, the term mouse Mak already carries for the same phenotype (IMP/IDA,
      PMID:21148103), a direct RCK comparator. Participation: CILK1 itself phosphorylates KIF3A at the
      tip to regulate IFT turnaround, i.e. it performs the regulatory step. Evidence is from mouse cells,
      hence ISS. Note that in some cell types ICK loss impairs ciliogenesis, so the effect is cell-type
      dependent.'
    supported_by:
    - reference_id: PMID:24853502
      supporting_text: In cultured cells, down-regulation of Ick or overexpression of kinase-dead or ECO
        syndrome mutant ICK resulted in an elongation of primary cilia and abnormal Sonic hedgehog (Shh)
        signaling.
    - reference_id: PMID:24853502
      supporting_text: Taken together, these results indicate that ICK plays a crucial role in controlling
        ciliary length and that ciliary defects caused by a lack of functional ICK leads to abnormal Shh
        signaling, resulting in congenital disorders such as ECO syndrome.
    - reference_id: PMID:25243405
      supporting_text: Here we show that Intestinal Cell Kinase (ICK) and MAPK/MAK/MRK overlapping kinase
        (MOK), two members of this family, localize to cilia of mouse renal epithelial (IMCD-3) cells
        and negatively regulate cilium length.
