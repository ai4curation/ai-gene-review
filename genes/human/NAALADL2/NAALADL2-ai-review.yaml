      two-hybrid, a system with well-known limitations for transmembrane baits, and
      none has any established functional connection to NAALADL2.
    action: MARK_AS_OVER_ANNOTATED
    reason: High-throughput Y2H evidence, uninformative 'protein binding' term, and
      partners (all polytopic/single-pass membrane proteins with no shared pathway)
      that suggest sticky-bait artifact rather than a defined molecular function;
      over-annotation per project guidance discouraging bare protein binding.
