taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NAALADL2 (inactive N-acetylated-alpha-linked acidic dipeptidase-like protein 2) is a predicted
  single-pass type II membrane glycoprotein of the M28 metallopeptidase family (M28B subfamily, related
  to glutamate carboxypeptidase II / NAALADase / PSMA and, more distantly, the transferrin receptors).
  Unlike active family members, NAALADL2 lacks the
  conserved zinc-binding and active-site residues and is predicted to be catalytically inactive (no peptidase/hydrolase
  activity). Its molecular function is not established. The gene spans a very large (1.37 Mb), structurally
  variable, extensively alternatively spliced locus at 3q26.3 that is severed by a Cornelia de
  Lange-associated translocation breakpoint (though no CdLS point mutations were found), and it has been
  linked through genetic association to several traits and cancers. Expression is strongest in kidney and
  placenta, with embryonic expression in duodenal and stomach endoderm, mesonephros, metanephros and
  pancreas, but a defined biochemical or cellular role for the protein remains unknown.
