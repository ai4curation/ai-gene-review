    summary: Generic 'protein binding' from a large-scale binary interactome screen
      (Rolland et al. 2014). The five IntAct-curated partners behind the five GOA
      rows - GPR25 (O00155), GRM2 (Q14416), LAPTM4B (Q86VI4), SLC30A3 (Q99726) and
