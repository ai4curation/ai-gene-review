id: P29475
gene_symbol: NOS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NOS1 encodes neuronal nitric-oxide synthase, a calmodulin-regulated homodimeric flavoheme enzyme that
  oxidizes L-arginine to L-citrulline and nitric oxide using NADPH, FAD, FMN, heme and tetrahydrobiopterin cofactors.
  Its PDZ-containing isoforms localize the enzyme to neuronal, sarcolemmal and other signaling complexes where locally
  produced nitric oxide regulates synaptic, vascular and cardiac ion-transport pathways, and the enzyme can also
  S-nitrosylate protein targets in stress-linked neuronal contexts.'
