core_functions:
- description: NOS1 catalyzes the NADPH- and oxygen-dependent oxidation of L-arginine to nitric oxide and
    L-citrulline through heme, FMN, FAD, tetrahydrobiopterin and calmodulin-dependent electron transfer.
  molecular_function:
    id: GO:0004517
    label: nitric-oxide synthase activity
  directly_involved_in:
  - id: GO:0006809
    label: nitric oxide biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0042383
    label: sarcolemma
  supported_by:
  - reference_id: file:human/NOS1/NOS1-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=2 L-arginine + 3 NADPH + 4 O2 + H(+) = 2 L-citrulline + 2 nitric oxide + 3
      NADP(+) + 4 H2O
  - reference_id: PMID:35772285
    supporting_text: Neuronal NOS (nNOS) catalyzes the oxidation of L-arginine in the central nervous system
      (CNS) to produce NO
- description: The NOS1 PDZ region targets the enzyme into sarcolemmal and synaptic signaling assemblies where
    nNOS-derived nitric oxide locally controls ion channels, cardiac electrophysiology and smooth-muscle tone.
  molecular_function:
    id: GO:0004517
    label: nitric-oxide synthase activity
  directly_involved_in:
  - id: GO:0038060
    label: nitric oxide-cGMP-mediated signaling
  locations:
  - id: GO:0042383
    label: sarcolemma
  supported_by:
  - reference_id: PMID:7545544
    supporting_text: Nitric oxide (NO) is synthesized in skeletal muscle by neuronal-type NO synthase (nNOS),
      which is localized to sarcolemma of fast-twitch fibers.
  - reference_id: file:human/NOS1/NOS1-uniprot.txt
    record_section:
    - CC:DOMAIN
    supporting_text: The PDZ domain participates in protein-protein interaction, and is responsible for
      targeting nNos to synaptic membranes.
suggested_questions:
- question: Which human NOS1 splice isoforms carry the dominant nNOS catalytic output in skeletal muscle,
    atrial muscle and neuronal synapses?
suggested_experiments:
- description: Quantify isoform-specific NOS1 localization and L-arginine-to-NO flux after endogenous tagging
    in human myotube, atrial myocyte and neuronal models.
