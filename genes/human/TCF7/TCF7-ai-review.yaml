id: P36402
gene_symbol: TCF7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TCF7 is a nuclear HMG-box DNA-binding transcription factor of the TCF/LEF family.
  Its HMG domain binds RNA polymerase II cis-regulatory DNA and its conserved N-terminal region
  recruits beta-catenin, allowing TCF7-containing complexes to switch Wnt target loci between
  TLE/Groucho-associated repression and beta-catenin-dependent transcriptional activation
  in lymphoid and epithelial contexts.'
