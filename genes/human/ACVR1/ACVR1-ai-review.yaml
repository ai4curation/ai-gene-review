id: Q04771
gene_symbol: ACVR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACVR1, also called ALK2, is a single-pass plasma-membrane type I serine/threonine kinase receptor
  in the TGF-beta receptor superfamily. It acts mainly as a BMP-family receptor, partnering with type-II
  receptors to transmit BMP and AMH-family cues to SMAD1/5/8 and other downstream responses. Human and
  vertebrate data connect this receptor activity to osteogenic, cardiac, vascular and iron-homeostasis
  contexts, while older activin-receptor nomenclature should not be read as normal activin signaling by ALK2.
