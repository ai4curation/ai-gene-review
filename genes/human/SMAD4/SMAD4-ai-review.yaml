- term:
    id: GO:0060412
    label: ventricular septum morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P97471
  - ensembl:ENSMUSP00000025393
  review:
    summary: Myocardial SMAD4 supports ventricular septation and ventricular wall morphogenesis in mouse
      embryos.
    action: KEEP_AS_NON_CORE
    reason: Early myocardial Smad4 deletion in mouse embryos produces ventricular septal defects, reduced
      trabeculation and thinning of the compact ventricular myocardium. This independently supports the
      transferred ventricular morphogenesis role. The late cardiomyocyte deletion study primarily establishes
      adult remodeling, so the developmental claim is grounded in the early-deletion experiment.
    supported_by:
    - reference_id: PMID:20877696
      supporting_text: myocardial Smad4 conditional knockout fetuses exhibited cardiac defects, including
        double-outlet right ventricle (DORV) (Fig. 4D,H), ventricular septal defect (VSD) (Fig. 4D,H),
        decreased density of trabeculae in the ventricles and thinning of the compact layer of the ventricular
        myocardium (Fig. 4B,D,H,F).
