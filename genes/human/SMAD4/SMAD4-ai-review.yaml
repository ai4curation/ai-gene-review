  review:
    summary: The mouse conditional knockout and human GATA4 interaction study links SMAD4 to endocardial
      activation, proliferation, EMT and valve/septal development.
    action: KEEP_AS_NON_CORE
    reason: The mouse conditional knockout and human GATA4 interaction study links SMAD4 to endocardial
      activation, proliferation, EMT and valve/septal development. Preserve the tissue-specific scope
      rather than treating these as universal SMAD4 outputs.
    supported_by:
    - reference_id: PMID:21330551
