  - ensembl:ENSMUSP00000025393
  review:
    summary: The mouse conditional knockout and human GATA4 interaction study links SMAD4 to endocardial
      activation, proliferation, EMT and valve/septal development.
    action: KEEP_AS_NON_CORE
    reason: The mouse conditional knockout and human GATA4 interaction study links SMAD4 to endocardial
      activation, proliferation, EMT and valve/septal development. Preserve the tissue-specific scope
      rather than treating these as universal SMAD4 outputs.
    supported_by:
    - reference_id: PMID:21330551
      supporting_text: 'Endothelial-specific knockout of Smad4 caused an absence of valve-forming activity:
        Smad4-deficient endocardium was associated with acellular endocardial cushions, absent epithelial-to-mesenchymal
        transformation, reduced endocardial proliferation, and loss of Id2 expression in valve-forming
        regions.'
    - reference_id: PMID:21330551
      supporting_text: Gata4 and Smad4 cooperatively activated the Id2 promoter, that human GATA4 mutations
        abrogated this activity, and that Id2 deficiency in mice could cause atrioventricular septal defects.
