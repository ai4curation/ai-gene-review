id: Q13485
gene_symbol: SMAD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMAD4 is the common SMAD transcription factor shared by the TGF-beta superfamily signaling
  branches. It associates with activated SMAD2/3 in activin, Nodal and TGF-beta responses and with BMP-responsive
  SMADs in BMP signaling. These complexes accumulate in the nucleus, bind regulatory DNA and recruit transcription
  factors, coactivators or corepressors to control cell-specific gene programs. SMAD4 acts as a transcriptional
  co-SMAD rather than a receptor kinase. Its outputs include epithelial growth restraint and remodeling,
  developmental patterning, tissue homeostasis, and hepcidin-mediated iron regulation. Alteration of SMAD4
  function disrupts these programs and contributes to juvenile polyposis and cancer; its effects on proliferation
  and other pathways depend on cell and signaling context.
