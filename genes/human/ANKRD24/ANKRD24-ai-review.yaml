id: Q8TF21
gene_symbol: ANKRD24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD24 (ankyrin repeat domain-containing 24) is a stereocilia rootlet protein of inner-ear
  hair cells. It has a membrane-binding N-terminus, five ankyrin repeats and two coiled-coil regions that
  mediate self-association and binding to TRIOBP-5. It forms a ring at the stereocilia insertion point,
  where the stereocilium pivots, and an annular shell around TRIOBP-5 along the lower rootlet. There it
  links the apical plasma membrane to the rootlet and holds TRIOBP-5 in place, so that rootlets form compact,
  durable actin bundles. TRIOBP-5 recruits ANKRD24 to rootlets, and TPRN is needed to keep both there.
  Ankrd24 knockout mice develop progressive hearing loss and fragile hair bundles, and a homozygous ANKRD24
  frameshift causes recessive nonsyndromic hearing loss in humans. One study, available here as an abstract
  only, links ANKRD24 to HMGCS2-driven autophagy.
