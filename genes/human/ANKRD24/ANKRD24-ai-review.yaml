    supporting_text: This approach identified a novel homozygous frameshift variant c.1934_1937del; (p.Thr645Lysfs*52)
      in ANKRD24, which segregated with the HL phenotype in the family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Single consanguineous family; human genetic support for the mouse phenotype.
