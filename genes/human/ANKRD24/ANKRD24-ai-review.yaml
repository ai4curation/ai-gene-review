- id: PMID:35175278
  title: ANKRD24 organizes TRIOBP to reinforce stereocilia insertion points.
  findings:
  - statement: ANKRD24 rings the stereocilia insertion point.
    supporting_text: ANKRD24 concentrates at the stereocilia insertion point, forming a ring at the junction
      between the lower and upper rootlets.
  - statement: ANKRD24 binds TRIOBP-5.
    supporting_text: Annular ANKRD24 continues into the lower rootlet, where it surrounds and binds TRIOBP-5,
      which itself bundles rootlet F-actin.
  - statement: Membrane association needs the N-terminus and ANK domain.
    supporting_text: Plasma membrane localization of ANKRD24 thus requires both the N-terminus and the
      ANK domain
  - statement: Ankrd24 knockout causes progressive hearing loss.
    supporting_text: Ankrd24KO/KO mice show progressive hearing loss and diminished recovery of auditory
      function after noise damage, as well as increased susceptibility to overstimulation of the hair
      bundle.
  - statement: ANKRD24 and TRIOBP-5 depend on each other for rootlet localization.
    supporting_text: ANKRD24 relies on TRIOBP-5 for rootlet targeting, while reciprocally, ANKRD24 controls
      the rootlet distribution of TRIOBP-5.
  - statement: ANKRD24 sits outside the TRIOBP layer that contacts actin.
    supporting_text: ANKRD24 fills the actin-free region, while TRIOBP is more tightly associated with
      rootlet F-actin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse. Defining study and the source of every mouse annotation transferred
      to human.
- id: PMID:40471101
  title: Taperin bundles F-actin at stereocilia pivot points enabling optimal lifelong mechanosensitivity.
  findings:
  - statement: TPRN is required to keep TRIOBP-5 and ANKRD24 at rootlets.
    supporting_text: Stereocilia that lack TPRN develop warped rootlets with gradual loss of TRIOBP-5
      and ANKRD24 from mechanosensory rows starting postnatally.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse. Places ANKRD24 downstream of taperin at the pivot point.
- id: PMID:39434538
  title: A Frameshift Variant in ANKRD24 Implicates Its Role in Human Non-Syndromic Hearing Loss.
  findings:
