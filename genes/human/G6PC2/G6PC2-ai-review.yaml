core_functions:
- description: Hydrolyzes D-glucose 6-phosphate to D-glucose and inorganic phosphate
    at the luminal face of the endoplasmic reticulum membrane of pancreatic beta cells.
    Because beta cells are not gluconeogenic and do not export glucose, this activity
    does not contribute free glucose to the circulation; instead it opposes glucokinase
    to create a glucose/glucose-6-phosphate substrate cycle that lowers glycolytic
    flux and so raises the glucose threshold for insulin release. Its specific activity
    is markedly lower than that of the liver enzyme G6PC1, consistent with a rate-setting
    rather than a bulk-flux role.
  molecular_function:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  directly_involved_in:
  - id: GO:0051156
    label: glucose 6-phosphate metabolic process
  - id: GO:0061179
    label: negative regulation of insulin secretion involved in cellular response
      to glucose stimulus
  - id: GO:0042593
    label: glucose homeostasis
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  anatomical_locations:
  - id: CL:0000169
    label: type B pancreatic cell
  substrates:
  - id: CHEBI:61548
    label: D-glucopyranose 6-phosphate(2-)
  supported_by:
  - reference_id: PMID:14722102
    supporting_text: These data demonstrate that IGRP is likely the authentic islet-specific
      glucose-6-phosphatase catalytic subunit
  - reference_id: PMID:23274894
    supporting_text: G6pc2 represents a novel, negative regulator of basal GSIS that
      acts by hydrolyzing glucose-6-phosphate, thereby reducing glycolytic flux
  - reference_id: PMID:32569842
