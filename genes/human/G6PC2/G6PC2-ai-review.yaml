- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-70263
  qualifier: involved_in
  review:
    summary: >-
      Reactome places its islet G6PC2 reaction inside the hepatic and renal Gluconeogenesis
      pathway, although the pathway's own summary confines gluconeogenesis to liver and
      kidney and the reaction's own summary places the enzyme in islet cells.
    action: REMOVE
    reason: >-
      This row is the one gluconeogenesis assertion the mouse review did not have, and it is
      a curated statement, so it was examined on its own terms rather than dismissed as an
      electronic mapping. The assertion rests on pathway placement, not on any measurement:
      R-HSA-3266566, "G6PC2 hydrolyzes G6P to form Glc and Pi (islet)", is a contained event
      of R-HSA-70263 Gluconeogenesis (confirmed through the Reactome ContentService, which
      returns R-HSA-70263 for that reaction and lists the liver G6PC, ubiquitous G6PC3 and
      islet G6PC2 hydrolysis reactions side by side), and its only literature reference is
      the enzymology paper PMID:14722102, which measures the reaction and says nothing about
      gluconeogenesis. Reactome's own text contradicts the placement twice over: the pathway
      summary states that gluconeogenesis is confined to liver and kidney cells, and the
      reaction summary states that this enzyme is expressed in islet cells. The underlying
      biology is the same as for the IBA row: in islet cells the substrate is
      glucokinase-derived G6P, the reaction closes a futile cycle rather than completing a
      route from non-carbohydrate precursors, and islet cells do not export glucose to the
      blood. So the reaction is real and correctly curated, but its membership of this
      pathway is not, and GOA inherits the error as a gluconeogenesis annotation. Removed,
      consistently with the IBA and IEA rows, and recorded as a source defect for Reactome.
      Note the contrast with the human G6PC3 review, which keeps the equivalent Reactome row
      as non-core: there the ubiquitous paralog has its own experimental glucose-production
      evidence (PMID:15661744 in astrocytes), whereas no study places G6PC2 activity in
      glucose production in any tissue.
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      record: Reactome:R-HSA-3266566
      slot: hasEvent
      requested_change: CHECK
      asserted_value: Reactome:R-HSA-70263
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        The reaction "G6PC2 hydrolyzes G6P to form Glc and Pi (islet)" (R-HSA-3266566) is a
        contained event of the pathway "Gluconeogenesis" (R-HSA-70263), whose summary states
        that gluconeogenesis is confined to cells of the liver and kidney, while the
        reaction's own summary states that G6PC2 is expressed in islet cells of the
        pancreas. GOA derives a TAS gluconeogenesis annotation for G6PC2 from this
        placement. In islet cells the enzyme hydrolyses glucose 6-phosphate made from
        glucose by glucokinase, forming a substrate cycle that sets the glucose sensitivity
        of insulin secretion (PMID:23274894, PMID:25552595) and of glucagon secretion
        (PMID:39742505); it does not complete a route from non-carbohydrate precursors, and
        islet cells do not release glucose into the blood. Please consider moving the islet
        reaction out of Gluconeogenesis, for example into a pathway for islet
        glucose/glucose-6-phosphate cycling, keeping the liver (G6PC) and ubiquitous (G6PC3)
        reactions where they are. The reaction's ER-membrane and ER-lumen compartments are
        sound and the ER membrane TAS derived from it should be retained.
      supported_by:
      - reference_id: Reactome:R-HSA-70263
        supporting_text: Gluconeogenesis is confined to cells of the liver and kidney
      - reference_id: Reactome:R-HSA-3266566
        supporting_text: This enzyme is expressed in islet cells of the pancreas (Petrolonis
          et al. 2004).
    supported_by:
    - reference_id: Reactome:R-HSA-70263
      supporting_text: Gluconeogenesis is confined to cells of the liver and kidney
    - reference_id: Reactome:R-HSA-3266566
      supporting_text: This enzyme is expressed in islet cells of the pancreas (Petrolonis et
