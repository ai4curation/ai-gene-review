proposed_new_terms:
- proposed_name: glucose-glucose 6-phosphate substrate cycle
  proposed_definition: A glucose 6-phosphate metabolic process in which glucose is
    phosphorylated to glucose 6-phosphate and glucose 6-phosphate is concurrently
    hydrolyzed back to glucose within the same cell, with net consumption of ATP and
    no net change in the concentration of either metabolite, such that the ratio of
    the two opposing activities sets the rate of glycolytic flux.
  justification: G6PC2 and glucokinase together form exactly such a cycle in pancreatic
    islet cells, and the cycle rather than either enzyme alone is what determines
    the glucose set point for insulin and glucagon secretion. GO currently offers
    no term for a substrate (futile) cycle in carbohydrate metabolism, so the biology
    has to be split across the generic glucose 6-phosphate metabolic process term
    and a separate hormone-secretion regulation term, losing the fact that the two
    are mechanistically the same event. A dedicated term would also serve GCK, G6PC1
    and hepatic glucose cycling.
  proposed_parent:
    id: GO:0051156
    label: glucose 6-phosphate metabolic process
  supported_by:
  - reference_id: PMID:32569842
    supporting_text: G6PC2 acts in conjunction with the beta cell glucose sensor, glucokinase,
      to create a futile substrate cycle that determines the rate of beta cell glycolytic
      flux
  - reference_id: PMID:32213654
    supporting_text: a glucokinase/G6PC2 futile cycle, rather than glucokinase alone,
      determines the rate of beta cell glycolytic flux and hence the sensitivity of
      GSIS to glucose
suggested_questions:
- question: What accounts for the roughly order-of-magnitude lower specific activity
    of G6PC2 relative to G6PC1 beyond the substrate-cavity residues already identified,
    and is the low turnover itself adaptive for an enzyme whose role is to set a threshold
    rather than to carry bulk flux?
  experts:
  - Richard M. O'Brien
  - Emily M. Hawes
  - Derek P. Claxton
- question: Does G6PC2 depend on the ER glucose-6-phosphate transporter SLC37A4 to
    supply luminal substrate, as G6PC1 does? This matters practically, because the
    best-characterized G6PC2 inhibitor also inhibits SLC37A4, confounding interpretation
    of islet experiments.
  experts:
  - Richard M. O'Brien
  - Jamey D. Young
- question: Is the rs492594 (Val219Leu) CRAC-motif variant functionally consequential
    in intact human islets? Its in vitro effect depends on whether cholesterol is
    present, which could reconcile the disputed human association data.
  experts:
  - Emily M. Hawes
  - Richard M. O'Brien
- question: Given that G6PC2 acts in both beta and alpha cells, what is the net effect
    of systemic partial G6PC2 inhibition on glucose control in humans, and how narrow
    is the therapeutic window before hypoglycemia risk emerges?
  experts:
  - Klaus H. Kaestner
  - Varun Bahl
  - Richard M. O'Brien
- question: The Human Protein Atlas reports G6PC2 as enriched in retina as well as
    pancreas, and one annotated isoform derives from a retinal cDNA. Is there any
    G6PC2 protein or enzyme activity in retina, and does it have a function there?
  experts: []
suggested_experiments:
- hypothesis: G6PC2 requires SLC37A4-mediated transport of glucose-6-phosphate into
    the ER lumen for its physiological activity in beta cells.
  description: Generate beta-cell-specific Slc37a4 knockout islets and measure glucose
    cycling with dual-labelled glucose tracers, glucose-6-phosphatase activity in
    intact microsomes, and the glucose dose-response curve for insulin secretion.
    Compare against G6pc2 knockout islets; if the two phenocopy each other, transport
    dependence is established. Test epistasis in double knockouts.
  experiment_type: Conditional knockout mouse genetics with metabolic flux analysis
- hypothesis: The low catalytic efficiency of G6PC2 relative to G6PC1 is functionally
    required, so that raising G6PC2 turnover would shift the glucose set point rather
    than simply increasing cycling.
  description: Use the substrate-cavity substitutions already shown to raise G6PC2
    activity (H308D or H308E, modelled on the R40-D310 ion pair of G6PC1) to create
    knock-in mice or transduced human pseudo-islets expressing a higher-activity G6PC2.
    Measure the glucose dose-response for insulin secretion, fasting blood glucose,
    and hypoglycemia susceptibility during prolonged fasting.
  experiment_type: Structure-guided knock-in and gain-of-function physiology
- hypothesis: G6PC2 protein is a substantially larger contributor to the beta-cell
    MHC class I peptidome than its abundance would predict, because of its rapid proteasomal
    turnover.
  description: Perform immunopeptidomics by mass spectrometry on HLA-A2-positive human
    islets or stem-cell-derived beta cells, comparing wild-type with CRISPR G6PC2
    knockout, with and without proteasome inhibition, and quantify G6PC2-derived peptides
    against total protein abundance measured by parallel proteomics. This tests whether
    autoantigenicity follows from turnover rate rather than from expression level
    alone.
  experiment_type: HLA immunopeptidomics with isogenic knockout controls
- hypothesis: The alpha-cell and beta-cell contributions of G6PC2 to glycemia can
    be separated pharmacologically.
  description: Administer a G6PC2-selective inhibitor to mice carrying alpha-cell-specific
    or beta-cell-specific G6pc2 deletion and measure fasting glucose, glucagon and
    insulin. If the compound retains an effect only in the cell type that still expresses
    G6PC2, the two arms are independent, and the dose-response of each arm can be
    measured separately to define a therapeutic window. A mouse-active, SLC37A4-sparing
    compound would first need to be identified, since the current tool compound does
    not inhibit mouse G6PC2 and also hits SLC37A4.
  experiment_type: Pharmacological epistasis in conditional knockout mice
