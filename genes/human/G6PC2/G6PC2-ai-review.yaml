- term:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  evidence_type: EXP
  original_reference_id: PMID:14722102
  qualifier: enables
  review:
    summary: Direct experimental demonstration that recombinant human G6PC2/IGRP hydrolyzes
      glucose-6-phosphate, with measured kinetics and a selective inhibitor that spares
      the liver enzyme. This is the primary evidence for the core molecular function.
    action: ACCEPT
    reason: This annotation settled a question that had been open since the gene was
      cloned. The 1999 cloning study could detect no phosphatase activity at all,
      and papers as late as 2004 still described the protein as having no known catalytic
      activity. Petrolonis et al. resolved this by expressing the protein at high
      level in insect cells, where hydrolysis of glucose-6-phosphate is measurable
      with a Km of 0.45 mM. The reconciliation is that the specific activity of G6PC2
      is genuinely low relative to G6PC1, not that it is absent; the same low activity
      is why later mutagenesis studies also had to resort to high-expression vectors.
      Physiological relevance is confirmed independently, since glucose-6-phosphatase
      activity and glucose cycling are lost in islets from G6pc2-null mice.
    supported_by:
    - reference_id: PMID:14722102
      supporting_text: These data demonstrate that IGRP is likely the authentic islet-specific
        glucose-6-phosphatase catalytic subunit
    - reference_id: PMID:10078553
      supporting_text: the IGRP failed to show glucose phosphotransferase or phosphatase
        activity with p-nitrophenol phosphate, inorganic pyrophosphate, or a range
        of sugar phosphates hydrolyzed by the liver enzyme
    - reference_id: PMID:34954144
      supporting_text: Previous attempts to characterize such SNPs were limited by
        the very low inherent G6Pase activity and expression of G6PC2 protein in islet-derived
        cell lines.
    - reference_id: PMID:23274894
      supporting_text: Glucose-6-phosphatase activity was reduced, whereas basal cytoplasmic
        calcium levels were elevated in islets isolated from G6pc2 KO mice.
