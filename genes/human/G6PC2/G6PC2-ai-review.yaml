id: Q9NQR9
gene_symbol: G6PC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Glucose-6-phosphatase catalytic subunit 2 (G6PC2, EC 3.1.3.9), historically
  called IGRP (islet-specific glucose-6-phosphatase catalytic subunit-related protein),
  is the pancreatic-islet-restricted paralog of the liver/kidney enzyme G6PC1. It
  is a multi-pass integral endoplasmic reticulum membrane glycoprotein of nine transmembrane
  helices, with a luminal active site built on a type 2 phosphatidic acid phosphatase
  (PAP2) motif in which His-174 is the phosphoryl-accepting nucleophile and His-115
  the proton donor. G6PC2 hydrolyzes D-glucose 6-phosphate to D-glucose and inorganic
  phosphate, but its specific activity is far below that of G6PC1 — it eluded detection
  in the original expression assays and became measurable only in high-level heterologous
  systems, with the gap traced to divergent residues lining the substrate cavity.
  Because the islet is not a gluconeogenic tissue, this hydrolysis does not release
  glucose into the circulation; instead it runs against the beta-cell glucose sensor
  glucokinase to form a glucose/glucose-6-phosphate substrate cycle that lowers glycolytic
  flux and thereby raises the glucose threshold for insulin release. Loss of the gene
  in mice shifts the glucose-stimulated insulin secretion dose-response curve leftward
  and lowers fasting blood glucose without changing fasting plasma insulin, while
  predisposing to hypoglycemia during prolonged fasting or ketogenic feeding. The
  same set-point logic operates in pancreatic alpha cells, where G6PC2 governs glucose
  suppression of glucagon secretion. Common variants at the human G6PC2 locus are
  among the most reproducible determinants of fasting plasma glucose and beta-cell
  function. As a beta-cell-restricted, proteasomally degraded protein, G6PC2 is also
  a major source of MHC class I-presented peptides and a prominent CD8+ T-cell autoantigen
  in type 1 diabetes, though this antigenicity is a consequence of its expression
  pattern rather than of its enzymatic role.
alternative_products:
- name: '1'
  id: Q9NQR9-1
  description: Full-length 355-residue isoform containing all nine transmembrane helices
    and both catalytic histidines (His-115, His-174). This is the canonical, catalytically
    competent form, and the one characterized enzymatically and topologically.
- name: '2'
  id: Q9NQR9-2
  sequence_note: VSP_033648, VSP_033649
  description: Retinal cDNA-derived isoform in which residues 74-102 are replaced
    and residues 103-355 are absent. It terminates well upstream of the His-174 nucleophile
    and of most transmembrane helices, so it cannot form a functional phosphatase
    active site. No function has been described for it.
- name: '3'
  id: Q9NQR9-3
  sequence_note: VSP_046180, VSP_046181
  description: Pancreas cDNA-derived isoform in which residues 148-154 are replaced
    and residues 155-355 are absent. Like isoform 2 it lacks the His-174 nucleophile
    and the C-terminal ER-retention motif, so it is not expected to be a functional
    glucose-6-phosphatase. No function has been described for it.
