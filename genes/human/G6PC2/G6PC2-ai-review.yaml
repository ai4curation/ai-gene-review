  findings:
  - statement: >-
      Knockout islets have reduced glucose-6-phosphatase activity, and deletion shifts the
      glucose dose-response of insulin secretion leftward without changing its maximum.
    supporting_text: These data suggest that G6pc2 represents a novel, negative regulator of
      basal GSIS that acts by hydrolyzing glucose-6-phosphate, thereby reducing glycolytic
      flux.
  - statement: >-
      The authors considered and rejected a hepatic explanation for the human fasting-glucose
      association.
    supporting_text: The latter explanation appears less likely since human G6PC2 (6,35) and
      mouse G6pc2 (9,36) are only expressed in islets and not in liver.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. Mouse work, but it supplies the mechanism and the sign for the human
      insulin-secretion row, and it explicitly weighs the hepatic alternative that
      PMID:19669124 raises.
- id: PMID:25552595
  title: Novel stable isotope analyses demonstrate significant rates of glucose cycling in
    mouse pancreatic islets.
  findings:
  - statement: >-
      Islets cycle a substantial fraction of net glucose uptake, and cycling is abolished in
      G6pc2 knockout islets.
    supporting_text: glucose cycling was abolished in G6pc2 KO mouse islets, confirming that
      G6pc2 opposes the action of the glucose sensor glucokinase by hydrolyzing G6P
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. Direct flux evidence that the endogenous enzyme catalyses the islet
      glucose/G6P cycle, which is what makes the futile-cycle interpretation of the human
      genetics mechanistic rather than conjectural.
- id: PMID:32213654
  title: Pancreatic islet beta cell-specific deletion of G6pc2 reduces fasting blood glucose.
  findings:
  - statement: >-
      Beta-cell-specific deletion is sufficient to lower fasting glucose without changing
      fasting insulin.
    supporting_text: In adult mice, beta cell-specific deletion of G6pc2 was sufficient to
      reduce FBG without changing FPI.
  - statement: G6pc2 dominates islets, where G6pc1 is not detected.
    supporting_text: G6pc2 expression is much higher than G6pc3 in both pancreas and islets
      with G6pc1 expression not detected
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. Places the physiological action of G6PC2 in islet cells and argues it is
      unlikely to act in peripheral (including gluconeogenic) tissues.
- id: PMID:32569842
  title: G6PC2 confers protection against hypoglycemia upon ketogenic diet feeding and
    prolonged fasting.
  findings:
  - statement: G6pc2 knockout mice become hypoglycaemic on a ketogenic diet or a 24 h fast.
    supporting_text: blood glucose fell to 70 mg/dl or less in G6pc2 KO but not WT mice,
      suggesting that G6PC2 may have evolved, in part, to prevent hypoglycemia
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text. Mouse evidence that the set point G6PC2 defends matters physiologically;
      supports the glucose-homeostasis row and gives a rationale for the substrate cycle.
- id: PMID:34128214
  title: Haplotypes of the genes (GCK and G6PC2) underlying the glucose/glucose-6-phosphate
    cycle are associated with pancreatic beta cell glucose sensitivity in patients with newly
    diagnosed type 2 diabetes from the VNDS study (VNDS 11).
  findings:
  - statement: >-
      In 794 newly diagnosed type 2 diabetes patients, two G6PC2 variants were associated
      with both modelled parameters of insulin secretion and with fasting C-peptide.
    supporting_text: Two G6PC2 variants (rs13387347 and rs560887) were associated to both
      parameters of insulin secretion (DC and PC) and to fasting C-peptide levels
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. A second, independent human cohort linking G6PC2 variation to
      insulin-secretion parameters and beta-cell glucose sensitivity, with clamp-based insulin
      sensitivity measured separately. Still genetic association, so it corroborates rather
      than establishes.
- id: PMID:34954144
  title: Nonsynonymous single-nucleotide polymorphisms in the G6PC2 gene affect protein
    expression, enzyme activity, and fasting blood glucose.
  findings:
  - statement: >-
      Human G6PC2 expressed in islet-derived 832/13 cells gives measurable microsomal G6Pase
      activity, which several nonsynonymous variants reduce.
    supporting_text: The in vitro G6Pase assay showed that the Gly8Glu and Ile273Val variants
      did not affect activity, whereas the Gly114Arg, Met126Val, Val219Leu, and Phe256Leu
      variants were associated with reduced activity
  - statement: G6PC1 has much higher G6Pase activity than G6PC2 at matched protein expression.
    supporting_text: G6PC1 exhibited much higher G6Pase activity than G6PC2 in these in vitro
      assays
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. The key human functional-genetics paper, measuring activity of the human
      protein directly and tying variant effects on expression or activity to fasting blood
      glucose, which is what makes G6PC2 (rather than ABCB11) the effector gene at the locus.
- id: PMID:35176280
  title: Glucose-6-phosphatase catalytic subunit 2 negatively regulates glucose oxidation and
    insulin secretion in pancreatic β-cells.
  findings:
  - statement: >-
      G6pc2 deletion raises glycolytic and citric acid cycle flux by about 60% and roughly
      doubles glucose-stimulated insulin secretion in a beta-cell line.
    supporting_text: deletion of G6pc2 led to ∼60% increases in glycolytic and citric acid
      cycle (CAC) fluxes at both 5 and 11 mM glucose concentrations
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. Cell-autonomous evidence that the enzyme's activity sets glycolytic flux,
      which is the step the insulin-secretion refinement depends on.
- id: PMID:37855366
  title: G6PC1 and G6PC2 influence G6P flux but not HSD11B1 activity.
  findings:
  - statement: >-
      Overexpressing G6PC1 or G6PC2 blunts glucose-stimulated fusion-gene expression in islet
      cells without affecting glucocorticoid-stimulated expression.
    supporting_text: While overexpression of G6PC1 and G6PC2 blunted glucose-stimulated fusion
      gene expression, it had minimal effect on glucocorticoid-stimulated fusion gene
      expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text. Shows G6PC2 influences cytosolic G6P-dependent signalling in islet cells and
      does not measurably feed the luminal H6PD/HSD11B1 couple, which bears on what the
      lumenal reaction is for.
- id: PMID:38095063
  title: Identification of structural motifs critical for human G6PC2 function informed by
    sequence analysis and an AlphaFold2-predicted model.
  findings:
  - statement: >-
      Mutating one residue in each of the six regions of the predicted PAP2 motif of human
      G6PC2, including the predicted catalytic residues Arg79, His115, Arg168 and His174,
      significantly reduces G6P hydrolysis.
    supporting_text: The data show that individual mutation of residues in all six regions of
      the PAP2 motif resulted in a significant decrease in enzyme activity
  - statement: >-
      The AlphaFold2 model predicts a lumenal disulfide bond (Cys105-Cys243) required for
      protein expression and a substrate cavity whose residues affect specificity.
    supporting_text: These data indicate that these two cysteine residues are critical for
      G6PC2 expression, supporting the existence of an intramolecular disulfide bond in G6PC2,
      as suggested by the AF2 model.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. The strongest human-specific evidence for the molecular function, being
      mutagenesis of the human protein's catalytic motif assayed as G6P hydrolysis. No
      experimental structure exists, so the active-site geometry remains model-based, which
      the authors state.
- id: PMID:38431189
  title: Biochemical and metabolic characterization of a G6PC2 inhibitor.
  findings:
  - statement: Vmax for G6P hydrolysis is much lower for G6PC2 than for G6PC1.
    supporting_text: the observed Vmax for G6P hydrolysis by G6PC1 was considerably greater
      than that for G6PC2 and G6PC3
  - statement: The human G6PC2 inhibitor VU0945627 does not inhibit mouse G6PC2.
    supporting_text: VU0945627 does not inhibit mouse G6PC2 despite its 84% sequence identity
      with human G6PC2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text. Comparative kinetics of the three paralogs and species-specific inhibitor
      pharmacology; the latter is the reason to suspect the PMID:14722102 construct was
      human.
- id: PMID:39121091
  title: Multiple promoter and enhancer differences likely contribute to augmented G6PC2
    expression in human versus mouse pancreatic islet alpha cells.
  findings:
  - statement: >-
      G6PC2 is about 5-fold beta-cell biased in human but about 20-fold in mouse, which the
      authors took to mean an alpha-cell role would matter more in human.
    supporting_text: In contrast, in humans, relative to mice, G6PC2 expression is reduced in
      β-cells (695 vs 1097 RPLM) and elevated in α-cells (141 vs 59 RPLM)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text. Quantifies the human alpha-cell expression that makes the alpha-cell
      function relevant in this species, and predicted the role that PMID:39742505 then
      demonstrated. Its expectation that germline-knockout fasting glucagon data argue
      against a mouse alpha-cell role was superseded by the conditional knockout.
- id: PMID:39426930
  title: The role of glucose-6-phosphatase activity in glucose homeostasis and its potential
    for diabetes therapy.
  findings:
  - statement: >-
      The review frames G6PC1 and G6PC2 jointly as regulating glycolysis, gluconeogenesis and
      glycogenolysis, while stressing that the two have distinct tissue distributions,
      kinetics and physiological functions.
    supporting_text: Despite their structural and functional similarities, G6PC1 and G6PC2
      exhibit distinct tissue-specific expression patterns, G6P hydrolysis kinetics, and
      physiological functions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only; a 2025 review co-authored by the O'Brien group. Weighed explicitly
      against the gluconeogenesis removal, because its opening sentence lumps the two
      paralogs as regulating gluconeogenesis. That phrasing is a family-level summary, not an
      attribution of gluconeogenic flux to G6PC2, and the same group's primary papers
      (PMID:23274894, PMID:32213654) argue G6PC2 is unlikely to act in peripheral tissues.
- id: PMID:39742505
  title: G6PC2 controls glucagon secretion by defining the set point for glucose in pancreatic
    α cells.
  findings:
  - statement: >-
      Inducible alpha-cell-specific deletion of G6pc2 in mice shifts the glucose set point
      for suppression of amino-acid-stimulated glucagon secretion leftward, so that mutant
      islets secrete less glucagon at 0.5-5 mM glucose although secretion at zero glucose is
      unchanged.
    supporting_text: when incubated in the presence of 0.5mM, 1mM, 3mM, or 5mM glucose,
      α-G6PC2KO islets secreted significantly (P < 0.0001) less glucagon relative to control
      islets, confirming a left shift in the glucose response curve for glucagon release
  - statement: >-
      In vivo, fasting and glucose-suppressed plasma glucagon are lower in
      alpha-cell-specific knockouts with insulin unchanged, and islet composition, hormone
      content and proliferation are unaffected.
    supporting_text: revealed lower glucagon concentrations in both male and female α-G6PC2KO
      mice relative to controls
  - statement: >-
      G6PC2 protein is detectable in human alpha cells, and shRNA knockdown in sorted primary
      human alpha cells makes glucagon secretion more glucose-sensitive without changing
      glucagon content.
    supporting_text: we normalized the results to the KCl response, and found the
      shG6PC2-exressing α cell pseudoislets to be significantly (P < 0.05 at 1mM glucose, P <
      0.01 at 3, 5 and 9 mM glucose) more sensitive to glucose
  - statement: >-
      The glucose/G6P cycle runs in human alpha cells; 2-NBDG efflux falls on G6PC2
      knockdown.
    supporting_text: the efflux of 2-NBDG from human α cells was significantly reduced after
      shRNA-mediated suppression of G6PC2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. The basis of the NEW positive-regulation-of-glucagon-secretion row, and the
      only functional study of G6PC2 in alpha cells. The human arm is shRNA knockdown in
      sorted primary alpha cells from four donors plus allele-specific expression in four
      European donors, so the human claim rests on knockdown rather than on germline
      genetics. Limitations the authors state are that islet numbers precluded perifusion
      assays, that no pharmacological inhibitor was available, and that the allele-specific
      analysis was possible only in individuals of European ancestry.
- id: Reactome:R-HSA-3266566
  title: G6PC2 hydrolyzes G6P to form Glc and Pi (islet)
  findings:
  - statement: >-
      Reactome curates the G6PC2 reaction as an ER-membrane-associated hydrolysis of glucose
      6-phosphate by an enzyme expressed in islet cells.
    supporting_text: G6PC2 (Glucose-6-phosphatase 2), associated with the endoplasmic
      reticulum membrane catalyzes the hydrolysis of glucose-6-phosphate (G6P) to glucose
      (Glc) and orthophosphate (Pi).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reaction itself is correctly curated, with ER membrane and ER lumen compartments
      and PMID:14722102 as its only literature reference, and it soundly supports the ER
      membrane TAS. Its placement as an event of R-HSA-70263 Gluconeogenesis is what this
      review contests, and that is recorded as a source defect rather than as a problem with
      the reaction.
- id: Reactome:R-HSA-70263
  title: Gluconeogenesis
  findings:
  - statement: >-
      Reactome's own pathway summary restricts gluconeogenesis to liver and kidney cells,
      although the pathway contains the islet G6PC2 reaction.
    supporting_text: Gluconeogenesis is confined to cells of the liver and kidney
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      The pathway is correctly described but is the wrong parent for G6PC2's reaction, and it
      is the sole basis of the TAS gluconeogenesis annotation. Flagged MISCITED in the sense
      that the reference does not support the claim made for this gene, since the summary
      states gluconeogenesis is confined to liver and kidney while the contained G6PC2
      reaction is annotated as the islet reaction. Containment was confirmed through the
      Reactome ContentService.
- id: file:human/G6PC2/G6PC2-uniprot.txt
  title: human/G6PC2/G6PC2-uniprot.txt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The curated catalytic activity (ECO:0000269, PMID:14722102), kinetic parameters,
      subcellular location and topology (ECO:0000269, PMID:15044018), glycosylation site and
      mutagenesis, tissue specificity (ECO:0000269, PMID:11297555) and family assignments are
      all sound and were used as evidence. The FUNCTION comment is an out-of-date
      by-similarity statement and the PATHWAY line carries the gluconeogenesis claim this
      review rejects; both are recorded as source defects on the gluconeogenesis IEA row.
- id: file:human/G6PC2/G6PC2-bioinformatics/RESULTS.md
  title: human/G6PC2/G6PC2-bioinformatics/RESULTS.md
  findings:
  - statement: >-
      Human G6PC2 is islet- and pancreas-dominant, while G6PC1 dominates liver, kidney and
      intestine and is absent from sampled beta cells.
    supporting_text: '**G6PC1**: epithelial cell of pancreas absent (gold, 52); pancreatic
      ductal cell absent (silver, 49); type B pancreatic cell absent (gold, 49); islet of
      Langerhans present (gold, 69)'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Generated Bgee 15.2 report with the sister paralogs G6PC1 and G6PC3 as controls and the
      gluconeogenesis tissue context from the pathway-satisfiability engine. Used only as a
      consistency check, and more weakly than in the mouse review, because human G6PC2 has
      eight low present calls and no absent calls in the gluconeogenic context; absence
      cannot be invoked at all, so the decision rests on the literature with the paralog
      contrast as corroboration.
- id: file:human/G6PC2/G6PC2-deep-research-claude-code.md
  title: human/G6PC2/G6PC2-deep-research-claude-code.md
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Machine-generated lead list, checked against the cached papers and the UniProt record.
      Correct on identity, family and domains, topology, active-site and substrate-binding
      residues, kinetics, ER localisation and glycosylation, the futile-cycle model, the beta-
      and alpha-cell knockout results and the variant genetics. Three errors were found, none
      affecting the conclusions. It says activity and glucose cycling are abolished in
      knockout islets and credits that to PMID:32213654, whereas activity is reduced and the
      measurements are in PMID:23274894 and PMID:25552595. It presents the conserved-residue
      variant effects as tested only in mouse G6pc1 as a surrogate, which PMID:34954144
      superseded by assaying human G6PC2 directly. And it did not retrieve PMID:20668700, the
      source of both IMP rows, so its assessment of those rows was made without the evidence.
      Several of its sources are cited only as PMC ids or publisher URLs; no claim resting
      solely on those was used here.
core_functions:
- description: >-
    Integral ER-membrane glucose-6-phosphatase of pancreatic islet cells. G6PC2 hydrolyses
    glucose 6-phosphate delivered to the ER lumen back to glucose, opposing glucokinase in a
    glucose/glucose-6-phosphate substrate cycle. The cycle lowers glycolytic and citric acid
    cycle flux at submaximal glucose and so sets the glucose concentration at which each
    islet cell type changes its hormone output: in beta cells it shifts the glucose
    dose-response of insulin secretion to the right, and in alpha cells it raises the glucose
    set point for suppression of glucagon secretion. Through both arms it sets the fasting
    blood glucose level.
  molecular_function:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  directly_involved_in:
  - id: GO:0061179
    label: negative regulation of insulin secretion involved in cellular response to glucose
      stimulus
  - id: GO:0070094
    label: positive regulation of glucagon secretion
  - id: GO:0042593
    label: glucose homeostasis
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  anatomical_locations:
  - id: CL:0000169
    label: type B pancreatic cell
  - id: CL:0000171
    label: pancreatic A cell
  substrates:
  - id: CHEBI:61548
    label: D-glucopyranose 6-phosphate(2-)
  supported_by:
  - reference_id: PMID:38095063
    supporting_text: The data show that individual mutation of residues in all six regions of
      the PAP2 motif resulted in a significant decrease in enzyme activity
  - reference_id: PMID:15044018
    supporting_text: IGRP is a glycoprotein, held in the endoplasmic reticulum by nine
      transmembrane domains
  - reference_id: PMID:23274894
    supporting_text: These data suggest that G6pc2 represents a novel, negative regulator of
      basal GSIS that acts by hydrolyzing glucose-6-phosphate, thereby reducing glycolytic
      flux.
  - reference_id: PMID:39742505
    supporting_text: Using inducible, cell type-specific gene ablation of G6pc2 in mice we
      document a dramatic shift in the set-point for glucose suppression of glucagon
      secretion, resulting in more than half-maximal reduction in glucagon release from
      isolated islets at 1 mM glucose.
  - reference_id: PMID:25552595
    supporting_text: glucose cycling was abolished in G6pc2 KO mouse islets, confirming that
      G6pc2 opposes the action of the glucose sensor glucokinase by hydrolyzing G6P
  - reference_id: PMID:34954144
    supporting_text: low microsomal G6Pase activity could now be detected in vitro following
      transient expression of G6PC2 in 832/13 cells
  knowledge_gaps:
  - gap_statement: >-
      Which endoplasmic reticulum glucose-6-phosphate transporter supplies substrate to G6PC2
      in human islet cells is not established.
    boundary: >-
      The active site faces the ER lumen, so cytosolic G6P must be imported, and Reactome
      models three candidate antiporters (SLC37A1, SLC37A2 and SLC37A4) alongside the
      hydrolysis reactions. An inhibitor that also blocks SLC37A4 suppresses glucose cycling
      in a beta-cell line (PMID:38431189), but no human islet experiment has tested which
      transporter is required for G6PC2-dependent cycling.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The cycle's rate, and hence the glucose set point, could be limited by substrate import
      rather than by G6PC2 itself, which matters for designing G6PC2 inhibitors intended to
      lower fasting glucose.
    resolution: >-
      Knock down or delete each SLC37 transporter in human islets or stem-cell derived islet
      cells and measure glucose cycling, G6Pase activity in microsomes, and the glucose
      dose-responses of insulin and glucagon secretion.
    provenance:
    - reference_id: PMID:38431189
      supporting_text: VU0945627 is a mixed G6PC2 inhibitor, increasing the Km but reducing the
        Vmax for G6P hydrolysis.
  - gap_statement: >-
      How much of G6PC2's effect on human fasting blood glucose comes from alpha cells rather
      than beta cells is unknown.
    boundary: >-
      Both arms are now demonstrated, the beta-cell arm by mouse conditional deletion and
      islet secretion assays and the alpha-cell arm by mouse conditional deletion and
      knockdown in primary human alpha cells, and human G6PC2 is only about five-fold
      beta-biased against about twenty-fold in mouse (PMID:39121091). No experiment separates
      the two contributions to a human phenotype, and the authors of the alpha-cell study note
      that the allele frequencies and effect sizes make a human genetic test impractical.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      A G6PC2 inhibitor would act on both cell types, raising insulin and lowering glucagon;
      whether the net effect on blood glucose is additive depends on the relative
      contributions, which also bears on whether the two arms can be separated
      pharmacologically.
    provenance:
    - reference_id: PMID:39742505
      supporting_text: our data demonstrate that G6PC2 affects glycemic control via its action
        in α cells
suggested_questions:
- question: >-
    Should PAINT add an IRD for gluconeogenesis (GO:0006094) at the mammalian G6PC2 node
    PTN000287500 of PTHR12591, given that mammalian G6PC2 is restricted to pancreatic islet
    cells and that both its beta-cell and its alpha-cell knockout phenotypes are mediated by
    hormone secretion rather than by glucose output?
  experts:
  - O'Brien RM
- question: >-
    Should Reactome move the islet reaction R-HSA-3266566 out of the Gluconeogenesis pathway
    (R-HSA-70263), whose summary confines gluconeogenesis to liver and kidney, into a pathway
    representing islet glucose/glucose-6-phosphate cycling, so that the GOA TAS no longer
    asserts gluconeogenesis for G6PC2 while the ER membrane annotation is retained?
- question: >-
    Is a GO term warranted for the glucose set point of glucagon secretion, by analogy with
    GO:0061178 and GO:0061179 for insulin, so that the condition under which G6PC2 acts in
    alpha cells (glucose suppression of amino-acid-stimulated glucagon release) can be stated
    in the term rather than only in the annotation's summary?
- question: >-
    What structural features make G6PC2 turnover so much lower than G6PC1 at a similar Km,
    and is the low rate selected to tune rather than abolish glucokinase flux?
  experts:
  - O'Brien RM
- question: >-
    Does human G6PC2 hydrolyse luminal sugar phosphates other than glucose 6-phosphate? The
    substrate-cavity mutants of PMID:38095063 altered substrate specificity, so the wild-type
    specificity range is worth stating.
suggested_experiments:
- hypothesis: G6PC2 does not contribute to endogenous glucose production in human.
  description: >-
    Measure endogenous glucose production and gluconeogenic flux with stable-isotope tracers
    in carriers and non-carriers of G6PC2 loss-of-function coding alleles matched for fasting
    glucose, and in parallel measure G6Pase activity attributable to G6PC2 in human liver and
    kidney cortex microsomes with the G6PC2-selective inhibitor. Equal production would close
    the question that the nominal clamp association of PMID:19669124 leaves open.
  experiment_type: in vivo metabolic flux analysis with human genotype stratification
- hypothesis: >-
    The alpha-cell and beta-cell arms of G6PC2 function contribute separably to blood glucose.
  description: >-
    Delete or knock down G6PC2 in alpha cells, in beta cells, and in both, in human
    stem-cell-derived islets transplanted into immunodeficient mice, and measure insulin,
    glucagon and blood glucose across a glucose ramp. This separates contributions that a
    systemic inhibitor cannot.
  experiment_type: conditional knockout in humanised islet grafts
- hypothesis: >-
    An SLC37 antiporter is required to deliver glucose 6-phosphate to G6PC2 in human islet
    cells.
  description: >-
    Knock down SLC37A1, SLC37A2 and SLC37A4 individually in human islets and measure glucose
    cycling by stable-isotope flux analysis, microsomal glucose-6-phosphatase activity, and
    the glucose dose-responses of insulin and glucagon secretion, against a G6PC2 knockdown
    control.
  experiment_type: knockdown with metabolic flux analysis
- hypothesis: G6PC2 has a narrower substrate range than its paralogs G6PC1 and G6PC3.
  description: >-
    Purify human G6PC2, G6PC1 and G6PC3 by the protocol used for G6PC1 and compare their
    activity against a panel of sugar phosphates, including 1,5-anhydroglucitol 6-phosphate,
    to test whether G6PC2 is specialised for glucose 6-phosphate and to fix the wild-type
    specificity that the cavity mutants shifted.
  experiment_type: comparative enzyme kinetics
