- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0031463
  - MGI:MGI:1915651
  - MGI:MGI:95607
  - PANTHER:PTN000971890
  - RGD:2644
  - RGD:727875
  - UniProtKB:P35575
  review:
    summary: >-
      Gluconeogenesis propagated from the root G6PC node to the islet paralog. Human G6PC2
      is a pancreatic islet enzyme that cycles glucokinase-derived glucose 6-phosphate back
      to glucose to set the glucose sensitivity of insulin and glucagon secretion; it does
      not take part in making glucose from non-carbohydrate precursors.
    action: REMOVE
    reason: >-
      The IBD for gluconeogenesis was placed at PTN000971890, the eumetazoan node ancestral
      to G6PC1, G6PC2 and G6PC3, and is seeded only by G6PC1 (human, mouse, rat), G6pc3
      (mouse, rat) and a Drosophila member; no G6PC2 is a seed
      (interpro/panther/PTHR12591/PTHR12591-paint.tsv, dated 20241120). `just paint-losses
      human G6PC2` finds no IRD or IKR on the lineage, so the row is current and the
      disagreement is with the node reaching the G6PC2 clade (the path runs PTN000971890 to
      PTN002650241 to PTN000287500 to human PTN002488967, recorded in
      projects/BGEEDB_EXPRESSION/data/panther_leaves.tsv). Target-specific evidence shows
      that the process role diverged in that clade while the catalytic machinery was
      retained. (1) Human G6PC2 expression is predominantly pancreatic, with the protein
      in most islet cells, lower levels in testis, and low transcript in the other tissues
      Bgee samples (duodenum and kidney cortex score 38-51 against 99 in the islet); the
      cloning paper that established the islet pattern concluded that it points to a role in islet metabolism and
      insulin secretion. (2) In islet cells its substrate is G6P made from glucose by
      glucokinase, so its activity forms a futile substrate cycle that lowers glycolytic
      flux, not a route from pyruvate, lactate, glycerol or amino acids to glucose, which is
      what GO:0006094 denotes. Islet cells do not supply blood glucose. (3) The demonstrated
      consequences of the activity are hormonal set points: beta-cell deletion alone lowers
      fasting glucose in mouse (PMID:32213654), alpha-cell deletion lowers glucagon
      (PMID:39742505), and in human, coding variants that reduce the protein or its activity
      track with fasting glucose (PMID:34954144). (4) Bgee expression, used here only as a
      paralog-controlled consistency check, agrees but is weaker than in mouse: in the
      gluconeogenic tissues (liver, kidney cortex, small intestine) human G6PC2 has eight
      present calls and no absent calls, all low-scoring (best duodenum 50.5), with 2 of its
      top 10 tissues in that context, whereas G6PC1 is present at 97-98 in liver with 5 of
      its top 10 tissues there. Because human has no absent calls, expression cannot carry
      this decision at all and is cited as corroboration only. (5) The one direct
      measurement bearing on glucose production is human and nominal: among Danish elderly
      twins, carriers of the fasting-glucose-raising rs560887 G allele had higher basal
      hepatic glucose production (p = 0.04; PMID:19669124). It deserves more weight in a
      human review than in the mouse one, and it still does not establish participation: it
      is an unreplicated subgroup of 159 twins at a locus that also contains ABCB11, the
      same allele raised early insulin responses, and higher basal hepatic glucose output is
      the expected downstream consequence of a higher defended glucose level and lower
      insulin secretion. Pound et al. weighed exactly this alternative and judged it less
      likely because G6PC2 is expressed in islets and not liver (PMID:23274894). (6) A 2025
      review co-authored by the O'Brien group describes G6PC1 and G6PC2 together as
      regulating glycolysis, gluconeogenesis and glycogenolysis (PMID:39426930); that
      sentence lumps the two paralogs, and the same review's point, like the same group's
      primary data, is that they have distinct tissue distributions, kinetics and
      physiological functions. No measurement of gluconeogenic flux attributes any of it to
      G6PC2. Taken together the inherited process term is an over-propagation to a paralog
      co-opted for islet glucose sensing; the UniPathway IEA and the Reactome TAS are
      removed for the same reason.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000971890
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Root eumetazoan G6PC node. Its gluconeogenesis seeds are G6PC1 and G6pc3
          orthologs plus a fly member; the G6PC2 clade below it is pancreas-restricted and
          acts in an islet glucose/G6P cycle, so the process does not descend to it.
      residue_claims_not_applicable: The argument is a change of pathway role and tissue
        context with the catalytic site retained (UniProt active sites His115 and His174,
        confirmed functionally for the human protein in PMID:38095063), not a loss of
        catalytic residues, so no residue claim applies.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      requested_change: CHECK
      asserted_value: GO:0006094
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The gluconeogenesis IBD at PTN000971890 (PTHR12591) propagates to the G6PC2
        subfamily (PTHR12591:SF1), none of whose members is a seed. G6PC2 is restricted to
        the pancreas and hydrolyses glucokinase-derived G6P in a substrate cycle that sets
        the glucose sensitivity of insulin and glucagon secretion; beta-cell-specific
        deletion is sufficient for its fasting-glucose phenotype (PMID:32213654) and
        alpha-cell-specific deletion changes glucagon secretion (PMID:39742505). Consider an
        IRD for GO:0006094 at the mammalian G6PC2 node PTN000287500, where the evidence
        lies. This is the same request recorded in the mouse G6pc2 review; both mammalian
        orthologs descend from that node.
      supported_by:
      - reference_id: PMID:32213654
        supporting_text: In adult mice, beta cell-specific deletion of G6pc2 was sufficient to
          reduce FBG without changing FPI.
    supported_by:
    - reference_id: PMID:11297555
      supporting_text: Since IGRP gene expression is restricted to islets, this suggests a
        possible role in the regulation of islet metabolism and, hence, insulin secretion
        induced by metabolites.
    - reference_id: file:human/G6PC2/G6PC2-uniprot.txt
      record_section: ["CC:TISSUE SPECIFICITY"]
      supporting_text: Specifically expressed in pancreas and also detected to a lower extent
        in testis. Expressed by most islet cells in the pancreas (at protein level).
    - reference_id: PMID:25552595
      supporting_text: glucose cycling was abolished in G6pc2 KO mouse islets, confirming that
        G6pc2 opposes the action of the glucose sensor glucokinase by hydrolyzing G6P
    - reference_id: PMID:23274894
      supporting_text: The latter explanation appears less likely since human G6PC2 (6,35) and
        mouse G6pc2 (9,36) are only expressed in islets and not in liver.
    - reference_id: PMID:32213654
      supporting_text: In adult mice, beta cell-specific deletion of G6pc2 was sufficient to
        reduce FBG without changing FPI.
    - reference_id: file:human/G6PC2/G6PC2-bioinformatics/RESULTS.md
      supporting_text: '| gluconeogenesis (liver, cortex of kidney, small intestine) | G6PC2 |
        8 present, 0 absent | UBERON:0002114 duodenum (50.5) | 2/10 (0.9) | 0.67 |'
