  original_reference_id: PMID:20668700
  qualifier: involved_in
  review:
    summary: Human genetic evidence linking G6PC2 variation to first- and second-phase
      insulin secretion measured during an oral glucose tolerance test. The essence
      is right and central to G6PC2 biology, but the phenotypes assayed are specifically
      glucose-stimulated, and the mechanism is specifically a change in the glucose
