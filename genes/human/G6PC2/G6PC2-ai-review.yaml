- id: PMID:10078553
  title: Molecular cloning of a pancreatic islet-specific glucose-6-phosphatase catalytic
    subunit-related protein.
  findings:
  - statement: Original cloning of IGRP/G6PC2 from mouse insulinoma. The protein is
      about 50% identical to liver glucose-6-phosphatase with catalytic residues and
      an ER retention signal conserved, and expression is restricted to islets with
      beta-cell predominance.
    supporting_text: the mRNA was highly expressed in pancreatic islets and expressed
      more in beta-cell lines than in an alpha-cell line
  - statement: No phosphatase or phosphotransferase activity could be detected in
      transfection systems in which the liver enzyme was active, which is the origin
      of the long-standing view that the protein was catalytically inert.
    supporting_text: the IGRP failed to show glucose phosphotransferase or phosphatase
      activity with p-nitrophenol phosphate, inorganic pyrophosphate, or a range of
      sugar phosphates hydrolyzed by the liver enzyme
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Historically important as the negative-result source
      for the catalytic-activity controversy. The negative finding is not so much
      wrong as underpowered, since the specific activity of G6PC2 is very low and
      only became measurable in high-expression systems, so it is cited here as context
      rather than as a refutation of GO:0004346.
- id: PMID:11297555
  title: Cloning and characterization of the human and rat islet-specific glucose-6-phosphatase
    catalytic subunit-related protein (IGRP) genes.
  findings:
  - statement: Comparative genomics of the human, mouse and rat genes. The rat orthologue
      is a pseudogene owing to coding-sequence deletions and insertions plus a TATA-box
      mutation, so rat is not a usable model for G6PC2.
    supporting_text: the rat IGRP gene does not appear to encode a protein as a result
      of a series of deletions and insertions in the coding sequence
  - statement: Restates that catalytic activity was still undefined in 2001, two years
      after cloning.
    supporting_text: Its catalytic activity, however, has not been defined.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Source of the UniProt TISSUE SPECIFICITY line for
      Q9NQR9. Useful mainly for the rat-pseudogene caveat and for dating the catalytic-activity
      controversy.
- id: PMID:12815107
  title: Identification of the beta cell antigen targeted by a prevalent population
    of pathogenic CD8+ T cells in autoimmune diabetes.
  findings:
  - statement: Identifies IGRP/G6PC2 as the antigen of a prevalent pathogenic CD8+
      T cell population in NOD mice, the finding that made this protein a central
      type 1 diabetes autoantigen.
    supporting_text: we reveal that the autoantigen targeted by a prevalent population
      of pathogenic CD8+ T cells in nonobese diabetic mice is islet-specific glucose-6-phosphatase
      catalytic subunit-related protein (IGRP)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Establishes the autoantigen
      role that dominates the non-metabolic literature on this gene. Deliberately
      not used to support a GO biological process annotation, because being a target
      of autoreactive T cells is a property conferred by the beta-cell-restricted
      expression and proteasomal turnover of the protein, not an evolved function
      of the gene product.
- id: PMID:14722102
  title: Enzymatic characterization of the pancreatic islet-specific glucose-6-phosphatase-related
    protein (IGRP).
  findings:
  - statement: First demonstration of glucose-6-phosphatase catalytic activity for
      IGRP/G6PC2, using insect-cell overexpression, with kinetic constants and a selective
      inhibitor that does not affect the liver enzyme.
    supporting_text: IGRP overexpressed in insect cells possesses enzymatic activity
      comparable to the previously described G-6-Pase activity in islets.
  - statement: Measured kinetics for glucose-6-phosphate hydrolysis, the source of
      the Km recorded by UniProt.
    supporting_text: The K(m) and V(max) values determined using glucose-6-phosphate
      as the substrate were 0.45 mm and 32 nmol/mg/min by malachite green assay
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. The GOA EXP annotation for GO:0004346 and the UniProt
      CATALYTIC ACTIVITY evidence both derive from this paper. The cached record is
      abstract-only, but the kinetic values quoted here also appear in the UniProt
      BIOPHYSICOCHEMICAL PROPERTIES block for Q9NQR9, which independently anchors
      the claim. The framing of G6PC2 as the major islet glucose-6-phosphatase is
      correct for islets but should not be read as implying activity comparable to
      G6PC1.
- id: PMID:15044018
  title: The islet-specific glucose-6-phosphatase-related protein, implicated in diabetes,
    is a glycoprotein embedded in the endoplasmic reticulum membrane.
  findings:
  - statement: Establishes the subcellular location and topology of human G6PC2, an
      N-glycosylated nine-transmembrane ER membrane protein, and shows it is degraded
      largely by the proteasome, the route that generates MHC class I peptides.
    supporting_text: IGRP is a glycoprotein, held in the endoplasmic reticulum by
      nine transmembrane domains, which is degraded in cells predominantly through
      the proteasome pathway that generates the major histocompatibility complex class
      I-presented peptides
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. The experimental source behind the UniProt SUBCELLULAR
      LOCATION, TOPOLOGY, GLYCOSYLATION and PTM annotations for Q9NQR9, and hence
      behind the GO:0005789 assignments.
- id: PMID:17265032
  title: Deletion of the gene encoding the islet-specific glucose-6-phosphatase catalytic
    subunit-related protein autoantigen results in a mild metabolic phenotype.
  findings:
  - statement: First G6pc2-null mouse. Fasting blood glucose is modestly but significantly
      reduced in both sexes, with no change in plasma insulin or glucagon, so the
      direction of effect is opposite to that expected for a gluconeogenic enzyme.
    supporting_text: a small but significant decrease in blood glucose was observed
      in both male (-14%) and female (-11%) G6pc2 (-/-) mice
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. The paper's own conclusion understates the finding,
      arguing against a major role under standard housing conditions, but the reduced
      fasting glucose it reports was later shown to be the central phenotype and matches
      the direction of the human GWAS signal. Cited here for the phenotype, not for
      the authors' interpretation.
- id: PMID:18451265
  title: A polymorphism within the G6PC2 gene is associated with fasting plasma glucose
    levels.
  findings:
  - statement: Discovery GWAS linking the G6PC2 intronic variant rs560887 to fasting
      plasma glucose and beta-cell function but not to type 2 diabetes risk, and proposing
      the set-point mechanism later confirmed in mice.
    supporting_text: We speculate that G6PC2 regulates FPG by modulating the set point
      for glucose-stimulated insulin secretion in pancreatic beta cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. The source of the UniProt FGQTL1 POLYMORPHISM annotation
      for Q9NQR9. The mechanistic proposal was explicitly speculative in 2008 and
      is cited as such, but it has since been borne out by conditional knockout work.
- id: PMID:20622168
  title: Genetic and functional assessment of the role of the rs13431652-A and rs573225-A
    alleles in the G6PC2 promoter that are strongly associated with elevated fasting
    glucose levels.
  findings:
  - statement: The promoter variant rs13431652-A raises both G6PC2 promoter activity
      and fasting plasma glucose, giving a directionally coherent functional mechanism
      for the GWAS signal.
    supporting_text: The rs13431652-A allele is associated with increased FPG and
      elevated promoter activity, consistent with the function of G6PC2 in pancreatic
      islets.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Important because it converts
      a statistical association into a mechanistic one with the expected sign, namely
      more G6PC2 expression giving more glucose-6-phosphate hydrolysis and a higher
      glucose set point.
- id: PMID:20668700
  title: Effects of GCK, GCKR, G6PC2 and MTNR1B variants on glucose metabolism and
    insulin secretion.
  findings:
  - statement: Replication in 6,540 Chinese individuals of the G6PC2 fasting-glucose
      association, with effects on both first- and second-phase insulin secretion
      during an OGTT.
    supporting_text: G6PC2 rs16856187 showed evidence for association to first-phase
      insulin secretion (p = 0.0108), and second-phase insulin secretion under a dominant
      genetic model (p = 0.0431).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available and read. This is the reference
      behind both BHF-UCL IMP annotations. The IMP evidence code is a stretch for
      a human association study with no experimental perturbation, but the phenotypes
      measured are the right ones and the conclusion is independently corroborated
      by mouse knockouts, so the annotations are supported even if the code is generous.
- id: PMID:21896930
  title: Deletion of the G6pc2 gene encoding the islet-specific glucose-6-phosphatase
    catalytic subunit-related protein does not affect the progression or incidence
    of type 1 diabetes in NOD/ShiLtJ mice.
  findings:
  - statement: G6pc2 deletion on the NOD background removes G6pc2-reactive islet CD8+
      T cells but does not change the onset, incidence or sex bias of diabetes, showing
      that autoreactivity to G6PC2 is not required for disease.
    supporting_text: The absence of G6pc2 did not affect the time of onset, incidence,
      or sex bias of type 1 diabetes in NOD/ShiLtJ mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Cited to justify not proposing
      any immune biological-process annotation for G6PC2, since the protein is an
      antigen but is not causally required for the autoimmune process.
- id: PMID:23274894
  title: 'G6PC2: a negative regulator of basal glucose-stimulated insulin secretion.'
  findings:
  - statement: Defines the mechanism. G6pc2 deletion shifts the glucose-stimulated
      insulin secretion dose-response curve leftward and lowers blood glucose at matched
      plasma insulin, while islet glucose-6-phosphatase activity falls and basal cytoplasmic
      calcium rises.
    supporting_text: Glucose-6-phosphatase activity was reduced, whereas basal cytoplasmic
      calcium levels were elevated in islets isolated from G6pc2 KO mice.
  - statement: Articulates the glucokinase/G6PC2 futile substrate cycle model that
      explains why an islet glucose-6-phosphatase lowers rather than raises glycemia.
    supporting_text: This glucokinase/G6pc2 futile substrate cycle is predicted to
      reduce glycolytic flux and hence insulin secretion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. The single most important
      mechanistic reference for this gene; it reconciles the enzymology with the human
      genetics and supplies the directionality (negative regulation) used in core_functions.
- id: PMID:32213654
  title: Pancreatic islet beta cell-specific deletion of G6pc2 reduces fasting blood
    glucose.
  findings:
  - statement: Beta-cell-specific deletion alone reproduces the fasting-glucose phenotype,
      establishing that the effect is islet-autonomous rather than a consequence of
      trace expression elsewhere.
    supporting_text: In adult mice, beta cell-specific deletion of G6pc2 was sufficient
      to reduce FBG without changing FPI.
  - statement: In islets, both glucose-6-phosphatase activity and glucose cycling
      are abolished by G6pc2 deletion, and glucose-stimulated insulin secretion is
      enhanced specifically at submaximal glucose, which is the signature of a set-point
      change.
    supporting_text: in isolated islets, glucose-6-phosphatase activity and glucose
      cycling are abolished and glucose-stimulated insulin secretion (GSIS) is enhanced
      at submaximal but not high glucose
  - statement: States the field consensus that G6PC1 and G6PC3 both have much higher
      catalytic activity than G6PC2, which is why trace G6PC2 expression outside islets
      is judged metabolically irrelevant.
    supporting_text: because both G6PC1 (Lei, et al. 1993) and G6PC3 (Shieh et al.
      2003) have much higher catalytic activity than G6PC2 (Petrolonis, et al. 2004)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Provides the cell-type-restricted
      genetic evidence and an explicit statement of the relative catalytic weakness
      of G6PC2, both central to this review.
- id: PMID:32569842
  title: G6PC2 confers protection against hypoglycemia upon ketogenic diet feeding
    and prolonged fasting.
  findings:
  - statement: Frames the activity as a futile substrate cycle opposing glucokinase,
      and shows that knockout mice become hypoglycemic under a ketogenic diet or 24
      h fasting, suggesting an adaptive rationale for maintaining the cycle.
    supporting_text: blood glucose fell to 70 mg/dl or less in G6pc2 KO but not WT
      mice, suggesting that G6PC2 may have evolved, in part, to prevent hypoglycemia
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Also the source of the concise
      statement that G6PC2 hydrolysis creates a futile cycle opposing glucokinase,
      used in core_functions and in arguing against the gluconeogenesis annotations.
- id: PMID:34954144
  title: Nonsynonymous single-nucleotide polymorphisms in the G6PC2 gene affect protein
    expression, enzyme activity, and fasting blood glucose.
  findings:
  - statement: Functional analysis of 22 nonsynonymous G6PC2 SNPs. Sixteen markedly
      reduce protein expression and four more impair enzyme activity, and high-impact
      SNPs associate with fasting blood glucose but with no other phenotype in EHR-derived
      scans.
    supporting_text: Electronic health record-derived phenotype analyses showed an
      association between high-impact SNPs and FBG, but not other diseases/metabolites.
  - statement: Confirms His-174 as the catalytic nucleophile of G6PC2, since its mutation
      abolishes phosphatase activity without destabilising the protein.
    supporting_text: mutation of the equivalent AA in G6PC2, histidine 174, abolished
      phosphatase activity
  - statement: Documents the technical obstacle that explains the historical failure
      to detect G6PC2 activity, and shows G6PC1 has much higher activity at matched
      expression.
    supporting_text: Previous attempts to characterize such SNPs were limited by the
      very low inherent G6Pase activity and expression of G6PC2 protein in islet-derived
      cell lines.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Key for two separate purposes;
      it pins the catalytic mechanism to His-174, and it documents quantitatively
      that the low activity of G6PC2 is a real property rather than an assay artefact.
- id: PMID:37855366
  title: G6PC1 and G6PC2 influence G6P flux but not HSD11B1 activity.
  findings:
  - statement: Tests whether G6PC-mediated depletion of ER glucose-6-phosphate affects
      the H6PD and HSD11B1 glucocorticoid-activating pathway that shares the same
      luminal pool. It does not.
    supporting_text: These data suggest that HSD11B1 activity is not significantly
      affected by the presence or absence of G6PC1 or G6PC2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. A useful negative result that
      bounds the scope of G6PC2 function, arguing against annotating any glucocorticoid-related
      process despite the shared ER substrate pool.
- id: PMID:38095063
  title: Identification of structural motifs critical for human G6PC2 function informed
    by sequence analysis and an AlphaFold2-predicted model.
  findings:
  - statement: Mutagenesis against an AlphaFold2 model identifies the PAP2 phosphatase
      motif as required for catalysis and an intramolecular disulfide bond as required
      for expression, and localises the G6PC1 versus G6PC2 activity difference to
      the substrate cavity.
    supporting_text: residues forming part of a type 2 phosphatidic acid phosphatase
      (PAP2) motif are critical for enzyme activity
  - statement: Directly attributes the much greater activity of G6PC1 to substrate-cavity
      differences, giving a structural basis for the catalytic weakness of G6PC2.
    supporting_text: these data demonstrate that differences in the putative substrate
      cavity contribute to the markedly higher G6Pase activity of G6PC1 relative to
      G6PC2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Supplies the structural explanation
      for the central puzzle of this gene, namely why a protein with a fully conserved
      catalytic apparatus has such low measured activity.
- id: PMID:38431189
  title: Biochemical and metabolic characterization of a G6PC2 inhibitor.
  findings:
  - statement: Characterizes VU0945627 as a mixed inhibitor selective for human G6PC2
      over G6PC1, but notes that it does not inhibit mouse G6PC2 and also inhibits
      the ER glucose-6-phosphate transporter SLC37A4, an important caveat for interpreting
      islet pharmacology.
    supporting_text: We show that VU0945627 preferentially inhibits human G6PC2 versus
      human G6PC1 but activates human G6PC3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Cited for the tool-compound
      caveats underlying the suggested experiments rather than for any annotation.
- id: PMID:39426930
  title: The role of glucose-6-phosphatase activity in glucose homeostasis and its
    potential for diabetes therapy.
  findings:
  - statement: Recent review contrasting G6PC1 and G6PC2 enzymology, tissue distribution
      and physiology, and surveying inhibitor development.
    supporting_text: G6PC1 and G6PC2 exhibit distinct tissue-specific expression patterns,
      G6P hydrolysis kinetics, and physiological functions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, abstract-only in the cache. Used for orientation
      and to confirm that the distinct-kinetics framing is the accepted view of the
      field. No annotation rests on it alone.
- id: PMID:39742505
  title: G6PC2 controls glucagon secretion by defining the set point for glucose in
    pancreatic α cells.
  findings:
  - statement: Inducible alpha-cell-specific G6pc2 ablation in mice, confirmed in
      primary human alpha cells, shows that G6PC2 governs glucose suppression of amino-acid-stimulated
      glucagon secretion independently of insulin output or islet morphology.
    supporting_text: this gene plays a critical role in controlling glucose suppression
      of amino acid-stimulated glucagon secretion independent of alterations in insulin
      output, islet hormone content, or islet morphology, findings that we confirmed
      in primary human α cells
  - statement: Establishes the alpha-cell arm of G6PC2 action on glycemia, implying
      a bihormonal mechanism for any G6PC2 inhibitor.
    supporting_text: our data demonstrate that G6PC2 affects glycemic control via
      its action in α cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available. Extends G6PC2 function beyond
      the beta cell and is the sole basis for the second core function and for the
      GO:0070092 assertion. The finding is recent (2025) and would benefit from independent
      replication, but it is supported within the paper by both mouse conditional
      genetics and human pseudo-islet experiments.
- id: Reactome:R-HSA-3266566
  title: G6PC2 hydrolyzes G6P to form Glc and Pi (islet)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The reaction description is accurate and correctly marked as the
      islet reaction, citing Petrolonis et al. 2004. It is the parent pathway assignment
      (Gluconeogenesis), not this reaction, that is problematic.
- id: Reactome:R-HSA-70263
  title: Gluconeogenesis
  findings: []
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: The pathway itself is correctly described, and its own summary states
      that gluconeogenesis is confined to cells of the liver and kidney. But placing
      the islet G6PC2 reaction inside it makes G6PC2 a nominal participant in a pathway
      it does not perform, and this propagates into GOA as a TAS gluconeogenesis annotation.
