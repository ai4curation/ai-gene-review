- term:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  evidence_type: EXP
  original_reference_id: PMID:14722102
  qualifier: enables
  review:
    summary: >-
      Recombinant IGRP hydrolyses glucose 6-phosphate with Km 0.29-0.45 mM, and a selective
      small-molecule inhibitor distinguishes it from the liver enzyme. This is the paper
      UniProt ties the human entry's catalytic-activity line to.
    action: ACCEPT
    reason: >-
      Direct enzymology, and for human the catalytic claim is now established on the human
      protein itself rather than only transferred. Mutating one residue in each of the six
      regions of the predicted PAP2 motif of human G6PC2, including the four predicted
      catalytic residues Arg79, His115, Arg168 and His174, significantly reduces activity
      (PMID:38095063), and the human open reading frame gives measurable microsomal G6Pase
      activity in islet-derived 832/13 cells, where several nonsynonymous variants reduce
      it further (PMID:34954144). The abstract of this paper does not state the species of
      the construct, but UniProt attributes the human CATALYTIC ACTIVITY line to it with
      ECO:0000269, and the species-selective inhibitor VU0945627 blocks human but not
      mouse G6PC2 (PMID:38431189), which fits a human construct. Judged against the
      promiscuous-activity tiers: turnover is far below G6PC1 (PMID:34954144,
      PMID:38431189), but G6P hydrolysis is this protein's own reaction, G6PC2 owns the
      reaction in islets (human G6PC1 is absent from sampled beta cells and only weakly
      present in islets, file:human/G6PC2/G6PC2-bioinformatics/RESULTS.md), and human
      coding variants that reduce the protein or its activity shift fasting glucose. The
      low rate is what lets G6PC2 modulate rather than abolish glucokinase flux, so this
      is a core evolved function.
    supported_by:
    - reference_id: PMID:14722102
      supporting_text: The K(m) and V(max) values determined using glucose-6-phosphate as the
        substrate were 0.45 mm and 32 nmol/mg/min by malachite green assay, and 0.29 mm and 77
        nmol/mg/min by glucose oxidase/peroxidase coupling assay, respectively.
    - reference_id: PMID:14722102
      supporting_text: Interestingly, this inhibitor did not affect LG-6-Pase activity, while
        conversely LG-6-Pase inhibitors did not affect IGRP activity.
    - reference_id: PMID:38095063
      supporting_text: The data show that individual mutation of residues in all six regions
        of the PAP2 motif resulted in a significant decrease in enzyme activity
    - reference_id: PMID:34954144
      supporting_text: low microsomal G6Pase activity could now be detected in vitro following
        transient expression of G6PC2 in 832/13 cells
    - reference_id: file:human/G6PC2/G6PC2-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=0.45 mM for glucose-6-phosphate (at pH 6.5)
