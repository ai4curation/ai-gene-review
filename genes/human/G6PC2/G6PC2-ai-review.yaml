- term:
    id: GO:0042593
    label: glucose homeostasis
  evidence_type: IMP
  original_reference_id: PMID:20668700
  qualifier: involved_in
  review:
    summary: >-
      G6PC2 variants modulate fasting plasma glucose in a 6,822-participant Chinese study;
      G6PC2 sets the fasting blood glucose level through the islet glucose/G6P cycle.
    action: ACCEPT
    reason: >-
      The cited study is a population genetic association rather than a perturbation of the
      protein, which is weak evidence on its own, but the claim it makes is one of the
      best-supported things about this gene in human. Coding variants that reduce G6PC2
      protein abundance or catalytic activity are associated with fasting blood glucose, and
      most nonsynonymous G6PC2 variants tested reduce expression or activity
      (PMID:34954144); promoter variants tie the fasting-glucose-raising allele to higher
      G6PC2 promoter activity, in the direction the knockout predicts (PMID:20622168); and
      UniProt records the locus as the fasting plasma glucose quantitative trait locus
      FGQTL1. The mechanism is the gene's own activity: by cycling G6P back to glucose in
      islet cells, G6PC2 sets the glucose concentration at which insulin and glucagon output
      change, and hence the level at which blood glucose settles (PMID:23274894,
      PMID:39742505). GO:0042593 has exactly one child, intracellular glucose homeostasis
      (checked in OLS), which does not apply, so this term is as precise as warranted.
    additional_reference_ids:
    - PMID:18521185
    supported_by:
    - reference_id: PMID:20668700
      supporting_text: We replicated the association between GCK rs1799884, G6PC2 rs16856187
        and MTNR1B rs10830963 and fasting glucose in our samples
    - reference_id: PMID:34954144
      supporting_text: The in vitro G6Pase assay showed that the Gly8Glu and Ile273Val variants
        did not affect activity, whereas the Gly114Arg, Met126Val, Val219Leu, and Phe256Leu
        variants were associated with reduced activity
    - reference_id: PMID:20622168
      supporting_text: the rs13431652-A allele is associated with both elevated FPG (Table 1)
        and G6PC2 promoter activity
    - reference_id: PMID:32569842
      supporting_text: blood glucose fell to 70 mg/dl or less in G6pc2 KO but not WT mice,
        suggesting that G6PC2 may have evolved, in part, to prevent hypoglycemia
- term:
    id: GO:0050796
    label: regulation of insulin secretion
  evidence_type: IMP
  original_reference_id: PMID:20668700
  qualifier: involved_in
  review:
    summary: >-
      Correct, but less specific than the evidence supports: G6PC2 negatively regulates
      insulin secretion in response to glucose, and the human association carries that
      direction.
    action: MODIFY
    reason: >-
      The direction is in the cited study itself: the G6PC2 rs16856187 allele that raises
      fasting glucose is associated with lower first-phase insulin secretion (beta -0.0245,
      SE 0.0096, p = 0.0108) and with lower second-phase secretion under a dominant model,
      so more G6PC2 goes with less glucose-stimulated insulin release. A second human cohort
      associates G6PC2 variants with beta-cell glucose sensitivity and insulin-secretion
      parameters (PMID:34128214), and the promoter work shows the fasting-glucose-raising
      allele raises G6PC2 expression (PMID:20622168), closing the loop. The sign and the
      stimulus are established mechanistically in beta cells: deletion shifts the glucose
      dose-response of insulin secretion leftward and raises secretion about two-fold at
      submaximal but not maximal glucose (PMID:23274894), and raises glycolytic and citric
      acid cycle flux (PMID:35176280). G6PC2 does part of the work: its own G6P hydrolysis
      opposes glucokinase at the entry to glycolysis, which is the step that sets the glucose
      sensitivity of insulin release. Refine to GO:0061179 negative regulation of insulin
      secretion involved in cellular response to glucose stimulus (verified in OLS; an is_a
      descendant of GO:0050796 via GO:0046676 and GO:0061178), the same replacement as in
      the mouse review.
    proposed_replacement_terms:
    - id: GO:0061179
      label: negative regulation of insulin secretion involved in cellular response to glucose
        stimulus
    supported_by:
    - reference_id: PMID:20668700
      supporting_text: G6PC2 rs16856187 showed evidence for association to first-phase insulin
        secretion (p = 0.0108), and second-phase insulin secretion under a dominant genetic
        model (p = 0.0431).
    - reference_id: PMID:34128214
      supporting_text: Two G6PC2 variants (rs13387347 and rs560887) were associated to both
        parameters of insulin secretion (DC and PC) and to fasting C-peptide levels
    - reference_id: PMID:23274894
      supporting_text: These data suggest that G6pc2 represents a novel, negative regulator of
        basal GSIS that acts by hydrolyzing glucose-6-phosphate, thereby reducing glycolytic
        flux.
    - reference_id: PMID:35176280
      supporting_text: deletion of G6pc2 led to ∼60% increases in glycolytic and citric acid
        cycle (CAC) fluxes at both 5 and 11 mM glucose concentrations
- term:
    id: GO:0070094
    label: positive regulation of glucagon secretion
  evidence_type: IMP
  original_reference_id: PMID:39742505
  qualifier: involved_in
  review:
    summary: >-
      G6PC2 is present in human alpha cells and sustains glucagon output there: knocking it
      down in primary human alpha cells makes glucagon secretion suppressible at lower
      glucose and lowers maximal secretion, and alpha-cell-specific deletion in mice lowers
      glucagon in vivo and ex vivo.
    action: NEW
    reason: >-
      No existing row covers the alpha-cell arm of this gene's function, and the evidence is
      direct and human as well as mouse. Bahl et al. 2025 showed that the G6PC2 protein is
      detectable in human alpha cells by immunofluorescence, that the glucose/G6P cycle runs
      there (2-NBDG efflux from human alpha cells falls on G6PC2 knockdown), and that shRNA
      knockdown (86% mRNA reduction) in sorted primary human alpha cells aggregated into
      over 90% alpha-cell pseudo-islets makes glucagon secretion significantly more
      glucose-sensitive at 1, 3, 5 and 9 mM glucose, with unchanged total glucagon content.
      In mice an inducible alpha-cell-specific deletion (88% of alpha cells) shifted the
      glucose set point for suppression of amino-acid-stimulated glucagon secretion
      leftward, with no difference at zero glucose but significantly less glucagon at 0.5-5
      mM, and lowered fasting and glucose-suppressed plasma glucagon with insulin unchanged;
      islet composition, hormone content and proliferation were unaffected, and phloridzin
      and insulin-tolerance experiments excluded a paracrine insulin explanation. Sign: loss
      of G6PC2 lowers glucagon output at a given glucose, so G6PC2 is a positive regulator
      of glucagon secretion, and GO:0070094 (verified in OLS; is_a GO:0070092 and
      GO:0090277, no children) is the correctly signed term. There is no "involved in
      cellular response to glucose stimulus" child for glucagon as there is for insulin, so
      the set-point detail is stated in this summary rather than in the term. Participation:
      the regulated step is alpha-cell glycolytic flux and G6PC2's own G6P hydrolysis is
      what lowers it, opposing glucokinase; this is the gene product doing the work, not
      merely being required for the process. Comparator check: cell-intrinsic regulators of
      alpha-cell glucagon release do carry these terms, so there is no convention against
      annotating an intracellular islet enzyme here (QuickGO annotation search by reference,
      re-run 2026-11-10; all four hits are MGI rows on mouse genes: Pask GO:0070092 IMP
      PMID:21181396, Kcnk16 GO:0070092 IMP PMID:29402588, Syt7 GO:0070092 IMP PMID:19171650,
      Ffar4 GO:0070094 IMP PMID:24742677). Glucokinase itself
      carries no glucagon term despite the alpha-cell GCK literature, which reads as a
      curation lag rather than a convention, and in any case this row rests on direct
      evidence rather than on pathway completeness. The same row is added to the mouse
      review, where the conditional knockout was done.
    additional_reference_ids:
    - PMID:39121091
    supported_by:
    - reference_id: PMID:39742505
      supporting_text: we performed immunofluorescent staining on non-diabetic human
        pancreatic sections for G6PC2, insulin, and glucagon, and found that the G6PC2
        protein is indeed detectable in human α cells
    - reference_id: PMID:39742505
      supporting_text: we normalized the results to the KCl response, and found the
        shG6PC2-exressing α cell pseudoislets to be significantly (P < 0.05 at 1mM glucose,
        P < 0.01 at 3, 5 and 9 mM glucose) more sensitive to glucose
    - reference_id: PMID:39742505
      supporting_text: the efflux of 2-NBDG from human α cells was significantly reduced after
        shRNA-mediated suppression of G6PC2
    - reference_id: PMID:39742505
      supporting_text: when incubated in the presence of 0.5mM, 1mM, 3mM, or 5mM glucose,
        α-G6PC2KO islets secreted significantly (P < 0.0001) less glucagon relative to
        control islets, confirming a left shift in the glucose response curve for glucagon
        release
    - reference_id: PMID:39742505
      supporting_text: Using inducible, cell type-specific gene ablation of G6pc2 in mice we
        document a dramatic shift in the set-point for glucose suppression of glucagon
        secretion, resulting in more than half-maximal reduction in glucagon release from
        isolated islets at 1 mM glucose.
    - reference_id: PMID:39742505
      supporting_text: Total glucagon content was not different between the two experimental
        groups
