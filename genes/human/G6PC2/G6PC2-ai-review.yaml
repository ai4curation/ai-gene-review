id: Q9NQR9
gene_symbol: G6PC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  G6PC2 (glucose-6-phosphatase 2, also called IGRP, islet-specific glucose-6-phosphatase
  catalytic subunit-related protein) is a 355-residue, N-glycosylated, multi-pass integral
  membrane protein of the endoplasmic reticulum with nine transmembrane helices, a
  C-terminal ER-retention motif and a lumen-facing PAP2-type phosphatase active site
  (His115 proton donor, His174 nucleophile, with Arg79 and Arg168 binding substrate). It
  hydrolyses glucose 6-phosphate to glucose and inorganic phosphate with a Km of about
  0.3-0.45 mM but a far lower turnover than the hepatic and renal paralog G6PC1.
  Expression is predominantly pancreatic, with lower levels in testis; in the pancreas
  the protein is present in most islet cells, with about five-fold more in beta cells than alpha cells in human. In both cell
  types the activity opposes the glucose sensor glucokinase, creating a
  glucose/glucose-6-phosphate substrate cycle that lowers glycolytic and citric acid
  cycle flux and so sets the glucose concentration at which each cell changes its hormone
  output. In beta cells this shifts the glucose dose-response of insulin secretion to the
  right, making G6PC2 a negative regulator of glucose-stimulated insulin secretion; in
  alpha cells it raises the glucose set point for suppression of glucagon secretion, so
  that loss of G6PC2 lowers glucagon release. Through both arms it sets the fasting blood
  glucose level, and common and rare G6PC2 variants that lower its expression or activity
  lower fasting plasma glucose in humans (the FGQTL1 locus). Unlike G6PC1 it does not
  contribute to hepatic or renal glucose production. The protein is also a CD8 T-cell
  autoantigen in autoimmune diabetes.
