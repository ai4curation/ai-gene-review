gene_symbol: ARMH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMH3 (C10orf76) is a 689-residue armadillo-like helical protein that cycles between the
  cytosol and the trans-Golgi network. It is an effector of the small GTPase ARL5, binding its GTP-bound
  form, and it forms a heterodimer with phosphatidylinositol 4-kinase III beta (PI4KB) through the PI4KB
  kinase linker. ARMH3 promotes PI4KB-dependent synthesis of the main PI4P pool at the TGN. That pool
  recruits GOLPH3, supports CERT-mediated ceramide transfer to the distal Golgi, and maintains Golgi organization.
  After cGAMP stimulation, ARMH3 binds STING at the Golgi and recruits PI4KB, generating the PI4P that
  routes STING to endosomes for full activation. ARMH3 is also needed for replication of certain enteroviruses.
