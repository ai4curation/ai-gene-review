suggested_questions:
- question: Is the human cell-cell junction IDA (PMID:15576373) based on STX3 imaging in the full text, or is it an STX4 observation attached to STX3?
- question: Should the soluble Stx3S transcriptional function be captured with an isoform-qualified DNA-binding transcription factor binding annotation, and does it act as a coactivator or corepressor of ETV4/ATF2 targets?
- question: Does human STX3 (as in mouse) take part in postsynaptic AMPA receptor exocytosis, or is the PTN002717040 inheritance a rodent-specific observation?
suggested_experiments:
- description: In human intestinal organoids lacking STX3, rescue with wild-type STX3A versus SNARE-motif or FMDE-motif mutants and score apical delivery of sucrase-isomaltase and CFTR by surface biotinylation.
  hypothesis: Apical fusogenic activity of STX3A, not merely its presence, is needed for brush border protein delivery.
- description: Reconstitute STX3A versus STX3B with SNAP-23/SNAP25 and VAMP2/VAMP7/VAMP8 in liposome fusion assays to define the cognate R-SNARE specificity of each human isoform.
  hypothesis: The divergent C-terminal SNARE halves of STX3A and STX3B set different R-SNARE partner preferences.
