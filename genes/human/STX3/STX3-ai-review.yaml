id: Q13277
gene_symbol: STX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Syntaxin-3 is a tail-anchored Qa-SNARE (t-SNARE) of the syntaxin family that drives fusion of transport vesicles and secretory granules with the plasma membrane. It assembles a four-helix SNARE complex with a Qbc-SNARE (SNAP-23 or SNAP-25) and a vesicular R-SNARE (VAMP family), and its activity is controlled by the SM protein Munc18-2 (STXBP2). The ubiquitous splice form STX3A sits on the apical plasma membrane of polarised epithelia, through an N-terminal FMDE apical targeting motif. There it mediates apical delivery of membrane and secreted proteins, which is needed to build the enterocyte brush border; biallelic loss causes microvillus inclusion disease. In secretory immune and endocrine cells STX3 is on secretory granules and mediates regulated and compound (granule-granule) exocytosis. The retina-specific form STX3B is the t-SNARE of photoreceptor and bipolar-cell ribbon synapses and is needed to traffic outer segment proteins in photoreceptors. Variants affecting STX3B cause early-onset retinal dystrophy. In neurons STX3 is enriched in the axonal plasma membrane. A soluble splice form lacking the transmembrane anchor (Stx3S) enters the nucleus and modulates transcription through binding of ETV4 and ATF2.
