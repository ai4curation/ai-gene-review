    summary: 'Proposed: exocytosis. PAINT node PTN000461524 (plasma-membrane syntaxins, from which human STX3 descends) now carries an IBD for exocytosis that has not yet propagated to the GOA snapshot.'
    action: NEW
    reason: STX3 is the plasma membrane t-SNARE that performs the fusion step of exocytosis, so it does part of the work of the process. In other species it is required for regulated granule exocytosis in mast cells and beta cells and for cAMP/cGMP-stimulated CFTR exocytosis in enterocytes. In human, truncation abolishes apical vesicle fusion in enterocytes. The PTN000461524 node shows the PAINT curator placed exocytosis on the clade that contains STX3.
