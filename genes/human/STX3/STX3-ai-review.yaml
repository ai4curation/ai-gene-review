  review:
    summary: IBA from PTN000461349 (family-wide syntaxin node). STX3 binds the cognate SNAREs SNAP-23 and VAMP/cellubrevin at the apical membrane and SNAP25/VAMP2 as STX3B.
    action: ACCEPT
    reason: SNARE binding is the defining property of syntaxins and is inherited from the PAINT node the whole PTHR19957 family descends from. Human STX3 complexes with SNAP-23 and cellubrevin in Caco-2 cells, and STX3B pairs with SNAP25 and VAMP2.
    supported_by:
    - &id012
      reference_id: PMID:9701566
      supporting_text: Increasing the amount of Munc-18-2 bound to syntaxin 3 by overexpression results in a marked decrease in the SNARE proteins SNAP-23 and cellubrevin bound to the syntaxin.
    - &id003
      reference_id: PMID:18683220
      supporting_text: vesicles containing syntaxin 3B and SNAP25 could fuse with vesicles containing synaptobrevin2/VAMP2, demonstrating that syntaxin 3B can function as a t-SNARE
