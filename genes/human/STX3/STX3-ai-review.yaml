core_functions:
- description: 'Apical plasma membrane t-SNARE of polarised epithelia (STX3A): with SNAP-23 and VAMP partners, under Munc18-2 control, it fuses apical carrier vesicles with the apical plasma membrane and so delivers apical membrane and secreted proteins (e.g. sucrase-isomaltase, CFTR) needed for brush border formation.'
