    CTCF sites, forming loop domains/TADs and enhancer-promoter contacts; this chromatin-looping function underlies cohesin's
    transcriptional insulation (e.g. at H19/IGF2), cohesin-STAG2-dependent enhancer-promoter contacts and the transcriptional
    dysregulation of Cornelia de Lange syndrome.
