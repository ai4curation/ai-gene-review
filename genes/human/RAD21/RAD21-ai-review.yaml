- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15855230
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q29RF7
  review:
    summary: >-
      IPI with the cohesin regulator PDS5A. PDS5 binds the central region of RAD21, in a manner stimulated by STAG1/2, docking
      the PDS5-WAPL/sororin regulatory module onto the ring. Bare protein binding does not convey this: the informative molecular
      function is RAD21's role as the kleisin adaptor that brings the SMC heads and the HEAT-repeat subunits together to assemble
      a functional cohesin ring.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The interaction with PDS5A is genuine and structurally defined, and it reflects
      RAD21's adaptor/bridging role connecting the SMC1A-SMC3 heads with STAG1/2, PDS5 and WAPL, which GO captures as protein-macromolecule
      adaptor activity (the same resolution used for the fission-yeast Rad21 kleisin). Complex membership is separately annotated
      (GO:0008278/GO:0030892).
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    additional_reference_ids:
    - PMID:19696148
    supported_by:
    - reference_id: PMID:15855230
      supporting_text: Pds5 proteins physically interact with cohesin and associate with chromatin in a cohesin-dependent
