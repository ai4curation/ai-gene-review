      not a molecular function of RAD21; the informative activity is separase's endopeptidase activity with RAD21 as its input.
    action: REMOVE
    reason: >-
      Generic protein binding is uninformative and GO does not annotate a substrate for being bound by its protease. The biology
      is captured on the ESPL1 side (cysteine-type endopeptidase activity with RAD21 as input) and, for RAD21, by the sister
      chromatid cohesion/segregation annotations that its cleavage terminates. Removal does not dispute the interaction.
    supported_by:
    - reference_id: PMID:34290405
      supporting_text: Deletion of these linkers, or replacement with a random sequence, abolished Scc1 cleavage in vitro
      reference_section_type: RESULTS
    - reference_id: PMID:34290405
      supporting_text: the Scc1 NHLEYE motif promotes Scc1 binding to separase
      reference_section_type: RESULTS
