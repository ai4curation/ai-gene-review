- id: file:human/RAD21/RAD21-deep-research-falcon.md
  title: Deep research report for human RAD21 (falcon/Edison)
  findings:
  - statement: >-
      RAD21 is the non-catalytic kleisin closure subunit of cohesin; RAD21 dosage alters NIPBL-MAU2 loader binding, loop extrusion,
      TAD/compartment contacts and transcription.
    supporting_text: >-
      Interphase cohesin extrudes chromatin loops until extrusion is halted or stabilized, frequently by convergently oriented
      CTCF sites.
suggested_questions:
- question: >-
    No human cohesin subunit (RAD21, SMC1A, SMC3, STAG1, STAG2) currently carries GO:0140588 chromatin looping, although the
    GO definition names SMC complexes as the extrusion motor and fission-yeast rad21 carries it by IDA; should human RAD21
    (and the other core subunits) receive this annotation from the RAD21-degron Hi-C and single-molecule loop-extrusion literature?
- question: >-
    Are cohesive (sister-entrapping) and loop-extruding cohesin populations in human cells distinguished by RAD21 post-translational
    state (phosphorylation, SUMOylation) or by STAG1 versus STAG2 partnership, and does the RAD21 central region gate the
    switch between them?
- question: >-
    Human RAD21 is SUMOylated during DNA damage repair and is required for the G2/M checkpoint independently of cohesion;
    which RAD21 contacts (PDS5, NIPBL, STAG) mediate recruitment of 53BP1/CHK2 at break sites, and is this a scaffold function
    that should be modelled with a defined molecular activity?
- question: >-
    Do RAD21-STAG3 complexes contribute to meiotic cohesion in human germ cells, or are the meiotic-cohesin-complex and establishment-of-meiotic-cohesion
    annotations better restricted to REC8 and RAD21L?
suggested_experiments:
- description: >-
    Auxin-inducible degradation of endogenous RAD21 in synchronised human cells combined with Micro-C/Hi-C and sister-chromatid-resolved
    (e.g. scsHi-C) mapping to separate the contributions of RAD21-cohesin to loop extrusion versus sister chromatid cohesion
    within the same cell cycle.
- description: >-
    Structure-guided mutagenesis of the RAD21 central region (residues 287-449, including the conserved 372-392 block) to
    uncouple STAG binding from PDS5/WAPL docking, followed by chromosome-spread cohesion assays, FRAP residence-time measurements
    and ChIP-seq, to define which contacts are required for cohesion establishment, prophase release and loop anchoring.
- description: >-
    Knock-in of separase-noncleavable (R172E/R450E) and caspase-noncleavable (D279A) RAD21 alleles with live imaging to quantify
    the contributions of the two cleavage events to anaphase timing, cytokinesis completion and apoptotic chromatin changes.
