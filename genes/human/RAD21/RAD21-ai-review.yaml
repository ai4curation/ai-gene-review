- term:
    id: GO:0000922
    label: spindle pole
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0448
  review:
    summary: >-
      Cohesin released from chromosomes in mitosis was reported at spindle poles in association with NuMA, and cohesin depletion
      impaired aster assembly in vitro. This is a minor, proposed localisation of the soluble mitotic pool rather than where
      RAD21 performs its cohesion, looping or repair functions.
    action: KEEP_AS_NON_CORE
    reason: >-
      The observation is published (immunolocalisation, NuMA co-IP) and mirrored in UniProt, but it is a single-study proposal
      that has not become part of the accepted picture of cohesin function; retained as non-core.
    supported_by:
    - reference_id: PMID:11590136
      supporting_text: we found that cohesin localizes to the spindle poles during mitosis and interacts with NuMA
      reference_section_type: ABSTRACT
    - reference_id: PMID:11590136
      supporting_text: the majority of cohesin was found to be off chromosomes and reside in the cytoplasm in metaphase
      reference_section_type: ABSTRACT
- term:
    id: GO:0000987
    label: cis-regulatory region sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q61550
  - ensembl:ENSMUSP00000022927
  review:
    summary: >-
      Cohesin is recruited to cis-regulatory elements (CTCF sites, enhancers, promoters), but RAD21 has no DNA-binding domain
      that recognises a specific sequence: enrichment at specific sites depends on CTCF, and STAG2 mediates the CTCF-independent
      enhancer contacts. Occupancy in ChIP does not demonstrate sequence-specific binding by RAD21.
    action: MODIFY
    reason: >-
      The essence (cohesin associates with regulatory chromatin) is sound but the term overstates the mechanism; cohesin's
      DNA interaction is topological/non-sequence-specific and site selection is conferred by CTCF and other factors. Chromatin
      binding (GO:0003682, already an IBA) is the accurate molecular function.
    proposed_replacement_terms:
    - id: GO:0003682
      label: chromatin binding
    supported_by:
    - reference_id: PMID:18235444
      supporting_text: CTCF is dispensable for cohesin loading onto DNA, but is needed to enrich cohesin at specific binding
        sites.
      reference_section_type: ABSTRACT
    - reference_id: PMID:29867216
      supporting_text: cohesin-SA2 promotes cell-type-specific contacts between enhancers and promoters independently of CTCF
      reference_section_type: ABSTRACT
- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:F7EK71
  - ensembl:ENSRNOP00000006209
  review:
    summary: >-
      Rat-derived Ensembl-Compara transfer; a response-to-hypoxia phenotype (presumably an expression change or knockdown
      effect in a hypoxia model) is not a process that the cohesin kleisin executes.
    action: REMOVE
    reason: >-
      Over-propagated electronic inference from a rat phenotypic study: RAD21 has no role in sensing or responding to oxygen
      and any effect is an indirect consequence of altered chromatin organisation or proliferation. Not supported by human
      or mouse cohesin biology.
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000286904
  - SGD:S000002161
  - SGD:S000006211
  review:
    summary: >-
      PAINT places chromatin binding at the Scc1/Rad21 kleisin node (seeded by budding-yeast Mcd1/Scc1). Human RAD21-cohesin
      binds chromatin after NIPBL-dependent loading and is mapped genome-wide by ChIP.
    action: ACCEPT
    reason: >-
      Sound phylogenetic inference, fully consistent with human loading, residence-time and ChIP-seq data; appropriate molecular
      function for a chromatin-bound structural subunit.
    supported_by:
    - reference_id: PMID:22628566
      supporting_text: >-
        Replication of cohesin-loaded DNA, both in vitro and in vivo, markedly increased the stability of cohesin associated
        with DNA.
      reference_section_type: ABSTRACT
    - reference_id: PMID:17113138
      supporting_text: Wapl depletion also increases the residence time of cohesin on chromatin in interphase.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19468298
      supporting_text: >-
        Cohesin binding analysis demonstrates a preference for intergenic regions suggesting a cis-regulatory function mimicking
        that of a boundary/insulator interacting protein
      reference_section_type: ABSTRACT
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12672959
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14674
  review:
    summary: >-
      IPI with separase (ESPL1). RAD21 is the separase substrate: it is cleaved after Arg172 and Arg450 at anaphase onset,
      with docking motifs (LPE, NHLEYE) and phosphorylation near the C-terminal site tuning cleavage. Substrate binding is
      not a molecular function of RAD21; the informative activity is separase's endopeptidase activity with RAD21 as its input.
    action: REMOVE
    reason: >-
      Generic protein binding is uninformative and GO does not annotate a substrate for being bound by its protease. The biology
      is captured on the ESPL1 side (cysteine-type endopeptidase activity with RAD21 as input) and, for RAD21, by the sister
      chromatid cohesion/segregation annotations that its cleavage terminates. Removal does not dispute the interaction.
    supported_by:
    - reference_id: PMID:12672959
      supporting_text: Previous work has established that human separase can cleave the Scc1 subunit of human cohesin
      reference_section_type: DISCUSSION
    - reference_id: PMID:12672959
      supporting_text: noncleavable mammalian Scc1 interferes with sister separation
      reference_section_type: DISCUSSION
