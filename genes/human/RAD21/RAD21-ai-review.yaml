        cohesin cleavage by separase is essential for sister chromatid separation and for the completion of cytokinesis
      reference_section_type: ABSTRACT
- term:
    id: GO:0007131
    label: reciprocal meiotic recombination
  evidence_type: TAS
  original_reference_id: PMID:8812457
  qualifier: involved_in
  review:
    summary: >-
      Speculative TAS from testis expression in the cloning paper. Mammalian meiotic recombination and axis cohesion are executed
      by the meiosis-specific kleisins REC8 and RAD21L; a role for RAD21 itself in reciprocal (crossover) recombination has
      not been demonstrated.
    action: REMOVE
    reason: >-
      Not experimental and never substantiated: the abstract explicitly frames it as a possibility from expression data, and
      the meiotic kleisin paralogs (REC8, RAD21L) account for the meiotic functions. Over-annotation for RAD21.
    supported_by:
    - reference_id: PMID:8812457
      supporting_text: >-
        Elevated expression of mHR21sp in testis and thymus supports a possible role for the rad21 mammalian homologs in V(D)J
        and meiotic recombination, respectively.
      reference_section_type: ABSTRACT
