- description: >-
    Functions in double-strand break repair and the DNA damage checkpoint: cohesin accumulates at DSBs and facilitates recombinational
    repair using the sister chromatid (RAD21 SUMOylation is required for sister chromatid recombination), and cohesin at break
    sites facilitates recruitment of checkpoint proteins (53BP1, CHK2 activation) for the intra-S and G2/M checkpoints independently
    of cohesion.
  directly_involved_in:
