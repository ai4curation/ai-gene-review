core_functions:
- description: >-
    Acts as the alpha-kleisin adaptor of cohesin: its N-terminal domain binds the SMC3 ATPase head and its C-terminal winged-helix
    domain binds the SMC1A head, bridging the two heads to close the SMC1A-SMC3-RAD21 ring, while its central region docks
    STAG1/STAG2 and, through STAG, the regulators PDS5A/B, WAPL and NIPBL; this non-catalytic bridging/scaffolding role is
    what assembles a functional cohesin complex.
  molecular_function:
