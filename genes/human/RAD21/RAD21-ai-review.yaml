- term:
    id: GO:0000785
    label: chromatin
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q61550
  - ensembl:ENSMUSP00000022927
  review:
    summary: >-
      RAD21-containing cohesin is loaded onto chromatin by NIPBL-MAU2, binds chromatin dynamically in G1 and is stabilised
      on chromatin by DNA replication; ChIP-seq maps RAD21 to CTCF sites, enhancers and promoters.
    action: ACCEPT
    reason: >-
      Chromatin is the site of every RAD21 function (cohesion, loop extrusion, repair); the mouse-derived transfer is corroborated
      by human loading and ChIP data.
    supported_by:
    - reference_id: PMID:22628566
      supporting_text: >-
        Replication of cohesin-loaded DNA, both in vitro and in vivo, markedly increased the stability of cohesin associated
        with DNA.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19468298
      supporting_text: >-
        Cohesin binding analysis demonstrates a preference for intergenic regions suggesting a cis-regulatory function mimicking
        that of a boundary/insulator interacting protein
      reference_section_type: ABSTRACT
