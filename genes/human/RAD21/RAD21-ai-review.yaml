- term:
    id: GO:0006302
    label: double-strand break repair
  evidence_type: TAS
  original_reference_id: PMID:8812457
  qualifier: involved_in
  review:
    summary: >-
      The cloning paper infers a repair role for hHR21 from conservation with the S. pombe DSB-repair gene rad21. In human
      cells cohesin (Scc1-containing) is enriched at DSBs, facilitates recombinational repair, and Scc1-depleted cells enter
      mitosis with highly fragmented, unrepaired chromosomes; RAD21 SUMOylation is required for sister-chromatid recombination.
    action: ACCEPT
    reason: >-
      Although the original evidence is a sequence-conservation TAS, the function is directly confirmed for human RAD21/cohesin:
      cohesin supplies the sister-chromatid template proximity and break-site chromatin organisation that recombinational
      repair depends on (a structural contribution, comparable to the scaffold case), so the participation test is met.
    additional_reference_ids:
    - PMID:19629043
    supported_by:
    - reference_id: PMID:8812457
      supporting_text: >-
        The rad21 gene of Schizosaccharomyces pombe is involved in the repair of ionizing radiation-induced DNA double-strand
        breaks.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19629043
      supporting_text: Cohesin also becomes enriched at DNA double-strand break sites and facilitates recombinational DNA
        repair.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19629043
      supporting_text: almost all mitotic cells contained broken chromosomes, most of which were highly fragmented
      reference_section_type: RESULTS
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: TAS
  original_reference_id: PMID:8812457
  qualifier: involved_in
  review:
    summary: >-
      The TAS rests on a speculation in the cloning paper that testis/thymus expression might indicate roles in meiotic and
      V(D)J recombination. The recombination process cohesin genuinely supports is recombinational repair of DSBs using the
      sister chromatid.
    action: MODIFY
    reason: >-
      The general term is too broad and its original basis was expression-pattern speculation; the supported, specific process
      is replication-born DSB repair via sister chromatid exchange (also an IBA for this gene), with DSB repair (GO:0006302)
      already retained.
    proposed_replacement_terms:
    - id: GO:1990414
      label: replication-born double-strand break repair via sister chromatid exchange
    additional_reference_ids:
    - PMID:19629043
    supported_by:
    - reference_id: PMID:8812457
      supporting_text: >-
        Elevated expression of mHR21sp in testis and thymus supports a possible role for the rad21 mammalian homologs in V(D)J
        and meiotic recombination, respectively.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19629043
      supporting_text: Cohesin also becomes enriched at DNA double-strand break sites and facilitates recombinational DNA
        repair.
      reference_section_type: ABSTRACT
- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:19468298
  qualifier: involved_in
  review:
    summary: >-
      RAD21/cohesin ChIP-chip in lymphoblastoid cells shows cohesin enriched at promoters of genes dysregulated in Cornelia
      de Lange syndrome, with binding reduced in NIPBL-mutant probands; cohesin also enables CTCF insulation at H19/IGF2 and
      supports estrogen-responsive MYC expression. These effects are mediated by cohesin's chromatin-looping/insulator function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Genuine, well-documented consequence of cohesin-mediated loop/insulator organisation, and the basis of CdLS transcriptional
      dysregulation; kept as non-core because RAD21 acts on transcription indirectly through chromatin architecture rather
      than as a transcription factor.
    additional_reference_ids:
    - PMID:18235444
    supported_by:
    - reference_id: PMID:19468298
      supporting_text: >-
        the binding sites are enriched within the promoter regions of the dysregulated genes and are significantly decreased
        in CdLS proband
      reference_section_type: ABSTRACT
    - reference_id: PMID:18235444
      supporting_text: >-
        Cohesin enables CTCF to insulate promoters from distant enhancers and controls transcription at the H19/IGF2 (insulin-like
        growth factor 2) locus.
      reference_section_type: ABSTRACT
- term:
    id: GO:0007062
    label: sister chromatid cohesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G05490
  - AGI_LocusCode:AT5G16270
  - FB:FBgn0260987
  - PANTHER:PTN000286904
  - PomBase:SPBC29A10.14
  - PomBase:SPCC338.17c
  - SGD:S000002161
  - SGD:S000006211
  - WB:WBGene00004333
  - WB:WBGene00004737
  - ZFIN:ZDB-GENE-030131-994
  review:
    summary: >-
      PAINT assigns sister chromatid cohesion at a kleisin node whose descendants include mitotic Scc1/Rad21 and meiotic Rec8-type
      kleisins across yeasts, plants, worms, flies and fish, hence the cell-cycle-neutral parent term. Human RAD21 depletion
      produces severe cohesion defects.
    action: ACCEPT
    reason: >-
      Correct phylogenetic placement; the general term is right at a node that includes meiotic kleisins. For RAD21 the specific
      instance is mitotic sister chromatid cohesion, which is its core process.
    supported_by:
    - reference_id: PMID:15855230
      supporting_text: >-
        Depletion of the cohesin subunit Scc1 by RNA interference leads to the assembly of chromosomes with severe cohesion
        defects.
      reference_section_type: ABSTRACT
    - reference_id: PMID:12417729
      supporting_text: >-
        Rad21 is one of the major cohesin subunits that holds sister chromatids together until anaphase, when proteolytic
        cleavage by separase, a caspase-like enzyme, allows chromosomal separation
      reference_section_type: ABSTRACT
- term:
    id: GO:0007062
    label: sister chromatid cohesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR039781
  review:
    summary: >-
      InterPro2GO (Rad21/Rec8-like) assigns the general cohesion term; human RAD21 is the mitotic kleisin and its cohesion
      role is directly shown by RNAi (severe cohesion defects) and by noncleavable RAD21 blocking sister separation.
    action: MODIFY
    reason: Correct but less specific than the directly supported mitotic sister chromatid cohesion term.
