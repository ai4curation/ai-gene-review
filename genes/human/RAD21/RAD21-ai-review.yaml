  review:
    summary: >-
      IPI with the SMC1A ATPase-head subunit. RAD21's C-terminal winged-helix domain binds the SMC1A ATPase head, one of the
      two head contacts through which the kleisin closes the cohesin ring. Bare protein binding does not convey this: the
      informative molecular function is RAD21's role as the kleisin adaptor that brings the SMC heads and the HEAT-repeat
      subunits together to assemble a functional cohesin ring. This row derives from a proteome-scale interaction screen;
      the interaction it reports is the constitutive cohesin complex interaction that is independently established by structural
      and biochemical work.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The interaction with SMC1A is genuine and structurally defined, and it reflects
      RAD21's adaptor/bridging role connecting the SMC1A-SMC3 heads with STAG1/2, PDS5 and WAPL, which GO captures as protein-macromolecule
      adaptor activity (the same resolution used for the fission-yeast Rad21 kleisin). Complex membership is separately annotated
      (GO:0008278/GO:0030892).
    proposed_replacement_terms:
