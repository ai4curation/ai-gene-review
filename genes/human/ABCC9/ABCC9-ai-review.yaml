- id: file:human/ABCC9/ABCC9-deep-research-falcon.md
  title: Falcon deep research report for human ABCC9
  findings:
  - statement: Independent research synthesis describes SUR2 as a regulatory KATP subunit; primary literature
      was checked for all review decisions.
core_functions:
- description: Bind and allosterically regulate Kir6 potassium channels through SUR2 nucleotide and drug
    sensing, thereby contributing to ATP-sensitive potassium conductance at the plasma membrane, including
    the sarcolemma of muscle cells. SUR2 binds inhibitory sulfonylureas such as glibenclamide and activating
    channel openers; these ligands modulate gating through the regulatory subunit. SUR2A and SUR2B share
    this role while differing in C-terminal sequence, tissue prevalence and nucleotide/drug responsiveness.
    Recombinant human SUR2A NBD2 dimers have ATPase activity, a biochemical property distinct from the
    intact-channel gating readout. Potassium permeates Kir6 rather than an ATP-driven SUR2 transport pathway.
  molecular_function:
    id: GO:0015459
    label: potassium channel regulator activity
  contributes_to_molecular_function:
    id: GO:0015272
    label: ATP-activated inward rectifier potassium channel activity
  directly_involved_in:
  - id: GO:0071805
    label: potassium ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008282
    label: inward rectifying potassium channel
  supported_by:
  - *id001
  - *id004
  - *id006
  - reference_id: PMID:35562524
    supporting_text: These KATP openers synergize with Mg-nucleotides to stabilize SUR2 in the NBD-dimerized
      occluded state to activate the channel.
  - *id013
  - *id012
suggested_questions:
- question: Can GO:0015272 nomenclature/definition more clearly distinguish ATP inhibition at Kir6 from
    Mg-nucleotide activation through SUR in KATP channels?
- question: Does full PMID:11934987 substantiate the P70170 protein-complex-binding donor annotation,
    or does the shared Sur2 name require a donor-side correction?
- question: Which short human ABCC9 splice products localize to mitochondria, and how do they relate to
    the major O60706-1/O60706-2 isoforms and native mitochondrial potassium-channel composition?
