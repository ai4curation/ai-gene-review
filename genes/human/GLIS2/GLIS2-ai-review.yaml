id: Q9BZE0
gene_symbol: GLIS2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: DRAFT
description: GLIS2 is a GLIS-family protein with five C2H2 zinc fingers. It binds regulatory DNA and acts
  predominantly in the nucleus. Promoter context permits activation or repression. Corepressor and beta-catenin
  interactions contribute to its regulatory activity. GLIS2 supports renal epithelial homeostasis, and
  biallelic disruption is associated with nephronophthisis.
core_functions:
- description: Promoter-dependent activation and repression through sequence-specific regulatory-DNA recognition
    in the nucleus.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:21127075
    supporting_text: 'Glis2

      binds effectively to the consensus Glis binding sequence'
  - reference_id: PMID:21127075
    supporting_text: 'Glis2 was able to

      activate the murine insulin-2 (Ins2) promoter'
  - reference_id: PMID:11741991
    supporting_text: 'Glis2

      localizes to the nucleus'
  - reference_id: PMID:16326862
    supporting_text: Repression by Glis2 appears to involve the recruitment of both CtBP1
suggested_questions:
- question: Which endogenous human target promoters distinguish GLIS2-mediated activation from repression
    in renal epithelial cells?
  experts:
  - GLIS transcription-factor researchers
  - Renal epithelial biologists
- question: Do endogenous human GLIS2 puncta occupy marker-defined nuclear speckles, and how does any
    ciliary pool relate to nuclear activity?
- question: Which exact GLIS2 construct and result underlie the incoming methyl-SELEX annotation?
suggested_experiments:
- description: Combine endogenous GLIS2 occupancy mapping with acute perturbation and nascent transcription
    measurements in human renal epithelial cells; distinguish occupied promoters from indirect expression
    responses.
- description: Assess endogenous GLIS2 localization with nuclear-speckle and ciliary markers, validated
    loss-of-signal controls and separate nuclear and ciliary measurements.
