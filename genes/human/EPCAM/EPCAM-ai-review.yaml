id: P16422
gene_symbol: EPCAM
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EPCAM encodes EpCAM/CD326, a single-pass epithelial cell-surface glycoprotein concentrated
  at lateral and basolateral membranes. It associates with claudin-7 and influences the stability and
  distribution of claudin-containing membrane pools, contributing to epithelial contacts and barrier organization.
  Its effects on cadherin-mediated adhesion, proliferation and differentiation depend on cellular context;
  direct homophilic adhesion across opposing cells remains disputed. Proteolytic processing can release
  an extracellular fragment and a short intracellular product, EpICD, associated with nuclear regulatory
  complexes and gene-expression responses. Biallelic EPCAM defects cause congenital tufting enteropathy.
  Some 3-prime EPCAM deletions cause Lynch syndrome through transcriptional read-through and epigenetic
  silencing of neighboring MSH2, a genomic mechanism distinct from the molecular activities of EpCAM protein.
