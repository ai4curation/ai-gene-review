id: P16422
gene_symbol: EPCAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EpCAM is a single-pass type I membrane glycoprotein expressed by almost all
  epithelia and strongly overexpressed in carcinomas. Its extracellular EpEX domain
  mediates calcium-independent homophilic adhesion between epithelial cells and is
  accessible at the cell surface, which makes EpCAM a widely used epithelial and
  cancer-cell marker. The protein concentrates at the lateral plasma membrane and at
  tight junctions, where it associates with phosphorylated claudin-7, and its presence
  weakens cadherin-mediated adhesion rather than reinforcing it. EpCAM is also a
  signalling protein, since regulated intramembrane proteolysis by TACE and presenilin-2 sheds
  EpEX and releases the intracellular domain EpICD, which enters the nucleus in a complex
  with FHL2, beta-catenin and LEF1 and drives transcription of targets including MYC and
  FABP5, promoting proliferation. It marks undifferentiated embryonic stem cells and is
  required for their normal proliferation, and loss-of-function mutations cause
  congenital tufting enteropathy.
