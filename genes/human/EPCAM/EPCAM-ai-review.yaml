      basolateral membranes, but was also observed in tight junctions.
- description: Mitogenic signal transducer activated by regulated intramembrane
    proteolysis. Cleavage by TACE and presenilin-2 releases the intracellular domain
    EpICD, which enters the nucleus in a complex with FHL2, beta-catenin and LEF1,
    contacts LEF1 consensus sites and induces transcription of MYC, cyclins and FABP5,
    driving proliferation.
