suggested_questions:
- question: What is the stoichiometry and geometry of the homophilic EpEX interaction in
    trans, and how does it coexist with claudin-7 binding at the same membrane?
- question: How does EpCAM weaken cadherin adhesion, given that it is not a component of
    adherens junctions?
- question: What fraction of EpCAM signalling output depends on nuclear EpICD versus on
    the shed EpEX ectodomain acting extracellularly?
suggested_experiments:
- hypothesis: EpCAM weakens cadherin adhesion indirectly, by sequestering or signalling
    through claudin-7 and the actin cortex, rather than by binding cadherins.
  description: Compare cadherin-adhesion strength in cells expressing wild-type EpCAM
    versus an EpCAM mutant that cannot bind claudin-7, using dual-pipette separation
    assays and quantitative imaging of E-cadherin junctions.
- hypothesis: Surface-accessible EpEX and nuclear EpICD make separable contributions to
    proliferation.
  description: Express uncleavable EpCAM and EpICD-only constructs in EpCAM-null epithelial
    cells and measure MYC and FABP5 induction, proliferation rate and adhesion separately
    for each.
- hypothesis: EpCAM homophilic adhesion requires no divalent cations and no cadherin
    machinery.
  description: Reconstitute purified EpEX on supported bilayers or beads and measure
    trans-binding by force spectroscopy in the presence and absence of calcium and of
    cadherin-blocking antibodies.
