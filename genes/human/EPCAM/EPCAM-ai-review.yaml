suggested_questions:
- question: Which tissue, junction-marker controls and spatial resolution distinguish the tight-junction
    EPCAM pool in PMID:16054130 from the below-junction lateral pool in PMID:23486470?
- question: Does the EPCAM–CDH1 interaction detected in PMID:32814053 occur between full-length endogenous
    proteins, and is it in cis or in trans across a cell contact?
- question: How does EPCAM–CLDN7 association alter claudin degradation and junction incorporation in primary
    human epithelia, and why do proliferation/barrier responses differ between cell models?
- question: Which endogenous EpICD cleavage products enter nuclear complexes, and what contacts distinguish
    its regulatory contribution from direct DNA binding or the activities of FHL2, beta-catenin and LEF1?
- question: What functional evidence beyond developmental expression supports the mouse-to-human ureteric
    bud development transfer from PMID:16545622?
- question: Which lineage-specific effects explain the differentiation phenotype after EPCAM knockdown
    in human embryonic stem cells without equating it with acquisition or loss of stem-cell identity?
core_functions:
- description: Membrane-anchored EPCAM binds claudin-7 and stabilizes a claudin-associated membrane pool
    at lateral epithelial contacts. This association contributes to epithelial cell-cell adhesion and
    organization without requiring EPCAM itself to form a homophilic trans-cellular adhesive bond. The
    direct human evidence concerns endogenous EPCAM and full-length constructs; soluble EpEX and released
    EpICD are distinct processing products and are not assigned this membrane role.
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
