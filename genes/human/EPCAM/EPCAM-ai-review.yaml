core_functions:
- description: Calcium-independent homophilic adhesion molecule of epithelial cells. The
    EpEX ectodomain engages EpCAM on the adjacent cell at the lateral membrane and at
    tight junctions, where it also associates with claudin-7, and its presence weakens
    cadherin-mediated adhesion.
