- term:
    id: GO:0098641
    label: cadherin binding involved in cell-cell adhesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    action: MODIFY
    summary: EpCAM adheres homophilically, and its documented effect on cadherin adhesion
      is to weaken it, so cadherin binding is not the activity by which it adheres.
    reason: The term asserts that EpCAM mediates cell-cell adhesion by binding cadherins.
      The experimental picture is the opposite in direction, because EpCAM transfectants segregate
      from cadherin-adhering parental cells and behave as if cell-cell adhesion were
      weakened, while EpCAM's own adhesive activity is homophilic and calcium-independent.
      The replacement records the adhesion-mediating activity without the incorrect
      mechanism; a plain cadherin-binding term is retained separately from the E-cadherin
      interaction row.
    proposed_replacement_terms:
    - id: GO:0098632
      label: cell-cell adhesion mediator activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
