  label: Homo sapiens
description: CACNA1E encodes the alpha1E pore-forming subunit of the R-type voltage-gated calcium channel
  CaV2.3. Its four homologous transmembrane domains couple membrane depolarization to calcium entry, with
  auxiliary subunits modulating channel properties. CaV2.3 acts in neuronal membranes to support calcium-dependent
  signaling and synaptic transmission, and also contributes to calcium entry in endocrine cells. Alternative
  splicing produces three named human protein products. Pathogenic variants can alter channel activation
  and inactivation and cause developmental and epileptic encephalopathy; enhanced channel activity is
  established for several tested variants rather than for every disease allele.
