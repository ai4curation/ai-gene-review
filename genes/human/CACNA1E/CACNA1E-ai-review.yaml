core_functions:
- description: CaV2.3 couples membrane depolarization to calcium influx through the alpha1E pore. In neuronal
    membranes this supplies calcium for synaptic signaling and transmitter release. Auxiliary subunits
    and splice variation modulate the same channel unit; they do not replace its pore-forming activity.
