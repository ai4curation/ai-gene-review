suggested_questions:
- question: Which experiments directly resolve calcium binding by the alpha1E EF-hand region, distinguishing
    the channel domain from calcium permeation through the pore and calcium binding by associated calmodulin?
- question: How do the three named human alpha1E products differ in native neuronal and endocrine channel
    gating, auxiliary-subunit composition and localization?
suggested_experiments:
- description: Compare the three sequence-defined human alpha1E products under matched auxiliary-subunit
    expression, measuring calcium currents, surface abundance and voltage-dependent activation/inactivation.
    Test the predicted EF-hand calcium-binding region separately with direct binding and structural assays.
