suggested_questions:
- question: Is alpha-2/delta-1 a synaptogenic receptor, and if so on which side of the synapse? The
    2009 thrombospondin-receptor claim was specifically postsynaptic, and astrocyte-conditioned-medium
    experiments published in 2026 still depend on it. The 2025 triple conditional knockout that found
    synapse development unaffected ablated alpha-2/delta-1, -2 and -3 together and only presynaptically.
    These two results are compatible, and the unanswered question is what a postsynaptic conditional
    knockout of alpha-2/delta-1 alone would show.
- question: Does alpha-2/delta-1 form a functional complex with NMDA receptors independently of calcium
    channels? Essentially all of the primary evidence comes from one laboratory, using two shared
    reagents (gabapentin and an alpha-2/delta-1 C-terminal interfering peptide) across pain, hypertension
    and HIV models. No independent replication and no explicit rebuttal was found in the 2025-2026
    literature. What is needed is a structural or proximity-labelling demonstration of the interaction
    from a different group, and a test in Cacna2d1 knock-in mice carrying a C-terminal deletion that
    spares channel function.
- question: Should the three `enables GO:0005245` rows be harmonised to `contributes_to`? The gene
    carries the same term with both qualifiers, and the source paper behind one of the enables rows
    describes the alpha-2 subunit as accessory. Mixed qualifiers on one term make the annotation
    set internally inconsistent about whether alpha-2/delta-1 is pore-forming.
- question: What observation underlies the `is_active_in GO:0098992 neuronal dense core vesicle`
    annotation? A GPI-anchored extracellular subunit of a surface channel acting in a secretory vesicle
    is difficult to interpret, and the qualifier asserts activity rather than mere presence.
- question: Do gabapentinoids act therapeutically by inhibiting alpha-2/delta-1 trafficking of calcium
    channels, by disrupting a proposed alpha-2/delta-1-NMDAR complex, or by blocking thrombospondin
    binding? All three mechanisms have been proposed for the same drug-target pair and they imply
    different molecular functions for the protein.
suggested_experiments:
- description: Generate a postsynaptic-restricted, single-gene conditional knockout of Cacna2d1 in
    cortical or hippocampal neurons and assay excitatory synapse number with and without astrocyte-conditioned
    medium or purified thrombospondin-1. This is the experiment that the 2025 presynaptic triple
    knockout explicitly does not perform, and it would test the original 2009 claim on its own terms.
- description: Knock in a Cacna2d1 allele lacking the intrinsically disordered C-terminal region
    proposed to mediate NMDA receptor binding, while leaving the VWA/MIDAS and Cache domains and
    the GPI anchor intact. If calcium-channel trafficking is normal but NMDAR synaptic trafficking
    and neuropathic pain behaviour are lost, the two functions are separable; if channel function
    is also lost, the NMDAR phenotypes reported to date cannot be attributed to a channel-independent
    complex.
- description: Attempt independent replication of the alpha-2/delta-1-NMDAR interaction outside the
    originating laboratory, using a method that does not rely on co-immunoprecipitation or the C-terminal
    peptide - for example proximity labelling in spinal dorsal horn tissue, or single-molecule pull-down
    from native membranes - and quantify what fraction of synaptic GluN1 is associated with alpha-2/delta-1.
- description: Measure calcium-channel surface density and current density in parallel for each of
    the disease-associated CACNA2D1 variants (epileptic encephalopathy and short-QT alleles) in the
    same cell background, to test whether all pathogenic variants act through the trafficking/regulator
    function or whether some act only through a proposed non-channel partner.
