  supported_by:
  - reference_id: PMID:40367942
    supporting_text: The α2δs are a family of extracellular synaptic molecules that are auxiliary
      subunits of voltage-gated Ca2+ channel (CaV) complexes.
  - reference_id: PMID:1309651
    supporting_text: Thus, the beta 2 subunit appears to serve an obligatory function, whereas the
      alpha 2b subunit appears to play an accessory role that potentiates expression of the channel.
  - reference_id: PMID:35293990
    supporting_text: Here we report biallelic variants in CACNA2D1, encoding the α2δ-1 protein, in
      two unrelated individuals showing a developmental and epileptic encephalopathy.
- description: Separately from being counted as part of the conducting complex, alpha-2/delta-1 modulates
    that complex. It raises peak calcium-current density and shifts voltage-dependent activation
    to more negative potentials, and it does so principally by increasing the number of channels
    delivered to and retained at the plasma membrane rather than by changing the unitary behaviour
    of the alpha-1 subunit. This trafficking-and-gating modulation is the subunit's own contribution,
    it is what disease variants perturb, and it is the property the 2025 presynaptic triple knockout
    confirmed while overturning the synaptogenic claims. It is also the reason gabapentinoids, which
    bind alpha-2/delta-1, act on neuronal excitability despite having little direct effect on calcium
    current.
