- term:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The channel-level activity of the CaV complex that alpha-2/delta-1 is a constituent
      subunit of. Correct term; the enables qualifier overstates the subunit's role.
    action: ACCEPT
    reason: 'Accepted because the term is right and the assertion is sound at the family node: every
      characterised alpha-2/delta is a subunit of a high-voltage-activated calcium channel. The reservation
      is about the qualifier, not the term. Alpha-2/delta-1 has no transmembrane pore - it is a GPI-anchored
      extracellular subunit - and the same annotation set already carries this term three times with
      contributes_to (GO_REF:0000107, PMID:17224476, PMID:11160515). The enables rows should be harmonised
      to contributes_to. This is recorded here rather than as MODIFY because MODIFY is for replacing
      terms, and the term needs no replacement.'
    supported_by:
    - reference_id: PMID:40367942
      supporting_text: The α2δs are a family of extracellular synaptic molecules that are auxiliary
        subunits of voltage-gated Ca2+ channel (CaV) complexes.
