- term:
    id: GO:0005246
    label: calcium channel regulator activity
  evidence_type: IDA
  original_reference_id: PMID:25527503
  qualifier: enables
  review:
    summary: Proposed new annotation. The one thing alpha-2/delta-1 does that is genuinely its own,
      rather than a property of the complex it joins, is to modulate the calcium channel - raising
      peak current density and shifting voltage-dependent activation, chiefly by controlling how
      many channels reach and remain at the cell surface.
    action: NEW
    reason: 'GOA currently describes alpha-2/delta-1 only as a participant in the channel-level activity
      (GO:0005245, six rows) and as part of the complex (GO:0005891, GO:1990454). None of those terms
      states what the subunit itself contributes. GO:0005246 "Modulates the activity of a calcium
      channel" is exactly that statement, is supported by side-by-side surface-density and patch-clamp
      measurements on the human protein, and is consistent across the field from the 1992 human cloning
      to the 2025 presynaptic triple knockout. Adding it also resolves the awkwardness of the three
      enables GO:0005245 rows: the subunit enables regulation, and contributes to conduction.'
    supported_by:
    - reference_id: PMID:25527503
      supporting_text: CaVα2δ increases the peak current density and improves the voltage-dependent
        activation gating of CaV1.2 channels without increasing the surface expression of the CaVα1
        subunit.
    - reference_id: PMID:35293990
      supporting_text: They play important roles in trafficking and function of the CaV channel complexes.
    - reference_id: PMID:40367942
      supporting_text: Our data supports previous studies demonstrating that α2δs are positive regulators
