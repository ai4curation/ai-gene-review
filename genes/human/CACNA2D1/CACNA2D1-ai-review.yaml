core_functions:
- description: Alpha-2/delta-1 is a constitutive auxiliary subunit of high-voltage-activated calcium
    channel complexes. Assembled with a CaV1 or CaV2 pore-forming alpha-1 subunit and a cytoplasmic
    CaV-beta subunit, it is required for the complex to produce a normal calcium current. It contributes
    no pore of its own - the mature protein is a disulphide-linked extracellular alpha-2 chain plus
    a membrane-attached delta chain, GPI-anchored on the outer face of the plasma membrane - so its
    participation in conduction is recorded as a contribution to a complex-level activity rather
    than an activity it independently enables. Deployed in skeletal and cardiac muscle T-tubules
    and at neuronal presynaptic terminals.
