- id: PMID:19818485
  title: Gabapentin receptor alpha2delta-1 is a neuronal thrombospondin receptor responsible for
    excitatory CNS synaptogenesis.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Cell 2009). The origin of the thrombospondin-receptor/synaptogenesis
      model. Correctly cited and highly influential, but the claim is contested - a 2025 presynaptic
      triple conditional knockout found synapse development intact. Note that the original claim
