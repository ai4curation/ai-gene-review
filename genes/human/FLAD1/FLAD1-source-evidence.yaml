product_interpretation:
- Five natural product sequences reconstructed from current UniProt VSP features match their official
  FASTA records exactly.
- Only the dangling sequence notes of Q8NFF5-4 and Q8NFF5-5 were repaired by the repository helper, appending
  VSP_027952 and VSP_027953 respectively. Product order, identifiers, names and all other fields remain
  unchanged.
- Current UniProt isoforms 1 and 2 correspond to FADS1 and FADS2. Numeric labels for later products cannot
  be cross-mapped to paper isoforms from names alone.
- PMID:27259049 paper isoform 5 skips the MPTb-encoding region and differs from current Q8NFF5-5; its
  paper isoform 6 is predicted to start at Met268 and has no current Q8NFF5-6 record.
- Met268 and Met355 constructs were expressed in control fibroblasts; Met268 increased extract FAD synthesis
  in an experiment described as data not shown. This is not demonstrated rescue of patient cells or identification
  of the endogenous 26-kDa product.
- The endogenous small-band identity and processing remain partly speculative despite two FADS-specific
  peptides. Do not assign those effects to current products 3-5.
primary_assay_boundaries:
- reference: PMID:23443125
  access: Actual cached full-text Results and Methods
  finding: Human residues 329-587 with a His tag synthesize FAD from FMN and ATP. Cleavage in this domain
    study requires added pyrophosphate and is reverse pyrophosphorolysis, distinct from water-dependent
    N-terminal hydrolysis.
- reference: PMID:25954742
  access: Actual cached full-text Methods, Results and captions; no figure-pixel claim
  finding: Recombinant human hFADS2 directly transfers cofactor to recombinant rat apo-DMGDH. LSD1 association
    assays instead use rat nuclear material; purified-human-LSD1 transfer was not demonstrated. Human
    HepG2 immunostaining supports nuclear/cytoplasmic localization without resolving all products.
- reference: PMID:38688286
  access: Normal cache abstract-only; separate original author-repository PDF consultation read selected
    Results/Discussion/Methods and visually inspected PDF pages 7, 8, 11 and 19; supplementary files not
    inspected.
  original_pdf_url: https://ricerca.uniba.it/bitstream/11586/474844/3/1-s2.0-S0969212624001321-main.pdf
  original_pdf_sha256: 1f5af90215eb84f43d10ed460850ed867cce5bd92ae5f8fd56df32c623fa053e
  finding: Crystal construct 110-587 lacks twelve residues of natural isoform 2. MPTb alone binds nucleotides
    but lacks measurable FAD hydrolysis; MPTb plus KH restores it. The proposed site spans protomers.
    FAD hydrolysis assays used 1 mM CoCl2, 50 mM KCl and 1 micromolar FAD. Physiological significance
    is explicitly uncertain because free cobalt is scarce. NADH experiments here show binding/docking
    and cite earlier turnover work; no independently measured relative NADH rate is claimed.
- reference: PMID:31351152
  access: Cached abstract plus the earlier-work discussion in the separately accessed PMID:38688286 primary
    text
  finding: Directly read FAD turnover and cobalt/potassium stimulation, NADH inhibition and glutathione
    stimulation. The curated NADH substrate activity is retained non-core, but an isolated NADH turnover
    assay was not independently recovered. The inherited UniProt excerpt describes FAD hydrolysis and
    is not itself NADH-turnover evidence.
- reference: PMID:20060505
  access: Cached abstract
  finding: Human hFADS1 import and processing were studied in rat mitochondria, and human-construct localization
    in BHK-21/Caco-2 cells. Exact first-17-residue targeting-peptide cleavage is a prediction in the accessible
    source, not a mapped cleavage boundary.
- reference: PMID:23946482
  access: Cached abstract and official current rat donor records
  finding: Rat nuclear FADS localization is measured by confocal microscopy/immunoblotting. The separately
    observed nuclear FAD-degrading activity is not uniquely assigned to FLAD1 by this paper.
- reference: PMID:27259049
  access: Independent consultation of actual cached full-text Methods and Results; no supplementary table
    or figure-pixel claim
  finding: Residual cellular activity, small-construct competence in control fibroblasts, cofactor-dependent
    stability rescue of recombinant Ser495del, and clinical riboflavin response are distinct observations.
    FAD loading did not restore maximum catalytic activity of the tested variants. See product boundaries
    above.
