id: Q8NFF5
gene_symbol: FLAD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FLAD1 encodes a multidomain FAD synthase that catalyzes the ATP-dependent adenylylation
  of FMN to FAD and diphosphate, supplying the flavin cofactor required by many oxidoreductases.
  Its C-terminal PAPS-reductase-family domain performs FAD synthesis with a divalent metal
  requirement. The N-terminal molybdopterin-binding-like and KH domains together support a
  distinct FAD diphosphatase activity, producing FMN and AMP; this activity is established
  biochemically under cobalt-dependent assay conditions, while its contribution to physiological
  flavin turnover remains unresolved. Recombinant human FADS can retain its FAD product tightly
  and transfer it to an acceptor apoflavoprotein in vitro. The longer isoform 1 is imported
  into mitochondria, whereas isoform 2 is cytosolic, and FADS immunoreactivity is also detected
  in nuclei. These localization observations do not establish the activities or destinations
  of every alternatively spliced product. Biallelic FLAD1 variants can cause lipid storage
  myopathy with multiple acyl-CoA dehydrogenase and combined respiratory-chain deficiencies;
  clinical response to riboflavin varies.
