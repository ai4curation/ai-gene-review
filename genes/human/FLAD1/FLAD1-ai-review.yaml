    context.
  findings:
  - statement: The paper describes a high-confidence human mitochondrial proteome; the retained
      title-fragment quotation does not establish FLAD1 as a target hit. FLAD1 mitochondrial
      localization is independently supported by PMID:20060505.
    reference_section_type: ABSTRACT
    supporting_text: Quantitative high-confidence human mitochondrial proteome and its dynamics
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full body describes high-confidence mitochondrial proteomics, but exact
      FLAD1 target row was not recovered. The inherited title-fragment quote does not demonstrate
      the target hit. Independent PMID:20060505 supports localization.
- id: PMID:38688286
  title: Structural insights into the bifunctional enzyme human FAD synthase.
  findings:
  - statement: Structural analysis of human 110-587 and domain constructs supports C-terminal
      FAD synthesis and an MPTb/KH interprotomer FAD-hydrolysis site. The crystal construct
      lacks twelve residues of natural isoform 2.
    reference_section_type: ABSTRACT
    supporting_text: the C-terminal domain tightly binds FAD and catalyzes its synthesis,
      while the combination of the N-terminal molybdopterin-binding and KH domains is the
      minimal essential substructure required for the hydrolysis of FAD
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Normal cache remains abstract-only. Separately accessed original author-repository
      PDF was read in a documented primary consultation: human 110-587 crystal construct,
      MPTb/KH hydrolysis and interprotomer mechanism. NADH binding/docking is distinct from
      earlier cited turnover; physiological cobalt availability is an explicit limitation.'
