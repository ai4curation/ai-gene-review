  title: The antibiotics roseoflavin and 8-demethyl-8-amino-riboflavin from Streptomyces davawensis
    are metabolized by human flavokinase and human FAD synthetase.
  findings:
  - statement: Human FAD synthetase converts RoFMN to RoFAD but does not accept AFMN, defining
      substrate scope of the FMN adenylyltransferase activity.
    reference_section_type: ABSTRACT
    supporting_text: Consequently, roseoflavin adenine dinucleotide (RoFAD) was synthesized
      by the latter enzyme
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; confirms FMN adenylyltransferase activity on riboflavin
      analogs.
