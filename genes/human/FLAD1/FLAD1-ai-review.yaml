proposed_new_terms: []
suggested_questions:
- question: Under which physiological conditions do cobalt availability and oligomerization
    permit significant FAD or NADH hydrolysis by FLAD1, and which natural products contribute
    to each compartmental pool?
- question: Which client apoflavoproteins receive FAD directly from human FLAD1 in vivo, beyond
    the in-vitro human-FADS2/rat-DMGDH transfer demonstrated experimentally?
suggested_experiments:
- description: Measure compartment-specific FAD, FMN and NADH turnover after isoform-selective
    FLAD1 perturbation and rescue with synthesis- or hydrolysis-defective constructs whose
    activities are verified at physiological metal concentrations.
- description: Compare sequence-confirmed natural FLAD1 products with the published truncated
    constructs for localization, dimerization and client-specific cofactor transfer.
