- id: PMID:20060505
  title: Mitochondrial localization of human FAD synthetase isoform 1.
  findings:
  - statement: Human isoform 1 is imported and processed in mitochondria, whereas isoform
      2 is cytosolic; the exact targeting-peptide cleavage position is predicted in the accessible
      abstract.
    reference_section_type: ABSTRACT
    supporting_text: hFADS1, but not hFADS2, localizes in mitochondria
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract directly reports human isoform-1 mitochondrial import and processing
      in rat mitochondria, differential human-construct localization in BHK-21/Caco-2 cells,
      and synthase activity. The precise predicted targeting-peptide cleavage boundary is
      not an experimentally established residue map.
