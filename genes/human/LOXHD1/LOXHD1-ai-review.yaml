- id: PMID:19732867
  title: Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt
    hair cell function in mice and cause progressive hearing loss in humans.
  findings:
  - statement: >-
      In the samba mouse model, a Loxhd1 mutation leaves stereociliary development
      intact but perturbs hair-cell function and is followed by hair-cell degeneration.
    supporting_text: >-
      Stereociliary development is unaffected in samba mice, but hair cell function is
      perturbed and hair cells eventually degenerate.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Mouse LOXHD1 is a PLAT-repeat protein localized along the membrane of mature
      hair-cell stereocilia.
    supporting_text: >-
      LOXHD1 consists entirely of PLAT (polycystin/lipoxygenase/alpha-toxin) domains and
      is expressed along the membrane of mature hair cell stereocilia.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      A human LOXHD1 mutation was identified as the cause of DFNB77, a progressive
      autosomal-recessive nonsyndromic hearing-loss phenotype.
    supporting_text: >-
      Based on the studies in mice, we screened DNA from human families segregating
      deafness and identified a mutation in LOXHD1, which causes DFNB77, a progressive
      form of autosomal-recessive nonsyndromic hearing loss (ARNSHL).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational mouse/human primary study and the direct source of the IMP annotation.
      The cached record is abstract-only despite listing a PMCID, so localization,
      physiology and human genetics are limited here to claims stated explicitly in the
      abstract; detailed assays and isoform identity cannot be independently checked from
      this cache.
- id: PMID:33707295
  title: Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells.
  findings:
  - statement: >-
      Two mouse alleles affecting PLAT repeat 10 caused a late-onset inner-hair-cell
      mechanotransduction defect: currents were near wild type at P7 but drastically
      reduced at P11.
    supporting_text: >-
      Using two mouse mutants of LOXHD1-PLAT10, we demonstrated here that inner hair cell
      (IHC) mechanotransduction currents were drastically reduced at P11, in contrast to
      the wild-type (WT)-like MET currents observed at P7.
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  - statement: >-
      The mouse mechanotransduction defect preceded gross bundle disruption and occurred
      while key upper- and lower-tip-link complex proteins remained localized.
    supporting_text: >-
      The Loxhd1 MET defect was novel, as it occurred without an altered hair bundle
      structure or mislocalization of key upper (Harmonin) or lower (LHFPL5) TL complex
      proteins.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text mouse primary study that directly establishes a requirement for Loxhd1 in
      mature cochlear hair-cell mechanotransduction. Both tested mutations affect PLAT10,
      and alternative splicing around one engineered allele complicates extrapolation to
      complete loss of every isoform. It supports conserved human function by orthology,
      not direct physiology in human hair cells.
- id: PMID:39256406
  title: LOXHD1 is indispensable for maintaining TMC1 auditory mechanosensitive channels
    at the site of force transmission.
  findings:
  - statement: >-
      In mouse inner hair cells, LOXHD1 is required to maintain TMC1 in stereocilia and
      near the shorter-stereocilium tip where the lower tip link inserts.
    supporting_text: >-
      Overall, these SUB-immunogold-SEM experiments support that LOXHD1 is required for
      the maintenance of TMC1 in IHC stereocilia. Importantly, LOXHD1 is also critical for
      maintenance of TMC1 within the first 100 nm of the row 2 tips, where the tip links
      insert and where the mechanical stimuli are received.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Full-length tagged LOXHD1 selectively co-immunoprecipitated with TMC1 but not TMC2
      in heterologous HEK293T-cell assays.
    supporting_text: >-
      These experiments demonstrate that LOXHD1 interacts selectively in vitro with TMC1
      but not with TMC2.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Mouse in-situ nanoscale localization places LOXHD1 in protein complexes attached to
      the lower tip-link branches.
    supporting_text: >-
      Thus, we conclude that as for TMC1, LOXHD1 proteins are integral to protein complexes
      attached to the lower tip-link branches in vivo.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Decisive peer-reviewed mechanistic study, superseding the earlier preprint record.
      In-vivo localization, knockout physiology and channel-positioning data are
      from mouse hair cells. Partner-selectivity evidence uses overexpressed tagged
      proteins in HEK293T cells and supports association, not necessarily direct binding
      interfaces or a stable complex of fixed stoichiometry. The deleted mouse allele was
      designed to remove all PLAT-repeat-coding exons and avoid isoform compensation.
- id: PMID:35705030
  title: Oncofusion-driven de novo enhancer assembly promotes malignancy in Ewing sarcoma
    via aberrant expression of the stereociliary protein LOXHD1.
  findings:
  - statement: >-
      Ewing-sarcoma cells express an alternative human LOXHD1 short isoform with 13 PLAT
      repeats and one coiled-coil region, rather than the full 15-PLAT-repeat architecture.
    supporting_text: >-
      The short isoform LOXHD1 contains 33 exons and codes for 1891 aa protein containing
      13 PLAT and 1 coiled-coil domains (Figure 2B).
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full-text human-cell study included only to delimit isoform and context. Its
      oncofusion-driven short isoform and Ewing-sarcoma phenotypes must not be generalized
      to normal cochlear LOXHD1 localization or function.
