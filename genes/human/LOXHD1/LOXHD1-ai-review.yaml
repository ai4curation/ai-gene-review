suggested_questions:
- question: >-
    Which human LOXHD1 isoforms and PLAT repeats are present in inner and outer hair
    cells across maturation, and which are sufficient for normal mechanotransduction?
- question: >-
    Does LOXHD1 directly contact TMC1 in native stereocilia, or does it maintain TMC1
    indirectly through membrane organization, trafficking, or another partner?
- question: >-
    Do different pathogenic LOXHD1 variants converge on loss of TMC1 tip retention, or
    can progressive hearing loss arise through separable effects on stereociliary
    maintenance and hair-cell survival?
suggested_experiments:
- hypothesis: >-
    A defined subset of human LOXHD1 isoforms is expressed in mature cochlear hair
    cells and is sufficient to maintain the auditory mechanotransduction apparatus.
  description: >-
    Perform long-read RNA sequencing and isoform-specific targeted proteomics in human
    cochlear tissue or validated stem-cell-derived hair cells, then rescue LOXHD1-null
    cells with each isoform expressed at endogenous levels and measure TMC1 localization
    and mechanotransduction currents.
  experiment_type: isoform-resolved transcriptomics, proteomics, and physiological rescue
- hypothesis: >-
    LOXHD1 maintains TMC1 through a native stereociliary association that requires
    specific PLAT repeats but does not require a fixed-stoichiometry complex.
