  review:
    summary: >-
      Proposed new annotation. LOXHD1 is required for mature auditory hair-cell
      mechanotransduction and maintenance of TMC1 at the stereociliary force-reception
      site.
    action: NEW
    reason: >-
      The existing sound-perception annotations are correct but do not capture the
      experimentally resolved sensory-transduction step. Mouse Loxhd1 loss markedly
