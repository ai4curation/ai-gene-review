description: >-
  LOXHD1 is a large PLAT-repeat protein that acts at the membrane of mature
  auditory hair-cell stereocilia. Human biallelic variants cause progressive
  autosomal-recessive nonsyndromic hearing loss, while mouse studies show that
  Loxhd1 preserves mechanotransduction currents and maintains TMC1 channels near
  the lower tip-link force-transmission site. The human gene has four annotated
  splice isoforms with substantially different PLAT-repeat complements, but the
  isoform or isoforms used in the normal human cochlea are not known. No enzymatic
  activity has been established for LOXHD1; its repeat architecture and available
  evidence instead support a nonenzymatic role in organizing or maintaining the
  mature stereociliary mechanotransduction apparatus.
