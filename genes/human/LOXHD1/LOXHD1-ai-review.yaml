knowledge_gaps:
- gap_statement: >-
    The molecular activity by which LOXHD1 maintains TMC1 at the lower tip-link site
    is unknown; available co-immunoprecipitation establishes association under
    heterologous overexpression conditions but not a direct interface, stoichiometry,
    or stable complex.
  boundary: >-
    Mouse in-situ data establish a requirement for TMC1 positioning, whereas the
    partner-selectivity assay used tagged proteins expressed in HEK293T cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving whether LOXHD1 retains, traffics, or mechanically stabilizes TMC1 is
    necessary before assigning a molecular-function term or defined complex membership.
  resolution: >-
    Map endogenous LOXHD1-TMC1 proximity and interfaces in hair cells, then test
    separation-of-function variants for TMC1 tip retention and mechanotransduction.
  provenance:
  - reference_id: PMID:39256406
    supporting_text: >-
      These experiments demonstrate that LOXHD1 interacts selectively in vitro with TMC1
      but not with TMC2.
- gap_statement: >-
    Which of the four annotated human LOXHD1 splice isoforms are translated and
    required in cochlear hair cells is unknown.
  boundary: >-
    UniProt records four human transcripts with different sequence complements, while
    the normal cochlear studies do not identify the human protein isoform assayed.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The isoforms retain different subsets of the 15 annotated PLAT repeats, so an
    unbounded gene-level model cannot establish which repeats are required in humans.
  resolution: >-
    Use long-read transcript sequencing and isoform-specific proteomics in human
    cochlear tissue or validated hair-cell models, followed by physiological rescue
    with each endogenous isoform.
  provenance:
