- id: file:human/LOXHD1/LOXHD1-bioinformatics/RESULTS.md
  title: LOXHD1 bioinformatics analysis of PLAT-repeat architecture and isoform boundaries
  findings:
  - statement: >-
      The displayed human LOXHD1 sequence is a near-continuous 15-PLAT-domain array
      without a separately annotated catalytic domain.
    supporting_text: >-
      The curated Q8IVV2 sequence is a near-continuous array of 15 annotated PLAT
      domains (residues 43-2064), with no separately annotated catalytic domain.
  - statement: >-
      Coordinate mapping shows that the shorter curated isoforms retain substantially
      different subsets of the displayed sequence's PLAT repeats.
    supporting_text: >-
      Q8IVV2-3 loses repeats 1-6, deletes 92 of 121 annotated residues in repeat 7,
      retains repeats 8-14, and alters repeat 15 through a 12-residue replacement
      followed by deletion from residue 2020 onward. - Q8IVV2-4 loses repeats 1-11,
      deletes the first four annotated residues of repeat 12, retains repeats 13-14,
      and deletes the C-terminal 52 annotated residues of repeat 15. - Q8IVV2-5 loses
      repeats 1-11, deletes the first four annotated residues of repeat 12, and retains
      repeats 13-15.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reproducible coordinate analysis of the reviewed UniProt record, with positive and
      negative controls. It documents architecture and isoform boundaries but does not
      prove catalytic absence, repeat folding, or cochlear isoform usage.
core_functions:
- description: >-
    LOXHD1 acts at the stereociliary membrane of mature auditory hair cells to
    maintain the mechanotransduction apparatus required for detection of sound.
    Human genetics establishes its requirement for hearing, and mouse hair-cell
    studies show that Loxhd1 preserves mechanotransduction currents and maintains
    TMC1 near the lower tip-link force-reception site. This is represented as a
    conserved biological role without assigning a molecular function: no catalytic
    activity or direct binding mechanism has been demonstrated. Heterologous
    co-immunoprecipitation supports selective association with TMC1, not membership
    in a defined stable complex. The responsible human cochlear isoform is unknown,
    so the function is not restricted to any one of Q8IVV2-1, Q8IVV2-3, Q8IVV2-4,
    or Q8IVV2-5.
  supported_by:
  - reference_id: PMID:19732867
    supporting_text: >-
      Based on the studies in mice, we screened DNA from human families segregating
      deafness and identified a mutation in LOXHD1, which causes DFNB77, a progressive
      form of autosomal-recessive nonsyndromic hearing loss (ARNSHL).
  - reference_id: PMID:33707295
    supporting_text: >-
      Using two mouse mutants of LOXHD1-PLAT10, we demonstrated here that inner hair cell
      (IHC) mechanotransduction currents were drastically reduced at P11, in contrast to
      the wild-type (WT)-like MET currents observed at P7.
  - reference_id: PMID:39256406
    supporting_text: >-
      Overall, these SUB-immunogold-SEM experiments support that LOXHD1 is required for
      the maintenance of TMC1 in IHC stereocilia. Importantly, LOXHD1 is also critical for
      maintenance of TMC1 within the first 100 nm of the row 2 tips, where the tip links
      insert and where the mechanical stimuli are received.
  directly_involved_in:
  - id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  locations:
