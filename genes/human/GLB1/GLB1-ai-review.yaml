status: COMPLETE
description: GLB1 encodes lysosomal beta-galactosidase, which removes terminal beta-linked galactose
  from glycoconjugates, including gangliosides, glycoprotein-derived glycans and keratan sulfate.
  The active enzyme undergoes lysosomal maturation and associates with a multienzyme system containing
  protective protein cathepsin A and neuraminidase. Deficiency causes GM1 gangliosidosis or Morquio
  B disease. Alternative splicing also produces the shorter, catalytically inactive S-Gal/elastin-binding
  protein, which binds extracellular-matrix ligands and supports elastic-fiber deposition. These activities
  belong to distinct GLB1 products.
