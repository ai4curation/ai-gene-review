suggested_questions:
- question: Which GLB1-containing oligomeric assemblies predominate in human lysosomes at physiological
    pH, and how do they differ from the processed recombinant dimer?
- question: Which steps of tropoelastin secretion and elastic-fiber assembly require direct S-Gal
    binding, and which depend on other components of the elastin-receptor system?
- question: What distinguishes the localization and catalytic capacity of the 647-residue P16278-3
    product from the established long and S-Gal products?
suggested_experiments:
- description: Measure endogenous lysosomal GLB1 stoichiometry and partners with native separation
    and orthogonal structural or cross-linking measurements across controlled luminal pH conditions.
- description: Compare isoform-specific S-Gal rescue with ligand-binding-defective constructs while
    tracking tropoelastin secretion and matrix incorporation, separating ligand association from
    downstream receptor effects.
- description: Express sequence-verified P16278-3 alongside P16278-1 and P16278-2 under matched conditions
    and measure processing, localization and substrate-specific catalysis.
