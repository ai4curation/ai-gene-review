id: Q5JTC6
gene_symbol: AMER1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AMER1, also known as WTX, is a phosphoinositide-binding scaffold that connects APC and other
  canonical Wnt signaling proteins to the cytoplasmic surface of the plasma membrane. Its membrane-targeting
  region and protein interaction regions organize distinct complexes: it can stabilize Axin and promote
  beta-catenin destruction, while also facilitating Axin-associated kinase recruitment and LRP6 receptor
  phosphorylation during Wnt stimulation. AMER1 can also stabilize NRF2 by competing for its KEAP1 interaction,
  and a nuclear pool associates with WT1 and nuclear bodies. Its membrane-associated and nuclear activities
  vary with cellular context and alternative splicing.'
