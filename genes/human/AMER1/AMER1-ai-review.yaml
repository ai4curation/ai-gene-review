- id: PMID:17204608
  title: An X chromosome gene, WTX, is commonly inactivated in Wilms tumor.
  findings:
  - statement: WTX is recurrently inactivated in the assayed Wilms tumors; this supports tumor-associated
      biology, not a direct molecular activity.
    supporting_text: 'This gene,

      which we call WTX, is inactivated in approximately one-third of Wilms tumors (15

      of 51 tumors).'
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Actual complete abstract read: primary human tumor copy-number study, 15/51 WTX-inactivated
      tumors, mutually exclusive WT1 mutations, one active X hit. Supports tumor-associated description,
      not a direct molecular activity. Prior external publication identity corroboration retained; abstract-only
      cache. Required normal cache is now present; identity/access assessment does not imply uninspected
      supplementary access.'
- id: PMID:19079258
  title: Germline mutations in WTX cause a sclerosing skeletal dysplasia but do not predispose to tumorigenesis.
  findings:
  - statement: Human germline WTX variants are associated with OSCS; construct-specific molecular effects
      remain outside this abstract.
    supporting_text: 'Here we demonstrate that germline mutations

      in WTX (FAM123B), a gene that encodes a repressor of canonical WNT signaling,

      cause an X-linked sclerosing bone dysplasia, osteopathia striata congenita with

      cranial sclerosis (OSCS; MIM300373).'
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Actual complete abstract read and publisher https://www.nature.com/articles/ng.270
      independently opened: authors/title/year/DOI and clinical OSCS abstract match. Human germline mutation
      and mouse fetal skeleton expression; alternative splicing association with localization/survival
      does not identify a canonical current isoform. Publisher main body subscription-restricted. No direct
      mechanistic or construct-species extension. Required normal cache is now present; identity/access
      assessment does not imply uninspected supplementary access.'
- id: PMID:19416806
  title: The tumor suppressor WTX shuttles to the nucleus and modulates WT1 activity.
  findings:
  - statement: WTX shuttles to a nuclear pool and co-localizes with a paraspeckle marker; the abstract
      does not map this to every current isoform.
    supporting_text: 'WTX is present in distinct subnuclear structures and

      co-localizes with the paraspeckle marker p54NRB/NONO, suggesting a role in

      transcriptional regulation.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual complete abstract read: WTX nuclear translocation, splicing/nuclear-export modulation,
      p54NRB/NONO colocalization and WT1-associated AREG transcription. PMCID present but recovered cache
      abstract-only; prior independently documented external main-body reading kept distinct. Required
      normal cache is now present; identity/access assessment does not imply uninspected supplementary
      access.'
- id: PMID:20843316
  title: 'The WTX/AMER1 gene family: evolution, signature and function.'
  findings:
  - statement: In the reported HEK293T reporter comparison, mouse Amer1 suppresses beta-catenin output
      whereas Amer2 and Amer3 do not; this does not resolve PAINT node placement.
    supporting_text: As previously reported, WTX/AMER1 acts as a negative regulator of β-catenin activity.
      In contrast, AMER2 and AMER3 do not interfere with β-catenin dependent activation of the TOP-flash
      reporter gene.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual XML body selected Results, Figure4, Plasmids and reporter Methods read. Mouse
      Wtx/Amer1, Amer2 and Amer3 PCR-cloned from BACs into pAcGFP1-C1; human beta-catenin, HEK293T TOP/FOP
      reporter host, 36h luciferase normalized to beta-gal. Amer1 inhibits reporter whereas Amer2/3 do
      not under tested conditions. Phylogeny supports related family, not interchangeable downstream function;
      APC recruitment for Amer3 remains prediction, not assayed result. No supplementary-file read claim.
      Required normal cache is now present; identity/access assessment does not imply uninspected supplementary
      access.
- id: PMID:22215675
  title: Wilms tumor gene on X chromosome (WTX) inhibits degradation of NRF2 protein through competitive
    binding to KEAP1 protein.
  findings:
  - statement: A historical human 804-residue WTX construct directly binds KEAP1; motif-dependent competition
      with NRF2 reduces its ubiquitination without making WTX a ubiquitin ligase.
    supporting_text: Using this method, we determined that WTX directly interacts with KEAP1 but not with
      the KEAP1-associated CUL3 protein
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary identity independently verified and the recovered normal scientific body read
      for Methods, Results and figure captions. Purified human GST-VSV-WTX binds KEAP1 with CUL3 negative;
      motif-dependent peptide competition and translated-component ubiquitination assays support NRF2
      stabilization. The paper explicitly uses a human 804-residue construct, distinct from the canonical
      1135-residue protein and the 858-residue internal-deletion form. Endogenous cell perturbations provide
      separate corroboration. Neither all current isoforms nor full-length canonical protein are thereby
      assayed. Extracted aggregates are duplicated; separate supplements were not inspected. The exact
      normal cache is now present.
core_functions:
- description: Acts as a membrane adaptor by coupling phosphoinositide recognition to recruitment and
    organization of APC, Axin and associated Wnt signaling proteins. Distinct complexes support negative
    downstream regulation and positive receptor-level regulation. Membrane targeting and protein-recruitment
    experiments support an active scaffolding role; the associated enzymes perform phosphorylation, ubiquitination
    and proteolysis.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0060828
    label: regulation of canonical Wnt signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17925383
    supporting_text: 'APC is recruited to the plasma membrane by binding to APC

      membrane recruitment 1 (AMER1)'
  - reference_id: PMID:21304492
    supporting_text: 'Amer1 binds CK1γ, recruits Axin and GSK3β to the

      plasma membrane and promotes complex formation between Axin and LRP6.'
  - reference_id: PMID:21498506
    supporting_text: Amer1 directly interacts with the armadillo repeats of β-catenin
- description: Binds PtdIns(4,5)P2 through its N-terminal membrane-targeting region, anchoring AMER1 to
    the cytoplasmic plasma-membrane surface where it recruits Wnt signaling proteins. This lipid-recognition
    activity provides the membrane-targeting component of the adaptor mechanism.
  molecular_function:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17925383
    supporting_text: 'The N-terminus of AMER1 contains

      two distinct phosphatidylinositol(4,5)-bisphosphate [PtdIns(4,5)P(2)]-binding

      domains, which mediate its localization to the plasma membrane.'
suggested_questions:
- question: How do the sequence-defined 2011 S2 deletion construct, the 804-residue WTX-PRED/short sequence
    and the current UniProt Q5JTC6-2 record correspond to expressed human transcripts?
- question: Which endogenous conditions switch membrane-bound AMER1 from destruction-complex stabilization
    to LRP6 receptor-level activation?
- question: Can the original supplementary interaction records resolve SKP1, KEAP1, the distinct beta-TrCP
    paralogs and the AMER1-specific high-throughput pairs without equating complex co-purification with
    direct binding?
- question: Which nuclear AMER1 activities are independently established at endogenous expression, and
    how do they relate to its membrane scaffold function?
- question: How does endogenous, sequence-defined full-length AMER1 coordinate its KEAP1/NRF2 competition
    with its distinct beta-TrCP/beta-catenin regulatory complexes?
