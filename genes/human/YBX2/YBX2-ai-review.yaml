suggested_questions:
- question: Which human germ-cell mRNAs are direct YBX2 targets, and does human YBX2 repress, store
    or stabilize those mRNAs in the same way as rodent Msy2?
suggested_experiments:
- description: Perform CLIP-seq in human germ-cell models to identify YBX2-bound transcripts and
    test whether YBX2 depletion changes their stability or translation.
