taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'YBX2 is a germ-cell-enriched cold-shock-domain Y-box protein homologous to mammalian MSY2/Contrin
  proteins. It is predicted to bind DNA and RNA and to shuttle between nucleus and cytoplasm in germ-cell
  messenger ribonucleoprotein particles, where non-human homologues store or translationally delay maternal
  and paternal mRNAs.'
