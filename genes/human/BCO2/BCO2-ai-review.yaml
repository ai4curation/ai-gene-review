id: Q9BYV7
gene_symbol: BCO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BCO2 is the mitochondrial carotenoid-cleaving dioxygenase that eccentrically cleaves beta-carotene
  and other carotenes or xanthophylls at 9,10 and 9'',10'' double bonds. In contrast to cytosolic BCO1,
  BCO2 has broad asymmetric carotenoid-cleavage activity and prevents mitochondrial carotenoid accumulation
  and the oxidative stress associated with carotenoid overload.'
