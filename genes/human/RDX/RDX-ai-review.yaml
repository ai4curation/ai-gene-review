id: P35241
gene_symbol: RDX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Radixin is a canonical ezrin/radixin/moesin FERM-domain adaptor that links the cytoplasmic face of
  plasma-membrane proteins and phospholipids to cortical F-actin. It acts at apical and protrusive membrane domains,
  including microvilli and the stereocilium base, supports apical retention of cargo proteins such as ABCC2, binds
  integrin beta2 and other membrane partners through its N-terminal FERM domain, and participates with ezrin and
  moesin in HOPS/Vps11-dependent maturation of early endosomes.
