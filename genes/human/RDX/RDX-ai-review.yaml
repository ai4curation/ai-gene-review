proposed_new_terms: []
suggested_questions:
- question: Which rodent radixin-derived Rap, PKA, PDGF, thyroid-hormone, cell-cycle, and postsynaptic receptor
    diffusion annotations are supported by source experiments and should remain on human RDX?
- question: Can the Vps11/HOPS interaction be represented with a specific molecular-function term rather than only
    with endosomal process annotations?
suggested_experiments:
- description: Test endogenous RDX, EZR, and MSN single and combinatorial knockouts with rescue in epithelial and
    endothelial cells to separate radixin-specific functions from redundant canonical ERM-pool effects.
- description: Map endogenous radixin proximity to Vps11/HOPS and ABCC2 in polarized cells and quantify how
    FERM-domain and actin-binding mutants affect apical cargo retention and Rab7 recruitment to EGF-containing
    endosomes.
