taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASPM is a large calmodulin-associated microtubule protein concentrated at mitotic spindle
  poles and microtubule minus ends. It contributes to spindle organization and orientation through
  a conserved mechanism that limits minus-end growth and recruits katanin to microtubules, enhancing
  katanin-mediated severing. Human ASPM also occupies interphase nuclei and late-mitotic midbodies;
  its requirement for spindle-pole focusing varies with compensating factors such as CDK5RAP2. Biallelic
  pathogenic ASPM variants cause autosomal recessive primary microcephaly type 5 (MCPH5).
