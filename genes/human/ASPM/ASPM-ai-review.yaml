core_functions:
- description: ASPM binds microtubule minus ends at mitotic spindle poles, limiting minus-end growth
    and recruiting katanin to enhance microtubule severing in the conserved ASPM-katanin mechanism.
    This activity supports spindle organization and mitotic spindle orientation. Growth inhibition
    and recruitment-dependent enhancement of severing were demonstrated using purified short mouse
    ASPM with calmodulin; human endogenous association, minus-end recruitment and cellular perturbations
    support the conserved mechanism. ASPM supplies growth-blocking and recruitment functions, while
    katanin supplies ATP-dependent severing catalysis.
  molecular_function:
