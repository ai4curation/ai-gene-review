suggested_questions:
- question: Which human ASPM isoforms bind and track microtubule minus ends, and how do their calmodulin
    and katanin interactions differ?
- question: Does rat apical ASPM occupy the plasma-membrane domain or adjacent cytokinetic midbody
    structures?
- question: Which compensating spindle-pole factors determine the consequences of human ASPM loss
    in neural progenitors?
- question: Which direct late-cytokinesis activity, if any, does human ASPM perform beyond organizing
    spindle and midbody microtubules? The observed cytokinesis failures are not fully explained by
    spindle misorientation, but the executing mechanism remains unresolved.
suggested_experiments:
- description: Reconstitute separately purified human ASPM isoforms with defined calmodulin and microtubules
    to measure minus-end binding and growth inhibition, then add katanin separately to quantify recruitment-dependent
    enhancement of severing.
  hypothesis: Human ASPM has conserved minus-end binding and growth-regulatory outputs, but the existing
    purified mouse preparation does not resolve the activities or concentration dependence of individual
    human isoforms.
