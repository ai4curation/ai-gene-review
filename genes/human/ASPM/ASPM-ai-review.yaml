    id: GO:0051011
    label: microtubule minus-end binding
  evidence_type: ISS
  original_reference_id: PMID:28436967
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8CJ27
  review:
    action: NEW
    summary: Infer a conserved minus-end-binding activity from the mouse ortholog and human cellular
      recruitment.
    reason: Purified short mouse ASPM with calmodulin binds and tracks microtubule minus ends, with
      ASPM domain mapping supporting its contribution. The same preparation slows minus-end growth
      and blocks outgrowth at higher concentrations; ASPM recruits katanin and enhances its severing
      activity. These are active outputs of ASPM association, while the ATP-dependent severing chemistry
      belongs to katanin. Endogenous human ASPM is recruited to newly generated minus ends in cells.
      Together these support a conserved molecular-function inference from the established mouse
      ortholog, not a purified human IDA or an isoform-specific human claim.
    supported_by:
    - reference_id: PMID:28436967
      full_text_unavailable: false
