taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASPM is a large calmodulin-associated microtubule protein that concentrates at mitotic
  spindle poles and microtubule minus ends. It contributes to spindle organization and positioning
  and cooperates with katanin in controlling minus-end dynamics. Conserved minus-end binding is supported
  by mouse protein reconstitution and human cellular recruitment. Human ASPM also occupies interphase
  nuclei and late-mitotic midbodies; the dependence of spindle-pole focusing on ASPM varies with
  compensating factors such as CDK5RAP2.
