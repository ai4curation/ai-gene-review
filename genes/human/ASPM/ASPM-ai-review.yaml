core_functions:
- description: ASPM associates with microtubule minus ends at mitotic spindle poles and cooperates
    with calmodulin and katanin to support spindle organization and positioning. The conserved binding
    mechanism is inferred from mouse ASPM-calmodulin reconstitution and corroborated by endogenous
    human localization and perturbation experiments; katanin supplies severing catalysis.
  molecular_function:
