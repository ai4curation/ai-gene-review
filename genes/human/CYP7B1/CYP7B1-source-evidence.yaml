primary_assays:
- pmid: '9802883'
  url: https://www.jci.org/articles/view/2962/version/1/pdf/render.pdf
  locator: Methods p. 1692; Results pp. 1698–1699; selected Discussion p. 1701; Figures 9–12
  evidence: The human 506-aa clone in 293 cells increased 25-hydroxycholesterol/DHEA activity, reported
    as data not shown; control human liver membranes turn over 25-hydroxycholesterol. Figure 12 tests
    mouse WT/R388Stop constructs in 293 cells; CHO confirmation is reported separately as data not shown.
  access: Normal cache is abstract-only; authentic PDF selected text was read by owner and consultant.
    The consultant inspected actual Figures 9–12 pixels; the owner does not claim those pixel reads.
- pmid: '10588945'
  url: https://www.researchgate.net/publication/12712278_Structure_and_functions_of_human_oxysterol_7-hydroxylase_cDNAs_and_gene_CYP7B1
  locator: Expression-vector and 293/T-cell assay Methods; transfection Results; Table 2
  evidence: Full-length and delta-20 human CYP7B1 generate 7-alpha products from 27-hydroxycholesterol
    and DHEA, with a reverse-orientation control. The historical clone His/Arg324 difference is not treated
    as a new official product.
  access: Normal cache abstract-only; selected original indexed text read, not PDF/pixels. OCR prevents
    new exact-unit quantitative claims.
- pmid: '24491228'
  url: https://doi.org/10.1111/febs.12733
  locator: Results substrate specificity/heme; Methods protein expression, reconstituted catalysis and
    LC-MS
  evidence: Human protein without its N-terminal membrane segment was expressed in E. coli and reconstituted
    with rat POR/NADPH. Positive 25/27-oxysterol and C19/C21-steroid chemistry and heme content were measured.
    The panel includes 24S, but only 25/27 spectral responses are reported.
  access: Normal cache is abstract-only; selected publisher original text was read. Table 1 body, supplements
    and pixels were unavailable; no measured-zero 24S activity or exact additional hydroxylation-position
    claim is made. The structural analysis is a homology model, not a target crystal structure.
- pmid: '11067870'
  url: https://www.jci.org/articles/view/10902
  locator: Methods; Results and Figures 4/9; CYP7B1-only versus vector lanes
  evidence: Mouse CYP7B1 directly produces 7-hydroxylated 24/25/27 intermediates in HEK293 hosts, distinct
    from downstream HSD3B7. The 24-hydroxycholesterol tracer stereochemistry is unspecified in the inspected
    Methods.
  access: The owner read original selected text and actual Figure 4/9 pixels. The consultant separately
    reread selected text only. The Figure 9 caption’s 7-beta label is not accepted as a new stereochemical
    result.
- pmid: '10748047'
  url: https://www.researchgate.net/publication/12568407_Expression_Cloning_of_an_Oxysterol_7a-Hydroxylase_Selective_for_24-Hydroxycholesterol
  locator: Cellular enzyme Methods; substrate-specificity Results and Figure 5 caption
  evidence: Mouse CYP7B1 shows positive 24/25/27 turnover, with 25 greater than 27 greater than the other
    substrates including 24. The CYP39A1 comparison does not erase the CYP7B1 assays.
  access: Indexed original text was read; no PDF or pixels. Inspected 24-hydroxycholesterol tracer descriptions
    do not resolve 24S.
- pmid: '22999953'
  url: https://pubmed.ncbi.nlm.nih.gov/22999953/
  locator: Ligand-production Results; activated-B-cell transfer and stromal bone-marrow-chimera experiments;
    corresponding Methods
  evidence: Mouse CYP7B1 performs the EBI2-ligand-producing chemical step and supports B-cell positioning.
    Human 25-hydroxycholesterol hydroxylation independently supports conserved chemistry; direct human
    chemotaxis remains an inference.
  access: Selected full normal-cache text read; no figure-pixel claim.
