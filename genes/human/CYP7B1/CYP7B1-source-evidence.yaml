  '8396': The current name/ancestry say hydroxylase, but the definition gives 7-oxocholesterol reduction
    and RHEA:68740. Retain machine term IDs and refine reviews to GO:0033783 for demonstrated 25/26 P450
    hydroxylation. Direct RHEA:68740 access failed; only the GO cross-reference was independently verified.
  '33783': The complete definition covers 25-hydroxycholesterol and (25R)-26(27)-hydroxycholesterol despite
    its shorter 25 label. The actual is_a closure includes GO:0008387, not GO:0008396.
  '33782': Positive mouse 24-hydroxycholesterol evidence and unresolved stereochemistry do not fully settle
    the exact human 24S claim; two UNDECIDED assertions preserve all positive donor/source context.
  core: One GO:0008387 steroid 7-alpha-hydroxylase unit covers oxysterol and other 3-hydroxy steroids,
    with bile-acid biosynthesis (GO:0006699) and ER membrane location (GO:0005789). EBI2-ligand chemistry
    appears in prose; no redundant parent/child core or NEW process.
