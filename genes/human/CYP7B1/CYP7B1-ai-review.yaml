id: O75881
gene_symbol: CYP7B1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP7B1 is a 506-residue, heme-containing cytochrome P450 associated with the endoplasmic
  reticulum membrane. It uses electrons supplied through NADPH–cytochrome P450 reductase to 7-alpha-hydroxylate
  25- and 26(27)-hydroxycholesterol, supplying intermediates for alternative bile-acid synthesis and oxysterol
  clearance. It also hydroxylates 3-hydroxy steroids including dehydroepiandrosterone and pregnenolone.
  Its product 7-alpha,25-dihydroxycholesterol activates the chemotactic receptor GPR183/EBI2; mouse studies
  establish a stromal ligand-producing role in B-cell positioning. Loss-of-function variants cause spastic
  paraplegia type 5A and, in severe cases, congenital bile-acid synthesis defect type 3 with neonatal
  liver disease.
