core_functions:
- description: CASQ1 binds and sequesters calcium in the skeletal-muscle sarcoplasmic-reticulum terminal cisterna. Calcium-dependent oligomerization and polymerization provide a high-capacity luminal reservoir whose stored calcium is available for RYR1-mediated release during excitation-contraction coupling. Although UniProt and Reactome describe CASQ1-dependent regulation of RYR1 release, this review does not assert a separate calcium-channel regulator activity for CASQ1 because direct RYR1 regulation has not yet been separated from luminal calcium-buffering effects.
  molecular_function:
    id: GO:0140314
    label: calcium ion sequestering activity
  directly_involved_in:
  - id: GO:0014809
    label: regulation of skeletal muscle contraction by regulation of release of sequestered calcium ion
  locations:
  - id: GO:0014804
    label: terminal cisterna lumen
  - id: GO:0033018
    label: sarcoplasmic reticulum lumen
  supported_by:
  - *id001
  - *id003
  - *id002
suggested_questions:
- question: Which rat or zebrafish experiments supporting the PTN000004019 Z-disc IBD place calsequestrin inside the sarcomeric Z disc rather than in adjacent junctional SR terminal cisternae?
- question: Which CASQ1, triadin and junctin stoichiometries define direct RYR1 regulation separately from the calcium-buffering effect of changing free luminal calcium?
- question: Does endogenous skeletal-muscle CASQ1 inhibit STIM1-ORAI signalling in native triad junctions to the same extent measured after CSQ1 overexpression in HEK293 and HeLa cells?
suggested_experiments:
- description: Use endogenous CASQ1 tagging with SR-lumen, junctional-SR-membrane, T-tubule and Z-disc ultrastructural markers to resolve terminal-cisterna localization from nearby sarcomeric or sarcolemmal signals in human myotubes.
- description: Reconstitute human CASQ1 with RYR1, triadin and junctin while holding free luminal calcium constant to distinguish direct release-complex regulation from bulk calcium sequestration.
