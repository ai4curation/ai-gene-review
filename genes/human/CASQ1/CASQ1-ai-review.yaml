id: P31415
gene_symbol: CASQ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Calsequestrin-1 is an acidic calcium-storage protein of the skeletal-muscle sarcoplasmic reticulum. In the terminal cisterna lumen it binds calcium with high capacity, assembles into calcium-dependent oligomers and polymers, and supplies a buffered luminal calcium reservoir for RYR1-mediated release during excitation-contraction coupling. CASQ1 also modulates local store-operated calcium entry through STIM1-dependent signalling.
