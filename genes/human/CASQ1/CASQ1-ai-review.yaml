- term:
    id: GO:0030018
    label: Z disc
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1309469
  - PANTHER:PTN000004019
  - RGD:2276
  - ZFIN:ZDB-GENE-040801-139
  - ZFIN:ZDB-GENE-060929-1070
  review:
    summary: The transferred sarcomere/T-tubule-adjacent location overstates the resolved CASQ1 compartment.
    action: MARK_AS_OVER_ANNOTATED
    reason: CASQ1 stores calcium in the SR terminal cisterna lumen at the triad. The IBD sits at PTN000004019 (46 leaves), the node joining the CASQ1 clade PTN002559189 (22 leaves) and the CASQ2 clade PTN002559177 (24 leaves), and both clades are seeded. Zebrafish casq1a and casq1b (IDA, PMID:26585961) are in the CASQ1 clade, and mouse Casq2 (IDA, PMID:19383796) and rat Casq2 (IDA, PMID:11053140) are in the CASQ2 clade, so the target is inside the seeded clade and the placement is not the problem. The seeds are. All four are located_in rows from immunolabelling at light-microscope resolution, and the zebrafish abstract itself places the signal at the Z-line level because that is where the terminal cisternae lie in fish muscle; the two rodent papers describe calsequestrin in cardiac junctional SR and dyads. They record the position of the terminal cisternae relative to the sarcomere, and PAINT propagates that as is_active_in Z disc. Calsequestrin is a soluble luminal SR protein and is not a Z-disc component, so the row is over-annotated at its seeds. The seed papers were read as abstracts only.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000004019
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The PTN000004019 clade also carries sound terminal-cisterna and
          sarcoplasmic-reticulum-lumen assertions. Its Z-disc term rests on four
          located_in immunolabelling rows (zebrafish casq1a and casq1b, mouse and
          rat Casq2) that report calsequestrin in junctional SR lying at the level
          of the Z line, which is adjacency and not Z-disc residence.
    supported_by:
    - *id003
    - *id006
