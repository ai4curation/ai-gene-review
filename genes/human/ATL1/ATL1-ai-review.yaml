id: Q8WXF7
gene_symbol: ATL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Atlastin-1 is a membrane-anchored dynamin-like GTPase that promotes fusion of endoplasmic
  reticulum membranes. Nucleotide-dependent self-association and conformational changes couple GTP hydrolysis
  to membrane tethering and fusion, helping build and maintain a connected tubular ER network. ATL1 also
  associates with ER-shaping proteins such as reticulons, REEP proteins and spastin. Its function is particularly
  important in neurons, and pathogenic variants cause forms of hereditary spastic paraplegia.
