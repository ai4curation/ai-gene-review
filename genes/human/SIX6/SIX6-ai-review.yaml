suggested_questions:
- question: What is the human SIX6 direct target repertoire in retinal progenitors and optic nerve head cells, and
    does the glaucoma-associated Asn141His variant alter DNA binding or corepressor recruitment?
- question: Does SIX6 ever act as an activator (e.g. at the Shh SBE2 enhancer) in vivo, or is it exclusively a repressor?
suggested_experiments:
- hypothesis: The SIX6 Asn141His glaucoma risk variant reduces repression of p27Kip1/CDKN1B and other targets in
    retinal progenitors.
  description: Compare wild-type and Asn141His SIX6 in human iPSC-derived retinal organoids by CUT&RUN and RNA-seq,
    with p27Kip1 reporter assays and TLE1/DACH1 co-immunoprecipitation.
  experiment_type: genome-wide DNA-binding and transcriptomic profiling
