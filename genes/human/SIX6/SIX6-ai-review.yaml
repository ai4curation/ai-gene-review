gene_symbol: SIX6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIX6 (OPTX2) is a SIX/sine oculis family homeodomain transcription factor of the Six3/6 (Optix) subfamily,
  closely related to SIX3 and encoded in the SIX1-SIX4-SIX6 cluster on chromosome 14q23. It is expressed in the
  developing and adult neural retina, optic stalk/optic nerve region, ventral hypothalamus and pituitary. Through
  its Six domain and homeodomain it binds cis-regulatory DNA (for example the Shh SBE2 forebrain enhancer) and acts
  mainly as a transcriptional repressor, recruiting Groucho/TLE (TLE1, AES/TLE5) and Dachshund corepressors via
  its Six domain. In mouse, Six6-Dach complexes directly repress cyclin-dependent kinase inhibitor genes such as
  p27Kip1, expanding early retinal and pituitary progenitor pools; Six6 loss causes retinal and pituitary hypoplasia,
  and with Six3 it contributes to eye-field specification. In humans, 14q22-q23 deletions encompassing SIX6 are
  associated with bilateral anophthalmia and pituitary anomalies, homozygous truncation causes complex microphthalmia
  with optic disc anomalies and retinal dystrophy, and common coding variants (e.g. Asn141His) at the SIX1/SIX6
  locus are associated with optic nerve cup-to-disc ratio and primary open-angle glaucoma.
