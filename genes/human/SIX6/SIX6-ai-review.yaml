core_functions:
- description: 'Sequence-specific homeodomain transcription factor that acts mainly as a repressor: with Dach and
    Groucho/TLE corepressors it directly represses CDK inhibitor genes such as p27Kip1, driving proliferation of
    retinal (and pituitary) progenitors during eye development.'
