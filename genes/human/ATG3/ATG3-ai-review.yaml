    action: ACCEPT
    reason: 'ATG3 executes a step of autophagosome assembly: it catalyses the conjugation of Atg8-family
      proteins to PE on the expanding phagophore, the lipidation step required for phagophore expansion.
      This is the core process of the gene and is conserved across the ATG3 subfamily from yeast to human.'
    supported_by:
