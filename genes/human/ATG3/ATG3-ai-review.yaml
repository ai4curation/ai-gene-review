suggested_questions:
- question: Should ATG3's transient association with the ATG12~ATG5-ATG16L1 E3 be represented as complex
    membership (GO:0034274), or only through the E2 activity and an E2-E3 binding relationship, given
    that ATG3 binding to E1 and E3 is mutually exclusive?
- question: Does human ATG3 form the ATG12-ATG3 conjugate under physiological conditions, and does it
    influence mitochondrial homeostasis as in mouse cells?
suggested_experiments:
- description: Express a non-conjugatable ATG3 K243R variant in human ATG3-knockout cells and test ATG12-ATG3
    formation, LC3 lipidation, mitochondrial morphology and PDCD6IP-dependent endolysosomal trafficking,
    to establish in human cells the ATG12-ATG3 functions currently inferred from mouse.
