id: Q9NT62
gene_symbol: ATG3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATG3 is the E2-like conjugating enzyme of the Atg8/LC3 ubiquitin-like conjugation system
  of macroautophagy. It receives Atg8-family proteins (MAP1LC3A/B/C, GABARAP, GABARAPL1, GABARAPL2) from
  the E1-like enzyme ATG7 as a thioester on its active-site Cys264 and, together with the E3-like ATG12~ATG5-ATG16L1
  complex, transfers them to the head group of phosphatidylethanolamine in the phagophore membrane (LC3
  lipidation), a step needed for phagophore expansion and autophagosome formation. Binding of ATG3 to
  ATG7 and to ATG12 of the E3 uses overlapping sites in its flexible region, so the enzyme cycles between
  E1 and E3. An N-terminal amphipathic helix senses membrane curvature and lipid-packing defects and,
  with an adjacent conserved region, restricts lipidation to highly curved, anionic membranes; a noncanonical
  LIR in the flexible region contacts LC3. ATG3 is a soluble cytosolic protein. It can also conjugate
  ATG12 to its own Lys243 (shown in mouse cells), and the ATG12-ATG3 conjugate influences mitochondrial
  homeostasis and endolysosomal trafficking rather than starvation-induced autophagy. Caspase-8 cleaves
  ATG3 at a LETD motif during death-receptor signalling.
