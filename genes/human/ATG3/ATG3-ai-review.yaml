- term:
    id: GO:0000407
    label: phagophore assembly site
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000305307
  - SGD:S000005290
  review:
    summary: IBA (PTN000305307, yeast Atg3 donor) placing ATG3 activity at the phagophore assembly site.
    action: ACCEPT
    reason: ATG3 acts where Atg8-family lipidation occurs, at the forming phagophore; in human ATG3 an
      N-terminal curvature-sensing amphipathic helix is proposed to target the enzyme to the highly curved
      phagophore rim. Accepted as an inherited location, though human-specific localization data are limited
      and the term reflects the yeast PAS concept.
    supported_by:
    - reference_id: PMID:33446636
      supporting_text: N-terminal membrane curvature-sensitive amphipathic helix (AH), which presumably
        targets the enzyme to the tip of phagophore
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000305308
  - SGD:S000005290
  review:
    summary: IBA placing ATG3 in autophagy of mitochondrion (PAINT node PANTHER:PTN000305308).
    action: KEEP_AS_NON_CORE
    reason: autophagy of mitochondrion uses the core autophagosome-formation machinery, and ATG3 performs
      the Atg8-lipidation step within it, so participation is genuine rather than merely necessity. These
      selective-autophagy processes are, however, specific uses of the general autophagosome assembly
      function rather than distinct ATG3 functions, and the experimental grounding comes from non-human
      donors (yeast/fly). Kept as non-core.
