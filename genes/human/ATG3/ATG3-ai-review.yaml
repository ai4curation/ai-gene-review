  review:
    summary: IEA transfer from mouse Atg3 (Q9CPX6) of Atg12 transferase activity, reflecting ATG3 autocatalytic
      conjugation of ATG12 to its own Lys243.
    action: KEEP_AS_NON_CORE
    reason: Radoshevich et al. 2010 (mouse cells) showed that ATG12 becomes covalently attached to a single
      lysine of ATG3 in an ATG7-dependent reaction requiring ATG3's own E2 activity, so ATG3 transfers
      ATG12 (onto itself). Mouse and human ATG3 are in the same PANTHER subfamily and UniProt carries
      the statement by similarity; it is not yet shown experimentally for the human protein. The ATG12-ATG3
      conjugate is not required for starvation-induced autophagy, so this is a non-core activity.
    supported_by:
    - reference_id: PMID:20723759
      supporting_text: ATG12-ATG3 complex formation requires ATG7 as the E1 enzyme and ATG3 autocatalytic
        activity as the E2, resulting in the covalent linkage of ATG12 onto a single lysine on ATG3
    - reference_id: file:human/ATG3/ATG3-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: ATG12-conjugation plays a role in regulation of mitochondrial homeostasis and cell
        death, while it is not involved in phosphatidylethanolamine-conjugation to ATG8-like proteins
        and autophagy.
