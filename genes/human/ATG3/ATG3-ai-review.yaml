core_functions:
- description: 'E2-like conjugating enzyme for Atg8-family proteins: accepts LC3/GABARAP from ATG7 as
    a Cys264 thioester and transfers it to phosphatidylethanolamine on the phagophore membrane in concert
    with the ATG12~ATG5-ATG16L1 E3, a step of autophagosome assembly. Established experimentally for the
    human protein.'
