  review:
    summary: SNARE binding (electronic). SNAP-25 binds syntaxin-1 and synaptobrevin-2 when it assembles the
      SNARE complex, so the term is true but general.
    action: MODIFY
    reason: True but less specific than the evidence supports. The best documented SNARE partner is
      syntaxin-1, already annotated on this gene (GO:0017075, IBA and IPI); binding of SNAP-25 to syntaxin-1
      is the step that precedes ternary complex assembly.
