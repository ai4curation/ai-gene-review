- term:
    id: GO:0001504
    label: neurotransmitter uptake
  evidence_type: NAS
  original_reference_id: PMID:8760387
  qualifier: involved_in
  review:
    summary: Neurotransmitter uptake (NAS) from a paper cloning SNAP-25 isoforms from human muscle and fat.
      Uptake is the transport of transmitter into cells, which SNAP-25 does not perform; the paper is about
      vesicle fusion.
    action: REMOVE
    reason: The cited paper concerns fusion of GLUT4-containing vesicles with the plasma membrane in
      insulin-responsive tissues and says nothing about transmitter uptake. SNAP-25 mediates release by
      exocytosis, the opposite direction; no evidence places it in transmitter reuptake.
    supported_by:
    - reference_id: PMID:8760387
      supporting_text: The present study is aimed at understanding the mechanisms of fusion of vesicles
        carrying glucose transporter proteins with the plasma membrane in human insulin-responsive tissues
