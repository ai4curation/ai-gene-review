core_functions:
- description: Plasma-membrane Qbc-SNARE that supplies two helices of the neuronal SNARE complex with
    syntaxin-1 and synaptobrevin-2; zippering of this complex primes synaptic vesicles and fuses them with the
    presynaptic active zone membrane for calcium-triggered neurotransmitter release.
  molecular_function:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  directly_involved_in:
  - id: GO:0016082
    label: synaptic vesicle priming
  - id: GO:0031629
    label: synaptic vesicle fusion to presynaptic active zone membrane
  - id: GO:0016079
    label: synaptic vesicle exocytosis
  locations:
  - id: GO:0042734
    label: presynaptic membrane
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0070044
    label: synaptobrevin 2-SNAP-25-syntaxin-1a complex
  supported_by:
  - reference_id: PMID:11832227
    supporting_text: the neuronal SNARE proteins synaptobrevin/VAMP, syntaxin, and SNAP-25 form a four-helix
      bundle, the SNARE complex, that pulls the synaptic vesicle and plasma membranes together possibly
      causing membrane fusion
  - reference_id: PMID:25381298
    supporting_text: Ca(2+)-triggered exocytosis is initiated when synaptobrevin attached to synaptic vesicles
      (v-SNARE) assembles with SNAP25B and syntaxin anchored in the presynaptic membrane (t-SNAREs)
  - reference_id: PMID:25381298
    supporting_text: Ile67Asn variant in SNAP25B is pathogenic because it inhibits synaptic vesicle exocytosis
- description: Same SNARE activity at the plasma membrane of neuroendocrine cells, where SNAP-25 drives
    calcium-regulated exocytosis of dense-core vesicles and secretory granules.
  molecular_function:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  directly_involved_in:
  - id: GO:0099525
    label: presynaptic dense core vesicle exocytosis
  - id: GO:0017156
    label: calcium-ion regulated exocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:25381298
    supporting_text: a SNARE protein essential for exocytosis of synaptic vesicles from nerve terminals and of
      dense-core vesicles from endocrine cells
suggested_questions:
- question: Do SNAP-25a and SNAP-25b differ in how efficiently they support vesicle priming and fusion in
    mature human neurons, given that the nine exon-5 differences include three residues in the palmitoylated
    cysteine-rich linker?
- question: How much of the reported postsynaptic activity of SNAP-25 (receptor trafficking, spine morphology)
    reflects a direct SNARE function in dendrites rather than indirect effects of altered presynaptic release?
- question: Is SNAP-25 a stable member of a Kv2.1 channel complex in beta cells, or a transient binding
    partner that modulates gating?
suggested_experiments:
- description: Replace endogenous SNAP25 in human iPSC-derived neurons with SNAP-25a-only or SNAP-25b-only
    alleles and measure readily releasable pool size, evoked and spontaneous release, and short-term
    plasticity.
  hypothesis: The exon-5 isoforms differ in priming efficiency because of differences in their palmitoylated
    linker.
- description: Use cell-type-specific deletion of Snap25 in postsynaptic neurons only, with presynaptic
    expression intact, and test AMPA/NMDA receptor surface levels and spine density.
  hypothesis: SNAP-25 has a cell-autonomous postsynaptic role in receptor trafficking.
