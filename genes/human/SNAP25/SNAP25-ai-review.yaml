id: P60880
gene_symbol: SNAP25
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SNAP-25 (synaptosomal-associated protein of 25 kDa) is a neuronal and neuroendocrine Qbc-SNARE. It
  has no transmembrane segment; it is anchored to the cytoplasmic face of the plasma membrane by S-palmitoylation
  of a cysteine cluster (Cys85, Cys88, Cys90, Cys92) in the linker between its two SNARE motifs, a modification
  added by Golgi DHHC palmitoyltransferases such as ZDHHC17. Its two SNARE motifs contribute two of the four helices
  of the neuronal SNARE complex with syntaxin-1 (Qa) and synaptobrevin-2/VAMP2 (R); zippering of this trans complex
  docks and primes synaptic vesicles and drives their calcium-triggered fusion with the presynaptic active zone
  membrane, and the assembled complex is the binding platform for complexin, synaptotagmin-1 and Munc18/Munc13.
  SNAP-25 is likewise required for calcium-regulated dense-core vesicle exocytosis in neuroendocrine cells, including
  insulin secretion from pancreatic beta cells, where it also binds and modulates the Kv2.1 (KCNB1) potassium channel
  and presynaptic P/Q- and N-type calcium channels. Two splice isoforms, SNAP-25a and SNAP-25b, differ in exon 5
  (residues 56-94). SNAP-25 is the substrate cleaved by botulinum neurotoxins A, C and E, which blocks transmitter
  release, and dominant de novo variants that disrupt the SNARE bundle cause a developmental and epileptic encephalopathy.'
