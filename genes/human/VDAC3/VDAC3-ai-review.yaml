id: Q9Y277
gene_symbol: VDAC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VDAC3 is a multi-pass beta-barrel channel of the mitochondrial outer membrane. Like the
  other mammalian voltage-dependent anion channels, it forms a weakly anion-selective, voltage-gated pore
  for small ions and metabolites, but it is less abundant than VDAC1 and VDAC2 in most tissues and has
  distinct regulatory properties conferred in part by its cysteine-rich barrel. VDAC3 is enriched in testis,
  and orthology to mouse Vdac3 links it to male fertility and sperm mitochondrial sheath assembly, although
  its directly demonstrated human molecular function is channel activity.'
