suggested_questions:
- question: Which redox state and post-translational modifications of the six VDAC3 cysteines
    control its channel gating in mitochondria rather than in reconstituted bilayers?
- question: Does human VDAC3 execute a conserved, direct sperm mitochondrial sheath function
    comparable to mouse Vdac3, or is the mouse phenotype mediated by rodent-specific partners?
suggested_experiments:
- description: Reconstitute purified human VDAC3 cysteine mutants representing oxidized and reduced
    states and compare pore stability, voltage gating, and tubulin/alpha-synuclein blockade.
- description: Use isoform-specific VDAC3 knockout and rescue with channel-dead versus
    channel-competent variants in human spermatid models to separate sperm sheath assembly from
    generic mitochondrial transport.
