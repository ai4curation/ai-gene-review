- id: PMID:25533483
  title: Parkinson's disease genes VPS35 and EIF4G1 interact genetically and converge on α-synuclein.
  findings:
  - statement: VPS35 genetically interacts with EIF4G1 and sortilin to maintain endolysosomal
      and synaptic proteostasis.
    supporting_text: Here we report an unexpected genetic interaction between two PD genes,
      VPS35 and EIF4G1. We provide evidence that EIF4G1 upregulation causes defects associated
      with protein misfolding. Expression of a sortilin protein rescues these defects, downstream
      of VPS35, suggesting a potential role for sortilins in PD.
- id: PMID:26172538
  title: Retromer Ensures the Degradation of Autophagic Cargo by Maintaining Lysosome Function
    in Drosophila.
  findings:
  - statement: Loss of retromer function causes accumulation of undigested cargo and autophagic
      structures in enlarged lysosomes.
    supporting_text: Here we show that the late stages of autophagy and endocytosis are impaired
      in Vps26 and Vps35 deficient Drosophila larval fat body cells, but formation of autophagosomes
      and endosomes is not compromised.
- id: PMID:26220253
  title: 'Retromer: Structure, function, and roles in mammalian disease.'
  findings:
  - statement: Retromer mediates retrograde transport of transmembrane cargo from endosomes
      to the Golgi.
    supporting_text: Retrograde transport from the endosome to the Golgi is mediated by a
      5 protein complex known as the retromer.
- id: PMID:26496610
  title: A human interactome in three quantitative dimensions organized by stoichiometries
    and abundances.
  findings: []
- id: PMID:26618722
  title: Parkinson's disease-associated mutant VPS35 causes mitochondrial dysfunction by recycling
    DLP1 complexes.
  findings:
  - statement: VPS35 interacts with DLP1/DRP1 to mediate mitochondria-derived vesicle transport
      to lysosomes and regulate mitochondrial fission.
    supporting_text: VPS35 mutants showed increased interaction with dynamin-like protein
      (DLP) 1, which enhanced turnover of the mitochondrial DLP1 complexes via the mitochondria-derived
      vesicle-dependent trafficking of the complexes to lysosomes for degradation.
  - statement: Perturbation of VPS35 in primary cortical neurons causes loss of dendritic
      spines and PSD95-positive postsynaptic boutons.
    supporting_text: Loss of dendritic spines and PSD95-positive boutons was apparent in primary
      neurons expressing WT or mutant VPS35 (Fig. 3e-g).
- id: PMID:27385586
  title: Parkinson Disease-linked Vps35 R524W Mutation Impairs the Endosomal Association of
    Retromer and Induces α-Synuclein Aggregation.
  findings:
  - statement: Retromer is a heterotrimeric complex that associates with endosomal membranes
      and facilitates retrograde receptor sorting, and the Parkinson disease-associated VPS35
      R524W variant impairs endosomal retromer association.
    supporting_text: Retromer is a heterotrimeric complex that associates with endosomal membranes
      and facilitates the retrograde sorting of multiple receptors, including the cation-independent
      mannose 6-phosphate receptor for lysosomal enzymes.
  - statement: Expression of the Parkinson disease-associated VPS35 R524W loss-of-function
      variant causes accumulation of intracellular alpha-synuclein aggregates.
    supporting_text: Expression of Vps35 R524W-containing retromer results in the accumulation
      of intracellular α-synuclein-positive aggregates, a hallmark of Parkinson disease.
- id: PMID:27460146
  title: VPS35 regulates cell surface recycling and signaling of dopamine receptor D1.
  findings:
  - statement: VPS35 binds the dopamine D1 receptor and promotes its endosomal recycling and
      signaling.
    supporting_text: These results demonstrate that VPS35 regulates DRD1 trafficking and DRD1-mediated
      dopamine signaling pathway, and that the PD-associated VPS35 (D620N) mutant loses such
      functions, providing a novel molecular mechanism underlying PD pathogenesis.
