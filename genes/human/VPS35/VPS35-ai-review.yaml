suggested_questions:
- question: How does the Parkinson's disease-associated VPS35 D620N substitution at the C-terminal
    solenoid arch interface alter the balance between WASH-dependent endosome-to-plasma-membrane
    recycling and SNX3-retromer-mediated endosome-to-TGN retrieval in human dopaminergic neurons?
