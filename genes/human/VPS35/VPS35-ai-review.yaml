- term:
    id: GO:0007040
    label: lysosome organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EQH3
  - ensembl:ENSMUSP00000034131
  review:
    summary: Downstream requirement of VPS35-mediated CI-MPR retrieval for normal lysosome
      morphology and hydrolase content retained as non-core.
    action: KEEP_AS_NON_CORE
    reason: Depletion or mutation of VPS35 causes lysosomal turnover of CI-MPR, reduced lysosomal
      hydrolases such as cathepsin D, and lysosomal swelling (Arighi et al., PMID:15078903;
      Follett et al., PMID:24152121); because lysosome organization is a downstream consequence
      of endosome-to-TGN hydrolase receptor retrieval, it is retained as non-core.
    supported_by:
    - &id027
      reference_id: PMID:15078903
      supporting_text: Depletion of retromer by RNA interference increases the lysosomal turnover
        of the CI-MPR, decreases cellular levels of lysosomal hydrolases, and causes swelling
        of lysosomes.
    - &id019
      reference_id: PMID:24152121
      supporting_text: While PD-linked point mutant Vps35 D620N interacts with the cation-independent
        mannose-6-phosphate receptor (CI-M6PR), a known retromer cargo, we find that its expression
        disrupts the trafficking of cathepsin D, a CI-M6PR ligand and protease responsible
        for degradation of α-synuclein, a causative agent of PD.
