- id: file:human/VPS35/VPS35-uniprot.txt
  title: UniProtKB record for human VPS35
  findings:
  - statement: VPS35 is the central alpha-helical solenoid scaffold of the retromer cargo-selective
      complex.
    supporting_text: Acts as a component of the retromer cargo-selective complex (CSC). The
      CSC is believed to be the core functional component of retromer or respective retromer
      complex variants acting to prevent missorting of selected transmembrane cargo proteins
      into the lysosomal degradation pathway.
    record_section:
    - CC:FUNCTION
- id: PMID:27889239
  title: Structural Mechanism for Cargo Recognition by the Retromer Complex.
  findings:
  - statement: X-ray crystal structure of the VPS26-VPS35-SNX3-DMT1-II complex identifies
      the canonical recycling signal binding site at the interface between VPS26 and SNX3
      and cooperative interactions across the retromer subunits.
    supporting_text: Here, we present an X-ray crystallographic analysis of a four-component
      complex comprising the VPS26 and VPS35 subunits of retromer, the sorting nexin SNX3,
      and a recycling signal from the divalent cation transporter DMT1-II. This analysis identifies
      a binding site for canonical recycling signals at the interface between VPS26 and SNX3.
      In addition, the structure highlights a network of cooperative interactions among the
      VPS subunits, SNX3, and cargo that couple signal-recognition to membrane recruitment.
- id: PMID:30224749
  title: Structure of the membrane-assembled retromer coat determined by cryo-electron tomography.
  findings:
  - statement: Cryo-electron tomography of the membrane-assembled retromer coat shows that
      Vps35 homodimers form the legs of arches extending from the membrane-associated sorting
      nexin array with Vps29 at the apex.
    supporting_text: This reveals a membrane-associated Vps5 array, from which arches of retromer
      extend away from the membrane surface. Vps35 forms the 'legs' of these arches, and Vps29
      resides at the apex where it is free to interact with regulatory factors.
core_functions:
- description: Central alpha-helical solenoid scaffold of the heterotrimeric retromer cargo-selective
    complex (VPS35-VPS26-VPS29) that cooperates with VPS26A/B and SNX3 to couple recognition
    of canonical omega-Phi-[L/M] sorting motifs to endosomal membrane recruitment for endosome-to-Golgi
    retrograde transport, forms the homodimeric legs of membrane-assembled retromer arches,
    and couples with SNX27 and the WASH complex for endosome-to-plasma-membrane recycling.
