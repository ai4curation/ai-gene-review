- id: PMID:11102511
  title: 'Human orthologs of yeast vacuolar protein sorting proteins Vps26, 29, and 35: assembly
    into multimeric complexes.'
  findings:
  - statement: Human VPS35, VPS29, and VPS26 assemble into a cytosolic and membrane-associated
      multimeric retromer complex.
    supporting_text: 'We report the cloning and characterization of human orthologs of three
      additional components of the complex: Vps26p, Vps29p, and Vps35p. ... Furthermore, hVps35,
      hVps29, and hVps26 have been found in membrane-associated and cytosolic compartments.'
- id: PMID:15078903
  title: Role of the mammalian retromer in sorting of the cation-independent mannose 6-phosphate
    receptor.
  findings:
  - statement: Human VPS26, VPS29, and VPS35 localize to tubular domains of early endosomes
      where CI-MPR is concentrated prior to transport to the TGN.
    supporting_text: In particular, retromer is associated with tubular-vesicular profiles
      that emanate from early endosomes or from intermediates in the maturation from early
      to late endosomes.
  - statement: RNAi depletion of retromer subunits causes missorting and lysosomal turnover
      of CI-MPR.
    supporting_text: Depletion of retromer by RNA interference increases the lysosomal turnover
      of the CI-MPR, decreases cellular levels of lysosomal hydrolases, and causes swelling
      of lysosomes.
- id: PMID:15247922
  title: The mammalian retromer regulates transcytosis of the polymeric immunoglobulin receptor.
  findings:
  - statement: VPS35 and VPS26 associate with the polymeric immunoglobulin receptor transcytotic
      pathway in polarized epithelial cells.
    supporting_text: Here, we show a function for the mammalian Vps35-Vps29-Vps26 retromer
      subcomplex in promoting pIgR-pIgA transcytosis.
- id: PMID:16732284
  title: The retromer subunit Vps26 has an arrestin fold and binds Vps35 through its C-terminal
    domain.
  findings:
  - statement: VPS26 adopts an arrestin-like two-lobed beta-sandwich fold and binds the N-terminus
      of VPS35.
    supporting_text: The structure of human Vps26A at 2.1-A resolution reveals two curved
      beta-sandwich domains connected by a polar core and a flexible linker. Vps26 has an
      unpredicted structural relationship to arrestins. The Vps35-binding site on Vps26 maps
      to a mobile loop spanning residues 235-246, near the tip of the C-terminal domain.
- id: PMID:17239604
  title: The vacuolar-ATPase inhibitor bafilomycin and mutant VPS35 inhibit canonical Wnt
    signaling.
  findings:
  - statement: Disruption of VPS35 impairs canonical Wnt secretion in mammalian cells.
    supporting_text: We show that an N-terminal deletion mutant of VPS35 reduces canonical
      Wnt signaling in HEK-293 cells expressing exogenous Wnt-1.
- id: PMID:17616579
  title: Cellular cofactors affecting hepatitis C virus infection and replication.
  findings: []
- id: PMID:17891154
  title: Functional architecture of the retromer cargo-recognition complex.
  findings:
  - statement: The C-terminal alpha-helical solenoid of VPS35 wraps around the metallophosphoesterase
      fold of VPS29 to form the rigid scaffold of the retromer cargo-recognition complex.
    supporting_text: Here we report the crystal structure of a VPS29-VPS35 subcomplex showing
      how the metallophosphoesterase-fold subunit VPS29 (refs 14, 15) acts as a scaffold for
      the carboxy-terminal half of VPS35. VPS35 forms a horseshoe-shaped, right-handed, alpha-helical
      solenoid, the concave face of which completely covers the metal-binding site of VPS29,
      whereas the convex face exposes a series of hydrophobic interhelical grooves.
- id: PMID:17897319
  title: Integral and associated lysosomal membrane proteins.
  findings:
  - statement: Subcellular fractionation and mass spectrometry detect retromer components
      associated with endolysosomal membranes.
    supporting_text: In membranes purified from placental lysosomes, we identified 58 proteins,
      known to reside at least partially in the lysosomal membrane. ... We report on additional
      86 proteins that were significantly enriched in the lysosomal membrane fraction.
- id: PMID:18160348
  title: The retromer complex influences Wnt secretion by recycling wntless from endosomes
    to the trans-Golgi network.
  findings:
  - statement: Retromer recycles the Wnt sorting receptor Wntless from early endosomes to
      the trans-Golgi network.
    supporting_text: We propose that retromer influences Wnt secretion by recycling Wntless
      from endosomes to the trans-Golgi network (TGN).
- id: PMID:18193037
  title: Wingless secretion requires endosome-to-Golgi retrieval of Wntless/Evi/Sprinter by
    the retromer complex.
  findings:
  - statement: Loss of retromer causes lysosomal degradation of Wntless and impairs Wnt secretion.
    supporting_text: Following dissociation from Wingless, Wntless is internalized and returns
      to the Golgi apparatus in a retromer-dependent manner. Without the retromer-dependent
      recycling route, Wingless secretion is impaired and, as electron microscopy suggests,
      Wntless is diverted to a degradative compartment.
- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  findings:
  - statement: Proteomic profiling identifies endosomal trafficking proteins in urinary extracellular
      exosomes.
    supporting_text: Normal human urine contains large numbers of exosomes, which are 40-
      to 100-nm vesicles that originate as the internal vesicles in multivesicular bodies
      from every renal epithelial cell type facing the urinary space. Here, we used LC-MS/MS
      to profile the proteome of human urinary exosomes.
- id: PMID:19553991
  title: GOLPH3 modulates mTOR signalling and rapamycin sensitivity in cancer.
  findings: []
- id: PMID:19619496
  title: The retromer coat complex coordinates endosomal sorting and dynein-mediated transport,
    with carrier recognition by the trans-Golgi network.
  findings: []
- id: PMID:20164305
  title: Retromer-mediated direct sorting is required for proper endosomal recycling of the
    mammalian iron transporter DMT1.
  findings:
  - statement: Depletion of VPS35 or VPS26 blocks retrograde recycling of DMT1-II and misroutes
      it to late endosomes/lysosomes.
    supporting_text: Depletion of the retromer by siRNA against Vps35 leads to mis-sorting
      of DMT1-II to LAMP2-positive structures, and expression of siRNA-resistant Vps35 can
      rescue this effect. These findings demonstrate that the retromer recognizes the recycling
      signal of DMT1-II and ensures its proper endosomal recycling.
- id: PMID:20923837
  title: The cargo-selective retromer complex is a recruiting hub for protein complexes that
    regulate endosomal tubule dynamics.
  findings: []
- id: PMID:21602791
  title: SNX27 mediates retromer tubule entry and endosome-to-plasma membrane trafficking
    of signalling receptors.
  findings:
  - statement: SNX27 serves as an essential adaptor protein linking beta2-adrenergic receptors
      to Rab4-positive retromer tubules for endosome-to-plasma-membrane recycling.
    supporting_text: Here we show that sequence-directed sorting occurs at the level of entry
      into retromer tubules and that retromer tubules are associated with Rab4. Furthermore,
      we show that sorting nexin 27 (SNX27) serves as an essential adaptor protein linking
      β2ARs to the retromer tubule.
