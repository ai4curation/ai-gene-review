id: Q96QK1
gene_symbol: VPS35
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Vacuolar protein sorting-associated protein 35 (VPS35) is the central alpha-helical
  solenoid scaffold of the heterotrimeric retromer cargo-selective complex (VPS35-VPS26-VPS29)
  on endosomal membranes. Its N-terminal region binds the arrestin-like subunit VPS26A or
  VPS26B and cooperates with SNX3 to couple recognition of canonical omega-Phi-[L/M] sorting
  motifs in transmembrane cargoes to endosomal membrane recruitment, while its C-terminal
  sickle-shaped solenoid wraps around VPS29, forms the antiparallel homodimeric legs of membrane-assembled
  retromer arches, and recruits the WASH complex (via FAM21) to coordinate endosome-to-trans-Golgi
  network retrograde retrieval and SNX27-dependent endosome-to-plasma-membrane recycling.
