  review:
    summary: Cytoplasm localization is true but too general; refine to cytosol and endosome
      membrane.
    action: MODIFY
    reason: VPS35 cycles between a soluble cytosolic pool and the cytoplasmic face of endosomal
      membranes as part of the retromer complex; refine GO:0005737 (cytoplasm) to GO:0005829
      (cytosol) and GO:0010008 (endosome membrane).
