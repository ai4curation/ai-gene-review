- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IDA
  original_reference_id: PMID:27385586
  qualifier: located_in
  review:
    summary: VPS35 is recruited to the cytoplasmic face of the endosome membrane.
    action: ACCEPT
    reason: Structural and cell biological studies show that the VPS35-VPS26-VPS29 heterotrimer
      assembles on the cytoplasmic surface of the endosome membrane via sorting nexin
      complexes (SNX3 and Vps5/SNX-BAR arrays).
    supported_by:
    - *id005
    - &id008
      reference_id: PMID:30072228
      supporting_text: Retromer, an ancient multi-protein complex, is essential for the retrieval
        and recycling of hundreds of transmembrane proteins.
    - &id009
      reference_id: PMID:27889239
      supporting_text: Here, we present an X-ray crystallographic analysis of a four-component
        complex comprising the VPS26 and VPS35 subunits of retromer, the sorting nexin SNX3,
        and a recycling signal from the divalent cation transporter DMT1-II. This analysis
        identifies a binding site for canonical recycling signals at the interface between
        VPS26 and SNX3. In addition, the structure highlights a network of cooperative interactions
        among the VPS subunits, SNX3, and cargo that couple signal-recognition to membrane
        recruitment.
    - &id010
      reference_id: PMID:30224749
      supporting_text: This reveals a membrane-associated Vps5 array, from which arches of
        retromer extend away from the membrane surface. Vps35 forms the 'legs' of these arches,
        and Vps29 resides at the apex where it is free to interact with regulatory factors.
