  review:
    summary: VPS35 contributes to cargo adaptor activity as the central scaffold of the retromer
      cargo-selective complex.
    action: ACCEPT
    reason: VPS35 is the central alpha-helical solenoid subunit of the retromer cargo-selective
      complex; its N-terminal region binds VPS26A/B and cooperates with SNX3 to couple recognition
      of canonical omega-Phi-[L/M] sorting motifs in transmembrane cargoes to endosomal membrane
      recruitment (Lucas et al., PMID:27889239), while its C-terminal solenoid wraps around
      VPS29 (Hierro et al., PMID:17891154) and forms the legs of membrane-assembled retromer
      arches (Kovtun et al., PMID:30224749).
    supported_by:
    - *id009
    - &id028
      reference_id: PMID:17891154
      supporting_text: Here we report the crystal structure of a VPS29-VPS35 subcomplex showing
        how the metallophosphoesterase-fold subunit VPS29 (refs 14, 15) acts as a scaffold
        for the carboxy-terminal half of VPS35. VPS35 forms a horseshoe-shaped, right-handed,
        alpha-helical solenoid, the concave face of which completely covers the metal-binding
        site of VPS29, whereas the convex face exposes a series of hydrophobic interhelical
        grooves.
    - *id010
    - &id029
      reference_id: PMID:27385586
      supporting_text: Retromer is a heterotrimeric complex that associates with endosomal
        membranes and facilitates the retrograde sorting of multiple receptors, including
        the cation-independent mannose 6-phosphate receptor for lysosomal enzymes.
