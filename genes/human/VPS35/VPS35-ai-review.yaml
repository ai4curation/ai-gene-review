- id: PMID:23563491
  title: A global analysis of SNX27-retromer assembly and cargo specificity reveals a function
    in glucose and metal ion transport.
  findings:
  - statement: SNX27-retromer mediates direct endosome-to-plasma-membrane recycling of transmembrane
      cargoes and prevents their late endosome-to-lysosome degradation.
    supporting_text: Furthermore, we establish that direct interaction of the SNX27 PDZ domain
      with the retromer subunit VPS26 is necessary and sufficient to prevent lysosomal entry
      of SNX27 cargo.
- id: PMID:24115276
  title: The regulation and deregulation of Wnt signaling by PARK genes in health and disease.
  findings:
  - statement: VPS35 is the central subunit of the retromer complex that sorts membrane proteins
      from endosomes to the TGN.
    supporting_text: VPS35 is well described as a key component of the retromer complex, important
      for the sorting and retrograde transport of membrane-localized proteins from endosomes
      to the trans-Golgi network
- id: PMID:24152121
  title: The Vps35 D620N mutation linked to Parkinson's disease disrupts the cargo sorting
    function of retromer.
  findings:
  - statement: Expression of the Parkinson disease-linked VPS35 D620N variant redistributes
      retromer-positive endosomes to an enlarged perinuclear compartment.
    supporting_text: We show that expression of the PD-linked Vps35 D620N mutant redistributes
      retromer-positive endosomes to a perinuclear subcellular localization and that these
      endosomes are enlarged in both model cell lines and fibroblasts isolated from a PD patient.
  - statement: Disruption of VPS35 retromer sorting impairs CI-MPR-dependent trafficking of
      the lysosomal protease cathepsin D required for alpha-synuclein degradation.
    supporting_text: While PD-linked point mutant Vps35 D620N interacts with the cation-independent
      mannose-6-phosphate receptor (CI-M6PR), a known retromer cargo, we find that its expression
      disrupts the trafficking of cathepsin D, a CI-M6PR ligand and protease responsible for
      degradation of α-synuclein, a causative agent of PD.
