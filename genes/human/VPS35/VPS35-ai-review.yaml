      supporting_text: 'We report the cloning and characterization of human orthologs of three
        additional components of the complex: Vps26p, Vps29p, and Vps35p. ... Furthermore,
        hVps35, hVps29, and hVps26 have been found in membrane-associated and cytosolic compartments.'
    - &id001
      reference_id: PMID:15078903
      supporting_text: In particular, retromer is associated with tubular-vesicular profiles
        that emanate from early endosomes or from intermediates in the maturation from early
