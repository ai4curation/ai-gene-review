- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: PMID:26618722
  qualifier: colocalizes_with
  review:
    summary: Secondary localization of VPS35 to mitochondria during DLP1 complex turnover
      and MDV budding.
    action: KEEP_AS_NON_CORE
    reason: Wang et al. (PMID:26618722) demonstrated by subcellular fractionation and confocal
      3D reconstruction that a pool of endogenous VPS35 localizes to mitochondria and interacts
      with DLP1 to mediate mitochondria-derived vesicle (MDV) transport; retained as non-core
      relative to VPS35's primary endosomal retromer localization.
    supported_by:
    - &id013
      reference_id: PMID:26618722
      supporting_text: VPS35 mutants showed increased interaction with dynamin-like protein
        (DLP) 1, which enhanced turnover of the mitochondrial DLP1 complexes via the mitochondria-derived
        vesicle-dependent trafficking of the complexes to lysosomes for degradation.
- term:
    id: GO:0005765
    label: lysosomal membrane
  evidence_type: HDA
  original_reference_id: PMID:17897319
  qualifier: located_in
  review:
    summary: High-throughput proteomic detection of VPS35 on purified placental lysosomal
      membranes retained as non-core.
    action: KEEP_AS_NON_CORE
    reason: Schroder et al. (PMID:17897319) detected VPS35 in membranes purified from human
      placental lysosomes; because retromer acts primarily on early and maturing endosomes
      to prevent cargo delivery to lysosomes, this late endolysosomal membrane pool is retained
      as non-core.
    supported_by:
    - reference_id: PMID:17897319
      supporting_text: In membranes purified from placental lysosomes, we identified 58 proteins,
        known to reside at least partially in the lysosomal membrane. ... We report on additional
        86 proteins that were significantly enriched in the lysosomal membrane fraction.
