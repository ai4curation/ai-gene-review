id: Q8IWT6
gene_symbol: LRRC8A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LRRC8A (SWELL1) is the obligatory, pore-forming subunit of the volume-regulated anion channel
  (VRAC, also called VSOAC or I(Cl,swell)), the channel that lets vertebrate cells shed chloride and organic
  osmolytes and so recover their volume after swelling. It is a four-pass membrane protein with a large
  cytosolic leucine-rich-repeat domain and assembles into hexamers built as a trimer of dimers, with a
  symmetry mismatch between the transmembrane pore domain and the LRR domains. LRRC8A cannot support channel
  activity by itself in cells: it must heteromerise with one or more of LRRC8B-E, and the subunit combination
  determines inactivation kinetics, single-channel conductance and substrate preference, although purified
  homohexameric LRRC8A does conduct anions in reconstituted membranes. The channel opens on hypotonic
  swelling and on a fall in cytoplasmic ionic strength. Its pore is wide and poorly selective, so beyond
  chloride and iodide it passes taurine, myo-inositol, glutamate, aspartate, GABA and D-serine, the drug
  cisplatin, and the innate immune second messenger 2''3''-cGAMP. cGAMP permeation is promoted by LRRC8C
  and LRRC8E subunits and suppressed by LRRC8D; how much of cGAMP traffic in vivo runs through VRAC is
  disputed, being dominant in some tumour cell lines and negligible in others, and dispensable for antitumour
  immunity in at least one mouse model. Besides the plasma membrane, a subset of LRRC8 channels resides
  on lysosomal membranes, where they generate lysosomal VRAC currents and support formation of the large
  vacuoles that buffer cytosolic water. Loss of LRRC8A has broad physiological consequences: a truncating
  human allele causes congenital agammaglobulinemia by blocking the pro-B to pre-B cell transition, and
  rodent models implicate it in glucose-stimulated insulin secretion, adipocyte and myoblast differentiation
  and spermatogenesis.'
