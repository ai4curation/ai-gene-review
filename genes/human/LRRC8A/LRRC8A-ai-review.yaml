suggested_questions:
- question: Is VRAC-mediated cGAMP transport required for any cGAMP-dependent physiological process in
    vivo, or only permissive? Thöne et al. 2026 show the MC38 antitumour response proceeds without VRAC
    even though VRAC is the dominant plasma-membrane cGAMP transporter of those cells, while Lrrc8e and
    Lrrc8c mouse models show impaired antiviral interferon responses and altered T cell function. What
    distinguishes the settings where VRAC is dispensable from those where it is not?
- question: Should GO:0140360 be asserted on LRRC8A with enables, or with contributes_to? cGAMP permeation
    requires LRRC8C or LRRC8E and is suppressed by LRRC8D, so it is a property of particular heteromers
    rather than of LRRC8A alone.
- question: How should an obligatory pore-forming subunit that produces no current alone in cells but
    conducts as a homohexamer in reconstituted bilayers be represented - enables, contributes_to, or both
    under different conditions?
- question: Is the IBA is_active_in GO:0005737 cytoplasm annotation intended to capture the intracellular
    (lysosomal) VRAC pool? If so, GO:0005765 would state it far more usefully.
- question: Which of the rodent-derived organismal phenotypes (spermatogenesis, myoblast differentiation,
    glucose homeostasis) hold in human cells, and are any of them separable from the channel activity?
suggested_experiments:
- description: Compare cGAMP flux and STING activation across a panel of primary human cell types in which
    LRRC8A is knocked out at endogenous expression, alongside quantification of LRRC8C, LRRC8D and LRRC8E
    transcript levels, to test whether the LRRC8C/E-to-LRRC8D ratio predicts how much of the flux is VRAC-dependent.
- description: Repeat the syngeneic tumour experiments of Thöne et al. with a tumour line that, unlike
    B16-F10, depends on VRAC for cGAMP uptake, and under conditions that raise extracellular cGAMP (irradiation,
    DNA virus infection), to test the authors' own proposal that VRAC matters only when extracellular
    cGAMP is high.
- description: Engineer a pore mutant of LRRC8A that selectively abolishes cGAMP permeation while sparing
    chloride conduction and regulatory volume decrease, and knock it in, to separate the immunological
    role from the osmoregulatory role in vivo.
- description: Determine whether reconstituted homohexameric LRRC8A shows osmolality-gated conduction
    with the same selectivity as native heteromeric VRAC, to settle whether enables or contributes_to
    is the correct qualifier for the molecular function.
- description: Test whether disrupting the SWELL1-PSA interface, rather than inhibiting PSA aminopeptidase
    activity, tunes cGAMP-dependent STING signalling in vivo, as proposed by Zheng et al.
