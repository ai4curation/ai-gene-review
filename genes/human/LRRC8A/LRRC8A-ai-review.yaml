- term:
    id: GO:0140361
    label: cyclic-GMP-AMP transmembrane import across plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Import of extracellular cGAMP across the plasma membrane through LRRC8A-containing VRACs,
      feeding STING activation; real, but not required for every cGAMP-dependent process in vivo.
    action: KEEP_AS_NON_CORE
    reason: 'Contested, and the dispute is about physiological requirement, not about the transport itself.
      Lahey et al. 2020 established VRAC as a widely expressed cGAMP transporter whose activity depends
      on subunit composition - promoted by LRRC8C/LRRC8E and suppressed by LRRC8D (PMID:33171122) - and
      two independent groups reported in vivo loss-of-function phenotypes consistent with it (Lrrc8e-deficient
      mice with impaired interferon responses to HSV-1, PMID:32277911; LRRC8C-dependent cGAMP uptake shaping
      T cell function, PMID:35105987). Thöne et al. 2026 is frequently read as refuting this, but it does
      not: in the same study, Lrrc8a disruption at endogenous expression showed that VRAC is the dominant
      plasma-membrane cGAMP transporter of MC38 cells, while tumour growth and the cGAMP-dependent antitumour
      response were nonetheless unaffected by loss of tumour- or host-expressed VRAC (PMID:41419196).
      A knockout showing that a physiological outcome proceeds without a protein does not show the protein
      cannot transport the substrate; it bounds the in vivo requirement. Consistent with that, the same
      authors accept a pivotal VRAC-dependent role after irradiation, and find B16-F10 cells barely use
      VRAC for cGAMP, i.e. the contribution is cell-type and context dependent. A 2025 study independently
      treats VRAC-mediated cGAMP transport as real and tunable, identifying PSA/NPEPPS as an inhibitory
      auxiliary subunit (PMID:41371222). Retained as a genuine molecular capability, but demoted from
      core: it is one permeant among many for a large-pore, broadly selective channel, it is a property
      of particular LRRC8A-containing heteromers rather than of LRRC8A as such, and its in vivo weight
      varies by cell type and stimulus.'
    supported_by: &id007
    - reference_id: PMID:41419196
      supporting_text: We conclude that VRAC is the dominant PM cGAMP transporter of MC38 cells.
    - reference_id: PMID:41419196
      supporting_text: However, tumor growth and the cGAMP-mediated antitumor immune response were independent
        of both tumor- and host-expressed VRAC.
