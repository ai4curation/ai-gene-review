core_functions:
- description: As the obligatory subunit of the hexameric LRRC8 channel, LRRC8A forms the swelling-activated
    anion conduction pathway of the plasma membrane. The channel opens on hypotonic cell swelling or a
    fall in cytoplasmic ionic strength and releases chloride together with organic osmolytes, driving
    regulatory volume decrease. LRRC8A is pore-forming rather than accessory - a charged residue at the
    narrowest constriction of the LRRC8A homohexamer is a pore determinant of the heteromeric channel
    - but in cells it produces no current on its own and must co-assemble with LRRC8B, C, D or E, which
    set kinetics, conductance and substrate preference. Purified LRRC8A homohexamers do conduct anions
    in reconstituted systems. The activity is therefore recorded as a contribution to a complex-level
    function rather than as an activity LRRC8A independently enables. A second pool of the same channels
    operates on lysosomal membranes.
