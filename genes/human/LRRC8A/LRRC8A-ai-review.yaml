  qualifier: is_active_in
  review:
    summary: Phylogenetic assertion that the protein is active in the cytoplasm.
    action: KEEP_AS_NON_CORE
    reason: Defensible but uninformative. LRRC8A is an integral membrane protein whose large leucine-rich-repeat
      domains face the cytosol, and the Lyso-VRAC pool lies on an organelle within the cytoplasm, so the
      assertion is not false; it is simply far less useful than the plasma-membrane and lysosomal-membrane
      annotations this gene already carries. Retained without a corrective action because the PAINT tree
      behind this IBA was not inspected and no propagation-level defect can honestly be asserted.
    supported_by:
