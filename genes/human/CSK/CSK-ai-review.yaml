id: P41240
gene_symbol: CSK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSK (C-terminal Src kinase) is a cytosolic non-receptor protein tyrosine kinase built from
  an SH3 domain, an SH2 domain and a kinase domain, lacking both a membrane-anchoring acylation signal
  and an activation-loop autophosphorylation site. Its main substrates are the C-terminal regulatory tyrosines
  of Src-family kinases (SRC, LCK, FYN, LYN, YES1, HCK); phosphorylation of this tail lets the kinase's
  own SH2 domain bind it intramolecularly, locking the kinase in an inactive conformation. Substrate selection
  relies on a docking interface between the two kinase domains rather than the conventional peptide-binding
  groove. CSK is recruited from the cytosol to membranes and lipid rafts by SH2 binding to tyrosine-phosphorylated
  adaptors and receptors (PAG/Cbp, SCIMP, activated IGF-1R/insulin receptor), and its SH3 domain binds
  the phosphatase PTPN22 (PEP), coordinating Src-family kinase inactivation. Through these activities
  CSK restrains T- and B-cell antigen receptor, Fc receptor and growth-factor signalling. Csk orthologs
  are present in choanoflagellates and other unicellular holozoans, where they phosphorylate the Src C-terminal
  tail; whether that phosphorylation was already strongly inhibitory before animals is disputed, while
  the adaptor-based recruitment and immune-signalling roles are animal-specific contexts.
