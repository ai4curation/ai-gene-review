suggested_questions:
- question: Did Csk phosphorylation inhibit Src before animals? Monosiga ovata and M. brevicollis studies
    (PMID:16873552, PMID:18390552) found weak or no inhibition of choanoflagellate Src, whereas a later
    yeast/in vitro study (PMID:28939764) reported inhibition for Capsaspora and M. brevicollis proteins.
    Which assay conditions explain the difference?
- question: Do unicellular holozoans have any functional equivalent of PAG/Cbp or other phosphotyrosine
    adaptors that recruit Csk to membranes, or is adaptor-based Csk recruitment an animal innovation?
- question: Should the PANTHER IBD of adherens junction organization at PTN002815304, seeded only by an
    expression-pattern (IEP) annotation of rat Csk, be revisited?
- question: Is SH3-mediated CSK homodimerization (PMID:19888460) physiologically relevant for regulating
    PTPN22 recruitment in cells?
suggested_experiments:
- description: Side-by-side kinetic comparison of human, Monosiga and Capsaspora Csk acting on their cognate
    and on human Src, using identical purified proteins and both in vitro and SYF-cell assays, to resolve
    whether tail phosphorylation was inhibitory before animals.
- description: Knockout of Csk in Salpingoeca rosetta or Capsaspora owczarzaki, measuring Src activity
    and colony/aggregate phenotypes, to test whether Csk has a role in premetazoan multicellular stages.
- description: Proximity labelling of CSK in human T cells with and without PAG1/SCIMP to map adaptor-dependent
    CSK localisation and substrates beyond Src-family kinases.
