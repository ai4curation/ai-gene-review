- id: PMID:16873552
  title: Functional development of Src tyrosine kinases during evolution from a unicellular ancestor to
    multicellular animals.
  findings:
  - statement: A functional Csk-Src regulatory system exists in the choanoflagellate Monosiga ovata
    supporting_text: we show that the src gene family and its C-terminal Src kinase (Csk)-mediated regulatory
      system already were established in the unicellular M. ovata
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID and title confirmed via NCBI esummary; full text cached and read.
- id: PMID:18390552
  title: Signaling properties of a non-metazoan Src kinase and the evolutionary history of Src negative
    regulation.
  findings:
  - statement: M. brevicollis Csk phosphorylates the Src tail but does not inhibit choanoflagellate Src
      as in mammals
    supporting_text: We cloned and expressed the M. brevicollis homolog of c-Src C-terminal kinase (MbCsk)
      and showed that it phosphorylates the C terminus of MbSrc1, yet this phosphorylation does not inhibit
      MbSrc to the same degree seen in the mammalian Src/Csk pair
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID and title confirmed via NCBI esummary; full text cached and read.
- id: PMID:28939764
  title: Early emergence of negative regulation of the tyrosine kinase Src by the C-terminal Src kinase.
  findings:
  - statement: Csk-mediated Src inhibition reported for Capsaspora and M. brevicollis proteins (abstract
      only read)
    supporting_text: Our results suggest that negative regulation of Src by Csk is more ancient than previously
      thought and that it might be conserved across all holozoan species
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (esummary title match). Only the abstract was read; its conclusion conflicts
      with PMID:18390552 and PMID:16873552 on whether premetazoan Csk inhibits Src.
