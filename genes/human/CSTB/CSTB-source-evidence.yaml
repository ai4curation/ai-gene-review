- id: GO:0004869
  label: cysteine-type endopeptidase inhibitor activity
  definition: Binds to and stops, prevents or reduces the activity of a cysteine-type endopeptidase.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0004869
- id: GO:0005576
  label: extracellular region
  definition: The space external to the outermost structure of a cell. For cells without external protective
    or external encapsulating structures this refers to space outside of the plasma membrane. This term
    covers the host cell environment outside an intracellular parasite.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0005576
- id: GO:0005634
  label: nucleus
  definition: A membrane-bounded organelle of eukaryotic cells in which chromosomes are housed and replicated.
    In most cells, the nucleus contains all of the cell's chromosomes except the organellar chromosomes,
    and is the site of RNA synthesis and processing. In some species, or in specialized cell types, RNA
    metabolism or DNA replication may be absent.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0005634
- id: GO:0005730
  label: nucleolus
  definition: A small, dense body one or more of which are present in the nucleus of eukaryotic cells.
    It is rich in RNA and protein, is not bounded by a limiting membrane, and is not seen during mitosis.
    Its prime function is the transcription of the nucleolar DNA into 45S ribosomal-precursor RNA, the
    processing of this RNA into 5.8S, 18S, and 28S components of ribosomal RNA, and the association of
    these components with 5S RNA and proteins synthesized outside the nucleolus. This association results
    in the formation of ribonucleoprotein precursors; these pass into the cytoplasm and mature into the
    40S and 60S subunits of the ribosome.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0005730
- id: GO:0005737
  label: cytoplasm
  definition: The contents of a cell excluding the plasma membrane and nucleus, but including other subcellular
    structures.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0005737
- id: GO:0005829
  label: cytosol
  definition: The part of the cytoplasm that does not contain organelles but which does contain other
    particulate matter, such as protein complexes.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0005829
- id: GO:0031012
  label: extracellular matrix
  definition: A structure lying external to one or more cells, which provides structural support, biochemical
    or biomechanical cues for cells or tissues.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0031012
- id: GO:0034774
  label: secretory granule lumen
  definition: The volume enclosed by the membrane of a secretory granule.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0034774
- id: GO:0045861
  label: negative regulation of proteolysis
  definition: Any process that stops, prevents, or reduces the frequency, rate or extent of the hydrolysis
    of a peptide bond or bonds within a protein.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0045861
- id: GO:0070062
  label: extracellular exosome
  definition: A vesicle that is released into the extracellular region by fusion of the limiting endosomal
    membrane of a multivesicular body with the plasma membrane. Extracellular exosomes, also simply called
    exosomes, have a diameter of about 40-100 nm.
  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0070062
- id: GO:1904724
  label: tertiary granule lumen
  definition: Any membrane-enclosed lumen that is part of a tertiary granule.
