    summation:
    - dbId: 6806087
      displayName: Tertiary (gelatinase) granules are part of a continuum of pe...
      text: Tertiary (gelatinase) granules are part of a continuum of peroxidase-negative granules formed
        in myelocytes, metamyelocytes, band cells and segmented neutrophils. They differ from secondary
        granules by having a low content of antimicrobial substances, and are more readily exocytosed
        (Sengelov et al. 1995). Tertiary granules are primarily a reservoir of extracellular matrix degrading
