  obsolete: false
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:1904813
- id: GO:0010466
  label: negative regulation of peptidase activity
  definition: Any process that stops or reduces the rate of peptidase activity, the hydrolysis of peptide
    bonds within proteins.
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0010466
- id: GO:0010951
