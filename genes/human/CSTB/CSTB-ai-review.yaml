id: P04080
gene_symbol: CSTB
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Cystatin-B (stefin B) is a small intracellular inhibitor of papain-like
  cysteine proteases. It binds and inhibits cathepsins with enzyme-dependent affinities,
  limiting peptidase activity in the cytosol and nucleus. Its subcellular distribution
  changes with cellular differentiation, and nuclear CSTB can restrain cathepsin L-mediated
  protein processing. CSTB is also detected in extracellular fluids, vesicle preparations
  and extracellular matrix-enriched fractions, without an established constitutive
  secretion mechanism. A human-cell RNA capture screen identifies an additional mRNA-binding
  context whose physiological consequences remain unresolved. Loss of CSTB function
  causes Unverricht-Lundborg progressive myoclonus epilepsy.
