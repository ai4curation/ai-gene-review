core_functions:
- description: CSTB binds and inhibits papain-like cysteine proteases, restraining
    intracellular peptidase activity in the cytosol and nucleus. The measured spectrum
    includes endopeptidases and cathepsin H/dipeptidyl-peptidase activity, with enzyme-
    and redox-dependent affinities. Nuclear experiments support restraint of cathepsin
    L-mediated protein processing, without assigning equal physiological control of
    every enzyme tested in vitro.
  molecular_function:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0010466
    label: negative regulation of peptidase activity
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11514663
    supporting_text: 'binding tightly to

      papain and cathepsin L'
  - reference_id: PMID:20075068
    supporting_text: localized in the nucleus and the cytosol.
suggested_questions:
- question: Which native cytosolic and nuclear protease pools are inhibited by CSTB
    under physiological redox conditions, and how does compartmental access shape
    the affinities measured with purified enzymes?
- question: What transcripts bind CSTB in the HeLa mRNA-interactome context, and does
    that interaction change RNA fate independently of protease inhibition?
- question: Which routes account for CSTB in extracellular fluid, granule and vesicle
    preparations, and what fraction is vesicle-internal rather than co-isolated?
suggested_experiments:
- description: Combine endogenous CSTB perturbation with compartment-resolved protease
    activity probes and matched rescue by wild-type versus inhibition-impaired CSTB.
    Measure protease access and redox state alongside substrate cleavage, avoiding
    forced localization as the sole evidence of the physiological mechanism.
status: DRAFT
