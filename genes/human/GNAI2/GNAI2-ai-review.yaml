- term:
    id: GO:0001973
    label: G protein-coupled adenosine receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002566494
  - RGD:620243
  review:
    summary: Adenosine A1 receptor (ADORA1) couples to Gi2; UniProt lists ADORA1 as an interacting GPCR with structural evidence, and the IBA reflects PAINT placement of this pathway on Gi alpha ancestors.
    action: ACCEPT
    reason: Gαi2 directly transduces A1 adenosine receptor signals (A1R is a canonical Gi-coupled receptor and a cryo-EM ADORA1–Gi2 complex underlies the UniProt interaction statement). The somatic Gαi2 F200L mutation blocks adenosine suppression of cAMP in human ventricular myocardium (PMID:9637720). This is a specific, well-supported instance of the core Gi-coupled signaling role.
    supported_by:
    - reference_id: PMID:9637720
      supporting_text: This mutation was shown to increase intracellular cAMP concentration and inhibit suppression of cAMP by adenosine.
    - reference_id: file:human/GNAI2/GNAI2-uniprot.txt
      supporting_text: The alpha chain contains the guanine nucleotide binding site and alternates between an active, GTP-bound state and an inactive, GDP-bound state
