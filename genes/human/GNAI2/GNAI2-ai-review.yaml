- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:12359238
  qualifier: enables
  review:
    summary: Gαi2 has an intrinsic, slow GTPase activity that hydrolyses bound GTP to GDP and terminates signaling; this activity is accelerated by RGS proteins and effector GAPs.
    action: ACCEPT
    reason: GTP hydrolysis is the timing mechanism of the Gα switch and is a core catalytic activity of Gαi2 (UniProt catalytic activity cites PMID:12359238). Reactome also models RGS- and adenylyl cyclase-accelerated GTP hydrolysis by Gαi.
    supported_by:
    - reference_id: PMID:12359238
      supporting_text: The transduction of signal depends on the ability of the alpha subunit to cycle between a GDP bound and an active GTP bound state capable of interacting with intracellular enzymes.
    - reference_id: file:human/GNAI2/GNAI2-uniprot.txt
      supporting_text: The alpha subunit has a low GTPase activity that converts bound GTP to GDP, thereby terminating the signal.
