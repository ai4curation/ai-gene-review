- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P08752
  - ensembl:ENSMUSP00000057543
  review:
    summary: Gαi2 knockdown/knockout in endothelial cells reduces proliferation, migration and tube formation and endothelial Gαi2 knockdown inhibits retinal angiogenesis in mice (PMID:38505600); the IEA row is the Ensembl projection of the mouse IMP from the same study.
    action: KEEP_AS_NON_CORE
    reason: Evidence for a requirement of Gαi2 in endothelial angiogenic responses is direct (loss- and gain-of-function, in vivo AAV knockdown). The protein acts as the Gi transducer upstream of NFAT activation in endothelial cells; angiogenesis is a tissue-level outcome of that signaling and is retained as a non-core process.
    supported_by:
    - reference_id: PMID:38505600
      supporting_text: In various endothelial cell types, shRNA-induced silencing and CRISPR/Cas9-mediated knockout (KO) of Gαi2 resulted in substantial reductions in cell proliferation, migration, invasion, and capillary tube formation.
    - reference_id: PMID:38505600
      supporting_text: Importantly, in vivo experiments revealed that endothelial Gαi2 knockdown inhibited retinal angiogenesis in mice
