  review:
    summary: Purified, activated Gαi2 directly inhibits membrane adenylyl cyclases, most potently types V and VI (PMID:8119955; PMID:8327893).
    action: NEW
    reason: 'Gαi2-GTP is itself the effector-regulating entity: it binds adenylyl cyclase at an inhibitory site distinct from the Gsα site and reduces catalytic activity. Comparator check: human GNAI1 carries GO:0010855 by IDA from the same paper, which reports Gi alpha 1, 2 and 3 alike, and mouse Gnaz carries it by IMP; GNAI2 lacks it. This MF captures the effector activity that underlies the accepted adenylate cyclase-inhibiting GPCR signaling pathway and negative regulation of adenylate cyclase activity annotations.'
