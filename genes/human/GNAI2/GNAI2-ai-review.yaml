- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:12359238
  qualifier: enables
  review:
    summary: GNAI2 is a guanine-nucleotide-binding G alpha subunit that switches between GDP- and GTP-bound
      states and hydrolyzes bound GTP.
    action: ACCEPT
    reason: Receptor/effector biochemistry and nucleotide-state experiments support the intrinsic molecular
      switch. This is distinct from the GAP activity of RGS proteins; activated or nucleotide-defective
      mutants are controls, not substitutes for the wild-type function.
    additional_reference_ids:
    - PMID:8119955
    - PMID:9637720
    supported_by:
    - reference_id: file:human/GNAI2/GNAI2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'The alpha subunit has a low GTPase activity that converts bound GTP to GDP, thereby terminating the signal.'
    - reference_id: PMID:9637720
