  review:
    summary: Gαi-YFP fusions including Gαi2 localise predominantly at the plasma membrane in live cells (PMID:17635935).
    action: ACCEPT
    reason: Gαi2 is N-myristoylated and palmitoylated and functions at the cytoplasmic face of the plasma membrane, where it couples GPCRs to effectors such as adenylyl cyclase. Myristoylation is required for function (PMID:7961880).
