suggested_questions:
- question: Should Gαi2's well-documented role as the principal Gi alpha transducing chemokine receptor signals in B cells, T cells and neutrophils be captured as participation in chemokine-mediated signaling pathway (GO:0070098), given that Gα subunits are rarely annotated to receptor-ligand-specific pathways other than GPCR-class terms?
- question: Is the reported Gαi2 dependence of insulin action (PMID:8587610) a direct crosstalk (e.g. via protein-tyrosine phosphatase regulation) that warrants a regulation-of-insulin-receptor-signaling annotation, or an indirect metabolic consequence of altered cAMP tone?
- question: Which Gαi2 functions are non-redundant with Gαi1/Gαi3 in human cells, given that centrosomal/cytokinesis phenotypes were only observed after combined Gαi1-3 knockdown?
suggested_experiments:
- description: Reconstitute purified human Gαi1, Gαi2 and Gαi3 (GTPγS-loaded, myristoylated) with each membrane adenylyl cyclase isoform (ADCY1-9) and measure IC50 for inhibition of forskolin- and Gsα-stimulated activity.
  hypothesis: Human Gαi2 directly inhibits ADCY5/6 with potency comparable to Gαi1/3, and isoform differences in AC inhibition explain part of the non-redundant physiology of Gαi2.
  experiment_type: biochemistry
- description: Generate isogenic human GNAI2-knockout iPSC-derived endothelial cells and neutrophils; rescue with WT, GTPase-deficient (Q205L), RGS-insensitive (G184S) and myristoylation-defective (G2A) Gαi2, then quantify cAMP suppression, chemokine-induced calcium flux, arrest under flow and NFAT activation.
  hypothesis: Gαi2 GTPase cycling and membrane anchoring are required for its chemokine-driven adhesion and endothelial NFAT functions, distinguishing direct transducer roles from downstream phenotypes.
  experiment_type: cell biology
- description: Express patient GNAI2 variants associated with periventricular nodular heterotopia or ventricular tachycardia (e.g. F200L) in HEK293 cells with BRET-based Gi activation sensors and cAMP biosensors to measure receptor coupling, nucleotide exchange and GTPase rates.
  hypothesis: Disease-associated GNAI2 variants alter nucleotide handling (gain or loss of function) and thereby dysregulate cAMP signaling in the affected tissue.
  experiment_type: functional genomics
