id: P04899
gene_symbol: GNAI2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAI2 encodes G alpha i2, a heterotrimeric G protein alpha subunit that transmits receptor
  signals through guanine-nucleotide exchange and hydrolysis. Activated Gi2 can inhibit selected adenylyl
  cyclases and also regulate channel, kinase and secretory pathways in a receptor- and cell-dependent
  manner. It functions at the cytoplasmic plasma-membrane surface, with additional cytosolic, mitotic
  and neuronal secretory-vesicle pools. Its physiological roles include immune and vascular signaling,
  endocrine secretion and synaptic regulation.
