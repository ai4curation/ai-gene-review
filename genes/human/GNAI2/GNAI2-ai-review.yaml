      supporting_text: In this context, forms a complex with the beta subunit GNB1 and the gamma subunit GNG2
    - reference_id: Reactome:R-HSA-751001
      supporting_text: The inactive G alpha (i):GDP complex has much higher affinity for the G beta:gamma complex and consequently reassociates.
