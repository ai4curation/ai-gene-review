  review:
    summary: Interaction with a G-protein beta subunit (UniProtKB:P62873) reported in PMID:16782902. Gβγ binding is the defining heterotrimer interaction of Gα subunits.
    action: MODIFY
    reason: Generic protein binding is uninformative. Binding of Gαi2-GDP to Gβγ forms the inactive heterotrimer (UniProt subunit statement; Reactome R-HSA-751001), so the more informative existing term G-protein beta/gamma-subunit complex binding is proposed.
