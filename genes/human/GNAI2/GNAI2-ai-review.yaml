id: P04899
gene_symbol: GNAI2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAI2 encodes Gαi2, the alpha subunit of the Gi2 heterotrimeric G protein and the most widely expressed member of the pertussis toxin-sensitive Gi/o family. N-terminally myristoylated and palmitoylated, Gαi2 associates with Gβγ at the cytoplasmic face of the plasma membrane. Ligand-bound Gi-coupled GPCRs (e.g. adenosine A1, opioid, cannabinoid CB1, chemokine and formyl peptide receptors) catalyse GDP/GTP exchange on Gαi2, which then dissociates from Gβγ and directly inhibits adenylyl cyclases (most potently types V and VI), lowering cAMP; intrinsic GTP hydrolysis, accelerated by RGS proteins, terminates signaling and returns Gαi2-GDP to the heterotrimer. Gαi2 is the dominant Gi alpha subunit in leukocytes and endothelium and is required for chemokine-driven lymphocyte and neutrophil trafficking, immune homeostasis of the gut, endothelial angiogenic responses and insulin action in mice. A pool of Gαi2 also localises to centrosomes and the midbody, where Gi proteins contribute to cytokinesis. Somatic and germline GNAI2 variants are linked to idiopathic ventricular tachycardia and periventricular nodular heterotopia.
