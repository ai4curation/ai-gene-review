core_functions:
- description: Gαi2 is a heterotrimeric G-protein alpha subunit that acts as a GTP/GDP molecular switch transducing signals from Gi-coupled GPCRs. Receptor-catalysed GDP/GTP exchange activates it, the GTP-bound subunit regulates effectors, and its intrinsic GTPase activity (accelerated by RGS proteins) terminates signaling and allows reassociation with Gβγ at the cytoplasmic face of the plasma membrane.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  in_complex:
    id: GO:0005834
    label: heterotrimeric G-protein complex
  supported_by:
  - reference_id: PMID:12359238
    supporting_text: The transduction of signal depends on the ability of the alpha subunit to cycle between a GDP bound and an active GTP bound state capable of interacting with intracellular enzymes.
  - reference_id: Reactome:R-HSA-380073
    supporting_text: This stimulates the exchange of GDP for GTP in the G-protein alpha subunit, activating the G-protein.
  - reference_id: Reactome:R-HSA-751001
    supporting_text: The inactive G alpha (i):GDP complex has much higher affinity for the G beta:gamma complex and consequently reassociates.
  - reference_id: PMID:7961880
    supporting_text: Thus, myristoylation is required both for the function of constitutively active Q205L Gi alpha-2 and for receptor-mediated activation of wild type Gi alpha-2.
- description: GTP-bound Gαi2 directly inhibits membrane adenylyl cyclases (most potently ADCY5 and ADCY6), reducing cAMP production downstream of Gi-coupled receptors such as the adenosine A1 receptor.
  molecular_function:
