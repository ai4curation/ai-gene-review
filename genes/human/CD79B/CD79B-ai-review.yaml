suggested_questions:
- question: Do endogenous human CD79B trafficking studies establish a direct cargo-sorting or adaptor-recruitment
    step sufficient for GO:0031623 receptor internalization or GO:0019882 antigen processing and presentation,
    beyond CD79B being receptor cargo and providing permissive signaling? The accessed chimeric-receptor
    evidence supports cooperative late-endosomal trafficking, but precise native human participation and
    the appropriate direct-versus-regulatory term remain unresolved.
