  - PANTHER:PTN000371571
  review:
    summary: CD79B-dependent receptor function contributes to B-cell differentiation.
    action: ACCEPT
    reason: CD79B participates through its receptor-assembly and ITAM-signaling contribution in the developmental
      checkpoints of B cells. Human disease and receptor-assembly evidence (PMID17675462), together with
      mouse single- and double-deficiency results (PMID12097390), support this central physiological role.
      Preserved V(D)J recombination distinguishes signaling-dependent maturation from recombinase catalysis.
      The inherited PAINT judgment is corroborated, not rejected on donor count.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:36426942
    - reference_id: PMID:17675462
    - reference_id: PMID:12097390
