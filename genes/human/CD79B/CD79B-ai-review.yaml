id: P40259
gene_symbol: CD79B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD79B (Igβ) is a type I transmembrane signaling subunit of the B-cell antigen receptor. It
  forms a disulfide-linked heterodimer with CD79A that associates with membrane immunoglobulin, supports
  receptor assembly and surface expression, and couples antigen recognition to intracellular signaling
  through immunoreceptor tyrosine-based activation motifs. The paired CD79 chains also support receptor-directed
  antigen trafficking to late endosomal processing compartments, facilitating MHC class II presentation.
  Ig-beta enhances Ig-alpha phosphorylation in chimeric-receptor experiments, although the underlying
  recruitment or protection mechanism is unresolved. Biallelic CD79B defects cause autosomal recessive
  agammaglobulinemia 6; the hypomorphic G137S allele impairs heterodimer assembly and receptor surface
  expression, with a leaky block in B-cell development.
