  review:
    summary: The extracellular portion of CD79B is associated with the external face of the
      plasma membrane.
    action: ACCEPT
    reason: The original IBA uses is_active_in. Human IgM-BCR structure places the
      extracellular Ig-alpha/Ig-beta domains in direct contact with membrane immunoglobulin,
      supporting CD79B's structural contribution to receptor assembly on this side of the
      plasma membrane. This complex-dependent contribution does not assign autonomous
      antigen binding to CD79B or relocate its cytoplasmic ITAM. The inherited assertion
      is consistent with the human receptor architecture; the PAINT node was not rebuilt.
    supported_by:
    - reference_id: PMID:35981043
