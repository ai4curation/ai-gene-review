  review:
    summary: The extracellular portion of CD79B is associated with the external face of the plasma membrane.
    action: ACCEPT
    reason: The extracellular immunoglobulin-like region of CD79B is exposed outside the plasma membrane
      and contacts membrane immunoglobulin in the receptor assembly. Its ITAM remains cytoplasmic. Human
      structural evidence supports the exposed domain's location and assembly contribution without assigning
      extracellular kinase docking or autonomous antigen recognition. The original phylogenetic/orthology
      assertion is retained; no independent reconstruction of its ancestral node is claimed.
