id: P40259
gene_symbol: CD79B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD79B (Igβ) is a type I transmembrane signaling subunit of the B-cell antigen
  receptor. It forms a disulfide-linked heterodimer with CD79A that associates with membrane
  immunoglobulin, supports receptor assembly and surface expression, and couples antigen recognition
  to intracellular signaling through immunoreceptor tyrosine-based activation motifs. CD79B
  therefore contributes to receptor activity within the assembled complex rather than recognizing
  antigen independently. Defective CD79A–CD79B assembly can impair surface IgM expression
  and B-cell function.
