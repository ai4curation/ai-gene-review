- id: PMID:20696394
  title: Structural and functional studies of Igalphabeta and its assembly with the B cell antigen receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected for the stated finding.
  findings:
  - statement: Purified human and murine Ig-beta extracellular domains form disulfide-bonded homodimers;
      this biochemical property does not replace the physiological Ig-alpha/Ig-beta BCR signaling heterodimer.
    supporting_text: 'the extracellular domains of murine and

      human Igbeta form an I-set immunoglobulin-like structure with an interchain

      disulfide between cysteines on their G strands.'
core_functions:
- description: CD79B forms the Ig-alpha/Ig-beta signaling module with CD79A, supporting surface assembly
    and transmembrane signal transmission by the B-cell antigen receptor. Cooperative Ig-beta-dependent
    enhancement of Ig-alpha phosphorylation is supported by chimeric-receptor experiments. The paired
    chains also facilitate receptor-directed antigen delivery to late endosomal processing compartments;
    this trafficking context is supported at the receptor-complex level.
