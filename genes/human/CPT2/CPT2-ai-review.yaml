  review:
    summary: Retain the positive CPT2–CYSRT1 binary interaction as non-core.
    action: KEEP_AS_NON_CORE
    reason: Three literal HuRI records identify human P23786 and A8MQ03 in two-hybrid array, prey-pooling
      and validated two-hybrid formats in yeast. The reference-product sequences reproduce both ROGIDs,
