id: P23786
gene_symbol: CPT2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Carnitine palmitoyltransferase II (CPT2) is a mitochondrial carnitine O-acyltransferase associated
  with the matrix face of the inner membrane. It completes the carnitine shuttle by converting imported
  acylcarnitines and coenzyme A to acyl-CoA and free L-carnitine, providing substrates for mitochondrial
  fatty acid beta-oxidation. The reaction is reversible, and the enzyme also forms acylcarnitines from
  several medium- and long-chain acyl-CoAs. CPT2 is synthesized as a 658-residue precursor with an N-terminal
  mitochondrial targeting sequence. Biallelic defects impair fatty acid oxidation and can cause severe
  neonatal or infantile disease or recurrent muscle symptoms, including rhabdomyolysis during metabolic
  stress.
