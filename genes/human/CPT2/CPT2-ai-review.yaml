suggested_questions:
- question: Which oligomeric states of mature human CPT2 occur at the inner membrane under physiological
    lipid and substrate conditions?
  experts:
  - Mitochondrial fatty-acid metabolism
- question: In which endogenous human cell contexts do the measured CPT2–MCUR1, CPT2–CYSRT1 and CPT2–OTX1
    associations occur, and what do they change about CPT2 chemistry or trafficking?
suggested_experiments:
- description: Compare mature human CPT2 activity and oligomeric state in a defined inner-membrane-like
    lipid system with detergent extracts, measuring both acylcarnitine formation and acyl-CoA regeneration
    across C8–C20 substrates.
  hypothesis: Membrane and substrate context affect the reaction balance and apparent assembly state without
    requiring a second catalytic function.
status: DRAFT
