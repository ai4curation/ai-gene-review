  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original human liver peptide/cDNA study supports the 658-residue precursor, 25-residue
      leader and enzyme identity/localization. The complete original five scanned pages were read in the
      bounded core consultation; owner read the complete abstract and its scoped findings. PMID:1961767
      corrects G283 to A and E375 to G, without changing product length or retracting the paper. This
      source is not described as the later recombinant turnover assay.
- id: PMID:20538056
  title: 'Carnitine palmitoyltransferase 2: New insights on the substrate specificity and implications
    for acylcarnitine profiling.'
  findings:
  - statement: Human CPT2 substrate profiling shows activity with medium (C8-C12) and long-chain (C14-C18)
      acyl-CoA esters, minimal activity on short/very-long-chain or branched substrates, and reversible
      operation contributing to acylcarnitine profiles.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine selected cache is abstract-only. The complete accepted-manuscript Methods, Results
      and Discussion were independently read from the public HAL deposit. Complete human ORF was expressed
      in yeast; homogenate assays run in the acylcarnitine-forming direction with empty-vector controls,
      and mitochondrial processing was incomplete. The substrate panel includes lower C20 activity, so
      C18 is not an absolute upper limit. It does not directly measure beta-oxidation flux.
