core_functions:
- description: Catalyzes reversible carnitine O-acyl transfer on the matrix face of the mitochondrial
    inner membrane, regenerating acyl-CoA from imported acylcarnitines to complete the carnitine shuttle
    and feed fatty acid beta-oxidation. The same enzyme also forms medium- and long-chain acylcarnitines
    in the reverse direction.
  molecular_function:
    id: GO:0016406
    label: carnitine O-acyltransferase activity
  directly_involved_in:
  - id: GO:0006853
    label: carnitine shuttle
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:1988962
    supporting_text: an inner mitochondrial membrane enzyme
  - reference_id: PMID:20538056
    supporting_text: CPT2 is active with medium (C8-C12) and long-chain (C14-C18) acyl-CoA esters
