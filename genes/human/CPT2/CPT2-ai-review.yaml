    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:P32242
  review:
    summary: Refine the positive OTX1 interaction to its demonstrated transcription-factor class.
    action: MODIFY
    reason: The actual HuRI records EBI-22741336, EBI-22733631 and EBI-24264064 identify the same positive
      human CPT2–OTX1 pair in yeast assays. Human OTX1/P32242 has direct sequence-specific promoter-binding
      and RNA-polymerase-II reporter activity in PMID:18849347. GO:0061629 therefore describes the assayed
      partner class, without claiming that CPT2 binds DNA, regulates transcription, or contacts OTX1 in
      a native nuclear compartment. The original OTX1 reporter required double normalization; detailed
      OTX2/CRX-only mutant or competition controls are not attributed to OTX1. This secondary interaction
      is not a second catalytic core. This refinement combines evidence for the binding event with independent
      evidence identifying the bound protein class. The term does not require CPT2 to modulate transcription
      or to contact the DNA-binding domain of OTX1. Yeast fusion assays leave endogenous encounter and
      physiological relevance unresolved, but compartment expectations alone do not contradict the reported
      interaction. The more general MCUR1 and CYSRT1 association reviews lack this same demonstrated partner-class
      refinement.
