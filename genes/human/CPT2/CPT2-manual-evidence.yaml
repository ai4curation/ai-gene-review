      - 'DISEASE: Carnitine palmitoyltransferase 2 deficiency, infantile (CPT2DI) [MIM:600649]: An autosomal
        recessive disorder of mitochondrial long-chain fatty acid oxidation, characterized by hepatic
        or hepato-cardio-muscular manifestations with onset in infancy. Clinical features include hypoketotic
        hypoglycemia, lethargy, seizures, hepatomegaly, liver dysfunction, cardiomegaly and dilated cardiomyopathy.
        {ECO:0000269|PubMed:1528846, ECO:0000269|PubMed:8651281}. Note=The disease is caused by mutations
        affecting the gene represented in this entry.;DISEASE: Carnitine palmitoyltransferase 2 deficiency,
        lethal neonatal (CPT2DLN) [MIM:608836]: An autosomal recessive disorder of mitochondrial long-chain
        fatty acid oxidation with fatal outcome, presenting shortly after birth. It is characterized by
        respiratory distress, seizures, altered mental status, hepatomegaly, cardiomegaly, cardiac arrhythmia,
        and, in many cases, dysmorphic features, renal dysgenesis, and migration defects. recessive. {ECO:0000269|PubMed:11477613}.
        Note=The disease is caused by mutations affecting the gene represented in this entry.;DISEASE:
        Carnitine palmitoyltransferase 2 deficiency, myopathic, stress-induced (CPT2D) [MIM:255110]: An
        autosomal recessive disorder of mitochondrial long-chain fatty acid oxidation, characterized by
        recurrent myoglobinuria, episodes of muscle pain, stiffness, and rhabdomyolysis. These symptoms
        are exacerbated by prolonged exercise, fasting, cold, or viral infection. CPT2DM affects most
        frequently children or young adults, and severity of attacks is highly variable. Myoglobinuria
        can cause kidney failure and death. {ECO:0000269|PubMed:10090476, ECO:0000269|PubMed:11477613,
        ECO:0000269|PubMed:14605500, ECO:0000269|PubMed:14615409, ECO:0000269|PubMed:1528846, ECO:0000269|PubMed:15489334,
        ECO:0000269|PubMed:15622536, ECO:0000269|PubMed:7711730, ECO:0000269|PubMed:8358442, ECO:0000269|PubMed:8651281,
        ECO:0000269|PubMed:9600456, ECO:0000269|PubMed:9758712, ECO:0000269|Ref.13, ECO:0000269|Ref.17}.
        Note=The disease is caused by mutations affecting the gene represented in this entry.;DISEASE:
        Encephalopathy, acute, infection-induced, 4 (IIAE4) [MIM:614212]: A severe neurologic complication
        of an infection. It manifests within days in otherwise healthy children after common viral infections,
        without evidence of viral infection of the brain or inflammatory cell infiltration. In affected
        children, high-grade fever is accompanied within 12 to 48 hours by febrile convulsions, often
        leading to coma, multiple-organ failure, brain edema, and high morbidity and mortality. The infections
        are usually viral, particularly influenza, although other viruses and even mycoplasma have been
        found to cause the disorder. {ECO:0000269|PubMed:15811315, ECO:0000269|PubMed:21697855}. Note=Disease
        susceptibility is associated with variations affecting the gene represented in this entry. CPT2
        polymorphic variants do not cause classical carnitine palmitoyltransferase 2 deficiency, and patients
        harboring any of them are asymptomatic most of the time. However, they are prone to viral infection
        (high fever)-related encephalopathy (PubMed:21697855). {ECO:0000269|PubMed:21697855}.'
