  actual_access: Actual fly original Methods/Results and rescue constructs were read. PMID:32737422 is
    an Editorial Expression of Concern because stocks and construct maps were not retained for repeat
    work. The concern limits reproducibility; it is not a retraction or proof that the reported beta-oxidation
    role is false. The original paper also differs in numbering the inactive rat rescue mutant between
    text and Methods; no exact variant identity is silently resolved.
