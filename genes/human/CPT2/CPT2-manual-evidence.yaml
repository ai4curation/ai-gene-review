  actual_access: Actual selected original Methods/Results/Discussion were read. The structural protein
    is rat CPT2 residues 32–658 with a C-terminal His tag, crystallized with detergent. Membrane attachment
    is supported as a structural model; a stable human oligomer or direct CPT2–translocase contact was
    not demonstrated.
