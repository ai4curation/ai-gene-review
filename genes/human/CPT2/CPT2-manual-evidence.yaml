  actual_access: Actual selected primary methods and original Table S1 target/header cells were read.
    CPT2 is directly present in the MitoCoP dataset, with positive subtractive, spatial and importomics
    classifications and a peripheral-membrane classification. The inherited abstract-section label is
    preserved, but the target-specific support is in the supplementary table rather than the generic abstract
    alone.
