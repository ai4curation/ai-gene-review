reference_access:
- reference_id: PMID:1988962
  cache_sha256: 7070db53dcee0df58374b6ea723f739119c7884d421af40506d284a085709447
  cache_full_text_flag: false
  actual_access: Original human liver peptide/cDNA study supports the 658-residue precursor, 25-residue
    leader and enzyme identity/localization. The complete original five scanned pages were read in the
    bounded core consultation; owner read the complete abstract and its scoped findings. PMID:1961767
    corrects G283 to A and E375 to G, without changing product length or retracting the paper. This source
    is not described as the later recombinant turnover assay.
  pubmed: https://pubmed.ncbi.nlm.nih.gov/1988962/
  doi: https://doi.org/10.1073/pnas.88.2.661
- reference_id: PMID:20538056
  cache_sha256: 0a43682a728cc37c7e10a3d11bf253d4c367fc00fadf6653c234d4a963aad8ac
  cache_full_text_flag: false
  actual_access: Genuine selected cache is abstract-only. The complete accepted-manuscript Methods, Results
    and Discussion were independently read from the public HAL deposit. Complete human ORF was expressed
    in yeast; homogenate assays run in the acylcarnitine-forming direction with empty-vector controls,
    and mitochondrial processing was incomplete. The substrate panel includes lower C20 activity, so C18
    is not an absolute upper limit. It does not directly measure beta-oxidation flux.
  pubmed: https://pubmed.ncbi.nlm.nih.gov/20538056/
  doi: https://doi.org/10.1016/j.bbadis.2010.06.002
- reference_id: PMID:24780397
  cache_sha256: f86bca40bec7529568ea36b5bc7405f4a9dabd8ad4e238c12b0311af1e76fdbf
  cache_full_text_flag: false
  actual_access: The complete available abstract reports human patient-derived myocytes and C16 acylcarnitine
    accumulation, heat stress and bezafibrate responses. Full original Methods were not recovered. The
    inherited finding is accurate at this cellular profiling scope; isolated human enzyme activity is
    established independently.
  pubmed: https://pubmed.ncbi.nlm.nih.gov/24780397/
  doi: https://doi.org/10.1016/j.bbrc.2014.04.084
  review_full_text_unavailable: true
- reference_id: PMID:25578732
  cache_sha256: 307b53f3c1bef37b7527c7e53c1ff1b782fba9a4806b66b213fa9eb5b5e3d399
  cache_full_text_flag: true
  actual_access: Actual selected primary Methods/Results and complete abstract were read. Mouse adipose-specific
    Cpt2 deletion compromises cold adaptation and thermogenic gene induction; this is the exact conditional
    source for existing human ISS/IEA thermogenesis assertions. It is not a human cold-challenge experiment
    or an autonomous CPT2 signaling assay.
  pubmed: https://pubmed.ncbi.nlm.nih.gov/25578732/
  doi: https://doi.org/10.1016/j.celrep.2014.12.023
- reference_id: PMID:28514442
  cache_sha256: 41cf18a7c776a7c6f513c9e222ddfdc2946291ccbd589a8d1317d94a3e69d9f4
  cache_full_text_flag: true
  actual_access: Actual BioPlex Methods and the exact MCUR1-bait/CPT2-prey supplementary interaction record
    were read. Positive HEK293T AP-MS association is preserved without a direct binary contact or physiological
    calcium-regulatory mechanism claim.
  pubmed: https://pubmed.ncbi.nlm.nih.gov/28514442/
  doi: https://doi.org/10.1038/nature22366
- reference_id: PMID:32296183
  cache_sha256: de8eeaee8fd10c8537ad6b2f69602d414b6f1896221b208edb8ffbae9eaa263b
  cache_full_text_flag: true
  actual_access: Actual study text plus six exact HuRI records identify CPT2 with CYSRT1 or OTX1 in yeast
