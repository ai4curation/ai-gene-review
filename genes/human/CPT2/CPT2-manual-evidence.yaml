  actual_access: Actual human OTX1 construct, EMSA and promoter-reporter sections were read. OTX1 directly
    binds the tested promoter sequence and transactivates the reporter, supporting the partner’s transcription-factor
    class. The control promoters also respond, so double normalization is explicit. Competition and detailed
    mutant-reporter results limited to OTX2/CRX are not transferred to OTX1; native RPE OTX1 absence is
    also reported.
