followup_assessment:
  date: '2026-10-12'
  core_molecular_function:
    id: GO:0016406
    label: carnitine O-acyltransferase activity
  core_scope: One reversible carnitine O-acyltransferase activity encompasses the demonstrated medium/long-chain
    panel. Palmitoyl and octanoyl source assertions remain unchanged. Human ORF in yeast homogenates,
    incomplete processing and reverse assay direction are explicit.
  core_source:
    reference_id: PMID:20538056
    url: https://hal.archives-ouvertes.fr/hal-00608982/document
    locator: Methods 2.2–2.5, Results 3.1, Discussion and Figure 1; original accepted manuscript, not
      the abstract-only cache.
  binding_review:
    source_reference_id: PMID:32296183
    source_partner: UniProtKB:P32242
    replacement:
      id: GO:0061629
      label: RNA polymerase II-specific DNA-binding transcription factor binding
    reason: The actual HuRI records EBI-22741336, EBI-22733631 and EBI-24264064 identify the same positive
      human CPT2–OTX1 pair in yeast assays. Human OTX1/P32242 has direct sequence-specific promoter-binding
      and RNA-polymerase-II reporter activity in PMID:18849347. GO:0061629 therefore describes the assayed
      partner class, without claiming that CPT2 binds DNA, regulates transcription, or contacts OTX1 in
      a native nuclear compartment. The original OTX1 reporter required double normalization; detailed
      OTX2/CRX-only mutant or competition controls are not attributed to OTX1. This secondary interaction
      is not a second catalytic core. This refinement combines evidence for the binding event with independent
      evidence identifying the bound protein class. The term does not require CPT2 to modulate transcription
      or to contact the DNA-binding domain of OTX1. Yeast fusion assays leave endogenous encounter and
      physiological relevance unresolved, but compartment expectations alone do not contradict the reported
      interaction. The more general MCUR1 and CYSRT1 association reviews lack this same demonstrated partner-class
      refinement.
    partner_class_reference: PMID:18849347
    partner_class_locator: Human expression-vector Methods; EMSA Methods and Results Figure 2A; transfection
      Methods and Results Figure 3A. No new figure-pixel inspection claimed.
  editorial_notice_attribution:
    reference_id: PMID:32737422
    url: https://www.nature.com/articles/s41598-020-70053-7
    locator: Operative paragraph identifying unavailable fly stocks and DNA constructs/maps. The earlier
      notes quotation is from this actual publisher text, not the metadata-only cache.
    cache: publications/PMID_32737422.md
  reference_scope: Five retained rat donor/expression references support the explicit propagation review,
    not additional human experiments. This index remains provenance rather than a primary evidence source.
