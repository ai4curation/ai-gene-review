    results:
    - id: GO:0000978
      isObsolete: false
      name: RNA polymerase II cis-regulatory region sequence-specific DNA binding
      definition:
        text: Binding to a specific upstream regulatory DNA sequence (transcription factor recognition
          sequence or binding site) located in cis relative to the transcription start site (i.e., on
          the same strand of DNA) of a gene transcribed by RNA polymerase II.
      comment: Note that the phrase upstream activating sequence, or UAS is often used in S. cerevisiae
        literature to refer to cis-regulatory sequences. In bacteria such as E. coli, the phrase upstream
        activating sequence, or UAS is usually a synonym for enhancer.
      synonyms:
      - name: RNA polymerase II core promoter proximal region sequence-specific DNA binding
        type: related
      - name: RNA polymerase II distal enhancer sequence-specific DNA binding
        type: related
      - name: RNA polymerase II promoter proximal region sequence-specific DNA binding
        type: related
      - name: RNA polymerase II proximal promoter sequence-specific DNA binding
        type: related
      - name: RNA polymerase II upstream activating sequence (UAS) sequence-specific DNA binding
        type: related
