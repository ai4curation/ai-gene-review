- definition:
    numberOfHits: 1
    results:
    - id: GO:0006635
      isObsolete: false
      name: fatty acid beta-oxidation
      definition:
        text: A fatty acid oxidation process that results in the complete oxidation of a long-chain fatty
          acid. Fatty acid beta-oxidation begins with the addition of coenzyme A to a fatty acid, and
          occurs by successive cycles of reactions during each of which the fatty acid is shortened by
          a two-carbon fragment removed as acetyl coenzyme A; the cycle continues until only two or three
          carbons remain (as acetyl-CoA or propionyl-CoA respectively).
        xrefs:
        - dbCode: ISBN
