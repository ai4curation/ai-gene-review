  cache_full_text_flag: true
  actual_access: Actual original mouse conditional muscle Cpt2 deletion Methods/Results and complete abstract
    were read. Long-chain fatty-acid oxidation falls markedly, with compensatory medium-chain utilization.
    Literal activity, matrix and shuttle donor records are preserved without calling each measurement
    a purified-protein localization experiment.
