- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Core biological process. Phylogenetically inferred (IBA) membership in the
      imidazolonepropionase clade correctly places AMDHD1 in L-histidine
      catabolism, the third step of which it catalyses. Consistent with UniProt
      PATHWAY (L-histidine degradation into L-glutamate, step 3/3) and Reactome.
    action: ACCEPT
    reason: >-
      ACCEPT because AMDHD1 itself performs a step of the process rather than
      merely being required for it: it catalyses the conversion of
      4-imidazolone-5-propanoate to N-formimidoyl-L-glutamate, the third of the
      four reactions that take histidine to glutamate. The IBD node behind this IBA
      sits at the base of the HutI/imidazolonepropionase clade, which is defined by
      exactly this activity, and the seed includes the characterized
      Pseudomonas/Agrobacterium enzyme (UniProtKB:Q9HU91 in the WITH/FROM, with
      PANTHER:PTN000505272); human AMDHD1 retains the full Amidohydro_1 fold and
      both metal-ligating positions, so there is no evidence of divergence or
      activity loss that would exclude it from the clade.
    supported_by:
    - reference_id: file:human/AMDHD1/AMDHD1-uniprot.txt
      supporting_text: >-
        glutamate; N-formimidoyl-L-glutamate from L-histidine: step 3/3.
- term:
    id: GO:0050480
    label: imidazolonepropionase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Core molecular function. IBA to imidazolonepropionase activity matches the
      UniProt catalytic-activity/EC assignment (EC 3.5.2.7,
      4-imidazolone-5-propanoate + H2O = N-formimidoyl-L-glutamate) and the
      HutI-family metallo-hydrolase fold. This is the defining catalytic activity
      of the gene product.
    action: ACCEPT
    reason: >-
      ACCEPT: this is the gene's defining molecular function and the enables
      qualifier is correct, since AMDHD1 is a single-subunit amidohydrolase that
      performs the hydrolysis itself. The phylogenetic inference is the strongest
      evidence available for the human protein - UniProt still labels it "Probable
      imidazolonepropionase" and derives the EC assignment by similarity to
