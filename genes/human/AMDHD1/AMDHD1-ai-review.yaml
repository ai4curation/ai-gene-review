suggested_questions:
- question: >-
    UniProt lists both Zn(2+) and Fe(3+) as cofactors, ligated by the same two
    residues (260 and 334), with the assignment transferred from bacterial
    orthologs. Which metal does the human enzyme actually use in liver and skeletal
    muscle, and does the identity of the metal change kcat or substrate
    specificity?
- question: >-
    The human enzyme has never been purified or assayed; its activity and EC
    assignment are inherited from UniProtKB:P42084, and Reactome states that the
    existence of the human enzyme is inferred only from high-throughput screening.
    What are the steady-state kinetic parameters of recombinant human AMDHD1, and
    do they match the bacterial enzyme closely enough to justify the "probable"
    qualifier being dropped?
- question: >-
    One report describes AMDHD1 as a cholangiocarcinoma tumor suppressor that
    stabilizes SMAD4 and enhances TGF-beta signaling. Is this activity separable
    from catalysis - does a catalytically dead active-site mutant still stabilize
    SMAD4 - and is the effect reproducible outside biliary tract tumors?
- question: >-
    The only reproducible interactor from proteome-scale screens is the
    Kelch/BTB adaptor KLHL23 (NbExp=3). Is AMDHD1 a CUL3-KLHL23 ubiquitylation
    substrate, and if so does that pathway set histidine-catabolic flux by
    controlling AMDHD1 abundance?
suggested_experiments:
- hypothesis: >-
    Recombinant human AMDHD1 is a genuine imidazolonepropionase whose turnover
    depends on an active-site divalent metal held by His-260 and His-334, and
    substituting either residue abolishes activity without preventing folding.
  description: >-
    Express and purify recombinant human AMDHD1, then measure
    4-imidazolone-5-propanoate hydrolysis (coupled or direct assay for
    N-formimidoyl-L-glutamate formation) to obtain Km and kcat. In parallel,
    determine the bound metal and its stoichiometry by ICP-MS on
    as-purified protein, and repeat the kinetics after metal removal and
    reconstitution with Zn(2+) or Fe(3+) separately. Assay H260A and H334A variants
    alongside, checking fold integrity by circular dichroism and thermal shift so
    that loss of catalysis can be distinguished from loss of structure. This would
    convert the activity from a by-similarity inference into a direct human
    measurement and settle the Zn-versus-Fe question.
  experiment_type: recombinant enzyme kinetics with ICP-MS metal quantification
- hypothesis: >-
    AMDHD1 is required for histidine-catabolic flux in human hepatocytes, and the
    pathway stalls at 4-imidazolone-5-propanoate when it is lost.
  description: >-
    Knock out AMDHD1 in a hepatocyte line (or primary human hepatocytes) and follow
    the fate of uniformly labelled [13C6]-L-histidine by LC-MS, quantifying
    urocanate, 4-imidazolone-5-propanoate, N-formimino-L-glutamate and glutamate.
    Accumulation of the AMDHD1 substrate with loss of downstream label would
    establish the step in human cells; rescue with wild-type but not active-site
    mutant AMDHD1 would tie the flux to catalysis rather than to the protein's
    presence.
  experiment_type: stable-isotope metabolic flux analysis in a knockout line
- hypothesis: >-
    The SMAD4-stabilising, TGF-beta-promoting activity reported in
    cholangiocarcinoma is independent of imidazolonepropionase catalysis.
  description: >-
    Compare wild-type AMDHD1 and a catalytically inactive active-site variant for
    their ability to co-immunoprecipitate SMAD2/3/4, to slow SMAD4 ubiquitination
    and proteasomal turnover in cycloheximide-chase and ubiquitination assays, and
    to restore TGF-beta-dependent reporter activity and cell-cycle arrest in
    AMDHD1-depleted cells. A catalysis-independent effect would support annotating a
    second, moonlighting molecular function; a catalysis-dependent one would suggest
    the phenotype is metabolic and should not be annotated as protein
    stabilisation.
  experiment_type: structure-function separation of moonlighting activity
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      Source of four IEA rows on AMDHD1, from signatures of differing specificity:
      IPR005920 (imidazolonepropionase, family-specific) yields the correct process
      term GO:0006548, whereas IPR006680 (Amidohydro_1) and IPR011059
      (metal-dependent hydrolase composite domain) are superfamily-level matches and
      yield only the generic hydrolase-activity ancestors GO:0016787 and GO:0016810.
      The split explains why one InterPro2GO row is accepted and two are modified.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for all four InterPro2GO rows; signature identifiers taken
      from the GOA WITH/FROM column. The imprecision of two of the rows follows
      from superfamily-level domain matching, not from a citation error.
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
  findings:
  - statement: >-
      Basis for the GO:0003674 root molecular_function placeholder assigned by
      BHF-UCL in 2012. By the ND convention the placeholder records that no
      molecular-function data were available at that time; it is superseded now that
      GO:0050480 is annotated by both IBA and IEA, which is why that row is removed
      rather than kept as non-core.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the ND convention document. ND carries no evidence by
      definition, so removing the row it supports is not an override of an
      experimental curatorial judgment.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      GO_Central phylogenetic inference assigns AMDHD1 imidazolonepropionase
      activity (GO:0050480) and the L-histidine catabolic process (GO:0006548) from
      node PANTHER:PTN000505272, with the characterized bacterial enzyme
      UniProtKB:Q9HU91 among the descendant evidences. Human AMDHD1 retains the
      substrate-binding and metal-ligating residues of the clade, so it sits inside
      the group that inherited the function.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      GO_Central IBA to imidazolonepropionase activity and L-histidine catabolic
      process; consistent with UniProt EC 3.5.2.7 and HutI family membership. The
      node and WITH/FROM entries are taken from the GOA row; the short donor list
      reflects how few family members have been assayed, not weak support.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined multi-method electronic annotation supplies four AMDHD1 rows: the
      specific catalytic term GO:0050480 from the RHEA:23660 / EC 3.5.2.7 mapping,
      its cyclic-amide parent GO:0016812 from ARBA plus IPR005920, the process term
      GO:0006548, and the cytoplasm location from UniProtKB-SubCell SL-0086. Because
      the same pipeline emits both GO:0050480 and its ancestor, the ancestor is
      modified rather than kept.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the RHEA/EC, ARBA and UniProtKB-SubCell derived rows.
      This pipeline, unlike the superfamily InterPro2GO matches, does reach the
      specific catalytic term.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease
    networks.
  findings:
  - statement: >-
      BioPlex 2.0 is a proteome-scale affinity-purification mass-spectrometry
      network covering more than 25% of human protein-coding genes and over 56,000
      candidate interactions. AMDHD1 appears only as one node of that screen, with
      KLHL23 (Q8NBE8) as its reported partner; the paper does not characterise
      AMDHD1 or assign it a function.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Here we present BioPlex 2.0 (Biophysical Interactions of ORFeome-derived
      complexes), which uses robust affinity purification-mass spectrometry
      methodology to elucidate protein interaction networks
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 2.0 proteome-scale AP-MS (Huttlin 2017). Supports the AMDHD1-KLHL23
      interaction (with/from Q8NBE8) but is a systematic screen that does not
      characterise AMDHD1 or its function; supports only bare protein binding.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: >-
      BioPlex 3.0 plus an HCT116 network independently reproduce the AMDHD1-KLHL23
      (Q8NBE8) association in a second cell background. This replication is what
      makes the interaction itself credible, and is why removing the bare
      protein-binding term is a statement about the term rather than about the
      measurement.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Through affinity-purification mass spectrometry, we have created two
      proteome-scale, cell-line-specific interaction networks.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 3.0 proteome-scale AP-MS (Huttlin 2021), 293T/HCT116. Again captures
      the AMDHD1-KLHL23 (Q8NBE8) interaction as one of >100,000 edges; no
      AMDHD1-specific functional insight.
- id: Reactome:R-HSA-70906
  title: 4-imidazolone-5-propanoate + H2O => N-formiminoglutamate
  findings:
  - statement: >-
      Reactome curates the AMDHD1 reaction as cytosolic and names substrate and
      product explicitly, which supports both the cytosol location and the use of
      the specific GO:0050480 term over the cyclic-amide parent. The same entry
      states that the existence of the human enzyme is inferred only from
      high-throughput screening (Yamada et al. 2004) rather than from a direct
      assay - the clearest statement in this review of why a human enzymological
      characterization is still outstanding.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      Cytosolic imidazolonepropionase catalyzes the hydrolysis of
      4-imidazolone-5-propanoate to form N-Formimino-L-glutamate. While evidence
      from many experimental systems indicates that this reaction occurs, existence
      of the human enzyme is inferred only from high-throughput screening studies
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for cytosolic imidazolonepropionase; supports the catalytic
      activity and the cytosol location. Notably candid that the human enzyme is
      inferred rather than assayed, which this review carries through into the
      reasons for the activity annotations.
- id: Reactome:R-HSA-70921
  title: Histidine catabolism
  findings:
  - statement: >-
      The major route of histidine catabolism proceeds in four steps to glutamate,
      converting one tetrahydrofolate to 5-formiminotetrahydrofolate. AMDHD1
      catalyses the third of these steps, between urocanate hydratase (UROC1) and
      glutamate formimidoyltransferase (FTCD), which places AMDHD1 inside the
      process rather than merely adjacent to it.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      The major pathway of histidine catabolism, annotated here, proceeds in four
      steps to yield glutamate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome histidine catabolism pathway; AMDHD1 catalyses step 3. Supports the
      L-histidine catabolic process annotation.
- id: file:human/AMDHD1/AMDHD1-uniprot.txt
  title: UniProtKB entry Q96NU7 (HUTI_HUMAN, AMDHD1)
  findings:
  - statement: >-
      AMDHD1 catalyses hydrolytic cleavage of the carbon-nitrogen bond in
      imidazolone-5-propanoate to form N-formimidoyl-L-glutamate, the third step of
      the universal histidine degradation pathway (EC 3.5.2.7, RHEA:23660). The
      catalytic activity, EC number and pathway position are all assigned by
      similarity to UniProtKB:P42084, which is why the entry name is "Probable
      imidazolonepropionase".
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      FUNCTION: Catalyzes the hydrolytic cleavage of the carbon-nitrogen bond
  - statement: >-
      The enzyme binds one zinc or ferric iron ion per subunit, coordinated by
      residues 260 and 334; substrate-binding residues are 159, 192, 263 and 336.
      It belongs to the metallo-dependent hydrolases superfamily, HutI family. This
      is the basis for the proposed GO:0008270 zinc ion binding annotation.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      Note=Binds 1 zinc or iron ion per subunit.
  - statement: >-
      Subcellular location is Cytoplasm, with experimental evidence
      (ECO:0000269|PubMed:39143229); the same report is the source of the
      SMAD2/3/4 interaction and the TGF-beta tumor-suppressor activity recorded in
      the FUNCTION line. That paper is not cached in this repository, so the
      moonlighting role informs the description only and is not annotated.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:39143229}.
  - statement: >-
      The only interaction recorded in the entry is with KLHL23 (Q8NBE8, NbExp=3),
      matching the two proteome-scale screens; no function is attached to it.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      Q96NU7; Q8NBE8: KLHL23; NbExp=3; IntAct=EBI-21895891, EBI-2512246;
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The authoritative source for AMDHD1's catalytic activity, cofactor, pathway
      position, active-site residues and localization. Important caveat carried
      through this review: nearly every functional statement in the entry is
      ECO:0000250 (by similarity to UniProtKB:P42084), not experimental for the
      human protein.
