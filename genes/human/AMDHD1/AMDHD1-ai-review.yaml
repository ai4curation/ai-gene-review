- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: ISS
  original_reference_id: file:human/AMDHD1/AMDHD1-uniprot.txt
  qualifier: enables
  supporting_entities:
  - UniProtKB:P42084
  review:
    summary: >-
      Proposed new annotation. AMDHD1 is a metallo-dependent hydrolase that binds
      one catalytic zinc (or ferric iron) ion per subunit, ligated by His-260 and
      His-334 in the HutI active site. GOA currently carries no metal-binding term
      for AMDHD1, although the orthologous bacterial imidazolonepropionase does.
    action: NEW
    reason: >-
      NEW because the binding is done by AMDHD1 itself: the metal is held by the
      protein's own side chains (BINDING 260 and BINDING 334, each annotated for
      both Zn(2+) and Fe(3+)) and is the Lewis acid that activates the water
      molecule for C-N bond hydrolysis, so this is the cofactor case rather than a
      necessity-only relationship. The comparator check supports rather than
      refutes the proposal: the Pseudomonas putida HutI ortholog carries both
      GO:0008270 zinc ion binding and GO:0005506 iron ion binding (IEA,
      GO_REF:0000104), and human ACMSD, in the same metallo-dependent hydrolase
      superfamily, carries GO:0008270 by IDA from two papers - so metal binding is
      the convention for this family, and its absence on AMDHD1 is a coverage gap
      in the UniProt cofactor pipeline for this entry rather than a deliberate
      curatorial omission. Evidence is ISS, because the cofactor and both ligating
      residues are assigned in UniProt by similarity to the characterized enzyme
      UniProtKB:P42084; the human protein has not been purified and its metal
      content not measured, which is why zinc is proposed (the primary cofactor
      listed, and the one with P42084-derived site evidence) rather than iron, and
      why the Zn/Fe question is raised under suggested_questions.
    supported_by:
    - reference_id: file:human/AMDHD1/AMDHD1-uniprot.txt
      supporting_text: >-
        Name=Zn(2+); Xref=ChEBI:CHEBI:29105;
