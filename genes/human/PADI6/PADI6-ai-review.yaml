    label: protein-arginine deiminase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000089843
  - PANTHER:PTN007467066
  negated: true
  review:
    summary: 'Accept the PAINT NOT row: PADI6 lost the ancestral PADI deiminase activity.'
    action: ACCEPT
    reason: The PADI6 lineage carries a PAINT IKR at PTN000089843 that blocks the ancestral PTN007467066 deiminase IBD, and two human PADI6 structure/activity papers independently show loss of both calcium binding and standard PADI substrate citrullination.
    supported_by:
    - reference_id: PMID:38656308
      supporting_text: PAD6 was found to be enzymatically inactive for citrullination using histone H3 and cytokeratin 5 in vitro
    - reference_id: PMID:39286527
      supporting_text: 'does not bind Ca2+ and is inactive in in vitro assays against standard

        PADI substrates'
