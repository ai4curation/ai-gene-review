id: Q6TGC4
gene_symbol: PADI6
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PADI6 is a catalytically inactive PADI-family paralog that has lost the calcium-dependent protein-arginine deiminase activity of PADI1-4. Instead, it is an oocyte cytoplasmic-lattice scaffold: PADI6-containing lattice filaments store maternal ribosomal, cytoskeletal and reprogramming proteins needed by the preimplantation embryo, and human PADI6 loss of function causes female infertility with early embryonic arrest.'
