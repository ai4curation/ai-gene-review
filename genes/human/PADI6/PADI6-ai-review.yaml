- term:
    id: GO:0040016
    label: embryonic cleavage
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3V4
  - ensembl:ENSMUSP00000044044
  review:
    summary: Embryonic arrest phenotypes should not be promoted to a direct PADI6 cleavage/development process.
    action: MARK_AS_OVER_ANNOTATED
    reason: PADI6 is necessary for early embryos because it builds protein-storage cytoplasmic lattices in oocytes. The product does not itself execute embryonic cleavage; the direct process is protein storage.
