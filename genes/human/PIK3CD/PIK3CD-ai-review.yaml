core_functions:
- molecular_function:
    id: GO:0046934
    label: 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity
  description: p85-regulated p110δ synthesizes PIP3 at receptor-associated membranes, recruiting phosphoinositide-sensitive
    effectors during antigen-receptor and other signaling. Native mouse B-cell biochemistry supports the
    conserved mechanism; the human enzyme is directly characterized.
  directly_involved_in:
  - id: GO:0043491
    label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - id: GO:0050853
    label: B cell receptor signaling pathway
  - id: GO:0050852
    label: T cell receptor signaling pathway
