suggested_questions:
- question: How much do PI-to-PI3P and PI4P-to-PI(3,4)P2 reactions contribute to native p110δ signaling
    relative to its dominant PIP3 production?
- question: Which kinase accounts for receptor-associated p110δ Ser1039 phosphorylation in cells, and
    how does it tune pathway duration?
- question: What is the isoform-selective and death-mode-specific contribution of p110δ in FcαRI-stimulated
    human neutrophils?
suggested_experiments:
- description: Use isoform-selective genetic rescue in human primary B and T cells to separate PIK3CD-specific
    BCR, TCR, and CD28 signaling outputs from overlapping PIK3CA/PIK3CB/PIK3CG class I PI3K activity.
  experiment_type: primary-cell genetic rescue and phosphoprotein/PIP3 readout
- description: Measure PI(4,5)P2-to-PIP3 and PI4P-to-PI(3,4)P2 product formation for p110delta-p85 complexes
    under matched in vitro and membrane-recruitment conditions to clarify whether PI4P kinase annotations
    should remain non-core.
  experiment_type: lipid kinase substrate-specificity assay
