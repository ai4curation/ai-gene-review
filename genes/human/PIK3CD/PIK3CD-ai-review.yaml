id: O00329
gene_symbol: PIK3CD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIK3CD encodes p110δ, a class IA phosphoinositide 3-kinase catalytic subunit enriched in
  leukocytes. Complexes with p85-family regulatory subunits generate PIP3 at activated membranes and couple
  antigen, costimulatory and other receptor inputs to AKT, BTK and additional phosphoinositide-sensitive
  effectors. This signaling supports lymphocyte activation, differentiation and migration, alongside myeloid
  and mast-cell functions. p110δ also acts in endothelial and tumor-cell contexts. Its biochemical substrate
  range includes phosphatidylinositol and PI4P, and Ser1039 autophosphorylation can inhibit lipid kinase
  activity. A shorter splice product has distinct Ras-regulatory properties.
