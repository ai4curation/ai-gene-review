    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0005943
    label: phosphatidylinositol 3-kinase complex, class IA
  supported_by:
  - *id001
  - reference_id: file:human/PIK3CD/PIK3CD-uniprot.txt
    record_section:
    - CC:SUBUNIT
    supporting_text: Heterodimer of a catalytic subunit PIK3CD and a p85 regulatory subunit (PIK3R1, PIK3R2
      or PIK3R3).
  - reference_id: PMID:9235916
    supporting_text: Recombinant p110delta phosphorylates phosphatidylinositol and coimmunoprecipitates
      with p85.
- molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  description: p110δ can autophosphorylate Ser1039, inhibiting its lipid kinase activity in vitro; receptor-associated
    Ser1039 phosphorylation is also observed in cells, with the exact in-cell phosphate donor less conclusively
    assigned.
  directly_involved_in:
  - id: GO:0046777
    label: protein autophosphorylation
  supported_by:
  - reference_id: PMID:10064595
    supporting_text: The single site of autophosphorylation was mapped to Ser1039 at the C-terminus of
      p110delta.
