        from these patients, as well as implications of these findings for clinical therapy.
    - reference_id: PMID:20940048
      supporting_text: As a result of the broad effects of PI3Kδ in leukocyte functions, the disruption
        of PI3Kδ expression or activity leads to decreased inflammatory and immune responses in vivo.
