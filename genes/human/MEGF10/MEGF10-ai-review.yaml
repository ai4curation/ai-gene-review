- term:
    id: GO:0034109
    label: homotypic cell-cell adhesion
  evidence_type: IDA
  original_reference_id: PMID:22407321
  qualifier: involved_in
  review:
    summary: Homotypic cell-cell adhesion (IDA, Kay et al. 2012, retinal mosaics).
    action: MODIFY
    reason: The full text of PMID:22407321 shows that MEGF10 mediates homotypic recognition that produces
      intercellular repulsion, not adhesion. MEGF10-expressing HEK293 cells formed sharp borders with
      gaps, and no homophilic binding was detected. GO:0034109 (attachment of a cell to a second cell
      of the identical type via adhesion molecules) therefore contradicts the reported phenotype. The
      supported part is homotypic cell-cell recognition. GO has no 'homotypic cell-cell repulsion' term,
      so the nearest accurate parent is proposed.
    proposed_replacement_terms:
    - id: GO:0009988
      label: cell-cell recognition
    supported_by:
    - reference_id: PMID:22407321
      supporting_text: these results suggest that a MEGF10-containing signaling complex mediates a homotypic
        interaction resulting in intercellular repulsion
    - reference_id: PMID:22407321
      supporting_text: we have been unable to demonstrate MEGF10 homophilic binding using biochemical
        methods
    - reference_id: PMID:22407321
      supporting_text: mosaic spacing requires repellent homotypic interactions mediated by MEGF10 and
