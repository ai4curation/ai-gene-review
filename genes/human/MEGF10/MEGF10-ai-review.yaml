- term:
    id: GO:0098883
    label: synapse pruning
  evidence_type: IMP
  original_reference_id: PMID:24270812
  review:
    summary: Astrocyte engulfment of synapses requires MEGF10 (mouse).
    action: NEW
    reason: 'In the developing and adult mouse brain, astrocytes engulf synapses through MEGF10 and MERTK.
      MEGF10 is the engulfment receptor in this process, so it does part of the work of synapse removal.
      This is not just a requirement. Comparator check: other phagocytic receptors used for synapse removal
      carry this branch (ITGAM, the CR3 alpha chain, carries complement-mediated synapse pruning GO:0150062;
      C1QA carries GO:0098883). Evidence is from mouse, so this is a context-specific non-core process.'
    supported_by:
    - reference_id: PMID:24270812
      supporting_text: requires the MEGF10 and MERTK phagocytic pathways
    - reference_id: PMID:24270812
      supporting_text: Both MEGF10 and MERTK function as engulfment receptors
