  - PANTHER:PTN002778616
  - UniProtKB:Q96KG7
  review:
    summary: Notch binding by IBA (PTN002778616, vertebrate MEGF10 clade).
    action: KEEP_AS_NON_CORE
    reason: The underlying evidence is co-immunoprecipitation of the MEGF10 and Notch1 intracellular domains
      in myoblasts. It may contribute to muscle phenotypes but is not the conserved engulfment function.
      MEGF10 loss causes EMARDD myopathy, and satellite-cell/myoblast phenotypes are well documented.
      These muscle roles are real but separate from the conserved engulfment-receptor function, and their
      mechanism (Notch1 interaction, Y1030 signaling) is incompletely defined, so they are kept as non-core.
    supported_by:
    - reference_id: PMID:28498977
      supporting_text: Reciprocal co-immunoprecipitation studies show that Megf10 and Notch1 interact
        via their respective intracellular domains
