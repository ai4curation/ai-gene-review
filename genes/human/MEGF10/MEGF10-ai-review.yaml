suggested_questions:
- question: Does MEGF10 bind phosphatidylserine directly, or does it recognize apoptotic cells only through
    bridging molecules such as C1q?
- question: What is the ligand for the homotypic MEGF10-dependent repulsion that spaces retinal neurons,
    given that MEGF10 homophilic binding was not detected biochemically?
- question: Is the MEGF10-Notch1 intracellular-domain interaction direct, and does it explain the satellite-cell
    proliferation and differentiation phenotypes in EMARDD?
- question: Should PANTHER family grounding for MEGF10 follow PANTHER's own classification (PTHR24035:SF136,
    the family that carries the CED-1/Draper PAINT nodes) rather than the UniProt/InterPro cross-reference
    (PTHR24052:SF13)? See projects/PANTHER_FAMILY_ASSIGNMENT_DISCREPANCIES.md.
suggested_experiments:
- hypothesis: The MEGF10 ectodomain binds phosphatidylserine directly, independently of C1q.
  description: Liposome flotation and SPR binding of purified MEGF10 ectodomain to PS-containing versus
    PC-only liposomes, with and without C1q, including EMARDD missense variants.
  experiment_type: binding assay
- hypothesis: GULP1 couples MEGF10 to engulfment through the NPxY motif.
  description: Compare engulfment of apoptotic cells by MEGF10 wild-type, NPxY-mutant and Y1030F-mutant
    receptors in GULP1-knockout versus control phagocytes.
  experiment_type: genetic and cell biological
