  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6DIB5
  review:
    summary: Apoptotic process involved in development (ISS from mouse Megf10 IMP, PMID:27170117).
    action: REMOVE
    reason: This ISS is transferred from the mouse Megf10 IMP (MGI, PMID:27170117). The source phenotype
      is more TUNEL- and cleaved-caspase-3-positive cells in the developing cerebellum of Megf10-deficient
      mice, which the authors read as a clearance defect. In the full text (PMC4863057, checked for this
      review) the Figure 1 title says that Megf10 deficiency 'results in accumulation of apoptotic cells
      in the developing CB'. Uncleared corpses accumulate whether or not more cells die. MEGF10 acts in
      the engulfing cell (engulfment of apoptotic cell, which GO separates from the apoptotic process
      itself) and does none of the work of the apoptotic program. The mouse source row is also REMOVE
      in genes/mouse/Megf10/Megf10-ai-review.yaml. This case is logged in projects/APOPTOSIS/ASSAY_READOUT_OVERANNOTATION.md.
    supported_by:
    - reference_id: PMID:27170117
      supporting_text: Megf10-deficient mice have increased apoptotic cells in the developing cerebellum
        and have impaired phagocytosis of apoptotic cells by astrocytes
    propagation_review:
