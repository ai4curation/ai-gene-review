id: Q96KG7
gene_symbol: MEGF10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MEGF10 is a single-pass type I transmembrane receptor of the CED-1/Draper family, made of
  an EMI domain, 17 atypical EGF-like repeats and a cytoplasmic tail with NPxY and YxxL motifs. It is
  the mammalian functional ortholog of the C. elegans engulfment receptor CED-1 and is classified as a
  class F scavenger receptor. On astrocytes and other engulfing cells it binds the eat-me signal C1q,
  which marks phosphatidylserine-exposing apoptotic cells. It collects at the base of the forming phagocytic
  cup and drives engulfment, working with the CED-6 ortholog GULP1 and the CED-7 ortholog ABCA1. Astrocytes
  also use it to engulf synapses during synapse elimination. In the retina, homotypic MEGF10 signalling
  causes cell-cell repulsion that spaces starburst amacrine and horizontal cells into mosaics. In skeletal
  muscle it is expressed in activated satellite cells and regulates myoblast proliferation, migration
  and differentiation, in part through Notch1. Recessive loss of function causes early-onset myopathy,
  areflexia, respiratory distress and dysphagia (EMARDD).
