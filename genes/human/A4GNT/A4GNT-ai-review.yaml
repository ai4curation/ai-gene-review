id: Q9UNA3
gene_symbol: A4GNT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  A4GNT is a type-II single-pass Golgi membrane glycosyltransferase that transfers
  N-acetylglucosamine from UDP-GlcNAc in an alpha-1,4 linkage to terminal
  beta-linked galactose residues on mucin-type O-glycans. It preferentially
  modifies core-2-branched O-GalNAc glycans, generating the terminal
  GlcNAc-alpha-1,4-Gal-beta-R structure characteristic of gastric gland (class
  III) mucin. In human gastrointestinal gland mucous cells, A4GNT is concentrated
  in the Golgi region, and its glycan product occurs on mucins including MUC5AC
  and MUC6. A4GNT transcripts are detected in stomach and pancreas, consistent
  with its specialized role in glandular mucin glycan elaboration.
