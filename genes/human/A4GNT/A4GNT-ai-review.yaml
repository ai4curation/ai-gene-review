      that alpha1,4-linked GlcNAc residues are transferred most efficiently to
      core 2 branched O-glycans
    reference_section_type: ABSTRACT
  - reference_id: PMID:11304796
    supporting_text: >-
      Expression of alpha4GnT was largely associated with the Golgi region of
      mucous cells that produce the mucous glycoproteins having
      GlcNAcalpha1-->4Galbeta-->R, such as the glandular mucous cells of stomach
      and Brunner's gland.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
proposed_new_terms:
- proposed_name: beta-D-galactoside 4-alpha-N-acetylglucosaminyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: a beta-D-galactoside +
    UDP-N-acetyl-alpha-D-glucosamine = an
    N-acetyl-alpha-D-glucosaminyl-(1->4)-beta-D-galactosyl derivative + UDP +
    H(+).
  justification: >-
    GO:0008375 captures the transferred N-acetylglucosamine class but not the
    terminal beta-D-galactoside acceptor or alpha-1,4 linkage that define A4GNT.
    RHEA:85983 represents the reaction explicitly, and the human biochemical
    study demonstrates the linkage and preference for mucin O-glycan acceptors.
  proposed_parent:
    id: GO:0008375
    label: acetylglucosaminyltransferase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:85983
      label: >-
        a beta-D-galactoside + UDP-N-acetyl-alpha-D-glucosamine = an
        N-acetyl-alpha-D-glucosaminyl-(1->4)-beta-D-galactosyl derivative + UDP
        + H(+)
  supported_by:
  - reference_id: PMID:10430883
    supporting_text: >-
      These results indicate that the alpha4GnT is a glycosyltransferase that
      forms alpha1,4-linked GlcNAc residues, preferentially in O-glycans.
    reference_section_type: ABSTRACT
  - reference_id: PMID:10430883
    supporting_text: >-
      Herein we describe the expression cloning of a cDNA encoding a human
      alpha1,4-N-acetylglucosaminyltransferase (alpha4GnT), a key enzyme for the
      formation of GlcNAcalpha1-->4Galbeta1-->R.
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Which endogenous human mucin glycosites and acceptor structures are the
    principal A4GNT substrates, and are MUC5AC and MUC6 the dominant carriers in
    each gastrointestinal tissue where A4GNT is expressed?
- question: >-
    Which Golgi subcompartment and resident partners determine A4GNT access to
    core-2-branched rather than core-1 or core-3 O-glycan acceptors?
suggested_experiments:
- hypothesis: >-
    Endogenous A4GNT preferentially installs the GlcNAc-alpha-1,4-Gal-beta-R cap
    at a restricted set of core-2 O-glycosites on MUC5AC and MUC6.
  description: >-
    Compare intact glycopeptide and released-glycan profiles from A4GNT-knockout
    human gastric organoids, wild-type rescue, and catalytic-dead rescue, with
    targeted analysis of MUC5AC and MUC6 glycosites and linkage-sensitive
    validation of the terminal alpha-GlcNAc product.
  experiment_type: genetic rescue and glycoproteomics
- hypothesis: >-
    A4GNT's physiological specificity is determined by both terminal galactose
    linkage and the underlying mucin O-glycan core.
  description: >-
    Measure steady-state kinetics of purified human A4GNT against a structurally
    defined acceptor panel spanning core-1, core-2, and core-3 O-glycans with
    beta-1,3- or beta-1,4-linked terminal galactose, confirming product linkages
    by mass spectrometry or NMR.
  experiment_type: enzyme kinetics and structural glycomics
