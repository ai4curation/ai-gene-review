- id: PMID:10430883
  title: Expression cloning of a human alpha1, 4-N-acetylglucosaminyltransferase that
    forms GlcNAcalpha1-->4Galbeta-->R, a glycan specifically expressed in the gastric
    gland mucous cell-type mucin.
  findings:
  - statement: >-
      Human A4GNT transfers alpha-1,4-linked GlcNAc to terminal beta-galactose,
      with core-2-branched mucin O-glycans the most efficient tested acceptors.
    supporting_text: >-
      An in vitro GlcNAc transferase assay by using a soluble alpha4GnT revealed
      that alpha1,4-linked GlcNAc residues are transferred most efficiently to
      core 2 branched O-glycans
    reference_section_type: ABSTRACT
  - statement: >-
      Expression of A4GNT in gastric adenocarcinoma cells was sufficient to
      generate class III mucin reactivity.
    supporting_text: >-
      Transfection of alpha4GnT cDNA into gastric adenocarcinoma AGS cells produced
      class III mucin, indicating that alpha4GnT is responsible for the formation
      of class III Con A reactivity.
    reference_section_type: ABSTRACT
  - statement: >-
      The cloned 340-residue product has the predicted topology of a type-II
      membrane protein.
    supporting_text: >-
      The deduced amino acid sequence predicts a type II membrane protein with 340
      amino acids, showing no significant similarity with any other proteins.
    reference_section_type: ABSTRACT
  - statement: >-
      Core-2 O-glycans are preferred over core-1 acceptors, while core-3 activity
      was barely detectable in the tested panel.
    supporting_text: >-
      The α4GnT was found to act more efficiently on core 2 branched O -glycans
      and less efficiently on core 1 oligosaccharide. However, this enzyme hardly
      transferred GlcNAc to core 3 oligosaccharide, GlcNAcβ1→3GalNAcα→ p NP
      (Fig. 5 ).
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defining full-text human expression-cloning and biochemical study. It
      establishes the transferred sugar and linkage, acceptor preference,
      class-III-mucin gain of function, and predicted type-II topology.
- id: PMID:11304796
  title: Immunohistochemical demonstration of alpha1,4-N-acetylglucosaminyltransferase
    that forms GlcNAcalpha1,4Galbeta residues in human gastrointestinal mucosa.
  full_text_unavailable: true
  findings:
  - statement: >-
      Endogenous human A4GNT was localized largely to the Golgi region of glandular
      mucous cells producing its terminal glycan product.
    supporting_text: >-
      Expression of alpha4GnT was largely associated with the Golgi region of
      mucous cells that produce the mucous glycoproteins having
      GlcNAcalpha1-->4Galbeta-->R, such as the glandular mucous cells of stomach
      and Brunner's gland.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Human gastric MUC5AC and MUC6 carry the GlcNAc-alpha-1,4-Gal-beta-R
      structure generated by A4GNT.
    supporting_text: >-
      An immunoprecipitation experiment disclosed that two distinct mucin proteins,
      MUC5AC and MUC6 present in gastric mucin, carried the
      GlcNAcalpha1-->4Galbeta-->R structures.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. Primary human-tissue evidence for
      Golgi-region localization and physiological mucin carriers; the cached record
      is abstract-only, so no more specific cisternal localization is asserted.
