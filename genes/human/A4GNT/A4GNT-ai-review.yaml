    terminal beta-D-galactose on mucin-type O-GalNAc glycans, preferentially on
    core-2-branched acceptors. At the Golgi membrane, this activity elaborates
    mucin O-glycans with the terminal GlcNAc-alpha-1,4-Gal-beta-R structure.
  molecular_function:
    id: GO:0008375
    label: acetylglucosaminyltransferase activity
  directly_involved_in:
  - id: GO:0016266
    label: protein O-linked glycosylation via N-acetylgalactosamine
  locations:
