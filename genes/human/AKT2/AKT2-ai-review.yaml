      supporting_text: Initial velocity studies revealed that all AKT isozymes follow the sequential kinetic
        mechanism
    - reference_id: PMID:23444369
      supporting_text: Phosphorylation was mediated by Akt2 at four motifs within the plakophilin 1 N-terminal
        domain.
    - reference_id: Reactome:R-HSA-165162
      supporting_text: All three isoforms of AKT, AKT1 (Inoki et al. 2002), AKT2 (Kearny et al. 2019),
        and AKT3 (Wainstein et al. 2022) phosphorylate TSC2.
- term:
    id: GO:0140677
    label: molecular function activator activity
  evidence_type: EXP
  original_reference_id: PMID:12517337
  qualifier: enables
  review:
    summary: Molecular function activator activity, attributed to a crystal structure of the inactive
      AKT2 kinase domain.
    action: UNDECIDED
    reason: The abstract describes only an inactive, unliganded kinase-domain structure and gives no basis
      for an activator activity. The curator may have used details from the full text that cannot be checked
      here. AKT2 activates some substrates (e.g. PDE3B) by phosphorylating them, but that is kinase activity,
      not binding-mediated activator activity.
    supported_by:
    - reference_id: PMID:12517337
      supporting_text: The structure of an inactive and unliganded Akt2 kinase domain reveals several
        features that distinguish it from other kinases.
