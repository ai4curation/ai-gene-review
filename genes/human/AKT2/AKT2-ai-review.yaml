- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:17565718
  qualifier: located_in
  review:
    summary: Nuclear pool of AKT2, seen in differentiating myoblasts and as the site of TTC3-mediated
      degradation of phospho-AKT.
    action: KEEP_AS_NON_CORE
    reason: AKT2 shuttles into the nucleus, where it phosphorylates nuclear substrates (e.g. FOXO, CBY1)
      and is degraded via TTC3. In differentiated myoblasts it is mostly nuclear. This is a genuine but
      secondary location; the main site of activation is the cytosol and the plasma membrane inner leaflet.
    supported_by:
    - reference_id: file:human/AKT2/AKT2-uniprot.txt
      supporting_text: Localizes within both nucleus and cytoplasm in proliferative primary myoblasts
        and mostly within the nucleus of differentiated primary myoblasts
    - reference_id: PMID:20059950
      supporting_text: facilitates its ubiquitination and degradation within the nucleus
