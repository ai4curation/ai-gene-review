- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q60823
  - ensembl:ENSMUSP00000103981
  - UniProtKB-SubCell:SL-0039
  review:
    summary: Plasma membrane. AKT2 is a peripheral protein of the cytoplasmic face, recruited when its
      PH domain binds PIP3.
    action: ACCEPT
    reason: AKT2 has no transmembrane segment or extracellular exposure. When PI3K is activated, its PH
      domain binds PtdIns(3,4,5)P3 at the inner leaflet of the plasma membrane, where PDPK1 and mTORC2
      phosphorylate it. Plasma membrane is a correct location for this activation step, but only for an
      intracellular, membrane-associated pool.
    supported_by:
    - reference_id: file:human/AKT2/AKT2-uniprot.txt
      supporting_text: Through binding of the N-terminal PH domain to phosphatidylinositol (3,4,5)-trisphosphate
        (PtdIns(3,4,5)P3) or phosphatidylinositol (3,4)-bisphosphate (PtdIns(3,4)P2), recruited to the
        plasma membrane.
    - reference_id: Reactome:R-HSA-109700
      supporting_text: The phosphorylation of membrane-recruited AKT at threonine and serine can be inhibited
