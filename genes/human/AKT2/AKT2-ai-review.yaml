core_functions:
- description: PIP3-activated serine/threonine kinase. It is recruited from the cytosol to the inner leaflet
    of the plasma membrane through its PH domain, where it is activated. It then phosphorylates substrates
    in the cytosol and nucleus (GSK3, TSC2, FOXO, TBC1D4, PKP1).
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0043491
    label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - id: GO:0008286
    label: insulin receptor signaling pathway
  supported_by:
  - reference_id: PMID:16540465
    supporting_text: AKT/PKB is a phosphoinositide-dependent serine/threonine protein kinase
  - reference_id: PMID:16814735
    supporting_text: IRS-1 and Akt2 were required for myoblast differentiation and glucose metabolism
  - reference_id: PMID:23444369
    supporting_text: Phosphorylation was mediated by Akt2 at four motifs within the plakophilin 1 N-terminal
      domain.
suggested_questions:
- question: Which substrates are phosphorylated specifically by AKT2 and not by AKT1/AKT3 in human adipocytes
    and myocytes, and what determines isoform selectivity (localization, partner adaptors)?
- question: What fraction of AKT2 signaling occurs at endosomal versus plasma-membrane PIP3 pools?
suggested_experiments:
- description: Isoform-specific chemical-genetic (analog-sensitive) AKT2 phosphoproteomics in human primary
    adipocytes after insulin stimulation.
