id: P31751
gene_symbol: AKT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AKT2 (protein kinase B beta) is a cytosolic AGC-family serine/threonine protein kinase with
  an N-terminal pleckstrin homology (PH) domain, a central kinase domain and a C-terminal regulatory tail.
  When growth factors or insulin activate PI3K, the PH domain binds PtdIns(3,4,5)P3/PtdIns(3,4)P2 and
  recruits AKT2 to the inner leaflet of the plasma membrane, where PDPK1 (Thr-309) and mTORC2 (Ser-474)
  phosphorylate and activate it. Active AKT2 phosphorylates many substrates in the cytosol and nucleus,
  including GSK3, TSC2, FOXO factors, TBC1D4/AS160, PDE3B and PKP1. Among the AKT isoforms it has a particularly
  important role in insulin action in muscle, fat and liver: it promotes GLUT4 translocation, glucose
  uptake, glycogen synthesis and suppression of hepatic glucose output. It also supports myoblast differentiation
  and cell survival, proliferation and migration. Inactivating mutations cause insulin resistance and
  diabetes, an activating E17K variant causes hypoinsulinemic hypoglycemia, and AKT2 is amplified in ovarian
  and other cancers.'
