- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10490823
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UKG1
  review:
    summary: Generic protein binding. Partners include APPL1, TCL1 family coactivators, GSK3B, TTC3, WDFY2,
      HSP90AB1, PKP1, AKT1, UBE2O and others.
    action: REMOVE
    reason: The protein-binding policy treats bare GO:0005515 as uninformative. Many partners are kinase
      substrates (GSK3B, PKP1, ANKRD2), whose relevance is already captured by the serine/threonine kinase
      activity. Others are regulators of AKT (TCL1 coactivators, TTC3/UBE2O E3 ligases, APPL1/WDFY2 adaptors).
      No partner supports a more informative AKT2 molecular-function term. Removing the rows does not
      dispute that the interactions happen.
    supported_by:
    - reference_id: PMID:10983986
      supporting_text: All TCL1 isoforms bind to the Akt pleckstrin homology domain.
    - reference_id: PMID:20059950
      supporting_text: TTC3 is an Akt-specific E3 ligase that binds to phosphorylated Akt and facilitates
        its ubiquitination and degradation within the nucleus.
