      "Our results suggest that Alpk2 is a rapidly evolving gene that lost its essential cardiac functions
      in mammals."], and UniProt flags the conflict [file:genes/human/ALPK2/ALPK2-uniprot.txt "CC   -!-
      CAUTION: Although knockdown in zebrafish points to a role for ALPK2 in"]. The human hESC evidence
      is retained, but because the role is not established for the mammalian organism it is kept as non-core.'
