id: Q86TB3
gene_symbol: ALPK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALPK2 (alpha-kinase 2, heart alpha-kinase) is a large atypical protein kinase of the alpha-kinase
  family, with N-terminal immunoglobulin-like domains and a C-terminal alpha-kinase domain. It is highly
  induced as human embryonic stem cells become cardiac progenitors, and in hESCs and zebrafish it is needed
  for cardiomyocyte differentiation, where it restrains WNT/beta-catenin signaling; mice lacking it, however,
  have normal hearts, so this developmental role is not conserved in mammals. In adult mouse cardiomyocytes
  it protects against diastolic dysfunction and its overexpression increases tropomyosin 1 phosphorylation.
  In colorectal cells it is down-regulated by oncogenic KRAS and promotes luminal apoptosis in 3D culture.
  Its direct substrates are not established.
