- id: PMID:29888752
  title: ALPK2 Promotes Cardiogenesis in Zebrafish and Human Pluripotent Stem Cells.
  findings:
  - statement: ALPK2 is a candidate negative regulator of WNT signaling in cardiogenesis.
    supporting_text: By intersecting gene expression and loss-of-function siRNA screens we identified
      Alpha Protein Kinase 2 (ALPK2) as a candidate negative regulator of WNT/β-catenin signaling in cardiogenesis.
  - statement: ALPK2 promotes cardiomyocyte differentiation in hESCs and zebrafish.
    supporting_text: Using antisense knockdown and CRISPR/Cas9 mutagenesis in hESCs and zebrafish, we
      demonstrate that ALPK2 promotes cardiac function and cardiomyocyte differentiation.
  - statement: ALPK2 loss stabilizes beta-catenin.
    supporting_text: loss of ALPK2 led to stabilization of β-catenin and increased WNT signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Source of the cardiac IMP rows; contradicted for mammals by PMID:32383995.
- id: PMID:32383995
  title: Atypical ALPK2 kinase is not essential for cardiac development and function.
  findings:
  - statement: Alpk2 knockout mice have normal hearts.
    supporting_text: We found that Alpk2-gKO mice exhibited normal cardiac function and morphology up
      to one year of age.
  - statement: Alpk2 lost its essential cardiac function in mammals.
    supporting_text: Our results suggest that Alpk2 is a rapidly evolving gene that lost its essential
      cardiac functions in mammals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Mammalian test of the cardiogenesis claim.
- id: PMID:39556326
  title: ALPK2 prevents cardiac diastolic dysfunction in heart failure with preserved ejection fraction.
  findings:
  - statement: Alpk2 overexpression increases tropomyosin 1 phosphorylation.
    supporting_text: Conversely, Alpk2 overexpression increased the phosphorylation of tropomyosin 1,
      a major regulator that binds myosin to actin, and mitigated cardiac stiffness in HFpEF.
  - statement: Cardiomyocyte Alpk2 deficiency worsens diastolic dysfunction.
    supporting_text: cardiomyocyte-specific Alpk2 deficiency exacerbated cardiac diastolic dysfunction
      induced by aging and in the HFpEF model.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Mouse; the only evidence bearing on a substrate, and indirect.
- id: PMID:22641666
  title: ALPK2 is crucial for luminal apoptosis and DNA repair-related gene expression in a three-dimensional
    colonic-crypt model.
  findings:
  - statement: ALPK2 knockdown reduces luminal apoptosis in 3D colonic cells.
    supporting_text: In HKe3 cells grown in 3D culture, ALPK2 siRNA inhibited luminal apoptosis and reduced
      the expression of cleaved caspase-3.
  - statement: ALPK2 knockdown reduces DNA repair gene expression.
    supporting_text: Furthermore, ALPK2 siRNA reduced the expression of DNA repair genes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
- id: PMID:28668886
  title: An Alpha-kinase 2 Gene Variant Disrupts Filamentous Actin Localization in the Surface Cells of
    Colorectal Cancer Spheroids.
  findings:
  - statement: Wild-type ALPK2 attenuates basolateral actin polarity.
    supporting_text: Notably, the basolateral polarity of actin in the surface of HCT116-wtALPK2 spheroids
      was more attenuated compared to that of HCT116-subALPK2 spheroids.
  - statement: Wild-type ALPK2 promotes luminal apoptosis.
    supporting_text: Furthermore, luminal apoptosis and cell aggregation were promoted by wtALPK2, but
      not by subALPK2 in 3D culture.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only. Single variant study in one cell line.
- id: file:genes/human/ALPK2/ALPK2-deep-research-affinage.md
  title: Affinage mechanistic annotation for ALPK2 (human)
  findings:
  - statement: Affinage notes the cardiogenic role is not conserved in mouse.
    supporting_text: This essential cardiogenic function is not conserved in mouse, where two independent
      global Alpk2 knockouts show normal cardiac development and unaltered WNT signaling
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
