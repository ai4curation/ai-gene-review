id: Q07890
gene_symbol: SOS2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SOS2 (Son of sevenless homolog 2) is a large, ubiquitously expressed cytoplasmic guanine
  nucleotide exchange factor (GEF) for RAS-family small GTPases and the close paralog of SOS1 (about 70%
  identical). Like SOS1 it comprises an N-terminal regulatory region (tandem histone-like folds, a Dbl-homology
  (DH) domain and a pleckstrin-homology (PH) domain), a central catalytic REM-CDC25 module, and a C-terminal
  proline-rich tail. The CDC25 domain catalyzes release of GDP from RAS, converting it to the active GTP-bound
  form, while the DH-PH region holds the catalytic module in an autoinhibited state. In resting cells
  SOS2 is cytosolic and constitutively bound, through its proline-rich tail, to the SH3 domains of the
  adaptor GRB2, for which it has higher affinity than SOS1. Receptor tyrosine kinase activation recruits
  the GRB2-SOS2 complex, directly or via SHC, to the plasma membrane, where SOS2 activates membrane-anchored
  RAS. SOS2 overlaps functionally with SOS1 but is not equivalent to it: its complexes with activated
  EGFR and SHC are shorter lived, so it mainly supports acute rather than sustained RAS-ERK signaling,
  and in several cell types it makes a preferential contribution to RTK-driven RAS-PI3K-AKT signaling.
  Sos2-null mice are viable and fertile, and most SOS2 loss-of-function phenotypes appear only when SOS1
  is also absent, indicating a largely ancillary role. Gain-of-function missense variants in the DH domain
  relieve autoinhibition, increase RAS activation and cause Noonan syndrome type 9.'
