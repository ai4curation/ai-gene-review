  review:
    summary: Yang et al. (1995) showed that human SOS2 binds GRB2 through its C-terminal proline-rich
      domain, dependent on the GRB2 SH3 domains, with higher apparent affinity than SOS1.
    action: MODIFY
    reason: The interaction is real and functionally central (it couples SOS2 to activated receptor tyrosine
      kinases), but "protein binding" is uninformative. The paper maps the interaction to SOS2 proline-rich
      motifs binding GRB2 SH3 domains, so SH3 domain binding (GO:0017124) is the evidence-backed replacement,
      matching the SOS1 review.
    proposed_replacement_terms: *id003
    supported_by:
    - &id012
      reference_id: PMID:7629138
      supporting_text: We show that hSos2 interacts with Grb2 via its proline-rich COOH-terminal domain
        and that this interaction is dependent on the SH3 domains of Grb2.
    - &id013
      reference_id: PMID:7629138
      supporting_text: the apparent binding affinity of hSos2 for Grb2 is significantly higher relative
        to that of hSos1 both in vitro and in vivo
