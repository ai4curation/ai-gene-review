suggested_questions:
- question: Is SOS2 a bona fide RAC GEF in cells? The DH domain is highly similar to that of SOS1 and
    SOS2 binds EPS8/E3B1, but RAC-GEF activity has only been formally shown for SOS1; the Reactome RHO/RAC-activation
    reactions that place SOS2 in the cytosol should be checked against SOS2-specific data.
- question: What structural feature of the divergent SOS2 C-terminal tail (only about 40% identical to
    SOS1) makes GRB2-SOS2 complexes bind activated EGFR and SHC less stably than GRB2-SOS1, despite higher
    GRB2 affinity?
- question: Does the preferential coupling of SOS2 to PI3K-AKT output reflect RAS-isoform or membrane-nanodomain
    selectivity of SOS2 rather than a different catalytic activity?
- question: Does SOS2 contribute to FGFR signaling through the FRS2-GRB2 docking complex in the same way
    as SOS1? No SOS2-specific FGFR evidence was found; the role is inferred from the shared GRB2-coupled
    mechanism.
suggested_experiments:
- hypothesis: SOS2 and SOS1 differ in intrinsic catalytic rate or allosteric RAS-GTP activation.
  description: Purify the human SOS2 and SOS1 catalytic (REM-CDC25) and autoinhibited (HF-DH-PH-REM-CDC25)
    fragments and compare nucleotide exchange kinetics on H-, N- and KRAS on supported lipid bilayers,
    with and without RAS-GTP at the allosteric site.
  experiment_type: biochemical assay
- hypothesis: SOS2 activates RAC1 in cells through its DH-PH module.
  description: In SOS1-null cells, re-express wild-type SOS2 or DH-domain catalytic mutants and measure
    EGF- and PDGF-induced RAC1-GTP by PAK-PBD pull-down and FRET biosensors.
  experiment_type: cell-based assay
- hypothesis: SOS2 supports FGF2-induced RAS activation in the absence of SOS1.
  description: Measure FGF2-stimulated RAS-GTP, ERK and AKT phosphorylation in Sos1-/-, Sos2-/- and Sos1/2
    double knockout fibroblasts, with rescue by wild-type or GEF-dead SOS2.
  experiment_type: genetic knockout and rescue
