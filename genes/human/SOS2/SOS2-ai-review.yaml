    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-205039
  qualifier: located_in
  review:
    summary: Reactome TAS cytosol location for SOS2 as a participant in a GEF-mediated small GTPase activation
      reaction (Reactome:R-HSA-205039).
    action: ACCEPT
    reason: 'The cellular component (cytosol) is correct for SOS2. Note that the Reactome reaction context
      (RHO/RAC-family activation) is not well established for SOS2: Rac-GEF activity has only been formally
      demonstrated for SOS1. That caveat concerns the reaction, not the location, so the location annotation
      is retained.'
