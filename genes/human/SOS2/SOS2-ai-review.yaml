    - *id006
    - &id007
      reference_id: PMID:34205562
      supporting_text: So far, only SOS1 has been formally demonstrated to act as a bona fide Rac-GEF
        [13,58], and the hypothetical function of SOS2 as an Rac-GEF awaits future, stronger experimental
        evidence.
