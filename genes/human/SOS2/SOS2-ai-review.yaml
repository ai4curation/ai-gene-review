  review:
    summary: IBA guanyl-nucleotide exchange factor activity from PAINT node PTN000560991 (PTHR23113 RasGEF family),
      whose experimental donors span RasGEF family members from yeast, Dictyostelium, worm and fly to mammals, including
      human SOS1.
    action: ACCEPT
    reason: Core molecular function. SOS2 has an intact REM plus CDC25-homology catalytic module and promotes GDP-to-GTP
      exchange on RAS; SOS2 lies within the clade to which PAINT assigned the activity, with no evidence of loss.
    supported_by:
    - &id001
      reference_id: file:human/SOS2/SOS2-uniprot.txt
      supporting_text: Acts as guanine nucleotide exchange factor (GEF) for RAS proteins.
    - &id006
      reference_id: file:human/SOS2/SOS2-deep-research-falcon.md
      supporting_text: The CDC25-homology domain destabilizes nucleotide coordination and promotes GDP dissociation.
    - &id004
      reference_id: PMID:20639119
      supporting_text: Expression of SOS2 enhanced Galpha16QL-induced Ras activation and its subsequent signaling.
