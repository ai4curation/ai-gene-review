  review:
    summary: High-throughput interaction evidence (partner CRK, Bcr-Abl network TAP-MS) recorded as generic
      protein binding.
    action: REMOVE
    reason: Generic protein binding carries no functional information. This high-throughput interaction
      dataset (affinity purification / co-fractionation mass spectrometry or network mapping) does not
      map the binding interface or show a specific molecular activity, so no more informative MF can be
