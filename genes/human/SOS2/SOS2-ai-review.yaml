  review:
    summary: IPI for SOS2 binding GRB2, from a SILAC peptide pull-down screen in which a SOS proline-rich peptide
      retrieved only SH3-domain proteins. GRB2 recruits SOS2 to activated receptors by binding the SOS2 C-terminal
      proline-rich region with its SH3 domains (the defining SOS-GRB2 coupling); SOS2 binds GRB2 with higher affinity
      than SOS1.
    action: MODIFY
    reason: GO:0005515 'protein binding' is uninformative. The partner binds via its SH3 domain(s) to the SOS2 proline-rich
      tail, so GO:0017124 SH3 domain binding captures the molecular basis of the interaction and the adaptor-mediated
      recruitment of SOS2 to receptors. Deferring to the curator on the interaction itself.
    proposed_replacement_terms:
    - id: GO:0017124
      label: SH3 domain binding
    supported_by:
    - reference_id: PMID:14679214
      supporting_text: The proline-rich Sos peptide retrieved only SH3 domain containing proteins as specific binding
        partners.
    - &id002
      reference_id: PMID:7629138
      supporting_text: We show that hSos2 interacts with Grb2 via its proline-rich COOH-terminal domain and that
        this interaction is dependent on the SH3 domains of Grb2.
