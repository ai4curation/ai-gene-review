proposed_new_terms: []
suggested_questions:
- question: Does SOS2, like SOS1, have genuine Rac GEF activity through its DH-PH unit, which would justify the
    Reactome Rho/Rac GEF events that currently include SOS2?
- question: Is allosteric activation by RAS-GTP binding at the REM site as important for SOS2 as it is for SOS1,
    and does it explain the shorter-lived signals attributed to SOS2?
- question: What determines the preferential coupling of SOS2-generated RAS-GTP to PI3K-AKT rather than ERK output
    in keratinocytes and KRAS-mutant cells?
suggested_experiments:
- description: Measure intrinsic and RAS-GTP-stimulated nucleotide exchange of purified full-length and catalytic-domain
    SOS2 on HRAS, KRAS and NRAS (and on RAC1) side by side with SOS1.
- description: Test Noonan syndrome 9 DH-domain variants in reconstituted membrane assays to determine whether they
    relieve autoinhibition of SOS2 GEF activity.
