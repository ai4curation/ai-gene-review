id: Q07890
gene_symbol: SOS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Son of sevenless homolog 2 (SOS2) is a large cytosolic Ras guanine nucleotide exchange factor (RasGEF),
  the paralog of SOS1. It comprises an N-terminal tandem histone-fold region, a Dbl-homology (DH) and pleckstrin-homology
  (PH) regulatory unit, a catalytic core of Ras exchanger motif (REM) and CDC25-homology domains, and a C-terminal
  proline-rich tail. In resting cells SOS2 is cytosolic and autoinhibited; after receptor tyrosine kinase activation
  the SH3 domains of the adaptor GRB2 bind the SOS2 proline-rich tail (with higher affinity than for SOS1) and recruit
  it to phosphotyrosine sites at the plasma membrane, where the CDC25 domain catalyses GDP release from HRAS, KRAS
  and NRAS, allowing GTP loading and activation of RAF-MEK-ERK and PI3K-AKT signalling. SOS2 is partly redundant
  with SOS1 (Sos2-null mice are viable) but contributes preferentially to RTK-driven PI3K-AKT signalling in some
  cell types, to epidermal stem-cell maintenance and to the anchorage-independent survival of KRAS-mutant cancer
  cells. Heterozygous activating SOS2 variants in the DH region cause Noonan syndrome 9.
