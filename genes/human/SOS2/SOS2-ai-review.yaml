      reference_id: PMID:34205562
      supporting_text: the SOS GEFs are known to promote signal internalization and subsequent RAS/RAC
        activation through a process involving their recruitment from the cytosol to the plasma membrane
        via complex formation with different adaptor proteins
    - reference_id: PMID:10675333
      supporting_text: Sos1 and Sos2 proteins are constitutively bound to the Grb2 adaptor, through an
        interaction between the SH3 domains in Grb2 and proline-rich regions in the C–termini of both
        Sos proteins.
