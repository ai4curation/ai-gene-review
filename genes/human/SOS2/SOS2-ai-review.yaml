  review:
    summary: SOS2 is a RAS guanine nucleotide exchange factor; its REM-CDC25 catalytic module converts
      RAS-GDP to RAS-GTP. The PAINT node PTN000560991 places GEF activity at the root of the Ras-GEF family
      and SOS2 sits squarely within it.
    action: ACCEPT
    reason: 'The IBA is correctly placed: SOS2 retains the complete REM and CDC25 catalytic domains (InterPro
      IPR000651, IPR001895) and has direct experimental support for RAS-GEF activity. A catalytically
      dead SOS2 (F927A) fails to restore EGF-dependent HRAS activation in Sos2-/- cells, and Noonan syndrome
      DH-domain mutations increase SOS2-dependent RAS-GTP loading. GO:0005085 is the appropriate term;
      the more specific Ras-GEF term GO:0005088 no longer exists as a separate class in the current ontology.'
    additional_reference_ids:
    - PMID:30181243
    - PMID:26173643
    supported_by:
    - &id001
      reference_id: PMID:30181243
      supporting_text: These data indicate that SOS2 GEF activity, but not allosteric feedback activation
        of SOS2 by oncogenic KRAS, is key to SOS2-dependent activation of wild-type HRAS downstream of
        RTKs.
    - &id010
      reference_id: PMID:26173643
      supporting_text: These findings are consistent with a direct GOF effect on the RAS-GEF activity
        of NS-associated SOS2 mutations.
    - &id002
      reference_id: PMID:26173643
      supporting_text: SOS2 stimulates the release of GDP from RAS, promoting the conversion of the GTPase
        from the inactive, GDP-bound to the active, GTP-bound form
