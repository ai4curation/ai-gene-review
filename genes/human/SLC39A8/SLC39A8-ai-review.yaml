  review:
    summary: ZIP8 is required for normal protein N-glycosylation because it supplies the
      manganese that Mn-dependent glycosyltransferases (e.g. beta-1,4-galactosyltransferase)
      require; loss of function causes SLC39A8-CDG.
    action: KEEP_AS_NON_CORE
    reason: This is the defining disease mechanism (CDG type II) and is correctly
      represented with the acts_upstream_of qualifier for an indirect, Mn-mediated
      effect. ZIP8 does not itself catalyse glycosylation (the glycosyltransferases do),
      so it is a non-core downstream process rather than a function ZIP8 performs. The
      human disease and Mn-dependent enzyme data make the necessity relationship robust.
    supported_by:
