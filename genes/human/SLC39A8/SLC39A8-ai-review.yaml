- term:
    id: GO:0098849
    label: cellular detoxification of cadmium ion
  evidence_type: IMP
  original_reference_id: PMID:27466201
  qualifier: involved_in
  review:
    summary: ZIP8 imports cadmium into the cytosol, increasing cadmium accumulation and
      cytotoxicity; it does not detoxify cadmium.
    action: REMOVE
    reason: The cited paper shows the opposite of detoxification - ZIP8 (particularly the
      Ala391 variant) raises intracellular cadmium, activates stress signalling and
      reduces cell viability. UniProt likewise describes ZIP8 as importing cadmium, a
      non-essential metal which is cytotoxic and carcinogenic. "Cellular detoxification of
      cadmium ion" (reducing/removing cadmium toxicity) is contradicted by the evidence;
      the correct process for this paper is cadmium transmembrane transport, which is
      separately annotated. The detoxification term is likely a mis-assignment.
    supported_by:
    - reference_id: PMID:27466201
      supporting_text: This Ala391-associated cadmium accumulation also increased the
        phosphorylation of the signal transduction molecule ERK2, activation of the
        transcription factor NFκB, and reduced cell viability
    - reference_id: file:human/SLC39A8/SLC39A8-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Also imports cadmium a non-essential metal which is cytotoxic and
        carcinogenic
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_term
      requested_change: CHECK
      asserted_value: 'GO:0098849 cellular detoxification of cadmium ion'
      corrected_value: 'GO:0070574 cadmium ion transmembrane transport'
      confidence: PROBABLE
      explanation: ZIP8 imports cadmium and increases its intracellular accumulation and
        toxicity (PMID:27466201); it does not detoxify cadmium. The IMP from this paper
        supports cadmium transmembrane transport, not cellular detoxification of cadmium.
