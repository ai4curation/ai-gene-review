knowledge_gaps:
- gap_statement: It is not established whether ZIP8 transports metal directly across the
    membranes of intracellular organelles where it is detected (lysosome, and reported
    mitochondrial/ER pools), or whether its intracellular effects are entirely secondary
    to plasma-membrane import; the transport stoichiometry, directionality and structural
    basis at these sites are undetermined.
  boundary: Plasma-membrane manganese/zinc bicarbonate-coupled symport is firmly
    established biochemically (KM ~1.4 uM Mn2+); lysosomal localization in activated T
    cells is directly shown, but the organellar transport mechanism is not.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
suggested_questions:
- question: Does ZIP8 catalyse metal efflux directly from the lysosomal (and possibly
    mitochondrial) membrane into the cytosol, and with what ion coupling, or are its
    intracellular effects wholly downstream of plasma-membrane import?
- question: What determines ZIP8's in-vivo substrate hierarchy (Mn vs Zn vs Fe/Co/Cd)
    across tissues, and how does the common Ala391Thr variant reshape it to produce its
    pleiotropic clinical associations (blood pressure, osteoarthritis, manganese levels)?
suggested_experiments:
- description: Purify and reconstitute ZIP8 into proteoliposomes and measure electroneutral
    metal/bicarbonate symport kinetics and selectivity for Mn2+, Zn2+, Fe2+, Co2+ and Cd2+
    under defined pH and bicarbonate gradients.
- description: Use organelle-targeted genetically encoded Mn/Zn sensors with isoform- and
    compartment-specific ZIP8 knock-in/knockout to test whether lysosomal ZIP8 directly
    effluxes metal, distinguishing it from plasma-membrane-dependent effects.
