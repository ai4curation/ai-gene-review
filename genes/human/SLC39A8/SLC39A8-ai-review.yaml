  review:
    summary: Disease mutants of ZIP8 reduce mitochondrial manganese and MnSOD activity,
      but this reflects impaired cellular Mn uptake at the cell surface rather than direct
      ZIP8-mediated transport across the mitochondrial membrane.
    action: MARK_AS_OVER_ANNOTATED
