id: Q9C0K1
gene_symbol: SLC39A8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC39A8 (ZIP8) is a broad-specificity divalent metal cation importer
  of the ZIP (SLC39) family. It mediates electroneutral cellular uptake of divalent
  cations co-transported with bicarbonate, with manganese and zinc as its principal
  physiological substrates; it also transports iron, cobalt, the non-essential toxic
  metal cadmium, and (as part of a Zn/bicarbonate complex) the micronutrient anion
  selenite. ZIP8 acts chiefly at the plasma membrane, including the apical and
  basolateral membranes of polarized epithelia and endothelia (e.g. hepatocyte
  canalicular membrane, kidney proximal tubule, blood-brain-barrier microvascular
  endothelium), and is additionally found on the lysosomal membrane, where it releases
  zinc to the cytosol. By controlling cellular manganese supply it is required for the
  activity of manganese-dependent enzymes such as beta-1,4-galactosyltransferase and
  arginase; loss of function causes a congenital disorder of glycosylation (SLC39A8-CDG,
  CDG type II) and a Leigh-like phenotype through systemic manganese deficiency. Through
  regulated zinc import it also modulates downstream processes including NF-kappaB
  signalling and inflammation, MTF1-driven transcription, and extracellular-matrix
  remodelling during cardiac development.
