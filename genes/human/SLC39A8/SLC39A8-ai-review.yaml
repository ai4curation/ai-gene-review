core_functions:
- description: High-affinity manganese import across the plasma membrane via electroneutral
    bicarbonate-coupled divalent-metal symport. This is ZIP8's principal physiological
    function; it sets cellular and systemic manganese levels and thereby the activity of
    manganese-dependent enzymes (beta-1,4-galactosyltransferase, arginase, MnSOD).
