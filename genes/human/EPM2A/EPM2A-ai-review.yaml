id: O95278
gene_symbol: EPM2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EPM2A encodes laforin, a glucan-binding phosphatase involved in glycogen maintenance. Its
  carbohydrate-binding and phosphatase domains cooperate in recognition and dephosphorylation of glucan
  substrates, including glycogen. Laforin also helps the ubiquitin ligase malin act on the glycogen-associated
  regulator PTG, linking substrate recognition to control of glycogen-associated proteins. It occurs in
  cytoplasmic and glycogen-associated pools and can redistribute to the nucleus under particular cellular
  conditions. Loss of EPM2A causes Lafora disease, characterized by abnormal polyglucosan accumulation
  and progressive neurological disease. Phosphatase activity and malin-dependent regulatory effects are
  distinguishable, and the naturally occurring protein products need not have identical activities or
  distributions.
