core_functions:
- description: Laforin binds glucan substrates through its carbohydrate-binding and phosphatase domains
    and hydrolyzes phosphate esters on glycogen, directly contributing to glycogen metabolism. Human recombinant-protein
    assays establish glycogen dephosphorylation, while structure-guided mutations distinguish substrate
    binding from catalytic efficiency. The tested long laforin products are not assumed to confer the
    same activity on all alternative products. These biochemical results do not establish that every effect
    on glycogen architecture or disease prevention requires phosphatase activity.
  molecular_function:
    id: GO:0019203
    label: carbohydrate phosphatase activity
  directly_involved_in:
  - id: GO:0005977
    label: glycogen metabolic process
  supported_by:
  - reference_id: PMID:25544560
  - reference_id: PMID:26231210
- description: Laforin acts as an adaptor that permits malin-dependent ubiquitination of protein targeting
    to glycogen (PTG/PPP1R3C). The reconstituted reaction requires laforin and an interaction-competent
    malin protein, distinguishing this coordinated substrate–ligase role from association alone. Malin
    supplies the ubiquitin-ligase activity; laforin supplies the adaptor contribution. Cellular PTG regulation
    can persist with catalytically inactive laforin, separating this role from glucan phosphate hydrolysis.
  molecular_function: *id001
  supported_by:
  - reference_id: PMID:18070875
  - reference_id: PMID:15930137
suggested_questions:
- question: Which noncatalytic laforin activity enables the malin-dependent rescue of abnormal glycogen
    chains and Lafora bodies despite persistent glycogen hyperphosphorylation in the phosphatase-inactive
    transgene experiments of PMID:28536304?
- question: Does laforin dephosphorylate any protein substrate physiologically, beyond the demonstrated
    in-vitro capacity on labeled myelin basic protein, and which cellular substrate and conditions distinguish
    this from its glucan-phosphatase activity?
