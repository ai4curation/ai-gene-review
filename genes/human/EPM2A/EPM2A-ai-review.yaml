  review:
    summary: Laforin regulates and repairs glycogen; the traced donor experiment does not establish glycogen-synthase
      catalysis.
    action: REMOVE
    reason: The current mouse Epm2a donor Q9WUA5 carries IEP GO:0004373 from PMID:18852261. Its actual
      Methods (glycogen-synthase assay) and Results/Figure 6 measure glycogen-synthase protein and activity
      in Epm2a-null tissue fractions; they do not show laforin transferring glucose from UDP-glucose.
      The same original directly measures laforin-dependent phosphate removal from glycogen (Figure 4).
