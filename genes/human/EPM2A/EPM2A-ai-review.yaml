  review:
    summary: The inspected source directly supports cytoplasmic polysome association.
    action: MODIFY
    reason: 'The actual PMID:11001928 Results/Figures 5–8 and Discussion establish association with polysomes
      in a microsomal fraction: extensive QM-marker overlap, sucrose-gradient co-sedimentation and immunogold
      labeling over ribosomal units. The Results/caption explicitly report no signal over the associated
      membranous structures, while direct ER interaction remains a possibility in the Discussion. This
      is positive cytoplasmic localization, but membrane attachment is not established by the inspected
      experiments. Current GO membrane-side definitions require an embedded, attached or peripheral membrane
      association; the historical polysome term is now obsolete. Use the current cytoplasm term rather
      than claiming the paper establishes an ER lipid-bilayer location. This source-scope refinement is
      not a universal denial of membrane association in other conditions. This source specifically resolves
      laforin on polysomes and leaves direct ER-membrane association speculative, allowing a positive
      cytoplasm refinement. Other ER-membrane assertions have distinct inaccessible splice-product evidence
      and remain unresolved rather than being rejected globally.'
