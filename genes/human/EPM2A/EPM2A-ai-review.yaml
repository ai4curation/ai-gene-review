      and condition-specific, not proof that laforin can never dephosphorylate proteins. The eight-hour
      artificial-substrate result provides insufficient evidence that protein dephosphorylation is a physiological
      role of laforin. In the combined evidence, this process assignment is likely over-annotation; the
      measured molecular-function capacity is retained.
