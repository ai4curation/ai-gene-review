  review:
    summary: Laforin recruits the PTG substrate for malin-dependent ubiquitination.
    action: MODIFY
    reason: 'The original PMID:14532330 remains abstract-only after publisher and restricted institutional-file
      access attempts; the independent original PMID:18070875 directly resolves the mechanistic role.
      PMID:18070875 Methods, Results and Figure 3B show endogenous laforin–PTG co-immunoprecipitation
      from human HEK293 cells. Figure 3C then reconstitutes PTG ubiquitination with malin, E1/E2 and recombinant
      laforin: removal of laforin, or use of interaction-impaired malin E280K, prevents PTG modification.
      Laforin therefore contributes the adaptor linking the ligase to its substrate; malin performs ubiquitin
      transfer. CHO-IR overexpression effects and catalytic C266S controls are separate from the endogenous
      human association assay. GO:1990756 specifically describes binding that brings a ubiquitin-like
      ligase together with its substrate; ubiquitin ligases such as malin fall within this definition.
      No catalytic activity of malin is assigned to laforin.'
    supported_by:
    - reference_id: PMID:18070875
    proposed_replacement_terms:
    - &id001
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
