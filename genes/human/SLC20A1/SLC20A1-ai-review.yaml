id: Q8WUM9
gene_symbol: SLC20A1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC20A1 encodes the sodium-dependent phosphate transporter 1 (PiT1, GLVR1), a multi-pass
  plasma-membrane symporter of the SLC20/PiT family that imports inorganic phosphate coupled to sodium,
  preferentially the monovalent form with a stoichiometry of about two sodium ions per phosphate. It is
  broadly expressed and contributes to cellular phosphate uptake, with roles implicated in extracellular-matrix,
  cartilage and vascular calcification. PiT1 additionally has a role essential for cell proliferation
  that is independent of its phosphate-transport activity, and it serves as the cell-entry receptor for
  several gammaretroviruses (gibbon ape leukaemia virus, feline leukaemia virus subgroup B and related
  viruses).'
