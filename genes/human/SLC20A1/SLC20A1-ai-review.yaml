- term:
    id: GO:0038023
    label: signaling receptor activity
  evidence_type: TAS
  original_reference_id: PMID:8041748
  qualifier: enables
  review:
    summary: "'signaling receptor activity' corrected to virus receptor activity."
    action: MODIFY
    reason: Lateral correction. PiT proteins are documented gammaretroviral cell-entry receptors, 
      not signalling receptors; 'signaling receptor activity' is the wrong molecular function. 
      Replace with virus receptor activity (GO:0001618), a non-core incidental activity hijacked by 
      the virus. Supported by the curated UniProt (Microbial infection) FUNCTION.
    supported_by:
    - reference_id: file:human/SLC20A1/SLC20A1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: May function as a retroviral receptor
    proposed_replacement_terms:
    - id: GO:0001618
      label: virus receptor activity
