  evidence_type: HMP
  original_reference_id: PMID:12761501
  qualifier: involved_in
  review:
    summary: Reported positive regulation of NF-kB (HMP; peripheral).
    action: KEEP_AS_NON_CORE
    reason: 'From a high-throughput mutant-phenotype screen (HMP): PiT1 perturbation was reported to affect
