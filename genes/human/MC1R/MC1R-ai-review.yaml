id: Q01726
gene_symbol: MC1R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MC1R (melanocortin 1 receptor) is a class A seven-transmembrane G protein-coupled receptor
  of the plasma membrane, expressed mainly in epidermal melanocytes and also in some immune cells. It
  binds the POMC-derived peptides alpha-, beta- and gamma-MSH and ACTH, couples to Gs to activate adenylate
  cyclase and cAMP/PKA signalling, and thereby drives melanogenesis and the switch from red/yellow pheomelanin
  to photoprotective black/brown eumelanin. Its signalling is antagonised by agouti signalling protein
  and modulated by MRAP/MRAP2, OPN3 and MGRN1. MC1R is highly polymorphic; loss-of-function variants that
  impair ligand coupling or cell-surface trafficking cause red hair, fair skin, poor tanning and increased
  melanoma and skin cancer risk, and MC1R signalling also enhances UV DNA damage repair.
