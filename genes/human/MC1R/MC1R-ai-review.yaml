suggested_questions:
- question: What fraction of wild-type MC1R resides intracellularly versus at the cell surface in human
    melanocytes, and is OPN3 heterodimerization regulated by this partitioning?
- question: Does MC1R signal via non-cAMP effectors (e.g. PLC, PI3K/AKT) in human melanocytes in a physiologically
    meaningful way?
suggested_experiments:
- description: Quantify surface versus total MC1R with extracellular-epitope antibodies and surface biotinylation
    in primary human melanocytes expressing wild-type and RHC variants, combined with BRET-based Gs and
    Gq activation assays.
