    supporting_text: A synthetic peptide (Asp-Leu-Ile-Glu-Glu-Ala-Ala-Ser-Arg-Ile-Val-Asp-Ala-Val-Ile-Glu-Gln-Val -Lys-Ala-Ala-Tyr) representing residues 493-515 encompasses the minimum region of Ht 31 required for RII binding and blocks anchoring protein interaction with RII as detected by band-shift analysis.
  - reference_id: PMID:15229649
    supporting_text: Elevation of the cellular concentration of cAMP activates the PKA holoenzyme anchored to AKAP-Lbc, which phosphorylates the anchoring protein on the serine 1565. This phosphorylation event induces the recruitment of 14-3-3, which inhibits the Rho-GEF activity of AKAP-Lbc.
- description: Scaffolds multi-tier mitogen-activated protein kinase modules—specifically PKNalpha-MLTK-MKK3-p38alpha downstream of alpha1-adrenergic receptors and KSR1-RAF-MEK1/2-ERK1/2—to promote spatially compartmentalized p38alpha and ERK1/2 activation.
