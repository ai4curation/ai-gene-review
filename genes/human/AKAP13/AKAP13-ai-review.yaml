      corrected_value: GO:0005085
      corrected_label: guanyl-nucleotide exchange factor activity
      cause: PRACTICE_CHANGE
      confidence: CONFIRMED
      explanation: Affinage constrains molecular_activity to coarse goslim_generic terms, omitting AKAP13's defining catalytic RhoGEF activity (GO:0005085) as well as GO:0051018 protein kinase A binding and GO:0005078 MAP-kinase scaffold activity.
      supported_by:
      - reference_id: PMID:25186459
