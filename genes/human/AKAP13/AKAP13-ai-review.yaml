    supporting_text: We now demonstrate that a longer transcript of the Lbc gene encodes a chimeric molecule, which we have called AKAP-Lbc, that functions as an A-kinase-anchoring protein (AKAP) and a Rho-selective guanine nucleotide exchange factor.
  - reference_id: PMID:25186459
    supporting_text: We have determined the X-ray crystal structure of the complex between RhoA-GDP and the AKAP-Lbc RhoGEF [DH (Dbl-homologous)-PH (pleckstrin homology)] domain to 2.1 Å (1 Å = 0.1 nm) resolution.
  - reference_id: PMID:29876405
    supporting_text: Here we present two crystal structures at resolutions of 1.4 Å and 2.0 Å of RhoA complexed with the PH domain from p114RhoGEF (PDB access code 6BCB) and AKAP-LbcRhoGEF (PDB access code 6BCA), respectively.
  - reference_id: file:human/AKAP13/AKAP13-deep-research-affinage.md
    supporting_text: AKAP13 (AKAP-Lbc) is a dual-function scaffold that simultaneously anchors protein kinase A (PKA) and acts as a Gα12-activated, RhoA-selective guanine nucleotide exchange factor (GEF), thereby coupling GPCR signaling to actin cytoskeleton remodeling and transcriptional reprogramming
- description: Anchors type II cAMP-dependent protein kinase (PKA) regulatory subunit dimers via its Ht31 amphipathic alpha-helix (residues 1246-1267), positioning PKA both to autoinhibit basal AKAP-Lbc RhoGEF activity via Ser1565 phosphorylation/14-3-3 recruitment and to phosphorylate co-anchored signaling substrates.
