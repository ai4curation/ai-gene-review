- id: file:human/AKAP13/AKAP13-deep-research-affinage.md
  title: Affinage mechanistic annotation for AKAP13 (human)
  findings:
  - statement: Synthesizes AKAP13's dual role as a type II PKA anchoring protein and Galpha12-coupled RhoA-selective GEF regulated by PKA/14-3-3 Ser1565 phosphorylation and C-terminal homo-oligomerization.
    supporting_text: AKAP13 (AKAP-Lbc) is a dual-function scaffold that simultaneously anchors protein kinase A (PKA) and acts as a Gα12-activated, RhoA-selective guanine nucleotide exchange factor (GEF), thereby coupling GPCR signaling to actin cytoskeleton remodeling and transcriptional reprogramming
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Passed all blocking trust gates (accession Q12802, human, self_evaluation_pairwise: win, faith_pct: 100.0, 31 citations). Strengths: accurate mechanistic synthesis across 31 primary papers covering PKA anchoring + Galpha12-coupled RhoA exchange (PMID:11546812, PMID:31051012), Ser1565/14-3-3 and leucine-zipper autoinhibition (PMID:15229649, PMID:15691829), PKCeta-PKD1-HDAC5 hypertrophic signaling (PMID:15383279, PMID:18951085), PKNalpha-MLTK-MKK3-p38alpha and KSR1-RAF-MEK-ERK scaffolding (PMID:21224381, PMID:21102438), the 2.1-angstrom DH-PH/RhoA-GDP crystal structure (PMID:25186459), and mouse cardiac/bone phenotypes (PMID:20139090, PMID:25892096). Weaknesses: (1) its goslim_generic molecular_activity profile omits GO:0005085 guanyl-nucleotide exchange factor activity, GO:0051018 protein kinase A binding, and GO:0005078 MAP-kinase scaffold activity in favor of generic slim terms GO:0060090 and GO:0098772; (2) by citing only PMID:25186459 on the PH domain (''with the PH domain dispensable for nucleotide exchange''), it misses the 2.0-angstrom PH/RhoA-GTPgammaS crystal structure (PDB 6BCA, PMID:29876405) and positive-feedback mechanism (PMID:24993829); (3) it omits founding Ht31 (PMID:1618839, PMID:11285229), Lbc (PMID:8290273, PMID:8910315, PMID:9891067), Brx (PMID:9627117), and IKKbeta/NF-kappaB (PMID:23090968) studies and lists conflicting mouse Akap13-null (PMID:20139090) and gene-trap (PMID:23658642) viability results without reconciling them.'
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: OTHER
      record: https://affinage.wi.mit.edu/api/gene/AKAP13
      slot: molecular_activity
      requested_change: ADD
