  evidence_type: IDA
  original_reference_id: PMID:21224381
  qualifier: enables
  review:
    summary: Direct biochemical demonstration that human AKAP-Lbc scaffolds PKNalpha, MLTK (ZAK), MKK3, and p38alpha into a functional MAPK signaling module.
    action: ACCEPT
    reason: Cariolato et al. (PMID:21224381) show by co-immunoprecipitation, mapping, and targeted disruption that AKAP-Lbc directly assembles PKNalpha, MLTK, MKK3, and p38alpha to drive alpha1b-adrenergic p38alpha activation, complementing KSR1-RAF-MEK-ERK scaffolding in PMID:21102438.
    supported_by:
    - reference_id: PMID:21224381
      supporting_text: Our results indicate that AKAP-Lbc can assemble a novel transduction complex containing the RhoA effector PKNα, MLTK, MKK3, and p38α, which integrates signals from α(1b)-ARs to promote RhoA-dependent activation of p38α.
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IDA
  original_reference_id: PMID:11546812
  qualifier: enables
  review:
    summary: Guanyl-nucleotide exchange factor activity (IDA, PMID:11546812), the founding catalytic function of AKAP13/Lbc toward RhoA.
    action: ACCEPT
    reason: 'AKAP13 (Lbc / AKAP-Lbc) is the founding member of the Lbc RhoGEF family: purified Lbc and recombinant AKAP-Lbc DH/PH (residues 1994-2333) selectively catalyze GDP-to-GTP exchange on RhoA over Rac1 and Cdc42 (PMID:8910315, PMID:11546812), and the 2.1-angstrom crystal structure of the AKAP-Lbc DH-PH/RhoA-GDP complex (PDB 4D0N, PMID:25186459) resolves the catalytic interface containing CR1 Glu2001 and CR3 Tyr2153. (Note that AKAP13 lacks a companion IBA row for GO:0005085 in GOA only because PAINT node PTN002677811 carries an erroneous IRD loss row audited in PTHR13944-review.yaml.)'
    supported_by:
    - reference_id: PMID:11546812
      supporting_text: We now demonstrate that a longer transcript of the Lbc gene encodes a chimeric molecule, which we have called AKAP-Lbc, that functions as an A-kinase-anchoring protein (AKAP) and a Rho-selective guanine nucleotide exchange factor.
    - reference_id: PMID:25186459
      supporting_text: The RhoGEF (Rho GTPase guanine-nucleotide-exchange factor) domain of AKAP-Lbc (A-kinase-anchoring protein-Lbc, also known as AKAP13) catalyses nucleotide exchange on RhoA and is involved in the development of cardiac hypertrophy.
