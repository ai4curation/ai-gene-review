  supporting_entities:
  - GO:0005078
  review:
    summary: Electronic GO-to-GO projection of generic MAPK cascade participation from GO:0005078 MAP-kinase scaffold activity.
    action: MODIFY
    reason: AKAP13 is a multikinase scaffold that assembles PKNalpha-MLTK-MKK3-p38alpha (PMID:21224381, PMID:23716597) and KSR1-RAF-MEK1/2-ERK1/2 (PMID:21102438) complexes to enhance p38alpha and ERK1/2 activation, rather than being a core MAPK enzyme itself. Refine to GO:0043410 positive regulation of MAPK cascade, which AKAP13 already carries.
    proposed_replacement_terms:
    - id: GO:0043410
      label: positive regulation of MAPK cascade
    supported_by:
    - reference_id: PMID:21224381
      supporting_text: Our results indicate that AKAP-Lbc can assemble a novel transduction complex containing the RhoA effector PKNα, MLTK, MKK3, and p38α, which integrates signals from α(1b)-ARs to promote RhoA-dependent activation of p38α.
    - reference_id: PMID:21102438
      supporting_text: AKAP-Lbc functions as an enhancer of ERK signalling by securing RAF in the vicinity of MEK1 and synchronizing protein kinase A (PKA)-mediated phosphorylation of Ser 838 on KSR-1.
