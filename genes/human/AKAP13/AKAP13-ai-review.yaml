id: Q12802
gene_symbol: AKAP13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AKAP13 (AKAP-Lbc; also known through shorter splice or oncogenic variants as Ht31, Lbc, and Brx) is a 2,813-residue chimeric signaling scaffold and Lbc-family Dbl-homology/pleckstrin-homology (DH/PH) guanine nucleotide exchange factor that integrates cAMP/PKA, heterotrimeric Galpha12, lipid-regulated kinase, and mitogen-activated protein kinase (MAPK) pathways with RhoA GTPase activation. Its central Ht31 amphipathic alpha-helix (residues 1246-1267) anchors dimeric type II PKA regulatory subunits with nanomolar affinity, while its C-terminal tandem DH/PH cassette (residues 1994-2333) selectively catalyzes GDP-to-GTP exchange on RhoA via its DH domain and binds activated RhoA-GTP via its PH domain as a positive-feedback amplifier. Basal RhoGEF activity is restrained in C-terminally homo-oligomerized cytosolic complexes when anchored PKA phosphorylates Ser1565 to recruit 14-3-3 proteins, whereas Galpha12-coupled GPCR agonists (including lysophosphatidic acid and alpha1-adrenergic ligands) engage a dedicated C-terminal Galpha12-binding domain to stimulate cortical RhoA signaling and actin stress fiber assembly. In parallel, AKAP13 nucleates multi-enzyme kinase modules—including PKNalpha-MLTK-MKK3-p38alpha, KSR1-RAF-MEK1/2-ERK1/2, PKCeta-PKD1, and IKKbeta—to coordinate cardiomyocyte hypertrophic gene expression, osteogenic differentiation, and cytoskeletal contractility.
