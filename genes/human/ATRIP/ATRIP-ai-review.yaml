    spectrum for ATR-ATRIP Seckel Syndrome.
  findings:
  - statement: Compound-heterozygous ATRIP mutations cause ATR-ATRIP Seckel syndrome.
    supporting_text: A nonsense mutational change in one ATRIP allele results in a C-terminal truncated
      protein, which impairs ATR-ATRIP interaction; the other allele is abnormally spliced.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; first ATRIP-deficient patient.
- id: PMID:24332808
  title: PRP19 transforms into a sensor of RPA-ssDNA after DNA damage and drives ATR activation via a
    ubiquitin-mediated circuitry.
  findings:
  - statement: PRP19 promotes ATRIP accumulation at damage sites.
    supporting_text: PRP19 facilitates the accumulation of ATRIP, the regulatory partner of the ataxia
      telangiectasia mutated and Rad3-related (ATR) kinase, at DNA damage sites.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; the source of the K63-polyubiquitin binding IDA.
  full_text_unavailable: true
