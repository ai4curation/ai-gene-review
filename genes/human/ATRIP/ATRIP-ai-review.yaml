id: Q8WXE1
gene_symbol: ATRIP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATRIP (ATR-interacting protein) is the obligate regulatory partner of the checkpoint kinase
  ATR. It forms a stable ATR-ATRIP heterodimer, and ATR and ATRIP are mutually required for each other's
  stability. Its N-terminal checkpoint recruitment domain binds RPA coated on single-stranded DNA, bringing
  ATR to stalled replication forks and resected DNA breaks. A TopBP1-interacting region is needed for
  TopBP1 to activate ATR. ATRIP is therefore essential for ATR-CHK1 checkpoint signalling in response
  to replication stress and DNA damage, and PRP19-dependent RPA ubiquitination promotes its accumulation
  at damage sites. Biallelic ATRIP mutation causes a Seckel syndrome-like disorder.
