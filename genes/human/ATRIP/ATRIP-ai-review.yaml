- id: PMID:12791985
  title: Sensing DNA damage through ATRIP recognition of RPA-ssDNA complexes.
  findings:
  - statement: ATRIP binding to RPA-ssDNA recruits ATR-ATRIP to DNA.
    supporting_text: The binding of ATRIP to RPA-coated ssDNA enables the ATR-ATRIP complex to associate
      with DNA and stimulates phosphorylation of the Rad17 protein that is bound to DNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:18519640
  title: TopBP1 activates ATR through ATRIP and a PIKK regulatory domain.
  findings:
  - statement: ATRIP's TopBP1-interacting region is needed for ATR activation.
    supporting_text: Here, we show that ATRIP contains a TopBP1-interacting region that is necessary for
      the association of TopBP1 and ATR, for TopBP1-mediated activation of ATR, and for cells to survive
      and recover DNA synthesis following replication stress.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
