suggested_questions:
- question: Should ATRIP's direct binding to RPA-coated ssDNA be captured as an MF (for example single-stranded
    DNA binding, or a specific RPA-complex binding term), given that yeast Ddc2/Lcd1 carries damaged DNA
    binding by IDA?
suggested_experiments:
- description: Measure binding of purified ATRIP N-terminal domain to RPA-ssDNA versus free ssDNA by fluorescence
    anisotropy, with checkpoint-recruitment-domain mutants, to define its direct DNA-binding contribution.
