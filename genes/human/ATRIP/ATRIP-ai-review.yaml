    label: DNA damage checkpoint signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR033349
  review:
    summary: DNA damage checkpoint signaling (IEA). ATRIP is required for ATR checkpoint signalling. It
      targets ATR-ATRIP to RPA-coated ssDNA and contains the TopBP1-interacting region needed for TopBP1
      to activate ATR. ATRIP knockdown abolishes checkpoint responses. Core process.
    action: ACCEPT
    reason: '[PMID:11721054 "Small interfering RNA directed against ATRIP caused the loss of both ATRIP
      and ATR expression and the loss of checkpoint responses to DNA damage."] [PMID:12791985 "The binding
      of ATRIP to RPA-coated ssDNA enables the ATR-ATRIP complex to associate with DNA and stimulates
      phosphorylation of the Rad17 protein that is bound to DNA."] [PMID:18519640 "Here, we show that
      ATRIP contains a TopBP1-interacting region that is necessary for the association of TopBP1 and ATR,
      for TopBP1-mediated activation of ATR, and for cells to survive and recover DNA synthesis following
      replication stress."]'
    supported_by:
    - reference_id: PMID:11721054
      supporting_text: Small interfering RNA directed against ATRIP caused the loss of both ATRIP and
        ATR expression and the loss of checkpoint responses to DNA damage.
    - reference_id: PMID:12791985
      supporting_text: The binding of ATRIP to RPA-coated ssDNA enables the ATR-ATRIP complex to associate
        with DNA and stimulates phosphorylation of the Rad17 protein that is bound to DNA.
    - reference_id: PMID:18519640
      supporting_text: Here, we show that ATRIP contains a TopBP1-interacting region that is necessary
        for the association of TopBP1 and ATR, for TopBP1-mediated activation of ATR, and for cells to
