- id: file:human/QTGAL/QTGAL-uniprot.txt
  title: UniProt entry Q67FW5 (QTGAL_HUMAN)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Function, Rhea reaction, kinetics and location from PMID:37992713. The FUNCTION text
      contains an apparent slip: it says ''Mannosylation of queuosine(34) in tRNA(Tyr)'' slows UAC elongation,
      where galactosylation is meant (tRNA(Tyr) carries galQ; mannosylation is QTMAN''s tRNA(Asp) reaction).
      That sentence is not used here.'
