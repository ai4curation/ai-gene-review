  findings:
  - statement: QTGAL galactosylates Q34 in tRNA(Tyr); reconstituted in vitro.
    supporting_text: Here, we biochemically identified two RNA glycosylases, QTGAL and QTMAN, and successfully
      reconstituted Q-glycosylation of tRNAs using nucleotide diphosphate sugars.
  - statement: galQ slows elongation at UAC codons and suppresses readthrough.
    supporting_text: Ribosome profiling of knockout cells revealed that Q-glycosylation slowed down elongation
      at cognate codons, UAC and GAC (GAU), respectively.
  reference_review:
