id: Q67FW5
gene_symbol: QTGAL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: QTGAL (queuosine-tRNA galactosyltransferase; formerly B3GNTL1) is a cytoplasmic glycosyltransferase
  of the GT2 family. It transfers galactose from UDP-galactose to the cyclopentene hydroxyl of queuosine
  at the wobble position 34 of tRNA(Tyr), forming galactosyl-queuosine (galQ). Its paralog QTMAN mannosylates
  queuosine in tRNA(Asp). In knockout cells, loss of galQ accelerates ribosome elongation at UAC codons
  and increases stop codon readthrough. Zebrafish qtgal mutants show reduced post-embryonic growth.
