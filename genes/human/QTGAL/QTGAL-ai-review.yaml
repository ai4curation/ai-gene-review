suggested_questions:
- question: 'How does galQ at the wobble position slow decoding of UAC and suppress readthrough: by altering
    anticodon-codon geometry, or by recruiting factors to the ribosome?'
suggested_experiments:
- description: Compare decoding kinetics of Q34- and galQ34-tRNA(Tyr) in a reconstituted mammalian translation
    system, and analyse growth and proteome phenotypes of QTGAL-knockout mice.
