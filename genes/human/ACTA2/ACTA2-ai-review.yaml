- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:17464107
  qualifier: located_in
  review:
    summary: >-
      Second of three cytoplasm IDAs. Here alpha-SMA is explicitly the mesangial cell marker in a
      study of human glomerular development.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct and correctly evidenced, since the antibody stains the cytoplasm of mesangial cells,
      but GO:0005737 is the least specific location ACTA2 could be given. Kept, non-core. The same
      paper's developmental process term is treated differently below, because marker staining
      supports where the protein is and not what process it participates in.
    supported_by:
    - reference_id: PMID:17464107
      supporting_text: alpha-smooth muscle actin (alpha-SMA), a marker for mesangial cells
- term:
    id: GO:0072144
    label: glomerular mesangial cell development
  evidence_type: IEP
  original_reference_id: PMID:17464107
  qualifier: involved_in
  review:
    summary: >-
      Expression as a lineage marker read as involvement in a developmental process. The paper's
      own methods sentence says what the antibody was for.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The study stains fetal and infant kidney for a panel of markers and names alpha-SMA as the
      marker for mesangial cells; the appearance of alpha-SMA staining is the readout by which
      mesangial differentiation is scored. No perturbation of ACTA2 is performed and no
      developmental defect is attributed to it. IEP is the correct code for an
      expression-pattern-based annotation, so this is not a curation error, but an
      expression-pattern annotation to a developmental process asserts more than expression
      supports. Mesangial cells are smooth-muscle-like and do express ACTA2, so the row is marked
      over-annotated rather than removed. The parallel case from a different species and paper is
      GO:0072051 above.
    supported_by:
    - reference_id: PMID:17464107
      supporting_text: alpha-smooth muscle actin (alpha-SMA), a marker for mesangial cells
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:12355421
  qualifier: located_in
  review:
    summary: >-
      Third cytoplasm IDA, from a cyclooxygenase immunolocalisation study of the retina in which
      alpha-SMA marks vascular smooth muscle and pericytes.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct but minimally informative, like the other two cytoplasm rows. Querying by reference
      shows this paper carries GO:0005737 as 12 annotations over 6 distinct entities, which is the
      shape of a marker panel rather than of a localisation study - noting also that annotation
      counts and entity counts are different quantities and only the entity count bears on this.
- term:
    id: GO:0009615
    label: response to virus
  evidence_type: IEP
  original_reference_id: PMID:16548883
  qualifier: involved_in
  review:
    summary: >-
      Differential expression in one screen of EV71-infected rhabdomyosarcoma cells, which gave the
      same term to 20 different gene products.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The reference-projection check is decisive here. PMID:16548883 carries GO:0009615 for 20
      distinct entities, all by IEP, from a single microarray and 2-DE experiment. UniProt's own
      INDUCTION line for ACTA2 records the same fact in the register it belongs to, that the gene
      is up-regulated in response to enterovirus 71 infection, and that is a statement about
      transcript and protein abundance, not about participation in an antiviral process. The
      authors group the altered transcripts by category rather than by function, cytoskeletal
      components among them. IEP is the right code for what was observed, so the row is marked
      over-annotated rather than removed; the involved_in qualifier is what overstates it.
    supported_by:
    - reference_id: PMID:16548883
      supporting_text: 'Altered transcripts include those encoding components of cytoskeleton, protein
        translation and modification; cellular transport proteins; protein degradation mediators;
        cell death mediators; mitochondrial-related and metabolism proteins; cellular receptors and
        signal transducers.'
- term:
    id: GO:0005884
    label: actin filament
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P68133
  - UniProtKB:P68032
  - UniProtKB:P60709
  - UniProtKB:P63261
  review:
    summary: >-
      The gap this review exists to find. ACTA2 and ACTG2 are the only two of the six conventional
      human actins with no actin filament annotation of any kind, while ACTL8, whose filament
      interface is compatible at 11 of 38 positions, has one. ACTA2 is identical at all 38.
    action: NEW
    reason: >-
      GO:0005884 reaches human genes by IBA from three separate PANTHER nodes and from no node
      ancestral to all conventional actins. PTN002631586 feeds ACTB, ACTG1, ACTBL2, ACTL8 and the
      five POTE genes; PTN000748220 feeds ACTC1; PTN000233075 feeds ACTA1 - two single-gene nodes
      and the cytoplasmic clade. The two smooth-muscle actins fall between those clades and receive
      nothing, and a QuickGO query returns zero annotations to GO:0005884 or any of its descendants
      for either ACTA2 or ACTG2, while all four other conventional actins have at least one.
      Nothing about the protein justifies the exclusion. Scored on the 38 inter-protomer contact
      residues of PDB 6DJO chain C - the same structure, chain and 4.0 A cutoff used by the merged
      ACTL8 and ACTL10 analyses, with reproduction of ACTL8's committed tallies asserted in code
      for nine shared panel members before any number here is reported - ACTA2 is identical at 38
      of 38, matching ACTA1 and ACTC1 and exceeding ACTB and ACTG1 at 37 identical plus 1
      conservative. Every one of those five holds the term. Meanwhile ACTL8 at 11 of 38 compatible
      does hold it, through the beta-actin node whose membership the merged ACTL8 review argues is
      itself the defect. The disease genetics point the same way. Four AAT6 variants sit within 4 A
      of a neighbouring protomer, and R179, whose substitution causes multisystemic smooth muscle
      dysfunction, is 4.42 A across the strand, so the filament is not an abstraction for this gene
      but the structure its pathogenic alleles disrupt. Proposed here as ISS from the four
      conventional actins that already carry it, with two caveats on the mechanics. Those four
      donors are human PARALOGUES, not orthologues, and GO_REF:0000024 is worded for ortholog
      transfer - ISS on paralogy is permitted, but the reference text does not describe it, so a
      submitting curator may prefer a different reference, or an IBA once the tree is fixed. And
      PDB:6DJO is deliberately absent from supporting_entities: a structure is not a gene product
      and does not belong in a with/from, so the structural argument is carried by the file:
      reference into RESULTS.md instead. The durable fix in any case is not this ISS row but a
      PAINT edit asserting GO:0005884 at the conventional-actin ancestor, which would repair ACTA2
      and ACTG2 together and is raised in suggested_questions. Derived independently of, and in agreement with, the
      parallel ACTG2 review.
    supported_by:
    - reference_id: file:human/ACTA2/ACTA2-bioinformatics/RESULTS.md
      supporting_text: '| ACTA2 (human aortic smooth-muscle actin) - THIS GENE | 38 | 0 | 0 | 0 | 0 | 38 | 38/38 | 98.4 |'
    - reference_id: file:human/ACTA2/ACTA2-bioinformatics/RESULTS.md
      supporting_text: '| ACTL8 (human actin-like 8) - reviewed sibling, REMOVE verdict | 8 | 3 | 24 | 3 | 0 | 38 | 11/38 | 34.2 |'
- term:
    id: GO:0017022
    label: myosin binding
  evidence_type: IDA
  original_reference_id: PMID:26153420
  qualifier: enables
  review:
    summary: >-
      The interaction the gene exists for, and GOA does not record it. Smooth muscle myosin moves
      purified human smooth muscle alpha-actin filaments in an in vitro motility assay, and among
      the conventional human actins only ACTC1 and ACTA1 carry a myosin binding annotation.
