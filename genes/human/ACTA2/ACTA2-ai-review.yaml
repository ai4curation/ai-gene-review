- term:
    id: GO:0010628
    label: positive regulation of gene expression
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      A very general regulatory process attributed to a structural protein, transferred from one
      chicken antisense experiment that supplied five different terms.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor, chicken ACTA2 (P08023), is a true orthologue and holds an IDA, but querying every
      one of the five AgBase ISS rows on this gene returns the same single source, PMID:10633868,
      an antisense knockdown study of endothelial-mesenchymal transformation in chick
      cardiogenesis. One experiment supplying five human terms is not five findings, and this is
      the term among them with the weakest fit - alpha-SMA knockdown altering the expression of
      other genes during a transformation is a downstream consequence of dismantling the
      cytoskeleton, not evidence that ACTA2 is involved in positive regulation of gene expression.
      There is a real and interesting biology nearby, in that actin monomer levels control
      MRTF-A/SRF-dependent transcription, but that is a property of the G-actin pool acting on
      MRTF-A and it works in the NEGATIVE direction, so it does not rescue this term either.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:P08023
        source_label: chicken ACTA2 (377 aa, Swiss-Prot) - the true orthologue
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Holds GO:0010628 by IDA, but from PMID:10633868, the same single paper behind all five of
          this donor's AgBase-transferred terms.
- term:
    id: GO:0030027
    label: lamellipodium
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Ortholog transfer from a chicken IDA. Plausible for a migratory smooth-muscle-like cell, but
      a minor location for this isoform and one of five terms from a single paper.
    action: KEEP_AS_NON_CORE
    reason: >-
      Lamellipodia are built principally from branched beta/gamma-cytoplasmic actin nucleated by
      Arp2/3, not from smooth-muscle alpha-actin; but alpha-SMA-expressing myofibroblasts and
      transforming endothelial cells do migrate, and the chicken donor's IDA is a direct
      immunolocalisation in exactly such cells. Kept for that reason, non-core because it is a
      peripheral location for the isoform.
- term:
    id: GO:0030175
    label: filopodium
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Same chicken source and the same reasoning as the lamellipodium row - a real
      immunolocalisation in transforming cells, a peripheral location for this isoform.
    action: KEEP_AS_NON_CORE
    reason: >-
      Filopodia are bundled parallel actin, so the presence of a polymerisation-competent actin
      there is unsurprising, and the donor holds its own IDA. Non-core for the same reason as the
      lamellipodium row, and noted as one of five terms this single chicken paper supplies.
- term:
    id: GO:0044297
    label: cell body
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      The least informative of the five chicken-derived locations. Cell body is defined by contrast
      with cell projections, so it says only that the protein is also outside the projections.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term exists to separate the perikaryon from axons, dendrites and similar projections, and
      it is used almost entirely for neurons. Applied to a cell that also has the lamellipodium and
      filopodium annotations above, it is the residual compartment rather than a positive
      localisation finding. Kept because the chicken donor's IDA is real and the statement is not
      false, marked non-core.
- term:
    id: GO:0090131
    label: mesenchyme migration
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      The best-founded of the five chicken-derived terms - an antisense knockdown that blocked
      endothelial-mesenchymal transformation, so the donor's evidence is IMP rather than IDA.
    action: KEEP_AS_NON_CORE
    reason: >-
      Unlike the other four rows from PMID:10633868, this one rests on a perturbation. An antisense
      oligodeoxynucleotide against smooth-muscle alpha-actin inhibited endothelial-mesenchymal
      transformation during chick cardiogenesis, and QuickGO confirms the donor's evidence code for
      this term is IMP. It is a developmental process for a pleiotropic structural protein and is
      not what ACTA2 is for, so it is kept as non-core rather than as a core function.
- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:23533145
  qualifier: located_in
  review:
    summary: >-
      Detection in a bulk exosome preparation of close to 900 proteins. Actin is among the most
      frequent co-isolating proteins in every vesicle preparation ever reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The evidence code is honest about what was done - high-throughput direct assay, that is, mass
      spectrometry on a pooled preparation - and the reference carries 1046 GOA annotations, which
      exceeds one QuickGO page, so the distinct-entity count is reported as unavailable rather than
      guessed from a partial page. Even without that number, a nearly 900-protein inventory of
      urinary prostatic-secretion exosomes is a detection list. Marked over-annotated rather than
      removed because ACTA2 protein really is present in such preparations; what is not supported
      is that the exosome is a compartment where the protein functions. This row and the tear-fluid
      row below are the two observations that make the removal of the extracellular IBA lossless.
    supported_by:
    - reference_id: PMID:23533145
      supporting_text: The analysis workflow is summarized in Figure 1A, and in total, close to 900
        proteins were identified in the two EPS-urine exosome pools, representing the most comprehensive
        data for this clinically relevant fluid to date (Supplemental Table 2).
