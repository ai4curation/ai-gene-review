- description: >-
    Interacts with smooth muscle myosin as the actin half of the smooth muscle actomyosin motor.
    Purified human smooth muscle alpha-actin filaments are translocated by smooth muscle myosin in
    vitro, and the R258C disease variant degrades that interaction - slower translocation, and
    under load a failure to produce force in the presence of tropomyosin. GOA records no myosin
    binding for this gene.
