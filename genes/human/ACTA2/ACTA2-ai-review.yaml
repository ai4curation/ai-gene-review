suggested_questions:
- question: >-
    Should PAINT assert GO:0005884 actin filament at the conventional-actin ancestor in PTHR11937
    rather than at three separate sub-clade nodes? The term reaches human genes from
    PTN002631586 (ACTB, ACTG1, ACTBL2, ACTL8, POTEE/F/I/J/KP), PTN000748220 (ACTC1 alone) and
    PTN000233075 (ACTA1 alone), so ACTA2 and ACTG2 - the two smooth-muscle actins, both identical
    at all 38 filament protomer-interface positions - receive nothing, while ACTL8, compatible at
    11 of 38, receives it through the beta-actin node. PTN000748220 likewise confines GO:0017022
    myosin binding, GO:0033275 actin-myosin filament sliding and GO:0007015 actin filament
    organization to ACTC1 alone. One edit at the shared ancestor would repair both smooth-muscle
    actins together. Stated once here for both genes; the parallel ACTG2 review derived the same
    node set independently.
  experts:
  - GO PAINT curators for PTHR11937
  - GO cytoskeleton working group
- question: >-
    Asked in the other direction, which node's human reach is exactly the smooth-muscle pair, the
    answer is PTN004322804 - and the only term it gives ACTA2 and ACTG2 is GO:0005576
    extracellular region, from a single rat Acta2 seed whose own evidence for that exact term is
    itself an IBA. So PAINT has a node for precisely these two genes and uses it to place them
    outside the cell, while the terms unambiguously true of them sit on two single-gene nodes.
    Should PTN004322804's GO:0005576 assertion be withdrawn and the node reused for the
    smooth-muscle-specific terms instead?
  experts:
  - GO PAINT curators for PTHR11937
- question: >-
    PTHR11937 uses human ACTR2 (P61160) and ACTR3 (P61158) as two of the ten IBD seeds justifying
    GO:0005200 at PTN000940351, and separately IRD-negates GO:0005200 at PTN000233596 and
    PTN000233796, the ARP2 and ARP3 clades those same proteins seed. Both donors do carry their own
    IDA for the term, so this is not a question about either annotation individually; it is that
    the tree simultaneously uses Arp2/Arp3 evidence to license the term and exempts Arp2/Arp3 from
    it. Which of the two judgments should be revised?
  experts:
  - GO PAINT curators for PTHR11937
- question: >-
    Should ACTA2 and ACTG2 carry GO:0006939 smooth muscle contraction? Thirty human annotations
    across seventeen gene products carry it, including MYH11 and MYLK, but neither smooth-muscle
    actin does, so the ontology currently describes smooth muscle contraction with its myosin and
    its regulatory kinase but without its actin, even though the term's own definition turns on the
    actin/myosin ratio.
  experts:
  - GO muscle biology curators
  - UniProt human cardiovascular curators
- question: >-
    Is the loss of GO:0005524 ATP binding across most of the human actin family an intended
    consequence of retiring GO_REF:0000043? A QuickGO query returns zero human annotations from
    that reference, and ACTA2, ACTB, ACTG1 and ACTG2 now hold no ATP-binding annotation at all
    while retaining ATP hydrolysis activity. The same gap was reported for ACTR1A and ACTR10 in
    this campaign, so it affects the family rather than one gene.
  experts:
  - GOA/UniProt annotation pipeline maintainers
- question: >-
    Mouse Acta2's only protein kinase binding evidence is a single IPI with LRRK2 from a synaptic
    vesicle study (PMID:21307259), and that one annotation is transferred to human ACTA2 twice, by
    Ensembl Compara and by a ParkinsonsUK-UCL ISS. Neurons express beta/gamma-cytoplasmic actin
    rather than the smooth-muscle isoform. Can the isoform assignment be confirmed, and should the
    duplicate transfer be collapsed?
  experts:
  - ParkinsonsUK-UCL curators
  - Ensembl Compara GO projection maintainers
- question: >-
    Nine of ACTA2's fifty GOA rows are Reactome per-reaction exports of one statement, that the
    protein is a cytosolic participant. Would a single reaction-independent row, or a
    Reactome-pathway-level reference, represent the same information without inflating the record
