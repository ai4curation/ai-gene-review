- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Core molecular function. Actin's intrinsic ATPase is what makes the filament a dynamic
      polymer rather than a static one, and the donor is the pig skeletal actin on which the
      classical biochemistry was done.
    action: ACCEPT
    reason: >-
      The WITH/FROM token UniProtKB:P68137 resolves to Sus scrofa ACTA1, not to human ACTA1, which
      is worth stating because the accession is easily read as the human paralogue. Pig skeletal
      muscle is the standard preparation from which actin's ATPase was characterised, and QuickGO
      shows the donor carrying an EXP annotation for the term. UniProt's own CATALYTIC ACTIVITY
      block records the reaction with the same ECO:0000250 transfer from P68137. Structurally,
      ACTA2 retains all nineteen nucleotide-contacting positions of the beta-actin cleft, eighteen
      identical and one conservative, unchanged under a second substitution matrix, so nothing
      about this gene suggests the activity has been lost. Accepted as core. The complementary
      GO:0005524 ATP binding is absent from GOA and is proposed as a new row below.
    supported_by:
    - reference_id: file:human/ACTA2/ACTA2-bioinformatics/RESULTS.md
      supporting_text: '| `UniProtKB:P68137` | ACTA1 (P68137, Sus scrofa, 377 aa) | Swiss-Prot | EXPx1 |'
- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:18468998
  qualifier: part_of
  review:
    summary: >-
      The unnamed root of the complex branch, from a co-immunoprecipitation that assigned the same
      term to 36 different proteins. True of almost any protein and informative about none.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Querying the reference rather than the gene gives 53 annotations over 39 entities, of which
      GO:0032991 alone accounts for 36 entities. Applying the discriminator that distinguishes a
      projection from parallel curation, this is not a phenotype projection - the paper's
      functional term GO:0003073 stays on three entities, so the complex membership was curated per
      protein rather than spread from one experiment's conclusion. The objection is therefore not
      that the annotation is false but that it is vacuous. GO:0032991 is the top of the complex
      branch, no complex is identified, and the paper's subject is an alpha1D-adrenergic
      receptor/dystrophin signalosome in which ACTA2 is one co-purifying component. If the intended
      statement is that ACTA2 is part of the smooth muscle contractile apparatus, that is better
      carried by the structural and location terms this review accepts and proposes.
- term:
