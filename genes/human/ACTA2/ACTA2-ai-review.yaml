- description: >-
    Binds and hydrolyses ATP in the interdomain cleft, the reaction that makes the actin filament a
    dynamic polymer - nucleotide state along the filament governs subunit age, cofilin severing and
    the monomer-polymer equilibrium. ACTA2 retains all nineteen nucleotide-contacting positions of
    the beta-actin cleft. The disease alleles reach this site too, with Arg185 and Arg212 about
    4.2 A from the bound nucleotide, and the R258C protein shows exactly the dynamic defects
    expected of a filament whose turnover is disturbed.
