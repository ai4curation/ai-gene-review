- term:
    id: GO:0005604
    label: basement membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: The rat testis study does not resolve extracellular basement membrane versus closely
      apposed Acta2-positive cells sufficiently for a confident human transfer.
    action: UNDECIDED
    reason: The donor IDA is PMID:30476341. Its externally accessible Results describe staining
      around seminiferous-cord basement membranes and Acta2-expressing cells presumed to be
      peritubular myoid cells; its figure caption also describes basement-membrane deposition. These
      descriptions leave the cellular-versus-extracellular interpretation unresolved at the reported
      imaging resolution. The local cache lacks the full Results. Preserve uncertainty about this
      specific compartment without asserting that the rat curator confused cell adjacency with
      matrix incorporation.
    additional_reference_ids:
    - PMID:30476341
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:P62738
        source_status: UNRESOLVED
        comment: The donor IDA is genuine, but the exact cellular versus extracellular
          interpretation of PMID:30476341 remains unresolved after examining accessible primary
          Results and figure descriptions.
      - source_id: ensembl:ENSRNOP00000073101
        source_status: UNRESOLVED
        comment: Alternative database identifier for the same experimentally annotated donor; The
          donor IDA is genuine, but the exact cellular versus extracellular interpretation of
          PMID:30476341 remains unresolved after examining accessible primary Results and figure
          descriptions.
- term:
    id: GO:0006936
    label: muscle contraction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: The contractile contribution is best represented as smooth muscle contraction.
    action: MODIFY
    reason: Human wild-type ACTA2 filaments interact with smooth muscle myosin in the reconstituted
      assay of PMID:26153420, and ACTA2 disease and correction studies support a contractile role in
      smooth muscle cells. ACTA2 supplies the force-bearing actin polymer in this process. Replace
      the generic muscle-contraction term with GO:0006939. The rat donor annotation traces to
      PMID:11953441, whose accessible abstract concerns promoter regulation in osteoblasts; that
      source does not independently resolve the contractile assay, so the refinement rests on the
      human evidence.
    additional_reference_ids:
    - PMID:26153420
    - PMID:40378078
    - PMID:11953441
    supported_by:
    - reference_id: PMID:26153420
      supporting_text: In an in vitro motility assay, smooth muscle myosin moves R258C filaments
        more slowly than WT, and the slowing is exacerbated by smooth muscle tropomyosin.
    proposed_replacement_terms:
    - id: GO:0006939
      label: smooth muscle contraction
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:P62738
        source_status: UNRESOLVED
        comment: The rat donor and its PMID:11953441 provenance are resolved, but the primary
          contractile assay is not available in the abstract. Human ACTA2/myosin experiments
          independently justify the more specific process.
      - source_id: ensembl:ENSRNOP00000073101
        source_status: UNRESOLVED
        comment: Alternative database identifier for the same experimentally annotated donor; The
          rat donor and its PMID:11953441 provenance are resolved, but the primary contractile assay
          is not available in the abstract. Human ACTA2/myosin experiments independently justify the
          more specific process.
      failure_modes:
      - GRANULARITY_MISMATCH
