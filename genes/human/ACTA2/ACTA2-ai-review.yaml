core_functions:
- description: >-
    Polymerizes into force-bearing actin filaments and dynamic cytoskeletal arrays in smooth-muscle
    cells and contractile myofibroblast-like cells. This structural activity supports smooth-muscle
    contraction and cytoskeleton organization; context-dependent replacement by other actin
    isoforms can preserve some myofibroblast functions.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
  - id: GO:0006939
    label: smooth muscle contraction
  - id: GO:0007010
