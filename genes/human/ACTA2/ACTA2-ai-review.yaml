gene_symbol: ACTA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTA2 encodes alpha-smooth-muscle actin, a conventional actin isoform prominent in vascular smooth muscle
  and expressed in contractile myofibroblast-like cells. Its filaments interact with smooth-muscle myosin
  MYH11 to transmit contractile force, with contraction controlled through phosphorylation of the myosin
  regulatory light chain. Dynamic subcortical actin arrays also connect the extracellular matrix to the
  cytoskeleton and support changes in cell shape and movement. Profilin, cofilin and tropomyosin regulate
  its monomer pool, filament turnover and interactions with myosin. Its conserved nucleotide pocket binds
  ATP and supports the intrinsic ATPase cycle of actin. Pathogenic variants can disrupt filament stability,
  regulator interactions and smooth-muscle cell differentiation, causing thoracic aortic disease and other
  vascular disorders, including premature coronary disease, ischemic stroke and Moyamoya disease. Particular
  variants cause multisystem smooth-muscle dysfunction involving vascular, pupillary, urinary and gastrointestinal
  tissues.
