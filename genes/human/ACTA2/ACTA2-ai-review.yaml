    dark_aspect: RESIDUAL_SUBGAP
    boundary: >-
      That conventional actin hydrolyses ATP is firmly established, and ACTA2 retains all nineteen
      nucleotide-contacting positions of the beta-actin cleft with 18 identical and 1 conservative
      substitution, so the site is intact. What is missing is a number for this isoform.
    resolution: >-
      Steady-state and single-turnover Pi release on purified human ACTA2 monomer and filament
      alongside Sus scrofa ACTA1 under matched conditions, plus a nucleotide-exchange rate.
    significance: >-
