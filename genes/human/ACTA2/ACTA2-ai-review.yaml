- description: >-
    Supplies the contractile actin filaments of myofibroblasts and other smooth-muscle-like cells
    such as hepatic stellate cells, mesangial cells, pericytes and peritubular myoid cells, where
    ACTA2 is the canonical differentiation marker induced by TGF-beta. This role is real but
    non-exclusive - conditional deletion in cardiac fibroblasts is compensated by transcriptional
    upregulation of other actin isoforms, so ACTA2 is the isoform normally used rather than the
    only one capable of the job.
