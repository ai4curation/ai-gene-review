- term:
    id: GO:0001725
    label: stress fiber
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Ortholog transfer from a real rat Acta2 IDA, and one of the few location rows that describes
      where ACTA2 actually does its job.
    action: ACCEPT
    reason: >-
      The donor is rat Acta2 (P62738), a true one-to-one orthologue of the same length, and its own
      evidence for GO:0001725 is an IDA. Stress fibres are contractile actin-myosin bundles and are
      the structure alpha-SMA is used to visualise in myofibroblasts and cultured smooth muscle
      cells; GO:0001725 sits under GO:0097517 contractile actin filament bundle, which is exactly
      the right level for this protein. Noted for completeness rather than as an objection - the
      donor IDA comes from PMID:24204762, the same rat study that supplies four other Compara rows
      on this gene, so five human rows trace to one experiment, but this is the one of the five
      whose claim is a direct microscopic observation of where the protein is.
- term:
    id: GO:0005604
    label: basement membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Compara transfer of a rat IDA whose source is a fetal rat testis histology study, in which
      alpha-SMA marks the peritubular myoid cell layer that lies against the tubule basement
      membrane. Adjacency in a micrograph, not localisation to an extracellular matrix structure.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The orthology is sound - rat Acta2 is the true orthologue and does hold an IDA - so the
      defect is in what the source annotation means rather than in the transfer. The basement
      membrane is a sheet-like extracellular matrix assembly of laminin, collagen IV, nidogen and
      perlecan. ACTA2 is an intracellular protein with no signal peptide, and the peritubular myoid
      cells that alpha-SMA stains in testis sections are separated from the basement membrane by
      their own plasma membrane. Marked over-annotated rather than removed because the underlying
      immunostain is real and the confusion is one of resolution - unlike the GO:0005576 IBA
      above, which was removed because a second row already carried the same observation with the
      correct qualifier and the IBA added only an unsupported functional claim. Worth recording
      because it is easily over-generalised: this Compara row is specific to ACTA2. ACTG2 does not
      carry it, so basement membrane is not a smooth-muscle-actin-wide annotation the way the
      extracellular HDA rows are, and it must not be cited as if it were.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:P62738
        source_label: rat Acta2 (377 aa, Swiss-Prot) - the true orthologue
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Holds its own IDA for GO:0005604, from PMID:30476341, a fetal rat testis toxicology study
          in which alpha-SMA is the peritubular myoid cell marker.
      - source_id: ensembl:ENSRNOP00000073101
        source_label: Ensembl protein identifier for the same rat gene
        source_status: CIRCULAR_OR_REDUNDANT
        comment: The same entity as the UniProt token on this row, expressed in another namespace.
- term:
    id: GO:0006936
    label: muscle contraction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Right process, wrong granularity. ACTA2 is by definition the smooth-muscle isoform, and
      GO:0006939 smooth muscle contraction exists, is not obsolete, and is already carried by
      ACTA2's own contractile partner MYH11 - but by neither of the two smooth-muscle actins.
    action: MODIFY
    reason: >-
      The definition of GO:0006939 is written for exactly this protein - force generation "carried
      out by the actin/myosin complex activity", in a tissue distinguished by "the much higher
      actin/myosin ratio, the absence of conspicuous sarcomeres". Thirty human annotations across
      seventeen gene products carry it, including MYH11 and MYLK, and neither ACTA2 nor ACTG2 is
      among them, which leaves GO describing smooth muscle contraction with its myosin and its
      kinase but without its actin. The gene-specific justification does not come from the donor
      row - the rat Acta2 IDA behind this transfer is PMID:11953441, a study of transcriptional
      regulation of the alpha-SMA promoter in osteoblasts, which is thin support for involved_in
      muscle contraction of any kind. It comes from human data. The founding disease paper states
      the contractile mechanism directly, R179 substitutions produce decreased contractile function
      in the iris, bladder and gastrointestinal tract, and base-editing correction of R179H
      restores SMC function. Retaining the generic parent alongside would be redundant, so this is
      a replacement rather than an addition.
    proposed_replacement_terms:
    - id: GO:0006939
      label: smooth muscle contraction
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P62738
        source_label: rat Acta2 (377 aa, Swiss-Prot) - the true orthologue
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Holds GO:0006936 by IDA from PMID:11953441, an osteoblast promoter-regulation study. The
          transfer is legitimate but the donor cannot license the more specific term, which rests
          on human evidence instead.
      - source_id: ensembl:ENSRNOP00000073101
        source_label: Ensembl protein identifier for the same rat gene
        source_status: CIRCULAR_OR_REDUNDANT
        comment: The same entity as the UniProt token on this row.
    supported_by:
    - reference_id: PMID:17994018
      supporting_text: SMC contractile force requires cyclic interactions between SMC alpha-actin
        (encoded by ACTA2) and the beta-myosin heavy chain (encoded by MYH11).
- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Compara transfer of a rat Acta2 IDA for the same term the PAINT row above already carries.
      Correct, and independently evidenced at the donor.
    action: ACCEPT
    reason: >-
      Duplicates the IBA row in content but not in provenance - this one descends from rat Acta2's
      own IDA rather than from a phylogenetic inference, and it uses located_in where the IBA uses
      is_active_in. Both are true. Kept as core because localisation to the actin cytoskeleton is
      not incidental for this protein; it is the protein.
- term:
    id: GO:0019901
    label: protein kinase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: >-
      Compara transfer of a single mouse Acta2 IPI whose partner is LRRK2. The ISS row further down
      this record is the same inference from the same source, so the two rows are one line of
      evidence, not two.
    action: KEEP_AS_NON_CORE
    reason: >-
      Resolving the WITH/FROM gives mouse Acta2 (P62737), the true orthologue, whose own evidence
      for GO:0019901 is exactly one IPI, PMID:21307259, with the partner recorded as Q5S007, which
      is LRRK2. The term is more informative than bare protein binding and the partner is named, so
      it is worth keeping; it is non-core because a single co-precipitation with one kinase is
      peripheral to what ACTA2 does. One caveat is recorded rather than acted on - the paper is a
      synaptic-vesicle study, and the actin of neurons is overwhelmingly beta/gamma-cytoplasmic
      rather than the smooth-muscle isoform, so the isoform assignment is worth confirming. The
      curator read the full text and I have not, so the row stands.
- term:
    id: GO:0061870
    label: positive regulation of hepatic stellate cell migration
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Genuine rat IMP - Acta2 knockdown reduces motility of activated hepatic stellate cells - but
      a tissue-specific process for a protein whose role there is to be the filament.
    action: KEEP_AS_NON_CORE
    reason: >-
      The donor is rat Acta2 with an IMP from PMID:24204762, and the experiment is clean - three
      independent knockdown techniques, no effect on cytoplasmic actin isoform expression, reduced
      motility. Kept. Marked non-core for two reasons. It is one of five rat annotations that this
      single siRNA study supplies to ACTA2 through Compara, so it is not an independent line of
      evidence; and myofibroblast motility in liver injury is one instance of a general property,
      since ACTA2 provides contractile filaments in every smooth-muscle-like cell, rather than a
      liver-specific function.
    supported_by:
    - reference_id: PMID:24204762
      supporting_text: Inhibition of Acta2 using several different techniques had no effect on cytoplasmic
        actin isoform expression, but led to reduced cellular motility and contraction.
- term:
    id: GO:0061874
    label: positive regulation of hepatic stellate cell contraction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      The contraction half of the same rat knockdown experiment. Kept as non-core for the same
      reasons, with one general reservation recorded here for the whole group.
    action: KEEP_AS_NON_CORE
    reason: >-
      Same donor, same IMP, same paper as the migration row. The reservation worth stating once is
      that for a protein which supplies the contractile filament itself, "positive regulation of
      contraction" conflates executing a process with regulating it. GO's convention is to use
      positive regulation when knockdown reduces the process, so the rows follow practice and are
      kept; but the more accurate description of ACTA2's part is the structural one captured by
      GO:0005200 and the proposed smooth muscle contraction term.
- term:
    id: GO:0070374
    label: positive regulation of ERK1 and ERK2 cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      The weakest of the five terms transferred from the rat hepatic stellate cell study. The
      authors state the result as an association, and reduced ERK phosphorylation after losing a
      major structural protein is an expected downstream consequence rather than evidence of a
      signalling function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The measurement is a reduction in Erk1/2 phosphorylation in cells whose contractile
      cytoskeleton has been dismantled, and mechanotransduction through the actin cytoskeleton
      makes such a reduction the expected result of losing filaments, whatever protein supplied
      them. Reading it as ACTA2 positively regulating the ERK cascade attributes a signalling role
      to a structural protein on correlative evidence, and the authors' own wording is "was
      associated with". Marked over-annotated rather than removed - the observation is real and the
      cytoskeleton-to-MAPK link is well established, so the row is not false, only mis-attributed
      in kind.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:P62738
        source_label: rat Acta2 (377 aa, Swiss-Prot) - the true orthologue
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Holds GO:0070374 by IMP from PMID:24204762, one of five annotations that single study
          supplies. The paper reports the ERK change as an association, not as a tested mechanism.
      - source_id: ensembl:ENSRNOP00000073101
        source_label: Ensembl protein identifier for the same rat gene
        source_status: CIRCULAR_OR_REDUNDANT
        comment: The same entity as the UniProt token on this row.
    supported_by:
    - reference_id: PMID:24204762
      supporting_text: Additionally, Acta2 knockdown was associated with a significant reduction in
        Erk1/2 phosphorylation compared to control cells.
- term:
    id: GO:0071560
    label: cellular response to transforming growth factor beta stimulus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Transfer of a rat IEP recording TGF-beta1 induction of alpha-SMA in renal fibroblasts. Weak
      evidence code, but the underlying fact is one of the most reproduced observations about this
      gene.
    action: KEEP_AS_NON_CORE
    reason: >-
      The donor's evidence is IEP from PMID:17043753, so what is established is that ACTA2
      expression responds to TGF-beta, not that the protein participates mechanistically in the
      signalling pathway. That is nonetheless the correct reading of a response-to term, and
      TGF-beta-driven induction of alpha-SMA is the defining event of myofibroblast differentiation
      across kidney, liver, lung and lens. Non-core because it describes what regulates ACTA2
      rather than what ACTA2 does.
- term:
    id: GO:0072051
    label: juxtaglomerular apparatus development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Transfer of a rat IEP whose source is an in vitro differentiation of amniotic fluid stem
      cells into juxtaglomerular-LIKE cells. Marker expression in a culture model, not involvement
      in development of an organ structure.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Resolving the donor's own evidence gives one IEP from PMID:30645697. In that study alpha-SMA
      is a readout used to certify that the differentiated cells have acquired a
      juxtaglomerular-like phenotype; the juxtaglomerular apparatus itself is never formed, and no
      perturbation of Acta2 is performed. Juxtaglomerular cells are modified smooth muscle cells,
      so ACTA2 expression there is expected and correct, but expression in a cell type is not
      involvement in the development of the structure that cell type builds. The same reasoning is
      applied to GO:0072144 below, which comes from a different species and a different paper and
      fails in the same way.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:P62738
        source_label: rat Acta2 (377 aa, Swiss-Prot) - the true orthologue
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Its only evidence for the term is IEP from PMID:30645697, an in vitro stem-cell
          differentiation in which alpha-SMA is a phenotype readout.
      - source_id: ensembl:ENSRNOP00000073101
        source_label: Ensembl protein identifier for the same rat gene
        source_status: CIRCULAR_OR_REDUNDANT
        comment: The same entity as the UniProt token on this row.
- term:
    id: GO:2000491
    label: positive regulation of hepatic stellate cell activation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      The third IMP term from the rat hepatic stellate cell study, and the one whose claim sits
      furthest from what the study measured - the paper places Acta2 downstream of activation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The paper's own hypothesis sentence describes Acta2 as upregulated DURING stellate cell
      activation, and the knockdown assays reported (motility, collagen-lattice contraction and
      proliferation) were performed on cells already activated by liver injury. I could not find a
      measurement of whether Acta2 loss impairs activation itself. That said, the RGD curator read
      the full text and I have not, and a knockdown that blunts the activated phenotype is a
      defensible basis for this term, so the row is kept rather than downgraded. Non-core on the
      same grounds as the other two rows from this study.
    supported_by:
    - reference_id: PMID:24204762
      supporting_text: In this study, we hypothesized that Acta2, which is upregulated during stellate
        cell activation, has a critical functional role in stellate cell phenotypic behavior during
