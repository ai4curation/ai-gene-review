  experts:
  - Reactome-GO liaison curators
suggested_experiments:
- hypothesis: >-
    The four AAT6 substitutions that lie within 4 A of a neighbouring protomer (Y145C, R292G,
    T326N, T353N) impair filament assembly by a direct interface mechanism, whereas R258C and the
    other distant alleles act allosterically, as PMID:26153420 concluded for R258C.
  description: >-
    Express and purify each variant of human smooth muscle alpha-actin from a baculovirus or
    Pichia system, and compare critical concentration, elongation and depolymerisation rates,
    cofilin severing susceptibility and tropomyosin protection side by side with wild type and with
    R258C as the characterised allosteric comparator. A direct-interface mechanism should show
    assembly defects that scale with the loss of protomer contact and should be largely
    insensitive to the presence of tropomyosin, while an allosteric mechanism should reproduce the
    R258C pattern of altered cofilin and tropomyosin behaviour without a proportionate assembly
    defect.
  experiment_type: in vitro reconstitution and filament dynamics
- hypothesis: >-
    ACTA2 and ACTG2 filaments are functionally interchangeable in supporting myosin-driven
    contraction, and the tissue restriction of the two isoforms reflects expression rather than
    filament property - which would explain the cardiac fibroblast compensation in PMID:36007455.
  description: >-
    Reconstitute in vitro motility and loaded-ensemble force assays with purified human ACTA2 and
    ACTG2 filaments against smooth muscle myosin, with and without smooth muscle tropomyosin, and
    compare sliding velocity, force and duty ratio. Then swap the coding sequences at the
    endogenous loci in human iPSC-derived smooth muscle cells and test whether ACTG2 protein
    driven from the ACTA2 locus rescues contractility.
  experiment_type: in vitro motility plus isogenic locus swap
- hypothesis: >-
    Human ACTA2 hydrolyses ATP with kinetics that differ measurably from skeletal ACTA1, so the
    ISS transfer of GO:0016887 from Sus scrofa ACTA1 understates an isoform-specific property.
  description: >-
    Measure steady-state and single-turnover Pi release for purified human ACTA2 monomer and
    filament alongside Sus scrofa ACTA1 under matched conditions, and determine the nucleotide
    exchange rate on the monomer. This would replace a by-similarity catalytic activity with a
    direct measurement on the human smooth-muscle isoform and establish whether the two isoforms
    warrant separate kinetic description.
  experiment_type: enzyme kinetics
- hypothesis: >-
    The apparent extracellular localisation of ACTA2 - the removed is_active_in IBA, an HDA in
    tears and an HDA in urinary exosomes - reflects release from damaged or turning-over cells
    rather than any export route.
  description: >-
    Compare ACTA2 peptide abundance in conditioned medium from intact versus deliberately
    permeabilised smooth muscle cell cultures, normalised against an obligate cytosolic marker such
    as LDHA and against a genuinely secreted control. If the ACTA2-to-LDHA ratio is constant across
    conditions, the extracellular signal tracks cell lysis and none of the three extracellular
    rows describes a functional compartment.
  experiment_type: quantitative secretome proteomics
