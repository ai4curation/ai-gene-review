  review:
    summary: >-
      ACTA2 is annotated as hydrolysing ATP but not as binding it. The nucleotide cleft is intact,
      with 19 of 19 contact positions chemically compatible, and the pipeline that used to supply
      the term has been retired.
    action: NEW
    reason: >-
      UniProt carries both the ATP-binding and the Nucleotide-binding keywords for P62736 and GOA
      carries GO:0016887 ATP hydrolysis activity by ISS, yet a QuickGO query with goUsage=exact
      returns zero GO:0005524 rows for ACTA2. The likely cause is mechanical rather than
      biological. GO_REF:0000043, the Swiss-Prot keyword route, now returns zero human annotations
      of any kind, so the keyword no longer produces a GO row for any human protein. The gap is
      family-wide rather than gene-specific - ACTA1 retains the term by TAS and ACTC1 by IDA, while
      ACTA2, ACTB, ACTG1 and ACTG2 have none - which is worth stating because it means this is a
      pipeline artefact affecting a class, not a judgment about ACTA2. The site itself is intact.
      Mapping the 19 residues that contact ATP in PDB 2BTF chain A onto ACTA2 by alignment gives 18
      identical and 1 conservative substitution, no gaps, unchanged under BLOSUM45 with a different
      gap model. The donor needs care and the obvious choice is wrong: Sus scrofa ACTA1 (P68137)
      supplies the ATP hydrolysis ISS on this gene, but a QuickGO query shows it holds no
      GO:0005524 row and in fact no annotation anywhere under GO:0000166 nucleotide binding, so an
      ISS from P68137 would transfer an annotation the donor does not have. The ISS is therefore
      taken from human ACTC1 (P68032), which holds GO:0005524 by IDA from PMID:16611632 - a
      same-species conventional actin with direct experimental evidence, which is a stronger
      transfer than the cross-species one would have been - though ACTC1 is a PARALOGUE, so the
      same two caveats as the actin filament row apply: GO_REF:0000024 is worded for ortholog
      transfer, and PDB:2BTF is kept out of supporting_entities because a structure is not a gene
      product. This is
      the reciprocal of the case argued in the merged ACTR1A and ACTR10 reviews, which proposed the
      nucleotide term for the ligand actually observed in their structures. Here ATP rather than
      ADP is proposed because ACTA2 is a hydrolysis-competent conventional actin whose substrate is
      ATP, not a non-hydrolysing Arp for which the nucleotide is a structural cofactor.
    supported_by:
    - reference_id: file:human/ACTA2/ACTA2-bioinformatics/RESULTS.md
      supporting_text: '| ACTA2 (human aortic smooth-muscle actin) - THIS GENE | 18 | 1 | 0 | 0 | 0 | 19 | 19/19 | 94.1 |'
core_functions:
- description: >-
    Polymerises into the two-stranded helical thin filament of the smooth muscle contractile unit
    and is moved by smooth muscle myosin to generate force. This is the gene's defining activity.
    ACTA2 is the actin isoform of vascular smooth muscle cells, and its pathogenic alleles act by
    degrading filament behaviour - four of the AAT6 substitutions sit within 4 A of a neighbouring
    protomer and the multisystemic-disease residue Arg179 is 4.4 A across the strand.
