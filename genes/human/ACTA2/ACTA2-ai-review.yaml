existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      A phylogenetic inference that ACTA2 is ACTIVE in the extracellular region, from a node whose
      human reach is exactly the two smooth muscle actins and whose single seed holds only its own
      IBA for the term. Nothing is lost by removing it, because the extracellular detection is
      already recorded by two HDA rows with the correct located_in qualifier.
    action: REMOVE
    reason: >-
      Two separate facts, stated separately because merging them is what makes this row look
      defensible. First, who seeded the node. The GOA WITH/FROM on this row is two tokens,
      PANTHER:PTN004322804 and RGD:621676 - one tree node and exactly one gene product - so the
      node's single seed, rat Acta2, is readable directly from the annotation, and QuickGO's raw
      withFrom carries the same two entries with their source databases named. The cached PTHR11937
      PAINT export says the same thing independently, recording the IBD at PTN004322804 with the
      single seed RGD:621676. Second, and this is the substantive point rather than a restatement
      of the first: that seed is ALSO a co-recipient. Rat Acta2 carries the identical GO:0005576
      IBA row from this same node, and querying its own evidence for the exact term returns that
      IBA and nothing else - so the input to the inference is an instance of the inference, and
      there is no experimental annotation to GO:0005576 itself anywhere in the chain. Two things must be kept apart here,
      because merging them produces a plausible but wrong account. Rat Acta2 does hold one
      experimental annotation under GO:0005576 - a GO:0005604 basement membrane IDA - but that is a
      different term and it reaches human ACTA2 by an Ensembl Compara route (the GO:0005604 row
      reviewed below), not through PAINT; whether the PAINT curator generalised it upward into this
      IBD is not recorded anywhere and is a reconstruction rather than a fact. Against the IBA,
      ACTA2 has no signal peptide and no secretory route, and is_active_in is the strongest
      cellular-component qualifier available - it asserts that the protein performs its function
      there, which a cytosolic polymerising actin cannot. Querying the node in the other direction
      is what settles it: PTN004322804's entire human reach is two annotations, ACTA2 and ACTG2,
      both to GO:0005576, so this node exists to place precisely the two smooth muscle actins
      outside the cell on one rat inference. I first wrote MARK_AS_OVER_ANNOTATED on the ground
      that ACTA2 protein really is detected extracellularly. That ground does not survive checking,
      because the detections are already carried by this gene's own two HDA rows to GO:0005576 and
      GO:0070062 under located_in - the correct, weaker qualifier - so removing the IBA deletes the
      unsupported functional claim and keeps every observation. A parallel review of ACTG2 reached
      REMOVE independently; I verified that ACTG2 has the identical pair of HDA references, so the
      two genes have the same evidence and a split verdict between the reviews would have been a
      defect rather than a difference.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN004322804
        source_label: PANTHER tree node carrying the extracellular region IBD
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          A single-seed node, not a gene product. Its entire human reach is two IBA annotations,
          ACTA2 and ACTG2, both to GO:0005576.
      - source_id: RGD:621676
        source_label: rat Acta2 (P62738, Rattus norvegicus, 377 aa, Swiss-Prot)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The sole seed. QuickGO with goUsage=exact returns one row for GO:0005576 on this donor
          and its evidence code is IBA, so the donor cannot supply experimental support.
    supported_by:
    - reference_id: file:human/ACTA2/ACTA2-bioinformatics/RESULTS.md
      supporting_text: '| `RGD:621676` | Acta2 (P62738, Rattus norvegicus, 377 aa) [3 candidates] | Swiss-Prot | IBAx1, IDAx1 |'
- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Core localisation, and the best-supported row in the record - 24 protein donors spanning
      fungi, amoebae, apicomplexans, nematodes, insects, birds and mammals, every one of which
      carries its own IDA for the term.
    action: ACCEPT
    reason: >-
      The WITH/FROM field carries 25 tokens, one PANTHER node and 24 gene products. Every resolved
      donor was queried for its own evidence on GO:0015629 and its descendants, and all 24 return
      at least one IDA. Two of the 24 are unreviewed TrEMBL entries (Candida ACT1, C. elegans
      act-5), which is recorded rather than hidden, but both still carry their own IDA, and the
      remaining 22 are Swiss-Prot. Three of the donors are ACTA2 orthologues in their own right
      (rat Acta2, mouse Acta2, chicken ACTA2). The is_active_in qualifier is right - the functional
      form of ACTA2 is the filament, and the filament is the actin cytoskeleton.
    supported_by:
    - reference_id: file:human/ACTA2/ACTA2-bioinformatics/RESULTS.md
      supporting_text: '**GO:0015629 actin cytoskeleton** (cellular_component, IBA, is_active_in, GO_REF:0000033, assigned by GO_Central) — 25 token(s)'
- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The row this family's reviews keep having to adjudicate, and for ACTA2 it is correct. PAINT
      asserts GO:0005200 once in PTHR11937 and has since negated it at eight descendant nodes;
      ACTA2 is in the retained set, and ACTA2 is chemically perfect at all 38 filament
      protomer-interface positions.
    action: ACCEPT
    reason: >-
      Three independent checks, all computed rather than inherited. First, the census. The term is
      asserted exactly once in PTHR11937, at PTN000940351, and IRD-negated at eight descendant
      nodes, none of which contains ACTA2. Ten human genes still receive it from that node - ACTA1,
      ACTA2, ACTC1, ACTG2, which are the four MUSCLE actins, plus ACTR10, ACTL9, ACTL10, ACTRT1,
      ACTRT2 and ACTRT3. Note what this corrects. The cytoplasmic actins ACTB and ACTG1 receive no
      IBA at all. They hold the term by other routes, ACTB by TAS (PMID:6202424) and ACTG1 by IC
      from GO:0005856 (PMID:16130169), and ACTB receives no IBA because it is itself one of the ten
      IBD seeds. Second, the seeds. Eight of the ten carry their own experimental evidence for the
      exact term - yeast ACT1, ARP1 and ARP10, human ACTR2 and ACTR3, mouse Actg1, and two
      Dictyostelium actins. The two that do not are ACTB, which holds only TAS, and rat Actg1,
      which holds only ISO. Third, the structure. Scored on the 38 inter-protomer contact residues
      of PDB 6DJO chain C, using the same structures and cutoffs as the merged ACTL8 and ACTL10
      analyses and asserting reproduction of ACTL8's committed numbers for nine shared panel
      members, ACTA2 is identical at 38 of 38 - equal to ACTA1 and ACTC1, better than ACTB and
      ACTG1 at 37 plus 1 conservative, and far above the divergent members the same node feeds,
      with ACTRT1 at 21 of 38 and ACTL8 at 11 of 38. Unchanged under BLOSUM45 with a different gap
      model. So the divergent-gene scepticism that governs ACTL8 and ACTL10 does not transfer here;
      for ACTA2 the term is the gene's defining molecular function. The one defect found is in the
      tree rather than in this row, and is raised in suggested_questions - two of the ten seeds,
      human ACTR2 and ACTR3, lie inside clades (PTN000233596 and PTN000233796) where PAINT has
      IRD-negated the very term they help justify.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
