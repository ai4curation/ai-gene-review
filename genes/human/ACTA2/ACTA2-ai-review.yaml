id: P62736
gene_symbol: ACTA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTA2 encodes smooth muscle alpha-actin (alpha-SMA), the actin isoform of vascular smooth
  muscle cells and of myofibroblasts. Like all conventional actins it is a 42 kDa ATP-binding
  protein that cycles between a globular monomer and a two-stranded helical filament, and the
  filament it builds is the thin filament of the smooth muscle contractile unit: force is
  generated by cyclic interaction between these filaments and smooth muscle myosin (MYH11),
  regulated through myosin light-chain kinase rather than through a troponin-tropomyosin switch.
  Filament turnover is driven by the protein's own intrinsic ATP hydrolysis and is modulated by
  profilin, cofilin, tropomyosin, formins and the CCT chaperonin that folds the nascent monomer.
  Beyond the contractile apparatus proper, ACTA2 filaments form stress fibres and contractile
  bundles in myofibroblasts, where the protein is the canonical differentiation marker, and in
  pericytes, mesangial cells and other smooth-muscle-like cells throughout the body. Heterozygous
  missense variants act largely by dominant-negative and allosteric effects on filament
  behaviour and cause familial thoracic aortic aneurysm and dissection, Moyamoya disease,
  premature coronary artery disease and stroke, and - for substitutions at Arg179 - a
  multisystemic smooth muscle dysfunction syndrome affecting the aorta, cerebral vasculature,
  iris, bladder and gut.
