- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Correct but redundant - the parent of the actin cytoskeleton rows ACTA2 already holds by IBA
      and by Compara. Derived mechanically from UniProt's SUBCELLULAR LOCATION "Cytoplasm,
      cytoskeleton".
    action: KEEP_AS_NON_CORE
    reason: >-
      GO:0005856 is an ancestor of GO:0015629, which ACTA2 holds twice. The row adds no information
      that the more specific rows do not already carry, but it is the product of a deliberately
      conservative keyword-mapping pipeline rather than an over-reach, and its input
      (UniProtKB-SubCell:SL-0090) is correct. Kept, marked non-core as the general parent.
- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Inter-ontology inference from GO:0005200, and therefore exactly as sound as the molecular
      function it is derived from - which this review accepts.
    action: ACCEPT
    reason: >-
      The WITH/FROM token is the GO term GO:0005200, not a gene product. This is the logical
      inference that a structural constituent of the cytoskeleton is involved in organising it.
      Since the GO:0005200 row is accepted above on structural and phylogenetic grounds, the
      derived process term follows. The term is general because the inference rule is general -
      GO:0005200 covers tubulins, lamins, intermediate filaments and spectrin-family proteins as
      well as actins, so the rule cannot know to say actin cytoskeleton organization. That is the
      rule working correctly rather than a granularity defect, and the gene-specific process term
      is supplied separately by the smooth muscle contraction replacement proposed below.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:P11684
  review:
    summary: >-
      BioPlex 2.0 AP-MS hit with SCGB1A1 (uteroglobin), a 91-residue secreted protein.
      Topologically incompatible with cytosolic F-actin, and bare protein binding tells a reader
      nothing in any case.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      SCGB1A1 resolves to a reviewed canonical Swiss-Prot entry of the expected length, so this is
      not the ACRV1 failure of a truncated ORFeome clone standing in for a real partner; the
      objection is compartmental and methodological. UniProt places SCGB1A1 in the Secreted
      compartment, so it never encounters cytosolic actin in an intact cell. IntAct holds 320
      interactions for P62736, of which 275 are logged as anti tag coip and 172 of 239 partners are
      singletons - the signature of actin as a high-abundance AP-MS background protein rather than
      of a curated partner set. The two references supporting this partner are BioPlex 2.0 and
      BioPlex 3.0, which are two releases of one AP-MS programme, not two methods. Not REMOVE - the
      pull-down was real, and the row is a true statement about a lysate.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:P17900
  review:
    summary: >-
      BioPlex 2.0 AP-MS hit with GM2A, the ganglioside GM2 activator, a lysosomal-lumen protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Same argument as the SCGB1A1 row - a reviewed canonical accession of normal length, but
      UniProt places GM2A in the Lysosome, on the far side of a membrane from cytosolic actin.
      Recovered by the same single AP-MS method in two releases of the same programme.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N4U5
  review:
    summary: >-
      BioPlex 2.0 AP-MS hit with TCP11L2. Compartmentally plausible - UniProt places it in the
      cytoplasm and cytoskeleton - but the term carries no information.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Judged per partner rather than per gene, this is the strongest of the five. TCP11L2 is
      cytosolic and cytoskeleton-associated, so an interaction is not topologically excluded. It is
      still marked over-annotated because bare GO:0005515 says nothing about what ACTA2 does, and
      the evidence remains one AP-MS method reported in two releases with no orthogonal assay and
      no functional consequence tested. Replacing it would need a more informative molecular
      function, and nothing in the literature supplies one for this pair.
