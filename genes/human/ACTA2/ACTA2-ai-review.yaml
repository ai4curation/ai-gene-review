- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: HDA
  original_reference_id: PMID:23580065
  qualifier: located_in
  review:
    summary: >-
      Tear-fluid shotgun proteomics. The reference carries this term for 95 entities, every one by
      HDA - a detection inventory, not a localisation finding.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Querying by reference instead of by gene gives 95 annotations over 95 distinct entities, all
