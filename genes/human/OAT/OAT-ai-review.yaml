  label: Homo sapiens
description: >-
  Ornithine aminotransferase (OAT; EC 2.6.1.13) is a nuclear-encoded, mitochondrial matrix, pyridoxal 5'-phosphate-dependent
  enzyme that reversibly transfers the delta-amino group of L-ornithine to 2-oxoglutarate, forming L-glutamate
  5-semialdehyde and L-glutamate. The semialdehyde interconverts spontaneously with pyrroline-5-carboxylate,
  linking ornithine and arginine degradation to glutamate and proline metabolism. Its functional catalytic
  unit is a homodimer; recombinant human protein exhibits a tetramer–dimer equilibrium, while crystal structures
  also show hexameric assemblies. Net reaction direction depends on tissue, developmental stage and substrate
  supply. Ornithine degradation is prominent in many adult tissues, whereas intestinal ornithine synthesis
  supports citrulline and arginine production, particularly during early development. Biallelic loss of function
  causes gyrate atrophy of the choroid and retina, usually with hyperornithinemia after infancy.
