core_functions:
- description: >-
    PLP-dependent ornithine delta-aminotransferase in the mitochondrial matrix. It reversibly converts L-ornithine
    plus 2-oxoglutarate to L-glutamate 5-semialdehyde plus glutamate; the semialdehyde/P5C pool can feed proline
    synthesis or ALDH4A1-mediated oxidation to glutamate. Forward flux contributes to arginine/ornithine catabolism,
    while intestinal reverse flux supports ornithine and citrulline synthesis in a tissue- and development-dependent
    manner. The catalytic unit is a dimer; a fixed hexamer is not required by the direct human biochemical
    evidence.
