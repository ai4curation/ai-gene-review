- id: PMID:23076989
  title: Functional analysis of missense mutations of OAT, causing gyrate atrophy of choroid and retina.
  findings:
  - statement: >-
      The study describes OAT as homohexameric and finds loss of activity, instability or assembly defects
      in disease mutants; later human solution/kinetic studies establish active dimers and tetramer–dimer equilibrium,
      so its assembly description is not a universal stoichiometric requirement.
    reference_section_type: ABSTRACT
    supporting_text: >-
      homoexameric enzyme ornithine-delta-aminotransferase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only source retained for mutant activity, localization and self-association. Its homohexamer
      interpretation is qualified by direct subsequent solution and kinetic evidence in PMID:28345116.
