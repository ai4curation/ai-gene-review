core_functions:
- description: Binds phosphorylated, light-activated rhodopsin on rod (and cone) outer segment disc membranes, occupying
    the transducin binding cavity, and so completes the quench of receptor activity and terminates the light response.
  molecular_function:
    id: GO:0030547
    label: signaling receptor inhibitor activity
  directly_involved_in:
  - id: GO:0016059
    label: negative regulation of opsin-mediated signaling pathway
  - id: GO:0036368
    label: photoresponse recovery
  locations:
  - id: GO:0097381
    label: photoreceptor disc membrane
  supported_by:
  - reference_id: PMID:9333241
    supporting_text: This behaviour indicates that an arrestin-independent mechanism initiates the quench of rhodopsin's
      catalytic activity and that arrestin completes the quench.
  - reference_id: PMID:3720866
    supporting_text: The protein was predominantly located to the proximal portion of the rod outer segment and
      appeared to be distributed on the disc membrane but not on the plasma membrane.
suggested_questions:
- question: Does human arrestin-1 bind spectrin, as the rat-derived electronic annotation implies, and if so in
    which compartment?
- question: Should GO provide a specific activity term for arrestin-type receptor inactivation (binding an activated
    phosphorylated GPCR to block G protein coupling), rather than generic receptor inhibitor or sequestering activity?
suggested_experiments:
- hypothesis: Human Oguchi missense alleles reduce binding to phosphorylated photoactivated rhodopsin rather than
    protein stability.
  description: Compare binding of purified wild-type and patient-variant human arrestin-1 to light-activated phosphorhodopsin,
    and measure thermal stability, in parallel.
status: COMPLETE
