id: P10523
gene_symbol: SAG
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: S-arrestin (arrestin-1, rod arrestin, retinal S-antigen) is a soluble, non-catalytic arrestin-family
  protein expressed at very high levels in rod photoreceptors and also in cones. After light-activated rhodopsin
  is phosphorylated by rhodopsin kinase (GRK1), arrestin-1 binds the phosphorylated, photoactivated receptor with
  high affinity, inserting into the cytoplasmic cavity that transducin uses, and so completes the quench of rhodopsin's
  catalytic activity and terminates the single-photon response. It is a peripheral protein of the outer segment
  disc membranes in light and redistributes to the inner segment and perinuclear region in darkness, by diffusion
  governed by its binding to photolysed rhodopsin and to microtubules. Arrestin-1 self-associates into dimers and
  tetramers; only the monomer binds rhodopsin. Biallelic loss of function causes Oguchi-type congenital stationary
  night blindness with greatly delayed rod recovery; it is also the uveitogenic retinal S-antigen.
