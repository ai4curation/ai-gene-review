core_functions:
- description: NCLX catalyses electrogenic exchange of matrix Ca2+ for a monovalent cation across
    the mitochondrial inner membrane, working in the efflux direction to clear calcium from the matrix.
    It is CGP-37157-sensitive, accepts Li+ as well as Na+, and assembles as a trimer with a conserved
    central Ca2+ site formed by Asp153 and Asp471. By setting how long matrix calcium stays elevated
    after an uptake event, NCLX converts calcium signals into changes in NAD(P)H and matrix redox
    state and feeds calcium back to the cytosol. The molecular function is given here at the counterion-neutral
    level (GO:0015368) because the identity of the exchanged monovalent cation is currently contested
    between Na+, Li+, K+ and H+; the calcium arm of the exchange, its direction, and its location
    are not in dispute.
  molecular_function:
    id: GO:0015368
    label: calcium:monoatomic cation antiporter activity
  directly_involved_in:
  - id: GO:0099093
    label: calcium export from the mitochondrion
  - id: GO:0006851
    label: mitochondrial calcium ion transmembrane transport
  - id: GO:0051560
    label: mitochondrial calcium ion homeostasis
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  - id: GO:0030061
    label: mitochondrial crista
  supported_by:
  - reference_id: PMID:20018762
    supporting_text: NCLX-mediated mitochondrial Ca(2+) transport was inhibited, moreover, by CGP-37157
      and exhibited Li(+) dependence, both hallmarks of mitochondrial Na(+)-dependent Ca(2+) efflux.
  - reference_id: PMID:24898248
    supporting_text: We conclude that NCLX, but not LETM1, mediates Ca(2+) extrusion from mitochondria.
  - reference_id: PMID:40931067
    supporting_text: These results demonstrate that NCLX is a Ca2+ transporter and highlight the
      functional importance of critical NCLX residues observed in the structures.
  - reference_id: PMID:42431881
    supporting_text: Although our study does not resolve this discrepancy, our structural and functional
      data demonstrate that NCLX possesses intrinsic Ca²⁺ exchange activity and likely remains an
      essential regulator of mitochondrial Ca²⁺ homeostasis.
suggested_questions:
- question: What is the physiological counterion for NCLX-mediated calcium efflux in intact mitochondria
    - Na+, Li+, K+, H+, or several of them? Fan et al. (PMID:40931067) find imposed Na+ and K+ gradients
    do not drive NCLX calcium transport, Zhang et al. (PMID:42431881) find that they do, and Ben-Kasus
    Nissim et al. (PMID:28130126) previously mapped separate Na+- and Li+-selective residues in the
    transport site. The three results cannot all be right.
- question: Why does sodium-dependent mitochondrial calcium efflux survive NCLX knockout in HeLa,
    CHO, HEK293 and HCT116 cells (PMID:40931067), when NCLX knockdown or knockout reduces mitochondrial
    calcium efflux in so many other systems? Is the residual activity TMEM65, a compensating transporter,
    or an assay difference?
- question: What is the physical and functional relationship between NCLX and TMEM65? TMEM65 co-purifies
    with NCLX and its effect on calcium efflux is lost in NCLX-null fibroblasts (PMID:40200126),
    yet purified TMEM65 alone is reported to reconstitute exchange without NCLX present (PMID:40691517).
- question: Both cryo-EM studies resolve NCLX as a trimer, contradicting the homodimer in the GO
    record. Is the trimer the functional unit in the inner membrane, and does it imply cooperativity
    or a shared ion pathway?
- question: Does NCLX contribute to the classical Na+-independent H+/Ca2+ exchange (NICE) of mitochondria,
    and if so is NICE the activity that its many loss-of-function phenotypes actually report?
suggested_experiments:
- description: Reconstitute purified NCLX into proteoliposomes with controlled internal and external
    ionic composition and measure Ca2+ flux against imposed Na+, Li+, K+ and pH gradients in the
    same preparation, so that the Fan and Zhang results are compared under identical conditions rather
    than across two heterologous expression systems.
- description: Record NCLX currents electrophysiologically in mitoplasts from wild-type and NCLX-knockout
    cells under defined Na+ and pH gradients, which would establish the counterion and the stoichiometry
    in the native membrane rather than in oocytes or HEK cells.
- description: Re-test the Na+- and Li+-selective residues identified in PMID:28130126 (N149, P152,
    N467, S468, G494) on the background of the new structures, mapping them onto the ion-binding
    pocket to determine whether they line a genuine monovalent site or act allosterically.
- description: Measure mitochondrial Na+-dependent calcium efflux in cells lacking NCLX, lacking
    TMEM65, and lacking both, in a tissue where both are expressed (cardiomyocytes or neurons), to
    determine whether the two proteins act in one pathway or two.
- description: Determine whether the trimeric assembly seen by cryo-EM exists in the native inner
    membrane, using in-cell crosslinking or native mass spectrometry of mitochondria, and test whether
    interface mutations that break the trimer abolish exchange.
