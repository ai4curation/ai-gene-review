- term:
    id: GO:0005432
    label: calcium:sodium antiporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Calcium:sodium antiport, the classical assignment for NCLX.
    action: MODIFY
    reason: 'The specific counterion in this term is what is now disputed, and the dispute is not
      resolved. Two 2025/2026 cryo-EM studies agree that NCLX lacks several of the serines that coordinate
      Na+ in canonical NCX proteins, but reach opposite functional conclusions: Fan et al. (PMID:40931067)
      report that imposed Na+ or K+ gradients do not drive NCLX Ca2+ transport and reassign it as
      a H+/Ca2+ exchanger, while Zhang et al. (PMID:42431881) report that Na+, K+ and Li+ all serve
      as counterions and call it a non-selective cation/Ca2+ exchanger. Against both, earlier mutagenesis
      mapped distinct Na+- and Li+-selective residues in the NCLX transport site (PMID:28130126),
      and the gene''s founding characterisation turned on its anomalous Li+/Ca2+ exchange (PMID:15060069).
      MODIFY rather than REMOVE or ACCEPT: none of the experimental annotations is discarded, and
      no single structure paper is allowed to overturn fifteen years of loss-of-function work. What
      changes is only the granularity - the annotation is moved up one step to its direct is_a parent
      GO:0015368 calcium:monoatomic cation antiporter activity, which is compatible with every reading
      on offer (Na+/Ca2+, Li+/Ca2+, K+/Ca2+ and H+/Ca2+) and which this gene already carries from
      Reactome. The over-specific part of GO:0005432 is precisely the part under challenge. Note
      also that Fan et al. share senior authors with PMID:40691517, which assigns mito-NCX to TMEM65;
      the two form one model rather than two independent challenges.'
    proposed_replacement_terms:
