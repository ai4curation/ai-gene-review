id: Q6J4K2
gene_symbol: SLC8B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Integral protein of the mitochondrial inner membrane, enriched in cristae, and the
  principal characterised route by which calcium is exported from the mitochondrial matrix into the
  cytosol. NCLX belongs to the Ca2+/cation antiporter (CaCA) superfamily and, within it, to the cation/calcium
  exchanger (CCX) branch rather than to the canonical plasma-membrane Na+/Ca2+ exchangers; it has
  roughly thirteen transmembrane helices, self-associates, and both published cryo-EM structures
  resolve it as a trimer. Its transport is blocked by CGP-37157 and, unusually among calcium exchangers,
  it accepts Li+ as well as Na+ as the counterion. By limiting the duration of matrix calcium elevations,
  NCLX couples calcium signalling to NAD(P)H production and matrix redox state, and its activity
  shapes cytosolic calcium transients; loss of NCLX causes matrix calcium overload, and in excitable
  tissue this drives cell death and organ failure. Downstream, NCLX activity influences glucose-stimulated
  insulin secretion in pancreatic beta cells, sustained store-operated calcium entry through Orai1,
  lymphocyte chemotaxis and cardiomyocyte physiology. The identity of the counterion is currently
  disputed: NCLX lacks several of the serine residues that coordinate Na+ in canonical Na+/Ca2+ exchangers,
  and recent structural studies variously conclude that it is a H+/Ca2+ exchanger, or a non-selective
  exchanger that can use Na+, K+, Li+ or protons, whereas earlier mutagenesis identified separate
  Na+- and Li+-selective residues in its transport site. Whether NCLX is also the protein responsible
  for sodium-dependent mitochondrial calcium efflux, or whether that activity belongs to TMEM65,
  is likewise unsettled.'
