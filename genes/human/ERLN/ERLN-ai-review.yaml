  review:
    summary: 'Proposed new annotation: by binding SERCA, endoregulin reduces the pump''s
      Ca2+ transport activity.'
    action: NEW
    reason: >-
      This is the process-level expression of the ATPase inhibitor activity, and
      endoregulin carries out the regulatory step itself by binding the pump. It is
      therefore a participant, not an upstream requirement. Mouse Q3U0I6 already carries
      this term (IDA, PMID:27923914, as acts_upstream_of_or_within), from oxalate-supported
      Ca2+ uptake assays. For human, the reconstitution assay with the purified human
      peptide (PMID:34445594) provides direct evidence. Comparator check: SLN carries this
      term by IDA and PLN carries its parent GO:1901894. Broader physiological processes
      (tissue Ca2+ signalling, epithelial function) are not proposed, because there are
      no loss-of-function data.
    additional_reference_ids:
    - PMID:27923914
    supported_by:
    - reference_id: PMID:34445594
      supporting_text: whereas ELN selectively alters the turnover rate (Vmax) of SERCA
        (Figure 7C)
    - reference_id: PMID:27923914
      supporting_text: Together, these findings reveal that vertebrates encode five
        structurally related transmembrane micropeptides that inhibit Ca2+ uptake by
        diverse SERCA isoforms.
core_functions:
- description: >-
    Endoregulin is a single-pass ER membrane micropeptide that binds the SERCA
    Ca2+-ATPase in its transmembrane regulatory groove (the phospholamban site) and
    inhibits it. This reduces Ca2+ pumping into the ER in the non-muscle epithelial and
    endothelial cells where it is expressed, mainly alongside SERCA3. Direct inhibition
    has been shown with the purified human peptide (reduced SERCA turnover) and with the
    mouse peptide in cells (reduced apparent Ca2+ affinity of SERCA3a/SERCA2b).
