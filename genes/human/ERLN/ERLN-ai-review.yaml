- term:
    id: GO:0042030
    label: ATPase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:34445594
  qualifier: enables
  review:
    summary: 'Proposed new annotation: endoregulin binds SERCA and directly inhibits its
      Ca2+-ATPase activity.'
    action: NEW
    reason: >-
      Human GOA has no molecular function for ERLN, although this is the defining
      activity of the gene. The strongest human evidence is PMID:34445594, in which
      recombinant human ELN co-reconstituted with purified SERCA1a in proteoliposomes
      lowered the pump's maximal turnover rate. A purified two-component system shows
      that the peptide itself performs the inhibition, so the participation test for an
      enzyme-regulator function is met: ELN is the regulator, not a substrate or an
      indirect requirement. Mouse data corroborate it (PMID:27923914): the mouse peptide
      co-immunoprecipitates with SERCA2b, is competed off by PLN (same binding groove),
      and lowers the apparent Ca2+ affinity of SERCA3a. The two studies differ in
      mechanism (a Vmax effect on SERCA1a versus a KCa effect on SERCA3a) and in isoform,
      but both show inhibition, and a later live-cell assay found that ELN lowers ER
      Ca2+ stores (PMID:39921961, abstract only). Comparator check: PLN carries
      GO:0042030 (IDA and IBA), and SLN carries the parent GO:0004857 enzyme inhibitor
      activity. The regulins standing in the same role therefore carry this term, and
      its absence from ERLN reflects how recently the gene was characterised, not a
      convention. GO:0042030 is chosen over GO:0141110 transporter inhibitor activity
      for consistency with PLN and because the assay read out ATPase turnover.
    additional_reference_ids:
    - PMID:27923914
    - PMID:39921961
    supported_by:
    - reference_id: PMID:34445594
      supporting_text: With the exception of MLN, recombinant human peptides were
        expressed as a maltose-binding protein (MBP) fusion
    - reference_id: PMID:34445594
      supporting_text: whereas ELN selectively alters the turnover rate (Vmax) of SERCA
        (Figure 7C)
    - reference_id: PMID:27923914
      supporting_text: All of the micropeptides formed a stable complex with Myc-SERCA2b,
        but not with the Myc-tag alone
    - reference_id: PMID:27923914
      supporting_text: coexpression of ALN or ELN caused a significant reduction in the
        apparent affinity for Ca2+ of SERCA2b and SERCA3a, respectively
