  review:
    summary: Electronic mapping of the UniProt subcellular location (ER membrane,
      single-pass), which UniProt bases on the mouse ortholog Q3U0I6.
    action: ACCEPT
    reason: >-
      Correct and appropriately specific. Endoregulin is a single-TM peptide whose only
      known partner is the ER-resident SERCA pump; the mouse peptide colocalises with
      SERCA2b in reticulated ER membranes (PMID:27923914). The location is a prerequisite
      of its core function (inhibition of SERCA within the ER membrane). No human
      experimental localisation study was found, but the human peptide is functional in
      reconstituted membranes with SERCA and interacts with other ER-resident regulins
      in cells (PMID:34445594, PMID:36523160), and the TM helix and binding motif are
      conserved.
