description: >-
  Endoregulin (ERLN, also known as ELN and SMIM6) is a 62-amino-acid single-pass
  transmembrane micropeptide of the endoplasmic reticulum membrane and a member of the
  regulin family of sarco/endoplasmic reticulum Ca2+-ATPase (SERCA) regulators that also
  includes phospholamban (PLN), sarcolipin (SLN), myoregulin (MRLN), another-regulin
  (ARLN) and DWORF (STRIT1). It has a short cytosolic N-terminal region, a C-terminal
  transmembrane helix carrying the conserved SERCA-binding motif, and a short luminal
  tail. Unlike the muscle regulins, it is expressed mainly in non-muscle epithelia and
  endothelia, where its distribution overlaps that of SERCA3. The peptide binds SERCA
  in the same transmembrane groove as phospholamban and inhibits the pump: the mouse
  peptide lowers the apparent Ca2+ affinity of SERCA3a and SERCA2b in cell homogenates,
  the purified human peptide lowers the maximal turnover rate of purified SERCA1a in
  reconstituted membranes, and its expression reduces ER Ca2+ stores in cultured cells.
  Endoregulin also forms homo-oligomers and hetero-oligomers with other regulins, while
  binding SERCA as a monomer. No loss-of-function phenotype or disease association has
  been reported.
