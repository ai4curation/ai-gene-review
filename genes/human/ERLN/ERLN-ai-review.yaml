- id: PMID:27923914
  title: Widespread control of calcium signaling by a family of SERCA-inhibiting micropeptides.
  findings:
  - statement: Endoregulin was identified in a mouse-genome screen for the SERCA-binding
      motif; the mouse peptide localises to the ER, binds SERCA2b competitively with PLN,
      and lowers the apparent Ca2+ affinity of SERCA3a.
    supporting_text: we used a bioinformatics approach to screen the mouse genome for
      potential open reading frames containing the SERCA binding motif of MLN, PLN, and
      SLN
  - statement: ELN is expressed mainly in non-muscle epithelia, overlapping SERCA3.
    supporting_text: ELN expression showed a large degree of overlap with that of SERCA3
      in the epithelial cells of the trachea and bronchus, lung, intestine, pancreas,
      and liver
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Anderson DM et al., Sci Signal 2016 Dec 6). Discovery
      paper and the source of the mouse Q3U0I6 IDA/IPI annotations that feed the human
      ISS row. All constructs are mouse (56-aa mouse ELN), expressed in COS-7 cells.
- id: PMID:34445594
  title: 'Nothing Regular about the Regulins: Distinct Functional Properties of SERCA
    Transmembrane Peptide Regulatory Subunits.'
  findings:
  - statement: Recombinant human ELN co-reconstituted with purified SERCA1a lowers the
      pump's Vmax without changing KCa.
    supporting_text: whereas ELN selectively alters the turnover rate (Vmax) of SERCA
      (Figure 7C)
  - statement: The reconstitution used SERCA1a rather than ELN's presumed physiological
      partner SERCA3a.
    supporting_text: It should be noted that our reconstitution system used SERCA1a,
      while the primary targets of ALN and ELN are SERCA2b and SERCA3a, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Rathod N et al., Int J Mol Sci 2021). A review article
      that also reports new primary data. It is the only direct functional evidence found
      for the human peptide (recombinant human peptide with purified rabbit SERCA1a), and
      its Vmax-type effect differs from the KCa-type effect reported for mouse ELN.
- id: PMID:31449798
  title: Newly Discovered Micropeptide Regulators of SERCA Form Oligomers but Bind to the
    Pump as Monomers.
  findings:
  - statement: ELN, like the other regulins, forms homo-oligomers but binds SERCA as a
      monomer.
    supporting_text: Micropeptides formed avid homo-oligomers with high-order
      stoichiometry (n > 2 protomers per homo-oligomer), but it was the monomeric form of
      all micropeptides that interacted with SERCA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Singh DR et al., J Mol Biol 2019). FRET and co-IP of
      SERCA with the micropeptides. The species of the ELN construct is not stated in the
      cached text. Source of UniProt's 'binds SERCA as a monomer' statement.
- id: PMID:36523160
  title: Micropeptide hetero-oligomerization adds complexity to the calcium pump regulatory
    network.
  findings:
  - statement: Human ELN forms hetero-oligomers with PLN, SLN, ALN and DWORF with
      affinities comparable to homo-oligomerisation.
    supporting_text: human sequences of all micropeptides (PLB, SLN, DWORF, ALN, and ELN)
      were labeled using either mCerulean or YFP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Phillips TA et al., Biophys J 2023). Human-sequence FRET
      study, cited by UniProt for the SUBUNIT comment. It shows oligomerisation among the
      regulins, not SERCA inhibition.
- id: PMID:39921961
  title: Rapid quantification of intracellular calcium stores reveals effects of membrane
    micropeptides on SERCA function.
  findings:
  - statement: ELN expression lowers ER Ca2+ content in live cells, less potently than
      PLN.
    supporting_text: Sarcolipin (SLN), endoregulin (ELN), and another-regulin (ALN) also
      decreased ER Ca2+ content, though less potently than PLB.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Cunningham JD et al., Cell Calcium 2025). Abstract
      only in the cache; the species of the ELN construct and the cell type are not stated
      in the abstract.
suggested_questions:
- question: >-
    Does endoregulin inhibit SERCA by lowering apparent Ca2+ affinity (as reported for
    mouse ELN with SERCA3a in cell homogenates) or by lowering Vmax (as reported for the
    human peptide with SERCA1a in proteoliposomes)? Is the difference due to species,
    SERCA isoform or assay system?
  experts:
  - Seth L Robia
  - Howard S Young
- question: >-
    Is endogenous human endoregulin protein detectable in the SERCA3-expressing epithelia
    and endothelia in which its mRNA is found, and does it co-purify with SERCA3 there?
  experts:
  - Douglas M Anderson
  - Eric N Olson
- question: >-
    Does hetero-oligomerisation with other regulins (for example SLN or DWORF) sequester
    endoregulin away from SERCA in cells that co-express them?
  experts:
  - Seth L Robia
suggested_experiments:
- hypothesis: Endogenous endoregulin tonically inhibits SERCA3 and limits ER Ca2+ stores
    in epithelial cells.
  description: >-
    Knock out ERLN in a human epithelial cell line that expresses SERCA3 (for example an
    airway or intestinal epithelial line) and measure ER Ca2+ content with an ER-targeted
    ratiometric indicator, and SERCA KCa/Vmax in microsomes. Rescue with wild-type versus
    TM-helix binding-motif mutant endoregulin.
- hypothesis: Human endoregulin inhibits its physiological partner SERCA3 by the same
    mechanism observed with SERCA1a.
  description: >-
    Co-reconstitute purified human endoregulin with purified human SERCA3a and SERCA2b and
    measure Ca2+-dependent ATPase activity, to resolve the KCa-versus-Vmax discrepancy
    between the mouse and human studies.
