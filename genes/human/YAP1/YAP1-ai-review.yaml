id: P46937
gene_symbol: YAP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'YAP1 (Yes-associated protein 1) is a transcriptional coactivator and the main nuclear effector
  of the Hippo signaling pathway. It has no DNA-binding domain. An N-terminal TEAD-binding domain lets
  it bind TEAD1-4 and form a hybrid transcription factor (TEAD supplies the DNA-binding domain, YAP1 the
  activation domain). Its WW domains bind PPxY motifs in partners such as p73, angiomotins, PTPN14, LATS
  kinases and WBP2, and a C-terminal transactivation region and PDZ-binding motif complete the protein.
  When the Hippo kinase cascade is active, LATS1/2 phosphorylate YAP1 on HXRXXS motifs: phospho-S127 binds
  14-3-3 and holds YAP1 in the cytoplasm, and a C-terminal phosphodegron targets it for SCF(beta-TrCP)-mediated
  degradation. Junctional and polarity proteins also sequester YAP1 according to cell density and mechanical
  cues. Nuclear YAP1-TEAD activates growth-promoting and anti-apoptotic genes (e.g. CTGF) at enhancers
  shared with AP-1. Through this program YAP1 promotes epithelial and progenitor proliferation, organ
  growth and regeneration, influences cell-fate choices such as osteogenic versus adipogenic differentiation,
  and drives oncogenic growth when deregulated. YAP1 also coactivates p73 proapoptotic genes after DNA
  damage. It is paralogous to WWTR1 (TAZ). Yorkie/YAP coactivators predate animals. The Capsaspora ortholog
  binds the Capsaspora TEAD ortholog and activates Hippo-responsive transcription in fly cells. In Capsaspora
  itself it controls cortical cytoskeletal dynamics and aggregate shape but not proliferation. This suggests
  that TEAD coactivation under Hippo-kinase control is ancestral, while control of proliferation and organ
  size was acquired in animals.'
