- id: PMID:22832104
  title: Premetazoan origin of the hippo signaling pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Capsaspora coYki/coSd/coHpo assayed in Drosophila cells and tissue; establishes ancestral
      TEAD-coactivator function. Full text cached.
  findings:
  - statement: Capsaspora Yorkie and Sd/TEAD together activate a Hippo-responsive reporter in fly cells.
    supporting_text: co-expression of Co-Sd and Co-Yki stimulated the transcription of the HRE-luciferase
      reporter in Drosophila S2R+ cells
- id: PMID:35659869
  title: Genome editing in the unicellular holozoan Capsaspora owczarzaki suggests a premetazoan role
    for the Hippo pathway in multicellular morphogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'coYki knockout in Capsaspora: cortical blebbing and altered aggregate shape, no proliferation
      phenotype. Evolutionary context for YAP1.'
  findings:
  - statement: The Capsaspora Yorkie ortholog regulates cortical cytoskeleton but not proliferation.
    supporting_text: we demonstrate that coYki regulates cytoskeletal dynamics at the cell cortex but
      is dispensable for the proliferation of Capsaspora cells
- id: PMID:38517944
  title: The Hippo kinase cascade regulates a contractile cell behavior and cell density in a close unicellular
    relative of animals.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: coHpo/coWts knockouts make coYki nuclear; hyperactive coYki phenotypes need the TEAD-binding
      residue.
  findings:
  - statement: Hyperactive coYki phenotypes require its TEAD-interaction residue, implying transcriptional
      activity.
    supporting_text: This result indicates that these phenotypes are mediated by the transcriptional activity
      of coYki.
- id: PMID:38729842
  title: 'Assembling a Hippo: the evolutionary emergence of an animal developmental signaling pathway.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review of Hippo pathway evolution; argues proliferation control is a later co-option.
  findings:
  - statement: The ancestral Hippo pathway function was cytoskeletal regulation, not proliferation.
    supporting_text: We describe new evidence indicating that the ancestral function of this pathway was
      not regulation of proliferation, but of cytoskeletal dynamics, and that this pathway function predated
      the emergence of animals
core_functions:
- description: 'Hippo-regulated transcriptional coactivator of TEAD transcription factors. Unphosphorylated
    YAP1 enters the nucleus, binds TEAD1-4 through its TEAD-binding domain, and supplies the transactivation
    function for TEAD-dependent genes such as CTGF. LATS1/2 phosphorylation causes 14-3-3-mediated cytoplasmic
    retention and degradation. Ancestral: the Capsaspora ortholog binds Capsaspora TEAD and activates
    Hippo-responsive transcription.'
