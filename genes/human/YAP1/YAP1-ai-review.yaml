- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:20048001
  qualifier: located_in
  review:
    summary: Nucleus. Unphosphorylated YAP1 enters the nucleus to coactivate TEAD and other factors; nuclear/cytoplasmic
      partitioning is the main way the Hippo pathway regulates it.
    action: ACCEPT
    reason: Localization is supported by many independent studies [PMID:17974916, PMID:20868367, PMID:21145499].
      Nuclear entry of a Yorkie ortholog when its upstream kinases are lost is also seen in Capsaspora
      [PMID:38517944].
    supported_by: &id007
    - reference_id: PMID:17974916
      supporting_text: Phosphorylation by the Lats tumor suppressor kinase leads to cytoplasmic translocation
        and inactivation of the YAP oncoprotein
    - reference_id: PMID:20868367
      supporting_text: The endogenous ZO-2 and YAP2 proteins co-localize in the nucleus
