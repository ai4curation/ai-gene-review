suggested_questions:
- question: Proliferation and organ-size control by YAP/Yorkie appear absent in Capsaspora, where coYki
    regulates cortical actomyosin and aggregate shape. At which node on the lineage leading to animals
    did YAP/Yorkie-TEAD acquire proliferative target genes, and does this coincide with the origin of
    TEAD-bound distal enhancers?
- question: Does human YAP1 keep an ancestral, proliferation-independent role in cortical cytoskeleton
    and blebbing, analogous to coYki? Could some YAP1 mechanotransduction phenotypes in epithelia reflect
    that older function rather than growth control?
- question: The S. rosetta Yorkie candidate (PTSG_06057) lacks a recognizable TEAD-binding motif. Did
    the choanoflagellate lineage lose YAP-TEAD coupling, or does it bind TEAD through a divergent interface?
    And should GO propagation of TEAD-YAP complex membership to choanoflagellates be restricted?
- question: Many GOA annotations for 'YAP' come from studies that knocked down or assayed YAP1 and WWTR1
    (TAZ) together. Which of the developmental and differentiation terms (e.g. osteoblast vs adipocyte
    differentiation, ciliogenesis) are specific to YAP1 rather than shared or TAZ-dominant?
suggested_experiments:
- hypothesis: Human YAP1 can substitute for coYki in Capsaspora, restoring normal cortical behaviour.
  description: Express human YAP1, YAP1 S94A (TEAD-binding-dead) and WWTR1 in Capsaspora coYki-/- cells
    and score blebbing and aggregate morphology. This tests whether the ancestral cytoskeletal output
    is retained in the human protein and whether it depends on TEAD.
  experiment_type: cross-species complementation
- hypothesis: TEAD-YAP target genes that are shared with Capsaspora coYki targets define an ancestral,
    non-proliferative core program.
  description: Compare YAP1-TEAD ChIP-seq/CUT&RUN targets in human epithelial cells with orthologs of
    coYki-dependent genes. Test whether the shared set is enriched for actin-cytoskeleton and adhesion
    genes rather than cell-cycle genes.
  experiment_type: comparative genomics / chromatin profiling
