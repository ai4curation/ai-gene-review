  review:
    summary: Protein binding (IPI) with TEAD4, from a targeted study. The partners are DNA-binding transcription
      factors that recruit YAP1 as a coactivator.
    action: MODIFY
    reason: 'Generic protein binding is uninformative. These interactions are YAP1''s core mechanism:
      as a coactivator without a DNA-binding domain it binds sequence-specific transcription factors (TEADs
      via its TEAD-binding domain; p73/p63/NF-E2/SMAD1 via its WW domains) [PMID:20368466, PMID:11278685].
      Replace with DNA-binding transcription factor binding.'
    proposed_replacement_terms:
    - id: GO:0140297
      label: DNA-binding transcription factor binding
    supported_by:
    - reference_id: PMID:20368466
      supporting_text: interact with YAP (which lacks a DNA-binding domain but contains an activation
        domain) to form functional heterodimeric transcription factors
