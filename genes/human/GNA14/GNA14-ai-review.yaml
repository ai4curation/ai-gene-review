  review:
    summary: Human G14 receptor-coupling experiments and G14/Gz domain swaps establish selected GPCR coupling
      to PLCbeta/IP3 production.
    action: ACCEPT
    reason: The helical domain is required for productive PLC activation; binding alone does not establish
      activation. The older genomic mapping citation is not itself a biochemical assay.
