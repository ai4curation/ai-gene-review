id: O95837
gene_symbol: GNA14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNA14 encodes G alpha 14, a Gq-family heterotrimeric G protein alpha subunit that couples
  selected receptors to phospholipase C beta signaling. Its nucleotide-binding and helical domains cooperate
  in effector recognition, and receptor-dependent activation generates intracellular inositol phosphate
  signals. G14 participates in selected chemokine and inflammatory receptor pathways, with coupling distinct
  from the broader expression patterns of Gq and G11. Native tissue-specific receptor and effector combinations
  remain less extensively characterized than heterologous cellular coupling.
