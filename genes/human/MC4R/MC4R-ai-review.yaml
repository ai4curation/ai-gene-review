id: P32245
gene_symbol: MC4R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Melanocortin 4 receptor is a class A seven-transmembrane G protein-coupled receptor expressed
  mainly in the brain, notably in neurons of the hypothalamic paraventricular nucleus, where it localises
  to the plasma membrane and the primary cilium. It is activated by the POMC-derived melanocortins alpha-
  and beta-MSH (and by ACTH in vitro) and antagonised by agouti-related protein (AgRP), which also acts
  as an inverse agonist. Agonist-bound MC4R couples to Gs to stimulate adenylate cyclase (ADCY3 at the
  cilium) and cAMP signalling, and can also close the KCNJ13/Kir7.1 channel independently of Gs. MC4R
  is the central effector node of the leptin-melanocortin pathway: its activation suppresses appetite
  and promotes energy expenditure. Accessory proteins such as MRAP2 and MGRN1 modulate its trafficking
  and signalling. Heterozygous and homozygous loss-of-function MC4R variants are the commonest monogenic
  cause of severe early-onset obesity, with hyperphagia, increased linear growth and hyperinsulinaemia.'
