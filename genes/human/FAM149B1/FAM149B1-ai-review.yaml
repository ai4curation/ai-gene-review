  review:
    summary: Accept the inherited role in maintaining normal protein distribution within cilia.
    action: ACCEPT
    reason: The exact human sequence and actual GO:0061512 IBD from PTN002842395 are verified on the
      saved PANTHER v19 target path, with valid experimental self-WITH evidence and no target-path
      NOT. The current term includes proteins transported to or maintained in a location within a
      cilium; it does not require a demonstrated defect in initial ciliary entry. PMID:30905400
      shows selective IFT88/IFT46 tip pooling in patient fibroblasts, while IFT122 shaft staining
      remains comparable to controls. In PMID:35609210, human RPE1 knockout cells accumulate IFT88
      and ICK at ciliary tips; full-length FAM149B1-EGFP rescues the IFT88-distribution defect. The
      engineered 1–179 fragment also improves IFT88 distribution without restoring normal ciliary
      length, separating this endpoint from length control. These controlled target phenotypes
      support a contribution to protein localization/maintenance within the cilium. They do not
      establish an autonomous transport motor, cargo-adaptor activity, direct IFT88 binding, a
      measured trafficking rate, or physical residence of FAM149B1 in the ciliary compartment. The
      natural 528-residue product was not tested independently.
