  review:
    summary: FAM149B1 helps maintain the normal distribution of proteins within cilia.
    action: ACCEPT
    reason: The current GO:0061512 definition includes transport to, or maintenance at a location
      within, a cilium. PMID:30905400 Figure 3 and Supplementary Figure S1 show abnormal IFT88/IFT46
      tip accumulation in human FAM149B1-mutant fibroblasts, with IFT122 distribution relatively
      preserved. PMID:35609210 Figure 7 independently shows IFT88 tip accumulation in human RPE1
      FAM149B1 knockout cells and rescue by full-length FAM149B1 and the engineered 1–179 fragment;
      normal cilium length was restored by intact full-length FAM149B1, whereas neither the 1–179
      nor the 180–582 fragment restored it in these assays. These perturbation/rescue results
      support the retained localization process without identifying FAM149B1 as a motor or cargo
      adaptor. Retrograde turnaround is a mechanistic interpretation, not a time-resolved
      FAM149B1-knockout transport measurement. The authors could not distinctly demonstrate ciliary
      localization of FAM149B1 itself, which is a separate claim from its role in IFT-protein
      distribution. No equivalence of the two natural products is inferred.
    supported_by:
    - reference_id: PMID:30905400
    - reference_id: PMID:35609210
