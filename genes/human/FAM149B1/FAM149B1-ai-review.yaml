core_functions:
- description: Contributes to normal cilium assembly, including extension and architecture, and
    maintenance of protein distribution within cilia, supported by human patient phenotypes and
    independent knockout/rescue of cilium length and IFT88 tip accumulation. An engineered
    N-terminal fragment can improve IFT88 distribution without normalizing length, indicating
    separable outputs within this ciliary role. Cellular association with BROMI and CCRK provides a
    mechanistic lead, but does not establish an autonomous transport motor, cargo adaptor,
    kinase-regulator activity or a defined native complex. Physical residence of FAM149B1 in the
    cilium and the behavior of its natural shorter product remain unresolved.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  - id: GO:0061512
    label: protein localization to cilium
  supported_by:
  - reference_id: PMID:30905400
  - reference_id: PMID:35609210
  knowledge_gaps:
  - gap_statement: The molecular activity by which FAM149B1 influences cilium organization and
      intraciliary protein distribution is not established in the inspected human studies. A
      proposed cyclin-like effect on CCRK and a role in transport turnaround have not been resolved
      by a FAM149B1-specific kinase-regulation assay or direct measurements of transport dynamics in
      its knockout cells.
    boundary: Human patient and knockout/rescue experiments establish positive cilium-length and
      protein-distribution phenotypes, and controlled cellular assays establish association with
      BROMI and CCRK. These findings do not by themselves identify the molecular reaction, physical
      operating site or a native stoichiometric assembly. The missing activity assignment reflects a
      bounded mechanistic gap, not absence of a ciliary biological role.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Separate effects on CCRK-dependent ICK phosphorylation, partner assembly and live
      IFT movement using defined biochemical assays and matched cellular rescue, while testing
      endogenous FAM149B1 localization independently.
    provenance:
    - reference_id: PMID:35609210
suggested_questions:
- question: Which molecular step connects FAM149B1 association with BROMI and CCRK to cilium length
    and IFT-protein distribution, and do these two outputs require the same interaction or activity?
- question: Where do the natural 582- and 528-residue products act, and do their abundance,
    localization and contributions to ciliary organization differ across human cell types or
    cell-cycle states?
suggested_experiments:
- description: Compare sequence-verified full-length FAM149B1, separation-of-function mutants and
    the existing engineered fragments at matched near-endogenous levels in human knockout/rescue
    cells. Measure live IFT trajectories, tip dwell times, cilium length and IFT88 distribution
    separately. In parallel, test purified CCRK-dependent ICK phosphorylation with and without
    FAM149B1 and BROMI, with kinase-inactive, partner-omission and protein-integrity controls.
    Measure binding separately from kinase output, so cellular association is not treated as a
    biochemical mechanism.
  hypothesis: Dissociating the molecular and cellular endpoints can distinguish a direct effect on
    CCRK activity from partner-dependent organization or another mechanism, without presupposing
    that FAM149B1 is a kinase regulator or transport motor.
- description: Establish product-specific transcript and protein measurements in human ciliated
    cells, then compare the two sequence-verified natural products at matched levels. Use endogenous
    tagging and independently validated detection with knockout controls to test ciliary base, shaft
    and other cellular pools over time, preserving the possibility of transient or low-abundance
    localization. Relate those measurements to separate rescue of length and protein-distribution
    phenotypes; keep engineered fragments and patient truncations distinct from natural products.
  hypothesis: The natural splice difference may alter localization or partner-dependent function,
    but equivalent behavior and transient residence are outcomes to test rather than assumptions
    imposed by the full-length rescue result.
