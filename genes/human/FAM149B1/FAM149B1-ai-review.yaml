description: FAM149B1 supports normal primary-cilium length and architecture and the distribution of
  intraflagellar transport proteins within cilia. It associates with TBC1D32/BROMI and CCRK/CDK20,
  but its molecular activity and precise cellular location remain unresolved. Loss of FAM149B1
  function causes elongated cilia with abnormal tip accumulation of IFT proteins and impaired
  Hedgehog signaling responses. Biallelic truncating variants cause a Joubert-related ciliopathy.
  The relative functions of the natural 582- and 528-residue products remain unresolved.
