- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: NAS
  original_reference_id: PMID:29907856
  qualifier: involved_in
  review:
    summary: Mouse Dcaf17 loss disrupts sperm development, supporting a contextual
      spermatogenesis role.
    action: KEEP_AS_NON_CORE
    reason: The original study deletes mouse Dcaf17 exon 4 and verifies the resulting
      frameshift. Mutant males are infertile and produce fewer, poorly motile, morphologically
      abnormal sperm; histology, alpha-tubulin staining and electron microscopy identify
      particularly severe post-meiotic defects in nuclear shaping, manchette organization
      and acrosome development. These are positive source-specific observations supporting
      the existing broad spermatogenesis association. They are mouse loss-of-function
      experiments, not direct assays of either human protein product or proof that
      DCAF17 is a microtubule structural component. The proposed connection to CUL4-dependent
      protein homeostasis is explicitly speculative in the Discussion and does not
      identify a DCAF17 substrate or performed ubiquitination step. The published
      correction concerns author indexing only.
    supported_by:
