suggested_questions:
- question: Which substrates, if any, are recruited by DCAF17 to a CUL4-DDB1 complex,
    and do the two official protein products differ in that activity?
- question: Does the long DCAF17 product form a membrane-associated pool in addition
    to its demonstrated nucleolar pool, and which cellular conditions distinguish
    these locations?
suggested_experiments:
- hypothesis: DCAF17 supplies a substrate-recognition contribution to a CUL4-DDB1
    assembly.
  description: Compare matched expression of the two untagged human products in interaction
    and substrate-capture experiments, then test nominated substrates in a reconstituted
    ubiquitin-transfer assay with DCAF17 omission and rescue controls.
- hypothesis: The predicted helices in the long product define a conditional membrane-associated
    pool.
  description: Combine endogenous product-specific localization with membrane fractionation,
    carbonate extraction and protease protection, distinguishing insertion from peripheral
    association and checking that epitope tags do not reproduce the reported aggregation
    artifact.
