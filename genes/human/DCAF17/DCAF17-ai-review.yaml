id: Q5H9S7
gene_symbol: DCAF17
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DCAF17 is a DDB1- and CUL4-associated protein found in nuclear and nucleolar
  compartments. Human cell experiments support its association with CUL4-DDB1 assemblies,
  but its proposed role in substrate recognition for ubiquitination remains unresolved.
  The 520-residue and 240-residue products both localize to nucleoli when expressed
  without fusion tags. Loss-of-function variants cause Woodhouse-Sakati syndrome,
  and mouse Dcaf17 deficiency disrupts sperm maturation. The molecular connection
  between these developmental effects and the protein's CUL4 association has not been
  established.
alternative_products:
- name: '1'
  id: Q5H9S7-1
  description: The displayed 520-residue product corresponds in length and architecture
    to the beta isoform studied in PMID:19026396. Untagged expression supports nucleolar
    localization. Two hydrophobic helices are predicted at residues 186–206 and 222–242,
    but membrane insertion was not established in the inspected experiments. The 2006
    CUL4-association construct was not resolved to an exact official isoform sequence.
- name: '2'
  id: Q5H9S7-2
  sequence_note: VSP_027788
  description: The 240-residue product is exactly residues 281–520 of the displayed
    sequence, following VSP_027788 deletion of residues 1–280. Its architecture matches
    the alpha isoform reported in PMID:19026396, for which untagged expression also
    produced nucleolar localization. It lacks both helices predicted in the long product.
    Equal CUL4 association or substrate-recognition activity of the two products has
    not been demonstrated by the inspected experiments.
