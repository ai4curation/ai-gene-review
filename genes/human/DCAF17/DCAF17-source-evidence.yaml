interaction_archive:
  scope: Ten current IntAct records and zero MINT records were captured. Target-side sequence identities
    match the 520-residue product. None is a literal PMID16949367 record; this does not contradict the
    independently read positive original. These contextual records do not generate new annotations.
core_scope: Cullin association and CUL4A/B membership form one compact molecular unit. Nucleoplasm follows
  the inspected HPA record and explicit Reactome compartment; nucleolus follows the independently demonstrated
  protein localization. Neither location is a demonstrated site of DCAF17-dependent ubiquitination, and
  equal cullin association by the two products remains unresolved.
feedback_followup:
  scope: Finite response to PR 5073 review 5549462344 and comment 6218002398; existing source tuples and
    quoted text are preserved.
  decisions: Add nucleolus to the core, retain source-specific UNDECIDED membrane and ubiquitination judgments,
    and accept CUL4B membership alongside CUL4A. Product descriptions contain biology; clone and assay
    limits remain here and in annotation reasons.
  ddb1_term_search: QuickGO query DDB1 returned two Ddb1-containing complex terms, not a binding MF. A
    broader query was nonspecific and was not an exhaustive ontology audit. No suitable DDB1-specific
    binding descendant was established; DDB1 evidence is retained explicitly without asserting a new term.
  background_cache: PMID15815621 remains a protected exploratory cache, not a new formal supporting reference.
