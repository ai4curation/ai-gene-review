localization:
  hpa_url: https://www.proteinatlas.org/ENSG00000115827-DCAF17/subcellular
  hpa_record: 'The actual HPA record was inspected: supported nucleoplasm, with antibodies HPA053339 and
    HPA055040. Antibody images were not independently inspected and the record does not resolve products.'
  distinction: Nucleoplasm and nucleolus are distinct positive protein locations and both are included
    in the single core. The long-product helix predictions conflict with the nucleolar observations in
    the official record; membrane insertion and product-specific partitioning remain genuinely unresolved.
    Localization is not an assay of a DCAF17-dependent ubiquitination reaction in either compartment.
