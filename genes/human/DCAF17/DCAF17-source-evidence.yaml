primary_sources:
- reference: PMID:16949367
  publication_url: https://doi.org/10.1016/j.molcel.2006.08.010
  original_url: https://walter.hms.harvard.edu/wp-content/uploads/2021/09/10.1016-j.molcel.2006.08.010.pdf
  locators:
  - Journal page 710, Identification of DCAFs and Validation of Ddb1-Interacting Proteins
  - Journal page 711, Figure 1C and Figure 1E lane 10
  - Journal page 719, Plasmids and Proteomic Analysis of the Ddb1 Complex
  actual_evidence: Human 293T DDB1 affinity purification identifies DCAF17 with seven peptides. GST-DCAF17
    is then tested with DDB1, CUL4A and CUL4B in transfected cell lysates. The CUL4B-level panel signal
    is weaker than the clearly supported DDB1/CUL4A associations.
  interpretation: This supports cullin-family binding and CUL4A/B membership. The relative panel signals
    are not a quantitative test of different biological roles. DDB1 association is also positive and is
    not covered by the cullin-binding term; the bounded GO search did not establish a suitable DDB1-specific
    binding descendant. No purified binary interface or DCAF17 substrate-destruction mechanism is inferred
    from the Cdt2 experiments.
  access: Normal cache remains abstract-only. Selected original Methods, Results and Discussion were read
    from the genuine author PDF, with Figure 1C/E pixels inspected. The exact DCAF17 clone sequence and
    original supplement were not recovered.
- reference: PMID:19026396
  publication_url: https://doi.org/10.1016/j.ajhg.2008.10.018
  original_url: https://walshlab.org/wp-content/uploads/2021/10/19026396.pdf
  locators:
  - Author in-press pages 2–3, construct, antibody and immunofluorescence Methods
  - Author in-press pages 4–6, C2orf37 Encodes a Nucleolar Protein and Figures 3–4
  - Author in-press pages 6–7, Discussion and Figure 5 caption
  actual_evidence: Both untagged major products give nucleolar localization in HEK293 cells. Figure 4A–C
    illustrates beta and the caption reports the same alpha pattern; Figure 4D–F shows endogenous C2orf37/B23
    colocalization in lymphoblasts. Peptide competition supports antibody specificity.
  interpretation: The GFP-fusion aggregation and nuclear disruption are not the positive localization
    experiment. Transcription-blockade sensitivity does not identify a specific ribosome-biogenesis or
    RNA-processing function.
  access: The normal cache remains abstract-only. Selected original text and Figure 4 pixels were read.
    The author PDF uses in-press pages 1–8, rather than final journal pages 684–691.
- reference: PMID:29907856
  publication_url: https://doi.org/10.1038/s41598-018-27379-0
  locators:
  - Results on generation of the exon-4 knockout, sperm phenotypes, spermatid morphology and manchette
    organization
  - Discussion of a possible CUL4-dependent protein-homeostasis mechanism
  - Methods for gene targeting, histology, immunofluorescence and electron microscopy
  actual_evidence: Mouse Dcaf17 deficiency causes male infertility and post-meiotic sperm-development
    abnormalities, including manchette and nuclear-shaping defects.
  interpretation: This supports a contextual spermatogenesis role. It does not assay either human product,
    direct microtubule binding or a defined ubiquitination substrate.
  access: Selected complete cached Results and Discussion paragraphs and operative Methods were read;
    no figure pixels or supplement files were inspected.
- reference: PMID:30068992
  publication_url: https://www.nature.com/articles/s41598-018-29836-2
  locators:
  - Author Correction text
  actual_evidence: The correction concerns author indexing in the 2018 study and does not alter its biological
    results.
  access: Actual publisher correction text read; normal cache remains abstract-only.
- reference: PMID:36509865
  publication_url: https://pubmed.ncbi.nlm.nih.gov/36509865/
  locators:
  - Whole-testis RNA-seq Methods and selected Results/Discussion
  actual_evidence: Mouse knockout alters testis gene expression at three and eight weeks; pathway analysis
    and cell-composition effects are discussed.
  interpretation: These downstream transcriptome changes do not demonstrate DCAF17 transcription-factor
    activity, a ubiquitination substrate or a defined performed step.
  access: Full text is genuinely cached; selected Methods/Results/Discussion were read, without raw supplement
    or figure-pixel inspection.
- reference: PMID:40449516
  publication_url: https://doi.org/10.1080/19396368.2025.2504459
  locators:
  - Complete abstract
  actual_evidence: The abstract reports mouse testis proteome changes and increased bulk ubiquitin signal
    after Dcaf17 loss.
  interpretation: Global changes do not identify DCAF17-specific ubiquitin-transfer chemistry. No individual
    target-table or product-specific conclusion is made.
  access: Genuine normal cache is abstract-only; publisher full-text and PDF requests returned 403.
