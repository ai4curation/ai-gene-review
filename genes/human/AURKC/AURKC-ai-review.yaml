id: Q9UQB9
gene_symbol: AURKC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Aurora kinase C is a protein serine/threonine kinase that functions in chromosome
  passenger complexes during cell division, with an important role in germ cells. Binding to
  INCENP and phosphorylation regulate its catalytic activity and substrate recognition. AURKC
  phosphorylates proteins including INCENP, Survivin and histone H3, and its division-stage
  localization includes chromosomes, the spindle midzone and the midbody. AURKC and Aurora B
  have overlapping activities, although their complexes and physiological requirements depend
  on cell type. Human variants that remove the kinase domain cause macrozoospermia-associated
  male infertility.
