core_functions:
- description: Catalyzes protein serine/threonine phosphorylation as the kinase component of
    an AURKC-containing chromosome passenger complex. INCENP binding and phosphorylation promote
    catalytic activation and substrate recognition. Localization changes during division; the
    evidence includes defined splice variants and engineered kinase constructs rather than equivalent
    testing of all natural products.
