core_functions:
- description: Catalyzes protein serine/threonine phosphorylation as the kinase component
    of an AURKC-containing chromosome passenger complex. INCENP binding and phosphorylation
    promote catalytic activation and substrate recognition. The kinase supports cytokinesis
    and changes location from chromosomes to the spindle midzone and midbody during division.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0006468
    label: protein phosphorylation
  - id: GO:1903490
    label: positive regulation of mitotic cytokinesis
  locations:
  - id: GO:0000775
    label: chromosome, centromeric region
  - id: GO:0051233
    label: spindle midzone
  - id: GO:0030496
    label: midbody
  in_complex:
    id: GO:0032133
    label: chromosome passenger complex
  supported_by:
  - reference_id: PMID:15316025
    supporting_text: INCENP binds and activates Aurora-C
  - reference_id: PMID:27332895
    supporting_text: The phosphorylation of Survivin Ser20 by Aurora-C.
  - reference_id: PMID:31320618
    supporting_text: fully active complex of AURKC bound to INCENP
  - reference_id: PMID:15938719
    supporting_text: 'Aurora C could rescue the multinucleate phenotype

      produced by Aurora B mutant'
  - reference_id: PMID:15499654
    supporting_text: 'Aurora-C could

      rescue the Aurora-B silenced multinucleation phenotype'
suggested_questions:
- question: Which substrates and spatial functions distinguish AURKC from AURKB at endogenous
    abundance in human germ cells?
- question: How do the three natural N-terminal variants differ in stability, CPC recruitment,
    activation and localization?
- question: What ancestral placement and experimental evidence support the kinetochore, centrosome,
    spindle-pole and mitotic spindle-organization IBA assertions?
- question: Which original experiments support the specific kinetochore-attachment, spindle-midzone-assembly
    and mitotic-checkpoint annotations?
suggested_experiments:
- hypothesis: The natural N-terminal variants differ in localization or regulation despite
    retaining the kinase domain.
  description: Compare the three sequence-verified full-length products at matched expression,
    measuring abundance, CPC recruitment, kinase activity and localization through cell division.
  experiment_type: Isoform-specific rescue, live-cell imaging and kinase assays
- hypothesis: AURKC and AURKB have both shared and context-specific substrate requirements
    in human germ cells.
  description: Combine selective AURKC and AURKB perturbations with matched rescue and substrate-phosphorylation
    measurements, separating single-kinase effects from combined inhibition and compensatory
    expression.
  experiment_type: Selective perturbation and phosphoproteomics
