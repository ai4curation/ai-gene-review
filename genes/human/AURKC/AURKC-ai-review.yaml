id: Q9UQB9
gene_symbol: AURKC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Aurora kinase C is a protein serine/threonine kinase that functions in chromosome
  passenger complexes during cell division, with an important role in germ cells. Binding
  to INCENP and phosphorylation regulate its catalytic activity and substrate recognition.
  AURKC phosphorylates proteins including INCENP, Survivin and histone H3, and its division-stage
  localization includes chromosomes, the spindle midzone and the midbody. AURKC and Aurora
  B have overlapping activities, although their complexes and physiological requirements depend
  on cell type. Human variants that remove the kinase domain cause macrozoospermia-associated
  male infertility.
alternative_products:
- name: '1'
  id: Q9UQB9-1
  description: Canonical 309-residue product.
- name: '2'
  id: Q9UQB9-2
  sequence_note: VSP_004872
  description: N-terminal variant lacking canonical residues 1–34.
- name: '3'
  id: Q9UQB9-3
  sequence_note: VSP_041095
  description: Aurora C-SV; 290-residue variant in which canonical residues 1–20 are replaced
    by methionine.
