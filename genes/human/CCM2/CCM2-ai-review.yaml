id: Q9BSQ5
gene_symbol: CCM2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCM2 (malcavernin) is a nonenzymatic intracellular signaling adaptor that coordinates proteins
  controlling endothelial organization and vascular integrity. Its N-terminal PTB domain binds KRIT1,
  while a region following that domain binds PDCD10/CCM3; its C-terminal harmonin-homology domain forms
  a separate helical fold. CCM2 associates with signaling components including MAP3K3/MEKK3 and helps
  organize their interactions and localization. In human endothelial cells it is required for formation
  of lumenized tubes. Pathogenic loss of CCM2 causes cerebral cavernous malformations.
