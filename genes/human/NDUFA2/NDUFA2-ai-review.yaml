    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: NAS
  original_reference_id: PMID:9878551
  qualifier: enables
  review:
    summary: >-
      This annotates NDUFA2 as directly enabling NADH dehydrogenase (ubiquinone)
      activity. NADH:ubiquinone oxidoreductase catalysis is carried out by the 14
      conserved core subunits (FMN/Fe-S-bearing subunits of the holoenzyme).
      UniProt explicitly states NDUFA2 is an accessory subunit "believed not to be
      involved in catalysis." Assigning the catalytic MF directly to a non-catalytic
      accessory subunit is an over-annotation. The honest relationship is captured
      in core_functions via contributes_to_molecular_function (GO:0008137), with
      the subunit's own MF being structural molecule activity (GO:0005198).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:9878551 reports cDNA sequences for eight previously uncharacterized nuclear-encoded
      subunits; it assays no enzymatic activity, so the MF assignment reflects the name of
      the parent enzyme rather than a measurement. NDUFA2 does have a thioredoxin-like fold
      and a redox-active Cys24-Cys58 disulfide, but no thioredoxin, oxidoreductase or
      disulfide-isomerase activity has ever been demonstrated for it, and UniProt states it
      is believed not to be involved in catalysis - so the fold is not a licence for a
      catalytic MF either. The right representation is contributes_to GO:0008137 with a
      structural molecule activity MF.
