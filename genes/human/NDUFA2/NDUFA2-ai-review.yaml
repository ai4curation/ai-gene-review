id: O43678
gene_symbol: NDUFA2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NDUFA2 (Complex I-B8/CI-B8) is a small (99 aa) nuclear-encoded accessory
  (supernumerary) subunit of mitochondrial NADH:ubiquinone oxidoreductase
  (respiratory chain Complex I). It resides in the peripheral (matrix) arm of the
  holoenzyme as a peripheral membrane protein on the matrix side of the
  mitochondrial inner membrane. The isolated subunit adopts a thioredoxin-like fold
  and carries a redox-active Cys24-Cys58 disulfide, but it is a non-catalytic
  structural subunit and is not itself an electron-transfer/redox catalyst; the 14
  conserved core subunits perform Complex I catalysis. NDUFA2 is required for
  proper assembly and stability of Complex I, and loss-of-function variants cause
  autosomal-recessive mitochondrial complex I deficiency (Leigh
  disease/leukoencephalopathy, MC1DN13).
alternative_products:
- name: '1'
  id: O43678-1
  description: >-
    Canonical 99-residue isoform (sequence displayed in UniProt). This is the form
    present in the mature Complex I holoenzyme, the form whose thioredoxin-like fold and
    redox-active Cys24-Cys58 disulfide were determined by NMR (PDB 1S3A), and the form
    assayed in the structural and proteomic studies cited here.
- name: '2'
  id: O43678-2
  sequence_note: VSP_045479
  description: >-
    Alternative-splicing isoform in which the C-terminal residues 71-99 are replaced by
    the hexapeptide SRVQNS (VSP_045479). The replaced segment is part of the
    thioredoxin-like core, and residue Cys58 - one partner of the redox-active disulfide
    - lies just upstream of the substitution, so the disulfide's partner region and the
    C-terminal packing are both affected. The isoform is supported only by a cDNA
    submission (ECO:0000303|Ref.3); no protein-level expression, localization, or Complex
    I incorporation has been reported for it.
