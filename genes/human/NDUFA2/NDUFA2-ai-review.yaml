proposed_new_terms: []
suggested_questions:
- question: >-
    NDUFA2 adopts a thioredoxin fold and carries a redox-active Cys24-Cys58 disulfide, yet
    UniProt records no catalytic function and GOA has no redox MF for it. Is the disulfide
    functional in the assembled complex - for example as a redox or oxidative-stress sensor
    that modulates Complex I - or is it a vestige of the fold with no activity?
  experts: []
- question: >-
    Does the oxidation state of the Cys24-Cys58 disulfide change with the redox or
    oxidative-stress status of the matrix, and does that state affect NDUFA2's incorporation
    into, or the stability of, Complex I?
  experts: []
- question: >-
    Reactome models NDUFA2 as a LONP1 degradation substrate. Is LONP1-mediated turnover of
    unassembled NDUFA2 a physiological quality-control route, and does it contribute to the
    Complex I deficiency seen in MC1DN13 patients?
  experts: []
- question: >-
    The isoform O43678-2 replaces C-terminal residues 71-99 with the hexapeptide SRVQNS,
    truncating the thioredoxin-like core just downstream of Cys58. Is this isoform
    translated, and does it retain the disulfide or any capacity to be incorporated into
    Complex I?
  experts: []
- question: >-
    Which structural module of Complex I does NDUFA2 belong to, and which other subunits are
    destabilized when it is lost? The knockout proteomics framework of PMID:27626371 answers
    this for every accessory subunit; making the NDUFA2-specific answer explicit would
    sharpen the assembly annotation beyond the generic accessory-subunit claim.
  experts:
  - Stroud DA
  - Ryan MT
suggested_experiments:
- hypothesis: >-
    The Cys24-Cys58 disulfide of NDUFA2 is redox-responsive in situ and its reduction
    destabilizes the peripheral arm of Complex I.
  description: >-
    Determine the in-cell oxidation state of Cys24 and Cys58 by differential thiol
    alkylation and quantitative mass spectrometry under basal, reducing and oxidative-stress
    conditions, then re-express Cys-to-Ser mutants in NDUFA2-null cells and assay Complex I
    assembly by blue-native PAGE and complexome profiling. If the disulfide is structural
    only, the mutants should still assemble; if it is regulatory, assembly or activity
    should track the redox condition.
  experiment_type: Redox proteomics with mutant complementation
- hypothesis: >-
    NDUFA2 is required for assembly of a specific structural module of Complex I, and its
    loss selectively destabilizes the subunits of that module.
  description: >-
    Generate NDUFA2 knockouts in a human cell line and perform complexome profiling
    alongside quantitative whole-mitochondrial proteomics, identifying which subunits fall
    in abundance and which assembly intermediate accumulates. Compare the destabilization
    signature against those catalogued for the other accessory subunits.
  experiment_type: Knockout complexome profiling
- hypothesis: >-
    Unassembled NDUFA2 is cleared by LONP1, so LONP1 inhibition should stabilize the free
    subunit pool without restoring assembled Complex I.
  description: >-
    Inhibit or deplete LONP1 in wild-type cells and in cells expressing an
    assembly-incompetent NDUFA2 variant, and measure free versus complex-incorporated
    NDUFA2 by blue-native PAGE and pulse-chase labelling. A selective rise in the free pool
    would confirm the Reactome substrate relationship as a physiological quality-control
    route.
  experiment_type: Protease inhibition with pulse-chase turnover analysis
