core_functions:
- description: Zinc-influx transmembrane transport. ZIP6 is a multi-pass plasma-membrane
    protein that imports extracellular Zn(2+) down its concentration gradient into
    the cytosol. The cytosolic zinc it delivers acts as an intracellular signal (for
    example GSK-3beta inactivation during EMT and modulation of lymphocyte and TCR
    signaling), but the gene product's own molecular work is the membrane transport
    of zinc.
  molecular_function:
    id: GO:0005385
    label: zinc ion transmembrane transporter activity
  directly_involved_in:
  - id: GO:0071578
    label: zinc ion import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: CHEBI:29105
    label: zinc(2+)
  supported_by:
  - reference_id: PMID:12839489
    supporting_text: can act as zinc-influx transporters
  - reference_id: PMID:18272141
    supporting_text: These results demonstrate that Zip6 functions as a zinc import
      protein in neuroblastoma cells
  - reference_id: file:human/SLC39A6/SLC39A6-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Zinc-influx transporter which plays a role in zinc homeostasis
suggested_questions:
- question: Does human ZIP6 itself use a Zn(2+)/bicarbonate symport mechanism, as shown
    for its paralogs ZIP8 and ZIP14, or does it transport zinc by a different (channel-like)
    mechanism?
- question: Is the ZIP6-ZIP10 heteromer the functional transporting unit in vivo, and
    does heteromerization change ion selectivity, kinetics, or regulation relative
    to ZIP6 alone?
suggested_experiments:
- description: Reconstitute purified human ZIP6 (and the ZIP6-ZIP10 heteromer) in proteoliposomes
    and measure zinc flux with and without a transmembrane bicarbonate gradient to
    test directly whether ZIP6 is a cation-bicarbonate symporter.
- description: Use endogenous-tagged ZIP6 in a polarized epithelial model (for example
    choroid-plexus or breast epithelial cells) with sub-cellular zinc sensors to map
    where (apical versus basolateral plasma membrane) ZIP6-mediated zinc entry occurs
    and how N-terminal cleavage controls it.
knowledge_gaps:
- gap_statement: The precise ion-coupling mechanism of ZIP6 (electrodiffusive channel-like
    uniport versus Zn(2+)/bicarbonate symport) is not established for ZIP6 itself,
    leaving the molecular basis of its zinc transport uncertain.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
