  review:
    summary: Electronic orthology transfer of an ER location from mouse Slc39a6 (Q8C145).
    action: MARK_AS_OVER_ANNOTATED
    reason: ZIP6 is a plasma-membrane zinc importer; its functional residence is the
      cell surface, not the ER. ER signal from a newly synthesized multi-pass membrane
      protein reflects biosynthetic transit rather than a site of function, and this
      row rests only on an electronic orthology transfer with no direct ER evidence
      on the endogenous human protein in its native cell. Per the ER organelle policy,
      a synthesis row resting on transit alone is marked as over-annotated rather than
      kept. Of note, PMID:23919497 reports that an N-terminally uncleaved form can be
      retained in the ER, but the functional, cleaved form traffics to the plasma membrane.
    supported_by:
