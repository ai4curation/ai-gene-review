    label: epithelial to mesenchymal transition
  evidence_type: IDA
  original_reference_id: PMID:23919497
  qualifier: involved_in
  review:
    summary: ZIP6 overexpression drives cells to undergo EMT via a zinc-influx/GSK-3beta/SNAI1/E-cadherin
      pathway.
    action: KEEP_AS_NON_CORE
    reason: This is a genuine, well-documented physiological and pathological role of
      ZIP6, but it is a downstream signaling consequence of the core zinc-import activity
      rather than the molecular function itself. ZIP6 participates in EMT by supplying
      the cytosolic zinc signal that inactivates GSK-3beta and stabilizes nuclear SNAI1
      to repress E-cadherin; because the step-level work of EMT (transcriptional repression,
      cytoskeletal remodelling) is performed by other proteins, this developmental and
      pleiotropic process is best retained as non-core. The claim itself is strongly
      supported, so it is kept rather than removed.
    supported_by:
    - reference_id: PMID:23919497
      supporting_text: cells expressing plasma-membrane-located ZIP6 undergo EMT and
        detach from monolayers as highly proliferating cells
    - reference_id: PMID:23919497
      supporting_text: We provide evidence for a mechanism where ZIP6-induced zinc
        influx inactivates GSK-3β, enabling unphosphorylated Snail in the nucleus to
        down-regulate adherence genes such as E-cadherin, causing loss of cell adherence.
