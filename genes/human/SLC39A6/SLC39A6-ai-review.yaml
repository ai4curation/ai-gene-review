id: Q13433
gene_symbol: SLC39A6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC39A6 (ZIP6, LIV-1) is a multi-pass plasma-membrane zinc-influx transporter
  of the LIV-1 subfamily of the ZIP (SLC39A) family. It imports extracellular Zn(2+)
  down its concentration gradient into the cytosol and is synthesized as a precursor
  with a cleaved N-terminal signal/pro-region; N-terminal proteolytic processing accompanies
  its trafficking to the cell surface. The rise in cytosolic zinc it produces acts
  as an intracellular signal that, by inhibiting GSK-3beta, stabilizes nuclear SNAI1,
  repressing E-cadherin and driving epithelial-to-mesenchymal transition during zebrafish
  gastrulation and in breast cancer, where ZIP6 is estrogen- and STAT3-induced and
  associated with metastatic, lymph-node-positive disease. ZIP6 frequently acts as
  a heteromer with ZIP10 (SLC39A10). Beyond development and cancer, ZIP6-mediated zinc
  influx contributes to lymphocyte activation and T-cell receptor signaling, where
  it localizes to lipid rafts and is recruited to the immunological synapse, and to
  the zinc rise required for the oocyte-to-egg transition. It is broadly expressed,
  with high levels in hormonally regulated tissues such as breast, prostate and placenta.
