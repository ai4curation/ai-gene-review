  review:
    summary: IBA (PAINT node PTN001147804, the RAF kinase clade) for MAPK cascade. RAF1 is the MAP3K tier of the RAS-RAF-MEK-ERK
      cascade.
    action: ACCEPT
    reason: The RAF clade node is the correct place for this function; RAF1 phosphorylates MEK1/2 as the first kinase of the
      ERK cascade. Consistent with IDA evidence (PMID:8576262) and the BRAF review.
    supported_by:
    - reference_id: file:human/RAF1/RAF1-uniprot.txt
      supporting_text: activation initiates a mitogen-activated protein kinase (MAPK) cascade
    - reference_id: file:human/RAF1/RAF1-deep-research-falcon.md
      supporting_text: RAF1’s best-established catalytic function is to phosphorylate the activation loops of **MEK1/MAP2K1
        and MEK2/MAP2K2**
