    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10433554
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61981
  review:
    summary: IPI (study of 14-3-3gamma in PDGF-stimulated vascular smooth muscle cells) for RAF1 binding YWHAG.
    action: MODIFY
    reason: 'GO:0005515 protein binding is uninformative; the WITH/FROM partner is YWHAG. RAF1 is a canonical phospho-dependent
      14-3-3 client: a 14-3-3 dimer engaging pSer259 and pSer621 holds the autoinhibited monomer, and the pSer621 site also
      stabilises the active dimer. 14-3-3 protein binding captures this regulatory interaction (same term as the BRAF review).'
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
    supported_by:
    - reference_id: PMID:10433554
      supporting_text: We found that 14-3-3gamma interacted with the signal transduction protein Raf-1
