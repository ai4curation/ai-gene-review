id: Q8N370
gene_symbol: SLC43A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC43A2 (LAT4) is a system-L, sodium-independent facilitative amino acid
  transporter (uniporter) of the SLC43 / major facilitator superfamily. It mediates
  the stereospecific transmembrane movement of large neutral amino acids, selectively
  the branched-chain amino acids leucine, isoleucine and valine plus phenylalanine
  and methionine, by facilitated diffusion that does not require Na+, Cl- or a pH
  gradient and, unlike the SLC7 system-L transporters LAT1/LAT2, does not require the
  SLC3A2/4F2hc heavy chain and is not an obligatory exchanger. Because it equilibrates
  its substrates down their concentration gradients, it can mediate net amino acid
  efflux. In polarized epithelia it resides at the basolateral membrane of small
  intestinal enterocytes and kidney proximal tubule and thick ascending limb cells,
  where it drives the basolateral efflux step of transepithelial neutral amino acid
  (re)absorption, working in concert with apical uptake systems and basolateral
  antiporters. Its affinity and transport activity are tuned by a phosphorylation
  switch at Ser274 and Ser297 that is entrained to feeding rhythms. LAT4 also effluxes
  the iodothyronine metabolites 3,3'-diiodo-L-thyronine (3,3'-T2) and 3-iodo-L-tyrosine
  (MIT). Loss of the mouse ortholog causes postnatal growth failure and early death,
  reflecting its role in supplying amino acids to developing tissues including the
  placenta.
