core_functions:
- description: Sodium-independent facilitative (uniporter) transmembrane transport of
    large neutral amino acids, selectively the branched-chain amino acids leucine,
    isoleucine and valine plus phenylalanine and methionine, by facilitated diffusion
    that does not require SLC3A2/4F2hc and is not an obligatory exchanger. In polarized
    epithelia this drives the basolateral efflux step of transepithelial neutral amino
    acid (re)absorption.
  molecular_function:
    id: GO:0015175
    label: neutral L-amino acid transmembrane transporter activity
  directly_involved_in:
