suggested_questions:
- question: Does human LAT4 physiologically mediate the efflux of iodothyronine
    metabolites (3,3'-T2 and 3-iodo-L-tyrosine/MIT), and is this efflux role
    functionally significant for cellular thyroid hormone homeostasis in vivo?
- question: Is LAT4's basolateral efflux obligatorily coupled (via substrate recycling)
    to parallel amino acid antiporters that export non-essential and cationic amino
    acids, and what is the stoichiometry of this functional coupling?
suggested_experiments:
- description: Reconstitute purified LAT4 into proteoliposomes to confirm it functions
    as an uncoupled facilitative uniporter (no obligatory counter-substrate, no Na+
    dependence) and to quantify its relative affinities for Leu, Ile, Val, Phe and Met.
- description: Use the Ser274/Ser297 phosphorylation-site antibodies and conditional
    intestinal/kidney Slc43a2 models to test whether feeding-entrained phosphorylation
    switching controls transepithelial neutral amino acid absorption rate in vivo.
