  review:
    summary: >-
      Phylogenetic (IBD) assertion that SLC26 transporters act at the plasma
      membrane, placed at PANTHER node PTN002483418 and inherited by SLC26A3.
      SLC26A3 itself (UniProtKB:P40879) is among the descendant evidences.
    action: ACCEPT
    reason: >-
      SLC26A3 is a well-established apical plasma-membrane transporter, confirmed
      directly in human cells (PMID:22159084). The plasma-membrane node placement
      is sound and the gene sits squarely within the clade; self-appearance in
      WITH/FROM reflects experimental grounding on the target, not circularity.
    supported_by:
    - reference_id: PMID:22159084
      supporting_text: mature glycosylated form of SLC26A3 exists at the plasma membrane
