- term:
    id: GO:0008271
    label: secondary active sulfate transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018045
  review:
    summary: >-
      InterPro2GO mapping from the SulP/sulfate-transporter conserved-site
      signature (IPR018045) to secondary-active sulfate transporter activity.
    action: REMOVE
    reason: >-
      This IEA rests only on SLC26A/SulP family membership (InterPro2GO from the
      conserved-site signature IPR018045), not on any sulfate-transport evidence
      for SLC26A3. Human SLC26A3 is a characterized Cl-/HCO3- exchanger whose
      UniProt FUNCTION makes no sulfate claim; the early "sulfate transporter"
      (DRA) characterization is contested, with later work finding
      weak-to-negligible sulfate transport, while the dedicated sulfate
      transporters of the family are SLC26A1/SLC26A2. Remove as an
      over-propagated family-level mapping rather than a function of this gene.
    supported_by:
    - reference_id: file:human/SLC26A3/SLC26A3-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the SLC26A/SulP transporter (TC 2.A.53) family.
