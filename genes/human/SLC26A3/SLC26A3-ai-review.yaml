id: P40879
gene_symbol: SLC26A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC26A3 (DRA, "down-regulated in adenoma") is the apical brush-border
  plasma-membrane chloride/bicarbonate anion exchanger of the intestinal
  epithelium, most abundant in the ileum and colon. It is a secondary-active
  transporter of the SLC26/SulP family, with a membrane-embedded SulP transport
  domain and a cytoplasmic STAS domain, and functions as an electrogenic,
  coupled exchanger that imports two chloride ions for each bicarbonate ion
  exported (2Cl-/1HCO3-). In the enterocyte apical membrane it mediates luminal
  chloride absorption and bicarbonate secretion, and acts in concert with the
  Na+/H+ exchanger NHE3 to accomplish electroneutral NaCl absorption; its
  exchange activity is inhibited by low intracellular pH, giving indirect
  coupling to NHE3. Like other SLC26 members it can also transport oxalate.
  A C-terminal class I PDZ-binding motif (ETKF) anchors it
  to PDZ-domain scaffolds (NHERF2/E3KARP, NHERF4, PDZK1 and others) that
  regulate its surface expression and activity. Loss-of-function mutations cause
  congenital chloride diarrhea (CLD/DIAR1), characterized by watery
  chloride-rich stools; colonic expression is characteristically lost in
  adenomas and adenocarcinomas, the origin of the DRA name. By similarity to the
  mouse ortholog it also contributes to chloride/bicarbonate homeostasis during
  sperm epididymal maturation and capacitation, localizing to the sperm
  midpiece.
