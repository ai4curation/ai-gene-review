core_functions:
- description: >-
    Electrogenic, coupled chloride/bicarbonate antiport (2 Cl- in / 1 HCO3- out)
    at the enterocyte apical brush-border membrane, mediating luminal chloride
    absorption and bicarbonate secretion. Functionally coupled to the Na+/H+
    exchanger NHE3 (via intracellular pH) for electroneutral NaCl absorption, and
    inhibited by low intracellular pH. Loss of function causes congenital
    chloride diarrhea.
  molecular_function:
    id: GO:0140900
    label: chloride:bicarbonate antiporter activity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0031526
    label: brush border membrane
  supported_by:
  - reference_id: PMID:16606687
    supporting_text: slc26a3 mediates a coupled 2Cl-/1HCO3- exchanger.
  - reference_id: file:human/SLC26A3/SLC26A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: stoichiometry of 2:1 in the intestinal epithelia
- description: >-
    Anchoring to apical PDZ-domain scaffold complexes through a C-terminal class
    I PDZ-binding motif (ETKF), coupling SLC26A3 to NHERF2/E3KARP, NHERF4, PDZK1
    and related scaffolds that regulate its surface expression and exchange
    activity and link it to NHE3/CFTR in the apical transport machinery.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:22627094
    supporting_text: protein-protein interaction was identified between the PDZ-binding motif of
  - reference_id: PMID:12369822
    supporting_text: the ETKF motif of dra binds to the second PDZ domain of E3KARP
