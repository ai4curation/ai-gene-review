id: URS000007A90A_9606
gene_symbol: MT-TK
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MT-TK encodes mitochondrial tRNA-Lys, one of the 22 transfer RNAs encoded by mitochondrial
  DNA. After excision from the polycistronic mtDNA transcript and post-transcriptional maturation, it
  is charged with lysine by the corresponding mitochondrial aminoacyl-tRNA synthetase and, in the mitochondrial
  matrix, acts as the adaptor that reads the lysine codons AAA and AAG (AAR) of the 13 mtDNA-encoded mRNAs
  on the mitoribosome, delivering lysine to the growing polypeptide. Its anticodon wobble uridine carries
  a taurine-containing modification; the MERRF-associated m.8344A>G variant abolishes this modification
  and the unmodified tRNA cannot translate either lysine codon. Pathogenic variants in MT-TK, like those
  in other mt-tRNA genes, impair mitochondrial translation and oxidative phosphorylation and cause maternally
  inherited mitochondrial disease.
references:
- id: PMID:21910628
  title: 'Human mitochondrial tRNAs: biogenesis, function, structural aspects, and diseases.'
  findings:
  - statement: The 22 mtDNA-encoded tRNAs are used by the mitochondrial protein synthesis machinery to
      translate the 13 mtDNA-encoded mRNAs.
    supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
      uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
  - statement: mt tRNA genes are frequent sites of pathogenic point mutations.
    supporting_text: The genes encoding mt tRNAs are highly susceptible to point mutations, which are
      a primary cause of mitochondrial dysfunction and are associated with a wide range of pathologies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Suzuki, Nagao and Suzuki 2011 Annu Rev Genet, review); abstract only.
      Covers all 22 mtDNA-encoded tRNAs collectively rather than this tRNA specifically.
- id: PMID:7219534
  title: Sequence and organization of the human mitochondrial genome.
  findings:
  - statement: The human mitochondrial genome encodes 22 tRNAs.
    supporting_text: The genes for the 12S and 16S rRNAs, 22 tRNAs, cytochrome c oxidase subunits I, II
      and III, ATPase subunit 6, cytochrome b and eight other predicted protein coding genes have been
      located.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Anderson et al. 1981 Nature); the reference human mtDNA sequence that
      located the 22 tRNA genes.
- id: PMID:17132941
  title: Human mitochondrial diseases associated with tRNA wobble modification deficiency.
  findings:
  - statement: tRNA-Lys normally reads AAA and AAG; the MERRF mutant lacking the wobble modification reads
      neither.
    supporting_text: The MERRF mt tRNA(Lys) lacking the wobble modification cannot translate either of
      its codons (AAA and AAG)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Kirino and Suzuki 2005 RNA Biol, review); abstract only. States the
      codon-reading defect of wobble-unmodified MERRF tRNA-Lys.
existing_annotations:
- term:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  evidence_type: TAS
  review:
    summary: No GOA annotation exists for MT-TK (RNAcentral/Rfam2GO supplies GO:0030533 for some but not
      all mt-tRNA sequences). Proposed to record the canonical tRNA adaptor function.
    action: NEW
    reason: MT-TK is one of the 22 mtDNA-encoded tRNAs used by the mitochondrial translation machinery;
      the codon-anticodon adaptor function is carried out by the tRNA itself. The same term is assigned
      by Rfam2GO to sister mt-tRNAs (e.g. MT-TQ, MT-TH, MT-TS1).
    supported_by: &id001
    - reference_id: PMID:17132941
      supporting_text: The MERRF mt tRNA(Lys) lacking the wobble modification cannot translate either
        of its codons (AAA and AAG)
    - reference_id: PMID:21910628
      supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
        uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
- term:
    id: GO:0032543
    label: mitochondrial translation
  evidence_type: TAS
  review:
    summary: Proposed process annotation for the mitochondrial tRNA.
    action: NEW
    reason: The tRNA directly performs the decoding step of mitochondrial translation (it is not merely
      required for it), so involved_in mitochondrial translation is appropriate; this is the specific
      child of translation that sister mt-tRNAs receive via the MODIFY of their IEA translation annotation.
    supported_by: *id001
core_functions:
- description: Lys-accepting tRNA that reads the lysine codons AAA and AAG (AAR) of mtDNA-encoded mRNAs
    on the mitoribosome, delivering lysine during mitochondrial translation.
  molecular_function:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  directly_involved_in:
  - id: GO:0032543
    label: mitochondrial translation
  supported_by: *id001
suggested_questions:
- question: Should GO annotate all 22 mtDNA-encoded tRNAs, including MT-TK, uniformly to triplet codon-amino
    acid adaptor activity and mitochondrial translation, rather than relying on Rfam2GO coverage that
    varies between mt-tRNA sequences?
  experts:
  - GO RNA annotation curators
