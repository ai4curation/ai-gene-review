- term:
    id: GO:0048029
    label: monosaccharide binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002928819
  - UniProtKB:Q96QP1
  review:
    summary: ALPK1 recognizes microbial ADP-heptose and initiates innate immune signaling.
    action: MODIFY
    reason: The intact ADP-heptose ligand is a nucleotide-sugar derivative, and binding stimulates ALPK1-dependent
      TIFA phosphorylation and innate signaling. Human N-terminal structural/binding evidence and wild-type
      versus kinase-inactive cellular rescue support pattern recognition receptor activity (GO:0038187),
      whose definition covers recognition of a microbial pattern that initiates an innate response. This
      functional refinement is more informative than carbohydrate derivative binding, an ancestor of the
      already retained ATP-binding annotation. It does not assert free-heptose binding, transfer partner
      signaling chemistry to ALPK1, or require a transmembrane receptor. The original IBA/IPI evidence
      and source entities are preserved.
    supported_by:
    - reference_id: PMID:30111836
      supporting_text: ADP-Hep directly binds the N-terminal domain of ALPK1, stimulating its kinase domain
        to phosphorylate and activate TIFA.
      full_text_unavailable: true
    proposed_replacement_terms:
    - id: GO:0038187
      label: pattern recognition receptor activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN002928819
        source_status: SUPPORTS_TRANSFER
        comment: This is the ancestral PAINT node supplied by the seed. Human target experiments support
          the inherited nucleotide-heptose sensing activity. The target-level functional refinement uses
          direct ligand recognition coupled to signaling; it does not allege lineage loss, wrong node
          placement or circular target self-evidence.
      failure_modes:
      - GRANULARITY_MISMATCH
