  evidence_type: EXP
  original_reference_id: PMID:27169898
  qualifier: enables
  review:
    summary: The myosin-IIA phosphorylation assay does not resolve a serine acceptor.
    action: UNDECIDED
    reason: The full paper shows ATP- and ALPK1-dependent phosphorylation of phosphatase-treated, immunoprecipitated
      myosin IIA, with omission controls. Detection uses ProQ and pan-phospho-Ser/Thr rather than a mapped
      serine site. ALPK1 purified from human HEK293F also coeluted endogenous myosin, a limitation the
      authors acknowledge. This positive kinase evidence supports the broader existing activity, while
      the exact serine-specific source assertion remains unresolved; no claim is made that ALPK1 lacks
      serine kinase capacity.
