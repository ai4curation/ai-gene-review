id: Q96QP1
gene_symbol: ALPK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALPK1 is a cytosolic alpha-family protein kinase that couples recognition of microbial nucleotide-heptoses
  to innate immune signaling. Its N-terminal ligand-binding domain recognizes ADP-heptose, activating
  the C-terminal kinase to phosphorylate TIFA, prominently at Thr9. Phosphorylated TIFA oligomerizes and
  recruits downstream ubiquitin-ligase and kinase machinery that activates NF-κB and inflammatory gene
  expression. ALPK1 also occurs at centrosomes, mitotic spindle poles and ciliary bases in tested human
  cells; patient-cell ciliation abnormalities are documented, while the local biochemical mechanism remains
  less resolved. Disease-associated variants can increase signaling and broaden responsiveness to endogenous
  nucleotide sugars, helping explain ROSAH syndrome and selected adnexal tumors.
