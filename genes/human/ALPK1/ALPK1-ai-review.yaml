core_functions:
- description: Cytosolic nucleotide-heptose sensing coupled to TIFA phosphorylation. Direct ADP-heptose
    recognition by the N-terminal domain activates the alpha-kinase domain, initiating TIFA-dependent
    innate signaling and canonical NF-κB activation. Thr9 is the well-resolved TIFA acceptor; the broad
    kinase class is used without asserting unresolved serine-specific chemistry. Downstream ubiquitination
    and TAK1/IKK catalysis belong to the partner enzymes.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0002753
    label: cytoplasmic pattern recognition receptor signaling pathway
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:30111836
    supporting_text: ADP-Hep directly binds the N-terminal domain of ALPK1, stimulating its kinase domain
      to phosphorylate and activate TIFA.
    full_text_unavailable: true
  - reference_id: PMID:28222186
    supporting_text: TIFA oligomerization was restored by overexpressing a siRNA-resistant full length
      ALPK1 construct.
    full_text_unavailable: false
  - reference_id: PMID:30967659
    supporting_text: shows a diffuse cytosolic pattern and enrichment of ALPK1 in centrosomes of the cells
    full_text_unavailable: false
  - reference_id: PMID:37072480
    supporting_text: Data confirmed that ALPK1 induced the phosphorylation of TIFA on T9 residues in response
      to the recognition of ADPH
    full_text_unavailable: false
suggested_questions:
- question: Does normal ALPK1 participate in cilium assembly, or does altered signaling by ROSAH variants
    secondarily disrupt ciliogenesis, and which experiments distinguish these mechanisms?
- question: What site-resolved human experiment supports the seeded serine-specific kinase activity, separately
    from TIFA threonine phosphorylation and pan-Ser/Thr myosin assays?
- question: How does ALPK1 discriminate microbial nucleotide-heptoses from endogenous nucleotide sugars,
    and how do ROSAH variants alter this selectivity?
- question: Does ALPK1 binding to 14-3-3 epsilon regulate its localization, aggregation or kinase activity
    under physiological conditions?
