- id: PMID:37072480
  title: In vitro kinase assay reveals ADP-heptose-dependent ALPK1 autophosphorylation and altered kinase
    activity of disease-associated ALPK1 mutants.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official primary identity verified; original open Scientific Reports article and now
      the recovered full Results, Figures 1–5 and Methods read. Human myc-ALPK1 immunoprecipitated from
      HEK293 phosphorylates recombinant E. coli-produced GST-TIFA at Thr9. ATP/pThr9 immunoblot and ATPγS
      assays, kinase-dead K1067R, domain-deletion and omission controls support catalysis. This is an
      immunoprecipitate assay, not two purified components. Weaker threonine-site results have statistical
      and text/caption residue-listing limits. Kinase-dependent ALPK1 phosphorylation supports an autophosphorylation
      model; the authors explicitly retain a possible coprecipitating kinase. V1092A constitutive TIFAsome
      formation is strong; the T237M single-cell increase is not significant. No serine-specific chemistry
      is established.
  findings: []
- id: PMID:38060563
  title: ALPK1 mutants causing ROSAH syndrome or Spiradenoma are activated by human nucleotide sugars.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity, Dundee original PNAS full article and recovered full Results/Discussion/Methods
      read. FLAG-ALPK1 immunoprecipitated from human HEK293-Blue cells is assayed with GST-TIFA and radiolabeled
      ATP. Disease variants gain activation by selected human nucleotide sugars; GDP-mannose activates
      V1092A but not T237M. Y254C loses activity during purification, limiting its in-vitro ligand assignment.
      Wild-type binding without activation remains explicitly unresolved. The T237M rate relative to wild
      type differs from the separately configured cell-stimulation/thiophosphorylation assay in PMID:37072480;
      no universal rate claim or normal wild-type nucleotide-sugar activation is inferred. Patient metabolite
      occupancy remains a proposed explanation.
  findings: []
