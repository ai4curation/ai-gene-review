- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:30967659
  qualifier: involved_in
  review:
    summary: A ROSAH-associated ALPK1 variant is associated with defective primary-cilium assembly.
    action: UNDECIDED
    reason: The full source measures reduced ciliation in fibroblasts from two p.Thr237Met patients against
      one unaffected control after serum starvation, with three replicate experiments. Endogenous human
      ALPK1 localizes to the ciliary base, but localization and the patient phenotype do not resolve whether
      normal ALPK1 performs cilium-assembly work or whether altered signaling by the gain-of-function
      variant disrupts ciliogenesis. The HeLa wild-type/mutant overexpression comparison measures multinucleation
      rather than cilium assembly; no wild-type loss/rescue ciliation assay was identified in the inspected
      source. Preserve the positive mutant phenotype and curated IMP assertion, with an unresolved judgment
      about normal process participation. A dedicated ciliary enzyme or mapped substrate is not required
      in principle for such participation.
    supported_by:
    - reference_id: PMID:30967659
      supporting_text: Affected family member fibroblasts demonstrated defective ciliogenesis.
      full_text_unavailable: false
    - reference_id: PMID:30967659
      supporting_text: Super-resolution confocal imaging showed the presence of ALPK1 in the base of primary
        cilia
      full_text_unavailable: false
- term:
