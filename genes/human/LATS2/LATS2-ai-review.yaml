core_functions:
- description: >-
    Cytosolic Hippo kinase that phosphorylates YAP1 and WWTR1/TAZ on inhibitory serines, including YAP1
    S127 and TAZ S89, after activation by MOB1 and MST1/2. This reaction links cell-density and upstream
    Hippo inputs to 14-3-3-dependent cytoplasmic retention of YAP/TAZ and repression of TEAD transcriptional
    output.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0035329
    label: hippo signaling
  - id: GO:0060243
    label: negative regulation of cell growth involved in contact inhibition
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by: *id004
suggested_questions:
- question: >-
    How should curation distinguish LATS2-specific versus redundant LATS1/2 effects for substrates
    reported only as targets of both paralogs?
- question: >-
    Which nuclear LATS2 reactions, including AR modulation or nuclear CRL4-DCAF1 regulation, warrant
    direct GO-CAM modeling rather than broad signaling annotations?
suggested_experiments:
- hypothesis: LATS1 and LATS2 are not fully redundant for the MTOC NLRP3 phosphorylation step.
  description: >-
    Use endogenous LATS1-only and LATS2-only rescue alleles in the same cell background to test
    whether NLRP3 phosphorylation at the MTOC is redundant between the two paralogs or preferentially
    carried by one kinase.
  experiment_type: genetic rescue
- hypothesis: WWC-SAV-MST scaffolds tune LATS2 substrate phosphorylation.
  description: >-
    Measure YAP and TAZ phosphorylation by activated LATS2 reconstituted with MOB1 plus WWC-SAV-MST
    scaffolds to define whether WWC proteins change substrate preference as well as overall kinase
    activity.
  experiment_type: in vitro kinase reconstitution
