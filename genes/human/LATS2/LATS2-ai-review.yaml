- term:
    id: GO:0000922
    label: spindle pole
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1354386
  - PANTHER:PTN004697711
  - UniProtKB:Q9NRM7
  review:
    summary: LATS2 localizes to mitotic centrosome/spindle structures in studies of its mitotic
      function.
    action: KEEP_AS_NON_CORE
    reason: The spindle-pole/mitotic-apparatus localization is supported by the LATS2-Ajuba and G1/S
      studies, which place LATS2 at centrosomes or the mitotic apparatus and connect it to spindle
      organization. This location is real but not the core cytosolic YAP/TAZ phosphorylation site
      captured in the GO-CAM.
    supported_by: &id002
    - reference_id: PMID:12853976
      supporting_text: the LATS2 protein is cytoplasmic during interphase in NIH3T3 cells, while it
        becomes localized to the mitotic apparatus during mitosis
    - &id008
      reference_id: PMID:16413547
      supporting_text: LATS2 was localized to the centrosomes throughout the cell cycle and was
        associated with Ajuba during mitosis
