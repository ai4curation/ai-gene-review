id: Q9NRM7
gene_symbol: LATS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LATS2 is a large AGC/NDR-family protein serine/threonine kinase and tumor-suppressor component of the
  Hippo pathway. Its C-terminal kinase domain phosphorylates HXRXXS motifs on YAP1 and WWTR1/TAZ, including
  YAP1 S127 and TAZ S89. These phosphorylations promote 14-3-3-mediated cytoplasmic sequestration of the
  transcriptional coactivators and thereby repress TEAD-dependent growth programs during cell contact
  inhibition. Upstream Hippo components activate LATS2 through MOB1 binding and MST1/2-dependent hydrophobic-motif
  phosphorylation, with WWC and SAV1 scaffolds helping assemble this module. LATS2 is found in cytosolic,
  nuclear and mitotic centrosome/spindle-associated pools and has additional reported roles in G1/S control,
  androgen receptor repression, spindle organization and NLRP3 inflammasome activation.
