  review:
    summary: LATS2 is a protein serine/threonine kinase in the Hippo cascade and directly
      phosphorylates YAP/TAZ-family substrates.
    action: ACCEPT
    reason: This is the core LATS2 molecular function. LATS2 phosphorylates YAP2 on S127 and other
      HXRXXS serines; WWC proteins and SAV1 organize MST1/2-dependent LATS1/2 activation; Reactome
      models cytosolic MOB1-bound phospho-LATS2 phosphorylating YAP and TAZ.
    supported_by: &id004
    - *id003
    - reference_id: PMID:35429439
      supporting_text: WWC proteins (WWC1/2/3) directly interact with LATS1/2 and SAV1, and SAV1, in
        turn, brings in MST1/2 to phosphorylate and activate LATS1/2
    - reference_id: Reactome:R-HSA-2028583
      supporting_text: Cytosolic phospho-LATS2, complexed with MOB1, catalyzes the phosphorylation
        of YAP on serine residue 127
