  review:
    summary: LATS2 inhibition of the G1/S transition is supported by an early cell-cycle study, but
      it is peripheral relative to the Hippo YAP/TAZ kinase function.
    action: KEEP_AS_NON_CORE
    reason: PMID:12853976 reports that ectopic Lats2 inhibited G1/S transition and reduced cyclin
      E/CDK2 kinase activity. The cell-cycle effect is a supported LATS-family tumor-suppressor
      output rather than the main conserved Hippo kinase reaction.
    supported_by: &id001
    - reference_id: PMID:12853976
      supporting_text: Cell cycle profile analysis demonstrated that ectopic expression of Lats2
        inhibited the G1/S transition
