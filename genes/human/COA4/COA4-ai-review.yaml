suggested_questions:
- question: Should COA4 carry an intracellular copper ion homeostasis annotation (GO:0006878)?
    Reduced mitochondrial or cellular copper is reproducible in yeast coa4-null cells and
    in human COA4 knockout cells (with iron, zinc and manganese unaffected), but it may be
    a downstream consequence of failed cytochrome c oxidase metallation rather than a separate
    role. Comparable copper deficiency is seen in SCO1, SCO2, COX10 and COX15 patient fibroblasts,
    where it is attributed to CTR1 turnover or mislocalization.
  experts:
  - GO copper/metal curation group
  - Gohil lab
- question: What is COA4's actual molecular function? No catalytic activity is established
    and metallochaperone activity is positively excluded. Is it stabilizing COX11, loading
    COX11 with copper, or gating the handoff to COX1? None of the existing data distinguish
    these, and no current GO molecular function term expresses the accessory role well.
  experts:
  - GO molecular function curation group
- question: Does the reciprocal abundance regulation between COA4 and COX11 warrant a protein
    stabilization annotation, or is the COX11 loss in COA4-knockout cells a secondary consequence
    of a stalled assembly intermediate being degraded?
  experts:
  - Gohil lab
suggested_experiments:
- hypothesis: COA4 is required for copper loading of COX11 rather than for COX11 stability
    per se.
  description: Measure copper occupancy of immunopurified COX11 from wild-type and COA4-knockout
    cells by ICP-MS, normalizing to recovered COX11 protein, so that metallation is separated
    from abundance.
  experiment_type: biochemical
- hypothesis: The reduced cellular copper in COA4-deficient cells is secondary to cytochrome
    c oxidase failure, not a direct COA4 role in copper homeostasis.
  description: Quantify CTR1/SLC31A1 abundance and plasma-membrane localization in COA4-knockout
    cells, and test whether the copper deficit is phenocopied by knockout of an unrelated
    late complex IV assembly factor.
  experiment_type: cell biology
- hypothesis: Ptc5-mediated dephosphorylation regulates Coa4 activity in copper delivery.
  description: Map Coa4 phosphosites in yeast, test phospho-null and phospho-mimetic mutants
    for respiratory growth and cytochrome c oxidase assembly, and assay whether the Coa4-Cox11
    interaction is phosphorylation-dependent.
  experiment_type: genetic
