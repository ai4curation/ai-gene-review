core_functions:
- description: Accessory factor of the mitochondrial copper delivery pathway to cytochrome
    c oxidase. COA4 binds the intermembrane-space-facing domain of the copper metallochaperone
    COX11 and is required for COX11-dependent metallation of the CuB site of the mtDNA-encoded
    subunit COX1, acting downstream of COX1 synthesis and hemylation. It is not a copper metallochaperone
    itself. Loss of COA4 destabilizes COX11, lowers mitochondrial copper, sensitizes COX1
    to copper limitation, and depletes complex IV-containing supercomplexes.
