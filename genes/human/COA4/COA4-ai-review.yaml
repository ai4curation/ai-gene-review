- id: PMID:35666203
  title: A yeast suppressor screen links Coa4 to the mitochondrial copper delivery pathway
    for cytochrome c oxidase.
  findings:
  - statement: Overexpression of the copper metallochaperone Cox11 restores Cox1 abundance,
      cytochrome c oxidase assembly and respiration in yeast coa4-null cells, and the rescue
      requires the copper-coordinating cysteines of Cox11 - establishing that the rescue is
      restored copper delivery, not suppression of reactive oxygen species.
    supporting_text: cysteine mutants of Cox11 that are incapable of binding copper, failed
      to rescue the respiratory defect
  - statement: The rescue is unidirectional, placing Coa4 upstream of Cox11 in the copper
      delivery pathway to the CuB site of Cox1.
    supporting_text: suggests that Coa4 acts upstream of Cox11 in the copper delivery pathway
  - statement: Coa4 is not a copper metallochaperone - it lacks the copper-binding cysteine
      motif of Cox17, and its deletion phenotype is far milder than that of the bona fide
      chaperones.
    supporting_text: Importantly, Coa4 lacks the copper-binding cysteine motif that is found
      in Cox17, further negating its metallochaperone role
  - statement: Human COA4 complements the yeast coa4-null mutant, establishing that the function
      is evolutionarily conserved and licensing transfer of the yeast mechanism to the human
      protein.
    supporting_text: we demonstrate that human COA4 can replace the function of yeast Coa4
      indicating its evolutionarily conserved role
  - statement: The authors explicitly could not detect a physical Coa4-Cox11 interaction by
      co-immunoprecipitation/mass spectrometry, leaving the genetic interaction unexplained
      at the biochemical level. This is the gap closed by the 2026 MitoMatch study using chemical
      crosslinking.
    supporting_text: Our initial attempts to detect protein:protein interaction between Cox11
      and Coa4 via coimmunoprecipitation/mass spectrometry experiments were not successful
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached. The strongest prior functional evidence
      for COA4, and the direct antecedent of the 2026 interaction work.
