description: COA4 (cytochrome c oxidase assembly factor 4 homolog, formerly CHCHD8/E2IG2)
  is a small (87 aa) twin CX9C protein of the mitochondrial intermembrane space. Its CHCH
  fold is stabilized by two disulfides and it is imported by the MIA40/CHCHD4 disulfide-relay
  pathway characteristic of this family. COA4 acts as an accessory factor in the mitochondrial
  copper delivery pathway to cytochrome c oxidase (complex IV), where it binds the intermembrane-space-facing
  domain of the copper metallochaperone COX11 and is required for COX11-dependent metallation
  of the CuB site of the mtDNA-encoded subunit COX1. It is not itself a copper metallochaperone
  - it lacks the copper-coordinating cysteine motif of COX17, and its loss produces a milder
  defect than loss of the bona fide chaperones. Loss of COA4 destabilizes COX11, lowers mitochondrial
  copper without affecting iron, zinc or manganese, sensitizes COX1 to copper limitation,
  depletes complex IV-containing supercomplexes, and reduces respiration. The function is
  conserved - human COA4 complements the yeast coa4-null mutant, and yeast coa4 deletion causes
  cytochrome c oxidase deficiency and reduced mitochondrial copper. No catalytic activity
  has been established for COA4, and its precise molecular role - stabilizing COX11, loading
  it with copper, or gating handoff to COX1 - remains undetermined.
