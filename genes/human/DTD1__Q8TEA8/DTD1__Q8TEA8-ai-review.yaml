id: Q8TEA8
gene_symbol: DTD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DTD1 (D-aminoacyl-tRNA deacylase 1; also called DUE-B) is the human member of the canonical
  DTD1 family of free-standing, trans-acting tRNA proofreading enzymes (PANTHER PTHR10472:SF5),
  which is conserved from bacteria to vertebrates. The 209-residue protein forms a homodimer of
  an N-terminal DTD-like fold (residues ~1-146, crystal structure PDB 2OKV) with active sites at
  the dimer interface. It hydrolyses the ester bond of D-aminoacyl-tRNAs to release free tRNA and
  the D-amino acid. Chiral selectivity depends on a conserved cross-subunit Gly-cisPro dipeptide
  (Gly139-Pro140 in the NxGP(V/F)T motif), which excludes L-aminoacyl-tRNAs but admits achiral
  glycine. In family members this lets the enzyme also clear glycine mischarged onto tRNA(Ala) by
  alanyl-tRNA synthetase. Purified human DTD1 core has D-aminoacyl-tRNA deacylase activity in vitro.
  Knockdown of DTD1 in human cells makes them more sensitive to D-tyrosine, D-aspartate and
  D-serine, and overexpression protects them. Human DTD1 is found in the cytoplasm, around the
  nuclear envelope and in the nucleus, and has been detected in mitochondrial proteome surveys.
  Vertebrate DTD1 also carries a disordered C-terminal extension of about 60 residues that is
  absent from yeast and bacterial orthologs. One laboratory has reported that this extension binds
  DNA in vitro, that it is phosphorylated in a cell-cycle-dependent way (Cdc7, PP2A), and that the
  protein binds the DNA-unwinding elements of replication origins, interacts with Cdc45, TopBP1
  and Treslin, and is needed to load Cdc45 onto chromatin. These replication functions are not
  shared with the conserved family.
