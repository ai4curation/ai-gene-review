core_functions:
- description: >-
    Chiral proofreading of aminoacyl-tRNAs. DTD1 homodimers hydrolyse the ester bond of
    D-aminoacyl-tRNAs, releasing free tRNA and the D-amino acid. The cross-subunit Gly-cisPro
    dipeptide excludes L-aminoacyl-tRNAs. This prevents D-amino acids from entering proteins and
    keeps the tRNA pool available for translation. Deacylase activity has been measured directly
    for the human enzyme. Its role in protecting cells from D-Tyr, D-Asp and D-Ser has been shown
    in human cell lines, where tRNA(Tyr) is the substrate implicated.
  molecular_function:
