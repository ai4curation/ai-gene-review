    id: GO:0003677
    label: DNA binding
  evidence_type: EXP
  original_reference_id: PMID:17264083
  qualifier: enables
  review:
    summary: In vitro DNA binding by recombinant human DUE-B/DTD1. Binding requires the disordered,
      vertebrate-specific C-terminal extension, which becomes ordered when DNA is present.
    action: KEEP_AS_NON_CORE
    reason: This is a direct experimental annotation on human DTD1, and the abstract states the result.
      It is kept. It is not core because the binding depends on a lineage-specific C-terminal extension,
