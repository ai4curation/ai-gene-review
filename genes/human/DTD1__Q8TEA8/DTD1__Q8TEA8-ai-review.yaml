suggested_questions:
- question: Is the DNA-replication role reported for DUE-B (origin DUE binding, Cdc45/TopBP1/Treslin
    interaction, Cdc45 loading) reproducible outside the original laboratory? Does it need the C-terminal
    extension alone, or also the deacylase dimer? DUE-B could not replace Sld3 in fission yeast (PMID:22380713), so the role, if real, would be vertebrate-specific.
- question: Does human DTD1 deacylate Gly-tRNA(Ala) without attacking human cytosolic or mitochondrial
    Gly-tRNA(Gly)? Which discriminator-base (N73) preference does the human enzyme show?
- question: What fraction of human DTD1 is inside mitochondria, and how is it imported without a predicted
    presequence?
- question: Is the ATPase activity reported for the human DUE-B core intrinsic to DTD1, or is it a co-purifying
    contaminant? Activity was reported for the purified core, but no catalytic residues for ATP hydrolysis have been identified.
suggested_experiments:
- description: Measure kinetics of recombinant full-length human DTD1, and of a Gly139Ala/Pro140Ala
    mutant, on D-Tyr-tRNA(Tyr), Gly-tRNA(Ala) and Gly-tRNA(Gly) carrying human tRNA bodies. This would
    confirm the inferred Gly-tRNA(Ala) activity and its discrimination by the human enzyme.
- description: Rescue DTD1-knockout human cells with wild-type DTD1, a catalytic-site mutant or a C-terminal
    truncation (deleting residues 147-209), and score D-amino-acid sensitivity, Gly-for-Ala misincorporation
    (mass spectrometry) and Cdc45 chromatin loading. This would separate the editing function from the
    replication function.
- description: Use protease-protection and submitochondrial fractionation to test whether DTD1 is imported
    into the mitochondrial matrix.
