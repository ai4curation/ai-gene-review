  review:
    summary: DTD1 is in the MitoCoP high-confidence human mitochondrial proteome, which was built from
      subtractive, spatial and import proteomics.
    action: KEEP_AS_NON_CORE
    reason: This is a high-throughput assignment of a protein that is also clearly cytoplasmic and nuclear.
      The cached text does not show what fraction of DTD1 is mitochondrial, and DTD1 has no recognizable
      mitochondrial targeting sequence. A share of the protein in mitochondria is plausible, because
      a single DTD1 serves both compartments in opisthokonts. It is kept as a secondary location until
      targeted (for example protease-protection) experiments are done.
