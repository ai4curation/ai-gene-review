- description: >-
    Clearance of glycine mischarged onto tRNA(Ala) by alanyl-tRNA synthetase. Glycine is achiral,
    so the L-chiral-rejection pocket does not exclude it. This activity is shown experimentally for
    vertebrate (zebrafish), insect and Plasmodium members of the same PANTHER subfamily. It is
    inferred for human DTD1, which has the same active-site motifs, but has not been assayed with
    the human enzyme.
