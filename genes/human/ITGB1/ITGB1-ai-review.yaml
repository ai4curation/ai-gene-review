- id: PMID:20479219
  title: Ancient origin of the integrin-mediated adhesion and signaling machinery.
  findings:
  - statement: Capsaspora owczarzaki has four integrin beta and four integrin alpha genes; Amastigomonas
      has one of each.
    supporting_text: we found four integrin β and four integrin α genes in C. owczarzaki
  - statement: Choanoflagellates and fungi lack integrin alpha and beta, presumably by independent loss.
    supporting_text: Integrin α and β and several other components of the integrin adhesion complex are
      absent from choanoflagellates and fungi and were presumably lost independently in these lineages.
  - statement: Non-metazoan integrin beta subunits conserve the cation-binding motifs and the cytoplasmic
      NPXY motif.
    supporting_text: are well conserved in the different nonmetazoan integrin β, except for C. owczarzaki
      integrin β4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; primary source for the premetazoan origin of integrin beta and its loss
      in choanoflagellates.
- id: PMID:32857975
  title: Integrin-Mediated Adhesion in the Unicellular Holozoan Capsaspora owczarzaki.
  findings:
  - statement: Capsaspora adheres to substrate through actin-dependent filopodia containing integrin beta2
      and vinculin patches; an anti-integrin beta2 antibody inhibits adhesion to fibronectin.
    supporting_text: We show that integrin β2 and its associated protein vinculin localize as distinct
      patches in the filopodia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. Integrin beta2 is a Capsaspora paralog from a lineage-specific
      expansion, not an ITGB1 ortholog; the evidence is for the integrin beta family.
core_functions:
- description: 'Extracellular matrix adhesion receptor: as the beta subunit of alpha/beta1 heterodimers,
    binds fibronectin, collagens and laminins (ligand binding shared with the alpha subunit and dependent
    on MIDAS/ADMIDAS cations) to attach cells to the matrix at focal adhesions. Ancestral for the integrin
    beta family: Capsaspora integrin beta2 mediates substrate adhesion.'
  molecular_function:
    id: GO:0004895
    label: cell adhesion receptor activity
  directly_involved_in:
  - id: GO:0007160
    label: cell-matrix adhesion
  - id: GO:0033627
    label: cell adhesion mediated by integrin
  locations:
  - id: GO:0005925
    label: focal adhesion
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008305
    label: integrin complex
  supported_by:
  - reference_id: PMID:22451694
    supporting_text: Integrin α5β1 is a major cellular receptor for the extracellular matrix protein fibronectin
      and plays a fundamental role during mammalian development.
  - reference_id: PMID:10655584
    supporting_text: activation of endogenous EphA2 kinase induces an inactive conformation of integrins
      and inhibits cell spreading, migration and integrin-mediated adhesion
  - reference_id: PMID:33962943
    supporting_text: key interactions centered at R1445 and Y1446 of FN and D137 of ADMIDAS in β1 βI domain
      provide an additional anchoring point that triggers the opening of α5β1
  - reference_id: PMID:32857975
    supporting_text: using a specific antibody for integrin β2, we inhibited cell adhesion to a fibronectin-coated
      surface
- description: Fibronectin binding by alpha5beta1 (and other beta1 heterodimers), with the beta1 betaI
    ADMIDAS contacting fibronectin FN10; the ligand-receptor step of fibronectin-dependent adhesion, migration
    and fibrillogenesis. Capsaspora adhesion is enhanced by mammalian fibronectin in assays, but its native
    ligand is unknown.
  molecular_function:
