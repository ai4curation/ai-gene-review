    label: integrin alpha5-beta1 complex
  supported_by:
  - reference_id: PMID:33962943
    supporting_text: key interactions centered at R1445 and Y1446 of FN and D137 of ADMIDAS in β1 βI domain
      provide an additional anchoring point that triggers the opening of α5β1
  - reference_id: PMID:26763945
    supporting_text: The data indicate that FAK is directly recruited by integrin β1 and the subsequent
      FAK activation is required for fibroblast migration on fibronectin.
- description: 'Cytoplasmic-tail adaptor binding that links the receptor to actin and to signalling: the
    beta1 tail binds talin (NPxY region; inside-out activation and actin linkage), filamin, ICAP-1 and
    kinases (FAK, Abl2), initiating integrin-mediated signalling. The NPxY motif is conserved in Capsaspora
    integrin betas, so the talin link is plausibly ancestral.'
  molecular_function:
    id: GO:1990147
    label: talin binding
