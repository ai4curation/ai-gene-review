    supporting_text: the interaction between integrin and talin was greatly enhanced by PI4,5P(2)-induced
      talin activation
  - reference_id: PMID:21134644
    supporting_text: revealing marked structural diversity in the contacts between β1A, β1D, and β3 tails
      and the Talin1 and Talin2 isoforms
  - reference_id: PMID:20479219
    supporting_text: Other key motifs in metazoan integrin β proteins are the cytoplasmic integrin α-interacting
      motif and the NPXY motif, which plays a key role in protein interactions
suggested_questions:
- question: Capsaspora has four integrin beta paralogs from a lineage-specific expansion. Which of them,
    if any, bind the Capsaspora talin FERM head through their NPxY motifs, and which native Capsaspora
    ligand do they bind in place of fibronectin?
- question: Did the ancestral holozoan integrin beta already use divalent-cation (MIDAS/ADMIDAS) dependent
    ligand binding, given that these sites are conserved in Capsaspora beta1-3 but not beta4?
- question: Choanoflagellates lost integrins. What, if anything, replaced integrin-mediated substrate
    adhesion in that lineage, and what do its retained talin and vinculin homologs do?
- question: Should integrin-family IBA process terms such as cell-cell adhesion and synapse (PTN000801545,
    PTN002560762) be placed on nodes restricted to animals, given that the pre-metazoan evidence supports
    only cell-substrate adhesion?
suggested_experiments:
- experiment_type: Cross-species complementation
  description: Express Capsaspora integrin beta1-3 (with or without their NPxY motifs) in ITGB1-null mammalian
    fibroblasts with a matched alpha subunit and test surface expression, adhesion and spreading on fibronectin,
    collagen and laminin, and talin recruitment.
- experiment_type: Ligand identification
  description: Use Capsaspora integrin beta2 ectodomain pull-downs from Capsaspora secreted material and
    cation (Mn2+/EDTA) dependence to identify the native substrate ligand used during the adherent stage.
