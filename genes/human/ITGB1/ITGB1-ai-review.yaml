description: 'Integrin beta-1 (CD29) is a single-pass type I transmembrane glycoprotein that forms non-covalent
  heterodimers with twelve integrin alpha subunits (alpha1-alpha11 and alphaV), making beta1 integrins
  the largest integrin subfamily. The heterodimers are cell adhesion receptors for extracellular matrix
  proteins: collagens (alpha1, alpha2, alpha10, alpha11 beta1), laminins (alpha3, alpha6, alpha7 beta1),
  fibronectin (alpha5beta1 above all, also alpha4, alpha8 and alphaV beta1) and fibrillin-1, and for cell-surface
  counter-receptors such as VCAM1 (alpha4beta1, alpha9beta1). Ligand binding at the alpha/beta head depends
  on divalent cations held at the MIDAS, ADMIDAS and SyMBS sites of the beta1 betaI domain. The short
  cytoplasmic tail, with its NPxY motifs, binds talin, kindlin, filamin, ICAP-1 and kinases such as FAK
  and Abl2, coupling the receptor to the actin cytoskeleton at focal adhesions and allowing bidirectional
  (inside-out activation and outside-in) signalling. Beta1 integrins are endocytosed and recycled to the
  leading edge, support cell spreading and migration, and act in many tissue-level processes including
  angiogenesis, leukocyte adhesion, myogenesis (the muscle isoform beta1D at costameres) and osteoclast
  function; several viruses and microbes use beta1 integrins as entry receptors. Integrin beta subunits
  predate animals: the unicellular holozoan Capsaspora owczarzaki has four integrin beta genes with conserved
  cation-binding sites and NPxY motifs, and it adheres to substrate through actin-rich filopodia in which
  integrin beta2 and vinculin form patches, whereas choanoflagellates have lost integrins.'
