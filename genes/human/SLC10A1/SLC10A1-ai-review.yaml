  review:
    summary: 'Human NTCP is the cellular entry receptor for hepatitis B virus and its satellite hepatitis
      D virus: the preS1 receptor-binding region of the large envelope protein cross-links specifically
      to NTCP, silencing NTCP blocks infection, and ectopic NTCP renders non-susceptible hepatoma cells
      susceptible [PMID:23150796]. Cryo-EM structures show the preS1 determinant residues exposed on the
      outward-open transporter [PMID:35545671].'
