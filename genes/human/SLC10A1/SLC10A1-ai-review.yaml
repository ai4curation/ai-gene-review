  review:
    summary: Response to nutrient levels, transferred automatically from rat Ntcp (UniProtKB:P26435).
      The donor annotation reflects changes in rat Ntcp expression/activity under altered nutritional
      states, not a function SLC10A1 executes within that response.
    action: REMOVE
    reason: This is an expression-response annotation propagated as process participation. SLC10A1 is
      the transporter whose abundance is modulated; it does none of the work of sensing or responding
      to nutrient levels, and no step of that response is catalysed or structurally enabled by NTCP. The
