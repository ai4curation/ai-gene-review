suggested_questions:
- question: Should NTCP-mediated uptake of non-bile-acid substrates (estrone-3-sulfate, rosuvastatin)
    be captured as a distinct molecular function annotation, and if so with which transporter-activity
    term, now that the generic organic anion transport terms have been obsoleted?
- question: Does GO wish to record substrate scope for multispecific carriers via has_input extensions
    on the transporter activity annotation, rather than through process terms such as cellular response
    to xenobiotic stimulus?
- question: NTCP forms homodimers and heteromers with SLC10A4/SLC10A6 that modulate its surface delivery
    [PMID:22029531]. Is there sufficient evidence for a protein-containing complex annotation, given that
    individual subunits are reported to be independently functional?
suggested_experiments:
- description: Quantitative substrate profiling of purified human NTCP reconstituted in proteoliposomes
    to delimit the physiological substrate range (bile salts vs sulfated steroids vs drugs) and the sodium
    stoichiometry for each substrate class.
- description: Structure-guided separation-of-function mutants that abolish preS1 binding while retaining
    bile salt symport (and vice versa), to test whether the receptor and transport functions can be uncoupled
    and to support distinct GO annotations for each.
- description: Hepatocyte-specific conditional Slc10a1 models with bile salt flux measurements under defined
    nutritional and hormonal states, to determine whether the reported nutrient-, estrogen- and ethanol-responsiveness
    of the transporter reflects anything beyond regulation of its expression.
