- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:40355756
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N6S5
  review:
    summary: Interaction-proteomics survey of 396 solute carriers reports SLC10A1 in a complex with UniProtKB:Q8N6S5
      [PMID:40355756]; the annotation uses only the generic protein binding term.
    action: REMOVE
    reason: As with the HuRI rows, GO:0005515 conveys no functional information. The cited study is an
      affinity-proteomics survey whose stated aim is a global map of SLC-protein interactions rather than
      functional assignment [PMID:40355756], and it provides no basis for a specific molecular-function
      term for SLC10A1. Removal is a statement about the uninformativeness of the term, not about the
      validity of the interaction.
    supported_by:
    - reference_id: PMID:40355756
      supporting_text: "We aimed at obtaining \na global survey of the SLC-protein interaction landscape\
        \ and mapped the \nprotein-protein interactions of 396 SLCs by interaction proteomics."
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1201406
  - PANTHER:PTN000040759
  - RGD:3681
  - RGD:3682
  - UniProtKB:Q14973
  - UniProtKB:Q96EP9
  review:
    summary: PAINT places plasma-membrane activity for the NTCP/ASBT clade of SLC10 transporters; SLC10A1
      inherits it. This matches the direct human and rodent evidence that NTCP functions in the hepatocyte
      basolateral plasma membrane [PMID:34060352, PMID:22029531].
    action: ACCEPT
    reason: 'The node placement is sound: sodium-dependent bile salt uptake is by definition a plasma-membrane
      activity, and human NTCP is directly shown to reside and act there (FRET of labelled subunits at
      the plasma membrane [PMID:22029531]; loss-of-function variants act by failing to reach the plasma
      membrane [PMID:24867799, PMID:14660639]). GO:0016323 basolateral plasma membrane is the more precise
      location and is separately annotated, so this parent term is appropriately retained alongside it.'
    supported_by:
    - reference_id: PMID:22029531
      supporting_text: FRET (fluorescence resonance energy transfer) using fluorescently labelled subunits
        further demonstrated that dimerization persists at the plasma membrane.
    - reference_id: PMID:24867799
      supporting_text: Immunofluorescence studies and surface biotinylation experiments demonstrated that
        the mutant protein is virtually absent from the plasma membrane.
    - reference_id: PMID:34060352
      supporting_text: The Na+/taurocholate cotransporting polypeptide (NTCP) is located in the basolateral
        membrane of hepatocytes, where it transports bile acids from the portal blood back into hepatocytes.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000040759
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral SLC10 node for which plasma-membrane localization is experimentally grounded
          in both the human and rodent descendants.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:22029531
  qualifier: located_in
  review:
    summary: 'Direct assay: FRET between differentially tagged NTCP subunits showed that NTCP dimers are
      present at the plasma membrane of NTCP-expressing cells [PMID:22029531].'
    action: ACCEPT
    reason: Localization of human NTCP to the plasma membrane is directly demonstrated in this study,
      and the same study shows that plasma-membrane abundance determines taurocholate uptake capacity
      [PMID:22029531]. This is the correct location for the gene's core transport activity.
    supported_by:
    - reference_id: PMID:22029531
      supporting_text: FRET (fluorescence resonance energy transfer) using fluorescently labelled subunits
        further demonstrated that dimerization persists at the plasma membrane.
    - reference_id: PMID:22029531
      supporting_text: Expression of SLC10A4 and NTCP Y307X resulted in a reduction of NTCP abundance
        at the plasma membrane and NTCP-mediated taurocholate uptake
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: Automatic mapping from the UniProt subcellular-location vocabulary (SL-0039, cell membrane)
      to GO:0005886.
    action: ACCEPT
    reason: 'The underlying UniProt location assignment is correct: human NTCP is a plasma-membrane bile
      salt carrier, directly shown at the plasma membrane [PMID:22029531] and in the hepatocyte basolateral
      membrane [PMID:34060352]. The term is less precise than GO:0016323 but is not wrong, and GOA keeps
      both.'
    supported_by:
    - reference_id: PMID:22029531
      supporting_text: FRET (fluorescence resonance energy transfer) using fluorescently labelled subunits
        further demonstrated that dimerization persists at the plasma membrane.
    - reference_id: PMID:34060352
      supporting_text: The Na+/taurocholate cotransporting polypeptide (NTCP) is located in the basolateral
        membrane of hepatocytes, where it transports bile acids from the portal blood back into hepatocytes.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: PMID:8132774
  qualifier: located_in
  review:
    summary: Author statement from the cloning paper, which expressed human NTCP at the surface of Xenopus
      oocytes and measured Na+-dependent taurocholate uptake [PMID:8132774].
    action: ACCEPT
    reason: Uptake of taurocholate by cRNA-injected oocytes requires the transporter to be in the plasma
      membrane [PMID:8132774], and subsequent direct work confirms the plasma-membrane localization of
      human NTCP [PMID:22029531].
    supported_by:
    - reference_id: PMID:8132774
