  review:
    summary: By acting as the preS1-binding entry receptor, NTCP mediates entry of HBV and HDV into hepatocytes;
      NTCP knockdown abolishes and NTCP expression confers infection [PMID:23150796]. Humanizing residues
      157-165 of the non-functional monkey orthologue is sufficient to support both viral infections [PMID:23150796].
    action: NEW
    reason: 'Participation test: NTCP performs a step of viral entry rather than merely being required
      for it — it is the surface receptor that engages the viral envelope determinant, and the conformational
      state of the transporter governs preS1 recognition [PMID:35545671]. Comparator check: ACE2 (UniProtKB:Q9BYF1)
      and CD4 (UniProtKB:P01730) both carry GO:0046718 for the same receptor role, so this is the conventional
      process term for host entry receptors rather than an idiosyncratic addition. Proposed as non-core
      relative to bile salt uptake: it is a host-pathogen interaction exploited by the virus, not the
      physiological role for which the transporter evolved.'
