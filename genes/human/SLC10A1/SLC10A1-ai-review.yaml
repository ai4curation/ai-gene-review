- id: Reactome:R-HSA-194121
  title: SLC10A1 co-transport bile salts and Na+ from extracellular region to cytosol
  findings:
  - statement: A bile salt and two sodium ions are transported into the cytosol by NTCP in the plasma
      membrane.
    supporting_text: A molecule of extracellular bile salt (glyco- or taurocholate, or glyco- or taurochenodeoxycholate)
      and two sodium ions are transported into the cytosol, mediated by NTCP (Na+ / taurocholate cotransporter)
      in the plasma membrane.
- id: Reactome:R-HSA-159418
  title: Recycling of bile acids and salts
  findings:
  - statement: Hepatocyte uptake of bile salts returning in portal blood is mediated by SLC10A1 (NTCP).
    supporting_text: uptake by hepatocytes mediated by Na+-taurocholate transporting protein (NTPC - SLC10A1)
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0PK00
  review:
    summary: High-throughput binary interaction screen (HuRI) reports an interaction between SLC10A1 and
      this partner [PMID:32296183]. The annotation records only the generic term protein binding and carries
      no information about SLC10A1's molecular function.
    action: REMOVE
    reason: 'GO:0005515 protein binding is uninformative: it states that a binding event was observed
      without identifying what SLC10A1 does. The source is a systematic proteome-scale Y2H map [PMID:32296183],
      which assigns no function to either partner, and nothing in it supports a more specific molecular-function
      term for SLC10A1. Removing the annotation does not assert that the reported interaction is false;
      it removes a row that adds no functional knowledge beyond SLC10A1''s well-established role as the
      sodium-dependent hepatic bile salt uptake carrier [PMID:35545671, PMID:24867799].'
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all'
    - reference_id: PMID:35545671
      supporting_text: 'Human

        Na+-taurocholate co-transporting polypeptide (NTCP) is the main bile salt uptake

        system in liver.'
