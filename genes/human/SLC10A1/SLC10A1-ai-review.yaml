core_functions:
- description: Sodium-coupled import of conjugated and unconjugated bile salts across the hepatocyte basolateral
    plasma membrane. Human NTCP co-transports a bile salt with two Na+ ions using a gated-pore mechanism,
    with high affinity for taurocholate (Km ~6-15 uM).
