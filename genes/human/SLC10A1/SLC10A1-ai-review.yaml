id: Q14973
gene_symbol: SLC10A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC10A1 (NTCP, Na+/taurocholate cotransporting polypeptide) is the principal sodium-dependent
  bile salt uptake carrier of the mammalian liver. It is a multi-pass membrane protein of the bile acid:sodium
  symporter (BASS) family that resides in the basolateral (sinusoidal) plasma membrane of hepatocytes,
  where it imports conjugated and unconjugated bile salts from portal blood into the hepatocyte in co-transport
  with two sodium ions, driven by the inward sodium gradient [PMID:8132774, PMID:34060352, PMID:35545671].
  Cryo-EM structures show a gated-pore mechanism in which the transporter opens a wide transmembrane pathway
  for the bile salt [PMID:35545671]. Substrate specificity is broad for a bile salt carrier and extends
  to non-bile-acid organic anions such as estrone-3-sulfate and to drugs including rosuvastatin, so the
  protein also contributes to hepatic clearance of organic anions and xenobiotics [PMID:14660639, PMID:9458785,
  PMID:34060352]. NTCP forms homodimers (and heterocomplexes with other SLC10 family members) in which
  individual subunits are independently functional, and heteromeric assembly can limit its delivery to
  the plasma membrane [PMID:22029531]. By performing the hepatocyte uptake step, SLC10A1 is one of the
  central transporters of enterohepatic bile salt cycling [PMID:33222321]. Human loss of function causes
  NTCP deficiency, characterized by extreme conjugated hypercholanemia with a mild and largely non-hepatic
  clinical phenotype, bile salt synthesis and intestinal FGF19 signalling remaining intact [PMID:24867799].
  Independently of its transport role, human NTCP is the cell-surface entry receptor for hepatitis B and
  hepatitis D virus, binding the preS1 domain of the large viral envelope protein, which makes it a major
  antiviral drug target [PMID:23150796, PMID:35545671].
references:
- id: PMID:8132774
  title: Molecular cloning, chromosomal localization, and functional characterization of a human liver
    Na+/bile acid cotransporter.
  findings:
  - statement: Human NTCP cDNA encodes a 349-residue glycoprotein that, when expressed in Xenopus oocytes,
      mediates saturable Na+-dependent taurocholate uptake with apparent Km ~6 uM.
    supporting_text: Saturation kinetics indicated that the human NTCP has a higher affinity for taurocholate
      (apparent Km = 6 microM) than the previously cloned rat protein (apparent Km = 25 microM).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cloning and first functional characterization of human NTCP; directly establishes the
      Na+-dependent bile acid symporter activity annotated by TAS.
- id: PMID:22029531
  title: Homo- and hetero-dimeric architecture of the human liver Na⁺-dependent taurocholate co-transporting
    protein.
  findings:
  - statement: NTCP forms dimers that persist at the plasma membrane, and reducing plasma-membrane NTCP
      abundance reduces NTCP-mediated taurocholate uptake.
    supporting_text: FRET (fluorescence resonance energy transfer) using fluorescently labelled subunits
      further demonstrated that dimerization persists at the plasma membrane.
  - statement: NTCP forms heteromeric complexes with other SLC10 family members in vitro.
    supporting_text: SLC10A4 and SLC10A6 co-immunoprecipitated with NTCP, demonstrating that heteromeric
      complexes can be formed between SLC10A family members in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source of the IDA plasma-membrane and bile acid transporter annotations; abstract-only
      in the cache but the assays named (FRET, co-IP, cross-linking, uptake) support both terms.
- id: PMID:14660639
  title: Ethnicity-dependent polymorphism in Na+-taurocholate cotransporting polypeptide (SLC10A1) reveals
    a domain critical for bile acid substrate recognition.
  findings:
  - statement: NTCP is the key transporter for hepatic uptake of bile acids from the portal circulation;
      the S267F variant loses bile acid uptake while retaining estrone sulfate transport, separating the
      two substrate classes.
    supporting_text: exhibited a near complete loss of function for bile acid uptake yet fully normal
      transport function for the non-bile acid substrate estrone sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes human substrate specificity and that loss-of-function variants can act through
      reduced plasma-membrane expression.
- id: PMID:9458785
  title: Expression and transport properties of the human ileal and renal sodium-dependent bile acid transporter.
  findings:
  - statement: The liver Na+-bile acid cotransporter is multispecific and may participate in hepatic clearance
      of organic anion metabolites and xenobiotics, in contrast to the narrow specificity of the ileal/renal
      transporter.
    supporting_text: 'Whereas the multispecific liver Na(+)-bile acid cotransporter may participate in

      hepatic clearance of organic anion metabolites and xenobiotics, the ileal and

      renal Na(+)-bile acid cotransporter retains a narrow specificity for reclamation

      of bile acids.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primarily about SLC10A2 (ileal ASBT), but its explicit contrast with the multispecific
      liver transporter is the basis for treating organic anion/xenobiotic uptake as a genuine NTCP activity.
- id: PMID:24867799
  title: 'Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia
    without a clear clinical phenotype.'
  findings:
  - statement: SLC10A1 is the major transporter of conjugated bile salts from plasma into the hepatocyte;
      the R252H patient variant fails to reach the plasma membrane and causes extreme plasma hypercholanemia
      without cholestatic liver disease.
    supporting_text: Immunofluorescence studies and surface biotinylation experiments demonstrated that
      the mutant protein is virtually absent from the plasma membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: First description of human NTCP deficiency; the mild phenotype with intact bile salt
      synthesis and FGF19 signalling is also the evidence against nutrient/hormone response process terms.
- id: PMID:34060352
  title: Functional and Pharmacological Comparison of Human and Mouse Na(+)/Taurocholate Cotransporting
    Polypeptide (NTCP).
  findings:
  - statement: NTCP is located in the basolateral membrane of hepatocytes and transports bile acids from
      portal blood into hepatocytes; human NTCP also transports the drug rosuvastatin.
    supporting_text: The Na+/taurocholate cotransporting polypeptide (NTCP) is located in the basolateral
      membrane of hepatocytes, where it transports bile acids from the portal blood back into hepatocytes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Supports the basolateral plasma membrane location and the drug-transport (xenobiotic)
      component of substrate specificity.
- id: PMID:35545671
  title: Structural basis of sodium-dependent bile salt uptake into the liver.
  findings:
  - statement: Cryo-EM structures of human NTCP reveal a gated-pore transport mechanism; the open-to-outside
      state exposes the determinant residues for HBV/HDV preS1 binding.
    supporting_text: 'NTCP undergoes a conformational

      transition opening a wide transmembrane pore that serves as the transport

      pathway for bile salts, and exposes key determinant residues for HBV/HDV binding

      to the outside of the cell.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; links the transport cycle mechanistically to the viral receptor function.
- id: PMID:35580629
  title: Structure of the bile acid transporter and HBV receptor NTCP.
  findings:
  - statement: Establishing HBV infection requires interaction between the large viral envelope glycoprotein
      LHBs and the host entry receptor NTCP, a sodium-dependent bile acid transporter.
    supporting_text: 'For HBV infection to be established, a molecular interaction is required between
      the large glycoproteins

      of the virus envelope (known as LHBs) and the host entry receptor sodium

      taurocholate co-transporting polypeptide (NTCP), a sodium-dependent bile acid

      transporter from the blood to hepatocytes'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent cryo-EM study of human NTCP supporting both the transport and receptor functions.
- id: PMID:35580630
  title: Structural insights into the HBV receptor and bile acid transporter NTCP.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Third 2022 cryo-EM structure of NTCP; cited as corroborating structural evidence for
      the dual transporter/receptor function.
- id: PMID:23150796
  title: Sodium taurocholate cotransporting polypeptide is a functional receptor for human hepatitis B
    and D virus.
  findings:
  - statement: The preS1 receptor-binding region cross-links specifically to NTCP; NTCP silencing inhibits
      HBV/HDV infection and ectopic NTCP expression confers susceptibility on non-susceptible hepatoma
      cells.
    supporting_text: 'Silencing NTCP inhibited HBV and HDV infection, while exogenous

      NTCP expression rendered nonsusceptible hepatocarcinoma cells susceptible to

      these viral infections.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the primary evidence for the proposed virus receptor activity and
      symbiont entry annotations.
- id: PMID:33222321
  title: Targeting the Four Pillars of Enterohepatic Bile Salt Cycling; Lessons From Genetics and Pharmacology.
  findings:
  - statement: NTCP deficiency presents with extremely elevated plasma bile salts (up to 1,500 uM) but
      without jaundice, pruritus or liver dysfunction.
    supporting_text: The most prominent biochemical feature was the extremely elevated total bile salt
      level in plasma (up to 1,500
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review placing NTCP as one of the four transport pillars of enterohepatic cycling; used
      for pathway context, not for primary functional claims.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: HuRI systematic yeast two-hybrid map; correctly cited but functionally uninformative,
      and the source of 87 generic protein binding rows recommended for removal.
- id: PMID:40355756
  title: The solute carrier superfamily interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Interaction-proteomics survey of 396 SLCs; correctly cited but assigns no molecular
      function to SLC10A1.
