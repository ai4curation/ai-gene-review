suggested_experiments:
- hypothesis: A nuclear FYB1 pool is conditional rather than a universal property inferred from motifs.
  experiment_type: Endogenous localization with orthogonal fractionation controls
  description: Measure endogenous FYB1 across cell states with nuclear and cytosolic purity controls and
    a specificity control for the detection reagent.
- hypothesis: Documented FYB1 sequence differences alter specific assembly or recruitment steps.
  experiment_type: Matched product complementation and localization
  description: Compare sequence-verified products at controlled expression, measuring SLP-76/SKAP assembly,
    membrane recruitment and adhesion responses while keeping engineered fragments separate.
suggested_questions:
- question: Which cellular conditions, if any, produce a directly demonstrated nuclear FYB1 pool? The
    documented nuclear motifs and prediction do not establish a localization experiment.
- question: How do the three documented FYB1 sequences differ in signaling assembly, membrane recruitment
    and lipid binding? Historical short/long proteins and engineered fragments do not establish all current
    product-specific functions.
- question: What is the exact FYB1 comparison supporting the four-partner assertion in PMID:27335501?
    The accessible original abstract foregrounds FYB2/ARAP; the FYB1 target experiment remains unverified.
