id: O15117
gene_symbol: FYB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FYB1, also called ADAP, is an intracellular nonenzymatic adaptor that coordinates immune-receptor
  signaling with cell adhesion and actin organization. Its interaction motifs assemble FYN, SLP-76, SKAP
  adaptors and actin-regulatory proteins, and help recruit Rap1-associated machinery to the plasma membrane.
  Helically extended SH3 domains bind acidic phospholipids. FYB1 occupies cytosolic, membrane-associated
  and actin-associated pools, with additional junctional localization in specialized cells. Three protein
  sequences are documented; their distinct functional contributions remain incompletely resolved.
