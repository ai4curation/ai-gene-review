core_functions:
- description: Noncatalytic organization of signaling partners couples T-cell receptor responses to membrane
    recruitment and cytoskeletal adhesion machinery. Human interaction and localization experiments support
    the adaptor mechanism; mouse platelet experiments independently establish outside-in integrin signaling
    under shear.
