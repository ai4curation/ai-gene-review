- question: 'For GOA: the GO:0008157 row is coded IDA with an empty WITH/FROM, but the underlying experiment
    is a co-immunoprecipitation between two transfected tagged plasmids. Should it be IPI with the PP1
    catalytic subunit recorded in WITH/FROM? As it stands the partner - the only informative part of a
    binding annotation - is not machine-readable anywhere in the record.'
  experts:
  - GOA curators
- question: 'For GOA and UniProt: the GO:0005576 IEA row cites GO_REF:0000120, the combined-multiple-IEA-methods
    reference whose purpose is to record that independent pipelines agreed. Its WITH/FROM names three
    tokens, but all three reduce to one source: mouse Q9D1K7, the same protein''s Ensembl identifier,
    and UniProtKB-SubCell:SL-0243, which on the human entry is itself asserted as ECO:0000250 by similarity
    to that same mouse protein. Should the combined reference distinguish pipelines that reached a conclusion
    independently from pipelines that re-read each other''s output? At present a reader has no way to
    tell which kind of agreement a GO_REF:0000120 row records.'
  experts:
  - GOA curators
  - UniProt curators
- question: 'For UniProt: the Q9GZN8 entry still carries DR GO; GO:0005615; C:extracellular space, and
    GO:0005615 was obsoleted on 2026-03-06 as representing the same concept as GO:0005576 extracellular
    region. GOA has already moved to GO:0005576, so the cross-reference in the UniProt entry is stale.'
  experts:
  - UniProt curators
- question: 'For UniProt: would a CAUTION or a note on the non-classical secretion route be warranted?
    The entry carries the Secreted keyword with no SIGNAL feature, which reads as an omission, whereas
    it is a measured property - brefeldin A and monensin increase rather than block secretion, the mature
    chain begins at an N-acetylated residue 2, and the authors of PMID:36496438 had to graft a heterologous
    signal peptide onto the construct to purify secreted protein. Recording the route would stop future
    readers treating the missing signal peptide as evidence against secretion.'
  experts:
  - UniProt curators
- question: 'For GO: no term exists for positive regulation of adaptive thermogenesis; the regulation
    branch stops at the cold-induced child. Filed in full under proposed_new_terms.'
  experts:
  - GO Central curators
- question: 'For GO curators comparing adipokines: ADIPOQ and LEP both carry GO:0005179 hormone activity,
    and ADIPOQ additionally GO:0005125 cytokine activity, whereas the molecular function proposed here
    for ADISSP is GO:0048018 receptor ligand activity. The two are not alternatives: GO:0005179 is a verified
    descendant of GO:0048018 (checked against QuickGO - GO:0048018, GO:0140677, GO:0098772 and GO:0030545
    are all in GO:0005179''s is_a/part_of ancestor closure, and GO:0005102 and GO:0005488 are not), so
    the parent was chosen deliberately. GO:0048018 asserts only what has been measured - engagement of
    a receptor with a consequence for that receptor''s output - whereas hormone activity adds an endocrine
    claim that holds for the mouse protein but has not been tested for the human one. Once recombinant
    human ADISSP has been assayed, refining this row to GO:0005179 would bring ADISSP into line with ADIPOQ
    and LEP without retracting anything asserted here.'
  experts:
