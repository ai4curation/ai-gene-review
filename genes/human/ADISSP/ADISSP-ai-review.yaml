- term:
    id: GO:0042593
    label: glucose homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Accepted. Loss and gain of the mouse ortholog move whole-animal glucose handling in opposite
      directions, and the human protein is 90.2% identical over the full length.
    action: ACCEPT
    reason: 'Glucose homeostasis is established in the mouse donor by perturbation in both directions
      and at the level of the whole animal. Adipose-specific knockout raises steady-state and fasting
      glucose and degrades glucose tolerance and insulin sensitivity; transgenic and adenoviral gain of
      function do the reverse; and the 2026 follow-up states flatly that endogenous Adissp is essential
      for glucose homeostasis, adding that basal Akt activity is reduced in knockout adipose tissue. GO:0042593
      is deliberately broad - any process involved in maintaining an internal steady state of glucose
      - so an adipokine that sets basal Akt tone and glucose disposal in fat sits inside it comfortably.
      This is a physiological role rather than a molecular activity, and it is recorded as such: it appears
      in core_functions under directly_involved_in and never as a molecular function.'
    supported_by:
    - reference_id: PMID:36496438
      supporting_text: Remarkably, both steady-state and fasting glucose levels were higher, and glucose
        tolerance and insulin sensitivity were deteriorated in the ADKO mice
    - reference_id: PMID:36496438
      supporting_text: Adipose-specific Adissp knockout mice are defective in WAT browning, and are susceptible
        to high fat diet-induced obesity and hyperglycemia
    - reference_id: PMID:42030391
      supporting_text: Endogenous Adissp is essential for glucose homeostasis.
