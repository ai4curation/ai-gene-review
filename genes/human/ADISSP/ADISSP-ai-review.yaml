core_functions:
- description: 'Acts as an adipose-derived hormone: released from adipocytes into the extracellular space,
    it engages a saturable receptor on the adipocyte surface and changes that cell''s signalling state.
    Both halves of that statement are measured. Labelled and SEAP-fused protein binds adipose tissue sections
    and the brown-adipocyte surface, and unlabelled protein competes the binding away, so the site is
    specific rather than adhesive. Purified protein then acts on the receiving cell along two distinct
    routes: cyclic AMP rises and PKA substrates including hormone-sensitive lipase become phosphorylated,
    dose- and time-dependently and without any requirement for beta-adrenergic receptors; and Akt with
    its substrate AS160 is activated from about 25 nM, driving GLUT4 to the plasma membrane without insulin.
    Perturbation confirms the direction in both senses - transgenic and adenoviral gain of function raise
    cAMP, PKA activity and Ucp1, while adipose-specific deletion lowers all three. The consequences at
    the level of the organism are browning of white adipose tissue and maintenance of systemic glucose
    handling, and these are recorded as processes the protein is involved in rather than as activities
    it performs, because the heat is produced by UCP1 and the glucose is taken up by GLUT4. What the protein
    itself does is present a ligand surface to a receptor. The receptor''s molecular identity is the one
    missing piece, and it is why no receptor-class or downstream-pathway term is claimed here. The route
    out of the cell is non-classical - there is no signal peptide, the mature chain starts at an N-acetylated
    residue 2, and blocking ER-to-Golgi transit increases rather than prevents secretion - so the extracellular
    location is reached without the protein ever entering the classical secretory pathway.'
