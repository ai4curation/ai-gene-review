- description: 'Binds the catalytic subunit of protein phosphatase 1 and, in doing so, competes with a
    PP1 targeting subunit. This is the gene''s only human-experimental molecular function and the only
    one GOA currently records for it in either species. Co-immunoprecipitation from colorectal cancer
    lines recovers ADISSP with PP1c, and the same experiment shows the association of PP1c with its regulatory
    subunit GADD34 falling when ADISSP is overexpressed, which is what makes this an interaction with
    a consequence rather than a bare binding observation: the effect of occupying PP1c is to reduce assembly
    of the holoenzyme that dephosphorylates the TGF-beta receptor. The term is deliberately left at the
    isoform-agnostic level, because the cited study identified only ''PP1c'' by mass spectrometry without
    distinguishing the three catalytic subunits, and independent affinity-proteomics records recover ADISSP
    with PPP1CA, PPP1CB and PPP1CC alike as well as with the regulatory subunit PPP1R7. The interaction
    is topologically possible despite the extracellular location above precisely because secretion here
    is leaderless, which leaves a genuine cytosolic pool of the protein. What remains unresolved is whether
    this activity has anything to do with the hormonal one, or whether the two are independent.'
