      all three catalytic subunits are recovered, which is why the GO term is correctly left isoform-agnostic.
      The denominator counts protein partners only: of 27 IntAct records, 26 are interactions of the ADISSP
      protein and one pairs the ADISSP mRNA with a miRNA, which is excluded rather than counted as a partner.'
    supporting_text: 'PP1-module partners: **4 of 13 protein partners** - PPP1CA, PPP1CB, PPP1CC, PPP1R7.'
  - statement: 'The null that makes the seven-publication count interpretable: PP1 catalytic subunits
      are affinity-proteomics hubs, so recurrence in tag pulldowns is weak on its own and only the subject-centric
      count is informative.'
    supporting_text: '| PPP1CA | 1012 |'
