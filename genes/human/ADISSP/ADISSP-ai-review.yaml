    supporting_text: with C20orf27 overexpression in HCT15 and DLD-1 cells, the expression of p-TGFβR1,
      p-TAK1, p-IKK, p-IĸB, and p-p65 was increased
  - statement: Silencing in two further lines reduces the same canonical markers, giving the reciprocal
      direction.
    supporting_text: in HT29 and SW480 cells with C20orf27 silencing, p-TGFβR1, p-TAK1, p-IKK, p-IĸB,
      and p-p65 expressions were reduced
