- term:
    id: GO:1990845
    label: adaptive thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Accepted as the most specific currently expressible term, with the caveat that ADISSP regulates
      adaptive thermogenesis rather than performing it, and GO has no regulation term for this parent.
    action: ACCEPT
    reason: 'Adissp drives the thermogenic program: adipose-specific knockout is defective in WAT browning,
      transgenic and adenoviral gain of function induce Ucp1 and beige morphology, and the protein''s
      own secretion is stimulated by beta-3-adrenergic activation, which places it downstream of the sympathetic
      input that initiates adaptive thermogenesis. The term is accepted because it is the most specific
      thing GO can currently express, but it is not quite the right shape and that is worth stating. ADISSP
      does not produce heat; UCP1 does. What ADISSP does is positively regulate the process. GO has regulation
      terms only for the cold-induced child (GO:0120161/GO:0120162/GO:0120163), and those do not fit either,
      because the phenotype persists at thermoneutrality - transgenic and knockout mice housed at 30 C
      still differ in adipocyte morphology and Ucp1. So the regulatory term this gene needs does not exist,
      and a positive regulation of adaptive thermogenesis term is filed under proposed_new_terms rather
      than the existing cold-induced child being forced.'
    supported_by:
    - reference_id: PMID:36496438
      supporting_text: Adipose-specific Adissp knockout mice are defective in WAT browning, and are susceptible
        to high fat diet-induced obesity and hyperglycemia
    - reference_id: PMID:36496438
      supporting_text: Adissp expression is adipose-specific and highly BAT-enriched, and its secretion
        is stimulated by β3-adrenergic activation
    - reference_id: PMID:36496438
      supporting_text: Thus, Adissp-regulated thermogenesis is still maintained at thermoneutral condition.
