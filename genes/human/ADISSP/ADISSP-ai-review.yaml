- gap_statement: No functional experiment has been performed on the human protein. Human ADISSP has been
    shown to leave a cell - adenoviral expression in mouse liver put it into the circulation - and human
    adipocytes secrete it and human plasma contains it. But every assay of what the protein does, from
    receptor binding through PKA and Akt activation to the metabolic phenotypes, used the mouse orthologue.
    The eight IEA and ISS rows on this gene therefore rest on an ortholog transfer, which is well licensed
    at 90.2% identity over identical length with no indels, but is a transfer nonetheless.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: NARROWING
  boundary: 'Known for the human protein: it is expressed, detected at protein level by direct sequencing
    and mass spectrometry, secreted, present in circulation, lower in adipocytes of obese than lean subjects,
    and it binds PP1c. Known for the mouse protein only: receptor binding, cAMP/PKA activation, Akt activation,
    GLUT4 translocation, browning, and the glucose and obesity phenotypes. Narrowing rather than open
    because recombinant mouse protein does activate Akt in human SGBS adipocytes, so the human receiving
    system is demonstrably competent even though the human ligand has not been tested.'
  significance: Testing recombinant human ADISSP in the same assays would convert eight transferred rows
    into direct human evidence and is a small experiment relative to that gain.
