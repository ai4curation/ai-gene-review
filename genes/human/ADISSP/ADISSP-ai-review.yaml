- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Modified to positive regulation of cAMP/PKA signal transduction. The cAMP and PKA content
      of this term is well measured in the mouse donor; the G-protein-coupled receptor that the term names
      has never been identified.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0141163
      label: positive regulation of cAMP/PKA signal transduction
    reason: 'What PMID:36496438 measures and what GO:0007189 asserts are not the same thing. Measured,
      and measured well: cAMP rises in Adissp-transgenic inguinal WAT and falls in the adipose-specific
      knockout; PKA substrate and HSL phosphorylation move in both directions; purified Adissp protein
      activates PKA in a dose- and time-dependent manner; and labelled Adissp binds adipose sections and
      the brown-adipocyte surface in a competable way. Not measured: that the receptor is a G-protein-coupled
      receptor. The authors call it a putative receptor throughout and never identify it, and the entire
      link to a heterotrimeric G protein is one experiment with melittin, a membrane-active bee-venom
      peptide used at 1 uM for 24 h with n=3 - not a selective Gs tool. GO:0007189''s definition is a
      G protein-coupled receptor signaling pathway in which the signal is transmitted via activation of
      adenylyl cyclase; its comment does permit annotating ligands, but only of a pathway known to be
      of that kind. The replacement keeps everything that was measured and drops only the receptor class.
      GO:0141163 positive regulation of cAMP/PKA signal transduction is a regulation term, so an extracellular
      ligand can be annotated to it without being a component of the cassette it regulates - which is
      what rules out GO:0141156 itself, defined as an intracellular signaling cassette. Four candidate
      homes were considered and three rejected. Generalising to an ancestor is impossible: every ancestor
      of GO:0007189 retains the G-protein-coupled receptor in its definition. GO:0045762 positive regulation
      of adenylate cyclase activity is closer but asserts more than the data: what PMID:36496438 measures
      is cAMP content in transgenic and knockout adipose tissue, not adenylate cyclase activity, and a
      rise in cAMP content does not discriminate increased synthesis from reduced phosphodiesterase activity.
      GO:0141163 is satisfied either way, so it asserts exactly the demonstrated content: the cAMP/PKA
      cassette runs harder when ADISSP is present and slower when it is absent. GO itself points here
