knowledge_gaps:
- gap_statement: 'The receptor ADISSP acts through is unknown. Its existence is inferred from specific,
    competable binding to the adipocyte surface and from two downstream cascades that the purified protein
    switches on, but no candidate has been named, and the authors describe it as putative. This is the
    single fact whose absence propagates furthest through the record: it is why the adenylate-cyclase-activating
    GPCR term was moved to a regulation term that makes no claim about receptor class, and why the molecular
    function proposed here is the generic receptor ligand activity rather than anything about receptor
    class or coupling.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  boundary: 'Known: a saturable, competable binding site is present on adipocytes and on adipose tissue
    sections but not on liver, skeletal muscle or brain; engaging it raises cAMP and activates PKA independently
    of beta-adrenergic receptors, and separately activates PI3K-PDK1/mTORC2-Akt and GLUT4 translocation;
    human SGBS adipocytes respond, so the receptor is present in human cells. Unknown: the identity of
    the receptor, whether one receptor serves both cascades, and whether it is a G-protein-coupled receptor
    at all - the only evidence bearing on that is a single melittin experiment.'
  significance: Without it, the gene's molecular function can only be stated at the level of 'is a ligand
    for something', and the mechanism terms that GO would otherwise offer cannot be justified.
