  findings:
  - statement: C20orf27/ADISSP co-immunoprecipitates with the PP1 catalytic subunit, in an assay using
      two transfected tagged plasmids rather than endogenous protein.
    supporting_text: CoIP experiments demonstrated that C20orf27 and PP1c can be co-precipitated, indicating
