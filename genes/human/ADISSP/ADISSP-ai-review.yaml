- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Accepted as a core location. ADISSP is a genuinely secreted protein, and unusually for a
      location row the claim is backed by measurement in both species rather than by a signal-peptide
      prediction.
    action: ACCEPT
    reason: 'Secretion is measured, not predicted. In mouse the donor annotation is an IDA: endogenous
      Adissp was detected in brown-adipocyte conditioned medium, and a Flag knock-in at the native locus
      put the tag on the endogenous protein. The human protein itself was also shown to leave a cell -
      adenoviral expression in mouse liver put human ADISSP into the circulation at about 0.45 ug/mL -
      and the 2026 follow-up states that ADISSP is secreted by human adipocytes and present in human circulation.
      The route is non-classical: brefeldin A plus monensin, which blocks ER-to-Golgi transit, increased
      Adissp secretion while inhibiting adiponectin in the same experiment. That internal control matters
      here, because neither the human nor the mouse entry has a SIGNAL feature, the human mature chain
      begins at residue 2 with an N-acetylalanine, and the authors had to graft a heterologous signal
      peptide onto the construct to get secretion from HEK293 for purification. A leaderless protein with
      a cytosolic pool is exactly what those three facts describe. One caveat belongs on this row specifically,
      and it concerns the reference rather than the conclusion. GO_REF:0000120 is ''Combined Automated
      Annotation using Multiple IEA Methods'', whose purpose is to record that several independent electronic
      pipelines produced the same annotation. Its WITH/FROM here names three tokens, and they look like
      three witnesses: the mouse ortholog, its Ensembl protein, and UniProtKB-SubCell:SL-0243 ''Secreted''.
      They are not independent. The Ensembl token is the same mouse protein in another namespace, and
      the SubCell arm derives from the human entry''s own SUBCELLULAR LOCATION line, which is itself ECO:0000250
      by similarity to that identical mouse protein. All three arms reduce to Q9D1K7. The row is right,
      but the agreement it records is one source counted three ways, and a reader is entitled to be told
      that before treating a combined-methods reference as corroboration.'
