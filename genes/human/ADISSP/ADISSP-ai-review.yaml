- gap_statement: Nothing connects the two activities recorded for this protein. ADISSP is a leaderless
    secreted hormone acting on a surface receptor, and it is also a cytosolic binder of protein phosphatase
    1; the two literatures do not cite each other and no experiment addresses whether the phosphatase
    interaction is part of the hormonal mechanism, a regulator of the protein's own secretion, or an unrelated
    second job. The leaderless route makes the coexistence physically possible, which removes the easy
    way of dismissing one of them, and leaves the question genuinely open.
