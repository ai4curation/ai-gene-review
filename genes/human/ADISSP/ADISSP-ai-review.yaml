suggested_experiments:
- description: 'Identify the receptor. The binding assay already developed in PMID:36496438 - labelled
    protein binding adipose sections and adipocyte surface, competed by unlabelled protein - is the assay
    to scale up: photo-crosslinkable or proximity-labelling ADISSP on primary adipocytes followed by mass
    spectrometry, or a CRISPR knockout screen selecting for loss of the cAMP or Akt response. Naming the
    receptor is what would let the adenylate-cyclase-activating GPCR annotation be either justified or
    replaced with the correct receptor-class term.'
- description: Test recombinant human ADISSP in the mouse assays. Every functional measurement to date
    used the mouse protein; the human protein has only been shown to be secreted. Running human protein
    through the PKA, cAMP, Akt/AS160 and GLUT4-translocation assays, ideally in human SGBS adipocytes
    where mouse protein is already known to work, would convert eight ortholog-transferred rows into direct
    human evidence.
- description: Replace melittin with a specific test of G-protein dependence. The entire link between
    ADISSP and a heterotrimeric G protein is one experiment with 1 uM melittin, a membrane-active peptide.
    Gnas-deleted or Gnas-silenced adipocytes, or a selective Gs antagonist, would establish or exclude
    Gs coupling; pertussis and cholera toxin would discriminate the coupling class. Until then the receptor-class
    element of GO:0007189 is unmeasured rather than established.
- description: Ask whether protein phosphatase 1 binding matters in adipocytes, and whether it is connected
    to secretion. The PP1c interaction was characterised only in colorectal cancer lines with overexpressed
    tagged protein. Endogenous co-immunoprecipitation in differentiated adipocytes, plus a separation-of-function
    mutant that loses PP1 binding while retaining secretion, would show whether the two activities are
    one mechanism or two. A candidate route to such a mutant is to map the PP1-docking surface, which
    is currently unknown - note that a first-pass motif scan run for this review was discarded because
    its own positive controls failed, so no motif claim is made here.
- description: Determine the unconventional secretion route. That brefeldin A and monensin increase rather
    than block release places ADISSP with IL-1beta and MIF, but the specific pathway is untested. Candidate-directed
    knockdowns (GRASP55, TMED10, autophagy and secretory-lysosome components) with the existing conditioned-medium
    assay, and the FCCP sensitivity already observed, would narrow it, and would tell whether any GO biological-process
    term about the secretion mechanism is applicable to this cargo.
