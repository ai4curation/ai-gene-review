- id: PMID:36496438
  title: A brown fat-enriched adipokine Adissp controls adipose thermogenesis and glucose homeostasis.
  findings:
  - statement: Endogenous mouse Adissp is present in brown-adipocyte conditioned medium, and a Flag knock-in
      at the native locus confirms the endogenous protein is secreted.
    supporting_text: we were able to detect endogenous Adissp present in conditioned medium of mouse brown
      adipocyte culture
  - statement: Secretion is non-classical. Brefeldin A plus monensin, which blocks the ER-to-Golgi route,
      increased Adissp secretion while inhibiting adiponectin in the same experiment.
    supporting_text: While adiponectin secretion was inhibited by brefeldin A and monensin as expected,
      Adissp secretion was instead increased
  - statement: 'The human protein was itself shown to be secreted: adenoviral expression of human ADISSP
      in mouse liver put it into the circulation at about 0.45 ug/mL.'
    supporting_text: this injection resulted in acute expression of ADISSP in the liver and its secretion
      into circulation with a concentration of about 0.45 μg/mL
  - statement: The receptor is inferred from binding but never identified; the authors describe it as
      putative throughout.
    supporting_text: Together, our data suggest that Adissp activates PKA signaling through binding to
      a putative receptor at adipocyte surface
  - statement: The link to a heterotrimeric G protein rests on a single melittin experiment; melittin
      is a membrane-active bee-venom peptide rather than a selective Gs inhibitor.
    supporting_text: induction of Ucp1 expression by Adissp was reduced by a merely 2-h treatment with
      the PKA inhibitor H89 and was blocked by Melittin, an inhibitor for Gαs subunit of the heterotrimeric
      G protein
  - statement: Adipose-specific knockout impairs white-fat browning and produces diet-induced obesity
      and hyperglycaemia.
    supporting_text: Adipose-specific Adissp knockout mice are defective in WAT browning, and are susceptible
      to high fat diet-induced obesity and hyperglycemia
  - statement: The thermogenic phenotype persists at thermoneutrality, so the process regulated is not
      specifically cold-induced thermogenesis.
    supporting_text: Thus, Adissp-regulated thermogenesis is still maintained at thermoneutral condition.
  - statement: To purify secreted protein the authors had to graft a heterologous signal peptide onto
      the construct, which is independent evidence that the native protein has none.
    supporting_text: To increase the yield and facilitate the purification of secreted Adissp, we added
      a signal peptide at the N-terminus of Adissp and a 6×His tag at its C-terminus
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached full text read in full, not just the abstract. Confirmed clean of retraction,
      erratum and expression of concern by two independent routes - the PubMed record''s own PublicationType
      and CommentsCorrections fields, and Crossref relation/update-to on DOI 10.1038/s41467-022-35335-w
      - with a known-retracted PMID as a positive control to show the detector fires. This is the sole
      experimental source behind every IEA and ISS row on this gene. One reading caution recorded because
      it is easy to get wrong: the paper infuses GFP, mouse Adissp and human ADISSP adenoviruses, but
      only the circulating-protein detection is credited to the human construct; the browning and glucose-tolerance
      panels in the same figure are labelled for the mouse protein, so the human protein should not be
      said to have produced the metabolic phenotype.'
