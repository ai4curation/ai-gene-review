description: 'ADISSP is a small 174-residue protein that adipocytes release into the extracellular space,
  where it acts on fat tissue as a hormone. Its expression is essentially confined to adipose tissue and
  is highest in brown fat, and its release is triggered by beta-3-adrenergic stimulation, placing it downstream
  of the sympathetic signal that drives non-shivering heat production. The protein has no signal peptide
  and its mature form begins at residue 2 with an N-terminally acetylated alanine, so it reaches the outside
  of the cell by a non-classical route: blocking ER-to-Golgi transit increases rather than prevents its
  appearance in the medium, the behaviour seen for other leaderless secreted proteins. It therefore exists
  in both a cytosolic and an extracellular pool. Outside the cell it binds a saturable site on the adipocyte
  surface, and although the receptor has not been identified, engaging it raises cyclic AMP and activates
  protein kinase A independently of beta-adrenergic receptors, and separately activates a PI3K-PDK1/mTORC2-Akt
  cascade that drives GLUT4 to the plasma membrane without insulin. The physiological consequences, established
  in mice by both loss and gain of function, are browning of white adipose tissue, increased energy expenditure,
  protection from diet-induced obesity, and improved systemic glucose handling; adipose-specific deletion
  produces the mirror-image phenotype of obesity and hyperglycaemia, and the effects persist at thermoneutrality.
  Separately from this hormonal role, ADISSP binds the catalytic subunits of protein phosphatase 1 and
  the PP1 regulatory subunit PPP1R7. In colorectal cancer cells this interaction keeps PP1c away from
  its regulatory partner GADD34, leaving the TGF-beta receptor phosphorylated and increasing signalling
  through TAK1 to NF-kappaB, which promotes proliferation. Whether the intracellular phosphatase-binding
  activity and the extracellular hormonal activity are two faces of one mechanism or two independent functions
  of the same small protein is not known.'
