proposed_new_terms:
- proposed_name: positive regulation of adaptive thermogenesis
  proposed_definition: Any process that activates or increases the frequency, rate or extent of adaptive
    thermogenesis, the regulated production of heat in response to short term environmental changes such
    as stress, diet or reduced temperature.
  proposed_parent:
    id: GO:1990845
    label: adaptive thermogenesis
  justification: 'GO currently offers regulation terms only for the cold-induced child of adaptive thermogenesis
    - GO:0120161, GO:0120162 and GO:0120163 - and none for the parent. That leaves no term for a gene
    product that increases adaptive thermogenesis by a route which is not cold-specific, which is exactly
    ADISSP''s situation: its thermogenic effect persists in mice housed at thermoneutrality, so the cold-induced
    child would misdescribe the process regulated, while the parent process term GO:1990845 attributes
    heat production to a protein that does not produce heat. The gap is not peculiar to this gene - diet-induced
    thermogenesis (GO:0002024) and the futile creatine cycle (GO:0140651) are the parent''s other children
    and are equally unserved by a cold-specific regulation branch. Adding the regulation trio at the GO:1990845
    level, or at minimum the positive member, would let regulators be annotated to the level at which
    their evidence actually sits. Requested rather than worked around: the existing GO:1990845 rows are
    accepted here as the most specific expressible option.'
  supported_by:
  - reference_id: PMID:36496438
    supporting_text: Thus, Adissp-regulated thermogenesis is still maintained at thermoneutral condition.
  - reference_id: PMID:36496438
    supporting_text: Adipose-specific Adissp knockout mice are defective in WAT browning, and are susceptible
      to high fat diet-induced obesity and hyperglycemia
