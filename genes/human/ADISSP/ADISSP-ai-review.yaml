- term:
    id: GO:0008157
    label: protein phosphatase 1 binding
  evidence_type: IDA
  original_reference_id: PMID:32024300
  qualifier: enables
  review:
    summary: Accepted, and it is the only molecular function this gene has in either species. The interaction
      is real and independently replicated; the evidence code is the wrong one.
    action: ACCEPT
    reason: 'The term is right and it is informative - GO:0008157 is isoform-agnostic, which matches the
      data, since the paper''s mass spectrometry identified only ''PP1c'' without resolving which catalytic
      subunit. Two things qualify it. First, the cited experiment is a co-immunoprecipitation between
      two transfected, tagged plasmids, which is not a direct assay at native levels; for a physical interaction
      the code should be IPI with the partner in WITH/FROM, and this row''s WITH/FROM is empty, so the
      partner is recorded nowhere machine-readably. Second, and pulling the other way, the interaction
      does not rest on that one experiment: IntAct logs ADISSP against PPP1CA, PPP1CB, PPP1CC and the
      regulatory subunit PPP1R7 across seven publications that the annotation does not cite (PMIDs 24366813,
      27173435, 27880917, 28330616, 28514442, 33961781, 40205054) by anti-tag co-IP, TAP and pull-down.
      That recurrence needs its null, and the null is unflattering: PP1 catalytic subunits are among the
      most frequently recovered proteins in affinity proteomics, with 1012 IntAct records for PPP1CA against
      27 for ADISSP, so simply reappearing in tag pulldowns proves little. The informative direction is
      the subject-centric one - four of ADISSP''s thirteen distinct IntAct protein partners are PP1-module
      components, so the PP1 module dominates this protein''s own sparse interactome rather than ADISSP
      being one more name on PP1''s long list. Finally, a topological objection that would ordinarily
      apply here does not. ADISSP is annotated to the extracellular region, and PP1c is cytosolic and
      nuclear, which on a signal-peptide protein in a secretory lumen would be a strong argument against
      the interaction. ADISSP is leaderless and secreted non-classically, so it necessarily has a cytosolic
      pool, and the two annotations are compatible.'
    supported_by:
    - reference_id: PMID:32024300
      supporting_text: CoIP experiments demonstrated that C20orf27 and PP1c can be co-precipitated, indicating
        an interaction between the two proteins
    - reference_id: PMID:32024300
      supporting_text: the C20orf27 and PP1c plasmids with the marker were transfected into HCT15 and
        DLD-1 cells
    - reference_id: PMID:32024300
      supporting_text: the interaction between PP1c and the regulatory subunit GADD34 was reduced with
        C20orf27 overexpression
- term:
    id: GO:0030511
    label: positive regulation of transforming growth factor beta receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:32024300
  qualifier: involved_in
  review:
    summary: Kept, but as a non-core, context-restricted role. The measurement is sound and bidirectional;
      it is a downstream consequence of the PP1c interaction in colorectal cancer lines, not this gene's
      evolved function.
    action: KEEP_AS_NON_CORE
    reason: 'The evidence code is right - overexpression in HCT15 and DLD-1 raised phospho-TGFbetaR1 and
      silencing in HT29 and SW480 lowered it, which is a mutant-phenotype experiment run in both directions.
      The term also survives a definition check that it might not have: GO:0007179, the process being
      regulated, is defined simply as signals initiated by a ligand binding a TGF-beta receptor and ending
      in regulation of a downstream process, with no requirement that the arm be Smad-mediated, so the
      TAK1 branch this paper follows is inside the term. Two limitations keep it out of core_functions.
      No exogenous TGF-beta was added, so what was measured is basal receptor phosphorylation in cancer
      lines with presumed autocrine ligand; and the effect is mechanistically downstream of ADISSP sequestering
      PP1c away from the TGFbetaR1-Smad7-GADD34 complex, which makes it a consequence of the molecular
      function rather than a second function. Nothing connects it to the adipose biology that the rest
      of this record describes.'
    supported_by:
    - reference_id: PMID:32024300
      supporting_text: with C20orf27 overexpression in HCT15 and DLD-1 cells, the expression of p-TGFβR1,
        p-TAK1, p-IKK, p-IĸB, and p-p65 was increased
    - reference_id: PMID:32024300
      supporting_text: in HT29 and SW480 cells with C20orf27 silencing, p-TGFβR1, p-TAK1, p-IKK, p-IĸB,
        and p-p65 expressions were reduced
    - reference_id: PMID:32024300
      supporting_text: C20orf27 inhibits the formation of PP1 holoenzyme by interacting with PP1c, thus
        reducing the inhibitory effect of PP1 on the TGFβR-TAK1-NFĸB pathway.
- term:
    id: GO:1901224
    label: positive regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IMP
  original_reference_id: PMID:32024300
  qualifier: involved_in
  review:
    summary: Modified to positive regulation of canonical NF-kappaB signal transduction. Every NF-kappaB
      readout in the cited paper is a canonical marker; nothing diagnostic of the non-canonical cascade
      was measured.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    reason: 'The two branches are distinguished by GO on mechanism, and the definitions decide this cleanly.
      GO:0038061 non-canonical NF-kappaB signal transduction requires NIK-dependent processing: NIK activates
      IKKalpha, IKKalpha phosphorylates p100, and p100 is processed to release p52. GO:0007249 canonical
      NF-kappaB signal transduction is IKK-complex-dependent activation running through IkappaB to the
      RelA-containing dimer. What PMID:32024300 measures, in both the overexpression and the silencing
      direction, is phospho-IKK, phospho-IkappaB and phospho-p65 - RelA. NIK, p100/p52 processing and
      RelB appear nowhere in the paper. Those are canonical markers exclusively. This is a wrong term
      rather than an imprecise one, and I checked rather than assumed: I fetched the is_a/part_of ancestor
      closures of GO:1901224 and GO:0043123 and neither contains the other, so they are siblings naming
      different cascades, not a parent quietly covering the data. Note for anyone re-running that check
      that neither regulation term has its target cascade in its is_a closure either, because GO links
      them by positively_regulates, which does not subsume. The replacement asserts exactly what was measured.
      Like the TGF-beta row this remains non-core: it is the cancer-cell-line consequence of the PP1c
      interaction.'
    supported_by:
    - reference_id: PMID:32024300
      supporting_text: with C20orf27 overexpression in HCT15 and DLD-1 cells, the expression of p-TGFβR1,
        p-TAK1, p-IKK, p-IĸB, and p-p65 was increased
    - reference_id: PMID:32024300
      supporting_text: in HT29 and SW480 cells with C20orf27 silencing, p-TGFβR1, p-TAK1, p-IKK, p-IĸB,
        and p-p65 expressions were reduced
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: Removed. This is a 2012 placeholder meaning no cellular-component information was available,
      and the same GOA record now carries three extracellular region annotations, so it contradicts its
      own file.
    action: REMOVE
    reason: 'The ND evidence code against a root term is not a statement about the protein but about the
      state of knowledge on the day it was made. GO:0005575''s own comment says the term is recommended
      for gene products whose cellular component is unknown and that using it indicates no information
      was available. This row was assigned by BHF-UCL on 2012-07-16, a decade before PMID:36496438. ADISSP
      now has three GO:0005576 extracellular region rows, one of them tracing to a mouse IDA, so the assertion
      the ND row encodes is no longer true and GO''s own convention is that it should be retired once
      any annotation in that aspect exists. Nothing biological is lost by removing it. It is worth distinguishing
      this from the other actions in this review: it is not a propagation failure of any kind - there
      is no WITH/FROM and no source to inspect - just a placeholder that outlived its purpose.'
    supported_by:
    - reference_id: file:human/ADISSP/ADISSP-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Secreted {ECO:0000250|UniProtKB:Q9D1K7}.'
- term:
    id: GO:0048018
    label: receptor ligand activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9D1K7
  review:
    summary: New. The gene's headline activity - a secreted protein that engages an adipocyte cell-surface
      receptor and changes its output - has no molecular function term in either species, and this is
      the gap.
    action: NEW
    reason: 'The coverage gap is real and I checked it rather than inferring it: querying QuickGO for
      molecular function annotations returns one for human ADISSP and two for mouse Adissp, and all of
      them are GO:0008157 protein phosphatase 1 binding, transferred between the two species. Neither
      species has any term for the adipokine activity that both papers are about. What is measured supports
      GO:0048018 squarely. Labelled and SEAP-fused Adissp binds adipose tissue sections and the brown-adipocyte
      surface, and the binding is competed away by unlabelled protein, so a saturable surface site exists.
      Purified protein then changes that cell''s behaviour: PKA substrate phosphorylation rises dose-
      and time-dependently, and in the 2026 study recombinant protein activates Akt and AS160 with appreciable
      activity at 25 nM. That study also answers the obvious objection about what molecule was assayed
      - it is full-length recombinant protein, and untagged protein reproduces the effect, so the result
      is not an artefact of the His tag or of the purification. The same protein activates Akt in human
      SGBS adipocytes, so the responding system is present in human cells. GO:0048018 is the right term
      because its definition covers a gene product that interacts with a receptor to change the receptor''s
      activity, explicitly including ligands that are secreted and diffuse to a receiving cell, and it
      does not require the receptor to have been identified. I verified its placement rather than assuming
      it: GO:0048018 is not a descendant of GO:0005102 signaling receptor binding, and not under GO:0005488
      binding at all - it sits under GO:0140677 molecular function activator activity and GO:0098772 molecular
      function regulator activity. Evidence is ISS from mouse Q9D1K7 because the functional assays used
      the mouse protein; WITH/FROM carries the sequence-similar entity only, as ISS requires. The unidentified
      receptor is recorded in knowledge_gaps and is the reason no downstream pathway term is proposed
      alongside this one.'
