id: Q6P093
gene_symbol: AADACL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AADACL2 is a 401-residue human member of the arylacetamide deacetylase (AADAC) family, one of five
  paralogs (AADAC, AADACL1/NCEH1, AADACL2, AADACL3, AADACL4) that belong to the GDXG or hormone-sensitive-lipase-like
  branch of the alpha/beta-hydrolase fold. It carries the complete catalytic apparatus of that clan - a Ser-Asp-His
  triad with Ser189 at the apex of a GDSSG nucleophile elbow, Asp341 and His371, an HGG oxyanion-hole loop at residues
  111-113, and a Cys116-Cys338 disulfide - and those residues sit in register with the equivalent residues of the
  biochemically characterised relatives AADAC, NCEH1 and three mycobacterial carboxylesterases. It is therefore
  expected to be an active serine carboxylesterase, but no substrate has been identified and no catalytic activity
  has ever been measured for it. Transcript expression is essentially confined to skin, in contrast to the liver-
  and intestine-enriched AADAC and the ubiquitous NCEH1, so AADACL2 together with the also skin-expressed AADACL3
  looks like a skin-associated expansion of the family. The protein enters the secretory pathway through an N-terminal
  hydrophobic segment, but whether that segment is a cleaved signal peptide that releases a soluble secreted enzyme
  or an uncleaved type-II signal anchor that retains it in a membrane - the arrangement demonstrated for AADAC and
  NCEH1 - has not been determined experimentally. Insertion/deletion variants in the gene have been associated with
  psoriasis in a Chinese Han cohort, and a chromosome 3 locus adjacent to the gene with ischemic stroke in indigenous
  African populations.
alternative_products:
- name: '1'
  id: Q6P093-1
  description: The MANE-Select product and the only form that can be catalytically competent; all annotations on
    this record concern this isoform.
- name: '2'
  id: Q6P093-3
  sequence_note: VSP_038389, VSP_038390
  description: Substitutes residues 47-53 and deletes 54-401, truncating the protein well before the Ser189 nucleophile,
    so it cannot be an active hydrolase. UniProt further notes it may be produced at very low levels because of
    a premature stop codon that triggers nonsense-mediated mRNA decay, so no annotation should be attributed to
    it.
