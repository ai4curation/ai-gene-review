  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/NODE_PTN009058710.md
    supporting_text: all three carry `GO:0017171` by IDA
suggested_questions:
- question: 'Should GO:0017171 serine hydrolase activity move from the ortholog-specific PANTHER nodes PTN002745055
    (AADAC) and PTN002745068 (NCEH1) down to the shared family node PTN009058713? Measured against the node''s own
    donors, the term is true of all three of them - human AADAC, mouse Aadac and mouse Nceh1 - and all three of
    them hold it by IDA, whereas at the far deeper PTN009058710 that AADACL2, AADACL3 and AADACL4 actually inherit
    their only activity term from, it is refuted by soybean HIDH''s threonine nucleophile. One node move would give
    all three paralogs a mechanism term they currently inherit from nothing, and the reciprocal half is worth reporting
    too: GO:0016020 membrane sits at that same family node although the type-II signal anchor it rests on is the
    feature AADACL2''s own record says it lacks.'
  experts: []
- question: Is AADACL2 secreted or membrane-anchored? Its N-terminal hydrophobic segment is annotated as a cleaved
    signal peptide, while the positionally homologous segment in AADAC and NCEH1 is an experimentally validated
    uncleaved type-II signal anchor. The predicted cleavage site places histidine at -1, which signal peptidase
    I does not accept, and the segment is more hydrophobic than AADAC's anchor. GOA carries both extracellular region
    and membrane for this protein as a direct result.
  experts:
  - Achim Lass
  - Ulrike Taschler
- question: What does AADACL2 hydrolyse? The Ser-Asp-His triad, oxyanion hole and GDXG elbow are intact and in register
    with characterised carboxylesterases, but the family straddles bond types - AADAC's name-giving activity is
    amide hydrolysis of arylacetamides while its lipid activity is on diglycerides, and NCEH1 acts on cholesterol,
    retinyl and acetyl monoalkylglycerol esters. Given that AADACL2 is skin-restricted, epidermal barrier lipids
    and cutaneous xenobiotics are the obvious first substrate panels.
  experts:
  - Achim Lass
  - Carina Wagner
- question: Does the psoriasis association at AADACL2 have a mechanism? An exome-wide indel screen in 32,043 Chinese
    Han individuals named AADACL2 as a previously unreported psoriasis gene, and the gene's expression is restricted
    to skin. Whether the associated variants alter the catalytic triad region, the N-terminal targeting segment
    or expression level is unknown, and there is no functional assay in which to test them.
  experts:
  - Liangdan Sun
- question: Are AADACL2, AADACL3 and AADACL4 a skin-associated expansion of the AADAC family with distinct substrates,
    or largely redundant? AADACL2 and AADACL3 are both skin-expressed, AADACL4 is choroid-plexus-restricted, and
    none has been assayed. All three currently share exactly the same two propagated annotations, which means the
    record cannot distinguish them at all.
  experts: []
suggested_experiments:
- hypothesis: AADACL2 is a catalytically active serine hydrolase whose Ser189 nucleophile is accessible to active-site-directed
    probes.
  description: Express and purify recombinant AADACL2 (mature construct and full length) and label with a fluorophosphonate
    activity-based probe, comparing wild type with an S189A mutant. Competitive activity-based protein profiling
    against a panel of lipid and xenobiotic esters and arylacetamides, read out as probe displacement, then identifies
    substrate classes without needing to guess the physiological substrate first. Include AADAC and NCEH1 as positive
    controls, since both are established fluorophosphonate-reactive serine hydrolases.
  experiment_type: activity-based protein profiling
- hypothesis: The N-terminal hydrophobic segment of AADACL2 is a cleaved signal peptide, so the mature protein is
    released into the medium rather than retained in a membrane.
  description: Express epitope-tagged AADACL2 (tag at the C-terminus so it survives either topology) in primary
    keratinocytes or an immortalised keratinocyte line, and ask three questions in parallel - whether the protein
    accumulates in conditioned medium, whether it partitions with membranes after carbonate extraction, and whether
    it is protease-protected in digitonin- versus saponin-permeabilised cells. Determine the mature N-terminus of
    the secreted or membrane form by Edman sequencing or N-terminal peptide mass spectrometry, which will also test
    UniProt's cleavage position after residue 18. Run AADAC in parallel as the validated type-II anchor control.
  experiment_type: subcellular fractionation and protease protection
- hypothesis: AADACL2 contributes to lipid ester turnover during epidermal terminal differentiation, where its expression
    is concentrated.
  description: Profile AADACL2 protein and transcript across a calcium-induced keratinocyte differentiation time
    course and across epidermal layers, then knock the gene out in organotypic skin equivalents and measure the
    neutral lipid and wax/cholesterol ester composition of the stratum corneum by mass spectrometry, together with
    barrier function by transepidermal water loss. Because AADACL3 is also skin-expressed, test single and double
    knockouts to expose redundancy.
  experiment_type: differentiation time course plus knockout lipidomics in organotypic skin
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source of the two most informative molecular-function rows, and the two illustrate the difference
      between a fold signature and a family signature. IPR013094 (Alpha/beta hydrolase fold-3) can only license
      bare hydrolase activity; IPR017157 (Arylacetamide deacetylase, PIRSF037251) is family-specific and licenses
      carboxylic ester hydrolase activity, which is retained here. The same IPR017157 mapping also produced the
      membrane call, which is where it over-reaches for this member.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Both PAINT rows were traced to their nodes and every WITH/FROM identifier resolved. Neither is
      a miscitation, and neither term is wrong for the node it was asserted at; the issue is node placement. GO:0016787
      came from the very deep PTN009058710, whose 16 donor proteins span plants, fungi, bacteria and animals, and
      donor-by-donor testing shows that term is the exact lowest common ancestor of the set rather than a cautious
      approximation to it - GO:0052689 is refuted by two kynurenine formamidases and GO:0017171 by soybean HIDH's
      threonine nucleophile. Meanwhile GO:0017171 was placed only at the ortholog-specific PTN002745055 and PTN002745068,
      though it is true of every donor PAINT cites at the family node PTN009058713, and GO:0016020 membrane was
      placed at that family node where it transfers least reliably.
