  qualifier: enables
  review:
    summary: 'The single most informative row on this record, and it holds up. IPR017157 is the family-specific
      Arylacetamide deacetylase signature (PIRSF037251), not a bare fold, and every biochemically characterised
      protein it covers or that appears in this gene''s WITH/FROM column hydrolyses carboxylic esters: AADAC (diglyceride
