- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: 'Cannot be resolved on present evidence, and the reason is worth recording rather than papering over.
      The node is PTN009058713 and all three of its protein sources are single-pass type-II membrane proteins whose
      N-terminal hydrophobic segment is an uncleaved signal anchor: human AADAC (TRANSMEM 6-23), mouse Aadac (6-26)
      and mouse Nceh1 (5-25). AADACL2''s own UniProt record instead annotates that same positionally homologous
      segment as a cleaved signal peptide (SIGNAL 1..18, mature chain 19-401) and places the protein as Secreted,
      so the transfer moves a feature the target is said to lack. Of the 14 reviewed UniProtKB entries carrying
      the family signature IPR017157, 12 carry a transmembrane segment (11 of them annotated explicitly as a type-II
      signal anchor; the exception is mouse Aadacl3, with three plain helices), and AADACL2 is the single one with
      a cleaved signal peptide instead. That looks at first like a clean paralog-topology error, but measurement
      does not support removing the term. The annotated cleavage site puts histidine at position -1, which signal
      peptidase I essentially does not accept; the hydrophobic core is if anything more hydrophobic than AADAC''s
      experimentally confirmed anchor (peak Kyte-Doolittle mean over a 19-residue window 1.94 versus 1.81); and
      the two N-termini are homologous across the entire segment with the same downstream TP-x-PDN-x-EE-x-W motif.
      This is the textbook signal-peptide versus type-II-signal-anchor ambiguity, which UniProt has resolved one
      way for AADACL2 and the other way for its four paralogs. Nothing experimental breaks the tie: the protein
      is detected by mass spectrometry, but all four observed peptides lie in the catalytic domain, the earliest
      beginning at residue 124, so none of them tests whether the N-terminal helix is removed.'
    action: UNDECIDED
    reason: The annotation depends entirely on a topology that has never been determined for this protein, and the
      sequence evidence is genuinely two-sided rather than merely thin. Removing the term would assert secretion,
      which rests on a predicted cleavage site with a disallowed -1 residue; accepting it would assert membrane
      anchoring, which no evidence specific to AADACL2 supports. Note additionally that is_active_in is a stronger
      claim than the record can bear, and that even under the membrane hypothesis the bare parent term would be
      the wrong choice - AADAC's own PAINT annotation at its ortholog node is the specific GO:0005789 endoplasmic
      reticulum membrane.
    supported_by:
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: So the membrane claim is a transfer of a feature that AADACL2's own record says it does not
        have.
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: This is the classic signal-peptide / type-II-signal-anchor ambiguity, and UniProt has resolved
        it one way for AADACL2 and the other way for its four paralogs.
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: No peptide spans the annotated cleavage site and none starts at the putative mature N-terminus
        (residue 19).
    - reference_id: file:human/AADACL2/AADACL2-uniprot.txt
      supporting_text: FT   SIGNAL          1..18
    - reference_id: PMID:35736449
      supporting_text: AADAC is a type II membrane glycoprotein, facing with its active side to the lumen of the
        endoplasmic reticulum (ER)
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN009058713
        source_label: AADAC-family node (AADAC, NCEH1, AADACL2, AADACL3, AADACL4)
        source_status: UNRESOLVED
        comment: The node's shared feature is an N-terminal hydrophobic segment, which is a validated type-II anchor
          in the two characterised members and is annotated as a cleaved signal peptide in AADACL2; the node cannot
          distinguish the two readings.
      - source_id: UniProtKB:P22760
        source_label: human AADAC
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Experimentally an ER type-II membrane glycoprotein with its active site in the lumen, but its anchor
          is uncleaved and AADACL2's equivalent segment is annotated as cleaved.
      - source_id: MGI:MGI:1915008
        source_label: mouse Aadac
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: TRANSMEM 6-26, type-II signal anchor.
      - source_id: MGI:MGI:2443191
        source_label: mouse Nceh1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: TRANSMEM 5-25, type-II signal anchor; ER-luminal orientation shown experimentally.
