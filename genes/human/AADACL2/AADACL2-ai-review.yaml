      been only poorly investigated and no functional roles can be concluded
knowledge_gaps:
- gap_statement: No substrate and no measured activity. AADACL2 has never been assayed - not against an ester, an
    amide, a lipid or a xenobiotic - so although the catalytic machinery is demonstrably intact, which bond it hydrolyses,
    on which substrate, and to what end are all unknown. No biological process can be assigned, and consequently
    the entire GO record consists of two IBA and five IEA rows with no experimental evidence of any kind.
  boundary: What is established is the machinery and the expression. The Ser189-Asp341-His371 triad, the HGG oxyanion
    loop and the GDSSG nucleophile elbow are annotated on the protein and are in register with the catalytic residues
    of the 51.6 percent identical human AADAC, mouse and rat Aadac, mouse Nceh1 and three characterised Mycobacterium
    tuberculosis carboxylesterases. The protein is detected by mass spectrometry (four peptides) and its transcript
    is essentially skin-restricted. What is missing is any biochemistry at all.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: AADACL2 sits in a family whose two characterised members are pharmacologically important - AADAC
    hydrolyses clinically used arylacetamide prodrugs and procarcinogens, NCEH1/KIAA1363 is a drug-target serine
    hydrolase in cancer and platelet biology - and AADACL2 is the family's only skin-restricted member with an intact
    triad. A skin-expressed serine esterase is a plausible participant in epidermal barrier lipid processing or
    in cutaneous xenobiotic handling, and the gene surfaced independently in a psoriasis indel screen, so the missing
    biochemistry is the barrier to interpreting a genetic signal that already exists.
  resolution: Serine-hydrolase activity-based protein profiling of the recombinant protein against a lipid and xenobiotic
    ester panel, which would establish both that it is catalytically active and what class of bond it prefers.
  provenance:
  - reference_id: PMID:35736449
    supporting_text: all other members of the AADACL protein family, AADACL2, AADACL3, and AADACL4, have so far
      been only poorly investigated and no functional roles can be concluded
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: 'Seven GOA rows, no experimental evidence of any kind: 2 IBA and 5 IEA.'
- gap_statement: Whether AADACL2 is secreted or membrane-anchored is undetermined, and GOA currently asserts both.
    The N-terminal hydrophobic segment is annotated as a cleaved signal peptide (SIGNAL 1..18) by UniProt and is
    the positional homolog of an experimentally validated uncleaved type-II signal anchor in AADAC and NCEH1. The
    predicted cleavage site places histidine at -1, which signal peptidase I does not use, and the hydrophobic core
    is more hydrophobic than AADAC's validated anchor, so the sequence does not discriminate.
  boundary: 'What is established: the protein enters the secretory pathway through an N-terminal hydrophobic helix,
    and it is expressed and detectable. What is missing is one experiment: no protease-protection, fractionation,
    surface-labelling or conditioned-medium assay has been performed on AADACL2, and the four observed peptides
    all lie in the catalytic domain (earliest residue 124), so mass spectrometry has not tested the N-terminal fate
    either.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: The two possibilities imply different biology - a soluble enzyme acting in the extracellular space
    or stratum corneum, against a membrane-tethered enzyme acting on lipids of the secretory pathway - and they
    cannot both be annotated. The curation-side half of the gap is that GOA currently carries both, from three separate
    pipelines, without any flag that they are mutually exclusive.
  resolution: A protease-protection or medium-versus-membrane fractionation experiment on tagged AADACL2 in a keratinocyte
    line, plus N-terminal sequencing of the mature protein, would settle it and license exactly one of the two existing
    annotations.
  provenance:
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: This is the classic signal-peptide / type-II-signal-anchor ambiguity, and UniProt has resolved
      it one way for AADACL2 and the other way for its four paralogs.
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: No peptide spans the annotated cleavage site and none starts at the putative mature N-terminus
      (residue 19).
- gap_statement: The mechanistic molecular function of the AADAC family is annotated only at ortholog-specific PANTHER
    nodes and not at the node the family shares, so three human genes carry no mechanism term they are entitled
    to. GO:0017171 serine hydrolase activity sits at PTN002745055 (AADAC) and PTN002745068 (NCEH1); AADACL2, AADACL3
    and AADACL4 inherit only bare hydrolase activity from the far deeper PTN009058710, while what they do inherit
    from the shared family node PTN009058713 is the much less transferable GO:0016020 membrane.
  boundary: The catalytic triad is conserved in all five human family members - each of their UniProt records annotates
    the equivalent Ser, Asp and His - and for AADACL2 that conservation was confirmed by alignment to eight independently
    characterised relatives. The N-terminal anchor, by contrast, is present in 12 of the 14 reviewed IPR017157 entries
    - 11 of them an explicit type-II signal anchor - but absent from AADACL2's record. So which of the two terms
    is safe at the family node is not in doubt; only the annotation has not been made.
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: 'This is a single tree-level edit that would correct three human genes at once, and the pattern
    is general: PAINT curators place well-evidenced mechanism terms conservatively at ortholog nodes while localisation
    terms, which transfer far less reliably, are placed at family nodes. The net effect is records where the location
    is asserted and the activity is not.'
  resolution: Move GO:0017171 serine hydrolase activity down to PTN009058713 and drop GO:0016020 membrane from that
    node pending experimental topology data.
  provenance:
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: The placement is the wrong way round with respect to what actually transfers.
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: Moving the activity down to the family node and dropping the localisation from it would fix
      three human genes at once.
suggested_questions:
- question: Is AADACL2 secreted or membrane-anchored? Its N-terminal hydrophobic segment is annotated as a cleaved
    signal peptide, while the positionally homologous segment in AADAC and NCEH1 is an experimentally validated
    uncleaved type-II signal anchor. The predicted cleavage site places histidine at -1, which signal peptidase
    I does not accept, and the segment is more hydrophobic than AADAC's anchor. GOA carries both extracellular region
    and membrane for this protein as a direct result.
  experts:
  - Achim Lass
  - Ulrike Taschler
- question: What does AADACL2 hydrolyse? The Ser-Asp-His triad, oxyanion hole and GDXG elbow are intact and in register
    with characterised carboxylesterases, but the family straddles bond types - AADAC's name-giving activity is
    amide hydrolysis of arylacetamides while its lipid activity is on diglycerides, and NCEH1 acts on cholesterol,
    retinyl and acetyl monoalkylglycerol esters. Given that AADACL2 is skin-restricted, epidermal barrier lipids
    and cutaneous xenobiotics are the obvious first substrate panels.
  experts:
  - Achim Lass
  - Carina Wagner
- question: Does the psoriasis association at AADACL2 have a mechanism? An exome-wide indel screen in 32,043 Chinese
    Han individuals named AADACL2 as a previously unreported psoriasis gene, and the gene is one of very few skin-restricted
    serine hydrolases. Whether the associated variants alter the catalytic triad region, the N-terminal targeting
    segment or expression level is unknown, and there is no functional assay in which to test them.
  experts:
  - Liangdan Sun
- question: Are AADACL2, AADACL3 and AADACL4 a skin-associated expansion of the AADAC family with distinct substrates,
    or largely redundant? AADACL2 and AADACL3 are both skin-expressed, AADACL4 is choroid-plexus-restricted, and
    none has been assayed. All three currently share exactly the same two propagated annotations, which means the
    record cannot distinguish them at all.
  experts: []
suggested_experiments:
- hypothesis: AADACL2 is a catalytically active serine hydrolase whose Ser189 nucleophile is accessible to active-site-directed
    probes.
  description: Express and purify recombinant AADACL2 (mature construct and full length) and label with a fluorophosphonate
    activity-based probe, comparing wild type with an S189A mutant. Competitive activity-based protein profiling
    against a panel of lipid and xenobiotic esters and arylacetamides, read out as probe displacement, then identifies
    substrate classes without needing to guess the physiological substrate first. Include AADAC and NCEH1 as positive
    controls, since both are established fluorophosphonate-reactive serine hydrolases.
  experiment_type: activity-based protein profiling
- hypothesis: The N-terminal hydrophobic segment of AADACL2 is a cleaved signal peptide, so the mature protein is
    released into the medium rather than retained in a membrane.
  description: Express epitope-tagged AADACL2 (tag at the C-terminus so it survives either topology) in primary
    keratinocytes or an immortalised keratinocyte line, and ask three questions in parallel - whether the protein
    accumulates in conditioned medium, whether it partitions with membranes after carbonate extraction, and whether
    it is protease-protected in digitonin- versus saponin-permeabilised cells. Determine the mature N-terminus of
    the secreted or membrane form by Edman sequencing or N-terminal peptide mass spectrometry, which will also test
    UniProt's cleavage position after residue 18. Run AADAC in parallel as the validated type-II anchor control.
  experiment_type: subcellular fractionation and protease protection
- hypothesis: AADACL2 contributes to lipid ester turnover during epidermal terminal differentiation, where its expression
    is concentrated.
  description: Profile AADACL2 protein and transcript across a calcium-induced keratinocyte differentiation time
    course and across epidermal layers, then knock the gene out in organotypic skin equivalents and measure the
    neutral lipid and wax/cholesterol ester composition of the stratum corneum by mass spectrometry, together with
    barrier function by transepidermal water loss. Because AADACL3 is also skin-expressed, test single and double
    knockouts to expose redundancy.
  experiment_type: differentiation time course plus knockout lipidomics in organotypic skin
