    summary: 'The most general molecular-function term in the ontology, one step below the root, produced by ARBA
      rule ARBA00027533. It is not wrong - the protein almost certainly is an enzyme - but it conveys nothing that
      the other six rows do not, and it is redundant with the two GO:0016787 rows and with GO:0052689 already present
      on the same record. The protein''s own feature table supports a specific mechanistic statement instead: an
      annotated Ser189-Asp341-His371 catalytic triad, an HGG oxyanion-hole motif at 111-113, a GDSSG nucleophile
      elbow and a PROSITE PS01174 GDXG-lipase serine match.'
    action: MODIFY
    reason: A root-adjacent term, fully redundant with GO:0052689 carboxylic ester hydrolase activity already present
      on this record from the family-specific IPR017157 signature, which is the term the three general molecular-function
      rows on this protein should all collapse onto. GO:0017171 serine hydrolase activity is also satisfied residue
      for residue by this protein - an annotated Ser189-Asp341-His371 triad with an HGG oxyanion hole and a GDSSG
      nucleophile elbow - but it is not carried by any existing row and is pursued instead as a PAINT node-placement
      recommendation, so GO:0052689 is the replacement proposed here, matching the treatment given to AADACL3 and
      AADACL4.
