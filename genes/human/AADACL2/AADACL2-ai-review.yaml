    supporting_text: identified KIAA0319, RELN, NCAPG, ABO, AADACL2, LMAN1, FLG, HERC5, CCDC66, LEKR1, AFF3, ABCG2,
      ANXA7, SYTL2,GIPR, METTL1, and FYCO1 as unreported genes for psoriasis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; the cached record is abstract-only, and the abstract itself names AADACL2 explicitly,
      so the claim used here does not depend on the full text. Supports no GO annotation - a susceptibility association
