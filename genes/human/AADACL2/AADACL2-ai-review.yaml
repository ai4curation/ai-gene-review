core_functions:
- description: 'AADACL2 is expected to act as a carboxylic ester hydrolase of the GDXG (hormone-sensitive-lipase-like)
    alpha/beta-hydrolase clan, using the Ser189-Asp341-His371 triad and the HGG oxyanion-hole loop at 111-113 to
    attack the carbonyl of an ester substrate, by analogy with every biochemically characterised member of the AADAC
    family. The reaction class is the better-founded of the two available statements on its own evidence, independently
    of any consistency argument: it rests on IPR017157, a family-specific signature rather than a fold signature,
    matching almost the whole chain, and on the chemistry of the family, every biochemically characterised member
    of which is a carboxylic ester hydrolase. The serine-hydrolase mechanism (GO:0017171) is separately and literally
    satisfied by this protein''s own annotated residues - all fifteen active-site-annotated relatives in its WITH/FROM
    column place their catalytic nucleophile on position 189, and fourteen of the fifteen carry a serine there -
    and neither statement subsumes the other. GO:0052689 is recorded here because it is the more informative of
    the two and the one GOA carries, with the mechanism term left as a PAINT node-placement recommendation rather
    than asserted as a second activity; AADACL3 and AADACL4, whose catalytic registers are identical, resolve it
    the same way. The substrate is unknown, no activity has been measured, and no biological process can be assigned.
    No location is recorded here deliberately: the protein is in the secretory pathway, but whether it is released
    or retained by an uncleaved type-II anchor is unresolved, so committing to either extracellular region or membrane
    would overstate what is known.'
