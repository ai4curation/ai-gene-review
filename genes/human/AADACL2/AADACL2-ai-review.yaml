- id: file:human/AADACL2/AADACL2-deep-research-affinage.md
  title: Affinage mechanistic annotation for AADACL2 (human)
  findings:
  - statement: The affinage record for AADACL2 is empty - zero discoveries and zero citations - despite passing
      its own quality gates. Consistent with the absence of any functional literature, but treated here as a lead
      rather than as evidence, and checked independently against PubMed and the UniProt reference list.
    supporting_text: No mechanistic discoveries found in literature.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'The record is empty - zero discoveries, zero citations, and no self_evaluation_pairwise
      score, so the tool''s trust gates had nothing to catch. An empty provider
      record is not by itself evidence that literature is absent, so the claim was verified separately: PubMed returns
      six AADACL2 hits, none of them a functional characterisation, and the three UniProt RN references are all
      large-scale sequencing papers. The independent confirmation is PMID:35736449, which states in prose that the
      AADACL2/AADACL3/AADACL4 subgroup has no assigned function.'
- id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
  title: 'AADACL2: is the esterase call founded, and which of its two localisations is?'
  findings:
  - statement: The catalytic apparatus is intact and independently corroborated. Eight of the fifteen WITH/FROM
      sources with annotated active sites - the seven closest by identity plus Mycobacterium tuberculosis LipN -
      map all three of their catalytic residues onto AADACL2's own annotated Ser189, Asp341 and His371. Those eight
      are human, mouse and rat AADAC, mouse Nceh1, the three M. tuberculosis carboxylesterases NlhH, LipI and LipN,
      and Arabidopsis CXE18. Every source that fails is at 26.5 percent identity or below, where global alignment
      loses register, so the failures are not evidence of residue loss.
    supporting_text: Eight of the fifteen sources with annotated active sites map all three residues onto AADACL2's
      own annotated triad
  - statement: Of the 14 reviewed UniProtKB entries carrying the IPR017157 family signature that generated the membrane
      annotation, 12 have a transmembrane segment - 11 of them annotated as a type-II signal anchor - and AADACL2
      is the only one whose equivalent segment is annotated as a cleaved signal peptide, so the membrane call transfers
      a feature the target record says it lacks.
    supporting_text: So the membrane claim is a transfer of a feature that AADACL2's own record says it does not
      have.
  - statement: The sequence nevertheless does not settle the topology. The annotated cleavage site puts histidine
      at -1, which signal peptidase I does not accept, and AADACL2's N-terminal hydrophobic core scores higher on
      peak Kyte-Doolittle hydropathy (1.94) than AADAC's experimentally validated type-II signal anchor (1.81).
    supporting_text: Hydropathy cannot distinguish them, and the N-termini are homologous
  - statement: Mass spectrometry cannot adjudicate the topology either. All four observed peptides lie in the catalytic
      domain, the earliest starting at residue 124, so none spans the annotated cleavage site or begins at the putative
      mature N-terminus.
    supporting_text: No peptide spans the annotated cleavage site and none starts at the putative mature N-terminus
      (residue 19).
  - statement: The PANTHER node placement is inverted with respect to what transfers safely - the well-conserved
      mechanistic activity sits only at ortholog-specific nodes while the poorly-conserved localisation sits at
      the shared family node, so moving GO:0017171 down and dropping GO:0016020 would correct AADACL2, AADACL3 and
      AADACL4 together.
    supporting_text: Moving the activity down to the family node and dropping the localisation from it would fix
      three human genes at once.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bioinformatics analysis carried out for this review; reproducible with the script in the same
      folder, all values fetched from the UniProt, InterPro, QuickGO, EBI Proteins and Human Protein Atlas REST
      APIs at run time and written to results.json. It reports a negative result honestly - the hydropathy and cleavage-site
      measurements undercut the initial hypothesis that the membrane annotation was a simple paralog artefact.
- id: file:human/AADACL2/AADACL2-bioinformatics/NODE_PTN009058710.md
  title: 'PANTHER node PTN009058710: which GO term is true of every donor? (shared node-level audit for AADACL2,
    AADACL3 and AADACL4)'
  findings:
  - statement: No candidate term below GO:0016787 survives every donor of PTN009058710, so the generic term PAINT
      chose is the exact least common ancestor of the donor set rather than an under-specific approximation to it.
    supporting_text: No donor refutes `GO:0016787`, and every more specific candidate is refuted by at least one
      donor.
  - statement: 'The two more specific candidates fail on different axes: the two kynurenine formamidases put GO:0052689
      out of reach, and soybean HIDH''s threonine nucleophile puts GO:0017171 out of reach.'
    supporting_text: 'GO:0052689 carboxylic ester hydrolase activity: TRUE 14, FALSE 2, UNDETERMINED 0'
  - statement: Soybean HIDH is bifunctional rather than a pure lyase, holding an IDA carboxylesterase annotation
      as well as its dehydratase activity, so it does not threaten the hydrolase parent at all.
    supporting_text: So HIDH is a genuine, if physiologically minor, carboxylic-ester hydrolase; it refutes the
      *serine* term only.
  - statement: The mechanism term is true of every donor PAINT cites at the family node PTN009058713 and held by
      IDA in all three of them, which is where it should be placed instead of at the deep node.
    supporting_text: all three carry `GO:0017171` by IDA
  - statement: The Thr164 call that the mechanism verdict turns on is a fold-position inference rather than a UniProt
      nucleophile label, but the elbow pentapeptide corroborates it at the sequence level and a sensitivity analysis
      shows the verdict does not depend on it.
    supporting_text: 'only_the_refuting_donor_undetermined: TRUE 15, FALSE 0, UNDETERMINED 1, true_of_every_donor=False'
  - statement: The identity of the WITH/FROM set across all three paralogs is measured rather than assumed, from
      two independent sources for every gene.
    supporting_text: That equality is **measured for all three genes, not assumed for any of them**
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Node-level audit written for the three-gene harmonisation, reproducible with audit_node_PTN009058710.py
      in the same folder; the WITH/FROM sets are read from the committed GOA TSVs and, independently, fetched per
      accession from QuickGO for all three paralogs, with the two sources cross-checked and a gene covered by neither
      treated as a hard error, and every donor''s chemistry, nucleophile and GO ancestry is fetched at run time.
      It corrects two premises this review had relied on: soybean HIDH is a bifunctional dehydratase/carboxylesterase
      rather than a non-hydrolase, and yeast BNA7 resolves to Q04066 with a serine nucleophile.'
- id: file:human/AADACL2/AADACL2-uniprot.txt
  title: UniProtKB entry Q6P093 (ADCL2_HUMAN), Arylacetamide deacetylase-like 2
  findings:
  - statement: The protein carries a complete serine-hydrolase catalytic triad, with the nucleophile at Ser189 in
      a GDSSG elbow, plus an oxyanion-hole motif at 111-113 and a conserved Cys116-Cys338 disulfide.
    supporting_text: FT   ACT_SITE        189
  - statement: UniProt assigns AADACL2 to the GDXG lipolytic enzyme family, the hormone-sensitive-lipase-like branch
      of the alpha/beta-hydrolase fold, and gives it the incomplete EC number 3.1.1.- rather than a specific reaction.
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ''GDXG'' lipolytic enzyme family.'
  - statement: The subcellular location is given as Secreted with no evidence tag, and rests on a predicted cleaved
      signal peptide covering residues 1-18.
    supporting_text: FT   SIGNAL          1..18
  - statement: Expression is skin-enriched, and the protein is detected at the protein level, but it remains pharmacologically
      undrugged and uncharacterised (Pharos Tdark).
    supporting_text: DR   HPA; ENSG00000197953; Tissue enriched (skin).
  - statement: Isoform 2 is expected to be degraded by nonsense-mediated decay and truncates before the catalytic
      serine, so it cannot carry the family activity.
    supporting_text: premature stop codon in the mRNA, leading to nonsense-mediated mRNA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The primary source for the residue-level evidence used throughout this review. Its active-site
      and motif features carry ECO:0000250 (by similarity to mouse Nceh1 Q8BLF1 and to Q5NUF3) and PROSITE-ProRule
      evidence rather than experiment, which is why they were re-tested independently by alignment to the characterised
      WITH/FROM sources rather than accepted at face value. One correction to report upstream: the SIGNAL 1..18
      cleavage position places histidine at -1, which is not a signal peptidase I site.'
