- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Mapped mechanically from UniProt''s Secreted subcellular-location statement (SubCell SL-0243), which
      in turn rests on a single predicted feature, SIGNAL 1..18 with mature chain 19-401, carrying ECO:0000255 sequence-model
      evidence, that is, a signal-peptide predictor rather than an experiment. Two measurements weaken that prediction.
      The proposed cleavage site places histidine at position -1, where signal peptidase I overwhelmingly requires
      a small neutral residue (Ala, Ser, Cys, Gly or Thr). And the hydrophobic core is at least as hydrophobic as
      the experimentally validated uncleaved type-II signal anchor of the 51.6 percent identical paralog AADAC:
      peak mean Kyte-Doolittle over a 19-residue window is 1.94 for AADACL2 residues 1-19 against 1.81 for AADAC
      residues 5-23, and the two N-termini are homologous over the whole segment. The Human Protein Atlas, whose
      protein-class assignment is a majority vote over several secretome and membrane predictors, does place AADACL2
      - and only AADACL2 among the five human paralogs - in the secreted class, but that is not independent corroboration:
      those are predictors of the same family as the one UniProt used, and the same HPA pipeline fails to classify
      AADAC, an experimentally validated single-pass membrane protein, as a membrane protein at all. No experiment
      has localised AADACL2, and the four peptides that establish its expression all lie in the catalytic domain,
      the earliest at residue 124, so they do not test whether the N-terminal helix is removed.'
    action: UNDECIDED
    reason: The sole basis is a predicted signal-peptide cleavage site whose -1 residue is one signal peptidase
      I does not use, and the same segment is a validated uncleaved membrane anchor in the closest characterised
      paralog. GOA simultaneously carries GO:0016020 membrane for this protein. The two terms are not disjoint in
      GO - a shed ectodomain can legitimately be in both - but here they are two incompatible readings of one hydrophobic
      helix, and only one of them can describe the mature protein. Accepting extracellular region would settle by
      fiat a topology question that no experiment has addressed; removing it would equally assert the alternative.
    supported_by:
    - reference_id: file:human/AADACL2/AADACL2-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Secreted.'
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: histidine at -1, which is not a residue signal peptidase I accepts
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: A classifier that misses one of the family's two experimentally validated membrane proteins
        cannot be used to argue that AADACL2 is a negative.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: 'The same claim as the PAINT membrane row, reached independently by ARBA rule ARBA00028763 and by the
      InterPro family signature IPR017157 (Arylacetamide deacetylase). Of the 14 reviewed UniProtKB entries carrying
      IPR017157, 12 have a TRANSMEM feature (11 of them annotated as a type-II signal anchor), one (human AADACL3)
      has neither a signal peptide nor a transmembrane segment, and exactly one - AADACL2 - has a cleaved signal
      peptide and no transmembrane segment. So the signature-to-GO mapping is a reasonable summary of the family
      and a poor summary of this member. It is also directly contradicted within the same GOA record by GO:0005576
      extracellular region, which UniProt''s own SubCell pipeline generated from the same protein''s SIGNAL feature:
      one database asserts both readings of one hydrophobic helix.'
    action: UNDECIDED
    reason: Kept open for the same reason as the PAINT row. The family-majority topology is a real argument for
      membrane anchoring, and the sequence measurements do not exclude it - AADACL2's N-terminal hydrophobic core
      scores higher than AADAC's validated anchor, and the predicted cleavage site is atypical. But nothing specific
      to AADACL2 supports it either, and the same record carries the alternative reading of the same helix. This
      should be resolved experimentally, not by choosing which pipeline to trust.
    supported_by:
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: Of the 14 reviewed members, AADACL2 is the only one whose N-terminal hydrophobic segment
        UniProt calls a cleaved signal peptide.
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
      supporting_text: Hydropathy cannot distinguish them, and the N-termini are homologous
    - reference_id: file:human/AADACL2/AADACL2-uniprot.txt
      supporting_text: DR   InterPro; IPR017157; Arylacetamide_deacetylase.
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013094
  review:
    summary: 'InterPro2GO mapping from IPR013094, Alpha/beta hydrolase fold-3 (Pfam PF07859, which matches this
      protein twice). That is a bare fold-level domain signature shared by esterases, lipases, amidases, a threonine-nucleophile
      dehydratase and catalytically dead relatives alike, so hydrolase activity is the most the signature itself
      can license and the mapping is correct for the signature. It is nonetheless redundant on this record: the
      same protein matches the subfamily-specific IPR017157, whose mapping supplies GO:0052689 carboxylic ester
      hydrolase activity, and residue-level evidence the fold signature cannot see - the complete Ser189-Asp341-His371
      triad, the HGG oxyanion loop, the GDSSG elbow, and the eight closest WITH/FROM donors placing their own catalytic
      residues on exactly those three positions - rules out the fold-retaining pseudoenzyme reading that would otherwise
      be the reason to stop at the parent.'
    action: MODIFY
    reason: 'Correct for the signature and redundant for the protein - a redundancy objection, not an under-specificity
      one. The IPR013094-to-GO:0016787 mapping should not change: most proteins matching a bare alpha/beta-hydrolase-3
      domain warrant nothing more specific, and the same fold signature also matches soybean HIDH, whose physiologically
