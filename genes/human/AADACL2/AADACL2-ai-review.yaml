- id: PMID:35736449
  title: KIAA1363-A Multifunctional Enzyme in Xenobiotic Detoxification and Lipid Ester Hydrolysis.
  findings:
  - statement: The AADAC family has five human members and only two of them, AADAC and AADACL1/KIAA1363/NCEH1, have
      been functionally characterised; AADACL2, AADACL3 and AADACL4 have no assigned function in the literature.
    supporting_text: all other members of the AADACL protein family, AADACL2, AADACL3, and AADACL4, have so far
      been only poorly investigated and no functional roles can be concluded
  - statement: AADAC, the family's name-giving member, is a type II membrane glycoprotein anchored in the ER with
      its catalytic domain in the lumen. This is the topology whose N-terminal signal anchor is the source of the
      propagated membrane annotation on AADACL2.
    supporting_text: AADAC is a type II membrane glycoprotein, facing with its active side to the lumen of the endoplasmic
      reticulum (ER)
  - statement: The family straddles bond types - AADAC hydrolyses both amide bonds of xenobiotic arylacetamides
      and ester bonds of endogenous diglycerides - so predicting a carboxylic ester hydrolase activity for AADACL2
      from family membership does not exclude amidase activity.
    supporting_text: AADAC, is known to hydrolyze amide and ester bonds of a number of xenobiotic substances, as
      well as clinical drugs and of endogenous lipid substrates such as diglycerides
  - statement: The catalytic domains of both characterised family members are structurally homologous to hormone-sensitive
      lipase, which places AADACL2 in the GDXG/HSL-like branch of the alpha/beta-hydrolase fold.
    supporting_text: the conserved structural homologies of the catalytic domain of KIAA1363, as well as AADAC to
      that of HSL
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified review by the Lass group, full text available in PMC. The most useful reference
      for this gene precisely because it states that AADACL2 has no known function, which independently corroborates
      the empty affinage record rather than leaving it as an argument from silence. Also the source for AADAC and
      KIAA1363 topology and substrate range, both of which bear directly on the propagated annotations reviewed
      here.
