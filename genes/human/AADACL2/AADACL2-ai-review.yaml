knowledge_gaps:
- gap_statement: No substrate and no measured activity. AADACL2 has never been assayed - not against an ester, an
    amide, a lipid or a xenobiotic - so although the catalytic machinery is demonstrably intact, which bond it hydrolyses,
    on which substrate, and to what end are all unknown. No biological process can be assigned, and consequently
    the entire GO record consists of two IBA and five IEA rows with no experimental evidence of any kind.
  boundary: What is established is the machinery and the expression. The Ser189-Asp341-His371 triad, the HGG oxyanion
    loop and the GDSSG nucleophile elbow are annotated on the protein and are in register with the catalytic residues
    of the 51.6 percent identical human AADAC, mouse and rat Aadac, mouse Nceh1 and three characterised Mycobacterium
    tuberculosis carboxylesterases. The protein is detected by mass spectrometry (four peptides) and its transcript
    is essentially skin-restricted. What is missing is any biochemistry at all.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: AADACL2 sits in a family whose two characterised members are pharmacologically important - AADAC
    hydrolyses clinically used arylacetamide prodrugs and procarcinogens, NCEH1/KIAA1363 is a drug-target serine
    hydrolase in cancer and platelet biology - and AADACL2 is the only family member whose expression is restricted
    to skin (AADACL3 is skin and placenta, AADACL4 choroid plexus). A skin-expressed serine esterase is a plausible
    participant in epidermal barrier lipid processing or in cutaneous xenobiotic handling, and the gene surfaced
    independently in a psoriasis indel screen, so the missing biochemistry is the barrier to interpreting a genetic
    signal that already exists.
  resolution: Serine-hydrolase activity-based protein profiling of the recombinant protein against a lipid and xenobiotic
    ester panel, which would establish both that it is catalytically active and what class of bond it prefers.
  provenance:
  - reference_id: PMID:35736449
    supporting_text: all other members of the AADACL protein family, AADACL2, AADACL3, and AADACL4, have so far
      been only poorly investigated and no functional roles can be concluded
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: 'Seven GOA rows, no experimental evidence of any kind: 2 IBA and 5 IEA.'
- gap_statement: Whether AADACL2 is secreted or membrane-anchored is undetermined, and GOA currently asserts both.
    The N-terminal hydrophobic segment is annotated as a cleaved signal peptide (SIGNAL 1..18) by UniProt and is
    the positional homolog of an experimentally validated uncleaved type-II signal anchor in AADAC and NCEH1. The
    predicted cleavage site places histidine at -1, which signal peptidase I does not use, and the hydrophobic core
    is more hydrophobic than AADAC's validated anchor, so the sequence does not discriminate.
  boundary: 'What is established: the protein enters the secretory pathway through an N-terminal hydrophobic helix,
    and it is expressed and detectable. What is missing is one experiment: no protease-protection, fractionation,
    surface-labelling or conditioned-medium assay has been performed on AADACL2, and the four observed peptides
    all lie in the catalytic domain (earliest residue 124), so mass spectrometry has not tested the N-terminal fate
    either.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: The two possibilities imply different biology - a soluble enzyme acting in the extracellular space
    or stratum corneum, against a membrane-tethered enzyme acting on lipids of the secretory pathway. GO does not
    forbid a protein from carrying both terms, but these two are alternative readings of a single hydrophobic helix,
    so only one can describe the mature protein. The curation-side half of the gap is that GOA currently carries
    both, from three separate pipelines, with nothing recording that they are alternatives rather than complements.
  resolution: A protease-protection or medium-versus-membrane fractionation experiment on tagged AADACL2 in a keratinocyte
    line, plus N-terminal sequencing of the mature protein, would settle it and license exactly one of the two existing
    annotations.
  provenance:
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: This is the classic signal-peptide / type-II-signal-anchor ambiguity, and UniProt has resolved
      it one way for AADACL2 and the other way for its four paralogs.
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: No peptide spans the annotated cleavage site and none starts at the putative mature N-terminus
      (residue 19).
- gap_statement: The mechanistic molecular function of the AADAC family is annotated only at ortholog-specific PANTHER
    nodes and not at the node the family shares, so three human genes carry no mechanism term they are entitled
    to. GO:0017171 serine hydrolase activity sits at PTN002745055 (AADAC) and PTN002745068 (NCEH1); AADACL2, AADACL3
    and AADACL4 inherit only bare hydrolase activity from the far deeper PTN009058710, while what they do inherit
    from the shared family node PTN009058713 is the much less transferable GO:0016020 membrane.
  boundary: 'The catalytic triad is conserved in all five human family members - each of their UniProt records annotates
    the equivalent Ser, Asp and His - and for AADACL2 that conservation was confirmed by alignment to eight independently
    characterised relatives. Which node can carry the term was then measured donor by donor. At PTN009058713 the
    donors are human AADAC, mouse Aadac and mouse Nceh1, all IPR017157 members, all serine nucleophiles, all carboxylic
    ester hydrolases, with GO:0017171 held by IDA in all three of them - so the term is true of every donor there
    and experimentally supported by each. At PTN009058710 it is false of one donor, soybean HIDH, whose nucleophile-elbow
    residue is a threonine where the other 15 donors carry a serine, and HIDH matches neither IPR017157 nor the
    family node. So the term cannot descend to the deep node but is safe at the family node. The N-terminal anchor
    runs the other way: present in 12 of the 14 reviewed IPR017157 entries, 11 of them an explicit type-II signal
    anchor, but absent from AADACL2''s record. Which of the two terms is safe at the family node is therefore not
    in doubt; only the annotation has not been made.'
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: 'This is a single tree-level edit that would correct three human genes at once, and the pattern
    is general: PAINT curators place well-evidenced mechanism terms conservatively at ortholog nodes while localisation
    terms, which transfer far less reliably, are placed at family nodes. The net effect is records where the location
    is asserted and the activity is not. It also explains a curation trap: because the mechanism term is genuinely
    true of the gene, it is tempting to attach it to whatever generic row is at hand, which misattributes it to
    a transfer that cannot support it. AADACL2, AADACL3 and AADACL4 now all state the recommendation as a node move
    instead.'
  resolution: Move GO:0017171 serine hydrolase activity down to PTN009058713 and drop GO:0016020 membrane from that
    node pending experimental topology data.
  provenance:
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: The placement is the wrong way round with respect to what actually transfers.
  - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
    supporting_text: Moving the activity down to the family node and dropping the localisation from it would fix
