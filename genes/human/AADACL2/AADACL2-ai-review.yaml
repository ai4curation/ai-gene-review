- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'InterPro2GO mapping from IPR013094, Alpha/beta hydrolase fold-3 (Pfam PF07859, which matches this
      protein twice). That is a bare fold-level domain signature shared by esterases, lipases, amidases and catalytically
      dead relatives alike, so hydrolase activity is the most the signature itself can license and the mapping is
      appropriate for the signature. It is superseded for this particular protein by residue-level evidence the
      signature cannot see: the complete Ser189-Asp341-His371 triad, the HGG oxyanion loop, the GDSSG elbow, and
      the alignment result that the seven closest WITH/FROM sources, plus Mycobacterium tuberculosis LipN, place
      their own catalytic residues on exactly those three positions.'
    action: MODIFY
    reason: Correct but under-informative for AADACL2. The domain signature cannot distinguish an active serine
      hydrolase from a fold-retaining pseudoenzyme, whereas this protein's annotated active sites and their conservation
      across characterised relatives do, and they support the mechanism term GO:0017171 serine hydrolase activity.
    proposed_replacement_terms:
    - id: GO:0017171
      label: serine hydrolase activity
    supported_by:
    - reference_id: file:human/AADACL2/AADACL2-bioinformatics/RESULTS.md
