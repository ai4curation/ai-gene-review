- id: PMID:32789677
  title: The novel mutation P36R in LRP5L contributes to congenital membranous cataract via inhibition of laminin γ1 and c-MAF.
  full_text_unavailable: true
  findings:
  - statement: >-
      The study identified LRP5L c.107C>G (p.P36R) in a congenital membranous
      cataract family and reported that it was absent from two comparison groups.
    supporting_text: |-
      We identified a novel suspected pathogenic mutation in LRP5L
      (c.107C > G, p.P36R) in the congenital membranous cataract family. This mutation
      was absent in 300 normal controls and 300 age-related cataract patients.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - NCBIGene:91355
      review_notes: >-
        The variant observation remains a reported primary result, but its
        protein-coding/pathogenic interpretation is uncertain after NCBI's 2026
        pseudogene reclassification and suppression of both former NM records.
  - statement: >-
      In HLE B-3 cells and human anterior lens capsules, the authors report that
      wild-type LRP5L increased laminin gamma-1 and c-MAF expression, whereas
      P36R inhibited those effects.
    supporting_text: |-
      LRP5L upregulated laminin γ1 expression in the cytoplasmic proteins
      of HLE B-3 cells and human anterior lens capsules, and LRP5L-P36R inhibited the
      effects of LRP5L. LRP5L upregulated c-MAF expression in the nucleus and
      cytoplasm of HLE B-3 cells, and LRP5L-P36R inhibited c-MAF expression via
      inhibition of laminin γ1.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - NCBIGene:91355
      review_notes: >-
        This reports perturbation-dependent expression effects, not an intrinsic
        biochemical activity, receptor function, direct interaction, or native
        localization. The protein interpretation must be reassessed against the
        current pseudogene model; only the abstract was available for review.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed identifier/title and the complete cached abstract were manually
      checked. This is the only located primary experimental study directly about
      human LRP5L, but its causal protein interpretation is now materially
      contested by current NCBI Gene/RefSeq annotation, and the unavailable full
      text prevents independent assessment of construct identity, segregation,
      and assay controls. The reported expression effects do not justify an LRP5/
      LRP6-like receptor or Wnt-signaling annotation.
knowledge_gaps:
- gap_statement: >-
    Whether the human LRP5L locus produces a stable endogenous polypeptide is
    unknown, and the transcript(s), translation start site, and isoform(s) that
    could generate such a product have not been reconciled with the current
    pseudogene model.
  boundary: >-
    Transcript-derived cDNA models historically supported the 252-amino-acid
    A4QPB2 sequence and its C-terminal alternative isoform, and UniProtKB retains
    a reviewed PE2 entry. In contrast, current NCBI Gene/RefSeq classifies LRP5L
    as a pseudogene, represents it with predicted non-coding RNAs, and suppresses
    NM_001135772.2 and NM_182492.3 because the locus is now thought to be a
    pseudogene. No endogenous protein-level evidence was identified.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Protein existence is prerequisite to assigning any protein molecular
    function, localization, or biological process and to interpreting P36R as a
    protein-altering variant.
  resolution: >-
    Reconstruct the locus with phased long-read RNA sequencing, test translation
    by ribosome profiling, and seek locus-unique endogenous peptides with targeted
    mass spectrometry in human lens and other expressing tissues; then reconcile
    the RefSeq and UniProtKB records against those results.
  provenance:
  - reference_id: file:human/LRP5L/LRP5L-uniprot.txt
    supporting_text: "PE   2: Evidence at transcript level;"
  - reference_id: NCBIGene:91355
    supporting_text: "NM_001135772.2: This RefSeq was removed because it is now thought that this gene is a pseudogene."
  - reference_id: NCBIGene:91355
    supporting_text: "NM_182492.3: This RefSeq was removed because it is now thought that this gene is a pseudogene."
- gap_statement: >-
    The molecular mechanism connecting LRP5L perturbation or the P36R construct
    to laminin gamma-1 and c-MAF expression is unknown, including whether the
    reported effects are direct, require an endogenous translated product, or are
    specific to a particular transcript or isoform.
  boundary: >-
    A single study reported P36R in a congenital membranous cataract family and
    reported that wild-type and P36R plasmids plus LRP5L siRNA altered laminin
    gamma-1 and c-MAF expression in HLE B-3 cells and human anterior lens
    capsules. The cached abstract establishes perturbation-dependent expression
    effects but not an intrinsic molecular activity, direct interaction, native
    localization, or endogenous protein production.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving the mechanism is necessary to distinguish a protein-mediated lens
    phenotype from transcript-level regulation, construct-specific effects, or a
    linked variant and to determine whether any GO annotation is warranted.
  resolution: >-
    Reproduce the phenotype with locus-specific CRISPR perturbations in lens
    models, rescue with sequence-verified isoform 1, isoform 2, and P36R
    constructs matched to current genomic models, and test direct versus indirect
    control of laminin gamma-1 and c-MAF with time-resolved transcript and protein
    measurements.
  provenance:
  - reference_id: PMID:32789677
    supporting_text: |-
      LRP5L upregulated laminin γ1 expression in the cytoplasmic proteins
      of HLE B-3 cells and human anterior lens capsules, and LRP5L-P36R inhibited the
      effects of LRP5L. LRP5L upregulated c-MAF expression in the nucleus and
      cytoplasm of HLE B-3 cells, and LRP5L-P36R inhibited c-MAF expression via
      inhibition of laminin γ1.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
