suggested_questions:
- question: >-
    Does LRP5L produce a stable endogenous protein in the human lens or any other
    tissue, and which current transcript and isoform encode it if so?
  experts:
  - Sun L
  - Ge H
  - Liu P
- question: >-
    Does P36R still map to a translated LRP5L open reading frame under the current
    human locus model, and does it segregate independently of other candidate
    variants in the cataract family?
  experts:
  - Sun L
  - Song F
  - Liu H
- question: >-
    Are the reported laminin gamma-1 and c-MAF expression changes reproduced by
    endogenous locus-specific perturbation, and are they mediated by an LRP5L
    protein, an LRP5L RNA, or an indirect construct effect?
  experts:
  - Sun L
  - Wang C
  - Tang X
suggested_experiments:
- hypothesis: >-
    The LRP5L locus is transcribed but does not produce a stable endogenous
    252-amino-acid protein, consistent with the current NCBI pseudogene model.
  description: >-
    Perform phased long-read RNA sequencing and ribosome profiling across the
    LRP5L locus in human lens tissue and HLE B-3 cells, followed by targeted
    parallel-reaction-monitoring mass spectrometry using peptides unique to the
    predicted isoform 1 and isoform 2 products. Include synthetic heavy-peptide
    standards, a confirmed low-abundance lens protein as a positive control, and
    genomic/transcript mapping filters that exclude homologous LRP-family reads.
  experiment_type: transcriptomics, ribosome profiling, and targeted proteomics
- hypothesis: >-
    The reported effects on laminin gamma-1 and c-MAF require a specific LRP5L
    transcript or translated isoform and are altered by P36R.
  description: >-
    Use multiple non-overlapping CRISPRi guides and transcript-targeted antisense
    oligonucleotides to perturb endogenous LRP5L in HLE B-3 cells and a human
    lens-organoid model. Rescue with sequence-verified isoform 1, isoform 2, and
    P36R constructs expressed at near-endogenous levels, then quantify LAMC1 and
    c-MAF RNA/protein over time. Pair the rescue with translation-dead RNA
    constructs to distinguish protein-mediated from RNA-mediated effects and
    include matched empty-vector and unrelated-repeat-protein controls.
  experiment_type: endogenous perturbation and isoform-rescue assay
- hypothesis: >-
    If an endogenous LRP5L polypeptide exists, its native localization and
    interaction partners differ from those of the full-length LRP5 and LRP6
    receptors.
  description: >-
    Conditional on detecting endogenous translation, introduce a small epitope
    tag at the endogenous locus without altering the alternative C terminus and
    analyze localization by orthogonal microscopy and biochemical fractionation.
    Identify reproducible proximity-labeling or affinity-purification partners
    for each supported isoform, with untagged cells and LRP5/LRP6 analyzed
    separately as controls rather than assumed homologues.
  experiment_type: endogenous tagging, localization, and interaction proteomics
