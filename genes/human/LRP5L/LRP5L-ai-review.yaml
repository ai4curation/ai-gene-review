id: A4QPB2
gene_symbol: LRP5L
product_type: PSEUDOGENE
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP5L is a human transcribed locus represented in UniProtKB by a 252-amino-acid
  protein model composed of five LDL-receptor class B repeats; an alternative
  isoform changes residues 220-224 and lacks residues 225-252. In human lens
  epithelial cells and anterior lens capsules, plasmid-expression and siRNA
  experiments implicated LRP5L and the P36R variant in altered laminin gamma-1
  and c-MAF expression associated with congenital membranous cataract. Endogenous
  protein production and the molecular basis of these effects remain unresolved:
  NCBI Gene/RefSeq now classifies the locus as a pseudogene and has suppressed its
  former coding transcripts, whereas UniProtKB retains a reviewed PE2
  transcript-evidence protein entry.
