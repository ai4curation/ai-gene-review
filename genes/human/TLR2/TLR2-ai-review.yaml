      TLR6 is how TLR2 acquires ligand specificity.
    proposed_replacement_terms: *id001
    supported_by:
    - reference_id: PMID:23155421
      supporting_text: The TLR2 transmembrane domain demonstrated strong heterotypic interactions in bacterial
        membranes with its known interaction partners, TLR1 and TLR6, as well as with a proposed interaction
        partner, TLR10
    - reference_id: PMID:19931471
      supporting_text: Its ligand specificity is controlled by whether it heterodimerizes with TLR1 or
        TLR6
