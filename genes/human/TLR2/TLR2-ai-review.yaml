id: O60603
gene_symbol: TLR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Toll-like receptor 2 (TLR2, CD282) is a single-pass type I transmembrane pattern recognition
  receptor of the innate immune system. It is expressed mainly on monocytes, macrophages, dendritic cells
  and other myeloid cells, and also on epithelial cells such as keratinocytes. Its leucine-rich-repeat
  ectodomain recognizes microbial lipoproteins and lipopeptides, lipoteichoic acid and other cell-wall
  components of Gram-positive bacteria, mycobacteria, mycoplasma and fungi. TLR2 acts as a heterodimer:
  with TLR1 it responds to triacylated lipopeptides and with TLR6 to diacylated lipopeptides. A pocket
  in TLR2 holds the two ester-linked acyl chains, and in the TLR1 complex the amide-linked chain enters
  a channel in TLR1, so ligand binding bridges the two ectodomains and brings their cytoplasmic TIR domains
  together. The TIR dimer recruits the adaptors TIRAP/Mal and MyD88, leading to NF-kappaB and MAP kinase
  activation and production of inflammatory cytokines and chemokines such as IL-8, IL-6 and TNF. CD14,
  CD36 and LBP assist ligand delivery. TLR2 signals from the cell surface, where ligand-bound heterodimers
  gather in lipid rafts, and it is also recruited to phagosomes. Endogenous molecules such as aggregated
  amyloid-beta also engage TLR2. Variation in TLR2 influences susceptibility to mycobacterial infection,
  including leprosy.'
