- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:11274165
  qualifier: enables
  review:
    summary: Direct lipopolysaccharide binding by TLR2, from a photo-crosslinking study of the LPS receptor
      complex.
    action: UNDECIDED
    reason: 'The cached abstract reports that LPS cross-linked specifically to TLR4 and MD-2 (with CD14);
      it does not state that TLR2 was cross-linked, and the full text is not cached. Other cached papers
      argue against TLR2 being an LPS receptor: soluble TLR2 ectodomain binds LPS very weakly, TLR2 does
      not respond to pure protein-free LPS without MD-2, and LPS responses attributed to TLR2 in keratinocytes
      were ascribed to contaminating non-LPS components. The curator may have seen TLR2 used as a comparator
      in the full text; I cannot verify what was shown.'
    supported_by:
    - reference_id: PMID:11274165
      supporting_text: Here we show that LPS is cross-linked specifically to TLR4 and MD-2 only when co-expressed
        with CD14
