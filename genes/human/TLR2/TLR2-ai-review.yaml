    label: Toll-like receptor 1-Toll-like receptor 2 protein complex
  supported_by:
  - reference_id: PMID:17889651
    supporting_text: Binding of the tri-acylated lipopeptide, Pam(3)CSK(4), induced the formation of an
      "m" shaped heterodimer of the TLR1 and TLR2 ectodomains
  - reference_id: PMID:17889651
    supporting_text: We propose that formation of the TLR1-TLR2 heterodimer brings the intracellular TIR
      domains close to each other to promote dimerization and initiate signaling
- description: As a TLR2:TLR6 heterodimer, TLR2 recognizes diacylated lipopeptides, lipoteichoic acid
    and other Gram-positive and mycobacterial components, signaling from the cell surface and phagosomes.
  molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
