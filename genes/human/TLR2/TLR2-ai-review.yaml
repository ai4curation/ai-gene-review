    label: toll-like receptor TLR1:TLR2 signaling pathway
  - id: GO:0042495
    label: detection of triacyl bacterial lipopeptide
  - id: GO:0045087
    label: innate immune response
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0044853
    label: plasma membrane raft
  in_complex:
