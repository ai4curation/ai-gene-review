    supporting_text: Its ligand specificity is controlled by whether it heterodimerizes with TLR1 or TLR6
  - reference_id: PMID:11095740
    supporting_text: TLR6 and TLR2 both are recruited to the macrophage phagosome, where they recognize
      peptidoglycan, a Gram-positive pathogen component
- description: TLR2 binds the lipid moieties of bacterial lipopeptides directly, holding the ester-linked
    acyl chains in a hydrophobic pocket.
  molecular_function:
    id: GO:0042497
    label: triacyl lipopeptide binding
  directly_involved_in:
  - id: GO:0071727
    label: cellular response to triacyl bacterial lipopeptide
  supported_by:
  - reference_id: PMID:17889651
    supporting_text: the two ester-bound lipid chains are inserted into a pocket in TLR2, while the amide-bound
      lipid chain is inserted into a hydrophobic channel in TLR1
- description: TLR2 pairs with TLR1 or TLR6 (and TLR10); the heterodimers pre-exist before ligand binding
    and set ligand specificity.
  molecular_function:
    id: GO:0035325
    label: Toll-like receptor binding
  supported_by:
  - reference_id: PMID:16880211
    supporting_text: Our data show that TLR2 forms heterodimers with TLR1 and TLR6 and that these heterodimer
      pre-exist and are not induced by the ligand
suggested_questions:
- question: Does human TLR2 bind LPS in any physiological setting, or do TLR2 responses to LPS preparations
    reflect contaminating lipoproteins or MD-2-dependent effects? The GO:0001530 and GO:0001875 rows depend
    on this.
- question: Is TLR2 recognition of peptidoglycan direct, or due to lipoproteins that co-purify with peptidoglycan
    preparations?
- question: Do TLR2 homodimers signal physiologically in human cells, or is the signaling unit always
    a heterodimer with TLR1, TLR6 or TLR10?
- question: Should the mouse-derived ISS annotations to neural and behavioural processes (learning, microglia
    development, synapse assembly) be propagated to human TLR2 at all?
suggested_experiments:
- description: Binding assays with highly purified, lipoprotein-free LPS and peptidoglycan against soluble
    TLR2 ectodomain, with and without MD-2 and CD14, to settle whether these are direct TLR2 ligands.
- description: Signaling assays in TLR1/TLR6/TLR10 triple-deficient human myeloid cells to test whether
    TLR2 alone can respond to lipoteichoic acid or other agonists.
