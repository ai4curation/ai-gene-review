  review:
    summary: Traceable author statement that TLR2 has lipopolysaccharide immune receptor activity.
    action: REMOVE
    reason: The cited review itself assigns LPS recognition to TLR4 and describes TLR2 as mediating responses
      to Gram-positive bacteria and yeast, so it does not support the statement. Pure, protein-free LPS
      does not signal through TLR2 without MD-2, and TLR2 responses to commercial LPS were attributed
      to contaminating components. TLR2 is a lipopeptide/lipoprotein receptor, not an LPS receptor.
