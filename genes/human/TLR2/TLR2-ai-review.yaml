core_functions:
- description: As a TLR1:TLR2 heterodimer, TLR2 is the cell-surface receptor for triacylated bacterial
    lipopeptides. Ligand binding bridges the TLR1 and TLR2 ectodomains and brings the TIR domains together
    to recruit TIRAP and MyD88, leading to NF-kappaB activation.
  molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  directly_involved_in:
