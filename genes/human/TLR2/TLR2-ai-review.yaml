- term:
    id: GO:0001875
    label: lipopolysaccharide immune receptor activity
  evidence_type: IDA
  original_reference_id: PMID:16880211
  qualifier: contributes_to
  review:
    summary: TLR2 contributes, as part of the TLR2:TLR1 and TLR2:TLR6 heterodimers, to a cell-surface
      receptor activity for bacterial lipopeptides. The cited study examines those heterodimers and their
      lipopeptide ligands, not LPS.
    action: MODIFY
    reason: 'The contributes_to receptor claim is sound - TLR2 forms pre-existing heterodimers with TLR1
      and TLR6 that are activated at the cell surface - but GO:0001875 is defined as combining with lipopolysaccharide.
      The TLR2 heterodimers recognise triacylated (with TLR1) and diacylated (with TLR6) lipopeptides; LPS
      is sensed by TLR4/MD-2, and TLR2 does not respond to pure LPS without MD-2. This row appears to be
      the GAF export of GO-CAMs 5fb9cc0600000727 (TLR1-TLR2 complex) and 5fce9b7300000030 (TLR2-TLR6 complex),
      whose own ligands are triacyl lipopeptide, diacyl lipopeptide and a bacteriocin (same reference,
      curator and date); GO has no lipopeptide-specific immune receptor term. Generalised to pattern recognition
      receptor activity, keeping contributes_to, consistent with the matching rows on TLR1 and TLR6.'
    proposed_replacement_terms:
    - id: GO:0038187
      label: pattern recognition receptor activity
    supported_by:
    - reference_id: PMID:16880211
      supporting_text: Our data show that TLR2 forms heterodimers with TLR1 and TLR6 and that these heterodimer
        pre-exist and are not induced by the ligand
    - reference_id: PMID:16880211
      supporting_text: Activation occurs at the cell surface, and the observed trafficking is independent
        of signaling
    - reference_id: PMID:19931471
      supporting_text: Toll-like receptor 2 (TLR2) initiates potent immune responses by recognizing diacylated
        and triacylated lipopeptides. Its ligand specificity is controlled by whether it heterodimerizes
        with TLR1 or TLR6.
    - reference_id: PMID:11521063
      supporting_text: TLR2 without MD-2 does not respond to pure protein-free endotoxic LPS, ReLPS, and
        lipid A
    - reference_id: PMID:11521063
      supporting_text: MD-2 enables TLR2 to respond to non-activating LPS, ReLPS, and lipid A
