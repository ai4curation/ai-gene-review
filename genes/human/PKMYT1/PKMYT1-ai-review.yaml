- id: PMID:10373560
  title: Overproduction of human Myt1 kinase induces a G2 cell cycle delay by interfering with the intracellular
    trafficking of Cdc2-cyclin B1 complexes.
  findings:
  - statement: The C-terminal 63 residues of Myt1 form a Cdc2-cyclin B1 interaction domain; removing
      them abolishes cyclin B1 binding.
    supporting_text: The COOH-terminal 63 amino acids of Myt1 were identified as a Cdc2-cyclin B1 interaction
      domain
  - statement: Arg486, Asn487 and Leu488 (an RXL motif) are the key cyclin B1-binding residues; substituting
      them with alanine abolishes co-immunoprecipitation of cyclin B1.
    supporting_text: cyclin B1 coimmunoprecipitated with wild-type Myt1 (lane 2) but not the mutant
      form of Myt1 (lane 3), indicating that residues R, N, and L at positions 486, 487, and 488, respectively,
      are important for cyclin B1 binding
  - statement: Docking of Cdc2-cyclin B1 to the Myt1 C terminus is required for efficient Cdc2 phosphorylation
      in vitro.
    supporting_text: deletion of the COOH-terminal 63 amino acids of Myt1 impaired the ability of Myt1
      to phosphorylate Cdc2 in vitro
  - statement: Overproduced Myt1 delays cells in G2 by sequestering Cdc2-cyclin B1 complexes in the
      cytoplasm, an effect retained by kinase-inactive Myt1.
    supporting_text: overproduction of Myt1 perturbs cell cycle progression by sequestering Cdc2-cyclin
      B1 complexes in the cytoplasm
  - statement: Human Myt1 localises to ER and Golgi whereas Wee1 is nuclear, and membrane targeting
      requires residues Arg378 to His399.
    supporting_text: Membrane targeting requires 20 amino acid residues bordered by arginine 378 and
      histidine 399
  - statement: The mitotic (hyperphosphorylated) form of Myt1 no longer interacts with Cdc2-cyclin B1.
    supporting_text: We found that the mitotic form of Myt1 no longer interacts with Cdc2-cyclin B1
      complexes
  - statement: Myt1, unlike Wee1, fails to recognise Cdk2-cyclin A/E complexes as substrates in vitro.
    supporting_text: In contrast, Myt1 fails to recognize these complexes as substrates in vitro
