id: Q99640
gene_symbol: PKMYT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PKMYT1 (Myt1) is a membrane-associated protein kinase of the WEE1 subfamily that restrains
  entry into mitosis by phosphorylating the cyclin-dependent kinase CDK1 (Cdc2) on the inhibitory residue
  Thr14, and, to a lesser and less firmly established degree, on Tyr15; phosphorylation of either site
  lowers cyclin B-CDK1 activity and phosphorylation of both nearly abolishes it. PKMYT1 acts preferentially
  on cyclin-bound CDK1 and does not phosphorylate CDK2- or CDK4-containing complexes, making it a substrate-restricted
  counterpart of the nuclear kinase WEE1, which is directed mainly at CDK1 Tyr15. Unlike WEE1, PKMYT1
  is a peripheral protein of the endoplasmic reticulum and Golgi membranes: a 20-residue hydrophobic
  motif C-terminal to the kinase domain (arginine 378 to histidine 399) anchors it there, and both the
  kinase domain and the C-terminal substrate-docking region face the cytosol. The C-terminal 63 residues
  contain an RXL motif (Arg486-Asn487-Leu488) that docks cyclin B1-CDK1; this docking both promotes
  efficient Thr14 phosphorylation and tethers the complex to the cytoplasmic face of these membranes,
  limiting the nuclear-cytoplasmic shuttling of cyclin B1-CDK1. PKMYT1 is therefore a brake on premature
  mitosis, opposed by the CDC25 phosphatases; at mitotic entry it becomes hyperphosphorylated (CDK1
  and PLK1 have both been implicated, with Ser426 phosphorylated by PLK1), loses affinity for cyclin
  B1-CDK1 and releases the brake. Myt1-type kinases perform the equivalent CDK1-inhibitory role in the
  prophase arrest of oocytes in other animals. Because PKMYT1 sustains inhibitory CDK1 phosphorylation
  when replication is incomplete, tumour cells under high replication stress, such as those with CCNE1
  amplification, depend on it, and selective PKMYT1 inhibitors (lunresertib/RP-6306) force such cells
  into mitosis with under-replicated DNA.'
