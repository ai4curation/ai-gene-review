proposed_new_terms: []
suggested_questions:
- question: Is human PKMYT1 a genuine dual-specificity kinase in cells, i.e. does it phosphorylate CDK1
    Tyr15 directly, or is the Tyr15 signal attributable to WEE1 and to PKMYT1 autophosphorylation? UniProt
    currently flags the tyrosine activity as unclear and possibly indirect, and no GO annotation asserts
    protein tyrosine kinase activity for PKMYT1.
- question: Which kinase actually inactivates PKMYT1 at mitotic entry, and is PLK1 phosphorylation of
    Ser426 sufficient to abolish cyclin B1-CDK1 docking, or is CDK1-dependent hyperphosphorylation of
    the C-terminal region required as well?
- question: Does human PKMYT1 maintain the prophase-I arrest of human oocytes, as Myt1 orthologues do
    in Xenopus and mouse? The meiotic annotations on human PKMYT1 rest on phylogenetic inference alone.
suggested_experiments:
- hypothesis: PKMYT1 phosphorylates CDK1 Thr14 directly but contributes little or no direct Tyr15 phosphorylation
    in cells.
  description: Assay purified recombinant PKMYT1 against cyclin B1-CDK1 complexes carrying T14A or Y15F
    substitutions, reading out site occupancy by phosphosite-specific antibodies and quantitative mass
    spectrometry; repeat in cells depleted of WEE1 or treated with a WEE1 inhibitor to separate the
    two kinases' contributions to each site.
  experiment_type: biochemical and cell-based kinase assay
- hypothesis: The catalytic and the docking/sequestration arms of PKMYT1 make separable contributions
    to the G2 brake at endogenous expression levels.
  description: Generate isogenic knock-ins of kinase-dead (Asp233 or Asn238 substituted) and RXL-motif
    (R486A/N487A/L488A) PKMYT1 at the endogenous locus, and compare CDK1-pThr14 levels, cyclin B1 nuclear-cytoplasmic
    shuttling by live imaging, and mitotic-entry timing; previous work used overproduced protein, which
    may exaggerate the sequestration effect.
  experiment_type: CRISPR knock-in with live-cell imaging
- hypothesis: ER/Golgi membrane anchoring is required for PKMYT1 to restrain mitotic entry, rather than
    being incidental to its kinase activity.
  description: Replace endogenous PKMYT1 with variants lacking the membrane-targeting motif (delta 378-399),
    with the motif replaced by a heterologous ER anchor, or with an added nuclear-localisation signal,
    and test which variants restore CDK1-pThr14 and normal G2 length, and whether a nuclear PKMYT1 can
    substitute for WEE1.
