  review:
    summary: Phylogenetic inference of protein kinase activity from the PTHR11042 node PTN000113601,
      whose descendants include the WEE1/Myt1 kinases and the eIF2-alpha kinases. The kinase activity
      itself is correct for PKMYT1; only the granularity is at issue.
    action: MODIFY
    reason: 'PKMYT1''s residue specificity is experimentally established: it phosphorylates CDK1 on
      Thr14 in a cyclin-dependent manner and phosphorylates/inactivates Cdc2-cyclin complexes but not
      CDK2 or CDK4 complexes. GO:0004674 protein serine/threonine kinase activity is the correct, already-annotated
      (IDA) level of specificity; the bare protein kinase activity parent is less informative. GO:0004713
      protein tyrosine kinase activity is deliberately not proposed: UniProt records the Tyr-15 activity
      as unclear and possibly indirect, and no GOA row asserts it. The node placement is sound - PKMYT1
      has an intact protein kinase domain (residues 110-359), catalytic Asp233 and an ATP-binding site
      - so this is a granularity correction, not a challenge to the phylogenetic judgment.'
