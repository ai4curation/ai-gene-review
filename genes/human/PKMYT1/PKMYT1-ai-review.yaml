      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000113601
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node of PTHR11042; nuclear localisation holds for the WEE1-type and eIF2-alpha-kinase
          descendants but not for the Myt1 sub-branch, which acquired a C-terminal ER/Golgi membrane
          anchor.
      - source_id: PomBase:SPCC18B5.03
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Fission yeast WEE1-family kinase; nuclear in S. pombe, unlike membrane-anchored human
          PKMYT1.
      residue_claims_not_applicable: The argument concerns a whole membrane-targeting motif (residues
        378-399) present in PKMYT1 and absent from the nuclear family members, not a point-residue gain
        or loss.
