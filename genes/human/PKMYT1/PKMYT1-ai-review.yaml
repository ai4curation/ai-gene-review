- term:
    id: GO:0000079
    label: regulation of cyclin-dependent protein serine/threonine kinase activity
  evidence_type: TAS
  original_reference_id: PMID:9001210
  qualifier: involved_in
  review:
    summary: PKMYT1 regulates the cyclin-dependent kinase CDK1 by phosphorylating it on the inhibitory
      residue Thr14, so it does regulate cyclin-dependent protein serine/threonine kinase activity -
      but the direction of that regulation is known and is uniformly negative.
    action: MODIFY
    reason: 'The parent term leaves the sign of the regulation unspecified. Every characterised activity
      of PKMYT1 on CDK1 is inhibitory: it phosphorylates Thr14 (and possibly Tyr15), sites whose phosphorylation
      inactivates cyclin B-CDK1, and it phosphorylates and inactivates Cdc2-containing cyclin complexes
      in vitro. GO:0045736 negative regulation of cyclin-dependent protein serine/threonine kinase activity
      states the same claim at the correct, informative specificity.'
    proposed_replacement_terms:
    - id: GO:0045736
      label: negative regulation of cyclin-dependent protein serine/threonine kinase activity
