  review:
    summary: Phylogenetic inference of nuclear localisation from a PTHR11042 node whose experimentally
      characterised members include the nuclear WEE1-type kinases; human PKMYT1 itself is membrane-bound
      throughout the cell cycle and is nuclear only when its membrane anchor is removed.
    action: REMOVE
    reason: 'Human PKMYT1 is a peripheral membrane protein: endogenous Myt1 remains membrane-bound throughout
      the cell cycle, and the protein becomes predominantly nuclear only when its membrane-targeting
      motif (arginine 378 to histidine 399) is deleted. UniProt records no nuclear location for Q99640
      - only ER membrane and Golgi apparatus membrane - and the functional point of the protein is that
      it engages a cytoplasmic, membrane-proximal pool of cyclin B-CDK1 while its paralogue WEE1 works
      in the nucleus. An is_active_in/located_in nucleus assertion therefore conflicts with the target-specific
      experimental evidence. This is an argument about node placement for this member, not about donor
      count: PKMYT1 sits in the Myt1 sub-branch that acquired a C-terminal membrane anchor, so the nuclear
      character of the WEE1-type descendants was not inherited by it.'
    supported_by:
    - reference_id: PMID:9268380
      supporting_text: Analysis of endogenous Myt1 demonstrates that it remains membrane-bound throughout
        the cell cycle
    - reference_id: PMID:10373560
      supporting_text: Furthermore, human Myt1 is localized to the endoplasmic reticulum and Golgi complex
        (40), whereas Wee1 localizes to the nucleus
    - reference_id: PMID:9001210
      supporting_text: A stretch of hydrophobic and uncharged amino acids located outside the catalytic
        domain of Myt1Hu is the likely membrane-targeting domain, as its deletion results in the localization
        of Myt1Hu primarily to the nucleus
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
