    on the inhibitory residue Thr14 (and, less efficiently, Tyr15) at the cytoplasmic face of endoplasmic
    reticulum and Golgi membranes, holding cyclin B-CDK1 catalytically inactive and so acting as a brake
    on the G2/M transition until CDC25 reverses the modification.
