    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Local exploratory GATA3 sidecar. The domain-architecture section
      and the human-mouse zinc-finger comparisons are sound enough to corroborate
      the two C4-type zinc fingers. Three other sections should not be curated from:
      the cross-species conservation analysis uses four of six purported ortholog
      accessions that contain no GATA zinc finger and computes identity positionally
      without alignment; the interaction section is a STRING functional-network expansion
      presented as validated partners; and the target-gene section is a hardcoded
      curated list, not a de novo validation.'
