taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATA3 is a nuclear zinc-finger transcription factor that recognizes GATA
  sequence motifs and activates or represses target genes through context-dependent
  coactivator and corepressor interactions. Its tandem zinc fingers can recognize
  DNA within nucleosomes, providing a mechanism for engaging chromatin whose accessibility
  depends on local motif arrangement and other chromatin regulators. GATA3 directs
  T-cell and type 2 immune programs and contributes to epithelial and organ-development
  programs, including renal and auditory development. Heterozygous loss of function
  causes hypoparathyroidism, deafness and renal anomalies in HDR syndrome. The two
  documented human protein products differ by a single inserted glutamate.
core_functions:
- description: Recognizes GATA motifs in cis-regulatory DNA and recruits context-dependent
    cofactors to activate or repress RNA-polymerase-II target transcription, establishing
    lineage-specific gene-expression programs.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0045064
    label: T-helper 2 cell differentiation
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:2017177
    supporting_text: can activate transcription through a tissue-specific GATA-binding
      site
  - reference_id: PMID:17075044
  - reference_id: PMID:20484083
  - reference_id: PMID:19805038
- description: Binds GATA motifs exposed on nucleosomal DNA through its tandem zinc
    fingers; motif position and chromatin context influence whether binding is associated
    with productive enhancer opening. This is a directly measured chromatin-engagement
    capability, distinct from the downstream transcriptional output of the first core;
    binding alone does not establish productive opening or ATP-dependent remodeling.
  molecular_function:
    id: GO:0031491
    label: nucleosome binding
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:32811816
    supporting_text: specifically binds the 5′-GAT-3′ sequences within the model nucleosome
  - reference_id: PMID:38281186
alternative_products:
- id: P23771-1
  name: '1'
  description: The displayed 443-residue human product. Its exact sequence was independently
    matched to the official direct FASTA; the reviewed evidence does not establish
    a function exclusive to this product.
- id: P23771-2
  name: '2'
  sequence_note: VSP_001598 replaces canonical T259 with TE, producing 444 residues.
  description: The 444-residue alternative product has one extra glutamate at the
    verified variation site. The purified 261–371 fragment in PMID:32811816 is explicitly
    derived from this product, and the retained SELEX full-length construct matches
    it. Neither engineered fragment nor full-length construct testing establishes
    a natural functional difference from product 1.
proposed_new_terms: []
suggested_questions:
- question: Which cofactor combinations determine whether GATA3 activates or represses
    a target in immune, epithelial and renal cells?
- question: When does nucleosome-bound GATA3 promote accessible regulatory chromatin,
    and when do local motif geometry or CHD4-containing complexes restrain that outcome?
- question: Do the 443- and 444-residue human products differ in endogenous activity,
    localization or target selection under matched expression conditions?
- question: Which rat expression-based response annotations reflect causal GATA3 functions
    in the corresponding human tissues?
suggested_experiments:
- experiment_type: Matched natural-product rescue
  description: Compare both verified full-length human products at matched expression
    in the same GATA3-depleted cellular system, measuring target transcription, localization
    and chromatin occupancy.
  hypothesis: Any reproducible product difference will depend on cellular context
    rather than being inferred from an engineered fragment alone.
- experiment_type: Nucleosomal motif and cofactor perturbation
  description: Combine motif-position perturbation with GATA3 and CHD4 perturbations,
    measuring binding and accessibility separately at predefined target loci.
  hypothesis: Nucleosome engagement and productive opening are separable outcomes
    influenced by motif arrangement and cofactor activity.
