  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The traced kidney evidence places GATA3 downstream of beta-catenin in
      a developmental transcriptional cascade.
    reason: The mouse donor for this canonical-Wnt term cites PMID:19112489. Inspected
      original Results and Methods show that beta-catenin loss reduces Gata3 and Ret,
      whereas Gata3 loss leaves beta-catenin/phospho-beta-catenin and canonical Axin2,
      Daple and Sp5 readouts unchanged. Mouse Gata3 supports a human RET regulatory-fragment
      reporter in mouse collecting-duct cells. These data establish a downstream Gata3-to-Ret
      transcriptional relay, not GATA3 execution of the canonical signal-transduction
      steps ending in beta-catenin-dependent target transcription. The pathway assignment
      overstates the traced function; the developmental cascade remains supported.
      This is not a duplicate-term objection, a claim that Wnt biology is poorly known,
      or a claim that GATA3 never influences Wnt responses in other contexts. Preserve
      the actual orthology source identifiers.
