- term:
    id: GO:0034142
    label: toll-like receptor 4 signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:18222170
  qualifier: involved_in
  review:
    summary: TRAF3 acts in TLR4 signalling, where the split between its MyD88-dependent (degradative)
      and TRIF-dependent (activating) ubiquitination determines whether inflammatory cytokines or
      interferons are produced.
    action: ACCEPT
    reason: 'Directly supported: TRAF3 colocalises with the internalised TLR4/TRAM complex, and TLR4
      was the prototypical receptor used to dissect the TRAF3 ubiquitination switch.'
    supported_by:
    - reference_id: PMID:19898473
      supporting_text: Degradative ubiquitination of TRAF3 during MyD88-dependent TLR signaling was
        essential for the activation of mitogen-activated protein kinases (MAPKs) and production
        of inflammatory cytokines
- term:
    id: GO:0035666
    label: TRIF-dependent toll-like receptor signaling pathway
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9013973
  qualifier: involved_in
  review:
    summary: TRAF3 is the TRIF-proximal component that brings TBK1 into the TIR signalling complex,
      making it essential for the TRIF-dependent interferon branch.
    action: ACCEPT
    reason: 'Core process, mechanistically defined: TRAF3 is recruited to TRIF and is required for
      TBK1 recruitment, which is why TRAF3 loss selectively ablates the IFN arm.'
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: TRAF3 is also recruited to the adaptor TRIF (Toll/IL-1 receptor domain-containing
        adaptor-inducing IFN-beta) and is required for marshalling the protein kinase TBK1 (also
        called NAK) into TIR signalling complexes, thereby explaining its unique role in activation
        of the IFN response
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IC
  original_reference_id: PMID:16858409
  qualifier: is_active_in
  review:
    summary: TRAF3 is recruited to the mitochondrial outer-membrane platform organised by MAVS during
      RIG-I-like receptor signalling, and colocalises with TRIM35 at mitochondria.
    action: ACCEPT
    reason: MAVS is mitochondrial and binds TRAF3 through a defined TRAF-interacting motif, making
      the IC call sound; the EXP row from the TRIM35 study is a direct colocalisation. The mitochondrial
      pool is where TRAF3 acts in RIG-I-like receptor signalling.
    supported_by:
    - reference_id: PMID:16858409
      supporting_text: Cardif-mediated IFNalpha induction occurs through a direct interaction between
        the TRAF domain of TRAF3 and a TRAF-interaction motif (TIM) within Cardif
    - reference_id: file:human/TRAF3/TRAF3-notes.md
      supporting_text: 'Mitochondrial pool: via MAVS'
- term:
    id: GO:0032481
    label: positive regulation of type I interferon production
  evidence_type: IDA
  original_reference_id: PMID:19898473
  qualifier: involved_in
  review:
    summary: TRAF3 is a non-redundant positive regulator of type I interferon production downstream
      of TLR3/TLR4-TRIF, TLR7/9-MyD88 and RIG-I/MAVS.
    action: ACCEPT
    reason: Core function. TRAF3-deficient cells fail to induce type I IFN through several TLRs and
      on direct virus infection, and autosomal dominant human TRAF3 deficiency - a dominant-negative
      R118W allele that destabilises the wild-type product, leaving ~17.5% of control TRAF3 protein
      - causes herpes simplex encephalitis through impaired TLR3-dependent IFN induction. The activating
      signal is TRIF-driven K63 self-ubiquitination of TRAF3.
    supported_by:
    - reference_id: PMID:19898473
      supporting_text: TRIF-dependent signaling triggered noncanonical TRAF3 self-ubiquitination
        that activated the interferon response
    - reference_id: PMID:16306936
      supporting_text: cells lacking TRAF3, a member of the TNF receptor-associated factor family,
        are defective in type I IFN responses activated by several different TLRs
    - reference_id: PMID:20832341
      supporting_text: TRAF3 deficiency is associated with a clinical phenotype limited to HSE resulting
        from the impairment of TLR3-dependent induction of IFN
