    label: cytosol
  supported_by:
  - reference_id: PMID:15084608
    supporting_text: TRAF3 physically associates with NIK via a specific sequence motif located in
      the N-terminal region of NIK; this molecular interaction appears to target NIK for degradation
      by the proteasome
  - reference_id: PMID:18997794
    supporting_text: the degradation of NIK occurs upon assembly of a regulatory complex through
      TRAF3 recruitment of NIK and TRAF2 recruitment of cIAP1 and cIAP2
  - reference_id: PMID:20185819
    supporting_text: These effects of TRAF3 depletion did not require LTBR signaling and were consistent
      with autonomous activation of the non-canonical NFkappaB pathway
- description: Acts as the adaptor that couples the TLR adaptors TRIF and MyD88, and the mitochondrial
    RIG-I adaptor MAVS, to the IRF3/IRF7 kinases TBK1 and IKK-epsilon, making it non-redundantly
    required for type I interferon induction and antiviral defence.
  molecular_function:
