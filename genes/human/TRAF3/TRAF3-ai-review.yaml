core_functions:
- description: Constitutively restrains non-canonical NF-kappaB signalling by recruiting the kinase
    NIK/MAP3K14 into a TRAF2-cIAP1/2 ubiquitin ligase complex that keeps NIK continuously degraded
    by the proteasome, so that p100/NFKB2 is not processed to p52 until receptor engagement destroys
    TRAF3.
  molecular_function:
