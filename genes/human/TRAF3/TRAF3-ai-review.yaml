- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Zinc binding by the RING-type and TRAF-type zinc fingers.
    action: KEEP_AS_NON_CORE
    reason: Structurally correct - the RING and the several TRAF-type zinc fingers each coordinate
      zinc - but this is a cofactor-binding property required to fold the catalytic module, not a
      function TRAF3 evolved to perform. Retain as non-core.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: Generic 'membrane' localisation from an ARBA rule.
    action: REMOVE
    reason: TRAF3 has no transmembrane segment, signal peptide or lipid anchor; it is a soluble cytosolic
      protein transiently recruited to membrane-proximal complexes. That recruitment is already captured
      precisely by GO:0009898 (cytoplasmic side of plasma membrane) and GO:0010008 (endosome membrane),
      so the bare parent adds no information and implies membrane residence that is not the case.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
- term:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Binding to ubiquitin protein ligases, from an in vitro TRAF-domain survey (MUL/TRIM37)
      and family-level rules.
    action: KEEP_AS_NON_CORE
    reason: TRAF3 does associate with E3s in vivo (cIAP1/2 within the NIK-degrading complex, TRIM35,
