- term:
    id: GO:0002224
    label: toll-like receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: TRAF3 is a component of TLR signalling complexes, recruited via MyD88 and TRIF, and
      is required for their interferon output.
    action: ACCEPT
    reason: Core process. TRAF3 is recruited to TIR-adaptor signalling complexes and is directly
      observed in the internalised TLR4/TRAM endosomal complex.
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: we identified TNF receptor-associated factor 3 (TRAF3) as a new component
        of TIR signalling complexes that is recruited along with TRAF6
    - reference_id: PMID:18222170
      supporting_text: The internalized signaling complex consisting of TLR4 and TRAM colocalizes
        with TRAF3, a signaling molecule downstream of TRIF, in endosome/lysosome
- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: TRAF3 is recruited to the cytoplasmic tails of plasma-membrane TNF receptor superfamily
      members (CD40, LTBR, BAFF-R, CD30, OX40, EDAR), so it acts at the cytoplasmic face of the plasma
      membrane.
    action: ACCEPT
    reason: Supported by the founding CD40 cytoplasmic-domain two-hybrid work and by LTBR signalling-complex
      recruitment; the MATH/TRAF domain is the receptor-tail binding module.
    supported_by:
    - reference_id: PMID:7527023
      supporting_text: One such interacting protein, designated CD40-binding protein, has a N-terminal
        RING finger motif
    - reference_id: PMID:20185819
      supporting_text: Increased expression of TRAF3 correlated with its increased recruitment to
        LTBR-induced signaling complexes
- term:
    id: GO:0019901
    label: protein kinase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: TRAF3 binds the protein kinases TBK1, IKKe and MAP3K14/NIK.
    action: KEEP_AS_NON_CORE
    reason: True and mechanistically important - NIK binding underlies the non-canonical NF-kappaB
      brake and TBK1 binding underlies interferon induction - but the bare 'protein kinase binding'
      term conveys none of that. Retain as non-core; the functional content belongs in GO:0035591
      and the NIK-degradation process terms.
    supported_by:
    - reference_id: PMID:15084608
      supporting_text: TRAF3 physically associates with NIK via a specific sequence motif located
        in the N-terminal region of NIK
- term:
    id: GO:0030162
    label: regulation of proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: 'TRAF3 controls proteolysis of key NF-kappaB pathway components: it drives constitutive
      proteasomal degradation of NIK/MAP3K14 and thereby limits processing of NFKB2/p100 to p52.'
    action: ACCEPT
    reason: Core process, directly demonstrated - TRAF3 knockdown raises NIK protein and triggers
      p100 processing without any receptor stimulus. The term is general; the specific mechanism
      is proposed as new annotations (GO:0043161 and GO:1901223).
    supported_by:
    - reference_id: PMID:20185819
      supporting_text: TRAF3 knock-down also increased mRNA and protein expression of several non-canonical
        NFkappaB components, including NFkappaB2/p100, RelB, and NIK, accompanied by processing of
        NFkappaB2/p100 into p52
    - reference_id: PMID:15084608
      supporting_text: this molecular interaction appears to target NIK for degradation by the proteasome
- term:
    id: GO:0032648
    label: regulation of interferon-beta production
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Unsigned parent term for regulation of interferon-beta production.
    action: MODIFY
    reason: TRAF3 is required for IFN-beta induction downstream of TRIF and MAVS; the direction is
      established, so the signed child GO:0032728 is the appropriate term.
    proposed_replacement_terms:
    - id: GO:0032728
      label: positive regulation of interferon-beta production
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: TRAF3 is essential for the induction of type I interferons (IFN) and the anti-inflammatory
        cytokine interleukin-10 (IL-10)
- term:
    id: GO:0035631
    label: CD40 receptor complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  review:
    summary: TRAF3 was discovered as a CD40 cytoplasmic-tail binding protein and is a component of
      the ligand-engaged CD40 receptor complex.
    action: ACCEPT
    reason: Two independent yeast two-hybrid screens against the CD40 cytoplasmic domain identified
      TRAF3 (as CD40BP and as CAP-1), and CD40 ligation reorganises the TRAF2/TRAF3 content of the
      complex.
    supported_by:
    - reference_id: PMID:7530216
      supporting_text: cDNAs were obtained that encode a novel protein, CD40-associated protein-1
        (CAP-1), which binds specifically to the cytosolic domain of CD40
    - reference_id: PMID:15383523
      supporting_text: Ligation of CD40 on Ramos B cells by recombinant CD154 caused TRAF2 and TRAF3
        to dissociate
- term:
    id: GO:0035666
    label: TRIF-dependent toll-like receptor signaling pathway
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-936964
  qualifier: involved_in
  review:
    summary: TRAF3 is the TRIF-proximal component that brings TBK1 into the TIR signalling complex,
      making it essential for the TRIF-dependent interferon branch.
    action: ACCEPT
    reason: 'Core process, mechanistically defined: TRAF3 is recruited to TRIF and is required for
      TBK1 recruitment, which is why TRAF3 loss selectively ablates the IFN arm.'
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: TRAF3 is also recruited to the adaptor TRIF (Toll/IL-1 receptor domain-containing
        adaptor-inducing IFN-beta) and is required for marshalling the protein kinase TBK1 (also
        called NAK) into TIR signalling complexes, thereby explaining its unique role in activation
        of the IFN response
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:25847972
  qualifier: located_in
  review:
    summary: TRAF3 is a cytoplasmic signalling adaptor and E3 ligase; cytoplasmic localisation is
      directly observed and is where all of its characterised activities occur.
    action: ACCEPT
    reason: UniProt records Cytoplasm with experimental evidence from PubMed:25847972 and PubMed:34011520,
      and every characterised TRAF3 complex (TRAF2-cIAP-NIK, TRIF-TBK1, MAVS) is cytoplasmic. Correct,
      though the more informative sub-locations (cytosol, cytoplasmic face of the plasma membrane,
      endosome, mitochondrion) are separately annotated.
    supported_by:
    - reference_id: file:human/TRAF3/TRAF3-notes.md
      supporting_text: TRAF3 has no TM segment; it is a cytosolic protein transiently recruited to
        membrane-proximal complexes
