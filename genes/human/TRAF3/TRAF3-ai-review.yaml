    supported_by:
    - reference_id: PMID:17991829
      supporting_text: DUBA selectively cleaved the lysine-63-linked polyubiquitin chains on TRAF3,
        resulting in its dissociation from the downstream signaling complex containing TANK-binding
        kinase 1
