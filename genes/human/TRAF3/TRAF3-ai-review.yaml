- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Root-level 'signal transduction' from the InterPro TRAF-family domain rule.
    action: MODIFY
    reason: 'Uninformative at this level. Note this row has no anchoring publication: it is an InterPro2GO
      mapping from IPR012227, the pan-TRAF signature, which by itself supports only that a TRAF-domain
      protein transduces signals. The replacement is therefore proposed for the gene rather than
      derived from the rule - it is justified by the direct human evidence on the TAS row (PMID:7530216),
      and the generic term this row contributes is subsumed by the specific pathway terms already
      annotated. For the same reason the family-level GO:0007166 IBA is left broad: a domain or phylogenetic
      inference cannot itself pick out a vertebrate-specific receptor.'
    proposed_replacement_terms:
