  supported_by:
  - reference_id: PMID:16306937
    supporting_text: TRAF3 is also recruited to the adaptor TRIF (Toll/IL-1 receptor domain-containing
      adaptor-inducing IFN-beta) and is required for marshalling the protein kinase TBK1 (also called
      NAK) into TIR signalling complexes, thereby explaining its unique role in activation of the
