- term:
    id: GO:0030162
    label: regulation of proteolysis
  evidence_type: IMP
  original_reference_id: PMID:20185819
  qualifier: involved_in
  review:
    summary: 'TRAF3 controls proteolysis of key NF-kappaB pathway components: it drives constitutive
      proteasomal degradation of NIK/MAP3K14 and thereby limits processing of NFKB2/p100 to p52.'
    action: ACCEPT
    reason: Core process, directly demonstrated - TRAF3 knockdown raises NIK protein and triggers
      p100 processing without any receptor stimulus. The term is general; the specific mechanism
      is proposed as new annotations (GO:0043161 and GO:1901223).
    supported_by:
    - reference_id: PMID:20185819
      supporting_text: TRAF3 knock-down also increased mRNA and protein expression of several non-canonical
        NFkappaB components, including NFkappaB2/p100, RelB, and NIK, accompanied by processing of
        NFkappaB2/p100 into p52
    - reference_id: PMID:15084608
      supporting_text: this molecular interaction appears to target NIK for degradation by the proteasome
- term:
    id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:20185819
  qualifier: involved_in
  review:
    summary: Involvement in TNF-superfamily receptor signalling; the IMP evidence is from lymphotoxin-beta
      receptor rather than TNF/TNFR1.
    action: KEEP_AS_NON_CORE
    reason: TRAF3 does not bind TNFR1 and is not a component of the TNF/TNFR1 signalling complex;
      the supporting experiment concerns LTBR, and TRAF3 acts across several TNFRSF members (CD40,
      LTBR, BAFF-R, BCMA, CD30, OX40). The term is therefore only loosely correct, and this is not
      TRAF3's core process. Retained as non-core because no specific LTBR-signalling term is available
      in GO.
    supported_by:
    - reference_id: PMID:20185819
      supporting_text: we report that TRAF3 functions as a negative regulator of LTBR signaling via
        both canonical and non-canonical NFkappaB pathways by two distinct mechanisms
