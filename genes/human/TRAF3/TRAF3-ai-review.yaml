- term:
    id: GO:0043122
    label: regulation of canonical NF-kappaB signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: TRAF3 regulates canonical NF-kappaB signalling - negatively at LTBR, where it excludes
      TRAF2/IKK1 from the receptor complex, and indirectly in TLR pathways.
    action: ACCEPT
    reason: Directly demonstrated by TRAF3 knockdown, which restores LTBR-inducible canonical NF-kappaB
      signalling and target-gene expression. The measured effect on this branch is inhibitory, so
      GO:0043124 (negative regulation) is tempting; the unsigned parent is deliberately retained
      because it is not yet established whether TRAF3 represses canonical NF-kappaB directly, by
      excluding TRAF2/IKK1 from the receptor complex, or only as a downstream consequence of its
      effects on NIK and the cIAPs. Signing the term would assert a mechanism the evidence does not
      yet distinguish. This is recorded as an open question in the notes.
    supported_by:
    - reference_id: PMID:20185819
      supporting_text: siRNA-mediated depletion of TRAF3 promoted recruitment of TRAF2 and IKK1 to
        activated LTBR, enabling LTBR-inducible canonical NFkappaB signaling and NFkappaB target
        gene expression
- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Receptor-proximal signalling role inferred across the TRAF family: every member transduces
      from the cytoplasmic tail of a cell surface receptor.'
    action: ACCEPT
    reason: Broad, but phylogenetically honest and therefore the right level for this IBA. The WITH
      set spans Drosophila (FB:FBgn0265464), mouse and rat orthologs and the other human TRAFs (TRAF2,
      TRAF5, TRAF6), so what is conserved across the clade is cell-surface-receptor-proximal signalling
      in general - not any one receptor pathway. A vertebrate-specific replacement such as CD40 signalling
      would not be taxon-appropriate here; the CD40-specific call is instead made on the human-experimental
      GO:0007165 TAS row anchored to PMID:7530216, and TLR signalling on the already-annotated GO:0002224
      rows.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: TRAF3 is recruited to the cytoplasmic tails of plasma-membrane TNF receptor superfamily
      members (CD40, LTBR, BAFF-R, CD30, OX40, EDAR), so it acts at the cytoplasmic face of the plasma
      membrane.
    action: ACCEPT
    reason: Supported by the founding CD40 cytoplasmic-domain two-hybrid work and by LTBR signalling-complex
      recruitment; the MATH/TRAF domain is the receptor-tail binding module.
    supported_by:
    - reference_id: PMID:7527023
      supporting_text: One such interacting protein, designated CD40-binding protein, has a N-terminal
        RING finger motif
    - reference_id: PMID:20185819
      supporting_text: Increased expression of TRAF3 correlated with its increased recruitment to
        LTBR-induced signaling complexes
- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Signalling adaptor activity is TRAF3''s defining molecular function: its MATH/TRAF-C
      domain tethers receptor and adaptor tails while its N-terminus recruits downstream kinases.'
    action: ACCEPT
    reason: TRAF3 physically bridges TLR adaptors (TRIF, MyD88, IRAK1) and MAVS to the IRF kinases
      TBK1/IKKe, and bridges TNFRSF tails to the TRAF2-cIAP module. This is a core molecular function,
      correctly inferred at the family level by PANTHER.
    supported_by:
    - reference_id: PMID:16306936
      supporting_text: TRAF3 associates with the TLR adaptors TRIF and IRAK1, as well as downstream
        IRF3/7 kinases TBK1 and IKK-epsilon, suggesting that TRAF3 serves as a critical link between
        TLR adaptors and downstream regulatory kinases important for IRF activation
    - reference_id: PMID:16306937
      supporting_text: TRAF3 is also recruited to the adaptor TRIF (Toll/IL-1 receptor domain-containing
        adaptor-inducing IFN-beta) and is required for marshalling the protein kinase TBK1 (also
        called NAK) into TIR signalling complexes
