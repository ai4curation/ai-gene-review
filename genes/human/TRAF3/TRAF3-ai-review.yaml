- term:
    id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Involvement in TNF-superfamily receptor signalling; the IMP evidence is from lymphotoxin-beta
      receptor rather than TNF/TNFR1.
    action: KEEP_AS_NON_CORE
    reason: TRAF3 does not bind TNFR1 and is not a component of the TNF/TNFR1 signalling complex;
