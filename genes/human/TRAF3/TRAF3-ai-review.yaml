    supported_by:
    - reference_id: PMID:18222170
      supporting_text: The internalized signaling complex consisting of TLR4 and TRAM colocalizes
        with TRAF3, a signaling molecule downstream of TRIF, in endosome/lysosome
- term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  evidence_type: EXP
  original_reference_id: PMID:25847972
  qualifier: enables
  review:
    summary: TRAF3 is a RING-type E3 ubiquitin ligase (EC 2.3.2.27) that builds predominantly K63-linked
      chains, including on ASC and on itself.
    action: ACCEPT
    reason: Direct E3 activity toward ASC was demonstrated biochemically, and TRIF-driven TRAF3 self-ubiquitination
      is the activating mark for the interferon response. This is a core molecular function.
    supported_by:
    - reference_id: PMID:25847972
      supporting_text: TNFR-associated factor 3 was found to be a direct E3 ligase for ASC
    - reference_id: PMID:17991829
      supporting_text: TRAF3 is an E3 ubiquitin ligase that preferentially assembled lysine-63-linked
        polyubiquitin chains
- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: NAS
  original_reference_id: PMID:24622840
  qualifier: involved_in
  review:
    summary: TRAF3 is required for the antiviral defence programme, acting downstream of TLR3/TLR4-TRIF
      and of RIG-I/MAVS to induce type I interferon.
    action: ACCEPT
    reason: Core process. TRAF3-deficient fibroblasts fail to mount a type I IFN response to direct
      virus infection, and viral proteins (SARS-CoV PLpro, hantavirus Gn, EV-D68 2A protease) specifically
      target TRAF3 - the classic signature of an antiviral effector.
    supported_by:
    - reference_id: PMID:16306936
      supporting_text: TRAF3-deficient fibroblasts are defective in their type I IFN response to
        direct infection with vesicular stomatitis virus, indicating that TRAF3 is also an important
        component of TLR-independent viral recognition pathways
    - reference_id: PMID:24622840
      supporting_text: the interaction between the components in STING-TRAF3-TBK1 complex is disrupted
        by PLpro-TM
- term:
    id: GO:1902554
    label: serine/threonine protein kinase complex
  evidence_type: NAS
  original_reference_id: PMID:24622840
  qualifier: part_of
  review:
    summary: Assignment of TRAF3 to a serine/threonine protein kinase complex, from the STING-TRAF3-TBK1
      complex described in a SARS-CoV PLpro study.
    action: MARK_AS_OVER_ANNOTATED
    reason: TRAF3 is a transient adaptor recruited into signalling complexes that contain the kinase
      TBK1; it is not a stoichiometric subunit of a kinase complex and contributes no kinase activity.
      The underlying interaction is real, but the complex term over-states TRAF3's relationship to
      it, and the evidence is NAS.
    supported_by:
    - reference_id: PMID:24622840
      supporting_text: PLpro-TM physically interacts with TRAF3, TBK1, IKKε, STING, and IRF3, the
        key components that assemble the STING-TRAF3-TBK1 complex
