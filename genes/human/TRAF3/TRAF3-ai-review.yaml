    id: GO:0010008
    label: endosome membrane
  evidence_type: IDA
  original_reference_id: PMID:18222170
  qualifier: is_active_in
  review:
    summary: TRAF3 acts on the endosome membrane as part of the internalised TLR4/TRAM/TRIF complex
