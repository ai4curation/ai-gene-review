proposed_new_terms:
- proposed_name: lymphotoxin beta receptor signaling pathway
  proposed_definition: The series of molecular signals initiated by the binding of a lymphotoxin
    alpha1/beta2 heterotrimer or LIGHT to the lymphotoxin beta receptor (LTBR) on the surface of
    a cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
  justification: 'GO has receptor-specific pathway terms for CD40 (GO:0023035) and for several other
    TNF receptor superfamily members, but none for LTBR. A substantial body of TRAF3 (and TRAF2,
    NIK, RELB) experimental work is anchored to LTBR specifically, and curators are currently forced
    to use GO:0033209 (tumor necrosis factor-mediated signaling pathway), whose definition requires
    TNF itself binding its receptor. That is a taxonomically and mechanistically inaccurate fit:
    TRAF3 does not bind TNFR1 and the LTBR pathway engages the non-canonical NF-kappaB branch that
    TNF/TNFR1 does not. Checked against OLS: GO currently has lymphotoxin terms only for the ligand
    and its production (GO:0032641, GO:0032681, GO:0062048), none for LTBR-initiated signalling.
    GO:0007166 is proposed as the parent because that is also the parent of GO:0023035, so the new
    term would sit as a sibling of the CD40 pathway term rather than beneath it.'
  proposed_parent:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  supported_by:
  - reference_id: PMID:20185819
    supporting_text: we report that TRAF3 functions as a negative regulator of LTBR signaling via
      both canonical and non-canonical NFkappaB pathways by two distinct mechanisms
  - reference_id: PMID:10799510
    supporting_text: LTbetaR, not HveA, recruits TNF receptor-associated factor-3 (TRAF3), and LIGHT-induced
      death is blocked by a dominant negative TRAF3 mutant
suggested_questions:
- question: Is TRAF3's suppression of canonical NF-kappaB and MAPK signalling a direct adaptor activity
    - competitive exclusion of TRAF2/IKK1 from the receptor complex - or is it entirely downstream
    of the NIK and cIAP effects? The answer determines whether a separate 'negative regulation of
    canonical NF-kappaB signal transduction' annotation is warranted alongside GO:1901223.
  experts:
  - Michael Karin
  - Genhong Cheng
  - Shao-Cong Sun
- question: Beyond ASC, which proteins are direct TRAF3 ubiquitination substrates? Almost all published
    'TRAF3 ubiquitination' work concerns TRAF3 as the substrate of other ligases, leaving TRAF3's
    own substrate repertoire - and therefore the scope of its GO:0061630 annotation - largely undefined.
  experts:
  - Vishva M. Dixit
  - Michael Karin
- question: Does isoform 2 (Q13114-2) have any distinct function, tissue distribution or dominant-negative
    behaviour? No functional data were found for it, so all current annotations implicitly refer
    to the canonical isoform.
  experts: []
- question: How should the K33-linked ubiquitination/exocyst route (PMID:27438768) be represented?
    It is a genuine TRAF3-dependent process but was demonstrated in a single cell type; is a 'bacterial
    expulsion' or exocyst-recruitment annotation justified, and does TRAF3 act there as adaptor rather
    than ligase?
  experts:
  - Soman N. Abraham
  - Yuxuan Miao
suggested_experiments:
- hypothesis: TRAF3 restrains canonical NF-kappaB at LTBR by directly competing with TRAF2 for the
    receptor tail, independently of its effect on NIK levels.
  description: In NIK-null (MAP3K14 knockout) cells, reconstitute with wild-type TRAF3 or with a
    receptor-binding-deficient MATH-domain mutant, then stimulate LTBR and measure IkappaB-alpha/RelA
    phosphorylation and the TRAF2/IKK1 content of the receptor-associated complex by immunoprecipitation.
    If TRAF3 still suppresses canonical signalling on a NIK-null background, the adaptor mechanism
    is direct.
  experiment_type: Genetic complementation with structure-guided separation-of-function mutants,
    plus receptor-complex immunoprecipitation
- hypothesis: TRAF3 has direct ubiquitination substrates beyond ASC that account for its signalling
    output.
  description: Perform ubiquitin-remnant (diGly) proteomics in TRAF3-knockout versus reconstituted
    cells, with and without RING-mutant TRAF3, after TLR3/TLR4 and Sendai virus stimulation. Validate
    candidates by in vitro reconstitution with recombinant TRAF3, E1, UBE2N/UBE2V1 and ubiquitin
    chain-linkage mutants (K63R, K48R) to confirm both directness and chain type.
  experiment_type: Quantitative diGly ubiquitinome mass spectrometry with in vitro ubiquitination
    reconstitution
- hypothesis: The mitochondrial TRAF3 pool is functionally required for RLR-driven interferon induction
    rather than being a passive consequence of MAVS binding.
  description: Reconstitute TRAF3-null cells with TRAF3 fused to a mitochondrial outer-membrane anchor,
    to a plasma-membrane anchor, or untargeted, and compare IFN-beta induction after Sendai virus
    infection versus poly(I:C) endosomal stimulation. Pair with proximity labelling (TurboID) from
    mitochondrial TRAF3 to define the compartment-specific interactome. This would also settle whether
    the disputed GO:0005739 IDA row reflects a real, reproducible localisation.
  experiment_type: Compartment-restricted rescue with proximity-dependent biotinylation proteomics
