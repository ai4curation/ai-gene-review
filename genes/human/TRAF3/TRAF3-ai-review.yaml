- term:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  evidence_type: IPI
  original_reference_id: PMID:11279055
  qualifier: enables
  review:
    summary: Binding to ubiquitin protein ligases, from an in vitro TRAF-domain survey (MUL/TRIM37)
      and family-level rules.
    action: KEEP_AS_NON_CORE
    reason: TRAF3 does associate with E3s in vivo (cIAP1/2 within the NIK-degrading complex, TRIM35,
      NEDD4L, FBXO11), so the term is not wrong. However the IPI evidence comes from isolated TRAF
      domains binding all six TRAFs indiscriminately in vitro, and the term describes a partner class
      rather than a TRAF3 activity. Retain as non-core.
    supported_by:
    - reference_id: PMID:11279055
      supporting_text: MUL and USP7 are capable of binding in vitro via their TDs to all of the previously
        identified TRAF family proteins (TRAF1, TRAF2, TRAF3, TRAF4, TRAF5, and TRAF6)
- term:
    id: GO:0031996
    label: thioesterase binding
  evidence_type: IPI
  original_reference_id: PMID:11279055
  qualifier: enables
  review:
    summary: Binding to thioesterases, i.e. to ubiquitin thioesterases/deubiquitinases.
    action: KEEP_AS_NON_CORE
    reason: TRAF3 is a well-documented substrate of the deubiquitinases OTUB1, OTUB2, OTUD5/DUBA
      and MYSM1, so binding ubiquitin thioesterases is real. As with the other partner-class binding
      terms, it describes what acts on TRAF3 rather than what TRAF3 does. Retain as non-core.
    supported_by:
    - reference_id: PMID:17991829
      supporting_text: DUBA selectively cleaved the lysine-63-linked polyubiquitin chains on TRAF3,
        resulting in its dissociation from the downstream signaling complex containing TANK-binding
        kinase 1
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19419966
  qualifier: enables
  review:
    summary: Uninformative generic protein binding annotation from an interaction dataset.
    action: REMOVE
    reason: GO:0005515 conveys nothing about TRAF3's molecular function. TRAF3 is a well-characterised
      adaptor whose informative interactions are already captured by GO:0005164 (TNF receptor binding),
      GO:0035591 (signalling adaptor activity), GO:0019901 (protein kinase binding), GO:0019903 (protein
      phosphatase binding) and GO:0042802 (homotrimerisation). Per project curation guidance the
      bare term should be replaced by informative molecular function terms.
- term:
    id: GO:0035631
    label: CD40 receptor complex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  review:
    summary: TRAF3 was discovered as a CD40 cytoplasmic-tail binding protein and is a component of
      the ligand-engaged CD40 receptor complex.
    action: ACCEPT
    reason: Two independent yeast two-hybrid screens against the CD40 cytoplasmic domain identified
      TRAF3 (as CD40BP and as CAP-1), and CD40 ligation reorganises the TRAF2/TRAF3 content of the
      complex.
    supported_by:
    - reference_id: PMID:7530216
      supporting_text: cDNAs were obtained that encode a novel protein, CD40-associated protein-1
        (CAP-1), which binds specifically to the cytosolic domain of CD40
    - reference_id: PMID:15383523
      supporting_text: Ligation of CD40 on Ramos B cells by recombinant CD154 caused TRAF2 and TRAF3
        to dissociate
- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: TRAF3 is recruited to the cytoplasmic tails of plasma-membrane TNF receptor superfamily
      members (CD40, LTBR, BAFF-R, CD30, OX40, EDAR), so it acts at the cytoplasmic face of the plasma
      membrane.
    action: ACCEPT
    reason: Supported by the founding CD40 cytoplasmic-domain two-hybrid work and by LTBR signalling-complex
      recruitment; the MATH/TRAF domain is the receptor-tail binding module.
    supported_by:
    - reference_id: PMID:7527023
      supporting_text: One such interacting protein, designated CD40-binding protein, has a N-terminal
        RING finger motif
    - reference_id: PMID:20185819
      supporting_text: Increased expression of TRAF3 correlated with its increased recruitment to
        LTBR-induced signaling complexes
- term:
    id: GO:0001817
    label: regulation of cytokine production
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: Regulation of cytokine production - TRAF3 controls the balance between type I interferons,
      IL-10 and pro-inflammatory cytokines.
    action: KEEP_AS_NON_CORE
    reason: 'Correct: TRAF3 is required for IFN and IL-10 induction while restraining pro-inflammatory
      cytokines. However the term is a broad parent and the informative, signed children (GO:0032481,
      GO:0032728) are annotated separately. Retain as non-core.'
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: TRAF3-deficient cells overproduce pro-inflammatory cytokines owing to defective
        IL-10 production
- term:
    id: GO:0002224
    label: toll-like receptor signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: TRAF3 is a component of TLR signalling complexes, recruited via MyD88 and TRIF, and
      is required for their interferon output.
    action: ACCEPT
    reason: Core process. TRAF3 is recruited to TIR-adaptor signalling complexes and is directly
      observed in the internalised TLR4/TRAM endosomal complex.
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: we identified TNF receptor-associated factor 3 (TRAF3) as a new component
        of TIR signalling complexes that is recruited along with TRAF6
    - reference_id: PMID:18222170
      supporting_text: The internalized signaling complex consisting of TLR4 and TRAM colocalizes
        with TRAF3, a signaling molecule downstream of TRIF, in endosome/lysosome
- term:
    id: GO:0032648
    label: regulation of interferon-beta production
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: Unsigned parent term for regulation of interferon-beta production.
    action: MODIFY
    reason: TRAF3 is required for IFN-beta induction downstream of TRIF and MAVS; the direction is
      established, so the signed child GO:0032728 is the appropriate term.
    proposed_replacement_terms:
    - id: GO:0032728
      label: positive regulation of interferon-beta production
    supported_by:
    - reference_id: PMID:16306937
      supporting_text: TRAF3 is essential for the induction of type I interferons (IFN) and the anti-inflammatory
        cytokine interleukin-10 (IL-10)
- term:
    id: GO:0050688
    label: regulation of defense response to virus
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: Unsigned 'regulation of defense response to virus'.
    action: MODIFY
    reason: TRAF3's contribution to antiviral defence is positive and well established, so the signed
      child GO:0002230 should be used rather than the unsigned parent.
    proposed_replacement_terms:
    - id: GO:0002230
      label: positive regulation of defense response to virus by host
    supported_by:
    - reference_id: PMID:16306936
      supporting_text: Our data demonstrate that TRAF3 is a major regulator of type I IFN production
        and the innate antiviral response
