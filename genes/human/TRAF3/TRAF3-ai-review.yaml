  evidence_type: IPI
  original_reference_id: PMID:12270937
  qualifier: enables
  review:
    summary: Uninformative generic protein binding annotation from an interaction dataset.
    action: REMOVE
    reason: GO:0005515 conveys nothing about TRAF3's molecular function. TRAF3 is a well-characterised
      adaptor whose informative interactions are already captured by GO:0005164 (TNF receptor binding),
      GO:0035591 (signalling adaptor activity), GO:0019901 (protein kinase binding), GO:0019903 (protein
      phosphatase binding) and GO:0042802 (homotrimerisation). Per project curation guidance the
      bare term should be replaced by informative molecular function terms.
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: TAS
  original_reference_id: PMID:10799510
  qualifier: involved_in
  review:
    summary: Direct involvement in the apoptotic process, from a study of LIGHT/LTBR-induced death.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is that overexpressed dominant-negative TRAF3 blocks LIGHT-induced killing
      - an indirect, upstream signalling effect. TRAF3 is not part of the apoptotic execution machinery
      and has no caspase-pathway activity; annotating it to the apoptotic process itself over-states
      the relationship. The regulatory term GO:0042981 covers what is actually supported.
    supported_by:
    - reference_id: PMID:10799510
      supporting_text: LTbetaR, not HveA, recruits TNF receptor-associated factor-3 (TRAF3), and
        LIGHT-induced death is blocked by a dominant negative TRAF3 mutant
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: TAS
  original_reference_id: PMID:7530216
  qualifier: involved_in
  review:
    summary: Root-level 'signal transduction', from an InterPro rule and from the original CD40-binding
      paper.
    action: MODIFY
    reason: Uninformative at this level. The anchoring publication is the discovery of TRAF3 as a
      CD40 cytoplasmic-tail binding protein, so GO:0023035 (CD40 signaling pathway) is the specific
      term that this evidence actually supports.
    proposed_replacement_terms:
    - id: GO:0023035
      label: CD40 signaling pathway
    supported_by:
    - reference_id: PMID:7530216
      supporting_text: CD40 is a member of the tumor necrosis factor receptor (TNF-R) family that
        regulates B-lymphocyte proliferation, immunoglobulin class-switching, and apoptosis
- term:
    id: GO:1901223
    label: negative regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IMP
  original_reference_id: PMID:20185819
  qualifier: involved_in
  review:
    summary: 'TRAF3 is the constitutive brake on the non-canonical NF-kappaB pathway: by recruiting
      NIK/MAP3K14 into a TRAF2-cIAP1/2 complex it keeps NIK levels low and p100 unprocessed until
      receptor engagement destroys TRAF3.'
    action: NEW
    reason: This is TRAF3's best-established and most distinctive function and it is entirely missing
      from the current GOA set, which represents it only as the vague GO:0030162 (regulation of proteolysis).
      It is supported by direct biochemistry, by loss-of-function in cells, by mouse genetics (TRAF3-null
      lethality is rescued by deleting one Nik allele) and by recurrent TRAF3 inactivation in multiple
      myeloma.
    additional_reference_ids:
    - PMID:18997794
    - PMID:15084608
    - PMID:17692805
    supported_by:
    - reference_id: PMID:18997794
      supporting_text: the degradation of NIK occurs upon assembly of a regulatory complex through
        TRAF3 recruitment of NIK and TRAF2 recruitment of cIAP1 and cIAP2
    - reference_id: PMID:20185819
      supporting_text: These effects of TRAF3 depletion did not require LTBR signaling and were consistent
        with autonomous activation of the non-canonical NFkappaB pathway
    - reference_id: PMID:15084608
      supporting_text: Interestingly, induction of noncanonical NF-kappaB signaling by extracellular
        signals involves degradation of TRAF3 and the concomitant enhancement of NIK expression
- term:
    id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:15084608
  qualifier: involved_in
  review:
    summary: TRAF3 targets NIK/MAP3K14 for ubiquitin-dependent proteasomal degradation, the mechanism
      by which it restrains non-canonical NF-kappaB signalling.
    action: NEW
    reason: 'The mechanism underlying the proposed GO:1901223 annotation and the specific form of
      the existing GO:0030162 (regulation of proteolysis) IMP. Directly demonstrated: TRAF3 binds
      a defined motif in the NIK N-terminus and this association targets NIK to the proteasome.'
    additional_reference_ids:
    - PMID:18997794
    supported_by:
    - reference_id: PMID:15084608
      supporting_text: TRAF3 physically associates with NIK via a specific sequence motif located
        in the N-terminal region of NIK; this molecular interaction appears to target NIK for degradation
        by the proteasome
    - reference_id: PMID:18997794
      supporting_text: cIAP1 and cIAP2 seem to play redundant roles in the degradation of NIK
- term:
    id: GO:0070534
    label: protein K63-linked ubiquitination
  evidence_type: IDA
  original_reference_id: PMID:25847972
  qualifier: involved_in
  review:
    summary: As a RING E3, TRAF3 assembles K63-linked polyubiquitin chains - on ASC to license inflammasome
      speck formation, and on itself downstream of TRIF to activate the interferon response.
    action: NEW
    reason: 'The existing GO:0061630 annotation records that TRAF3 is an E3 but not which chain type
      it builds, which is the functionally decisive detail: K63 chains are the signalling output,
      whereas the K48 chains on TRAF3 are placed by other ligases (cIAP1/2, Triad3A). Directly supported
      by biochemistry on ASC and by the TRIF-driven self-ubiquitination experiments.'
    additional_reference_ids:
    - PMID:17991829
    - PMID:19898473
    supported_by:
    - reference_id: PMID:25847972
      supporting_text: Ubiquitination of ASC at Lys(174) was critical for speck formation and inflammasome
        activation
    - reference_id: PMID:17991829
      supporting_text: TRAF3 is an E3 ubiquitin ligase that preferentially assembled lysine-63-linked
        polyubiquitin chains
    - reference_id: PMID:19898473
      supporting_text: TRIF-dependent signaling triggered noncanonical TRAF3 self-ubiquitination
        that activated the interferon response
