    reason: This term denotes 'The series of molecular signals initiated by type I interferon binding
      to its receptor on the surface of a target cell'. TRAF3 acts upstream, in interferon *production*,
      and has no described role in IFNAR/JAK-STAT signal transduction. The correct term, GO:0032481
      (positive regulation of type I interferon production), is already annotated. The evidence here
      is NAS and the anchoring paper is about MAVS-dependent inflammasome activation, not IFNAR signalling.
