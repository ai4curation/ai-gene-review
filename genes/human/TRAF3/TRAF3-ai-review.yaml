  - reference_id: PMID:16306936
    supporting_text: TRAF3 associates with the TLR adaptors TRIF and IRAK1, as well as downstream
      IRF3/7 kinases TBK1 and IKK-epsilon, suggesting that TRAF3 serves as a critical link between
      TLR adaptors and downstream regulatory kinases important for IRF activation
  - reference_id: PMID:16858409
    supporting_text: Cardif-mediated IFNalpha induction occurs through a direct interaction between
