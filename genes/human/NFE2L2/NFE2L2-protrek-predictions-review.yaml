    summary: >-
      Top-ranked hit (score 17.77). Cellular response to anisomycin is a ribosome-stress experimental
      treatment term associated with the integrated stress response and p38/JNK activation. NRF2 responds
      to electrophiles and oxidants through KEAP1 cysteine modification; anisomycin is not among its
      characterised inducers and the term is not annotated. Another experimental-reagent term outranking
      the biology, as with actinomycin D for MYC.
