  predicted_term_type: GO_CC
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 17.15). ATF1 and ATF4 are CREB/ATF-family bZIP factors; NRF2 is a CNC-subfamily
      bZIP that heterodimerises with small MAF proteins (MAFG, MAFK, MAFF) to bind AREs. Both are
      bZIPs and neither dimerises with the other. The correct complex partner is the single most important
      fact about NRF2's DNA binding, and the model names a different family's complex.
    supported_by:
