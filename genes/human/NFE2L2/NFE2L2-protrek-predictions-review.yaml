description: >-
  ProTrek sequence-to-text retrieval for NRF2. The model finds the stress-response framing - rank
  2 is oxidative-stress-responsive transcriptional activation and rank 4 is the integrated stress
  response, an exact GOA match - but never names the antioxidant response element, the small MAF partners,
  or the DNA-binding transcription factor activity that is this review's core function. Rank 3 places
  NRF2 in an ATF1-ATF4 complex, which is the wrong bZIP subfamily. The free-text channel is exactly
  right at 20.67, naming ARE binding directly. Assessment: 1 uncertain (UNC), 1 paralog incorrect
  (PLI), 1 nonparalog incorrect (NPI).
