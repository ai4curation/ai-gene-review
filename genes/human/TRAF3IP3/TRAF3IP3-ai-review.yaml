  - UniProtKB:Q9Y228
  review:
    summary: TRAF3IP3 participates in cytoplasmic RIG-I/MAVS pattern-recognition signaling.
    action: ACCEPT
    reason: The MAVS paper places TRAF3IP3 downstream of cytosolic viral RNA sensing by RIG-I and
      MAVS and shows that it bridges MAVS to TRAF3 for TBK1-IRF3 activation. The PAINT row transfers
      the same human-supported MAVS adaptor role.
    supported_by:
    - &id003
      reference_id: PMID:31390091
      supporting_text: In response to virus infection, TRAF3IP3 is accumulated on mitochondria and
        thereby facilitates the recruitment of TRAF3 to MAVS for TBK1-IRF3 activation.
    - &id004
      reference_id: PMID:31390091
      supporting_text: TRAF3IP3 is an important regulator for RIG-I-MAVS signaling, which bridges
        MAVS and TRAF3 for an effective antiviral innate immune response.
