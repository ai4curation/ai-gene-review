  title: TRAF3IP3 mediates the recruitment of TRAF3 to MAVS for antiviral innate immunity.
  findings:
  - statement: TRAF3IP3 positively regulates RIG-I-MAVS signaling by bridging MAVS and TRAF3.
    supporting_text: TRAF3IP3 is an important regulator for RIG-I-MAVS signaling, which bridges
      MAVS and TRAF3 for an effective antiviral innate immune response.
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: DISPUTED
      review_notes: PMID:32366851 reports an opposing negative role in myeloid cells through
        TRAF3IP3-dependent K48-linked TBK1 ubiquitination, so TRAF3IP3's sign in IFN-I signaling is
        context-specific rather than uniformly positive.
      superseded_by:
      - PMID:32366851
      supported_by:
      - reference_id: PMID:32366851
        supporting_text: The mechanism of action is through the interaction of TRAF3IP3 with
          endogenous TRAF3 and TBK1. This leads to the degradative K48 ubiquitination of TBK1 via
          its K372 residue in a DTX4-dependent fashion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary MAVS study for the 65bc GO-CAM: identifies TRAF3IP3 as a MAVS-to-TRAF3 adaptor
      on mitochondria for TBK1-IRF3/type I IFN activation.'
