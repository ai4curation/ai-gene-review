id: Q9Y228
gene_symbol: TRAF3IP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TRAF3IP3/T3JAM is a single-pass membrane adaptor that organizes immune signaling at several
  organelle membranes. It recruits MEK to the Golgi to facilitate BRAF-MEK-ERK signaling during thymocyte
  development, helps move TLR4 to lipid rafts in macrophage inflammatory signaling, recruits PPP2CA to
  lysosomes in regulatory T cells, and participates in RNA-virus signaling at the mitochondrial MAVS platform
  by bridging MAVS to TRAF3 for TBK1-IRF3 activation while also being able to dampen TBK1 through K48-linked
  ubiquitination in myeloid cells.'
alternative_products:
