  id: Q9Y228-1
- name: '2'
  id: Q9Y228-2
  sequence_note: VSP_017271
- name: '3'
  id: Q9Y228-3
  sequence_note: VSP_017272, VSP_017273
existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: EXP
  original_reference_id: PMID:26195727
  qualifier: located_in
  review:
    summary: TRAF3IP3 functions from Golgi membranes.
    action: ACCEPT
    reason: The Golgi membrane location is supported by the MEK/BRAF thymocyte-signaling study and 
      by UniProt SubCell mapping of the same curated Golgi membrane statement. This Golgi pool is 
      outside the 65bc MAVS GO-CAM, which correctly uses the mitochondrial outer membrane for the 
      antiviral activity.
    supported_by:
    - &id001
      reference_id: PMID:26195727
      supporting_text: TRAF3IP3 exerts this signaling function through recruiting MEK to the Golgi 
        and, thereby, facilitating the interaction of MEK with its activator BRAF.
