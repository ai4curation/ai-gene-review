suggested_questions:
- question: Should TRAF3IP3 have separate positive and negative innate-immune GO-CAMs for the 
    MAVS-TRAF3 bridging mechanism and the later TBK1 K48-ubiquitination dampening mechanism?
- question: Which TRAF3IP3 adaptor partners are direct in human cells at Golgi, lysosome, 
    plasma-membrane lipid rafts and mitochondria, and which mouse T-cell roles should be transferred
    to human GOA only by orthology?
- question: Does the ER membrane pool detected in the MAVS localization study represent a stable 
    TRAF3IP3 signaling site or newly synthesized/transit TRAF3IP3 before sorting to Golgi, lysosome,
    plasma membrane and mitochondria?
suggested_experiments:
- description: Endogenous split-ligase or proximity-labeling assays for TRAF3IP3 with MAVS, TRAF3, 
    TBK1, MAP2K1, PPP2CA and TLR4 after compartment-specific stimulation, paired with deletion of 
    the C-terminal transmembrane region to test localization-dependent adaptor activity.
- description: Side-by-side rescue of TRAF3IP3-null human macrophage or HEK293 RIG-I/MAVS reporter 
    cells with mutants that separate MAVS binding, TRAF3 binding and TBK1 binding, measuring IFNB1 
    induction and TBK1 K48 ubiquitination over a virus-infection time course.
