id: P60410
gene_symbol: KRTAP10-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 10-8 (KAP10.8; formerly KAP18-8) is a 259-residue high-sulfur keratin-associated protein of the KAP10 family, encoded within introns of TSPEAR in the chromosome 21q22.3 KAP gene domain. It consists largely of cysteine-rich repeats. KRTAP10 transcripts are restricted to the hair root and are expressed in a narrow region of the middle portion of the hair fibre cuticle, about 20 cell layers above the dermal papilla. The protein is a component of the cysteine-rich matrix that is disulfide cross-linked with keratins in the hardened hair cuticle.
existing_annotations:
