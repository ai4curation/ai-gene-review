core_functions:
- description: 'KRTAP10-8 is a high-sulfur (HS) KAP10 family keratin-associated protein that acts as a structural matrix component of the hair fibre: it is deposited between trichocyte keratin intermediate filaments in the keratinizing zone and becomes cross-linked to them, mainly through disulfide bonds (HS/UHS KAPs) or additional non-covalent interactions (HGT KAPs), giving the hair shaft its rigidity and resistance.'
  molecular_function: *id002
  directly_involved_in:
  - *id003
  locations:
  - id: GO:0045095
    label: keratin filament
  anatomical_locations:
  - id: UBERON:0002076
    label: cuticle of hair
  supported_by:
  - *id001
  - reference_id: PMID:18721477
    supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
  - reference_id: PMID:14962103
    supporting_text: revealed mRNA expression of nearly all KAP10 and KAP12 members exclusively in a narrow region of the middle portion of the hair fiber cuticle.
suggested_questions:
- question: Are KAP10 proteins incorporated into the exocuticle, endocuticle or A-layer, and do they cross-link to the cuticle keratins K32/K35/K85?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP10.8 is a cuticle matrix protein.
  description: Immunoelectron microscopy of human hair cuticle with a KAP10.8-specific antibody and proteomics of isolated cuticle layers.
  experiment_type: immunolocalization
