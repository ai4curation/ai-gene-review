- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:98715
  - PANTHER:PTN002891187
  - ZFIN:ZDB-GENE-030131-574
  review:
    summary: Involved in kidney development (IBA).
    action: KEEP_AS_NON_CORE
    reason: >-
      Tg737/Ift88 mutant mice develop polycystic kidney disease with short renal cilia, so IFT88 is required
      for normal kidney development; this is a downstream, pleiotropic consequence of its role in cilium
      assembly rather than a core activity.
    supported_by:
    - &id007
      reference_id: PMID:11062270
      supporting_text: We show that the primary cilia in the kidney of Tg737 mutant mice are shorter than
        normal.
