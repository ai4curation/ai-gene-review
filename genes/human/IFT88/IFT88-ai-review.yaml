    summary: Part of IFT-A (IDA) from the IFT-B architecture paper. IFT88 is a canonical IFT-B core subunit, and this paper mapped the IFT-B complex; IFT88 is not an IFT-A subunit (IFT-A = IFT144/WDR19, IFT140, IFT139/TTC21B, IFT122, IFT121/WDR35, IFT43).
