id: Q13099
gene_symbol: IFT88
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IFT88 (intraflagellar transport 88; mouse Tg737/polaris; C. elegans OSM-5) is a large tetratricopeptide-repeat (TPR) scaffold protein and a core subunit of the IFT-B1 (core) subcomplex of intraflagellar transport complex B, where it forms part of the IFT88/IFT70/IFT52/IFT46 module. IFT-B polymerises into anterograde IFT trains that are moved from the ciliary base to the tip by heterotrimeric kinesin-2 (KIF3A/KIF3B/KAP3), carrying axonemal and membrane cargo; at the tip trains are remodelled and returned by cytoplasmic dynein-2 with IFT-A. IFT88 accumulates at the basal body/ciliary base (where pre-docked IFT-B is released into the cilium by the CEP19-RABL2 module), along the axoneme and at the ciliary tip, and is required for assembly and maintenance of both primary and motile cilia and flagella. Loss of IFT88 abolishes flagella in Chlamydomonas and causes short or absent primary cilia, polycystic kidney disease, defective Hedgehog signalling and left-right patterning defects in mice; additional mouse studies implicate IFT88 in sperm manchette/flagellum formation and in cilium-dependent autophagy.
