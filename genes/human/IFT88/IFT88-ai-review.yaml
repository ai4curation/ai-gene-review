    label: centrosome
  evidence_type: IDA
  original_reference_id: PMID:27767179
  qualifier: located_in
  review:
    summary: >-
      Located in centrosome (IDA). IFT88 colocalizes with ENTR1/SDCCAG3 and pericentrin at the centrosome.
    action: KEEP_AS_NON_CORE
    reason: >-
      Centrosomal IFT88 is well documented (including a mitotic spindle-pole pool), but the ciliary basal
      body is the site relevant to its IFT function; retained as a correct, non-core location.
    supported_by:
    - reference_id: PMID:27767179
      supporting_text: >-
        Previously, we have described a centrosomal localization of SDCCAG3 in HCT116 cells and IFT88
        has been described to localize at centrosomes before2333.
    - reference_id: PMID:25564561
      supporting_text: >-
