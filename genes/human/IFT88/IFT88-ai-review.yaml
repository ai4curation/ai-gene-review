core_functions:
- description: IFT88 is a TPR-repeat scaffold subunit of the IFT-B1 core subcomplex. As part of IFT-B trains, it contributes to the cargo-carrying activity of anterograde IFT, moving axonemal and membrane cargo from the ciliary base to the tip under kinesin-2, and is required for assembly and maintenance of primary and motile cilia.
  contributes_to_molecular_function:
    id: GO:0140597
    label: protein carrier chaperone
  directly_involved_in:
  - id: GO:0035720
    label: intraciliary anterograde transport
  - id: GO:0060271
    label: cilium assembly
  in_complex:
    id: GO:0030992
    label: intraciliary transport particle B
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0005929
    label: cilium
  - id: GO:0097542
    label: ciliary tip
  supported_by:
  - reference_id: PMID:11062270
    supporting_text: Complex B is composed of IFT88 and 10 other proteins including IFT172, IFT81, and IFT57
  - reference_id: PMID:11062270
    supporting_text: This indicates that IFT is important for primary cilia assembly in mammals.
  - reference_id: PMID:28625565
    supporting_text: SIM revealed that IFT88 almost perfectly colocalized with RABL2B at the ciliary base
proposed_new_terms: []
suggested_questions:
- question: Which IFT-B subunit(s) physically contact the KIF3A/KIF3B/KAP3 kinesin-2 motor in human cells, and is the IBA "kinesin binding" for IFT88 a direct contact or a complex-level property?
- question: What specific cargoes (e.g. LRRC56-associated dynein arm components, polycystin-2) does the IFT88 TPR superhelix bind directly?
suggested_experiments:
- description: Cryo-ET of human anterograde IFT trains combined with crosslinking-MS to map the IFT88 TPR surface that contacts neighbouring IFT-B subunits, kinesin-2 and cargo.
- description: Separation-of-function point mutants in IFT88 TPR repeats (preserving IFT-B assembly) to test whether IFT88 binds specific cargo such as LRRC56 or ATG16L1 directly.
