id: Q13099
gene_symbol: IFT88
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  IFT88 (Tg737/polaris) is a ~94 kDa tetratricopeptide-repeat (TPR) protein and a core (IFT-B1) subunit
  of the intraflagellar transport B complex. IFT-B forms the backbone of the polymeric IFT trains that
  are carried from the ciliary base to the tip by heterotrimeric kinesin-2, delivering axonemal precursors
  and other cargo needed to build and maintain cilia; IFT-B then returns to the base on dynein-2-driven
  retrograde trains. Within IFT-B1, IFT88 forms a subcomplex with IFT70, IFT52 and IFT46. IFT88 concentrates
  at the ciliary base (basal body / transition fibres), moves along the axoneme and accumulates at the
  ciliary tip, and a pool is also found at the centrosome. Loss of IFT88 abolishes flagella in Chlamydomonas
  and causes short or absent primary cilia in mouse, with polycystic kidney disease, left-right and Hedgehog-signalling
  defects as downstream consequences.
