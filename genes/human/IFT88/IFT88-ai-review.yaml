core_functions:
- description: >-
    IFT88 is an integral IFT-B1 core subunit that forms part of the backbone of anterograde IFT trains;
    it is required for IFT-B train function and therefore for building primary and motile cilia. No cargo-binding
    or enzymatic activity specific to IFT88 is established, so no molecular-function term is asserted.
