suggested_questions:
- question: >-
    Does IFT88 make a direct contact with kinesin-2 (KIF3A/KIF3B/KAP3 or KIF17), or is the IBA 'kinesin
    binding' annotation explained by kinesin contacts on IFT-B2 subunits?
- question: >-
    Should the IFT-B cargo-adaptor role assigned to the whole complex in the primary cilium module be
    restricted to subunits with demonstrated cargo-binding sites (IFT81/IFT74, IFT46, IFT56), with IFT88
    described as a scaffold?
suggested_experiments:
- description: >-
    Cryo-ET of anterograde trains in IFT88-knockout cells rescued with TPR-surface mutants to map which
    IFT88 surfaces are required for train polymerization versus kinesin-2 docking.
