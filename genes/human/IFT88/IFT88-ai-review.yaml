- term:
    id: GO:1902017
    label: regulation of cilium assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00088688
  review:
    summary: Involved in regulation of cilium assembly (IEA, GO_REF:0000117).
    action: MODIFY
    reason: >-
      IFT88 is a structural subunit of the IFT-B complex that is required for cilium assembly (its loss
      abolishes flagella in Chlamydomonas and shortens kidney cilia in Tg737 mice), not a regulator that
      modulates ciliogenesis. 'Cilium assembly' captures the function without implying a regulatory role.
      (The cached abstract of PMID:17604723 concerns HEF1/Aurora A; the experimental finding that IFT88
      depletion impairs ciliation is not disputed.)
    proposed_replacement_terms:
    - id: GO:0060271
      label: cilium assembly
