  full_text_unavailable: true
- id: PMID:27693507
  title: Cell-Intrinsic Adaptation Arising from Chronic Ablation of a Key Rho GTPase Regulator.
  findings:
  - statement: Human cells with chronic DOCK6 loss can compensate for acute signaling defects through
      an ISG15/IQGAP1-associated response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract distinguishes human chronic DOCK6 loss from acute depletion, implicating
