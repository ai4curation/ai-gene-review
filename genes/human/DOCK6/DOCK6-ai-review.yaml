suggested_questions:
- question: Which endogenous regulatory inputs permit human DOCK6 to activate Rac1 or CDC42, and explain
    the difference between earlier positive studies and the negative 2020 biosensor screen?
- question: Does native DOCK6 contact LRCH4 directly, and which interface controls its redistribution
    without assigning the DOCK7 DHR2 result to DOCK6?
- question: Which cell and construct context supports the curated perinuclear DOCK6 pool, and is that
    enrichment distinct from its diffuse cytosolic pool?
suggested_experiments:
- hypothesis: Defined regulatory conditions reconcile DOCK6 exchange activity with the negative human-cell
    biosensor screen.
  description: Compare sequence-verified full-length human DOCK6 and its DHR2 region using matched purified
    exchange assays and cellular Rac1/CDC42 biosensors. Vary phosphorylation state and LRCH coexpression,
    with expression-matched inactive controls and separate localization readouts.
  experiment_type: Matched biochemical and cellular activity assays
- hypothesis: LRCH4 association controls DOCK6 localization through a specific physical interface.
  description: Test purified components and endogenous reciprocal association, then separate binding-defective
    from catalytically altered constructs when measuring cytosolic and peripheral pools.
  experiment_type: Interface and localization analysis
