      context rather than a purified exchange assay.
  full_text_unavailable: true
- id: PMID:22634526
  title: The RhoGEF Zizimin-related acts in the Drosophila cellular immune response via the Rho GTPases
    Rac2 and Cdc42.
  findings:
  - statement: Fly Zir participates in immune signaling through genetic interactions with Rac2 and Cdc42.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete abstract and current fly experimental annotations were inspected. Drosophila
      Zir genetically interacts with Rac2/Cdc42 in immune signaling. This grounds the ancestral regulatory
      inference but is not a purified human DOCK6 assay.
  full_text_unavailable: true
core_functions:
- description: 'DOCK6 promotes nucleotide exchange on Rho-family small GTPases, coupling their activation
    to cytoskeletal remodeling. Rac1/CDC42 exchange was reported in neuronal-cell studies, while human
    patient fibroblasts show altered actin organization. Human DOCK6 has a cytosolic pool and associates
    with LRCH proteins that can redistribute it. Activation depends on experimental context: a later human-cell
    FRET screen detected no Rac1/CDC42 activation under its tested conditions.'
