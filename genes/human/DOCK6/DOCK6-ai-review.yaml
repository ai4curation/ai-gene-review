- id: PMID:32203420
  title: Systems analysis of RhoGEF and RhoGAP regulatory proteins reveals spatially organized RAC1 signalling
    from integrin adhesions.
  findings:
  - statement: Human DOCK6 associates with LRCH4 and has a cytosolic pool that LRCH coexpression can redistribute.
      The tested full-length protein and DHR2 fragment did not activate the three Rho-GTPase biosensors
      under the screen conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The protected cache is abstract-only. The genuine author-hosted original, Figure 6 pixels,
      Methods and publisher supplementary tables were independently read. The human DOCK6 library sequence
      matches current Q96HP0. Targeted LRCH4 co-IP is Figure 6f, despite the IntAct 6E locator. Negative
      FRET activation under the tested conditions is retained alongside positive earlier studies.
  full_text_unavailable: true
- id: Reactome:R-HSA-1011598
  title: DOCKs bind to RhoGEFs
  findings:
