description: DOCK6 is a cytosolic DOCK-family guanine-nucleotide exchange factor that promotes Rho-family
  GTPase signaling and actin remodeling. Rac1 and CDC42 exchange has been reported in neuronal-cell studies,
  while human DOCK6 deficiency disrupts fibroblast morphology and is associated with Adams–Oliver syndrome.
  LRCH proteins associate with DOCK6 and can redistribute it toward the cell periphery. Its activation
  varies with experimental context, including a human-cell screen in which the expressed protein did not
  increase the tested Rho-GTPase biosensor signals.
