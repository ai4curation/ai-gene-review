  full_text_unavailable: true
- id: PMID:21820096
  title: Recessive mutations in DOCK6, encoding the guanidine nucleotide exchange factor DOCK6, lead to
    abnormal actin cytoskeleton organization and Adams-Oliver syndrome.
  findings:
  - statement: Biallelic human DOCK6 disruption is associated with Adams–Oliver syndrome and altered patient-fibroblast
      actin organization and morphology.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The full original and Figure 4 were independently inspected. Human patient fibroblasts
      show altered actin organization and morphology; mouse whole-mount expression experiments are separate.
      This study does not directly measure human DOCK6 nucleotide exchange or provide a human rescue assay.
  full_text_unavailable: false
- id: PMID:12432077
  title: Identification of an evolutionarily conserved superfamily of DOCK180-related proteins with guanine
