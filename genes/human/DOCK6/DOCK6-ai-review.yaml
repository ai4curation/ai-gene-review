- id: PMID:17196961
  title: Dock6, a Dock-C subfamily guanine nucleotide exchanger, has the dual specificity for Rac1 and
    Cdc42 and regulates neurite outgrowth.
  findings:
  - statement: Dock6 promotes nucleotide exchange on Rac1 and Cdc42 and supports neurite outgrowth in
      mouse N1E-115 cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract reports Rac1/CDC42 exchange and explicitly names mouse N1E-115
