- term:
    id: GO:0016607
    label: nuclear speck
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      An immunofluorescence-curation annotation placing this enzyme in nuclear
      speckles. Nuclear speckles are membraneless nuclear bodies involved in
      pre-mRNA splicing factor storage. GCNT1 is a single-pass type II membrane
      glycosyltransferase whose catalytic domain faces the Golgi lumen and which
      has been localised to the Golgi by confocal microscopy against three
      independent Golgi markers in the primary literature.
    action: REMOVE
    reason: >-
      A membrane-anchored, lumenal-facing enzyme cannot reside in a membraneless
      nuclear body, and no mechanism has been proposed by which it would. This is
      not an experimental annotation whose full text might contain supporting data
      that the cache omits: it comes from an immunofluorescence curation pipeline,
      where a single antibody staining pattern is the whole of the evidence, and
      cross-reactive nuclear speckle patterns are a known artefact class. It is
      contradicted by marker-controlled microscopy in PMID:23027862 and by the
      gene's topology. Retaining it would corrupt any compartment-based analysis
      of the glycosylation machinery.
    supported_by:
    - reference_id: PMID:23027862
      supporting_text: >-
        Confocal fluorescence microscopic analysis shows substantial Golgi
        co-localization of C2GnT1 and GOLPH3
    - reference_id: PMID:1329093
      supporting_text: >-
        The cDNA sequence predicts a protein with type II membrane topology
