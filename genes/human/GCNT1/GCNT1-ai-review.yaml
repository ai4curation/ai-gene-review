id: Q02742
gene_symbol: GCNT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GCNT1 (core 2 beta-1,6-N-acetylglucosaminyltransferase 1, C2GnT1; EC 2.4.1.102)
  is a Golgi-resident type II membrane glycosyltransferase that creates the branch
  point of mucin-type O-glycans. It transfers N-acetylglucosamine from UDP-GlcNAc
  in a beta-1,6 linkage onto the GalNAc of the core 1 disaccharide
  Gal-beta1-3-GalNAc-alpha1-O-Ser/Thr, producing the branched core 2 structure
  Gal-beta1-3(GlcNAc-beta1-6)GalNAc. The enzyme is specific for this acceptor and
  shows no activity toward the acceptors used by other beta-1,6-GlcNAc
  transferases. Branching to core 2 is what allows an O-glycan to be extended into
  a poly-N-acetyllactosamine chain and capped with sialyl Lewis x, so GCNT1
  determines whether mucin-type O-glycans can become functional selectin ligands.
  Its best-characterised product in this regard is the core 2-associated sialyl
  Lewis x carried by P-selectin glycoprotein ligand-1 (PSGL-1) on leukocytes.
  Correct Golgi retention of the enzyme, which depends on an LLRRR motif in its
  cytoplasmic tail that binds GOLPH3, is required for this biosynthetic output.
  Core 2 branching activity rises during T-cell activation and is altered in
  immunodeficiency and in cancer metastasis.
