suggested_questions:
- question: >-
    Where should the boundary sit between a glycosyltransferase and the physiology
    of the glycan it builds? GCNT1 carries leukocyte tethering or rolling, positive
    regulation of the same, and cell adhesion molecule production, all resting on
    the single fact that it makes the core 2 branch of a selectin ligand. Deciding
    this consistently matters well beyond this gene, since every glycosyltransferase
    is exposed to the same inheritance of its product's biology.
- question: >-
    Is the nuclear speck annotation reproducible with an independent antibody or a
    tagged construct? If not, it may be worth revisiting other
    immunofluorescence-curation localisations of Golgi glycosyltransferases as a
    class, rather than only this one.
suggested_experiments:
- description: >-
    Repeat the selectin tethering and rolling assays with direct GCNT1 knockdown
    rather than GOLPH3 knockdown, which would establish whether the cell-behaviour
    annotations rest on the enzyme itself rather than on a trafficking factor that
    also affects other cargo.
- description: >-
    Sub-Golgi fractionation or split-fluorophore imaging against cis, medial and
    trans markers to resolve quantitatively where in the stack GCNT1 acts, which
    would settle whether the trans-Golgi network annotation or the broader Golgi
    cisterna annotation is the better description.
