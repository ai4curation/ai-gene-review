- term:
    id: GO:0050901
    label: leukocyte tethering or rolling
  evidence_type: IMP
  original_reference_id: PMID:23027862
  qualifier: involved_in
  review:
    summary: >-
      The tethering and rolling assays in this paper were performed on
      GOLPH3-depleted cells, in which C2GnT1 is mislocalised, rather than on cells
      depleted of C2GnT1 itself. The biology is nonetheless real: core 2 branching
      is required to build the sialyl Lewis x on PSGL-1 that selectins bind, and
      direct C2GnT1 knockdown does reduce that structure by 74.6%.
    action: KEEP_AS_NON_CORE
    reason: >-
      Leukocyte tethering and rolling is a cell-level behaviour executed by the
      leukocyte through selectin-ligand engagement at the cell surface. GCNT1 is a
      Golgi enzyme that builds the ligand; it is upstream of the adhesion event and
      does no part of the work of tethering or rolling. This is the guilt-by-substrate
      pattern in which a biosynthetic enzyme inherits the physiology of the molecule
      it makes. Worth keeping, because loss of the enzyme genuinely compromises the
      process, but not as a core function.
    supported_by:
    - reference_id: PMID:23027862
      supporting_text: >-
        GOLPH3 knockdown results in reduced synthesis of C2-O-sLe(x) associated with
        P-selectin glycoprotein ligand-1, reduced cell tethering to and rolling on
        immobilized P- or E-selectin
    - reference_id: PMID:23027862
      supporting_text: >-
        Core 2 N-acetylglucosaminyltransferase 1 (C2GnT1) is a key enzyme
        participating in the synthesis of core 2-associated sialyl Lewis x
        (C2-O-sLe(x)), a ligand involved in selectin-mediated leukocyte trafficking
        and cancer metastasis
- term:
    id: GO:0060352
    label: cell adhesion molecule production
  evidence_type: IMP
  original_reference_id: PMID:23027862
  qualifier: involved_in
  review:
    summary: >-
      Derived from the same GOLPH3-knockdown experiments, reading the loss of
      functional PSGL-1 glycosylation as a defect in producing a cell adhesion
      molecule. PSGL-1 protein levels were explicitly shown to be unchanged; only
      its glycan was lost.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term denotes production of cell adhesion molecules, and the paper's own
      control shows that production of the adhesion molecule is unaffected: the
      decrease in core 2 sialyl Lewis x "was not due to reduced PSGL-1 protein
      expression". What changed is post-translational modification of an
      already-produced protein. Reading a production term out of a glycosylation
      defect stretches the term past its definition, and the underlying activity is
      captured precisely by the O-linked glycosylation process annotations.
    supported_by:
    - reference_id: PMID:23027862
      supporting_text: >-
        following the treatment with C2GnT1 siRNA, there was a 74.6% decrease in
        PSGL-1-associated C2-O-sLe x
- term:
    id: GO:1903238
    label: positive regulation of leukocyte tethering or rolling
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
