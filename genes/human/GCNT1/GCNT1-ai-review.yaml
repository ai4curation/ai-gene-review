core_functions:
- description: >-
    GCNT1 catalyses the branching step of mucin-type O-glycan biosynthesis,
    transferring N-acetylglucosamine from UDP-GlcNAc in a beta-1,6 linkage onto
    the GalNAc of the core 1 disaccharide to form the branched core 2 structure.
    It acts as a type II membrane enzyme distributed across the Golgi stack, where
    its retention depends on a cytoplasmic LLRRR motif. By creating the core 2
    branch it determines which O-glycans can be extended into
    poly-N-acetyllactosamine and capped as sialyl Lewis x, and hence whether
    carriers such as PSGL-1 become functional selectin ligands.
