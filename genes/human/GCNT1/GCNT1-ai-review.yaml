- term:
    id: GO:0005802
    label: trans-Golgi network
  evidence_type: IDA
  original_reference_id: PMID:23027862
  qualifier: located_in
  review:
    summary: >-
      The cited study compared C2GnT1 localisation against cis-, medial- and
      trans-Golgi markers. It reports only partial co-localisation with the
      trans-Golgi marker TGN46, and explicitly notes a higher degree of
      co-localisation of C2GnT1 with the cis-Golgi marker GM130 than GOLPH3 shows.
      The enzyme is distributed across the stack rather than concentrated in the
      trans-Golgi network.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper's own comparison places C2GnT1 across the Golgi stack with a
      cis-leaning distribution relative to GOLPH3, so singling out the trans-Golgi
      network overstates what was observed. This is not a wrong compartment, and
      the partial TGN46 overlap is real, but as a located_in claim it is more
      specific than the data support. The general Golgi membrane annotations
      already carry the well-supported localisation.
    supported_by:
    - reference_id: PMID:23027862
      supporting_text: >-
        Our data also indicate partial co-localization of C2GnT1 with a trans- Golgi
        marker TGN46
    - reference_id: PMID:23027862
      supporting_text: >-
        We found a higher degree of colocalization of a cis- Golgi protein GM130
- term:
    id: GO:0009101
    label: glycoprotein biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:23027862
  qualifier: involved_in
  review:
    summary: >-
      Supported by direct knockdown of the gene itself: C2GnT1 siRNA produced a
      74.6% decrease in PSGL-1-associated core 2 sialyl Lewis x, without reducing
      PSGL-1 protein levels. The evidence is solid, but the term names the broadest
      possible class of glycoprotein biosynthesis.
    action: MODIFY
    reason: >-
      The experiment measures loss of a specific mucin-type O-glycan structure on
      a specific carrier protein, so the process is known precisely. GO:0016266
      protein O-linked glycosylation via N-acetylgalactosamine is the term that
      matches what was assayed, and it is already annotated to this gene from other
      sources. Leaving the generic parent in place adds nothing and would let the
      gene surface in queries about N-glycan and other glycoprotein biosynthesis
      that it has nothing to do with.
    proposed_replacement_terms:
    - id: GO:0016266
      label: protein O-linked glycosylation via N-acetylgalactosamine
    supported_by:
    - reference_id: PMID:23027862
      supporting_text: >-
        following the treatment with C2GnT1 siRNA, there was a 74.6% decrease in
        PSGL-1-associated C2-O-sLe x
