id: Q15726
gene_symbol: KISS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Secreted precursor (prepro-kisspeptin, 138 aa with an N-terminal signal peptide) of the
  kisspeptins, a family of C-terminally amidated RF-amide peptides generated by cleavage at
  paired basic residues: kisspeptin-54 (metastin, residues 68-121), kisspeptin-14, kisspeptin-13
  and the minimal decapeptide kisspeptin-10 (112-121), whose amidated Arg-Phe C-terminus is the
  pharmacophore required for receptor binding and activation. The mature peptides act outside the
  cell as high-affinity agonists of the plasma-membrane G protein-coupled receptor KISS1R
  (GPR54), coupling it to Gq/11 and phospholipase C with PIP2 hydrolysis, calcium mobilization,
  PKC and ERK1/2 and p38 MAPK signalling, and additionally to a beta-arrestin arm. Two settings
  dominate its physiology. In the hypothalamus, kisspeptin neurons of the infundibular (arcuate)
  and preoptic regions release the peptide onto KISS1R-expressing gonadotropin-releasing hormone
  (GnRH) neurons, depolarizing them and driving GnRH secretion and hence pituitary gonadotropin
  (LH and FSH) output, puberty and fertility; human loss-of-function causes normosmic
  hypogonadotropic hypogonadism with failure of pubertal progression, and infusion of
  kisspeptin-54 raises circulating LH, FSH and testosterone. In the placenta, which is the
  highest-expressing human tissue, villous syncytiotrophoblast secretes kisspeptin into the
  maternal circulation at concentrations that rise several thousand-fold during pregnancy, and
  locally restrains the invasion and migration of extravillous trophoblast. The same
  receptor-dependent anti-motility, anti-proliferative and pro-apoptotic signalling underlies the
  gene's original identification as a melanoma and breast carcinoma metastasis suppressor, and a
  further peripheral role in suppressing osteoclast-mediated bone resorption has been
  characterized in mouse. Mature peptide activity is terminated by matrix metalloproteinase
  cleavage of the Gly118-Leu119 bond.
