- id: PMID:8944003
  title: KiSS-1, a novel human malignant melanoma metastasis-suppressor gene.
  findings:
  - statement: >-
      KiSS-1 was isolated from chromosome-6-complemented melanoma cells and its re-expression
      suppressed metastasis without affecting tumorigenicity; expression was highest in placenta.
    supporting_text: >-
      Transfection of a full-length KiSS-1 cDNA into C8161 melanoma cells suppressed metastasis
      in an expression-dependent manner.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The original description of the gene, PubMed-verified. Its structural reading of the
      protein as an intracellular polyproline SH3 ligand was superseded by the 2001
      deorphanisation papers; the metastasis-suppression phenotype itself stands.
- id: PMID:9192814
  title: Suppression of metastasis in human breast carcinoma MDA-MB-435 cells after
    transfection with the metastasis suppressor gene, KiSS-1.
  findings:
  - statement: >-
      KiSS-1 transfection suppressed metastasis of a human breast carcinoma line without
      affecting tumorigenicity, while invasion and motility were unchanged; cytoskeletal
      involvement was offered as a speculation from the predicted protein structure.
    supporting_text: Invasion and motility were unaffected by KiSS-1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, but it is the source of the GO:0007010 cytoskeleton organization row and
      supports that term only as a speculation from a superseded intracellular mechanism. Judged
      an over-annotation of the ligand in this review.
- id: PMID:11385580
  title: Metastasis suppressor gene KiSS-1 encodes peptide ligand of a G-protein-coupled
    receptor.
  findings:
  - statement: >-
      The KISS1 product is a C-terminally amidated 54-residue peptide, purified from human
      placenta, that is the endogenous ligand of the orphan receptor hOT7T175 (KISS1R).
    supporting_text: >-
      encodes a carboxy-terminally amidated peptide with 54 amino-acid residues, which we have
      isolated from human placenta as the endogenous ligand of an orphan G-protein-coupled
      receptor (hOT7T175) and have named 'metastin'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      One of the two deorphanisation papers; establishes the gene product's identity as a
      secreted amidated peptide hormone and the ligand side of the pair. Abstract only in the
      cache.
- id: PMID:11387329
  title: AXOR12, a novel human G protein-coupled receptor, activated by the peptide
    KiSS-1.
  findings:
  - statement: >-
      KiSS-1-derived peptides are high-potency agonists of the human receptor AXOR12 (KISS1R);
      KiSS-1 expression is highest in placenta and brain.
    supporting_text: >-
      High potency agonism, indicative of a cognate ligand, was evident from peptides derived
      from the gene KiSS-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of the GO:0005515 IPI row with Q969F8. The paper is about the receptor's
      deorphanisation, and the interaction it reports is ligand-receptor agonism, which is why
      the generic binding row is modified to kisspeptin receptor binding rather than removed.
- id: PMID:11457843
  title: The metastasis suppressor gene KiSS-1 encodes kisspeptins, the natural ligands
    of the orphan G protein-coupled receptor GPR54.
  findings:
  - statement: >-
      The 54-, 14- and 13-residue kisspeptins share an RF-amide C terminus, bind rat and human
      GPR54 with low nanomolar affinity, and stimulate PIP2 hydrolysis, calcium mobilization,
      ERK1/2 and p38 phosphorylation and stress-fibre formation while inhibiting proliferation.
    supporting_text: >-
      They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
      hamster ovary K1 cells and stimulated PIP(2) hydrolysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The key human molecular-function reference for the ligand: affinity and
      PLC-pathway activation measured on the human receptor. Also the origin of the stress-fibre
      observation, which is a response of the receptor-expressing cell. Abstract only in the
      cache.
- id: PMID:11527393
  title: Metastin suppresses the motility and growth of CHO cells transfected with
    its receptor.
  findings:
  - statement: >-
      Metastin suppressed motility, spreading and growth of CHO cells transfected with its
      receptor at 10-100 nM, establishing that the anti-motility effect is receptor-dependent.
    supporting_text: >-
      Metastin significantly suppressed motility in a chemotaxis assay and wound healing assay
      at 10-100 nM order concentrations.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Clean demonstration that the anti-motility action requires the receptor, which is why
      those processes are the target cell's and are not annotated to the ligand here.
- id: PMID:12574233
  title: 'Dramatic elevation of plasma metastin concentrations in human pregnancy:
    metastin as a novel placenta-derived hormone in humans.'
  findings:
  - statement: >-
      Immunoreactive metastin is present in human plasma and rises from about 1.3 fmol/ml outside
      pregnancy to 9590 fmol/ml in the third trimester, with syncytiotrophoblast as the source.
    supporting_text: >-
      Histochemical studies of human placenta localized metastin mRNA and immunoreactivity to
      the syncytiotrophoblasts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the peptide as a circulating, placenta-derived hormone in humans, supporting
      both the extracellular location and the hormone reading of the molecular function.
- id: PMID:12879005
  title: Cleavage of metastasis suppressor gene product KiSS-1 protein/metastin by
    matrix metalloproteinases.
  findings:
  - statement: >-
      MMP-2, MMP-9, MT1-, MT3- and MT5-MMP cleave the Gly118-Leu119 bond of the precursor and of
      the metastin decapeptide, abolishing ligand activity; the decapeptide induces focal
      adhesions and stress fibres in cells expressing the receptor.
    supporting_text: >-
      Metastin decapeptide induced formation of focal adhesion and actin stress fibers in cells
      expressing the receptor
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Source of the UniProt PTM statement. Important for two decisions here: it localizes the
      cytoskeletal response to the receptor-expressing cell, and it is the only processing step
      with named enzymes, which sharpens the convertase knowledge gap.
- id: PMID:15020672
  title: Kisspeptin-10, a KiSS-1/metastin-derived decapeptide, is a physiological
    invasion inhibitor of primary human trophoblasts.
  findings:
  - statement: >-
      Kisspeptin-10 is present in conditioned medium of primary first-trimester human
      trophoblast, raises intracellular calcium in those cells, and inhibits trophoblast
      migration and gelatinolytic activity without affecting proliferation.
    supporting_text: >-
      We identified Kp-10, a dekapeptide derived from the primary translation product, in
      conditioned medium of first trimester human trophoblast.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The experimental basis of the EXP extracellular-region row and of UniProt's "Secreted"
      statement, and the best human evidence for the placental paracrine arm.
- id: PMID:15219839
  title: Peripheral administration of metastin induces marked gonadotropin release
    and ovulation in the rat.
  findings:
  - statement: >-
      Subcutaneous metastin raised plasma FSH and LH and induced ovulation in rats; the response
      was abolished by a GnRH antagonist and accompanied by c-Fos induction in GnRH neurons,
      placing the ligand's action upstream of GnRH release.
    supporting_text: >-
      This action was abolished by pretreatment with a GnRH antagonist, and was accompanied by
      induction of c-Fos immunoreactivity in GnRH neurons.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Rat pharmacology, cited for the mechanism (the gonadotropin rise is GnRH-dependent) rather
      than as human evidence. Supports keeping the LH term as a regulation claim on the ligand.
- id: PMID:15596153
  title: Activation of GPR54 promotes cell cycle arrest and apoptosis of human tumor
    cells through a specific transcriptional program not shared by other Gq-coupled
    receptors.
  findings:
  - statement: >-
      Kisspeptin-10 stimulation of GPR54 in MDA-MB-435S cells produces a PLC- and PKC-dependent
      transcriptional program distinct from another Gq-coupled receptor's, and promotes
      apoptosis.
    supporting_text: >-
      Stimulation of GPR54 promoted apoptosis while no significant change was observed after
      B(2) receptor activation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Receptor-side mechanism for the anti-tumour phenotype; cited here as context for why the
      growth and apoptosis processes are not annotated to the ligand.
- id: PMID:16174713
  title: Kisspeptin-54 stimulates the hypothalamic-pituitary gonadal axis in human
    males.
  findings:
  - statement: >-
      A 90-minute intravenous infusion of kisspeptin-54 in male volunteers significantly
      increased plasma LH, FSH and testosterone relative to saline, with a plasma half-life of
      about 28 minutes.
    supporting_text: >-
      Kisspeptin-54 infusion significantly increased plasma LH, FSH, and testosterone
      concentrations compared with saline infusion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Human in vivo evidence that the peptide drives the reproductive axis. PubMed-verified: the
      identifier resolves to this crossover infusion study in male volunteers.
- id: PMID:17488799
  title: Hypertrophy and increased kisspeptin gene expression in the hypothalamic
    infundibular nucleus of postmenopausal women and ovariectomized monkeys.
  findings:
  - statement: >-
      KISS1 transcripts in the human hypothalamus are located predominantly in neurons of the
      infundibular nucleus, and those neurons hypertrophy and increase KISS1 expression after
      loss of ovarian steroids, which estrogen replacement reverses in monkeys.
    supporting_text: >-
      Examination of human hypothalamic sections revealed that KiSS-1 neurons were located
      predominantly in the infundibular nucleus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited for one thing only: that the human gene is expressed by hypothalamic neurons, which
      is what the neuropeptide reading of the molecular function requires. The steroid-dependence
      findings are expression regulation, not a function of the gene product.
- id: PMID:22335740
  title: Inactivating KISS1 mutation and hypogonadotropic hypogonadism.
  findings:
  - statement: >-
      A homozygous inactivating KISS1 mutation in a large consanguineous family causes failure of
      pubertal progression, establishing that functional kisspeptin is required for human puberty
      and reproduction.
    supporting_text: >-
      We describe an inactivating mutation in KISS1 in a large consanguineous family that
      results in failure of pubertal progression, indicating that functional kisspeptin is
      important for puberty and reproduction in humans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The human loss-of-function evidence, and the source of the UniProt HH13 variant record
      (N115K, with severely decreased receptor ligand activity). Abstract only in the cache; the
      variant characterization is taken from the UniProt feature table rather than from the
      paper's figures.
- id: PMID:25147978
  title: KISS1R signals independently of Galphaq/11 and triggers LH secretion via
    the beta-arrestin pathway in the male mouse.
  findings:
  - statement: >-
      Kisspeptin-induced LH secretion is reduced in mice lacking beta-arrestin-1 or -2, and a
      Gq/11-uncoupled KISS1R mutant still drives beta-arrestin-dependent ERK1/2 phosphorylation.
    supporting_text: >-
      Overall, we conclude that KISS1R signals via Gαq/11 and β-arrestin to regulate GnRH
      secretion.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Receptor-side mechanism in mouse and HEK cells. Cited as background for the signalling
      description; it supports no annotation on the ligand.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      HuRI is a proteome-scale binary interactome map of about 53,000 interactions; it reports
      interactions without functional characterization of individual pairs.
    supporting_text: >-
      Here we present a human 'all-by-all' reference interactome map of human binary protein
      interactions, or 'HuRI'.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the UBQLN2 interaction, but a high-throughput screen with no
      functional follow-up for this pair, so the resulting generic binding row is removed under
      the protein-binding policy.
- id: PMID:38346942
  title: Kisspeptin-10 binding to Gpr54 in osteoclasts prevents bone loss by activating
    Dusp18-mediated dephosphorylation of Src.
  findings:
  - statement: >-
      Kisspeptin-10 acting on Gpr54 recruits active SRC and the phosphatase DUSP18 to the
      receptor's proline/arginine-rich C-terminal motif, dephosphorylating SRC at Tyr416 and
      suppressing osteoclast differentiation and bone resorption.
    supporting_text: >-
      Gpr54 recruits both active Src and the Dusp18 phosphatase at its proline/arginine-rich
      motif in its C terminus
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. The mechanism is mouse (whole-body and osteoclast conditional knockouts,
      ovariectomy model) with a confirmatory human giant-cell-tumour osteoclast assay; it is the
      basis of the ISS bone-resorption row, kept as non-core.
- id: PMID:39151001
  title: Structural basis for the ligand recognition and G protein subtype selectivity
    of kisspeptin receptor.
  findings:
  - statement: >-
      Cryo-EM structures of KISS1R with kisspeptin-54 and with TAK-448 show the conserved
      amidated RF C-terminus engaging the orthosteric pocket, and the receptor coupling Gq/11 and
      Gi/o.
    supporting_text: >-
      Kisspeptins belong to RF amide peptides because of the specific C-terminal domain that
      required for binding and activating KISS1R.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache. Structural confirmation that the amidated C-terminus is
      the pharmacophore; the G protein selectivity findings are the receptor's business.
