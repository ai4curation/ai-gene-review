- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UHD9
  review:
    summary: >-
      Bare protein binding from the HuRI proteome-scale binary interactome screen, with UBQLN2
      (Q9UHD9) as partner. The screen reports an interaction but no function, and no follow-up
      establishes a role for a UBQLN2 interaction in the biology of this secreted peptide
      precursor.
    action: REMOVE
    reason: >-
      Uninformative generic binding from a high-throughput screen, removed under the
      protein-binding policy. Removal does not assert that the reported interaction is false; it
      records that the annotation conveys no molecular function. No specific MF is invented from
      interaction evidence alone, and the partner (a ubiquilin shuttle factor) has no documented
      functional relationship to kisspeptin signalling.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: >-
        Here we present a human 'all-by-all' reference interactome map of human binary protein
        interactions, or 'HuRI'.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:15020672
  qualifier: located_in
  review:
    summary: >-
      Direct experimental support for the core localization: Bilban identified kisspeptin-10 in
      the conditioned medium of primary first-trimester human trophoblast, and UniProt's
      SUBCELLULAR LOCATION "Secreted" is curated from this paper.
    action: ACCEPT
    reason: >-
      The gene product is a secreted peptide hormone precursor with a cleavable signal peptide,
      and the mature peptides act on a plasma-membrane receptor of the responding cell, so the
      extracellular region is where this gene product functions. This is a core, not peripheral,
      location.
    supported_by:
    - reference_id: PMID:15020672
      supporting_text: >-
        We identified Kp-10, a dekapeptide derived from the primary translation product, in
        conditioned medium of first trimester human trophoblast.
