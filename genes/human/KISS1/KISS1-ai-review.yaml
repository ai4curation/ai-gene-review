    supporting_text: >-
      Examination of human hypothalamic sections revealed that KiSS-1 neurons were located
      predominantly in the infundibular nucleus.
- description: >-
    Kisspeptin secreted by placental villous syncytiotrophoblast into the maternal circulation
    and the local tissue environment, acting on KISS1R of neighbouring extravillous trophoblast
    and of KISS1R-expressing tumour cells to restrain migration, invasion and proliferation. The
    molecular activity is the same agonism as in the hypothalamic arm; what differs is the
    setting, which is endocrine and paracrine rather than a central nervous system action.
  molecular_function:
