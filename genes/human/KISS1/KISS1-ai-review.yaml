    additional_reference_ids:
    - PMID:38346942
    supported_by:
    - reference_id: PMID:38346942
      supporting_text: >-
        GPR54 activation by its natural ligand Kisspeptin-10 (Kp-10) causes Dusp18 to
        dephosphorylate Src at Tyr 416
    - reference_id: PMID:38346942
      supporting_text: >-
        Gpr54 recruits both active Src and the Dusp18 phosphatase at its proline/arginine-rich
        motif in its C terminus
- term:
    id: GO:0048018
    label: receptor ligand activity
  evidence_type: IDA
  original_reference_id: PMID:11385580
  qualifier: enables
  review:
    summary: >-
      The gene's own molecular activity is missing from its GOA rows: the human record carries
      only kisspeptin receptor binding and two bare protein-binding rows, with no ligand or
      hormone activity. Mouse and rat Kiss1 both carry GO:0048018 by ISO naming human KISS1 and
      its kisspeptin-10 chain as the source, and GO's own cached GO-CAM models give that chain
      the same term, so the activity is recognized everywhere except on the human gene itself.
      The peptide is a C-terminally amidated hormone purified from human placenta that activates
      KISS1R at low nanomolar concentrations.
    action: NEW
    reason: >-
      Binding is annotated (GO:0031773) but agonism is not, and the two are different claims:
      Ohtaki purified the amidated 54-residue peptide from human placenta as the receptor's
      endogenous ligand and Kotani showed the peptides activate the human receptor, so the gene
      product performs the activating interaction itself and the participation test is satisfied
      without appeal to downstream physiology. Comparators in the same class all carry a ligand
      or hormone MF (OXT GO:0005184; GNRH1 GO:0005179 with GO:0005183; TAC3 GO:0048018; PDYN
      GO:0001515), so the absence here is a gap rather than a convention. GO:0048018 is chosen
      over its descendants deliberately: checked in OLS, GO:0005184 neuropeptide hormone activity
      is_a GO:0005179 hormone activity is_a GO:0048018, and the two descendants fit only part of
      this gene product. Kisspeptin is a CNS-acting peptide hormone in the hypothalamus (KISS1
      neurons of the human infundibular nucleus; kisspeptin-54 infusion drives the human
      reproductive axis), a circulating placenta-derived hormone in pregnancy, and a local
      paracrine ligand on neighbouring trophoblast, and only the shared parent is true of all
      three. GO:0005184 would be a defensible refinement for the hypothalamic arm and is
      suggested as a question rather than asserted here.
    additional_reference_ids:
    - PMID:11457843
    - PMID:16174713
    - PMID:17488799
    supported_by:
    - reference_id: PMID:11385580
      supporting_text: >-
        encodes a carboxy-terminally amidated peptide with 54 amino-acid residues, which we have
        isolated from human placenta as the endogenous ligand of an orphan G-protein-coupled
        receptor (hOT7T175) and have named 'metastin'
    - reference_id: PMID:11457843
      supporting_text: >-
        These 54-, 14,- and 13-amino acid peptides, with a common RF-amide C terminus, derive
        from the product of KiSS-1
    - reference_id: PMID:17488799
      supporting_text: >-
        Examination of human hypothalamic sections revealed that KiSS-1 neurons were located
        predominantly in the infundibular nucleus.
    - reference_id: PMID:16174713
      supporting_text: >-
        Kisspeptin-54 infusion significantly increased plasma LH, FSH, and testosterone
        concentrations compared with saline infusion
core_functions:
- description: >-
    Secreted as a precursor and cleaved at paired basic residues into the C-terminally amidated
    kisspeptins (kisspeptin-54/metastin, -14, -13 and -10), which act in the extracellular space
    as high-affinity agonists of KISS1R on gonadotropin-releasing hormone neurons, coupling the
    receptor to Gq/11 and phospholipase C and thereby driving GnRH release and pituitary
    gonadotropin secretion, puberty and fertility.
