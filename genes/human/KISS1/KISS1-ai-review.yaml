proposed_new_terms:
- proposed_name: kisspeptin receptor signaling pathway
  proposed_definition: >-
    A G protein-coupled receptor signaling pathway initiated by a kisspeptin binding to the
    kisspeptin receptor KISS1R on the surface of a target cell, and ending with the regulation of
    a downstream cellular process. Kisspeptins are C-terminally amidated RF-amide peptides
    cleaved from the KISS1 precursor.
  justification: >-
    There is no GO term for the pathway this ligand-receptor pair runs, so both sides are
    annotated with terms that name either the effector (GO:0007200) or the ligand class
    (GO:0007218) instead of the pathway itself. Named pathway terms exist for the comparable
    neuropeptide systems - GO:0007217 tachykinin receptor signaling pathway, GO:0038003 G
    protein-coupled opioid receptor signaling pathway, and GO:0090663 galanin-activated
    signaling pathway, which is currently the only child of GO:0007218 even though KISS1R is a
    galanin-like receptor. A kisspeptin term would let the reproductive-axis annotations on
    KISS1, KISS1R and their downstream effectors be collected without conflating them with every
    other PLC-coupled or neuropeptide pathway.
  proposed_parent:
    id: GO:0007218
    label: neuropeptide signaling pathway
  supported_by:
  - reference_id: PMID:11457843
    supporting_text: >-
      They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
      hamster ovary K1 cells and stimulated PIP(2) hydrolysis
  - reference_id: PMID:39151001
    supporting_text: >-
      Kisspeptins belong to RF amide peptides because of the specific C-terminal domain that
      required for binding and activating KISS1R.
knowledge_gaps:
- gap_statement: >-
    Which endoprotease(s) cut the human KISS1 precursor to kisspeptin-54, -14, -13 and -10 in
    vivo is not established, nor whether hypothalamic kisspeptin neurons and placental
    syncytiotrophoblast generate the same mixture of peptide forms.
  boundary: >-
    The peptide products and their cleavage sites are known (UniProt records metastin 68-121,
    kisspeptin-14 108-121, -13 109-121 and -10 112-121, with C-terminal amidation at Phe121),
    kisspeptin-10 is sufficient for full receptor activation, and one destructive cleavage is
    attributed to specific enzymes (MMP-2, MMP-9, MT1-, MT3- and MT5-MMP at Gly118-Leu119).
    What is missing is the identity of the activating convertase(s) and the tissue dependence of
    processing.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  provenance:
  - reference_id: PMID:12879005
    supporting_text: >-
      Active MMP-2, MMP-9, MT1-MMP, MT3-MMP and MT5-MMP cleaved the Gly118-Leu119 peptide bond
      of not only full-length KiSS-1 protein but also metastin decapeptide.
  - reference_id: file:human/KISS1/KISS1-uniprot.txt
    supporting_text: 'PTM: Processed by MMP2 and MMP9. {ECO:0000269|PubMed:12879005}.'
- gap_statement: >-
    What the thousand-fold rise in circulating placental kisspeptin during human pregnancy acts
    on is unknown: no target tissue or physiological response has been shown to be driven by the
    circulating peptide, as opposed to the local paracrine action on trophoblast.
  boundary: >-
    The concentrations are measured and the source is localized (immunoreactive metastin rises
    from about 1.3 fmol/ml outside pregnancy to 9590 fmol/ml in the third trimester, from
    syncytiotrophoblast), and the local anti-invasive action on extravillous trophoblast is
    demonstrated. Whether the circulating pool reaches and signals at any distant KISS1R
    population, or is functionally inert because the receptor desensitizes, is untested.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  provenance:
  - reference_id: PMID:12574233
    supporting_text: >-
      The present study provides evidence for metastin as a novel placenta-derived hormone in
      humans.
  - reference_id: PMID:15020672
    supporting_text: >-
      Kp-10 inhibited trophoblast migration in an explant as well as transwell assay without
      affecting proliferation.
suggested_questions:
- question: >-
    Should the hypothalamic arm of this gene product carry the more specific molecular function
    GO:0005184 neuropeptide hormone activity, alongside or instead of GO:0048018 receptor ligand
    activity? The peptide is made by neurons of the human infundibular nucleus and acts on GnRH
    neurons, which satisfies the term's definition, but the highest-expressing human tissue is
    placenta, where the same peptide acts as a circulating hormone and a local paracrine ligand.
- question: >-
    Should the extensive anti-migratory, anti-invasive and pro-apoptotic data be annotated on the
    ligand at all, or only on KISS1R? Every assay that separated the two used receptor-transfected
    or receptor-expressing cells, so the ligand's contribution is the agonist step and the
    effector processes are the target cell's.
- question: >-
    GO has no term for gonadotropin-releasing hormone secretion or its regulation, so the
    proximal action of kisspeptin on GnRH neurons cannot be annotated and is recorded one step
    downstream as regulation of luteinizing hormone secretion. Is a GnRH-secretion term wanted,
    given that the kisspeptin, neurokinin B and dynorphin systems all act at that step?
suggested_experiments:
- description: >-
    Identify the activating convertase(s) by knocking down PCSK1, PCSK2, PCSK5 and FURIN
    individually in primary human first-trimester trophoblast and in a human kisspeptin-neuron
    model, then quantifying the secreted peptide forms (KP-54, -14, -13, -10) by targeted mass
    spectrometry with the amidated C-terminus as the reporter.
  hypothesis: >-
    A single convertase generates kisspeptin-54 in both tissues, with the shorter forms arising
    from tissue-specific secondary cleavage, so the circulating and the locally acting species
    differ by tissue rather than by enzyme repertoire.
- description: >-
    Test whether the pregnancy pool of circulating kisspeptin is a signal or an inert reservoir
    by exposing a KISS1R reporter line to third-trimester and non-pregnant human plasma at native
    concentrations, with and without an antagonist, and measuring receptor activation and its
    desensitization over hours.
  hypothesis: >-
    Sustained exposure to third-trimester plasma concentrations desensitizes KISS1R, so the
    circulating placental pool does not act tonically at distant receptor populations and the
    peptide's relevant actions remain local.
