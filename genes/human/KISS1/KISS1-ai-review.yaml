- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: TAS
  original_reference_id: PMID:9192814
  qualifier: involved_in
  review:
    summary: >-
      Legacy ProtInc author-statement row from the 1997 breast-carcinoma transfection study. That
      paper reported that invasion and motility were unaffected by KiSS-1 and offered
      cytoskeletal reorganization only as a speculation from the predicted intracellular
      structure of the protein (a polyproline SH3-ligand motif), a mechanism superseded in 2001
      when the gene product was shown to be a secreted peptide ligand of a GPCR. Actin and focal
      adhesion changes are real but occur in the receptor-expressing target cell.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not flatly wrong - kisspeptin does trigger stress-fibre and focal-adhesion formation - but
      an over-annotation of the ligand. Takino showed the response in cells expressing the
      receptor, and Kotani saw stress fibres in GPR54-transfected CHO cells, so the cytoskeletal
      remodelling is executed by the responding cell's actin machinery downstream of KISS1R, not
      by this secreted peptide. Kept rather than removed because the statement is a traceable
      author statement about a downstream effect that does occur, and because the full text of
      the cited paper was not read here.
    supported_by:
    - reference_id: PMID:9192814
      supporting_text: Invasion and motility were unaffected by KiSS-1.
    - reference_id: PMID:9192814
      supporting_text: >-
        Based on the predicted structure of the KiSS-1 protein, our results imply a mechanism
        whereby KiSS-1 regulates events downstream of cell-matrix adhesion, perhaps involving
        cytoskeletal reorganization.
    - reference_id: PMID:12879005
      supporting_text: >-
        Metastin decapeptide induced formation of focal adhesion and actin stress fibers in cells
        expressing the receptor
- term:
    id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2663985
  - PANTHER:PTN002704209
  - RGD:727850
  - UniProtKB:Q15726
  review:
    summary: >-
      Correct clade-level statement that KISS1-family peptides act in a GPCR signalling pathway,
      but less specific than the human evidence supports. Kotani showed that the human peptides
      bind the human receptor and stimulate PIP2 hydrolysis, and the peptides are neuropeptides
      acting on a neuropeptide receptor.
    action: MODIFY
    reason: >-
      True but general. Two supported descendants are asserted instead of one: GO:0007200
      phospholipase C-activating G protein-coupled receptor signaling pathway (direct human
      evidence in Kotani; the same term GO's own GO-CAM models give the kisspeptin-10 chain, and
      the term the receptor review accepts for KISS1R) and GO:0007218 neuropeptide signaling
      pathway (the peptide is secreted by hypothalamic neurons and acts on the neuropeptide
      receptor KISS1R; GO:0090663, the galanin pathway, is the existing sibling under that
      parent). The two are siblings under GO:0007186, not ancestor and descendant, so both are
      listed rather than picking one. The ligand's participation in the pathway is its initiating
      receptor-binding step; the Gq, PLC and channel steps belong to KISS1R and its effectors.
    proposed_replacement_terms:
    - id: GO:0007200
      label: phospholipase C-activating G protein-coupled receptor signaling pathway
    - id: GO:0007218
      label: neuropeptide signaling pathway
    additional_reference_ids:
    - PMID:11457843
    - PMID:17488799
    supported_by:
    - reference_id: PMID:11457843
      supporting_text: >-
        They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
        hamster ovary K1 cells and stimulated PIP(2) hydrolysis
    - reference_id: PMID:39151001
      supporting_text: >-
        Kisspeptins belong to RF amide peptides because of the specific C-terminal domain that
        required for binding and activating KISS1R.
    - reference_id: PMID:17488799
      supporting_text: >-
        Examination of human hypothalamic sections revealed that KiSS-1 neurons were located
        predominantly in the infundibular nucleus.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002704209
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node assertion itself is right for the whole family; only its granularity is at
          issue, and the human target has direct evidence for the more specific descendants.
- term:
    id: GO:0031773
    label: kisspeptin receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002704209
  - RGD:727850
  - ZFIN:ZDB-GENE-080128-1
  review:
    summary: >-
      The defining molecular interaction of this gene product: the mature kisspeptins bind
      KISS1R. Asserted at the family node from rat and zebrafish descendants, and independently
      true of the human peptides, which bind human GPR54 with low nanomolar affinity.
    action: ACCEPT
    reason: >-
      Core and directly supported in human. Kotani measured low-nanomolar binding to the human
      receptor; Ohtaki purified the amidated 54-residue peptide from human placenta as the
      endogenous ligand of the same receptor; the 2024 cryo-EM structures show the amidated
      C-terminus inserted in the receptor pocket. The clade-level placement is sound for a
      vertebrate-restricted family in which the ligand and receptor pair is conserved, and
      paint-losses reports no IRD or IKR on this lineage.
    additional_reference_ids:
    - PMID:11385580
    - PMID:39151001
    supported_by:
    - reference_id: PMID:11457843
      supporting_text: >-
        They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
        hamster ovary K1 cells and stimulated PIP(2) hydrolysis
    - reference_id: PMID:11385580
      supporting_text: >-
        encodes a carboxy-terminally amidated peptide with 54 amino-acid residues, which we have
        isolated from human placenta as the endogenous ligand of an orphan G-protein-coupled
        receptor (hOT7T175) and have named 'metastin'
    - reference_id: PMID:39151001
      supporting_text: >-
        Kisspeptins belong to RF amide peptides because of the specific C-terminal domain that
        required for binding and activating KISS1R.
- term:
    id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002704209
  - RGD:727850
  review:
    summary: >-
      The gene product's defining physiological role, inherited across the family and directly
      demonstrated in human: infusion of kisspeptin-54 into male volunteers raised plasma LH,
      FSH and testosterone, and an inactivating KISS1 mutation causes failure of pubertal
      progression with low gonadotropins.
    action: ACCEPT
    reason: >-
      A regulation term, so the annotation does not claim that this gene product secretes LH -
      the gonadotrope does - but that it modulates the rate of that secretion, which is exactly
      what the human infusion and loss-of-function data show. The proximal step is GnRH release
      from GnRH neurons (Matsui's rat data: the gonadotropin rise is abolished by a GnRH
      antagonist and accompanied by c-Fos in GnRH neurons), but GO has no term for GnRH
      secretion or its regulation, so the LH term is the most proximal available. The parent
      GO:0032278 positive regulation of gonadotropin secretion would also be true, and would
      cover the FSH response, but it is an ancestor of this row's term and is therefore not
      proposed as an additional annotation.
    additional_reference_ids:
    - PMID:16174713
    - PMID:22335740
    - PMID:15219839
    supported_by:
    - reference_id: PMID:16174713
      supporting_text: >-
        Kisspeptin-54 infusion significantly increased plasma LH, FSH, and testosterone
        concentrations compared with saline infusion
    - reference_id: PMID:22335740
      supporting_text: >-
        We describe an inactivating mutation in KISS1 in a large consanguineous family that
        results in failure of pubertal progression, indicating that functional kisspeptin is
        important for puberty and reproduction in humans.
    - reference_id: PMID:15219839
      supporting_text: >-
        This action was abolished by pretreatment with a GnRH antagonist, and was accompanied by
        induction of c-Fos immunoreactivity in GnRH neurons.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002704209
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Family node for the vertebrate KISS1 clade; the reproductive role is conserved and the
          human target has its own genetic and pharmacological evidence.
      - source_id: RGD:727850
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Rat Kiss1 carries IMP and IDA evidence for the same term; the rat gonadotropin response
          to metastin is GnRH-antagonist sensitive.
- term:
    id: GO:0045779
    label: negative regulation of bone resorption
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6Y4S4
  review:
    summary: >-
      Transferred by curator judgment from mouse Kiss1 (Q6Y4S4), where kisspeptin-10 acting on
      Gpr54 recruits SRC and the phosphatase DUSP18 to the receptor C-terminus, suppressing
      osteoclast differentiation and bone resorption, with confirmatory data in osteoclasts from
