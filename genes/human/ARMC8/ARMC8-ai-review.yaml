  - PANTHER:PTN000402070
  - SGD:S000001279
  review:
    summary: Proteasome-mediated ubiquitin-dependent protein catabolic process (IBA). The CTLH complex
      is an E3 ligase that ubiquitinates substrates for proteasomal degradation, including its own subunit
      muskelin. ARMC8 acts within it as a scaffold subunit, and ARMC8alpha also promotes proteasomal degradation
      of alpha-catenin. Accepted.
    action: ACCEPT
    reason: '[PMID:31285494 "The mammalian CTLH complex is an E3 ubiquitin ligase that targets its subunit
      muskelin for degradation."] [PMID:29911972 "Hpb1 protein turnover is regulated by the GID E3 ligase
      and biochemical evidence suggests that Hbp1 is directly ubiquitinated by the complex, which might
      contribute to the intermittent proliferation phenotype observed for GID-KO cell lines."] [PMID:35682545
      "In humans, the CTLH complex is named RanBP9 (also known as RanBPM; homologue of Gid1), GID8 (also
      known as TWA1; homologue of Gid8), and ARMC8 (similar to Gid5) act as the scaffold;"] [PMID:18215130
      "Proteasome-dependent degradation of alpha-catenin is regulated by interaction with ARMc8alpha."]'
    supported_by:
    - reference_id: PMID:31285494
      supporting_text: The mammalian CTLH complex is an E3 ubiquitin ligase that targets its subunit muskelin
        for degradation.
    - reference_id: PMID:29911972
      supporting_text: Hpb1 protein turnover is regulated by the GID E3 ligase and biochemical evidence
        suggests that Hbp1 is directly ubiquitinated by the complex, which might contribute to the intermittent
