    - reference_id: PMID:29911972
      supporting_text: To fill this gap, we initiated a series of systematic AP-MS experiments of HA-2xStrep
        (HSS) -tagged versions of the GID subunits Rmnd5a and Armc8 to examine the global interactome
        of the complex in HEK-293 cells.
    - reference_id: PMID:35682545
      supporting_text: In humans, the CTLH complex is named RanBP9 (also known as RanBPM; homologue of
        Gid1), GID8 (also known as TWA1; homologue of Gid8), and ARMC8 (similar to Gid5) act as the scaffold;
    - reference_id: PMID:35682545
      supporting_text: An important difference, however, is that two ARMC8 isoforms (α and β), instead
        of one Gid5 in yeast, associate with the human complex [10,22,23], but only the α isoform can
        bind GID4 [20].
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: No residue-level claim is propagated.
      source_entities:
      - source_id: PANTHER:PTN000402070
        source_status: SUPPORTS_TRANSFER
        comment: Node seeded by yeast Gid5/Vid28 (SGD:S000001279). Strict ARMC8-Gid5 orthology is disputed
          (PMID:30482882), but the two are structurally similar and occupy the same scaffold position
          (PMID:35682545). ARMC8 also has direct human evidence of CTLH membership (PMID:17467196, PMID:31285494),
          so the CC transfer holds.
