id: Q8IUR7
gene_symbol: ARMC8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC8 is an armadillo-repeat protein, made as alpha and beta isoforms, that is a core subunit
  of the CTLH complex, the mammalian counterpart of the yeast GID E3 ubiquitin ligase. With RANBP9 and
  GID8 it forms the complex's scaffold, structurally resembling yeast Gid5 although strict orthology is
  disputed. Only ARMC8alpha binds the substrate receptor GID4. The CTLH complex ubiquitinates substrates
  for proteasomal degradation, including its subunit muskelin and the glycolytic enzymes LDHA and PKM.
  ARMC8alpha also binds alpha-catenin and promotes its proteasomal degradation, and it co-localizes with
  the endosomal sorting protein HRS. ARMC8 is mainly cytoplasmic, with a nuclear pool.
