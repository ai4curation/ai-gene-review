  review:
    summary: GID complex (IBA). ARMC8 alpha and beta are core subunits of the human CTLH complex, the
      mammalian GID E3 ligase. ARMC8 is part of its scaffold with RANBP9 and GID8, and its alpha isoform
      binds the substrate receptor GID4. Core location.
    action: ACCEPT
    reason: '[PMID:17467196 "Here, we used tandem MS with an antibody against RanBPM to purify this complex
      from a soluble extract of HEK293 cells: we identified Muskelin, p48EMLP, p44CTLH, and the novel
      armadillo-repeat proteins ARMC8alpha and ARMC8beta as components."] [PMID:31285494 "We confirm that
      the complex immunoprecipitated from human cells comprises RanBPM, ARMC8 α/β, muskelin, WDR26, GID4
      and the RING domain proteins RMND5A and MAEA."] [PMID:29911972 "To fill this gap, we initiated a
      series of systematic AP-MS experiments of HA-2xStrep (HSS) -tagged versions of the GID subunits
      Rmnd5a and Armc8 to examine the global interactome of the complex in HEK-293 cells."] [PMID:35682545
      "In humans, the CTLH complex is named RanBP9 (also known as RanBPM; homologue of Gid1), GID8 (also
      known as TWA1; homologue of Gid8), and ARMC8 (similar to Gid5) act as the scaffold;"] [PMID:35682545
      "An important difference, however, is that two ARMC8 isoforms (α and β), instead of one Gid5 in
      yeast, associate with the human complex [10,22,23], but only the α isoform can bind GID4 [20]."]'
    supported_by:
    - reference_id: PMID:17467196
      supporting_text: 'Here, we used tandem MS with an antibody against RanBPM to purify this complex
        from a soluble extract of HEK293 cells: we identified Muskelin, p48EMLP, p44CTLH, and the novel
        armadillo-repeat proteins ARMC8alpha and ARMC8beta as components.'
    - reference_id: PMID:31285494
      supporting_text: We confirm that the complex immunoprecipitated from human cells comprises RanBPM,
