id: Q86WG3
gene_symbol: ATCAY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ATCAY (caytaxin, BNIP-H) is a neuron-restricted member of the BNIP-2 family. It has an N-terminal
  region carrying a kinesin light chain-binding ELEWED motif and a C-terminal CRAL-TRIO/BCH domain. It
  acts as a kinesin-1 cargo adaptor, moving along axons and dendrites to neurite terminals and growth
  cones. There it delivers metabolic enzymes for transmitter synthesis: it binds kidney-type glutaminase,
  relocating it from mitochondria and lowering glutamate production, and it links ATP citrate lyase to
  KLC1 and recruits choline acetyltransferase for local acetylcholine synthesis that promotes neurite
  outgrowth. It may also help position mitochondria in neurites. Caytaxin is ubiquitinated by CHIP, binds
  PIN1 after NGF stimulation, and is cleaved by caspase-3 at presynapses. Loss-of-function mutations cause
  recessive Cayman ataxia in humans and ataxia or dystonia in jittery, sidewinder and hesitant mice and
  the dystonic rat.'
