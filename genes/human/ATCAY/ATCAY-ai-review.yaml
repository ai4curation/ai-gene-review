  findings:
  - statement: CHIP polyubiquitinates caytaxin.
    supporting_text: CHIP e.g. was found to efficiently polyubiquitinate caytaxin in vitro, suggesting
      that it might influence caytaxin degradation in vivo.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; protein-array interaction screen.
  full_text_unavailable: true
- id: PMID:16899818
  title: Brain-specific BNIP-2-homology protein Caytaxin relocalises glutaminase to neurite terminals
    and reduces glutamate levels.
  findings:
  - statement: Caytaxin binds KGA directly and in a brain complex.
    supporting_text: Co-immunoprecipitation with specific BNIP-H antibody confirmed that endogenous BNIP-H
      and KGA form a physiological complex in the brain, whereas binding studies showed that they interact
      with each other directly.
  - statement: Caytaxin relocalizes KGA to neurite terminals and lowers glutamate.
    supporting_text: It also reduced the steady-state levels of glutamate by inhibiting KGA enzyme activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:18628984
  title: Nerve growth factor stimulates interaction of Cayman ataxia protein BNIP-H/Caytaxin with peptidyl-prolyl
    isomerase Pin1 in differentiating neurons.
  findings:
  - statement: NGF enhances caytaxin-PIN1 binding.
    supporting_text: We have characterized the interaction between BNIP-H and Pin1 in differentiating
      neurons and have further shown that NGF-stimulation of PC12 cells strongly enhanced their interaction
      via distinct binding motifs
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:19861499
  title: Cayman ataxia protein caytaxin is transported by kinesin along neurites through binding to kinesin
    light chains.
  findings:
  - statement: KLC1 binds caytaxin's ELEWED motif.
    supporting_text: The tetratricopeptide-repeat region of KLC1 recognizes the ELEWED sequence (amino
      acids 115-120) of caytaxin.
  - statement: Caytaxin is in axons and dendrites.
    supporting_text: In cultured hippocampal neurons, we found that caytaxin is distributed in both axons
      and dendrites in punctate patterns, and it colocalizes with microtubules and KHC.
  - statement: Caytaxin knockdown redistributes mitochondria.
    supporting_text: A part of caytaxin, however, colocalizes with mitochondria and suppression of caytaxin
      expression by RNAi redistributes mitochondria away from the distal ends of neurites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; rodent neurons.
  full_text_unavailable: true
