- term:
    id: GO:0062133
    label: negative regulation of L-glutamine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:16899818
  qualifier: involved_in
  review:
    summary: Negative regulation of L-glutamine biosynthetic process (IDA). The finding is that caytaxin
      inhibits kidney-type glutaminase, which converts glutamine to glutamate, and so lowers glutamate.
      That is negative regulation of glutamate production, not of glutamine synthesis, which is catalysed
      by glutamine synthetase. The term direction appears inverted; negative regulation of L-glutamate
      biosynthetic process states the result.
    action: MODIFY
    reason: '[PMID:16899818 "KGA converts glutamine to glutamate, which could serve as an important source
      of neurotransmitter."] [PMID:16899818 "It also reduced the steady-state levels of glutamate by inhibiting
      KGA enzyme activity."]'
    proposed_replacement_terms:
    - id: GO:0140387
      label: negative regulation of L-glutamate biosynthetic process
    supported_by:
    - reference_id: PMID:16899818
      supporting_text: KGA converts glutamine to glutamate, which could serve as an important source of
        neurotransmitter.
    - reference_id: PMID:16899818
      supporting_text: It also reduced the steady-state levels of glutamate by inhibiting KGA enzyme activity.
