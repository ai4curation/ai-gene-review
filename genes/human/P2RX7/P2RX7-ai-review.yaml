    reason: P2X7 is a two-transmembrane cell-surface receptor. Its C-terminal ballast is cytoplasmic,
      and the protein is of course synthesised and trafficked through intracellular compartments,
      but located_in cytoplasm is not a useful or defensible statement of where this receptor is
      or acts, and it conflicts with the plasma-membrane annotations that the rest of the set agrees
      on.
