core_functions:
- description: P2X7 is a homotrimeric, ATP-gated non-selective cation channel of the plasma membrane.
    Extracellular ATP binds at the interfaces between subunit ectodomains and opens an integral cation-conducting
    pore; sodium and calcium enter and potassium leaves, depolarising the membrane and raising cytosolic
    calcium. Unlike the other P2X receptors it requires high agonist concentrations and does not
    desensitise, which suits it to reading ATP released by damaged or stressed cells. The activity
    is recorded as enabled rather than contributed to because the homotrimer is sufficient - no accessory
    subunit is required - and the assertion is supported by recordings from the human protein, by
    single-channel analysis and by full-length structures.
  molecular_function:
    id: GO:0004931
    label: extracellularly ATP-gated monoatomic cation channel activity
  directly_involved_in:
  - id: GO:0035590
    label: purinergic nucleotide receptor signaling pathway
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  - id: GO:0070588
    label: calcium ion transmembrane transport
  - id: GO:0071805
    label: potassium ion transmembrane transport
  - id: GO:0051899
    label: membrane depolarization
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9038151
    supporting_text: Brief applications (1-3 s) of ATP and 2', 3'-(4-benzoyl)-benzoyl-ATP elicited
      cation-selective currents.
  - reference_id: PMID:31587896
    supporting_text: P2X receptors are trimeric, non-selective cation channels activated by extracellular
      ATP.
  - reference_id: PMID:17483156
    supporting_text: Substitution of extracellular Na(+) by any other alkali or organic cation drastically
      increased the open probability of the channels by prolonging the mean open time.
- description: Through that channel activity P2X7 provides the second signal of the canonical two-signal
    NLRP3 pathway. Potassium efflux through the open receptor lowers cytosolic potassium, licensing
    NLRP3 inflammasome assembly, caspase-1 processing and release of mature interleukin-1 beta. This
    is the receptor's best-established physiological output, shown in macrophages and in primary
    human mononuclear cells and blocked by P2X7 antagonists. It is a separate core function from
    the channel activity because it is what the channel is for in the myeloid cells that express
    it most highly, but the receptor is upstream in it - the pore through which interleukin-1 beta
    and dyes pass has been assigned to pannexin-1 rather than to P2X7.
  molecular_function:
    id: GO:0001614
    label: purinergic nucleotide receptor activity
  directly_involved_in:
  - id: GO:1900227
