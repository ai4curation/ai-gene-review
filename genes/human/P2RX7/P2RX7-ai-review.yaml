- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: Assertion that P2X7 binds lipopolysaccharide, transferred by orthology and by curator
      sequence-similarity judgement.
    action: MARK_AS_OVER_ANNOTATED
    reason: This traces to a putative LPS-binding motif identified in the rodent P2X7 C-terminal
      tail, not to a structurally resolved binding site; the full-length P2X7 structures assign that
      region to the C-cys anchor and the cytoplasmic ballast, with no LPS site. Biologically, P2X7
      sits downstream of LPS in the inflammasome pathway as the ATP sensor providing signal 2, while
      TLR4 is the LPS receptor providing signal 1. Annotating P2X7 as an LPS binder conflates the
      two signals of a two-signal pathway.
