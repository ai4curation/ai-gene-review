proposed_new_terms:
- proposed_name: positive regulation of plasma membrane phospholipid scrambling
  proposed_definition: Any process that activates or increases the frequency, rate or extent of plasma
    membrane phospholipid scrambling.
  justification: 'GO has plasma membrane phospholipid scrambling (GO:0017121) and calcium activated
    phospholipid scrambling (GO:0061588) but no regulation terms beneath either. This leaves no way
    to distinguish the protein that translocates the lipids from the protein that switches it on.
    P2X7 is the clearest case: the paper behind its GO:0017121 annotation shows that P2X7 activation
    raises cytosolic calcium which activates ANO6/TMEM16F, and that knocking down ANO6 abolishes
    the scrambling while P2X7 is intact. Annotating both proteins to the same involved_in term erases
    the causal direction. The same gap affects TMC1, where hair cells require TMC1 or TMC2 for phosphatidylserine
    externalisation but the authors explicitly decline to say the TMCs perform the translocation.'
  proposed_parent:
    id: GO:0017121
    label: plasma membrane phospholipid scrambling
suggested_questions:
- question: Do neurons express functional P2X7? This is the central unresolved question and it is
    a question about cell type, not about molecular function. A 2026 review argues the evidence fails
    on antibody specificity and on the pharmacological regimen needed to demonstrate functional expression,
    while cell-type-specific P2rx7 deletion produces opposite seizure phenotypes in neurons and microglia,
    human single-cell data place P2RX7 transcripts in hippocampal neurons in temporal lobe epilepsy,
    and two 2026 primary papers proceed as if the matter were settled. What would settle it is an
    epitope-tagged knock-in reporter allele read out at single-cell resolution in adult brain, alongside
    patch-clamp of identified neurons with the full antagonist panel.
- question: Should the neuronal cellular-component and process annotations be kept at all? GO:0060079
    excitatory postsynaptic potential and GO:0098794 postsynapse on human P2RX7 are inter-ontology
    logical inferences chained from the molecular function GO:0004931, with no neuron-specific evidence
    anywhere in the chain. GO:0043025 neuronal cell body, GO:0045202 synapse and GO:0031594 neuromuscular
    junction do rest on experimental mouse annotations, but those are exactly the antibody-based
    studies the 2026 review questions. These two groups should probably be handled differently from
    each other.
- question: What was corrected in the 2025 corrigendum (PMID:40713463) to the cell-type-specific
    seizure study (PMID:38777288)? That study is one of the strongest pieces of evidence for functional
    neuronal P2X7, and the content of its correction could not be retrieved from PubMed, Europe PMC,
    the DOI resolver or the publisher. Anyone relying on it should read the corrigendum first.
- question: Does the P2X7 pore itself dilate, or is the large-solute permeability pannexin-1? The
    human cloning paper recorded dye uptake after prolonged agonist exposure; single-channel analysis
    of the same receptor found no change in permeation properties over more than a minute of ATP
    exposure; and the dye-uptake pathway was subsequently identified as pannexin-1. GOA carries pore
    complex assembly for P2X7 with three independent lines of evidence, so the annotation set records
    the phenotype without resolving the mechanism.
- question: Should GO:0017121 on P2X7 be replaced by a positive-regulation term? The scramblase is
    ANO6; P2X7 supplies the calcium. GO currently offers no regulation child under GO:0017121, so
    upstream trigger and downstream executor are annotated identically.
- question: Is the lipopolysaccharide binding annotation defensible? It derives from a putative LPS-binding
    motif in the rodent C-terminal tail, a region the full-length structures assign to the C-cys
    anchor and cytoplasmic ballast. Since P2X7 is the signal-2 ATP sensor in a pathway whose signal-1
    LPS receptor is TLR4, this annotation risks collapsing a two-signal pathway into one.
suggested_experiments:
- description: Generate a knock-in P2rx7 allele carrying a small epitope tag and a fluorescent reporter
    at the endogenous locus, and quantify expression by single-cell sequencing and by tag-based imaging
    across neuronal, microglial, astrocytic and oligodendrocyte populations in adult brain under
    basal conditions and after a seizure or inflammatory challenge. This removes the antibody-specificity
    objection that the 2026 review identifies as the crux, and separates constitutive neuronal expression
    from expression induced by pathology.
- description: In acute slices from that reporter line, patch-clamp identified reporter-positive
    neurons and reporter-negative neurons side by side and apply BzATP with and without the full
    panel of structurally unrelated P2X7 antagonists, using the concentration ranges the review specifies.
    A current that is present only in reporter-positive cells and blocked by every antagonist would
    settle the functional question; its absence would show that transcript detection does not imply
    a functional receptor.
- description: Reconstitute purified human P2X7 into proteoliposomes with and without pannexin-1
    and measure both small-cation current and permeability to YO-PRO-1 during sustained ATP exposure.
    If large-solute permeability appears only when pannexin-1 is present, the pore complex assembly
    annotations on P2X7 should become regulatory rather than direct.
- description: Test the lipopolysaccharide binding claim directly on the purified full-length human
    protein by isothermal titration calorimetry or surface plasmon resonance, and in parallel ask
    whether a C-terminal truncation that removes the putative motif alters LPS responses in P2X7-expressing
    macrophages that retain TLR4. A negative result would justify removing GO:0001530.
- description: In macrophages, separate the P2X7 and ANO6 contributions to phosphatidylserine exposure
    by expressing a calcium-impermeable P2X7 pore mutant that still conducts sodium, and by rescuing
    Ano6-null cells with a scrambling-dead ANO6. This would confirm that P2X7 acts only as the calcium
    source and support replacing the scrambling annotation with a regulation term.
