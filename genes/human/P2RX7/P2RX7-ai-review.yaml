  review:
    summary: Neuronal cell body localisation, transferred by orthology from two experimental mouse
      studies.
    action: KEEP_AS_NON_CORE
    reason: 'Recorded as non-core because the cellular setting is disputed. P2X7 expression is uncontested
      in myeloid cells, and a 2026 Neuropharmacology review states that neuronal expression is the
      most controversial claim in the field, turning on antibody specificity and on the pharmacological
      regimen used to demonstrate functional expression. Against that, cell-type-specific P2rx7 deletion
      in neurons changes the seizure phenotype in the opposite direction to microglial deletion,
      human single-cell data show P2RX7 in hippocampal neurons in temporal lobe epilepsy, and two
      2026 papers treat neuronal P2rx7 as established. Note that what is disputed is which cells
      express the receptor, not what the protein does: its molecular function as an ATP-gated cation
      channel is not in question.'
    supported_by:
    - reference_id: PMID:41672132
      supporting_text: The most controversial, however, is the presence and role of P2X7R in neurons.
    - reference_id: PMID:38777288
      supporting_text: Analysis of single-cell expression data revealed that human P2RX7 expression
        is elevated in the hippocampus of patients with temporal lobe epilepsy in excitatory and
        inhibitory neurons.
    - reference_id: PMID:38777288
      supporting_text: In contrast, mice lacking P2rx7 in neurons showed a more severe seizure phenotype
        when compared to epileptic wild-type mice.
