id: O43895
gene_symbol: XPNPEP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: XPNPEP2 encodes the likely GPI-anchored membrane member of the M24B
  Xaa-Pro aminopeptidase family. The mature ectoenzyme acts at the plasma membrane
  and hydrolyzes the N-terminal residue of peptides that contain proline in the
  second position, including bradykinin-like kinin substrates. It is the human
  membrane-bound aminopeptidase P paralog of the soluble cytosolic XPNPEP1
  enzyme.
