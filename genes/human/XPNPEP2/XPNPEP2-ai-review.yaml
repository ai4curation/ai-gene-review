- term:
    id: GO:0010815
    label: bradykinin catabolic process
  evidence_type: IDA
  original_reference_id: PMID:15361070
  qualifier: involved_in
  review:
    summary: XPNPEP2 directly cleaves kinin substrates such as bradykinin.
    action: NEW
    reason: Recombinant soluble human XPNPEP2 hydrolyzes internally quenched
      peptides modeled on the natural kinin substrates bradykinin and bradykinin
      1-8. Because the enzyme itself cleaves the bradykinin X-Pro bond, this is a
      direct peptide-catabolic role and not a downstream phenotype.
    supported_by:
