suggested_questions:
- question: Which endogenous extracellular peptides are the dominant XPNPEP2 substrates
    in human kidney, lung, and vascular beds?
- question: Does the mature human XPNPEP2 ectoenzyme use a Zn(2+) cofactor, and
    has the inferred GPI anchor been directly verified in human cells?
suggested_experiments:
- description: Compare bradykinin, substance P, and broader extracellular Xaa-Pro
    peptide turnover in primary XPNPEP2-positive endothelial or renal epithelial
    cultures before and after endogenous XPNPEP2 knockout or GPI-anchor release.
