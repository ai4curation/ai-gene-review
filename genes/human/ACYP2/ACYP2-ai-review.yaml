proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    Which acyl-phosphate substrate accounts for the main ACYP2-dependent flux
    in human muscle, heart and neuronal cells remains unresolved.
  boundary: >-
    Recombinant human ACYP2 has native-like benzoylphosphate activity, and
    heart-muscle acylphosphatase hydrolyzes cardiac sarcoplasmic-reticulum
    Ca2+-ATPase phosphoenzyme at physiological enzyme concentrations.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Resolving the cellular substrate will determine whether ACYP2 mainly tunes
    Ca2+ pump phosphoenzyme turnover, glycolytic acyl-phosphate pools or
    another pathway in the tissues where the muscle isozyme is expressed.
  resolution: >-
    Compare ACYP2-deficient and rescue muscle or neuronal cells for candidate
    acyl-phosphate pools and for SERCA phosphoenzyme turnover, and test
    whether the same rescue variants restore each readout.
  provenance:
  - reference_id: PMID:16511269
    supporting_text: The biological role of acylphosphatase is not fully understood.
suggested_questions:
- question: >-
    In ACYP2-expressing muscle, heart and neuronal cells, does loss of ACYP2
    primarily affect SERCA phosphoenzyme turnover, glycolytic
    1,3-bisphosphoglycerate flux or another carboxyl-phosphate substrate?
suggested_experiments:
- description: >-
    Quantify candidate acyl-phosphate intermediates and SERCA
    phosphoenzyme-turnover kinetics in ACYP2 knockout skeletal-muscle,
    cardiomyocyte and neuronal cells rescued with wild-type ACYP2 or variants
    of the UniProt-annotated active-site residues 24 and 42.
status: COMPLETE
