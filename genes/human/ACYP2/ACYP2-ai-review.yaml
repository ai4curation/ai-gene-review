suggested_questions:
- question: >-
    Which cellular acyl-phosphate substrates and pathways are materially
    controlled by ACYP2, and does the high-throughput mitochondrial pool
    contribute to any of them?
suggested_experiments:
- description: >-
    Quantify candidate acyl-phosphate intermediates in skeletal-muscle and
    neuronal ACYP2 knockout cells rescued with wild-type or catalytically
    impaired ACYP2, and fractionate the cells to test whether any effect tracks
    with the mitochondrial pool.
