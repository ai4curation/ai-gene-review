description: >-
  ACYP2 is the muscle-type isozyme of acylphosphatase, a 99-residue soluble
  enzyme that hydrolyzes carboxyl-phosphate bonds in acyl phosphates. It shares
  the ancient EC 3.6.1.7 chemistry with ACYP1, is readily active as a
  recombinant enzyme, has been connected to cardiac sarcoplasmic-reticulum
  Ca2+-ATPase phosphoenzyme turnover, and has also been used as an in-vitro
  model for amyloid aggregation.
