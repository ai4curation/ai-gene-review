  review:
    summary: ACYP2 has high-throughput mitochondrial-proteome evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Morgenstern et al. defined a stringent MitoCoP set from subtractive
      proteomics, spatial proteomics, importomics and curation. The GOA row
      places ACYP2 in the mitochondrion from that high-throughput study; keep
      the direct root-organelle location as a peripheral ACYP2 context because
      the known catalytic activity is not established as mitochondrial. The
      GOA row is unexpectedly assigned by FlyBase for a human protein and the
      cached main text does not identify ACYP2 itself, so the row would merit
      a source-level check against the MitoCoP supplementary table if a future
      review reads the complete dataset.
