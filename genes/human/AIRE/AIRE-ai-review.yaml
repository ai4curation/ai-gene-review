- term:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      AIRE binds regulatory DNA motifs in vitro; native target choice has a different evidential scope.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT IBD includes the human experimental annotation. PMID:11533054 used refolded recombinant
      human AIRE and synthetic EGR consensus, mutant competitor and selected ATTGGTTA/TTATTA oligonucleotides.
      Positive motif discrimination is real, and consensus regulatory DNA provides a defensible biochemical
      scope for the curated term. Retain this binding capacity as non-core: these assays do not identify
      the physiological AIRE target promoters or establish that sequence recognition drives thymic targeting.
      PMID:15649436 independently maps motif-binding regions; chromatin recruitment studies and the newer
      enhancer-condensate model establish additional targeting mechanisms, not a negative replication
      of the original EMSA.
    additional_reference_ids:
    - PMID:11533054
    - PMID:15649436
    - PMID:22310661
    - PMID:39169234
    supported_by:
    - reference_id: PMID:11533054
      supporting_text: >-
        AIRE dimers and tetramers, but not the monomers, can bind to G-doublets with the ATTGGTTA motif
        and the TTATTA-box.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN005329562
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human experimental motif-binding evidence grounds this IBD; retain its biochemical capacity
