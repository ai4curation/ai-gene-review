- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: The recovered logical inference depends on a family MF whose functional basis remains unresolved.
    action: UNDECIDED
    reason: >-
      The GO_REF:0000108 source is GO:0045182, whose definition places it within regulation of translation.
      The local InterPro2GO snapshot (rules/arba/_interpro2go.txt, version 2025/09/01) explicitly assigns
      GO:0045182 to the AIRE entry IPR008087. The entry-to-term mapping is therefore recovered; its flat
      record contains no member-specific experiment or primary-evidence citation. GO:0045182 concerns
      regulation of polypeptide synthesis at the ribosome. The inspected AIRE transcription and
      pre-mRNA-processing studies establish different mechanisms, without testing or refuting a separate
      translation-regulatory capacity. A verified entry-level assignment alone does not resolve that
      biological scope. Retain UNDECIDED for the unresolved functional basis, not because the mapping
      file is inaccessible and not as deference to an experimental GOA row. Neither a demonstrated
      translation mechanism nor target-specific divergence from such a mechanism is established here.
    additional_reference_ids:
    - PMID:11274163
    - PMID:20085707
    supported_by:
    - reference_id: PMID:11274163
      supporting_text: >-
        we show that AIRE can activate the interferon beta minimal promoter in a transfection assay
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: GO:0045182
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The source MF is explicitly assigned to IPR008087 in the local InterPro2GO file. GO:0045182 is
          part_of regulation of translation; the logical inference is traceable, while the AIRE functional
          basis of its input remains unresolved.
