- term:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:11533054
  qualifier: enables
  review:
    summary: Recombinant human AIRE binds regulatory DNA motifs in vitro.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMID:11533054 used refolded recombinant human AIRE and synthetic EGR consensus, mutant competitor
      and selected ATTGGTTA/TTATTA oligonucleotides. Positive motif discrimination is real, and consensus
      regulatory DNA provides a defensible biochemical scope for the curated term. Retain this binding
      capacity as non-core: these assays do not identify the physiological AIRE target promoters or establish
      that sequence recognition drives thymic targeting. PMID:15649436 independently maps motif-binding
      regions; chromatin recruitment studies and the newer enhancer-condensate model establish additional
      targeting mechanisms, not a negative replication of the original EMSA.
