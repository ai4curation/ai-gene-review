core_functions:
- description: >-
    AIRE binds histone H3K4me0 through its zinc-stabilized PHD1 domain and self-associates through CARD
    to organize nuclear transcriptional assemblies. C-terminal coactivator recruitment coordinates this
    chromatin engagement with activation of self-antigen genes, supporting central tolerance and negative
    selection of autoreactive thymocytes.
  molecular_function:
    id: GO:0042393
    label: histone binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0002509
    label: central tolerance induction to self antigen
  - id: GO:0045060
    label: negative thymic T cell selection
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0016604
    label: nuclear body
  supported_by:
  - reference_id: PMID:18292755
    supporting_text: >-
      we show that AIRE selectively interacts with histone H3 through its first plant homeodomain (PHD)
      finger (AIRE-PHD1) and preferentially binds to non-methylated H3K4 (H3K4me0).
  - reference_id: PMID:19446523
    supporting_text: >-
      Here we report the three-dimensional solution structure of the first PHD finger of human AIRE bound
      to a histone H3 peptide.
  - reference_id: PMID:15712268
    supporting_text: >-
      With the two-hybrid assay in the yeast system we found that constructs containing the two mutations
      fail to interact with the wild-type protein.
  - reference_id: PMID:39169234
    supporting_text: >-
      Specifically, CTT binds coactivators CBP/p300, recruiting Aire to CBP/p300-rich enhancers and promoting
      CARD-mediated condensate assembly.
  - reference_id: PMID:26084028
    supporting_text: >-
      The autoimmune regulator (AIRE) gene is crucial for establishing central immunological tolerance
      and preventing autoimmunity.
  knowledge_gaps:
  - gap_statement: How do the in-vitro DNA motif-binding properties contribute to target selection
      in native human medullary thymic epithelial cells?
  - gap_statement: The coordinated PHD1/CARD/CTT model includes human thymic epithelial cell
      experiments and selected mouse-domain biochemical experiments; the full architecture of
      endogenous human assemblies remains to be resolved.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which native human AIRE targets, if any, require the sequence-selective DNA binding measured with
    recombinant AIRE, as distinct from histone and coactivator recruitment?
- question: >-
    What primary evidence underlies the IPR008087 translation-regulator mapping, and does it measure ribosomal
    translation rather than transcription or pre-mRNA processing?
- question: >-
    Which endogenous AIRE-dependent molecular step establishes peripheral T-cell tolerance in the mouse
    donor annotation, beyond marking a tolerogenic antigen-presenting cell population?
- question: >-
    Can the positive AIRE/PHD1 ubiquitin-transfer results in PMID:14734522 be reconciled with the negative
    biochemical/E2-binding results in PMID:15649886 using matched constructs, preparations and reaction
    conditions?
suggested_experiments:
- hypothesis: >-
    Differences in AIRE constructs, preparation or assay conditions explain the conflicting E3-ligase
    results.
  description: >-
    Compare full-length human AIRE and isolated PHD1 from independently purified preparations in matched
    E1/E2/ubiquitin reactions with folding and positive-enzyme controls. Distinguish covalent substrate
    modification from nonspecific ubiquitin chains and test reproducibility before assigning physiological
    E3 activity.
  experiment_type: Reconstituted ubiquitination and preparation-comparison assay
