id: O43918
gene_symbol: AIRE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AIRE is a nuclear transcriptional regulator that promotes expression of tissue-restricted self-antigens
  in medullary thymic epithelial cells, enabling central immune tolerance. Its PHD1 zinc finger recognizes
  histone H3 with unmethylated lysine 4, its CARD/HSR region mediates self-assembly, and its C-terminal
  region recruits transcriptional coactivators. Coordinated chromatin engagement and assembly support
  transcriptionally active nuclear condensates and target-gene expression. Human AIRE also has a documented
  cytoplasmic, microtubule-associated pool. Disruptive or dominant-negative variants impair the tolerance
  program and cause autoimmune polyendocrine syndrome type 1 or related organ-specific autoimmunity.
