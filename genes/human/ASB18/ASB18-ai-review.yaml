id: Q6ZVZ8
gene_symbol: ASB18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB18 is an ankyrin repeat and SOCS box protein of the ASB family, with six ankyrin repeats
  and a C-terminal SOCS box. ASB proteins tested in a family survey all bound Cullin 5-RBX2 through conserved
  BC-box and Cul5-box motifs in the SOCS box. By homology to characterized family members such as ASB7,
  it is predicted to act as the substrate-recognition subunit of an Elongin B/C-Cullin 5 E3 ubiquitin
  ligase that targets proteins for proteasomal degradation. No substrate or cellular role has been established
  for ASB18.
