    CRL5 ligase has not been tested.
  boundary: 'Established: ASB-family architecture (six ankyrin repeats, C-terminal SOCS box) and an IBA
    transfer of CRL5 substrate-receptor activity from ASB7. Not established: any ASB18 substrate, partner
    beyond screen hits, localization or phenotype.'
