suggested_questions:
- question: Does ASB18 assemble with CUL5, ELOB/ELOC and RBX2, and which proteins does it target for degradation?
suggested_experiments:
- description: Co-purify ASB18 with CRL5 components and identify substrates by ubiquitin-remnant proteomics
    after ASB18 overexpression versus a SOCS-box deletion mutant.
