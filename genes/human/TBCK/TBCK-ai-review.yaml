id: Q8TEA7
gene_symbol: TBCK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Multidomain peripheral protein of early endosomes, built from an N-terminal pseudokinase domain,
  a central Tre2-Bub2-Cdc16 (TBC) domain and a C-terminal rhodanese-like domain. Despite its name,
  TBCK is not a protein kinase: the kinase-fold domain lacks the glycine-rich loop and the VAIK, HRD
  and DFG motifs, purified full-length human protein binds neither ATP nor GTP and hydrolyses neither,
  placing it among the class I pseudokinases. The catalytically competent module is the TBC domain,
  which retains the arginine and glutamine fingers of Rab GTPase-activating proteins; TBCK is the
  catalytic core of a heterotrimer with PPP1R21 and FERRY3 that acts as a GTPase-activating protein
  for RAB5, and its loss leaves RAB5 constitutively GTP-loaded, enlarges early endosomes and blocks
  their conversion to late endosomes. TBCK is also one of the five subunits of the FERRY complex, a
  RAB5A effector that tethers mRNAs and ribosomes to early endosomes, although the mRNA contacts are
  made by other subunits. Reported effects of TBCK depletion on mTOR signalling, cell size, proliferation
  and actin organisation are not consistently reproduced across cell types and remain disputed. Biallelic
  loss-of-function variants cause TBCK encephaloneuronopathy (infantile hypotonia with psychomotor
  retardation and characteristic facies 3), a severe autosomal recessive neurodevelopmental and
  neurodegenerative disorder.
