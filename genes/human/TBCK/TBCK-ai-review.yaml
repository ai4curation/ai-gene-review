- id: PMID:12471243
  title: The protein kinase complement of the human genome.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Science 2002;298:1912-34). The paper is sound and is correctly cited as the source
      of TBCK's placement in the human kinome, but it is a sequence-based census, not a functional study,
      and cannot support an assertion that TBCK enables protein kinase activity. It does support the
      accompanying NOT protein phosphorylation row insofar as kinome membership was never a catalytic claim.
- id: PMID:23977024
  title: TBCK influences cell proliferation, cell size and mTOR signaling pathway.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified (PLoS One 2013). Correctly cited, but its central mTOR claim has not reproduced in
      human neural progenitors or consistently across patient-derived cells, and the proliferation, cell-size
      and actin phenotypes are siRNA knockdown readouts several steps from any molecular activity of TBCK.
- id: PMID:24576458
  title: A long type of TBCK is a novel cytoplasmic and mitotic apparatus-associated protein likely suppressing
    cell proliferation.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified as an identifier (J Genet Genomics 2014;41:69-72), but PubMed carries no abstract
      and no full text is available in the cache, so the spindle and midbody localisations sourced from it
      could not be assessed. They are retained as non-core on that basis.
- id: PMID:26496610
  title: A human interactome in three quantitative dimensions organized by stoichiometries and abundances.
- id: PMID:27040692
  title: Recessive Inactivating Mutations in TBCK, Encoding a Rab GTPase-Activating Protein, Cause Severe
    Infantile Syndromic Encephalopathy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Am J Hum Genet 2016;98:772-81). Establishes TBCK as a disease gene and, through
      structural modelling of the p.Arg511His allele, anticipates the Rab-GAP function later demonstrated
      biochemically. The GAP function was a prediction here, not a measurement, which is stated in the paper.
- id: PMID:37267905
  title: The Rab5 effector FERRY links early endosomes with mRNA localization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Mol Cell 2023). Establishes TBCK as a FERRY subunit and the complex as a Rab5
      effector on early endosomes. Cached entry is abstract-only.
- id: PMID:37267906
  title: Structural basis of mRNA binding by the human FERRY Rab5 effector complex.
- id: PMID:39553985
  title: 'A Novel Human TBCK- Neuronal Cell Model Results in Severe Neurodegeneration and Partial Rescue
    with Mitochondrial Fission Inhibition.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as a bioRxiv preprint (2024). Cited only for the negative mTORC1 result, which is
      the counterweight to PMID:23977024. Preprint status is why the TOR annotation is demoted rather than
      removed.
- id: PMID:41207833
  title: 'TBCK syndrome pathogenesis: the TBCK-PPP1R21-C12orf4 complex regulating RAB5-dependent endo-lysosomal
    homeostasis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifier verified against PubMed (Sci Bull (Beijing) 2026;71(6):1317-1321, epub 2025 Oct 25, Wang et al., Fudan). This is the primary
      report of the RAB5-GAP activity, but PubMed carries no abstract for it and no full text was retrievable,
      so its content is known here only through the same authors' Autophagy punctum (PMID:41789809). Cited
      for provenance; the quotations used are taken from the punctum, not from this paper.
- id: PMID:41789809
  title: 'The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Autophagy 2026;22:1142-4). An Autophagy punctum written by the authors of the primary
      study it summarises, so it is a secondary account rather than independent corroboration; that is why
      the GAP function is stated here as established by one group rather than as consensus.
- id: PMID:41958985
  title: Human TBC1 domain-containing kinase is a class I multidomain pseudokinase.
  publication_type: PREPRINT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as the bioRxiv preprint (2026) of PMID:42546825 - same title, same authors, and PubMed
      links it as "Update in". It is listed for completeness but must not be counted as a second, independent
      demonstration that TBCK is a pseudokinase.
- id: PMID:42546825
  title: Human TBC1 domain-containing kinase is a class I multidomain pseudokinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Protein Expr Purif 2026;243:106989, PMC13502288). The load-bearing reference for
      removing the kinase and ATP-binding annotations. Soundness caveat recorded rather than hidden: a single
      laboratory, a methods-oriented journal, and negative results (no nucleotide binding, no ATPase) that are
      intrinsically harder to establish than positive ones - though the assays carry an appropriate positive
      control and the conclusion agrees with independent sequence analysis and with UniProt's own annotation.
