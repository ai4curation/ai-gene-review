core_functions:
- molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  description: >-
    TBCK is the catalytic subunit of a Rab GTPase-activating module that acts on RAB5 at the early
    endosome. Its TBC domain retains the arginine and glutamine fingers that TBC-family GAPs insert
    into the GTPase active site, and the recurrent pathogenic missense allele p.Arg511His replaces the
    arginine finger. Acting with PPP1R21 and FERRY3, TBCK stimulates GTP hydrolysis on RAB5 and thereby
    limits RAB5 residence on early endosomes; without it RAB5 stays GTP-loaded, early endosomes swell
    and their conversion to late endosomes is blocked. TBCK is also a subunit of the wider five-protein
    FERRY complex, a RAB5A effector that tethers mRNA and ribosomes to early endosomes, but TBCK itself
    makes no mRNA contacts. The pseudokinase and rhodanese-like domains that flank the TBC domain are
    both catalytically dead.
  directly_involved_in:
  - id: GO:0090630
    label: activation of GTPase activity
  - id: GO:0045022
    label: early endosome to late endosome transport
  locations:
  - id: GO:0005769
    label: early endosome
  in_complex:
    id: GO:0160271
    label: FERRY complex
  supported_by:
  - reference_id: PMID:41789809
    supporting_text: This complex functions as a specific GTPase-activating protein (GAP) for RAB5.
  - reference_id: PMID:41789809
    supporting_text: TBCK deficiency or missense mutations of its key residues in the RABGAP-TBC domain
      lead to constitutive RAB5 hyperactivation, which blocks the transition from early to late endosomes
      and results in the formation of massively enlarged RAB5-positive endosomes.
  - reference_id: PMID:42546825
    supporting_text: The TBC domain of TBCK retains conserved arginine and glutamine residues characteristic
      of GTPase-activating proteins (GAPs), suggesting that TBCK may function as a GAP toward small GTPases
  - reference_id: PMID:27040692
    supporting_text: These results suggest that loss of Rab-GAP activity is the underlying mechanism of disease.
  knowledge_gaps:
  - gap_statement: >-
      What the pseudokinase domain does is entirely unknown. It is now established to be catalytically
      dead and to bind no nucleotide, which removes the only function ever ascribed to it, and nothing
      has replaced that function: no ligand, no binding partner, no allosteric role and no regulatory
      input to the adjacent TBC domain has been described. The same is true of the C-terminal
      rhodanese-like domain, which is predicted to lack its active-site motif and has never been assayed.
    boundary: >-
      What is firm is the negative result and the domain architecture. Full-length human TBCK purifies
      as a monomer of predominantly alpha-helical secondary structure, the pseudokinase domain lacks the
      glycine-rich loop, VAIK, HRD and DFG motifs, no nucleotide shifts its melting temperature, and it
      hydrolyses neither ATP nor GTP. The AlphaFold model still shows a sizeable cavity in the pseudokinase
      region, and pathogenic variants are distributed across the whole protein, not only the TBC domain.
      What is missing is any positive account of what two thirds of the protein are for.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Class I pseudokinases typically work as allosteric switches or scaffolds, so the most likely role
      for TBCK's pseudokinase domain is to regulate or localise the GAP activity that sits next to it.
      Since disease alleles are not confined to the TBC domain, a mechanism for the non-TBC domains is
      needed before genotype-phenotype interpretation in TBCK encephaloneuronopathy can be put on a
      mechanistic footing.
    resolution: >-
      Comparative assays of isolated TBC domain versus full-length protein for RAB5 GAP activity, to test
      whether the pseudokinase domain is autoinhibitory or activating; and an unbiased interaction screen
      against the isolated pseudokinase and rhodanese-like domains.
    provenance:
    - reference_id: PMID:42546825
      supporting_text: The precise roles of the TBC and rhodanese-like domains remain to be defined.
    - reference_id: PMID:42546825
      supporting_text: the rhodanese-like domain is predicted to be catalytically inactive, as it lacks
        the conserved CX4-5R active-site motif found in enzymatically active rhodanese family members
suggested_questions:
- question: >-
    Should GO:0004672 protein kinase activity and GO:0005524 ATP binding be retired for TBCK on the
    strength of a single laboratory's in vitro characterisation of the recombinant protein, or should
    they be held pending independent replication? The result agrees with sequence analysis and with
    UniProt's own inactivity prediction, but the peer-reviewed paper and the bioRxiv preprint are the
    same work by the same authors.
  experts:
  - Wenjie Zhu
  - Shivangi Maurya
- question: >-
    Is the mTOR phenotype of TBCK loss a direct regulatory role or a downstream consequence of blocked
    endosome maturation? The original knockdown study reported reduced mTORC subunit levels, a human
    neural-progenitor model found no mTORC1 inhibition, and the RAB5-GAP account predicts an indirect,
    cell-type-dependent effect.
  experts:
  - Elizabeth J K Bhoj
  - Chenji Wang
- question: >-
    Does the pseudokinase domain retain a ligand or a partner, and does it regulate the adjacent TBC
    domain? Nucleotide binding is excluded, but the AlphaFold model retains a cavity and disease alleles
    fall outside the TBC domain.
  experts:
  - Wenjie Zhu
- question: >-
    Within the FERRY complex, is the RAB5-GAP activity of the TBCK-PPP1R21-FERRY3 heterotrimer compatible
    with FERRY acting as a RAB5A effector, or do these represent two distinct assemblies with opposite
    effects on RAB5? A single protein that both binds active RAB5 as part of an effector and stimulates
    its hydrolysis needs a timing model.
  experts:
  - Marino Zerial
  - Jan S Schuhmacher
suggested_experiments:
- hypothesis: >-
    The pseudokinase domain is an autoinhibitory or targeting module for the TBC domain rather than a
    vestigial remnant.
  description: >-
    Reconstitute RAB5 GAP assays with purified full-length TBCK, the isolated TBC domain, and
    pseudokinase-domain-deleted protein, each with and without PPP1R21 and FERRY3, measuring single-turnover
    GTP hydrolysis on RAB5. Compare specific activities and test whether the pseudokinase domain alters
    the requirement for the partner subunits.
  experiment_type: In vitro GAP assay with domain-deletion series
- hypothesis: >-
    The mTOR signalling changes in TBCK-deficient cells are secondary to blocked early-to-late endosome
    conversion rather than to a direct action of TBCK on mTORC1.
  description: >-
    In isogenic TBCK-null and control lines of several types (HeLa, neural progenitors, patient
    fibroblasts), measure mTORC1 substrate phosphorylation alongside RAB5-GTP loading and endosome
    morphology in the same cells, and test whether restoring RAB5 turnover with an orthogonal RAB5 GAP,
    or with a dominant-negative RAB5, rescues the mTOR readout without restoring TBCK.
  experiment_type: Isogenic knockout epistasis with pathway-level readouts
- hypothesis: >-
    TBCK has no protein kinase substrate in cells.
  description: >-
    Perform quantitative phosphoproteomics on isogenic TBCK-null versus control cells, and an analog-sensitive
    or crosslinking-based substrate-trapping experiment with the kinase-fold domain, to confirm the absence
    of a phosphotransfer role in a cellular context rather than only in vitro.
  experiment_type: Quantitative phosphoproteomics plus substrate trapping
