- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: NAS
  original_reference_id: PMID:12471243
  qualifier: enables
  review:
    summary: >-
      The kinase assignment that the gene symbol asserts. Its evidence is an author statement traced to
      the human kinome census - an inventory of kinase-fold genes, not an assay - and direct biochemistry
      on the purified human protein now excludes catalysis.
    action: REMOVE
    reason: >-
      GOA already carries both sides of this question from the same reference: protein kinase activity
      (NAS) alongside NOT involved_in protein phosphorylation (NAS). The contradiction resolves against
      the kinase call. The kinome census enumerated 518 putative kinase genes from sequence, and UniProt
      annotates the TBCK kinase domain as predicted catalytically inactive. In 2026, purified full-length
      human TBCK was shown to lack the glycine-rich loop, VAIK, HRD and DFG motifs, to bind no nucleotide,
      and to hydrolyse neither ATP nor GTP, placing it in class I - the pseudokinase class with no retained
      ligand binding. No substrate, no phosphotransfer and no kinase assay supporting TBCK has been
      reported in over twenty years. Caveat, recorded rather than hidden: the biochemistry is from a
      single laboratory in a methods-oriented journal, and PMID:41958985 is that group's own preprint of
      the same work, not independent replication. REMOVE is used because this is a non-experimental
      author statement contradicted by direct measurement, not an experimental annotation being
      second-guessed.
    supported_by:
