- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The phylogenetic assertion matches what is now the best-supported molecular function of TBCK:
      the TBC domain is an active Rab-GAP module, and TBCK is the catalytic core of a RAB5-directed
      GAP complex.
    action: ACCEPT
    reason: >-
      Core molecular function, and the better-supported of the two activities the gene's annotations
      assert. Three independent lines converge: the TBC domain retains the canonical GAP arginine and
      glutamine fingers; the recurrent disease missense allele p.Arg511His removes the arginine finger;
      and biochemical/cell work identifies a TBCK-PPP1R21-FERRY3 heterotrimer with specific GAP activity
      toward RAB5, whose loss produces exactly the RAB5-hyperactivation phenotype predicted. Note that
      GO merged the former 'Rab GTPase activator activity' into this term, so GO:0005096 is the most
      specific available MF; the Rab5 specificity cannot currently be expressed in the MF itself.
    supported_by:
    - reference_id: PMID:41789809
      supporting_text: This complex functions as a specific GTPase-activating protein (GAP) for RAB5.
    - reference_id: PMID:41789809
      supporting_text: TBCK deficiency or missense mutations of its key residues in the RABGAP-TBC domain
        lead to constitutive RAB5 hyperactivation, which blocks the transition from early to late endosomes
        and results in the formation of massively enlarged RAB5-positive endosomes.
    - reference_id: PMID:42546825
      supporting_text: The TBC domain of TBCK retains conserved arginine and glutamine residues characteristic
