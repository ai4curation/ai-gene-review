id: Q9BZG2
gene_symbol: ACP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACP4, also known as ACPT, encodes a single-pass membrane histidine acid phosphatase that
  functions as an extracellular protein tyrosine phosphatase toward the receptor tyrosine
  kinase ERBB4. By dephosphorylating ERBB4 it inhibits neuregulin-induced ERBB4 signaling
  and proteolytic cleavage, and human loss-of-function variants in ACP4 cause hypoplastic
  amelogenesis imperfecta.
