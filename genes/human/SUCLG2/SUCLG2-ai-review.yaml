- term:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000212531
  - PANTHER:PTN000929335
  negated: true
  review:
    summary: NOT annotation descending from the PAINT loss (IKR) of ADP-forming activity at the G-type clade PTN000929335.
    action: ACCEPT
    reason: The loss is placed at the right node. The clade below it is the animal, choanoflagellate and Dictyostelium
      G-type lineage, whose members have Gln at position 20 of the mature beta subunit, the residue that contacts
      the guanine base, where ADP-forming beta subunits have Pro. The pigeon G-type enzyme is highly specific for
      GTP/GDP, and the human enzyme is described as GTP-specific. No assay of the human SUCLG1/SUCLG2 enzyme with
      ADP was read here, so the negative rests on descent, the key residue and the orthologous enzyme. The paralog
      SUCLA2 carries the ADP-forming activity.
    supported_by:
    - reference_id: PMID:9765290
      supporting_text: Two succinyl-CoA synthetases, one highly specific for GTP/GDP and the other for ATP/ADP,
        have been purified to homogeneity from pigeon liver and breast muscle
    - reference_id: PMID:16481318
      supporting_text: interactions of the guanine base with a glutamine residue (Gln-20beta) and with backbone
        atoms provide the specificity
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: Gln at position 20 is confined to the animal, choanoflagellate and Dictyostelium members
        of the G clade
