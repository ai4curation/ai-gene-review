id: Q96I99
gene_symbol: SUCLG2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SUCLG2 encodes the GTP-specific beta subunit of mitochondrial succinyl-CoA synthetase (succinate-CoA
  ligase). With the shared alpha subunit SUCLG1 it forms a matrix heterodimer that converts succinyl-CoA, GDP and
  phosphate to succinate, CoA and GTP, the substrate-level phosphorylation step of the tricarboxylic acid cycle;
  the reaction is reversible. The beta subunit carries the nucleotide site in its ATP-grasp domain and the succinate
  site, and it sets nucleotide specificity. Its paralog SUCLA2 forms the ADP-forming enzyme with the same alpha
  subunit. Gene trees place the duplication that produced the two beta genes before the divergence of animals,
  fungi and Dictyostelium. GDP specificity is characteristic of the SUCLG2 lineage, whose characterised members
  have Gln at position 20 of the mature subunit, where SUCLA2 has Pro; this residue contacts the guanine base in
  the pig enzyme but is not by itself sufficient for GTP specificity. SUCLG2 is widely expressed, mainly in liver,
  kidney, heart, spleen and skeletal muscle, and the ratio of the GDP-forming to the ADP-forming enzyme varies
  between tissues. In human cerebral cortex SUCLG2 staining outlines the
  microvasculature (cells forming the vessels or their contents) and is absent from neurons and glia. The enzyme also
  forms malyl-CoA as a side reaction; formation of itaconyl-CoA has been reported but is contested.
