id: Q96I99
gene_symbol: SUCLG2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SUCLG2 encodes the GTP-specific beta subunit of mitochondrial succinyl-CoA synthetase (succinate-CoA
  ligase). With the shared alpha subunit SUCLG1 it forms a matrix heterodimer that converts succinyl-CoA, GDP and
  phosphate to succinate, CoA and GTP, the substrate-level phosphorylation step of the tricarboxylic acid cycle;
  the reaction is reversible. The beta subunit carries the nucleotide site in its ATP-grasp domain and the succinate
  site, and it sets nucleotide specificity. Its paralog SUCLA2 forms the ADP-forming enzyme with the same alpha
  subunit. The two beta genes arose by a duplication that predates the divergence of animals, fungi and amoebozoa;
  GDP specificity is a derived state of the SUCLG2 lineage, in which Gln replaces Pro at the position that reads
  the purine base. SUCLG2 is most abundant in liver and kidney, and in human cerebral cortex it is found in microvascular
  cells, not in neurons. The enzyme also forms itaconyl-CoA and malyl-CoA as side reactions.
