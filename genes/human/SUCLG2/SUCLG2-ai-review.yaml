- id: file:human/SUCLG2/SUCLG2-uniprot.txt
  title: UniProt entry Q96I99 (SUCLG2)
- id: file:human/SUCLG2/SUCLG2-deep-research-affinage.md
  title: Affinage mechanistic annotation for SUCLG2 (human)
  findings:
  - statement: SUCLG2 is the GTP-forming beta subunit, and its localization and stability depend on SUCLG1.
    supporting_text: SUCLG2 is the GTP-forming beta subunit of mitochondrial succinyl-CoA ligase, whose proper localization
      and stability depend on heterodimerization with the alpha subunit SUCLG1
  - statement: Affinage grounds the gene with transcription regulator activity and a nuclear location.
    supporting_text: GO:0140110 transcription regulator activity
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Machine-generated record (run 2026-06-10; its own self-evaluation is "win"; accession matches
      Q96I99). Checked claim by claim. Verified against cached abstracts: the GTP-forming beta-subunit identity
      and matrix heterodimer (PMID:30470562), mitochondrial-network staining and microvascular expression in cortex
      (PMID:25370487), and the mtDNA/NDPK knockdown result (PMID:21295139). Not verified: succinylation control
      and SIRT5/TRIM21 (PMID:37904651, cached but not read in detail), SDHB and complex II (PMID:34415331, abstract
      truncated), and the cancer-cell studies (PMID:32963351, PMID:37216870, PMID:41249152, PMID:42252434, not cached).
      Disputed: its GO grounding. "Transcription regulator activity" and "nucleus" rest on a single 2026 prostate
      cancer cell-line study and are not established functions of the gene; "catalytic activity, acting on a protein"
      is wrong, because effects on protein succinylation are indirect consequences of the succinyl-CoA pool; "ligase
      activity" is correct but far less specific than GOA. The record does not address ADP versus GDP specificity.
      No annotation was imported from it; it supplied the direct localization reference and several suggested questions.'
