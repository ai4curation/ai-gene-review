core_functions:
- description: GTP-specific beta subunit of mitochondrial succinyl-CoA synthetase. It binds the nucleotide and succinate
    and, with the shared alpha subunit SUCLG1, converts succinyl-CoA, GDP and phosphate to succinate, CoA and GTP
    in the TCA cycle. GDP specificity is a derived state of the G-type beta lineage, marked by Gln at position 20
    of the mature subunit.
