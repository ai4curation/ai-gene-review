core_functions:
- description: GTP-specific beta subunit of mitochondrial succinyl-CoA synthetase. It binds the nucleotide and succinate
    and, with the shared alpha subunit SUCLG1, converts succinyl-CoA, GDP and phosphate to succinate, CoA and GTP
    in the TCA cycle. GDP specificity is characteristic of the SUCLG2 lineage, whose characterised members have Gln
    at position 20 of the mature subunit, the residue that contacts guanine in the pig enzyme.
  contributes_to_molecular_function:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  directly_involved_in:
  - id: GO:0006099
    label: tricarboxylic acid cycle
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0045244
    label: succinate-CoA ligase complex (GDP-forming)
  supported_by:
  - reference_id: PMID:32627745
    supporting_text: Human GTP-specific SCS (GTPSCS), an αβ-heterodimer, was produced in Escherichia coli
  - reference_id: PMID:30470562
    supporting_text: Succinate-CoA ligase (SUCL) is a heterodimer consisting of an alpha subunit encoded by SUCLG1,
      and a beta subunit encoded by either SUCLA2 or SUCLG2 catalyzing an ATP- or GTP-forming reaction, respectively,
      in the mitochondrial matrix.
  - reference_id: PMID:16481318
    supporting_text: interactions of the guanine base with a glutamine residue (Gln-20beta) and with backbone atoms
      provide the specificity
  - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
    supporting_text: PTN000929335 is the node that holds the experimentally characterised GTP-specific enzymes
      (pig and human SUCLG2); it is not the limit of Gln20.
proposed_new_terms:
- proposed_name: itaconate-CoA ligase activity
  proposed_definition: 'Catalysis of the reaction: itaconate + a nucleoside triphosphate + CoA = itaconyl-CoA +
    a nucleoside diphosphate + phosphate.'
  justification: UniProt records GTP-specific itaconyl-CoA ligase as an alternative activity of this subunit and
    cites PMID:40108300 for it. Only the abstract of that paper is cached; its bioRxiv preprint (doi 10.1101/2024.09.25.614871,
    version 1) reports that recombinant human SUCLG1/SUCLG2 forms itaconyl-CoA with a catalytic efficiency 15-fold
    lower than with succinate. The activity is contested, because an earlier study found that neither pig heart
    SCS-G nor recombinant SCS-A converted itaconate at 10 mM and that itaconate inhibits the enzyme (PMID:34492704).
    A search of GO found no term for this activity. It is a side activity of the enzyme, so the term would be used
    as non-core. The parent is GO:0016878 and not GO:0016405 CoA-ligase activity, because GO:0016405 is defined
    as forming AMP and diphosphate. The same term is proposed in the SUCLG1 review.
  proposed_parent:
    id: GO:0016878
    label: acid-thiol ligase activity
  supported_by:
  - reference_id: file:human/SUCLG2/SUCLG2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Also able to act as a GTP-specific itaconyl- and malyl-CoA synthetase (PubMed:40108300).
knowledge_gaps:
- gap_statement: Why animals keep a GTP-forming succinyl-CoA synthetase beside the ATP-forming one is only partly
    established. In pancreatic beta cells, mitochondrial GTP made by the GDP-forming enzyme is used by mitochondrial
    PEPCK and controls glucose-stimulated insulin secretion. It is not known whether this role holds outside beta
    cells, whether matrix GTP supply explains the loss of mtDNA and NDPK activity when SUCLG2 is depleted, or what
    complete loss of SUCLG2 does in an animal. No Mendelian SUCLG2 deficiency has defined the phenotype of losing
    only the GDP-forming enzyme.
  boundary: 'Established: SUCLG2 with SUCLG1 forms a GTP-specific enzyme; both beta paralogs are widely expressed
    with tissue-dependent ratios; in INS-1 cells and rat islets, knockdown of the GTP-forming isoform lowers glucose-stimulated
    insulin secretion and knockdown of the ATP-forming isoform raises it; mitochondrial GTP made by the enzyme is
    hydrolysed by PEPCK-M to make phosphoenolpyruvate; knockdown of SUCLG2 in fibroblasts lowers mtDNA content and
    NDPK activity; mice lacking one Suclg2 allele show no change in bioenergetic parameters. Not established: whether
    the mitochondrial GTP and PEPCK-M role holds outside pancreatic beta cells, whether matrix GTP supply explains
    the mtDNA and NDPK effect, and the consequence of complete loss of SUCLG2 in an animal.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:17403370
    supporting_text: These data suggest a role for mtGTP in controlling pancreatic GSIS through modulation of mitochondrial
      metabolism, possibly involving mitochondrial calcium.
  - reference_id: PMID:27496549
    supporting_text: Suclg2 heterozygote mice exhibited decreases in Suclg2 expression but no rebound increases
      in Sucla2 expression or changes in bioenergetic parameters.
  - reference_id: PMID:31315053
    supporting_text: mtGTP synthesized by succinyl-CoA synthetase (SCS) is hydrolyzed via mitochondrial PEPCK (PEPCK-M)
      to make phosphoenolpyruvate
  - reference_id: PMID:21295139
    supporting_text: The mechanism of tissue specificity and mtDNA depletion is elusive
  - reference_id: Reactome:R-HSA-71775
    supporting_text: Their relative contributions to the flux of carbon atoms through the TCA cycle are unknown.
suggested_questions:
- question: Does the human SUCLG1/SUCLG2 enzyme have any measurable ADP-dependent activity? The NOT annotation for
    ADP-forming activity rests on descent and on the pigeon, pig and human enzymes being characterised as GTP-specific.
- question: Does SUCLG2 binding to the iron-sulfur cochaperone HSC20 through its C-terminal lysine motif affect
    HSC20-dependent maturation of SDHB, and does that explain the loss of SDHB and of complex II assembly in SUCLG2-deficient
    cells? SUCLG2 itself is not an iron-sulfur protein.
- question: Does the role of mitochondrial GTP from the GDP-forming enzyme in PEPCK-M-dependent insulin secretion,
    shown in pancreatic beta cells, extend to other tissues with high SUCLG2 expression such as liver and kidney?
- question: Are the reported nuclear, EGFR-associated and transcriptional roles of SUCLG2 in cancer cell lines properties
    of the endogenous protein in normal cells?
suggested_experiments:
- hypothesis: Gln20 gives GTP specificity only together with the linker between the two ATP-grasp subdomains and,
    possibly, the two rim positions that the family rule marks (Glu79/Asp147 of the precursor; Asp94/Tyr162 in SUCLA2).
    Gln20 alone is not expected to suffice.
  description: Measure kcat/Km for GDP and ADP with recombinant human SUCLG1/SUCLG2, wild type, with Gln57 of the
    precursor (mature Gln20) replaced by Pro, with Glu79 and Asp147 replaced by the SUCLA2 residues, and with the
    linker between the two ATP-grasp subdomains replaced by the SUCLA2 linker, singly and combined; make the
    reciprocal changes in SUCLA2. Two precedents argue against a single-residue switch. Blastocystis SCS has
    Gln20 and is ATP-specific. This was first attributed to two rim lysines (PMID:18452512); a later structure
    showed that Gln20 and the linker read adenine inside the site, while the double rim mutant bound GTP better
    than ATP (PMID:31282474). The Pro20-to-Gln mutant of E. coli SCS has a lower apparent Km for GTP with
    unchanged parameters for the other substrates (PMID:10353839).
- hypothesis: The requirement for SUCLG2 in mtDNA maintenance reflects matrix GTP supply.
  description: In SUCLG2-knockdown fibroblasts, test whether mtDNA content is restored by a GTP-forming enzyme from
    another lineage, by wild-type SUCLG2 but not a catalytically inactive mutant, or by raising matrix GTP through
    an imported GTP/GDP carrier.
