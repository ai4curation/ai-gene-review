knowledge_gaps:
- gap_statement: Why animals keep a GTP-forming succinyl-CoA synthetase beside the ATP-forming one is not established.
    The proposed roles of matrix GTP (supply to mitochondrial NDPK and mtDNA maintenance, GTP-dependent anabolic
    reactions) have not been separated from the general consequences of losing succinyl-CoA synthetase flux, and
    no Mendelian SUCLG2 deficiency has defined the phenotype of losing only the GDP-forming enzyme.
  boundary: 'Established: SUCLG2 with SUCLG1 forms a GTP-specific enzyme; both beta paralogs are widely expressed
    with tissue-dependent ratios; knockdown of SUCLG2 in fibroblasts lowers mtDNA content and NDPK activity. Not
    established: which GTP-requiring process depends on this enzyme in vivo.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  provenance:
  - reference_id: PMID:21295139
    supporting_text: The mechanism of tissue specificity and mtDNA depletion is elusive
  - reference_id: Reactome:R-HSA-71775
    supporting_text: Their relative contributions to the flux of carbon atoms through the TCA cycle are unknown.
suggested_questions:
- question: Does the human SUCLG1/SUCLG2 enzyme have any measurable ADP-dependent activity? The NOT annotation for
    ADP-forming activity rests on descent, the Gln20 residue and the pigeon and pig enzymes.
- question: What is the significance of SUCLG2 binding to the iron-sulfur cochaperone HSC20, given that SUCLG2 is
    not an iron-sulfur protein?
- question: Are the reported nuclear, EGFR-associated and transcriptional roles of SUCLG2 in cancer cell lines properties
    of the endogenous protein in normal cells?
- question: Does loss of SUCLG2 destabilise succinate dehydrogenase directly, as proposed for pheochromocytoma-associated
    variants, or through altered succinyl-CoA and succinate pools?
suggested_experiments:
- hypothesis: Gln20 of the mature beta subunit is the main reason the human G-type enzyme does not use ADP.
  description: Measure kcat/Km for GDP and ADP with recombinant human SUCLG1/SUCLG2, wild type and with Gln57 of
    the precursor (mature Gln20) replaced by Pro, and with the reciprocal Pro-to-Gln change in SUCLA2.
- hypothesis: The requirement for SUCLG2 in mtDNA maintenance reflects matrix GTP supply.
  description: In SUCLG2-knockdown fibroblasts, test whether mtDNA content is restored by a GTP-forming enzyme from
    another lineage, by wild-type SUCLG2 but not a catalytically inactive mutant, or by raising matrix GTP through
    an imported GTP/GDP carrier.
