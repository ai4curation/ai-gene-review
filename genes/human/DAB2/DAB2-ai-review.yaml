id: P98082
gene_symbol: DAB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DAB2 (Disabled homolog 2) is a clathrin-associated sorting protein (CLASP) / cargo-selective
  adaptor for clathrin-mediated endocytosis. Its N-terminal PID/PTB domain binds the non-phosphorylated
  FxNPxY internalization motif of LDLR-family and other cargo (LDLR, LRP, APP, integrin beta-1) together
  with PtdIns(4,5)P2, and it binds and assembles clathrin, recruiting cargo into coated pits (able to
  act independently of the AP-2 complex). It also links endocytic cargo to the myosin VI motor. Beyond
  endocytosis DAB2 is a multifunctional adaptor and tumour suppressor: it is a TGF-beta receptor-to-Smad
  signalling adaptor and a negative regulator of canonical Wnt signalling (via LRP6 internalization).
  It localises to the cytosol, plasma membrane and clathrin-coated pits/vesicles.'
