core_functions:
- description: Mediates calcium-dependent homophilic cell-cell adhesion through its extracellular cadherin
    domains. Human P-cadherin confers adhesion on transfected mouse NIH3T3 cells, and human EC1–2 studies
    establish specific calcium-dependent self-recognition.
