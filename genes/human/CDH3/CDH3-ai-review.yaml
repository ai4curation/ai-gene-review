suggested_questions:
- question: Which CDH3-dependent structural or signaling step contributes specifically to keratinization,
    beyond the observed keratin clumping and adhesion-dependent follicular organization?
- question: Does CDH3 participate in acquisition of follicular maturity, separately from maintaining
    pigment production in already mature anagen follicles?
- question: What functional cytoplasmic CDH3 pool underlies the PAINT is_active_in assertion, separately
    from the membrane-associated catenin-binding tail?
