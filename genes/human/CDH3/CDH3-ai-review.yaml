id: P22223
gene_symbol: CDH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: P-cadherin (cadherin-3) is a type I classical cadherin that mediates calcium-dependent
  homophilic cell-cell adhesion. Its extracellular cadherin domains recognize P-cadherin on adjoining
  cells, while its intracellular region associates with beta-catenin in adhesive junctions. It is expressed
  in epithelial compartments including basal cells and hair follicles. P-cadherin supports follicular
  keratinocyte proliferation, maintenance of the hair growth phase and follicular pigmentation through
  context-dependent signaling relationships. Biallelic CDH3 defects cause sparse hair with progressive
  macular dysfunction, and can also cause ectodermal dysplasia with limb abnormalities.
