      melanocyte signaling. GO:0048820 concerns attainment of a mature functional state; maintained
      pigment production in adult follicles does not by itself establish that developmental transition.
      Keep this specific experimental assertion unresolved, without denying the demonstrated pigmentary
      role or assuming the curator saw no additional evidence.
    supported_by:
    - reference_id: PMID:23334344
