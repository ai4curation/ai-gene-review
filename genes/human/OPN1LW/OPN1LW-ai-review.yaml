- description: 'Light-activated G protein-coupled receptor of long-wavelength (red) cones: photoisomerization of
    the bound chromophore converts the pigment into an active receptor that catalyses GDP-GTP exchange on cone transducin
    in the outer segment disc membrane, initiating photopic phototransduction.'
