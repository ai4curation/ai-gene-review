    supporting_text: the effects of full-length and truncated retinal analogues on the human red cone opsin's ability
      to activate transducin, the G protein in visual transduction, were assessed
  - reference_id: PMID:6140680
    supporting_text: transverse measurements were made of the absorbance spectra of the outer segments of the rods
      and cones
- description: Covalent binding of the 11-cis-retinal chromophore, forming the red visual pigment that absorbs maximally
    near 558-560 nm; seven residues set its separation from the green pigment.
  molecular_function:
    id: GO:0005502
    label: 11-cis retinal binding
