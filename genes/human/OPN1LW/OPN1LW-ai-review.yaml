      read this as a function independent of vision, but the transcripts were low-abundance in HeLa cells, the opsin
      has no shown activity there, and L and M opsin transcripts are nearly identical, so the knockdown may not
      be specific to either; the paper does not follow OPN1LW beyond the screen. A real phenotype of unclear meaning,
      not a function of the gene.
    supported_by:
    - reference_id: PMID:22888021
      supporting_text: Our data suggest that these GPCRs have additional functions independent of their sensory
        roles
