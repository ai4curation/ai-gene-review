id: P04000
gene_symbol: OPN1LW
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: OPN1LW encodes the long-wavelength-sensitive (L, "red") cone opsin, the visual pigment apoprotein of
  L cones. It is a seven-transmembrane G protein-coupled receptor of the opsin family that binds 11-cis-retinal
  covalently through a Schiff base at Lys-312, forming a pigment that absorbs maximally near 558-560 nm. Photoisomerization
  of the chromophore to all-trans-retinal converts the pigment into an active receptor that catalyses GDP-GTP exchange
  on cone transducin, initiating the cGMP cascade that hyperpolarizes the cone. The pigment resides in the disc
  membranes of the cone outer segment, which are evaginations continuous with the plasma membrane. OPN1LW lies at
  the head of a tandem X-chromosome array with one or more OPN1MW genes, from which it differs at 15 of 364 residues;
  seven of these set the 31 nm spectral separation that underlies red-green colour discrimination. Loss or hybridization
  of the gene causes protan colour vision deficiency, and loss of all L and M pigment genes (locus control region
  deletion or inactivating mutations such as C203R) causes blue cone monochromacy.
