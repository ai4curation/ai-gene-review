    label: signal transduction
  evidence_type: TAS
  original_reference_id: PMID:2937147
  qualifier: involved_in
  review:
    summary: OPN1LW acts in G protein-coupled opsin signalling (phototransduction); the specific pathway is transducin-mediated
      opsin signalling.
    action: MODIFY
    reason: Each term (signal transduction, GPCR signaling pathway, phototransduction, cellular response to light
      stimulus) is a true ancestor of GO:0141190 transducin-mediated opsin signaling pathway, which the gene already
      carries (row 32, IDA) and which the GO-CAM uses. The assayed step is light-dependent activation of transducin
      by human red opsin expressed in COS-1 cells, using rod transducin purified from bovine retina (PMID:21314100);
      the downstream cascade in cones is inferred from rod biochemistry and Reactome. PMID:2937147 (row 6) cloned
      the gene and did not assay signalling. Consistent with the RHO review.
    proposed_replacement_terms: &id003
