  review:
    summary: OPN1LW is a plasma membrane (and membrane) protein; the specific membrane is the cone photoreceptor
      disc membrane.
    action: MODIFY
    reason: True but general. Cone discs arise as evaginations of the ciliary plasma membrane and remain contiguous
      with it, so GO:0120201 cone photoreceptor disc membrane is an is_a descendant of both plasma membrane and
      membrane; the gene already carries it (row 31), as does the GO-CAM gomodel:68fac5ed00003872. In native human
      retina the red pigment is measured in cone outer segments (PMID:6140680). The TAS row (PMID:9860863) reports
      surface delivery of human red opsin heterologously expressed in COS cells, which shows that the protein reaches
      the plasma membrane but not which part of a cone. This differs from rhodopsin, whose sealed rod discs are
      not plasma membrane, which is why the RHO review keeps plasma membrane as non-core instead.
    proposed_replacement_terms: &id001
    - id: GO:0120201
      label: cone photoreceptor disc membrane
    supported_by: &id002
    - reference_id: PMID:6140680
      supporting_text: transverse measurements were made of the absorbance spectra of the outer segments of the
        rods and cones
    - reference_id: PMID:9860863
      supporting_text: and is transported to the plasma membrane
