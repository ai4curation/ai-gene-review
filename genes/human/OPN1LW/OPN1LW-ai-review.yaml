  review:
    summary: OPN1LW is a light receptor and a GPCR; the specific activity is G protein-coupled photoreceptor activity.
    action: MODIFY
    reason: 'True but general. GO:0004930 G protein-coupled receptor activity and GO:0009881 photoreceptor activity
      are both is_a ancestors of GO:0008020 G protein-coupled photoreceptor activity (combining with light and activating
      a heterotrimeric G protein by GDP-GTP exchange), which the gene already carries (rows 14-15) and which is
      what the assays show: human red opsin expressed in COS-1 cells activates bovine rod transducin in a light-
      and ligand-dependent way (PMID:21314100). The cited TAS/IMP papers are cell-culture mutagenesis of the human
      pigment (PMID:9860863, PMID:8185948), which shows light-sensitive pigment formation and spectral tuning, both
      parts of this activity.'
    proposed_replacement_terms: &id007
    - id: GO:0008020
      label: G protein-coupled photoreceptor activity
    supported_by: &id008
    - reference_id: PMID:21314100
      supporting_text: the effects of full-length and truncated retinal analogues on the human red cone opsin's
        ability to activate transducin, the G protein in visual transduction, were assessed
    - reference_id: PMID:9860863
      supporting_text: forms a light-sensitive pigment with absorption maximum at 560 nm upon reconstitution with
        11-cis-retinal
    - reference_id: PMID:8185948
      supporting_text: the spectral difference between these 2 pigments is shown to be determined by 7 and only
        7 amino acid residues
