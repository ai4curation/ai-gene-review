- term:
    id: GO:0007601
    label: visual perception
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00086021
  - InterPro:IPR000378
  - InterPro:IPR001760
  review:
    summary: OPN1LW is required for visual perception, specifically long-wavelength (red) colour vision.
    action: ACCEPT
    reason: 'Organism-level process for which the gene is essential: subjects whose L/M array is deleted or inactivated
      (C203R, R247X, P307L) have blue cone monochromacy (PMID:8213841), and loss of the red pigment gives protan
      colour vision deficiency (UniProt disease annotation). The row-11 TAS reference (PMID:7643192) is about rod
      neurite sprouting in retinitis pigmentosa and does not concern OPN1LW, but the claim stands on the other evidence.'
    supported_by: &id005
    - reference_id: PMID:8213841
      supporting_text: the rearrangements involve either deletion of a locus control region adjacent to the gene
        array or loss of function via homologous recombination and point mutation
    - reference_id: file:human/OPN1LW/OPN1LW-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Mediates visual perception of red light in cone photoreceptor cells
