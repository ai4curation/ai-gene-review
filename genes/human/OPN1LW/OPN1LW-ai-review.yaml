- term:
    id: GO:0005502
    label: 11-cis retinal binding
  evidence_type: IDA
  original_reference_id: PMID:9860863
  review:
    summary: OPN1LW binds its 11-cis-retinal chromophore covalently at Lys-312.
    action: NEW
    reason: Chromophore binding makes the pigment and holds the receptor inactive in the dark. Recombinant human
      red opsin forms a light-sensitive pigment on reconstitution with 11-cis-retinal (PMID:9860863), and 11-cis-retinal
      acts on it as an inverse agonist (PMID:21314100); Reactome records the Schiff base linkage for the human cone
      opsins. RHO carries the same term; the ontology defines it for the visual pigments.
    supported_by:
    - reference_id: PMID:9860863
      supporting_text: forms a light-sensitive pigment with absorption maximum at 560 nm upon reconstitution with
        11-cis-retinal
    - reference_id: Reactome:R-HSA-2465924
      supporting_text: Human apo opsin proteins covalently bind the chromophore 11-cis-retinal (11cRAL) via a Schiff
        base linkage
