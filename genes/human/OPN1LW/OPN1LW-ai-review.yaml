  - reference_id: PMID:6140680
    supporting_text: red cones, 558.4 +/- 5.2 nm
suggested_questions:
- question: Does the cytokinesis phenotype of the HeLa siRNA screen survive siRNAs that distinguish OPN1LW from
    OPN1MW, and is either opsin protein detectable in HeLa cells?
suggested_experiments:
- hypothesis: OPN1LW knockdown, not off-target loss of OPN1MW or another transcript, causes binucleation of HeLa
    cells.
  description: Repeat the knockdown with individual siRNAs targeting L-specific sequence, rescue with an siRNA-resistant
    OPN1LW cDNA, and test for opsin protein by targeted mass spectrometry.
