  review:
    summary: Cytoplasm is correct but uninformative for a sarcomeric thick-filament myosin.
    action: MODIFY
    reason: The term is correct but less specific than the evidence supports. MYH3, like the other sarcomeric myosin heavy
      chains, is a component of the bipolar thick filaments of the myofibril A band (UniProt 'Thick filaments of the myofibrils');
      in developing mouse muscle embryonic myosin is found within assembled sarcomeric thick filaments, where it is recognised
      by Ozz-E3 for replacement by later isoforms (PMID:20352047). Refine to striated muscle myosin thick filament (GO:0005863),
      as done for MYH7.
    proposed_replacement_terms:
    - id: GO:0005863
      label: striated muscle myosin thick filament
    supported_by:
