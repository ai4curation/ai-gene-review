- term:
    id: GO:0007517
    label: muscle organ development
  evidence_type: TAS
  original_reference_id: PMID:2771643
  qualifier: involved_in
  review:
    summary: MYH3 is among the first myosin heavy chains expressed in developing skeletal muscle and is re-expressed in regeneration;
      Myh3 null mice have defects in fibre number, size and type and in myogenic progenitor pools.
    action: MODIFY
    reason: 'The cited 1989 paper establishes developmental expression in skeletal muscle. Experimental support for a role
      came later: germline and stage-specific Myh3 deletion in mouse alters fibre size, number and type and depletes myogenic
      progenitor and myoblast pools (PMID:32094117), and Myh3 knockout adults have reduced muscle mass and grip strength (PMID:37492882).
      MYH3 is restricted to skeletal muscle, so the term is correct but can be refined to skeletal muscle organ development
      (GO:0060538). This is a non-core role: the mouse data show the embryonic contractile protein is needed for normal muscle
      development, partly through non-cell-autonomous FGF effects, rather than a dedicated developmental activity.'
    proposed_replacement_terms:
    - id: GO:0060538
