suggested_questions:
- question: How does loss of embryonic myosin affect myogenic progenitor and myoblast pools non-cell-autonomously (FGF, YAP
    and TGFbeta signalling changes reported in Myh3 mutants and MYH3-variant cells), and is this a specific signalling role
    or a secondary consequence of altered contractility and mechanical load in developing muscle?
  experts:
  - muscle developmental biologists
  - mechanobiologists
- question: Why do dominant motor-domain MYH3 variants cause distal arthrogryposis while dominant and recessive variants,
    including null alleles, cause vertebral, carpal and tarsal fusions? Is the skeletal fusion phenotype driven by the postnatal
    expression of embryonic myosin in interspinal muscles?
  experts:
  - neuromuscular and skeletal geneticists
- question: Should sarcomeric myosin heavy chains themselves carry striated muscle myosin thick filament assembly (GO:0071688)
    or sarcomere organization? Their rods self-assemble into thick filaments, but current annotations of these processes go
    mostly to assembly factors.
  experts:
  - GO editors
- question: Which myosin light chains (for example MYL4 embryonic/atrial and MYL5) associate with MYH3 in fetal muscle, and
    how do they tune its slow in vitro motility relative to its ATPase rate?
  experts:
  - myosin biochemists
suggested_experiments:
- description: Measure in vitro motility and ATPase of recombinant human MyHC-embryonic co-expressed with embryonic light
    chains (MYL4, MYL5 or fetal RLC) to determine whether the slow motility reported without associated light chains reflects
    light chain deficiency.
  hypothesis: Embryonic light chain association increases the motility velocity of MyHC-embryonic toward that expected from
    its ATPase rate.
  experiment_type: biochemical reconstitution
- description: Compare super-relaxed state populations and relaxation kinetics of wild-type versus Freeman-Sheldon and CPSFS
    variant embryonic myosin in purified protein and in iPSC-derived skeletal myotubes.
  hypothesis: Distal arthrogryposis variants reduce sequestration of myosin heads, causing hypercontractility and impaired
    relaxation, whereas CPSFS variants act through loss of function.
  experiment_type: biophysical and cell-based assays
