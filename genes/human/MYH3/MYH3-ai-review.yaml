  review:
    summary: Microfilament motor activity (IBA) is the defining activity of the class II sarcomeric myosin heavy chain clade,
      to which MYH3 belongs.
    action: ACCEPT
    reason: 'MYH3 encodes the embryonic skeletal muscle class II myosin heavy chain. Its N-terminal motor domain is an actin-activated
      Mg-ATPase that couples ATP hydrolysis to filament sliding: recombinant human MyHC-embryonic hydrolyses ATP in an actin-activated
      manner and moves actin filaments in motility assays (PMID:20080549), and transient kinetics of recombinant human embryonic
      S1 define a complete actomyosin cross-bridge cycle with slow-type ADP release (PMID:26945064). Microfilament motor activity
      is the defining core activity.'
    supported_by:
    - reference_id: file:human/MYH3/MYH3-uniprot.txt
      supporting_text: Muscle contraction.
    - reference_id: PMID:20080549
      supporting_text: In this study we describe a mammalian muscle cell expression system and the functional analysis of
        all six recombinant human type II skeletal muscle myosin isoforms.
    - reference_id: PMID:20080549
      supporting_text: MyHC-Embryonic was also determined not to copurify with detectable associated light chains, but was
        capable of directing actin-filament motility
    - reference_id: PMID:26945064
      supporting_text: Our data suggest that the WT embryonic myosin motor is similar in contractile speed to the slow type
        I/β cardiac based on the rate constant for ADP release and ADP affinity for actin-myosin.
