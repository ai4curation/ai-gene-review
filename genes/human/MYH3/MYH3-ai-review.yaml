      record_section: ["CC:SUBUNIT"]
      supporting_text: Muscle myosin is a hexameric protein that consists of 2 heavy chain subunits (MHC), 2 alkali light
        chain subunits (MLC) and 2 regulatory light chain subunits (MLC-2).
    - reference_id: PMID:20080549
