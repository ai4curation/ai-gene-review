    supporting_text: In this study we describe a mammalian muscle cell expression system and the functional analysis of all
      six recombinant human type II skeletal muscle myosin isoforms.
  - reference_id: PMID:20080549
    supporting_text: MyHC-Embryonic was also determined not to copurify with detectable associated light chains, but was capable
      of directing actin-filament motility
  - reference_id: PMID:26945064
    supporting_text: Our data suggest that the WT embryonic myosin motor is similar in contractile speed to the slow type
      I/β cardiac based on the rate constant for ADP release and ADP affinity for actin-myosin.
  - reference_id: PMID:25740846
    supporting_text: In R672C-containing muscle cells, we observed reduced specific force, a prolonged time to relaxation
      and incomplete relaxation (elevated residual force).
