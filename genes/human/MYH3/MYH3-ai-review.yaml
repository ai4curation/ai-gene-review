- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: NAS
  original_reference_id: PMID:16642020
  qualifier: enables
  review:
    summary: Calmodulin binding asserted by author statement, presumably from the IQ motif of the lever arm; sarcomeric myosin
      heavy chains bind the EF-hand essential and regulatory myosin light chains at their IQ motifs rather than calmodulin.
    action: MODIFY
    reason: The MYH3 neck carries an IQ domain (UniProt 782-811), and muscle myosin is a hexamer of two heavy chains with
      two alkali and two regulatory light chains. In sarcomeric class II myosins these IQ sites are occupied by the calmodulin-related
      myosin light chains, not by calmodulin, and no experiment shows MYH3 binding calmodulin itself. Native embryonic myosins
      copurify with light chains (PMID:20080549). The essence of the statement (an EF-hand light chain bound at the IQ lever
      arm) is better captured by myosin light chain binding (GO:0032027).
    proposed_replacement_terms:
    - id: GO:0032027
      label: myosin light chain binding
    additional_reference_ids:
    - PMID:20080549
    supported_by:
