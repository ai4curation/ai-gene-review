      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Note=Thick filaments of the myofibrils.
    - reference_id: PMID:20352047
      supporting_text: We present evidence that Ozz binding to the embryonic myosin isoform within sarcomeric thick filaments
        marks it for ubiquitination and proteolytic degradation, allowing its replacement with neonatal or adult isoforms.
    - reference_id: PMID:18695058
      supporting_text: Myosin is a molecular motor and the essential part of the thick filament of striated muscle.
