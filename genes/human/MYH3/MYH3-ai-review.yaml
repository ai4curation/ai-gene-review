core_functions:
- description: 'Actin-activated ATP-driven motor: as the heavy chain of embryonic muscle myosin, MYH3 hydrolyses ATP and binds
    actin thin filaments to produce force and filament sliding in the sarcomeres of embryonic, fetal and regenerating skeletal
    muscle.'
