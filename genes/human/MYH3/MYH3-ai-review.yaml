gene_symbol: MYH3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYH3 encodes myosin-3, the embryonic skeletal muscle myosin heavy chain (MyHC-emb), a class II sarcomeric myosin.
  It is one of the first myosin heavy chains expressed as myotubes form in the embryo, predominates in embryonic and fetal
  skeletal muscle, is largely replaced by perinatal (MYH8) and adult isoforms around birth, persists in a few specialized
  muscles such as the small interspinal muscles, and is re-expressed in regenerating muscle fibres, making it a marker of
  regeneration and of dystrophic muscle. Two heavy chains dimerize through a long alpha-helical coiled-coil rod and bind essential
  and regulatory light chains at the IQ-containing lever arm to form the hexameric muscle myosin molecule. The N-terminal
  motor domain is an actin-activated Mg-ATPase that binds ATP at a P-loop pocket and actin through conserved actin-binding
  loops; recombinant human embryonic myosin moves actin filaments slowly, with slow-type ADP release kinetics and a fast-type
  ATPase rate. The rod incorporates the protein into the bipolar thick filaments of nascent sarcomeres, from which it is later
  removed and replaced by maturing isoforms. Mouse Myh3 null mutants show altered muscle fibre number, size and type, depletion
  of myogenic progenitors and adult scoliosis. Dominant motor-domain missense variants that disrupt the ATPase cycle cause
  Freeman-Sheldon syndrome (distal arthrogryposis 2A) and Sheldon-Hall syndrome (distal arthrogryposis 2B3), attributed to
  reduced fetal muscle force and impaired relaxation, while dominant and recessive variants, including loss-of-function alleles,
  cause contractures, pterygia and spondylocarpotarsal fusion syndromes 1A and 1B.
