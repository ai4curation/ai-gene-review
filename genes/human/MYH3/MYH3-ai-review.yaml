  evidence_type: NAS
  original_reference_id: PMID:16642020
  qualifier: involved_in
  review:
    summary: Sarcomere organization asserted by author statement in the FSS genetics paper; no assay of sarcomere organization
      is reported there.
    action: KEEP_AS_NON_CORE
    reason: MYH3's contribution to sarcomere structure is as a building block of the thick filament, captured here by the
      thick filament location and by structural constituent of muscle (GO:0008307, NEW). The cited paper is a genetics and
      structural-modelling study with no assessment of sarcomere organization, and patient biopsies show only mild myopathic
      change (PMID:18695058). A QuickGO comparator check does not support treating the term as alien to muscle myosins, since
      Drosophila Mhc carries sarcomere organization by IBA and by IMP (PMID:22496423, from a myopathy-mutation transgene)
      and C. elegans unc-54 carries it by IBA, although human MYH1 and MYH11 do not. The term is therefore kept as a
      peripheral consequence of the thick-filament structural role rather than marked over-annotated; whether sarcomeric
      myosin heavy chains should carry thick-filament assembly terms is raised as a question.
