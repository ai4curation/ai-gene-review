  review:
    summary: 'Skeletal muscle contraction: MYH3 is the major myosin heavy chain of embryonic/fetal skeletal muscle, and FSS
      variants reduce prenatal myofibre force; adult carrier muscle shows reduced specific force and impaired relaxation.'
    action: ACCEPT
    reason: 'MYH3 is expressed in fetal skeletal muscle and regenerating fibres, where it is the force-generating motor of
      the sarcomere. Variants in its motor domain cause congenital contractures attributed to defective prenatal myofibre
      force production (PMID:16642020), and muscle cells from R672C carriers show reduced specific force and slowed, incomplete
      relaxation (PMID:25740846). Skeletal muscle contraction is at the right level of specificity: the embryonic isoform''s
      kinetics (slow-type ADP release yet fast-type ATPase Vmax) do not map onto the fast/slow twitch fibre-type terms.'
    additional_reference_ids:
    - PMID:25740846
    - PMID:1691980
    supported_by:
    - reference_id: PMID:16642020
      supporting_text: congenital contractures are a shared outcome of prenatal defects in myofiber force production
    - reference_id: PMID:25740846
      supporting_text: In R672C-containing muscle cells, we observed reduced specific force, a prolonged time to relaxation
        and incomplete relaxation (elevated residual force).
    - reference_id: PMID:1691980
      supporting_text: The mRNAs corresponding to clones gtMHC-F and gtMHC-E are abundantly present in fetal skeletal muscle
