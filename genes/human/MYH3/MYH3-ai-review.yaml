  review:
    summary: The MYH3 rod is a building block of the thick filaments of developing and regenerating skeletal muscle; in mouse
      embryonic muscle embryonic myosin is incorporated into assembled sarcomeric thick filaments and is later removed and
      replaced by neonatal and adult isoforms.
    action: NEW
    reason: 'Besides its motor activity, each sarcomeric myosin heavy chain is a structural component of the thick filament:
      the coiled-coil rod (UniProt coiled coil 840-1933, with the 28-residue repeat characteristic of assembly-competent myosin
      rods) packs into the bipolar filament backbone. In developing mouse muscle the embryonic isoform is present within assembled
      sarcomeric thick filaments, where Ozz-E3 recognises its rod (PMID:20352047); the human protein is the ortholog and shares
      the rod architecture (ISO). Comparator check (QuickGO): human MYH8 (NAS, PMID:2715179), human MYH11 (IMP,
      PMID:16444274), C. elegans unc-54 (IDA, PMID:3320053) and Drosophila Mhc (IMP, PMID:8995523) carry GO:0008307, so this
      follows an established convention for muscle myosin heavy chains.'
    additional_reference_ids:
