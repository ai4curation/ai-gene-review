- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028608
  review:
    summary: Inner-membrane localization asserted from Reactome mitochondrial translation events,
      a mitoribosome review, and ARBA.
    action: KEEP_AS_NON_CORE
    reason: The mammalian mitoribosome is peripherally associated with the matrix face of the
      inner membrane (via large-subunit contacts) to allow co-translational membrane insertion
      of its hydrophobic products. MRPS7 is a small-subunit head protein in the matrix-exposed
      particle, not a membrane protein; its primary location is the mitochondrial small ribosomal
      subunit in the matrix. The inner-membrane annotation reflects the whole-particle association
      and is kept as non-core.
    supported_by: &id003
    - reference_id: PMID:27023846
      supporting_text: mitoribosomes have become functionally specialized for synthesizing mitochondrial
        membrane proteins
