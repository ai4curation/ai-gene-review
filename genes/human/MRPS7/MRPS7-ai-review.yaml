- id: PMID:25556185
  title: Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural
    deafness, progressive hepatic and renal failure and lactic acidemia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Menezes et al. 2015; COXPD34 disease-gene report with rescue by wild-type
      MRPS7 in patient fibroblasts; UniProt cites it for the SUBUNIT comment.
core_functions:
- description: Structural constituent of the mitochondrial small (28S) ribosomal subunit that
    binds 12S mt-rRNA and is required for assembly of the subunit, thereby supporting mitochondrial
    translation of the mtDNA-encoded OXPHOS subunits.
  molecular_function:
    id: GO:0003735
    label: structural constituent of ribosome
  directly_involved_in:
  - id: GO:0032543
    label: mitochondrial translation
  locations:
  - id: GO:0005739
    label: mitochondrion
  in_complex:
    id: GO:0005763
    label: mitochondrial small ribosomal subunit
  supported_by:
  - reference_id: PMID:25556185
    supporting_text: MRPS7 is a 12S ribosomal RNA-binding subunit of the small mitochondrial
      ribosomal subunit, and is required for the assembly of the small ribosomal subunit
  - reference_id: PMID:25838379
    supporting_text: The highly divergent ribosomes of human mitochondria (mitoribosomes) synthesize
      13 essential proteins of oxidative phosphorylation complexes
- description: Binding of 12S mitochondrial rRNA, the RNA scaffold of the small subunit, by
    the uS7m protein.
  molecular_function:
    id: GO:0019843
    label: rRNA binding
  locations:
  - id: GO:0005739
    label: mitochondrion
  in_complex:
    id: GO:0005763
    label: mitochondrial small ribosomal subunit
  supported_by:
  - reference_id: PMID:25556185
    supporting_text: reduced 12S rRNA transcript levels observed in the patient's fibroblasts
      were also restored to normal levels by exogenous expression of wild-type MRPS7
proposed_new_terms: []
suggested_questions:
- question: Does uS7m contact mRNA or E-site tRNA in the remodelled mRNA exit channel of the
    human mitoribosome, as bacterial uS7 does?
- question: At which stage of small-subunit assembly is uS7m incorporated, and does the pathogenic
    variant block head assembly specifically?
suggested_experiments:
- description: Mitoribosome assembly profiling (sucrose gradients plus quantitative proteomics)
    in MRPS7-knockout or patient-variant cells to map which small-subunit proteins depend on
    uS7m for incorporation.
