id: Q9Y2R9
gene_symbol: MRPS7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MRPS7 encodes mitochondrial ribosomal protein uS7m, the mitochondrial member of
  the universal ribosomal protein S7 family. It is a structural component of the 28S small subunit
  of the 55S mitochondrial ribosome, located in the head of the subunit, where it binds 12S
  mt-rRNA and is required for small-subunit assembly. The mitoribosome translates the 13 mtDNA-encoded
  oxidative phosphorylation subunits. A homozygous MRPS7 missense variant reduces 12S rRNA levels
  and causes combined respiratory chain deficiency (complexes I and IV) with congenital sensorineural
  deafness, lactic acidemia and progressive hepatic and renal failure (combined oxidative phosphorylation
  deficiency 34).
