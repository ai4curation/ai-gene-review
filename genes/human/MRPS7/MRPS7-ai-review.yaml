  review:
    summary: High-throughput mRNA interactome capture (oligo(dT) pulldown after UV crosslinking)
      detected MRPS7 among RNA-bound proteins.
    action: KEEP_AS_NON_CORE
    reason: MRPS7 is an RNA-binding ribosomal protein, so generic RNA binding is correct, but
      the informative activity is binding of 12S mt-rRNA as a structural component of the small
      mitoribosomal subunit (captured by rRNA binding and structural constituent of ribosome).
      The interactome hit most likely reflects crosslinking within mRNA-engaged mitoribosomes.
      Kept as a non-core, general annotation.
    supported_by: &id001
