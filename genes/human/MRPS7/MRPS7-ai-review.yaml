  review:
    summary: PAINT inference of mRNA binding for the uS7 family (bacterial/chloroplast S7 contacts
      mRNA in the E site/exit channel of the small subunit).
    action: KEEP_AS_NON_CORE
    reason: uS7 lines the mRNA exit path in bacterial ribosomes, so mRNA contact within the
      translating ribosome is phylogenetically plausible for uS7m. However, the human mitoribosomal
      small subunit head and mRNA channel are highly remodelled and no direct mRNA-binding data
      exist for human MRPS7; its demonstrated role is as a 12S rRNA-binding structural protein.
      Kept as non-core rather than accepted as a core activity.
    supported_by:
