core_functions:
- description: Recognizes C3b and supplies noncatalytic cofactor activity for factor-I-mediated
    C3b processing, while accelerating alternative-pathway convertase decay. Both full-length
    factor H and FHL-1 share N-terminal regulatory domains; full-length FH adds C-terminal host-surface
    recognition.
  molecular_function:
    id: GO:0001851
    label: complement component C3b binding
  directly_involved_in:
  - id: GO:0045957
    label: negative regulation of complement activation, alternative pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:28671664
    supporting_text: a crystal structure of C3b in complex with FI and regulator factor H
  - reference_id: PMID:8898949
  - reference_id: PMID:21317894
  - reference_id: file:human/CFH/CFH-source-evidence.json
- description: Recognizes heparan sulfate, including the sulfation-dependent glycan features that
    contribute to host-surface targeting. Heparin is a useful experimental analogue; binding depends
    on the tested sulfation and domain context. Full-length FH and FHL-1 differ in their recognition-domain
    architecture.
  molecular_function:
    id: GO:1904399
    label: heparan sulfate binding
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:22471560
  - reference_id: PMID:16612335
  - reference_id: Reactome:R-HSA-1006169
- description: Recognizes complement C3d through the C-terminal FH19–20 region of full-length
    factor H, contributing to targeting of the C3d region within surface-associated C3b. The resolved
    C-terminal interface is not assigned to FHL-1, which lacks these domains.
  molecular_function:
    id: GO:0001854
    label: complement component C3d binding
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:21317894
    supporting_text: the C3d-FH19-20 complex in atomic detail
  - reference_id: PMID:16612335
suggested_questions:
- question: Which native CRP forms, concentrations and tissue conditions support factor-H association
    in vivo, and how do full-length FH and FHL-1 differ?
- question: Which RPE-to-retinal-precursor mechanism explains the altered timing of cell production
    and maturation in Cfh-deficient mice, and how does it transfer to human developmental contexts?
- question: Can the original exosome/microparticle accession and peptide records, and the exact
    M49 assay linkage after the streptococcal-binding correction, be recovered?
- question: How closely do human neuronal CFH mechanisms match the intracellular SCR20-dependent
    protection demonstrated with mouse constructs?
- question: Can the GO:0001864 definition distinguish pentraxin family membership from oligomeric
    state explicitly, so monomeric CRP and long-pentraxin PTX3 binding retain accurate chemical-form
    scope?
suggested_experiments:
- description: Compare native full-length human FH and FHL-1 with defined CRP conformers at controlled
    calcium, ionic strength and concentration, using solution binding and matched surface assays.
- description: Test endogenous human neuronal CFH loss and rescue with secretion-competent and
    intracellularly retained constructs, separating lipid-peroxidation protection from neuronal
    generation or myelin formation.
