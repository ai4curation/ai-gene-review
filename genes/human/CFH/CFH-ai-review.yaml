id: P08603
gene_symbol: CFH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Complement factor H is a secreted complement regulator that recognizes C3b and host-associated
  polyanions. Its N-terminal domains support factor-I-mediated C3b cleavage and accelerate decay
  of the alternative-pathway C3 convertase, while C-terminal recognition domains help concentrate
  this protection on host surfaces. The shorter splice product FHL-1 shares the first seven complement-control
  domains and regulatory activity but lacks the C-terminal recognition region of full-length factor
  H. Factor H also associates with pentraxins, oxidation-modified proteins and selected microbial
  surface proteins in context-dependent interactions. Human CFH variants can impair complement
  control and predispose to renal or retinal disease. In mouse neurons, intracellular factor H
  can additionally protect against oxidative CNS injury through a C-terminal-domain-dependent
  mechanism.
