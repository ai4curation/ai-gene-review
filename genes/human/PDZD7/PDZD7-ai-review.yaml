    id: GO:0045184
    label: establishment of protein localization
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Transfer from mouse Pdzd7 of the observation that PDZD7 is required for the correct
      positioning of the other USH2 proteins: in Pdzd7-null cochlear hair cells USH2A,
      ADGRV1 and whirlin are lost or redistributed from the ankle region, and conversely
      PDZD7 becomes abnormally distributed along stereocilia in Ush2a- or Adgrv1-null mice.
    action: MODIFY
    reason: >-
      The biology is right but the term is a very high-level parent that would fit almost
      any trafficking or scaffolding protein. What is demonstrated is retention of membrane
      partners at a defined peripheral membrane subdomain of the stereocilium. No GO term
      for protein localization to a stereocilium or ankle link exists, so GO:1990778
      (protein localization to cell periphery) is the closest existing term that adds
      information; a more specific "protein localization to stereocilium" term would be
      preferable if created.
    proposed_replacement_terms:
    - id: GO:1990778
      label: protein localization to cell periphery
    supported_by:
    - reference_id: PMID:25406310
      supporting_text: >-
        where PDZD7 is essential for the normal localizations of USH2A, GPR98, and WHRN
    - reference_id: file:human/PDZD7/PDZD7-deep-research-falcon.md
      supporting_text: >-
        PDZD7 loss disrupts or redistributes USH2A, ADGRV1 and WHRN in developing cochlear
        hair cells.
- term:
    id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Transferred from mouse Pdzd7, where knockout hair cells show reduced
      mechanotransduction currents and reduced cochlear microphonics. PDZD7 is not, however,
      a component of the mechanotransduction apparatus: it is absent from the tip-link
      insertion sites and has no described association with the MET channel complex
      (TMC1/TMC2, TMIE, LHFPL5, PCDH15). The ankle-link complex it builds is a transient
      structure of the developing bundle that has disassembled by the time mature
      transduction is established.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The reduced transduction currents are a downstream consequence of splayed,
      disorganized bundles rather than a direct role in mechanoelectrical transduction. The
      acts_upstream_of_or_within qualifier makes the row defensible rather than false, so
      it is flagged as an over-annotation rather than removed; the informative statements
      are the bundle-organization and hearing terms.
    supported_by:
    - reference_id: file:human/PDZD7/PDZD7-deep-research-falcon.md
      supporting_text: >-
        It overlaps USH2A, ADGRV1 and WHRN but is distinct from the upper tip-link
        insertion site where MYO7A clusters.
- term:
    id: GO:0060088
    label: auditory receptor cell stereocilium organization
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Ortholog transfer from mouse Pdzd7 of the hair-bundle organization phenotype;
      duplicates the IBA row for the same term with an independent line of inference.
    action: ACCEPT
    reason: >-
      Core function, correctly scoped to auditory hair cells, and the term to which the
      weaker GO:0060113 NAS row should be redirected.
    supported_by:
    - reference_id: PMID:25406310
      supporting_text: >-
        causes disorganization and gradual degeneration of hair bundles in mice
- term:
    id: GO:0060117
    label: auditory receptor cell development
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Ortholog transfer capturing the developmental window of PDZD7 function: the protein
      and the ankle-link complex are present transiently in the first postnatal days of
      cochlear hair-cell maturation, and its loss causes progressive bundle disorganization
      and outer-hair-cell degeneration.
    action: ACCEPT
    reason: >-
      Correct and central. PDZD7's requirement is developmental rather than in the mature
      bundle, so this term is a genuine part of the core description rather than a generic
      developmental add-on.
    supported_by:
    - reference_id: file:human/PDZD7/PDZD7-uniprot.txt
      supporting_text: In cochlear developing hair cells, essential in organizing
- term:
    id: GO:0002142
    label: stereocilia ankle link complex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  review:
    summary: >-
      Curator sequence-similarity transfer from mouse Pdzd7 for ankle-link complex
      membership; a third independent inference route to the same, well-supported claim.
    action: ACCEPT
    reason: Core complex membership; duplication across evidence codes is expected and fine.
    supported_by:
    - reference_id: PMID:25406310
      supporting_text: >-
        both WHRN and PDZD7 are required for the complex formation with USH2A and GPR98
- term:
    id: GO:0032420
    label: stereocilium
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Ortholog transfer of stereociliary localization from mouse Pdzd7; the parent of the
      ankle-link terms annotated on the same evidence.
    action: ACCEPT
    reason: >-
      Correct and core, consistent with UniProt's note that PDZD7 localizes at the ankle
      region of the stereocilia.
    supported_by:
    - reference_id: file:human/PDZD7/PDZD7-uniprot.txt
      supporting_text: Note=Localizes at the ankle region of the stereocilia.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: HDA
  original_reference_id: PMID:22664934
  qualifier: located_in
  review:
    summary: >-
      Derived from a single high-throughput MALDI-TOF-TOF de novo proteomic comparison of
      pooled tear fluid from 25 breast cancer patients and 25 controls, a study unrelated to
      PDZD7 in which the protein is not discussed. PDZD7 is an intracellular multi-PDZ
      scaffold with no signal peptide, no transmembrane segment and no reported secreted
      form; its entire characterized biology is on the cytoplasmic face of the stereociliary
      and periciliary membrane.
    action: REMOVE
    reason: >-
      Identification in a pooled body-fluid proteome by de novo peptide sequencing is a
      well-known source of spurious localization calls, and here it contradicts the
      protein's architecture and every targeted study of its localization. This is an
      artifact of a high-throughput screen rather than evidence of an extracellular pool.
    supported_by:
    - reference_id: PMID:22664934
      supporting_text: >-
        MALDI-TOF-TOF-driven semi-quantitative comparison of tear protein levels
    - reference_id: file:human/PDZD7/PDZD7-uniprot.txt
      supporting_text: Note=Localizes at the ankle region of the stereocilia.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19028668
  qualifier: enables
  review:
    summary: >-
      Records the interaction of PDZD7 with SANS/USH1G (UniProtKB:Q495M9), demonstrated in
      the paper that first linked PDZD7 to human deafness; the same work also recovered
      harmonin from retinal lysate with GST-PDZD7. UniProt cites this interaction directly
      (Interacts with USH1G, PubMed:19028668).
    action: MODIFY
    reason: >-
      A genuine interaction with a fellow Usher-network scaffold, but "protein binding" is
      uninformative. The molecular function demonstrated is the same adaptor/scaffold
      activity that underlies PDZD7's role in the USH2 complex, so GO:0030674
      (protein-macromolecule adaptor activity) is the appropriate informative replacement.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:19028668
      supporting_text: >-
        [Protein-protein interaction assays revealed the integration of] PDZD7 in the
        protein network related to the human Usher syndrome.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:20440071
  qualifier: located_in
  review:
    summary: >-
      The primary annotation behind the UniProt "Nucleus" location. The evidence is
      antibody labelling in the zebrafish inner retina plus perinuclear/nuclear signal in
      transfected cultured cells; the authors report that the inner-retina label persisted
      unchanged after pdzd7a knockdown and was inconsistent with their in situ hybridization
      data, and conclude it is nonspecific.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Retained rather than removed because a curator saw the full paper and the cultured-cell
      signal is reported there, but the strongest statement the source makes about nuclear
      labelling is that it is nonspecific, and no nuclear function, partner or targeting
      signal has ever been described for PDZD7. It should not be treated as a site of
      action.
    supported_by:
    - reference_id: PMID:20440071
      supporting_text: PDZD7 is also present in the perinuclear region
    - reference_id: PMID:20440071
      supporting_text: we conclude that this label is nonspecific to Pdzd7a
- term:
    id: GO:0005929
    label: cilium
  evidence_type: IDA
  original_reference_id: PMID:20440071
  qualifier: located_in
  review:
    summary: >-
      Direct immunofluorescence with a newly raised anti-PDZD7 antibody placed the protein
      at the ciliary base of serum-starved hTERT-RPE1 cells and, with a zebrafish antibody,
      at the base of the connecting cilium in zebrafish and P10 mouse photoreceptors;
      pdzd7a knockdown reduced Adgrv1/Gpr98 at the connecting cilium region.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well-executed direct localization, and PDZD7 plausibly contributes to positioning
      ADGRV1 in the periciliary region. It is nevertheless not the core function: the
      protein is at the ciliary base rather than in the cilium, and in Pdzd7-null mice the
      USH2 proteins remain correctly localized at the photoreceptor periciliary membrane
      complex with normal early ERGs, in contrast to the severe cochlear phenotype.
    supported_by:
    - reference_id: PMID:20440071
      supporting_text: >-
        we detected the newly predicted C-terminal epitope of PDZD7 at the ciliary base of
        cultured human retinal pigment epithelial (RPE) cells
    - reference_id: PMID:20440071
      supporting_text: Pdzd7 apparently localizes Gpr98 in the connecting cilium region
references:
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      All seven ISS rows transfer from a single source, UniProtKB:E9Q9W7 (mouse Pdzd7), a
      one-to-one ortholog of the human protein. The transferred localizations and processes
      match the published mouse experimental work, so the route is sound; two rows
      (GO:0045184, GO:0050910) are flagged here for term scope rather than for the transfer.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Every WITH/FROM token on the six IBA rows was resolved (MGI:1919338 = mouse harmonin,
      MGI:2682003 = mouse whirlin, MGI:3608325 = mouse Pdzd7, RGD:1303329 = rat harmonin,
      RGD:631330 = rat whirlin). Rows seeded by Pdzd7 itself (ankle-link complex, sensory
      perception of sound, stereocilium organization) are sound; the stereocilium-tip row is
      seeded only by whirlin donors and is rejected here as a paralog-specific transfer.
