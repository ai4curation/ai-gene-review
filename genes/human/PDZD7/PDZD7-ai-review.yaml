- id: PMID:19028668
  title: 'Homozygous disruption of PDZD7 by reciprocal translocation in a consanguineous
    family: a new member of the Usher syndrome protein interactome causing congenital
    hearing impairment.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only (full_text_available: false), so the interaction
