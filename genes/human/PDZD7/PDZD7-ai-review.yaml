  review:
    summary: >-
      PAINT node PTN000563297 groups PDZD7 with its paralogs harmonin and whirlin; the
      WITH/FROM donors are mouse and rat Ush1c (MGI:1919338, RGD:1303329), mouse and rat
      Whrn (MGI:2682003, RGD:631330) and human PDZD7 itself (UniProtKB:Q9H5P4, which
      carries its own IDA for cilium). All of these scaffolds are found at the
      photoreceptor periciliary/connecting-cilium region, and PDZD7 was directly localized
