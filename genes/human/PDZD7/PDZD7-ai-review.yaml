- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20440071
  qualifier: enables
  review:
    summary: >-
      IntAct/UniProt rows recording binary interactions of PDZD7 with USH2A
      (UniProtKB:O75445) and ADGRV1/GPR98 (UniProtKB:Q8WXG9), demonstrated by yeast
      two-hybrid (PDZD7 PDZ2 with the ADGRV1 C-terminal intracellular domain, isolated
      eight times as prey) and by reciprocal coimmunoprecipitation (PDZD7 PDZ1 and PDZ2
      with the USH2A intracellular domain; binding reduced when the USH2A PDZ-binding motif
      is deleted). These are the two membrane partners of the ankle-link complex.
    action: MODIFY
    reason: >-
      The interactions are real, specific and central to PDZD7's biology, but the bare
      "protein binding" term carries no functional information. The molecular function
      these assays demonstrate is adaptor/scaffold activity: PDZD7 uses its PDZ domains to
      hold the cytoplasmic PDZ-binding motifs of usherin and ADGRV1 together with whirlin
      in one complex. GO:0030674 (protein-macromolecule adaptor activity) captures this and
      is the informative replacement.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:20440071
      supporting_text: >-
        revealed interaction of PDZD7 (PDZ2 domain) with the C-terminal intracellular
        domain of GPR98
    - reference_id: PMID:20440071
      supporting_text: >-
        the first and second PDZ domains of PDZD7 interact with USH2A by
        coimmunoprecipitation studies
    - reference_id: PMID:25406310
      supporting_text: >-
        Interaction between WHRN and PDZD7 is the bridge between USH2A and GPR98.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  review:
    summary: >-
      These IntAct rows come from a proteome-scale PDZ-PBM "holdup" fragmentomics survey in
      which isolated PDZ domains (including those of PDZD7) were titrated against a library
      of 10-mer C-terminal peptides. More than thirty partners were imported into GOA from
      this one dataset, including viral proteins (multiple HPV E6 types, HTLV1 Tax) and
      human proteins with no shared expression or biology with a cochlear ankle-link
      scaffold (ABCC4, ASIC3, SLC15A5, SLCO1C1, KIR3DL3, DGKK, PBK, RPS6KA1 and others).
      Most measured PDZ-PBM affinities in this study lie in the high-micromolar range, at
      or near the assay quantification threshold.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is a systematic domain-peptide affinity matrix, not evidence that these
      complexes form in cells: the authors themselves note the transient and promiscuous
      nature of PDZ-PBM binding and that such approaches generate false positives. Importing
      each measured pair as an organism-level "protein binding" annotation inflates the
      PDZD7 interactome with pairs that share neither compartment nor tissue, and none of
      them adds functional information. The biologically meaningful PDZ interactions of
      PDZD7 (USH2A, ADGRV1, whirlin) are captured by dedicated rows and by the USH2 complex
      annotation.
    supported_by:
    - reference_id: PMID:36115835
      supporting_text: PDZ-PBM interactions are rather transient and promiscuous
    - reference_id: PMID:36115835
      supporting_text: >-
        interactomics using AP-MS from cell extracts may generate false negatives (potential
        preys that are too weakly expressed) as well as false positives (indirect
        interactions)
