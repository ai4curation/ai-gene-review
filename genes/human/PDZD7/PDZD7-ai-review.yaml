id: Q9H5P4
gene_symbol: PDZD7
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PDZD7 encodes a multi-PDZ-domain cytoplasmic scaffold protein, a paralog of the
  Usher-network scaffolds harmonin (USH1C) and whirlin (WHRN). The long isoform carries a
  harmonin-N-like domain followed by two N-terminal PDZ domains, a central proline-rich and
  disordered region, and a third C-terminal PDZ domain; it has no catalytic activity. Its
  best-characterized site of action is the ankle-link region at the tapered base of
  developing cochlear hair-cell stereocilia, where PDZD7 is a component of the transient
  USH2 (ankle-link) complex together with the transmembrane adhesion proteins usherin
  (USH2A) and ADGRV1 and the scaffold whirlin. PDZD7 binds the short cytoplasmic
  PDZ-binding motifs of USH2A and ADGRV1 and heterodimerizes with whirlin through its PDZ
  domains; the whirlin-PDZD7 heterodimer bridges USH2A and ADGRV1, so that the four
  proteins assemble into a dynamic, non-obligate quaternary complex of variable
  stoichiometry that can further condense by multivalency-driven phase separation. PDZD7
  also homodimerizes through its PDZ2 domain and associates with other Usher-network
  proteins including SANS (USH1G) and MYO7A. Loss of PDZD7 in mice disperses USH2A, ADGRV1
  and whirlin from the ankle region, produces splayed and disorganized hair bundles with
  missing short-row stereocilia, reduces hair-cell mechanotransduction currents and causes
  profound congenital deafness; in humans, biallelic PDZD7 variants cause autosomal
  recessive nonsyndromic sensorineural hearing loss (DFNB57), and heterozygous variants can
  aggravate retinal disease in individuals carrying USH2A or ADGRV1 mutations. PDZD7 is
  additionally detected at the base of the photoreceptor connecting cilium and at the
  ciliary base of cultured retinal pigment epithelial cells, but photoreceptors of
  Pdzd7-null mice retain normal USH2-protein localization and normal early retinal
  function, indicating a more limited role in the retina than in the cochlea. Functionally,
  PDZD7 acts as a multivalent adaptor that recruits, positions and stabilizes membrane
  adhesion proteins and partner scaffolds at a defined subdomain of the developing
  stereocilium, thereby maintaining hair-bundle architecture required for normal hearing.
