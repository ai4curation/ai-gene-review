- term:
    id: GO:0032426
    label: stereocilium tip
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      The WITH/FROM donors of this row are mouse whirlin (MGI:2682003) and rat whirlin
      (RGD:631330) only - neither mouse Pdzd7 (MGI:3608325) nor human PDZD7 appears, in
      contrast to the ankle-link-complex row on the same node (PTN000563297), which is
      seeded by Pdzd7 itself. Whirlin is the canonical stereocilium-tip scaffold, acting in
      the row-1 tip elongation complex, whereas every immunolocalization of PDZD7 places it
      at the ankle region immediately above the tapered stereociliary base and explicitly
      distinguishes it from the tip/upper tip-link insertion site.
    action: REMOVE
    reason: >-
      Paralog-driven propagation across a subcompartment boundary. The tip localization is
      a whirlin-specific property that arose in a sister lineage of the same PDZ-scaffold
      family; there is no report of PDZD7 at stereocilia tips, and the functional evidence
      (loss of ankle links, mislocalization of USH2A/ADGRV1/whirlin from the ankle region)
      places PDZD7's site of action at the stereociliary base. The source annotations are
      correct for whirlin; it is the transfer to PDZD7 that fails.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: MGI:MGI:2682003
        source_label: mouse whirlin (Whrn/Dfnb31)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Whirlin is a genuine stereocilium-tip protein of the row-1 elongation complex;
          the tip annotation is sound for whirlin but is a paralog-specific property, not a
          property of the ankle-link scaffold PDZD7.
      - source_id: RGD:631330
        source_label: rat whirlin
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Same paralog as the mouse donor; adds no independent support for PDZD7.
      - source_id: PANTHER:PTN000563297
        source_label: PANTHER ancestral node (harmonin/whirlin/PDZD7 scaffolds)
        source_status: NOT_RELEVANT
        comment: >-
          Not a gene product. The node is shared with the ankle-link rows, but those rows
          are seeded by Pdzd7 itself whereas this row is seeded only by whirlin, which is
          where the subcompartment mismatch enters.
    supported_by:
    - reference_id: PMID:25406310
      supporting_text: >-
        In hair cells, proteins encoded by the four genes are colocalized at the ankle link
        region of the mechanosensitive structure, the hair bundle, during development
    - reference_id: file:human/PDZD7/PDZD7-deep-research-falcon.md
      supporting_text: >-
        Immunofluorescence and tagged-protein studies placed PDZD7 immediately above the
        tapered stereociliary base, peripheral to the actin core. It overlaps USH2A, ADGRV1
        and WHRN but is distinct from the upper tip-link insertion site where MYO7A
