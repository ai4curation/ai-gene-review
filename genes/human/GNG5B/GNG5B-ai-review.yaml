gene_symbol: GNG5B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GNG5B (G protein subunit gamma 5B; formerly GNG5P2) is an X-linked (Xq23) retrocopy of
  GNG5. It was reclassified from pseudogene to protein-coding and has a single-exon MANE
  Select transcript. It encodes a 68-residue heterotrimeric G-protein gamma subunit that is
  94% identical to GNG5 (S4F, M10T, R18Q, R25S). It keeps the C-terminal CaaX box (CSFL),
  whose cysteine is geranylgeranylated and carboxymethylated in G-gamma subunits and anchors
  the G-beta-gamma dimer to the cytoplasmic face of the plasma membrane. Most of the
  G-beta-contacting surface is unchanged. Transcripts are detected at low levels
  (GTEx below 0.3 TPM, mainly pituitary and brain; Bgee reports testis germ-line expression).
  No peptide-level evidence for the protein and no experimental study of the locus have been
  reported. By homology it would act as a G-gamma subunit that partners with G-beta in
  heterotrimeric G proteins downstream of G protein-coupled receptors, but no function has
  been shown for GNG5B itself.
