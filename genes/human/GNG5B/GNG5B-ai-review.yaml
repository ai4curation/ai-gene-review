suggested_questions:
- question: >-
    Is GNG5B protein made in any tissue (for example testis or pituitary)? Peptides covering
    F4/T10 (MSGFSSVAATK) or Q18/S25 (VVQQLQLEAGLNSVK) would tell it apart from GNG5.
- question: >-
    Do the N-terminal coiled-coil substitutions R18Q and R25S change G-beta subtype
    selectivity relative to GNG5?
- question: >-
    Should GNG5B be grouped with the G-gamma5 subfamily in PANTHER (it currently has no
    subfamily assignment in the PTHR13809 entries list)? Should IBA/ISS transfers to PE 3
    retrocopies be held until protein evidence exists?
suggested_experiments:
- description: >-
    Targeted proteomics for GNG5B-unique peptides in testis and pituitary, and
    co-immunoprecipitation of tagged GNG5B with G-beta1-4 to test heterodimer formation and
    prenylation-dependent membrane localisation.
