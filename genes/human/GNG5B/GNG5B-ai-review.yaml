  review:
    summary: >-
      Phylogenetically inherited G-gamma function. The sequence is consistent with it (the
      prenylation signal is intact and the G-beta interface is largely conserved), but the
      protein has not been detected and the function has not been tested for this locus.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GNG5B lies inside the G-gamma5 clade under PTN008551661. Its sequence shows no loss: the
      CaaX cysteine C65 is retained and 33 of 36 G-beta contact positions are identical
      (file:human/GNG5B/GNG5B-bioinformatics/RESULTS.md). The node placement is therefore not in
      question. The open question is whether the product exists. UniProt rates it PE 3, there
      is no literature, no peptide evidence was found, and transcripts are at about 0.3 TPM
      or less, with quantification confounded by 94% identity to GNG5. Under the Tier 3 rule
      for a product that may exist but whose function is untested and only inherited, the
      row is flagged rather than removed. It should be upgraded to ACCEPT if GNG5B-specific
      peptides are found.
    supported_by:
    - reference_id: file:human/GNG5B/GNG5B-bioinformatics/RESULTS.md
      supporting_text: All 36 map onto GNG5. **33 of the 36 are identical in GNG5B**.
