id: A0A7P0T7Z1
gene_symbol: ACAD9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  A0A7P0T7Z1 is the 626-residue product of the human ACAD9 transcript ENST00000680636 (ACAD9-219), an
  alternative gene model of acyl-CoA dehydrogenase family member 9. Residues 1-521 are identical to the
  canonical 621-residue ACAD9 (Q9H845). This shared region contains the mitochondrial transit peptide and the
  complete FAD-dependent acyl-CoA dehydrogenase module, including the catalytic proton acceptor Glu426. An
  alternative splice acceptor in exon 16 shifts the reading frame. Residues 522-626 are therefore an unrelated,
  predicted-disordered Gly/Pro/His-rich tail, replacing most of the canonical C-terminal vestigial
  dehydrogenase domain and the domain-swapped C-terminal helix. In the canonical protein, these elements bind
  the complex I assembly factor ECSIT, stabilise the homodimer and are linked to inner-membrane association.
  The canonical ACAD9 protein is a mitochondrial homodimer. It is a long-chain acyl-CoA dehydrogenase in fatty
  acid beta-oxidation and a core subunit of the mitochondrial complex I intermediate assembly (MCIA) complex.
  This product would be expected to reach mitochondria and retain the dehydrogenase chemistry if it folds.
  Because it lacks the C-terminal assembly and dimerisation elements, the complex I assembly role cannot be
  transferred to it. Expression, stability and activity of this product have not been measured.
