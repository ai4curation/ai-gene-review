core_functions:
- description: >-
    Expected FAD-dependent long-chain acyl-CoA dehydrogenase. The catalytic module of the canonical ACAD9
    enzyme, which carries out the first step of mitochondrial fatty acid beta-oxidation, is retained intact
    together with its mitochondrial transit peptide. This is inferred from sequence identity to Q9H845 and
    from descent within PTHR43884:SF9. It has not been measured on this product, which lacks the canonical
    dimer-stabilising C-terminal helix.
  molecular_function:
    id: GO:0004466
    label: long-chain fatty acyl-CoA dehydrogenase activity
  directly_involved_in:
  - id: GO:0006635
    label: fatty acid beta-oxidation
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:16020546
    supporting_text: Purified mature ACAD-9 had maximal activity with long-chain unsaturated acyl-CoAs as
      substrates (C16:1-, C18:1-, C18:2-, C22:6-CoA).
  - reference_id: file:human/ACAD9__A0A7P0T7Z1/ACAD9__A0A7P0T7Z1-bioinformatics/RESULTS.md
    supporting_text: Residues 1-521 are identical (521 aa). The sequences diverge from residue 522.
  knowledge_gaps:
  - gap_statement: It is unknown whether the ENST00000680636 product is made in cells, whether it folds and
      dimerises without the domain-swapped C-terminal helix, and whether it keeps dehydrogenase activity and
      membrane association.
    boundary: >-
      The catalytic module and transit peptide are identical to the active canonical enzyme. The C-terminal
      elements for ECSIT contact, dimer stabilisation and membrane association are missing.
    dark_aspect: MF_DARK
    status: OPEN
    resolution: >-
      Detect isoform-specific peptides from residues 522-626 in human tissues. Express the product
      recombinantly and measure FAD content, oligomeric state and palmitoyl-CoA dehydrogenase activity.
    provenance:
    - reference_id: PMID:38086790
      supporting_text: "the C-terminal regions (residues 600–621) form helix loops that are positioned around the neighbouring protomer thereby stabilising the active dimer"
suggested_questions:
- question: >-
    Is the ACAD9-219 (ENST00000680636) transcript translated? Is the frameshifted 626-residue product detectable
    with peptides unique to residues 522-626?
- question: >-
    Since this product lacks most of the ECSIT-binding vestigial domain, could it act as an ECSIT-insensitive,
    constitutively flavinated FAO enzyme, or as a dominant-negative partner of canonical ACAD9 in mixed dimers?
suggested_experiments:
- description: >-
    Express A0A7P0T7Z1 recombinantly beside canonical ACAD9. Compare FAD content, oligomeric state (SEC-MALS),
    palmitoyl-CoA dehydrogenase activity, and binding of the ECSIT C-terminal domain.
  experiment_type: biochemical reconstitution
- description: >-
    Run targeted proteomics, or long-read RNA-seq with ribosome profiling, across tissues to test whether the
    exon-16 alternative acceptor transcript is translated.
  experiment_type: proteomics
