- term:
    id: GO:0004466
    label: long-chain fatty acyl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00088474
  - EC:1.3.8.8
  review:
    summary: >-
      Long-chain acyl-CoA dehydrogenation is the demonstrated activity of canonical ACAD9. A0A7P0T7Z1 carries
      the identical catalytic module and is expected to share it.
    action: ACCEPT
    reason: >-
      The ARBA and EC sources are not counted as independent support. The activity rests on direct assays of
      the canonical protein. Purified ACAD9 has maximal activity on C16-C22 unsaturated acyl-CoAs
      (PMID:16020546) and dehydrogenates palmitoyl-CoA (PMID:33320993). Knockout and rescue in human cells
      show a contribution to long-chain fatty acid oxidation (PMID:25721401). All the catalytic determinants
      are inside the shared residues 1-521. PMID:25721401 also reports that the variants that inactivate the
      enzyme map to this catalytic portion, while variants in the C-terminal domain preserve activity. So
      losing the C-terminal region is not expected to remove the chemistry itself. Whether the product forms
      a stable active dimer is untested. This is accepted as the expected activity of the product, not a
      measured one.
    supported_by:
    - reference_id: PMID:16020546
      supporting_text: Purified mature ACAD-9 had maximal activity with long-chain unsaturated acyl-CoAs as
        substrates (C16:1-, C18:1-, C18:2-, C22:6-CoA).
    - reference_id: PMID:25721401
      supporting_text: In contrast, the inactivating mutations were all localized to the catalytic portion
        of the molecule, which is conserved in all mitochondrial matrix ACADs including those that lack the
        membrane interacting domain.
    - reference_id: PMID:25721401
      supporting_text: "both cell lines exhibited a 35–40% decrease in whole-cell palmitate oxidation and palmitoyl-CoA ACAD activity"
    - reference_id: file:human/ACAD9__A0A7P0T7Z1/ACAD9__A0A7P0T7Z1-bioinformatics/RESULTS.md
      supporting_text: Residues 1-521 are identical (521 aa). The sequences diverge from residue 522.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      Human Protein Atlas immunofluorescence localises ACAD9 to mitochondria. The antibody signal is
      gene-level, and the mitochondrial transit peptide is intact in this product.
    action: ACCEPT
    reason: >-
      The HPA immunofluorescence row is an experimental gene-level observation. The antibody cannot tell this
      product from the canonical one, but the conclusion holds for it on sequence grounds. Residues 1-37 (the
      experimentally defined transit peptide of Q9H845, PMID:16020546) are identical, so mitochondrial import is
      expected. Canonical ACAD9 is mitochondrial in fractionation studies (PMID:16020546).
    supported_by:
    - reference_id: file:human/ACAD9__A0A7P0T7Z1/ACAD9__A0A7P0T7Z1-bioinformatics/RESULTS.md
      supporting_text: '| Mitochondrial transit peptide 1-37 | retained (identical) |'
    - reference_id: PMID:16020546
      supporting_text: Submitochondrial fractionation studies found native ACAD-9 to be associated with the
        mitochondrial membrane.
- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Inner-membrane association is established for canonical ACAD9. The C-terminal domain that has been
      linked to it is largely missing from this product.
    action: UNDECIDED
    reason: >-
      The SubCell line in this unreviewed entry rests on an ARBA rule, so it is not independent evidence.
      Native ACAD9 is membrane-associated in mitochondria (PMID:16020546). In ACAD9 and VLCAD, membrane
      association is linked to the extended C-terminal domain (PMID:25721401). A0A7P0T7Z1 replaces residues
      522-621 of that domain with an unrelated tail. Mitochondrial residence is expected from the intact transit
      peptide, but the product could be in the matrix rather than on the inner membrane. Without a localisation
      or fractionation experiment on this product, the membrane-specific claim can be neither accepted nor
      refuted.
    supported_by:
    - reference_id: PMID:25721401
      supporting_text: Among the ACADs, ACAD9 is structurally closest to VLCAD; both of them have an extended
        C-terminal domain that has been linked with inner mitochondrial membrane association
    - reference_id: file:human/ACAD9__A0A7P0T7Z1/ACAD9__A0A7P0T7Z1-bioinformatics/RESULTS.md
      supporting_text: '| Dimer-stabilising C-terminal helix 588-621 (helix-swapped residues 600-621, PMID:38086790) | lost |'
