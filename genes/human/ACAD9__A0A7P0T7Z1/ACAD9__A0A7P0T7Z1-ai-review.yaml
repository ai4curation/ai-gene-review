      product is in PTHR43884:SF9 with Q9H845, so the activity is grounded by descent as well as by sequence
      identity. The broad reaction term still says something informative and is kept beside the long-chain
      term, as in the canonical review. Caveat: the frameshifted product lacks the canonical C-terminal helix
      that stabilises the active dimer (PMID:38086790), and no activity has been measured on it.
