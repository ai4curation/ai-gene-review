core_functions:
- description: PUMA uses its BH3 helix to bind pro-survival BCL2-family grooves and inhibit 
    sequestration of BAX, BAK, or direct-activator BH3-only proteins, derepressing mitochondrial 
    outer-membrane permeabilization and cytochrome-c release.
  proposed_molecular_function: pro-survival BCL2 family protein inhibitor activity
  directly_involved_in:
  - id: GO:1901030
    label: positive regulation of mitochondrial outer membrane permeabilization involved in 
      apoptotic signaling pathway
  - id: GO:0090200
    label: positive regulation of release of cytochrome c from mitochondria
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0097136
    label: Bcl-2 family protein complex
  supported_by:
  - reference_id: PMID:11463391
    supporting_text: bind to Bcl-2 and Bcl-X(L) through a BH3 domain
  - reference_id: PMID:15694340
    supporting_text: Bim and Puma potently engaged all the prosurvival proteins comparably
  - reference_id: PMID:23340338
    supporting_text: PUMA binding-induced partial unfolding of BCL-xL abrogated binding to p53
- description: PUMA BH3 can directly activate BAX or BAK in addition to relieving pro-survival 
    inhibition, promoting effector oligomerization and the apoptotic MOMP pore.
  proposed_molecular_function: pro-apoptotic BCL2 family effector activator activity
  directly_involved_in:
  - id: GO:1901030
    label: positive regulation of mitochondrial outer membrane permeabilization involved in 
      apoptotic signaling pathway
  - id: GO:0090200
    label: positive regulation of release of cytochrome c from mitochondria
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:21041309
    supporting_text: Puma BH3 were capable of removing Bcl-xL inhibition as well as directly 
      activating Bax
  - reference_id: PMID:21041309
    supporting_text: Bim, Bmf and Puma BH3 could directly activate cBak
proposed_new_terms:
- proposed_name: pro-survival BCL2 family protein inhibitor activity
  proposed_definition: Binding to a pro-survival BCL2-family protein through a BH3-mediated 
    interaction to inhibit that protein from sequestering pro-apoptotic BCL2-family effectors or 
    activators.
  justification: BIM, BID, PUMA, BAD, NOXA, and related BH3-only proteins donate BH3 helices to the 
    grooves of pro-survival BCL2 proteins and inhibit their anti-apoptotic activity. GO:0051434 BH3 
    domain binding annotates the groove-side receptor and is directionally wrong for the BH3-only 
    ligand.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:15694340
    supporting_text: Bim and Puma potently engaged all the prosurvival proteins comparably
  - reference_id: PMID:23340338
    supporting_text: PUMA binding within the hydrophobic groove uniquely distorted the BCL-xL 
      structure
- proposed_name: pro-apoptotic BCL2 family effector activator activity
  proposed_definition: Binding to a pro-apoptotic BCL2-family effector such as BAX or BAK to promote
    the conformational activation and oligomerization that drives apoptotic mitochondrial 
    outer-membrane permeabilization.
  justification: Direct-activator BH3-only proteins donate a BH3 helix that activates BAX/BAK, but 
    GO:0051434 BH3 domain binding annotates the groove-containing protein that recognizes a BH3 
    helix. A BID/BIM/PUMA-side molecular-function term would prevent these central interactions from
    collapsing to GO:0005515 protein binding.
  proposed_parent:
    id: GO:0140677
    label: molecular function activator activity
  supported_by:
  - reference_id: PMID:21041309
    supporting_text: Hrk and Puma BH3 peptides appear to have more pronounced Bax activation in the 
      presence of Bcl-xL
  - reference_id: PMID:21041309
    supporting_text: Bim, Bmf and Puma BH3 could directly activate cBak
suggested_questions:
- question: Should GO add paired PUMA/BIM/BID-side molecular-function terms for BH3-only inhibition 
    of pro-survival BCL2 proteins and direct activation of BAX/BAK, so these rows are not forced 
    into GO:0005515 or the directionally wrong GO:0051434 BH3 domain binding term?
- question: Should Reactome-derived BBC3 transcription events be filtered so the expressed PUMA 
    protein is not automatically annotated to the cytosol before any protein-level translocation or 
    binding step occurs?
suggested_experiments:
- description: For BBC3 interactions outside the BCL2-family core, map whether the partner alters 
    PUMA mitochondrial translocation, pro-survival BCL2 groove occupancy, BAX/BAK activation, or 
    MOMP directly before curating the edge as a PUMA molecular function.
