id: Q9BXH1
gene_symbol: BBC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBC3 encodes PUMA, a short BH3-only BCL2-family apoptosis regulator induced by TP53 and
  by several p53-independent stress programs including ER stress. PUMA moves to mitochondria, where 
  its BH3 helix binds and neutralizes pro-survival BCL2-family proteins such as BCL2, BCL2L1/Bcl-xL,
  MCL1, and BCL2L2/Bcl-w and can weakly but directly activate BAX or BAK. These activities promote 
  BAX/BAK oligomerization, mitochondrial outer-membrane permeabilization, cytochrome-c release, 
  apoptosome formation, and caspase activation during intrinsic apoptosis.
