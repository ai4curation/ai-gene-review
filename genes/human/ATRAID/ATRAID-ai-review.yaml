  original_reference_id: PMID:17524364
  qualifier: located_in
  review:
    summary: Plasma membrane (EXP). Early immunofluorescence identified ATRAID as a membrane protein,
      but later fractionation and colocalization place it mainly on lysosomes, with no ER signal. A cell-surface
      pool in transit is possible. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:17524364 "Indirect immunofluorescence assay indicates that Apr3 is a membrane protein,
      while its truncated form without the predicted transmembrane and intracellular domain, was likely
      a secreted one."] [PMID:25839652 "Western blot with isolated lysosomes demonstrated that APR3 was
      mainly present in lysosomes, specially in the lysosomal membrane fraction, but not in endoplasmic
