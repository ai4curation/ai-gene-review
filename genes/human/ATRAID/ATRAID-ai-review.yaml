- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:17524364
  qualifier: located_in
  review:
    summary: Plasma membrane (EXP). The 2007 immunofluorescence showed only that ATRAID is a membrane
      protein. With tagged ATRAID expressed near or below endogenous levels, both isoforms localize to
      lysosomes but not to the plasma membrane. The only surface signal seen was attributed to higher-than-endogenous
      expression. Over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[PMID:17524364 "Indirect immunofluorescence assay indicates that Apr3 is a membrane protein,
      while its truncated form without the predicted transmembrane and intracellular domain, was likely
      a secreted one."] [PMID:29745899 "Consistent with a previous report (Ding et al., 2015), both isoforms
      of ATRAID also predominantly localize to lysosomes but not to the plasma membrane or early endosomes
      (Figure 3C–D and Figure 3—figure supplement 1D,F–H)."] [PMID:29745899 "Such distribution is likely
      a result of a higher-than-endogenous expression level of lATRAID-V5 in KO2 +SLC37A3-HA + lATRAID-V5
      HEK 293 T cells (A), as such distribution is not observed in ATRAIDKO +lATRAID-V5 HEK 293 T cells
      (G), which express lATRAID-V5 at a lower-than-endogenous level (A)."]'
    supported_by:
    - reference_id: PMID:17524364
      supporting_text: Indirect immunofluorescence assay indicates that Apr3 is a membrane protein, while
        its truncated form without the predicted transmembrane and intracellular domain, was likely a
        secreted one.
