knowledge_gaps:
- gap_statement: The physiological substrate of the ATRAID-SLC37A3 lysosomal transporter complex, other
    than bisphosphonate drugs, is unknown.
  boundary: 'Established: ATRAID-SLC37A3 complex in lysosomal membranes, needed for N-BP release (cells,
    mice). Not established: the endogenous molecule this complex exports, and whether ATRAID contributes
    directly to the translocation pathway or only stabilizes SLC37A3.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  provenance:
  - reference_id: PMID:29745899
    supporting_text: SLC37A3 and ATRAID localize to lysosomes and are required for releasing N-BP molecules
      that have trafficked to lysosomes through fluid-phase endocytosis into the cytosol.
  - reference_id: PMID:29745899
    supporting_text: Additionally, consistent with the observation that ATRAID is required for the stable
