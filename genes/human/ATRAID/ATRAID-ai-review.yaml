suggested_questions:
- question: What endogenous phosphorylated metabolite does the ATRAID-SLC37A3 complex export from lysosomes,
    given that bisphosphonates are drugs?
suggested_experiments:
- description: Run lysosomal metabolomics on ATRAID- and SLC37A3-knockout cells to identify accumulated
    substrates, and reconstitute the purified complex in proteoliposomes to test whether ATRAID is needed
    for transport beyond stabilizing SLC37A3.
