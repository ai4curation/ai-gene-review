id: Q6UW56
gene_symbol: ATRAID
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATRAID (all-trans retinoic acid-induced differentiation factor, APR3) is a small single-pass
  membrane protein with predicted N-glycosylation sites that resides mainly in the lysosomal membrane.
  It forms a complex with the MFS transporter SLC37A3, keeps SLC37A3 stable, and together they release
  nitrogen-containing bisphosphonates (such as alendronate) from lysosomes into the cytosol, where the
  drugs inhibit farnesyl diphosphate synthase. ATRAID is therefore needed for bisphosphonate action on
  osteoclasts and bone, and coding variants are found in patients with bisphosphonate-associated osteonecrosis
  of the jaw or atypical femoral fracture. It was first described as a retinoic acid-induced protein whose
  overexpression arrests cells at G1/S. It also binds the osteoinductive factor NELL-1 and supports NELL-1
  effects on osteoblast differentiation.
