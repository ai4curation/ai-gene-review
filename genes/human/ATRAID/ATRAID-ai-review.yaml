- term:
    id: GO:0042910
    label: xenobiotic transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:29745899
  qualifier: enables
  review:
    summary: Xenobiotic transmembrane transporter activity (IDA). The study identifies a transporter complex
      of the MFS protein SLC37A3 and the single-pass ATRAID, and shows that ATRAID is required for stable
      SLC37A3 expression. It does not show that ATRAID itself carries out translocation. An unqualified
      'enables' places the transporter activity on the stabilizing partner; contributes_to would fit what
      was shown. Over-annotation in its current form.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[PMID:29745899 "We observed that SLC37A3 forms a complex with ATRAID (all-trans retinoic
      acid-induced differentiation factor), a previously identified genetic target of N-BPs."] [PMID:29745899
      "Additionally, consistent with the observation that ATRAID is required for the stable expression
      of SLC37A3, ATRAIDKO cells phenocopied SLC37A3KO cells in these uptake assays."]'
    supported_by:
    - reference_id: PMID:29745899
