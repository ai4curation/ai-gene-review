- id: PMID:17524364
  title: Apoptosis related protein 3, an ATRA-upregulated membrane protein arrests the cell cycle at G1/S
    phase by decreasing the expression of cyclin D1.
  findings:
  - statement: ATRAID is a membrane protein.
    supporting_text: Indirect immunofluorescence assay indicates that Apr3 is a membrane protein, while
      its truncated form without the predicted transmembrane and intracellular domain, was likely a secreted
      one.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; early characterization.
  full_text_unavailable: true
