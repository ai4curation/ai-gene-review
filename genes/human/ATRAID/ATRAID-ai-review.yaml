      supporting_text: The co-expression of NELL-1 and APR3 enhanced Ocn and Bsp expression and mineralization.
    - reference_id: PMID:21723284
      supporting_text: NELL-1 significantly inhibited proliferation of osteoblasts co-transfected with
        APR3 through further down-regulation of Cyclin D1.
- term:
    id: GO:0030501
    label: positive regulation of bone mineralization
  evidence_type: IDA
  original_reference_id: PMID:21723284
  qualifier: involved_in
  review:
    summary: Positive regulation of bone mineralization (IDA). In Saos2 osteoblastic cells, co-expressing
      ATRAID with NELL-1 enhances osteoblast markers and mineralization and inhibits proliferation, and
      ATRAID knockdown blunts NELL-1's effect. These are overexpression and knockdown effects on NELL-1
      signalling in one cell model, so they are kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:21723284 "The co-expression of NELL-1 and APR3 enhanced Ocn and Bsp expression and
      mineralization."] [PMID:21723284 "NELL-1 significantly inhibited proliferation of osteoblasts co-transfected
      with APR3 through further down-regulation of Cyclin D1."] [PMID:21723284 "RNAi of APR3 significantly
      reduced the differentiation effect of NELL-1."]'
    supported_by:
    - reference_id: PMID:21723284
      supporting_text: The co-expression of NELL-1 and APR3 enhanced Ocn and Bsp expression and mineralization.
    - reference_id: PMID:21723284
      supporting_text: NELL-1 significantly inhibited proliferation of osteoblasts co-transfected with
        APR3 through further down-regulation of Cyclin D1.
    - reference_id: PMID:21723284
      supporting_text: RNAi of APR3 significantly reduced the differentiation effect of NELL-1.
