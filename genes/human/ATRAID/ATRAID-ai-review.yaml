    supporting_text: Western blot with isolated lysosomes demonstrated that APR3 was mainly present in
      lysosomes, specially in the lysosomal membrane fraction, but not in endoplasmic reticulum.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:32434850
  title: ATRAID regulates the action of nitrogen-containing bisphosphonates on bone.
  findings:
  - statement: ATRAID is required for alendronate action on osteoclasts and bone.
    supporting_text: ATRAID is required for alendronate inhibition of osteoclast function, and ATRAID-deficient
      mice have impaired therapeutic responses to alendronate in both postmenopausal and senile (old age)
      osteoporosis models.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; cells, mice and patients.
