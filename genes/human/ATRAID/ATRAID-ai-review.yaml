- id: PMID:21723284
  title: NELL-1 binds to APR3 affecting human osteoblast proliferation and differentiation.
  findings:
  - statement: ATRAID binds NELL-1 and supports its osteoblast effects.
    supporting_text: The co-expression of NELL-1 and APR3 enhanced Ocn and Bsp expression and mineralization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; Saos2 overexpression and RNAi.
- id: PMID:29745899
  title: Identification of a transporter complex responsible for the cytosolic entry of nitrogen-containing
    bisphosphonates.
  findings:
  - statement: ATRAID and SLC37A3 form a lysosomal complex releasing N-BPs.
    supporting_text: SLC37A3 and ATRAID localize to lysosomes and are required for releasing N-BP molecules
      that have trafficked to lysosomes through fluid-phase endocytosis into the cytosol.
  - statement: ATRAID is required for SLC37A3 stability.
    supporting_text: Additionally, consistent with the observation that ATRAID is required for the stable
      expression of SLC37A3, ATRAIDKO cells phenocopied SLC37A3KO cells in these uptake assays.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; CRISPRi screen and mechanism.
- id: PMID:25839652
  title: Apoptosis related protein 3 is a lysosomal membrane protein.
  findings:
  - statement: ATRAID is a lysosomal membrane protein.
    supporting_text: Western blot with isolated lysosomes demonstrated that APR3 was mainly present in
      lysosomes, specially in the lysosomal membrane fraction, but not in endoplasmic reticulum.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:32434850
  title: ATRAID regulates the action of nitrogen-containing bisphosphonates on bone.
  findings:
  - statement: ATRAID is required for alendronate action on osteoclasts and bone.
    supporting_text: ATRAID is required for alendronate inhibition of osteoclast function, and ATRAID-deficient
      mice have impaired therapeutic responses to alendronate in both postmenopausal and senile (old age)
      osteoporosis models.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; cells, mice and patients.
