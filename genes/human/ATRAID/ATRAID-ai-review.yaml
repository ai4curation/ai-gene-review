- term:
    id: GO:0042910
    label: xenobiotic transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:29745899
  qualifier: enables
  review:
    summary: 'Xenobiotic transmembrane transporter activity (IDA). ATRAID and the MFS protein SLC37A3
      form a complex and are mutually dependent for stability, so ATRAID is an obligate subunit. Genetically,
      SLC37A3 is epistatic to ATRAID: SLC37A3 knockouts are more drug-resistant, and also deleting ATRAID
      adds nothing. That points to SLC37A3 as the transport-competent component, with ATRAID required
      for it. An unqualified ''enables'' puts the activity on the accessory subunit; contributes_to fits
      what was shown. Over-annotation in its current form.'
    action: MARK_AS_OVER_ANNOTATED
    reason: '[PMID:29745899 "We observed that SLC37A3 forms a complex with ATRAID (all-trans retinoic
      acid-induced differentiation factor), a previously identified genetic target of N-BPs."] [PMID:29745899
      "As the translation efficiency of SLC37A3 transcripts is not significantly altered in the absence
      of ATRAID (Figure 3—figure supplement 2D–E), the decreased SLC37A3 protein level in the KO2 background
      is likely caused by shortened protein half-life, suggesting that ATRAID and SLC37A3 are mutually
      dependent for their stability."] [PMID:29745899 "We observed that SLC37A3KO cells are more resistant
      to ALN compared to ATRAIDKO cells, and the knockout of ATRAID in addition to SLC37A3 did not further
      protect cells from the drug (Figure 2F and Figure 2—figure supplement 2J), indicating that ATRAID
      and SLC37A3 are indeed functionally related and that SLC37A3 is epistatic to ATRAID."]'
    supported_by:
    - reference_id: PMID:29745899
      supporting_text: We observed that SLC37A3 forms a complex with ATRAID (all-trans retinoic acid-induced
        differentiation factor), a previously identified genetic target of N-BPs.
    - reference_id: PMID:29745899
      supporting_text: As the translation efficiency of SLC37A3 transcripts is not significantly altered
        in the absence of ATRAID (Figure 3—figure supplement 2D–E), the decreased SLC37A3 protein level
        in the KO2 background is likely caused by shortened protein half-life, suggesting that ATRAID
        and SLC37A3 are mutually dependent for their stability.
    - reference_id: PMID:29745899
      supporting_text: We observed that SLC37A3KO cells are more resistant to ALN compared to ATRAIDKO
        cells, and the knockout of ATRAID in addition to SLC37A3 did not further protect cells from the
        drug (Figure 2F and Figure 2—figure supplement 2J), indicating that ATRAID and SLC37A3 are indeed
        functionally related and that SLC37A3 is epistatic to ATRAID.
