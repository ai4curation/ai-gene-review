id: P01225
gene_symbol: FSHB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Follitropin subunit beta is the hormone-specific beta chain of follicle-stimulating hormone (FSH), a
  secreted pituitary glycoprotein hormone. FSHB non-covalently heterodimerizes with the common glycoprotein
  hormone alpha chain to form FSH, which binds and activates the follicle-stimulating hormone receptor
  on ovarian granulosa cells and testicular Sertoli cells. Through FSHR, the FSH heterodimer initiates
  Gs-coupled cAMP signaling that promotes ovarian follicle maturation, granulosa-cell steroidogenesis
  and Sertoli-cell support of spermatogenesis.
