suggested_questions:
- question: Does the 704-residue splice product lacking canonical residues129–181 fold, secrete
    and assemble like displayed COMP, and which calcium-dependent ligand activities are retained?
- question: Which human limb-development step is directly supported by COMP matrix activity
    beyond its patterned embryonic localization and disease association?
- question: How do COMP conformation, calcium occupancy and reduction state alter integrin usage
    in native tissue, compared with coated-substrate assays?
- question: Which historical developmental transfers reflect normal matrix participation, and
    which instead describe toxic-mutant stress or secondary tissue pathology?
- question: Do the screen-positive intracellular counterparts encounter COMP physiologically,
    and how do secretory processing and product identity constrain these interactions?
- question: What target-specific exosome and venous-proteomics records underlie the current
    COMP detections, and can the original supplements resolve their product and fraction scope?
suggested_experiments:
- description: Compare purified displayed and shorter COMP products for secretion, pentamer
    formation, calcium binding and collagen/heparan-sulfate interactions using matched expression
    and folding controls.
- description: Test matrix-mediated developmental contribution with temporally controlled COMP
    perturbation and structural rescue that separates extracellular assembly from intracellular
    mutant stress.
