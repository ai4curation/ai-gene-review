id: P49747
gene_symbol: COMP
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COMP (thrombospondin-5) is a secreted, calcium-binding matrix glycoprotein that
  assembles through its N-terminal coiled-coil region into pentamers. It binds collagen and
  other matrix ligands and promotes early collagen fibril organization in cartilage, tendon
  and additional connective tissues. Integrin-dependent attachment and context-dependent survival
  and vascular effects extend its matrix role. Its calcium-binding repeats and C-terminal domain
  couple conformation to ligand interactions. Pathogenic variants disrupt matrix organization,
  secretion or cellular homeostasis and cause skeletal or tendon-associated disease. The shorter
  annotated splice product lacks most of the second EGF-like domain and a short adjacent segment.
