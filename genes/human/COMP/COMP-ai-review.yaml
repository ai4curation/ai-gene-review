core_functions:
- description: 'Pentameric COMP supplies a multivalent extracellular matrix platform that associates
    with collagen and other matrix ligands and promotes early collagen fibril organization.
    Collagen binding, calcium-dependent conformation and the N-terminal oligomerization region
    cooperate in this structural work: calcium binding supports the conformation of the ligand-binding
    signature domain, while collagen engagement and multivalent assembly promote fibril organization.
    Native bovine pentamer-versus-monomer experiments directly distinguish performed organization
    from mere presence; human matrix detection and full-length assembly support the conserved
    tissue role. The isolated human signature-domain crystal is not a physiological trimer,
    and equal activity of the shorter splice product is not established.'
