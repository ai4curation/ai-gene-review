- term:
    id: GO:0007632
    label: visual behavior
  evidence_type: NAS
  original_reference_id: PMID:12205563
  qualifier: involved_in
  review:
    summary: NAS citing the NPHP4/nephroretinin gene identification paper (Senior-Loken syndrome).
    action: REMOVE
    reason: Visual behavior is an organism-level behavioral process. The cited paper identifies NPHP4
      (not NPHP1) mutations in nephronophthisis with retinitis pigmentosa. Retinal degeneration in ciliopathy
      is a consequence of connecting-cilium dysfunction, not participation in visual behavior. The photoreceptor
      connecting cilium and retina development annotations capture the relevant biology.
    supported_by:
    - reference_id: PMID:12205563
      supporting_text: In addition, we demonstrate two loss-of-function mutations of NPHP4 in patients
        from two families with SLS.
