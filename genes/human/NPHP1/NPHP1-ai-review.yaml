core_functions:
- description: Member of the NPHP module (with NPHP4 and RPGRIP1L) at the ciliary transition zone, recruited
    downstream of NPHP4/RPGRIP1L; contributes, redundantly with the MKS module, to transition-zone organization
    and gating, and hence to cilium integrity in kidney, airway and photoreceptor cilia.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:1990957
    label: NPHP complex
  supported_by:
