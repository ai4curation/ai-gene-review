id: O15259
gene_symbol: NPHP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NPHP1 (nephrocystin-1) is a cytoplasmic adaptor protein with an N-terminal coiled-coil region,
  a central SH3 domain and a C-terminal nephrocystin homology domain. It is a member of the NPHP module
  (NPHP1-NPHP4-RPGRIP1L) of the ciliary transition zone, localizing to the transition zone of renal, respiratory
  and photoreceptor (connecting) cilia; its recruitment there depends on NPHP4 and RPGRIP1L. The NPHP
  module acts partly redundantly with the MKS module in assembling the transition zone and maintaining
  ciliary composition. NPHP1 alone is not required for cilia formation, but loss together with MKS-module
  components severely disrupts ciliogenesis. A second pool at epithelial cell-cell junctions, where NPHP1
  binds focal adhesion/junctional signalling proteins (PYK2, p130Cas, filamins, polycystin-1 through its
  SH3 domain), contributes to tight junction formation and epithelial polarity. Homozygous NPHP1 deletions
  are the most common cause of juvenile nephronophthisis, also seen with retinal degeneration (Senior-Loken
  syndrome) and Joubert syndrome.
