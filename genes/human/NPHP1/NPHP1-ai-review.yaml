core_functions:
- description: Component of the NPHP (NPHP1-4-8) transition-zone module. It acts redundantly with the
    MKS module to build transition-zone membrane attachments and the ciliary gate, and to localize proteins
    at the transition zone. No specific molecular activity has been defined.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  - id: GO:1905515
    label: non-motile cilium assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:1990957
    label: NPHP complex
  supported_by:
  - *id007
  - *id011
  - *id005
  - *id012
- description: At epithelial cell-cell junctions, NPHP1 promotes timely tight-junction formation and apical
    organization. It acts as an SH3-domain adaptor that binds proline-rich motifs of partners such as
    polycystin-1 and ADAM metalloproteases.
  molecular_function:
    id: GO:0070064
    label: proline-rich region binding
  directly_involved_in:
  - id: GO:1903348
    label: positive regulation of bicellular tight junction assembly
  locations:
  - id: GO:0005911
    label: cell-cell junction
  supported_by:
  - *id013
  - *id001
  - *id009
  - *id004
suggested_questions:
- question: What is the molecular activity of the NPHP1-4-8 module at the transition zone? Does the nephrocystin
    homology domain bind lipids or the membrane, as the C2-like domains of NPHP4 and RPGRIP1L are proposed
    to?
- question: Are the junctional and transition-zone pools of NPHP1 functionally separable, and which pool
    underlies the kidney disease?
suggested_experiments:
- description: Use super-resolution mapping of NPHP1 in cells lacking each MKS-module component, combined
    with ciliary diffusion-barrier assays, to test whether the NPHP1-4-8 module has a gate function independent
    of the MKS module.
- description: Test structure-guided SH3 point mutants that abolish binding to proline-rich ligands for
    rescue of tight-junction timing and transition-zone localization in NPHP1-null renal epithelial cells.
