  evidence_type: NAS
  original_reference_id: PMID:12006559
  qualifier: enables
  review:
    summary: Curator statement that nephrocystin has structural molecule activity, based on a domain-deletion
      study that described it as a docking protein at cell-cell junctions.
    action: REMOVE
    reason: The cited paper concludes that nephrocystin is a docking (adaptor) protein that organizes
      a complex at cell-cell adhesion sites. It does not show that NPHP1 is a structural constituent of
      any assembly. GO:0005198 is a generic placeholder that adds no information. A more specific activity,
      proline-rich region binding by the SH3 domain, is captured from other papers. No replacement is
      proposed for this NAS row because the paper itself does not define a specific activity.
    supported_by:
    - &id006
