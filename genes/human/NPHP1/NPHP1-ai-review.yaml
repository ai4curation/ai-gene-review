    label: structural molecule activity
  evidence_type: NAS
  original_reference_id: PMID:12006559
  qualifier: enables
  review:
    summary: NAS from Donaldson et al. 2002, which proposes nephrocystin as a docking protein organizing
      a junctional protein complex.
    action: MODIFY
    reason: The paper describes an adaptor/docking role (SH3, coiled-coil and NHD interaction domains
      organizing a complex at cell-cell junctions), not a structural-integrity role. Protein-macromolecule
      adaptor activity matches that claim better. Note that within the NPHP module it is NPHP4 that bridges
      partners.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - &id006
      reference_id: PMID:12006559
      supporting_text: These findings support a functional role for nephrocystin as a docking protein
        involved in organizing a protein complex to regulate the actin cytoskeleton at sites of epithelial
        cell-cell adhesion and further suggest that these properties are important for establishing epithelial
        cell polarity.
