id: O15259
gene_symbol: NPHP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NPHP1 (nephrocystin-1) is a cytoplasmic adaptor protein with N-terminal coiled-coil and SH3
  domains and a C-terminal nephrocystin homology domain. With NPHP4 and RPGRIP1L it forms the NPHP1-4-8
  (NPHP) module, which concentrates at the ciliary transition zone of primary, motile and photoreceptor
  connecting cilia and at epithelial cell-cell junctions. At the transition zone the NPHP module acts
  redundantly with the MKS module to attach the basal body and transition zone to the membrane and to
  maintain the ciliary gate. NPHP1 alone is largely dispensable for ciliogenesis. At junctions, NPHP1
  is needed for timely tight-junction formation and epithelial morphogenesis. Its SH3 domain binds proline-rich
  motifs in partners such as polycystin-1 and ADAM metalloproteases, and its homology domain binds filamins.
  PYK2 phosphorylates NPHP1, and NPHP4 regulates this. NPHP1 deletion is the most common cause of juvenile
  nephronophthisis and also causes Senior-Loken and Joubert syndromes.
