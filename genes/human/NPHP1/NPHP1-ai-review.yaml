- term:
    id: GO:0007632
    label: visual behavior
  evidence_type: NAS
  original_reference_id: PMID:12205563
  qualifier: involved_in
  review:
    summary: A curator statement linking NPHP1 to visual behavior, drawn from an NPHP4 disease-gene paper
