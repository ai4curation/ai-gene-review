  - *id008
  - *id011
  - *id010
suggested_questions:
- question: Does NPHP1 make a structural contribution to transition-zone assembly (e.g. Y-link formation)
    in mammalian cells, or is it a passenger of the NPHP4/RPGRIP1L scaffold that serves a regulatory/signalling
    role?
  experts: []
- question: How are the junctional and transition-zone pools of NPHP1 related, and does tyrosine phosphorylation
    by PYK2 (counteracted by NPHP4) switch NPHP1 between them?
  experts: []
suggested_experiments:
- hypothesis: NPHP1 is required for TZ ultrastructure only when the MKS module is compromised.
  description: Compare TZ ultrastructure (cryo-ET), ciliary membrane composition and ciliogenesis in NPHP1
    single, MKS1 (or TMEM67) single and NPHP1;MKS1 double knockout RPE1/IMCD3 cells, with rescue by wild-type
    versus SH3-domain mutant NPHP1.
  experiment_type: genetic interaction + cryo-ET
