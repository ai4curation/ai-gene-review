  review:
    summary: Retain the conditional airway immune-regulatory phenotype supported by the mouse ortholog.
    action: KEEP_AS_NON_CORE
    reason: PMID:27214549 reports greater Th2 inflammation and elevated IL-13/IL-17 in allergen-challenged
