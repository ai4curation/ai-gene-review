- term:
    id: GO:0006809
    label: nitric oxide biosynthetic process
  evidence_type: TAS
  original_reference_id: PMID:8898077
  qualifier: involved_in
  review:
    summary: ARG2 regulates nitric oxide formation through substrate availability rather than synthesizing
      nitric oxide.
    action: MODIFY
    reason: The original PMID:8898077 explicitly proposes down-regulation and reports mitochondrial import;
      its RAW264.7 coinduction result is mouse and is not an assay of human NO synthesis. Human endothelial
      knockdown/overexpression in PMID:22928666 supports an inhibitory effect on coupled eNOS/NO availability
      in that context. Replace direct NO biosynthesis with the negative regulatory process; this is not
      a universal direction across every cell type.
    supported_by:
    - reference_id: PMID:8898077
      supporting_text: 'Arginase II has been proposed to play a role in down-regulation of nitric oxide

        synthesis.'
    - reference_id: PMID:22928666
      supporting_text: Silencing Arg-II in senescent cells suppresses eNOS-uncoupling
    proposed_replacement_terms:
    - id: GO:0045019
      label: negative regulation of nitric oxide biosynthetic process
