core_functions:
- description: Mitochondrial arginase catalyzes hydrolysis of L-arginine to L-ornithine and urea using
    two catalytic manganese ions per subunit in a homotrimer. The direct catabolic chemistry can supply
    ornithine to OAT-dependent mitochondrial degradation or other pathways, depending on tissue and substrate
    routing. Immune and vascular phenotypes are contextual consequences or additional signaling functions,
    not requirements of this catalytic step.
  molecular_function:
    id: GO:0004053
    label: arginase activity
  directly_involved_in:
  - id: GO:0006527
    label: L-arginine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:12859189
    supporting_text: 'Arginase is a binuclear manganese metalloenzyme that catalyzes the hydrolysis of

      l-arginine to form l-ornithine and urea.'
  - reference_id: file:human/ARG2/ARG2-uniprot.txt
    record_section:
    - CC:COFACTOR
    supporting_text: Note=Binds 2 manganese ions per subunit.
  - reference_id: PMID:8898077
    supporting_text: 'The arginase II

      precursor synthesized in vitro was imported into isolated mitochondria and

      proteolytically processed.'
  - reference_id: file:human/ARG2/ARG2-uniprot.txt
    record_section:
    - CC:SUBUNIT
