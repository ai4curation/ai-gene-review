id: P78540
gene_symbol: ARG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARG2 is a mitochondrial arginase that hydrolyzes L-arginine to L-ornithine and urea using
  a binuclear manganese center. The enzyme forms a homotrimer and is prominent in extrahepatic tissues.
  It controls arginine availability and supplies ornithine for pathways including mitochondrial OAT-dependent
  degradation and polyamine synthesis. Although it catalyzes the same urea-forming reaction as ARG1, its
  usual roles extend beyond hepatic cyclic ureagenesis. Its immunological and vascular effects depend
  strongly on cellular context: fetal dendritic-cell ARG2 suppresses T-cell TNF production, whereas endothelial
  ARG2 can promote nitric-oxide-synthase uncoupling, oxidative stress and senescence. Some vascular signaling
  effects persist with a catalytically inactive variant and therefore cannot all be attributed to arginine
  hydrolysis.'
