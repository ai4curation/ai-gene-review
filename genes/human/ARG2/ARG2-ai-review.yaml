      The existing Reactome assertions place mature ARG2 in the matrix, consistent with its soluble imported
      enzyme role. Refine the broader cytoplasmic/mitochondrial term to that already present compartment;
      do not equate the original HPA or proteomics assay with a submitochondrial-resolution experiment,
      or exclude context-dependent relocalization.
    supported_by:
    - reference_id: PMID:8898077
      supporting_text: 'The arginase II

