  review:
    summary: ARG2 executes the terminal urea-forming chemistry, with a contextual relationship to the
      urea cycle.
    action: KEEP_AS_NON_CORE
    reason: 'Retain the pathway association as secondary: ARG2 makes urea and ornithine directly, and
      curated Reactome describes mitigation of ARG1-deficient urea synthesis. This does not mean its usual
      extrahepatic mitochondrial role is a complete hepatic urea cycle, or that each tissue expressing
      ARG2 has all cycle enzymes. The PAINT node is an ancestral assertion, not a pairwise transfer; no
      reconstruction of its placement is claimed.'
    supported_by:
    - reference_id: PMID:12859189
      supporting_text: 'Arginase is a binuclear manganese metalloenzyme that catalyzes the hydrolysis
        of

        l-arginine to form l-ornithine and urea.'
    - reference_id: Reactome:R-HSA-452036
      supporting_text: its function appears to mitigate the effects of ARG1 deficiency on urea synthesis
