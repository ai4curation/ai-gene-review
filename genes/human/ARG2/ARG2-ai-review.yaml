  review:
    summary: Correct the regulatory sign inherited from the mouse annotation.
    action: MODIFY
    reason: QuickGO traces the mouse O08691 donor to IMP PMID:27745970. Full-text Fig. 5B/C shows activated
      Arg2-knockout CD4 and CD8 cells surviving longer after IL-2 withdrawal (Annexin V viability assay),
