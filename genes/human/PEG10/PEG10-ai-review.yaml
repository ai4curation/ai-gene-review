proposed_new_terms:
- proposed_name: structural constituent of virus-like capsid
  proposed_definition: The action of a molecule that contributes to the structural integrity of a virus-like
    capsid, a non-infectious protein coat encoded by endogenous, non-viral genes that surrounds nucleic
    acid.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  justification: GO:0039660 structural constituent of virion exists for viral capsid proteins, but PEG10
    is a domesticated, host-encoded Gag-derived protein whose particles are non-infectious, so its capsid
    role can only be annotated to the bare parent GO:0005198. A sibling of GO:0039660 under GO:0005198
    would pair with the existing cellular component GO:0170047 virus-like capsid. The same term is proposed
    in the human ARC review.
  supported_by:
  - reference_id: PMID:34413232
    supporting_text: MmMOAP1, MmZCCHC12, MmRTL1, MmPNMA3, MmPNMA5, MmPNMA6a, and MmPEG10 self-assemble
