suggested_questions:
- question: What is the full endogenous RNA cargo spectrum of physiological PEG10 particles, and how does
    it differ between placenta, neurons and tumour cells?
- question: Does the PEG10 aspartic protease have trans (non-self) cellular substrates in addition to
    autoprocessing the Gag-Pol polyprotein, and what is its cleavage consensus?
- question: Is the TGF-beta receptor inhibition by PEG10-RF1 competitive, allosteric or trafficking-based,
    and which receptor surface does the unmotif'd ~200-aa binding domain engage?
suggested_experiments:
- hypothesis: PEG10 selectively packages a definable set of transcripts whose identity is context-dependent.
  description: eCLIP and VLP-RNA-seq on PEG10 particles purified from trophoblast, neuronal and HCC cells
    to define the context-specific RNA cargo and quantify U/G-rich/self-mRNA selectivity.
  experiment_type: RNA-binding assay
- hypothesis: PEG10 aspartic protease catalysis, not merely protein presence, is required for its functions.
  description: Compare wild-type PEG10 with an active-site aspartate mutant (D370A) in cell and in vivo
    models for autoprocessing, VLP assembly and placental-capillary maintenance; identify cleavage products
    by N-terminomics.
  experiment_type: mutagenesis / proteomics
