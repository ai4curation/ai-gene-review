- term:
    id: GO:0004190
    label: aspartic-type endopeptidase activity
  evidence_type: IMP
  original_reference_id: PMID:17942406
  qualifier: enables
  isoform: Q86TG7-1
  review:
    summary: The frameshift-generated Gag-Pol product (isoform 1) carries a retroviral aspartic-protease
      DSG active-site motif. Mutagenesis of the active-site aspartate abolishes autoprocessing (PMID:17942406;
      UniProt MUTAGEN D370A inhibits proteolytic cleavage), the motif corresponds to the retroviral aspartic
      protease consensus (PMID:32244497), and it is functionally essential in vivo for placental vasculature
      in mouse (PMID:34559199).
    action: NEW
    reason: Experimentally demonstrated active aspartic protease that autoprocesses the Gag-Pol polyprotein;
      a core activity of the long isoform not captured by existing annotations.
    supported_by:
    - reference_id: PMID:17942406
      supporting_text: this enzyme is active and participates in post-translational processing of PEG10
        ORF1-2
    - reference_id: PMID:32244497
      supporting_text: corresponds to the consensus -Asp-Ser/Thr-Gly- active-site motif of retroviral
        aspartic proteases
