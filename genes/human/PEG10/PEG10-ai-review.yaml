id: Q86TG7
gene_symbol: PEG10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PEG10 (paternally expressed gene 10; SIRH1) is a therian-specific protein-coding gene domesticated
  from a Ty3/gypsy (sushi-ichi) LTR retrotransposon, located within the imprinted PEG10/SGCE cluster at
  human chromosome 7q21 and expressed only from the paternal allele. The protein retains the architecture
  of a retroviral Gag/Gag-Pol polyprotein: an N-terminal capsid (CA) domain with a CCHC-type nucleocapsid
  zinc knuckle, and, in the longer product generated by a highly efficient programmed -1 ribosomal frameshift,
  a Pol-like region carrying an aspartic (retropepsin) protease with the canonical DSG active-site motif.
  The capsid domain adopts a bona fide retroviral CA fold and self-assembles into virus-like particles
  that selectively bind RNA (preferentially PEG10''s own mRNA and U/G-rich transcripts) and bud from the
  membrane into secreted extracellular vesicles, allowing intercellular transfer of the packaged mRNA.
  The frameshift-encoded aspartic protease autoprocesses the Gag-Pol polyprotein. PEG10 acts principally
  in the cytoplasm and extracellularly via secreted particles, with a minor nuclear pool. It also functions
  as a signalling/adaptor protein: the Gag-like product binds and inhibits TGF-beta superfamily type I/II
  receptors (ACVRL1/ALK1 and ALK5), and it associates with and antagonizes the pro-apoptotic ubiquitin
  ligase SIAH1. Physiologically PEG10 is essential and non-redundant for placentation: Peg10-null mice
  die in early gestation from placental failure, and the protease activity is separately required for
  maintenance of fetal placental capillaries. Oncofetal reactivation of PEG10 drives cancers (notably
  hepatocellular carcinoma and B-cell chronic lymphocytic leukaemia), and its escape from proteostatic
  control (UBQLN2, UBE3A) in neurons links it to ALS and Angelman syndrome.'
