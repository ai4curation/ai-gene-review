- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:34357660
  qualifier: enables
  review:
    summary: PEG10's Gag-derived capsid domain adopts a retroviral C-terminal capsid (CA) fold (X-ray
      crystallography, PMID:34357660) and self-assembles into virus-like capsids that package RNA (PMID:34413232).
      This structural (capsid) activity is PEG10's primary molecular function and is not captured by any
      existing annotation.
    action: NEW
    reason: 'Capsid self-assembly is directly demonstrated structurally and biochemically; the protein
      is the structural subunit of the particle. GO:0039660 structural constituent of virion is not used:
      a virion is an infectious viral particle, and this host-encoded protein assembles non-infectious
      virus-like capsids. The capsid activity is therefore annotated to the parent GO:0005198 structural
      molecule activity, with the specific term proposed as the NTR ''structural constituent of virus-like
      capsid'' (the same gap and proposal recorded for ARC).'
    supported_by:
    - reference_id: PMID:34357660
      supporting_text: highly similar to the C-terminal capsid (CA) domains of cognate Gag proteins
    - reference_id: PMID:34413232
      supporting_text: self-assemble into capsid-like particles
    - reference_id: file:human/PEG10/PEG10-deep-research-openscientist.md
      supporting_text: self-assembles into capsid-like
