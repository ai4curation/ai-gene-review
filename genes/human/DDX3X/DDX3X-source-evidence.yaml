policy: Supported positive generic binding is retained as contextual under the current project exception; class-specific refinements require actual partner-class support. No NEW annotation is needed for the four already represented core activities.
action_consistency:
  innate_immune_response: GO:0002753 is_a GO:0002221 is_a GO:0002758. GO:0002758 has direct is_a parents GO:0002218 and GO:0002757; complete is_a/part_of closure does not contain GO:0045087. Its regulation terms are not substituted for participation. The directly measured TBK1/IRF3 response remains contextual.
  source_specific_exceptions: The Wnt-study membrane row is now retained contextually on independent human membrane evidence, with its original assay access limit explicit. The CAP-Rf reporter increase remains a broad positive endpoint of unresolved causal stage; the separate NAS cyclin-E1 expression summary is refined to established translation regulation.
  specificity: Forty-five formerly TOO_GENERAL rows use MODIFY with supported specific terms. Source-specific nuclear-pore, nuclear-speckle, stress-granule, perinuclear and leading-edge observations are preserved in the replacement lists. Typed ancestry is verified where asserted; cell leading edge is a complementary source-supported location without an is_a/part_of path to cytoplasm. No replacement implies exclusive residence or that the original experiment resolved an independently supported compartment.
translation_core_evidence:
