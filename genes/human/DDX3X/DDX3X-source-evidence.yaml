- id: PMID:10074132
  title: Hepatitis C virus core protein interacts with cellular putative RNA helicase.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC104042/
  cached_full_text: false
  assessment: Selected original Methods, binding Results, Figure 7 and Table 2 support human CAP-Rf/DDX3 interactions and relaxed nucleotide hydrolysis. Historic constructs and substrate-specific results are retained; no universal directional translocase mechanism is inferred.
  reference_correctness: VERIFIED
  public_locators: DOI 10.1128/JVI.73.4.2841-2853.1999; NTPase-dNTPase activity analysis Methods; Figure 7 caption and Table 2 substrate rows. Selected indexed original text, not full normal-cache access or figure-pixel inspection.
- id: PMID:10329544
  title: Hepatitis C virus core protein interacts with a human DEAD box protein DDX3.
  url: https://pubmed.ncbi.nlm.nih.gov/10329544/
  cached_full_text: false
  assessment: The complete abstract and curated source support human DDX3/HCV-core association and nuclear-speckle observations. Full original assay controls were not independently read.
  reference_correctness: VERIFIED
- id: PMID:10336476
  title: Hepatitis C virus core protein binds to a DEAD box RNA helicase.
  url: https://pubmed.ncbi.nlm.nih.gov/10336476/
  cached_full_text: false
  assessment: The complete abstract supports a human DEAD-box protein interaction with HCV core. The curated positive pair is retained without reconstructing unavailable complete assay controls.
  reference_correctness: VERIFIED
- id: PMID:15507209
  title: Requirement of DDX3 DEAD box RNA helicase for HIV-1 Rev-RRE export function.
  url: https://pubmed.ncbi.nlm.nih.gov/15507209/
  cached_full_text: false
  assessment: The complete abstract supports Rev/CRM1-dependent export and nucleocytoplasmic shuttling. ATPase chemistry is corroborated independently; full source-specific biochemical Methods were not recovered.
  reference_correctness: VERIFIED
- id: PMID:16301996
  title: DDX3, a DEAD box RNA helicase, is deregulated in hepatitis virus-associated hepatocellular carcinoma and is involved in cell growth control.
  url: https://pubmed.ncbi.nlm.nih.gov/16301996/
  cached_full_text: false
