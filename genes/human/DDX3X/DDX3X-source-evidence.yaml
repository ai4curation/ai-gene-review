gene: DDX3X
accession: UniProtKB:O00571
scope: Authored source-navigation and assay-scope guide; supporting primary sources are listed explicitly. It is not independent experimental evidence. Annotation indices are zero-based and preserve the seeded order.
products:
- id: O00571-1
  length: 662
  scope: Displayed official sequence; no tag or laboratory deletion implied.
- id: O00571-2
  length: 646
