- id: PMID:31511697
  title: DDX3X acts as a live-or-die checkpoint in stressed cells by regulating NLRP3 inflammasome.
  url: https://pubmed.ncbi.nlm.nih.gov/31511697/
  cached_full_text: true
  assessment: Selected genuine original mouse macrophage and HEK293T experiments support NLRP3 association and assembly, including conditional knockout/rescue and ASC-speck measurements. The ISS assertions remain ortholog inferences; detailed oligomer architecture and a helicase-activity requirement are not established.
  reference_correctness: VERIFIED
