  scope: Natural alternative sequence; functional equivalence or inactivity not established.
core_scope:
- molecular_function:
    id: GO:0003724
    label: RNA helicase activity
  description: Uses an ATP-dependent cycle to bind and locally unwind RNA duplexes, enabling RNA remodeling.
- molecular_function:
    id: GO:0003743
    label: translation initiation factor activity
  description: Acts as an auxiliary translation initiation factor that promotes formation of functional 80S complexes from mature ribosomal subunits.
- molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  description: Coordinates IKKε and IRF3 recruitment to enhance antiviral type I interferon signaling.
- molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  description: Binds and stimulates casein kinase 1 to support canonical Wnt signaling through Dishevelled phosphorylation.
