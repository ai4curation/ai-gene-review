  review:
    action: KEEP_AS_NON_CORE
    summary: DNA unwinding was reported for particular substrates in vitro.
    reason: Garbelli et al. tested an 18/38-mer DNA duplex and observed unwinding with a 5-prime overhang, but not with a 3-prime overhang. Sharma et al. found no appreciable unwinding of a 16-bp DNA duplex with a 25-nt 3-prime tail. These conditions do not directly retest the earlier positive substrate. Retain the experimental annotation with this unresolved scope; do not infer directional translocation or a physiological DNA-helicase role. The 2026 editorial correction replaces or clarifies figure panels and records missing underlying data, including original images for Figures 6A–B; this limits retrospective verification of the source-specific DNA result.
    supported_by:
