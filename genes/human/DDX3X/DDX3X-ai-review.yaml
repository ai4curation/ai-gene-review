  evidence_type: IDA
  original_reference_id: PMID:23478265
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: DDX3X contributes to cytoplasmic antiviral receptor signaling through the IKKε–IRF3 module.
    reason: The selected original PMID:23478265 Methods/Results show that DDX3X depletion reduces IRF3 phosphorylation after Sendai-virus stimulation in human A549 cells, while purified and cell-based experiments connect DDX3X to IKKε activation and IRF3 recruitment. This supports participation downstream in cytoplasmic antiviral signaling, not the claim that DDX3X is itself the initiating pattern-recognition receptor. The paper discusses RIG-I-pathway context but the inspected functional experiments do not isolate one upstream receptor sufficiently to force a narrower receptor-specific replacement.
    supported_by:
    - reference_id: PMID:23478265
