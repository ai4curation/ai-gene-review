  label: Homo sapiens
description: LIPT2 is the mitochondrial octanoyltransferase that initiates lipoic acid assembly in human
  cells. Imported via an N-terminal targeting sequence of about 31 residues, it transfers an octanoyl
  group made by mitochondrial fatty acid synthesis on the acyl carrier protein NDUFAB1 to lysine 107 of
  the glycine cleavage system H protein GCSH. GCSH serves as the scaffold on which lipoyl synthase LIAS
  inserts the two sulfur atoms, after which LIPT1 transfers the lipoyl group to the E2 subunits of the
  pyruvate, 2-oxoglutarate, 2-oxoadipate and branched-chain 2-oxoacid dehydrogenases. LIPT2 belongs to
  the LipB family of octanoyltransferases. Biallelic LIPT2 mutations reduce protein lipoylation and respiratory
  dehydrogenase activities and cause severe neonatal encephalopathy with lactic acidosis that does not
  respond to lipoic acid supplementation.
