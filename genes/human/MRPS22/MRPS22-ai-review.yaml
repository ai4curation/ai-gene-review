id: P82650
gene_symbol: MRPS22
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MRPS22 encodes mitochondrial ribosomal protein mS22, a mitochondrion-specific protein (no
  bacterial ribosomal homolog) of the 28S small subunit of the 55S mitochondrial ribosome. The mitoribosome
  translates the 13 mtDNA-encoded subunits of the oxidative phosphorylation complexes, and mS22 is a structural
  component of the small subunit; its loss lowers 12S mt-rRNA, the RNA core of that subunit. Biallelic
  MRPS22 variants cause combined oxidative phosphorylation deficiency 5, an antenatal-onset disorder with
  oedema, hypertrophic cardiomyopathy, tubulopathy and hypotonia, in which patient fibroblasts show reduced
  12S rRNA and multiple respiratory chain deficiency rescued by wild-type MRPS22. Other homozygous missense
  variants cause isolated primary ovarian insufficiency (ovarian dysgenesis 7) with no detectable fibroblast
  defect; the Drosophila ortholog mRpS22 is required cell-autonomously in female germ cells, and complete
  Mrps22 loss in mouse is embryonic lethal.
