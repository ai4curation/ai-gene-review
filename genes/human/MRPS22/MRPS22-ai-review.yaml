suggested_questions:
- question: Why do the ODG7 missense variants (p.R135Q, p.R202H) cause isolated ovarian insufficiency
    with no detectable fibroblast rRNA or OXPHOS defect, whereas the COXPD5 variant abolishes 12S rRNA
    accumulation? Do the POI variants impair mS22 only in a germline-specific context?
- question: At what stage of 28S subunit assembly is mS22 incorporated, and which neighbouring small-subunit
    proteins depend on it?
