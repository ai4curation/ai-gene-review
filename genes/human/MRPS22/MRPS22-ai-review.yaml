- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: NAS
  original_reference_id: PMID:27023846
  qualifier: located_in
  review:
    summary: Inner-membrane localization asserted from Reactome mitochondrial translation events and a
      mitoribosome review.
    action: KEEP_AS_NON_CORE
    reason: The mammalian mitoribosome is peripherally tethered to the matrix face of the inner membrane
      (through large-subunit contacts) for co-translational insertion of its hydrophobic products. mS22
      is a small-subunit protein of the matrix-exposed particle, not a membrane protein, so its primary
      location is the mitochondrial small ribosomal subunit. Kept as non-core, reflecting whole-particle
      association.
    supported_by:
    - reference_id: PMID:27023846
      supporting_text: mitoribosomes have become functionally specialized for synthesizing mitochondrial
        membrane proteins
