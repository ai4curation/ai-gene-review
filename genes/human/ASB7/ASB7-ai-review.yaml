id: Q9H672
gene_symbol: ASB7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB7 is an ankyrin repeat and SOCS box protein that serves as the substrate-recognition subunit
  of a Cullin 5-RBX2 (CRL5) E3 ubiquitin ligase. Its ankyrin repeats 3-6 form an extended groove that
  binds an internal helical degron, and its SOCS box binds Elongin B/C. HP1 recruits ASB7 to heterochromatin,
  where it promotes degradation of the H3K9 methyltransferase SUV39H1, limiting H3K9me3 and preventing
  excessive heterochromatin formation; CDK1 phosphorylation in mitosis blocks this interaction. ASB7 also
  ubiquitinates the spindle regulator DDA3/PSRC1 for proteasomal degradation, supporting microtubule polymerization
  and chromosome alignment, and it is needed for spindle assembly in mouse oocyte meiosis. With CUL5 it
  ubiquitinates the transcription factor ATF2 at K383 for degradation, derepressing ITGB2 and promoting
  tumour-cell invasion.
