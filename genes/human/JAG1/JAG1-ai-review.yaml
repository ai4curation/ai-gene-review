core_functions:
- description: >-
    Transmembrane Serrate-class DSL ligand whose DSL-EGF3 face binds the ligand-binding EGF
    repeats of NOTCH1/2/3 in a Ca2+-dependent manner, activating Notch in trans (after MIB1-dependent
    ubiquitination/endocytosis) and inhibiting it in cis.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
