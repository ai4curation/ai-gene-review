id: P78504
gene_symbol: JAG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  JAG1 (Jagged-1) is a single-pass type I transmembrane Notch ligand of the Serrate/Jagged
  subclass of the DSL family. Its extracellular region comprises an N-terminal MNNL domain,
  the DSL domain, 16 EGF-like repeats (the second atypical) and a cysteine-rich region; the
  DSL-EGF3 region forms the Notch-binding face used for both trans-activation and cis-inhibition.
  JAG1 binds NOTCH1, NOTCH2 and NOTCH3 in a calcium-dependent manner, and its cytoplasmic
  tail, which carries a C-terminal PDZ-binding motif, is recognised at two sites by the E3
  ligase MIB1; ubiquitination and endocytosis of the ligand provide the mechanical pull required
  for Notch activation. Fringe-mediated glycosylation of NOTCH1 reduces its responsiveness
  to JAG1. JAG1 also binds the complement regulator CD46 on T cells. JAG1-Notch signaling
  is required for cardiovascular (outflow tract, pulmonary artery, valve), bile duct, inner
  ear, kidney and eye development; heterozygous loss of function causes Alagille syndrome,
  and JAG1 variants also cause tetralogy of Fallot and an axonal Charcot-Marie-Tooth neuropathy.
