    supported_by:
    - reference_id: PMID:11549580
      supporting_text: >-
        we studied an in vitro model of NIH3T3 cells transfected with a secreted form of the
        extracellular domain of Jagged1.
    - reference_id: PMID:11549580
      supporting_text: >-
        We report that the soluble Jagged1 protein caused decreased cell-matrix adhesion and
        cell migration defects.
    - reference_id: PMID:11427524
      supporting_text: >-
        may result from the inhibition of endogenous Jagged 1-mediated Notch signaling since
        it was not possible to detect an sJ1-dependent induction of CSL-dependent transcription
        in these cells.
