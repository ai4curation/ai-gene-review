  evidence_type: IDA
  original_reference_id: PMID:11549580
  qualifier: involved_in
  review:
    summary: >-
      Adhesion/migration phenotypes from NIH3T3 cells expressing a secreted JAG1 ectodomain.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The effect comes from an engineered soluble fragment that antagonises endogenous JAG1-Notch
