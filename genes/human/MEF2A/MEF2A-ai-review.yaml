id: Q02078
gene_symbol: MEF2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MEF2A (myocyte enhancer factor 2A) is a MADS-box MEF2-family transcription factor. Its
  N-terminal MADS and MEF2 domains bind A/T-rich MEF2 sites as homo- or heterodimers, including MEF2A-MEF2D
  dimers, and mediate contacts with regulatory partners. MEF2A activates RNA polymerase II transcription
  from cardiac, skeletal-muscle, macrophage and growth-factor-responsive cis-regulatory regions; ChIP
  and reporter studies support direct targets such as c-Jun and HZF1. Coactivators and repressors
  tune this activity: MEF2A binds PITX2, HAND proteins, SMAD2, p300, class II histone deacetylases,
  HDAC1/7 and MAP kinases. p38 and ERK5/BMK1 phosphorylate MEF2A to raise MEF2-dependent transcription.
  In neurons, calcium/calcineurin signalling switches Lys-403 from SUMOylation to acetylation, changing
  MEF2A from a transcriptional repressor that promotes postsynaptic dendritic differentiation to an
  inhibited form.'
