- id: PMID:15620359
  title: Neurexins induce differentiation of GABA and glutamate postsynaptic specializations via neuroligins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed identity and the immutable main full-text cache were read. Selected
      Results and Methods (cache lines90–123 and167–199) explicitly report gamma2/alpha2 receptor clustering
      on dendrites, MAP2 colabeling and live-cell antibody evidence of surface localization; Methods describe
      E18 rat hippocampal cultures and gamma2-specific antibodies. This establishes a gamma2 dendritic-surface
      context in the coculture model, not gamma2 as the neurexin/neuroligin synaptogenic executor or proof
      of every native human compartment. Original images and supplements were not inspected. Earlier BioC
      error and browser challenge responses remain historical access failures; they do not describe the
      subsequently located main cache.
- id: PMID:18281286
  title: 'Histamine action on vertebrate GABAA receptors: direct channel gating and potentiation of GABA
    responses.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic native PubMed abstract read alongside exact mouse P22723 donor IDA and UniProt
      records. Histamine directly gates beta2/beta3 homomers, whereas it potentiates alpha1/beta2(/gamma2)
      GABA responses in a gamma2-controlled manner. This supports the contextual cellular response, not
      gamma2 histamine binding. The abstract does not independently establish original clone species,
      natural product suffixes or full assay methods.
- id: PMID:23909897
  title: GABA(A) receptors can initiate the formation of functional inhibitory GABAergic synapses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic selected original co-culture Results and Methods read in the retained alpha1
      receptor study. Alpha1/beta2/gamma2-expressing cells form stable functional inhibitory contacts;
      gamma2 alone is not sufficient. This supports receptor participation in a reduced contact model,
      not a gamma2-only adhesion mechanism or universal in-vivo assembly role. The HEK host does not independently
      establish each clone species.
- id: PMID:25172774
  title: The kinesin KIF21B participates in the cell surface delivery of γ2 subunit-containing GABAA receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic native abstract and exact rat P18508 UniProt evidence block read. Gamma2 specifically
      co-precipitates and co-localizes with KIF21B; knockdown reduces gamma2-containing receptor clusters
      and the authors support transport-vesicle delivery into dendrites. The target is gamma2, unlike
      unresolved alpha1/beta3-specific extensions of this source. Full Methods and detailed vesicle-population
      imaging remain inaccessible; gamma2 is receptor cargo, not the kinesin transport executor.
- id: PMID:2538761
  title: Importance of a novel GABAA receptor subunit for benzodiazepine pharmacology.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Authentic cached abstract read: gamma2 coexpression with alpha1/beta1 yields functional
      GABA-A receptors and benzodiazepine pharmacology. Detailed original constructs and species were
      not resolved from the accessible abstract. Human structures and current measurements independently
      support the molecular claims; native postsynaptic localization is supported by separate original
      evidence.'
- id: PMID:25489750
  title: Inhibitory synapse formation in a co-culture model incorporating GABAergic medium spiny neurons
    and HEK293 cells stably expressing GABAA receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original JoVE sections and captions read in the retained primary packet. The
      protocol discusses alpha1/beta3/gamma2 contact assays and reuses some 2013 alpha1/beta2/gamma2 material.
      Figure1B repeats beta2 in its caption despite the beta3 context. This source inconsistency is retained;
      reused panels are not independent replication, and no original image or raw-data reanalysis is claimed.
- id: PMID:27733149
  title: RNA binding protein Nova1 promotes tumor growth in vivo and its potential mechanism as an oncogene
    may due to its interaction with GABA(A) Receptor-γ2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed record and original PMC5062898 BioC selected abstract/Results/Methods/Figure2
      caption read. Reciprocal NOVA1/gamma2 co-IP in human Huh7 and SMMC-7721 cells, with IgG and buffer
      controls, supports association. It is not purified binary binding or proof that gamma2 executes
      NOVA1 RNA-processing functions. Xenograft and cancer-phenotype work remains distinct from the interaction
      assay.
- id: PMID:27864268
  title: De novo GABRG2 mutations associated with epileptic encephalopathies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and indexed original PMC Methods plus selected Results were read. Human
      alpha1/beta2/gamma2L HEK293T assays compare wild type with six variants. HA is inserted after mature
      residue4 for surface imaging; biotinylation and gamma2 immunoblots independently assess surface
      abundance. Whole-cell GABA currents support receptor function. Mutant ER retention does not establish
      an ER core function for wild-type gamma2. Structural calculations are models, not experimental structures.
      Some original prose has internally inconsistent variant names and percent-reduction wording; do
      not use those sentences for quantitative or variant-specific conclusions without checking the figures/supplement.
      No complete clone sequence or current suffix is inferred solely from gamma2L wording.
- id: PMID:28978485
  title: An Essential Role for the Tetraspanin LHFPL4 in the Cell-Type-Specific Targeting and Clustering
    of Synaptic GABA(A) Receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original full-cache Results and Figure1 caption read. Mouse turboGFP-LHFPL4
      co-immunoprecipitates SEP-tagged gamma2 in COS-7 cells; the separate human LHFPL4 experiment tests
      alpha1. The inspected main text does not independently resolve gamma2 clone species or all supplemental
      construct details. Neuronal localization and receptor retention experiments are distinct from purified
      binary-binding evidence.
- id: PMID:29950725
  title: Structure of a human synaptic GABA(A) receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic native original selected Results/Methods read. Human alpha1/beta2/gamma2 expression
      and patched structural constructs establish receptor function and benzodiazepine-interface contribution.
      Gamma2 carries an N-terminal twin-strep tag and an engineered M3–M4 loop replacement; this is not
      a natural short product. GABA sites are beta/alpha interfaces; flumazenil occupies the alpha/gamma
      interface. Mature-residue numbering and cDNA/transduction ratios differ from physiological stoichiometry.
      No current natural gamma2 suffix is assigned from the engineered construct alone.
- id: PMID:30602789
  title: Cryo-EM structure of the human α1β3γ2 GABA(A) receptor in a lipid bilayer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic native original receptor-purification and electrophysiology Methods explicitly
      identify full-length human gamma2L as UniProt P18507-2 with a C-terminal (GGS)3GK-1D4 tag. Thus
      the natural backbone is explicitly identified independently of a conflicting 1–467 range in UniProt
      reference-position metadata. Nanodisc structural reconstruction and separate cellular current/binding
      assays must remain distinct; unresolved intracellular density is not an absent natural sequence.
      GABA-binding interfaces are beta/alpha, while gamma2 contributes receptor architecture and pore.
- id: PMID:33234346
  title: Regulation of GABA(A)Rs by Transmembrane Accessory Proteins.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: Complete authentic PMC7855156 main text and relevant captions read. The review attributes
      reduced receptor forward trafficking and GABAergic transmission to CLPTM1 and discusses other accessory
      regulators, including SHISA7; gamma2-containing receptors are their targets. The negative-regulation
      NAS attribution is MISCITED for gamma2 as executor, while the paper remains useful receptor biology.
      No universal absence assertion or fabricated replacement identifier is made.
- id: PMID:33436612
  title: Structural basis of GABARAP-mediated GABA(A) receptor trafficking and functions on GABAergic
    synaptic transmission.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PMC7803741 selected original abstract, Results, Methods and binding captions
      read. Methods explicitly use mouse gamma2 P22723-2 and mouse GABARAP/GABARAPL1, with human beta2
      in receptor experiments. Motif mapping and a GABARAPL1-peptide structure corroborate association
      biology but do not verify the human Q9H0R8 context of the original PMID:9892355 record. The reported
      failure of an older short peptide to bind under this assay is not a universal refutation of receptor
      association.
- id: PMID:34417930
  title: 'GABA(A) receptors: structure, function, pharmacology, and related disorders.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic native abstract and selected full-cache structural/distribution sections read.
      This is a review, not a new primary experiment. It correctly describes gamma2-containing GABA-A
      receptor complexes and distinct GABA versus benzodiazepine interfaces, with composition-dependent
      synaptic and extrasynaptic contexts. Broad disease and pharmacology discussion is not converted
      into additional process annotations.
- id: PMID:35355020
  title: Differential assembly diversifies GABA(A) receptor structures and signalling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original selected Results and Methods retained in the shared primary packet were read,
      including human gamma2L construction and alpha4/beta3/gamma2 plus beta3/gamma2 structures. Gamma2L
      is full length with a C-terminal purification tag. Most new detailed GABA/histamine current experiments
      concern delta-containing cell preparations; these are not reassigned to gamma2. Recombinant stoichiometric
      diversity is not direct proof of the abundance or localization of every assembly in native tissue.
- id: PMID:37892178
  title: Extra-Synaptic GABA(A) Receptor Potentiation and Neurosteroid-Induced Learning Deficits Are Inhibited
