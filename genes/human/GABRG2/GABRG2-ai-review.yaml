- id: PMID:39843743
  title: Resolving native GABA(A) receptor structures from the human brain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Selected genuine native human-brain Results and Methods read: lines91/93/103/105/107/109/111/123/129/131/133/141/195/201/203/213/219/229/235.
      Main receptor maps explicitly identify gamma2, including the predominant beta2/alpha1/beta2/alpha1/gamma2
