- id: UniProtKB:P18507
  title: 'UniProtKB reviewed entry P18507: Gamma-aminobutyric acid receptor subunit gamma-2'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official reviewed human identity, alternative products, features and reference metadata
