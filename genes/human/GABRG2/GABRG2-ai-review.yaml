      inspected.'
- id: PMID:9014148
  title: Extensive heterogeneity of recombinant gamma-aminobutyric acidA receptors expressed in alpha
    4 beta 3 gamma 2-transfected human embryonic kidney 293 cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original PubMed abstract read. The experiments explicitly use rat alpha4/beta3/gamma2
      subunits in HEK293 cells and sequential immunoaffinity procedures resolving more than one receptor
      population. This is positive receptor-complex evidence with an ortholog/recombinant scope, not a
      wholly human preparation or proof of one universal stoichiometry. Independent human receptor structures
      support the target complex claim.
- id: PMID:9014159
  title: The gamma 2 subunit of the GABAA receptor is concentrated in synaptic junctions containing the
    alpha 1 and beta 2/3 subunits in hippocampus, cerebellum and globus pallidus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original PubMed abstract read alongside literal rat P18508 donor IDA. The
      abstract explicitly reports gamma2 at junctional membrane specializations, proximal/distal dendritic
      synapses and axo-axonic synapses on axon initial segments, with gamma2-specific immunolabeling.
      The exact donor species comes from the curated donor record; uninspected full Methods and images
      are not claimed read.
- id: PMID:9464994
  title: Segregation of different GABAA receptors to synaptic and extrasynaptic membranes of cerebellar
    granule cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original native abstract read. Adult rat granule-cell immunogold experiments
      explicitly include gamma2 at GABAergic Golgi-cell synapses and at lower concentration in extrasynaptic
      membranes; selected glutamatergic mossy-fiber synapses also label. Golgi-cell synapses are not the
      Golgi organelle. The combined beta2/3 antibody limitation is not transferred to the separately described
      gamma2 label. Images and quantitative reanalysis were not performed.
- id: PMID:9682826
  title: Independent assembly and subcellular targeting of GABA(A)-receptor subtypes demonstrated in mouse
    hippocampal and olfactory neurons in vivo.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed abstract read and exact mouse P22723 donor source traced. The study
      compares alpha2/alpha5 targeting in mouse neurons and describes gamma2 distribution, but the accessible
      abstract does not resolve the specific axonal panel. The source is not rejected from its title or
      incomplete access; independent gamma2 axon-initial-segment evidence is kept distinct.
- id: PMID:9892355
  title: GABA(A)-receptor-associated protein links GABA(A) receptors and the cytoskeleton.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original PubMed abstract read; the original Nature full-text attempt was inaccessible.
      The abstract positively reports gamma2 interaction with GABARAP and synaptic colocalization. It
      does not resolve the distinct human Q9H0R8/GABARAPL1 partner context, which remains UNDECIDED. The
      citation identity is verified; no wrong-identifier or wrong-paralog assertion is inferred from incomplete
      access.
- id: Reactome:R-HSA-975340
  title: GABR heteropentamers:GABA transport Cl- from extracellular region to cytosol
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official reaction/catalyst/participant objects were inspected. The chain 975340→975314→975268→5340318→5357502→975308→975350
      resolves human P18507 residues40–475 at plasma membrane. This establishes target membership in the
