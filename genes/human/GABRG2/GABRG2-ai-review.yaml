core_functions:
- description: Contributes pore-lining and allosteric interface structure to heteromeric GABA-A receptors,
    coupling GABA recognition by the receptor to chloride conductance and postsynaptic signaling. The
    orthosteric GABA interfaces are between beta and alpha subunits; gamma2 contributes the complementary
    side of the benzodiazepine-sensitive alpha/gamma interface. Companion subunits and the chloride gradient
    shape the receptor response.
  contributes_to_molecular_function:
    id: GO:0022851
    label: GABA-gated chloride ion channel activity
  in_complex:
    id: GO:1902711
    label: GABA-A receptor complex
  locations:
