id: P18507
gene_symbol: GABRG2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABRG2 encodes the gamma2 subunit of heteromeric GABA-A receptors, membrane channels that
  conduct chloride in response to GABA. Gamma2 contributes to the channel pore and to the alpha/gamma
  allosteric interface that confers benzodiazepine sensitivity. Gamma2-containing receptors support fast
  inhibitory synaptic signaling and, in particular subunit combinations, extrasynaptic signaling. Their
  synaptic clustering, surface trafficking and pharmacology depend on receptor composition and associated
  proteins. Alternative splicing produces long, short and an additional inserted-segment protein sequence.
  Pathogenic variants can impair receptor assembly, trafficking or channel function and cause epilepsy.
alternative_products:
- name: '1'
  id: P18507-2
  description: Displayed 475-residue long product, gamma2L. PMID30602789 explicitly studies the P18507-2
    backbone with purification tags; PMID35355020 also uses full-length human gamma2L. Native human mass
    spectrometry reports long and short forms, without assigning a splice product to every receptor map.
    Engineered loop replacements are not alternative natural products.
- name: '2'
  id: P18507-1
  sequence_note: VSP_061923
  description: 467-residue short product lacking the eight-residue segment corresponding to displayed
    positions377–384. The sequence was independently matched to its direct FASTA. Native human mass spectrometry
    reports a short gamma2 form, but the inspected data do not assign a unique signaling role or every
    individual structural map to this product.
- name: '3'
  id: P18507-3
  sequence_note: VSP_061922
  description: 515-residue sequence produced by the declared alternative segment at displayed position211.
    Direct FASTA and variation reconstruction agree. No specific functional assay or native assembly assignment
    for this product was established in the inspected literature; functions of tagged long or loop-modified
    constructs are not automatically transferred as product-specific evidence.
