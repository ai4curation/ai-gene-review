suggested_questions:
- question: Which original experiment supports the human GABRG2–GABARAPL1 partner context attributed to
    PMID9892355, and how does it relate to the later mouse motif-binding study?
  experts: []
- question: How are the three verified natural gamma2 products distributed among native receptor assemblies
    and neuronal compartments, especially the515-residue product?
  experts: []
- question: Which native human gamma2-containing receptor combinations mediate extrasynaptic currents
    or histamine modulation, beyond the recombinant and ortholog evidence?
  experts: []
suggested_experiments:
- description: Compare the three sequence-verified human gamma2 products in matched alpha/beta backgrounds
    using surface quantification and electrophysiology, retaining tags and loop substitutions as separate
    experimental variables.
  hypothesis: Natural product differences may alter trafficking or receptor function in a composition-dependent
    manner.
- description: Test sequence-defined human gamma2 and human GABARAPL1 with full-length association and
    purified intracellular-segment binding assays, including the mouse constructs and earlier peptide
    as explicit comparators.
  hypothesis: The conserved interaction mechanism may support the human partner context, but species and
    construct effects require direct resolution.
