id: Q8WUG5
gene_symbol: SLC22A17
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A17 encodes the cell-surface endocytic receptor for lipocalin-2
  (LCN2 / NGAL / 24p3), also known as 24p3R, NgalR, BOCT (brain-type organic cation
  transporter) and lipocalin-2 receptor. Despite its classification in the SLC22 /
  major-facilitator-superfamily "organic cation transporter" family (TC 2.A.1.19),
  it is not a characterized small-molecule transmembrane solute carrier; the
  transporter name reflects its fold and family, not a demonstrated transport
  activity. It is a multi-pass (MFS-fold) plasma-membrane glycoprotein that binds
  secreted lipocalin-2 at the cell surface and internalizes it by
  receptor-mediated endocytosis. Binding and internalization of iron-loaded LCN2
  (holo form) delivers iron into the cell and raises intracellular iron, while
  binding and internalization of iron-free LCN2 (apo form), which then captures an
  intracellular siderophore, removes iron from the cell; through this control of
  cellular iron the receptor modulates cell survival versus apoptosis. SLC22A17 is
  enriched in brain, choroid plexus and pituitary, and its expression is activated
  by RUNX3 and repressed downstream of BCR-ABL via a RUNX1 switch.
