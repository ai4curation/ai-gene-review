core_functions:
- description: Cell-surface receptor for lipocalin-2 (LCN2 / NGAL / 24p3) that binds
    the secreted lipocalin at the plasma membrane and delivers it, as cargo, into
    receptor-mediated endocytosis. Binding and internalization of iron-loaded
    (holo) LCN2 imports iron into the cell; binding and internalization of iron-free
    (apo) LCN2 leads to capture of an intracellular siderophore and iron export.
    This cargo/ligand receptor activity, not solute transport, is the defining
    molecular function of the protein.
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  directly_involved_in:
  - id: GO:0140298
    label: endocytic iron import into cell
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: UniProtKB:Q8WUG5
    supporting_text: Cell surface receptor for LCN2 (24p3) that plays a key role
      in iron homeostasis and transport
    record_section:
    - CC:FUNCTION
  - reference_id: UniProtKB:Q8WUG5
    supporting_text: followed by internalization of holo-24p3 and release of iron,
      thereby increasing intracellular iron concentration
    record_section:
    - CC:FUNCTION
  - reference_id: PMID:17253959
    supporting_text: a physical interaction between NGAL and NgalR-3 could occur in
      mammalian cells
    reference_section_type: RESULTS
  - reference_id: Reactome:R-HSA-5671707
    supporting_text: internalised following binding to the solute carrier family 22
      member 17 (SLC22A17) receptor
proposed_new_terms:
- proposed_name: lipocalin-2 receptor activity
  proposed_definition: Binding specifically to the secreted lipocalin lipocalin-2
    (LCN2 / NGAL / 24p3), including its iron-siderophore-loaded (holo) and iron-free
    (apo) forms, at the cell surface and delivering it to a transport vesicle by
    receptor-mediated endocytosis, thereby mediating cellular uptake of
    lipocalin-bound iron.
  proposed_parent:
    id: GO:0038024
    label: cargo receptor activity
  justification: The characterized molecular function of SLC22A17 (24p3R / NgalR) is
    specifically the binding and endocytic internalization of lipocalin-2. The
    existing cargo receptor activity term (GO:0038024) captures the general receptor
    behaviour used here, but a specific child term for the lipocalin-2 ligand would
    allow precise annotation of this receptor and its orthologs in place of the
    family-derived transmembrane-transporter terms.
  supported_by:
  - reference_id: UniProtKB:Q8WUG5
    supporting_text: Cell surface receptor for LCN2 (24p3) that plays a key role
      in iron homeostasis and transport
    record_section:
    - CC:FUNCTION
suggested_questions:
- question: Does human SLC22A17 retain or exhibit any genuine transmembrane
    solute-transport activity (e.g. organic cations), or is its MFS fold used solely
    as a ligand-binding/endocytic receptor scaffold?
- question: What are the structural determinants on SLC22A17 that recognize holo-
    versus apo-lipocalin-2, and do they explain the opposite iron (uptake vs export)
    and cell-fate (survival vs apoptosis) outcomes?
- question: Which human cell types and physiological or pathological contexts (brain
    iron handling, neurodegeneration, kidney injury, cancer) depend on SLC22A17-
    mediated LCN2 endocytosis versus the alternative LCN2 receptor megalin/LRP2?
suggested_experiments:
- description: Express human SLC22A17 in a transport-null heterologous system and
    test for electrogenic or radiotracer flux of candidate organic-cation and other
    SLC22 substrates under controlled ion/pH gradients, to determine whether it has
    any solute-transport activity distinct from its receptor role.
- description: Use endogenous epitope-tagging with live-cell and pulse-chase imaging
    of fluorescently labelled holo- and apo-LCN2 in human cells to quantify
    SLC22A17-dependent binding, internalization kinetics, endosomal routing and
    receptor recycling, and relate them to intracellular iron and apoptosis
    readouts.
- description: Generate SLC22A17 knockout and ligand-binding-deficient point-mutant
    human cells (and compare with LRP2/megalin knockdown) and measure LCN2 uptake,
    iron import/export and survival, to establish the receptor's necessity and
    specificity for lipocalin-2 endocytosis.
knowledge_gaps:
- gap_statement: Whether human SLC22A17 itself mediates LCN2 endocytosis and endocytic
    iron import, and with what kinetics, is not directly demonstrated; the mechanism is
    inferred from the mouse 24p3/24p3R system and transferred by similarity.
  boundary: Human SLC22A17 is established as a cell-surface LCN2-binding receptor
    (PMID:17253959 shows plasma-membrane localization and a physical LCN2 interaction);
    the endocytosis and iron-flux steps are shown directly only for the mouse ortholog
    (Devireddy et al. 2005).
  gap_kind:
  - BIOLOGY
  significance: These two steps are the gene's proposed defining process (GO:0140298
    endocytic iron import); their human evidence tier is weaker than the
    receptor-binding and localization data, which the review otherwise holds transporter
    rows to.
  resolution: Direct assays of LCN2 internalization kinetics and iron import/export in
    human cells with endogenous (and loss-of-function) SLC22A17.
  provenance:
  - reference_id: PMID:17253959
    supporting_text: how NgalR acts in NGAL-mediated iron-delivery pathways in
      oesophageal carcinoma is as yet unknown, and will require extensive study to
      determine
