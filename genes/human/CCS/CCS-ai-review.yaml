- term:
    id: GO:0006801
    label: superoxide metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001424
  review:
    summary: Superoxide metabolism is propagated from the Cu/Zn SOD domain.
    action: MARK_AS_OVER_ANNOTATED
    reason: CCS is in the Cu/Zn SOD fold family but does not itself metabolize
      superoxide; it works upstream by maturing SOD1. InterPro propagation from the
      catalytic SOD domain therefore overstates the role for CCS.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
    supported_by:
    - reference_id: file:human/CCS/CCS-notes.md
      supporting_text: CCS transfers copper to SOD1 instead of directly dismutating
        superoxide.
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IDA
  original_reference_id: PMID:24026195
  qualifier: enables
  review:
    summary: CCS-mediated thiol chemistry is disulfide oxidoreductase activity, not the reductase direction alone.
    action: MODIFY
    reason: PMID:24026195 supports oxidation-dependent CCS import and SOD1/CCS folding
      in the IMS. It supports disulfide formation, not the reductase reaction named
      by GO:0015035, so the direction-neutral disulfide oxidoreductase term is a
      better replacement.
    proposed_replacement_terms:
    - id: GO:0015036
      label: disulfide oxidoreductase activity
    supported_by:
    - reference_id: PMID:24026195
      supporting_text: During import, a disulphide bond is formed in CCS1 in a
        CCS1-dependent reaction.
