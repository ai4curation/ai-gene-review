id: O14618
gene_symbol: CCS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CCS encodes the copper chaperone for Cu/Zn superoxide dismutase 1, a soluble
  metallochaperone that binds copper and zinc and matures SOD1 by delivering copper and promoting
  SOD1 intramolecular disulfide formation. It acts mainly in the cytosol, with a mitochondrial
  intermembrane-space pool that supports oxidation-dependent import and folding of SOD1 and
  CCS itself.'
