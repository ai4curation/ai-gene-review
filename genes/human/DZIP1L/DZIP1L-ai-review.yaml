core_functions:
- description: DZIP1L binds the septin GTPase SEPTIN2 through its N-terminal region and localizes to centrioles
    and ciliary basal bodies. Endogenous human association and altered PC1/PC2 ciliary distribution support
    a role in ciliary protein organization. Combined human DZIP1/DZIP1L depletion and mouse Dzip1l studies
    support cilium assembly, with mouse experiments also showing Dzip1l-dependent Cby positioning and
    ciliary-bud formation. The contribution of SEPTIN2 binding to each of these outcomes is not independently
    resolved, and neither SEPTIN2 GTPase activity nor universal cilium loss is assigned to DZIP1L.
  molecular_function:
    id: GO:0051020
    label: GTPase binding
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  - id: GO:1903564
    label: regulation of protein localization to cilium
  locations:
  - id: GO:0005814
    label: centriole
  - id: GO:0036064
    label: ciliary basal body
  supported_by:
  - reference_id: PMID:19852954
  - reference_id: PMID:28530676
  - reference_id: PMID:29487109
suggested_questions:
- question: How does SEPTIN2 association contribute to polycystin distribution versus ciliary-bud formation,
    and which effects are independent of changes in cilium number?
- question: Do the complete 767- and 539-residue natural products differ in localization, interaction
    selectivity or rescue capacity when their actual sequences and expression levels are controlled?
- question: Which screen-derived CEP76, TRIM37, AMOTL2 and other associations operate endogenously, and
    how do their roles relate to the ciliary mechanism?
suggested_experiments:
- hypothesis: SEPTIN2 association has separable effects on cargo distribution and cilium formation.
  description: Compare sequence-verified DZIP1L products and targeted association mutants at matched expression,
    measuring SEPTIN2 association, cilium number and PC1/PC2 localization independently in human ciliated
    cells.
  experiment_type: Controlled rescue and quantitative imaging
- hypothesis: Some screen-derived partner associations occur in a restricted cell or product context.
  description: Test selected endogenous pairs with appropriate reciprocal and negative controls, retaining
    the original fragment/full-length distinctions; functional pathway changes should be measured separately
    from binding.
  experiment_type: Interaction and context analysis
