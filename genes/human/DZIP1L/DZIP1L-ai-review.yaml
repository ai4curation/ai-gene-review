id: Q8IYY4
gene_symbol: DZIP1L
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DZIP1L is a centriolar and ciliary basal-body protein with a C2H2 zinc-finger region and
  a coiled coil. It associates with SEPTIN2 and CBY1 and participates in the organization of ciliary proteins
  and cilium assembly. Human DZIP1L deficiency can alter polycystin localization in cilia, while the effects
  on cilium formation vary with cell type and organism.
alternative_products:
- name: '1'
  id: Q8IYY4-1
  description: Displayed 767-residue product retaining the annotated C2H2 zinc-finger region and coiled
    coil. The archived IMAGE4940443 clone used for human localization has the same length but three differences
    from the current sequence, so clone architecture does not establish an exact natural-product assay.
    The N-terminal SEPTIN2-binding region is present; no DNA-binding or transcriptional activity follows
    from the zinc-finger annotation alone.
- name: '2'
  id: Q8IYY4-2
  sequence_note: VSP_033158, VSP_033159
  description: 539-residue product with V539G and absence of displayed residues 540–767. It retains the
    annotated C2H2 region, coiled coil and N-terminal region sufficient for SEPTIN2 association in fragment
    assays. These sequence facts do not establish equivalent localization, ciliary-protein regulation
    or cilium-assembly function of the complete short product. The archived short clone also differs from
    its current official sequence.
