  SL_mapping:
    name: Centriole
    id: SL-0046
    definition: The centriole is a barrel-shaped microtubule-based structure. A pair of centrioles, embedded
      in the so-called pericentriolar material, constitute the centrosome, a microtubule organizing center
      of an eukaryotic cell. Centrioles are barrel-shaped microtubule-based structures organized in a
      9-fold radial symmetry. Centriolar microtubule arrays usually consist of triplet microtubules, although
      doublets or singlets are present in some species. Centrioles are structurally related to (and often
      interconvertible with) basal bodies, the organelles required for the assembly of a cilium or flagellum.
    content: Cytoplasm, cytoskeleton, microtubule organizing center, centrosome, centriole
    statistics:
      reviewedProteinCount: 498
      unreviewedProteinCount: 58409
    category: Cellular component
    geneOntologies:
    - goId: GO:0005814
      name: centriole
    partOf:
    - name: Centrosome
      id: SL-0048
      definition: The centrosome is a microtubule organizing center (MTOC) responsible for the nucleation
        and organisation of  microtubules. It is composed of two orthogonally arranged centrioles, each
        one having a barrel shaped microtubule structure, and their surrounding pericentriolar material
        (PCM).
      content: Cytoplasm, cytoskeleton, microtubule organizing center, centrosome
      category: Cellular component
      geneOntologies:
      - goId: GO:0005813
        name: centrosome
      partOf:
      - name: Microtubule organizing center
        id: SL-0484
        definition: The microtubule organizing center (MTOC) is an intracellular structure that can catalyze
          gamma-tubulin-dependent microtubule nucleation and that can anchor microtubules.
        content: Cytoplasm, cytoskeleton, microtubule organizing center
        category: Cellular component
        geneOntologies:
        - goId: GO:0005815
          name: microtubule organizing center
        synonyms:
        - MTOC
        partOf:
        - name: Cytoskeleton
          id: SL-0090
          definition: The cytoskeleton is a dynamic three-dimensional filamentous structure in the cytoplasm.
            Its roles include maintenance of cell shape, cell movement (in eukaryotes), cytokinesis, and
            the organization of organelles or organelle-like structures within the cell. The cytoskeleton
            includes microfilaments (actin-like proteins), microtubules (tubulin-like proteins), the intermediate
            filaments (mostly in eukaryotes) and the MinD-ParA proteins, which appear to be unique to
            prokaryotes.
          content: Cytoplasm, cytoskeleton
          keyword:
            name: Cytoskeleton
            id: KW-0206
          category: Cellular component
          geneOntologies:
          - goId: GO:0005856
            name: cytoskeleton
          partOf:
          - name: Cytoplasm
            id: SL-0086
            definition: The cytoplasm is the content of a cell within the plasma membrane and, in eukaryotics
              cells, surrounding the nucleus. This three-dimensional, jelly-like lattice interconnects
              and supports the other solid structures. The cytosol (the soluble portion of the cytoplasm
              outside the organelles) is mostly composed of water and many low molecular weight compounds.
              In eukaryotes, the cytoplasm also contains a network of cytoplasmic filaments (cytoskeleton).
            content: Cytoplasm
            keyword:
              name: Cytoplasm
              id: KW-0963
            category: Cellular component
            geneOntologies:
            - goId: GO:0005737
              name: cytoplasm
