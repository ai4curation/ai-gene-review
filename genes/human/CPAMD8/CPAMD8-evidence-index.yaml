  scope: Actual selected full-text human variant-burden, target-specific zebrafish Results/Methods and
    original XML Figure7 caption were read. Double heterozygous cpamd8/adamtsl4 zebrafish show altered
    anterior chamber and lens volumes relative to sibling controls. The transfected-protein retention/ER-stress
    assays concern ADAMTSL4, not CPAMD8. A genetic interaction is not evidence of direct physical binding
    or a CPAMD8 metalloprotease mechanism.
