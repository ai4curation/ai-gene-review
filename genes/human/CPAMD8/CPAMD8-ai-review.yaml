id: Q8IZJ3
gene_symbol: CPAMD8
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPAMD8 is a large secretory-pathway glycoprotein of the alpha-2-macroglobulin/complement
  family with a C-terminal Kazal-like domain. It occurs in membrane-associated and soluble
  extracellular pools and undergoes proteolytic processing. CPAMD8 is required for normal
  development of the ocular anterior segment; biallelic loss-of-function variants cause iris,
  lens and iridocorneal abnormalities, sometimes with glaucoma. Its Kazal domain binds heparin
  in a reported biochemical experiment, but the physiological ligand and the molecular activity
  linking CPAMD8 to eye development remain unresolved.
