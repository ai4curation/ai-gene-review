suggested_questions:
- question: Which physiological ligand or enzymatic target mediates CPAMD8-dependent anterior-segment
    development, and does CPAMD8 directly inhibit any endopeptidase?
- question: How do proteolytic processing and the alternative C-terminal sequences affect soluble versus
    membrane-associated CPAMD8 and its ligand interactions?
suggested_experiments:
- hypothesis: A defined CPAMD8 product directly modulates a specific extracellular protease or ligand
    pathway.
  description: Compare sequence-defined full-length products, processed fragments and Kazal-domain constructs
    in direct binding and activity assays with appropriate positive and negative controls. Test candidate
    proteases with protein and small-peptide substrates so steric trapping can be distinguished from catalytic-site
    inhibition, then connect any identified activity to rescue in a relevant ocular model.
  experiment_type: Biochemistry and activity-specific rescue
knowledge_gaps:
