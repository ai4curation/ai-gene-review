- id: PMID:27839872
  title: Mutations in CPAMD8 Cause a Unique Form of Autosomal-Recessive Anterior Segment Dysgenesis.
  findings:
  - statement: Recessive human variants with abnormal splicing and anterior-segment dysgenesis
      support a requirement for CPAMD8 in normal eye development; spatial expression correlates
      with the affected tissues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete unique main-text paragraphs12–32 and abstract7 were read in the
      genuine full cache, including patient variants, splicing assays and human developmental
      expression. These support the existing human developmental phenotype scope; they do
      not identify a direct biochemical effector. Publication-specific 1932/1863-aa transcript
      names are not silently equated to current reviewed1885/1815-aa products. No figure-pixel
      or supplement read is claimed for this paper.
- id: PMID:15177561
  title: Identification and characterization of CPAMD8, a novel member of the complement 3/alpha2-macroglobulin
    family with a C-terminal Kazal domain.
  findings:
  - statement: The original abstract reports heparin binding by the Kazal domain and ionic
      membrane association; the detailed biochemical assays remain inaccessible.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine and PubMed abstracts directly report Kazal-domain heparin
      binding, proteolytic processing and ionic membrane association. Bounded original recovery
      did not obtain full Methods/Results. Heparin activity is positively reported, but construct
      coordinates, quantitative affinity and any inhibition assay remain unassessed; the abstract
      immune-role suggestion is not demonstrated participation.
- id: PMID:32274568
  title: CPAMD8 loss-of-function underlies non-dominant congenital glaucoma with variable
    anterior segment dysgenesis and abnormal extracellular matrix.
  findings:
  - statement: Human aqueous and vitreous humor contain immunodetected CPAMD8 fragments; the
      ocular developmental perturbation experiments leave the underlying effector mechanism
      unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache remains abstract-only. Independently recovered publisher
      PDF was read at selected original Methods, human localization, zebrafish CRISPR Results
      and Discussion scopes, with Figure8 page1222 pixels inspected. Three-antibody ocular-fluid
      results report fragments; supplementary FigureS7 was not recovered. The actual Discussion
      labels protease-inhibitor and ligand mechanisms speculative/putative. Genetic perturbation
      and altered matrix organization do not establish a direct protease, inhibitor or matrix-assembly
      mechanism.
- id: PMID:32085876
  title: Biallelic CPAMD8 Variants Are a Frequent Cause of Childhood and Juvenile Open-Angle
    Glaucoma.
  findings:
  - statement: Biallelic human variants associate with heterogeneous anterior-segment disease
      and glaucoma; adult-eye RNA expression is prominent in ciliary body and corneal epithelium.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal abstract and selected original public repository PDF Methods,
      ocular RNA-seq Results and Discussion were read. Human biallelic variants and adult-eye
      RNA expression corroborate ocular involvement; this study does not resolve molecular
      function. The normal abstract-only flag is preserved.
- id: PMID:38891949
  title: The Increased Burden of Rare Variants in Four Matrix Metalloproteinase-Related Genes
    in Childhood Glaucoma Suggests a Complex Genetic Inheritance of the Disease.
  findings:
  - statement: Combined heterozygous loss of cpamd8 and adamtsl4 alters zebrafish anterior-eye
      geometry; cultured ADAMTSL4 variant experiments must not be attributed to CPAMD8.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full-text human variant-burden, target-specific zebrafish
      Results/Methods and original XML Figure7 caption were read. Double heterozygous cpamd8/adamtsl4
      zebrafish show altered anterior chamber and lens volumes relative to sibling controls.
      The transfected-protein retention/ER-stress assays concern ADAMTSL4, not CPAMD8. A genetic
      interaction is not evidence of direct physical binding or a CPAMD8 metalloprotease mechanism.
- id: PMID:42692183
  title: Three-dimensional primary myofibroblast culture reveals morphological alterations
    in CPAMD8 deficiency.
  findings:
  - statement: The abstract reports altered growth and selected transcripts after CPAMD8 knockdown
      in a human primary-myofibroblast3D model, without resolving direct biochemical activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete genuine 2026 abstract was read; publisher full-text access returned403.
      Human ciliary-muscle primary myofibroblast siRNA cultures show altered aggregate growth
      and expression, including selected TGF-beta receptor transcripts. These data do not
      establish direct TGF-beta ligand/receptor binding, pathway inhibition or an autonomous
      proliferation activity. Detailed constructs, controls and full Results remain unassessed.
