existing_annotations:
- term:
    id: GO:0001654
    label: eye development
  evidence_type: IMP
  original_reference_id: PMID:27839872
  qualifier: involved_in
  review:
    summary: Human CPAMD8 supports normal camera-type eye development, especially anterior-segment formation.
    action: MODIFY
    reason: PMID27839872 identifies recessive CPAMD8 variants in three human families with iris and lens
      dysgenesis and directly tests abnormal splicing in patient RNA or minigenes. Its developmental expression
      analysis is consistent with the affected structures. The current GO:0043010 definition specifies
      the camera-type eye and is a more precise child of the original eye-development term for this human
      evidence. Preserve the curated IMP participation claim without claiming that expression alone identifies
      the molecular step. Independent human and zebrafish studies support anterior-segment development,
      while the extracellular effector mechanism remains unresolved; no new developmental process is proposed.
    proposed_replacement_terms:
    - id: GO:0043010
      label: camera-type eye development
    supported_by:
    - reference_id: PMID:27839872
      supporting_text: 'CPAMD8 splice-site mutations caused aberrant pre-mRNA splicing in vivo or

        in vitro.'
    additional_reference_ids:
    - PMID:32274568
    - PMID:32085876
    - PMID:38891949
- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001599
  - InterPro:IPR002890
  review:
    summary: The electronic endopeptidase-inhibitor assignment remains unresolved at target-specific activity
      level.
    action: UNDECIDED
    reason: 'CPAMD8 itself has a predicted Kazal-like domain at residues 1706–1757 in the reviewed sequence,
      with IPR002350, PF07648 and SSF100895 domain-family assignments. This is independent architectural
      support for a possible protease-inhibitor activity and is distinct from the literal IEA sources
      IPR001599 and IPR002890, which are broad alpha-macroglobulin/MG2 mappings. The original PMID:15177561
      abstract describes a serine-proteinase-inhibitor/follistatin-like Kazal domain and reports heparin
      binding; neither its domain label nor that ligand-binding result establishes the binding and reduction
      of endopeptidase activity required by GO:0004866. PMID:32274568 presents the inhibitor mechanism
      as putative. Full original biochemical Methods/Results remain unavailable, so a target-specific
      inhibition assay cannot be confirmed or excluded. Retain UNDECIDED: the architecture supports the
      hypothesis, but inhibition, a specific inhibited protease and any loss of inhibitory activity remain
      unresolved.'
    additional_reference_ids:
    - PMID:15177561
    - PMID:32274568
    - PMID:27839872
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: InterPro:IPR001599
        source_status: UNRESOLVED
        comment: Actual alpha-macroglobulin-domain mapping emits GO:0004866; the broad family description
          does not resolve CPAMD8 inhibition.
      - source_id: InterPro:IPR002890
        source_status: UNRESOLVED
        comment: Actual MG2-domain mapping emits GO:0004866 and includes broader thioester-containing
          proteins; no CPAMD8-specific inhibition result was recovered.
    supported_by:
    - reference_id: PMID:15177561
    - reference_id: PMID:32274568
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR009048
  - InterPro:IPR011626
  - InterPro:IPR036595
  - UniProtKB-SubCell:SL-0243
  review:
    summary: CPAMD8 has a soluble extracellular pool distinct from its membrane-associated pool.
    action: ACCEPT
    reason: 'CPAMD8 has a soluble extracellular pool: PMID:32274568 reports N- and C-terminal fragments
      in human aqueous and vitreous humor using three antibodies, separately from tissue immunofluorescence.
      Intact CPAMD8 was not identified in these fluids. This supports extracellular protein products without
      assigning a fragment-specific activity or cleavage mechanism. The current GO:0005576 definition
      accommodates this pool; cell-surface attachment alone would not. GO:0005615 extracellular space
      is obsolete and replaced by GO:0005576: fresh QuickGO and OLS responses on 2026-10-12 confirm
      this status, independently documented in the completed ontology issue
      [GO issue 31545](https://github.com/geneontology/go-ontology/issues/31545) and the
      [current OLS record](https://www.ebi.ac.uk/ols4/ontologies/go/classes?iri=http%3A%2F%2Fpurl.obolibrary.org%2Fobo%2FGO_0005615).
      Older repository label caches do not establish the current term status. The fluid location
      therefore does not justify replacing the source term with that obsolete ID. The literal InterPro and secretion-vocabulary mappings agree
      with the independent target evidence. Retain this basic secretory localization as core cellular
      context; the unresolved physiological molecular activity, represented by an empty formal core-function
      synthesis, does not negate the established location.'
    additional_reference_ids:
    - PMID:32274568
    - PMID:15177561
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR009048
        source_status: SUPPORTS_TRANSFER
        comment: Receptor-binding-domain entry maps to GO:0005576; independent human ocular-fluid evidence
          supports the location.
      - source_id: InterPro:IPR011626
        source_status: SUPPORTS_TRANSFER
        comment: TED-domain entry maps to GO:0005576; this is localization support, not proof of complement
          chemistry in CPAMD8.
      - source_id: InterPro:IPR036595
        source_status: SUPPORTS_TRANSFER
        comment: Receptor-binding-domain superfamily maps to GO:0005576; target-specific soluble fragments
          provide independent support.
      - source_id: UniProtKB-SubCell:SL-0243
        source_status: SUPPORTS_TRANSFER
        comment: Official Secreted vocabulary maps to GO:0005576; human aqueous/vitreous fragment detection
          supports a soluble pool.
- term:
