- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:15177561
  review:
    summary: The CPAMD8 Kazal domain has a reported heparin-binding activity.
    action: NEW
    reason: The primary abstract explicitly reports Kazal-domain binding to heparin, and reviewed
      UniProt independently records the same paper as experimental interaction evidence. This
      narrow molecular-function proposal retains that positive result without claiming an
      endogenous heparan-sulfate ligand, a binding affinity, an isoform-specific assay or
      a causal heparin-binding step in eye development. Full Methods/Results and the experimental
      construct boundaries were not recovered. Current typed ancestry shows no ancestor/descendant
      redundancy with the existing GO:0004866 activity; the other original terms are BP or
      CC. It is not promoted to a formal core function because its physiological importance
      is unresolved.
