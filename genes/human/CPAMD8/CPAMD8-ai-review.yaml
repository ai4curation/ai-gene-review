core_functions: []
suggested_questions:
- question: Which physiological ligand or enzymatic target mediates CPAMD8-dependent anterior-segment
    development, and does CPAMD8 directly inhibit any endopeptidase?
- question: How do proteolytic processing and the alternative C-terminal sequences affect
    soluble versus membrane-associated CPAMD8 and its ligand interactions?
suggested_experiments:
- hypothesis: A defined CPAMD8 product directly modulates a specific extracellular protease
    or ligand pathway.
  description: Compare sequence-defined full-length products, processed fragments and Kazal-domain
    constructs in direct binding and activity assays with appropriate positive and negative
    controls. Test candidate proteases with protein and small-peptide substrates so steric
    trapping can be distinguished from catalytic-site inhibition, then connect any identified
    activity to rescue in a relevant ocular model.
  experiment_type: Biochemistry and activity-specific rescue
knowledge_gaps:
- gap_statement: The primary molecular activity by which CPAMD8 supports ocular anterior-segment
    development is unresolved; neither a specific inhibited endopeptidase nor an endogenous
    ligand-mediated step is established.
  boundary: Human developmental genetics, extracellular/membrane-associated pools and reported
    Kazal-domain heparin binding are established at their respective source scopes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: These observations do not yet connect a defined molecular activity to ocular
    development.
  resolution: Identify a direct physiological target and show activity-specific rescue with
    sequence-defined CPAMD8 products.
