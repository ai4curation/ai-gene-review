  review:
    summary: CPAMD8 has a soluble extracellular pool distinct from its membrane-associated
      pool.
    action: ACCEPT
    reason: The current GO:0005576 comment excludes products attached to the cell surface,
      so membrane association alone is not its supporting evidence. PMID32274568 independently
      reports CPAMD8 fragments in human aqueous and vitreous humor using three antibodies
