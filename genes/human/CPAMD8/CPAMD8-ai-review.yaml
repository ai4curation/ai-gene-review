- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001599
  - InterPro:IPR002890
  review:
    summary: The electronic endopeptidase-inhibitor assignment remains unresolved at target-specific
      activity level.
    action: UNDECIDED
    reason: The literal sources IPR001599 and IPR002890 are broad alpha-macroglobulin/MG2
      entries that map to GO:0004866; they are not the C-terminal Kazal-domain annotation.
      Their descriptions also encompass related complement and thioester-containing proteins,
      so family membership alone does not settle target-specific inhibition. GO:0004866 requires
      binding and reducing endopeptidase activity. The original PMID15177561 abstract reports
      heparin binding and membrane association, but its detailed inhibition assays, if any,
      could not be assessed because full text was not recovered. The actually read PMID32274568
      Methods/Results concern genetics, localization and developmental perturbation; its Discussion
      calls the proteinase-inhibitor mechanism putative. This neither establishes inhibition
      nor demonstrates its absence. Retain uncertainty rather than asserting loss of activity
      or removing a potentially valid transfer.
    additional_reference_ids:
    - PMID:15177561
    - PMID:32274568
    - PMID:27839872
    - file:human/CPAMD8/CPAMD8-evidence-index.yaml
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: InterPro:IPR001599
        source_status: UNRESOLVED
        comment: Actual alpha-macroglobulin-domain mapping emits GO:0004866; the broad family
          description does not resolve CPAMD8 inhibition.
      - source_id: InterPro:IPR002890
        source_status: UNRESOLVED
        comment: Actual MG2-domain mapping emits GO:0004866 and includes broader thioester-containing
