  review:
    summary: CPAMD8 can associate peripherally with the plasma membrane.
    action: ACCEPT
    reason: The original PMID:15177561 abstract reports ionic membrane association. Reviewed UniProt annotates
      peripheral cell-membrane association on the extracellular side with experimental support from that
      paper, and SL-0039 maps to GO:0005886. Retain the broad electronic location as a basic property
      of the membrane-associated CPAMD8 pool, compatible with separately detected soluble extracellular
      fragments. It is not merely a downstream developmental phenotype, so ACCEPT and NO_FAILURE_CORE
      describe the cellular location while the primary molecular effector remains unknown. No transmembrane
      helix, GPI anchor or additional surface-topology refinement is inferred; original assay and construct
      details remain unavailable.
    supported_by:
    - reference_id: PMID:15177561
      supporting_text: CPAMD8 is membrane associated via ionic interaction.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0039
        source_status: SUPPORTS_TRANSFER
        comment: Official Cell membrane maps to GO:0005886; reviewed target annotation cites the original
          membrane-association experiment.
- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:15177561
  review:
    summary: The CPAMD8 Kazal domain has a reported heparin-binding activity.
    action: NEW
    reason: The primary abstract explicitly reports Kazal-domain binding to heparin, and reviewed UniProt
      independently records the same paper as experimental interaction evidence. This narrow molecular-function
      proposal retains that positive result without claiming an endogenous heparan-sulfate ligand, a binding
      affinity, an isoform-specific assay or a causal heparin-binding step in eye development. Full Methods/Results
      and the experimental construct boundaries were not recovered. Current typed ancestry shows no ancestor/descendant
      redundancy with the existing GO:0004866 activity; the other original terms are BP or CC. It is not
      promoted to a formal core function because its physiological importance is unresolved.
    supported_by:
