    label: eye development
  evidence_type: IMP
  original_reference_id: PMID:27839872
  qualifier: involved_in
  review:
    summary: Human CPAMD8 supports normal camera-type eye development, especially anterior-segment
      formation.
    action: MODIFY
    reason: PMID27839872 identifies recessive CPAMD8 variants in three human families with
      iris and lens dysgenesis and directly tests abnormal splicing in patient RNA or minigenes.
      Its developmental expression analysis is consistent with the affected structures. The
      current GO:0043010 definition specifies the camera-type eye and is a more precise child
      of the original eye-development term for this human evidence. Preserve the curated IMP
      participation claim without claiming that expression alone identifies the molecular
      step. Independent human and zebrafish studies support anterior-segment development,
      while the extracellular effector mechanism remains unresolved; no new developmental
      process is proposed.
    proposed_replacement_terms:
    - id: GO:0043010
      label: camera-type eye development
    supported_by:
