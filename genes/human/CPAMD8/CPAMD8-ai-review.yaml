    is unresolved; neither a specific inhibited endopeptidase nor an endogenous ligand-mediated step is
    established.
  boundary: Human developmental genetics, extracellular/membrane-associated pools and reported Kazal-domain
    heparin binding are established at their respective source scopes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: These observations do not yet connect a defined molecular activity to ocular development.
  resolution: Identify a direct physiological target and show activity-specific rescue with sequence-defined
