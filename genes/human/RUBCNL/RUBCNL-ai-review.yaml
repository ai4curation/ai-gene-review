  evidence_type: IPI
  original_reference_id: PMID:30704899
  qualifier: enables
  review:
    summary: IPI with MTOR (P42345). PACER is an mTORC1 substrate; the interaction
      reflects enzyme-substrate binding, not a PACER molecular function.
    action: REMOVE
    reason: The cited study shows mTORC1 phosphorylates PACER at Ser157 to switch off
      its function. Binding by the kinase describes MTOR's activity on PACER as a
      substrate, so no informative PACER molecular function can replace protein binding.
      Removal does not mean the interaction is false; it is captured by MTOR's kinase
      annotation and by PACER's regulation, not by a PACER binding term.
    additional_reference_ids: *id001
    supported_by:
    - reference_id: PMID:30704899
      supporting_text: mTORC1 phosphorylates Pacer at serine157 to disrupt the association
        of Pacer with Stx17 and the HOPS complex
    - reference_id: file:human/RUBCNL/RUBCNL-uniprot.txt
      supporting_text: Phosphorylated by MTOR at Ser-157 under nutrient-rich conditions
  supporting_entities:
  - UniProtKB:P42345
