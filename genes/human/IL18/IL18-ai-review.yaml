existing_annotations:
- term:
    id: GO:0005125
    label: cytokine activity
  evidence_type: IDA
  original_reference_id: PMID:14528293
  qualifier: enables
  review:
    summary: Mature IL-18 has cytokine activity as an IL18R1/IL18RAP receptor
      agonist.
    action: ACCEPT
    reason: 'Accept cytokine activity for all GOA rows asserting it, including the
      IBA/IEA/ISS/TAS rows: mature IL-18 binds IL18R1, recruits IL18RAP, forms a signaling
      ternary complex, and activates NF-kappa-B-dependent inflammatory gene expression.
      This MF is the core activity represented by the terminal IL18 node in the NLRP3
      inflammasome GO-CAM.'
    supported_by:
    - reference_id: PMID:14528293
      supporting_text: The structure and mutagenesis data provide a basis for
        understanding the IL-18-induced heterodimerization of receptor subunits,
        which is necessary for receptor activation.
    - reference_id: PMID:25500532
      supporting_text: A complete loss of function was observed for the
        IL-18Rβ-E210A-Y212A-Y214A triple mutants, while IL-18Rβ-E210A, -Y212A
        and -K313A exhibited approximately half the activity compared with -WT.
- term:
    id: GO:0035655
    label: interleukin-18-mediated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:25500532
  qualifier: involved_in
  review:
    summary: Extracellular mature IL-18 initiates IL-18-mediated receptor
      signaling.
    action: ACCEPT
    reason: Mature IL-18 is not merely an inflammasome substrate. The active
      cytokine executes the ligand step of the IL-18-mediated signaling pathway
      by binding IL18R1, recruiting IL18RAP, and producing an
      NF-kappa-B-competent receptor complex.
    supported_by:
    - reference_id: PMID:25500532
      supporting_text: IL-18 forms a signalling complex with the IL-18 receptor
        α (Rα) and β (Rβ) chains at the plasma membrane, which induces multiple
        inflammatory cytokines.
    - reference_id: PMID:25500532
      supporting_text: A complete loss of function was observed for the
        IL-18Rβ-E210A-Y212A-Y214A triple mutants, while IL-18Rβ-E210A, -Y212A
        and -K313A exhibited approximately half the activity compared with -WT.
- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: IDA
  original_reference_id: PMID:11466388
  qualifier: involved_in
  review:
    summary: IL-18 can promote endothelial angiogenic behavior.
    action: KEEP_AS_NON_CORE
    reason: Human IL-18 was directly tested on endothelial cells and in
      Matrigel/sponge angiogenesis assays. This angiogenic role is retained as a
      non-core inflammatory or vascular output of the cytokine rather than as
      the conserved core function.
    supported_by:
    - reference_id: PMID:11466388
      supporting_text: IL-18, 1 or 10 nM, resulted in a 77% or 87% increase in
        tube formation compared with control
- term:
    id: GO:0002826
    label: negative regulation of T-helper 1 type immune response
  evidence_type: NAS
  original_reference_id: PMID:35398099
  qualifier: involved_in
  review:
    summary: IL18BP-mediated sequestration of IL-18 is a negative regulator of
      Th1 signaling, but IL-18 is the captured ligand.
    action: MARK_AS_OVER_ANNOTATED
    reason: The decoy-receptor biology is real, yet the inhibitory function is
      executed by IL18BP. IL-18 participates as the sequestered cytokine, so
      annotating IL18 itself to negative regulation of Th1 immune response
      overstates the ligand role.
    supported_by:
    - reference_id: PMID:35398099
      supporting_text: The sequestration of IL-18 by its soluble decoy receptor
        IL-18-Binding Protein (IL-18BP) is critical to the regulation of IL-18
        activity.
