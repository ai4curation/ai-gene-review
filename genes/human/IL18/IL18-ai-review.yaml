core_functions:
- description: >-
    Extracellular IL18R1/IL18RAP agonist cytokine activity of mature IL-18. The
    cytosolic pro-IL-18 precursor is inactive until inflammatory caspases, chiefly
    CASP1 in canonical inflammasomes and CASP4/CASP5 in noncanonical human
    inflammasome signaling, remove its N-terminal propeptide; mature IL-18 is
    released from the producing cell and binds IL18R1, enabling IL18RAP
    recruitment and downstream NF-kappa-B/MAPK inflammatory signaling.
  molecular_function:
    id: GO:0005125
    label: cytokine activity
