core_functions:
- description: Extracellular IL18R1/IL18RAP agonist cytokine activity of mature
    IL-18. The cytosolic pro-IL-18 precursor is inactive until inflammatory
    caspases, chiefly CASP1 in canonical inflammasomes and CASP4/CASP5 in
    noncanonical human inflammasome signaling, remove its N-terminal propeptide;
    mature IL-18 is released from the producing cell and binds IL18R1, enabling
    IL18RAP recruitment and downstream NF-kappa-B/MAPK inflammatory signaling.
  molecular_function:
    id: GO:0005125
    label: cytokine activity
  directly_involved_in:
  - id: GO:0035655
    label: interleukin-18-mediated signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:14528293
    supporting_text: The structure and mutagenesis data provide a basis for
      understanding the IL-18-induced heterodimerization of receptor subunits,
      which is necessary for receptor activation.
  - reference_id: PMID:33883744
    supporting_text: the pores favour the passage of IL-1β and IL-18 over that
      of their precursors.
  - reference_id: PMID:37993714
    supporting_text: Cleavage by caspase-1, -4 or -5 induces substantial
      conformational changes of IL-18 to generate two critical receptor-binding
      sites.
suggested_questions:
- question: In primary human myeloid cells, how much mature IL-18 is released
    through GSDMD pores versus the TMED10/ERGIC route, and are the two routes
    used by the same cells or by distinct stimulation states?
- question: Which human infection contexts use direct CASP4/CASP5 maturation of
    pro-IL-18 as a major source of extracellular mature IL-18, independently of
    CASP1?
suggested_experiments:
- description: Compare IL-18 secretion in primary human macrophages carrying
    acute CASP1, CASP4, CASP5, GSDMD and TMED10 perturbations under canonical
    NLRP3 stimuli and cytosolic-LPS/noncanonical stimuli, measuring precursor
    cleavage, GSDMD pore formation and extracellular mature IL-18 in the same
    time course.
