      precursors.
  - reference_id: PMID:37993714
    supporting_text: >-
      Cleavage by caspase-1, -4 or -5 induces substantial conformational changes
      of IL-18 to generate two critical receptor-binding sites.
suggested_questions:
- question: >-
    In primary human myeloid cells, how much mature IL-18 is released through
    GSDMD pores versus the TMED10/ERGIC route, and are the two routes used by the
    same cells or by distinct stimulation states?
- question: >-
    Which human infection contexts use direct CASP4/CASP5 maturation of pro-IL-18
    as a major source of extracellular mature IL-18, independently of CASP1?
suggested_experiments:
- description: >-
    Compare IL-18 secretion in primary human macrophages carrying acute CASP1,
    CASP4, CASP5, GSDMD and TMED10 perturbations under canonical NLRP3 stimuli and
    cytosolic-LPS/noncanonical stimuli, measuring precursor cleavage, GSDMD pore
    formation and extracellular mature IL-18 in the same time course.
