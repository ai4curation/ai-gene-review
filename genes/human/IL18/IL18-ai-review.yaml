id: Q14116
gene_symbol: IL18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interleukin-18 is a leaderless IL-1 family cytokine that is
  synthesized as an inactive 193 amino-acid cytosolic precursor. In canonical
  inflammasome signaling, caspase-1 cleaves pro-IL-18 after Asp36 to generate
  the mature cytokine, and human caspase-4 and caspase-5 can mature the same
  substrate during noncanonical inflammasome activation. Mature IL-18 is
  released from activated cells through gasdermin-D pores or through other
  unconventional secretion routes, then acts in the extracellular region by
  binding IL18R1 and IL18RAP to form a ternary receptor complex that activates
  NF-kappa-B and MAPK inflammatory signaling. It promotes interferon-gamma
  production by T helper 1 cells and natural killer cells, enhances NK-cell
  cytotoxicity, and contributes to host-defense and autoinflammatory responses.
  A Delta3pro splice isoform described in ovarian tumors lacks a segment of the
  pro-domain and resists maturation by caspase-1 and caspase-4.
