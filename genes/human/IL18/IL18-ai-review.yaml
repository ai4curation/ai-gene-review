- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:23955712
  qualifier: located_in
  review:
    summary: Mature IL-18 is released to the extracellular region.
    action: ACCEPT
    reason: The biologically active cytokine acts extracellularly after
      nonclassical secretion. GSDMD pores preferentially pass mature IL-18 over
      its acidic precursor, and the extracellular region is the location used by
      the NLRP3 inflammasome GO-CAM terminal IL18 cytokine node.
    supported_by:
    - reference_id: PMID:33883744
      supporting_text: the pores favour the passage of IL-1β and IL-18 over that
        of their precursors.
    - reference_id: file:human/IL18/IL18-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Mature form is secreted and released in the extracellular
        milieu by passing through the gasdermin-D (GSDMD) pore
