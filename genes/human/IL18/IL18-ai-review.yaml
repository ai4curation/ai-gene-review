  review:
    summary: >-
      Proposed annotation for mature IL-18 cytokine activity. Human IL-18 binds
      IL18R1 and IL18RAP to form a signaling ternary complex that triggers
      inflammatory gene expression.
    action: NEW
    reason: >-
      IL18 has no GOA rows despite direct structural and mutational evidence for
      receptor-dependent cytokine activity. PMID:14528293 mapped IL-18 receptor
      activation sites, PMID:25261253 resolved the IL-18:IL18R1 binary complex,
      and PMID:25500532 resolved the human IL-18:IL18R1:IL18RAP ternary complex
      and tested interface mutants for NF-kappa-B signaling. The NLRP3
      inflammasome GO-CAM already uses GO:0005125 for the terminal mature-IL18
      activity, and this new row fills the missing gene-review side of that
      activity.
    supported_by:
    - reference_id: PMID:14528293
      supporting_text: >-
        The structure and mutagenesis data provide a basis for understanding the
        IL-18-induced heterodimerization of receptor subunits, which is necessary
        for receptor activation.
    - reference_id: file:human/IL18/IL18-uniprot.txt
      supporting_text: >-
        Upon binding to IL18R1 and IL18RAP, forms a signaling ternary complex
        which activates NF-kappa-B, triggering synthesis of inflammatory
        mediators
- term:
    id: GO:0035655
    label: interleukin-18-mediated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:25500532
  qualifier: involved_in
  review:
    summary: >-
      Proposed annotation for the receptor pathway initiated by extracellular
      mature IL-18.
    action: NEW
    reason: >-
      Mature IL-18 is the ligand that binds IL18R1 and recruits IL18RAP to
      assemble the ternary receptor complex that activates downstream IL-18
      receptor signaling. This is direct participation: IL-18 itself performs the
      receptor-engaging step of the IL-18-mediated signaling pathway, rather than
      merely being a substrate for the inflammasome proteases that mature it.
    supported_by:
    - reference_id: PMID:25500532
      supporting_text: >-
        IL-18 forms a signalling complex with the IL-18 receptor α (Rα)
        and β (Rβ) chains at the plasma membrane, which induces multiple
        inflammatory cytokines.
    - reference_id: PMID:25261253
      supporting_text: >-
        Interleukin 18 (IL-18), a member of the IL-1 family of cytokines, is an
        important regulator of innate and acquired immune responses.
- term:
