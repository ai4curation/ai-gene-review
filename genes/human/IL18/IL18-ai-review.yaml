  review:
    summary: >-
      Proposed annotation for released mature IL-18 in the extracellular region.
    action: NEW
    reason: >-
      The biologically active cytokine is extracellular: GSDMD pores preferentially
      pass mature IL-18 over its precursor, placing the receptor agonist outside
      the producing cell. This is the location used by the NLRP3 inflammasome
      GO-CAM terminal IL18 cytokine node.
    supported_by:
