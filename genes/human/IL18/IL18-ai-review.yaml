- term:
    id: GO:0007267
    label: cell-cell signaling
  evidence_type: TAS
  original_reference_id: PMID:9792649
  qualifier: involved_in
  review:
    summary: Cell-cell signaling is a broad but real extracellular cytokine
      output.
    action: KEEP_AS_NON_CORE
    reason: The original receptor paper supports IL-18 signaling through IL18R1
      and IL18RAP, which is a form of cell-cell communication by a secreted
      cytokine ligand. The term is retained as non-core because the more
      informative core statements are IL-18 receptor agonism and IL-18-mediated
      signaling.
    supported_by:
    - reference_id: PMID:9792649
      supporting_text: both IL-1R-rp1 and AcPL expression were required for
        induction of NFkappaB activity and for activation of c-Jun N-terminal
        kinase in response to IL-18
