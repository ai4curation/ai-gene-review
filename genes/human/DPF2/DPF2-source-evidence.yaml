- reference_id: PMID:27775714
  public_sources:
  - https://pubmed.ncbi.nlm.nih.gov/27775714/
  cached_full_text_flag: true
  actual_read_locators:
  - DPF2 peptide ITC, D274S/R300N comparison, and designer-nucleosome pulldown Results; corresponding
    Methods.
  evidence_scope: Purified human DPF2 residues 270–391 recognize H3K14 crotonylation; endogenous DPF2
    is enriched from HeLa S3 extract by modified nucleosomes.
  limits: The DPF2 crystal is apo. Ligand-bound MOZ structures and MOZ cellular ChIP do not establish
    a DPF2 ligand complex or DPF2-specific ChIP result.
- reference_id: PMID:28533407
  public_sources:
  - https://pubmed.ncbi.nlm.nih.gov/28533407/
  - https://authors.library.caltech.edu/records/khdd7-31b07/files/PNAS-2017-Huber-6016-21.pdf?download=1
  - https://authors.library.caltech.edu/records/khdd7-31b07/files/pnas.201700328SI.pdf?download=1
  cached_full_text_flag: false
  actual_read_locators:
  - 'Main Results: histone binding, full-length versus PHD-only RUNX1 association, chromatin recruitment
    and human CD34 differentiation.'
  - 'Supplemental Methods: recombinant protein and cellular assays; Tables S3/S4, supplement PDF page
    11, inspected visually.'
  evidence_scope: Human 270–391 PHD-tandem fragment and full-length cell constructs distinguish histone
    recognition from other protein associations. Folding-controlled pocket mutations disrupt recruitment
    and differentiation effects.
  limits: The preserved machine cache is abstract-only despite separately recovered complete originals.
    At 100 mM salt, reported H3/H3K14ac affinities are approximately 1.0/1.1 micromolar and H4/H4K16ac
    30.2/50.4 micromolar; binding does not imply acetyl selectivity. RUNX1 methylarginine peptide tests
    were negative, while full-length co-IP was positive. No purified RUNX1 contact interface is claimed.
- reference_id: PMID:20460684
  public_sources:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC2903353/
  cached_full_text_flag: true
  actual_read_locators:
  - 'Methods: plasmids, GST pulldown and in-vitro translation, stable/integrated reporters, co-IP and
    ChIP.'
  - 'Results: N-terminal 33–84 association determinants; RelB/p52 reporters; HT29 lymphotoxin/BLC and
    promoter recruitment; Discussion.'
  evidence_scope: Human 293T/293FT, HT29 and HeLa S3 systems support context-dependent transcriptional
    coactivation and connection to Brm-type SWI/SNF.
  limits: In-vitro-translated partners in reticulocyte or wheat-germ lysates are not a fully purified
    binary system. Integrated versus transient reporter effects differ. The proposed PHD nucleosome bridge
    was not directly established by this 2010 paper.
- reference_id: PMID:29429572
  public_sources:
  - https://pubmed.ncbi.nlm.nih.gov/29429572/
  - https://ora.ox.ac.uk/objects/uuid%3Afa6f808e-e7d1-48e4-a62a-f6c7526d4553/files/m9a2d4b06d5234a220123439422f61e8d
  cached_full_text_flag: true
  actual_read_locators:
  - 'Accepted manuscript Methods: GST fusion production and histone peptide pulldown; Results and Figure
    3A/caption.'
  - Figure 3 image, accepted-manuscript PDF page 25, inspected directly; nuclear-distribution Results.
  evidence_scope: Wild-type human DPF2 binds several modified peptides including H3K9me2/me3; pathogenic
    PHD variants reduce these interactions. HEK293 wild-type nuclear distribution differs from mutant
    aggregates.
  limits: The Oxford file is an accepted main manuscript plus supplement, not a supplement-only file.
    Positive peptide binding is distinguished from selective physiological methylmark reading, so the
    imported NOT reader assertion remains unresolved. Disease mutants are not natural isoform 2.
- reference_id: PMID:25066234
  public_sources:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC4157577/
  cached_full_text_flag: true
  actual_read_locators:
  - 'Main Results/Methods: BRG1/BAF180 perturbation, rescue, transcription silencing and repair; Discussion
    of prior cohesion work.'
  evidence_scope: PBAF-dependent silencing and repair were studied in human U2OS, A549 and hTert contexts.
  limits: Main XML was recovered, but the supplement request returned a challenge page. A DPF2-specific
    repair or metaphase/anaphase experiment was not verified; this is uncertainty, not evidence of misattribution.
- reference_id: PMID:16217013
  public_sources:
  - https://pubmed.ncbi.nlm.nih.gov/16217013/
  cached_full_text_flag: true
  actual_read_locators:
  - Selected human K562 LARC purification Methods and Results; 45-kDa band mass-spectrometry assignment.
  evidence_scope: Requiem/DPF2 was identified in a human chromatin-regulatory complex preparation.
  limits: No anti-requiem antibody was available for Western confirmation. Complex remodeling and DNA
