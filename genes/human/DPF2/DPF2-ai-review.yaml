- id: PMID:27775714
  title: Selective recognition of histone crotonylation by double PHD fingers of MOZ and DPF2.
  full_text_unavailable: false
  findings:
  - statement: Human DPF2 tandem PHD fingers recognize H3K14 crotonylation with high affinity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent original reading covered human 270–391 ITC, mutant binding and HeLaS3 designer-nucleosome
      pulldown. The DPF2 structure is apo; ligand-bound MOZ structures and MOZ cellular ChIP were not
      transferred to DPF2.
core_functions:
- description: DPF2 uses tandem PHD fingers to recognize histone tails and support recruitment to chromatin
    as a histone-reading subunit of SWI/SNF complexes. Human residues 270–391 bind H3K14-crotonylated
    peptides with high affinity, and H3K14-crotonylated nucleosomes enrich endogenous DPF2 from nuclear
    extract. H3K14ac and H4K16ac binding is also directly measured; the 2017 peptide assays do not show
    intrinsic preference for those acetylated peptides over their unmodified counterparts. Histone-pocket
    mutations impair cellular histone association and target-chromatin recruitment without merely excluding
    DPF2 from the nucleus. DPF2 provides recognition and recruitment rather than the complex ATPase activity.
  molecular_function:
    id: GO:0140566
    label: histone reader activity
  directly_involved_in:
