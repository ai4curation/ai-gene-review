  - reference_id: PMID:28533407
- description: DPF2 couples transcription factors to chromatin-regulatory complexes, with the direction
    of transcriptional control depending on the factor and cellular context. Its N-terminal region associates
    with p52 and SWI/SNF components; integrated reporters, promoter recruitment and lymphotoxin-responsive
    human-cell experiments support RelB/p52 coactivation. In myeloid cells, DPF2 associates with RUNX1
    and supports repression at differentiation-related loci, with histone binding required for target-chromatin
    recruitment. These data establish a context-dependent coregulator, rather than a uniformly repressive
    protein or an autonomous DNA-binding transcription factor.
