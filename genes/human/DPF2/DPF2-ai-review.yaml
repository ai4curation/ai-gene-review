id: Q92785
gene_symbol: DPF2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DPF2, also called BAF45d or REQ, is a nuclear histone reader and transcriptional coregulator
  associated with SWI/SNF chromatin-remodeling complexes. Its tandem PHD fingers recognize histone H3
  and H4 tails, including strong recognition of H3K14 crotonylation, and support chromatin recruitment.
  Other regions associate with transcription factors and remodeling-complex subunits. DPF2 can support
  transcriptional activation or repression in different contexts, including RelB/p52-dependent transcription
  and control of myeloid differentiation. Pathogenic variants that disrupt its PHD fingers are associated
  with Coffin-Siris syndrome. Two annotated natural protein products differ substantially in their zinc-finger
  region; their functional equivalence is not established.
alternative_products:
- name: '1'
  id: Q92785-1
  description: Canonical 391-residue protein containing a C2H2 zinc finger at 209–232 and tandem PHD fingers
    at 270–330 and 327–377. Purified human 270–391 fragments supply direct histone-binding evidence; full-length
    human constructs provide cell-based recruitment and differentiation evidence. These engineered fragments
    are not separate natural isoforms.
- name: '2'
  id: Q92785-2
  sequence_note: VSP_055860
  description: 207-residue product lacking canonical 156–339. This removes the C2H2 finger, all of PHD1
    and the start of PHD2, while retaining the N-terminal segment implicated in protein association. The
    full histone-reader architecture is therefore not preserved; stability, residual interactions and
    regulatory activity of this natural product are not established by the canonical-fragment assays.
