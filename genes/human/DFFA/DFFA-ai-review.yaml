id: O00273
gene_symbol: DFFA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DFFA, also called DFF45 or ICAD, is the regulatory subunit of the DNA fragmentation factor. It binds 
  DFFB/CAD, assists productive CAD folding, and keeps the DNase inactive in the DFF complex. During apoptotic execution,
  caspase-3 cleaves DFFA at two sites; the DFFA fragments dissociate from DFFB, allowing released CAD to cut chromatin 
  into oligonucleosomal fragments. DFFA-containing DFF complexes occupy cytosolic and nuclear or chromatin-associated 
  pools, with cell type-dependent cytosol-to-nucleus movement after apoptotic stimulation.
