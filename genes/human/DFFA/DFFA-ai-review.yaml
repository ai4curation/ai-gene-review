suggested_experiments:
- description: Endogenously tag DFFA and DFFB in cells competent and incompetent for DNA laddering, then measure 
    cytosolic, nuclear, and chromatin-associated DFF pools before and after apoptotic stimulation while rescuing with 
    caspase-resistant DFFA and chaperone-defective C-terminal DFFA variants.
  hypothesis: The cytosolic pool of correctly chaperoned DFFA:DFFB is the caspase-accessible source of CAD that 
    translocates to chromatin for oligonucleosomal DNA fragmentation.
