description: CDKN1C encodes p57Kip2, an intrinsically disordered CIP/Kip-family inhibitor of cyclin-dependent
  kinases. Its N-terminal inhibitory region restrains cyclin-CDK activity and cell-cycle progression.
  Predominantly nuclear p57 coordinates proliferation with differentiation and development, with additional
  context-dependent effects on transcription and protein interactions. CDKN1C is an imprinted locus expressed
  predominantly from the maternal allele. Loss-of-function variants can cause Beckwith-Wiedemann syndrome,
  whereas IMAGe-associated variants in its PCNA-binding region increase growth suppression. Mouse studies
  establish roles in lens, skeletal, renal, placental and other organ development, with tissue-dependent
  compensation by p27.
