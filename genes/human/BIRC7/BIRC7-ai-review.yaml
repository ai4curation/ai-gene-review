  review:
    summary: The cached PMID:11084335 abstract does not expose the CASP9 interaction.
    action: UNDECIDED
    reason: PMID:11084335 supports ML-IAP/BIRC7 anti-apoptotic activity, but the cached
      abstract says only that ML-IAP probably functions as a downstream effector-caspase
