id: Q96CA5
gene_symbol: BIRC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BIRC7, also called Livin or ML-IAP, is an inhibitor-of-apoptosis family protein with a single
  BIR domain and a C-terminal RING E3 ubiquitin-ligase domain. Its full-length isoforms act mainly in
  the cytoplasm to suppress selected apoptotic stimuli through weak caspase inhibition, RING-dependent
  autoubiquitination, ubiquitination and proteasomal degradation of the IAP antagonist DIABLO/SMAC, and
  TAK1/JNK-dependent protection from TNF- or caspase-1-triggered apoptosis; caspase-cleaved tLivin relocalizes
  to the Golgi region and has a context-dependent pro-apoptotic effect.'
alternative_products:
- name: 2 (Livin alpha)
  id: Q96CA5-1
- name: 1 (Livin beta)
  id: Q96CA5-2
  sequence_note: VSP_002459
existing_annotations:
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:16729033
  qualifier: enables
  review:
    summary: BIRC7 RING-domain ubiquitin transfer is better captured by ubiquitin protein ligase
      activity.
    action: MODIFY
    reason: PMID:16729033 directly shows RING-dependent Livin autoubiquitination and DIABLO/SMAC
      ubiquitination. Replace the broad transferase term with GO:0061630, the specific ubiquitin
      protein ligase molecular function already asserted on this gene.
    proposed_replacement_terms:
    - id: GO:0061630
      label: ubiquitin protein ligase activity
    supported_by:
    - reference_id: PMID:16729033
      supporting_text: The RING domain of Livin promotes its auto-ubiquitination
- term:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027012
  review:
    summary: BIRC7 has a BIR-dependent cysteine-type endopeptidase inhibitor activity.
    action: ACCEPT
    reason: ML-IAP/Livin was reported to inhibit apoptosis and to act as a caspase inhibitor, and
      its BIR domain physically engages CASP9, CASP3 and CASP7 or the IAP antagonist DIABLO/SMAC.
      The plain inhibitor activity is the genus molecular function; apoptotic context is represented
      by the GO:0043066 rows and core functions.
    supported_by:
    - reference_id: PMID:11801603
      supporting_text: ML-IAP), a potent anti-cell death protein and caspase inhibitor, physically
        interacts with SMAC
