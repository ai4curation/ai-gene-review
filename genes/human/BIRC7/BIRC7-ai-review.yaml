  evidence_type: IPI
  original_reference_id: PMID:11084335
  qualifier: enables
  supporting_entities:
  - UniProtKB:P55211
  review:
    summary: The direct CASP9 interaction supports BIRC7 cysteine-type endopeptidase inhibitor
      activity rather than generic protein binding.
    action: MODIFY
    reason: Caspase-9 co-immunoprecipitation and inhibition of Apaf-1/cytochrome-c/dATP-induced
      caspase-9 activation identify the functional meaning of this interaction. Replace GO:0005515
      with GO:0004869 and leave the apoptotic context to the core function.
