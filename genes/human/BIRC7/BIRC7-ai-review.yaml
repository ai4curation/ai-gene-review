- term:
    id: GO:0070247
    label: regulation of natural killer cell apoptotic process
  evidence_type: IDA
  original_reference_id: PMID:18034418
  qualifier: involved_in
  review:
    summary: The Livin isoforms regulate NK-mediated target-cell cytotoxicity, not apoptosis in
      NK cells.
    action: MODIFY
    reason: GO:0070247 is apoptosis of the natural killer cell itself, but PMID:18034418 assayed
      Livin isoforms in Jurkat target cells and found opposite effects on target-cell sensitivity
      to NK-mediated killing. Replace the NK-cell-apoptosis term with the matching positive and
      negative natural killer cell mediated cytotoxicity regulation terms.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0070247
      corrected_value: GO:0045953
      corrected_label: negative regulation of natural killer cell mediated cytotoxicity
      confidence: PROBABLE
      explanation: >-
        UniProt's GO:0070247 row says that BIRC7 regulates apoptosis in the natural
        killer cell itself. PMID:18034418 instead expressed Livin alpha and beta in
        Jurkat target cells and assayed NK-mediated target-cell killing, with beta
        moderately protecting targets and alpha augmenting killing. The curator
        should check whether the row should be replaced by GO:0045953 and/or
        GO:0045954 rather than a natural-killer-cell-apoptosis term.
    proposed_replacement_terms:
    - id: GO:0045953
      label: negative regulation of natural killer cell mediated cytotoxicity
    - id: GO:0045954
      label: positive regulation of natural killer cell mediated cytotoxicity
    supported_by:
    - reference_id: PMID:18034418
      supporting_text: Livin beta moderately protects against NK cell killing whereas Livin alpha
        augments killing.
