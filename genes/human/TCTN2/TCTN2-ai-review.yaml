- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0261697
  - MGI:MGI:1914840
  - MGI:MGI:1915228
  - MGI:MGI:3603820
  - PANTHER:PTN002307865
  review:
    summary: TCTN2 is required for ciliogenesis in mouse cells and tissues (tissue-specific), and its
      loss in human RPE1 cells causes partial TZ damage and shortened, curved cilia.
    action: ACCEPT
    reason: Strong mouse and human cell knockout evidence. Requirement is cell-type dependent (some Tctn2-null
      MEFs ciliate), consistent with TCTN2 acting as a structural component of the TZ rather than a general
      axoneme-building factor.
    supported_by:
    - &id008
      reference_id: PMID:21565611
      supporting_text: Tctn2 was required for ciliogenesis in isolated cells and in vivo, consistent with
        TCTN2 being a ciliopathy gene
    - &id009
      reference_id: PMID:21725307
      supporting_text: Like Tctn1, loss of Tctn2, Tmem67 or Cc2d2a causes tissue-specific defects in ciliogenesis
        and ciliary membrane composition.
    - &id010
      reference_id: PMID:29866362
      supporting_text: We found that TCTN2 depletion resulted in partial TZ damage, loss of ciliary membrane
        proteins, leakage of intraflagellar transport protein IFT88 toward the basal body lumen, and cilium
        shortening and curving.
