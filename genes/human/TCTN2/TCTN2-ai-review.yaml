  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915228
  - PANTHER:PTN002684900
  review:
    summary: 'TCTN2 is required for Hedgehog (Smoothened) signal transduction: Tctn2-/- mouse embryos
      show neural tube patterning defects and Tctn2-/- MEFs fail to induce Ptch1/Gli1 after Smoothened
      agonist treatment.'
    action: KEEP_AS_NON_CORE
    reason: 'Supported by mouse knockout data (Sang et al. 2011). The requirement is indirect: TCTN2 acts
      at the transition zone to permit ciliary entry/retention of signalling membrane proteins (e.g. Smoothened,
      ARL13B), and Hedgehog signalling depends on the cilium. TCTN2 is not a signal transducer per se,
      so this is a downstream consequence of its core gating/ciliogenesis role.'
    supported_by:
    - &id001
      reference_id: PMID:21565611
      supporting_text: Thus, Tctn2-/- neural tubes have defects characteristic of altered Hh signal transduction,
        and Tctn2-/- cells fail to respond to Hh agonists
    - &id002
      reference_id: PMID:21565611
      supporting_text: Following pathway activation by addition of a Smoothened agonist (SAG) both Ptc1
        and Gli1 are induced ∼20-fold in wild-type MEFs, while Tctn2-/- MEFs display negligible responsiveness
