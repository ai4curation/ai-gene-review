core_functions:
- description: Structural transmembrane component of the MKS module at the ciliary transition zone; required
    for TZ localization of neighbouring MKS-module proteins (TMEM67, MKS1) and hence for building the
    MKS part of the transition zone.
  directly_involved_in:
