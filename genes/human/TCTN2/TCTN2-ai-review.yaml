- term:
    id: GO:1905349
    label: ciliary transition zone assembly
  evidence_type: IMP
  original_reference_id: PMID:29866362
  qualifier: involved_in
  review:
    summary: TCTN2 knockout in human RPE1 cells causes partial transition-zone damage and loss of TMEM67
      and MKS1 from the TZ, indicating that TCTN2 contributes structurally to assembling the MKS part
      of the transition zone.
    action: NEW
    reason: 'Participation test: TCTN2 is itself a structural constituent of the TZ MKS module and is
      required for the incorporation of its neighbours, i.e. it supplies part of the structure being assembled
      (scaffold case). The term replaces the obsoleted GO:0097711 and is very sparsely used in GOA (currently
      CEP290, CCDC66, DZIP1L, RAB3IP), so absence for MKS components reflects a young, under-populated
      term rather than a convention against annotating structural subunits. The module (primary cilium
      life cycle, stage 3) assigns this process to the MKS module.'
    supported_by:
    - *id010
    - *id011
