id: Q96GX1
gene_symbol: TCTN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TCTN2 (Tectonic-2) is a single-pass type I transmembrane glycoprotein with a large N-terminal
  extracellular/luminal tectonic domain and a short cytoplasmic tail. It is a core component of the MKS
  (tectonic) complex at the ciliary transition zone, where it lies close to the ciliary membrane together
  with TMEM67, TMEM216, TMEM231, TCTN1/3, CC2D2A, B9D1/2 and MKS1. Within this complex it is required
  for the transition-zone localization of neighbouring MKS-module proteins such as TMEM67 and MKS1, for
  the ciliary diffusion barrier that keeps membrane proteins such as ARL13B and Smoothened concentrated
  in the cilium, and, in a tissue-dependent manner, for ciliogenesis itself. As a result TCTN2 is needed
  for Hedgehog signal transduction and embryonic patterning; biallelic variants cause Meckel syndrome
  8 and Joubert syndrome 24.
