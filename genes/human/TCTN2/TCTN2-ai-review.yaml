  - *id011
  - *id010
- description: As part of the TZ diffusion barrier, maintains ciliary membrane composition and supports
    (tissue-specific) cilium assembly, which in turn is required for Smoothened-dependent Hedgehog signalling.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - *id008
  - *id009
  - reference_id: PMID:22179047
    supporting_text: The complex that we have described is essential for normal cilia function and acts
      as a diffusion barrier to maintain the cilia membrane as a compartmentalized signalling organelle.
suggested_questions:
- question: Is the extracellular/luminal tectonic domain of TCTN2 required for barrier function, or only
    the transmembrane anchor for MKS-complex incorporation?
  experts: []
- question: Why is TCTN2 dispensable for ciliogenesis in some mouse cell types (e.g. some MEFs) but essential
    in others, and does the NPHP module compensate?
  experts: []
suggested_experiments:
- hypothesis: TCTN2 domains have separable roles in MKS-module assembly and diffusion-barrier function.
  description: Re-express truncated TCTN2 constructs (luminal-domain deletions, transmembrane swap) in
    TCTN2-/- RPE1 cells and quantify TMEM67/MKS1 TZ recruitment, ARL13B/SMO ciliary levels and FRAP-based
    membrane diffusion across the TZ.
  experiment_type: domain rescue + super-resolution imaging
