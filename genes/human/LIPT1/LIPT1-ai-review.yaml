  review:
    summary: Lipoyl-AMP:protein lipoyltransferase activity from PAINT node PTN000285676, seeded by bacterial
      and bovine lipoyltransferases/ligases.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0017118 is the lipoyl-AMP-donor partial reaction of lipoate-protein ligases. Human LIPT1
