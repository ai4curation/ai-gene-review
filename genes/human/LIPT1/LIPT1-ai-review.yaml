id: Q9Y234
gene_symbol: LIPT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LIPT1 is the mitochondrial lipoyl amidotransferase that performs the last step of lipoic
  acid assembly in human cells. After LIPT2 octanoylates the glycine cleavage H protein GCSH and LIAS
  converts the octanoyl group to lipoyl, LIPT1 transfers the mature lipoyl group from lipoyl-GCSH to the
  lipoyl domains of the E2 subunits of the pyruvate (DLAT), 2-oxoglutarate (DLST), 2-oxoadipate and branched-chain
  2-oxoacid (DBT) dehydrogenase complexes. It cannot relay the octanoyl precursor. LIPT1 belongs to the
  lipoate-protein ligase LplA family but lacks lipoate-activating ligase activity; in vitro it can also
  transfer lipoyl from lipoyl-AMP, a reaction of uncertain physiological relevance. Biallelic LIPT1 mutations
  abolish E2 lipoylation while sparing GCSH lipoylation and glycine cleavage, causing lactic acidosis
  with combined 2-oxoacid dehydrogenase deficiency and Leigh-like disease.
