core_functions:
- description: 'Lipoyl-GCSH:protein N-lipoyltransferase (lipoyl amidotransferase, RHEA:16413): transfers
    mature lipoyl from GCSH lysine 107 to E2 lipoyl domains of mitochondrial 2-oxoacid dehydrogenases,
    the final step of the mitochondrial GCSH-relay lipoylation pathway.'
  proposed_molecular_function: lipoyl-GcvH:protein N-lipoyltransferase activity
  directly_involved_in:
  - *id009
  locations:
  - *id010
  supported_by:
  - *id006
  - *id003
  - *id002
proposed_new_terms:
- proposed_name: lipoyl-GcvH:protein N-lipoyltransferase activity
  proposed_definition: 'Catalysis of the reaction: N6-[(R)-lipoyl]-L-lysyl-[glycine-cleavage complex H
    protein] + L-lysyl-[lipoyl-carrier protein] = L-lysyl-[glycine-cleavage complex H protein] + N6-[(R)-lipoyl]-L-lysyl-[lipoyl-carrier
    protein] (RHEA:16413, EC 2.3.1.200). The donor is the mature lipoyl group on GCSH; transfer of the
    octanoyl precursor is not included.'
  justification: This is the physiological LIPT1 reaction (RHEA:16413, EC 2.3.1.200); LIPT1 cannot transfer
    octanoyl from octanoyl-GCSH. Current GO has GO:7770091 lipoyl-GcvH:protein N-lipoyltransferase activity,
    whose definition is exactly this reaction, but the term is absent from the GO release configured for
    validation in this repository. Its xrefs and comment also bring in EC 2.3.1.204 and octanoyl transfer,
    which do not apply to LIPT1. Recorded here until the configured release contains GO:7770091, when
    its id should be swapped into core_functions.
  supported_by:
  - *id006
  - *id003
