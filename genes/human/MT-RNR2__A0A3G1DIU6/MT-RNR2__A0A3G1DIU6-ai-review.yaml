  review:
    summary: Endogenous SHLP2 detected with a custom antibody is enriched in the mitochondrial and not
      the cytosolic fraction of HEK293 cells, behaves as an integral membrane protein in sodium carbonate
      extraction, and in APEX2 proximity labelling tags inner-membrane proteins while leaving the outer
      membrane marker TOM20 unlabelled; the labelled interactome is dominated by respiratory complex I.
    action: ACCEPT
    reason: 'Unusually solid localisation evidence for a microprotein: three orthogonal approaches (fractionation,
      extraction behaviour, topology-resolving proximity labelling) agree, and a co-expression analysis
      in dopaminergic neurons independently points to NADH dehydrogenase and the inner membrane. The one
      caveat is that antibody detection cannot formally exclude a nuclear MT-RNR2-like product, but the
      fractionation and topology results would be unaffected.'
