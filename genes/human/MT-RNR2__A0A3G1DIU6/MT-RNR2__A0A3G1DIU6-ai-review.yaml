- term:
    id: GO:0048018
    label: receptor ligand activity
  qualifier: enables
  evidence_type: IDA
  original_reference_id: PMID:37468558
  review:
    summary: 'SHLP2 was identified as a ligand of ACKR3/CXCR7 in an arrayed beta-arrestin recruitment
      screen of GPCRs, with a sub-nanomolar EC50, direct binding confirmed by pulldown of tagged CXCR7,
      receptor-selective internalisation (CXCR7 but not CXCR4), and a physiological output: direct depolarisation
      of arcuate POMC neurons that is required for the suppression of food intake.'
    action: NEW
    reason: 'The participation test is met directly: SHLP2 itself performs the step, binding the receptor
      and changing its activity, which is exactly what GO:0048018 asserts. The comparator check also passes
      - humanin, the other mitochondria-derived peptide with an identified receptor, carries GO:0048018
      by IDA, and secreted peptide ligands of GPCRs generally do. GOA currently has no molecular function
      for this entry at all, so the gene''s single best-defined activity is unrepresented.'
    supported_by:
    - reference_id: PMID:37468558
      supporting_text: Through high-throughput structural complementation screening, we discovered that
        SHLP2 binds to and activates chemokine receptor 7 (CXCR7)
    - reference_id: PMID:37468558
      supporting_text: Out of the screened GPCR candidates, SHLP2 showed the highest efficiency in recruiting
        β-Arrestin to the chemokine receptor CXCR7 (previously known as ACKR3)
    - reference_id: PMID:37468558
      supporting_text: Additionally, the SHLP2 binds directly to CXCR7, as evidenced by the detection
        of tagged CXCR7 through pulldown analysis
    - reference_id: PMID:37468558
      supporting_text: These results strongly suggest that SHLP2 directly activates POMC neurons while
        marginally inhibiting AgRP/NPY neurons
- term:
    id: GO:0051787
    label: misfolded protein binding
  qualifier: enables
  evidence_type: IDA
  original_reference_id: PMID:28798389
  review:
    summary: Seeded thioflavin-T fluorescence and co-sedimentation show that SHLP2 binds misfolded, seeding-capable
      IAPP species and blocks amyloid seeding, while EPR and circular dichroism show it does not act by
      binding IAPP monomers - i.e. the target is the misfolded conformer specifically.
    action: NEW
    reason: 'SHLP2 does the work of this activity: the assays measure direct binding to a misfolded conformer
      and the conformer-selectivity is established by two orthogonal spectroscopic methods. GO:0051787
      states the binding without over-claiming a chaperone mechanism (the authors call it ''chaperone-like'';
      no ATP-independent refolding or holdase cycle was demonstrated). Caveat recorded in the review:
      synthetic peptide in a cell-free system.'
    supported_by:
    - reference_id: PMID:28798389
      supporting_text: Seeded fluorescence and co-sedimentation studies demonstrate MDPs block amyloid
        seeding and directly bind misfolded, seeding-capable IAPP species
    - reference_id: PMID:28798389
      supporting_text: Furthermore, our electron paramagnetic resonance spectroscopy and circular dichroism
        data indicate MDPs do not act by binding IAPP monomers
    - reference_id: PMID:28798389
      supporting_text: Taken together our results reveal a novel chaperone-like activity wherein these
        MDPs specifically target misfolded amyloid seeds to inhibit IAPP misfolding
