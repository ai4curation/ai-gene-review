  review:
    summary: 'SHLP2 acts as a secreted peptide: it was characterised as a circulating mitochondria-derived
      peptide whose plasma levels change with age and metabolic state, it is active when applied extracellularly
      or infused, and its receptor ACKR3/CXCR7 is a cell-surface GPCR that SHLP2 binds directly and internalises.'
