description: 'Small humanin-like peptide 2 (SHLP2) is a 26-residue peptide and a 16S-rRNA sORF peptide:
  its open reading frame lies inside MT-RNR2, the mitochondrial 16S ribosomal RNA gene, in the same stretch
  of mitochondrial DNA that encodes humanin. The six small humanin-like peptides SHLP1-SHLP6 were identified
  by an in silico search of this region and named by analogy with humanin, with which they share a genomic
  neighbourhood rather than sequence similarity. It is the best-characterised member of the group. SHLP2
  binds and activates the atypical chemokine receptor ACKR3/CXCR7, recruiting beta-arrestin with sub-nanomolar
  potency and causing receptor internalisation; through this receptor it depolarises proopiomelanocortin
  neurons of the hypothalamic arcuate nucleus, and in rodents it suppresses food intake, activates thermogenesis
  and protects against diet-induced obesity. Intracerebral infusion increases glucose uptake and suppresses
  hepatic glucose production, and circulating levels fall in obesity, diabetes and ageing, so the peptide
  behaves as a secreted metabolic signal. Independently of this receptor arm, SHLP2 has chaperone-like
  activity in vitro: it binds misfolded, seeding-competent species of islet amyloid polypeptide - not
  IAPP monomers - and blocks amyloid seeding and fibril formation. A second, intracellular pool is biochemically
  well supported: endogenous SHLP2 fractionates with mitochondria rather than cytosol, resists carbonate
  extraction like an integral membrane protein, is accessible to proximity labelling of inner-membrane
  but not outer-membrane markers, and co-labels subunits of respiratory complex I. In cell models SHLP2
  reduces apoptosis and reactive oxygen species, improves mitochondrial metabolism, stabilises OXPHOS
  subunits and protects against amyloid-beta-induced damage. How much of this is translated in vivo is
  unresolved. The peptides are read with the cytoplasmic genetic code, yet no route is known by which
  an mtDNA-encoded transcript reaches cytoplasmic ribosomes, nor by which a peptide made in the matrix
  would be exported; and the same region of mitochondrial DNA is present in the nuclear genome as MT-RNR2-like
  (NUMT-derived) copies, so antibody-based detection cannot be attributed to the mitochondrial locus with
  certainty.'
