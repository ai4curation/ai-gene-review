    correctness: DISPUTED
    review_notes: The record correctly identifies mRAC and cytosolic location, but its statement that DNAJC2 stimulates HSPA14 ATPase is not established by full PMID:21245388. Direct nascent-chain contact by HSPA14 is also proposed rather than resolved.
- id: PMID:21245388
  title: The chaperone network connected to human ribosome-associated complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods, Results and Discussion read. Direct human Hsp70L1 nucleotide-binding and mRAC ATP-turnover assays; hydrolysis explicitly inconclusive. Separate Hsp70 is stimulated by the complex; ATP binding is required but hydrolysis dispensable in heterologous complementation.
- id: PMID:30635648
  title: Intracellular HSP70L1 inhibits human dendritic cell maturation by promoting suppressive
    H3K27me3 and H2AK119Ub1 histone modifications.
  findings:
  - statement: Intracellular HSP70L1 can enter the nucleus in differentiating human monocyte-derived
      dendritic cells and is implicated in Ash1l/H3K27me3/H2AK119Ub1 chromatin control.
    supporting_text: Mechanistically, intracellular HSP70L1 inhibits the recruitment of Ash1l to and
      maintains the repressive H3K27me3 and H2AK119Ub1 modifications on the promoter regions of costimulatory,
      MHC and STAT3 genes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached and primary claims checked; supports a distinct dendritic-cell
      intracellular chromatin lead with nuclear HSP70L1, but whether the chromatin effect is a direct
      HSPA14 function remains a separate curation question.
- id: file:yeast/SSZ1/SSZ1-hypotheses/function-hypothesis-go-0016887/openscientist.md
  title: OpenScientist SSZ1 ATPase adjudication (comparative scope)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Actual report read for homolog coverage. It explicitly calls HSPA14 activity untested and omits PMID:21245388, which performed the inconclusive near-background assay; it cannot adjudicate the human target. No direct transfer of fungal ATPase loss is made.
- id: file:human/HSPA14/HSPA14-hypotheses/atp-hydrolysis-refolding-and-secondary-compartments/openscientist.md
  title: OpenScientist focused review of HSPA14 ATPase, refolding and secondary compartments,
    2026-09-21
  findings:
  - statement: The report argued that HSPA14 is a cytosolic ribosome-associated atypical Hsp70 whose
      established activity is ATP binding rather than direct ATP hydrolysis.
    supporting_text: HSPA14's experimentally supported identity is a **cytosolic, ribosome-associated,
      ATP-*binding* (not hydrolysis-driven) atypical Hsp70**
  - statement: The report distinguished inherited refolding from HSPA14's established cotranslational
      nascent-chain folding role.
    supporting_text: GO:0042026 (protein refolding) is **IBA only** (ECO:0000318, node PTN000452648)
  - statement: The report found no endogenous plasma-membrane evidence behind the stale IBA.
    supporting_text: >-
      The plasma-membrane claim is the weakest: it is absent from the current GO_Central
      path for Q0VDF9 and is supported only by a generic membrane-fraction proteome and by recombinant
      extracellular immunology
  - statement: The report identified HSPA14 sequence divergence from canonical HSP70 catalytic and
      substrate-handling motifs.
    supporting_text: the invariant Hsp70 catalytic/phosphate-binding signature (IDLGTTxS) is degenerate
      in HSPA14 (GVHLGCTSA), and the protein lacks the C-terminal EEVD and GGMP substrate-handling
      elements
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Focused report evaluated on 2026-10-05. Its ATPase, refolding and plasma-membrane
      critiques are incorporated. The report's stronger ATPase removal call is recorded as over-annotation
