id: Q0VDF9
gene_symbol: HSPA14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPA14, also called Hsp70L1, is an atypical HSP70-family subunit of the mammalian ribosome-associated complex (mRAC). It forms a stable heterodimer with the J-domain protein DNAJC2/MPP11 in the cytosol. mRAC associates with ribosomes and promotes recruitment and activity of a separate Hsp70 chaperone on nascent polypeptides, supporting cotranslational protein folding. ATP binding to HSPA14 supports this cofactor function, whereas its own ATP hydrolysis is dispensable in yeast complementation and remains biochemically unresolved because measured turnover is close to background. HSPA14 has also been detected in a membrane proteomics study, and recombinant Hsp70L1 has immunostimulatory activity in antigen-presenting-cell experiments.
