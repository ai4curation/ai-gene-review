- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Intrinsic HSPA14 ATP hydrolysis is over-inferred from a nucleotide-binding HSP70 fold.
    action: MARK_AS_OVER_ANNOTATED
    reason: Full PMID:21245388 measured purified mRAC turnover at approximately 0.01 ATP/min, above
      binding-defective mRAC-LKA and MPP11 but close to background; the authors explicitly withheld
      a definitive ATPase conclusion. ATP-binding mutants and hydrolysis-site mutants separate nucleotide
      binding from hydrolysis dependence because K68A/E172A complemented yeast while ATP-binding-defective
      LKA failed. Stimulation of a separate Hsp70 by mRAC must not be described as DNAJC2 stimulation
      of HSPA14 itself. The focused report adds that HSPA14 has a degenerate IDLGTTxS signature, lacks
      the EEVD and GGMP substrate-handling elements, and has catalytically inert fungal Ssz1 ortholog
      structures. These target-specific and ortholog data make intrinsic ATP hydrolysis over-inferred,
      while MARK_AS_OVER_ANNOTATED stays softer than removal because very slow HSPA14 turnover has
      not been directly excluded.
    supported_by:
    - &id002
      reference_id: PMID:21245388
      supporting_text: Based on the currently available data, the question of whether Hsp70L1 can hydrolyze ATP cannot be conclusively answered.
    - &id001
      reference_id: PMID:21245388
      supporting_text: the function of mRAC depends on ATP binding to Hsp70L1 but does not depend on ATP hydrolysis.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000452648
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The ancestral ATP-hydrolysis IBD is on the target path, but HSPA14 has a degenerate
          catalytic signature, lacks canonical substrate-handling elements, and has only a near-background
          inconclusive human ATPase assay, so canonical HSP70 hydrolysis should not transfer as a core
          target function.
    additional_reference_ids:
