    label: cytosol
  in_complex:
    id: GO:0101031
    label: protein folding chaperone complex
  supported_by:
  - *id003
  - *id001
proposed_new_terms: []
suggested_questions:
- question: Does intrinsic HSPA14 ATP turnover exceed background under physiological cofactors and
    substrate conditions, given the inconclusive0.01 ATP/min mRAC measurement in21245388? ATP
    binding and stimulation of separate Hsp70 are already established.
- question: What is the nascent-chain client spectrum of human RAC, and does HSPA14/DNAJC2 show
    substrate selectivity among co-translationally folding proteins?
- question: Is the reported immunoadjuvant/dendritic-cell-activating activity of HSP70L1 a genuine
    extracellular function or an artifact of recombinant protein preparations?
suggested_experiments:
- description: Reconstitute human RAC (HSPA14 + DNAJC2) in vitro and measure ATPase activity alone
    and in the presence of ribosomes and a ribosome-bound HSP70 to test whether HSPA14 stimulates
    the partner HSP70 ATPase, as in yeast.
- description: Selective ribosome profiling or nascent-chain crosslinking after HSPA14 knockdown to
    define the co-translational client repertoire and folding defects.
- description: Domain-swap and point-mutation analysis of the HSPA14 nucleotide-binding and
    substrate-binding domains to map the determinants of DNAJC2 binding and nascent-chain
    engagement.
