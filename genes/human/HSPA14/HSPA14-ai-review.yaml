core_functions:
- description: ATP-binding subunit of mRAC with DNAJC2/MPP11 that supports recruitment and
    activation of a separate Hsp70 on ribosome-bound nascent chains. This cofactor contribution
    promotes cotranslational folding; autonomous HSPA14 ATPase activity and direct substrate contact
    remain unresolved.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0051083
    label: "'de novo' cotranslational protein folding"
  locations:
