  title: UniProt entry Q0VDF9 (HSP7E_HUMAN), Heat shock 70 kDa protein 14 / HSP70L1
  findings:
  - statement: HSPA14 is the ATP-binding HSP70-family subunit of mRAC with DNAJC2. The record additionally asserts a direct HSPA14 ATPase mechanism, which is disputed by the explicit uncertainty in PMID:21245388.
    reference_section_type: OTHER
  reference_review:
