id: P48546
gene_symbol: GIPR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GIPR is the class B1 G protein-coupled receptor for glucose-dependent insulinotropic polypeptide
  (GIP), an incretin hormone released from intestinal K cells after a meal. The receptor sits in the plasma
  membrane with an N-glycosylated extracellular domain that captures the C-terminal helix of GIP, while
  the transmembrane core engages the hormone's N-terminus and couples to Gs to activate adenylyl cyclase
  and raise cAMP. In pancreatic beta cells this potentiates glucose-stimulated insulin secretion (the
  incretin effect); GIPR is also expressed in adipose tissue, bone and brain. Common GIPR variants are
  associated with post-challenge glucose levels and reduced insulin secretion.
