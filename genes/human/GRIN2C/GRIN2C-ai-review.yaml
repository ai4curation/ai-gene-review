suggested_questions:
- question: Which human interneuron and cerebellar synapse classes contain GluN2C-rich NMDA receptors, and how much of their plasticity is set by GluN2C-specific gating?
- question: Which PDZ interactions of the GluN2C tail occur in neurons rather than in vitro, and which of them control recycling or postsynaptic retention?
suggested_experiments:
- hypothesis: Human GluN2C-containing receptors drive a kinetically distinct NMDA-current component in cerebellar granule neurons and cortical interneurons.
  description: Use isogenic human neurons with endogenous GRIN2C tagged or knocked out, combine GluN2C-selective pharmacology with patch-clamp recordings, and quantify NMDA EPSC decay and calcium influx.
  experiment_type: subunit-selective electrophysiology in human neurons
