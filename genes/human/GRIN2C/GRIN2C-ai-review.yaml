- description: GluN2C is a glutamate-binding, pore-forming GluN2 subunit of the NMDA receptor. Together with GluN1 it forms a glutamate- and glycine/D-serine-gated cation channel in the postsynaptic plasma membrane; channel opening carries Na+, K+, and Ca2+ and provides calcium signals for synaptic plasticity.
