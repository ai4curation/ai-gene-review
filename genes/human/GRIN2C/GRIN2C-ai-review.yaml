id: Q14957
gene_symbol: GRIN2C
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN2C encodes GluN2C, a glutamate-binding GluN2 subunit of NMDA-type ionotropic glutamate receptors. GluN2C co-assembles with the obligatory GluN1 subunit in heterotetrameric plasma-membrane channels that open when glutamate binds GluN2C, glycine or D-serine binds GluN1, and depolarization relieves Mg2+ block. GluN2C-containing receptors are Ca2+-permeable cation channels enriched in postsynaptic specializations of selected neuronal populations, including cerebellar granule cells and cortical interneurons, where their relatively low Mg2+ sensitivity and slow kinetics shape excitatory synaptic transmission and synaptic plasticity. The GluN2C C-terminal tail also carries a PDZ-binding motif that can bind postsynaptic DLG-family scaffolds and other PDZ proteins.
