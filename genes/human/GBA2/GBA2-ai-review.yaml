suggested_questions:
- question: How do the 877- and 640-residue natural products differ from the displayed 927-residue GBA2 in activity,
    membrane association and tissue expression? Existing full-length, mutant and tagged reagents do not resolve
    all three products.
- question: Under which physiological conditions does GBA2-mediated glucosyl exchange with cholesterol make a substantial
    contribution to lipid flux, and does the weaker galactosylceramide activity contribute in vivo?
- question: How are the peripheral ER/Golgi-associated pool and the human cell-surface activity pool related, and
    what experimentally distinguishes smooth ER from the broader microsomal or ER assignment?
- question: Should the definition of GO:0009247 glycolipid biosynthetic process be reconciled with its broader typed
    children and sterol-glycoside formation? Its current definition specifies a diacylglycerol backbone, while children
    include glycosphingolipid and dolichol-linked synthesis.
- question: Is a more specific GO glucosyltransferase activity appropriate for the reversible GlcCer–cholesterol
    reaction represented by RHEA:58264? The inspected immediate GO:0046527 children did not establish a matching
    activity, and a UDP-glucose-specific term would misstate the donor.
suggested_experiments:
- description: Compare sequence-verified natural GBA2 products in matched expression and membrane-fractionation
    assays, quantifying GlcCer hydrolysis and cytosolic versus membrane-associated protein without assuming that
    a sequence deletion abolishes activity.
  experiment_type: Isoform-resolved enzymology and localization
- description: Measure isotope-resolved GlcCer, GlcChol and GalCer flux after selective endogenous GBA2 perturbation
    and rescue with catalytically active or inactive sequence-verified products. Separate glycosyl transfer from
    hydrolysis and control lipid accessibility and GBA1 activity.
  experiment_type: Cellular lipid flux analysis
