description: GBA2 is a nonlysosomal glycosidase that hydrolyzes glucosylceramide to glucose and ceramide. Its membrane-associated
  activity provides an alternative to lysosomal glucosylceramide degradation. Mammalian localization studies place
  GBA2 at the endoplasmic reticulum and Golgi, with a cytosolic, peripheral membrane arrangement demonstrated for
  mouse GBA2; human cell studies also support a surface-associated activity pool. GBA2 can exchange glucose between
  glucosylceramide and cholesterol and can hydrolyze additional glycosides under defined conditions. Galactosylceramide
  analogue hydrolysis and galactosyl transfer have also been measured, but their contribution to normal lipid turnover
  is unresolved. Loss of GBA2 activity disrupts lipid homeostasis and can alter neuronal and reproductive cell function.
  Biallelic human variants cause spastic ataxia or hereditary spastic paraplegia. The functions of the shorter natural
  splice products remain poorly defined.
status: COMPLETE
