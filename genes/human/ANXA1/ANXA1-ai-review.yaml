- term:
    id: GO:0140284
    label: endoplasmic reticulum-endosome membrane contact site
  evidence_type: IDA
  original_reference_id: PMID:27270042
  qualifier: located_in
  review:
    summary: Immuno-EM (pre-embedding and cryo-immunoEM) places ANXA1 at membrane contact sites between the ER and
      EGFR-positive multivesicular bodies in HeLa cells; ANXA1 depletion markedly reduces these contacts.
    action: NEW
    reason: Not in GOA. Direct EM localization plus loss-of-function in a full-text primary paper (Eden et al. 2016)
      supports this location; ANXA1 with ER-associated S100A11 tethers ER-MVB contacts used for PTP1B access to
      endosomal EGFR and for ORP1L/VAP-dependent cholesterol delivery. Location term only; ANXA1 is not itself the
      sterol transporter (ORP1L/VAP perform that step). Identified during reconciliation with the falcon deep research.
    supported_by:
    - reference_id: PMID:27270042
      supporting_text: showed that annexin A1 was present at MCSs between the ER and EGFR-MVBs
    - reference_id: PMID:27270042
      supporting_text: Here we show that these contacts are tethered by annexin A1 and its Ca(2+)-dependent ligand,
        S100A11, and form a subpopulation of differentially regulated contact sites between the ER and endocytic organelles.
    - reference_id: file:human/ANXA1/ANXA1-deep-research-falcon.md
      supporting_text: There, endosomal ANXA1 and ER-associated **S100A11** help tether the two membranes.
