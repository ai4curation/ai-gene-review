  qualifier: involved_in
  review:
    summary: The ANXA1 N-terminal peptide (Ac2-26) induces chemotaxis of human monocytes via FPR family receptors.
    action: KEEP_AS_NON_CORE
    reason: The experiment uses a synthetic N-terminal peptide acting as an extracellular FPR agonist; ANXA1 acts
      as a ligand that regulates monocyte chemotaxis rather than migrating itself. Physiologically, the dominant
      effect is desensitisation/inhibition of leukocyte emigration. Retained as non-core; the core process is regulation
      of leukocyte migration.
