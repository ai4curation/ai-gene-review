- id: file:human/ANXA1/ANXA1-deep-research-falcon.md
  title: Falcon deep research report for human ANXA1
  findings:
  - statement: ANXA1 is a calcium-regulated membrane-binding scaffold and extracellular pro-resolution signal acting
      principally through FPR2/ALX, not a metabolic enzyme.
    supporting_text: '**ANXA1 is a calcium-regulated membrane-binding scaffold and an extracellular pro-resolution signal—not
      a metabolic enzyme or transporter.**'
  - statement: Endosomal ANXA1 with ER-associated S100A11 tethers ER-MVB membrane contact sites (Eden et al. 2016).
    supporting_text: There, endosomal ANXA1 and ER-associated **S100A11** help tether the two membranes.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Generated late (after the review was drafted). Used only as a pointer; the ER-MVB contact-site claim was
      verified against PMID:27270042. Its cPLA2 direct-interaction framing (from a 2007 review) was not adopted; the review
      retains the substrate-depletion interpretation of PLA2 inhibition.
core_functions:
- description: Calcium-dependent binding to anionic phospholipids (phosphatidylserine, phosphatidic acid, phosphatidylinositol)
    via the four annexin repeats, mediating peripheral association with plasma membrane, endosomal and vesicle membranes.
  molecular_function:
    id: GO:0005544
    label: calcium-dependent phospholipid binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0010008
    label: endosome membrane
  - id: GO:0030659
    label: cytoplasmic vesicle membrane
  supported_by:
  - reference_id: PMID:2138016
    supporting_text: The Ca2+ requirement for all of the proteins was lowest for binding to vesicles composed of
      phosphatidic acid, followed by phosphatidylserine and then phosphatidylinositol.
  - reference_id: PMID:2532504
    supporting_text: display Ca2+-dependent binding to phosphatidylserine-containing vesicles
- description: Secreted/externalised ANXA1 and its N-terminal peptide Ac2-26 act as agonists of formyl peptide receptors
    (FPR1, FPR2/ALX, FPR3), triggering GPCR signalling that inhibits neutrophil transendothelial migration and promotes
    resolution of inflammation as an effector of glucocorticoid action.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  - id: GO:0050728
    label: negative regulation of inflammatory response
  - id: GO:0002685
    label: regulation of leukocyte migration
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:10882119
    supporting_text: Peptides derived from the unique N-terminal domain of annexin I serve as FPR ligands and trigger
      different signaling pathways in a dose-dependent manner.
  - reference_id: PMID:15187149
    supporting_text: a peptide derived from the N-terminal domain of the anti-inflammatory protein annexin 1 (lipocortin
      1) can activate all three FPR family members at similar concentrations.
  - reference_id: PMID:12475898
    supporting_text: Anx-1-/- mice exhibit an exaggerated response to the stimuli characterized by an increase in
      leukocyte emigration and IL-1beta generation and a partial or complete resistance to the antiinflammatory
      effects of glucocorticoids.
proposed_new_terms: []
suggested_questions:
- question: Does full-length secreted ANXA1, as opposed to the Ac2-26 peptide, activate FPR1 and FPR3 in vivo, or
    is FPR2/ALX the principal physiological receptor?
- question: Is ANXA1-mediated inhibition of phospholipase A2 ever physiologically relevant in cells, or is it entirely
    explained by substrate sequestration in vitro?
- question: Should the alpha-2-macroglobulin calcium-dependent protein binding IPI (PMID:15226301) be attributed
    to ANXA1, given the abstract identifies annexin VI as the binder?
- question: What is the relative contribution of EV-mediated versus TMED10-dependent unconventional secretion to
    extracellular ANXA1 pools in neutrophils and epithelia?
suggested_experiments:
- hypothesis: Physiological anti-inflammatory effects of ANXA1 require FPR2/ALX engagement by full-length protein
    rather than proteolytically released Ac2-26.
  description: Compare wild-type versus cathepsin G/proteinase 3-resistant ANXA1 N-terminal mutants for FPR1/FPR2/FPR3
    activation (BRET G protein and beta-arrestin assays) and for inhibition of neutrophil transendothelial migration
    in Fpr1/Fpr2 knockout backgrounds.
  experiment_type: receptor pharmacology
- hypothesis: ANXA1 does not directly bind and inhibit phospholipase A2 enzymes.
  description: Measure direct ANXA1-PLA2 (cPLA2alpha, sPLA2-IIA) binding by SPR in the absence of lipid, and test
    inhibition at varying substrate interface concentrations to distinguish enzyme inhibition from interfacial competition.
  experiment_type: biochemical assay
