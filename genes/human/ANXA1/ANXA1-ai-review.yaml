id: P04083
gene_symbol: ANXA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Annexin A1 (lipocortin 1) is a glucocorticoid-inducible member of the annexin family, built from a
  unique N-terminal domain and four calcium-binding annexin repeats. In the cytoplasm it binds calcium and, in a
  calcium-dependent manner, associates peripherally with anionic phospholipid membranes (plasma membrane, endosomes,
  secretory granules), can aggregate and fuse vesicles in vitro, and its N-terminus binds S100A11. ANXA1 lacks a
  signal peptide but is externalised to the cell surface and released (via gelatinase granules, extracellular vesicles
  and TMED10-dependent unconventional secretion). Extracellular ANXA1 and its N-terminal peptide Ac2-26 (released,
  for example, by cathepsin G) act as agonists of the formyl peptide receptors FPR1, FPR2/ALX and FPR3, limiting
  neutrophil transendothelial migration, promoting resolution of inflammation, efferocytosis and epithelial wound
  repair, inhibiting neuroendocrine hormone exocytosis and modulating T cell activation. It mediates part of the
  anti-inflammatory action of glucocorticoids. Its historically described phospholipase A2 inhibition reflects sequestration
  of phospholipid substrate. ANXA1 is also a substrate of EGFR, PKC and transglutaminase.
