- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: IDA
  original_reference_id: PMID:29397057
  qualifier: involved_in
  review:
    summary: Human granulosa-cell data support a contextual AKAP8 contribution to the FSH arm of 
      follicle development.
    action: KEEP_AS_NON_CORE
    reason: PMID:29397057 shows that AKAP8/AKAP95 is needed in KGN cells and primary human 
      luteinised granulosa cells for nuclear PKA retention, CREB phosphorylation, FSH-induced 
      CYP19A1 expression and estrogen synthesis. This is a real granulosa-cell use of AKAP8 in the 
      GO-CAM model but is a specialized endocrine context rather than the core nuclear role of 
      AKAP95.
    supported_by:
    - &id007
      reference_id: PMID:29397057
      reference_section_type: ABSTRACT
      supporting_text: Using the human granulosa cell line KGN and primary cultured human luteinised
        granulosa cells (hLGCs), we found that knockdown of AKAP8, the gene encoding AKAP95, or 
        inhibition of AKAP95 reduced the amount of PKA anchored in the nucleus and attenuated the 
        phosphorylation of CREB by either FSH or activation of the cAMP/PKA pathway.
    - reference_id: PMID:29397057
      reference_section_type: ABSTRACT
      supporting_text: Moreover, knockdown of AKAP8 or inhibition of AKAP95 also significantly 
        attenuated FSH-induced CYP19A1 expression and oestrogen synthesis.
