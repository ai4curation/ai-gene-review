suggested_questions:
- question: Does AKAP95 directly anchor the PKA holoenzyme in interphase granulosa-cell nuclei after
    FSH stimulation, and if so which PKA regulatory subunit and phosphorylation state create that 
    nuclear pool?
- question: Which MLL-family methyltransferase complexes are directly activated by AKAP95, and is
    DPY30 the primary bridge between AKAP95 and those chromatin-modifying assemblies?
suggested_experiments:
- description: Edit endogenous AKAP8 in primary human granulosa cells or a granulosa-cell line to 
    remove the RII-binding helix, the nuclear localization sequences or the zinc fingers, then 
    rescue AKAP8 knockdown with each allele and measure nuclear PKA, CREB Ser133 phosphorylation, 
    CYP19A1 mRNA and estradiol after FSH.
  experiment_type: endogenous mutagenesis / rescue
- description: Map endogenous AKAP95 proximity partners through interphase, mitosis and FSH 
    stimulation using tagged AKAP8 knock-in cells, quantitative proximity labeling and reciprocal 
    co-immunoprecipitation, with DPY30/WDR5/ASH2L, HDAC3, MCM2, PRKAR2A and PRKACA assayed 
    separately.
  experiment_type: proximity proteomics / cell-cycle time course
