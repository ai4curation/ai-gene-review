  review:
    summary: Mitotic-cell-cycle TAS row that is true but less informative than the 
      chromosome-condensation row.
    action: TOO_GENERAL
    reason: The 1998 AKAP95 characterization supports a cell-cycle-regulated mitotic redistribution 
      and RIIalpha interaction, and the later direct chromosome-condensation work establishes the 
      more specific mitotic chromosome condensation role. The root mitotic cell cycle process is 
      therefore correct but imprecise once GO:0007076 is asserted in this review.
