id: O43823
gene_symbol: AKAP8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AKAP8 encodes AKAP95, a predominantly nuclear A-kinase anchoring protein with two AKAP95-type
  C2H2 zinc fingers and a C-terminal PKA RII-binding region. The protein associates with the interphase
  nuclear matrix, redistributes to mitotic chromatin, and binds PKA regulatory subunits to position cAMP-dependent
  protein kinase in nuclear and chromatin contexts. AKAP95 also scaffolds chromatin regulators: it contributes
  to mitotic chromosome condensation, recruits HDAC3 during mitosis, binds MCM2 in chromatin, associates
  with MLL-family histone methyltransferase complexes through DPY30/WDR5/ASH2L-containing assemblies,
  and binds GC-rich DNA at nucleolar rDNA where it modulates rRNA production. In human granulosa cells,
  AKAP95 supports FSH-induced CYP19A1 expression and estrogen synthesis by keeping PKA activity in the
  nucleus for CREB phosphorylation.'
