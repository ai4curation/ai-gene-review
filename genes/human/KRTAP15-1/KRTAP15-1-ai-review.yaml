id: Q3LI76
gene_symbol: KRTAP15-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRTAP15-1 (keratin-associated protein 15-1, KAP15.1) is a small (137 aa) high-sulfur hair keratin-associated protein of the KAP15 family (PMG/KRTAP_PMG family), encoded in the chromosome 21q22.1 KAP gene domain. KAPs form the interfilamentous matrix of the hair fibre, in which hair keratin intermediate filaments are embedded and cross-linked by disulfide bonds to give a rigid, resistant hair shaft. In goats the orthologous KRTAP15-1 is expressed in secondary (cashmere) hair follicles but not in internal organs, and its sequence variants are associated with cashmere mean fibre diameter.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0A0C3SFZ9
  review:
    summary: Systematic binary interaction screen (PMID:32296183) reported an interaction between KRTAP15-1 and UniProtKB:A0A0C3SFZ9.
    action: REMOVE
    reason: Bare GO:0005515 protein binding is uninformative and is removed under the project protein-binding policy; removal does not mean the reported interaction is false. Small cysteine- and glycine/tyrosine-rich KAPs are recurrent, promiscuous preys in high-throughput yeast two-hybrid screens (their recorded partners span unrelated transcription factors, LCE proteins and other KAPs), and the screen does not establish a more informative molecular function such as keratin filament binding.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all' reference interactome map of human binary protein interactions, or 'HuRI'.
