  qualifier: involved_in
  review:
    summary: >-
      IDA nuclear polyadenylation-dependent mRNA catabolic process from the TCL1 study, which
      measured PNPase RNA-degrading activity in vitro. The term describes nuclear exosome-mediated
      decay, which PNPase (a mitochondrial enzyme) does not perform.
    action: MODIFY
    reason: >-
      The evidence supports RNA degradation by PNPase in vitro, not a nuclear, polyadenylation-dependent
      pathway. Replace with the general RNA catabolic process.
    proposed_replacement_terms:
    - id: GO:0006401
      label: RNA catabolic process
    supported_by:
