core_functions:
- description: >-
    Processive 3'-to-5' phosphorolytic exoribonuclease (polyribonucleotide nucleotidyltransferase)
    that, as the homotrimeric catalytic core of the mitochondrial degradosome with the SUV3
    helicase, degrades mitochondrial transcripts, including structured and double-stranded
    RNAs, antisense and non-coding RNAs and G-quadruplex RNAs, in the mitochondrial matrix.
  molecular_function:
    id: GO:0004654
    label: polyribonucleotide nucleotidyltransferase activity
  directly_involved_in:
  - id: GO:0000957
    label: mitochondrial RNA catabolic process
  - id: GO:0000958
    label: mitochondrial mRNA catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0045025
    label: mitochondrial degradosome
  supported_by:
  - reference_id: PMID:19509288
    supporting_text: >-
      the complex of hSUV3-hPNPase is an integral entity for efficient degradation of structured
      RNA
  - reference_id: PMID:23221631
    supporting_text: >-
      silencing of human polynucleotide phosphorylase (PNPase) causes accumulation of RNA
      decay intermediates and increases the half-life of mitochondrial transcripts
  - reference_id: PMID:30046113
    supporting_text: >-
      identify key roles for the degradosome components mitochondrial RNA helicase SUV3 and
      polynucleotide phosphorylase PNPase in restricting the levels of mitochondrial double-stranded
      RNA
- description: >-
    3'-5' exoribonuclease activity of PNPase toward mitochondrial RNA, which limits accumulation
    of mitochondrial double-stranded RNA and thereby its PNPase-dependent escape to the cytosol,
    where it would trigger MDA5-driven type I interferon signalling.
  molecular_function:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  directly_involved_in:
  - id: GO:0000957
    label: mitochondrial RNA catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:30046113
    supporting_text: >-
      Loss of either enzyme results in massive accumulation of mitochondrial double-stranded
      RNA that escapes into the cytoplasm in a PNPase-dependent manner.
suggested_questions:
- question: >-
    How do the intermembrane-space and matrix pools of PNPase partition, and does the IMS
    pool have a function (for example in RNA import or in mt-dsRNA release) distinct from
    the matrix degradosome?
- question: >-
    What is the mechanism of the PNPase-dependent escape of mitochondrial double-stranded
    RNA into the cytosol, given that PNPase loss both increases mt-dsRNA and is required for
    its release?
- question: >-
    Is PNPase-dependent import of nuclear RNAs (5S rRNA, RNase P and MRP RNAs) into mammalian
    mitochondria physiologically significant, and does its loss contribute to the hearing
    loss and encephalomyopathy phenotypes independently of RNA decay defects?
suggested_experiments:
- description: >-
    Express IMS-restricted and matrix-restricted PNPase variants in PNPT1-null cells and measure
    mt-dsRNA levels, cytosolic mt-dsRNA release, interferon-stimulated gene expression and
    mitochondrial translation.
- description: >-
    Compare the catalytic activity, trimer stability and SUV3 binding of recombinant COXPD13
    and hearing-loss PNPT1 variants to relate residual degradosome activity to phenotype severity.
