id: Q8TCS8
gene_symbol: PNPT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PNPT1 encodes polynucleotide phosphorylase (PNPase), a nuclear-encoded mitochondrial 3'-to-5'
  exoribonuclease of the RNase PH family. PNPase forms a homotrimeric ring built from two
  RNase PH domains per protomer, with KH and S1 RNA-binding domains forming the central channel,
  and catalyses processive phosphorolysis of RNA (releasing nucleoside diphosphates) as well
  as the reverse, template-independent polymerisation reaction. Two PNPase-containing pools
  have been described in mitochondria: a bulk pool reported in the intermembrane space, and
  a matrix pool that associates with the RNA helicase SUV3 (SUPV3L1) to form the mitochondrial
  RNA degradosome (a 330-kDa heteropentamer of a PNPase trimer and an SUV3 dimer). The degradosome
  acts in foci near nucleoids to degrade structured and double-stranded mitochondrial transcripts,
  particularly light-strand antisense and non-coding RNAs, G-quadruplex-containing RNAs (with
  GRSF1) and 5-methylcytosine-marked transcripts (recruited by C1QBP). By restricting mitochondrial
  double-stranded RNA, PNPase prevents its release to the cytosol and activation of an MDA5-dependent
  type I interferon response. PNPase has also been implicated in import of small nuclear-encoded
  RNAs (5S rRNA, RNase P and MRP RNAs) into mitochondria and in shaping mitochondrial mRNA
  3' ends and poly(A) tails; it is interferon-inducible, and when overexpressed it can degrade
  cytoplasmic RNAs such as c-myc mRNA and miR-221. Biallelic hypomorphic PNPT1 variants cause
  combined oxidative phosphorylation deficiency 13 (encephalomyopathy with respiratory-chain
  defects and interferon activation) and autosomal recessive nonsyndromic hearing loss.
