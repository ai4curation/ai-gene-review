suggested_questions:
- question: Under what physiological conditions does SYK display serine/threonine kinase activity and
    nuclear function, versus its canonical cytoplasmic tyrosine kinase role?
- question: How is the resting cytosolic pool of SYK kept inactive and partitioned from its membrane-recruited
    pool?
suggested_experiments:
- description: Quantitative phosphoproteomics after acute SYK inhibition in primary B cells and macrophages
    to map the direct substrate set across BCR, FcR and CLR pathways.
