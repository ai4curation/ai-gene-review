id: P43405
gene_symbol: SYK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SYK (spleen-associated tyrosine kinase) is a cytoplasmic non-receptor protein tyrosine kinase
  of the SYK/ZAP70 family, with two tandem N-terminal SH2 domains and a C-terminal kinase domain. Its
  SH2 domains bind doubly phosphorylated ITAM motifs on activated immunoreceptors (B-cell receptor, Fc
  receptors, C-type lectin receptors) and on ITAM-bearing adaptors, recruiting SYK from the cytosol to
  the inner leaflet of the plasma membrane. There SYK is activated and phosphorylates downstream effectors
  such as BLNK, PLCG1/2, VAV1 and LCP2, propagating signals that control innate and adaptive immunity,
  B-cell development, Fc-receptor phagocytosis and degranulation, platelet activation, integrin (outside-in)
  signaling, osteoclast maturation and vascular/lymphatic development.
