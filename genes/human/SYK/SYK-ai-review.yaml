  review:
    summary: The Reactome negative inflammatory-response branch is compatible with inhibitory immune-receptor
      signaling and with source-specific opposing SYK effects in TLR pathways.
    action: KEEP_AS_NON_CORE
    reason: The original Reactome FCGR3A-mediated IL10 synthesis pathway supports a context-specific anti-inflammatory
      output of immune-receptor signaling. SYK executes proximal phosphorylation in this cytokine-producing
      route, rather than acting as IL10 itself. PMID:23962979 independently illustrates opposing, stimulus-specific
      SYK effects in TLR pathways; it is corroboration of context dependence, not an experiment on the
      FCGR3A branch. Retain negative inflammatory regulation as non-core, not a universal anti-inflammatory
      function.
