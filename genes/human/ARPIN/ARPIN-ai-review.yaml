suggested_questions:
- question: How do Arp2/3 inhibition and tankyrase binding, which share the acidic-tail site, divide Arpin's
    control of migration persistence?
- question: How does Arpin restrain ROCK1/ZIPK-driven stress fibres in endothelial cells independently
    of the Arp2/3 complex, and which partner mediates this?
suggested_experiments:
- description: Compare migration persistence in Arpin-null cells rescued with Arp2/3-binding-only versus
    tankyrase-binding-only acidic-tail mutants.
