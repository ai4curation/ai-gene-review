id: Q7Z6K5
gene_symbol: ARPIN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Arpin (ARPIN) is an inhibitor of the Arp2/3 complex. Its acidic C-terminal tail resembles
  the acidic motif of WASP-family nucleation-promoting factors and binds the Arp3 site on the complex,
  but Arpin lacks the second binding contact needed for activation, so it holds Arp2/3 in an inactive,
  open conformation. Rac signalling recruits and activates Arpin at the lamellipodial tip, creating an
  inhibitory circuit alongside Rac-WAVE activation of Arp2/3. Arpin thereby limits lamellipodial protrusion
  and migration speed and controls the directional persistence of migrating cells. Its acidic tail also
  binds tankyrases at an overlapping site, and it has been reported to dampen homology-directed DNA repair
  by inhibiting nuclear Arp2/3.
