    summary: Directional locomotion (IMP). Arpin depletion gives straighter trajectories and Arpin injection
      makes keratocytes turn, so Arpin controls directional persistence, steering rather than executing
      locomotion. Steering is a major Arpin role; the non-core call reflects that this term describes
      locomotion itself, which Arpin does not perform, not that steering is unimportant. Kept as non-core
      alongside the negative regulation of migration row.
