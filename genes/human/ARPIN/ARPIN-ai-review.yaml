    supporting_text: Arpin, which uses VCA-related acidic (A) motifs to interact with the Arp2/3 complex,
      induced the standard open conformation, and two new masses appeared at positions near Arp2 and Arp3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; single-particle EM.
- id: PMID:33923443
  title: Arpin Regulates Migration Persistence by Interacting with Both Tankyrases and the Arp2/3 Complex.
  findings:
  - statement: Arpin binds tankyrases at a site overlapping the Arp2/3-binding site.
    supporting_text: Arpin interacts with ankyrin repeats of TNKS through a C-terminal-binding site on
      its acidic tail, which overlaps with the Arp2/3-binding site.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:39298260
  title: Arpin deficiency increases actomyosin contractility and vascular permeability.
  findings:
  - statement: In endothelial cells Arpin restrains stress fibres and permeability independently of Arp2/3.
    supporting_text: Arpin depletion in Human Umbilical Vein Endothelial Cells causes the formation of
      actomyosin stress fibers leading to increased permeability in an Arp2/3-independent manner.
  - statement: ROCK1 and ZIPK inhibitors reverse Arpin-loss effects.
    supporting_text: Instead, inhibitors of ROCK1 and ZIPK, kinases involved in the generation of stress
      fibers, normalize the loss-of-arpin effects on actin filaments and permeability.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; HUVEC barrier.
