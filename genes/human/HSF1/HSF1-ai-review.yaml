core_functions:
- description: >-
    Stress-activated, homotrimeric heat shock element-binding transcription activator that drives RNA
    polymerase II transcription of heat shock protein/chaperone genes, executing the cellular heat shock
    (proteotoxic stress) response.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0034605
    label: cellular response to heat
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0097165
    label: nuclear stress granule
  supported_by:
  - reference_id: file:human/HSF1/HSF1-uniprot.txt
    supporting_text: >-
      Functions as a stress-inducible and DNA-binding transcription factor that plays a central role in
      the transcriptional activation of the heat shock response (HSR), leading to the expression of a
      large class of molecular chaperones, heat shock proteins (HSPs), that protect cells from cellular
      insult damage
  - reference_id: file:human/HSF1/HSF1-uniprot.txt
    supporting_text: >-
      Upon exposure to heat and other stress stimuli, undergoes homotrimerization and activates HSP gene
      transcription through binding to site-specific heat shock elements (HSEs) present in the promoter
      regions of HSP genes
  - reference_id: PMID:7760831
    supporting_text: >-
      Human heat shock factor 1 (HSF1) stimulates transcription from heat shock protein genes following
      stress.
- description: >-
    Sequence-specific binding of HSF1 trimers to heat shock elements (inverted nGAAn pentamers) in Pol
    II cis-regulatory regions.
  molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/HSF1/HSF1-uniprot.txt
    supporting_text: Binds to inverted 5'-NGAAN-3' pentamer DNA sequences
  - reference_id: PMID:7935471
    supporting_text: >-
      Heat stress (39 to 42 degrees C) disrupts these interactions, and hHSF1 homotrimerizes and acquires
      heat shock element DNA-binding ability.
suggested_questions:
- question: >-
    Which chaperone (HSP90, HSP70/DNAJB1, or TRiC) is the dominant repressor of HSF1 in different human
    cell types, and how is the switch between them set?
- question: >-
    Are the transcription-independent roles of HSF1 (mitotic regulation, NHEJ inhibition) conserved across
    vertebrates and separable from its transcriptional activity?
suggested_experiments:
- hypothesis: >-
    HSF1 transcription-independent mitotic and NHEJ roles require the same regulatory-domain phosphosites
    that control its stress-induced activity.
  description: >-
    Use DNA-binding-dead and activation-domain-dead HSF1 knock-in alleles to separate transcriptional
    from non-transcriptional phenotypes in mitosis and DNA repair assays.
