id: Q00613
gene_symbol: HSF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HSF1 (heat shock factor 1) is the master stress-inducible transcription factor of the vertebrate heat
  shock response. It has an N-terminal winged helix-turn-helix DNA-binding domain, an HR-A/B leucine-zipper
  trimerization region, a heavily phosphorylated regulatory domain and a C-terminal transactivation domain,
  with HR-C keeping the protein monomeric. In unstressed cells HSF1 is held as an inert monomer by HSP90-,
  HSP70- and DNAJB1-containing chaperone complexes. Proteotoxic stresses (heat, heavy metals, oxidants,
  proteasome or HSP90 inhibition) titrate these chaperones away, allowing HSF1 to trimerize, accumulate
  in the nucleus and bind heat shock elements (inverted nGAAn repeats). It then activates RNA polymerase
  II transcription of HSP70, HSP90, small HSP and other chaperone genes through contacts with TBP/TFIIB
  and coactivators. The induced chaperones feed back to attenuate HSF1, and activity is further tuned
  by phosphorylation, SUMOylation and acetylation. Activated HSF1 concentrates in nuclear stress bodies.
  It also represses some genes (IL1B, FOS), has reported roles in mitosis and NHEJ repair, and supports
  a broad pro-survival transcriptional program in cancer.
