- term:
    id: GO:0031072
    label: heat shock protein binding
  evidence_type: IDA
  original_reference_id: PMID:11583998
  qualifier: enables
  review:
    summary: >-
      HSF1 binds HSP90, HSP70 and DNAJB1, which repress its activity (chaperone titration feedback).
    action: KEEP_AS_NON_CORE
    reason: >-
      Well-established regulatory interactions, central to how HSF1 senses proteotoxic stress, but HSF1
      is the client; this is a regulatory input rather than an HSF1 output activity.
    supported_by:
    - reference_id: PMID:9727490
      supporting_text: >-
        We conclude that Hsp90, by itself and/or associated with multichaperone complexes, is a major
        repressor of HSF1.
    - reference_id: PMID:9499401
      supporting_text: >-
        Here, we show that the molecular chaperone Hsp70 and the cochaperone Hdj1 interact directly with
        the transactivation domain of HSF1 and repress heat shock gene transcription.
