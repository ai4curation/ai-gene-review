core_functions:
- description: Sequence-specific poly(C) RNA-binding protein that packages and regulates cytidine-rich
    pre-mRNAs and mRNAs as part of nuclear ribonucleoprotein and spliceosome complexes.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: file:human/HNRNPK/HNRNPK-uniprot.txt
    supporting_text: pre-mRNAs that contain cytidine-rich
- description: Transcriptional co-regulator acting on chromatin, including the p53/TP53 DNA-damage response,
    through combined nucleic-acid binding and protein-domain docking.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: file:human/HNRNPK/HNRNPK-uniprot.txt
    supporting_text: p53/TP53 response to DNA damage
suggested_questions:
- question: Which of HNRNPK's many reported protein interactions are direct KI-region docking events versus
    RNA-bridged co-associations?
- question: How do post-translational modifications (SUMOylation, phosphorylation) switch HNRNPK between
    transcriptional co-activation and co-repression of p53 targets?
suggested_experiments:
- description: CLIP-seq of endogenous HNRNPK across nuclear and cytoplasmic fractions to define its direct
    poly(C) RNA targets and partition splicing versus stability/translation roles.
  experiment_type: genomics
- description: Separation-of-function KH-domain and KI-region mutants to dissect nucleic-acid binding
    from protein-docking contributions to the p53 response.
  experiment_type: molecular biology
