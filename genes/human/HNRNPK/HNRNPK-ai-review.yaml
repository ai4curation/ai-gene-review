id: P61978
gene_symbol: HNRNPK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HNRNPK encodes heterogeneous nuclear ribonucleoprotein K, a multifunctional poly(C)-binding
  protein built from three KH domains and a K-interactive (KI) docking region. It binds cytidine-rich
  single-stranded RNA and DNA and participates in pre-mRNA packaging and splicing, mRNA stability and
  translational control, and transcriptional regulation, including the p53/TP53 DNA-damage response, LDL-receptor
  gene transactivation, and circRNA-nucleated repressive complexes. Through its KI region it also serves
  as a signaling docking platform. It is predominantly nuclear/nucleoplasmic and chromatin-associated
  but shuttles to the cytoplasm, where it localizes to stress granules and ribonucleoprotein complexes.
