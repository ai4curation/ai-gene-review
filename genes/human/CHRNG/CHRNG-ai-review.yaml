    supporting_text: Nicotine (100 μ m ) elicited inward currents
  - reference_id: PMID:39085615
    supporting_text: form a cation-selective ion channel
  - reference_id: PMID:16826520
suggested_questions:
- question: Does P07510-2, which replaces residues 117–169 with lysine, assemble with alpha1/beta1/delta
    and retain ligand binding and gating, and where is it expressed?
- question: Should the Reactome source chain that places the delta/epsilon/gamma set inside alpha3-beta4
    receptor complex 532621 be separated into biologically distinct receptor assemblies while preserving
    the correct plasma-membrane compartment?
- question: Can the screen-supported CHRNG interactions with KRT31, KRTAP proteins and NOTCH2NLA be reproduced
    in membrane-compatible systems or endogenous tissues, and do they affect receptor abundance or activity?
suggested_experiments:
- description: Compare sequence-verified P07510-1 and P07510-2 with identical human alpha1/beta1/delta
    partners using surface labeling, ligand competition and single-channel recording; normalize to receptor
    abundance to separate assembly loss from altered affinity or gating.
- description: Test conserved gamma complementary-site substitutions in the human fetal receptor with
    surface-expression controls and matched kinetic/binding measurements, distinguishing ligand recognition
    from secondary effects of altered receptor state occupancy.
