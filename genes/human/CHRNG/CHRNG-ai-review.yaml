id: P07510
gene_symbol: CHRNG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNG encodes the gamma subunit of the fetal skeletal-muscle nicotinic acetylcholine receptor.
  Gamma assembles with two alpha1 subunits, beta1 and delta to form a postsynaptic cation channel that
  couples acetylcholine release to muscle excitation and prenatal movement. Gamma contributes to the pore,
  gating architecture and the complementary side of an acetylcholine-binding interface; fetal receptors
  have greater agonist sensitivity and longer openings than adult receptors in which epsilon replaces
  gamma. The human gamma-containing receptor conducts calcium as a small fraction of its inward current.
  Biallelic loss-of-function variants cause fetal akinesia and lethal or nonlethal multiple pterygium
  phenotypes. The developmental replacement by epsilon explains why surviving individuals may lack ongoing
  postnatal myasthenia. Functional effects of the alternative product replacing residues 117–169 with
  lysine remain unresolved.
