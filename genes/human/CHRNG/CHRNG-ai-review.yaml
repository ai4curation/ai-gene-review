    summary: Specify the experimentally supported keratin-protein binding class.
    action: MODIFY
    reason: '3 literal positive IntAct records join human CHRNG/P07510 and KRT31/Q15323 to PMID:25416956.
      The pooling, array and validated two-hybrid records are consistent with the actual primary repeated
      pairwise verification and sequence-confirmation procedure. Dataset-level orthogonal tests are not
      claimed for this particular pair. KRT31/Q15323 is an authenticated type-I keratin with an intermediate-filament
      rod domain and structural-constituent annotation. It therefore satisfies the protein-component class
      in GO:0008092. The positive Y2H evidence has the same strength as that for the KRTAP partners; the
      different refinement rests on established partner class, not stronger interaction evidence. KRTAP
      filament-location annotations are acknowledged separately, but do not alone settle their accessory
      matrix classification. This is assay-only, non-core binding specificity: no native muscle encounter,
      assembled-filament binding or CHRNG cytoskeletal activity is inferred.'
