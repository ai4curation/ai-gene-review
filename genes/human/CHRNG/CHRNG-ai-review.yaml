- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:P60409
  review:
    summary: Retain positive KRTAP binding; the cytoskeletal partner class remains unresolved.
    action: KEEP_AS_NON_CORE
    reason: 3 literal positive IntAct records join human CHRNG/P07510 and KRTAP10-7/P60409 to PMID:25416956.
      The pooling, array and validated two-hybrid records are consistent with the actual primary repeated
      pairwise verification and sequence-confirmation procedure. Dataset-level orthogonal tests are not
      claimed for this particular pair. The assay supports this pair at the same evidential strength as
      the KRT31 pair in this study. Current KRTAP10-7/-8/-9 annotations include GO:0045095 keratin filament,
      explicitly located_in by InterPro IEA; their documented function is a cysteine-rich interfilamentous
      matrix associated with hair keratins. That location is acknowledged, not rejected. Whether this
      accessory matrix role satisfies the protein-component class required by GO:0008092 is unresolved
      here, whereas KRT31 itself is an established filament-forming keratin. Retain the positive binding
      as non-core without categorically excluding KRTAPs from cytoskeletal association. Neither native
      muscle colocalization nor binding to an assembled filament is demonstrated.
    supported_by:
    - reference_id: PMID:25416956
    - reference_id: file:human/CHRNG/CHRNG-source-evidence.json
