core_functions:
- description: Gamma contributes pore, gating and complementary acetylcholine-binding elements to the
    fetal muscle receptor. Agonist-gated cation influx depolarizes the postsynaptic membrane and initiates
    muscle excitation. Human gamma-containing receptors carry a modest calcium current; native bovine
    structures resolve the gamma ligand-pocket contribution. Activity of the alternative human product
    remains unresolved.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
  directly_involved_in:
  - id: GO:0007271
    label: synaptic transmission, cholinergic
  - id: GO:0051899
    label: membrane depolarization
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  in_complex:
    id: GO:0005892
    label: acetylcholine-gated channel complex
  supported_by:
