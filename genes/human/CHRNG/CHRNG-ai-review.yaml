  qualifier: contributes_to
  review:
    summary: Add the conserved complementary ligand-binding contribution.
    action: NEW
    reason: 'Native bovine fetal receptor cryo-EM in PMID:39085615 resolves gamma at the complementary
      alpha1/gamma acetylcholine pocket: W77 contributes the aromatic enclosure, N129/L141 coordinate
      the ligand-associated water, and Y139 covers the ligand. Official 9AVU entity 4 chain B exactly
      matches bovine P13536 residues 23–519. Human canonical P07510 retains the eight checked contact/stabilizing
      positions 75/77/79/83/129/137/139/141; adjacent bovine V138 versus human I138 is explicitly different.
      This is an ISS inference for gamma contribution within the assembled receptor, not human structural
      IDA, an isolated-gamma affinity assay or autonomous binding. P07510-2 replaces canonical residues
      117–169 with lysine and is untested; this assertion does not establish equivalent activity of that
      product. Current same-role CHRND contributes_to binding shows that complementary-subunit participation
      is representable. Typed is_a/part_of checks find no overlap with existing terms; binding adds ligand-contact
      coverage without a NEW process or separate core mechanism.'
    supported_by:
    - reference_id: PMID:39085615
      supporting_text: γY139 provides a hydrophobic cover, locking ACh
