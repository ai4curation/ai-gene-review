  review:
    summary: Retain skeletal-muscle excitation that initiates contraction.
    action: ACCEPT
    reason: PMID:16527851 reconstitutes wild-type human alpha1/beta1/gamma/delta receptors in rat GH4C1
      cells and independently measures fetal receptor current in primary human myotubes. Gamma is a component
      of the conducting heteropentamer, not an autonomous channel. The assembled receptor performs the
      acetylcholine-triggered electrical step of neuromuscular excitation. Human CHRNG loss-of-function
      families in PMID:16826520 and PMID:16826531 have reduced prenatal movement. This does not assign
      actomyosin chemistry or an autonomous contractile motor to gamma. The rat RGD:2354 identity is authenticated
      as Chrng/P18916.
