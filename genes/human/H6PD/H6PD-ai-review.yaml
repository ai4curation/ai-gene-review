id: O95479
gene_symbol: H6PD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Hexose-6-phosphate dehydrogenase is a bifunctional endoplasmic-reticulum
  lumen enzyme that oxidizes glucose 6-phosphate and reduces NADP+ to NADPH, then
  hydrolyzes 6-phosphoglucono-1,5-lactone through its fused 6-phosphogluconolactonase
  domain. The resulting ER NADPH pool drives lumenal reductases, most prominently
  HSD11B1-dependent regeneration of cortisol from cortisone; recessive loss of H6PD
  prevents this cortisol regeneration and causes apparent cortisone reductase deficiency.
  H6PD has broader hexose-6-phosphate and free-glucose dehydrogenase activity than
  cytosolic G6PD, but its core physiological role is ER-lumenal NADPH production.'
