- id: file:human/H6PD/H6PD-uniprot.txt
  title: UniProtKB reviewed record for human H6PD
  findings: []
- id: PMID:18628520
  title: Steroid biomarkers and genetic studies reveal inactivating mutations in
    hexose-6-phosphate dehydrogenase in patients with cortisone reductase
    deficiency.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached body read; the paper directly assays H6PDH activity
      in WT and mutant HEK293 microsomes.
- id: PMID:12858176
  title: Mutations in the genes encoding 11beta-hydroxysteroid dehydrogenase type
    1 and hexose-6-phosphate dehydrogenase interact to cause cortisone reductase
    deficiency.
  findings:
  - statement: >-
      H6PD regenerates ER-lumenal NADPH for HSD11B1, and CRD-associated H6PD
      mutations attenuate or abolish H6PDH activity.
    supporting_text: >-
      We hypothesized that endolumenal hexose-6-phosphate dehydrogenase (H6PDH)
      regenerates NADPH in the ER, thereby influencing directionality of
      11beta-HSD1 activity. Mutations in exon 5 of H6PD in individuals with CRD
      attenuated or abolished H6PDH activity.
    full_text_unavailable: true
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:18628520
      supported_by:
      - reference_id: PMID:18628520
        supporting_text: >-
          we have readdressed the H6PDH enzyme activity data for the R453Q
          variant and show that this does not affect enzyme activity
      - reference_id: PMID:18628520
        supporting_text: >-
          our previous assays were carried out on cell lysates from stably
          transfected cells
      review_notes: PMID:18628520 retained the H6PD-HSD11B1 redox model but
        superseded this paper's inference that the R453Q exon-5 variant impairs
        H6PDH enzyme activity.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; UniProt uses this human experimental paper
      for broad H6PD substrate specificity, including galactose 6-phosphate with
      NADP+. PMID:18628520 later superseded its R453Q loss-of-activity
      interpretation while retaining the H6PD-HSD11B1 redox model.
