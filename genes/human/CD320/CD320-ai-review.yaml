- question: How does the p.Glu88 deletion impair cellular uptake despite preserved purified ectodomain
    ligand affinity, and how much is attributable to trafficking or receptor regulation?
- question: Under what conditions, if any, does endogenous CD320 reside in the endoplasmic reticulum,
    and how does this compare with the reported GFP-fusion localization?
