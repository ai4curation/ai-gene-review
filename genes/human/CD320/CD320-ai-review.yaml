gene_symbol: CD320
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD320 (transcobalamin receptor, formerly 8D6 antigen) is a single-pass type I cell-surface
  glycoprotein that captures transcobalamin carrying vitamin B12 and mediates uptake of this complex by
  endocytosis. Its extracellular region contains two calcium-coordinating LDL receptor class A domains
  that contact transcobalamin, separated by an EGF-like region. Calcium stabilizes the receptor-ligand
  complex, and acidic pH reduces ligand affinity in vitro. CD320 has high selectivity for transcobalamin
  over the related circulating carrier haptocorrin. Its expression is associated with proliferation, with
  higher levels in actively dividing cells than in quiescent cells. It thereby supplies cells with cobalamin
  for subsequent intracellular metabolism. Human variants can impair this uptake and cause transcobalamin
  receptor deficiency with methylmalonic aciduria. CD320 also supports B-cell proliferation in follicular
  dendritic cell coculture experiments; this context-dependent activity is distinct from its broadly established
  nutrient uptake role.
