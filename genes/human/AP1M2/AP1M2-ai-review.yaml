id: Q9Y6Q5
gene_symbol: AP1M2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AP1M2 is the medium (mu-type) subunit mu1B of clathrin-associated adaptor protein complex
  1 (AP-1). AP-1 is a heterotetramer (two large adaptins, a medium mu subunit and a small sigma subunit)
  that recruits clathrin to the trans-Golgi network and endosomal membranes and recognises tyrosine-based
  sorting signals in the cytosolic tails of transmembrane cargo. The mu1B/AP1M2 subunit is expressed in
  polarized epithelial cells and directs basolateral protein sorting, distinguishing the epithelial AP-1B
  complex from the ubiquitous mu1A/AP-1A. It acts at the TGN, cytoplasmic vesicles and clathrin-coated
  vesicle membranes.
