    label: system process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026405
  review:
    summary: Broad ARBA system-process parent.
    action: TOO_GENERAL
    reason: ADCY3 contributes to cAMP synthesis in ciliary and other GPCR signaling pathways; the
      ARBA system-process term is an uninformative parent of specific organismal outputs already
      represented by olfaction, fertilization and appetite-related rows.
    supported_by:
    - &id010
      reference_id: file:human/ADCY3/ADCY3-uniprot.txt
      supporting_text: Catalyzes the formation of the signaling molecule cAMP in response to G
        protein signaling
      record_section:
      - CC:FUNCTION
    - &id011
      reference_id: file:human/ADCY3/ADCY3-uniprot.txt
      supporting_text: Participates in signaling cascades triggered by odorant receptors via its
        function in cAMP biosynthesis
      record_section:
      - CC:FUNCTION
    - &id013
      reference_id: file:human/ADCY3/ADCY3-uniprot.txt
      supporting_text: Required for normal sperm motility and normal male fertility
      record_section:
      - CC:FUNCTION
    - &id014
      reference_id: PMID:29311635
      supporting_text: inhibition of adenylyl-cyclase signaling at the primary cilia of these
        neurons increases body weight
- term:
    id: GO:0003091
    label: renal water homeostasis
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-432040
  qualifier: involved_in
  review:
    summary: Generic Reactome vasopressin/water-homeostasis transfer.
    action: MARK_AS_OVER_ANNOTATED
    reason: Reactome R-HSA-432040 is a vasopressin-to-AQP2 water-reabsorption pathway and does not
      identify ADCY3 as the renal adenylyl cyclase isoform; other ADCY isoforms have direct
      collecting-duct support, so this generic ADCY3 process assertion is over-propagated.
    supported_by:
