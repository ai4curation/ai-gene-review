core_functions:
- description: Ciliary and plasma-membrane adenylyl cyclase that converts ATP to cAMP downstream of
    stimulatory G alpha inputs, including GNAS/Gs at neuronal primary cilia and GNAL/Golf in
    olfactory signaling.
  molecular_function:
    id: GO:0004016
    label: adenylate cyclase activity
  locations:
  - id: GO:0098804
    label: non-motile cilium membrane
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0006171
    label: cAMP biosynthetic process
  - id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  supported_by:
  - *id001
  - *id010
  - *id012
  - *id011
  - *id008
proposed_new_terms: []
suggested_questions:
- question: Which human ciliary GPCR branches use ADCY3 rather than another membrane adenylyl
    cyclase as their local cAMP effector?
- question: Which mouse Adcy3 olfactory and sperm functions have direct human protein or genetic
    evidence sufficient to make them core human ADCY3 contexts?
suggested_experiments:
- description: Endogenously tag ADCY3 in a human ciliated neuronal model and measure
    cilium-restricted cAMP after activating GPR161, MC4R and candidate ciliary GPCRs with ADCY3
    knockout/rescue to separate ADCY3 from other transmembrane adenylyl cyclases.
  experiment_type: isoform-resolved ciliary GPCR-to-cAMP assay
