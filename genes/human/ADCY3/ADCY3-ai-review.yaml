id: O60266
gene_symbol: ADCY3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADCY3 encodes adenylate cyclase type 3, a 12-pass membrane enzyme that converts ATP to cAMP
  downstream of heterotrimeric G-protein signaling. The protein signals from plasma and primary-cilium
  membranes, including neuronal cilia where GPCR-stimulated cAMP production contributes to appetite regulation;
  ortholog evidence also supports AC3 roles in olfactory cilia and sperm function.'
alternative_products:
- name: '1'
  id: O60266-1
- name: '2'
  id: O60266-2
  sequence_note: VSP_055813, VSP_055814, VSP_055815
