- id: PMID:1673139
  title: Localization of the multifunctional protein CAD in astrocytes of rodent brain.
  full_text_unavailable: true
  findings:
  - statement: The available rodent-brain abstract explicitly describes CAD-positive astrocyte-like cells and GFAP confirmation; it does not settle the separately curated fine neuronal locations.
    supporting_text: CAD was observed in cells resembling astrocytes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete canonical abstract read. Immunostaining in rat and hamster brain identifies astrocyte-like cells, with GFAP double staining in rat and Bergmann glia/tanycytes in hamster. These are actual source observations, not deductions from the title. The abstract does not expose the neuronal-cell-body or terminal-bouton experiment attached to the donor annotation; unread full text could contain additional assays, so absence of that detail is not a refutation.
- id: PMID:2864015
  title: Effect of dimethylnitrosamine upon carbamoyl phosphate and ornithine utilization in rat liver.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal cached abstract and official bibliographic identity read. Newborn CFY rats received a single intraperitoneal dimethylnitrosamine dose; CPS I/II, ornithine carbamoyltransferase, ATCase and dihydroorotase activities were followed. The abstract distinguishes increased cytosolic activities from decreased mitochondrial urea-cycle activities. This supports the historical amine-response context as enzyme activity rather than an inferred transcript-only measurement. Full Methods, individual activity data and human treatment responses were not inspected.
- id: PMID:6149265
  title: 'Lesch-Nyhan syndrome, caffeine model: increase of purine and pyrimidine enzymes in rat brain.'
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal cached abstract and official bibliographic identity read. High caffeine ingestion increased rat-brain aspartate carbamoyl-transferase and dihydroorotase activities, alongside other nucleotide-metabolism enzymes. This supports a non-core biochemical response context without assigning caffeine degradation to CAD. The authors question the caffeine model of Lesch-Nyhan syndrome; no human disease mechanism or exact dose-response is inferred. Full Methods and figures were unavailable.
suggested_questions:
- question: Which experimental conditions reconcile the reported nuclear or infection-associated nuclear-matrix pools of CAD with the later cytoplasm-only localization study?
- question: Does human CAD show the autophosphorylation behavior reported for mammalian CAD preparations, and what is its physiological contribution relative to phosphorylation by other kinases?
- question: Does the rat citrulline-biosynthesis annotation represent physiological CAD participation or a coupled CPS II assay using added ornithine carbamoyltransferase?
