id: P27708
gene_symbol: CAD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CAD is a multifunctional cytosolic enzyme that catalyzes the first three steps of de novo pyrimidine nucleotide biosynthesis. Its glutamine-dependent carbamoyl-phosphate synthetase II module uses glutamine, bicarbonate and ATP to produce carbamoyl phosphate; its aspartate carbamoyltransferase module forms carbamoylaspartate; and its zinc-dependent dihydroorotase module cyclizes this intermediate to dihydroorotate. Subsequent reactions catalyzed by DHODH and UMPS produce UMP. CAD forms oligomeric assemblies and couples nucleotide supply to growth through allosteric and phosphorylation-dependent regulation, including S6K-mediated phosphorylation. Biallelic loss-of-function variants cause CAD deficiency, a developmental and epileptic encephalopathy associated with impaired pyrimidine production and depleted glycosylation precursors. Clinical studies report uridine responsiveness, and human CAD-knockout complementation distinguishes damaging from functional variants.
