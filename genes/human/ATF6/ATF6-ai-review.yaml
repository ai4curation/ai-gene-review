core_functions:
- description: The released N-terminal ATF6 transcription factor binds ER-stress response regulatory DNA
    and activates RNA polymerase II transcription of adaptive unfolded-protein-response genes. Chaperone
    and quality-control gene induction increases ER folding capacity, while XBP1 transcription coordinates
    the response with the IRE1 branch. The active DNA-binding product acts in the nucleus after stress-dependent
    ER-to-Golgi trafficking and proteolytic release of the membrane precursor.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0036500
    label: ATF6-mediated unfolded protein response
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10564271
    full_text_unavailable: true
  - reference_id: PMID:11779464
    full_text_unavailable: true
  - reference_id: PMID:14973138
    full_text_unavailable: true
  - reference_id: PMID:26029869
    full_text_unavailable: false
suggested_questions:
- question: Which direct ATF6-dependent transcriptional targets account for the selective human foveal
    and cone phenotype despite broadly expressed ER stress machinery?
- question: Which original supplementary assays establish the ATF6-XBP1 and ATF6-ATF6B pair measurements,
    and how do these isolated zipper interactions differ from endogenous nuclear complexes?
- question: Which ATF6 molecular state accounts for the supported nucleolar and fibrillar-center staining,
    and is that pool transcriptionally active?
suggested_experiments:
- description: Compare isogenic human retinal organoids carrying an achromatopsia-associated ATF6 variant
    with corrected controls, measuring stress-induced ATF6 occupancy and target transcription alongside
    cone differentiation.
  hypothesis: Cell-type-specific ATF6 transcriptional requirements link impaired stress activation to
    the selective retinal developmental phenotype.
