id: P18850
gene_symbol: ATF6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATF6 is a basic leucine zipper transcription factor synthesized as a type II endoplasmic-reticulum
  membrane protein. During ER stress, the precursor moves to the Golgi, where MBTPS1 and MBTPS2 cleave
  it to release the N-terminal transcription factor. The released product enters the nucleus, binds ER-stress
  response regulatory DNA and activates genes encoding chaperones, folding machinery and components of
  ER-associated degradation. ATF6 also induces XBP1 transcription, coordinating branches of the unfolded
  protein response. Biallelic pathogenic ATF6 variants cause achromatopsia with impaired cone function
  and foveal development.
