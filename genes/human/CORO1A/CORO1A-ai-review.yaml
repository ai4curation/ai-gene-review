  review:
    summary: CORO1A regulates actin-network organization at the human lytic synapse.
    action: ACCEPT
    reason: 'The human NK-cell study directly measures local actin-network organization: CORO1A
      deficiency increases cortical F-actin density while reducing area, volume and granule-permissive
      clearances. Bulk G/F-actin distribution and total synaptic F-actin are not increased.
      Jasplakinolide phenocopy supports a requirement for actin dynamics, but the reported deconstruction
      does not resolve increased filament depolymerization rather than altered branching or
      meshwork rearrangement. Thus GO:0032956 remains the precise source-supported scope. GO:0030836
      would not require CORO1A itself to sever filaments, but does require evidence for increased
      depolymerization; that particular mechanism is not established by these architecture measurements.
      This limitation does not negate local depolymerization as a possible contributor.'
