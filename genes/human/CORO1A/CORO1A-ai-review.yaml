id: P31146
gene_symbol: CORO1A
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Coronin-1A is a 461-residue WD-repeat protein with a C-terminal coiled-coil region
  that mediates homotypic association. In leukocyte settings it binds actin and regulates cortical
  actin networks, including Arp2/3-dependent nucleation and remodeling that supports migration,
  phagocytosis and lytic-granule access. Its localization and association with actin depend
  on cellular context; bulk endogenous protein can occupy actin-independent pools. Human CORO1A
  deficiency causes severe or combined immunodeficiency with loss of peripheral T cells. Specialized
  signaling and vesicle-associated observations extend beyond its actin-related behavior, while
  the biochemical mechanisms and contributions of distinct protein pools remain incompletely
  resolved.
