- term:
    id: GO:0001845
    label: phagolysosome assembly
  evidence_type: IMP
  original_reference_id: PMID:12132654
  qualifier: involved_in
  review:
    summary: The cited study links p57 phosphorylation and coat release to phagosome maturation
      but does not isolate a CORO1A fusion function.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0001845 describes phagosome–lysosome fusion. In differentiated human HL60 cells,
      PKC inhibitors retained p57 and F-actin on phagosomes and reduced LAMP1 recruitment. Purified
      p57 was phosphorylated by PKC, but the authors explicitly allow effects through other
      substrates, including MARCKS and pleckstrin. These positive temporal and biochemical observations
      do not distinguish a CORO1A-specific contribution to fusion from the broader kinase perturbation.
      This source-specific over-annotation judgment does not deny its phagosomal association.
      The original Discussion explicitly allows other PKC substrates as the cause of the inhibitor
      phenotype (DOI:10.1248/bpb.25.837, printed page843, Figure6 and adjacent Discussion; public
      original https://www.jstage.jst.go.jp/article/bpb/25/7/25_7_837/_pdf). The later mouse-macrophage
      infection study, PMID:17632055, reports coronin-dependent calcium/calcineurin signaling
      that inhibits lysosomal delivery of mycobacteria. Its complete abstract is available,
      but original full text was not recovered here. That infection-specific inhibitory context
      is not a disproof of all positive CORO1A contributions to phagosome maturation; this overannotation
      judgment remains specific to the unresolved causal attribution in the human PKC-inhibitor
      experiment.
    supported_by:
    - reference_id: PMID:12132654
    - reference_id: file:human/CORO1A/CORO1A-source-excerpts.md
      supporting_text: by inhibiting phosphorylation of other phagosome-binding PKC substrates
    additional_reference_ids:
    - PMID:17632055
