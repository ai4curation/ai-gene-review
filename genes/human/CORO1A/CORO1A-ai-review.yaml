- id: PMID:17632055
  title: Survival of mycobacteria in macrophages is mediated by coronin 1-dependent activation
    of calcineurin.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine complete abstract identifies coronin1-deficient mouse macrophages
      and coronin-dependent calcium/calcineurin signaling that prevents lysosomal delivery of
      mycobacteria. Calcineurin inhibitors restore delivery and bacterial killing. Bounded publisher/institutional
      recovery did not yield original full text; no detailed construct, rescue, figure or Methods
      read is claimed. This supplies infection-specific regulatory context, not a claim that
      all phagolysosome assembly is inhibited by CORO1A.
  findings:
  - statement: In infected mouse macrophages, coronin1 is required for calcineurin activation
      and consequent avoidance of lysosomal delivery; loss of coronin1 or calcineurin inhibition
      permits lysosomal delivery and mycobacterial killing.
core_functions:
- description: CORO1A binds actin filaments and regulates cortical actin-network organization
    in leukocyte settings. Purified human protein inhibits Arp2/3-dependent nucleation, and
    human NK-cell evidence connects CORO1A to synaptic meshwork remodeling that permits granule
    access. Association is context dependent rather than a property of every cellular pool;
    later native-protein experiments identify substantial actin-independent behavior. The defined
    Arp2/3-inhibition process describes the purified biochemical result; the human NK meshwork
    phenotype is not assigned exclusively to that mechanism.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0034316
    label: negative regulation of Arp2/3 complex-mediated actin nucleation
  locations:
  - id: GO:0030864
    label: cortical actin cytoskeleton
  supported_by:
  - reference_id: PMID:17442961
  - reference_id: PMID:24760828
  - reference_id: PMID:15601263
  - reference_id: PMID:42611950
