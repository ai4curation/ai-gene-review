    supporting_text: FL GST-coronin1 significantly inhibited Arp2/3-dependent nucleation
  - reference_id: PMID:24760828
    supporting_text: Coro1A promotes the deconstruction of F-actin density
suggested_questions:
- question: Which native CORO1A pools and activation states support direct actin binding versus
    actin-independent signaling, and how do tag-free measurements reconcile the cellular contexts?
- question: What is the native human CORO1A oligomer distribution in distinct leukocyte states,
    beyond isolated-peptide and hydrodynamic estimates?
- question: Does selective manipulation of CORO1A phosphorylation alter phagosome–lysosome fusion
    independently of other PKC substrates?
- question: What upstream kinase and molecular contacts explain CORO1A-associated changes in
    PKM2 signaling and extracellular-vesicle release?
- question: Which molecular contacts and downstream steps allow CORO1A to maintain basal PI3Kdelta
    signaling and suppress caspase-8-dependent death in peripheral T cells, and how do these
    relate to its actin-regulatory activity?
suggested_experiments:
- description: Compare endogenous, minimally tagged and fluorescently tagged CORO1A with matched
    biochemical actin-binding and live-cell localization measurements in resting and activated
    leukocytes.
  hypothesis: Cell-state and tag effects distinguish the actin-associated functional pool from
    the bulk protein.
- description: Use endogenous CORO1A phosphosite replacement with rescue controls and live lysosomal-content
    mixing, rather than global PKC inhibition alone.
  hypothesis: A CORO1A-specific contribution to phagosome maturation can be separated from parallel
    kinase substrates.
status: DRAFT
