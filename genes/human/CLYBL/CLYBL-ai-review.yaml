gene_symbol: CLYBL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Mitochondrial, magnesium-dependent homotrimeric enzyme of the HpcH/HpaI aldolase
  family (citrate lyase beta subunit-like subfamily) that clears reactive acyl-CoA thioesters
  from the mitochondrial matrix. It hydrolyses (S)-malyl-CoA to malate and free CoA, and cleaves
  (3S)-citramalyl-CoA to pyruvate and acetyl-CoA. Both substrates are inhibitors of the vitamin
  B12-dependent enzyme methylmalonyl-CoA mutase, so removing them protects the mutase and its
  adenosylcobalamin cofactor; CLYBL is accordingly classed as a metabolite-repair enzyme rather
  than a biosynthetic one. Citramalyl-CoA arises from itaconate, an antimicrobial and
  immunomodulatory metabolite made by activated macrophages, whereas malyl-CoA is a continuously
  generated side product of promiscuous citric acid cycle enzymes. Which of the two substrates
  dominates physiologically is debated: the itaconate route is inducible and largely confined
  to activated myeloid cells, while CLYBL itself is expressed in the mitochondria of all
  mammalian tissues, and cells lacking CLYBL accumulate malyl-CoA without accumulating
  itaconyl-CoA yet still lose adenosylcobalamin. The purified enzyme also catalyses the
  Claisen-condensation reverse reactions, malate synthase and beta-methylmalate synthase, but
  with a specificity constant more than a thousandfold below the lyase reaction and a millimolar
  KM for glyoxylate; humans have no glyoxylate shunt for such a reaction to serve. A common
  premature-stop polymorphism (rs41281112, p.Arg259*) abolishes the protein in a few percent of
  people, who are otherwise healthy but have reduced circulating vitamin B12.'
