suggested_questions:
- question: Is the direction of GO:0106121 positive regulation of cobalamin catabolic process
    correct for CLYBL? CLYBL destroys the acyl-CoA species that inactivate adenosylcobalamin,
    and its loss is what lowers circulating B12, which argues for GO:0106122 negative regulation
    of cobalamin catabolic process. The negative-regulation term currently has no annotations
    at all, while the positive one is annotated essentially only to CLYBL and its orthologues.
  experts:
  - Vamsi K Mootha
  - Carole L Linster
- question: Which substrate dominates CLYBL flux in a resting, non-inflamed tissue - malyl-CoA
    from promiscuous citric acid cycle chemistry, or citramalyl-CoA from itaconate? The two
    models predict different tissue and stimulus dependence for the B12 phenotype.
  experts:
  - Carole L Linster
  - Vamsi K Mootha
- question: What enzyme actually generates mitochondrial (S)-malyl-CoA in vivo, and at what
    flux? The repair model requires a continuous source, but the side reaction responsible has
    not been pinned to a specific citric acid cycle enzyme.
  experts:
  - Carole L Linster
- question: Should EC 2.3.3.9 (malate synthase) and EC 2.3.3.- (beta-methylmalate synthase) be
    retained on UniProt Q8N0X4 as function-level claims, given a specificity constant more than
    1000-fold below the lyase reaction, a millimolar KM for glyoxylate, and the absence of a
    glyoxylate shunt in humans?
  experts: []
suggested_experiments:
- hypothesis: Malyl-CoA, not itaconyl/citramalyl-CoA, is the species whose accumulation causes
    the B12 phenotype of CLYBL loss-of-function humans.
  description: Measure malyl-CoA, itaconyl-CoA, citramalyl-CoA, adenosylcobalamin and
    methylmalonic acid in primary cells (e.g. fibroblasts and unstimulated monocytes) from
    rs41281112 homozygotes and matched controls, then repeat after LPS/IFN-gamma stimulation to
    induce ACOD1 and itaconate. If the itaconate model is dominant the B12/MMA defect should be
    largely stimulation-dependent; if the malyl-CoA model is dominant it should be present at
    baseline.
  experiment_type: Targeted acyl-CoA metabolomics in human primary cells
- hypothesis: The malate synthase activity of CLYBL is a promiscuous side reaction that can be
    separated from the physiological thioesterase/lyase activity.
  description: Use the CLYBL crystal structure to design active-site variants that retain
    (S)-malyl-CoA thioesterase and (3S)-citramalyl-CoA lyase activity but lose the
    glyoxylate-condensation reactions, then test whether such a variant rescues adenosylcobalamin
    levels in CLYBL-null cells. Rescue by a synthase-dead protein would show the condensation
    chemistry is dispensable.
  experiment_type: Structure-guided separation-of-function mutagenesis with cellular rescue
- hypothesis: CLYBL negatively regulates cobalamin catabolism.
  description: Quantify the turnover of labelled cobalamin (and of the adenosylcobalamin bound
    to MMUT specifically) in isogenic CLYBL wild-type and knockout cells, with and without
    itaconate or malate loading. A higher cobalamin degradation rate in the knockout would
    settle the direction of the GO regulation term empirically.
  experiment_type: Cofactor turnover measurement with stable-isotope-labelled cobalamin
