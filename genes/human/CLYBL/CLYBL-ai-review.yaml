core_functions:
- molecular_function:
    id: GO:0016289
    label: acyl-CoA hydrolase activity
  description: CLYBL hydrolyses (S)-malyl-CoA to (S)-malate and free CoA (EC 3.1.2.30,
    RHEA:38291) in the mitochondrial matrix, using a Mg(2+) ion bound one per subunit in a
    homotrimeric assembly. Malyl-CoA is formed continuously as a side product of promiscuous
    citric acid cycle enzymes and is a potent inhibitor of the vitamin B12-dependent enzyme
    methylmalonyl-CoA mutase, so this hydrolysis is a metabolite-repair reaction that protects
    the mutase and its adenosylcobalamin cofactor. Cells lacking CLYBL accumulate malyl-CoA and
    lose adenosylcobalamin without accumulating itaconyl-CoA, which is why this rather than
    itaconate catabolism is proposed as the housekeeping physiological role. No dedicated GO
    term for the reaction exists; acyl-CoA hydrolase activity is the closest available parent.
