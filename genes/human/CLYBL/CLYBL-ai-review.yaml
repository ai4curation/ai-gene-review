    target_term:
      id: EC:3.1.2.30
      label: (S)-malyl-CoA hydrolase
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:38291
      label: (S)-malyl-CoA + H2O = (S)-malate + CoA + H(+)
  supported_by:
