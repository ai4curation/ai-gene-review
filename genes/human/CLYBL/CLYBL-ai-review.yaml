- molecular_function:
    id: GO:0047777
    label: (S)-citramalyl-CoA lyase activity
  description: CLYBL cleaves (3S)-citramalyl-CoA into pyruvate and acetyl-CoA (EC 4.1.3.25,
    RHEA:22612), the terminal step of the C5-dicarboxylate pathway that disposes of itaconate.
    Itaconate is produced by activated macrophages; its CoA ester inactivates the
    adenosylcobalamin cofactor of methylmalonyl-CoA mutase, and CLYBL-null cells accumulate
