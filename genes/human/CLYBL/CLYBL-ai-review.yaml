proposed_new_terms:
- proposed_name: (S)-malyl-CoA hydrolase activity
  proposed_definition: Catalysis of the reaction (S)-malyl-CoA + H2O = (S)-malate + CoA + H(+).
  justification: The reaction is assigned EC 3.1.2.30 and RHEA:38291, is directly measured for
    human CLYBL (KM 11 uM, kcat 9.4 per second), and is now proposed to be the enzyme's
    physiological function. GO currently has no term for it, so the annotation has to fall back
    on the generic GO:0016289 acyl-CoA hydrolase activity, which is uninformative about the
    substrate and gives no handle on the metabolite-repair role.
  proposed_parent:
    id: GO:0016289
    label: acyl-CoA hydrolase activity
  proposed_mappings:
