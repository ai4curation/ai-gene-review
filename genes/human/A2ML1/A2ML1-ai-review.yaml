- id: PMID:16298998
  title: A novel protease inhibitor of the alpha2-macroglobulin family expressed in the
    human epidermis.
  findings:
  - statement: >-
      A2ML1 is a 1454-residue alpha-2-macroglobulin-family protein with a central bait
      domain and a typical thiol ester sequence, detected as a monomeric ~180 kDa protein
      in human epidermis.
    supporting_text: >-
      A2ML1 encodes a protein of 1454 amino acids, which fits the characteristics of
      alpha2Ms
  - statement: >-
      Recombinant A2ML1 inhibits endopeptidases of several catalytic classes - chymotrypsin,
      papain, thermolysin, subtilisin A and weakly elastase - but not trypsin.
    supporting_text: >-
      Recombinant alpha2ML1 displayed inhibitory activity toward chymotrypsin, papain,
      thermolysin, subtilisin A, and to a lesser extent, elastase but not trypsin.
  - statement: >-
      A2ML1 forms covalent complexes with chymotrypsin and with the desquamation protease
      kallikrein-7, the hallmark alpha-2-macroglobulin trapping reaction.
    supporting_text: >-
      Incubation with chymotrypsin and the chymotrypsin-like kallikrein 7 protease
      indicated that alpha2ML1 binds covalently to these proteases, a feature shared with
      other members of the family.
  - statement: >-
      A2ML1 accumulates in keratinosomes (epidermal lamellar bodies) of granular-layer
      keratinocytes and is then secreted into the intercellular space beneath the cornified
      layer.
    supporting_text: >-
      By immunohistochemistry, alpha2ML1 was detected within keratinosomes in the granular
      layer of the epidermis, and as a secreted product in the extracellular space between
      the uppermost granular layer and the cornified layer.
  - statement: >-
      Expression is concentrated in epidermal granular keratinocytes and increases with
      keratinocyte differentiation.
    supporting_text: >-
      Northern blot and reverse transcriptase-PCR studies revealed a single 5-kb A2ML1
      mRNA, mainly in the epidermis granular keratinocytes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation. This is the defining paper for A2ML1 and
      the source of all four experimental GOA annotations. The cache is abstract-only, but
      every claim used in this review is stated explicitly in the abstract.
- id: PMID:26121085
  title: Rare A2ML1 variants confer susceptibility to otitis media.
  findings:
  - statement: >-
      A rare A2ML1 duplication variant cosegregates with otitis media in an indigenous
      Filipino pedigree at LOD 7.5, lies in a founder haplotype shared by otitis-prone
      American children, and is absent from non-otitis-prone children and >62,000 control
      sequences; seven further variants were found in six otitis-prone children.
    supporting_text: >-
      A duplication variant within the middle ear-specific gene A2ML1 cosegregates with
      otitis media in an indigenous Filipino pedigree (LOD score = 7.5 at reduced
      penetrance)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation. Added so that the otitis-media claim in the
      description rests on primary human genetics rather than on the gate-tripped affinage
      record. Genetic susceptibility only - deliberately not converted into a GO process
      annotation, since the molecular mechanism linking loss of protease inhibition to
      middle-ear disease is unresolved.
- id: PMID:20805888
  title: The protease inhibitor alpha-2-macroglobulin-like-1 is the p170 antigen recognized
    by paraneoplastic pemphigus autoantibodies in human.
  findings:
  - statement: >-
      The long-unidentified Mr 170,000 paraneoplastic pemphigus autoantigen was identified
      by immunoprecipitation and mass spectrometry as A2ML1, recognised by 10 PNP sera and
      by none of the control sera.
    supporting_text: >-
      we identified p170 as alpha-2-macroglobuline-like-1, a broad range protease inhibitor
      expressed in stratified epithelia and other tissues damaged in the PNP disease course.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation. Added to anchor the p170-autoantigen claim in
      the description to primary literature. Also independently corroborates the "broad range
      protease inhibitor expressed in stratified epithelia" characterisation. Being an
      autoantigen is not a molecular function, so no annotation is derived from it.
