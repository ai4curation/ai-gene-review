suggested_questions:
- question: >-
    Is A2ML1 genuinely a desquamation regulator? Both UniProt and the primary paper only
    hedge ("May play an important role during desquamation"), and no experiment has yet
    shown that loss of A2ML1 alters corneodesmosome degradation or stratum corneum
    cohesion. A demonstration would justify a specific skin-barrier or desquamation
    biological-process annotation, which the gene currently lacks entirely.
- question: >-
    What is the mechanistic link between A2ML1 loss of function and otitis media
    susceptibility? If unrestrained middle-ear epithelial protease activity is the
    proximate cause, an epithelial-integrity or defence process annotation might be
    warranted; if the mechanism is the reported desmoplakin dysregulation, it may instead
    be a downstream consequence.
- question: >-
    Does A2ML1 inhibit threonine endopeptidases? UniProt states the family inhibits "all
    four classes of proteinases", but the A2ML1-specific enzymology covers only serine,
    cysteine and metallo endopeptidases. The gap matters for whether the broad
    endopeptidase-inhibitor term is fully justified for A2ML1 or is partly inherited from
    A2M.
- question: >-
    Are the reported Noonan-syndrome-associated A2ML1 variants pathogenic? A zebrafish
    study supported a RASopathy-like mechanism, but a later systematic segregation analysis
    across RASopathy families found the variants inherited from unaffected parents
    alongside alternative causal aberrations. This should be settled before any
    developmental-process annotation is contemplated.
suggested_experiments:
- hypothesis: >-
    A2ML1 restrains kallikrein-driven desquamation in the stratum corneum.
  description: >-
    Assay corneodesmosome degradation and stratum corneum cohesion in reconstructed human
    epidermis with A2ML1 knocked down or knocked out, measuring KLK5/KLK7 activity in situ
    with fluorogenic substrates and quantifying desmoglein-1 and corneodesmosin cleavage.
  experiment_type: cell biology
- hypothesis: >-
    A2ML1's inhibitory spectrum is set by its bait-region sequence rather than by
    class-specific active-site recognition.
  description: >-
    Systematically swap the A2ML1 bait region (residues 695-726) with those of A2M and PZP,
    and with designed sequences containing or lacking trypsin-cleavable residues, then
    re-measure the inhibition profile across serine, cysteine, metallo and threonine
    endopeptidases.
  experiment_type: protein engineering
- hypothesis: >-
    A2ML1 reaches the intercellular space of the stratum corneum via epidermal lamellar
    bodies.
  description: >-
    Immunoelectron microscopy of human epidermis co-labelling A2ML1 with established
    lamellar-body cargo markers, plus live imaging in differentiating keratinocytes, to
    confirm lamellar-body residence and secretion route and to firm up the proposed
    GO:0097209 annotation.
  experiment_type: microscopy
- hypothesis: >-
    Otitis-media-associated A2ML1 variants act by loss of protease-inhibitory function.
  description: >-
    Express the reported otitis-media pedigree variants as recombinant protein and measure
    bait-region cleavage, thioester integrity, covalent complex formation with KLK7 and
    residual inhibition, distinguishing loss of inhibitory activity from loss of expression
    or secretion.
  experiment_type: biochemistry
