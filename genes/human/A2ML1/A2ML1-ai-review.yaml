  - statement: >-
      Machine-fetched Affinage record describing A2ML1 as a secreted broad-spectrum
      protease inhibitor of the alpha-2-macroglobulin family expressed in stratified
      epithelia, with otitis-media susceptibility, paraneoplastic pemphigus autoantigen
