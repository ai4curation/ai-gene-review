core_functions:
- description: >-
    Broad-spectrum endopeptidase inhibition by the alpha-2-macroglobulin trapping
    mechanism. A target protease cleaves A2ML1's exposed bait region, triggering a
    conformational change that entraps the enzyme and hydrolyses the internal
    isoglutamyl-cysteine thioester so that the inhibitor becomes covalently attached to the
    protease. Because specificity resides largely in the bait region rather than in an
    active-site-complementary surface, a single A2ML1 molecule inhibits endopeptidases of
    several catalytic classes - serine (chymotrypsin, subtilisin A), cysteine (papain) and
    metallo (thermolysin) - while sparing trypsin. The most likely physiological target is
    the desquamation kallikrein KLK7, with which A2ML1 forms a covalent complex in vitro and
    which acts in the same extracellular compartment; the interaction has not yet been shown
    in intact skin.
