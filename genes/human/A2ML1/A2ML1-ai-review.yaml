description: >-
  A2ML1 (alpha-2-macroglobulin-like protein 1) is a secreted, monomeric ~180 kDa
  broad-spectrum protease inhibitor of the alpha-2-macroglobulin family (MEROPS
  family I39), and the first member of that family found in epidermis. Like other
  alpha-2-macroglobulins it inhibits by physical entrapment rather than by
  active-site occlusion: a target protease cleaves an exposed bait region, which
  triggers a large conformational change that cages the enzyme and exposes an
  internal isoglutamyl-cysteine thioester, forming a covalent bond between
  inhibitor and protease. Because the bait region is the main specificity
  determinant, a single A2ML1 molecule can inhibit endopeptidases from several
  catalytic classes; recombinant protein inhibits chymotrypsin, papain,
  thermolysin, subtilisin A and, weakly, elastase, but not trypsin. It is
  expressed principally in granular-layer keratinocytes of the epidermis and is
  up-regulated during keratinocyte differentiation, accumulating in keratinosomes
  (epidermal lamellar bodies) before being secreted into the extracellular space
  between the granular and cornified layers. In vitro it forms a covalent complex
  with the desquamation protease kallikrein-7, which is expressed in that same
  compartment, though the trapping reaction has not been demonstrated in intact
  skin. Rare A2ML1 variants confer susceptibility to otitis media, and the protein
  is the p170 autoantigen of paraneoplastic pemphigus.
