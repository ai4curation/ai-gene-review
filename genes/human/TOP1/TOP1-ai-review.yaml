id: P11387
gene_symbol: TOP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TOP1 encodes the canonical nuclear type IB DNA topoisomerase that transiently cleaves and rejoins one strand
  of duplex DNA to relax supercoils generated by replication, transcription and other chromatin transactions. The enzyme is
  concentrated in the nucleoplasm and nucleolus, can remain associated with mitotic chromosomes, and has context-specific
  regulatory activities, including BMAL1 promoter topology control and an experimentally reported SR-protein kinase activity,
  that are secondary to its conserved ATP-independent DNA relaxation reaction.
