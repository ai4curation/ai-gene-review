    summary: TOP1 binds mitotic nuclear chromosomes.
    action: KEEP_AS_NON_CORE
    reason: PMID:9049244 directly visualized human TOP1 on mitotic chromosomes. This chromosomal localization is real but
      episodic relative to the enzyme's constitutive nuclear and nucleolar DNA-relaxation role.
    supported_by:
    - reference_id: PMID:9049244
      supporting_text: In mitosis, topoisomerase IIbeta diffused completely into the cytosol, whereas topoisomerases I and
        IIalpha remained chromosome bound.
