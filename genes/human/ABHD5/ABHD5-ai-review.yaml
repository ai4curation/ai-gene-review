    reason: 'The original human study used His-tagged ABHD5 expressed in E. coli and nickel-affinity purification,
      followed by LPA-to-PA assays; yeast overexpression also increased extract activity. Full PMID:24879803
      directly tests these premises: bacterial PlsC contamination explains affinity-purified activity,
      stricter purification retains ATGL coactivation while removing LPAAT, and human Protein-A-ABHD5
      expressed in wild-type or ict1-deleted yeast does not increase LPAAT activity. These are biochemical
      counterexperiments, not an inference from an inaccessible abstract. Later PMID:25315780 reports
      LPAAT in human-ABHD5-overexpressing 293T homogenates and purified Sf9 LPGAT activity; that different
      substrate/preparation does not isolate intrinsic human LPAAT from endogenous enzymes. The direct
      LPAAT assignment is therefore not retained; indirect phospholipid effects and other catalytic activities
      are not excluded.'
