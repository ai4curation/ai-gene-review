- description: Promotes PNPLA1 recruitment and stimulation at lipid droplets during epidermal omega-O-acylceramide
    synthesis. Human construct experiments separate deficient ABHD5–PNPLA1 association from defective
    perilipin-dependent droplet targeting; forced membrane co-localization rescues the tested disease
    variants in proteoliposomes. ABHD5 provides spatial and regulatory support while PNPLA1 catalyzes
    transacylation. The effects depend on the reconstitution context, and this role is not expressed as
    intrinsic ABHD5 acyltransferase or lipase activity.
