- term:
    id: GO:0004620
    label: glycerophospholipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G24160
  - FB:FBgn0033226
  - MGI:MGI:1915938
  - PANTHER:PTN008676419
  - SGD:S000003342
  review:
    summary: Ancestral phospholipid-hydrolase activity does not fit the experimentally tested human ABHD5
      protein.
    action: REMOVE
    reason: GO:0004620 requires hydrolysis of a glycerophospholipid. Indexed full PMID:18606822 reports
      that recombinant human ABHD5 lacked phospholipase and lysophospholipase activities; the mammalian
      canonical lipase nucleophile is also replaced by asparagine. The PAINT node includes enzymatic family
      members such as mouse Abhd4 (MGI:1915938), but descent does not overcome these target-specific tests
      and functional divergence. PMID:26745266 further challenges the plant donor catalytic premise. This
      removes the inherited lipid-hydrolase assertion, not the demonstrated coactivator role or the chemically
      different HDAC4 protease report.
    additional_reference_ids:
    - PMID:18606822
    - PMID:24879803
    - PMID:26745266
    - PMID:31742248
    supported_by:
    - reference_id: PMID:24879803
      supporting_text: it lacks a serine residue in a conserved sequence (GXSXG) that normally harbors
        the nucleophilic component of the catalytic triad
    - reference_id: PMID:26745266
      supporting_text: recombinant plant CGI-58 does not catalyze TAG or phospholipid hydrolysis.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN008676419
        source_status: UNRESOLVED
        comment: PTN008676419 is the seeded ancestral source. Target human negative phospholipid-hydrolysis
          results and mammalian lipase-site divergence challenge inheritance at this target. The full
          PAINT alignment/node evidence was not independently retrieved; no donor-count or self-evidence
          argument is used.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
- term:
    id: GO:0004806
    label: triacylglycerol lipase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9DBL9
  negated: true
  review:
    summary: The NOT annotation correctly separates ABHD5 from the triglyceride hydrolase it activates.
    action: ACCEPT
    reason: This is a negated annotation transferred from mouse Abhd5 Q9DBL9, not a positive lipase assignment.
      Full human PMID:18606822 explicitly reports no triolein lipase activity, while PMID:16679289 establishes
      stimulation of ATGL. The negative conclusion is scoped to intrinsic triglyceride hydrolysis and
      does not deny the separately reported peptide-bond cleavage of HDAC4. Exact donor annotation provenance
      was not recovered, but independent human evidence supports retaining the curator assertion.
    additional_reference_ids:
    - PMID:18606822
    - PMID:16679289
    - PMID:31742248
    supported_by:
    - reference_id: PMID:16679289
      supporting_text: CGI-58 interacts with ATGL, stimulating its TG hydrolase activity up to 20-fold.
    - reference_id: PMID:24879803
      supporting_text: it lacks a serine residue in a conserved sequence (GXSXG) that normally harbors
        the nucleophilic component of the catalytic triad
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q9DBL9
        source_status: UNRESOLVED
        comment: Mouse Abhd5 Q9DBL9 is the ortholog source. The exact source NOT experiment was not independently
          recovered; direct human negative triolein assays and positive ATGL coactivation corroborate
          this target judgment.
