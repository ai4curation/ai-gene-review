id: Q8WTS1
gene_symbol: ABHD5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABHD5 (CGI-58) is a lipid-droplet-associated regulatory protein with an alpha/beta-hydrolase
  fold. It binds and activates adipose triglyceride lipase (ATGL/PNPLA2), promoting mobilization of stored
  triacylglycerol. Its distribution between cytosol and lipid droplets helps couple partner access to
  lipid metabolism. In epidermal lipid synthesis, ABHD5 also promotes PNPLA1 recruitment to droplets and
  enhances formation of omega-O-acylceramides needed for the skin barrier. Biallelic loss-of-function
  variants cause neutral lipid storage disease with ichthyosis, also called Chanarin-Dorfman syndrome.
  Earlier assignments of intrinsic lysophosphatidic acid acyltransferase activity were challenged by contaminant-controlled
  assays, including human protein expressed in yeast. A separate human recombinant-protein study reports
  HDAC4 proteolysis; this context-dependent activity is distinct from triglyceride hydrolysis and from
  the established lipid-enzyme coactivation roles.
existing_annotations:
- term:
    id: GO:0003841
    label: 1-acylglycerol-3-phosphate O-acyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:18606822
  qualifier: enables
  review:
    summary: The reported intrinsic human LPA acyltransferase activity is contradicted by contaminant-controlled
      assays.
    action: REMOVE
    reason: 'The original human study used His-tagged ABHD5 expressed in E. coli and nickel-affinity purification,
      followed by LPA-to-PA assays; yeast overexpression also increased extract activity. Full PMID:24879803
      directly tests these premises: bacterial PlsC contamination explains affinity-purified activity,
      stricter purification retains ATGL coactivation while removing LPAAT, and human Protein-A-ABHD5
      expressed in wild-type or ict1-deleted yeast does not increase LPAAT activity. These are biochemical
      counterexperiments, not an inference from an inaccessible abstract. Later PMID:25315780 reports
      LPAAT in human-ABHD5-overexpressing 293T homogenates and purified Sf9 LPGAT activity; that different
      substrate/preparation does not isolate intrinsic human LPAAT from endogenous enzymes. The direct
      LPAAT assignment is therefore not retained; indirect phospholipid effects and other catalytic activities
      are not excluded.'
    additional_reference_ids:
    - PMID:24879803
    - PMID:25315780
    - PMID:26745266
    supported_by:
    - reference_id: PMID:18606822
      supporting_text: the gene was overexpressed in Escherichia coli, and the purified recombinant protein
        was found to specifically acylate lysophosphatidic acid in an acyl-CoA-dependent manner.
    - reference_id: PMID:24879803
      supporting_text: Cell-free extracts from both strains of yeast showed comparable LPAAT activity,
        whether or not hCGI-58 was expressed
    - reference_id: PMID:24879803
      supporting_text: Alteration of purification methods to reduce plsC contamination eliminates LPAAT
        activity, without affecting the capacity of recombinant CGI-58 to coactivate TAG hydrolysis catalyzed
        by ATGL.
