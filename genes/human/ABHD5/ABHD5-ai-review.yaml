- term:
    id: GO:0006654
    label: phosphatidic acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008676419
  - SGD:S000004089
  - UniProtKB:Q8WTS1
  review:
    summary: The direct phosphatidic-acid synthesis assignment depends on challenged LPAAT chemistry.
    action: REMOVE
    reason: The source interpretation places ABHD5 at the LPA-to-PA catalytic step. PMID:24879803 directly
      challenges the original recombinant and human-yeast LPAAT experiments. The 2008 increase in phospholipid
      labeling is a genuine measured phenotype, but does not distinguish ABHD5 catalysis from altered
      substrate supply or regulation of endogenous enzymes. The later 293T homogenate observation in PMID:25315780
      likewise does not isolate this direct role. Remove this asserted synthesis mechanism while retaining
      established lipid homeostasis and lipase activation.
    additional_reference_ids:
    - PMID:18606822
    - PMID:24879803
    - PMID:25315780
    - PMID:26745266
    supported_by:
    - reference_id: PMID:24879803
      supporting_text: Cell-free extracts from both strains of yeast showed comparable LPAAT activity,
        whether or not hCGI-58 was expressed
    - reference_id: PMID:24879803
      supporting_text: Alteration of purification methods to reduce plsC contamination eliminates LPAAT
        activity, without affecting the capacity of recombinant CGI-58 to coactivate TAG hydrolysis catalyzed
        by ATGL.
    propagation_review:
      root_cause: SOURCE_BAD
      source_entities:
      - source_id: PANTHER:PTN008676419
        source_status: UNRESOLVED
        comment: PTN008676419 is the ancestral source. Human target evidence is an appropriate descendant
          seed, but its direct LPAAT/PA-synthesis interpretation is challenged by controlled follow-up
          experiments. The yeast Ict1 contribution is not declared false.
