suggested_questions:
- question: What additional activity of ABHD5 enhances PNPLA1 transacylation after membrane co-localization,
    and which experimental features explain the different recombinant reconstitution results?
- question: Can rigorously purified human ABHD5 from a eukaryotic system resolve the LPAAT/LPGAT controversy
    with matched mock purification, endogenous-enzyme exclusion and active-protein controls?
- question: How broadly does the reported HDAC4 protease activity operate in endogenous human tissues,
