id: P02787
gene_symbol: TF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TF (serotransferrin) is a secreted bilobed plasma glycoprotein, produced mainly by the liver,
  that reversibly binds two ferric (Fe3+) ions (each lobe one Fe3+ with a bicarbonate anion) and transports
  iron through the blood. Iron-loaded (holo) transferrin binds the transferrin receptors TfR1 (TFRC) and
  TfR2 at the cell surface and is internalized via clathrin-coated pits into early/recycling endosomes,
  where acidification releases the iron; apo-transferrin then recycles to the surface. Transferrin is
  central to systemic iron homeostasis and, by keeping plasma iron sequestered, contributes to nutritional
  immunity against pathogens.
