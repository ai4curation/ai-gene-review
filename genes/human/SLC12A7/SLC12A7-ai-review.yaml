suggested_questions:
- question: In which human epithelia (if any) is KCC4 localized to the apical
    rather than the basolateral plasma membrane, and does the sub-membrane domain
    determine net transport direction?
- question: Does human KCC4 ever operate in a net K+ import mode in vivo (e.g. in
    cochlear Deiters' cells), or is physiological transport always K+/Cl- efflux?
