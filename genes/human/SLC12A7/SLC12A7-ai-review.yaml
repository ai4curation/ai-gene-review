gene_symbol: SLC12A7
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC12A7 encodes KCC4 (K-Cl cotransporter 4), a multi-pass plasma
  membrane protein of the SLC12/cation-chloride cotransporter family that mediates
  electroneutral, cell-swelling-activated cotransport of potassium and chloride
  ions across the plasma membrane with 1:1 stoichiometry. It functions as a
  domain-swapped homodimer (and can heterodimerize with KCC2/SLC12A5) and uses the
  outwardly directed K+ gradient to drive K+ and Cl- efflux, contributing to
  regulatory volume decrease and cellular chloride/pH homeostasis. KCC4 is widely
  expressed, with major physiological roles in the kidney, where it supports
  basolateral chloride extrusion in the proximal tubule and renal acidification,
  and in the inner ear, where it participates in K+ recycling and is required for
  survival of cochlear hair cells and maintenance of the organ of Corti.
