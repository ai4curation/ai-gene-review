- term:
    id: GO:0006884
    label: cell volume homeostasis
  evidence_type: EXP
  original_reference_id: PMID:10913127
  qualifier: involved_in
  review:
    summary: Proposed annotation. KCC4-mediated K-Cl efflux is activated by cell
      swelling and drives regulatory volume decrease, making KCC4 a direct
      participant in cell volume homeostasis.
    action: NEW
    reason: KCC4 K-Cl cotransport is minimal under isotonic conditions and
      strongly activated by hypotonic cell swelling; by effluxing K+ and Cl- (and
      osmotically obligated water) it directly performs the volume-reducing step
      of regulatory volume decrease, so KCC4 does some of the work of this
      process rather than merely being required for it. This core role is not
      captured by the existing transport-process annotations.
    supported_by:
    - reference_id: PMID:10913127
      supporting_text: Both KCCs express minimal K(+)-Cl(-) cotransport under
        isotonic conditions, with significant activation by cell swelling under
        hypotonic conditions.
