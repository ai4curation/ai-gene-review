- term:
    id: GO:1990573
    label: potassium ion import across plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9WVL3
  - ensembl:ENSMUSP00000017900
  review:
    summary: Directional K+ import term from the mouse ortholog. KCC4's
      predominant physiological direction is efflux (K+/Cl- out of the cell); net
      K+ import is a context-specific (e.g. cochlear) direction, so this is kept
      as non-core.
    action: KEEP_AS_NON_CORE
    reason: K-Cl cotransport is reversible and gradient-driven; in most tissues
      the outward K+ gradient drives K+ (and Cl-) efflux. UniProt notes KCC4 may
      mediate K+ uptake into Deiters' cells in the cochlea, which supports an
      import direction in that specialized context, but net K+ import is not the
      core physiological mode, so the term is retained as non-core.
    supported_by:
    - reference_id: file:human/SLC12A7/SLC12A7-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: May mediate K(+) uptake into Deiters' cells in the cochlea
