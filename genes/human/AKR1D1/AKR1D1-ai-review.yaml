core_functions:
- description: Uses NADPH to stereospecifically reduce the C4-C5 double bond of 3-oxo-Delta4
    steroids in cytosol. Steroid recognition and the Tyr58/Glu120 catalytic environment generate
    5beta products with a cis A/B ring junction while preserving the 3-oxo group. Reduction of
    bile-acid precursors contributes to cholesterol breakdown and primary bile-acid synthesis; the
    same activity metabolizes androgen and C21 hormone substrates.
  molecular_function:
    id: GO:0047787
    label: Delta4-3-oxosteroid 5beta-reductase activity
  directly_involved_in:
  - id: GO:0006699
    label: bile acid biosynthetic process
  - id: GO:0006707
    label: cholesterol catabolic process
  - id: GO:0008209
    label: androgen metabolic process
  - id: GO:0008207
    label: C21-steroid hormone metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7508385
    supporting_text: catalyzes the reduction of the delta 4 double bond of bile acid intermediates
      and steroid hormones carrying the delta 4-3-one structure in the A/B cis configuration.
  - reference_id: PMID:21255593
    supporting_text: 5β-Reduced products were identified directly with all the C18-C27 steroid
      substrates except for aldosterone.
  - reference_id: PMID:18407998
    supporting_text: Each steroid carbonyl accepts hydrogen bonds from catalytic residues Tyr 58 and
      Glu 120 .
