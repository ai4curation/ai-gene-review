- id: PMID:38034430
  title: 'Healthy Patients With AKR1D1 Mutation Not Requiring Primary Bile Acid Therapy: A Case Series.'
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full recovered five-patient case-series Methods/Results/Discussion read. Three
      patients lacked liver dysfunction despite AKR1D1 variants and atypical bile-acid profiles,
      demonstrating variable clinical expression. Proposed age-dependent MRP3 compensation is explicitly
      a hypothesis, not a measured mechanism. Short follow-up and no follow-up biopsy in described cases
      limit inference; the study neither negates the established reaction nor establishes general
      treatment dispensability.
