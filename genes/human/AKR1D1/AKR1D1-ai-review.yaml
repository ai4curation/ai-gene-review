  title: Cloning and expression of cDNA of human delta 4-3-oxosteroid 5 beta-reductase and substrate
    specificity of the expressed enzyme.
  findings:
  - statement: In the reported COS-cell expression assay, human AKR1D1 had high activity toward the
      tested bile-acid intermediates, smaller positive cortisol/testosterone activity and no
      observed progesterone/androstenedione activity under those conditions. Later purified-enzyme
      measurements establish a broader substrate range.
    supporting_text: Transfection of the cDNA into COS cells resulted in the expression of an active
      enzyme with a high activity toward the bile acid intermediates 7 alpha,12
      alpha-dihydroxy-4-cholesten-3-one and 7 alpha-hydroxy-4-cholesten-3-one.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract verifies human cDNA expression in COS cells,
      bile-acid-precursor reduction, positive cortisol/testosterone activity, and assay-specific
      progesterone/androstenedione negatives. Localization and digestion panels are not exposed in
      the abstract. The source-specific substrate ranking is not a universal limit on hormone
      metabolism.
  full_text_unavailable: true
