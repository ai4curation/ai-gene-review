id: P51857
gene_symbol: AKR1D1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AKR1D1 is a soluble cytosolic steroid 5beta-reductase that uses NADPH to reduce the C4-C5 double bond
  of 3-oxo-Delta4 steroids while retaining their 3-oxo group. The resulting cis-fused A/B ring is required
  for bile acid biosynthesis from cholesterol. The enzyme also reduces androgen, progestogen and glucocorticoid
  substrates, contributing to steroid hormone metabolism. Its steroid-binding pocket and Tyr58/Glu120
  catalytic dyad support this distinctive double-bond reduction. AKR1D1 is highly expressed in liver;
  biallelic loss-of-function variants cause congenital bile acid synthesis defect type 2, with deficient
  primary bile acids and accumulation of abnormal steroid intermediates.
