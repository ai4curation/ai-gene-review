- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  review:
    action: KEEP_AS_NON_CORE
    summary: Curated BioPlex evidence supports AKR1D1 coassociation with AKR1C1 (Q04828).
    reason: The experimental IPI annotation identifies AKR1C1 (Q04828), and the UniProt IntAct record
      independently lists the AKR1D1–AKR1C1 association with three experiments. BioPlex 2.0 reports
