- id: PMID:26418565
  title: 'In-Depth Dissection of the P133R Mutation in Steroid 5β-Reductase (AKR1D1): A Molecular Basis of
    Bile Acid Deficiency.'
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full recovered Methods, Results and Discussion read. Purified human WT/P133R proteins
      expressed in E. coli were assayed with cortisone and 7alpha-hydroxycholest-4-en-3-one.
      Steady/transient kinetics and cofactor titration/chase experiments support impaired P133R
      chemistry and NADP(H) affinity; steroid binding is also measured. The paper explicitly revises the
      2010 unchanged-affinity result after cofactor-free purification. Buffer and occupancy dependence
      limit numerical generalization; no aldose, monooxygenase or C17-side-reaction assay is
      established.
- id: PMID:30254413
  title: 'Infant cholestasis patient with a novel missense mutation in the AKR1D1 gene successfully treated
    by early adequate supplementation with chenodeoxycholic acid: A case report and review of the literature.'
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full recovered clinical case and discussion read. Infant R307C/loss-of-heterozygosity
      findings, post-treatment urinary bile-acid profiling and CDCA response support disease context.
      Structural modeling is predictive, not a direct mutant-enzyme assay. The paper states that no
      pretreatment urine profile was available; clinical improvement does not measure intrinsic
      substrate specificity.
- id: PMID:31337596
