  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-192033
  qualifier: enables
  review:
    summary: The cited Reactome event is steroid double-bond reduction, not carbonyl-to-alcohol
      interconversion.
    action: MODIFY
    reason: The cached source event explicitly converts a Delta4-3-oxosteroid to a 5beta-3-oxosteroid
      using NADPH; the 3-oxo group remains intact. GO:0008106 requires alcohol/aldehyde-or-ketone
      interconversion, so this is a reaction-mapping problem rather than mere lack of specificity.
      Replace this event-derived assertion with GO:0047787, independently demonstrated in purified
      AKR1D1 assays. This does not exclude an alternative alcohol-forming reaction supported by
      a different source.
