- term:
    id: GO:0006707
    label: cholesterol catabolic process
  evidence_type: IDA
  original_reference_id: PMID:7508385
  qualifier: involved_in
  review:
    summary: AKR1D1 directly performs a step in bile-acid synthesis from cholesterol.
    action: ACCEPT
    reason: The enzyme catalyzes reduction of pathway intermediates during cholesterol breakdown
      to bile acids. Cholesterol catabolism and monocarboxylic-acid metabolism describe pathways,
      not only reactions whose immediate substrate is cholesterol or a free acid. Requiring the
      enzyme to consume the initial precursor or final acid imposed an unsupported restriction;
      its catalytic participation supports these broader processes.
    supported_by:
    - reference_id: PMID:7508385
      supporting_text: more important for bile acid biosynthesis than for metabolism
- term:
    id: GO:0007586
    label: digestion
  evidence_type: IDA
  original_reference_id: PMID:7508385
  qualifier: involved_in
  review:
    summary: The digestion-process interpretation requires evidence beyond the accessible bile-acid
      enzyme abstract.
    action: UNDECIDED
    reason: AKR1D1 directly catalyzes bile-acid synthesis, and bile acids support digestion. Whether
      the curated IDA intends an appropriate digestive-process contribution cannot be settled
      from the available PMID:7508385 abstract; its full relevant context was not obtained. Do
      not reject the experimental process simply because bile-acid synthesis is its better-characterized
      role. Leave this broader physiological scope for source/human follow-up.
- term:
    id: GO:0008207
    label: C21-steroid hormone metabolic process
  evidence_type: IDA
  original_reference_id: PMID:7508385
  qualifier: involved_in
  review:
    summary: AKR1D1 directly reduces steroid hormones as well as bile-acid intermediates.
    action: ACCEPT
    reason: Full PMID:21255593 identifies 5beta-reduced products from purified human AKR1D1 across
      C18-C27 substrates, including androgens and C21 hormones; aldosterone product identity alone
      lacks a standard. Substrate inhibition and differing assay conditions explain limitations
      of earlier single-condition comparisons. These are direct catalytic steps in hormone metabolism,
      and lower turnover in an older assay does not exclude the function. For androgen metabolism,
      the IBD at PTN000199134 legitimately includes target P51857 experimental evidence.
    supported_by:
