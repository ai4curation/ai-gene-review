  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The ancestral aldose-reduction assertion remains unresolved.
    action: UNDECIDED
    reason: The preserved PTHR11732 lineage places the aldose/alditol IBD at PTN000198921 upstream
      of human P51857. GO:0004032 specifies carbonyl reduction of sugars, a different reaction from
      steroid double-bond reduction. Human AKR1D1 structures in PMID:18407998 explain
      Tyr58/Glu120-dependent steroid geometry, positioning hydride transfer toward C5 rather than the
      substrate C3 carbonyl. This is positive evidence for distinct steroid selectivity, but these assays
      do not directly test the complete aldose substrate class. The ancestral donor evidence and target-specific retention or loss of sugar reduction
      remain unresolved. The genuine OpenScientist report acknowledges that it did not recover a
      direct negative aldose assay; its stronger exclusion is not adopted.
