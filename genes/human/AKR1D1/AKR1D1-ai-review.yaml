- id: PMID:20522910
  title: Characterization of disease-related 5beta-reductase (AKR1D1) mutations reveals their potential
    to cause bile acid deficiency.
  full_text_unavailable: true
  findings:
  - statement: The 2010 preparation showed no change in P133R cofactor affinity; this finding was later
      superseded.
    supporting_text: this mutant displayed no change in cofactor affinity
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:26418565
      review_notes: The later study identifies substantial bound NADP+ in the original WT preparation.
        Further purification yielded cofactor-free WT and P133R and revealed lower P133R affinity; the
        correction is specific to this comparison.
      supported_by:
      - reference_id: PMID:26418565
        supporting_text: The P133R mutant dramatically lowered the cofactor binding affinity by
          increasing the Kd values over 40-fold to reach the 20 μM range.
        reference_section_type: RESULTS
  - statement: Tested variants reduced protein expression and activity in HEK293 cells despite similar
      mRNA levels.
    supporting_text: Although these enzymes were equally expressed based on mRNA levels, protein
      expression and functional activity were dramatically reduced.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Existing normal abstract-only cache read in response to the reviewer suggestion. Human
      variant expression/protein/activity comparisons in HEK293 and purified P133R support reduced
      active-enzyme abundance and bile-acid deficiency. Purification succeeded for P133R, not all tested
      variants; its purified measurements are not generalized. The specific unchanged-cofactor-affinity
      finding is superseded by the cofactor-free purification/kinetics in PMID:26418565, recorded at finding level
      without invalidating the remaining study.
suggested_questions:
- question: Does purified wild-type human AKR1D1 retain the ancestral aldose-reductase or
    ketosteroid-monooxygenase activities, and which original assays ground the PAINT donor nodes?
- question: What exact substrate, C17 product identification and controls in PMID:11342103 support
    RHEA:53484, independently of endogenous HEK293 steroid enzymes?
- question: Can Reactome correct GO:0008106 to GO:0047787 for the six displayed steroid C4-C5
    reduction events while preserving their substrate-specific reaction identities?
- question: What experimental scope in the complete PMID:7508385 source supports the digestion
    annotation beyond bile-acid biosynthesis?
suggested_experiments:
- description: Compare purified human AKR1D1 with appropriate sugar-reductase and monooxygenase
    controls using product-resolving assays; explicitly test aldose-to-alditol, oxygen-insertion and
    steroid-double-bond products rather than NADPH consumption alone.
- description: Test androst-4-ene-3,11,17-trione with purified AKR1D1 and authentic C17-hydroxy
    versus 5beta standards, including enzyme-free and cofactor controls, to resolve RHEA:53484.
