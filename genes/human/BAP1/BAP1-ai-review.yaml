core_functions:
- description: BAP1 catalyzes removal of monoubiquitin from histone H2A lysine 119 in nuclear PR-DUB complexes.
    ASXL proteins activate the enzyme, while contacts with nucleosomal DNA, histones and ubiquitin position
    the substrate. This chromatin reaction regulates transcription, with activating or repressive outcomes
    determined by the locus and cellular context.
  molecular_function:
    id: GO:0140950
    label: histone H2A deubiquitinase activity
  directly_involved_in:
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0035517
    label: PR-DUB complex
  supported_by:
  - reference_id: PMID:20436459
    supporting_text: 'Reconstituted recombinant Drosophila and human PR-DUB complexes remove

      monoubiquitin from H2A but not from H2B in nucleosomes.'
  - reference_id: PMID:37556531
    supporting_text: human BAP1 and the ASXL1 DEUBAD in complex with a H2AK119Ub nucleosome
  - reference_id: PMID:30664650
    supporting_text: 'safeguard transcriptionally active genes against

      silencing by the Polycomb Repressive Complex 1.'
- description: BAP1 also catalyzes deubiquitination of nonhistone regulatory proteins. Nuclear HCFC1 is
    an established substrate, whereas an ER-associated BAP1 pool deubiquitinates ITPR3 and supports receptor
    stability and calcium-dependent cell-death responses. Substrate stabilization is context dependent
    and is not a universal consequence of BAP1 catalysis.
  molecular_function:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  directly_involved_in:
  - id: GO:0016579
    label: protein deubiquitination
