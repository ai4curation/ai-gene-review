id: Q92560
gene_symbol: BAP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BAP1 is a ubiquitin C-terminal hydrolase with an active-site cysteine and a major role in
  chromatin regulation. In nuclear PR-DUB complexes, ASXL proteins activate BAP1 to remove monoubiquitin
  from histone H2A lysine 119. Engagement with nucleosomal DNA, histones and ubiquitin establishes substrate
  recognition. This reaction regulates transcription, with activating or repressive consequences depending
  on the locus and cellular context. BAP1 also deubiquitinates nonhistone proteins, including the nuclear
  transcriptional coregulator HCFC1 and the endoplasmic-reticulum calcium channel ITPR3. Its regulated
  nuclear and cytoplasmic distribution connects these substrate-specific activities to cell growth, genome
  maintenance and cell-death responses. Germline and somatic BAP1 variants are associated with tumor predisposition
  and, for some germline missense variants, neurodevelopmental disease.
