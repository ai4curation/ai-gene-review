    supporting_text: 'mediates deubiquitination of

      HCF-1N by BAP1'
  - reference_id: PMID:28614305
    supporting_text: 'binds, deubiquitylates, and

      stabilizes type 3 inositol-1,4,5-trisphosphate receptor (IP3R3)'
suggested_questions:
- question: Which BRAF construct, mutation and assay underlie the BAP1 interaction reported by PMID:35512704?
    The source annotation is retained as UNDECIDED pending pair-level evidence.
- question: Which substrate and complex features determine whether BAP1-mediated deubiquitination stabilizes
    a nonhistone protein or alters its regulatory interactions without stabilization? HCFC1 and ITPR3
    should be tested separately.
- question: How do locus recruitment and cell context determine activation versus repression after H2AK119
    deubiquitination, and which human settings directly demonstrate the ancestral heterochromatin-formation
    process?
suggested_experiments:
- description: Compare matched BAP1 depletion and WT/catalytic-mutant rescue with measurements of substrate
    ubiquitination, abundance and turnover for endogenous HCFC1 and ITPR3 in the same human cell background.
    Distinguish changes in ubiquitin removal from changes in protein synthesis or degradation.
- description: Measure locus-specific H2AK119ub1 and nascent transcription after acute BAP1 depletion
    and rescue in more than one human lineage, with ASXL and FOXK recruitment assessed in parallel. This
    would separate a common catalytic reaction from context-dependent transcriptional consequences.
