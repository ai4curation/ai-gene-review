id: Q8NER5
gene_symbol: ACVR1C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACVR1C encodes ALK7, a single-pass type I serine/threonine kinase receptor that forms
  activin/nodal receptor complexes and signals through SMAD2/3. Nodal-ALK7 signaling has been
  characterized in human trophoblast and ovarian epithelial cancer cells as an anti-proliferative,
  pro-apoptotic and migration-inhibitory pathway. Like other type-I TGF-beta-superfamily receptors,
  ALK7 couples extracellular ligand recognition through partner receptors to an intracellular kinase
  domain.
