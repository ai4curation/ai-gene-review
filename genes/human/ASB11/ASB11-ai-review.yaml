- id: PMID:37848033
  title: PAICS ubiquitination recruits UBAP2 to trigger phase separation for purinosome assembly.
  findings:
  - statement: Cul5/ASB11 K6-polyubiquitinates PAICS to drive purinosome assembly.
    supporting_text: Here, we show that K6-polyubiquitination of the DNPS enzyme phosphoribosylaminoimidazole
      carboxylase and phosphoribosylaminoimidazolesuccinocarboxamide synthetase (PAICS) by cullin-5/ankyrin
      repeat and SOCS box containing 11 (Cul5/ASB11)-based ubiquitin ligase plays a driving role in purinosome
      assembly.
  - statement: Ubiquitinated PAICS recruits UBAP2.
    supporting_text: The polyubiquitinated PAICS recruits ubiquitin-associated protein 2 (UBAP2), a ubiquitin-binding
      protein with multiple stretches of intrinsically disordered regions, thereby inducing phase separation
      to trigger purinosome assembly for enhancing DNPS pathway flux.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; human melanoma cells.
  full_text_unavailable: true
- id: PMID:41668292
  title: Targeting ER lipid raft-associated 1 reveals a coordinated cholesterol-dependent vulnerability
    in hepatocellular carcinoma.
  findings:
  - statement: ASB11 mediates ERLIN1 degradation, opposed by FIH hydroxylation.
    supporting_text: Hypoxia impairs factor-inhibiting hypoxia-1 (FIH)-dependent ASB11 hydroxylation,
      promoting ASB11-mediated ERLIN1 degradation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; hepatocellular carcinoma.
- id: PMID:35537551
  title: Factor inhibiting HIF can catalyze two asparaginyl hydroxylations in VNVN motifs of ankyrin fold
    proteins.
  findings:
  - statement: FIH hydroxylates ASB11 VNVN asparagines.
    supporting_text: MS fragmentation studies provided evidence that ASB11 and P18-INK4C proteins undergo
      both monohydroxylation and dihydroxylation reactions within their VNVN motif (Figs 3, S14 and S15).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; recombinant protein hydroxylation.
- id: PMID:18776899
  title: d-Asb11 is an essential mediator of canonical Delta-Notch signalling.
  findings:
  - statement: Zebrafish Asb11 ubiquitylates and degrades DeltaA.
    supporting_text: Consistent with these results, d-Asb11 was able to specifically ubiquitylate and
      degrade DeltaA both in vitro and in vivo.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; zebrafish.
  full_text_unavailable: true
- id: PMID:21124961
  title: Essential role for the d-Asb11 cul5 Box domain for proper notch signaling and neural cell fate
    decisions in vivo.
  findings:
  - statement: The zebrafish Asb11 Cul5 box is essential for Notch activation.
    supporting_text: These results showed that the Cul5 box of d-Asb11 is essential for its function to
      activate the Notch target gene hes1 through Notch pathway.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; zebrafish.
- id: PMID:16893969
  title: 'The novel gene asb11: a regulator of the size of the neural progenitor compartment.'
  findings:
  - statement: Zebrafish Asb11 maintains neural progenitors.
    supporting_text: We conclude that d-Asb11 is a novel regulator of the neuronal progenitor compartment
      size by maintaining the neural precursors in the proliferating undifferentiated state possibly through
      the control of SoxB1 transcription factors.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Zebrafish.
- id: PMID:22512762
  title: asb11 is a regulator of embryonic and adult regenerative myogenesis.
  findings:
  - statement: Zebrafish asb11 is needed for muscle progenitor expansion.
    supporting_text: Thus, the expression of d-asb11 is necessary for muscle progenitor expansion, whereas
      its downregulation marks the onset of terminal differentiation.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; zebrafish.
  full_text_unavailable: true
