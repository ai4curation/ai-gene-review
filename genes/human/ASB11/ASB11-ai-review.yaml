id: Q8WXH4
gene_symbol: ASB11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB11 is an ankyrin repeat and SOCS box protein that serves as the substrate-recognition
  subunit of a Cullin 5-RING E3 ubiquitin ligase (CRL5(ASB11), with Elongins B/C and RBX2), activated
  by UBE2F-dependent CUL5 neddylation. It is associated with the endoplasmic reticulum. Its ankyrin repeats
  bind substrates, including Ribophorin 1 of the oligosaccharyltransferase, the pro-apoptotic BH3-only
  protein BIK, the small GTPase DIRAS2 and ERLIN1, and its SOCS box links them to Cullin 5 for ubiquitination
  and proteasomal degradation. During ER stress, XBP1s induces ASB11, and BIK degradation delays apoptosis
  in the adaptive phase of the unfolded protein response. ASB11 also builds K6-linked chains on the purine-synthesis
  enzyme PAICS, which recruit UBAP2 to drive purinosome assembly. FIH hydroxylates asparagines in its
  ankyrin repeats. In zebrafish, Asb11 ubiquitinates DeltaA, promotes Delta-Notch signalling, and keeps
  neural and muscle progenitors proliferating.
