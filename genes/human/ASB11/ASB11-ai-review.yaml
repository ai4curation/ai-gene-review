proposed_new_terms: []
suggested_questions:
- question: How does ASB11 attach to the ER, and does its hydrophobic N-terminal segment (absent from
    isoform 3) anchor it there?
- question: What decides whether CRL5(ASB11) builds degradative K48 chains (BIK) or non-degradative K6
    chains (PAICS)?
- question: Does human ASB11 ubiquitinate Delta-like ligands and regulate Notch signalling or progenitor
    maintenance as zebrafish Asb11 does?
suggested_experiments:
- description: Map the ER-targeting determinant of ASB11 by fractionation of N-terminal truncations and
    isoform 3, and test BIK and Ribophorin 1 turnover with each.
