- id: PMID:24337577
  title: Protein interaction screening for the ankyrin repeats and suppressor of cytokine signaling (SOCS)
    box (ASB) family identify Asb11 as a novel endoplasmic reticulum resident ubiquitin ligase.
  findings:
  - statement: ASB11 is an ER-associated ubiquitin ligase that ubiquitinates Ribophorin 1.
    supporting_text: We also demonstrated that ASB11 is a novel endoplasmic reticulum-associated ubiquitin
      ligase with the ability to interact and promote the ubiquitination of Ribophorin 1, an integral
      protein of the oligosaccharyltransferase (OST) glycosylation complex.
  - statement: ASB11 increases Ribophorin 1 turnover.
    supporting_text: Moreover, expression of ASB11 can increase Ribophorin 1 protein turnover in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; SILAC interaction screen of the ASB family.
  full_text_unavailable: true
- id: PMID:31387940
  title: BIK ubiquitination by the E3 ligase Cul5-ASB11 determines cell fate during cellular stress.
  findings:
  - statement: Cul5-ASB11 ubiquitinates BIK for degradation.
    supporting_text: Here, we identify Cul5-ASB11 as the E3 ligase targeting BIK for ubiquitination and
      degradation.
  - statement: ASB11 recruits BIK to CRL5.
    supporting_text: These findings are consistent with the adaptor role of ASB11 in recruiting BIK to
      the CRL5 complex.
  - statement: The SOCS box is required.
    supporting_text: We found that deletion of the SOCS box abolished the capability of ASB11 to promote
      BIK ubiquitination (Fig.
  - statement: BIK chains are K48-linked.
    supporting_text: As to the ubiquitin chain type, ASB11 promoted BIK K48 ubiquitination (Fig.
  - statement: ASB11-BIK degradation supports the adaptive UPR.
    supporting_text: These findings support that ER stress–induced and ASB11-mediated BIK degradation
      plays a pro-survival role to contribute to the adaptive phase of UPR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human cells and in vitro reconstitution.
- id: PMID:38574733
  title: The UBE2F-CRL5(ASB11)-DIRAS2 axis is an oncogene and tumor suppressor cascade in pancreatic cancer
    cells.
  findings:
  - statement: DIRAS2 is a CRL5(ASB11) substrate.
    supporting_text: Mechanistically, Ube2f deletion inactivates the Mapk-c-Myc signals via blocking ubiquitylation
      of Diras2, a substrate of CRL5Asb11 E3 ligase.
  - statement: UBE2F neddylates CUL5.
    supporting_text: UBE2F, a neddylation E2, neddylates CUL5 to activate cullin-RING ligase-5, upon coupling
      with neddylation E3 RBX2/SAG.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; human pancreatic cancer cells and mouse PDAC model.
  full_text_unavailable: true
