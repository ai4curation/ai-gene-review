suggested_experiments:
- description: Replace endogenous nesprin-3 in human endothelial cells with a plectin-binding-deficient mutant or
    a KASH-deletion mutant and measure perinuclear vimentin, nucleus-centrosome distance and flow-induced polarization.
  hypothesis: Both the plectin-binding N-terminus and SUN binding by the KASH domain are required for nesprin-3
    to couple intermediate filaments to the nucleus and transmit flow-induced cues.
  experiment_type: mutant rescue and live imaging
