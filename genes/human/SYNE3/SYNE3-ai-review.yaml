id: Q6ZMZ3
gene_symbol: SYNE3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SYNE3 encodes nesprin-3, a ~110 kDa member of the nesprin (KASH-domain) family. It has an N-terminal
  plectin-binding region, a short rod of spectrin repeats, and a C-terminal transmembrane KASH domain that anchors
  it as a tail-anchored protein in the outer nuclear membrane with its bulk facing the cytoplasm. In the perinuclear
  space the KASH peptide binds the SUN domains of SUN1 or SUN2, forming a LINC (linker of nucleoskeleton and cytoskeleton)
  complex that retains nesprin-3 at the nuclear envelope. Unlike the giant nesprin-1 and -2 isoforms, nesprin-3
  lacks a calponin-homology actin-binding domain; instead it binds the actin-binding domain of the plakin cytolinker
  plectin, recruiting plectin to the nuclear perimeter and thereby linking the nucleus to the vimentin/keratin intermediate
  filament network (a fragment also co-sediments with F-actin in vitro). Nesprin-3 is broadly expressed. In human
  aortic endothelial cells it maintains perinuclear plectin/vimentin architecture, keeps the centrosome close to
  the nucleus, and is required for flow-induced centrosome polarization and directional migration; in fibroblasts
  moving through 3D matrix, actomyosin acting through vimentin and nesprin-3 pulls the nucleus forward as a piston
  that pressurizes the leading cytoplasm. Nesprin-3 knockout mice are viable and fertile, and the protein is dispensable
  for 2D fibroblast migration, indicating context-specific roles. Its KASH domain also associates with the luminal
  AAA+ ATPase torsinA.
