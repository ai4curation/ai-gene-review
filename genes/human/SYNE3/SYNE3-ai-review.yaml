core_functions:
- description: 'As the outer-nuclear-membrane KASH subunit of LINC complexes, nesprin-3 anchors the plectin cytolinker,
    and through it the vimentin/keratin intermediate filament network, to the nucleus: its KASH peptide binds SUN1/SUN2
    in the perinuclear space while its N-terminus binds the plectin actin-binding domain.'
