- term:
    id: GO:0007097
    label: nuclear migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0261836
  - PANTHER:PTN002934743
  - ZFIN:ZDB-GENE-041001-109
  review:
    summary: Phylogenetic inference that nesprin-family proteins are involved in nuclear migration.
    action: ACCEPT
    reason: 'Nuclear movement is the ancestral function of the nesprin/KASH family, and there is direct evidence
      that nesprin-3 physically transmits force for nuclear movement: in human fibroblasts migrating in 3D matrix,
      actomyosin acting through vimentin and nesprin-3 pulls the nucleus forward (nuclear piston). Nesprin-3 is
      not required for 2D migration or MTOC polarization of mouse fibroblasts, so the role is context-specific,
      but the IBA is sound.'
    additional_reference_ids:
    - PMID:25170155
    - PMID:23761073
    supported_by:
    - &id017
      reference_id: PMID:25170155
      supporting_text: Actomyosin contractility with the nucleoskeleton-intermediate filament linker protein nesprin-3
        pulled the nucleus forward and pressurized the front of the cell.
    - &id018
      reference_id: PMID:25170155
      supporting_text: Thus, nesprin 3 is required for piston-like nuclear movements and pressurizing lobopodial
        protrusions.
    - reference_id: PMID:23761073
      supporting_text: Furthermore, nesprin-3 was not required for the polarization and migration of mouse embryonic
        fibroblasts.
