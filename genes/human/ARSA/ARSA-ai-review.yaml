id: P15289
gene_symbol: ARSA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARSA (arylsulfatase A; cerebroside-sulfatase, EC 3.1.6.8) is a lysosomal enzyme that removes
  sulfate from sulfatide to produce galactosylceramide and sulfate. Saposin B presents the lipid substrate,
  while a catalytic formylglycine residue derived from Cys69 and an active-site calcium ion support hydrolysis.
  ARSA also desulfates other sulfated glycosphingolipids, including lactosylceramide sulfate. It matures
  in the endoplasmic reticulum and is delivered through the mannose-6-phosphate receptor pathway to acidic
  degradative compartments. Deficient ARSA activity causes sulfatide storage and the demyelinating disorder
  metachromatic leukodystrophy.
