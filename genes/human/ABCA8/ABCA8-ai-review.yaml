  review:
    summary: ABCA8 is a plasma-membrane efflux transporter; an ER signal seen in
      transfected cells overexpressing the protein (and its trafficking-defective
      mutants) most plausibly reflects biosynthetic transit rather than a functional
      ER residence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The curated UniProt subcellular location for ABCA8 is the cell (plasma)
      membrane, with no ER residence listed; ABCA8 is a multi-pass membrane protein
      and the ER is where such proteins fold and are glycosylated before export. The
      study overexpressed wild-type and localisation-defective variants (e.g. P609R,
      which affects localization at the plasma membrane), a setting in which an ER
      pool reflects transit/retention of over-expressed protein rather than the site
      of function. Per the organelle-annotation policy, ER transit is not residence.
    supported_by:
    - reference_id: file:human/ABCA8/ABCA8-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
