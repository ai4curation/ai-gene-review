gene_symbol: ABCA8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCA8 is a large, multi-pass membrane protein of the ATP-binding cassette
  transporter superfamily, subfamily A. It has two nucleotide-binding domains that
  bind and hydrolyse ATP to power the vectorial movement of lipophilic substrates
  across the membrane. The protein localises to the plasma membrane, and in polarised
  hepatocytes to the basolateral (sinusoidal) surface. Its best-supported activity
  is ATP-dependent efflux of cholesterol and the bile acid taurocholate; it physically
  associates with ABCA1 and potentiates ABCA1-mediated cholesterol efflux to lipid-free
  apolipoprotein A-I, thereby influencing plasma high-density-lipoprotein cholesterol
  levels. ABCA8 is highly expressed in oligodendrocyte-rich white matter, where it
  promotes sphingomyelin production and is implicated in myelin lipid homeostasis.
  A short splice isoform additionally transports a range of amphipathic organic anions
  and xenobiotics (e.g. estradiol-glucuronide, estrone sulfate, taurocholate, leukotriene
  C4, ochratoxin A) in heterologous assays.
