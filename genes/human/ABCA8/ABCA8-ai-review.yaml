- id: PMID:12379217
  title: Functional analysis of ABCA8, a new drug transporter.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified. Establishes ATP-dependent transport of organic
      anions/xenobiotics by the short ABCA8 isoform in Xenopus oocytes (estradiol-glucuronide
      Km 30.4 uM). Supports the xenobiotic-transporter and ATP-dependence annotations;
      activity is isoform-1 and in vitro.
- id: PMID:23560799
  title: ABCA8 stimulates sphingomyelin production in oligodendrocytes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified. Shows ABCA8 stimulates sphingomyelin synthase 1
      expression and sphingomyelin production in oligodendrocytes (supports a
      positive-regulatory role in sphingolipid biosynthesis). It does not itself
      demonstrate cholesterol efflux, so its use as the original reference for
      GO:0010875 is better supported by PMID:28882873.
- id: PMID:28882873
  title: ABCA8 Regulates Cholesterol Efflux and High-Density Lipoprotein Cholesterol
    Levels.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified. Human low-HDLc variants, Abca8b-/- mice and
      hepatic overexpression demonstrate that ABCA8 regulates cholesterol efflux and
      HDLc; ABCA8 colocalises/interacts with ABCA1 and potentiates its cholesterol
      efflux to apoA-I.
- id: PMID:29300488
  title: ATP-Binding Cassette Transporter A Subfamily 8 Is a Sinusoidal Efflux Transporter
    for Cholesterol and Taurocholate in Mouse and Human Liver.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified. Full-length ABCA8 mediates efflux of cholesterol
      and taurocholate and localises to hepatocyte sinusoidal (basolateral) membranes;
      no significant efflux of estrone sulfate, digoxin, vinblastine, PAH, oleic acid,
      nicotine or methotrexate.
