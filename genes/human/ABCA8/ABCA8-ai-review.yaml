  review:
    summary: In oligodendrocytes ABCA8 increases sphingomyelin synthase 1 expression
      and sphingomyelin output, i.e. it positively regulates sphingolipid biosynthesis
      rather than catalysing a biosynthetic step itself.
    action: MODIFY
    reason: ABCA8 is a lipid transporter, not an enzyme of the sphingomyelin biosynthetic
      pathway; the biosynthetic step is performed by sphingomyelin synthase (SGMS1).
      The paper shows ABCA8 stimulates SGMS1 expression and sphingomyelin production,
      which is a positive-regulatory contribution. The most specific existing term is
      positive regulation of sphingolipid biosynthetic process (no sphingomyelin-specific
      regulation term exists). This is a brain/oligodendrocyte-specific, non-core role.
    proposed_replacement_terms:
    - id: GO:0090154
      label: positive regulation of sphingolipid biosynthetic process
    supported_by:
    - reference_id: PMID:23560799
      supporting_text: ABCA8 was able to significantly stimulate both sphingomyelin
        synthase 1 expression and sphingomyelin production
