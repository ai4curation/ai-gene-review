    label: plasma membrane
  - id: GO:0016323
    label: basolateral plasma membrane
  substrates:
  - id: CHEBI:16113
    label: cholesterol
  - id: CHEBI:36257
    label: taurocholate
  supported_by:
  - reference_id: PMID:29300488
    supporting_text: functions as a sinusoidal efflux transporter for at least
      cholesterol and taurocholate
  - reference_id: PMID:28882873
    supporting_text: ABCA8 facilitates cholesterol efflux and modulates HDLc levels
      in humans and mice.
  - reference_id: file:human/ABCA8/ABCA8-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Interaction with ABCA1 potentiates cholesterol efflux to lipid-free
      APOA1, which regulates high-density lipoprotein cholesterol levels
proposed_new_terms: []
suggested_questions:
- question: Does full-length human ABCA8 (displayed isoform 3) physiologically transport
    the organic anions and xenobiotics reported for the short isoform, or is that
    activity isoform- and context-specific?
- question: Is ABCA8's promotion of oligodendrocyte sphingomyelin production a direct
    consequence of its lipid-transport activity, and does it depend on physical or
    functional interaction with sphingomyelin synthase 1?
suggested_experiments:
- description: Reconstitute purified full-length ABCA8 in proteoliposomes and measure
    ATP-dependent transport of cholesterol, taurocholate, estrone sulfate and
    leukotriene C4 to define its true substrate spectrum and directionality.
- description: Use ABCA8 loss-of-function and overexpression in primary oligodendrocytes
    with lipidomics to test whether myelin sphingolipid changes are secondary to
    altered membrane cholesterol/bile-acid handling.
