core_functions:
- description: ATP-driven efflux transporter that moves cholesterol and the bile acid
    taurocholate across the basolateral/sinusoidal plasma membrane, and that potentiates
    ABCA1-dependent cholesterol efflux to apolipoprotein A-I, thereby regulating
    cellular cholesterol efflux and plasma HDL-cholesterol levels.
  molecular_function:
    id: GO:0042626
    label: ATPase-coupled transmembrane transporter activity
  directly_involved_in:
