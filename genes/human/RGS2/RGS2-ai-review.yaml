id: P41220
gene_symbol: RGS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RGS2 is a regulator of heterotrimeric G protein signaling that accelerates GTP hydrolysis
  on G alpha subunits, particularly Gq, thereby limiting receptor-driven signaling. It associates with
  the cytoplasmic surface of the plasma membrane and also occupies cytoplasmic and nuclear compartments;
  alternative translation initiation generates a shorter product with mitochondrial localization. RGS2
  regulates vascular and cardiac signaling and can inhibit adenylyl cyclase and translation through mechanisms
  distinct from its GAP activity. Its physiological effects depend on receptor, cell type, expression
  level and protein isoform.
