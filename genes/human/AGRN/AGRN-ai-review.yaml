  original_reference_id: GO_REF:0000033
  review:
    summary: Agrin has membrane-associated secreted and transmembrane forms.
    action: ACCEPT
    reason: The PAINT placement is compatible with the conserved cell-surface biology. Human UniProt distinguishes
      secreted LN agrin from the type II transmembrane isoform; receptor-bound secreted protein also associates
      with the cell surface. The annotation does not require every isoform to span the membrane.
    supported_by:
    - reference_id: file:human/AGRN/AGRN-uniprot.txt
      supporting_text: Transmembrane form that is the predominate form in neurons of the brain, induces
