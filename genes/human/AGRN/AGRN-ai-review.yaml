core_functions:
- description: Activates MuSK through LRP4 binding to induce postsynaptic acetylcholine-receptor clustering
    and organize neuromuscular synapses; activity depends on agrin splice form.
  molecular_function:
    id: GO:0030297
    label: transmembrane receptor protein tyrosine kinase activator activity
  directly_involved_in:
  - id: GO:0071340
    label: skeletal muscle acetylcholine-gated channel clustering
  locations:
  - id: GO:0005604
    label: basement membrane
  - id: GO:0045202
    label: synapse
  supported_by:
  - reference_id: PMID:18848351
    supporting_text: Here, we report that Lrp4, a member of the LDLR family, is a receptor for Agrin, forms
      a complex with MuSK, and mediates MuSK activation by Agrin.
  - reference_id: PMID:15340048
    supporting_text: We also report that a single 5-min agrin pulse, followed by extensive washing, triggered
      long-lasting MuSK and AChR phosphorylation and efficient AChR clustering.
- description: Binds laminin through the N-terminal domain of secreted agrin, anchoring agrin in basal lamina
    and coupling matrix retention to synaptic receptor organization.
  molecular_function:
    id: GO:0043236
    label: laminin binding
  locations:
  - id: GO:0005604
    label: basement membrane
  supported_by:
  - reference_id: PMID:9151673
    supporting_text: In the current report we show that an NH2-terminal fragment of agrin containing these
      130 amino acids is sufficient to bind to Matrigel and that the binding to this preparation is mediated
      by laminin-1.
  - reference_id: file:human/AGRN/AGRN-uniprot.txt
    supporting_text: This secreted isoform forms a bridge, after release from motor neurons, to basal lamina
      through binding laminin via the NtA domain.
- description: Binds cell-surface dystroglycan through laminin G-like domains, linking extracellular agrin
    to receptor-associated membrane structures in muscle and non-muscle tissues.
  molecular_function:
    id: GO:0002162
    label: dystroglycan binding
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:9417121
    supporting_text: In adult kidney and lung, agrin co-purified and co-immunoprecipitated with dystroglycan,
      and both molecules were co-localized in embryonic tissue.
  - reference_id: file:human/AGRN/AGRN-uniprot.txt
    supporting_text: Both laminin G-like 2 (G2) and laminin G-like 3 (G3) domains are required for alpha-dystroglycan/DAG1
      binding.
