- term:
    id: GO:0030548
    label: acetylcholine receptor regulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: AChR organization is established; regulation of the active receptor fraction remains unresolved.
    action: UNDECIDED
    reason: GO:0030548 explicitly permits direct or indirect interaction, so agrin binding LRP4 rather than
      AChR does not disqualify this activity. Its definition nevertheless requires changing the proportion
      of receptors in the active form. The recovered pulse experiment measures MuSK/AChR phosphorylation and
      receptor clustering; organization, abundance and stabilization do not by themselves resolve that active-state
      fraction. The historical MGI mouse IDA links to J:86639/PMID:14622576, whose accessible abstract reports
      GGT-dependent AChR clustering and NMJ development. That positive donor pathway result does not resolve
      the active-state fraction without the full assay details; the PAINT placement itself was not reconstructed.
      Retain uncertainty without denying indirect AChR regulation or the established agrin-LRP4-MuSK organizing
      mechanism.
    supported_by:
    - reference_id: PMID:15340048
      supporting_text: We also report that a single 5-min agrin pulse, followed by extensive washing, triggered
        long-lasting MuSK and AChR phosphorylation and efficient AChR clustering.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN008557735
        source_status: UNRESOLVED
        comment: PTN008557735 identifies the ancestral assertion. The historical MGI graph (2023-03-10) identifies
          a mouse IDA descendant, J:86639, mapped by MouseMine to PMID:14622576. Its accessible abstract reports
          agrin/MuSK-GGT signaling and clustering; the exact active-AChR-fraction experiment remains unresolved.
          Donor count or self-inclusion is not a propagation error.
