      upgrading the source into a direct synapse-development experiment.
    supported_by:
    - reference_id: PMID:18848351
      supporting_text: Here, we report that Lrp4, a member of the LDLR family, is a receptor for Agrin,
        forms a complex with MuSK, and mediates MuSK activation by Agrin.
    - reference_id: file:human/AGRN/AGRN-uniprot.txt
      supporting_text: This secreted isoform forms a bridge, after release from motor neurons, to basal
        lamina through binding laminin via the NtA domain.

