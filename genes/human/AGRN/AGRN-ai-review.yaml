- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: Agrin signaling organizes actin-rich neuronal protrusions and postsynaptic structures.
    action: KEEP_AS_NON_CORE
    reason: Transmembrane agrin promotes actin-rich neuronal protrusions through extracellular signaling. The
      human UniProt synthesis supports the conserved role, and PMID:19940118 directly maps process induction
      to extracellular follistatin-like domains using chick TM-agrin in chick neurons and heterologous cell
      hosts. These data support cytoskeleton organization without making agrin a structural filament constituent.
      Retain this CNS protrusion-organizing branch as a non-core, isoform- and cellular-context-dependent function
      alongside the central matrix-anchoring and neuromuscular receptor-organizing functions. This classification
      reflects the experimental biological context, not merely absence from the compact core list.
    supported_by:
    - reference_id: file:human/AGRN/AGRN-uniprot.txt
      supporting_text: Transmembrane form that is the predominate form in neurons of the brain, induces dendritic
        filopodia and synapse formation in mature hippocampal neurons in large part due to the attached glycosaminoglycan
        chains and the action of Rho-family GTPases.
    - reference_id: PMID:19940118
      supporting_text: Mapping of the process-inducing activity in neurons and non-neuronal cells demonstrates
