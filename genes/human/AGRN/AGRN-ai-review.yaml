- term:
    id: GO:0007268
    label: chemical synaptic transmission
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Agrin modulates synaptic excitability and transmission.
    action: MODIFY
    reason: GO:0007268 describes the transmitter-release, receptor-activation and postsynaptic-response sequence.
      Agrin binding to neuronal alpha3 Na+/K+-ATPase changes membrane depolarization and action-potential frequency;
      the competitive fragment also changes native neuronal activity in PMID:16630822. This positive modulatory
      mechanism is better represented by GO:0050804 than by assigning agrin the transmission sequence itself.
      The refinement concerns the role expressed by the ancestral annotation, not donor count or an asserted
      human-specific loss. The neutral modulation term is retained because the measured readout is excitability/action-potential
      frequency, not a direct measurement of increased synaptic transmission strength. The historical MGI mouse
      IDA chain resolves to PMID:8653788, whose accessible abstract reports mutant NMJ organization; it does
      not by itself resolve the exact transmission assay behind that donor annotation.
    supported_by:
    - reference_id: file:human/AGRN/AGRN-uniprot.txt
      supporting_text: Functions differentially in the central nervous system (CNS) by inhibiting the alpha(3)-subtype
        of Na+/K+-ATPase and evoking depolarization at CNS synapses.
    - reference_id: PMID:16630822
      supporting_text: Agrin inhibition of alpha3NKA activity results in membrane depolarization and increased
        action potential frequency in cortical neurons in culture and acute slice.
    additional_reference_ids:
    - PMID:17586728
    - PMID:16630822
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN008557735
        source_status: UNRESOLVED
        comment: PTN008557735 is the PAINT ancestral assertion. The historical MGI graph (2023-03-10) links
          mouse chemical synaptic transmission IDA to J:33098/PMID:8653788; its abstract establishes NMJ organizational
          defects. The precise transmission assay and full ancestral experimental reconstruction remain unresolved.
          Independent agrin physiology supports the term-role refinement without asserting human-specific loss.
    proposed_replacement_terms:
    - id: GO:0050804
      label: modulation of chemical synaptic transmission
