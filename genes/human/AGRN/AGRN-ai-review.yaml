id: O00468
gene_symbol: AGRN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Agrin is a large extracellular proteoglycan that couples cell-surface signaling to basement-membrane
  attachment. Secreted agrin binds laminin through its N-terminal domain and dystroglycan through C-terminal
  laminin G-like domains. Neuronal splice forms activate the LRP4-MuSK receptor system, inducing acetylcholine-receptor
  clustering and supporting neuromuscular synapse formation and maintenance. An alternative N terminus
  produces transmembrane agrin, which promotes neuronal filopodia and synaptic organization. The independent
  C-terminal splice choices alter receptor and glycan interactions; forms lacking a z insert can also
  signal in non-muscle contexts. Agrin is abundant in several human basement membranes and has additional
  tissue-dependent roles in cell differentiation, endothelial junction organization and repair signaling.
