core_functions:
- description: Nuclear regulatory adapter that inhibits canonical NF-kB signaling and promotes apoptosis,
    acting by binding partner proteins and promoting their destabilization; the best-defined instance
    is destabilization of the nucleolar GTPase GNL3L, lowering the p65 subunit, with activity enhanced
    by MZF-1.
  directly_involved_in:
  - id: GO:0043124
    label: negative regulation of canonical NF-kappaB signal transduction
  - id: GO:0043065
    label: positive regulation of apoptotic process
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:27076087
    supporting_text: LDOC1 gene is a known regulator of nuclear factor mediated pathway to apoptosis through
      inhibition of nuclear factor kappa B (NF‐kappaB)
  - reference_id: PMID:27764577
    supporting_text: 'GNL3L upregulates NF-κB

      dependent transcriptional activity by modulating the expression of NF-κB subunit

      p65, which is reversed upon co-expression of LDOC1 with GNL3L'
  - reference_id: PMID:27764577
    supporting_text: 'ectopic expression of LDOC1

      destabilizes endogenous GNL3L levels and down modulates GNL3L-induced cell

      proliferation'
proposed_new_terms: []
suggested_questions:
- question: By what mechanism does LDOC1 promote partner destabilization (does it bridge substrates to
    E3 ligases/the proteasome, as suggested by LNX1 and PSMA1 involvement)?
- question: How does LDOC1 reach the nucleus despite lacking a canonical nuclear localization signal?
- question: Does the human LDOC1 ortholog retain the placental endocrine role defined for mouse Sirh7/Ldoc1,
    and does it retain capsid-like self-assembly?
suggested_experiments:
- description: IP-mass spectrometry of LDOC1 under proteasome inhibition and in vitro reconstitution of
    GNL3L and H2Bub1 degradation to define whether LDOC1 is a substrate-recognition adaptor for an E3
    ligase or the proteasome.
- description: Validate the chromatin/transcription interactome (PRC2, NuRD, SIN3, SWI/SNF) by co-IP and
    proximity ligation, with functional epistasis to H2Bub1 regulation.
