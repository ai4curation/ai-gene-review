  review:
    summary: LDOC1 inhibits canonical NF-kB signaling, promoting apoptosis.
    action: NEW
    reason: 'Two independent lines: LDOC1 is described as inhibiting NF-kB to drive apoptosis, and mechanistically
      it binds and destabilizes GNL3L, reversing GNL3L-driven upregulation of the p65 NF-kB subunit. LDOC1
      performs the step (destabilizing a positive regulator), so it participates in negative regulation
      of NF-kB rather than merely being required for it.'
