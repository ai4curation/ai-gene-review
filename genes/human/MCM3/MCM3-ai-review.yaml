core_functions:
- description: MCM3 contributes to the nuclear MCM2-7/CMG helicase that binds the leading-strand template, couples ATP
    hydrolysis to DNA translocation, and unwinds duplex DNA during origin firing and replication elongation.
  contributes_to_molecular_function:
    id: GO:0017116
    label: single-stranded DNA helicase activity
  directly_involved_in:
  - id: GO:1902975
    label: mitotic DNA replication initiation
  - id: GO:0006271
    label: DNA strand elongation involved in DNA replication
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0071162
    label: CMG complex
  supported_by:
  - reference_id: PMID:22474384
    supporting_text: The complex hydrolyses ATP in the absence of DNA; unwinds duplex regions up to 500 bp
  - reference_id: PMID:32453425
    supporting_text: All MCM subunits contact DNA, from MCM2 at the 5'-end to MCM5 at the 3'-end of the DNA spiral
  - reference_id: file:human/MCM3/MCM3-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Core component of CDC45-MCM-GINS (CMG) helicase, the molecular machine that unwinds template DNA
      during replication
proposed_new_terms: []
suggested_questions:
- question: What regulatory role does the MCM3-MCM5 gate play in human origin licensing and CMG activation, and which
    human factors control that gate in vivo?
- question: Are disease-associated MCM3 variants mechanistically linked to defective MCM2-7 loading, CMG translocation,
    or extra-replicative protein interactions?
suggested_experiments:
- description: Reconstitute human MCM2-7 with MCM3 gate-interface variants and quantify origin loading, CMG formation,
    ATPase activity, and fork unwinding.
  hypothesis: MCM3 gate-interface residues tune the transition from loaded MCM2-7 double hexamer to activated CMG
    helicase.
