id: P25205
gene_symbol: MCM3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MCM3 encodes an AAA+ ATPase subunit of the MCM2-7 heterohexamer, the core motor ring of the eukaryotic CMG replicative
  helicase. Human MCM3 assembles with MCM2, MCM4, MCM5, MCM6 and MCM7 in the nucleus, is loaded onto replication origins before
  S phase, and contributes to ATP-dependent DNA unwinding by the activated CMG complex during DNA replication.'
alternative_products:
