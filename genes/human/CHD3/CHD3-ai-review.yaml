id: Q12873
gene_symbol: CHD3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHD3 (Mi-2alpha) is an ATP-dependent chromatin remodeler that changes nucleosome positioning
  and DNA accessibility. It forms CHD3-containing NuRD assemblies and contributes remodeling activity
  alongside the histone-deacetylase subunits. Its tandem PHD fingers recognize histone H3 tails, with
  sensitivity to their modification state. CHD3 acts mainly on nuclear chromatin and can support either
  transcriptional repression or activation in a target- and cell-dependent manner. Human stem-cell studies
  link CHD3-dependent chromatin accessibility to cranial neural crest specification. A smaller centrosomal
  pool associates with pericentrin and contributes to centrosomal protein retention and spindle organization.
  Pathogenic CHD3 variants can alter ATPase activity or its coupling to remodeling and cause a neurodevelopmental
  disorder with prominent speech and language impairment.
