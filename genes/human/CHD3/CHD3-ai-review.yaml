core_functions:
- description: CHD3 uses ATP hydrolysis to reposition nucleosomes and alter chromatin accessibility. This
    motor activity supports context-dependent transcription regulation in CHD3-containing NuRD assemblies;
    deacetylation is performed by the HDAC subunits. Human purified-protein assays establish the remodeling
    step directly, while histone recognition and nuclear chromatin localization provide substrate and
    cellular context.
  molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0016581
    label: NuRD complex
  supported_by:
  - reference_id: PMID:28977666
    supporting_text: nucleosome positioning between CHD3 and CHD4
  - reference_id: PMID:30397230
    supporting_text: restriction enzyme accessibility to nucleosomal DNA
  - reference_id: PMID:27068747
  - reference_id: PMID:29020631
suggested_questions:
- question: Which current CHD3 alternative products were used in each purified motor assay, and do their
    C-terminal differences alter remodeling or partner selection?
- question: Does the Mi-2 reagent in the DDX5 study distinguish CHD3 from CHD4, and what original record
    links PMID:9804427 to mouse pericentrin?
- question: What molecular step retains pericentrin at centrosomes, and how much of the CHD3 depletion
    phenotype is independent of transcriptional changes?
- question: Which RNAs and CHD3 regions underlie the positive UV-crosslink interactome capture, and does
    that binding regulate remodeling in a defined cellular context?
- question: Which CHD3 activities during human neural crest specification require NuRD, and which operate
    in other assemblies?
suggested_experiments:
- description: Map the exact recombinant sequences to current products and compare ATPase and nucleosome-accessibility
    assays under matched conditions.
- description: Use paralog-specific endogenous tagging or unique peptides to resolve the DDX5-associated
    Mi-2 protein.
- description: Separate acute centrosomal CHD3 perturbation from longer transcriptional changes while
    measuring pericentrin exchange and retention.
