      features of PGES activity detected in rat brain cytosol.
  - reference_id: PMID:10922363
    supporting_text: >-
      cPGES/p23 was functionally linked with COX-1 in marked preference to COX-2 to
      produce PGE(2) from exogenous and endogenous arachidonic acid.
- molecular_function:
    id: GO:0051879
    label: Hsp90 protein binding
  description: >-
    PTGES3/p23 binds to the N-terminal domain of HSP90 in its ATP-bound conformation, stabilizing the
    "closed 2" HSP90 dimer state and inhibiting/reducing HSP90 ATPase activity, thereby regulating progression
    of the HSP90 chaperone cycle and shaping client maturation/release (DOI:10.1038/nrm.2017.20, DOI:10.3389/fimmu.2024.1436973).
    This co-chaperone activity contributes to maturation of steroid hormone receptors, hTERT, and other
    HSP90 client proteins. The CS domain in the N-terminal region of p23 mediates HSP90 binding, while
    the unstructured acidic C-terminal tail is important for its independent passive chaperoning activity
    preventing protein aggregation. Beyond the cytosol, nuclear p23 can function as an HSP90-independent
    transcription factor for COX-2 (PTGS2) in lung adenocarcinoma, driven by succinate-induced succinylation
    at K7/K33/K79 (DOI:10.1126/sciadv.ade0387). Direct human AR studies support ligand-binding competence
    and chromatin occupancy; these effects can be partly HSP90 independent.
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0051131
    label: chaperone-mediated protein complex assembly
  - id: GO:0050821
    label: protein stabilization
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0101031
    label: protein folding chaperone complex
  supported_by:
  - reference_id: PMID:10543959
    supporting_text: >-
      p23 binds to Hsp90 in its ATP-bound state and, on its own, interacts specifically
      with non-native proteins.
  - reference_id: PMID:10811660
    supporting_text: >-
      the tail is necessary for optimum active chaperoning of the progesterone receptor,
      as well as the passive chaperoning activity of p23 in assays measuring inhibition
      of heat-induced protein aggregation.
  - reference_id: PMID:21183720
    supporting_text: >-
      it is Hsp90's nucleotide-binding domain that triggers the formation of the
      Hsp90(2)p23(2) complex.
  - *id001
  - *id002
