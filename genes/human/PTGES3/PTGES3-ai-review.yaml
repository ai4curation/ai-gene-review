id: Q15185
gene_symbol: PTGES3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Dual-function protein (160 aa, ~18.7 kDa) that acts both as a cytosolic prostaglandin E synthase (cPGES)
  catalyzing the glutathione-dependent isomerization of PGH2 to PGE2, and as an HSP90 co-chaperone (p23)
  that stabilizes the HSP90-client protein complex in the ATP-bound closed conformation. As a co-chaperone,
  p23 inhibits/reduces HSP90 ATPase activity by stabilizing the "closed 2" conformational state, thereby
  regulating progression of the HSP90 chaperone cycle and shaping client maturation/release (DOI:10.1038/nrm.2017.20).
  PTGES3 participates in the maturation and stabilization of steroid hormone receptors, telomerase, and
  other HSP90 client proteins. As a PGE synthase, PTGES3/cPGES is functionally coupled with COX-1 (PTGS1)
  in preference to COX-2 for immediate PGE2 biosynthesis. Recent work reveals that PTGES3 can function
  as an HSP90-independent transcription factor for COX-2 (PTGS2) in lung adenocarcinoma, driven by succinate-dependent
  lysine succinylation (K7, K33, K79) that promotes nuclear translocation; nuclear p23 was detected in
  >90% of tumor tissues versus ~5% of adjacent normal tissues (DOI:10.1126/sciadv.ade0387). PTGES3 can
  also interact with p53 independently of HSP90 and protect the aryl hydrocarbon receptor from degradation.
  Contains a CS domain (CHORD-containing proteins and SGT1 domain) in the N-terminal region mediating
  HSP90 binding and an unstructured acidic C-terminal tail important for its independent passive chaperoning
  activity preventing protein aggregation. In human prostate cancer models, p23 supports androgen-receptor
  protein abundance, ligand-binding capacity and promoter occupancy; some AR effects persist when p23
  cannot bind HSP90. These functions are distinct from its prostaglandin-synthase activity and need not
  imply an obligatory p23-dependent import step.
