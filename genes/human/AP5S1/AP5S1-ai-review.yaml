  justification: 'AP-5 does not work as an isolated heterotetramer. The four subunits co-purify with spatacsin
    and spastizin at approximately 1:1:1:1:1:1 from both cytosol and detergent-extracted membranes, all
    six knockdowns give the same cargo phenotype, and the assembly has now been reconstituted and solved
    by cryo-EM, with the N-terminal region of spatacsin required for AP-5 complex interaction and assembly.
    ComplexPortal curates it as CPX-20045 (AP5Z1:AP5B1:ZFYVE26:SPG11:AP5M1:AP5S1) but that entry carries
    no GO cross-reference, whereas the tetramer CPX-5181 maps to GO:0044599; QuickGO text searches for
