      converge: the four subunits plus spatacsin and spastizin co-purify at roughly 1:1:1:1:1:1, so sigma-5
      is a stoichiometric member rather than a substoichiometric associate; immunoprecipitating tagged
      sigma-5 brings down mu5 and beta5; and the structure resolves it in the canonical small-subunit
      position on the large adaptin, the same position sigma1, sigma2 and sigma3 occupy. The claim is
      deliberately bounded and no stronger term is used: unlike sigma4, sigma-5 has never been removed
