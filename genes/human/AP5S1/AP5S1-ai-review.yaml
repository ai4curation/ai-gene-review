suggested_questions:
- question: Should InterPro's mapping of IPR029392 to GO:0000724 be retained? The family entry matches
    790 proteins across 2,294 taxa and the mapping is cited in the entry itself to PMID:20613862, a single
    DR-GFP experiment in HeLa cells in which two other members of the same complex showed no effect. The
    result is that every AP-5 sigma subunit in every eukaryote is electronically annotated to homologous
    recombination repair.
  experts:
  - InterPro curators
  - GOA
- question: Should GO create a cellular-component term for the AP-5/spatacsin/spastizin complex? ComplexPortal
    curates it as CPX-20045 but the entry has no GO cross-reference, so the hexamer's curation reaches
    the subunits only as location and process statements, and SPG11 and ZFYVE26 have no complex term at
    all.
  experts:
  - GO Ontology editors
  - ComplexPortal curators
- question: How should the molecular activity of a non-clathrin coat adaptor be expressed? GO:0140312
    cargo adaptor activity is defined as binding the structural scaffolding of a vesicle coat 'such as
    clathrin or COPII' and bridging the cargo receptor. ComplexPortal asserts it for the AP-5 tetramer,
    but AP-5 binds no clathrin, its scaffold is thought to be spatacsin, and whether it engages cargo
    at all is unresolved - so no AP-5 subunit carries any molecular function term beyond bare GO:0005515
    protein binding.
  experts:
  - GO Ontology editors
  - Gene Ontology membrane-trafficking curators
- question: Is the zeta N-terminus a regulatory element over a latent sigma-5 site? In closed AP-2 the
    sigma2 dileucine pocket is occupied by the beta2 N-terminus and released on activation; beta5 lacks
    that segment, and in the AP-5 structure the equivalent sigma-5 surface is instead in contact with
    the zeta N-terminus, in what the authors describe as the active, super-open conformation. Does deleting
    it expose a binding site?
  experts:
  - AP complex structural biologists
  - Membrane traffic biochemists
suggested_experiments:
- hypothesis: AP-5 does not read acidic dileucine or YxxPhi sorting signals, and the surface that would
    read them in sigma-5 is both chemically altered and occluded by the zeta N-terminus.
  description: Use the reconstituted AP-5 core (zeta/sigma-5 plus beta5/mu5, as assembled for cryo-EM
    with the spatacsin WD40-hairpin) in liposome-binding or ITC assays against a panel of sorting motifs
    - CD4 and LIMP-II dileucine peptides, a TGN38 YxxPhi peptide - with the AP-2 core as the positive
    control and PI3P-containing liposomes to provide the membrane context. Repeat with a zeta N-terminal
    deletion (residues 1-10) and with sigma-5 T143V/R151V substitutions that restore the sigma2 pocket
    chemistry. A negative result with wild type and a positive one with the restored pocket would show
    the site is vestigial rather than absent.
  experiment_type: biophysical binding assay
- hypothesis: Sigma-5 is required for AP-5 function, and an AP5S1 null phenocopies the AP5Z1 null.
  description: 'Make CRISPR AP5S1 knockouts in HeLa and run the same two readouts used for the AP5Z1 knockout:
    dynamic organellar mapping and vesicle-fraction proteomics, plus monensin-washout imaging of CIMPR,
    GOLIM4 and GOLM1 retrieval, with and without retromer knockdown. Blot for the other three subunits
    to establish whether the tetramer survives loss of sigma-5, which is the question the siRNA experiments
    cannot answer.'
  experiment_type: genetic knockout with quantitative proteomics
- hypothesis: The sigma-5 surface that contacts the spatacsin WD40-hairpin is required for assembly of
    the AP-5 tetramer, not merely adjacent to it.
  description: Mutate the 20 sigma-5 residues identified at the spatacsin interface in the structure,
    in blocks of three to four, and test each variant for (i) co-expression assembly of the heterotetramer
    in the reconstitution system, (ii) co-immunoprecipitation with spatacsin from cells, and (iii) rescue
    of CIMPR retrieval in an AP5S1 knockout. Separating an assembly-defective allele from a spatacsin-binding-defective
    one would say whether sigma-5's contribution to the SPG11 contact is structural or regulatory.
  experiment_type: structure-guided mutagenesis
- hypothesis: The homologous-recombination phenotype of sigma-5 knockdown is an indirect consequence of
    endolysosomal dysfunction.
  description: Repeat the DR-GFP assay in AP5S1-null cells alongside AP5Z1-null cells, with cell-cycle
    profiling and proliferation controls, and score gamma-H2AX resolution after irradiation. Then ask
    whether a membrane-recruitment-defective but assembly-competent condition - for example wortmannin
    treatment or loss of the spastizin FYVE domain - reproduces the repair phenotype. If repair tracks
    membrane recruitment, the phenotype is downstream of traffic.
  experiment_type: genetic separation of function
