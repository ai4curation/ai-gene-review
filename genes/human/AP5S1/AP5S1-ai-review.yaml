id: Q9NUS5
gene_symbol: AP5S1
aliases:
- C20orf29
- Sigma5
- AP-5 complex subunit sigma-1
- sigma-5 adaptin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AP5S1 encodes sigma-5 (also called C20orf29), the 200-residue small subunit of AP-5, the
  fifth and most divergent of the heterotetrameric adaptor protein complexes. AP-5 pairs two large subunits,
  zeta-5 (AP5Z1) and beta-5 (AP5B1), with a medium subunit mu-5 (AP5M1) and sigma-5, and unlike AP-1 and
  AP-2 it neither binds clathrin nor requires ARF1 for membrane recruitment. In cells it does not work
  alone: the tetramer is stably associated with the two large hereditary spastic paraplegia proteins spatacsin
  (SPG11) and spastizin (ZFYVE26/SPG15), and the six proteins co-purify at approximately equal stoichiometry
  from both cytosol and membranes. The assembly cycles between a cytosolic pool and the membrane of late
  endosomes and lysosomes, onto which it is recruited by coincidence detection that requires phosphatidylinositol
  3-phosphate, read by the spastizin FYVE domain, together with Rag GTPases, and which is enhanced when
  cells are starved. Its cellular job is retrieval out of the late endocytic system: loss of AP-5 impairs
  the return of the cation-independent mannose 6-phosphate receptor and of the Golgi membrane proteins
  GOLIM4 and GOLM1 from endosomes to the Golgi, acting as a parallel route to retromer, and cells lacking
  the complex accumulate enlarged, multilamellar endolysosomes filled with storage material. Within the
  complex, sigma-5 is the partner of zeta-5, forming one of the two hemicomplexes from which AP-5 is assembled,
  and in the cryo-EM structure of the core it also contributes part of the surface that binds the spatacsin
  WD40-hairpin, an interface whose spatacsin side is required for the complex to assemble. It has no known
  catalytic activity, and no sorting signal has yet been identified for AP-5: the cargo-binding regions
  that are conserved in the other adaptor complexes are altered in AP-5, so whether and how it recognises
  cargo directly remains open. Mutations in the other AP-5 subunits and in SPG11 and ZFYVE26 cause hereditary
  spastic paraplegia and a lysosomal macular dystrophy; no disease-causing variant has yet been reported
  in AP5S1 itself.'
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'InterPro2GO. One signature is used on this gene, IPR029392, and it was fetched from
      the InterPro API and checked: it is the AP-5 sigma-1 family (PANTHER PTHR16120 + Pfam PF15001),
      AP5S1 is the only human gene it contains (a UniProt query for the signature in taxon 9606 returns
      Q9NUS5 plus two unreviewed TrEMBL records of the same gene), and it maps to GO:0000724, GO:0016197
      and GO:0030119 - exactly the three terms that appear on this gene through this reference. Two of
      the three are sound. The third, GO:0000724, is cited in the InterPro entry to PMID:20613862 and
      therefore propagates a single human RNAi phenotype family-wide; that row is marked over-annotated
      and the mapping is raised with InterPro in suggested_questions.'
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  publication_type: DATABASE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PAINT/GO_Central. All five IBA rows trace to node PTN000413531 of PTHR16120, and the
      local PAINT slice contains exactly five IBD rows, one per term, each seeded by UniProtKB:Q9NUS5
      alone. Because AP5S1 is the only human gene in the family and its own experimental annotations are
      the seeds, these IBAs restate the target's own evidence as an ancestral property of the sigma-5
      orthology group. No IRD or IKR appears in the slice.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'UniProt subcellular-location mapping. All three location identifiers used here were
      resolved at the UniProt locations endpoint and each maps to exactly the GO term used: SL-0157 Lysosome
      membrane to GO:0005765, SL-0091 Cytosol to GO:0005829 and SL-0151 Late endosome membrane to GO:0031902.
      All three correspond to lines on AP5S1''s own record; the two membrane statements carry ECO:0000305
      (curator inference from PMID:22022230) rather than ECO:0000269, which is recorded in the row reviews.'
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  publication_type: DATABASE
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Human Protein Atlas immunofluorescence curation. A projection count in QuickGO gives
      3,640 distinct gene products annotated through this reference, so it is a systematic screen rather
      than a statement about AP5S1. Its single row here, cytosol, agrees with the fractionation data on
      AP-5 and is kept as non-core.
- id: PMID:20613862
  title: A genome-scale DNA repair RNAi screen identifies SPG48 as a novel gene associated with hereditary
    spastic paraplegia.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read. Genuinely the discovery paper for this protein''s membership
      in the complex: tagged KIAA0415 (AP5Z1) co-precipitates SPG11, SPG15, C20orf29 (AP5S1) and DKFZp761E198
      (AP5B1), and reciprocal pulldowns with three baits confirm a five-protein core. It supplies both
      the four protein-binding IPI rows and the homologous-recombination IMP; the recombination result
      is correctly reported for C20orf29 with two independent esiRNAs, which is why that row is demoted
      rather than removed. QuickGO shows the reference annotating exactly five entities, the five members
      of the complex.'
- id: PMID:22022230
  title: The fifth adaptor protein complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read. The paper that names C20orf29 sigma-5 and supplies almost
      all of the subunit-level evidence used here: the GFP-sigma-5 co-immunoprecipitation of mu5 and beta5,
      the LAMP1 colocalisation quantitation, and the knockdown phenocopy. Also the source of two negative
      statements that constrain the review - AP-5 does not associate with clathrin, and mu5 lacks the
      residues needed to bind YxxPhi signals. QuickGO shows it annotating 10 entities: the four human
      subunits, four mouse orthologues and two ComplexPortal complexes, i.e. a complex-scoped paper rather
      than a catalogue deposition.'
- id: PMID:23825025
  title: Interaction between AP-5 and the hereditary spastic paraplegia proteins SPG11 and SPG15.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract only in the cache (full_text_available: false), and used only for statements
      the abstract itself makes: the ~1:1:1:1:1:1 stoichiometry of the six proteins, that all six knockdowns
      trap the CIMPR in early endosome clusters, and that AP-5, SPG11 and SPG15 colocalise on a late endosomal/lysosomal
      compartment. The first two are the reason sigma-5 can be treated as an equal member of the assembly
      rather than an inferred one.'
  full_text_unavailable: true
- id: PMID:26085577
  title: 'Loss of AP-5 results in accumulation of aberrant endolysosomes: defining a new type of lysosomal
    storage disease.'
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text available and read. Complex-level rather than subunit-level: the experiments
      are AP5Z1 patient fibroblasts and AP-5 zeta knockdown in HeLa, not sigma-5. Used for the consequence
      of losing AP-5 (enlarged multilamellar endolysosomes filled with storage material) and for its statement
      that sigma-5 is one of the core members of the stable assembly. Cited in support of a non-core process
      row, not of a core one.'
- id: PMID:29381698
  title: Role of the AP-5 adaptor protein complex in late endosome-to-Golgi retrieval.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. The study that identifies the pathway, and the basis for
      the NEW GO:0034499 row - but its perturbation is a CRISPR knockout of AP5Z1, not of AP5S1, so it
      is cited as an additional reference for that row rather than as the source of an experimental code
      on this gene. Also the source of the clearest statement that cargo binding in this system is attributed
      to SPG15 rather than to the heterotetramer, and of the field's own admission that how the complex
      binds cargo is unknown.
- id: PMID:33464297
  title: Rag GTPases and phosphatidylinositol 3-phosphate mediate recruitment of the AP-5/SPG11/SPG15
    complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read. Supplies the recruitment mechanism (coincidence detection
      on PI3P via the SPG15 FYVE domain plus Rag GTPases, enhanced by starvation, ARF1-independent) and,
      from the same authors who discovered AP-5, the decisive statement for this review''s position on
      cargo binding: the sorting-signal-binding regions are different in AP-5 and cargo recognition, assuming
      it occurs, must work by another mechanism.'
- id: PMID:40175557
  title: Structural basis for membrane remodeling by the AP5-SPG11-SPG15 complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract only in the cache (full_text_available: false); quotes used here are from
      the abstract. The structures it reports, 8YAB and 8YAH, are public, and the structural statements
      this review relies on were measured directly from 8YAB rather than taken from the paper - see the
      bioinformatics directory. It is also the source of the IntAct interaction with mouse Ap5z1, which
      is the reconstituted zeta/sigma-5 pair rather than a heterologous artefact. QuickGO shows it annotating
      10 entities including the hexameric ComplexPortal complex CPX-20045.'
  full_text_unavailable: true
- id: PMID:40081374
  title: Bi-allelic variants in three genes encoding distinct subunits of the vesicular AP-5 complex cause
    hereditary macular dystrophy.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text available and read. Human genetics of the complex: 23 bi-allelic variants
      in AP5Z1, AP5M1 and AP5B1 cause a macular dystrophy, and the authors state explicitly that it remains
      unclear whether AP5S1 variants cause disease. Used for the knowledge gap about this subunit rather
      than for any annotation row.'
- id: PMID:19140243
  title: A structural explanation for the binding of endocytic dileucine motifs by the AP2 complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text available and read. Not about AP-5: it is the AP-2 co-crystal study that
      defines the acidic dileucine site on sigma2 and names the pocket residues whose mutation abolishes
      binding. It is cited here because it supplies the comparator for the structural test of whether
      sigma-5 has that site - both the functional roles attached to the residue_claims and, through PDB
      2JKR, the structure from which the site is defined empirically rather than from a typed-in residue
      list.'
- id: PMID:23222959
  title: Mutations in AP2S1 cause familial hypocalciuric hypercalcemia type 3.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Full text available. Cited for one narrow purpose: it establishes that sigma2 Arg15,
      the residue that reads the acidic position of the dileucine motif, is a human disease locus, which
      is what makes its replacement by tyrosine in sigma-5 worth recording as a residue claim. Says nothing
      about AP-5 and is not used for any annotation on this gene.'
- id: file:human/AP5S1/AP5S1-bioinformatics/RESULTS.md
  title: 'AP5S1 (sigma-5): what the AP-5 structure says the subunit does'
  publication_type: BIOINFORMATICS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural analysis written for this review. Measures sigma-5's interfaces in 8YAB and
      carries the empirically-defined sigma2 dileucine site (contacts with the CD4 peptide in 2JKR) onto
      sigma-5 by sequence-independent structural superposition, with positive (second sigma2 copy), negative
      (beta5 solenoid) and shuffled-sequence controls. All inputs are fetched live and sequence lengths
      and residue numbering are asserted per chain, which caught a one-residue offset in the deposited
      zeta numbering.
- id: file:human/AP5S1/AP5S1-uniprot.txt
  title: UniProtKB entry Q9NUS5 (AP5S1_HUMAN)
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The machine-fetched UniProt record for the gene. Cited only for the PANTHER family assignment
      line, which establishes that AP5S1 is in PTHR16120 (not PTHR11753, the family of the AP-1 to AP-4
      sigma subunits) and is therefore inside the clade of the IBD node.
- id: file:human/AP5S1/AP5S1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP5S1 (human)
  publication_type: DEEP_RESEARCH
  reference_review:
    relevance: NONE
    correctness: UNVERIFIED
    review_notes: 'Machine-fetched affinage record. It is empty for this gene - n_discoveries: 0, citation_count:
      0, and the narrative reads ''No mechanistic discoveries found in literature'' - even though the
      trust gates passed, which is consistent with those gates measuring precision rather than recall.
      It contributed nothing to this review; all eight papers used were found by independent Europe PMC
      searches on the symbol, the complex and the partner proteins. Marked VERIFIED in the sense that
      the record is faithfully what the API returned, and NONE for relevance.'
