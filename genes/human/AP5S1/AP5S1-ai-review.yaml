core_functions:
- description: 'Integral small subunit of the AP-5 adaptor complex and the partner of the zeta adaptin.
    In the 3.26 A cryo-EM structure of the AP-5 core bound to the spatacsin WD40-hairpin, sigma-5 buries
    about 2,620 square angstroms against the zeta trunk across 60 residues and contacts neither beta5
    nor mu5 - the same topology sigma1, sigma2 and sigma3 have with their large adaptins - and it additionally
    buries about 755 square angstroms against the spatacsin WD40-hairpin, a contact no other AP sigma
    subunit makes and one that belongs to the interaction licensing assembly of the two AP-5 hemicomplexes
    into a tetramer. The molecular function asserted for this is architectural - GO:0005198, whose definition
    is exactly ''the action of a molecule that contributes to the structural integrity of a complex''
    - and nothing more. Sigma-5 has no catalytic activity, and the one molecular activity its paralogues
    supply, reading acidic dileucine sorting signals together with their large subunit, does not transfer:
    the sigma fold is retained in sigma-5 but the chemistry of the site is not (3 of 19 peptide-contacting
    positions identical; the pocket-lining valines become threonine and arginine and the basic-patch arginine
    becomes tyrosine), and the equivalent surface is partly covered by the zeta N-terminus in the assembled
    core. GO:0140312 cargo adaptor activity, the only other candidate, requires binding clathrin- or COPII-like
    scaffolding and bridging a cargo receptor; AP-5 binds no clathrin and its cargo step is explicitly
    unestablished, so it is not asserted here and the absence is recorded as a knowledge gap. The architectural
    claim is itself bounded: it rests on the structure rather than on a knockout, because no AP5S1-null
    cell line has been made and it is not known whether AP-5 can assemble without sigma-5.'
