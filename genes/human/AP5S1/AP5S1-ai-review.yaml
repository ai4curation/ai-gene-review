- term:
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR029392
  review:
    summary: InterPro2GO row. IPR029392 is the AP5S1-specific family entry (PANTHER PTHR16120 plus Pfam
      PF15001), and one of the three GO terms it maps to is homologous-recombination repair. The InterPro
      entry's own description states that the family 'is required for efficient homologous recombination
      DNA double-strand break repair' and cites PMID:20613862 for it, which is the same single HeLa esiRNA
      experiment that already supplies this gene's IMP row.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The electronic row is not independent of the experimental one beside it: the mapping traces
      to one DR-GFP recombination readout, performed on this very protein, so it adds no evidence about
      AP5S1 while doubling the apparent support for the weakest process claim on the gene. It also carries
      that human cell-line phenotype to every member of the family - the InterPro entry matches 790 proteins
      across 2,294 taxa - for a process with no mechanistic account, no replication in the fifteen years
      since, and no coherence even inside the original experiment, where two of the other four core proteins
      of the same complex gave no effect. Marked as over-annotated rather than removed because the underlying
      human observation is real; the family-wide mapping is the part that should be revisited, and that
      is raised with InterPro in suggested_questions.'
    supported_by:
    - &id001
      reference_id: PMID:20613862
      supporting_text: significant reduction of GFP positive cells were observed upon silencing of C20orf29
        and SPG15 with two independent esiRNAs
    - &id002
      reference_id: PMID:20613862
      supporting_text: Knockdown of SPG11 and DKFZp761E198, however, did no have an effect on the percentage
        of GFP positive cells.
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: InterPro:IPR029392
        source_label: InterPro IPR029392, AP-5 complex subunit sigma-1 (PANTHER PTHR16120 + Pfam PF15001)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: The signature is correctly assigned - AP5S1 is the only human gene in PTHR16120 and in
          of PF15001 - so the problem is not the match but the term attached to it. The InterPro description
          cites PMID:20613862 for the repair claim, i.e. the source of the family-level mapping is the
          target's own single RNAi experiment, which the target already carries as an IMP.
      residue_claims_not_applicable: 'The objection is to the evidential status and scope of a family-to-process
        mapping, not to any residue: no site in sigma-5 has ever been implicated in recombination.'
- term:
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:20613862
  qualifier: involved_in
  review:
    summary: The only direct experimental claim for a nuclear process. C20orf29 (AP5S1) was not a hit
      in the genome-scale screen itself; it was tested because it co-purified with KIAA0415/AP5Z1, and
      two independent esiRNAs then reduced homologous recombination in the DR-GFP reporter assay.
    action: KEEP_AS_NON_CORE
    reason: 'The observation is on-target for this gene and is not second-guessed here: the paper states
      it for C20orf29 explicitly, with two independent silencing triggers, and the curator read the full
      text. It is nonetheless peripheral rather than core, on grounds internal to the same paper and to
      the subsequent literature. Within that experiment the effect does not behave like a property of
      the complex - knocking down SPG11 or beta5 changed nothing - so it cannot be read as ''AP-5 acts
      in recombination''. The group that went on to characterise AP-5 argued the repair phenotype is likely
      indirect and showed the complex acting on late endosomes with an endosomal knockdown phenotype.
      Fifteen years later no work has connected AP-5 to recombination, while five papers have built out
      its endolysosomal role. Retained as a real but non-core observation.'
    supported_by:
    - *id001
    - *id002
    - &id005
      reference_id: PMID:22022230
      supporting_text: these observations suggest that the site of action of AP-5 is the late endosome
        and/or lysosome, as defined by the presence of LAMP1
    additional_reference_ids:
    - PMID:22022230
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20613862
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43299
  review:
    summary: 'Partner resolved: O43299 is AP5Z1 (zeta-5/SPG48), the large adaptin of AP-5 and the bait
      in the experiment. This is the one pairing in the set that is a direct, structurally resolved contact
      - sigma-5 sits on the zeta trunk - but the row records it only as protein binding.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Bare GO:0005515 tells us nothing about what sigma-5 does, and here it cannot be upgraded.
      The reference-projection test shows PMID:20613862 annotating exactly five distinct entities in QuickGO
      - AP5Z1, AP5B1, AP5S1, SPG11 and ZFYVE26 - so these IPI rows are the internal partner list of one
      complex rather than independent binding activities. The informative statement is complex membership,
      GO:0044599, which the gene already carries. The architectural molecular function sigma-5 does have
      is asserted separately, as a NEW GO:0005198 row grounded in the structure; it is not reached by
      modifying an IPI row, because an IPI records a pairwise partnership and the binding-specificity
      function that would fit such a row - recognition of a sorting signal - is not established for AP-5
      at all. The one candidate binding term, GO:0140312 cargo adaptor activity, requires binding a clathrin-
      or COPII-like scaffold and bridging a cargo receptor, neither of which holds here. For this partner
      specifically the contact is real and direct: in the AP-5 cryo-EM structure sigma-5 buries ~2,620
      square angstroms against the zeta trunk and touches no other AP-5 subunit.'
    supported_by:
    - &id003
      reference_id: PMID:20613862
      supporting_text: Immunoprecipitation experiments followed by spectrometric identification of co-isolated
        proteins revealed interactions of KIAA0415-LAP with SPG11, SPG15, C20orf29, and DKFZp761E198
    - &id004
      reference_id: file:human/AP5S1/AP5S1-bioinformatics/RESULTS.md
