- proposed_name: AP-5-spatacsin-spastizin complex
  proposed_definition: A protein-containing complex consisting of the four subunits of the AP-5 adaptor
    complex (zeta-5, beta-5, mu-5 and sigma-5) stably associated with spatacsin and spastizin, found on
    the cytoplasmic face of late endosomal and lysosomal membranes, where it acts in retrieval of membrane
    proteins out of the late endocytic system.
