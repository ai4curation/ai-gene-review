- description: 'Participation in retrieval of membrane proteins out of the late endocytic system, as part
    of the AP-5/SPG11/SPG15 assembly. This is the function for which sigma-5 itself, and not only the
    complex, has been perturbed: siRNA depletion of sigma-5 reproduces the phenotype of depleting mu5
    or beta5, redistributing the cation-independent mannose 6-phosphate receptor and the retromer subunit
