    complex term being GO:0044599 for the tetramer. The absence is visible in this gene''s own annotation
    set: the three rows ComplexPortal derives from the hexamer''s structural paper reach AP5S1 as location
    and process statements because there is no complex for it to be part_of. A term would also give the
    SPG11 and ZFYVE26 gene products, which are not AP-5 subunits, a correct home.'
