    supporting_text: AP-5 ζ and spastizin have been shown to associate in a stable complex, along with
      core members of AP-5 (β5, µ5 and σ5) and spatacsin
knowledge_gaps:
- gap_statement: No sorting signal, and no direct cargo, has ever been identified for AP-5, so sigma-5
    has no molecular function that can be stated - not merely none that GO can express.
  boundary: 'Firmly established on the negative side: mu-5 lacks the residues that read YxxPhi signals;
    the sorting-signal-binding regions are different throughout AP-5; the structurally equivalent positions
    of the sigma2 dileucine site in sigma-5 mostly carry different residues (3 of 19 identical) and three
    of them are covered by the zeta N-terminus in the assembled core; and cargo binding in this system
    has so far been attributed to the accessory protein spastizin rather than to the heterotetramer. Firmly
    established on the positive side: the complex is needed for retrieval of the CIMPR, GOLIM4 and GOLM1
    from endosomes to the Golgi, and sortilin and the CIMPR come down in spastizin pulldowns, so cargo
    is being selected somehow.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Until it is closed, every AP-5 subunit is annotatable only by location, complex membership
    and pathway participation; the complex's defining property as an adaptor - which cargo it selects
    and through which surface - is unrepresentable, and the five protein-binding rows on this gene cannot
    be upgraded to anything informative.
  resolution: Test the reconstituted AP-5 core against a panel of sorting motifs with AP-2 as a positive
    control, including a zeta N-terminal deletion to ask whether a latent site is being occluded; or find
    the cargo determinant by comparing the cytosolic tails of the proteins whose retrieval fails when
    AP-5 is lost.
  provenance:
  - *id025
  - reference_id: PMID:29381698
    supporting_text: It will be important to uncover the molecular details of how the AP-5/SPG11/SPG15
      complex binds to cargo
  - reference_id: PMID:29381698
    supporting_text: The ability of SPG15 to bind cargo supports this possibility, because the only known
      cargo-binding subunits of COPI are associated with the protocoatomers, not the core heterotetramer
  - reference_id: PMID:22022230
    supporting_text: In addition, the lack of key residues in μ5 for binding YXXΦ motifs indicates that,
      if AP-5 is an adaptor, it must be recognising some other type of sorting signal
- gap_statement: GO has no term for the AP-5/spatacsin/spastizin assembly, although that six-protein complex,
    not the AP-5 tetramer, is the entity that has been purified, phenotyped and solved.
  boundary: 'Established: the six proteins associate stably and at equal stoichiometry, all six knockdowns
    give the same cargo phenotype, and the assembly has been reconstituted for cryo-EM. Established on
    the ontology side: GO:0044599 exists for the tetramer and is cross-referenced by ComplexPortal''s
    CPX-5181, whereas CPX-20045 for the hexamer carries no GO cross-reference, and no GO term returned
    by searches for spatacsin, spastizin or AP-5 covers it.'
  gap_kind:
  - ONTOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: ComplexPortal's curation of the hexamer currently reaches AP5S1 only as location and process
    rows, never as complex membership, and spatacsin and spastizin have no complex term at all despite
    being the two proteins whose mutations define the disease.
  resolution: Create the complex term set out in proposed_new_terms and map CPX-20045 to it.
  provenance:
  - *id021
  - *id024
  proposed_terms: *id029
- gap_statement: AP5S1 is the only AP-5 subunit with no reported disease-causing variant, and no AP5S1
    knockout has been characterised, so it is unknown whether losing sigma-5 has the same consequences
    as losing the other three subunits.
  boundary: 'Established: bi-allelic variants in AP5Z1, AP5M1 and AP5B1 cause a recessive macular dystrophy,
    AP5Z1 variants also cause SPG48, and the authors of the genetics study state explicitly that whether
    AP5S1 variants cause disease is still unclear and would be very rare. Established for cell biology:
    sigma-5 siRNA phenocopies the other subunits, but every deeper phenotype - the knockout proteomics,
    the organellar maps, the patient fibroblasts, the mouse models - was obtained on AP5Z1 or on SPG11/SPG15.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: It leaves open whether sigma-5 is dispensable for AP-5 function - a real possibility for
    a small subunit whose only measured contacts are with zeta and spatacsin - and it means the strongest
    phenotypic evidence on this gene is a 2011 siRNA experiment.
  resolution: Knock out AP5S1 in HeLa and repeat the dynamic organellar mapping and vesicle-fraction proteomics
    used for the AP5Z1 knockout, asking whether the AP-5 tetramer still forms and whether the retrieval
    defect is reproduced.
  provenance:
  - reference_id: PMID:40081374
    supporting_text: While it is still unclear whether deleterious variants in AP5S1 are associated with
      disease, population-based estimates suggest that such events would be extremely rare.
  - reference_id: PMID:40081374
    supporting_text: It is plausible that future studies will identify causative variants in the fourth
      component of the AP-5 complex, AP5S1, and associate it with a similar human phenotype.
  - *id030
- gap_statement: Whether the reduction in homologous recombination on sigma-5 knockdown reflects a direct
    role or a downstream consequence of disrupted endolysosomal traffic has never been tested.
  boundary: 'Established: two independent esiRNAs against C20orf29 reduced recombination in the DR-GFP
    reporter. Also established: in the same experiment, knockdown of two other members of the same complex
    had no effect; the protein localises to late endosomes and lysosomes, not to the nucleus; and no follow-up
    in fifteen years has connected AP-5 to DNA repair.'
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: The claim is currently annotated twice on this gene, once as IMP and once electronically
    from the family signature, and the electronic route carries it to all members of the family across
    eukaryotes.
  resolution: Re-test recombination in AP5S1-null cells with cell-cycle and proliferation controls, and
    ask whether a separation-of-function allele that leaves the complex intact but blocks membrane recruitment
    also affects repair.
