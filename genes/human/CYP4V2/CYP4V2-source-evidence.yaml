primary_evidence:
- reference: PMID:19661213
  url: https://pubmed.ncbi.nlm.nih.gov/19661213/
  doi: 10.1124/dmd.109.028530
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC2774980/
  repository_cache: ../../../publications/PMID_19661213.md
  read_scope: Complete fetched Methods/Results/Discussion. Original HTML retrieval returned
    a challenge and publisher PDF returned 403; actual Table 1 values and figure pixels were
    not recovered.
  construct: Full coding human CYP4V2 with C-terminal His tag, expressed in Sf9. Reconstitution
    uses P450 reductase/cytochrome b5/NADPH.
  reaction: Laurate, myristate and palmitate yield terminal hydroxy products; the reported
    catalytic-efficiency order favors myristate. C8 turnover was not detected.
  scope_limit: The paper calls C14 medium-chain, but current GO long-chain activity spans
    C13–C22. The medium-chain GO term covers the positive C12 substrate, not every member
    of its class.
- reference: PMID:22772592
  url: https://pubmed.ncbi.nlm.nih.gov/22772592/
  doi: 10.1124/mol.112.080085
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC3463217/
  repository_cache: ../../../publications/PMID_22772592.md
  read_scope: 'Complete fetched Methods/Results/Discussion; genuine original HTML captions;
    Figure 5 pixels. Supplemental localization Figure 1 not inspected: requested PDF returned
    a download/challenge HTML page.'
  construct: Full coding human CYP4V2 with C-terminal His tag. Purified protein is reconstituted
    with reductase and cytochrome b5 (1:2:1) and NADPH.
  reaction: Figure 5 compares CYP4F3B-generated reference products, minus-NADPH controls and
    plus-NADPH CYP4V2. It shows 20-hydroxy-EPA and 22-hydroxy-DHA plus smaller 19-hydroxy-EPA
    and 21-hydroxy-DHA products.
  quantitation_limit: Terminal products quantified using saturated same-chain hydroxy-fatty-acid
    standards. Omega-1 products were not quantified separately; complete kinetic parameters
    and physiological flux are not established.
  localization: Native ARPE-19 CYP4V2 staining colocalizes with calreticulin in the reported
    Results. Antibody specificity against other CYP4 proteins was tested; ocular tissue staining
    is distinct from native membrane topology.
  variant_limit: H331P-transduced HepG2 cells have reduced CYP4V2 protein and altered PUFA
    pools. This is not a matched per-enzyme activity measurement or proof of the full retinal
    disease mechanism.
- reference: PMID:28514442
  url: https://pubmed.ncbi.nlm.nih.gov/28514442/
  repository_cache: ../../../publications/PMID_28514442.md
  read_scope: Complete selected clone-construction and AP-MS Methods, plus exact target IntAct
    records.
  assay: C-terminal HA/FLAG bait clones, anti-HA purification and mass spectrometry. IntAct
    assigns this CYP4V2–GATC record to HEK293T.
  limit: Association does not establish direct binary binding, retinal function or a CYP4V2
    role in mitochondrial tRNA amidation.
