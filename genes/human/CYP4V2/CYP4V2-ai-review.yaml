id: Q6ZWL3
gene_symbol: CYP4V2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP4V2 is a heme-containing cytochrome P450 associated with the endoplasmic reticulum.
  It uses oxygen and electrons supplied by cytochrome P450 reductase to hydroxylate fatty
  acids, including laurate, myristate, palmitate, eicosapentaenoate and docosahexaenoate.
  Terminal hydroxylation predominates, with smaller penultimate-carbon products observed for
  the polyunsaturated substrates. CYP4V2 is expressed in several tissues, including retinal
  pigment epithelium and cornea. Biallelic pathogenic variants cause Bietti crystalline dystrophy;
  its fatty-acid chemistry may contribute to retinal lipid homeostasis, although the decisive
  endogenous substrate and disease mechanism remain incompletely resolved.
alternative_products:
- name: '1'
  id: Q6ZWL3-1
  description: Displayed 525-residue product. The functional studies used full coding constructs
    with C-terminal purification tags; those constructs do not establish equivalent activity
    of the shorter natural splice product.
- name: '2'
  id: Q6ZWL3-2
  sequence_note: VSP_014918
  description: The 503-residue product lacks displayed-sequence residues 42–63, as specified
    by VSP_014918 and confirmed by the official alternative sequence. Its catalytic activity,
    localization and physiological contribution were not separately established by the inspected
    experiments.
