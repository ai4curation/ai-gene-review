  - InterPro:IPR002319
  review:
    summary: Aminoacyl-tRNA ligase activity is true but subsumed by accepted phenylalanine-tRNA ligase
      activity.
    action: TOO_GENERAL
    reason: 'IPR002319 is an actual O95363 domain match and maps to this activity; direct human enzyme
      assays establish GO:0004826 phenylalanine-tRNA ligase activity (PMID:10329163; PMID:19549855),
      an accepted strict descendant of GO:0004812. The broad activity is therefore TOO_GENERAL. ARBA00026908
      also has GO:0004812 as a consequent, but the retrieved current rule does not establish which
      complete condition set matched O95363: the superficially related two-FunFam clause contains
      FF000053 whereas the target record has FF000041. This term-level subsumption judgment preserves
      that unresolved source limit and does not claim independent reproduction of the ARBA clause.
      GO_REF:0000120 combines methods and is not a new experiment.'
    supported_by:
