- term:
    id: GO:0004826
    label: phenylalanine-tRNA ligase activity
  evidence_type: IDA
  original_reference_id: PMID:10329163
  qualifier: enables
  review:
    summary: FARS2 catalyzes ATP-dependent phenylalanyl-tRNA formation.
    action: ACCEPT
    reason: PMID:10329163 directly assayed purified recombinant human mitochondrial PheRS by ATP:pyrophosphate
      exchange and radiolabeled phenylalanine incorporation into tRNA. Results and Table 1 establish
      amino acid activation and tRNA charging by a monomeric enzyme. The expressed construct used
      a predicted mitochondrial processing boundary; no natural isoform or experimentally mapped
      cleavage site is inferred.
    supported_by:
    - reference_id: PMID:10329163
- term:
    id: GO:0004826
    label: phenylalanine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004530
  - RHEA:19413
  - EC:6.1.1.20
  review:
    summary: The merged electronic sources identify the experimentally established phenylalanine-tRNA
      ligase reaction.
    action: ACCEPT
    reason: The actual IPR004530 target match, RHEA:19413 and EC:6.1.1.20 agree on ATP-dependent
      esterification of phenylalanine to tRNA(Phe), producing AMP and diphosphate. Direct human mitochondrial
      enzyme assays in PMID:10329163 and PMID:19549855 support this reaction. The combined mapping
      is retained as one source context; it does not establish editing or deacylation activity.
    supported_by:
    - reference_id: GO_REF:0000120
    - reference_id: PMID:10329163
    - reference_id: PMID:19549855
