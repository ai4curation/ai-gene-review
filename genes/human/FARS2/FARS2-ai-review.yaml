  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read the original article PDF through web extraction and author-uploaded text;
      local HTTP PDF retrieval failed with 403 and is preserved as a failed body, not represented
      as a PDF. Read functional-analysis Results, Tables 1–3 including human mitochondrial tRNA substrate
      in Table 3, and aminoacylation/ATP:pyrophosphate-exchange Methods. Wild-type recombinant human
      FARS2 provides direct enzyme evidence alongside disease variants. The absence of a mitochondrial
      translation defect in patient fibroblasts is reported and is not generalized to other tissues.
      Normal cache is abstract-only; no natural isoform assignment is made.
