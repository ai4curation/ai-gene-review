  review:
    summary: Nucleotide binding is true but subsumed by the accepted ATP-binding activity.
    action: TOO_GENERAL
    reason: O95363 matches mitochondrial PheRS family IPR004530 at residues 225–446. ATP-dependent
      amino acid activation and tRNA charging by recombinant human mitochondrial PheRS support this
      nucleotide-binding mapping (PMID:10329163; PMID:19549855). The accepted GO:0005524 ATP binding
      is a strict descendant of GO:0000166 and supplies the relevant nucleotide specificity. TOO_GENERAL
      records that the broad claim is true but subsumed; it does not reject the electronic source.
    supported_by:
