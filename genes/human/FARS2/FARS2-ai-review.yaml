references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official method describes InterPro-to-GO transfer. For all six owned contexts,
      the actual O95363 response verifies IPR002319 matches at 76–198 and 242–343 and IPR004530 at
      225–446, with their exact GO mappings. Direct human biochemistry supports substrate binding
      and catalysis; cytoplasm includes mitochondria. IPR004530 still carries obsolete GO:0006432,
      for which official QuickGO supports the reviewed process refinement. The method title is provenance,
      not gene-specific experimental evidence.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official method describes curator ortholog transfer from experimentally verified
      source annotations. Both FARS2 contexts name rat Q6AYQ3. Its mitochondrial evidence is experimental
      (PMID:26553276; rat Fars2/COXIV colocalization), but its matrix statement is curator inference
      ECO:0000305 and its current matrix GO row is electronic. Both locations are retained biologically,
      with the matrix assignment explicitly inferential and corroborated by the Reactome target route.
      The general method title does not certify that a matrix-specific donor assay was performed.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official PAINT method and actual PTHR11538 tree, MSA and IBD file were examined
      for all four FARS2 IBA contexts. Target O95363 is PTN002480027/SF41; the ungapped MSA equals
      the 451-residue official sequence. PTN000165932 supplies Phe ligase (2023-01-10), aminoacylation
      (2025-09-02) and cytoplasm (2026-05-28); PTN000165999 supplies mitochondrion (2026-05-28).
      All nodes are on the actual ancestry path. The PTN000711660 loss annotations and PTN000165935
      cytosolic complex lie off-path. Target self-WITH is legitimate experimental descendant evidence.
      Human biochemistry supports catalysis; rat localization supports the mitochondrial clade. The
      obsolete process term is refined from official QuickGO, not rejected as an unsound ancestral
      placement.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official method maps UniProt subcellular-location vocabulary to GO. The sole
      FARS2 context maps SL-0170 to mitochondrial matrix. The inspected human record inherits this
      location from rat Q6AYQ3, whose matrix statement is curator inference; PMID:26553276 measures
      mitochondrion rather than matrix. The mapping is scientifically retained as an inferred placement,
      consistent with mitochondrial tRNA aminoacylation and the explicit Reactome O95363 matrix entity.
      This method is not an independent localization experiment.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The official method merges identical electronic annotations from multiple methods.
      All three FARS2 contexts were traced: actual IPR002319 supports broad aminoacyl-tRNA ligase;
      actual IPR004530, RHEA:19413 and EC:6.1.1.20 support Phe ligase; rat Q6AYQ3, its Ensembl protein
      and SL-0173 provide related mitochondrial transfers/mappings. Current ARBA00026908 has the
      broad ligase consequent, but exact target eligibility under a complete rule clause was not
      reproduced (the two-FunFam clause uses FF000053 whereas O95363 lists FF000041). Human enzyme
      assays independently support the function. Rat mitochondrial localization has PMID:26553276
      experimental grounding. These merged sources are not counted as independent experiments.'
- id: PMID:10329163
  title: Expression and characterization of a human mitochondrial phenylalanyl-tRNA synthetase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Original identifier/title and recovered author-uploaded full text checked. Read
      expression and monomer characterization, ATP:pyrophosphate exchange, tRNA-charging Results
      and Table 1, plus operative Methods/Materials (original lines 1836–2302): human cDNA, a PSORT-predicted
      mature His-tagged construct, E. coli expression, purification, radiolabeled phenylalanine/tRNA
      charging, and oligomer-state methods. The recombinant human enzyme is distinct from the bacterial
      and bovine mitochondrial tRNA substrates. Targeting and cleavage were predicted, not mapped
      experimentally, and the substrate species and expression host do not establish cellular matrix
      residence. The normal cache is abstract-only; recovered original text and precise access limits
      are documented in the source guide.'
- id: PMID:19549855
  title: Eukaryotic cytosolic and mitochondrial phenylalanyl-tRNA synthetases catalyze the charging
    of tRNA with the meta-tyrosine.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read the complete cached original main text, including Introduction, Results, Discussion
      and Methods. Human mitochondrial monomer and human cytosolic heterotetramer are distinct enzymes;
      the cytosolic enzyme is not a cytosolic FARS2 product. Human mitochondrial PheRS directly charges
      phenylalanine and meta-tyrosine in ATP-dependent assays using E. coli or yeast tRNA. Substrate
      species do not localize the human protein. In-vitro alternative-substrate activity does not
      establish a protective cellular role, and cytosolic/bacterial editing findings are not transferred
      to FARS2. Cached figure sections contained headings without captions; figure pixels and supplements
      were not inspected.
- id: PMID:22833457
