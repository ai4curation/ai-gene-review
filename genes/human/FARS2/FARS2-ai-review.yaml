knowledge_gaps:
- gap_statement: The extent to which FARS2-dependent meta-tyrosyl-tRNA formation contributes to incorporation
    of meta-tyrosine into mitochondrially encoded proteins in living human cells is not established
    by the available enzyme experiments.
  boundary: PMID:19549855 directly demonstrates meta-tyrosine activation, tRNA charging and substrate
    binding by human mitochondrial PheRS in vitro. Its charging assays use bacterial or yeast tRNA
    substrates; the proposed contribution to mitochondrial protein misincorporation is an inference
    rather than a measurement of FARS2-dependent incorporation in human cells.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: This distinguishes an alternative-substrate property of the enzyme from a physiological
    route of mitochondrial protein damage.
  resolution: Measure meta-tyrosylated mitochondrial tRNA(Phe) and newly synthesized mitochondrial
    proteins in human cells while resolving FARS2 dependence and controlling amino-acid pools and
    mitochondrial translation.
  provenance:
  - reference_id: PMID:19549855
suggested_experiments:
- hypothesis: FARS2 can contribute to meta-tyrosine incorporation into mitochondrial translation
    products when the available meta-tyrosine pool increases.
  description: In human cells, measure amino acids recovered from purified mitochondrial tRNA(Phe)
    and use targeted mass spectrometry on newly synthesized mitochondrially encoded proteins under
    basal and defined oxidative-stress conditions. Compare controlled FARS2 depletion and wild-type
    rescue, with mitochondrial translation output, free amino-acid pools, direct protein oxidation
    and cytosolic contamination measured as controls. Isotopic substrate tracing should distinguish
    incorporation during translation from oxidation of phenylalanine residues after synthesis.
  experiment_type: Cellular aminoacyl-tRNA analysis and isotope-resolved mitochondrial proteomics
