id: O95363
gene_symbol: FARS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FARS2 encodes a monomeric mitochondrial phenylalanyl-tRNA synthetase. It activates L-phenylalanine
  with ATP and transfers the amino acid to mitochondrial tRNA(Phe), providing charged tRNA for mitochondrial
  protein synthesis. Its catalytic and anticodon-binding regions are contained within one polypeptide.
  Unlike the cytosolic phenylalanyl-tRNA synthetase, it lacks an editing domain and can also charge
  meta-tyrosine, an oxidized phenylalanine derivative, in vitro. Biallelic pathogenic FARS2 variants
  cause neurological disease, including early-onset mitochondrial encephalopathy.
existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IDA
  original_reference_id: PMID:10329163
  qualifier: enables
  review:
    summary: Human mitochondrial phenylalanyl-tRNA synthetase recognizes tRNA as its aminoacylation
      substrate.
    action: ACCEPT
    reason: The purified human enzyme charged tRNA(Phe), and substrate-dependent steady-state kinetics
      were measured in PMID:10329163 (Results, enzymatic properties; Table 1; Methods, aminoacylation
      assays). These are functional tRNA-recognition assays, not a measured equilibrium binding constant.
      They support the existing substrate-binding annotation together with its cognate ligase activity.
    supported_by:
    - reference_id: PMID:10329163
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002319
  review:
    summary: FARS2 binds the tRNA substrate during phenylalanyl-tRNA synthesis.
    action: ACCEPT
    reason: The actual O95363 InterPro matches include IPR002319 at residues 76–198 and 242–343.
      Its tRNA-binding mapping agrees with purified human mitochondrial PheRS aminoacylation assays
      in PMID:10329163 and PMID:19549855. This is substrate recognition by the enzyme, not an unrelated
      RNA-binding function.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:10329163
    - reference_id: PMID:19549855
