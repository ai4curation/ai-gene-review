core_functions:
- description: Catalyzes ATP-dependent charging of mitochondrial tRNA(Phe) with L-phenylalanine,
    supplying aminoacylated tRNA for mitochondrial protein synthesis. Its mitochondrial matrix placement
    is inferred from curated localization and the mitochondrial tRNA-charging reaction; the localization
    experiments establish mitochondrion without resolving the matrix.
