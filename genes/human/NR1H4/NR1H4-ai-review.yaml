- term:
    id: GO:0010903
    label: negative regulation of very-low-density lipoprotein particle remodeling
  evidence_type: IDA
  original_reference_id: PMID:27471003
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'Negative regulation of very-low-density lipoprotein particle remodeling.'
    action: MODIFY
    reason: The biology is right but the term is the wrong process. GO:0034372 very-low-density lipoprotein particle remodeling is defined as acquisition, loss or modification of protein or lipid within a VLDL particle, including triglyceride hydrolysis by hepatic or lipoprotein lipase - that is, post-secretory processing in plasma. The citing study instead measured hepatic VLDL-TG secretion, repressed through SHP-mediated suppression of HNF4A-driven PLA2G12B. FXR's recorded effects on actual remodeling would run the other way, since it induces APOC2 and represses the lipase inhibitors APOC3 and ANGPTL3, all of which raise lipoprotein lipase activity. GO has no regulation-of-VLDL-assembly term, so the replacement is the lateral triglyceride homeostasis term this entry already carries; the missing term is recorded in proposed_new_terms.
    proposed_replacement_terms:
    - id: GO:0070328
      label: triglyceride homeostasis
    supported_by:
    - reference_id: PMID:27471003
      supporting_text: PLA2G12B expression was transcriptionally repressed due to an FXR-mediated up-regulation of small heterodimer partner (SHP) which functionally suppresses HNF-4
    - reference_id: PMID:27471003
      supporting_text: CDCA treatment lowered hepatic VLDL-TG secretion
    - reference_id: file:human/NR1H4/NR1H4-uniprot.txt
      supporting_text: Also reduces triglyceride clearance by inhibiting expression of ANGPTL3 and APOC3
      record_section: &id018
      - CC:FUNCTION
