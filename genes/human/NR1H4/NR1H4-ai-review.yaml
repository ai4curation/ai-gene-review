suggested_questions:
- question: Does FXR positively regulate interleukin-17 production, as GO:0032740 asserts by IDA from PMID:21242261? The direction is opposite to everything else that study reports, and IL-17 does not appear in its abstract. Which cell type and readout supports it, and is the effect context-specific?
- question: Which of the two feedback arms - hepatic SHP or intestinal FGF19 - dominates CYP7A1 repression in human physiology, and does the liver/intestine split of FXRalpha1 and FXRalpha2 isoforms determine that division of labour rather than merely accompany it?
- question: The four-residue hinge insert changes FXR response-element affinity and made SDC1 induction isoform-specific. Which other FXR targets are insert-selective, and should isoform-restricted targets be annotated with an isoform field rather than to the gene as a whole?
- question: "FXR's recorded effects on triglyceride-rich lipoproteins point in both directions: it lowers VLDL output via SHP, MTTP and PLA2G12B, yet raises lipoprotein lipase activity by inducing APOC2 and repressing APOC3 and ANGPTL3. Which effect dominates in vivo, and at which step should the lipoprotein annotations sit?"
suggested_experiments:
- hypothesis: The hepatic SHP arm and the intestinal FGF19 arm make separable contributions to CYP7A1 repression, and their relative weight is set by which FXR isoform is expressed.
  description: In human liver and intestinal organoids, and in primary human hepatocytes, deplete NR0B2 and FGF19 separately and together in the presence of a defined FXR agonist, and measure CYP7A1 transcription and 7-alpha-hydroxy-4-cholesten-3-one output. Repeat in cells expressing a single FXR isoform (FXRalpha1 or FXRalpha2, with and without the hinge insert) from a defined promoter to test whether isoform identity, rather than tissue context alone, sets which arm carries the repression.
  experiment_type: loss of function with isoform complementation
- hypothesis: FXR activation lowers hepatic VLDL assembly and secretion rather than modulating post-secretory VLDL remodeling, so the process annotation on GO:0010903 is misplaced.
  description: 'In primary human hepatocytes treated with CDCA or a synthetic agonist, separate the two processes: measure nascent apoB100 lipidation and VLDL particle secretion rate by pulse-chase and density gradient, and in parallel measure lipoprotein-lipase-mediated triglyceride hydrolysis of isolated VLDL particles. If secretion falls while remodeling of existing particles is unchanged or accelerated, the remodeling annotation should be replaced by a regulation-of-assembly term.'
  experiment_type: pulse-chase and in vitro lipolysis
- hypothesis: The IL-17 result attributed to FXR is cell-type-restricted rather than a general positive effect on IL-17 production.
  description: Treat sorted human CD4 T cell subsets, CD14 monocytes, dendritic cells and lamina propria mononuclear cells with an FXR agonist under matched activation conditions and measure IL-17A, IL-17F, TNF and IFN-gamma by ELISA and intracellular cytokine staining, with FXR knockdown as the specificity control. This resolves whether the positive IL-17 annotation reflects one cell type or contradicts the anti-inflammatory programme.
  experiment_type: cell-type-resolved cytokine profiling
