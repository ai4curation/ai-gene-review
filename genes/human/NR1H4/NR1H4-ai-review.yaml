    supporting_text: We demonstrate that FXR directly regulates expression of fibroblast growth factor-19
  - reference_id: PMID:12815072
    supporting_text: FGF-19 strongly suppresses expression of CYP7A1 in primary cultures of human hepatocytes and mouse liver through a c-Jun N-terminal kinase (JNK)-dependent pathway
  - reference_id: file:human/NR1H4/NR1H4-uniprot.txt
    supporting_text: In the liver activates transcription of the corepressor NR0B2 thereby indirectly inhibiting CYP7A1 and CYP8B1
    record_section:
