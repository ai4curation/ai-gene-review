      supporting_text: resulted in both induction of SDC1 mRNA and enhanced binding, internalization, and degradation of low density lipoprotein
    - reference_id: file:human/NR1H4/NR1H4-uniprot.txt
      supporting_text: VLDLR and SDC1 (involved in the hepatic uptake of LDL and IDL remnants), and inhibiting expression of MTTP
