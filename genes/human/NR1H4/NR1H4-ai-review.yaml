  - reference_id: PMID:10334993
    supporting_text: these bile acids and their conjugates modulated interaction of FXR with a peptide derived from steroid receptor coactivator 1
  - reference_id: PMID:30275017
    supporting_text: form a heterodimer that controls the expression of numerous downstream genes
  - reference_id: file:human/NR1H4/NR1H4-uniprot.txt
    supporting_text: The FXR-RXR heterodimer binds predominantly to farnesoid X receptor response elements (FXREs) containing two inverted repeats of the consensus sequence 5'-AGGTCA-3'
    record_section:
    - CC:FUNCTION
- description: "Negative feedback on bile-acid synthesis. Ligand-bound FXR represses the rate-limiting CYP7A1 and the branch-point CYP8B1 indirectly, through two tissue-specific induced intermediaries: hepatic NR0B2/SHP, and intestinal FGF19 acting on hepatic FGFR4/beta-Klotho. Because the repression is mediated, the gene's own direct activity here is still transactivation; the process-level claim is regulation of bile-acid synthesis, which is why this is recorded as a separate core function from the receptor activity above."
