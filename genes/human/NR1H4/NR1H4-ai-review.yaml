    supporting_text: In the intestine activates FGF19 expression and secretion leading to hepatic CYP7A1 repression
    record_section:
    - CC:FUNCTION
- description: Transcriptional control of bile-acid conjugation, export and hepatic reuptake. The same receptor activity induces SLC27A5 and BAAT (conjugation), ABCB11/BSEP, ABCC2 and ABCB4 (biliary export, with direct CARM1 recruitment at the BSEP FXRE) and the detoxifying UGT2B4 and SULT2A1, while repressing SLC10A1/NTCP. Setting synthesis, conjugation, export and reuptake from one sensor is what makes the gene the regulatory layer of the enterohepatic bile-salt cycle rather than one regulator among several.
