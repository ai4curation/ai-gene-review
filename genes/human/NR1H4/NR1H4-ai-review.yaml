proposed_new_terms:
- proposed_name: regulation of very-low-density lipoprotein particle assembly
  proposed_definition: Any process that modulates the frequency, rate or extent of very-low-density lipoprotein particle assembly, the assembly of a VLDL particle from its apolipoprotein and lipid components prior to secretion.
  justification: GO has very-low-density lipoprotein particle assembly (GO:0034379) but no regulation term beneath it, while it does have regulation terms for VLDL particle remodeling and clearance. Curators reporting an effect on hepatic VLDL output therefore have nowhere correct to annotate and reach for the remodeling term instead, which denotes post-secretory lipolytic processing of the particle in plasma - a different process, and in this gene's case one whose sign runs the other way. That is the mis-annotation this review records on GO:0010903. A signed child (negative regulation of ...) would also be needed.
  proposed_parent:
    id: GO:0034379
    label: very-low-density lipoprotein particle assembly
  supported_by:
  - reference_id: PMID:27471003
    supporting_text: CDCA treatment lowered hepatic VLDL-TG secretion
  - reference_id: PMID:27471003
    supporting_text: PLA2G12B expression was transcriptionally repressed due to an FXR-mediated up-regulation of small heterodimer partner (SHP) which functionally suppresses HNF-4
- proposed_name: regulation of bile acid and bile salt transport
  proposed_definition: Any process that modulates the frequency, rate or extent of bile acid and bile salt transport, the directed movement of bile acids and bile salts into, out of or within a cell, or between cells.
  justification: 'GO has bile acid and bile salt transport (GO:0015721) but no regulation term beneath it, so a transcription factor that sets the expression of the transporters cannot be annotated to what it actually does. The consequence is visible on this gene: FXR carries GO:0015721 with an involved_in qualifier, asserting that the receptor participates in transport, when it induces ABCB11, ABCC2 and ABCB4 and represses SLC10A1 and transports nothing itself. The same gap will affect NR0B2, NR1I2 and other regulators of the enterohepatic transporters.'
  proposed_parent:
    id: GO:0015721
    label: bile acid and bile salt transport
