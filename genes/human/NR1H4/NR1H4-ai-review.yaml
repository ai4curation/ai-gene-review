- term:
    id: GO:0032740
    label: positive regulation of interleukin-17 production
  evidence_type: IDA
  original_reference_id: PMID:21242261
  qualifier: involved_in
  review:
    summary: 'Positive regulation of interleukin-17 production (IDA).'
    action: UNDECIDED
    reason: 'Cannot be adjudicated from what is accessible, and the direction is contradicted by the citing source''s own summary of the same paper. UniProt''s curated FUNCTION block cites PubMed:21242261 for the statement that FXR down-regulates inflammatory cytokine expression in several types of immune cells, and the two sibling GOA rows created by UniProt from this paper in the same session (2016-01-19) are both negative regulation terms (GO:0032689 type II interferon, GO:0032720 TNF). The paper''s own stated conclusion is that FXR activation inhibits proinflammatory cytokine production. IL-17 appears nowhere in the abstract, nor in its MeSH terms, nor in the 16-citation deep-research report for this gene. The full text could not be read: the paper is not in PMC and Europe PMC and the publisher both refused access, so whether an IL-17 panel was assayed and in which cell type is unknown. The study did run ELISA cytokine panels on human peripheral blood mononuclear cells, CD14 monocytes, dendritic cells and IBD lamina propria mononuclear cells, so a real context-specific positive effect in one of those cannot be excluded. Left UNDECIDED rather than removed, per the rule against overruling an experimental annotation whose full text has not been read, with the contradiction recorded as a suspected source defect for UniProt to check.'
    supported_by:
    - reference_id: PMID:21242261
      supporting_text: FXR activation inhibits proinflammatory cytokine production in vivo in the mouse colonic mucosa, and ex vivo in different immune cell populations
    - reference_id: PMID:21242261
      supporting_text: Fxr activation in intestines of WT mice and differentiated enterocyte-like cells downregulates expression of key proinflammatory cytokines and preserves epithelial barrier function
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: 'UniProtKB:Q96RI1 GOA row: GO:0032740 involved_in, IDA, PMID:21242261, assigned by UniProt 2016-01-19'
      slot: GO term
      requested_change: CHECK
      asserted_value: GO:0032740 positive regulation of interleukin-17 production
      corrected_value: GO:0032703
      corrected_label: negative regulation of interleukin-17 production
      cause: OTHER
      confidence: SUSPECTED
      explanation: The sign appears inverted. UniProt curated this paper into its own FUNCTION block as down-regulation of inflammatory cytokine expression, and created two negative-regulation GO rows from it in the same session, so this positive row contradicts both the prose and its siblings within one resource. If the paper did measure IL-17, the expected term is the negative counterpart; if it did not, the row should be removed. A curator with full-text access can settle which. Flagged rather than corrected here because the full text is paywalled and not in PMC, so the alternative that FXR genuinely raises IL-17 in one assayed cell population cannot be excluded from outside.
      report_status: NOT_REPORTED
      supported_by:
      - reference_id: file:human/NR1H4/NR1H4-uniprot.txt
        supporting_text: Down-regulates inflammatory cytokine expression in several types of immune cells including macrophages and mononuclear cells
        record_section:
        - CC:FUNCTION
      - reference_id: PMID:21242261
        supporting_text: FXR activation inhibits proinflammatory cytokine production in vivo in the mouse colonic mucosa, and ex vivo in different immune cell populations
