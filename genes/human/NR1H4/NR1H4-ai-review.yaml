    action: KEEP_AS_NON_CORE
    reason: "Real and directly assayed in human hepatocytes, but mediated: FXR induces SDC1, and the proteoglycan does the LDL binding and internalisation. A downstream lipoprotein effect of the transcriptional programme rather than part of the receptor's core bile-acid function. Note the citing study found this to be isoform-specific, limited to the FXR isoforms lacking the four-residue hinge insert."
    supported_by:
