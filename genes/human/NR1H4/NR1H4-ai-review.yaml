core_functions:
- description: 'Bile-acid-activated nuclear receptor: binds bile acids in its ligand-binding domain and, as an RXRA heterodimer bound to inverted-repeat FXR response elements, activates transcription of target genes by RNA polymerase II. This single ligand-dependent activity is the source of every other function recorded for the gene.'
