id: Q96RI1
gene_symbol: NR1H4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NR1H4 (FXR, the bile acid receptor) is the nuclear receptor that senses intracellular bile acids and converts that signal into a coordinated transcriptional programme. Bile acids - chenodeoxycholic acid most potently, then deoxycholic and lithocholic acid - bind its ligand-binding domain and promote recruitment of coactivators to the AF-2 surface. It binds DNA through a pair of C4-type zinc fingers, predominantly as a heterodimer with RXRA, at inverted-repeat FXR response elements (two AGGTCA half-sites separated by one nucleotide) in target-gene regulatory regions, and its direct action at every characterised target is transactivation. Its central output is negative feedback on its own ligand: FXR does not repress the rate-limiting bile-acid synthetic enzyme CYP7A1 directly but induces two intermediaries in two tissues - the hepatic corepressor NR0B2/SHP, which antagonises NR5A2/LRH-1 and HNF4A at the CYP7A1 and CYP8B1 promoters, and intestinal FGF19, an enterokine that signals through hepatic FGFR4 with beta-Klotho to suppress hepatic CYP7A1. In parallel it induces the genes that conjugate, export and detoxify bile acids (SLC27A5, BAAT, ABCB11/BSEP, ABCC2, ABCB4, UGT2B4, SULT2A1) and represses hepatic uptake (SLC10A1/NTCP), so that one receptor sets synthesis, conjugation, export and reuptake together. Secondary roles follow from the same transcriptional mechanism rather than from new activities: lipid and lipoprotein handling (SHP-mediated repression of SREBF1 and MTTP, induction of SDC1 and VLDLR which accelerate hepatic LDL and remnant clearance, repression of the lipoprotein lipase inhibitors APOC3 and ANGPTL3), hepatic glucose and glutamine metabolism, pancreatic beta-cell insulin secretion, and an anti-inflammatory programme in macrophages and mononuclear cells that trans-represses TLR4-induced, NF-kappaB-driven cytokine genes. Expression is split by isoform: five isoforms arise from two promoters and alternative splicing, with FXRalpha1-type isoforms predominating in liver and FXRalpha2-type in intestine and kidney, and a four-residue hinge insert that changes response-element affinity and target selectivity. Biallelic loss of function causes progressive familial intrahepatic cholestasis type 5, a severe neonatal-onset cholestasis progressing to cirrhosis, showing that the receptor is required and not compensated.'
