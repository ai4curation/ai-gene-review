- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: IMP
  original_reference_id: PMID:21757002
  qualifier: acts_upstream_of_positive_effect
  review:
    summary: 'Urea cycle.'
    action: KEEP_AS_NON_CORE
    reason: "Better supported than it first looks: FXR is required to induce N-acetylglutamate synthase, and the FXRE in the human and mouse NAGS promoters was mapped by EMSA, ChIP and reporter assay. N-acetylglutamate is the obligate activator of the cycle's first enzyme, so this is a direct-target effect rather than a diffuse metabolic correlation. Kept as non-core: FXR regulates the cycle and performs none of it, which the acts_upstream_of_positive_effect qualifier already states correctly."
    supported_by:
    - reference_id: PMID:21757002
      supporting_text: demonstrate that FXR is essential to induce the expression of NAGS
    - reference_id: PMID:21757002
      supporting_text: both human and mouse NAGS promoters contain a putative FXRE, an ER8 sequence
