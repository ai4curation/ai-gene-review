  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary PubMed/PMC13055147 identity/DOI 10.1523/JNEUROSCI.1186-25.2026 verified; actual
      recovered HTML Methods/Results/Discussion read. Mouse RiboTag profiling and developmental Alk
      deletion show reduced taste-bud/innervation measures without geniculate-neuron loss. Separate
      adult ceritinib treatment causes neuronal atrophy/death. The Discussion explicitly acknowledges
      potent INSR/IGF1R inhibition and their ganglion expression as possible contributors to the stronger
      drug phenotype; drug effects are not cleanly equated with Alk deletion. These are mouse contexts,
      not direct human developmental assays. The extraction has inconsistent drug-dose units between
      Methods and Results; no corrected dosing protocol is inferred.
core_functions:
- description: ALK binds extracellular ALKAL cytokines and assembles a signaling receptor complex at the
    plasma membrane, coupling ligand recognition to ATP-dependent tyrosine autophosphorylation and intracellular
    signaling. Experimentally tested heparin binding can modulate this receptor mechanism. Human ALKAL2 is a potent activator;
    ALKAL1 responses depend on ligand preparation and assay conditions. Receptor self-association and
    kinase activity are integrated here without imposing one universal complex stoichiometry or assigning
    a separate noncovalent kinase-activator function.
