  review:
    summary: Represent ALKAL ligand recognition as cytokine binding.
    action: MODIFY
    reason: The source directly measures binding of human ALK to FAM150A/B (ALKAL1/2). Purified human FAM150A
      binds the human ALK extracellular domain by ELISA and surface plasmon resonance, and both ligands
      associate in reciprocal immunoprecipitations. The independent human receptor structures in PMID:34646012
      identify their cytokine-binding interface. GO:0019955 therefore preserves the measured ligand-binding
      function and the named IPI partner; replacing it with kinase catalysis would lose that information
      and duplicate an already retained function. This does not assert equal physiological potency of the
      two cytokines.
