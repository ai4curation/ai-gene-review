id: Q9UM73
gene_symbol: ALK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALK is a single-pass cell-surface receptor tyrosine kinase whose extracellular domain binds
  ALKAL cytokines and heparin. Ligand-dependent receptor assembly promotes ATP-dependent tyrosine autophosphorylation
  and recruitment of intracellular signaling proteins, connecting extracellular signals to MAPK, PI3K
  and other context-dependent pathways. Human receptor structures and cellular assays establish ALKAL2-driven
  activation and condition-dependent activation by ALKAL1. Developmental and neuronal roles are supported
  by vertebrate models; mouse hypothalamic ALK also regulates energy expenditure and adipose lipid mobilization.
  Activating mutations and fusions deregulate the kinase in neuroblastoma and other cancers, but fusion
  proteins can differ substantially from the normal receptor in localization and ligand dependence.
