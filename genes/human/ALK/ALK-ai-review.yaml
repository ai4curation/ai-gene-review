- id: PMID:23667670
  title: Anaplastic lymphoma kinase is required for neurogenesis in the developing central nervous system
    of zebrafish.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary PubMed/PMC3648509 identity/DOI 10.1371/journal.pone.0063757 verified; actual
      recovered XML Methods/Results read. Full-length zebrafish alk, heat-shock transgenes, morpholinos
      with mismatch/splicing and p53 controls, and inhibitor experiments distinguish progenitor formation,
      neuronal differentiation, survival and positioning. Overexpression increases pERK/proliferation
      and disrupts neuronal positioning; knockdown increases cell death and reduces proneural expression
      without reducing the measured 24-hour hindbrain mitotic/progenitor readouts. The paper leaves
      the causal ordering of differentiation failure and apoptosis unresolved. This is donor-species
      biology, not a human construct study.
- id: PMID:41771741
  title: Ribosomal Profiling of the Geniculate Ganglion Identifies the Receptor ALK as Critical for
    the Development and Maintenance of Oral Sensory Neurons.
