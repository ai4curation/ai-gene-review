- term:
    id: GO:0030298
    label: receptor signaling protein tyrosine kinase activator activity
  evidence_type: IDA
  original_reference_id: PMID:30061385
  qualifier: enables
  review:
    summary: Separate noncovalent kinase activation from ALK autophosphorylation.
    action: UNDECIDED
    reason: The 2018 study directly assays the activating ligand fragment; receptor–receptor activation
      is discussed rather than separately isolated. GO:0030298 has molecular-function-regulator ancestry
      explicitly restricting the activity to noncovalent modulation. The positive assembly/phosphorylation
      evidence does not yet distinguish an ALK-mediated noncovalent increase in another kinase domain from
      trans-autophosphorylation. Retain uncertainty rather than rejecting a genuine receptor–receptor interaction
      or asserting a separate activator core. The unresolved issue is whether receptor association itself
      allosterically increases partner catalytic activity when receptor phosphotransfer is experimentally
      separated from that association, rather than merely positioning two kinase domains for trans-phosphorylation.
      An interface-controlled reconstitution with fixed receptor phosphorylation state and independently
      measured partner substrate turnover would resolve this. The uncertainty concerns mechanism despite
      access to the full sources, not missing text; the term definition does not forbid a receptor from
      acting on another receptor.
    additional_reference_ids:
    - PMID:34646012
    - PMID:30061385
    supported_by:
    - reference_id: PMID:34646012
      supporting_text: Sites 1 and 2 correspond to receptor–cytokine interactions and site 3 describes receptor–receptor
        contacts
    - reference_id: PMID:30061385
      supporting_text: 'full-length AUG-α and the AUG-α AD deletion mutant stimulate similar

        tyrosine phosphorylation of cells expressing either ALK or LTK.'
