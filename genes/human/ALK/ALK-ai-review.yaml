- question: Can purified human ALK receptor assemblies increase kinase activity through a separable noncovalent
    mechanism, distinguished from trans-autophosphorylation, sufficient for GO:0030298?
- question: Which exact ALK-containing complex, urinary-exosome target peptides and interaction-screen
    supporting-data entries underlie the source-limited assertions retained as UNDECIDED?
- question: What does the linked Oncogene 1997;15(23):2883 erratum correct in the original ALK report,
    and does it affect any assay interpretation?
- question: Which mouse hypothalamic energy-balance and neuronal-development mechanisms are conserved
    in normal human tissues, and how do ALKAL/heparin and indirect PTN–PTPRZ routes vary by cell context?
