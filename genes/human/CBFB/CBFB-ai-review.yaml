- id: PMID:36241386
  title: Heterozygous pathogenic variants involving CBFB cause a new skeletal disorder resembling cleidocranial
    dysplasia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal metadata/abstract and selected full XML Methods/Results/Discussion were read.
      Eight subjects from five families carry heterozygous variants with skeletal features resembling cleidocranial
      dysplasia; RNA was tested in two subjects. Clinical overlap and proposed RUNX interactions do not establish
      a single molecular mechanism for every allele. The new-transcript/neomorphic proposal is distinguished from
      demonstrated RNA effects and the frozen ClinGen classification.
  full_text_unavailable: false
- id: PMID:39894570
  title: A Cryptic CBFB Deletion-Inversion Expands the Mutational Spectrum of Variants Associated With Cleidocranial
    Dysplasia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal metadata/abstract and selected full XML Methods/Results/Discussion were read.
      A mother/daughter deletion-inversion-deletion removes CBFB exons 1–2; breakpoint and RNA evidence support
      reduced expression for this structural allele. Their phenotype lacks the earlier cohort's reported developmental
      delay. The paper's introductory 187-amino-acid statement is not substituted for the reviewed canonical 182-amino-acid
      UniProt product. No universal haploinsufficiency-versus-neomorph conclusion is made.
  full_text_unavailable: false
core_functions:
- description: Stabilizes RUNX DNA-binding transcription factors and supports promoter-dependent transcriptional
    activation as the beta subunit of core-binding factor. The RUNX partner contacts DNA; CBFB contributes through
    the heterodimer interface and allosteric stabilization. Different regulatory partners can produce repression,
    so coactivator activity does not imply uniform activation at every occupied promoter.
  molecular_function:
