id: Q13951
gene_symbol: CBFB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Core-binding factor subunit beta is a non-DNA-contacting transcriptional cofactor that heterodimerizes
  with RUNX proteins. Binding stabilizes the RUNX Runt-domain conformation and enhances sequence-specific DNA binding,
  allowing promoter-dependent activation or repression. Cellular experiments also show that CBFB protects RUNX3
  from ADP-ribosylation-dependent ubiquitination and degradation. These nuclear complexes regulate developmental
  programs including hematopoiesis and skeletal development. HIV-1 Vif can recruit CBFB to stabilize an APOBEC-targeting
  ubiquitin-ligase assembly. Heterozygous pathogenic variants cause a skeletal disorder resembling cleidocranial
  dysplasia; the somatic CBFB–MYH11 leukemia fusion has distinct properties from the normal protein.
