- hypothesis: Cabin1 and HDAC9 compete for the same MEF2B surface and repress a shared set of MEF2B-bound
    enhancers.
  description: Use structure-guided MEF2B substitutions in the MEF2S hydrophobic groove, then compare Cabin1
    binding, HDAC9 binding, and reporter output from MEF2-site reporters.
