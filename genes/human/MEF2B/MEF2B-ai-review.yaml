id: Q02080
gene_symbol: MEF2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MEF2B (myocyte enhancer factor 2B) is a MADS-box MEF2-family transcription factor. Its conserved N-terminal
  MADS and MEF2 domains bind A/T-rich MEF2 DNA sites as dimers and provide a docking groove for corepressors. Human
  MEF2B structural studies with DNA and Cabin1 or HDAC9 peptides show how MEF2B recruits Cabin1 and class II histone
  deacetylases to DNA-bound MEF2 complexes, explaining repression of MEF2-dependent transcription by these cofactors.
  Compared with MEF2A, MEF2C and MEF2D, MEF2B is not a strong substrate for p38 or BMK1/ERK5 signalling in the classic
  MEF2 kinase studies.'
