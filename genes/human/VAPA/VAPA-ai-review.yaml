- term:
    id: GO:0008017
    label: microtubule binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00043642
  review:
    summary: Microtubule association is a supported ancillary property.
    action: KEEP_AS_NON_CORE
    reason: The VAPA overexpression study links inhibited lateral membrane diffusion to stable microtubule
      association and reports disruption by FFAT peptide. This supports association without making VAPA
      a motor or a primary microtubule structural subunit.
    supported_by:
    - reference_id: PMID:18713837
      supporting_text: 'Application of a FFAT peptide restored in vitro ER vesicle budding and disrupted

        VAP-microtubule association.'
