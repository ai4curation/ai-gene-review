id: Q9P0L0
gene_symbol: VAPA
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: VAPA is a tail-anchored endoplasmic-reticulum membrane adaptor and tether. Its cytoplasmic
  major sperm protein (MSP) domain recognizes FFAT-family motifs in lipid-transfer proteins and other
  partners, organizing contact sites with endosomes, Golgi and plasma membrane. VAPA supplies membrane
  anchoring and spatial recruitment, while associated proteins carry lipids or perform catalytic reactions.
  It also contributes to membrane traffic, organelle organization and signaling through context-specific
  partner complexes.
