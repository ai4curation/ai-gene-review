- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IDA
  original_reference_id: PMID:41856286
  qualifier: involved_in
  review:
    summary: VAPA partner recruitment contributes to ER organization and membrane traffic.
    action: ACCEPT
    reason: VAPA perturbation alters ER cargo segregation and membrane traffic, while FFAT-mediated interactions
      connect the ER to trafficking intermediates. The annotation captures the adaptor contribution rather
      than direct vesicle-coat or motor catalysis.
    supported_by:
    - reference_id: PMID:18713837
      supporting_text: 'Overexpression of the wild-type A isoform (VAPA) but not

        the B isoform (VAPB), inhibited ER-to-Golgi transport of membrane proteins.'
