- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:24209621
  qualifier: located_in
  review:
    summary: The ER–Golgi contact role is established, while Golgi-side residence needs topological care.
    action: KEEP_AS_NON_CORE
    reason: OSBP binds VAPA at the ER and Golgi phosphoinositides through its PH domain. A contact-site
      localization is mechanistically sound; a broad Golgi-membrane observation is retained as non-core
      without claiming that the canonical VAPA membrane anchor is inserted into Golgi rather than ER.
    supported_by:
    - reference_id: PMID:24209621
      supporting_text: 'a

        FFAT motif that interacts with the ER protein VAP-A, and a lipid transfer

        domain.'
