    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9609921
  qualifier: located_in
  review:
    summary: Retain the ancillary localization without replacing the principal ER-membrane topology.
    action: KEEP_AS_NON_CORE
    reason: The curated source reports this location or pathway-associated pool. VAPA has a cytosol-facing
      ER domain and peripheral/perinuclear membrane pools; such observations do not make the intact canonical
      protein a freely soluble cytosolic factor or establish an independent core function.
    supported_by:
    - reference_id: PMID:33124732
      supporting_text: VAP‐A, VAP‐B, and MOSPD2 are anchored in the ER membrane by a carboxyl‐terminal
        transmembrane domain with their MSP domain projecting into the cytosol.
