- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: HDA
  original_reference_id: PMID:16791210
  qualifier: located_in
  review:
    summary: ER membrane anchoring and contact-site residence are integral to VAPA function.
    action: ACCEPT
    reason: The C-terminal membrane anchor places the MSP domain in the cytosol, where FFAT-bearing partners
      form membrane contacts. Structural, biochemical and cellular studies establish this topology. An
      ER-endosome contact annotation describes the tethering assembly rather than VAPA moving wholly onto
      the endosome.
    supported_by:
    - reference_id: PMID:33124732
      supporting_text: VAP‐A, VAP‐B, and MOSPD2 are anchored in the ER membrane by a carboxyl‐terminal
        transmembrane domain with their MSP domain projecting into the cytosol.
