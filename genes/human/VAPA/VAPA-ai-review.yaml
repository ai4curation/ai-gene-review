- term:
    id: GO:0006649
    label: phospholipid transfer to membrane
  evidence_type: IDA
  original_reference_id: PMID:39106189
  qualifier: involved_in
  review:
    summary: VAPA contributes to lipid transfer and homeostasis through membrane-contact organization.
    action: ACCEPT
    reason: VAPA anchors FFAT-containing lipid-transfer proteins such as OSBP/STARD3 and thereby participates
      mechanistically in lipid movement. The transported lipid is handled by the partner, not an intrinsic
      VAPA carrier pocket. Protein-membrane adaptor activity and this biological-process participation
      are compatible; the annotation does not require VAPA to catalyze lipid synthesis.
    supported_by:
    - reference_id: PMID:24209621
      supporting_text: 'a

        FFAT motif that interacts with the ER protein VAP-A, and a lipid transfer

        domain.'
- term:
    id: GO:0006672
    label: ceramide metabolic process
  evidence_type: EXP
  original_reference_id: PMID:34688657
  qualifier: involved_in
  review:
    summary: VAPA participates in ceramide trafficking and sphingomyelin production through lipid-transfer-protein
      recruitment.
    action: ACCEPT
    reason: The VAPA–OSBP perturbation study PMID:12023275 links ER ceramide retention to reduced Golgi
      export and sphingomyelin synthesis. VAPA is a membrane-contact adaptor rather than the lipid carrier
      or sphingomyelin synthase. This supports participation in the annotated process without assigning
      intrinsic lipid-transfer chemistry. The cited CERT-mutant study observes VAP-A-positive puncta;
      the interpretation is supported jointly with the direct VAPA perturbation evidence.
    supported_by:
    - reference_id: PMID:12023275
      supporting_text: 'A fluorescent

        ceramide analogue also accumulated in these ER inclusions, and export to the

        Golgi was partially inhibited'
