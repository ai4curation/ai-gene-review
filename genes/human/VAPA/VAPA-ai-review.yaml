- term:
    id: GO:0019076
    label: viral release from host cell
  evidence_type: IDA
  original_reference_id: PMID:19515777
  qualifier: involved_in
  review:
    summary: The direction and viral-system specificity require the complete cited infection study.
    action: UNDECIDED
    reason: VAPA interacts with viral replication machinery, but both activation and suppression annotations
      occur with the same PMID. A generic virus interaction cannot resolve directionality, host/virus
      context or whether the measured step is genome replication versus release. The full experiment is
      needed; neither opposite term is automatically removed.
