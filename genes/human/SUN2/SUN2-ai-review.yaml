id: Q9UH99
gene_symbol: SUN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SUN2 (SUN domain-containing protein 2, UNC-84B) is a type II integral membrane protein of
  the inner nuclear membrane and a core component of the LINC (linker of nucleoskeleton and cytoskeleton)
  complex. Its N-terminal nucleoplasmic domain binds A-type lamins, while its coiled-coil region trimerizes
  the C-terminal SUN domain in the perinuclear space, where each SUN2 trimer binds three KASH peptides
  of outer-nuclear-membrane nesprins (SYNE1-4, KASH5), with a conserved SUN-KASH disulfide stabilizing
  the complex under tension. By tethering nesprins, SUN2 transmits mechanical force between the cytoskeleton
  and the nuclear lamina, contributing to nuclear positioning, nuclear migration along actin (TAN lines)
  and microtubules, centrosome-nucleus coupling, and cellular mechanical stiffness. Acting redundantly
  with SUN1, it is required for interkinetic nuclear migration and nucleokinesis during cortical neurogenesis
  and neuronal migration, and it contributes to telomere attachment to the nuclear envelope in meiosis.
  SUN2 is widely expressed, with high levels in heart, lung and muscle.
