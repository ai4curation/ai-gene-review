id: O60260
gene_symbol: PRKN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PRKN (Parkin, PARK2) is a 465-residue RING-between-RING (RBR) E3 ubiquitin ligase. Mutations
  in PRKN are the most common cause of autosomal recessive juvenile parkinsonism. Parkin has an N-terminal
  ubiquitin-like (Ubl) domain and four zinc-coordinating domains (RING0, RING1, IBR, RING2). It works
  as a RING/HECT hybrid: RING1 binds the E2~ubiquitin conjugate (UbcH7/UBE2L3), and ubiquitin is transferred
  via a thioester intermediate on the catalytic Cys431 in RING2. In resting cells Parkin is cytosolic
  and autoinhibited: the Ubl and RING0 domains occlude the E2-binding site and the catalytic cysteine.
  On damaged, depolarized mitochondria, PINK1 accumulates on the outer membrane and phosphorylates ubiquitin
  at Ser65. Phospho-ubiquitin recruits Parkin and promotes PINK1 phosphorylation of Ser65 in the Parkin
  Ubl, which fully releases autoinhibition. Activated Parkin ubiquitinates many outer-membrane proteins
  (mitofusins, Miro, VDAC1, TOM subunits), forming K6, K11, K48 and K63 chains. These chains are further
  phosphorylated by PINK1 in a feed-forward loop. The phospho-ubiquitin coat recruits autophagy receptors
  and drives mitophagy, while proteasomal degradation of mitofusins and Miro isolates and immobilizes
  the damaged organelle. USP30 and other deubiquitinases oppose Parkin action. Parkin also ubiquitinates
  many cytosolic and ER-associated substrates (e.g. Pael-R, PARIS/ZNF746, synphilin-1, Fbw7beta, RIPK3,
  NEMO), and these activities underlie reported roles in protection against unfolded-protein and oxidative
  stress, NF-kappaB signalling, necroptosis and synaptic function.'
