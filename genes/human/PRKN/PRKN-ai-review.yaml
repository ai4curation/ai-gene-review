core_functions:
- description: PINK1-activated RBR E3 ubiquitin ligase for damaged mitochondria. Phospho-ubiquitin binding
    and Ubl Ser65 phosphorylation by PINK1 relieve autoinhibition. Parkin then binds E2~Ub through RING1
    and transfers ubiquitin via catalytic Cys431 to outer-membrane proteins (mitofusins, Miro, VDAC1),
    building chains that mark the mitochondrion for autophagic removal.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0000423
    label: mitophagy
  - id: GO:0016567
    label: protein ubiquitination
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:19029340
    supporting_text: Here, we show that Parkin is selectively recruited to dysfunctional mitochondria
      with low membrane potential in mammalian cells.
  - reference_id: PMID:19029340
    supporting_text: After recruitment, Parkin mediates the engulfment of mitochondria by autophagosomes
      and the selective elimination of impaired mitochondria.
  - reference_id: PMID:23770887
    supporting_text: In cells, mutation of C431 eliminates Parkin-catalysed degradation of mitochondria,
      and capture of an ubiquitin oxyester confirms C431 as Parkin's cellular active site.
  - reference_id: PMID:23754282
    supporting_text: Furthermore, formation of the ubiquitin-ester depends on PINK1 phosphorylation of
      Parkin Ser-65.
  - reference_id: PMID:24751536
    supporting_text: Recombinant TcPINK1 directly phosphorylated ubiquitin and phospho-ubiquitin activated
      Parkin E3 ubiquitin ligase activity in cell-free assays.
  - reference_id: PMID:25621951
    supporting_text: We find that mitochondrial damage stimulates parkin to assemble Lys 6, Lys 11 and
      Lys 63 chains on mitochondria, and that USP30 is a ubiquitin-specific deubiquitylase with a strong
      preference for cleaving Lys 6- and Lys 11-linked multimers.
- description: Ubiquitin-dependent proteasomal degradation of substrates. Parkin ubiquitinates mitochondrial
    (Miro, mitofusins) and non-mitochondrial substrates (PARIS/ZNF746, Pael-R, Fbw7beta) for proteasomal
    turnover. This contributes to quarantine of damaged mitochondria and to neuronal survival.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22078885
    supporting_text: The phosphorylation of Miro activates proteasomal degradation of Miro in a Parkin-dependent
      manner.
  - reference_id: PMID:21376232
    supporting_text: whose levels are regulated by the ubiquitin proteasome system via binding to and
      ubiquitination by the E3 ubiquitin ligase, parkin
  - reference_id: PMID:11439185
    supporting_text: Parkin specifically ubiquitinates this receptor in the presence of ubiquitin-conjugating
      enzymes resident in the endoplasmic reticulum and promotes the degradation of insoluble Pael receptor,
      resulting in suppression of the cell death induced by Pael receptor overexpression.
  - reference_id: PMID:23858059
    supporting_text: Specifically, parkin targets the SCF substrate adapter Fbw7β for proteasomal degradation.
proposed_new_terms: []
suggested_questions:
- question: Which of the many reported non-mitochondrial Parkin substrates (PARIS, Pael-R, synphilin-1,
    Fbw7beta, RIPK3, NEMO) are physiologically relevant in human dopaminergic neurons at endogenous Parkin
    levels, compared with its mitophagy role?
- question: Is Parkin transcriptional repression of TP53 a genuine nuclear activity of Parkin or an indirect
    effect of its ligase activity?
suggested_experiments:
- hypothesis: Endogenous Parkin activity in dopaminergic neurons in vivo is predominantly mitochondrial
    and PINK1-dependent.
  description: Use ubiquitin-remnant (diGly) proteomics in iPSC-derived DA neurons from PRKN-null versus
    isogenic controls, with and without mitochondrial stress and with PINK1 knockout, to define the endogenous
    PINK1-dependent and PINK1-independent Parkin substrate repertoire.
  experiment_type: quantitative ubiquitylomics
