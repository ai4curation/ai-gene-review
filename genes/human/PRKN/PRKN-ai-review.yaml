  original_reference_id: PMID:23770887
  qualifier: enables
  review:
    summary: Parkin is an RBR (RING-between-RING) E3 ubiquitin ligase. It binds E2~Ub via RING1 and transfers
      ubiquitin through a thioester on catalytic Cys431 in RING2. It is activated by PINK1 phosphorylation
      of its Ubl and of ubiquitin at Ser65.
    action: ACCEPT
    reason: Core molecular function.
    supported_by:
    - reference_id: PMID:10973942
      supporting_text: Here, we show that Parkin is a RING-type E3 ubiquitin-protein ligase which binds
        to E2 ubiquitin-conjugating enzymes, including UbcH7 and UbcH8, through its RING-IBR-RING motif.
    - reference_id: PMID:23770887
      supporting_text: In cells, mutation of C431 eliminates Parkin-catalysed degradation of mitochondria,
        and capture of an ubiquitin oxyester confirms C431 as Parkin's cellular active site.
    - reference_id: PMID:23754282
      supporting_text: Furthermore, formation of the ubiquitin-ester depends on PINK1 phosphorylation
        of Parkin Ser-65.
    - reference_id: PMID:24751536
      supporting_text: Recombinant TcPINK1 directly phosphorylated ubiquitin and phospho-ubiquitin activated
        Parkin E3 ubiquitin ligase activity in cell-free assays.
