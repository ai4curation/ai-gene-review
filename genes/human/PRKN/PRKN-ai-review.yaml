        via K63 linkages and that the formation of these inclusions is enhanced by K63-linked ubiquitination.
    - reference_id: PMID:25621951
      supporting_text: We find that mitochondrial damage stimulates parkin to assemble Lys 6, Lys 11 and
        Lys 63 chains on mitochondria, and that USP30 is a ubiquitin-specific deubiquitylase with a strong
        preference for cleaving Lys 6- and Lys 11-linked multimers.
    - reference_id: PMID:17314283
      supporting_text: Finally, we present evidence that parkin interacts with and promotes degradation-independent
        ubiquitylation of IKKgamma/NEMO (NF-kappaB essential modifier) and TRAF2 [TNF (tumor necrosis
        factor) receptor-associated factor 2], two critical components of the NF-kappaB pathway.
