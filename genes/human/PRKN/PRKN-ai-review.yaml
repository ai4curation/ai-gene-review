  review:
    summary: Parkin forms K63-linked chains (on mitochondria, NEMO/TRAF2, synphilin-1).
    action: ACCEPT
    reason: Directly shown in several studies.
    supported_by:
    - reference_id: PMID:15728840
      supporting_text: In addition we found that parkin-mediated ubiquitination of proteins within Lewy-body-like
