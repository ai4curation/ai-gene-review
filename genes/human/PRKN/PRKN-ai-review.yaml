- term:
    id: GO:0016579
    label: protein deubiquitination
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5688426
  qualifier: involved_in
  review:
    summary: Reactome places Parkin in the "deubiquitination" pathway because it is a substrate of DUBs
      (e.g. USP8, USP30 counteract it).
    action: REMOVE
    reason: Parkin is an E3 ligase and does not carry out deubiquitination. Pathway membership as a DUB
      substrate is not participation in the process.
    supported_by:
    - reference_id: PMID:25621951
      supporting_text: We find that mitochondrial damage stimulates parkin to assemble Lys 6, Lys 11 and
        Lys 63 chains on mitochondria, and that USP30 is a ubiquitin-specific deubiquitylase with a strong
        preference for cleaving Lys 6- and Lys 11-linked multimers.
