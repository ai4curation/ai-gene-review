id: Q9H0A0
gene_symbol: NAT10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Essential nucleolar RNA cytidine acetyltransferase, the sole enzyme in
  eukaryotes that installs N4-acetylcytidine (ac4C) on RNA. It is the human ortholog
  of bacterial TmcA and yeast Kre33, and combines an N-terminal helicase/ATPase module
  with a GNAT-fold N-acetyltransferase domain, so that the reaction consumes both acetyl-CoA
  and ATP. Its established substrates are 18S rRNA, where it acetylates cytidines in
  helix 34 and helix 45 (C1842 in human) with snoRNA guidance, and serine and leucine
  tRNAs, where acetylation of C12 in the D-arm requires the adaptor THUMPD1. NAT10 is
  a constituent of the nucleolar small-subunit (SSU) processome and is required for
  early pre-rRNA cleavages and 40S subunit biogenesis; it is nucleolar in interphase
  and relocates to the midbody in telophase. Whether NAT10 also deposits ac4C on mRNA
  at physiologically meaningful levels is disputed: antibody-based and reduction-based
  base-resolution mapping report widespread, position-dependent mRNA acetylation that
  modulates translation, while an independent chemical base-resolution method finds ac4C
  essentially confined to rRNA and tRNA in human cells, detectable in mRNA only upon
  enzyme overexpression, and the two groups have published mutually contradictory reanalyses
  of each other''s data. NAT10 has also been reported to acetylate lysine residues in
  histones, microtubules and other proteins, but those assays largely used a truncated
  enzyme lacking the RNA-binding module and the in vivo relevance of a protein-lysine
  acetyltransferase activity is unresolved. The protein is overexpressed in many cancers,
  is inhibited by the small molecule remodelin, and its loss causes ribosome-biogenesis
  defects, slowed growth and cytokinesis failure.'
