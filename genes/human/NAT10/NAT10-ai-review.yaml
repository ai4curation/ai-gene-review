    supported_by:
    - reference_id: PMID:35679869
      supporting_text: Although cytidine acetylation (ac4C) within protein-coding sequences
        stimulates translation, ac4C within 5' UTRs impacts protein synthesis at the level
        of initiation.
- term:
    id: GO:0106162
    label: mRNA cytidine N-acetyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:35679869
  qualifier: enables
  review:
    summary: Base-resolution RedaC:T-seq assignment of ac4C to human mRNA, contradicted
      by an independent base-resolution method and the subject of a published dispute
      that remains unresolved.
    action: KEEP_AS_NON_CORE
    reason: 'GOA carries both sides of this question only implicitly, so it is stated
      here. Arango et al. report position-dependent ac4C in HeLa mRNA by RedaC:T-seq (PMID:35679869),
      building on antibody-based acRIP-seq (PMID:30449621). Sas-Chen et al., using chemical
      base-resolution ac4C-seq, find ac4C confined to rRNA and tRNA in human cells and
      inducible in mRNA only by enzyme overexpression (PMID:32555463, method in PMID:33772246).
      The two groups then published back-to-back reanalyses of the same data reaching
      opposite conclusions (PMID:38640895 "No evidence for ac4C within human mRNA upon
      data reassessment" versus PMID:38640896 "Detection of ac4C in human mRNA is preserved
      upon data reassessment"), and neither was retracted. This is an experimental annotation
      whose full text I have not read, so it is kept, not removed; but it is not core while
      the substrate class itself is contested, in contrast to the 18S rRNA and tRNA activities,
      which are not in doubt. A sizeable 2025-2026 disease literature (e.g. PMID:41956987,
      PMID:42315153, PMID:42592486) asserts NAT10-dependent mRNA ac4C on named transcripts
      using the contested assay class without engaging the dispute; it adds volume, not
      independent methodological support.'
    supported_by:
    - reference_id: PMID:35679869
      supporting_text: 'Acetylation further directly impedes initiation at optimal AUG
        contexts: ac4C within AUG-flanking Kozak sequences reduced initiation in base-resolved
        transcriptome-wide HeLa results and in vitro utilizing substrates with site-specific
        ac4C incorporation.'
    - reference_id: PMID:32555463
      supporting_text: In human and yeast mRNAs, ac4C sites are not detected but can be
        induced-at a conserved sequence motif-via the ectopic overexpression of eukaryotic
        acetyltransferase complexes.
