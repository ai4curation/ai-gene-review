core_functions:
- molecular_function:
    id: GO:1990883
    label: 18S rRNA cytidine N-acetyltransferase activity
  description: NAT10 is the enzyme that installs N4-acetylcytidine on 18S rRNA, acting
    within the nucleolar small-subunit processome. The reaction requires both acetyl-CoA
    (bound by the GNAT domain) and ATP (hydrolysed by the N-terminal helicase module),
    and targets cytidines in helix 34 and helix 45 of 18S rRNA - C1842 in human - with
    site selection guided by snoRNAs including U13. Loss of the activity causes accumulation
    of the 30S pre-rRNA, defective 40S subunit production and slowed growth.
  directly_involved_in:
  - id: GO:1904812
    label: rRNA acetylation involved in maturation of SSU-rRNA
  - id: GO:0042274
    label: ribosomal small subunit biogenesis
  locations:
  - id: GO:0005730
    label: nucleolus
  in_complex:
    id: GO:0032040
    label: small-subunit processome
  supported_by:
  - reference_id: PMID:25411247
    supporting_text: Here we report that NAT10 is an ATP-dependent RNA acetyltransferase
      responsible for formation of N(4)-acetylcytidine (ac(4)C) at position 1842 in the
      terminal helix of mammalian 18 S rRNA.
  - reference_id: PMID:25653167
    supporting_text: In budding and fission yeasts, and in human cells, we found two acetylated
      cytosines on 18S rRNA, one in helix 34 important for translation accuracy and another
      in helix 45 near the decoding site.
  - reference_id: PMID:25411247
    supporting_text: RNAi-mediated knockdown of NAT10 resulted in growth retardation of
      human cells, and this was accompanied by high-level accumulation of the 30 S precursor
      of 18 S rRNA, suggesting that ac(4)C1842 formation catalyzed by NAT10 is involved
      in rRNA processing and ribosome biogenesis.
- molecular_function:
    id: GO:0051392
    label: tRNA cytidine N4-acetyltransferase activity
  description: With the THUMP-domain adaptor THUMPD1 supplying tRNA recognition, NAT10
    acetylates cytidine 12 in the D-arm of serine and leucine tRNAs. THUMPD1 is required
    for the tRNA reaction but dispensable for 18S rRNA acetylation, so the same catalytic
    core is directed to two different RNA classes by different targeting factors. Note
    that, unlike bacterial TmcA, the eukaryotic enzyme does not act at the tRNA wobble
    position.
  directly_involved_in:
  - id: GO:0051391
    label: tRNA acetylation
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: PMID:25653167
    supporting_text: 'We demonstrate that yeast Kre33 and human NAT10 are RNA cytosine
      acetyltransferases with, surprisingly, specificity toward both 18S rRNA and tRNAs.
      tRNA acetylation requires the intervention of a specific and conserved adaptor:
      yeast Tan1/human THUMPD1.'
  - reference_id: PMID:25653167
    supporting_text: 'Specific eukaryotic tRNAs, including leucine and serine in yeast,
      are acetylated at position 12 (46).'
suggested_questions:
- question: Does endogenous human mRNA carry N4-acetylcytidine at stoichiometries that
    matter biologically, or is the reported mRNA ac4C an artefact of antibody cross-reactivity
    and sequencing-mismatch analysis? This is the single question that decides whether
    GO:0106162 is a real molecular function of human NAT10 or an over-annotation. PMID:32555463
    and PMID:38640895 find no evidence; PMID:30449621, PMID:35679869 and PMID:38640896
    defend the opposite conclusion on the same data. GOA currently records the positive
    side only (IDA, IBA, IEA), with no NOT annotation representing the negative result.
  experts:
  - Schraga Schwartz
  - Shalini Oberdoerffer
  - Jordan L Meier
- question: If human mRNA ac4C exists, is it deposited by NAT10 acting directly on mRNA,
    or is it a low-level by-product of an enzyme whose targeting machinery is built for
    rRNA and tRNA? NAT10's two validated substrates are each selected by a dedicated adaptor
    (snoRNAs for 18S rRNA, THUMPD1 for tRNA). No comparable targeting factor has been
    identified for mRNA, which would be expected if mRNA acetylation were a programmed
    activity rather than opportunistic modification at accessible motifs.
  experts:
  - Denis L J Lafontaine
  - Sunny Sharma
  - Tsutomu Suzuki
- question: Is full-length NAT10 a genuine protein-lysine acetyltransferase in cells,
    or are the reported histone, tubulin, TP53, MDM2 and CENATAC acetylation events indirect?
    Nearly all positive in vitro results used a construct (aa 164-834) that lacks the
    helicase/RNA-binding module required for the RNA reaction, and UniProt flags the in
    vivo relevance as unsure. A 2026 report that GSDMC scaffolds NAT10 onto chromatin to
    drive histone H3 acetylation (PMID:42176271) revives the question but does not settle
    it, since it is a chromatin and knockdown study rather than an enzymology one.
  experts:
  - Tsutomu Suzuki
  - Jianguo Chen
  - Denis L J Lafontaine
- question: How much of the phenotype attributed to NAT10-mediated mRNA ac4C in the disease
    literature is actually a consequence of impaired 40S ribosome biogenesis? NAT10 depletion
    and remodelin treatment both compromise ribosome production, which globally perturbs
    mRNA stability and translation. Studies that infer direct mRNA acetylation of a named
    transcript from a NAT10-knockdown phenotype plus an ac4C-RIP signal cannot separate
    the two routes without a catalytically dead rescue and an orthogonal, antibody-independent
    site measurement.
  experts:
  - Denis L J Lafontaine
  - Sebastian Klinge
suggested_experiments:
- hypothesis: If endogenous human mRNA carries physiologically meaningful ac4C, a direct
    mass measurement on rigorously purified poly(A) RNA will detect it above the NAT10-knockout
    background; if the sequencing signals are artefactual, it will not.
  description: Quantitative LC-MS/MS of ac4C in rigorously purified, rRNA- and tRNA-depleted
    poly(A) RNA from wild-type and NAT10-knockout human cells, with isotope-labelled ac4C
    standards, reported as mol ac4C per mol cytidine. A shared, blinded sample set analysed
    by both the Schwartz and Oberdoerffer laboratories plus a third independent group would
    settle the abundance question without relying on either sequencing chemistry. The dispute
    is entirely about indirect readouts (antibody enrichment, chemical reduction, mismatch
    calling), so a direct mass measurement on the same material is the arbiter neither
    reanalysis can supply.
  experiment_type: quantitative mass spectrometry of modified nucleosides
- hypothesis: Individual high-confidence mRNA ac4C sites are genuine, NAT10-catalysed modifications
    and will be lost upon expression of a catalytically dead NAT10.
  description: Site-specific validation of a handful of the most confidently called mRNA
    ac4C sites (for example the DUSP1 CDS sites C327/C330/C331 reported in PMID:41956987)
    by an antibody-free, single-site assay in unperturbed cells, together with a catalytically
    inactive NAT10 rescue. This converts a transcriptome-wide statistical claim into a
    testable single-molecule claim, and distinguishes catalysis from the indirect effects
    of losing the protein.
  experiment_type: single-site RNA modification assay with catalytic-mutant rescue
- hypothesis: The reported protein-lysine acetyltransferase activity is an artefact of
    using a truncated enzyme, and full-length NAT10 will acetylate RNA substrates but not
    protein substrates under identical conditions.
  description: Reconstitute acetyl transfer in vitro with full-length recombinant NAT10,
    comparing an rRNA substrate, a tRNA/THUMPD1 substrate, a naked mRNA fragment and a
    recombinant protein substrate (histone H3, alpha-tubulin, CENATAC) side by side under
    identical acetyl-CoA and ATP conditions, and repeat with the aa 164-834 truncation.
    This directly tests whether the protein-lysine activity is an artefact of truncation
    and measures the relative efficiency of mRNA versus the validated RNA substrates on
    one enzyme preparation.
  experiment_type: in vitro acetyltransferase assay with matched substrates and constructs
- hypothesis: Translational and mRNA-stability phenotypes attributed to mRNA ac4C are largely
    secondary to loss of 40S ribosome biogenesis.
  description: Separate ribosome-biogenesis effects from putative mRNA effects by comparing
    acute NAT10 degradation (degron) against expression of a NAT10 point mutant that retains
    18S rRNA acetylation but is impaired for mRNA binding, scoring polysome profiles, Ribo-seq
    and mRNA half-lives. This provides the missing control in essentially all of the disease
    literature, where NAT10 loss simultaneously removes the 40S biogenesis function.
  experiment_type: degron plus separation-of-function mutant with polysome profiling and
    Ribo-seq
