  findings:
  - statement: Base-resolution RedaC:T-seq maps ac4C in HeLa mRNA and shows position-dependent
      effects on translation - stimulatory within coding sequences, inhibitory in 5'
      UTRs and AUG-flanking Kozak contexts.
    supporting_text: Although cytidine acetylation (ac4C) within protein-coding sequences
      stimulates translation, ac4C within 5' UTRs impacts protein synthesis at the
      level of initiation.
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:38640895
      review_notes: Contested by a reanalysis of the same RedaC:T-seq data; defended by
        the authors in PMID:38640896.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Arango et al., Mol Cell 2022; note a published erratum,
      Mol Cell 82:2912). The base-resolution positive result for human mRNA ac4C. Directly
      challenged by PMID:38640895 on reproducibility and duplicate-read grounds and
      defended in PMID:38640896. The cryo-EM component, showing how ac4C at position
      -1 perturbs the initiator tRNA t6A37 interaction, is independent of the mapping
      dispute.
- id: PMID:38640895
  title: No evidence for ac4C within human mRNA upon data reassessment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Georgeson & Schwartz, Mol Cell 2024). The formal
      challenge to the mRNA ac4C claim; argues the RedaC:T-seq mismatch signature is
      driven by low library complexity and disappears after duplicate removal. Not
      currently represented in GOA for NAT10.
- id: PMID:38640896
  title: Detection of ac4C in human mRNA is preserved upon data reassessment.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Beiki et al., Mol Cell 2024). The back-to-back rebuttal
      defending RedaC:T-seq and raising depth and reduction-efficiency problems in
      the ac4C-seq data. Marked DISPUTED because it is one half of an unresolved exchange,
      not because the citation is faulty.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cell-mapping resource; source of a bare protein-binding annotation.
- id: PMID:41956987
  title: NAT10 promotes cisplatin resistance and immune escape by increasing the expression
    of DUSP1 and PD-L1 in gastric cancer.
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: PubMed-verified (Cell Death Discov 2026). Representative of the 2025-2026
      disease literature that asserts NAT10-dependent mRNA ac4C on named transcripts
      using antibody-based ac4C-RIP plus knockdown, without citing or addressing PMID:38640895.
      Does not provide independent methodological support for the contested substrate
      claim.
- id: PMID:42176271
  title: Gasdermin C reprograms metabolism through the CAMKK2-AMPK axis to promote
    lung adenocarcinoma progression and radioresistance.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: PubMed-verified as a citation (Ren et al., Cell Rep 2026); abstract-only
      in the local cache. Reports GSDMC scaffolding NAT10 to drive histone H3 acetylation,
      a protein-acetyltransferase claim distinct from the RNA activity. Marked UNVERIFIED
      because the mechanistic claim rests on chromatin and knockdown experiments that
      I could not inspect, and an indirect route via impaired ribosome biogenesis is
      not excluded.
- id: PMID:42315153
  title: NAT10 deficiency in aging drives impaired liver regeneration by disrupting
    PARP10 in an ac4C-dependent manner.
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: PubMed-verified (Clin Mol Hepatol 2026); abstract-only in the local
      cache. Another ac4C-RIP-based single-transcript mRNA acetylation claim that does
      not engage the mapping dispute.
- id: PMID:42592486
  title: Targeting NAT10 with Remodelin reshapes the pro-fibrotic microenvironment
    in renal fibrogenesis via inhibiting exosome oversecretion from tubular cells.
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: PubMed-verified (Acta Pharm Sin B 2026). Invokes both contested activities
      at once - nuclear mRNA ac4C and cytoplasmic lysine acetylation - and relies on
      remodelin, which impairs ribosome biogenesis, so the phenotype does not discriminate
      between the proposed mechanisms.
