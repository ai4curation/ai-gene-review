- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002194
  - InterPro:IPR002423
  - InterPro:IPR012715
  review:
    summary: InterPro-based annotation of ATP binding.
    action: ACCEPT
    reason: 'Each CCT subunit has the conserved group II chaperonin equatorial nucleotide-binding site.
      CCT1 is one of the higher-affinity ATP-binding subunits of TRiC: it crosslinks to ATP at intermediate
      nucleotide concentrations, and ATP binding to the high-affinity subunits is required for viability.'
    supported_by:
    - &id008
      reference_id: PMID:23041314
      supporting_text: 'We conclude that a gradient of affinities governs ATP binding to TRiC subunits:
        CCT5 and CCT4 have the highest affinities and thus are occupied at the lowest ATP concentrations,
        followed by CCT1 and CCT2.'
    - reference_id: PMID:23041314
      supporting_text: Whereas ATP binding to these high-affinity subunits is required for viability,
        ATP binding to the four low-affinity subunits is dispensable for TRiC activity.
