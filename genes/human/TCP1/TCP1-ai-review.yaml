core_functions:
- description: As the alpha subunit of the CCT/TRiC hetero-oligomer, CCT1 binds and hydrolyzes ATP through
    its equatorial domain and contributes to the ATP-dependent folding of actin, tubulin, G-beta, TCAB1
    and other cytosolic clients inside the closed chamber. Folding is a property of the assembled complex,
    to which CCT1 contributes.
  molecular_function:
    id: GO:0005524
    label: ATP binding
  contributes_to_molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005832
    label: chaperonin-containing T-complex
  supported_by:
  - *id003
  - *id009
  - *id004
  - *id008
  - *id007
suggested_questions:
- question: Which clients depend specifically on CCT1's apical domain, and does the M-phase loss of CCT1
    from the complex regulate folding capacity physiologically?
suggested_experiments:
- description: Use crosslinking mass spectrometry and cryo-EM of human TRiC-client complexes (for example
    TCAB1 or tubulin) to map contacts with CCT1, then test apical-domain point mutants of CCT1 for client-specific
    folding defects in human cells.
