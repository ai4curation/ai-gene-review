id: P17987
gene_symbol: TCP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TCP1 (CCT1, CCT-alpha) is the alpha subunit of the cytosolic chaperonin CCT/TRiC. This group
  II chaperonin is a hexadecamer of two stacked rings, each containing one copy of each of eight paralogous
  subunits (CCT1-CCT8), enclosing a folding chamber. Each subunit has an equatorial ATP-binding/ATPase
  domain, an intermediate hinge domain and an apical substrate-binding domain. CCT1 is one of the higher-affinity
  ATP-binding subunits. ATP binding and hydrolysis around the ring close the chamber and drive folding.
  TRiC folds newly synthesized cytoskeletal proteins (actin and alpha/beta-tubulin), G-protein beta subunits,
  WD40-repeat proteins such as the telomerase cofactor TCAB1, and other cytosolic clients. It cooperates
  with the co-chaperone prefoldin. A centrosomal pool of CCT, together with the chaperonin-like proteins
  BBS6, BBS10 and BBS12, assembles the BBSome.
