core_functions:
- description: Binds the 3' single-stranded DNA overhangs of partially resected DNA double-strand breaks
    through its C-terminal RPA1-like OB folds. This occludes the ends from long-range resection nucleases,
    limits RAD51 loading and homologous recombination, and favours non-homologous end joining. The activity
    depends on the intact OB fold B. The short splice form lacking 69 residues of this fold (the UniProt
    displayed sequence) and an OB-fold point mutant both fail to suppress HR.
  molecular_function:
    id: GO:0003697
    label: single-stranded DNA binding
  directly_involved_in:
  - id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  - id: GO:2000042
    label: negative regulation of double-strand break repair via homologous recombination
  locations:
  - id: GO:0035861
    label: site of double-strand break
  supported_by:
  - reference_id: PMID:30022168
    supporting_text: We estimate the binding affinity of the SHLD2C-ssDNA interaction to be ~10 nM (Fig 4e
      and ED Fig 9c). We conclude that SHLD2 possesses ssDNA-binding activity.
  - reference_id: PMID:30022168
    supporting_text: Indeed, our results are consistent with a model in which Shieldin is the ultimate mediator
      of 53BP1-dependent DNA repair by binding ssDNA and occluding access to resection nucleases (Fig 4f).
- description: Acts as the scaffold of the shieldin complex. Its N-terminal segment binds the SHLD3-REV7
    DSB-recruitment module, and its C-terminal OB-fold region binds SHLD1, so it physically links 53BP1-RIF1-dependent
    recruitment to DNA-end binding.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  locations:
  - id: GO:0035861
    label: site of double-strand break
  supported_by:
  - reference_id: PMID:30022168
    supporting_text: Further mapping studies suggest that Shieldin consists of a DSB-recruitment module composed
      of SHLD3-REV7 that binds to the N-terminus of SHLD2 (residues 1-50; ED Fig 6, ED Fig 7a-c), and a
      presumptive DNA-binding module (SHLD2-SHLD1) featuring the OB-fold domains at the SHLD2 C-terminus
      (SHLD2C residues 421-904; ED Fig 7a).
  - reference_id: file:human/SHLD2/SHLD2-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: SHLD2 forms a scaffold which interacts with a SHLD3-MAD2L2 subcomplex via its N-terminus,
      and with SHLD1 via its C-terminus
