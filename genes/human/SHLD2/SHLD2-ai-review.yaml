- term:
    id: GO:0043247
    label: telomere maintenance in response to DNA damage
  evidence_type: NAS
  original_reference_id: PMID:29656893
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Shieldin acts on deprotected telomeres, a specialised DSB-end context.
    reason: The cited evidence is NHEJ-mediated fusion of unprotected telomeres, i.e. shieldin treats deprotected
      telomere ends as DSB ends. This is a damage response at telomeres, not routine telomere-length maintenance.
      The term is kept as a non-core context of the end-protection function. It is not core, and the fusion
      readout itself is pathological. A more literal reading of GO:0043247 would need shieldin-CST-dependent
      fill-in at telomeres, which is not in the cached literature.
    supported_by:
    - reference_id: PMID:29656893
      supporting_text: In the physiological context, the 53BP1/RIF1/REV7 pathway promotes NHEJ, telomere
        maintenance, and immunoglobulin class-switch recombination (CSR).
