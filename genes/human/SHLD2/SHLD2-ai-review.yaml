    summary: Shieldin's role in antibody diversification is specifically in class-switch recombination.
    reason: The evidence concerns NHEJ-dependent joining of AID-induced switch-region breaks during class-switch
      recombination, not somatic hypermutation or V(D)J recombination. GO:0045190 isotype switching (an
