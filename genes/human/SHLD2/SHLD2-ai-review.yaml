- term:
    id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  evidence_type: IDA
  original_reference_id: PMID:29656893
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: SHLD2 promotes non-homologous end joining.
    reason: 'Independent shieldin identification and FAM35A depletion/rescue studies establish the direction
      of repair-pathway regulation. The gene supports end joining as a scaffold and DNA-end protector,
      rather than catalyzing ligation. The gene-level judgment does not assert equivalent activity of
      all isoforms: PMID:30022168 reports an OB-fold-disrupting short splice form that retains recruitment
      but fails to suppress HR.'
    supported_by: &id010
