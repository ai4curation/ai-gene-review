  label: Homo sapiens
description: SHLD2 is the DNA-binding scaffold of the shieldin complex. It connects the SHLD3–REV7 module
  to SHLD1 and helps protect DNA ends from excessive resection, favoring non-homologous end joining over
  homologous recombination. Shieldin accumulates at nuclear DNA breaks and supports immunoglobulin class
  switching and end joining at damaged telomeres.
