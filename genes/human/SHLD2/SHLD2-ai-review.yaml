id: Q86V20
gene_symbol: SHLD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SHLD2 (FAM35A, RINN2) is the central, non-enzymatic subunit of shieldin, a vertebrate
  DNA double-strand-break (DSB) end-protection complex made of SHLD1, SHLD2, SHLD3 and REV7 (MAD2L2).
  Its short N-terminal segment binds the SHLD3-REV7 recruitment module, which links shieldin to the
  53BP1-RIF1 pathway at damaged chromatin, and its C-terminal region carries three RPA1-like OB folds
  that associate with SHLD1 and bind single-stranded DNA with high affinity. By occupying resected
  3' single-stranded overhangs at DSBs, shieldin limits further end resection and RAD51 loading, so
  it favours non-homologous end joining over homologous recombination. This activity supports
  immunoglobulin class-switch recombination and end joining of deprotected telomeres. In
  BRCA1-deficient cells, loss of SHLD2 restores resection and confers resistance to PARP inhibitors.
  Alternative splicing removes a 69-residue exon from the second OB fold. The UniProt displayed
  (835-residue) sequence is this short form. The 904-residue long form is the one used in the
  biochemical and rescue studies.
