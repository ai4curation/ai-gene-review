- term:
    id: GO:0010569
    label: regulation of double-strand break repair via homologous recombination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001025652
  - UniProtKB:Q86V20
  review:
    action: MODIFY
    summary: SHLD2 restrains homologous recombination through end protection.
    reason: 'The broad regulation term is correct but the loss-of-function evidence establishes negative
      regulation: depletion permits resection and RAD51 focus formation in BRCA1-deficient cells. The
      gene-level judgment does not assert equivalent activity of all isoforms: PMID:30022168 reports an
      OB-fold-disrupting short splice form that retains recruitment but fails to suppress HR.'
    supported_by:
    - &id008
      reference_id: PMID:29789392
      supporting_text: However, the BRCA1‐mutant cells formed damage‐dependent nuclear RAD51 foci following
        FAM35A depletion, suggesting that 5′ end resection was more active in the absence of FAM35A (Fig 5B).
    - &id009
      reference_id: PMID:30022168
      supporting_text: Importantly, both mutants localized to DSB sites (ED Fig 10cd) and interacted with
        the other members of the Shieldin complex (ED Fig 10e). Therefore, the SHLD2-m1 and SHLD2S mutants
        are defective in suppressing HR.
    proposed_replacement_terms:
    - id: GO:2000042
      label: negative regulation of double-strand break repair via homologous recombination
