suggested_questions:
- question: Is the 835-residue SHLD2 splice form, which lacks 69 residues of OB fold B and is UniProt's
    displayed sequence, expressed as protein at physiologically relevant levels? Does it act as a dominant-negative
    or regulatory variant of shieldin end protection?
- question: GO has no cellular-component term for the shieldin complex (ComplexPortal and HGNC group 1656
    define it). Should one be created so that SHLD1, SHLD2, SHLD3 and REV7 can carry part_of shieldin
    complex?
suggested_experiments:
- description: Compare the endogenous protein abundance of the 904- and 835-residue SHLD2 isoforms across
    cell types and B-cell activation states, and test whether the 835-residue form affects end protection
    by the long form when co-expressed.
  hypothesis: The ratio of the two splice forms tunes how strongly shieldin suppresses resection.
- description: Determine the structure of the SHLD2 C-terminal OB-fold region bound to SHLD1 and a 3'
    overhang ssDNA substrate, and map the polarity and minimum length of ssDNA recognised.
  hypothesis: SHLD2 OB folds bind 3' overhangs with an RPA-like polarity that positions SHLD1 to recruit
    CST-Pol alpha fill-in.
