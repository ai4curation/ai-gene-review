  - id: PMID:10467007
    title: Isolation of a new set of Aspergillus nidulans mutants defective in nuclear migration.
    findings:
      - statement: nudK encodes the actin-related protein Arp1, giving the first evidence that dynactin
          is involved in nuclear migration in A. nidulans.
        supporting_text: We have cloned one of the genes, nudK, and determined that it encodes the actin-related
          protein Arp1, which is a component of the dynactin complex. This provides the first evidence
          that dynactin is involved in nuclear migration in A. nidulans.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Donor evidence for the GO:0030473 IBA. Genuine, but fungal germ-tube nuclear migration;
        the corresponding UniProt entry Q5BBX7 is unreviewed with the submitted name 'Uncharacterized
        protein', so only its curated GO evidence is usable.
  - id: PMID:9658168
    title: The yeast dynactin complex is involved in partitioning the mitotic spindle between mother and
      daughter cells during anaphase B.
    findings:
      - statement: Budding-yeast Act5p/Arp1 exists in a stable dynactin complex with Nip100p (p150Glued
          homolog) and Jnm1p; this is also the source of yeast ARP1's own IDA for GO:0005200.
        supporting_text: Consistent with the presence of a true dynactin complex in yeast, Nip100p exists
          in a stable complex with Act5p as well as Jnm1p, another protein required for proper spindle
          partitioning during anaphase.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Establishes the precedent that the orthologous Arp1 carries GO:0005200 structural
        constituent of cytoskeleton by IDA, which human ACTR1A currently lacks.
  - id: PMID:31221720
    title: Cross-linking Proteomics Indicates Effects of Simvastatin on the TLR2 Interactome and Reveals
      ACTR1A as a Novel Regulator of the TLR2 Signal Cascade.
    findings:
      - statement: ACTR1A was found in the cross-linked TLR2 interactome and its knockdown reduced pro-inflammatory
          cytokine induction.
        supporting_text: RNA interference studies revealed an important role for ACTR1A in induction of
          pro-inflammatory cytokines.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Abstract-only. Single unreplicated study; a dynactin-dependent trafficking effect
        could produce the phenotype indirectly, so it is raised as a question rather than annotated.
  - id: PMID:41142317
    title: Alpha-centractin is a novel substrate of SETD3 methyltransferase in vitro.
    findings:
      - statement: Recombinant SETD3 methylates ACTR1A in vitro, extending its substrate repertoire beyond
          beta-actin; no in-cell methylation site was mapped.
        supporting_text: In this study, we report the identification of α-centractin (ACTR1A) as a novel
          SETD3 substrate in vitro.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: In vitro only, and the authors hedge ('may be one of them'). A candidate PTM, not
        a function of ACTR1A; not annotated.
