core_functions:
  - description: Polymerises into the eight-protomer Arp1 mini-filament that forms the backbone of dynactin,
      and presents, together with its neighbours, the surface on which the cytoplasmic dynein-1 heavy-chain
      tails and a coiled-coil cargo adaptor dock. Because the polymer is capped at both ends and of exactly
      defined length, it acts as a ruler whose translational symmetry matches that of the dynein tail
      and whose length forces dynein into its processive conformation; this is how dynactin activates
      dynein for minus-end-directed transport of vesicles and other cargo along microtubules.
