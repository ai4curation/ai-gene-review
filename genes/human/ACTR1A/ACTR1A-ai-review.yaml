          - source_id: UniProtKB:F2Z5G5
            source_label: Sus scrofa ACTR1A (Swiss-Prot)
            source_status: SUPPORTS_TRANSFER
            comment: Own IPI for GO:0005869 (PMID:33734450).
          - source_id: WB:WBGene00013168
            source_label: C. elegans arp-1 (maps to TWO unreviewed TrEMBL entries, Q9NA98 and U4PR70;
