        is the product of the process in human material - eight protomers in the polymerised state, joined
        through the canonical longitudinal interface, at defined stoichiometry - whereas the kinetic demonstration
        that Arp1 polymerises (PMID:10074429) was performed on purified native Arp1 whose species the
        abstract does not state, so it is cited as corroboration rather than as the primary reference
        for a human annotation. If a curator prefers process-kinetic evidence the honest pairing would
        be ISS on PMID:10074429 once its source species is confirmed from the full text. For the same
        reason no actin-filament dynamics, severing, treadmilling or depolymerisation term should be applied:
