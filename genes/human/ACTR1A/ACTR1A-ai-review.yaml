  - id: PMID:25736293
    title: Dynactin and Num1 cooperate to establish the cortical anchoring of cytoplasmic dynein in S.
      pombe.
    findings:
      - statement: Fission-yeast Arp1, Mug5 and Jnm1 colocalise with cortical dynein foci and are required
