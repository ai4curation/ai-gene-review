existing_annotations:
  - term:
      id: GO:0030473
      label: nuclear migration along microtubule
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: Dynein-dynactin does move nuclei along microtubules in animal cells, and ACTR1A is an obligate
        structural subunit of dynactin, so involvement is likely true - but it is one cargo among many
        and there is no mammalian experimental support. Kept as a non-core process.
      action: KEEP_AS_NON_CORE
      reason: 'GO:0030473 is defined as directed movement of the nucleus along microtubules mediated by
        motor proteins, which is a genuine dynein-dynactin output; since ACTR1A forms the dynactin backbone
        the involved_in call is defensible and I am not disputing it. It is not core, for two reasons.
        First, all interpretable donor evidence is fungal and lineage-specific: A. nidulans nudK/Arp1
        from a nuclear-distribution mutant screen, and S. pombe arp1 whose own IMP is to the child term
        GO:0030989, the meiotic horsetail oscillation led by an astral array from a spindle pole body.
        Second, the one mammalian donor row is wrong: pig ACTR1A carries GO:0030989 by IDA sourced from
        a cryo-EM structure paper (PMID:36071160), which cannot evidence a meiotic movement process. So
        the mammalian support for this branch is an artefact, leaving a fungal-only inference for a process
        that is real in mammals but untested for this gene. Nuclear migration is a cargo-specific specialisation
        of the general transport role captured elsewhere in this review.'
      propagation_review:
        root_cause: NO_FAILURE_NON_CORE
        failure_modes:
          - CONTEXT_OR_TISSUE_MISMATCH
          - SOURCE_MISCITATION
        source_entities:
          - source_id: PANTHER:PTN000233666
            source_label: PANTHER tree node PTN000233666
            source_status: UNRESOLVED
            comment: PANTHER internal tree node, not a gene product, so it carries no evidence of its
              own and cannot be interrogated; reported as unresolvable-in-principle rather than simply
              unresolved.
          - source_id: PomBase:SPBC1347.12
            source_label: S. pombe arp1 (O94630, Swiss-Prot)
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: Carries its own IMP, but to the child term GO:0030989 dynein-driven meiotic oscillatory
              nuclear movement (PMID:25736293) - the fission-yeast meiotic horsetail oscillation, driven
              from a spindle pole body.
          - source_id: UniProtKB:F2Z5G5
            source_label: Sus scrofa ACTR1A (Swiss-Prot)
            source_status: SOURCE_BAD
            comment: Its only experimental annotation under this branch is GO:0030989 with evidence IDA,
              assigned by ComplexPortal from PMID:36071160 - a cryo-EM structure paper that cannot be
              a direct assay of a meiotic nuclear-oscillation process, for a term defined around a spindle
              pole body that pigs do not have. The same row was applied to DCTN1/2/4/5 and CAPZA1/B and
              propagated to rat by ISO.
          - source_id: UniProtKB:Q5BBX7
            source_label: A. nidulans ANIA_01953 / nudK (Q5BBX7, unreviewed TrEMBL, submitted name 'Uncharacterized
              protein')
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: Genuine IMP for GO:0030473 itself from a nuclear-distribution mutant screen (PMID:10467007);
              unreviewed entry, so its protein name is not usable as evidence, only its curated GO evidence.
      supported_by:
        - reference_id: PMID:10467007
          supporting_text: We have cloned one of the genes, nudK, and determined that it encodes the actin-related
            protein Arp1, which is a component of the dynactin complex. This provides the first evidence
            that dynactin is involved in nuclear migration in A. nidulans.
  - term:
      id: GO:0106006
      label: cytoskeletal protein-membrane anchor activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: contributes_to
    review:
      summary: A fission-yeast cortical-anchoring activity transferred onto the filament-core subunit.
        In human cells the cortical anchor is Galphai-LGN-NuMA and dynactin is the anchored partner, and
        none of ACTR1A's structurally resolved contacts is a membrane or membrane protein. Over-annotated.
      action: MARK_AS_OVER_ANNOTATED
      reason: 'GO:0106006 requires an activity that brings a cytoskeletal protein or complex together
        with a plasma membrane lipid or membrane-associated protein so as to hold the cytoskeleton at
        a cortical location. Three things argue against transferring it to human ACTR1A. (i) Every ACTR1A
        contact resolved in the human dynactin structure is intra-complex - neighbouring Arp1 protomers,
        beta-actin, ACTR10, CAPZA1/CAPZB, the p50 shoulder - plus the dynein heavy-chain tail; no membrane
        or membrane protein. (ii) In human mitosis the cortical link is supplied by Galphai-LGN-NuMA and
        the dependency runs the other way: LGN is required for cortical dynein-dynactin, so the anchoring
        activity sits upstream of dynactin rather than in it. (iii) The sole interpretable donor is one
        EXP annotation on S. pombe arp1, in a system where Num1/Mcp5 is the cortical anchor and dynactin
        cooperates with it; that source annotation is sound, which is precisely why this is a propagation
        problem rather than a bad source. I stop at MARK_AS_OVER_ANNOTATED rather than REMOVE because
        the contributes_to qualifier only asserts that dynactin as a complex has the activity, and in
        fission yeast dynactin genuinely is required for cortical dynein anchoring; the mammalian case
        is untested, not refuted, and untested is not the same verdict as wrong.'
      propagation_review:
        root_cause: PROPAGATION_BAD
        failure_modes:
          - ROLE_CONFLATION
          - COMPARTMENT_OR_COMPLEX_MISMATCH
        source_entities:
          - source_id: PANTHER:PTN007551901
            source_label: PANTHER tree node PTN007551901
            source_status: UNRESOLVED
            comment: PANTHER internal tree node, not a gene product; no evidence of its own.
          - source_id: PomBase:SPBC1347.12
            source_label: S. pombe arp1 (O94630, Swiss-Prot)
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: Carries GO:0106006 contributes_to with evidence EXP from PMID:25736293, where the
              cortical anchor is Num1/Mcp5 and dynactin cooperates with it. Sound for fission yeast; the
              human cortical anchor is Galphai-LGN-NuMA.
      supported_by:
        - reference_id: PMID:25736293
          supporting_text: These subunits transiently colocalized with dynein foci at the cell cortex
            and were essential for the cortical anchoring of dynein.
        - reference_id: PMID:22327364
          supporting_text: we found that LGN was required for the cortical localization of dynein-dynactin
        - reference_id: PMID:25814576
          supporting_text: They bind adjacent clefts between Arp1-D & F (chain-1) and Arp1-F & β-actin-H
            (chain-2) (Fig. 5F,G).
  - term:
      id: GO:0005869
      label: dynactin complex
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: part_of
    review:
      summary: 'Core and correct: ACTR1A is the subunit dynactin is built around, in eight copies. Four
        of the five resolvable donors carry their own experimental evidence for dynactin membership, and
        the human structure settles it directly.'
      action: ACCEPT
      reason: 'This is the defining annotation for the gene. It does not rest on phylogenetic inference
        alone: S. cerevisiae ARP1, S. pombe arp1, pig ACTR1A and C. elegans arp-1 each carry their own
        IDA or IPI for GO:0005869, and human ACTR1A is modelled in eight copies in the human dynactin
        cryo-EM structure. A claim that the donors carry only the same family-level inference would be
        factually false here.'
      propagation_review:
