  - term:
      id: GO:0005869
      label: dynactin complex
    evidence_type: TAS
    original_reference_id: PMID:7696711
    qualifier: part_of
    review:
      summary: Author statement from the paper that separated alpha- from beta-centractin and showed both
        are dynactin subunits, with alpha dominant at about 15:1.
      action: ACCEPT
      reason: The cited paper discriminated the two centractin isoforms with isoform-specific antibodies
        and two-dimensional gels and found both in the 20S dynactin complex, alpha in about fifteen-fold
        excess, with no free pool of either. Although the title foregrounds beta-centractin, the paper
        explicitly characterises alpha-centractin, so this is not a paralog mis-attribution. It is also
        the quantitative basis for treating ACTR1A rather than ACTR1B as the filament subunit.
      supported_by:
        - reference_id: PMID:7696711
          supporting_text: The isoforms were found in a constant ratio of approximately 15:1 (alpha:beta)
            in the dynactin complex.
        - reference_id: PMID:7696711
          supporting_text: Both isoforms were found predominantly in the cytosolic fraction as a part
            of a previously identified 20S complex (referred to as the dynactin complex) with no evidence
            for a free pool of either isoform.
  - term:
      id: GO:0005875
      label: microtubule associated complex
    evidence_type: TAS
    original_reference_id: PMID:7696711
    qualifier: part_of
    review:
      summary: A strict ancestor of GO:0005869 dynactin complex, annotated from the very same reference.
        Should be collapsed onto the child.
      action: MODIFY
      reason: QuickGO's ancestor closure for GO:0005869 includes GO:0005875, and both rows cite PMID:7696711,
        so the gene is annotated to a term and its parent from one evidence line. The paper supports the
        specific term - it identifies centractin as a component of the 20S dynactin complex - so the informative
        call is the child. The general phrasing in the abstract, an actin-related protein localized to
        microtubule-associated structures, is what generated the parent term.
      proposed_replacement_terms:
        - id: GO:0005869
          label: dynactin complex
      supported_by:
        - reference_id: PMID:7696711
          supporting_text: an isoform of centractin, an actin-related protein localized to microtubule-associated
            structures
  - term:
      id: GO:0016192
      label: vesicle-mediated transport
    evidence_type: TAS
    original_reference_id: PMID:1528266
    qualifier: involved_in
    review:
      summary: The founding centractin paper reports microtubule-based vesicle motility specifically,
        so the generic vesicle-mediated transport term under-describes its own evidence.
      action: MODIFY
      reason: 'GO:0016192 covers all vesicle-mediated transport including actin-myosin-driven and non-cytoskeletal
        routes, and the cited paper draws exactly the opposite contrast: it argues that centractin, unlike
        conventional actins acting with myosin, works in a microtubule-based system, as part of the dynactin
        activator of dynein-driven vesicle movement. GO:0047496 vesicle transport along microtubule captures
        that without over-claiming directionality, which the paper does not measure for ACTR1A itself.'
      proposed_replacement_terms:
        - id: GO:0047496
          label: vesicle transport along microtubule
      supported_by:
        - reference_id: PMID:1528266
          supporting_text: Actin-RPV is a major component of the dynactin complex, an activator of dynein-driven
            vesicle movement, indicating that unlike conventional actins which work in conjunction with
            myosin motors, actin-RPV may be involved in cytoplasmic movements via a microtubule-based
            system.
  - term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
    evidence_type: IDA
    original_reference_id: PMID:40186871
    qualifier: enables
    review:
      summary: Restores the molecular function ACTR1A has lost. Eight ACTR1A protomers build the dynactin
        mini-filament; the human cryo-EM structure shows it directly, and the same term is carried by
        beta-actin and, by IDA, by budding-yeast ARP1.
      action: NEW
      reason: 'GOA currently gives human ACTR1A only two molecular-function rows: a fission-yeast-derived
        cortical-anchor IBA and a bare protein binding IPI. The UniProt entry fetched the same day still
