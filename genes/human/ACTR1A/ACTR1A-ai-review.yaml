  - term:
      id: GO:0005938
      label: cell cortex
    evidence_type: IDA
    original_reference_id: PMID:22327364
    qualifier: located_in
    review:
      summary: Direct imaging of Arp1A at the mitotic cell cortex in HeLa cells, where its accumulation
        is asymmetric and spindle-pole-regulated. Sound and specific.
      action: ACCEPT
      reason: ACTR1A (Arp1A) was imaged at the cell cortex and, unlike LGN, NuMA and Galphai, its cortical
        pool is asymmetric and negatively regulated by spindle-pole proximity, so this is a regulated
        functional localisation rather than an incidental one. The construct was a GFP fusion, which is
        the standard basis for an IDA localisation call in GO (GO_REF:0000054 exists precisely for fusion-protein
        localisation), so the evidence code is appropriate. Note that the same paper shows LGN is required
        for this localisation, which is what argues against giving ACTR1A a membrane-anchoring molecular
        function.
      supported_by:
        - reference_id: PMID:22327364
          supporting_text: In HeLa cells, LGN localizes to the cell cortex from prometaphase through telophase
            (Fig. 1a), whereas dynein and the dynactin subunit Arp1A accumulate at the cell cortex subsequently
            to LGN
        - reference_id: PMID:22327364
          supporting_text: In contrast, Arp1A accumulated asymmetrically at the cell cortex during metaphase
            such that it is preferentially localized to the cortex that is distal to the mitotic spindle
  - term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:28394342
    qualifier: enables
    review:
      summary: A real, isoform-resolved partner (BCCIP alpha / Q9P287-2), but the pull-down captured intact
        dynactin, so it does not localise a binding surface to ACTR1A and cannot be upgraded to an informative
        ACTR1A-specific molecular function.
      action: KEEP_AS_NON_CORE
      reason: 'The evidence is better than a screen hit: GST-BCCIPalpha, but not BCCIPbeta or GST, pulled
        down Arp-1 from mitotic lysate, matching GOA''s with-value of the alpha isoform Q9P287-2. That
        is a genuine partner and I am not discarding it. But p150Glued came down in the same pull-down,
        i.e. what was captured was the assembled dynactin complex, so the experiment shows BCCIPalpha
        binds dynactin, not that it contacts ACTR1A. Project guidance is to replace bare protein binding
        with an informative term, and I decline to do so here because no informative ACTR1A-specific molecular
        function is licensed by this experiment; inventing one would be worse than keeping the partner
        record. Retained as a non-core interaction record with that caveat.'
      supported_by:
        - reference_id: PMID:28394342
          supporting_text: BCCIPα, but not BCCIPβ or GST itself, was sufficient to pull down the dynactin
            components, p150 glued and Arp-1
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: TAS
    original_reference_id: Reactome:R-HSA-2213248
    qualifier: located_in
    review:
      summary: Cytosolic localisation asserted by Reactome for the dynactin complex as a participant in
        the reaction 'Transport of antigen loaded MHC II molecules to surface'. Correct but low-information,
        and one of 27 identical rows.
      action: KEEP_AS_NON_CORE
      reason: 'Dynactin is a soluble cytoplasmic 20S complex, so cytosol is correct - and PMID:7696711
        showed both centractin isoforms reside predominantly in the cytosolic fraction as part of that
        complex with no free pool. The annotation is nonetheless low-information and structurally redundant:
        GOA carries 27 identical cytosol rows, one per Reactome reaction in which the dynactin complex
        appears as a participant, which is a reaction-level compartment export rather than 27 independent
        observations. Several of the reactions concern centriole and ciliogenesis events with no ACTR1A-specific
        evidence at all; ACTR1A is present only because Reactome lists dynactin among the participants.
        Kept as a correct non-core location.'
      supported_by:
        - reference_id: PMID:7696711
          supporting_text: Both isoforms were found predominantly in the cytosolic fraction as a part
            of a previously identified 20S complex (referred to as the dynactin complex) with no evidence
            for a free pool of either isoform.
