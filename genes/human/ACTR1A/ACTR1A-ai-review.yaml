id: P61163
gene_symbol: ACTR1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACTR1A (alpha-centractin, Arp1) is the actin-related protein that forms the structural backbone
  of dynactin, the essential cofactor of cytoplasmic dynein-1. Eight copies of ACTR1A together with a
  single beta-actin subunit polymerise into a short two-protofilament mini-filament about 37 nm long,
  capped by the CAPZA1-CAPZB heterodimer at one end and by ACTR10 (Arp11) with the p25-p27-p62 pointed-end
  module at the other, and coated on three faces by the shoulder formed from p150Glued, p50/dynamitin
  and p24. The remaining face of the filament is the platform on which the dynein heavy-chain tails and
  a coiled-coil cargo adaptor such as BICD2, BICDR1 or HOOK3 dock; because the filament is doubly capped
  and of exactly defined length, its translational symmetry matches that of the dynein tail and its length
  holds the two heavy chains apart in the conformation required for processive motility. ACTR1A therefore
  contributes structure and binding surface rather than motor or catalytic activity, and through dynactin
  it supports minus-end-directed transport of vesicles and organelles along microtubules, Golgi and endosome
  positioning, retrograde traffic from the Golgi to the ER, microtubule anchoring at the centrosome, and
  cortical force generation that orients the mitotic spindle. Unlike conventional actin it is not a dynamic
  polymer: essentially all cellular ACTR1A is found within the assembled 20S dynactin complex with no
  free pool, and the filament neither treadmills nor changes length. It retains the actin nucleotide-binding
  cleft and is found with ADP bound in every protomer of the human complex. A minor paralog, ACTR1B (beta-centractin),
  is incorporated into the same complex but at roughly one fifteenth the abundance of ACTR1A.'
