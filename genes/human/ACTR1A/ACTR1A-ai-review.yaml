        supporting_text: These subunits transiently colocalized with dynein foci at the cell cortex and
          were essential for the cortical anchoring of dynein.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Sole interpretable donor for the GO:0106006 IBA. The source annotation is sound for
