    review:
      summary: ACTR1A self-associates into a polymer, using actin's own longitudinal interface. The generic
        polymerization term is the right one; GO:0030041 actin filament polymerization would be wrong.
      action: NEW
      reason: 'In the human dynactin structure the ACTR1A-ACTR1A interfaces split cleanly by size into
        six large intra-protofilament contacts and a set of smaller lateral ones, and all six large interfaces
        share ACTR1A residues 44-49, 51, 52, 65-68, 205, 213 and 243-246 - so this is a property of the
        filament, not of one hand-picked chain pair. In beta-actin numbering the subdomain-2 members of
        that consensus are 40-45, 47, 48 and 61-64, i.e. actin''s DNase-I-binding loop, the canonical
        longitudinal polymerisation contact; the remainder (beta-actin 200, 208, 242-245) are subdomain-3/4
        contacts on the partner face, reported in full in RESULTS.md rather than omitted. So ACTR1A polymerises
        with actin''s own machinery rather than a repurposed surface, and purified native Arp1 polymerises
        on its own in vitro. GO:0030041 actin filament polymerization is nonetheless inappropriate: its
        definition requires assembly of actin filaments by addition of actin monomers, whereas the polymer
        here is an Arp1 mini-filament of eight Arp1 plus one beta-actin, and the monomers added are Arp1.
