            label-free quantitative proteomic analysis
        - reference_id: file:human/ACTR1A/ACTR1A-uniprot.txt
          supporting_text: The filament contains 8 copies of ACTR1A and 1 ACTB.
        - reference_id: file:human/ACTR1A/ACTR1A-bioinformatics/RESULTS.md
          supporting_text: 'ACTR1A protomers modelled: **8** (chains A, B, C, D, E, F, G, I); the modelled
