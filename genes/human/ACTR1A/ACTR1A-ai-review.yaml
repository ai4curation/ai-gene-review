  - id: PMID:1528266
    title: A vertebrate actin-related protein is a component of a multisubunit complex involved in microtubule-based
      vesicle motility.
    findings:
      - statement: Identified centractin (actin-RPV) as a major component of dynactin, an activator of
          dynein-driven vesicle movement, and framed it as acting through a microtubule-based rather than
          myosin-based system.
        supporting_text: Actin-RPV is a major component of the dynactin complex, an activator of dynein-driven
          vesicle movement, indicating that unlike conventional actins which work in conjunction with
          myosin motors, actin-RPV may be involved in cytoplasmic movements via a microtubule-based system.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Founding paper for the gene; abstract-only in the cache but the abstract states the
        claim used for the GO:0016192 MODIFY.
