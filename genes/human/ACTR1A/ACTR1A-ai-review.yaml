  - id: PMID:22327364
    title: Chromosome- and spindle-pole-derived signals generate an intrinsic code for spindle position
      and orientation.
    findings:
      - statement: GFP-Arp1A accumulates at the mitotic cell cortex, asymmetrically and distal to the
          spindle pole, downstream of LGN.
        supporting_text: In contrast, Arp1A accumulated asymmetrically at the cell cortex during metaphase
          such that it is preferentially localized to the cortex that is distal to the mitotic spindle
      - statement: LGN is required for cortical dynein-dynactin localisation, so in human cells dynactin
          is the anchored partner and Galphai-LGN-NuMA supplies the cortical anchor.
        supporting_text: we found that LGN was required for the cortical localization of dynein-dynactin
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text available and read. Supports the cell-cortex IDA and, independently, the
        argument against GO:0106006 for human ACTR1A.
  - id: PMID:23533145
    title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  - id: PMID:28394342
    title: Regulation of spindle integrity and mitotic fidelity by BCCIP.
    findings:
      - statement: GST-BCCIPalpha, but not BCCIPbeta or GST, pulled down the dynactin components p150Glued
          and Arp-1 from mitotic lysate - an isoform-specific interaction with the assembled complex.
        supporting_text: BCCIPα, but not BCCIPβ or GST itself, was sufficient to pull down the dynactin
          components, p150 glued and Arp-1
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text read. The interaction is real and isoform-resolved, matching GOA's with-value
        Q9P287-2, but the pull-down captured intact dynactin, so it does not localise a binding site to
        ACTR1A.
  - id: PMID:7696711
    title: 'Beta-centractin: characterization and distribution of a new member of the centractin family
      of actin-related proteins.'
    findings:
      - statement: Alpha- and beta-centractin are both dynactin subunits but occur in the complex at a
          constant ratio of about 15:1 in favour of alpha, despite comparable mRNA distribution - the
          basis for treating ACTR1A rather than ACTR1B as the filament subunit.
        supporting_text: The isoforms were found in a constant ratio of approximately 15:1 (alpha:beta)
          in the dynactin complex.
      - statement: Both isoforms are predominantly cytosolic and found as part of the 20S dynactin complex,
          with no free pool of either.
        supporting_text: Both isoforms were found predominantly in the cytosolic fraction as a part of
          a previously identified 20S complex (referred to as the dynactin complex) with no evidence for
          a free pool of either isoform.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Title foregrounds the paralog ACTR1B, but the paper explicitly discriminates and characterises
        alpha-centractin with isoform-specific antibodies, so the two TAS rows on ACTR1A are not mis-attributed.
  - id: PMID:25814576
    title: The structure of the dynactin complex and its interaction with dynein.
    findings:
      - statement: Dynactin is built around an Arp1 filament of eight Arp1 subunits plus one beta-actin,
          capped by CapZ alpha-beta at the barbed end and Arp11 at the pointed end, giving a complex of
          exactly defined length.
        supporting_text: Together with CapZαβ binding to the barbed end this results in a highly stable
          complex of an exactly defined length.
      - statement: The dynein heavy-chain tails bind directly to the Arp1 filament, in clefts between
          adjacent protomers equivalent to the myosin site on actin, and the filament length forces dynein
          into its active conformation.
        supporting_text: They bind adjacent clefts between Arp1-D & F (chain-1) and Arp1-F & β-actin-H
          (chain-2) (Fig. 5F,G).
      - statement: Arp1 and beta-actin share 53% sequence identity and both fold into four subdomains
          surrounding a nucleotide binding site.
        supporting_text: Both consist of four subdomains surrounding a nucleotide binding site (fig. S4).
      - statement: Arp11 alone caps the pointed end; the other pointed-end subunits have a cargo-attachment
          role instead.
        supporting_text: Only Arp11 directly caps the pointed end, suggesting that the other components
          have a different role such as cargo attachment (28).
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text read. Native pig-brain dynactin, hence ISS rather than IDA for the human
        dynein-heavy-chain-binding proposal.
  - id: PMID:40186871
    title: The Chlamydia effector Dre1 binds dynactin to reposition host organelles during infection.
    findings:
      - statement: First cryo-EM structure of human dynactin (PDB 9B7J, 9B85), purified from human cell
          culture using the Chlamydia effector Dre1 as an affinity reagent; eight ACTR1A protomers are
          modelled, each with ADP.
        supporting_text: we purified dynactin from human cell culture and solved the first cryo-EM structure
          of human dynactin
      - statement: Dre1 binds the pointed-end complex, not the Arp1 filament, so this paper is cited here
          for the human structure rather than for an ACTR1A interaction.
        supporting_text: these results suggest that Dre1 binds to the pointed-end complex of dynactin
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text read. The bound ADP is in the deposited coordinates of 9B85 and 9B7J but
        is not discussed in the paper text; the structural facts used here were computed from the deposited
        model (see the bioinformatics RESULTS.md).
  - id: PMID:10074429
    title: Self-regulated polymerization of the actin-related protein Arp1.
    findings:
      - statement: Purified native Arp1 polymerises rapidly into short filaments of roughly dynactin length
          that anneal but never reach conventional actin-filament lengths.
        supporting_text: Arp1 was found to polymerize rapidly into short filaments that were similar,
          but not identical, in length to those in dynactin.
      - statement: Arp1's ATP binding is a prediction from conserved sequence features, not a measurement
          - which is why the nucleotide annotation proposed here is ADP binding, the ligand actually observed.
        supporting_text: on the basis of conserved sequence features, is predicted to bind ATP and possibly
          polymerize
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract-only in the cache, but the abstract is unusually detailed and carries both
        claims used. The species of the purified native Arp1 is not stated in the abstract, so it is cited
        alongside, not instead of, the human structure.
  - id: PMID:7518465
    title: 'Ultrastructural analysis of the dynactin complex: an actin-related protein is a component
      of a filament that resembles F-actin.'
    findings:
      - statement: Anti-Arp1 antibodies decorate sites all along dynactin's 37 nm filament, showing that
          Arp1 itself assembles into a polymer similar to conventional actin, with capping protein at
          one end.
        supporting_text: Antibodies to the actin-related protein Arp1 (previously referred to as actin-RPV),
          bound at various sites along the filament, demonstrating that this protein assembles in a polymer
          similar to conventional actin.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
  - id: PMID:10525537
    title: Analysis of dynactin subcomplexes reveals a novel actin-related protein associated with the
      arp1 minifilament pointed end.
    findings:
      - statement: Arp11 was identified at the Arp1 mini-filament pointed end; like other Arps it retains
          the actin fold with its nucleotide and metal-binding elements, so fold retention alone does
          not discriminate a polymerising Arp from a capping one.
        supporting_text: Alignment of the Arp11 sequence with actin reveals overall conservation of the
          “actin fold,” a primordial core structure that contains nucleotide and metal binding elements
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
  - id: PMID:36071160
    title: Structure of dynein-dynactin on microtubules shows tandem adaptor binding.
    findings:
      - statement: Cargo-adaptor coiled coils run along dynactin's filament and position dynein in a conformation
          that relieves its intrinsic inhibition.
        supporting_text: Cryo-electron microscopy (cryo-EM) showed how their coiled-coils run along dynactin’s
          filament, positioning dynein in a conformation that relieves its intrinsic inhibition
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: 'Cited correctly and affirmatively in this review, for dynactin filament/adaptor architecture
        - hence VERIFIED: the correctness enum records this review''s use of the reference, not a third
        party''s. Separately, ComplexPortal uses this cryo-EM structure paper as the IDA source for GO:0030989
        dynein-driven meiotic oscillatory nuclear movement on pig ACTR1A and six other pig dynactin subunits,
        which the paper cannot support, and those rows have been propagated to rat by ISO; that defect
        is recorded where it belongs, as source_status SOURCE_BAD with failure_mode SOURCE_MISCITATION
        in the GO:0030473 propagation_review, and is escalated in suggested_questions.'
  - id: PMID:33734450
