  - id: file:human/ACTR1A/ACTR1A-bioinformatics/RESULTS.md
    title: 'Bioinformatics: ACTR1A nucleotide site and polymerisation interface'
    findings:
      - statement: ACTR1A retains 19 of 25 beta-actin nucleotide-contact residues (76%), ACTR1B 20/25,
          and the capping paralog ACTR10 only 10/25 (40%).
        supporting_text: '| ACTR10 | 28.0 | 25 | 10 | 40.0 |'
      - statement: All eight ACTR1A protomers of the human dynactin structure (PDB 9B85) have ADP modelled,
          in the cleft homologous to actin's ATP site.
        supporting_text: 'ACTR1A chains with a modelled nucleotide: **8/8**, ligand(s) ADP.'
      - statement: All six large (intra-protofilament) ACTR1A-ACTR1A interfaces share ACTR1A residues
          44-49, 51, 52 and 65-68, which map onto beta-actin's subdomain-2 DNase-I-binding loop - actin's
          own longitudinal polymerisation contact - plus subdomain-3/4 contacts at beta-actin 200, 208
          and 242-245.
        supporting_text: 'Positions present in **every** large interface: 44, 45, 46, 47, 48, 49, 51,
          52, 65, 66, 67, 68, 205, 213, 243, 244, 245, 246. In beta-actin numbering, those below residue
          70 (subdomain 2) are [40, 41, 42, 43, 44, 45, 47, 48, 61, 62, 63, 64] and the rest are [200,
          208, 242, 243, 244, 245].'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Computed for this review; the script derives every position from coordinates rather
        than from a remembered residue list, and is re-runnable.
  - id: file:human/ACTR1A/ACTR1A-deep-research-affinage.md
    title: Affinage mechanistic annotation for ACTR1A (human)
    reference_review:
      relevance: LOW
      correctness: VERIFIED
