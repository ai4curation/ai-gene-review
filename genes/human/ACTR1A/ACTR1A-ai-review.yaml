  - term:
      id: GO:0070062
      label: extracellular exosome
    evidence_type: HDA
    original_reference_id: PMID:23533145
    qualifier: located_in
    review:
      summary: Detection of a cytosolic dynactin subunit in a prostatic-secretion exosome proteome. Peptides
        were genuinely found, but this is the standard cytoskeletal-contaminant pattern rather than a
        functional location.
      action: MARK_AS_OVER_ANNOTATED
      reason: ACTR1A has no signal peptide or transmembrane segment, is an obligate subunit of a 1 MDa
        cytoplasmic motor cofactor with no free pool, and no functional study places any part of dynactin
        outside the cell. High-throughput exosome proteomes routinely recover abundant cytoskeletal and
        cytoskeleton-associated proteins. Marked as over-annotated rather than removed because the mass-spectrometric
        detection itself is not in dispute.
      supported_by:
        - reference_id: PMID:7696711
          supporting_text: Both isoforms were found predominantly in the cytosolic fraction as a part
            of a previously identified 20S complex (referred to as the dynactin complex) with no evidence
            for a free pool of either isoform.
  - term:
      id: GO:0070062
      label: extracellular exosome
    evidence_type: HDA
    original_reference_id: PMID:19056867
    qualifier: located_in
    review:
      summary: 'Second exosome-proteome detection, this time urinary. Same assessment as the prostatic-secretion
        row: real peptides, not a functional location.'
      action: MARK_AS_OVER_ANNOTATED
      reason: Two independent high-throughput exosome proteomes recovering an abundant cytosolic protein
        increases confidence that the peptides are real, not that the protein functions extracellularly.
        ACTR1A is a core subunit of a cytoplasmic complex with no free pool and no secretory features.
  - term:
      id: GO:0005813
      label: centrosome
    evidence_type: IDA
    original_reference_id: PMID:21399614
    qualifier: located_in
    review:
      summary: Centrosomal localisation from a human centrosome study combining proteomics with localisation
        validation. Consistent with the long-established role of dynein-dynactin in anchoring microtubules
        at the centrosome.
      action: ACCEPT
      reason: 'Independent centrosome proteomics (PMID:14654843, cited by UniProt for the same location)
        reaches the same conclusion, and dynactin''s centrosomal pool is functionally characterised: dynein-dynactin
        anchors microtubule minus ends there. Accepted as a genuine site of action, and carried into core_functions.locations.'
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IDA
    original_reference_id: GO_REF:0000054
    qualifier: located_in
    review:
      summary: Fusion-protein localisation to the cytoplasm. Correct and very general.
      action: KEEP_AS_NON_CORE
      reason: A true but maximally general location, subsumed in practice by the cytosol and dynactin-complex
