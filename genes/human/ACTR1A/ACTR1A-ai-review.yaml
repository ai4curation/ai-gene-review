proposed_new_terms:
  - proposed_name: dynactin complex assembly
    proposed_definition: The aggregation, arrangement and bonding together of a set of components to form
      a dynactin complex, including polymerisation of actin-related protein 1 into a mini-filament of
      defined length, capping of that filament at both ends, and attachment of the shoulder and pointed-end
      modules.
    justification: 'GO can express dynactin as a structure (GO:0005869) and as a binding target (GO:0034452
      dynactin binding) but has no term for its assembly: a QuickGO ontology search for ''dynactin'' returns
      only those two terms plus two obsolete ones. That is a real gap, because dynactin assembly is the
      only process in which ACTR1A''s polymerisation activity is deployed, and it is mechanistically distinctive
      rather than generic - the shoulder and its extended p50 regions recruit exactly eight Arp1 subunits
      and act as a molecular ruler, CapZ alpha-beta caps the barbed end and Arp11 the pointed end, and
      free Arp1 polymers by contrast vary in length. Without such a term the only available annotation
      for ACTR1A''s assembly role is the generic GO:0051258 protein polymerization, which says nothing
      about the product. GO already has the exact sibling for the partner complex, GO:0070286 axonemal
      dynein complex assembly.'
    proposed_parent:
      id: GO:0065003
      label: protein-containing complex assembly
    supported_by:
      - reference_id: PMID:25814576
        supporting_text: The shoulder and ERs recruit eight Arp1s and stabilize their polymerization into
          a structure with 5 subunits on the top protofilament and three on the bottom.
      - reference_id: PMID:25814576
        supporting_text: Together with CapZαβ binding to the barbed end this results in a highly stable
          complex of an exactly defined length.
      - reference_id: PMID:25814576
        supporting_text: What makes the filament in dynactin short and defined, when purified Arp1 filaments
          vary in length (18)?
      - reference_id: PMID:10074429
        supporting_text: Arp1 was found to polymerize rapidly into short filaments that were similar,
          but not identical, in length to those in dynactin.
suggested_questions:
  - question: Within one PANTHER family, GO:0005200 structural constituent of cytoskeleton has been given
      by IBA (qualifier 'enables') to ACTR10/Arp11, the single-copy subunit whose structural role is to
      cap and terminate the Arp1 mini-filament, while ACTR1A - present in eight copies and actually forming
      that filament - has no GO:0005200 annotation at all, even though UniProt still cross-references
      one for it and budding-yeast ARP1 carries it by IDA. Has the assignment been inverted between the
      two paralogs?
    experts:
      - Schroer TA
      - Carter AP
  - question: Retiring the UniProt-keyword pipeline (GO_REF:0000043) removed ATP binding from ACTR1A and
      from every other human protein, including beta-actin itself, which nonetheless retains GO:0016887
      ATP hydrolysis activity. Should GOA replace the actin family's nucleotide-binding annotations by
      another route, given that human structures now model the nucleotide in all eight Arp1 protomers
      of dynactin?
  - question: ComplexPortal has annotated pig ACTR1A, DCTN1, DCTN2, DCTN4, DCTN5, CAPZA1 and CAPZB to
      GO:0030989 dynein-driven meiotic oscillatory nuclear movement with evidence IDA, citing PMID:36071160
      - a cryo-EM structure of dynein-dynactin on microtubules. The term is defined around an astral array
      emanating from a spindle pole body. These rows have been propagated to rat by ISO and are the only
      mammalian support behind human ACTR1A's GO:0030473 IBA. Should they be withdrawn?
    experts:
      - Carter AP
      - Chaaban S
  - question: Is GO:0106006 cytoskeletal protein-membrane anchor activity appropriate for any mammalian
      dynactin subunit? In human mitosis the cortical membrane link is supplied by Galphai-LGN-NuMA and
      LGN is required for cortical dynein-dynactin, so dynactin looks like the anchored partner rather
      than the anchor.
  - question: Do ACTR1A and ACTR1B have distinguishable functions, or is ACTR1B simply a minor variant
      subunit? Both are dynactin subunits with comparable mRNA distribution, yet they occur in the complex
      at about 15:1 in favour of ACTR1A, and every filament position in the human dynactin structure is
      assigned to ACTR1A. Is there any dynactin population, cell type or cargo for which ACTR1B incorporation
      matters?
    experts:
      - Schroer TA
  - question: Is the reported ACTR1A requirement for TLR2-driven cytokine induction a direct signalling
      role or an indirect consequence of dynactin-dependent receptor trafficking? It rests on one study
      combining cross-linking proteomics with knockdown.
  - question: SETD3 methylates ACTR1A in vitro. Is ACTR1A methylated in cells, at which histidine, and
      does the modification affect polymerisation or dynein activation?
suggested_experiments:
  - hypothesis: ACTR1A binds ATP at the retained actin cleft and hydrolyses it during or after incorporation
      into the dynactin filament, leaving the ADP state seen in the assembled complex.
    description: Measure nucleotide binding and turnover directly on purified recombinant human ACTR1A
      - filter binding or fluorescent-nucleotide exchange with ATP versus ADP, plus a malachite-green
      hydrolysis assay - to settle whether the correct molecular function is ATP binding, ADP binding,
      or both, and whether Arp1 is an ATPase at all.
    experiment_type: biochemistry (nucleotide binding and hydrolysis assays)
  - hypothesis: ACTR1A is required, at endogenous levels, for dynein-driven minus-end cargo transport,
      Golgi positioning and mitotic spindle orientation in human cells.
    description: Replace endogenous ACTR1A with a degron-tagged allele and follow minus-end-directed cargo
      transport, Golgi positioning and mitotic spindle orientation after acute depletion. This would give
      a human loss-of-function annotation at native expression levels, rather than relying on p50/dynamitin
      overexpression, which disperses the entire complex.
    experiment_type: acute degron depletion with live-cell imaging
  - hypothesis: The structural-constituent function of ACTR1A (polymerisation into a defined-length filament)
      is separable from its dynein-heavy-chain-binding function.
    description: Mutate the ACTR1A subdomain-2 loop identified here as the longitudinal polymerisation
      interface (residues 42-52) and ask, by cryo-EM and in vitro reconstitution, whether a shorter or
      non-polymerising filament still recruits the dynein tail and still activates processive motility
      - separating the structural-constituent function from the dynein-binding function.
    experiment_type: structure-guided mutagenesis with in vitro reconstitution
  - hypothesis: Mammalian dynactin does not itself supply a cytoskeleton-to-membrane anchoring activity;
      the cortical anchor is Galphai-LGN-NuMA and dynactin is the anchored partner.
    description: 'Test the anchoring question directly in human cells: tether dynactin to the plasma membrane
      optogenetically in LGN- and NuMA-depleted cells and ask whether cortical microtubule capture is
      restored. A positive result would justify GO:0106006 for mammalian dynactin; a negative one would
      justify removing it.'
    experiment_type: optogenetic cortical tethering in depleted cells
  - hypothesis: ACTR1B incorporation into dynactin is functionally consequential rather than incidental,
      and defines a minor dynactin population with distinct cargo selectivity.
    description: Tag ACTR1A and ACTR1B at their endogenous loci with distinguishable tags and quantify
      their incorporation into dynactin across cell types, then test whether ACTR1B-containing complexes
      differ in cargo selectivity - the paralog question has been open since the isoforms were separated
      in 1994.
    experiment_type: endogenous dual tagging with quantitative proteomics
