id: P15848
gene_symbol: ARSB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARSB (arylsulfatase B; N-acetylgalactosamine-4-sulfatase) is a lysosomal enzyme that removes
  4-sulfate groups from N-acetylgalactosamine residues during degradation of chondroitin sulfate and dermatan
  sulfate. A calcium-containing active site and a catalytic formylglycine residue support sulfate-ester
  hydrolysis. ARSB matures through the secretory pathway and reaches lysosomes through mannose-6-phosphate-dependent
  delivery. Its effects on sulfated glycans can influence extracellular matrix properties and cell behavior.
  Deficient ARSB activity causes mucopolysaccharidosis VI (Maroteaux-Lamy syndrome).
