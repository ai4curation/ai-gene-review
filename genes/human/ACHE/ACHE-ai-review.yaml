    id: GO:0120162
    label: positive regulation of cold-induced thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P21836
  - ensembl:ENSMUSP00000024099
  review:
    summary: AChE supports cold-induced thermogenesis through peripheral cholinergic homeostasis.
    action: KEEP_AS_NON_CORE
    reason: Full mouse Ache-knockout experiments compare 23 versus 29 degrees C, measure sympathetic-ganglion
      currents and rescue hypothermia pharmacologically. They support a conserved physiological contribution
      through control of transmitter exposure and receptor downregulation, not direct heat generation
      by AChE. The human annotation is a transfer from mouse P21836 and remains bounded by age and species.
    supported_by:
    - reference_id: PMID:17038428
      supporting_text: When kept at 23°C in isolation from the mother, AChE-deficient mice were easily
        distinguishable from their wild-type littermates, not only by their small body size, but also
        by their severe shivering behaviour.
