id: P22303
gene_symbol: ACHE
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Acetylcholinesterase is a serine hydrolase that rapidly converts acetylcholine to choline
  and acetate, terminating cholinergic signaling at neuromuscular and neuronal synapses. Alternative C-terminal
  isoforms form soluble, GPI-anchored or anchoring-protein-associated assemblies. The synaptic T isoform
  forms tetramers associated with COLQ or PRIMA1, whereas the H isoform forms GPI-anchored dimers. Acetylcholinesterase
  also binds extracellular matrix proteins and amyloid-beta and has context-dependent non-synaptic roles.
  Nuclear accumulation occurs in apoptotic cells; it is not the usual location of synaptic acetylcholine
  hydrolysis.
alternative_products:
