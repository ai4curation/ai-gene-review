- term:
    id: GO:0001507
    label: acetylcholine catabolic process in synaptic cleft
  evidence_type: NAS
  original_reference_id: PMID:1517212
  qualifier: involved_in
  review:
    summary: AChE hydrolyses acetylcholine released into the synaptic cleft.
    action: ACCEPT
    reason: Human catalytic-triad mutagenesis and curated reaction chemistry establish the enzymatic step
      terminating the synaptic signal. This is direct catabolic participation, distinct from receptor
      desensitization or acetylcholine transport.
    supported_by:
    - reference_id: PMID:1517212
    - reference_id: PMID:8349597
    - reference_id: file:human/ACHE/ACHE-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=acetylcholine + H2O = choline + acetate + H(+)
- term:
    id: GO:0001540
    label: amyloid-beta binding
  evidence_type: TAS
  original_reference_id: PMID:11283752
  qualifier: enables
  review:
    summary: AChE associates with amyloid-beta in aggregation experiments.
    action: KEEP_AS_NON_CORE
    reason: 'The original review is supplemented by primary experiments: human recombinant AChE promotes
      amyloid formation, and crosslinking demonstrates AChE–amyloid-beta association. The latter brain-enzyme
      abstract does not specify the donor species. Retain the interaction as a non-core property without
      claiming that it establishes a causal human Alzheimer disease pathway.'
    supported_by:
    - reference_id: PMID:8608006
      supporting_text: 'bovine brain AChE, as well as the human and mouse recombinant

        enzyme, accelerates amyloid formation'
    - reference_id: PMID:9493175
    - reference_id: PMID:11283752
- term:
    id: GO:0002076
    label: osteoblast development
  evidence_type: IEP
  original_reference_id: PMID:15454088
  qualifier: involved_in
  review:
    summary: The osteoblast study establishes expression and adhesion more clearly than osteoblast maturation.
    action: UNDECIDED
    reason: The accessible source reports differentiation-dependent expression/secretion and inhibitor-sensitive
      adhesion. Those observations do not by themselves distinguish a causal contribution to osteoblast
      development from a change accompanying differentiation. Full experimental detail needed to settle
      this more specific process was not recovered; the original IEP assertion is retained for reassessment,
      not declared false.
    supported_by:
    - reference_id: PMID:15454088
      supporting_text: 'Further analyses revealed

        differentiation-dependent secretion by osteoblasts'
