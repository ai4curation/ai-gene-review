    summary: DPYSL2 lacks the conserved catalytic apparatus for ancestral dihydropyrimidinase-type
      cyclic-amide hydrolysis.
    action: REMOVE
    reason: The target UniProt caution documents missing metal-cofactor ligands; the CRMP2 crystal
      structure and CRMP5 negative assay independently corroborate loss of this ancestral reaction
      in the CRMP subfamily. The OpenScientist report supplies residue-level comparisons, with direct-assay
      and paralog-inference limitations kept explicit. These data challenge retention of catalytic
      activity in this target, rather than the strength or number of phylogenetic donors.
