- term:
    id: GO:0006139
    label: nucleobase-containing compound metabolic process
  evidence_type: TAS
  original_reference_id: PMID:8973361
  qualifier: involved_in
  review:
    summary: The legacy broad metabolic-process assertion cannot be judged solely from loss of dihydropyrimidinase
      catalysis.
    action: UNDECIDED
    reason: PMID:8973361 is available here only as an abstract documenting cloning, homology and
      expression. GO:0006139 covers metabolism of nucleobases, nucleotides and nucleic acids; loss
      of one hydrolytic reaction does not exclude noncatalytic participation in that broad process.
      A relevant metabolic role is not established by the accessible material, but absence of the
      original full text prevents a confident source-level rejection. Keep the specific catalytic
      rejection separate. The existing CRMP1 OpenScientist report addresses this shared legacy issue,
      but its abstract-only verification does not settle the full-text question; no duplicate adjudication
      is needed.
    supported_by:
    - reference_id: PMID:8973361
      supporting_text: "We have isolated cDNA clones encoding dihydropyrimidinase (DHPase) from\
        \ human \nliver and its three homologues from human fetal brain."
    - reference_id: file:human/CRMP1/CRMP1-hypotheses/function-hypothesis-go-0016812/openscientist.md
