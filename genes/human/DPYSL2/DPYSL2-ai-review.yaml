- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:21516116
  qualifier: enables
  review:
    summary: Homomeric association is an established structural property of CRMP assemblies.
    action: ACCEPT
    reason: CRMPs form homo- and heterotetramers, and oligomeric assembly is part of their core
      cytoskeletal signaling architecture. Identical protein binding specifies self-association
      and is not equivalent to uninformative generic protein binding. Retain the supported annotation
      without claiming that every tetramer is constitutively stable.
    supported_by:
    - reference_id: PMID:23373749
      supporting_text: 'CRMPs exist as homo- and/or hetero-tetramers in vivo and

        participate in signaling transduction, cytoskeleton rearrangements, and

        endocytosis.'
