# yaml-language-server: $schema=../../../src/ai_gene_review/schema/gene_review.yaml
id: Q16555
gene_symbol: DPYSL2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Dihydropyrimidinase-related protein 2 (DPYSL2/CRMP2), a brain-enriched cytoplasmic protein
  of the collapsin-response-mediator (CRMP) / dihydropyrimidinase family. Although it belongs to the metallo-dependent
  hydrolase superfamily, it lacks the conserved metal-cofactor-binding residues and has no dihydropyrimidinase
  activity - it is a pseudoenzyme with respect to this ancestral reaction. CRMP2 is a key cytoskeletal
  regulator in semaphorin-3A signaling: it binds tubulin heterodimers to promote microtubule assembly
  and axon specification/growth, mediates growth-cone collapse and neuronal polarity, and is inactivated
  by GSK3B/CDK5/ROCK phosphorylation. It forms homo- and hetero-tetramers with other CRMPs and also participates
  in vesicle/endocytic trafficking.'
