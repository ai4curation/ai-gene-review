    summary: Negative regulation of programmed cell death, by similarity to mouse Alivin 1, whose overexpression
      protects granule neurons. Supported in human endothelial cells too; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Mouse AMIGO2 (Alivin 1) protects cerebellar granule neurons from apoptosis [PMID:12843293
