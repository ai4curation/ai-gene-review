  title: Alivin 1, a novel neuronal activity-dependent gene, inhibits apoptosis and promotes survival
    of cerebellar granule neurons.
  findings:
  - statement: Mouse Alivin 1 (AMIGO2) protects granule neurons from apoptosis.
    supporting_text: Overexpression of Ali1 in cerebellar granule neurons inhibited apoptosis that was
      induced by the medium containing 5 mm KCl.
  - statement: Alivin 1 promotes depolarization-dependent survival.
    supporting_text: These results suggest that expression of ali1 promotes depolarization-dependent survival
      of the granule neuron.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Mouse.
- id: PMID:26553931
  title: AMIGO2, a novel membrane anchor of PDK1, controls cell survival and angiogenesis via Akt activation.
  findings:
  - statement: AMIGO2 is a scaffold for PDK1 membrane localization.
    supporting_text: We report that adhesion molecule with IgG-like domain 2 (AMIGO2) is a novel scaffold
      protein that regulates PDK1 membrane localization and Akt activation.
  - statement: AMIGO2 residues 465-474 bind the PDK1 PH domain.
    supporting_text: Amino acid residues 465-474 in AMIGO2 directly bind to the PDK1 pleckstrin homology
      domain.
  - statement: Binding is direct with purified proteins.
    supporting_text: His-PDK1PH proteins, but not His-PDK1kinase, could bind to GST-AMIGO2CD under cell-free
      conditions
  - statement: Loss of AMIGO2 causes endothelial apoptosis.
    supporting_text: Loss of AMIGO2 in endothelial cells (ECs) led to apoptosis and inhibition of angiogenesis
      with Akt inactivation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human endothelial cells; source of the NEW protein kinase binding
      row.
