id: Q86SJ2
gene_symbol: AMIGO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMIGO2 (also DEGA or Alivin 1) is a type I transmembrane protein of the AMIGO family, with
  leucine-rich repeats and an immunoglobulin domain outside the cell. It mediates homophilic and heterophilic
  adhesion with the other AMIGO proteins, and in the mouse retina it acts as a cell-type-specific scaling
  factor that limits the dendritic arbors of starburst amacrine and rod bipolar cells. Its cytoplasmic
  domain binds the PH domain of PDK1 directly, recruiting PDK1 to the plasma membrane and supporting Akt
  activation; in endothelial cells this promotes survival and angiogenesis, and in neurons AMIGO2 supports
  activity-dependent survival. AMIGO2 is differentially expressed in gastric adenocarcinoma, and its knockdown
  reduces tumor cell adhesion and tumorigenicity.
