      working positive control, shows the shape of the error: GO:0031629 returns 46 human rows carrying the
      genuinely synaptic set - complexins, synaptotagmins, RAB3A, SNAP25, STX1B - and alongside them
      STX11, STX19 and STX2, three non-synaptic syntaxins, which is the signature of one assertion placed
      above a divergence. What stops this being a removal is that two of the arguments available for
      STXBP2 are not available here: UniProt calls syntaxin-11 broadly expressed, so there is no
      expression argument, and the paper that cloned it reports an in vitro SNARE complex with VAMP2, so
      the chemistry is not excluded either. The fix belongs at the node, not on this row, which is why it
      is also recorded as a source defect.
    supported_by:
    - reference_id: file:human/STX11/STX11-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: This SNARE complex plays a critical role in the regulated exocytosis of cytotoxic
        granules by natural killer (NK) cells and cytotoxic T-lymphocytes
    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      record: PANTHER:PTN000461527
      slot: IBD annotation
      requested_change: CHECK
      asserted_value: Synaptic terms GO:0031629 and GO:0048787 asserted at a syntaxin node whose
        descendants include the non-synaptic syntaxins STX2, STX11 and STX19
      corrected_value: Move the assertions to the STX1A/STX1B branch, or re-state them at the ancestral node
        with terms that are not synapse-specific
      cause: OVER_PROPAGATION
      confidence: SUSPECTED
      explanation: >-
        Recorded at SUSPECTED, lower than the matching claim in this project's STXBP2 review, and the
        difference is deliberate. There the gene had no neural expression at all and a named neuronal
        paralog carrying the function, so the rows were removed; here UniProt calls syntaxin-11 broadly
        expressed, and the paper that cloned it reports an in vitro complex with VAMP2, so a synaptic
        pairing cannot be ruled out from expression or chemistry alone. What can be said is that no
        publication places this protein at a synapse, that its cognate partners throughout the record are
        SNAP23 with VAMP8 or VAMP4, and that two further non-synaptic syntaxins carry the same pair of
        terms. A PAINT curator with the tree can settle in one look whether the assertion sits above the
        divergence.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
