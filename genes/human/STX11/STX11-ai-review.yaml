- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25910212
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61764
  review:
    summary: Bare protein binding for the STXBP1 interaction, from an interactome-perturbation screen of disease
      alleles.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept as a supported generic binding row because GO cannot express it, which is the case the ClinGen
      Mendelian project's standing instruction is written for. The partner is STXBP1. The partner is the neuronal
      paralog of this protein's real SM partner. Sec1/Munc18 proteins bind syntaxins through a conserved surface
      and are promiscuous for them in vitro, so recovering Munc18-1 is unsurprising; in a lymphocyte the partner
      is Munc18-2, and Munc18-1 is not expressed there. GO has no term for binding a Sec1/Munc18 protein: the
      partner-specific vocabulary runs the other way, so STXBP2's own record can say syntaxin binding for this
      very interaction while syntaxin-11's record cannot say anything but protein binding. Marked non-core rather
      than modified for that reason, and non-core rather than core because the term as written carries no
      functional information even though the interaction it stands for is central. The asymmetry is raised as a
      question below.
