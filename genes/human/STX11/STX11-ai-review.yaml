  review:
    summary: Helical-bundle zippering fusogenic activity, propagated from the SNARE clade.
    action: ACCEPT
    reason: >-
      Core. This is the activity term for a SNARE: the exergonic zippering of a four-helix bundle assembled
      from motifs contributed by proteins in the two apposed membranes, releasing the energy that overcomes
      the bilayer merger barrier. Syntaxin-11 contributes the Qa helix, and the gene has three experimental
      rows for the same term in this record. Note that GO's convention here is enables rather than
      contributes_to even though the activity belongs to the assembled bundle rather than to any one
      subunit; the single contributes_to row on the parent term is the one place this record marks that
      distinction.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
