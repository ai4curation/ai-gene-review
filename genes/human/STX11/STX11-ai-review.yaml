  review:
    summary: Bare protein binding for the SNAP25 interaction, from the Stelzl human interaction network.
    action: MODIFY
    reason: >-
      Refined rather than kept generic, because this row's own WITH/FROM field names the partner and the partner
      is a SNARE. The row comes from the Stelzl human interaction network, a matrix yeast two-hybrid screen
      published in 2005 alongside the CCSB map, which recovered SNAP25. GO:0000149 SNARE binding is the term that
      states it and is the deepest one available: SNARE binding has no children other than the two surviving
      syntaxin-specific terms, and neither fits this partner. The gene already carries GO:0000149 by phylogenetic
      inference, so the refinement brings the row into line with the record rather than adding a claim to it.
      SNAP25 is the neuronal counterpart of SNAP23 and syntaxin-11 was shown to bind it in vitro in the paper that
      cloned the gene, so the pairing is real chemistry; it is the physiological relevance that is doubtful: the
      two have never been shown to be partners in any cell type where either protein's own function has been
      established.
