  supported_by:
  - reference_id: PMID:10036234
    supporting_text: Like other syntaxin family members, syntaxin 11 binds to the SNARE proteins VAMP and
      SNAP-23 in vitro and also exists in a complex with SNAP-23 in transfected HeLa cells and in native
      human B lymphocytes.
  - reference_id: PMID:10036234
