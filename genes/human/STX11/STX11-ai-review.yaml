  review:
    summary: SNARE binding, propagated from the syntaxin clade.
    action: ACCEPT
    reason: >-
      Core, and the propagation says something the gene's own rows do not. Syntaxin-11 binds SNAREs by its
      own experimental evidence several times over - SNAP23 and VAMP in vitro and in native B lymphocytes,
      VAMP8 in activated cytotoxic T lymphocytes, VAMP4 in endosome-to-plasma-membrane traffic, and VTI1B
      on late endosomes - and this row adds that the capability is inherited from the clade rather than
      lineage-specific. The donor list is broad across animals, plants and yeast, which is what a
      SNARE-domain-level assertion should look like. This review also refines twelve bare protein-binding
      rows onto this term, so the record will state the claim from both the phylogenetic and the
      experimental side.
