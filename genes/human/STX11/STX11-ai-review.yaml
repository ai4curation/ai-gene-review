    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19804848
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q15833
  review:
    summary: Bare protein binding for the STXBP2 interaction, from the FHL5 mapping study.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept as a supported generic binding row because GO cannot express it, which is the case the ClinGen
      Mendelian project's standing instruction is written for. The partner is STXBP2. This is not a screen hit: it
      comes from one of the two studies that identified FHL5, where the interaction was shown directly, broken by
      the patients' own missense alleles, and found to stabilise both proteins - and UniProt locates the binding
      surface at residues 1 to 25 of syntaxin-11. It is the best-supported interaction in this record. GO has no
      term for binding a Sec1/Munc18 protein: the partner-specific vocabulary runs the other way, so STXBP2's own
      record can say syntaxin binding for this very interaction while syntaxin-11's record cannot say anything but
      protein binding. Marked non-core rather than modified for that reason, and non-core rather than core because
      the term as written carries no functional information even though the interaction it stands for is central.
      The asymmetry is raised as a question below.
