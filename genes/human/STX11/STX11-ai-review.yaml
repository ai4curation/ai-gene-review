core_functions:
- molecular_function:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  description: >-
    A target-membrane SNARE, and an atypical one whose atypical feature is load-bearing. Syntaxin-11
    contributes the Qa helix to a four-helix bundle whose zippering releases the energy that merges two
    bilayers; SNAP23 supplies the Qbc helices and VAMP8 the R helix on the granule. The protein was found
    by using SNAP-23 as bait in a two-hybrid screen of a B-lymphocyte library and shown in that same paper
    to bind VAMP and SNAP-23 in vitro and to exist in a complex with SNAP-23 in native human B lymphocytes
    - and to have no obvious transmembrane domain, being palmitoylated instead. In a reconstituted
    cell-cell fusion assay that absence has a measurable consequence: the complete SNARE set drives lipid
    exchange but not cytoplasmic continuity, so it stops at hemifusion, and complete fusion appears only
    when Munc18-2 is added. In primary human cytotoxic T lymphocytes the protein is carried to the
    immunological synapse through recycling endosomes, clusters there, and knocking it down abolishes
    lytic granule fusion while the granules still arrive - which localises the requirement to the fusion
    step itself. The activity is a property of the assembled bundle rather than of any one subunit, which
    is why the record's contributes_to row on the parent fusogenic-activity term is kept beside the four
    enables rows on this one.
  directly_involved_in:
  - id: GO:0043316
