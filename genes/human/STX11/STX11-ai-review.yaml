      record rather than adding a claim to it. SNAP23 is this protein's cognate Qbc-SNARE, identified by using
      SNAP-23 as the bait that found syntaxin-11 in the first place, and the pair is in the complex that performs
      cytotoxic granule fusion - so here the refinement states something the record elsewhere establishes
      mechanistically.
    proposed_replacement_terms:
    - id: GO:0000149
      label: SNARE binding
    supported_by:
    - reference_id: PMID:10036234
      supporting_text: Like other syntaxin family members, syntaxin 11 binds to the SNARE
        proteins VAMP and SNAP-23 in vitro and also exists in a complex with SNAP-23 in transfected
        HeLa cells and in native human B lymphocytes.
