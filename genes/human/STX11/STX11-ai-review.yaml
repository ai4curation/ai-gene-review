- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33961781
  qualifier: enables
  supporting_entities:
  - UniProtKB:O00161
  review:
    summary: Bare protein binding for the SNAP23 interaction, from BioPlex 3.0.
    action: MODIFY
    reason: >-
      Refined rather than kept generic, because this row's own WITH/FROM field names the partner and the partner
      is a SNARE. The row comes from BioPlex 3.0, proteome-scale affinity-purification mass spectrometry in 293T
      and HCT116 cells, which recovered SNAP23. GO:0000149 SNARE binding is the term that states it and is the
      deepest one available: SNARE binding has no children other than the two surviving syntaxin-specific terms,
      and neither fits this partner. The gene already carries GO:0000149 by phylogenetic inference, so the
      refinement brings the row into line with the record rather than adding a claim to it. SNAP23 is this
      protein's cognate Qbc-SNARE, identified by using SNAP-23 as the bait that found syntaxin-11 in the first
      place, and the pair is in the complex that performs cytotoxic granule fusion - so here the refinement states
      something the record elsewhere establishes mechanistically.
    proposed_replacement_terms:
    - id: GO:0000149
      label: SNARE binding
    supported_by:
    - reference_id: PMID:10036234
      supporting_text: Like other syntaxin family members, syntaxin 11 binds to the SNARE
        proteins VAMP and SNAP-23 in vitro and also exists in a complex with SNAP-23 in transfected
        HeLa cells and in native human B lymphocytes.
