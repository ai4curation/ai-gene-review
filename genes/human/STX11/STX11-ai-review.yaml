- term:
    id: GO:0031201
    label: SNARE complex
  evidence_type: IDA
  original_reference_id: PMID:21388490
  qualifier: part_of
  negated: true
  review:
    summary: A NOT annotation - syntaxin-11 does not form a SNARE complex - recording the macrophage
      study's negative result, which this review keeps as a context-specific finding.
    action: ACCEPT
    reason: >-
      This row is negated, and that is what the paper found: in activated macrophages syntaxin-11 did not
      form a typical trans-SNARE complex, although it did bind the Q-SNARE VTI1B and could regulate
      VTI1B's availability to form the Stx6/Stx7/Vti1b and Stx7/Stx8/Vti1b complexes. A published negative
      result is worth keeping, and UniProt files the VTI1B mechanism as proposed rather than established,
      consistent with that reading. The record therefore holds both polarities for one term, and both are
      right in their own setting: in a macrophage endosome syntaxin-11 acts on another SNARE's complex
      rather than entering a fusion bundle of its own, while in an activated cytotoxic T lymphocyte it
      contributes the Qa helix of a STX11/SNAP23/VAMP8 complex that was characterised six years later.
      The one reservation worth recording is scope: GO negations are gene-level, so a result obtained in
      one cell type with one partner set reads as a claim about the protein, which is more than the
      authors said. A context extension naming the cell type would fix that; absent one, the contradiction
      is declared rather than resolved by deleting the weaker row.
    consistency_exception:
      reason: >-
        A NOT and three positive rows on GO:0031201 that reflect genuinely different biological contexts.
        The negation is from PMID:21388490, in activated macrophages, where syntaxin-11 binds VTI1B and
        regulates that SNARE's complexes without forming a typical trans-SNARE complex itself. The
        positive rows are the STX11/SNAP23/VAMP8 complex in activated cytotoxic T lymphocytes
        (PMID:28265073, with SNAP23 and VAMP8 named in the WITH/FROM field), the clade-level inference,
        and a manual transfer from the mouse ortholog. Neither polarity is deleted, because deleting the
        negation would lose a real negative result and deleting the positives would contradict the
        protein's core function.
    supported_by:
    - reference_id: PMID:21388490
      supporting_text: While Stx11 did not form a typical trans-SNARE complex, it did bind to the Q-SNARE
        Vti1b and was able to regulate the availability of Vti1b to form the Q-SNARE complexes
        Stx6/Stx7/Vtib and Stx7/Stx8/Vti1b.
    - reference_id: file:human/STX11/STX11-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: In another proposed mechanism, STX11 may function as a regulator of the SNARE VTI1B
        on late endosomes to regulate trafficking from late endosomes to lysosomes
