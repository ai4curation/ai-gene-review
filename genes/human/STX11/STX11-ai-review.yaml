        source_status: SOURCE_BAD
        comment: >-
          Not a donor-count objection - a node seeded by one well-characterised gene can be entirely sound.
          The objection is to the term: what the syntaxin clade inherits is the ability to form a t-SNARE
          bundle, and the node carries the neuronal instance of it, so every non-synaptic descendant
          acquires a synapse. The comparator pattern is the tell, since STX11, STX19 and STX2 - none of
          them synaptic - carry both of these terms alongside STX1A and STX1B.
      residue_claims_not_applicable: A question about node placement and cell type, not about the presence
