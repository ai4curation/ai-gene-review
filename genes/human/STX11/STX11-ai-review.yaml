id: O75558
gene_symbol: STX11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  STX11 encodes syntaxin-11, the target-membrane SNARE that performs the final fusion step of cytotoxic
  granule exocytosis. It is atypical for a syntaxin in a way that turns out to matter: it has no
  transmembrane domain, and is held in the bilayer instead by palmitoylation of a C-terminal cysteine-rich
  region, which is also what polarises it to the immunological synapse. In a cytotoxic T lymphocyte or
  natural killer cell it is delivered to the synapse through a subpopulation of recycling endosomes,
  clusters there, and those clusters are the platform on which arriving lytic granules fuse; it
  contributes the Qa helix of a four-helix bundle completed by SNAP23 and VAMP8. On its own that bundle
  gets only as far as hemifusion - lipid mixing without cytoplasmic continuity - and complete fusion
  requires Munc18-2, with which syntaxin-11 forms a mutually stabilising complex through its own first
  twenty-five residues. Biallelic loss of function causes familial haemophagocytic lymphohistiocytosis
  type 4, in which cytotoxic lymphocyte degranulation fails; mutations in STXBP2, the gene for Munc18-2,
  cause the phenotypically similar type 5, which is the clearest evidence that the two proteins serve one
  reaction. Outside the killer cell the same SNARE serves constitutive delivery from endosomes to the cell
  surface, carrying TLR4 in macrophages and CD36 in muscle satellite cells with SNAP23 and VAMP4, and it
  also binds VTI1B on late endosomes, where it has been proposed to regulate that SNARE's availability for
  late endosome to lysosome fusion.
