- term:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  evidence_type: IMP
  original_reference_id: PMID:24227526
  qualifier: enables
  review:
    summary: Helical-bundle zippering fusogenic activity, from knockdown in primary human cytotoxic T
      lymphocytes.
    action: ACCEPT
    reason: >-
      Core, and the loss-of-function counterpart of the reconstituted result. Downregulating endogenous
      syntaxin-11 completely inhibits lytic granule fusion, with the granules' dwell time at the synapse
      falling as well - so the protein is not merely present at the fusion site but required for the fusion
      event. In primary human effector cells rather than a cell line.
    supported_by:
    - reference_id: PMID:24227526
      supporting_text: Downregulation of endogenous Stx11 resulted in a complete inhibition of LG fusion
        that was paralleled by a reduction in LG dwell time at the IS.
