      syntaxin 11.
  - reference_id: PMID:28265073
    supporting_text: we show that lipid-anchored STX11 and its cognate SNARE proteins mainly support
      exchange of lipids but not cytoplasmic content between cells, resembling hemifusion
  - reference_id: PMID:24227526
    supporting_text: Downregulation of endogenous Stx11 resulted in a complete inhibition of LG fusion that
      was paralleled by a reduction in LG dwell time at the IS.
  - reference_id: file:human/STX11/STX11-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: This SNARE complex plays a critical role in the regulated exocytosis of cytotoxic
      granules by natural killer (NK) cells and cytotoxic T-lymphocytes
  knowledge_gaps:
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      Why a lipid anchor is not enough, and what Munc18-2 supplies in its place, is unresolved. A
      transmembrane helix transmits force into the bilayer; a palmitoyl chain in one leaflet may not, which
      is the obvious explanation for why syntaxin-11's own SNARE set stalls at hemifusion. But that has not
      been tested directly - nobody has replaced the cysteine-rich tail with a transmembrane segment and
      asked whether the requirement for Munc18-2 disappears - and the alternative, that Munc18-2 is needed
      for a reason unrelated to the anchor, is equally consistent with the data. The answer decides whether
      FHL4 and FHL5 are two lesions in one mechanism or in two.
    dark_aspect: MF_DARK
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      Whether palmitoylation is a switch or only an anchor is open. UniProt records, from the mouse
      protein, that palmitoylation by ZDHHC20 releases syntaxin-11 from a locked inactive conformation and
      that ABHD17A removes it, which would make the modification a regulated gate on fusion competence
      rather than a means of membrane attachment. For the human protein only the anchoring and the
      synaptic polarisation have been shown. If the conformational switch holds, the enzymes that write and
      erase the modification become part of the exocytosis machinery, and nothing in this record says so.
    dark_aspect: BP_DARK
suggested_questions:
- question: >-
    GO cannot state this protein's most important interaction, and the gap is directional. Syntaxin-11
    binds Munc18-2, the SM protein that chaperones it to the plasma membrane and then drives its SNARE
    complex to complete fusion; the interaction is direct, disease-linked on both sides, mapped to
    residues 1 to 25 of syntaxin-11, and recorded by UniProt with six supporting publications. On
    Munc18-2's record it can be expressed as GO:0019905 syntaxin binding. On syntaxin-11's record there is
    no term for binding a Sec1/Munc18 protein, so four rows in this review state the same interaction as
    bare protein binding and are kept as non-core for want of anything better. Should the partner-specific
    binding vocabulary be symmetric, or should both directions move to annotation extensions?
- question: >-
    A kinase keeps appearing in screens of this protein and nobody has followed it up. Syntaxin-11 is
    recovered with TBK1 by four independent datasets - two BioPlex releases, a multimodal cell map and a
    liver yeast two-hybrid network - and with SIKE1, a suppressor of TBK1, by two more. That is better
    replication than most of the 98 partners in this record, and TBK1 has its own connections to membrane
    traffic and autophagy, yet no publication links it to syntaxin-11. Is this a real module, or the kind
    of recurrent hit that a long coiled-coil protein attracts across platforms?
- question: >-
    All three mammalian Munc18 paralogs and three non-synaptic syntaxins - STX2, STX11 and STX19 - carry
    presynaptic terms by phylogenetic propagation from nodes seeded by single neuronal genes. This review
    marks both such rows on this gene over-annotated and records the node as a query for PANTHER; the
    companion STXBP2 review removes the equivalent rows, because there the gene has no neural expression
    and a named neuronal paralog. Is the right fix per-gene, or should PAINT re-state these ancestral
    assertions with terms that are not synapse-specific?
suggested_experiments:
- description: >-
    Swap the anchor. Replace syntaxin-11's C-terminal cysteine-rich region with the transmembrane helix of
    syntaxin-3 or syntaxin-4 and run the chimera through the reconstituted cell-cell fusion assay with
    SNAP23 and VAMP8. If the chimera reaches complete fusion without Munc18-2, the SM protein is
    compensating for the lipid anchor; if it still needs Munc18-2, the requirement is something else, and
    the same chimera expressed in FHL4 patient cytotoxic T lymphocytes should then fail to rescue
    degranulation.
- description: >-
    Test the palmitoylation switch in human cells. Knock down ZDHHC20 and ABHD17A separately in primary
    human cytotoxic T lymphocytes and score syntaxin-11's membrane association, its polarisation to the
    immunological synapse and lytic granule fusion by evanescent-wave imaging. A switch model predicts
    that losing the acyltransferase blocks fusion while leaving the protein expressed, and that losing the
    thioesterase locks it in a fusion-competent state.
- description: >-
    Decide whether the TBK1 pairing is real before anybody annotates it. Immunoprecipitate endogenous
    syntaxin-11 from primary human cytotoxic lymphocytes and from macrophages and ask whether TBK1 and
    SIKE1 are recovered without tagging or overexpression; if they are, score whether TBK1 inhibition
    changes syntaxin-11's palmitoylation, its delivery to the synapse or granule fusion. A negative result
    is worth having too, since four datasets currently point at a relationship that no experiment has
    tested.
