          The target appearing in its own WITH/FROM marks that experimental grounding exists on the target
          - three IDA or IMP rows for this term in this record - and is how IBD nodes are placed, not
          redundancy.
      residue_claims_not_applicable: An inherited activity assertion; no residue-level claim is involved.
- term:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  evidence_type: IDA
  original_reference_id: PMID:10036234
  qualifier: enables
  review:
    summary: Helical-bundle zippering fusogenic activity, from the paper that cloned syntaxin-11.
    action: ACCEPT
    reason: >-
      Core, and this is where the protein's SNARE identity was established: found by using SNAP-23 as bait
      in a two-hybrid screen of a B-lymphocyte library, then shown to bind VAMP and SNAP-23 in vitro and to
      exist in a complex with SNAP-23 both in transfected cells and in native human B lymphocytes. The same
      paper reports the feature that makes this protein unusual among syntaxins and that still shapes its
      mechanism - no obvious transmembrane domain.
    supported_by:
    - reference_id: PMID:10036234
      supporting_text: Like other syntaxin family members, syntaxin 11 binds to the SNARE proteins VAMP and
        SNAP-23 in vitro and also exists in a complex with SNAP-23 in transfected HeLa cells and in native
        human B lymphocytes.
    - reference_id: PMID:10036234
      supporting_text: Unlike other syntaxin family members, no obvious transmembrane domain is present in
        syntaxin 11.
- term:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  evidence_type: IDA
  original_reference_id: PMID:28265073
  qualifier: enables
  review:
    summary: Helical-bundle zippering fusogenic activity, from the reconstituted cell-cell fusion assay.
    action: ACCEPT
    reason: >-
      Core, and the row with the most to say about the limits of the activity. In the reconstituted system
      lipid-anchored syntaxin-11 with its cognate SNAREs produces lipid exchange without cytoplasmic
      continuity - hemifusion - and complete fusion appears only when Munc18-2 is added. So the zippering
      activity is real and attributable to this SNARE set, but on its own it does not finish the job, which
      is the mechanistic explanation for why mutations in either gene cause the same disease.
    supported_by:
    - reference_id: PMID:28265073
      supporting_text: whether a SNARE such as STX11, which lacks a transmembrane domain, can support
        membrane fusion in vivo is uncertain
    - reference_id: PMID:28265073
      supporting_text: we show that lipid-anchored STX11 and its cognate SNARE proteins mainly support
        exchange of lipids but not cytoplasmic content between cells, resembling hemifusion
