    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-annotated rather than removed, and the difference from this project's STXBP2 review is
      deliberate. What is wrong is the same: the term requires a synaptic vesicle fusing with a presynaptic
      active zone membrane, and syntaxin-11's documented partners throughout this record are SNAP23 with
      VAMP8 in cytotoxic granule fusion and SNAP23 with VAMP4 in endosome-to-plasma-membrane traffic, with
