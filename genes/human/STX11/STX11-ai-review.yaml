- term:
    id: GO:0001772
    label: immunological synapse
  evidence_type: IDA
  original_reference_id: PMID:24227526
  qualifier: is_active_in
  review:
    summary: Immunological synapse as the compartment of action, from live imaging in primary human
      cytotoxic T lymphocytes.
    action: ACCEPT
    reason: >-
      Core, and the strongest form of this claim in the record. Dual-colour evanescent-wave imaging shows
      syntaxin-11 arriving at the synapse through recycling endosomes and then clustering there, with the
      clusters serving as the platform that arriving lytic granules fuse at; knocking it down abolishes
      granule fusion entirely. is_active_in rather than located_in is right, because the synapse is not
      somewhere the protein is found incidentally but the site it is delivered to in order to work.
    supported_by:
    - reference_id: PMID:24227526
      supporting_text: Dual color evanescent wave imaging suggested a sequential process, in which first
        Stx11 is transported to the IS through a subpopulation of recycling endosomes.
    - reference_id: PMID:24227526
      supporting_text: We conclude that Stx11 functions as a t-SNARE for the final fusion of LG at the IS,
        explaining the severe phenotype of familial hemophagocytic lymphohistiocytosis type 4 on a
        molecular level.
- term:
    id: GO:0001772
    label: immunological synapse
  evidence_type: IDA
  original_reference_id: PMID:24910990
  qualifier: is_active_in
  review:
    summary: Immunological synapse, from the S-acylation study in natural killer cells.
    action: ACCEPT
    reason: >-
      The same claim with its mechanism attached, which is why it is kept beside the other two rows rather
      than treated as a duplicate. The C-terminal cysteine-rich region is S-acylated, and that modification
      is what both associates syntaxin-11 with membranes and polarises it to the synapse in NK cells
      conjugated to targets; deleting the region abolishes the polarisation and with it the recruitment of
      Munc18-2. UniProt curates the synapse localisation against this PMID and the palmitoylation as the
      anchor.
