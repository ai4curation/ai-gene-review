knowledge_gaps:
- gap_statement: Whether human ATOSB regulates transcription, which genes it controls, and whether it
    acts through a Porthos ortholog (DDX family helicase) are unknown.
  boundary: 'Established: domain conservation with fly Atossa, and the ability of mouse ATOSA/ATOSB to
    rescue the fly atossa mutant (cross-species complementation). A GFP-fusion screen places ATOSB in
    the nucleus; Human Protein Atlas immunofluorescence reports nucleoplasm and nucleolar fibrillar centre;
    ATOSB is not in OpenCell. Not established by any cited vertebrate study: DNA or chromatin binding,
    target genes, functionally validated partners (only Y2H screen hits exist), or any physiological role.'
