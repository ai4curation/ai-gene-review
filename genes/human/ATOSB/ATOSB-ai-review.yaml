suggested_questions:
- question: Does ATOSB, alone or redundantly with ATOSA, regulate mitochondrial bioenergetics or invasion
    in mammalian macrophages, and which DEAD-box helicase, if any, is its Porthos counterpart?
suggested_experiments:
- description: Knock out ATOSB (and ATOSA) in human or mouse macrophages and profile transcription, translation
    of metabolic enzymes, respiration and tissue invasion; test whether the recurrent Y2H partners IKZF1
    and CEP70 bind endogenous ATOSB.
