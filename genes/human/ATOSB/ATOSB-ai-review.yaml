    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: GO_REF:0000054
  qualifier: located_in
  review:
    summary: Nucleus (IDA, GFP-fusion localization screen). Fly Atossa is a nuclear protein with three
      nuclear localization signals and a nuclear export signal. Its mouse orthologs (FAM214A and FAM214B,
      about 40% identical and domain-conserved) rescue the fly mutant, which supports conserved function.
      The human IDA row comes from a GFP-fusion localization screen. Accepted.
    action: ACCEPT
    reason: '[PMID:35319107 "Here, we study a previously uncharacterized nuclear protein, Atossa (encoded
      by CG9005), which supports macrophage invasion into the germband of Drosophila by controlling cellular
      metabolism."] [PMID:35319107 "Atos also displays two trans‐activating domains (TADs) common among
      transcription factors, three nuclear localization signals (NLS), and a nuclear export signal (NES)."]
      [PMID:35319107 "Expression in macrophages of either mFAM214A or B in atosPBG rescued the germband
      invasion defect as efficiently as the Drosophila protein itself (Fig 2E and F) and restored the
      normal number of macrophages on the yolk neighboring the extended germband (Fig EV2E)."]'
    supported_by:
    - reference_id: PMID:35319107
      supporting_text: Here, we study a previously uncharacterized nuclear protein, Atossa (encoded by
        CG9005), which supports macrophage invasion into the germband of Drosophila by controlling cellular
        metabolism.
    - reference_id: PMID:35319107
      supporting_text: Atos also displays two trans‐activating domains (TADs) common among transcription
        factors, three nuclear localization signals (NLS), and a nuclear export signal (NES).
    - reference_id: PMID:35319107
      supporting_text: Expression in macrophages of either mFAM214A or B in atosPBG rescued the germband
        invasion defect as efficiently as the Drosophila protein itself (Fig 2E and F) and restored the
        normal number of macrophages on the yolk neighboring the extended germband (Fig EV2E).
