id: Q7L5A3
gene_symbol: ATOSB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ATOSB (Atos homolog B, formerly FAM214B) is a vertebrate ortholog of Drosophila Atossa.
  It shares a conserved DUF4210 domain and a C-terminal Chr_Seg (Atos-like) domain with the fly protein,
  and UniProt annotates two predicted transactivation domains by similarity. Fly Atossa is a nuclear transcription
  regulator in macrophages: it raises mRNA levels of the DEAD-box protein Porthos and of metabolic enzymes,
  boosting mitochondrial bioenergetics and tissue invasion. Mouse ATOSB can substitute for it in flies.
  In large-scale yeast two-hybrid screens ATOSB recovers many partners, including IKZF1, CEP70 and FHL5.'
