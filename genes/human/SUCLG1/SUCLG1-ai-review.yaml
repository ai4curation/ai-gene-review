proposed_new_terms:
- proposed_name: itaconate-CoA ligase activity
  proposed_definition: 'Catalysis of the reaction: itaconate + a nucleoside triphosphate + CoA = itaconyl-CoA +
    a nucleoside diphosphate + phosphate.'
  justification: UniProt records itaconyl-CoA ligase as an alternative activity of the succinyl-CoA synthetase subunits
    and cites PMID:40108300 for it. Only the abstract of that paper is cached; its bioRxiv preprint (doi 10.1101/2024.09.25.614871,
    version 1) reports that the recombinant human enzymes form itaconyl-CoA with catalytic efficiencies 30-fold
    (ADP-forming) and 15-fold (GDP-forming) lower than with succinate. The activity is contested, because an earlier
    study found that neither recombinant SCS-A nor pig heart SCS-G converted itaconate at 10 mM and that itaconate
    inhibits the enzyme (PMID:34492704). A search of GO found no term for this activity, so it is currently carried
    only under the parent GO:0016878 acid-thiol ligase activity. It is a side activity of the enzyme, so the term
    would be used as non-core. The parent is GO:0016878 and not GO:0016405 CoA-ligase activity, because GO:0016405
    is defined as forming AMP and diphosphate.
  proposed_parent:
    id: GO:0016878
    label: acid-thiol ligase activity
  supported_by:
  - reference_id: file:human/SUCLG1/SUCLG1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Also able to act as an itaconyl- and malyl-CoA synthetase (PubMed:40108300).
knowledge_gaps:
- gap_statement: How loss of succinyl-CoA synthetase causes mitochondrial DNA depletion is not established. It is
    unknown whether the cause is loss of a physical or functional coupling to mitochondrial nucleoside diphosphate
    kinase, loss of matrix GTP, or a consequence of succinyl-CoA accumulation such as protein hypersuccinylation.
  boundary: 'Established: patient fibroblasts lacking SUCLG1 lose both beta subunits and succinyl-CoA synthetase
    activity and show mtDNA depletion, all rescued by wild-type SUCLG1; knockdown of SUCLG2 lowers mtDNA content
    and NDPK activity. Not established: the molecular step that links the enzyme to mtDNA copy number.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:21295139
    supporting_text: The mechanism of tissue specificity and mtDNA depletion is elusive
  - reference_id: PMID:27484306
    supporting_text: This leads to essentially undetectable SCS enzyme activity, mtDNA depletion, and cellular respiration
      defects.
suggested_questions:
- question: Is the reported restriction of POLRMT succinylation by SUCLG1 a direct, local effect, or a general consequence
    of the succinyl-CoA pool that any change in succinyl-CoA synthetase flux would produce?
- question: Does acylation of SUCLG1 (for example the reported butyrylation of Lys90) regulate the enzyme in normal
    physiology?
- question: Does the single alpha subunit partition between SUCLA2 and SUCLG2 simply by their abundance, or is assembly
    of the two enzymes regulated?
- question: Does the published version of the CLYBL study (PMID:40108300) present succinyl-CoA synthetase only as
    a source of malyl-CoA, or also as the itaconate-activating step of a disposal route? The answer decides whether
    the toxic metabolite repair annotation (GO:0110052) on SUCLG1 and SUCLA2 stands.
- question: Does human succinyl-CoA synthetase form itaconyl-CoA at physiological itaconate concentrations? One
    study found no conversion at 10 mM itaconate (PMID:34492704) and another measured the activity with the recombinant
    human enzymes (PMID:40108300).
suggested_experiments:
- hypothesis: mtDNA depletion in succinyl-CoA synthetase deficiency is caused by loss of matrix GTP supply or of
    NDPK coupling, not by succinyl-CoA accumulation.
  description: In SUCLG1-null fibroblasts, compare rescue of mtDNA copy number by wild-type SUCLG1, by a catalytically
    dead alpha subunit (phosphohistidine substitution) that still stabilises the beta subunits, and by lowering
    succinyl-CoA independently (SIRT5 overexpression or reduced 2-oxoglutarate dehydrogenase flux).
