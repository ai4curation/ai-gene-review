id: P53597
gene_symbol: SUCLG1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SUCLG1 encodes the alpha subunit of mitochondrial succinyl-CoA synthetase (succinate-CoA ligase), the
  matrix enzyme that carries out the only substrate-level phosphorylation of the tricarboxylic acid cycle by converting
  succinyl-CoA, a nucleoside diphosphate and phosphate to succinate, CoA and a nucleoside triphosphate. The alpha
  subunit binds CoA and phosphate and carries the phosphohistidine intermediate; it is shared by two enzymes that
  differ in their beta subunit, the ADP-forming enzyme with SUCLA2 and the GDP-forming enzyme with SUCLG2. The alpha
  subunit is required for the stability of both beta subunits. The enzyme also forms itaconyl-CoA and malyl-CoA
  as side reactions. Biallelic loss-of-function variants cause mitochondrial DNA depletion syndrome 9, an encephalomyopathy
  with methylmalonic aciduria. SUCLG1 is the ortholog of the single alpha subunit of fungi (yeast LSC1) and bacteria
  (SucD); having two beta partners is a feature of animals and a few other lineages.
