    supporting_text: Mechanistically, SUCLG1 restricts succinyl-CoA levels to suppress the succinylation of mitochondrial
      RNA polymerase (POLRMT).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. The effect on POLRMT is indirect, through the succinyl-CoA pool, in leukemia
      cells. It is a downstream consequence of the core activity and no annotation is proposed from it.
- id: PMID:9765290
  title: Characterization of the ATP- and GTP-specific succinyl-CoA synthetases in pigeon. The enzymes incorporate
    the same alpha-subunit.
  findings:
  - statement: ATP- and GTP-specific enzymes share one alpha subunit, so nucleotide specificity resides in the beta
      subunit.
    supporting_text: Because the two succinyl-CoA synthetases incorporate the same alpha-subunit, the determinants
      of nucleotide specificity must reside within the beta-subunit
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. Pigeon enzymes; the basis for treating the alpha subunit as nucleotide-agnostic.
- id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
  title: Evolution of the succinyl-CoA synthetase subunit families (LSC1 / LSC2)
  findings:
  - statement: PAINT node PTN000929335 of the beta-subunit tree holds the characterised GTP-specific beta subunits,
      pig and human SUCLG2. An alpha subunit has a GDP-forming partner where the genome encodes such a subunit.
    supporting_text: PTN000929335 is the node that holds the experimentally characterised GTP-specific enzymes (pig
      and human SUCLG2); it is not the limit of Gln20.
  - statement: The fungal genomes in the PANTHER tree have no G-type beta gene, so their alpha subunits have no
      SUCLG2-type partner.
    supporting_text: The 15 fungal genomes in the PANTHER tree (14 Dikarya and the chytrid Batrachochytrium dendrobatidis)
      have an A-type beta gene and no G-type beta gene.
- id: file:human/SUCLG1/SUCLG1-uniprot.txt
  title: UniProt entry P53597 (SUCLG1)
  findings:
  - statement: UniProt records itaconyl-CoA and malyl-CoA synthetase activity for the enzyme, citing PMID:40108300.
    record_section: ["CC:FUNCTION"]
    supporting_text: Also able to act as an itaconyl- and malyl-CoA synthetase (PubMed:40108300).
    finding_review:
      finding_status: DISPUTED
      review_notes: The itaconyl-CoA part is contested. An earlier study found that neither recombinant SCS-A nor
        pig heart SCS-G converted itaconate at 10 mM. The malyl-CoA part is not contested.
      supported_by:
      - reference_id: PMID:34492704
        supporting_text: neither ATP- nor GTP-specific SCS is able to use itaconate under the same conditions as
          succinate in vitro
- id: file:human/SUCLG1/SUCLG1-deep-research-affinage.md
  title: Affinage mechanistic annotation for SUCLG1 (human)
  findings:
  - statement: SUCLG1 is required for the stability of both beta subunits and for succinyl-CoA synthetase activity.
    supporting_text: loss of SUCLG1 protein leads to concurrent loss of the partner beta subunits SUCLA2 and SUCLG2,
      abolished SCS enzyme activity, mtDNA depletion, and respiration defects, all of which are reversed by ectopic
      wild-type SUCLG1
  - statement: Affinage grounds the molecular activity partly as catalytic activity acting on a protein.
    supporting_text: GO:0140096 catalytic activity, acting on a protein
    finding_review:
      finding_status: DISPUTED
      review_notes: Wrong for SUCLG1, which does not modify proteins. The reported effect on POLRMT succinylation
        is an indirect consequence of the succinyl-CoA pool.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Machine-generated record (run 2026-06-10; its own self-evaluation is "win"; accession matches
      P53597). Checked claim by claim. Verified against cached abstracts or full text: the heterodimer and matrix
      location (PMID:30470562), loss of both beta subunits, activity and mtDNA with rescue (PMID:27484306), loss
      of SUCLA2 protein without SUCLG1 (PMID:20693550), and the POLRMT succinylation study (PMID:38649537). Not verified because the papers are not cached: Lys90 butyrylation
      and SIRT4 (PMID:41991142), the neurofibroma study (PMID:39749698) and the in silico M14T analysis (PMID:29217198).
      Rated LOW_QUALITY as a machine-generated record with unverified citations; the dispute is with its GO grounding
      and is recorded on that finding. The grounding "catalytic activity, acting on a protein" is wrong for SUCLG1, which does not modify
      proteins; the reported effect on POLRMT succinylation is an indirect consequence of the succinyl-CoA pool.
      Its other grounding, "ligase activity", is correct but far less specific than the GOA terms. The record does
      not mention the GDP-forming/ADP-forming distinction. No annotation was imported from it. The record is not quoted
      on any annotation row: its one quote, on the GO:0004774 row, was removed on 2026-11-12 because the record is
      rated LOW_QUALITY, and the row keeps its primary support (PMID:27484306). It prompted the knowledge
      gap on mtDNA depletion and two suggested questions.'
