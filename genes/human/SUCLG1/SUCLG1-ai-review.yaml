  title: UniProt entry P53597 (SUCLG1)
- id: file:human/SUCLG1/SUCLG1-deep-research-affinage.md
  title: Affinage mechanistic annotation for SUCLG1 (human)
  findings:
  - statement: SUCLG1 is required for the stability of both beta subunits and for succinyl-CoA synthetase activity.
    supporting_text: loss of SUCLG1 protein leads to concurrent loss of the partner beta subunits SUCLA2 and SUCLG2,
      abolished SCS enzyme activity, mtDNA depletion, and respiration defects, all of which are reversed by ectopic
      wild-type SUCLG1
  - statement: Affinage grounds the molecular activity partly as catalytic activity acting on a protein.
    supporting_text: GO:0140096 catalytic activity, acting on a protein
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Machine-generated record (run 2026-06-10; its own self-evaluation is "win"; accession matches
      P53597). Checked claim by claim. Verified against cached abstracts or full text: the heterodimer and matrix
      location (PMID:30470562), loss of both beta subunits, activity and mtDNA with rescue (PMID:27484306), and
      the POLRMT succinylation study (PMID:38649537). Not verified because the papers are not cached: Lys90 butyrylation
      and SIRT4 (PMID:41991142), the neurofibroma study (PMID:39749698) and the in silico M14T analysis (PMID:29217198).
      Disputed: its GO grounding "catalytic activity, acting on a protein" is wrong for SUCLG1, which does not modify
      proteins; the reported effect on POLRMT succinylation is an indirect consequence of the succinyl-CoA pool.
      Its other grounding, "ligase activity", is correct but far less specific than the GOA terms. The record does
      not mention the GDP-forming/ADP-forming distinction. No annotation was imported from it; it prompted the knowledge
      gap on mtDNA depletion and two suggested questions.'
