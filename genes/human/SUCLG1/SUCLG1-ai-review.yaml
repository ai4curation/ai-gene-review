knowledge_gaps:
- gap_statement: How loss of succinyl-CoA synthetase causes mitochondrial DNA depletion is not established. It is
    unknown whether the cause is loss of a physical or functional coupling to mitochondrial nucleoside diphosphate
    kinase, loss of matrix GTP, or a consequence of succinyl-CoA accumulation such as protein hypersuccinylation.
  boundary: 'Established: patient fibroblasts lacking SUCLG1 lose both beta subunits and succinyl-CoA synthetase
    activity and show mtDNA depletion, all rescued by wild-type SUCLG1; knockdown of SUCLG2 lowers mtDNA content
    and NDPK activity. Not established: the molecular step that links the enzyme to mtDNA copy number.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:21295139
    supporting_text: The mechanism of tissue specificity and mtDNA depletion is elusive
  - reference_id: PMID:27484306
    supporting_text: This leads to essentially undetectable SCS enzyme activity, mtDNA depletion, and cellular respiration
      defects.
suggested_questions:
- question: Is the reported restriction of POLRMT succinylation by SUCLG1 a direct, local effect, or a general consequence
    of the succinyl-CoA pool that any change in succinyl-CoA synthetase flux would produce?
- question: Does acylation of SUCLG1 (for example the reported butyrylation of Lys90) regulate the enzyme in normal
    physiology?
- question: Does the single alpha subunit partition between SUCLA2 and SUCLG2 simply by their abundance, or is assembly
    of the two enzymes regulated?
suggested_experiments:
- hypothesis: mtDNA depletion in succinyl-CoA synthetase deficiency is caused by loss of matrix GTP supply or of
    NDPK coupling, not by succinyl-CoA accumulation.
  description: In SUCLG1-null fibroblasts, compare rescue of mtDNA copy number by wild-type SUCLG1, by a catalytically
    dead alpha subunit (phosphohistidine substitution) that still stabilises the beta subunits, and by lowering
    succinyl-CoA independently (SIRT5 overexpression or reduced 2-oxoglutarate dehydrogenase flux).
