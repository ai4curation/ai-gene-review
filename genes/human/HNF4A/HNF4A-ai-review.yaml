core_functions:
- description: Sequence-specific DNA-binding nuclear receptor transcription factor that binds
    DR1-type response elements as a homodimer and activates RNA polymerase II transcription
    of hepatocyte, enterocyte and beta-cell target genes (apolipoproteins, metabolic enzymes,
    beta-cell secretory genes), with a fatty acid constitutively bound in its ligand-binding
    domain.
