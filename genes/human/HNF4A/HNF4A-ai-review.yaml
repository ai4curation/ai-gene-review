id: P41235
gene_symbol: HNF4A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'HNF4A (hepatocyte nuclear factor 4-alpha, NR2A1) is an orphan nuclear receptor
  transcription factor expressed in liver, intestine, kidney and pancreatic islets. It binds
  DR1-type response elements in target promoters and enhancers as a homodimer and, through
  its fatty-acid-occupied ligand-binding domain and coactivator recruitment, constitutively
  activates transcription by RNA polymerase II. Its targets include apolipoprotein, bile-acid,
  gluconeogenic, drug-metabolism and coagulation-factor genes, making it a master regulator
  of hepatocyte differentiation and hepatic lipid and glucose metabolism; it also transrepresses
  CLOCK:BMAL1 to shape peripheral circadian rhythms. In beta cells it sustains the insulin-secretory
  gene program: heterozygous loss-of-function variants cause macrosomia with transient or
  persistent neonatal hyperinsulinaemic hypoglycaemia followed by maturity-onset diabetes
  of the young type 1 (MODY1), and a recurrent missense variant causes Fanconi renotubular
  syndrome with MODY. Multiple isoforms arise from two promoters (P1 and P2) and alternative
  splicing.'
