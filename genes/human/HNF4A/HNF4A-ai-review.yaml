suggested_questions:
- question: Which beta-cell HNF4A target genes explain the switch from fetal/neonatal hyperinsulinism
    to later insulin-secretory failure in HNF4A haploinsufficiency?
suggested_experiments:
- description: Profile HNF4A occupancy (CUT&RUN) and transcriptome in human stem-cell-derived
    beta cells heterozygous for HNF4A loss at fetal-like and matured stages, together with
    glucose-stimulated insulin secretion, to identify the targets driving early hypersecretion
    versus later failure.
