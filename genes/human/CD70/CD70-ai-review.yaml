  review:
    summary: CD70 can support proliferation in a subset of human malignant B cells through reverse
      signaling.
    action: KEEP_AS_NON_CORE
    reason: The original human-deficiency paper (PMID:28011864) does not directly resolve a
      B-cell division assay or the humoral-defect mechanism. Independent PMID:10460611 reports
      proliferation of a subset of human B-CLLs after CD70, but not CD27, antibody ligation;
      CD40 ligation enhanced this response and IL-4 inhibited it. Its abstract attributes the
      response to CD70 agonism rather than blockade of inhibitory CD27 signaling. Retain the
      biological function as non-core in that malignant-cell context. Detailed assay controls
      were unavailable, and neither a normal-human-B-cell mechanism nor the original source-specific
      experimental basis is claimed resolved.
