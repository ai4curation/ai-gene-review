  review:
    summary: CD70-mediated CD27 ligation can trigger apoptosis in particular lymphocyte contexts.
    action: KEEP_AS_NON_CORE
    reason: The official PubMed Figure1 caption explicitly describes CD70 versus mock transfectants,
      including fixed-cell ligand presentation to Ramos, Raji, CD27-transfected pre-B cells
      and activated human peripheral lymphocytes. Thus CD70 was actually tested despite the
      title foregrounding CD27 and Siva. Full primary body retrieval failed; the abstract
      and complete figure legend support contextual retention. CD70 is the extracellular trigger,
      not the intracellular Siva effector, and this result does not make apoptosis its universal
      outcome.
