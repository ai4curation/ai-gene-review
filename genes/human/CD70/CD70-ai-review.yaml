core_functions:
- description: Cell-surface CD70 engages CD27 and provides a costimulatory signal for antigen-dependent
    T-cell activation and expansion. The human ectodomain complex contains a CD70 homotrimer
    engaging three CD27 receptors. Immobilized CD70 promotes TCR-dependent activation in the
    tested assays; concentration and higher-order clustering affect efficacy, so soluble ligand
    is not declared universally inactive.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0160162
    label: CD27 signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8387892
  - reference_id: PMID:28011863
    supporting_text: CD70 on B cells provides a co-stimulatory signal required for TCR-mediated
      proliferation
  - reference_id: PMID:34419446
    supporting_text: Each CD27 monomer engages along the groove formed by two adjacent CD70
      monomers.
suggested_questions:
- question: Under which conditions does endogenous CD70 reverse signaling contribute to normal
    human B-cell division, and how much of the humoral defect in CD70 deficiency instead reflects
    CD27-dependent T-cell help or infection?
suggested_experiments:
- description: Compare purified, lineage-tracked normal human B cells with CD70 loss and matched
    rescue, with or without B-cell CD27, under controlled CD40/cytokine stimulation. Ligate
    B-cell CD70 using defined multivalent CD27 ectodomain or an agonistic CD70 reagent with
    matched Fc/isotype controls. Measure division by dye dilution and DNA synthesis separately
    from survival and antibody production, then add matched T-cell help with T-cell CD27 controlled
    independently. Verify equal viable input and surface expression to distinguish B-cell reverse
    signaling from altered help.
