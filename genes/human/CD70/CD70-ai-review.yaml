id: P32970
gene_symbol: CD70
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD70 is a type II transmembrane member of the tumor necrosis factor ligand family
  that engages CD27 on lymphocytes. CD70 presented by activated antigen-presenting cells, including
  B cells, provides a costimulatory signal that supports antigen-dependent T-cell activation
  and expansion. Human CD70 deficiency compromises control of Epstein–Barr virus and is associated
  with impaired immune memory and humoral immunity. Its activity is cell-context dependent,
  with CD27 ligation also capable of eliciting apoptosis in particular experimental lymphocyte
  systems.
