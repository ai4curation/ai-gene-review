  review:
    summary: CD70 deficiency affects humoral immunity, with an incompletely resolved cellular
      mechanism.
    action: KEEP_AS_NON_CORE
    reason: The full study reports hypogammaglobulinemia and reduced switched-memory B-cell
      proportions. Its Discussion explicitly leaves open intrinsic B-cell differentiation, deficient
      T-cell help and consequences of viral infection. Retain the existing broad B-cell immunity
      phenotype without equating it with a demonstrated direct B-cell proliferation activity.
      This broad immune-response annotation is supported by the measured antibody/memory phenotype;
      it does not require that the paper directly measured B-cell division.
    supported_by:
    - reference_id: PMID:28011864
