id: P54803
gene_symbol: GALC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GALC is a soluble galactosylceramidase that removes galactose from galactolipids during acidic
  endolysosomal degradation. It cleaves galactosylceramide to galactose and ceramide and also hydrolyzes
  galactosylsphingosine. Saposin A helps present membrane-derived lipid to the enzyme. Loss of GALC activity
  disrupts galactolipid turnover and causes Krabbe disease, with severe effects on nervous-system myelin.
