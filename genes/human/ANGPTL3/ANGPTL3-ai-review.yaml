suggested_questions:
- question: Which original mouse or rat experiments support the early-endosome, Golgi, artery-morphogenesis,
    lamellipodium and hormone-response transfers, and what cellular contexts justify their application
    to human ANGPTL3?
- question: What native matrix-associated ANGPTL3 pool underlies the PAINT extracellular-matrix assertion,
    and which ancestral node and descendant experiments support it?
- question: How do circulating ANGPTL3 monomers, homotrimers and ANGPTL3/8 complexes divide endothelial-lipase
    and lipoprotein-lipase regulation under physiological conditions?
- question: Does the full PMID:12565906 storage experiment establish an ANGPTL3 role beyond the adipocyte
    lipid mobilization described in the abstract?
- question: How should ATP-independent unfolding of the LPL catalytic domain by ANGPTL3/8 be represented
    in GO without implying ATPase activity or assuming dissociation of a protein-containing complex?
- question: Should the directly demonstrated inhibitory step also carry GO:0060192 negative regulation
    of lipase activity or its LPL-specific child GO:0051005, given the existing inhibitor molecular-function
    annotation and the current activity-regulation term maintenance policy?
suggested_experiments:
- description: Compare matched full-length human ANGPTL3, cleavage-resistant variants and defined ANGPTL3/8
    complexes at physiological concentrations against human LPL and endothelial lipase, including native
    lipoprotein substrates and endothelial GPIHBP1.
- description: Use endogenous human ANGPTL3 labeling with secretion and expression controls to distinguish
    transient secretory traffic from functional Golgi/endosomal or podocyte-surface pools.
