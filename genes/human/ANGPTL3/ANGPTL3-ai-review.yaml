id: Q9Y5C1
gene_symbol: ANGPTL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANGPTL3 is a secreted glycoprotein produced predominantly by the liver that regulates circulating
  lipoproteins. Its N-terminal region inhibits lipoprotein lipase and endothelial lipase, helping maintain
  plasma triglyceride, cholesterol and phospholipid levels. Association with ANGPTL8 supports potent inhibition
  of intravascular lipoprotein lipase, while endothelial lipase inhibition can occur independently of
  ANGPTL8. Its C-terminal fibrinogen-like domain binds integrin alpha-v/beta-3 and supports endothelial
  adhesion, migration and angiogenic responses in experimental systems. Proteolytic processing generates
  fragments with distinct activities but is not obligatory for every inhibitory mechanism. Biallelic loss-of-function
  variants cause familial combined hypolipidemia.
