core_functions:
- description: 'Inhibits extracellular lipases through the N-terminal region: ANGPTL3 cooperates with
    ANGPTL8 to suppress lipoprotein lipase and also inhibits endothelial lipase. These activities regulate
    plasma triglyceride turnover and HDL phospholipid/cholesterol homeostasis. Activity depends on oligomer
    composition and the local lipase-stabilizing environment. Human-protein biophysics supports ATP-independent
    unfolding of LPL; the later EL mutagenesis predominantly tests mouse ANGPTL3 and is distinguished
    from human plasma oligomer measurements.'
