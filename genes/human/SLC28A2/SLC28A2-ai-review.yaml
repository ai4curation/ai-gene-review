  evidence_type: IDA
  original_reference_id: PMID:22492015
  qualifier: involved_in
  review:
    summary: >-
      IDA to free-purine-nucleobase transport, process counterpart of GO:0005345.
    action: REMOVE
    reason: >-
      Process counterpart of the GO:0005345 nucleobase molecular-function row from the same paper,
      and removed on the same grounds. Yao et al. (2011) directly showed hCNT1/2/3 do not transport
      free nucleobases and are nucleoside-specific, so CNT2 does not carry out purine nucleobase
      transport. The cited reference (PMID:22492015) is a trafficking paper and does not assay
      nucleobase transport. Recorded as a WRONG_TERM source defect re-pointing to the purine
      nucleoside transport process (GO:0015860).
    supported_by:
    - reference_id: PMID:21795683
      supporting_text: >-
        Human concentrative nucleoside transporters hCNT1, hCNT2, and hCNT3, in contrast, did
        not transport nucleobases and thus should be considered nucleoside-specific.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ARUK_UCL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:1904823
      corrected_value: GO:0015860
      corrected_label: purine nucleoside transmembrane transport
      cause: LABEL_WITHOUT_DEFINITION
      confidence: CONFIRMED
      explanation: >-
        CNT2 transports purine nucleosides, not free purine nucleobases (Yao et al. 2011,
