        transmembrane transport" (GO:1904823) IDA annotation, cited to the trafficking paper
        PMID:22492015, appears to be a nucleoside-vs-nucleobase slip and should be re-pointed to the
        purine nucleoside transport process (GO:0015860). Note GO:0015860 is already annotated to CNT2
        (IDA PMID:10087507; TAS PMID:9435697), so in practice this is a request to retract the
        mis-pointed GO:1904823 row rather than to create a GO:0015860 annotation that would duplicate
        the existing ones.
      supported_by:
