- term:
    id: GO:0006139
    label: nucleobase-containing compound metabolic process
  evidence_type: TAS
  original_reference_id: PMID:9435697
  qualifier: involved_in
  review:
    summary: >-
      Very broad metabolic-process term attached to a transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      CNT2 is a transporter, not a metabolic enzyme; it does not itself catalyse a step of
      nucleobase-containing compound metabolism. By importing nucleosides it supplies substrates for
      downstream salvage (kinases, phosphorylases), but the metabolic chemistry is done by other
      proteins. Annotating a transporter to this high-level metabolic grouping is an indirect
      over-annotation; the specific nucleoside-transport process terms capture CNT2's actual role.
    supported_by:
    - reference_id: PMID:9435697
      supporting_text: >-
        This is the first demonstration of a purine nucleoside transporter in human kidney.
