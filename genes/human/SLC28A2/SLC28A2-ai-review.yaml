suggested_questions:
- question: >-
    Does human CNT2 transport any free nucleobases (e.g. hypoxanthine or purine bases), or is the
    reported purine-nucleobase transporter activity a mis-annotation of nucleoside transport?
  experts: []
- question: >-
    Is CNT2 functionally expressed at the human blood-brain barrier, or is its barrier role limited
    to the blood-testis barrier (apicolateral Sertoli-cell membranes)?
  experts: []
suggested_experiments:
- hypothesis: >-
    CNT2 transports purine nucleosides and uridine but not free nucleobases.
  description: >-
    Express hCNT2 in a nucleoside-transport-deficient cell line (or Xenopus oocytes) and measure
    Na+-dependent uptake of radiolabelled nucleosides (adenosine, inosine, guanosine, uridine)
    versus the corresponding free nucleobases (adenine, hypoxanthine, guanine, uracil), with and
    without competing cold substrates, to directly test nucleobase versus nucleoside selectivity.
  experiment_type: radiolabelled substrate uptake / transport assay
- hypothesis: >-
    CNT2 sets the apical entry step for physiological and drug nucleosides in polarized epithelia.
  description: >-
    In polarized intestinal (Caco-2) or renal proximal-tubule epithelial monolayers, combine apical
    vs basolateral directional flux assays of physiological nucleosides and drug substrates (the
    nucleoside analog ribavirin, and the thiopurine nucleobase analog 6-mercaptopurine) with CNT2
    knockdown/knockout to quantify CNT2's contribution to vectorial transepithelial transport.
  experiment_type: polarized epithelial transport / loss-of-function
