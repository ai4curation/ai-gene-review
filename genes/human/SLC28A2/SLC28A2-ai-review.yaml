- term:
    id: GO:0015389
    label: pyrimidine- and adenosine-specific:sodium symporter activity
  evidence_type: IDA
  original_reference_id: PMID:10087507
  qualifier: enables
  review:
    summary: >-
      This term describes the CNT1 (N2/cit) selectivity, not CNT2's N1/cif selectivity.
    action: MODIFY
    reason: >-
      GO:0015389 is defined as Na+-coupled symport of "(pyrimidine nucleoside or adenosine)", which
      is the substrate profile of CNT1/SLC28A1 (the N2/cit system: pyrimidines plus adenosine). CNT2
      is the complementary N1/cif system: it transports purine nucleosides (adenosine, inosine,
      guanosine) plus uridine. The cited paper states CNT2 is "selective for purine nucleosides but
      also transports uridine". The purine-selective core of CNT2's Na+:nucleoside symport is
      captured precisely by GO:0015390 (purine-specific nucleoside:sodium symporter activity), and
      the uridine component by the separately annotated GO:0015213. Replace GO:0015389 with GO:0015390,
      which matches CNT2's purine-selective concentrative symport; the parent symporter activity
      (GO:0005415) remains correctly annotated.
    proposed_replacement_terms:
    - id: GO:0015390
      label: purine-specific nucleoside:sodium symporter activity
    supported_by:
    - reference_id: PMID:10087507
      supporting_text: >-
        recombinant hCNT2 exhibited the functional characteristics of a Na(+)-dependent
        nucleoside transporter with selectivity for adenosine, other purine nucleosides and uridine
