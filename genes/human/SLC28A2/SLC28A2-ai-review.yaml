id: O43868
gene_symbol: SLC28A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC28A2 (CNT2/hCNT2, originally hSPNT1/SPNT) is a sodium-coupled, concentrative,
  inwardly-directed nucleoside transporter of the concentrative nucleoside transporter
  (CNT, SLC28, TC 2.A.41) family. It is a multi-pass integral membrane protein (658 aa,
  ~14 transmembrane helices) located in the plasma membrane, where in polarized epithelia
  it resides at the apical/apicolateral and brush-border membrane. CNT2 catalyses the
  electrogenic symport of one Na+ down its electrochemical gradient together with a
  nucleoside, concentrating the nucleoside inside the cell. It displays the N1/cif
  (concentrative, inhibitor-formycin-B-sensitive) substrate selectivity, transporting
  purine nucleosides (adenosine, inosine, guanosine) and the pyrimidine nucleoside uridine,
  with high affinity for inosine and adenosine and lower affinity for uridine. Through this
  activity CNT2 mediates cellular uptake and salvage of physiological purine nucleosides in
  kidney, intestine, and many other tissues, contributing to nucleotide salvage. It also
  transports nucleoside-analog drugs (e.g. 2',3'-dideoxyinosine, ribavirin), giving it a
  pharmacological role in the absorption and disposition (ADME) of antiviral and
  antineoplastic nucleoside analogs.
