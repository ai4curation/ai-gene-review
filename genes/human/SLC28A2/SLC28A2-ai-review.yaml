- term:
    id: GO:0005345
    label: purine nucleobase transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:22492015
  qualifier: enables
  review:
    summary: >-
      IDA to free-purine-nucleobase transporter activity, from the RS1-regulation paper.
    action: REMOVE
    reason: >-
      CNT2 is nucleoside-specific and does not transport free nucleobases. Yao et al. (2011)
      directly tested hCNT1, hCNT2 and hCNT3 in Xenopus oocytes against a panel of purine and
      pyrimidine nucleobases and found no nucleobase transport, concluding the hCNTs are
      nucleoside-specific. The cited reference (PMID:22492015) is about RS1-mediated trafficking
      regulation and does not assay nucleobase transport. This molecular function (nucleobase,
      not nucleoside) is directly contradicted by experiment and should be removed; it is most
      likely a nucleoside-vs-nucleobase slip, recorded as a WRONG_TERM source defect re-pointing
      to a purine nucleoside transporter activity (GO:0015390).
    supported_by:
    - reference_id: PMID:21795683
      supporting_text: >-
        Human concentrative nucleoside transporters hCNT1, hCNT2, and hCNT3, in contrast, did
        not transport nucleobases and thus should be considered nucleoside-specific.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ARUK_UCL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005345
      corrected_value: GO:0015390
      corrected_label: purine-specific nucleoside:sodium symporter activity
      cause: LABEL_WITHOUT_DEFINITION
      confidence: CONFIRMED
      explanation: >-
        CNT2 transports purine nucleosides, not free purine nucleobases. Yao et al. 2011
        (PMID:21795683) tested hCNT1/2/3 against purine and pyrimidine nucleobases and showed no
        nucleobase transport, concluding the hCNTs are nucleoside-specific. The "purine nucleobase
