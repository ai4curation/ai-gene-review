    label: retina homeostasis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000063492
  - RGD:61840
  review:
    summary: >-
      IBA propagation of a tissue-level homeostasis process to CNT2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      There is no literature establishing a role for human CNT2 in retina homeostasis.
      CNT2 is a broadly-expressed nucleoside transporter; UniProt tissue distribution lists
      heart, skeletal muscle, liver, kidney, intestine, pancreas, placenta, brain and lung,
      not retina. "retina homeostasis" describes a tissue-specific physiological outcome
      rather than the molecular transport activity CNT2 performs, and supplying salvage
      nucleosides is a general housekeeping role; attributing a retina-specific homeostatic
      process to human CNT2 over-reaches the evidence given its expression pattern. Retained
      but flagged as a likely over-annotation rather than removed, since it follows from a
      phylogenetic node placement.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000063492
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Ancestral CNT node whose retina-homeostasis assertion is propagated to all
          descendants; human CNT2 is not expressed in retina and has no retina-specific evidence.
- term:
    id: GO:0005326
    label: neurotransmitter transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:10087507
  qualifier: enables
  review:
    summary: >-
      Annotated because CNT2 transports adenosine, which can act as a neuromodulator.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      CNT2 transports adenosine (a purine nucleoside that is also an extracellular signalling
      molecule), and this was presumably the basis for the neurotransmitter-transporter
      annotation. However, CNT2's evolved and physiological function is Na+-coupled concentrative
      uptake/salvage of nucleosides in epithelia (kidney, intestine), not synaptic clearance of a
      neurotransmitter. Adenosine is handled by CNT2 as a nucleoside substrate for salvage, not
      as a neurotransmitter being transported for signalling termination. The substrate-specific
      nucleoside-transport terms (GO:0015211, GO:0032238) capture the real activity; casting this
      as "neurotransmitter transmembrane transporter activity" over-interprets the physiology.
    supported_by:
    - reference_id: PMID:10087507
      supporting_text: >-
        recombinant hCNT2 exhibited the functional characteristics of a Na(+)-dependent
        nucleoside transporter with selectivity for adenosine, other purine nucleosides and uridine
