id: Q96EX3
gene_symbol: DYNC2I2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2I2 (WDR34) is a WD-repeat intermediate chain of cytoplasmic dynein-2, the motor that returns
  intraflagellar transport components and cargo toward the ciliary base. It supplies light-chain, intermediate-chain
  and heavy-chain contacts that organize the asymmetric motor complex. Its ciliary transport and assembly roles
  involve basal-body, ciliary-interior and tip-turnaround pools; the severity of ciliary defects varies with
  the disrupted allele or engineered fragment. Biallelic variants cause skeletal ciliopathies. In human HEK293
  cells, WDR34 also associates with TAK1/TAB2/TRAF6 and attenuates IL-1/TLR signaling, a reported nonciliary
  activity whose relationship to dynein-2 remains unresolved.
