suggested_questions:
- question: Is the reported WDR34–TAK1/TAB2/TAB3/TRAF6 interaction and suppression of IL-1R/TLR-induced
    NF-kappaB activation a physiological function, independent of dynein-2 and cilia?
- question: Is the filopodium localization transferred from mouse Wdr34 supported by primary data?
suggested_experiments:
- hypothesis: WDR34 suppresses TLR/IL-1R NF-kappaB signalling independently of its dynein-2 role.
  description: Compare NF-kappaB reporter activity and TAK1 phosphorylation after IL-1beta or LPS in WDR34-knockout
    versus WDR60-knockout and DYNC2H1-knockout cells. Rescue with WDR34 mutants that cannot bind dynein-2
    light chains or heavy chain.
  experiment_type: knockout signalling assay
