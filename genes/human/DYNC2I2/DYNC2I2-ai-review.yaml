core_functions:
- description: DYNC2I2 binds the DYNLL1/DYNLL2 and DYNLRB1/DYNLRB2 light-chain module and, together with intermediate-chain
    and heavy-chain contacts, organizes the asymmetric dynein-2 motor assembly. These subunit interfaces contribute
    to minus-end-directed transport of ciliary components and the transport machinery that supports cilium
    assembly. Basal-body, ciliary-interior and modeled tip-turnaround pools are complementary parts of this
    mechanism. DYNC2I2 does not independently supply the motor ATPase activity.
