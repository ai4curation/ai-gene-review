core_functions:
- description: Non-catalytic intermediate chain of cytoplasmic dynein-2. Its beta-propeller binds heavy
    chain B and its N-terminus pairs with WDR60, forming the IC–LC block that bridges and asymmetrically
    positions the two heavy chains. It contributes to the minus-end-directed motor activity that drives
    retrograde IFT.
  contributes_to_molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0005929
    label: cilium
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:31451806
    supporting_text: DHC2TAIL-A and -B, are bound by the β-propeller of WDR60 and WDR34 respectively,
      mainly via bundle 3
  - reference_id: PMID:30649997
    supporting_text: Our analyses using WDR34-KO cell lines, and those exogenously expressing WDR34 constructs
      lacking light chain–binding sites, showed the importance of these interactions in retrograde ciliary
      protein trafficking.
- description: Binds the LC8-type (DYNLL1/2) and roadblock (DYNLRB1/2) dynein light chains at distinct
    N-terminal sites. Incorporating these light chains into dynein-2 is essential for retrograde trafficking
    of ciliary proteins.
  molecular_function:
    id: GO:0045503
    label: dynein light chain binding
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:30649997
    supporting_text: These observations together indicate that interactions of WDR34 with both DYNLL1/DYNLL2
      and DYNLRB1/DYNLRB2 are essential for dynein-2–mediated retrograde trafficking of ciliary proteins.
- description: Required for axoneme extension and cilium assembly, and for maintenance of a functional
    transition zone, as part of dynein-2.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  supported_by:
  - reference_id: PMID:30320547
    supporting_text: we show that WDR34 KO cells can assemble a dynein-2 motor complex that binds IFT
      proteins yet fails to extend an axoneme, indicating complex function is stalled
