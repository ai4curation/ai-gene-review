id: Q96EX3
gene_symbol: DYNC2I2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2I2 (WDR34, FAP133 homolog) is one of the two non-identical WD40-repeat intermediate
  chains of cytoplasmic dynein-2, the retrograde intraflagellar transport (IFT) motor. Its C-terminal
  beta-propeller binds the tail of dynein-2 heavy chain B. Its N-terminal region heterodimerizes with
  WDR60 (DYNC2I1) and binds the LC8-type light chains DYNLL1/DYNLL2 (via residues ~80–93) and the roadblock
  light chains DYNLRB1/DYNLRB2 at a separate site. These light-chain interactions are required for dynein-2-mediated
  retrograde trafficking of ciliary proteins. WDR34 is found in the cytoplasm, concentrated around centrosomes/basal
  bodies, and in primary cilia. WDR34-knockout cells assemble a dynein-2 complex that binds IFT proteins
  but largely fail to extend an axoneme, and WDR34 is also needed for transition-zone integrity and Hedgehog
  signalling. Biallelic WDR34 variants cause short-rib thoracic dysplasia 11 (Jeune asphyxiating thoracic
  dystrophy / short-rib polydactyly). WDR34 was also identified as a TAK1-, TAB2/3- and TRAF6-interacting
  protein whose overexpression dampens IL-1/TLR-induced NF-kappaB activation.
