id: P22888
gene_symbol: LHCGR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LHCGR encodes the lutropin-choriogonadotropic hormone receptor, a gonadal glycoprotein-hormone GPCR that binds luteinizing hormone and chorionic gonadotropin at the plasma membrane. The receptor primarily couples hormone binding to Gs/adenylate-cyclase/cAMP signaling and also to phospholipase C signaling, thereby driving steroidogenic and reproductive programs in Leydig, theca and luteal cells.
