id: P32119
gene_symbol: PRDX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PRDX2 encodes peroxiredoxin-2, an abundant cytosolic typical 2-Cys peroxiredoxin that reduces hydrogen peroxide and organic
  hydroperoxides using the thioredoxin/thioredoxin-reductase system. Its peroxide-reducing activity buffers cytosolic redox
  state, can transmit H2O2 signals to STAT3 through a redox relay, and can affect platelet, apoptosis, and coagulation phenotypes
  downstream of that redox chemistry.
