suggested_questions:
- question: The best-supported activity at this locus, repression of CHOP translation in
    unstressed cells, is executed by ribosomes translating the uORF and by the nascent
    chain stalling in the ribosome. Should GO annotate a translation-regulation process
    to the released peptide entry (P0DPQ6), or is this a cis property of the DDIT3 mRNA
    that belongs outside the peptide's annotation set?
- question: Does the released AltDDIT3 peptide alter CHOP transcriptional activity, stability
    or dimerization with C/EBP partners in trans?
- question: Is endogenous AltDDIT3 detectable by antibody or targeted mass spectrometry,
    and where is it located without a large tag?
suggested_experiments:
- description: Express AltDDIT3 in trans from a heterologous mRNA in DDIT3 uORF-deleted
    cells and measure CHOP target-gene expression and apoptosis under ER stress, to separate
    any peptide trans activity from the cis uORF effect.
- description: Introduce synonymous or start-codon-preserving mutations that change the peptide
    sequence outside the Ile-Phe-Ile stall motif and test whether the CHOP interaction and
    the 6-thioguanine survival phenotype are lost.
- description: Detect the endogenous peptide (targeted mass spectrometry or a small epitope
    knock-in) in unstressed versus stressed cells, and determine its localization.
