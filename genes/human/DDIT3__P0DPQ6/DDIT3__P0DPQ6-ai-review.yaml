core_functions:
- description: >-
    Binds the transcription factor CHOP (DDIT3), encoded downstream on the same mRNA, and
    co-localizes with it mainly in the nucleus. Shown with overexpressed tagged
    constructs by two independent groups; whether the interaction modulates CHOP activity
    is unknown.
