description: >-
  AltDDIT3 is a 34-amino-acid peptide encoded by the conserved upstream open reading frame
  (uORF) in the 5' leader of the DDIT3 (CHOP/GADD153) mRNA, whose main open reading frame
  encodes the stress-induced transcription factor CHOP; the uORF spans the junction of
  exons 1 and 2. Translation of this uORF is the best-understood activity at this
  sequence: in unstressed cells ribosomes translate the uORF, the nascent chain
  (through an Ile-Phe-Ile motif near its C terminus) stalls elongating ribosomes, and
  reinitiation at the downstream CHOP start codon is suppressed; during the integrated
  stress response, eIF2-alpha phosphorylation lets scanning ribosomes bypass the
  poor-context uORF start codon and translate CHOP. This repression is a cis property of
  the mRNA and of the translating nascent chain. Whether the released peptide has its own
  function is less clear. Translation-initiation ribosome profiling supports its
  synthesis, and when overexpressed as a GFP fusion in HeLa cells it is mainly nuclear with
  a cytoplasmic fraction, co-localizes with CHOP and co-immunoprecipitates with it; an
  independent study also found the peptide in a stable complex with CHOP. Untagged
  overexpression improved cell survival under 6-thioguanine stress in a pooled screen,
  but the mechanism and physiological relevance of these trans activities are unknown.
