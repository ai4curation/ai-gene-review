core_functions:
- description: ABCG5 assembles with ABCG8 to export neutral sterols using ATP. Its membrane domain and
    nucleotide-binding domain are integral parts of the heterodimer, with the ABCG5 Walker motifs contributing
    to the active composite ATPase site. At hepatocyte and enterocyte apical membranes, this activity
    promotes biliary sterol secretion and restricts net absorption and accumulation of dietary cholesterol
    and plant sterols.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  contributes_to_molecular_function:
    id: GO:0034041
    label: ABC-type sterol transporter activity
  in_complex:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  directly_involved_in:
  - id: GO:0033344
    label: cholesterol efflux
  - id: GO:0045796
    label: negative regulation of intestinal cholesterol absorption
  - id: GO:0010949
    label: negative regulation of intestinal phytosterol absorption
  - id: GO:0042632
    label: cholesterol homeostasis
  supported_by:
  - reference_id: PMID:16893193
    supporting_text: We have expressed the recombinant human ABCG5 and ABCG8 genes in the yeast Pichia
      pastoris and purified the proteins to near homogeneity.
    reference_section_type: ABSTRACT
  - reference_id: PMID:16893193
    supporting_text: Furthermore, ABCG5/G8 eluted as a dimer on gel filtration columns.
    reference_section_type: ABSTRACT
  - reference_id: PMID:16893193
    supporting_text: Copurified ABCG5/G8 displayed low but significant ATPase activity with a V(max) of
      approximately 15 nmol min(-)(1) mg(-)(1).
    reference_section_type: ABSTRACT
  - reference_id: PMID:27144356
    supporting_text: Expression of wild-type (WT) G5 together with WT G8 resulted in a ~30-fold increase
      in cholesterol transport into bile.
    reference_section_type: RESULTS
  - reference_id: PMID:12208868
    supporting_text: Expression of a human transgene encoding ABCG5 and ABCG8 increased biliary cholesterol
      concentrations more than fivefold but did not significantly affect the bile acid pool size or composition.
    reference_section_type: DISCUSSION
  - reference_id: PMID:12208868
    supporting_text: The intestinal absorption of cholesterol was reduced about 50% in both male and female
      transgenic animals compared with their wild-type counterparts (Figure 6 a).
    reference_section_type: RESULTS
  - reference_id: PMID:11099417
    supporting_text: These data suggest that ABCG5 and ABCG8 normally cooperate to limit intestinal absorption
      and to promote biliary excretion of sterols, and that mutated forms of these transporters predispose
      to sterol accumulation and atherosclerosis.
    reference_section_type: ABSTRACT
  knowledge_gaps:
  - gap_statement: The human-transgene absorption experiment does not resolve the relative contributions
      of intestinal efflux and increased biliary cholesterol delivery.
    boundary: Reduced fractional absorption and increased biliary cholesterol are both directly measured.
    provenance:
    - reference_id: PMID:12208868
      supporting_text: Alternatively, the reduction in cholesterol absorption in our transgenic mice may
        be secondary to the increased delivery of cholesterol to the intestinal lumen from the liver.
      reference_section_type: DISCUSSION
  - gap_statement: The individual rat diet, drug, radiation and exercise expression responses were not
      established as conserved human ABCG5 protein-level functions by the source studies inspected.
    boundary: Positive rat expression responses have identifiable IEP source records; the human
      sterol-export function is independently established.
suggested_questions:
- question: Should historical ABCG5/ABCG8 GO:0120020 assertions be migrated to GO:0034041, given that
    the current cholesterol-transfer definition describes an aqueous-pocket carrier while the complex
    performs ATP-driven membrane export?
- question: Can the full rat IEP donor studies and comparable human experiments resolve the nutrient,
    drug, radiation, exercise and triglyceride-homeostasis transfers without equating expression response
    with a demonstrated conserved effector mechanism?
- question: Does the signaling-receptor-complex mapping in the mouse donor chain require correction to
    the experimentally established ABC transporter complex?
- question: What is the physiological significance of the reported NCK1 peptide-domain interaction, beyond
    the generic binding annotation?
suggested_experiments:
- description: Use polarized human intestinal organoids and hepatocyte systems with matched ABCG5/ABCG8
    expression to quantify apical isotope-labeled cholesterol and plant-sterol export and separate enterocyte
    efflux from altered biliary sterol delivery.
