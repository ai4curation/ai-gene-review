id: Q9H222
gene_symbol: ABCG5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCG5 is an ATP-binding cassette half-transporter that forms an obligate heterodimer with
  ABCG8. The complex exports cholesterol and plant sterols across the apical membranes of hepatocytes
  and intestinal enterocytes, supporting biliary sterol secretion and limiting net intestinal sterol absorption.
  ABCG5 supplies one transmembrane domain and one nucleotide-binding domain; its Walker motifs combine
  with the ABCG8 signature motif at the catalytically active composite nucleotide-binding site. Assembly
  with ABCG8 permits maturation and export from the endoplasmic reticulum. Biallelic loss of ABCG5 causes
  sitosterolemia, in which defective sterol elimination produces accumulation of dietary plant sterols
  and cholesterol.
