- term:
    id: GO:0045796
    label: negative regulation of intestinal cholesterol absorption
  evidence_type: IMP
  original_reference_id: PMID:11099417
  qualifier: involved_in
  review:
    summary: ABCG5-containing transporters limit net intestinal cholesterol absorption.
    action: ACCEPT
    reason: Human sitosterolemia in PMID:11099417 is characterized by increased absorption when the pathway
      is defective. Human G5/G8 transgenic mice independently show reduced fractional absorption (PMID:12208868).
      The latter source does not isolate enterocyte export from effects of increased biliary cholesterol,
      so its tissue-mechanism limitation is retained while accepting the regulatory direction.
    supported_by:
    - reference_id: PMID:11099417
      supporting_text: These data suggest that ABCG5 and ABCG8 normally cooperate to limit intestinal
        absorption and to promote biliary excretion of sterols, and that mutated forms of these transporters
        predispose to sterol accumulation and atherosclerosis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:12208868
      supporting_text: The intestinal absorption of cholesterol was reduced about 50% in both male and
        female transgenic animals compared with their wild-type counterparts (Figure 6 a).
      reference_section_type: RESULTS
    - reference_id: PMID:12208868
      supporting_text: Alternatively, the reduction in cholesterol absorption in our transgenic mice may
        be secondary to the increased delivery of cholesterol to the intestinal lumen from the liver.
      reference_section_type: DISCUSSION
