- term:
    id: GO:0010949
    label: negative regulation of intestinal phytosterol absorption
  evidence_type: IMP
  original_reference_id: PMID:11099417
  qualifier: involved_in
  review:
    summary: The transporter restricts net uptake and accumulation of dietary plant sterols.
    action: ACCEPT
    reason: Human ABCG5 loss-of-function in sitosterolemia supports the negative intestinal-absorption
      role in PMID:11099417. The protein itself performs sterol export as part of G5/G8, so this is more
      than a disease-necessity association. Human-transgene mice show reduced circulating plant sterols
      and altered sterol trafficking (PMID:12208868); mouse reconstitution additionally establishes sitosterol
      transport (PMID:16867993).
    additional_reference_ids:
    - PMID:16867993
    supported_by:
    - reference_id: PMID:11099417
      supporting_text: These data suggest that ABCG5 and ABCG8 normally cooperate to limit intestinal
        absorption and to promote biliary excretion of sterols, and that mutated forms of these transporters
        predispose to sterol accumulation and atherosclerosis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:12208868
      supporting_text: Expression of a human transgene encoding ABCG5 and ABCG8 increased biliary cholesterol
        concentrations more than fivefold but did not significantly affect the bile acid pool size or
        composition.
      reference_section_type: DISCUSSION
