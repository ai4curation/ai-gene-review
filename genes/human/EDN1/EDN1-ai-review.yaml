  title: Cloning and functional expression of human cDNA for the ETB endothelin receptor.
  findings:
  - statement: Cloned human EDNRB expressed in COS cells binds ET-1 and ET-3 with equal high affinity
      and mediates transient increases in cytosolic Ca2+.
    supporting_text: COS cells transiently transfected with the cloned cDNA expressed specific, high-affinity
      binding sites for endothelin isopeptides and responded to the peptides with a transient increase
      of [Ca2+]i; endothelin-1 and endothelin-3 exhibited approximately equal potencies both in displacing
      125I-labeled endothelin-1 binding and in eliciting [Ca2+]i transients.
