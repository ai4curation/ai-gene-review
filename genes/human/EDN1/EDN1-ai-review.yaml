  findings:
  - statement: Circulating endothelin-1, endothelin-2, and endothelin-3 peptides were quantified in human
      serum and hepatic vein blood.
    supporting_text: Endothelins and nitrites/nitrates were measured in serum and hepatic vein blood in
      primary biliary cirrhosis and viral cirrhotic patients prior and after ursodeoxycholic acid therapy
      and in serum in controls.
- id: PMID:16820593
  title: Elevated endothelin-1 levels impair nitric oxide homeostasis through a PKC-dependent pathway.
  findings:
  - statement: Elevated ET-1 activates PKCdelta via endothelin receptors in endothelial cells, which inhibits
      eNOS expression and impairs nitric oxide production.
    supporting_text: Our study demonstrates that high levels of ET-1 impair endothelial NO production
      via an isoform-specific PKC-mediated inhibition of eNOS expression.
