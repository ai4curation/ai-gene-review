  title: Characterization of endothelin receptors in the human umbilical artery and vein.
  findings:
  - statement: ET-1 and ET-2 potently contract both human umbilical artery and vein, whereas ET-3 selectively
      contracts the human umbilical vein and is inactive on the artery.
    supporting_text: Endothelin-1 (ET-1) and endothelin-2 (ET-2) are potent stimulants of both the human
      umbilical artery (pEC50 7.9 and 7.5) and vein (pEC50 8.1 and 8.0). Endothelin-3 (ET-3) is inactive
      on the artery but contracts the vein (pEC50 7.6).
