id: P05305
gene_symbol: EDN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Endothelin-1 (EDN1) encodes the primary vascular endothelium-derived vasoconstrictor peptide
  hormone, synthesized as a 212-amino-acid preproprotein that is proteolytically cleaved by furin into
  the 38-amino-acid intermediate big endothelin-1 (residues 53-90) and subsequently converted by endothelin-converting
  enzymes (ECE-1, ECE-2) into the mature 21-amino-acid bicyclic peptide endothelin-1 (ET-1, residues 53-73),
  stabilized by two intramolecular disulfide bridges (Cys1-Cys15 and Cys3-Cys11). Secreted predominantly
  toward the abluminal vascular smooth muscle layer, mature ET-1 binds with sub-nanomolar affinity to
  both class A G-protein-coupled endothelin receptors: EDNRA (ET-A) on vascular smooth muscle cells, cardiomyocytes,
  and cranial/cardiac neural crest cells, and EDNRB (ET-B) on vascular endothelial cells and smooth muscle.
  Through Gq/11-coupled phospholipase C activation, IP3- and Ca2+-mediated signaling, and MAPK/ERK and
  RhoA/ROCK cascades, EDN1 drives potent and sustained arterial and venous vasoconstriction, regulates
  systemic arterial blood pressure, promotes smooth muscle proliferation and cardiomyocyte hypertrophy,
  and directs pharyngeal arch, craniofacial, and cardiac outflow tract morphogenesis.'
