suggested_questions:
- question: What structural determinants of the ET-1-EDNRA complex account for its quasi-irreversible
    dissociation kinetics compared with ET-3, and how do clinically approved dual endothelin receptor
    antagonists (bosentan, macitentan) allosterically accelerate complex dissociation?
  experts:
  - Masashi Yanagisawa
  - Anthony P. Davenport
  - Osamu Nureki
suggested_experiments:
- hypothesis: Polarized sorting of big ET-1 into endothelial Weibel-Palade bodies vs. constitutive secretory
    vesicles controls the ratio of abluminal EDNRA vasoconstriction to luminal EDNRB nitric oxide release.
  description: Use live-cell super-resolution imaging and compartment-specific ECE-1 proximity labeling
    in primary human arterial endothelial cells under laminar vs. disturbed shear stress.
  experiment_type: Super-resolution microscopy and proximity proteomics
