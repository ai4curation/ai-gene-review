- id: PMID:10770212
  title: Expression and biological effects of endothelin-1 in human gonadotropin-releasing hormone-secreting
    neurons.
  findings:
  - statement: Human fetal olfactory GnRH-secreting neuroblasts (FNC-B4) express functional ETA (EDNRA)
      and ETB (EDNRB) receptors that respond to ET-1 and ET-3 with intracellular calcium mobilization,GnRH
      secretion, DNA synthesis, and ERK1 MAPK expression.
    supporting_text: Experiments with radiolabeled ET-1 and ET-3 strongly indicated the presence of two
      classes of binding sites, corresponding to the ETA (16,500 sites/cell) and the ETB receptors (8,700
      sites/cell). Functional studies, using selective analogs, indicated that these two classes of receptors
      subserve distinct functions in human GnRH-secreting cells. The ETA receptor subtype mediated an
      increase in intracellular calcium and GnRH secretion. Conversely, stimulation of the ETB subtype
      induced DNA synthesis and mitogen-activated protein kinase p44ERK1 expression.
