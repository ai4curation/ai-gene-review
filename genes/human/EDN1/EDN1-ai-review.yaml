      supporting_text: Experiments with radiolabeled ET-1 and ET-3 strongly indicated the presence of
        two classes of binding sites, corresponding to the ETA (16,500 sites/cell) and the ETB receptors
        (8,700 sites/cell). Functional studies, using selective analogs, indicated that these two classes
        of receptors subserve distinct functions in human GnRH-secreting cells. The ETA receptor subtype
        mediated an increase in intracellular calcium and GnRH secretion. Conversely, stimulation of the
        ETB subtype induced DNA synthesis and mitogen-activated protein kinase p44ERK1 expression.
