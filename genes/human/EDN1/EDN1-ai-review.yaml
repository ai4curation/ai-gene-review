  review:
    summary: Broad cytoplasmic localization from whole-cell immunocytochemical blotting refined to secretory transport vesicles and Weibel-Palade bodies.
    action: MODIFY
    reason: Preproendothelin-1 is cotranslationally translocated into the ER lumen, processed to big ET-1 and mature ET-1 in the trans-Golgi network, and trafficked through constitutive secretory transport vesicles (GO:0030133) and regulated endothelial storage granules (Weibel-Palade bodies, GO:0033093) rather than residing free in the cytosol. PMID:12379507 stained whole dispersed human aortic endothelial cells on a protein-binding membrane without subcellular fractionation.
