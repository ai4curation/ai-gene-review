    summary: Core molecular function of mature endothelin-1 as a high-affinity orthosteric agonist of
      the endothelin A receptor (EDNRA).
    action: ACCEPT
    reason: Mature ET-1 binds human EDNRA with sub-nanomolar affinity to activate Gq/11-coupled vascular
