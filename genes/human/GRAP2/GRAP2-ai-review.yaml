      label: signaling adaptor activity
    supported_by:
    - reference_id: PMID:17010654
      supporting_text: Following T cell receptor ligation, GADS interacts through its C-terminal SH3 domain with
        the adaptors SLP-76 and LAT, to form a multiprotein signaling complex that is crucial for T cell activation
    - &id003
      reference_id: PMID:10021361
      supporting_text: Gads may promote cross-talk between the LAT and SLP-76 signaling complexes, thereby coupling
        membrane-proximal events to downstream signaling pathways
