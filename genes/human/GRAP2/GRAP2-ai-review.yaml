  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Generated 2026-10-03 (Edison/Falcon). Used as leads only. Key claims checked against primary
      papers and cached: HuT78 knockdown (PMID:25636200), Gads-SLP-76 Kd 9 nM and quaternary complex (PMID:30510001),
      Jurkat GRB2-family knockouts / 100% SLP76-GADS occupancy (PMID:37006259), FLT3 pY955/pY969 (PMID:26895103),
      Yablonski review (PMID:31402911). LAT Y171/Y191 are given in short-isoform numbering without noting canonical
      Y200/Y220. The HPK1 attribution of GADS T262 phosphorylation was not verified in a cached primary paper; PMID:25452106
      reports T262 phosphorylation by mass spectrometry without naming the kinase in its abstract.'
core_functions:
- description: 'Bridging adaptor of the TCR signalosome: the C-terminal SH3 domain holds SLP-76 (LCP2) through its
    RxxK motif and the SH2 domain docks on phospho-LAT, recruiting SLP-76 to LAT microclusters at the plasma membrane
    and coupling TCR engagement to PLCG1 activation, calcium flux and NFAT activation.'
