  supported_by:
  - reference_id: PMID:18664516
    supporting_text: Bone marrow-derived mast cells from Gads(-/-) mice failed to induce Ca(2+) mobilization, degranulation
      and cytokine production upon cross-linking of FcepsilonRI
  - reference_id: PMID:31402911
    supporting_text: Three adaptors, LAT, Gads, and SLP-76, form a heterotrimeric complex that mediates signaling
      by the T cell antigen receptor (TCR) and by the mast cell high affinity receptor for IgE (FcεRI)
suggested_questions:
- question: Should GRAP2 carry collagen-activated signaling pathway (GPVI) and CLEC-2 signaling terms, given that
    Gads is needed only for responses to weak GPVI/CLEC-2 stimulation and is largely redundant with GRB2 in platelets
    (PMID:18826392, PMID:31948362)?
- question: Several reports (PMID:9857184, PMID:11034310) place Mona/GADS downstream of the M-CSF receptor in monocyte/macrophage
    development; is there loss-of-function evidence that would justify a myeloid receptor signaling term in addition
    to the antigen-receptor pathways?
- question: GOA has no T cell receptor signaling pathway annotation for GRAP2 despite the knockout and Jurkat-knockout
    data; are the NEW TCR signaling, FcERI signaling and TCR signalosome rows acceptable to GO curators?
- question: Early work reported that phospho-LAT associates with Grb2 but not GrpL (PMID:10209041), whereas later
    studies consistently show SH2-dependent GADS binding to LAT pY171/pY191; is the early negative result explained
    by lysis conditions or antibody choice?
- question: GADS binds FLT3 pY955/pY969 and potentiates FLT3-ITD mitogenic signaling in engineered cells and xenografts
    (PMID:26895103); is there evidence from primary myeloid cells or AML samples that would justify a FLT3 signaling
    annotation, or is this restricted to overexpression systems?
- question: GADS-knockout Jurkat cells preserve early PLCG1 phosphorylation and calcium flux (PMID:37006259) whereas
    GADS-suppressed HuT78 cells lose calcium flux (PMID:25636200); which compensating adaptors (GRB2, CD6-associated
    complexes) explain the difference, and which model reflects primary human T cells?
suggested_experiments:
- description: In GADS-knockout Jurkat or primary human T cells, reconstitute wild-type GADS, a dimerization-defective
    mutant, Y45F and T262A, and measure LAT-SLP-76 coupling, PLCG1 phosphorylation, calcium flux and CD69 induction
    across a titration of TCR stimulus strength.
  hypothesis: GADS dimerization and linker/N-SH3 phosphorylation set the TCR stimulus threshold by controlling cooperative
    binding of GADS to multiple LAT phosphotyrosines.
  experiment_type: genetic complementation with domain mutants
- description: Use proximity labelling (TurboID-GADS) in resting and TCR- or FcERI-stimulated cells to identify
    GADS partners other than SLP-76 and LAT, comparing wild-type and SH2 (R-to-K) or C-SH3 mutants.
  hypothesis: GADS has partners beyond SLP-76 and LAT (e.g. HPK1, CD6) that contribute to branch-specific signaling
    and to its distinct phenotype compared with SLP-76 or LAT loss.
  experiment_type: proximity proteomics
