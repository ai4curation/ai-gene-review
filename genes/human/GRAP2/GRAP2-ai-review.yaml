  review:
    summary: IPI protein binding with SLP-76 (LCP2) from PMID:17010654, a mechanistic study of the GADS C-terminal
      SH3 domain / SLP-76 RxxK interaction.
    action: MODIFY
    reason: The interaction is real and central to GRAP2 function, but "protein binding" is uninformative. The C-SH3
      of GADS constitutively binds the SLP-76 RxxK motif and its SH2 binds phospho-LAT, so the physiological activity
      is bridging SLP-76 to LAT, i.e. signaling adaptor activity (the same MF used for LCP2 in this project).
    proposed_replacement_terms:
    - &id002
