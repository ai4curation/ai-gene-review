id: O75791
gene_symbol: GRAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRAP2 (GADS, also called GrpL, Grf40, Mona) is a hematopoietic-restricted cytosolic adaptor of the
  GRB2 family with no catalytic activity. It has an N-terminal SH3 domain, a central SH2 domain, a unique ~120-residue
  glutamine/proline-rich linker and a C-terminal SH3 domain. The C-terminal SH3 domain binds an atypical, non-PxxP
  R-x-x-K motif in the scaffold SLP-76 (LCP2) with nanomolar affinity, so GADS and SLP-76 form a constitutive complex.
  After antigen-receptor engagement, the GADS SH2 domain docks on ZAP70/SYK-phosphorylated LAT (pY171 and pY191
  in the conventional short-isoform numbering; pY200 and pY220 in canonical LAT O43561-1), recruiting SLP-76 to
  the LAT signalosome at the plasma membrane, where SLP-76 assembles PLCG1, ITK, VAV1 and NCK. GADS thereby couples
  the T cell receptor to PLCG1 phosphorylation, calcium flux and NFAT activation, sets the sensitivity of T cells
  to weak TCR stimuli, and acts the same way downstream of FcERI in mast cells and of GPVI/CLEC-2 in platelets (where
  it is partly redundant with GRB2). Its activity is tuned by dimerization, ITK phosphorylation of Y45, phosphorylation
  of T262 and caspase cleavage of the linker. The C-terminal SH3 domain also binds HPK1 (MAP4K1), and the SH2 domain
  binds phosphorylated SHC, KIT, the M-CSF receptor, LAX1 and CD6. GADS-deficient mice have impaired thymocyte proliferation
  and selection and severely impaired IgE-mediated mast cell activation.
