    label: Fc-epsilon receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:18664516
  qualifier: involved_in
  review:
    summary: 'Proposed NEW: GADS acts as the LAT-SLP-76 bridging adaptor downstream of FcERI in mast cells.'
    action: NEW
    reason: 'Participation test: in mast cells GADS performs the same bridging adaptor work as in T cells, recruiting
      SLP-76 to phospho-LAT after FcERI cross-linking. Comparator check: LAT and LCP2 carry this term (reviews in
      this repository). Evidence: Gads-/- bone marrow-derived mast cells fail to mobilize calcium, degranulate or
      produce cytokines after FcERI cross-linking, and passive cutaneous anaphylaxis is impaired; disrupting the
      SLP-76/Gads interaction blocks SLP-76 clustering and FcERI responses.'
    additional_reference_ids:
    - PMID:16479002
    - PMID:31402911
    supported_by:
    - reference_id: PMID:18664516
      supporting_text: Bone marrow-derived mast cells from Gads(-/-) mice failed to induce Ca(2+) mobilization,
        degranulation and cytokine production upon cross-linking of FcepsilonRI
    - reference_id: PMID:16479002
      supporting_text: the Gads-binding region of SLP-76 regulates clustering of SLP-76 and FcepsilonRI-induced
        mast cell responses
