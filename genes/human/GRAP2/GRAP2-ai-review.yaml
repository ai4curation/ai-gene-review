    summary: IBA phosphotyrosine residue binding (GRB2-family node).
    action: ACCEPT
    reason: The GADS SH2 domain binds phosphotyrosine motifs (pY-x-N-x) on LAT, LAX, SHC and receptor tyrosine kinases;
