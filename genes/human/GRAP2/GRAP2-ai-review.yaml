- term:
    id: GO:0050852
    label: T cell receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:25452106
  qualifier: involved_in
  review:
    summary: 'Proposed NEW: GADS is the adaptor that bridges SLP-76 to phospho-LAT in TCR signaling.'
    action: NEW
    reason: 'Participation test: GADS does part of the work of the pathway, physically linking the SLP-76 scaffold
      (via its C-SH3/RxxK interaction) to ZAP70-phosphorylated LAT (via its SH2), which assembles the PLCG1-activating
      signalosome. Comparator check: LAT and LCP2, the other two adaptors of the same trimeric complex, carry this
      term (reviews in this repository). Evidence: Gads-deficient thymocytes uncouple SLP-76 from LAT and fail to
      respond to CD3 cross-linking; Gads-deficient Jurkat cells lose sensitivity to weak TCR stimuli. No GOA row
      currently places GRAP2 in this pathway. Human loss-of-function data agree: GADS-suppressed HuT78 CD4+ T cells
      show reduced recruitment of SLP-76 and PLCG1 to LAT, calcium flux and cytokine release (PMID:25636200), while
      GADS-knockout Jurkat cells show network rewiring with largely preserved proximal events but reduced activation
      and cytokine secretion (PMID:37006259).'
    additional_reference_ids:
    - PMID:11239162
    - PMID:17235283
    - PMID:25636200
    - PMID:37006259
    supported_by:
    - reference_id: PMID:25452106
      supporting_text: Gads conferred responsiveness to weak TCR stimuli, leading to PLC-γ1 phosphorylation and
        calcium flux
    - reference_id: PMID:11239162
      supporting_text: Immunoprecipitation experiments revealed that the association between SLP-76 and LAT was
        uncoupled in GADS- thymocytes
    - reference_id: PMID:11239162
      supporting_text: These observations indicate that GADS is a critical adaptor for CD3 signaling
    - *id004
    - &id005
      reference_id: PMID:25636200
      supporting_text: The defect in cytokine production occurred because of impaired calcium mobilization due to
        reduced recruitment of SLP-76 and PLC-γ1 to the LAT complex
- term:
