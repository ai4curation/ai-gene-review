- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: HDA
  original_reference_id: PMID:28344315
  qualifier: located_in
  review:
    summary: >-
      Derived from a shotgun proteomic survey of decellularised extracellular matrix from
      multiple myeloma bone marrow [PMID:28344315]. Filaggrin is an intracellular protein
      of the epidermal granular layer with no secretory signal peptide, and it is not
      expressed in bone marrow; UniProt records expression in skin and a set of stratified
      epithelia, not haematopoietic tissue.
    action: REMOVE
    reason: >-
      Detection of a large, abundant skin protein in a bone-marrow proteome is the
      signature of keratinocyte/skin-derived sample contamination, a well-known confounder
      of shotgun proteomics, rather than evidence of extracellular-matrix localisation.
      The claim is also biologically incoherent: nothing in the filaggrin literature places
      it outside the cell, and its terminal fate is complete intracellular proteolysis to
      free amino acids [PMID:8417356]. This is an unsupported high-throughput inference,
      not a curator's reading of a functional experiment.
    additional_reference_ids:
    - PMID:8417356
    supported_by:
    - reference_id: PMID:8417356
      supporting_text: >-
        Later, filaggrin itself is degraded to free amino acids that participate in
        maintenance of epidermal flexibility.

- term:
    id: GO:0001533
    label: cornified envelope
  evidence_type: IDA
  original_reference_id: PMID:7543090
  qualifier: located_in
  review:
    summary: >-
      Direct evidence: cornified envelopes purified from human foreskin epidermis were
      digested with proteinase K and 145 unique cross-linked peptides were sequenced,
      recovering isodipeptide cross-links involving filaggrin at both the outer and middle
      levels of the envelope [PMID:7543090].
    action: ACCEPT
    reason: >-
      Directly demonstrated on the human protein, and the covalent nature of the
      association makes this an unusually solid localisation claim.
    supported_by:
    - reference_id: PMID:7543090
      supporting_text: >-
        In addition, cross-links involving loricrin and keratins 1, 2e, and 10 or filaggrin
        were recovered in both levels.
    - reference_id: PMID:7543090
      supporting_text: >-
        The recovery of cross-links involving keratins further suggests that the subjacent
        cytoplasmic keratin intermediate filament-filaggrin network is anchored to the
        developing CE during these events.

- term:
    id: GO:0030280
    label: structural constituent of skin epidermis
  evidence_type: IDA
  original_reference_id: PMID:7543090
  qualifier: enables
  review:
    summary: >-
      This is the one molecular function of filaggrin that is genuinely structural rather
      than a binding activity. A fraction of filaggrin is covalently isodipeptide
      cross-linked by transglutaminases into the cornified envelope, becoming a permanent
      constituent of that structure [PMID:7543090], and the keratin filament-filaggrin
      network is anchored to the developing envelope.
    action: ACCEPT
    reason: >-
      Correctly specific for an epidermal structure, and directly demonstrated by peptide
      sequencing of cross-linked envelope material. Preferable to the bare GO:0005198 IEA,
      which this review proposes to repoint to the repeat's binding activity. Note the
      division of labour within the protein: this term describes the cross-linked
      cornified-envelope pool, while the bulk of filaggrin acts transiently on keratin and
      is then degraded. Accepted as a real but secondary molecular function, not as the
      gene's primary activity.
    supported_by:
    - reference_id: PMID:7543090
      supporting_text: >-
        The data establish for the first time that these several proteins are indeed
        cross-linked protein components of the CE structure.
    - reference_id: PMID:7543090
      supporting_text: >-
        The recovery of cross-links involving keratins further suggests that the subjacent
        cytoplasmic keratin intermediate filament-filaggrin network is anchored to the
        developing CE during these events.

- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6810357
  qualifier: located_in
  review:
    summary: >-
      Reactome pathway assertion from "Fillagrin and keratin intermediate filaments
      polymerize forming a network". Profilaggrin and filaggrin are cytoplasmic throughout
      their working life, so the compartment is not wrong, but `cytosol` is far less
      informative than the granule and envelope terms that describe where filaggrin
      actually acts.
    action: KEEP_AS_NON_CORE
    reason: >-
      True but uninformative. The functionally meaningful locations are the keratohyalin
      granule (GO:0036457) and the cornified envelope (GO:0001533); much of the cytosolic
      pool is in fact phase-separated into condensates rather than freely dissolved
      [PMID:32165560].
    additional_reference_ids:
    - PMID:32165560
    supported_by:
    - reference_id: PMID:32165560
      supporting_text: >-
        Here, we found that filaggrin assembles KGs through liquid-liquid phase separation.

