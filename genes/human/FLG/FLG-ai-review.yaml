  title: Crystal Structure of Human Profilaggrin S100 Domain and Identification of
    Target Proteins Annexin II, Stratifin, and HSP27.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      2.2 A crystal structure (PDB 4PCW) of the profilaggrin N-terminal S100 domain with
      bound calcium; also establishes the stable dimer, the two hydrophobic target pockets,
      and three partner proteins. The load-bearing evidence for GO:0005509, and - by
      reporting only calcium in the very domain concerned - the strongest evidence against
      GO:0046914.
- id: PMID:28344315
  title: Proteomic characterization of human multiple myeloma bone marrow extracellular
    matrix.
  findings: []
  reference_review:
    relevance: NONE
    correctness: LOW_QUALITY
    review_notes: >-
      A myeloma bone-marrow ECM proteome. FLG's appearance there is best explained by
      skin-derived sample contamination; it is an intracellular epidermal protein with no
      signal peptide and no reported expression in bone marrow. Not a credible basis for the
      extracellular matrix annotation.
- id: PMID:32165560
  title: Liquid-liquid phase separation drives skin barrier formation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows that filaggrin assembles keratohyalin granules by liquid-liquid phase separation,
      that repeat number sets the critical concentration and disease alleles raise it, that
      the S100 domain lowers it by dimerising, and that pH-triggered dissolution drives
      enucleation. The primary basis for the proposed GO:0140693 annotation.
- id: PMID:32893105
  title: Structural properties of target binding by profilaggrin A and B domains and
    other S100 fused-type calcium-binding proteins.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows the profilaggrin B domain cooperates with the S100 domain to bind annexin II and
      keratin intermediate filaments in a calcium-dependent manner, giving functional meaning
      to the EF-hand calcium binding. Surfaced by the OpenScientist calcium hypothesis run and
      verified against PubMed.
- id: PMID:6170061
  title: Characterization of a class of cationic proteins that specifically interact
    with intermediate filaments.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The paper that named filaggrin and demonstrated its defining activity: specific
      association with intermediate filaments, macrofibril formation, and a stoichiometry of
      about two filaggrin molecules per three-chain filament building block. Primary evidence
      for repointing GO:0005198 to a filament-binding term.
- id: PMID:6195345
  title: 'Histidine-rich proteins (filaggrins): structural and functional heterogeneity
    during epidermal differentiation.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct in vitro demonstration that filaggrins aggregate keratin filaments specifically
      into bundles, and that their basic arginines are progressively converted to citrulline
      during maturation - i.e. the binding activity is switched off rather than made
      permanent. Surfaced by the OpenScientist structural-versus-binding hypothesis run and
      verified against PubMed. Covers guinea pig, rat, mouse and human epidermis.
- id: PMID:7543090
  title: The proteins elafin, filaggrin, keratin intermediate filaments, loricrin,
    and small proline-rich proteins 1 and 2 are isodipeptide cross-linked components
    of the human epidermal cornified cell envelope.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Peptide-level demonstration that filaggrin is covalently isodipeptide cross-linked into
      human cornified envelopes. Supports the cornified envelope location, the cornification
      process, and the one genuinely structural molecular function of filaggrin.
- id: PMID:7687298
  title: The mechanism of interaction of filaggrin with intermediate filaments. The
    ionic zipper hypothesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the mechanism of filament binding - charge-complementary contacts between
      cationic beta-turns of the repeat and the packed filament rod domains - and shows that
      short synthetic peptides reproduce it. Directly relevant to whether the repeat's
      molecular function is structural or a binding activity.
- id: PMID:8417356
  title: Profilaggrin is a major epidermal calcium-binding protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Provides the in vitro demonstration that the two N-terminal EF-hands bind calcium, and
      states the terminal fate of filaggrin as complete degradation to free amino acids. The
      experimental basis for GO:0005509 that PMID:1429717 only conjectured.
- id: PMID:9800950
  title: Translocation of profilaggrin N-terminal domain into keratinocyte nuclei with
    fragmented DNA in normal human skin and loricrin keratoderma.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Immuno-electron microscopy showing the profilaggrin N-terminal domain moves from
      keratohyalin granules into the nuclei of transition-layer keratinocytes while the
      filaggrin repeat domains stay cytoplasmic. The proper support for the nucleus
      annotation.
