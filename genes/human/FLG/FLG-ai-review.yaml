id: P20930
gene_symbol: FLG
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Filaggrin is an epidermal protein of the S100 fused-type protein (SFTP) family, made as the
  ~400 kDa polyprotein precursor profilaggrin, which is the principal constituent of
  keratohyalin granules in the stratum granulosum. Profilaggrin has a two-part architecture
  whose halves become functionally separate proteins: an N-terminal S100 "A" domain carrying
  two EF-hands (one canonical, one S100-type pseudo-EF-hand) followed by a "B" domain with a
  nuclear localisation signal, and a tandem array of 10-12 copies of an intrinsically
  disordered, histidine- and arginine-rich ~324-residue filaggrin repeat. During terminal
  differentiation profilaggrin is dephosphorylated and proteolytically cleaved, releasing the
  N-terminal AB fragment, which binds calcium and partner proteins and translocates to the
  keratinocyte nucleus, and free filaggrin monomers.
  The repeat array drives assembly of keratohyalin granules as liquid-liquid phase-separated
  biomolecular condensates, and the released monomers bind keratin intermediate filaments
  along their rod domains through charge-complementary "ionic zipper" contacts, condensing
  them into macrofibrillar bundles and compacting the cell as it flattens into a squame. A
  fraction of filaggrin is covalently isodipeptide cross-linked by transglutaminases into the
  cornified envelope. At the granular-to-corneum transition an intracellular acidification
  dissolves the histidine-rich condensates; filaggrin is then citrullinated and completely
  degraded by caspase-14 and bleomycin hydrolase to free amino acids, urocanic acid and
  pyrrolidone carboxylic acid, which constitute natural moisturising factor and maintain
  stratum corneum hydration and acidity.
  Filaggrin is expressed chiefly in the granular layer of skin and other stratified epithelia.
  Loss-of-function variants, carried by up to 10% of people of European ancestry, cause
  ichthyosis vulgaris and are the strongest known genetic risk factor for atopic dermatitis
  and the associated atopic march of asthma and allergic sensitisation.

existing_annotations:
- term:
    id: GO:0001533
    label: cornified envelope
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic propagation at PANTHER node PTN002503122 within PTHR22571 (S100-fused
      Epidermal Structural Protein). The donor set resolves to a tight, architecturally
      coherent SFTP clade: human FLG itself (P20930), human hornerin (Q86YZ3) and mouse
      Hrnr (MGI:3046938), plus mouse Flg2 (MGI:3645678). Filaggrin's presence in the
      cornified envelope is directly demonstrated on the target itself: proteinase-K
      digestion and sequencing of 145 cross-linked peptides from purified human foreskin
      cornified envelopes recovered isodipeptide cross-links involving filaggrin
      [PMID:7543090].
    action: ACCEPT
    reason: >-
      The node placement is sound - all donors are S100-fused epidermal barrier proteins
      sharing the S100 A-domain plus low-complexity repeat architecture, and cornified
      envelope incorporation is a shared property of the clade. FLG appearing in its own
      WITH/FROM is the expected marker that experimental grounding exists on the target,
      not circularity. The IBA agrees with the independent IDA from PMID:7543090.
    supported_by:
    - reference_id: PMID:7543090
      supporting_text: >-
        In addition, cross-links involving loricrin and keratins 1, 2e, and 10 or filaggrin
        were recovered in both levels. The data establish for the first time that these
        several proteins are indeed cross-linked protein components of the CE structure.

- term:
    id: GO:0036457
    label: keratohyalin granule
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic propagation from PTN002503122, donors human FLG (self), human hornerin
      (Q86YZ3) and mouse Hrnr (MGI:3046938). The keratohyalin granule is the defining
      location of profilaggrin and is directly documented for the human protein
      [PMID:1429717], and the modern mechanism - that filaggrin is what assembles these
      granules, by liquid-liquid phase separation - is established in [PMID:32165560].
    action: ACCEPT
    reason: >-
      Correct and appropriately specific. The `is_active_in` qualifier is apt: the granule
      is not merely where filaggrin is found, it is a condensate that filaggrin itself
      scaffolds.
    additional_reference_ids:
    - PMID:32165560
    supported_by:
    - reference_id: PMID:1429717
      supporting_text: >-
        It is synthesized as a large precursor protein, profilaggrin, that consists of
        multiple filaggrin units and is localized in keratohyalin granules.
    - reference_id: PMID:32165560
      supporting_text: >-
        Here, we found that filaggrin assembles KGs through liquid-liquid phase separation.

- term:
    id: GO:0061436
    label: establishment of skin barrier
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic propagation from PTN002503122, donors human FLG (self), human FLG2
      (Q5D862), human hornerin (Q86YZ3) and mouse Flg2 (MGI:3645678). Barrier
      establishment is the shared, defining biology of the SFTP clade, and for FLG it is
      the single best-evidenced process: loss-of-function alleles cause ichthyosis
      vulgaris and are the strongest genetic risk factor for atopic dermatitis
      [PMID:19386895], and phase-separation dynamics of filaggrin condensates drive
      squame formation and barrier establishment [PMID:32165560].
    action: ACCEPT
    reason: >-
      Node placement is well supported and the term is the correct level of granularity
      for this gene. Concordant with the independent IEP annotation from PMID:23403047.
    additional_reference_ids:
    - PMID:19386895
    - PMID:32165560
    supported_by:
    - reference_id: PMID:19386895
      supporting_text: >-
        Loss of profilaggrin or filaggrin leads to a poorly formed stratum corneum
        (ichthyosis), which is also prone to water loss (xerosis).
    - reference_id: PMID:32165560
      supporting_text: >-
        Thus, the pH shift appears to function specifically in altering the material
        properties of histidine-rich KGs, which in turn promote chromatin compaction,
        enucleation, and skin barrier establishment.

- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping of IPR003303 (Filaggrin repeat) to the root structural term.
      The signature matched is the tandem repeat region, and the directly demonstrated
      activity of that region is not architectural but a binding activity: filaggrin
      associates specifically with intermediate filaments and aligns them into
      macrofibrils, with roughly two filaggrin molecules per three-chain filament building
      block [PMID:6170061], and the histidine-rich filaggrins were shown in vitro to
      aggregate keratin filaments specifically into bundles [PMID:6195345]. The mechanism
      is a charge-complementary "ionic zipper" between cationic beta-turns of the repeat
      and the packed rod domains of the filament [PMID:7687298], and it is so
      sequence-degenerate that a 20-26 residue synthetic peptide is as effective as the
      full-length protein. In vitro the repeat binds type III vimentin/desmin filaments as
      well as type I/II keratin; in vivo the partner is keratin.
    action: MODIFY
    reason: >-
      This is not a claim that filaggrin lacks structural molecule activity - it plainly
      has one, and this review ACCEPTs the IDA to GO:0030280 (structural constituent of
      skin epidermis) for the cornified-envelope pool. GO:0030280 is_a GO:0005198, so the
      bare root-level IEA is redundant with a child term that is already asserted from
      direct evidence on the human protein, and it is the less informative of the two.
      Separately, the signature that generated this IEA is IPR003303 (Filaggrin repeat),
      and the directly demonstrated activity of that repeat region is a binding activity
      rather than an architectural one: it associates specifically with pre-formed
      intermediate filaments and condenses them into macrofibrils [PMID:6170061,
      PMID:6195345, PMID:7687298], and the repeat pool is subsequently deiminated and
      proteolysed to free amino acids [PMID:8417356] rather than retained in the structure
      it organises. The durable fix is therefore at the mapping level - IPR003303 is better
      mapped to GO:1990254 keratin filament binding - which is what is proposed as the
      replacement here. An independent OpenScientist analysis is consistent with this,
      finding every repeat region intrinsically disordered with low helix and sheet
      propensity and cationic only at acidic skin pH.
    proposed_replacement_terms:
    - id: GO:1990254
      label: keratin filament binding
    additional_reference_ids:
    - PMID:6170061
    - PMID:6195345
    - PMID:7687298
    - PMID:19386895
    - file:human/FLG/FLG-hypotheses/mf-keratin-binding-vs-structural/openscientist.md
    supported_by:
    - reference_id: PMID:6170061
      supporting_text: >-
        We describe a class of cationic structural proteins that associate specifically
        with intermediate filaments (IF) but not with other types of cytoskeletal proteins.
    - reference_id: PMID:6170061
      supporting_text: >-
        Stoichiometric analyses suggest that two molecules of filaggrin bind to each
        three-chain building block of the IF, possibly by ionic interactions with the
        coiled-coil alpha-helical regions of the IF.
    - reference_id: PMID:6195345
      supporting_text: >-
        secondly by their ability in vitro to aggregate keratin filaments specifically into
        bundles
    - reference_id: PMID:7687298
      supporting_text: >-
        Filaggrins of mammalian epidermis represent archetypical examples of intermediate
        filament-associated proteins that can bind large numbers of intermediate filaments
        in vitro (and keratin filaments in vivo) into macrofibrils.
    - reference_id: PMID:19386895
      supporting_text: >-
        which binds to and condenses the keratin cytoskeleton and thereby contributes to
        the cell compaction process that is required for squame biogenesis
    - reference_id: file:human/FLG/FLG-hypotheses/mf-keratin-binding-vs-structural/openscientist.md
      supporting_text: >-
        The immediate molecular function of the mature ~324-aa filaggrin repeat unit is best
        described as **intermediate-filament / keratin binding that drives keratin bundling**
        (GO:0019215 / GO:1990254), *not* a generic **structural molecule activity**
        (GO:0005198).

- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping of IPR002048 (EF-hand domain), and in this case the electronic
      call is correct and understates the available evidence. Calcium binding by the two
      N-terminal EF-hands was demonstrated biochemically in vitro [PMID:8417356], and a
      2.2 A crystal structure of the human profilaggrin N-terminal S100 domain was solved
      with bound calcium ions [PMID:25760235, PDB 4PCW]. UniProt places Ca(2+) binding
      residues at 62, 64, 66, 68 and 73 - i.e. in the canonical EF-hand 2 only; EF-hand 1
      is the S100-type pseudo-EF-hand. Calcium dependence is functionally meaningful: the
      A and B domains together bind annexin II and keratin intermediate filaments in a
      calcium-dependent manner [PMID:32893105].
    action: ACCEPT
    reason: >-
      Directly demonstrated, with structural proof. Scope note for downstream users: this
      is a property of profilaggrin and of the cleaved N-terminal AB fragment, not of the
      mature filaggrin repeat monomer, which contains no EF-hand. It is a regulatory
      activity rather than the barrier-forming one. An evidence upgrade from IEA to IDA
      citing PMID:25760235 would be justified.
    additional_reference_ids:
    - PMID:8417356
    - PMID:25760235
    - PMID:32893105
    - file:human/FLG/FLG-hypotheses/function-hypothesis-go-0005509/openscientist.md
    supported_by:
    - reference_id: PMID:8417356
      supporting_text: >-
        It contains two alpha-helical regions, termed EF-hands, that bind calcium in vitro.
        This is the first example of functional calcium-binding domains fused to a
        structural protein.
    - reference_id: PMID:32893105
      supporting_text: >-
        Profilaggrin B domain cooperates with the S100 domain to bind annexin II and
        keratin intermediate filaments in a calcium-dependent manner using exposed cationic
        surface.
    - reference_id: file:human/FLG/FLG-hypotheses/function-hypothesis-go-0005509/openscientist.md
      supporting_text: >-
        Calcium binding is a genuine, direct molecular function of the gene product,
        localized to the **N-terminal profilaggrin S100 "fused-type" domain**, which contains
        two EF-hand motifs.

- term:
    id: GO:0046914
    label: transition metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping of IPR034325 (S-100 domain). Soluble S100 family members often
      carry a secondary Zn(2+)/Cu(2+) site at the dimer interface, and the mapping
      propagates that expectation to every S100-domain protein. No such site has been
      demonstrated for filaggrin. The dedicated 2.2 A structural study of exactly this
      domain reports only calcium ions bound and discusses no transition metal
      [PMID:25760235], and UniProt P20930 annotates five Ca(2+) binding residues and no
      transition-metal site at all.
    action: REMOVE
    reason: >-
      A signature-level over-propagation with no experimental support in this protein and
      with the most direct available evidence - a calcium-bound crystal structure of the
      very domain in question - silent on transition metals. This is exactly the category
      of demonstrably unwarranted electronic mapping that should be removed rather than
      retained as a hedge; the genuine metal-binding activity of the domain is already
      captured by GO:0005509. An independent OpenScientist audit adds three convergent
      lines: the deposited 4PCW coordinates contain eight calcium atoms and no
      transition-metal atoms; residues 1-91 carry only two histidines and no cysteines,
      lacking the His3Asp/His4-6 or Cys-cluster chemistry that characterised metal-binding
      S100 proteins use, and those two histidines are 8-15 A from any calcium site and
      cannot cluster into a motif; and the genuinely Zn-binding S100 proteins (S100A7,
      S100A8, S100A9, S100B) instead carry the specific child term GO:0008270 with
      experimental evidence. Because the mapping is at the signature level, all six human
      S100 fused-type proteins carrying IPR034325 (FLG, FLG2, HRNR, RPTN, TCHH, CRNN) have
      inherited the same unsupported claim. The honest caveat is that no study has directly
      assayed this domain for Zn(2+)/Cu(2+) binding, so the case rests on structure,
      sequence and comparative annotation rather than a direct negative experiment; a
      confirmatory assay is listed under suggested_experiments.
    additional_reference_ids:
    - PMID:25760235
    - file:human/FLG/FLG-hypotheses/function-hypothesis-go-0046914/openscientist.md
    supported_by:
    - reference_id: PMID:25760235
      supporting_text: >-
        To explore its molecular function, we determined a 2.2 Å-resolution crystal
        structure of the N-terminal fused-type S100 domain of human profilaggrin with bound
        calcium ions.
    - reference_id: file:human/FLG/FLG-hypotheses/function-hypothesis-go-0046914/openscientist.md
      supporting_text: >-
        a HETATM audit of the deposited coordinates finds **8 calcium atoms and zero
        transition-metal atoms**
    - reference_id: file:human/FLG/FLG-hypotheses/function-hypothesis-go-0046914/openscientist.md
      supporting_text: >-
        The IEA annotation of FLG to **transition metal ion binding (GO:0046914)** is an
        **over-annotation** — a family-level InterPro2GO carry-over rather than a
        member-specific, experimentally supported molecular function of the filaggrin gene
        product.

- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23629652
  qualifier: enables
  review:
    summary: >-
      IntAct-curated interaction with KLK5 (Q9Y337). The relationship is enzyme-substrate:
      KLK5 was identified as a profilaggrin-processing protease, the two co-localise in
      the stratum granulosum, and KLK5 knockdown raises profilaggrin levels
      [PMID:23629652]. Filaggrin is the substrate here, not the actor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The interaction is real and correctly curated, but bare `protein binding` conveys no
      functional information about FLG and an enzyme-substrate contact is not a molecular
      function of the substrate. Retained as a documented interaction, not as a core
      function. Where FLG does have informative, pocket-mediated partners - annexin II,
      stratifin/14-3-3 sigma and HSP27 binding the hydrophobic pockets of the N-terminal
      S100 dimer [PMID:25760235] - those would be the interactions worth capturing.
    additional_reference_ids:
    - PMID:25760235
    supported_by:
    - reference_id: PMID:23629652
      supporting_text: >-
        KLK5 knockdown in normal cultured human epidermal keratinocytes resulted in higher
        levels of profilaggrin, indicating that KLK5 potentially functions in profilaggrin
        cleavage.
    - reference_id: PMID:23629652
      supporting_text: >-
        we reveal that KLK5 and profilaggrin co-localize in the stratum granulosum in human
        epidermis
    - reference_id: PMID:25760235
      supporting_text: >-
        The profilaggrin S100 domain formed a stable dimer, which contained two hydrophobic
        pockets that provide a molecular interface for protein interactions.

- term:
    id: GO:0036464
    label: cytoplasmic ribonucleoprotein granule
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      This is a mapping artefact rather than a finding. The Human Protein Atlas reports
      FLG localised to "cytoplasmic bodies" in HaCaT keratinocytes (Enhanced reliability,
      antibodies HPA027505 and HPA030188); GO_REF:0000052 maps the HPA "cytoplasmic
      bodies" class onto GO:0036464. In a keratinocyte line, FLG-positive cytoplasmic
      puncta are keratohyalin-granule-like condensates - HaCaT is the very cell line in
      which filaggrin condensate assembly was characterised [PMID:32165560] - not
      ribonucleoprotein granules.
    action: MODIFY
    reason: >-
      GO:0036464 requires ribonucleoprotein content, and filaggrin has no known RNA-binding
      activity nor any reported association with P-bodies or stress granules. The observed
      structure is well characterised and has its own term: GO:0036457 keratohyalin
      granule, which is already independently supported for this gene by IDA and IBA. The
      underlying imaging observation is sound; only the term choice is wrong.
    proposed_replacement_terms:
    - id: GO:0036457
      label: keratohyalin granule
    additional_reference_ids:
    - PMID:32165560
    - PMID:1429717
    supported_by:
    - reference_id: PMID:32165560
      supporting_text: >-
        Here, we found that filaggrin assembles KGs through liquid-liquid phase separation.
    - reference_id: PMID:1429717
      supporting_text: >-
        It is synthesized as a large precursor protein, profilaggrin, that consists of
        multiple filaggrin units and is localized in keratohyalin granules.

