- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:32165560
  qualifier: enables
  review:
    summary: >-
      Proposed new molecular function, covering the activity by which filaggrin builds
      keratohyalin granules. Filaggrin and its paralogs are intrinsically disordered
      low-complexity repeat proteins that assemble keratohyalin granules by liquid-liquid
      phase separation [PMID:32165560]. The tandem repeat array is the functional unit:
      disease-associated variants retaining four or fewer repeats raise the critical
      concentration for phase separation from ~130 uM to over 1500 uM, and the N-terminal
      S100 domain lowers that critical concentration by dimerising. Endogenous granules
      behave as liquid condensates whose coalescence is limited by keratin filament
      bundles, and whose pH-triggered dissolution at the granular-to-corneum transition
      drives chromatin compaction and enucleation.
    action: NEW
    reason: >-
      GO:0140693 is defined as "binding and bringing together two or more macromolecules in
      contact, permitting those molecules to organize as a molecular condensate" - a precise
      fit for what filaggrin does, and the mechanism that unifies its granule biology with
      its keratin-organising role. GOA currently has no molecular function term describing
      this. It is distinct from the keratin-binding activity proposed for GO:0005198 and
      from the cornified-envelope structural role of GO:0030280, and it is the activity most
      directly perturbed by the FLG repeat-number variants that cause human disease.
    supported_by:
    - reference_id: PMID:32165560
      supporting_text: >-
        Here, we found that filaggrin assembles KGs through liquid-liquid phase separation.
    - reference_id: PMID:32165560
      supporting_text: >-
        Filaggrin and its less-studied (often less-abundant) paralogs are intrinsically
        disordered repeat proteins with a low-complexity (LC) sequence.
    - reference_id: PMID:32165560
      supporting_text: >-
        The S100 domain is known to dimerize (29), and when fused to filaggrin variants, it
        reduced the critical concentration for phase separation
    - reference_id: PMID:32165560
      supporting_text: >-
        Our findings suggest a model whereby reciprocal density-dependent interactions
        between LC domains of terminal differentiation–specific keratins and KGs structure
        the cytoplasm to form an elaborate, interwoven network of stabilized liquid-like KGs
        and keratin filament bundles.

core_functions:
- description: >-
    The mature filaggrin repeat monomer is an intrinsically disordered, histidine- and
    arginine-rich polycation that scaffolds keratohyalin granules as liquid-liquid
    phase-separated condensates and binds keratin intermediate filaments along their rod
    domains through charge-complementary contacts, condensing them into macrofibrillar
    bundles. Condensate assembly and keratin bundling are reciprocally organising and both
    scale with the number of repeats, which is why repeat-truncating FLG variants cause
    disease; whether they are one physical activity observed at two scales or two separable
    activities is an open question (see suggested_questions), so GO's two molecular function
    terms are recorded here as two core functions - this entry for the condensate scaffold
    and the next for keratin filament binding. This activity operates in the granular layer
    and drives cell compaction, chromatin compaction and enucleation as the keratinocyte
    becomes a squame.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - id: GO:0070268
    label: cornification
  - id: GO:0061436
    label: establishment of skin barrier
  locations:
  - id: GO:0036457
    label: keratohyalin granule
  supported_by:
  - reference_id: PMID:32165560
    supporting_text: >-
      Here, we found that filaggrin assembles KGs through liquid-liquid phase separation.
  - reference_id: PMID:6170061
    supporting_text: >-
      Stoichiometric analyses suggest that two molecules of filaggrin bind to each
      three-chain building block of the IF, possibly by ionic interactions with the
      coiled-coil alpha-helical regions of the IF.
  - reference_id: PMID:7687298
    supporting_text: >-
      Filaggrins of mammalian epidermis represent archetypical examples of intermediate
      filament-associated proteins that can bind large numbers of intermediate filaments in
      vitro (and keratin filaments in vivo) into macrofibrils.

- description: >-
    Keratin filament binding is the founding, directly demonstrated activity of the filaggrin
    repeat and the one the protein is named for. The repeat monomer associates specifically
    with intermediate filaments and not with other cytoskeletal proteins, at roughly two
    filaggrin molecules per three-chain filament building block, and aggregates keratin
    filaments into macrofibrillar bundles in vitro and in vivo. The mechanism is a
    charge-complementary "ionic zipper" between cationic beta-turns of the repeat and the
    packed rod domains of the filament, and it is sequence-degenerate enough that a short
    synthetic peptide reproduces it. In vitro the repeat also binds type III vimentin and
    desmin filaments; in vivo the partner is keratin. This is the activity that GO:0005198
    (structural molecule activity, IEA from IPR003303) should be repointed to.
  molecular_function:
    id: GO:1990254
    label: keratin filament binding
  directly_involved_in:
  - id: GO:0070268
    label: cornification
  - id: GO:0061436
    label: establishment of skin barrier
  locations:
  - id: GO:0036457
    label: keratohyalin granule
  supported_by:
  - reference_id: PMID:6170061
    supporting_text: >-
      We describe a class of cationic structural proteins that associate specifically
      with intermediate filaments (IF) but not with other types of cytoskeletal proteins.
  - reference_id: PMID:6195345
    supporting_text: >-
      secondly by their ability in vitro to aggregate keratin filaments specifically into
      bundles
  - reference_id: PMID:7687298
    supporting_text: >-
      Filaggrins of mammalian epidermis represent archetypical examples of intermediate
      filament-associated proteins that can bind large numbers of intermediate filaments
      in vitro (and keratin filaments in vivo) into macrofibrils.

- description: >-
    A fraction of filaggrin is covalently isodipeptide cross-linked by transglutaminases into
    the cornified envelope, where it becomes a permanent structural constituent and anchors
    the subjacent keratin-filaggrin network to the developing envelope. Unlike the transient
    keratin-condensing activity, this pool is not degraded to natural moisturising factor.
  molecular_function:
    id: GO:0030280
    label: structural constituent of skin epidermis
  directly_involved_in:
  - id: GO:0070268
    label: cornification
  locations:
  - id: GO:0001533
    label: cornified envelope
  supported_by:
  - reference_id: PMID:7543090
    supporting_text: >-
      The data establish for the first time that these several proteins are indeed
      cross-linked protein components of the CE structure.
  - reference_id: PMID:7543090
    supporting_text: >-
      The recovery of cross-links involving keratins further suggests that the subjacent
      cytoplasmic keratin intermediate filament-filaggrin network is anchored to the
      developing CE during these events.

- description: >-
    The N-terminal S100 "A" domain of profilaggrin is a calcium-binding module - a canonical
    EF-hand plus an S100-type pseudo-EF-hand - that dimerises and, together with the adjacent
    B domain, binds partner proteins including annexin II, stratifin/14-3-3 sigma and HSP27 in
    a partly calcium-dependent manner. After proteolytic release this fragment translocates to
    the keratinocyte nucleus via a functional NLS in the B domain; that nuclear pool is
    transient and is treated here as a non-core location rather than a site of this core
    activity. This is a regulatory activity of the precursor and its cleaved N-terminus,
    entirely separate from the repeat unit's barrier-forming activity.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  locations:
  - id: GO:0036457
    label: keratohyalin granule
  supported_by:
  - reference_id: PMID:8417356
    supporting_text: >-
      It contains two alpha-helical regions, termed EF-hands, that bind calcium in vitro.
      This is the first example of functional calcium-binding domains fused to a structural
      protein.
  - reference_id: PMID:32893105
    supporting_text: >-
      Profilaggrin B domain cooperates with the S100 domain to bind annexin II and keratin
      intermediate filaments in a calcium-dependent manner using exposed cationic surface.
  - reference_id: PMID:12230510
    supporting_text: >-
      The nuclear localization signals in human and mouse profilaggrin were shown to be
      functional by transfection of epithelial cells and depended on the absence of
      filaggrin sequences.

proposed_new_terms: []

suggested_questions:
- question: >-
    Is the keratin-bundling activity of the filaggrin repeat separable from its
    condensate-scaffolding activity, or are they the same physical interaction observed at
    two scales? A repeat variant that phase-separates normally but fails to bundle keratin
    (or the converse) would settle whether GO should record one molecular function or two.
  experts: []
- question: >-
    Should GO:0030280 (structural constituent of skin epidermis) be reserved for the
    cross-linked cornified-envelope pool of filaggrin, with the keratin-organising activity of
    the soluble pool annotated separately? At present a single molecular function term is
    doing both jobs for several epidermal proteins.
  experts: []
- question: >-
    Does the profilaggrin N-terminal AB fragment have a molecular function in the nucleus, or
    is nuclear translocation simply a disposal route? Its identified partners annexin II,
    14-3-3 sigma and HSP27 are all cytoplasmic, and no nuclear target has been reported.
  experts: []
- question: >-
    Is there any experimental evidence that any S100 fused-type protein binds a transition
    metal? If not, the InterPro2GO mapping of IPR034325 to GO:0046914 may be propagating an
    unwarranted transition-metal claim across the whole SFTP family, not just FLG.
  experts: []

suggested_experiments:
- hypothesis: >-
    The profilaggrin S100 domain does not bind transition metals, and GO:0046914 is an
    unwarranted InterPro2GO propagation.
  description: >-
    Test transition-metal binding of the recombinant profilaggrin S100 domain directly by
    isothermal titration calorimetry and inductively coupled plasma mass spectrometry with
    Zn(2+) and Cu(2+), in the presence and absence of saturating Ca(2+). This would either
    supply the missing evidence for GO:0046914 or confirm its removal.
- hypothesis: >-
    Condensate scaffolding and keratin bundling are separable activities of the filaggrin
    repeat, driven by distinct sequence features.
  description: >-
    Engineer FLG repeat variants that decouple charge from phase behaviour - for example
    His-to-Gln substitutions that abolish pH-triggered dissolution while preserving net
    charge, and Arg-to-Lys substitutions that preserve charge while removing cation-pi
    capacity - and assay condensate formation and keratin bundling in parallel in HaCaT cells
    and in vitro with reconstituted K1/K10 filaments.
- hypothesis: >-
    The cornified-envelope cross-linked pool of filaggrin is a minor side branch relative to
    the pool degraded to natural moisturising factor.
  description: >-
    Quantify by targeted proteomics what fraction of filaggrin ends up cross-linked into the
    cornified envelope versus degraded to natural moisturising factor, across FLG genotypes.
    This would establish whether the structural (GO:0030280) and transient
    condensate/keratin-binding pools are comparable in size.
- hypothesis: >-
    Filaggrin condenses keratin filaments by distributed electrostatic contacts along the
    filament rod domain, as predicted by the ionic zipper model.
  description: >-
    Reconstitute keratohyalin-granule-like condensates in vitro from purified filaggrin repeat
    protein and K1/K10 filaments and image by cryo-electron tomography, to test the ionic
    zipper model directly and determine whether keratin is excluded from, wets, or is embedded
    within the condensate.

