    action: KEEP_AS_NON_CORE
    reason: >-
      Retained because the localisation is real, not because the cited dataset establishes
      it - the supporting references added here, not the sperm-nucleus proteome, are what
      carry the claim. It is non-core and fragment-specific: only the cleaved N-terminal
      AB peptide enters the nucleus, transiently, at the granular-to-cornified transition;
      mature filaggrin repeats do not. Re-anchoring this annotation to PMID:9800950 or
      PMID:12230510 with an experimental evidence code would be an improvement.
    additional_reference_ids:
