  evidence_type: HDA
  original_reference_id: PMID:21630459
  qualifier: located_in
  review:
    summary: >-
      The cited evidence is a shotgun proteomic catalogue of purified human sperm nuclei
      [PMID:21630459], which is a weak basis for this claim in a keratinocyte protein and
      is prone to the same contamination confound as the bone-marrow ECM dataset. The term
      itself, however, is independently correct for FLG on much better evidence: the
      cleaved profilaggrin N-terminal domain carries a functional bipartite nuclear
