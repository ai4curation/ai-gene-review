    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:A6NM10-2
  review:
    summary: Binary yeast two-hybrid hit (UniProtKB:A6NM10-2) from the HuRI human reference interactome;
      bare protein binding carries no functional information.
    action: REMOVE
    reason: Generic protein binding is uninformative and no more specific molecular function can be derived
      from a high-throughput Y2H pair, so the row is removed rather than rewritten. None of the 45 HuRI
      partners of DWORF is a SERCA pump or a regulin (PLN, SLN, MRLN), the only partners with functional
      support; nearly all are unrelated membrane proteins (aquaporins, tetraspanins, SLC transporters,
      GPCRs, syntaxins), the pattern expected when a single hydrophobic transmembrane helix is expressed
      in a yeast nuclear assay. Removal does not imply the reported interaction is false.
