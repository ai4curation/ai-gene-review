- term:
    id: GO:1901894
    label: regulation of ATPase-coupled calcium transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P0DN83
  review:
    summary: DWORF increases SERCA Ca2+-ATPase activity; the direction of regulation is known, so the
      positive-regulation child is more informative.
    action: MODIFY
    reason: Mouse (PMID:26816378) and human-sequence (PMID:33581112, PMID:34075877) studies all report
      that DWORF increases, never decreases, SERCA activity (by raising apparent Ca2+ affinity or turnover).
      The positive child GO:1901896 is therefore preferred; mouse Dworf already carries it by IMP.
    proposed_replacement_terms:
    - id: GO:1901896
      label: positive regulation of ATPase-coupled calcium transmembrane transporter activity
    supported_by:
    - *id006
    - *id007
    - *id003
- term:
    id: GO:1902082
    label: positive regulation of calcium ion import into sarcoplasmic reticulum
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P0DN83
  review:
    summary: DWORF enhances Ca2+ uptake into the SR by activating SERCA; this is the core process.
    action: ACCEPT
    reason: Cardiomyocytes overexpressing DWORF show faster cytosolic Ca2+ decay and higher SR Ca2+ load,
      and DWORF KO muscle shows reduced SERCA Ca2+ affinity (PMID:26816378). Human DWORF accelerates SERCA2a-dependent
      Ca2+ uptake in cell assays (PMID:33581112, PMID:34075877). DWORF does the regulatory work of the
      process directly through binding the pump.
    supported_by:
