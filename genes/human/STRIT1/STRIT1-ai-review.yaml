- term:
    id: GO:0008047
    label: enzyme activator activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0DN83
  review:
    summary: DWORF increases SERCA Ca-ATPase activity (displacing PLN/SLN/MRLN and, per human-sequence
      studies, also activating SERCA directly). The activity is correct but the term is too general.
    action: MODIFY
    reason: 'The ISS transfer from mouse Dworf (P0DN83) is sound, and human DWORF itself has direct experimental
      support: human DWORF raises the apparent Ca affinity of human SERCA2a in HEK293 homogenates, P15/W22
      are needed (PMID:33581112), and purified recombinant human DWORF raises the turnover of reconstituted
      SERCA1a (PMID:34075877). The target, SERCA, is a P-type ATPase and a transporter, so the matched
      specific terms are ATPase activator activity (GO:0001671) and transporter activator activity (GO:0141109).
      Comparator check: human PLN, the inhibitory regulin, carries the mirror terms ATPase inhibitor activity
      (GO:0042030) and transporter inhibitor activity (GO:0141110) by IDA, and the mouse Pln GO-CAM (62f58d8800005094)
      uses ATPase inhibitor activity. Whether DWORF activates directly or only by relieving inhibition
      is disputed (PMID:26816378, PMID:30299255 vs PMID:33581112, PMID:34075877), but either way the net
      molecular effect is increased pump activity.'
    proposed_replacement_terms:
    - id: GO:0001671
      label: ATPase activator activity
    - id: GO:0141109
      label: transporter activator activity
    additional_reference_ids:
    - PMID:33581112
    - PMID:34075877
    - PMID:26816378
    supported_by:
    - reference_id: PMID:33581112
      supporting_text: gene was similarly fused to the N terminus of the human DWORF or PLB gene
    - &id006
      reference_id: PMID:33581112
      supporting_text: We observed that DWORF activates SERCA2a directly, in the absence of PLB, by enhancing
        the Ca-ATPase apparent calcium affinity
    - &id009
      reference_id: PMID:33581112
      supporting_text: 'In our model, DWORF binds to SERCA2a, displacing PLB, and activates SERCA via
        two distinct mechanisms: (a) DWORF displaces the inhibitory PLB and (b) DWORF activates SERCA
        directly, above the level of SERCA in the absence of both DWORF and PLB.'
    - reference_id: PMID:34075877
      supporting_text: Recombinant human DWORF was expressed as a maltose-binding protein (MBP) fusion
        with a TEV cleavage site for removal of MBP.
    - &id007
      reference_id: PMID:34075877
      supporting_text: Here, we show that DWORF is a direct activator of SERCA, increasing its turnover
        rate in the absence of phospholamban.
    - &id008
      reference_id: PMID:26816378
      supporting_text: Based on gain- and loss-of-function studies, our results demonstrate that DWORF
        enhances SR Ca2+ uptake and myocyte contractility through its displacement of the inhibitory peptides
        PLN, SLN, and MLN from SERCA (Fig. 4C).
- term:
    id: GO:0031449
    label: regulation of slow-twitch skeletal muscle fiber contraction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR044529
  review:
    summary: Mouse Dworf knockout soleus relaxes more slowly after tetanic stimulation; this is a downstream
      physiological consequence of reduced SERCA activity in slow-twitch fibres.
    action: KEEP_AS_NON_CORE
    reason: The evidence (mouse KO; PMID:26816378) supports a role in slow-twitch fibre relaxation, and
      DWORF is enriched in slow-twitch muscle. The effect is modest (only post-tetanic relaxation was
      altered, peak force unchanged) and follows from the core activity on SERCA, so it is retained as
      a non-core physiological process. This InterPro2GO mapping (IPR044529 DWORF family) is appropriate
      for the family.
    supported_by:
    - &id002
      reference_id: PMID:26816378
      supporting_text: however, at tetanus-inducing frequencies, relaxation rates were significantly slowed
        in Dworf KO muscles after tetanus (Fig. 3F).
    - &id003
      reference_id: PMID:26816378
      supporting_text: Analysis of homogenates from the soleus muscle of Dworf KO mice revealed a decreased
        apparent affinity of SERCA for Ca2+ as compared with homogenates from WT muscles (Fig. 4B and
        table S3).
