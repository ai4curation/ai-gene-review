- term:
    id: GO:0033017
    label: sarcoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0241
  review:
    summary: DWORF is a tail-anchored single-pass membrane peptide of the sarcoplasmic reticulum, where
      it colocalizes with SERCA.
    action: ACCEPT
    reason: Mouse GFP-DWORF shows SR striations in skeletal muscle fibres (PMID:26816378); human DWORF
      has a single C-terminal transmembrane helix and functions on SERCA in ER/SR membranes. Human expression
      is muscle-restricted, so SR membrane is the appropriate location.
    supported_by:
    - &id004
      reference_id: PMID:26816378
      supporting_text: GFP-DWORF localizes in an alternating pattern with myosin (Fig. 2A), a distribution
        consistent with the location of the SR.
    - &id005
      reference_id: PMID:28436536
      supporting_text: phospholamban, sarcolipin, myoregulin and DWORF are expressed in the membrane of
        the sarcoplasmic reticulum of muscle cells, where they regulate the sarco/endoplasmic reticulum
        Ca 2+ ‐ATPase (SERCA).
