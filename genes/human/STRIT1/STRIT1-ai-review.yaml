suggested_questions:
- question: Does DWORF activate SERCA directly, or only by displacing phospholamban/sarcolipin/myoregulin?
    The Olson lab (mouse peptide; PMID:26816378, PMID:30299255) saw no effect without inhibitor, while
    studies using human DWORF (PMID:33581112, PMID:34075877) report direct activation. Is the discrepancy
    due to species sequence, expression ratio or assay?
- question: Should human STRIT1 receive direct (IDA) GO annotations from PMID:33581112 and PMID:34075877,
    which used the human peptide? At present every human functional row is an ISS transfer from mouse.
- question: What are the endogenous DWORF protein levels in human heart and slow skeletal muscle, and
    are they reduced in human heart failure as the mRNA is?
suggested_experiments:
- hypothesis: Human DWORF directly increases SERCA2a turnover independent of phospholamban.
  description: Co-reconstitute purified human DWORF with human SERCA2a in proteoliposomes at defined lipid-to-protein
    ratios, with and without PLN, and measure Ca2+-dependent ATPase activity and Ca2+ transport; include
    P15A/W22A mutants as negative controls.
  experiment_type: in vitro reconstitution enzyme assay
- hypothesis: Endogenous DWORF contributes to SR Ca2+ reuptake in human cardiomyocytes.
  description: Knock out or knock down STRIT1 in human iPSC-derived ventricular cardiomyocytes and measure
    Ca2+ transient decay, SR Ca2+ load (caffeine) and oxalate-supported SERCA Ca2+ uptake, with a human-DWORF-specific
    antibody to confirm loss of protein.
  experiment_type: loss-of-function in human cells
