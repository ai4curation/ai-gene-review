core_functions:
- description: 'Cytoplasmic tyrosyl-tRNA synthetase: activates L-tyrosine with ATP to form tyrosyl-adenylate
    and transfers it to tRNA(Tyr), supplying Tyr-tRNA(Tyr) for cytoplasmic translation. Directly measured
    for the human enzyme and inherited across PANTHER subfamily PTHR11586:SF43.'
  molecular_function:
    id: GO:0004831
    label: tyrosine-tRNA ligase activity
  directly_involved_in:
  - id: GO:0006418
    label: tRNA aminoacylation for protein translation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id008
  - *id007
- description: 'Nuclear PARP1 activator: a regulated nuclear pool of TyrRS, increased by serum starvation
    or resveratrol, binds the PARP1 C-terminal domain and stimulates its auto-poly-ADP-ribosylation. Established
    only in human cells and mouse; not an inherited clade-level function.'
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id010
  - *id012
  - *id005
suggested_questions:
- question: Does endogenous YARS1 activate PARP1 under physiological stress without exogenous resveratrol,
    and which tyrosine-pocket ligands cause the conformational switch?
- question: Are the cytokine activities of mini-TyrRS and the EMAP-II-like fragment produced in vivo in
    humans, and in which tissues and conditions?
- question: Do CMT-associated YARS1 variants cause neuropathy through loss of aminoacylation, through
    a gain of non-canonical function, or both?
suggested_experiments:
- description: Knock in an aminoacylation-competent but PARP1-binding-deficient YARS1 (for example, a
    C-domain/linker mutant) and measure PARylation and stress signalling during serum starvation, to separate
    the nuclear function from translation.
- description: Use mass spectrometry to detect endogenous mini-TyrRS and the C-terminal fragment in human
    plasma or inflammatory exudates, to test whether secreted cytokine forms arise in vivo.
