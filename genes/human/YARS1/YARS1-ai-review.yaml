- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:22291016
  qualifier: is_active_in
  review:
    summary: A regulated fraction of YARS1 enters the nucleus through an NLS in the anticodon-recognition
      domain; import is suppressed by tRNA(Tyr) binding and increased by serum starvation or resveratrol.
    action: ACCEPT
    reason: Nuclear localization is directly demonstrated in human cells (PMID:22291016, PMID:25533949),
      and the nucleus is where TyrRS performs its experimentally established PARP1-activating function.
      The pool is conditional and regulated by tRNA(Tyr) binding, while the bulk of the protein and the
      aminoacylation function are cytosolic.
    supported_by:
    - &id004
      reference_id: PMID:22291016
      supporting_text: human tyrosyl-tRNA synthetase (TyrRS) distributes to the nucleus and that the nuclear
        import of human TyrRS is regulated by its cognate tRNA(Tyr)
