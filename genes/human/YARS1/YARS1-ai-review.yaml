id: P54577
gene_symbol: YARS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'YARS1 encodes cytoplasmic tyrosyl-tRNA synthetase (TyrRS), a class I aminoacyl-tRNA synthetase
  that attaches L-tyrosine to tRNA(Tyr) in two steps: ATP-dependent formation of tyrosyl-adenylate in
  the Rossmann-fold catalytic domain, then transfer to the tRNA acceptor end. The 528-residue protein
  is a homodimer made of a catalytic domain, an anticodon-recognition domain, and a vertebrate-appended
  C-terminal EMAP-II-like tRNA-binding domain. It acts mainly in the cytosol and supplies Tyr-tRNA(Tyr)
  for cytoplasmic translation. A regulated fraction enters the nucleus through a hexapeptide NLS in the
  anticodon-recognition domain that is masked when tRNA(Tyr) is bound. Nuclear TyrRS binds PARP1 and stimulates
  its auto-poly-ADP-ribosylation, which serum starvation and resveratrol enhance; resveratrol occupies
  the tyrosine pocket and inhibits aminoacylation. Under apoptotic conditions full-length TyrRS is secreted,
  and elastase cleavage releases mini-TyrRS, an IL-8-like cytokine that binds CXCR1, and a chemotactic
  EMAP-II-like C-terminal fragment. Heterozygous YARS1 variants cause dominant intermediate Charcot-Marie-Tooth
  neuropathy type C. Biallelic hypomorphic variants cause an infantile-onset multisystem disease.'
