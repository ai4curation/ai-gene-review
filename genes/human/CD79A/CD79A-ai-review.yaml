- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - MGI:MGI:101774
  - PANTHER:PTN000371571
  review:
    summary: CD79A supplies a receptor-associated scaffold that recruits signaling proteins.
    action: MODIFY
    reason: The receptor-complex contribution is biologically correct, but signaling receptor complex
      adaptor activity more precisely names CD79A's own physical role. Its phosphorylated ITAM binds SYK;
      a distinct phosphorylated non-ITAM site recruits BLNK. Defined human SYK/CD79A phosphopeptide assays
      support the ITAM interaction, while the BLNK paper supports the separate docking mechanism without
      assigning its study residue numbering to human. This is a lateral role clarification, not an is_a
      descendant of receptor activity. The same refinement applies to every receptor-activity row irrespective
      of ordinary relationship metadata; original qualifiers and PAINT/ISS provenance remain unchanged.
      The core separately retains the valid contribution to whole-receptor activity, and no autonomous
      antigen-recognition or kinase activity is asserted.
    proposed_replacement_terms:
    - id: GO:0030159
      label: signaling receptor complex adaptor activity
    supported_by:
    - reference_id: PMID:39442513
      supporting_text: We developed a time-resolved Förster resonance energy transfer (TR-FRET) assay
        to evaluate the interaction between the pITAMs of FCER1G, TYROBP, CD3G and CD79A (the Ig-α chain
        of the BCR) and the SYK-tSH2 domains (here and Bashore et al.
    - reference_id: PMID:11909947
      supporting_text: BLNK bound directly to phospho-Y204
    - reference_id: PMID:35981043
    - reference_id: PMID:36426942
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000371571
        source_label: CD79 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: The committed PTHR14334 PAINT slice records the GO:0004888 IBD at this node with MGI:MGI:101774
          experimental grounding. The receptor-complex contribution is retained as biologically valid;
          no erroneous placement, target-specific loss or donor-count weakness is asserted. MODIFY expresses
          a target-level adaptor-role clarification, not rejection of the inherited receptor contribution.
