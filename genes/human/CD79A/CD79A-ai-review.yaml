core_functions:
- description: Provides a membrane-tethered adaptor platform within the B-cell antigen receptor. The phosphorylated
    cytoplasmic ITAM recruits SYK, while a separate phosphorylated non-ITAM site recruits BLNK and couples
    receptor-proximal signaling to downstream effectors. CD79A also contributes, with CD79B and membrane
    immunoglobulin, to receptor assembly and transmembrane signal transmission. This receptor-associated
    unit supports pre-B/B-cell development and activation.
