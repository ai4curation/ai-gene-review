core_functions:
- description: Contributes the Ig-alpha signaling and assembly subunit of the B-cell antigen
    receptor. Together with CD79B it organizes membrane immunoglobulin at the cell surface,
    while its cytoplasmic ITAM supplies phosphorylation-dependent docking sites for signaling
    proteins. Immunoglobulin recognizes antigen and recruited kinases perform phosphorylation.
    This unit supports pre-B/B-cell development and activation; the shorter extracellular splice
    product is not assumed to retain all full-length functions.
  contributes_to_molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0050853
    label: B cell receptor signaling pathway
  - id: GO:0030183
    label: B cell differentiation
  - id: GO:0042113
    label: B cell activation
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0019815
    label: B cell receptor complex
  supported_by:
  - reference_id: PMID:35981043
  - reference_id: PMID:36426942
  - reference_id: PMID:10525050
  - reference_id: PMID:8617796
suggested_questions:
- question: Which physiological B-cell interactions among the screen-supported partners can
    be reproduced with endogenous CD79A in the correct membrane and signaling context?
- question: Does the shorter CD79A splice product form a stable protein and assemble with CD79B
    and immunoglobulin, and how does its signaling differ from the full-length subunit?
suggested_experiments:
- description: Compare the long and short CD79A products at matched expression in a CD79A-deficient
    human B-cell system, measuring CD79B association, immunoglobulin surface expression and
    receptor-induced signaling; establish protein expression before interpreting absence of
    function.
