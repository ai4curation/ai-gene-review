id: P11912
gene_symbol: CD79A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD79A (Ig-alpha) is a type I membrane protein that forms the signaling heterodimer of the
  B-cell antigen receptor with CD79B (Ig-beta). Its extracellular and transmembrane regions help assemble
  and express the receptor complex, while its cytoplasmic immunoreceptor tyrosine-based activation motif
  provides phosphorylation-dependent docking sites for intracellular signaling proteins. Antigen recognition
  is supplied by the associated membrane immunoglobulin; CD79A contributes signal transmission and receptor
  organization rather than intrinsic kinase activity. This receptor unit supports B-cell development,
  activation and survival. Loss-of-function variants can disrupt the pro-B to pre-B transition and cause
  autosomal recessive agammaglobulinemia. An alternative splice transcript lacks part of the extracellular
  region.
