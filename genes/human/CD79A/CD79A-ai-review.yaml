    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - MGI:MGI:101774
  - PANTHER:PTN000371571
  review:
    summary: CD79A contributes to transmembrane signaling by the assembled B-cell antigen receptor.
    action: ACCEPT
    reason: The receptor term is appropriate for this ITAM-bearing signal-transducing subunit.
      Human structural and surface-expression studies establish its role in the assembled receptor,
      while functional tail experiments support signal initiation. Antigen recognition is performed
      by membrane immunoglobulin, and CD79A is not assigned autonomous ligand recognition or
      kinase activity. The core synthesis uses contributes_to, consistent with the explicit
      IBA and ISS qualifiers; the original electronic qualifier is preserved. The original ancestral
      node or complete electronic/orthology mapping chain was not independently reconstructed.
    supported_by:
    - reference_id: PMID:35981043
    - reference_id: PMID:36426942
    - reference_id: PMID:8617796
