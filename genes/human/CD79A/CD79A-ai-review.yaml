suggested_questions:
- question: Which physiological B-cell interactions among the screen-supported partners can be reproduced
    with endogenous CD79A in the correct membrane and signaling context?
- question: Does the shorter CD79A splice product form a stable protein and assemble with CD79B and immunoglobulin,
    and how does its signaling differ from the full-length subunit?
suggested_experiments:
- description: Compare the long and short CD79A products at matched expression in a CD79A-deficient human
    B-cell system, measuring CD79B association, immunoglobulin surface expression and receptor-induced
    signaling; establish protein expression before interpreting absence of function.
