    label: protein kinase activity
  evidence_type: IDA
  original_reference_id: PMID:18658136
  qualifier: enables
  review:
    summary: Refine generic protein kinase activity to the serine-specific PDK reaction chemistry.
    action: MODIFY
    reason: PDK4 phosphorylates serine residues on the pyruvate dehydrogenase E1 alpha subunit;
      GO:0106310 captures the residue chemistry more precisely than generic protein kinase activity,
      and this review already carries GO:0004740 for the PDC-specific substrate reaction.
    supported_by:
    - reference_id: PMID:11486000
      supporting_text: Activity of the mammalian pyruvate dehydrogenase complex is regulated by
        phosphorylation-dephosphorylation of three specific serine residues (site 1, Ser-264; site
        2, Ser-271; site 3, Ser-203) of the alpha subunit of the pyruvate dehydrogenase (E1)
        component. Phosphorylation is carried out by four pyruvate dehydrogenase kinase (PDK)
        isoenzymes.
      reference_section_type: ABSTRACT
    proposed_replacement_terms:
    - id: GO:0106310
      label: protein serine kinase activity
    - id: GO:0004740
      label: pyruvate dehydrogenase (acetyl-transferring) kinase activity
