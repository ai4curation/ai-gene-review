id: Q16654
gene_symbol: PDK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PDK4 is an inducible mitochondrial pyruvate dehydrogenase kinase that phosphorylates PDHA1
  to inhibit the pyruvate dehydrogenase complex. Unlike other PDK isoforms it has robust basal activity
  without the PDC core, and its expression is prominent in heart and skeletal muscle and rises in fasting
  or fatty-acid-rich states to reduce pyruvate oxidation.'
