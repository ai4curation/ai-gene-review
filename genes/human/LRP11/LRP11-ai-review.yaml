  - statement: >-
      The reviewed record describes two splice isoforms; isoform 2 replaces residues
      205-237 and lacks the remainder of the canonical sequence.
    supporting_text: "CC   -!- ALTERNATIVE PRODUCTS:\nCC       Event=Alternative splicing; Named isoforms=2;\nCC       Name=1;\nCC         IsoId=Q86VZ4-1; Sequence=Displayed;\nCC       Name=2;\nCC         IsoId=Q86VZ4-2; Sequence=VSP_017535, VSP_017536;"
    full_text_unavailable: false
  - statement: >-
      The extracellular region contains MANSC, PKD and one LDL-receptor class-A
      domain, but domain membership alone does not establish a lipoprotein ligand.
    supporting_text: "FT   DOMAIN          99..184\nFT                   /note=\"MANSC\"\nFT                   /evidence=\"ECO:0000255|PROSITE-ProRule:PRU00341\"\nFT   DOMAIN          210..305\nFT                   /note=\"PKD\"\nFT                   /evidence=\"ECO:0000255|PROSITE-ProRule:PRU00151\"\nFT   DOMAIN          309..345\nFT                   /note=\"LDL-receptor class A\"\nFT                   /evidence=\"ECO:0000255|PROSITE-ProRule:PRU00124\""
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary curated sequence/topology source. It supports membrane topology,
      domains and isoforms, while providing no experimentally established ligand
      or normal physiological process for human LRP11.
- id: PMID:15489334
  title: 'The status, quality, and expansion of the NIH full-length cDNA project: the
    Mammalian Gene Collection (MGC).'
  findings:
  - statement: >-
      The MGC generated high-quality full-open-reading-frame human and mouse cDNA
      clones; UniProt uses LRP11 clones from this resource to define its two isoforms.
    supporting_text: "The National Institutes of Health's Mammalian Gene Collection (MGC) project was \ndesigned to generate and sequence a publicly accessible cDNA resource containing \na complete open reading frame (ORF) for every human and mouse gene."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The paper is a cDNA-resource report rather than an LRP11 functional study.
      Its relevance is limited to the brain- and skin-derived full-length cDNA
      sequences cited by the reviewed UniProt record for isoforms 1 and 2.
- id: PMID:17620599
  title: Functional specialization of beta-arrestin interactions revealed by proteomic
    analysis.
  findings:
  - statement: >-
      The study was a broad beta-arrestin interactome screen, not an LRP11-focused
      functional analysis; the cached abstract does not name LRP11.
    supporting_text: "As \ndetermined by LC tandem MS, 71 proteins interacted with beta-arrestin 1, 164 \ninteracted with beta-arrestin 2, and 102 interacted with both beta-arrestins."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Only 16 randomly selected new partners were validated by coimmunoprecipitation,
      and the cache does not show whether LRP11 was among them.
    supporting_text: "The binding of 16 randomly selected newly identified beta-arrestin \npartners was validated by coimmunoprecipitation assays in HEK293 cells."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      The PMID and paper identity are verified, but the LRP11-specific hit and its
      phosphorylation/localization interpretation reside in supplementary tables
      absent from the cache. The experimental GO rows therefore remain undecided.
- id: PMID:25262641
  title: Genetic regulatory network analysis reveals that low density lipoprotein receptor-related
    protein 11 is involved in stress responses in mice.
  findings:
  - statement: >-
      In mouse amygdala, Lrp11 abundance was measured after stress and was higher in
      stressed animals; this is expression-response evidence, not a causal test of
      each transferred stress process.
    supporting_text: "Western blotting, qPCR and immunohistochemistry were used to\ninvestigate the expression variation of Lrp11 in amygdala tissue after exposure\nto stress. We found the quantity of Lrp11 was more obvious in stress models than\nthat in normal mice (P<0.05) which suggests Lrp11 might participate in the\nprocess of stress response."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Lrp11 depletion altered four transcript-level network members in human cell
      lines, but did not directly test heat, cold, deprivation or immobilization.
    supporting_text: "we transfected HEK 293T cells and SH-SY5Y cells with Lrp11 siRNA\nleading to down-regulation of Lrp11mRNA and were able to confirm a significant\ninfluence of Lrp11 depletion on the expression of Xpnpep1, Maneal, Pgap1 and\nUprt."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified as the actual mouse donor evidence behind all seven human stress
      IEAs. The paper supports stress-associated expression and a candidate gene
      network, but not causal human LRP11 involvement in seven distinct processes.
- id: PMID:31507330
  title: The role of low density lipoprotein receptor-related protein 11 as a tumor
    promoter in cervical cancer.
  findings:
  - statement: >-
      Human cervical cancer cell-line LRP11 silencing reduced proliferation,
      migration and invasion, and slowed xenograft growth.
    supporting_text: "The silencing of LRP11 in SiHa\nand CaSki cell lines inhibited cell proliferation, reduced migration and\ninvasion and suppressed cell growth in nude mice, which possibly related to cell\ncycle protein regulation of CDK 2/4, cyclin D1/E1, MMP-2/9, and VEGF."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      The paper explicitly confines these phenotypes to HSIL/cervical-cancer context
      and does not establish LRP11's normal physiological role.
    supporting_text: "LRP11 plays important roles in proliferation, migration and\ninvasion, with the potential to be a useful prognostic marker and therapeutic\ntarget for patients with HSIL and cervical cancer."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human knockdown and xenograft evidence is available in full text.
      These are strong disease-context phenotypes but should not be promoted to a
      constitutive receptor function without a defined ligand or proximal mechanism.
- id: PMID:31865764
  title: LRP11 activates β-catenin to induce PD-L1 expression in prostate cancer.
  findings:
  - statement: >-
      LRP11 gain- and loss-of-function in two human prostate-cancer cell lines placed
      LRP11 upstream of beta-catenin-dependent PD-L1 expression.
    supporting_text: "Further experiments\nin two PRAD cell lines with LRP11 over-expression and knockdown showed that\nLRP11 induced PD-L1 expression through β-catenin signalling."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRP11 overexpression suppressed Jurkat-cell activity in coculture, and blocking
      LRP11 or PD-L1 reversed the effect.
    supporting_text: "In addition, LRP11\nover-expression in PRAD cell line induced immunosuppression of Jurkat cell in\nin-vitro co-culture system. The effects of LRP11 could be blocked by\nneutralising LRP11 or PD-L1 antibody."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
