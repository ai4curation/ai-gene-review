suggested_questions:
- question: >-
    Does purified human LRP11 bind native LDL directly, and does ligand engagement
    cause particle internalization, receptor trafficking, signaling, or a combination
    of these outcomes?
- question: >-
    Which normal human T-cell subset or other tissue uses the LRP11-MAPK13-TCF1 axis,
    and is that pathway active at physiological LDL concentrations?
- question: >-
    Is LRP11 isoform 2 translated and secreted, and can it bind ligand or modulate the
    canonical membrane isoform?
- question: >-
    Does endogenous LRP11 interact directly and phospho-dependently with beta-arrestins,
    and is a functional pool present at the plasma membrane?
- question: >-
    Is the rise of mouse amygdala Lrp11 after stress an adaptive effector response, a
    downstream marker, or a nonspecific consequence of the stress paradigm?
suggested_experiments:
- hypothesis: >-
    Human LRP11 binds LDL directly but functions primarily as a signaling receptor
    rather than an LDL-internalization receptor.
  description: >-
    Determine ectodomain binding kinetics for LDL, VLDL, oxidized LDL and HDL, then
    compare fluorescent-particle uptake, degradation and MAPK13 activation in
    LRP11-knockout cells rescued with wild-type, ligand-binding-defective and
    cytoplasmic-tail-mutant human LRP11.
  experiment_type: biochemical binding, uptake, and genetic rescue
- hypothesis: >-
    Endogenous human LRP11 is required for LDL-dependent MAPK13-TCF1 signaling and
    proliferation in a defined CD8 T-cell subset.
  description: >-
    Use CRISPR knockout and wild-type rescue in primary human CD8 T-cell subsets,
    titrate physiological LDL, and measure MAPK13 activation, TCF1 phosphorylation,
    lineage-state markers and proliferation with orthogonal antibody-free readouts.
  experiment_type: primary-cell genetics and phosphosignaling
- hypothesis: >-
    LRP11 isoform 2 is a secreted extracellular protein that modifies ligand
    availability or canonical LRP11 signaling.
  description: >-
    Quantify isoform-specific RNA and peptides in primary tissues, genome-tag each
    endogenous isoform, and test secretion, stability, LDL binding and effects on
    canonical-isoform signaling in matched knockout/rescue cells.
  experiment_type: isoform-resolved proteomics and cell biology
- hypothesis: >-
    Beta-arrestin association with LRP11 is direct, phosphorylation-dependent and
    restricted to a cell-surface receptor pool.
  description: >-
    Combine endogenous reciprocal coimmunoprecipitation or proximity labeling with
    phosphatase/phosphosite perturbations, cell-surface biotinylation and
    compartment-resolved imaging before and after candidate ligand stimulation.
  experiment_type: interaction proteomics and spatial cell biology
- hypothesis: >-
    Stress-induced mouse amygdala Lrp11 expression is downstream of stress rather than
    required for the stress response.
  description: >-
    Compare inducible, amygdala-restricted Lrp11 knockout, wild-type rescue and
    expression-matched controls across individual stress paradigms, measuring both
    behavioral/physiological responses and the previously reported expression-network
    targets.
  experiment_type: conditional mouse genetics and stress phenotyping
