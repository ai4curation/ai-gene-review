    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Isoform 2 may be secreted, unstable or noncoding at the protein level, and its
      inclusion changes interpretation of any ligand or localization experiment.
    resolution: >-
      Detect isoform-specific transcripts and peptides in primary human tissues, and
      test signal-peptide processing, secretion, membrane association and stability
