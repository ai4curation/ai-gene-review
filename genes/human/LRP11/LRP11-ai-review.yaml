      full_text_unavailable: false
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q8CB67
        source_label: mouse Lrp11
        source_status: SUPPORTS_TRANSFER
        comment: The ligand assay used a mouse Lrp11 extracellular-domain reporter;
          human PBMC blocking experiments support conservation of the downstream axis.
