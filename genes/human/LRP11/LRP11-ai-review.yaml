core_functions:
- description: >-
    LDL-responsive LRP11 signaling promotes MAPK13-dependent TCF1 phosphorylation
    and T-cell proliferation. Ligand recognition and the proximal pathway were defined
    principally with mouse Lrp11 and mouse T cells, while LDL-stimulated human
    peripheral-blood lymphocyte proliferation was sensitive to LRP11 blockade and
    MAPK13 inhibition. This supports a conserved signaling-receptor role but not yet
    LDL-particle endocytosis or a universal function across human tissues.
  molecular_function:
    id: GO:0038023
    label: signaling receptor activity
  directly_involved_in:
