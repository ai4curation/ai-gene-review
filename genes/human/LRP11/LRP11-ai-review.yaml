- term:
    id: GO:0030169
    label: low-density lipoprotein particle binding
  evidence_type: ISS
  original_reference_id: PMID:38272565
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8CB67
  review:
    summary: >-
      Mouse Lrp11 bound an LDL stimulus in a chimeric-receptor assay, supporting a
      conserved LDL-particle-binding activity for human LRP11.
    action: NEW
    reason: >-
      GO:0030169 records the experimentally observed ligand interaction without
      implying LDL internalization. GO:0005041 low-density lipoprotein particle
      receptor activity is not proposed because its definition requires delivery of
      the particle into the cell by endocytosis, which this study did not demonstrate.
    supported_by:
    - reference_id: PMID:38272565
      supporting_text: "Using a cell-based chimeric receptor\nscreening system, we showed that LRP11 interacted with LDL and activated TCF1."
