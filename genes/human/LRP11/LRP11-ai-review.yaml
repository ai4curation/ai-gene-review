- id: PMID:38272565
  title: LRP11 promotes stem-like T cells via MAPK13-mediated TCF1 phosphorylation,
    enhancing anti-PD1 immunotherapy.
  findings:
  - statement: >-
      A chimeric-receptor assay identified LDL as an LRP11-interacting stimulus and
      linked receptor activation to TCF1 in a tumor-bearing mouse/T-cell system.
    supporting_text: "Using a cell-based chimeric receptor\nscreening system, we showed that LRP11 interacted with LDL and activated TCF1."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      The proposed proximal pathway is LRP11-dependent MAPK13 activation followed by
      MAPK13 phosphorylation of TCF1 and expansion of stem-like CD8 T cells.
    supporting_text: "Mechanistically, LRP11\nactivation induces MAPK13 activation. Then, MAPK13 phosphorylates TCF1, leading\nto increase of stem-like T cells."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text verifies mouse tumor/T-cell experiments, a mouse Lrp11 chimeric
      receptor, and selected human PBMC assays. It is the strongest ligand-linked
