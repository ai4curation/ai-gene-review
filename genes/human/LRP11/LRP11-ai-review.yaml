id: Q86VZ4
gene_symbol: LRP11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP11 is a single-pass type-I membrane protein whose canonical 500-amino-acid
  isoform has an extracellular MANSC domain, PKD domain and one LDL-receptor class-A
  module followed by a short cytoplasmic tail. A second cDNA isoform replaces part of
  the PKD region and lacks the canonical LDLRA module, transmembrane helix and tail;
  its endogenous protein expression is unknown. LDL-responsive LRP11 signaling has
  been linked to MAPK13-dependent TCF1 phosphorylation and T-cell proliferation in
  mouse systems and selected human peripheral-blood lymphocyte assays. In human
  cervical- and prostate-cancer models, LRP11 perturbation alters proliferation,
  invasion and beta-catenin-dependent PD-L1 expression, but these disease-context
  phenotypes do not yet define its normal physiological role. Mouse amygdala Lrp11
  abundance increases after experimental stress, without establishing causal roles
  in individual stress responses.
