          mechanism; human PBMC inhibitor studies support a conserved signaling role.
- term:
    id: GO:0042102
    label: positive regulation of T cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:38272565
  qualifier: involved_in
  review:
    summary: >-
      LDL promoted proliferation of human peripheral-blood lymphocytes, and an LRP11
      blocking antibody or MAPK13 inhibitor suppressed the response.
    action: NEW
    reason: >-
      Direct perturbation in human cells supports positive regulation of T-cell
      proliferation in this LDL-responsive experimental context. The annotation does
