    label: membrane
  supported_by:
  - reference_id: PMID:38272565
    supporting_text: "Using a cell-based chimeric receptor\nscreening system, we showed that LRP11 interacted with LDL and activated TCF1."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - reference_id: PMID:38272565
    supporting_text: >-
      We found that LDL can also promote human lymphocyte proliferation, whether it
      is the proliferation ratio or cell numbers, and this effect can be inhibited by
      aLRP11 and MAPK13 inhibitors (online supplemental figure S7A–C).
    reference_section_type: RESULTS
    full_text_unavailable: false
  knowledge_gaps:
  - gap_statement: >-
      Whether human LRP11 binds native LDL directly, with what affinity and particle
      specificity, and whether it internalizes LDL rather than only signaling in
      response to it remain unknown.
    boundary: >-
      A mouse Lrp11 chimeric receptor responded to LDL, and human lymphocyte responses
      to LDL were inhibited by an LRP11-blocking antibody; no purified-human binding,
      uptake, or trafficking assay was reported.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: NARROWING
    significance: >-
      This distinction determines whether LRP11 merits LDL-particle binding alone,
      an endocytic LDL-receptor term, or a signaling-receptor interpretation.
    resolution: >-
      Measure binding kinetics of purified human LRP11 ectodomain against LDL, VLDL,
      oxidized LDL and HDL, then quantify internalization and degradation in
      LRP11-null cells rescued with wild-type or binding-defective LRP11.
    provenance:
    - reference_id: PMID:38272565
      supporting_text: "Using a cell-based chimeric receptor\nscreening system, we showed that LRP11 interacted with LDL and activated TCF1."
      reference_section_type: ABSTRACT
      full_text_unavailable: false
  - gap_statement: >-
      The endogenous protein expression, localization and biological activity of
      human LRP11 isoform 2 have not been established.
    boundary: >-
      Two full-length cDNA isoforms are recorded, but isoform 2 lacks the canonical
      C-terminal LDLRA module, transmembrane helix and cytoplasmic tail.
    gap_kind:
