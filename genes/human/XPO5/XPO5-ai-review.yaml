taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: XPO5 encodes exportin-5, a RanGTP-dependent karyopherin that binds structured RNA cargos in the nucleus and exports them to the cytoplasm. Its central cellular role is pre-miRNA nuclear export for miRNA biogenesis, and it also transports other structured RNAs or RNA-linked cargo assemblies such as aminoacyl-tRNA, Dicer mRNA and selected RNA-bound proteins.
