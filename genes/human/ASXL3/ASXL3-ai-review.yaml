    full_text_unavailable: false
  - reference_id: PMID:26647312
    full_text_unavailable: false
  - reference_id: PMID:32669118
    full_text_unavailable: false
suggested_questions:
- question: Does the ASXL3 PHD domain directly bind DNA, separately from MBD5/6 association and indirect
    chromatin recruitment?
- question: Which PAINT ancestral evidence supports the PTN000339788 PPAR-binding inference for ASXL3,
    separately from the demonstrated LXRalpha and TRbeta interactions?
- question: How do the two ASXL3 protein products differ in BAP1 activation, BRD4 recruitment and MBD-dependent
    complex assembly?
suggested_experiments:
- description: Compare purified full-length ASXL3 products and matched DEUBAD, BBM and PHD variants for
    BAP1 activation, BRD4 association and MBD6-dependent assembly.
  hypothesis: Distinct interfaces separate deubiquitinase activation from recruitment and complex stabilization.
