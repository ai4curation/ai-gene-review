  label: Homo sapiens
description: ASXL3 is a nuclear chromatin regulator and noncatalytic partner of the BAP1 deubiquitinase
  complex PR-DUB. Its DEUBAD region activates BAP1, while other interaction regions help organize chromatin-associated
  partners, including BRD4 and MBD proteins. ASXL3 can promote transcription in enhancer-associated contexts
  and repress nuclear-receptor programs in other settings. Disruption of ASXL3 causes Bainbridge-Ropers
  syndrome.
