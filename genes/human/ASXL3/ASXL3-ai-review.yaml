core_functions:
- description: ASXL3 activates BAP1 through its DEUBAD region as a regulatory partner of nuclear PR-DUB.
    Its separate BRD4-binding region and PHD-associated MBD proteins connect the complex to chromatin
    regulation. In human small cell lung cancer cells, ASXL3 supports BAP1 and BRD4 recruitment to chromatin
    and enhancer-associated transcription. BAP1 supplies the hydrolytic activity.
  molecular_function:
    id: GO:0035800
    label: deubiquitinase activator activity
  in_complex:
    id: GO:0035517
    label: PR-DUB complex
  locations:
  - id: GO:0005634
    label: nucleus
