    reason: >-
      The Reactome events model PTPN1 reactions in the cytosol, but full-length PTP1B is an ER-tail-anchored
      peripheral membrane protein. The catalytic site is cytoplasm-facing, yet a soluble cytosol location
      overstates the actual topology.
