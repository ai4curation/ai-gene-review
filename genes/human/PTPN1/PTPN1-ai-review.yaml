- term:
    id: GO:0004726
    label: non-membrane spanning protein tyrosine phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0267487
  - PANTHER:PTN001057235
  - RGD:620710
  review:
    summary: PAINT transfers the conserved non-receptor protein tyrosine phosphatase activity.
    action: ACCEPT
    reason: >-
      The PTHR46047 IBD at PTN001057235 is the conserved catalytic activity of the family. PTPN1 is cytosolic-domain,
      C-terminally ER-anchored and non-receptor in architecture, so the PAINT transfer matches the human
      protein.
    supported_by:
    - reference_id: file:interpro/panther/PTHR46047/PTHR46047-paint.tsv
      supporting_text: "PTHR46047\tPTN001057235\tGO:0004726\tF\tIBD\tfalse"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: FB:FBgn0267487
        source_status: SUPPORTS_TRANSFER
        comment: The inferred row is compatible with direct human PTPN1 evidence reviewed in this 
          file.
