- description: >-
    Hydrolyzes phosphotyrosyl residues on receptor and non-receptor protein kinases from the cytoplasmic
    face of the ER, attenuating activated RTKs such as EphA3 and MET and directly dephosphorylating PERK
    during ER stress.
