- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10660596
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35570
  review:
    summary: Generic protein binding does not describe a PTPN1 molecular function.
    action: REMOVE
    reason: >-
      PTPN1 has many substrate-trap and interactome rows, but the bare GO:0005515 term only states that
      an interaction was observed. The specific EphA3, MET, PERK and receptor/kinase relationships are
      captured by more informative rows; keeping a generic protein-binding annotation would add no functional
      content.
    supported_by:
    - reference_id: file:human/PTPN1/PTPN1-notes.md
      supporting_text: GO:0005515 protein binding is an uninformative umbrella term
