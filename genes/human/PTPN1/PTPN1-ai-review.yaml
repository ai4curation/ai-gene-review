id: P18031
gene_symbol: PTPN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTPN1 encodes PTP1B, a non-receptor protein tyrosine phosphatase anchored to the cytoplasmic
  face of the endoplasmic reticulum. It dephosphorylates receptor and non-receptor protein kinases at
  ER-plasma-membrane and ER-endosome contacts, including EphA3, MET, insulin receptor pathway components
  and other RTKs, and it modulates the ER unfolded protein response by dephosphorylating PERK.'
existing_annotations:
- term:
    id: GO:0003084
    label: positive regulation of systemic arterial blood pressure
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P20417
  - ensembl:ENSRNOP00000014309
  review:
    summary: >-
      Blood pressure is an orthology-transferred organismal phenotype, not a direct PTPN1 process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This Ensembl row projects a rat/mouse physiological phenotype onto human PTPN1. Human PTPN1 dephosphorylates
      RTKs and PERK at the ER cytoplasmic face; systemic blood-pressure control is a downstream animal
      phenotype rather than a direct substrate-dephosphorylation process.
    supported_by:
    - reference_id: file:human/PTPN1/PTPN1-notes.md
      supporting_text: The Ensembl/orthology tail on PTPN1 contains many rat or mouse phenotype
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: UniProtKB:P20417
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The source may capture a mouse or rat phenotype, but it is too distal for human 
          PTPN1.
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: The mRNA interactome hit is not evidence for a core RNA-binding function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:22658674 was a HeLa mRNA-interactome capture screen. It can flag candidate RNA-associated proteins,
      but it does not establish RNA binding as an evolved PTPN1 molecular function compared with the strong
      curated evidence for tyrosine phosphatase and RTK-substrate binding roles.
    supported_by:
    - reference_id: PMID:22658674
      supporting_text: interactome capture
    - reference_id: file:human/PTPN1/PTPN1-notes.md
      supporting_text: High-throughput `RNA binding`, `cadherin binding` and generic
- term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  evidence_type: IMP
  original_reference_id: PMID:22045810
  qualifier: enables
  review:
    summary: Phosphoprotein phosphatase activity is a true but generic parent.
    action: TOO_GENERAL
    reason: >-
      PTPN1 specifically hydrolyzes phosphotyrosyl-protein substrates. The accepted GO:0004725 and GO:0004726
      rows capture that specificity; the parent phosphoprotein phosphatase term is therefore uninformative
      on its own.
    supported_by:
    - reference_id: file:human/PTPN1/PTPN1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Mediates dephosphorylation of EIF2AK3/PERK
- term:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:18074158
  qualifier: enables
  review:
    summary: PTPN1 is a protein tyrosine phosphatase.
