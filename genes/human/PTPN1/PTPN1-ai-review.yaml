- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0267487
  - MGI:MGI:97805
  - MGI:MGI:97806
  - PANTHER:PTN001057235
  - RGD:61965
  - UniProtKB:P17706
  - UniProtKB:P18031
  review:
    summary: Cytoplasm is true but less precise than the ER cytoplasmic face.
    action: TOO_GENERAL
    reason: >-
      PTPN1 is anchored on the cytoplasmic face of the ER, and PTP1B can also meet receptor substrates
      at the plasma membrane and endosomes. A root cytoplasm assertion is true for the catalytic face
      but less informative than the accepted ER-membrane and cytoplasmic-side rows.
    supported_by:
    - reference_id: file:human/PTPN1/PTPN1-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Endoplasmic reticulum membrane'
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: FB:FBgn0267487
        source_status: SUPPORTS_TRANSFER
        comment: The inferred row is compatible with direct human PTPN1 evidence reviewed in this 
          file.
