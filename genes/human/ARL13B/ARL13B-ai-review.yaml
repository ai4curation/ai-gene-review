    label: tubulin binding
  evidence_type: IDA
  original_reference_id: PMID:29592971
  qualifier: enables
  review:
    summary: Direct biochemical evidence supports this molecular function.
    action: NEW
    reason: The original study directly assays purified human GST-ARL13B binding to bovine tubulin, with
      GST controls and domain mapping. The mouse TAP bait, mouse cellular rescue and algal axoneme assays
      are distinct supporting contexts. Retained binding of T35N does not by itself establish independence
      from GTP hydrolysis, because independent 2017 biochemical measurements show that T35N retains hydrolysis.
