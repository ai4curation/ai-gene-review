- id: PMID:29592971
  title: The Joubert syndrome protein ARL13B binds tubulin to maintain uniform distribution of proteins
    along the ciliary membrane.
  findings:
  - statement: Purified human GST-ARL13B binds bovine tubulin with GST-only controls; domain mapping places
      the interaction within the G-domain.
    supporting_text: To distinguish between a direct or indirect association of ARL13B with tubulin, we
      isolated recombinant GST-tagged human ARL13B from E. coli and incubated it in the presence of purified
      bovine brain tubulin. Incubation of the GST protein tag with tubulins was used as control. Glutathione
      (GSH) sepharose beads were added to each reaction mix to purify GST-ARL13B or control GST, and their
      interacting proteins were analyzed by western blotting. Tubulin was found in the eluate from the
      beads loaded with GST-ARL13B, but not in that from control GST ( Fig. 2 A and B, lanes ‘GST-ARL13B
      aa 1-428’ and ‘GST’), thus indicating that ARL13B can directly interact with tubulin dimers.
    full_text_unavailable: false
  - statement: Human or mouse wild-type ARL13B restores ciliary length in Arl13b-null mouse fibroblasts;
      rescue is distinguished from direct molecular-function assays.
    supporting_text: However, the ectopic expression of GFP-tagged wild-type mARL13B or huARL13B re-established
      a cilia length of most Arl13b hnn MEFs to be 2.0–4.0 µm ( Fig. 3 E,F) ( Larkins et al., 2011 ).
    full_text_unavailable: false
  - statement: SMO and SSTR3 have abnormal intraciliary distributions in Arl13b-null mouse fibroblasts.
    supporting_text: In contrast, in Arl13b hnn MEFs SMO concentrated in discrete regions of the cilium
      located mostly at distal and/or proximal extremities of cilia regardless the presence of SHH in
      the medium ( Fig. 5 B). However, we noticed that SMO in cilia of SHH-stimulated Arl13b hnn MEFs
      was almost exclusively detected at the distal tip of the cilium ( Fig. 5 B,E). Similarly, the mCherry-SSTR3
      also failed to distribute evenly along the cilium and accumulated at the distal tip of Arl13b hnn
      MEFs cilia ( Fig. 5 H).
    full_text_unavailable: false
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity/abstract; original tubulin/axoneme Results, target rescue/localization
      Results, relevant Discussion and complete purification/pull-down/axoneme Methods inspected, including
      recovered normal HTML target sections. Human GST-ARL13B binds bovine tubulin; initial TAP bait mouse
      in human RPE1; human fragments tested with algal axonemes; cellular rescue uses mouse fibroblasts.
      The T35N inactivity premise is not adopted because2017 measurements show preserved hydrolysis. No
      motor/polymerase function inferred; all supplements/image pixels and remaining Results not audited.
- id: PMID:33438581
  title: ARL3 activation requires the co-GEF BART and effector-mediated turnover.
  findings:
  - statement: BART accelerates nucleotide exchange by ARL13B in a reconstituted ARL3 reaction; this is
      not an assertion that BART is an autonomous GEF.
    supporting_text: 'We therefore wanted to test the effect of BART on ARL3 activation; the addition
      of BART to the ARL13B-mediated reaction is twofold: a significant amount of mantGDP is displaced,
      and the ARL3 nucleotide exchange rate is markedly increased (Figure 3B). Titrating in BART to the
      ARL13B-mediated reaction resulted in a maximum increase of over 500-fold that of the intrinsic rate
      of GDP dissociation (Figure 3C).'
    full_text_unavailable: false
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity, complete cached abstract, main ARL3 exchange/stabilization/effector-turnover
      Results, complete Discussion and Methods read during ARL2BP review; target passages checked for
      ARL13B. Human ARL13B18–278/BART reconstitution distinguished from human RPE1 and mouse NIH3T3 imaging.
      GDP-to-GDP control supports exchange cooperation beyond GTP-product stabilization. No stable BART–ARL13B
      complex or autonomous BART GEF asserted. No figure-pixel/raw-data audit or all duplicated XML passages
      claim.
