    supported_by:
    - reference_id: PMID:29592971
      supporting_text: To distinguish between a direct or indirect association of ARL13B with tubulin,
        we isolated recombinant GST-tagged human ARL13B from E. coli and incubated it in the presence
        of purified bovine brain tubulin. Incubation of the GST protein tag with tubulins was used as
        control. Glutathione (GSH) sepharose beads were added to each reaction mix to purify GST-ARL13B
        or control GST, and their interacting proteins were analyzed by western blotting. Tubulin was
        found in the eluate from the beads loaded with GST-ARL13B, but not in that from control GST (
        Fig. 2 A and B, lanes ‘GST-ARL13B aa 1-428’ and ‘GST’), thus indicating that ARL13B can directly
        interact with tubulin dimers.
      full_text_unavailable: false
