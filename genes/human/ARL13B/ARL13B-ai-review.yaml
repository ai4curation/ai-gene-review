id: Q3SXY8
gene_symbol: ARL13B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL13B is a membrane-associated regulatory GTPase enriched in primary cilia. It promotes
  guanine-nucleotide exchange on ARL3 and cooperates with ARL2BP/BART to regulate the active ARL3 pool
  involved in ciliary protein trafficking. ARL13B also binds tubulin through its GTPase domain and contributes
  to the organization and retention of the ciliary membrane relative to the axoneme. Nucleotide-dependent
  exocyst association and additional trafficking interactions connect it to ciliary protein organization.
  Its own GTP hydrolysis and its exchange-factor activity are distinct biochemical properties. ARL13B-dependent
  ciliary organization influences developmental signaling, and pathogenic variants cause Joubert syndrome.
