- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q640N2
  - ensembl:ENSMUSP00000086703
  review:
    summary: Retain the kidney-development phenotype as tissue context.
    action: KEEP_AS_NON_CORE
    reason: Retain the existing mouse-to-human kidney-development context. Conditional mouse renal loss
      and ciliary defects in PMID:26582389 support a tissue-level consequence of disrupted ciliary function,
      rather than a separate kidney-specific molecular activity.
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006689
  review:
    summary: Stimulated GTP hydrolysis is supported, with weak intrinsic activity unresolved.
    action: ACCEPT
    reason: Later human and murine biochemical measurements in PMID:28487361 support stimulated GTP hydrolysis,
      with protein-dependence and negative controls. Weak intrinsic turnover remains potentially confounded
      by contaminants and the bovine-brain stimulating factor was not identified. The older statement
      that hydrolysis was undetected is insufficient to reject the electronic function; strong autonomous
      human hydrolysis is not asserted.
    supported_by:
    - reference_id: PMID:28487361
      supporting_text: We found the GAP-dependent GTP hydrolysis was Arl13b-dependent, indicating that
        it is a GAP and not a nonspecific nucleotidase.
      full_text_unavailable: false
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20643351
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8TCI5
  review:
    summary: Human PIFO coassociation is demonstrated in human HEK293T cells.
    action: KEEP_AS_NON_CORE
    reason: The actual PMID:20643351 Results describe mouse and human tagged PIFO pulling down endogenous
      ARL13B from human HEK293T cells. Retain each original partner identity and the co-complex association.
      These experiments do not define a distinct ARL13B catalytic activity or demonstrate purified pair
      binding.
    supported_by:
    - reference_id: PMID:20643351
      supporting_text: We precipitated endogenous proteins using immobilized mouse and human SF-TAP-tagged
        PIFO in ciliated and cilia-disassembling HEK293T cells. This pull-down analysis revealed that
        the early endosome marker Rab6, the late endosome marker Rab8, the cilium localized small GTPase
        Arl13b (Caspary et al., 2007), the PCM protein γ-Tubulin, the centriolar protein Centrin, the
        MT protein β-Tubulin, and the motor protein Kif3a, all physically interact with Pifo/PIFO in cell
        culture (Figure 5G and Figures S5E–S5H).
      full_text_unavailable: false
