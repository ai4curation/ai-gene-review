references:
- id: PMID:19797084
  title: Translational control of protein kinase Ceta by two upstream open reading frames.
  findings:
  - statement: Two conserved uORFs in the PRKCH 5' UTR repress basal PKC-eta translation in cis and
      mediate GCN2-dependent induction under amino-acid starvation via leaky scanning past uORF2; the
      uORF2 peptide is predicted but not studied.
    supporting_text: Our results demonstrate that PKCη, a signaling molecule, has two functional conserved
      uORFs that constitutively suppress its expression under normal growth conditions.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: PubMed-verified (Mol Cell Biol 2009, PMC2772565, full text cached). Correct paper,
      but it describes a cis mRNA mechanism (uAUG-to-ACG reporter mutations), and the peptide is only
      "putative". It does not support the four peptide-level GO annotations attributed to C0HM02.
- id: PMID:34593629
  title: Unraveling the hidden role of a uORF-encoded peptide as a kinase inhibitor of PKCs.
  findings:
  - statement: uPEP2 is translated, binds novel PKCs and inhibits their kinase activity via a
      pseudosubstrate-like motif (IC50 about 2 uM); endogenous uORF2 deletion raises novel PKC levels and
      proliferation.
    supporting_text: Taken together, our results demonstrate that uPEP2 is a kinase inhibitor of novel
      PKCs and that the pseudosubstrate-like motif underlies this inhibition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (PNAS 2021, PMC8501901, full text cached). Primary characterization of
      the peptide's trans activity. Supports PKC inhibitor activity and PKC binding. Its Fig. 1E
      start-codon mutant reflects the cis effect, as the authors state.
- id: PMID:41698898
  title: PKC-eta promotes breast cancer metastasis by regulating the Hippo-YAP signaling pathway.
  findings:
  - statement: Exogenous cell-permeant uPEP2 lowers PKC-eta protein and phenocopies PKC-eta knockout
      effects on YAP and EMT in triple-negative breast cancer cells.
    supporting_text: Treatment of 4T1 and MDA-MB-231 cells with uPEP2 resulted in a reduction in PKCη and
      YAP/TAZ expression
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Signal Transduct Target Ther 2026, full text cached). Same laboratory.
      Mainly about PKC-eta and YAP. The uPEP2 experiments are pharmacological, using a synthetic myristoylated
      peptide, and do not establish a physiological process for the endogenous peptide. The paper calls
      uPEP2 a PKC-eta "degrader" without dissecting the mechanism.
core_functions:
- description: Pseudosubstrate-like inhibitor of novel protein kinase C isoforms (PKC-eta, -delta, -theta,
    -epsilon). The N-terminal motif, with a non-phosphorylatable Ala6, occupies the kinase substrate site
    and blocks catalysis. This trans activity of the peptide is distinct from the cis repression of PKC-eta
    translation by the uORF2 sequence in the PRKCH mRNA.
  molecular_function:
    id: GO:0008426
    label: protein kinase C inhibitor activity
  supported_by:
  - reference_id: PMID:34593629
    supporting_text: Taken together, our results demonstrate that uPEP2 is a kinase inhibitor of novel
      PKCs and that the pseudosubstrate-like motif underlies this inhibition.
  - reference_id: PMID:34593629
    supporting_text: uPEP2 was found to interact with the four novel PKC isoforms but not with PKC-γ or
      PKC-ζ
suggested_questions:
- question: What is the endogenous intracellular concentration of uPEP2, and is it high enough to inhibit
    novel PKCs given an in vitro IC50 of about 2 uM?
- question: Can the cis effect of uORF2 translation on PKC-eta synthesis be experimentally separated from
    the trans effect of the peptide, and which contributes more to PKC-eta levels in cells?
- question: By what mechanism does uPEP2 lower novel PKC protein levels (proteasomal or lysosomal
    degradation, loss of priming phosphorylation), and is this effect seen with the endogenous peptide?
- question: Should the cis translational-control role of the PRKCH uORF2 be captured on the PRKCH gene
    (the mRNA/locus) rather than on the uORF-encoded protein entry?
suggested_experiments:
- description: Recode uORF2 so that its length, start-codon context and termination are kept but the peptide
    is changed (for example an A6S or scrambled-sequence uORF), then measure PKC-eta translation and novel
    PKC activity, to separate the cis and trans effects.
- description: Binding and inhibition assays with purified recombinant PKC catalytic domains and synthetic
    uPEP2 (for example ITC or SPR plus steady-state kinetics) to confirm direct, competitive, substrate-site
    inhibition.
- description: Quantify endogenous uPEP2 by targeted mass spectrometry with isotope-labelled standards in
    cells with and without amino-acid starvation.
