id: C0HM02
gene_symbol: PRKCH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  uPEP2 is a 26-residue peptide encoded by the second upstream open reading frame (uORF2) in the 5'
  leader of the PRKCH mRNA, which encodes protein kinase C eta (PKC-eta); it has no gene symbol of its
  own and is filed under the host locus PRKCH. Translation of uORF2 is supported by ribosome profiling,
  reporter fusions and immunoprecipitation of an approximately 3 kDa endogenous peptide. The N-terminal
  part of the peptide resembles the PKC pseudosubstrate motif, with an alanine at position 6 in place of
  a phosphorylatable residue. A synthetic peptide binds the novel PKC isoforms (eta, delta, theta and
  epsilon) and inhibits their kinase activity in vitro with an IC50 of about 2 uM, but does not inhibit
  the classical (alpha, gamma) or atypical (zeta) isoforms; replacing Ala6 with Ser or Thr converts it
  from an inhibitor into a substrate. Deleting uORF2 in breast cancer cells raises the protein levels of
  novel PKCs and increases proliferation, and the cell-permeant peptide reduces cancer cell survival,
  migration and xenograft growth. Separately, the uORF2 sequence acts in cis on the PRKCH mRNA:
  ribosomes initiating at uORF2 repress basal translation of PKC-eta, and amino-acid starvation lifts
  this repression through GCN2-dependent leaky scanning past the uORF. This cis effect belongs to the
  mRNA and the scanning ribosome, not to the peptide.
existing_annotations:
- term:
    id: GO:0017148
    label: negative regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:19797084
  qualifier: involved_in
  review:
    summary: Reporter assays in which the uORF2 start codon was mutated to ACG increased translation of
      a luciferase reporter carrying the PRKCH 5' UTR. The paper never detects or tests the peptide; it
      refers to it as a putative peptide.
    action: REMOVE
    reason: This is a cis-regulatory property of the PRKCH mRNA leader, mediated by ribosomes initiating
      at the uORF2 AUG, not an activity of the encoded peptide. An AUG-to-ACG mutation abolishes the
      translation event itself, so it cannot attribute repression to the peptide product, and no
      experiment in the paper tests the peptide in trans. The peptide does none of the work of
      translational repression, so the annotation fails the participation test for a gene product.
    supported_by:
    - reference_id: PMID:19797084
      supporting_text: Next, each of the two uAUG initiation codons, or both, was altered to an ACG triplet
        to eliminate their translational potential
    - reference_id: PMID:19797084
      supporting_text: It encodes a small putative peptide of 26 amino acids, starting at position −148
        relative to the first AUG of the main ORF.
- term:
    id: GO:0017148
    label: negative regulation of translation
  evidence_type: IMP
  original_reference_id: PMID:34593629
  qualifier: involved_in
  review:
    summary: Based on Fig. 1E of Jayaram et al., where a start-codon mutation in uORF2 up-regulated
      tagged PKC-eta expressed from the same construct. The authors themselves interpret this as the
      known cis-repressor effect of the uORF.
    action: REMOVE
    reason: The start-codon mutation removes both the act of uORF2 translation and the peptide, so it
      cannot separate a cis effect on the PRKCH mRNA from a trans effect of the peptide, and the authors
      attribute it to cis repression. The paper's genuine trans observation, lower PKC-delta and
      PKC-epsilon protein after uORF2 overexpression, was not shown to act on translation; the authors
      propose effects on protein stability. No evidence shows that the peptide regulates translation.
    supported_by:
    - reference_id: PMID:34593629
      supporting_text: in accordance with our previous studies demonstrating that uORF2 acts as a cis-repressor
        element that suppresses expression of PKC-η and maintains its low basal levels
    - reference_id: PMID:34593629
      supporting_text: Our results suggest that binding of the uORF2-translated peptide to novel PKCs reduce
        their catalytic activity and protein phosphorylation, which may affect their protein stability.
- term:
    id: GO:0030291
    label: protein serine/threonine kinase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:34593629
  qualifier: enables
  review:
    summary: Synthetic uPEP2 inhibited immunoprecipitated PKC-eta, -delta, -theta and -epsilon in in vitro
      kinase assays (IC50 about 2 uM) but not PKC-alpha, -gamma or -zeta. Inhibition depends on the
      pseudosubstrate-like N-terminus, and Ala6-to-Ser/Thr substitution turns the peptide into a substrate.
    action: MODIFY
    reason: The activity is well supported, but every inhibited kinase is a PKC and the mechanism is
      PKC-specific pseudosubstrate mimicry. GO:0008426 protein kinase C inhibitor activity (is_a GO:0030291)
      describes it more precisely. Caveats are that the experiments used exogenous peptide at micromolar
      concentrations and that the endogenous peptide concentration is unknown.
    proposed_replacement_terms:
    - id: GO:0008426
      label: protein kinase C inhibitor activity
    supported_by:
    - reference_id: PMID:34593629
      supporting_text: We found that uPEP2 inhibited the kinase activity of PKCη with a half-maximal inhibitory
        concentration (IC50) of about 2 μM.
    - reference_id: PMID:34593629
      supporting_text: uPEP2 also inhibited the kinase activity of other novel PKC isoforms, including PKCδ,
        PKCθ, and PKCε, with a similar IC50 of ∼2 μM.
    - reference_id: PMID:34593629
      supporting_text: Taken together, our results demonstrate that uPEP2 is a kinase inhibitor of novel
        PKCs and that the pseudosubstrate-like motif underlies this inhibition.
- term:
    id: GO:0032056
    label: positive regulation of translation in response to stress
  evidence_type: IDA
  original_reference_id: PMID:19797084
  qualifier: involved_in
  review:
    summary: Amino-acid starvation increased translation of the PRKCH 5' UTR reporter; the increase
      required GCN2 and the uORFs, and the authors propose that ribosomes bypass uORF2 by leaky scanning.
    action: REMOVE
    reason: Stress induction is a property of the PRKCH mRNA leader and the eIF2-alpha/GCN2 pathway. Under
      starvation ribosomes are proposed to skip uORF2, so the peptide is if anything made less. No
      experiment tests the peptide, and nothing indicates it positively regulates translation. This is a
      cis mRNA mechanism wrongly assigned to the uORF-encoded protein.
    supported_by:
    - reference_id: PMID:19797084
      supporting_text: providing evidence that under these conditions ribosomes bypass uORF2 by leaky scanning
    - reference_id: PMID:19797084
      supporting_text: This induction was completely abrogated in GCN2 − / − cells, demonstrating that GCN2
        is required for translational upregulation of PKCη.
- term:
    id: GO:0034198
    label: cellular response to amino acid starvation
  evidence_type: IDA
  original_reference_id: PMID:19797084
  qualifier: involved_in
  review:
    summary: Same reporter experiments as the stress-translation row. PKC-eta protein rises on amino-acid
      starvation through the uORF-containing leader.
    action: REMOVE
    reason: The response to starvation is mounted by GCN2 and eIF2 acting on the PRKCH mRNA, and the uORF
      contributes as an RNA sequence element. The peptide was not studied in this paper, and its
      production is expected to fall under these conditions. No role for the peptide in the starvation
      response has been shown.
    supported_by:
    - reference_id: PMID:19797084
      supporting_text: Our data show that translation of PKCη is regulated during stress of amino acid starvation
        by a mechanism that is dependent on two repressive uORFs
- term:
    id: GO:0045182
    label: translation regulator activity
  evidence_type: IDA
  original_reference_id: PMID:19797084
  qualifier: enables
  review:
    summary: Molecular-function annotation derived from the uORF reporter study.
    action: REMOVE
    reason: A molecular function must be performed by the gene product. In this paper the regulatory
      element is the uORF in the mRNA (start-codon mutations), and the peptide was neither detected nor
      tested. No study shows that uPEP2 binds ribosomes, mRNA or translation factors, or alters translation
      when supplied in trans. Its one demonstrated molecular activity is PKC inhibition.
    supported_by:
    - reference_id: PMID:19797084
      supporting_text: Our results demonstrate that PKCη, a signaling molecule, has two functional conserved
        uORFs that constitutively suppress its expression under normal growth conditions.
