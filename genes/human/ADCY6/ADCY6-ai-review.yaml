id: O43306
gene_symbol: ADCY6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADCY6 is a twelve-pass plasma-membrane adenylyl cyclase that converts ATP to cAMP downstream of G protein-coupled receptors. It is activated by Gs, modulated by Gbetagamma and inhibited downstream of Gi/o pathways, letting many receptors tune local cAMP/PKA signaling. In the renal collecting duct, ADCY6 is the major inner-medullary V2 vasopressin receptor effector required for dDAVP-stimulated cAMP production, aquaporin-2 phosphorylation and trafficking, and water reabsorption; it also contributes to beta-adrenergic vascular relaxation and other receptor-specific cAMP responses in a context-dependent manner.'
