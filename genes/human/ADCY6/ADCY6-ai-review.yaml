suggested_questions:
- question: Which human tissues use ADCY6, rather than another membrane adenylyl cyclase isoform, in each receptor-specific
    GO-CAM branch that currently models ADCY6 as a generic GPCR effector?
- question: Does human ADCY6 have a conserved stereociliary or primary-cilium pool with a defined endogenous signaling role,
    or are the cilium and stereocilium locations restricted to mouse contexts?
suggested_experiments:
- description: Endogenously tag ADCY6 in a human collecting-duct principal-cell model and quantify AVPR2/GNAS-dependent cAMP
    production, AQP2 phosphorylation and AQP2 trafficking after AVP or dDAVP stimulation, with ADCY6 knockout/rescue to isolate
    it from other transmembrane adenylyl cyclases.
