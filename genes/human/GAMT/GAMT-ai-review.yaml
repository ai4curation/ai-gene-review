- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official combined-IEA method description was read. It integrates identical predictions from multiple electronic pipelines and retains their with/from sources. The two current GAMT rows preserve their exact InterPro/RHEA/EC or ARBA/UniPathway support; the reaction and creatine-synthesis claims are independently supported by human evidence. Verification identifies the method and claim concordance, not a rerun of every underlying rule.
- id: UniProtKB:Q14353
  title: Guanidinoacetate N-methyltransferase (GAMT), Homo sapiens - UniProtKB Q14353
  findings:
  - statement: GAMT converts guanidinoacetate to creatine using S-adenosylmethionine as the methyl donor; creatine biosynthesis step 2/2.
    reference_section_type: OTHER
    supporting_text: Converts guanidinoacetate to creatine
    finding_review:
      finding_status: CORROBORATED
      review_notes: The inherited catalytic-conversion statement is retained. The official record and the independently read human liver activity/product assay support the reaction; the excerpt is shortened without changing the statement.
      supported_by:
      - reference_id: PMID:8651275
      - reference_id: Reactome:R-HSA-71286
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official human identity, reviewed functional text and two natural products were checked. Direct FASTAs are 236 and 269 amino acids; the latter exactly reconstructs the VSP_042722 replacement of canonical 191–236. The recorded processed chain 2–236 is separate from natural product identity. These sequence facts do not prove equal activity, localization or stability of the 269-aa product. Human GAMT disease transcripts in 8651275 are not automatic evidence for normal alternative products. The same published record maps Q14353-2 to NM_138924.3/NP_620279.1; the official NCBI transcript-variant description cites PMID:26003046 and reports no detected GFP-fusion protein under those study conditions. The abstract reports no measurable wild-type transcript-2 activity, which does not distinguish failed expression from intrinsic inactivity of a purified 269-residue product. The RHEA:10656 equation explicitly records guanidinoacetate CHEBI:57742 and S-adenosyl-L-methionine CHEBI:59789 as substrates. Its DR section also lists Reactome R-HSA-8986944, establishing why that normal pathway cache was acquired without implying a GAMT transcription-factor activity.
