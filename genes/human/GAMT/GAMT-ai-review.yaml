proposed_new_terms: []
suggested_questions:
- question: How much of GAMT-deficiency neurotoxicity reflects guanidinoacetate accumulation versus creatine depletion, and which cellular mechanisms account for each component?
- question: Under which endogenous conditions is the annotated 269-amino-acid product expressed and stable, and does purified protein retain catalytic activity once abundance is controlled? The reported transcript-2 expression assay did not detect measurable activity or GFP-fusion protein.
- question: Does a human nuclear GAMT pool contribute measurable guanidinoacetate methylation or another established biochemical role, and under which cell conditions?
suggested_experiments:
- description: In a GAMT-deficient experimental model, separate guanidinoacetate lowering from creatine restoration and measure metabolite concentrations, neuronal physiology and viability to distinguish toxic-substrate and deficient-product effects.
- description: Quantify endogenous transcript-specific protein expression and stability; only after verifying matched protein abundance compare purified 236- and 269-amino-acid products using SAM/guanidinoacetate turnover and creatine identification.
- description: Test endogenous GAMT compartmentation with orthogonal imaging and biochemical fractionation, then measure compartment-specific reaction products without relying on overexpression alone.
