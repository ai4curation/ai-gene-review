taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GAMT encodes guanidinoacetate N-methyltransferase (EC 2.1.1.2), a member of the class I-like SAM-binding methyltransferase superfamily. It transfers a methyl group from S-adenosyl-L-methionine to guanidinoacetate, producing creatine and S-adenosyl-L-homocysteine. This cytosolic reaction completes endogenous creatine biosynthesis and consumes the methyl donor. GAMT is expressed in liver; creatine subsequently supports energy buffering through the creatine-kinase system. Loss of GAMT activity causes cerebral creatine deficiency syndrome 2, with guanidinoacetate accumulation, creatine depletion and neurological disease.
