- id: PMID:8651275
  title: 'Guanidinoacetate methyltransferase deficiency: the first inborn error of creatine metabolism in man.'
  findings:
  - statement: Severe deficiency of GAMT activity in liver causes guanidinoacetate accumulation in brain, creatine deficiency, and a treatable neurodevelopmental disorder.
    reference_section_type: ABSTRACT
    supporting_text: "a severe deficiency of guanidinoacetate \nmethyltransferase (GAMT) activity was detected in the liver"
    finding_review:
      finding_status: CURRENT
      review_notes: Retain the inherited clinical liver-deficiency finding at the scope of the two reported patients and the inspected assay. The exact native 13-word deficiency clause appears here once; the catalytic annotation cites this reference without duplicating the quotation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache is abstract-only, but official scanned original pages 915–917 were read visually, including Methods, Table 1 and Results. Human liver preparations directly transfer radiolabeled methyl from SAM to guanidinoacetate and yield chromatographically identified creatine; deficient patients, substrate-free blanks, reference enzymes, cautery and mixing controls were assessed. This is direct reaction/product evidence beyond disease association. The endpoint labeled PDF returned HTML and is explicitly excluded; inspected original PNG pages are retained.
- id: PMID:9325156
  title: The human guanidinoacetate methyltransferase (GAMT) gene maps to a syntenic region on 19p13.3, homologous to band C of mouse chromosome 10, but GAMT is not mutated in jittery mice.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic complete abstract supports the human GAMT reaction, gene structure and chromosome mapping. Deposited full-text requests returned 403, so original Methods/figures were not inspected. The authors report no GAMT coding mutation in jittery mice; that negative candidate-disease result is not evidence against the established human enzyme activity.
