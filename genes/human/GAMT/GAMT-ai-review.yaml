    review_notes: The immutable pathway summary describes synthesis of creatine from glycine, arginine and SAM, followed by transport, phosphorylation and spontaneous creatinine formation. GAMT is assigned specifically to the methylation step through normal reaction 71286. The broad metabolism annotation is refined to biosynthesis without attributing transport, creatine-kinase or contraction activity to GAMT.
