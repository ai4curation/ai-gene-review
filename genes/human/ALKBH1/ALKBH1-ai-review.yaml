    summary: Automated assignment from the RHEA:49524 / EC 1.14.11.51 mapping for 6mA demethylation.
    action: KEEP_AS_NON_CORE
    reason: 'The enzymology is real but the physiological substrate is disputed. ALKBH1 demethylates
      6mA efficiently only in single-stranded or bubbled/bulged DNA and poorly in duplex DNA, as
      conceded by the proponents of the pathway themselves (PMID:40715766). More seriously, the
      existence of regulated genomic 6mA in mammals is contested by three orthogonal methodological
      audits: antibody non-specificity plus bacterial and RNA contamination (PMID:32206710), misincorporation
