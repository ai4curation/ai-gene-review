id: Q13686
gene_symbol: ALKBH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Fe(II)/2-oxoglutarate-dependent dioxygenase of the AlkB family, encoded by a nuclear
  gene and imported into the mitochondrial matrix, with a smaller nuclear and cytoplasmic pool.
  Its best-established activity is on transfer RNA: it performs the second, oxidative step of wobble-base
  maturation in mitochondrial tRNA-Met, converting NSUN3-generated 5-methylcytidine at position
  34 first to 5-hydroxymethylcytidine and then to 5-formylcytidine (f5C34). That modification allows
  the single mitochondrial tRNA-Met to decode AUA and AUU as well as AUG under the non-universal
  mitochondrial genetic code, so loss of ALKBH1 impairs mitochondrial translation and respiratory
  complex activity. ALKBH1 makes analogous 2''-O-methylated hydroxymethyl- and formyl-cytidines
  at position 34 of cytoplasmic tRNA-Leu, and it demethylates N1-methyladenosine in cytoplasmic
  and mitochondrial tRNAs, which modulates tRNA usage and the rate of translation initiation. Additional
  activities demonstrated in vitro include oxidative demethylation of 3-methylcytosine in single-stranded
  DNA and in RNA, and an AP (abasic site) lyase activity that arises from an active site distinct
  from the dioxygenase centre. A widely cited role as the eraser of N6-methyladenine (6mA) in genomic
  DNA is disputed: ALKBH1 demethylates 6mA efficiently in single-stranded or bubbled DNA but poorly
  in duplex DNA, and several independent methodological audits attribute most reported mammalian
  genomic 6mA to bacterial and RNA contamination, antibody cross-reactivity and misincorporation
  of N6-methyladenosine from the nucleotide salvage pool, while comparative genomics places robust
  eukaryotic 6mA only in lineages retaining the AMT1 adenine methyltransferase, which animals have
  lost. In mouse, loss of Alkbh1 causes embryonic lethality with defects in placental trophoblast
  and neural differentiation.'
