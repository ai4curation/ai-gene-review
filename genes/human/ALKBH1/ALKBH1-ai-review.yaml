core_functions:
- molecular_function:
    id: GO:0160290
    label: 2-oxoglutarate-dependent tRNA 5-methylcytidine formyltransferase activity
  description: ALKBH1 catalyses the second, oxidative half of wobble-base maturation in mitochondrial
    tRNA-Met. Acting on the 5-methylcytidine that NSUN3 installs at position 34, it performs two
    successive Fe(II)/2-oxoglutarate-dependent oxidations - first to 5-hydroxymethylcytidine, then
    to 5-formylcytidine (f5C34). f5C34 is what allows the single mitochondrial tRNA-Met to read
    AUA and AUU as methionine in addition to AUG under the non-universal mitochondrial genetic code,
    so the modification is required for normal mitochondrial translation and for assembly of functional
    respiratory complexes. ALKBH1 performs the analogous reaction on 2'-O-methylated cytidine 34
    of cytoplasmic tRNA-Leu.
  directly_involved_in:
  - id: GO:0002101
    label: tRNA wobble cytosine modification
  - id: GO:0070129
    label: regulation of mitochondrial translation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:27497299
    supporting_text: We further identify ALKBH1/ABH1 as the dioxygenase responsible for oxidising
      m5C34 of mt-tRNAMet to generate an f5C34 modification.
  - reference_id: PMID:28472312
    supporting_text: found that ALKBH1 first hydroxylated m5C34 to form hm5C34, and then oxidized
      hm5C34 to form f5C34.
  - reference_id: PMID:28472312
    supporting_text: ALKBH1-knockout cells exhibited a strong reduction in mitochondrial translation
      and reduced respiratory complex activities, indicating that f5C34 formation mediated by ALKBH1
      is required for efficient mitochondrial functions.
  - reference_id: PMID:41219180
    supporting_text: Instead, the bulk of mammalian f5C resides in the well-established mitochondrial
      tRNA Methionine (mt-tRNAMet) and is mediated by ALKBH1.
- molecular_function:
    id: GO:1990984
    label: tRNA demethylase activity
  description: ALKBH1 oxidatively removes the methyl group from N1-methyladenosine in cytoplasmic
    and mitochondrial tRNAs. Lowering m1A levels reduces the usage of the affected tRNAs in protein
    synthesis and attenuates translation initiation, and the activity is responsive to glucose availability,
    making it a nutrient-linked input into translational output. The same reaction on mitochondrial
    tRNAs was detected independently as an increase in m1A in ALKBH1-knockout cells.
  directly_involved_in:
  - id: GO:1990983
    label: regulation of translational initiation by tRNA modification
  - id: GO:0035513
    label: oxidative RNA demethylation
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:27745969
    supporting_text: Here, we show that mammalian ALKBH1 is a tRNA demethylase. It mediates the
      demethylation of N1-methyladenosine (m1A) in tRNAs.
  - reference_id: PMID:27745969
    supporting_text: The ALKBH1-catalyzed demethylation of the target tRNAs results in attenuated
      translation initiation and decreased usage of tRNAs in protein synthesis.
  - reference_id: PMID:28472312
    supporting_text: we found that the frequency of 1-methyladenosine (m1A) in two mitochondrial
      tRNAs increased in ALKBH1-knockout cells, indicating that ALKBH1 also has demethylation activity
      toward m1A in mt-tRNAs.
- molecular_function:
    id: GO:0008198
    label: ferrous iron binding
  description: ALKBH1 binds a single catalytic Fe(II) ion at the conserved 2-His-1-carboxylate facial
    triad of its double-stranded beta-helix fold, together with 2-oxoglutarate as co-substrate.
    This cofactor centre generates the ferryl intermediate used by every oxidative reaction the
    protein performs, on tRNA and on nucleic acids generally; mutation of the predicted Fe(II)-
    and 2-oxoglutarate-binding residues abolishes activity.
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:18603530
    supporting_text: Site-specific mutagenesis confirmed that the putative Fe(II) and 2OG binding
      residues are essential for activity.
proposed_new_terms:
- proposed_name: histone H2A dioxygenase activity
  proposed_definition: Catalysis of the Fe(II)- and 2-oxoglutarate-dependent oxidation of a methylated
    residue in histone H2A.
  justification: ALKBH1 was reported to act as a dioxygenase specifically on histone H2A, with histone
    H2A from Alkbh1-null mice showing altered methylation. GOA carries a nucleus annotation from
    this study but no molecular function capturing the reported histone substrate. The activity
    has not been independently replicated, so this is offered as a candidate term rather than as
    a recommended annotation.
  proposed_parent:
    id: GO:0051213
    label: dioxygenase activity
  supported_by:
  - reference_id: PMID:22961808
    supporting_text: our in vitro enzyme activity assays demonstrate that ALKBH1 is a histone dioxygenase
      that acts specifically on histone H2A.
suggested_questions:
- question: Does regulated N6-methyladenine exist in mammalian genomic duplex DNA at all? If nanopore
    or orthogonal mass-spectrometry profiling with full bacterial, RNA and salvage-pathway controls
    finds none, what remains of the ALKBH1 genomic-eraser assignment?
  experts:
  - Chromatin and DNA modification
  - Analytical nucleic acid chemistry
- question: If the bulk of genomic m6dA derives from misincorporated ribo-N6-methyladenosine via
    the nucleotide salvage pathway, could the apparent effect of ALKBH1 depletion on cellular 6mA
    levels be an indirect consequence of its RNA demethylase activity altering the m6A ribonucleotide
    pool, rather than DNA demethylation?
  experts:
  - Nucleotide metabolism
  - RNA modification
- question: Which mammalian enzyme, if any, writes genomic 6mA? Animals appear to have lost the
    AMT1 family, so is there a non-AMT1 writer, or is there no writer to pair with the proposed
    eraser?
  experts:
  - Comparative genomics
  - Evolution of epigenetic systems
- question: Do the neural-differentiation and placental-trophoblast phenotypes of Alkbh1-null mice
    arise from impaired mitochondrial translation (loss of f5C34) rather than from changes in DNA
    or histone methylation?
  experts:
  - Mitochondrial biology
  - Developmental genetics
- question: Is the histone H2A dioxygenase activity reproducible, and which residue is modified?
  experts:
  - Chromatin biochemistry
- question: Does the AP lyase activity of ALKBH1 operate in cells, and if so in which compartment
    - is there a role in mitochondrial DNA abasic-site processing?
  experts:
  - DNA repair
  - Mitochondrial genome maintenance
suggested_experiments:
- hypothesis: The reported decrease in cellular genomic 6mA upon ALKBH1 overexpression reflects
    a change in the m6A ribonucleotide salvage pool rather than direct DNA demethylation.
  description: Metabolically label cells with isotopically distinct adenine and N6-methyladenosine
    precursors, then quantify genomic m6dA by ultrasensitive LC-MS/MS in wild-type, ALKBH1-knockout
    and ALKBH1-overexpressing cells, distinguishing salvage-derived from in-situ-methylated species
    by their isotopic signature. A catalytically dead ALKBH1 mutant and an RNA-binding-deficient
    mutant separate the DNA and RNA hypotheses.
  experiment_type: isotope tracing with mass spectrometry
- hypothesis: ALKBH1 cannot access 6mA in nucleosomal duplex DNA even in the presence of YTHDF3.
  description: Reconstitute nucleosomes on 6mA-containing duplex templates and assay demethylation
    by purified ALKBH1 with and without purified YTHDF3, reading out by LC-MS/MS rather than antibody
    dot blot. Compare against matched single-stranded and bubbled substrates to quantify the conformational
    preference directly.
  experiment_type: in vitro reconstitution biochemistry
- hypothesis: The organismal phenotypes of ALKBH1 loss are explained by the mitochondrial tRNA function.
  description: Compare an ALKBH1-null background rescued with wild-type ALKBH1, with a mitochondrially
    excluded (targeting-signal-deleted) ALKBH1, and with a catalytically dead variant, scoring mitochondrial
    translation, respiratory complex activity, neural progenitor differentiation and trophoblast
    marker expression. If mitochondrial targeting is necessary and sufficient for rescue, the nuclear
    and DNA-directed models are not needed to explain the phenotype.
  experiment_type: genetic complementation
- hypothesis: Genomic 6mA in human cells is below the level at which any regulated function is possible.
  description: Apply nanopore sequencing with 6mA-aware basecalling to human cells grown under strictly
    axenic conditions, with spike-in controls of known 6mA stoichiometry and parallel quantification
    of bacterial DNA content, plus RNase treatment to exclude ribonucleotide carryover. Report a
    detection limit alongside any positive calls.
  experiment_type: single-molecule sequencing
