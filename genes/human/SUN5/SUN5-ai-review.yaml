suggested_questions:
- question: 'What is the topology of SUN5 at the implantation fossa: how can a luminal SUN domain contact
    cytoplasmic Septin12/ODF1, i.e. are these interactions indirect via Nesprin-3, or does the specialized
    posterior nuclear envelope alter SUN5 orientation?'
  experts:
  - sperm cell biologists
  - nuclear envelope biologists
- question: Is Nesprin-3 the only KASH partner of SUN5 in vivo, and does the reported SPAG4L-Nesprin2
    meiotic complex have any function given that Sun5-null meiosis is normal?
  experts:
  - LINC complex researchers
- question: Should GO carry a specific process term for anchoring the sperm head-tail coupling apparatus
    to the nucleus (implantation fossa attachment)?
  experts:
  - GO editors
suggested_experiments:
- description: Immuno-EM topology mapping of SUN5 N- and C-termini at the implantation fossa, combined
    with Syne3-knockout and SUN5 KASH-lid mutant knock-in mice.
  hypothesis: SUN5 anchors the coupling apparatus through a canonical SUN5-Nesprin-3 LINC complex, and
    disrupting the SUN-KASH interface phenocopies Sun5 loss.
  experiment_type: immuno-electron microscopy and mouse genetics
