id: Q8TC36
gene_symbol: SUN5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SUN5 (SPAG4L, TSARG4) is a testis-enriched SUN-domain protein of the nuclear envelope, a
  379-residue single-pass protein with a nucleoplasmic N-terminus, a luminal coiled coil and a C-terminal
  SUN domain. In spermatids it is glycosylated during transit through the Golgi, reaches the nuclear envelope
  and then concentrates at the posterior pole of the elongating nucleus, the implantation fossa, where
  the sperm head-tail coupling apparatus (connecting piece, basal plate and proximal centriole) docks;
  in mature sperm it marks the neck. There SUN5 forms a LINC complex with the KASH protein Nesprin-3 (SYNE3),
  which it is required to position at the posterior nuclear membrane, and it binds lamin B1 on the nucleoplasmic
  side, anchoring the coupling apparatus and flagellum to the nucleus. Loss of SUN5 in mice leaves meiosis,
  acrosome formation and nuclear condensation intact but the coupling apparatus detaches from the nucleus
  during spermatid elongation, producing headless (acephalic) spermatozoa and male infertility. Biallelic
  SUN5 variants are the most frequent cause of human acephalic spermatozoa syndrome (spermatogenic failure
  16), which can be bypassed by intracytoplasmic injection of sperm heads.
