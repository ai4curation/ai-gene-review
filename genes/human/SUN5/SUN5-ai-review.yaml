core_functions:
- description: 'Sperm neck LINC anchor: at the posterior nuclear envelope (implantation fossa) of elongating
    spermatids, SUN5 pairs with Nesprin-3 and binds lamin B1, anchoring the head-tail coupling apparatus
    to the nucleus so that the flagellum stays attached to the sperm head.'
