  review:
    summary: InterPro2GO transfer of ATPase activity from the Hsp70 family signature.
    action: MARK_AS_OVER_ANNOTATED
    reason: Canonical Hsp70s hydrolyse ATP, but Hsp110s have diverged. Hsp105alpha/beta showed no
      ATPase activity in one study [PMID:10860841], and Hsp110-driven disaggregation depends on
