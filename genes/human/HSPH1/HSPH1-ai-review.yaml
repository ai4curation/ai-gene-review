id: Q92598
gene_symbol: HSPH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPH1 (Hsp105/Hsp110) is a stress-inducible, abundant cytosolic member of the Hsp110
  branch of the Hsp70 superfamily. It has an Hsp70-like nucleotide-binding domain and a
  substrate-binding domain with a long acidic insertion and an extended C-terminal region. Its
  established molecular function is that of a nucleotide-exchange factor for cytosolic Hsp70s
  (HSPA1A, HSPA1B and HSPA8). HSPH1 binds the Hsp70 nucleotide-binding domain and accelerates ADP
  release, which triggers client release and so paces the Hsp70/J-protein folding cycle. With Hsp70
  and J-proteins it promotes refolding of denatured proteins and dissolution of protein aggregates.
  In human cytosol the related Hsp110 HSPA4 (Apg-2) makes the larger contribution to aggregate
  dissolution. Mammalian HSPH1 orthologs can also hold heat-denatured proteins in a soluble,
  folding-competent state and protect cells from heat stress. Its own ATP hydrolysis is weak or
  absent. HSPH1 is induced by heat and other stresses. An alternatively spliced beta isoform lacking
  44 residues is induced only by heat shock. An exon-9-skipped mutant (HSP110deltaE9) that lacks
  the substrate-binding domain occurs in microsatellite-unstable colorectal cancer and acts as a
  dominant-negative inhibitor of HSPH1.
