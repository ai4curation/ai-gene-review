core_functions:
- description: Nucleotide-exchange factor for cytosolic Hsp70s (HSPA1A/HSPA1B, HSPA8). HSPH1 binds
    the Hsp70 nucleotide-binding domain and accelerates ADP release, which triggers client release
    and paces the Hsp70/J-protein cycle in protein folding and refolding. This is shown directly for
    purified human HSPH1 and is inherited from the Hsp110-clade PAINT node PTN002900795.
  molecular_function:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:24318877
    supporting_text: All of the NEFs competed for binding to Hsp70, and their relative affinity
      values predicted their potency in nucleotide and peptide release assays.
  - reference_id: PMID:16688212
    supporting_text: Furthermore, we found NEF activity on Hsp70 for human Hsp110, which is more
      distantly related to Sse1p (39% identity).
- description: Binds Hsp70 chaperones (HSPA1A/HSPA1B via their nucleotide-binding domain, and
    HSPA8). This binding is the physical basis of its nucleotide-exchange activity.
  molecular_function:
    id: GO:0030544
    label: Hsp70 protein binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/HSPH1/HSPH1-uniprot.txt
    supporting_text: Interacts with HSPA1A (via NBD) and HSPA1B (via NBD) (PubMed:24318877).
  - reference_id: PMID:24318877
    supporting_text: we measured the binding of human Hsp72 (HSPA1A) to BAG1, BAG2, BAG3, and the
      unrelated NEF Hsp105
suggested_questions:
- question: Which of the three human Hsp110s (HSPH1, HSPA4/Apg-2, HSPA4L/Apg-1) carries most of
    the Hsp70-dependent disaggregation in different cell types and under heat stress, given that
    immunodepletion of HSPH1 from cytosol only slightly reduced disaggregase activity whereas
    depletion of Apg-2 had a strong effect?
- question: Should GO gain a molecular function term for in-situ holdase activity (keeping denatured
    proteins soluble without folding them), now that unfolded protein binding is obsolete? Mammalian
    Hsp110s are a prime example.
- question: Does human HSPH1 have measurable intrinsic ATPase activity? The Hatayama group found
    none for Hsp105alpha/beta, while Raviol et al. reported intrinsic ATPase for human Apg-2.
suggested_experiments:
- description: Measure nucleotide-exchange rates and Hsp70/DNAJB1-dependent disaggregation of
    luciferase aggregates side by side with purified HSPH1, HSPA4 and HSPA4L, and test an HSPH1
    acidic-loop or NBD-interface mutant, to separate NEF potency from substrate-binding contributions.
- description: Use isoform-specific knockdown and rescue in human cells to compare HSPH1 alpha and
    the heat-specific beta isoform in recovery from heat-induced aggregation, quantified by
    detergent-insoluble proteome profiling.
