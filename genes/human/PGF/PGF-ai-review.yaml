  - ZFIN:ZDB-GENE-040303-4
  - ZFIN:ZDB-GENE-990415-273
  review:
    summary: Sprouting angiogenesis is retained as a non-core PlGF vascular output.
    action: KEEP_AS_NON_CORE
    reason: The inherited PAINT row places PlGF in a VEGF-family vessel-growth process, and primary
      Pgf evidence supports angiogenesis during adult ischemia, inflammation, wound healing and
      cancer. This is a peripheral pathological vascular outcome rather than PGF's core FLT1-binding
      molecular function.
    supported_by:
