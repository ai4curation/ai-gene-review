id: P49763
gene_symbol: PGF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PGF encodes placenta growth factor, a secreted disulfide-linked VEGF-family homodimer that
  signals through FLT1/VEGFR1. PlGF isoforms differ in C-terminal heparin-binding sequences; PlGF-2 also
  binds neuropilin co-receptors. PGF supports endothelial and inflammatory responses through VEGFR1, including
  MAPK-dependent mitogenic signaling in FLT1-expressing endothelial cells and tumor-microenvironment effects
  mediated by macrophage polarization.'
