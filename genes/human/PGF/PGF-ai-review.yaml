  review:
    summary: Response to hypoxia is over-propagated to PGF.
    action: MARK_AS_OVER_ANNOTATED
    reason: The inherited PAINT row follows a hypoxia-responsive VEGF-family branch, but this review
      did not find PGF-specific support for response to hypoxia. Direct PGF papers instead support
      FLT1/VEGFR1 binding, FLT1-dependent MAPK signaling and adult pathological angiogenesis.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000246442
        source_label: VEGF-family PAINT node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PAINT hypoxia row follows source entities in the VEGFA/VEGFR angiogenic
          response branch rather than PGF-specific FLT1 signaling and pathological angiogenesis.
