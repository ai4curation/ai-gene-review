id: P32418
gene_symbol: SLC8A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC8A1 (NCX1) is the cardiac-type sodium/calcium exchanger, a multi-pass
  plasma-membrane transport protein of the Ca2+:cation antiporter (CaCA) superfamily.
  It carries out electrogenic Na+/Ca2+ exchange, coupling the movement of one Ca2+
  ion to three Na+ ions and generating a net transmembrane current; because the exchange
  is driven by the electrochemical gradients of the two ions it is reversible, running
  in forward (Ca2+-efflux) mode to extrude Ca2+ using the inward Na+ gradient and in
  reverse (Ca2+-influx) mode when the membrane is depolarized or intracellular Na+
  rises. Its principal physiological role is low-affinity, high-capacity Ca2+ extrusion
  that returns cytosolic Ca2+ to baseline, making it the dominant Ca2+-efflux pathway
  of cardiomyocytes, where it contributes to the diastolic removal of Ca2+ that underlies
  cardiac relaxation and to excitation-contraction coupling. The protein has a cleaved
  signal peptide, transmembrane helices that form the ion-translocation pathway, and
  a large cytoplasmic loop carrying two Ca2+-binding Calx-beta regulatory domains and
  sites for calmodulin and the cytoskeletal adaptor ankyrin-B, which targets and stabilizes
  it in cardiac sarcolemmal/T-tubule microdomains. NCX1 is expressed most highly in
  heart but is broadly distributed (brain neurons, smooth muscle, kidney, and other
  tissues), where it participates in cellular Ca2+ and Na+ homeostasis.
