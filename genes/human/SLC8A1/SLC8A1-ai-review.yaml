proposed_new_terms: []
suggested_questions:
- question: NCX1 is reversible and operates in both Ca2+-efflux and Ca2+-influx modes
    depending on membrane potential and ion gradients; under what physiological (versus
    pathological, e.g. ischemia-reperfusion) conditions does each mode predominate
    in human cardiomyocytes?
- question: How do the alternatively spliced cytoplasmic-loop variants (NCX1.1 cardiac
    vs NCX1.3/1.7 and others) differ functionally, including their differential sensitivity
    to regulators such as ROS, PIP2 and Na+-dependent inactivation?
suggested_experiments:
- description: Use voltage-clamp with simultaneous Ca2+ imaging in human iPSC-derived
    cardiomyocytes expressing defined NCX1 splice variants to quantify forward- versus
    reverse-mode flux across the physiological range of membrane potential and [Na+]i.
- description: Cryo-EM/structural and mutagenesis studies of the human NCX1 cytoplasmic
    Calx-beta domains with calmodulin and ankyrin-B to map how regulatory Ca2+ binding
    and partner binding gate transport.
