  review:
    summary: GCN5L1-dependent acetylation is supported, but the intrinsic catalytic-site assignment
      remains unresolved.
    action: UNDECIDED
    reason: The enables qualifier for GO:0061733 assigns acetyl transfer from acetyl-CoA to a protein
      lysine to BLOC1S1 itself. PMID:38281616 shows that GCN5L1 perturbation in human AC16 cells changes
      Rictor acetylation and stability, but measures cellular acetylation and leaves catalytic-null
      mutant analysis for future work. Earlier recombinant add-back experiments require native mitochondrial
      factors. Those data do not distinguish whether GCN5L1 supplies the catalytic site or supports
      another catalytic component; cofactor dependence does not disprove catalysis. Retain the experimental
      assertion as undecided rather than remove it or invent a catalytic complex. The limitation is
      that the particular cellular perturbation assays do not isolate the acetyl-transfer step, rather
      than that an IMP code categorically excludes molecular-function inference.
