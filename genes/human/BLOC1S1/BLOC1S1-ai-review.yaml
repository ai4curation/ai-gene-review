  knowledge_gaps:
  - gap_statement: It remains unresolved whether GCN5L1 supplies an intrinsic protein-lysine acetyl-transfer
      catalytic site or enables acetylation through another component of the machinery.
    boundary: GCN5L1 depletion and reconstitution affect mitochondrial target acetylation and respiration;
      cellular Rictor experiments also support GCN5L1-dependent acetylation. Neither set of selected
      experiments isolates the catalytic contribution.
