id: P78537
gene_symbol: BLOC1S1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLOC1S1, also called BLOS1 or GCN5L1, is a small shared subunit of the BLOC-1 and BORC
  trafficking complexes. In BLOC-1 it helps maintain the assembly that organizes endosomal cargo delivery
  and lysosome-related organelle biogenesis. In BORC it supports complex stability and ARL8-dependent
  outward positioning of lysosomes from the cytoplasmic surface of the lysosomal membrane. BLOC1S1
  also has cytosolic and mitochondrial pools and promotes protein acetylation associated with respiratory
  regulation; cellular acetylation experiments have not yet resolved whether it provides an intrinsic
  acetyl-transfer catalytic site or supports other components of the acetylation machinery.
