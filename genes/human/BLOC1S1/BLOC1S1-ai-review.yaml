core_functions:
- description: Maintains the BLOC-1 trafficking assembly as an integral structural subunit, including
    its pallidin-Cappuccino-BLOS1 trimer. Stable subcomplex reconstitution and loss of complex components
    after BLOS1 depletion support a scaffolding role that enables endosomal cargo trafficking and
    lysosome-related organelle biogenesis.
