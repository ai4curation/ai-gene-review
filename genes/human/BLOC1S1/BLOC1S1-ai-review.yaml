    resolution: Reconstitute the relevant components and test structurally defined catalytic-site
      variants while separating acetyl-transfer chemistry from effects on complex assembly or protein
      stability.
suggested_questions:
- question: Which residues or partner proteins provide the acetyl-transfer catalytic site in the GCN5L1-dependent
    mitochondrial and Rictor acetylation systems?
- question: Does BLOS1 participate in the BORC-dependent organelle-size mechanism, and can that role
    be separated from its established effects on complex stability and positioning?
- question: Which primary pair-level records substantiate the six context-unresolved HuRI interactions,
    and which experiments distinguish direct contact from co-complex association?
