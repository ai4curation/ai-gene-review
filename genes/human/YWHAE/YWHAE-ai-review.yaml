  sequence_note: VSP_040621
existing_annotations:
- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IDA
  original_reference_id: PMID:12917326
  qualifier: involved_in
  review:
    summary: HSF1 binding to 14-3-3 epsilon is ERK/GSK3-dependent, but the MAPK cascade is upstream of this client-binding event.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:12917326 shows ERK-dependent phosphorylation of HSF1 enables 14-3-3 epsilon binding; it does not show YWHAE executing the MAPK cascade itself.
    supported_by:
    - &id007
      reference_id: PMID:12917326
      supporting_text: Furthermore, the serine phosphorylation-dependent binding of HSF1 to 14-3-3 epsilon results in the transcriptional repression of HSF1 and its sequestration in the cytoplasm.
- term:
    id: GO:0002753
    label: cytoplasmic pattern recognition receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:22607805
  qualifier: involved_in
  review:
    summary: 14-3-3 epsilon is a RIG-I translocon component needed for cytosol-to-membrane redistribution and antiviral RIG-I/MAVS signaling.
    action: KEEP_AS_NON_CORE
    reason: The RIG-I translocon is a supported client-specific innate immune function of YWHAE, but it is one branch of the broader 14-3-3 phosphoprotein-adaptor repertoire.
    supported_by:
    - &id009
      reference_id: PMID:22607805
      supporting_text: Our results define 14-3-3ε as a key component of a RIG-I translocon required for innate antiviral immunity.
- term:
    id: GO:0003064
    label: regulation of heart rate by hormone
  evidence_type: NAS
  original_reference_id: PMID:11953308
  qualifier: involved_in
  review:
    summary: YWHAE regulates HERG channel gating downstream of adrenergic/PKA signaling, but heart-rate regulation by hormone is a physiological extrapolation from a channel assay.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:11953308 supports direct regulation of HERG/KCNH2 channel phosphorylation state and gating, not a hormone-response process for YWHAE at organismal heart-rate scale.
    supported_by:
    - &id011
      reference_id: PMID:11953308
      supporting_text: We show that HERG associates with 14-3-3epsilon to potentiate cAMP/PKA effects upon HERG.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: YWHAE appeared in a high-throughput HeLa mRNA-interactome capture study.
    action: MARK_AS_OVER_ANNOTATED
    reason: The RNA crosslinking screen places YWHAE in an unbiased candidate RBP atlas; no YWHAE-specific RNA substrate or RNA-binding mechanism is established.
    supported_by:
    - reference_id: PMID:22658674
      supporting_text: Employing two complementary protocols for covalent UV crosslinking of RBPs to RNA, we describe a systematic, unbiased, and comprehensive approach, termed "interactome capture," to define the mRNA interactome of proliferating human HeLa cells.
- term:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62259
  - ensembl:ENSMUSP00000070993
  review:
    summary: Electronic transfer of protein phosphatase inhibitor activity is consistent with conserved 14-3-3 inhibition of CDC25 phosphatases by phosphoserine-dependent binding.
    action: KEEP_AS_NON_CORE
    reason: Inhibition of CDC25-class phosphatases is a credible 14-3-3 client activity, but it is one substrate class rather than the core molecular function of the adaptor.
    supported_by:
    - &id022
      reference_id: PMID:19331823
      supporting_text: Cdc25C function is inhibited by complex formation with two 14-3-3 isoforms, 14-3-3epsilon and 14-3-3gamma.
    - &id003
      reference_id: file:human/YWHAE/YWHAE-uniprot.txt
      supporting_text: Binds to a large number of partners, usually by recognition of a phosphoserine or phosphothreonine motif
- term:
    id: GO:0005246
    label: calcium channel regulator activity
  evidence_type: IDA
  original_reference_id: PMID:18029012
  qualifier: enables
  review:
    summary: PMCA1 and PMCA3 are Ca2+-transporting P-type ATPases, not calcium channels.
    action: MODIFY
    reason: PMID:18029012 shows 14-3-3 epsilon binds and inhibits plasma-membrane Ca2+ pumps. GO:0042030 captures the inhibitory ATPase-directed activity more accurately than either calcium channel regulation or a signless ATPase regulator term.
    proposed_replacement_terms:
    - id: GO:0042030
      label: ATPase inhibitor activity
    supported_by:
    - &id006
      reference_id: PMID:18029012
      supporting_text: The effect of the interaction on the activity of the two pumps, and thus on the homeostasis of Ca(2+), was investigated by co-expressing the 14-3-3epsilon protein and PMCA3 or PMCA1 in CHO cells
