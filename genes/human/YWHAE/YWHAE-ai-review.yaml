    - &id002
      reference_id: file:human/YWHAE/YWHAE-uniprot.txt
      supporting_text: Nucleus {ECO:0000269|PubMed:12917326, ECO:0000269|PubMed:37599448}. Cytoplasm {ECO:0000269|PubMed:12917326}
    - &id008
      reference_id: PMID:37599448
      supporting_text: Taken together, these data demonstrated that hnRNP C protein is exported from the nucleus by 14-3-3ε and was ubiquitinated and degraded by proteasomes in the cytoplasm.
