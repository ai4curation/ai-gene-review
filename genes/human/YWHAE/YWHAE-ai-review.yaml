id: P62258
gene_symbol: YWHAE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: YWHAE encodes the epsilon isoform of the 14-3-3 family, a soluble dimeric adaptor that recognizes phosphoserine- and phosphothreonine-containing motifs in client proteins. By using two amphipathic binding grooves in a homo- or heterodimer, 14-3-3 epsilon scaffolds, masks or sequesters phosphorylated clients to control their localization, stability and signaling state. It acts mainly from the cytosol but can shuttle to the nucleus or be recruited to client-containing membranes, including RIG-I translocon assembly on mitochondrial-associated membranes and recruitment of RNF115 to the ER/Golgi arm of Toll-like receptor trafficking. During neurodevelopment it also binds CDK5-phosphorylated NDEL1/NUDEL, sustains NDEL1 phosphorylation and helps maintain the NDEL1-LIS1 cytoplasmic-dynein pathway needed for neuronal migration.
