  title: Manual YWHAE literature synthesis
core_functions:
- molecular_function:
    id: GO:0050815
    label: phosphoserine residue binding
  description: Recognizes phosphorylated serine/threonine motifs on a broad set of client proteins, the biochemical specificity that underlies 14-3-3-dependent control of signaling and intracellular client localization.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id003
  - *id007
- molecular_function:
    id: GO:0042802
    label: identical protein binding
  description: Forms 14-3-3 dimers whose paired binding grooves can engage two phosphomotifs, giving the adaptor its scaffolding and sequestration capacity.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id018
- molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  description: Masks or retains client proteins away from their active compartment, as shown for phosphorylated HSF1 and TAZ in cytoplasmic sequestration and for hnRNP C nuclear export.
  directly_involved_in:
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id007
  - *id012
  - *id008
- molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  description: Assembles or escorts stimulus-specific signaling complexes, including the RIG-I/TRIM25 translocon and the AKT1-phosphorylated RNF115 complex, as specialized uses of the broader cytosolic 14-3-3 phosphoprotein-adaptor activity.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id009
  - *id010
suggested_questions:
- question: Which RNF115-associated 14-3-3 paralogs are individually required for RNF115 recruitment to the ER/Golgi TLR-trafficking checkpoint?
  experts:
  - TLR trafficking curators
  - 14-3-3 signaling experts
- question: For client-specific rows from high-throughput 14-3-3 interactomes, which clients have evidence for phosphomotif-dependent regulation strong enough to warrant a term more specific than physical binding?
  experts:
  - GO molecular-function curators
suggested_experiments:
- description: Use paralog-specific YWHAE/YWHAB/YWHAZ/YWHAG/YWHAH/YWHAQ knockouts or rescue mutants in cells with endogenous RNF115 to test which 14-3-3 dimers are required for RNF115 ER/Golgi recruitment and Toll-like receptor surface delivery.
- description: Pair phosphosite mutants of representative YWHAE clients with quantitative localization and binding assays to distinguish direct sequestration from incidental high-throughput physical association.
