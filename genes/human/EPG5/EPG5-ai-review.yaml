      supporting_text: EPG5 also binds to LC3/LGG-1 (mammalian and C. elegans Atg8 homolog, respectively)
        and to assembled STX17-SNAP29 Qabc SNARE complexes on autophagosomes
    - reference_id: PMID:27588602
      supporting_text: EPG5 stabilizes and facilitates the assembly of STX17-SNAP29-VAMP7/8 trans-SNARE
