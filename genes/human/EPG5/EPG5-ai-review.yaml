  label: Homo sapiens
description: 'EPG5 (ectopic P-granules autophagy protein 5 homolog) is a large (about 2,580 residues),
  metazoan-specific cytoplasmic protein that acts at the late, degradative step of macroautophagy. It
  is a Rab7 effector: it is recruited to late endosomes and lysosomes by direct binding to GTP-Rab7 and
  the R-SNAREs VAMP7/VAMP8, and it also binds LC3 and the assembled STX17-SNAP29 Qabc SNARE complex on
  autophagosomes. By bridging these membranes, EPG5 stabilizes STX17-SNAP29-VAMP7/8 trans-SNARE complexes
  and promotes fusion of autophagosomes with late endosomes/lysosomes, while restricting promiscuous fusion
  with other endocytic vesicles. Loss of EPG5 causes accumulation of non-degraded autophagosomes. EPG5
  also supports Rab7-dependent delivery of endocytic cargo, including CpG DNA, to late endosomes/lysosomes,
  which is needed for TLR9/TLR7 signalling in B cells. Recessive EPG5 mutations cause Vici syndrome, a
  multisystem disorder with callosal agenesis, cataracts, cardiomyopathy, hypopigmentation and combined
  immunodeficiency, and are also linked to a neurodevelopmental disorder with parkinsonism.'
