core_functions:
- description: Binds autophagic SNARE assemblies and LC3/GABARAP-family proteins at the endolysosomal
    compartment, coordinating productive autophagosome-lysosome fusion and cargo clearance. SNARE binding
    is the directly demonstrated specific molecular function; a broader adaptor role remains a mechanistic
    model because human complex recognition or stabilization has not been distinguished from bringing
    two partners together.
  molecular_function:
    id: GO:0000149
    label: SNARE binding
  directly_involved_in:
  - id: GO:0061909
    label: autophagosome-lysosome fusion
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:27588602
    supporting_text: EPG5 is recruited to late endosomes/lysosomes by direct interaction with Rab7 and
      the late endosomal/lysosomal R-SNARE VAMP7/8
  - reference_id: PMID:27588602
    supporting_text: EPG5 also binds to LC3/LGG-1 (mammalian and C. elegans Atg8 homolog, respectively)
      and to assembled STX17-SNAP29 Qabc SNARE complexes on autophagosomes
  - reference_id: PMID:27588602
    supporting_text: EPG5 stabilizes and facilitates the assembly of STX17-SNAP29-VAMP7/8 trans-SNARE
      complexes, and promotes STX17-SNAP29-VAMP7-mediated fusion of reconstituted proteoliposomes
  - reference_id: PMID:23222957
    supporting_text: Further studies showed a severe block in autophagosomal clearance in muscle and fibroblasts
      from individuals with mutant EPG5, resulting in the accumulation of autophagic cargo in autophagosomes.
  - reference_id: PMID:33674710
  - reference_id: PMID:39809444
- description: Supports vesicular delivery of internalized endocytic cargo from endosomes to the late-endosome/lysosome
    compartment, enabling delivery of CpG DNA to endosomal TLR9. The molecular activity responsible for
    this endocytic role has not been distinguished from its autophagic Rab7/SNARE mechanism, so no separate
    molecular function is assigned.
  directly_involved_in:
  - id: GO:0008333
    label: endosome to lysosome transport
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:29130391
    supporting_text: In summary, lack of EPG5 impairs the transport to CpG-FITC to the LEs and lysosomes,
      where TLR9 is located.
  - reference_id: PMID:29130391
    supporting_text: Here we show that EPG5 also plays autophagy-independent roles in the trafficking
      of molecules from the EEs to LEs and lysosomes.
suggested_questions:
- question: Does EPG5 tether membranes on its own (for example, cluster Rab7- and LC3-decorated liposomes
    in vitro), or does it act only as a SNARE-assembly chaperone downstream of HOPS-mediated tethering?
- question: Is the endolysosomal CpG-delivery defect of EPG5-deficient cells explained by the same Rab7-effector
    and fusion-specificity mechanism as the autophagy defect?
- question: Does GO:1990786 encompass host-assisted transduction and expression of a dsDNA viral template
    in the absence of a demonstrated dsDNA-elicited host response, and which Figure 6B step was intended
    to support the EPG5 assertion?
suggested_experiments:
- description: Reconstitute tethering and fusion of Rab7/VAMP7 proteoliposomes with LC3-PE/STX17-SNAP29
    proteoliposomes using purified full-length EPG5, with and without HOPS, to separate tethering from
    SNARE-chaperone activity.
  hypothesis: EPG5 bridges Rab7- and LC3-containing membranes independently of HOPS.
