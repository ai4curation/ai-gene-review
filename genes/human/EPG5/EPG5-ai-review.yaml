- term:
    id: GO:0032182
    label: ubiquitin-like protein binding
  evidence_type: IPI
  original_reference_id: PMID:33674710
  review:
    summary: Human EPG5 directly binds LC3/GABARAP-family ubiquitin-like proteins, preferentially the
      GABARAP subfamily.
    action: NEW
    reason: 'PMID:33674710 Figure 2 and the recombinant-protein purification and affinity-isolation Methods
      test purified full-length human EPG5 against all six human LC3/GABARAP proteins. The GABARAP subfamily
      recovers more EPG5 than the LC3 subfamily, and W550A and W567A substitutions distinguish contributions
      of the tandem LIR region. PMID:39809444 Figures 2 and 3 separately test human LIR peptides by NMR
      and full-length human EPG5 in HEK293 co-immunoprecipitations: LIR1 W550 is the principal GABARAP-binding
      determinant in the intact protein. The two motifs are not asserted to bind the same partner simultaneously.
      GO:0032182 captures binding to these ubiquitin-like proteins; the inspected current ontology searches
      did not return a more specific LC3/GABARAP-binding term. This is direct molecular-interaction evidence,
      not a new process inferred from recruitment or knockout alone, and it does not assign ubiquitin
      conjugation, cargo recognition or equivalent function to the alternative splice isoform.'
    additional_reference_ids:
    - PMID:39809444
    supported_by:
    - reference_id: PMID:33674710
