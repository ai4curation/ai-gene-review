- term:
    id: GO:1990786
    label: cellular response to dsDNA
  evidence_type: IMP
  original_reference_id: PMID:29130391
  qualifier: involved_in
  review:
    summary: The dsDNA-specific response remains unresolved despite access to the original study.
    action: UNDECIDED
    reason: 'The current GO definition covers cellular changes caused by a double-stranded DNA stimulus,
      including changes in gene expression; it does not require a particular receptor or immune-signaling
      readout. In PMID:29130391 (doi:10.1080/15548627.2017.1389356), the Toll-like receptor stimulation
      Methods explicitly use single-stranded DNA ODN for TLR9, so the cytokine and NF-kappaB experiments
      (Figures 1E and 5) do not establish the double-stranded stimulus. The separate DNA/RNA-vector Results
      and Figure 6B do expose human fibroblasts to a dsDNA baculovirus carrying RAB5A/RAB7-GFP reporters.
      Reporter positivity depends jointly on viral entry, endosomal delivery, DNA release, nuclear access
      and expression; the assay does not distinguish a dsDNA-elicited cellular response from efficient
      delivery and expression of a DNA template. EPG5 has positive evidence for trafficking activity,
      so it is not established that its role categorically excludes participation in a response process.
      The stimulus-specific attribution is therefore unresolved: the experiments justify neither confident
      acceptance nor a definitive over-annotation judgment. This uncertainty concerns the interpretation
      of accessible evidence, not missing main text. The inherited TLR9/TLR7 quotation documents the separate
      signaling experiments; it is contextual support, not direct evidence of dsDNA specificity.'
    supported_by:
    - reference_id: PMID:29130391
      supporting_text: We show that mutations or downregulation of EPG5 impaired signaling by TLR9 and
        TLR7, thus inhibiting NFKB nuclear translocation
- term:
    id: GO:7770062
    label: vesicle membrane tethering activity
  evidence_type: IDA
  original_reference_id: PMID:27588602
  review:
    summary: EPG5 is a candidate autophagic membrane tether, but isolated human membrane-bridging activity
      is not established by the inspected experiments.
    action: UNDECIDED
    reason: GO:7770062 is a current, valid molecular-function term requiring physical bridging of a vesicle
      and target membrane before docking and fusion. The recovered original supplement to PMID:27588602
      directly establishes human Rab7 and SNARE interactions (S4F-G, S6O-Q), while the lipid-mixing Methods
      and S6U-W concern worm EPG-5 and proteoliposomes. Main-paper Figure 6 is available as an original
      image and shows SNARE assembly and lipid mixing, but its operative main Results/caption remain inaccessible.
      These observations support a fusion-associated adaptor model without proving an isolated human tethering
      assay. Retain this inherited proposal and its quotations as unresolved provenance rather than treating
      worm reconstitution as human biochemical proof. Independent human structural studies PMID:33674710
      Figures 1-2 and 7 and PMID:39809444 Figures 1-3 establish elongated architecture and LC3/GABARAP
      interaction, but membrane bridging remains a mechanistic model rather than an isolated human activity
      assay. This uncertainty does not assert that the proposed biological tethering role is false.
    supported_by:
    - reference_id: PMID:27588602
      supporting_text: EPG5 is recruited to late endosomes/lysosomes by direct interaction with Rab7 and
        the late endosomal/lysosomal R-SNARE VAMP7/8
