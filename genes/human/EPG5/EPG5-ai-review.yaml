  review:
    summary: EPG5 binds Rab7 and VAMP7/8 on late endosomes/lysosomes and LC3 plus STX17-SNAP29 on autophagosomes,
      bridging the two membranes before SNARE-mediated fusion.
    action: NEW
    reason: The combination of acceptor-membrane recruitment (Rab7, VAMP7/8), donor-membrane binding (LC3,
      STX17-SNAP29) and stimulation of trans-SNARE assembly and proteoliposome fusion fits the definition
      of a vesicle membrane tether better than the separate binding terms. Direct liposome tethering by
      EPG5 alone has not been shown, so this is proposed as the best available MF rather than a demonstrated
      isolated activity.
