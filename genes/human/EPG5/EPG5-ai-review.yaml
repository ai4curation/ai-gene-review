    summary: EPG5 enables vesicular delivery of internalized CpG oligodeoxynucleotides to the endolysosomal
      compartment.
    action: MODIFY
    reason: The current GO:0006862 definition concerns movement of nucleotides, whereas PMID:29130391
      Figures 2-4 trace an internalized DNA oligonucleotide through endocytic compartments. EPG5 depletion
      retains CpG in tubular/recycling endosomes and prevents its delivery to LAMP2-positive organelles.
