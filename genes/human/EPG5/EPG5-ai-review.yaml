description: EPG5 is a large intracellular protein that helps ensure productive fusion of autophagosomes
  with late endosomes and lysosomes. Human EPG5 associates with the endolysosomal compartment and binds
  Rab7, LC3/GABARAP-family proteins and autophagic SNARE assemblies. Its elongated helical architecture
  and interaction surfaces support a membrane-tethering model that links organelle recruitment and SNARE-complex
  organization to autophagic cargo clearance. EPG5 also supports delivery of internalized endocytic cargo
  to lysosomes; in human immune and fibroblast models this enables endosomal TLR9 responses to CpG DNA.
  Biallelic pathogenic EPG5 variants cause Vici syndrome, a multisystem disorder associated with defective
  autophagy.
