description: EPG5 is a 2,579-residue cytoplasmic Rab7 effector that coordinates selective fusion of autophagosomes
  with late endosomes and lysosomes. It associates with the lysosomal surface through Rab7 and VAMP7/8,
  binds autophagic STX17-SNAP29-containing SNARE assemblies, and engages LC3/GABARAP proteins through
  tandem LC3-interacting-region motifs, with preferential binding to the GABARAP subfamily. These interactions
  organize the fusion machinery and restrict inappropriate fusion with other endocytic vesicles; EPG5
  deficiency causes accumulation of undegraded autophagic cargo. EPG5 also supports endosome-to-lysosome
  delivery of internalized nucleic acids, enabling endosomal TLR9 and TLR7 signaling. Biallelic pathogenic
  variants cause Vici syndrome and a neurodevelopmental disorder with parkinsonism or other movement abnormalities.
