core_functions:
- description: >-
    Catalyzes FAD-dependent dehydrogenation of short-chain acyl-CoAs, including butyryl-CoA to
    crotonyl-CoA, with electrons passed to electron-transfer flavoprotein. The soluble homotetramer
    acts in the mitochondrial matrix and binds one FAD per subunit. This reaction supplies the
    initial oxidation within short-chain acyl-CoA beta-oxidation and butyrate catabolism.
  molecular_function:
    id: GO:0016937
    label: short-chain fatty acyl-CoA dehydrogenase activity
