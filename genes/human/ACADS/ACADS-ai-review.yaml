id: P16219
gene_symbol: ACADS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACADS encodes short-chain acyl-CoA dehydrogenase (SCAD), a soluble mitochondrial matrix flavoenzyme
  that catalyzes the initial dehydrogenation reaction of short-chain acyl-CoA beta-oxidation.
  It converts saturated acyl-CoA substrates to trans-2-enoyl-CoAs and transfers reducing equivalents
  through its FAD cofactor to electron-transfer flavoprotein. Butyryl-CoA is a characteristic
  substrate, and the substrate range includes hexanoyl-CoA. The mature enzyme is a homotetramer
  with one FAD per subunit and is generated by cleavage of an N-terminal mitochondrial targeting
  peptide. Reduced ACADS activity causes the biochemical defect of short-chain acyl-CoA dehydrogenase
  deficiency, including accumulation of ethylmalonic acid.
