  title: Analysis of the transcriptional regulation and molecular function of the aryl
    hydrocarbon receptor repressor in human cell lines.
  findings:
  - statement: Human AHRR binds XREs at its own regulatory region and at CYP1A1 and represses basal CYP1A1 expression.
    supporting_text: >-
      Chromatin immunoprecipitation analyses revealed that the AhRR binds to
      this XRE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Primary human cell-line study supporting AHRR binding
      to XREs, CYP1A1 repression, and AHRR autoregulation.
- id: PMID:17980155
  title: Identification of intracellular localization signals and of mechanisms underlining
    the nucleocytoplasmic shuttling of human aryl hydrocarbon receptor repressor.
  findings:
  - statement: Human AHRR contains nuclear import and export signals, is predominantly nuclear, and can be transported into the nucleus by ARNT.
    supporting_text: >-
      AhRR is a nucleocytoplasmic shuttle protein, harboring both a nuclear
      localization signal (NLS) and a nuclear export signal (NES).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Primary localization study directly supporting AHRR's
      nucleocytoplasmic shuttling, predominant nuclear localization, and
      ARNT-dependent nuclear import.
- id: PMID:18172554
  title: The aryl hydrocarbon receptor repressor is a putative tumor suppressor gene
    in multiple human cancers.
  findings:
  - statement: AHRR knockdown and ectopic expression alter anchorage-independent growth, apoptosis resistance, motility, invasion, and angiogenic potential in human cancer models.
    supporting_text: >-
      These results therefore demonstrate that AHRR is a putative new tumor
      suppressor gene in multiple types of human cancers.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Useful support for AHRR as a biologically active
      human repressor, but the cancer-growth phenotypes are downstream and were
      not converted into new GO biological-process annotations.
- id: PMID:19380484
  title: The active form of human aryl hydrocarbon receptor (AHR) repressor lacks exon
    8, and its Pro 185 and Ala 185 variants repress both AHR and hypoxia-inducible factor.
  findings:
  - statement: Human AHRRdelta8 is the predominant active isoform and represses AHR-dependent transcription through an ARNT-containing complex.
    supporting_text: >-
      AHRRDelta8 effectively repressed AHR-dependent transactivation, whereas
      AHRR(715) was much less active.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Primary human isoform study showing that AHRRdelta8,
      not AHRR715, is the predominant active human AHRR form, forms a complex
      with ARNT, and represses AHR and HIF-dependent signaling.
- id: PMID:28904176
  title: The crystal structure of the AhRR-ARNT heterodimer reveals the structural
    basis of the repression of AhR-mediated transcription.
  findings:
  - statement: Human AHRR forms an ARNT heterodimer whose bHLH-PAS-A organization is conserved with AHR:ARNT, while AHRR lacks AHR's PAS-B ligand-binding domain.
    supporting_text: >-
      In AhR, ligand binding occurs at the PAS-B domain, but this ligand-binding
      domain is lacking in AhRR
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache with human AHRR:ARNT structural evidence and a concise
      synthesis of the mechanisms proposed for AHRR-mediated repression of AHR.
