knowledge_gaps:
- gap_statement: >-
    The structural basis of AHRR-specific ARNT binding is known, but the
    relative contributions of ARNT competition, XRE competition,
    SUMOylation-dependent corepressor recruitment, and transrepression to
    endogenous human AHR target repression remain unresolved.
  boundary: >-
    Human AHRRdelta8 represses AHR-dependent transactivation and binds ARNT; the
    crystallized N-terminal AHRR:ARNT complex did not include the C-terminal
    repressor region.
  gap_kind:
