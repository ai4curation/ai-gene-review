id: A9YTQ3
gene_symbol: AHRR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AHRR encodes the aryl hydrocarbon receptor repressor, a bHLH-PAS
  transcriptional regulator in the AHR pathway. The predominant human
  AHRRdelta8 isoform heterodimerizes with ARNT, shuttles between cytoplasm and
  nucleus, binds xenobiotic response elements, and represses AHR-dependent RNA
  polymerase II transcription including CYP1A1 induction. Unlike AHR, AHRR lacks
  the PAS-B ligand-binding domain and acts as a ligand-independent repressor.
