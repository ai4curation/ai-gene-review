suggested_questions:
- question: >-
    Should a GO molecular-function term be added for XRE-bound AHRR:ARNT
    transcriptional repressor activity, narrower than GO:0001227 but distinct
    from ligand-regulated nuclear receptor activity?
suggested_experiments:
- description: >-
    Introduce endogenous mutations that separately disrupt AHRR:ARNT
    dimerization, AHRR XRE binding, and AHRR C-terminal SUMOylation sites, then
    compare their effects on CYP1A1 repression after AHR ligand stimulation.
