  review:
    summary: Phototransduction; CaBP4 acts at the synapse, downstream of the outer-segment cascade.
    action: MARK_AS_OVER_ANNOTATED
    reason: Phototransduction is the conversion of light into the photoreceptor's electrical signal in the outer
      segment. CaBP4 sits at the synaptic terminal and tunes the Cav1.4 channel that couples the membrane potential
      to transmitter release; Cabp4-/- mice lose synaptic, not phototransduction, function. The IBA carries a process
      from the CaBP node that does not fit this member.
