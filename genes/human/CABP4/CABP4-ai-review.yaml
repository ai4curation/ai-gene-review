id: P57796
gene_symbol: CABP4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CABP4 encodes calcium-binding protein 4 (CaBP4), a calmodulin-like protein with four EF-hand domains,
  expressed in retinal rod and cone photoreceptors and reported in cochlear inner hair cells. In photoreceptors
  it is concentrated at the presynaptic terminals (rod spherules and cone pedicles) of the ribbon synapse, where
  it binds the C-terminal domain of the L-type calcium channel Cav1.4 (CACNA1F) alpha1 subunit. CaBP4 shifts Cav1.4
  activation to more hyperpolarized voltages and suppresses calcium-dependent inactivation of channel variants that
  show it, so that the channel carries sustained calcium influx at the depolarized dark potential of photoreceptors
  and supports continuous glutamate release onto bipolar and horizontal cells. Mice lacking CaBP4 have abnormal
  photoreceptor synapses and strongly reduced rod and cone synaptic transmission, and recessive CABP4 variants in
  humans cause a congenital non-progressive cone-rod synaptic disorder resembling incomplete congenital stationary
  night blindness.
