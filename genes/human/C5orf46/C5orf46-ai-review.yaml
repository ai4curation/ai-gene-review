  label: Homo sapiens
description: 'C5orf46 encodes an 87-residue precursor that is cleaved after a 23-residue signal peptide
  to release a 64-residue secreted peptide. The mature peptide is unusual for a human host-defence molecule:
  it is anionic rather than cationic, with sixteen acidic residues against ten basic ones and an isoelectric
  point of 4.54, it contains no cysteines and so forms no disulphide-stabilised fold, and it is amphipathic,
  pairing a highly acidic and structurally disordered aspartate- and proline-rich N-terminal half with
  a central hydrophobic segment predicted to be helical, the peptide''s helical content having been confirmed
  by circular dichroism without localising it to that segment. Expression is concentrated in skin, salivary
  gland and blood vessel, which is the origin of the gene''s alternative name skin and saliva secreted
  protein 1, and the protein itself has been detected in human plasma by mass spectrometry and catalogued
  in the exosome fraction of parotid saliva. Purified recombinant mature peptide kills Gram-negative bacteria
  - Escherichia coli including the O157:H7 serotype, Vibrio cholerae and Pseudomonas aeruginosa - in a
  concentration-dependent manner with measured minimum inhibitory concentrations, while leaving the Gram-positive
  Staphylococcus aureus and Listeria monocytogenes and yeast unaffected; electron microscopy of treated
  bacteria shows the cells becoming irregular and collapsing. Administering the peptide to mice after
  a lethal Escherichia coli O157:H7 challenge raises survival substantially. The mouse orthologue behaves
  the same way. How the peptide kills is unresolved: the growth kinetics are those of an agent acting
  on the cell envelope, but an intracellular target has not been excluded, no molecular target has been
  identified, and the peptide is also cytotoxic at micromolar concentrations to mammalian cells generally,
  including normal T lymphocytes, keratinocytes and fibroblasts as well as lymphoma lines. Beyond this
  antibacterial activity the peptide has no characterised molecular function, no established binding partner
  and no known receptor, and whether the endogenous peptide is required for host defence at the body surfaces
  where it is made has not been tested.'
