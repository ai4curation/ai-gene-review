    action: MARK_AS_OVER_ANNOTATED
    reason: 'PEX12 is a five-pass peroxisomal membrane protein and a component of the peroxisomal protein
      import machinery. Peroxisomes import their contents from the cytosol, so a signal-peptide-directed
      secretory peptide has no route to this membrane. PEX12 is also the least promiscuous of the eleven
      Swiss-Prot membrane partners at 37 distinct IntAct partners, which is noted because it weakens the
      hub explanation for this particular row even though the single-screen and hydrophobicity arguments
      still apply. This row is one of twelve that come from a single publication, the HuRI binary interactome
      (PMID:32296183). IntAct logs each of those twelve partners under three names of the same yeast two-hybrid
      screen - two hybrid array, two hybrid prey pooling approach, and validated two hybrid - which is
      why the UniProt entry reads NbExp=3 for twelve partners and NbExp=5 for SLC30A2, where two of the
      three sub-methods are logged twice. The number counts sub-methods, not experiments. All twelve share
      one MI-score, 0.56, and no orthogonal assay supports any of them: there is no co-immunoprecipitation
      of endogenous protein, no biophysical binding measurement and no reciprocal pull-down anywhere in
      the record. Set-level context, restated on every row so each can be read alone; the full census
      with its tables is in the gene''s bioinformatics RESULTS.md, sections C and D. All fourteen rows
      come from two pipelines, and the partner set has a single shared property. Eleven of the thirteen
      partners are integral membrane proteins, carrying 44 annotated transmembrane segments between them;
      the other two are SGTA and SGTB, the two human members of the SGT family of TPR co-chaperones, and
      the hydrophobic-client function is curated for SGTA only - SGTB''s entire UniProt FUNCTION is HSC70/HSP70
      ATPase regulation, so it is consistent with the reading rather than a second curated instance, and
      that asymmetry is computed from the cached UniProt records rather than asserted (check H, four directions
      break-tested). C5orf46 is the bait in 26 of the 38 two-hybrid records, and that bait is the full
      open reading frame, whose most hydrophobic 19-residue window (Kyte-Doolittle +2.51) is the uncleaved
      signal peptide - more hydrophobic than anything in the mature chain (+1.08). A bait presenting the
