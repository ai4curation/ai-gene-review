- gap_statement: The relationship between the antibacterial activity and the general cytotoxicity is unresolved,
    and it is the question that decides whether this peptide is a host-defence molecule or simply a membrane-active
    amphipathic peptide. At 10 micromolar the peptide kills Jurkat and Raji lymphoma lines - but it also
    kills normal T lymphocytes, HaCaT keratinocytes and mouse embryonic fibroblasts, so it is not tumour-selective
    and it is not selective for bacteria over host cells at that concentration. Whether there is a concentration
    window in which it kills bacteria and spares host cells has not been reported.
