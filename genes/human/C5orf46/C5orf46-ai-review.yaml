- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: Accepted as a core location. The evidence route is weak - a mapping from a curator inference
      that itself rests on a predicted signal peptide - but the conclusion is independently measured three
      ways that are not in that route.
    action: ACCEPT
    reason: 'Taken on its own the provenance of this row would deserve caution. Its input is UniProtKB-SubCell:SL-0243
      ''Secreted'', which comes from the entry''s SUBCELLULAR LOCATION line flagged ECO:0000305, a curator
      inference; and that inference rests on SIGNAL 1..23 flagged ECO:0000255, a prediction. So the chain
      from evidence to annotation contains no measurement at any step. What rescues it is that the conclusion
      has been reached separately by routes the annotation does not cite. The protein is identified in
      human plasma by mass spectrometry using an assay that enriches exactly the 2-10 kDa window the 7.22
      kDa mature peptide occupies. It is catalogued in the exosome fraction of parotid saliva, which is
      the basis of this gene''s other cellular-component row. UniProt records PE 1: Evidence at protein
      level with a Proteomics identification keyword. HGNC''s alias name for the gene is skin and saliva
      secreted protein 1 and the Human Protein Atlas calls its expression group-enriched in blood vessel,
      salivary gland and skin - both consistent with a secreted product of surface tissues. And the peptide''s
      assayed activity is exerted on bacteria outside the cell, which is only coherent for an extracellular
      protein. The route by which GOA asserted this term is therefore weaker than the term itself, and
      both facts are worth recording. One further point on the reference: GO_REF:0000044 is the UniProt
      SubCell mapping and is very much live, returning 139,714 human annotations, in contrast to GO_REF:0000043,
      the Swiss-Prot keyword reference, which now returns 0 - so this row should not be mistaken for a
      retired keyword-derived annotation.'
    supported_by:
    - reference_id: PMID:31308252
      supporting_text: Applying this method to perform deep-proteome profiling of human plasma we identify
        C5ORF46 as a previously uncharacterized human plasma protein.
      full_text_unavailable: true
