core_functions:
- description: 'A secreted, anionic, cysteine-free 64-residue peptide that kills Gram-negative bacteria.
    The activity is measured on purified protein: colony-forming units fall, minimum inhibitory concentrations
    were determined, the effect is concentration-dependent from 0.1 to 10 micromolar, and treated bacteria
    lose their shape and disintegrate under electron microscopy. The specificity is measured in both directions
    - four Gram-negative species killed, two Gram-positive pathogens and yeast unaffected - so this is
    a real preference and not the limit of what was tested. Administering the peptide to mice after a
    lethal Escherichia coli O157:H7 challenge raises survival substantially, and the mouse orthologue
    behaves identically, so the activity is not an artefact of one preparation or one species. The molecule
    assayed is the gene''s physiological product rather than a synthetic fragment: 64 residues, 7.22 kDa
    and isoelectric point 4.54 all reproduce from UniProt''s annotated mature chain 24..87. Two boundaries
    are part of the function statement rather than caveats appended to it. First, no molecular function
    is claimed. The route by which the peptide kills is unresolved by the authors'' own account, which
    leaves cell-envelope damage and an intracellular target both open, and the helix that a pore-forming
    reading would rest on is a secondary-structure prediction with circular-dichroism support for helicity,
    not a demonstration of membrane permeabilisation. Second, every experiment adds peptide from outside
    - to cultures, or by injection - so what is established is that the peptide is sufficient to kill
    these bacteria and sufficient to protect an animal when given, not that the endogenous gene is required
    for host defence. The location is secure independently of the annotation route that asserts it: the
    protein is detected in human plasma by mass spectrometry and catalogued in parotid-saliva exosomes,
    and expression is concentrated in skin, salivary gland and blood vessel, which is a coherent distribution
    for a host-defence peptide of the body surfaces. The core location is the extracellular region and
    not the exosome: the exosome detection corroborates secretion, but every measurement of activity used
    free peptide, and the SUMO-fusion control implies the functional species is free soluble peptide rather
    than vesicle-packaged peptide, so no compartment of action beyond the extracellular region is claimed.'
