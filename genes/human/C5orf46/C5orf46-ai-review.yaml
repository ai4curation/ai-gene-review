- id: PMID:35504177
  title: Preliminary study on the role of the C5orf46 gene in renal cancer.
  findings:
  - statement: 'The only loss-of-function experiment on this gene in any system. siRNA knockdown in two
      renal-carcinoma lines reduces proliferation and migration and increases apoptosis. It is deliberately
      not converted into a GO process term: this is a cancer-cell-line dependency with no mechanism and
      no rescue, and it is unrelated to the antibacterial activity.'
    supporting_text: In vitro cell experiments showed that inhibition of C5orf46 expression could reduce
      renal cancer cell proliferation and migration and increase apoptosis.
  - statement: An independent statement, by a different group, that the gene had barely been studied -
      useful context for reading the sparseness of its GO record as real rather than as a curation backlog.
    supporting_text: Few functional studies of the C5orf46 gene have been performed.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Cached full text read; retraction and correction checks clean. Marked LOW_QUALITY on
      methodological grounds rather than citation grounds - the identifier and title are correct and the
      paper is honestly presented, its own title beginning 'Preliminary study'. The in vitro part is siRNA
      knockdown in two lines with proliferation, migration and apoptosis read-outs, no rescue, no mechanism,
      and no molecular function assayed; the remainder is TCGA bioinformatics. Sufficient to record a
      cancer-cell-line dependency as a knowledge gap, not sufficient to support a GO process term, and
      no term is proposed from it. Its background sentence that the gene has 'antibacterial and anti-inflammatory
      effects via sequencing and microarray technologies' garbles the antibacterial finding, which came
      from purified protein assays, not sequencing; that sentence is not relied on.
- id: PMID:25585381
  title: AP-57/C10orf99 is a new type of multifunctional antimicrobial peptide.
  findings:
  - statement: The same laboratory's earlier antimicrobial peptide, cited by the AP-64 paper as its own
      predecessor and curated in GO where AP-64 is not. Its stated properties are the near-mirror of AP-64's
      - basic rather than anionic, four cysteines rather than none - which is why its curated GO:0050830
      and the GO:0050829 proposed here are counterpart terms rather than the same claim.
    supporting_text: AP-57 is a short basic amphiphilic peptide with four cysteines and a net charge +14
      (MW = 6.52, PI = 11.28)
    full_text_unavailable: true
  - statement: 'The activity spectrum is complementary to AP-64''s: AP-57 kills Gram-positive bacteria
      and a fungus, the two categories AP-64 was measured not to affect.'
    supporting_text: AP-57 exhibited broad-spectrum antimicrobial activities against Gram-positive Staphylococcus
      aureus, Actinomyce, and Fungi Aspergillus niger
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Abstract-only in the cache, so nothing beyond the abstract is asserted about it. Cited
      here for one purpose: it is the curatorial precedent that makes the coverage gap on C5orf46 a consistency
      defect rather than a wish. GOA carries four IDA rows from this paper on C10orf99/GPR15LG (Q6UWK7),
      including GO:0050830 and GO:0050832, all assigned by UniProt, and UniProt took the AP-57 name into
      that entry. Note a correction to my own working assumption, recorded because it nearly propagated:
      I first looked C10orf99 up as Q6UWT2, which is adropin (ENHO) and an entirely different protein.
      The right accession is Q6UWK7, confirmed by primaryAccession and by its gene synonyms including
      C10orf99.'
- id: file:human/C5orf46/C5orf46-deep-research-affinage.md
  title: Affinage mechanistic annotation for C5orf46 (human)
  findings:
  - statement: 'The record''s corpus-level negative, which is the one thing it is cited for here. It is
      used as a statement about the literature rather than as evidence about the protein, and it is independently
      corroborated three ways: the UniProt entry has no FUNCTION comment and is still titled ''Uncharacterized
      protein'', the sole functional paper lists mechanism as an open question in its own limitations,
      and no partner among the fourteen protein-binding rows survives scrutiny.'
    supporting_text: Beyond its antibacterial role, no defined molecular mechanism, receptor, or binding
      partner has been characterized in the available corpus.
  - statement: A framing defect in the record, recorded because nothing automated can catch it. This finding
      is stated without the result that immediately follows it in the cited paper - that normal T cells,
      HaCaT keratinocytes and mouse embryonic fibroblasts are equally susceptible - so read alone it implies
      a tumour selectivity the source contradicts. No annotation in this review rests on it, and the qualification
      is stated everywhere the cytotoxicity is mentioned.
    supporting_text: AP-64 (C5ORF46 protein product) exhibits cytotoxic effects against human T-cell lymphoma
      Jurkat and B-cell lymphoma Raji cells.
  - statement: 'The record''s gates passed, which is a floor on precision and says nothing about recall.
      Its three citations are real numeric PMIDs with no preprint identifier in a PMID-shaped field, and
      all three were verified clean of retraction and erratum. Recall was mixed in an informative way:
      it returned the three papers that no GOA row cites, including the sole functional characterisation,
      and none of the three interactome references that GOA does cite.'
    supporting_text: 'gates_passed: True'
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'A machine-generated secondary source, assessed rather than trusted. Its value here
      was real: it surfaced all three of the papers that GOA does not cite, including the sole functional
      characterisation of the gene, so both proposed terms trace to a lead it provided. Marked LOW_QUALITY
      on two grounds, neither of which is a fabricated citation. First, the cytotoxicity finding is framed
      without the disconfirming result that follows it in the same paper, which turns general micromolar
      cytotoxicity into an apparent anti-tumour selectivity - exactly the kind of error a verbatim-quote
      gate cannot catch, because the sentence itself is true. Second, the narrative''s shape invites a
      membrane-permeabilisation reading of the mechanism, which the source explicitly leaves open between
      envelope damage and an intracellular target; no molecular function is proposed anywhere in this
      review as a result. The record''s own GO grounding offers no molecular activity and only GO:0005576,
      which agrees with the conclusion reached here independently. Nothing from it is used as evidence
      for any mechanistic claim - it is cited once, for a corpus-level negative that three independent
      sources corroborate.'
- id: file:human/C5orf46/C5orf46-uniprot.txt
  title: UniProtKB entry Q6UWT4 (CE046_HUMAN), cached in the gene folder
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The cached Swiss-Prot entry, and the source of the mature-chain boundaries that everything
      in section A of the bioinformatics results depends on. Verified live that primaryAccession is Q6UWT4,
      so this is not a merged accession silently resolving to another protein - a failure mode that returns
      HTTP 200 with a complete, normal-looking reviewed record. Every quotation taken from this file is
      a single physical line, because a supporting_text that spans a CC continuation cannot be verbatim
      and the repo validator does not check file: quotes at all; each was additionally hand-verified with
      grep -F. Two features of the entry are worth flagging for UniProt rather than for GO: there is no
      FUNCTION comment and the recommended name is still ''Uncharacterized protein C5orf46'', although
      a 2021 paper purified this exact mature chain and measured its bactericidal activity; and the reference
      list stops at four large-scale sequencing submissions. The entry is otherwise internally consistent
      - notably it does NOT carry an unsupported activity from its domain name, since its only InterPro
      signature, IPR027950/DUF4576, maps to nothing.'
- id: file:human/C5orf46/C5orf46-bioinformatics/RESULTS.md
  title: C5orf46 bioinformatics results (mature-peptide identity; partner-set composition; annotation
    coverage gap)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Generated by analyze_c5orf46.py in the same folder, with the fetched records cached
      under data/ so the numbers reproduce without network access. Every reported zero in it is paired
      with a non-zero positive control from the same endpoint in the same call pattern - ADGRA2 and ACTB
      for the IBA count, PMID:19199708 for the reference-coverage count, IPR001879 for the interpro2go
      lookup - because a rejected query and a genuine negative are indistinguishable downstream. Its guards
      are break-tested in both directions with the failure message asserted, and one of them caught a
      real defect in the script''s own first version: a single-request IntAct fetch silently dropped 32
      of AQP6''s 1032 interaction records, and the self-test now re-runs that exact call and requires
      it to raise. Quotations into this file are deliberately taken from computed table rows rather than
      from prose, because a file: quote into a generated artifact is a two-way dependency and prose gets
      reworded.'
