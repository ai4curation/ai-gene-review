- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:P55061
  review:
    summary: Over-annotated. An affinity-proteomics association with TMBIM6 (UniProtKB:P55061) from the
      BioPlex 2.0 dataset, with no orthogonal validation and no functional consequence measured.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'TMBIM6 (BI-1) is a six-pass ER membrane protein with 132 distinct IntAct partners. This is
      the one row in the set that is at least topologically coherent, and that is worth stating rather
      than flattening: C5orf46 is the tagged bait in both BioPlex records, so this is a pull-down of an
      over-expressed signal-peptide protein that genuinely transits the ER, recovering an abundant resident
      of the compartment it passes through. That makes it a plausible encounter rather than a topologically
      impossible one - and also exactly the kind of encounter that co-residence in the ER produces without
      any functional relationship. This row is the BioPlex 2.0 record of the TMBIM6 association, detected
      by anti tag coip in HEK293T. The same partner appears in the other BioPlex release, so the two GOA
      rows for TMBIM6 are one affinity-proteomics method in two releases of one programme rather than
      two independent assays. Both carry MI-score 0.56. Set-level context, restated on every row so each
      can be read alone; the full census with its tables is in the gene''s bioinformatics RESULTS.md,
      sections C and D. All fourteen rows come from two pipelines, and the partner set has a single shared
      property. Eleven of the thirteen partners are integral membrane proteins, carrying 44 annotated
      transmembrane segments between them; the other two are SGTA and SGTB, the two human members of the
      SGT family of TPR co-chaperones, and the hydrophobic-client function is curated for SGTA only -
      SGTB''s entire UniProt FUNCTION is HSC70/HSP70 ATPase regulation, so it is consistent with the reading
      rather than a second curated instance, and that asymmetry is computed from the cached UniProt records
      rather than asserted (check H, four directions break-tested). C5orf46 is the bait in 26 of the 38
      two-hybrid records, and that bait is the full open reading frame, whose most hydrophobic 19-residue
      window (Kyte-Doolittle +2.51) is the uncleaved signal peptide - more hydrophobic than anything in
      the mature chain (+1.08). A bait presenting the most hydrophobic segment in the construct, recovering
      a partner set whose only shared property is hydrophobicity, is better explained by the screen''s
      design than by the peptide''s biology. Twelve of the thirteen partners also exceed the subject''s
      14 distinct IntAct partners, up to AQP6 at 382, with PEX12 at 37 and the truncated TBXA2R clone
      at 13 recorded as the exceptions rather than smoothed away. And every interaction in the set was
      scored either in the Saccharomyces cerevisiae nucleus or in a HEK293T lysate, so no partner was
      tested in its native topology. Marked as over-annotated rather than removed. These are genuine records
      from a real screen and no positive argument is available that the interaction is false; what is
      absent is replication, orthogonal validation, and any functional consequence. GO:0005515 is also
      uninformative by construction, and no better molecular function term can be substituted, because
      nothing about the partner tells us what the peptide does.'
    supported_by:
    - reference_id: file:human/C5orf46/C5orf46-bioinformatics/RESULTS.md
      supporting_text: '| PMID:32296183 (HuRI) | `two hybrid array` | 13 |'
    - reference_id: file:human/C5orf46/C5orf46-bioinformatics/RESULTS.md
      supporting_text: '| SGTA | O43765 | Swiss-Prot | 313 | 0 | Cytoplasm; Nucleus | 281 | 1 |'
