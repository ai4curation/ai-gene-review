      supporting_text: FT   SIGNAL          1..23
    - reference_id: file:human/C5orf46/C5orf46-uniprot.txt
      supporting_text: 'PE   1: Evidence at protein level;'
    - reference_id: file:human/C5orf46/C5orf46-uniprot.txt
      supporting_text: DR   HPA; ENSG00000178776; Group enriched (blood vessel, salivary gland, skin).
    - reference_id: file:human/C5orf46/C5orf46-bioinformatics/RESULTS.md
