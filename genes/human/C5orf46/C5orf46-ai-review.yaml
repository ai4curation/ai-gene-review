suggested_questions:
- question: 'Should GO and MGI curate PMID:33804835? It is the sole functional characterisation of C5orf46
    in any organism, and a QuickGO query by reference returns zero annotations citing it anywhere in GOA
    - against 396 for the control reference PMID:19199708, so this is a real absence and not a failed
    query. The consequence is visible on the mouse gene: MGI records Gm94 (Q3V2D2) with the ND ''no biological
    data available'' root term in all three aspects, while that paper reports Gm94 itself killing Gram-negative
    bacteria in vitro and protecting mice in vivo. Curating the mouse rows would additionally open an
    ISO/ISS route to the human gene which cannot exist today, because transfer needs a source annotation
    and there is none anywhere in the family. What makes this a consistency question rather than a wish
    is that the same laboratory''s previous paper on the same kind of molecule WAS curated: C10orf99,
    which they named AP-57 and which the AP-64 paper cites as its own predecessor, carries GO:0050830
    and GO:0050832 by IDA from that paper (PMID:25585381), and UniProt even took ''Antimicrobial peptide
    with 57 amino acid residues'' into the entry as an alternative name. AP-64 is the anionic, Gram-negative-killing
    counterpart of that basic, Gram-positive-killing peptide, so GO:0050829 is the mirror of a term the
    sibling already holds. The class is curatable, has been curated, and this gene was missed.'
  experts:
  - GO Central curators
  - MGI curators
  - UniProt curators
- question: 'Should the UniProt entry for Q6UWT4 still read ''Uncharacterized protein C5orf46'' with no
    FUNCTION comment? The entry''s own reference list stops at four sequencing papers, and PMID:33804835
    - which purified the mature peptide, measured minimum inhibitory concentrations against four Gram-negative
    species, imaged the killed bacteria, and protected mice with it - is absent. The mature-chain properties
    the paper states are exactly those of the entry''s annotated CHAIN 24..87 (64 residues, 7.22 kDa,
    pI 4.54, no cysteines), so the identification is not in doubt. A FUNCTION comment, an Antimicrobial
    or Antibiotic keyword, and the missing reference would all be supportable. The same group''s earlier
    peptide is the precedent here too: UniProt took ''Antimicrobial peptide with 57 amino acid residues''
    into Q6UWK7 as an alternative name on the strength of an equivalent paper, so the treatment requested
    is one this database has already applied to the sibling molecule. Raised as a UniProt correction rather
    than as a GO action, since there is no GO row to act on.'
  experts:
  - UniProt curators
- question: Does GO need a term for antimicrobial activity whose mechanism is not established? For this
    gene the killing is well measured and the route is explicitly unresolved between cell-envelope damage
    and an intracellular target. The available molecular-function options all assert a mechanism - pore
    formation, membrane disruption, a specific binding activity - so the correct action here is to propose
    no molecular function at all, which leaves the gene's best-established property unrepresented in the
    molecular-function aspect. Is that the intended behaviour, or is there a gap? The question generalises
    to the many antimicrobial peptides whose mechanism is inferred from growth kinetics rather than demonstrated.
  experts:
  - GO Central ontology editors
- question: Should a bare GO:0005515 row be created for every partner in a single high-throughput screen,
    when the screen's own metadata says the records are not independent? Twelve of this gene's fourteen
    protein-binding rows come from one HuRI screen, logged in IntAct under three names of that screen,
    which is why UniProt reads NbExp=3 for twelve partners and NbExp=5 for one. The partner set has a
    single shared property - eleven of thirteen are integral membrane proteins and the other two are SGTA
    and SGTB, the co-chaperones that bind exposed transmembrane helices - while the bait is a full open
    reading frame whose most hydrophobic window is an uncleaved signal peptide. One partner accession,
    Q0VAB0, is not even the canonical protein but an unreviewed 259-residue clone of a 343-residue receptor.
    Would a promiscuity or topology-compatibility filter at import be worth considering?
  experts:
  - IntAct curators
  - GOA curators
- question: Is there a mechanistic account of an anionic antimicrobial peptide acting on Gram-negative
    bacteria? The cationic-peptide model that explains the defensins and LL-37 cannot apply to a peptide
    with sixteen acidic and ten basic residues and a pI of 4.54. The paper notes dermcidin as a precedent
    for the charge and the absence of cysteines, but dermcidin's activity spectrum differs. What distinguishes
    the anionic antimicrobial peptides mechanistically, and is that distinction something the ontology
    should be able to express?
  experts:
  - antimicrobial peptide biochemists
  - innate immunity researchers
suggested_experiments:
- hypothesis: Endogenous C5orf46 is required for defence against Gram-negative bacteria at the body surfaces
    where it is expressed, not merely sufficient to kill them when added.
  description: Challenge Gm94 knockout mice and wild-type littermates with a Gram-negative pathogen at
    a mucosal or cutaneous surface where the gene is expressed - oral or skin inoculation rather than
    the intraperitoneal route used for the peptide-administration experiment - and measure bacterial burden
    and survival. The mouse orthologue has the same in vitro activity, so the model is appropriate. This
    is the single experiment that would convert the two proposed process annotations from sufficiency
    claims into requirement claims, and it is the gap that no existing experiment addresses.
  experiment_type: in vivo loss-of-function infection challenge
- hypothesis: The peptide reaches concentrations in saliva and on skin that are sufficient for the measured
    bactericidal activity.
  description: Quantify the mature peptide in saliva, skin surface washings and plasma by targeted mass
    spectrometry with a stable-isotope-labelled standard - the small-protein enrichment assay that first
    detected it in plasma is already suited to the 2-10 kDa window - and compare the concentrations with
    the published minimum inhibitory concentrations. Without this arithmetic the in vitro activity cannot
    be known to be physiologically reachable, and the same measurement bears on whether the observed keratinocyte
    cytotoxicity is relevant at native levels.
  experiment_type: targeted quantitative proteomics
- hypothesis: The peptide kills by permeabilising the bacterial membrane, rather than by acting on an
    intracellular target.
  description: Distinguish the two alternatives the authors leave open. Measure membrane permeabilisation
    directly and with time resolution - potassium efflux, propidium iodide or SYTOX uptake, and depolarisation
    of the inner membrane with a voltage-sensitive dye - against a known pore-former and a known intracellularly-acting
    antimicrobial as controls, and in parallel track uptake of fluorescently labelled peptide into the
    cytoplasm. If killing precedes permeabilisation, or if labelled peptide accumulates intracellularly
    before membrane integrity is lost, the intracellular-target reading is supported. This is the experiment
    that would license a molecular function term, which is currently withheld for exactly this reason.
  experiment_type: mechanism-of-action biophysics
- hypothesis: There is a concentration window in which the peptide kills Gram-negative bacteria without
    killing host cells.
  description: Run side-by-side dose-response curves on the same plate for bacterial killing and for viability
    of primary human keratinocytes, primary T cells and the lymphoma lines, over the full range from below
    the minimum inhibitory concentration to 10 micromolar. The published data give bacterial activity
    from 0.1 micromolar and significant lymphoma killing at 0.4 micromolar, but the two were measured
    in separate experiments, so the therapeutic index has never actually been determined. The answer decides
    whether the antibacterial activity is separable from general amphipathic cytotoxicity.
  experiment_type: comparative dose-response cytotoxicity
- hypothesis: The renal-carcinoma knockdown phenotype is a function of the secreted peptide.
  description: Repeat the siRNA knockdown in A498 and OSRC-2 and attempt rescue with recombinant mature
    peptide added to the medium, and separately with a re-expressed construct carrying silent siRNA-resistant
    mutations. If extracellular peptide rescues, the phenotype belongs to the secreted product; if only
    intracellular re-expression rescues, an intracellular pool is implied; if neither rescues, the phenotype
    is likely off-target and no GO process term should ever be built on it. This is the cheapest way to
    decide whether the only loss-of-function result on this gene means anything about its function.
  experiment_type: knockdown-rescue
knowledge_gaps:
- gap_statement: 'No molecular function is known. The peptide demonstrably kills Gram-negative bacteria,
    but the route is unresolved: the authors offer cell-envelope damage and an intracellular target as
    alternatives and settle neither, no molecular target has been identified, and no binding partner has
