- term:
    id: GO:0050829
    label: defense response to Gram-negative bacterium
  evidence_type: IDA
  original_reference_id: PMID:33804835
  qualifier: involved_in
  review:
    summary: Proposed as a new annotation. The gene's only functional characterisation has never been
      curated into GO for any organism, and this term is the one its measurements support most precisely.
    action: NEW
    reason: 'The absence, not any existing row, is this gene''s dominant annotation defect. Purified recombinant
      peptide kills four Gram-negative species with a concentration dependence spanning 0.1 to 10 micromolar
      and measured minimum inhibitory concentrations; electron microscopy shows the treated bacteria losing
      shape and disintegrating; and administering the peptide to mice after a lethal Escherichia coli
      O157:H7 challenge raises 24-hour survival from 20 per cent to 90 per cent. None of this is in GOA:
      a QuickGO query by reference returns zero annotations citing PMID:33804835 anywhere, against a positive
      control of 396 for PMID:19199708, so the endpoint works and the absence is real. The specific term
      is chosen over its parent GO:0042742 because the discrimination was measured in both arms rather
      than assumed: the same assay found no appreciable activity against the Gram-positive pathogens Staphylococcus
      aureus and Listeria monocytogenes, and none against yeast. Ancestry was fetched rather than inferred
      from the labels - GO:0042742 is in GO:0050829''s is_a/part_of closure - so the specific term entails
      the general one and nothing is given up by using it. There is an exact curatorial precedent, and
      it is what turns this from a request into a consistency argument. The same group had previously
      characterised C10orf99 as a human antimicrobial peptide under the same naming convention, AP-57,
      and the AP-64 paper cites that work as its own predecessor. C10orf99 (UniProtKB:Q6UWK7, GPR15LG)
      was curated: UniProt gave it the alternative name ''Antimicrobial peptide with 57 amino acid residues'',
      and GOA carries four IDA annotations from the AP-57 paper, among them GO:0050830 defense response
      to Gram-positive bacterium and GO:0050832 defense response to fungus. The two peptides are near-mirror
      images: AP-57 is basic with four cysteines and kills Gram-positives and a fungus, while AP-64 is
      anionic with none and kills Gram-negatives but neither Gram-positives nor yeast. So GO:0050829 for
      this gene is the exact counterpart of the GO:0050830 that the sibling already holds, from an equivalent
      experiment in an equivalent paper by the same laboratory. The class is demonstrably curatable and
      has been curated; this gene was simply missed. The molecule assayed is this gene''s physiological
      product, not a synthetic fragment, and that was checked rather than assumed: recomputing from UniProt''s
      annotated CHAIN 24..87 gives 64 residues, 7.22 kDa, isoelectric point 4.54 and zero cysteines, reproducing
      all four properties the paper states for AP-64, with the same mass routine reproducing UniProt''s
      stated 9693 Da for the 87-residue precursor as a positive control. The direction of the evidence
      needs stating because GO''s evidence codes do not encode it. Every experiment is exogenous addition
      of purified peptide - to bacterial cultures in vitro, and by intraperitoneal injection 30 minutes
      after a lethal challenge in vivo - so what is established is that the peptide is sufficient to kill
      Gram-negative bacteria and sufficient to protect an animal when administered. No knockout, knockdown
      or patient loss-of-function has been challenged with a pathogen in either species, so the gene has
      not been shown to be required for antibacterial defence. No molecular function term is proposed
      alongside these process terms, and that is deliberate. The authors leave the mechanism open between
      cell-envelope damage and an intracellular target and say so twice, once in interpreting the growth
      curve and again in their limitations. The alpha-helix is a PSIPRED prediction with circular-dichroism
      support for helical content, which establishes that a helix exists, not that it forms a pore or
      permeabilises a bilayer. Deriving a pore-forming or membrane-disrupting activity from it would be
      reading a structure prediction as a mechanism. GO offers no term for ''kills bacteria by an unidentified
      route'', and inventing one would be an over-annotation in the opposite direction. Two neighbouring
      terms are declined for a reason that belongs in the record rather than only in the notes, because
      declining them while accepting GO:0050829 from the same experiments would otherwise look inconsistent.
      GO:0019731 antibacterial humoral response and GO:0061844 antimicrobial humoral immune response mediated
      by antimicrobial peptide both require the response to occur in a BODY FLUID. The peptide is present
      in plasma and in saliva, but every assay was done in culture medium or by injecting peptide into
      an animal, so no experiment shows the endogenous peptide mounting a response in either fluid; those
      two terms would convert a sufficiency result into an organism-level process claim, which GO:0050829
      and GO:0031640 do not. GO:0140367 antibacterial innate immune response is declined on its own differentia,
      which requires components that directly recognise a pathogen component - no target has been identified
      here.'
