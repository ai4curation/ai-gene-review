- id: PMID:33804835
  title: AP-64, Encoded by C5orf46, Exhibits Antimicrobial Activity against Gram-Negative Bacteria.
  findings:
  - statement: The gene product is identified as an anionic, cysteine-free antimicrobial peptide of 64
      residues - which is exactly UniProt's annotated mature chain 24..87 of Q6UWT4.
    supporting_text: AP-64 is an anionic amphiphilic peptide lacking cysteines (MW = 7.2, PI = 4.54)
  - statement: Purified peptide kills four Gram-negative species. This is the primary activity measurement.
    supporting_text: AP-64 exhibited significant antibacterial activity against Gram-negative bacteria,
      including Escherichia coli DH5α, Escherichia coli O157:H7, Vibrio cholerae, and Pseudomonas aeruginosa.
  - statement: 'The Gram-negative specificity is measured in both arms: the two Gram-positive pathogens
      tested are unaffected. This internal negative control is what licenses the specific GO term rather
      than its parent.'
    supporting_text: AP-64 and Gm94 lacked appreciable bactericidal activity against the pathogenic Gram-positive
      bacteria Staphylococcus aureus and Listeria monocytogenes
  - statement: Yeast is also unaffected, so the activity is not general to microbes.
    supporting_text: we also observed that the yeast cells were unsusceptible to the peptide treatment
  - statement: Killing is concentration-dependent over two orders of magnitude, not an all-or-nothing
      observation at one dose.
    supporting_text: AP-64 and Gm94 effectively inhibited the growth of bacteria in the concentration
      range of 0.1–10 μM
  - statement: Electron microscopy shows the bacterial cells losing shape and then disintegrating, which
      is the observation behind the cell-envelope reading.
    supporting_text: SEM examination revealed that a 2-h treatment with the proteins at the concentration
      of 10 μM caused an apparent irregularity and collapse in cell shape.
  - statement: The mechanism is explicitly left open between envelope damage and an intracellular target,
      which is why no molecular function term is proposed anywhere in this review.
    supporting_text: This growth curve implied that AP-64 possessed a similar antibacterial pattern to
      that of cell-envelope-interfering agents and that its action might be related to cell envelope damage
      [18]. The multiplication of growth might also hint at an intracellular target of the peptide.
  - statement: The authors state the mechanism as an open question in their own limitations, independently
      of the sentence above.
    supporting_text: Second, the molecular mechanisms underlying the bacterial inhibition should be investigated
      in future studies.
  - statement: Administered peptide protects mice against a lethal bacterial challenge. This is exogenous
      administration, so it demonstrates sufficiency and not that the endogenous gene is required.
    supporting_text: The survival rate of mice treated with PBS was 20% at 24 h after bacterial inoculation,
      whereas the survival rates of mice injected with AP-64 and Gm94 (500 μg/kg of body weight) were
      90% and 80%, respectively
  - statement: 'The activity is a property of the free peptide: an N-terminal SUMO fusion abolishes it
      and removing the tag restores it, which is a useful internal control against a preparation artefact.'
    supporting_text: SUMO-AP-64 was expressed in a soluble form but failed to inhibit the growth of DH5α
      cells. After removal of the SUMO tag, AP-64 exhibited strong antibacterial effects.
  - statement: 'The cytotoxicity is NOT tumour-selective: normal T cells, keratinocytes and mouse embryonic
      fibroblasts are killed too. Any account of the Jurkat and Raji result that omits this over-states
      selectivity.'
    supporting_text: Subsequently, we tested the toxicity of the peptides to T cells, Hacat, and MEF cells.
      Our data showed that these cells were susceptible to the peptide treatment
  - statement: The mouse orthologue Gm94 has the same activity, so a cross-species ISS/ISO route exists
      in principle - but MGI currently records Gm94 as having no biological data available.
    supporting_text: we demonstrated that AP-64 (human C5orf46) is a type of AMP that exerts a direct
      antibacterial effect on Gram-negative bacteria, and our data shows that Gm94 (mouse C5orf46) also
      exhibits the similar antibacterial ability
  - statement: The tissue distribution in this paper is taken from a database, not measured, and the authors
      say so. It is used in this review only as agreement with HPA and the HGNC alias name, never as primary
      evidence.
    supporting_text: First, the mRNA expression of AP-64 in the skin and salivary gland was discovered
      using the TCGA database
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached full text read in full. The sole functional characterisation of this gene in
      any organism, and the basis for both proposed new terms. Retraction, erratum and expression-of-concern
      checks clean by two independent routes - the PubMed record''s PublicationType and CommentsCorrections
      fields, and Crossref relation/update-to/updated-by on DOI 10.3390/biom11040485. Identity of the
      assayed molecule verified computationally rather than assumed: the paper''s stated 64 residues,
      MW 7.2 and PI 4.54 are all reproduced from UniProt''s annotated mature CHAIN 24..87, so this is
      the gene''s physiological secreted product and not a synthetic sub-fragment. Two reading cautions
      recorded. First, the paper is careful that the killing mechanism is unresolved, and the deep-research
      record''s framing invites a membrane-permeabilisation reading the paper declines to support; no
      molecular function is proposed here as a result. Second, the Jurkat/Raji cytotoxicity must not be
      reported without the immediately following result that normal T cells, HaCaT keratinocytes and mouse
      embryonic fibroblasts are equally susceptible - it is general cytotoxicity at micromolar concentration,
      not selective anti-tumour activity. Notably, a QuickGO query by reference returns zero annotations
      citing this PMID anywhere in GOA (positive control: PMID:19199708 returns 396), so none of it has
      ever been curated.'
