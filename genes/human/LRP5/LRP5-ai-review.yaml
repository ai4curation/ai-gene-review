    supported_by:
    - reference_id: PMID:20630166
      supporting_text: |-
        None of the
        polymorphisms was associated with the presence of osteoporosis, fractures, and
        hip BMD. All polymorphisms were associated with unadjusted spine BMD, with the
        exception of rs4988330. Only rs4988321 was associated with adjusted spine BMD,
        where the presence of the A allele was associated with significantly lower spine
        BMD compared with the GG genotype (P=0.002). An interaction of the rs4988321
        polymorphism with calcium intake (P=0.016) was found. The carriers of the A
        allele demonstrated significantly lower spine BMD compared to GG homozygotes
        (P=0.001) only in the lowest calcium intake group (<680 mg/day), whereas in the
        highest calcium intake group no differences were found in BMD between genotypes.
        These findings demonstrate that both rs4988321 polymorphism and its interaction
        with calcium intake are associated with BMD, whereas higher calcium intake was
        shown to decrease the negative effect of this polymorphism on BMD.
