    supporting_text: |-
      We show here that SOST
      antagonizes Wnt signaling in Xenopus embryos and mammalian cells by binding to
      the extracellular domain of the Wnt coreceptors LRP5 and LRP6 and disrupting
      Wnt-induced Frizzled-LRP complex formation.
knowledge_gaps:
- gap_statement: >-
    The molecular features that make a ligand-receptor complex prefer LRP5 rather
    than the closely related LRP6, and the extent to which the two coreceptors are
    interchangeable in human osteoblasts, remain unresolved.
  boundary: >-
    Human LRP5 directly supports Wnt-dependent AXIN recruitment, and LRP5/LRP6 are
    jointly implicated in several antagonist and phosphorylation studies. However,
    prominent biochemical systems in the cited literature reconstituted or assayed
    LRP6 alone, and there is no experimental structure of O75197; the current
    AlphaFold model is prediction-only.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    LRP5-selective signaling explains why paralogous coreceptors have overlapping
    pathway assignments yet distinct human skeletal phenotypes and is essential for
    interpreting extracellular antagonist and gain-of-function variants.
  resolution: >-
    Reconstitute matched human Wnt-FZD-LRP5 and Wnt-FZD-LRP6 complexes with full
    extracellular and cytoplasmic signaling readouts, then determine ligand,
    antagonist, phosphorylation, AXIN-recruitment, and structural differences.
  provenance:
  - reference_id: PMID:20093360
    supporting_text: reconstitute in vitro the Fz8 CRD.Wnt3a.LRP6 signaling complex.
  - reference_id: PMID:12121999
    supporting_text: |-
      In 293T cells, coexpression of several Wnt-Fz
      fusion proteins with LRP6, but not LRP5, significantly activated a
      Wnt-responsive promoter, Optimized TOPFlash.
- gap_statement: >-
    Direct assembly, stoichiometry, and coreceptor selectivity of a human
    Norrin-FZD4-LRP5 signaling complex have not been established biochemically or
    structurally.
  boundary: >-
    Norrin activates an FZD4- and LRP-dependent classical pathway, human LRP5
    variants cause FEVR, and disease-associated LRP5 missense substitutions reduce
    Norrin-dependent signaling. The accessible ligand-system evidence does not
    distinguish LRP5 from LRP6 in the assayed LRP requirement.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the receptor complex would connect human variant effects to a defined
    retinal signaling mechanism and establish whether LRP5 has a nonredundant
    biochemical role in this ligand context.
  resolution: >-
    Purify human Norrin, FZD4, and LRP5 ectodomains for quantitative binding and
    complex reconstruction, compare LRP6 directly, and validate the resulting
    interfaces with endogenous retinal endothelial signaling assays.
  provenance:
  - reference_id: PMID:15035989
    supporting_text: |-
      the high efficiency with which Norrin induces Fz4- and Lrp-dependent
      activation of the classical Wnt pathway
  - reference_id: PMID:17955262
    supporting_text: |-
      single missense mutations in LRP5 and FZD4 caused a
      moderate level of reduction (ranging from 26 to 48, 36% on average)
- gap_statement: >-
    It is unknown whether the 1,034-residue RefSeq isoform 2 is translated and
    produces a stable membrane protein with any signaling activity.
  boundary: >-
    The reviewed canonical product is a 1,615-residue type-I membrane coreceptor
    with an N-terminal signal peptide and four beta-propeller/EGF modules. RefSeq
    isoform 2 has a 19-residue alternative N-terminus followed by canonical residues
    601-1615, so it lacks the canonical signal peptide and first two propeller
    modules. UniProt curates no alternative products, and no direct topology or
    functional evidence for the shorter product was identified.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Without evidence of translation and topology, the shorter sequence cannot be
    assigned canonical receptor functions or used to explain variant-specific
    signaling.
  resolution: >-
    Establish transcript and translation evidence in relevant tissues before
    testing signal-peptide usage, membrane topology, ligand binding, and canonical
    signaling with isoform-specific reagents.
- gap_statement: >-
    Whether LRP5 has a direct, cell-autonomous role in glucose or lipid metabolism,
    distinct from secondary effects of skeletal and canonical Wnt signaling, remains
    unresolved.
  boundary: >-
    Damaging variants and common alleles have been associated with glucose,
    cholesterol, or blood-pressure traits, but the cited studies are small clinical
    or population associations and do not define a direct metabolic molecular
    mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Separating direct receptor biology from pleiotropic association is necessary
    before metabolic-process GO annotations or therapeutic interpretations can be
    justified.
  resolution: >-
    Test isogenic loss-, rescue-, and signaling-separation alleles in the relevant
    human metabolic cell types while measuring proximal LRP5 signaling and direct
    glucose and lipid fluxes.
  provenance:
  - reference_id: PMID:19673927
    supporting_text: |-
      We found high prevalence of osteoporosis and abnormal glucose
      metabolism in subjects with LRP5 mutation(s). Further studies are needed to
      establish the role of LRP5 in glucose and lipid metabolism.
suggested_questions:
- question: >-
    Which Wnt and Frizzled combinations signal preferentially through LRP5 rather
    than LRP6 in human osteoblast-lineage cells, and which extracellular or
    cytoplasmic receptor features determine that preference?
  experts: []
- question: >-
    Does Norrin-FZD4 engage LRP5 directly in a stable ternary complex, and can LRP6
    substitute quantitatively for LRP5 in human retinal endothelial cells?
  experts: []
- question: >-
    Is RefSeq LRP5 isoform 2 translated in any human tissue, and if so how does a
    product lacking the canonical signal peptide and first two beta-propeller/EGF
    modules enter the secretory pathway and reach a functional membrane topology?
  experts: []
- question: >-
    Are the reported glucose and lipid phenotypes caused by a direct LRP5 signaling
    program in metabolic tissues or are they secondary to skeletal, endocrine, or
    general canonical Wnt effects?
  experts: []
suggested_experiments:
- hypothesis: >-
    LRP5 and LRP6 have nonidentical ligand and Frizzled preferences in human
    osteoblast-lineage cells.
  description: >-
    Create isogenic LRP5-null, LRP6-null, and double-null human mesenchymal stem
    cells, rescue them at endogenous abundance with each coreceptor, and challenge
    differentiating osteoblasts with a matrix of purified Wnt and Frizzled contexts.
    Measure receptor phosphorylation, AXIN membrane recruitment, beta-catenin
    dynamics, transcriptional output, osteoblast differentiation, and mineralization;
    include domain-swap receptors to localize LRP5-selective determinants.
  experiment_type: isogenic receptor-complementation signaling matrix
- hypothesis: >-
    Human LRP5 forms a direct Norrin-FZD4 coreceptor complex that is quantitatively
    distinct from the corresponding LRP6 complex.
  description: >-
    Reconstitute purified Norrin-FZD4-LRP5 and Norrin-FZD4-LRP6 ectodomain complexes
    for surface-plasmon-resonance or biolayer-interferometry measurements and
    structural analysis. Mutate candidate interfaces and test matched constructs in
    LRP5/LRP6-edited human retinal endothelial cells for proximal receptor activation,
    beta-catenin signaling, barrier maturation, and vascular-network formation.
  experiment_type: quantitative complex reconstitution plus retinal endothelial rescue
- hypothesis: >-
    The truncated RefSeq isoform 2 is either not translated or fails to acquire the
    membrane topology required for ligand-dependent signaling.
  description: >-
    First confirm the isoform-specific junction and coding potential by long-read RNA
    sequencing, targeted ribosome profiling, and junction-specific proteomics in bone
    and retinal tissues. Only if endogenous translation is detected, compare its
    signal-peptide usage, glycosylation, protease protection, surface delivery,
    ligand binding, and signaling with canonical LRP5.
  experiment_type: isoform-resolved transcriptomics, proteomics, and topology analysis
- hypothesis: >-
    Reported metabolic phenotypes require proximal LRP5 signaling in a specific human
    metabolic cell type rather than reflecting indirect systemic effects.
  description: >-
    Introduce representative damaging and signaling-separation LRP5 alleles into
    isogenic human hepatocytes, adipocytes, and beta cells, with wild-type rescue and
    LRP6 controls. Measure receptor-proximal Wnt signaling together with isotope-traced
    glucose and lipid fluxes; require concordant proximal and metabolic rescue before
    assigning a direct metabolic role.
  experiment_type: isogenic variant-rescue metabolic flux analysis
