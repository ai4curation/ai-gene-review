  justification: >-
    LRP5 directly binds sclerostin through its extracellular domain, and this
    interaction disrupts Wnt-induced Frizzled-LRP complex formation. Current GO
    provides only generic protein binding for this specific receptor-antagonist
    interaction; a partner-specific molecular-function term would preserve the
    informative activity.
  supported_by:
