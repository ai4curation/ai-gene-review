id: O75197
gene_symbol: LRP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP5 is a 1,615-residue type-I single-pass membrane coreceptor of the
  low-density-lipoprotein-receptor-related family. Its large extracellular region
  contains four beta-propeller/EGF modules and three LDL-receptor class A repeats,
  while its cytoplasmic tail contains phosphorylatable PPPSP motifs that recruit
  AXIN during ligand-dependent signaling. At the plasma membrane, LRP5 cooperates
  with Frizzled receptors to transduce canonical Wnt signals; this activity is a
  major determinant of osteoblast differentiation and bone mass and is antagonized
  by extracellular inhibitors including sclerostin. LRP5 also serves with FZD4 in
  Norrin signaling required for retinal vascular morphogenesis, and damaging human
  variants cause familial exudative vitreoretinopathy. Loss- and gain-of-function
  variants produce opposing bone phenotypes, whereas proposed direct roles in
  glucose or lipid metabolism remain less firmly established.
