- description: >-
    In the retinal vasculature, LRP5 acts as the LRP coreceptor for Norrin-bound
    FZD4 and transduces the resulting beta-catenin signal required for retinal blood
    vessel morphogenesis. Human FEVR-associated LRP5 variants impair this pathway,
    separating the Norrin-FZD4 context from the receptor's Wnt-dependent bone role.
    Because Norrin is not a Wnt protein, the broader coreceptor-activity term is used
    here rather than the Wnt-receptor-activity term used for the bone pathway.
  molecular_function:
