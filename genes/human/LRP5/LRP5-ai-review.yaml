      We show here that SOST
      antagonizes Wnt signaling in Xenopus embryos and mammalian cells by binding to
      the extracellular domain of the Wnt coreceptors LRP5 and LRP6 and disrupting
      Wnt-induced Frizzled-LRP complex formation.
  - reference_id: PMID:17680723
