core_functions:
- description: >-
    At the osteoblast plasma membrane, LRP5 acts as a Wnt coreceptor with Frizzled.
    Ligand-dependent assembly and phosphorylation of the receptor tail promote AXIN
    recruitment and canonical beta-catenin signaling; signaling dosage thereby
    promotes osteoblast differentiation and bone development. Sclerostin can inhibit
    this activity by binding the LRP5 extracellular domain and disrupting the
    Wnt-induced Frizzled-LRP complex.
  molecular_function:
    id: GO:0042813
    label: Wnt receptor activity
  directly_involved_in:
  - id: GO:0060070
    label: canonical Wnt signaling pathway
  - id: GO:0045669
