id: P62820
gene_symbol: RAB1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RAB1A is a prenylated Rab-family small GTPase that cycles between cytosolic
  GDP-bound and membrane-associated GTP-bound states to control vesicular traffic at the endoplasmic
  reticulum, ER-Golgi intermediate compartment, Golgi apparatus, transport-vesicle membranes,
  and selected endosomal carriers. It drives ER-to-Golgi carrier delivery, helps maintain
  Golgi organization, contributes to early autophagosome assembly through the ULK1/C9orf72
  axis, and supplies the ER-to-Golgi leg of Toll-like-receptor transport that is restrained
  by RNF115-dependent K11-linked ubiquitination.'
