  review:
    summary: RAB1A participates in early autophagosome assembly.
    action: ACCEPT
    reason: PAINT propagates this term from the conserved yeast Ypt1/RAB1 autophagy
      module, and primary human-cell evidence independently places RAB1A with C9orf72
      and the ULK1 initiation complex during phagophore recruitment.
    supported_by: &id001
    - reference_id: PMID:22939626
      supporting_text: S. flexneri intracellular persistence requires VirA TBC-like GAP
        activity that mediates bacterial escape from autophagy-mediated host defense.
    - reference_id: PMID:27334615
      supporting_text: We show that C9orf72 interacts with Rab1a and the ULK1 complex
        and mediates interaction of Rab1a with the ULK1 initiation complex to facilitate
        its trafficking to the phagophore and initiate autophagosome formation.
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IMP
  original_reference_id: PMID:22939626
  qualifier: involved_in
  review:
    summary: RAB1A participates in early autophagosome assembly.
    action: ACCEPT
