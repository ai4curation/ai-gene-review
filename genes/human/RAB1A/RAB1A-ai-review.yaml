core_functions:
- description: GTPase switch activity on ER, ERGIC, transport-vesicle, and cis-Golgi
    membranes that coordinates COPII carrier tethering, fusion, and early secretory
    traffic from the ER to the Golgi apparatus while preserving Golgi organization.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  - id: GO:0007030
    label: Golgi organization
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  - id: GO:0030658
    label: transport vesicle membrane
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:17684057
    supporting_text: TBC1D20 is the ER-localized GAP for Rab1
  - reference_id: PMID:22939626
    supporting_text: Specific inactivation of Rab1 by VirA/EspG disrupts ER-to-Golgi
      trafficking.
- description: Rab-dependent recruitment of the C9orf72/SMCR8/WDR41 and ULK1
    autophagy-initiation machinery to the phagophore to support early autophagosome
    assembly.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:27334615
    supporting_text: We show that C9orf72 interacts with Rab1a and the ULK1 complex and
      mediates interaction of Rab1a with the ULK1 initiation complex to facilitate its
      trafficking to the phagophore and initiate autophagosome formation.
- description: ER-to-Golgi transport of Toll-like-receptor cargoes in the
    AKT1-14-3-3-RNF115 pathway; RNF115 K11-linked ubiquitination of RAB1A blocks its
    GDI1-dependent recovery and limits this TLR transport leg.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:35343654
    supporting_text: Specifically, RAB1A promotes the trafficking of TLRs from the ER to
      the Golgi apparatus
proposed_new_terms: []
suggested_questions:
- question: Which RAB1A effector or tether complex couples TLR-containing COPII/ERGIC
    carriers to the Golgi handoff that precedes RAB13-dependent cell-surface delivery?
- question: Does RNF115-mediated K11-linked ubiquitination selectively block GDI1
    extraction of RAB1A on TLR-containing carriers, or is it a general shutoff signal
    for the ER-to-Golgi RAB1A pool?
suggested_experiments:
- description: Use endogenous RAB1A ubiquitination-resistant K49R/K61R knock-in myeloid
    cells with TLR4 pulse-chase imaging to test whether RNF115 controls the residence
    time of RAB1A on ERGIC-to-Golgi TLR carriers.
