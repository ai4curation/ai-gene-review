  review:
    summary: Proposed NEW annotation. UNC119B, through its myristoyl-binding pocket, carries myristoylated
      NPHP3 to the ciliary membrane; knockdown abolishes and pocket mutants fail to rescue NPHP3 ciliary
      targeting.
    action: NEW
    reason: 'Participation test: UNC119B is itself the carrier that binds and delivers the lipidated cargo,
      so it performs a step of the localization process rather than merely being required for it. Comparator:
      the paralogous lipid-cargo carrier PDE6D carries protein localization to cilium (GO:0061512) in
      GOA. The existing lipoprotein transport term does not capture the ciliary-membrane destination.
      Non-myristoylated cargo (GPCRs) is unaffected, consistent with a cargo-specific carrier role.'
    supported_by:
    - reference_id: PMID:22085962
      supporting_text: Finally, we showed that ARL3, UNC119b (but not UNC119a), and the ARL3 GAP Retinitis
        Pigmentosa 2 (RP2) are required for NPHP3 ciliary targeting and that targeting requires UNC119b
        myristoyl-binding activity.
    - reference_id: PMID:22085962
      supporting_text: Strikingly, the myristoyl-binding mutant tdTomato-UNC119b Mut-4 failed to rescue
        to the same extent, indicating that NPHP3 ciliary targeting indeed requires the myristoyl-binding
        activity of UNC119b.
    - reference_id: PMID:22085962
