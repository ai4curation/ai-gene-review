description: UNC119B is a soluble myristoyl-binding cargo carrier of the PDE6D/UNC119 family. Its immunoglobulin-like
  beta-sandwich forms a hydrophobic pocket, lined by conserved phenylalanines, that sequesters the N-terminal
  myristoyl group of a subset of myristoylated proteins such as nephrocystin-3 (NPHP3) and cystin. UNC119B
  shuttles these lipidated cargoes through the cytosol to the primary cilium, where it concentrates at
  the transition zone and proximal axoneme. Inside the cilium, GTP-bound ARL3 (activated by ARL13B) binds
  UNC119B and allosterically releases the myristoylated cargo into the ciliary membrane; the ARL3 GTPase-activating
  protein RP2 then returns ARL3 to the GDP state, freeing the carrier for another round. Through this
  ARL13B-ARL3-RP2 cycle UNC119B targets myristoylated proteins to the ciliary membrane, distinct from
  the PDE6D route used by prenylated cargo.
