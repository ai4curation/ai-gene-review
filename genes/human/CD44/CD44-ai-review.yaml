id: P16070
gene_symbol: CD44
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CD44 is a type I transmembrane glycoprotein of the hyaluronan-binding
  link-domain family that acts primarily at the cell surface as a receptor for hyaluronan
  and as a signaling scaffold in adhesion, migration and inflammatory responses. Its
  extracellular domain binds hyaluronan to mediate cell-cell and cell-matrix adhesion
  and to route hyaluronan into CD44-dependent endocytosis and hyaluronidase-coupled
  catabolism. CD44 also functions as the signal-transducing component of the CD74-containing
  macrophage migration inhibitory factor receptor complex: CD74 binds MIF, while full-length
  CD44 is required for Src and ERK1/2 activation and survival signaling. Alternative
  splicing and glycosaminoglycan modification create epithelial, hematopoietic and
  variant isoforms that tune ligand binding, protease scaffolding, shedding and disease-associated
  receptor outputs.'
