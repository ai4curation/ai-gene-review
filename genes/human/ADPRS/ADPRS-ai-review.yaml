- ADPRHL2
- ARH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ADPRS (ARH3, formerly ADPRHL2) is the human ADP-ribosyl-acceptor hydrolase that erases
  serine-linked ADP-ribosylation. It is a 363-residue, all-alpha-helical enzyme of the ADP-ribosylglycohydrolase
  family with a binuclear Mg2+ catalytic centre and a mobile Glu41 'flap' that gates substrate entry,
  and it cleaves the alpha-O-glycosidic bond at the anomeric C1'' of ADP-ribose. Its principal substrate
  is the mono-ADP-ribose that PARP1/2 in complex with HPF1 installs on serine residues of histones and
  other chromatin proteins after DNA damage; ADPRS is the only known enzyme that removes this mark,
  and it also reverses the rarer threonine- and tyrosine-linked ADP-ribosylation. The same active site
  hydrolyses protein-free poly(ADP-ribose), for which ADPRS is the dominant activity of the mitochondrial
  matrix because the mitochondrial PARG splice form is catalytically dead, and it hydrolyses 1''-O-acetyl-ADP-ribose,
  the product of sirtuin-catalysed histone deacetylation, faster than it hydrolyses poly(ADP-ribose).
  The protein is distributed between the nucleus (including chromatin and sites of DNA damage, to which
  it is recruited through ADP-ribose recognition), the cytosol and the mitochondrial matrix. By clearing
  ADP-ribose signals it limits the accumulation of free poly(ADP-ribose) that triggers apoptosis-inducing-factor
  release from mitochondria and parthanatic cell death, and it prevents persistent mono-ADP-ribose 'scars'
  on chromatin after single-strand break repair. Biallelic loss-of-function variants cause CONDSIAS
  (MIM 618170), a childhood-onset, stress-induced neurodegeneration with ataxia and seizures. ADPRS
  is distinct in specificity from its paralogues ADPRH/ARH1, which hydrolyses ADP-ribosyl-arginine,
  and the catalytically inactive ADPRHL1/ARH2.
