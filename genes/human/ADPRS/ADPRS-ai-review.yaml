proposed_new_terms:
- proposed_name: ADP-ribosylthreonine-[protein] hydrolase activity
  proposed_definition: 'Catalysis of the reaction: O-(ADP-D-ribosyl)-L-threonyl-[protein] + H2O = ADP-D-ribose
    + L-threonyl-[protein].'
  proposed_parent:
    id: GO:0016799
    label: hydrolase activity, hydrolyzing N-glycosyl compounds
  justification: 'GO has terms for the arginine (GO:0003875), serine (GO:0140292) and glutamate (GO:0140293)
    ADP-ribosyl hydrolases but none for threonine, so a measured activity has nowhere to go. Voorneveld
    et al. synthesised a Thr-ADP-ribosylated peptide and showed that wild-type ARH3, but not the D77N
    or D78N catalytic mutants, hydrolyses it, more slowly than the Ser analogue. UniProt records the
    activity in its FUNCTION line (''proteins ADP-ribosylated on serine and threonine''). The linkage
    is biologically real, not only synthetic: bacterial effectors such as CteC ADP-ribosylate Thr66
    of human ubiquitin. Filed as an ontology gap rather than forced onto GO:0140292, which is serine-specific
    by definition - a threonine hydrolase cannot be_a serine hydrolase, they are siblings, the same
    distinction that makes GO:0071451 wrong rather than merely general in this review''s first finding.
    Parented instead on the shared immediate parent that GO currently gives the arginine, serine and
    glutamate terms, GO:0016799; if the branch-placement question raised in suggested_questions is resolved
    in favour of GO:0004553, this term should move with its three siblings.'
  supported_by:
  - reference_id: PMID:33769608
    supporting_text: We found that ARH3, but not its catalytic mutants D77 N or D78 N, is capable of
      hydrolysing the glycosidic linkage in 24 (Ser) and 27 (Thr)
- proposed_name: poly(ADP-ribose) catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of protein-free
    poly(ADP-ribose).
  proposed_parent:
    id: GO:0009056
    label: catabolic process
  justification: 'GO has the molecular function GO:0004649 poly(ADP-ribose) glycohydrolase activity
    and the process GO:0051725 protein de-ADP-ribosylation, but no process term for degrading PROTEIN-FREE
    poly(ADP-ribose) - which is a distinct species with its own signalling role, since free PAR is the
    death signal that releases apoptosis-inducing factor from mitochondria. GO:0051725''s definition
    (''removing one or more ADP-ribose residues from a protein'') cannot cover a polymer that is no
    longer attached to a protein, and the mitochondrial matrix activity of ADPRS acts on exactly that
    species. Searched QuickGO and OLS for ''poly(ADP-ribose) catabolic'', ''ADP-ribose catabolic'' and
    ''ADP-ribose metabolic process'': no such term exists; the searches do return GO:1990966 ''ATP generation
    from poly-ADP-D-ribose'', so the queries were working.'
  supported_by:
  - reference_id: PMID:22433848
    supporting_text: embryonic fibroblasts from ARH3(-/-) mice lack most of the mitochondrial PAR degrading
      activity detected in wild-type cells
  - reference_id: PMID:24191052
    supporting_text: A protective effect of ARH3 results from its lowering of PAR levels in the nucleus
      and the cytoplasm, thereby preventing release of AIF from mitochondria and its accumulation in
      the nucleus
- proposed_name: parthanatos
  proposed_definition: A programmed necrotic cell death process initiated by hyperactivation of poly(ADP-ribose)
    polymerase 1, in which protein-free poly(ADP-ribose) triggers release of apoptosis-inducing factor
    from mitochondria and its translocation to the nucleus, where it initiates large-scale DNA fragmentation.
    The process is caspase-independent and does not require RIPK1, RIPK3 or MLKL.
  proposed_parent:
    id: GO:0097300
    label: programmed necrotic cell death
  justification: 'GO has no parthanatos term. The gap has a measurable annotation cost: it is why mouse
    Adprs, and by transfer human ADPRS, carry GO:0060546 negative regulation of NECROPTOTIC process,
    a term whose target GO:0070266 is defined by RIPK1/3 activation and MLKL dependence that parthanatos
    does not use. GO already acknowledges the problem in the comment on GO:0097527: PARP-dependent cell
    death ''is sometimes referred to as PARP-dependent cell death or parthanatos; it is still being
    debated if it constitutes an independent cell death modality''. Adding the term (with a ''negative
    regulation of parthanatos'' child) would let ADPRS, PARP1, AIFM1 and PARG be annotated precisely
    instead of being forced onto necroptosis.'
  supported_by:
  - reference_id: PMID:24191052
    supporting_text: A protective effect of ARH3 results from its lowering of PAR levels in the nucleus
      and the cytoplasm, thereby preventing release of AIF from mitochondria and its accumulation in
      the nucleus
  - reference_id: PMID:34479984
    supporting_text: removal of PAR prevents excessive PAR accumulation which can lead to free PAR formation,
      release of apoptosis inducing factor (AIF) from mitochondria, and induction of cell death via
      the parthanatos pathway
suggested_questions:
- question: 'GO:0140292 ADP-ribosylserine-[protein] hydrolase activity and GO:0140293 ADP-ribosylglutamate-[protein]
    hydrolase activity are both placed under GO:0016799 hydrolase activity, hydrolyzing N-glycosyl compounds.
    Both linkages are O-glycosidic: the acceptor atom is the serine side-chain hydroxyl oxygen and the
    glutamate carboxylate oxygen respectively, and UniProt/RHEA name the substrates ''O-(ADP-D-ribosyl)-L-seryl-[protein]''
    (RHEA:58256) and ''5-O-(ADP-D-ribosyl)-L-glutamyl-[protein]''. The internal control is their sibling
    GO:0003875 ADP-ribosylarginine-[protein] hydrolase activity, which IS N-glycosidic (the guanidino
    nitrogen) and is correctly placed. Should the serine and glutamate terms move under GO:0004553 hydrolase
    activity, hydrolyzing O-glycosyl compounds? Note the practical consequence on this gene: GO:0004553
    is currently annotated to ADPRS from a paper (PMID:30045870) that measured only serine-linked hydrolysis,
    and the two terms are in disjoint branches, so the generalisation a curator would expect does not
    hold.'
  experts:
  - GO ontology editors
  - ADP-ribosylation biochemists
- question: GO:0071451 cellular response to superoxide is held by all 33 gene products under PANTHER
    node PTN008564042 (the ADPRS orthologue clade). The chain traces back to one mouse MGI IMP on PMID:24191052,
    in which the stressor was hydrogen peroxide, and the human IMP (PMID:30401461) also used hydrogen
    peroxide. GO:0070301 and GO:0071451 are siblings, not parent and child, so the current annotation
    is not a safe generalisation. Would MGI re-term the mouse row to GO:0070301, which would retract
    the error from the whole clade at once?
  experts:
  - MGI curators
  - GO Central PAINT curators
- question: Reactome models ADPRS's only reaction, R-HSA-8952903 'ADPRHL2 hydrolyses poly(ADP-ribose)',
    in the mitochondrial matrix, but nests it inside the nucleoplasmic pathways R-HSA-110362 and R-HSA-110373,
    whose GO mapping (GO:0006287 base-excision repair, gap-filling) is then exported to ADPRS as a TAS
    annotation. Should the mitochondrial reaction be moved out of the long-patch BER pathway, or the
    pathway-to-GO export be made compartment-aware?
  experts:
  - Reactome curators
  - GOA
- question: Should ADPRS carry GO:0072570 ADP-D-ribose binding? Recombinant hARH3 binds free ADP-ribose
    with micromolar affinity, nine PDB entries resolve ADP-ribose in the catalytic groove, and ADP-ribose
    recognition is required for recruitment to DNA lesions - so the binding has a consequence beyond
    turnover. Against it, ADP-ribose is the product of every reaction the enzyme catalyses, and GO practice
    discourages annotating an enzyme to binding of its own substrate or product. Raised as a question
    rather than proposed as an annotation, because the argument turns on a curation convention rather
    than on missing data.
  experts:
  - GO Central
  - UniProt curators
- question: UniProt's CATALYTIC ACTIVITY for ADPRS includes alpha-NAD(+) + H2O = ADP-D-ribose + nicotinamide
    (RHEA:68792, ECO:0000269 from PubMed:31599159 and PubMed:34321462), and ARH3 has the highest alpha-NADase
    specific activity of the enzymes tested, yet no GO molecular function covers it. GO:0003953 NAD+
    nucleosidase activity is defined for NAD+ without an anomeric qualifier, and the measured enzymes
    hydrolyse alpha- but explicitly not beta-NAD+, so using it would over-claim. Is an 'alpha-NAD(+)
    glycohydrolase activity' term warranted, or should GO:0003953 gain an anomer-specific child?
  experts:
  - GO Central
  - ADP-ribosylation biochemists
- question: The 2006 ARH3 structure paper (PMID:17015823) reports that recombinant hARH3 'efficiently
    de-ADP-ribosylates poly- but not monoADP-ribosylated proteins'. That negative was overturned in
    2017 when ARH3 was shown to be the serine MONO-ADP-ribosylhydrolase (PMID:28650317, PMID:29234005)
    - the 2006 assay used arginine-linked mono-ADP-ribosylated substrates, on which ARH3 genuinely is
    inactive. Recorded so the older statement is not re-imported as a NOT annotation.
  experts:
  - GOA
  - UniProt curators
suggested_experiments:
- hypothesis: ADPRS's protection against oxidative-stress-induced death is specific to hydrogen peroxide-derived
    signalling rather than to superoxide, as the current GO annotation implies.
  description: Compare ADPRS-null and wild-type cells side by side under (i) exogenous H2O2, (ii) a
    pure superoxide generator such as paraquat or KO2 with catalase present to suppress secondary H2O2,
    and (iii) menadione. Read out PAR accumulation, AIF nuclear translocation and viability. If only
    the H2O2 arm shows an ADPRS-dependent difference, the annotation should be GO:0070301 alone; if
    the superoxide arm also responds, both terms are warranted and the existing row is salvaged rather
    than corrected.
  experiment_type: cell-based stress panel with ROS-species discrimination
- hypothesis: ADPRS restrains parthanatos specifically and has no role in RIPK1/RIPK3/MLKL-dependent
    necroptosis.
  description: In an ADPRS-null background, test whether the death phenotype is rescued by PARP1 inhibition
    and AIFM1 knockdown (parthanatos arm) but not by RIPK1 inhibition (necrostatin-1), RIPK3 knockout
    or MLKL knockout (necroptosis arm). A clean dissociation would settle whether GO:0060546 or a parthanatos-specific
    term is the correct annotation, and would inform the GO term request filed here.
  experiment_type: genetic and pharmacological epistasis
- hypothesis: The threonine-linked ADP-ribosylhydrolase activity of ADPRS is used in cells, not only
    on synthetic peptides.
  description: Infect cells expressing wild-type or catalytically dead ADPRS with a CteC-secreting bacterium,
    or express CteC ectopically, and quantify Thr66-ADP-ribosylated ubiquitin by targeted mass spectrometry
    over time. Persistence of the mark in the catalytically dead background would establish an in vivo
    role and support the proposed ADP-ribosylthreonine-[protein] hydrolase activity term.
  experiment_type: targeted mass spectrometry with bacterial effector
- hypothesis: The two HuRI two-hybrid partners, TNKS and PRDM5, do not form physiologically relevant
    complexes with ADPRS.
  description: Attempt endogenous reciprocal co-immunoprecipitation from a nuclear extract, and quantify
    affinity by a label-free method (ITC or SPR) with recombinant proteins. Include a proximity-labelling
    arm (ADPRS-TurboID) to test whether either partner is in the neighbourhood at native abundance.
    A negative result would justify moving both rows from MARK_AS_OVER_ANNOTATED to REMOVE; a positive
    would justify replacing GO:0005515 with an informative term.
  experiment_type: orthogonal interaction validation
