- description: Degrades protein-free poly(ADP-ribose), and is the dominant PAR-degrading activity of
    the mitochondrial matrix, where the alternatively spliced PARG isoform is catalytically inactive.
    Clearing free PAR limits the release of apoptosis-inducing factor from mitochondria and the parthanatic
    cell death it triggers.
