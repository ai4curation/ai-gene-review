core_functions:
- description: 'Erases serine-linked mono-ADP-ribosylation. ADPRS hydrolyses the alpha-O-glycosidic
    bond between the anomeric C1'''' of ADP-ribose and the serine hydroxyl of proteins modified by the
    PARP1/2:HPF1 complex, and is the only human enzyme known to do so. It acts on chromatin in the nucleus,
    where it is recruited to sites of DNA damage through recognition of ADP-ribose itself. Catalysis
    requires the two magnesium ions of the binuclear centre (GO:0000287, annotated separately by IDA):
    MgA positions the scissile linkage and MgB contributes to substrate binding. The metal is treated
    here as a property of the catalytic centre rather than as a core function in its own right - ADPRS
    is not interesting as a magnesium-binding protein.'
