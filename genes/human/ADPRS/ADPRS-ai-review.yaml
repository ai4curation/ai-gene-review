- description: Hydrolyses 1''-O-acetyl-ADP-ribose, the metabolite generated by sirtuin-catalysed histone
    deacetylation, releasing ADP-ribose and acetate. The authors report this reaction as significantly
    faster than the same enzyme's hydrolysis of poly(ADP-ribose) without quantifying the ratio; the
    widely repeated 250-fold figure from the same paper is a different comparison, ARH3 against ARH1
    on O-acetyl-ADP-ribose. Either way the activity places ADPRS at the junction of ADP-ribose signalling
    and NAD+-dependent deacetylation. Like the other two activities it is magnesium-dependent.
