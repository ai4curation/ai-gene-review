- term:
    id: GO:0006287
    label: base-excision repair, gap-filling
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-110373
  qualifier: involved_in
  review:
    summary: A mitochondrial-matrix reaction inheriting a nucleoplasmic gap-filling term by pathway
      containment. ARH3 neither excises a base nor fills a gap.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Traced end to end in Reactome''s own data. ADPRS has exactly one Reactome reaction, R-HSA-8952903
      ''ADPRHL2 hydrolyses poly(ADP-ribose)'', whose compartment is ''mitochondrial matrix'' and whose
      input and output are both ''[mitochondrial matrix]''. Reactome nests that reaction under R-HSA-110362
      ''POLB-Dependent Long Patch Base Excision Repair'' and then R-HSA-110373 ''Resolution of AP sites
      via the multiple-nucleotide patch replacement pathway'', both of which carry compartment ''nucleoplasm''.
      R-HSA-110373''s own goBiologicalProcess field IS GO:0006287, which is where this row comes from.
      The GO definition of GO:0006287 requires an apurinic endonuclease degrading bases and a polymerase
      synthesising a patch - ARH3 does neither. Reference-projection test, fully paginated: R-HSA-110373
      gives GO:0006287 to exactly 5 entities - POLB, LIG1, FEN1, PARG and ADPRS - of which the first
      three are the actual gap-filling machinery. Not REMOVE: ARH3 genuinely participates in the ADP-ribose
      signalling that accompanies single-strand-break repair, and GO:0006281 DNA repair (IMP, human
      experimental) already carries that at the right granularity. REMOVE was considered and declined
      on a specific ground rather than from caution: what the compartment argument demonstrates is that
      the ROUTE is invalid (a mitochondrial reaction cannot inherit a nucleoplasmic pathway''s GO term),
      not that the biology is false. ADPRS is genuinely recruited to nuclear DNA lesions and erases
      the ADP-ribose marks laid down during single-strand break repair, and PARG - the other non-gap-filling
      recipient of this same Reactome term - is likewise a real participant in that pathway. So the
      term is imprecise rather than fabricated, which is exactly what MARK_AS_OVER_ANNOTATED encodes;
      a REMOVE would need a positive demonstration that ADPRS is absent from base-excision repair, and
      no such demonstration exists.'
    supported_by:
    - reference_id: PMID:22433848
      supporting_text: ADP-ribosylhydrolase 3 (ARH3), not poly(ADP-ribose) glycohydrolase (PARG) isoforms,
        is responsible for degradation of mitochondrial matrix-associated poly(ADP-ribose).
    propagation_review:
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - GRANULARITY_MISMATCH
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - comment: nucleoplasm pathway; its GO:0006287 mapping is right for POLB/LIG1/FEN1 and wrong for
          a mitochondrial-matrix PAR hydrolase
        source_id: Reactome:R-HSA-110373
        source_label: Resolution of AP sites via the multiple-nucleotide patch replacement pathway
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
- term:
    id: GO:0060546
    label: negative regulation of necroptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CG72
  - ensembl:ENSMUSP00000099677
  review:
    summary: Ensembl Compara reflection of the same mouse row, inheriting the same wrong death modality.
    action: MODIFY
    reason: 'The cell death ARH3 restrains is PARTHANATOS, not necroptosis. GO:0060546 regulates GO:0070266,
      whose definition requires ''activation of receptor-interacting serine/threonine-protein kinase
      1 and/or 3 (RIPK1/3 ...) and ... critical dependence on mixed lineage kinase domain-like (MLKL)''.
      Parthanatos uses none of these: it runs PARP1 -> free PAR -> AIF release from mitochondria ->
      AIF nuclear translocation -> DNA cleavage, and is caspase- and RIPK-independent. The source annotation
      is mouse Adprs GO:0060546 IDA from PMID:30830864 (confirmed by QuickGO on Q8CG72), and both that
      paper and its predecessor PMID:24191052 describe the AIF/parthanatos axis explicitly. GO itself
      records the ambiguity rather than asserting the identity: the comment on GO:0097527 says PARP-dependent
      cell death ''is sometimes referred to as PARP-dependent cell death or parthanatos; it is still
      being debated if it constitutes an independent cell death modality''. The right move is therefore
      to step up one level to GO:0062099 negative regulation of programmed necrotic cell death - verified
      to be an ancestor of GO:0060546, so nothing is asserted that was not already implied - which drops
      the RIPK/MLKL commitment while keeping the regulated-necrosis claim. A GO request for an explicit
      parthanatos term is filed under proposed_new_terms. This row adds no independent evidence; it
      is the Compara mirror of the ISS row and must move with it.'
    proposed_replacement_terms:
    - id: GO:0062099
      label: negative regulation of programmed necrotic cell death
    supported_by:
    - reference_id: PMID:24191052
      supporting_text: A protective effect of ARH3 results from its lowering of PAR levels in the nucleus
        and the cytoplasm, thereby preventing release of AIF from mitochondria and its accumulation
        in the nucleus
    propagation_review:
      failure_modes:
      - ROLE_CONFLATION
      - CIRCULAR_PROPAGATION
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      source_entities:
      - comment: same mouse annotation as the ISS row, transferred a second time by a different pipeline
        source_id: UniProtKB:Q8CG72
        source_label: mouse Adprs (reviewed)
        source_status: CIRCULAR_OR_REDUNDANT
