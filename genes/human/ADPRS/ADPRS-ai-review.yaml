- term:
    id: GO:0071451
    label: cellular response to superoxide
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2140364
  - PANTHER:PTN008564042
  - UniProtKB:Q9NX46
  review:
    summary: 'The clade-wide propagation of a wrong ROS species: 33 gene products now carry ''cellular
      response to superoxide'' from a mouse H2O2 experiment.'
    action: MODIFY
    reason: 'The term names the wrong reactive oxygen species. Every experiment behind this term used
      HYDROGEN PEROXIDE, not superoxide. GO:0070301 cellular response to hydrogen peroxide and GO:0071451
      cellular response to superoxide are SIBLINGS under GO:0034614 cellular response to reactive oxygen
      species - verified by fetching both ancestor closures, neither contains the other - so this is
      not a too-general parent that quietly covers the data, it is a different chemical species. The
      defect originates upstream at the mouse MGI IMP (PMID:24191052) and has propagated to all 33 gene
      products under PANTHER:PTN008564042. The donor chain is traceable in full: mouse Adprs carries
      GO:0071451 by IMP from PMID:24191052 (Mashimo, Kato & Moss), whose abstract says PARG and ARH3
      ''regulate nuclear and cytoplasmic PAR degradation following hydrogen peroxide (H2O2) exposure''.
      The donor is the correct ortholog and its experiment is sound; only its term is wrong, and the
      IBA has copied it faithfully to the whole clade. Fixing the mouse MGI row would retract the error
      from all 33 gene products at once.'
    proposed_replacement_terms:
    - id: GO:0070301
      label: cellular response to hydrogen peroxide
    supported_by:
    - reference_id: PMID:24191052
      supporting_text: PARG and ARH3, acting in tandem, regulate nuclear and cytoplasmic PAR degradation
        following hydrogen peroxide (H2O2) exposure
    propagation_review:
      failure_modes:
