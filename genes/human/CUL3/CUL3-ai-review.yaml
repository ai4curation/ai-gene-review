id: Q13618
gene_symbol: CUL3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Cullin-3 is the central scaffold of CRL3 ubiquitin ligase complexes. Its N-terminal region
  recruits BTB/POZ-containing substrate adaptors, while its C-terminal region engages RBX1 and the ubiquitin-transfer
  machinery. These assemblies control protein abundance through ubiquitin-dependent proteasomal turnover
  and also generate non-degradative ubiquitin signals that regulate mitosis, membrane trafficking and
  other substrate-specific processes. CUL3 acts in nuclear and cytoplasmic compartments, with regulated
  Golgi, membrane and mitotic pools. Adaptor choice couples the same scaffold to targets involved in oxidative-stress
  responses, cell-cycle control, receptor and metabolic signaling, and transcriptional regulation. The
  displayed 768-residue product and two shorter splice products differ in the N-terminal adaptor-binding
  region: the 744-residue product lacks residues 1–24 and the 702-residue product lacks residues 23–88
  of the displayed sequence.'
