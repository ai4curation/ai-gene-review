      PAINT propagation from PTN000381277 seeded by yeast Cmr1 (SGD:S000002315),
      whose purified recombinant protein binds DNA and prefers UV-damaged DNA.
      WDR76 and Cmr1 are in the same PANTHER subfamily (PTHR14773:SF0) and are
      described as orthologues.
    action: ACCEPT
    reason: >-
      Human WDR76 sits inside the clade (PTHR14773:SF0) to which PAINT assigned
      DNA binding from the Cmr1 IDA [PMID:22367945], and Gallina et al. explicitly
      identify WDR76 as the Cmr1 orthologue [PMID:25817432]. Human WDR76 is
