- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IMP
  original_reference_id: PMID:27248496
  qualifier: involved_in
  review:
    summary: >-
      Gilmore et al. 2016 show WDR76 is rapidly recruited to UV-laser-induced DNA
      damage and interacts with PARP1 and XRCC5; Gallina et al. show WDR76
      relocalises to nuclear foci after MMS.
    action: KEEP_AS_NON_CORE
    reason: >-
      The human evidence is that WDR76 responds to DNA damage by relocalising
      (laser stripes [PMID:27248496]; MMS-induced foci [PMID:25817432]) and
      associates with DNA damage proteins. No loss-of-function DNA damage
      phenotype has been reported for human WDR76, and Gallina et al. explicitly
      leave open whether WDR76 directly participates in the replication stress
      response. The yeast orthologue Cmr1 has genetic roles in genome stability
      and checkpoint adaptation [PMID:25817432], supporting a conserved DNA damage
      response role. The broad term is about as specific as the human data allow,
      so it is kept, but as non-core pending functional data.
    supported_by:
    - reference_id: PMID:27248496
      supporting_text: WDR76 was recruited to laser induced DNA damage immediately after induction
    - reference_id: PMID:25817432
      supporting_text: Whether WDR76 directly participates in the replication stress response remains to be addressed.
