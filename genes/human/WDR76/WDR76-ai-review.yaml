gene_symbol: WDR76
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  WDR76 is a 626-residue nuclear protein with a C-terminal seven-bladed WD40
  beta-propeller (WD repeats 311-626) preceded by a largely disordered
  N-terminal region. It belongs to the WD repeat DDB2/WDR76 family (PANTHER
  PTHR14773:SF0) and is the vertebrate orthologue of budding yeast Cmr1 and
  plant DRS1. In human cells WDR76 associates with chromatin, co-localises with
  HP1 (CBX1/CBX5) heterochromatic puncta, is recruited within seconds to sites of
  UV-laser-induced DNA damage, and relocalises into nuclear foci under replication
  stress or proteasome inhibition. It co-purifies with histones H2A/H2B/H4, the
  DNA damage proteins PARP1 and Ku (XRCC5/XRCC6), the chromatin remodeler HELLS
  (LSH), the H3K4me3 reader SPIN1, the CCT/TRiC chaperonin (via its WD40 domain),
  and CUL4-DDB1. WDR76 also promotes polyubiquitination and proteasomal
  degradation of RAS proteins, acting as an adaptor that links RAS to a cullin E3
  ligase, and conversely protects HELLS from CRL4-DCAF8-mediated degradation.
  Direct DNA binding (with a preference for UV-damaged DNA) and a role in DNA
  damage checkpoint adaptation are established for the yeast orthologue Cmr1 and
  inferred, but not yet tested, for human WDR76; the mouse orthologue was
  identified as a 5-hydroxymethylcytosine reader in a proteomic screen.
