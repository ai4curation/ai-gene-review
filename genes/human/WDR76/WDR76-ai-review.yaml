- description: >-
    Adaptor that binds RAS proteins and links them to a cullin-RING E3 ubiquitin
    ligase, promoting RAS polyubiquitination and proteasomal degradation
    (experimentally shown in human cells and mice). The cullin partner (CUL4A vs
    CUL1) is disputed, and WDR76 can also oppose CRL4-DCAF8-mediated degradation
    of HELLS.
