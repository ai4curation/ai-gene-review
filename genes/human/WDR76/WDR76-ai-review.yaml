- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IMP
  original_reference_id: PMID:30655611
  review:
    summary: WDR76 binds HRAS/KRAS/NRAS, forms a complex with CUL4A and RAS, and promotes RAS polyubiquitination
      and proteasomal degradation; knockdown raises and overexpression lowers RAS protein in multiple
      human cancer cell lines without changing RAS mRNA.
    action: NEW
    reason: 'Absent from GOA although reproduced by two human cell-line studies (liver and colorectal
      cancer cells) plus Wdr76-/- mouse cells. Participation test: WDR76 is the substrate-binding WD40
      subunit that links RAS to the CUL4 ligase, so it performs the substrate-selection step rather than
      being acted upon. Comparator: the CRL4 substrate receptor DCAF1 carries this term by IDA, while
      DTL, DCAF8 and DDB2 do not (QuickGO, 2026-10-20), so the convention is mixed rather than a systematic
      absence. Caveats: ubiquitination was not reconstituted in vitro, DDB1 binding is cited rather than
      shown in these papers, and WDR76 can also antagonise CRL4-DCAF8 substrate degradation (LSH/HELLS).
      Human-specific finding; PAINT did not place it at the WDR76/CMR1/DRS1 node, so it must not be transferred
      to yeast or plant members.'
    supported_by:
    - &id010
      reference_id: PMID:30655611
      supporting_text: The presented studies identify and characterize a RAS binding protein WDR76 which
        plays a role as an E3 linker protein and mediates polyubiquitination-dependent degradation of
        RAS
    - reference_id: PMID:30655611
      supporting_text: Furthermore, we also confirmed the complex formation between WDR76/CUL4A and RAS
    - &id007
