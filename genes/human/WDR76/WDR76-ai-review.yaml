gene_symbol: WDR76
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'WDR76 is a nuclear WD40-repeat protein of the DDB2/WDR76 family (PANTHER PTHR14773), the
  vertebrate orthologue of budding yeast Cmr1. It has an N-terminal disordered region and a C-terminal
  seven-bladed WD40 domain related to the damaged-DNA-binding protein DDB2. In human cells WDR76 is diffusely
  nuclear, forms puncta that co-localize with the HP1 homologs CBX1 and CBX5, relocalizes to nuclear foci
  after alkylation damage or proteasome inhibition, and is recruited within a second to sites of laser-induced
  DNA damage independently of PARP activity. It associates with core histones, PARP1, the Ku heterodimer,
  HP1 proteins, the H3K4me3 reader SPIN1, HELLS, gigaxonin and the CCT chaperonin. WDR76 also interfaces
  with CUL4-DDB1 RING ubiquitin ligases: it binds HRAS, KRAS and NRAS and promotes their polyubiquitination
  and proteasomal degradation, which restrains RAS signalling in liver, colorectal and adipose models,
  and it can conversely protect the chromatin remodeler LSH/HELLS from CRL4-DCAF8-mediated degradation.
  By homology to yeast Cmr1, which binds UV-damaged DNA and promotes DNA-damage checkpoint adaptation,
  WDR76 is inferred to bind DNA, but direct DNA binding and a role in checkpoint control have not been
  shown for the human protein.'
