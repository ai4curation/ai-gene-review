suggested_questions:
- question: Does purified human WDR76 bind DNA directly, and does it prefer damaged DNA (as yeast Cmr1
    does) or 5-hydroxymethylcytosine (as suggested by the mouse proteomic screen)?
- question: Does WDR76 bind DDB1 directly through a DDB1-binding WD40 motif, and is it a bona fide CRL4
    substrate receptor for RAS or an accessory factor, given that it inhibits CRL4-DCAF8 activity on LSH?
- question: What lesion type and recognition mechanism drive the PARP-independent recruitment of WDR76
    to laser-induced damage, and does WDR76 loss affect repair, checkpoint recovery or survival in human
    cells?
suggested_experiments:
- description: EMSA or fluorescence anisotropy with purified human WDR76 (full length and WD40 domain)
    on undamaged, UV-damaged and 5hmC-containing DNA.
- description: In vitro reconstitution of CRL4A-DDB1-WDR76 ubiquitination of HRAS, with WDR76 DDB1-binding
    mutants as controls.
- description: WDR76 knockout human cells assayed for checkpoint recovery (CHK1/CHK2 dephosphorylation
    kinetics) and survival after MMS, UV and camptothecin.
