core_functions:
- description: Nuclear chromatin-associated WD40 protein that is recruited within seconds to sites of
    DNA damage (PARP-independent) and to heterochromatic puncta with HP1 proteins; by inheritance from
    yeast Cmr1 it is inferred to bind DNA. The functional consequence of its damage-site recruitment in
    human cells is not established.
