      5-hydroxymethylcytosine-DNA reader (UniProt FUNCTION, by similarity), all
      consistent with a conserved DNA-binding activity. No target-specific
      evidence of loss exists. Note that direct DNA binding has not been shown
      with purified human protein; this is an inferred core activity. PAINT did
      not propagate a more specific damaged-DNA-binding term, and I do not add one.
