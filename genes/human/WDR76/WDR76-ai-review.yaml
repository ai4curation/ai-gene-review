suggested_questions:
- question: Does purified human WDR76 bind DNA directly, and does it prefer UV-damaged DNA (as yeast Cmr1) or 5-hydroxymethylcytosine-containing DNA (as reported for the mouse orthologue)?
- question: Is WDR76 a genuine DDB1-binding substrate receptor (DCAF) of CRL4, a CUL1 adaptor, or a non-catalytic modulator of cullin ligases, given conflicting reports for RAS and HELLS?
- question: Does loss of WDR76 in human cells impair DNA damage checkpoint recovery/adaptation, as cmr1 deletion does in yeast?
suggested_experiments:
- description: EMSA or fluorescence anisotropy with purified human WDR76 (full length and WD40 domain) on undamaged, UV-irradiated and 5hmC-modified DNA to test the inferred DNA-binding activity.
- description: In vitro ubiquitination reconstitution of RAS with purified WDR76 and CRL4 (DDB1-CUL4A-RBX1) versus CRL1 components to determine which ligase WDR76 serves as a substrate adaptor for.
- description: WDR76 knockout in human cells followed by checkpoint recovery assays (CHK1/CHK2 dephosphorylation kinetics after HU/MMS release) and laser microirradiation recruitment of PARP1 and Ku to test a functional DNA damage response role.
