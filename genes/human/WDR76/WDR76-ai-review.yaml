- term:
    id: GO:2000001
    label: regulation of DNA damage checkpoint
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000381277
  - SGD:S000002315
  review:
    summary: >-
      PAINT propagation from PTN000381277 seeded by yeast Cmr1, whose deletion
      causes a DNA-damage checkpoint adaptation defect with persistent Rad53
      phosphorylation (Gallina et al. 2015).
    action: KEEP_AS_NON_CORE
    reason: >-
      WDR76 is inside the PTHR14773:SF0 clade to which PAINT assigned this
      process, and there is no evidence of loss in vertebrates, so the inheritance
      claim is accepted. It is, however, purely inferred for human: the yeast
      evidence is genetic (cmr1 deletion impairs checkpoint adaptation through the
      INQ compartment) [PMID:25817432], PAINT deliberately did not propagate the
      yeast INQ/nuclear periphery localisation, and no checkpoint assay has been
      done for human WDR76. Kept as non-core until tested in vertebrate cells.
    supported_by:
    - reference_id: PMID:25817432
      supporting_text: Taken together, these data indicate that INQ promotes DNA-damage checkpoint adaptation through attenuation of Rad53 phosphorylation.
- term:
    id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:30655611
  review:
    summary: >-
      WDR76 binds HRAS and promotes RAS polyubiquitination and proteasome-dependent
      degradation in human liver cancer cells; WDR76 knockdown raises RAS and
      Wdr76-/- mouse tissues have elevated Ras. Independently, Wang et al. 2025
      report WDR76 couples with a cullin (CUL1) E3 ligase to degrade KRAS.
    action: NEW
    reason: >-
      Participation test: WDR76 is proposed to do part of the work of the process,
      as the substrate-recruiting adaptor ("E3 linker") that brings RAS to a
      cullin-RING ligase; it binds the substrate and its overexpression increases
      RAS polyubiquitination and shortens RAS half-life, which a proteasome
      inhibitor reverses [PMID:30655611]. Two independent laboratories support
      the process-level claim [PMID:30655611; PMID:40889735], although they
      disagree on the cullin (CUL4A vs CUL1), so no complex term is added.
      Comparator check: other WD40 substrate-recruiting adaptors of cullin-RING
      ligases, DTL (Q9NZJ0) and DCAF1 (Q9Y4B6), carry this term in GOA. WDR76 is
      not an obligate CRL4 receptor: it can also antagonise CRL4-DCAF8-mediated
      HELLS degradation [PMID:33288900]. Organismal phenotypes of Wdr76-/- mice
      (tumour susceptibility, obesity resistance) are not annotated.
    supported_by:
    - reference_id: PMID:30655611
      supporting_text: WDR76 plays a role as an E3 linker protein and mediates the polyubiquitination-dependent degradation of RAS.
    - reference_id: PMID:30655611
      supporting_text: The proteasome inhibitor N-acetyl-leucyl-leucyl-norleucinal (ALLN) reversed the WDR76-associated RAS reduction
    - reference_id: PMID:40889735
      supporting_text: WDR76 couples with CUL1 E3 ligase, rather than CUL4, to promote the degradation of both wild-type and mutant KRAS
