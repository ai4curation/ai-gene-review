suggested_questions:
- question: How do the three natural DNMT1 products differ in recruitment, regulation and CpG methylation
    under matched expression conditions?
- question: What is the direct binding and activation contribution of H3K14 ubiquitination, compared with
    the structurally resolved cooperative K18/K23 module?
- question: Does the MitoCoP DNMT1 protein-group signal reflect a reproducible mitochondrial pool, and
    which natural product and intramitochondrial compartment account for it?
suggested_experiments:
- description: Compare accession-matched DNMT1 products using matched expression, compartment-resolved
    localization and methylation assays on defined unmethylated and hemimethylated CpG substrates.
- description: Test purified human DNMT1 against separately defined H3K14ub, H3K18ub, H3K23ub and paired-mark
    reagents, separating binding from catalytic activation and preserving linkage chemistry controls.
- description: Validate the mitochondrial-associated DNMT1 signal with endogenous isoform-resolving peptides,
    fraction-purity and protease-protection controls, without presupposing mitochondrial DNA methylation
    activity.
status: DRAFT
alternative_products:
- name: '1'
  id: P26358-1
  description: The canonical product is 1616 amino acids. Human full-length and engineered-fragment studies
    support maintenance methylation and regulated chromatin recruitment; fragment assays do not identify
    every natural splice product.
- name: 2 (Dnmt1b)
  id: P26358-2
  sequence_note: VSP_005618
  description: This 1632-amino-acid product replaces canonical P149 with a 17-residue sequence in the
    amino-terminal regulatory region. It retains the downstream catalytic and chromatin-regulatory domains;
    the effect of this splice choice on activity and regulation is not established by the studies assessed
    here.
- name: '3'
  id: P26358-3
  sequence_note: VSP_005617
  description: This 1280-amino-acid product lacks canonical residues 1–336 and retains downstream regulatory/catalytic
    regions. It is not identical to engineered 351–1600 or 351–1616 study constructs, and no equivalent
    localization or activity across natural products is inferred.
