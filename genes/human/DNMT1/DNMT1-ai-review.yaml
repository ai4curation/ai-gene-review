id: P26358
gene_symbol: DNMT1
aliases:
- DNMT
- MCMT
- CXXC9
- AIM
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNMT1 is a regulated DNA methyltransferase that uses S-adenosylmethionine to methylate cytosine
  in CpG dinucleotides. It preferentially copies methylation onto newly synthesized DNA opposite methylated
  template strands, helping preserve epigenetic patterns and transcriptional silencing through cell division.
  Its RFTS regulatory module recognizes paired ubiquitin marks on histone H3, while a CXXC zinc-binding
  domain and BAH domains coordinate DNA and chromatin engagement with the catalytic domain. DNMT1 acts
  predominantly in the nucleus and is recruited to replication-associated and heterochromatic sites. Its
  abundance, activity and recruitment are regulated by protein interactions and post-translational modifications.
  Alternative transcripts encode three curated protein products with changes in the amino-terminal regulatory
  region; functional equivalence across these products is not established. Pathogenic DNMT1 variants cause
  neurological syndromes that can include sensory neuropathy, deafness, dementia or ataxia.
