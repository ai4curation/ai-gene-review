- id: PMID:20573698
  title: Kcnq1ot1 noncoding RNA mediates transcriptional gene silencing by interacting with Dnmt1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic publisher-indexed full original Methods/Results were read despite an abstract-only
      normal cache and direct PDF access failure. Native RIP supports Kcnq1ot1 association; the authors
      do not exclude protein-mediated recruitment.
  findings:
  - statement: Mouse Dnmt1 associates with Kcnq1ot1 in native RNA immunoprecipitation and is recruited
      to imprinted chromatin.
- id: PMID:21980460
  title: Gestational exposure to low dose bisphenol A alters social behavior in juvenile mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original Methods/Results were read. Gestational BPA and embryonic mouse-brain
      expression measurements include Dnmt1; they do not perturb Dnmt1 to establish its own response function.
  findings:
  - statement: Prenatal BPA exposure is associated with sex-dependent embryonic brain expression measurements
      and later behavior; this does not demonstrate a human DNMT1 bisphenol-response activity.
- id: PMID:25686699
  title: LncRNA Dum interacts with Dnmts to regulate Dppa2 expression during myogenic differentiation
    and muscle regeneration.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Separately recovered full PMC original Results/Methods were read. Mouse C2C12/repair-context
      RIP and nuclear-extract RNA pull-down are positive, but not purified direct RNA binding.
  findings:
  - statement: Mouse Dnmt1 associates with the lncRNA Dum in the reported myogenesis and regeneration
