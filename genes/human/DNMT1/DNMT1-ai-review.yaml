- id: PMID:10615135
  title: DNA methyltransferase Dnmt1 associates with histone deacetylase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal-cache abstract and mouse IDA source record were checked; full original
      was unavailable. The abstract reports Dnmt1-associated HDAC activity and repression, not an isolated
      chromatin-assembly reaction.
  findings:
  - statement: Dnmt1 associates with histone-deacetylase activity and links DNA methylation to transcriptional
      repression.
- id: PMID:15220328
  title: Human DNA methyltransferase 1 is required for maintenance of the histone H3 modification pattern.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine institutional full original Methods/Results were read. Human HCT116 DNMT1-deficient
      cells and mouse Dnmt1 rescue are distinct. Downstream chromatin changes do not isolate catalytic
      dependence; cancer-context nuclear-morphology limits are explicit.
  findings:
  - statement: Loss/rescue experiments connect DNMT1 to repetitive-DNA methylation, H3/HP1 organization
      and constitutive heterochromatin.
core_functions:
- description: Methylates cytosine at CpG sites using S-adenosyl-L-methionine, preferentially restoring
    methylation on newly synthesized DNA opposite a methylated template strand. Intramolecular autoinhibition
    and recognition of ubiquitinated histone H3 help couple catalysis to appropriate substrates. By performing
    DNA methylation, DNMT1 also contributes to CpG-island silencing and DNA-methylation-dependent constitutive
    heterochromatin formation. The heterochromatin phenotype does not isolate catalytic from scaffolding
    effects.
