    label: anti-Mullerian hormone receptor signaling pathway
  - id: GO:0001880
    label: Mullerian duct regression
  supported_by:
  - reference_id: PMID:10854429
    supporting_text: a ligand, anti-Müllerian hormone, gains access to a shared type I receptor and Smad1
      system through a highly restricted type II receptor
  - reference_id: PMID:7493017
    supporting_text: the AMH signalling machinery is remarkably simple, consisting of one ligand and one
      type II receptor
- description: Catalytic transmembrane receptor serine/threonine kinase activity that phosphorylates type
    I receptors.
  molecular_function:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
