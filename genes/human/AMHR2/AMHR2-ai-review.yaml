- term:
    id: GO:0005026
    label: transforming growth factor beta receptor activity, type II
  evidence_type: IDA
  original_reference_id: PMID:10854429
  qualifier: enables
  review:
    summary: Type II TGF-beta receptor activity. AMHR2 is a type II receptor, but its ligand is AMH, not
      TGF-beta.
    action: MODIFY
    reason: The GO definition of this term requires binding to transforming growth factor beta. AMHR2
      is a dedicated receptor for AMH and does not bind TGF-beta. The type II mechanism (ligand-dependent
      engagement and activation of a type I receptor) is well captured by the specific anti-Mullerian
      hormone receptor activity, together with transmembrane receptor protein serine/threonine kinase
      activity. Both terms are already annotated.
    proposed_replacement_terms:
    - id: GO:1990272
      label: anti-Mullerian hormone receptor activity
    - id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
    supported_by:
    - reference_id: PMID:10854429
      supporting_text: the bone morphogenetic protein type IB receptor was the only cloned type I receptor
        interacting in a ligand-dependent manner with this type II receptor
    - reference_id: PMID:34155118
      supporting_text: AMH is a member of the transforming growth factor beta (TGF-β) family, which has
        evolved to signal through its own dedicated type II receptor, AMH receptor type II (AMHR2).
