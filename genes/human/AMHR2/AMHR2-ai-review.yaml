  review:
    summary: Plasma membrane. AMHR2 is a single-pass type I receptor with its ligand-binding domain outside
      the cell.
    action: ACCEPT
    reason: AMHR2 has a signal peptide, an extracellular ligand-binding domain, one transmembrane helix
      and a cytoplasmic kinase. A monoclonal antibody against the ectodomain detects it by FACS on transfected
      CHO cells. AMH binds AMHRII expressed on COS cells. A PMDS truncation that cuts the receptor after
      the transmembrane domain is dominant negative when overexpressed, which fits a surface receptor.
    supported_by:
    - reference_id: PMID:14750901
      supporting_text: We selected a high-affinity monoclonal antibody, mAb 12G4, specific for human AMHR-II
        (hAMHR-II), by FACS analysis
    - reference_id: PMID:20861221
      supporting_text: after binding of the AMH noncovalent complex to AMHRII expressed on COS cells
    - reference_id: Reactome:R-HSA-8858346
      supporting_text: Anti-Müllerian hormone (AMH), also known as Müllerian inhibiting substance
