core_functions:
- description: Cell-surface type II receptor serine/threonine kinase for AMH. AMH binding to the extracellular
    domain recruits and transphosphorylates BMP type I receptors (ACVR1/BMPR1A/BMPR1B), activating SMAD1/5/8
    signaling.
