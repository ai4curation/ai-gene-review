id: Q16671
gene_symbol: AMHR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMHR2 is the type II receptor for anti-Mullerian hormone (AMH, also called Mullerian inhibiting
  substance). It is a single-pass type I transmembrane serine/threonine receptor kinase of the TGF-beta
  receptor family, located in the plasma membrane. Its N-terminal three-finger-toxin-fold extracellular
  domain is exposed at the cell surface and binds mature AMH with high specificity. A cytoplasmic kinase
  domain then phosphorylates and activates the BMP type I receptors ACVR1, BMPR1A or BMPR1B, which in
  turn activate SMAD1/5/8. AMHR2 is expressed in fetal Mullerian duct mesenchyme, Sertoli, Leydig and
  granulosa cells. AMH-AMHR2 signaling causes regression of the Mullerian ducts in male fetuses and restrains
  follicle recruitment in the ovary. Loss-of-function mutations cause persistent Mullerian duct syndrome
  type 2.
