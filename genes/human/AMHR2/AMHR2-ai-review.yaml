    supporting_text: a missense mutation in the substrate-binding site of the kinase domain
suggested_questions:
- question: Which type I receptor (ACVR1, BMPR1A or BMPR1B) is the physiological AMHR2 partner in Mullerian
    duct mesenchyme versus granulosa cells?
suggested_experiments:
- description: Quantify cell-surface AMHR2 by surface biotinylation in granulosa cells and test whether
    PMDS missense variants alter surface delivery versus kinase activity.
