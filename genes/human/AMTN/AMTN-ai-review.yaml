- term:
    id: GO:0005911
    label: cell-cell junction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1918671
  - PANTHER:PTN002198645
  - RGD:1592356
  review:
    summary: Cell-cell junction, inherited from rodent annotations that rest on localization to the junctional
      epithelium's basal lamina. A tissue-name conflation; marked as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source annotation comes from rodent immunolocalization to the internal basal lamina of
      the junctional epithelium [PMID:16787391 "Intense Amtn protein expression was also detected in the
      internal basal lamina of junctional epithelium in molars."]. The junctional epithelium is the gingival
      tissue that attaches to the tooth; the basal lamina it forms against the enamel is an extracellular
      matrix, not a junction between cells. GO:0005911 cell-cell junction is a connection between cells,
      so the annotation conflates the tissue's name with the cellular component. Recombinant AMTN does
      not even mediate cell attachment [PMID:21912076 "Recombinant AMTN protein did not mediate cell attachment
      in vitro."], and the dentogingival attachment is intact in Amtn-null mice [PMID:25715379 "The integrity
      of the dentogingival attachment at the junctional epithelium appeared unaffected by AMTN deficiency."].
      AMTN's location there is captured by the basement membrane and extracellular matrix rows. The rodent
      IDA rests on an abstract-only record, so the source is flagged rather than overruled.
    supported_by:
    - reference_id: PMID:16787391
      supporting_text: Intense Amtn protein expression was also detected in the internal basal lamina
        of junctional epithelium in molars.
    - reference_id: PMID:21912076
      supporting_text: Recombinant AMTN protein did not mediate cell attachment in vitro.
    - reference_id: PMID:16787391
      supporting_text: immunofluorescence localization within the rat and mouse mandibles revealed Amtn
        localized to the basal lamina of maturation stage ameloblasts of incisors and unerupted molars.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1918671
        source_status: SOURCE_BAD
        comment: Mouse Amtn; its cell-cell junction IDA (PMID:16787391) reflects the junctional epithelium's
          basal lamina.
      - source_id: RGD:1592356
        source_status: SOURCE_BAD
        comment: Rat Amtn; same source paper.
