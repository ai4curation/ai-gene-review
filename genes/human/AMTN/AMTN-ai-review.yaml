existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No molecular function data. Superseded by direct evidence of hydroxyapatite binding, added
      as a NEW row; the ND placeholder is removed.
    action: REMOVE
    reason: Recombinant human AMTN binds hydroxyapatite [PMID:25407797 "The binding affinity of rh-AMTN
      to HA was found to be comparable to that of amelogenin, the major protein of the forming enamel
      matrix."] and promotes its precipitation, through a phosphorylatable SSEEL motif [PMID:25407797
      "Site-specific mutagenesis of the potential serine phosphorylation motif SSEEL reduced the in vitro
      mineral precipitation to less than 25%, revealing that this motif is important for the HA mineralizing
      function of the protein."]; it directly influences biomineralization [PMID:25407797 "These findings
      demonstrate that AMTN has a direct influence on biomineralization by promoting HA mineralization"].
      In vivo, Amtn-null mice have defective surface enamel [PMID:25715379 "These observations indicate
      that AMTN plays a subtle yet critical role in enamel biomineralization, particularly during the
      establishment of the outer and surface enamel layers."], and a human AMTN deletion lowers enamel
      mineral density [PMID:27412008 "Exfoliated primary teeth from an affected family member had enamel
      that was of a lower mineral density compared to control enamel"]. The ND row predates this evidence;
      the activity is recorded by the NEW GO:0046848 row.
    supported_by:
    - reference_id: PMID:25407797
      supporting_text: The binding affinity of rh-AMTN to HA was found to be comparable to that of amelogenin,
        the major protein of the forming enamel matrix.
    - reference_id: PMID:25407797
      supporting_text: These findings demonstrate that AMTN has a direct influence on biomineralization
        by promoting HA mineralization
