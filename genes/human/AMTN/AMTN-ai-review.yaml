id: Q6UX39
gene_symbol: AMTN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMTN (amelotin) is a small secreted, O-glycosylated matrix protein made by maturation-stage
  ameloblasts. It sits in the specialized basal lamina between ameloblasts and the maturing enamel, and
  in the internal basal lamina by which the gingival junctional epithelium attaches to the tooth, where
  it associates with ODAM and SCPPPQ1. AMTN binds hydroxyapatite and promotes its nucleation and growth
  through a phosphorylatable SSEEL motif, driving formation of the dense aprismatic surface layer of enamel.
  Mice lacking it have hypomineralized enamel, and a deletion in AMTN causes autosomal dominant hypomineralized
  amelogenesis imperfecta in humans.
