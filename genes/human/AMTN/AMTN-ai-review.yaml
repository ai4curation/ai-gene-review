- id: PMID:25407797
  title: The enamel protein amelotin is a promoter of hydroxyapatite mineralization.
  findings:
  - statement: AMTN associates with HA crystals.
    supporting_text: Colloidal gold immunolabeling of AMTN in the mineral deposits showed that protein
      molecules were associated with HA crystals.
  - statement: Its HA affinity is comparable to amelogenin.
    supporting_text: The binding affinity of rh-AMTN to HA was found to be comparable to that of amelogenin,
      the major protein of the forming enamel matrix.
  - statement: AMTN promotes HA mineralization.
    supporting_text: These findings demonstrate that AMTN has a direct influence on biomineralization
      by promoting HA mineralization
  - statement: The SSEEL motif is required.
    supporting_text: Site-specific mutagenesis of the potential serine phosphorylation motif SSEEL reduced
      the in vitro mineral precipitation to less than 25%, revealing that this motif is important for
      the HA mineralizing function of the protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Recombinant human AMTN; source of the IDA mineralization row and the
      NEW hydroxyapatite binding row.
- id: PMID:16787391
  title: Cloning of rat amelotin and localization of the protein to the basal lamina of maturation stage
    ameloblasts and junctional epithelium.
  findings:
  - statement: Amtn is in the basal lamina of maturation-stage ameloblasts.
    supporting_text: immunofluorescence localization within the rat and mouse mandibles revealed Amtn
      localized to the basal lamina of maturation stage ameloblasts of incisors and unerupted molars.
  - statement: Amtn is in the internal basal lamina of junctional epithelium.
    supporting_text: Intense Amtn protein expression was also detected in the internal basal lamina of
      junctional epithelium in molars.
  - statement: Secreted Amtn is O-glycosylated.
    supporting_text: Transient transfection experiments in HEK-293 cells (human embryonic kidney cells)
      showed that secreted Amtn is post-translationally modified possibly through O-linked oligosaccharides
      on threonine residues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Rat and mouse; source of the rodent IDAs behind the human location rows,
      including the cell-cell junction rows that conflate junctional epithelium with cell-cell junction.
- id: PMID:16304441
  title: Amelotin--a Novel Secreted, Ameloblast-specific Protein.
  findings:
  - statement: Amelotin is ameloblast-specific.
    supporting_text: Expression of amelotin mRNA was restricted to maturation-stage ameloblasts in developing
      murine molars and incisors.
  - statement: Amelotin is secreted.
    supporting_text: Amelotin protein was efficiently secreted from transfected cells in culture.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Mouse discovery paper.
- id: PMID:27412008
  title: Deletion of amelotin exons 3-6 is associated with amelogenesis imperfecta.
  findings:
  - statement: An AMTN deletion causes dominant hypomineralized amelogenesis imperfecta.
    supporting_text: This study demonstrates for the first time that AMTN mutations cause non-syndromic
      human AI and explores the human phenotype, comparing it with that of mice with disrupted Amtn function.
  - statement: Affected enamel has lower mineral density.
    supporting_text: Exfoliated primary teeth from an affected family member had enamel that was of a
      lower mineral density compared to control enamel
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human genetic evidence for the mineralization role.
- id: PMID:25715379
  title: Enamel Hypomineralization and Structural Defects in Amelotin-deficient Mice.
  findings:
  - statement: Amtn-null mice have defective outer and surface enamel.
    supporting_text: These observations indicate that AMTN plays a subtle yet critical role in enamel
      biomineralization, particularly during the establishment of the outer and surface enamel layers.
  - statement: The dentogingival attachment is unaffected.
    supporting_text: The integrity of the dentogingival attachment at the junctional epithelium appeared
      unaffected by AMTN deficiency.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. In vivo support for the mineralization rows; also argues against a cell-junction
      role.
- id: PMID:21912076
  title: Comparative temporospatial expression profiling of murine amelotin protein during amelogenesis.
  findings:
  - statement: Recombinant AMTN does not mediate cell attachment.
    supporting_text: Recombinant AMTN protein did not mediate cell attachment in vitro.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Argues against a cell-adhesion or junction function.
- id: PMID:25789606
  title: A secretory kinase complex regulates extracellular protein phosphorylation.
  findings:
  - statement: FAM20A/FAM20C phosphorylate enamel matrix proteins.
    supporting_text: Here we show that Fam20A potentiates Fam20C kinase activity and promotes the phosphorylation
      of enamel matrix proteins in vitro and in cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Source of the FAM20C binding row; AMTN is a substrate.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI interactome.
    supporting_text: Here we present a human 'all-by-all' reference interactome map of human binary protein
      interactions, or 'HuRI'.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Source of the BAG6 binding row.
- id: file:genes/human/AMTN/AMTN-deep-research-affinage.md
  title: Affinage mechanistic annotation for AMTN (human)
  findings:
  - statement: Affinage summarizes AMTN as an HA-binding mineralization promoter.
    supporting_text: AMTN binds hydroxyapatite and directly promotes mineral nucleation and growth through
      a phosphorylatable SSEEL motif
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Trust gates clear; consistent with the cached papers. Gingival-inflammation and RPE
      findings were not used for annotation.
