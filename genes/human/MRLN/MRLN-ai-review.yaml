    supported_by:
    - reference_id: PMID:25640239
      supporting_text: Strikingly, MLN KO myoblasts showed significantly increased SR Ca2+ levels
        compared to WT myoblasts, measured as peak SR Ca2+ release (Figure 6G).
    - reference_id: PMID:35917173
      supporting_text: Whereas MLN overexpression in healthy myotubes reduced SR calcium content
        (Supplemental Figure 2, I and J), shRNA against MLN improved SR calcium content in DMD
        immortalized myotubes (Supplemental Figure 2, K and L).
