- term:
    id: GO:1902081
    label: negative regulation of calcium ion import into sarcoplasmic reticulum
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9CV60
  review:
    summary: Transfer of the mouse IDA/IMP annotations from PMID:25640239. MLN overexpression
      lowers SR Ca2+, and MLN knockout raises SR Ca2+ in myoblasts. In human cells, MLN
      overexpression reduces and MLN shRNA restores SR calcium content in myotubes
      (PMID:35917173).
    action: ACCEPT
    reason: >-
      MLN itself performs the regulatory step, by binding the pump that imports calcium into
      the SR and inhibiting it, so this is direct participation in the regulation and not a
      downstream effect. It is the process-level counterpart of the ATPase inhibitor
      activity and is the most informative BP for this gene.
    additional_reference_ids:
