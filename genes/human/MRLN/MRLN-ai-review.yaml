  supporting_entities:
  - UniProtKB:Q9CV60
  - ensembl:ENSMUSP00000150523
  review:
    summary: Ensembl Compara transfer from mouse myoregulin (Q9CV60), whose UniProt IDA
      annotation for this term rests on SERCA Ca-ATPase assays in PMID:25640239. The human
      and mouse peptides are 1:1 orthologs with the SERCA-binding residues conserved, and
      knockdown of endogenous MLN in human cells increases SERCA activity.
    action: MODIFY
    reason: >-
      The inhibitory activity is real, but the term is too general and a loose fit. MLN
      inhibits one specific target, the SERCA calcium pump, and in current GO the P-type
      calcium transporter activity of SERCA (GO:0005388) is classified under transporter
      and ATP-dependent activity rather than catalytic activity, so "reduces a catalytic
      activity" describes it only indirectly. GO:0042030 ATPase inhibitor activity is
      directly supported by the ATPase-activity assays with MLN, and is the term curators
      use for the paralogous regulin PLN (IDA and IBA in human; the MF of Pln in the mouse
      GO-CAM model 62f58d8800005094).
    proposed_replacement_terms:
    - id: GO:0042030
      label: ATPase inhibitor activity
    additional_reference_ids:
    - PMID:34445594
    supported_by:
    - reference_id: PMID:25640239
      supporting_text: Together, these findings demonstrate that MLN inhibits SERCA pump
        kinetics similar to PLN and SLN.
    - reference_id: PMID:34445594
      supporting_text: Using a membrane reconstitution system, we have found that MLN selectively
        alters the Vmax of SERCA with no effect on the KCa of SERCA (Figure 5B and Table 1).
