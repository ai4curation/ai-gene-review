- id: PMID:25640239
  title: A micropeptide encoded by a putative long noncoding RNA regulates muscle performance.
  findings:
  - statement: A 46-aa conserved micropeptide (MLN) is translated from the human LINC00948 /
      mouse AK009351 transcript.
    supporting_text: we identified a vertebrate RNA transcript annotated as a lncRNA (LINC00948
      in humans and AK009351 in mice)
  - statement: MLN co-immunoprecipitates with SERCA1, SERCA2a and SERCA2b, and hydrophobic
      TM residues shared with PLN/SLN are required.
    supporting_text: the HA-MLN fusion protein formed a stable complex with SERCA1 (skeletal
      muscle-specific), SERCA2a (cardiac and slow skeletal muscle-specific) and SERCA2b (ubiquitous)
      isoforms
  - statement: MLN knockout mice have enhanced SR Ca2+ handling and exercise performance.
    supporting_text: Remarkably, MLN KO mice ran an average time of ∼31% longer than their
      WT littermates, representing a 55% increase in running distance (Figure 6E and 6F).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper (Cell 2015;160:595-606), cited in the UniProt entry. Full
      text cached. All functional experiments are on the mouse peptide or in mouse cells and
      animals. This is the source of the mouse IDA/IMP annotations transferred by ISS to human.
- id: PMID:27923914
  title: Widespread control of calcium signaling by a family of SERCA-inhibiting micropeptides.
  findings:
  - statement: MLN, PLN, SLN, ALN and ELN form a family of SERCA-inhibiting micropeptides with
      isoform-matched expression patterns.
    supporting_text: We note a remarkable overlap in the distribution of individual micropeptides
      with major SERCA isoforms (SERCA1 with MLN, SERCA2a with PLN, SERCA2b with ALN, and SERCA3
      with ELN)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Sci Signal 2016. Source of the mouse IDA for GO:1901895 and GO:0005789. The
      work is primarily about ALN/ELN, with MLN included as a comparator.
- id: PMID:31449798
  title: Newly Discovered Micropeptide Regulators of SERCA Form Oligomers but Bind to the Pump
    as Monomers.
  findings:
  - statement: Regulins including MLN homo-oligomerise but bind SERCA as monomers.
    supporting_text: it was the monomeric form of all micropeptides that interacted with SERCA
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: J Mol Biol 2019. FRET and co-IP in heterologous cells. Supports the UniProt
      SUBUNIT text.
- id: PMID:34445594
  title: 'Nothing Regular about the Regulins: Distinct Functional Properties of SERCA Transmembrane
    Peptide Regulatory Subunits.'
  findings:
  - statement: In co-reconstitution with SERCA1a, MLN lowers Vmax without altering KCa.
    supporting_text: Using a membrane reconstitution system, we have found that MLN selectively
      alters the Vmax of SERCA with no effect on the KCa of SERCA (Figure 5B and Table 1).
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Int J Mol Sci 2021, a review containing new primary data. The finding that
      inhibition works through Vmax conflicts with the KCa mechanism reported in PMID:25640239
      and stated in UniProt. Both agree that MLN inhibits SERCA. The synthetic MLN peptide's
      species is not stated in the cached text (the MD models were human).
- id: PMID:37014032
  title: Functional Role of an Unusual Transmembrane Acidic Residue in the Calcium Pump Regulator
    Myoregulin.
  findings:
  - statement: The TM residue Asp35 (conserved in human) controls SERCA inhibition by MLN.
    supporting_text: Instead, Asp35 controls SERCA inhibition by populating a bound-like orientation
      of MLN.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Biochemistry 2023. Simulations plus ATPase assays of the co-reconstituted
      protein.
- id: PMID:37918638
  title: 'Replacement of Lys27 by asparagine in the SERCA regulator myoregulin: A Ca(2+) affinity
    modulator or a catalytic activity switch?'
  findings:
  - statement: MLN inhibits SERCA1a Vmax; a K27N substitution increases inhibitory potency.
    supporting_text: replacing Lys27 with Asn significantly enhances the inhibitory potency
      of MLN
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: BBA Mol Cell Res 2024. Rabbit SERCA1a with synthetic MLN.
- id: PMID:35917173
  title: NR1D1 controls skeletal muscle calcium homeostasis through myoregulin repression.
  findings:
  - statement: In human immortalized myotubes, MLN overexpression lowers and MLN shRNA restores
      SR Ca2+ content; NR1D1 represses MLN transcription.
    supporting_text: Whereas MLN overexpression in healthy myotubes reduced SR calcium content
      (Supplemental Figure 2, I and J), shRNA against MLN improved SR calcium content in DMD
      immortalized myotubes (Supplemental Figure 2, K and L).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: JCI Insight 2022. One of only two sources of human-cell loss-of-function data
      for MRLN (shRNA in immortalized human DMD myoblasts and myotubes). The authors note that
      no specific anti-MLN antibody was available, so protein-level validation is lacking.
- id: PMID:41348974
  title: Canonical Wnt signaling affects calcium homeostasis in serum-treated AC16 cells through
    MLN-mediated SERCA2a regulation.
  findings:
  - statement: Knockdown of MLN in human AC16 cardiomyocytes increases SERCA2a activity.
    supporting_text: MLN knockdown significantly increased basal SERCA2a activity and abolished
      SFRP2-induced suppression.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: J Mol Cell Biol 2026. Human-cell loss-of-function evidence for SERCA
      inhibition. The AC16 line is transformed and serum-conditioned, and MLN expression in
      cardiomyocytes is not physiological in mouse, so the result supports the molecular
      activity but not a cardiac role.
- id: PMID:28436536
  title: Early vertebrate origin and diversification of small transmembrane regulators of cellular
    ion transport.
  findings:
  - statement: MRLN lies in a conserved CCDC6-SLC16A9 neighbourhood; regulins are related to
      the FXYD family.
    supporting_text: Mammalian myoregulin is flanked by CCDC6 and SLC16A9 genes
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: J Physiol 2017. Evolutionary context only.
