description: >-
  Myoregulin (MRLN, MLN) is a 46-amino-acid single-pass transmembrane micropeptide encoded
  by a short open reading frame in exon 3 of a skeletal-muscle transcript that was
  originally catalogued as a long noncoding RNA (LINC00948). It is a member of the regulin
  (phospholamban/sarcolipin) family of SERCA regulatory subunits: a type II membrane helix
  with a short cytosolic N-terminus and a few lumenal C-terminal residues, anchored in the
  sarcoplasmic reticulum membrane of skeletal muscle. Its transmembrane helix carries the
  hydrophobic motif shared with phospholamban and sarcolipin, through which it binds the
  SERCA calcium pump (SERCA1 predominantly, but also SERCA2a/2b in cells) as a monomer and
  inhibits pump activity, reducing calcium re-uptake into the sarcoplasmic reticulum.
  Whether it acts by lowering the pump's apparent calcium affinity or its maximal rate is
  debated. Myoregulin is expressed in all adult skeletal muscles and is transcriptionally
  controlled by MyoD/MEF2 and repressed by NR1D1. Loss of myoregulin in mice raises
  sarcoplasmic reticulum calcium and improves exercise performance. Knockdown in human
  myotubes and in a human cardiomyocyte line likewise increases SERCA activity or SR calcium
  content.
