      5A)
proposed_new_terms: []
suggested_questions:
- question: >-
    Does myoregulin inhibit SERCA by lowering its apparent Ca2+ affinity (KCa), as in the
    original HEK293 homogenate assays (PMID:25640239), or by lowering Vmax, as in
    proteoliposome co-reconstitution (PMID:34445594, PMID:37014032, PMID:37918638)? The
    UniProt FUNCTION text asserts the KCa mechanism, which the reconstitution data contradict.
  experts:
  - Howard S Young
  - L Michel Espinoza-Fonseca
  - Seth L Robia
- question: >-
    Should SERCA-regulin inhibition be captured as GO:0042030 ATPase inhibitor activity (as
    used for PLN by IBA and in GO-CAM) or as GO:0141110 transporter inhibitor activity (also
    carried by PLN, IDA)? In current GO, P-type calcium transporter activity is not a
    descendant of catalytic activity, so enzyme inhibitor activity is a poor parent for all
    regulins, and a consistent choice across PLN, SLN, MRLN, ERLN and ALN would help.
- question: >-
    Is myoregulin protein present at physiologically meaningful levels in human skeletal
    muscle fibre types, and in human heart (mRNA reported in PMID:38246425)? No human study
    has yet localised the endogenous peptide.
suggested_experiments:
- hypothesis: Human myoregulin inhibits human SERCA1a by the same kinetic mechanism as the
    mouse peptide.
  description: >-
    Co-reconstitute synthetic human MRLN (and mouse Mrln side by side) with purified SERCA1a
    and SERCA2a in proteoliposomes, and measure Ca2+-dependent ATPase activity and Ca2+
    transport to determine KCa and Vmax. Include the L29A/F30A/F33A binding-motif mutant as a
    negative control.
  experiment_type: in vitro reconstitution enzyme kinetics
- hypothesis: Endogenous MRLN restrains SERCA activity in human skeletal muscle.
  description: >-
    Knock out MRLN in human iPSC-derived or primary myotubes (not only DMD lines). Measure SR
    Ca2+ content, Ca2+ transient decay kinetics and SERCA activity, and localise
    epitope-tagged endogenous MRLN by knock-in.
  experiment_type: CRISPR knockout and calcium imaging
