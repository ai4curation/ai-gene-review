core_functions:
- description: >-
    Accessory caveolin adaptor and hetero-oligomeric partner that works with
    CAV1 to form and target CAV1-dependent caveolin assemblies to lipid rafts
    and caveolae. CAV2 is not sufficient to build plasma-membrane caveolae by
    itself, and tissue analyses show that CAV2 is not absolutely required for all
    CAV1-driven caveolae in vivo.
  molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  directly_involved_in:
  - id: GO:0070836
    label: caveola assembly
  locations:
  - id: GO:0005901
    label: caveola
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0002095
    label: caveolar macromolecular signaling complex
  supported_by:
  - reference_id: PMID:12743374
    supporting_text: positively regulates caveolin-1-dependent caveolae formation
  - reference_id: PMID:9361015
    supporting_text: form a stable hetero-oligomeric complex
  - reference_id: PMID:24013648
    supporting_text: caveolins and cavins can be purified as a single species of protein
suggested_questions:
- question: >-
    Which native mammalian cell types require CAV2 for caveola number, caveola
    depth, or CAV1 trafficking, and which cells form CAV1/CAVIN caveolae
    independently of CAV2?
- question: >-
    Which CAV2 phosphorylation states are present in endogenous human caveolae
    and which instead mark non-caveolar focal-adhesion, perinuclear or nuclear
    signaling pools?
suggested_experiments:
- description: >-
    Quantify caveola abundance, membrane attachment and CAV1/CAVIN recruitment in
    matched CAV2-null and phosphosite-rescued human endothelial or adipocyte
    cells under endogenous expression.
- description: >-
    Map endogenous Ser23, Ser36, Tyr19 and Tyr27 CAV2 across plasma-membrane,
    Golgi, perinuclear and nuclear fractions after CAV1 depletion, insulin and
    integrin stimulation.
