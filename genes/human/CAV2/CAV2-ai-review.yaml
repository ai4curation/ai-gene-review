id: P51636
gene_symbol: CAV2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Caveolin-2 is a membrane-associated caveolin that partners with CAV1 in many
  non-muscle caveolae. It binds CAV1 in stable hetero-oligomeric caveolin
  assemblies, moves through Golgi and vesicular pools to plasma-membrane lipid
  rafts and caveolae, and its serine phosphorylation can bias CAV1-dependent
  caveolin vesicles toward plasma-membrane-attached caveolae. Tyrosine- and
  serine-phosphorylated CAV2 pools also support context-specific focal-adhesion,
  insulin/MAPK, dopamine-receptor and viral-matrix associations that are not the
  shared structural role of the caveolin family.
