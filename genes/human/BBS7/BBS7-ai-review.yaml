proposed_new_terms: []
suggested_questions:
- question: Which BBS7 surfaces contribute to cargo handling independently of maintaining BBS2 abundance
    and BBSome organization?
- question: Why does Bbs7 loss alter neuronal ciliary dopamine D1 receptor abundance while preserving
    polycystin-1 and polycystin-2 localization in the tested mouse kidney cells?
- question: Which experimental donor observations support the transferred adipocyte differentiation
    and digestive tract morphogenesis annotations?
suggested_experiments:
- description: Compare BBS7 interface variants at matched expression levels, measuring BBS2 abundance,
    heterodimer formation and incorporation into the complete BBSome separately. Use variants that
    preserve complex integrity to test cargo association and ciliary transport.
  hypothesis: Some BBS7 variants change cargo handling through loss of complex organization, whereas
    others may affect a separable interaction.
  experiment_type: controlled biochemical and cell-based structure-function analysis
