      review also recorded separately accessed official BBSome-formation Results and displayed Figure
      4–6 captions at https://pmc.ncbi.nlm.nih.gov/articles/PMC3679484/. Those selected external
      passages are distinct from the abstract-only local cache; no complete-paper or figure-pixel
      audit is claimed.
