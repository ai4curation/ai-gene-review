id: Q8IWZ6
gene_symbol: BBS7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS7 is a subunit of the BBSome, an eight-protein complex involved in membrane-protein
  trafficking at cilia. It forms a coiled-coil heterodimer with BBS2 within the BBSome assembly intermediate.
  BBS7 and BBS2 also support one another's protein stability. BBS7 occurs in cytoplasmic, centrosomal
  and ciliary compartments, and its loss disrupts BBSome organization and selected ciliary membrane-protein
  distributions. Biallelic pathogenic variants cause Bardet-Biedl syndrome, which can include retinal
  degeneration, obesity, polydactyly and reproductive abnormalities.
