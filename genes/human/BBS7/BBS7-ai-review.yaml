- id: PMID:23572516
  title: BBS7 is required for BBSome formation and its absence in mice results in Bardet-Biedl syndrome
    phenotypes and selective abnormalities in membrane protein trafficking.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
