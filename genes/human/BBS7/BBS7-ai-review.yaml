core_functions:
- description: Organizes the BBSome subunit interface that supports selective membrane-protein trafficking
    at cilia and ciliary assembly or maintenance. BBS7 forms a coiled-coil heterodimer with BBS2;
    this pair joins BBS9 through a separate BBS2-BBS9 interface. Mouse loss-of-function experiments
    show reciprocal dependence of BBS7 and BBS2 protein stability and cargo-selective localization
    defects, including abnormal ciliary dopamine D1 receptor accumulation while several other receptors
    retain their ciliary localization. The complex associates with the ciliary membrane, with basal-body
    localization also supported by the inherited ortholog annotation. Zebrafish perturbation shortens
    Kupffer-vesicle cilia and mouse loss disrupts sperm flagellar axonemes. These context-dependent
    roles do not make BBS7 an autonomous cargo receptor, a transport motor, or a chaperonin catalyst.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  in_complex:
    id: GO:0034464
    label: BBSome
  supported_by:
  - reference_id: PMID:31530639
    supporting_text: 'BBS2 and BBS7 form a

      tight dimer'
    reference_section_type: ABSTRACT
  - reference_id: PMID:23572516
    supporting_text: that BBS7 and BBS2 depend on each other for protein stability.
    reference_section_type: ABSTRACT
  - reference_id: PMID:24938409
    supporting_text: The length of cilia was shortened in bbs7 MO injected embryos
    reference_section_type: RESULTS
  - reference_id: PMID:17574030
  - reference_id: PMID:19081074
