  review:
    summary: BBS7 participates in ciliary protein localization through the BBSome.
    action: MODIFY
    reason: Ciliary protein localization is a supported specific instance of the broad inherited
      process. Human BBS7 depletion disrupts BBSome ciliary entry; Bbs7-null mice show selective
      receptor-localization defects. The specific term includes maintaining a protein within a cilium
      and does not assert that BBS7 autonomously recognizes every cargo.
