- id: PMID:27507813
  title: Leucine Carboxyl Methyltransferase 1 (LCMT-1) Methylates Protein Phosphatase
    4 (PP4) and Protein Phosphatase 6 (PP6) and Differentially Regulates the Stable
    Formation of Different PP4 Holoenzymes.
  findings:
  - statement: >-
      LCMT-1 is the major carboxyl methyltransferase for PP2A, PP4 and PP6 in mouse embryonic
      fibroblasts, so its substrate set is the whole PP2A subfamily rather than PP2A alone.
    supporting_text: >-
      Here we use antibodies specific for the unmethylated phosphatases to show that PP6 is
      carboxyl-methylated and that LCMT-1 is the major methyltransferase for PP2A, PP4, and PP6 in mouse
      embryonic fibroblasts (MEFs).
    reference_section_type: ABSTRACT
  - statement: >-
      Loss of LCMT-1 disrupts holoenzyme assembly across the subfamily, independently confirming that
      the enzyme promotes rather than inhibits complex formation.
    supporting_text: >-
      Collectively, our data suggest that LCMT-1 coordinately regulates the carboxyl methylation of
      PP2A-related phosphatases and, consequently, their holoenzyme assembly and function.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the independent confirmation that LCMT1 positively regulates holoenzyme assembly,
      which settles the sign of the GO:0031333 row. Abstract-only in the cache. Not currently cited by
      any GOA row for this gene.
