core_functions:
- description: >-
    Transfers a methyl group from S-adenosyl-L-methionine to the alpha-carboxyl group of the C-terminal
    leucine of PP2A-family phosphatase catalytic subunits, forming a leucine methyl ester. LCMT1 is the
    major enzyme performing this modification in mammalian cells, acting on PP2A, PP4 and PP6, whose
    catalytic subunits share the modified C-terminal leucine. The methyl ester does not change
    phosphatase catalysis; it creates the C-terminal surface recognized by B/B55-family regulatory
    subunits, so this single activity determines which holoenzymes assemble and therefore which
    substrates the phosphatases reach. Structural work shows the active-site pocket engages the
    substrate C-terminal tail while the substrate's own active site contacts the methyltransferase,
    coupling methylation to the activation state of the phosphatase. The enzyme works mainly in the
    cytoplasm, opposed by the nuclear methylesterase PME-1.
  molecular_function:
    id: GO:0018423
    label: protein C-terminal leucine carboxyl O-methyltransferase activity
  directly_involved_in:
  - id: GO:0006481
    label: C-terminal protein methylation
  - id: GO:0031334
    label: positive regulation of protein-containing complex assembly
