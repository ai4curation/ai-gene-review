- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:17724024
  qualifier: acts_upstream_of_or_within
  review:
    summary: Apoptosis is a downstream readout of failed mitosis, not a process LCMT1 participates in.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Knocking LCMT1 down kills about seven to eight percent of HeLa cells over 24 hours with caspase
      activation and nuclear fragmentation, and the authors describe this as a pro-survival function.
