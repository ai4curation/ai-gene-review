- id: PMID:10600115
  title: Purification of porcine brain protein phosphatase 2A leucine carboxyl methyltransferase
    and cloning of the human homologue.
  findings:
  - statement: >-
      The methyltransferase purified from porcine brain and cloned as the human homologue methylates
      the PP2A catalytic subunit exclusively at the C-terminal leucine 309, and the recombinant enzyme
      behaves like the native one.
    supporting_text: The methylation of PP2A by the recombinant protein is restricted to Leu(309) of PP2A(C).
    reference_section_type: ABSTRACT
  - statement: >-
      Methylation does not itself alter phosphatase catalysis, which is why the functional consequence
      of LCMT1 activity is holoenzyme composition rather than enzyme activity.
    supporting_text: >-
      No direct effects on phosphatase activity changes were observed upon methylation of the dimeric or
      trimeric forms of PP2A.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is the enzyme's defining paper and the source of the EC number, the kinetic
      constants recorded in UniProt, and the IDA and EXP rows. Abstract-only in the cache.
