proposed_new_terms:
- proposed_name: positive regulation of protein phosphatase type 2A complex assembly
  proposed_definition: >-
    Any process that activates or increases the frequency, rate or extent of the assembly of a protein
    phosphatase type 2A complex, a heterotrimer of a scaffold subunit, a catalytic subunit and a
    variable regulatory subunit.
  proposed_parent:
    id: GO:0031334
    label: positive regulation of protein-containing complex assembly
  justification: >-
    The only term available for what LCMT1 does to PP2A holoenzymes is GO:0031334, three levels above
    the specific, conserved and well-characterized mechanism actually demonstrated: carboxyl methylation
    of the catalytic subunit C-terminus creating the interface that B/B55-family regulatory subunits
    recognize. GO already has GO:0000159 protein phosphatase type 2A complex, so the complex is named;
    only the regulated assembly of it is missing. The term would also serve the opposing esterase PPME1
    with a negative sibling, and the yeast orthologue PPM1 currently carries only the unqualified
    GO:0065003. A broader framing covering PP4 and PP6, whose assembly is regulated by the same enzyme
    through the same chemistry, may be preferable.
  supported_by:
  - reference_id: PMID:17724024
    supporting_text: Thus, LCMT-1 is important for PP2A B α AC trimer formation in mammalian cells.
  - reference_id: PMID:27507813
    supporting_text: >-
      Collectively, our data suggest that LCMT-1 coordinately regulates the carboxyl methylation of
      PP2A-related phosphatases and, consequently, their holoenzyme assembly and function.
suggested_questions:
- question: >-
    Does LCMT1 loss actually weaken the mitotic spindle assembly checkpoint, measured as the duration of
    nocodazole-induced mitotic arrest rather than as cell death, or is the nocodazole hypersensitivity
    entirely explained by the upstream PP2A B55 holoenzyme deficit?
  experts:
  - David C. Pallas
- question: >-
    Which PP2A, PP4 and PP6 holoenzyme species depend on LCMT1-mediated methylation in untransformed
    human cells, and in what proportion, given that the quantitative work to date is in HeLa, HCT116 and
    mouse embryonic fibroblasts?
- question: >-
    Is the enzyme-substrate engagement of the PP2A catalytic subunit by LCMT1 worth capturing as
    GO:0051721 protein phosphatase 2A binding, or is it adequately conveyed by the catalytic MF term
    together with a has_input relation on the enzyme?
- question: >-
    Does the Golgi and late-endosomal LCMT1 pool reported by immunofluorescence correspond to a
    functionally distinct, compartment-specific methylation activity, or is it a reservoir of the
    cytosolic enzyme?
  experts:
  - Veerle Janssens
suggested_experiments:
- hypothesis: >-
    LCMT1 depletion does not weaken the spindle assembly checkpoint; the nocodazole hypersensitivity
    reflects death during a prolonged, correctly maintained arrest.
  description: >-
    Live-cell imaging of LCMT1-depleted and LCMT1 knockout cells expressing a mitotic reporter, scoring
    time from nuclear envelope breakdown to anaphase or to mitotic exit in nocodazole. A genuine spindle
    assembly checkpoint defect shortens the arrest; the published time-lapse suggests it is lengthened.
    This is the experiment that would settle whether GO:0090266 ever belonged on this gene.
  experiment_type: live-cell imaging of mitotic timing
- hypothesis: >-
    The methyl ester is required for assembly of a defined subset of PP2A, PP4 and PP6 holoenzymes
    rather than for holoenzyme formation in general.
  description: >-
    Quantitative interactomics of each PP2A, PP4 and PP6 regulatory subunit in LCMT1 knockout versus
    wild-type cells, to establish which holoenzyme species the methyl ester is actually required for and
    whether a single term covering the subfamily, rather than a PP2A-specific one, is warranted.
  experiment_type: affinity-purification mass spectrometry
- hypothesis: >-
    The mitotic phenotype and the embryonic lethality both trace to loss of the methyl mark rather than
    to loss of the LCMT1 polypeptide.
  description: >-
    Separation-of-function alleles: a catalytically dead LCMT1 that still binds PP2A, compared with full
    depletion, to distinguish the consequences of losing the methyl mark from those of losing the
    protein.
  experiment_type: structure-guided separation-of-function genetics
