- id: PMID:17724024
  title: Leucine carboxyl methyltransferase-1 is necessary for normal progression
    through mitosis in mammalian cells.
  findings:
  - statement: >-
      LCMT-1 is the major PP2A methyltransferase in mammalian cells; shRNA knockdown removes up to about
      seventy percent of steady-state PP2A catalytic subunit methylation.
    supporting_text: >-
      Collectively, these results show that mammalian LCMT-1 is responsible for the majority of PP2A
      methylation, similar to the case for the S. cerevisiae LCMT-1 homolog, Ppm1p.
    reference_section_type: RESULTS
  - statement: >-
      LCMT1 promotes, rather than inhibits, assembly of PP2A heterotrimers containing the B-alpha
      regulatory subunit.
    supporting_text: Thus, LCMT-1 is important for PP2A B α AC trimer formation in mammalian cells.
    reference_section_type: RESULTS
  - statement: >-
      The authors suggest a spindle-checkpoint role purely from nocodazole hypersensitivity scored as
      cell death.
    supporting_text: >-
      The increased sensitivity of both LCMT-1 and B α knockdown cells to the spindle-targeting drug,
      nocodazole, suggests that both of these proteins are important in mammalian cells for the spindle
      checkpoint, which ensures proper spindle formation and chromosomal attachment before progression
      from metaphase to anaphase.
    reference_section_type: DISCUSSION
    finding_review:
      finding_status: DISPUTED
      review_notes: >-
        Contradicted within the same paper. The time-lapse experiment shows knockdown cells holding a
        prolonged mitotic arrest, which is what an intact but unsatisfied checkpoint produces; a
        weakened checkpoint produces the opposite, premature exit. Scoring nocodazole response as death
        rather than as arrest duration cannot separate the two interpretations.
      supported_by:
      - reference_id: PMID:17724024
        supporting_text: >-
          In our initial experiments using phase time-lapse microscopy, we found that a subset of LCMT-1
          knockdown cells round up as if to enter mitosis, sometimes with a visible metaphase plate, and
          remain rounded for longer than expected for a normal mitosis, eventually undergoing apoptosis.
  - statement: >-
      Homozygous gene-trap knockout of LCMT-1 in mouse is embryonic lethal, establishing that the enzyme
      is essential.
    supporting_text: >-
      no LCMT-1 −/− pups were obtained from any of the crosses, indicating that loss of LCMT-1 is indeed
      embryonic lethal.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified, full text available in the cache (PMC3516869). The methylation and holoenzyme
      results are solid and are relied on here. The spindle-checkpoint interpretation in the discussion
      is disputed by the paper's own time-lapse data and is the subject of
      geneontology/go-annotation#6632; the apoptosis result is a mitosis-dependent readout rather than
      evidence of participation.
