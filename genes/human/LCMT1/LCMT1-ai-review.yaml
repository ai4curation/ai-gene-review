- id: Reactome:R-HSA-8856945
  title: PP2A methylation by LCMT1
  findings:
  - statement: >-
      Reactome models LCMT1 and PPME1 as the opposing enzymes of reversible PP2A carboxyl methylation,
      with LCMT1 also acting on PP4 and PP6.
    supporting_text: >-
      Reversible methylation of PP2A is catalyzed by two highly conserved enzymes, a 38 kDa leucine
      carboxyl methyltransferase (LCMT1) (De Baere et al. 1999, Lee & Stock 1993) and a 42 kDa
      methylesterase (PPME1) (Lee et al. 1996, Ogris et al. 1999).
  - statement: >-
      Methylation and demethylation are spatially separated, with LCMT1 largely cytoplasmic and PPME1
      nuclear.
    supporting_text: >-
