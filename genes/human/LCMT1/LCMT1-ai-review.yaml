- term:
    id: GO:0031333
    label: negative regulation of protein-containing complex assembly
  evidence_type: IMP
  original_reference_id: PMID:17724024
  qualifier: acts_upstream_of_or_within
  review:
    summary: Sign error - LCMT1 promotes PP2A holoenzyme assembly, it does not inhibit it.
    action: MODIFY
    reason: >-
      The cited experiment shows the opposite direction from the annotated term. Knocking LCMT1 down
      greatly reduced the association of the PP2A B-alpha regulatory subunit with the catalytic subunit,
      so LCMT1 activity increases, not decreases, heterotrimer formation. Methylation of the PP2A
      C-terminus is what creates the surface the B/B55 subunits bind, and the effect generalizes beyond
      PP2A: in LCMT1 knockout fibroblasts, PP4 and PP6 holoenzyme assembly is likewise disrupted. The
      budding-yeast orthologue PPM1 carries the positive-sense GO:0065003 protein-containing complex
      assembly by IMP and carries no negative-regulation term (QuickGO, checked 2026-10-24). This is a
      sign correction, so the replacement is the sibling positive term rather than a descendant. The
      more specific term this really wants does not exist in GO and is raised in proposed_new_terms.
    proposed_replacement_terms:
    - id: GO:0031334
      label: positive regulation of protein-containing complex assembly
    supported_by:
    - reference_id: PMID:17724024
      supporting_text: Thus, LCMT-1 is important for PP2A B α AC trimer formation in mammalian cells.
    - reference_id: PMID:17724024
      supporting_text: >-
        down-regulation of LCMT-1 by L3 shRNA greatly reduced C subunit association with HA-B α
    - reference_id: PMID:27507813
      supporting_text: >-
        Collectively, our data suggest that LCMT-1 coordinately regulates the carboxyl methylation of
        PP2A-related phosphatases and, consequently, their holoenzyme assembly and function.
