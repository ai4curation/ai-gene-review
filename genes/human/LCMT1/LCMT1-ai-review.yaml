- term:
    id: GO:0090266
    label: regulation of mitotic cell cycle spindle assembly checkpoint
  evidence_type: IMP
  original_reference_id: PMID:17724024
  qualifier: acts_upstream_of_or_within
  review:
    summary: The paper's own time-lapse shows the opposite phenotype from a checkpoint defect.
    action: REMOVE
    reason: >-
      The entire basis for this annotation is that LCMT1 knockdown cells die more than controls in
      nocodazole, from which the authors suggest a spindle-checkpoint role. The inference does not
      follow. A weakened spindle assembly checkpoint means cells cannot hold a mitotic arrest and slip
      through; what the same paper observes by time-lapse is the opposite, cells that round up with a
      visible metaphase plate and stay arrested far longer than a normal mitosis before dying. That is
      an unsatisfied checkpoint responding to an upstream spindle or holoenzyme defect, which is
      evidence that the checkpoint is working. Measuring nocodazole response as death rather than as
      loss of arrest cannot distinguish the two. The comparator check is decisive: every other gene
      carrying GO:0090266 in human, mouse or budding yeast was assayed for arrest directly - MAD1,
      MAD2L1, MAD2L1BP, KNL1, NDC80, SKA1, SKA3, TPR, USP44, ANAPC15, AURKB/IPL1, CDC55 (QuickGO,
      checked 2026-10-24) - and the yeast orthologue of LCMT1 has no such annotation. This is the
      removal requested in go-annotation#6632. What LCMT1 genuinely contributes to mitosis is captured
      by its effect on PP2A holoenzyme assembly.
    supported_by:
    - reference_id: PMID:17724024
      supporting_text: >-
        In our initial experiments using phase time-lapse microscopy, we found that a subset of LCMT-1
        knockdown cells round up as if to enter mitosis, sometimes with a visible metaphase plate, and
        remain rounded for longer than expected for a normal mitosis, eventually undergoing apoptosis.
    - reference_id: PMID:17724024
      supporting_text: >-
        The increased sensitivity of both LCMT-1 and B α knockdown cells to the spindle-targeting drug,
        nocodazole, suggests that both of these proteins are important in mammalian cells for the
        spindle checkpoint, which ensures proper spindle formation and chromosomal attachment before
        progression from metaphase to anaphase.
    source_defects:
    - resource: MGI
      defect_type: OTHER
      requested_change: DELETE_ROW
      asserted_value: GO:0090266
      confidence: PROBABLE
      explanation: >-
        The supporting experiment is nocodazole hypersensitivity scored as cell death, from which the
        authors only suggest a checkpoint role. The same paper's time-lapse shows knockdown cells
        holding a prolonged mitotic arrest, which is what an intact but unsatisfied checkpoint produces;
        a weakened checkpoint produces premature exit instead. No other LCMT-family member in any
        organism carries a spindle-checkpoint annotation. Raised upstream as
        geneontology/go-annotation#6632.
      report_status: REPORTED
      report_url: https://github.com/geneontology/go-annotation/issues/6632
