id: Q9UIC8
gene_symbol: LCMT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LCMT1 is a 334-residue S-adenosyl-L-methionine-dependent methyltransferase that esterifies the
  alpha-carboxyl group of the C-terminal leucine of the catalytic subunits of the PP2A family of
  serine/threonine phosphatases (Leu309 of PP2A C), and is the major enzyme performing this
  modification in mammalian cells. The same enzyme also carboxyl-methylates the related catalytic
  subunits of PP4 and PP6. Methylation does not alter phosphatase catalysis directly; it creates the
  C-terminal surface that the B/B55-family regulatory subunits recognize, so LCMT1 activity
  determines which holoenzymes assemble and therefore which substrates PP2A-family phosphatases act
  on. Crystal structures show that the LCMT1 active-site pocket engages the PP2A C-terminal tail and
  that an activated PP2A active site contacts the methyltransferase, coupling methylation to the
  activation state of the substrate phosphatase. LCMT1 is predominantly cytoplasmic, spatially
  separated from the opposing nuclear methylesterase PME-1. The enzyme is essential: homozygous
  knockout is embryonic lethal in mouse.
