  - statement: Type V collagen is a minor but critical fibril-forming component associated with
      type I collagen in bone matrix, corneal stroma and interstitial matrix, and COL5A1-null mice
      almost completely lack collagen fibrils.
    supporting_text: COL5A1-/- mice have an almost complete lack of collagen fibrils reflecting a
      central role in fibrillogenesis (Wenstrup et al. 2004).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The type V collagen degradation event contains extracellular COL5A1 as a substrate
      of MMP2, MMP9 and MMP10. The metalloproteinases perform the degradation; the collagen
      is not itself a protease. Underlying cited papers were not all independently reread.
- id: Reactome:R-HSA-2002428
  title: Removal of fibrillar collagen N-propeptides
  findings:
  - statement: Type V collagen N-propeptide removal is only partial and is mediated by BMP-1,
      which cleaves within the alpha1 chain; the chain is the substrate, not the protease.
    supporting_text: Type V collagen N-propeptide removal is partial, and reported to be mediated
      by BMP-1 which cleaves between the proline/arginine-rich protein domain and the variable
      domain of the alpha1 chain
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: N-terminal propeptide processing places collagen V precursor-derived material
      extracellularly. Type V processing is partial, and the summary describes BMP1 cleavage
      of alpha1(V); the collagen chain does not catalyze proteolysis. Underlying cited papers
      were not all independently reread.
- id: Reactome:R-HSA-2002440
  title: Removal of fibrillar collagen C-propeptides
  findings:
  - statement: Type V C-propeptide removal is carried out by furin-like proprotein convertases
      and/or BMP-1 depending on the chain, so the propeptide processing activity belongs to those
      enzymes.
    supporting_text: Type V C-propeptide removal is mediated by furin-like proprotein convertases
      and/or BMP-1 depending on the chain type (Kessler et al. 2005).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: C-terminal propeptide cleavage occurs in procollagen-containing material.
      The summary distinguishes chain-dependent type V processing by furin-like convertases
      and/or BMP1; COL5A1 is their substrate. Retain the source extracellular location without
      claiming that every processing event occurs exclusively outside cells. Underlying cited
      papers were not all independently reread.
- id: Reactome:R-HSA-2022073
  title: Procollagen triple helix formation
  findings:
  - statement: Procollagen triple-helix formation starts from the aligned C-terminal prodomains
      and propagates C-to-N in the rough endoplasmic reticulum, which is why the alpha1(V)
      precursor is placed in the ER lumen.
    supporting_text: Alignment of the C-terminal prodomains initiates triple helix formation,
      which propagates in a zipper-like fashion in the C-to-N direction. This occurs in the rough
      endoplasmic reticulum
    reference_section_type: DATABASE_ENTRY
  - statement: Efficient folding depends on separate enzymes and chaperones rather than on any
      activity of the collagen chain itself.
    supporting_text: Efficient helix folding requires the presence of the 3-prolyl hydroxylation
      complex.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The current triple-helix formation event resolves the COL5A1 precursor in
      the ER lumen. Retain this location while distinguishing COL5A1 structural assembly from
      the enzymes and transport machinery acting on it. Its separate extracellular source assertions
      concern later material and remain intact. Underlying cited papers were not all independently
      reread.
- id: Reactome:R-HSA-2089971
  title: Secretion of collagens
  findings:
  - statement: Collagen precursors are co-translationally delivered to the ER lumen, where
      modifications required for oligomerisation and stabilisation occur before export.
    supporting_text: Collagen precursors are co-translated into the ER, where post-translational
      modifications occur that are essential for oligomerization and stabilization
    reference_section_type: DATABASE_ENTRY
  - statement: Assembled trimers leave the ER, traverse the Golgi and are secreted into the
      extracellular space, where they are organised into higher-order structures.
    supporting_text: Trimers are exported from the ER and trafficked through the Golgi network
      before secretion into the extracellular space and organization into higher order structures.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The association/secretion event includes both luminal precursors and exported
      collagen material. This source assertion concerns its extracellular destination; its separate
      ER annotation is retained independently. Underlying cited papers were not all independently
      reread.
- id: Reactome:R-HSA-2213201
  title: Formation of collagen fibres
  findings:
  - statement: Fibrils are components of larger suprafibrillar fibres whose organisation varies
      between tissues, the supramolecular level at which type V collagen acts.
    supporting_text: Fibrils are components of larger suprafibrillar structures, fibres.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Formation of collagen fibers places fibrils in extracellular supramolecular
      structures. The summary discusses tissue-specific organization and surface-associated
      GAG/proteoglycan interactions; this is not an isolated alpha1(V) crosslink-enzyme assay.
      Underlying cited papers were not all independently reread.
- id: Reactome:R-HSA-2327695
  title: Collagen types III, IV, V, VI, VIII, IX, XVI bind integrins alpha1beta1 and alpha2beta1
  findings:
  - statement: Collagen V is listed among the extracellular collagen ligands of integrins
      alpha1beta1 and alpha2beta1, a complex-level relationship that does not resolve which chain
      provides the site.
    supporting_text: Integrin alpha2beta also binds collagen types VIII (Saelman et al. 1992), IX
      (Käpylä et al. 2004), XI (Tuckwell et al. 1995)
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The integrin-ligand event contains extracellular collagen V within a collagen
      set. A target membership path supports location, not isolated alpha1(V) binding to every
      listed integrin. Underlying cited papers were not all independently reread.
- id: Reactome:R-HSA-2327733
  title: FN1 binds Collagen types I-V, VII
  findings:
  - statement: Fibronectin conjugates bind collagen types I through V, placing type V collagen in
      an extracellular interaction context without a chain-specific measurement.
    supporting_text: FN1 conjugates can bind collagen types I through V (Bell & Engvall 1982), VII
      (Lapiere et al. 1994) and likely others.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The FN1 association event contains extracellular type V collagen; its exact
      participant path agrees with the independently tested N-propeptide/fibronectin interaction.
      Underlying cited papers were not all independently reread.
- id: Reactome:R-HSA-2327738
  title: DDR1 binds collagen type I, II, III, IV, V, XI fibrils
  findings:
  - statement: DDR1 binds the major fibrillar collagens including type V, so collagen V is the
      extracellular ligand and DDR1 carries the kinase activity.
    supporting_text: DDR1 binds several of the major fibrillar collagens (types I, II, III, and V)
      and the non-fibrillar collagen IV (Shrivastava et al. 1997, Vogel et al. 1997, Hou et al.
      2001).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The DDR1 association event includes type V collagen as extracellular ligand
      material. Retain location without assigning receptor kinase activity to COL5A1 or claiming
      a target-chain-specific affinity measurement from a family-set path. Underlying cited
      papers were not all independently reread.
- id: Reactome:R-HSA-2396370
  title: VTN binds collagens II, III and V
  findings:
  - statement: Vitronectin interacts with collagen types I to VI, which places type V collagen in
      an extracellular plasma-glycoprotein interaction context.
    supporting_text: It interacts with collagen types I, II, III, IV, V, and VI (Gebb et al.
      1986).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The vitronectin association event includes collagen types II, III and V extracellularly.
      Retain the COL5A1 location while distinguishing the collagen participant from its VTN
      counterpart and from an isolated alpha1(V)-specific interface assay. Underlying cited
      papers were not all independently reread.
- id: Reactome:R-HSA-2465890
  title: DDR2 binds collagen type I, II, III, V, X fibrils
  findings:
  - statement: DDR2 binds the major fibrillar collagens including type V, again as an
      extracellular ligand of a receptor tyrosine kinase.
    supporting_text: DDR2 binds the major fibrillar collagens types I, II, III, and V) and the
      non-fibrillar collagen X (Shrivastava et al. 1997, Vogel et al. 1997, Leitinger & Kwan
      2006).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The DDR2 association event includes extracellular type V collagen. The collagen
      is the ligand material rather than the receptor kinase; participant-set membership does
      not independently resolve every alpha-chain contact. Underlying cited papers were not
      all independently reread.
- id: Reactome:R-HSA-375151
  title: Interaction of NCAM1 with collagens
  findings:
  - statement: NCAM1 is reported to bind collagens I-IV as extracellular matrix ligands; the
      event's participant path reaches alpha1(V) in extracellular material.
    supporting_text: NCAM1 interacts with several extracellular matrix proteins. NCAM1 has been
      reported to bind collagens I-IV and IX.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: NCAM1 association uses a broad extracellular collagen set whose membership
      path reaches COL5A1. Its summary lists other collagen types; this target location is not
      a new alpha1(V)-specific NCAM1 binding assay. Underlying cited papers were not all independently
      reread.
- id: Reactome:R-HSA-382054
  title: PDGF binds to extracellular matrix proteins
  findings:
  - statement: PDGF is retained in the matrix by binding various collagens among other components,
      though heparan sulphate is judged the major partner.
    supporting_text: PDGF binds to various types of collagens, thrombospondin and osteopontin;
      however, the major component of the matrix involved in PDGF binding is likely to be haparan
      sulphate.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PDGF association places collagen-containing material extracellularly. Broad
      participant membership is distinguished from a direct alpha1(V)-specific affinity measurement;
      the independent original PDGF source is assessed separately. Underlying cited papers were
      not all independently reread.
- id: Reactome:R-HSA-8944223
  title: Association of procollagen type V
  findings:
  - statement: The C-terminal propeptide region drives association of three alpha chains into a
      trimeric non-helical procollagen, fixing composition and register before helix nucleation.
    supporting_text: The C-terminal region of the propeptide is required for the association of
      three alpha chains into a trimeric non-helical procollagen.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The current procollagen modification/assembly event resolves the COL5A1 precursor
      in the ER lumen. Retain this location while distinguishing COL5A1 structural assembly
      from the enzymes and transport machinery acting on it. Its separate extracellular source
      assertions concern later material and remain intact. Underlying cited papers were not
      all independently reread.
- id: Reactome:R-HSA-9638561
  title: MrkD binds Collagen V
  findings:
  - statement: The Klebsiella pilus adhesin MrkD binds type V collagen on tubular basement
      membranes and interstitial connective tissue, so host collagen V is the extracellular ligand
      of a bacterial adhesin.
    supporting_text: The adhesin MrkD in these pili binds to type-V collagen (Collagen V) on
      tubular basement membranes, the Bowman's capsule, arterial walls and interstitial connective
      tissue (Gerlach et al. 1989, Tarkkanen et al. 1990).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The bacterial collagen-associated event places human collagen extracellularly;
      a host matrix substrate or ligand is not itself a bacterial virulence activity. Underlying
      cited papers were not all independently reread.
- id: Reactome:R-NUL-2731094
  title: Syndecan-1 binds collagen types I, III,  V
  findings:
  - statement: The heparan sulfate chains of syndecan-1 mediate interactions with collagen types
      I, III and V, placing type V collagen in an extracellular proteoglycan interaction context.
    supporting_text: HS chains facilitate interactions of syndecan-1 with extracellular matrix
      proteins, including several types of collagen (type I, III and V - Koda et al. 1985).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The distinct R-NUL syndecan-1 association source currently reports Homo sapiens
      and resolves to COL5A1 through extracellular collagen-containing entities. Preserve this
      identifier and assertion separately from any R-HSA event; the prefix is not evidence of
      a nonhuman experiment. Family-set participation does not establish an isolated alpha1(V)-specific
      syndecan interface. Underlying cited papers were not all independently reread.
- id: PMID:19103590
  title: Differences in chain usage and cross-linking specificities of cartilage type V/XI collagen
    isoforms with age and tissue.
  findings:
  - statement: In mature articular cartilage the alpha1(V) chain progressively replaces
      alpha2(XI), so alpha1(V) participates in mixed V/XI isoforms rather than a pure type V or
      pure type XI trimer.
    supporting_text: With maturation of articular cartilage, the alpha1(V) chain progressively
      replaced the alpha2(XI) chain.
    reference_section_type: ABSTRACT
  - statement: Cross-linked peptide analysis shows alpha1(V) chains cross-linked primarily to
      alpha1(XI), making alpha1(V) an integral component of the V/XI polymer.
    supporting_text: Analysis of cross-linked peptides showed that the alpha1(V) chains were
      primarily cross-linked to alpha1(XI) chains in the tissue and hence an integral component of
      the V/XI polymer.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual full primary Methods/Results in independent core consultation establish
      bovine cartilage/disc/meniscus alpha1(V)–XI chain crosslinks and partially resolved hybrid
      assemblies. This is direct target-chain evidence but not a human direct assay; synthetic
      human antibody peptides do not change the tissue species. Strict canonical GO5592 composition
      differs from the observed hybrid.
- id: PMID:15383546
  title: Type V collagen controls the initiation of collagen fibril assembly.
  findings:
  - statement: Mouse embryos completely lacking pro-alpha1(V) chains show a virtual absence of
      collagen fibril formation and die around embryonic day 10, establishing type V collagen as
      required for fibril nucleation.
    supporting_text: The type V collagen-deficient mice demonstrate a virtual lack of collagen
      fibril formation.
    reference_section_type: ABSTRACT
  - statement: Heterozygotes are viable but have half the normal fibril number and dermal collagen
      content, with an abnormal large-diameter fibril population.
    supporting_text: The reduced type V collagen content is associated with a 50% reduction in
      fibril number and dermal collagen content.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic abstract reports mouse Col5a1 loss with failure of ordinary
      collagen fibril formation, supporting initiation/structural work. Full original Methods
      were not recovered; it is not relabeled as a human experiment.
  full_text_unavailable: true
- id: PMID:14676276
  title: A domain-specific usherin/collagen IV interaction may be required for stable integration
    into the basement membrane superstructure.
  findings:
  - statement: Usherin binds the 7S domain of type IV collagen through its LE domain with 1:1
      stoichiometry; this concerns collagen IV rather than COL5A1.
    supporting_text: We demonstrate binding occurs between the LE domain of usherin and the 7S
      domain of type IV collagen.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Correct original identity and complete abstract verified for current mouse
      same-term donor context. The abstract concerns usherin/type IV collagen; full indexed
      PDF/publisher recovery failed. Exact type V target localization remains unverified, without
      alleging a gene error from the abstract alone.
  full_text_unavailable: true
core_functions:
- description: Alpha1(V) supplies structural elements of type V collagen and heterotypic fibrils,
    contributing to fibril initiation, diameter control and extracellular matrix architecture.
    Human target-dependent deposition/morphology and mouse loss-of-function evidence support
    performed matrix work. Bovine V/XI hybrids provide additional tissue-specific chain-assembly
    context, without equating them with the strictly enumerated canonical type XI trimer. N-propeptide
    interactions and precursor assembly/processing are integrated into this structural role;
    other proteins perform the proteolytic cleavage.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005588
    label: collagen type V trimer
  locations:
  - id: GO:0031012
    label: extracellular matrix
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  supported_by:
  - reference_id: PMID:11278977
    supporting_text: Type V collagen incorporates into type I collagen fibrils in the
      extracellular matrix and is thought to regulate fibril diameter.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15095409
    supporting_text: However, a reduction of type V collagen, in the EDS derived cells, was
      associated with the assembly of significantly fewer fibrils compared to control and OI
      cells.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15383546
    supporting_text: The type V collagen-deficient mice demonstrate a virtual lack of collagen
      fibril formation.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19103590
    supporting_text: Analysis of cross-linked peptides showed that the alpha1(V) chains were
      primarily cross-linked to alpha1(XI) chains in the tissue and hence an integral component of
      the V/XI polymer.
    reference_section_type: ABSTRACT
  - reference_id: PMID:20979576
    supporting_text: Type V collagen controls collagen fibrillogenesis through its conserved
      α1(V)-N-propeptide domain.
    reference_section_type: ABSTRACT
suggested_questions:
- question: How do the two alpha1(V) C-propeptide splice variants differ in chain selection,
    secretion and processing when their mature-chain sequences are the same?
- question: Which human tissues contain alpha1(V)-bearing V/XI hybrid trimers, and should the
    ontology distinguish these from the strictly enumerated canonical type XI trimer?
- question: Which N-propeptide interactions govern fibril initiation or diameter in native human
    matrix, rather than only in isolated domain or engineered-construct assays?
- question: Does collagen V alter integrin production as well as organization, and which receptor-dependent
    events explain fibroblast migration and the endoderm response to applied collagen V?
- question: What exact performed formation step underlies the two existing collagen-biosynthesis
    annotations, beyond reduced collagen abundance or matrix deposition?
- question: What target-specific localization experiment supports the mouse type V basement-membrane
    record used for the electronic transfer, distinct from the available usherin/type IV abstract?
suggested_experiments:
- description: Compare sequence-defined human alpha1(V) splice products in matched alpha2(V)-containing
    precursor assemblies, measuring secretion, cleavage, trimer composition and fibril architecture
    separately.
  hypothesis: C-propeptide differences can affect precursor selection or processing despite
    an identical mature-chain sequence.
- description: Use native human cartilage/tendon crosslink proteomics with chain-specific peptides
    to distinguish canonical type V, canonical type XI and alpha1(V)-containing hybrids.
  hypothesis: Hybrid chain composition varies by tissue and age and is not captured by a single
    canonical complex definition.
- description: Perturb verified N-propeptide partner interfaces in reconstituted collagen I/V
    matrices and measure fibril initiation, diameter and cell responses, with matrix abundance
    and processing controlled.
  hypothesis: Selected contacts contribute structural organization independently of general
    collagen abundance.
- description: In the fibroblast-rescue and ESC matrix-cue settings, separate integrin transcription/translation
    from receptor redistribution and quantify migration or endoderm differentiation after receptor
    loss/rescue.
  hypothesis: Matrix organization and receptor redistribution can account for some responses
    without requiring increased integrin biosynthesis.
