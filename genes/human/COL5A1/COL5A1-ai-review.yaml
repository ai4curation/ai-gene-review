id: P20908
gene_symbol: COL5A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL5A1 encodes the alpha1 chain of type V collagen, a secreted fibrillar matrix
  component that helps initiate collagen fibrils and regulate their diameter and organization.
  Alpha1(V) commonly assembles with alpha2(V) into type V heterotrimers that coassemble with
  type I collagen; tissue-specific V/XI hybrid assemblies also occur. Its retained N-terminal
  region interacts with matrix proteins and contributes to fibril organization and cell–matrix
  behavior, whereas the C-propeptide participates in precursor assembly before processing. Reduced
  or altered alpha1(V) disrupts connective-tissue architecture and causes classical Ehlers–Danlos
  syndrome, with skin, joint and ocular manifestations. Alternative splicing changes a segment
  of the C-terminal propeptide.
