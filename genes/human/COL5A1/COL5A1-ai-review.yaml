    supporting_text: These glycosaminoglycan chains are not directly involved in collagen binding,
      since chondroitinase-treated fragments exhibit an unimpaired ability to bind to both collagens.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original indexed author-uploaded Methods/Results read at https://www.researchgate.net/publication/14117045/
      . Pepsinized human amniotic-membrane collagen V binds rat NG2/CSPG4 in solid-phase and
      rotary-shadowing assays. Rat partner identity and proteoglycan core-domain scope are retained;
