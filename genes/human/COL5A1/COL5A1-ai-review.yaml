references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT annotations are propagated from a curator-placed ancestral-node (IBD) assertion
      to the descendants of that node, so an IBA records an inherited phylogenetic judgment rather
      than a pairwise similarity transfer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Preserved standard evidence-method reference authenticated from genuine GOA.
      Target decisions use current official terms/identities and source-scoped evidence; historical
      IBD, ARBA and original electronic-transfer machinery were not reconstructed.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs
    using Ensembl Compara
  findings:
  - statement: This method transfers an experimentally supported manual annotation from one species
      to a one-to-one orthologue, so the row rests on the donor gene's experiment plus the orthology
      call.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Preserved standard evidence-method reference authenticated from genuine GOA.
      Target decisions use current official terms/identities and source-scoped evidence; historical
      IBD, ARBA and original electronic-transfer machinery were not reconstructed.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA annotations are emitted by machine-learned association rules over UniProtKB
      features, so a row carries the rule's premise rather than evidence about the target gene.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Preserved standard evidence-method reference authenticated from genuine GOA.
