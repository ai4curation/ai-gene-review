- id: PMID:19103590
  title: Differences in chain usage and cross-linking specificities of cartilage type V/XI collagen
    isoforms with age and tissue.
  findings:
  - statement: With maturation of articular cartilage the alpha1(V) chain progressively replaces
      alpha2(XI), and alpha1(V) chains are cross-linked primarily to alpha1(XI) chains, making
      alpha1(V) an integral component of the V/XI polymer.
    supporting_text: Analysis of cross-linked peptides showed that the alpha1(V) chains were primarily
      cross-linked to alpha1(XI) chains in the tissue and hence an integral component of the V/XI
      polymer.
    reference_section_type: ABSTRACT
  - statement: Type V/XI collagen is a minor but essential component of vertebrate collagen fibrils
      whose isoform usage varies with age and tissue.
    supporting_text: Collagen type V/XI is a minor but essential component of collagen fibrils
      in vertebrates.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual full primary Methods/Results in independent core consultation establish
      bovine cartilage/disc/meniscus alpha1(V)–XI chain crosslinks and partially resolved hybrid
      assemblies. This is direct target-chain evidence but not a human direct assay; synthetic
      human antibody peptides do not change the tissue species. Strict canonical GO5592 composition
      differs from the observed hybrid.
- id: PMID:15383546
  title: Type V collagen controls the initiation of collagen fibril assembly.
  findings:
  - statement: Mice completely deficient in pro-alpha1(V) die at about embryonic day 10 and show
      a virtual lack of collagen fibril formation, establishing type V collagen as required for
      fibril nucleation.
    supporting_text: The type V collagen-deficient mice demonstrate a virtual lack of collagen
      fibril formation.
    reference_section_type: ABSTRACT
  - statement: Heterozygous col5a1+/- mice are viable but have a 50% reduction in fibril number
      and dermal collagen content, with a second population of large structurally abnormal fibrils.
    supporting_text: The reduced type V collagen content is associated with a 50% reduction in
      fibril number and dermal collagen content.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic abstract reports mouse Col5a1 loss with failure of ordinary
      collagen fibril formation, supporting initiation/structural work. Full original Methods
      were not recovered; it is not relabeled as a human experiment.
  full_text_unavailable: true
