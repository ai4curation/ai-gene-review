- id: PMID:11278977
  title: COL5A1 exon 14 splice acceptor mutation causes a functional null allele, haploinsufficiency
    of alpha 1(V) and abnormal heterotypic interstitial fibrils in Ehlers-Danlos syndrome II.
  findings:
  - statement: A COL5A1 exon 14 splice-acceptor mutation creates a functional null allele through
      nonsense-mediated decay, leaving only 8% mutant transcript and reducing secreted type V
      collagen to 65% of control.
    supporting_text: Relative to type I collagen, proband fibroblasts secreted only 65% of the
      amount of type V collagen secreted by normal controls.
    reference_section_type: ABSTRACT
  - statement: The alpha chain composition of type V collagen stays alpha1(V)2alpha2(V) even under
      alpha1(V) haploinsufficiency, so COL5A1 is an obligate subunit of that trimer rather than an
      interchangeable one.
    supporting_text: Selective salt precipitation of proband secreted collagen provided supportive
      evidence that the alpha chain composition of type V collagen remains alpha1(V)(2)alpha2(V)
      even in the context of alpha1(V) haploinsufficiency.
    reference_section_type: ABSTRACT
  - statement: Type V collagen incorporates into type I collagen fibrils in the extracellular
      matrix and is thought to regulate fibril diameter.
    supporting_text: Type V collagen incorporates into type I collagen fibrils in the
      extracellular matrix and is thought to regulate fibril diameter.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete human-family abstract directly reports reduced transcript/secretion,
      type V chain composition and altered dermal fibril diameters. Full original Methods remain
      unavailable. Positive fibril organization is retained; exact biosynthetic-step attribution
      remains undecided.
  full_text_unavailable: true
- id: PMID:14970208
  title: Human fibroblasts with mutations in COL5A1 and COL3A1 genes do not organize collagens
    and fibronectin in the extracellular matrix, down-regulate alpha2beta1 integrin, and recruit
    alphavbeta3 Instead of alpha5beta1 integrin.
  findings:
  - statement: Dermal fibroblasts carrying COL5A1 mutations fail to organize type V collagen and
      fibronectin into the extracellular matrix and lose their alpha2beta1 integrin, so alpha1(V)
      is required for matrix organization.
    supporting_text: Dermal fibroblasts derived from types I and IV Ehlers-Danlos syndrome (EDS)
      patients, carrying mutations in COL5A1 and COL3A1 genes, respectively, synthesize aberrant
      types V and III collagen (COLL) and show defective organization of these proteins into the
      extracellular matrix (ECM) and high reduction of their functional receptor, the
      alpha(2)beta(1) integrin, compared with control fibroblasts.
    reference_section_type: ABSTRACT
  - statement: Adding purified type V collagen back to the mutant cells restores the control
      matrix and integrin phenotype, and blocking antibodies to type V collagen reproduce the
      defect in control cells.
    supporting_text: Treatment of EDS cells with purified COLLV or COLLIII, but not with FN,
      restores the control phenotype (COLL(+), FN(+), alpha(v)beta(3)(-), alpha(5)beta(1)(+),
      alpha(2)beta(1)(+)).
    reference_section_type: ABSTRACT
  - statement: The integrin changes are a downstream consequence of losing the alpha2beta1 ligand,
      since alpha2beta1 levels in turn control which fibronectin receptor is recruited.
    supporting_text: These results show that in human fibroblasts alpha(2)beta(1) integrin
      organization and function are controlled by its ligand, and that the alpha(2)beta(1)-COLL
      interaction, in turn, regulates FN integrin receptor recruitment
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine selected abstract retained. Original publicly author-uploaded indexed
      manuscript Methods/Results were read at https://www.researchgate.net/publication/5781672/
      . Human patient fibroblasts, purified human collagens III/V, integrin perturbation and
      matrix restoration are distinct experiments; no purified alpha1(V)–integrin affinity was
      measured in the inspected scope.
- id: PMID:15095409
  title: 'Reduced type I collagen utilization: a pathogenic mechanism in COL5A1 haplo-insufficient
    Ehlers-Danlos syndrome.'
  findings:
  - statement: COL5A1-haploinsufficient fibroblasts assemble significantly fewer collagen fibrils
      than controls, far out of proportion to type V collagen's small share of collagen mass.
    supporting_text: However, a reduction of type V collagen, in the EDS derived cells, was
      associated with the assembly of significantly fewer fibrils compared to control and OI
      cells.
    reference_section_type: ABSTRACT
  - statement: Fibril diameter varies inversely with the type V to type I collagen ratio,
