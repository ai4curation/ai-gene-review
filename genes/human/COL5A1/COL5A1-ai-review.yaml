- term:
    id: GO:0032964
    label: collagen biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:11278977
  qualifier: involved_in
  review:
    summary: Whether alpha1(V) participates in collagen biosynthesis as a process is unresolved,
      because the evidence measures transcript and secretion levels of the gene itself.
    action: UNDECIDED
    reason: The complete human-family abstract reports reduced COL5A1 transcript abundance and
      secreted type V collagen, plus altered fibril morphology; full original Methods remain
      unavailable. Reduced production establishes a consequence but does not by itself resolve
      the specific biosynthetic step performed by alpha1(V). Intrinsic structural assembly can
      count as performed work, so the annotation is unresolved rather than denied simply because
      the protein is a precursor. Independently, the PMID:9042913 human EDS abstract reports
      a C-propeptide cysteine substitution preventing mutant-chain incorporation into type V
      trimers, supporting intrinsic assembly work. That positive premise does not resolve the
      exact biosynthetic step attributed by this source whose full Methods remain unavailable.
    supported_by:
    - reference_id: PMID:11278977
      supporting_text: Relative to type I collagen, proband fibroblasts secreted only 65% of the
        amount of type V collagen secreted by normal controls.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9042913
      supporting_text: The mutation causes the substitution of the most 5' cysteine residue by a
        serine within a highly conserved sequence of the pro(alpha)1(V) C-propeptide domain and
        causes reduction of collagen V by preventing incorporation of the mutant pro(alpha)1(V)
        chains in the collagen V trimers.
      reference_section_type: ABSTRACT
