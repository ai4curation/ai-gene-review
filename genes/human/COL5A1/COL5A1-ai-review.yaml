  review:
    summary: Alpha1(V) is detected in extracellular-matrix-enriched human vein tissue, supporting
      its extracellular residence.
    action: ACCEPT
    reason: The original study analyzes extracellular-matrix-enriched human vein samples using
      fractionation and mass spectrometry. Actual extraction/MS Methods and Figure3 legend explicitly
      identify CO5A1 in GuHCl extracts from six normal and six varicose saphenous veins, with
      plotting intensity scaled tenfold. The supplemental target row remains uninspected; no
      figure-pixel value or target-specific significance is claimed. Retain this positive extracellular
      detection without presenting it as a direct vascular regulatory mechanism.
    supported_by:
    - reference_id: PMID:27068509
      supporting_text: Extracellular matrix proteins were enriched from venous tissues. The
        proteomics analysis revealed the presence of >150 extracellular matrix proteins, of which
        48 had not been previously detected in venous tissue.
      reference_section_type: ABSTRACT
    - reference_id: PMID:14970208
      supporting_text: Dermal fibroblasts derived from types I and IV Ehlers-Danlos syndrome (EDS)
        patients, carrying mutations in COL5A1 and COL3A1 genes, respectively, synthesize aberrant
        types V and III collagen (COLL) and show defective organization of these proteins into the
        extracellular matrix (ECM) and high reduction of their functional receptor, the
        alpha(2)beta(1) integrin, compared with control fibroblasts.
      reference_section_type: ABSTRACT
