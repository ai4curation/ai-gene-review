- id: PMID:9683580
  title: A point mutation in an intronic branch site results in aberrant splicing of COL5A1
    and in Ehlers-Danlos syndrome type II in two British families.
  findings:
  - statement: A point mutation at the intron 32 lariat branch site causes exon 33 skipping in
      about 60% of COL5A1 transcripts and segregates with Ehlers-Danlos syndrome type II in two
      British families.
    supporting_text: Affected members from each family were heterozygous for a point mutation
      in intron 32 (IVS32:T-25G), causing the 45-bp exon 33 to be lost from the mRNA in approximately
      60% of transcripts from the mutant gene.
    reference_section_type: ABSTRACT
  - statement: Type V collagen exists as the [alpha1(V)]2alpha2(V) heterotrimer and both coassembles
      with and regulates the diameter of type I collagen fibrils.
    supporting_text: Type V collagen can exist as a heterotrimer, [alpha1(V)]2alpha2(V), and it
      both coassembles with and regulates type I collagen-fibril diameter.
    reference_section_type: ABSTRACT
  - statement: Ehlers-Danlos syndrome is characterized by skin fragility, joint laxity and skeletal
      deformities, the phenotype this COL5A1 mutation produces.
    supporting_text: Ehlers-Danlos syndrome (EDS) is a heterogeneous group of connective-tissue
      disorders characterized by skin fragility, joint laxity, and skeletal deformities.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic human-family abstract supports COL5A1 intron32 branch-site
      splicing, skin/connective-tissue disease and type V context. Mutant incorporation is explicitly
      proposed as very probable, not treated as newly demonstrated. Full original Methods were
      not recovered.
  full_text_unavailable: true
- id: Reactome:R-HSA-1474266
  title: Formation of collagen fibrils
  findings:
  - statement: Collagen fibrils are the principal tensile element of the extracellular matrix
      in animal connective tissues, with fibril diameter depending on tissue type and developmental
      stage.
    supporting_text: Collagen fibrils are the principal tensile element of the extracellular matrix
      in a wide range of animal connective tissues.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Formation of collagen fibrils contains type V collagen in extracellular fibrils;
      the chain contributes structure to assembly. Underlying cited papers were not all independently
      reread.
- id: Reactome:R-HSA-1564164
  title: Collagen type V degradation by MMP2,9,10
  findings:
  - statement: Type V collagen is a fibril-forming collagen that associates with types I and III
      as a minor but critical component of several matrices, and Col5a1-null mice almost completely
      lack collagen fibrils.
    supporting_text: COL5A1-/- mice have an almost complete lack of collagen fibrils reflecting
      a central role in fibrillogenesis
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The type V collagen degradation event contains extracellular COL5A1 as a substrate
      of MMP2, MMP9 and MMP10. The metalloproteinases perform the degradation; the collagen
      is not itself a protease. Underlying cited papers were not all independently reread.
- id: Reactome:R-HSA-2002428
  title: Removal of fibrillar collagen N-propeptides
  findings:
  - statement: Type V collagen N-propeptide removal is only partial and is mediated by BMP-1,
      which cleaves within the alpha1 chain between the proline/arginine-rich and variable domains.
    supporting_text: Type V collagen N-propeptide removal is partial, and reported to be mediated
      by BMP-1
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: N-terminal propeptide processing places collagen V precursor-derived material
      extracellularly. Type V processing is partial, and the summary describes BMP1 cleavage
      of alpha1(V); the collagen chain does not catalyze proteolysis. Underlying cited papers
      were not all independently reread.
- id: Reactome:R-HSA-2002440
  title: Removal of fibrillar collagen C-propeptides
  findings:
  - statement: The C-propeptides, which inhibit fibril formation, are removed by tolloid-family
      proteinases, generally extracellularly but sometimes within the secretory pathway.
    supporting_text: These propeptides, particularly the C-propeptide, inhibit fibril formation
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: C-terminal propeptide cleavage occurs in procollagen-containing material.
      The summary distinguishes chain-dependent type V processing by furin-like convertases
      and/or BMP1; COL5A1 is their substrate. Retain the source extracellular location without
      claiming that every processing event occurs exclusively outside cells. Underlying cited
      papers were not all independently reread.
- id: Reactome:R-HSA-2022073
  title: Procollagen triple helix formation
  findings:
  - statement: Procollagen triple-helix formation is nucleated by C-terminal prodomain alignment
      and proceeds C-to-N in the rough endoplasmic reticulum.
    supporting_text: Alignment of the C-terminal prodomains initiates triple helix formation,
      which propagates in a zipper-like fashion in the C-to-N direction. This occurs in the rough
      endoplasmic reticulum
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The current triple-helix formation event resolves the COL5A1 precursor in
      the ER lumen. Retain this location while distinguishing COL5A1 structural assembly from
      the enzymes and transport machinery acting on it. Its separate extracellular source assertions
      concern later material and remain intact. Underlying cited papers were not all independently
      reread.
- id: Reactome:R-HSA-2089971
  title: Secretion of collagens
  findings:
  - statement: Assembled collagen trimers leave the ER, traverse the Golgi and are secreted into
      the extracellular space, where they are organized into higher-order structures.
    supporting_text: Trimers are exported from the ER and trafficked through the Golgi network
      before secretion into the extracellular space and organization into higher order structures.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The association/secretion event includes both luminal precursors and exported
      collagen material. This source assertion concerns its extracellular destination; its separate
      ER annotation is retained independently. Underlying cited papers were not all independently
      reread.
- id: Reactome:R-HSA-2213201
  title: Formation of collagen fibres
  findings:
  - statement: Fibrils are components of larger suprafibrillar fibres whose organization varies
      between tissues and is largely mediated by surface-associated glycosaminoglycans and small
      leucine-rich proteoglycans.
    supporting_text: Interactions between fibrils are thought to be largely mediated by surface-associated
      macromolecules, such as anionic glycosaminoglycans (GAGs) and small leucine-rich proteoglycans
      such as decorin.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Formation of collagen fibers places fibrils in extracellular supramolecular
      structures. The summary discusses tissue-specific organization and surface-associated
      GAG/proteoglycan interactions; this is not an isolated alpha1(V) crosslink-enzyme assay.
      Underlying cited papers were not all independently reread.
- id: Reactome:R-HSA-2327695
