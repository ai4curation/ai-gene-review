id: Q8NFW8
gene_symbol: CMAS
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CMAS is human N-acylneuraminate cytidylyltransferase (CMP-N-acetylneuraminic acid
  synthase; EC 2.7.7.43), the enzyme that activates free sialic acid for use in
  glycoconjugate biosynthesis. It condenses N-acetylneuraminate (Neu5Ac) with CTP to
  form the sugar-nucleotide donor CMP-N-acetylneuraminate (CMP-Neu5Ac) plus
  diphosphate; the enzyme also acts on other sialic acids including
  N-glycolylneuraminate (Neu5Gc) and KDN. CMP-Neu5Ac is the universal donor substrate
  used by sialyltransferases (after transport into the Golgi by the CMP-sialic acid
  transporter SLC35A1) to sialylate glycoproteins and glycolipids. The active enzyme is
  a homotetramer (a dimer of dimers). Unusually among the sialic-acid biosynthetic
  enzymes, human CMAS localizes at least partly to the nucleus; its basic-cluster (BC2)
  motif directs nuclear localization and contains the catalytic active site, although
  nuclear localization is not itself required for catalytic activity. CMAS is
  ubiquitously expressed.
alternative_products:
- name: '1'
  id: Q8NFW8-1
  description: >-
    Canonical 434-residue isoform (sequence displayed in UniProt Q8NFW8). This is
    the form that carries both the N-terminal cytidylyltransferase domain and the
    C-terminal region, and to which the catalytic activity, homotetramer and
    nuclear-localization annotations refer.
- name: '2'
  id: Q8NFW8-2
  sequence_note: VSP_012764
  description: >-
    Alternatively spliced isoform lacking residues 264-434, i.e. the entire
    C-terminal half of the protein downstream of the cytidylyltransferase domain.
    Reported from cDNA sequencing (PubMed:15489334); no isoform-specific activity,
    oligomeric state or localization has been measured, so no annotation is
    assigned to it. Because the active enzyme is a dimer of dimers, whether this
    truncation can still tetramerize is an open question raised under
    suggested_questions.
existing_annotations:
- term:
    id: GO:0008781
    label: N-acylneuraminate cytidylyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Core catalytic molecular function. CMAS condenses N-acylneuraminate with CTP to
      form CMP-N-acyl-beta-neuraminate plus diphosphate (EC 2.7.7.43), the activation
      step for sialic acid. The phylogenetic (IBA) inference is well supported by the
      experimentally verified human enzyme activity and by orthologs across fly, mouse
      and zebrafish. This is the primary function of the gene.
    action: ACCEPT
    reason: >-
      ACCEPT: this is the gene's defining molecular function, and enables is correct
      because CMAS performs the cytidylyl transfer itself - the homotetramer is made
      of identical subunits, so there is no partner subunit contributing the active
      site. The node placement is sound and the human gene is inside the clade that
      inherited the function: the WITH/FROM for PANTHER:PTN000486303 spans fly
      (FB:FBgn0052220), mouse (MGI:MGI:1337124), two zebrafish genes and
      UniProtKB:Q3SZM5. Human CMAS additionally has its own experimental grounding
      (ECO:0000269|PubMed:11602804 on the UniProt catalytic-activity line), so this
      IBA is corroborated rather than standing alone.
    supported_by:
    - reference_id: file:human/CMAS/CMAS-uniprot.txt
      supporting_text: "Reaction=an N-acylneuraminate + CTP = a CMP-N-acyl-beta-neuraminate +"
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Electronic annotation from the UniProt Swiss-Prot subcellular-location mapping.
      It correctly mirrors the experimentally determined nuclear localization of human
      CMAS. Redundant with the HDA nucleus annotation (PMID:21630459) but correct.
    action: ACCEPT
    reason: >-
      ACCEPT: this is the unusual case of a subcellular-location IEA whose source
      statement is itself experimental - UniProt's SUBCELLULAR LOCATION line reads
      "Nucleus {ECO:0000269|PubMed:11602804}", so the SL-0191 mapping is transcribing a
      measured localization rather than predicting one. The nuclear location is also
      what makes CMAS distinctive among the sialic-acid biosynthetic enzymes, which are
      otherwise cytosolic, and it is independently corroborated by the sperm-nucleus
      proteome (PMID:21630459). Kept as the core location.
    supported_by:
    - reference_id: file:human/CMAS/CMAS-uniprot.txt
      supporting_text: "Nucleus {ECO:0000269|PubMed:11602804}."
- term:
    id: GO:0008781
    label: N-acylneuraminate cytidylyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Automated molecular-function annotation derived from the Rhea/EC mapping
      (RHEA:11344, EC 2.7.7.43). Identical to the core catalytic function and consistent
      with the experimentally characterized enzyme.
    action: ACCEPT
    reason: >-
      ACCEPT: the RHEA:11344 / EC 2.7.7.43 mapping reaches the specific activity term
      directly from the reaction UniProt records for this entry, which is an
      independent route to the same conclusion as the phylogenetic IBA. Note that the
      term and the reaction are both deliberately general ("N-acylneuraminate" rather
      than Neu5Ac specifically), which matches the enzyme's substrate tolerance for
      Neu5Gc and KDN; no more specific term would be correct here.
    supported_by:
    - reference_id: file:human/CMAS/CMAS-uniprot.txt
      supporting_text: "ChEBI:CHEBI:37563, ChEBI:CHEBI:60073, ChEBI:CHEBI:68671; EC=2.7.7.43;"
- term:
    id: GO:0006054
    label: N-acetylneuraminate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      Correct but a broad parent process. CMAS acts on N-acetylneuraminate, so
      involvement in its metabolism is accurate. However the specific product of the
      CMAS reaction is CMP-N-acetylneuraminate, so the more precise process term
      GO:0006055 (CMP-N-acetylneuraminate biosynthetic process) better captures the
      core biological role. Retained as non-core (less-precise ancestor).
    action: KEEP_AS_NON_CORE
    reason: >-
      KEEP_AS_NON_CORE rather than MODIFY, because the two terms are not simply
      parent and child of one claim. GO:0006054 covers the metabolism of
      N-acetylneuraminate, which is CMAS's substrate, whereas GO:0006055 covers the
      biosynthesis of CMP-N-acetylneuraminate, which is its product; CMAS genuinely
      participates in both, by consuming the former and making the latter. The
      UniPathway source (UPA00628, "Amino-sugar metabolism; N-acetylneuraminate
      metabolism") is the pathway UniProt actually assigns, so the row is accurate at
      its own level of description. It is non-core only because the product term is the
      sharper statement of what the enzyme does, and that is the one carried into
      core_functions with experimental (IMP) support.
    supported_by:
    - reference_id: file:human/CMAS/CMAS-uniprot.txt
      supporting_text: "Amino-sugar metabolism; N-acetylneuraminate metabolism."
- term:
    id: GO:0005730
    label: nucleolus
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      Immunofluorescence (HPA) sub-nuclear localization to the nucleolus. Consistent
      with the established nuclear localization of CMAS, but the nucleolar
      sub-compartment is not functionally established as the site relevant to catalysis
      (the enzyme is also seen in nucleoplasm and is active independent of nuclear
      import). Kept as a valid but non-core localization detail.
    action: KEEP_AS_NON_CORE
    reason: >-
      KEEP_AS_NON_CORE: the observation is a direct immunofluorescence assay curated
      by HPA and is not disputed - it is a real sub-nuclear signal, consistent with the
      experimentally established nuclear localization. It is non-core because no
      function has been tied to the nucleolar pool specifically: UniProt records that
      the BC2 motif both directs nuclear import and contains the active site, yet
      "the localization in the nucleus is however not required for the enzyme
      activity", so sub-nuclear position is not where the catalytic story lies. This
      row carries no PMID (its reference is the HPA curation GO_REF), so no literature
      quote can be attached to it.
    supported_by:
    - reference_id: file:human/CMAS/CMAS-uniprot.txt
      supporting_text: "Nucleus {ECO:0000269|PubMed:11602804}."
- term:
    id: GO:0006055
    label: CMP-N-acetylneuraminate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:31121216
  qualifier: involved_in
  review:
    summary: >-
      Core biological process, experimentally supported. Willems et al. (2019) showed
      that CMAS-knockout cells have undetectable CMP-sialic acid, directly
      demonstrating that CMAS is required for CMP-N-acetylneuraminate biosynthesis. This
      is the precise process term for the CMAS reaction and represents the core
      biological role of the gene.
    action: ACCEPT
    reason: >-
      ACCEPT, and the participation test is satisfied on grounds stronger than the
      knockout result alone. The knockout shows CMAS is necessary; what makes
      involved_in correct is that CMAS performs the actual chemistry of the process -
      the reaction that forms CMP-N-acetylneuraminate from Neu5Ac and CTP is the
      biosynthetic step the term names, so the gene product does the work rather than
      merely being required for it. The knockout evidence then confirms that no other
      human enzyme substitutes: CMP-sialic acid is undetectable in CMAS KO, whereas it
      is only reduced in GNE and NANS KO, which places CMAS at the single committed
      step. Note the paper's title is about NANP; CMAS is one arm of its knockout
      panel, and the abstract states the CMAS result explicitly.
    supported_by:
    - reference_id: PMID:31121216
      supporting_text: "CMP-sialic acid was dramatically reduced \nin GNE and NANS KO cells and undetectable in CMAS KO."
- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: >-
      Derived from a large-scale membrane-proteome MS survey of an NK-like cell line.
      CMAS is a soluble nuclear/cytosolic enzyme (homotetramer) with no transmembrane
      domain or signal peptide, and the study itself notes that a large fraction of
      identified proteins are only transiently associated with membranes rather than
      integral. Capture in a membrane preparation is best interpreted as a proteomics
      artifact, not a functional membrane localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MARK_AS_OVER_ANNOTATED, which is the right action here precisely because the
      problem is a claim exceeding the evidence rather than a missing one: the
      measurement (CMAS peptides in a membrane fraction) is real, but the inference
      from it to a membrane location is not supported. Q8NFW8 has no transmembrane
      segment, no signal peptide and no lipid-anchor site, and its established
      compartment is the nucleus. The authors are explicit about the limitation -
      only about 40% of their 1843 identifications were predicted to be plausible
      membrane proteins, and they describe the remainder as species that would be
      predicted to be transiently associated with membranes. A soluble nuclear enzyme
      falls in that second group. REMOVE is not used because this is an experimental
      high-throughput dataset row whose underlying observation stands; the flag records
      that the compartment assignment should not be relied on.
    supported_by:
    - reference_id: PMID:19946888
      supporting_text: >-
        The remaining species were largely involved in cellular processes and
        molecular functions that could be predicted to be transiently associated with
        membranes.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:21630459
  qualifier: located_in
  review:
    summary: >-
      High-throughput MS identification of CMAS in the isolated human sperm nucleus
      proteome. Corroborates the experimentally established nuclear localization of
      CMAS (Lawrence et al. 2001). Consistent and correct.
    action: ACCEPT
    reason: >-
      ACCEPT: unlike the membrane HDA row, this high-throughput dataset supports a
      compartment that is already established for CMAS by low-throughput experiment
      (UniProt's Nucleus line, ECO:0000269|PubMed:11602804), so the two lines of
      evidence converge. The preparation is also unusually clean for an organellar
      proteome - the authors report sperm nuclei isolated to over 99.9% purity with no
      tail fragments, acrosome or mitochondria - which is what makes the nuclear
      assignment credible here rather than a co-isolation artefact. Cell-type caveat
      worth noting: the observation is in mature spermatozoa, whereas the broader
      nuclear localization rests on somatic-cell work.
    supported_by:
    - reference_id: PMID:21630459
      supporting_text: >-
        sperm nuclei were obtained through CTAB treatment and isolated to over 99.9%
        purity without any tail fragments, acrosome or mitochondria
- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-4084982
  qualifier: located_in
  review:
    summary: >-
      Reactome traceable-author-statement placing CMAS in the nucleoplasm. Reactome
      states that CMAS localizes to the nucleus in mammalian cells; nucleoplasm is a
      reasonable sub-nuclear compartment consistent with the experimental nuclear
      localization. Kept as a valid but non-core localization detail.
    action: KEEP_AS_NON_CORE
    reason: >-
      KEEP_AS_NON_CORE: the parent claim Reactome actually asserts is nuclear
      localization, which is experimentally established; nucleoplasm is Reactome's
      compartment assignment for modelling the reaction and is consistent with that,
      but it is a modelling choice rather than a measurement. Together with the HPA
      nucleolus IDA it means CMAS has two different sub-nuclear terms from two sources,
      neither tied to a function, which is why both are non-core and GO:0005634 nucleus
      is the location used in core_functions. No PMID accompanies this row, so no
      literature quote can be attached; the supporting quote is Reactome's own
      statement.
    supported_by:
    - reference_id: Reactome:R-HSA-4084982
      supporting_text: "CMAS is ubiquitously expressed and localizes to the nucleus in mammalian cells."
core_functions:
- description: >-
    N-acylneuraminate cytidylyltransferase (CMP-sialic acid synthase) activity: CMAS
    condenses free N-acetylneuraminate (Neu5Ac; also Neu5Gc and KDN) with CTP to form
    the sugar-nucleotide donor CMP-N-acetylneuraminate plus diphosphate, activating
    sialic acid for downstream sialyltransferase reactions. The active enzyme is a
    homotetramer localized (at least partly) to the nucleus.
  molecular_function:
    id: GO:0008781
    label: N-acylneuraminate cytidylyltransferase activity
  directly_involved_in:
  - id: GO:0006055
    label: CMP-N-acetylneuraminate biosynthetic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/CMAS/CMAS-uniprot.txt
    supporting_text: "Reaction=an N-acylneuraminate + CTP = a CMP-N-acyl-beta-neuraminate +"
    reference_section_type: DATABASE_ENTRY
  - reference_id: PMID:31121216
    supporting_text: "CMP-sialic acid was dramatically reduced \nin GNE and NANS KO cells and undetectable in CMAS KO."
    reference_section_type: ABSTRACT
  - reference_id: file:human/CMAS/CMAS-uniprot.txt
    supporting_text: "Nucleus {ECO:0000269|PubMed:11602804}."
    reference_section_type: DATABASE_ENTRY
suggested_questions:
- question: >-
    UniProt records that the BC2 basic-cluster motif both directs nuclear import and
    contains the catalytic active site, yet nuclear localization is not required for
    activity. What does the nuclear pool of CMAS actually do - is CMP-Neu5Ac made in
    the nucleus and exported, or is nuclear residence a consequence of the active
    site overlapping an import signal and of no functional consequence?
- question: >-
    Two different sub-nuclear compartments are annotated from two sources (nucleolus
    by HPA immunofluorescence, nucleoplasm by Reactome), neither tied to a function.
    Does CMAS partition between nucleolus and nucleoplasm in a regulated way, and
    does either pool differ in oligomeric state or activity?
- question: >-
    The enzyme accepts Neu5Ac, Neu5Gc and KDN. Humans cannot synthesize Neu5Gc
    because CMAH is inactivated, so dietary Neu5Gc is the only source. Does CMAS
    discriminate kinetically between Neu5Ac and Neu5Gc, and does that selectivity set
    how much dietary Neu5Gc is incorporated into human glycoconjugates?
- question: >-
    Isoform 2 (Q8NFW8-2) lacks residues 264-434, the entire C-terminal half. Given
    that the active enzyme is a dimer of dimers, is this isoform expressed as stable
    protein, can it tetramerize, and does it retain or inhibit cytidylyltransferase
    activity?
suggested_experiments:
- hypothesis: >-
    Nuclear localization of CMAS is dispensable for cellular sialylation: a
    cytoplasm-restricted CMAS variant rescues CMP-Neu5Ac levels and cell-surface
    sialylation in CMAS-knockout cells as well as the wild-type enzyme does.
  description: >-
    In CMAS-knockout cells, re-express wild-type CMAS alongside variants whose
    localization is forced - a BC2-disrupted or nuclear-export-signal-fused construct
    that is excluded from the nucleus, and a construct retained in the nucleus -
    choosing BC2 substitutions that preserve catalysis in vitro so that import and
    activity are separated. Quantify CMP-sialic acid by LC-MS and cell-surface
    sialylation by MAA/PNA lectin binding and by flow cytometry. Equivalent rescue by
    the cytoplasmic variant would show the nuclear pool is functionally dispensable
    and argue that nucleus should stay a location annotation without a corresponding
    nuclear process term.
  experiment_type: localization-restricted rescue with metabolite and lectin readouts
- hypothesis: >-
    CMAS discriminates kinetically against N-glycolylneuraminate relative to
    N-acetylneuraminate, and that selectivity limits incorporation of dietary Neu5Gc
    into human glycoconjugates.
  description: >-
    Purify recombinant human CMAS and measure steady-state kinetics (Km, kcat) for
    Neu5Ac, Neu5Gc and KDN at fixed CTP, and for CTP at fixed sugar, quantifying the
    CMP-sugar products by LC-MS or by a coupled pyrophosphate assay. Then feed cells
    equimolar Neu5Ac and Neu5Gc and measure the resulting CMP-sugar pools and surface
    incorporation, testing whether the cellular ratio tracks the in vitro
    specificity constants. This would give the substrate-preference data the general
    GO term GO:0008781 deliberately leaves open.
  experiment_type: comparative enzyme kinetics with cellular incorporation assay
- hypothesis: >-
    Isoform 2 (Q8NFW8-2), which lacks the C-terminal half of the protein, cannot form
    the active dimer-of-dimers and is catalytically inactive.
  description: >-
    Express isoform 1 and isoform 2 separately and together, determine the oligomeric
    state of each product by size-exclusion chromatography and native gel (with
    mass photometry if available), and assay N-acylneuraminate cytidylyltransferase
    activity in each case. Test whether tagged isoform 2 co-purifies with isoform 1
    and whether co-expression lowers specific activity. This distinguishes an inert
    product from a dominant-negative one and would establish whether isoform 2
    warrants any annotation of its own.
  experiment_type: isoform co-expression with oligomeric-state and activity analysis
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      GO_Central phylogenetic inference assigns CMAS N-acylneuraminate
      cytidylyltransferase activity (GO:0008781) from node PANTHER:PTN000486303, whose
      descendant evidences include fly (FB:FBgn0052220), mouse (MGI:MGI:1337124), two
      zebrafish genes (ZFIN:ZDB-GENE-050420-277, ZFIN:ZDB-GENE-120427-1) and
      UniProtKB:Q3SZM5. The activity is thus ancestral across metazoa, and human CMAS
      sits inside the clade that inherited it.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the single IBA row; node and WITH/FROM entries taken from
      the GOA row. The donor set spans three model organisms, and the target gene also
      has its own experimental grounding, so the transfer is corroborated.
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings:
  - statement: >-
      Source of the GO:0006054 row, from UniPathway UPA00628, which UniProt records
      as "Amino-sugar metabolism; N-acetylneuraminate metabolism". The mapping
      describes the pathway CMAS's substrate belongs to, which is why the resulting
      term is about N-acetylneuraminate metabolism rather than about the
      CMP-N-acetylneuraminate the enzyme actually makes.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the UniPathway-derived process row. The term is accurate at
      its own level of description; it is non-core only because the product-specific
      term GO:0006055 is the sharper claim and has experimental support.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      Source of the GO:0005634 nucleus IEA row, via UniProtKB-SubCell:SL-0191.
      Unusually for a location IEA, the statement being mapped is itself experimental:
      UniProt's SUBCELLULAR LOCATION line reads "Nucleus
      {ECO:0000269|PubMed:11602804}", so this pipeline is transcribing a measured
      localization rather than predicting one from sequence features.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the nucleus IEA. Worth flagging that its evidential weight
      is higher than a typical IEA, because the underlying Swiss-Prot statement
      carries ECO:0000269 experimental evidence.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: >-
      Source of the GO:0005730 nucleolus IDA row, from Human Protein Atlas
      immunofluorescence curation. The row carries no PMID, which is why no literature
      quote can be attached to that annotation. The observation is a direct assay and
      is consistent with CMAS's established nuclear localization, but no function has
      been tied to the nucleolar pool.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the HPA immunofluorescence curation route. The sub-nuclear
      detail is credible but functionally unanchored, and it is one of two different
      sub-nuclear terms annotated to CMAS from two different sources.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined multi-method electronic annotation reaches the specific catalytic term
      GO:0008781 from the Rhea reaction (RHEA:11344) and the EC number (2.7.7.43),
      agreeing with both the phylogenetic IBA and UniProt's experimentally evidenced
      catalytic-activity line. Both the term and the reaction are deliberately general
      in substrate ("N-acylneuraminate"), which matches the enzyme's tolerance for
      Neu5Gc and KDN as well as Neu5Ac.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the RHEA/EC-derived activity row; this pipeline reaches the
      precise activity term rather than a superfamily-level ancestor.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings:
  - statement: >-
      A membrane-proteome MS survey of the NK-like YTS cell line identified 1843
      proteins, of which only about 40% were predicted to be plausible membrane
      proteins; the authors describe the remainder as proteins that would be predicted
      to be transiently associated with membranes. CMAS - a soluble nuclear enzyme
      with no transmembrane segment, signal peptide or lipid anchor - falls in that
      second group, which is the basis for flagging its membrane annotation as an
      over-annotation rather than accepting it.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The remaining species were largely involved in cellular processes and molecular
      functions that could be predicted to be transiently associated with membranes.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Large-scale membrane-proteome MS of an NK-like cell line. Correctly cited for the
      "membrane" HDA capture, but this reflects proteomics co-isolation of a soluble
      nuclear/cytosolic enzyme rather than genuine membrane localization; low relevance
      to CMAS function. The paper's own stated limitation is what makes the
      over-annotation call checkable rather than merely plausible.
- id: PMID:21630459
  title: Proteomic characterization of the human sperm nucleus.
  findings:
  - statement: >-
      403 proteins were identified from human sperm nuclei isolated to over 99.9%
      purity, verified free of tail fragments, acrosome and mitochondria by optical and
      transmission electron microscopy. CMAS is among them, which corroborates its
      experimentally established nuclear localization; the unusual purity of the
      preparation is what distinguishes this high-throughput row from a co-isolation
      artefact.
    reference_section_type: ABSTRACT
    supporting_text: >-
      sperm nuclei were obtained through CTAB treatment and isolated to over 99.9%
      purity without any tail fragments, acrosome or mitochondria
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Human sperm nucleus proteome MS. Correctly cited; corroborates the nuclear
      localization of CMAS as a high-throughput dataset annotation. Cell-type caveat:
      the observation is in mature spermatozoa, while the primary nuclear-localization
      work was done in somatic cells.
- id: PMID:31121216
  title: Activity of N-acylneuraminate-9-phosphatase (NANP) is not essential for de
    novo sialic acid biosynthesis.
  findings:
  - statement: >-
      CMAS-knockout cells have undetectable CMP-sialic acid, demonstrating that CMAS is
      required for CMP-N-acetylneuraminate (CMP-sialic acid) biosynthesis.
    reference_section_type: RESULTS
    supporting_text: "CMP-sialic acid was dramatically reduced \nin GNE and NANS KO cells and undetectable in CMAS KO."
  - statement: >-
      The contrast within the same knockout panel is what places CMAS at the single
      committed step: CMP-sialic acid is only dramatically reduced in GNE and NANS
      knockouts, but undetectable in CMAS knockout, so no other human enzyme
      substitutes for the cytidylyltransferase reaction. Cell-surface sialylation was
      correspondingly reduced in GNE, NANS and CMAS knockouts.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Sialylation of cell surface glycans was reduced by KO of GNE
      (UDP-N-acetylglucosamine 2-epimerase/N-acetylmannosamine kinase), NANS (sialic
      acid synthase) and CMAS (N-acylneuraminate cytidylyltransferase) genes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Although the paper's title/focus is NANP, its knockout panel includes CMAS and
      directly shows CMP-sialic acid is undetectable in CMAS KO, supporting the
      GO:0006055 IMP annotation. Cache is abstract-only but the abstract states this
      result explicitly. This is a normal pattern, not a curation error: the title
      foregrounds one gene while the experiments also assay others.
- id: Reactome:R-HSA-4084982
  title: CMAS transfers CMP from CTP to Neu5Ac, forming CMP-Neu5Ac
  findings:
  - statement: >-
      Reactome curates CMAS as transferring CMP from CTP to Neu5Ac to form CMP-Neu5Ac,
      records that the enzyme is ubiquitously expressed and nuclear in mammalian cells,
      that the active form is a homotetramer (a dimer of dimers), and that CMP-Neu5Ac
      is the donor substrate for sialyltransferases. The nucleoplasm annotation is
      Reactome's compartment assignment for modelling this reaction; the claim its
      summary actually makes is nuclear localization.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      CMAS is ubiquitously expressed and localizes to the nucleus in mammalian cells.
      The active form of the enzyme is a homotetramer (a dimer of dimers)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for the CMAS-catalyzed conversion of Neu5Ac + CTP to CMP-Neu5Ac;
      supports the core catalytic function and nuclear localization. The nucleoplasm
      sub-compartment is a modelling choice rather than a measurement, which is why
      that row is kept non-core.
- id: file:human/CMAS/CMAS-uniprot.txt
  title: UniProt entry Q8NFW8 (NEUA_HUMAN), N-acylneuraminate cytidylyltransferase
  findings:
  - statement: >-
      CMAS activates N-acetylneuraminate to CMP-N-acetylneuraminate, the substrate
      required for addition of sialic acid, and has activity toward Neu5Ac, Neu5Gc and
      KDN. The catalytic-activity line (RHEA:11344, EC 2.7.7.43) carries
      ECO:0000269|PubMed:11602804, so the activity is experimentally established for
      the human protein rather than inferred by similarity.
    reference_section_type: DATABASE_ENTRY
    supporting_text: "Reaction=an N-acylneuraminate + CTP = a CMP-N-acyl-beta-neuraminate +"
  - statement: >-
      The active enzyme is a homotetramer formed as a dimer of dimers, and the protein
      localizes to the nucleus (ECO:0000269|PubMed:11602804) - unusual among the
      sialic-acid biosynthetic enzymes, which are otherwise cytosolic.
    reference_section_type: DATABASE_ENTRY
    supporting_text: "Nucleus {ECO:0000269|PubMed:11602804}."
  - statement: >-
      The BC2 basic-cluster motif is necessary and sufficient for nuclear localization
      and contains the catalytic active site, but nuclear localization is not required
      for enzyme activity. This separability is the reason the nucleus is annotated as
      a location without a corresponding nuclear process term, and it motivates the
      localization-restricted rescue experiment proposed here.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      The localization in the nucleus is however not required for the enzyme
      activity
  - statement: >-
      Expression is ubiquitous across pancreas, kidney, liver, skeletal muscle, lung,
      placenta, brain, heart, colon, PBL, small intestine, ovary, testis, prostate,
      thymus and spleen (ECO:0000269|PubMed:11602804); HPA records low tissue
      specificity. The protein belongs to the CMP-NeuNAc synthase family.
    reference_section_type: DATABASE_ENTRY
    supporting_text: "TISSUE SPECIFICITY: Ubiquitously expressed. Expressed in pancreas,"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The authoritative source for CMAS's catalytic activity, substrate tolerance,
      oligomeric state, nuclear localization and BC2 motif. Unlike several other genes
      in this batch, the key statements here carry ECO:0000269 experimental evidence
      (PubMed:11602804, Lawrence et al. 2001) rather than by-similarity transfer -
      though that paper is not itself cached in this repository, so it is quoted
      through the UniProt record.
