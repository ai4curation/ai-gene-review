  evidence_type: TAS
  original_reference_id: PMID:32144120
  qualifier: enables
  review:
    summary: 'Proposed NEW: demonstrated xenobiotic (drug) transmembrane transporter activity of MCT6.'
    action: NEW
    reason: The only experimentally demonstrated transport activity of MCT6 is of monocarboxylate 
      xenobiotic drugs (bumetanide, nateglinide, probenecid, prostaglandin F2-alpha; Murakami 2005, 
      Kohyama 2013, Jones 2017, reviewed in Felmlee 2020). MCT6 performs the transport step, so 
      xenobiotic transmembrane transporter activity is warranted as a NEW, more specific molecular 
      function alongside the family-level GO:0008028. Added, not substituted.
    supported_by:
    - reference_id: PMID:32144120
      supporting_text: 'MCT6 has been shown to transport a small set of xenobiotics: bumetanide, nateglinide,
        probenecid'
