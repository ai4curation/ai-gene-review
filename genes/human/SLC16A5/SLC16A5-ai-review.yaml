core_functions:
- description: Proton-coupled transmembrane transport of monocarboxylate xenobiotic drugs 
    (bumetanide, nateglinide, probenecid, prostaglandin F2-alpha) across the plasma membrane; the 
    endogenous physiological substrate is uncertain.
  molecular_function:
