  label: Homo sapiens
description: 'SLC16A5 encodes monocarboxylate transporter 6 (MCT6; historically also called MCT5), a multi-pass
  plasma-membrane protein of the SLC16/monocarboxylate-transporter family (major facilitator superfamily,
  monocarboxylate porter family, TC 2.A.1.13) with the characteristic 12-transmembrane-helix MCT topology.
  Unlike the lactate- and pyruvate-transporting MCT1-4, MCT6 has been characterised chiefly as a carrier
  of organic-anion drugs - for example the loop diuretic bumetanide and the antidiabetic nateglinide -
  and robust proton-coupled transport of the classical monocarboxylates lactate and pyruvate has not been
  demonstrated for it. Its endogenous physiological substrate(s) remain uncertain.'
