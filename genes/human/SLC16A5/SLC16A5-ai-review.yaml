      probenecid'
suggested_questions:
- question: Does MCT6 (SLC16A5) transport an endogenous monocarboxylate physiological substrate, or 
    is its physiological role confined to disposition of xenobiotic drugs such as bumetanide and 
    nateglinide?
suggested_experiments:
- description: Using the established MCT6 heterologous transport assay, screen endogenous 
    monocarboxylates (lactate, pyruvate, ketone bodies, short-chain fatty acids) against the known 
    drug substrates to determine whether MCT6 has an endogenous substrate or is primarily a 
    xenobiotic transporter, and define its proton/ion dependence.
