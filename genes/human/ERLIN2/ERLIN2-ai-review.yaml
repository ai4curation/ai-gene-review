suggested_questions:
- question: Does human ERLIN2 itself bind native cholesterol, or does binding require ERLIN1 or a defined
    erlin complex, and how does that distinction affect SREBP restraint and cholesterol esterification?
- question: Which ERLIN2 assembly surfaces control partner selection and substrate handling, and can TMUB1
    and RNF170 occupy the same erlin assembly simultaneously?
- question: How do verified ERLIN2 disease variants alter cargo handling or partner recruitment despite
    apparently preserved gross oligomerization, and is RNF213 causally involved in the reported Val71Ala
    cellular phenotype?
- question: Are the reported 152- and 206-amino-acid ERLIN2 products expressed as stable proteins, and
    do they localize or assemble with the canonical product?
suggested_experiments:
- description: Compare composition-defined human ERLIN2, ERLIN1 and mixed complexes in native cholesterol-binding
    and photoaffinity assays, with competition, no-probe controls and matched stability/oligomerization
    measurements. Establish which protein binds before assigning a site or interpreting SREBP phenotypes
    as binding defects.
- description: Reconstitute erlin assemblies with TMUB1, RNF170 and an activated IP3R substrate to separate
    partner occupancy, substrate recognition and ubiquitin transfer; use the same assembly perturbations
    in misfolded A1AT-NHK/TTR-D18G turnover assays to test whether receptor handling and quality control
    use common interfaces.
- description: Use isogenic correction or introduction of sequence-verified disease variants at endogenous
    expression levels, coupled to cargo turnover and partner-association measurements. For the Val71Ala/RNF213
    model, test RNF213 depletion and rescue, IP3R1 ubiquitination and half-life before assigning a degradation
    mechanism.
