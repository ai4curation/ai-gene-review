- id: PMID:38782601
  title: ERLIN1/2 scaffolds bridge TMUB1 and RNF170 and restrict cholesterol esterification to regulate
    the secretory pathway.
  findings:
  - statement: Human HeLa ERLIN1/2 double knockout weakens TMUB1-RNF170 association and increases cholesterol
      esterification and lipid storage; erlin re-expression restores measured phenotypes. AlphaFold models
      propose interfaces involving adjacent erlin subunits, but simultaneous partner occupancy and atomic
      interfaces were not experimentally resolved.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official identifier and DOI 10.26508/lsa.202402620 verified in the accepted source
      record. Actual main Results, Discussion and Methods were read: Figures 1-3 association/assembly
      experiments, Figures 7-8 lipid measurements and avasimibe intervention; normal full text lines 200-365,
      455-660, 751-865, 1008-1075 and 1240-1261. No figure pixels, supplements or raw model coordinates
      were inspected in this synthesis. ERLIN1/2 double knockout increases, rather than limits, cholesterol
      esterification. Re-expression and SOAT1 inhibition support the cellular phenotype, not direct ERLIN2
      cholesterol transport or a purified binding mechanism. Proposed SPFH interfaces are AlphaFold models;
      destabilizing ERLIN2 mutants do not independently resolve physical contacts, and simultaneous TMUB1/RNF170
      occupancy remains unproven.'
- id: PMID:40225166
