- description: Restrains SREBP activation as part of the ER sterol-regulatory machinery, limiting activation
    of cholesterol-biosynthetic genes. Human ERLIN2 depletion increases SREBP processing and target-gene
    expression, and erlin complexes associate with SCAP-SREBP-Insig components. A gp78/TMUB1-associated
    contribution to HMG-CoA reductase turnover is supported in particular experimental systems but is
    not universal. The retained cholesterol-binding evidence concerns purified human ERLIN1 and a native
    mouse erlin1/2 complex; the available binding assays do not resolve ERLIN2-specific binding to native
    cholesterol.
