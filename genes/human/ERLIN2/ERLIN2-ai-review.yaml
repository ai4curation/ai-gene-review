- id: PMID:19751772
  title: SPFH1 and SPFH2 mediate the ubiquitination and degradation of inositol 1,4,5-trisphosphate receptors
    in muscarinic receptor-expressing HeLa cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual normal full original Methods and Results were read, including model-substrate
      Methods (line 127), human mHeLa recruitment/depletion, Figures 4-6 turnover and Figure 7 HMG-CoA
      reductase controls (lines 97-115, 155-173). Combined ERLIN1/2 depletion modestly stabilizes misfolded
      luminal A1AT-NHK and TTR-D18G, including slowed cycloheximide-chase turnover in HeLa; TCRalpha and
      cytosolic GFPu controls are unaffected. This supports selective complex-level quality control, not
      a universal requirement for ERLIN2 in ERAD. ERLIN2 depletion also reduces ERLIN1; the rescue construct
      is mouse SPFH2. HMG-CoA reductase turnover is unaffected in the tested mHeLa and Rat1 conditions,
      bounding the later positive gp78-associated findings. No figure pixels or supplements inspected.
- id: PMID:21610068
  title: RNF170 protein, an endoplasmic reticulum membrane ubiquitin ligase, mediates inositol 1,4,5-trisphosphate
    receptor ubiquitination and degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official PMC primary search-rendered Methods, Results and figure captions were read,
      rather than treating the immutable abstract-only normal cache as full text: PMC3129221, Experimental
      Procedures, Interaction of RNF170 with the erlin1/2 complex, Depletion of endogenous RNF170, and
      Priority of binding to activated IP3 receptors; Figures 4-6, especially 5C/D. Endogenous human mHeLa
      ERLIN2 depletion inhibits RNF170 recruitment to stimulated IP3 receptors; reciprocal RNF170 depletion
      preserves ERLIN2 recruitment. These experiments support ordered complex-dependent recruitment, not
      purified binary affinity or ERLIN2 ubiquitin-transfer activity. The cloned 257-aa RNF170 is mouse
      even when expressed in human cells, and alphaT3-1/Rat1 experiments remain rodent. No figure pixels
      or supplements inspected.'
core_functions:
- description: 'Forms an integral structural subunit of the ERLIN1/ERLIN2 ER-membrane assembly and contributes
    to its scaffold activity. Complex assembly and partner organization support selective protein turnover:
    human ERLIN2 depletion impairs RNF170 recruitment to activated IP3 receptors, and combined erlin depletion
    modestly slows clearance of misfolded A1AT-NHK and TTR-D18G. The quality-control process is supported
    by those reporter assays; activated receptor turnover is a distinct regulatory substrate context.
    Individual subunit interfaces and simultaneous partner occupancy remain unresolved, and ERLIN2 is
    not the ubiquitin-transfer enzyme.'
