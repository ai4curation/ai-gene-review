- description: Associates with ER ubiquitin ligases, including gp78/AMFR, HRD1/SYVN1, TRC8/RNF139 and
    RNF185/RNF5, in cellular interaction assays. This is the ligase-association facet of ERLIN2 function,
    distinct from its structural contribution to the erlin assembly. TMUB1-mediated bridging and complex-dependent
    associations limit claims of direct binary binding or universal ligase recruitment; the RNF185/RNF5
    study tests CFTR processing principally through the ligases, rather than establishing an ERLIN2-specific
    CFTR degradation reaction.
