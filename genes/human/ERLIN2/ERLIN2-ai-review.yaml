id: O94905
gene_symbol: ERLIN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERLIN2 is an endoplasmic reticulum membrane protein whose canonical 339-amino-acid product
  contains a lumenal SPFH domain and assembles with ERLIN1 into large oligomeric complexes. These complexes
  provide a structural platform for selective protein handling and for associations with ER ubiquitin
  ligases. ERLIN2-dependent recruitment of RNF170 contributes to the ubiquitination and turnover of activated
  inositol 1,4,5-trisphosphate receptors, linking receptor abundance to calcium signaling. Erlin complexes
  also contribute to the clearance of selected misfolded ER proteins. ERLIN2 restrains SREBP activation
  through the ER sterol-regulatory machinery, while erlin loss alters cholesterol esterification and lipid
  storage. A role in sterol-dependent HMG-CoA reductase turnover varies with experimental context. ERLIN2-specific
  native cholesterol binding remains unresolved. Pathogenic ERLIN2 variants cause hereditary spastic paraplegia
  with recessive and dominant inheritance; their effects on assembly, partner selection and substrate
  handling can differ. The physiological functions of the reported 152- and 206-amino-acid products remain
  unestablished.
