- id: file:human/ERLIN2/ERLIN2-uniprot.txt
  title: UniProt entry O94905 (ERLN2_HUMAN), Erlin-2 / SPFH2
  findings:
  - statement: ERLIN2 is a single-pass type II ER membrane SPFH/prohibitin protein forming the ERLIN1/ERLIN2
      complex that mediates ERAD of IP3 receptors and HMGCR, binds cholesterol, restricts SREBP, and interacts
      with ER ubiquitin ligases (RNF170, AMFR, SYVN1, RNF139, RNF185/RNF5); variants cause SPG18.
    reference_section_type: OTHER
- id: PMID:23396283
  title: Proteome-wide mapping of cholesterol-interacting proteins in mammalian cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'https://doi.org/10.1038/nmeth.2368. Actual operative access: Indexed Results/Discussion
      17–35,44–48; Methods 53–61,64–66; Table 1 Total profile Excel row 437 and Group III row 138; Table
      3 controls row 465; vs PEA-DA & 10X Ch row 174; sterol probe comparison row 166. Human ERLIN2 is
      a positive Group III sterol-probe interactor: no-UV ratio 20, PEA-DA selectivity 3.1, cholesterol-competition
      ratio 1.3 in Table 1 and 1.4 in Table 3; vehicle ratio 13.3. The competition values are below the
      stated 1.5 threshold. Cis/epi/trans probe comparisons are 0.4/2/0.9. No figure pixels read. This
      is living-cell analogue labeling, not purified ERLIN2 affinity measurement; absence of threshold
      competition does not prove absence of cholesterol binding. Supplementary Tables 1 and 3 were actually
      parsed, other supplements were not read. See the public source guide for source and species boundaries.'
