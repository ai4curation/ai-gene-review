    in Patient-Derived Stem Cell Models.
  findings:
  - statement: Patient-derived cells carrying ERLIN2 p.Val71Ala show reduced IP3R1 abundance, altered
      calcium responses and increased ERLIN2/RNF213 and IP3R1/RNF213 association. RNF213-mediated IP3R1
      ubiquitination and degradation are proposed explanations, not demonstrated causal reactions in these
      experiments.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and DOI 10.1155/2023/4834423 verified in the accepted primary metadata. Actual
      original Methods and Results were read from PMC11919107, including cell derivation, calcium assays,
      co-immunoprecipitation and the Figure 3/4 results (indexed paragraphs 1-35 and 43-60). No figure
      pixels or supplements inspected. Patient-derived iPSC/NSC comparisons, including a related noncarrier
      comparison, are not isogenic variant correction experiments. The study measures IP3R1 abundance,
      calcium responses and association with RNF213; it does not supply RNF213-loss rescue, direct ubiquitin-transfer
      or substrate half-life evidence for the proposed degradation chain. TUDCA rescue does not specifically
      establish that chain. This disease-associated RNF213 model is distinct from the RNF170 receptor-turnover
      experiments.
