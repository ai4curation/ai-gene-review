id: P43007
gene_symbol: SLC1A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC1A4 (ASCT1/SATT) is a plasma-membrane, sodium-coupled obligate antiporter (exchanger)
  of small neutral amino acids, a member of the SLC1/dicarboxylate-amino-acid:cation symporter
  (DAACS) family that also contains the glutamate transporters (EAATs) and ASCT2. It mediates
  electroneutral homo- and hetero-exchange of L- and D-serine, L-alanine, L-threonine,
  L-cysteine and L-asparagine (and, more weakly, proline/4-hydroxyproline), coupled to inward
  co-transport of Na+, with negligible net amino acid flux; unlike the related EAATs it does not
  transport the acidic amino acids L-glutamate or L-aspartate, nor glutamine, and it does not
  couple to protons or counter-transport K+. Like other SLC1 members it also displays a
  substrate-gated, thermodynamically uncoupled anion conductance (permeability
  SCN- > NO3- > I- > Cl-). It is a homotrimeric multi-pass membrane protein that moves substrate
  by a one-gate elevator mechanism (transport domain formed by transmembrane helices 3, 6, 7 and
  8 and the HP1/HP2 hairpins). It is broadly expressed, with highest levels in brain, muscle and
  pancreas. In the brain it is enriched in astrocytes, where it is central to L-serine/D-serine
  homeostasis: by exchanging L-serine and D-serine it supports the astrocyte-to-neuron serine
  shuttle that supplies neurons with L-serine for de novo D-serine synthesis and helps regulate
  extracellular D-serine, the co-agonist of synaptic NMDA receptors. Biallelic loss-of-function
  variants cause spastic tetraplegia, thin corpus callosum and progressive microcephaly (SPATCCM).
