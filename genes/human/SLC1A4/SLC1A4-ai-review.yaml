- term:
    id: GO:0005254
    label: chloride channel activity
  evidence_type: IDA
  original_reference_id: PMID:8910405
  qualifier: enables
  review:
    summary: >-
      ASCT1 displays a substrate-gated, thermodynamically uncoupled anion conductance, a
      property shared across the SLC1 family. This is a genuine but secondary activity, distinct
      from the coupled amino acid exchange that is the transporter's core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Direct electrophysiology shows an uncoupled anion channel activated by substrate/Na+,
      with anion preference SCN- > NO3- > I- > Cl- (chloride is actually the least permeant of
      the tested anions). The activity is real but peripheral to the Na+-coupled neutral amino
      acid exchange that defines the protein, so it is retained as non-core.
    supported_by:
    - reference_id: PMID:8910405
      supporting_text: thermodynamically uncoupled chloride conductance
    - reference_id: file:human/SLC1A4/SLC1A4-uniprot.txt
      record_section: ["CC:FUNCTION"]
- term:
    id: GO:0005313
    label: L-glutamate transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0026439
  - MGI:MGI:101931
  - MGI:MGI:105083
