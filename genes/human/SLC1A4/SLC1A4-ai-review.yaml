  - RGD:3696
  - RGD:3697
  - RGD:3698
  - RGD:620340
  - UniProtKB:P43003
  - UniProtKB:P43004
  - UniProtKB:P43005
  - UniProtKB:P48664
  - WB:WBGene00001620
  review:
    summary: >-
      ASCT1 is not a glutamate transporter. This IBA is propagated from the broad SLC1 node
      (PANTHER:PTN000238242) whose experimentally characterized donors are glutamate
      transporters (EAATs: P43003/EAAT2, P43004/EAAT3, P43005/EAAT1, P48664/EAAT5). ASCT1 sits
      in the distinct neutral-amino-acid subfamily that does not carry glutamate.
    action: REMOVE
    reason: >-
      Direct human experiment shows no glutamate transport by ASCT1, and the IBA node is at a
      SLC1 ancestor that includes the EAATs; the glutamate function was not inherited into the
      neutral-amino-acid (ASCT) branch (PANTHER:PTN002632762), where ASCT1 lies. Over-propagation
      from the wrong subfamily, not a lineage-specific loss worth recording.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000238242
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Ancestral SLC1 node combining EAAT (glutamate) and ASCT (neutral AA) members; glutamate
          transporter activity is genuine for the EAAT donors but does not apply to ASCT1.
    supported_by:
    - reference_id: PMID:8340364
      supporting_text: radiolabeled L-cysteine, L-glutamate, or related dicarboxylates
    - reference_id: PMID:34630942
      supporting_text: ASCT1 is not capable to transport glutamine
- term:
    id: GO:0005313
    label: L-glutamate transmembrane transporter activity
  evidence_type: TAS
  original_reference_id: PMID:21757002
  qualifier: enables
  review:
    summary: >-
      This TAS rests on an FXR / hepatic glutamine-glutamate metabolism study that does not
      demonstrate glutamate transport by ASCT1. Glutamate is not an ASCT1 substrate.
    action: REMOVE
    reason: >-
      PMID:21757002 concerns FXR-regulated hepatic glutamine/glutamate metabolism and does not
      establish that ASCT1 transports glutamate; direct human transport assays show ASCT1 does
      not carry glutamate or related dicarboxylates. Kept consistent with the other GO:0005313
      row (also REMOVE).
