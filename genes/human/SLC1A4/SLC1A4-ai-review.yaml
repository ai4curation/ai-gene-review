core_functions:
- description: >-
    Sodium-coupled obligate antiport (exchange) of small neutral amino acids across the plasma
    membrane. ASCT1 catalyses electroneutral homo- and hetero-exchange of L- and D-serine,
    L-alanine, L-threonine, L-cysteine and L-asparagine (and, more weakly, proline/
    4-hydroxyproline), coupled to inward Na+ co-transport, with negligible net amino acid flux
    and without proton or K+ coupling. It does not transport glutamate, aspartate or glutamine.
  molecular_function:
    id: GO:0015175
    label: neutral L-amino acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015825
    label: L-serine transport
  - id: GO:0015808
    label: L-alanine transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8910405
    supporting_text: "ASCT-1 mediates only homo- and heteroexchange of amino acids and is insensitive"
  - reference_id: PMID:34630942
    supporting_text: perform the obligatory exchange of the amino acid pools
  - reference_id: file:human/SLC1A4/SLC1A4-uniprot.txt
    supporting_text: Sodium-coupled antiporter of neutral amino acids.
    record_section: ["CC:FUNCTION"]
- description: >-
    L-serine transmembrane transport (exchange) underlying brain serine/D-serine homeostasis.
    In astrocytes, ASCT1 exchanges L-serine and D-serine to supply neurons with L-serine for
    de novo D-serine synthesis and to help regulate extracellular D-serine, the co-agonist of
    synaptic NMDA receptors; human loss of function causes SPATCCM.
  molecular_function:
    id: GO:0015194
    label: L-serine transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015825
    label: L-serine transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:26041762
    supporting_text: The data underscore that ASCT1 is essential in
  - reference_id: PMID:27272177
    supporting_text: SLC1A4 (ASCT1) may represent an important route of Na-dependent D-serine flux in
