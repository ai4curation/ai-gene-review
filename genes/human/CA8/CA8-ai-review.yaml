- term:
    id: GO:0004089
    label: carbonate dehydratase activity
  evidence_type: TAS
  original_reference_id: PMID:8977131
  qualifier: enables
  review:
    summary: 'The cited paper states the opposite of the annotation: it reports that unmodified CARP
      is catalytically inactive and that two engineered mutations are required to create an active
      enzyme.'
    action: REMOVE
    reason: This TAS (ECO:0000304, assigned by PINC) is a misannotation of its own source. PMID:8977131
      is Sjoblom et al., FEBS Lett 1996, "Two point mutations convert a catalytically inactive carbonic
      anhydrase-related protein (CARP) to an active enzyme" - the title already carries the finding.
      The abstract reports that the recombinant wild-type protein is catalytically inactive and does
      not form a zinc complex, and that CO2 hydration appears only after Arg117His and Glu115Gln
      are introduced to rebuild the metal-binding centre. The paper is therefore evidence AGAINST
      carbonate dehydratase activity in CA8, not for it. A traceable author statement is not an experimental
      annotation, and here the traceable statement is traceably wrong. Removing it also makes GOA
      consistent with the UniProt FUNCTION line and with the approved gene name, "carbonic anhydrase
      8 (inactive)". Same action as the IEA row for this term, as required.
    supported_by:
    - reference_id: PMID:8977131
      supporting_text: While unmodified CARP is catalytically inactive, the mutant catalyzes CO2
        hydration with a significantly higher efficiency than the mammalian low-activity carbonic
        anhydrase isozyme III.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8977131
      supporting_text: By introducing two mutations, Arg117 --> His and Glu115 --> Gln, we created
        a metal-binding center homologous to that in the carbonic anhydrases from the animal kingdom.
      reference_section_type: ABSTRACT
- term:
    id: GO:0019855
    label: calcium channel inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:12611586
  qualifier: enables
  review:
    summary: >-
      Proposed replacement for the removed catalytic annotations: CA8 binds IP3R1 and
      reduces its activity, which is the molecular function the repurposed fold actually
      performs.
    action: NEW
    reason: >-
      With GO:0004089 and GO:0008270 removed, CA8 would carry no molecular function at all
      apart from bare protein binding, which is worse than the misannotation it replaces.
      GO:0019855 is defined as "Binds to and stops, prevents, or reduces the activity of a
      calcium channel", and that is what the primary literature shows: CA8 binds the
      cytosolic modulatory domain of the ER calcium-release channel IP3R1 (receptor residues
      1387-1647, via CA8 residues 45-291) and lowers the receptor's affinity for IP3 without
      changing the number of ligand-binding sites, so IP3-evoked release is damped. The
      assignment is corroborated from the receptor side: the SCA29 variant V1538M in the
      CA8-binding region abolishes both the interaction and CA8-mediated inhibition. I
      checked the alternatives - GO:0005246 calcium channel regulator activity is correct but
      loses the unidirectional inhibition, GO:0044325 transmembrane transporter binding drops
      the functional consequence, and GO:0070679 inositol 1,4,5 trisphosphate binding is
      simply wrong because CA8 binds the receptor and not the ligand. No GO term exists for
      "IP3 receptor binding" or "IP3 receptor inhibitor activity".
    supported_by:
    - reference_id: PMID:12611586
      supporting_text: CARP inhibits IP(3) binding to IP(3)R1 by reducing the affinity of the
        receptor for IP(3).
      reference_section_type: ABSTRACT
    - reference_id: PMID:32316137
      supporting_text: CA-VIII allosterically inhibits ITPR1 by reducing the receptor’s
        affinity for IP3 without altering the maximum number of ligand binding sites.
      reference_section_type: INTRODUCTION
    - reference_id: PMID:30429331
      supporting_text: The SCA29 mutation V1538M within the CA8-binding site of IP3R1
        completely eliminated its interaction with CA8 and CA8-mediated IP3R1 inhibition.
      reference_section_type: ABSTRACT
- term:
    id: GO:0051280
    label: negative regulation of release of sequestered calcium ion into cytosol
  evidence_type: IDA
  original_reference_id: PMID:30429331
  qualifier: involved_in
  review:
    summary: >-
      The biological process that follows from CA8's inhibition of IP3R1: less calcium
      released from the ER store for a given IP3 stimulus.
    action: NEW
    reason: >-
      IP3R1 is the endoplasmic reticulum calcium-release channel, and CA8 suppresses its
      activity; the direct consequence is reduced release of sequestered calcium into the
      cytosol. This is asserted as a process CA8 carries out rather than as a downstream
      organismal phenotype: it is measured as CA8-mediated suppression of IP3R1 in
      calcium-flux assays, and it is lost when either partner carries an ataxia-associated
      variant at the interface. Reviews of the field describe the directionality the same
      way - CA8 as a negative regulator that restrains excessive calcium release.
    supported_by:
    - reference_id: PMID:30429331
      supporting_text: Furthermore, pathological mutations in CA8 decreased CA8-mediated
        suppression of IP3R1 by reducing protein stability and the interaction with IP3R1.
      reference_section_type: ABSTRACT
    - reference_id: PMID:42268453
      supporting_text: CA VIII is thought to act as a negative regulator of IP3R1, reducing
        excessive calcium release and maintaining intracellular calcium homeostasis
      reference_section_type: DISCUSSION
