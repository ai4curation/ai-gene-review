- term:
    id: GO:0004089
    label: carbonate dehydratase activity
  evidence_type: TAS
  original_reference_id: PMID:8977131
  qualifier: enables
  review:
    summary: The cited experiment distinguishes inactive wild-type CARP from an engineered active mutant.
    action: REMOVE
    reason: 'The complete PMID:8977131 abstract reports inactive recombinant murine CARP and activity
      after two engineered substitutions restore the metal-binding environment. The human record has the
      corresponding loss of a canonical histidine ligand. Thus this paper does not support carbonate dehydratase
      activity for wild-type human CA8: the TAS has conflated the engineered product with the native ortholog.
      This conclusion rests on the stated experimental comparison, not its title alone.'
    supported_by:
    - reference_id: PMID:8977131
      supporting_text: 'unmodified CARP is catalytically

        inactive'
      reference_section_type: ABSTRACT
    - reference_id: file:human/CA8/CA8-uniprot.txt
- term:
    id: GO:0019855
    label: calcium channel inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:12611586
  qualifier: enables
  review:
    summary: Retain the prior calcium-channel inhibitor proposal on direct interaction and functional
      evidence.
    action: NEW
    reason: CA8 performs the inhibitory work by binding ITPR1 and reducing its IP3 affinity and IP3-evoked
      calcium release. GO:0019855 is defined as binding to a calcium channel and stopping, preventing
      or reducing its activity. It retains the demonstrated inhibitory direction that the parent GO:0005246
      calcium channel regulator activity does not specify. GO:0044325 transmembrane transporter binding
      captures association but omits the regulatory consequence; GO:0070679 inositol 1,4,5 trisphosphate
      binding is not justified because the established target is the receptor, not its ligand. The complete
      PMID:12611586 abstract describes mouse interaction mapping and affinity reduction; those residue
      numbers are not transferred to human CA8. PMID:19461874 tests human CA8 and a human receptor fragment.
      PMID:30429331 couples receptor-defined HeLa calcium imaging with reciprocal V1538M disruption of
      binding and inhibition. The negative interaction result in PMID:26399641 limits universality across
      assay contexts and is retained as countervailing evidence, rather than positive support. This reassessment
      retains the existing authored NEW; it adds no further molecular-function assertion.
    supported_by:
    - reference_id: PMID:12611586
      supporting_text: 'CARP inhibits IP(3) binding to IP(3)R1 by reducing the

        affinity of the receptor for IP(3).'
      reference_section_type: ABSTRACT
    - reference_id: PMID:19461874
    - reference_id: PMID:30429331
      supporting_text: 'V1538M within the CA8-binding site of IP3R1

        completely eliminated its interaction with CA8 and CA8-mediated IP3R1

        inhibition.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:32316137
- term:
    id: GO:0051280
    label: negative regulation of release of sequestered calcium ion into cytosol
  evidence_type: IDA
  original_reference_id: PMID:30429331
  qualifier: involved_in
  review:
    summary: Retain the prior process proposal for CA8-mediated inhibition of ER calcium release.
    action: NEW
    reason: 'The product is an active negative regulator: CA8 binding modulates ITPR1-mediated release
      of stored calcium, so CA8 does work in the regulation rather than serving as transported calcium
      or a passive necessity factor. PMID:30429331 tests suppressed IP3-evoked release and loss of suppression
      with disease variants. This directly matches GO:0051280 and its regulation-of-release/negative-calcium-transport
      parents. The local comparator audit finds a GO:0060315 child annotation on the non-catalytic calcium-channel
      regulator CALM1, whereas BCL2 carries broader calcium-regulation terms; no universal annotation
      convention or missing-term argument is assumed. No CA8 activity was found in the local GO-CAM index.
      This prior authored process NEW is complementary to the molecular inhibitor activity, not a redundant
      same-aspect parent/child proposal; no additional developmental or disease process is proposed. The
      separate negative CA8–IP3R1 interaction result in PMID:26399641 is discussed as a context limit,
      not positive evidence for calcium-release inhibition.'
    supported_by:
    - reference_id: PMID:30429331
      supporting_text: 'decreased CA8-mediated

        suppression of IP3R1'
      reference_section_type: ABSTRACT
    - reference_id: PMID:12611586
