core_functions:
- description: 'Non-catalytic inhibitor of the inositol 1,4,5-trisphosphate receptor type 1 (ITPR1/IP3R1).
    CA8 retains the alpha-carbonic anhydrase fold but has lost the catalytic zinc site, and the preserved
    cavity is repurposed as a protein-interaction surface. It binds the cytosolic modulatory domain
    of IP3R1 (receptor residues 1387-1647) through CA8 residues 45-291 and lowers the receptor''s
    affinity for IP3 without altering the number of ligand-binding sites, so that a given IP3 concentration
    evokes less calcium release from the endoplasmic reticulum. The interaction is validated reciprocally:
    ataxia-causing variants in the CA8-binding region of IP3R1 abolish both binding and CA8-mediated
    inhibition, and ataxia-causing CA8 variants reduce inhibition by destabilising the protein and
    weakening the interaction. The function is most important in cerebellar Purkinje cells, where
    both partners are abundant and where its loss causes congenital ataxia in humans and in the waddles
    mouse.'
  molecular_function:
    id: GO:0019855
    label: calcium channel inhibitor activity
  directly_involved_in:
  - id: GO:0051280
    label: negative regulation of release of sequestered calcium ion into cytosol
  locations:
  - id: GO:0005737
    label: cytoplasm
  anatomical_locations:
