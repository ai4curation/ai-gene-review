core_functions:
- description: Binds the cytoplasmic regulatory region of ITPR1 and inhibits IP3-dependent calcium release
    from intracellular stores. CA8 itself supplies the channel-regulatory activity; ITPR1 forms the calcium-conducting
    pore. Mouse biochemical mapping, human CA8-fragment interaction assays and receptor-defined HeLa calcium
    imaging support this mechanism. Exact contact residues and allosteric transmission remain unresolved,
    and the separate negative Purkinje-culture binding result limits claims of universal interaction across
    assay conditions. Purkinje-cell enrichment and human loss-of-function phenotypes give neuronal context
    without proving that every CA8-dependent phenotype is exclusively mediated by ITPR1.
  molecular_function:
    id: GO:0019855
    label: calcium channel inhibitor activity
  directly_involved_in:
  - id: GO:0051280
    label: negative regulation of release of sequestered calcium ion into cytosol
  locations:
  - id: GO:0005829
    label: cytosol
  anatomical_locations:
  - id: CL:0000121
    label: Purkinje cell
  supported_by:
  - reference_id: PMID:12611586
    supporting_text: 'reducing the

      affinity of the receptor for IP(3).'
    reference_section_type: ABSTRACT
  - reference_id: PMID:19461874
  - reference_id: PMID:30429331
  - reference_id: PMID:32316137
    supporting_text: CA-VIII allosterically inhibits ITPR1 by reducing the receptor’s affinity for IP3
    reference_section_type: INTRODUCTION
  - reference_id: PMID:42268453
    supporting_text: CA VIII directly interacts with the modulatory domain of IP3R1 rather than binding
      IP3 itself
    reference_section_type: DISCUSSION
suggested_questions:
- question: How do the negative CA8–IP3R1 binding result in the PKCγ/Purkinje-culture system and positive
    recombinant/HeLa assays depend on construct, expression level and assay context? Does part of the
    dendritic phenotype reflect an ITPR1-independent mechanism?
- question: Which CA8 residues directly contact ITPR1, and how does binding alter ligand sensitivity or
    gating? Current interface predictions and broad deletion mapping do not establish that the former
    catalytic cavity is the contact surface.
- question: Would a curated NOT carbonate-dehydratase assertion and a refined InterPro mapping prevent
    repeated transfer of catalytic activity to native CA8, while retaining the distinction from engineered
    active mutants?
- question: Which physiological settings support the screen-derived CA8 partner interactions, and can
    targeted experiments assign a molecular activity more specific than binding without assuming they
    share the ITPR1 mechanism?
- question: Why is ITPR1 absent from the preserved CA8 generic-binding GOA rows despite targeted interaction
    studies in PMID:12611586, PMID:19461874 and PMID:30429331? Does this reflect curation scope or a missing
    targeted assertion, and is the existing calcium-channel inhibitor proposal the more informative representation?
    No additional generic-binding NEW is inferred from absence.
- question: Do CA10 and CA11 carry comparable InterPro-derived carbonate-dehydratase or zinc-binding assertions,
    and would their own sequence and biochemical evidence justify analogous mapping corrections? Their
    interaction mechanisms must be checked separately rather than assumed to use the CA8 interface.
- question: Would an ontology term for allosteric inhibition of an intracellular IP3-gated calcium-release
    channel add useful precision beyond GO:0019855, or is the current term adequate? Any proposed new
    term should be justified against current definitions and intended scope.
- question: Does wild-type CA8 catalyze a reaction other than CO2 hydration? The demonstrated loss of
    canonical carbonic-anhydrase activity does not establish absence of every possible chemical activity.
suggested_experiments:
- description: Compare purified wild-type human CA8 with stable separation-of-function variants in an
    ITPR1 binding and calcium-release system, measuring concentration dependence and channel response
    separately from protein stability.
- description: Reproduce the positive biochemical/HeLa and negative Purkinje-culture interaction assays
    with matched tagged and untagged constructs, expression controls and orthogonal interaction measurements.
- description: Determine a CA8–ITPR1 regulatory complex structure, using cryo-EM or another method suited
    to the assembled complex, and test interface-specific variants that preserve folding. This would distinguish
    a predicted former-cavity interface from experimentally resolved contacts and connect binding to changes
    in IP3 sensitivity.
- description: Screen purified wild-type human CA8 for residual esterase and selected small-molecule hydrolysis/hydration
    activities, with active CA2, buffer and protein-purity controls. Include sequence-verified engineered
    metal-site restoration variants as comparators without assuming that one human substitution reproduces
    the historical murine double-mutant result.
