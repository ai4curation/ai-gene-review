    label: Purkinje cell
  supported_by:
  - reference_id: PMID:12611586
    supporting_text: CARP inhibits IP(3) binding to IP(3)R1 by reducing the affinity of the receptor
      for IP(3).
    reference_section_type: ABSTRACT
  - reference_id: PMID:12611586
    supporting_text: Western blot analysis revealed that CARP is expressed exclusively in Purkinje
      cells of the cerebellum, in which IP(3)R1 is abundantly expressed.
    reference_section_type: ABSTRACT
  - reference_id: PMID:30429331
    supporting_text: The SCA29 mutation V1538M within the CA8-binding site of IP3R1 completely eliminated
      its interaction with CA8 and CA8-mediated IP3R1 inhibition.
    reference_section_type: ABSTRACT
  - reference_id: PMID:32316137
    supporting_text: CA-VIII allosterically inhibits ITPR1 by reducing the receptor’s affinity for
      IP3 without altering the maximum number of ligand binding sites.
    reference_section_type: INTRODUCTION
  - reference_id: PMID:42268453
    supporting_text: Biochemical and functional studies have demonstrated that CA VIII directly interacts
      with the modulatory domain of IP3R1 rather than binding IP3 itself, thereby reducing the sensitivity
      of IP3R1 to IP3 and influencing calcium release dynamics within neurons
    reference_section_type: DISCUSSION
suggested_questions:
- question: Should GOA replace the removed catalytic annotation with an explicit negative one - NOT|enables
    GO:0004089 carbonate dehydratase activity, cited to PMID:8977131? The paper supports a negative
    assertion directly, and recording it would stop the InterPro alpha-CA signature from reinstating
    the activity at the next remapping.
- question: Why is ITPR1 absent from CA8's GO:0005515 protein binding annotations when it is the
    only functionally characterised partner, while eleven partners from proteome-scale two-hybrid
    screens are present? Is there a curation gap for the targeted biochemistry in PMID:12611586 and
    PMID:30429331?
- question: Is GO:0019855 calcium channel inhibitor activity the right molecular function, or does
    CA8's effect on IP3 affinity warrant a more specific term for an allosteric modulator of a ligand-gated
    intracellular calcium-release channel? No existing GO term captures "IP3 receptor binding" or
    "IP3 receptor inhibitor activity".
- question: Does CA8 retain any catalytic activity at all, on a substrate other than CO2? "Cannot
    hydrate CO2" is well established; "has no enzymatic activity of any kind" has not actually been
    tested, and other pseudoenzymes have turned out to have neofunctionalised chemistry.
- question: How should the dissenting result in PMID:26399641 be weighed - CA8 overexpression stunted
    Purkinje dendritic growth with no evidence of direct binding to IP3R1 in that system? Does CA8
    have an IP3R1-independent role in dendritic development, or is this a system-specific failure
    to detect the interaction?
- question: Do the paralogous acatalytic carbonic anhydrase-related proteins CA10 and CA11 carry
    the same InterPro-derived carbonate dehydratase and zinc-binding annotations, and do they also
    act through protein-interaction surfaces built on the disused active-site cavity?
suggested_experiments:
- description: 'Reconstitute the inhibition in a defined system: purified recombinant CA8 added to
    IP3R1 in planar lipid bilayers or in permeabilised-cell calcium-flux assays, measuring single-channel
    open probability and the IP3 dose-response as a function of CA8 concentration. This would convert
    the "reduces affinity for IP3" result into a quantitative affinity and stoichiometry, which no
    study has yet provided.'
- description: Structure of the CA8-IP3R1 modulatory-domain complex by cryo-EM. This would show whether
    the vestigial active-site cavity is the binding surface, as comparative modelling suggests, and
    would explain how binding at residues 1387-1647 propagates to the distant IP3-binding domain
    - possibly, as proposed, to the adjacent subunit of the tetramer.
- description: 'Test for residual catalysis: screen purified human CA8 against esterase substrates
    and a panel of small-molecule hydrolysis/hydration reactions alongside CA2 as a positive control
    and the Arg116His revertant as an internal comparator, to establish whether "acatalytic" means
    genuinely inert or merely inactive toward CO2.'
- description: 'Separation-of-function mouse: knock in a CA8 variant that is stable but cannot bind
    IP3R1 (guided by the residue 45-291 mapping and by the structure above), and compare with a Ca8
    null for cerebellar calcium handling in Purkinje cells, dendritic morphology and motor phenotype.
    This asks directly whether the ataxia is entirely attributable to loss of IP3R1 regulation, and
    would also adjudicate the dendritic-growth result of PMID:26399641.'
- description: Cell-type-resolved calcium imaging in Purkinje neurons from CA8 patient-derived or
    isogenic iPSC models carrying S100P and other reported variants, measuring IP3-evoked release
    with and without proteasome inhibition, to test whether restoring CA8 protein levels restores
    normal calcium dynamics.
