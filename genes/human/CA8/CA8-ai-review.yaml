- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The inherited catalytic zinc-site assignment is not supported for wild-type CA8.
    action: REMOVE
    reason: This InterPro-derived assertion accompanies the alpha-carbonic-anhydrase fold. Human CA8 lacks
      one canonical histidine zinc ligand, and PMID:8977131 recovered a stoichiometric zinc-protein complex
      from the engineered murine double mutant in contrast to unmodified CARP. These observations argue
      against transferring the family catalytic zinc-binding function to wild-type CA8. They do not establish
      an absolute inability to contact zinc at any concentration or in any unrelated experimental condition.
    supported_by:
    - reference_id: PMID:8977131
