id: P35219
gene_symbol: CA8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Carbonic anhydrase 8 (CA8/CARP VIII) is a soluble carbonic-anhydrase-family protein that
  lacks the canonical zinc-dependent carbon dioxide hydration activity. Human CA8 carries Arg116 at a
  position occupied by a zinc-coordinating histidine in active family members. CA8 binds the cytoplasmic
  regulatory region of the endoplasmic-reticulum calcium-release channel ITPR1 and can reduce IP3 sensitivity
  and IP3-evoked calcium release. It is abundant in cerebellar Purkinje cells, and biallelic pathogenic
  variants cause congenital cerebellar ataxia with variable neurodevelopmental impairment.
