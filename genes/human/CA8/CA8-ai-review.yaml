gene_symbol: CA8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Catalytically inactive member of the alpha-carbonic anhydrase family (a carbonic anhydrase-related
  protein, CARP VIII) that acts as a cytosolic regulator of intracellular calcium release rather
  than as an enzyme. CA8 retains the carbonic anhydrase fold but carries arginine in place of one
  of the three histidines that coordinate the catalytic zinc, so it neither binds zinc stoichiometrically
  nor hydrates carbon dioxide; restoring the metal-binding centre by engineered substitution is what
  converts it into an active enzyme. The preserved active-site cavity is instead repurposed as a
  protein-interaction surface: CA8 binds the modulatory domain of the inositol 1,4,5-trisphosphate
  receptor type 1 (ITPR1/IP3R1), an endoplasmic reticulum calcium-release channel, and lowers the
  receptor''s affinity for IP3 without changing the number of ligand-binding sites, thereby damping
  IP3-evoked calcium release. It is expressed most strongly in cerebellar Purkinje cells, where IP3R1
  is abundant, and the interaction is required for normal cerebellar function: recessive loss-of-function
  variants cause congenital cerebellar ataxia with mild intellectual disability and a tendency to
  quadrupedal gait, and the orthologous mouse mutant waddles is ataxic and dystonic.'
existing_annotations:
- term:
    id: GO:0004089
    label: carbonate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Fold-based electronic assignment to a protein that lacks a catalytic zinc site and has
      no measurable carbonic anhydrase activity.
    action: REMOVE
    reason: 'This is an IEA from InterPro signatures IPR018338/IPR023561 via GO_REF:0000002 - that
      is, the alpha-carbonic anhydrase fold is present, so the activity was inferred. The fold is
      present and the activity is not. CA8 carries Arg116 in place of one of the three conserved
      zinc-coordinating histidines, so the catalytic metal centre cannot assemble; UniProt states
      outright that the protein "Does not have a carbonic anhydrase catalytic activity", and the
      approved HGNC name is "carbonic anhydrase 8 (inactive)". Direct measurement agrees: Sjoblom
      et al. purified the recombinant protein and found it catalytically inactive, and had to engineer
      two substitutions (Arg117His, Glu115Gln, murine numbering) to obtain CO2 hydration. Every subsequent
      structural and review treatment classifies CA8 as acatalytic. There is no experimental annotation
      being second-guessed here - GOA holds no IDA/IMP/EXP row for this term - so this is precisely
      the over-propagated electronic inference that can be argued down on biological grounds.'
    supported_by:
    - reference_id: PMID:8977131
      supporting_text: While unmodified CARP is catalytically inactive, the mutant catalyzes CO2
        hydration with a significantly higher efficiency than the mammalian low-activity carbonic
        anhydrase isozyme III.
      reference_section_type: ABSTRACT
    - reference_id: PMID:32316137
      supporting_text: Though the protein cannot hydrate CO2, CA-VIII is essential for calcium (Ca2+)
        homeostasis within the body, and achieves this by allosterically inhibiting the binding of
        inositol 1,4,5-triphosphate (IP3) to the IP3 receptor type 1 (ITPR1) protein.
      reference_section_type: ABSTRACT
    - reference_id: PMID:42268453
      supporting_text: However, carbonic anhydrase VIII (CA VIII) represents a catalytically inactive
        member of this family due to the absence of one of the three histidine residues required
        for enzymatic activity
      reference_section_type: ABSTRACT
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The zinc site is exactly what CA8 has lost; unmodified CARP is not isolated as a zinc-protein
      complex.
    action: REMOVE
    reason: 'Same provenance as the catalytic annotation - IEA from InterPro IPR018338/IPR023561
      via GO_REF:0000002 - and it fails for the same reason, more directly. The alpha-CA zinc centre
      requires three histidines; CA8 substitutes Arg116 for one of them, and UniProt flags this in
      a CAUTION line. The defining experiment is a contrast: engineering the metal-binding centre
      back in yielded a 1:1 zinc-protein complex, whereas the unmodified protein did not. Retaining
      GO:0008270 asserts the one property the primary literature specifically excludes.'
    supported_by:
