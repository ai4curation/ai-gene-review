- term:
    id: GO:0004089
    label: carbonate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The catalytic annotation overextends an alpha-carbonic-anhydrase domain signature to an inactive
      family member.
    action: REMOVE
    reason: The preserved InterPro signatures describe a retained fold, but human CA8 replaces a canonical
      zinc ligand with Arg116. The complete PMID:8977131 abstract explicitly distinguishes inactive recombinant
      murine wild-type CARP from an engineered Arg117His/Glu115Gln double mutant that acquires zinc-dependent
      CO2 hydration. Human UniProt independently records absent carbonic anhydrase activity. The conserved
      target-specific catalytic-site change and biochemical contrast support removing the electronic activity
      assignment; this does not assert that every conceivable alternative chemical activity has been excluded.
    supported_by:
    - reference_id: PMID:8977131
      supporting_text: 'unmodified CARP is catalytically

        inactive'
      reference_section_type: ABSTRACT
    - reference_id: file:human/CA8/CA8-uniprot.txt
    - reference_id: PMID:32316137
