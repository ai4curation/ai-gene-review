        complex.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8977131
      supporting_text: By introducing two mutations, Arg117 --> His and Glu115 --> Gln, we created
        a metal-binding center homologous to that in the carbonic anhydrases from the animal kingdom.
