gene_symbol: CCDC39
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCDC39 is a coiled-coil structural protein of motile ciliary and flagellar axonemes. Together
  with CCDC40, it forms an extended scaffold associated with the 96-nm repeat of the outer microtubule doublets,
  organizing the positioning and assembly of inner dynein arms, the nexin-dynein regulatory complex and radial-spoke-associated
  structures. Human CCDC39 deficiency disrupts this periodic organization while largely preserving outer dynein
  arms, producing immotile or dyskinetic respiratory cilia and impaired sperm motility. Its function in motile
  cilia also supports embryonic left-right patterning. Biallelic loss-of-function variants cause primary ciliary
  dyskinesia type 14. CCDC39 provides structural organization rather than the ATP-driven motor activity of
  dynein.
