description: GRIA1 encodes GluA1, a pore-forming subunit of tetrameric AMPA glutamate receptors. These
  receptors mediate excitatory postsynaptic currents; subunit composition determines calcium permeability.
  GluA1 binds receptor-organizing proteins and occupies synaptic and trafficking membrane pools. Pathogenic
  variants can alter channel function and cause neurodevelopmental disease.
