- term:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  evidence_type: IDA
  original_reference_id: PMID:11160515
  qualifier: contributes_to
  review:
    summary: Bell et al. recorded high-voltage-activated L-type (CaV1.3) and N-type currents from reconstituted
      alpha1/alpha2delta-1/beta3 channels in HEK293 cells; beta3 is a subunit of the complex that carries
      the activity.
    action: MODIFY
    reason: The contributes_to qualifier makes a defensible, weaker claim, since beta3 is a non-pore subunit
      of the complex whose activity was measured. The activity beta3 itself performs is modulation of
      the alpha1 pore, which is calcium channel regulator activity; refining to that term keeps this row
      consistent with the enables rows for the same term, and complex membership is captured by the accepted
      channel-complex terms.
    supported_by:
    - reference_id: PMID:11160515
      supporting_text: calcium channel currents formed by the human neuronal L-type alpha(1D) subunit,
        co-expressed with alpha(2)delta-1 and beta(3a)
    - reference_id: PMID:11160515
      supporting_text: N-type currents, formed from transiently transfected alpha(1B)/alpha(2)delta-1/beta(3)
    proposed_replacement_terms:
    - id: GO:0005246
      label: calcium channel regulator activity
