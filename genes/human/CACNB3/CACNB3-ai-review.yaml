  review:
    summary: CaVbeta3 is a soluble cytoplasmic protein that docks on the intracellular face of the alpha1
      subunit; the human CaV2.2 cryo-EM structure resolves beta3 on the cytoplasmic side of the channel.
    action: ACCEPT
    reason: Supported by structure (Gao 2021, the EXP source), by the absence of any transmembrane segment,
