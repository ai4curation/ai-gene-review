id: P54284
gene_symbol: CACNB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CACNB3 encodes CaVbeta3, a cytosolic auxiliary (beta) subunit of high-voltage-activated voltage-gated
  calcium channels of the CaV1 (L-type) and CaV2 (notably N-type CaV2.2) classes. It is a membrane-associated-guanylate-kinase-like
  protein with an SH3 domain and a catalytically inactive guanylate-kinase-like domain; the GK domain
  binds the alpha-interaction domain in the cytoplasmic I-II linker of the pore-forming alpha1 subunit.
  Through this interaction beta3 promotes surface expression of the alpha1 subunit and increases peak
  current while shifting voltage-dependent activation and inactivation. It is the predominant beta subunit
  of many neurons, and is also expressed in smooth muscle, pancreatic beta-cells and other tissues. In
  mice, loss of beta3 reduces neuronal L- and N-type currents and dampens inflammatory pain processing.
  A channel-independent interaction with IP3 receptors that limits IP3-evoked calcium release has been
  reported in rodent cells.
