suggested_questions:
- question: Is the channel-independent CaVbeta3-IP3 receptor interaction reported in rodent fibroblasts
    and beta-cells conserved in human cells, and does it warrant a molecular function annotation distinct
    from calcium channel regulator activity?
- question: Is there direct evidence placing beta3 (rather than beta1a/beta2) in skeletal or cardiac T-tubule
    couplons, to resolve the T-tubule annotations?
suggested_experiments:
- description: Proximity labelling or co-immunoprecipitation of endogenous CACNB3 with ITPR1-3 in human
    iPSC-derived neurons or beta-cells, with AID-binding-deficient beta3 mutants, to separate channel-dependent
    from channel-independent roles.
