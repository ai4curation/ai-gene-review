core_functions:
- description: 'Auxiliary-subunit regulation of high-voltage-activated calcium channels: beta3 binds the
    alpha1 subunit AID through its GK-like domain on the cytoplasmic face of CaV1/CaV2 channels, increasing
    peak current and shifting voltage-dependent activation and inactivation.'
