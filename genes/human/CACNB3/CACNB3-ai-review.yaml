  evidence_type: NAS
  original_reference_id: PMID:22982493
  qualifier: involved_in
  review:
    summary: Positive regulation of muscle contraction is a downstream physiological outcome of L-type
      channel calcium entry, asserted from reviews focused on CaV1.1 (skeletal) and cardiac CaV1.2.
    action: MARK_AS_OVER_ANNOTATED
    reason: The skeletal and cardiac beta subunits are mainly beta1a and beta2; the cited reviews do not
