- term:
    id: GO:0042594
    label: response to starvation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Response to starvation, supported by IBA across ULK1, ULK2, fly Atg1 and yeast
      ATG1.
    action: ACCEPT
    reason: Starvation activates conserved Atg1/ULK autophagy machinery. Human
      nutrient-withdrawal experiments support the inherited response, while paralog usage and
      regulatory details can differ among organisms.
- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Reticulophagy, propagated from fly Atg1 and yeast Atg1.
    action: KEEP_AS_NON_CORE
    reason: The PAINT Atg1/ULK assertion supports participation in selective ER turnover. ULK1
      can execute initiation machinery recruited in this context without serving as the ER cargo
      receptor. The conditional role is retained as noncore; different ER degradation routes can
      have different requirements.
