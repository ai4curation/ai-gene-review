- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IPI
  original_reference_id: PMID:22613832
  qualifier: enables
  review:
    summary: The cited interaction is clear, but its small-GTPase specificity is unresolved.
    action: UNDECIDED
    reason: Full PMID:22613832 maps ULK1 binding to TBC1D14, a Rab-binding TBC-domain effector,
