- term:
    id: GO:0035032
    label: phosphatidylinositol 3-kinase complex, class III
  evidence_type: IPI
  original_reference_id: PMID:40442316
  qualifier: part_of
  review:
    summary: >-
      Class III phosphatidylinositol 3-kinase complex with a part_of qualifier. The cited
      structure shows ULK1's complex docking onto PI3KC3-C1, not ULK1 being a subunit of it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:40442316 solved the structure of a ULK1C:PI3KC3-C1 supercomplex and is explicit
      about how the two assemble: the contacts are between the FIP200 scaffold subunit of
      ULK1C and the VPS15, ATG14 and BECN1 subunits of PI3KC3-C1. ULK1 itself is not at the
      interface and is not a constituent of the class III PI3K complex, whose subunits are
      VPS34, VPS15, BECN1 and ATG14. part_of asserts constituent membership, which is a
      stronger claim than the paper supports; the paper supports coassembly of two distinct
      complexes. ULK1's own complex is GO:1990316, already annotated here from two IPI
      experiments. The structure describes something GO cannot currently express - a
      supercomplex of two named complexes - which is proposed under proposed_new_terms.
      Marked over-annotated rather than removed because the association it points at is real
      and structurally characterised; only the part_of relation is wrong.
    supported_by:
    - reference_id: PMID:40442316
      supporting_text: We show that the two complexes coassemble through extensive contacts between the FIP200 scaffold subunit of ULK1C and the VPS15, ATG14 and BECN1 subunits of PI3KC3-C1.
- term:
