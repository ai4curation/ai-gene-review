proposed_new_terms:
- proposed_name: ULK1-PI3KC3-C1 supercomplex
  proposed_definition: A protein-containing supercomplex formed by coassembly of the mammalian
    ULK1 kinase complex with class III phosphatidylinositol 3-kinase complex I. The ordered
    interface involves FIP200, ATG13 and the ULK1 C-terminal domain on one side and VPS15, ATG14
    and BECN1 on the other; the complete component complexes also contain ATG101 and VPS34.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  justification: PMID:40442316 directly characterizes coassembly by structural and biochemical
    experiments. A specific term could distinguish the assembled signaling unit from its
    component ULK1 and PI3KC3-C1 complexes. The broad existing PI3K-complex annotation is
    retained with this boundary explained; neither the indirect interface nor absence of a
    dedicated term disproves the assembly. The proposed kinase-activation mechanism remains a
    structural interpretation.
suggested_questions:
- question: Is the Atg1-dependent nuclear microautophagy route conserved in mammalian cells, and
    which experiments distinguish it from nuclear macroautophagy?
- question: Does the source PMID:22613832 demonstrate direct ULK1 binding to a small GTPase
    beyond its separately demonstrated TBC1D14 interaction?
- question: How does ULK1 palmitoylation coordinate LIR-mediated recruitment, self-association
    and release from autophagic membranes?
- question: Which neuronal trafficking effects require ULK1 kinase activity independently of
    autophagic degradation, and which are shared with ULK2?
suggested_experiments:
- description: 'Separation-of-function analysis of ULK1 in neurons: compare kinase-dead ULK1, an autophagy-null
    background, and unc-51-derived point mutants for axon extension and neurite outgrowth, to determine
    whether the neuronal annotations describe an autophagy-independent activity.'
- description: Quantitative phosphoproteomics after acute ULK1 activation with a
    chemical-genetic allele, to enumerate direct substrates and give the twenty-seven protein
    binding annotations a directional replacement grounded in which partners are actually
    phosphorylated.
- description: Measure assembly and kinase activity of the ULK1C:PI3KC3-C1 supercomplex under
    nutrient-replete and starvation conditions, testing the proposed coupling between
    FIP200-mediated ULK1 recruitment and trans-autophosphorylation.
