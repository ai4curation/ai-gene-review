- term:
    id: GO:0008104
    label: intracellular protein localization
  evidence_type: IMP
  original_reference_id: PMID:16940348
  qualifier: involved_in
  review:
    summary: ULK1 controls ATG9A trafficking during autophagosome biogenesis.
    action: ACCEPT
    reason: PMID:16940348 directly tests starvation-dependent ATG9 redistribution and its loss
      after ULK1 depletion. Together with the established kinase-dependent assembly mechanism,
      this supports intracellular protein localization as a core trafficking role; the broader
      term is not erroneous simply because the cargo is known.
    supported_by:
    - reference_id: PMID:16940348
      supporting_text: "siRNA-mediated depletion of the putative\nmammalian homologue of Atg1p, ULK1,
        inhibits this starvation-induced\nredistribution."
- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IMP
  original_reference_id: PMID:18007665
  qualifier: involved_in
  review:
    summary: Neuron projection development, supported by IMP. The best-evidenced of this gene's
      five neuronal annotations.
    action: KEEP_AS_NON_CORE
    reason: The human-kinase RNAi screen PMID:18007665 implicates ULK1 in neurite remodeling,
      complementing mouse ULK1/ULK2 growth-cone and NGF-endocytosis experiments in
      PMID:17389358. Retain the neuronal context as noncore without requiring proof that every
      neuronal effect is independent of autophagy or treating other evidence codes as
      disposable.
