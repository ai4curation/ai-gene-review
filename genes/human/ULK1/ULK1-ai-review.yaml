- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Piecemeal microautophagy of the nucleus, propagated from yeast ATG1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMN proceeds at the budding-yeast nucleus-vacuole junction formed by Nvj1 and Vac8.
      Humans have no vacuole and no characterised NVJ equivalent, so the process does not
      transfer even though the Atg1/ULK1 orthology is sound. The only non-node donor is the
      yeast gene. Same call as on ATG9A, WIPI2 and ATG12.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: SGD:S000003148
        source_label: ATG1 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Yeast Atg1 is genuinely required for piecemeal microautophagy of the nucleus, which
          proceeds at the nucleus-vacuole junction formed by Nvj1 and Vac8. Humans have no
          vacuole and no characterised NVJ equivalent.
      - source_id: PANTHER:PTN000681273
        source_label: ULK1/ULK2 node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The yeast gene is the only non-node donor, so the whole transfer rests on a process
          with no mammalian counterpart.
