id: O75385
gene_symbol: ULK1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ULK1 is the serine/threonine kinase that starts macroautophagy. It is the mammalian
  counterpart of yeast Atg1 and of C. elegans unc-51, and it occupies the point where nutrient
  and energy signals enter the pathway: mTORC1 phosphorylates and holds it inactive when
  nutrients are plentiful, AMPK acts on it from the energy-status side, and starvation releases
  it. ULK1 works as the catalytic subunit of a complex with ATG13 and RB1CC1/FIP200, in which
  FIP200 is the scaffold. On activation the complex relocalizes to omegasomes, PtdIns3P-rich
  subdomains of the endoplasmic reticulum from which phagophores emerge, and engages the class
  III PI3-kinase complex I; the two assemble into a supercomplex through contacts between FIP200
  and the VPS15, ATG14 and BECN1 subunits, and the FIP200-ATG13-ULK1 core shifts from 2:1:1 to
  2:2:2 stoichiometry, bringing two ULK1 protomers together. Its substrates span the pathway -
  ATG13 and RB1CC1 within its own complex, BECN1 and ATG14 in the PI3-kinase complex, ATG9A in
  the vesicle pool - so its catalytic output converts one upstream signal into assembly of the
  whole downstream machinery. ULK1 also carries a neuronal history that predates the autophagy
  connection: unc-51 was identified for axon guidance defects, and mouse Ulk1 and Ulk2 affect
  neurite outgrowth and axon extension.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Cytoplasm, the broadest location term, asserted four times.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This gene carries cytosol, ER membrane, omegasome membrane, the phagophore assembly
      site, autophagosome, autophagosome membrane, mitochondrial outer membrane and
      recycling endosome. The bare cytoplasm parent, with an is_active_in qualifier on three
      of the four, adds nothing and asserts more than located_in would.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: PANTHER:PTN002805221
        source_label: Atg1/ULK kinase family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Fifteen donors spanning Arabidopsis, Candida, Drosophila, mouse, fission yeast,
          budding yeast, Dictyostelium and human. The transfer is valid and the term is true;
          it simply says the kinase is not extracellular, which the gene's eight specific
          compartment annotations already establish more informatively.
      - source_id: UniProtKB:O75385
        source_label: ULK1 (the annotation target itself)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          The target is listed among its own WITH/FROM sources, contributing no independent
          support. The fifth gene in this review set to show the pattern, after WIPI2,
          ATG16L1, ATG12 and STBD1.
      - source_id: UniProtKB:Q8IYT8
        source_label: ULK2 (human paralog)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          A same-species paralog is not independent evidence for a location this general.
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Autophagosome assembly, supported by two IDA experiments and by IBA.
    action: ACCEPT
    reason: >-
      ULK1 initiates the process. Everything downstream - PI3KC3-C1 activation, PtdIns3P
      production, WIPI recruitment, ATG8 lipidation - is triggered by its activation. Core.
- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Mitophagy, a selective subtype downstream of the initiation step.
    action: KEEP_AS_NON_CORE
    reason: >-
      ULK1 is recruited to damaged mitochondria in PINK1/Parkin mitophagy and the claim is
      biologically defensible, but it follows from ULK1 being required for all
      macroautophagy rather than from a mitochondrion-specific activity. Non-core.
- term:
    id: GO:0010506
    label: regulation of autophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Regulation of autophagy, the parent of both directional and process-specific children.
    action: KEEP_AS_NON_CORE
    reason: >-
      Less informative than the GO:0016239 destination proposed for this gene's other
      regulation annotations. Non-core.
- term:
    id: GO:0042594
    label: response to starvation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Response to starvation, supported by IBA across ULK1, ULK2, fly Atg1 and yeast ATG1.
    action: ACCEPT
    reason: >-
      Starvation-induced autophagy is the canonical setting for this kinase and the
      conservation is complete from yeast Atg1 onward. Core.
- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Reticulophagy, propagated from fly Atg1 and yeast Atg1.
    action: KEEP_AS_NON_CORE
    reason: >-
      ER-phagy in mammalian cells is receptor-driven, through FAM134B, RTN3, SEC62, TEX264
      and CCPG1, and it does require the core initiation machinery. So the claim is
      defensible, but it is a cargo-specific deployment rather than a distinct ULK1
      function. Non-core.
