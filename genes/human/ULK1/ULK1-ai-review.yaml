    supporting_text: The FIP200:ATG13:ULK1 core of ULK1C undergoes a rearrangement from 2:1:1 to
      2:2:2 stoichiometry in the presence of PI3KC3-C1.
proposed_new_terms:
- proposed_name: ULK1-PI3KC3-C1 supercomplex
  proposed_definition: >-
    A protein-containing complex formed by coassembly of the ULK1 kinase complex, comprising
    ULK1, ATG13 and RB1CC1/FIP200, with class III phosphatidylinositol 3-kinase complex I,
    comprising PIK3C3, PIK3R4, BECN1 and ATG14, through contacts between the FIP200 scaffold
    and the VPS15, ATG14 and BECN1 subunits. Formation of the supercomplex dimerizes ULK1 on
    the FIP200 scaffold and initiates autophagy.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  justification: >-
    GOA records ULK1 as part_of GO:0035032 class III phosphatidylinositol 3-kinase complex on
    the strength of PMID:40442316. That paper does not show ULK1 to be a subunit of PI3KC3-C1;
    it shows two distinct complexes docking, with the interface formed by FIP200 on one side
    and VPS15, ATG14 and BECN1 on the other. ULK1 is not at the interface. The annotation
    exists because GO has no way to say that two named complexes assemble into a larger one,
    so a coassembly observation had to be expressed as constituent membership. A supercomplex
    term would let this and comparable observations be recorded without overstating
    membership, and would keep GO:0035032's subunit list clean.
suggested_questions:
- question: >-
    Should GO be able to represent supercomplexes as first-class entities? ULK1C:PI3KC3-C1 is
    not an isolated case - respiratory supercomplexes and the nuclear pore subcomplexes raise
    the same problem, and the current workaround is to assert part_of into the partner
    complex, which corrupts its subunit list.
- question: >-
    ULK1's twenty-seven protein binding annotations flatten substrate, regulator and complex
    relationships into undirected binding. Should GO annotate kinase-substrate relationships
    directionally, and if so through what - a substrate slot on the kinase activity annotation,
    or a relation in the GO-CAM layer?
- question: >-
    Is the neuronal phenotype of ULK1 and unc-51 a function distinct from autophagy, or the
    neuronal manifestation of autophagy dependence in cells that cannot dilute damage by
    division? Five annotations on this gene rest on the answer.
- question: >-
    ULK1's four GO:0034045 assertions are the strongest case in the triage set for the
    condensate reading rather than the membrane one, since ULK1 has no membrane-binding domain
    and is itself a defining constituent of the site. Does that argue for the site term over
    any membrane term for soluble PAS residents generally?
suggested_experiments:
- description: >-
    Separation-of-function analysis of ULK1 in neurons: compare kinase-dead ULK1, an
    autophagy-null background, and unc-51-derived point mutants for axon extension and neurite
    outgrowth, to determine whether the neuronal annotations describe an autophagy-independent
    activity.
- description: >-
    Quantitative phosphoproteomics after acute ULK1 activation with a chemical-genetic allele,
    to enumerate direct substrates and give the twenty-seven protein binding annotations a
    directional replacement grounded in which partners are actually phosphorylated.
- description: >-
    Cryo-EM and crosslinking of the ULK1C:PI3KC3-C1 supercomplex under nutrient-replete versus
    starved conditions, to test whether coassembly is the regulated step and to establish
    whether the supercomplex is stable enough to warrant a GO complex term.
