- description: >-
    Autophosphorylates. The supercomplex structure supplies the mechanism: engagement with
    PI3KC3-C1 rearranges the FIP200-ATG13-ULK1 core from 2:1:1 to 2:2:2, dimerizing ULK1 on the
    FIP200 scaffold in the arrangement trans-autophosphorylation would require.
  molecular_function:
