- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Conservation of the specific nuclear microautophagy route remains unresolved.
    action: UNDECIDED
    reason: PAINT PTN000681273 has a genuine GO:0034727 IBD seeded by yeast ATG1
      (SGD:S000003148). The current definition is degradation of a cell nucleus by
      microautophagy, not a categorical taxon restriction to yeast. Human nuclear macroautophagy
      or general ULK1 dependence would not establish this specific microautophagic route;
      conversely, absence of yeast-style NVJ proteins does not demonstrate target loss.
      Route-specific comparative adjudication is required.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000681273
        source_label: PTN000681273
        source_status: UNRESOLVED
        comment: The ancestral nuclear-microautophagy assertion and yeast experimental source
          are genuine. No target-specific loss is established, but generic nucleophagy does not
          by itself confirm conservation of microautophagic topology.
- term:
    id: GO:0048671
    label: negative regulation of collateral sprouting
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Negative regulation of collateral sprouting, propagated from mouse Ulk1 and Ulk2.
    action: KEEP_AS_NON_CORE
    reason: Narrower and less commonly used than the other neuronal terms but drawn from the
      same two mouse orthologs. The neuronal terms are anchored at different PANTHER nodes from
      the autophagy terms, which is the expected pattern rather than a warning sign - PAINT
      places each function at the depth where the curator judged it to have arisen, and a
      neuronal role confined to the ULK1/ULK2 clade would properly sit shallower than the
      catalytic and autophagy assertions. Non-core because it is a tissue-restricted deployment,
      not because the inference is doubtful.
    supported_by:
    - &id002
      reference_id: PMID:17389358
      supporting_text: RNAi-mediated knockdown of Ulk1 and/or Ulk2 resulted in impaired
        endocytosis of nerve growth factor (NGF), excessive axon arborization, and severely
        stunted axon elongation.
