- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phagophore assembly site membrane. Four assertions, on a gene that already carries
      both the site term and a more precise membrane term.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. ULK1 is the clearest case in the
      triage set for the condensate reading rather than the membrane one: it is a soluble
      kinase with no membrane-binding domain, it is the protein whose concentration at the
      site defines the site, and this gene already carries GO:0000407 for the structure and
      GO:1903349 omegasome membrane from the same study that supplies one of these
      assertions. Moved to GO:0061908 for consistency with the rest of the triage set, but
      GO:0000407 would serve equally and the membrane sense is the least defensible here of
      any gene reviewed.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: MGI:MGI:1270126
        source_label: Ulk1 (mouse)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Direct one-to-one ortholog; the localization transfers cleanly and the defect is in
          the destination term.
      - source_id: MGI:MGI:1352758
        source_label: Ulk2 (mouse)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Mouse Ulk2 is functionally redundant with Ulk1 at the phagophore assembly site, so
          it corroborates rather than broadens the claim.
      - source_id: UniProtKB:O75385
        source_label: ULK1 (the annotation target itself)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          Self-reference in the WITH/FROM column, as on this gene's cytoplasm IBA.
      - source_id: PANTHER:PTN000681273
        source_label: ULK1/ULK2 node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node grouping is sound. ULK1 has no membrane-binding domain, so whatever membrane
          sense the term is read in, it applies to the complex's recruitment rather than to a
          lipid interaction of this protein.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
