core_functions:
- description: >-
    Phosphorylates serine residues on autophagy machinery components as the catalytic subunit
    of the ULK1-ATG13-RB1CC1 initiation complex, converting the nutrient and energy signals
    received from mTORC1 and AMPK into activation of the downstream machinery. Substrates
    include ATG13 and RB1CC1 within its own complex, BECN1 and ATG14 in the class III
    PI3-kinase complex, and ATG9A.
  molecular_function:
