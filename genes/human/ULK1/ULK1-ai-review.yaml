- term:
    id: GO:0000421
    label: autophagosome membrane
  evidence_type: IDA
  original_reference_id: PMID:22885598
  qualifier: located_in
  review:
    summary: >-
      Autophagosome membrane, from the ATG8-binding study.
    action: KEEP_AS_NON_CORE
    reason: >-
      The observation behind this is that ULK1 binds ATG8-family proteins through a LIR
      motif, which puts it on lipidated membrane. As elsewhere in the autophagy branch, the
      membrane in question at the time ULK1 is there is the phagophore rather than a
      completed autophagosome. Non-core.
- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IDA
  original_reference_id: PMID:22885598
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane. Four assertions, on a gene that already carries
      both the site term and a more precise membrane term.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. ULK1 is the clearest case in the
      triage set for the condensate reading rather than the membrane one: it is a soluble
      kinase with no membrane-binding domain, it is the protein whose concentration at the
      site defines the site, and this gene already carries GO:0000407 for the structure and
      GO:1903349 omegasome membrane from the same study that supplies one of these
      assertions. Moved to GO:0061908 for consistency with the rest of the triage set, but
      GO:0000407 would serve equally and the membrane sense is the least defensible here of
      any gene reviewed.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
- term:
    id: GO:1903349
    label: omegasome membrane
  evidence_type: IDA
  original_reference_id: PMID:22885598
  qualifier: located_in
  review:
    summary: >-
      Omegasome membrane, directly observed. The most precise membrane location this gene
      carries.
    action: ACCEPT
    reason: >-
      The omegasome is the PtdIns3P-rich ER subdomain from which the phagophore emerges, and
      ULK1 acts there. Worth noting in the context of GO issue #29437 recommendation R4:
      GO:1903349 omegasome membrane survives, and its extrinsic-component child GO:0097629
      survives alongside it, while the intrinsic and integral omegasome children and all
      three autophagosome-component terms were obsoleted in #23424. Core, and the term
      ULK1's GO:0034045 assertions would be better served by if the evidence pointed to the
      omegasome rather than the phagophore.
    supported_by:
    - reference_id: PMID:22885598
      supporting_text: Binding of the Atg1/ULK1 kinase to the ubiquitin-like protein Atg8 regulates
