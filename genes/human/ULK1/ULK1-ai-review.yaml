- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IDA
  original_reference_id: PMID:18936157
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane. Four assertions, on a gene that already carries
      both the site term and a more precise membrane term.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. ULK1 is the clearest case in the
      triage set for the condensate reading rather than the membrane one: it is a soluble
      kinase with no membrane-binding domain, it is the protein whose concentration at the
      site defines the site, and this gene already carries GO:0000407 for the structure and
      GO:1903349 omegasome membrane from the same study that supplies one of these
      assertions. Moved to GO:0061908 for consistency with the rest of the triage set, but
      GO:0000407 would serve equally and the membrane sense is the least defensible here of
      any gene reviewed.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
- term:
    id: GO:0042594
    label: response to starvation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Response to starvation, supported by IBA across ULK1, ULK2, fly Atg1 and yeast ATG1.
    action: ACCEPT
    reason: >-
      Starvation-induced autophagy is the canonical setting for this kinase and the
      conservation is complete from yeast Atg1 onward. Core.
- term:
    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:18936157
  qualifier: involved_in
  review:
    summary: >-
      Protein autophosphorylation, directly observed.
    action: ACCEPT
    reason: >-
      ULK1 autophosphorylates, and the recent supercomplex structure gives this a
      mechanistic setting: ULK1 dimerizes on the FIP200 scaffold when PI3KC3-C1 joins, which
      is how trans-autophosphorylation would be achieved. Core.
    supported_by:
    - reference_id: PMID:40442316
      supporting_text: The FIP200:ATG13:ULK1 core of ULK1C undergoes a rearrangement from 2:1:1 to 2:2:2 stoichiometry in the presence of PI3KC3-C1.
- term:
    id: GO:0031669
    label: cellular response to nutrient levels
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Cellular response to nutrient levels. ULK1 is the node where nutrient signals enter
      autophagy.
    action: ACCEPT
    reason: >-
      mTORC1 phosphorylates and inhibits ULK1 when nutrients are plentiful and releases it
      when they are not, and AMPK acts on the same protein from the energy-status side.
      Being the substrate of that switch is not incidental to ULK1's function; it is why the
      kinase sits where it does in the pathway. Core.
