- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:20562859
  qualifier: enables
  review:
    summary: >-
      Identical protein binding, naming UniProtKB:O75385 - ULK1 itself. More meaningful here
      than the term usually is.
    action: KEEP_AS_NON_CORE
    reason: >-
      ULK1 dimerizes, and the dimerization is functional rather than incidental: the
      FIP200-ATG13-ULK1 core shifts from 2:1:1 to 2:2:2 stoichiometry when PI3KC3-C1 binds,
      bringing two ULK1 protomers together. The consequence is already captured by
      GO:0046777 and GO:1990316, so this is kept as genuine but non-core.
