- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28890335
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from twenty-seven IPI experiments; the single largest and least
      informative annotation on this gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding says nothing about what the gene
      product does, and for a signalling kinase it is actively misleading, because most of
      these interactions are substrate or regulator relationships that the term flattens
      into undirected binding. ATG13 and RB1CC1 are complex partners, RPTOR is the mTORC1
      subunit that inhibits ULK1, TBC1D14 and IRGM are regulators, ATG9A and BECN1 are
      substrates, WIPI2 and the ATG8-family proteins are downstream. Twenty-seven assertions
      of undirected binding tell a reader none of that. The informative content belongs on
      GO:0004674 with substrate detail, on GO:1990316, and on the specific binding terms
      this gene already carries.
