id: O75385
gene_symbol: ULK1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ULK1 is an ATP-dependent serine/threonine kinase that coordinates canonical macroautophagy initiation
  with nutrient and energy signaling. It forms the ULK1 complex with ATG13, RB1CC1/FIP200 and ATG101,
  and phosphorylates components of this complex and downstream machinery, including AMBRA1, BECN1,
  ATG14, ATG9A and ATG4B. Nutrient-sensitive mTORC1 and AMPK inputs, feedback phosphorylation, self-association
  and membrane recruitment regulate its activity. ULK1 exchanges between cytosolic and recycling-endosomal
  pools and early autophagic membranes, where LIR-mediated interactions and palmitoylation support
  recruitment. Its complex coassembles with PI3KC3-C1 during initiation. Conditional functions include
  selective autophagy, RIPK1-dependent death signaling and neuronal growth-cone trafficking that regulates
  axon extension and branching.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: ULK1 acts in the cytoplasm and its associated membrane compartments.
    action: ACCEPT
    reason: The broad location is supported by target microscopy and the cytoplasmic
      autophagy-initiation mechanism. More specific cytosolic, endosomal and autophagic-membrane
      pools coexist; their presence does not make the parent location an over-annotation.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002805221
        source_label: PTN002805221
        source_status: SUPPORTS_TRANSFER
        comment: The PAINT IBD is grounded in experimental descendant evidence including human
          ULK1 itself. Target biology supports this conserved assertion; broader scope or
          additional specific terms is not a propagation failure.
    supported_by:
    - reference_id: PMID:17595159
      supporting_text: "Full-length ULK1\nlocalized to cytoplasmic structures, some of which were
        GFP-LC3-positive"
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Autophagosome assembly, supported by two IDA experiments and by IBA.
    action: ACCEPT
    reason: ULK1 phosphorylates components of the autophagy-initiation system, coordinating
      PI3KC3-C1 activation and membrane assembly. This is direct execution and regulation of
      canonical autophagosome biogenesis; it does not assert that every selective-autophagy
      route universally requires ULK1.
- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Mitophagy, a selective subtype downstream of the initiation step.
    action: KEEP_AS_NON_CORE
    reason: The inherited mitophagy role is consistent with deployment of ULK machinery in
      mitochondrial sequestration. ULK1 contributes phosphorylation/assembly work, rather than
      being consumed as cargo. This is retained as a conditional selective-autophagy role
      without asserting that all mitophagy or macroautophagy routes require ULK1.
- term:
    id: GO:0010506
    label: regulation of autophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: ULK1 regulates autophagy through substrate phosphorylation and feedback signaling.
    action: ACCEPT
    reason: mTOR/AMPK inputs and ULK1 phosphorylation of autophagy machinery control initiation
