  supported_by:
  - reference_id: PMID:40442316
    supporting_text: The Unc-51-like kinase protein kinase complex (ULK1C) is the most upstream
      and central player in the initiation of macroautophagy in mammals.
  - reference_id: PMID:19225151
    supporting_text: ULK-Atg13-FIP200 complexes mediate mTOR signaling to the autophagy machinery.
- description: >-
    Serves as the signal-integration node that couples nutrient status to autophagy induction.
    Being the substrate of mTORC1 and AMPK is not incidental to ULK1 but the reason the kinase
    sits where it does in the pathway, and its activation is the committed step in positive
    regulation of macroautophagy.
