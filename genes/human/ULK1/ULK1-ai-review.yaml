  original_reference_id: PMID:19211835
  qualifier: part_of
  review:
    summary: >-
      Atg1/ULK1 kinase complex. The complex ULK1 names and is the catalytic subunit of.
    action: ACCEPT
    reason: >-
      ULK1 sits with ATG13 and FIP200/RB1CC1 in the initiation complex, at 2:1:1
      FIP200:ATG13:ULK1 stoichiometry that becomes 2:2:2 on engagement with PI3KC3-C1.
      Supported by two independent IPI experiments. Core.
    supported_by:
    - reference_id: PMID:19225151
      supporting_text: ULK-Atg13-FIP200 complexes mediate mTOR signaling to the autophagy machinery.
