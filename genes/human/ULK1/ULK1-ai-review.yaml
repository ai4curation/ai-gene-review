- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IMP
  original_reference_id: PMID:18007665
  qualifier: involved_in
  review:
    summary: >-
      Neuron projection development, supported by IMP. The best-evidenced of this gene's
      five neuronal annotations.
    action: KEEP_AS_NON_CORE
