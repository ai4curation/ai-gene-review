core_functions:
- description: Phosphorylates autophagy machinery and regulatory substrates as the catalytic
    subunit of the ULK1–ATG13–RB1CC1–ATG101 complex. Nutrient-sensitive inputs,
    autophosphorylation and self-association coordinate PI3KC3-C1 activation, ATG9A traffic and
    ATG8 processing at autophagic membranes.
