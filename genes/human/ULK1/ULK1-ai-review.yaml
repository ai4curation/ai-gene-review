  review:
    summary: >-
      Cellular response to nutrient levels. ULK1 is the node where nutrient signals enter
      autophagy.
    action: ACCEPT
    reason: >-
      mTORC1 phosphorylates and inhibits ULK1 when nutrients are plentiful and releases it
      when they are not, and AMPK acts on the same protein from the energy-status side.
      Being the substrate of that switch is not incidental to ULK1's function; it is why the
      kinase sits where it does in the pathway. Core.
- term:
    id: GO:1990316
    label: Atg1/ULK1 kinase complex
  evidence_type: IPI
  original_reference_id: PMID:19211835
  qualifier: part_of
  review:
    summary: Atg1/ULK1 kinase complex. The complex ULK1 names and is the catalytic subunit of.
    action: ACCEPT
    reason: ULK1 is the catalytic subunit of the mammalian initiation complex with ATG13,
      RB1CC1/FIP200 and ATG101. The stable complex is supported by PMID:19597335 and
      PMID:19211835. The 2025 core structure excludes flexible peripheral domains and reveals a
      rearrangement during PI3KC3-C1 coassembly, rather than redefining the complete native
      subunit list.
    supported_by:
    - reference_id: PMID:19225151
      supporting_text: ULK-Atg13-FIP200 complexes mediate mTOR signaling to the autophagy
        machinery.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19211835
  qualifier: enables
  review:
    summary: The reported interaction is retained as evidence, but generic protein binding is
      uninformative.
    action: REMOVE
    reason: The cited interaction evidence can inform complex membership or a demonstrated
      regulatory/adaptor mechanism. Generic protein binding does not identify that function;
      removing this annotation does not reject the measured interaction or assign an untested
      mechanism to every interactor.
- term:
    id: GO:0044877
    label: protein-containing complex binding
  evidence_type: IPI
  original_reference_id: PMID:19211835
  qualifier: enables
  review:
    summary: ULK1 binds mTORC1 through RPTOR in nutrient-sensitive autophagy regulation.
    action: ACCEPT
    reason: Full PMID:19211835 directly establishes the mTORC1–ULK1-complex interaction and
      nutrient dependence. This complex-binding event is integral to regulation of the core
      kinase and is more informative than unspecified protein binding.
    supported_by:
    - reference_id: PMID:19211835
      supporting_text: mTORC1 directly interacts with ULK1 and phosphorylates ULK1 and Atg13.
- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: NAS
  original_reference_id: PMID:9693035
  qualifier: enables
  review:
    summary: >-
      Protein serine/threonine kinase activity. ULK1's defining activity, supported by an
      EXP and eight independent IDA experiments.
    action: ACCEPT
    reason: >-
      ULK1 is the initiating kinase of macroautophagy. It phosphorylates ATG13, RB1CC1,
      ATG9A, BECN1 and ATG14 among others, and its catalytic output is what converts an
      upstream nutrient signal into assembly of the downstream machinery. Core.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: NAS
  original_reference_id: PMID:9693035
  qualifier: located_in
  review:
    summary: ULK1 acts in the cytoplasm and its associated membrane compartments.
    action: ACCEPT
    reason: The broad location is supported by target microscopy and the cytoplasmic
      autophagy-initiation mechanism. More specific cytosolic, endosomal and autophagic-membrane
      pools coexist; their presence does not make the parent location an over-annotation.
    supported_by:
    - reference_id: PMID:17595159
      supporting_text: "Full-length ULK1\nlocalized to cytoplasmic structures, some of which were
        GFP-LC3-positive"
- term:
    id: GO:0005776
    label: autophagosome
  evidence_type: IDA
  original_reference_id: PMID:17595159
  qualifier: located_in
  review:
    summary: ULK1 associates with autophagosomal structures during autophagy.
    action: ACCEPT
    reason: Target microscopy and LIR-dependent recruitment in PMID:22885598 Fig. 4C–E place
      human ULK1 on GABARAP/LC3/WIPI2-positive structures. The paper explicitly allows a mixture
      of autophagosomes, phagophores and omegasomes, so this supports conditional autophagosomal
      association without asserting permanent residence on every mature closed organelle. Early
      initiation activity and a retained membrane child do not refute this broader annotation.
    supported_by:
    - *id001
    - reference_id: PMID:22885598
      supporting_text: These structures most likely represent autophagosomes, but may also
        include phagophores and omegasomes.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:11146101
  qualifier: located_in
  review:
    summary: ULK1 has a cytosolic pool that exchanges with autophagic membranes.
    action: ACCEPT
    reason: Cytosolic localization is integral to nutrient-sensitive complex recruitment and
      signaling. Recruitment to membranes does not erase this pool, and repeated Reactome or
      evidence assertions do not invalidate the location.
    supported_by:
    - reference_id: PMID:11146101
      supporting_text: "In HeLa cells, endogenous ULK1 and tagged\nGABARAP showed punctate structures
        in the cytosol, and were colocalized."
- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: NAS
  original_reference_id: PMID:9693035
  qualifier: involved_in
  review:
    summary: ULK1 catalyzes protein phosphorylation.
    action: ACCEPT
    reason: Its conserved kinase domain and multiple direct substrate assays support this broad
      process. More specific residue and autophosphorylation annotations complement the parent
      assertion rather than invalidate it.
    supported_by:
