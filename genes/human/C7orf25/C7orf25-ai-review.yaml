    label: mRNA export from nucleus
  evidence_type: IMP
  original_reference_id: PMID:42449115
  qualifier: involved_in
  review:
    summary: 'Proposed new annotation: knockdown reduces, and overexpression increases, the
      cytoplasmic-to-total ratio of a defined set of transcripts, and the effect requires
      NXF1.'
    action: NEW
    reason: 'Core biological process, and the direct consequence of the adaptor activity.
      Two features of the evidence are worth recording. First, the effect is selective, not
      global: the transcripts that depend on this protein are enriched for cell-proliferation
      functions, so this is not a general mRNA export factor in the sense that NXF1 is.
      Second, the epistasis is established - NXF1 knockdown phenocopies the loss and
      abolishes the gain-of-function effect - which is what licenses "involved in" rather
      than merely "correlated with". Offered as a reviewer proposal on single-paper
      evidence.'
