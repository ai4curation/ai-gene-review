core_functions:
- description: >-
    C7orf25/PANAD is an adaptor for the mRNA export receptor NXF1. It binds the
    arginine-rich RNA-binding domain of NXF1 through a small interface (its R122, E125, G133
    and D139 contacting NXF1 Q20, K22 and K23), which displaces the autoinhibitory contact
    between that domain and the NTF2-like domain and licenses NXF1 to hold mRNA stably. At
    the same time it binds cargo transcripts directly, so it delivers mRNA to the carrier it
    has just activated. The consequence is selective rather than bulk export: the
    transcripts whose nuclear export depends on this protein are enriched for
    cell-proliferation functions, and CDK6 mRNA is a directly bound example. It belongs to
    neither of the two previously known adaptor classes (TREX-associated ALYREF and UIF, and
    the SR proteins). The assignment rests on one 2026 study.
