gene_symbol: C7orf25
product_type: PROTEIN
status: COMPLETE
aliases:
- PANAD
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  C7orf25 encodes a 421-amino-acid nuclear protein of the otherwise uncharacterised UPF0415
  family, also known as PANAD (proliferation-associated NXF1 adaptor). It acts as an adaptor
  for nuclear RNA export factor 1 (NXF1), the principal carrier that moves mature mRNA
  through the nuclear pore. NXF1 is autoinhibited: its arginine-rich RNA-binding domain
  folds back onto its NTF2-like domain, so that NXF1 cannot hold mRNA stably until an
  adaptor breaks that intramolecular contact. C7orf25 binds the RNA-binding domain of NXF1
  through a small set of residues on each side, opens the autoinhibited conformation, and at
  the same time binds cargo transcripts directly, so that mRNA is handed to the activated
  carrier. Its effect on export is selective rather than global: the transcripts whose
  nuclear export depends on it are enriched for cell-proliferation functions, and CDK6 mRNA
  is a directly bound target. Through this route the protein raises cytoplasmic levels of
  proliferation-stimulating proteins, accelerates the G1-to-S transition, and promotes
  growth of hepatocellular carcinoma cells in culture and as xenografts; it is elevated in
  hepatocellular carcinoma tissue and its level tracks tumour-cell sensitivity to CDK4/6
  inhibition. Two adaptor classes were known before this - the TREX-associated ALYREF and
  UIF, and the SR proteins - and C7orf25 belongs to neither. The assignment rests on a
  single study.
