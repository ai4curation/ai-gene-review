proposed_new_terms: []
suggested_questions:
- question: >-
    Is the export selectivity a property of this protein, or of the transcripts? Put another
    way, does it recognise a shared element in the mRNAs it binds, or does it simply act on
    whatever NXF1 is loading in a proliferating cell? No sequence or structural determinant
    in the cargo has been identified, and the answer decides whether an
    export-cargo-selectivity concept is needed in GO at all.
  experts:
  - Shi-Mei Zhuang
  - Jin-E Yang
- question: >-
    Does C7orf25 function outside tumour cells? The entire characterisation is in
    hepatocellular carcinoma models, yet the protein is broadly expressed, so it is unclear
    whether the mRNA-export role is a normal housekeeping function that tumours exploit or
    something specific to the transformed state.
  experts:
  - Shi-Mei Zhuang
  - Qi Zhang
- question: >-
    Does the adaptor act alone or as part of a complex? Canonical NXF1 adaptors work with
    the TREX complex or as SR proteins, and this one belongs to neither class; whether it
    requires cofactors, and whether it competes with ALYREF for the same NXF1 surface, is
    unaddressed.
  experts:
  - Shi-Mei Zhuang
- question: >-
    The UPF0415 family is otherwise uncharacterised and this gene carries no phylogenetic
    (IBA) annotation. Is the adaptor function conserved in the family, and does a
    non-vertebrate ortholog exist that could be tested genetically?
  experts: []
suggested_experiments:
- hypothesis: >-
    C7orf25 activates NXF1 by physically opening the RBD-NTF2L autoinhibitory contact.
  description: >-
    Determine a structure of the NXF1 N-terminal region bound to C7orf25, by cryo-electron
    microscopy or crystallography, and compare it with the autoinhibited NXF1 conformation.
    The paper's own conclusion is that structural work is still needed; the mutations
    identified (PANAD R122/E125/G133/D139 and NXF1 Q20/K22/K23) give a defined interface to
    target and validate.
  experiment_type: structural biology
- hypothesis: >-
    The set of transcripts exported by this adaptor is defined by direct binding, and shares
    a recognisable element.
  description: >-
    Map the transcriptome-wide binding sites of endogenous C7orf25 by crosslinking and
    immunoprecipitation, and compare the bound set with the transcripts whose
    cytoplasmic-to-nuclear ratio falls on knockdown. If selectivity is intrinsic, the two
    sets should overlap and should share a motif or structural feature; if it is not, bound
    transcripts should simply track abundance in proliferating cells.
  experiment_type: CLIP-seq with nuclear/cytoplasmic fractionation RNA-seq
- hypothesis: >-
    C7orf25 is a general NXF1 adaptor whose apparent tumour specificity reflects which
    transcripts are abundant in proliferating cells, not a tumour-specific mechanism.
  description: >-
    Repeat the knockdown and export measurements in untransformed, non-proliferating primary
    hepatocytes and in the same cells stimulated to re-enter the cycle, and ask whether the
    dependent transcript set is the same. Include a conditional knockout mouse to test
    whether loss has any phenotype in normal tissue.
  experiment_type: comparative knockdown in primary versus transformed cells
