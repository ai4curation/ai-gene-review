- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:42449115
  qualifier: enables
  review:
    summary: 'Proposed new annotation: the protein binds NXF1 through a mapped interface,
      relieves the autoinhibitory contact between the NXF1 RNA-binding and NTF2-like
      domains, and simultaneously binds cargo mRNA, thereby bringing carrier and cargo
      together.'
    action: NEW
    reason: 'This is the molecular function the paper establishes, and GOA currently records
      nothing but bare protein binding for this gene. The GO definition of GO:0030674 fits
      literally: an adaptor that brings together a protein and another macromolecule such as
      a nucleic acid. Both halves were assayed - interface mutations on either side abolish
      the NXF1 interaction, and purified protein binds target mRNA directly. An alternative
      framing as a molecular function activator (relief of NXF1 autoinhibition) captures
      only half of the reported mechanism and is not proposed here. Offered as a reviewer
      proposal: one paper, one laboratory, no independent replication, and the conformational
      model is inferred from mutagenesis, FRET and complementation rather than from a
      structure.'
    supported_by:
    - reference_id: PMID:42449115
      supporting_text: Our findings demonstrate that PANAD functions by directly interacting
        with NXF1, disrupting the intramolecular interaction of NXF1 and facilitating the
        nuclear export of target mRNAs.
    - reference_id: PMID:42449115
      supporting_text: 'These findings suggest that PANAD employs a dual regulatory
        mechanism: it disrupts the intramolecular interaction of NXF1 to shift it to an
        active conformation while simultaneously binding directly to target mRNAs to promote
        their recruitment to NXF1.'
    - reference_id: PMID:42449115
      supporting_text: In vitro binding and BiFC assays confirmed that PANAD directly
        attenuated intramolecular RBD-NTF2L interactions in a binding-dependent manner.
