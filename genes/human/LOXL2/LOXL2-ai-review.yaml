core_functions:
- description: >-
    Secreted LOXL2 uses copper and its lysine-tyrosylquinone cofactor to oxidatively
    deaminate peptidyl lysine residues in extracellular collagen and elastin
    precursors. The resulting allysines initiate spontaneous covalent cross-links
    that stabilize collagen fibrils and elastic fibers. Recombinant human LOXL2
    directly oxidizes fibrillar type-I collagen and multiple collagen preparations,
    binds and deaminates tropoelastin, and generates cross-linked tropoelastin
    peptides. Copper loading activates LTQ formation; zinc-bound precursor-state
    protein is inactive. Full-length LOXL2 is catalytically competent, so cleavage
    between SRCR2 and SRCR3 is not treated as the activation step characteristic of
    LOX/LOXL1 propeptide removal. Nuclear, chromatin, hypoxia, EMT, and tumor-cell
    phenotypes are excluded from this core node, as are the retracted/disputed
    H3K4me3 claims. No stable protein-complex membership is asserted.
  molecular_function:
    id: GO:0004720
    label: protein-lysine 6-oxidase activity
  directly_involved_in:
  - id: GO:0018057
    label: peptidyl-lysine oxidation
  - id: GO:0030199
    label: collagen fibril organization
  - id: GO:0048251
    label: elastic fiber assembly
  locations:
  - id: GO:0031012
    label: extracellular matrix
  - id: GO:0005604
    label: basement membrane
  - id: GO:0071953
    label: elastic fiber
  supported_by:
  - reference_id: PMID:20306300
    supporting_text: >-
      All of the purified recombinant LOXL2 proteins, with or without the SRCR
      domains in the N-terminus, showed significant amine oxidase activity toward
      several different types of collagen and elastin in in vitro amine oxidase
      assays.
  - reference_id: PMID:20439985
    supporting_text: >-
      In this report, we assessed the steady-state enzymatic activity of lysyl
      oxidase-like 2 (LOXL2) against the substrates 1,5-diaminopentane (DAP),
      spermine, and fibrillar type I collagen.
  - reference_id: PMID:29581294
    supporting_text: >-
      Biochemical analysis confirms that copper loading robustly activates hLOXL2
      and supports LTQ formation.
  - reference_id: PMID:30676771
    supporting_text: >-
      We detected direct interaction between LOXL2 and tropoelastin (TE) and also
      LOXL2-mediated deamination of TE. Using proteomics, we identified several
      allysines together with cross-linked TE peptides.
- description: >-
    LOXL2 also acts as a non-catalytic extracellular-matrix scaffold through its
    N-terminal SRCR domains. These domains directly bind collagen IV, while LOXL2
    associates with collagen IV and fibronectin before their exocytic deposition,
    supporting endothelial basement-membrane organization independently of the
    catalytic domain. This is modeled separately from lysine oxidation because
    catalytic-dead and catalytic-domain-deleted proteins retain the relevant
    deposition activity. Sprouting angiogenesis is a downstream endothelial context,
    not a second molecular activity. The observed pairwise matrix interactions do not
    establish a single stable LOXL2-containing complex.
  molecular_function:
    id: GO:1990430
    label: extracellular matrix protein binding
  directly_involved_in:
  - id: GO:0071711
    label: basement membrane organization
  locations:
  - id: GO:0005604
    label: basement membrane
  supported_by:
  - reference_id: PMID:31759052
    supporting_text: >-
      LOXL2 interacts intracellularly and directly with collagen IV and fibronectin
      before incorporation into ECM fibrillar structures upon exocytosis, as
      demonstrated by TIRF time-lapse microscopy.
  - reference_id: PMID:31759052
    supporting_text: >-
      Neither enzyme activity nor catalytic domain were necessary for collagen IV
      deposition and angiogenesis, whereas the SRCR domains were effective for these
      processes.

knowledge_gaps:
- gap_statement: >-
    The endogenous human collagen and elastin lysine/hydroxylysine sites modified
    specifically by LOXL2, rather than another LOX-family enzyme, and their
    tissue-specific partitioning are unresolved.
  boundary: >-
    Recombinant human LOXL2 oxidizes several collagen preparations, fibrillar type-I
    collagen, and tropoelastin, but these assays do not define enzyme-specific sites
    or quantify LOXL2's share of cross-link formation in native human tissues.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Site- and enzyme-specific maps are needed to distinguish LOXL2 physiology from
    paralog redundancy and to interpret selective inhibition.
  resolution: >-
    Quantify site-resolved allysines, hydroxyallysines, and mature cross-links in
    primary human matrix-producing cells or organoids after selective endogenous
    LOXL2 degradation, with LOX/LOXL1/LOXL3/LOXL4 activity measured and controlled.
  provenance:
  - reference_id: PMID:29581294
    supporting_text: >-
      although their specific functions and substrate preferences in vivo remain to
      be elucidated.
- gap_statement: >-
    The physiological purpose and tissue regulation of LOXL2 cleavage between SRCR2
    and SRCR3 remain unknown, including whether processing changes substrate choice,
    extracellular retention, or SRCR-dependent scaffolding without activating
    catalysis.
  boundary: >-
    Full-length recombinant LOXL2 is active, and structural work places SRCR1/2 away
    from the catalytic domain. Cleavage therefore differs from activating propeptide
    removal in LOX and LOXL1, but its endogenous consequences are not defined.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Conflating processing with activation obscures which LOXL2 form performs
    catalysis versus matrix targeting and may misdirect form-selective interventions.
  resolution: >-
    Introduce endogenous cleavage-resistant and cleavage-mimetic alleles in human
    endothelial cells and fibroblasts, then compare secretion, matrix retention,
    substrate binding, site-resolved oxidation, and basement-membrane deposition.
  provenance:
  - reference_id: PMID:30676771
    supporting_text: >-
      Our data suggest that SRCR domains 1 and 2 are located away from the catalytic
      domain, supporting the notion that LOXL2 processing is not associated with
      enzyme activation, as recently proposed in López-Jiménez et al. (4).
- gap_statement: >-
    The molecular architecture, stoichiometry, and dynamics by which LOXL2 SRCR
    domains organize collagen IV and fibronectin deposition are not known.
  boundary: >-
    Direct binding and domain-rescue experiments establish a catalytic-independent
    matrix-scaffolding role, but they do not show whether LOXL2 simultaneously bridges
    substrates, acts sequentially during secretion, or forms a persistent complex.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Defining this mechanism is necessary to distinguish transient substrate handling
    from stable complex membership and to separate SRCR-targeted from catalytic
    interventions.
  resolution: >-
    Use endogenous split-proximity labeling, single-molecule stoichiometry, pulse-chase
    secretion imaging, and purified-domain reconstitution with collagen IV and
    fibronectin, including catalytic-dead and SRCR-deletion controls.
  provenance:
  - reference_id: PMID:31759052
    supporting_text: >-
      LOXL2 interacts intracellularly and directly with collagen IV and fibronectin
      before incorporation into ECM fibrillar structures upon exocytosis, as
      demonstrated by TIRF time-lapse microscopy.
- gap_statement: >-
    Whether endogenous LOXL2 has a reproducible normal intracellular catalytic
    substrate and how any intracellular pool bypasses or exits the secretory pathway
    remain unresolved.
  boundary: >-
    Tumor immunohistochemistry and overexpression experiments detect nuclear,
    cytoplasmic, and endoplasmic-reticulum pools, and methylated TAF10 was reported as
    a substrate. The H3K4me3 oxidation evidence is retracted or disputed and cannot
    establish normal chromatin catalysis.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this boundary would prevent extracellular catalytic function from being
    conflated with tumor-specific localization or invalid histone chemistry.
  resolution: >-
    Tag endogenous LOXL2 in normal and matched tumor-derived human cells, quantify
    secretory and intracellular forms, and test candidate intracellular substrates by
    activity-dependent proteomics and catalytic-dead rescue without relying on H3K4me3
    as a positive control.
  provenance:
  - reference_id: PMID:22204712
    supporting_text: >-
      The protein manifested decreased nuclear expression and increased cytoplasmic
      expression.
  - reference_id: PMID:22483618
    supporting_text: 1. RETRACTED ARTICLE

proposed_new_terms: []
suggested_questions:
- question: >-
    Which lysine and hydroxylysine sites in native human collagen and elastin are
    modified specifically by LOXL2 rather than another LOX-family enzyme?
- question: >-
    What controls endogenous SRCR1/2 cleavage, and does it alter LOXL2 substrate
    choice, matrix retention, or scaffolding without changing catalytic activation?
- question: >-
    Do LOXL2 SRCR domains bridge collagen IV and fibronectin simultaneously, or do
    they mediate sequential, transient interactions during basement-membrane
    secretion and assembly?
- question: >-
    Is there a normal endogenous intracellular LOXL2 catalytic substrate independent
    of the retracted/disputed H3K4me3 claim, and how is that LOXL2 pool generated?
suggested_experiments:
- hypothesis: >-
    LOXL2 oxidizes a defined subset of collagen and elastin sites in human matrix that
    is not redundantly modified by other LOX-family enzymes.
  description: >-
    Engineer an acute endogenous LOXL2 degron in primary human fibroblasts,
    endothelial cells, and matrix-producing organoids. Quantify site-resolved
    allysines, hydroxyallysines, and mature cross-links by targeted mass spectrometry,
    with wild-type and catalytic-dead rescue and parallel measurement or perturbation
    of LOX-family paralogs.
  experiment_type: endogenous protein degradation and matrix cross-link proteomics
- hypothesis: >-
    SRCR1/2 cleavage changes LOXL2 substrate presentation and extracellular retention
    but is not required for catalytic activation.
  description: >-
    Create endogenous cleavage-resistant and cleavage-mimetic LOXL2 alleles in human
    endothelial cells and fibroblasts. Compare secretion kinetics, full-length and
    processed forms, copper/LTQ-dependent activity, collagen/tropoelastin oxidation,
    collagen-IV/fibronectin binding, and matrix deposition.
  experiment_type: endogenous processing and substrate-targeting analysis
- hypothesis: >-
    LOXL2 SRCR domains transiently coordinate collagen IV and fibronectin during
    exocytosis rather than forming a stable extracellular complex.
  description: >-
    Combine endogenous pulse-chase imaging, split-proximity labeling, cross-linking
    mass spectrometry, and single-molecule stoichiometry with purified SRCR-domain
    reconstitution. Compare wild-type, SRCR-deleted, and catalytic-dead LOXL2 while
    separately measuring deposition and angiogenic phenotypes.
  experiment_type: matrix-scaffold interaction dynamics
- hypothesis: >-
    Reported nuclear and chromatin-associated LOXL2 catalysis is context dependent and
    absent from normal human cells at endogenous abundance.
  description: >-
    Endogenously tag LOXL2 on both sides of the signal peptide/processing boundaries
    in normal and matched tumor-derived cells, quantify intracellular forms by
    compartment-resolved proteomics, and test TAF10 and unbiased candidate substrates
    with wild-type versus catalytic-dead rescue. Treat H3K4me3 oxidation as a disputed
    claim requiring independent replication, not as an assay-positive control.
  experiment_type: endogenous localization and intracellular-substrate validation
