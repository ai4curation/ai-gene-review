id: Q9Y4K0
gene_symbol: LOXL2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LOXL2 is a secreted copper- and lysine-tyrosylquinone-dependent protein-lysine
  oxidase with four N-terminal scavenger receptor cysteine-rich domains and a
  C-terminal catalytic domain. In the extracellular matrix and basement membrane,
  it oxidatively deaminates selected peptidyl lysines in collagen and elastin
  precursors, generating aldehydes that initiate covalent cross-link formation and
  stabilize matrix fibers. Its SRCR domains also bind extracellular-matrix proteins
  and can organize collagen IV and fibronectin deposition independently of catalytic
  activity. LOXL2 thereby contributes to connective-tissue matrix assembly and, in
  endothelial contexts, vascular basement-membrane organization and angiogenesis.
  Proteolytic removal of the first two SRCR domains can alter form and substrate
  presentation but is not required to activate the full-length enzyme. Intracellular
  pools and catalytic-independent effects have been reported in tumor and
  differentiation models, but they are context dependent and distinct from the core
  extracellular oxidase and matrix-scaffolding activities.
