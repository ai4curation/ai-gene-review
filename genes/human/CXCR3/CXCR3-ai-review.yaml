id: P49682
gene_symbol: CXCR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CXCR3 (CD183) is a class A seven-transmembrane G protein-coupled chemokine receptor of the
  plasma membrane. Its canonical product, isoform A, is the receptor for the interferon-inducible C-X-C
  chemokines CXCL9 (Mig), CXCL10 (IP-10) and CXCL11 (I-TAC). Ligand binding requires sulfated tyrosines
  27 and 29 in the extracellular N terminus, and receptor activation through pertussis-toxin-sensitive
  Gi proteins drives cytosolic calcium mobilization and directed cell migration; an arginine in the second
  extracellular loop is needed for signaling but not for binding. CXCR3 is induced on activated and memory
  T lymphocytes of the Th1 and cytotoxic types and also occurs on NK cells, some B cells, eosinophils
  and cytokine-stimulated haematopoietic progenitors, where it directs effector cells to sites of interferon-driven
  inflammation and modulates integrin-dependent adhesion. CXCL4/PF4 and CXCL13 act as additional, context-dependent
  agonists. Alternative splicing yields CXCR3-B, an isoform with an extended N terminus expressed on microvascular
  endothelium, which binds CXCL4 with high affinity, signals with raised cAMP, and mediates angiostatic,
  anti-proliferative and pro-apoptotic responses to CXCR3 ligands, and CXCR3-alt, a truncated exon-skipping
  variant. Human CXCR3 does not respond to CC chemokines; unlike the mouse receptor it is not activated
  by CCL21. The receptor can form heteromers with CXCR4 and with the atypical receptor ACKR4, which alter
  its ligand binding and chemotactic output.
