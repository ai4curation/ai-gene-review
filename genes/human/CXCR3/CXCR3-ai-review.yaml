    action: REMOVE
    reason: 'C-C chemokine receptor activity is not supported for human CXCR3. The inherited claim comes
      from PAINT node PTN001628461, a deep node in PTHR10489 whose descendants include the CC receptors
      (donors P32246/CCR2, P51681/CCR5, P51684/CCR6 and the MGI Ccr genes) as well as the CXCR lineages.
      Human CXCR3 (subfamily PTHR10489:SF671) does sit inside that clade, but ligand class is a lineage-specific
      property in this family and there is direct target-specific evidence of divergence: the cloned human
      receptor did not respond to any of ten CC chemokines tested, the Lasagni panel found no CC chemokine
      competing for CXCL10 binding, and human CCL21, the CC ligand that does act on mouse Cxcr3, is not
      a ligand for human CXCR3. No human study reports a CC chemokine acting on CXCR3. The inherited C-C
      claim is therefore contradicted for this gene product, while the correct ligand-class terms are
      accepted on other rows.'
