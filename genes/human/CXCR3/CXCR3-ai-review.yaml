core_functions:
- description: CXCR3 is the plasma membrane receptor for the interferon-inducible C-X-C chemokines CXCL9,
    CXCL10 and CXCL11. It binds them through a sulfotyrosine-containing extracellular N-terminal site
    and, via pertussis-toxin-sensitive Gi proteins, triggers cytosolic calcium mobilization and directed
    migration of activated T lymphocytes toward interferon-driven inflammatory sites.
  molecular_function:
    id: GO:0016494
    label: C-X-C chemokine receptor activity
  directly_involved_in:
