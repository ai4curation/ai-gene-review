id: P49682
gene_symbol: CXCR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CXCR3 is a seven-transmembrane chemokine receptor that recognizes CXCL9, CXCL10 and CXCL11
  and coordinates lymphocyte recruitment through G-protein signaling. Human alternative isoforms differ
  in ligand recognition and downstream growth responses; CXCR3-B also recognizes CXCL4 and mediates angiostatic
  responses.
alternative_products:
- name: 1 (CXCR3-A)
  id: P49682-1
- name: 2 (CXCR3-B)
  id: P49682-2
  sequence_note: VSP_015684
- name: 3 (CXCR3-alt)
  id: P49682-3
  sequence_note: VSP_015685
existing_annotations:
- term:
    id: GO:0001937
    label: negative regulation of endothelial cell proliferation
  evidence_type: IDA
  original_reference_id: PMID:12782716
  qualifier: involved_in
  isoform: P49682-2
  review:
    summary: 'negative regulation of endothelial cell proliferation: The CXCR3-B isoform experiments support
      endothelial growth inhibition, cAMP-linked signaling and apoptosis. These are real isoform/context-dependent
      activities but do not describe the principal lymphocyte-trafficking function of CXCR3-A. The experimental
      isoform context should accompany interpretation.'
    action: KEEP_AS_NON_CORE
    reason: The CXCR3-B isoform experiments support endothelial growth inhibition, cAMP-linked signaling
      and apoptosis. These are real isoform/context-dependent activities but do not describe the principal
      lymphocyte-trafficking function of CXCR3-A. The experimental isoform context should accompany interpretation.
    supported_by:
    - &id001
      reference_id: PMID:12782716
      supporting_text: 'Human

        microvascular endothelial cell line-1 (HMEC-1), transfected with either the

        known CXCR3 (renamed CXCR3-A) or CXCR3-B, bound CXCL9, CXCL10, and CXCL11,

        whereas CXCL4 showed high affinity only for CXCR3-B.'
