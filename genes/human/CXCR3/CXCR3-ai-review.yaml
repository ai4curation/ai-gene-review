suggested_questions:
- question: Does the CXCR3-B isoform couple directly to Gs, or is the cAMP rise it produces an indirect
    consequence of another transducer?
- question: What are the endogenous expression levels and cell types of CXCR3-A, CXCR3-B and CXCR3-alt,
    and how much of each isoform's reported biology survives at physiological receptor density rather
    than in overexpressing transfectants?
- question: Is CXCL4 a direct orthosteric CXCR3 agonist, or does it act largely through glycosaminoglycan
    presentation, as the low-affinity binding in GAG-deficient cells suggests?
- question: Do CXCR3-CXCR4 and CXCR3-ACKR4 heteromers form at endogenous receptor levels in primary lymphocytes,
    and do they change ligand selectivity there?
- question: Which interaction surface do the RAMP proteins use on CXCR3, and does any of them alter its
    trafficking or ligand pharmacology, so that an informative molecular function could replace the generic
    protein-binding annotations?
suggested_experiments:
- description: Measure G protein coupling of each CXCR3 isoform directly (for example by BRET-based G
    protein activation sensors across the Gi, Gs and Gq families) in cells expressing matched, physiological
    receptor levels.
- description: Knock in epitope tags or isoform-selective reporters at the endogenous CXCR3 locus in primary
    human T cells and endothelial cells to quantify CXCR3-A and CXCR3-B abundance and to test whether
    the angiostatic responses require CXCR3-B.
- description: Test CXCL4 and CXCL13 binding and signaling at CXCR3 in glycosaminoglycan-deficient cells
    and with GAG-binding-deficient chemokine mutants, to separate direct receptor agonism from GAG-mediated
    presentation.
- description: Use proximity labeling or single-molecule imaging in primary lymphocytes to test whether
    CXCR3 forms heteromers with CXCR4 or ACKR4 at endogenous expression, and measure the effect on CXCL10-driven
    chemotaxis.
