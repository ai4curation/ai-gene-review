  review:
    summary: >-
      Synthetic P155 supplied to dendritic cells reduced delivery of soluble ovalbumin to
      LAMP2A-positive lysosomes, weakened the HSC70-HSP90 and HSC70-LAMP2A interactions,
      lowered MHC class II levels and impaired priming of OT-II CD4+ T cells. Direction
      (negative regulation) and cell type (dendritic cell) both match the evidence.
    action: ACCEPT
    reason: >-
      This is the core biological role of the peptide and the term is at the right level of
      specificity. Two caveats should be read alongside it rather than against it: the
      trafficking, MHC class II and T cell priming readouts were obtained in mouse
      bone-marrow-derived dendritic cells treated with the human peptide (the authors state
      the coding sequence was not found in the mouse genome, and rely on human and mouse
      HSC70 being essentially identical), and all functional experiments used exogenously
      added synthetic peptide rather than loss of the endogenous peptide, which is difficult
      to achieve because the ORF lies within the miR-155 primary transcript. Target
      identification and the ATPase measurement were, however, done with human cells and
      recombinant human HSPA8, so the mechanism underlying this process term is
      human-grounded.
