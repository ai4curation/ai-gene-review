    reason: >-
      This is an informative molecular function term, not bare protein binding, and names
      the right partner (P11142, HSPA8). The evidence is from human cells with a specific,
      competition-validated interaction and a mapped binding site. It understates the
      mechanism, however, since binding to the nucleotide-binding domain inhibits HSPA8 ATP
      hydrolysis; an ATPase inhibitor activity annotation is proposed separately rather than
      replacing this row, because the physical interaction and the inhibitory effect are
      separately evidenced and both are worth recording.
