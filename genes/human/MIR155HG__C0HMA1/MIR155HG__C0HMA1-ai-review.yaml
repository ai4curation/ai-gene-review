proposed_new_terms: []
suggested_questions:
- question: >-
    Does the endogenous peptide, as opposed to synthetic peptide supplied at micromolar
    concentration, restrain antigen presentation? Every functional result for this entry
    comes from adding peptide from outside, and the experiment that would settle whether the
    annotations describe a physiological function or a pharmacological one has not been
    done.
  experts:
  - Hua Wang
  - Arnaud Besson
- question: >-
    Is the coding ORF genuinely absent from the mouse genome? The primary paper states it is
    and uses the human peptide on mouse cells for that reason, while a second group
    describes the peptide as partially conserved in mouse. The answer decides whether any
    mouse ortholog annotation is legitimate and whether mouse disease models are testing a
    conserved physiological axis or a human-peptide intervention.
  experts:
  - Jean-Philippe Combier
  - Serge Plaza
- question: >-
    Should the MHC class II route be annotated explicitly, with negative regulation of
    antigen processing and presentation of peptide antigen via MHC class II, alongside the
    dendritic-cell term already present? The mechanism runs through LAMP2A and surface MHC
    class II, but the two terms overlap heavily and the evidence comes from a single study,
    so this was left as a question rather than proposed.
  experts:
  - Hua Wang
- question: >-
    What does the peptide do in the nucleus? Nuclear residence is documented, host-pri-miRNA
    autoregulation has been excluded, and no nuclear partner is known.
  experts:
  - Arnaud Besson
suggested_experiments:
- hypothesis: >-
    The endogenous peptide, not just exogenously supplied peptide, limits MHC class
    II-restricted antigen presentation in human dendritic cells.
  description: >-
    Disrupt the ORF without disturbing miR-155 production: introduce a start-codon or
    frameshift mutation in the sORF by base editing in human monocyte-derived or
    iPSC-derived dendritic cells, confirm by peptide-specific immunoblot and mass
    spectrometry that the peptide is lost while pri-miR-155 and mature miR-155 levels are
    unchanged, then measure antigen delivery to LAMP2A-positive compartments, surface MHC
    class II and autologous CD4+ T cell proliferation. The complementary control is to
    re-express the ORF from a heterologous promoter.
- hypothesis: >-
    The peptide is a competitive inhibitor of nucleotide binding or of a nucleotide-cycle
    step of HSPA8, rather than an unspecific aggregation-prone peptide effect.
  description: >-
    Characterise the inhibition kinetically with purified human HSPA8: steady-state ATP
    hydrolysis across an ATP concentration series with and without peptide to establish the
    mode of inhibition and an IC50, isothermal titration calorimetry or surface plasmon
    resonance against the isolated nucleotide-binding domain to obtain an affinity, and a
    scrambled-sequence and alanine-scan series to identify the residues required. Pair this
    with a luciferase-refolding or client-release assay to show that the chaperone cycle
    itself, not only hydrolysis, is slowed.
- hypothesis: >-
    The peptide acts on chaperone-mediated autophagy substrate delivery generally, not only
    on the dendritic-cell antigen route.
  description: >-
    In a non-immune human cell line, use a KFERQ-motif reporter to quantify
    chaperone-mediated autophagy flux with and without the peptide, and test whether the
    peptide alters HSPA8-LAMP2A co-immunoprecipitation and lysosomal translocation of a
    canonical substrate. A positive result would indicate that the dendritic-cell phenotype
    is one consequence of a broader effect on HSC70-dependent delivery, and would change
    which process terms are appropriate.
