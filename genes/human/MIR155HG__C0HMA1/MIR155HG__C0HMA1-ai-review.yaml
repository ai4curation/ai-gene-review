description: >-
  miPEP155 (P155) is a 17-amino-acid human micropeptide translated from a 54-bp sense short
  open reading frame inside MIR155HG, the miR-155 host transcript (BIC), which is otherwise
  annotated as non-coding; it therefore has its own UniProt entry while sharing the host
  locus symbol. The peptide is made endogenously, as shown by a CRISPR knock-in EGFP
  reporter at the ORF stop codon, a peptide-specific antibody and mass spectrometry of
  immunoprecipitates, and the host transcript is strongly induced in antigen-presenting
  cells of inflamed skin. miPEP155 is found in the cytoplasm and nucleus and binds the
  nucleotide-binding (ATPase) domain, but not the substrate-binding domain, of the
  constitutive chaperone HSC70/HSPA8, lowering its ATP hydrolysis rate. In dendritic cells
  this weakens the HSC70-HSP90 co-chaperone machinery and HSC70's association with LAMP2A,
  so that internalised antigen is delivered less efficiently to lysosomes, surface MHC
  class II is reduced and priming of CD4+ T cells is dampened; synthetic peptide given to
  mice alleviates MOG-induced experimental autoimmune encephalomyelitis and
  imiquimod-induced psoriasis-like skin inflammation. The peptide does not regulate the
  level of its own primary miRNA transcript or the activity of miR-155, and appears
  functionally antagonistic to the microRNA it is co-transcribed with. Its coding sequence
  is well conserved in primates but is reported as absent or only partially conserved in
  mouse, whereas HSC70 itself is essentially identical between human and mouse.
