id: Q99593
gene_symbol: TBX5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TBX5 is a T-box transcription factor of the TBX2/3/4/5 subfamily, expressed in the developing heart
  (atria, left ventricle, conduction system, epicardium) and forelimb. Its N-terminal T-box domain binds T-box elements
  (AGGTGTGA) in Pol II promoters and enhancers, and TBX5 mainly activates targets such as NPPA, GJA5/Cx40, FGF10,
  MYH6, ID2 and PITX2. It works cooperatively with partner cardiac transcription factors: it binds NKX2-5 (heterodimer
  on composite DNA elements), GATA4 and MEF2C, and interacts with SALL4 in limb and heart patterning. Coactivators
  TAZ/YAP1 and acetylation by KAT2A/KAT2B enhance its activity, and acetylation promotes nuclear retention. TBX5
  shuttles between nucleus and cytoplasm, where the PDZ-LIM protein PDLIM7 (LMP4) tethers it to actin and represses
  it. In development TBX5 is required for forelimb bud initiation through direct activation of Fgf10, for atrial
  and ventricular septation, for posterior (inflow) heart growth, and in a dosage-sensitive way for patterning and
  maturation of the atrioventricular node and ventricular conduction system. In the adult atrium it maintains rhythm
  through a TBX5-PITX2 network. Heterozygous loss-of-function variants cause Holt-Oram syndrome (upper-limb radial-ray
  defects with atrial/ventricular septal defects and conduction block), and variants are associated with atrial
  fibrillation and dilated cardiomyopathy.'
