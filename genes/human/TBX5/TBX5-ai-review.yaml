core_functions:
- description: Sequence-specific RNA polymerase II transcription factor that binds T-box elements via its T-box
    domain and activates cardiac and limb target genes such as NPPA, GJA5/Cx40, FGF10 and MYH6.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:11431700
    supporting_text: Tbx5 and Nkx2-5 directly bound to the promoter of the gene for cardiac-specific natriuretic
      peptide precursor type A (Nppa) in tandem, and both transcription factors showed synergistic activation
  - reference_id: PMID:26926761
    supporting_text: Here we report a crystal structure of human NKX2.5 and TBX5 DNA binding domains in a complex
      with a 19 bp target DNA
  - reference_id: PMID:12490567
    supporting_text: Tbx5 directly activates the Fgf10 gene via a conserved binding site, providing a simple and
      direct mechanism for limb bud initiation
  - reference_id: PMID:12499378
    supporting_text: Mutations G80R, R237Q, and R237W represent a group of mutations that dramatically reduce DNA-binding
      activity of TBX5, leading to reduced transcription activation by TBX5
- description: Binds partner cardiac DNA-binding transcription factors (NKX2-5, GATA4, MEF2C) and forms cooperative
    complexes on composite promoter elements that synergistically activate targets such as NPPA and MYH6; HOS missense
    mutations disrupt these interactions.
  molecular_function:
    id: GO:0061629
    label: RNA polymerase II-specific DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11431700
    supporting_text: the N-terminal domain and N-terminal part of the T-box of Tbx5 and the homeodomain of Nkx2-5
      were necessary for their interaction
  - reference_id: PMID:26926761
    supporting_text: The ternary complex structure of NKX2.5 and TBX5 with the target DNA shows physical interactions
      between the two proteins through Lys158 (NKX2.5), Asp140 (TBX5), and Pro142 (TBX5)
  - reference_id: PMID:12499378
    supporting_text: All seven missense mutations greatly reduced the interaction of TBX5 with NKX2.5 in vivo and
      in vitro.
  - reference_id: PMID:12845333
    supporting_text: the Gata4 mutation abrogated a physical interaction between Gata4 and TBX5
  - reference_id: PMID:19204083
    supporting_text: we report a physical interaction between TBX5 and MEF2C leading to a synergistic activation
      of the alpha-cardiac myosin heavy chain (MYH6)
- description: 'As a cardiac transcription factor (the T-box component of the NKX2-5/GATA4/TBX5 kernel), drives
    heart development: posterior/atrial growth, ventricular septation, and dosage-sensitive patterning and maturation
    of the atrioventricular node and ventricular conduction system.'
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0007507
    label: heart development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11572777
    supporting_text: Tbx5 deficiency in homozygous mice (Tbx5(del/del)) decreased expression of multiple genes and
      caused severe hypoplasia of posterior domains in the developing heart
  - reference_id: PMID:11572777
    supporting_text: Direct and cooperative transactivation of the ANF and cx40 promoters by Tbx5 and the homeodomain
      transcription factor Nkx2-5 was also demonstrated
  - reference_id: PMID:19727199
    supporting_text: loss of Tbx5 in the mouse ventricle results in a single chamber lacking distinct identity,
      indicating a requirement for Tbx5 in septation
  - reference_id: PMID:15289437
    supporting_text: Tbx5 haploinsufficiency caused patterning defects of both the left and right ventricular bundle
      branches
  - reference_id: PMID:17604724
    supporting_text: compound haploinsufficiency of Tbx5 and Nkx2-5 or Tbx5 and Id2 prevented embryonic specification
      of the ventricular conduction system
  - reference_id: PMID:8988165
    supporting_text: We conclude that TBX5 is critical for limb and heart development and suggest that haploinsufficiency
      of TBX5 causes Holt-Oram syndrome
- description: Initiates forelimb bud formation by directly activating Fgf10 in forelimb-field lateral plate mesoderm
    and is required for continued forelimb outgrowth; haploinsufficiency causes radial-ray upper-limb defects.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0035115
    label: embryonic forelimb morphogenesis
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12490567
    supporting_text: Tbx5 directly activates the Fgf10 gene via a conserved binding site, providing a simple and
      direct mechanism for limb bud initiation
  - reference_id: PMID:12490567
    supporting_text: mouse embryos lacking Tbx5 do not form forelimb buds
  - reference_id: PMID:12736217
    supporting_text: we demonstrate that this gene is also required at early limb bud stages for forelimb bud development
  - reference_id: PMID:16183809
    supporting_text: validate our clinical diagnostic criteria for HOS including an absolute requirement for preaxial
      radial ray upper limb malformation
suggested_questions:
- question: Should TBX5 carry GO:0060174 limb bud formation (or a forelimb-specific child), given direct Fgf10 activation
    and absence of forelimb buds in Tbx5 null mice, and why is mouse Tbx5 not annotated to it?
- question: Does cytoplasmic TBX5 (PDLIM7/LMP4-bound, actin-associated) have any function of its own, or is it purely
    a regulatory sequestration pool?
- question: Which TBX5 targets mediate its non-cell-autonomous inhibition of cardiomyocyte proliferation in overexpression
    studies, and is this physiological?
suggested_experiments:
- hypothesis: HOS missense variants differ in whether they impair DNA binding or partner-TF cooperativity at specific
    atrial and conduction-system enhancers.
  description: CUT&RUN for TBX5, NKX2-5 and GATA4 in isogenic TBX5 wild-type, heterozygous-null and missense-knock-in
    human iPSC-derived atrial and conduction-like cardiomyocytes, combined with ATAC-seq and RNA-seq.
  experiment_type: genome-wide DNA-binding and transcriptomic profiling
