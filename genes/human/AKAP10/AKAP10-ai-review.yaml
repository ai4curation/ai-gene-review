- id: PMID:9326583
  title: D-AKAP2, a novel protein kinase A anchoring protein with a putative RGS domain.
  findings:
  - statement: Dual specificity was established here, with the active fragment binding RI-alpha,
      RII-alpha and RII-beta but not RI-beta, and the binding site on the R subunits mapped to
      their N-terminal dimerization domain.
    supporting_text: Based on coprecipitation assays, the R binding domain interacts with the
      N-terminal dimerization domain of RIalpha and RIIalpha.
  - statement: The RGS assignment was homology-only from the outset, covering residues 70-215 of
      the 372-residue mouse clone.
    supporting_text: Surprisingly, however, residues 70–215 showed homology to the RGS domain
      found in RGS proteins.
  - statement: The authors themselves recorded that the RGS domain lacks conserved charged
      residues and predicted it would not behave like a canonical RGS protein, the earliest
      warning against reading GAP activity off the domain name.
    supporting_text: Surprisingly, not all of the charged residues conserved in RGS proteins
      reported so far were conserved in D-AKAP2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Two cautions for anyone reusing it. First, it is mouse work:
      the two-hybrid screen used a mouse embryonic library and the full-length clone came from a
      mouse testis library, so its 372-residue protein is not the 662-residue human entry, and
      the "residues 333-372" R-binding fragment is in mouse numbering. Second, its
      signal-transduction framing was explicitly speculative about the RGS domain, which is why
      the GO:0007165 TAS row derived from it is marked over-annotated. No retraction, no erratum,
      no expression of concern.
- id: PMID:11248059
  title: Cloning and mitochondrial localization of full-length D-AKAP2, a protein kinase A
    anchoring protein.
  findings:
  - statement: The full-length human protein was cloned here and shown to be 662 residues with a
      second RGS domain not present in the original mouse clone.
    supporting_text: Here, we report the cloning of full-length human D-AKAP2 (662 residues) with
      an additional putative RGS domain, and the corresponding mouse protein less the first two
      exons (617 residues).
  - statement: Endogenous protein from three species including human was reported as highly
      enriched in mitochondria. This is the source of the gene's UniProt name and of the
      mitochondrion annotations, and it is the claim that PMID:19797056 later disputed.
    supporting_text: Subcellular localization for endogenous mouse, rat, and human D-AKAP2 was
      determined by immunocytochemistry, immunohistochemistry, and tissue fractionation. D-AKAP2
      from all three species is highly enriched in mitochondria.
  - statement: In vivo association with PKA was shown by cAMP-agarose pull-down from mouse brain.
      This is the experiment behind the mouse GO:0043495 IDA that both the PAINT and Compara
      rows transfer.
    supporting_text: In vivo association of D-AKAP2 with PKA in mouse brain was demonstrated by
      using cAMP agarose pull-down assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. It is the ultimate source of three GOA rows via the mouse
      orthologue and of UniProt's Mitochondrion, Membrane and Cytoplasm subcellular-location
      terms, so it is load-bearing out of proportion to its visibility - GOA cites it nowhere on
      the human gene directly. Not cited by the seeded stub; recovered from the affinage record
      and from the mouse donor's QuickGO evidence.
- id: PMID:12206784
  title: Domain organization of D-AKAP2 revealed by enhanced deuterium exchange-mass
    spectrometry (DXMS).
  findings:
  - statement: Hydrogen-deuterium exchange showed the protein is two folded regions separated by
      disordered linkers, with the PKA-binding site highly protected and the PDZ-binding motif
      solvent-exposed, the physical basis for the two C-terminal motifs behaving independently.
    supporting_text: The second folded region contained a highly protected PKA binding site and a
      more solvent-accessible PDZ binding motif, which may serve as a potential targeting domain
      for D-AKAP2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only. Background architecture rather than a GO-annotatable result, and it produced
      no annotation on any gene. Used here only to describe the domain organisation.
- id: PMID:14531807
  title: 'PDZK1: II. an anchoring site for the PKA-binding protein D-AKAP2 in renal proximal
    tubular cells.'
  findings:
  - statement: The C-terminal PDZ motif binds PDZK1 tightly and NHERF-1 about fourfold more
      weakly, linking AKAP10 to the scaffolds that position the NaPi-IIa phosphate cotransporter.
    supporting_text: In pull-down experiments, D-AKAP2 tightly bound PDZK1 as well as N+/H+
      exchanger regulator factor (NHERF-1), but the latter with an apparent fourfold lower
      affinity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only. Species caution recorded rather than glossed: this is mouse D-AKAP2 (the
      372-residue renal isoform) assayed in transfected opossum kidney cells, so it cannot
      support a human experimental evidence code on its own - it is used here as corroboration of
      the PDZK1 interaction, whose human evidence comes from PMID:36115835 and PMID:25348485.
      Note also that its second partner is NHERF-1 (SLC9A3R1), which is a different protein from
      the NHERF2 (SLC9A3R2) in GOA.
- id: PMID:17485678
  title: Gene-trapped mouse embryonic stem cell-derived cardiac myocytes and human genetics
    implicate AKAP10 in heart rhythm regulation.
  findings:
  - statement: The common human 646V variant is associated with increased basal heart rate and
      decreased heart rate variability. This is a population association, not a molecular
      function or a process of the wild-type protein, and no cardiac GO term is proposed from it.
    supporting_text: We also found that a common variant of AKAP10 in humans (646V, 40% of
      alleles) was associated with increased basal heart rate and decreased heart rate
      variability (markers of low cholinergic/vagus nerve sensitivity).
  - statement: The mouse allele is a C-terminal gene trap that the authors read as
      dominant-interfering, so it is not a clean loss of function for the wild-type protein.
    supporting_text: In both heterozygous and homozygous mutant mice derived from these mESCs,
      the same Akap10 disruption increases the cardiac response to cholinergic signals,
      suggesting a dominant interfering effect of the Akap10 mutant allele.
  - statement: The authors state that the molecular mechanism is unknown.
    supporting_text: Although the molecular mechanism remains unknown, our findings in mutant
      mESCs, mice, and a common human AKAP10 SNP all suggest a role for AKAP10 in heart rhythm
      control.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only. The source of UniProt's VARIANT 646 I->V entry. Relevance is deliberately
      MEDIUM rather than HIGH: it is the best-known AKAP10 paper and it supports no GO annotation
      on the human gene, because the perturbation is mouse, the allele is dominant-interfering
      and the human evidence is statistical association. Kept in the reference list precisely so
      that the reason for not annotating from it is on the record.
- id: PMID:19797056
  title: D-AKAP2 interacts with Rab4 and Rab11 through its RGS domains and regulates transferrin
    receptor recycling.
  findings:
  - statement: The tandem RGS domains bind Rab11 and GTP-bound Rab4, the first report of RGS
      domains binding small GTPases.
    supporting_text: We show here that these RGS domains interact with Rab11 and GTP-bound Rab4,
      the first demonstration of RGS domains binding small GTPases.
  - statement: The two RGS domains act as one binding unit, since residues 120-513 are necessary
      and sufficient while neither domain alone binds either Rab.
    supporting_text: Neither RGS-A (residues 120–369) nor RGS-B (residues 374–513) alone was able
      to interact with Rab4 or Rab11, suggesting that the two RGS domains form a single
      functional unit.
  - statement: The paper states the negative result for the canonical RGS function directly, with
      no specific interaction with heterotrimeric G proteins and no ability to activate them.
    supporting_text: D-AKAP2 has so far demonstrated no specific interactions with heterotrimeric
      G proteins, and no ability to activate them, raising the possibility of nontraditional
      targets.
  - statement: Endogenous human AKAP10 is almost entirely cytosolic in HeLa cells, contradicting
      the earlier mitochondrial enrichment report.
    supporting_text: Cell fractionation showed that endogenous D-AKAP2 is almost entirely
      cytosolic
  - statement: Knockdown accelerates transferrin recycling by 73 percent, establishing that the
      wild-type protein restrains traffic out of the recycling compartment.
    supporting_text: Fitting all of the data to an exponential decay function yielded a rate of
      transferrin recycling that was 73 ± 21% faster in the D-AKAP2 knockdown cells than in
      control cells
  - statement: All constructs used the human gene, which is what makes human experimental
      evidence codes appropriate for the rows proposed from this paper.
    supporting_text: All D-AKAP2 constructs used the human gene with valine at position 646.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read in full. The single most informative paper on this gene, and
      QuickGO returns ZERO annotations for reference=PMID:19797056 across all of GOA - not on
      AKAP10, not on RAB4A, RAB11A or TFRC, not on any gene in any species. Three of this
      review's NEW rows come from it. It is also the source of the explicit negative on Galpha
      activation and of the challenge to the mitochondrial localisation. Absent from the seeded
      stub; recovered from the affinage record. No retraction, no erratum.
- id: PMID:20159461
  title: 'Structure of D-AKAP2:PKA RI complex: insights into AKAP specificity and
