- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: TAS
  original_reference_id: PMID:9326583
  qualifier: involved_in
  review:
    summary: >-
      The root term of the biological-process signalling branch, asserted from a 1997 paper
      whose signalling rationale was an explicit speculation about a putative RGS domain. That
      speculation is contradicted by later work and by residue analysis, and no replacement term
      exists.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      What PMID:9326583 measured is binding of a 40-residue fragment to PKA RI-alpha, RII-alpha
      and RII-beta. Its signal-transduction framing rested on the RGS domain, which the authors
      themselves already flagged as divergent: not all of the charged residues conserved in RGS
      proteins were conserved in D-AKAP2, and they wrote that if it is a functional RGS it may
      not interact with G-i-alpha as known RGS proteins do. Twelve years later the same group
      stated the negative outright - no specific interactions with heterotrimeric G proteins and
      no ability to activate them. Residue analysis in this review
      (file:human/AKAP10/AKAP10-bioinformatics/RESULTS.md) finds 0 of 5 Galpha transition-state
      contacts retained in either RGS domain, matching the AXIN1 negative control and unlike the
      RGS16 and RGS9 positive controls at 5 of 5.

      Marked over-annotated rather than removed: AKAP10 genuinely is part of cAMP signalling, so
      the term is not false, merely the uninformative root of the branch. No MODIFY is offered
      because the natural replacement, GO:0010738 regulation of protein kinase A signaling, was
      checked and is obsolete; GO has no active term for an AKAP's role in organising PKA
      signalling. The informative content of this paper is carried by the GO:0034237 rows.
    supported_by:
    - reference_id: PMID:9326583
      supporting_text: Surprisingly, not all of the charged residues conserved in RGS proteins
        reported so far were conserved in D-AKAP2.
    - reference_id: PMID:9326583
      supporting_text: The lack of conservation of these charge residues suggests that if
        D-AKAP2 is a functional RGS, it may not interact with Giα as most of the known RGSs do,
        but with other Gα isoforms.
    - reference_id: PMID:19797056
      supporting_text: D-AKAP2 has so far demonstrated no specific interactions with
        heterotrimeric G proteins, and no ability to activate them, raising the possibility of
        nontraditional targets.
- term:
