- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20159461
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00514
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P10644
      label: PRKAR1A
  review:
    summary: >-
      The AKAP10:PKA-RI crystal structure, recorded as bare protein binding. The partner is
      the PKA type I-alpha regulatory subunit and the interaction is solved at 2.28 A, so an
      informative term is available and should be used.
    action: MODIFY
    reason: >-
      P00514 resolves to KAP0_BOVIN, reviewed Swiss-Prot, 380 aa - the canonical bovine
      PKA RI-alpha entry, which UniProt's own INTERACTION block flags as Xeno. The AKAP10
      side of the experiment is human: UniProt cross-references the structure as
      "DR   PDB; 3IM4; X-ray; 2.28 A; C=623-662.", i.e. chain C is human AKAP10 residues
      623-662, and the resulting helix is recorded in the feature table as
      "FT   HELIX           629..653". IntAct lists this partner under two methods,
      x-ray diffraction and fluorescence spectroscopy, so it is not a single-modality claim.

      GO:0005515 conveys nothing here. Every AKAP10 experiment, in this paper and in
      PMID:25097019 and PMID:25348485, assays binding to the regulatory subunit
      dimerization/docking domain; none assays the catalytic subunit. GO:0034237 protein
      kinase A regulatory subunit binding is an active is_a child of GO:0051018 (verified
      via QuickGO: isObsolete false, no secondaryIds, no children) and states exactly what
      was measured. The has_input extension records the human orthologue of the assayed
      partner; the bovine accession stays in supporting_entities because that is the
      protein that was actually in the crystal.
    proposed_replacement_terms:
    - id: GO:0034237
      label: protein kinase A regulatory subunit binding
    supported_by:
    - reference_id: PMID:20159461
      supporting_text: Here we have determined the structures of the RIalpha D/D domain alone
        and in complex with D-AKAP2.
    - reference_id: PMID:20159461
      supporting_text: An unexpected shift in the helical register of D-AKAP2 compared to the
        RIIalpha:D-AKAP2 complex structure makes the mode of binding to RIalpha novel.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:A4D2P6
  review:
    summary: >-
      GRID2IP (Delphilin), one of 21 PDZ-domain proteins whose affinity for the AKAP10
      C-terminal PDZ-binding motif was measured in a proteome-scale holdup survey. What was
      measured is PDZ-domain binding, and GO can say so.
    action: MODIFY
    reason: >-
      A4D2P6 resolves to GRD2I_HUMAN, reviewed Swiss-Prot, 1211 aa - canonical, not an
      ORFeome fragment. All 25 accessions cited across this gene's GOA WITH/FROM column
      resolve to reviewed Swiss-Prot entries of canonical length (checked with
      entryType.startswith("UniProtKB reviewed"), since "reviewed" is a substring of
      "unreviewed"); none is a partial clone.

      The assay is a purified PDZ domain against the AKAP10 PDZ-binding motif, so the
      AKAP10-side activity is GO:0030165 PDZ domain binding (verified active, no children),
      which is both more informative than GO:0005515 and a more accurate description of the
      experiment than a claim about a cellular AKAP10-GRID2IP complex. IntAct lists this
      partner under holdup assay only, with no orthogonal method, so the partner identity is
      an in vitro affinity rather than a demonstrated cellular interaction; the term change
      captures the measured activity without asserting the complex.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:36115835
      supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ
        domains and their target PDZ-binding motifs (PBM) within a human interactome region
        particularly relevant for viral infection and cancer.
