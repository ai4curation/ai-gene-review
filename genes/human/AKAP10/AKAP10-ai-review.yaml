id: O43572
gene_symbol: AKAP10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AKAP10, also called dual-specific A-kinase anchoring protein 2 (D-AKAP2), is a
  662-residue scaffold protein with no catalytic domain, no nucleotide- or metal-binding
  site and no EC number. Its chain is built from three interaction modules separated by
  disordered linkers: two tandem regulator-of-G-protein-signalling (RGS) domains in the
  N-terminal half (residues 125-369 and 379-505), an amphipathic A-kinase-binding helix
  near the C-terminus (residues 629-653), and a class-I PDZ-binding motif at the extreme
  C-terminus.

  Its defining activity is anchoring cAMP-dependent protein kinase. The C-terminal helix
  docks into the dimerization/docking domain of the protein kinase A regulatory subunit,
  and it does so for both type I and type II regulatory subunits, which is what makes it
  dual-specific; the two complexes differ in the register with which the same helix packs
  against the R-subunit dimer. Only the regulatory subunit has ever been assayed, never
  the catalytic one. Immediately downstream of that helix, the PDZ-binding motif engages
  PDZ-domain scaffolds, PDZK1 most strongly, and the two motifs become ordered only on
  binding, so a single short segment presents an alpha-helix to the kinase and a
  beta-strand to the PDZ domain. Because formation of the kinase complex precedes
  high-affinity PDZ engagement, AKAP10 nucleates a polyvalent assembly that reaches
  membrane transporters indirectly, through the PDZ scaffold, rather than by contacting a
  membrane protein itself.

  The tandem RGS domains do not act as GTPase activators on heterotrimeric G-protein
  alpha subunits: the Galpha transition-state contact residues of a canonical RGS box are
  absent from both domains, and no activation of a heterotrimeric G protein has ever been
  measured. What the two domains do, acting as a single functional unit, is bind the small
  GTPases Rab4 and Rab11 - Rab4 preferentially in its GTP-bound state. Through this
  surface AKAP10 associates with Rab4/Rab11-positive recycling endosomes and retains
  cargo there: depleting it redistributes Rab11 and the transferrin receptor toward the
  cell periphery and accelerates transferrin recycling, so the protein normally slows
  traffic out of the endocytic recycling compartment.

  Where the protein sits is genuinely contested. Endogenous AKAP10 is reported as highly
  enriched in mitochondria in human, mouse and rat tissue, and it appears in
  high-confidence human mitochondrial proteomes; a later study in HeLa cells found the
  endogenous protein almost entirely cytosolic with very little mitochondrial
  colocalisation, and attributed the discrepancy to antibody cross-reactivity or cell
  type. The N-terminal mitochondrial transit peptide that gives the protein its name is a
  sequence-based prediction, and the entry contains no transmembrane segment and no
  lipid-binding domain, so the mechanism of membrane attachment is unresolved. A common
  coding variant, Ile646Val in the A-kinase-binding helix, is carried by roughly 40 percent
  of human alleles and is associated in population data with a higher basal heart rate and
  reduced heart-rate variability; the molecular basis of that association is not known.
