- term:
    id: GO:0051018
    label: protein kinase A binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from IPR037719, the AKAP10 A-kinase-binding domain. The domain binds
      the regulatory subunit specifically, so the mapping can be one level more precise than it
      is.
    action: MODIFY
    reason: >-
      IPR037719 is AKAP10_AKB_dom, the family-specific signature for exactly the segment that
      UniProt annotates as "FT   REGION          634..647" with note PKA-RII subunit binding and
      that PDB 3IM4 resolves as a helix on the RI-alpha dimerization/docking domain. A
      family-specific signature of a characterised binding module is much better founded than a
      bare fold signature, so this row is not in doubt - only its granularity is.

      Every structure and every affinity measurement involving this domain, across AKAP10 and
      the wider AKAP family, is against an R subunit; the AKB helix has no reported affinity for
      the catalytic subunit, and the two PDB chains cross-referenced from this entry are both
      R-subunit complexes. GO:0034237 protein kinase A regulatory subunit binding is an active
      child of GO:0051018 and is what the signature actually predicts. Re-pointing this one
      interpro2go line would fix every AKAP10 orthologue at once, which is the kind of upstream
      fix worth making rather than patching gene by gene.
    proposed_replacement_terms:
    - id: GO:0034237
      label: protein kinase A regulatory subunit binding
    supported_by:
    - reference_id: PMID:25097019
      supporting_text: The regulatory subunits of the four PKA isoforms (RIα, RIβ, RIIα, and
        RIIβ) each form a homodimer, and their dimerization domain interacts with a small helical
        region present in each of the more than 40 AKAPs reported so far.
  supporting_entities:
  - InterPro:IPR037719
- term:
    id: GO:0051018
    label: protein kinase A binding
  evidence_type: IPI
  original_reference_id: PMID:25097019
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10644
  review:
    summary: >-
      Direct affinity measurement against human PKA RI-alpha by fluorescence anisotropy. Real,
      human, and core - but it measured the regulatory subunit, and GO has a child term that
      says so.
    action: MODIFY
    reason: >-
      P10644 resolves to KAP0_HUMAN, reviewed Swiss-Prot, 381 aa - canonical human PRKAR1A, so
      this is a human protein assayed against a human partner and IPI is the correct code. The
      assay is fluorescence anisotropy on the AKAP10 anchoring helix, backed in the same study by
      HADDOCK modelling and cellular colocalisation.

      GO:0051018's own comment notes that it spans binding to either the catalytic or the
      regulatory subunit. Nothing in the AKAP10 literature assays the catalytic subunit, and all
      three structural studies of this protein are R-subunit complexes, so the parent term
      understates what is known. GO:0034237 protein kinase A regulatory subunit binding is exact.
    proposed_replacement_terms:
    - id: GO:0034237
      label: protein kinase A regulatory subunit binding
    supported_by:
    - reference_id: PMID:25097019
      supporting_text: To verify the validity of these newly predicted anchoring sites and their
        putative specificities, we used computational modeling approaches (HADDOCK), biochemical
        affinity studies (fluorescence anisotropy), and cellular colocalization studies.
    - reference_id: PMID:20159461
      supporting_text: Dual-specific AKAP 2 (D-AKAP2) binds to the dimerization/docking (D/D)
        domain of both RI and RII regulatory subunits of PKA with high affinity.
