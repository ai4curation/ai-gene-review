        comment: Internal node of PTHR13155; not resolvable to a gene product.
      - source_id: SGD:S000005827
        source_label: Saccharomyces cerevisiae RAX1 (UniProtKB:Q08760, Swiss-Prot, 435 aa), bud
          site selection protein
        source_status: SUPPORTS_TRANSFER
