- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q5T2W1
  review:
    summary: >-
      PDZK1 (NHERF3) measured by holdup - and, unlike the rest of the panel, a partner with
      independent pull-down, cellular recruitment and crystallographic support. This is the
      biologically real PDZ interaction.
    action: MODIFY
    reason: >-
      Q5T2W1 resolves to NHRF3_HUMAN, reviewed Swiss-Prot, 519 aa - canonical PDZK1. IntAct
      shows holdup only, which understates the case: PDZK1 binds AKAP10 in pull-downs and
      co-immunoprecipitates from transfected kidney cells (PMID:14531807), is recruited onto
      Rab11 endosomes by AKAP10 in HeLa cells and is not recruited by the construct lacking
      the terminal three residues (PMID:19797056), and appears in a ternary crystal
      structure with AKAP10 and PKA-RII in which AKAP10 presents a beta-strand to the PDZ
      domain (PMID:25348485).

      GO:0030165 PDZ domain binding is therefore not a hedge on this row but the mapped
      mechanism, and it is core: this is the second arm of the polyvalent scaffold, the arm
      that reaches membrane transporters. Note that AKAP10 reaches them indirectly -
      PMID:25348485 states that D-AKAP2 does not contact the membrane protein itself.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:14531807
      supporting_text: In pull-down experiments, D-AKAP2 tightly bound PDZK1 as well as N+/H+
        exchanger regulator factor (NHERF-1), but the latter with an apparent fourfold lower
        affinity.
    - reference_id: PMID:25348485
      supporting_text: 'Formation of the D-AKAP2: PKA binary complex is an important first step
        for high affinity interaction with PDZK1, and the structure reveals important clues
        toward understanding this phenomenon.'
    - reference_id: PMID:25348485
      supporting_text: In contrast to many other AKAPs, D-AKAP2 does not interact directly with
        the membrane protein.
