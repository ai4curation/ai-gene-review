    summary: >-
      NHERF2 (SLC9A3R2) measured by holdup. This is the one PDZ partner that a second,
      orthogonal method also reports (see the PMID:40205054 row), so it is the best-supported
      partner in this set after PDZK1.
    action: MODIFY
    reason: >-
      Q15599 resolves to NHRF2_HUMAN, reviewed Swiss-Prot, 337 aa - canonical. IntAct lists
      it under two different methods, holdup assay and anti tag coip, from two different
      publications, which no other member of the holdup panel achieves. GO:0030165 is the
      mechanism, and the AKAP10 C-terminal motif is the surface involved.

      A naming caution recorded here rather than silently resolved: the 2003 paper that first
      linked AKAP10 to NHERF scaffolds tested NHERF-1 (SLC9A3R1, O14745), which is not in
      GOA at all; the annotated partner Q15599 is NHERF2 (SLC9A3R2). They are different
      proteins and are not treated as interchangeable here.
    proposed_replacement_terms:
