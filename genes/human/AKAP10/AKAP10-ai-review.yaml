      individually assayed rather than inheriting one gene's phenotype.
- id: PMID:25348485
  title: 'D-AKAP2:PKA RII:PDZK1 ternary complex structure: insights from the nucleation of a
    polyvalent scaffold.'
  findings:
  - statement: A single C-terminal segment, disordered on its own, presents an alpha-helix to PKA
      and a beta-strand to PDZK1, one stretch of chain performing two different structural roles.
    supporting_text: Here, we describe a structure of D-AKAP2 in complex with two interacting
      partners and the exact mechanism by which a segment that on its own is disordered presents
      an α-helix to PKA and a β-strand to PDZK1.
  - statement: The two arms are ordered, because forming the PKA complex is a prerequisite for
      high-affinity PDZK1 binding, so the scaffold assembles in sequence rather than
      independently.
    supporting_text: 'Formation of the D-AKAP2: PKA binary complex is an important first step for
      high affinity interaction with PDZK1, and the structure reveals important clues toward
      understanding this phenomenon.'
  - statement: Unlike most AKAPs, AKAP10 does not contact the membrane protein itself; it reaches
      transporters through the PDZ scaffold. This is why its membrane annotation should be read
      as indirect.
    supporting_text: In contrast to many other AKAPs, D-AKAP2 does not interact directly with the
      membrane protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only. Produces no GO annotation on this gene despite being a structure of AKAP10
      with two partners simultaneously - part of the coverage defect this review documents.
      Absent from the seeded stub; recovered from the affinage record.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      MitoCoP, built from subcellular fractions of HEK293T, HeLa, Huh7 and U2OS cells by
      subtractive, spatial and import proteomics. Supplies the GO:0005739 HTP row, which matters
      more than its evidence code suggests: it is the only mitochondrial evidence for this gene
      that uses no AKAP10 antibody, and so is not touched by the antibody-specificity objection
      PMID:19797056 raises against PMID:11248059. This reference contributes 1235 annotations
      across GOA; the result set is paginated, so a distinct-entity count was not obtainable and
      is reported as unavailable rather than substituted with the annotation total.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings:
  - statement: A proteome-scale affinity survey of PDZ domains against PDZ-binding motifs. The 21
      AKAP10 rows it contributes are cells of this matrix, measurements of the AKAP10 motif
      binding a PDZ domain, not demonstrations of 21 cellular complexes.
    supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ domains
      and their target PDZ-binding motifs (PBM) within a human interactome region particularly
      relevant for viral infection and cancer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. The largest single contributor to this gene's GOA, supplying 21 of 39
      rows. Carries an Author Correction, PMID:36477203, which states that the original version
      contained errors in Figures 2, 4 and 5 - missing correlation coefficients, absent axis
      labels and panel ordering. It changes no affinity measurement and no PDZ datum, so nothing
      used here is affected; flagged because a correction has to be checked rather than assumed
      cosmetic. IntAct shows every one of these partners under holdup assay only, with 2-9
      replicate rows each, which is why the UniProt NbExp figures for this gene must not be read
      as independent experiments.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Systematic multimodal cell map contributing 3026 annotations across GOA. Its single AKAP10
      row, NHERF2, is valuable out of proportion to its size because IntAct logs it under a
      different method (anti tag coip) from the holdup measurement of the same pair, making
      NHERF2 the only PDZ partner supported by two independent techniques. Carries a Publisher
      Correction, PMID:41039152, which corrects duplicated variable names in an equation in the
      Methods loss-function section and affects no interaction data. Entity counts unavailable
      because the QuickGO result is paginated.
- id: Reactome:R-HSA-992708
  title: Dual-specific AKAPs bind type I and II PKA regulatory subunits
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A binding reaction, not a localisation experiment, so the cytosol GO term derived from it
      reflects the compartment Reactome assigns to the reaction rather than a measurement of
      where AKAP10 is. The identifier is correct and the biology it describes is correct; it is
      the inference from reaction compartment to gene localisation that is weak. The term
      survives on other evidence, which is why the row is accepted rather than demoted.
- id: file:human/AKAP10/AKAP10-deep-research-affinage.md
  title: Affinage mechanistic annotation for AKAP10 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched Affinage record, trust gates reported clear, faith_pct 100, eight
      citations and every one a real numeric PMID (no preprint identifiers in a PMID-shaped
      field). Its recall on this gene was well above the campaign average: it surfaced
      PMID:19797056, PMID:25348485, PMID:12206784, PMID:14531807, PMID:17485678 and
      PMID:11248059, six references absent from GOA and from the seeded stub, including the
      one that supplies all three NEW rows. Recorded because provider recall is only ever
      measured when a reviewer writes it down.

      Two defects found and not imported. It names the PDZ partner as NHERF-1 (SLC9A3R1),
      whereas the annotated partner is NHERF2 (SLC9A3R2) - different proteins. And it
      describes the Rab work without noting that every construct in that study carried the
      646V variant. Per campaign practice no sentence from this record is used as
      supporting_text; each lead was re-verified against the cited PMID or against UniProt
      before use, which is how both defects were found.
- id: file:human/AKAP10/AKAP10-bioinformatics/RESULTS.md
  title: 'AKAP10 RGS domains: are the Galpha GAP contact residues present?'
  findings:
  - statement: Both AKAP10 RGS domains retain 0 of 5 RGS4 Galpha transition-state contact
      residues, scoring like the AXIN1 negative control and unlike the RGS16 and RGS9 positive
      controls, which retain 5 of 5 each.
    supporting_text: '| AKAP10 RGS-A | subject | 30.3% | 0/5 | P315 | no |'
  - statement: The decisive asparagine, RGS4 Asn128, whose N128A substitution abolishes GAP
      activity, is replaced by proline in RGS-A and by glycine in RGS-B.
    supporting_text: '| AKAP10 RGS-B | subject | 24.3% | 0/5 | G452 | no |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible analysis committed alongside this review. Verified that a fresh run reproduces
      the committed RESULTS.md, results.json and stdout byte-for-byte, and that both of the
      script's guards fire when deliberately broken - mutating the RGS4 site table aborts on the
      sequence mismatch, and pointing a positive control at haemoglobin alpha aborts on the
      control check. The RGS-B identity of 24.3% is below the range where a residue call is safe
      on alignment alone, which the report states explicitly; the conclusion therefore rests on
      RGS-A plus the two published statements, with the computation as corroboration.
core_functions:
- description: >-
    Anchors cAMP-dependent protein kinase by binding its regulatory subunit. An amphipathic
    helix at residues 629-653 docks into the dimerization/docking domain of the PKA
    regulatory subunit, and it does so for both type I and type II subunits, which is the
    property the D-AKAP name records. The dual specificity is not a loose one: the same helix
    binds RI-alpha and RII-alpha in different helical registers, and the original description
    found the active fragment bound RI-alpha, RII-alpha and RII-beta but not RI-beta. Only
    the regulatory subunit has ever been assayed, which is why the molecular function is the
    regulatory-subunit child term rather than the parent.

    The consequence, and the reason an AKAP exists, is that the bound kinase is placed
    somewhere. For this protein that is recorded at the level of intracellular protein
    localization and of protein-membrane adaptor activity, transferred from the mouse
    orthologue's own direct evidence for in vivo PKA association.
  molecular_function:
    id: GO:0034237
    label: protein kinase A regulatory subunit binding
  directly_involved_in:
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:20159461
    supporting_text: Dual-specific AKAP 2 (D-AKAP2) binds to the dimerization/docking (D/D)
      domain of both RI and RII regulatory subunits of PKA with high affinity.
  - reference_id: PMID:20159461
    supporting_text: An unexpected shift in the helical register of D-AKAP2 compared to the
      RIIalpha:D-AKAP2 complex structure makes the mode of binding to RIalpha novel.
  - reference_id: PMID:11248059
    supporting_text: In vivo association of D-AKAP2 with PKA in mouse brain was demonstrated by
      using cAMP agarose pull-down assay.
  knowledge_gaps:
  - gap_statement: >-
      How AKAP10 attaches to any membrane is unknown. The protein has no transmembrane segment
      and no lipid-binding domain, and its mitochondrial transit peptide is a sequence-based
      prediction rather than a measured feature.
    boundary: >-
      Firmly established: the anchoring helix and its R-subunit complex are solved at 2.28 A on
      the human sequence, and the protein co-purifies with PKA from brain. Absent: any
      identified membrane receptor, lipid ligand or import experiment that would explain how the
      complex is held at a membrane. PMID:25348485 states that, unlike many AKAPs, this one does
      not contact the membrane protein directly.
    gap_kind:
    - BIOLOGY
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Determines whether the protein-membrane adaptor annotation describes a direct activity of
      AKAP10 or a property of an assembly it joins, and it is the same uncertainty that underlies
      the disputed mitochondrial localisation.
    resolution: >-
      Test whether the predicted transit peptide is cleaved and whether the protein is imported,
      using in organello import into isolated human mitochondria with and without membrane
      potential, and identify the mitochondrial partner by proximity labelling from the
      N-terminal region.
- description: >-
    Binds PDZ-domain scaffolds through a class-I PDZ-binding motif at the extreme C-terminus,
    immediately downstream of the anchoring helix. PDZK1 is the best-supported partner:
    pull-downs, cellular recruitment onto Rab11 endosomes that is abolished by deleting the
    terminal three residues, and a ternary crystal structure in which the same short segment
    presents an alpha-helix to PKA and a beta-strand to the PDZ domain. Because the kinase
    complex must form first for high-affinity PDZ engagement, the two motifs build one ordered
    scaffold rather than two independent interactions, and this is how the anchored kinase
    reaches membrane transporters - indirectly, through the scaffold, since AKAP10 does not
    contact the transporter itself.

    A proteome-scale affinity survey shows the motif binds many PDZ domains in vitro; that
    breadth is a property of the motif and should not be read as 21 cellular complexes. The
    molecular function recorded here is the measured one.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:25348485
    supporting_text: Here, we describe a structure of D-AKAP2 in complex with two interacting
      partners and the exact mechanism by which a segment that on its own is disordered presents
      an α-helix to PKA and a β-strand to PDZK1.
  - reference_id: PMID:25348485
    supporting_text: 'Formation of the D-AKAP2: PKA binary complex is an important first step for
      high affinity interaction with PDZK1, and the structure reveals important clues toward
      understanding this phenomenon.'
  - reference_id: PMID:14531807
    supporting_text: In pull-down experiments, D-AKAP2 tightly bound PDZK1 as well as N+/H+
      exchanger regulator factor (NHERF-1), but the latter with an apparent fourfold lower
      affinity.
- description: >-
    Binds the small GTPases Rab4 and Rab11 through its two RGS domains acting as a single unit,
    and restrains traffic out of the endocytic recycling compartment. Residues 120-513, spanning
    both domains, are necessary and sufficient; neither domain alone binds either Rab. Binding
    to Rab4 is nucleotide-state dependent, favouring the GTP-loaded form. A minority pool of the
    protein sits on Rab4/Rab11-positive recycling endosomes, and removing the protein from human
    cells makes transferrin recycle 73 percent faster while pushing Rab11 and the transferrin
    receptor toward the cell periphery, so the wild-type protein slows, rather than promotes,
    return of cargo to the surface.

    This entire arm of the protein's biology is absent from GO: QuickGO returns no annotation at
    all for the reference that established it, on any gene in any species. Note also what the RGS
    domains do not do - the Galpha transition-state contact residues are absent from both, and
    no activation of a heterotrimeric G protein has ever been measured, so no GTPase-activator
    function is claimed here.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
  - id: GO:2001136
    label: negative regulation of endocytic recycling
  locations:
  - id: GO:0055037
    label: recycling endosome
  supported_by:
  - reference_id: PMID:19797056
    supporting_text: We show here that these RGS domains interact with Rab11 and GTP-bound Rab4,
      the first demonstration of RGS domains binding small GTPases.
  - reference_id: PMID:19797056
    supporting_text: Neither RGS-A (residues 120–369) nor RGS-B (residues 374–513) alone was able
      to interact with Rab4 or Rab11, suggesting that the two RGS domains form a single functional
      unit.
  - reference_id: PMID:19797056
    supporting_text: Fitting all of the data to an exponential decay function yielded a rate of
      transferrin recycling that was 73 ± 21% faster in the D-AKAP2 knockdown cells than in
      control cells
  - reference_id: PMID:19797056
    supporting_text: D-AKAP2 has so far demonstrated no specific interactions with heterotrimeric
      G proteins, and no ability to activate them, raising the possibility of nontraditional
      targets.
  knowledge_gaps:
  - gap_statement: >-
      Whether the PKA-anchoring arm and the Rab-binding arm are ever used together is untested.
      The two activities sit at opposite ends of the protein and were characterised in separate
      studies, and no experiment has asked whether anchored PKA phosphorylates anything on the
      recycling endosome.
    boundary: >-
      Firmly established: the R-subunit helix and the tandem-RGS Rab surface are separately mapped
      to residue ranges, and each has its own functional readout. Absent: any test of whether a
      construct that cannot bind PKA still regulates transferrin recycling, or whether PKA
      activity is required for the recycling phenotype.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Decides whether AKAP10 is one scaffold coupling cAMP signalling to endocytic recycling, or
      two unrelated modules that happen to share a polypeptide. The answer determines whether the
      anchoring and recycling annotations belong in one GO-CAM activity or two.
    resolution: >-
      Repeat the transferrin recycling assay in cells rescued with an anchoring-deficient mutant
      of the 629-653 helix, and in parallel with PKA inhibition, and ask whether either abolishes
      the wild-type restraint on recycling rate.
suggested_questions:
- question: >-
    Should the InterPro2GO line for IPR037719 be re-pointed from GO:0051018 protein kinase A
    binding to GO:0034237 protein kinase A regulatory subunit binding? IPR037719 is the
    family-specific signature for the AKAP10 A-kinase-binding domain, which UniProt annotates as
    PKA-RII subunit binding and which both cross-referenced PDB entries resolve bound to an R
    subunit. No experiment on AKAP10, or on the AKB helix of any AKAP, assays the catalytic
    subunit. Fixing the mapping once would correct every AKAP10 orthologue rather than one gene.
  experts:
  - InterPro curator
  - GO molecular function editor
- question: >-
    PAINT node PTN001775426 in PTHR13155 asserts GO:0005739 mitochondrion with is_active_in from
    a single mouse seed (MGI:MGI:1890218), and the node spans all six reviewed members of the
    family. Three of those six are not AKAPs: Saccharomyces cerevisiae RAX1 (Q08760),
    Schizosaccharomyces pombe rax1 (Q9P7S8) and Caenorhabditis elegans rgs-5 (Q10955). RAX1's own
    experimental localisations are cellular bud neck, cellular bud scar, plasma membrane,
    cellular bud tip and fungal-type vacuole; pombe rax1's only experimental CC is endoplasmic
    reticulum. Should the mitochondrion assertion move to a node whose reach is the mammalian
    AKAP10 orthologues, leaving GO:0008104 - which both the mouse and the yeast donors
    independently support - at the family node? The GO:0043495 assertion has the same scope
    question. Affected genes named in full so the fix can be made once.
  experts:
  - PAINT curator
  - GO_Central
- question: >-
    GO cannot express what an AKAP does. GO:0051018 and GO:0034237 say only that the protein
    binds the kinase, and GO:0043495 requires a membrane, which excludes the AKAPs that anchor to
    the cytoskeleton or centrosome. Searching GO for AKAP and for "A-kinase anchoring protein
    complex" returns nothing, and GO:0005952 cAMP-dependent protein kinase complex is defined
    strictly as the regulatory-plus-catalytic holoenzyme, so the AKAP-anchored assembly this gene
    demonstrably forms can only be annotated to GO:0032991, the root. Ontology search is
    token-based so a null query is not proof of absence, hence a question rather than a proposed
    term. Would GO consider either a kinase-anchoring molecular function or a complex term for
    the AKAP-PKA assembly? More than forty human AKAPs would use it.
  experts:
  - GO ontology editor
- question: >-
    Is human AKAP10 mitochondrial? The gene's UniProt name says so, on the strength of
    immunocytochemistry and fractionation of endogenous protein from three species
    (PMID:11248059), and the protein is in the MitoCoP high-confidence mitochondrial proteome.
    But the same laboratory later found endogenous protein almost entirely cytosolic in HeLa with
    very little mitochondrial colocalisation, and attributed the earlier result to antibody
    cross-reactivity or cell type (PMID:19797056). The transit peptide is predicted, not measured,
    and there is no transmembrane segment. Both localisations are annotated here; a curator with
    access to current reagents could settle which pool dominates in which cell type.
  experts:
  - mitochondrial cell biologist
  - GOA curator
- question: >-
    Why has no annotation anywhere in GOA been made from PMID:19797056? QuickGO returns zero
    results for that reference across all species and all genes, yet it reports the first
    demonstration of RGS domains binding small GTPases, maps the binding surface, and quantifies a
    recycling phenotype by siRNA in human cells. Three NEW rows are proposed here from it; the
    partner genes RAB4A, RAB11A and TFRC would also gain from it.
  experts:
  - GOA curator
- question: >-
    Should the association between the common AKAP10 I646V variant and heart-rate phenotypes be
    represented anywhere in GO? It is deliberately not annotated here: the perturbation experiments
    are in mouse, the mouse allele is dominant-interfering rather than a clean null, and the human
    evidence is a population association, so it describes neither a molecular function nor a
    process of the wild-type protein. Confirmation that this is the right call, and a pointer to
    where such an association should live instead, would be useful.
  experts:
  - GOA curator
  - cardiovascular geneticist
suggested_experiments:
- hypothesis: >-
    The PKA-anchoring arm and the Rab-binding arm of AKAP10 are one coupled mechanism rather than
    two independent modules sharing a polypeptide.
  experiment_type: rescue with separation-of-function mutants plus flow-cytometry recycling assay
  description: >-
    Reconstitute AKAP10-knockdown HeLa cells with wild-type protein, with an anchoring-dead mutant
    of the 629-653 helix, and with the PDZ-motif deletion construct, then measure transferrin
    recycling rate by the published flow-cytometry pulse-chase. If only the wild type restores the
    restraint on recycling, the anchored kinase is part of the recycling mechanism; if the
    anchoring-dead mutant rescues fully, the RGS and AKB arms are independent modules.
- hypothesis: >-
    The disagreement between the mitochondrial and cytosolic localisation reports is an
    antibody-specificity artefact rather than a genuine difference in the protein's distribution.
  experiment_type: endogenous fluorescent knock-in imaging plus compartment-specific proximity
    labelling
  description: >-
    Knock a fluorescent tag into the endogenous AKAP10 locus in a cell line where the mitochondrial
    claim was originally made and in HeLa, then quantify the mitochondrial and cytosolic pools by
    live imaging and by proximity labelling from a matrix-targeted and an outer-membrane-targeted
    bait. This removes the antibody-specificity variable that the two conflicting studies disagree
    about.
- hypothesis: >-
    The predicted N-terminal transit peptide is not a functional matrix-targeting sequence, since
    a protein that anchors cytosolic PKA cannot be imported into the matrix.
  experiment_type: in organello mitochondrial import assay
  description: >-
    Perform in organello import of radiolabelled full-length AKAP10 into isolated human
    mitochondria with and without membrane potential, with and without protease treatment, and
    determine by N-terminal sequencing whether residues 1-28 are cleaved. This distinguishes a
    genuine targeting sequence from a prediction artefact and would explain the topology.
- hypothesis: >-
    Neither AKAP10 RGS domain accelerates GTP hydrolysis by any heterotrimeric G-protein alpha
    subunit, as the absence of the Galpha transition-state contact residues predicts.
  experiment_type: single-turnover GTP hydrolysis assay against a Galpha panel
  description: >-
    Assay purified AKAP10 RGS-A, RGS-B and the tandem construct for single-turnover GTP hydrolysis
    acceleration against a panel of Galpha subunits spanning the i, q, s and 12/13 families, with
    RGS4 as the positive control. A clean negative across the panel would convert a well-supported
    inference into a citable measurement and justify a NOT annotation.
- hypothesis: >-
    The tandem RGS module engages Rab4 through the switch regions, i.e. the same face an RGS box
    uses on Galpha has been repurposed for a small GTPase.
  experiment_type: structure determination plus switch-region mutagenesis
  description: >-
    Solve or predict-and-validate the complex between AKAP10 residues 120-513 and GTP-loaded Rab4,
    then test switch-region mutants of Rab4 for loss of binding. Because this is the only reported
    case of RGS domains binding small GTPases, the structural basis would say whether the
    Galpha-binding surface has been repurposed or a different face of the fold is used.
