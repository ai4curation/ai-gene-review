- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IPI
  original_reference_id: PMID:19797056
  qualifier: enables
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P61006
      label: RAB4A
  - predicate: RO:0002233
    term:
      id: UniProtKB:P62491
      label: RAB11A
  review:
    summary: >-
      Proposed. AKAP10's tandem RGS domains bind Rab11 and GTP-loaded Rab4, acting as a single
      functional unit. This was the first report of RGS domains binding small GTPases, and GO
      records nothing about it on any gene.
    action: NEW
    reason: >-
      The experiments are on the human protein in human cells, which the paper states
      explicitly - all D-AKAP2 constructs used the human gene - so IPI rather than ISS is the
      correct code for the AKAP10 side. Four independent assays: co-immunoprecipitation from
      HEK293 cells, which pulls down Rab4 and Rab11 but not Rab5; a GST-Rab4 pull-down showing
      the interaction is nucleotide-state dependent, with GTP-gamma-S-loaded Rab4 far more
      effective than GDP-loaded Rab4 or GST alone; split-ubiquitin yeast two-hybrid with the
      isolated tandem domains; and colocalisation of the endogenous protein with Rab4 and Rab11
      on endosomes.

      The binding surface is mapped and the mapping is informative. Residues 120-513, spanning
      both RGS domains, are necessary and sufficient, while neither RGS-A nor RGS-B alone binds
      either Rab. So the two divergent RGS domains that are not Galpha GAPs have a joint
      function as a small-GTPase-binding module.

      Term choice checked rather than assumed. GO:0017137 Rab GTPase binding has been merged
      into GO:0031267, which QuickGO confirms by listing GO:0017137 among its secondaryIds, and
      GO:0031267 has no children. It is therefore already maximal and no substrate-specific
      child should be proposed; the identity of the Rabs is recorded machine-readably with
      has_input extensions instead.

      One honesty note on partner species. The tagged Rab constructs are described as canine
      Rab4b and the Rab11a construct's origin is not stated, so the extensions name the human
      orthologues as the biologically intended inputs rather than claiming a human-human
      interaction was measured in every assay. The endogenous colocalisation in Fig. 3C-E is
      with Rab proteins in human HeLa cells.
    supported_by:
    - reference_id: PMID:19797056
      supporting_text: We show here that these RGS domains interact with Rab11 and GTP-bound
        Rab4, the first demonstration of RGS domains binding small GTPases.
    - reference_id: PMID:19797056
      supporting_text: D-AKAP2 specifically co-immunoprecipitated GFP-tagged Rab4 and Rab11 but
        not Rab5.
    - reference_id: PMID:19797056
      supporting_text: Furthermore, purified GST-tagged Rab4 bound to the nonhydrolyzable
        nucleotide analog GTPγS was much more able to pull down D-AKAP2 from a HEK293 lysate
        than GDP-bound GST-Rab4 or GST alone
    - reference_id: PMID:19797056
      supporting_text: Neither RGS-A (residues 120–369) nor RGS-B (residues 374–513) alone was
        able to interact with Rab4 or Rab11, suggesting that the two RGS domains form a single
        functional unit.
    - reference_id: PMID:19797056
      supporting_text: All D-AKAP2 constructs used the human gene with valine at position 646.
- term:
    id: GO:2001136
    label: negative regulation of endocytic recycling
  evidence_type: IMP
  original_reference_id: PMID:19797056
  qualifier: involved_in
  review:
    summary: >-
      Proposed. Depleting AKAP10 from human cells makes transferrin recycle 73 percent faster
      and pushes Rab11 and the transferrin receptor to the cell periphery, so the wild-type
      protein slows traffic out of the recycling compartment.
    action: NEW
    reason: >-
      Human siRNA in HeLa cells knocking down the endogenous human protein, so IMP is the
      correct code and the species is unambiguous. The readout is quantitative. After a 20 min
      pulse the knockdown cells retain 33.3 percent more transferrin (p = 0.0022) and after a
      30 min chase 31.0 percent less (p = 0.023), and fitting the whole series gives a recycling
      rate 73 percent faster than control. Morphologically, Rab11 and the endogenous transferrin
      receptor both redistribute toward the periphery while EEA1-marked early endosomes are
      unchanged, so the effect is specific to the recycling compartment.

      Direction checked explicitly, because this is exactly where a regulation term can be
      inverted. Loss of the protein accelerates recycling, therefore the protein normally
      restrains it, therefore the negative-regulation term. GO:2001136 is active and its
      definition - any process that stops, prevents or reduces the frequency, rate or extent of
      endocytic recycling - matches. The positive-regulation sibling GO:2001137 would assert the
      opposite of the data.
    supported_by:
    - reference_id: PMID:19797056
      supporting_text: Treating HeLa cells for 2 days with siRNA directed against D-AKAP2
        effectively knocked down nearly all of the endogenous protein
    - reference_id: PMID:19797056
      supporting_text: Fitting all of the data to an exponential decay function yielded a rate of
        transferrin recycling that was 73 ± 21% faster in the D-AKAP2 knockdown cells than in
        control cells
    - reference_id: PMID:19797056
      supporting_text: These results suggest that endogenous D-AKAP2 may promote the accumulation
        of transferrin in the slow recycling pathway of the Rab4/Rab11-containing ERC.
- term:
    id: GO:0055037
    label: recycling endosome
  evidence_type: IDA
  original_reference_id: PMID:19797056
  qualifier: located_in
  review:
    summary: >-
      Proposed. A pool of AKAP10 sits on Rab4/Rab11-positive recycling endosomes. The bulk of
      the protein is cytosolic, so this is a minor but functionally decisive pool - it is where
      the Rab binding and the recycling phenotype happen.
    action: NEW
    reason: >-
      Recorded as IDA on the strength of the endogenous-protein experiment. Endogenous AKAP10,
      visualised with a monoclonal antibody, colocalises with Rab4 and Rab11 on endosomes and
      prefers endosomes positive for both. Supporting images with tagged protein show
      colocalisation with pulse-chased fluorescent transferrin and with the endogenous
      transferrin receptor.

      The caveat is stated rather than buried. The endosomal pool is a minority against a
      dominantly cytosolic background, and co-expression of Rab4 or Rab11 increases it, so the
      clearest images involve overexpressed Rab. That is why the row is GO:0055037 located_in
      rather than a stronger is_active_in claim, and it is consistent with, not contradicted by,
      the cytosol IDA row.
    supported_by:
    - reference_id: PMID:19797056
      supporting_text: Endogenous D-AKAP2 also clearly colocalized with GFP-Rab4 and mCh-Rab11 on
        endosomes, with an apparent preference for endosomes positive for both Rab proteins
    - reference_id: PMID:19797056
      supporting_text: D-AKAP2 in these puncta colocalized significantly with internalized
        fluorescently labeled transferrin, a marker of the endocytic recycling pathway
