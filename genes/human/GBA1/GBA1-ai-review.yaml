id: P04062
gene_symbol: GBA1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GBA1 encodes acid glucosylceramidase, a lysosomal glycosidase that hydrolyzes glucosylceramide to ceramide and glucose. Saposin C and the lipid membrane environment facilitate substrate access and enzyme association with the lumenal membrane surface. LIMP-2/SCARB2 binds GBA1 and delivers it through the secretory pathway to lysosomes. This chemistry supports glycosphingolipid turnover and ceramide production, including lipid processing needed for the epidermal permeability barrier. GBA1 also hydrolyzes other glycosides and can transfer glucose from glucosylceramide to cholesterol under suitable substrate conditions. Loss of function causes Gaucher disease and perturbs lysosomal lipid homeostasis; GBA1 variants also increase susceptibility to Parkinson disease. The long and short initiation products can both generate active lysosomal enzyme.
core_functions:
- description: Hydrolyzes glucosylceramide to ceramide and glucose in the lysosomal lumen at lipid surfaces, with saposin C facilitating membrane association and substrate presentation. This directly consumes glucosylceramide and forms ceramide; subsequent salvage-pathway reacylation is performed by ceramide synthases.
  molecular_function:
    id: GO:0004348
    label: glucosylceramidase activity
  directly_involved_in:
  - id: GO:0006680
    label: glucosylceramide catabolic process
  - id: GO:0046513
    label: ceramide biosynthetic process
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:9201993
    supporting_text: "The degradation of glucosylceramide in lysosomes is accomplished by \nglucosylceramidase"
  - reference_id: PMID:19279011
  - reference_id: Reactome:R-HSA-1605591
alternative_products:
- id: P04062-1
  name: Long
  sequence_note: Displayed 536-residue product; direct FASTA equals the official sequence.
  description: Upstream initiation product. PMID:3687939 reports that either initiation codon can independently yield active enzyme predominantly localized to lysosomes in cultured fibroblasts; this does not establish every later construct as this exact accession.
- id: P04062-2
  name: Short
  sequence_note: 516 residues, exactly the displayed sequence without residues 1–20 (VSP_018800).
  description: Alternative downstream initiation product with a shorter signal-peptide precursor. The early initiation comparison supports activity and lysosomal delivery, not a generally inactive truncated protein.
- id: P04062-3
  name: '3'
  sequence_note: 263 residues; VSP_025216/025217/025218 reconstruction equals its direct official FASTA.
  description: Functional and genomic provenance remain unresolved. The cited PMID:8294033 abstract and ENA D13287 describe a pseudogene transcript; its 263-residue BAA02546.1 product differs at nine positions from the current UniProt product. Retain the declared product without asserting equivalence, deleting it, or calling it a proven GBA1 enzyme.
- id: P04062-4
  name: '4'
  sequence_note: 449 residues, exactly the displayed sequence without residues 1–87 (VSP_054655).
  description: A declared shortened product with verified sequence identity. Localization, catalytic competence and endogenous abundance have not been established by the selected source evidence; no automatic loss-of-function assertion is made from its architecture.
- id: P04062-5
  name: '5'
  sequence_note: 487 residues, exactly the displayed sequence without residues 103–151 (VSP_054656).
  description: A declared internally deleted product with verified sequence identity. Product-specific activity and localization remain unverified; generic GBA1 assays are not assigned exclusively to this form.
suggested_questions:
- question: How does the genomic and transcript provenance of P04062-3 relate to the pseudogene cDNA in PMID:8294033, given the nine sequence differences from ENA BAA02546.1?
- question: Which endogenous products account for GBA1 activity in each tissue, and are the declared products 4 and 5 translated, delivered to lysosomes and catalytically active?
- question: Under which physiological substrate and compartment conditions does GBA1 cause net sterol-glycoside synthesis rather than hydrolysis, and how should that chemistry be placed under GO:0009247 given its narrow definition and broader typed children?
- question: Which lipid-dependent step connects GBA1 loss to altered autophagic flux and lysosome reformation, and can it be separated from downstream signaling and organelle dysfunction?
- question: Does changing GBA1 in isogenic dopamine neurons alter firing relative to wild-type controls, independently of twin-specific modifiers and alpha-synuclein or dopamine rescue endpoints?
- question: Under which physiological conditions does GBA1-dependent transfer from galactosylceramide to cholesterol contribute to galactosylcholesterol turnover, separately from GALC and GBA2 and from glucosylcholesterol metabolism?
suggested_experiments:
- description: Use matched isogenic GBA1 genotypes and product-resolved rescue in differentiated dopamine neurons, measuring multielectrode-array activity together with enzyme activity, lipid substrates and alpha-synuclein turnover. Separate electrical rescue from protein-abundance or dopamine rescue.
- description: Compare the five sequence-verified products for endogenous translation, glycan processing, lysosomal delivery and natural lipid-substrate turnover, while independently establishing genomic origin for the disputed short-product transcript.
- description: Measure compartment-resolved glucosylcholesterol flux in matched GBA1 backgrounds while controlling glucosylceramide and cholesterol loading, then test whether selective changes in glucosylcholesterol turnover alter cellular disease phenotypes.
