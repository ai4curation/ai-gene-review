knowledge_gaps:
- gap_statement: Which changes in GBA1-dependent glucosylcholesterol turnover causally contribute to Gaucher phenotypes, separately from glucosylceramide accumulation?
  boundary: Bidirectional GBA1 chemistry and substrate-dependent shifts are established. The original study supports net degradation under baseline conditions and formation with lysosomal cholesterol loading, while leaving disease consequences of altered glucosylcholesterol unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Lipid abundance changes do not establish which metabolite changes cause a cellular or disease phenotype.
  resolution: Perturb glucosylcholesterol turnover while controlling glucosylceramide burden in matched GBA1 backgrounds, and measure both compartmental lipid flux and disease-relevant cellular outcomes.
  provenance:
  - reference_id: PMID:26724485
    supporting_text: Future research will need to reveal whether such abnormalities in GlcChol or in other glucosylated metabolites contribute to particular symptoms associated with GD.
    reference_section_type: DISCUSSION
