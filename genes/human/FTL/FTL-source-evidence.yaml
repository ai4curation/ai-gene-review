- id: Reactome:R-HSA-6798695
  title: Neutrophil degranulation
  source:
    path: reactome/R-HSA-6798695.md
    mode: '100644'
    blob: bbbffc2e5f50dce2bb81d6b68eadec6a5eed0cd1
    bytes: 3582
    sha256: a10dcaf000179b151be64d8d177ace7b2db335ddd4fe432c491fab1d0fc7c594
  cache_metadata:
    stable_id: R-HSA-6798695
    display_name: Neutrophil degranulation
    species: Homo sapiens
    summary: Neutrophils are the most abundant leukocytes (white blood cells), indispensable in defending
      the body against invading microorganisms. In response to infection, neutrophils leave the circulation
      and migrate towards the inflammatory focus. They contain several subsets of granules that are mobilized
      to fuse with the cell membrane or phagosomal membrane, resulting in the exocytosis or exposure of
      membrane proteins. Traditionally, neutrophil granule constituents are described as antimicrobial
      or proteolytic, but granules also introduce membrane proteins to the cell surface, changing how
      the neutrophil responds to its environment (Borregaard et al. 2007). Primed neutrophils actively
      secrete cytokines and other inflammatory mediators and can present antigens via MHC II, stimulating
      T-cells (Wright et al. 2010).<br><br>Granules form during neutrophil differentiation. Granule subtypes
      can be distinguished by their content but overlap in structure and composition. The differences
      are believed to be a consequence of changing protein expression and differential timing of granule
      formation during the terminal processes of neutrophil differentiation, rather than sorting (Le Cabec
      et al. 1996). <br> <br>The classical granule subsets are Azurophil or primary granules (AG), secondary
      granules (SG) and gelatinase granules (GG). Neutrophils also contain exocytosable storage cell organelles,
      storage vesicles (SV), formed by endocytosis they contain many cell-surface markers and extracellular,
      plasma proteins (Borregaard et al. 1992). Ficolin-1-rich granules (FG) are like GGs highly exocytosable
      but gelatinase-poor (Rorvig et al. 2009).
  limit: Genuine repository Reactome cache; pathway-level context is not a new target-specific assay.
- id: Reactome:R-HSA-6798751
  title: Exocytosis of azurophil granule lumen proteins
  source:
    path: reactome/R-HSA-6798751.md
    mode: '100644'
    blob: 6ecae096c2a185c4169dbe3fb6632ce9d8d052d4
    bytes: 2114
    sha256: 637819305b216f6622eaf649ac01a746b1c69bcd664f7bca79e50db68adcc1e7
  cache_metadata:
    stable_id: R-HSA-6798751
    display_name: Exocytosis of azurophil granule lumen proteins
    species: Homo sapiens
    summary: 'Azurophil or primary granules were originally defined by their high content of myeloperoxidase
      (MPO) and their affinity for the basic dye azure A (Spicer & Hardin 1969). Azurophil granules are
      generally described as spherical. Like lysosomes, they contain CD63 in their membrane (Cham et al.
      1994) but are regarded as specialized secretory granules rather than lysosomes (Cieutat et al. 1998).
      Azurophil granules undergo limited exocytosis in response to stimulation (Sengelov et al. 1993,
      Faurschou  et al. 2002), their primary role is believed to be killing and degradation of engulfed
      microbes in the phagolysosome (Joiner et al. 1989).


      MPO reacts with H2O2 formed by NADPH oxidase, increasing its toxicity by formation of hypochlorous
      acid and other chlorination products, tyrosine radicals and reactive nitrogen intermediates which
      attack the surface of microbes (Klebanoff et al. 2013).

      '
  limit: Genuine repository Reactome cache; pathway-level context is not a new target-specific assay.
- id: Reactome:R-HSA-917937
  title: Iron uptake and transport
  source:
    path: reactome/R-HSA-917937.md
    mode: '100644'
    blob: e0edfe78d0c63d38dec55edfd483dd35b414d1fa
