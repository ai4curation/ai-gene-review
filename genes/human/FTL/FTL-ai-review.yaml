id: P02792
gene_symbol: FTL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FTL is the light-chain subunit of ferritin, a predominantly cytosolic protein shell that
  stores iron as a mineral and buffers its availability. L chains associate with one another and with
  FTH1 subunits; their acidic cavity-facing surfaces and effects on shell properties support iron incorporation,
  mineralization and release. The proportions of L and H subunits influence iron storage and the labile
  intracellular iron pool. The rapid ferroxidase centers characteristic of FTH1 are distinct from this
  L-chain contribution. Ferritin containing FTL can enter autophagic cargo compartments during iron mobilization
  and can also occur in extracellular and secretory contexts. Pathogenic FTL coding or regulatory variants
  can disturb ferritin abundance, shell behavior and iron homeostasis.
