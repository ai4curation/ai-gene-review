- id: file:human/FTL/FTL-source-evidence.yaml
  title: FTL original annotation contexts, source scopes and genuine mapping
core_functions:
- description: Binding and accommodation of ferric iron during ferritin mineralization and storage help
    maintain intracellular iron availability. Human L-chain homopolymer and H/L heteropolymer experiments
    establish iron incorporation and shell effects, while human L-chain deficiency and wild-type rescue
    demonstrate composition-dependent regulation of the labile iron pool. Ferrous binding is also retained
    as a grounded incoming annotation. These roles do not assign FTH1-like catalytic oxidation to the
    L chain.
  molecular_function:
    id: GO:0008199
    label: ferric iron binding
  directly_involved_in:
  - id: GO:0006879
    label: intracellular iron ion homeostasis
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0070288
    label: ferritin complex
  supported_by:
  - reference_id: PMID:19923220
  - reference_id: PMID:20159981
  - reference_id: PMID:23940258
- description: Identical L-subunit association contributes to assembly of the ferritin shell that contains
    and regulates the iron mineral. Recombinant human L-chain shells and positive wild-type self-association
    support this structural role, alongside association with H subunits in mixed ferritins. Pathogenic
    interaction or truncation constructs inform shell disruption but are not natural alternative products
    or evidence that all wild-type ferritin shells have one fixed H:L ratio.
  molecular_function:
    id: GO:0042802
    label: identical protein binding
  directly_involved_in:
  - id: GO:0006879
    label: intracellular iron ion homeostasis
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0070288
    label: ferritin complex
  supported_by:
  - reference_id: PMID:16790936
  - reference_id: PMID:19923220
  - reference_id: PMID:20159981
  - reference_id: PMID:23940258
  - reference_id: PMID:25910212
suggested_experiments:
- description: Compare sequence-verified H/L assemblies at controlled subunit ratios using separate measurements
    of Fe(II) oxidation, mineral nucleation, release and labile cellular iron, with H-chain active-site
    controls.
- description: Test ferritinophagy after equalizing cargo abundance and shell composition, separately
    measuring NCOA4 contact, sequestration and lysosomal delivery; distinguish a cargo requirement from
    a step performed by FTL.
- description: Validate endogenous FTL in the specific membrane preparation and in erythroid differentiation
    using target-specific detection, perturbation and rescue with iron-supply controls.
suggested_questions:
- question: How do endogenous H:L subunit ratios couple mineral nucleation, shell permeability and release
    to the labile iron pool in different human cell types? L-chain deficiency can increase sequestration
    in H homopolymers; storage amount and availability need not change in the same direction.
- question: Does FTL contribute a specific mechanistic step to ferritinophagy beyond determining the composition
    and properties of the cargo shell? Cargo knockout/rescue and receptor-associated turnover do not by
    themselves distinguish cargo configuration from execution of autophagy; productive NCOA4 contact has
    been resolved for FTH1.
- question: Which endogenous FTL-associated membrane and erythroid differentiation contexts are supported
    by target-specific experiments? The membrane proteomics target row remains unverified, and the inspected
    erythropoiesis study perturbs mouse NCOA4 rather than isolating FTL function.
