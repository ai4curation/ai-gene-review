id: Q9H6X2
gene_symbol: ANTXR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANTXR1 (TEM8) is a cell-surface receptor whose transmembrane forms couple extracellular attachment
  to the actin cytoskeleton. Its extracellular von Willebrand factor A domain supports ligand recognition,
  while the cytoplasmic tail binds actin and contributes to adhesion-dependent cell spreading and organization
  of membrane protrusions. Direct collagen-I recognition and receptor-dependent collagen uptake support
  a role in extracellular-matrix handling; collagen-VI recognition remains experimentally contested. In
  specific cellular settings ANTXR1 binds urokinase plasminogen activator and promotes EGFR signaling.
  It also binds anthrax protective antigen. Biallelic loss of ANTXR1 causes GAPO syndrome.
