- id: PMID:36185380
  title: Lack of evidence for a role of anthrax toxin receptors as surface receptors for collagen VI and
    for its cleaved-off C5 domain/endotrophin.
  full_text_unavailable: false
  findings:
  - statement: Murine ANTXR1/2 constructs did not increase binding of assembled collagen VI under the
      tested conditions; NG2 served as a positive cell-binding control.
    supporting_text: overexpression of the two anthrax toxin receptors did not increase the interaction
      of collagen VI with the cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual abstract, Results through direct SPR/full-length receptor/collagenVI and NG2-control
      experiments with Figures1–3 legends, complete plasmid/recombinant-protein, SPR and ligand-binding
      Methods read. Receptor VWA/full-length constructs murine; both human and murine C5 ligands, with
      humanC5 in Figure2B, murineC5 SPR/2D. No interaction detected; collagenVI native conditioned-medium
      assays have positive NG2 controls. No wholesale supplement read.
- id: PMID:36400786
  title: Cancer cell survival depends on collagen uptake into tumor-associated stroma.
  full_text_unavailable: false
  findings:
  - statement: TEM8 fusion binding and MIDAS controls support collagen-I recognition, with an explicitly
      human receptor mutant series.
    supporting_text: WT TEM8-AP, but not TEM8-D150A-AP or AP alone, robustly bound PA and collagen I
  - statement: The tested TEM8 preparations also bound collagen VI in the reported ECM assay.
    supporting_text: Notably, TEM8 bound col1 and collagen VI, but not laminin or collagen IV
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:36185380
      review_notes: This contemporaneous study reports negative collagen-VI binding with murine receptors
        and conditioned-medium collagen; species, receptor constructs and ligand preparations differ.
        Its publication predates this paper, so the link records conflicting evidence, not chronological
        replacement or a universal refutation of human collagen-I binding.
      supported_by:
      - reference_id: PMID:36185380
        supporting_text: overexpression of the two anthrax toxin receptors did not increase the interaction
          of collagen VI with the cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual abstract, collagen binding/uptake and mutant Results with Figures3/4 legends;
      vector/cell, AP purification, AP and CHO ECM ELISA, FITC internalization Methods read. hTEM8 AF279145.2
      is explicit for mutant series; purification covers mouse or human AP fusions, so species should
      not be asserted for every unlabelled Figure3 collagenVI panel. Human mutant series supports collagenI.
      Rat-tail collagenI preparation distinct from commercial ECM/conditioned-medium assays. No full tumor
      metabolism or supplement-wide read.
