  review:
    summary: Protective-antigen binding is a real pathogen interaction outside the physiological core.
    action: KEEP_AS_NON_CORE
    reason: The original primary paper tests protective-antigen attachment and entry through TEM8. This
      is a supported pathogen-ligand interaction. PA is the receptor-binding component of the toxin complex;
      the toxic-substance-binding refinement is not inferred solely from the name of that complex. The
      generic interaction is retained as non-core because the evidence does not establish an incorrect
