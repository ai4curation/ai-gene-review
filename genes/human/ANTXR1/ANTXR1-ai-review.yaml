- term:
    id: GO:0005518
    label: collagen binding
  evidence_type: IDA
  original_reference_id: PMID:16762926
  qualifier: enables
  review:
    summary: Collagen binding is supported, with collagen-VI specificity unresolved.
    action: ACCEPT
    reason: The original 2006 evidence is cell attachment/spreading, with direct collagen binding left
      open. Later PMID:36400786 supplies purified fusion binding with MIDAS controls and an explicitly
      human TEM8 mutant series supporting collagen I. Its purification Methods cover mouse or human AP
      fusions, so species is not assigned to every unlabelled collagen-VI panel. PMID:36185380 reports
      contrary collagen-VI/C5 results using murine receptors, both human and murine C5 ligands, and distinct
      collagen preparations. Broad collagen binding remains supported through collagen I; collagen-VI
      specificity remains contested. The later binding experiments are not attributed to the original
      attachment study.
    supported_by:
    - reference_id: PMID:16762926
      supporting_text: 'the extracellular and transmembrane domains of TEM8 were

        sufficient to provide cell attachment, the intracellular domain was critical for

        spreading.'
    - reference_id: file:human/ANTXR1/ANTXR1-notes.md
    - reference_id: PMID:36400786
      supporting_text: WT TEM8-AP, but not TEM8-D150A-AP or AP alone, robustly bound PA and collagen I
    - reference_id: PMID:36185380
      supporting_text: overexpression of the two anthrax toxin receptors did not increase the interaction
        of collagen VI with the cells.
