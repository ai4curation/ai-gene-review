suggested_questions:
- question: Is SMIM10L1 an integral mitochondrial membrane protein, and in which membrane (outer or inner)
    and orientation does it sit?
- question: 'How does loss of a mitochondrial microprotein lower PTEN and increase PI3K/AKT/mTOR signalling
    in adipose progenitors: directly or through a metabolic signal?'
suggested_experiments:
- hypothesis: SMIM10L1 is a mitochondrial membrane protein.
  description: Fractionate mitochondria from cells expressing endogenously tagged SMIM10L1, test carbonate
    resistance and protease protection with outer- and inner-membrane markers, and confirm by immunofluorescence
    or proximity labelling.
