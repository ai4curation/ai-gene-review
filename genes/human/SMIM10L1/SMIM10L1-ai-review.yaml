core_functions:
- description: No molecular activity is known for SMIM10L1. Proteomics places it in mitochondria; knockdown
    in adipose progenitor cells raises PI3K/AKT/mTOR signalling and enhances adipogenesis, but how it
    acts is unknown, so no function is asserted here.
