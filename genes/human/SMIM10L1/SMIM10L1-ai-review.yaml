  review:
    summary: High-throughput assignment to mitochondria from the MitoCoP high-confidence human mitochondrial
      proteome.
    action: ACCEPT
    reason: MitoCoP assigns proteins by combining subtractive and spatial proteomics, import assays and
      curation under stringent criteria. The per-protein evidence for SMIM10L1 sits in supplementary tables
      not in our cache, so we defer to the curator. It is the only location evidence for SMIM10L1 and
      fits a small protein with a hydrophobic C-terminal segment. The mitochondrial sub-compartment is
      not established.
