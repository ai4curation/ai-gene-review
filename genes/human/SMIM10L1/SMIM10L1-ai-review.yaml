id: P0DMW3
gene_symbol: SMIM10L1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMIM10L1 is a 68-amino-acid protein of the SMIM10 family (Pfam DUF4560), paralogous to SMIM10,
  with a disordered alanine/proline-rich N-terminus and a hydrophobic C-terminal half predicted to be
  alpha-helical and membrane-associated. It is expressed in all tissues. A high-confidence proteomic inventory
  of human mitochondria includes it. In adipose progenitor cells its transcript falls sharply after PTEN
  knockdown, and its own knockdown increases PI3K/AKT/mTOR signalling and enhances adipocyte differentiation.
  Its membrane topology, mitochondrial sub-compartment and molecular activity are unknown.
