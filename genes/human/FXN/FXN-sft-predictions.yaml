description: 'BioReason-Pro SFT predictions for human FXN from wanglab/protein_catalogue: 17 unchanged
  predicted terms are assessed as 11 correct but not novel (CNN) and 6 uncertain (UNC). Supported calls
  include protein and ferrous-ion binding, assay-demonstrated iron delivery and ferroxidase activity,
  Fe-S cluster assembly, complex membership and contextual localization or cellular responses. The measured
  ferroxidase capability does not establish physiological iron oxidation. Cluster binding, two growth-related
  processes, oxidoreductase regulation, cellular peroxide response and autoprocessing remain unresolved
  within the inspected evidence.'
