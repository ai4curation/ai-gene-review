id: Q16595
gene_symbol: FXN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for frataxin. The model places FXN correctly inside the mitochondrial
  iron-sulfur cluster assembly machinery: ranks 3, 4 and 5 all name the ISC complex or the iron-incorporation
  step, matching this review's core functions. The cost is ontology drift - rank 1 is obsolete and
  rank 2's label does not resolve at all, so the model's two most confident calls are both unusable.
  The iron chaperone activity that is this review's first core function is not retrieved. Assessment:
  1 correct novel (COR), 1 correct not novel (CNN), 1 uncertain (UNC).
