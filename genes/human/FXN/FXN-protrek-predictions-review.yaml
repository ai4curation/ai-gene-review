        Frataxin, mitochondrial
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1990221
    label: L-cysteine desulfurase complex
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Rank 3 (score 17.21), reviewed in place of rank 2 whose label (mitochondrial iron-sulfur cluster
      assembly complex) does not resolve in the current GO release. The L-cysteine desulfurase complex
      is the NFS1-LYRM4-ACP1 core that FXN binds and allosterically activates, and it is an ancestor
      of the mitochondrial [2Fe-2S] assembly complex this review assigns. Correct and effectively
      on the record.
    supported_by:
    - reference_id: file:human/FXN/FXN-uniprot.txt
      supporting_text: >-
        Belongs to the frataxin family
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0018283
    label: iron incorporation into metallo-sulfur cluster
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 4 (score 16.68) and absent from GOA. Iron incorporation into a metallo-sulfur cluster is
      precisely what FXN enables - it binds Fe2+ and delivers it during [2Fe-2S] assembly - and it
      is a strict descendant of the annotated iron-sulfur cluster assembly. Correct, specific and
      novel. Three of the five calls being right and two being ontologically stale is the recurring
      shape of this cohort's results for well-studied proteins.
    supported_by:
    - reference_id: file:human/FXN/FXN-uniprot.txt
      supporting_text: >-
        Frataxin, mitochondrial
