  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0010722
    label: regulation of ferrochelatase activity
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 17.35). Regulation of ferrochelatase activity is a real FXN function -
      this review records FXN as an iron donor for ferrochelatase in heme biosynthesis - but the term
      is obsolete in the current GO release. Correct in substance and unusable in practice; recorded
      as uncertain.
    supported_by:
