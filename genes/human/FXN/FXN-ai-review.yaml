references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official InterPro-to-GO method maps curated family/domain/site signatures to GO
      assertions after sequence matching. It explains FXN’s signature-derived rows; the method page is
      not itself an experiment establishing every mapped function. The actual IPR017789 biological scope
      is assessed separately.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official method describes curator-judged transfer from experimentally annotated
      similar proteins, retaining the donor accession and excluding NOT source assertions. It explains
      the literal Q07540 ISS source. The FXN-specific donor identity and matrix IDA were separately verified;
      reading the method does not claim a fresh experimental read of that donor paper.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic official PAINT method describes curated ancestral functions supported
      by experimental descendants. Independent retained PTHR16821 tree/MSA, AN/PTN lookup and literal
      IBD data establish all six incoming FXN nodes on the actual 210-residue human lineage, with exact
      donor sets. Target self-membership is valid experimental grounding. This verifies propagation provenance
      rather than pairwise similarity; it does not independently resolve inaccessible cluster-binding
      chemistry.
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The retained official metadata identifies the historical UniProt keyword-to-GO mapping
      method and explicitly says that a formerly all-species pipeline is now restricted to viruses. Preserve
      this as historical reference provenance without treating the current restriction as evidence that
      a past human biological assertion was false. No current FXN assay or keyword-specific function is
      established by the method description.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official method maps the UniProt subcellular-location controlled vocabulary to GO,
      with different underlying manual and automated annotation routes. This explains the cytosol mapping
      source, not a newly performed localization experiment. Human FXN fractionation and current HPA metadata
      provide separate biological support; natural-product specificity is not inferred from the mapping.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official HPA method describes antibody-based confocal localization curation and
      literature-support grading. Its identity is verified. Current FXN metadata and sample labels were
      separately inspected, but no individual image was independently scored and no isoform specificity
      is established merely by the method citation.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official Ensembl Compara method automatically transfers eligible experimental annotations
      across qualifying orthology relationships, excluding NOT and generic protein-binding transfer. It
      explains inherited automated provenance. Reading this method is not an independent audit of every
      historical donor alignment or assay; each biological assertion still requires its own scope assessment.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official ARBA method uses reviewed manual annotations to learn rules, including
      ontology-based augmentation with broader GO terms, and assigns electronic predictions. It explains
      the broad homeostasis rules cited by FXN. Method identity does not establish that a particular rule
      correctly captures FXN’s mechanism or that a predicted process is core.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official combined-IEA method merges identical annotations from several electronic
      pipelines and retains their sources in WITH/FROM. It is a deduplication/provenance method rather
      than an independent experiment or a count of independent confirmations. Preserve the literal FXN
      source identifiers and assess the biological scope separately.
- id: PMID:12785837
  title: Iron-sulfur cluster biosynthesis. Characterization of frataxin as an iron donor for assembly
    of [2Fe-2S] clusters in ISU-type proteins.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Authentic abstract verifies the reported positive ferrous/ferric binding, iron donation
      and [2Fe-2S] assembly measurements. The ferric-specific finding conflicts with controlled negative
      human NMR evidence in PMID:29576242 and is recorded as DISPUTED below; the full older experiment
      was inaccessible. The separate FXN-bound cluster and autoprocessing claims remain unverified. Neither
      the identifier nor all findings are rejected.
  findings:
  - statement: Human frataxin was reported to bind ferric iron in fluorescence and calorimetric measurements.
    supporting_text: "Enthalpies and entropies for ferric \nion binding were determined from calorimetric\
      \ measurements."
    full_text_unavailable: true
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:29576242
      review_notes: The later human NMR experiment found no ferric-induced shifts, checked for precipitation
        and demonstrated loss of the ferrous-bound response on oxidation. This is a genuine conflict,
        with older complete assay conditions unavailable here; it does not establish a cause for the discrepancy
        or definitively overturn every ferric-binding report. Other findings in this paper are assessed
        separately.
      supported_by:
      - reference_id: PMID:29576242
        supporting_text: 'oxidized Fe2+ lost affinity to

          FXN'
