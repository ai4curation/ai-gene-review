id: Q16595
gene_symbol: FXN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Frataxin is a nuclear-encoded protein that promotes mitochondrial iron-sulfur cluster assembly.
  In the mitochondrial matrix it associates with the NFS1/ISD11/acyl-carrier-protein/ISCU machinery and
  accelerates sulfur transfer from NFS1 to ISCU, supporting formation of initial [2Fe-2S] clusters used
  by respiratory, metabolic and other iron-sulfur proteins. Human frataxin binds iron and can support
  iron delivery in reconstituted systems, but its physiological role as an obligatory iron donor remains
  unresolved. Assembled protein preparations exhibit ferroxidase activity. Cytosolic frataxin pools have
  also been detected in human cells. The mitochondrial precursor undergoes proteolytic maturation, and
  alternative splicing produces distinct protein sequences. Frataxin deficiency causes Friedreich ataxia.
