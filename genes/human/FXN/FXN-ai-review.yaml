core_functions:
- description: FXN activates the mitochondrial cluster-assembly machinery by promoting NFS1-to-ISCU persulfide
    transfer and rearrangement of the ISCU assembly site, enabling efficient initial [2Fe-2S] cluster
    formation. It acts as an activating component of the assembly complex; the experiments do not establish
    it as the obligatory physiological iron donor. Complex occupancy and assay composition vary, and some
    recombinant structural preparations contain bacterial ACP.
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  directly_involved_in:
  - id: GO:0044571
    label: '[2Fe-2S] cluster assembly'
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0099128
    label: mitochondrial [2Fe-2S] assembly complex
  supported_by:
  - reference_id: PMID:24971490
    supporting_text: Previous in vitro results revealed a role for human FXN in activating the cysteine
      desulfurase and Fe-S cluster biosynthesis activities of the Fe-S assembly complex.
  - reference_id: PMID:38627381
    supporting_text: High-resolution cryo-EM structures obtained from anaerobically prepared samples provide
      snapshots that both visualize different stages of persulfide transfer from Cys381NFS1 to Cys138ISCU2
      and clarify the molecular role of frataxin in optimally positioning assembly site residues for fast
      sulfur transfer
suggested_questions:
- question: Which iron source supplies human ISCU in vivo, and under which conditions does FXN-mediated
    iron delivery contribute beyond its sulfur-transfer activation role?
- question: What physiological settings, if any, require the ferroxidase activity observed for assembled
    frataxin preparations?
- question: Which original assays establish an assembled cluster bound to FXN, FXN autoprocessing, or
    a cellular hydrogen-peroxide response in the access-limited annotation contexts?
- question: How do the three declared natural splice products differ in abundance, processing and localization,
    separately from engineered mature-fragment experiments?
suggested_experiments:
- description: Compare iron delivery and sulfur-transfer activation using controlled human assembly reactions
    and complementary cellular measurements that distinguish FXN-dependent activation from the source
    of iron.
  hypothesis: The relative contribution of iron delivery may depend on the assembly and cellular conditions.
- description: Resolve endogenous product sequences and compartment distributions with isoform-discriminating
    measurements and fraction-purity controls, separately tracking precursor maturation.
  hypothesis: Natural splice products and processed forms may differ in abundance or distribution without
    every tested fragment corresponding to a natural product.
