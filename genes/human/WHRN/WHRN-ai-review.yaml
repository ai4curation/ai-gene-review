- term:
    id: GO:0002142
    label: stereocilia ankle link complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: Core complex membership. The long whirlin isoform is one of the four
      components (WHRN, PDZD7, USH2A, ADGRV1) of the transient ankle-link complex
      at the base of developing stereocilia, and together with PDZD7 it bridges
      USH2A and ADGRV1 into the quaternary USH2 complex.
    action: ACCEPT
    reason: Direct biochemical and localization evidence supports this complex membership
      (PMID:25406310, PMID:16434480). This is one of the two core hair-cell roles
      of whirlin (long-isoform, developing bundles) and its disruption underlies
      USH2D. The IBA correctly places the function at the right level.
    supported_by:
    - reference_id: PMID:25406310
      supporting_text: In hair cells, proteins encoded by the four genes are colocalized
        at the ankle link region of the mechanosensitive structure, the hair bundle,
        during development
    - reference_id: PMID:25406310
      supporting_text: Importantly, both WHRN and PDZD7 are required for the complex
        formation with USH2A and GPR98.
- term:
    id: GO:0032426
    label: stereocilium tip
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Core localization. The short (C-terminal) whirlin isoform localizes
      to stereocilia tips, where it forms the elongation-promoting tip complex with
      MYO15A and EPS8; MYO15A is required to deliver whirlin to the tips.
    action: ACCEPT
    reason: Tip localization is one of the two core hair-cell roles of whirlin (short
      isoform, stereocilia elongation) and is well supported experimentally in mouse
      and corroborated by interaction of human WHRN with CIB2 at stereocilia tips
      (PMID:23023331). Loss of tip function causes DFNB31 nonsyndromic deafness.
    supported_by:
    - reference_id: PMID:23023331
      supporting_text: We show that CIB2 can multimerize and interacts with whirlin,
        which is localized at the tips of stereocilia
    - reference_id: file:human/WHRN/WHRN-deep-research-falcon.md
      supporting_text: MYO15A acts as an actin-based motor that delivers or retains
        the complex at stereociliary tips, whereas EPS8 supplies actin-regulatory
        activity.
