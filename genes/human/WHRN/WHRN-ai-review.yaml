- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  review:
    summary: Quantitative fragmentomics/holdup affinity profiling of PDZ-domain-mediated
      interactions; hundreds of GOA lines (over 400 partner pairs) derive from this
      single high-throughput affinity-mapping study.
    action: MARK_AS_OVER_ANNOTATED
    reason: In vitro affinity measurements between isolated PDZ domains and peptide
      motifs demonstrate binding capability, not physiological interaction; the
      sheer number of partners annotated from this one paper illustrates why bare
      'protein binding' over-annotates. Whirlin's real function is selective scaffolding
      within specific sensory-cell complexes.
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  review:
    summary: Whirlin self-association. UniProt records that whirlin forms homooligomers,
      and self-association/multivalency of whirlin is mechanistically required for
      the phase-separation-mediated assembly of both the tip complex and the ankle-link
      condensate.
    action: ACCEPT
    reason: Unlike generic protein binding, self-association is a specific, mechanistically
      important property of whirlin - deafness mutations (e.g. A64D, R223H) that
      impair whirlin self-association compromise condensate scaffold assembly (Wang
      et al. 2023, Nat Commun; see deep research). The IPI evidence from affinity
      mapping is consistent with this documented property.
    supported_by:
    - reference_id: file:human/WHRN/WHRN-deep-research-falcon.md
      supporting_text: WHRN A64D and R223H retained partner binding but impaired WHRN
        self-association and LLPS, showing that dimerization/oligomerization contributes
        independently to scaffold function.
