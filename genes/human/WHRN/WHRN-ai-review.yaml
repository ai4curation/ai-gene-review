    label: cilium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Phylogenetically inferred ciliary localization, consistent with whirlin's
      well-documented localization at the photoreceptor connecting cilium and periciliary
      region (a true microtubule-based cilium, distinct from the actin-based stereocilia).
    action: ACCEPT
    reason: Whirlin, USH2A and VLGR1b co-localize at the connecting cilium of photoreceptors
      (PMID:16434480), and whirlin is also found at the ciliary axoneme with MPP1
      (PMID:17584769). The IBA is seeded from mouse and rat experimental members of
      the family and the human protein clearly inherits this localization; the term
      is broad but correct.
    supported_by:
    - reference_id: PMID:16434480
      supporting_text: we demonstrate that whirlin, USH2A and Vlgr1b co-localize at
        the connecting cilium and the outer limiting membrane of photoreceptor cells
        and in spiral ganglion neurons of the inner ear
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Phylogenetically inferred plasma membrane localization. Whirlin is a
      peripheral (cytoplasmic) scaffold that acts at specialized plasma membrane
      domains - the ankle-link region at the stereocilia base and the photoreceptor
      periciliary membrane - by binding the cytoplasmic tails of the transmembrane
      proteins USH2A and ADGRV1.
    action: ACCEPT
    reason: Broad but correct; whirlin's function is executed at membrane-apposed
      scaffolds (ankle-link complex, periciliary membrane complex), which are captured
      more precisely by other annotations in this set. The is_active_in qualifier
      is appropriate since whirlin acts at these membrane domains.
    supported_by:
    - reference_id: PMID:25406310
      supporting_text: In photoreceptors, USH2A, GPR98, and WHRN proteins are colocalized
        at the periciliary membrane complex of the inner segment apex and immediately
