suggested_questions:
- question: GO lacks a term for positive regulation of vitamin D catabolic process; should one be requested so that FGF23 (and PTH/calcitriol-responsive regulators) can capture the CYP24A1-inducing arm of vitamin D regulation distinctly from suppression of CYP27B1?
- question: Does the C-terminal FGF23 fragment released by furin cleavage act as a physiological endogenous antagonist of intact FGF23 at the Klotho-FGFR1c complex, and should it be represented separately (e.g. as a chain-level annotation)?
- question: Are the Klotho-independent actions of high FGF23 (e.g. FGFR4-mediated cardiomyocyte hypertrophy, reported in chronic kidney disease) physiological functions of FGF23 or pathological off-target effects of supraphysiological concentrations?
- question: How much do FGFR3c and FGFR4 contribute, relative to FGFR1c, to FGF23-Klotho signalling in the proximal versus distal tubule in vivo?
suggested_experiments:
- hypothesis: FGF23 signalling in the proximal tubule requires FGFR1c specifically, with FGFR3c/FGFR4 dispensable.
  description: Tubule-segment-specific conditional deletion of Fgfr1, Fgfr3 and Fgfr4 (singly and in combination) in mice, followed by acute recombinant FGF23 challenge with readouts of NaPi-2a protein, Cyp27b1/Cyp24a1 transcripts, ERK phosphorylation and urinary phosphate excretion.
  experiment_type: conditional genetics with acute hormone challenge
- hypothesis: The furin-released C-terminal FGF23 peptide circulates at concentrations sufficient to antagonise intact FGF23 at the Klotho-FGFR1c complex.
  description: Quantify intact FGF23 and the free C-terminal fragment separately by targeted mass spectrometry in human plasma across normal, ADHR and CKD cohorts, and test the measured fragment concentrations for competition against intact FGF23 in a Klotho-FGFR1c reporter assay.
  experiment_type: quantitative proteomics plus receptor-activation assay
- hypothesis: FGF23 suppression of osteoblast mineralization is a local autocrine action rather than an artefact of overexpression.
  description: Compare mineralization and osteoblast differentiation markers in osteoblast cultures from Fgf23-null versus wild-type mice, with add-back of physiological concentrations of intact FGF23 with and without soluble alpha-Klotho, and with FGFR inhibition.
  experiment_type: primary cell culture with genetic loss of function
- hypothesis: Direct parathyroid suppression by FGF23 requires alpha-Klotho in parathyroid chief cells.
  description: Parathyroid-specific Kl deletion in mice, followed by recombinant FGF23 infusion, measuring PTH secretion, PTH mRNA, parathyroid ERK1/2 phosphorylation and Egr1 induction.
  experiment_type: tissue-specific knockout with hormone infusion
