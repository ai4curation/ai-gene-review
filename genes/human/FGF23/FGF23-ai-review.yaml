id: Q9GZV9
gene_symbol: FGF23
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Fibroblast growth factor 23 (FGF23) is a secreted endocrine member of the FGF19 subfamily of fibroblast growth factors, produced mainly by osteocytes and osteoblasts, that acts as the principal phosphaturic hormone. Circulating intact FGF23 binds FGFR1c (and to a lesser extent FGFR3c/FGFR4) in a 1:1:1 complex with the transmembrane co-receptor alpha-Klotho, which tethers the FGF23 C-terminal tail and confers high-affinity binding; receptor dimerisation additionally requires heparan sulfate. In the renal proximal tubule, FGF23-Klotho-FGFR signalling via FRS2/ERK reduces NaPi-2a/2c sodium-phosphate cotransporters, promoting phosphate excretion, and suppresses CYP27B1 while inducing CYP24A1, lowering 1,25-dihydroxyvitamin D. In the parathyroid it suppresses PTH synthesis and secretion. FGF23 production is stimulated by phosphate and calcitriol. Activity is controlled post-translationally: furin-type proprotein convertase cleavage at the R176XXR179 site inactivates the hormone
  (the released C-terminal peptide can antagonise intact FGF23), GALNT3 O-glycosylation at Thr178 protects the site, and FAM20C phosphorylation of Ser180 opposes this glycosylation. Cleavage-resistant missense mutations cause autosomal dominant hypophosphatemic rickets, and loss-of-function mutations cause hyperphosphatemic familial tumoral calcinosis.'
existing_annotations:
- term:
    id: GO:0005104
    label: fibroblast growth factor receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9EPC2
  - ensembl:ENSMUSP00000000186
  review:
    summary: FGF23 binds FGF receptors; its physiological receptor is FGFR1c converted into a high-affinity FGF23 receptor by the co-receptor alpha-Klotho. Electronic orthology transfer from mouse Fgf23.
    action: ACCEPT
    reason: Receptor binding is the core molecular function of FGF23 as a ligand. Direct binding to FGFR1c in a ternary complex with Klotho has been demonstrated biochemically and structurally, so this IEA is correct (the more specific GO:0005105 is also present).
    supported_by:
    - &id001
      reference_id: PMID:17086194
      supporting_text: Thus, the concerted action of Klotho and FGFR1(IIIc) reconstitutes the FGF23 receptor.
    - &id003
      reference_id: PMID:19966287
      supporting_text: the soluble ectodomains of FGFR1c and Klotho are sufficient to form a ternary complex with FGF23 in vitro
    - &id002
      reference_id: PMID:29342138
      supporting_text: tethers FGFR1c by its D3 domain and FGF23 by its C-terminal tail, thus implementing FGF23-FGFR1c proximity and conferring stability
- term:
    id: GO:0005105
    label: type 1 fibroblast growth factor receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1891427
  - PANTHER:PTN002608225
  review:
    summary: FGF23 binds FGFR1 (the IIIc isoform), its principal signalling receptor in kidney and parathyroid, in a complex with alpha-Klotho. PAINT IBD placement within the FGF ligand family.
    action: ACCEPT
    reason: 'FGFR1c is the main receptor for FGF23: Klotho converts FGFR1(IIIc) into the FGF23 receptor and the crystal structure of the 1:1:1 FGF23-FGFR1c-alpha-Klotho complex shows direct FGF23-FGFR1c contact. FGF23 lies in the clade that inherited receptor binding, and there is target-specific experimental support, so the IBA is sound and at an appropriate level of specificity.'
    supported_by:
    - *id001
    - *id002
    - *id003
