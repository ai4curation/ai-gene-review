- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:109178
  - MGI:MGI:109189
  - MGI:MGI:1914362
  - MGI:MGI:95517
  - MGI:MGI:95521
  - PANTHER:PTN000160075
  - RGD:2608
  - UniProtKB:P05230
  - UniProtKB:P48800
  - UniProtKB:Q92913
  - WB:WBGene00002881
  - ZFIN:ZDB-GENE-050221-5
  - ZFIN:ZDB-GENE-100316-2
  - ZFIN:ZDB-GENE-990415-72
  review:
    summary: IBA 'is_active_in cytoplasm' propagated from the FGF family node (seeded by FGF1/FGF2-type and intracellular FGF members).
    action: REMOVE
    reason: FGF23 has an N-terminal signal peptide (residues 1-24) and is a classically secreted endocrine hormone; its activity (receptor binding) occurs extracellularly. The cytoplasmic activity inferred at the family node derives from members that lack signal peptides (FGF1/FGF2) or are intracellular (FGF11-14). FGF23 is inside the secreted endocrine subfamily that lost this property; its only intracellular presence is transit through the ER/Golgi secretory pathway, which does not constitute being active in the cytoplasm.
    supported_by:
    - *id005
    - *id004
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000160075
        source_label: PTN000160075
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family-level node for the FGF ligand family; cytoplasmic activity at this node reflects members without signal peptides (FGF1/FGF2-type) and intracellular FGFs, not the secreted endocrine subfamily.
      - source_id: UniProtKB:P05230
        source_label: FGF1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: FGF1 lacks a classical signal peptide and has documented intracellular/nuclear pools; FGF23 has a cleaved signal peptide (residues 1-24) and is classically secreted.
      residue_claims_not_applicable: This is a compartment-assignment question (signal peptide present, classical secretion) rather than a point-residue argument.
- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952289
  qualifier: located_in
  review:
    summary: Reactome FAM20C substrate phosphorylation reaction places FGF23 in the ER lumen during secretory processing.
    action: KEEP_AS_NON_CORE
    reason: FGF23 transits the ER/Golgi lumen, where it is phosphorylated by FAM20C and O-glycosylated by GALNT3 before secretion; this is a transient biosynthetic location and not where FGF23 functions.
    supported_by:
    - *id004
