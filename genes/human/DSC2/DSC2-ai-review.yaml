    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: HPA supports a plasma-membrane pool; its additional endoplasmic-reticulum observation has
      uncertain location-specific reliability.
    action: KEEP_AS_NON_CORE
    reason: The HPA target ENSG00000134755/Q02487, assessed with antibody HPA012615, has supported plasma-membrane
      localization in the summary and plasma-membrane staining in HaCaT, SuSa and U-2 OS cells. The same
      source records additional endoplasmic-reticulum staining in HaCaT and SuSa but rates that location
      uncertain. Overall gene reliability is supported and must not be substituted for the individual
      ER score. Preserve the positive broader plasma-membrane pool as contextual localization because
      this source does not resolve all signal to desmosomes. Retain ER as an uncertain observation rather
      than an established additional compartment; no new image-pixel interpretation is claimed.
    supported_by:
    - reference_id: GO_REF:0000052
    - reference_id: https://www.proteinatlas.org/ENSG00000134755-DSC2/subcellular
