- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21062920
  qualifier: enables
  supporting_entities:
  - UniProtKB:F1M7L9
  review:
    summary: Human DSC2 tails associate with plakophilin-2 in the plaque-linkage assay.
    action: MODIFY
    reason: The literal partner F1M7L9 is rat plakophilin-2. Human DSC2a and DSC2b cytoplasmic tails capture
      it from rat-heart lysate. Plakophilin-2 is an armadillo-repeat plaque protein in the cadherin–intermediate-filament
      linkage, not a filament-forming subunit. GO:0008092 covers binding a protein component of the cytoskeleton;
      the partner's documented intermediate-filament and plaque-protein interactions, together with curated
      intermediate-filament component assignments, support this broad class. Those rat/human component
      annotations are ortholog-based and are not relabeled as direct rat localization experiments. The
      DSC2 assay establishes lysate association, not purified binary contact, and does not imply that
      all cellular PKP2 pools or both DSC2 products have identical functions. Specifically, rat F1M7L9
      has GO:0005882 ISO from MGI:1914701 (GO_REF:0000121), human Q99959 has GO:0005882 ISS from Q9CQ73
      (GO_REF:0000024), and mouse Q9CQ73 has the corresponding IDA annotation from PMID:16917092. GO:0005882
      is within the current GO:0005856 cytoskeleton closure. The donor experiment is retained as a curated
      assertion; its full PKP2-specific assay was not independently recovered.
    proposed_replacement_terms:
    - id: GO:0008092
      label: cytoskeletal protein binding
    supported_by:
    - reference_id: PMID:21062920
