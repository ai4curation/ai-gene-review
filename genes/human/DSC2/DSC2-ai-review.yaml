suggested_questions:
- question: How do DSC2a and DSC2b contribute differently to cardiac versus epithelial junction stability
    when their extracellular domains are identical but their plaque-binding tails differ?
- question: Which membrane organization, calcium and force conditions determine the relative contribution
    of DSC2 self-binding and DSC2–desmoglein binding in native desmosomes?
- question: What source experiments resolve the narrow His–Purkinje, ventricular action-potential and
    p38MAPK annotations for DSC2, and do their reagents distinguish current DSC2 from DSC3?
- question: Do the urinary, salivary and prostatic-fluid proteomic assignments identify a specific DSC2
    proteoform or peptide-bearing vesicle population?
suggested_experiments:
- description: Compare endogenous-level rescue with sequence-verified DSC2a and DSC2b in human cardiac
    and epithelial models, measuring junction recruitment, plaque interactions and mechanical cohesion
    with matched expression.
- description: Combine native-membrane proximity/contact measurements with controlled calcium and force
    perturbations to distinguish DSC2 self-pairs from DSC2–desmoglein pairs without extrapolating from
    crystal packing.
- description: Map target peptides and proteoforms in purified extracellular-vesicle preparations using
    orthogonal vesicle markers and contamination controls before assigning product-specific export.
