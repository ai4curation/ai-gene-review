core_functions:
- description: 'DSC2 is a desmosomal cadherin whose calcium-binding extracellular domains engage cadherins
    across adjacent cells, while its cytoplasmic tail couples the adhesive interface to the desmosomal
    plaque. Human ectodomain experiments establish adhesive binding to desmogleins; complementary single-molecule
    experiments also detect DSC2 self-binding under their assay conditions. These observations support
    cadherin-mediated cell-cell adhesion without requiring a universal exclusive homo- or heterophilic
    arrangement. The two natural splice products share the extracellular and transmembrane regions but
    have different cytoplasmic tails: human tail constructs associate with plakophilin-2, whereas the
    longer DSC2a tail additionally supports plakoglobin and desmoplakin-fragment association in lysate-based
    assays. This integrated adhesive and anchoring role maintains desmosome integrity and contributes
    to junction assembly in cardiac and epithelial tissues; contextual signaling and repair effects do
    not establish a separate catalytic activity.'
