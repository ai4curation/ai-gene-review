id: Q02487
gene_symbol: DSC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Desmocollin-2 (DSC2) is a single-pass desmosomal cadherin that mediates calcium-dependent
  adhesion between neighboring cells. Its extracellular cadherin domains bind desmosomal cadherins, and
  its cytoplasmic tail associates with plaque proteins that connect the junction to intermediate filaments.
  DSC2 helps maintain the mechanical integrity of cardiac intercalated discs and epithelial junctions
  and contributes to desmosome assembly and epithelial repair. Alternative splicing produces two forms
  with shared extracellular regions and distinct cytoplasmic tails that differ in plaque-protein interactions.
alternative_products:
- name: 2A (DGII)
  id: Q02487-1
  description: The displayed 2A (DGII) product encodes 901 residues. The official sequence contains a
    signal peptide at 1–27, a propeptide at 28–135, the extracellular cadherin region at 136–694, a transmembrane
    segment at 695–715 and the cytoplasmic tail at 716–901. Human DSC2a tail constructs associate with
    plakophilin-2 and plakoglobin in rat-heart lysate pull-downs and with a desmoplakin N-terminal fragment
    in transfected COS-1 assays. These assays establish a product distinction without treating each association
    as purified binary contact. Proteolytic maturation is distinct from alternative splicing.
- name: 2B (DGIII)
  id: Q02487-2
  sequence_note: VSP_000657, VSP_000658
  description: The official 2B (DGIII) product encodes 847 residues. VSP_000657 replaces displayed residues
    837–847 (KVYLCNQDENH) with ESIRGHTLIKN, and VSP_000658 removes residues 848–901. The extracellular
    and transmembrane regions are shared with 2A. Human DSC2b tail constructs associate with plakophilin-2
    in the reported pull-down assay but do not show the plakoglobin or desmoplakin-fragment association
    observed for DSC2a. Ectodomain-only binding experiments do not establish identical intracellular coupling
    or whole-protein function for the two products.
