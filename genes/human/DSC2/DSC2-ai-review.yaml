  review:
    summary: DSC2–DSG2 binding directly supports a cadherin adhesion activity.
    action: MODIFY
    reason: The 2022 study includes DSC2 and DSG2 ectodomains, but its supplementary affinity table attributes
      the DSC2–DSG2 29,000 nM value to the previously published 2016 study. The source-data network explicitly
      labels that affinity as Published. The independent 2016 human ectodomain SPR and bead-adhesion experiments
      establish cadherin binding involved in cell-cell adhesion, justifying GO:0098641. Raw 2022 screening
      values are not relabeled as new high-affinity validation; the DSC2 ectodomain sequence shared by
      both natural products does not establish identical cytoplasmic-tail behavior.
