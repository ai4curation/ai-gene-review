  supporting_entities:
  - UniProtKB:Q02487
  review:
    summary: DSC2 self-association is observed in defined experimental constructs and conditions.
    action: MODIFY
    reason: The 2016 paper reports a weak DSC2 homodimeric crystal contact in a construct containing DSC2
      EC1 and DSG2 EC2–5, while solution DSC2 self-association is very weak and DSC2-coated beads do not
      aggregate. Complementary 2014/2018 single-molecule experiments detect DSC2 self-binding. Identical
      protein binding is supported without converting the crystal contact into exclusive native homophilic
      adhesion or rejecting the positive source assertion.
    proposed_replacement_terms:
    - id: GO:0042802
      label: identical protein binding
    supported_by:
    - reference_id: PMID:27298358
    - reference_id: PMID:24610950
    - reference_id: PMID:29999492
