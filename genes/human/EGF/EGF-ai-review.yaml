id: P01133
gene_symbol: EGF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  EGF encodes a type I transmembrane precursor that is proteolytically processed
  to release mature epidermal growth factor, a secreted ligand for EGFR-family
  receptor tyrosine kinases. Mature EGF binds EGFR and promotes ligand-induced
  receptor dimerization and autophosphorylation, activating ERBB signaling
  outputs such as the RAS-RAF-MEK-ERK cascade and PI3K-AKT signaling in
  epithelial and other responsive tissues.
