- term:
    id: GO:0002092
    label: positive regulation of receptor internalization
  evidence_type: IDA
  original_reference_id: PMID:22732145
  qualifier: involved_in
  review:
    summary: Ligand binding by EGF promotes EGFR ubiquitination, internalization, and endosomal trafficking.
    action: KEEP_AS_NON_CORE
    reason: EGFR down-regulation is a well-established consequence of EGF stimulation, but the core function remains receptor liganding rather than execution of the endocytic machinery.
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IDA
  original_reference_id: PMID:20353436
  qualifier: enables
  review:
    summary: EGF stimulation activates Ras downstream of EGFR but EGF is not a Ras guanine-nucleotide exchange factor.
    action: REMOVE
    reason: The cited study measured epidermal growth factor activation of Ras. Nucleotide exchange on Ras is catalyzed by SOS-family GEFs recruited downstream of EGFR, not by the extracellular EGF ligand.
