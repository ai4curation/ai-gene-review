- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: IDA
  original_reference_id: PMID:15611079
  qualifier: involved_in
  review:
    summary: EGF can stimulate endothelial proliferation, migration, tube formation, PI3K-AKT signaling, and angiogenic responses in appropriate endothelial contexts.
    action: KEEP_AS_NON_CORE
    reason: These are biologically plausible outputs of EGF-EGFR signaling but are tissue and assay contexts downstream of the core ligand activity.
