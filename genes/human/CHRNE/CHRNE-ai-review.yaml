id: Q04844
gene_symbol: CHRNE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNE encodes the epsilon subunit of the skeletal-muscle nicotinic acetylcholine receptor.
  Epsilon replaces gamma during muscle receptor maturation and helps set the adult receptor's conductance,
  gating and calcium permeability. Two alpha1 chains, beta1, delta and either gamma or epsilon form the
  postsynaptic acetylcholine-gated cation channel. The epsilon subunit contributes to intersubunit ligand
  recognition and pore gating, linking motor-neuron transmitter release to muscle depolarization and contraction.
  Pathogenic variants alter receptor abundance or channel kinetics and cause congenital myasthenic syndromes.
