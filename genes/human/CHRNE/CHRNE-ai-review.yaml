  review:
    summary: Calcium passes through human muscle receptors containing epsilon.
    action: ACCEPT
    reason: PMID:16527851 directly measures the calcium fraction in reconstituted human receptors and
      myotubes; adult epsilon-containing channels differ from fetal gamma-containing channels. This is
      subunit contribution to complex conductance, not autonomous epsilon calcium-channel activity or
      an identical permeability in every species.
    supported_by:
    - reference_id: PMID:16527851
      supporting_text: 'Fetal human AChRs containing either the wild-type or the mutated

        alpha subunit had a much lower Pf (2-3%).'
