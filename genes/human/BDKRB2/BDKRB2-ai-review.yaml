core_functions:
- description: Plasma-membrane B2 bradykinin receptor that binds intact kinins such as bradykinin and
    kallidin and couples the occupied receptor to heterotrimeric G proteins, especially Gq/11, to activate
    phosphatidylinositol/Ca2+ signaling and vasoactive outputs.
  molecular_function:
    id: GO:0004947
    label: bradykinin receptor activity
  directly_involved_in:
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  - id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  - id: GO:0042311
    label: vasodilation
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:1314587
    supporting_text: the human BK-2 receptor expressed in COS-7 cells binds BK with a KD of 0.13 nM
  - reference_id: PMID:1329734
    supporting_text: Binding studies demonstrated that HG10 encodes a high affinity BK receptor
  - reference_id: PMID:1329734
    supporting_text: Functional coupling to the Ca(2+)-phosphatidylinositol cascade was demonstrated in
      transfected CHO cells
suggested_questions:
- question: Which human vascular beds use BDKRB2 primarily for Gq/Ca2+ signaling versus Gi or arachidonate-release
    branches in vivo?
- question: How often do endogenous ACE-BDKRB2 and AGTR1-BDKRB2 complexes form in primary human endothelial
    and smooth-muscle cells, and which kinin signaling outputs do they tune?
suggested_experiments:
- description: Measure endogenous BDKRB2, ACE and AGTR1 proximity in primary human endothelial cells with
    ligand time courses, B2-selective antagonists, and calcium/arachidonate reporters.
