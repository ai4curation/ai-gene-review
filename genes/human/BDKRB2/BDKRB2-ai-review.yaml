  - statement: Human BDKRB2 expressed in Sf21 cells is detected at the plasma membrane and couples bradykinin
      binding to calcium and G-protein responses.
    supporting_text: bradykinin induced a transient increase of intracellular calcium
    reference_section_type: ABSTRACT
- id: PMID:10993080
  title: AT1-receptor heterodimers show enhanced G-protein activation and altered receptor sequestration.
  findings:
  - statement: BDKRB2 and AGTR1 form stable heterodimers that enhance G-protein activation and change
      receptor sequestration.
    supporting_text: They form stable heterodimers, causing increased activation of G alpha(q) and G alpha(i)
      proteins
    reference_section_type: ABSTRACT
- id: PMID:1314587
  title: Cloning and pharmacological characterization of a human bradykinin (BK-2) receptor.
  findings:
  - statement: The human BK-2/BDKRB2 receptor was cloned and expressed in COS-7 cells, where it formed
      high-affinity bradykinin-binding sites with B2 subtype pharmacology.
    supporting_text: the human BK-2 receptor expressed in COS-7 cells binds BK with a KD of 0.13 nM
    reference_section_type: ABSTRACT
- id: PMID:1329734
  title: Molecular cloning, functional expression and pharmacological characterization of a human bradykinin
    B2 receptor gene.
  findings:
  - statement: Human BDKRB2/HG10 was cloned, bound bradykinin with high affinity, and coupled to phosphatidylinositol/Ca2+
      signaling after expression in CHO cells.
    supporting_text: Functional coupling to the Ca(2+)-phosphatidylinositol cascade was demonstrated in
      transfected CHO cells
    reference_section_type: ABSTRACT
- id: PMID:17077303
  title: Human ACE and bradykinin B2 receptors form a complex at the plasma membrane.
  findings:
  - statement: Human ACE and human BDKRB2 colocalize, coimmunoprecipitate and undergo FRET at the plasma
      membrane; bradykinin stimulation cointernalizes them.
    supporting_text: Coimmunoprecipitation indicated complex formation between ACE and B 2 receptor.
    reference_section_type: RESULTS
