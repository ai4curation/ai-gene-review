- term:
    id: GO:0004435
    label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  evidence_type: TAS
  original_reference_id: PMID:8302267
  qualifier: enables
  review:
    summary: BDKRB2 activates PLC but is not a PLC enzyme.
    action: REMOVE
    reason: The cited cloned-receptor work reports phosphatidylinositol hydrolysis downstream of activated
      B2R. BDKRB2 is a GPCR, not the phospholipase C enzyme that hydrolyzes PIP2.
    supported_by:
    - reference_id: PMID:8302267
      supporting_text: the cloned receptor activates both phosphatidylinositol hydrolysis and arachidonic
        acid release by independent pathways.
    - reference_id: PMID:10653985
      supporting_text: bradykinin induced a transient increase of intracellular calcium
    source_defects:
    - defect_type: WRONG_TERM
      resource: PINC
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004435
      cause: OTHER
      confidence: CONFIRMED
      explanation: The cited cloned-receptor study reports phosphatidylinositol hydrolysis downstream
        of activated BDKRB2. The receptor activates endogenous phospholipase C signaling but is not itself
        a phosphatidylinositol-4,5-bisphosphate phospholipase C enzyme, so the GO:0004435 row should be
        deleted rather than treated as an enzymatic activity of BDKRB2.
