id: P30411
gene_symbol: BDKRB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BDKRB2 encodes the constitutively expressed B2 bradykinin receptor, a class A seven-transmembrane
  G protein-coupled receptor at the plasma membrane. Binding of intact kinins such as bradykinin and kallidin
  activates Gq/11- and Gi-linked signaling, including phosphatidylinositol turnover, cytosolic calcium
  elevation and arachidonate release, and contributes to vasoactive and inflammatory responses. The receptor
  can physically associate with ACE and with the angiotensin II type 1 receptor, interactions that tune
  kinin and angiotensin signaling outputs.
