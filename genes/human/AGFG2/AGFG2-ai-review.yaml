- term:
    id: GO:0044794
    label: host-mediated activation of viral process
  evidence_type: IMP
  original_reference_id: PMID:25496667
  qualifier: involved_in
  review:
    summary: >-
      Proposed as a new annotation. shRNA knockdown of AGFG2 (HRBL) significantly raises
      CD4 surface levels in HIV-1-infected human T cells, and a follow-up study shows
      the requirement extends to both Nef- and Vpu-driven CD4 downregulation, so AGFG2
      is a host factor that the virus needs for this step.
    action: NEW
    reason: >-
      AGFG2 was one of seven validated hits from a genome-wide shRNA screen, retested in
      a second human cell background, and the effect was confirmed with Nef expressed
      alone. PMID:26701340 then showed that AGFG2 knockdown also raises CD4 in
      Vpu-expressing cells, distinguishing it from AGFG1/HRB, which supports only the
      Nef route. Neither paper has produced any annotation in GOA. GO:0044794 was chosen
      deliberately over two alternatives. A host-intrinsic term such as GO:1903077
      negative regulation of protein localization to plasma membrane would
      over-generalise, because CD4 surface levels were only ever measured in the
      presence of viral Nef or Vpu, so nothing establishes an AGFG2 role in CD4 traffic
      in uninfected cells. GO:0046784 viral mRNA export from host cell nucleus was
      rejected for the separate Rev-export result on two counts: its definition
      specifies intronless viral mRNA whereas the Rev/RRE pathway exports
      intron-containing transcripts, and it carries zero human annotations. GO:0044794
      by contrast carries 58 human annotations over 53 entities including IMP, so it is
      an actively used host-factor term. Its two existing children cover viral genome
      replication and viral transcription, neither of which applies, so the parent is
      the most specific available and a term request is filed in suggested_questions.
      Deliberately not entered in core_functions: the schema defines that section as the
      core *evolved* functions of the gene, and this is a role a virus co-opts, with no
      host-intrinsic counterpart demonstrated - CD4 surface levels were only ever measured
      in the presence of Nef or Vpu. The in-repo precedent agrees: the APOE review retains
      this same term as contextual rather than core. The annotation stands on its own
      evidence; it is the *core-function* status that the evidence does not reach.
    additional_reference_ids:
    - PMID:26701340
    supported_by:
    - reference_id: PMID:25496667
      supporting_text: Remarkably, only cells knocked down for HRBL, EPS15 and HSP90B1 were found to significantly express higher CD4 surface levels than the non-targeting shRNA control cells.
    - reference_id: PMID:25496667
      supporting_text: HRBL, EPS15 and HSP90B1 knock-down increased CD4 levels significantly in this experimental set-up, while the knock-down of IDH3G, SNX22 and DNM3 affected CD4 expression levels only in a minor, non-significant manner.
    - reference_id: PMID:26701340
      supporting_text: Interestingly, the knock-down of the related protein HRBL (HRB-like),
        but not of the HRB interaction partner EPS15 (epidermal growth factor receptor
        pathway substrate 15), increased CD4 levels in Vpu-expressing cells significantly.
    - reference_id: PMID:26701340
      supporting_text: These results identify HRB as a previously unknown co-factor for
        HIV-1 Nef-mediated CD4 downregulation and highlight differences with the related
        protein HRBL, which affects the CD4 downregulation in a dual role as co-factor of
        both HIV-1 Nef and Vpu.

core_functions:
- description: >-
    Acts in the late, stimulus-evoked step of regulated secretion from cytoplasmic
    secretory granules. In vascular endothelium AGFG2 is required for exocytosis of
    Weibel-Palade bodies: its depletion halves phorbol-ester-stimulated and
    significantly reduces histamine-stimulated von Willebrand factor release without
    changing unstimulated release, granule maturation, cargo multimerisation or
    propeptide cleavage, and its overexpression drives granule release even without a
    secretagogue. The tissue distribution, with strongest expression in salivary gland,
    is consistent with the same role in other secretory cell types, though that has not
    been tested.
  directly_involved_in:
  - id: GO:0045055
    label: regulated exocytosis
  locations:
  - id: GO:0031410
    label: cytoplasmic vesicle
  supported_by:
  - reference_id: PMID:34369554
    supporting_text: These results suggest that AGFG2 plays an important role in the stimulation-dependent secretion of vWF.
  - reference_id: PMID:34369554
    supporting_text: Overall, these results indicate that vWF transport to WPBs is not highly perturbed in SMAP1KD and AGFG2KD cells.
proposed_new_terms:
- proposed_name: Weibel-Palade body exocytosis
  proposed_definition: >-
    The regulated exocytosis of a Weibel-Palade body, the rod-shaped secretory granule
    characteristic of vascular endothelial cells, in which the granule fuses with the
    plasma membrane and releases its contents, principally von Willebrand factor and
    P-selectin, to the cell surface and the vessel lumen following secretagogue
    stimulation.
  proposed_parent:
    id: GO:0045055
    label: regulated exocytosis
  justification: >-
    This is a coverage inconsistency rather than a missing modelling pattern, which
    makes it cheap to fix. GO already has the cellular-component term GO:0033093
    Weibel-Palade body, whose own definition states that upon cell stimulation regulated
    exocytosis releases the contained proteins to the cell surface. GO also already
    models the equivalent cell-type-specific processes as verified is_a children of
    GO:0045055: GO:0002576 platelet degranulation, GO:0043299 leukocyte degranulation,
    GO:0016079 synaptic vesicle exocytosis and GO:0060471 cortical granule exocytosis.
    So no new precedent, mechanism or evidence standard is required - only the
    endothelial member of an existing pattern. Searches of GO for von Willebrand factor
    secretion and for Weibel-Palade body exocytosis return only the component term, so
    nothing currently lets a curator distinguish the endothelial secretagogue response
    from generic regulated exocytosis, and AGFG2 and SMAP1 are two genes that need it.
  supported_by:
  - reference_id: PMID:34369554
    supporting_text: These results suggest that AGFG2 plays an important role in the stimulation-dependent secretion of vWF.
  - reference_id: PMID:34369554
    supporting_text: In this study, we identified SMAP1 and AGFG2 as ArfGAPs that regulate vWF transport.

knowledge_gaps:
- gap_statement: >-
    No molecular function has been measured for AGFG2, or for any other member of the
    AGFG subfamily. The gene is named for an ArfGAP domain, and the domain is intact
    enough to be recognised by four InterPro signatures, but no GTPase-activating assay,
    Arf-binding assay or nucleotide-state-dependent pulldown has been reported for
    AGFG1, AGFG2 or Drosophila drongo.
  boundary: >-
    What is established is structural and negative-leaning: the four zinc-coordinating
    cysteines and the catalytic arginine Arg75 are present, while the aspartate that
    contacts the Arf catalytic glutamine is replaced by Thr89, a substitution shared by
    every AGFG protein examined and absent from every GAP-competent ArfGAP examined.
    That licenses the statement that the activity is predicted to be lost, not that it
    has been shown absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The whole subfamily's molecular-function annotation currently rests on one InterPro
    domain-to-activity mapping, so the gap is not local to AGFG2: it is the reason every
    reviewed member of PTHR46134 carries GO:0005096 with no experimental support anywhere.
  resolution: >-
    A single-turnover GTP hydrolysis assay on the recombinant AGFG2 ArfGAP domain against
    Arf1 and Arf6, with the ARFGAP1 domain as a positive control, would either confirm the
    InterPro-derived annotation or convert an entire subfamily from putative GAPs to
    putative Arf effectors. A nucleotide-state-dependent Arf-binding assay would
    discriminate the effector hypothesis from a wholly dead domain.
  provenance:
  - reference_id: PMID:23433073
    supporting_text: we speculate that lower GAP activity with retention of binding to activated GTPases is suggestive of effector functions
  - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
    supporting_text: An intact arginine licenses "untested", not "active"; a missing aspartate
- gap_statement: >-
    Whether AGFG2's role in stimulus-evoked von Willebrand factor secretion requires its
    ArfGAP domain at all is untested. The only experiment bearing on it compared
    overexpressed wild-type AGFG2 with the R75Q arginine mutant and found no detectable
    difference, but the result is reported as data not shown and tests only that one
    residue.
  boundary: >-
    The paper's authors state explicitly that whether the FG repeats or the ArfGAP
    domain matter for exocytosis remains to be addressed.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:34369554
    supporting_text: Whether FG repeat or ArfGAP domain of AGFG2 is important for exocytosis, should be addressed in the future.
- gap_statement: >-
    AGFG2's GO record contains no annotation derived from any of the five publications
    that study the human protein. Its only experimental row is a bulk membrane-proteome
    HDA shared with 1141 other gene products; all five of its IBA rows are copies of
    AGFG1's IBA rows, and its single molecular-function row is an InterPro mapping. It
    also has four protein interaction partners in IntAct with co-immunoprecipitation or
    pulldown support and zero GO:0005515 rows.
  gap_kind:
  - CURATION
  status: OPEN
  significance: >-
    This is under-curation rather than darkness: the literature contains loss- and
    gain-of-function experiments in primary human cells, and none of it has reached GOA.
  provenance:
  - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
    supporting_text: AGFG2's entire IBA record is its better-studied
- gap_statement: >-
    Whether AGFG2 has a role in CD4 traffic, or in receptor endocytosis generally, in
    the absence of HIV-1 proteins is unknown; every CD4 measurement was made in infected
    or Nef/Vpu-expressing cells.
  gap_kind:
  - BIOLOGY
