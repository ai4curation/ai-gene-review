  title: The eps15 homology (EH) domain-based interaction between eps15 and hrb connects the molecular machinery of endocytosis to that of nucleocytosolic transport.
  findings:
  - statement: Overexpressed Hrbl (AGFG2) increased Rev-dependent reporter activity by about 50%, the same as Hrb, and synergised with Eps15 or Eps15R to give a 3.0-3.5-fold increase; co-expression of Eps15 with either Hrb or Hrbl raised steady-state Rev levels four- to sixfold.
    supporting_text: A synergistic effect of coexpressing Eps15 or Eps15R with either Hrb or Hrbl, was readily observable (Fig.
  - statement: The colocalisation and subcellular-fractionation experiments in this paper were done on Hrb, not on Hrbl. The anti-Hrbl serum was used to confirm expression levels, so the punctate extranuclear structures shared with Eps15 are a result about AGFG1. This is why the paper's GO:0031410 EXP annotation sits on AGFG1 and not on AGFG2.
    supporting_text: We determined colocalization of Eps15 and Hrb by confocal microscopy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read in full around every sentence quoted. Titled for Hrb, but Hrbl is co-assayed throughout the functional experiments, which is exactly the pattern where a paper titled for a paralogue holds evidence about the gene under review. Care was taken to separate what was measured on Hrbl (Rev reporter, synergy, Rev levels) from what was measured only on Hrb (localisation, fractionation, the NPF-to-NPV mutant).
