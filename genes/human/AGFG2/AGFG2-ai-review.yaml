      Abstract-only in the cache, and the abstract is about H1T2 localisation. The mouse
      Agfg1 IMP attributed to it was made by an MGI curator with the full text, so per
      project policy it is not second-guessed; the review's objection is to the transfer
      to AGFG2, not to the mouse annotation. Marked UNVERIFIED because the Hrb content
      cannot be read from what is cached, not because anything is suspected wrong.
  full_text_unavailable: true
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings:
  - statement: >-
      A membrane-proteome survey of NK cells. Queried by reference and fully paginated,
      it carries 1142 annotations over 1142 distinct gene products, all to GO:0016020,
      all HDA, all assigned by UniProt - one identical term per entity, which is the
      signature of a bulk import rather than of 1142 localisation determinations.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The citation is correct and the measurement is real; the limitation is what a
      subtractive membrane fraction can establish for a protein with no
      membrane-anchoring feature. Entity count derived as a distinct set of gene-product
      ids, not from the annotation total, with a non-zero positive control on the same
      endpoint.
- id: PMID:21284487
  title: 'Organization patterns of the AGFG genes: an evolutionary study.'
  findings:
  - statement: >-
      Reports that AGFG2 arose by duplication of AGFG1 and states it is present in
      mammals only. The duplication claim is corroborated by the phylogenetic analysis in
      PMID:23433073; the mammals-only claim is not, and appears to be an artefact of
      analysing only the first section of the coding mRNAs.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Cited by the affinage record as the source of a mammals-only claim. That claim is
      contradicted by PMID:23433073, which places the AGFG duplication among the
      subfamilies that duplicated at the base of vertebrates, and by a UniProt symbol
      census that finds agfg2 in 72 ray-finned fish (Actinopterygii), 23 sauropsids and 4
      amphibians, with a non-zero agfg1 control in every clade. Aves is a subset of
      Sauropsida rather than a separate tally, and within it the asymmetry is striking: 1
      avian agfg2 against 363 avian agfg1. A symbol census is a name-matching pipeline's
      output rather than an orthologue count, so it would not settle this alone; combined
      with the phylogenetic result it is enough.
      Consistently, the PANTHER node that reaches AGFG2 also reaches lamprey, hagfish
      and zebrafish. Marked LOW_QUALITY rather than MISCITED: the paper says what it is
      cited as saying, but its method cannot support the conclusion.
  full_text_unavailable: true
- id: PMID:23433073
  title: 'Ancient complexity, opisthokont plasticity, and discovery of the 11th subfamily
    of Arf GAP proteins.'
  findings:
  - statement: >-
      Identifies the aspartate that contacts the Arf catalytic glutamine, essential for
      hydrolysis, as absent from 38 of 40 AGFG sequences, and predicts on that basis that
      the AGFG subfamily has lost substantial GAP activity while possibly retaining Arf
      binding, i.e. that AGFG proteins may be effectors rather than GAPs.
    supporting_text: Only two of the 40 AGFG sequences contain an aspartate at the position homologous to D47 in the other subfamilies (D484 in ASAP3 structure)
  - statement: >-
      Notes that the catalytic arginine, although highly conserved across Arf GAPs, fell
      just short of the study's conservation cut-off in AGFG, and that nine of the forty
      AGFG sequences lack it altogether. Human AGFG2 is not among those nine: it retains
      the arginine at position 75.
    supporting_text: nine of the 40 AGFG sequences lack the catalytic arginine and would be expected to be incapable of supporting robust GTP hydrolysis, even if binding to Arf is conserved.
  - statement: >-
      Independently establishes that AGFG is one of four Arf GAP subfamilies that
      underwent a single duplication producing two paralogues, which is the phylogenetic
      basis for treating AGFG1 and AGFG2 as paralogues rather than assuming it from the
      shared name.
    supporting_text: 'four of the subfamilies (SMAP (Figure S3G), ArfGAP2/3 (Figure S3H), AGFG (Figure S3I) and GIT (Figure 5B)) have each undergone a single duplication resulting in two paralogs'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read around each quotation. This is the reference that
      makes the GO:0005096 verdict a measurement rather than an assertion: it names a
      specific residue and a specific control protein (ASAP3 D484), which is what allowed
      the claim to be tested independently for human AGFG2. It is a prediction, not an
      assay, and the review says so; it is also the source of the effector hypothesis
      recorded under knowledge_gaps.
- id: PMID:25496667
  title: Genome-wide shRNA screening identifies host factors involved in early endocytic
    events for HIV-1-induced CD4 down-regulation.
  findings:
  - statement: >-
      AGFG2 (HRBL) is one of seven validated hits whose knockdown significantly rescues
      CD4 surface expression in HIV-1-infected SupT1 cells, confirmed in a second cell
      background and with Nef expressed alone. Its knockdown did not significantly affect
      HIV-1 replication.
    supporting_text: Remarkably, only cells knocked down for HRBL, EPS15 and HSP90B1 were found to significantly express higher CD4 surface levels than the non-targeting shRNA control cells.
  - statement: >-
      The authors describe AGFG2 as poorly characterised and note that the transferrin
      endocytosis result they cite belongs to the paralogue HRB, not to HRBL - a
      distinction worth preserving, since it is the kind of attribution that migrates
      between paralogues.
    supporting_text: HRBL is a poorly characterized protein, but shares similarity with another Rev binding protein, HRB (HIV Rev Binding protein), which is able to affect endocytosis of transferrin in an EPS15-dependent manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Primary human-cell shRNA evidence for AGFG2 that
      has produced no annotation in GOA. Note that the affinage record's table row for
      the companion paper PMID:26701340 states AGFG2 knockdown raises CD4 in
      Vpu-expressing but not Nef-expressing cells; that is contradicted both by this
      paper's Nef-specific result and by the companion abstract's own dual-role
      conclusion, so the affinage row was not used.
- id: PMID:26701340
  title: The human immunodeficiency virus (HIV) Rev-binding protein (HRB) is a co-factor
    for HIV-1 Nef-mediated CD4 downregulation.
  findings:
  - statement: >-
      Knockdown of HRBL (AGFG2), but not of EPS15, significantly raises CD4 levels in
      Vpu-expressing cells, so AGFG2 acts as a cofactor for both Nef- and Vpu-mediated
      CD4 downregulation, whereas AGFG1/HRB supports only the Nef route. This is the
      sharpest published functional distinction between the two paralogues.
    supporting_text: These results identify HRB as a previously unknown co-factor for
      HIV-1 Nef-mediated CD4 downregulation and highlight differences with the related
      protein HRBL, which affects the CD4 downregulation in a dual role as co-factor of
      both HIV-1 Nef and Vpu.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache, and only the abstract is relied on. Titled for HRB
      (AGFG1) while carrying the decisive AGFG2 result, which is why a symbol-keyed
      search would not surface it. The affinage record's rendering of this paper - that
      AGFG2 knockdown raises CD4 in Vpu- but not Nef-expressing cells - misstates the
      abstract, which concludes a dual role in both; the affinage narrative section
      states it correctly, so the provider's own two summaries disagree.
  full_text_unavailable: true
- id: PMID:27654348
  title: The temporally controlled expression of Drongo, the fruit fly homolog of AGFG1,
    is achieved in female germline cells via P-bodies and its localization requires functional
    Rab11.
  findings:
  - statement: >-
      The FlyBase reference behind the GO:0005737 IDA and GO:0005938 IDA on Drosophila
      drongo, which is one of the four WITH/FROM tokens on AGFG2's cytoplasm row and the
      only donor on that row with its own direct experimental annotation to cytoplasm.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited only to identify the donor evidence on the cytoplasm row; the drongo
      annotations were read from QuickGO, not from this paper. Abstract-only in the cache
      and nothing beyond the annotation attribution is claimed. Note that FB:FBgn0020304
      resolves to seven UniProt entries, none reviewed, so the curated GO evidence is
      real but the entry name has no Swiss-Prot authority.
  full_text_unavailable: true
- id: PMID:34369554
  title: Arf GTPase-activating proteins SMAP1 and AGFG2 regulate the size of Weibel-Palade
    bodies and exocytosis of von Willebrand factor.
  findings:
  - statement: >-
      siRNA depletion of AGFG2 in HUVECs halves PMA-stimulated and significantly reduces
      histamine-stimulated von Willebrand factor secretion, while unstimulated secretion
      is unchanged; overexpression of siRNA-resistant AGFG2 rescues the knockdown and
      drives granule release even without a secretagogue. This is the strongest evidence
      of function for this gene and it has produced no GO annotation.
    supporting_text: These results suggest that AGFG2 plays an important role in the stimulation-dependent secretion of vWF.
  - statement: >-
      The defect is specific to the fusion step: vWF colocalisation with Rab27a and
      TGN46, multimerisation and propeptide cleavage are essentially unaffected in
      AGFG2-depleted cells, so granule biogenesis and cargo maturation are not the block.
    supporting_text: Overall, these results indicate that vWF transport to WPBs is not highly perturbed in SMAP1KD and AGFG2KD cells.
  - statement: >-
      States that human AGFG2 conserves the ArfGAP consensus CX2CX16CX2CX4R, which pins
      the catalytic arginine at residue 75 and is corroborated by the paper's own
      AGFG2[R75Q] GAP-dead construct.
    supporting_text: AGFG proteins were reported to lose important amino acids in ArfGAP domain (Schlacht et al., 2013), but human AGFG2 conserves ArfGAP consensus sequence CX2CX16CX2CX4R in ArfGAP domain.
  - statement: >-
      Reports that the R75Q mutant still induced vWF secretion with no detected
      difference from wild type, but as data not shown. This tests whether that one
      residue is required for that one function; it is not a measurement of GAP activity,
      and the authors state that the contributions of the FG repeats and the ArfGAP
      domain remain to be addressed.
    supporting_text: AGFG2[R75Q] expression also induced secretion of vWF and we have not detected the specific effects of AGFG2[R75Q] expression compared with that of wild-type AGFG2 so far (data not shown).
  - statement: >-
      Notes that AGFG2 is most highly expressed in salivary gland, which is consistent
      with a general role in regulated secretion and inconsistent with the
      testis-specific processes it inherits by IBA from its paralogue.
    supporting_text: According to the NCBI Gene database, AGFG2 is highly expressed in salivary gland (Fagerberg et al., 2014).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read in full. This paper decides the review, and the
      affinage record does not cite it despite gates_passed being true - a clean
      demonstration that a passing gate bounds precision and says nothing about recall.
      It was found by a PubMed query on ArfGAP activity terms crossed with the gene
      synonyms, not by the symbol alone.
