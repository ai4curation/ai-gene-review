- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0020304
  - MGI:MGI:1333754
  - PANTHER:PTN002353603
  - UniProtKB:P52594
  review:
    summary: >-
      Kept, but as the redundant parent rather than the informative location. AGFG2 is a
      cytoplasmic protein and the donor set supports that, but GO:0031410 cytoplasmic
      vesicle is annotated on the same gene from the same PAINT reference and is a
      verified descendant of this term, so cytoplasm adds no information beyond it.
    action: KEEP_AS_NON_CORE
    reason: >-
      The propagation is sound. Of the three protein donors, Drosophila drongo carries
      its own IDA to GO:0005737 (PMID:27654348), and mouse Agfg1 and human AGFG1 carry
      experimental annotations to the descendant GO:0031410, so cytoplasm is the least
      common ancestor of what the donors actually show and is not a curator failing to
      be specific. It is also independently consistent with AGFG2's own experimental
      biology, since the endothelial exocytosis work is done on a cytosol-facing protein
      with no membrane-anchoring feature in its sequence. It is marked non-core only
      because GO:0031410, on the same evidence, is strictly more informative; the
      ancestry was verified against QuickGO rather than assumed.
    supported_by:
    - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
      supporting_text: "`GO:0031410` is a verified descendant of `GO:0005737`, so the two location rows are"
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: FB:FBgn0020304
        source_label: Drosophila melanogaster drongo (E1JHR0, TrEMBL; 7 UniProt entries, 0 reviewed)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Carries its own GO:0005737 IDA from PMID:27654348. Reported as unreviewed: the
          FlyBase gene id resolves to seven UniProt entries, none of them Swiss-Prot, so
          the curated GO evidence is real but the entry name carries no Swiss-Prot
          authority.
      - source_id: MGI:MGI:1333754
        source_label: Mus musculus Agfg1 (Q8K2K6, Swiss-Prot; 5 UniProt entries, 1 reviewed)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The mouse orthologue of the paralogue AGFG1, not of AGFG2. For a generic
          subcellular compartment that is an acceptable transfer across a 48%-identical
          protein with the same architecture; for the spermatid phenotypes on the other
          rows it is not, which is why the same donor is scored differently there. Its
          own experimental evidence is a GO:0031410 IDA (PMID:11711676), i.e. a
          descendant of this term.
      - source_id: PANTHER:PTN002353603
        source_label: PANTHER tree node (not a protein)
        source_status: NOT_RELEVANT
        comment: >-
