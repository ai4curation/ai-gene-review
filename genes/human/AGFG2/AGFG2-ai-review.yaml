description: AGFG2 (HRBL) is a human vesicle-trafficking protein with an N-terminal ArfGAP-type zinc-finger domain and a long C-terminal region containing FG repeats and four NPF motifs. In endothelial cells it promotes stimulus-evoked release of von Willebrand factor from Weibel-Palade bodies. Depletion reduces stimulated secretion, whereas overexpression promotes granule release; the precise molecular effector step remains unresolved. Inferred additional roles include acrosome assembly, spermatid nuclear differentiation and intermediate filament organization. AGFG2 acts as a host cofactor for HIV-1 Nef- and Vpu-mediated CD4 downregulation and enhances a Rev-dependent reporter in cooperation with Eps15/Eps15R. It retains the ArfGAP arginine finger at Arg75 but has Thr89 at a site occupied by an Arf-contacting aspartate in ASAP3. Whether this domain has physiologically relevant GTPase-activating activity remains unresolved.
