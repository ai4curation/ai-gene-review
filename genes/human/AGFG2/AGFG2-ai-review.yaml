- term:
    id: GO:0001675
    label: acrosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1333754
  - PANTHER:PTN002919572
  review:
    summary: >-
      Over-annotated on AGFG2. The sole experimental basis anywhere in the chain is the
      mouse Hrb (Agfg1) knockout, i.e. the mouse orthologue of AGFG2's paralogue. Mouse
      Agfg2 exists, is Swiss-Prot reviewed, sits in the same PANTHER subfamily as human
      AGFG2, and is not used as a seed. Nothing in the AGFG2 literature concerns
      acrosome biology.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor annotation is sound and is not in question: mouse Agfg1 carries two IMP
      rows to this term (PMID:11711676, PMID:14724135) from a null mutant whose
      spermatids form proacrosomal vesicles that fail to fuse. The problem is the
      transfer. The only protein donor is mouse Agfg1 at 46.5% full-length identity to
      human AGFG2, while human AGFG2's own mouse orthologue, Agfg2 (Q80WC7), is 83.2%
      identical, is in the same PANTHER subfamily PTHR46134:SF4, and appears in none of
      AGFG2's WITH/FROM fields; that unused orthologue is the negative control which
      makes this a paralogue transfer rather than an ordinary family inference. The
      transfer is also a context mismatch: AGFG2 is enriched in salivary gland, not
      testis, and a PubMed query for AGFG2 or HRBL together with acrosome, acrosomal,
      spermatid, spermatogenesis, sperm or testis returns no hits, against nine hits for
      the same query on AGFG1/Hrb as a positive control. Kept rather than removed
      because the term is unmeasured on AGFG2, not contradicted: no experiment has asked
      whether AGFG2 participates in acrosome formation, and the two paralogues do share
      a vesicle-docking-and-fusion function in general terms.
    supported_by:
    - reference_id: PMID:11711676
      supporting_text: Although proacrosomic vesicles form in spermatids that lack Hrb,
        the vesicles are unable to fuse, blocking acrosome development at step 2.
    - reference_id: PMID:34369554
      supporting_text: According to the NCBI Gene database, AGFG2 is highly expressed in salivary gland (Fagerberg et al., 2014).
    - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
      supporting_text: "| AGFG2/HRBL **and** acrosome / acrosomal / spermatid / spermatogenesis / sperm / testis | **0** |"
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1333754
        source_label: Mus musculus Agfg1 (Q8K2K6, Swiss-Prot; 5 UniProt entries, 1 reviewed)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Confirmed by lookup to be the mouse orthologue of AGFG1, a paralogue of the
          target, and the confirmation is what makes the objection strong rather than
          weak. Its two IMP rows are solid evidence about mouse Agfg1 and say nothing
          about AGFG2.
      - source_id: PANTHER:PTN002919572
        source_label: PANTHER tree node (not a protein)
        source_status: NOT_RELEVANT
        comment: >-
          A PANTHER tree node, not a protein. Worth recording what it reaches: 68 gene
          products spanning sea lamprey and hagfish through cartilaginous and ray-finned
          fish, coelacanth, amphibians, reptiles, birds, monotremes, marsupials and
          placental mammals, plus one non-vertebrate outlier (the tardigrade Hypsibius
          exemplaris). One mouse knockout is therefore the sole experimental basis for
          this term across the whole vertebrate range.

