- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001164
  review:
    summary: >-
      Over-annotated. The ArfGAP domain is genuine and structurally intact, including
      the catalytic arginine (Arg75), but AGFG2 lacks the aspartate that contacts the
      Arf catalytic glutamine - a loss shared by every AGFG protein tested and absent
      from every GAP-competent ArfGAP tested - and no GTPase-activating activity has
      been reported for any member of the subfamily.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Testing only the catalytic arginine would give the opposite conclusion, so both
      residues the field identifies as required were measured. PMID:34369554 states that
      human AGFG2 conserves the ArfGAP consensus CX2CX16CX2CX4R, and an independent
      derivation from that motif places the arginine at 75, matching the AGFG2[R75Q]
      GAP-dead mutant that paper constructed. But PMID:23433073 identifies a second
      residue, the aspartate contacting the Arf glutamine essential for hydrolysis, and
      reports that only two of forty AGFG sequences retain it; transferring ASAP3 D484
      by alignment shows human AGFG2 has Thr89 there. The panel discriminates cleanly:
      all five AGFG proteins tested (human and mouse AGFG1 and AGFG2, Drosophila
      drongo) lack the aspartate and all four GAP-competent ArfGAPs tested (ARFGAP1,
      ASAP1, ASAP3, SMAP1) have it - including SMAP1, the other hit from the same siRNA
      screen as AGFG2, which is the strongest internal control. PMID:23433073 concludes
      that the subfamily is predicted to have lost substantial GAP activity and suggests
      AGFG proteins are Arf effectors rather than GAPs. The annotation route is also
      specific and filable: of AGFG2's four InterPro signatures, only IPR001164, the
      pan-ArfGAP catalytic-domain entry spanning 60678 proteins, maps to GO:0005096,
      while the AGFG-specific family entry IPR052248 and both superfamily entries map to
      nothing - so InterPro2GO is capable of restraint here and the claim comes from the
      one entry that cannot discriminate subfamilies. All 6 reviewed members of
      PTHR46134 carry this term by the same IEA route and none has experimental evidence
      for it. Not removed, and deliberately so: the activity is unmeasured rather than
      measured and absent, the zinc finger and catalytic arginine are intact, and
      PMID:23433073's own statement is a prediction. The one functional test bearing on
      it - that AGFG2[R75Q] still induced von Willebrand factor secretion - is reported
      as data not shown and addresses whether the arginine is required for that
      particular function, not whether the protein has GAP activity. GO:0005096 is also
      already maximal: GO:0008060 ARF GTPase activator activity is one of its secondary
      ids, so there is no substrate-specific child to MODIFY toward.
    supported_by:
    - reference_id: PMID:34369554
      supporting_text: AGFG proteins were reported to lose important amino acids in ArfGAP domain (Schlacht et al., 2013), but human AGFG2 conserves ArfGAP consensus sequence CX2CX16CX2CX4R in ArfGAP domain.
    - reference_id: PMID:34369554
      supporting_text: AGFG2[R75Q] expression also induced secretion of vWF and we have not detected the specific effects of AGFG2[R75Q] expression compared with that of wild-type AGFG2 so far (data not shown).
    - reference_id: PMID:23433073
      supporting_text: Only two of the 40 AGFG sequences contain an aspartate at the position homologous to D47 in the other subfamilies (D484 in ASAP3 structure)
    - reference_id: PMID:23433073
      supporting_text: the ArfGAP is a very highly conserved structural domain that is predicted to have lost substantial levels of GAP activity in at least one subfamily (AGFG)
    - reference_id: PMID:23433073
      supporting_text: we speculate that lower GAP activity with retention of binding to activated GTPases is suggestive of effector functions
    - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
      supporting_text: "| O95081 | human AGFG2 | AGFG | **R75 present** | **Thr89 — absent** |"
    - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
      supporting_text: "| **IPR001164 Arf GTPase activating protein** | domain | 60 678 | **GO:0005096 (F)** |"
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR001164
        source_label: InterPro signature (not a protein)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          An InterPro domain signature, not a protein, so it carries no evidence of its
          own. Its GO:0005096 mapping is appropriate for the ArfGAP subfamilies that
          retain the Arf-contacting aspartate and is unsafe for the AGFG subfamily,
          which does not. Reported as the specific entry supplying the term: AGFG2's
          three other InterPro matches, including the AGFG-specific family entry
          IPR052248, map to no GO term at all.

- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: >-
      Kept as a non-core, uninformative location. AGFG2 does act at membranes as a
      peripheral protein, but this particular row is one NK-cell membrane-proteome
      survey that gives 1142 distinct gene products the same single term, so it records
      detection in a membrane fraction rather than a determined localisation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is true of AGFG2 and the row is kept for that reason; what is weak is the
      evidence, not the assignment. AGFG2's feature table has no transmembrane segment,
      no signal peptide and no lipid-anchor site, so it cannot be an integral membrane
      component - but a protein that drives the fusion of secretory granules with the
      plasma membrane is a peripheral membrane protein, and GO:0016020 is defined as a
      lipid bilayer together with the proteins embedded in it *and attached to it*, which
      admits peripheral association. That is why this is KEEP_AS_NON_CORE and not
      MARK_AS_OVER_ANNOTATED: the term is not an over-reach, it is simply the least
      informative thing that can be said, and the gene's own experimental work implies it
      independently of this row. What the row cannot do is *determine* a location. Fully
      paginated, PMID:19946888 carries 1142 annotations over 1142 distinct gene products,
      every one GO:0016020, every one HDA, every one assigned by UniProt - one identical
      term per entity, with the entity count derived as a distinct set of gene-product
      ids rather than read off the annotation total, and with a non-zero positive control
      on the same endpoint so the breadth is measured rather than assumed. A subtractive
      membrane fraction of NK cells locates nothing in particular. So the row is retained
      as a true but uninformative parent, it is not read as evidence for where AGFG2 sits,
      and it does not enter the core locations, which are carried by GO:0031410 instead.
      A reviewer could reasonably read the bulk-import argument as grounds for
      MARK_AS_OVER_ANNOTATED; the reason it does not land there is that the objection is
      to the evidence rather than to the term, and no better-evidenced membrane term is
      available to move to.
    supported_by:
    - reference_id: file:human/AGFG2/AGFG2-bioinformatics/RESULTS.md
      supporting_text: "**1142 annotations over 1142 distinct gene products, every one `GO:0016020`, every one"

- term:
    id: GO:0045055
    label: regulated exocytosis
  evidence_type: IMP
  original_reference_id: PMID:34369554
  qualifier: involved_in
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P04275
      label: VWF
  review:
    summary: >-
      Proposed as a new annotation, and the best-supported statement about this gene.
      siRNA depletion of AGFG2 in human umbilical vein endothelial cells halves
      PMA-stimulated and significantly reduces histamine-stimulated von Willebrand
      factor secretion while leaving unstimulated secretion unchanged, and
      overexpression of an siRNA-resistant AGFG2 both rescues the knockdown and drives
      granule release without a secretagogue.
    action: NEW
    reason: >-
      This row is absent from GOA entirely, although the paper is titled for AGFG2. The
      evidence is loss of function plus gain of function in the same primary human cell
      type, with the off-target control done by siRNA-resistant re-expression, two
      independent secretagogues, and ELISA quantification of the secreted cargo. It
      shows requirement rather than mere sufficiency: knockdown reduces the response. The
      specificity of the defect matters as much as its size - vWF colocalisation with
      Rab27a and TGN46, multimerisation and propeptide cleavage were all essentially
      unaffected, so the block is at the stimulus-evoked fusion step rather than in
      granule biogenesis or cargo maturation. GO:0045055 regulated exocytosis is the
      most specific applicable term: GO has no term for Weibel-Palade body exocytosis or
      von Willebrand factor secretion, which is filed under proposed_new_terms, so the
      organelle-specific detail is carried here by the has_input extension on the cargo
      and in the reason rather than by a narrower term.
    supported_by:
    - reference_id: PMID:34369554
      supporting_text: In contrast, PMA-stimulated secretion was halved in AGFG2 KD cells (control 74.5%; AGFG2KD 37.6%, P<0.01).
    - reference_id: PMID:34369554
      supporting_text: In AGFG2KD cells, histamine-stimulated secretion of vWF was decreased (control 48.3%; AGFG2KD 35.1%, P<0.01).
    - reference_id: PMID:34369554
      supporting_text: The secretion without histamine was not significantly changed (control 22.7%; AGFG2KD 24.2%, P=0.86).
    - reference_id: PMID:34369554
      supporting_text: These results indicate that AGFG2 overexpression promotes vWF secretion and overcomes the AGFG2KD phenotype.
    - reference_id: PMID:34369554
