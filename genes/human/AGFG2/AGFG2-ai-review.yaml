    supporting_text: The finding that both EPS15 and HRBL mediate CD4 down-regulation in a Nef-specific manner makes these two genes especially intriguing for further mechanistic investigation.
- gap_statement: >-
    The oldest functional result on human AGFG2 - that it enhances Rev-dependent nuclear
    export of RRE-containing transcripts and synergises with EPS15/EPS15R in doing so -
