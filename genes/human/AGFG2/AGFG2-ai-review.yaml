suggested_questions:
- question: Does AGFG2 exhibit physiologically relevant GTPase-activating activity, and with which ARF substrate, membrane context or cofactors? Resolve R75 retention and T89 substitution against the catalytically active GIT counterexample; the R75Q secretion phenotype does not measure GAP activity.
  experts:
  - ArfGAP biochemists
  - InterPro curators
- question: Which germ-cell trafficking and cytoskeletal steps implement the inherited AGFG2 capacities? The positive ancestral placement is verified; target-specific experiments would resolve mechanism rather than justify discarding the inference.
  experts:
  - PAINT curators
  - germ-cell biologists
- question: Does a more precise host-cofactor term cover viral receptor downregulation, and would a dedicated Weibel-Palade-body exocytosis term add useful detail to the existing process and cargo representation?
  experts:
  - GO Central
- question: Can UniProt incorporate the direct endothelial secretion and HIV cofactor studies while distinguishing target experiments from paralog-specific binding/localization assays?
  experts:
  - UniProt curators
suggested_experiments:
- description: Measure purified AGFG2-dependent GTP hydrolysis for ARF substrates with appropriate lipids and cofactors, comparing wild type, R75Q and T89D with active ARFGAP1, ASAP3 and GIT proteins. Validate each mutant biochemically rather than naming it inactive from the secretion phenotype.
  hypothesis: AGFG2 may retain altered or conditional GAP activity despite divergence at the ASAP3 Asp site; a noncatalytic effector role is an alternative.
  experiment_type: biochemical assay
- description: Image endogenous AGFG2 during stimulated Weibel-Palade body release and test domain/NPF mutants in perturbation-rescue assays with secretion and granule maturation measured separately.
  hypothesis: AGFG2 contributes a late trafficking step through specific protein interactions that need not depend on GAP catalysis.
  experiment_type: structure-function mapping
- description: Test target-specific germ-cell localization and perturbation phenotypes for AGFG2, including acrosomal vesicle traffic, keratin distribution and nuclear shaping.
  hypothesis: The inherited PAINT capacities are implemented by conserved germ-cell trafficking machinery.
  experiment_type: loss of function
