- id: PMID:21284487
  title: 'Organization patterns of the AGFG genes: an evolutionary study.'
  findings:
  - statement: Reports that AGFG2 arose by duplication of AGFG1 and states it is present in mammals only. The duplication claim is corroborated by the phylogenetic analysis in PMID:23433073; the mammals-only claim is not, and appears to be an artefact of analysing only the first section of the coding mRNAs.
