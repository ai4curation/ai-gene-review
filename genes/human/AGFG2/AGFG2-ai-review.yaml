    would make AGFG2 its only human holder.
  boundary: >-
    What the paper does establish is a measured, dose-controlled effect on a Rev-dependent
    reporter, replicated for both paralogues and abolished by disrupting the EH-binding
    NPF motifs of AGFG1. The gap is between that and a GO statement about AGFG2, not in
