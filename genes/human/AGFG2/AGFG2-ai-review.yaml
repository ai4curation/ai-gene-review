id: O95081
gene_symbol: AGFG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
aliases:
- HRBL
- RABR
- RAB-R
- HIV-1 Rev-binding protein-like protein
description: >-
  AGFG2 (also called HRBL or RAB-R) is a 481-residue cytoplasmic protein built from an
  N-terminal ArfGAP-type C4 zinc-finger domain (residues 27-153) followed by a long,
  largely disordered C-terminal region carrying FG repeats and four Asn-Pro-Phe (NPF)
  motifs. It is the vertebrate paralogue of AGFG1/HRB, sharing the same domain
  architecture and about 48% overall sequence identity with it. In human umbilical vein
  endothelial cells AGFG2 is required for stimulus-evoked exocytosis of Weibel-Palade
  bodies: depletion halves von Willebrand factor release triggered by phorbol ester and
  reduces the histamine-triggered response, while leaving unstimulated release, granule
  maturation and von Willebrand factor multimerisation essentially intact, and
  overexpression drives granule release even without a secretagogue. Consistent with a
  role in the late steps of regulated secretion, the protein is most abundant in
  secretory tissue, being enriched in salivary gland. AGFG2 also acts as a host cofactor
  in HIV-1 biology: shRNA knockdown raises CD4 levels at the surface of infected T
  cells, and the protein is required for CD4 removal driven by both the viral Nef and
  Vpu proteins; separately, overexpressed AGFG2 augments Rev-dependent nuclear export of
  Rev-responsive-element-containing viral transcripts and synergises with the EH-domain
  endocytic adaptors EPS15 and EPS15R in that assay. Its NPF motifs are the presumed
  basis of EH-domain binding, linking the protein to the clathrin-mediated endocytic
  machinery. Despite the ArfGAP domain in its name, no GTPase-activating activity has
  been reported for AGFG2 or for any other member of the AGFG subfamily: the domain
  retains its four zinc-coordinating cysteines and the catalytic arginine (Arg75) but
  lacks the aspartate that contacts the Arf catalytic glutamine, a loss shared across
  the subfamily, and substituting Arg75 does not detectably impair the protein's role in
  von Willebrand factor secretion.
