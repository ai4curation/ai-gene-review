- term:
    id: GO:0045109
    label: intermediate filament organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1333754
  - PANTHER:PTN002919572
  review:
    summary: >-
      The weakest of the three developmental transfers, and over-annotated on AGFG2. Its
      single donor row records that the acroplaxome of Hrb-null mouse spermatids is
      deficient in keratin 5 - a downstream structural consequence of the acrosome
      defect in one cell type, not a demonstration that any AGFG protein organises
      intermediate filaments.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0045109 is defined as control of the spatial distribution of intermediate
      filaments, including organising them into meshworks, bundles or other structures,
      so it makes a genuine cytoskeletal-organisation claim; the definition was fetched
      from QuickGO rather than inferred from the label. What PMID:14724135 reports is
      that the acroplaxome, an F-actin/keratin-5 cytoskeletal plate, still forms in the
      mutant but is keratin-5 deficient, which the authors interpret as a consequence of
      failed proacrosomal vesicle fusion. Even on mouse Agfg1 this is a secondary
      phenotype; propagated to AGFG2 it adds the same paralogue substitution and tissue
      mismatch as the other two rows, and a PubMed query for AGFG2 or HRBL with keratin,
      intermediate filament, vimentin or manchette returns no hits.
    supported_by:
