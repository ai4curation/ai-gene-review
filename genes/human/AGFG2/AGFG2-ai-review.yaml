suggested_questions:
- question: >-
    PANTHER node PTN002919572 has a human reach of exactly AGFG1 and AGFG2, and it
    donates GO:0001675 acrosome assembly, GO:0007289 spermatid nucleus differentiation
    and GO:0045109 intermediate filament organization to 68 gene products spanning
    lamprey and hagfish through placental mammals. The sole experimental basis for all
    three is the mouse Hrb (Agfg1) knockout. Mouse Agfg2 exists as a reviewed entry in
    the same PANTHER subfamily as human AGFG2 (PTHR46134:SF4), carries no experimental
    evidence, and is not used as a seed. Should these three terms be attached to an
    AGFG1-orthologue node (PTHR46134:SF1) rather than to the family node? Doing so would
    retract them from AGFG2 in both human and mouse in one edit, and would leave the
    location terms - which the donors support directly and which AGFG2's own data
    corroborate - untouched. Stated once here for both affected genes.
  experts:
  - PAINT curators
  - GO Central
- question: >-
    Of the four InterPro entries human AGFG2 matches, only IPR001164 (Arf GTPase
    activating protein, a domain entry spanning 60678 proteins) maps to GO:0005096; the
    AGFG-specific family entry IPR052248 and both relevant superfamily entries map to no
    GO term. PMID:23433073 reports that only two of forty AGFG sequences retain the
    aspartate that contacts the Arf catalytic glutamine, and predicts the subfamily has
    lost substantial GAP activity; we confirm the substitution in human and mouse AGFG1
    and AGFG2 and in Drosophila drongo, against its retention in ARFGAP1, ASAP1, ASAP3
    and SMAP1. Should IPR001164's GO:0005096 mapping be qualified so that it does not
    reach the AGFG subfamily, or should IPR052248 instead carry the subfamily's
    characterisation? All six reviewed PTHR46134 members currently hold GO:0005096 with
    no experimental support anywhere.
  experts:
  - InterPro curators
  - GO Central
- question: >-
    Three points on UniProt entry O95081. First, the entry has no FUNCTION comment at
    all, although PMID:34369554 reports siRNA and rescue experiments on von Willebrand
    factor exocytosis in HUVECs and PMID:25496667 and PMID:26701340 report shRNA
    experiments on HIV-1-mediated CD4 downregulation. Second, the SUBUNIT line reads
    "Interacts with EPS15R" with evidence ECO:0000250, i.e. by similarity, whereas
    PMID:10613896 states in its own text that the EH-containing proteins interact with
    Hrbl, citing Salcini et al. 1997 (PMID:9303539) and Yamabhai et al. 1998; we could
    not read either of those in full, so this is offered as a lead to check rather than a
    correction we can substantiate. Third, the keyword-derived row for GO:0008270 zinc
    ion binding (IEA:UniProtKB-KW) remains in the entry although GOA no longer imports
    keyword annotations, and no zinc-binding measurement has been reported for any AGFG
    protein; the C4 finger is a PROSITE-ProRule prediction.
  experts:
  - UniProt curators
- question: >-
    Is GO:0044794 host-mediated activation of viral process the right home for a host
    factor required for virus-driven downregulation of a host cell-surface receptor? Its
    only two children cover viral genome replication and viral transcription, so there is
    currently nothing between the parent and those two for the large class of host
    factors co-opted for immune evasion and receptor removal. Note that the nearest
    already-curated case makes this a consistency question rather than a bare request:
    the *viral* side of the same biology is modelled, since HIV-1 Nef (UniProtKB:P04601)
    carries GO:0046776 symbiont-mediated suppression of host antigen processing and
    presentation of peptide antigen via MHC class I. There is no CD4 counterpart on the
    viral side and no host-side child at all, so the host factors for a process GO
    already models from the virus's point of view have nowhere specific to go.
  experts:
  - GO Central
- question: >-
    AGFG1 and AGFG2 carry the identical set of five IBA rows from the same PAINT
    reference, but their evidential status differs: on AGFG1 they are an orthologue
    transfer from mouse Agfg1, on AGFG2 a paralogue transfer. The two reviews should
    therefore be expected to diverge on the three developmental rows and to agree on the
    two location rows, and if they do not, the divergence should be explained rather than
    left implicit.
  experts:
  - AGFG1 reviewer

suggested_experiments:
- description: >-
    Measure Arf GAP activity of the recombinant AGFG2 ArfGAP domain on Arf1 and Arf6 in
    a single-turnover GTP hydrolysis assay, with the ARFGAP1 domain as a positive control
    and the AGFG2 R75Q mutant as a negative control. Then test whether restoring the
    missing Arf-contacting aspartate (T89D) confers activity.
  hypothesis: >-
    AGFG2 has little or no Arf GAP activity because it lacks the aspartate that contacts
    the Arf catalytic glutamine, and restoring that aspartate will confer measurable
    activity.
  experiment_type: biochemical assay
- description: >-
    Test nucleotide-state-dependent Arf binding by the AGFG2 ArfGAP domain, by pulldown
    or by isothermal titration calorimetry with Arf1 loaded with GTP-gamma-S versus GDP.
  hypothesis: >-
    AGFG proteins are Arf effectors rather than GAPs, so the domain will bind the active
    GTPase with little or no hydrolysis - a different result from either a functional GAP
    or a dead domain.
  experiment_type: binding assay
- description: >-
    Localise endogenous AGFG2 in HUVECs relative to Weibel-Palade body markers, using
    von Willebrand factor, P-selectin and Rab27a, before and during PMA-stimulated
    release.
  hypothesis: >-
    AGFG2 is recruited to Weibel-Palade bodies or to the plasma membrane at the point of
    stimulated fusion. The published work quantified secretion and granule morphology but
    did not report where AGFG2 itself sits, so there is currently no basis for any AGFG2
    localisation annotation more specific than cytoplasmic vesicle.
  experiment_type: imaging
- description: >-
    Determine which module of AGFG2 is required for stimulated secretion, by rescuing
    knockdown with an NPF-to-NPV mutant, an ArfGAP-domain deletion, and the R75Q point
    mutant with the data shown. The NPF-to-NPV substitution has already been validated
    for the paralogue in PMID:10613896, where it abolished both EPS15 binding and the
    Rev-export synergy, so the reagent design is established.
  hypothesis: >-
    The NPF motifs, not the ArfGAP domain, carry the exocytosis function.
  experiment_type: structure-function mapping
- description: >-
    Test whether AGFG2 is required for regulated exocytosis in a salivary acinar model.
    It is the tissue where AGFG2 is most abundant, the published endothelial work was
    done in a tissue where it is not, and the authors themselves raise the possibility.
  hypothesis: >-
    AGFG2 acts generally in stimulus-evoked secretion from secretory granules rather than
    specifically in endothelium.
  experiment_type: loss of function
- description: >-
    Measure CD4 surface levels and CD4 internalisation kinetics after AGFG2 knockdown in
    uninfected cells expressing neither Nef nor Vpu.
  hypothesis: >-
    AGFG2 has a host-intrinsic role in receptor endocytosis, which would justify a term
    such as GO:1903077; the alternative is a strictly virus-dependent cofactor role,
    which is all the current data support.
  experiment_type: loss of function

