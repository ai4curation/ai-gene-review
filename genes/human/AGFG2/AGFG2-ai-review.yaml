- id: PMID:34369554
  title: Arf GTPase-activating proteins SMAP1 and AGFG2 regulate the size of Weibel-Palade bodies and exocytosis of von Willebrand factor.
  findings:
  - statement: siRNA depletion of AGFG2 in HUVECs halves PMA-stimulated and significantly reduces histamine-stimulated von Willebrand factor secretion, while unstimulated secretion is unchanged; overexpression of siRNA-resistant AGFG2 rescues the knockdown and drives granule release even without a secretagogue. This is the strongest evidence of function for this gene and it has produced no GO annotation.
    supporting_text: These results suggest that AGFG2 plays an important role in the stimulation-dependent secretion of vWF.
  - statement: AGFG2 depletion largely preserves WPB cargo delivery and morphology while reducing secretion. Quantitative changes in high-molecular-weight secreted VWF and propeptide cleavage are present, so the data favor but do not isolate a late release mechanism.
    supporting_text: Overall, these results indicate that vWF transport to WPBs is not highly perturbed in SMAP1KD and AGFG2KD cells.
  - statement: The paper notes the retained ArfGAP consensus and uses an R75Q construct. Its GAP-dead label is not supported by a direct AGFG2 hydrolysis measurement in this study.
    supporting_text: AGFG proteins were reported to lose important amino acids in ArfGAP domain (Schlacht et al., 2013), but human AGFG2 conserves ArfGAP consensus sequence CX2CX16CX2CX4R in ArfGAP domain.
  - statement: Reports that the R75Q mutant still induced vWF secretion with no detected difference from wild type, but as data not shown. This tests whether that one residue is required for that one function; it is not a measurement of GAP activity, and the authors state that the contributions of the FG repeats and the ArfGAP domain remain to be addressed.
    supporting_text: AGFG2[R75Q] expression also induced secretion of vWF and we have not detected the specific effects of AGFG2[R75Q] expression compared with that of wild-type AGFG2 so far (data not shown).
  - statement: AGFG2 is enriched in salivary gland, consistent with secretory roles; enrichment does not exclude a germ-cell role.
    supporting_text: According to the NCBI Gene database, AGFG2 is highly expressed in salivary gland (Fagerberg et al., 2014).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary Results/Discussion and relevant Methods checked. Secretion perturbation and expression establish a trafficking role; the R75Q phenotype is data not shown and is not a GAP assay. Modest VWF-processing differences prevent claims that every maturation measure was unchanged.
