- id: PMID:23433073
  title: Ancient complexity, opisthokont plasticity, and discovery of the 11th subfamily of Arf GAP proteins.
  findings:
  - statement: Most AGFG sequences lack the ASAP3 Asp484-homologous residue, contributing to a prediction of reduced activity. This is not a direct AGFG assay, and active GIT proteins provide an exception to a universal Asp requirement.
    supporting_text: Only two of the 40 AGFG sequences contain an aspartate at the position homologous to D47 in the other subfamilies (D484 in ASAP3 structure)
  - statement: 'Notes that the catalytic arginine, although highly conserved across Arf GAPs, fell just short of the study''s conservation cut-off in AGFG, and that nine of the forty AGFG sequences lack it altogether. Human AGFG2 is not among those nine: it retains the arginine at position 75.'
    supporting_text: nine of the 40 AGFG sequences lack the catalytic arginine and would be expected to be incapable of supporting robust GTP hydrolysis, even if binding to Arf is conserved.
  - statement: Independently establishes that AGFG is one of four Arf GAP subfamilies that underwent a single duplication producing two paralogues, which is the phylogenetic basis for treating AGFG1 and AGFG2 as paralogues rather than assuming it from the shared name.
    supporting_text: four of the subfamilies (SMAP (Figure S3G), ArfGAP2/3 (Figure S3H), AGFG (Figure S3I) and GIT (Figure 5B)) have each undergone a single duplication resulting in two paralogs
  - statement: The same sequence survey reports loss of the Asp-homologous position in all 18 GIT sequences analyzed.
    supporting_text: In fact, it is absent from all 18 GIT sequences used in our analyses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full relevant phylogeny and conserved-site Results/Discussion read. AGFG catalytic reduction is a prediction. The same analysis finds loss of the Asp-homologous residue in all GIT sequences, a limitation on universal Asp-based inactivity claims.
- id: PMID:25496667
  title: Genome-wide shRNA screening identifies host factors involved in early endocytic events for HIV-1-induced CD4 down-regulation.
  findings:
  - statement: AGFG2 (HRBL) is one of seven validated hits whose knockdown significantly rescues CD4 surface expression in HIV-1-infected SupT1 cells, confirmed in a second cell background and with Nef expressed alone. Its knockdown did not significantly affect HIV-1 replication.
    supporting_text: Remarkably, only cells knocked down for HRBL, EPS15 and HSP90B1 were found to significantly express higher CD4 surface levels than the non-targeting shRNA control cells.
  - statement: The authors describe AGFG2 as poorly characterised and note that the transferrin endocytosis result they cite belongs to the paralogue HRB, not to HRBL - a distinction worth preserving, since it is the kind of attribution that migrates between paralogues.
    supporting_text: HRBL is a poorly characterized protein, but shares similarity with another Rev binding protein, HRB (HIV Rev Binding protein), which is able to affect endocytosis of transferrin in an EPS15-dependent manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. Primary human-cell shRNA evidence for AGFG2 that has produced no annotation in GOA. Note that the affinage record's table row for the companion paper PMID:26701340 states AGFG2 knockdown raises CD4 in Vpu-expressing but not Nef-expressing cells; that is contradicted both by this paper's Nef-specific result and by the companion abstract's own dual-role conclusion, so the affinage row was not used.
- id: PMID:26701340
  title: The human immunodeficiency virus (HIV) Rev-binding protein (HRB) is a co-factor for HIV-1 Nef-mediated CD4 downregulation.
  findings:
  - statement: Knockdown of HRBL (AGFG2), but not of EPS15, significantly raises CD4 levels in Vpu-expressing cells, so AGFG2 acts as a cofactor for both Nef- and Vpu-mediated CD4 downregulation, whereas AGFG1/HRB supports only the Nef route. This is the sharpest published functional distinction between the two paralogues.
    supporting_text: These results identify HRB as a previously unknown co-factor for HIV-1 Nef-mediated CD4 downregulation and highlight differences with the related protein HRBL, which affects the CD4 downregulation in a dual role as co-factor of both HIV-1 Nef and Vpu.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache, and only the abstract is relied on. Titled for HRB (AGFG1) while carrying the decisive AGFG2 result, which is why a symbol-keyed search would not surface it. The affinage record's rendering of this paper - that AGFG2 knockdown raises CD4 in Vpu- but not Nef-expressing cells - misstates the abstract, which concludes a dual role in both; the affinage narrative section states it correctly, so the provider's own two summaries disagree.
  full_text_unavailable: true
