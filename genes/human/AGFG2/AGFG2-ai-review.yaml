proposed_new_terms:
- proposed_name: Weibel-Palade body exocytosis
  proposed_definition: The regulated exocytosis of a Weibel-Palade body, the rod-shaped secretory granule characteristic of vascular endothelial cells, in which the granule fuses with the plasma membrane and releases its contents, principally von Willebrand factor and P-selectin, to the cell surface and the vessel lumen following secretagogue stimulation.
  proposed_parent:
    id: GO:0045055
    label: regulated exocytosis
  justification: A dedicated term could distinguish endothelial Weibel-Palade body release from other forms of regulated exocytosis. The current broad process plus cargo extension already represents the demonstrated AGFG2 role; a new term is an ontology question, not a prerequisite for this review.
  supported_by:
  - reference_id: PMID:34369554
    supporting_text: These results suggest that AGFG2 plays an important role in the stimulation-dependent secretion of vWF.
  - reference_id: PMID:34369554
    supporting_text: In this study, we identified SMAP1 and AGFG2 as ArfGAPs that regulate vWF transport.
