- term:
    id: GO:0019901
    label: protein kinase binding
  evidence_type: IPI
  original_reference_id: PMID:11606584
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06241
  review:
    summary: PLCG2 interacts with protein kinases that regulate its catalytic activity.
    action: ACCEPT
    reason: The original PMID:11606584 supports kinase–PLCG2 association/enzymatic engagement. PMID:11606584
      distinguishes efficient BTK phosphorylation of recombinant human PLCγ2 from SYK phosphorylation
      of BLNK; PMID:12181444 directly tests LCK, FYN and LYN. This does not mean every kinase is equally
      effective or required in every native cell.
    supported_by:
    - reference_id: PMID:11606584
      supporting_text: Of the two kinases that previously have been proposed to phosphorylate PLCgamma2,
        Btk, and Syk, purified Btk had much greater ability to phosphorylate recombinant PLCgamma2 in
        vitro, whereas Syk efficiently phosphorylated adapter protein BLNK.
    - reference_id: PMID:12181444
      supporting_text: In vitro phosphorylation experiments with recombinant PLCgamma2 and recombinant
        Lck, Fyn, and Lyn tyrosine kinases showed that phosphorylation of PLCgamma2 led to activation
        of the recombinant enzyme.
