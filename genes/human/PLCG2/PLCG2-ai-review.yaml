- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PLCG2 converts receptor input into phosphoinositide and calcium signals.
    action: MODIFY
    reason: 'Refine general signal transduction to phosphatidylinositol-mediated signaling and calcium-mediated
      signaling. GO_REF:0000002 is interpreted in its own context: immune/BCR studies include human PLCγ2
      expressed in chicken DT40 cells, whereas platelet and microglial studies test distinct receptor
      systems. Calcium release is mediated by IP3 receptors downstream of PLCG2 catalysis, not by PLCG2
      acting as an ion channel.'
    supported_by:
    - reference_id: PMID:11043765
      supporting_text: The activated PLC-gamma2 converts phosphatidylinositol 4,5-bisphosphate into the
        second messenger inositol 1,4,5-trisphosphate (IP3), which in turn binds to IP3 receptors located
        on the endoplasmic reticulum (ER).
    proposed_replacement_terms:
    - id: GO:0048015
      label: phosphatidylinositol-mediated signaling
    - id: GO:0019722
      label: calcium-mediated signaling
  supporting_entities:
  - InterPro:IPR001711
  - InterPro:IPR016279
- term:
    id: GO:0008081
    label: phosphoric diester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PLCG2 hydrolyzes the phosphodiester bond of PI(4,5)P2.
    action: MODIFY
    reason: Refine phosphoric diester hydrolase activity to the measured PIP2 phospholipase C activity.
      The reaction releases IP3 and DAG; it is more specific than generic phosphodiester hydrolysis or
      C-type glycerophospholipase activity.
    supported_by:
    - reference_id: PMID:11043765
      supporting_text: The activated PLC-gamma2 converts phosphatidylinositol 4,5-bisphosphate into the
        second messenger inositol 1,4,5-trisphosphate (IP3), which in turn binds to IP3 receptors located
        on the endoplasmic reticulum (ER).
    - reference_id: PMID:12181444
      supporting_text: In vitro phosphorylation experiments with recombinant PLCgamma2 and recombinant
        Lck, Fyn, and Lyn tyrosine kinases showed that phosphorylation of PLCgamma2 led to activation
        of the recombinant enzyme.
    proposed_replacement_terms:
    - id: GO:0004435
      label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  supporting_entities:
  - InterPro:IPR017946
