- term:
    id: GO:0006661
    label: phosphatidylinositol biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:11606584
  qualifier: involved_in
  review:
    summary: The direct PLCG2 product is IP3, generated by cleavage of PIP2.
    action: MODIFY
    reason: 'This is a reaction-role correction: PLCG2 does not synthesize phosphatidylinositol in the
      cited activation assays. Its supported product-forming process is inositol trisphosphate biosynthesis,
      coupled to glycerophospholipid cleavage. The replacement is not claimed to be a descendant of phosphatidylinositol
      biosynthesis.'
    supported_by:
    - reference_id: PMID:11043765
      supporting_text: The activated PLC-gamma2 converts phosphatidylinositol 4,5-bisphosphate into the
        second messenger inositol 1,4,5-trisphosphate (IP3), which in turn binds to IP3 receptors located
        on the endoplasmic reticulum (ER).
    - reference_id: PMID:12181444
      supporting_text: In vitro phosphorylation experiments with recombinant PLCgamma2 and recombinant
        Lck, Fyn, and Lyn tyrosine kinases showed that phosphorylation of PLCgamma2 led to activation
        of the recombinant enzyme.
    proposed_replacement_terms:
    - id: GO:0032959
      label: inositol trisphosphate biosynthetic process
