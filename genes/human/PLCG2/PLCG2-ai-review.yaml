  review:
    summary: PLCG2 directly metabolizes a phosphorylated phosphatidylinositol substrate.
    action: ACCEPT
    reason: PIP2 hydrolysis is actual participation in phosphatidylinositol metabolism. The existing term
      correctly captures substrate-class metabolism; it should not be replaced solely by a signaling term
      that omits the chemical transformation.
