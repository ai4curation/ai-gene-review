id: P16885
gene_symbol: PLCG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PLCG2 encodes phospholipase C-gamma 2, a multidomain phosphoinositide-specific phospholipase
  C enriched in hematopoietic cells and microglia. After recruitment to activated receptor signaling complexes
  through SH2/phosphotyrosine and adaptor interactions, PLCG2 hydrolyzes phosphatidylinositol 4,5-bisphosphate
  at plasma-membrane and membrane-raft signaling sites to generate inositol 1,4,5-trisphosphate and diacylglycerol,
  coupling B-cell, Fc receptor, C-type lectin, platelet, TREM2, Toll-like receptor, and related immune
  pathways to calcium mobilization, lipid signaling, transcriptional responses, phagocytosis, inflammatory
  signaling, and other hematopoietic or myeloid cell outcomes.
