suggested_questions:
- question: Which PLCG2 receptor contexts should be considered core across hematopoietic and microglial
    biology rather than retained as cell-type-specific downstream processes?
- question: Can full-text evidence for the PMID:32514138 protein tyrosine kinase binding annotation be
    reviewed to decide whether GO:1990782 should be accepted or replaced by a more specific recruitment
    term?
- question: Should Reactome PLCG1/PLCG entity-set events that annotate PLCG2 be split or qualified to
    avoid isoform ambiguity?
suggested_experiments:
- hypothesis: Endogenous PLCG2 has receptor-context-specific activation kinetics in microglia and macrophages.
  description: Measure endogenous PLCG2 recruitment, phosphorylation, PIP2 hydrolysis, and calcium output
    after TREM2, Fc receptor, C-type lectin, and TLR stimulation in primary human microglia or macrophages.
  experiment_type: primary-cell signaling time course
- hypothesis: SH2-domain recruitment and Rac-dependent activation make separable contributions to PLCG2
    signaling output.
  description: Use PLCG2 SH2-domain and Rac-binding mutants to separate phosphotyrosine-adaptor recruitment
    from Rac-dependent activation in immune-cell signaling assays.
  experiment_type: mutational structure-function assay
- hypothesis: Alzheimer-associated PLCG2 variants alter receptor-proximal phospholipase activity and downstream
    microglial phenotypes.
  description: Test whether Alzheimer-associated PLCG2 variants alter core PIP2 phospholipase activity,
    membrane recruitment kinetics, and downstream phagocytosis/lipid-response phenotypes in matched human
    microglia-like cells.
  experiment_type: iPSC-derived microglia variant assay
