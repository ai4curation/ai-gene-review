- term:
    id: GO:0019722
    label: calcium-mediated signaling
  evidence_type: NAS
  original_reference_id: PMID:11043765
  qualifier: involved_in
  review:
    summary: PLCG2 produces IP3 downstream of receptor activation, driving calcium release and calcium-mediated
      signaling.
    action: ACCEPT
    reason: Retain as core signaling output because BCR and platelet studies show PLCG2-dependent calcium
      responses and phosphorylation-dependent activation of PLCG2 upstream of IP3-mediated calcium release
      (PMID:11043765, PMID:11606584, PMID:12181444).
