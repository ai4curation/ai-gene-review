id: P0DP91
gene_symbol: ERCC6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSB–PGBD3 is a chimeric ERCC6-associated protein containing a CSB-derived N-terminal region
  and a PGBD3-derived region. The fusion localizes to the nucleus and binds selected MER85 DNA sequences.
  In human CSB-null cells, its expression changes STAT1-associated gene expression, STAT serine phosphorylation
  and DNA-repair readouts. These context-dependent regulatory effects are distinct from the established
  ATPase motor activity of full-length CSB.
