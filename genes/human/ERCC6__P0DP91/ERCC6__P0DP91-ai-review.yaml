- id: PMID:22483866
  title: The conserved Cockayne syndrome B-piggyBac fusion protein (CSB-PGBD3) affects DNA repair and
    induces both interferon-like and innate antiviral responses in CSB-null cells.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Access and target scope: Original cache Methods 110–146; Results 154–166,182–208,234–240;
      Figs 2–4 referenced in Results; no separate supplements or pixels. Distinct full CSB and fusion
      ORFs expressed in CSB-null human UVSS1KO cell pools. Fusion partly restores UV RNA-synthesis recovery
      and synergizes with CSB in damaged-reporter reactivation; oxidative reporter differs. Fusion expression
      increases STAT1/antiviral gene program and STAT1 serine727 phosphorylation, suppressed by coexpressed
      full CSB. Partially purified tagged fusion or separate PGBD3 produced in Sf9 binds selected MER85
      DNA sequences in EMSA with nonspecific competitor. Overexpression, host-cell reactivation and expression
      program are bounded readouts. No viral-challenge protection assay or fusion ATPase/repair-incision
      reconstitution. Do not import fusion DNA specificity into canonical CSB. The literal source contexts
      are preserved in the linked source-records YAML. See the original-source guide for the DOI/access
      route and precise operative locators; normal-cache access flags were not changed. Original routes
      and precise source limits are documented in ERCC6__P0DP91-source-guide.md.'
- id: PMID:26218421
  title: CSB-PGBD3 Mutations Cause Premature Ovarian Failure.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original Results 197–213, Methods 259–277/283 and the construct description/caption
      309 were read, with the database consultation also inspecting Methods 270–312. Tagged full human
      CSB–PGBD3-RFP in U2OS and fusion-eGFP in HeLa support nuclear and damage-associated chromatin localization.
      Rhesus-oocyte immunohistochemistry is separate; human ovary western is expression evidence. Nucleus
      is supported, while the precise external nucleoplasm/nuclear-body claims remain unresolved. No figure
      pixels or separate supplements were inspected; no canonical-CSB equivalence is inferred. Original
      routes and precise source limits are documented in ERCC6__P0DP91-source-guide.md.
