  review:
    summary: The human CSB–PGBD3 fusion binds selected MER85 sequences.
    action: ACCEPT
    reason: PMID:22483866 Methods and Figure4 compare partially purified insect-expressed human fusion
      protein and standalone PGBD3 in EMSA with six MER85 elements and nonspecific competitor. Four elements
