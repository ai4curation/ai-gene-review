id: Q96G01
gene_symbol: BICD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BICD1 (Bicaudal D1) is a coiled-coil dynein activating/cargo adaptor. It couples the minus-end-directed
  dynein-dynactin motor to Rab6-bearing Golgi and secretory-vesicle cargo: it binds the dynein complex
  (including the dynein intermediate chain) and dynactin at one end and the Rab6 GTPase at the other,
  and thereby drives COPI-independent Golgi-to-ER transport and minus-end-directed organelle movement
  along microtubules. It localises to the Golgi apparatus, cytoplasmic vesicles and the cytosol.'
