knowledge_gaps:
- gap_statement: >-
    Whether PHGDH has any physiological non-enzymatic function is undetermined. Two
    enzyme-independent activities have been claimed - a nuclear DNA-binding
    transcriptional-regulator role and a sequence-specific mRNA 3'UTR-binding role -
    but they come from one laboratory, were published within a year of each other,
    and are asserted to be mutually independent rather than successive refinements of
    one mechanism. Neither has been replicated elsewhere, no structure of PHGDH bound
    to DNA or RNA has been reported, and the proposed nucleic-acid-binding surface
    lies inside the NAD(H)-binding Rossmann fold that carries the established
    catalytic function.
  boundary: >-
    Firmly established and not in question: PHGDH is the NAD+-dependent
    3-phosphoglycerate dehydrogenase (EC 1.1.1.95) catalysing the first, rate-limiting
    step of de novo L-serine biosynthesis in the cytosol, with human enzyme assays,
    loss-of-function disease genetics and flux measurements behind it. The moonlighting
    claims do not contest this and do not displace it.
