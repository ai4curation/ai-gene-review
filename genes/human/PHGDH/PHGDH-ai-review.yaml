- id: PMID:40273909
  title: Transcriptional regulation by PHGDH drives amyloid pathology in Alzheimer's
    disease.
  findings:
  - statement: >-
      Claims an enzyme-independent, transcriptional-regulator moonlighting role for
      PHGDH in astrocytes, driving amyloid pathology in mice and human brain
      organoids. Catalysis was excluded using an active-site (R236Q) enzymatic-dead
      mutant.
    reference_section_type: ABSTRACT
    supporting_text: >-
      modulates AD pathology in mice and human brain organoids independent of its
      enzymatic activity
  - statement: >-
      The claimed activity is explicitly described as previously uncharacterized.
    reference_section_type: ABSTRACT
    supporting_text: >-
      PHGDH has an uncharacterized role in transcriptional regulation
  - statement: >-
      The proposed DNA-binding element is a helix-helix-turn-helix subdomain inside
      the Rossmann-fold nucleotide-binding domain, identified from an AlphaFold model
      by structural similarity to a TALE homeodomain - i.e. a predicted, not a
      solved, DNA-binding motif.
    reference_section_type: RESULTS
    supporting_text: >-
      which exhibits structural similarity to the three amino acid loop extension
      (TALE) homeodomain, a DNA-binding structural motif
  - statement: >-
      Nuclear localization of PHGDH is reported in astrocytes but not in hESCs or
      HEK293T cells, where localization was cytosolic as expected for the
      serine-biosynthesis enzyme.
    reference_section_type: RESULTS
    supporting_text: >-
      PHGDH exhibited both cytosolic and nuclear localization in astrocytes
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified (Cell 2025, PMID:40273909, PMC12204802; full text cached).
      Not disputed by a published rebuttal; marked DISPUTED because the claim is a
      major, enzyme-independent reassignment of function that rests on a single
      laboratory, on an AlphaFold-predicted DNA-binding subdomain embedded in the
      NAD(H)-binding Rossmann fold, and on overexpression phenotypes. No GOA
      annotation currently depends on it, and none is proposed here.
- id: PMID:41701839
  title: RNA-binding activity of PHGDH drives amyloid-beta production in a human brain
    organoid model of sporadic Alzheimer's disease.
  findings:
  - statement: >-
      Claims a second, distinct moonlighting activity for PHGDH - sequence-specific
      RNA binding to the EIF2AK1 3'UTR - that recruits EIF2AK1 to EIF2alpha and
      thereby promotes BACE1 translation and amyloid-beta production.
    reference_section_type: ABSTRACT
    supporting_text: >-
      PHGDH binds the 3'UTR of EIF2AK1 mRNA, enabling the physical interaction
      between PHGDH and the EIF2AK1 protein
  - statement: >-
      The new mechanism is asserted to be independent not only of catalysis but also
      of the transcriptional role the same group reported the previous year, so the
      two moonlighting mechanisms are presented as mutually independent rather than
      as one mechanism refined.
    reference_section_type: ABSTRACT
    supporting_text: >-
      independent of its canonical enzymatic or transcriptional roles
  - statement: >-
      A specific RNA-binding surface within PHGDH is claimed to be required.
    reference_section_type: ABSTRACT
    supporting_text: >-
      this process requires a specific RNA-binding surface within PHGDH and the
      EIF2AK1 3'UTR
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified (PNAS 2026, PMID:41701839, PMC12933074; full text cached).
      Carries a correction (PMID:41838922). Marked DISPUTED on the same grounds as
      PMID:40273909, plus two specific to it: it is the second mutually-independent
      moonlighting mechanism proposed for PHGDH by the same senior author within a
      year, and it is a PNAS Contributed-track submission (contributed by co-author
      Shu Chien), so editorial handling was not fully arms-length. No independent
      replication is available.
- id: PMID:41838922
  title: Correction for Chen et al., RNA-binding activity of PHGDH drives amyloid-beta
    production in a human brain organoid model of sporadic Alzheimer's disease.
  findings:
  - statement: >-
      The correction is purely editorial - the misspelling of a reviewer's name. No
      data, figure or scientific conclusion of PMID:41701839 was corrected.
    reference_section_type: OTHER
    supporting_text: >-
      The authors note that the reviewer name Andrew Piper should instead appear as
      Andrew Pieper.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PNAS 2026). Checked specifically because a correction on a
      single-source moonlighting claim would matter: it does not. It is a reviewer
      name spelling fix and carries no weight for or against the RNA-binding claim.
      The correction notice does, however, document the Contributed-track route
      ("Contributed by Shu Chien ... reviewed by Lana Garmire and Andrew Pieper").
