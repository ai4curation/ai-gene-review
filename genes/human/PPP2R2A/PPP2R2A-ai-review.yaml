  review:
    summary: B55-alpha contributes to, but does not itself possess, the phosphatase activity of the PP2A
      holoenzyme; the catalytic two-metal centre is in the C subunit. PP2A is specifically a serine/threonine
      phosphatase.
    action: MODIFY
    reason: 'The contributes_to qualifier is already the correct, weaker claim for a non-catalytic regulatory
      subunit, and this row should be kept in that form. The improvement is specificity: PP2A catalyses
      phospho-Ser/Thr hydrolysis, and the cited study measured holoenzyme phosphatase activity and B-subunit
      binding for PPP2CA variants in exactly that assay. GO:0004722 protein serine/threonine phosphatase
      activity is the term both repository mitotic modules use for this holoenzyme, so replacing the generic
      parent removes an avoidable loss of information without changing what is being asserted about B55-alpha''s
      role.'
    proposed_replacement_terms:
    - id: GO:0004722
      label: protein serine/threonine phosphatase activity
    supported_by:
