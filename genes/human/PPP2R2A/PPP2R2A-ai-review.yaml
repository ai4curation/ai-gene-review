  label: Homo sapiens
description: 'PPP2R2A encodes B55-alpha (PR55-alpha/B-alpha/R2-alpha), the alpha isoform of the B/B55/PR55
  family of regulatory subunits of protein phosphatase 2A. It is a seven-bladed WD40 beta-propeller that
  latches onto the PP2A HEAT-repeat scaffold subunit (PPP2R1A/B) through a protruding beta-hairpin arm,
  forming a heterotrimeric holoenzyme with a catalytic subunit (PPP2CA/B). B55-alpha has no catalytic
  centre of its own; its function is to select, recruit and position phosphoproteins on an acidic groove
  on the top face of the propeller so that the catalytic subunit can hydrolyse phospho-serine and phospho-threonine,
  and thereby to set the substrate specificity, localisation and timing of that holoenzyme''s activity.
  Substrates are recognised through basic patches flanking a proline-directed phosphosite and through
  structured alpha-helices that dock onto conserved surfaces of the propeller; phospho-threonine sites
  are preferred over the equivalent phospho-serine sites. PP2A-B55 is the principal phosphatase that reverses
  cyclin B-CDK1 phosphorylation: it is held inactive at mitotic entry by the endosulfines ENSA and ARPP19
  once these are phosphorylated by the Greatwall kinase MASTL, and by the inhibitor PABIR1/FAM122A, both
  of which bind B55-alpha itself and occlude the same platform that substrates use; as cyclin B is destroyed
  and the inhibitors are released the holoenzyme dephosphorylates CDK1 substrates in an ordered sequence,
  driving spindle disassembly, chromatin decondensation, nuclear envelope reformation (through BANF1,
  with ANKLE2 as a targeting factor) and Golgi reassembly, and counteracting Ki-67-dependent chromosome
  individualisation. Outside mitosis the same holoenzyme dephosphorylates WEE1 and so stabilises it, reinforcing
  the G2/M checkpoint under replication stress, and acts on pRB-family proteins p107 and p130, hyperphosphorylated
  tau, FOXM1, HSF1, the CREB coactivator CRTC3, DAPK1 and AKT. B55-alpha is a broadly expressed, soluble
  protein found in both cytoplasm and nucleus, with a synaptic pool in brain; loss of the mouse orthologue
  is embryonic lethal, and the human gene is recurrently deleted in prostate and other epithelial cancers.'
