proposed_new_terms: []
suggested_questions:
- question: Which mitotic-exit substrates are specific to B55-alpha and which are shared with B55-delta
    (PPP2R2D)? Depleting B55-delta did not delay mitotic exit in HeLa cells even though it is the isoform
    implicated in Xenopus extracts, so the division of labour between the paralogues in human cells remains
    unresolved.
  experts:
  - Jonathon Pines
  - Daniel W. Gerlich
- question: Are 'protein phosphatase regulator activity' (GO:0019888) and 'enzyme-substrate adaptor activity'
    (GO:0140767) intended as two descriptions of the same B-subunit fact, or should GO distinguish a subunit
    that sets specificity from one that modulates rate? Both are currently asserted for this gene and
    neither is wrong.
  experts:
  - Valérie Wasserman
  - Wolfgang Peti
- question: Is the synaptic pool of B55-alpha functionally distinct, i.e. does it hold a resident set
    of substrates (tau, DARPP-32 via ARPP-16/MAST3) rather than reflecting the ubiquitous cytoplasmic
    pool captured in a synaptosome preparation?
  experts:
  - Angus C. Nairn
suggested_experiments:
- hypothesis: The substrate set dephosphorylated at mitotic exit is determined by the B55-alpha propeller
    surface rather than by holoenzyme abundance, so surface mutations that preserve assembly should uncouple
    individual substrate classes.
  description: Degron-mediated removal of endogenous B55-alpha in human cells with add-back of propeller-surface
    variants (acidic top-face groove versus the platform helix-docking patch), followed by time-resolved
    phosphoproteomics through a synchronised mitotic exit, with holoenzyme assembly verified by co-immunoprecipitation.
  experiment_type: degron genetics / quantitative phosphoproteomics
- hypothesis: B55-alpha and B55-delta holoenzymes have overlapping but non-identical substrate repertoires
    in human cells, which would explain why only B55-alpha depletion delays mitotic exit.
  description: Single and combined degron depletion of PPP2R2A and PPP2R2D in the same cell line, with
