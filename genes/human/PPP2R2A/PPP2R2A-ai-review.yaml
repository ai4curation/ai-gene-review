    summary: PP2A B subunits assemble with the A scaffold and C catalytic subunit into the heterotrimeric
      PP2A holoenzyme; this is the defining, deeply conserved property of the PR55/B55 family and is asserted
      here from the PANTHER family node.
    action: ACCEPT
