      human protein''s own experimental annotations (IDA rows below, plus the PP2A-Balpha holoenzyme crystal
      structure) are among the descendant evidences behind the IBD. P63151 appearing in its own WITH/FROM
      is the expected marker of that experimental grounding, not circularity.'
