  review:
    summary: Rab-family effector binding does not establish GTPase activation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The actual experiments identify Drp1 as an effector preferentially associated with active
      Rab32-family proteins. They measure cross-linked association, membrane redistribution and mitochondrial
      morphology, not an increase in Rab-catalyzed GTP hydrolysis caused by Drp1. GO:0005096 requires
      binding to and increasing a GTPase's activity. The IC inference from small-GTPase and GTP-dependent
      binding therefore overstates the performed role. The positive binding observations remain supported
      in their own rows; this is not a claim that every possible Drp1-dependent GTPase-regulatory effect
      is absent.
    supported_by:
