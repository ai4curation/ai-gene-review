  review:
    summary: GTPase activator activity (IC), inferred from DNM1L binding to GTP-bound Rab32 family proteins.
    action: REMOVE
    reason: The cited paper shows DNM1L is an effector of Rab32 (it binds the GTP-bound form); effectors
      bind active GTPases but are not GAPs, and no stimulation of Rab32 GTP hydrolysis by DNM1L was shown.
      The curator inference from small GTPase binding to activator activity is unsupported.
    supported_by:
    - reference_id: PMID:25767741
      supporting_text: Our findings therefore demonstrate that Drp1 is an effector protein for Rab32 family
        proteins, and that Rab32 is the most efficient interactor of the 3 members.
