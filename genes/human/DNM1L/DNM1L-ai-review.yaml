core_functions:
- description: Dynamin-family GTPase recruited by MFF/MIEF1/MIEF2 to the mitochondrial outer membrane,
    where it assembles into helical rings and uses GTP hydrolysis to constrict and sever the mitochondrion.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0000266
    label: mitochondrial fission
  - id: GO:0090149
    label: mitochondrial membrane fission
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:23977156
    supporting_text: Amino acid substitutions Q34A, K38A, S39A, T59A, D146A, G149A, K216A and D218A completely
      abolished GTP hydrolysis.
  - reference_id: PMID:23530241
    supporting_text: GTP-hydrolysis by Drp1 also increased up to 15-fold in low ionic strength buffer,
      indicating that self-assembly stimulated GTP hydrolysis
  - reference_id: PMID:11514614
    supporting_text: cells with mutant Drp1 is a block in mitochondrial division
  - reference_id: file:human/DNM1L/DNM1L-uniprot.txt
    supporting_text: Mediates membrane fission through oligomerization into membrane-associated tubular
      structures that wrap around the scission site to constrict and sever the mitochondrial membrane
      through a GTP hydrolysis-dependent mechanism
- description: The same GTPase machinery, recruited by MFF/FIS1/PEX11B, divides peroxisomes.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0016559
    label: peroxisome fission
  locations:
  - id: GO:0005777
    label: peroxisome
  supported_by:
  - reference_id: PMID:12618434
    supporting_text: Disruption of DLP1 function by either RNA interference or overexpressing dominant
      negative DLP1 mutants causes a dramatic reduction in peroxisome abundance
  - reference_id: PMID:12499366
    supporting_text: We were able to localize DLP1 in spots on tubular peroxisomes in HepG2 cells.
  - reference_id: PMID:23921378
    supporting_text: Drp1 ( d ynamin- r elated p rotein 1 ) is recruited to both mitochondrial and peroxisomal
      membranes to execute fission.
suggested_questions:
- question: Is DNM1L constriction alone sufficient to complete scission of both mitochondrial membranes,
    or is a second dynamin (DNM2) or another factor required in vivo?
- question: How do the different receptors (MFF versus MIEF1/MIEF2) select GTP-bound versus oligomeric
    DNM1L and control assembly geometry at constriction sites?
suggested_experiments:
- description: Acute degron depletion of DNM1L versus DNM2 combined with live super-resolution imaging
    of constriction and scission events to define which dynamin completes membrane scission.
