        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The original supports Rab32–Drp1 association and an effector/recruitment role. It does
          not demonstrate that DNM1L increases Rab32 GTP hydrolysis as a GTPase activator.
