core_functions:
- description: A cytosolic dynamin-related motor that oligomerizes at mitochondrial and peroxisomal membranes.
    GTP hydrolysis powers membrane constriction and fission, with membrane adaptors recruiting the machinery
    to division sites.
  molecular_function:
    id: GO:0061791
    label: GTPase motor activity
  directly_involved_in:
  - id: GO:0090149
    label: mitochondrial membrane fission
  - id: GO:0016559
    label: peroxisome fission
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0005778
    label: peroxisomal membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:23977156
    supporting_text: Amino acid substitutions Q34A, K38A, S39A, T59A, D146A, G149A, K216A and D218A completely
      abolished GTP hydrolysis.
  - reference_id: PMID:23530241
    supporting_text: GTP-hydrolysis by Drp1 also increased up to 15-fold in low ionic strength buffer,
      indicating that self-assembly stimulated GTP hydrolysis
  - reference_id: PMID:11514614
    supporting_text: cells with mutant Drp1 is a block in mitochondrial division
  - reference_id: file:human/DNM1L/DNM1L-uniprot.txt
    supporting_text: Mediates membrane fission through oligomerization into membrane-associated tubular
      structures that wrap around the scission site to constrict and sever the mitochondrial membrane
      through a GTP hydrolysis-dependent mechanism
  - reference_id: PMID:12618434
    supporting_text: Disruption of DLP1 function by either RNA interference or overexpressing dominant
      negative DLP1 mutants causes a dramatic reduction in peroxisome abundance
  - reference_id: PMID:12499366
    supporting_text: We were able to localize DLP1 in spots on tubular peroxisomes in HepG2 cells.
  - reference_id: PMID:23921378
    supporting_text: Drp1 ( d ynamin- r elated p rotein 1 ) is recruited to both mitochondrial and peroxisomal
      membranes to execute fission.
  - reference_id: PMID:30531964
    supporting_text: Drp1 with GTP also severed tubes displaying Mff
suggested_questions:
- question: Which physiological DNM1L products occupy microtubule, neuronal-vesicle and organelle-membrane
    pools, and which localization differences reflect alternative splicing rather than expression level
    or cell type?
- question: How do membrane adaptors and lipid composition couple Drp1 GTP hydrolysis to complete scission
    in cells, including coordination of mitochondrial inner and outer membranes?
- question: What source-specific DNM1L experiments support the three imported PMID37971521 assertions,
    and how do they relate to the independently verified PMID38587461 study?
- question: Does the mouse brush-border proteomic observation reflect a conserved human DNM1L pool, and
    can the original target-specific supplemental record be recovered?
suggested_experiments:
- description: Compare sequence-authenticated natural human DNM1L products at matched endogenous expression
    using compartment-resolved imaging and orthogonal fractionation, including mitochondrial/peroxisomal
    membranes and microtubule or neuronal vesicle pools.
- description: Combine purified Drp1 and defined organelle adaptors/lipids with time-resolved membrane-scission
    measurements, then test matched hydrolysis and assembly mutants in cellular rescue experiments.
