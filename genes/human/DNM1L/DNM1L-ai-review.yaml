id: O00429
gene_symbol: DNM1L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNM1L (dynamin-1-like protein, DRP1) is a cytosolic dynamin-family mechanochemical GTPase
  that divides mitochondria and peroxisomes. It comprises a GTPase domain, a bundle-signalling element,
  a stalk that mediates dimer and higher-order assembly, and a variable domain in place of the pleckstrin-homology
  and proline-rich domains of classical dynamins. The soluble pool is recruited to the cytosolic face
  of the mitochondrial outer membrane by the tail-anchored receptors MFF, MIEF2 (MiD49) and MIEF1 (MiD51),
  with a minor role for FIS1, frequently at ER-mitochondria contacts pre-constricted by INF2-driven actin
  polymerization; on peroxisomes it is recruited by MFF, FIS1 and PEX11B. There DNM1L assembles into helical
  rings whose GTP hydrolysis-driven constriction severs the membranes. Its activity is controlled by phosphorylation
  (CDK1/ERK/PINK1 at Ser616 activating; PKA at Ser637 inhibitory, reversed by calcineurin and PGAM5),
  SUMOylation by MUL1 and ubiquitination by MARCHF5 and Parkin. DNM1L-dependent fission is required for
  mitotic mitochondrial segregation, apoptotic fragmentation, efficient mitophagy and neuronal development;
  de novo dominant-negative and biallelic DNM1L variants cause encephalopathy due to defective mitochondrial
  and peroxisomal fission (EMPF1), and dominant variants also cause optic atrophy.
