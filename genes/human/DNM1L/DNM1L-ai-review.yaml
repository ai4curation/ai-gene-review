- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:23977156
  qualifier: enables
  review:
    summary: GTPase activity. Purified DNM1L hydrolyses GTP, stimulated by self-assembly and liposomes;
      G-domain mutations abolish hydrolysis; dephosphorylation of S637 by PGAM5 increases activity.
    action: ACCEPT
    reason: Core molecular function, directly demonstrated.
    supported_by:
    - reference_id: PMID:23977156
      supporting_text: Amino acid substitutions Q34A, K38A, S39A, T59A, D146A, G149A, K216A and D218A
        completely abolished GTP hydrolysis.
    - reference_id: PMID:23977156
      supporting_text: Liposome-stimulated GTP hydrolysis of DNM1L and its mutants determined by multiple-turnover
        assays.
    - reference_id: PMID:23530241
      supporting_text: GTP-hydrolysis by Drp1 also increased up to 15-fold in low ionic strength buffer,
        indicating that self-assembly stimulated GTP hydrolysis
    - reference_id: PMID:22265414
      supporting_text: PGAM5S recruited the mitochondrial fission factor Drp1 and activated its GTPase
        activity by dephosphorylating the serine 637 site of Drp1
