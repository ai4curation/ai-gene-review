id: O00429
gene_symbol: DNM1L
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNM1L encodes Drp1, a dynamin-family GTPase motor that divides mitochondria and peroxisomes.
  A soluble cytosolic pool is recruited to organelle membranes, where Drp1 oligomerization and GTP hydrolysis
  drive membrane constriction and fission. MFF and the mitochondrial adaptors MIEF1 and MIEF2 regulate
  recruitment, while peroxisomal division uses overlapping machinery. The protein contains a GTPase domain,
  a bundle-signalling element, an assembly stalk and a variable region affected by alternative splicing.
  Its membrane recruitment and assembly are controlled by interacting proteins and post-translational
  modifications. Beyond constitutive organelle division, Drp1 participates in context-dependent mitochondrial
  redistribution, apoptotic fragmentation and mitochondrial quality control; particular cellular and splice-product
  contexts also support microtubule and neuronal vesicle associations. Pathogenic DNM1L variants can disrupt
  organelle dynamics and cause severe neurological disease or optic atrophy.
