id: A8MWD9
gene_symbol: SNRPGP15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SNRPGP15 is a processed (retrotransposed) pseudogene of SNRPG on chromosome 19p13.12. UniProt A8MWD9
  is a putative 76-residue translation that is 72/76 identical to the Sm ring subunit SmG (SNRPG), differing at
  M13T, L17F, N55K and V61E; the reference genome has a TGA stop at codon 75, so the locus could at most encode
  a 74-residue SmG-like Sm-fold protein. The Sm-site RNA-contact residues are conserved but two SmE-interface residues
  differ. There is no experimental, literature, or discriminating proteomic evidence that a protein is produced;
  all mass-spectrometry peptides assigned to the entry are shared with SNRPG.
