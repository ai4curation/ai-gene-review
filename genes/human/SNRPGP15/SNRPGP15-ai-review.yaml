  - UniProtKB:Q382A6
  review:
    summary: IBA from PANTHER node PANTHER:PTN000058285 assigning 'mRNA splicing, via spliceosome' (inherited from
      SNRPG and other characterised Sm-family members) to a putative product of the SNRPG processed pseudogene SNRPGP15.
    action: REMOVE
    reason: SNRPGP15 is an HGNC pseudogene locus (Ensembl biotype processed_pseudogene) and A8MWD9 is PE5 with a
      UniProt pseudogene CAUTION. The GRCh38 locus and the UniProt-cited clone AC012318 both carry TGA at codon
      75 (Arg75 in SNRPG), so the 76-residue UniProt sequence is not what the genome encodes. All 16 mass-spectrometry
      peptides mapped to A8MWD9 are exact SNRPG substrings, and the discriminating tryptic peptides (NIGMVEIR, GFDPFMNLVIDECVEMATSGQQK)
      have never been observed although SNRPG peptides are seen tens of thousands of times. No literature or experimental
      data exist for this locus. Sequence-level the retrocopy is 72/76 identical to SNRPG and keeps the Sm-site
      pocket residues (F34, N39, R63) and every SmG-RNA contact in PDB 4PJO, but changes two SmE-interface residues
      (M13T; V61E in the beta4/Sm2 strand), so function cannot be inferred even if a product were made. Remove;
      revisit only if a SNRPGP15-specific peptide is observed.
    supported_by:
    - reference_id: file:human/SNRPGP15/SNRPGP15-bioinformatics/RESULTS.md
      supporting_text: Processed pseudogene; reference-genome ORF truncated by a stop at codon 75; no
    - reference_id: file:human/SNRPGP15/SNRPGP15-bioinformatics/RESULTS.md
      supporting_text: 'Conclusion: no proteomic evidence for the SNRPGP15 product.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000058285
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: PAINT node of PTHR10553 grounded in experimentally characterised Sm/SmG proteins (SmG/Sm snRNP-core
          clade). Placement is phylogenetically sound and A8MWD9 does sit inside it as a recent SNRPG retrocopy;
          the transfer fails because the leaf is a processed-pseudogene product with no evidence of existence.
      residue_claims:
