id: Q9GZV5
gene_symbol: WWTR1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WWTR1, also called TAZ, is a Hippo-regulated transcriptional coactivator and YAP1 paralog that
  shuttles between cytosol and nucleus. When Hippo signaling is low, TAZ enters the nucleus and binds
  DNA-binding partners including TEAD1-4, PAX8/NKX2-1, and SMAD2/3-SMAD4 to activate context-specific RNA
  polymerase II transcriptional programs. LATS1/2 phosphorylation creates 14-3-3 docking sites that retain TAZ
  in the cytosol, and WW-domain binding to PPxY-containing partners such as AMOT family proteins, WBP2, and
  PRRG4, plus C-terminal PDZ-domain interactions, further tune TAZ localization and transcriptional output.
