  review:
    summary: Transcription coregulator activity, the parent activity that covers TAZ coactivator function.
    action: ACCEPT
    reason: PMID:19010321 directly shows that TAZ binds PAX8 and NKX2-1/TTF-1 and enhances their
      transcriptional output, supporting transcription coregulator activity. Reactome-derived Hippo GO-CAMs
      also model WWTR1 with this MF in the nucleus.
    supported_by:
    - reference_id: PMID:19010321
      supporting_text: TAZ interacts with both Pax8 and TTF-1, in vitro and in vivo. More importantly, we show
        that this interaction leads to a significant enhancement of the transcriptional activity of Pax8 and
        TTF-1
