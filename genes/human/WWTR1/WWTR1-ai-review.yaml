core_functions:
- description: Hippo-regulated transcriptional coactivator for TEAD and other DNA-binding transcription
    factors. Nuclear TAZ supplies the activation function for TEAD-, PAX8/NKX2-1-, and SMAD-dependent target
    genes, while LATS phosphorylation triggers cytosolic retention by 14-3-3 proteins.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0035329
    label: hippo signaling
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:19324877
    supporting_text: We demonstrate here that TEAD is a key downstream transcription factor mediating the
      function of TAZ
  - reference_id: PMID:19010321
    supporting_text: TAZ interacts with both Pax8 and TTF-1, in vitro and in vivo. More importantly, we show
      that this interaction leads to a significant enhancement of the transcriptional activity of Pax8 and
      TTF-1
  - reference_id: PMID:18227151
    supporting_text: Lats phosphorylates TAZ on several serine residues in the conserved HXRXXS motif and
      creates 14-3-3 binding sites, leading to cytoplasmic retention and functional inactivation of TAZ
- description: Binding of sequence-specific transcription factors that recruit TAZ to promoters and enhancers,
    including TEAD1-4, PAX8/NKX2-1, and SMAD2/3-SMAD4 complexes.
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  directly_involved_in:
