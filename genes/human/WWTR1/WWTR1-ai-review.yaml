    supporting_text: Wbp2 interacts with TAZ directly in a WW domain-dependent manner
  - reference_id: PMID:21205866
    supporting_text: the identification of angiomotin (AMOT) family proteins as strong interacting partners of
      YAP and TAZ
  - reference_id: PMID:23911299
    supporting_text: AMOTL2 robustly co-immunoprecipitates with TAZ, and their interaction is dependent on the
      WW domain of TAZ and the PPXY motif in the N-terminus of AMOTL2
