      scores
  - reference_id: PMID:19010321
    supporting_text: TAZ interacts with both Pax8 and TTF-1, in vitro and in vivo. More importantly, we show
      that this interaction leads to a significant enhancement of the transcriptional activity of Pax8 and
      TTF-1
  - reference_id: PMID:18568018
    supporting_text: the transcriptional regulator TAZ binds heteromeric Smad2/3-4 complexes and is recruited
      to TGFbeta response elements
- description: WW-domain-mediated binding to PPxY/proline-rich motifs in regulatory partners such as WBP2,
    AMOT, AMOTL2, and PRRG4, which modulates TAZ transcriptional activity and cytosolic/junctional retention.
  molecular_function:
    id: GO:0070064
    label: proline-rich region binding
