suggested_questions:
- question: Which of the many large-scale WWTR1/TAZ interactors are direct, domain-resolved, physiological
    regulators rather than proteome-scale proximity or complex co-purification hits?
  experts: []
suggested_experiments:
- description: Mutate individual WW-domain and PDZ-binding-motif contacts in endogenous WWTR1 and quantify
    partner-specific effects on TAZ localization, TEAD reporter activity, and Hippo/Wnt/TGF-beta crosstalk in
    matched epithelial and stem-cell systems.
