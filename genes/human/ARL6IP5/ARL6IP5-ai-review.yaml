- term:
    id: GO:0008631
    label: intrinsic apoptotic signaling pathway in response to oxidative stress
  evidence_type: IDA
  original_reference_id: PMID:18387645
  qualifier: involved_in
  review:
    summary: Intrinsic apoptotic signaling pathway in response to oxidative stress (IDA, HeLa and MCF-7
      cells). Arsenic trioxide induces JWA through reactive oxygen species. JWA knockdown attenuates the
      resulting apoptosis, caspase-9 activation and loss of mitochondrial membrane potential. JWA is required
      for, rather than a step of, the pathway; modified to the positive-regulation term.
    action: MODIFY
    reason: '[PMID:18387645 "JWA expression was dependent upon generation of intracellular reactive oxygen
      species induced by arsenic trioxide."] [PMID:18387645 "Knockdown of JWA attenuated arsenic trioxide
      induced apoptosis, and was accompanied by significantly reduced activity of caspase-9, enhanced
      Bad phosphorylation and inhibited MEK1/2, ERK1/2 and JNK phosphorylations."] [PMID:18387645 "Arsenic
      trioxide induced loss of mitochondrial transmembrane potential was JWA-dependent."]'
    proposed_replacement_terms:
    - id: GO:1902177
      label: positive regulation of oxidative stress-induced intrinsic apoptotic signaling pathway
    supported_by:
    - reference_id: PMID:18387645
      supporting_text: JWA expression was dependent upon generation of intracellular reactive oxygen species
        induced by arsenic trioxide.
    - reference_id: PMID:18387645
      supporting_text: Knockdown of JWA attenuated arsenic trioxide induced apoptosis, and was accompanied
        by significantly reduced activity of caspase-9, enhanced Bad phosphorylation and inhibited MEK1/2,
        ERK1/2 and JNK phosphorylations.
    - reference_id: PMID:18387645
      supporting_text: Arsenic trioxide induced loss of mitochondrial transmembrane potential was JWA-dependent.
