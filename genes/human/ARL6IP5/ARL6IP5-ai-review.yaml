    label: endoplasmic reticulum tubular network organization
  evidence_type: IDA
  original_reference_id: PMID:40209949
  qualifier: involved_in
  review:
    summary: Endoplasmic reticulum tubular network organization (NEW, IDA, human cells). Overexpressed
      ARL6IP5 drives an extensive ER tubular network and constricts the ER membrane; this depends on short
      hairpin structures in its PRA1 domain. Knockdown impairs ER morphology in U2OS cells, and the RHD
      protein ARL6IP1 rescues it. ARL6IP5 shapes the membrane itself.
    action: NEW
    reason: '[PMID:40209949 "Upon overexpression, Arl6IP5 induces the extensive network of the ER tubules
      and constricts the ER membrane as judged by exclusion of a luminal ER enzyme from the ER tubules."]
      [PMID:40209949 "Upon disruption of the possible short hairpin structures of the PRA1 domain, Arl6IP5
      abolishes membrane constriction."] [PMID:40209949 "siRNA-mediated knockdown of Arl6IP5 impairs the
      ER morphology, and the phenotype of the Arl6IP5 knockdown cells is rescued by exogenous expression
      of Arl6IP1, an RHD-containing protein."]'
    supported_by:
