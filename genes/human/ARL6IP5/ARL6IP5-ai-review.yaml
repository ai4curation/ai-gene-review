id: O75915
gene_symbol: ARL6IP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARL6IP5 (GTRAP3-18, JWA, PRAF3, addicsin) is a 188-residue, four-pass PRA1-family membrane
  protein resident in the endoplasmic reticulum. It binds the C-terminal cytoplasmic domain of the neuronal
  glutamate/cysteine transporter EAAC1 (SLC1A1), lowering its glutamate affinity, and delays ER exit of
  EAAC1 and other excitatory amino acid transporters, thereby limiting cysteine uptake and neuronal glutathione.
  It slows ER-to-Golgi transport, acting against Rab1. It is an ER membrane-shaping protein: its PRA1
  domain constricts the ER membrane and promotes tubular ER, and it can substitute for the reticulon-homology
  protein ARL6IP1. The E3 ligase RNF185 ubiquitinates it for degradation. Under the name JWA it is reported
  to be required for arsenic trioxide-induced apoptosis in cancer cell lines.'
