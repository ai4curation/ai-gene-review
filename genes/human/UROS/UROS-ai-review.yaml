- term:
    id: GO:0006785
    label: heme B biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      ARBA electronic annotation (GO_REF:0000117) to heme B biosynthetic process.
    action: ACCEPT
    reason: >-
      Correct and specific for the human enzyme. Uroporphyrinogen III is a branch point in organisms that also make siroheme, chlorophyll or cobalamin, but humans make none of these, so in human cells UROS output goes to heme; heme B (protoheme) is the pathway's end product, and the process term covers every step of its formation. The same convention is applied to the other heme-pathway enzymes in this review set. The ARBA rule itself is not evidence; the claim rests on the curated function and pathway.
    supported_by:
    - reference_id: PMID:3805019
      supporting_text: Uroporphyrinogen III synthase (hydroxymethylbilane hydro-lyase (cyclizing); EC 4.2.1.75), the fourth enzyme in the heme biosynthetic pathway, was purified to homogeneity from human erythrocytes.
