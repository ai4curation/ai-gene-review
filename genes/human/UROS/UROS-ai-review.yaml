- term:
    id: GO:0005542
    label: folic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: >-
      Folic acid binding (IEA), transferred from rat Uros, where it derives from a 1984
      direct assay (PMID:6466301); later work on the enzyme does not support a folate
      cofactor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The row is transferred from rat Uros, annotated by direct assay in a 1984 study
      (PMID:6466301), so an experimental observation of folate associated with the
      purified enzyme lies behind it. A folate cofactor has not been borne out by later
      structural and mechanistic work on uroporphyrinogen-III synthase, whose reaction
      needs no cofactor. The activity is an unconfirmed historical observation rather
      than a refuted one, and the row is marked as an over-annotation rather than
      removed.
    supported_by:
    - reference_id: PMID:3805019
      supporting_text: Using hydroxymethylbilane as substrate, the purified enzyme formed uroporphyrinogen III in the absence of hydroxymethylbilane synthase or other cofactors.
