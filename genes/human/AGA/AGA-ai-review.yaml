id: P20933
gene_symbol: AGA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGA encodes aspartylglucosaminidase (glycosylasparaginase, EC 3.5.1.26),
  a lysosomal N-terminal nucleophile (Ntn) hydrolase of the asparaginase type 2 family.
  It is synthesized as a single-chain precursor that is cleaved autocatalytically
  in the endoplasmic reticulum into alpha and beta subunits, exposing the N-terminal
  threonine that serves both as the autocatalytic and the catalytic nucleophile; the
  mature enzyme is a dimer of alpha/beta heterodimers delivered to lysosomes by the
  mannose 6-phosphate pathway. In the lysosomal lumen AGA hydrolyses the N-glycosidic
  GlcNAc-Asn bond that links N-glycans to asparagine, a late step of N-glycoprotein
  degradation that requires prior removal of core fucose by FUCA1. Biallelic loss
  of AGA causes aspartylglucosaminuria, a progressive neurodegenerative glycoproteinosis
  with lysosomal storage and urinary excretion of aspartylglucosamine (GlcNAc-Asn).
