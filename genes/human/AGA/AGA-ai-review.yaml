- description: Lysosomal Ntn-hydrolase that cleaves the N-glycosidic GlcNAc-Asn bond
    joining N-glycans to asparagine in glycoprotein-derived glycopeptides, a late
    step of lysosomal N-glycoprotein catabolism; activated by autoproteolysis of its
    precursor.
