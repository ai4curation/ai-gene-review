suggested_questions:
- question: Does PIAS1 inhibition of STAT1 and NF-kB p65 DNA binding require its SP-RING E3 activity,
    or is it a purely binding-based (ligase-independent) mechanism in physiological settings?
- question: To what extent are PIAS1 and PIAS4 redundant in the DNA double-strand break response, and
    which substrates (MRE11, BRCA1, 53BP1) are PIAS1-specific in vivo?
- question: What determines PIAS1 SUMO paralog selectivity (SUMO1 versus SUMO2/3) on substrates such as
    MTA1 and MRE11?
- question: Does the SAP domain confer any sequence preference in DNA binding that targets PIAS1 to specific
    cis-regulatory regions in human cells, as suggested for mouse Pias1 with Msx1?
- question: Does PIAS1 restrict incoming HSV-1 genomes at PML nuclear bodies through SUMO1 deposition
    on specific viral or host substrates, and how redundant is this with PIAS4?
suggested_experiments:
- hypothesis: PIAS1 inhibits STAT1 and p65 target genes independently of its E3 activity.
  description: Reconstitute PIAS1-knockout human cells with wild-type PIAS1, an SP-RING catalytic mutant
    (C351S) and a STAT1-binding-deficient C-terminal deletion; measure IFN-gamma- and TNF-induced target
    gene expression, STAT1/p65 ChIP occupancy and STAT1/p65 sumoylation.
  experiment_type: genetic complementation
- hypothesis: PIAS1 is a non-redundant E3 for a defined subset of DSB-associated substrates.
  description: Quantitative SUMO2/3 proteomics (His-SUMO or K0-SUMO enrichment) after ionizing radiation
    in PIAS1, PIAS4 and double knockout cells to define PIAS1-specific DSB substrates, coupled with end-resection
    (RPA/BrdU ssDNA) assays.
  experiment_type: proteomics
