    limiting interferon- and cytokine-induced gene expression and innate immune/inflammatory responses.
    This inhibition does not require sumoylation of STAT1 and is switched on during inflammation by IKKalpha-mediated
    phosphorylation of PIAS1 on Ser90, a step that itself depends on PIAS1 SUMO ligase activity.'
