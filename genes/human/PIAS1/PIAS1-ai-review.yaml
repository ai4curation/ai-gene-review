- term:
    id: GO:0003714
    label: transcription corepressor activity
  evidence_type: TAS
  original_reference_id: PMID:10805787
  qualifier: enables
  review:
    summary: TAS from the PIAS1-STAT1 domain-mapping paper. PIAS1 inhibits STAT1 by directly binding the
      STAT1 dimer and blocking its DNA-binding activity, rather than by bridging STAT1 to repressive machinery
      as a classical corepressor does.
    action: MODIFY
    reason: GO:0140416 transcription regulator inhibitor activity (a regulator that inhibits a transcription
      regulator via direct binding and/or post-translational modification) precisely matches the mechanism
      and is already supported by IBA and IDA for PIAS1; 'transcription corepressor activity' implies
      a recruited cofactor that is not how PIAS1 inhibits STAT1. STAT1 inhibition by PIAS1 does not require
      STAT1 sumoylation, and PIAS1 is not the E3 for STAT1 (PMID:12764129), reinforcing that this is direct
      inhibition of a transcription regulator rather than corepressor recruitment.
    proposed_replacement_terms:
    - id: GO:0140416
      label: transcription regulator inhibitor activity
    supported_by:
    - reference_id: PMID:10805787
      supporting_text: A mutant PIAS1 lacking the Stat1-interacting domain failed to inhibit Stat1-mediated
        gene activation.
    - reference_id: PMID:10805787
      supporting_text: IFN treatment induces the association of PIAS1 and Stat1, which results in the
        inhibition of Stat1-mediated gene activation.
    - reference_id: PMID:9724754
      supporting_text: PIAS1, but not other PIAS proteins, blocked the DNA binding activity of Stat1 and
        inhibited Stat1-mediated gene activation in response to interferon
    - reference_id: PMID:12764129
      supporting_text: inhibition of STAT1 by PIAS proteins does not require SUMO modification of STAT1
    - reference_id: file:human/PIAS1/PIAS1-deep-research-openscientist.md
      supporting_text: functions as a **selective transcriptional repressor that does not require SUMOylation
        of its target**
    additional_reference_ids:
    - PMID:12764129
