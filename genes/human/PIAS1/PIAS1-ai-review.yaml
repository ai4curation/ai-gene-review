    label: G1/S transition of mitotic cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A8I6AIY4
  - ensembl:ENSRNOP00000093422
  review:
    summary: Ensembl Compara projection from rat Pias1 asserting involvement in the G1/S transition. No
      human data in the cached literature show PIAS1 executing a cell-cycle transition step; any cell-cycle
      effect (e.g. via KLF8 sumoylation, per UniProt) is an indirect consequence of transcription factor
      modification.
    action: MARK_AS_OVER_ANNOTATED
    reason: PIAS1 is a SUMO E3 ligase and transcriptional coregulator; effects on cell-cycle progression
      are downstream outcomes of substrate sumoylation rather than a direct role in the G1/S machinery.
      Retaining it as a process annotation overstates PIAS1's role.
