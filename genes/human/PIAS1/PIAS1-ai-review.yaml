gene_symbol: PIAS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PIAS1 (protein inhibitor of activated STAT 1) is a nuclear SP-RING-type SUMO E3 ligase of
  the PIAS family (orthologous to yeast Siz1/Siz2) and a transcriptional coregulator. It comprises an
  N-terminal SAP domain that binds A/T-rich DNA and chromatin and contains an LXXLL coregulator motif,
  a PINIT domain, a zinc-coordinating SP-RING that binds the SUMO E2 UBE2I/UBC9, a SUMO-interacting motif,
  and a Ser/Thr-rich C-terminus. By bridging UBE2I and substrates, PIAS1 catalyses SUMO1 and SUMO2/3 conjugation
  to many nuclear proteins, including p53, c-Jun, Mdm2, Sp3, HIC1, Nkx2.5, MTA1, Blimp-1/PRDM1, FLASH,
  nuclear receptors, BRCA1 and MRE11. Independently of or in addition to its ligase activity, PIAS1 directly
  binds activated transcription factors and blocks their DNA binding: it was discovered as a specific
  inhibitor of interferon-activated, tyrosine-phosphorylated STAT1 dimers and also inhibits NF-kB p65,
  so Pias1-deficient cells overexpress subsets of interferon- and NF-kB-inducible genes and show enhanced
  innate immune responses. Depending on partner and context PIAS1 can also coactivate transcription (e.g.
  FLASH/c-Myb, androgen receptor). PIAS1 is recruited to DNA double-strand breaks via its SAP domain,
  where with PIAS4 it promotes SUMO accrual, BRCA1/53BP1/RNF168 retention and repair, and it SUMOylates
  MRE11 on chromatin to stabilise it for DNA end resection. PIAS1 localises to the nucleoplasm, nuclear
  speckles and PML nuclear bodies.'
