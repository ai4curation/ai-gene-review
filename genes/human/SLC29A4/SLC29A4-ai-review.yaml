core_functions:
- description: >-
    Low-affinity, high-capacity ("uptake-2"), Na+/Cl--independent, electrogenic
    (membrane-potential-driven) and acid-activated transport of monoamine neurotransmitters
    across the plasma membrane. PMAT is a major extraneuronal uptake-2 transporter for serotonin
    and dopamine (its highest-efficiency substrates), and also transports histamine,
    noradrenaline and adrenaline at lower efficiency, contributing to homeostatic regulation of
    aminergic neurotransmission and astrocytic histamine clearance. Transport is bidirectional,
    with direction set by the substrate gradient and membrane potential.
  molecular_function:
    id: GO:0008504
    label: monoamine transmembrane transporter activity
  directly_involved_in:
  - id: GO:0006836
    label: neurotransmitter transport
  - id: GO:0051610
    label: serotonin uptake
  - id: GO:0090494
    label: dopamine uptake
  - id: GO:0051608
    label: histamine transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:15448143
    supporting_text: PMAT efficiently transports serotonin (K(m) = 114 mum), dopamine (K(m) =
      329 mum), and the neurotoxin 1-methyl-4-phenylpyridinium (K(m) = 33 mum)
  - reference_id: PMID:20858707
    supporting_text: hPMAT, on the other hand, is a major uptake(2) transporter for 5-HT and
      dopamine
- description: >-
    Electrogenic, Na+-independent, acid-activated facilitated transport of
    polyspecific organic cations - quaternary ammonium compounds (tetraethylammonium), the
    parkinsonian neurotoxin MPP+, guanidine, and cationic drugs/xenobiotics (metformin,
    amisulpride, 1-benzyl-TIQ) - across the plasma membrane. This underlies PMAT's role in
    renal and barrier (blood-CSF, blood-brain) handling of organic cations and in clearing
    cationic neurotoxins from the brain. The generic organic-cation transporter MF term
    (GO:0015101) and process term (GO:0015695) are obsolete, so the quaternary-ammonium terms
    are used.
  molecular_function:
    id: GO:0015651
    label: quaternary ammonium group transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015697
    label: quaternary ammonium group transport
  - id: GO:1990748
    label: cellular detoxification
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:16099839
    supporting_text: PMAT transports classic OCT substrates, such as tetraethylammonium,
      guanidine, and histamine
  - reference_id: PMID:23255610
    supporting_text: PMAT may play an important role in protecting the brain from cationic
      neurotoxins
- description: >-
    Low-efficiency, strongly acidic-pH-dependent, bidirectional transport of the
    purine nucleoside adenosine across the plasma membrane. Adenosine is the only nucleoside
    significantly transported by PMAT (at roughly 10-fold lower efficiency than organic
    cations), and this activity is proposed to contribute to regulation of extracellular
    adenosine concentrations, in particular under the acidic conditions of cardiac ischemia.
    This is a genuine secondary activity rather than a core function.
  molecular_function:
    id: GO:0015211
    label: purine nucleoside transmembrane transporter activity
  directly_involved_in:
  - id: GO:0032238
    label: adenosine transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:16873718
    supporting_text: a novel, pH-dependent adenosine transport activity optimal at acidic pH
  - reference_id: PMID:20592246
    supporting_text: adenosine is transported by PMAT at an efficiency (V(max)/K(m)) at least
      10-fold lower than that of the organic cation substrates
proposed_new_terms: []
suggested_questions:
- question: Does PMAT-mediated uptake-2 of serotonin and dopamine make a quantitatively
    significant contribution to monoamine clearance in specific brain regions in vivo, relative
    to the high-affinity uptake-1 transporters (SERT/DAT) and OCT3?
- question: What is the physiological driving force for PMAT transport in vivo - to what extent
    do local tissue acidification (e.g. ischemia, inflammation) and membrane potential modulate
    PMAT activity in native tissues?
- question: Is PMAT's low-efficiency adenosine transport physiologically relevant for cardiac
    adenosine handling during ischemia in vivo, and could selective PMAT inhibition be
    cardioprotective?
suggested_experiments:
- description: Region-specific in vivo microdialysis or fast-scan cyclic voltammetry in
    Slc29a4-/- versus wild-type mice to quantify PMAT's contribution to extracellular serotonin
    and dopamine clearance, with and without SERT/DAT/OCT3 inhibition.
- description: Cryo-EM structure determination of PMAT in substrate-bound and apo states to
    define the organic-cation binding pocket (including the Glu206 charge sensor) and the
    structural basis of acid activation and polyspecificity.
- description: Measure PMAT-mediated adenosine flux and its effect on adenosine-receptor
    signalling in an ex vivo ischemic cardiac model (acidic pH) using isoform-selective
    inhibitors, to test the proposed cardioprotective role.
