- term:
    id: GO:1990748
    label: cellular detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8R139
  - ensembl:ENSMUSP00000059896
  review:
    summary: PMAT contributes to clearance of cationic neurotoxins (MPP+, 1-benzyl-TIQ) from the
      brain/CSF, a detoxification role supported by knockout and neurotoxin-transport studies.
    action: KEEP_AS_NON_CORE
    reason: Detoxification (removal of cationic neurotoxins and xenobiotics) is a genuine
      physiological role of PMAT at the blood-CSF/blood-brain barriers, but it is a downstream
      consequence of its organic-cation transport activity rather than the core molecular
      function.
    supported_by:
    - reference_id: PMID:23255610
      supporting_text: PMAT may play an important role in protecting the brain from cationic
        neurotoxins
