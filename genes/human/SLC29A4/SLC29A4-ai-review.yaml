  review:
    summary: PMAT transports ORGANIC cations (monoamines, MPP+, TEA, guanidine), not monoatomic
      (inorganic) cations. This electronic transfer from mouse Q8R139 most likely descends from
      an old generic "cation transmembrane transporter" annotation that was relabelled to
      "monoatomic cation" after GO split the cation branch.
    action: MODIFY
    reason: The literal monoatomic-cation claim is incorrect for PMAT, but the intended organic
      cation activity is genuine and heavily documented. Replace with the live organic-cation
      MF term (the organic cation transmembrane transporter term GO:0015101 is obsolete), namely
      quaternary ammonium group transmembrane transporter activity, which covers the quaternary
      ammonium / organic cation substrates (MPP+, TEA) that PMAT transports.
    proposed_replacement_terms:
