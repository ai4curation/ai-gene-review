- term:
    id: GO:0005337
    label: nucleoside transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002259
  review:
    summary: Family-level InterPro2GO mapping (ENT signature IPR002259) predicts generic
      nucleoside transporter activity. PMAT does not transport nucleosides generally - only
      adenosine, at ~10-fold lower efficiency than organic cations - so the generic term
      over-states its actual activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ENT family signature predicts nucleoside transport, but PMAT has diverged
      functionally into a polyspecific organic cation/monoamine transporter and transports only
      adenosine among nucleosides. Consistent with this, PAINT records an IRD (loss) of
      nucleoside transporter activity at PANTHER node PTN000035835 on the PMAT lineage
      (2026-08-28), so the nucleoside-transporter function is deliberately not propagated to
      PMAT by phylogeny. The accurate specific activity is adenosine (purine nucleoside,
      GO:0015211) transport.
    supported_by:
    - reference_id: PMID:20592246
      supporting_text: only adenosine was significantly transported by PMAT
    - reference_id: PMID:15448143
      supporting_text: there is no significant interaction of PMAT with nucleosides or nucleobases
- term:
    id: GO:0005337
    label: nucleoside transmembrane transporter activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-727740
  qualifier: enables
  review:
    summary: Reactome event (import of adenosine and biogenic amines by SLC29A4) attaches the
      generic nucleoside transporter activity term. PMAT transports only adenosine among
      nucleosides, so the generic term over-states its specificity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The adenosine-transport component of the Reactome event is real, but PMAT is
      adenosine-selective and is functionally an organic cation transporter, so "nucleoside
      transmembrane transporter activity" is too broad. The specific activity (adenosine, a
      purine nucleoside) is captured by GO:0032238 adenosine transport and would be
