gene_symbol: SLC29A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC29A4 encodes PMAT (plasma membrane monoamine transporter), also named
  equilibrative nucleoside transporter 4 (ENT4), a 530-residue polytopic (11 transmembrane)
  plasma-membrane protein of the SLC29/ENT family (TC 2.A.57). Despite its family
  classification, PMAT functions as a polyspecific "uptake-2" organic cation transporter
  rather than a nucleoside transporter, mediating low-affinity, high-capacity, Na+- and
  Cl--independent, electrogenic (membrane-potential-driven) and pH-sensitive (acid-activated)
  bidirectional transport of monoamine neurotransmitters and other organic cations. Its
  preferred physiological substrates are serotonin and dopamine, with lower-efficiency
  transport of histamine, noradrenaline, adrenaline, tyramine and the parkinsonian neurotoxin
  MPP+, as well as cationic drugs (metformin, amisulpride) and xenobiotics. Among nucleosides
  it transports only adenosine, with roughly 10-fold lower efficiency and in a strongly
  acidic-pH-dependent manner, contributing to regulation of extracellular adenosine, notably
  in ischemic cardiac tissue. PMAT is highly expressed in brain (neurons, astrocytes, choroid
  plexus) and is also found in heart, kidney, intestine and other tissues. It localizes to the
  plasma membrane, apically in polarized epithelia such as the renal tubule and the CSF-facing
  choroid plexus, and on both luminal and abluminal faces of brain microvascular endothelium.
  Functionally it clears monoamines from the extracellular space as part of uptake-2, mediates
  astrocytic histamine clearance, and protects the brain by removing cationic neurotoxins and
  xenobiotics across the blood-CSF and blood-brain barriers.
