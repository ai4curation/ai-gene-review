- term:
    id: GO:0001764
    label: neuron migration
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9CZX0
  - ensembl:ENSMUSP00000153462
  review:
    summary: 'Inferred from mouse Elp3 (Q9CZX0), whose IMP annotation comes from in utero knockdown in
      developing cortex (PMID:19185337): Elp3 silencing delays radial migration and impairs branching
      of projection neurons. Ensembl Compara IEA transfer.'
    action: KEEP_AS_NON_CORE
    reason: The developmental requirement is real and cell-autonomous, but ELP3 does not do the work
      of neuron migration; its activity is wobble-uridine tRNA modification, and the migration
      defect is a downstream consequence (originally attributed to alpha-tubulin acetylation, which
      later work places at the level of codon-dependent translation of the tubulin
      acetyltransferase). Kept as a non-core, pleiotropic developmental process; not core to ELP3.
    supported_by:
    - &id001
      reference_id: PMID:19185337
      supporting_text: silencing of its scaffold (Elp1) or catalytic subunit (Elp3)
        cell-autonomously delays the migration and impairs the branching of projection neurons
    - &id002
      reference_id: PMID:27847465
      supporting_text: Elongator is not a direct tubulin acetytransferase, but it rather regulates
        the expression of α-tubulin acetyltransferase at translational level
