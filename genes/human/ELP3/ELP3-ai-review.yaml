id: Q9H9T3
gene_symbol: ELP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELP3 is the catalytic subunit of Elongator, a conserved six-subunit complex (ELP1-ELP6)
  in which an ELP1-ELP2-ELP3 core associates with an ELP4-ELP5-ELP6 ring. ELP3 combines an
  N-terminal radical S-adenosyl-L-methionine (SAM) domain, carrying a [4Fe-4S] cluster ligated by
  three cysteines and SAM, with a C-terminal GNAT-family acetyltransferase domain; the two form a
  composite active site and tRNA-binding pocket. Using SAM-derived radical chemistry on acetyl-CoA,
  ELP3 attaches a carboxymethyl group to C5 of uridine 34 in the anticodon of a subset of cytosolic
  tRNAs (including tRNA-Lys-UUU, tRNA-Gln-UUG and tRNA-Glu-UUC), forming 5-carboxymethyluridine
  (cm5U34, EC 2.3.1.311). This is the first step toward the wobble modifications ncm5U, mcm5U and
  mcm5s2U, which are needed for efficient and accurate decoding of A- and G-ending codons. Elongator
  acts mainly in the cytosol, with a small nuclear pool. Elongator was first described as a histone
  H3/H4 acetyltransferase that assists RNA polymerase II elongation, and ELP3 has also been linked
  to acetylation of alpha-tubulin and other proteins; these effects are now largely attributed to
  altered translation after loss of tRNA modification. Loss of ELP3 function impairs cortical
  neurogenesis and neuron migration in mouse, and ELP3 variants are associated with amyotrophic
  lateral sclerosis, where ELP3 acts as a disease modifier.
