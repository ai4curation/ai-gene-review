core_functions:
- description: Catalytic subunit of Elongator that forms 5-carboxymethyluridine at the wobble
    position (U34) of cytosolic tRNAs, combining radical SAM chemistry with acetyl-CoA in a
    composite radical SAM/GNAT active site (EC 2.3.1.311); this is the first step of ncm5U, mcm5U
    and mcm5s2U formation.
  molecular_function: *id015
  directly_involved_in:
  - id: GO:0002098
    label: tRNA wobble uridine modification
  locations:
  - *id008
  in_complex:
    id: GO:0033588
    label: elongator holoenzyme complex
  supported_by:
  - *id023
  - *id024
  - *id017
  - *id003
- description: Binds the radical SAM [4Fe-4S] cluster (three cysteine ligands plus SAM) that is the
    catalytic cofactor for the U34 carboxymethylation reaction.
  molecular_function: *id026
  supported_by:
  - *id025
  - *id022
- description: Binds S-adenosyl-L-methionine as the radical-generating cosubstrate, which is
    reductively cleaved to a 5'-deoxyadenosyl radical during cm5U34 formation.
  molecular_function:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  supported_by:
  - *id027
  - *id025
suggested_questions:
- question: Does human ELP3 have any direct protein lysine acetyltransferase activity in vivo
    (alpha-tubulin, connexin-43, Bruchpilot homologues, histones), or are all reported
    protein-acetylation changes secondary to altered codon-dependent translation after loss of U34
    modification?
- question: Does the nuclear pool of ELP3 (including the nuclear-specific larger isoform) have a
    distinct function, or is it inactive storage of the complex?
- question: Is DPH3 (the KTI11 orthologue) the physiological electron donor that reduces the ELP3
    [4Fe-4S] cluster in human Elongator, as in yeast?
- question: Should the historic GO:0006357 and GO:0005730 assignments to human ELP3 be revisited by
    the contributing group in light of the tRNA-bypass evidence?
suggested_experiments:
- hypothesis: Human ELP3, within the reconstituted ELP1-ELP6 holoenzyme, directly catalyses cm5U34
    formation from acetyl-CoA and SAM.
  description: Reconstitute recombinant human Elongator with chemically reconstituted [4Fe-4S] ELP3,
    a reductant (DPH3 or dithionite), SAM, labelled acetyl-CoA and unmodified tRNA-Lys-UUU; detect
    cm5U34 and 5'-deoxyadenosine by LC-MS, and test radical SAM cysteine and GNAT active-site
    mutants.
- hypothesis: Reduced alpha-tubulin acetylation and neuron-migration defects after ELP3 loss are
    caused by loss of U34 modification rather than direct protein acetylation.
  description: In ELP3-depleted human neural progenitors, test whether overexpression of
    hypomodified tRNA-Lys-UUU and tRNA-Gln-UUG rescues alpha-tubulin K40 acetylation, ATAT1 protein
    level and migration, compared with re-expression of catalytically inactive ELP3.
