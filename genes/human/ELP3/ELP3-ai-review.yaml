  review:
    summary: 'ELP3 is a radical SAM enzyme: SAM binds the unique iron of the [4Fe-4S] cluster and is reductively
      cleaved to a 5''-deoxyadenosyl radical that initiates the U34 carboxymethylation.'
    action: NEW
    reason: >-
      Not in GOA. SAM cosubstrate binding is intrinsic to the ELP3 reaction (EC 2.3.1.311 consumes SAM)
      and is shown biochemically for archaeal Elp3; UniProt records the cluster as coordinated by an exchangeable
      SAM. Comparator check, against GOA rather than against this project's own proposals: GOA does annotate
      GO:1904047 to radical SAM enzymes in exactly this role, by UniRule -- ECOLI/queE (UR000100349),
      ECOLI/moaA and PSEPK/moaA (UR000101305), METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence
      here is patchy UniRule coverage, which rules happen to carry the term, not a GO convention against
      annotating a radical SAM enzyme's own cosubstrate. That is also why those five genes have an existing
      row to ACCEPT or MODIFY while this one needs a NEW row.
    supported_by:
    - &id027
      reference_id: PMID:25151136
      supporting_text: Association of tRNA with Elp3 allows 5′-dA• to be generated from SAM in the
        radical SAM domain of Elp3
