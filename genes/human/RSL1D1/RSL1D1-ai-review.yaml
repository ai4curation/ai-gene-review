gene_symbol: RSL1D1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RSL1D1 (ribosomal L1 domain-containing protein 1; also called CSIG, cellular
  senescence-inhibited gene) is a nucleolar RNA-binding protein with an N-terminal,
  highly divergent ribosomal uL1-like domain and a C-terminal lysine-rich region.
  It belongs to a eukaryotic uL1-like subfamily that also includes yeast Utp30, but no
  role in human ribosome biogenesis has been shown experimentally. Its nucleolar
  retention depends on RNA, and it moves to the nucleoplasm under nucleolar stress.
  Experiments in human cells show that RSL1D1 binds specific mRNAs. It binds the PTEN
  5' untranslated region and represses PTEN translation; through this route it promotes
  proliferation and delays replicative senescence. It binds the 3' untranslated regions
  of PPARG and FTH1 mRNAs and stabilizes them. RSL1D1 also partners with nucleolar and
  stress-signalling proteins. It helps retain nucleostemin (GNL3) in the nucleolus,
  binds p33ING1 in UV-induced apoptosis, and binds MDM2/HDM2 and p53. Studies disagree
  on whether the MDM2 interaction raises or lowers p53 levels. RSL1D1 is imported into
  the nucleus by importin-alpha (KPNA2/KPNA7), and loss of the mouse gene in oocytes
  arrests preimplantation embryo development.
