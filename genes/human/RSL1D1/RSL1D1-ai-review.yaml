- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IDA
  original_reference_id: PMID:18678645
  qualifier: involved_in
  review:
    summary: >-
      The cited paper (Ma et al. 2008) has no apoptosis experiments; the cached full
      text never uses the word. The apoptosis evidence is in Li et al. 2012
      (PMID:22419112), where CSIG is required for p33ING1-driven UV-induced apoptosis
      via BAX. In colorectal cancer cells, by contrast, RSL1D1 knockdown itself induces
      p53-dependent apoptosis.
    action: KEEP_AS_NON_CORE
    reason: >-
      RSL1D1 does regulate apoptosis, but the direction depends on context: it is
      pro-apoptotic after UV with p33ING1 and pro-survival in colorectal cancer cells.
      The undirected "regulation of" term is therefore as precise as the evidence
      allows. The effect is downstream of RSL1D1's binding partners, so it is not core.
      The reference appears to be mis-keyed.
    supported_by:
    - reference_id: PMID:22419112
      supporting_text: p33ING1-CSIG axis functions as a novel pro-apoptotic regulator in
        response to DNA damage
    - reference_id: PMID:34362424
      supporting_text: Silencing of RSL1D1 gene induced cell cycle arrest at G1/S and cell
        apoptosis in a p53-dependent manner
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:18678645
      corrected_value: PMID:22419112
      cause: UNKNOWN
