- id: file:human/RSL1D1/RSL1D1-uniprot.txt
  title: UniProt entry O76021 (RSL1D1)
  findings: []
core_functions:
- description: >-
    RSL1D1 binds the 5' untranslated region of specific mRNAs and represses their
    translation; PTEN is the best-characterized target. Repressing PTEN translation
    promotes proliferation and delays replicative senescence in human fibroblasts.
    This activity is established experimentally in human cells only.
  molecular_function:
    id: GO:0048027
    label: mRNA 5'-UTR binding
  directly_involved_in:
  - id: GO:0017148
    label: negative regulation of translation
  supported_by:
  - reference_id: PMID:18678645
    supporting_text: CSIG interacted with PTEN mRNA in the 5' untranslated region
  - reference_id: PMID:18678645
    supporting_text: exhibited an ∼2.5-fold increase in luciferase activity in CSIG-silenced
      cells
- description: >-
    RSL1D1 binds the 3' untranslated regions of target mRNAs (PPARG, FTH1) and
    stabilizes them. This is established in human cells by two independent groups.
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  directly_involved_in:
  - id: GO:0048255
    label: mRNA stabilization
  supported_by:
  - reference_id: PMID:35940221
    supporting_text: RSL1D1 directly interacts with the 3'-untranslated region of PPARγ
      mRNA, and then promotes its stability
  - reference_id: PMID:36913375
    supporting_text: RSL1D1 directly bounds with 3' untranslated region of FTH1 and subsequently
      promoted the mRNA stability
- description: >-
    RSL1D1 is a nucleolar RNA-binding protein with a divergent uL1-like domain, and it
    is held in the nucleolus by RNA. This general nucleolar RNA-binding role is the
    part that is conserved across the uL1-like biogenesis subfamily (PAINT IBA for RNA
    binding and nucleolus). It is the only part that can reasonably be transferred to
    divergent relatives.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: PMID:27811966
    supporting_text: the nucleolar localization of CSIG depends on rRNA
  - reference_id: PMID:18678645
    supporting_text: human CSIG is predominantly localized in the nucleolus
  - reference_id: PMID:22658674
    supporting_text: We identify 860 proteins that qualify as RBPs by biochemical and
      statistical criteria
suggested_questions:
- question: >-
    Does human RSL1D1 take part in pre-rRNA processing or small-subunit processome
    assembly, as its same-subfamily yeast relative Utp30 does, or has the human protein
    moved to regulating mRNA? PAINT propagated only RNA binding and nucleolus, and no
    human pre-rRNA processing data were found.
- question: >-
    Does RSL1D1 raise or lower p53 through MDM2/HDM2? Xie et al. 2016 report inhibition
    of MDM2 ligase activity, and Li et al. 2021 report recruitment of p53 to HDM2 and
    increased p53 degradation. Is the difference due to cell type, stress state or
    nucleolar versus nucleoplasmic pools?
- question: What RNA does RSL1D1 bind in the nucleolus, given that RNase treatment releases it?
suggested_experiments:
- hypothesis: The uL1-like domain of RSL1D1 binds rRNA in pre-ribosomal particles.
  description: >-
    Run CLIP or CRAC of endogenous RSL1D1 in human cells to map nucleolar RNA targets,
    with sucrose-gradient co-sedimentation against pre-60S and SSU-processome markers,
    and Northern blotting of pre-rRNA intermediates after RSL1D1 depletion.
  experiment_type: RNA-protein crosslinking
- hypothesis: RSL1D1 directly represses PTEN translation by binding a defined 5'-UTR element.
  description: >-
    Run EMSA or ITC with purified RSL1D1 and PTEN 5'-UTR fragments, then test
    point-mutant reporters in RSL1D1-knockout cells complemented with uL1-domain mutants.
  experiment_type: binding assay
