- term:
    id: GO:2000772
    label: regulation of cellular senescence
  evidence_type: IDA
  original_reference_id: PMID:18678645
  qualifier: involved_in
  review:
    summary: >-
      Overexpressing CSIG/RSL1D1 delays replicative senescence in human fibroblasts and
      knocking it down accelerates it. The effect requires PTEN, whose translation
      RSL1D1 represses. The PPARG mRNA-stabilization work supports the same direction.
    action: MODIFY
    reason: >-
      The direction is consistently negative, so the undirected term is too general and
      GO:2000773 is the better term. The effect is mediated by translational repression
      of PTEN and stabilization of target mRNAs, so RSL1D1 acts as a regulator rather
      than a direct executor of the senescence program.
    proposed_replacement_terms:
    - id: GO:2000773
      label: negative regulation of cellular senescence
    supported_by:
    - reference_id: PMID:18678645
      supporting_text: overexpression of CSIG significantly delayed the progression of replicative
        senescence, while knockdown of CSIG expression accelerated replicative senescence
    - reference_id: PMID:26686419
      supporting_text: both ribosomal L1 domain and Lys-rich region of CSIG are critical
        for CSIG to act as a regulator of cell proliferation and cellular senescence
- term:
    id: GO:0017148
    label: negative regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:18678645
  qualifier: involved_in
  review:
    summary: >-
      RSL1D1 binds the PTEN 5' UTR, is present in the polysome fraction, and represses
      translation through the PTEN 5' UTR: the reporter rose about 2.5-fold after
      knockdown, and competitor 5'-UTR fragments relieved the repression.
    action: NEW
    reason: >-
      RSL1D1 itself binds the regulatory element and represses translation of the
      bound mRNA, so it does the regulatory work. It is not just required upstream.
      This is the mechanistic link between its 5'-UTR binding and its effect on
      senescence. The repression is target-specific (PTEN), and nothing here suggests
      a general role in translation.
    supported_by:
    - reference_id: PMID:18678645
      supporting_text: exhibited an ∼2.5-fold increase in luciferase activity in CSIG-silenced
        cells
    - reference_id: PMID:18678645
      supporting_text: CSIG was also present in the polysomal fraction
