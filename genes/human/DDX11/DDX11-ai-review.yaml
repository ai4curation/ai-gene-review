core_functions:
- description: ATP-driven 5-prime to 3-prime unwinding of DNA with accessible loading regions,
    including forked duplexes, D-loops and selected G-quadruplex substrates. At nuclear replication
    sites, DDX11 supports recovery of stalled forks and establishment of sister-chromatid
    cohesion.
