id: Q96FC9
gene_symbol: DDX11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DDX11 is an ATP-dependent DNA helicase associated with nuclear chromatin. Purified
  human protein unwinds DNA in the 5-prime to 3-prime direction, using accessible single-stranded
  loading regions and showing substrate-dependent activity on forked duplexes, D-loops and
  selected G-quadruplexes. DDX11 supports replication under stress and sister-chromatid cohesion,
  with both catalytic and protein-association contributions under investigation. A nucleolar
  pool participates in ribosomal chromatin regulation. Pathogenic variants cause Warsaw breakage
  syndrome.
