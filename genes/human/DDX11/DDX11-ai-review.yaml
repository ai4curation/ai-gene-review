    reason: PMID:23797032 follows an induced I-PpoI break and DNA-damage markers after depletion.
      Repair is delayed, supporting the regulatory assertion. The authors explicitly cannot
      exclude secondary effects of cohesion defects; a direct DDX11 repair reaction is not
      established here.
