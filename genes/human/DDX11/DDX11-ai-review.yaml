suggested_questions:
- question: Which DDX11 splice products are present in the nuclear and nucleolar pools, and
    which retain the measured helicase activity? Historical constructs and antibody epitopes
    do not establish equivalence across all five products.
- question: Does CONCR-stimulated ATP hydrolysis drive a specific RNA-dependent reaction,
    and are the broad CONCR-dependent chromatin domains associated with defined replication
    origins?
- question: Which physiological contributions of DDX11 to cohesion depend on helicase catalysis,
    and which depend on protein associations such as FEN1 or the replisome?
- question: Which physiological substrates, if any, correspond to the DNA/RNA-hybrid unwinding
    capacity measured with short RNA oligonucleotides on DNA loading strands? The historical
    assays do not establish RNA/RNA unwinding or a native R-loop-processing role.
