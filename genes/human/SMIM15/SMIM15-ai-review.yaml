description: >-
  SMIM15 (formerly C5orf43) is a 74-amino-acid (about 8.6 kDa) protein of the SMIM15
  family (Pfam UPF0542). It has a single predicted transmembrane helix (residues 20-40)
  followed by a predicted coiled-coil region and a short, disordered C-terminal tail rich
  in lysine and arginine. The transcript is detected in all tissues, with highest
  single-cell levels in oesophageal epithelium. The membrane in which SMIM15 resides, its
  orientation, and any binding partner, molecular activity or biological process are
  unknown; the gene appears in the literature only within multi-gene expression and
  genomic signatures.
