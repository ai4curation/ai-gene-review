suggested_questions:
- question: >-
    Where does endogenous SMIM15 reside, and does its basic C-terminal tail face the
    cytosol as the positive-inside rule would predict?
suggested_experiments:
- hypothesis: SMIM15 is an integral membrane protein of a defined organelle.
  description: >-
    Determine the localisation of endogenously tagged SMIM15 in an oesophageal epithelial
    cell line by co-staining with organelle markers, confirm membrane integration by
    carbonate extraction, and determine topology by protease protection.
