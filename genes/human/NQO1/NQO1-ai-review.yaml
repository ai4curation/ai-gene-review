id: P15559
gene_symbol: NQO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NQO1 (NAD(P)H dehydrogenase [quinone] 1, also called DT-diaphorase) is a cytosolic FAD-dependent
  homodimeric flavoprotein that transfers hydride from NADH or NADPH to quinones in obligate two-electron
  reactions, generating hydroquinones while bypassing semiquinone radical formation. Its broad active
  site reduces endogenous and xenobiotic quinones, including alpha-tocopherolquinone, ubiquinone and menadione-like
  vitamin K compounds, and it can either detoxify redox-cycling quinones or bioactivate quinone-containing
  prodrugs depending on the substrate. NQO1 also binds a subset of intrinsically unstable proteins, including
  TP53, TP73, ING1 and an alternative PDLIM4/RIL isoform, and protects them from ubiquitin-independent
  degradation by the 20S proteasome.'
