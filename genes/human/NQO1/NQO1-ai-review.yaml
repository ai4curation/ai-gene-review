core_functions:
- description: FAD-dependent cytosolic homodimer that uses NADH or NADPH to catalyze the
    two-electron reduction of quinones to hydroquinones/quinols, supporting detoxification or
    bioactivation of quinone substrates while bypassing semiquinone radical formation.
  molecular_function:
    id: GO:0003955
    label: NAD(P)H dehydrogenase (quinone) activity
  directly_involved_in:
  - id: GO:1901662
    label: quinone catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:9271353
    supporting_text: reactions with purified human NQO1, TQ was reduced to TQH2
  - reference_id: PMID:25143260
    supporting_text: human cytosolic FAD-dependent enzyme
suggested_questions:
- question: Which endogenous quinone substrates dominate NQO1 flux in different human tissues, and
    when does NQO1-mediated two-electron reduction detoxify a quinone versus generate a redox-active
    or cytotoxic hydroquinone?
- question: Which 20S proteasome substrates are directly protected by the NQO1 homodimer in
    unperturbed human cells, and how strongly is that protection coupled to NADH/FAD occupancy
    rather than the quinone reductase catalytic cycle itself?
suggested_experiments:
- description: Perform isotope-tracing metabolomics in NQO1-null and rescue human cells challenged
    with endogenous and xenobiotic quinones to measure substrate-specific hydroquinone formation and
    distinguish detoxifying from bioactivating products.
- description: Use separation-of-function NQO1 variants that preserve homodimerization but alter
    FAD/NADH binding or hydride transfer to test whether TP53, TP73, ING1 and PDLIM4 stabilization
    require catalytic turnover or nucleotide/flavin-dependent target binding.
