suggested_questions:
- question: How do FANCB–FAAP100 and FANCB–FANCB contacts contribute to assembly and activity of endogenous
    human BL100 and the complete FA core, and how does that architecture vary with complex composition?
- question: Which human FANCB pools are directly recruited to damaged chromatin, and what distinguishes
    the repair-associated nuclear assembly from the positively observed cytosolic module?
suggested_experiments:
- description: Introduce structure-guided FANCB interface substitutions in a defined human BL100 reconstitution
    and at the endogenous locus. Measure complex composition, partner stability and FANCL/UBE2T-dependent
    FANCI–FANCD2 monoubiquitination together, with matched expression and folding controls, to distinguish
    an assembly defect from an effect on the assembled catalytic machinery.
- description: Endogenously tag human FANCB and combine damage-dependent imaging with validated nuclear,
    chromatin and cytosolic fractionation, orthogonal untagged-antibody controls and matched complex recovery.
    Relate the measured FANCB pools to interstrand-crosslink response without using FANCA, FANCG or FAAP20
    localization as a proxy.
