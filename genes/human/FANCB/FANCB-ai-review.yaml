- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17396147
  qualifier: enables
  review:
    summary: FANCB is an integral structural scaffold of the FANCL–FAAP100 module.
    action: MODIFY
    reason: The imported WITH partner Q0VG06 is FAAP100. In PMID:17396147, human HEK293 mammalian two-hybrid
      assays support FANCB–FAAP100 association, while stable FLAG-FANCB permits a strong FAAP100–FANCL
      three-hybrid signal (Figure 2A/B; mammalian hybrid Methods). Human HeLa FLAG/His-FANCL purifications
      recover the stable FANCB–FANCL–FAAP100 module from nuclear and cytosolic extracts (Figure 2C/D).
      These cellular and purified-complex results should not be described as a purified binary binding
      measurement. Independently, recombinant human BL100 expressed in Sf9 cells retains its dimer interface
      after FANCL dropout, and crosslinking MS connects FANCB to both FANCL and FAAP100 (PMID:27986592,
      Results on FANCB-mediated assembly and the subunit-dropout experiments, Figures 2/3 and XL/MS Methods).
      That paper could not demonstrate self-association of isolated FANCB; its evidence concerns FANCB
      within the assembled module. Together these data support FANCB as an integral component holding
      the BL100 protein complex together, matching GO:0140378 protein complex scaffold activity. The current
      GO:0030674 comment explicitly directs protein-complex scaffold roles to GO:0140378; the stable assembled-module
      role here therefore supports the scaffold term rather than the broad adaptor term. They do not assign
      FANCL ubiquitin-ligase chemistry, the FANCE–ID2 substrate bridge, an autonomous FANCB homodimer,
      or an invariant whole-core stoichiometry to FANCB. Exact equivalence of the historical constructs
      to the current 859-residue sequence was not established. The informative structural scaffold activity
      is supported independently of generic binding; a substrate-specific adaptor term is not justified.
    supported_by:
    - reference_id: PMID:17396147
      supporting_text: directly interacts with FANCB and FANCL to form a stable subcomplex
    - reference_id: PMID:27986592
      supporting_text: FANCB plays a key structural function, being the dimerization factor
    proposed_replacement_terms:
    - id: GO:0140378
      label: protein complex scaffold activity
