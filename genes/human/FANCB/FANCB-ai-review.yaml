    label: interstrand cross-link repair
  evidence_type: NAS
  original_reference_id: PMID:19965384
  qualifier: involved_in
  review:
    summary: FANCB contributes structurally to the FA core required for interstrand cross-link repair.
    action: ACCEPT
    reason: 'The current GO:0036297 definition covers removal of a DNA interstrand cross-link and restoration
      of DNA. PMID:19965384 is pathway-level support: the inspected main experiments use Xenopus egg extracts
      and recombinant Xenopus FANCI–FANCD2 to establish replication-coupled incision and lesion-bypass
      requirements, rather than directly measuring human FANCB catalysis. Independent human FANCB evidence
      places it in the FA core and establishes its organizing role in the FANCL–FAAP100 module (PMID:17396147,
      Figure 2; PMID:27986592, human BL100 assembly, dropout and crosslinking experiments). This is structural
      participation in the repair machinery, not merely being a substrate or an incidental damage-response
      correlate. Retain the broad ICL-repair annotation because the actual FANCB work supports assembly
      of the repair-activating core but does not identify FANCB as the enzyme executing a narrower incision,
      translesion-synthesis or ubiquitin-transfer step. The inherited ID2 quotation is preserved with
      its Xenopus target scope, and no human FANCB incision assay is inferred from it.'
    supported_by:
    - reference_id: PMID:19965384
      supporting_text: FANCI-FANCD2 is required for replication-coupled ICL repair in S phase
