  review:
    summary: The inspected chromatin experiment does not resolve the imported FANCB-specific localization
      claim.
    action: UNDECIDED
    reason: PMID:22343915 establishes FANCB membership of the human nuclear FA core, including the FANCB-labelled
      bands in Figure 1A/B. That membership is distinct from localization to chromatin, an organized DNA-protein
      chromosome component under the current GO:0000785 definition. The actual Figure 5H panel, caption
      and accompanying chromatin-loading Results identify FANCA, FANCG and FAAP20 in HeLa fractions, with
      H2A as the chromatin control; they do not directly identify FANCB in that experiment. The authentic
      supplemental PDF was subsequently recovered through BioStudies and read in full as extracted text,
      with Figure S1 pixels also inspected. Its cellular-fraction Methods cite an earlier protocol, while
      Figure S1C independently shows FANCB in a FAAP20 co-immunoprecipitate; that is positive complex
      membership rather than a FANCB-labelled chromatin fraction. No verified FANCB-specific chromatin
      readout was identified in the inspected main and supplement. This does not establish that FANCB
      is excluded from chromatin or that the curator used the wrong gene. The inherited supporting quotation
      specifically concerns FANCA and remains unchanged as historical source context; it is not direct
      FANCB localization evidence. Without verified target-specific operative evidence for this source
      claim, retain UNDECIDED rather than rejecting the experimental annotation.
    supported_by:
    - reference_id: PMID:22343915
      supporting_text: required for DNA-damage-induced chromatin loading of FANCA
