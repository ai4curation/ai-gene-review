id: Q8NB91
gene_symbol: FANCB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCB is an integral, nonenzymatic scaffold of the Fanconi anaemia core complex. It organizes
  FANCL and FAAP100 into the BL100 module, supporting the architecture that enables FANCL and UBE2T to
  monoubiquitinate FANCI–FANCD2 during DNA interstrand cross-link repair. Human cellular purifications
  recover FANCB-containing assemblies from both nuclear and cytosolic fractions. Reconstitution supports
  a FANCB-dependent interface within the assembled module, without demonstrating self-association of isolated
  FANCB or one universal core stoichiometry. Mouse Fancb genetics also implicates this machinery in lesion-
  and genetic-background-dependent homologous-recombination and replication-fork responses. Pathogenic
  FANCB variants cause X-linked Fanconi anemia.
