description: ARMCX6 is a 300-residue eutherian-specific armadillo-repeat protein of the X-linked ARMCX
  cluster, which arose from the ancestral gene ARMC10. Like its relatives it has an N-terminal transmembrane
  segment, and its mouse ortholog is mitochondrial. GFP-tagged ARMCX6 is cytoplasmic in HeLa cells. It
  is expected to share the family's role in regulating mitochondrial dynamics and axonal transport, although
  ARMCX6 itself has not been tested. Its transcript is enriched in pancreas and spleen.
