suggested_questions:
- question: How is TMED10 partitioned between its cargo-receptor role and its unconventional-secretion
    channel role, and what regulates the oligomeric channel state?
suggested_experiments:
- description: Reconstitute TMED10 oligomers in proteoliposomes to measure protein-translocation channel
    activity and cargo selectivity, and map COPII cargo dependence in TMED10/TMED2 double-depleted cells.
