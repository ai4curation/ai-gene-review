id: P49755
gene_symbol: TMED10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TMED10 (TMP21 / p23 / p24-delta) is a type I single-pass membrane glycoprotein of the p24/emp24/gp25L
  family that acts as a cargo receptor in the early secretory pathway. Through its lumenal GOLD domain
  it selects secretory cargo - notably GPI-anchored proteins, together with TMED2 - for packaging into
  COPII vesicles, and through its cytoplasmic tail it binds COPI and COPII coats and the ARF1 GTPase,
  participating in vesicle coat formation; it cycles between the endoplasmic reticulum, the ER-Golgi intermediate
  compartment and the Golgi. TMED10 can also oligomerize into a protein-conducting channel that translocates
  leaderless cytoplasmic proteins (such as IL-1beta) into the ERGIC for unconventional secretion, and
  it is a component of the presenilin/gamma-secretase complex that modulates its activity.
