core_functions:
- description: >-
    Mitochondrial restraint of the permeability transition pore. ARHGAP11B is imported into the
    mitochondrial matrix, where it binds the inner-membrane ADP/ATP translocases SLC25A4 and
    SLC25A5 and delays opening of the mitochondrial permeability transition pore. The consequence
    is a raised mitochondrial calcium concentration and induction of glutaminolysis, the routing of
    glutamine through glutamate into the TCA cycle, which is the metabolic state characteristic of
    highly proliferative cells. Pharmacological inhibition of ANT function or of mPTP opening
    reproduces the downstream effect, and removing the protein from mitochondria abolishes it, so
    the localisation is functionally required rather than incidental. The molecular function is
    recorded as transmembrane transporter binding because that is what the cited experiment
    measures; whether ARHGAP11B additionally inhibits ANT-mediated transport, which would license
    GO:0141110, is raised as a question rather than asserted, since the cached record is
    abstract-only.
  molecular_function:
    id: GO:0044325
    label: transmembrane transporter binding
  directly_involved_in:
  - id: GO:0035795
    label: negative regulation of mitochondrial membrane permeability
  - id: GO:0006543
    label: L-glutamine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:31883789
    supporting_text: >-
      Here, we show that ARHGAP11B is imported into mitochondria, where it interacts with the
      adenine nucleotide translocase (ANT) and inhibits the mitochondrial permeability transition
      pore (mPTP).
  - reference_id: PMID:31883789
    supporting_text: >-
      BP expansion by ARHGAP11B requires its presence in mitochondria, and pharmacological
      inhibition of ANT function or mPTP opening mimic BP expansion by ARHGAP11B.
  - reference_id: PMID:31883789
    supporting_text: >-
      Searching for the underlying metabolic basis, we find that BP expansion by ARHGAP11B requires
      glutaminolysis, the conversion of glutamine to glutamate for the tricarboxylic acid (TCA)
      cycle.
- description: >-
    Amplification of cortical basal progenitors, the organismal function the mitochondrial mechanism
    serves. In fetal human neocortex ARHGAP11B is expressed specifically in apical and basal radial
    glia and is absent from cortical neurons and cortical plate. Interfering with it in human
    cerebral organoids reduces cycling basal progenitors to chimpanzee levels, and ARHGAP11A cannot
    substitute, so the requirement is specific to the human-specific paralog. Conversely, expressing
    it increases basal progenitor proliferation and abundance in mouse, ferret and marmoset
    neocortex, enlarging the neocortex and, in gyrencephalic species, inducing folding. The two
    directions are recorded together deliberately: the gain-of-function results were obtained in
    non-human systems and the loss-of-function results in human cells, and neither alone would
    establish the function. No molecular function is asserted for this core function - ARHGAP11B has
    no catalytic activity, and its effect on progenitors is the downstream consequence of the
    mitochondrial activity above rather than a second biochemical capability.
  directly_involved_in:
  - id: GO:2000179
    label: positive regulation of neural precursor cell proliferation
  - id: GO:0021987
    label: cerebral cortex development
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:36098218
    supporting_text: >-
      Conversely, interference with ARHGAP11B's function in human cerebral organoids decreases basal
      progenitors down to the chimpanzee level.
  - reference_id: PMID:36098218
    supporting_text: >-
      Moreover, ARHGAP11A or ARHGAP11B rescue experiments in ARHGAP11A plus ARHGAP11B
      double-knockout human forebrain organoids indicate that lack of ARHGAP11B, but not of
      ARHGAP11A, decreases the abundance of basal radial glia-the basal progenitor type thought to
      be of particular relevance for neocortex expansion.
  - reference_id: PMID:25721503
    supporting_text: >-
      Expression of ARHGAP11B in embryonic mouse neocortex promotes basal progenitor generation and
      self-renewal and can increase cortical plate area and induce gyrification.
- description: >-
    Loss of Rho GTPase-activating activity, recorded here because for this gene the absence is the
    function. ARHGAP11B retains most of the ARHGAP11A Rho-GAP fold and the canonical catalytic
    arginine finger at residue 87, yet has no RhoGAP activity in intact cells. The reconstructed
    ancestral protein, which differs by a single nucleotide and has a complete GAP domain, does have
    RhoGAP activity and does not amplify basal progenitors, so activity and progenitor amplification
    are anti-correlated and the truncation is the gain-of-function event rather than damage. Two
    curated NOT annotations encode this, and it is why the Reactome-derived GO:0005096 and
    GO:0051056 rows and the InterPro-derived GO:0007165 row are all removed above. Stated as a core
    function without a molecular_function term, since GO has no way to assert the loss of an
    activity in that slot.
  supported_by:
  - reference_id: PMID:27957544
    supporting_text: >-
      Modern ARHGAP11B lacks RhoGAP activity in intact cells (23) and exhibits only very low RhoGAP
      activity in a cell-free assay.
  - reference_id: PMID:27957544
    supporting_text: >-
      However, similar to ARHGAP11A (23), ancestral ARHGAP11B did not exert any effect on mitotic BP
      abundance (Fig. 3).
suggested_questions:
- question: >-
    GOA currently ships a direct contradiction for ARHGAP11B: two IDA rows asserting NOT|enables
    GO:0005096 and one Reactome TAS row asserting enables GO:0005096, plus a Reactome TAS row for
    GO:0051056 that the NOT|involved_in GO:0043547 row contradicts. Should Reactome remove
    ARHGAP11B from the "RHOA GAPs" defined catalyst set of R-HSA-8981637 and from the RHO GTPase
    cycle participant list? And separately, should the GOA pipeline refuse to emit a positive
    annotation for a term that the same gene already carries as a curated NOT from experimental
    evidence? The second question generalises well beyond this gene.
  experts: []
- question: >-
    Does ARHGAP11B inhibit ANT-mediated adenine nucleotide transport, or does it inhibit mPTP
    opening without inhibiting transport? PMID:31883789 reports that pharmacological inhibition of
    ANT function mimics the ARHGAP11B effect, which suggests the former, but the cached record is
    abstract-only and the two claims are distinct. If transport inhibition is shown in the full
    text, GO:0141110 transporter inhibitor activity would be a better molecular function than the
    GO:0044325 transmembrane transporter binding proposed here.
  experts: []
- question: >-
    UniProt's Rho-GAP DOMAIN feature on ARHGAP11B is annotated as 49..250, which extends 30 residues
    past residue 220, the last position homologous to ARHGAP11A, and therefore into the
    human-specific frameshift C-terminus that is homologous to nothing. The effect is that the
    annotated domain on the inactive truncated paralog (202 aa) is longer than the annotated domain
    on the catalytically active parent ARHGAP11A (49..239, 191 aa). Should the ARHGAP11B feature be
    truncated at the end of homology, and should the interpro2go line from IPR000198 to GO:0007165
    be gated on something other than a profile match for family members curated as inactive?
  experts: []
- question: >-
    Is there a GO-sanctioned way to state that a protein has retained a catalytic residue while
    losing the activity? ARHGAP11B keeps the canonical arginine finger at position 87 - UniProt
    annotates the Site, and it aligns reciprocally to both ARHGAP11A's and ARHGAP1's own annotated
    fingers - yet has no GAP activity. Pipelines and reviewers that gate catalytic terms on residue
    presence will get this gene wrong in the permissive direction, and 60 of 66 reviewed human
    RhoGAP-profile proteins have an arginine at that position, so the residue carries little
    discriminating information in this family.
  experts: []
- question: >-
    PAINT gave ARHGAP11B nothing - UniProt records zero PAN-GO annotations and GOA contains no IBA
    row for this gene - even though PANTHER places it in PTHR15670:SF4, a subfamily named "RHO
    GTPASE-ACTIVATING PROTEIN 11A" that it shares with its active paralog, which does receive
    GO:0005096 by IBA. That restraint is correct and is worth recording as a positive example: the
    paralog leak that PAINT avoided arrived through Reactome instead. Is the ARHGAP11B exclusion
    documented as a deliberate PAINT decision, so that a future re-run of the family does not
    reinstate it?
  experts: []
- question: >-
    Should the neurobehavioural phenotypes of ARHGAP11B-transgenic mice - increased memory
    flexibility and reduced anxiety (PMID:33938018) - support any annotation on the human gene
    product? They are several steps downstream of the molecular activity, were measured in mouse,
    and reflect an enlarged neocortex rather than a direct function, so no annotation is proposed
    here. But the same question recurs for every human-specific gene studied by transgenesis, and a
    consortium position would be useful.
  experts: []
suggested_experiments:
- hypothesis: >-
    ARHGAP11B inhibits the adenine nucleotide translocase's transport activity, and that inhibition
    - not merely binding - is what delays mPTP opening.
  description: >-
    Reconstitute purified SLC25A4 or SLC25A5 into proteoliposomes and measure ADP/ATP exchange
    directly, with and without recombinant ARHGAP11B and with the ancestral 333-residue form as a
    specificity control. In parallel, measure calcium-retention capacity in mitochondria isolated
    from cells expressing wild-type ARHGAP11B, ancestral ARHGAP11B, and a matrix-targeting-deficient
    mutant. This separates three claims that the current record runs together - binds ANT, inhibits
    ANT transport, delays mPTP opening - and would decide between GO:0044325 and GO:0141110 as the
    molecular function.
  experiment_type: in vitro transport assay and isolated-mitochondria physiology
- hypothesis: >-
    The human-specific C-terminus (residues 221-267), not the loss of GAP activity as such, is the
    part of ARHGAP11B that binds ANT and confers the mitochondrial function.
  description: >-
    Test a panel in human cerebral organoids or fetal neocortex ex vivo: full-length ARHGAP11B; the
    isolated 1-220 region, which is essentially ARHGAP11A's N-terminus; the ancestral 333-residue
    protein; and chimeras grafting residues 221-267 onto ARHGAP11A(1-220) and onto an unrelated
    matrix-targeted carrier. Score ANT co-immunoprecipitation, calcium retention capacity and basal
    progenitor abundance. PMID:27957544 showed that both the loss of GAP activity and the gain of
    the novel C-terminus are needed, but which of the two supplies the ANT interaction has not been
    resolved, and that is the difference between a neomorphic binding module and a simple
    loss-of-function.
  experiment_type: structure-function mapping in human progenitors
- hypothesis: >-
    ARHGAP11B is required for normal basal progenitor levels in primary human fetal neocortex, not
    only in organoids.
  description: >-
    Apply the ARHGAP11A220 dominant-negative, and separately an ARHGAP11B-specific knockdown
    designed against the human-specific 3-prime sequence so that ARHGAP11A is untouched, to human
    fetal neocortical tissue in organotypic slice culture, and quantify cycling basal progenitors
    and basal radial glia. The only loss-of-function evidence for this gene is in organoids
    (PMID:36098218) plus one dominant-negative experiment in fetal tissue reported within
    PMID:31883789; a clean, ARHGAP11B-specific knockdown in primary human tissue would convert the
    proposed GO:2000179 IMP from a single-system result into a robust one.
