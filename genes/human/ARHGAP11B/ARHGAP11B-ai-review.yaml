- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000198
  review:
    summary: >-
      A signal-transduction term derived automatically from the RhoGAP domain signature. The
      signature matches, but the activity it stands for is experimentally absent from this protein
      and its actual role is mitochondrial metabolism.
    action: REMOVE
    reason: >-
      IPR000198 is the RhoGAP domain. The interpro2go mapping from that signature to GO:0007165 is
      reasonable for RhoGAPs in general and wrong for this one, for the same reason the Reactome GAP
      row is wrong: the domain is present, the function is not. ARHGAP11B has no RhoGAP activity in
      cells, carries a NOT annotation for positive regulation of GTPase activity, and acts inside
      the mitochondrial matrix on the permeability transition pore, which is not signal transduction
      on any reading.

