      DOMAIN feature on ARHGAP11B spans 49..250, which is 30 residues past residue 220, the last
      residue homologous to ARHGAP11A, and therefore extends into the human-specific frameshift
      C-terminus. The consequence is that the annotated domain on the inactive truncated paralog
      (202 aa) is 11 residues LONGER than the annotated domain on the catalytically active parent
      ARHGAP11A (49..239, 191 aa). Any automated step that reads domain extent as evidence of an
      intact RhoGAP reads this protein as more intact than the active one. Measured in
      ARHGAP11B-bioinformatics, where the divergence point at 220 is fitted as a changepoint with
      its significance set by permutation rather than by a chosen identity cutoff.
