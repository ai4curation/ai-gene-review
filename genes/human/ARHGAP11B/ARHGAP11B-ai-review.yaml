- id: PMID:25721503
  title: Human-specific gene ARHGAP11B promotes basal progenitor amplification and
    neocortex expansion.
  findings:
  - statement: >-
      ARHGAP11B arose by partial duplication of ARHGAP11A on the human lineage after the split from
      chimpanzee, and when expressed in embryonic mouse neocortex promotes basal progenitor
      generation and self-renewal and can induce gyrification.
    supporting_text: >-
      ARHGAP11B arose from partial duplication of ARHGAP11A (which encodes a Rho guanosine
      triphosphatase-activating protein) on the human lineage after separation from the chimpanzee
      lineage. Expression of ARHGAP11B in embryonic mouse neocortex promotes basal progenitor
      generation and self-renewal and can increase cortical plate area and induce gyrification.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch. Cached record is ABSTRACT-ONLY, and the abstract does
      not mention the RhoGAP assay that this paper is cited for in two GOA rows. I did not overrule
      those rows on that basis; the negative result is independently restated in the full text of
      PMID:27957544, which cites this paper as its reference (23). Checked for erratum, retraction
      and expression of concern via CommentsCorrections on the article's own PubMed record: none.
- id: PMID:27957544
  title: A single splice site mutation in human-specific ARHGAP11B causes basal progenitor
    amplification.
  findings:
  - statement: >-
      A single C-to-G substitution creates a novel splice donor site; the resulting frameshift
      truncates the GAP domain and appends a 47-residue human-specific C-terminus beginning at
      residue 221.
    supporting_text: >-
      Thus, the single C→G base change in the ARHGAP11B gene is ultimately the reason for the
      reading frame shift that leads to the truncation of the GAP domain of ARHGAP11B and its novel
      C-terminal sequence (amino acids 221 to 267; Fig. 1 and fig. S2), which is unique to
      ARHGAP11B and not found in any other protein thus far described in the animal kingdom
  - statement: >-
      Modern ARHGAP11B has no RhoGAP activity in intact cells; the reconstructed ancestral protein,
      which has a complete GAP domain, does have RhoGAP activity but cannot amplify basal
      progenitors. Activity and progenitor amplification are anti-correlated across the three
      proteins tested.
    supporting_text: >-
      In contrast to modern ARHGAP11B, but similar to ARHGAP11A-250, ancestral ARHGAP11B was found
      to exhibit RhoGAP activity, as compared to a negative control (empty vector) (Fig. 2).
  - statement: >-
      The first 220 residues of ARHGAP11B are 98% identical to ARHGAP11A and encompass most of the
      GAP domain, which ARHGAP11A places at residues 46 to 246.
    supporting_text: >-
      The first 220 amino acids of ARHGAP11B are 98% identical to those of ARHGAP11A (216 of 220
      residues; for a discussion of the four amino acid changes, see below and the Supplementary
      Materials) and encompass most of its GAP domain (amino acids 46 to 246)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch; full text available and read. The single most
      important reference for this gene, because it is the only one that separates the
      GAP-activity question from the progenitor question experimentally. Checked for erratum,
      retraction and expression of concern: none.
- id: PMID:31883789
  title: Human-Specific ARHGAP11B Acts in Mitochondria to Expand Neocortical Progenitors
    by Glutaminolysis.
  findings:
  - statement: >-
      ARHGAP11B is imported into mitochondria, interacts with the adenine nucleotide translocase,
      and inhibits the mitochondrial permeability transition pore.
    supporting_text: >-
      Here, we show that ARHGAP11B is imported into mitochondria, where it interacts with the
      adenine nucleotide translocase (ANT) and inhibits the mitochondrial permeability transition
      pore (mPTP).
  - statement: >-
      Basal progenitor expansion by ARHGAP11B requires its presence in mitochondria and requires
      glutaminolysis, and is mimicked by pharmacological inhibition of ANT function or of mPTP
      opening.
    supporting_text: >-
      BP expansion by ARHGAP11B requires its presence in mitochondria, and pharmacological
      inhibition of ANT function or mPTP opening mimic BP expansion by ARHGAP11B.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch. Cached record is ABSTRACT-ONLY. Six GOA rows rest on
      it, including both protein-binding rows, the mitochondrial matrix IDA and the glutamine
      catabolism row. Every one of those claims is stated in the abstract, and all six are accepted
      or refined rather than challenged; I did not second-guess a full text I have not read.
      Checked for erratum, retraction and expression of concern: none.
- id: PMID:33938018
  title: Expression of human-specific ARHGAP11B in mice leads to neocortex expansion
    and increased memory flexibility.
  findings:
  - statement: >-
      A transgenic mouse line expressing ARHGAP11B at physiological levels has an enlarged
      neocortex with more upper-layer neurons that persists into adulthood.
    supporting_text: >-
      Here, we generated a transgenic mouse line with physiological ARHGAP11B expression that
      exhibits increased neocortical size and upper-layer neuron numbers persisting into adulthood.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch; full text available. The experimental system is a
      transgenic MOUSE carrying the human gene, so the phenotype is a property of the human protein
      acting in mouse neocortex, not a measurement in human tissue. Checked for erratum, retraction
      and expression of concern: none.
- id: PMID:30484771
  title: Human-specific ARHGAP11B induces hallmarks of neocortical expansion in developing
    ferret neocortex.
  findings:
  - statement: >-
      In the gyrencephalic ferret, ARHGAP11B expression markedly increases proliferative basal
      radial glia, extends the neurogenic period and increases upper-layer neurons, extending the
      progenitor phenotype beyond the lissencephalic mouse.
    supporting_text: >-
      In contrast to its effects in mouse, ARHGAP11B markedly increases proliferative basal radial
      glia, a progenitor cell type thought to be instrumental for neocortical expansion, and results
      in extension of the neurogenic period and an increase in upper-layer neurons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch. Not cited by any GOA row; included because it is one
      of the systems establishing the progenitor phenotype, and because naming the system matters
      for how the cerebral-cortex rows should be read. Checked for erratum, retraction and
      expression of concern: none.
- id: PMID:32554627
  title: Human-specific ARHGAP11B increases size and folding of primate neocortex in
    the fetal marmoset.
  findings:
  - statement: >-
      Expressed under its own human promoter in fetal marmoset neocortex, ARHGAP11B increases basal
      radial glia in the outer subventricular zone and upper-layer neurons, enlarges the neocortex
      and induces folding, extending the phenotype to a non-human primate.
    supporting_text: >-
      ARHGAP11B expressed in fetal neocortex of the common marmoset under control of the gene's own
      (human) promoter increased the numbers of basal radial glia progenitors in the marmoset outer
      subventricular zone, increased the numbers of upper-layer neurons, enlarged the neocortex, and
      induced its folding.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch. Abstract-only cache. Not cited by any GOA row.
      Checked for erratum, retraction and expression of concern: none. PubMed lists an accompanying
      Science commentary, which is a Comment-in rather than a correction.
- id: PMID:36098218
  title: Human-specific ARHGAP11B ensures human-like basal progenitor levels in hominid
    cerebral organoids.
  findings:
  - statement: >-
      The only study that perturbs ARHGAP11B in a human system, and it does so in both directions:
      dominant-negative interference in human cerebral organoids drops basal progenitors to
      chimpanzee levels, while expression in chimpanzee organoids doubles them.
    supporting_text: >-
      Conversely, interference with ARHGAP11B's function in human cerebral organoids decreases
      basal progenitors down to the chimpanzee level.
  - statement: >-
      Rescue of ARHGAP11A-plus-ARHGAP11B double-knockout human forebrain organoids shows that
      ARHGAP11B, but not ARHGAP11A, is required to maintain basal radial glia, so the requirement is
      specific to the human-specific paralog.
    supporting_text: >-
      Moreover, ARHGAP11A or ARHGAP11B rescue experiments in ARHGAP11A plus ARHGAP11B
      double-knockout human forebrain organoids indicate that lack of ARHGAP11B, but not of
      ARHGAP11A, decreases the abundance of basal radial glia-the basal progenitor type thought to
      be of particular relevance for neocortex expansion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch. This paper supports no GOA row at all, which is the
      clearest coverage gap in this gene's record: every existing cerebral-cortex annotation is
      gain-of-function, and the loss-of-function evidence, uniquely obtained in human cells, is
      uncurated. It is the basis of the NEW GO:2000179 row. Quotes here are taken from the abstract
      because the reference validator resolves this record to abstract-only (the publisher full text
      returns HTTP 403), even though a PMC copy is cached locally. Checked for erratum, retraction
      and expression of concern: none.
- id: PMID:28580430
  title: The evolution and population diversity of human-specific segmental duplications.
  findings:
  - statement: >-
      Places ARHGAP11B among the ten human-specific segmental duplication families whose copy number
      never returns to the ancestral state, with evidence of mRNA splicing and no common
      gene-disruptive mutations in the general population.
    supporting_text: >-
      we highlight ten gene families (e.g., ARHGAP11B and SRGAP2C) where copy number never returns
      to the ancestral state, there is evidence of mRNA splicing, and no common gene-disruptive
      mutations are observed in the general population.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Title verified against PubMed by efetch. Background only; cited by UniProt's MISCELLANEOUS
      line for the duplication timing. No annotation in this review depends on it. Checked for
      erratum, retraction and expression of concern: none.
- id: Reactome:R-HSA-8981637
  title: RHOA GAPs stimulate RHOA GTPase activity
  findings:
  - statement: >-
      This Reactome reaction has a single set-level catalyst, "GTPase activator activity of RHOA
      GAPs [cytosol]". Querying QuickGO by this reference returns 43 annotations over 22 distinct
      entities (numberOfHits 43, all 43 read on one page), of which 21 entities receive GO:0005096
      and 21 receive GO:0005829, every one by TAS. It is a bulk projection over a defined catalyst
      set, not a judgement about any individual member.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The reaction is real and correctly describes RHOA GAPs as a class, and for genuine members
      such as ARHGAP11A the resulting annotation is right. Marked MISCITED for ARHGAP11B
      specifically: including this protein in the catalyst set asserts an activity that two
      independent IDA annotations on the same gene explicitly negate, and that UniProt's recommended
      protein name denies. The defect is set membership, not the reaction.
- id: Reactome:R-HSA-9012999
  title: RHO GTPase cycle
  findings:
  - statement: >-
      Querying QuickGO by this reference returns 103 annotations over 103 distinct entities
      (numberOfHits 103, all 103 read across two pages), all of them GO:0051056 by TAS. It is a
      pathway-membership projection distributed across every participant.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Same defect as R-HSA-8981637, one level up: ARHGAP11B is listed as a participant in the RHO
      GTPase cycle on the strength of its RhoGAP domain, and every participant receives GO:0051056.
      The gene has no measured role in small GTPase signalling.
existing_annotations:
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:25721503
  qualifier: enables
  negated: true
  review:
    summary: >-
      A NOT annotation asserting that ARHGAP11B does not have Rho GTPase-activating activity. One of
      the best-founded rows in the record, and the key to the gene: the truncation that removed the
      activity is what made the protein able to amplify basal progenitors.
    action: ACCEPT
    reason: >-
      The cached record for this paper is abstract-only and its abstract does not describe the
      RhoGAP assay, so I could not read the primary result directly. I did not treat that as grounds
      to doubt it. The full text of PMID:27957544 restates the result and cites this paper as its
      source, which independently confirms what the curator annotated. UniProt's recommended protein
      name, "Inactive Rho GTPase-activating protein 11B", and its CAUTION block record the same
      conclusion. Retained as a core, defining property of the gene product rather than a peripheral
      negative.
    supported_by:
    - reference_id: PMID:27957544
      supporting_text: >-
        However, contrary to ARHGAP11A (27, 28), ARHGAP11B does not exhibit RhoGAP activity when
        expressed in monkey fibroblast-like cells (23).
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:27957544
  qualifier: enables
  negated: true
  review:
    summary: >-
      The same NOT annotation from the paper that dissected the cause. Modern ARHGAP11B has no
      RhoGAP activity in cells, while the reconstructed ancestral protein, which has a complete GAP
      domain, does.
    action: ACCEPT
    reason: >-
      Full text read. The paper establishes the negative and its mechanism in one experiment:
      ARHGAP11A-250 and ancestral ARHGAP11B are active in the MYPT1-pT853 assay, modern ARHGAP11B is
      not, and only modern ARHGAP11B amplifies basal progenitors. One qualification should travel
      with this row rather than be dropped: the authors report very low activity in a cell-free
      assay, so the claim is the absence of activity in intact cells, not an absolute zero under all
      conditions. NOT|enables remains the right encoding of that.

      The committed analysis in ARHGAP11B-bioinformatics corroborates this but is deliberately not
      the basis of the action. Projecting the GAP:GTPase interface of PDB 1TX4 onto ARHGAP11A, 2 of
      24 mapped interface positions fall past the divergence point at residue 220 and so are absent
      from ARHGAP11B. Two positions out of 24 is a modest structural argument; the experiments are
      what carry this row.
    supported_by:
    - reference_id: PMID:27957544
      supporting_text: >-
        Modern ARHGAP11B lacks RhoGAP activity in intact cells (23) and exhibits only very low
        RhoGAP activity in a cell-free assay.
    - reference_id: PMID:27957544
      supporting_text: >-
        In contrast to modern ARHGAP11B, but similar to ARHGAP11A-250, ancestral ARHGAP11B was found
        to exhibit RhoGAP activity, as compared to a negative control (empty vector) (Fig. 2).
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8981637
  qualifier: enables
  review:
    summary: >-
      Reactome asserts, by TAS, the exact molecular function that two independent IDA annotations on
      this same gene explicitly negate. GOA therefore ships a flat contradiction inside one gene's
      record, and the positive side carries the weaker evidence code.
    action: REMOVE
    reason: >-
      The source is a single Reactome reaction, "RHOA GAPs stimulate RHOA GTPase activity", whose
      catalyst is one set-level entity, "GTPase activator activity of RHOA GAPs [cytosol]". Querying
      QuickGO by this reference returns 43 annotations over 22 distinct entities, with 21 entities
      receiving GO:0005096 and 21 receiving GO:0005829, every one by TAS. So this is a bulk
      projection over a defined catalyst set rather than a judgement about ARHGAP11B, and ARHGAP11B
      is in that set because it looks like its paralog. For ARHGAP11A the same projection is correct
      and should stand.

      The removal is argued on biology, not on evidence-code snobbery. ARHGAP11B has no RhoGAP
      activity in cells (PMID:25721503, PMID:27957544), UniProt names it "Inactive Rho
      GTPase-activating protein 11B", and the loss is the gene's functional point. Note also what
      the removal does NOT rest on: the catalytic arginine finger is intact at position 87, so the
      usual pseudo-enzyme argument from missing catalytic residues is unavailable here and would
      have been a false reason for a correct action. The committed analysis in
      ARHGAP11B-bioinformatics confirms the arginine reciprocally against both ARHGAP11A's own
      annotated finger and ARHGAP1's structurally resolved one, requiring the aligned position to
      land on one of ARHGAP11B's own annotated sites.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: Reactome:R-HSA-8981637
        source_label: Reactome reaction "RHOA GAPs stimulate RHOA GTPase activity"
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The reaction correctly describes RHOA GAPs as a class and its catalyst is a defined set;
          21 entities receive GO:0005096 from it by TAS. The error is including a GAP-dead paralog
          in the set, not the reaction.
      - source_id: UniProtKB:Q6P4F7
        source_label: human ARHGAP11A (the paralog ARHGAP11B was duplicated from)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          ARHGAP11A genuinely has this activity, by IDA from PMID:27957544 and by IBA from PANTHER
          node PTN001038329. ARHGAP11B is 98% identical to it over residues 1-220 and shares its
          PANTHER subfamily PTHR15670:SF4, which is why it is mistaken for a RHOA GAP. The same
          paper that gave ARHGAP11A the positive IDA gave ARHGAP11B the negated one.
    supported_by:
    - reference_id: PMID:27957544
      supporting_text: >-
        However, contrary to ARHGAP11A (27, 28), ARHGAP11B does not exhibit RhoGAP activity when
        expressed in monkey fibroblast-like cells (23).
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31883789
  qualifier: enables
  supporting_entities:
  - UniProtKB:P05141
  review:
    summary: >-
      Interaction with SLC25A5 (ANT2), one of the two inner-mitochondrial-membrane ADP/ATP
      translocases through which ARHGAP11B acts. This is the mechanism of the gene, not screen
      noise, so the uninformative parent term should be replaced rather than dropped.
    action: MODIFY
    reason: >-
      The partner accession resolves to reviewed canonical Swiss-Prot SLC25A5, with no TrEMBL or
      partial-ORFeome substitution. The interaction is corroborated by UniProt's SUBUNIT line
      (ECO:0000269|PubMed:31883789) and is topologically coherent: ARHGAP11B carries a mitochondrial
      transit peptide and is located in the matrix, which is where an ANT-facing partner has to be.
      GO:0005515 states none of this. SLC25A5 is a transmembrane transporter, so GO:0044325
      transmembrane transporter binding is an evidence-backed and informative replacement that stays
      within what the cited paper shows.

      I stopped short of GO:0141110 transporter inhibitor activity even though the paper's logic
      points that way, because the cached record is abstract-only and "inhibits the mPTP" is not the
      same claim as "inhibits ANT-mediated transport". That is raised for a curator with the full
      text rather than resolved here.
    proposed_replacement_terms:
    - id: GO:0044325
      label: transmembrane transporter binding
    supported_by:
    - reference_id: PMID:31883789
      supporting_text: >-
        Here, we show that ARHGAP11B is imported into mitochondria, where it interacts with the
        adenine nucleotide translocase (ANT) and inhibits the mitochondrial permeability transition
        pore (mPTP).
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31883789
  qualifier: enables
  supporting_entities:
  - UniProtKB:P12235
  review:
    summary: >-
      Interaction with SLC25A4 (ANT1), the second ADP/ATP translocase named in the same study.
      Judged on its own rather than inherited from the SLC25A5 row, though the two resolve the same
      way.
    action: MODIFY
    reason: >-
      Same reasoning as the SLC25A5 row, and deliberately reached separately: the partner resolves
      to reviewed canonical Swiss-Prot SLC25A4 of the expected length, UniProt records both
      translocases in a single SUBUNIT statement attributed to this paper, and both are
      inner-membrane transporters accessible from the matrix. Nothing in the available evidence
      distinguishes the two partners, so both take the same replacement term. ANT1 and ANT2 are
      paralogous isoforms of the same carrier, so a single interaction experiment reporting both is
      expected rather than suspicious.
    proposed_replacement_terms:
    - id: GO:0044325
      label: transmembrane transporter binding
    supported_by:
    - reference_id: PMID:31883789
      supporting_text: >-
        Here, we show that ARHGAP11B is imported into mitochondria, where it interacts with the
        adenine nucleotide translocase (ANT) and inhibits the mitochondrial permeability transition
        pore (mPTP).
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IDA
  original_reference_id: PMID:31883789
  qualifier: located_in
  review:
    summary: >-
      Direct localisation of ARHGAP11B to the mitochondrial matrix. This is the core localisation of
      the protein and it is what makes every other part of its mechanism possible.
    action: ACCEPT
    reason: >-
      The cached record is abstract-only, and the granularity is worth stating precisely because the
      quotes below cannot carry it: the abstract establishes import into MITOCHONDRIA, not into the
      matrix specifically. The sub-compartment comes from the full text, via UniProt's curated
      SUBCELLULAR LOCATION of Mitochondrion matrix attributed to ECO:0000269|PubMed:31883789, and
      the entry also carries a predicted N-terminal mitochondrial transit peptide, which is
      consistent with matrix import rather than with an outer-membrane or intermembrane-space pool.
      Accepting the matrix term therefore defers to a curator who read the full text, which is the
      correct default. The abstract does independently show that the progenitor phenotype requires
      the protein to be in mitochondria, so the localisation is functionally tested and not a bare
      imaging result. Accepted as core.
    supported_by:
    - reference_id: PMID:31883789
      supporting_text: >-
        BP expansion by ARHGAP11B requires its presence in mitochondria, and pharmacological
        inhibition of ANT function or mPTP opening mimic BP expansion by ARHGAP11B.
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0170
  review:
    summary: >-
      Automatic mapping of UniProt's curated SUBCELLULAR LOCATION keyword onto the same GO term.
      Duplicates the IDA row, which is fine.
    action: ACCEPT
    reason: >-
      The SubCell term SL-0170 is mitochondrion matrix, and the UniProt location it maps is itself
      attributed to PubMed:31883789, so this row is a mechanical restatement of the curated
      experimental call rather than an independent inference that could drift from it. Duplicate GO
      ids across evidence codes are not a defect. Marked ACCEPT rather than demoted because the term
      is exactly right; it simply adds no information the IDA row does not already carry. As on that
      row, the matrix sub-compartment rests on the full text via UniProt's curated location, not on
      the abstract, which says only that the protein is imported into mitochondria.
    supported_by:
    - reference_id: PMID:31883789
      supporting_text: >-
        Here, we show that ARHGAP11B is imported into mitochondria, where it interacts with the
        adenine nucleotide translocase (ANT) and inhibits the mitochondrial permeability transition
        pore (mPTP).
