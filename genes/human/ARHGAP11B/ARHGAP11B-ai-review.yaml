id: Q3KRB8
gene_symbol: ARHGAP11B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARHGAP11B is a 267-residue human-specific protein that arose by partial duplication of the
  RhoGAP-encoding gene ARHGAP11A on the human lineage after the split from chimpanzee. Its first
  220 residues are 98% identical to ARHGAP11A and carry most of a Rho-GAP fold, including the
  canonical catalytic arginine finger at position 87, but a single C-to-G substitution creates a
  novel splice donor site that removes 55 nucleotides, shifts the reading frame, and replaces the
  C-terminal end of the GAP domain with 47 residues found in no other known protein. The result is
  a protein that keeps the catalytic residue yet has no Rho GTPase-activating activity in cells,
  and the loss of that activity is not incidental damage: the reconstructed ancestral version,
  which retains GAP activity, does not do what the modern protein does. Instead of acting on Rho
  GTPases, ARHGAP11B carries an N-terminal targeting sequence into the mitochondrial matrix, where
  it binds the inner-membrane ADP/ATP translocases SLC25A4 and SLC25A5 and delays opening of the
  mitochondrial permeability transition pore. The resulting rise in mitochondrial calcium drives
  glutaminolysis, the routing of glutamine through glutamate into the tricarboxylic acid cycle,
  which is the metabolic state that proliferating cells require. In the fetal human neocortex the
  protein is expressed specifically in apical and basal radial glia and is absent from cortical
  neurons and cortical plate, and its effect there is to amplify basal progenitors in the
  subventricular zone, so that more upper-layer neurons are produced. Expressing it in mouse,
  ferret and marmoset neocortex increases basal progenitor proliferation, enlarges the neocortex
  and can induce cortical folding, while blocking or deleting it in human cerebral organoids drops
  basal progenitor levels to those of chimpanzee organoids. ARHGAP11B is therefore best understood
  not as a Rho regulator but as a mitochondrial metabolic modulator of neural progenitor
  proliferation, and the substitution that made it one is shared with Neanderthals and Denisovans
  and fixed in present-day humans.
