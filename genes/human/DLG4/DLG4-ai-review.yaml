    action: UNDECIDED
    reason: The published SD1 workbook resolves 3 sequence-supported measurement(s) for Q15599 (NHERF2;
      taxon 9606); maximum source COMP values by tested domain are PDZ1=0, PDZ2=0, PDZ3=0. The selected
