    correctness: VERIFIED
    review_notes: Selected original experiments support a Tat-associated LRP1–PSD-95–NMDA-receptor complex
      in neuronal/astrocytic contexts. Co-complex evidence does not establish every pair as a purified
      binary interface.
- id: PMID:19118189
