- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: NAS
  original_reference_id: PMID:1695905
  qualifier: involved_in
  review:
    summary: Broad author statement from a 1990 GLUT-cloning paper grouping GLUTs under
      carbohydrate metabolism.
    action: MARK_AS_OVER_ANNOTATED
    reason: GLUT3 is a facilitative transporter; it moves sugars across the membrane but does not
      chemically transform carbohydrates, so it does not itself participate in carbohydrate
      metabolic process (chemical reactions). The specific transport activities and processes are
      captured elsewhere. This is an over-broad, non-traceable grouping rather than a function.
