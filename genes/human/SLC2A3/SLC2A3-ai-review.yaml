id: P11169
gene_symbol: SLC2A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC2A3 encodes GLUT3, a facilitative (energy- and Na+-independent) glucose uniporter
  of the major facilitator superfamily (sugar transporter / GLUT subfamily) that moves D-glucose
  down its concentration gradient across the plasma membrane by an alternating-access mechanism,
  with the C-terminal domain forming the primary substrate-binding site. It is a high-affinity
  transporter (Km for 2-deoxyglucose ~1.4-1.5 mM) and is the principal glucose transporter of
  neurons, though it is also expressed in sperm, platelets, placenta, embryonic cells and
  leukocytes. Besides D-glucose it transports other monosaccharides (galactose, mannose, xylose,
  fucose, 2-deoxyglucose) and the oxidized vitamin C form dehydroascorbate, but it does not
  transport fructose; selectivity against fructose is set by the QLS motif in transmembrane
  helix 7. By catalysing cellular glucose uptake it supplies the substrate for glycolysis and
  energy metabolism, a role that is essential in neurons and during early mesendoderm
  development.
