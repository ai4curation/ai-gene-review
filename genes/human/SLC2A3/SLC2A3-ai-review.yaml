- term:
    id: GO:0005353
    label: fructose transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:8457197
  qualifier: enables
  negated: true
  review:
    summary: NOT annotation. GLUT3 does not transport fructose, a defining difference from GLUT2
      and GLUT5. Confirmed by kinetic/chimera analysis and by the crystal structure.
    action: ACCEPT
    reason: The negation is correct and biologically important. Fructose selectivity is governed
      by the QLS motif (residues 277-279, TM7); the QLS->HVA mutant gains fructose transport,
      showing the wild-type protein is a non-fructose transporter. Retaining the NOT annotation
      prevents incorrect propagation of a generic hexose-transporter role.
    supported_by:
    - reference_id: PMID:9477959
      supporting_text: GLUT2 is capable of D-fructose transport, while GLUT3 is
    - reference_id: file:human/SLC2A3/SLC2A3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Does not mediate fructose transport
- term:
    id: GO:0005354
    label: galactose transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:8457197
  qualifier: enables
  review:
    summary: GLUT3 transports D-galactose (Km ~8.5 mM) in Xenopus oocytes via the same sugar
      site used by glucose. A genuine but lower-affinity secondary substrate.
    action: KEEP_AS_NON_CORE
    reason: Galactose transport is a real activity of GLUT3 but is a secondary/promiscuous
      substrate of the polyspecific hexose carrier; the core physiological function is
      high-affinity D-glucose uniport. Kept as a genuine non-core activity.
    supported_by:
    - reference_id: PMID:8457197
      supporting_text: GLUT3 mediates the transport of galactose
