- term:
    id: GO:0033300
    label: dehydroascorbic acid transmembrane transporter activity
  evidence_type: EXP
  original_reference_id: PMID:10862609
  qualifier: enables
  review:
    summary: Dehydroascorbate (DHA) transport by GLUT3 demonstrated in Xenopus oocytes (this
      paper assays GLUT1 and GLUT3 despite its GLUT4-focused title).
    action: ACCEPT
    reason: DHA (the oxidized vitamin C form) is a recognised core substrate of GLUT3 alongside
      D-glucose; GLUT1 and GLUT3 are the pair of facilitative transporters that mediate cellular
      DHA uptake (Km ~1.7 mM for GLUT3, between GLUT1 and GLUT2). Accepted as a core transport
      activity and captured in the GO:0033300 core_functions entry, matching how the sibling
      GLUT1 and GLUT2 reviews model DHA. Do not treat as paralog mis-attribution; the study
      explicitly transports DHA via GLUT3.
    supported_by:
    - reference_id: PMID:10862609
      supporting_text: transported by GLUT1 and GLUT3 in Xenopus laevis oocytes
- term:
    id: GO:0033300
    label: dehydroascorbic acid transmembrane transporter activity
  evidence_type: EXP
  original_reference_id: PMID:9228080
  qualifier: enables
  review:
    summary: Direct demonstration that GLUT1 and GLUT3 transport DHA (Km ~1.7 mM for GLUT3);
      GLUT2, GLUT5 and SGLT1 do not.
    action: ACCEPT
    reason: This paper names GLUT1 and GLUT3 as the specific pair of transporters that mediate
      DHA (oxidized vitamin C) uptake, and excludes GLUT2, GLUT5 and SGLT1. DHA is a recognised
      core substrate of GLUT3 alongside D-glucose (Km ~1.7 mM, between GLUT1 at ~1.1 mM and GLUT2
      at ~2.3 mM); accepted as a core transport activity, consistent across two independent
      studies and modelled in the GO:0033300 core_functions entry as in the GLUT1/GLUT2 reviews.
    supported_by:
    - reference_id: PMID:9228080
      supporting_text: GLUT1 and GLUT3 transport dehydroascorbic acid
