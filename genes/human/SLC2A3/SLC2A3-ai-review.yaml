core_functions:
- description: Facilitative (energy- and Na+-independent) uniport of D-glucose across the plasma
    membrane, down its concentration gradient, via an alternating-access conformational cycle;
    the C-terminal domain forms the primary D-glucose-binding site. High-affinity transporter
    specialized for neuronal and other cellular glucose uptake.
  molecular_function:
    id: GO:0055056
    label: D-glucose transmembrane transporter activity
  directly_involved_in:
  - id: GO:0098708
    label: D-glucose import across plasma membrane
  - id: GO:1904659
    label: D-glucose transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:26176916
    supporting_text: structure of human GLUT3 in complex with D-glucose at 1.5
  - reference_id: file:human/SLC2A3/SLC2A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Facilitative glucose transporter
  - reference_id: PMID:9477959
    supporting_text: Km values for deoxyglucose transport of approximately 11 mM and approximately
      1.5 mM, respectively
- description: Transport of dehydroascorbic acid (oxidized vitamin C) across the plasma membrane;
    GLUT3 is, with GLUT1, one of the pair of facilitative transporters that mediate cellular DHA
    uptake (apparent Km ~1.7 mM), with imported DHA reduced to ascorbate intracellularly.
  molecular_function:
    id: GO:0033300
    label: dehydroascorbic acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0070837
    label: dehydroascorbic acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9228080
    supporting_text: apparent Km of DHA transport via GLUT1 and GLUT3 was 1.1 +/- 0.2 and 1.7 +/- 0.3
      mM, respectively
  - reference_id: PMID:10862609
    supporting_text: transported by GLUT1 and GLUT3 in Xenopus laevis oocytes
suggested_questions:
- question: What is the physiological significance of GLUT3-mediated dehydroascorbate transport
    relative to dedicated ascorbate transporters (SVCTs), and in which cell types does it
    dominate vitamin C recycling?
suggested_experiments:
- description: Quantify the relative contribution of GLUT3 versus GLUT1 to glucose flux across a
    well-controlled human brain-endothelial monolayer using isoform-specific knockouts, to test
    whether GLUT3 contributes to transendothelial (blood-brain barrier) glucose transport or acts
    only in cellular uptake.
