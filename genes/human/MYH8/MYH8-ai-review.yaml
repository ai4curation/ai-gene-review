suggested_questions:
- question: What does perinatal myosin contribute to fetal and neonatal muscle that embryonic (MYH3) and adult fast myosins
    do not? Its isolated motor resembles adult fast isoforms, yet fibres rich in neonatal myosin show slow-like shortening
    velocity and ATPase; are fibre-level properties set by light chains, thin-filament isoforms or co-expressed heavy chains?
  experts:
  - muscle developmental biologists
  - myosin biophysicists
- question: Why is a single recurrent missense change (R674Q) the only established cause of trismus-pseudocamptodactyly, when
    heterozygous MYH8 loss-of-function alleles are tolerated? Does the mutant act as a dominant-negative or poison motor within
    mixed thick filaments, and why are jaw-closing and finger flexor muscles preferentially affected?
  experts:
  - neuromuscular geneticists
  - distal arthrogryposis clinicians
- question: Is the reported association of R674Q with a Carney complex variant (cardiac myxomas, pigmentation) a true MYH8
    effect, given that MYH8 is not expressed in fetal heart and R674Q was absent from independent Carney complex cases?
  experts:
  - Carney complex geneticists
suggested_experiments:
- description: Co-express wild-type and R674Q perinatal myosin at defined ratios in human iPSC-derived or primary fetal myotubes
    and measure thick-filament incorporation, sarcomere contraction and relaxation kinetics, and passive stiffness.
  hypothesis: R674Q acts as a dominant poison motor that slows cross-bridge detachment and impairs relaxation, producing contractures
    independent of reduced MYH8 dosage.
  experiment_type: cell-based contractility and sarcomere assembly assays
- description: Measure isometric force, shortening velocity and economy of single fibres or myofibrils from adult human masseter
    and extraocular muscles stratified by neonatal myosin content.
  hypothesis: Neonatal myosin content confers specific mechanical properties to adult specialized jaw and eye muscles.
  experiment_type: single fibre mechanics and myosin isoform proteomics
