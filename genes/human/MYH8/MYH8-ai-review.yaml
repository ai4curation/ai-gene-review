core_functions:
- description: 'Actin-activated ATP-driven motor: as the heavy chain of perinatal skeletal muscle myosin, MYH8 hydrolyses
    ATP and binds actin thin filaments to produce force and filament sliding, generating contraction of fetal/neonatal skeletal
    muscle and of adult specialized muscles (extraocular, jaw-closing, intrafusal fibres).'
  molecular_function:
    id: GO:0000146
    label: microfilament motor activity
  directly_involved_in:
