    label: striated muscle myosin thick filament
  in_complex:
    id: GO:0005859
    label: muscle myosin complex
  supported_by:
  - reference_id: PMID:20080549
    supporting_text: the developmental MyHC-Perinatal, with a similar V max as MyHC-IIa, has a very similar maximal motility
      velocity
  - reference_id: PMID:31387944
    supporting_text: The perinatal is distinct from the embryonic isoform, appearing to have features in common with the adult
      fast-muscle isoforms, including weak affinity of ADP for actin·myosin and fast ADP release.
  - reference_id: PMID:38377203
    supporting_text: WT perinatal and embryonic myosins had the highest powers due to a combination of large step sizes and
      fast kinetics.
  - reference_id: PMID:26180627
    supporting_text: developmental myosins persist throughout adult stages in specialized muscles, such as the extraocular
      and jaw-closing muscles, and in the intrafusal fibers of the muscle spindles
  - reference_id: PMID:2715179
    supporting_text: the mRNA encoding this isoform is expressed at high levels in 21-wk fetal skeletal tissue and not in
      fetal cardiac muscle
  - reference_id: file:human/MYH8/MYH8-deep-research-openscientist.md
    supporting_text: 'Its substrate specificity is twofold: ATP as the chemical fuel at the P-loop NTPase active site, and
      filamentous actin as the binding partner that both activates the ATPase and serves as the track along which the motor
      steps.'
- description: Actin filament binding by the motor heads, the strongly bound cross-bridge step of the actomyosin cycle; the
