id: P13535
gene_symbol: MYH8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYH8 encodes myosin-8, the perinatal (neonatal) skeletal muscle myosin heavy chain (MyHC-perinatal, MyHC-neo),
  a class II sarcomeric myosin. Two heavy chains dimerize through a long alpha-helical coiled-coil rod and each binds an essential
  and a regulatory light chain at its lever arm, forming hexameric muscle myosin whose rods pack into the bipolar thick filaments
  of the myofibril. The N-terminal motor domain is an actin-activated ATPase that binds ATP at a P-loop pocket and actin filaments
  through conserved actin-binding loops, coupling ATP hydrolysis to a power stroke that slides thin filaments past thick filaments.
  Recombinant human perinatal myosin moves actin at a velocity close to adult fast type IIa myosin, has fast ADP release and
  weak ADP affinity like adult fast isoforms, and produces a large step size with fast kinetics. MYH8 is expressed at high
  levels in fetal skeletal muscle, predominates around birth and is then replaced by adult fast and slow isoforms; it persists
  in adult specialized muscles such as the extraocular and jaw-closing muscles and muscle spindle intrafusal fibres, and is
  re-expressed in regenerating fibres. It is not expressed in fetal heart. A recurrent dominant R674Q substitution in the
  actin-binding region of the head, near the ATP pocket, causes trismus-pseudocamptodactyly syndrome (distal arthrogryposis
  type 7), in some families together with a Carney complex variant; the mutant motor has reduced step size, actin-detachment
  rate and ATPase cycle rate, whereas heterozygous loss-of-function alleles do not cause the syndrome.
