  review:
    summary: Microfilament motor activity (IBA) is the defining activity of the class II myosin heavy chain clade, which MYH8
      sits within.
    action: ACCEPT
    reason: MYH8 encodes the perinatal (neonatal) class II skeletal muscle myosin heavy chain. Recombinant human perinatal
      myosin has actin-activated ATPase activity and moves actin filaments in motility assays at a velocity close to adult
      fast IIa myosin, its full actomyosin cross-bridge cycle has been measured by transient kinetics, and its subfragment-1
