id: P29597
gene_symbol: TYK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TYK2 is a Janus kinase (JAK) family non-receptor tyrosine kinase with N-terminal FERM and
  SH2-like domains, a regulatory pseudokinase domain and a C-terminal tyrosine kinase domain. It lacks
  a transmembrane segment and binds constitutively, via its FERM-SH2 module, to membrane-proximal box1/box2
  motifs in the intracellular domains of specific cytokine receptor chains (IFNAR1, IL12RB1, IL10RB, IL13RA1),
  so it acts on the cytoplasmic face of the plasma membrane. Upon cytokine-induced receptor dimerization
  TYK2 is activated with its partner JAK (JAK1 or JAK2), phosphorylates receptor tyrosines to create STAT
  docking sites, and phosphorylates STAT proteins, driving type I interferon, IL-10 family, IL-12 and
  IL-23 signaling. It is also required for normal IFNAR1 surface expression. TYK2 deficiency causes immunodeficiency
  with susceptibility to mycobacterial and viral infections, and TYK2 variants are associated with autoimmune
  disease.
