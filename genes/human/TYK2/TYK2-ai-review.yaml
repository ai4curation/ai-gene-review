core_functions:
- description: Non-receptor tyrosine kinase that, docked on cytokine receptor intracellular domains, phosphorylates
    receptor chains (e.g. IFNAR1) and STATs to transduce type I interferon, IL-10, IL-12 and IL-23 signals.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0060337
    label: type I interferon-mediated signaling pathway
  - id: GO:0035722
    label: interleukin-12-mediated signaling pathway
  - id: GO:0038155
    label: interleukin-23-mediated signaling pathway
  - id: GO:0140105
    label: interleukin-10-mediated signaling pathway
  locations:
  - id: GO:0031234
    label: extrinsic component of cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:7526154
    supporting_text: the p135tyk2 tyrosine kinase directly binds and tyrosine phosphorylates this receptor
      subunit
  - reference_id: PMID:7657660
    supporting_text: Co-expression of Stat1 with Tyk2, Jak1, or Jak2 resulted in the specific tyrosine
      phosphorylation of Stat1 at Tyr701
  - reference_id: PMID:10542297
    supporting_text: catalytically active TYK2 is required for IFN-beta-mediated tyrosine phosphorylation
      of STAT3 and IFNAR-1 in intact cells
  - reference_id: PMID:7528775
    supporting_text: IL-12, but not IL-2, stimulates the tyrosine phosphorylation of TYK2 and JAK2
  - reference_id: PMID:7543512
    supporting_text: IL-10 treatment of both T cells and monocytes results in the ligand-induced tyrosine
      phosphorylation of tyk2 and Jak1
- description: Binds the box2 intracellular motif of IFNAR1 through its FERM-SH2 module, tethering the
    kinase to the receptor.
  molecular_function:
    id: GO:0005132
    label: type I interferon receptor binding
  locations:
  - id: GO:0031234
    label: extrinsic component of cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:24704786
    supporting_text: in complex with a so-called 'box2'-containing intracellular peptide motif from the
      interferon-α receptor chain 1 (IFNAR1)
  - reference_id: PMID:7526154
    supporting_text: the p135tyk2 tyrosine kinase directly binds and tyrosine phosphorylates this receptor
      subunit
suggested_questions:
- question: Does TYK2 contribute to IFN-gamma or IL-5 signaling in primary human cells, or are these pathways
    strictly JAK1/JAK2-dependent?
- question: How does the pseudokinase domain-mediated autoinhibition differ between TYK2 bound to IFNAR1
    versus IL12RB1, and how do allosteric inhibitors (deucravacitinib) exploit this?
suggested_experiments:
- description: Compare IFN-gamma and IL-5 induced STAT phosphorylation in TYK2-null versus kinase-dead
    TYK2 primary human cells to resolve the unverified pathway assignments.
