- id: file:human/COX6B1/COX6B1-deep-research-falcon.md
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The genuine historical provider artifact and its findings are retained.
      Its claims are not primary evidence. Human structural membership, bovine VIb-removal
      kinetics and published early-assembly experiments are distinguished in the reassessment.
      Several inherited mechanistic statements exceed the directly inspected evidence,
      as marked locally in finding_review.
  finding_assessments:
  - index: 0
    finding_review:
      finding_status: CORROBORATED
      review_notes: Accessory structural identity is supported; lack of autonomous metal-centered
        chemistry does not exclude contribution to the multisubunit oxidase activity.
      supported_by:
      - reference_id: PMID:30030519
      - reference_id: PMID:41419202
  - index: 1
    finding_review:
      finding_status: DISPUTED
      review_notes: IMS placement is supported, but the human monomer structure does not
        establish a universal dimer-interface role.
      supported_by:
      - reference_id: PMID:30030519
  - index: 2
    finding_review:
      finding_status: UNVERIFIED
      review_notes: The bovine original abstract directly reports selective VIb removal,
        increased activity and unchanged pumping. It does not directly report monomerization,
        successful reconstitution or the proposed cooperative mechanism. Those added mechanistic
        claims remain unverified.
      supported_by:
      - reference_id: PMID:1332762
  - index: 3
    finding_review:
      finding_status: CORROBORATED
      review_notes: This is the assembled enzyme reaction, not an independent COX6B1 redox
        reaction.
      supported_by:
      - reference_id: PMID:30030519
  - index: 4
    finding_review:
      finding_status: DISPUTED
      review_notes: Complex-IV contribution is supported, but dimerization is not an obligatory
        explanation of the resolved human monomer or the newer assembly results.
      supported_by:
      - reference_id: PMID:30030519
      - reference_id: PMID:41419202
  - index: 5
    finding_review:
      finding_status: CORROBORATED
      review_notes: The published successor, PMID:41419202, corroborates the stated early
        redox-sensitive assembly requirement in human knockout/complementation experiments,
        including altered MT-CO2 and assembly-factor abundance. The specific maturation/metalation
        mechanism remains inferred; direct COX6B1 copper transfer or reductase activity
        was not demonstrated.
      supported_by:
      - reference_id: PMID:41419202
  - index: 6
    finding_review:
      finding_status: CORROBORATED
      review_notes: Pathogenic human Arg20 substitutions are reproduced in the published
        human cellular models; alternative historical numbering is not used as a separate
        modern residue assignment.
      supported_by:
      - reference_id: PMID:41419202
  - index: 7
    finding_review:
      finding_status: UNVERIFIED
      review_notes: The cited review-level patient/S3 statement was not independently reconstructed
        from its original patient study here. New human KO/variant experiments are separately
        assessed and do not retroactively verify every historical patient detail.
  - index: 8
    finding_review:
      finding_status: CORROBORATED
      review_notes: COX6B2 is a distinct gene product. Neither N- nor C-terminal FLAG-tagged
        COX6B2 restored respiration in the tested COX6B1-null HEK293 model; this does not
        establish universal noncomplementation across tissues.
      supported_by:
      - reference_id: PMID:41419202
- id: PMID:1332762
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract only; original full paper remained unavailable after
      bounded attempts. The tested enzyme was bovine heart oxidase. Selective VIb removal
      increased activity and Km without changing proton pumping. Monomerization is not
      an observed result stated in the abstract; no human purified-subunit or universal
      regulator claim is added. The authors interpret their biochemical results as regulation
      through interaction with the active center; this remains their mechanistic interpretation,
      not a directly mapped contact or a demonstrated human regulatory mechanism.
  finding_assessments: []
- id: PMID:41419202
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Published original JBC study, DOI 10.1016/j.jbc.2025.111070, replaces
      the preprint-only description. Actual human HEK293 KO, full-length C-terminal FLAG
      rescue, pathogenic variants and Aspergillus AOX bypass distinguish early assembly
      from late function. The AOX-bypassed incomplete complex retains about 5% wild-type
      COX capacity. MT-CO2 copper maturation is inferred, not a demonstrated COX6B1 copper-transfer/reductase
      reaction.
  finding_assessments:
  - index: 0
    finding_review: null
