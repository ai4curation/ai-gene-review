      name:
        name: Cytochrome c oxidase, subunit VIb
        short: Cyt_c_oxidase_su6B
      description:
      - text: '<p>Cytochrome c oxidase ([ec:7.1.1.9]) is an oligomeric enzymatic complex
          that is a component of the respiratory chain complex and is involved in the transfer
          of electrons from cytochrome c to oxygen [[cite:PUB00000581]]. In eukaryotes
          this enzyme complex is located in the mitochondrial inner membrane; in aerobic
          prokaryotes it is found in the plasma membrane.</p>


          <p>In eukaryotes, in addition to the three large subunits, I, II and III, that
          form the catalytic centre of the enzyme complex, there are a variable number
          of small polypeptide subunits. One of these subunits is the potentially haem-binding
          subunit, VIb, which is encoded in the nucleus [[cite:PUB00014035]].  Subunit
          VIb is one of three mammalian subunits that lacks a transmembrane region. It
          is located on the cytosolic side of the membrane and helps form the dimer interface
          with the corresponding subunit on the other monomer complex [[cite:PUB00081734],
          [cite:PUB00081733]].</p>'
        llm: false
        checked: false
        updated: false
