        name: substantia nigra development
        definition:
          text: The progression of the substantia nigra over time from its initial formation
            until its mature state. The substantia nigra is the layer of gray substance
            that separates the posterior parts of the cerebral peduncles (tegmentum mesencephali)
            from the anterior parts; it normally includes a posterior compact part with
            many pigmented cells (pars compacta) and an anterior reticular part whose cells
            contain little pigment (pars reticularis).
