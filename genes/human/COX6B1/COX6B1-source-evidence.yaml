    - dbId: 5460
      displayName: mitochondrial matrix
      accession: 0005759
      databaseName: GO
      definition: The gel-like material, with considerable fine structure, that lies in
        the matrix space, or lumen, of a mitochondrion. It contains the enzymes of the
        tricarboxylic acid cycle and, in some organisms, the enzymes concerned with fatty
        acid oxidation.
      name: mitochondrial matrix
      url: https://www.ebi.ac.uk/QuickGO/term/GO:0005759
      className: Compartment
      schemaClass: Compartment
    summation:
    - dbId: 164820
      displayName: Complex IV (COX, cytochrome c oxidase) contains the hemeprot...
      text: Complex IV (COX, cytochrome c oxidase) contains the hemeprotein cytochrome
        a and a3. It also contains copper atoms which undergo a transition from Cu+ to
        Cu2+ during the transfer of electrons through the complex to molecular oxygen.
        A bimetallic center containing a copper atom and a heme-linked iron protein binds
        oxygen after 4 electrons have been picked up. Water, the final product of oxygen
        reduction, is then released. Oxygen is the final electron acceptor in the respiratory
        chain. The overall reaction can be summed as<br><br>4Cyt c (red.) + 12H+ (in) +
        O2 = 4Cyt c (ox.) + 2H2O + 8H+ (out)<br><br>Four protons are taken up from the
        matrix side of the membrane to form the water (scalar protons). Wikstrom (1977)
        suggests 4 protons are additionally transferred out from the matrix to the intermembrane
        space.<br><br>Carbon monoxide (CO) readily inhibits oxygen consumption by mitochondrial
        cytochrome oxidase. This inhibition is responsible for much of its toxicity when
        it is applied externally to the body. However, CO has been implicated in normal
        cellular signaling, especially in anti-inflammatory effects. The addition of antioxidants
        or inhibition of complex III of the electron transport chain by antimycin A attenuates
        the inhibitory effects of CO on lipopolysaccharide (LPS)-induced NLRP3 formation
        and TNF-alpha secretion, and blocked CO-induced p38 MAPK phosphorylation. These
        effects may be mediated via inhibition of cytochrome c oxidase and its generation
        of mitochondrial reactive oxygen species (Alonso et al, 2003; Zuckerbraun et al,
        2007; Cooper and Brown, 2008; Jung et al, 2014; Ishigami et al, 2017). In carotid
        body glomus cells the tissue-specific HIGD1C positively regulates COX electron
        transfer (Timón-Gómez et al., 2022).
      className: Summation
      schemaClass: Summation
  - dbId: 9709406
    displayName: CO binds to Cytochrome c oxidase
    stId: R-HSA-9709406
    compartment:
    - dbId: 70616
      displayName: mitochondrial inner membrane
      accession: '0005743'
      databaseName: GO
      definition: The inner, i.e. lumen-facing, lipid bilayer of the mitochondrial envelope.
        It is highly folded to form cristae.
      name: mitochondrial inner membrane
      url: https://www.ebi.ac.uk/QuickGO/term/GO:0005743
      className: Compartment
      schemaClass: Compartment
    summation:
    - dbId: 9709407
      displayName: Carbon monoxide (CO) toxicity is the result of a combination...
      text: Carbon monoxide (CO) toxicity is the result of a combination of tissue hypoxia
        and direct CO-mediated damage at a cellular level, since not all the signs and
        symptoms presented can be explained only by the formation of carboxyhaemoglobin.
        CO binds to cytochrome c oxidase, the terminal enzyme in the electron transfer
        chain, reducing its activity. Regulation of reactive oxygen species (ROS) generation
        is possibly one of the key components in CO signaling and its interaction with
        mitochondria but also other heme proteins that generate ROS, such as NADPH oxidase
        (Alonso et al, 2003; Zuckerbraun et al, 2007; Ishigami et al, 2017; Motterlini
        and Foresti, 2017).
      className: Summation
      schemaClass: Summation
  - dbId: 9865663
    displayName: MT-CO3, COX6A,B,7A and NDUFA4 bind to holo-MT-CO1,2 complex
    stId: R-HSA-9865663
    compartment:
    - dbId: 70616
      displayName: mitochondrial inner membrane
      accession: '0005743'
      databaseName: GO
      definition: The inner, i.e. lumen-facing, lipid bilayer of the mitochondrial envelope.
        It is highly folded to form cristae.
      name: mitochondrial inner membrane
      url: https://www.ebi.ac.uk/QuickGO/term/GO:0005743
      className: Compartment
      schemaClass: Compartment
    summation:
    - dbId: 9865668
      displayName: The final assembly of Complex IV consists of binding of the ...
      text: The final assembly of Complex IV consists of binding of the MT-CO3, COX6A,
        COX6B, COX7A, and NDUFA4 subunits to the holo-MT-CO1, MT-CO2 complex (reviewed
        by, e.g., Timón-Gómez et al., 2018). Both HIGD1A and HIGD2A act as positive regulators
        of the final assembly (Vukotic et al., 2012; Hock et al., 2020; Timón-Gómez et
        al., 2020a; reviewed in Timón-Gómez et al., 2020b). Recent data also points to
        RAB5IF as an assembly cofactor (Moutaoufik et al., 2019). Patients with NDUFA4
        mutations display COX deficiencies (Pitceathly et al., 2013).
      className: Summation
      schemaClass: Summation
