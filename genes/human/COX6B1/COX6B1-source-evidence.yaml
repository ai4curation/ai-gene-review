- historical_index: 6
  term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  action: KEEP_AS_NON_CORE
  reason: The complete current GO_REF:0000108 record identifies GO:0004129 as its logical
    premise. COX6B1 supplies structural support to the active oxidase, whose electron-transfer
    reaction is coupled to proton movement. This makes participation defensible at the
    complex level, but the inspected human structural and knockout/rescue evidence does
    not resolve a COX6B1-specific contribution to proton translocation separately from
    assembly and oxidase activity. Selective removal of bovine VIb left proton pumping
    unchanged in PMID:1332762 despite increased oxidase activity. That preparation-specific
    result supports separating the pumping claim from the directly established structural/oxidase
    role; it does not establish absence of a role in every human context. Retain the coupled
    process as non-core and center the core on contribution to cytochrome-c oxidase activity
    and its specific electron-transfer step.
  propagation_review:
    root_cause: NO_FAILURE_NON_CORE
    source_entities:
    - source_id: GO:0004129
      source_status: SUPPORTS_TRANSFER
      comment: The assembled oxidase activity provides a valid logical premise for this
        coupled process. COX6B1 contributes structural work, but a distinct subunit-specific
        pumping role is unresolved; the transferred process is retained as non-core.
