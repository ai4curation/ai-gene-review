suggested_questions:
- question: What substrate(s) does human MCT14 (SLC16A14) transport? It remains one of the 
    uncharacterised orphan MCTs with no demonstrated substrate or physiological role.
suggested_experiments:
- description: Express human SLC16A14 heterologously (Xenopus oocytes / HEK293, with ancillary 
    basigin or embigin) and assay flux of candidate monocarboxylates and related metabolites to 
    establish substrate specificity, directionality and proton-coupling for this orphan transporter.
