  label: Homo sapiens
description: 'SLC16A14 encodes monocarboxylate transporter 14 (MCT14), a multi-pass plasma-membrane protein
  of the SLC16/monocarboxylate-transporter family (major facilitator superfamily, monocarboxylate porter
  family, TC 2.A.1.13) with the characteristic 12-transmembrane-helix MCT topology. MCT14 is an uncharacterised
  (''orphan'') family member: it is predicted to be a proton-coupled monocarboxylate transporter, but
  its specific substrate(s) and physiological role have not been established experimentally, and its functional
  assignment rests on sequence homology within the MCT family.'
