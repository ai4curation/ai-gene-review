core_functions:
- description: CLN8 recruits soluble lysosomal enzymes at the ER membrane with CLN6 and couples their
    export to COPII coat machinery through a cytosolic Sec24-binding motif. CLN8 accompanies cargo out
    of the ER and cycles back through a C-terminal retrieval signal, maintaining lysosomal enzyme supply.
  molecular_function:
    id: GO:0097020
    label: COPII receptor activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0033116
    label: endoplasmic reticulum-Golgi intermediate compartment membrane
  supported_by:
  - reference_id: PMID:30397314
  - reference_id: PMID:32597833
  - reference_id: PMID:41392992
  - reference_id: PMID:10861296
- description: CLN8 catalyzes acyl-CoA-dependent headgroup acylation of lysophosphatidylglycerol to form
    BMP. Purified human protein performs this biosynthetic step in vitro, and human-cell loss/rescue links
    CLN8 to cellular BMP abundance. The tested LPG has a racemic headgroup; these assays do not establish
    exclusive product stereochemistry or the downstream transformations that produce lysosomal S,S-BMP.
  molecular_function:
    id: GO:0071617
    label: lysophospholipid acyltransferase activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  directly_involved_in:
  - id: GO:2001312
    label: lysobisphosphatidic acid biosynthetic process
  supported_by:
  - reference_id: PMID:39970228
suggested_questions:
- question: How are CLN8 cargo recruitment and lipid acylation coupled in the ER, and can either activity
    be selectively disrupted without altering folding or retrieval?
- question: Which stereochemically defined BMP products does endogenous CLN8 make, and which enzymes perform
    any subsequent glycerol inversion steps?
- question: What full-text evidence underlies the older CLN8 lipid-transport, ceramide-synthesis, cholesterol-metabolism
    and negative-proteolysis assertions?
- question: Which experiments distinguish a direct CLN8 role in nervous-system development from later
    neuronal maintenance and degeneration?
- question: Does purified CLN8 reproduce the historical ceramide/GalCer overlay signal, and what are its
    affinity and lipid specificity in a membrane environment?
suggested_experiments:
- description: Compare sequence-defined human CLN8 with folding- and localization-controlled mutants in
    both lysosomal-enzyme recruitment/COPII export assays and purified LPG-acylation assays.
- description: Use enantiomerically defined LPG substrates and chiral product analysis to distinguish
    the immediate CLN8 product from downstream S,S-BMP, with enzyme-free and substrate-free controls.
- description: Measure cargo delivery, BMP pools and neuronal survival after endogenous rescue with variants
    that selectively preserve one of the two CLN8 activities.
