- id: file:human/CLN8/CLN8-primary-excerpts.md
  title: Selected original CLN8 primary passages
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Short exact passages from the original publisher texts, with DOI, public URL, section/panel,
      source hash and paragraph locator. This transcription is distinct from an authored evidence summary;
