- id: PMID:39970228
  title: TRAM-LAG1-CLN8 family proteins are acyltransferases regulating phospholipid composition.
  findings:
  - statement: Purified canonical-sequence human CLN8-HA acylates LPG using acyl-CoA to produce BMP; human
      knockout/rescue supports cellular BMP control. The tested LPG has a racemic headgroup and the product
      is not fully stereochemically resolved. CLN8 protein concentration was undetermined, so TLCD1 kinetics
