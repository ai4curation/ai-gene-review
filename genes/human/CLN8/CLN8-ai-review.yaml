gene_symbol: CLN8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLN8 is an endoplasmic-reticulum membrane protein with distinct cargo-receptor and lipid-acyltransferase
  activities. Together with CLN6 it recruits newly synthesized lysosomal enzymes, engages COPII coat machinery
  and escorts selected enzymes toward the Golgi before returning to the ER through a C-terminal retrieval
  signal. CLN8 also transfers acyl groups from acyl-CoA to lysophosphatidylglycerol to form bis(monoacylglycero)phosphate,
  contributing to cellular BMP pools. Loss of CLN8 disrupts lysosomal enzyme delivery and lipid balance
  and causes neuronal ceroid lipofuscinosis with progressive neurological decline.
