    label: extracellular region
  - id: GO:0009986
    label: cell surface
  - id: GO:0005768
    label: endosome
  in_complex:
    id: GO:1990666
    label: PCSK9-LDLR complex
  supported_by:
  - reference_id: PMID:17452316
    supporting_text: Recombinant human PCSK9 interacted in a sequence-specific manner with the first
      epidermal growth factor-like repeat (EGF-A) in the EGF homology domain of the human LDLR.
  - reference_id: PMID:17452316
    supporting_text: As a consequence, the LDLR is rerouted from the endosome to the lysosome where 
      it is degraded.
  - reference_id: PMID:18039658
    supporting_text: Such PCSK9-induced degradation does not require its catalytic activity.
  - reference_id: PMID:17080197
    supporting_text: We conclude that secreted PCSK9 associates with the LDLR and reduces hepatic 
      LDLR protein levels.
- description: Autocatalytic intramolecular cleavage of the prodomain in the endoplasmic reticulum, 
    which is required for PCSK9 maturation and secretion; the cleaved prodomain remains bound and 
    blocks further catalysis.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0016540
    label: protein autoprocessing
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:14622975
    supporting_text: Narc 1 undergoes autocatalytic intramolecular processing at the site LVFAQ/, 
      resulting in the cleavage of its prosegment and the generation of an active proteinase
  - reference_id: PMID:12552133
    supporting_text: human and mouse pro-NARC-1 are autocatalytically and intramolecularly processed
      into NARC-1
