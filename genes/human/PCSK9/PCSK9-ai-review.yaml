- term:
    id: GO:0002092
    label: positive regulation of receptor internalization
  evidence_type: IDA
  original_reference_id: PMID:17328821
  qualifier: involved_in
  review:
    summary: 'Not supported: PCSK9 reduces LDL internalization.'
