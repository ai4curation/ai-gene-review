    reason: The cited study shows PCSK9-containing medium reduces LDL internalization by HepG2 cells
      and that degradation requires an intracellular acidic compartment. PCSK9 is internalized with 
      LDLR, but the study does not show that PCSK9 increases the rate of receptor internalization.
