core_functions:
- description: Secreted PCSK9 binds the EGF-A repeat of the hepatocyte LDL receptor and, after 
    co-internalization, prevents receptor recycling so that LDLR is degraded in lysosomes; this 
    non-catalytic activity lowers LDL clearance and raises plasma LDL cholesterol.
  molecular_function:
    id: GO:0050750
    label: low-density lipoprotein particle receptor binding
  directly_involved_in:
