  evidence_type: IPI
  original_reference_id: PMID:17461796
  qualifier: enables
  supporting_entities:
  - UniProtKB:P01130
  review:
    summary: Uninformative protein binding; specific partners are captured by more specific terms.
    action: REMOVE
    reason: The IPI evidence reports physical interactions (LDLR, annexin A2, ENaC subunits, apoB, 
      MMP-2), but 'protein binding' conveys no function. The functionally important interaction, 
      binding the LDLR EGF-A repeat, is captured by GO:0050750 and the PCSK9-LDLR complex. Removal 
      does not mean the reported interactions are false.
