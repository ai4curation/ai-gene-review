- term:
    id: GO:0001920
    label: negative regulation of receptor recycling
  evidence_type: IDA
  original_reference_id: PMID:17452316
  qualifier: involved_in
  review:
    summary: PCSK9 blocks LDLR recycling.
    action: ACCEPT
    reason: PCSK9 binding to EGF-A prevents the acid-dependent conformational change required for 
      LDLR recycling.
    supported_by: &id002
    - reference_id: PMID:17452316
      supporting_text: These data are consistent with a model in which PCSK9 binding to EGF-A 
        interferes with an acid-dependent conformational change required for receptor recycling.
    - reference_id: PMID:22081141
      supporting_text: Thus, PCSK9 seems to hold LDLR in an extended conformation and to interfere 
        with conformational rearrangements required for LDLR recycling.
