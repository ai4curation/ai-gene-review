id: Q8NBP7
gene_symbol: PCSK9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Proprotein convertase subtilisin/kexin type 9 (PCSK9) is a hepatocyte-secreted 
  proteinase K-like subtilase that regulates plasma LDL cholesterol by controlling the number of LDL
  receptors on the liver surface. Pro-PCSK9 cleaves its own prodomain in the endoplasmic reticulum; 
  the prodomain stays bound as an inhibitor, so the secreted enzyme has no known trans substrate. 
  Circulating PCSK9 binds the EGF-A repeat of LDLR at the cell surface, is internalized with it, and
  binds more tightly at endosomal pH, which prevents the conformational change needed for receptor 
  recycling and diverts LDLR to lysosomes for degradation. This activity does not require catalysis.
  PCSK9 similarly targets VLDLR and ApoER2. Its expression is driven by SREBP-2 and insulin/SREBP-1c
  and inhibited by fasting; annexin A2 is an endogenous inhibitor. Gain-of-function variants cause 
  autosomal dominant hypercholesterolemia, while loss-of-function variants lower LDL cholesterol and
  coronary risk, making PCSK9 a therapeutic target.
