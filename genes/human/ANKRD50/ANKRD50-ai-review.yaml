suggested_questions:
- question: Which surfaces of ANKRD50 contact SNX27, retromer and WASH, and does its ankyrin domain bridge
    them?
- question: Does the VPS35 D620N Parkinson's mutation impair cargo recycling through loss of ANKRD50 association?
suggested_experiments:
- description: Map the ANKRD50 binding sites on SNX27, VPS35 and the WASH complex with purified proteins,
    and test which are needed to rescue GLUT1 recycling in ANKRD50-depleted cells.
