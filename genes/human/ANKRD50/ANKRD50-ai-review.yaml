  label: Homo sapiens
description: ANKRD50 (ankyrin repeat domain-containing 50) is a component of the endosomal SNX27-retromer-WASH
  sorting machinery. Found as a VPS35-interacting protein, it binds several parts of the SNX27-retromer-WASH
  complex directly and cooperatively, and is needed to recycle transmembrane cargo such as GLUT1 and the
  amino acid transporter SLC1A4 from endosomes to the plasma membrane; without it these cargoes are routed
  to lysosomes. The Parkinson's disease mutation D620N in VPS35 weakens retromer's association with ANKRD50,
  and ANKRD50 has itself been proposed as a candidate Parkinson's disease gene.
