core_functions:
- molecular_function:
    id: GO:0001733
    label: galactosylceramide sulfotransferase activity
  description: "GAL3ST1 is the mammalian cerebroside sulfotransferase. From its type II anchor in the\
    \ Golgi membrane it presents a lumenal catalytic domain that transfers sulfate from PAPS to the\
    \ 3-hydroxyl of the non-reducing terminal beta-galactose of lipid-linked sugars. Galactosylceramide\
    \ is the preferred acceptor, giving sulfatide, the major sulfoglycolipid of myelin and the O4\
    \ epitope; galactosyl alkylacylglycerol is sulfated to seminolipid in spermatocytes; lactosylceramide\
    \ and galactosyl diacylglycerol are also accepted. It is the only gene in mammals that performs\
    \ this step, so its loss abolishes both sulfatide and seminolipid, causing paranodal junction\
    \ failure with ataxia and a meiotic block in spermatogenesis."
  directly_involved_in:
  - id: GO:0046506
    label: sulfolipid biosynthetic process
  - id: GO:0006682
    label: galactosylceramide biosynthetic process
  - id: GO:0006665
    label: sphingolipid metabolic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:8830034
    supporting_text: GalCer was the best acceptor for the purified enzyme. LacCer, GalAAG, and GalDG
      were also good acceptors.
  - reference_id: PMID:9030544
    supporting_text: When the cDNA was inserted into the expression vector pSVK3 and transfected into
      COS-1 cells, galactosylceramide sulfotransferase activity in the transfected cells increased
      from 8- to 16-fold over that of controls, and the enzyme product, sulfatide, was expressed on
      the transformed cells.
  - reference_id: PMID:11917099
    supporting_text: Cst(-/-) mice lacked sulfatide in brain and seminolipid in testis, proving that a
      single gene copy is responsible for their biosynthesis.
suggested_questions:
- question: "Does GAL3ST1 sulfate histone H3 Tyr99, as PMID:41686426 (Cancer Res 2026) reports? The\
    \ underlying modification, H3Y99sulf, was defined in PMID:36805701 and formally challenged in PMID:40890505,\
    \ which reannotated the original raw mass spectra as a phosphotyrosine peptide and detected no histone\
    \ sulfation. PMID:41686426 cites the 2023 paper as settled background and does not cite the refutation,\
    \ and its H3Y99sulf readouts are immunoblot and CUT&RUN with the antibody class the refutation says\
    \ needs further validation. None of the papers has been retracted."
  experts: []
- question: "How would a Golgi type II membrane protein whose catalytic domain faces the lumen sulfate\
    \ a nascent histone in the cytosol? PMID:41686426 shows the in vitro reaction with purified soluble\
    \ His-GAL3ST1, which bypasses the topology entirely. Is there a cytosolic pool of GAL3ST1, an alternative\
    \ translation start or splice form lacking the transmembrane anchor, or is the in vitro activity\
    \ an artefact of removing the protein from its membrane?"
  experts: []
- question: "Two different enzymes are now claimed to write the same mark: SULT1B1 (PMID:36805701) and\
    \ GAL3ST1 (PMID:41686426). These attributions are mutually inconsistent. If the mark exists, a side-by-side\
    \ assay of both recombinant enzymes on the same histone substrate, read out by sulfate-preserving\
    \ mass spectrometry, is needed."
  experts: []
- question: "GO can express the disputed claim - GO:0008476 protein-tyrosine sulfotransferase activity\
    \ and GO:0006478 peptidyl-tyrosine sulfation both exist - but in human the activity term is annotated\
    \ only to TPST1 and TPST2. Should the GO Consortium record contested molecular functions of this\
    \ kind explicitly, rather than leaving the absence of an annotation to be read as either 'refuted'\
    \ or 'not yet curated'?"
  experts: []
- question: Beyond the histone question, does the strong GAL3ST1 upregulation seen in renal cell
    carcinoma and gastric cancer act through sulfatide itself - for example through sulfatide-dependent
    selectin binding or membrane organization - rather than through any protein-sulfating activity?
  experts: []
suggested_experiments:
- hypothesis: GAL3ST1 does not sulfate histone H3 Tyr99.
  description: "Incubate purified recombinant GAL3ST1 (both the full-length protein reconstituted in\
    \ a membrane mimetic and the soluble lumenal domain) with recombinant histone H3.2 and PAPS, and\
    \ analyse by tandem mass spectrometry using electron-transfer rather than collisional dissociation,\
    \ so that any sulfotyrosine survives fragmentation. Run synthetic Y99-sulfo and Y99-phospho peptides\
    \ as retention-time and fragmentation standards on the same gradient, include blanks between runs\
    \ to exclude carryover, and include galactosylceramide as the positive-control acceptor to confirm\
    \ the enzyme preparation is active."
  experiment_type: in vitro enzyme assay with electron-transfer tandem mass spectrometry
- hypothesis: GAL3ST1's catalytic domain is not accessible to cytosolic substrates.
  description: "Test topology directly with a protease-protection assay on isolated Golgi membranes and\
    \ with N-glycosylation-site mapping, and test for a cytosolic pool by digitonin fractionation and\
    \ by split-fluorophore complementation using a cytosolically expressed tag. If the catalytic domain\
    \ is exclusively lumenal and no cytosolic pool exists, the proposed histone reaction cannot occur\
    \ in cells as described."
  experiment_type: membrane topology and subcellular fractionation
- hypothesis: The gastric cancer phenotype attributed to GAL3ST1-dependent histone sulfation is
    instead driven by sulfatide.
  description: "Compare GAL3ST1 knockout gastric cancer cells rescued with wild-type GAL3ST1 versus a\
    \ catalytically dead PAPS-binding mutant, and separately test whether exogenous sulfatide supplementation\
    \ or CGT (UGT8) co-manipulation reproduces or rescues the migration and EMT phenotypes. Quantify\
    \ sulfatide by lipidomics in every arm. This separates a lipid-mediated mechanism from the proposed\
    \ chromatin mechanism without depending on the contested antibody."
  experiment_type: structure-function rescue with lipidomics
