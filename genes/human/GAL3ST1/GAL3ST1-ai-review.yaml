gene_symbol: GAL3ST1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: "Galactosylceramide 3'-sulfotransferase (cerebroside sulfotransferase, EC 2.8.2.11), a\
  \ single-pass type II membrane protein of the Golgi apparatus whose catalytic domain faces the Golgi\
  \ lumen. It transfers sulfate from 3'-phosphoadenosine 5'-phosphosulfate to the 3-hydroxyl of the\
  \ non-reducing terminal beta-galactose of galactolipids, converting galactosylceramide into sulfatide\
  \ (3-O-sulfogalactosylceramide) and galactosyl alkylacylglycerol into seminolipid. It also sulfates\
  \ lactosylceramide and galactosyl diacylglycerol in vitro, preferring beta-galactosides at the\
  \ non-reducing end of lipid-linked sugar chains. This is the only gene in mammals that makes\
  \ sulfoglycolipids: mice lacking it have no sulfatide in brain and no seminolipid in testis, develop\
  \ paranodal junction abnormalities with hindlimb weakness, tremor and progressive ataxia, and males\
  \ are sterile through a block in spermatogenesis before the first meiotic division. Sulfatide is a\
  \ major myelin lipid and the epitope of the oligodendrocyte marker O4. In humans the gene is\
  \ expressed in kidney proximal tubule and gastric mucosa and is strongly upregulated in renal cell\
  \ carcinoma and other tumours. A 2026 report additionally proposed that GAL3ST1 acts as a histone\
  \ sulfotransferase modifying tyrosine 99 of cytosolic nascent histone H3, but that modification is\
  \ itself disputed and the proposed reaction is difficult to reconcile with the enzyme's lumenal\
  \ Golgi topology."
