- id: PMID:36805701
  title: Histone tyrosine sulfation by SULT1B1 regulates H4R3me2a and gene transcription.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: "PubMed-verified (Nat Chem Biol 2023;19:855-864). Defines the H3Y99sulf mark that PMID:41686426\
      \ later attributes to GAL3ST1, and attributes it to a different enzyme (SULT1B1). Formally contested\
      \ by PMID:40890505; the authors replied (PMID:40890506) and an Author Correction was issued (PMID:40890508).\
      \ Not retracted. Cited only to document the dispute; no GAL3ST1 annotation derives from it."
- id: PMID:40890505
  title: Mass spectrometry and enzyme assays refute histone tyrosine sulfation.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: "PubMed-verified (Nat Chem Biol 2025;21:1667-1670), full text available via PMC12978989.\
      \ A formal Matters Arising arguing that the H3Y99sulf spectra fit a phosphotyrosine peptide, that\
      \ sulfotyrosine cannot give the reported 100% sulfate-retaining HCD fragments, and that recombinant\
      \ enzyme gave no histone H3.2 sulfation. Bears on GAL3ST1 because it questions the existence of\
      \ the mark and the specificity of the antibody used to detect it. Marked DISPUTED because the original\
      \ authors contest it, not because of any citation problem."
- id: PMID:40890506
  title: 'Reply to: Mass spectrometry and enzyme assays refute histone tyrosine sulfation.'
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: PubMed-verified (Nat Chem Biol 2025;21:1671-1674). The original authors' reply. No
      abstract in PubMed and the cached record is abstract-only, so its arguments could not be
      assessed. Its existence is why the dispute is treated as unresolved rather than settled.
- id: PMID:41686426
  title: GAL3ST1-Mediated Histone Tyrosine Sulfation Induced by Cancer-Associated Fibroblasts Promotes
    Gastric Cancer Metastasis.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: "PubMed-verified (Cancer Res 2026;86:2429-2446), full text available via PMC13176828.\
      \ Claims GAL3ST1 is a histone sulfotransferase writing H3Y99sulf in the cytosol. Three concerns:\
      \ the mark itself is contested by PMID:40890505, which this paper does not cite; the readouts rest\
      \ on the anti-H3Y99sulf antibody class the refutation says needs further validation; and the proposed\
      \ cytosolic reaction is hard to reconcile with GAL3ST1's type II Golgi topology, since the in vitro\
      \ assay used purified soluble His-GAL3ST1. No GO annotation for GAL3ST1 currently derives from\
      \ this paper."
