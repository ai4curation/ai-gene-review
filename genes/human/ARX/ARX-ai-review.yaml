suggested_questions:
- question: Which original supplemental experiments support the five human ARX enteroendocrine subtype
    annotations in the 2023 study, and how do they relate to its ZNF800-null overexpression results?
- question: Does ARX participate directly in D-cell differentiation, or does its effect reflect repression
    and allocation of alternative intestinal endocrine lineages?
- question: What exact construct and assay routes support the original ARX–ACTN1 and ARX–PICK1 screen
    pairs?
- question: Which endogenous target genes connect ARX DNA binding to each pancreatic, intestinal and neuronal
    developmental program?
