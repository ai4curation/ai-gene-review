id: Q96QS3
gene_symbol: ARX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARX is a paired homeobox transcription factor that binds cis-regulatory DNA and activates
  or represses gene expression according to target and cellular context. It acts in the nucleus and participates
  in neuronal development, pancreatic alpha-cell specification and selected intestinal endocrine lineages.
  ARX can cooperate with the histone demethylase PHF8 in activating KDM5C; histone demethylation is performed
  by the associated enzymes. Pathogenic ARX variants cause a spectrum of X-linked neurodevelopmental disorders,
  including developmental and epileptic encephalopathy, Partington syndrome and lissencephaly with abnormal
  genitalia. Developmental effects and endocrine subtype requirements differ among experimental systems.
