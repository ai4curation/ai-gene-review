id: Q9BQI3
gene_symbol: EIF2AK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EIF2AK1 (heme-regulated inhibitor, HRI) is a cytosolic serine/threonine kinase of the eIF2alpha
  kinase family that phosphorylates eIF2alpha (EIF2S1) on Ser51, attenuating global cap-dependent translation
  while promoting translation of ISR mRNAs such as ATF4. HRI is most abundant in erythroid precursors,
  where its N-terminal and kinase-insert heme-binding domains sense intracellular heme: heme keeps the
  kinase inactive, and heme deficiency relieves inhibition and triggers autophosphorylation, so that globin
  synthesis is matched to heme availability and erythroid cells survive iron deficiency. HRI is also activated
  by oxidative and other cytoplasmic stresses, and is the eIF2alpha kinase that relays mitochondrial stress
  to the cytosol: the OMA1-cleaved C-terminal fragment of DELE1, or full-length DELE1 stabilized on the
  mitochondrial surface under iron limitation, binds and activates HRI. The HRI branch of the integrated
  stress response additionally drives PINK1/PRKN-independent mitophagy through mitochondrial accumulation
  of phospho-eIF2, and has been implicated in a cytosolic protein-folding response supporting innate immune
  signalosome assembly.'
