suggested_questions:
- question: How do heme sensing and DELE1 binding interact structurally in HRI — does DELE1 activation
    override heme-mediated inhibition, and is this important in non-erythroid tissues?
- question: Is HRI a bona fide sensor of cytosolic protein misfolding (cUPR), and if so what molecular
    feature of misfolded proteins does it detect?
suggested_experiments:
- hypothesis: DELE1-CTD and heme bind distinct HRI sites and act antagonistically on kinase activation.
  description: Reconstitute purified HRI with DELE1-CTD oligomers across heme concentrations and measure
    autophosphorylation and eIF2alpha phosphorylation; map binding sites by crosslinking-MS or cryo-EM.
  experiment_type: biochemical reconstitution / structural biology
