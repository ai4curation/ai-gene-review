- id: PMID:10700239
  title: Mutations in the tyrosine phosphatase CD45 gene in a child with severe combined immunodeficiency disease.
  findings:
  - statement: Compound heterozygous PTPRC mutations cause SCID with few, unresponsive T cells and declining immunoglobulin
      levels.
    supporting_text: Thus, CD45 deficiency in humans results in T- and B-lymphocyte dysfunction.
- id: PMID:11201744
  title: CD45 is a JAK phosphatase and negatively regulates cytokine receptor signalling.
  findings:
  - statement: CD45 directly dephosphorylates and binds JAKs and negatively regulates cytokine receptor signaling.
    supporting_text: In vitro, CD45 directly dephosphorylates and binds to JAKs.
- id: PMID:17719247
  title: The differential regulation of Lck kinase phosphorylation sites by CD45 is critical for T cell receptor
    signaling responses.
  findings:
  - statement: CD45 acts as a rheostat, differentially dephosphorylating LCK pTyr505 and pTyr394.
    supporting_text: These results are explained by a rheostat mechanism whereby CD45 differentially regulates the
      negatively acting pTyr-505 and positively acting pTyr-394 p56(lck) tyrosine kinase phosphorylation sites.
- id: PMID:31641081
  title: CD45 functions as a signaling gatekeeper in T cells.
  findings:
  - statement: CD45 both maintains a regulatable pool of active LCK and suppresses zeta-chain phosphorylation, filtering
      weak signals.
    supporting_text: Acute inhibition of Csk revealed that CD45 suppressed ζ-chain phosphorylation and was necessary
      for a regulatable pool of active Lck, thereby interconnecting the activating and suppressive roles of CD45
      that tune antigen discrimination.
- id: PMID:23580664
  title: The large ectodomains of CD45 and CD148 regulate their segregation from and inhibition of ligated T-cell
    receptor.
  findings:
  - statement: Size-based exclusion of the CD45 ectodomain from ligated TCR prevents CD45 from inhibiting TCR triggering.
    supporting_text: Our results suggest that the large ectodomains of CD45 and CD148 modulate their inhibitory
      effect by enabling their passive, size-based segregation from ligated TCR, supporting the kinetic-segregation
      model of TCR triggering.
- id: PMID:39454026
  title: Orientation-dependent CD45 inhibition with viral and engineered ligands.
  findings:
  - statement: CD45 has no known physiological ligand, but extracellular dimerizing ligands such as adenovirus E3/49K
      inhibit its phosphatase activity.
    supporting_text: The adenovirus E3/49K protein has taught us that, despite a lack of a known ligand, CD45 activity
      can be modulated by extracellular dimerizing ligands that perturb its phosphatase activity and alter T cell
      responses.
- id: PMID:11145714
  title: A deletion in the gene encoding the CD45 antigen in a patient with SCID.
  findings:
  - statement: A homozygous in-frame PTPRC deletion abolishing surface CD45 is associated with SCID.
    supporting_text: provides direct evidence for the importance of CD45 in immune function in humans
