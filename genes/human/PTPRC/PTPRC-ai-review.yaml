suggested_questions:
- question: Does CD45 have a physiological ligand that regulates its phosphatase activity? Galectin-1, CD22 and
    CLEC10A bind it and viral proteins (CMV UL11, adenovirus E3/49K) inhibit it, the latter by dimerizing the ectodomain
    (PMID:39454026), yet no host ligand is established. The answer bears on whether 'transmembrane receptor protein
    tyrosine phosphatase activity' (which requires signal binding) describes CD45 or is only a structural classification.
- question: Do the CD45RA/RB/RC versus CD45RO isoforms differ in catalytic activity, substrate access or dimerization
    in human T cells, or only in their segregation from the TCR at contacts?
- question: Is the reported beta-catenin binding (IPI from PMID:12370829) a curation error, since the abstract states
    CD45 catalytic domains did not detectably bind catenins?
suggested_experiments:
- description: Quantitative phosphoproteomics in primary human T, B and myeloid cells after acute, chemically induced
    inactivation of CD45 (e.g. an engineered inhibitor-sensitive allele) to distinguish direct substrates (LCK Y505/Y394,
    JAKs, ITAMs) from indirect effects.
  experiment_type: phosphoproteomics
- description: Reconstituted supported-bilayer assays with CD45 isoforms of different ectodomain length to measure
    how ectodomain size controls exclusion from TCR-pMHC close contacts and the resulting ITAM phosphorylation.
  experiment_type: in vitro reconstitution
- description: Screen for endogenous ligands that dimerize or cluster the CD45 ectodomain (as adenovirus E3/49K
    does), and test whether they change CD45 catalytic activity and TCR signaling thresholds in primary human T
    cells.
  experiment_type: ligand screening
