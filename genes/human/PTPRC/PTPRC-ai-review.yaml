- term:
    id: GO:0005001
    label: transmembrane receptor protein tyrosine phosphatase activity
  evidence_type: IGI
  original_reference_id: PMID:12574355
  qualifier: enables
  supporting_entities:
  - UniProtKB:P05112
  review:
    summary: Anti-CD45 ligation suppressed IL-4-induced JAK and STAT6 phosphorylation in human B cells.
    action: ACCEPT
    reason: PTPRC is a single-pass transmembrane PTP whose catalytic activity can be modulated from outside the
      cell (antibody ligation here; galectin-1 and CMV UL11 binding elsewhere). The transmembrane receptor PTP term
      is the standard GO classification for receptor-type PTPs and is acceptable, although a physiological ligand
      that regulates CD45 activity is not established. CD45 has no known physiological ligand, but extracellular
      dimerizing ligands such as adenovirus E3/49K modulate its catalytic activity (PMID:39454026), which fits the
      receptor-PTP framing.
    supported_by:
    - *id002
    - reference_id: PMID:10369126
      supporting_text: Incubation of Jurkat cells with galectin-1 suppressed the immunoprecipitated PTPase activity
        of CD45.
    - &id006
      reference_id: PMID:39454026
      supporting_text: The adenovirus E3/49K protein has taught us that, despite a lack of a known ligand, CD45
        activity can be modulated by extracellular dimerizing ligands that perturb its phosphatase activity and
        alter T cell responses.
