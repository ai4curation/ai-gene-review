core_functions:
- description: Receptor-type protein tyrosine phosphatase that dephosphorylates the inhibitory C-terminal tyrosine
    of Src-family kinases (LCK Tyr505, and FYN, LYN, HCK), keeping them activatable so that antigen receptors (TCR,
    BCR) and Fc receptors can initiate ITAM-based signaling in leukocytes; it can also dephosphorylate activating
    tyrosines, setting the signaling threshold.
