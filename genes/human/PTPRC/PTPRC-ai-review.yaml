id: P08575
gene_symbol: PTPRC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTPRC (CD45, leukocyte common antigen) is a type I transmembrane receptor-type protein tyrosine phosphatase
  expressed on all nucleated hematopoietic cells. A large, heavily O- and N-glycosylated extracellular region, whose
  length varies through alternative splicing of exons 4-6 (CD45RA, RB, RC and the short CD45RO isoform), is followed
  by a single transmembrane segment and a cytoplasmic region with two tandem PTP domains, of which the membrane-proximal
  D1 domain is catalytic and the D2 domain contributes to substrate recognition. CD45''s best-defined substrates
  are Src-family kinases: by dephosphorylating the inhibitory C-terminal tyrosine (Tyr505 in LCK), it keeps LCK,
  FYN, LYN and HCK in an activatable state, which is required for T cell and B cell antigen receptor signaling and
  for Fc receptor signaling in myeloid cells. CD45 can also dephosphorylate activating sites, such as the LCK activation-loop
  Tyr394 and kinase-domain tyrosines of HCK and LYN, so it both enables and restrains immunoreceptor signaling depending
  on its level and membrane localization; its size-based exclusion from close contacts between T cells and antigen-presenting
  cells is part of models of TCR triggering. CD45 also acts as a JAK phosphatase that dampens cytokine and interferon
  receptor signaling. It associates with LCK, ankyrin, the integrin CD11a and the tetraspanin CD53, and has no established
  physiological ligand, although galectin-1 binds it and viral proteins (cytomegalovirus UL11, adenovirus E3/49K,
  which dimerizes the ectodomain) bind and inhibit it. CD45 deficiency in humans causes severe combined immunodeficiency
  with defective T and B lymphocyte function.'
