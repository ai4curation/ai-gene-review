      family kinases associated with B-cell and T-cell antigen receptor signaling by constitutive dephosphorylation
      of the inhibitory carboxy-terminal tyrosine phosphorylation site.
  - reference_id: PMID:14625311
    supporting_text: The Src family kinase, Lck, is a major CD45 substrate in T cells and CD45 dephosphorylation
      of Lck is important for both T cell development and activation.
  - reference_id: PMID:17719247
    supporting_text: These results are explained by a rheostat mechanism whereby CD45 differentially regulates the
