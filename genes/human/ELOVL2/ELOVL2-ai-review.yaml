id: Q9NXB9
gene_symbol: ELOVL2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELOVL2 is a multipass endoplasmic-reticulum membrane enzyme that catalyzes the malonyl-CoA-dependent
  condensation step of fatty-acid elongation. It preferentially elongates C20 and C22 polyunsaturated
  acyl-CoAs in the omega-3 and omega-6 pathways, including formation of C24 precursors for docosahexaenoic
  acid synthesis through the Sprecher pathway. Separate reductase and dehydratase enzymes complete
  each two-carbon elongation cycle. ELOVL2-dependent polyunsaturated acyl chains contribute to membrane
  lipids, including specialized sphingolipids in mammalian testis, and support retinal and reproductive
  physiology.
