core_functions:
- description: ER-membrane fatty-acid condensing enzyme that preferentially elongates C20/C22 polyunsaturated
    acyl-CoAs using malonyl-CoA; subsequent elongation-cycle enzymes complete the two-carbon extension.
    Its products support omega-3/omega-6 lipid synthesis and provide precursors for specialized sphingolipid
    acyl chains.
