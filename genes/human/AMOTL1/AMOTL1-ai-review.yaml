    supporting_text: we show that the AMOTL1 polypeptide is partially disordered, and binds the YAP WW
      domains to form an ensemble of complexes of varying stabilities.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Biophysics of the AMOTL1-YAP complex.
