- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000381812
  - ZFIN:ZDB-GENE-030131-7487
  - ZFIN:ZDB-GENE-030131-9770
  review:
    summary: Angiogenesis, inherited from the angiomotin family node. AMOTL1 stability does affect endothelial
      sprouting, but the effect is indirect; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: 'This IBA comes from an angiomotin-family PANTHER node whose experimental seeds are mainly
      zebrafish amot and amotl2a. For AMOTL1 itself the characterized roles are tight-junction scaffolding
      and YAP1 regulation, so the family-level term is retained as non-core context rather than accepted
      as a core function. There is AMOTL1-specific endothelial evidence: loss of AMOTL1 stability loosens
      junctions [PMID:27498087 "HECW2 depletion in human ECs decreases AMOTL1 stability, loosening the
      cell-to-cell junctions"] and increases angiogenic sprouting [PMID:27498087 "Knockdown of HECW2 also
      results in increased angiogenic sprouting"], acting through junction integrity and YAP.'
    supported_by:
    - reference_id: PMID:27498087
      supporting_text: HECW2 depletion in human ECs decreases AMOTL1 stability, loosening the cell-to-cell
        junctions
    - reference_id: PMID:27498087
      supporting_text: Knockdown of HECW2 also results in increased angiogenic sprouting
