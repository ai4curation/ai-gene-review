id: Q8IY63
gene_symbol: AMOTL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMOTL1 (angiomotin-like 1) is a peripheral membrane scaffold of the angiomotin family, with
  a central coiled-coil domain, N-terminal PPxY motifs and a C-terminal PDZ-binding motif. It localizes
  to tight junctions, anchored through multi-PDZ scaffolds, and binds the WW domains of the Hippo-pathway
  co-activator YAP1 through its PPxY motifs, regulating YAP1 movement between cytoplasm and nucleus. Its
  abundance is controlled by NEDD4-family ubiquitin ligases and by KIBRA and Merlin. Like other angiomotins
  it has been implicated in endothelial migration and angiogenesis.
