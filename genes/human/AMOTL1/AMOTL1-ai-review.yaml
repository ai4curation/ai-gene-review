  review:
    summary: Establishment of cell polarity in ameboidal migration, inherited from the angiomotin family
      node. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: This IBA comes from an angiomotin-family PANTHER node whose experimental seeds are mainly
      mouse Amot and Amotl1. For AMOTL1 itself the characterized roles are tight-junction scaffolding
      and YAP1 regulation, so the family-level term is retained as non-core context rather than accepted
      as a core function. Polarized migration is best characterized for AMOT (p80/p130 isoforms) in endothelial
      cells.
    supported_by:
    - reference_id: PMID:11733531
      supporting_text: We identified a novel peripheral membrane protein at TJs and named it junction-enriched
        and -associated protein (JEAP).
