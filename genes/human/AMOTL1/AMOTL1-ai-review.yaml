  title: Characterization of the human COP9 signalosome complex using affinity purification and mass spectrometry.
  findings:
  - statement: Proteomic survey of CSN-interacting proteins.
    supporting_text: A total of 52 putative human CSN interacting proteins were identified, most of which
      are reported for the first time.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only. Source of the COP9 colocalization row.
- id: PMID:21187284
  title: Angiomotin-like proteins associate with and negatively regulate YAP1.
  findings:
  - statement: AMOTL1 and AMOTL2 bind YAP1 directly and regulate its nuclear translocation.
    supporting_text: We demonstrate that AMOTL1 and AMOTL2 can regulate YAP1 cytoplasm-to-nucleus translocation
      through direct protein-protein interaction, which can occur independent of YAP1 phosphorylation
      status.
  - statement: AMOTL1 is a PY-motif YAP1 partner.
    supporting_text: Here, we describe the identification of several new PY motif-containing proteins,
      including angiomotin-like protein 1 (AMOTL1) and 2 (AMOTL2), as YAP1-associated proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
