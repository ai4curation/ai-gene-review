    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21187284
  qualifier: enables
  supporting_entities:
  - UniProtKB:P46937
  review:
    summary: 'Binding to YAP1: AMOTL1 PPxY motifs bind the YAP WW domains. Modified to WW domain binding.'
    action: MODIFY
    reason: AMOTL1 binds YAP1 directly through its PPxY motifs and regulates YAP1 nuclear translocation
      [PMID:21187284 "We demonstrate that AMOTL1 and AMOTL2 can regulate YAP1 cytoplasm-to-nucleus translocation
      through direct protein-protein interaction, which can occur independent of YAP1 phosphorylation
      status."]; NMR and calorimetry show its PPxY region binding the YAP WW domains [PMID:35481651 "we
      show that the AMOTL1 polypeptide is partially disordered, and binds the YAP WW domains to form an
      ensemble of complexes of varying stabilities."]. Per the project's GO:0005515 policy the generic
      term is replaced by the informative binding term.
    supported_by:
    - reference_id: PMID:21187284
      supporting_text: We demonstrate that AMOTL1 and AMOTL2 can regulate YAP1 cytoplasm-to-nucleus translocation
        through direct protein-protein interaction, which can occur independent of YAP1 phosphorylation
        status.
    - reference_id: PMID:21187284
      supporting_text: We demonstrate that AMOTL1 and AMOTL2 can regulate YAP1 cytoplasm-to-nucleus translocation
        through direct protein-protein interaction, which can occur independent of YAP1 phosphorylation
        status.
    - reference_id: PMID:35481651
      supporting_text: we show that the AMOTL1 polypeptide is partially disordered, and binds the YAP
        WW domains to form an ensemble of complexes of varying stabilities.
    proposed_replacement_terms:
    - id: GO:0050699
      label: WW domain binding
