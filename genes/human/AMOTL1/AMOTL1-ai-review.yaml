  review:
    summary: Binding to MPDZ, a PDZ-domain protein. AMOTL1's C-terminus is a PDZ-binding motif; modified
      to PDZ domain binding.
    action: MODIFY
    reason: AMOTL1 ends in a class II PDZ-binding motif (C-terminal ...EVLI), and its junctional anchoring
      is through multi-PDZ scaffolds. The source [PMID:33961781 "Here we present BioPlex 3.0, the most
      complete model of the human interactome to date"] records binding to MPDZ, a PDZ-domain protein,
      which is the interaction class the motif mediates. Where the source is the PDZ-PBM affinity screen
      these are peptide-domain affinities rather than cellular interactions. Per the project's GO:0005515
      policy the generic term is replaced by the informative binding term.
    supported_by:
