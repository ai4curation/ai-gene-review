  title: Identification and characterization of a novel tight junction-associated family of proteins that
    interacts with a WW domain of MAGI-1.
  findings:
  - statement: An angiomotin-family protein localizes to tight junctions via its coiled coil.
    supporting_text: When expressed in Madin-Darby canine kidney cells, the full-length novel protein
      was found to colocalize with MAGI-1 at the tight junction of these cells and the coiled-coil domain
      was found to be necessary for this localization.
  - statement: The paper addresses a family of MAGI-1-binding proteins.
    supporting_text: Identification and characterization of a novel tight junction-associated family of
      proteins that interacts with a WW domain of MAGI-1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. The abstract describes AMOTL2 (MASCOT/KIAA0989); the title covers the
      family. The AMOTL1 IDA rows are deferred to the full-text curation.
