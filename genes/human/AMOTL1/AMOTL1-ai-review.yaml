  review:
    summary: Angiogenesis, inherited through the PANTHER node from the angiomotin family. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: 'Angiomotin-like proteins are tight-junction proteins: the family member characterized by
      Patrie colocalizes with MAGI-1 at tight junctions through its coiled-coil domain [PMID:16019084
      "When expressed in Madin-Darby canine kidney cells, the full-length novel protein was found to colocalize
      with MAGI-1 at the tight junction of these cells and the coiled-coil domain was found to be necessary
      for this localization."]. AMOTL1 is a junctional scaffold [file:genes/human/AMOTL1/AMOTL1-deep-research-affinage.md
      "AMOTL1 is a peripheral membrane scaffold protein of tight junctions that acts as a central regulator
      of Hippo/YAP signaling"]. Angiogenic roles are established mainly for angiomotin family members
      in endothelial cells; for AMOTL1 this is inherited context.'
    supported_by:
    - reference_id: PMID:16019084
      supporting_text: When expressed in Madin-Darby canine kidney cells, the full-length novel protein
        was found to colocalize with MAGI-1 at the tight junction of these cells and the coiled-coil domain
        was found to be necessary for this localization.
    - reference_id: file:genes/human/AMOTL1/AMOTL1-deep-research-affinage.md
      supporting_text: AMOTL1 is a peripheral membrane scaffold protein of tight junctions that acts as
        a central regulator of Hippo/YAP signaling
