  review:
    summary: Binding to MPDZ, a PDZ-domain scaffold, in a cellular interaction map. Modified to PDZ domain
      binding.
    action: MODIFY
    reason: AMOTL1 ends in a class II PDZ-binding motif (C-terminal ...EVLI; UniProt motif 953-956 [file:genes/human/AMOTL1/AMOTL1-uniprot.txt
      "FT   MOTIF           953..956"]), and this motif mediates binding to the PDZ3 domain of MUPP1 and
      to Patj [PMID:17397395 "PDZ2 and -3 were responsible for MUPP1's interaction with Amot and MASCOT,
      whereas only PDZ3 was responsible for its interaction with JEAP."], [PMID:17397395 "The C-terminal
      PDZ-binding motives of the Amot/JEAP family were required for these interactions."]. This row records
      MPDZ co-purifying with AMOTL1 in cells [PMID:33961781 "Here we present BioPlex 3.0, the most complete
      model of the human interactome to date"], consistent with the motif-mediated binding of the Amot/JEAP
      family to multi-PDZ scaffolds. Per the project's GO:0005515 policy the generic term is replaced
      by the informative binding term.
    supported_by:
