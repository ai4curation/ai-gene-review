id: Q13568
gene_symbol: IRF5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interferon regulatory factor 5 (IRF5) is a latent cytoplasmic IRF-family transcription
  factor that is activated downstream of endolysosomal TLR7, TLR8 and TLR9 and NOD/RIP2 signaling.
  Phosphorylation, including by IKK-beta after TASL recruitment, drives dimerization, nuclear
  translocation, ISRE binding and transcriptional activation of type I interferon and inflammatory
  cytokine genes.
