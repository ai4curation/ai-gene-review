- id: PMID:40355545
  title: ALDH4A1 functions as an active component of the MPC complex maintaining mitochondrial pyruvate
    import for TCA cycle entry and tumour suppression.
  findings:
  - statement: 'Reports ALDH4A1 as a third component of the mitochondrial pyruvate carrier: loss
      of ALDH4A1 impairs pyruvate entry into mitochondria and TCA cycle entry, ALDH4A1 co-immunoprecipitates
      and co-elutes with MPC1 and MPC2 as a trimeric complex, and ALDH4A1 stimulates pyruvate transport
      by MPC1-MPC2 proteoliposomes.'
    reference_section_type: RESULTS
  - statement: 'The effect is catalytically independent: the type II hyperprolinemia substitution
      S352L, which abolishes P5C dehydrogenase activity, stimulates reconstituted pyruvate transport
      as well as wild-type ALDH4A1, and tumour suppression is likewise enzyme-activity independent.'
    reference_section_type: RESULTS
  - statement: MPC1 and MPC2 together already transport pyruvate in the same proteoliposome assay
      without ALDH4A1; ALDH4A1 enhances that activity rather than being required for it.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Nat Cell Biol 2025;27:847-862, PMC12188464). The citation is correct
      and the experiments are internally consistent, but the central claim - that ALDH4A1 is a constituent
      subunit of the MPC - is a single-laboratory result that has not been independently replicated
      and is in tension with three 2025 cryo-EM analyses of human MPC (PMID:40101766, PMID:40044865,
      PMID:40691140) that define the transporter as an MPC1-MPC2 heterodimer enclosing the whole
      translocation pathway. Those structures do not refute an accessory association, since each
      was built from heterologously co-expressed MPC1 and MPC2 only. The paper's own reconstitution
      shows MPC1 plus MPC2 transporting pyruvate without ALDH4A1, which fits an accessory/stabilising
      role better than the "third component" framing. Recorded as disputed rather than annotated.
