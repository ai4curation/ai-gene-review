knowledge_gaps:
- gap_statement: >-
    ALDH4A1 binding and enhancement of MPC1-MPC2 transport are supported experimentally, but the native
    occupancy, stoichiometry and precise activation mechanism remain unresolved.
  boundary: >-
    Human enzyme catalysis/dimerization and the two-subunit MPC transport pathway are established. PMID:40355545
    adds biochemical and human-cell evidence for an accessory contribution independent of catalytic S352L
    activity. Its gel filtration/BN-PAGE association data do not determine a unique native stoichiometry,
    and the proteoliposome enhancement does not distinguish altered carrier incorporation/stability from
    increased turnover of an equal amount of correctly oriented carrier.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Defines how the catalytic enzyme and accessory transport-enhancing roles coexist and
    how broadly the second role operates across tissues.
  resolution: Quantify native ALDH4A1:MPC occupancy and oligomeric state; normalize reconstituted
    transport to incorporated MPC amount and orientation and compare with unrelated matrix-protein
    controls and specific binding-site mutants.
  provenance:
  - reference_id: PMID:40355545
    supporting_text: Either wild-type ALDH4A1 or mutant ALDH4A1(S352L) further enhanced pyruvate
      transport by MPC1–MPC2 in a time-dependent manner compared with MPC1–MPC2
    reference_section_type: RESULTS
  - reference_id: PMID:40044865
    supporting_text: Our structures show that MPC1 and MPC2 form a heterodimer with the substrate
      translocation pathway at the center of the dimer interface, defining the basic functional unit
      and architecture of this important transporter family.
    reference_section_type: RESULTS
suggested_questions:
- question: What fraction of native mitochondrial MPC1-MPC2 carries ALDH4A1, with what stoichiometry
    and ALDH4A1 oligomeric state, and how does this vary across tissues?
- question: Does ALDH4A1 increase MPC1-MPC2 transport turnover at fixed incorporated transporter
    amount/orientation, stabilize the complex during reconstitution, or both?
- question: Does the interaction-defective ALDH4A1 deletion preserve purified P5CDH kinetics and
    native dimer assembly, beyond retaining the reported cellular proline-regulation phenotype?
suggested_experiments:
- hypothesis: ALDH4A1 increases transport by binding and stabilizing or activating the MPC
    heterodimer.
  description: Compare MPC1-MPC2 proteoliposomes with WT ALDH4A1, S352L, a binding-site mutant and
    an unrelated matrix protein. Quantify incorporated MPC1/MPC2, orientation, vesicle integrity and
    initial transport rates. Pair this with native-mitochondrial occupancy/stoichiometry
    measurements and independent validation of mutant catalytic activity and dimerization.
  experiment_type: quantitative transport reconstitution and native complex analysis
