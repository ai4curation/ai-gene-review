- term:
    id: GO:0141109
    label: transporter activator activity
  evidence_type: IDA
  original_reference_id: PMID:40355545
  review:
    summary: >-
      ALDH4A1 binds MPC1-MPC2 and increases its reconstituted pyruvate transport.
    action: NEW
    reason: >-
      The live GO:0141109 definition requires binding to and increasing transporter activity. PMID:40355545
      provides recombinant-protein binding/complex assays plus Figure 7 proteoliposomes comparing MPC1-MPC2
      alone with addition of wild-type human ALDH4A1 or inactive S352L; both increase radiolabel uptake
      over time. Human-cell association-defective deletion and catalytic-mutant rescue experiments corroborate
      a noncatalytic contribution. ALDH4A1 itself supplies the interacting accessory protein, rather than
      merely being a metabolic substrate. Propose only this bounded MF: no standalone pyruvate-transporter
      activity, fixed-stoichiometry complex or additional transport-process annotation. MPC amount/orientation
      normalization and the precise distinction between stabilization during reconstitution and kinetic
      activation remain limitations; other matrix-protein controls and native stoichiometry would strengthen
      the mechanism. This reported moonlighting activity is kept outside the defining catalytic core.
    supported_by:
    - reference_id: PMID:40355545
      supporting_text: Remarkably, wild-type ALDH4A1 or ALDH4A1(S352L) could markedly enhance
        pyruvate transport into proteoliposomes by MPC1–MPC2
      reference_section_type: RESULTS
    - reference_id: PMID:40355545
      supporting_text: In vitro binding assay demonstrated the direct interaction of ALDH4A1 with
        both MPC1 and MPC2
      reference_section_type: RESULTS
core_functions:
- description: >-
    Homodimeric mitochondrial ALDH4A1 catalyzes NAD+-dependent oxidation of L-glutamate gamma-semialdehyde
    to L-glutamate, completing proline catabolism. Its substrate scope also supports oxidation of the
    corresponding hydroxylated semialdehyde in trans-4-hydroxy-L-proline degradation. NAD+ binding and
    the domain-swapped dimer are integral properties of this catalytic unit; ligand-bound structural details
    were resolved with the highly similar mouse enzyme, whereas human catalytic activity and S352L inactivation
    were directly measured.
  molecular_function:
    id: GO:0003842
    label: L-glutamate gamma-semialdehyde dehydrogenase activity
