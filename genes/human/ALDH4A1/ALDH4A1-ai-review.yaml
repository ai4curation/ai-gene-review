knowledge_gaps:
- gap_statement: 'It is not established whether ALDH4A1 is a genuine constituent of the mitochondrial
    pyruvate carrier. One study reports a catalysis-independent requirement for ALDH4A1 in mitochondrial
    pyruvate import and a trimeric ALDH4A1-MPC1-MPC2 complex, while three structures of the human
    carrier resolve only an MPC1-MPC2 heterodimer. Neither body of work directly tests the other:
    the structures were built from co-expressed MPC1 and MPC2 alone, and the functional study did
    not determine a structure of the proposed trimer or measure its stoichiometry.'
  boundary: 'Firmly established: ALDH4A1 is a soluble, homodimeric NAD+-dependent 1-pyrroline-5-carboxylate
    dehydrogenase of the mitochondrial matrix, and MPC1 plus MPC2 form an inner-membrane heterodimer
    that carries out alternating-access pyruvate transport and is sufficient for transport in proteoliposomes.
    What is unresolved is whether ALDH4A1 stably associates with that heterodimer in vivo and whether
    its reported effect on pyruvate flux is a direct structural contribution or an indirect metabolic
    consequence of losing P5C dehydrogenase from the matrix.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The claim would make ALDH4A1 a moonlighting structural component of a central metabolic
    transporter and would explain its reported tumour-suppressive activity independently of proline
    catabolism. If it does not hold, the pyruvate phenotypes are better read as downstream effects
    of disrupted proline/glutamate metabolism.
  resolution: A structure or crosslinking/mass-photometry analysis of the native complex isolated
    from mitochondria showing defined ALDH4A1:MPC1:MPC2 stoichiometry, plus independent replication
    of the proteoliposome stimulation, would settle it. Conversely, showing that ALDH4A1 does not
    co-migrate with MPC in native mitochondrial membranes would close it negatively.
  provenance:
  - reference_id: PMID:40355545
    supporting_text: Here we show that ALDH4A1, a proline-metabolizing enzyme localized in mitochondria,
      serves as a previously unrecognized MPC component maintaining pyruvate mitochondrial import
      and the TCA cycle independently of its enzymatic activity.
  - reference_id: PMID:40044865
    supporting_text: Our structures show that MPC1 and MPC2 form a heterodimer with the substrate
      translocation pathway at the center of the dimer interface, defining the basic functional unit
      and architecture of this important transporter family.
suggested_questions:
- question: Is ALDH4A1 a stoichiometric subunit of the mitochondrial pyruvate carrier, or an accessory
    matrix-side factor that stabilises MPC1-MPC2? The three 2025 cryo-EM structures of human MPC
    resolve only MPC1 and MPC2, but each was determined from heterologously co-expressed MPC1 and
    MPC2, so they cannot exclude a partner that was never in the sample. Should GO record an ALDH4A1-MPC
    association at all before the complex has been isolated from mitochondria with a defined stoichiometry?
  experts:
  - Lin HK
  - Feng L
  - Rutter J
- question: In the reconstitution that supports the claim, MPC1 plus MPC2 alone already transport
    pyruvate and ALDH4A1 increases that activity. Is ALDH4A1 therefore better described as a transport
    enhancer or chaperone of MPC1-MPC2 oligomerisation than as a component of the carrier, and is
    the enhancement specific to ALDH4A1 or a generic effect of adding a matrix-facing protein?
  experts:
  - Lin HK
- question: ALDH4A1 is an obligate homodimer (~122 kDa) whose activity requires the domain-swapped
    dimer, yet the reported MPC complex is described as a ~88-100 kDa trimer of one ALDH4A1, one
    MPC1 and one MPC2. How is the ALDH4A1 oligomeric state reconciled between its catalytic and its
    proposed structural role?
  experts: []
- question: Do people with type II hyperprolinemia, who carry loss-of-function ALDH4A1 alleles including
    S352L, show any evidence of impaired mitochondrial pyruvate import or a lactate/pyruvate phenotype?
    The disease is described in terms of proline and P5C accumulation, which is what would be expected
    if the pyruvate role is not rate-limiting in vivo.
  experts: []
suggested_experiments:
- hypothesis: ALDH4A1 is a bona fide component of the mitochondrial pyruvate carrier and can be isolated
    with MPC1 and MPC2 from native mitochondrial membranes.
  description: Isolate mitochondria from a cell line expressing endogenously tagged MPC1, solubilise
    in a mild detergent or styrene-maleic acid copolymer that preserves peripheral associations,
    and analyse the affinity-purified material by quantitative mass spectrometry, blue-native PAGE
    and mass photometry to determine whether ALDH4A1 co-purifies and with what stoichiometry. Run
    the same preparation from an ALDH4A1 knockout as the specificity control. A defined ALDH4A1:MPC1:MPC2
    ratio would support subunit status; substoichiometric, detergent-sensitive recovery would support
    an accessory interaction.
  experiment_type: native complex isolation and quantitative proteomics
- hypothesis: The reported stimulation of reconstituted pyruvate transport by ALDH4A1 is specific
    to ALDH4A1 rather than a generic effect of a soluble matrix protein on proteoliposomes.
  description: Repeat the 14C-pyruvate proteoliposome assay with MPC1-MPC2 alone, with wild-type
    ALDH4A1, with the catalytically dead S352L variant, with an unrelated matrix dehydrogenase of
    similar size and charge as a negative control, and with an ALDH4A1 variant carrying substitutions
    at the proposed MPC-contacting surface. Independent replication in a second laboratory, with
    the transport rate normalised to the amount of MPC1-MPC2 actually incorporated into the liposomes,
    is the key control.
  experiment_type: reconstituted transport assay
- hypothesis: The pyruvate-import defect seen on ALDH4A1 loss is a direct structural effect on MPC
    rather than an indirect metabolic consequence of losing P5C dehydrogenase activity.
  description: Compare ALDH4A1 knockout cells reconstituted with wild-type ALDH4A1, with S352L, and
    with an MPC-binding-deficient but catalytically active variant, measuring 13C-pyruvate flux into
    TCA intermediates alongside intracellular P5C, proline and glutamate pools. If the import defect
    tracks with MPC binding and not with P5C accumulation, the direct model is supported; if it tracks
    with P5C accumulation, the effect is metabolic.
  experiment_type: isotope tracing with structure-function separation of alleles
