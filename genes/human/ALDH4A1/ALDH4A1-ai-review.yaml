- id: PMID:40044865
  title: Structure of mitochondrial pyruvate carrier and its inhibition mechanism.
  findings:
  - statement: Cryo-EM structures of human MPC in detergent and nanodiscs show a single MPC1-MPC2
      heterodimer whose dimer interface contains the substrate translocation pathway; no third subunit
      is present. The protein was made by co-expressing only MPC1 and MPC2 in HEK293 cells, so ALDH4A1
      could not have been retained in the sample.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Nature 2025, PMC12043432). Bears on ALDH4A1 only indirectly:
      it defines the MPC transport unit as an MPC1-MPC2 heterodimer and restates that the two subunits
      are sufficient for MPC activity. Because the sample was reconstituted from co-expressed MPC1
      and MPC2 alone, the absence of ALDH4A1 from the map is a property of the preparation, not an
      observation about the native complex.'
