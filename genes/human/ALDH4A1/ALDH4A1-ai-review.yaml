- id: PMID:40355545
  title: ALDH4A1 functions as an active component of the MPC complex maintaining mitochondrial
    pyruvate import for TCA cycle entry and tumour suppression.
  findings:
  - statement: >-
      Human-cell co-immunoprecipitation, recombinant complex assays, mitochondrial gel filtration and
      BN-PAGE support association of ALDH4A1 with MPC1-MPC2; added ALDH4A1 enhances reconstituted pyruvate
      transport. The reported trimer model does not by itself establish a universal native 1:1:1 stoichiometry.
    reference_section_type: RESULTS
  - statement: 'The effect is catalytically independent: the type II hyperprolinemia substitution S352L,
      which abolishes P5C dehydrogenase activity, stimulates reconstituted pyruvate transport as well
      as wild-type ALDH4A1, and tumour suppression is likewise enzyme-activity independent.'
    reference_section_type: RESULTS
  - statement: MPC1 and MPC2 together already transport pyruvate in the same proteoliposome assay
      without ALDH4A1; ALDH4A1 enhances that activity rather than being required for it.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full PMC12188464 and Nature primary record (DOI 10.1038/s41556-025-01651-8) inspected. Figures
      5-7 and Extended Data 8 provide human-cell association/rescue, recombinant complex formation, and
      increased MPC1-MPC2 proteoliposome transport upon WT/S352L addition. These establish a bounded noncatalytic
      contribution beyond loss phenotypes. Reconstitution Methods specify PC/cardiolipin and lipid:protein
      ratio but do not clearly establish identical incorporated MPC amount/orientation for every comparison;
      apparent unit/residue typos are not silently repaired. Native occupancy/stoichiometry and the detailed
      enhancement mechanism remain open. Separate two-subunit structures and lack of a second report are
      not a documented scientific dispute, so the supported source is VERIFIED rather than DISPUTED.
  full_text_unavailable: false
