id: P30038
gene_symbol: ALDH4A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALDH4A1 is the mitochondrial matrix NAD+-dependent delta-1-pyrroline-5-carboxylate dehydrogenase (P5CDH;
  EC 1.2.1.88). It oxidizes L-glutamate gamma-semialdehyde, the open-chain form in equilibrium with pyrroline-5-carboxylate,
  to L-glutamate, producing NADH. This is the second and final catalytic step of proline degradation;
  the same semialdehyde can also arise from ornithine. ALDH4A1 also acts in trans-4-hydroxy-L-proline
  catabolism by oxidizing the corresponding hydroxylated semialdehyde. Human P5CDH forms a domain-swapped
  homodimer, with NAD+-binding and catalytic domains and the catalytic cysteine Cys348. Biallelic loss-of-function
  variants cause type II hyperprolinemia, with proline and pyrroline-5-carboxylate accumulation. A separate
  noncatalytic activity has been demonstrated in human-cell and purified-protein experiments: ALDH4A1
  associates with MPC1-MPC2 and increases reconstituted mitochondrial pyruvate-carrier transport, including
  with the catalytically inactive S352L variant. MPC1-MPC2 themselves form the translocation pathway and
  transport without added ALDH4A1; ALDH4A1 is therefore supported as an accessory transport-enhancing
  factor, while its native occupancy, stoichiometry and contribution across tissues remain unresolved.
