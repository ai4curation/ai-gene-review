      cleave peptides under some conditions [PMID:22937112 "This allows the interpretation that archaemetzincins
      could be capable of catalyzing peptide bond hydrolysis under certain conditions"]. The IEA is accepted
      as a family-level prediction, not as demonstrated activity.'
