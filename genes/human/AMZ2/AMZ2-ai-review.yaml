id: Q86W34
gene_symbol: AMZ2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMZ2 (archaemetzincin-2) is a member of the archaemetzincin family (peptidase M54) within
  the metzincin superfamily. Family members occur in archaea and vertebrates. AMZ2 keeps the complete
  catalytic zinc-binding motif (HEXXHXXGXXH), the metzincin methionine and the four cysteines that form
  a structural zinc site, so it is predicted to be a zinc metalloprotease. A 2005 report of its peptidase
  activity was later withdrawn, and no substrate is known. It is expressed in testis and sperm. A homozygous
  variant that abolishes AMZ2 protein in sperm was found in a man with vacuolated sperm heads, making
  it a candidate male-infertility gene.
