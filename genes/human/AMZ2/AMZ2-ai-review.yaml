- id: PMID:22937112
  title: Crystal structures of archaemetzincin reveal a moldable substrate-binding site.
  findings:
  - statement: Human AMZ activity needs confirmation.
    supporting_text: Aminopeptidase activity has been published for human AMZ1 and 2 [14], although this
      has to be confirmed
  - statement: The M. kandleri family member shows no activity in standard assays.
    supporting_text: Despite the presence of all known elements necessary for an active proteolytic enzyme,
      no activity against typical in vitro exo- and endopeptidase substrates has been detected so far
      for the M. kandleri enzyme
  - statement: Archaemetzincins may cleave peptides under some conditions.
    supporting_text: This allows the interpretation that archaemetzincins could be capable of catalyzing
      peptide bond hydrolysis under certain conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Archaeal archaemetzincin structures; includes AMZ2 in its alignment and comments
      on the human enzymes.
- id: PMID:37459044
  title: The identification of AMZ2 as a candidate causative gene in a severe teratozoospermia patient
    characterized by vacuolated spermatozoa.
  findings:
  - statement: A homozygous AMZ2 variant abolishes AMZ2 protein in sperm.
    supporting_text: Immunoblot analysis revealed that the homozygous missense variant in AMZ2 abolished
      AMZ2 expression in the spermatozoa
  - statement: AMZ2 is a candidate gene for vacuolated spermatozoa.
    supporting_text: Our findings reveal a candidate causative gene for vacuolated spermatozoa
  - statement: AMZ2 function is unknown.
    supporting_text: AMZ2 encodes a zinc metalloprotease of unknown function
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. A single consanguineous patient; candidate-gene evidence only, so no process
      annotation is proposed from it.
