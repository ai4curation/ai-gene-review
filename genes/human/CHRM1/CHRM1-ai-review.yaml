  review:
    summary: M1 signaling can modulate neuromuscular transmitter release.
    action: KEEP_AS_NON_CORE
    reason: The rodent ortholog transfer concerns modulation of quantal acetylcholine release, not replacement
      of the nicotinic endplate channel. Mouse neuromuscular experiments implicate M1 pharmacologically
      when acetylcholinesterase is absent or inhibited. This supports a contextual contribution to transmission;
