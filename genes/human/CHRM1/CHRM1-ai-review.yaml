  - UniProtKB:P08172
  review:
    summary: Cyclase-inhibiting M1 signaling is a supported contextual capacity.
    action: KEEP_AS_NON_CORE
    reason: 'The older REMOVE rationale incorrectly treated predominant Gq coupling as exclusion of Gi
      signaling. Cloned rat M1 directly inhibits adenylyl cyclase in a pertussis-toxin-sensitive manner;
      human M1 directly activates Gi1/2 in CHO cells. Together these support the conserved, context-dependent
      inhibition capacity. Human M1 can also increase cAMP, so the sign is not universal. Original ancestral
      source: PANTHER:PTN001207082.'
    supported_by:
    - reference_id: PMID:2846274
      supporting_text: Pertussis toxin blocked the inhibition of adenylate cyclase
