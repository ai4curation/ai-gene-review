  review:
    summary: M1 can engage cyclic-nucleotide signaling in addition to its principal PLC pathway.
    action: KEEP_AS_NON_CORE
    reason: 'Human M1 expression experiments demonstrate Gs/cAMP responses and Gi coupling; rat-cell M1
      studies also demonstrate inhibition of cyclase. The broad cyclic-nucleotide pathway is appropriate
      for this context-dependent repertoire, not a claim that all M1 signaling lowers cAMP. Original ancestral
      source: PANTHER:PTN000664111.'
    supported_by:
    - reference_id: PMID:18664591
    - reference_id: PMID:8139539
    - reference_id: PMID:2846274
