core_functions:
- description: Binds acetylcholine and activates heterotrimeric G proteins, preferentially engaging Gq/11-linked
    phospholipase C signaling. Coupling depends on ligand, receptor abundance and cellular effector context;
    the receptor does not itself catalyse the downstream enzymatic reaction.
  molecular_function:
    id: GO:0016907
    label: G protein-coupled acetylcholine receptor activity
  supported_by:
  - reference_id: PMID:3443095
  - reference_id: file:human/CHRM1/CHRM1-uniprot.txt
  - reference_id: PMID:31073061
  - reference_id: PMID:26958838
  - reference_id: PMID:38671143
  - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1572629/
    supporting_text: activation of M1 and M3 mACh receptors resulted in enhanced [35S]-GTPγS binding not
      only to Gq/11α, but also to Gi1/2α and Gi3/oα proteins
  directly_involved_in:
  - id: GO:0007207
    label: phospholipase C-activating G protein-coupled acetylcholine receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
suggested_questions:
- question: Should the IBA-propagated 'adenylate cyclase-inhibiting G protein-coupled acetylcholine receptor
    signaling pathway' (GO:0007197) be blocked from the Gq-coupled M1/M3/M5 branch of the muscarinic PANTHER
    node, given that Gi coupling is specific to M2/M4?
- question: Which ARBA rule (ARBA00028561) assigns phospholipase C activity (GO:0004435) to Gq-coupled
    receptors, and can it be retired to stop receptor proteins inheriting the downstream effector enzyme's
    catalytic activity?
- question: In human cortex, how much of the M1-dependent increase in sAPPalpha secretion seen in transfected
    cells occurs at physiological receptor levels, and is it mediated by PKC-dependent alpha-secretase
    (ADAM10/ADAM17) activation?
suggested_experiments:
- description: Conditional (forebrain pyramidal neuron) Chrm1 deletion in an amyloid mouse model with
    measurement of sAPPalpha, Abeta and M-current, to test whether loss of M1-Gq signaling in adult neurons
    shifts APP processing in vivo.
  experiment_type: conditional knockout with electrophysiology and biochemistry
- description: BRET-based G protein activation profiling (Gq, G11, Gs, Gi1-3, Go, G12/13) of human M1
    at endogenous-like expression levels to quantify any non-Gq coupling relevant to the IBA cyclic-nucleotide
    annotations.
  experiment_type: G protein coupling assay
