  review:
    summary: M1 activates a PLC pathway but is not the PIP2-hydrolyzing enzyme.
    action: REMOVE
    reason: The live GO definition requires catalysis of phosphatidylinositol-4,5-bisphosphate hydrolysis.
      The muscarinic product is a seven-transmembrane receptor; receptor-driven G-protein activation stimulates
      a separate PLC enzyme. The original pharmacological readout measures downstream phosphoinositide
      hydrolysis, not catalytic conversion by the receptor. The receptor activity and PLC-coupled process
      are retained.
