    action: REMOVE
    reason: Generic protein binding conveys no functional information. The cached abstract is about M3R;
      UniProt nevertheless lists TMEM147 as a CHRM1 interactor from this study, so the interaction itself
      is not disputed. TMEM147 retains receptors in the ER and negatively regulates surface expression;
      this is a regulatory property of TMEM147, not an informative molecular function of CHRM1, and no
