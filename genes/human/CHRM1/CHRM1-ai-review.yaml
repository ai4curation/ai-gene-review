id: P11229
gene_symbol: CHRM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CHRM1 encodes the M1 muscarinic acetylcholine receptor, a seven-transmembrane receptor that
  predominantly activates Gq/11-dependent phospholipase C signaling. In neurons it modulates phosphoinositide-dependent
  ion channels, excitability and synaptic plasticity, with prominent somatodendritic and postsynaptic
  functions. Its signaling contributes to cognition and can regulate proliferation in particular cellular
  contexts. Receptor coupling is ligand- and cell-dependent: Gi and Gs coupling and cyclic-AMP responses
  have also been demonstrated, so Gq preference is not an absolute exclusion of other pathways.'
