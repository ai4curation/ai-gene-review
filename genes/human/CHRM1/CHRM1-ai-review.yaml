id: P11229
gene_symbol: CHRM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRM1 encodes the M1 muscarinic acetylcholine receptor, a class A (rhodopsin-like) seven-transmembrane
  G protein-coupled receptor. It is the most abundant muscarinic receptor in the cerebral cortex and hippocampus,
  where it is located on the plasma membrane of the somatodendritic compartment of pyramidal neurons,
  and it is also expressed in sympathetic ganglia and exocrine glands. Binding of acetylcholine to the
  orthosteric site activates the receptor, which couples preferentially to heterotrimeric Gq/11 proteins;
  Gq/11 alpha subunits then stimulate phospholipase C-beta, generating inositol trisphosphate and diacylglycerol,
  releasing intracellular calcium and activating protein kinase C. Downstream consequences include suppression
  of the M-type potassium current and resulting neuronal depolarization, slow excitatory postsynaptic
  potentials, induction of immediate-early transcription factors, and stimulation of non-amyloidogenic
  secretion of amyloid precursor protein derivatives. M1 signaling supports hippocampal long-term potentiation
  and cortex-hippocampus-dependent memory, and is required for seizure induction by muscarinic agonists
  in mice. The receptor undergoes agonist-induced internalization and down-regulation together with Gq/G11.
