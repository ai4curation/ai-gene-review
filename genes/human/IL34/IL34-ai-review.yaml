- term:
    id: GO:0030224
    label: monocyte differentiation
  evidence_type: NAS
  original_reference_id: PMID:30066957
  qualifier: involved_in
  review:
    summary: >-
      Author statement from review article PMID:30066957 describing IL34's role
      in promoting monocyte differentiation. Replace with the regulatory term
      GO:0045657 (positive regulation of monocyte differentiation).
    action: MODIFY
    reason: >-
      As an extrinsic secreted cytokine, IL34 does not execute intrinsic
      cell-autonomous monocyte differentiation steps; rather, it positively
      regulates monocyte differentiation via CSF1R signaling. Replacing
      GO:0030224 with GO:0045657 (positive regulation of monocyte
      differentiation, already asserted on IL34 with IDA evidence from
      PMID:23409120) accurately reflects its regulatory role.
    proposed_replacement_terms:
      - id: GO:0045657
        label: positive regulation of monocyte differentiation
    supported_by:
      - reference_id: PMID:30066957
        supporting_text: >-
          IL-34 is synthesized as a secreted homodimeric glycoprotein that binds
          to the extracellular domains of CSF-1R and receptor-type
          protein-tyrosine phosphatase-zeta (PTP-ζ) in addition to the
          chondroitin sulfate chains of syndecan-1. These interactions result in
          activating several signaling pathways that regulate major cellular
          functions, including proliferation, differentiation, survival,
          metabolism, and cytokine/chemokine expression in addition to cellular
          adhesion and migration.
