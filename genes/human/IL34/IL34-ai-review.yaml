  review:
    summary: >-
      Phylogenetic propagation from PANTHER node PTN002823014 (seeded by human
      IL34, Q6ZMJ4) captures CSF1R binding but omits IL34's agonist activity as
      a signaling cytokine. Replace with GO:0005125 (cytokine activity).
    action: MODIFY
    reason: >-
      IL34 is not an inert CSF1R binder; it is a secreted four-helix-bundle
      cytokine agonist that engages CSF1R to trigger receptor dimerization and
      intracellular signaling (PMID:18467591, PMID:22483114). In the GO molecular
      function hierarchy, GO:0005157 (macrophage colony-stimulating factor
      receptor binding) sits under GO:0005102 (signaling receptor binding) rather
      than GO:0048018 (receptor ligand activity), so annotating only GO:0005157
      misses the ligand's signaling agonist activity. Upgrading to GO:0005125
      (cytokine activity, an is_a child of GO:0048018 receptor ligand activity)
      accurately captures IL34's core molecular function.
    proposed_replacement_terms:
      - id: GO:0005125
        label: cytokine activity
