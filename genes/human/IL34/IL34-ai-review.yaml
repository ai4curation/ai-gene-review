proposed_new_terms:
- proposed_name: positive regulation of microglial cell proliferation
  proposed_definition: >-
    Any process that activates or increases the frequency, rate or extent of
    microglial cell proliferation.
  justification: >-
    Extrinsic secreted cytokines such as neuron-derived IL34 (and CSF1) act via
    CSF1R to stimulate microglial cell proliferation rather than executing the
    cell-autonomous microglial division process directly. GO currently provides
    microglial cell proliferation (GO:0061518), positive regulation of
    macrophage proliferation (GO:0120041), and positive regulation of glial cell
    proliferation (GO:0060252, along with lineage-specific terms such as
    positive regulation of astrocyte proliferation, GO:0048711), but lacks a
    specific positive regulation term for microglial cell proliferation (which
    should be placed under both GO:0120041 and GO:0060252).
  proposed_parent:
    id: GO:0120041
    label: positive regulation of macrophage proliferation
  supported_by:
    - reference_id: PMID:30066957
      supporting_text: >-
        These interactions result in activating several signaling pathways
        that regulate major cellular functions, including proliferation,
        differentiation, survival, metabolism, and cytokine/chemokine
        expression in addition to cellular adhesion and migration. In the
        steady state, IL-34 contributes to the development and maintenance of
        specific myeloid cell subsets in a tissue-specific manner: Langerhans
        cells in the skin and microglia in the brain.
suggested_questions:
- question: >-
    How do co-receptors syndecan-1 (SDC1) and receptor-type protein-tyrosine
    phosphatase zeta (PTPRZ1) quantitatively partition IL34 signaling between
    CSF1R-dependent myeloid/microglial trophic responses and CSF1R-independent
    signaling in neural and tumor tissues?
suggested_experiments:
- description: >-
    Single-molecule TIRF imaging and quantitative phosphoproteomics of primary
    human monocytes and induced pluripotent stem cell-derived microglia
    stimulated with equimolar homodimeric IL34, homodimeric CSF1, or
    heterodimeric IL34:CSF1 in the presence and absence of SDC1 heparan sulfate
    chains to compare CSF1R dimer lifetime, internalization kinetics, and
    STAT3/ERK1/2/FAK phosphorylation dynamics.
  hypothesis: >-
    SDC1 binding concentrates IL34 at the plasma membrane and prolongs CSF1R
    surface residency compared with CSF1, producing distinct temporal profiles
    of ERK1/2 and FAK activation.
