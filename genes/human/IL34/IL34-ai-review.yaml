      that IL34 stimulation of CSF1R leads to ERK1/2 phosphorylation in human
      monocytes. Note that the qualifier is acts_upstream_of_or_within, which
      appropriately captures an extracellular ligand initiating an intracellular
      kinase cascade.
    supported_by:
      - reference_id: PMID:26754294
        supporting_text: >-
          Through gene expression profiles and bioinformatics analysis, we
          identified interleukin-34 (IL-34) as a direct target of miR-28-5p, and
          the effects of miR-28-5p deficiency on HCC growth and metastasis was
          dependent on IL-34-mediated tumor-associated macrophage (TAM)
          infiltration.
      - reference_id: Reactome:R-HSA-6787820
        supporting_text: >-
          Like CSF1, IL34 stimulation of CSF1R leads to phosphorylation of
          extracellular signal-regulated kinase (ERK) 1 and 2 in human monocytes
          (Lin et al. 2008).
