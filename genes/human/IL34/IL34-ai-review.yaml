    label: positive regulation of protein phosphorylation
  evidence_type: IDA
  original_reference_id: PMID:18467591
  qualifier: involved_in
  review:
    summary: >-
      Recombinant human IL34 stimulates tyrosine phosphorylation of CSF1R and
      phosphorylation of ERK1/2 (MAPK1/MAPK3) in primary human monocytes.
    action: KEEP_AS_NON_CORE
    reason: >-
      Directly supported by biochemical assays in PMID:18467591 showing rapid
      CSF1R and ERK1/2 phosphorylation in human monocytes upon IL34 stimulation.
      Retained as non-core because intracellular protein phosphorylation is a
      downstream consequence of CSF1R activation rather than a direct catalytic
      activity of the secreted cytokine.
    supported_by:
      - reference_id: PMID:18467591
        supporting_text: >-
          One of the highly selective proteins was a previously undescribed ligand,
          designated interleukin-34 (IL-34), which stimulates monocyte viability but does
          not affect responses in a wide spectrum of other assays. In a separate
          functional screen, we used a collection of extracellular domains of
          transmembrane proteins to discover the receptor for IL-34, which was a known
          cytokine receptor, colony-stimulating factor 1 (also called macrophage
          colony-stimulating factor) receptor.
