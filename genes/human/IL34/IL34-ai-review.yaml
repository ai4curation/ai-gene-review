id: Q6ZMJ4
gene_symbol: IL34
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Interleukin-34 (IL34) is a secreted homodimeric four-helix-bundle cytokine that
  functions as a tissue-restricted agonist of the macrophage colony-stimulating
  factor 1 receptor (CSF1R). Produced predominantly by epidermal keratinocytes
  and central nervous system neurons, IL34 binds the extracellular immunoglobulin-like
  D2-D3 junction of CSF1R to induce receptor dimerization, tyrosine autophosphorylation,
  and activation of downstream MAPK/ERK, PI3K-AKT, and STAT3 signaling cascades.
  Through CSF1R signaling, IL34 promotes the survival, proliferation, chemotaxis,
  and differentiation of monocytes, tissue macrophages, epidermal Langerhans cells,
  and brain microglia, and also interacts with syndecan-1 (SDC1) and receptor-type
  tyrosine-protein phosphatase zeta (PTPRZ1) at the cell surface.
