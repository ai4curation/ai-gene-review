- term:
    id: GO:0061518
    label: microglial cell proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8R1R4
  - ensembl:ENSMUSP00000076120
  review:
    summary: >-
      Orthology transfer from mouse Il34 (Q8R1R4) reflecting the essential role
      of neuron-derived IL34 in promoting microglial proliferation in the
      central nervous system via CSF1R.
    action: KEEP_AS_NON_CORE
    reason: >-
      Supporting microglial homeostasis and proliferation via CSF1R in the brain
      is a key non-redundant physiological function of IL34 in mammals
      (PMID:30066957). However, as an extrinsic secreted cytokine, IL34
      positively regulates microglial cell proliferation via CSF1R rather than
      executing the cell-autonomous division process itself (compare GO:0030224
      monocyte differentiation, which is modified to GO:0045657 positive
      regulation of monocyte differentiation). Because GO currently lacks a
      specific positive regulation of microglial cell proliferation term and
      replacing GO:0061518 with GO:0120041 (positive regulation of macrophage
      proliferation) would lose microglial cell-type specificity, GO:0061518 is
      retained as non-core and a new term (positive regulation of microglial
      cell proliferation) is proposed in proposed_new_terms.
    supported_by:
      - reference_id: PMID:30066957
        supporting_text: >-
          In the steady state, IL-34 contributes to the development and
          maintenance of specific myeloid cell subsets in a tissue-specific
          manner: Langerhans cells in the skin and microglia in the brain.
