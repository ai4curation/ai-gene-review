core_functions:
- description: >-
    Secreted homodimeric cytokine agonist that binds and dimerizes the
    macrophage colony-stimulating factor 1 receptor (CSF1R) to initiate
    interleukin-34-mediated / CSF1R signaling and downstream MAPK/ERK
    activation, promoting monocyte and macrophage differentiation and the
    proliferation of macrophages and microglia.
  molecular_function:
    id: GO:0005125
    label: cytokine activity
  directly_involved_in:
    - id: GO:0061514
      label: interleukin-34-mediated signaling pathway
    - id: GO:0038145
      label: macrophage colony-stimulating factor signaling pathway
    - id: GO:0045651
      label: positive regulation of macrophage differentiation
    - id: GO:0045657
      label: positive regulation of monocyte differentiation
    - id: GO:0120041
      label: positive regulation of macrophage proliferation
    - id: GO:0061518
      label: microglial cell proliferation
    - id: GO:0043410
      label: positive regulation of MAPK cascade
  locations:
    - id: GO:0005576
      label: extracellular region
  supported_by:
    - reference_id: PMID:18467591
      supporting_text: >-
        One of the highly selective proteins was a previously undescribed ligand,
        designated interleukin-34 (IL-34), which stimulates monocyte viability but does
        not affect responses in a wide spectrum of other assays. In a separate
        functional screen, we used a collection of extracellular domains of
        transmembrane proteins to discover the receptor for IL-34, which was a known
        cytokine receptor, colony-stimulating factor 1 (also called macrophage
        colony-stimulating factor) receptor.
    - reference_id: PMID:23409120
      supporting_text: >-
        We report here that IL-34 induces the differentiation of monocytes into
        CD14(high) CD163(high) CD1a(-) Mφ (IL-34-Mφ). Upon LPS stimulation,
        IL-34-Mφ exhibit an IL-10(high) IL-12(low) M2 profile and express low
        levels of the costimulatory molecules CD80 and CD86.
    - reference_id: PMID:26754294
      supporting_text: >-
        Through gene expression profiles and bioinformatics analysis, we
        identified interleukin-34 (IL-34) as a direct target of miR-28-5p, and
        the effects of miR-28-5p deficiency on HCC growth and metastasis was
        dependent on IL-34-mediated tumor-associated macrophage (TAM)
        infiltration.
suggested_questions:
- question: >-
    How do co-receptors syndecan-1 (SDC1) and receptor-type protein-tyrosine
    phosphatase zeta (PTPRZ1) quantitatively partition IL34 signaling between
    CSF1R-dependent myeloid/microglial trophic responses and CSF1R-independent
    signaling in neural and tumor tissues?
suggested_experiments:
- description: >-
    Single-molecule TIRF imaging and quantitative phosphoproteomics of primary
    human monocytes and induced pluripotent stem cell-derived microglia
    stimulated with equimolar homodimeric IL34, homodimeric CSF1, or
    heterodimeric IL34:CSF1 in the presence and absence of SDC1 heparan sulfate
    chains to compare CSF1R dimer lifetime, internalization kinetics, and
    STAT3/ERK1/2/FAK phosphorylation dynamics.
  hypothesis: >-
    SDC1 binding concentrates IL34 at the plasma membrane and prolongs CSF1R
    surface residency compared with CSF1, producing distinct temporal profiles
    of ERK1/2 and FAK activation.
