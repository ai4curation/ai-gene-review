- term:
    id: GO:0038145
    label: macrophage colony-stimulating factor signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:30066957
  qualifier: involved_in
  review:
    summary: >-
      Author statement from review article PMID:30066957 conflating CSF1R
      activation by IL34 with the CSF1/M-CSF-initiated signaling pathway term
      GO:0038145. Replace with the ligand-specific sibling term GO:0061514
      (interleukin-34-mediated signaling pathway).
    action: MODIFY
    reason: >-
      In GO, GO:0038145 (macrophage colony-stimulating factor signaling pathway,
      defined as the series of molecular signals initiated by macrophage
      colony-stimulating factor / M-CSF binding to its receptor) and GO:0061514
      (interleukin-34-mediated signaling pathway, defined as the series of
      molecular signals initiated by interleukin-34 binding to its receptor) are
      sibling terms under GO:0019221 (cytokine-mediated signaling pathway), not
      parent and child. Although IL34 and CSF1 share the receptor CSF1R, IL34 is
      a distinct cytokine (and also engages PTPRZ1 and SDC1), so the
      ligand-specific pathway term GO:0061514 (already annotated to IL34) is the
      more precise pathway term.
    proposed_replacement_terms:
      - id: GO:0061514
        label: interleukin-34-mediated signaling pathway
    supported_by:
      - reference_id: PMID:30066957
        supporting_text: >-
          IL-34 is a novel cytokine that was identified in 2008 in a
          comprehensive proteomic analysis as a tissue-specific ligand of CSF-1
          receptor (CSF-1R).
      - reference_id: PMID:22483114
        supporting_text: >-
          Here, the crystal structure of dimeric IL-34 reveals a helical cytokine
          fold homologous to CSF-1, and we further show that the complex
          architecture of IL-34 bound to the N-terminal immunoglobulin domains of
          CSF-1R is similar to the CSF-1/CSF-1R assembly.
