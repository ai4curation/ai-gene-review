id: Q9UKG1
gene_symbol: APPL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: APPL1 (adaptor protein, phosphotyrosine interacting with PH domain and leucine zipper 1)
  is a cytosolic multidomain adaptor and RAB5 effector. It has an N-terminal BAR-PH module that dimerizes
  and binds Rab5 and phosphoinositides, a C-terminal PTB domain, and a C-terminal PDZ-binding motif. APPL1
  is a peripheral membrane protein on the cytoplasmic face of a distinct subpopulation of early endosomes
  ("APPL endosomes") near the plasma membrane. On these endosomes it scaffolds signaling between internalized
  receptors and downstream effectors. It binds AKT2 and PI3K, adiponectin receptors (ADIPOR1/2), TGFBR1,
  GIPC1, OCRL and DCC, and it promotes insulin- and adiponectin-stimulated AKT activation, GLUT4 translocation
  and glucose uptake. When stimulated (e.g. by EGF or oxidative stress) it can move to the nucleus, where
  it interacts with the NuRD complex and the beta-catenin/Reptin machinery. Loss-of-function mutations
  cause a form of familial diabetes (MODY14).
