- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IMP
  original_reference_id: PMID:26073777
  qualifier: enables
  review:
    summary: APPL1 is a non-catalytic adaptor that links receptors (insulin, adiponectin) to AKT2 activation.
    action: NEW
    reason: APPL1 has no catalytic domain. It brings signaling proteins together (AKT2, PI3K, ADIPOR1,
      Rab5) to enhance downstream signaling, and loss-of-function variants impair insulin-induced AKT2
      activation. Signaling adaptor activity describes this function better than the many generic protein-binding
      rows.
    supported_by:
    - reference_id: PMID:26073777
      supporting_text: APPL1 binds to AKT2, a key molecule in the insulin signaling pathway, thereby enhancing
        insulin-induced AKT2 activation and downstream signaling
    - reference_id: PMID:10490823
      supporting_text: These data suggest that APPL is an adaptor that may tether inactive AKT2 to p110alpha
        in the cytoplasm
