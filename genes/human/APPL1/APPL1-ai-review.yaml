core_functions:
- description: Rab5-effector signaling adaptor on the cytosolic face of APPL-positive early endosomes.
    It binds AKT2, PI3K and adiponectin receptors to promote insulin- and adiponectin-stimulated AKT signaling
    and glucose uptake.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  locations:
  - id: GO:0031901
    label: early endosome membrane
  directly_involved_in:
  - id: GO:0008286
    label: insulin receptor signaling pathway
  - id: GO:0033211
    label: adiponectin-activated signaling pathway
  supported_by:
  - reference_id: PMID:26073777
    supporting_text: APPL1 binds to AKT2, a key molecule in the insulin signaling pathway, thereby enhancing
      insulin-induced AKT2 activation and downstream signaling
  - reference_id: PMID:19661063
    supporting_text: APPL1 is a newly identified adiponectin receptor-binding protein that positively
      mediates adiponectin signaling in cells.
  - reference_id: PMID:21645192
    supporting_text: APPL endosomes are a recently identified subpopulation of early endosomes
- description: Binds active Rab5 via its BAR-PH dimer, which recruits it to endosomes.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  locations:
  - id: GO:0031901
    label: early endosome membrane
  supported_by:
  - reference_id: PMID:17581628
    supporting_text: APPL1 is an effector of the small GTPase Rab5.
suggested_questions:
- question: What distinguishes APPL endosomes from EEA1-positive early endosomes in cargo composition
    and signaling output?
- question: How do the familial-diabetes APPL1 variants affect beta-cell insulin secretion as opposed
    to peripheral insulin sensitivity?
suggested_experiments:
- description: Proximity labeling (APEX2-APPL1) of APPL endosomes in insulin-stimulated human adipocytes
    and beta cells, comparing wild-type and D94N APPL1.
