proposed_new_terms: []
suggested_questions:
- question: Which human CHK1 substrates identified by analog-sensitive phosphoproteomics (e.g. KAP1/TRIM28
    Ser473, FEN1, RIF1, Treslin/TICRR) are direct in vivo targets with defined checkpoint consequences,
    versus in vitro candidates?
- question: Is WEE1 a direct human CHK1 substrate, or is CHK1 regulation of WEE1 principally indirect
    through the FAM122A-PP2A-B55alpha axis?
- question: How is CHK1 signaling terminated during checkpoint recovery, and how do SCF(FBXO6) degradation,
    hHR23A-mediated basal turnover, and PPM1D/PP1/PP2A dephosphorylation quantitatively partition this
    control?
suggested_experiments:
- description: Analog-sensitive CHK1 (gatekeeper mutant) with a bulky ATP analog plus rapid inhibition
    and quantitative phosphoproteomics in synchronized cells to distinguish direct, cell-cycle-resolved
    CHK1 substrates from indirect targets.
- description: Degron-based acute CHK1 depletion combined with DNA fiber assays and origin-mapping to
    separate CHK1 control of origin firing from its control of fork stability in unperturbed versus stressed
    S phase.
- description: Separation-of-function CHK1 phosphosite/localization mutants (Ser317, Ser345, Ser296, centrosome-tethered)
    to map how compartmentalization directs distinct substrate sets (nuclear CDC25A/C versus centrosomal
    CDK1 shielding).
