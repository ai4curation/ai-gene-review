core_functions:
- description: ATR-activated effector serine/threonine kinase that phosphorylates the CDC25 phosphatases
    (CDC25A for degradation; CDC25C on Ser216 to create a 14-3-3 docking site) to restrain cyclin-dependent
    kinase activity and enforce the mitotic G2/M transition checkpoint.
  supported_by:
  - reference_id: PMID:9278511
    supporting_text: Chk1 phosphorylates Cdc25C on serine-216
  - reference_id: PMID:14559997
    supporting_text: Chk1 phosphorylation targets Cdc25A for destruction
