id: O14757
gene_symbol: CHEK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHEK1 (checkpoint kinase 1, Chk1) is a nuclear serine/threonine-protein kinase (EC 2.7.11.1)
  of the CAMK group and the principal effector kinase of the ATR-dependent DNA replication-stress and
  DNA-damage checkpoints. It has an N-terminal catalytic domain and a C-terminal autoinhibitory regulatory
  region; the isolated kinase domain is markedly more active than the full-length protein. Activated by
  ATR phosphorylation at Ser317 and Ser345 (with Claspin/CLSPN as mediator and BRCA1 and FEM1B as modulators)
  followed by Ser296 autophosphorylation, Chk1 restrains cyclin-dependent kinase activity to enforce the
  intra-S and G2/M checkpoints. Its central outputs are phosphorylation of the CDC25 phosphatases (targeting
  CDC25A for degradation and creating a 14-3-3 docking site on CDC25C Ser216) and stabilization of WEE1
  (indirectly, via phosphorylation of PABIR1/FAM122A and activation of PP2A-B55alpha), which together
  suppress CDK1/CDK2 activity, limit replication-origin firing, and protect stalled replication forks.
  Chk1 additionally phosphorylates substrates that coordinate homologous-recombination repair (RAD51 Thr309),
  the Fanconi anemia/BRCA cross-link pathway (FANCE), the p53 network (p53, MDMX), chromatin/transcription
  (histone H3 Thr11; TLK1), mitotic fidelity (Aurora B Ser331, NEK6, NEK11) and other targets. It is predominantly
  nuclear but shuttles to the cytoplasm and localizes to interphase centrosomes, where it shields centrosomal
  CDK1 from premature activation by CDC25B. Chk1 is an Hsp90/Cdc37 client, and activated Chk1 is turned
  over by SCF(FBXO6)-mediated ubiquitination to terminate the checkpoint. The gene is essential; complete
  loss causes early embryonic lethality.
