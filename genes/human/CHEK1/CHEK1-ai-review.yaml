    label: CDC25C
- description: Effector kinase of the intra-S/replication checkpoint that limits origin firing and protects
    stalled replication forks, acting at chromatin and replication forks; also stabilizes WEE1 via phosphorylation
    of PABIR1/FAM122A and activation of PP2A-B55alpha.
  supported_by:
  - reference_id: PMID:33108758
    supporting_text: CHK1 directly phosphorylated FAM122A on a highly conserved site, Ser37
  - reference_id: PMID:31316063
    supporting_text: SPRTN cleaves, evicts and activates CHK1 from replicative chromatin
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
