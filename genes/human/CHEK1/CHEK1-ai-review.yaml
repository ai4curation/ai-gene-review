    label: replication fork
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
- description: Promotes homologous-recombination repair of DNA double-strand breaks by phosphorylating
    RAD51 on Thr309 (releasing RAD51 from BRCA2 and enhancing its chromatin association).
