core_functions:
- description: As part of the Ku70:Ku80 heterodimer, XRCC5 contributes to the ring-shaped DNA
    end-binding activity that recognizes broken double-stranded DNA ends and starts classical
    non-homologous end joining by recruiting DNA-PKcs and downstream ligation and end-processing
    factors.
  contributes_to_molecular_function:
    id: GO:0045027
    label: DNA end binding
  directly_involved_in:
  - id: GO:0006303
    label: double-strand break repair via nonhomologous end joining
  locations:
  - id: GO:0090734
    label: site of DNA damage
  in_complex:
    id: GO:0043564
    label: Ku70:Ku80 complex
  supported_by:
  - reference_id: PMID:9368068
    supporting_text: DNA end-binding activity can be reconstituted only through renaturation of the
      two subunits in the heterodimeric form
  - reference_id: file:modules/nonhomologous_end_joining.yaml
    supporting_text: Ku70/Ku80 heterodimer binding to the broken DNA ends
- description: XRCC5 contributes to Ku binding at telomeric repeats and to Ku-dependent telomere-end
    maintenance, a second conserved chromosome-end context for the same DNA-end-binding heterodimer.
  contributes_to_molecular_function:
    id: GO:0042162
    label: telomeric DNA binding
  directly_involved_in:
  - id: GO:0000723
    label: telomere maintenance
  locations:
  - id: GO:0000781
    label: chromosome, telomeric region
  in_complex:
    id: GO:0043564
    label: Ku70:Ku80 complex
  supported_by:
