id: P13010
gene_symbol: XRCC5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'XRCC5 encodes Ku80, the larger subunit of the Ku70:Ku80 heterodimer. Ku forms a ring-shaped
  nuclear DNA-end sensor that binds broken double-stranded DNA ends, recruits DNA-PKcs and the XRCC4-LIG4
  ligase machinery during classical non-homologous end joining, and also binds telomeric DNA to help maintain
  telomere-end structure. XRCC5 also participates in secondary DNA-PK-associated contexts, including nucleolar
  rRNA processing, cytosolic DNA sensing, and limited AP-site end cleaning.'
