core_functions:
- description: 'Class IA phosphoinositide 3-kinase catalytic subunit: as p110alpha in complex with a p85-family regulatory subunit, phosphorylates the 3-hydroxyl of membrane PI(4,5)P2 using ATP to produce the second messenger PIP3 at the plasma membrane, thereby initiating PI3K-AKT signal transduction.'
  supported_by:
  - reference_id: PMID:19200708
    supporting_text: The activated p110 catalytic subunit of PI3K primarily uses phosphatidylinositol 4,5-biphosphate (PIP2) as a substrate to generate phosphatidylinositol 3,4,5-triphosphate (PIP3).
  - reference_id: PMID:19200708
    supporting_text: Class 1A PI3Ks are a collection of heterodimeric lipid kinases that consist of a p110 catalytic subunit and a regulatory subunit.
  - reference_id: PMID:19200708
    supporting_text: Subsequently PIP3 acts as a lipid second messenger promulgating signals via a high affinity interaction with pleckstrin homology (PH) domains in downstream effectors, such as serine/threonine kinases AKT and PDK1
  - reference_id: PMID:28676499
    supporting_text: "PI3Ks have dual kinase specificity: a lipid kinase activity that phosphorylates the 3'-hydroxyl of phosphoinositides and a protein-kinase activity that includes autophosphorylation."
