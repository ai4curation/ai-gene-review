id: P42336
gene_symbol: PIK3CA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PIK3CA encodes p110alpha, the ~110 kDa catalytic subunit of class IA phosphoinositide 3-kinase (PI3Kalpha). It functions as an obligate heterodimer with a p85-family regulatory subunit (encoded by PIK3R1, PIK3R2 or PIK3R3), which stabilizes p110alpha and holds it in a basally inhibited state. Upon growth-factor stimulation, the regulatory subunit engages phosphotyrosine motifs on activated receptor tyrosine kinases or adaptor proteins such as IRS1, recruiting the enzyme to the inner leaflet of the plasma membrane; RAS-GTP provides an additional activating input via the RAS-binding domain. There, p110alpha transfers the gamma-phosphate of ATP to the 3-hydroxyl of the inositol ring of phosphatidylinositol-4,5-bisphosphate (PIP2), generating the second messenger phosphatidylinositol-3,4,5-trisphosphate (PIP3). PIP3 recruits PH-domain effectors, notably AKT and PDK1, activating the PI3K-AKT-mTOR signaling axis that controls cell growth, survival, proliferation, metabolism and motility; the lipid phosphatase PTEN reverses the reaction. p110alpha is the principal class IA isoform transducing signals from insulin, IGF1 and many other receptor tyrosine kinases, and is essential for endothelial cell migration during vascular development. It also possesses a secondary protein-serine/threonine (auto)phosphorylation activity of less certain physiological significance. Somatic activating mutations (hotspots E542K, E545K, H1047R) make PIK3CA one of the most frequently mutated oncogenes, and mosaic activating variants cause overgrowth syndromes.'
