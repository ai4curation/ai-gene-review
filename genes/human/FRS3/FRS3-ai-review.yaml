id: O43559
gene_symbol: FRS3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FRS3 (fibroblast growth factor receptor substrate 3; also FRS2beta or SNT-2) is a neural-enriched
  docking protein of the FRS family that couples receptor tyrosine kinases, principally FGF receptors
  and Trk neurotrophin receptors, to intracellular signalling. It is N-myristoylated and carries an N-terminal
  IRS-type phosphotyrosine-binding (PTB) domain followed by a long disordered tail with multiple tyrosines.
  The PTB domain binds a non-phosphorylated juxtamembrane motif of FGFR1 (and phosphorylated sites on
  Trk receptors and ALK fusions); the activated receptor then phosphorylates the tail, creating docking
  sites for GRB2 and the phosphatase SHP2 (PTPN11) that promote Ras-MAPK activation. FRS3 can substitute
  for its broadly expressed paralog FRS2 in MAPK activation, but in vivo it is a minor, partially redundant
  mediator: Frs3-null mice are viable, while combined Frs2/Frs3 loss impairs forebrain neuronal differentiation
  and hippocampal dentate granule cell maturation. FRS3 also binds ERK2 through D-domain-like motifs and
  can act as a feedback inhibitor of EGFR-family signalling, and neuronal FRS3 associates with microtubules.
  Missense variants in FRS3 are associated with body mass index in humans.'
