  - UniProtKB:Q8WU20
  review:
    summary: IBA for FGFR binding, with FRS3 itself (and FRS2) among the experimental descendants. FRS3
      binding to FGFR1 is directly shown by yeast two-hybrid and in vitro binding mapped to the PTB domain
      and FGFR1 juxtamembrane segment.
    action: ACCEPT
    reason: Well supported phylogenetically and experimentally on FRS3 itself; the appearance of O43559
      in the WITH/FROM reflects its own experimental grounding.
    supported_by:
    - reference_id: PMID:9660748
      supporting_text: we show that FRS2/SNT-1 and a newly isolated SNT-2 protein directly bind to FGF
        receptor-1 (FGFR-1)
    - reference_id: PMID:9660748
      supporting_text: A juxtamembrane segment of FGFR-1 and the phosphotyrosine-binding domain of SNTs
        are both necessary and sufficient for interaction in yeast and in vitro
    - reference_id: PMID:10629055
      supporting_text: Here we show that the PTB domains of both the alpha and beta isoforms of FRS2 bind
        directly to the FGF or NGF receptors
