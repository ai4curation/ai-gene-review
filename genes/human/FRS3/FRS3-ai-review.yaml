- term:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1100860
  - PANTHER:PTN008575506
  review:
    summary: 'IBA (PANTHER PTN008575506) transferring RTK adaptor activity across the FRS family. FRS3
      itself has direct experimental support: its PTB domain binds the FGFR1 juxtamembrane region and
      Trk receptors, it is tyrosine-phosphorylated by the receptor, and phospho-FRS3 recruits GRB2 and
      SHP2 and supports MAPK activation, including rescue of MAPK activation in Frs2alpha-null fibroblasts.'
    action: ACCEPT
    reason: 'The node placement is sound: FRS3 is squarely within the FRS clade that inherited the docking-adaptor
      function, and FRS3-specific biochemistry reproduces each step of the FRS2 docking mechanism. This
      is the most precise MF term for FRS3''s core activity.'
    supported_by:
    - reference_id: PMID:9660748
      supporting_text: we show that FRS2/SNT-1 and a newly isolated SNT-2 protein directly bind to FGF
        receptor-1 (FGFR-1)
    - reference_id: PMID:16697063
      supporting_text: We demonstrate that FRS3 binds all neurotrophin Trk receptor tyrosine kinases and
        becomes tyrosine phosphorylated in response to NGF, BDNF, NT-3 and FGF stimulation in transfected
        cells and/or primary cortical neurons
    - reference_id: PMID:16697063
      supporting_text: the signaling molecules Grb2 and Shp2 bind FRS3 at consensus sites that are highly
        conserved among FRS family members and that Shp2, in turn, becomes tyrosine phosphorylated
    - reference_id: PMID:15094036
      supporting_text: We further show that FRS2beta can compensate for the loss of FRS2alpha for activation
        of MAP kinase when expressed in fibroblasts from Frs2alpha(-/-) mouse embryos
    - reference_id: file:human/FRS3/FRS3-deep-research-falcon.md
      supporting_text: Unlike enzymes, FRS3 has no catalytic activity or substrate specificity; instead,
        it serves as a phosphorylation-dependent scaffold.
