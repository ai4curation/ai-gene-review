core_functions:
- description: 'Receptor tyrosine kinase docking adaptor: FRS3 binds the FGFR (and Trk) cytoplasmic region
    through its PTB domain, is tyrosine-phosphorylated by the activated receptor, and recruits GRB2 and
    SHP2 to couple the receptor to Ras-MAPK signalling at the plasma membrane; functionally overlapping
    with, and subordinate to, FRS2.'
  molecular_function:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9660748
    supporting_text: Our findings establish SNTs as direct protein links between FGFR-1 and multiple downstream
      pathways
  - reference_id: PMID:16697063
    supporting_text: the signaling molecules Grb2 and Shp2 bind FRS3 at consensus sites that are highly
      conserved among FRS family members and that Shp2, in turn, becomes tyrosine phosphorylated
  - reference_id: PMID:16697063
    supporting_text: these data demonstrate that FRS3 supports ligand-induced Map kinase activation
  - reference_id: PMID:15094036
    supporting_text: We further show that FRS2beta can compensate for the loss of FRS2alpha for activation
      of MAP kinase when expressed in fibroblasts from Frs2alpha(-/-) mouse embryos
- description: 'Receptor recognition: direct binding of the FRS3 PTB domain to the juxtamembrane region
    of FGFR1, pre-positioning FRS3 for receptor-mediated phosphorylation.'
  molecular_function:
    id: GO:0005104
    label: fibroblast growth factor receptor binding
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9660748
    supporting_text: we show that FRS2/SNT-1 and a newly isolated SNT-2 protein directly bind to FGF receptor-1
      (FGFR-1)
  - reference_id: PMID:9660748
    supporting_text: A juxtamembrane segment of FGFR-1 and the phosphotyrosine-binding domain of SNTs
      are both necessary and sufficient for interaction in yeast and in vitro
  - reference_id: PMID:10629055
    supporting_text: Here we show that the PTB domains of both the alpha and beta isoforms of FRS2 bind
      directly to the FGF or NGF receptors
suggested_questions:
- question: Does FRS3's loss of one of the four FRS2 GRB2-binding sites quantitatively reduce GRB2-SOS
    recruitment relative to FRS2, and does this explain FRS2 dominance in vivo beyond expression differences?
- question: Should FRS3 carry GO:0042059 negative regulation of epidermal growth factor receptor signaling
    pathway? ERK2-binding-dependent feedback inhibition of EGFR/ErbB2 is reported by one group (Huang
    2004/2006; Iejima 2010) but has not been independently replicated.
- question: Should FRS3 (and FRS2) carry neurotrophin receptor binding (GO:0005165) given direct binding
    to all three Trk receptors, or is the RTK adaptor term considered sufficient by convention?
- question: Is FRS3 microtubule binding direct, and does it relate to its receptor-adaptor function or
    to a separate neuronal cytoskeletal role?
- question: How do BMI-associated FRS3 missense variants (e.g. p.Glu115Lys in the PTB domain) alter receptor
    binding or BDNF-TrkB signalling?
suggested_experiments:
- description: Quantitative comparison of GRB2, SHP2 and GAB1 recruitment to FRS2 versus FRS3 after FGFR1
    or TrkB activation in the same cells, with tyrosine-to-phenylalanine mutants of each FRS3 tail site.
- description: Test PTB-domain BMI variants (p.Glu115Lys and others) for FGFR1 and TrkB binding (ITC/pulldown)
    and for BDNF-induced ERK/AKT activation in hypothalamic neurons.
- description: Purified-component microtubule co-sedimentation with recombinant FRS3 to determine whether
    microtubule binding is direct.
