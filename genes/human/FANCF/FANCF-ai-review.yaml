  review:
    summary: FANCF supports the FA damage-response machinery after cross-link damage and replication stress.
    action: ACCEPT
    reason: 'The actual PANTHER v19 PTHR14449 tree and 374-residue target MSA place human PTN002494673
      below PTN001426273, where the GO:0006974 IBD is grounded in mouse Fancf. The exact mouse E9Q5Z5/MGI:3689889
      experimental annotation traces to PMID:21915857. Its accessible author dissertation chapter 5 directly
      tests Fancf-null MEFs: MMC causes chromosome breakage, G2 accumulation and reduced survival, and
      FANCD2 monoubiquitination is lost after either MMC or hydroxyurea (Figure 5.2D, printed dissertation
      page 84 / PDF page 85; HU 1 mM for 24 h; Methods and Results). Mouse and human FANCF also restore
      MMC resistance in human FA-F cells (Figure 5.1A). Retain DNA damage response because this measured
      activation response extends beyond the separately supported ICL-repair branch; it is not retained
      merely as a convenient parent term. FANCF organizes the core machinery rather than catalyzing ubiquitin
      transfer. The mouse tumor and gonadal phenotypes are not additional human process assertions.'
