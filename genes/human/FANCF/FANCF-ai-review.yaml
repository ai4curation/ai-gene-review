id: Q9NPI8
gene_symbol: FANCF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCF is a predominantly nuclear organizing subunit of the Fanconi anemia core complex. Its
  contacts with FANCG and the FANCC–FANCE module help assemble and stabilize the repair machinery, enabling
  coordinated activation of FANCD2–FANCI during interstrand cross-link repair and replication stress.
  FANCL and UBE2T perform ubiquitin transfer; FANCF supplies an integral structural contribution. Nuclear
  and chromatin-associated complex pools support this role, while a smaller cytosolic pool has a less
  clearly defined function. Defects in FANCF cause Fanconi anemia complementation group F and cellular
  hypersensitivity to DNA cross-linking agents.
