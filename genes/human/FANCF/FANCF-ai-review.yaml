      FANCA/FANCG assembly are positive. Negative pairwise reticulocyte binding remains preparation-specific
      and does not negate cellular assembly. Predominant nuclear localization is measured; the small cytoplasmic
      signal is explicitly qualified by the authors as possibly authentic or fractionation-related. This
