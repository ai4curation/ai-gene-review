    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Historical assessment (retained verbatim): PubMed-verified primary paper (Leveille
      2004, JBC). Mutagenesis study that first established FANCF as a flexible adaptor bridging the FANCA:FANCG
      and FANCC:FANCE subcomplexes; the primary experimental basis for the molecular adaptor activity
      core function and the subcomplex-bridging model.


      Direct-original assessment (2026-10-25; complete current reading scope): Independently read the
      genuine complete author-hosted original recovered for this review: Experimental Procedures, Results
      and captions, extracted lines 150–390 and 488–586, including Figures 4–6/Table I; actual printed
      pages 39424–39425 pixels were inspected. Human clone-10 FANCF mutants were assayed in human FA-F
      lymphoblasts and 293 reporter cells, with yeast two-hybrid interface tests. C-terminal interaction
      defects and N-terminal loss of FANCC/FANCE association distinguish complex assembly from nuclear
      residence. C-terminal mutants can retain MMC rescue despite weak stable co-IP, so those readouts
      are not conflated. The mammalian three-hybrid experiment requires FANCC for FANCE–FANCF association.
      The historical word adaptor is interpreted using current GO:0140378 integral protein-complex scaffold
      activity; GO:0030674 explicitly redirects this class. No isolated FANCF ubiquitin-transfer or direct
      ligase–substrate-adaptor positioning was demonstrated. The unchanged normal cache is abstract-only;
      complete external main and selected reading are separate facts.


      Database-source assessment (2026-10-25; complete current reading scope): Identity verified against
      Europe PMC and the actual Amsterdam UMC author PDF, with visible JBC279(38):39421–39430 imprint
      and repository Other version label. Independently read Experimental Procedures, Results and captions
      through Figure 6/Table I, plus selected Discussion and Figures 9–10 captions. Actually viewed PDF
      pages5–6: Figures4–6, Table I and the fractionation/interaction controls. Human sequence-verified
      constructs, patient EUFA698 cells, 293 mammalian two-/three-hybrid and yeast assays distinguish
      N-terminal and C-terminal assembly contributions. FANCC-dependent FANCE/FANCF reporter association
      is not purified binary binding; nuclear localization alone does not rescue the N-terminal mutant.
      Xenopus full-length FANCF fails human-cell complementation in this study and is not equated with
      human activity. No independent image quantification, supplement or complete-paper reading is claimed.
      The historical adaptor terminology describes assembly behavior; precise present-day MF selection
