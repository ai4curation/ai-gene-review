suggested_questions:
- question: Which FANCF contacts determine productive core-complex assembly in cells when some mutants
    retain cross-link resistance despite weak stable co-immunoprecipitation?
- question: Does endogenous cytosolic FANCF participate functionally in the modeled FA-core:HSP70:PKR
    assembly, and how is that pool distinguished from nuclear protein redistributed during fractionation?
suggested_experiments:
- hypothesis: Complementary FANCF interfaces support repair through assembly dynamics that are not fully
    captured by a single stable co-immunoprecipitation measurement.
  description: Compare matched human FANCF interface variants at near-endogenous expression in FA-F complementation
    cells, measuring nuclear localization, several core contacts, FANCD2/FANCI monoubiquitination and
    cross-link survival. Include wild-type, empty-vector and N-terminal loss-of-function controls and
    quantify protein abundance to distinguish weakened association from destabilization.
- hypothesis: A distinct cytosolic FANCF-containing complex can be resolved from fractionation-associated
    redistribution.
  description: Combine endogenous tagging and orthogonal live-cell/proximity measurements with controlled
    nuclear/cytosolic fractionation before and after DNA damage. Test FANCF association with HSP70/PKR
    and corresponding signaling only after confirming the relevant compartment; compare depletion and
    expression-matched rescue without assigning a role from colocalization alone.
