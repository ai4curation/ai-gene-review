  review:
    summary: The FANCF–FANCG context supports FANCF as an integral scaffold of the repair core complex.
    action: MODIFY
    reason: 'FANCG (UniProtKB:O15287): PMID:11063725 demonstrates endogenous human FANCF co-immunoprecipitation
      with FANCG in lymphoblasts and restoration of FANCA–FANCG association after FANCF complementation.
      Its pairwise reticulocyte-translation experiments did not recover FANCF–FANCG binding under those
      conditions; they are not silently converted into positive binary binding. Independent human FANCF
      mutagenesis in PMID:15262960 resolves the structural function: C-terminal changes weaken FANCG interaction
      and stable FANCA-containing assembly, whereas the N-terminal 1–15 deletion prevents association
      with the FANCC/FANCE subcomplex and fails to restore MMC resistance despite nuclear localization.
      Some C-terminal deletions retain functional rescue despite weak co-immunoprecipitation, so a particular
      stable band is not treated as an absolute functional requirement. Current GO:0030674 explicitly
      directs integral complex scaffolds to GO:0140378. The latter captures FANCF holding the complex
      together; no ubiquitin-transfer chemistry or direct ligase–substrate-adaptor positioning is assigned.'
    supported_by:
