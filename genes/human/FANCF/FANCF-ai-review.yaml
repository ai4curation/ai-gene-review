  review:
    summary: The literal TCP11 isoform-7/FANCF HuRI interaction is supported as a screened binary association.
    action: KEEP_AS_NON_CORE
    reason: The official HuRI dataset contains the exact Q8WWU5-7/Q9NPI8 pair, human ORFeome clones 100080789/55485,
      with N-terminal Gal4 fusion configuration and screen 1. Array, pooling and validated-two-hybrid
      records describe stages of the same pipeline rather than three independent physiological experiments.
      Main text reports quadruplicate retesting and sequence confirmation; study-wide MAPPIT/GPCA benchmarks
      are not individual validation of this pair. The literal TCP11 isoform identifier is preserved, without
      assuming all TCP11 products behave alike. A search for TCP11-specific binding and assessment of
      partner-class alternatives did not establish a more informative supported FANCF activity in this
      assay. Retain the positive association as non-core under the project’s supported-binding policy,
      without assigning a sperm, repair or scaffold role to this pair.
    supported_by:
