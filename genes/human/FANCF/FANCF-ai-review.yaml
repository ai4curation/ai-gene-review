      main extracted text through the Methods, including Results/Figures 1–7 captions, Discussion and
      construct/antibody/fractionation procedures (journal pp2665–2673). Human HEK293 FANCF-GFP retains
      FA-F complementation; endogenous lymphoblast nuclear complexes use reciprocal antibodies and fraction
      markers. In-vitro-translated pair tests were negative under their conditions. The paper explicitly
      allows authentic cytoplasmic FANCF versus diffusion/cross-contamination; it does not quantify a
      native cytosolic pool. No article pixels or supplements were independently read in this database
      assessment. Cache full-text flag, external complete-main availability and this actual text-reading
