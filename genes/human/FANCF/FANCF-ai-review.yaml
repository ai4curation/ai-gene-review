- id: PMID:15262960
  title: The Fanconi anemia gene product FANCF is a flexible adaptor protein.
  findings:
  - statement: FANCF is a flexible adaptor whose C-terminus binds FANCG to nucleate assembly of the other
      FA proteins, while its N-terminus stabilizes the FANCA/FANCG interaction and is required to recruit
      the FANCC/FANCE subcomplex; FANCF does not have a ROM-like function.
