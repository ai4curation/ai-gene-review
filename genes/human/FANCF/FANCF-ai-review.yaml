core_functions:
- description: 'Holds the Fanconi anemia core machinery together through complementary interaction surfaces,
    supporting FANCD2–FANCI activation and interstrand cross-link repair. Human complementation and assembly-mutant
    experiments distinguish nuclear localization, individual co-associations and functional rescue: a
    weakened stable co-immunoprecipitation signal does not invariably eliminate function. The conserved
    response also includes hydroxyurea-induced FANCD2 activation. FANCL/UBE2T execute ubiquitin transfer.
    This integral scaffold role does not establish direct positioning of the ligase together with its
    substrate adaptor.'
