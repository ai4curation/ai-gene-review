      and positive target identity were verified against the current Europe PMC record. Complete original
      main was recovered from the OHSU institutional repository. Independently read Results, captions
      and relevant Discussion at printed pages 2666–2672, and patient/cell, construct, antibody, fractionation
      and reticulocyte-translation Methods at pages 2672–2673 (extracted lines 117–539); actual page 2669
