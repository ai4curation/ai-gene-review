      supporting_text: FANCF was found predominantly in the nucleus, where it complexes with FANCA, FANCC
        and FANCG.
    - reference_id: PMID:17082180
      supporting_text: The human FANCF protein reportedly functions as a molecular adaptor within the
        FA nuclear complex, bridging between the subcomplexes A:G and C:E.
    - reference_id: PMID:15262960
      supporting_text: Our data demonstrate that FANCF acts as a flexible adaptor protein that plays a
        key role in the proper assembly of the FA core complex.
