core_functions:
- description: >-
    SMIM26 tethers mitochondrial metabolite carriers of the outer and inner membranes to
    one another. Anchored in the outer membrane by a single transmembrane helix, its
    soluble region reaches across the intermembrane space so that it can contact
    outer-membrane porins (VDAC1/2) on one side and inner-membrane carriers (SLC25A6,
    SLC25A11, SFXN1/2) on the other. It has no catalytic or transport activity itself; the
    function is to hold these transporters in proximity so that metabolite flux across the
    two membranes is coordinated, which is required for normal respiratory chain activity.
    Loss of SMIM26 leaves cultured cells viable with strongly reduced respiration, and is
    lethal in mouse embryos.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:1990542
    label: mitochondrial transmembrane transport
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: PMID:41991342
    supporting_text: In biochemical and single-molecule tracking studies, we found that
      SMIM26 interacts with VDAC1/2 in the outer mitochondrial membrane and with SLC25A6
      in the inner mitochondrial membrane.
  - reference_id: PMID:41991342
    supporting_text: Our work suggests that SMIM26 coordinates metabolite transport
      through the inner and outer mitochondrial membranes and is essential for
      respiratory chain function in vivo.
  - reference_id: PMID:37009826
    supporting_text: Moreover, the formation of the SMIM26-AGK-SCL25A11 complex maintains
      mitochondrial glutathione import and respiratory efficiency, which is abrogated by
      AGK overexpression or SLC25A11 knockdown.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is there an inner-membrane-integral, matrix-facing pool of SMIM26? This is the single
    question that would reconcile the outer-membrane/intermembrane-space topology of
    PMID:41991342 with the inner-membrane localisation and direct mitoribosome binding
    reported in PMID:40578345, and it decides whether GO:0005743 and GO:0140978 should be
    retained.
  experts:
  - Gunter Meister
  - Lena Ho
  - David A Stroud
- question: >-
    Are the three reported partner sets - AGK plus SLC25A11, SFXN1/2 plus the mitoribosome,
    and VDAC1/2 plus SLC25A6 - alternative occupancies of one promiscuous tether, or
    genuinely distinct cell-type-specific complexes? The answer determines whether
    transmembrane transporter binding should be annotated once as a general property or
    separately per carrier.
  experts:
  - Gunter Meister
  - Qing-Yu He
- question: >-
    What is the function of the phosphorylation sites reported on SMIM26? PMID:41991342
    states that the protein is phosphorylated at distinct residues but assigns no role to
    the modification.
  experts:
  - Gunter Meister
  - Andrea Pauli
suggested_experiments:
- hypothesis: >-
    SMIM26 is anchored only in the outer membrane, and its association with the
    mitoribosome is indirect.
  description: >-
    Determine SMIM26 topology directly by protease protection of intact mitochondria,
    mitoplasts and detergent-solubilised membranes, using antibodies against the N and C
    termini and against an internal epitope tag. Combine with alkaline carbonate extraction
    to distinguish integral from peripheral association, and with separation of outer
    membrane, intermembrane space, inner membrane and matrix fractions. A single-pass
    outer-membrane anchor with an intermembrane-space-facing C terminus predicts complete
    loss of the C-terminal epitope on mitoplasting.
  experiment_type: subcellular fractionation and protease protection
- hypothesis: >-
    The mitoribosome association reported for SMIM26 is bridged by SFXN1/2 rather than
    being a direct contact.
  description: >-
    Repeat the mitoribosome co-purification in SFXN1/SFXN2 double-knockout cells and with
    recombinant SMIM26 and purified mitoribosomes in vitro. Direct binding should survive
    loss of the sideroflexins and should be reconstitutable from purified components;
    indirect association should not.
  experiment_type: co-immunoprecipitation in knockout background plus in vitro
    reconstitution
- hypothesis: >-
    The adaptor function of SMIM26 is required for coordinated metabolite flux, not merely
    correlated with it.
  description: >-
    Measure ADP/ATP exchange and serine import in mitochondria isolated from SMIM26
    knockout cells and from knockout cells rescued with wild-type SMIM26 or with separation
    -of-function mutants that retain the outer-membrane anchor but lose the
    intermembrane-space region. If the tether coordinates transport, the anchor-only mutant
    should fail to restore flux despite correct localisation.
  experiment_type: isolated-mitochondria transport assay with structure-guided rescue
