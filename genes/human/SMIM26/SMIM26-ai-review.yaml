  label: Homo sapiens
description: >-
  SMIM26 is a 95-amino-acid mitochondrial microprotein encoded by a transcript that was
  originally annotated as the long non-coding RNA LINC00493. It has a single predicted
  transmembrane helix near its N terminus and is anchored in the mitochondrial outer
  membrane, with the bulk of its soluble sequence reported to span the intermembrane
  space. SMIM26 has no catalytic or transport activity of its own; it acts as a tether
  that holds mitochondrial metabolite carriers of the two membranes in proximity. Reported
  partners include the outer-membrane porins VDAC1 and VDAC2, the inner-membrane
  ADP/ATP translocase SLC25A6 (ANT3), the 2-oxoglutarate/malate carrier SLC25A11, the
  serine transporters SFXN1 and SFXN2, and the TIM22-complex lipid kinase AGK. Loss of
  SMIM26 leaves cultured cells viable but strongly reduces respiratory chain activity;
  knockout mice die at early developmental stages and homozygous zebrafish mutants show
  reduced fitness, survival and respiration. A separate line of work places SMIM26 in a
  complex with the sideroflexin serine transporters and the mitoribosome, where it is
  proposed to support localized translation of the complex I subunit mt-ND5; whether
  SMIM26 also has an inner-membrane, matrix-facing pool that could account for direct
  mitoribosome contact is unresolved, because a single-pass outer-membrane protein
  spanning the intermembrane space cannot reach the matrix face of the inner membrane.
  The protein is phosphorylated at several residues of unassigned function, and its loss
  has been linked to progression of clear cell renal cell carcinoma.
alternative_products:
