- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: ISS
  original_reference_id: PMID:41196993
  review:
    summary: ADIG holds seipin in its functional assembled state and prevents it from aggregating - the
      definition's aggregation clause is met literally.
    action: NEW
    reason: 'GO:0050821 covers maintaining a protein''s structure and integrity and preventing degradation
      or aggregation. Both halves apply: ADIG stabilizes adjacent seipin subunits within the oligomer
      [PMID:41196993 "Adig selectively bound to the dodecameric form and enhanced seipin assembly by bridging
      and stabilizing adjacent subunits."], and its presence determines whether seipin forms functional
      complexes or aggregates [PMID:41196993 "Thus, when expressed with Adig, seipin appeared to form
      functional seipin-Adig complexes rather than seipin aggregates."]. Proposed as a companion to GO:0031334
      rather than a substitute: assembly and anti-aggregation are separable claims and the paper evidences
      each.'
