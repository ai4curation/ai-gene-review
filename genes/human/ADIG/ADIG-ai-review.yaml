  review:
    summary: Nuclear localization inherited through the PANTHER adipogenin node from mouse Adig, whose
      own nuclear call rests on a single overexpressed EGFP fusion; directly superseded by PMID:41196993.
    action: REMOVE
    reason: The nuclear placement descends entirely from one 2005 observation on an overexpressed SMAF1-EGFP
      fusion [PMID:15567149 "Transfection and localization studies of a SMAF1-EGFP fusion construct indicate
      nuclear localization, suggestive of a possible regulatory role."], and even that paper framed it
      as merely suggestive. ADIG is an 80-residue, ~10 kDa protein, far below the passive nuclear-pore
      diffusion limit, so an EGFP fusion reaching the nucleoplasm is uninformative about where the endogenous
      protein acts. PMID:41196993 went back to precisely this question, naming the nuclear report as one
      of the conflicting claims it set out to settle [PMID:41196993 "We next assessed the subcellular
      location of Adig because previous reports suggest different locations, including the plasma membrane
      (2), nuclei (3), and the surface of LDs (4)."], and resolved it with three orthogonal assays - EGFP
      fused at either terminus against an ER marker, APEX2 electron microscopy at near-endogenous levels
      in Adig-knockout adipocytes, and a digitonin protease-protection topology assay - concluding a single-pass
      ER topology [PMID:41196993 "Thus, Adig is a single-pass ER protein with a cytosolic C-terminal tail"].
      UniProt has already retired the nuclear call and now lists only the ER membrane. This is an ISS/IBA
      propagation of a superseded result, not an experimental annotation whose full text a curator read,
      so removing it does not overrule a curator's reading.
