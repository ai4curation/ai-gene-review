proposed_new_terms:
- proposed_name: seipin-adipogenin complex
  proposed_definition: A protein-containing complex of the endoplasmic reticulum membrane consisting of
    a dodecameric ring of seipin (BSCL2) together with adipogenin subunits bound between adjacent seipin
    protomers. The complex is rigid relative to adipogenin-free seipin oligomers and promotes the expansion
    of nascent lipid droplets.
  justification: GO has no term for any seipin-containing complex, so the defining assembly of this gene
    product cannot be recorded in the in_complex slot of its core function. The complex is structurally
    characterized at ~3 angstrom resolution with defined stoichiometry, is distinguishable from the adipogenin-free
    undecameric and dodecameric seipin rings both compositionally and functionally, and is the unit on
    which both ADIG and BSCL2 act. A parent term for the seipin oligomer itself would also be useful.
  proposed_parent:
    id: GO:0140534
    label: endoplasmic reticulum protein-containing complex
  supported_by:
  - reference_id: PMID:41196993
    supporting_text: Here, we found that Adig interacts with seipin to form a stable, rigid complex.
  - reference_id: PMID:41196993
    supporting_text: Adig selectively bound to the dodecameric form and enhanced seipin assembly by bridging
      and stabilizing adjacent subunits.
  - reference_id: PMID:41196993
    supporting_text: Functionally, this complex promoted lipid droplet development at both early and late
      stages.
suggested_questions:
- question: Does human ADIG bind human seipin with the same dodecamer selectivity shown for the mouse
    protein? Every human ADIG annotation is ISS or IBA, and the structural work used mouse Adig, so the
    human orthology assumption is untested even though it is very likely.
- question: Why did acute siRNA knockdown of Smaf1 in 3T3-L1 adipocytes leave triglyceride accumulation
    intact while germline knockout impairs adipogenesis and lipid storage? Is the requirement developmental,
    is residual protein sufficient, or does seipin oligomer turnover outlast the knockdown?
- question: Is the reduced leptin secretion in Adig null mice a direct consequence of altered droplet
    architecture, or a separate role for the protein at the ER? The GWAS association of the ADIG locus
    with BMI-adjusted leptin suggests the link also holds in humans.
- question: ADIG is induced in steatotic liver by hepatic PPAR-gamma. Does it drive hepatocyte droplet
    enlargement there through the same seipin mechanism, and is that a tractable target in fatty liver
    disease?
- question: Given that GO has no seipin complex term, should a small family of terms be created for the
    seipin oligomer and its adipogenin- and LDAF1-bound forms, which are functionally distinct?
suggested_experiments:
- description: Reconstitute human ADIG with human seipin and determine by cryo-EM whether the human complex
    is also dodecamer-selective, converting the entire human annotation set from ISS to direct evidence.
- description: 'Structure-guided separation-of-function: mutate the ADIG residues that bridge adjacent
    seipin protomers and test whether droplet expansion, but not ER targeting or seipin binding, is lost.
    This would isolate the assembly-promoting activity from mere complex binding.'
- description: Degron-mediated acute depletion of ADIG in mature adipocytes, contrasted with germline
    loss, to resolve whether the storage requirement is developmental or ongoing - the discrepancy between
    the siRNA and knockout results.
- description: Measure seipin oligomer state distribution by native mass spectrometry in ADIG-null versus
    ADIG-overexpressing adipocytes, to test directly that ADIG shifts the undecamer/dodecamer equilibrium
    in cells rather than only in vitro.
