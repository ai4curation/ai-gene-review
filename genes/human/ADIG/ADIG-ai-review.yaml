        bridging and stabilizing adjacent subunits.
- term:
    id: GO:0031334
    label: positive regulation of protein-containing complex assembly
  evidence_type: ISS
  original_reference_id: PMID:41196993
  review:
    summary: ADIG promotes assembly of the seipin oligomer by bridging adjacent subunits - it does the
      work of assembly, not merely permits it.
    action: NEW
    reason: 'ADIG is not a passive partner of seipin: it increases the extent of seipin oligomer assembly
      and the mechanism is structural [PMID:41196993 "Adig selectively bound to the dodecameric form and
      enhanced seipin assembly by bridging and stabilizing adjacent subunits."]. Bridging two adjacent
      subunits is a direct contribution to the assembly step, so the participation test is satisfied -
      ADIG supplies the structure the step depends on rather than merely being required for it. This is
      distinct from GO:0044877, which captures the binding activity, and from GO:0140042, which captures
      the downstream droplet outcome.'
    supported_by:
    - reference_id: PMID:41196993
      supporting_text: Adig selectively bound to the dodecameric form and enhanced seipin assembly by
        bridging and stabilizing adjacent subunits.
