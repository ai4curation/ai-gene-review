  review:
    summary: Lipid droplet localization rests on overexpressed HA-tagged Smaf1; the definitive study places
      ADIG on the ER and shows that Adig-bound seipin complexes specifically do not form stable LD contacts.
    action: MODIFY
    reason: ADIG unquestionably acts in lipid droplet biology, but not by residing on the droplet. The
      LD placement traces to one overexpression immunolocalization [PMID:26427354 "immunolocalization
      studies using HA-tagged Smaf1 reveal enrichment at adipocyte lipid droplets"]. PMID:41196993 listed
      the LD surface among the conflicting prior claims it set out to adjudicate [PMID:41196993 "We next
      assessed the subcellular location of Adig because previous reports suggest different locations,
      including the plasma membrane (2), nuclei (3), and the surface of LDs (4)."] and placed the protein
      on the ER instead. More pointedly, live-cell tracking showed the opposite of LD residence for the
      Adig-containing species [PMID:41196993 "they formed stable contacts with seipin complexes without
      Adig, while seipin-Adig complexes moved rapidly through their vicinity"] - the Adig-bound complex
      is the mobile form that does not engage nascent droplets stably. The correct location is the ER
      membrane, from which ADIG acts on droplet formation in trans through seipin.
