id: Q0VDE8
gene_symbol: ADIG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Adipogenin (ADIG, also called SMAF1) is an 80-residue microprotein of the endoplasmic reticulum
  membrane, anchored by a single conserved N-terminal hydrophobic helix (residues 14-38) with its short
  C-terminal tail facing the cytosol. Its expression is essentially restricted to adipocytes and is a
  direct transcriptional output of PPAR-gamma, rising sharply during adipogenesis and falling when the
  adipocyte phenotype is lost; it is also induced in steatotic liver. ADIG''s molecular activity is to
  bind seipin, the ER protein that organizes lipid droplet biogenesis at ER-droplet junctions. Seipin
  assembles into both undecameric and dodecameric rings, and ADIG selectively binds the dodecamer, bridging
  neighbouring subunits to stabilize the ring and promote its assembly; the resulting rigid seipin-ADIG
  particle favours droplet expansion over new droplet nucleation, redirecting triacylglycerol flux toward
  growing droplets and assisting the relocation of droplet-targeted proteins such as ACSL3 and GPAT4.
  Through this single structural role ADIG sets how much lipid an adipocyte stores: loss of adipogenin
  impairs adipocyte differentiation, yields leaner animals on a high-fat diet and in the leptin-deficient
  background, disrupts triglyceride accumulation in brown adipose tissue and blunts cold tolerance, while
  adipocyte-specific overexpression enlarges droplets and increases fat mass. Adipogenin deficiency additionally
  lowers fat-mass-adjusted circulating leptin and impairs leptin secretion from adipose explants, and
  human genetic variation at the ADIG locus associates with BMI-adjusted leptin levels.'
