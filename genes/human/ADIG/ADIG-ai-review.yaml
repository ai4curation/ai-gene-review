- description: Adipocyte differentiation effector downstream of PPAR-gamma. ADIG is one of the terminal
    outputs of the adipogenic transcriptional program - its protein expression is wholly dependent on
    PPAR-gamma and tracks the emergence and loss of the adipocyte phenotype - and it is in turn required
    for adipocytes to differentiate and accumulate lipid normally. Adipogenin-deficient cells differentiate
    poorly, and null mice are leaner than wild type both on a high-fat diet and in the hyperphagic ob/ob
    background, affecting white and brown depots. This is the organismal-scale reading of the same structural
