  supporting_entities:
  - UniProtKB:Q8R400
  review:
    summary: 'Lipid storage, transferred from mouse Adig. Well supported and core: ADIG sets the amount
      of triacylglycerol stored by controlling seipin-dependent droplet expansion.'
    action: ACCEPT
    reason: 'This is the process the definitive study concludes with [PMID:41196993 "Thus, Adig can modulate
      lipid storage through its structural and functional interactions with seipin."], and it is supported
      bidirectionally in vivo [PMID:41196993 "In transgenic mice, adipocyte-specific overexpression of
      Adig increased fat mass and enlarged lipid droplets, whereas Adig deletion disrupted triglyceride
      accumulation in brown adipose tissues."] and by the independent knockout [PMID:33691105 "Adig-/-
      mice are leaner than wild-type mice when fed a high-fat diet and when crossed with Ob/Ob hyperphagic
      mice"]. One caveat worth recording: acute siRNA knockdown in 3T3-L1 adipocytes did not reproduce
      a storage defect [PMID:26427354 "Smaf1 does not have a major role in adipocyte triglyceride accumulation,
      lipolysis or insulin-stimulated pAkt induction"], which the later genetic and structural work outweighs
      but which suggests the requirement is developmental rather than acute.'
    additional_reference_ids:
    - PMID:41196993
    - PMID:33691105
    - PMID:26427354
