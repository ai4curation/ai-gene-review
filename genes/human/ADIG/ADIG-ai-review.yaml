- term:
    id: GO:0044877
    label: protein-containing complex binding
  evidence_type: ISS
  original_reference_id: PMID:41196993
  review:
    summary: ADIG has no molecular function annotation at all. It binds the seipin complex and, critically,
      discriminates between its two oligomeric states, selecting the dodecamer.
    action: NEW
    reason: The 16 existing annotations contain not one molecular function term, which is the largest
      gap in this gene's curation. ADIG's activity is binding to an assembled multi-subunit complex, and
      it is oligomer-state selective, which is exactly what GO:0044877 (binding to a macromolecular complex)
      expresses and what the generic protein binding term could not. Seipin was the top hit in unbiased
      pulldowns [PMID:41196993 "The most enriched protein with substantial sequence coverage was seipin"],
      the interaction forms a defined particle [PMID:41196993 "Here, we found that Adig interacts with
      seipin to form a stable, rigid complex."], and the selectivity is explicit [PMID:41196993 "Adig
      selectively bound to the dodecameric form and enhanced seipin assembly by bridging and stabilizing
      adjacent subunits."], resolved in a ~3 angstrom cryo-EM structure. UniProt Q0VDE8 already records
      "Forms a dodecameric complex with seipin (BSCL2)". Evidence code ISS because the structural work
      is on the mouse and human seipin-Adig complex and transfers to human ADIG by orthology.
    supported_by:
    - reference_id: PMID:41196993
      supporting_text: The most enriched protein with substantial sequence coverage was seipin
    - reference_id: PMID:41196993
      supporting_text: Here, we found that Adig interacts with seipin to form a stable, rigid complex.
