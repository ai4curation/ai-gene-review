core_functions:
- description: Catalytic light chain of the system y+L heteromeric transporter; mediates
    electroneutral, obligatory 1:1 antiport that exports intracellular cationic amino acids
    (chiefly L-arginine) in exchange for extracellular neutral amino acids (L-leucine,
    L-glutamine) plus Na+, with cationic efflux the dominant physiological direction.
