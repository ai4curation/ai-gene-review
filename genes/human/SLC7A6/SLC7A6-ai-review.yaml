- description: Obligate amino-acid antiport (exchange) mechanism of system y+L. The physiologically
    dominant mode is Na+-coupled exchange of an intracellular basic amino acid (chiefly L-arginine)
    for an extracellular neutral amino acid (L-leucine, L-glutamine) plus Na+; it also exchanges
    L-arginine for L-lysine in a sodium-independent manner. The exchange is carried by the SLC7A6
    light chain within the disulfide-linked SLC3A2 (4F2hc) heterodimer.
