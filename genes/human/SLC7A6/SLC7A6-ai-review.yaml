id: Q92536
gene_symbol: SLC7A6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC7A6 (y+LAT2) is the catalytic light chain of a plasma-membrane heteromeric
  amino-acid transporter. It is disulfide-linked to the heavy chain SLC3A2 (4F2hc/CD98hc),
  which is required to traffic the complex to the cell surface, and together they constitute
  transport system y+L. y+LAT2 is an electroneutral, obligatory 1:1 antiporter (exchanger)
  that moves intracellular cationic amino acids (L-arginine, L-lysine) out of the cell in
  exchange for extracellular neutral amino acids (L-leucine, L-glutamine, isoleucine,
  methionine, histidine, cysteine) plus Na+; the Na+ requirement applies to the
  neutral-amino-acid arm of the exchange. It can also exchange L-arginine for L-lysine in a
  sodium-independent manner. Because cationic amino acids have the highest affinity for the
  internal binding site, the physiologically dominant direction is efflux of cationic amino
  acids (notably arginine export) coupled to neutral-amino-acid import. The protein is a
  12-transmembrane LAT-family member of the APC superfamily, broadly expressed (brain, heart,
  testis, kidney, small intestine, T lymphocytes and many cultured cell types); in polarized
  epithelia the transporter localizes to the basolateral membrane, where it moves cationic
  amino acids toward the bloodstream. It can carry ornithine as a minor substrate and, by
  similarity to rodent orthologs, has been linked to arginine supply for nitric oxide
  synthesis and to glycine betaine transport in reproductive tissue.
