  review:
    summary: ISS transferred from the rat ortholog (D3ZMM8); UniProt records (by similarity) a
      contribution to ammonia-induced arginine uptake leading to iNOS-dependent NO production in
      astrocytes.
    action: MARK_AS_OVER_ANNOTATED
    reason: y+LAT2 supplies/transports the NOS substrate L-arginine but does not itself catalyse
