proposed_new_terms: []
suggested_questions:
- question: In which polarized human tissues is the y+LAT2/4F2hc complex basolateral versus
    apical, and does its surface distribution match that of the paralog y+LAT1 (SLC7A7)?
- question: Is there (or should GO create) a molecular-function term that captures the Na+-coupled
    y+L exchange mode (basic amino acid out, Na+-coupled neutral amino acid in) distinctly from the
    Na+-independent b0,+ exchange? GO:0180009 encodes the neutral:basic substrate pair for both
    system y+L and system b0,+ but does not encode the Na+ coupling on the neutral arm that
    distinguishes y+LAT transporters; no current MF term captures this distinction.
suggested_experiments:
- description: Reconstitute purified human SLC7A6/SLC3A2 heterodimer in proteoliposomes and measure
    the stoichiometry and Na+-dependence of arginine-out/leucine-in versus arginine/lysine exchange
    directly, to define the precise antiport mode for each substrate pair.
- description: Tissue-specific conditional knockout or isoform-resolved knockdown of SLC7A6 in
    epithelial and immune cells to quantify its non-redundant contribution to cationic amino-acid
    homeostasis relative to SLC7A7/y+LAT1.
