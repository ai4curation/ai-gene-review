id: Q96DR7
gene_symbol: ARHGEF26
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF26 (SGEF) is a RhoG-specific guanine nucleotide exchange factor of the ephexin subfamily,
  with a proline-rich N-terminus, a DH/PH catalytic module, a C-terminal SH3 domain, and both an internal
  and a C-terminal PDZ-binding motif. It activates RhoG but not Rac, and drives dorsal membrane ruffles
  and macropinocytosis. In epithelia SGEF bridges the polarity proteins Scribble (through PDZ1 and an
  internal PDZ-binding motif) and Dlg1 (through the Dlg1 GUK domain) into a ternary complex, which targets
  it to apical junctions, where it regulates actomyosin contractility, tight-junction barrier function
  and E-cadherin-mediated adherens junctions. Its C terminus binds many PDZ-domain proteins. In endothelial
  cells SGEF activates RhoG around clustered ICAM-1 to build leukocyte docking structures and promotes
  VEGFR2 macropinocytosis and angiogenesis; SGEF-deficient mice develop less atherosclerosis. Src phosphorylation
  of Tyr530 in the DH domain inhibits its activity.
