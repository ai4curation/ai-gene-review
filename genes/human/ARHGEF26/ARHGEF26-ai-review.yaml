- term:
    id: GO:1905303
    label: positive regulation of macropinocytosis
  evidence_type: IMP
  original_reference_id: PMID:34849650
  qualifier: involved_in
  review:
    summary: Positive regulation of macropinocytosis (NEW, IMP). SGEF overexpression stimulates dextran
      uptake in fibroblasts, which requires its catalytically active DH domain. In endothelial cells ARHGEF26
      is required for VEGFR2 macropinocytosis. As a RhoG activator, SGEF regulates the process rather
      than performing the uptake.
    action: NEW
    reason: '[PMID:15133129 "Transient expression of SGEF stimulated fibroblast uptake of 10-kDa dextran,
      a marker of macropinocytosis. This required the full-length protein and a catalytically active DH
      domain."] [PMID:34849650 "ARHGEF26 is required for endothelial angiogenesis by promoting macropinocytosis
      of Vascular Endothelial Growth Factor Receptor 2 (VEGFR2) on cell membrane"] [PMID:15133129 "Together,
      this work establishes SGEF as a RhoG exchange factor and provides evidence that both SGEF and RhoG
      regulate membrane dynamics in promotion of macropinocytosis."]'
    supported_by:
    - reference_id: PMID:15133129
      supporting_text: Transient expression of SGEF stimulated fibroblast uptake of 10-kDa dextran, a
        marker of macropinocytosis. This required the full-length protein and a catalytically active DH
        domain.
    - reference_id: PMID:34849650
      supporting_text: ARHGEF26 is required for endothelial angiogenesis by promoting macropinocytosis
        of Vascular Endothelial Growth Factor Receptor 2 (VEGFR2) on cell membrane
    - reference_id: PMID:15133129
      supporting_text: Together, this work establishes SGEF as a RhoG exchange factor and provides evidence
        that both SGEF and RhoG regulate membrane dynamics in promotion of macropinocytosis.
