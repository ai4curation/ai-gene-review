- term:
    id: GO:0006661
    label: phosphatidylinositol biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028655
  review:
    summary: The broad phosphatidylinositol-biosynthesis assertion exceeds the established human pathway
      evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0006661 retains exact phosphoinositide-biosynthesis synonyms, but its definition names
      phosphatidylinositol and the ontology distinguishes phosphatidylinositol phosphate biosynthesis
      in GO:0046854. The latter and GO:0036092 have no is_a/part_of path to GO:0006661; missing ancestry
      alone is not proof of disjointness. More decisively, the established human core reaction removes
      the 5-phosphate from PI(3,5)P2 to form PI3P, not unphosphorylated PI. FIG4 also supports PIKFYVE
      activity, but neither observation establishes this broader PI-biosynthesis assertion. The rat donor
      substrate breadth retained elsewhere does not establish the human pathway-specific claim. Mark the
      incoming term as over-annotated while retaining the existing phosphatidylinositol-dephosphorylation
      annotations. ARBA:ARBA00028655 is an unvetted machine-learning association, assessed against the
      primary chemistry rather than treated as independent experimental support.
    supported_by:
    - reference_id: PMID:17556371
    - reference_id: PMID:33098764
    - reference_id: file:human/FIG4/FIG4-source-evidence.md
