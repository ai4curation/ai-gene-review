id: Q92562
gene_symbol: FIG4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FIG4 (SAC3) is a Sac-domain phosphatase that controls phosphoinositide interconversion in
  the endosomal system. In the PIKFYVE–FIG4–VAC14 (PAS) complex, it removes the 5-phosphate from phosphatidylinositol
  3,5-bisphosphate to generate phosphatidylinositol 3-phosphate. Biochemical studies of the human complex
  also show that FIG4 dephosphorylates PIKFYVE serines and promotes its lipid-kinase activity, coupling
  lipid turnover to synthesis. VAC14 supports complex assembly and FIG4 stability. Disruption of this
  system impairs endolysosomal homeostasis; biallelic FIG4 defects cause Charcot-Marie-Tooth disease type
  4J and Yunis-Varon syndrome.
