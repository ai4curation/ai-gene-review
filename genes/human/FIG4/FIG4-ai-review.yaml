  evidence_type: EXP
  original_reference_id: PMID:33098764
  qualifier: enables
  review:
    summary: FIG4 dephosphorylates PIKFYVE serines in the human PAS complex.
    action: ACCEPT
    reason: PMID:33098764 compares reconstituted human complexes containing wild-type FIG4 or catalytic
      mutant C486S. Mass spectrometry identifies FIG4-dependent loss of phosphorylation at PIKFYVE S48,
      S1669 and S2053, with S48/S2053 corroborated in complexes isolated from Expi293F cells. PIKFYVE
      S2053E reduces lipid-kinase activity. GO:0004722 explicitly includes protein serine phosphatase
      activity as a narrow synonym, so the demonstrated serine activity supports the existing term; they
      do not demonstrate a broad threonine-substrate repertoire or isolated-FIG4 peptide kinetics. The
      modified residues are on PIKFYVE, not FIG4.
