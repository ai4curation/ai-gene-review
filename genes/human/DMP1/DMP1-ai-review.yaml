id: Q13316
gene_symbol: DMP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DMP1 (dentin matrix acidic phosphoprotein 1) is a secreted, highly acidic, intrinsically disordered
  phosphoprotein of the SIBLING family (small integrin-binding ligand, N-linked glycoproteins), encoded in the SIBLING
  cluster on chromosome 4q21. It is expressed by odontoblasts, osteoblasts and above all by osteocytes, and is deposited
  in the mineralized extracellular matrix of bone and dentin, largely as proteolytically processed N-terminal (proteoglycan)
  and C-terminal phosphorylated fragments. Its serine-rich acidic domains are phosphorylated in the secretory pathway,
  notably by the Golgi casein kinase FAM20C, and bind calcium; in vitro the protein and its C-terminal fragment
  nucleate hydroxyapatite, while the intact phosphorylated protein and the N-terminal domain can inhibit crystal
  growth, so DMP1 is regarded as a matrix regulator of biomineralization. It also carries an RGD motif and engages
  alphaVbeta3 integrin. Loss of DMP1 in mice and humans causes defective osteocyte maturation, hypomineralized bone
  and dentin, and elevated osteocytic FGF23 expression with renal phosphate wasting (autosomal recessive hypophosphatemic
  rickets type 1), indicating that DMP1 is also required, by a still undefined mechanism, to restrain FGF23 production.
  A nuclear, transcriptional role in pre-osteoblasts has been proposed but is less firmly established.
