suggested_questions:
- question: 'By what molecular mechanism does DMP1 loss increase osteocytic FGF23 expression: a cell-autonomous
    signal from matrix-bound DMP1 (e.g. via alphaVbeta3 integrin), an effect of impaired osteocyte maturation, or
    altered local phosphate sensing?'
- question: Does DMP1 have a physiological nuclear transcriptional function in pre-osteoblasts in vivo, independent
    of its secreted matrix role?
- question: Is GO:0046848 hydroxyapatite binding a more accurate core molecular function than calcium ion binding
    for DMP1 and its C-terminal fragment?
suggested_experiments:
- description: Osteocyte-specific rescue of Dmp1-null mice with secretion-competent versus nucleus-targeted or RGD-mutant
    DMP1, measuring Fgf23 expression, serum phosphate and mineralization, to separate the matrix, integrin and nuclear
    contributions.
  experiment_type: in vivo structure-function rescue
