core_functions:
- description: Presynaptic trans-synaptic adhesion molecule. From the presynaptic membrane, NRXN2 LNS
    domains bind postsynaptic neuroligins, LRRTMs, latrophilin-1 and (alpha isoforms, via LNS1) IgSF21,
    forming trans-synaptic complexes that physically link the pre- and postsynaptic membranes; ligand
    choice is regulated by splice site 4 and Ca2+ binding.
