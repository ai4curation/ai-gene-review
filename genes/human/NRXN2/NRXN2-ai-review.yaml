  review:
    summary: ISS from mouse Nrxn2 (MGI IGI in alpha-neurexin multiple knockouts, PMID:12827191). Nrxn2
      deletion alters excitatory transmission in cortex and hippocampus.
    action: KEEP_AS_NON_CORE
    reason: 'True but broad. NRXN2 influences transmission by modulating presynaptic release properties
      and synapse number and, via trans-synaptic partners, postsynaptic receptor responses. Notably the
      direction is circuit-dependent: Nrxn2-alpha knockout reduces spontaneous excitatory release in neocortex,
      whereas neuron-specific Nrxn2 deletion increases CA3-CA1 transmission and release probability. The
      more specific presynaptic modulation of chemical synaptic transmission (proposed as NEW) is used
      as the core process; this parent is retained as non-core.'
    supported_by:
    - &id012
      reference_id: PMID:12827191
      supporting_text: Using triple-knockout mice, we show that alpha-neurexins are not required for synapse
        formation, but are essential for Ca2+-triggered neurotransmitter release.
    - &id014
      reference_id: PMID:25745399
      supporting_text: Using patch-clamp recordings in Nrxn2α knockout brains, we observe reduced spontaneous
        transmitter release at excitatory synapses in the neocortex.
    - &id015
      reference_id: PMID:36608123
      supporting_text: Unexpectedly, we find that in the hippocampus, the loss of Nrxn2 causes an increase
        both in the number of excitatory synapses and in the presynaptic release probability, suggesting
        a function in restricting synapse assembly.
