- term:
    id: GO:0099171
    label: presynaptic modulation of chemical synaptic transmission
  evidence_type: ISS
  original_reference_id: PMID:36608123
  review:
    summary: 'Loss of neurexin-2 changes presynaptic release properties at excitatory synapses: neuron-specific
      Nrxn2 deletion increases release probability at hippocampal CA3-CA1 synapses, and Nrxn2-alpha knockout
      reduces spontaneous excitatory release in neocortex.'
    action: NEW
    reason: 'NRXN2-specific biology that the existing rows do not capture. NRXN2 acts in the presynaptic
      membrane to set release properties (participation: the protein itself resides in and organizes the
      presynaptic release site, as the alpha-neurexin Ca2+ channel-coupling work shows), but for NRXN2
      the sign of the effect depends on the circuit - it restrains release probability and synapse number
      at hippocampal CA3-CA1 synapses yet supports spontaneous release in neocortex. A direction-neutral
      modulation term fits better than the neurotransmitter secretion row. Comparator check: SynGO annotates
      mouse Nrxn2 (from this study) and mouse Nrxn3 to GO:0099171, so the term is used for neurexins in
      their presynaptic role. Evidence is from mouse (ISS). Caveat recorded in the notes: the source paper''s
      2025 expression of concern was lifted in 2026, but a companion PNAS paper from the same group was
      retracted, and the paper disputes the Nrxn2 mouse line used by Born et al.'
    supported_by:
    - *id015
    - reference_id: PMID:36608123
      supporting_text: Parallel measurements of inhibitory postsynaptic currents (IPSCs) did not uncover
        any change in the synaptic strength or the presynaptic release probability of inhibitory synapses
