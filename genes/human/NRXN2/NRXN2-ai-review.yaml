suggested_questions:
- question: How does NRXN2, which binds the same neuroligins and LRRTMs as NRXN1 and NRXN3, restrict excitatory
    synapse assembly in hippocampus while supporting release in neocortex? Does the anti-synaptogenic
    effect depend on a specific ligand, splice isoform, or glial NRXN2 expression?
- question: The hippocampal restriction phenotype comes from one laboratory, whose companion PNAS paper
    was retracted and which disputes the Nrxn2 line used in an earlier study; has it been independently
    replicated with separately generated Nrxn2 alleles?
- question: Should GO:0099545 trans-synaptic signaling by trans-synaptic complex be applied consistently
    to neurexins and their postsynaptic partners (NLGNs, LRRTMs, IGSF21)?
- question: Behaviour annotations (vocal learning, vocalization) for NRXN2 derive from language delay
    in one carrier parent; is there a curation convention for when family phenotypes justify behaviour-process
    IMP annotations for a synaptic organizer?
suggested_experiments:
- hypothesis: Human NRXN2-alpha binds human IGSF21 through LNS1 and mediates cell-cell adhesion with IGSF21-,
    NLGN1- and LRRTM2-expressing cells.
  description: Cell aggregation and surface-binding assays with human NRXN2-alpha (SS4+ and SS4-), LNS1
    interface mutants and LNS6 Ca2+-site mutants against cells expressing human IGSF21, NLGN1 and LRRTM2.
  experiment_type: cell aggregation assay
- hypothesis: NRXN2 restricts excitatory synapse number in human neurons as it does in mouse hippocampus.
  description: Isogenic human iPSC-derived cortical and hippocampal-like neurons with NRXN2 deletion versus
    NRXN1 deletion; quantify excitatory and inhibitory synapse density, release probability and mEPSC
    frequency.
  experiment_type: electrophysiology in iPSC-derived neurons
