  review:
    summary: Neurexin-2 on one cell binds latrophilin-1, neuroligins or IgSF21 on an apposed cell and
      holds the two together; NRXN2 is the presynaptic half of these trans-synaptic adhesion bridges.
    action: NEW
    reason: 'Same activity and reasoning as the NEW row in the NRXN1 review, here with neurexin-2-specific
      data. Participation: NRXN2 is itself one half of the adhesive bond - neurexin-2-beta-expressing
      cells form aggregates with latrophilin-1-expressing cells in an SS4-dependent manner, a neurexin-2-beta
      Ca2+-site mutant abolishes neuroligin-1-mediated cell adhesion, and postsynaptic IgSF21 recruits
      axonal neurexin-2-alpha in trans. Comparator check: other synaptic adhesion molecules in the same
      role (CLSTN1, contactins, CD200) carry this term, and the neurexin trans-synaptic adhesion module
      uses it for the neurexin hub. The existing cell adhesion molecule binding and neuroligin family
      protein binding rows describe the partner, not the adhesive activity. Evidence is from rodent neurexin-2
      (ISS).'
