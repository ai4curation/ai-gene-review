id: Q9P2S2
gene_symbol: NRXN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Neurexin-2 (NRXN2) is a neuron-specific, presynaptic single-pass type I membrane protein
  of the neurexin family that organizes synapses through trans-synaptic adhesion complexes. Like its paralogs
  NRXN1 and NRXN3, the gene uses two promoters: the upstream promoter produces the long neurexin-2-alpha
  isoforms described by this entry, with six laminin/neurexin/sex-hormone-binding globulin (LNS) domains
  interspersed with three EGF-like repeats, and an internal promoter produces short neurexin-2-beta isoforms
  (separate UniProt entry P58401) that carry only the sixth LNS domain; both share a heparan-sulfate-modified
  stalk, a transmembrane helix and a short cytoplasmic tail ending in a PDZ-binding motif. NRXN2 lacks
  the sixth alternatively spliced segment present in NRXN1 and NRXN3, and splice site 4 in LNS6 regulates
  partner choice. Through Ca2+-dependent binding of LNS6, NRXN2 binds postsynaptic neuroligins, LRRTMs
  and latrophilin-1, and alpha isoforms bind dystroglycan through LNS2; neurexin-2-alpha is also the selective
  presynaptic receptor, via LNS1, for the postsynaptic immunoglobulin-superfamily protein IgSF21, which
  uses it to induce GABAergic presynaptic differentiation at dendritic inhibitory synapses. Presented
  to dendrites, neurexin-2-alpha clusters glutamatergic and GABAergic postsynaptic components. In vivo
  its role is circuit-dependent: combined alpha-neurexin deletion impairs Ca2+-triggered release, Nrxn2-alpha
  loss reduces spontaneous excitatory release in neocortex, whereas neuronal Nrxn2 deletion in hippocampus
  increases excitatory synapse density and release probability, suggesting that NRXN2 can restrain excitatory
  synapse assembly; overexpressed neurexin-2-beta suppresses GABAergic transmission without changing synapse
  numbers. Loss of Nrxn2 in mice causes anxiety-like behaviour, social deficits, behavioural inflexibility
  and, after cortical/hippocampal deletion, spontaneous seizures. Rare truncating variants and deletions
  of NRXN2 have been found in individuals with autism and other neurodevelopmental disorders.'
