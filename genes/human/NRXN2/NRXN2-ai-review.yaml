- term:
    id: GO:0007416
    label: synapse assembly
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:E9Q7X7
  review:
    summary: ISS from mouse Nrxn2 (MGI IGI from alpha-neurexin knockouts, PMID:12827191). NRXN2 both promotes
      and restricts synapse assembly depending on synapse type.
    action: KEEP_AS_NON_CORE
    reason: NRXN2 participates in synapse assembly, but its contribution is bidirectional and context-dependent,
      more so than for NRXN1. It acts as a pro-synaptogenic organizer in gain-of-function assays (neurexin-2-alpha
      clusters postsynaptic components; IgSF21 induces inhibitory presynaptic differentiation only through
      neurexin-2-alpha). In vivo, however, neuron-specific Nrxn2 deletion nearly doubles excitatory CA1
      synapse density, i.e. NRXN2 restricts excitatory synapse assembly there, while neocortical synapse
      densities are unchanged in Nrxn2-alpha knockouts and alpha-neurexins as a class are not required
      for forming most synapses. The source IGI is from combined alpha-neurexin deletions, which showed
      no requirement for synapse formation. Retained as genuine but non-core.
    supported_by:
    - *id002
    - *id009
    - &id029
      reference_id: PMID:36608123
      supporting_text: Here we show that Nrxn2, different from Nrxn1 and Nrxn3, functions to restrict,
        instead of enabling, synapse assembly in the hippocampus.
    - reference_id: PMID:25745399
      supporting_text: Inhibitory transmission as well as synapse densities and ultrastructure remain
        unchanged in the neocortex of both models.
    - *id012
    - reference_id: file:human/NRXN2/NRXN2-deep-research-falcon.md
      supporting_text: 'This restrictive function persists throughout life: hippocampal NRXN2 deletion
