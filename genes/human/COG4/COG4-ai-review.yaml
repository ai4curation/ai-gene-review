    label: retrograde transport, vesicle recycling within Golgi
  evidence_type: IMP
  original_reference_id: PMID:27066481
  qualifier: involved_in
  review:
    summary: Human COG4 supports retrograde trafficking within the Golgi.
    action: ACCEPT
    reason: COG4 knockout is included in the human HEK293T panel, with defective Golgi
      architecture and glycosylation rescued by replacement subunit. The paper measures
      retrograde toxin trafficking at pathway level; altered toxin binding limits
      some probes, and SubAB passage is an integrated endosome/Golgi/ER assay. The
      specific intra-Golgi role is supported by COG4-mediated organization of the
      Sly1/STX5 machinery, rather than by attributing glycosyltransferase chemistry
      to COG4.
    supported_by:
    - reference_id: PMID:27066481
    - reference_id: PMID:19536132
