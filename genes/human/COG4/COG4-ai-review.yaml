- id: PMID:19494034
  title: Golgi function and dysfunction in the first COG4-deficient CDG type II patient.
  findings:
  - statement: Patient fibroblasts with p.R729W and a deletion have reduced COG4,
      altered Golgi architecture and delayed retrograde trafficking, yet retain complex
      formation. Fractionation supports a major cytosolic subcomplex pool and a membrane-associated
      pool. Overexpression also perturbs trafficking, complicating rescue.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full patient/fractionation/transport Methods, Results
      and Discussion were read. Variant coordinates are those reported in this original
      paper.
- id: PMID:19651599
  title: Structural basis for a human glycosylation disorder caused by mutation of
    the COG4 gene.
  findings:
  - statement: A human COG4 C-terminal structure and HeLa experiments implicate the
      distal domain in normal glycosylation without making it necessary for incorporation
      into the COG complex. This is structural/assembly context, not intrinsic glycosyltransferase
      activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete selected normal abstract read, plus original PubMed figure
      legends. Full Methods/Results recovery attempts did not succeed; no full-body
      access is claimed.
- id: PMID:30290151
  title: A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome,
    Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation.
  findings:
  - statement: A recurrent de novo substitution causes Saul-Wilson syndrome with altered
      fibroblast trafficking and decorin glycosylation, distinct from biallelic COG4
      deficiency. The paper reports p.Gly516Arg; these original coordinates are not
      silently equated to the selected UniProt product.
  reference_review:
    relevance: MEDIUM
