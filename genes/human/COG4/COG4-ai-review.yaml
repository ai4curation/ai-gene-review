suggested_questions:
- question: How do the short Cog4S and N-terminally truncated COG4 products differ
    in complex incorporation and Sly1/STX5 coordination?
- question: How is COG4-mediated Sly1 recruitment coupled to SNARE assembly during
    an individual tethering/fusion event?
suggested_experiments:
- description: Compare sequence-verified COG4 products at matched expression levels
    in COG4-deficient human cells, measuring complex incorporation, Sly1/STX5 association
    and retrograde cargo transport rather than glycan phenotypes alone.
  hypothesis: Product-specific loss of interaction regions uncouples complex assembly
    from Sly1-dependent trafficking.
