id: Q9H9E3
gene_symbol: COG4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COG4 is a noncatalytic subunit of the eight-subunit conserved oligomeric
  Golgi tethering complex. It helps assemble the complex and coordinates the Sec1/Munc18
  protein SCFD1/Sly1 with the Golgi SNARE syntaxin 5 through distinct binding surfaces.
  These interactions support retrograde trafficking and maintenance of Golgi architecture,
  enabling the correct distribution of glycosylation machinery. COG4 occupies both
  cytosolic and peripheral Golgi-membrane pools. Biallelic loss-of-function variants
  cause a congenital disorder of glycosylation, whereas a recurrent dominant variant
  causes Saul-Wilson syndrome with a different trafficking disturbance.
