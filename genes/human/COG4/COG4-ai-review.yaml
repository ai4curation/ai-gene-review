core_functions:
- description: Acts as an integral scaffold of the COG tethering complex, organizing
    COG-subunit contacts and coordinating Sly1 with syntaxin 5 to support Golgi retrograde
    trafficking and architecture. Human full-length and N-terminal constructs establish
    the recruitment mechanism; equivalent activity of the 337-residue Cog4S and N-terminally
    shortened 712-residue product has not been demonstrated.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
