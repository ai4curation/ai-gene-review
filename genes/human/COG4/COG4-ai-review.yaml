- id: PMID:15047703
  title: The binary interacting network of the conserved oligomeric Golgi tethering
    complex.
  findings:
  - statement: Human COG4 forms positive contacts with COG1, COG2, COG5 and COG7 in
      reticulocyte-lysate co-translation/co-immunoprecipitation; the assembly analysis
      supports its scaffold role. Direct binary affinity was not measured with purified
      proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The selected exact-main cache is a complete abstract. Original author-uploaded
      indexed full Methods, Table I and Results were read externally; all constructs
      are human. No source-cache replacement was made.
- id: PMID:19536132
  title: Direct interaction between the COG complex and the SM protein, Sly1, is required
    for Golgi SNARE pairing.
  findings:
  - statement: COG4 brings the COG complex into contact with SCFD1/Sly1 and has a
      separate STX5-binding surface. Purified human COG4 (1–231) binds rat rSly1;
      endogenous HeLa assays support the human association. Binding-selective mutants
      distinguish recruitment from complex incorporation and link the activity to
      retrograde trafficking.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal abstract is unchanged. Original full PMC
      Methods/Results/Discussion were recovered externally and read; the independent
      consultation additionally inspected the original S7 simultaneous-binding experiment.
      Human constructs, rat rSly1 and endogenous human association are distinguished.
- id: PMID:27066481
  title: 'COG Complex Complexities: Detailed Characterization of a Complete Set of
    HEK293T Cells Lacking Individual COG Subunits.'
  findings:
  - statement: Human HEK293T COG4 knockout alters Golgi ultrastructure, subunit stability
      and glycan processing. Replacement COG4 localizes to the Golgi and reverses
      glycosylation defects. Pathway-level toxin assays support retrograde traffic
      while receptor-binding changes limit some probes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results, assay descriptions and figure
      legends were read. No additional image-pixel or all-subunit-equivalence claim
