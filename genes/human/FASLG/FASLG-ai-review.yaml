id: P48023
gene_symbol: FASLG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FASLG (Fas ligand, CD95L, TNFSF6) is a type II transmembrane TNF-family cytokine. Its trimeric
  extracellular TNF-homology domain binds the FAS/CD95 death receptor on neighboring cells to assemble
  a FADD- and initiator-caspase-containing DISC and trigger extrinsic apoptotic signaling during immune
  homeostasis, cytotoxic lymphocyte killing, activation-induced T-cell death, and peripheral tolerance.
  The membrane precursor traffics through secretory lysosomes to the cell surface, can be shed to a soluble
  receptor-binding ectodomain, and can be further cleaved by ADAM10 and SPPL2A to liberate a nuclear FasL
  intracellular domain with transcriptional effects.'
