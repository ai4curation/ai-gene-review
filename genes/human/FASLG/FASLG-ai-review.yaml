suggested_questions:
- question: Should Reactome-to-GOA export filter FASLG out of downstream CFLAR:CASP8 and FASLG 
    transcription events so that extracellular-region annotations are sourced only to reactions that
    actually contain the FASLG protein?
- question: Should recurring IntAct imports of FASLG cytoplasmic-tail trafficking interactions 
    remain uncurated at GO:0005515, or should GO add a FasL-tail adaptor-binding activity only if 
    that activity can be defined more precisely than generic SH3/proline-rich binding?
suggested_experiments:
- description: For individual FASLG cytoplasmic-tail interactors from SH3, HuRI, BioPlex, and U2OS 
    cell-map datasets, test endogenous binding in cytotoxic lymphocytes and quantify effects on 
    secretory-lysosome storage, immunological-synapse delivery, FASLG shedding, and FAS-dependent 
    target-cell apoptosis before making partner-specific GO annotations.
