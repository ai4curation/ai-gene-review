    supporting_text: The N terminus of FAP44 binds the fα motor through a pair of β-propellers
  - reference_id: PMID:39743588
    supporting_text: the β-propeller domains of the T/TH subunit, CFAP44, engage the motor
      domain of IDAa (DNAH12)
  - reference_id: PMID:29514928
    supporting_text: suggesting that FAP44 is required for the stable assembly of the T/TH
      complex in Chlamydomonas
  - reference_id: PMID:29449551
    supporting_text: the observed structural flagellum defects were associated with severe
      motility deficiencies
suggested_questions:
- question: Can the proteolytic activity reported for CFAP44 fragments be reproduced
    with purified full-length protein, and is it lost on mutating any candidate catalytic
    residue? If not, should the peptidase annotations and the PAINT node be withdrawn?
  experts: []
- question: Why do Cfap44 knockout mouse sperm retain a 9+2 axoneme in most sections
    while patient sperm mostly lack the central pair? Does this reflect species differences
    in T/TH redundancy, or differences between the alleles?
  experts: []
- question: Does CFAP44 loss alter ciliary beat frequency or waveform in human respiratory
    cilia, given that the protein is present in the respiratory axoneme structure?
  experts: []
suggested_experiments:
- description: Express and purify full-length human CFAP44 and the reported central-region
    fragment, and test proteolysis of tubulin and FtsZ with protease-inhibitor and heat-inactivation
    controls. Use mass spectrometry to rule out co-purifying proteases.
  experiment_type: in vitro biochemistry
- description: Use cryo-electron tomography of axonemes from CFAP44-mutant patient airway
    cultures and sperm to test whether the T/TH density and inner dynein arm f positioning
    are lost, and pair this with high-speed video analysis of ciliary waveform and beat
    frequency.
  experiment_type: cryo-electron tomography
