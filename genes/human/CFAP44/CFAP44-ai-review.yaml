  review:
    summary: Proposed molecular function capturing the structural role of CFAP44 as a subunit
      of the axonemal tether/tether-head complex.
    action: NEW
    reason: The current annotation set has no informative molecular function for CFAP44;
      its only MF rows are generic protein binding and an unverified peptidase activity.
      The orthologue data show that CFAP44 itself supplies part of an axonemal structure.
      In Chlamydomonas, the fap44 mutant loses the entire T/TH complex (PMID:29514928). The
      FAP44 beta-propellers bind the inner dynein arm f motor (PMID:37258679), and the bovine
      model places the same propellers on an inner-arm motor domain (PMID:39743588). Human
      CFAP44 is modelled in the human respiratory doublet structure 8J07. This is a function
      the protein performs, contributing to the structural integrity of the axoneme, not
      a downstream requirement. The term is consistent with the core-function MF used for
      the partner subunit CFAP43 in its review. The evidence is from orthologues plus the
      human structural model, hence ISS.
    supported_by:
