gene_symbol: CFAP44
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP44 (also called WDR52) is a large axonemal protein with an N-terminal
  WD40/beta-propeller region and an extended C-terminal helical region. Together with the
  related protein CFAP43 it forms the tether/tether-head (T/TH) complex, which binds the
  motor domain of inner dynein arm f (I1) and docks onto the doublet microtubule of motile
  cilia and flagella; the complex is present in human respiratory axonemes as well as in
  sperm flagella. Loss of the protein destabilizes the T/TH complex and alters ciliary
  waveform in protists, and in mammals causes male infertility with multiple morphological
  abnormalities of the sperm flagellum (MMAF), with disorganized axonemal and peri-axonemal
  structures, absent or displaced central pair microtubules and severely reduced sperm
  motility. CFAP44 has no recognized catalytic domain.
