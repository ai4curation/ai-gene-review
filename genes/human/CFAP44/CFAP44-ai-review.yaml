core_functions:
- description: CFAP44 is a non-catalytic structural subunit of the axonemal tether/tether-head
    complex, built with CFAP43. Its N-terminal beta-propellers engage the motor domain
    of inner dynein arm f, and its C-terminal helices dock onto the doublet microtubule.
    This anchors and stabilizes the I1 dynein motor and supports coordinated inner-arm
    activity during beating. In the sperm flagellum this structural contribution is needed
    for an organized axoneme, central pair and peri-axonemal structures, and for progressive
    motility.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
