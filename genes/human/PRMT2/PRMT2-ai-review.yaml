core_functions:
- description: PRMT2 is a type-I arginine methyltransferase and ligand-dependent nuclear-receptor
    coregulator whose established direct roles are weak protein-arginine methyltransferase activity
    and modulation of nuclear-receptor and NF-kappaB transcriptional outputs.
  molecular_function:
    id: GO:0016274
    label: protein-arginine N-methyltransferase activity
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id007
  - *id008
suggested_questions:
- question: What are the endogenous human PRMT2 substrates, and is PRMT2 histone H4
    methyltransferase activity physiologically significant despite its weak in vitro turnover?
suggested_experiments:
- description: Profile PRMT2-dependent methylarginine changes after PRMT2 knockout/rescue in a
    nuclear-receptor-responsive human cell model to identify endogenous substrates and test H4
    methylation in vivo.
