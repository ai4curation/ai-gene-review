  label: Homo sapiens
description: 'MYH2 encodes myosin-2, the fast type IIa skeletal muscle myosin heavy chain (MyHC-IIa, MyHC-2a), a
  class II sarcomeric myosin and the major myosin heavy chain of fast, oxidative type 2A fibres of adult human
  skeletal muscle. It is not a cardiac isoform. Two heavy chains dimerize through a long alpha-helical coiled-coil
  rod and each binds an essential and a regulatory light chain at the IQ-containing lever arm, forming the hexameric
  muscle myosin molecule. The N-terminal motor domain is an actin-activated Mg-ATPase: it binds ATP at a P-loop pocket
  and F-actin through conserved actin-binding loops, and couples ATP hydrolysis to a lever-arm power stroke that
  slides thin filaments toward the sarcomere centre. Recombinant human MyHC-IIa has actin-activated ATPase and actin
  motility rates slower than the IId (IIx) and IIb isoforms, matching the intermediate shortening velocity of
  type 2A fibres, which contract faster than slow type 1 fibres and more slowly than type 2X fibres. The rod, particularly the light meromyosin segment with its
  28-residue charge repeats, packs into the bipolar thick filaments of the A band, on which the heads can fold back
  into a sequestered, energy-sparing super-relaxed state. Dominant variants in the motor domain (notably E706K in the
  SH1 helix) and in the rod, and recessive missense or truncating variants that abolish MyHC-IIa expression, cause
  MYH2-related congenital myopathy with external ophthalmoplegia; light meromyosin variants disrupt coiled-coil and
  filament packing and reduce the super-relaxed state in patient fibres.'
