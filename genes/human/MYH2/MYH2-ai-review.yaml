  review:
    summary: Microfilament motor activity (IBA) is the defining activity of the class II myosin heavy chain clade,
      which MYH2 sits squarely within.
    action: ACCEPT
    reason: MYH2 encodes the fast type IIa class II myosin heavy chain. Its N-terminal motor domain is an actin-activated
      Mg-ATPase that converts ATP hydrolysis into force and filament sliding. Recombinant human MyHC-IIa expressed
      in muscle cells has measurable actin-activated ATPase activity and moves actin filaments in motility assays,
      and patient fibres carrying the motor-domain variant E706K show severely impaired IIa motor function. Microfilament
      motor activity is the defining core activity.
    supported_by:
    - reference_id: file:human/MYH2/MYH2-uniprot.txt
      supporting_text: Myosins are actin-based motor molecules with ATPase activity essential for muscle contraction.
    - reference_id: PMID:20080549
      supporting_text: In this study we describe a mammalian muscle cell expression system and the functional analysis
        of all six recombinant human type II skeletal muscle myosin isoforms.
    - reference_id: PMID:20080549
      supporting_text: 'MyHC-IIb displays the highest maximal actin-activated ATPase rate, and the rates for the
        adult-fast isoforms follow the order from fastest to slowest: MyHC-IIb > MyHC-IId > MyHC-IIa'
    - reference_id: PMID:17005402
      supporting_text: A dramatic impairment in the function of the IIa MyHC isoform was observed at the motor protein
        level.
