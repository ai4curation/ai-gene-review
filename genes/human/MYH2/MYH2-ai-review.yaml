suggested_questions:
- question: Should the cell-cell junction annotation from PMID:25753039, which describes endothelial non-muscle myosin
    IIA, be transferred from MYH2 to MYH9? The shared name 'myosin IIA/IIa' appears to have caused the mis-mapping,
    and the same check may be worth running on other annotations citing 'myosin IIA'.
  experts:
  - GOA curators
- question: GO has no term for the regulated sequestration of myosin heads in the interacting-heads motif / super-relaxed
    state. MYH2 light meromyosin variants reduce this state in patient type IIA fibres without lowering force. Should
    a term be created so that this property of skeletal as well as cardiac class II myosins can be annotated?
  experts:
  - GO editors
  - muscle myosin biophysicists
- question: Why does loss of MyHC-IIa, an isoform of limb type 2A fibres, so consistently produce external ophthalmoplegia?
    Which extraocular muscle fibre populations depend on MyHC-IIa, and is the effect developmental or contractile?
  experts:
  - neuromuscular geneticists
  - extraocular muscle physiologists
suggested_experiments:
- description: Express full-length human MYH2 carrying E706K, S2 rod and LMM variants in human myotubes and measure
    thick-filament incorporation, mant-ATP single-turnover (super-relaxed state fraction) and in vitro motility of the
    purified mutant myosin, compared with wild type.
  hypothesis: Motor-domain variants impair the power stroke, whereas rod variants act mainly by disrupting filament
    packing and head sequestration, raising basal ATP turnover.
  experiment_type: cell-based assembly assays and biochemistry of recombinant myosin
- description: Characterize MyHC isoform composition and contractile properties of single extraocular muscle fibres
    from patients with recessive MYH2 null variants and from controls.
  hypothesis: A population of extraocular fibres relies on MyHC-IIa and cannot compensate with other isoforms.
  experiment_type: single-fibre proteomics and mechanics
