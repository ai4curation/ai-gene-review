    reason: "MTRNR2L7 is known only as a transcript (UniProt protein existence level 2); no peptide from
      this locus has been detected in any compartment, by mass spectrometry or otherwise. UniProt's Secreted
      and Cytoplasm lines for P0CJ74 are themselves ECO:0000250 by-similarity statements transferred from
      humanin (file:human/MTRNR2L7/MTRNR2L7-uniprot.txt), so both the ISS row (donor UniProtKB:Q8IVG9)
      and the subcellular-location IEA row state the same humanin claim, once directly and once via the
      controlled-vocabulary mapping. Secretion of humanin is not a generic property of the sequence: it
      depends on Leu9-Leu11 and on Pro19-Val20 [PMID:35372353], and Bodzioch et al. proposed on the alignment
      that position 19 is what decides whether a nuclear isoform is secreted at all [PMID:19477263]. In
      MTRNR2L7, Leu9-Leu11 is intact but Pro19 is replaced by serine, altering one of the two humanin
      secretion segments. Because the asserted location depends on secretion determinants that are altered
      in this peptide, the row is not merely unverified but positively doubtful, and I remove it."
