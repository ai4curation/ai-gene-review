id: Q7Z698
gene_symbol: SPRED2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SPRED2 (Sprouty-related, EVH1 domain-containing protein 2) is a non-catalytic intracellular
  negative regulator of receptor tyrosine kinase-Ras-ERK signalling. It has an N-terminal EVH1 (WH1) domain,
  a central c-Kit-binding domain (KBD) and a C-terminal cysteine-rich Sprouty-related (SPR) domain that
  mediates membrane association and SPRED homo-/heterodimerization. SPRED2 acts at the cytoplasmic face
  of the plasma membrane: its EVH1 domain binds the GAP-related region of neurofibromin (NF1) and relocates
  this Ras GTPase-activating protein from the cytosol to the membrane, so that Ras-GTP is converted to
  inactive Ras-GDP. Consistently, SPRED2 lowers growth-factor-induced Ras-GTP, fails to block oncogenic
  RasV12, and dampens RAF1, MEK and ERK1/2 activation downstream of EGF, FGF and other stimuli. Additional
  reported mechanisms include an EVH1-dependent interaction with NBR1 that routes activated FGF receptors
  to lysosomal degradation, and SPR-domain binding to the kinase DYRK1A, inhibiting its phosphorylation
  of substrates such as Tau and STAT3. SPRED2 is also found in the cytoplasm and on vesicles (Rab11/Rab5a-positive
  and secretory vesicles). Biallelic loss-of-function variants cause an autosomal recessive Noonan syndrome-like
  RASopathy with increased and prolonged MAPK activation in patient cells.'
