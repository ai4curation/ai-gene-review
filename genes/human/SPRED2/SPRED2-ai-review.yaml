  review:
    summary: Binding to the stem cell factor receptor c-Kit, transferred from mouse SPRED orthologs.
    action: KEEP_AS_NON_CORE
    reason: SPRED proteins carry a central c-Kit-binding domain (KBD) and mouse Spred1/Spred2 were identified
      as substrates of activated c-Kit; human SPRED2 conserves the KBD. The interaction is plausible but
      in the human protein the KBD is dispensable for ERK inhibition, so this is a non-core binding activity.
    supported_by:
    - reference_id: PMID:15683364
      supporting_text: Both mSpred-1 and mSpred-2 are tyrosine phosphorylated by a constitutively active
        mutant of the c-kit receptor
