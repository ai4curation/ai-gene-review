- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19822672
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14596
  review:
    summary: Yeast two-hybrid and co-IP show that the SPRED2 EVH1 domain binds the late-endosomal/autophagy
      receptor NBR1; the interaction is needed for SPRED2 attenuation of FGF-ERK signalling via lysosomal
      routing of activated FGFR.
    action: REMOVE
    reason: 'Removal does not mean the interaction is false: this is a well-characterised, functionally
      validated interaction (full text read), but GO has no informative MF term for binding NBR1 and bare
      ''protein binding'' carries no functional information. It is also secondary because the NBR1 arm
      (receptor trafficking) is a secondary mechanism relative to NF1 recruitment, and the biological
      consequence is captured by the NEW negative regulation of FGFR signalling annotation.'
    supported_by:
    - reference_id: PMID:19822672
      supporting_text: Spred2 interacts and colocalizes with NBR1 in an EVH1 domain–dependent manner in
        vivo
    - reference_id: PMID:19822672
      supporting_text: Attenuation of FGF signaling by Spred2 is dependent on the interaction with NBR1
        and is achieved by redirecting the trafficking of activated receptors to the lysosomal degradation
        pathway
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24705354
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8IUH5
  review:
    summary: High-throughput interaction of SPRED2 with the palmitoyl acyltransferase ZDHHC17 (HIP14 interactor
      screen).
    action: REMOVE
    reason: Removal does not mean the interaction is false. Recurrently detected interaction (ZDHHC17
      binds Sprouty/SPRED proteins through its ankyrin repeats, and UniProt records a possible ZDHHC13/ZDHHC17
      interaction by similarity). It is biologically plausible as an enzyme-substrate recognition step
      for the palmitoylation that anchors SPRED proteins to membranes, but it is not part of SPRED2's
      own activity, the screen supports no more informative MF for SPRED2, and 'protein binding' is uninformative.
