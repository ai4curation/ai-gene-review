- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:34626534
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21359
  review:
    summary: SPRED2 co-immunoprecipitates neurofibromin (NF1), the Ras GTPase-activating protein, and
      recruits the NF1 GAP-related domain to the plasma membrane; EVH1-domain disease variants lose this
      binding.
    action: MODIFY
    reason: The interaction is central to SPRED2 function (it is how SPRED2 inhibits Ras-ERK signalling)
      and is corroborated independently by Stowe et al. 2012. 'protein binding' is uninformative; NF1
      is a Ras GAP, so GTPase activating protein binding (GO:0032794) captures the interaction informatively.
      The functional consequence (membrane recruitment of the GAP) is captured separately as a NEW molecular
      adaptor activity annotation.
    proposed_replacement_terms:
    - id: GO:0032794
      label: GTPase activating protein binding
    additional_reference_ids:
    - PMID:22751498
    supported_by:
    - reference_id: PMID:34626534
      supporting_text: pathogenic SPRED2 variants can affect protein stability, causing accelerated degradation,
        but can also affect proper targeting of SPRED2 to the plasma membrane or impair its binding to
        neurofibromin
    - reference_id: PMID:22751498
      supporting_text: We also found that the two other Spred1 family members, Spred2 and Spred3, could
        associate with neurofibromin
    - reference_id: PMID:22751498
      supporting_text: However, Sprouty proteins, which lack the N-terminal EVH1 domain, did not coprecipitate
        neurofibromin.
