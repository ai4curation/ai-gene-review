  review:
    summary: SPRED2 decreases growth-factor-induced Ras-GTP levels and acts upstream of Ras, by recruiting
      the Ras GAP neurofibromin to the membrane.
    action: NEW
    reason: 'Participation test: SPRED2 contributes part of the work of switching Ras off, by binding
      neurofibromin through its EVH1 domain and positioning it at the plasma membrane where Ras-GTP resides
      (adaptor/cofactor case), not merely by being required. Comparator check: the paralog SPRY2 carries
      GO:0046580 (IBA) and SPRY4 has it as a core process; SPRED2 lacks it only via general parent terms.
      Direct human-protein evidence: SPRED2 lowers Ras-GTP and cannot block RasV12-driven ERK activation.'
    additional_reference_ids:
    - PMID:22751498
    - PMID:34626534
    supported_by:
    - reference_id: PMID:15683364
      supporting_text: induction of either Spred-1 or Spred-2 decreased the proportion of both Ras and
        Rap1 that was in its GTP-bound form following EGF stimulation
    - reference_id: PMID:15683364
      supporting_text: neither Spred-1 nor Spred-2 was able to interfere with the strong ERK activation
        induced by RasV12, suggesting their mode of action was upstream of Ras
    - reference_id: PMID:22751498
      supporting_text: The ectopic expression of Spred2 also led to a significant redistribution of neurofibromin
        from the cytoplasm to the membrane fraction
- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:22751498
  review:
    summary: SPRED2 binds neurofibromin via its N-terminal EVH1 domain and, through its membrane-anchored
      C-terminal SPR domain, relocates neurofibromin from the cytoplasm to the plasma membrane.
    action: NEW
    reason: 'Ectopic SPRED2 redistributes neurofibromin to the membrane fraction; SPRED1/SPRED2 knockdown
      depletes membrane-associated neurofibromin; wild-type SPRED2 recruits the NF1 GAP-related domain
      to the plasma membrane while an EVH1 variant that still reaches the membrane does not. This is an
      adaptor (recruitment) activity: SPRED2 has no catalytic activity of its own, and the Ras GAP catalysis
      is performed by neurofibromin. Sprouty proteins, lacking the EVH1 domain, do not bind neurofibromin,
      so this MF distinguishes SPREDs from Sprouty. The specific child term protein-membrane adaptor
      activity is used because the recruitment brings neurofibromin to the plasma membrane, matching
      the SPRED1 review.'
    additional_reference_ids:
    - PMID:34626534
    supported_by:
    - reference_id: PMID:22751498
      supporting_text: We also found that the two other Spred1 family members, Spred2 and Spred3, could
        associate with neurofibromin
    - reference_id: PMID:22751498
      supporting_text: The ectopic expression of Spred2 also led to a significant redistribution of neurofibromin
        from the cytoplasm to the membrane fraction
    - reference_id: PMID:22751498
      supporting_text: the siRNA knockdown of both Spred1 and Spred2 in PC3 cells led to a significant
        reduction of endogenous neurofibromin in the membrane fraction
    - reference_id: PMID:34626534
      supporting_text: pathogenic SPRED2 variants can affect protein stability, causing accelerated degradation,
        but can also affect proper targeting of SPRED2 to the plasma membrane or impair its binding to
        neurofibromin
    - reference_id: PMID:22751498
      supporting_text: However, Sprouty proteins, which lack the N-terminal EVH1 domain, did not coprecipitate
        neurofibromin.
