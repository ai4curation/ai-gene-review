core_functions:
- description: 'Membrane recruitment of the Ras GAP neurofibromin: the SPRED2 EVH1 domain binds the NF1
    GAP-related domain and the membrane-anchored SPR domain relocates it to the plasma membrane, promoting
    Ras-GTP hydrolysis and thereby dampening growth-factor-induced Ras-RAF-MEK-ERK signalling. SPRED2
    is non-catalytic; the GAP catalysis is performed by neurofibromin.'
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0046580
    label: negative regulation of Ras protein signal transduction
  - id: GO:0070373
    label: negative regulation of ERK1 and ERK2 cascade
  locations:
  - id: GO:0005886
