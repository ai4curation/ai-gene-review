suggested_questions:
- question: Does SPRED2, like SPRED1, contact KRAS as well as the neurofibromin GRD in a ternary complex
    (which would justify protein-macromolecule adaptor activity, GO:0030674, rather than the generic molecular
    adaptor activity)?
- question: What fraction of SPRED2's ERK-inhibitory activity in physiological settings is due to neurofibromin
    recruitment versus the NBR1-dependent receptor-trafficking route or Ras-RAF-level effects proposed
    by Wakioka et al.?
- question: Is the SPR-domain membrane anchoring of SPRED2 dependent on palmitoylation by ZDHHC17/ZDHHC13,
    and does that link the high-throughput ZDHHC17 interaction to function?
- question: Is there experimental support for the propagated 'positive regulation of DNA damage response,
    signal transduction by p53 class mediator' annotation for any SPRED family member?
suggested_experiments:
- hypothesis: SPRED2 membrane recruitment of neurofibromin is necessary and sufficient for its suppression
