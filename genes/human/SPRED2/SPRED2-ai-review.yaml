  evidence_type: EXP
  original_reference_id: PMID:34626534
  qualifier: located_in
  review:
    summary: Plasma membrane localization of SPRED2.
    action: ACCEPT
    reason: Wild-type SPRED2 localizes to the plasma membrane, where it recruits neurofibromin; pathogenic
      variants impair membrane targeting. The IBA node placement across the SPRED/Sprouty family is consistent
      with this, and SPRED2 appearing in its own WITH/FROM reflects its own experimental grounding. This
      is the site of SPRED2's core activity.
