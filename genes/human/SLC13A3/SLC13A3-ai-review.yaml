  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002568150
  - RGD:628786
  review:
    summary: >-
      Phylogenetic inference of citrate transporter activity at a SLC13 subfamily node. NaDC3
      does transport citrate, but only the divalent form and as a secondary, non-preferred
      substrate (the prototypical SLC13 citrate transporter is the paralog NaCT/SLC13A5).
    action: KEEP_AS_NON_CORE
    reason: >-
      Citrate transport by NaDC3 is real but peripheral: UniProt notes it recognizes the
      divalent (not the physiological trivalent) form, and the core substrates are the
      dicarboxylates succinate/alpha-ketoglutarate. The term is substrate-named and
      appropriately specific, so it is kept but marked non-core rather than TOO_GENERAL.
    supported_by:
    - reference_id: file:human/SLC13A3/SLC13A3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Can transport citrate in a Na(+)-dependent manner, recognizing the divalent form of
        citrate rather than the trivalent form which is normally found in blood
