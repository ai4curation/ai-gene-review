- term:
    id: GO:0150104
    label: transport across blood-brain barrier
  evidence_type: NAS
  original_reference_id: PMID:30280653
  qualifier: involved_in
  review:
    summary: >-
      Non-traceable author statement, citing a general blood-brain-barrier physiology review,
      placing SLC13A3 among transporters relevant to brain barriers. NaDC3 is expressed in
      astrocytes and the choroid plexus and handles brain dicarboxylates and NAA, but a direct
      role in transcellular transport across the endothelial BBB is not experimentally
      established for this gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term over-reaches for SLC13A3. NaDC3 is expressed in astrocytes and the choroid
      plexus, which form the blood-CSF barrier, not the endothelial blood-brain barrier that
      GO:0150104 denotes; no study demonstrates NaDC3 mediating transcellular transport across
      BBB endothelium. The only support is a general NAS physiology review (marked MISCITED),
      not direct evidence on this gene. Over-annotation on two counts: the barrier identity is
      wrong (blood-CSF rather than endothelial BBB) and the transcellular-transport role is
      not experimentally established.
    supported_by:
    - reference_id: PMID:30635937
      supporting_text: >-
        SLC13A3 is mainly expressed in kidney, in astrocytes, and in the choroid plexus
core_functions:
- description: >-
    High-affinity, electrogenic Na(+)-coupled symport (elevator-type, homodimeric) that imports
    4-6 carbon di- and tricarboxylates - principally the TCA-cycle intermediates succinate and
    alpha-ketoglutarate, plus N-acetyl-L-aspartate and related dicarboxylates - across the
    basolateral plasma membrane with a stoichiometry of ~3 Na(+) per divalent anion, supplying
    cellular metabolism with carboxylate substrates.
  molecular_function:
    id: GO:0015362
    label: high-affinity sodium:dicarboxylate symporter activity
  directly_involved_in:
  - id: GO:0071422
    label: succinate transmembrane transport
  - id: GO:0006835
    label: dicarboxylic acid transport
  - id: GO:0015742
    label: alpha-ketoglutarate transport
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  supported_by:
  - reference_id: file:human/SLC13A3/SLC13A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      High-affinity sodium-dicarboxylate cotransporter that accepts a range of substrates with
      4-6 carbon atoms, such as the citric acid cycle intermediates succinate and
      alpha-ketoglutarate (2-oxoglutarate), as well as other compounds including
      N-acetyl-L-aspartate
  - reference_id: file:human/SLC13A3/SLC13A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Transports the dicarboxylate into the cell with a probable stoichiometry of 3 Na(+) for 1
      divalent dicarboxylate, rendering the process electrogenic
  - reference_id: PMID:30635937
    supporting_text: >-
      the missense mutations caused a marked reduction in the capacity to transport αKG,
      succinate, and NAA
proposed_new_terms:
- proposed_name: N-acetyl-L-aspartate transmembrane transporter activity
  proposed_definition: >-
    Enables the transfer of N-acetyl-L-aspartate from one side of a membrane to the other.
  justification: >-
    NaDC3/SLC13A3 is an established high-affinity transporter of N-acetyl-L-aspartate (NAA;
    KM ~220 uM), with a dedicated Na(+)/NAA symport catalytic-activity reaction curated in
    UniProt (Rhea:RHEA:71947) and loss of NAA transport documented in disease variants
    (PMID:30635937). No GO molecular-function term for NAA transporter activity currently exists
    (confirmed absent in OLS), so NAA transport cannot be annotated at the appropriate substrate
    granularity; it is currently subsumed under dicarboxylic acid transmembrane transporter
    activity.
  proposed_parent:
    id: GO:0005310
    label: dicarboxylic acid transmembrane transporter activity
  supported_by:
  - reference_id: file:human/SLC13A3/SLC13A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      as well as other compounds including N-acetyl-L-aspartate
  - reference_id: PMID:30635937
    supporting_text: >-
      the missense mutations caused a marked reduction in the capacity to transport αKG,
      succinate, and NAA
suggested_questions:
- question: >-
    Does NaDC3 contribute to transcellular transport across the endothelial blood-brain barrier,
    or is its CNS role confined to astrocytic and choroid-plexus (blood-CSF) handling of
    dicarboxylates and N-acetylaspartate?
- question: >-
    What is the physiological significance of NaDC3-mediated itaconate uptake in hepatocyte
    antibacterial innate immunity, and in which other tissues does this occur?
suggested_experiments:
- description: >-
    Cell-type-resolved localization (endothelial vs astrocytic vs epithelial) of NaDC3 in human
    brain microvasculature combined with transcellular flux assays to determine whether it
    mediates transport across the blood-brain barrier.
- description: >-
    Structure-guided mutagenesis of the SNT and TXP substrate-recognition motifs to map
    substrate selectivity among succinate, alpha-ketoglutarate, N-acetylaspartate, citrate and
    glutathione, correlating with the cryo-EM substrate-bound states.
