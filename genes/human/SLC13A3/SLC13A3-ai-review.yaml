id: Q8WWT9
gene_symbol: SLC13A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC13A3 (NaDC3 / NaC3 / SDCT2) is a high-affinity, Na(+)-coupled, electrogenic
  secondary-active cotransporter of the SLC13 (DASS, divalent anion:Na(+) symporter)
  family that imports 4-6 carbon di- and tricarboxylates with a probable stoichiometry
  of ~3 Na(+) per divalent anion. Its physiological substrates include the citric-acid-cycle
  intermediates succinate and alpha-ketoglutarate (2-oxoglutarate), as well as
  N-acetyl-L-aspartate, glutarate, fumarate, malate, itaconate, and the divalent form of
  citrate; glutathione is a low-affinity substrate. The protein is a multi-pass, homodimeric
  membrane transporter that uses an elevator-type mechanism, and it resides on the basolateral
  plasma membrane of epithelial cells. It is expressed most highly in kidney (basolateral
  proximal tubule, where it is the first step of renal organic-anion secretion upstream of
  OAT1-3), and also in brain (astrocytes and choroid plexus), liver, placenta and pancreas. By
  importing TCA-cycle intermediates and other dicarboxylates it supplies cellular metabolism
  and, in brain, participates in handling of N-acetylaspartate and dicarboxylates. Biallelic
  loss-of-function variants cause acute reversible leukoencephalopathy with increased urinary
  alpha-ketoglutarate (ARLIAK).
