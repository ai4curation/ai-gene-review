id: P25098
gene_symbol: GRK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRK2 is a serine/threonine protein kinase that phosphorylates activated G protein-coupled
  receptors, helping recruit arrestins and regulate receptor responsiveness and trafficking. Its membrane
  recruitment and activity depend on receptor engagement, phospholipids and G beta/gamma. GRK2 also has
  non-receptor substrates and kinase-independent regulatory interactions. Cytosolic and plasma-membrane
  pools participate in neurotransmitter and cardiovascular signaling, while mitochondrial-surface and
  ciliary pools support distinct metabolic and Hedgehog-related functions.
