id: Q9Y2D1
gene_symbol: ATF5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ATF5 (activating transcription factor 5) is a short-lived basic leucine zipper (bZIP) transcription
  factor of the ATF4/ATF5 subfamily. Like ATF4, its translation is controlled by upstream ORFs and is
  enhanced when eIF2alpha is phosphorylated, linking it to the integrated stress response. ATF5 binds
  CRE, ATF5-specific (ARE) and amino acid response (AARE) elements as homo- or heterodimers (notably with
  C/EBP family members) and activates or represses target genes such as BCL2, CHOP/DDIT3, CCND3 and EGR1.
  In mammalian cells ATF5 is the functional counterpart of C. elegans ATFS-1 in the mitochondrial unfolded
  protein response: it is required for stress-induced transcription of mitochondrial chaperones and proteases
  (HSPD1, HSPE1, HSPA9, LONP1), a fraction of the protein associates with mitochondria in the absence
  of stress, and human ATF5 restores UPRmt signalling in atfs-1 mutant worms. ATF5 promotes survival of
  glioma and other cancer cells, acts as a C/EBPB cofactor in adipogenesis, and has a reported non-transcriptional
  structural role at the pericentriolar material of the mother centriole.'
