- description: Stress-responsive bZIP transcription activator that binds CRE/ARE/AARE and UPRmt promoter
    elements and activates RNA polymerase II transcription of mitochondrial protein-quality-control genes
    (HSPD1, HSPE1, HSPA9, LONP1) during mitochondrial stress, as the mammalian effector of the UPRmt.
