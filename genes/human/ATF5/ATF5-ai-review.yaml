suggested_questions:
- question: Is endogenous ATF5 imported into mitochondria and degraded there under basal conditions (ATFS-1-like
    partitioning), or is its UPRmt regulation mainly translational via eIF2alpha phosphorylation downstream
    of HRI/DELE1?
- question: How do ATF4, ATF5 and CHOP divide the transcriptional output of the mammalian mitochondrial
    stress response, given that HRI-DELE1 signalling induces all three?
suggested_experiments:
- hypothesis: Endogenous ATF5 partitions between mitochondria and nucleus according to import efficiency.
  description: Tag endogenous ATF5 (knock-in) in liver-derived cells, impair import (e.g. CCCP, TIM23
    knockdown) and quantify mitochondrial versus nuclear ATF5 by fractionation and imaging, with ATF5
    MTS mutants as controls.
  experiment_type: localization / genetic perturbation
