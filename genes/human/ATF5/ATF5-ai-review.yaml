  review:
    summary: 'ATF5 is the transcription factor of the mammalian UPRmt: shRNA knockdown abolished stress-induced
      transcription of HSPD1, HSPA9, LONP1 and HSPE1, and human ATF5 rescued UPRmt reporter induction
      in atfs-1-deficient C. elegans via the UPRmt promoter element.'
    action: NEW
    reason: 'ATF5 performs the transcriptional step of this response (it binds and activates mitochondrial
      chaperone/protease promoters; Reactome curates ATF5 binding to HSPD1/HSPE1 and HSPA9 promoters),
      so it passes the participation test. Comparator: the worm functional counterpart ATFS-1 carries
      GO:0034514, as do other response-effector transcription factors for their stress responses (e.g.
      XBP1/ATF6 for the ER UPR). Not present in human GOA for ATF5.'
    supported_by:
    - &id014
      reference_id: PMID:27426517
      supporting_text: Here, we describe a mammalian transcription factor, ATF5, which is regulated similarly
        to ATFS-1 and induces a similar transcriptional response. ATF5 expression can rescue UPR(mt) signaling
        in atfs-1-deficient worms requiring the same UPR(mt) promoter element identified in C. elegans.
      reference_section_type: ABSTRACT
    - &id015
      reference_id: PMID:27426517
      supporting_text: Impressively, transcription of all four genes was significantly reduced when ATF5
        was impaired by two different shRNAs
      reference_section_type: RESULTS
    - *id013
