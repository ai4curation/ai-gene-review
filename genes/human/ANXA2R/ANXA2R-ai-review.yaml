  review:
    summary: 'Signaling receptor activity (IEA, InterPro family IPR031449). ANXA2R was cloned as a cell-surface
      annexin II-binding protein, and an anti-ANXA2R antibody blocked annexin II-stimulated osteoclast
      formation. Other evidence leaves the claim open: the protein has no predicted transmembrane segment,
      endogenous protein is barely detectable, and overexpressed ANXA2R is cytoplasmic and pro-apoptotic
      independently of annexin II. Left undecided.'
    action: UNDECIDED
    reason: 'For: [PMID:16895901 "Using 125I-labeled annexin II binding to screen NIH3T3 transfected with
      a human marrow cDNA expression library, we identified a putative annexin II receptor clone, which
      encoded a novel 26-kDa type I membrane receptor protein when expressed in HEK 293 cells."] [PMID:16895901
      "HEK 293 cells transformed with the cloned annexin II receptor cDNA showed a similar binding affinity
      to annexin II as that observed in PSV10 cells."] [PMID:16895901 "Importantly, the annexin II receptor
      antibody dose-dependently blocked the stimulatory effects of annexin II on human osteoclast formation,
      demonstrating that the receptor mediates the effects of annexin II on osteoclast formation."] Later
      work from the same group also relies on antibody blocking: [PMID:22223826 "we show that MM cells
      express AXIIR, that stromal/osteoblast-derived AXII facilitates adhesion of MM cells to stromal
      cells via AXIIR, and OCL-derived AXII enhances MM cell growth."] A 2026 abstract places a hepatocyte
      ANXA2R downstream of muscle-derived ANXA2: [PMID:42225205 "Mechanistically, ANXA2 secreted by FAPs
      acts on hepatocyte-specific ANXA2R, promoting liver de novo lipogenesis through activation of the
      sterol regulatory element-binding protein 1c (SREBP1c) signaling pathway."] but the in vivo genetics
      there removes the ligand, not the receptor: [PMID:42225205 "In vivo FAP-specific ANXA2 ablation
      significantly alleviated systemic metabolic disturbances and hepatic steatosis in muscular dystrophy
      mouse models and high-fat diet-treated mice."] A mouse hepatocyte receptor is at least possible,
      because the family is mammal-wide rather than human-specific as PMID:23640736 stated: [file:human/ANXA2R/ANXA2R-bioinformatics/RESULTS.md
      "ANXA2R family members are present in 57 organisms, every one of them in class Mammalia by NCBI
      lineage, including mouse Anxa2r. The gene is mammal-specific, not human-specific."] The electronic
      annotation itself adds no independent support: it comes from the family-coextensive InterPro/Pfam
      signatures, [file:human/ANXA2R/ANXA2R-uniprot.txt "DR   InterPro; IPR031449; ANXA2R."] [file:human/ANXA2R/ANXA2R-uniprot.txt
      "DR   Pfam; PF15721; ANXA2R; 1."] so it re-asserts the cloning-paper claim. Against: [file:human/ANXA2R/ANXA2R-uniprot.txt
      "However, no clear transmembrane region is detected by prediction"] [PMID:23640736 "AXIIR is located
      in cytoplasm, binds to and activates pro-Caspase-8, which subsequently activates Caspase-3/7."]
      [PMID:23640736 "AXIIR induces apoptosis independent of Annexin II and FADD."] [PMID:23640736 "Although
      the transcriptional level of AXIIR in multiple cell types is considerably high, the translational
      level of AXIIR can hardly be detected."] The receptor assignment rests on ligand binding and antibody
      blockade, with no topology, signalling-mechanism or knockout evidence.'
