  label: Homo sapiens
description: ANXA2R (annexin-2 receptor, AXIIR, C5orf39) is a small (193-residue) mammal-specific protein
  whose only sequence signatures are the family-defining ANXA2R Pfam/InterPro entries. It was cloned from
  a marrow-stromal-cell expression library by binding of radiolabelled annexin II, and was described as
  a cell-surface receptor through which annexin II stimulates osteoclast formation. Antibody-blocking
  studies implicate it in annexin II-dependent adhesion, homing and growth of prostate cancer and multiple
  myeloma cells. However, it has no predicted transmembrane segment. Its translation is tightly repressed
  by two 5'UTR upstream open reading frames acting with hnRNPA2B1, hnRNPA0 and ELAVL1, so endogenous protein
  is hard to detect. When overexpressed, ANXA2R is cytoplasmic, binds and activates pro-caspase-8, and
  induces apoptosis independently of annexin II.
