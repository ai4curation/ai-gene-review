knowledge_gaps:
- gap_statement: Whether ANXA2R is a signalling receptor at all. Its receptor status rests on annexin
    II binding to transfected cells, antibody blockade, and ligand-side genetics (ANXA2 deletion); it
    has no predicted transmembrane segment, no defined signalling mechanism, and the receptor itself has
    not been knocked out in an animal. Its only other reported activity (pro-caspase-8 activation) is
    cytoplasmic and annexin II-independent.
  boundary: 'Established: the cDNA confers annexin II binding on transfected cells, an anti-ANXA2R antibody
    blocks annexin II effects, translation is repressed by two uORFs, and overexpressed protein is cytoplasmic
    and pro-apoptotic. Not established: membrane topology, endogenous location, how ligand binding is
    transduced, or a receptor-knockout phenotype; the vitiligo study (PMID:38806323) shows reduced expression
    linked to melanocyte apoptosis, not loss of annexin II signalling.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: ANXA2R is invoked as the annexin II receptor in bone-marrow niche, metastasis and metabolic
    studies; if it is not a membrane receptor, the annexin II signalling it is credited with needs another
    receptor.
  resolution: Determine the topology and surface exposure of endogenous ANXA2R (e.g. surface biotinylation
    or protease protection) and test annexin II responses in ANXA2R-knockout cells.
suggested_questions:
- question: Is endogenous ANXA2R exposed at the cell surface, given that no transmembrane segment is predicted
    and the protein is barely detectable?
suggested_experiments:
- description: Knock out ANXA2R in marrow stromal cells and test annexin II binding and annexin II-stimulated
    osteoclastogenesis, alongside surface-labelling of tagged endogenous ANXA2R.
