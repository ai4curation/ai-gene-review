id: Q8N6T7
gene_symbol: SIRT6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIRT6 is a predominantly nuclear, chromatin-associated NAD+-dependent enzyme with protein lysine deacetylase,
  defatty-acylase, and mono-ADP-ribosyltransferase activities. It deacetylates histone H3K9, H3K18, and H3K56 in nucleosomes
  to regulate transcription, telomeric and pericentric chromatin, and stem-cell programs; binds broken DNA ends and recruits
  repair factors for double-strand break repair; transfers mono-ADP-ribose to substrates such as PARP1, TRIM28 and SMARCC2;
  and removes long-chain fatty acyl groups from substrates such as TNF and RRAS2 to regulate secretion and membrane signaling.
