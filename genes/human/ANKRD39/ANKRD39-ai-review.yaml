description: ANKRD39 (ankyrin repeat domain-containing 39) is an uncharacterized 183-residue protein,
  most of which (residues 30-158) is four ankyrin repeats. It is detected at the protein level and expressed
  with low tissue specificity, but no molecular activity, location or biological role has been established.
