knowledge_gaps:
- gap_statement: ANKRD39's molecular activity, location and biological role are unknown, and none of its
    deposited interactors has been validated.
  boundary: Interaction databases hold high-throughput partners (65 in IntAct, 71 in BioGRID), but none
    is reciprocally validated or captured in a UniProt SUBUNIT statement or a GO row, so they support
    no annotation. GOA holds only the three ND root placeholders. PAN-GO assigns no annotations, and although
    PTHR24171 has annotated PAINT nodes (for example the tankyrase subfamily), none propagates to ANKRD39.
    PubMed mentions are bioinformatic gene lists only.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: ANKRD39 is a broadly expressed small ankyrin-repeat protein of entirely unknown function.
  resolution: Localize endogenous ANKRD39 and identify its partners by proximity labelling.
