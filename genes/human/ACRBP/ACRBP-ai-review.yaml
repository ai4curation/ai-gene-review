    id: GO:0007286
    label: spermatid development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Kept as non-core. The mouse source (GO:0007286 IMP, PMID:27303034) is sound - ACRBP-null
      spermatids fail to build a normal acrosome - and the transfer to human is legitimate for
