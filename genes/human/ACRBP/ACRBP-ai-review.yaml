- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:21630459
  qualifier: located_in
  review:
    summary: >-
      Marked as over-annotated. The peptide detection is not in dispute; the compartment
      inference drawn from it is.

      The evidence is a single high-throughput proteome of human sperm nuclei that identified 403
      proteins. The authors report a stringent preparation, isolated to over 99.9% purity with no
      tail fragments, acrosome or mitochondria, but ACRBP is exactly the protein that preparation
      would struggle to exclude: the acrosome is a flattened vesicle apposed to the anterior face
      of the sperm nucleus, and in mouse ACRBP has been described as spread over the apical end of
      the nucleus in elongating spermatids. Detection of an acrosomal matrix protein in a
      sperm-nucleus fraction is most simply read as co-purification of the structure that caps the
      nucleus.

      Topology says the same thing independently. ACRBP has a cleaved signal peptide and is
      translocated into the secretory pathway at synthesis; it has no route to the nucleoplasm.
      The dataset is also permissive by the authors' own account - more than half its proteins
      were absent from previous sperm proteomes, and it reports transcription factors and zinc
      fingers not previously known to associate with sperm chromatin. This same PMID has been
      treated as an over-annotation for other genes in this repository.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      High-throughput detection in a sperm-nucleus fraction, read as a location. A
      signal-peptide-bearing secretory-pathway protein cannot reside in the nucleoplasm, and the
      acrosome is physically apposed to the sperm nucleus, so carry-over is the parsimonious
      explanation. Retained rather than removed because the mass-spectrometric identification
      itself is credible.
    supported_by:
    - reference_id: PMID:21630459
      supporting_text: sperm nuclei were obtained through CTAB treatment and isolated to over
        99.9% purity without any tail fragments, acrosome or mitochondria as assessed by optical
        microscopy and transmission electron microscopy.
    - reference_id: PMID:21630459
      supporting_text: More than half (52.6%) of the proteins had not been detected in the
        previous human whole sperm cell proteome reports.
    - reference_id: file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md
      supporting_text: every ACRBP ortholog is a signal-peptide-bearing, anchor-free secretory
        protein
- term:
    id: GO:0035375
    label: zymogen binding
  evidence_type: ISS
  original_reference_id: PMID:8144514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q29016
  - UniProtKB:Q3V140
  review:
    summary: >-
      Proposed new annotation, and the more important half of the largest gap in this gene's GO
      record: human ACRBP currently has no molecular-function annotation of any kind, even though
      the protein is named for what it binds.

      The binding is not generic and should not be recorded as protein binding. Purified pig sp32
      binds the 55-, 53- and 49-kDa (pro)acrosin species and specifically does not bind the 43-kDa
      intermediate or the 35-kDa mature enzyme - it discriminates the zymogen and early
      intermediates from the finished protease. Mouse work reproduces this and localises the
      contact to two segments in the C-terminal region of pro-ACR, engaged by different regions of
      ACRBP. GO:0035375 zymogen binding (a child of GO:0019899 enzyme binding) states exactly this
      specificity.

      Evidence code is ISS, not IDA: the binding assays are on the pig and mouse proteins, and
      human ACRBP is 81.9% identical to pig and 75.2% to mouse over the precursor, with the
      C-terminal pro-ACR-binding region present in the human mature chain. MGI recorded the mouse
      counterpart of this activity as GO:0016504 peptidase activator activity (ISA, PMID:8144514,
      with/from Q29016); nothing was ever propagated to human.
    action: NEW
    reason: >-
      Fills the complete absence of molecular-function annotation on human ACRBP with the
      specific, well-documented binding activity the protein is named for, at the appropriate
      ortholog-transfer evidence strength. GO:0035375 is used in preference to GO:0005515 protein
      binding because the documented specificity - zymogen and early intermediates but not the
      mature protease - is the informative part.
    supported_by:
    - reference_id: PMID:8144514
      supporting_text: Purified sp32 gave a single 32-kDa protein band on SDS-polyacrylamide gel
        electrophoresis and was characterized as a binding protein specific for 55-, 53-, and
        49-kDa forms of (pro)acrosin.
    - reference_id: PMID:8144514
      supporting_text: This protein was not capable of binding a 43-kDa acrosin intermediate and
        35-kDa mature acrosin.
    - reference_id: PMID:23426433
      supporting_text: ACRBP/sp32 is a binding protein specific for the precursor (pro-ACR) and
        intermediate forms of sperm serine protease ACR.
    - reference_id: PMID:11248070
      supporting_text: another gene, designated OY-TES-1, was isolated and found to be the human
        homologue of proacrosin binding protein sp32 precursor originally identified in mouse,
        guinea pig, and pig
    - reference_id: file:human/ACRBP/ACRBP-deep-research-affinage.md
      supporting_text: >-
        ACRBP (SP32/OY-TES-1/CT23) is an acrosomal matrix protein that controls the packaging and
        timed activation of the sperm protease proacrosin during spermiogenesis and fertilization
- term:
    id: GO:0061135
    label: endopeptidase regulator activity
  evidence_type: ISS
  original_reference_id: PMID:27303034
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q29016
  - UniProtKB:Q3V140
  review:
    summary: >-
      Proposed new annotation: the regulatory consequence of the zymogen binding, recorded at a
      sign-neutral level because the evidence genuinely points both ways.

      In the intact acrosome ACRBP holds proacrosin latent - exogenously expressed ACRBP-W blocks
      proacrosin autoactivation, and the authors state plainly that retaining the inactive status
      of proacrosin until acrosomal exocytosis is its major function. In vitro, at basic pH, the
      same protein accelerates proacrosin autoactivation and redirects the maturation pathway so
      that the 49-kDa intermediate accumulates instead of the 43-kDa one; mouse ACRBP-C reproduces
      the acceleration. So ACRBP is not an inhibitor of acrosin and not an activator of it: it
      sets the timing of zymogen conversion, holding it back in one context and speeding it in
      another.

      One thing the term name does not say, and which should be stated outright: what ACRBP holds
      is the early part of the activation pathway, and the mature endopeptidase is specifically
      excluded. It binds the 55- and 53-kDa proacrosins and the 49-kDa acrosin intermediate, and
      does not bind the 43-kDa intermediate or the 35-kDa mature acrosin. The discriminant is
      therefore early versus late species along the processing route rather than zymogen versus
      active enzyme - the paper's own title is "a binding protein specific for two proacrosins and
      an acrosin intermediate".

      That distinction cuts both ways, and both matter here. It is why GO:0035375 zymogen binding
      is recorded alongside this row rather than subsumed into it: the zymogen is where the
      interaction begins and where the physiological restraint is exerted. And it is why GO:0061135
      is apt rather than strained: the 49-kDa species is an acrosin intermediate, that is, a
      post-autoactivation form generated from the 55- and 53-kDa proacrosins, so ACRBP does contact
      a processed enzyme species, which is what an enzyme-regulator term requires. That inference
      rests on the intermediate being downstream of autoactivation, which the source establishes;
      it does not rest on a measurement of the intermediate's catalytic activity, which the source
      does not report. Nothing here should be read as inhibition of the finished protease, which
      the binding set above excludes.

      It is also why GO:0061135 is proposed rather than its children GO:0004866 endopeptidase
      inhibitor activity or GO:0061133 endopeptidase activator activity. MGI chose the activator
      direction for mouse (GO:0016504, ISA on PMID:8144514), which captures the in vitro result but
      is contradicted in sign by the in vivo result from the same laboratory twenty-two years
      later. The unsigned parent is the strongest claim both datasets support.

      A trap to note: UniProt assigns ACRBP the SUPFAM Kazal-type serine protease inhibitor fold
      (SSF100895). There is no evidence ACRBP inhibits a protease by a Kazal mechanism - it does
      not bind mature acrosin at all - so the fold name must not be promoted to an activity.
    action: NEW
    reason: >-
      Records the activity that ACRBP's zymogen binding accomplishes, without asserting a
      direction the evidence does not support. The interaction is stage-selective along the
      activation pathway - the 55-/53-kDa proacrosins and the 49-kDa acrosin intermediate are
      bound, the 43-kDa intermediate and the 35-kDa mature enzyme are not - so this row is paired
      with GO:0035375 rather than replacing it: one states what is bound, the other what the
      binding does to the activity that follows from it. ISS because all assays are on pig and
      mouse protein.
    supported_by:
    - reference_id: PMID:27303034
      supporting_text: The major function of ACRBP-W is to retain the inactive status of
        proacrosin in the acrosome until acrosomal exocytosis.
    - reference_id: PMID:27303034
      supporting_text: Moreover, exogenously expressed ACRBP-W blocked autoactivation of
        proacrosin in the acrosome.
    - reference_id: PMID:8144514
      supporting_text: sp32 significantly accelerated autoactivation of proacrosin at a basic pH
        in vitro and affected the maturation pathway of proacrosin.
    - reference_id: PMID:23426433
      supporting_text: Moreover, autoactivation of pro-ACR was remarkably accelerated by the
        presence of ACRBP-C.
- term:
    id: GO:0097341
    label: zymogen inhibition
  evidence_type: ISS
  original_reference_id: PMID:27303034
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q3V140
  review:
    summary: >-
      Proposed new annotation. GO already has a term for precisely the process the 2016 knockout
      paper describes - GO:0097341 zymogen inhibition, "any process that prevents the proteolytic
      processing of an inactive enzyme to an active form", with the synonym "prevention of zymogen
      activation" - and no ACRBP entry in any species carries it.

      This is the biological-process counterpart of the molecular function above, and it is the
      half of ACRBP's activity that operates inside the intact acrosome: keeping proacrosin from
      autoactivating prematurely, so that active acrosin appears only when the acrosome is
      discharged. Its physiological importance is visible in the PCSK4-null mouse, where ACRBP
      fails to be processed to its mature form and proacrosin then fails to autoactivate at all -
      the mature protein is required for normal proacrosin conversion.

      Proposed at ISS strength from mouse; the sign here is well determined in vivo, unlike the
      molecular-function row, because the in vitro acceleration is a property of the isolated
      system at basic pH rather than of the acrosome.
    action: NEW
    reason: >-
      An exact, already-existing GO term for ACRBP's in vivo role that is unused across the whole
      family. Sign-specific at the process level, where the in vivo evidence is unambiguous, while
      the molecular-function row stays neutral.
    supported_by:
    - reference_id: PMID:27303034
      supporting_text: The major function of ACRBP-W is to retain the inactive status of
        proacrosin in the acrosome until acrosomal exocytosis.
    - reference_id: PMID:22357636
      supporting_text: Further analysis of spermatozoa from the PCSK4 null mice showed that
        proacrosin did not undergo autoactivation, supporting a role for the mature form of ACRBP
        in the regulation of proacrosin conversion into different acrosin isoforms.
- term:
    id: GO:0060046
    label: regulation of acrosome reaction
  evidence_type: ISS
  original_reference_id: PMID:30606959
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q3V140
  - UniProtKB:Q29016
  review:
    summary: >-
      Proposed new annotation, and the specific step that the broad GO:0009566 fertilization
      annotation leaves unnamed. No ACRBP entry in any species carries a term for the acrosome
      reaction.

      Two independent lines of evidence, from two species and by opposite experimental logic.
      Loss of function in mouse: ACRBP-deficient sperm arrive in the oviduct with normal head
      morphology and normal motility, yet cannot reach unfertilized oocytes, and the authors
      attribute the subfertility to incompleteness of the acrosome reaction rather than to
      impaired migration. Acute blockade in boar: antibodies against ACRBP on the sperm head
      reduce spontaneous acrosome reaction and reduce the ability of sperm to react to solubilized
      zona pellucida or to SERCA inhibition.

      Regulation, not participation, is the right framing: ACRBP does not execute membrane fusion,
      it determines whether the protease cargo is ready when fusion occurs. Proposed at ISS
      strength - mouse for the genetic evidence, pig for the antibody-blocking evidence, with no
      human experiment on either side.
    action: NEW
    reason: >-
      Names the specific fertilization step ACRBP acts on, supported by loss-of-function evidence
      in mouse and antibody blockade in boar, and absent from every ACRBP entry in GO. Proposed as
      additive to GO:0009566 rather than as a replacement, since the broad term is separately
      supported by the mouse knockout.
    supported_by:
    - reference_id: PMID:30606959
      supporting_text: These data suggest that male subfertility of ACRBP-deficient mice may be
        attributed to incompleteness of the acrosome reaction rather than impairment in sperm
        migration from the uterus to the oviduct.
    - reference_id: PMID:30606959
      supporting_text: However, ACRBP-deficient sperm recovered from the oviduct possessed
        morphologically normal head shape and retained normal motility.
    - reference_id: PMID:34086710
      supporting_text: Anti-ACRBP antibodies reduced capacitation and spontaneous AR (P<0.05).
    - reference_id: PMID:34086710
      supporting_text: The localisation of anti-ACRBP antibodies on the sperm head, reduced the
        ability of the sperm to undergo the AR in response to solubilized ZP or by inhibiting the
        sarco/endoplasmic reticulum Ca2+-ATPase.
core_functions:
- description: >-
    Binds the acrosin zymogen in the acrosomal matrix and sets the timing of its conversion to
    active protease, holding proacrosin enzymatically inactive inside the intact acrosome and
    accelerating its autoactivation once the acrosome is discharged. This is the function carried
    by the mature ~32-kDa chain, whose retained pro-ACR-binding region (residues 319-427) survives
    the maturation cleavage.
  molecular_function:
    id: GO:0061135
    label: endopeptidase regulator activity
  directly_involved_in:
  - id: GO:0097341
    label: zymogen inhibition
  - id: GO:0060046
    label: regulation of acrosome reaction
  - id: GO:0009566
    label: fertilization
  locations:
  - id: GO:0043159
    label: acrosomal matrix
  - id: GO:0001669
    label: acrosomal vesicle
  supported_by:
  - reference_id: PMID:27303034
    supporting_text: The major function of ACRBP-W is to retain the inactive status of proacrosin
      in the acrosome until acrosomal exocytosis.
  - reference_id: PMID:8144514
    supporting_text: sp32 significantly accelerated autoactivation of proacrosin at a basic pH in
      vitro and affected the maturation pathway of proacrosin.
  - reference_id: PMID:30606959
    supporting_text: These data suggest that male subfertility of ACRBP-deficient mice may be
      attributed to incompleteness of the acrosome reaction rather than impairment in sperm
      migration from the uterus to the oviduct.
- description: >-
    Recognises the proacrosin zymogen and early acrosin intermediates, but not mature acrosin, and
    thereby packages and condenses the zymogen into the acrosomal granule that becomes the
    acrosomal matrix during early spermiogenesis. This is the function associated with the
    N-terminal pro-ACR-binding region (residues 26-106), which lies within the propeptide removed
    on maturation and within the span of the intron-5 read-through product; loss of the gene in
    mouse prevents formation of the large acrosomal granule and fragments the acrosome.
  molecular_function:
    id: GO:0035375
    label: zymogen binding
  directly_involved_in:
  - id: GO:0001675
    label: acrosome assembly
  locations:
  - id: GO:0043159
    label: acrosomal matrix
  supported_by:
  - reference_id: PMID:8144514
    supporting_text: The binding of sp32 to proacrosin may be involved in packaging the acrosin
      zymogen into the acrosomal matrix.
  - reference_id: PMID:27303034
    supporting_text: Notably, ACRBP-null spermatids failed to form a large acrosomal granule,
      leading to the fragmented structure of the acrosome.
  - reference_id: PMID:23426433
    supporting_text: These results suggest that ACRBP-V5 and ACRBP-C may function in the
      transport/packaging of pro-ACR into acrosomal granules during spermiogenesis and in the
      promotion of ACR release from the acrosome during acrosomal exocytosis, respectively.
  knowledge_gaps:
  - gap_statement: >-
      Whether human ACRBP performs the acrosomal-granule packaging step at all is undetermined,
      and the two available lines of evidence point in opposite directions. The step is
      established only in mouse and only by transgenic rescue with the ACRBP-V5 splice form; the
      primary literature reports that human spermatogenic cells do not make the corresponding
      mRNA, yet the human genome is annotated with a structurally equivalent transcript. No human
      protein has been shown to occupy the role, and none has been shown not to.
    boundary: >-
      Firmly established: the mouse knockout fails to form the acrosomal granule and ACRBP-V5
      alone rescues it; human ACRBP is 75.2% identical to mouse ACRBP overall; and PMID:30606959
      states experimentally that porcine, guinea pig and human spermatogenic cells produce only
      the Acrbp-W mRNA. Against that, GENCODE annotates ENST00000536350 at the human locus, a
      structurally equivalent intron-5 read-through transcript encoding the same N-terminal-half
      product. So this is not a plain absence of data: there is a published experimental negative
      at the mRNA level and a conflicting genome annotation, and they have never been reconciled.
      Not established either way: whether any human N-terminal-half ACRBP protein exists, and
      whether the human 60-kDa precursor can substitute for it.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      This is the only ACRBP function whose human counterpart depends on an isoform rather than on
      the canonical protein, so it is the one place where the ortholog transfer could be right
      about the gene and wrong about the gene product that humans actually make.
    resolution: >-
      Long-read RNA sequencing of human testis would adjudicate the discrepancy directly by
      quantifying the read-through transcript across spermatogenic stages against the RT-PCR-based
      negative, and an antibody to its unique RYRKF C-terminal neo-epitope would test for the
      protein in human testis sections. On the curation side, whichever way it resolves, the human
      locus and the UniProt entry should agree: either UniProt Q8NEB7 gains the alternative product
      (making isoform-resolved GO annotation possible) or ENST00000536350 is reclassified.
    provenance:
    - reference_id: PMID:23426433
      supporting_text: Unlike other mammalian ACRBPs, two forms of Acrbp mRNA-wild-type Acrbp-W
        and variant Acrbp-V5 mRNAs-were generated by alternative splicing of Acrbp in the mouse.
    - reference_id: PMID:30606959
      supporting_text: Porcine, guinea pig, and human spermatogenic cells produce only a single
        form of Acrbp (termed Acrbp-W) mRNA, whereas two mRNA forms, wild-type Acrbp-W and intron
        5-retaining variant Acrbp-V5 mRNAs, are synthesized by pre-mRNA alternative splicing of
        the Acrbp gene in mouse
    - reference_id: file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md
      supporting_text: >-
        It is an annotation-level finding: GENCODE annotating the transcript is not evidence that
        the protein is made in human spermatids
proposed_new_terms:
- proposed_name: positive regulation of zymogen activation
  proposed_definition: >-
    Any process that increases the rate, frequency or extent of the proteolytic processing of an
    inactive enzyme to an active form.
  justification: >-
    GO has GO:0031638 zymogen activation and, for the negative direction, GO:0097341 zymogen
    inhibition ("any process that prevents the proteolytic processing of an inactive enzyme to an
    active form"), but no positive counterpart; the only available positive parent is the generic
    GO:0010954 positive regulation of protein processing. ACRBP is a clear use case in both
    directions: the same protein that holds proacrosin latent in the acrosome accelerates its
    autoactivation at basic pH in vitro and on acrosomal exocytosis, and there is currently no way
    to record the second half of that behaviour at zymogen-level specificity. The term would sit
    as a child of GO:0010954 and a sibling of GO:0097341.
- proposed_name: acrosomal granule assembly
  proposed_definition: >-
    The assembly of acrosomal proteins into the acrosomal granule, a single large dense body that
    forms within the acrosomal vesicle of round spermatids during early spermiogenesis and that
    subsequently spreads to become the acrosomal matrix.
  justification: >-
    The specific defect in ACRBP-null mouse spermatids is failure to form the large acrosomal
    granule, which then fragments the whole acrosome, and the rescue experiment assigns this step
    to one splice form. GO's nearest term, GO:0001675 acrosome assembly, is defined as "the
    formation of the acrosome from the spermatid Golgi" and does not cover the condensation of
    cargo into the granule; GO:0043159 acrosomal matrix exists as the corresponding cellular
    component, so the process term is the missing piece. A child of GO:0001675 would let the mouse
    phenotype, and any human ortholog inference from it, be recorded at the granularity the
    experiments actually achieved.
suggested_questions:
- question: >-
    GENCODE annotates ENST00000536350 at the human ACRBP locus - a 319-residue N-terminal-half
    product ending in RYRKF, structurally the counterpart of mouse ACRBP-V5 - while PMID:30606959
    states that human spermatogenic cells produce only the Acrbp-W mRNA. Which is right? The mouse
    counterpart is the predominant form in round spermatids and is the form that builds the
    acrosomal granule, so the answer decides whether the human acrosome-assembly annotation
    describes the human protein or only its mouse ortholog. If the RT-PCR negative holds, the human
    transcript model should be revisited.
  experts:
  - Tadashi Baba
  - Yoshinori Kanemori
- question: >-
    UniProt Q8NEB7 has no ALTERNATIVE PRODUCTS section, even though GENCODE annotates the
    intron-5 read-through transcript and the orthologous mouse and rat entries both carry two
    isoforms. Should the human entry gain the isoform, so that isoform-resolved GO annotation of
    this gene becomes possible at all?
  experts: []
- question: >-
    Does ACRBP accelerate or restrain proacrosin autoactivation in the human acrosome? The two
    directions were reported twenty-two years apart in different systems - acceleration for purified
    pig sp32 at basic pH, blockade for ACRBP-W expressed in mouse acrosomes - and the switch
    between them is presumably a physiological one (pH, calcium, or the tyrosine phosphorylation
    that accompanies capacitation). Which variable flips the sign?
  experts:
  - Tadashi Baba
- question: >-
    How does an acrosomal matrix protein with a cleaved signal peptide become accessible to
    antibodies on the outer surface of the boar sperm head before the acrosome reaction? Surface
    ACRBP contributes to sperm-zona binding in that system, but the route by which a lumenal
    protein reaches the outer face is unexplained, and it is what would justify any
    plasma-membrane annotation for this gene.
  experts:
  - Janice L. Bailey
- question: >-
    ACRBP is the cancer/testis antigen OY-TES-1/CT23 and is re-expressed in bladder, breast,
    liver, lung and colon cancers, where knockdown reportedly slows proliferation and migration.
    Is any of that mediated by the zymogen-binding activity characterised in sperm, or is the
    somatic phenotype unrelated to the protein's germline function? Nothing currently connects the
    two literatures mechanistically.
  experts:
  - Eiichi Nakayama
suggested_experiments:
- hypothesis: >-
    The intron-5 read-through ACRBP transcript is expressed and translated in human spermatids, so
    the human gene has the same isoform division of labour as mouse.
  description: >-
    Use long-read RNA sequencing of human testis to quantify the intron-5 read-through ACRBP
    transcript against the canonical one across spermatogenic stages, and raise an antibody to the
    RYRKF C-terminal neo-epitope, which is unique to the read-through product, for western
    blotting and immunofluorescence of human testis sections. This would convert the
    annotation-level finding in this review into evidence about the human protein, and directly
    tests whether the ACRBP-V5 role is conserved.
  experiment_type: long-read RNA sequencing and isoform-specific immunodetection
- hypothesis: >-
    The two halves of the human ACRBP precursor have distinct pro-ACR-binding activities, and the
    direction in which ACRBP affects proacrosin autoactivation is set by a physiological variable
    rather than being intrinsic.
  description: >-
    Express the human mature chain (residues 274-543) and the read-through product (residues
    1-319) separately, and measure their effects on autoactivation of recombinant human proacrosin
    as a function of pH, calcium and tyrosine phosphorylation state. This would establish the
    direction and the switch point of the regulation for the human protein, and test whether the
    two halves have the distinct binding activities the mouse pull-downs imply.
  experiment_type: in vitro reconstitution with recombinant proteins
- hypothesis: >-
    ACRBP resides in the acrosomal matrix rather than in the acrosomal membrane.
  description: >-
    Fractionate human or boar sperm acrosomes into matrix and membrane fractions and locate ACRBP
    by immunoblot, or use immuno-electron microscopy to place it relative to the inner and outer
    acrosomal membranes. The current membrane assignment rests on light-microscopy
    immunofluorescence, which cannot resolve the two, and this experiment would settle whether
    GO:0043159 or GO:0002080 is correct.
  experiment_type: subcellular fractionation and immuno-electron microscopy
- hypothesis: >-
    The proliferation phenotype of ACRBP knockdown in cancer cells is independent of the
    zymogen-binding activity that ACRBP performs in sperm.
  description: >-
    In a hepatocellular carcinoma line where ACRBP knockdown reduces proliferation, test whether
    the phenotype is rescued by wild-type ACRBP but not by a variant carrying substitutions in the
    pro-ACR-binding regions (26-106 and 319-427). Separation of rescue from binding would show the
    cancer phenotype is independent of the zymogen-binding function; co-dependence would be the
    first mechanistic link between the two ACRBP literatures.
  experiment_type: structure-function rescue in a knockdown background
