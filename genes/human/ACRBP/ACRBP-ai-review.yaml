id: Q8NEB7
gene_symbol: ACRBP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACRBP, also known as sp32 and as the cancer/testis antigen OY-TES-1/CT23, is a
  testis-restricted acrosomal matrix protein of the sperm head. It is synthesised in
  spermatocytes and spermatids as a ~60-kDa precursor carrying a cleaved N-terminal signal
  peptide, enters the secretory pathway, and accumulates in the acrosomal granule that
  condenses into the acrosomal matrix; during sperm maturation in the testis and epididymis
  the N-terminal half of the precursor is removed proteolytically to leave a ~32-kDa mature
  protein. Its defining biochemical property is selective recognition of the zymogen: it binds
  the precursor and intermediate forms of the sperm serine protease acrosin (proacrosin) but
  not the fully mature enzyme, and through this binding it controls when acrosin becomes
  active. Inside the intact acrosome it holds proacrosin as an enzymatically inactive zymogen;
  once the acrosome reaction is triggered, it accelerates proacrosin autoactivation, so its
  effect on the protease is a matter of timing rather than of steady inhibition or activation.
  Loss of the protein deforms the acrosome and leaves sperm unable to complete the acrosome
  reaction, causing severe male subfertility without affecting sperm number, head morphology or
  motility. ACRBP is tyrosine-phosphorylated during capacitation, a pool of it is accessible on
  the sperm-head surface where it contributes to binding of sperm to the zona pellucida, and
  maturation of the precursor is impaired in the absence of the proprotein convertase PCSK4.
  Outside the testis the protein is not normally expressed, but it is re-expressed in a wide
  range of carcinomas and is immunogenic in cancer patients, which is how it was first
  identified in humans.
