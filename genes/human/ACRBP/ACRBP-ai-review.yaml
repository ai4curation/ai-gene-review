- term:
    id: GO:0002080
    label: acrosomal membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Modified to GO:0043159 acrosomal matrix. The compartment is right at organelle level and
      wrong at sub-organelle level, and a better term exists.

      Traced back, this row transfers pig Q29016's GO:0002080 located_in, whose evidence is an
      IDA on PMID:15955892 - indirect immunofluorescence of pig sperm. Light microscopy of an
      organelle a few hundred nanometres across cannot separate the acrosomal matrix from the
      acrosomal membrane that bounds it, so the pig observation supports "in the acrosome" but not
      specifically "in the membrane". That is a resolution limit of the assay, not a curation
      error.

      What settles it is that ACRBP has no way to be in a bilayer. All five reviewed orthologs
      carry a cleaved signal peptide and none carries a transmembrane, intramembrane or
      lipidation feature; no mature sequence in the family reaches the hydrophobicity a
      membrane-spanning helix would need. The protein is translocated into the secretory pathway
      and stays soluble - which is how sp32 came to be purified in the first place, from acid
      extracts of ejaculated sperm. located_in GO:0002080 asserts residence in the membrane
      itself, and nothing supports that.

      GO:0043159 acrosomal matrix ("a structural framework, or 'dense core' at the interior of an
      acrosome") is the term the primary literature actually uses for this protein, is part_of
      GO:0001669, and captures the functionally relevant point: ACRBP is in the dense core with
      the proacrosin it packages and holds inactive. The same correction probably applies at the
      pig source, but that is for the pig entry's curator to judge from the full text.
    action: MODIFY
    reason: >-
      The organelle is correct but the sub-organelle compartment is not supported: an anchor-free,
      signal-peptide-bearing secretory protein cannot be located_in a membrane, and the pig IDA
      that this row transfers is an immunofluorescence localisation that cannot resolve matrix
      from membrane. GO:0043159 acrosomal matrix is both better supported and more informative,
      and is the description used in the primary literature.
    proposed_replacement_terms:
    - id: GO:0043159
      label: acrosomal matrix
    supported_by:
    - reference_id: PMID:27303034
      supporting_text: An acrosomal matrix protein, ACRBP, is known as a proacrosin-binding
        protein.
    - reference_id: PMID:8144514
      supporting_text: The binding of sp32 to proacrosin may be involved in packaging the acrosin
        zymogen into the acrosomal matrix.
    - reference_id: file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md
      supporting_text: every ACRBP ortholog is a signal-peptide-bearing, anchor-free secretory
        protein
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q29016
        source_label: ACRBP (Sus scrofa)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
