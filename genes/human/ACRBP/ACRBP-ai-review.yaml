- term:
    id: GO:0001675
    label: acrosome assembly
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Accepted, for the reasons set out at the GO_REF:0000107 row for this term: the mouse source
      is a whole-gene knockout IMP, so what transferred is a gene-level requirement, and the
      isoform-specificity objection resolves into a discrepancy rather than a refutation. Human
      ACRBP-204/ENST00000536350 is the same intron-5 read-through transcript at the sequence level,
      but PMID:30606959 reports experimentally that human spermatogenic cells make only the Acrbp-W
      mRNA - so the structural counterpart exists in the genome annotation while the primary
      literature says it is not transcribed.

      One additional point belongs on this manual row rather than on the automated one. UniProt's
      own FUNCTION comment for the mature form hedges the granule role ("Partially also
      contributes to the assembly of acrosomal proteins to form an acrosomal granule"), which is a
      fair reading: the 2016 rescue experiment shows ACRBP-V5 alone suffices, not that the mature
      form contributes nothing. The two annotated pro-ACR-binding regions of human ACRBP sit on
      opposite sides of the maturation cleavage - region 26-106 inside the removed propeptide and
      inside the V5-equivalent span, region 319-427 in the retained mature chain - so the granule
      role and the zymogen-retention role are carried by physically different parts of the
      precursor. That is a reason to keep the process annotation while proposing the molecular
      functions separately, not a reason to weaken it.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:27303034
      supporting_text: The acrosome malformation was rescued by transgenic expression of ACRBP-V5
        in ACRBP-null spermatids.
    - reference_id: PMID:23426433
      supporting_text: Glutathione S-transferase pull-down assays revealed that ACRBP-V5 and
        ACRBP-C possess a different domain capable of binding each of two segments in the
