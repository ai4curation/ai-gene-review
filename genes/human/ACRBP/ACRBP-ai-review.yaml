      is not self-referential; the target term (acrosomal vesicle, is_active_in) is the compartment
      in which every known ACRBP function occurs.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Mechanically correct mapping of SL-0243 "Secreted" to GO:0005576. The resulting annotation
      is true but uninformative for this gene, and is kept as non-core rather than challenged.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Compara's ortholog call agrees with PANTHER's: mouse Acrbp is the 1:1 ortholog of human
      ACRBP. All three terms transferred under this GO_REF derive from IMP annotations on the mouse
      whole-gene knockout (PMID:27303034), and all three duplicate manual UniProt ISS rows.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Third independent route to the correct acrosomal-vesicle compartment. Redundant with the IBA
      and the UniProt ISS, but not wrong.
- id: PMID:21630459
  title: Proteomic characterization of the human sperm nucleus.
  findings:
  - statement: >-
      A high-throughput proteome of human sperm nuclei identified 403 proteins, of which more than
      half had not been seen in previous human sperm proteomes; the authors report the nuclei were
      isolated to over 99.9% purity with no acrosome, tails or mitochondria.
    supporting_text: With this approach, 403 different proteins have been identified from the
      isolated sperm nuclei.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Correctly cited, and the mass-spectrometric identification is not disputed, but the paper is
      a catalogue rather than a localisation study and cannot support a nucleoplasmic assignment
      for a signal-peptide-bearing secretory protein whose organelle is physically apposed to the
      sperm nucleus. Basis for MARK_AS_OVER_ANNOTATED on GO:0005634, not for REMOVE.
- id: PMID:8144514
  title: An acrosomal protein, sp32, in mammalian sperm is a binding protein specific for two
    proacrosins and an acrosin intermediate.
  findings:
  - statement: >-
      sp32 purified from porcine sperm binds the 55-, 53- and 49-kDa (pro)acrosin forms but not
      the 43-kDa intermediate or the 35-kDa mature acrosin, accelerates proacrosin autoactivation
      at basic pH, and redirects the maturation pathway so that the 49-kDa intermediate
      accumulates.
    supporting_text: sp32 significantly accelerated autoactivation of proacrosin at a basic pH in
      vitro and affected the maturation pathway of proacrosin.
    reference_section_type: ABSTRACT
  - statement: >-
      sp32 is synthesised as a 61-kDa precursor with a signal peptide whose carboxyl-terminal half
      becomes the mature protein, and the authors propose that its binding to proacrosin packages
      the zymogen into the acrosomal matrix.
    supporting_text: The binding of sp32 to proacrosin may be involved in packaging the acrosin
      zymogen into the acrosomal matrix.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding biochemical characterisation of the family and the source of the binding
      specificity that GO:0035375 records. Abstract-only in the cache; the quoted claims are all
      in the abstract. Independently corroborated as the basis of MGI's mouse GO:0016504 ISA
      annotation, which cites this PMID with/from pig Q29016.
- id: PMID:11248070
  title: Identification of proacrosin binding protein sp32 precursor as a human cancer/testis
    antigen.
  findings:
  - statement: >-
      The human gene was isolated as OY-TES-1 and identified as the human homologue of the
      proacrosin binding protein sp32 precursor previously characterised in mouse, guinea pig and
      pig; the Discussion adds 81.9%, 77.2% and 75.2% identity to pig, guinea pig and mouse
      respectively, and places the maturation cleavage between residues 273 and 274.
    supporting_text: another gene, designated OY-TES-1, was isolated and found to be the human
      homologue of proacrosin binding protein sp32 precursor originally identified in mouse,
      guinea pig, and pig
    reference_section_type: ABSTRACT
  - statement: >-
      Expression is restricted to testis in normal tissues but occurs across a wide array of
      cancers, and 25 of 362 cancer patients had antibodies to the protein while none of 20 normal
      individuals did.
    supporting_text: In normal tissues, OY-TES-1 mRNA was expressed only in testis, whereas in
      malignant tissues, a variable proportion of a wide array of cancers, including bladder,
      breast, lung, liver, and colon cancers, expressed OY-TES-1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only primary human paper on this gene, and the source of the sequence-identity figures
      that license every ISS annotation on it. Full text available and read. It also records that
      Southern blotting suggested two OY-TES-1-related genes in the human genome, which is
      unresolved and noted in the gene notes as a caution rather than used here.
- id: PMID:23426433
  title: Two functional forms of ACRBP/sp32 are produced by pre-mRNA alternative splicing in the
    mouse.
  findings:
  - statement: >-
      Mouse Acrbp produces wild-type ACRBP-W, processed to mature ACRBP-C, and the intron
      5-retaining variant ACRBP-V5, described as absent from other mammalian ACRBPs; the two forms
      bind different segments of the pro-ACR C-terminus, and ACRBP-C accelerates pro-ACR
      autoactivation.
    supporting_text: Unlike other mammalian ACRBPs, two forms of Acrbp mRNA-wild-type Acrbp-W and
      variant Acrbp-V5 mRNAs-were generated by alternative splicing of Acrbp in the mouse.
    reference_section_type: ABSTRACT
  - statement: >-
      ACRBP-W and ACRBP-V5 colocalise with pro-ACR in the acrosomal granules of early round
      spermatids, whereas the mature sperm acrosome contains only ACRBP-C.
    supporting_text: ACRBP-W and ACRBP-V5 were both colocalized with pro-ACR in the acrosomal
      granules of early round spermatids, whereas the sperm acrosome contained only ACRBP-C.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and methodologically sound throughout, including the claim that the two-form
      arrangement is confined to mouse among the ACRBPs examined: that is an RT-PCR result rather
      than mere silence, and the same laboratory restates it for human explicitly in
      PMID:30606959. An earlier draft of this review marked the reference DISPUTED on the strength
      of the human ENST00000536350 annotation; that was wrong, because a genome annotation does not
      outrank an expression experiment on the question of what is transcribed. The finding in
      file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md is best read as an unreconciled discrepancy
      between GENCODE and this paper, recorded here as a knowledge gap rather than as a fault in
      the reference.
- id: PMID:27303034
  title: Biogenesis of sperm acrosome is regulated by pre-mRNA alternative splicing of Acrbp in
    the mouse.
  findings:
  - statement: >-
      Mice lacking both ACRBP forms are severely subfertile because the acrosome is malformed;
      spermatids fail to form a large acrosomal granule and the acrosome fragments. Transgenic
      ACRBP-V5 alone rescues the malformation, assigning granule formation to that form.
    supporting_text: The acrosome malformation was rescued by transgenic expression of ACRBP-V5 in
      ACRBP-null spermatids.
    reference_section_type: ABSTRACT
  - statement: >-
      Exogenously expressed ACRBP-W blocks proacrosin autoactivation in the acrosome, and the
      authors conclude that retaining proacrosin inactive until acrosomal exocytosis is its major
      function.
    supporting_text: The major function of ACRBP-W is to retain the inactive status of proacrosin
      in the acrosome until acrosomal exocytosis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of the mouse IMP annotations for acrosome assembly, spermatid development and
      fertilization that all six ortholog-transfer rows on this gene depend on. The knockout
      removes the whole gene, so those source annotations are gene-level; the isoform partition is
      a separate result within the same paper. Abstract-only in the cache; PMC restricts the full
      text, and all quotes used are from the abstract.
- id: PMID:30606959
  title: Behavior of ACRBP-deficient mouse sperm in the female reproductive tract.
  findings:
  - statement: >-
      ACRBP-deficient mouse sperm are fewer in the oviduct after mating but retain normal head
      morphology and motility, and show a marked reduction in the ability to reach unfertilized
      oocytes; the authors attribute the subfertility to an incomplete acrosome reaction rather
      than to impaired migration.
    supporting_text: These data suggest that male subfertility of ACRBP-deficient mice may be
      attributed to incompleteness of the acrosome reaction rather than impairment in sperm
      migration from the uterus to the oviduct.
    reference_section_type: ABSTRACT
  - statement: >-
      The introduction states the cross-species splicing situation directly: porcine, guinea pig
      and human spermatogenic cells produce only the wild-type Acrbp-W mRNA, whereas mouse produces
      both Acrbp-W and the intron 5-retaining Acrbp-V5. This is the clearest published statement of
      the human negative and it post-dates the knockout paper by three years.
    supporting_text: Porcine, guinea pig, and human spermatogenic cells produce only a single form
      of Acrbp (termed Acrbp-W) mRNA, whereas two mRNA forms, wild-type Acrbp-W and intron
      5-retaining variant Acrbp-V5 mRNAs, are synthesized by pre-mRNA alternative splicing of the
      Acrbp gene in mouse
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Resolves the mechanism behind the knockout's fertility defect
      and is the primary basis for the proposed GO:0060046 regulation of acrosome reaction
      annotation. The authors are explicit that the oviductal sperm-number deficit alone would
      have supported the opposite, migration-based interpretation, and they argue against it. Its
      introduction also carries the load-bearing statement of the human isoform negative, which an
      earlier draft of this review overlooked while citing the paper for other claims; that
      sentence is why the acrosome-assembly discussion here is framed as a discrepancy rather than
      as a refutation of PMID:23426433.
- id: PMID:34086710
  title: ACRBP (Sp32) is involved in priming sperm for the acrosome reaction and the binding of
    sperm to the zona pellucida in a porcine model.
  findings:
  - statement: >-
      Antibodies against ACRBP applied to pre-capacitated boar sperm reduce capacitation and
      spontaneous acrosome reaction, reduce sperm-zona pellucida binding, and reduce the response
      to solubilized zona pellucida or SERCA inhibition, indicating a surface-accessible pool of
      ACRBP that primes sperm for the acrosome reaction.
    supporting_text: Anti-ACRBP antibodies reduced capacitation and spontaneous AR (P<0.05).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Independent, acute-blockade support for a role in regulating
      the acrosome reaction, in a second species and by a different experimental logic from the
      mouse knockout. Its plasma-membrane implication was deliberately not carried into an
      annotation: how a lumenal, signal-peptide-bearing protein becomes surface-accessible is
      unexplained, and antibody accessibility is not a localisation assay.
- id: PMID:15955892
  title: The proacrosin binding protein, sp32, is tyrosine phosphorylated during capacitation of
    pig sperm.
  findings:
  - statement: >-
      The p32 tyrosine-phosphoprotein that appears in pig sperm during capacitation is sp32/ACRBP,
      identified by mass spectrometry and confirmed by immunoprecipitation and immunofluorescence;
      acrosomal labelling disappears after an ionophore-induced acrosome reaction.
    supporting_text: After ionophore treatment to induce the acrosome reaction, anti-sp32 and
      anti-phosphotyrosine labeling on the acrosome disappeared.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited. This is the source of pig ACRBP's GO:0002080 acrosomal membrane IDA, which
      the human ISS row transfers; the paper's method is indirect immunofluorescence, which cannot
      resolve acrosomal matrix from acrosomal membrane, and that resolution limit is the basis for
      the MODIFY on that row. Also the source of pig's GO:0048240 sperm capacitation TAS, which
      was not propagated to human here because it is author-statement evidence and no human data
      exist.
- id: PMID:22357636
  title: Alteration in the processing of the ACRBP/sp32 protein and sperm head/acrosome
    malformations in proprotein convertase 4 (PCSK4) null mice.
  findings:
  - statement: >-
      ACRBP is not proteolytically processed from its 58.5-kDa precursor to the 27.5-kDa mature
      form in PCSK4-null mice, proacrosin then fails to autoactivate, and sperm head/acrosome
      malformations appear; the authors note ACRBP lacks a strong convertase consensus site, so
      the processing enzyme may be downstream of PCSK4.
    supporting_text: Further analysis of spermatozoa from the PCSK4 null mice showed that
      proacrosin did not undergo autoactivation, supporting a role for the mature form of ACRBP in
      the regulation of proacrosin conversion into different acrosin isoforms.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, and used only for what it shows: that the mature form of ACRBP is required
      for proacrosin autoactivation in vivo. ACRBP is the substrate in this paper, not the agent,
      so no annotation for ACRBP follows from the PCSK4 relationship itself. The authors' own hedge
      that ACRBP lacks a convertase consensus site is recorded in the gene notes.
- id: file:human/ACRBP/ACRBP-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACRBP (human)
  findings:
  - statement: >-
      Summarises ACRBP as an acrosomal matrix protein controlling the packaging and timed
      activation of proacrosin, and separates that from a second, weakly supported literature in
      which ACRBP/OY-TES-1/CT23 knockdown affects proliferation and migration in somatic cells.
    supporting_text: >-
      A separate body of low-confidence work links ACRBP/OY-TES-1/CT23 knockdown to proliferation,
      migration, and apoptosis phenotypes in mesenchymal stem cells and hepatocellular carcinoma
      lines, but this somatic role has not been mechanistically resolved in the available corpus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Machine-generated preliminary source with self_evaluation_pairwise win and all twelve citations
      resolving to numeric PubMed identifiers; its dated findings were checked against the primary
      abstracts and none was found to misstate them, and its own confidence grading correctly
      separates the reproductive literature from the low-confidence cancer-cell knockdown work.
      Cited here only as corroboration alongside primary quotations, never as the sole support for
      a mechanistic claim. Its own GO grounding was deliberately not imported: GO:0005886 plasma
      membrane rests only on the boar antibody-accessibility experiment, and GO:0140313 molecular
      sequestering activity frames the activity as sequestration when the primary papers describe
      modulation of zymogen autoactivation in both directions.
- id: file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md
  title: Does human ACRBP have a counterpart of the 'rodent-specific' ACRBP-V5 isoform?
  findings:
  - statement: >-
      The human ACRBP locus carries an annotated protein-coding transcript, ACRBP-204 /
      ENST00000536350, that is the same intron-5 read-through event as mouse ACRBP-V5: both keep
      the first five canonical exons with the terminal exon extended past the exon-5 donor site
      into intron 5, both terminate at equivalent positions, and both replace the canonical SLxQL
      pentapeptide with an RYRK-initiated tail.
    supporting_text: The human and mouse variants read through the same intron, terminate at
      equivalent positions, and both replace the canonical S-L-x-Q-L pentapeptide with
      `RYRK`-initiated basic tails that differ only in the final residue.
  - statement: >-
      All five reviewed ACRBP orthologs carry a cleaved signal peptide and none carries a
      transmembrane, intramembrane or lipidation feature, supporting a soluble acrosomal matrix
      assignment over acrosomal membrane.
    supporting_text: every ACRBP ortholog is a signal-peptide-bearing, anchor-free secretory
      protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis performed for this review; all figures fetched live from the UniProt and Ensembl
      REST APIs with raw responses cached, and the report regenerates byte-identically from both
      the cache and a fresh refetch. It was written to support the hypothesis that GO:0001675
      acrosome assembly is a rodent-isoform-specific over-annotation in human, and it falsified the
      sequence-level premise of that hypothesis: the human locus does carry a structurally
      equivalent intron-5 read-through transcript. It does not touch the expression-level premise,
      which PMID:30606959 reports experimentally and against the human transcript, and the report
      records that in the three limits at the end of Part 2b. Read on its own it would overstate
      the case, which is why it is cited alongside that PMID everywhere it is used.
