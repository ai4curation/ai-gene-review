- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Kept, but as a non-core location. The keyword mapping is faithful - UniProt does record
      "Secreted" for Q8NEB7 - and the underlying biology is real rather than an artefact: the
      acrosome is a secretory, lysosome-derived vesicle, and its contents are discharged to the
      outside of the sperm during the acrosome reaction. In pig this has been observed directly,
      with acrosomal sp32 labelling disappearing after an induced acrosome reaction, and sp32
      being recoverable from ejaculated sperm.

      It is non-core for two reasons. GO:0005576 is a very general term that says only "outside
      the cell", which for a protein whose entire working life is spent inside one organelle is
      the least informative thing one can say about it; and the extracellular state is terminal
      and transient - it is where the protein ends up after the compartment it functions in has
      been discharged, not where it acts.
    action: KEEP_AS_NON_CORE
    reason: >-
      Faithful keyword mapping of a genuine post-exocytosis fate, but an uninformative parent
      term describing the aftermath of ACRBP's function rather than its site of action. Retained
      for completeness and excluded from core_functions.locations.
    supported_by:
    - reference_id: PMID:15955892
      supporting_text: After ionophore treatment to induce the acrosome reaction, anti-sp32 and
        anti-phosphotyrosine labeling on the acrosome disappeared.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0243
        source_label: Secreted
        source_status: SUPPORTS_TRANSFER
        comment: Maps to GO:0005576. The UniProt "Secreted" line for Q8NEB7 is ECO:0000250 from
          pig Q29016, which carries its own GO:0005576 IDA and EXP annotations.
- term:
    id: GO:0001675
    label: acrosome assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Accepted, after a specific objection to it was tested and failed.

      The source is strong: mouse Acrbp carries GO:0001675 IMP on PMID:27303034, a knockout in
      which spermatids fail to form the large acrosomal granule and the acrosome ends up
      fragmented. The knockout removes the whole gene, so the mouse annotation is gene-level.

      The objection is that the 2016 paper partitions the phenotype between two mouse splice
      forms and assigns the granule-forming role specifically to ACRBP-V5, which the same group
      had described as a variant not found in other mammalian ACRBPs. If human ACRBP made
      nothing equivalent to ACRBP-V5, the transferred process would have no vehicle in human and
      this row would be an over-annotation. That was the working hypothesis for this review.

      The objection has two halves, and they come apart. At the level of genome sequence it
      fails: the human ACRBP locus carries an annotated protein-coding transcript, ACRBP-204 /
      ENST00000536350, whose exon chain is the first five canonical exons with the terminal exon
      extended 82 bp past the exon-5 donor site into intron 5 - the same architecture as the mouse
      ACRBP-V5 transcript Acrbp-205, whose terminal exon extends 242 bp into intron 5. The
      consequence on the protein is the same substitution at the equivalent position: human SLLQL
      to RYRKF at 315-319, mouse SLQQL to RYRKL at 312-316, the latter being exactly UniProt's
      VSP_051965/VSP_051966 for ACRBP-V5. So the human genome does encode a structural counterpart
      of ACRBP-V5, and the splicing event is not a rodent invention.

      At the level of expression the objection stands, and more firmly than the 2013 paper alone
      implies. The same laboratory states the human negative outright three years after the
      knockout paper: porcine, guinea pig and human spermatogenic cells produce only the Acrbp-W
      mRNA, while mouse makes both. That is an RT-PCR claim about what is transcribed, and it
      outranks a genome annotation on exactly that question. The honest summary is therefore a
      discrepancy rather than a refutation - GENCODE annotates a transcript the primary literature
      reports as absent from human spermatogenic cells, and nobody has looked for its protein.

      The term is still accepted, but for a reason independent of the isoform argument: the mouse
      source is an IMP on a knockout of the whole gene, ablating both forms, so what transferred is
      a gene-level requirement for normal acrosome formation rather than a V5-specific activity.
      UniProt's curator reading of the same full text credits the mature form with partially
      contributing to acrosomal-granule assembly. The residual uncertainty is recorded as a
      knowledge gap, not discharged by this row.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:27303034
      supporting_text: Notably, ACRBP-null spermatids failed to form a large acrosomal granule,
        leading to the fragmented structure of the acrosome.
    - reference_id: PMID:23426433
      supporting_text: Unlike other mammalian ACRBPs, two forms of Acrbp mRNA-wild-type Acrbp-W
        and variant Acrbp-V5 mRNAs-were generated by alternative splicing of Acrbp in the mouse.
    - reference_id: PMID:30606959
      supporting_text: Porcine, guinea pig, and human spermatogenic cells produce only a single
        form of Acrbp (termed Acrbp-W) mRNA, whereas two mRNA forms, wild-type Acrbp-W and intron
        5-retaining variant Acrbp-V5 mRNAs, are synthesized by pre-mRNA alternative splicing of
        the Acrbp gene in mouse
    - reference_id: file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md
      supporting_text: The human and mouse variants read through the same intron, terminate at
        equivalent positions, and both replace the canonical S-L-x-Q-L pentapeptide with
        `RYRK`-initiated basic tails that differ only in the final residue.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q3V140
        source_label: Acrbp (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Donor carries GO:0001675 IMP on PMID:27303034 from a whole-gene knockout, so the
          source annotation is gene-level rather than isoform-restricted. The apparent
          isoform-specificity of the underlying mechanism was tested and does not block transfer.
      - source_id: ensembl:ENSMUSP00000085632
        source_label: Acrbp protein (Mus musculus, Ensembl Compara)
        source_status: SUPPORTS_TRANSFER
        comment: Same gene as Q3V140; Compara ortholog call agrees with the 1:1 orthology in
          PANTHER PTHR21362.
