    - reference_id: PMID:30606959
      supporting_text: Porcine, guinea pig, and human spermatogenic cells produce only a single
        form of Acrbp (termed Acrbp-W) mRNA, whereas two mRNA forms, wild-type Acrbp-W and intron
        5-retaining variant Acrbp-V5 mRNAs, are synthesized by pre-mRNA alternative splicing of
        the Acrbp gene in mouse
    - reference_id: file:human/ACRBP/ACRBP-bioinformatics/RESULTS.md
      supporting_text: the human ACRBP locus does carry a structural counterpart of the
        'rodent-specific' ACRBP-V5
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q3V140
        source_label: Acrbp (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Donor carries GO:0001675 IMP on PMID:27303034 from a knockout of the whole gene.
