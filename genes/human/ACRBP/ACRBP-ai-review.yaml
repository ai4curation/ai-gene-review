    summary: >-
      Accepted. The mouse source is GO:0009566 IMP on PMID:27303034, and the mechanism behind
      that phenotype was subsequently pinned down: ACRBP-deficient sperm reach the oviduct with
      normal head morphology and normal motility but cannot gain access to unfertilized oocytes,
