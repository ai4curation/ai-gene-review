- id: file:human/ARFRP1/ARFRP1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARFRP1 (human)
  findings:
  - statement: >-
      Synthesizes human ARFRP1 as a NatC/Sys1-targeted trans-Golgi/TGN GTPase initiating a
      bifurcated ARL1-golgin and ARL5-GARP retrograde tethering cascade as well as anterograde
      export of VSV-G, E-cadherin, GLUT2/GLUT4, SNAP25 (via GOPC), and nascent lipoproteins.
    supporting_text: >-
      ARFRP1 is a trans-Golgi/TGN-localized ARF-like GTPase that acts as a master regulator of
      membrane trafficking by initiating a bifurcated GTPase cascade at the TGN [PMID:16129887,
      PMID:31575603].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Summary: External Cheeseman Lab Affinage synthesis passed all automated trust gates
      (uniprot_accession: Q13795, self_evaluation_pairwise: win, faith_pct: 100.0, 15
      discoveries across 14 valid PubMed IDs plus 1 bioRxiv pseudo-PMID token). Verdict
      rationale: Marked VERIFIED because all 14 PubMed-anchored mechanistic claims check out
      against cached primary literature, and the report cleanly avoids the classic ARL3
      homonym trap between yeast ARL3 (ortholog of human ARFRP1) and human ciliary ARL3
      (P36405). Strengths: Faithful coverage of NatC/Sys1 GTP-independent N-terminal helix
      targeting (PMID:28356483, PMID:32972971), the bifurcated ARL1-golgin and ARL5-GARP
      cascade (PMID:31575603), E-cadherin and VSV-G export (PMID:18662990, PMID:19224922),
      GOPC-SNAP25 insulin secretion (PMID:33359402), and tissue-specific mouse knockout lipid
      and glucose phenotypes. Weaknesses: (1) None of Affinage's coarse goslim_generic GO/Reactome
      groundings (GO:0098772 molecular function regulator activity, R-HSA-1430728 Metabolism)
      were imported, since ARFRP1 acts via membrane recruitment rather than demonstrated direct
      catalytic GEF/GAP regulation; (2) finding 15 cites an unpeer-reviewed bioRxiv preprint
      via non-PubMed token PMID:bio_10.1101_2025.09.09.675133 (JTB complex), which was excluded
      and never treated as a PubMed ID; (3) omits the founding 1995 human/rat cloning and
      intrinsic GTPase assay paper (PMID:8530503), the 2004 Behnia/Setty discovery of hSys1
      and NatC targeting (PMID:15077113, PMID:15077114), AP-1-mediated Vangl2 sorting
      (PMID:23326640, PMID:29666182), and HCV NS5A/SNAP23 recruitment (PMID:27550144).
