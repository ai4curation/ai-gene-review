core_functions:
- description: >-
    Trans-Golgi network small GTPase switch that binds and hydrolyzes GTP on the cytoplasmic
    leaflet of the TGN membrane (anchored via NatC-acetylated Met1-Tyr2 binding to integral
    receptor SYS1) to initiate a bifurcated cascade recruiting ARL1/GRIP-domain golgins and
    ARL5/GARP for endosome-to-TGN retrograde carrier tethering and cooperating with AP-1 and
    GOPC for selective TGN-to-plasma-membrane cargo export.
