id: Q13795
gene_symbol: ARFRP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADP-ribosylation factor-related protein 1 (ARFRP1; historically termed ARP) is a 201-residue
  monomeric Ras/Arf-superfamily small GTPase localized to the cytoplasmic face of the
  trans-Golgi network (TGN). Unlike canonical Gly2-myristoylated Arf GTPases, ARFRP1 possesses
  an N-terminal amphipathic helix beginning with Met1-Tyr2 that is co-translationally
  N-alpha-acetylated on Met1 by the heterotrimeric NatC acetyltransferase complex (NAA30,
  NAA35, NAA38), enabling nucleotide-independent docking onto the multipass Golgi integral
  membrane receptor SYS1. In its active GTP-bound state at the TGN, ARFRP1 initiates a
  bifurcated GTPase cascade upstream of ARL1 and ARL5—which respectively recruit GRIP-domain
  golgins (GOLGA1/golgin-97, GOLGA4/golgin-245, GCC1, GCC2) for carrier capture and the GARP
  tethering complex for SNARE-mediated fusion—to drive retrograde transport of endosomal
  cargoes to the TGN. In parallel, ARFRP1 cooperates with clathrin adaptor AP-1, scaffolding
  protein GOPC, and the ARL1-Golgin-245-RAB2 axis to direct selective anterograde TGN export
  and maturation of cell-surface and secretory cargoes including E-cadherin, planar-cell-polarity
  protein VANGL2, glucose transporters GLUT2 and GLUT4, SNAP25, and nascent intestinal
  chylomicrons and hepatic VLDL particles. Note that Saccharomyces cerevisiae ARL3 (Arl3p) is
  the direct ortholog of human ARFRP1, whereas human ARL3 is a distinct ciliary GTPase.
