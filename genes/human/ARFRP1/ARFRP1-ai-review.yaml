suggested_questions:
- question: >-
    Which guanine nucleotide exchange factor(s) (GEFs) and GTPase-activating protein(s) (GAPs)
    catalyze nucleotide exchange on SYS1-bound ARFRP1 at the human TGN, and does GTP-bound
    ARFRP1 recruit ARL1 and ARL5 by recruiting a shared or dedicated GEF?
- question: >-
    Do the alternatively spliced human ARFRP1 isoforms lacking the N-terminal NatC/SYS1-binding
    helix (isoform 3, Q13795-3) or C-terminal GTPase segments (isoforms 2 and 4) accumulate
    as stable proteins in vivo?
suggested_experiments:
- description: >-
    Perform proximity-labeling proteomics (TurboID) comparing wild-type, GDP-locked T31N, and
    GTP-locked Q79L ARFRP1 knocked into the endogenous locus in SYS1-proficient vs SYS1-KO
    cells, coupled to biochemical GEF/GAP reconstitution assays with purified liposome-reconstituted
    Ac-ARFRP1, ARL1, and ARL5.
