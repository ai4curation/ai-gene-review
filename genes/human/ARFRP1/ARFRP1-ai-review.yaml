- id: PMID:16129887
  title: Roles of ARFRP1 (ADP-ribosylation factor-related protein 1) in post-Golgi membrane trafficking.
  findings:
  - statement: >-
      Demonstrated that human ARFRP1 localizes predominantly to the trans-Golgi and TGN,
      recruits ARL1 and GRIP golgins (golgin-97, golgin-245), and participates in both
      anterograde VSV-G export and retrograde TGN38/Shiga toxin transport.
    supporting_text: >-
      In the present study, we demonstrate that ARFRP1 is associated mainly with the
      trans-Golgi compartment and the trans-Golgi network (TGN) and is an essential regulatory
      factor for targeting of Arl1 and GRIP domain-containing proteins, golgin-97 and
      golgin-245, onto Golgi membranes.
