- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:32320651
  review:
    summary: >-
      The 2020 study establishes ACAD9-dependent MCIA stability and assembly, but the precise adaptor mechanism
      assigned by this IDA remains unresolved.
    action: UNDECIDED
    reason: >-
      The full 2020 paper was inspected through the author-institution PDF: it establishes ACAD9-dependent
      MCIA integrity and assembly-intermediate association. These results do not identify two distinct macromolecules
      directly bridged by ACAD9. In PMID:33320993, ECSIT is the experimentally resolved bridge and no direct
      ACAD9-NDUFAF1 interaction was observed. GO:0030674 requires bringing macromolecules together; MCIA membership
      alone does not settle that specific mechanism. Preserve the curator assertion as UNDECIDED without declaring
      it erroneous or substituting a scaffold function. Complex membership and participation in complex I assembly
      remain established.
    supported_by:
    - reference_id: PMID:32320651
      supporting_text: "while each MCIA component is critical for complex I assembly, a hierarchy of stability exists
        centered on ACAD9"
    - reference_id: PMID:33320993
      supporting_text: No direct interaction between NDUFAF1 and ACAD9 was observed
- term:
    id: GO:0160295
    label: mitochondrial complex I intermediate assembly complex
  evidence_type: IDA
  original_reference_id: PMID:33320993
  review:
    summary: >-
      IDA annotation from FlyBase based on Giachin et al. 2021. This study provided extensive
      structural and biochemical evidence that ACAD9 is a core component of the MCIA complex,
      including cryo-EM structures, SAXS, native MS, and SEC-MALLS data demonstrating stable
      ACAD9-ECSIT complexes.
    action: ACCEPT
    reason: >-
      ACAD9 is unequivocally a component of the MCIA complex. Giachin et al. demonstrated
      formation of the ACAD9-ECSIT binary complex by multiple biophysical methods and showed
      ECSIT binds the vestigial dehydrogenase domain of ACAD9 (PMID:33320993). This is a core
      annotation for ACAD9.
    supported_by:
    - reference_id: PMID:33320993
      supporting_text: "ECSIT functions as the bridging node of the MCIA core complex"
    - reference_id: PMID:33320993
      supporting_text: "the C-terminal domain of ECSIT directly binds to the vestigial dehydrogenase domain of the
        FAO enzyme ACAD9 and induces its deflavination"

