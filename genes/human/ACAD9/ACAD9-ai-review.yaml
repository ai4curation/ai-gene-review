- id: PMID:25721401
  title: Complex I assembly function and fatty acid oxidation enzyme activity of ACAD9 both contribute to
    disease severity in ACAD9 deficiency.
  findings:
  - statement: >-
      ACAD9 knockout in two human HEK293 clones reduced palmitate oxidation and palmitoyl-CoA activity by 35-40%,
      with preserved octanoate oxidation and rescue by wild-type ACAD9. Residual recombinant mutant activity
      correlated with severity in a patient series; this does not establish every tissue-specific causal contribution.
    supporting_text: both cell lines exhibited a 35–40% decrease in whole-cell palmitate oxidation and
      palmitoyl-CoA ACAD activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full existing cache inspected and identity cross-checked against the primary PMC and
      author-institution PDF, DOI10.1093/hmg/ddv074. Distinguish human knockout/rescue, mouse double-knockout
      fibroblasts and recombinant human variant assays.
