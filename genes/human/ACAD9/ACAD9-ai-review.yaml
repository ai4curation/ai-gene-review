- id: PMID:16020546
  title: >-
    Human acyl-CoA dehydrogenase-9 plays a novel role in the mitochondrial beta-oxidation
    of unsaturated fatty acids.
  findings:
  - statement: >-
      ACAD9 is a mitochondrial membrane-associated homodimer with long-chain acyl-CoA
      dehydrogenase activity, maximal toward unsaturated C16-C22 substrates.
    supporting_text: >-
      Purified mature ACAD-9 had maximal activity with long-chain unsaturated acyl-CoAs
      as substrates (C16:1-, C18:1-, C18:2-, C22:6-CoA).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached primary abstract directly supports long-chain substrate preference, mitochondrial processing/membrane
      association, and dimerization. The full substrate/kinetics panel was not recovered after a failed supported
      fetch and publisher access attempt; secondary curated medium-chain assignments are explicitly distinguished.
  full_text_unavailable: true
- id: PMID:20816094
  title: >-
    Acyl-CoA dehydrogenase 9 is required for the biogenesis of oxidative phosphorylation
    complex I.
  findings:
  - statement: >-
      The study establishes ACAD9 association with complex I assembly factors and a requirement for assembly.
      It reported no disturbed long-chain FAO in its tested disease models; this is not a universal exclusion
      of FAO involvement.
    supporting_text: >-
      ACAD9 binds complex I assembly factors NDUFAF1 and Ecsit and is specifically required
      for the assembly of complex I. Furthermore, ACAD9 mutations result in complex I
      deficiency and not in disturbed long-chain fatty acid oxidation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached primary abstract supports ACAD9 assembly-factor interactions and complex I deficiency. Scope the
      negative FAO finding to this study rather than every cell type or variant.
