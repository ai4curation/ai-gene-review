- term:
    id: GO:0017099
    label: very-long-chain fatty acyl-CoA dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:33320993
  review:
    summary: >-
      PMID:33320993 demonstrates ACAD9 dehydrogenation using palmitoyl-CoA (C16:0) in a ETF fluorescence reduction
      assay. This supports long-chain fatty acyl-CoA dehydrogenase activity.
    action: MODIFY
    reason: >-
      The source assay measures a C16 substrate. The verified GO definitions distinguish long-chain substrates (13-22
      carbons; GO:0004466) from very-long-chain substrates (more than 22 carbons; GO:0017099). Replace the term
      with the activity actually demonstrated by this source. This is an evidence-scope correction, not proof that
      ACAD9 can never use longer substrates. Relative activity versus the protein named VLCAD and an unvalidated
      substrate-channel prediction do not determine this GO chain-length classification. Comparator ACADVL also
      carries GO:0017099 in its cached curated record, including IDA PMID:9461620, whose abstract describes palmitoyl-CoA
      assays. This reveals a possible difference between enzyme-class usage and the explicit chain-length definition;
      the present replacement follows the demonstrated ACAD9 substrate and does not assert that the comparator annotation
      is erroneous.
    proposed_replacement_terms:
    - id: GO:0004466
      label: long-chain fatty acyl-CoA dehydrogenase activity
    supported_by:
    - reference_id: PMID:33320993
      supporting_text: "After addition of the ACAD specific substrate palmitoyl-CoA (C16:0), there is a clear loss
        of ETF fluorescence in ACAD9 alone"
    - reference_id: PMID:16020546
      supporting_text: "Purified mature ACAD-9 had maximal activity with long-chain unsaturated acyl-CoAs as substrates
        (C16:1-, C18:1-, C18:2-, C22:6-CoA)"
    additional_reference_ids:
    - PMID:9461620
    - file:human/ACADVL/ACADVL-uniprot.txt
