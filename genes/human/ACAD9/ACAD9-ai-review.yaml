        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT ancestral assertion is compatible with retained ACAD9 dehydrogenase chemistry, directly
          demonstrated in human protein. The target among descendant evidence is legitimate experimental grounding,
          not circularity. The ancestral tree and alignment were not independently reconstructed; no target-specific
          catalytic loss contradicts this broad IBA.
