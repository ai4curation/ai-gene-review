id: Q9H845
gene_symbol: ACAD9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACAD9 is a mitochondrial homodimer with distinct roles in respiratory complex I assembly and fatty acid oxidation.
  At the matrix face of the inner mitochondrial membrane, it is a core component of the mitochondrial complex I
  intermediate assembly (MCIA) complex with ECSIT and NDUFAF1 and supports formation of the ND2 membrane-arm module.
  ECSIT binding induces FAD release and inhibits the dehydrogenase activity of the bound ACAD9. In its FAD-containing
  state, ACAD9 catalyzes acyl-CoA dehydrogenation, including long-chain unsaturated substrates, at the first step
  of mitochondrial beta-oxidation. Its contribution to fatty acid oxidation depends on cell context and relative
  expression of other acyl-CoA dehydrogenases. Biallelic pathogenic variants cause mitochondrial complex I deficiency;
  impaired fatty acid oxidation can also contribute to the phenotype.
existing_annotations:
- term:
    id: GO:0003995
    label: acyl-CoA dehydrogenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      ACAD9 is a bona fide acyl-CoA dehydrogenase, belonging to the ACAD family and retaining
      catalytic activity for the alpha,beta-dehydrogenation of fatty acyl-CoA substrates. The IBA
      annotation is phylogenetically inferred and well-supported by direct biochemical data from
      multiple publications (PMID:16020546, PMID:34646991, PMID:38086790). This is an appropriate
      level of specificity for the IBA evidence code.
    action: ACCEPT
    reason: >-
      ACAD9 has experimentally demonstrated acyl-CoA dehydrogenase activity. Purified ACAD9 shows
      dehydrogenation activity of 83 min-1 with palmitoyl-CoA as substrate (PMID:34646991). The
      IBA annotation at the general acyl-CoA dehydrogenase level is appropriate given phylogenetic
      support across the ACAD family.
    supported_by:
    - reference_id: PMID:34646991
      supporting_text: "As purified, the wild-type ACAD9 protein has a dehydrogenation activity of 83 min-1, attributable
        to the FAD-containing holo-form of the protein"
    - reference_id: PMID:16020546
      supporting_text: "Purified mature ACAD-9 had maximal activity with long-chain unsaturated acyl-CoAs as substrates
        (C16:1-, C18:1-, C18:2-, C22:6-CoA)"

    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
