core_functions:
- directly_involved_in:
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  in_complex:
    id: GO:0160295
    label: mitochondrial complex I intermediate assembly complex
  description: >-
    Promotes mitochondrial complex I assembly as a core MCIA component required for the stability of other assembly
    factors and formation of the ND2-module at the inner membrane. ACAD9 binds ECSIT; ECSIT connects it to NDUFAF1
    and induces deflavination.
  supported_by:
  - reference_id: PMID:20816094
    supporting_text: "ACAD9 binds complex I assembly factors NDUFAF1 and Ecsit and is specifically required for
      the assembly of complex I"
  - reference_id: PMID:32320651
    supporting_text: "while each MCIA component is critical for complex I assembly, a hierarchy of stability exists
      centered on ACAD9"
  - reference_id: PMID:38086790
    supporting_text: "ECSIT binding induces a major conformational change in the FAD-binding loop of ACAD9, releasing
      the FAD cofactor and converting ACAD9 from a fatty acid beta-oxidation (FAO) enzyme to a CI assembly factor"

  knowledge_gaps:
  - gap_statement: >-
      The examined evidence establishes ACAD9-dependent assembly stabilization but does not resolve which precise
      molecular-function term represents that contribution, including whether ACAD9 itself bridges two macromolecules
      as GO:0030674 requires.
    boundary: >-
      Complex I assembly dependence, ACAD9-ECSIT association, an ACAD9-centered stability hierarchy and ECSIT-induced
      deflavination are established. ECSIT is the demonstrated bridge to NDUFAF1; binding and stability phenotypes
      alone do not identify an ACAD9 adaptor or scaffold activity.
    dark_aspect: MF_DARK
    status: OPEN
    resolution: >-
      Directly define the simultaneous molecular contacts and their causal contribution to assembly-intermediate
      stabilization, then determine the matching molecular-function annotation.
    provenance:
    - reference_id: PMID:33320993
      supporting_text: No direct interaction between NDUFAF1 and ACAD9 was observed
    - reference_id: PMID:32320651
      supporting_text: while each MCIA component is critical for complex I assembly, a hierarchy of stability
        exists centered on ACAD9
- molecular_function:
    id: GO:0004466
    label: long-chain fatty acyl-CoA dehydrogenase activity
  directly_involved_in:
  - id: GO:0006635
    label: fatty acid beta-oxidation
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  description: >-
    Catalyzes FAD-dependent dehydrogenation of long-chain fatty acyl-CoA substrates at the first step of mitochondrial
    beta-oxidation. This includes experimentally tested unsaturated C16-C22 substrates. The enzymatic state
    is inhibited by ECSIT binding and FAD release. Human-cell knockout/rescue evidence supports a physiological
    FAO contribution, whose magnitude depends on cellular context; a single assay ratio relative to VLCAD is
    not a universal measure of importance.
  supported_by:
  - *id001
  - *id002
  - *id003
proposed_new_terms: []

suggested_questions:
- question: >-
    What is the relative abundance of ACAD9 in its FAO (holo, FAD-bound) vs. CI assembly
    (apo, ECSIT-bound) states in different human tissues? Current understanding is based
    primarily on in vitro reconstitution, and the relative partitioning between FAO and
    assembly functions in vivo remains poorly quantified.

- question: >-
    How much of ACAD9-deficiency severity reflects impaired fatty acid oxidation in individual tissues, separately
    from complex I assembly? PMID:25721401 supports a contribution but variant severity correlations and HEK293
    rescue do not quantify its contribution in every affected tissue.

- question: Which macromolecules does ACAD9 itself bring together during complex I assembly, and what
    experiment distinguishes an adaptor or scaffold mechanism from stabilization of an ECSIT-connected
    complex?
- question: >-
    Should GO:0017099 be applied strictly by its more-than-22-carbon substrate definition or by the historical VLCAD
    enzyme class? Human ACADVL carries this term with IDA PMID:9461620, whose abstract describes C16 palmitoyl-CoA
    assays, whereas the examined ACAD9 assays demonstrate C16 chemistry. Clarifying the convention would reconcile
    annotations without inferring an inability of either protein to act on longer substrates.
suggested_experiments:
- description: >-
    Quantitative proteomics to measure the fraction of ACAD9 in ECSIT-bound (assembly) vs.
    free (FAO-competent) states across human tissues, especially brain regions. This would
    clarify the in vivo partitioning of ACAD9 between its two mutually exclusive functions.

