      matched record is explicitly MI:1314 proximity-dependent biotin identification with
      MI:2364 proximity. The full primary Discussion states that the method also labels noninteracting
      nearby proteins. This is an assay-resolution uncertainty, not absence of target data
      or proof that these proteins cannot bind. The four unmatched accessions are O60869,
      O75127, P07099 and P60709; an empty query result is not negative evidence. Preserve
      all original assertions and source fields, keep the positive proximity findings, and
      leave the source-specific binding claim unresolved. Independent binding evidence from
