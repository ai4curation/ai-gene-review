gene_symbol: CFTR
aliases:
- ABCC7
- ABC35
- CF
- MRP7
- TNR-CFTR
- dJ760C5.1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFTR is a membrane anion channel of the ATP-binding cassette protein family.
  Phosphorylation and ATP-dependent conformational cycling regulate its pore, which conducts
  chloride and bicarbonate down their electrochemical gradients. Its ATPase activity controls
  gating rather than pumping anions against a gradient. At epithelial apical membranes, CFTR
  supports salt, fluid and bicarbonate transport; tissue-specific consequences include airway
  surface hydration, pancreatic and intestinal secretion, and sweat-duct salt handling. Cytosolic
  terminal and regulatory regions engage trafficking adaptors, chaperones and regulatory proteins.
  The channel cycles through biosynthetic and endosomal compartments, and misfolded forms
  can be retained in the endoplasmic reticulum and eliminated through quality-control pathways.
  Pathogenic variants cause cystic fibrosis; the common F508del variant disrupts folding and
  cell-surface delivery, reducing epithelial anion secretion.
