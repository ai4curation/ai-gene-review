- id: file:human/CFTR/CFTR-source-evidence.json
  title: CFTR source projection, literal interaction evidence, ontology and primary-access
    audit
  findings:
  - statement: This review adjudicates the 203 historical machine assertions from the preserved
      448-row GOA snapshot. A separate genuine normal fetch produced 539 deduplicated source
      objects from 540 raw rows; that expanded projection is archived for a later source-migration
      review and is not silently substituted here. No claim of reviewing all current GOA assertions
      is made.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Literal source projection, raw interaction/worksheet fields, official ontology/domain
      records, provenance hashes and bounded primary-access ledger. This artifact is not an
      additional experiment.
core_functions:
- description: Conducts chloride through an ATP-gated membrane pore, principally at epithelial
    apical surfaces. Phosphorylation and ATP-dependent gating control permeability while chloride
    follows its electrochemical gradient; this is not primary active anion pumping.
  molecular_function:
    id: GO:0005260
    label: intracellularly ATP-gated chloride channel activity
  directly_involved_in:
  - id: GO:1902476
    label: chloride transmembrane transport
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:8910473
    supporting_text: CFTR utilizes ATP to gate its channel activity
  - reference_id: PMID:19621064
    supporting_text: CFTR delivery to 25% of surface epithelial cells restores normal rates of mucus transport
- description: Conducts bicarbonate through the same anion pore, contributing to epithelial
    bicarbonate secretion. Human-protein inside-out patch assays establish direct permeation;
    dynamic external-chloride selectivity proposed in oocytes is distinguished from invariant
    selectivity under the later tested conditions.
  molecular_function:
    id: GO:0160133
    label: bicarbonate channel activity
  directly_involved_in:
  - id: GO:0015701
    label: bicarbonate transport
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:19019741
    supporting_text: invariable under all ionic conditions studied
  - reference_id: PMID:15010471
    supporting_text: Dynamic control of cystic fibrosis transmembrane conductance regulator Cl(-)/HCO3(-) selectivity by external Cl(-)
- description: Hydrolyzes ATP to support channel conformational cycling. Purified reconstituted
    CFTR ATPase measurements establish catalytic activity separate from passive pore permeation;
    the nucleotide-binding domains are functionally asymmetric. It is listed separately because
    nucleotide hydrolysis is a measured chemical reaction, whereas the channel terms describe
    ion permeation; ATP dependence alone would not establish this catalytic activity.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8910473
    supporting_text: ATP hydrolysis by purified, reconstituted CFTR
  - reference_id: PMID:11524016
  - reference_id: PMID:10581360
    supporting_text: Differential function of the two nucleotide binding domains on cystic fibrosis transmembrane conductance regulator
suggested_questions:
- question: Which defined CFTR molecular species underlies the rat Sertoli nuclear signal,
    and is an equivalent processed product present in human Sertoli nuclei?
- question: Do CFTR-dependent cholesterol changes reflect direct molecular participation in
    lipid handling or secondary homeostatic responses to altered anion transport and trafficking?
- question: Which proximity-labeled or variant-specific interactome partners form reproducible
    physical contacts with sequence-defined CFTR in the corresponding physiological compartment?
- question: What performed CFTR molecular step accounts for sodium-transport normalization
    in rescued human airway epithelia, and how does it depend on extracellular fluid conditions
    and ENaC processing?
suggested_experiments:
- description: Map nuclear CFTR species with independent epitopes, peptide-resolved mass spectrometry,
    fraction-purity controls and matched rat/human Sertoli systems before assigning a nuclear
    biochemical role.
- description: Separate anion-conduction, gating, localization and cholesterol phenotypes
    using matched-expression variants, acute rescue and compartment-resolved lipid-flux measurements.
- description: Validate selected screen/proximity partners with reciprocal endogenous co-IP,
    compartment-compatible constructs and orthogonal binary or reconstituted assays where
    direct contact is claimed.
