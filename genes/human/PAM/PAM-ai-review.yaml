id: P19021
gene_symbol: PAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PAM (peptidylglycine alpha-amidating monooxygenase) is a bifunctional, copper- and zinc-dependent
  enzyme of the regulated secretory pathway that converts C-terminally glycine-extended peptides into
  C-terminally alpha-amidated peptides, a modification many neuropeptides and peptide hormones need for
  full biological activity. The luminal region contains two catalytic modules that act in sequence. The
  N-terminal peptidylglycine alpha-hydroxylating monooxygenase (PHM) is a dicopper, ascorbate- and O2-dependent
  enzyme that hydroxylates the alpha-carbon of the C-terminal glycine. The C-terminal peptidyl-alpha-hydroxyglycine
  alpha-amidating lyase (PAL) is a zinc- and calcium-containing six-bladed beta-propeller that cleaves
  the hydroxylated intermediate to release the amidated peptide and glyoxylate. The same chemistry converts
  N-fatty acylglycines to primary fatty acid amides in vitro (shown for the bovine enzyme). Alternative
  splicing produces single-pass type I membrane forms, which localise to the trans-Golgi network and secretory
  granule membranes and carry a cytosolic domain that governs trafficking through the secretory and endosomal
  pathways, and soluble forms that are secreted with granule contents. PAM is highly expressed in pituitary,
  islets and heart. In human beta cells it amidates chromogranin A, and coding variants that reduce its
  activity are associated with type 2 diabetes risk.
