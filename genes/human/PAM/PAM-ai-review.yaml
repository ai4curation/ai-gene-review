core_functions:
- description: 'Peptidylglycine alpha-hydroxylating monooxygenase (PHM) activity: the copper- and ascorbate-dependent
    hydroxylation of the C-terminal glycine of glycine-extended peptides, the first step of peptide alpha-amidation.
    Directly assayed for recombinant human PAM; the dicopper mechanism and ascorbate chemistry are established
    in the rat ortholog (same PANTHER subfamily, PAINT IBD at PTN000073733).'
