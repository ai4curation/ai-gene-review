- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IC
  original_reference_id: PMID:39880951
  qualifier: involved_in
  supporting_entities:
  - GO:0034599
  review:
    summary: Cellular response to oxidative stress, inferred by curator from the FBXO31 C-terminal amide
      degron paper.
    action: REMOVE
    reason: I read the full text (PMC11821526). The paper shows that C-terminal amide-bearing proteins
      (CTAPs) form after oxidative stress by non-enzymatic oxidative backbone cleavage, which it reconstitutes
      in vitro without any enzyme, and that SCF-FBXO31 recognises and degrades them. PAM appears only
      as the enzyme that amidates secreted peptide hormones. The authors suggest CTAPs might also come
      from 'a to date unknown PAM-like lyase', which implies PAM itself was not shown to take part. No
      experiment in the paper perturbs or measures PAM, and PAM acts in the lumen of the secretory pathway,
      not the cytosol where CTAPs are cleared. The inference is not supported.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: DELETE_ROW
      asserted_value: GO:0034599
      confidence: PROBABLE
      explanation: PMID:39880951 attributes oxidative-stress C-terminal amides (CTAPs) to non-enzymatic
        oxidative backbone cleavage, reconstituted in vitro without enzyme, and identifies FBXO31 as their
        reader. It contains no experiment on PAM and mentions PAM only as the secretory-pathway amidating
        enzyme. An IC to cellular response to oxidative stress for PAM (P19021) is therefore unsupported
        by this reference.
    supported_by:
    - reference_id: PMID:39880951
      supporting_text: This mechanism facilitates binding and turnover of endogenous CTAPs that are formed
        after oxidative stress.
