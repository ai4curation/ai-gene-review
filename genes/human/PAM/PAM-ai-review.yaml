- description: 'Peptidylamidoglycolate lyase (PAL) activity: zinc-dependent N-dealkylation of the peptidyl-alpha-hydroxyglycine
    intermediate to give the C-terminal amide and glyoxylate, the second step of amidation. Directly assayed
    for human PAM (EDTA inhibition reversed by Zn); the zinc-tri-His active site and catalytic Tyr come
    from the rat PAL structure. Human T2D risk variants in the PAL domain reduce amidating activity, and
    PAM amidates chromogranin A in human beta cells.'
