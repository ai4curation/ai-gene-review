suggested_questions:
- question: Does human PAM contribute at all to cytosolic C-terminal amide-bearing protein fragments formed
    under oxidative stress, or are these entirely non-enzymatic as PMID:39880951 suggests? Should UniProt's
    FUNCTION statement on oxidative-stress amidation be revised?
- question: Is fatty acid primary amide (e.g. oleamide) biosynthesis by PAM physiologically significant
    in human tissues, given that it has only been shown in vitro with the bovine enzyme?
- question: Should GO represent ascorbate as the electron donor of PHM (L-ascorbic acid binding) for PAM,
    given kinetic evidence for ascorbate binding in the rat PHM domain?
suggested_experiments:
- description: Knock out or chemically inhibit PAM (4-phenyl-3-butenoic acid) in human cells, apply oxidative
    stress, and quantify C-terminally amidated cytosolic fragments by proteomics. This would test whether
    PAM contributes to CTAP formation.
- description: Run targeted lipidomics of primary fatty acid amides in PAM-deficient human cells or in
    carriers of the PAM loss-of-function variants Ser539Trp and Asp563Gly.
