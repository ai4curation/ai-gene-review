  significance: MIAC is one of few characterized micropeptides from a lncRNA locus; its mechanism decides
    whether AQP2 is a functional effector or only a binding partner.
  resolution: Test whether MIAC alters AQP2 water permeability or trafficking, and whether its expression
    effects require AQP2.
suggested_questions:
- question: Does MIAC change AQP2 channel activity or trafficking, and are its gene-expression effects
    lost in AQP2-deficient cells?
suggested_experiments:
- description: Measure AQP2 water permeability and membrane trafficking with and without MIAC, and repeat
    the SEPT2/ITGB4 and EREG/EGFR expression assays in AQP2-knockout cells.
