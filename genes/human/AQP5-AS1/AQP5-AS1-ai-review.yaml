description: AQP5-AS1 encodes MIAC (micropeptide inhibiting actin cytoskeleton), a 51-residue endogenous
  micropeptide translated from a long non-coding RNA antisense to AQP5. MIAC binds aquaporin 2 directly.
  In head and neck squamous carcinoma cells this binding is followed by reduced SEPT2 and ITGB4 expression
  and loss of F-actin fibres. In renal carcinoma cells it is followed by reduced EREG and EGFR expression.
  MIAC overexpression or synthetic peptide suppresses tumour growth and metastasis in these models, and
  low MIAC expression correlates with poor survival. How AQP2 binding leads to these expression changes
  is unknown.
