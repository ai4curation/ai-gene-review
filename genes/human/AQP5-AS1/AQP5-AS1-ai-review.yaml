knowledge_gaps:
- gap_statement: 'MIAC binds AQP2, but the molecular activity behind its effects is unknown: how AQP2
    binding lowers SEPT2, ITGB4, EREG and EGFR expression has not been shown, and AQP2 water-channel activity
    is not measured in the renal study''s full text (the head and neck study is abstract-only here).'
  boundary: 'Established, in cancer cell lines from one research group: direct MIAC-AQP2 binding by several
    methods, reduced F-actin and target-gene expression, and tumour suppression in xenografts. Not established:
    the effect on AQP2 function, the signalling link to gene expression, and any normal physiological
    role.'
  gap_kind:
