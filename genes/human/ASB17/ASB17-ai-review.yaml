- question: Does human ASB17 degrade ESPN at the Sertoli-spermatid junction, and do ASB17 variants occur
    in men with oligozoospermia?
- question: How does ASB17 stabilize TRAF6 by limiting its K48-linked ubiquitination while degrading other
    substrates?
