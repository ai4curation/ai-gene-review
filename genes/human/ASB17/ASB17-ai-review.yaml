    summary: Intracellular signal transduction (IEA, InterPro SOCS box). In ASB proteins the SOCS box
      is the Elongin B/C-Cullin 5-binding module of a ubiquitin-ligase substrate receptor, and the signalling
      mapping is inherited from the cytokine-signalling SOCS proteins. ASB17's reported effect on NF-kB
      signalling comes from stabilizing TRAF6, which is regulation rather than participation in signal
      transduction. Marked as over-annotated, matching the repo's treatment of this InterPro mapping.
    action: MARK_AS_OVER_ANNOTATED
