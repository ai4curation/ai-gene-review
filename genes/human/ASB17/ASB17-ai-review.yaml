gene_symbol: ASB17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB17 is a testis-restricted ankyrin repeat and SOCS box protein of the ASB family, the substrate-recognition
  subunit of an Elongin B/C-Cullin E3 ubiquitin ligase. In mouse it is expressed in spermatogenic cells.
  It binds the actin-binding ectoplasmic-specialization protein espin (ESPN) and directs its ubiquitination
  and degradation, which is needed to dismantle the apical ectoplasmic specialization at spermiation.
  Asb17-null mice show spermiation failure and oligozoospermia but remain fertile. ASB17 also promotes
  ubiquitylation-dependent degradation of the anti-apoptotic proteins BCLW and MCL1, favouring spermatogenic-cell
  apoptosis. In dendritic cells it stabilizes TRAF6 by limiting its K48-linked ubiquitination, supporting
  LPS-induced NF-kB activation.
