- id: PMID:35070814
  title: E3 ubiquitin ligase ASB17 is required for spermiation in mice.
  findings:
  - statement: ASB17 binds ESPN and directs its ubiquitination.
    supporting_text: Specifically, we demonstrate that ASB17 interacts with the ES protein Espin (ESPN)
      and directs its ubiquitination in vivo.
  - statement: ASB17 removes the ES through ESPN degradation.
    supporting_text: We determined that ASB17 regulates the removal of the ES through ubiquitin mediated
      protein degradation of ESPN.
  - statement: Asb17-null mice fail spermiation.
    supporting_text: 'RESULTS: We report that ASB17, an E3 ligase, is required for the completion of spermiation
      and that mice lacking Asb17 are oligozoospermic owing to spermiation failure.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse knockout and pull-down/IP.
- id: PMID:33803505
  title: E3 Ubiquitin Ligase ASB17 Promotes Apoptosis by Ubiquitylating and Degrading BCLW and MCL1.
  findings:
  - statement: ASB17 degrades BCLW and MCL1 via ubiquitylation.
    supporting_text: Interestingly, ASB17 specifically degraded the two anti-apoptotic factors, BCLW and
      MCL1, in a ubiquitylation-dependent fashion.
  - statement: ASB17 promotes apoptosis.
    supporting_text: Collectively, our findings suggested that ASB17 acted as a distinct positive regulator
      of cell apoptosis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse knockout and cell lines.
- id: PMID:35174103
  title: ASB17 Facilitates the Burst of LPS-Induced Inflammation Through Maintaining TRAF6 Stability.
  findings:
  - statement: ASB17 stabilizes TRAF6 by inhibiting its K48-linked polyubiquitination.
    supporting_text: The interaction of ASB17 stabilizes TRAF6 protein through inhibiting K48-linked TRAF6
      polyubiquitination.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse dendritic cells. A non-degradative effect on TRAF6, not annotated.
