suggested_questions:
- question: Which construct, substrate or assay differences reconcile historical ASH1L H3K4 activity
    reports with human H3K36-specific assays?
- question: What does the actual mouse Ash1l H3K9 assay in PMID:22939622 establish, and is its transfer
    to human ASH1L justified?
- question: Does the tight-junction pool have a reproducible catalytic or signaling function distinct
    from its localization?
suggested_experiments:
- description: Compare matched human ASH1L wild-type, catalytic-dead and Q2265A constructs on defined
    nucleosomes with and without MRG15; quantify K4, K9 and K36 methylation states by product-resolved
    mass spectrometry over time.
  hypothesis: Historical substrate assignments and mutant-specific trimethylation depend on assay
    or construct context. Prior modification recognition must be distinguished from methyl-group
    transfer.
