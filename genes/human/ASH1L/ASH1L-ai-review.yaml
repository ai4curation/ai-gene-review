- id: PMID:26002201
  title: Kinetic characterization of human histone H3 lysine 36 methyltransferases, ASH1L and SETD2.
  findings:
  - statement: Human ASH1L methylates recombinant nucleosomal H3K36 to mono- and dimethylated products;
      K36A loses activity, H3K4 is not a substrate, and only SETD2 trimethylates under the tested
      conditions.
    supporting_text: 'both enzymes mono- and dimethylate

      H3K36 and are inactive with H3K4 as substrate'
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and complete structured abstract read. It explicitly describes
      recombinant nucleosomes, H3K36A, product states and absent H3K4 activity. Full Methods/kinetic
      tables remain unread.
