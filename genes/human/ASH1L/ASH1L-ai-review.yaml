  label: Homo sapiens
description: ASH1L is a nuclear chromatin-associated histone lysine methyltransferase whose SET domain
  catalyzes mono- and dimethylation of histone H3 lysine 36 in nucleosomes. Its DNA- and histone-binding
  modules position the enzyme on chromatin; the PHD finger recognizes methylated H3K4, while other
  reader regions contact DNA. Through these activities ASH1L modulates transcriptional programs involved
  in development and cell identity.
