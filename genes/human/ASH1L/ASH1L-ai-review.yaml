- id: PMID:10860993
  title: huASH1 protein, a putative transcription factor encoded by a human homologue of the Drosophila
    ash1 gene, localizes to both nuclei and cell-cell tight junctions.
  findings:
  - statement: Human ASH1L immunostaining supports intranuclear speckles and an additional tight-junction
      pool; the latter does not establish an adhesion-signaling function.
    supporting_text: 'the protein is distributed in intranuclear

      speckles, and unexpectedly also in intercellular junctions.'
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original PubMed identity and complete normal abstract read. Antibody localization
      is reported directly; full article/figure pixels remain unread.
- id: PMID:21239497
  title: Crystal structure of the human histone methyltransferase ASH1L catalytic domain and its
    implications for the regulatory mechanism.
  findings:
