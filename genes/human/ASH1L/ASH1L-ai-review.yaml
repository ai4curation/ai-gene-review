      The separately accessed Figure 3 caption assigns additional trimethylation to hyperactive Q2265A,
      which must be distinguished from ordinary ASH1L.
    supporting_text: 'human ASH1L specifically

      methylates histone H3 Lys-36.'
    full_text_unavailable: true
  full_text_unavailable: true
