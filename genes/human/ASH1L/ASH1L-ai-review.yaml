- id: PMID:40044670
  title: Structure-function relationship of ASH1L and histone H3K36 and H3K4 methylation.
  findings:
  - statement: Human ASH1L PHD reads H3K4me2/3, neighboring BD/BAH regions bind DNA, and recombinant
      catalytic constructs produce H3K36 mono-/dimethylation. Mouse ES differentiation and reanalyzed
      human MV4-11 occupancy are separate experimental systems.
    supporting_text: 'ASH1LPHD recognizes H3K4me2/3,

      whereas the neighboring ASH1LBD and ASH1LBAH have DNA binding activities.'
    full_text_unavailable: false
  full_text_unavailable: false
