- id: PMID:38123684
  title: Cryo-EM structures of PP2A:B55-FAM122A and PP2A:B55-ARPP19.
  findings:
  - statement: MASTL phosphorylates ARPP19 on Ser62, which is required for ARPP19 to inhibit PP2A:B55.
    supporting_text: The mechanisms by which these inhibitors block PP2A:B55 activity differ, as ARPP19
      strictly requires phosphorylation by MASTL kinase to inhibit PP2A:B555,6, whereas FAM122A inhibits
