id: Q96GX5
gene_symbol: MASTL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MASTL (Greatwall kinase) is an atypical AGC-family serine/threonine protein kinase whose
  catalytic domain is interrupted by a long non-conserved insertion. It is activated at mitotic
  entry by cyclin B-CDK1-dependent phosphorylation and autophosphorylation. Its principal
  substrates are the small endosulfine proteins ENSA (Ser67) and ARPP19 (Ser62); once
  phosphorylated, they bind and inhibit the PP2A-B55 phosphatase that otherwise removes
  CDK1-generated mitotic phosphorylations. By suppressing PP2A-B55, MASTL lets CDK1 substrate
  phosphorylation accumulate and persist, which is required for a timely G2/M transition,
  chromosome condensation, maintenance of the spindle assembly checkpoint, and faithful anaphase
  and cytokinesis; complete loss of MASTL in human cells causes G2 arrest, whereas partial
  depletion causes premature dephosphorylation of mitotic substrates and mitotic failure.
  Inactivation of MASTL and reactivation of PP2A-B55 at the end of mitosis are needed for an
  orderly return to interphase, and the same kinase output supports re-entry into mitosis after
  recovery from a DNA-damage checkpoint. MASTL is mainly nuclear in interphase, redistributes to
  the cytoplasm and centrosomes after nuclear envelope breakdown, and moves to the cleavage furrow
  at mitotic exit. A germline E167D variant is associated with autosomal dominant thrombocytopenia
  (THC2), and the protein has additional, less well-characterized roles in megakaryocyte and
  platelet biology.
