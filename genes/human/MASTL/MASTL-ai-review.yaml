- id: PMID:19460416
  title: In vivo inactivation of MASTL kinase results in thrombocytopenia.
  findings:
  - statement: Recombinant wild-type and E167D MASTL localize to the nucleus of transfected cells.
    supporting_text: The MASTL kinase protein, both wildtype and mutant forms, appears to localize
      within the nucleus of these BHK cells (Figure 6, Panels A & B) as determined by co-localization
      with the DNA counterstain, TO-PRO-3.
  - statement: Morpholino knockdown of mastl in zebrafish reduces circulating thrombocytes.
    supporting_text: A transient knockdown of MASTL in zebrafish results in deficiency of circulating
      thrombocytes.
  reference_review:
    relevance: MEDIUM
