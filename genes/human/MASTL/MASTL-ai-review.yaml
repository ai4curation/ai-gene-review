- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:20538976
  qualifier: involved_in
  review:
    summary: MASTL promotes mitotic entry by inhibiting PP2A-B55 through phospho-ENSA/ARPP19;
      complete siRNA depletion arrests human cells in G2.
    action: ACCEPT
    reason: This is the central, best-supported function of the gene. Human RNAi shows G2 arrest on
      full depletion and mitotic collapse on partial depletion, both rescued by PP2A co-depletion or
      okadaic acid, and the biochemical mechanism (phosphorylation of ENSA/ARPP19 to make them
      PP2A-B55 inhibitors) is established in Xenopus and reconstituted with human proteins.
    supported_by: &gm_support
    - &q_burgess_entry
      reference_id: PMID:20538976
      supporting_text: This kinase promotes mitotic entry and maintenance in human cells by inhibiting
        protein phosphatase 2A (PP2A), a phosphatase that dephosphorylates cyclin B-Cdc2 substrates.
        The complete depletion of Gwl by siRNA arrests human cells in G2.
    - &q_burgess_rescue
      reference_id: PMID:20538976
      supporting_text: These phenotypes appear to be mediated by PP2A, as they could be rescued by
        either a double Gwl/PP2A knockdown or by the inhibition of this phosphatase with okadaic
        acid.
    - &q_gharbi
      reference_id: PMID:21164014
      supporting_text: We identified cyclic adenosine monophosphate-regulated phosphoprotein 19
        (Arpp19) and α-Endosulfine as two substrates of Gwl that, when phosphorylated by this kinase,
        associate with and inhibit PP2A, thus promoting mitotic entry.
