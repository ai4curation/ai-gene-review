suggested_questions:
- question: Does human MASTL physically bind PP2A-B55 independently of phospho-ENSA/ARPP19, as the
    Xenopus co-precipitation data suggested, or is the association entirely bridged by the
    phospho-endosulfines? This determines whether 'protein phosphatase 2A binding' should be retained
    for the human protein.
  experts:
  - Anna Castro
  - Thierry Lorca
- question: Does the THC2-associated E167D variant alter kinase output toward ENSA/ARPP19 in
    megakaryocytes (a gain or loss of PP2A-B55 suppression), or does the platelet phenotype arise from
    a kinase-independent activity?
  experts:
  - Jonathan G. Drachman
suggested_experiments:
- hypothesis: ENSA and ARPP19 are the only physiological mitotic substrates of MASTL; other reported
    phosphorylation changes after MASTL loss are secondary to PP2A-B55 reactivation.
  description: Acute degron-mediated (dTAG/AID) depletion of endogenous MASTL in mitotically arrested
    human cells, combined with PP2A-B55 inhibition or ENSA/ARPP19 phosphomimetic rescue, followed by
    quantitative phosphoproteomics to separate direct MASTL sites from PP2A-B55-dependent losses.
  experiment_type: phosphoproteomics / degron genetics
- hypothesis: The E167D variant changes the balance of endosulfine phosphorylation in megakaryocytes and
    thereby alters proplatelet formation.
  description: CRISPR knock-in of MASTL E167D in human iPSC-derived megakaryocytes; measure pENSA Ser67
    and pARPP19 Ser62, polyploidization and proplatelet output relative to isogenic controls and to a
    kinase-dead allele.
  experiment_type: genome editing / cell biology
