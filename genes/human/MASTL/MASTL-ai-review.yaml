core_functions:
- description: Cyclin B-CDK1-activated protein serine kinase that phosphorylates the endosulfines ENSA
    (Ser67) and ARPP19 (Ser62), converting them into inhibitors of PP2A-B55 so that CDK1 substrate
    phosphorylation can accumulate and the cell commits to mitosis at the G2/M transition.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
