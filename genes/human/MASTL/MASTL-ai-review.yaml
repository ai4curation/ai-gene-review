    label: regulation of cell cycle
  evidence_type: IMP
  original_reference_id: PMID:20818157
  qualifier: involved_in
  review:
    summary: MASTL depletion causes G2 delay, incomplete anaphase and cytokinesis failure; the phenotype
      is specifically a mitotic cell-cycle defect.
    action: MODIFY
    reason: The evidence is sound but the term is broader than necessary. All the reported phenotypes
      (G2 delay, slow chromosome condensation, anaphase and cytokinesis failure, incomplete cyclin B1
      destruction) concern the mitotic cell cycle, so the more specific regulation of mitotic cell
      cycle term (already carried by IBA and Reactome) should be used; the same paper also supports
      the G2/M transition annotation.
