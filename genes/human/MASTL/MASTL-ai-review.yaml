      thrombocytopenia link, but the localization experiment is heterologous over-expression in
      hamster cells and the in vivo work is in zebrafish.
- id: PMID:20538976
  title: Loss of human Greatwall results in G2 arrest and multiple mitotic defects
    due to deregulation of the cyclin B-Cdc2/PP2A balance.
  findings:
  - statement: MASTL is the functional human orthologue of Greatwall and promotes mitotic entry and
      maintenance by inhibiting PP2A.
    supporting_text: Here we show that the functional human ortholog of Greatwall protein kinase (Gwl)
      is the microtubule-associated serine/threonine kinase-like protein, MAST-L.
  - statement: Complete depletion arrests human cells in G2; partial depletion causes mitotic defects
      and SAC failure that are rescued by PP2A co-depletion or okadaic acid.
    supporting_text: These phenotypes appear to be mediated by PP2A, as they could be rescued by either
      a double Gwl/PP2A knockdown or by the inhibition of this phosphatase with okadaic acid.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in cache. Primary human loss-of-function study
      establishing the G2/M and PP2A-balance function.
- id: PMID:20818157
  title: MASTL is the human orthologue of Greatwall kinase that facilitates mitotic
    entry, anaphase and cytokinesis.
  findings:
  - statement: MASTL is nuclear in interphase and partly centrosomal in mitosis, when it is active.
    supporting_text: We found that MASTL localizes to the nucleus in interphase and re-localizes in part
      to centrosomes in mitosis, when it is active.
  - statement: MASTL depletion delays G2, slows chromosome condensation and causes anaphase and
      cytokinesis failure.
    supporting_text: Cells strongly depleted of MASTL by RNAi delay in G(2) phase and reveal slow
      chromosome condensation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in cache. Independent human RNAi study; source of the
      UniProt subcellular-location statements.
- id: PMID:21164014
  title: The substrate of Greatwall kinase, Arpp19, controls mitosis by inhibiting protein phosphatase 2A.
  findings:
  - statement: Arpp19 and alpha-endosulfine are Greatwall substrates that, when phosphorylated, bind
      and inhibit PP2A.
    supporting_text: We identified cyclic adenosine monophosphate-regulated phosphoprotein 19 (Arpp19)
      and α-Endosulfine as two substrates of Gwl that, when phosphorylated by this kinase, associate
      with and inhibit PP2A, thus promoting mitotic entry.
