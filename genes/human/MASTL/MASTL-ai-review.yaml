    supporting_text: This converts Ensa into a potent and specific inhibitor of PP2A-B55δ.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in cache. Companion Xenopus study identifying ENSA as
