      phospho-ENSA/ARPP19 rather than by binding the phosphatase itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: A Gwl-PP2A association was reported in Xenopus extracts before the endosulfine mechanism was
      known, and it is most simply explained by the ternary Gwl-phospho-endosulfine-PP2A-B55 context.
      UniProt itself states that MASTL 'does not directly inhibit PP2A'. For human MASTL no direct
      binding has been demonstrated, and presenting PP2A binding as a molecular function of the kinase
      misrepresents the mechanism; the informative molecular function is the serine kinase activity
      toward ENSA/ARPP19.
    supported_by:
    - reference_id: file:human/MASTL/MASTL-uniprot.txt
      supporting_text: does not directly inhibit PP2A but acts by mediating phosphorylation and
        subsequent activation of ARPP19 and ENSA
    - *q_gharbi
