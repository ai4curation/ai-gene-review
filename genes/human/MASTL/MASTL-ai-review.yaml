- description: Sustains the mitotic phosphorylation state through prometaphase, anaphase and cytokinesis
    by keeping PP2A-B55 inhibited via phospho-ENSA/ARPP19, so that the spindle assembly checkpoint,
    chromatid separation and cytokinesis complete correctly; its inactivation at mitotic exit allows
    PP2A-B55 reactivation and an orderly return to interphase.
