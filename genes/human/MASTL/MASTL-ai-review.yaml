- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:20818157
  qualifier: located_in
  review:
    summary: Proposed cellular-component annotation. After nuclear envelope breakdown MASTL is
      dispersed through the mitotic cytoplasm, where it phosphorylates ENSA/ARPP19 to keep PP2A-B55
      inhibited; the existing nucleus/centrosome/cleavage-furrow terms do not capture this compartment.
    action: NEW
    reason: UniProt records the cytoplasmic localization upon nuclear envelope breakdown from
      PMID:20818157, and the mitotic phosphorylation of the endosulfines and inhibition of PP2A-B55
      necessarily take place in the cytoplasm once the nuclear envelope has broken down. This is a
      localization statement supported by curated data, not a new process claim.
    supported_by:
    - reference_id: file:human/MASTL/MASTL-uniprot.txt
      supporting_text: During interphase is mainly nuclear, upon nuclear envelope breakdown localizes
        at the cytoplasm and during mitosis at the centrosomes.
    - reference_id: file:human/MASTL/MASTL-deep-research-falcon.md
      supporting_text: The protein is predominantly nuclear in interphase and becomes dispersed after
        nuclear-envelope breakdown.
    - *q_voets_loc
