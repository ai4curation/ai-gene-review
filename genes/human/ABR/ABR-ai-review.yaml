- term:
    id: GO:0035021
    label: negative regulation of Rac protein signal transduction
  evidence_type: IMP
  original_reference_id: PMID:36219160
  qualifier: involved_in
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P63000
      label: RAC1
  review:
    summary: >-
      The single largest gap in ABR's GO record: its dominant, most reproducible cellular role
      — restraining Rac signalling — is not represented anywhere in GOA.
    action: NEW
    reason: >-
      Every loss-of-function system points the same way, and the effect is Rac-selective. In human
      cells: shRNA knockdown of ABR in HeLa raised active Rac1 but not Cdc42 in uninfected cells
      [PMID:36219160], which is direct human evidence (IMP) for negative regulation of Rac specifically.
      Corroborated across species and cell types by single-gene knockouts — ABR-null mouse CD4+
      T cells carry elevated GTP-bound Rac [PMID:24058174], ABR-null mice have enhanced basal
      synaptic Rac1 activity [PMID:20962234] — and by double mutants in macrophages [PMID:17116687],
      neutrophils [PMID:19703997] and glia [PMID:11684658]. Cho et al. state the conclusion at
      family level: Abr and Bcr are 'the only GAPs to date that specifically negatively regulate
      Rac function in vivo'. This term is required rather than merely desirable because GO's regulation
      branch keeps Rac and Rho disjoint: GO:0035021 descends through GO:0035020 and GO:0051058,
      NOT through the already-annotated GO:0035023, so nothing currently in GOA implies it. Note
      the useful asymmetry — GO merged away the substrate-specific GAP *activity* terms because
      the isolated domain is nonselective [PMID:27481945], but retained substrate-specific *process*
      terms, which is where ABR's real in-cell selectivity belongs. The affinage record is cited
      here only for the corpus-level direction of the literature, which it independently summarises
      the same way; every mechanistic and quantitative claim above is taken from the primary papers,
      and the provider record does not cite Amin et al. 2016 at all.
