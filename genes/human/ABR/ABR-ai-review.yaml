- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      The plasma membrane is where the GAP activity is exercised: ABR is recruited there on stimulation
      to act on membrane-anchored Rac.
    action: ACCEPT
    reason: >-
      is_active_in is the right qualifier — ABR is a soluble protein that translocates to the
      membrane rather than residing in it. In primary macrophages Abr and Bcr transiently move
      to the plasma membrane on CSF-1 stimulation, and GAP-dead mutants accumulate around phagosomes
      [PMID:17116687]. Rac1/Rac2/CDC42 are prenylated and membrane-associated in their active
      state, so this is the compartment in which the annotated GAP activity acts. Both donors
      (mouse Abr, mouse Bcr) carry their own IDA at GO:0005886.
