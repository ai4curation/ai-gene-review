    label: regulation of Rho protein signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: ABR regulates Rho-branch signalling through its DH/GEF module, which loads GTP onto
      RHOA.
    action: ACCEPT
    reason: >-
      The conclusion is correct but the propagation path is the weakest in the set and is worth
      recording: the only protein donor is UniProtKB:P11274, the same-species paralog BCR, with
      no ABR ortholog among the donors. Read mechanically this is a paralog-only transfer. It
      survives because ABR's own IDA independently establishes the activity: the purified ABR
      DH domain stimulates GTP binding to RhoA [PMID:7479768], and the Xenopus wound-repair work
      shows Abr amplifying Rho locally through its GEF domain in vivo [PMID:21295482]. So no failure
      mode is asserted, but note that GO's regulation branch keeps Rho and Rac disjoint — GO:0035021
      is NOT a descendant of GO:0035023 — so this term covers only the Rho half of ABR's regulatory
      range and does not subsume its dominant Rac-directed activity.
    supported_by:
    - reference_id: PMID:7479768
      supporting_text: >-
        The Dbl-homology domains of Bcr and Abr were active in stimulating GTP binding to CDC42Hs,
        RhoA, Rac1, and Rac2 (rank order, CDC42Hs > RhoA > Rac1 = Rac2) but were inactive toward
        Rap1A and Ha-Ras. Both Bcr and Abr acted as GAPs for Rac1, Rac2, and CDC42Hs but were
