id: Q12979
gene_symbol: ABR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABR (active BCR-related) is a brain-enriched, 859-residue cytosolic regulator of Rho-family
  small GTPases. A single polypeptide carries two catalytic modules of opposite sign: a central
  Dbl-homology (DH) guanine-nucleotide exchange factor domain with an adjacent PH domain, and
  a C-terminal Rho-GAP domain whose arginine at R683 is required for full GAP activity, with a
  phospholipid-binding C2 domain between them and a class I PDZ-binding motif at the extreme C-terminus.
  R683 is assigned as the catalytic arginine finger, and hence a transition-state stabiliser,
  by sequence rule; what is measured is that R683A reduces and R683A/N795A abolishes GAP activity.
  Assayed as purified domains, the DH module loads GTP onto CDC42, RHOA, RAC1 and RAC2, while
  the GAP module accelerates hydrolysis on RAC1, RAC2 and CDC42 but not RhoA; the two modules
  bind substrate noncompetitively, so ABR can engage two GTPases at once rather than acting as
  a bidirectional switch on one. In cells the net output is predominantly restraint of Rac: reducing
  ABR raises active Rac1 in human epithelial cells, and loss of Abr in mice elevates Rac activity
  in macrophages, neutrophils, CD4+ T cells, astroglia and neurons, with consequences for macrophage
  shape, motility and phagocytosis, neutrophil granule and oxidant release, allergic airway inflammation,
  and postnatal cerebellar development. Rather than a simple switch, ABR behaves as a spatial
  segregation device: recruited to a zone of active Rho by binding the GTP-bound form, it amplifies
  Rho locally through its GEF domain while its GAP domain excludes Cdc42 from the same zone. At
  excitatory synapses ABR is tethered through its C-terminal valine to the PDZ domains of PSD-95/DLG4
  and restrains basal Rac1, which is required for the maintenance rather than the induction of
  long-term potentiation and for spatial and object recognition memory. ABR is the paralog of
  BCR and shares its GEF and GAP architecture but lacks BCR's N-terminal oligomerisation and serine/threonine
  kinase region. It is also the host protein targeted by the enteropathogenic Escherichia coli
  effector EspH, which binds the ABR GAP domain to suppress Rac1 and Cdc42.
