    - reference_id: PMID:17116687
      supporting_text: >-
        These results identify Abr and Bcr as the only GAPs to date that specifically negatively
        regulate Rac function in vivo in primary macrophages.
    - reference_id: PMID:20962234
      supporting_text: >-
        Mice deficient for BCR or ABR show enhanced basal Rac1 activity but only a small increase
        in spine density.
    - reference_id: PMID:19703997
      supporting_text: >-
