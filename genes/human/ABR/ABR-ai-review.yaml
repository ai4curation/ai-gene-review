- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9013022
  qualifier: enables
  review:
    summary: >-
      Correct term. The RHOB substrate assignment behind it is in apparent tension with the 1995
      biochemistry, and the resolution is that both measured an isolated, intrinsically nonselective
      domain.
    action: ACCEPT
    reason: >-
      Reactome lists ABR as a confirmed RHOB GAP (Amin et al. 2016, supported by Bagci et al.
      2020) while listing its paralog BCR only as a candidate. That looks to contradict PMID:7479768,
      which found the ABR GAP domain inactive toward RhoA, and PMID:36219160, which restates that
      the ABR GAP domain acts on Rac1/Rac2 and Cdc42 but not RhoA. RhoB is not RhoA, so there
      is no formal contradiction, and the deeper resolution is in Amin et al. itself: having assayed
      14 RHOGAPs against 12 RHO proteins, they conclude the RHOGAP domain is nonselective in cell-free
      conditions and that specificity comes from other domains in cells [PMID:27481945]. Both
      the 1995 and 2016 experiments used isolated recombinant domains [PMID:7479768], so they
      are measurements of an intrinsically promiscuous module rather than conflicting claims about
      ABR's cellular substrate. GO:0005096 is true on any reading, and since the substrate-specific
      GAP terms are merged the disagreement is invisible to GO in any case. Neither cached abstract
      (PMID:27481945, PMID:31871319) names ABR, so the ABR-specific RHOB assignment rests on data
      not verifiable from the abstracts; recorded rather than relied upon.
    supported_by:
    - reference_id: PMID:27481945
      supporting_text: >-
        We have found that the RHOGAP domain itself is nonselective and in some cases rather inefficient
        under cell-free conditions.
    - reference_id: PMID:27481945
      supporting_text: >-
        we propose that other domains of RHOGAPs confer substrate specificity and fine-tune their
        catalytic efficiency in cells
    - reference_id: PMID:7479768
      supporting_text: >-
