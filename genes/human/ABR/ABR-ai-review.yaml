      RhoA, Rac1, and Rac2 (rank order, CDC42Hs > RhoA > Rac1 = Rac2) but were inactive toward
      Rap1A and Ha-Ras. Both Bcr and Abr acted as GAPs for Rac1, Rac2, and CDC42Hs but were inactive
      toward RhoA, Rap1A, and Ha-Ras.
  - reference_id: PMID:21295482
    supporting_text: >-
      Within the Rho zone, Abr promotes local Rho activation via its GEF domain and controls local
      crosstalk via its GAP domain, which limits Cdc42 activity within the Rho zone.
- description: >-
    Binds the PDZ domains of the postsynaptic scaffold PSD-95/DLG4 through a C-terminal class
    I PDZ-binding motif (...S-T-D-V), tethering ABR to PSD-95 at excitatory synapses. This interaction
    is not what localises ABR there: V859A abolishes DLG4 binding with no effect on synaptic localisation,
    so synaptic targeting is DLG4-independent, and what the interaction contributes beyond tethering
    is not yet established.
