- id: file:human/ABR/ABR-bioinformatics/RESULTS.md
  title: ABR WITH/FROM resolution and donor-evidence audit
  findings:
  - statement: >-
      All 21 distinct WITH/FROM identifiers in ABR-goa.tsv resolve. Nine are not protein sequences
      (two PANTHER tree nodes, four InterPro signatures, two ARBA rules, three UniProt subcellular-location
      keywords); the rest resolve to reviewed Swiss-Prot entries except CGD:CAL0000181133, which
      is the unreviewed TrEMBL entry Q5AGW7 for Candida albicans BEM2.
  - statement: >-
      20 of 22 protein donor/row pairs carry their own experimental evidence at the donated term
      itself. The two exceptions are rat Abr and rat Bcr on GO:0014069, which hold that term only
      by IBA/ISO/ISS but carry IDA at the more specific GO:0099092. No donor is without experimental
      grounding at or below the donated term, so no row can be argued down on donor weakness.
  - statement: >-
      GO:0035023 is the only row whose sole protein donor is a paralog (UniProtKB:P11274, human
      BCR), with no ABR ortholog among its donors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by the committed resolve_withfrom.py; RESULTS.md regenerates byte-identically
      from results.json, and the dead-accession and multi-hit guards were break-tested.
