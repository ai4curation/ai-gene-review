suggested_questions:
- question: >-
    PAINT node PTN001142600 propagates GO:0014069 postsynaptic density to ABR, but two of the
    three protein donors (rat Abr, rat Bcr) hold GO:0014069 only by IBA/ISO/ISS and carry their
    experimental IDA one level down at GO:0099092 postsynaptic density, intracellular component.
    Should the node propagate the more specific term, given that ABR is a soluble PSD-95-binding
    protein rather than a membrane-embedded one?
  experts:
  - Eunjoon Kim
  - Nora Heisterkamp
- question: >-
    The GO:0035023 IBA for ABR lists only PANTHER:PTN002754245 and UniProtKB:P11274 (human BCR)
    in WITH/FROM — the same-species paralog, with no ABR ortholog among the donors — even though
    ABR carries its own IDA for both GEF and GAP activity. Should ABR's direct experimental annotation
    be contributing at this node, and is a paralog-only donor set for a same-species pair intended?
  experts: []
- question: >-
    Reactome R-HSA-9013022 lists ABR as a confirmed RHOB GAP while listing BCR only as a candidate,
    on the strength of Amin et al. 2016 and Bagci et al. 2020 — yet Amin et al. conclude that
    the RHOGAP domain is nonselective under cell-free conditions, and three independent studies
    report the ABR GAP domain as inactive toward RhoA. Is ABR a physiological RHOB GAP in cells,
    or is the assignment an artefact of isolated-domain assays?
  experts:
  - Mohammad Reza Ahmadian
  - Jean-François Côté
- question: >-
    GO merged the substrate-specific GAP and GEF activity terms into GO:0005096 and GO:0005085
    while retaining substrate-specific process terms such as GO:0035021. For a dual GEF-GAP protein
    like ABR, whose two domains act on overlapping but different GTPase sets, the molecular-function
    annotations are now indistinguishable from those of a GAP with the opposite specificity. Should
    substrate identity for GAPs and GEFs be captured by mandatory has_input extensions in GO-CAM,
    rather than being left optional?
  experts: []
- question: >-
    ABR's GEF domain loads GTP onto RHOA while its GAP domain does not act on RhoA, and the two
    domains bind substrate noncompetitively. Does ABR ever act as a net Rho activator and Rac
    inactivator simultaneously on the same membrane, as the Xenopus wound-repair zone model implies
    for the human protein?
  experts:
  - William M Bement
suggested_experiments:
- hypothesis: >-
    ABR's in-cell substrate selectivity is set by its non-catalytic domains (PH and C2) rather
    than by the Rho-GAP domain, which is intrinsically nonselective.
  description: >-
    Compare GAP activity and substrate preference of the isolated ABR Rho-GAP domain (647-845)
    against full-length ABR and PH- or C2-deleted variants, assayed on RAC1, RAC2, CDC42, RHOA
    and RHOB in parallel by real-time nucleotide-hydrolysis measurement, and then in cells by
    GTPase-specific biosensors after re-expression in ABR-null cells at native levels. This directly
    tests Amin et al.'s proposal and would settle whether the RHOB assignment in Reactome reflects
    cellular physiology.
  experiment_type: comparative enzymology plus biosensor imaging
- hypothesis: >-
    ABR is recruited to the postsynaptic density by its C-terminal PDZ motif, and that recruitment,
    not GAP activity per se, is what LTP maintenance requires.
  description: >-
    Compare rescue of the LTP-maintenance deficit in ABR-null hippocampal slices by re-expression
    of wild-type ABR, the PDZ-motif mutant V859A, and the GAP-dead R683A/N795A double mutant.
    Separating targeting from catalysis would show whether the two proposed core functions are
    independent or strictly sequential.
  experiment_type: slice electrophysiology with structure-function rescue
- hypothesis: >-
    The opposite-signed phagocytosis phenotypes in the literature reflect cell type rather than
    a real contradiction.
  description: >-
    Measure phagocytic index after ABR depletion and after ABR overexpression in matched conditions
    in primary macrophages and in human trabecular meshwork cells, with Rac1 activity measured
    in the same samples. Mouse Abr;Bcr double nulls over-phagocytose whereas human trabecular-meshwork
    siRNA reduces phagocytosis by ~40%; resolving this would determine whether a phagocytosis
    term can be annotated for human ABR at all.
  experiment_type: parallel loss- and gain-of-function phagocytosis assay
