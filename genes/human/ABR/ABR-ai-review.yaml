  - predicate: RO:0002233
    term:
      id: UniProtKB:P60953
      label: CDC42
  review:
    summary: >-
      Core molecular function, and the best-supported annotation in the set. ABR's C-terminal
      Rho-GAP domain (UniProt FT 647-845) accelerates GTP hydrolysis on RAC1, RAC2 and CDC42.
    action: ACCEPT
    reason: >-
      This is not a domain-name-derived guess in either direction. The activity is directly demonstrated
      for ABR itself: purified recombinant ABR GAP domain accelerates hydrolysis on Rac1, Rac2
      and CDC42Hs [PMID:7479768], reproduced independently in two 1993 studies [PMID:8262969,
      PMID:8349582]. The catalytic machinery is also experimentally confirmed rather than merely
      inferred: UniProt annotates R683 as the arginine finger and records that R683A reduces GAP
      activity and R683A+N795A abolishes it (ECO:0000269|PubMed:17116687). Both residues lie inside
      the annotated Rho-GAP domain, and the human sequence carries R at 683 and N at 795. The
      propagation is also sound: all five protein donors carry their own experimental annotation
      at GO:0005096 itself, including the true ortholog (mouse Abr, IDA/IGI) and a self-referential
      entry for human ABR, which records a PAINT curator judging the function core rather than
      any circularity. GO no longer has substrate-specific GAP terms: GO:0005099 (Ras), GO:0005100
      (Rho) and GO:0030675 (Rac) GTPase activator activity are all secondary ids of GO:0005096,
      which has no substrate-specific children (checked via QuickGO /ontology/go/terms/GO:0005096/complete).
      GO:0005096 is therefore already the maximally specific molecular-function term available.
      The measured substrate set is therefore recorded in the extensions block and in core_functions.substrates
      instead of by choosing a narrower term.
    supported_by:
    - reference_id: PMID:7479768
      supporting_text: >-
        The Dbl-homology domains of Bcr and Abr were active in stimulating GTP binding to CDC42Hs,
        RhoA, Rac1, and Rac2 (rank order, CDC42Hs > RhoA > Rac1 = Rac2) but were inactive toward
        Rap1A and Ha-Ras. Both Bcr and Abr acted as GAPs for Rac1, Rac2, and CDC42Hs but were
        inactive toward RhoA, Rap1A, and Ha-Ras.
    - reference_id: file:human/ABR/ABR-uniprot.txt
      supporting_text: stimulates GTP hydrolysis by RAC1, RAC2 and CDC42.
    - reference_id: file:human/ABR/ABR-uniprot.txt
      supporting_text: Arginine finger
    - reference_id: file:human/ABR/ABR-uniprot.txt
      supporting_text: 'R->A: Reduces GAP activity.'
    - reference_id: file:human/ABR/ABR-bioinformatics/RESULTS.md
      supporting_text: 5 of 5 protein donors carry their own experimental evidence at GO:0005096
        itself.
