      vivo predominantly as a negative regulator of Rac matches the primary literature.
  - statement: >-
      The record does NOT cite Amin et al. 2016 (PMID:27481945), the systematic RHOGAP specificity
      survey that reconciles the conflicting substrate claims and that Reactome relies on for
      ABR's RHOB assignment. That gap was found independently via the Reactome entry, not from
      the provider narrative.
  - statement: >-
      Five findings in its table (PMID:23152932 hypoxic pulmonary remodelling, PMID:28579391 hESC
      mitotic fidelity, PMID:31516309 trabecular-meshwork phagocytosis, PMID:37507586 osteoclast
      differentiation, PMID:38776074 GDM/hyperglycaemia RhoA activation) were deliberately not
      annotated: each is a single report, downstream of the Rac/Rho activity change, and the phagocytosis
      reports have opposite signs.
