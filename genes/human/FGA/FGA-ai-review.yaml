- id: PMID:21806028
  title: Structure, stability, and interaction of fibrin αC-domain polymers.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID, title, DOI and PMC identity agree across genuine normal metadata and the original full article.
      Bounded original reads cover human recombinant Aα221–610 material, oligomer characterization, tPA/plasminogen
      binding, plasmin-generation Results, Figures 5–8 captions and the relevant Discussion. Cross-linked oligomers
      bind both ligands and strongly enhance activation; soluble monomers are weak, and internally cross-linked
      monomers are intermediate. The authors explicitly note disagreement with PMID:11170397 and propose an unverified
      aggregation-state explanation. These are experimental assemblies, not new natural splice or cleavage products.
      ROOT separately viewed original Figures 5–8 pixels; this lane read their captions. No exact in-vivo oligomer
      state or equal activity of both natural splice products is established.
  publication_type: PRIMARY_RESEARCH
- id: PMID:37082262
  title: Functional properties of individual sub-domains of the fibrin(ogen) αC-domains.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PMID, title, DOI and PMC identity agree across genuine normal metadata and the original full
      article. Bounded reads cover human plasma fibrinogen and plasminogen identity, preparation/assay context,
      truncated-chain characterization, plasmin-generation Results and Figure 5, plus the relevant Discussion. Alpha-C-truncated
      fibrin supports lower but persistent tPA-mediated plasminogen activation than the comparison fibrin; the alpha-C
      contribution is not the only binding/template contribution. The truncations are experimental preparations,
      not natural splice forms. ROOT separately viewed original Figure 5 pixels. The entire set of other cellular/polymerization
      experiments and all supplemental material were not independently assessed by this lane; the authors retain
      an unresolved in-vivo scope. Joint direct-lane assessment: the genuine accepted full cache was independently
      read at Methods 2.2.4–2.2.8 (lines 182–207), Results 3.1–3.3 (220–246) and Discussion 268–280. Characterization
      and turbidity/electron-microscopy/SPR experiments support an αC contribution to fibrin assembly: truncations
      lengthen the lag while final turbidity increases, so the result is not a uniform decrease in polymerization.
      ROOT additionally read original Methods blocks 44–51, Results 60–77 and Discussion 107–108 and viewed Figures
      1–4 pixels. The EM sampling time differs between Methods (180 s) and Results (300 s); Figure 3 caption D–F
      says 2 µm while actual panel F has a 1 µm bar. No quantitative density or magnification comparison is inferred.
      This explicit expansion supplements, rather than retrospectively changes, the original database lane’s cofactor-only
      read scope. No natural splice or released-FPA activity is inferred from these experimental truncations.'
  publication_type: PRIMARY_RESEARCH
