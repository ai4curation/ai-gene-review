references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete source scope covers rows 1, 75 and 79. Actual InterPro entry metadata and the target
      P02671 match response were inspected: IPR012290 matches residues 48–192 and maps receptor binding and platelet
      activation; IPR037579 matches the whole target and maps blood coagulation. The mappings are genuine. Their
      biological interpretation distinguishes intact fibrinogen ligand activity from autonomous alpha-chain contact,
      and uses retained specific coagulation/aggregation roles for broad mappings. Neither a coiled-coil match nor
      a family description proves every mapped function independently.'
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete scope covers rows 63, 80, 89, 92, 112 and 115. All six positive IBD term/node/donor joins
      match the actual preserved PTHR47221 TSV at PTN008715159. Official membership and family labels were checked.
      P14448 is chicken FGA, not mouse. Its original structure PMID:11601975 was read at Methods/Results/Discussion
      and captions, with alpha-C and mobile terminal regions unresolved. Independent human alpha-C cofactor evidence
      supports coordinated tPA/plasminogen organization and fibrinolytic participation; it is distinct from simply
      being a covalent complex subunit. Earlier target tree/MSA requests timed out. The newly recovered official
      tree places human P02671 leaf PTN002499061 beneath PTN008715159, and its ungapped 866-residue MSA sequence
      exactly matches the preserved canonical UniProt sequence. The later successful captures supplement rather
      than erase the preserved failed requests. The v19 family tree and canonical sequence support descent only;
      the narrower enzyme-substrate adaptor interpretation uses independent human assays rather than a child-term
      IBD placement. Donor count and target self-WITH are not defects. The heterotypic-adhesion source retains an
      explicit operative-original access limit; that uncertainty does not invalidate the PAINT method or imply a
      target loss.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied
    by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete scope is row 16. The original source is UniProt subcellular-location vocabulary mapping
      SL-0243, Secreted, present in the reviewed target record and consistent with actual extracellular Reactome
      entities. It is not an HPA localization assay. The broad extracellular compartment spans fibrinogen, fibrin
      and released products and is not reduced to complex membership alone.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete scope is row 70. The genuine HPA XML for FGA/ENSG00000171560 records enhanced Hep-G2
      immunofluorescence support for ER localization with antibodies HPA051370 and HPA064755. Both selected original
      images were viewed. The observed reticular/perinuclear pattern supports the recorded ER compartment but does
      not independently resolve the lumen, assign a natural splice product or establish an ER biochemical activity.
      No image-derived assertion of exclusive localization is made.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete scope covers rows 77, 85, 88, 91, 94, 97, 104, 114, 119, 122, 126 and 130. The actual
      ARBA rule JSONs and their full condition alternatives were inspected. Each relevant rule contains a human-compatible
      branch with FunFam 4.10.530.10:FF:000002, which is explicitly cross-referenced by canonical FGA despite the
      FunFam's gamma-chain label. The label is not evidence of a wrong target. The rules are predictive associations,
      not independent experimental replications, and their training publications were not reconstructed. Biological
      adjudication uses the separately scoped target/complex experiments, preserving inaccessible-source uncertainty.
      Canonical matching does not demonstrate equal function of both splice products or released peptides.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete scope covers rows 67 and 102. The actual combined sources are ARBA00086903 plus IPR012290
      for fibrinogen-complex membership and ARBA00028914 plus IPR012290 for protein polymerization. Both rule outputs
      and the target InterPro match were checked. Actual fibrinogen composition and fibrin assembly support the
      assertions. Two computational methods are not counted as two independent experiments, and polymer structural
      participation is separated from thrombin or Factor XIII catalysis.
