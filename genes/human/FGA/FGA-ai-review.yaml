  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:P27348
  review:
    summary: The curated FGA–YWHAQ association supports a partner-class binding refinement with unresolved physiological
      context.
    action: MODIFY
    reason: 'The exact human YWHAQ bait/FGA prey record is an anti-tag affinity-purification/mass-spectrometry association.
      GO:0071889 specifies the identified 14-3-3 partner class; refining the existing curator-assigned IPI protein-binding
      claim does not promote the experiment to purified direct binding. The original Methods use tagged ORFs and
      detergent lysates. FGA secretion and YWHAQ intracellular localization raise a real compartment-compatibility
      concern that this assay does not resolve: association could be indirect, construct-dependent or enabled after
      lysis. No endogenous colocalization, direct affinity, phosphorylation-dependent interface, regulatory activity
      or physiological core function is inferred. Background-aware filtering supports retaining the reported association
      but does not eliminate these alternatives. BioPlex 3.0 reanalyzes earlier datasets, so the two papers are
      not independent replication. Gene-level grouping and the reported accession do not resolve an intact natural
      splice or cleavage product.'
    supported_by:
    - reference_id: PMID:28514442
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
