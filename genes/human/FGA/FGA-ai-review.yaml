- description: Provides assembly-dependent alpha-C binding sites for the enzyme tPA and its substrate plasminogen
    that support coordinated plasmin generation and thereby contribute to fibrinolysis. Human alpha-C oligomer binding
    and coupled-activation assays support this enzyme-substrate adaptor contribution; simultaneous ternary occupancy
    and comparative substrate preference remain unresolved.
