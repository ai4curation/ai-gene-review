id: P02671
gene_symbol: FGA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGA encodes the alpha chain of fibrinogen, the secreted plasma complex containing two copies each of
  the alpha, beta and gamma chains. The alpha chain contributes to the central interchain architecture and coiled
  coils. Thrombin releases its N-terminal fibrinopeptide A, exposing a polymerization interface used in fibrin assembly;
  Factor XIII supplies the subsequent covalent cross-linking activity. FGA-containing fibrinogen also contributes
  to platelet aggregation. Alpha-C assemblies can bind tissue-type plasminogen activator and plasminogen and enhance
  plasmin generation, providing a cofactor contribution to fibrinolysis whose strength depends on assembly state.
  Alternative splicing produces an 866-residue Alpha-E precursor and a 644-residue Alpha precursor with distinct
  C termini.
alternative_products:
- name: 1 (Alpha-E)
  id: P02671-1
- name: 2 (Alpha)
  id: P02671-2
  sequence_note: VSP_001531, VSP_001532
