    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:8910396
  qualifier: enables
  review:
    summary: The α chain is a structural participant in fibrinogen assembly.
    action: ACCEPT
    reason: PMID:8910396 follows human fibrinogen chains expressed in BHK cells and corroborates assembly intermediates
      in human hepatoma cells. Immunoprecipitation and two-dimensional gels detect αγ intermediates and assembled
      αβγ-containing fibrinogen after addition of the missing chain. The α chain supplies structure in the complex;
      this is more than a loss-of-function requirement. The broad structural term also covers soluble-complex assembly,
      beyond extracellular-matrix incorporation. GO:0005198 remains informative for the soluble fibrinogen heteromer
      as well as extracellular fibrin structure; its broader complex-structural scope is not exhausted by the ECM-specific
      descendant GO:0005201.
    supported_by:
    - reference_id: PMID:8910396
