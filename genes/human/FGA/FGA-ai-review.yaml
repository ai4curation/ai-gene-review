      behavior of the alternative αE product. Retain the general structural activity without turning the disease
      phenotype into a distinct enzymatic function. GO:0005198 remains informative for the soluble fibrinogen heteromer
      as well as extracellular fibrin structure; its broader complex-structural scope is not exhausted by the ECM-specific
      descendant GO:0005201.
