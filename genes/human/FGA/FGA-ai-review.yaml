functional_isoforms:
- id: FGA_FIBRINOPEPTIDE_A
  name: Fibrinopeptide A
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000009021
    residues: 20-35
  description: UniProt defines fibrinopeptide A at canonical precursor residues 20–35, released at the thrombin
    cleavage site before residue 36. Both curated splice sequences contain this shared N-terminal sequence. This
    released peptide is distinct from the alpha chain incorporated into fibrin; no independent molecular activity
    is assigned here. Its source-specific GO contexts remain separately traced in the processed-product evidence
    map even where the seed omitted product identifiers.
- id: FGA_FIBRIN_ALPHA_CHAIN
  name: Fibrin alpha chain after fibrinopeptide A release
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000009022
    residues: 36-866
  description: The official chain feature spans residues 36–866 of the displayed Alpha-E precursor after fibrinopeptide
    A release. This canonical range is not assigned to the shorter 644-residue Alpha splice product. FGA-derived
    chains contribute to fibrin assembly, whereas the proteases and cross-linking enzymes perform their respective
    catalytic steps. The experimentally reported Aalpha221–610 fragments and alpha-C truncations are assay constructs
    or preparations, not additional natural products.
suggested_questions:
- question: How do the distinct Alpha-E and Alpha C termini alter alpha-C organization and cofactor activity in
    physiological fibrin assemblies?
- question: Which alpha-C assembly states expose the tPA/plasminogen-binding contribution in vivo, and how do ternary
    occupancy and substrate preference relate to the differing monomer results reported in 2001 and 2011?
- question: Which released-fibrinopeptide A activities and extracellular-vesicle locations are supported by product-resolved
    or sample-resolved experiments, distinct from mature-chain and whole-fibrinogen measurements?
- question: How much of alpha-chain support for platelet aggregation reflects its RGD-containing contacts, compared
    with the gamma-chain C-terminal recognition site and the architecture of intact fibrinogen?
suggested_experiments:
- description: Compare sequence-verified Alpha-E and Alpha fibrinogen preparations at matched concentrations. Measure
    fibrin assembly, tPA/plasminogen occupancy and coupled plasmin generation while independently characterizing
