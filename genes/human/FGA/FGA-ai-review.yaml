  review:
    summary: FGA encodes a structural chain required to assemble functional fibrinogen.
    action: ACCEPT
    reason: PMID:10891444 identifies human FGA variants in congenital afibrinogenemia. Those patient data establish
      necessity, while the actual chain-assembly experiments in PMID:8910396 establish the structural work supporting
