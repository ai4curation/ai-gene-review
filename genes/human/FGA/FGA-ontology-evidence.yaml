definitions:
- id: GO:0031639
  name: plasminogen activation
  aspect: biological_process
  definition:
    text: The process in which inactive plasminogen is processed to active plasmin. This process includes cleavage
      at an internal Arg-Val site to form an N-terminal A-chain and C-terminal B-chain held together by a disulfide
      bond, and can include further proteolytic cleavage events to remove the preactivation peptide.
    xrefs:
    - dbCode: PMID
      dbId: '9548733'
- id: GO:0005576
  name: extracellular region
  aspect: cellular_component
  definition:
    text: The space external to the outermost structure of a cell. For cells without external protective or external
      encapsulating structures this refers to space outside of the plasma membrane. This term covers the host cell
      environment outside an intracellular parasite.
- id: GO:0005577
  name: fibrinogen complex
  aspect: cellular_component
  definition:
    text: A highly soluble, elongated protein complex found in blood plasma and involved in clot formation. It is
      converted into fibrin monomer by the action of thrombin. In the mouse, fibrinogen is a hexamer, 46 nm long
      and 9 nm maximal diameter, containing two sets of nonidentical chains (alpha, beta, and gamma) linked together
      by disulfide bonds.
    xrefs:
    - dbCode: ISBN
      dbId: 0198547684
- id: GO:0005198
  name: structural molecule activity
  aspect: molecular_function
  definition:
    text: The action of a molecule that contributes to the structural integrity of a complex.
- id: GO:0030168
  name: platelet activation
  aspect: biological_process
  definition:
    text: A series of progressive, overlapping events triggered by exposure of the platelets to subendothelial tissue.
      These events include shape change, adhesiveness, aggregation, and release reactions. When carried through
      to completion, these events lead to the formation of a stable hemostatic plug.
    xrefs:
    - dbCode: PMID
      dbId: '27403440'
- id: GO:0070527
  name: platelet aggregation
  aspect: biological_process
  definition:
    text: The adhesion of one platelet to one or more other platelets via adhesion molecules.
- id: GO:0005886
  name: plasma membrane
  aspect: cellular_component
  definition:
    text: The membrane surrounding a cell that separates the cell from its external environment. It consists of
      a phospholipid bilayer and associated proteins.
    xrefs:
    - dbCode: ISBN
      dbId: '0716731363'
- id: GO:0072378
  name: blood coagulation, fibrin clot formation
  aspect: biological_process
  definition:
    text: A protein activation cascade that contributes to blood coagulation and consists of the cascade of enzymatic
      reactions initiated by physical damage to the wall of a blood vessel, leading to the formation of a formation
      of a fibrin clot at the site of the injury. The process also includes numerous positive and negative regulatory
      events.
    xrefs:
    - dbCode: PMID
      dbId: '26018600'
- id: GO:0072377
  name: blood coagulation, common pathway
  aspect: biological_process
  definition:
    text: A protein activation cascade that contributes to blood coagulation and consists of events leading from
      the formation of activated Factor Xa by either the intrinsic or extrinsic pathway, to the formation of active
      thrombin, the cleavage of fibrinogen by thrombin, and the formation of cleaved fibrin into a stable multimeric,
      cross-linked complex.
    xrefs:
    - dbCode: PMID
      dbId: '1931959'
- id: GO:0007596
  name: blood coagulation
  aspect: biological_process
  definition:
    text: 'The sequential process in which the multiple coagulation factors of the blood interact, ultimately resulting
      in the formation of an insoluble fibrin clot; it may be divided into three stages: stage 1, the formation
      of intrinsic and extrinsic prothrombin converting principle; stage 2, the formation of thrombin; stage 3,
      the formation of stable fibrin polymers.'
    xrefs:
    - dbCode: PMID
      dbId: '30700128'
- id: GO:0009897
  name: external side of plasma membrane
  aspect: cellular_component
  definition:
    text: The leaflet of the plasma membrane that faces the extracellular side of the cell, including any protein
      embedded in, attached to, or peripherally associated with it.
- id: GO:0140767
  name: enzyme-substrate adaptor activity
  aspect: molecular_function
  definition:
    text: An adaptor that brings together an enzyme and its substrate. Adaptors recruit the substrate to its enzyme,
      thus contributing to substrate selection and specificity.
    xrefs:
    - dbCode: PMID
      dbId: '16250895'
    - dbCode: PMID
      dbId: '34358446'
