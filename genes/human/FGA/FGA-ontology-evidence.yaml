    id: GO:0140378
    name: protein complex scaffold activity
    aspect: molecular_function
    definition:
      text: A structural molecule activity of a protein-containing complex component that serves to hold the complex
        together. Protein complex scaffolds are integral members of complexes.
      xrefs:
      - dbCode: PMID
        dbId: '41298522'
