id: P00742
gene_symbol: F10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F10 encodes factor X, a vitamin K-dependent plasma glycoprotein synthesized in the liver
  and secreted as a coagulation zymogen. Proteolytic activation produces factor Xa, a serine endopeptidase
  that converts prothrombin to thrombin. Its gamma-carboxyglutamate-rich domain supports calcium-dependent
  phospholipid association and assembly with factor Va in prothrombinase. Xa also participates in coagulation
  initiation and amplification by cleaving factor VII and the procofactors V and VIII. Beyond coagulation,
  Xa can cleave protease-activated receptor 2 (PAR2/F2RL1), eliciting barrier-protective responses in
  an endothelial-cell model; signaling outcomes depend on cellular context. Protein C inhibitor and protein
  Z-dependent proteinase inhibitor regulate Xa activity. F10 variants cause factor X deficiency, a bleeding
  disorder of variable severity.
