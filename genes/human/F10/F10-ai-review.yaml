core_functions:
- description: 'Activated factor Xa performs serine endopeptidase chemistry on extracellular protein substrates.
    Its principal coagulation reaction converts prothrombin to thrombin in the calcium- and phospholipid-supported
    Xa–Va prothrombinase complex. Curated reaction models also assign Xa cleavage of factor VII, factor
    V activation intermediates and factor VIII in an initiating TF–VIIa–Xa assembly, extending the coagulation
    substrate spectrum beyond prothrombin. A distinct measured substrate is PAR2/F2RL1: Xa cleaves a PAR2–alkaline-phosphatase
    reporter and promotes barrier protection in EA.hy926 endothelial cells. These are substrate contexts
    of one protease activity, not separate catalytic units. The signaling assay does not establish a universal
    inflammatory direction, mTOR regulation or equivalence of all natural F10 products. Gla-domain-dependent
    membrane assembly supports coagulation, whereas the tested Gla-deleted Xa retains PAR2 cleavage and
    barrier protection. The inactive precursor and its biosynthetic processing are distinct from activated
    Xa performing these reactions.'
