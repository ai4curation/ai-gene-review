  review:
    summary: Human Xa binds and reacts with the serpin SERPINA10/ZPI.
    action: KEEP_AS_NON_CORE
    reason: PMID:20427285 Experimental Procedures and Tables 1–3 measure inhibition and dissociation of
      complexes formed by explicitly human Xa with ZPI, with protein Z, calcium and phospholipid cofactors.
      Figure 4 is a modeled ternary Michaelis complex; the solved crystal contains ZPI and Gla-domainless
      protein Z, not Xa. This is positive inhibitor–enzyme association. No current specific inhibitor-binding
      MF was established by the ontology searches; protease binding would reverse the demonstrated partner
      role, and peptidase inhibitor activity belongs to ZPI. Retain generic binding as a supported non-core
      facet rather than a separate autonomous activity of F10.
