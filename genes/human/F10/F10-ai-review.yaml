suggested_questions:
- question: Which independently verified natural F10 transcripts produce secreted, correctly processed
    proteins, and how do their calcium binding, phospholipid association and prothrombin-cleaving activities
    differ?
- question: In which cellular settings does active factor Xa itself drive migration or TOR signaling,
    and how can that contribution be distinguished from other components of the tissue-factor–VIIa complex
    and from receptor-specific cleavage effects?
suggested_experiments:
- description: Express sequence-verified F10 transcript products in a matched system and identify the
    secreted chains, activation sites and gamma-carboxylation state by protein analysis. Compare zymogen
    and experimentally activated preparations for calcium/phospholipid binding and prothrombin activation
    with controlled factor Va, calcium and lipid concentrations; normalize to active enzyme concentration.
- description: Compare purified factor X, active Xa and catalytically inactive Xa in defined cell systems
    while independently controlling tissue factor and VIIa. Combine receptor-specific perturbations with
    direct receptor-cleavage measurements, TOR-pathway readouts and migration assays to separate Xa proteolysis
    from parallel signaling by the other complex components.
