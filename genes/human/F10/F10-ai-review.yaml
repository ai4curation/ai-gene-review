- id: PMID:22409427
  title: Identification of exosite residues of factor Xa involved in recognition of PAR-2 on endothelial
    cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Direct evidence assessment: Independent operative original main Methods/Results read:
      purchased human plasma Xa, Va and prothrombin; RVV-X activation of recombinant derivatives; prothrombinase
      assays on PC/PS vesicles with S2238 detection of generated thrombin (Figure 1). The endothelial
      PAR-2-ALP assay demonstrates extracellular protease action, not membrane-localization microscopy
      or mTOR regulation. Recombinant HEK293 expression alone is not a verified insert-sequence/product
      identity. No figure pixels were inspected in this lane. https://pmc.ncbi.nlm.nih.gov/articles/PMC3314109/


      Database evidence assessment: Identifier/title/DOI/PMC identity agree in the genuine normal record
      and primary text (https://doi.org/10.1021/bi300200p; PMC3314109). Read Experimental Procedures (preparation/activation
      of recombinant full-length and Gla-domainless FX, human plasma reagents, prothrombin activation,
      PAR-2 alkaline-phosphatase reporter cleavage and permeability assay), Results and Discussion. Human
      plasma Xa, Va and prothrombin support the target coagulation reaction; PC/PS vesicles and calcium
      support peripheral membrane-associated prothrombinase. RVV-X activates the FX preparations before
      Xa assays. EA.hy926 reporter cleavage is a distinct endothelial receptor substrate context, not
      evidence that F10 itself is a membrane-spanning receptor. HEK293 host alone is not used to infer
      unspecified construct sequence. No figure pixels/supplements; some controls are author-reported
      data not shown.


      Feedback synthesis: reread Materials, recombinant FX activation, prothrombin activation, PAR2 reporter
      cleavage, permeability Methods and the corresponding Results/Discussion. Purchased human Xa/Va/prothrombin
      and activated recombinant derivatives remain distinct. EA.hy926 reporter cleavage and thrombin-challenged
      albumin permeability support the bounded PAR2/barrier role. Anti-PAR2 versus anti-PAR1 blockade
      and the optimal protection concentration are author-reported data not shown; no new figure pixels
      were inspected. Gla-deleted Xa retains the reported signaling effects, so the coagulation membrane
      requirement is not imposed on every receptor-signaling context.'
