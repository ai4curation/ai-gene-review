suggested_questions:
- question: Which FANCC-specific interaction or conformational effect couples assembly of the human C–E–F
    module to productive FANCD2–FANCI monoubiquitination, and can it be separated from altered abundance
    or stability of FANCE, FANCF and the catalytic module?
- question: Which endogenous FANCC pools and partner interactions mediate mitochondrial quality control
    and ROS restraint, and to what extent can those functions be separated from nuclear cross-link repair
    without relying on patient truncations as substitutes for the normal protein?
suggested_experiments:
- hypothesis: FANCC may support a specific assembly or conformational step distinct from direct substrate
    recognition by its partners; separating these effects could resolve its molecular role without assuming
    adaptor or ligase activity.
  description: Reconstitute sequence-verified human C–E–F and the catalytic complex with wild-type FANCC,
    a FANCC omission and interface variants selected from independently tested contacts. Measure subunit
    abundance, solubility, folding and complex stoichiometry before comparing direct partner binding,
    human ID2 recruitment and FANCD2/FANCI monoubiquitination. Include matched partner-omission and FANCL/UBE2T
    catalytic controls, and test cellular rescue of cross-link sensitivity separately. Treat the chicken-derived
    residue-295 interface prediction as a testable hypothesis, not a verified human interaction defect.
- hypothesis: The mitochondrial/ROS function can be experimentally separable from nuclear repair, but
    its physical operating pool and dependence on Parkin or PKR may differ by cell type and stimulus.
  description: Use endogenous tagging and independently validated FANCC antibodies with knockout controls
    in human fibroblasts and a second relevant cell type. Compare wild-type rescue and defined separation-of-function
    variants at matched near-endogenous levels. Measure mitophagic flux, mitochondrial ROS, viability
    and nuclear cross-link repair independently, with stimulus, autophagy-blockade and partner-perturbation
    controls. Distinguish genuine mitochondrial recruitment from soluble carryover, and distinguish pathway
    flux from steady-state mitochondrial mass. Keep the normal 558-residue protein separate from engineered
    fragments, patient alleles and transcript predictions.
