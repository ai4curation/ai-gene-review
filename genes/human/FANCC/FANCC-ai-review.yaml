  review:
    summary: The inherited oxidative-stress response is retained with independent target-specific support.
    action: KEEP_AS_NON_CORE
    reason: 'The actual PTN000423656 IBD and target path are verified; the current mouse source is PMID:24483844.
      Its Fancc/Foxo3a double-mutant genetic/developmental findings are positive, but the detailed ROS,
      neurosphere and antioxidant-rescue experiments in the read main predominantly use Fancd2/Foxo3a
      mice; the inaccessible Fancc Supplementary Figure S1 is not claimed read. Independent PMID:27133164
      directly tests immortalized human FANCC R548X patient fibroblasts with wild-type rescue: CCCP-induced
      mitochondrial ROS and abnormal mitochondrial accumulation are reduced by FANCC, with separate mouse
      macrophage experiments. Retain a real contextual stress-response role, not merely an assumed downstream
      consequence of DNA repair. No FANCC antioxidant-enzyme chemistry, universal tissue effect or new
      mitophagy annotation is inferred. The inherited STAT1 and reductase quotations remain context only,
