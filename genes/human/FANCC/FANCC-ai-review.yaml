id: Q00597
gene_symbol: FANCC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCC is a noncatalytic component of the Fanconi anemia nuclear core complex that supports
  DNA interstrand cross-link repair and chromosome stability. It associates with FANCE and FANCF in a
  module coupled to the FANCL–UBE2T ubiquitination machinery, which modifies FANCD2–FANCI during repair.
  FANCC contributes to the assembly and function of this machinery, although its specific molecular step
  within the module remains unresolved. FANCC also has cytoplasmic functions, including context-dependent
  interactions with chaperone and PKR signaling systems and a role in mitochondrial quality control and
  limiting oxidative stress. Biallelic pathogenic variants cause Fanconi anemia complementation group
  C, characterized by bone-marrow failure, congenital abnormalities and increased cancer susceptibility.
