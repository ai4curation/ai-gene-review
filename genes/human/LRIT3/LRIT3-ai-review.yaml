suggested_experiments:
- hypothesis: >-
    LRIT3 directly binds nyctalopin through its LRR region to organize a trans-synaptic
    complex.
  description: >-
    Measure purified ectodomain binding by biolayer interferometry and crosslinking
    mass spectrometry, determine a complex structure if stable, and test interface
    mutants in photoreceptor-specific rescue of Lrit3-null mouse retina.
  experiment_type: quantitative biochemistry and structural rescue
- hypothesis: >-
    Human LRIT3 is predominantly presynaptic at rod and cone terminals.
  description: >-
    Introduce small endogenous tags into LRIT3 in human retinal organoids, image with
    expansion microscopy against pre- and postsynaptic landmarks, and validate the
    tagged protein's trafficking and signaling competence.
  experiment_type: endogenous tagging and spatial proteomics
- hypothesis: >-
    LRIT3 recruits nyctalopin and TRPM1 through separable domain-dependent steps.
  description: >-
    Perform time-resolved photoreceptor-specific rescue with LRR, Ig-like, and
    cytoplasmic-tail mutants and quantify nyctalopin and TRPM1 localization, signalplex
    composition, and ON-bipolar electrophysiology independently.
  experiment_type: domain-resolved in vivo rescue
- hypothesis: >-
    LRIT3 isoform 2 is unstable or functionally deficient because it lacks the
    canonical LRR segment.
  description: >-
    Combine retinal long-read sequencing and targeted proteomics with matched isoform-
    specific trafficking, surface-expression, partner-binding, and functional rescue
    assays.
  experiment_type: isoform-resolved structure-function analysis
- hypothesis: >-
    LRIT3 modulates FGFR1 only under overexpression and is dispensable for endogenous
    FGFR1 trafficking in retinal cells.
  description: >-
    Perturb endogenous LRIT3 in cells that naturally coexpress FGFR1, quantify ER-to-
    Golgi trafficking and ligand-dependent PLC-gamma/ERK/AKT outputs, and compare with
    the original HEK293 overexpression design.
  experiment_type: endogenous signaling perturbation
