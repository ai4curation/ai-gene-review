- id: PMID:42055330
  title: Domain-specific functions of LRIT3 in synaptic assembly and retinal signal transmission.
  findings:
  - statement: >-
      Mouse domain-deletion rescue shows that the LRIT3 Ig-like domain is required for
      TRPM1 localization and signalplex function.
    supporting_text: |-
      The IG domain is required for the localization of TRPM1 to the
      signalplex and thus its function.
    reference_section_type: ABSTRACT
  - statement: >-
      The LRIT3 LRR domain contributes to trafficking and signalplex reassembly in a
      photoreceptor-type-dependent manner.
    supporting_text: |-
      We
      show the LRR domain may be required for trafficking LRIT3 to the synapse in
      cones, but not rods, and it is needed for reassembly and function of the rod BC
      signalplex.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. The 2026 mouse rAAV deletion-rescue study is
      strong structure-function evidence, but its proposed LRR-nyctalopin and Ig-TRPM1
      contacts remain mechanistic models rather than purified direct interfaces.
