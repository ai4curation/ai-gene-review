    supporting_text: This indicates that LRIT3 is prominently present in cone synapses too and confirms its pre-synaptic origin.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. Endogenous tagging resolves the cell-side
