- id: PMID:22673519
  title: Leucine-rich repeat, immunoglobulin-like and transmembrane domain 3 (LRIT3)
    is a modulator of FGFR1.
  findings:
  - statement: >-
      Overexpressed human LRIT3 increased FGFR1 exit from the ER in HEK293 cells.
    supporting_text: These results suggest that LRIT3 facilitates exit of FGFR1 from the ER.
    reference_section_type: RESULTS
  - statement: >-
      The authors explicitly frame the LRIT3-FGFR1 mechanism as unresolved and
      potentially influenced by receptor overexpression or serum growth factors.
    supporting_text: Perhaps highly over-expressed FGFR1s can interact and phosphorylate each other at the cell surface without a ligand [22]. Alternatively, stabilization and over-expression of FGFR1 simply allow cells to respond to even small amounts of growth factors in the culture medium (serum) rather than these cells become truly FGF-independent. Although the exact mechanism of action is not clear, our results strongly suggest that LRIT3 facilitates ER export of FGFR1, that FGFR1 exits the ER not in a constitutive fashion, but in a regulated fashion, and that LRIT3 modulates the FGFR-signaling pathway.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. This is direct human HEK293 overexpression
      evidence for FGFR1 trafficking/signaling modulation, but it is context-limited
      and independent of the retinal loss-of-function mechanism.
- id: PMID:23246293
  title: Whole-exome sequencing identifies LRIT3 mutations as a cause of autosomal-recessive complete congenital stationary night blindness.
  findings:
  - statement: >-
      Biallelic LRIT3 variants were identified in human complete congenital stationary
      night blindness.
    supporting_text: |-
      Whole-exome sequencing in
      one simplex cCSNB case lacking mutations in the known genes led to the
      identification of a missense mutation (c.983G>A [p.Cys328Tyr]) and a nonsense
      mutation (c.1318C>T [p.Arg440(∗)]) in LRIT3, encoding leucine-rich-repeat (LRR),
      immunoglobulin-like, and transmembrane-domain 3 (LRIT3). Subsequent Sanger
      sequencing of 89 individuals with CSNB identified another cCSNB case harboring a
      nonsense mutation (c.1151C>G [p.Ser384(∗)]) and a deletion predicted to lead to
      a premature stop codon (c.1538_1539del [p.Ser513Cysfs(∗)59]) in the same gene.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Human retinal antibody staining placed LRIT3 puncta in the outer plexiform layer
      near bipolar-cell dendritic tips.
    supporting_text: |-
      Human LRIT3 antibody staining revealed in the outer plexiform layer of the human
      retina a punctate-labeling pattern resembling the dendritic tips of bipolar
      cells; similar patterns have been observed for other proteins implicated in
      cCSNB.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and the cached abstract were checked. This is the decisive direct
      human disease and retinal-localization source. The cache is abstract-only, and
      later mouse endogenous-tagging data refine the puncta to a presynaptic origin.
- id: PMID:28334377
  title: LRIT3 Differentially Affects Connectivity and Synaptic Transmission of Cones to ON- and OFF-Bipolar Cells.
  findings:
  - statement: >-
      Lrit3-deficient mice lose ON-pathway function and show disorganized cone-to-ON-
      bipolar contacts while preserving major presynaptic ultrastructure.
    supporting_text: |-
      Finally, synaptic contacts made
      by ON-BC but not OFF-BC neurons with the cone pedicles were disorganized without
      ultrastructural alterations in cone terminals, horizontal cell processes, or
      synaptic ribbons.
    reference_section_type: ABSTRACT
  - statement: >-
      The study assigns LRIT3 a role in cone-to-ON-bipolar trans-synaptic organization.
    supporting_text: |-
      CONCLUSIONS: These results suggest that LRIT3 is likely involved in coordination
      of the transsynaptic communication between cones and ON-BCs during synapse
      formation and function.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. Human physiology is included, but the detailed
      structural and mechanistic experiments are in the mouse nob6 model.
- id: PMID:31189098
  title: Presynaptic Expression of LRIT3 Transsynaptically Organizes the Postsynaptic Glutamate Signaling Complex Containing TRPM1.
  findings:
  - statement: >-
      Mouse rod-photoreceptor LRIT3 acts presynaptically and restores the postsynaptic
      depolarizing-bipolar-cell signalplex and rod-driven vision.
    supporting_text: |-
      In contrast, we
      demonstrate that LRIT3 is expressed presynaptically, in rod photoreceptors
      (rods), and when we restore LRIT3 expression in Lrit3-/- rods, we restore
      expression of the postsynaptic glutamate signalplex and rod-driven vision.
    reference_section_type: ABSTRACT
  - statement: >-
      The authors identify LRIT3 as a trans-synaptic organizer of the postsynaptic
      glutamate signalplex.
    supporting_text: |-
      Our
      results demonstrate that, in the retina, the LRR-containing protein LRIT3 acts
      as a transsynaptic organizer of the postsynaptic complex required for normal
      synaptic function.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. Photoreceptor-specific rescue supplies the
      strongest causal evidence for the presynaptic organizer model in mouse retina;
      human process annotations remain explicit orthology transfers.
- id: PMID:31959619
  title: LRIT3 is Required for Nyctalopin Expression and Normal ON and OFF Pathway Signaling in the Retina.
  findings:
  - statement: >-
      LRIT3 associates with nyctalopin and is required for nyctalopin and TRPM1
      localization at mouse depolarizing-bipolar-cell dendritic tips.
    supporting_text: |-
      In both male and female mice, we demonstrate
      that LRIT3 interacts with and is required for expression of nyctalopin, and thus
      TRPM1 at all DBC dendritic tips, but DBC signalplex components are not required
      for LRIT3 expression.
    reference_section_type: ABSTRACT
  - statement: >-
      Lrit3 loss disrupts both ON and OFF retinal pathway outputs.
    supporting_text: |-
      Using whole-cell and multielectrode array (MEA)
      electrophysiology and glutamate imaging, we demonstrate that the loss of LRIT3
      impacts both ON and OFF signaling pathway function. Without LRIT3, excitatory
      input to type 1 BCs is reduced, as are the visually evoked responses of many OFF
      retinal ganglion cells (RGCs). We conclude that the absence of LRIT3 expression
      disrupts excitatory input to OFF BCs and, thus disrupts the normal function of
      OFF RGCs.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. The study supplies mouse co-IP, localization,
      knockout, and electrophysiology evidence; it does not establish a purified
      binary interface or direct human retinal mechanism.
- id: PMID:40263339
  title: Efficient in vivo labeling of endogenous proteins with SMART delineates retina cellular and synaptic organization.
  findings:
  - statement: >-
      Endogenous mouse LRIT3 tagging supports a presynaptic photoreceptor origin.
    supporting_text: These observations suggest that LRIT3 is confined to pre-synaptic compartment and is expressed solely by photoreceptors.
    reference_section_type: RESULTS
  - statement: >-
