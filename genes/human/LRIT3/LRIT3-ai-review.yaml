core_functions:
- description: >-
    At rod and cone photoreceptor terminals, LRIT3 acts presynaptically to organize the
    opposing depolarizing-bipolar-cell postsynaptic specialization. Mouse knockout,
    photoreceptor-specific rescue, endogenous tagging, and domain-deletion rescue show
    that LRIT3 is required for nyctalopin and TRPM1 assembly at bipolar-cell dendritic
    tips and for normal ON-pathway transmission; loss also alters downstream OFF-
    pathway responses. Human biallelic loss causes complete congenital stationary
    night blindness, connecting this conserved organizer mechanism to disease. The
    evidence supports a trans-synaptic organizing role but does not yet define a
    purified direct human binding interface or obligate stable complex.
  directly_involved_in:
  - id: GO:0099084
    label: postsynaptic specialization organization
  - id: GO:0050804
    label: modulation of chemical synaptic transmission
  locations:
  - id: GO:0098793
    label: presynapse
  supported_by:
  - reference_id: PMID:31189098
    supporting_text: |-
      Our
      results demonstrate that, in the retina, the LRR-containing protein LRIT3 acts
      as a transsynaptic organizer of the postsynaptic complex required for normal
      synaptic function.
    reference_section_type: ABSTRACT
  - reference_id: PMID:31959619
    supporting_text: |-
      In both male and female mice, we demonstrate
      that LRIT3 interacts with and is required for expression of nyctalopin, and thus
      TRPM1 at all DBC dendritic tips, but DBC signalplex components are not required
      for LRIT3 expression.
    reference_section_type: ABSTRACT
  - reference_id: PMID:40263339
    supporting_text: These observations suggest that LRIT3 is confined to pre-synaptic compartment and is expressed solely by photoreceptors.
    reference_section_type: RESULTS
  - reference_id: PMID:42055330
    supporting_text: |-
      The IG domain is required for the localization of TRPM1 to the
      signalplex and thus its function.
    reference_section_type: ABSTRACT
knowledge_gaps:
- gap_statement: >-
    The direct extracellular binding interface by which LRIT3 organizes nyctalopin,
    TRPM1, and the depolarizing-bipolar-cell signalplex is unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Co-immunoprecipitation and domain-deletion rescue identify functional dependencies
    but do not distinguish direct binary contacts, multimerization, or an intervening
    synaptic partner.
  resolution: >-
    Reconstitute purified LRIT3 ectodomains with nyctalopin and TRPM1 extracellular
    regions, combine quantitative binding with crosslinking mass spectrometry and
    structural analysis, and validate interface mutants by retinal rescue.
  provenance:
  - reference_id: PMID:42055330
    supporting_text: This may indicate that the LRR domain of LRIT3 interacts transsynaptically with the LRR domain of Nyctalopin.
    reference_section_type: DISCUSSION
- gap_statement: >-
    The exact cell-side distribution and molecular partners of endogenous human LRIT3
    at rod and cone synapses remain unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Human antibody staining resembled bipolar dendritic tips, whereas mouse endogenous
    tagging and rescue support a presynaptic photoreceptor origin; synaptic apposition
    can make these patterns difficult to distinguish.
