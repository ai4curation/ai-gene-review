id: Q3SXY7
gene_symbol: LRIT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRIT3 is a type-I single-pass membrane glycoprotein with an extracellular
  leucine-rich-repeat region, immunoglobulin-like domain, and fibronectin type-III
  domain. In the retina it acts from rod and cone photoreceptor terminals as a
  trans-synaptic organizer of the depolarizing-bipolar-cell glutamate signalplex,
  enabling postsynaptic localization of nyctalopin and the TRPM1 channel and normal
  ON-pathway visual transmission. Biallelic human LRIT3 variants cause complete
  congenital stationary night blindness, and human retinal staining places LRIT3
  puncta in the outer plexiform layer; endogenous mouse tagging and photoreceptor-
  specific rescue resolve the functional protein predominantly to the presynaptic
  side. Overexpressed human LRIT3 can alter FGFR1 maturation and PLC-gamma signaling
  in cultured cells, but this context is distinct from its established retinal role.
  Two splice isoforms are described; isoform 2 lacks the canonical five-LRR segment,
  without demonstrated isoform-specific localization or function.
