  - UniProtKB:Q9Y5S8
  - WB:WBGene00000253
  review:
    summary: The plasma membrane is where the mature DUOX1-DUOXA1 complex acts, releasing H2O2 to the extracellular
      side.
    action: ACCEPT
    reason: 'Core, and not merely an under-specification of the apical plasma membrane annotated elsewhere: in
      polarized epithelia the complex is apical, but in migrating cells functional DUOX1 is at the leading edge,
      and in heterologous cells it is delivered to the basolateral surface when DUOXA1 N-glycosylation is lost.
      Plasma membrane is the statement that holds across all of these. The IBA row rests on PAINT node PTN001735877,
      whose seeds include this protein together with NOX/DUOX and plant and yeast relatives, which is the right
      level of generality for a family-wide inference.'
    supported_by:
    - reference_id: PMID:33420071
      supporting_text: Dual oxidases (DUOXs) produce hydrogen peroxide by transferring electrons from intracellular
        NADPH to extracellular oxygen.
    - reference_id: PMID:39126279
      supporting_text: The membrane-integrated NADPH oxidases DUOX1 and DUOX2 are recruited to the apical plasma
        membrane in epithelial cells to release hydrogen peroxide, thereby playing crucial roles in various functions
        such as thyroid hormone synthesis and host defense.
    - reference_id: PMID:19339556
      supporting_text: Functional Duox1 and Duox2 localize to the leading edge of migrating cells, augmenting
        motility and wound healing.
