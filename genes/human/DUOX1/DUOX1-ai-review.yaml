  review:
    summary: DUOX1-derived H2O2 is the substrate from which lactoperoxidase makes hypothiocyanite, which inactivates
      influenza virus; Duox1-null mice show impaired viral clearance and worse disease.
    action: KEEP_AS_NON_CORE
