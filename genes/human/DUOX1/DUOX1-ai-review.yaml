core_functions:
- description: Calcium-activated, NADPH-dependent generation of extracellular hydrogen peroxide. As the catalytic
    subunit of the DUOX1-DUOXA1 complex at the plasma membrane, DUOX1 oxidizes cytosolic NADPH, passes the electrons
    through FAD and two transmembrane hemes, and reduces extracellular oxygen to H2O2. EF-hand calcium binding
    gates the reaction. The H2O2 produced is used by extracellular peroxidases (lactoperoxidase at airway surfaces,
    thyroid peroxidase in the thyroid follicle) and acts as a diffusible redox signal.
  molecular_function:
    id: GO:0016174
    label: NAD(P)H oxidase H2O2-forming activity
  directly_involved_in:
  - id: GO:0050665
    label: hydrogen peroxide biosynthetic process
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0043020
    label: NADPH oxidase complex
  supported_by:
  - reference_id: PMID:33420071
    supporting_text: we found the co-expression of DUOX1 and DUOXA1 resulted in cell membranes that showed robust
      calcium-activated, NADPH-dependent hydrogen peroxide production detected by the Amplex Red assay
  - reference_id: PMID:15972824
    supporting_text: The particulate fractions of these cells stably or transiently transfected with human or
      porcine DUOX cDNA demonstrate a functional NADPH/Ca2+-dependent H2O2-generating activity.
  - reference_id: PMID:33420071
    supporting_text: The transmembrane layer is formed by 24 transmembrane helices and harbors the heme-binding
      sites that provide the electron transfer pathway across the membrane
  - reference_id: PMID:39126279
    supporting_text: The membrane-integrated NADPH oxidases DUOX1 and DUOX2 are recruited to the apical plasma
      membrane in epithelial cells to release hydrogen peroxide, thereby playing crucial roles in various functions
      such as thyroid hormone synthesis and host defense.
proposed_new_terms:
- proposed_name: NAADPH oxidase (NAADP-forming) activity
  proposed_definition: 'Catalysis of the reaction: NAADPH + O2 + H+ = NAADP+ + H2O2. NAADPH is the reduced form
    of nicotinic acid adenine dinucleotide phosphate, the calcium-mobilising second messenger; its oxidation by
    a NOX/DUOX-family flavocytochrome regenerates NAADP.'
  justification: 'UniProt records this catalytic activity for human DUOX1 with experimental evidence (Rhea:86235)
    from the study that identified NOX and DUOX enzymes as NAADP-forming, and no GO molecular function covers
    the NAADPH substrate: GO:0016174 is defined on NAD(P)H. No annotation is proposed here; the entry records
    the ontology gap.'
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:86235
      label: NAADPH + O2 + H(+) = NAADP(+) + H2O2
  supported_by:
  - reference_id: PMID:34784249
    supporting_text: we identified NADPH oxidases NOX and DUOX as NAADP-forming enzymes that convert NAADPH to
      NAADP under physiological conditions in vitro
  - reference_id: file:human/DUOX1/DUOX1-uniprot.txt
    supporting_text: Reaction=NAADPH + O2 + H(+) = NAADP(+) + H2O2;
knowledge_gaps:
- gap_statement: What the extracellular peroxidase-homology domain of human DUOX1 does is unknown. It occupies
    roughly the first 590 residues, is retained throughout vertebrate DUOX evolution, and yet binds no heme and
    shows no peroxidase activity in the human protein, while the C. elegans equivalent binds heme covalently and
    cross-links cuticle tyrosines.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Without knowing the domain's function it is not possible to say whether human DUOX1 has a second
    catalytic or ligand-handling activity, or whether the domain is purely structural, holding the complex at
    the membrane surface or positioning a partner peroxidase such as lactoperoxidase.
  provenance:
  - reference_id: PMID:19460756
    supporting_text: indicate that the hDUOX1 protein either has a unique function or must interact with other
      protein factors to express its catalytic activity
suggested_questions:
- question: What is the function of the human DUOX1 peroxidase-homology domain, given that it binds no heme and
    has no peroxidase activity? Does it instead dock an extracellular peroxidase such as lactoperoxidase so that
    H2O2 is channelled directly to it?
- question: Should the conflict between PMID:11514595 (peroxidase activity from an E. coli-expressed human Duox
    peroxidase domain) and PMID:19460756 plus the cryo-EM structure (no heme, no activity) be resolved in GO by
    keeping the NOT GO:0004601 annotation, as this review recommends, or by recording both? UniProt currently
    records both in a CAUTION line.
- question: Does GO need a molecular function for the NAADPH-oxidizing, NAADP-forming reaction that UniProt attributes
    to DUOX1 (Rhea:86235), and is the reaction physiologically relevant for DUOX1 as opposed to DUOX2, which carried
    the T-cell calcium-microdomain phenotype?
- question: Where DUOX1 and DUOX2 are co-expressed, which peroxidase consumes which oxidase's H2O2? The substrate-channelling
    question determines whether thyroid hormone generation and lactoperoxidase-dependent defense should be annotated
    to both paralogs or only to one.
suggested_experiments:
- hypothesis: The human DUOX1 peroxidase-homology domain is a protein-interaction module that recruits extracellular
    peroxidases rather than a catalytic domain.
  description: Express and purify the isolated human DUOX1 PHD and test binding to lactoperoxidase and thyroid
    peroxidase by surface plasmon resonance and by pull-down from airway secretions; then delete or swap the PHD
    in full-length DUOX1 co-expressed with DUOXA1 in polarized MDCK or primary airway cells and measure whether
    hypothiocyanite production, but not bulk H2O2 output, is lost.
  experiment_type: binding and reconstitution assay
- hypothesis: DUOX1 releases H2O2 and never superoxide, whereas the superoxide seen in DUOX preparations comes
    from immature or mispaired complexes.
  description: Compare spin-trapping EPR and Amplex Red measurements on purified, peptidisc-reconstituted human
    DUOX1-DUOXA1 against the immature ER-resident form and against DUOX1 mispaired with DUOXA2, under identical
    calcium and NADPH conditions, to quantify the superoxide-to-H2O2 ratio for each species.
  experiment_type: biochemistry
- hypothesis: The NAADPH-oxidizing activity attributed to DUOX enzymes is carried by DUOX1 in cells where DUOX1
    is the dominant paralog.
  description: Reconstitute purified DUOX1-DUOXA1 and DUOX2-DUOXA2 with NAADPH and measure NAADP formation by
    LC-MS as a function of calcium, in parallel with H2O2 output, and test DUOX1-null airway epithelial cells
    for altered NAADP levels and calcium signalling.
  experiment_type: enzymology and cell biology
