- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19339556
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q1HG43-2
  review:
    summary: The interaction recorded here is with DUOXA1 isoform (UniProtKB:Q1HG43-2), the DUOX maturation factor
      with which DUOX1 forms an obligate heterodimer; bare protein binding states none of that.
    action: MODIFY
    reason: 'Bare GO:0005515 carries no functional information, so under the repo protein-binding policy it is
      replaced rather than kept. The informative term for this interaction is protein heterodimerization activity:
      DUOX1 and DUOXA1 form functional heterodimers (two of which assemble into the heterotetramer resolved by
      cryo-EM), heterodimerization is a prerequisite for ROS production, and the partner also determines where
      the oxidase is delivered. Removing the generic row does not deny the reported interaction, and the complex
      membership is separately captured by GO:0043020.'
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    supported_by:
    - reference_id: PMID:19339556
      supporting_text: Duox proteins form functional heterodimers with their respective DuoxA subunits, in close
        analogy to the phagocyte NADPH oxidase.
    - reference_id: PMID:19339556
      supporting_text: Characterization of novel DuoxA1 isoforms and mispaired Duox-DuoxA complexes revealed that
        heterodimerization is a prerequisite for reactive oxygen species production.
