  review:
    summary: The mature DUOX1-DUOXA1 complex releases hydrogen peroxide, not superoxide; the superoxide-generating
      activity belongs to the NOX branch of the family.
    action: MODIFY
    reason: 'This is a lateral correction within the family, argued from the phylogeny rather than from similarity.
      PAINT placed GO:0016175 at PTN000239643, the deep NOX/DUOX ancestor seeded by NOX1, NOX2 (CYBB), NOX4, NOX5
      and their rodent and amoebal relatives, and placed the H2O2-forming activity GO:0016174 separately at the
      DUOX-specific node PTN000944147, whose seeds include DUOX1 itself. The experimental record agrees with that
      split: mature DUOX does not release superoxide but H2O2, superoxide leakage is seen only from the immature
      ER form of DUOX2 or when the DUOXA2 N-terminus is altered, and the C-terminus of DUOXA1 directs DUOX1 to
      H2O2 output. The claim is not false of the family, but it is false of this protein, so the replacement is
      the sibling term the DUOX node carries.'
    proposed_replacement_terms:
    - id: GO:0016174
      label: NAD(P)H oxidase H2O2-forming activity
    supported_by:
    - reference_id: PMID:15972824
      supporting_text: it was shown that mature thyroid NADPH oxidase does not release O2*- but H2O2
    - reference_id: PMID:15972824
      supporting_text: the partially glycosylated form of Duox2, located in the endoplasmic reticulum, generates
        superoxide in a calcium-dependent manner
    - reference_id: PMID:22814254
      supporting_text: We have shown that the COOH-terminal end of DUOXA1 is responsible for DUOX1-dependent H(2)O(2)
        generation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000239643
        source_label: deep NOX/DUOX ancestral node carrying the IBD
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded by NOX-branch members (NOX1, CYBB/NOX2, NOX4, NOX5 and rodent and amoebal homologues);
          superoxide output is a property of that branch, not of the DUOX clade below it.
      - source_id: PANTHER:PTN000944147
        source_label: DUOX-specific node carrying the H2O2-forming IBD
        source_status: SUPPORTS_TRANSFER
        comment: Seeds include UniProtKB:Q9NRD9 itself together with DUOX2 and the fly and nematode Duox proteins;
          PAINT placed NAD(P)H oxidase H2O2-forming activity here, which is the term this row should carry.
      - source_id: UniProtKB:P04839
        source_label: CYBB/NOX2 (human)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Experimentally a superoxide generator; the seed is sound for the node and wrong for DUOX1.
      residue_claims_not_applicable: The difference between the NOX and DUOX branches here is the product released
        by the assembled complex (H2O2 rather than superoxide), set by the DUOXA partner and by the maturation
        state, not by the gain or loss of particular residues in DUOX1.
