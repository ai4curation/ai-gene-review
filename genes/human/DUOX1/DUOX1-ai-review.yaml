  review:
    summary: DUOX1 generates hydrogen peroxide; superoxide is the product of the NOX branch of the family, and
      is seen from DUOX only as leakage from immature or mispaired complexes.
    action: MODIFY
    reason: The IBA comes from PTN000239643, the deep NOX/DUOX node seeded by NOX1, NOX2, NOX4, NOX5 and rodent
      and amoebal homologues, and the NAS row rests on the 2000 cloning paper's observation that the ThOX polypeptides
      are related to gp91phox, which is sequence similarity rather than a measured product. Direct measurement
      shows the mature thyroid oxidase releases H2O2 rather than superoxide, with superoxide only from the partially
      glycosylated ER form, and DUOXA1's C-terminus directs DUOX1 to H2O2. The corresponding true process term
      for this protein is hydrogen peroxide biosynthetic process, which the gene already carries with IDA support.
    proposed_replacement_terms:
