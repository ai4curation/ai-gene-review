    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010255
  review:
    summary: This is an InterPro2GO mapping from the animal haem peroxidase signature IPR010255, which DUOX1 matches
      through its N-terminal peroxidase-homology domain. In human DUOX1 that domain binds no heme and has no peroxidase
      activity, and DUOX1 is a producer of reactive oxygen species rather than a participant in a response to
      oxidative stress.
    action: REMOVE
    reason: 'The domain that triggers the mapping is the one shown structurally and biochemically to lack the
      heme ligand and any peroxidase function in this protein, so the premise of the automatic inference fails
      here. Beyond that, the mapping inverts the biology: oxidant generation is not oxidant detoxification or
      sensing, and no experiment attributes an oxidative-stress response role to DUOX1. Removing an electronic
      mapping that is wrong on both counts leaves the gene''s genuine ROS terms untouched.'
