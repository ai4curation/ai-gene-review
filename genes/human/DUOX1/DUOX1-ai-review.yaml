- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:19339556
  qualifier: located_in
  review:
    summary: 'Endoplasmic reticulum localization reflects DUOX1 maturation rather than the site of its activity:
      the oxidase is N-glycosylated and oxidatively folded in the ER and only reaches the plasma membrane after
      pairing with DUOXA1.'
    action: KEEP_AS_NON_CORE
    reason: True but peripheral. The immature, partially glycosylated DUOX protein is ER-resident and is catalytically
      different from the mature enzyme (in the DUOX2 experiments it leaks superoxide rather than releasing H2O2),
      and ER-to-Golgi transport of DUOX1 requires physical interaction with DUOXA1. The curator-observed ER staining
      is not disputed; it is simply not where DUOX1 does its work.
    supported_by:
    - reference_id: PMID:15972824
      supporting_text: the partially glycosylated form of Duox2, located in the endoplasmic reticulum, generates
        superoxide in a calcium-dependent manner
    - reference_id: PMID:25761904
      supporting_text: The oxidative folding of DUOX2 that takes place in the endoplasmic reticulum (ER) appears
        to be a key event in the trafficking of the DUOX2/DUOXA2 complex
