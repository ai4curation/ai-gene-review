- term:
    id: GO:0042335
    label: cuticle development
  evidence_type: IMP
  original_reference_id: PMID:11514595
  qualifier: involved_in
  review:
    summary: 'The phenotype behind this IMP is nematode: RNA interference against Ce-Duox1, which is expressed
      in hypodermal cells underlying the larval cuticle, abolished di- and trityrosine cross-links and disrupted
      the cuticle. The paper''s human experiments are different ones, on the expressed peroxidase domain in vitro,
      and humans have no cuticle for DUOX1 to build.'
    action: REMOVE
    reason: This is a cross-species transfer of a C. elegans loss-of-function phenotype onto the human protein,
      not a human experiment, and the cross-linking chemistry it depends on is lineage-specific. The nematode
      protein (bli-3, UniProtKB:O61213) sits in PANTHER subfamily PTHR11972:SF175, not in SF75 with human, mouse,
      rat, dog and pig DUOX1, and its peroxidase-homology domain binds heme covalently and has peroxidase activity
      whereas the human domain does neither. Both the phylogenetic placement and the biochemistry block the transfer,
      so the annotation should not stand on the human gene. The underlying nematode finding is not disputed and
      belongs on bli-3.
    supported_by:
    - reference_id: PMID:11514595
      supporting_text: Ce-Duox1 is expressed in hypodermal cells underlying the cuticle of larval animals.
    - reference_id: PMID:11514595
      supporting_text: To investigate function, RNA interference (RNAi) was carried out in C. elegans.
    - reference_id: PMID:11514595
      supporting_text: Thus, Ce-Duox catalyzes the cross-linking of tyrosine residues involved in the stabilization
        of cuticular extracellular matrix.
    - reference_id: PMID:19460756
      supporting_text: In contrast, CeDUOX1(1-589) binds heme covalently, exhibits a modest peroxidase activity,
        but does not oxidize bromide ion.
    - reference_id: PMID:19460756
      supporting_text: the isolated hDUOX1(1-593) does not bind heme and has no intrinsic peroxidase activity
