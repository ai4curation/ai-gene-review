  title: Cloning of two human thyroid cDNAs encoding new members of the NADPH oxidase family.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cloning of human ThOX1/ThOX2 (DUOX1/DUOX2). Verified as the source of the NAS rows. Supports
      the thyroid H2O2-generating role and the gp91phox relationship; the gp91phox similarity is sequence-based
      and is the likely origin of the superoxide-generation rows this review modifies.
- id: PMID:11514595
  title: Tyrosine cross-linking of extracellular matrix is catalyzed by Duox, a multidomain oxidase/peroxidase
    with homology to the phagocyte oxidase subunit gp91phox.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Correctly cited, but its two claims must be separated. The cuticle phenotype is a C. elegans
      RNAi result and does not transfer to the human protein (this review removes GO:0042335). Its report of peroxidase
      activity from an E. coli-expressed human Duox peroxidase domain is contradicted by PMID:19460756 and by
      the cryo-EM structure; UniProt records the conflict in a CAUTION line.
- id: PMID:15062544
  title: Structural and functional characterization of the two human ThOX/Duox genes and their 5'-flanking regions.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: Promoter characterization of the two human ThOX genes. The paper states that both promoters
      are NOT positively controlled by cAMP, so it is a poor source for the GO:0051591 IDA row that cites it;
      the term is retained on the strength of the curated UniProt induction statement instead. Useful for the
      statement that H2O2 supply limits thyroidal iodination.
