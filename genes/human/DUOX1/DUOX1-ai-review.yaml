existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:19460756
  qualifier: enables
  negated: true
  review:
    summary: 'Keep the NOT annotation. Two independent experiments agree that the N-terminal peroxidase-homology
      domain (PHD) of human DUOX1 is not a working peroxidase: the purified isolated domain binds no heme and
      has no peroxidase activity, and the cryo-EM structure of the full-length DUOX1-DUOXA1 complex shows the
      heme-ligating histidine absent and no heme density in the PHD.'
    action: ACCEPT
    reason: 'The negation is domain-specific and does not conflict with the heme binding annotated elsewhere in
      this review: the two hemes of DUOX1 are in the transmembrane NOX core, not in the PHD. The one contrary
      report, in which an E. coli-expressed h-Duox peroxidase domain cross-linked tyrosine ethyl ester (PMID:11514595),
      is the conflict UniProt records in its CAUTION line; it predates both direct heme measurements and is not
      a reason to drop a negation that two later, more direct assays support. The C. elegans orthologue behaves
      differently (its PHD binds heme covalently and has modest peroxidase activity), which is a property of that
      lineage and not of human DUOX1.'
    supported_by:
    - reference_id: PMID:19460756
      supporting_text: the isolated hDUOX1(1-593) does not bind heme and has no intrinsic peroxidase activity
    - reference_id: PMID:33420071
      supporting_text: key residues for heme binding, such as the heme ligand histidine, are missing in the PHD
        of hDUOX1
    - reference_id: PMID:33420071
      supporting_text: we did not observe any heme density in the structure of hDUOX1 PHD, suggesting PHD is probably
        not enzymatic functional in term of peroxidase activity
    - reference_id: PMID:19460756
      supporting_text: In contrast, CeDUOX1(1-589) binds heme covalently, exhibits a modest peroxidase activity,
        but does not oxidize bromide ion.
    - reference_id: file:human/DUOX1/DUOX1-uniprot.txt
      supporting_text: 'CAUTION: The role of the N-terminal peroxidase-like domain is unclear.'
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IDA
  original_reference_id: PMID:33420071
  qualifier: enables
  review:
    summary: 'Calcium binding is part of the catalytic mechanism: DUOX1 carries EF-hand modules in its long intracellular
      loop, calcium is resolved in the cryo-EM structure, and H2O2 production by the reconstituted DUOX1-DUOXA1
      complex is calcium-activated.'
    action: ACCEPT
    reason: Core. Calcium occupancy of the EF-hands is the switch that converts the complex to the active state,
      so this is a direct component of the oxidase mechanism rather than an incidental ligand. The InterPro EF-hand
      (IPR002048) mapping on the IEA row agrees with the structural evidence.
    supported_by:
    - reference_id: PMID:33420071
      supporting_text: the functional DUOX protein has an additional large N-terminal extracellular peroxidase
        homology domain (PHD) and a long intracellular loop 0 containing two EF-hand domains, and it requires
        an auxiliary DUOXA protein for proper function
    - reference_id: PMID:33420071
      supporting_text: we found the co-expression of DUOX1 and DUOXA1 resulted in cell membranes that showed robust
        calcium-activated, NADPH-dependent hydrogen peroxide production detected by the Amplex Red assay
    - reference_id: PMID:33420071
      supporting_text: their activities are regulated by intracellular calcium concentrations
    - reference_id: file:human/DUOX1/DUOX1-uniprot.txt
      supporting_text: 'ACTIVITY REGULATION: The NADPH oxidase activity is calcium-dependent'
