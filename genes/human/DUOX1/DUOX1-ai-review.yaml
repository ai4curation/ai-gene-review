id: Q9NRD9
gene_symbol: DUOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DUOX1 (dual oxidase 1) is a large, multi-pass membrane flavocytochrome that generates extracellular
  hydrogen peroxide. Its cytosolic dehydrogenase domain binds NADPH and FAD and passes electrons through two hemes
  in the 24-helix transmembrane layer to oxygen on the outer face of the membrane, producing H2O2 rather than
  superoxide. Activity is switched on by calcium through EF-hand modules in the long intracellular loop. The enzyme
  is obligately paired with the maturation factor DUOXA1, with which it folds and is N-glycosylated in the endoplasmic
  reticulum and then travels to the cell surface; in polarized epithelia the complex is sorted to the apical plasma
  membrane, and in migrating cells it concentrates at the leading edge. A large N-terminal peroxidase-homology
  domain faces the extracellular space, but in the human protein it lacks the heme-ligating histidine, binds no
  heme and has no intrinsic peroxidase activity, so its role is unresolved; the nematode orthologue's equivalent
  domain does bind heme and cross-links cuticle tyrosines. DUOX1 is expressed most strongly in airway surface
  epithelium and in thyrocytes. The H2O2 it releases is the co-substrate for extracellular peroxidases (lactoperoxidase
  at mucosal surfaces, thyroid peroxidase in the thyroid follicle, where DUOX2 is the dominant paralog), and also
  acts as a diffusible signal that drives EGFR/ERK and NF-kB-dependent epithelial responses to bacterial stimuli,
  antiviral defense via hypothiocyanite, cell motility and wound closure.
