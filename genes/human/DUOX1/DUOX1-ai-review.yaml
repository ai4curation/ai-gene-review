id: Q9NRD9
gene_symbol: DUOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DUOX1 is a membrane NADPH oxidase that assembles with DUOXA1 and generates extracellular
  hydrogen peroxide. Its transmembrane hemes and cytosolic FAD/NADPH-binding machinery conduct electron
  transfer, while intracellular EF-hand elements mediate calcium regulation. The extracellular N-terminal
  region has a peroxidase-like fold but lacks the intrinsic peroxidase activity of a conventional mammalian
  peroxidase. DUOX1-derived peroxide contributes to epithelial defense and redox signaling.
