  review:
    summary: Retain copper coordination as a supporting structural facet of the FVIII cofactor.
    action: ACCEPT
    reason: The mapped human cupredoxin-like domains are corroborated by the active recombinant human
      B-domain-deleted FVIII structure in PMID:17965321 (Methods; Results, Bound metal ions; Figure 2
      caption). Anomalous diffraction supports copper coordination in A1 and A3. These domain-associated
      sites support the architecture of the nonenzymatic cofactor, so copper binding is retained within
      the same core unit rather than treated as peripheral merely because it is structural. The article
      relates metal binding to domain association, but the structure itself is not a copper-depletion/reconstitution
      experiment and does not establish a fixed occupancy for every expression system or product. No oxidation-reduction
      chemistry is assigned to FVIII. The engineered heterodimer is distinct from natural F8B.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:17965321
