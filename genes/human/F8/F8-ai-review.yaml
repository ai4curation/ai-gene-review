id: P00451
gene_symbol: F8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F8 encodes coagulation factor VIII, a secreted copper-binding glycoprotein that circulates
  in association with von Willebrand factor. Proteolytic activation generates FVIIIa, a nonenzymatic cofactor
  that binds factor IXa and enhances its conversion of factor X to Xa on extracellular phospholipid surfaces,
  including activated platelets. This intrinsic-tenase reaction supports thrombin generation and blood
  coagulation; pathogenic F8 defects cause hemophilia A. Unactivated FVIII also enhances ADAMTS13-mediated
  cleavage of von Willebrand factor in biochemical shear assays, with effects sensitive to FVIII processing
  and its interaction with the substrate. The alternative F8B transcript encodes a distinct 216-residue
  protein with an alternative N terminus and observed intracellular expression.
