suggested_questions:
- question: How much does endogenous FVIII influence ADAMTS13-dependent VWF multimer processing in plasma,
    and how do VWF binding, direct ADAMTS13 contact and FVIII activation state contribute under physiological
    flow?
- question: Where does the natural 216-residue F8B protein act in cells, which partners does it engage,
    and does it have a molecular activity distinct from the processed full-length FVIII cofactor?
- question: Is native FVIII reproducibly present in platelet alpha-granule lumen, and can its localization
    be distinguished from VWF, extracellular uptake and surface-associated FVIII?
suggested_experiments:
- description: Compare sequence-verified full-length FVIII, activated FVIIIa and defined VWF-binding variants
    in human plasma and purified VWF/ADAMTS13 flow systems at matched physiological concentrations. Measure
    cleavage-site products and multimer distributions with FVIII-depletion/add-back and ADAMTS13-inhibition
    controls; separate direct enzyme effects from substrate presentation using peptide-substrate and binding
    assays.
- description: Detect endogenous F8B using its unique N-terminal sequence and product-selective perturbation,
    with rescue by the verified natural coding sequence. Combine compartment markers and secretion measurements
    with interaction analysis, then test any identified molecular activity directly alongside full-length
    FVIII and processed FVIIIa controls.
- description: Analyze washed human platelet fractions with orthogonal F8-specific peptide detection and
    immunolocalization, using granule markers, extracellular protease protection and uptake controls.
    Distinguish F8 from VWF and test whether stimulation releases a native granule pool rather than redistributing
    surface-associated protein.
