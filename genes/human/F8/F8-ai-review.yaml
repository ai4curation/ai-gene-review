  review:
    summary: Human B-domain-deleted FVIII and engineered furin-site variants bind plasma-derived human
      VWF.
    action: KEEP_AS_NON_CORE
    reason: The original Methods, Table 1 and supplementary Figure S5 caption identify human FVIII-BDD
      and furin-site deletion variants produced in BHK cells, with binding to immobilized full-length
      human plasma VWF measured by surface plasmon resonance. Background-subtracted curves were fitted
      to a 1:1 model; the BDD comparator has a reported dissociation constant of 0.7 nM and the tested
      variants retain binding. This is positive carrier association, not evidence that FVIII itself stabilizes
      or transports VWF. The intrinsic-tenase assays elsewhere in the paper test a separate cofactor role
      and do not convert every VWF-binding measurement into endopeptidase activation. Targeted current-term
      searches did not establish a VWF-specific binding term; generic protein-containing-complex binding
      would merely restate multimer contact. Retain this supported interaction as non-core under the standing
      campaign exception for experimentally supported generic binding. The BDD comparator and furin deletion
      variants are engineered proteins, not the naturally spliced F8B product; single-chain versus processed
      heterodimer forms also do not define natural splice isoforms.
    supported_by:
    - reference_id: PMID:27749002
