  review:
    summary: Retain the source-specific human FVIII–VWF association without replacing its partner by ADAMTS13.
    action: KEEP_AS_NON_CORE
    reason: 'The imported IPI context names VWF (UniProtKB:P04275). In PMID:18492805, Figure 5 and the
      binding ELISA Methods directly compare recombinant human FVIII-SQ with an a3-deleted derivative:
      loss of a3 impairs VWF binding. The same paper separately reports shear-dependent VWF cleavage by
      ADAMTS13, a modest direct ADAMTS13 interaction and peptide-substrate enhancement. Those observations
      remain biologically relevant, but they do not change this row''s VWF partner into ADAMTS13 or establish
      its independent FIXa-cofactor instance. Retain the supported carrier association as non-core under
      the standing generic-binding exception; the current targeted search did not establish an exact VWF-binding
      MF, and generic complex binding would not resolve this role. Complete main Methods/Results were
      available and selected passages were read; supplementary figures and pixels were not inspected.
      Human full-length and engineered B-domain/a3 constructs are not equated with natural F8B.'
    supported_by:
    - reference_id: PMID:18492805
