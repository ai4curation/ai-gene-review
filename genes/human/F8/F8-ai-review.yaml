  review:
    summary: Human FVIII–VWF binding is retained with the original assay-access limitation stated.
    action: KEEP_AS_NON_CORE
    reason: The verified original abstract describes binding of human FVIII to plasma VWF from healthy
      donors and severe hemophilia A patients, including solid-phase, gel-filtration and VWF–gold fluid-phase
      measurements. It reports saturable, reversible binding and warns that surface immobilization changes
      apparent stoichiometry. Publisher and linked PDF attempts did not recover the complete original
      Methods, so reagent processing and product-specific attribution are not treated as independently
      verified here. Nevertheless, the same human interaction is established by the independently inspected
      FVIII–VWF assays in PMID:18492805 and PMID:27749002. Retain the experimentally supported interaction
      as non-core under the campaign generic-binding exception, without asserting that the old paper tested
      either current natural product or that FVIII performs VWF carrier activity. No exact VWF-binding
      GO term was established by the targeted current search; the cofactor and enzyme-activation assays
      have separate mechanistic contexts and are not automatically substituted for this binding experiment.
    supported_by:
