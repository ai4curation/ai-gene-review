core_functions:
- description: Activated FVIIIa binds factor IXa and increases its proteolytic activation of factor X,
    performing the nonenzymatic cofactor step of intrinsic tenase on extracellular phospholipid surfaces.
    Factor IXa supplies catalysis. Human reconstitution and activated-platelet experiments support this
    membrane-associated activity, while circulating FVIII binds its VWF carrier before activation. Copper
    coordination in the A1 and A3 domains is retained as a supporting structural facet of this same cofactor
    architecture, not a separate redox activity; the observed engineered-heterodimer sites do not prescribe
    occupancy for every product or preparation. The active processed cofactor is distinct from engineered
    B-domain deletions and the natural 216-residue F8B product. Its FIXa-activator evidence is independent
    of the separate unactivated-FVIII/VWF/ADAMTS13 assays.
