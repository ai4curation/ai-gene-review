taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATAD3C is a primate paralog of the mitochondrial AAA+ ATPase ATAD3A that lacks ATAD3A's first
  ~70 residues. Long regarded as a pseudogene, it is expressed at the protein level. It is an integral
  mitochondrial membrane protein with its C-terminus in the intermembrane space. It keeps the Walker A
  and B nucleotide-binding motifs but has a cysteine in place of the AAA+ arginine finger. ATAD3C monomers
  incorporate into ATAD3A oligomers and reduce their size. Its overexpression lowers respiration and proliferation,
  raises ROS, and disrupts respiratory supercomplexes, indicating that it acts as a dominant-negative
  regulator of ATAD3A. Recombination between ATAD3A and ATAD3C creates pathogenic ATAD3A-ATAD3C fusion
  genes.
