- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003959
  review:
    summary: ATP hydrolysis activity (IEA, InterPro AAA domain). In oligomeric AAA+ ATPases each subunit's
      ATP site is completed by the arginine finger of its neighbour. ATAD3C keeps its own cis catalytic
      residues (Walker A K183, Walker B D236/E237), but it has a cysteine (C291) where ATAD3A has its
      arginine finger (R466). In a mixed ATAD3A/ATAD3C oligomer, an adjacent ATAD3A could still complete
      ATAD3C's site, but ATAD3C cannot complete its neighbour's. A homo-oligomer of ATAD3C therefore lacks
      any complete site, and in mixed complexes ATAD3C poisons the site next to it. The equivalent finger
      substitutions in SPAST abolish its ATPase activity and act dominant-negatively, and the ATAD3A-C
      fusion carrying this ATAD3C segment is pathogenic. None of the cited sources reports ATPase activity
      for ATAD3C. The domain-based mapping assumes a complete AAA+ module; over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[file:human/ATAD3C/ATAD3C-bioinformatics/RESULTS.md "**ATAD3A arginine finger R466 aligns
      to ATAD3C C291.** The window shows no arginine nearby (ATAD3A DWAINDRINEMVH / ATAD3C DWAINACIDVMVH),
      so the arginine finger is lost, not offset."] [file:human/ATAD3C/ATAD3C-bioinformatics/RESULTS.md
      "ATAD3C keeps the nucleotide-binding Walker A and B motifs but has lost the trans-acting arginine
      finger of the AAA+ module, so an ATAD3C subunit cannot complete the ATP site of its neighbour."]
      [PMID:32004445 "(C) The ATAD3A arginine finger, Arg466 (yellow) which is changed to a cysteine in
      the ATAD3A-C fusion gene, is overlaid with the SPAST arginine finger (Arg499; orange)."] [PMID:32004445
      "These variants have been shown to result in the complete loss of SPAST ATPase activity,19 leading
      to disease through a dominant-negative mechanism."] [PMID:38092275 "Our results demonstrate a negative
      dominant role of the ATAD3C paralog with implications for mitochondrial OXPHOS function and suggest
      that its expression regulates ATAD3A in the cell."]'
    supported_by:
    - reference_id: file:human/ATAD3C/ATAD3C-bioinformatics/RESULTS.md
      supporting_text: '**ATAD3A arginine finger R466 aligns to ATAD3C C291.** The window shows no arginine
        nearby (ATAD3A DWAINDRINEMVH / ATAD3C DWAINACIDVMVH), so the arginine finger is lost, not offset.'
    - reference_id: file:human/ATAD3C/ATAD3C-bioinformatics/RESULTS.md
      supporting_text: ATAD3C keeps the nucleotide-binding Walker A and B motifs but has lost the trans-acting
        arginine finger of the AAA+ module, so an ATAD3C subunit cannot complete the ATP site of its neighbour.
    - reference_id: PMID:32004445
      supporting_text: (C) The ATAD3A arginine finger, Arg466 (yellow) which is changed to a cysteine
        in the ATAD3A-C fusion gene, is overlaid with the SPAST arginine finger (Arg499; orange).
    - reference_id: PMID:32004445
