    label: CSF1-CSF1R complex
  supported_by:
  - reference_id: PMID:22153499
    supporting_text: the complex is characterized by bivalent binding of hCSF-1 to the receptor ectodomain (1 hCSF-1 dimer to 2 molecules of hCSF-1RD1-D5)
  - reference_id: PMID:20504948
    supporting_text: huIL-34 stimulated macrophage proliferation via the huCSF-1R, equivalently to huCSF-1
  - reference_id: PMID:18467591
    supporting_text: we used a collection of extracellular domains of transmembrane proteins to discover the receptor for IL-34, which was a known cytokine receptor, colony-stimulating factor 1 (also called macrophage colony-stimulating factor) receptor
- description: Ligand-induced trans-autophosphorylation by the split cytoplasmic tyrosine kinase domain (EC 2.7.10.1) on juxtamembrane, kinase-insert, activation-loop and C-terminal tyrosines; the phosphotyrosines dock SRC-family kinases, GRB2, PIK3R1, PLCG2 and CBL and CSF1R phosphorylates several of these effectors, propagating ERK1/2, PI3K-AKT and STAT signaling.
  molecular_function:
