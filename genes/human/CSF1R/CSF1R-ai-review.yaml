  - ensembl:ENSMUSP00000110923
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The viral-output phenotype is positive, but the specific host viral-process attribution
      is overextended.
    reason: The original PMID:20889566 mouse experiments delete Igf2r using Csf1r-promoter Cre, not
      Csf1r; that donor rationale is miscited for CSF1R. Separately, PMID:25060299 reports significantly
      reduced extracellular HIV p24 with 470 nM GW2580 in primary human fetal microglia. The all-points
      ligand comparison is nonsignificant; a ligand trend becomes significant only after exclusion
      of one control outlier, whereas the inhibitor contrasts are reported separately as significant.
      This is a real pharmacological phenotype, but receptor genetic confirmation, target engagement
      and quantitative viable-cell normalization are absent. The data do not distinguish CSF1R-mediated
      regulation of viral activity from a permissive host-cell state or maintenance effect. GO:0044794
      permits indirect host regulation and does not require physical viral contact; the problem is
      insufficient causal specificity for that process, not proof that CSF1R cannot contribute or
      that maintenance is the sole mechanism. MARK_AS_OVER_ANNOTATED therefore preserves the positive
      phenotype while qualifying the process attribution. The manuscript Methods list three inhibitor
      doses while final publisher Methods list 470 nM only; the shared reported 470 nM result is
      used without claiming a dose-response. The original transfer tuple and SOURCE_BAD donor assessment
      remain unchanged.
    supported_by:
    - reference_id: PMID:25060299
      supporting_text: a significant decrease in HIV p24 is seen in all culture conditions
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: UniProtKB:P09581
        source_status: SOURCE_BAD
        comment: The literal current mouse IGI cites PMID20889566, whose actual Methods perturb Igf2r
          with Csf1r-promoter Cre. Later human PMID25060299 support is separate from this inherited
          source.
      - source_id: ensembl:ENSMUSP00000110923
