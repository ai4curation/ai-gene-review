- description: 'Through its receptor signaling, CSF1R is the principal driver of survival, proliferation and differentiation of mononuclear phagocytes: monocytes, tissue macrophages, osteoclasts and microglia. Loss of CSF1R in mouse phenocopies CSF-1 deficiency (osteopetrosis, macrophage deficiency), and biallelic loss in human results in absence of microglia and dysosteosclerosis.'
