- id: file:human/CSF1R/CSF1R-source-evidence.yaml
  title: CSF1R source identity, propagation and assay evidence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Manually assembled provenance sidecar containing literal source, donor, phylogeny,
      rule, interaction and pathway records with source-access assessments. Its integrity and mirrors
      were checked; it is not an independent primary experiment or a substitute for the cited biological
      sources.
core_functions:
- description: CSF1R binds CSF1 or IL34 at the plasma membrane and catalyzes ATP-dependent protein-tyrosine
    phosphorylation, including receptor autophosphorylation. This receptor activity transmits ligand
    signals that support monocyte, macrophage and osteoclast differentiation and macrophage and microglial
    proliferation. GO:1990682 specifies the experimentally defined CSF1-bound dimeric receptor assembly;
    IL34 signaling occurs in a separate ligand-receptor assembly and is not assigned to that CSF1-specific
    complex.
  molecular_function:
    id: GO:0005011
    label: macrophage colony-stimulating factor receptor activity
  directly_involved_in:
  - id: GO:0038145
    label: macrophage colony-stimulating factor signaling pathway
  - id: GO:0061514
    label: interleukin-34-mediated signaling pathway
  - id: GO:0046777
    label: protein autophosphorylation
  - id: GO:0030224
    label: monocyte differentiation
  - id: GO:0030225
    label: macrophage differentiation
  - id: GO:0030316
    label: osteoclast differentiation
  - id: GO:0120041
    label: positive regulation of macrophage proliferation
  - id: GO:0061518
    label: microglial cell proliferation
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:1990682
    label: CSF1-CSF1R complex
  supported_by:
  - reference_id: PMID:20504948
    supporting_text: 'huIL-34 stimulated macrophage proliferation via the

      huCSF-1R, equivalently to huCSF-1'
  - reference_id: PMID:22153499
  - reference_id: PMID:22197934
  - reference_id: PMID:19132917
  - reference_id: PMID:23392676
  - reference_id: file:human/CSF1R/CSF1R-source-evidence.yaml
  - reference_id: file:human/CSF1R/CSF1R-uniprot.txt
    supporting_text: Tyrosine-protein kinase that acts as a cell-surface receptor
suggested_questions:
- question: Does the 306-residue CSF1R product reach the extracellular environment and bind CSF1
    or IL34 at endogenous abundance, and does it modulate full-length receptor signaling?
- question: Which cells and receptor-dependent steps account for the mouse callosal guidance phenotype,
    as distinct from altered microglial or midline-support development?
- question: Can the CSF1R–EPHB2/EPHA7 screen associations be reproduced at endogenous abundance and
    assigned a functional signaling consequence?
- question: Does genetic CSF1R depletion and rescue in human microglia reproduce the pharmacological
    HIV p24 result after accounting for viability, infection frequency and infectious progeny?
- question: How should the distinct IL34-CSF1R assembly be represented alongside the existing CSF1-CSF1R
    complex term?
suggested_experiments:
- description: Test isoform-specific expression, surface/secreted abundance and ligand binding of
    the 306-residue product alongside full-length CSF1R, with sequence-verified constructs and endogenous
    isoform measurements.
  hypothesis: The short product may have extracellular behavior distinct from full-length receptor
    signaling.
  experiment_type: Isoform-specific expression, localization and biochemical binding
- description: Use cell-type-specific receptor perturbation and live axon-growth measurements to
    separate guidance effects from microglial and midline-support changes.
  hypothesis: The callosal phenotype may reflect receptor-dependent midline-support functions rather
    than a demonstrated growth-cone chemotactic mechanism.
  experiment_type: Cell-type-specific perturbation and live imaging
- description: Repeat the human microglial viral-output experiment with genetic receptor loss/rescue,
    quantitative viability and infectious-virus endpoints, keeping ligand and inhibitor analyses
    separate.
  hypothesis: Receptor-specific perturbation may distinguish viral-process regulation from altered
    viability or host-cell state.
  experiment_type: Genetic depletion/rescue with quantitative viability and virological assays
status: DRAFT
