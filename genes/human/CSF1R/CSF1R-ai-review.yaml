suggested_questions:
- question: Is CSF1R expressed and functional cell-autonomously in neural progenitors and neurons, or are the neural developmental phenotypes of Csf1r-null mice (olfactory bulb atrophy, callosal defects, altered corticogenesis) entirely secondary to loss of microglia?
- question: Should GO have a specific term for IL-34-mediated signaling (and IL-34 binding), given that CSF1R and PTPRZ1 transduce IL-34 signals that differ in kinetics and outputs from CSF-1 signaling?
- question: Do heterozygous HDLS/ALSP kinase-domain mutations act by haploinsufficiency or by dominant-negative interference with the wild-type receptor in the dimeric complex?
- question: Is the reported CSF1R-EPHA7/EPHB2 association from the RTK interactome functionally meaningful (e.g., cross-phosphorylation) or a proximity artifact?
suggested_experiments:
- description: Conditional deletion of Csf1r specifically in neural progenitors (with microglia preserved, e.g. by microglia replacement or Csf1r FIRE-enhancer deletion controls) to separate cell-autonomous neural roles from microglia-dependent effects.
  hypothesis: Neural developmental phenotypes of Csf1r-null mice are secondary to loss of microglia rather than intrinsic CSF1R signaling in neural progenitors.
  experiment_type: conditional knockout mouse genetics
- description: Co-express wild-type and HDLS-associated kinase-dead CSF1R variants in macrophage or microglial lines and measure ligand-induced autophosphorylation, downstream signaling and proliferation compared with heterozygous null cells.
  hypothesis: HDLS kinase-domain variants act dominantly negative within ligand-induced receptor dimers.
  experiment_type: cell-based signaling assay
- description: Phosphoproteomic comparison of CSF-1- versus IL-34-stimulated human macrophages and microglia, with and without syndecan-1 or PTPRZ1 co-expression.
  hypothesis: IL-34 and CSF-1 generate qualitatively distinct CSF1R phosphotyrosine and effector profiles.
  experiment_type: phosphoproteomics
