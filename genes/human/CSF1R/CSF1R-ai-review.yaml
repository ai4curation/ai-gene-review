core_functions:
- description: Cell-surface receptor for the dimeric cytokines CSF-1 (M-CSF) and IL-34. Ligand binding to the D2-D3 Ig domains bridges two receptor molecules (stabilized by homotypic D4-D5 contacts), forming the CSF1-CSF1R signaling complex at the plasma membrane and activating the intrinsic tyrosine kinase to initiate M-CSF/IL-34 signaling.
  molecular_function:
    id: GO:0005011
    label: macrophage colony-stimulating factor receptor activity
  directly_involved_in:
