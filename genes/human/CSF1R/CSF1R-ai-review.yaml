  review:
    summary: Ligand (CSF-1 or IL-34) binding to CSF1R induces receptor tyrosine phosphorylation and phosphorylation of downstream signaling proteins.
    action: MARK_AS_OVER_ANNOTATED
    reason: The observation in PMID:20504948 (IL-34/CSF-1 stimulate CSF-1R tyrosine phosphorylation and signaling) is real, but CSF1R itself is the kinase that phosphorylates itself and its substrates. This is better captured by the MF (GO:0004714 / GO:0005011) and by GO:0046777 protein autophosphorylation; a very general "positive regulation of protein phosphorylation" BP adds little.
