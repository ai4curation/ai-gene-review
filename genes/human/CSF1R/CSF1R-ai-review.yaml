id: P07333
gene_symbol: CSF1R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSF1R (c-FMS, CD115) is a class III receptor tyrosine kinase of the CSF-1/PDGF receptor subfamily (with KIT, FLT3, PDGFRA and PDGFRB). It is a single-pass type I plasma membrane protein with five extracellular Ig-like domains, a juxtamembrane autoinhibitory region and a split cytoplasmic tyrosine kinase domain. CSF1R is the receptor for two structurally unrelated dimeric helical cytokines, CSF-1 (M-CSF) and IL-34, which bind the D2-D3 domains and bridge two receptor molecules into a 2:1 receptor:ligand-dimer complex stabilized by homotypic D4-D5 contacts. Dimerization relieves juxtamembrane autoinhibition and triggers trans-autophosphorylation on tyrosines (Y561, Y699, Y708, Y723, Y809, Y923, Y969) that dock SRC-family kinases, GRB2, PIK3R1, PLCG2 and CBL, activating ERK1/2, PI3K-AKT, PLCG2-PKC and STAT3/5 signaling; signaling is terminated by CBL-mediated ubiquitination, internalization and degradation and by phosphatases such as PTPN2. CSF1R signaling controls the survival,
  proliferation and differentiation of mononuclear phagocytes (monocytes, tissue macrophages, osteoclasts, microglia, Langerhans cells), and thereby bone remodeling, innate immunity, inflammation, fertility and mammary development; receptor-mediated endocytosis also clears circulating CSF-1. Heterozygous kinase-domain mutations cause adult-onset leukoencephalopathy with axonal spheroids (HDLS/ALSP), and biallelic loss causes BANDDOS with absent microglia, brain malformation and dysosteosclerosis. CSF1R is overexpressed in several epithelial cancers and is a drug target for depleting tumor-associated macrophages.
