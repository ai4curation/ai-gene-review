    supporting_text: CSF1 or IL34 binding leads to dimerization and activation by autophosphorylation on tyrosine residues
  - reference_id: file:human/CSF1R/CSF1R-uniprot.txt
    supporting_text: Phosphorylates PIK3R1, PLCG2, GRB2, SLA2 and CBL
