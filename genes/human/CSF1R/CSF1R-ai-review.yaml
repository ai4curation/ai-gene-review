id: P07333
gene_symbol: CSF1R
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSF1R (CD115/c-FMS) is a class III receptor tyrosine kinase activated by CSF1 and IL34.
  The extracellular D2–D3 region contacts ligand, while CSF1-driven assembly brings two receptor
  ectodomains around one CSF1 dimer. Ligand-dependent assembly of the full-length cell-surface receptor
  activates tyrosine autophosphorylation and downstream signaling that controls mononuclear-phagocyte
  survival, proliferation and differentiation, including macrophage, microglial and osteoclast functions.
  CSF1R signaling also influences cell migration, tissue development and inflammatory responses.
  Pathogenic variants cause neurological and skeletal disorders. An alternative 306-residue product
  lacks the canonical transmembrane and kinase regions.
alternative_products:
- name: '1'
  id: P07333-1
  sequence_note: Displayed 972-residue sequence, independently matched to official P07333-1 FASTA.
    Contains extracellular immunoglobulin-like domains, the transmembrane segment and the intracellular
    kinase domain.
- name: '2'
  id: P07333-2
  sequence_note: Official 306-residue sequence reconstructed exactly from VSP_047757 (residues 297–306
    replaced by GTPSPSLCPA) and VSP_047758 (307–972 absent). Retains residues 1–296 but lacks the
    canonical transmembrane and kinase regions. The functional studies do not establish equivalent
    signaling, secretion, ligand affinity or an antagonistic role for this numbered product.
