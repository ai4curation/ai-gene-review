    relevance: HIGH
    correctness: VERIFIED
    review_notes: Karniski 2004; wild-type DTDST glycosylated and localized to the plasma
      membrane of HEK-293 cells, mutants mislocalize/lose transport. Supports plasma-membrane
      location and sulfate transport.
- id: PMID:20219950
  title: Regulated transport of sulfate and oxalate by SLC26A2/DTDST.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Heneghan et al. 2010 (full text available); defines SLC26A2 as an
      electroneutral anion exchanger (sulfate/oxalate/chloride), establishes bidirectional
      oxalate/sulfate exchange, pH and PKC regulation. Primary support for the antiporter
      activity and oxalate transport.
