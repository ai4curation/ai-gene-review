id: P50443
gene_symbol: SLC26A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC26A2 (DTDST) is a plasma-membrane, multi-pass secondary-active sulfate
  transporter of the SLC26/SulP anion-exchanger family. It mediates electroneutral
  anion exchange, taking up extracellular sulfate in exchange for intracellular chloride
  (and hydroxyl), and also exchanges sulfate and oxalate for one another and for chloride.
  Sulfate imported by SLC26A2 feeds PAPS-dependent sulfation of glycosaminoglycans and
  proteoglycans, which is essential for cartilage extracellular matrix; the transporter
  is ubiquitously expressed but is rate-limiting in chondrocytes. In polarized epithelia
  (enterocytes, renal proximal tubule) it localizes to the apical/brush-border membrane.
  Loss-of-function mutations cause a recessive chondrodysplasia spectrum graded by residual
  sulfate-transport activity, including achondrogenesis type 1B, atelosteogenesis type 2,
  diastrophic dysplasia, and recessive multiple epiphyseal dysplasia.
