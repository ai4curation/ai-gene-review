  review:
    summary: Phylogenetic inference of chloride:bicarbonate antiporter activity from an IBD
      node seeded by the dedicated SLC26 Cl-/HCO3- exchangers (SLC26A3/DRA, SLC26A6,
      SLC26A1). SLC26A2 is not among the experimental donors for this term.
    action: MARK_AS_OVER_ANNOTATED
    reason: SLC26A2's own functional characterization does not demonstrate productive
      chloride/bicarbonate exchange - bicarbonate acts only as a weak (~20%) cis-inhibitor
      of sulfate uptake, while its demonstrated exchanges are sulfate/chloride,
      oxalate/chloride, sulfate/oxalate and chloride/chloride. The node placement extends
      a Cl-/HCO3- exchange function from the bicarbonate-exchanger subclade onto SLC26A2,
      where it is not supported. Over-annotation rather than a demonstrably false electronic
      mapping, so marked rather than removed.
    supported_by:
    - reference_id: PMID:20219950
      supporting_text: bidirectional SO(4)(2-)/Cl(-) exchange were not detectably electrogenic
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008330351
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node for the SLC26 Cl-/HCO3- exchanger function, grounded in the
          dedicated bicarbonate exchangers (SLC26A3/A6/A1). SLC26A2 descends from the family
          but functionally diverged to sulfate/chloride exchange and lacks demonstrated
          Cl-/HCO3- antiport, so the IBD should not scope onto it.
