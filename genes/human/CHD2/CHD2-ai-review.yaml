id: O14647
gene_symbol: CHD2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHD2 is a nuclear ATP-dependent chromatin remodeler with tandem chromodomains and an
  SNF2-family motor. It binds DNA and histones, uses ATP hydrolysis to organize nucleosomes, and regulates
  chromatin accessibility and histone H3.3 occupancy. Its recruitment can depend on lineage-specific
  transcription factors or, at DNA breaks, PARP1-generated poly(ADP-ribose). These chromatin activities
  contribute to gene-expression programs during development and to an accessible environment for nonhomologous
  end joining. Human CHD2 haploinsufficiency alters cortical interneuron development and is associated
  with developmental disorders and epilepsy. Mouse myogenic studies link Chd2 to MyoD-dependent chromatin
  marking before differentiation; human glioma studies show a distinct FOSL1-associated transcriptional
  context.
