      supporting_text: The authentic Baltz primary thesis Table S1 lists CHD2 in class II with L1
        -3.46, H1 NA, L2 -3.18, normalized mean +3.32 and iBAQ 5.38. L1 and L2 are light-crosslinked
        conditions, so the raw H/L signs correspond to enrichment in both measured captures. The table
        is gene-level and does not identify a CHD2 RNA target or a unique protein isoform.
