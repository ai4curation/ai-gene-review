  review:
    summary: Refine the inferred motif-specific activity to demonstrated cis-regulatory-region binding.
    action: MODIFY
    reason: The exact mouse donor E9PZM4 carries promoter-binding IMP evidence from PMID:22569126. ChIP/re-ChIP
      and MyoD gain/loss show MyoD-dependent Chd2 recruitment to myogenic promoters, including Ckm, without
      isolating a CHD2 recognition motif. GO:0000976 explicitly allows non-specific binding to transcription
      regulatory regions and preserves this experimentally observed regulatory context. Human CHD2 genomic
      occupancy in PMID:36115870 and FOSL1-dependent regulatory-element recruitment in PMID:38767413 independently
      corroborate the context. Purified human duplex-DNA binding in PMID:25384982 is a separate capability;
      it does not by itself encode promoter location. No inability to recognize particular sequences is
      asserted.
