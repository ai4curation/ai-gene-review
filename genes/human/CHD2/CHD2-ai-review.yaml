core_functions:
- description: Uses ATP hydrolysis to reorganize histone–DNA contacts and assemble or remodel nucleosomes
    on nuclear chromatin. Purified human CHD2 acts with histones and NAP1 in biochemical reconstitution;
    cellular chromatin expansion and H3.3 occupancy connect the motor to transcriptional and DNA-repair
    contexts without assigning autonomous histone-chaperone activity.
  molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0034728
    label: nucleosome organization
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:25384982
    supporting_text: couple ATP hydrolysis to remodeling
  - reference_id: PMID:26895424
  - reference_id: PMID:22569126
suggested_questions:
- question: Which RNA species contact endogenous CHD2, and do those contacts alter its chromatin remodeling
    rather than simply accompany poly(A)-RNA capture?
- question: How do the three human CHD2 products differ in motor activity, chromatin recruitment and RNA
    association under endogenous expression?
- question: Does CHD2 recognize any DNA sequence independently of recruiting transcription factors, or
    do DNA length/structure and partner recruitment explain its genomic specificity?
- question: During H3.3 assembly at DNA breaks and developmental genes, which histone chaperones cooperate
    with CHD2 and which physical step does its motor perform?
- question: Should CHD2 motor-dependent chromatin expansion and KU/XRCC4 recruitment at double-strand
    breaks be annotated directly to nonhomologous end joining or to its regulation? The actual human mechanism
    exceeds a necessity-only phenotype, but the small human remodeler comparator set does not resolve
    the annotation convention for this preparatory chromatin step.
suggested_experiments:
- description: Compare sequence-verified human CHD2 products in purified ATPase, nucleosome-remodeling
    and DNA-sequence/shape panels, retaining motor-mutant and histone-chaperone controls.
- description: Map endogenous CHD2 RNA contacts with orthogonal crosslinking assays and test separation-of-function
    mutants for RNA binding, factor recruitment and chromatin remodeling without changing protein abundance.
