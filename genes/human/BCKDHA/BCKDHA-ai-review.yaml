id: P12694
gene_symbol: BCKDHA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCKDHA encodes the alpha subunit of the mitochondrial branched-chain alpha-ketoacid
  dehydrogenase complex. Two BCKDHA and two BCKDHB chains form its E1 enzyme, which decarboxylates
  the ketoacids derived from leucine, isoleucine and valine and reductively acylates the lipoyl group
  carried by DBT. BCKDHA contributes residues that bind thiamine diphosphate and associated metal
  ions at the shared active site. DBT subsequently transfers the acyl group to CoA, and DLD reoxidizes
  the reduced lipoyl group. This coupled reaction constitutes the committed oxidative step of branched-chain
  amino acid catabolism in the mitochondrial matrix, downstream of transamination. BCKDK and PPM1K
  regulate the complex through reversible phosphorylation of the E1 alpha subunit. Phosphorylation
  of precursor Ser337, corresponding to mature-chain Ser292, disrupts recognition of the DBT lipoyl
  domain and reductive acylation more strongly than the initial decarboxylation reaction. Biallelic
  damaging BCKDHA variants cause maple syrup urine disease type 1A.
