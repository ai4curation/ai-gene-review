    label: branched-chain 2-oxo acid dehydrogenase activity
  description: 'Binds the diphosphate portion of thiamine diphosphate at the shared E1 active site
    and contributes to decarboxylation of branched-chain ketoacids followed by reductive acylation
    of the DBT lipoyl domain. The activity belongs to the alpha2-beta2 enzyme: BCKDHA helps position
    the cofactor and the lipoyl-domain recognition loop, while BCKDHB supplies complementary active-site
    residues. Magnesium supports cofactor binding, and structural potassium sites help organize the
    enzyme. Acyl-CoA transfer and lipoyl reoxidation are performed subsequently by DBT and DLD within
    the same multienzyme complex.'
