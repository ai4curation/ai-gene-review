id: Q9NRC8
gene_symbol: SIRT7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIRT7 is a nuclear and nucleolar NAD+-dependent protein deacylase that acts on histones and non-histone chromatin
  or ribosome-biogenesis factors. It preferentially deacetylates H3K18 and also acts on H3K36, deacetylates Pol I and pre-rRNA-processing
  proteins such as PAF53, fibrillarin, and U3-55K to promote rDNA transcription and rRNA maturation, desuccinylates H3K122
  at DNA double-strand breaks to compact chromatin during repair, and deglutarylates H4K91 to stabilize chromatin.
