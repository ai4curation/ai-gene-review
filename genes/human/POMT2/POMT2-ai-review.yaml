suggested_questions:
- question: >-
    What sequence or folded-domain features distinguish the alpha-dystroglycan/KIAA1549 class of
    POMT1:POMT2 substrates from cadherin and plexin substrates that use a POMT-independent
    O-mannosylation pathway?
suggested_experiments:
- description: >-
    Combine endogenous POMT2 depletion/rescue with O-mannose glycoproteomics and engineered
    alpha-dystroglycan/KIAA1549 substrate swaps to define the ER client features recognized by the
    POMT1:POMT2 complex.
