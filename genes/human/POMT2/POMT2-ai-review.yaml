id: Q9UKY4
gene_symbol: POMT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Protein O-mannosyl-transferase 2 is an endoplasmic-reticulum multi-pass membrane
  glycosyltransferase that forms the active POMT1:POMT2 complex. The complex transfers mannose
  from dolichyl-phosphate mannose to serine and threonine residues on nascent secretory-pathway
  glycoproteins, initiating protein O-linked mannosylation on alpha-dystroglycan and a narrow
  set of related mucin-like substrates.
