      the aryl sulfotransferase activity of the SULT1A1 homodimer.
    supporting_text: >-
      This reaction takes place in the 'cytosol' and  is mediated by the 'aryl
      sulfotransferase activity' of 'SULT1A1 homodimer'.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Directly states both the location and the catalytic form (homodimer), supporting
      the cytosol annotations and the proposed homodimerization annotation.
- id: Reactome:R-HSA-158860
  title: SULT1A1 dimer sulfonates NHABP
  findings:
