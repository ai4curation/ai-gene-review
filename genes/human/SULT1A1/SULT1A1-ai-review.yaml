id: P50225
gene_symbol: SULT1A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SULT1A1 (sulfotransferase 1A1; historically thermostable phenol sulfotransferase,
  TS-PST / P-PST-1 / HAST1 / ST1A3) is a cytosolic, homodimeric sulfotransferase
  (EC 2.8.2.1) that transfers the sulfonate group of 3'-phosphoadenosine
  5'-phosphosulfate (PAPS) onto the hydroxyl group of small acceptor molecules,
  releasing adenosine 3',5'-bisphosphate. His108 acts as the catalytic base and a
  conserved PAPS-binding cradle (residues 48-53, 130, 138, 193, 227-232, 255-259)
  positions the donor; the acceptor pocket is small, hydrophobic and unusually
  plastic, which gives the enzyme its hallmark broad specificity for simple planar
  phenols and also produces partial substrate inhibition, because a second acceptor
  molecule can bind in a catalytically unproductive orientation. It is the dominant
  sulfotransferase of human liver and is also expressed in gut, lung, adrenal, brain,
  thyroid, platelets and skin, where it carries out phase II conjugation of drugs and dietary
  and environmental phenols - acetaminophen, minoxidil, 4-nitrophenol, flavonoids
  such as hesperetin, and the gut-bacterial metabolite 4-ethylphenol - converting them
  to water-soluble sulfate esters for excretion. Among the human sulfotransferases that
  have been compared directly it has the highest affinity for the iodothyronines,
  sulfating the outer-ring 4'-hydroxyl of 3,3'-T2, reverse T3, T3 and T4 (preference
  3,3'-T2 >> rT3 > T3 > T4; Km 0.14 uM for 3,3'-T2, some 240-fold tighter than SULT1A3)
  and thereby feeding thyroid hormone into the deiodinase-mediated degradation route;
  SULT1A3 and SULT1B1 sulfate iodothyronines as well. The same chemistry
  has a toxicological face: sulfonation of N-hydroxy-arylamines and N-hydroxy
  heterocyclic amines yields unstable esters that decompose to DNA-binding
  electrophiles, making SULT1A1 a major bioactivator of dietary and environmental
  procarcinogens. It additionally sulfates 17beta-estradiol, dopamine and ethanol in
  vitro, but with affinities far below those of the isoforms dedicated to those
  substrates (SULT1E1 and SULT1A3). The gene is polymorphic and copy-number variable;
  the common Arg213His allele (SULT1A1*2) lowers both activity and thermostability.
