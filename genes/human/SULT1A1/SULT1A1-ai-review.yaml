        under the conditions used, suggesting that it is a bona fide inhibitor of
        SULTs.
      reference_section_type: ABSTRACT
- term:
    id: GO:0051923
    label: sulfation
  evidence_type: IDA
  original_reference_id: PMID:19548878
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Correct biological process, but carrying an inappropriate qualifier. SULT1A1 is
      the enzyme that performs the sulfonate transfer, so it is involved_in sulfation,
      not merely acts_upstream_of_or_within it; acts_upstream_of_or_within is intended
      for gene products whose relationship to a process is indirect or unresolved.
    action: ACCEPT
    reason: >-
      The term itself is right and is the gene's core process, so the row is kept. The
      recommended curation fix is a qualifier change to involved_in, which would make
      it consistent with the four other sulfation rows on this gene (IBA and three
      IDA) that already use involved_in. The review schema records term-level, not
      qualifier-level, replacements, so the correction is noted here.
    supported_by:
    - reference_id: PMID:19548878
      supporting_text: >-
        KYNA also exerted an inhibitory activity towards hSULT1A1 and hSULT1B1.
      reference_section_type: ABSTRACT

