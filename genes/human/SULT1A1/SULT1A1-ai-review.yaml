# ------------------------------------------------------------- IDA: PMID:23207770 ethanol
- term:
    id: GO:0006068
    label: ethanol catabolic process
  evidence_type: IDA
  original_reference_id: PMID:23207770
  qualifier: involved_in
  review:
    summary: >-
      SULT1A1 is one of four human SULTs able to sulfate ethanol to ethyl sulfate.
      The authors themselves describe ethyl sulfate as a minor direct ethanol
      metabolite whose interest is as a consumption biomarker, and the highest
      ethanol-sulfating activity in human tissue was found in small intestine, not in
      the SULT1A1-dominated liver.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Ethanol is overwhelmingly disposed of by alcohol dehydrogenase and CYP2E1;
      sulfation accounts for a negligible fraction of ethanol clearance. Annotating
      SULT1A1 to ethanol catabolic process overstates a quantitatively trivial,
      non-selective side reaction shared with SULT1A2, SULT1A3 and SULT1C4. Retained
      rather than removed because the activity is genuine and the ethyl sulfate
      biomarker is real.
    supported_by:
    - reference_id: PMID:23207770
      supporting_text: >-
        Ethyl sulfate, a minor and direct ethanol metabolite in adult human body, has
        been implicated as a biomarker for alcohol consumption and in utero exposure
        to ethanol.
      reference_section_type: ABSTRACT
    - reference_id: PMID:23207770
      supporting_text: >-
        A systematic analysis revealed four ethanol-sulfating SULTs, SULT1A1, SULT1A2,
        SULT1A3, and SULT1C4, among the eleven human SULT enzymes previously prepared
        and purified.
      reference_section_type: ABSTRACT
- term:
    id: GO:0004062
    label: aryl sulfotransferase activity
  evidence_type: IDA
  original_reference_id: PMID:23207770
  qualifier: enables
  review:
    summary: >-
      The acceptor assayed in this paper is ethanol, an aliphatic primary alcohol with
      no aromatic ring. GO:0004062 is defined as PAPS + a phenol = an aryl sulfate +
      PAP, so this particular experiment does not demonstrate aryl sulfotransferase
      activity, even though SULT1A1 undoubtedly has that activity on other evidence.
    action: MODIFY
    reason: >-
      Mis-typed term for the assayed reaction. Ethanol sulfation yields ethyl sulfate,
      an alkyl sulfate, which is precisely the reaction defining GO:0004027 alcohol
      sulfotransferase activity (PAPS + an alcohol = PAP + an alkyl sulfate).
      Replacing the term keeps this genuine finding in the record and makes the
      annotation set state something the other rows do not - that the acceptor pocket
      tolerates a non-aromatic alcohol. This is deliberately inconsistent with the
      nine ACCEPT decisions on GO:0004062 elsewhere in this file: those rest on
      phenolic acceptors (4-nitrophenol, 2-naphthol, iodothyronines,
      N-hydroxy-arylamines) and are unaffected, so GO:0004062 remains a correct and
      well-supported annotation for the gene. Only this row's evidence fails to
      support it.
    proposed_replacement_terms:
    - id: GO:0004027
      label: alcohol sulfotransferase activity
    supported_by:
    - reference_id: PMID:23207770
      supporting_text: >-
        A systematic analysis revealed four ethanol-sulfating SULTs, SULT1A1, SULT1A2,
        SULT1A3, and SULT1C4, among the eleven human SULT enzymes previously prepared
        and purified.
      reference_section_type: ABSTRACT
- term:
    id: GO:0050427
    label: 3'-phosphoadenosine 5'-phosphosulfate metabolic process
  evidence_type: IDA
  original_reference_id: PMID:23207770
  qualifier: involved_in
  review:
    summary: >-
      Purified SULT1A1 was shown to consume PAPS in transferring sulfonate to ethanol,
      and the metabolic-labelling experiment followed radiolabelled sulfate through
      PAPS into ethyl sulfate in HepG2 cells. Correct.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:23207770
      supporting_text: >-
        A systematic analysis revealed four ethanol-sulfating SULTs, SULT1A1, SULT1A2,
        SULT1A3, and SULT1C4, among the eleven human SULT enzymes previously prepared
        and purified.
      reference_section_type: ABSTRACT
- term:
    id: GO:0051923
    label: sulfation
  evidence_type: IDA
  original_reference_id: PMID:23207770
  qualifier: involved_in
  review:
    summary: >-
      Direct demonstration of SULT1A1-catalysed sulfation, here of ethanol. Correct
