# ---------------------------------------------------------------- IBA (PAINT)
- term:
    id: GO:0004062
    label: aryl sulfotransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic (IBA) inference of the defining catalytic activity of the SULT1
      family: PAPS-dependent transfer of a sulfonate group to a phenolic acceptor
      (EC 2.8.2.1). This is the correct core molecular function for SULT1A1 and is
      independently established by five EXP and three IDA annotations plus four
      crystal structures of the human enzyme.
    action: ACCEPT
    reason: >-
      The IBD node behind this IBA is seeded by a large, well-characterized set of
      vertebrate SULT1 members (mouse, rat, cow, dog, chicken and multiple human
      paralogs). SULT1A1 sits squarely inside the clade that inherited the activity,
      retains His108 and the complete PAPS-binding cradle, and has its own direct
      experimental evidence for the term - which is why P50225 legitimately appears
      in its own WITH/FROM list, marking descendant-level experimental grounding
      rather than circularity.
    supported_by:
    - reference_id: PMID:22069470
      supporting_text: >-
        Cytosolic sulfotransferases (SULTs) are mammalian enzymes that detoxify a
        wide variety of chemicals through the addition of a sulfate group.
      reference_section_type: INTRODUCTION
    - reference_id: file:human/SULT1A1/SULT1A1-uniprot.txt
      supporting_text: >-
        Sulfotransferase that utilizes 3'-phospho-5'-adenylyl sulfate (PAPS) as
        sulfonate donor to catalyze the sulfate conjugation of a wide variety of
        acceptor molecules bearing a hydroxyl or an amine group.
