# --------------------------------------------------------- IDA: PMID:8093002 (HAST1)
- term:
    id: GO:0004062
    label: aryl sulfotransferase activity
  evidence_type: IDA
  original_reference_id: PMID:8093002
  qualifier: enables
  review:
    summary: >-
      COS-7-expressed SULT1A1 (HAST1) sulfates the model phenol 4-nitrophenol with
      Km 0.6 uM, and its DCNP inhibition and thermostability profiles match liver
      cytosolic P-PST. This is the classic demonstration of the gene's defining
      phenol-sulfating activity.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:8093002
      supporting_text: >-
        COS-expressed HAST1 was shown to be enzymatically active in sulphating
        p-nitrophenol with high affinity (Km 0.6 microM), whereas dopamine was the
        preferred substrate for HAST3 (Km 9.7 microM).
      reference_section_type: ABSTRACT
- term:
    id: GO:0042420
    label: dopamine catabolic process
  evidence_type: IDA
  original_reference_id: PMID:8093002
  qualifier: involved_in
  review:
    summary: >-
      SULT1A1 can sulfate dopamine, but only as a poor secondary substrate: Km 345 uM
      with Vmax 0.16 nmol/min/mg, against Km 0.6 uM for 4-nitrophenol in the same
      study. The authors of the cited paper explicitly frame this as a cross-reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The very paper supplying this IDA distinguishes the phenol-sulfating (P-PST,
      SULT1A1) and monoamine-sulfating (M-PST, SULT1A3) forms and reports that each
      sulfates the other's substrate with a Km at least two orders of magnitude
      worse. SULT1A3 (Km 9.7 uM for dopamine) is the physiological catecholamine
      sulfotransferase; annotating SULT1A1 to dopamine catabolic process implies a
      dedicated role in monoamine disposal that the kinetics do not support. The row
      is retained but flagged rather than removed, since the activity itself is real
      and UniProt records both dopamine 3-O- and 4-O-sulfate reactions.

      The division of labour is not merely kinetic: it has a known structural basis.
      Dajani et al. mapped SULT1A3's catecholamine preference to a single acceptor-pocket
      residue, Glu146, and showed that the E146A substitution alone converts SULT1A3's
      catalytic properties and substrate preference to resemble SULT1A1's. SULT1A1
      carries Ala at that position. So the residue that makes an enzyme a dopamine
      sulfotransferase is precisely the one SULT1A1 lacks, which is a strong independent
      argument that dopamine disposal is SULT1A3's role rather than a shared one.
    supported_by:
    - reference_id: PMID:9855620
      supporting_text: >-
        The change of a single amino acid, E146A, was sufficient to transform the
        catalytic properties and substrate preference of SULT1A3, such that they closely
        resembled those of SULT1A1.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9855620
      supporting_text: >-
        a SULT isoform (SULT1A3 or the monoamine-sulfating form of
        phenolsulfotransferase) has evolved with considerable selectivity for dopamine
        and other biogenic amines
      reference_section_type: ABSTRACT
    - reference_id: PMID:8093002
      supporting_text: >-
        HAST1 could also sulphate dopamine, as could HAST3 sulphate p-nitrophenol, but
        the Km for these reactions were at least two orders of magnitude greater than
