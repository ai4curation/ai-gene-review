proposed_new_terms:
- proposed_name: iodothyronine sulfotransferase activity
  proposed_definition: >-
    Catalysis of the reaction: 3'-phosphoadenosine 5'-phosphosulfate + an iodothyronine
    = adenosine 3',5'-bisphosphate + an iodothyronine sulfate + H+. The sulfonate group
    is transferred to the phenolic 4'-hydroxyl of the outer ring of thyroid hormones and
    their metabolites, including L-thyroxine (T4), 3,3',5-triiodo-L-thyronine (T3),
    3,3',5'-triiodo-L-thyronine (reverse T3) and 3,3'-diiodo-L-thyronine.
  justification: >-
    GO has no molecular function term for iodothyronine sulfation, although it is a
    principal route of thyroid hormone inactivation and is the highest-affinity
    chemistry documented for SULT1A1 (Km 0.14 uM for 3,3'-T2, roughly 240-fold tighter
    than SULT1A3). UniProt curates four distinct iodothyronine RHEA reactions for it on
    P50225 (RHEA:67876, RHEA:67888, RHEA:67892, RHEA:83575) with ECO:0000269 evidence,
    and Reactome models three of them (R-HSA-176474, R-HSA-176585). At present curators
    must fall back on either GO:0008146 sulfotransferase activity, which loses the
    substrate entirely, or GO:0004062 aryl sulfotransferase activity, which is correct
    chemically but does not distinguish thyroid hormone from any other phenol.

    The chemistry is independently replicated rather than resting on a single study.
    PMID:11739018 measures the same 3,3'-T2 > rT3 > T3 > T4 ordering in a second
    laboratory using both common allozymes, and adds the observation that 3,5-T2 - the
    one iodothyronine of the series without an outer-ring hydroxyl - is by far the
    poorest acceptor, which is what licenses writing outer-ring 4'-regiospecificity into
    the definition above. PMID:9848125 separates SULT1A1 from its closest paralog on
    this chemistry: hydroxylated PCBs inhibit 3,3'-T2 sulfation by hSULT1A1 but not by
    hSULT1A3. PMID:15531517 shows the activity is measurable in native human thyroid
    cytosol with the same 3,3'-T2 preference, so the term is not describing a
    recombinant-only phenomenon.

    Suggest "thyroid hormone sulfotransferase activity" as an exact synonym rather than
    the primary label. The substrate-class label is the more accurate of the two because
    the highest-affinity, preferred acceptors (3,3'-T2 and reverse T3) are inactive
    thyroid hormone *metabolites* rather than the active hormones, so the physiological
    centre of this chemistry is terminal clearance of already-degraded iodothyronines
    rather than regulation of active T3.

    Generic applicability: the term is reusable beyond SULT1A1. UniProt carries curated
    iodothyronine reactions for SULT1A3 (P0DMM9, four) and SULT1B1 (O43704, three).
    An earlier draft of this proposal also listed SULT1E1; that was asserted without
    checking and is wrong - P49888 has no curated iodothyronine catalytic activity at
    all (its five curated reactions are estrone, 24S-hydroxycholesterol, 17beta-estradiol,
    dehydroepiandrosterone and 4-ethylphenol), so SULT1E1 must be verified against
    primary literature before the term is carried to it. An independent OLS query
    confirms no existing GO molecular-function term covers this reaction.
  proposed_parent:
    id: GO:0004062
    label: aryl sulfotransferase activity
  supported_by:
  - reference_id: PMID:10199779
    supporting_text: >-
      In all cases, the substrate preference was 3,3'-T2 >> rT3 > T3 > T4.
    reference_section_type: ABSTRACT
  - reference_id: PMID:11739018
    supporting_text: >-
      Based on K(m) values, the preferences of these SULT1A1 allozymes for iodothyronine
      substrates were the same (3,3'-diiodothyronine (3,3'-T(2))>3', 5',3-triiodothyronine
      (rT(3))>T(3)>thyroxine (T(4))>>3,5-diiodothyronine (3,5-T(2))).
    reference_section_type: ABSTRACT
  - reference_id: PMID:15531517
    supporting_text: >-
      The preference of thyroid gland SULT activities for 3,3'-T(2) suggests that
      sulfation may enhance degradation of intrathyroidal 3,3'-T(2) for iodide
      reutilization.
    reference_section_type: ABSTRACT
  - reference_id: file:human/SULT1A1/SULT1A1-hypotheses/proposed-term/openscientist.md
    supporting_text: >-
      Live UniProt and OLS queries independently confirm the four cited RHEA reactions
      (with ECO:0000269 evidence) and the absence of any existing MF term.
  - reference_id: file:human/SULT1A1/SULT1A1-uniprot.txt
    supporting_text: >-
      Catalyzes the sulfation of T4 (L-thyroxine/3,5,3',5'-tetraiodothyronine), T3
      (3,5,3'-triiodothyronine), rT3 (3,3',5'-triiodothyronine) and 3,3'-T2
      (3,3'-diiodothyronine), with a substrate preference of 3,3'-T2 > rT3 > T3 > T4.

knowledge_gaps:
- gap_statement: >-
    The site at which the gut-microbial metabolite 4-ethylphenol is sulfated to 4-EPS
    in vivo, and whether SULT1A1 is the enzyme that does it, are unknown - the
    attribution rests on in vitro biochemistry with recombinant enzyme.
  boundary: >-
    Established: 4-ethylphenol is sulfated to 4-EPS by SULT1A1 and other
    sulfotransferases in vitro (UniProt RHEA:70607, ECO:0000269|PubMed:35165440);
    4-EPS enters the brain, impairs oligodendrocyte maturation and myelination, and
    produces anxiety-like behaviour in mice.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  significance: >-
    If SULT1A1 is the principal 4-EP sulfotransferase, a common polymorphic
    xenobiotic-metabolizing enzyme would sit directly on a gut-microbiome-to-brain
    axis, and this activity is currently absent from GOA altogether.
  resolution: >-
    Tissue-resolved measurement of 4-EP sulfation in Sult1a1-null versus
    humanized-SULT1A1 mice, and isoform-selective inhibition or knockdown in human
    intestinal and hepatic models. Curation-side, an annotation for 4-ethylphenol
    sulfation should be added from PMID:35165440 / RHEA:70607.
  provenance:
  - reference_id: PMID:35165440
    supporting_text: >-
      though the site(s) of 4EP sulfation remains unknown
    reference_section_type: RESULTS
  - reference_id: PMID:35165440
    supporting_text: >-
      We observed sulfation of 4EP to 4EPS by the sulfotransferase SULT1A1 and others
      during in vitro biochemical reactions
    reference_section_type: RESULTS
- gap_statement: >-
    No endogenous metabolite has been shown to depend on SULT1A1 in vivo, and a
    comparative-evolution test now argues that the original framing of this gap was
    wrong: the acceptor pocket shows no sign of being tuned to a dedicated endogenous
    acceptor, so what remains open is which substrates matter physiologically for a
    broad-specificity enzyme, not which single acceptor it evolved for.
  boundary: >-
    Established: the active site is small, hydrophobic and conformationally plastic,
    which is the structural explanation for the broad specificity; the enzyme sulfates
    iodothyronines with sub-micromolar affinity and estradiol, dopamine and ethanol
    with far weaker affinity. Newly established by comparative analysis: the pocket is
    less conserved than the protein scaffold across SULT1A1 orthologs (0.836 vs 0.868
    mean identity) and is the most divergent region across the human SULT1 paralogs
    (0.511 vs 0.629), the signature of a specificity-diversifying module rather than a
    lock-and-key site. Two pocket residues are poorly conserved even among mammalian
    orthologs (Phe247 identity 0.20, Ile89 0.50), Phe247 carries a common human missense
    variant, and gnomAD shows no pocket-specific depletion of missense variation. The
    classic low-activity allele Arg213His lies outside the pocket entirely. Caveat: the
    individual pocket-versus-scaffold statistical tests are non-significant (n = 11
    pocket residues), so this is an absence of evidence for focused constraint, with
    three independent lines trending the same way, rather than positive proof of
    promiscuity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Distinguishing a dedicated endogenous substrate from generalized chemical defence
    determines whether SULT1A1's core function should be modelled as a metabolic step
    in a named pathway or as a detoxification activity with no fixed input. The
    comparative evidence now favours the latter, which supports retaining the broad
    aryl/phenol sulfotransferase molecular function and argues against narrowing
    SULT1A1 to a dedicated acceptor. Note that within the SULT1A subfamily dedicated
    specificity does exist, but in the paralog: SULT1A3's preference for catecholamines
    is conferred by the single pocket-region residue Glu146, where SULT1A1 has Ala.
  resolution: >-
    The evolutionary half is addressed. What remains is the physiological half:
    untargeted sulfo-metabolomics comparing SULT1A1-null and wild-type human hepatocyte
    and enteroid models, to identify which endogenous sulfoconjugates actually depend on
    the enzyme in the absence of a dedicated acceptor.
  provenance:
  - reference_id: PMID:22069470
    supporting_text: >-
      We found that active site plasticity enables binding of different acceptors and
      identified dramatic structural changes in the SULT1A1 active site leading to the
      binding of a second acceptor molecule in a conserved yet non-productive manner.
    reference_section_type: ABSTRACT
  - reference_id: PMID:10199779
    supporting_text: >-
      SULT1A1 clearly shows the highest affinity for both iodothyronines and PAPS, but
      it remains to be established whether it is the prominent isoenzyme for sulfation
      of thyroid hormone in human liver and kidney.
    reference_section_type: ABSTRACT
  - reference_id: file:human/SULT1A1/SULT1A1-hypotheses/gap-endogenous-acceptor-constraint/openscientist.md
    supporting_text: >-
      The SULT1A1 pocket behaves as a promiscuity-optimised, specificity-diversifying
      site, not a conserved lock-and-key for a single endogenous acceptor.
  - reference_id: PMID:9855620
    supporting_text: >-
      The change of a single amino acid, E146A, was sufficient to transform the
      catalytic properties and substrate preference of SULT1A3, such that they closely
      resembled those of SULT1A1.
    reference_section_type: ABSTRACT

suggested_questions:
- question: >-
    Is SULT1A1 the enzyme that performs the bulk of iodothyronine sulfation in human
    liver and kidney, or does its sub-micromolar Km simply make it the best-performing
    isoform in vitro? The question posed in 1999 does not appear to have been settled.
  experts:
  - Theo J. Visser
  - Michael W. H. Coughtrie
- question: >-
    Should the seven duplicate Reactome-derived cytosol rows, and the parallel
    cytoplasm rows from IBA, IEA and EXP, be consolidated? Nine cellular-component
    annotations currently assert one uncontroversial fact.
- question: >-
    Does the SULT1A1-SULT2B1 interaction detected in four independent large-scale
    screens (UniProt NbExp=8) reflect heterodimerization through the conserved KTVE
    motif, as demonstrated for SULT4A1, or is it an artefact of the assay formats?
  experts:
  - Rodney F. Minchin
  - Neville J. Butcher

suggested_experiments:
- hypothesis: >-
    SULT1A1 is the dominant iodothyronine sulfotransferase in human liver, and common
    SULT1A1 genotypes and copy numbers therefore modulate thyroid hormone disposal.
  description: >-
    Generate SULT1A1 knockout and SULT1A3/SULT1B1/SULT1E1 single- and multi-knockout
    human hepatocyte lines (or primary hepatocytes with isoform-selective siRNA), then
    measure T4, T3, rT3 and 3,3'-T2 sulfate output by LC-MS/MS at physiological
    substrate concentrations. Pair with genotype- and copy-number-stratified
    measurement of circulating T3 sulfate in a human cohort.
  experiment_type: isoform-selective knockout plus targeted LC-MS/MS metabolite flux
- hypothesis: >-
    Sulfation of 4-ethylphenol to the neuroactive metabolite 4-EPS is carried out by
    SULT1A1 in the intestinal epithelium.
  description: >-
    Compare 4-EPS production from orally administered 4-ethylphenol in Sult1a1-null,
    wild-type and SULT1A1-humanized mice, with tissue-resolved sampling of gut, portal
    blood, liver and brain. In parallel, measure 4-EP sulfation kinetics for each
    recombinant human SULT isoform to establish whether SULT1A1's Km is competitive at
    physiological 4-EP concentrations.
  experiment_type: knockout and humanized mouse pharmacokinetics with recombinant-enzyme kinetics
- hypothesis: >-
    The bare protein binding annotations to SULT2B1 reflect KTVE-motif-dependent
    heterodimerization, in which case they should carry GO:0046982 rather than
    GO:0005515.
  description: >-
    Repeat co-immunoprecipitation of SULT1A1 with SULT2B1 in human cells using
    wild-type SULT1A1 and a KTVE-motif mutant, alongside size-exclusion chromatography
    with multi-angle light scattering to establish the oligomeric state of the
    co-expressed pair. The same design already resolved the SULT1A1-SULT4A1 case.
  experiment_type: co-immunoprecipitation with dimerization-motif mutants plus SEC-MALS
- hypothesis: >-
    SULT1A1 has an endogenous acceptor that has not yet been identified, beyond the
    iodothyronines.
  description: >-
    Perform untargeted sulfo-metabolomics (negative-mode LC-MS with neutral-loss
    scanning for the sulfonate group) on SULT1A1-null versus isogenic wild-type human
    hepatocyte and intestinal enteroid models under unchallenged conditions, and
    validate any differential sulfoconjugate against recombinant enzyme.
  experiment_type: untargeted sulfo-metabolomics in isogenic knockout models

