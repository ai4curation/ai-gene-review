# ---------------------------------------------------- IDA: PMID:16221673 (estradiol)
- term:
    id: GO:0008210
    label: estrogen metabolic process
  evidence_type: IDA
  original_reference_id: PMID:16221673
  qualifier: involved_in
  review:
    summary: >-
      SULT1A1 does sulfate 17beta-estradiol to estradiol 3-sulfate (RHEA:52372), and
      the co-crystal structure shows how the acceptor pocket rearranges to admit a
      fused-ring steroid. But this is a low-affinity, substrate-inhibited reaction of
      an enzyme built for small phenols, whereas SULT1E1 is the dedicated,
      nanomolar-affinity human estrogen sulfotransferase.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine but peripheral activity. In the structure reported here the single
      estradiol molecule is bound in a non-productive orientation, forming the
      dead-end enzyme-PAP-E2 complex that explains the substrate inhibition - direct
      evidence that estradiol is a poor fit for this active site. Estrogen homeostasis
      should not be presented as part of SULT1A1's core function.
    supported_by:
    - reference_id: PMID:16221673
      supporting_text: >-
