    supporting_text: >-
      It can be sulfonated in the liver by cytosolic sulfotransferase 1A1 (SULT1A1)
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Pathway-level corroboration of the procarcinogen-bioactivation core function.
