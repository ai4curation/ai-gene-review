- id: PMID:10199779
  title: Characterization of human iodothyronine sulfotransferases.
  findings:
  - statement: >-
      Recombinant human SULT1A1 sulfates T4, T3, rT3 and 3,3'-T2 with the preference
      3,3'-T2 >> rT3 > T3 > T4, and has the lowest Km of the human SULTs tested for
      both the iodothyronine (0.14 uM for 3,3'-T2 vs 33 uM for SULT1A3) and for PAPS
      (0.65 uM vs 2.7 uM).
    supporting_text: >-
      The apparent Km values of 3,3'-T2 and T3 ... were 1.02 and 54.9 micromol/L for
      liver cytosol, 0.64 and 27.8 micromol/L for kidney cytosol, 0.14 and 29.1
      micromol/L for SULT1A1, and 33 and 112 micromol/L for SULT1A3, respectively.
    reference_section_type: ABSTRACT
  - statement: >-
      Sulfation channels thyroid hormone toward degradation by the type I iodothyronine
      deiodinase, so iodothyronine sulfotransferase activity is an inactivating step in
      thyroid hormone metabolism.
    supporting_text: >-
      Sulfation is an important pathway of thyroid hormone metabolism that facilitates
      the degradation of the hormone by the type I iodothyronine deiodinase
    reference_section_type: ABSTRACT
  - statement: >-
      The authors leave open whether SULT1A1 is the physiologically dominant
      iodothyronine sulfotransferase in human liver and kidney, despite its superior
      in vitro affinity.
    supporting_text: >-
      SULT1A1 clearly shows the highest affinity for both iodothyronines and PAPS, but
      it remains to be established whether it is the prominent isoenzyme for sulfation
      of thyroid hormone in human liver and kidney.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Directly establishes the highest-affinity substrate class
      for SULT1A1 and is the source of the thyroid hormone metabolic process IDA and
      the UniProt iodothyronine RHEA reactions. Also supplies the field's own statement
      of the open question about in vivo dominance.
- id: PMID:11739018
  title: "Characterization of human liver thermostable phenol sulfotransferase (SULT1A1)
    allozymes with 3,3',5-triiodothyronine as the substrate."
  findings:
  - statement: >-
      An independent laboratory reproduces the SULT1A1 iodothyronine substrate
      preference reported by PMID:10199779, and extends it: 3,5-T2, which lacks the
      outer-ring hydroxyl, is by far the poorest acceptor of the series. This is direct
      support for writing outer-ring 4'-regiospecificity into the proposed
      iodothyronine sulfotransferase activity definition.
    supporting_text: >-
      Based on K(m) values, the preferences of these SULT1A1 allozymes for iodothyronine
      substrates were the same (3,3'-diiodothyronine (3,3'-T(2))>3', 5',3-triiodothyronine
      (rT(3))>T(3)>thyroxine (T(4))>>3,5-diiodothyronine (3,5-T(2))).
    reference_section_type: ABSTRACT
  - statement: >-
      Both common allozymes (SULT1A1*1 Arg213 and SULT1A1*2 His213) sulfate
      iodothyronines with the same substrate preference and similar Km; the Arg213His
      polymorphism changes catalytic activity and thermostability, not specificity.
    supporting_text: >-
      Potential differences in thyroid hormone sulfation between individuals with
      predominant SULT1A1*1 versus SULT1A1*2 allozymes are most likely due to
      differences in catalytic activity rather than substrate specificity.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache; PubMed record checked (Li et al., J Endocrinol 2001).
      Added on review of PR #2835, which flagged that this paper was fetched but never
      cited. It is the independent replication that the proposed_new_terms entry needed:
      the same 3,3'-T2 > rT3 > T3 > T4 ordering measured in a different laboratory with
      recombinant allozymes, plus the 3,5-T2 result that the PMID:10199779 abstract does
      not report.
- id: PMID:15531517
  title: "Human thyroid phenol sulfotransferase enzymes 1A1 and 1A3: activities in
    normal and diseased thyroid glands, and inhibition by thyroid hormones and phytoestrogens."
  findings:
  - statement: >-
      SULT1A1 activity is present in native human thyroid tissue across 86 surgically
      obtained glands (35 normal, 26 nodular goiter, 25 autoimmune thyroid disease),
      establishing thyroid as a site of SULT1A1 expression and moving iodothyronine
      sulfation beyond recombinant-enzyme evidence.
    supporting_text: >-
      Activities of SULT1A1 and SULT1A3 determined in individual normal thyroid (n = 35),
      nodular goiter (n = 26), and autoimmune thyroid disease (n = 25) glands
    reference_section_type: ABSTRACT
  - statement: >-
      Of the iodothyronines tested, only 3,3'-T2 was sulfated by native thyroid SULT
      activity, matching the substrate preference measured for recombinant SULT1A1 and
      supporting an intrathyroidal role in degrading 3,3'-T2 for iodide reutilization.
    supporting_text: >-
      The preference of thyroid gland SULT activities for 3,3'-T(2) suggests that
      sulfation may enhance degradation of intrathyroidal 3,3'-T(2) for iodide
      reutilization.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache; PubMed record checked (Ebmeier & Anderson, JCEM 2004).
      Added on review of PR #2835. Partially answers the knowledge_gaps concern that the
      iodothyronine chemistry rests on recombinant enzyme: the activity is measurable in
      native human thyroid cytosol. It does not close the gap, because the assay reports
      tissue SULT1A1 activity rather than attributing the activity to the SULT1A1 gene
      product by knockdown or immunodepletion, so no annotation action is changed on the
      strength of it. Also the source for adding thyroid to the description tissue list.
- id: PMID:9848125
  title: "In vitro inhibition of thyroid hormone sulfation by polychlorobiphenylols:
    isozyme specificity and inhibition kinetics."
  findings:
  - statement: >-
      Hydroxylated PCB metabolites inhibit 3,3'-T2 sulfation by human SULT1A1 but not by
      human SULT1A3, discriminating the two closest paralogs on iodothyronine chemistry
      and confirming that SULT1A1 rather than SULT1A3 carries the PCB-sensitive thyroid
      hormone sulfating activity of human liver.
    supporting_text: >-
      The inhibition pattern and IC50 values were very similar for male and female rat
      liver and rSULT1C1 and hSULT1A1. PCB-OHs were not able to inhibit the T2
      sulfotransferase activity using hSULT1A3.
    reference_section_type: ABSTRACT
  - statement: >-
      Equal IC50 values with T2 and T3 as substrate argue that 3,3'-T2 is the preferred
      iodothyronine acceptor of the sulfotransferases acting on thyroid hormone,
      independently corroborating the kinetic preference order.
    supporting_text: >-
      IC50 values for the tested PCB-OHs were not different with either T2 or
      3,3',5-triiodothyronine (T3) as substrate, supporting the hypothesis that T2 is
      the preferred iodothyronine substrate for the sulfotransferases catalyzing the
      sulfation of the active hormone T3.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache; PubMed record checked (Schuur et al., Toxicol Sci 1998).
      Added on review of PR #2835. An inhibition study rather than a substrate study, so
      it supports no annotation on its own, but the hSULT1A1-versus-hSULT1A3 contrast is
      the isozyme discrimination the review otherwise argues only from Km ratios.
- id: PMID:28109953
  title: The classic pathways of thyroid hormone metabolism.
  findings:
  - statement: >-
      Review placing sulfation alongside deiodination, glucuronidation and ether-link
      cleavage as one of the four classical routes of thyroid hormone metabolism, which
      is the pathway-level context for the proposed iodothyronine sulfotransferase
      activity term.
    supporting_text: >-
      The major classical pathways of TH metabolism are deiodination, sulfation,
      glucuronidation, and ether-link cleavage.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache; PubMed record checked (van der Spek et al., Mol Cell
      Endocrinol 2017). Added on review of PR #2835. Background review, not primary
      evidence for SULT1A1 - it is cited only for pathway orientation and carries no
      annotation.
- id: PMID:12471039
  title: Structure of a human carcinogen-converting enzyme, SULT1A1. Structural and
    kinetic implications of substrate inhibition.
  findings:
  - statement: >-
      The first crystal structure of human SULT1A1 with a xenobiotic acceptor bound
      shows two p-nitrophenol molecules in the active site, explaining the enzyme's
      characteristic substrate inhibition, and reveals a flexible site that adapts to
      hydrophobic acceptors of varying size and shape.
    supporting_text: >-
      An unexpected finding is that the enzyme accommodates not one but two molecules
      of the xenobiotic model substrate p-nitrophenol in the active site.
    reference_section_type: ABSTRACT
  - statement: >-
      SULT1A1 is characterized as a major human sulfotransferase that both detoxifies
      and bioactivates diverse promutagens and procarcinogens.
    supporting_text: >-
      A major human sulfotransferase, SULT1A1, metabolizes and/or bioactivates many
      endogenous compounds and is implicated in a range of cancers because of its
      ability to modify diverse promutagen and procarcinogen xenobiotics.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Source of the PAPS-binding IDA, the PAPS metabolic
      process IDA, the xenobiotic metabolic process IDA and the aryl sulfotransferase
      IDA, and one of the three UniProt references for the homodimer.
- id: PMID:16221673
  title: The structure of human SULT1A1 crystallized with estradiol. An insight into
    active site plasticity and substrate inhibition with multi-ring substrates.
  findings:
  - statement: >-
      SULT1A1 co-crystallized with PAP and estradiol has a single E2 molecule bound in
      a non-productive orientation, a dead-end complex that quantitatively explains the
      partial substrate inhibition seen at high estradiol concentrations.
    supporting_text: >-
      The crystal structure of SULT1A1 that we present here has PAP and one molecule of
      E2 bound in a nonproductive mode in the active site.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Source of the steroid sulfotransferase and estrogen
      metabolic process IDAs and of RHEA:52372. Read carefully it argues for treating
      estradiol as a poor-fit, substrate-inhibited acceptor rather than a core
      substrate, which is the basis of the KEEP_AS_NON_CORE calls.
- id: PMID:19548878
  title: Inhibitory effects of kynurenic acid, a tryptophan metabolite, and its derivatives
    on cytosolic sulfotransferases.
  findings:
  - statement: >-
      Kynurenic acid inhibits recombinant human SULT1A1 without being sulfated itself,
      so the assays measure genuine SULT1A1 sulfotransferase activity toward its own
      acceptors.
    supporting_text: >-
      KYNA also exerted an inhibitory activity towards hSULT1A1 and hSULT1B1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. An inhibitor-characterization study rather than a
      substrate study; supports the generic sulfotransferase activity annotation but
      the abstract does not name the acceptor used for the hSULT1A1 assays, so no more
      specific term can be drawn from it here.
- id: PMID:20056724
  title: Phase II metabolism of hesperetin by individual UDP-glucuronosyltransferases
    and sulfotransferases and rat and human tissue samples.
  findings:
  - statement: >-
      SULT1A1 (with SULT1A2) is the most efficient human sulfotransferase for the
      dietary flavanone hesperetin, forming preferentially the 3'-O-sulfate; hesperetin
      is conjugated at positions 7 and 3'.
    supporting_text: >-
      SULT1A2 and SULT1A1 catalyze preferably and most efficiently the formation of
      hesperetin 3'-O-sulfate, and SULT1C4 catalyzes preferably and most efficiently the
      formation of hesperetin 7-O-sulfate.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly identified, directly relevant, and sound. It supports all three
      annotations drawn from it at the level of flavonoid sulfation: the flavonoid
      metabolic process and xenobiotic metabolic process rows are accepted as-is. The
      problem with the GO:0047894 row is term selection by the curator, not the
      citation - GO:0047894 flavonol 3-sulfotransferase activity is defined by the
      quercetin to quercetin 3-sulfate reaction, whereas hesperetin is a flavanone
      lacking the C-ring 3-hydroxyl and the SULT1A1 product named in the abstract is
      the B-ring 3'-O-sulfate - so it is recorded as a MODIFY on that annotation rather
      than as a defect of this reference. Abstract-only: the article is not open access
      and has no PMC record, so the full methods could not be inspected.
- id: PMID:21723874
  title: Directed evolution of sulfotransferases and paraoxonases by ancestral libraries.
  findings:
  - statement: >-
      Cytosolic sulfotransferases were used as model enzymes for ancestral-library
      directed evolution, and an evolved SULT variant was characterized structurally
      and kinetically, showing how few active-site mutations reshape substrate
      specificity.
    supporting_text: >-
      Structural and kinetic characterizations of an evolved SULT variant show how few
      ancestral mutations reshaped the active site and modulated the enzyme's
      specificity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache, so the per-enzyme assay detail is not visible; UniProt
      cites it with ECO:0000269 for EC 2.8.2.1 and the curator will have read the full
      text. A protein-engineering study rather than a physiology study, so it supports
      the catalytic activity but says nothing about biological role.
- id: PMID:22069470
  title: The molecular basis for the broad substrate specificity of human sulfotransferase
    1A1.
  findings:
  - statement: >-
      Five crystal structures of SULT1A1 with PAP and different acceptors show a
      catalytically competent 2-naphthol complex (acceptor hydroxyl 2.34 A from
      His108), and demonstrate that active-site plasticity - notably a large movement
      of Phe247 - both enables broad specificity and opens a conserved second,
      non-productive acceptor site that causes substrate inhibition.
    supporting_text: >-
      We found that active site plasticity enables binding of different acceptors and
      identified dramatic structural changes in the SULT1A1 active site leading to the
      binding of a second acceptor molecule in a conserved yet non-productive manner.
    reference_section_type: ABSTRACT
  - statement: >-
      SULT1A1's substrate preference is for small phenolic compounds, in contrast to
      SULT1E1 whose preference is for estrogen acceptors.
    supporting_text: >-
      displays substrate preference for small phenolic compounds, while SULT1E1 shows a
      preference for estrogen acceptors
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in cache. The single most informative reference for the
      enzyme's molecular function; supplies the mechanistic account of broad
      specificity, PAP binding and substrate inhibition, and the explicit
      SULT1A1-versus-SULT1E1 substrate-preference contrast used to scope the steroid
      annotations.
- id: PMID:23207770
  title: 'Ethanol sulfation by the human cytosolic sulfotransferases: a systematic
    analysis.'
  findings:
  - statement: >-
      Four of the eleven human SULTs assayed - SULT1A1, SULT1A2, SULT1A3 and SULT1C4 -
      sulfate ethanol; ethyl sulfate is described by the authors as a minor direct
      ethanol metabolite of interest chiefly as a consumption biomarker, and the highest
      ethanol-sulfating activity among human tissues was in small intestine.
    supporting_text: >-
      A systematic analysis revealed four ethanol-sulfating SULTs, SULT1A1, SULT1A2,
      SULT1A3, and SULT1C4, among the eleven human SULT enzymes previously prepared and
      purified.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Correctly cited and scientifically sound, but the terms
      drawn from it overreach: ethanol is an aliphatic alcohol, so it does not
      demonstrate aryl sulfotransferase activity, and the authors' own framing of ethyl
      sulfate as a minor metabolite argues against an ethanol catabolic process
      annotation.
- id: PMID:20417180
  title: 'Crystal structures of SULT1A2 and SULT1A1 *3: insights into the substrate
    inhibition and the role of Tyr149 in SULT1A2.'
  findings:
  - statement: >-
      Crystal structures of SULT1A2 and the SULT1A1*3 allozyme bound to PAP reveal a
      plastic substrate-binding pocket with two channels and identify Phe247 as a
      switch-like substrate-selectivity residue, giving a structural basis for substrate
      inhibition. Tyr149Phe mutagenesis of SULT1A2 raised Km ~40-fold.
    supporting_text: >-
      The conformational differences between the two structures revealed a plastic
      substrate-binding pocket with two channels and a switch-like substrate selectivity
      residue Phe247, providing clearly a structural basis for the substrate inhibition.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. One of the three UniProt ECO:0000269 references for the
      homodimer, and the source of the Phe247 selectivity-switch result. Surfaced by the
      OpenScientist iodothyronine run; the quoted sentence was checked verbatim against
      the freshly fetched abstract rather than taken from the report on trust.
