      reference_section_type: ABSTRACT

# --------------------------------------------------- IDA: PMID:19548878 (KYNA inhibitor)
- term:
    id: GO:0008146
    label: sulfotransferase activity
  evidence_type: IDA
  original_reference_id: PMID:19548878
  qualifier: enables
  review:
    summary: >-
      Recombinant human SULT1A1 activity was measured directly in order to
      characterize its inhibition by kynurenic acid; kynurenic acid itself was shown
      not to be a substrate, so the assay is a bona fide measurement of SULT1A1
      sulfotransferase activity toward its own acceptors.
    action: ACCEPT
    reason: >-
      The paper's purpose is inhibitor characterization rather than substrate
      discovery, so the general term is appropriate here: the abstract does not
      identify which acceptor was used for the hSULT1A1 assays, and inventing a more
      specific term would go beyond the evidence.
    supported_by:
    - reference_id: PMID:19548878
      supporting_text: >-
