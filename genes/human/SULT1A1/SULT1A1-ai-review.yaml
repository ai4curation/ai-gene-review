# ------------------------------------------------------- IDA: PMID:20056724 flavonoid
- term:
    id: GO:0047894
    label: flavonol 3-sulfotransferase activity
  evidence_type: IDA
  original_reference_id: PMID:20056724
  qualifier: enables
  review:
    summary: >-
      The cited study is about hesperetin, and reports that SULT1A1 preferentially and
      most efficiently forms hesperetin 3'-O-sulfate. GO:0047894 is defined by a
      different reaction - quercetin to quercetin 3-sulfate - which the reported
      SULT1A1 product does not match.
    action: MODIFY
    reason: >-
      Two mismatches with the term definition. (i) Substrate class: hesperetin
      (4'-methoxy-3',5,7-trihydroxyflavanone) is a flavanone, not a flavonol; it lacks
      the 3-hydroxyl on the C-ring that defines flavonols and that the flavonol
      3-sulfotransferase reaction requires, so no assay on hesperetin can demonstrate
      flavonol 3-sulfotransferase activity. (ii) Position: the SULT1A1 product named in
      the abstract is the 3'-O-sulfate on the B-ring, not a 3-sulfate. GO:1990135
      flavonoid sulfotransferase activity states the generic flavonoid + PAPS reaction
      and is the term the evidence supports. Note this is a lateral move, not a
      generalization: GO:0047894 and GO:1990135 are siblings under GO:0008146, so the
      erroneous specific claim is not otherwise retained. Caveat: the cached record is
      abstract-only (the article is not open access and has no PMC record), so whether
      quercetin appears anywhere in the full methods could not be checked. The argument
      above does not depend on that - it rests on hesperetin's structure and on the
      product the abstract itself names - but a curator with the full text should
      confirm before the term is changed.
    proposed_replacement_terms:
    - id: GO:1990135
      label: flavonoid sulfotransferase activity
    supported_by:
    - reference_id: PMID:20056724
      supporting_text: >-
        SULT1A2 and SULT1A1 catalyze preferably and most efficiently the formation of
        hesperetin 3'-O-sulfate, and SULT1C4 catalyzes preferably and most efficiently
        the formation of hesperetin 7-O-sulfate.
      reference_section_type: ABSTRACT
    - reference_id: PMID:20056724
      supporting_text: "Results demonstrate that hesperetin is conjugated at positions 7 and 3'"
      reference_section_type: ABSTRACT

