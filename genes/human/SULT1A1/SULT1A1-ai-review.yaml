# --------------------------------------------------- TAS: PMID:8661000 (paralog paper)
- term:
    id: GO:0008146
    label: sulfotransferase activity
  evidence_type: TAS
  original_reference_id: PMID:8661000
  qualifier: enables
  review:
    summary: >-
      A legacy traceable-author-statement annotation. The term is unquestionably
      correct for SULT1A1 and is supported many times over by direct experimental
      evidence, so the row stands on its merits - but the reference it cites is a
      genomic-structure paper about the paralogous STP2 gene, which is SULT1A2
      (P50226), not SULT1A1 (whose historical aliases are STP and STP1).
    action: ACCEPT
    reason: >-
      Kept because sulfotransferase activity is the gene's defining function and is
      independently established by two IDA rows, five EXP rows, an IBA and four
      crystal structures. It is not, however, established by this reference: the
      project curator has read the full text and confirms the paper contains no
      enzymology of its own - the sulfotransferase statements in it are background
      about the thermostable PST form in general, and SULT1A1/STP1 appears only as a
      sequence comparison (96% identical protein). The recommended curation action is
      therefore to re-source the annotation to a paper that actually assays SULT1A1,
      or to retire it as redundant with the experimental rows, rather than to rely on
      this citation. See reference_review on PMID:8661000.
    supported_by:
    - reference_id: PMID:8661000
      supporting_text: >-
        The thermostable (TS) form of phenol sulfotransferase (PST) preferentially
        catalyzes the sulfonation of "simple" planar phenols
      reference_section_type: ABSTRACT
    - reference_id: PMID:8661000
      supporting_text: >-
        Two different human liver TS PST cDNAs have been cloned that encode proteins
        with amino acid sequences that are 96% identical.
      reference_section_type: ABSTRACT
- term:
    id: GO:0009308
    label: amine metabolic process
  evidence_type: TAS
  original_reference_id: PMID:8661000
  qualifier: involved_in
  review:
    summary: >-
      A very general biological process asserted from a reference that characterizes a
      different gene and contains no enzymology at all. The cited paper determines the
      exon structure, alternative 5' ends and chromosomal location of the STP2 gene
      (SULT1A2); the only statement in it that concerns amines is a generic
      family-level background clause, which is almost certainly where the term came
      from.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Three problems compound here. (i) Provenance: PMID:8661000 is a gene-structure
      study of STP2, which UniProt assigns to SULT1A2 (P50226, gene-name line
      "Name=SULT1A2; Synonyms=STP2"), whereas SULT1A1's synonyms are STP and STP1; it
      is reference 4 of the P50226 entry. SULT1A1/STP1 appears in the paper only as a
      sequence comparison - the protein it encodes is noted as 96% identical to STP2's
      - alongside STM/SULT1A3, STE/SULT1E1 and rat and guinea-pig genes used for
      splice-junction comparison; none of these is characterized here. (ii) No
      supporting experiment: the project curator has read the full text and confirms
      the paper reports no new enzymology of any kind - no recombinant enzyme assays,
      no substrate-specificity experiments, no Km/Vmax or catalytic-rate measurements,
      no thermostability assays, and no functional comparison of the STP1 and STP2
      proteins. The new results are entirely molecular genetics (genomic cloning and
      sequencing, a nine-exon structure, two alternative noncoding first exons IA and
      IB that are alternative 5' UTRs rather than additional genes, promoter analysis,
      and chromosome-16 localization), explicitly framed as enabling later study of
      how enzyme activity is regulated. (iii) Poor fit: SULT1A1 is the
      phenol-preferring form, and monoamine sulfation is the province of SULT1A3;
      SULT1A1's amine-containing substrates (dopamine, N-hydroxy-arylamines) are
      sulfonated on oxygen, not on nitrogen, so even the chemistry the term suggests is
      not what this enzyme does. The likely origin of the annotation is the opening
      background sentence quoted below, which lists neurotransmitters among the things
      sulfonation acts on - a statement about the SULT family in general, not about
      this gene or this paper's results. On this evidence REMOVE would also be
      defensible, since a TAS with no traceable statement supporting it for this gene
      is not a valid TAS; MARK_AS_OVER_ANNOTATED is used because the term is not
      biologically false of SULT1A1, which does act on amine-bearing molecules. Either
      way it should be retired or replaced with a substrate-specific term.
    supported_by:
    - reference_id: PMID:8661000
      supporting_text: >-
        We have determined the structure and chromosomal localization of the gene for
        one of these two cDNAs, STP2, as a step toward understanding molecular genetic
        mechanisms involved in the regulation of this enzyme activity in humans.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8661000
      supporting_text: >-
        Sulfonation is an important pathway in the biotransformation of many drugs,
        xenobiotics, neurotransmitters, and steroid hormones.
      reference_section_type: ABSTRACT

