- id: PMID:32152050
  title: 'Interaction of the Brain-Selective Sulfotransferase SULT4A1 with Other Cytosolic
    Sulfotransferases: Effects on Protein Expression and Function.'
  findings:
  - statement: >-
      SULT4A1 co-immunoprecipitates with SULT1A1 and SULT1A3 in human cells, and the
      interaction requires the conserved C-terminal dimerization motif of the
      sulfotransferases; SULT4A1 lowers SULT1A1/1A3 protein levels in neuronal cells,
      suggesting a chaperone-like regulatory role.
    supporting_text: >-
      Mutation of the conserved dimerization motif located in the C terminus of the
      sulfotransferases prevented this interaction.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache, but the abstract is explicit about the mechanism. Unlike
      the four large-scale interactome references, this one identifies the interaction
      surface and therefore supports a specific molecular function term
      (heterodimerization) rather than bare protein binding.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cell-line-resolved affinity-purification interactome; redetects the same
      SULT1A1-SULT2B1 pair. Uninformative for molecular function.
- id: PMID:35165440
  title: A gut-derived metabolite alters brain activity and anxiety behaviour in mice.
  findings:
  - statement: >-
      4-ethylphenol produced by gut bacteria from dietary tyrosine is sulfated to 4-EPS
      by SULT1A1 and other sulfotransferases in vitro; 4-EPS enters the brain, impairs
      oligodendrocyte maturation and myelination, and produces anxiety-like behaviour
      in mice. The tissue site of 4-EP sulfation in vivo is explicitly unresolved.
    supporting_text: >-
      We observed sulfation of 4EP to 4EPS by the sulfotransferase SULT1A1 and others
      during in vitro biochemical reactions
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available. UniProt cites it with ECO:0000269 for 4-ethylphenol sulfation
      (RHEA:70607) but GOA has no corresponding annotation, so this is an annotation gap
      rather than a citation problem. Note the paper is a mouse study and the SULT1A1
      attribution rests on in vitro biochemistry; the authors state the in vivo site of
      sulfation is unknown.
- id: PMID:7834621
  title: Metabolic activation of N-hydroxy arylamines and N-hydroxy heterocyclic amines
    by human sulfotransferase(s).
  findings:
  - statement: >-
      PAPS-dependent DNA binding of N-hydroxy-arylamine and N-hydroxy-heterocyclic-amine
      metabolites in human liver cytosol correlates with thermostable phenol
      sulfotransferase (SULT1A1) activity, and not with thermolabile PST or DHEA
      sulfotransferase; the correlation is confirmed by DCNP inhibition and
      thermostability profiling. Activity was detected in liver and colon cytosol but
      not in pancreas, larynx or bladder epithelium.
    supporting_text: >-
      In the 12 human hepatic cytosols studied, the extent of
      3'-phosphoadenosine-5'-phosphosulfate-dependent DNA binding of the N-hydroxy
      derivatives were all significantly correlated with levels of thermostable phenol
      ST (TS-PST) activity but not with thermolabile phenol ST or dehydroepiandrosterone
      ST activities.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Establishes the procarcinogen-bioactivation role that
      makes SULT1A1 toxicologically important; uses the pre-SULT nomenclature (TS-PST),
      which is unambiguously SULT1A1.
- id: PMID:9855620
  title: A single amino acid, glu146, governs the substrate specificity of a human
    dopamine sulfotransferase, SULT1A3.
  findings:
  - statement: >-
      SULT1A3's selectivity for dopamine and other biogenic amines is conferred by a
      single acceptor-pocket residue, Glu146. The E146A substitution alone transforms
      SULT1A3's catalytic properties and substrate preference so that they resemble
      SULT1A1's. SULT1A1 carries Ala at the corresponding position.
    supporting_text: >-
      The change of a single amino acid, E146A, was sufficient to transform the
      catalytic properties and substrate preference of SULT1A3, such that they closely
      resembled those of SULT1A1.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Gives the structural basis for the SULT1A1/SULT1A3 division
      of labour and is the strongest single argument that catecholamine disposal belongs
      to SULT1A3 - the residue that makes an enzyme a dopamine sulfotransferase is
      exactly the one SULT1A1 lacks. Surfaced independently by two OpenScientist runs;
      the quoted sentence was checked verbatim against the freshly fetched abstract
      rather than taken from the reports on trust. Note the switch was characterized for
      dopamine-versus-phenol selectivity, not for iodothyronine affinity.
- id: PMID:8093002
  title: 'Functional characterization of two human sulphotransferase cDNAs that encode
    monoamine- and phenol-sulphating forms of phenol sulphotransferase: substrate
    kinetics, thermal-stability and inhibitor-sensitivity studies.'
  findings:
  - statement: >-
      HAST1 (SULT1A1) expressed in COS-7 cells sulfates 4-nitrophenol with Km 0.6 uM,
      whereas HAST3 (SULT1A3) prefers dopamine with Km 9.7 uM; each enzyme sulfates the
      other's preferred substrate with a Km at least two orders of magnitude worse.
      DCNP inhibition and thermostability profiles match liver cytosolic P-PST and
      M-PST respectively.
    supporting_text: >-
      HAST1 could also sulphate dopamine, as could HAST3 sulphate p-nitrophenol, but the
      Km for these reactions were at least two orders of magnitude greater than for the
      preferred substrates.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache (PMC full text is publisher-restricted). The defining
      kinetic characterization of SULT1A1 and the source of both the cytoplasm EXP and
      the dopamine catabolic process IDA. The paper's own framing - phenol-sulfating
      versus monoamine-sulfating forms, with cross-reactions two orders of magnitude
      weaker - is the direct basis for treating the dopamine annotation as an
      over-annotation.
- id: PMID:8661000
  title: 'Human phenol sulfotransferase STP2 gene: molecular cloning, structural characterization,
    and chromosomal localization.'
  findings:
  - statement: >-
      Determines the exon-intron structure, alternative noncoding first exons (IA and
      IB, which are alternative 5' UTRs rather than additional genes), promoter regions
      and chromosome 16 localization of the STP2 gene. STP2 is SULT1A2, not SULT1A1.
      STP2/SULT1A2 is the only gene newly characterized experimentally; STP1/SULT1A1,
      STM/SULT1A3, STE/SULT1E1 and rat phenol- and guinea-pig estrogen-sulfotransferase
      genes appear only as sequence or splice-junction comparisons.
    supporting_text: >-
      We have determined the structure and chromosomal localization of the gene for one
      of these two cDNAs, STP2, as a step toward understanding molecular genetic
      mechanisms involved in the regulation of this enzyme activity in humans.
    reference_section_type: ABSTRACT
  - statement: >-
      The paper reports no new enzymology: no recombinant enzyme assays, no
      substrate-specificity experiments, no Km/Vmax or catalytic-rate measurements, no
      thermostability assays, and no functional comparison of the STP1 and STP2
      proteins. Its enzymological content is background - that thermostable PST
      sulfonates relatively simple planar phenols and that its activity varies
      heritably between individuals - and the structural work is explicitly framed as
      enabling later investigation of how that activity is regulated.
    supporting_text: >-
      The thermostable (TS) form of phenol sulfotransferase (PST) preferentially
      catalyzes the sulfonation of "simple" planar phenols, and levels of activity of
      TS PST in human tissues are controlled by inheritance.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The PMID resolves to the intended paper, but the paper characterizes the
      paralogous gene and contains no enzymology, so it supports neither annotation
      drawn from it for SULT1A1. Two independent lines confirm this. (1) Gene identity,
      checkable against UniProt without the full text: this is reference 4 of P50226
      (SULT1A2), whose gene-name line reads "Name=SULT1A2; Synonyms=STP2", while P50225
      (SULT1A1) lists "Synonyms=STP, STP1". (2) Content, from the project curator's
      reading of the full text: STP2/SULT1A2 is the only gene newly characterized
      experimentally, with STP1/SULT1A1 (96% identical protein), STM/SULT1A3,
      STE/SULT1E1 and rat and guinea-pig genes appearing only as comparisons; and there
      is no new enzymology anywhere in the paper - no recombinant assays, substrate
      specificity, kinetics, thermostability, or STP1-versus-STP2 functional
      comparison. The amine metabolic process term therefore has no traceable statement
      behind it beyond a generic family-level background clause about sulfonation
      acting on neurotransmitters. The sulfotransferase activity term happens to be
      true of SULT1A1 on abundant independent evidence and is retained on that basis,
      but should be re-sourced. Note on full_text_unavailable: that flag describes the
      cached record, which is abstract-only (not open access, no PMC record) and is
      what the quote validator reasons about; it does not mean the full text was never
      consulted.
- id: Reactome:R-HSA-158468
  title: SULT1A1 dimer sulfonates PARA to PARA-SO4
  findings:
  - statement: >-
      SULT1A1 in dimeric form sulfonates paracetamol (acetaminophen); around 20-30% of a
      paracetamol dose is metabolized by hepatic sulfonation.
    supporting_text: >-
      Cytosolic sulfotransferase 1A1 (SULT1A1), in dimeric form, can sulfonate the
      widely used analgesic and antipyretic drug paracetamol (PARA aka acetaminophen).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction placing a major SULT1A1 drug-conjugation step in the cytosol and
      modelling the enzyme as a dimer.
- id: Reactome:R-HSA-158849
  title: Phenol can form a sulfate conjugate
  findings:
