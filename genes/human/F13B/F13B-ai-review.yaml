id: P05160
gene_symbol: F13B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F13B encodes the secreted, noncatalytic B subunit of plasma factor XIII. Its repeated Sushi domains support association with the catalytic A subunits in the circulating A2B2 proenzyme complex. B-subunit assembly and stabilization help maintain the plasma A-subunit pool that is available for fibrin-clot stabilization. During activation, thrombin cleaves the A-subunit activation peptides and calcium promotes B-subunit dissociation; activated A subunits perform the subsequent transglutaminase reaction. F13B variants can impair secretion or association with A, reducing functional plasma factor XIII and causing a bleeding disorder.
