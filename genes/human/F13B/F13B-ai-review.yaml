suggested_questions:
- question: How much of F13B-dependent maintenance of circulating A arises from complex assembly, protection against loss or clearance, and control of release during activation, when B secretion and assembled A2B2 abundance are held constant?
- question: How should the B-containing A2B2 proenzyme assembly be represented relative to the activated A-plus-calcium complex in the ontology, given that B is released before A performs transglutaminase chemistry?
suggested_experiments:
- description: Compare sequence-verified human B preparations at matched secreted-protein concentrations, measuring binding to recombinant A2 and assembly by both antigen-based and orthogonal physical methods. Follow A abundance and integrity over time in B-depleted plasma with controlled B add-back, then measure B release and A-dependent cross-linking during defined thrombin and calcium activation. Include B-free, A-free and inactive-A controls; distinguish protection from protein loss from changes in intrinsic A catalytic activity and from antibody-detection effects. Test delivery to a proposed acceptor only as a separate, directly measured step.
