core_functions:
- description: 'F13B associates with factor XIII A subunits to assemble and maintain the circulating proenzyme pool supporting fibrin-clot formation. Human secreted B reconstitutes A2B2 with added recombinant A2, while deficiency and rescue evidence support a role in maintaining plasma A levels. This is a noncatalytic carrier/assembly contribution: the B-containing precursor complex releases B during activation, and A performs protein cross-linking. Complex membership does not assign transglutaminase activity to B.'
