core_functions:
- description: As a core-subcomplex subunit of IFT-A, IFT122 contributes to the cargo-carrier activity
    of the complex, docking the TULP3 adaptor and importing ciliary membrane proteins (GPCRs) into the
    primary cilium.
  contributes_to_molecular_function:
