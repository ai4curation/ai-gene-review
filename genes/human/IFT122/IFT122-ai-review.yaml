- term:
    id: GO:0035720
    label: intraciliary anterograde transport
  evidence_type: IDA
  original_reference_id: PMID:20889716
  qualifier: involved_in
  review:
    summary: Intraciliary anterograde transport.
    action: ACCEPT
    reason: IFT-A rides anterograde trains and, with TULP3, directs ciliary entry of membrane cargo (GPCRs);
      IFT-A loss (IFT144/IFT122 core) blocks ciliary entry of GPCRs. The 40472089 full text discusses
      TULP3-dependent GPR45 entry and cites IFT-A as the TULP3 partner; deferring to the curator, the
      term is biologically correct for IFT122.
    supported_by:
    - reference_id: PMID:20889716
      supporting_text: IFT-A is linked to retrograde ciliary transport, but, surprisingly, we find that
        the IFT-A complex has a second role directing ciliary entry of TULP3.
    - reference_id: PMID:27932497
      supporting_text: the IFT-A complex mediates not only retrograde trafficking but also entry into
        cilia of GPCRs
    - reference_id: PMID:36775821
      supporting_text: Intraflagellar transport (IFT) complexes, IFT-A and IFT-B, form bidirectional trains
        that move along the axonemal microtubules and are essential for assembling and maintaining cilia.
