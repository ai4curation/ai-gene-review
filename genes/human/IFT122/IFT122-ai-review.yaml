id: Q9HBG6
gene_symbol: IFT122
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IFT122 (intraflagellar transport protein 122 homolog) is a WD40-repeat and TPR-containing
  subunit of the six-protein intraflagellar transport complex A (IFT-A; IFT144/WDR19, IFT140, IFT122,
  IFT121/WDR35, IFT139/TTC21B and IFT43). Within IFT-A it belongs to the core subcomplex (IFT122-IFT140-IFT144)
  and bridges the core to the peripheral subcomplex through the IFT43-IFT121 dimer, making it a structural
  linchpin of the complex. IFT-A is carried on anterograde IFT trains to the ciliary tip and mediates
  retrograde transport driven by cytoplasmic dynein-2; with the tubby-family adaptor TULP3, which docks
  on the core subcomplex, it also imports ciliary membrane proteins such as GPCRs (e.g. GPR161) into the
  cilium. IFT122 localizes to the cilium, the ciliary base (basal body and transition zone) and photoreceptor
  connecting cilium. Unlike most other IFT-A subunits, loss of IFT122 abolishes ciliogenesis in human
  RPE1 cells. Through these ciliary roles IFT-A restrains Hedgehog signalling and is required for embryonic
  patterning. Biallelic IFT122 variants cause cranioectodermal dysplasia (Sensenbrenner syndrome, CED1)
  and related short-rib thoracic dysplasias.
