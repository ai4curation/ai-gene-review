    label: intraciliary transport particle A
  supported_by:
  - reference_id: PMID:36775821
    supporting_text: TULP3, the cargo adapter, interacts with IFT-A through its N-terminal region, and
      interface mutations disrupt cargo transport.
  - reference_id: PMID:20889716
    supporting_text: IFT-A is linked to retrograde ciliary transport, but, surprisingly, we find that
      the IFT-A complex has a second role directing ciliary entry of TULP3.
  - reference_id: PMID:27932497
    supporting_text: the IFT-A complex mediates not only retrograde trafficking but also entry into cilia
      of GPCRs
  - reference_id: file:human/IFT122/IFT122-deep-research-falcon.md
    supporting_text: It joins IFT-A subassemblies, helps incorporate IFT-A into intraflagellar transport
      trains and provides part of the binding surface for the membrane-cargo adaptor TULP3.
- description: IFT122 is part of the IFT-A complex that mediates retrograde intraflagellar transport,
    returning IFT trains and cargo from the ciliary tip; it structurally links the IFT-A core and peripheral
    subcomplexes.
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  locations:
  - id: GO:0097730
    label: non-motile cilium
  in_complex:
    id: GO:0030991
    label: intraciliary transport particle A
  supported_by:
  - reference_id: PMID:27932497
    supporting_text: Intraflagellar transport (IFT)-A and -B complexes mediate retrograde and anterograde
      ciliary protein trafficking, respectively.
  - reference_id: PMID:29220510
    supporting_text: As the IFT122 subunit connects the core and peripheral subcomplexes of the IFT-A
      complex, it is expected to play a pivotal role in the complex.
  - reference_id: file:human/IFT122/IFT122-uniprot.txt
    supporting_text: As a component of the IFT complex A (IFT-A), a complex required for retrograde ciliary
      transport and entry into cilia of G protein-coupled receptors (GPCRs), it is required in ciliogenesis
      and ciliary protein trafficking
- description: IFT122 is required for primary cilium assembly; its loss abolishes ciliogenesis, consistent
    with IFT trains building and maintaining the axoneme.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  in_complex:
    id: GO:0030991
    label: intraciliary transport particle A
  supported_by:
  - reference_id: PMID:29220510
    supporting_text: knockout (KO) of the IFT122 gene in hTERT-RPE1 cells using the CRISPR/Cas9 system
      led to a severe ciliogenesis defect, whereas KO of other IFT-A genes had minor effects on ciliogenesis
      but impaired ciliary protein trafficking
  - reference_id: PMID:36775821
    supporting_text: Intraflagellar transport (IFT) complexes, IFT-A and IFT-B, form bidirectional trains
      that move along the axonemal microtubules and are essential for assembling and maintaining cilia.
proposed_new_terms: []
suggested_questions:
- question: Why does IFT122 loss abolish ciliogenesis in RPE1 cells whereas loss of other IFT-A subunits
    (IFT144, IFT139) mainly impairs ciliary protein trafficking? Does IFT122 have an IFT-A-independent
    role, or does it stabilise IFT-B train assembly?
  experts:
  - Nakayama K
  - Mukhopadhyay S
- question: Should IFT-A subunits carry intraciliary anterograde transport, given that IFT-A rides anterograde
    trains and mediates membrane-protein entry but is dispensable for anterograde IFT-B movement?
suggested_experiments:
- hypothesis: CED-associated IFT122 missense variants selectively disrupt core-peripheral IFT-A coupling
    without affecting train assembly.
  description: Reconstitute wild-type and CED-variant IFT-A for cryo-EM and test variant rescue of IFT122-KO
    RPE1 cells using live imaging of IFT train velocities and ciliary GPCR import.
  experiment_type: structural biology and live-cell imaging
