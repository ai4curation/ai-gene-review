core_functions:
- description: >-
    ATP-driven export of heme and other porphyrins across the plasma membrane.
    ABCB6 assembles as a homodimer whose nucleotide-binding domains hydrolyse ATP
    (Walker A K629) to translocate hemin, coproporphyrin III, protoporphyrin IX and
    related tetrapyrroles out of the cytoplasm. In red cells this pool carries the
    Langereis blood group antigen and limits the cytotoxic porphyrin load, which is
    why hypomorphic ABCB6 alleles aggravate hereditary porphyrias. Glutathione acts
    as a cofactor for metal-centred porphyrins.
  molecular_function:
    id: GO:0015439
    label: ABC-type heme transporter activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0035351
    label: heme transmembrane transport
  substrates:
  - id: CHEBI:60344
    label: heme b
  - id: CHEBI:131725
    label: coproporphyrin III
  supported_by:
  - reference_id: PMID:23792964
    supporting_text: Mutagenesis of the conserved lysine to alanine (K629A) in the Walker A motif 
      abolished ATP hydrolysis and substrate transport
  - reference_id: PMID:27507172
    supporting_text: We also demonstrate that ABCB6 mediates the plasma membrane export of 
      porphyrins in red cells
  - reference_id: PMID:35950458
    supporting_text: Here we report the cryo-electron microscopy (cryo-EM) structures of human ABCB6
      with its substrates, coproporphyrin III (CPIII) and hemin
- description: >-
    ATP-dependent sequestration of toxic heavy-metal species into the lumen of
    lysosomes and late endosomes. The N-terminal TMD0 targets ABCB6 to this
    compartment, where the transporter is oriented with its nucleotide-binding
    domains in the cytosol and pumps metal complexes inwards. Human ABCB6
    substitutes for HMT-1 proteins in fission yeast and nematode mutants, restoring
    vacuolar cadmium content and cadmium tolerance, and its level sets cadmium
    sensitivity in human cells. This is the activity shared with the invertebrate
    HMT-1 proteins of the same PANTHER subfamily, and the vacuolar/lysosomal
    membrane is the compartment PAINT assigns to the whole opisthokont clade.
  molecular_function:
    id: GO:0140359
    label: ABC-type transporter activity
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0036020
    label: endolysosome membrane
  directly_involved_in:
  - id: GO:0098849
    label: cellular detoxification of cadmium ion
  supported_by:
  - reference_id: PMID:31053883
    supporting_text: Inactivating mutations of ABCB6 abolished vacuolar sequestration of cadmium, 
      effectively suppressing the cadmium tolerance phenotype
  - reference_id: PMID:31053883
    supporting_text: the cadmium-sensitive phenotype of Schizosaccharomyces pombe and Caenorhabditis
      elegans strains defective for HMT-1 is rescued by the human ABCB6 protein
  - reference_id: PMID:25627919
    supporting_text: we confirm the endo-lysosomal localization of ABCB6 and show that the protein 
      is internalized from the plasma membrane through endocytosis, to be distributed to 
      multivesicular bodies and lysosomes
  knowledge_gaps:
  - gap_statement: >-
      The chemical species ABCB6 translocates during metal detoxification is unknown.
      Human cells have no phytochelatins, and Drosophila HMT-1 confers cadmium
      tolerance without transporting cadmium-phytochelatin complexes, so the
      glutathione or other conjugate that ABCB6 actually carries into the lysosome
      has still to be identified.
    gap_kind:
    - BIOLOGY
- description: >-
    Transport across the limiting membrane of early melanosomes, required for
    formation of the PMEL amyloid matrix on which melanin is deposited. Depletion
    of ABCB6 in melanocytic cells blocks PMEL fibril formation and produces aberrant
    multilamellar aggregates in pigmented melanosomes; rescue requires a
    catalytically active transporter, since neither the Walker A K629M mutant nor the
    dyschromatosis universalis hereditaria allele G579E restores the matrix. Abcb6
    knockout mouse retinal pigment epithelium contains fewer melanosomes.
  molecular_function:
    id: GO:0140359
    label: ABC-type transporter activity
  locations:
  - id: GO:0033162
    label: melanosome membrane
  directly_involved_in:
  - id: GO:1903232
    label: melanosome assembly
  supported_by:
  - reference_id: PMID:29940187
    supporting_text: PMEL fibril formation and normal maturation of pigmented melanosomes could be 
      restored by the overexpression of wild-type ABCB6 but not by variants containing an 
      inactivating catalytic mutation (K629M) or the G579E DUH mutation
  - reference_id: PMID:29940187
    supporting_text: We show that ABCB6 localizes to the membrane of early melanosomes and lysosomes
      of the human melanocytic cell line MNT-1
  knowledge_gaps:
  - gap_statement: >-
      What ABCB6 transports in the early melanosome, and how that cargo enables PMEL
      to form its amyloid matrix, is unknown. The requirement for an intact Walker A
      motif shows a transported species is involved, but neither its identity nor the
      direction of transport across the melanosomal membrane has been established.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: ABC-type porphyrin transporter activity
  proposed_definition: >-
    Catalysis of the reaction: ATP + H2O + porphyrin(in) = ADP + phosphate +
    porphyrin(out), covering metal-free porphyrins such as coproporphyrin III,
    protoporphyrin IX and the uroporphyrins as well as metallated ones.
  justification: >-
    GO's only ABC-type tetrapyrrole transport term is GO:0015439 ABC-type heme
    transporter activity, which covers metallated heme only. The demonstrated and
    curated substrate range of ABCB6 includes coproporphyrin III, coproporphyrin I,
    protoporphyrin IX, uroporphyrin I, uroporphyrin III, coproporphyrinogen III and
    pheophorbide a, none of which is heme; UniProt records a separate Rhea reaction
    for each. Reviewers are currently forced either to use the heme term for
    metal-free porphyrin transport or to fall back on the uninformative parent
    GO:0140359. A sibling of GO:0015439 at the porphyrin level would let both be
    stated accurately.
  proposed_parent:
    id: GO:0140359
    label: ABC-type transporter activity
  supported_by:
  - reference_id: PMID:35950458
    supporting_text: Here we report the cryo-electron microscopy (cryo-EM) structures of human ABCB6
      with its substrates, coproporphyrin III (CPIII) and hemin
  - reference_id: PMID:23792964
    supporting_text: transport kinetics of its proposed endogenous substrate coproporphyrinogen III
suggested_questions:
- question: >-
    Does human ABCB6 occupy the mitochondrial outer membrane at all? Overexpression
    and fractionation studies report a mitochondrial pool while imaging of the
    endogenous protein does not, and the question determines whether the porphyrin
    import model for heme synthesis can be retained.
- question: >-
    Which chemical species does ABCB6 carry during heavy-metal detoxification in
    human cells, given the absence of phytochelatins and the finding that Drosophila
    HMT-1 does not transport cadmium-phytochelatin complexes?
- question: >-
    What is the direction of transport at the lysosomal and melanosomal membrane?
    The nucleotide-binding domains face the cytosol, predicting import into the
    lumen, while at the plasma membrane the same protein exports porphyrins.
- question: >-
    Why do missense alleles of ABCB6 cause dyschromatosis universalis hereditaria,
    ocular coloboma and pseudohyperkalemia while complete loss of the protein in
    Lan-negative individuals is clinically silent? Are the disease alleles acting
    by a dominant-negative or gain-of-function mechanism?
suggested_experiments:
- hypothesis: >-
    The ABCB6-dependent step in melanosome maturation is the transport of a
    glutathione-conjugated or porphyrin-like species into the early melanosome lumen.
  description: >-
    Reconstitute purified ABCB6 into proteoliposomes and screen candidate melanosomal
    metabolites, including glutathione conjugates and melanin precursors, for
    substrate-stimulated ATPase and for transport; test the hits in ABCB6-depleted
    MNT-1 cells for rescue of PMEL fibril formation.
  experiment_type: in vitro transport assay
- hypothesis: >-
    The contested mitochondrial pool of ABCB6 is an artefact of overexpression and
    of endolysosome-mitochondrion co-fractionation.
  description: >-
    Apply split-fluorophore or proximity-labelling reporters to endogenously tagged
    ABCB6 in cells that also carry validated outer mitochondrial membrane and
    lysosomal baits, and quantify the two pools at native expression levels; combine
    with immuno-electron microscopy on untransfected cells.
  experiment_type: subcellular localization
- hypothesis: >-
    ABCB6 transports a cadmium-glutathione complex into the lysosomal lumen.
  description: >-
    Measure ATP-dependent uptake of cadmium with and without glutathione into
    ABCB6 proteoliposomes by inductively coupled plasma mass spectrometry, with the
    K629A Walker A mutant as the negative control, and compare with Schizosaccharomyces
    pombe HMT-1 run in parallel.
  experiment_type: in vitro transport assay
