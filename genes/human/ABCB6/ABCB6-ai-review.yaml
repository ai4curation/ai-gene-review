id: Q9NP58
gene_symbol: ABCB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABCB6 is a homodimeric half-type ATP-binding cassette transporter of the ABCB
  subfamily that couples ATP binding and hydrolysis to the translocation of
  porphyrins across membranes. Each subunit carries an accessory N-terminal
  transmembrane domain (TMD0, residues 1-205) that is dispensable for catalysis
  but directs the protein to the endolysosomal system, followed by the canonical
  ABC transmembrane domain and nucleotide-binding domain (Walker A lysine K629).
  The protein is N-glycosylated, is inserted co-translationally into the
  endoplasmic reticulum, matures through the Golgi, reaches the plasma membrane
  and is then internalised to multivesicular bodies, lysosomes and melanosomes;
  in erythroid cells it remains in the plasma membrane of mature red cells, where
  it carries the Langereis (Lan) blood group antigen, and is partly shed in
  exosomes. Purified, liposome-reconstituted ABCB6 transports hemin,
  coproporphyrin III, protoporphyrin IX and pheophorbide a, and its ATPase is
  stimulated by porphyrins, with glutathione acting as a cofactor for
  metal-centred porphyrins; cryo-EM structures show hemin and coproporphyrin III
  bound in a slit-like central cavity. Physiologically, plasma membrane ABCB6
  exports porphyrins from red cells and modifies the severity of hereditary
  porphyrias, while the endolysosomal pool sequesters heavy-metal species and is
  required for PMEL amyloid matrix formation in early melanosomes. Human ABCB6
  loss of function is well tolerated: Lan(-) individuals are healthy, and
  missense alleles instead cause dyschromatosis universalis hereditaria, ocular
  coloboma and familial pseudohyperkalemia. Whether ABCB6 also resides in the
  mitochondrial outer membrane and imports porphyrin precursors for heme
  synthesis remains contested.
