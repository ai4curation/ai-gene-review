    summary: Phylogenetic (PAINT) inference that ZIP2 enables zinc ion transmembrane transporter activity, the core molecular function of the SLC39/ZIP family.
    action: ACCEPT
    reason: Core molecular function. The IBD was placed at the ZIP ancestral node (PANTHER:PTN000113377) from experimentally characterized descendants including hZIP2 itself; ZIP2 sits squarely within the clade that inherited zinc import. Direct human assays confirm the activity (PMID:10681536, PMID:29791142, PMID:30914478). Q9NP94 appearing in WITH/FROM is expected, marking experimental grounding on the target.
