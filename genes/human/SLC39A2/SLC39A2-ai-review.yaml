    reason: 'UniProt records ''In the skin, aids in the differentiation of keratinocytes in the epidermis (By similarity)''. This is a genuine tissue-level physiological role, but ZIP2 does not execute differentiation steps: it imports Zn2+, and keratinocyte differentiation depends on cytosolic zinc availability. Per the participation test it is a supporting, non-core process (the zinc-import step is the direct function), so keep but mark non-core rather than ACCEPT as core.'
    supported_by:
