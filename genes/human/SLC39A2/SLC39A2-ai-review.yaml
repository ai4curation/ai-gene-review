  review:
    summary: Generic 'zinc ion transport' from Gaither & Eide 2000; the paper demonstrates zinc uptake across the membrane, i.e. zinc transmembrane transport/import.
    action: MODIFY
    reason: 'The term is correct but less specific than the evidence supports: PMID:10681536 demonstrated saturable zinc UPTAKE across the plasma membrane by hZIP2. The direct refinement, zinc ion transmembrane transport (GO:0071577), is already asserted for this gene; the fully specific core process is zinc ion import across plasma membrane (GO:0071578). Refine to the transmembrane-transport descendant.'
    proposed_replacement_terms:
    - id: GO:0071577
      label: zinc ion transmembrane transport
