id: Q9NP94
gene_symbol: SLC39A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC39A2 (ZIP2) is a plasma-membrane zinc influx transporter of the SLC39/ZIP (ZRT/IRT-like protein) family. It is a multi-pass (8-transmembrane) integral membrane protein that imports Zn2+ from the extracellular space into the cytosol. Transport is a facilitated (uniporter-type) process that is independent of the H+ driving force and of HCO3-, but is modulated by extracellular pH (enhanced at acidic pH) and by membrane potential (voltage-dependent). ZIP2 is polyspecific for divalent cations, with a substrate preference Zn2+ > Cd2+ >= Cu2+ > Co2+ and no transport of Fe2+ or Mn2+; cadmium is a toxicologically important secondary substrate. Conserved intramembrane histidine, glutamate and lysine residues (His175, Glu179, His202, Lys203, Glu276, with His63 as a pH sensor) form the metal-binding/translocation pathway. In humans ZIP2 is expressed mainly in prostate and uterine (and skin/esophageal) epithelium, where its zinc-import activity supplies cytosolic zinc; the mouse ortholog
  has been linked to epidermal keratinocyte differentiation. As a cell-surface importer it contributes to cellular zinc acquisition and homeostasis.
