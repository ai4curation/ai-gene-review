suggested_questions:
- question: What is the physiological significance of ZIP2-mediated cadmium import in prostate and uterine epithelium, given its role as a cadmium-uptake route?
- question: Is the epidermal keratinocyte-differentiation phenotype of Slc39a2 loss due solely to reduced cytosolic zinc supply, or does ZIP2 have a more direct role in keratinocyte zinc signaling?
suggested_experiments:
- description: Cryo-EM or X-ray structure of human ZIP2 with bound Zn2+/Cd2+ to confirm the His175/Glu179/His202/Lys203/Glu276 metal-translocation site and the His63 pH-sensor mechanism.
- description: Tissue-specific Slc39a2 knockout (prostate, uterine, epidermal epithelium) with zinc/cadmium flux and transcriptomic readouts to define the physiological substrate(s) and the keratinocyte-differentiation link.
