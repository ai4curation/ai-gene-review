id: Q9NYK1
gene_symbol: TLR7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TLR7 (Toll-like receptor 7) is an endolysosomal pattern recognition receptor of the innate
  immune system that detects RNA degradation products, chiefly those of viral single-stranded RNA genomes.
  It is a single-pass type I membrane glycoprotein: a large leucine-rich-repeat ectodomain faces the lumen
  of the compartment, a single transmembrane helix crosses the membrane, and a cytoplasmic TIR domain
  carries the signal. Unlike a simple ssRNA sensor, TLR7 is a dual receptor with two spatially distinct
  ligand-binding sites on its horseshoe-shaped ectodomain. The first site, at the dimerisation interface
  and conserved with TLR8, binds a guanosine moiety - guanosine itself, deoxyguanosine, synthetic guanosine
  analogues and imidazoquinolines such as imiquimod and R-848, and physiologically the guanosine 2'',3''-cyclic
  monophosphate released from RNA. The second site, on the concave surface and unique to TLR7, binds short
  uridine-containing single-stranded RNA fragments, which raise the affinity of the first site. Both ligands
  are made in situ by sequential RNA catabolism: the lysosomal endonuclease RNase T2 cuts RNA between
  purine and uridine residues, and the exonucleases PLD3 and PLD4 release the terminal 2'',3''-cyclic
  GMP and generate the pyrimidine-rich fragments. Occupancy of both sites locks TLR7 into an activated
  m-shaped homodimer that brings the two TIR domains together, recruiting MyD88 and assembling the myddosome
  with IRAK4, IRAK1/IRAK2 and TRAF6; this activates canonical NF-kappaB and MAP kinases, driving IL-6,
  IL-8, TNF and chemokine production, and activates IRF7, driving type I interferon. Newly made TLR7 folds
  in the endoplasmic reticulum membrane and is delivered to endosomes and lysosomes by the chaperone UNC93B1,
  which engages its transmembrane and juxtamembrane regions; signalling requires endosomal acidification,
  and this intracellular confinement is what restrains responses to self RNA. TLR7 is expressed most strongly
  in plasmacytoid dendritic cells and B cells, and also in monocytes and various epithelial and pigment
  cells. Loss-of-function variants cause an X-linked immunodeficiency presenting as severe COVID-19 with
  impaired interferon responses, while gain-of-function variants that increase guanosine sensing cause
  X-linked systemic lupus erythematosus, driving survival of B-cell-receptor-activated B cells and accumulation
  of CD11c-positive age-associated B cells in a MyD88-dependent manner.'
