- term:
    id: GO:0070305
    label: response to cGMP
  evidence_type: IMP
  original_reference_id: PMID:35477763
  qualifier: involved_in
  review:
    action: MODIFY
    summary: IMP annotated as response to cGMP, from the finding that the TLR7 Y264H variant 
      selectively increases sensing of guanosine and 2',3'-cGMP.
    reason: The chemistry does not match the term. GO:0070305 is defined as a response to cGMP, 
      guanosine 3',5'-cyclophosphate - the second messenger made by guanylate cyclases. The TLR7 
      ligand is the positional isomer guanosine 2',3'-cyclic monophosphate, released from RNA by 
      RNase T2 and the PLD3/PLD4 exonucleases and bound in the receptor's first pocket; the cited 
      paper says 'guanosine and 2',3'-cGMP', not 3',5'-cGMP. What the evidence establishes is direct
      recognition of a guanosine moiety at site 1, which is exactly GO:1905108 guanosine binding - 
      independently supported by the crystal structures and by deoxyguanosine acting as an 
      RNA-independent agonist. GO has no term for 2',3'-cyclic GMP binding or for a response to it; 
      that gap is raised as a question rather than filled with an ill-fitting id.
    proposed_replacement_terms:
    - id: GO:1905108
      label: guanosine binding
    supported_by:
    - reference_id: PMID:35477763
      supporting_text: The TLR7Y264H variant selectively increased sensing of guanosine and 
        2',3'-cGMP10-12, and was sufficient to cause lupus when introduced into mice.
    - reference_id: PMID:38697119
      supporting_text: PLD exonuclease activity further released the terminal 2',3'-cyclic guanosine
        monophosphate (2',3'-cGMP) to engage pocket 1 and was also needed to generate RNA fragments 
        for pocket 2.
    - reference_id: PMID:35477763
      supporting_text: TLR7 is a sensor of viral RNA8,9 and binds to guanosine10-12.
    - reference_id: PMID:31608988
