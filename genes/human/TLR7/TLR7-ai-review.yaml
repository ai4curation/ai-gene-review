core_functions:
- description: 'TLR7 is the recognition receptor of the endolysosomal TLR7 signalling pathway. Its leucine-rich-repeat
    ectodomain binds RNA catabolites in the lumen of the endolysosome and its cytoplasmic TIR domain transduces
    the event: occupancy of both ligand sites locks two protomers into an activated m-shaped dimer whose
    apposed TIR domains recruit MyD88, assembling the IRAK4-IRAK1/2-TRAF6 myddosome that activates canonical
    NF-kappaB and IRF7. Because the ligands are generic RNA degradation products rather than a foreign-specific
    chemistry, discrimination of self from non-self rests on where the receptor is: it signals only from
    acidified endolysosomes reached via UNC93B1.'
  molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  directly_involved_in:
  - id: GO:0034154
    label: toll-like receptor 7 signaling pathway
  - id: GO:0051607
    label: defense response to virus
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  - id: GO:0032727
    label: positive regulation of interferon-alpha production
  locations:
  - id: GO:0036020
    label: endolysosome membrane
  - id: GO:0010008
    label: endosome membrane
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:27742543
    supporting_text: we generated crystal structures of three TLR7 complexes, and found that all 
      formed an activated m-shaped dimer with two ligand-binding sites
  - reference_id: PMID:38697119
    supporting_text: Toll-like receptor 7 (TLR7) is essential for recognition of RNA viruses and 
      initiation of antiviral immunity.
  - reference_id: PMID:12738885
    supporting_text: The stimulation of TLR7 by the guanosine analogs in human cells appears to 
      require endosomal maturation because inhibition of this process with chloroquine significantly
      reduced the downstream activation of NF-kappaB.
- description: The first ligand-binding site of TLR7, at the interface between the two protomers and
    conserved with TLR8, binds a guanosine moiety, and this is the occupancy that is essential for 
    activation. Guanosine, deoxyguanosine and C8-substituted guanosine analogues act as 
    RNA-independent agonists through this pocket; physiologically it is filled by the guanosine 
    2',3'-cyclic monophosphate that PLD3 and PLD4 release from RNase T2-cleaved RNA. The lupus 
    variant Y264H lies in this site and selectively increases sensing of guanosine and 2',3'-cGMP. 
    GO has no term for the cyclic-phosphate form, so guanosine binding is the closest available 
    description of the activity.
  molecular_function:
    id: GO:1905108
    label: guanosine binding
  directly_involved_in:
  - id: GO:0034154
    label: toll-like receptor 7 signaling pathway
  locations:
  - id: GO:0036020
    label: endolysosome membrane
  supported_by:
  - reference_id: PMID:27742543
    supporting_text: The first site preferentially recognized guanosine and the second site 
      specifically bound to uridine moieties in ssRNA.
  - reference_id: PMID:31608988
    supporting_text: We conclude that dG induces an inflammatory response through TLR7 and propose 
      that dG is an RNA-independent TLR7 agonist.
  - reference_id: PMID:38697119
    supporting_text: PLD exonuclease activity further released the terminal 2',3'-cyclic guanosine 
      monophosphate (2',3'-cGMP) to engage pocket 1 and was also needed to generate RNA fragments 
      for pocket 2.
- description: 'The second ligand-binding site, on the concave face of the TLR7 horseshoe and absent from
    TLR8, binds short single-stranded uridine-containing RNA fragments and raises the affinity of the
    first site for its guanosine ligand. This is how TLR7 reads viral RNA genomes: endosomal recognition
    of influenza genomic RNA and of other single-stranded RNAs drives MyD88-dependent interferon and cytokine
    induction, and nucleoside modifications that occur in host RNA abolish the response.'
  molecular_function:
    id: GO:0003727
    label: single-stranded RNA binding
  directly_involved_in:
  - id: GO:0034154
    label: toll-like receptor 7 signaling pathway
  - id: GO:0051607
    label: defense response to virus
  locations:
  - id: GO:0036020
    label: endolysosome membrane
  supported_by:
  - reference_id: PMID:27742543
    supporting_text: The second site spatially distinct from that of TLR8 was used for a 
      ssRNA-binding that enhanced the affinity of the first-site ligands.
  - reference_id: PMID:14976261
    supporting_text: Here, we show that this requires endosomal recognition of influenza genomic RNA
      and signaling by means of Toll-like receptor 7 (TLR7) and MyD88.
  - reference_id: PMID:16111635
    supporting_text: We show that RNA signals through human TLR3, TLR7, and TLR8, but incorporation 
      of modified nucleosides m5C, m6A, m5U, s2U, or pseudouridine ablates activity.
suggested_questions:
- question: GO:0070305 response to cGMP (IMP, PMID:35477763) is defined for guanosine 
    3',5'-cyclophosphate, but the TLR7 site-1 ligand is the 2',3'-cyclic isomer released from RNA by
    RNase T2 and PLD3/PLD4 (PMID:38697119). Should this row be replaced by GO:1905108 guanosine 
    binding, and should GO create terms for 2',3'-cyclic GMP binding and for a response to it?
- question: GO:0034158 toll-like receptor 8 signaling pathway is annotated to TLR7 by Ensembl 
    Compara transfer from mouse Tlr7. Since the term is defined by ligand binding to TLR8, should 
    the transfer be blocked for receptor-specific pathway terms in this family generally?
- question: The TLR7/8/9 PAINT node carries is_active_in GO:0005886 plasma membrane. Given that all 
    three receptors signal from endolysosomes and that forcing them to the surface abolishes 
    function, should that assertion be retired or demoted at the node?
- question: GO:0071260 cellular response to mechanical stimulus (IEP) on TLR7, TLR8 and TLR3 all 
    cite PMID:19593445, a paper on BAD and prostate cancer growth that never mentions TLRs. What was
    the intended reference?
- question: GO:0043235 signaling receptor complex (IDA, MGI) on TLR7 cites PMID:23382219, the SNX17 
    PX-FERM structure paper, whose full text does not mention TLR7. What was the intended reference 
    - and should the activated TLR7 homodimer or the TLR7-UNC93B1 complex be the modelled complex?
- question: Does the IFN-gamma defect in TLR7 loss-of-function patients (PMID:32706371) justify 
    involved_in GO:0032729 for TLR7 itself, given that IFN-gamma is produced by NK and T cells 
    rather than by the TLR7-expressing cells in those PBMC cultures?
- question: Is siRNA binding (GO:0035197) defensible for TLR7 when both structurally defined sites 
    bind a guanosine moiety and single-stranded uridine-containing RNA, and no direct TLR7-siRNA 
    duplex binding has been measured?
suggested_experiments:
- description: Direct binding measurements (ITC or SPR) of the purified TLR7 ectodomain against 
    guanosine 2',3'-cyclic monophosphate, guanosine 3',5'-cyclic monophosphate and guanosine, to 
    establish quantitatively whether TLR7 discriminates the two cyclic isomers and to settle which 
    GO term describes the activity.
- description: Binding and activation assays of purified TLR7 with a defined siRNA duplex, the same 
    duplex after denaturation, and its single strands, to test whether siRNA recognition requires 
    duplex structure or proceeds through single-stranded RNA.
- description: Cell-type-resolved IFN-gamma measurement (single-cell cytokine capture or 
    intracellular staining) in TLR7-deficient versus control PBMCs stimulated with imiquimod, to 
    determine whether the IFN-gamma producers express TLR7 or respond as bystanders.
- description: Quantitative colocalisation of endogenous human TLR7 with Golgi, early-endosome, 
    late-endosome and lysosome markers in plasmacytoid dendritic cells and B cells, using the same 
    panel applied to TLR8 in PMID:22164301, to test the Reactome Golgi-transit step and the surface 
    pool directly.
- description: Imiquimod and ssRNA stimulation of cells expressing TLR7 in which the first-site or 
    second-site residues are separately mutated, reading out NF-kappaB, IRF7 and IL-8, to determine 
    whether the two sites contribute to different output branches or only to a shared activation 
    threshold.
