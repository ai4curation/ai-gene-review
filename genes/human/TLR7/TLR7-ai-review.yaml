- term:
    id: GO:0003725
    label: double-stranded RNA binding
  evidence_type: IDA
  original_reference_id: PMID:16111635
  qualifier: enables
  review:
    action: MODIFY
    summary: IDA for double-stranded RNA binding from the nucleoside-modification study, which 
      reports that RNA signals through TLR3, TLR7 and TLR8.
    reason: The essence is right - TLR7 recognises RNA - but the RNA species is wrong. 
      Double-stranded RNA is the TLR3 ligand; the crystal structures show that TLR7's second site 
      binds single-stranded, uridine-containing RNA, and its first site binds guanosine or 
      2',3'-cGMP released from RNA by RNase T2 and the PLD exonucleases. Single-stranded RNA binding
      (GO:0003727) is the supported term and is already annotated from other evidence.
    proposed_replacement_terms:
    - id: GO:0003727
      label: single-stranded RNA binding
    supported_by:
    - reference_id: PMID:16111635
      supporting_text: We show that RNA signals through human TLR3, TLR7, and TLR8, but 
        incorporation of modified nucleosides m5C, m6A, m5U, s2U, or pseudouridine ablates activity.
    - reference_id: PMID:27742543
      supporting_text: The first site preferentially recognized guanosine and the second site 
        specifically bound to uridine moieties in ssRNA.
    - reference_id: PMID:38697119
      supporting_text: PLD exonuclease activity further released the terminal 2',3'-cyclic guanosine
        monophosphate (2',3'-cGMP) to engage pocket 1 and was also needed to generate RNA fragments 
        for pocket 2.
