id: P08887
gene_symbol: IL6R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IL6R encodes the interleukin-6 receptor alpha chain, a ligand-binding
  type-I cytokine receptor subunit that captures IL-6 and presents it to the signal-transducing
  gp130/IL6ST dimer. The membrane isoform mediates classic IL-6 signaling on IL6R-expressing
  cells, whereas an alternatively spliced and proteolytically shed soluble receptor
  binds IL-6 in the extracellular space and activates gp130 on cells that lack membrane
  IL6R, enabling IL-6 trans-signaling. IL6R thereby couples IL-6 to JAK-STAT, MAPK
  and PI3K signaling programs that regulate acute-phase, immune, regenerative and
  inflammatory responses.
alternative_products:
- name: 1 (Long, mIL6R)
  id: P08887-1
- name: 2 (Short, sIL6R)
  id: P08887-2
  sequence_note: VSP_001682, VSP_001683
existing_annotations:
- term:
    id: GO:0002384
    label: hepatic immune response
  evidence_type: TAS
  original_reference_id: PMID:12832423
  qualifier: involved_in
  review:
    summary: Hepatic immune response needs the full paper to adjudicate.
    action: UNDECIDED
    reason: The cached abstract for PMID:12832423 verifies ADAM10/ADAM17-dependent shedding of
      human IL6R but does not document a hepatic immune-response assay for IL6R. Because this
      is a TAS row and the full text was not read, the row is left undecided rather than removed.
    supported_by:
    - reference_id: PMID:12832423
      supporting_text: Here we show that cholesterol depletion of cells with methyl-beta-cyclodextrin
        increases IL-6R shedding independent of protein kinase C activation and thus differs from
        phorbol ester-induced shedding.
- term:
    id: GO:0002548
    label: monocyte chemotaxis
  evidence_type: IC
  original_reference_id: PMID:10510402
  qualifier: involved_in
  supporting_entities:
  - GO:0032722
  review:
    summary: IL-6 trans-signaling-induced MCP-1 release supports a non-core
      monocyte-chemotaxis output.
    action: KEEP_AS_NON_CORE
    reason: PMID:10510402 showed that IL-6 plus soluble IL6R makes vascular smooth muscle
      cells up-regulate gp130, secrete IL-6, and selectively produce MCP-1. The row is
      kept as a vascular inflammatory chemotaxis output downstream of IL6R
      trans-signaling, not as the receptor alpha chain's conserved molecular role.
    supported_by:
    - reference_id: PMID:10510402
      supporting_text: In the wake of this self-sustaining system, there is a selective induction
        and secretion of MCP-1, up-regulation of ICAM-1, and marked cell proliferation.
- term:
    id: GO:0002690
    label: positive regulation of leukocyte chemotaxis
  evidence_type: TAS
  original_reference_id: PMID:15100312
  qualifier: involved_in
  review:
    summary: Soluble IL6R modulates neutrophil chemokines as a non-core inflammatory output.
    action: KEEP_AS_NON_CORE
    reason: PMID:15100312 compared different soluble IL6R isoforms in mesothelial cells and a
      mouse peritoneal-inflammation model, where IL-6 trans-signaling reshaped
      neutrophil-attracting CXC chemokines. That leukocyte-chemotaxis effect is a
      context-specific inflammatory output of soluble IL6R rather than the core
      IL-6-binding activity.
    supported_by:
    - reference_id: PMID:15100312
      supporting_text: Interleukin-6 signaling via its soluble receptor (sIL-6R)
        differentially regulates inflammatory chemokine expression and
        leukocyte apoptosis to coordinate transition from neutrophil to
        mononuclear cell infiltration.
