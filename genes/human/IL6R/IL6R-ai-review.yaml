- term:
    id: GO:0072126
    label: positive regulation of glomerular mesangial cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:26563755
  qualifier: involved_in
  review:
    summary: positive regulation of glomerular mesangial cell proliferation overstates
      a downstream association.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited work connects IL6/IL6R signaling with this phenotype, but it
      does not show that IL6R itself executes a specific step in positive regulation
      of glomerular mesangial cell proliferation; the process annotation is therefore
      likely broader than the demonstrated receptor activity.
    supported_by:
    - reference_id: PMID:26563755
      supporting_text: The expression of IL-6R was barely detected in the control
        groups, while in the DN group, the IL-6R was clearly detectable.
- term:
    id: GO:0097191
    label: extrinsic apoptotic signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:15100312
  qualifier: involved_in
  review:
    summary: Soluble IL6R changes leukocyte survival as part of an inflammatory chemokine
      program.
    action: KEEP_AS_NON_CORE
    reason: PMID:15100312 describes soluble-IL6R control of inflammatory chemokine expression
      and leukocyte apoptosis during the neutrophil-to-mononuclear-cell transition. The
      apoptosis row is therefore a downstream inflammatory outcome, not IL6R's main
      receptor function.
    supported_by:
    - reference_id: PMID:15100312
      supporting_text: Interleukin-6 signaling via its soluble receptor (sIL-6R)
        differentially regulates inflammatory chemokine expression and
        leukocyte apoptosis to coordinate transition from neutrophil to
        mononuclear cell infiltration.
