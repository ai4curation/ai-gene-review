suggested_questions:
- question: Which IL-6 outputs in primary human tissues require membrane IL6R classic
    signaling versus soluble-IL6R trans-signaling?
- question: How do endogenous soluble IL6R generated by alternative splicing and by
    ectodomain shedding differ in concentration, tissue source and inflammatory activity?
suggested_experiments:
- description: Compare selective soluble-gp130 blockade with anti-IL6R blockade in
    primary human gp130-positive, IL6R-negative cells to isolate the contribution
    of soluble IL6R trans-signaling.
  experiment_type: cell biology
- description: Quantify IL6R splice-derived and proteolytically shed soluble receptor
    isoforms after ADAM10/ADAM17 perturbation in human immune and stromal cells.
