core_functions:
- description: Outer-membrane receptor/adaptor that binds cytosolic DNM1L (DRP1) and recruits it to mitochondrial
    and peroxisomal fission sites.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0000266
    label: mitochondrial fission
  - id: GO:0016559
    label: peroxisome fission
  - id: GO:0070585
    label: protein localization to mitochondrion
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0005777
    label: peroxisome
  supported_by:
  - reference_id: PMID:21149567
    supporting_text: indicating that Mff functions in mitochondrial fission by regulating the mitochondrial
      recruitment step of Drp1
  - reference_id: PMID:21149567
    supporting_text: Mff interacts with Drp1 both in vivo and in vitro.
  - reference_id: PMID:23921378
    supporting_text: Fis1 and Mff are Drp1 receptor/effector proteins of mitochondria and peroxisomes.
suggested_questions:
- question: How does MFF preferentially bind GTP-bound, oligomeric DRP1, and how do DRP1 phosphorylation
    (Ser616/Ser637) and MFF phosphorylation by AMPK tune receptor affinity in vivo?
- question: What determines the division of labour between MFF and MIEF1/MIEF2 at the same mitochondrial
    constriction sites?
suggested_experiments:
- description: Reconstitute DRP1 assembly on liposomes carrying MFF versus MIEF1/MIEF2 cytosolic domains
    and measure membrane constriction and scission by cryo-ET.
