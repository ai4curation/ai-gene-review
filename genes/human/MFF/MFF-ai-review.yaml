- term:
    id: GO:0090141
    label: positive regulation of mitochondrial fission
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000420890
  - RGD:1310230
  review:
    summary: Positive regulation of mitochondrial fission (IBA).
    action: ACCEPT
    reason: MFF promotes fission by recruiting and stimulating assembly of DRP1; it is often treated as
      a fission regulator/effector rather than the scission enzyme, so this IBA is a reasonable description
      alongside mitochondrial fission.
    supported_by:
    - reference_id: PMID:23921378
      supporting_text: Fis1 and Mff are Drp1 receptor/effector proteins of mitochondria and peroxisomes.
    - reference_id: PMID:23530241
      supporting_text: Analytical ultracentrifugation studies are consistent with Drp1 and Mff forming
        homodimers
