id: Q9GZY8
gene_symbol: MFF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MFF (mitochondrial fission factor) is a tail-anchored (type IV) membrane protein of the
  mitochondrial outer membrane and the peroxisomal membrane, with a cytosol-facing N-terminal region and
  a C-terminal transmembrane anchor. It is the principal receptor that recruits the cytosolic dynamin-related
  GTPase DRP1 (DNM1L) to sites of organelle division, and it also activates DRP1: MFF forms dynamic oligomers
  through its C-terminal coiled coil, and oligomeric MFF stimulates DRP1 GTPase activity and assembly,
  an effect enhanced by actin filaments. MFF acts alongside the other DRP1 adaptors FIS1, MiD49 and MiD51,
  but unlike MiD49/MiD51 it is also present on peroxisomes, so it is required for the division of both
  organelles. Loss of MFF leaves mitochondria and peroxisomes hyper-elongated; biallelic loss-of-function
  variants cause encephalopathy due to defective mitochondrial and peroxisomal fission 2 (EMPF2), a Leigh-like
  early-onset neurological disease with optic and peripheral neuropathy.'
