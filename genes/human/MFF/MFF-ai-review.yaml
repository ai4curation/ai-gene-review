    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:18353969
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9GZY8
  review:
    summary: Identical protein binding (IPI; MFF self-interaction). Full text not cached; the abstract
      reports MFF in ~200 kDa complexes.
    action: KEEP_AS_NON_CORE
    reason: MFF self-association is real (its cytoplasmic domain forms dimers/oligomers via a C-terminal
      coiled coil) but this is a structural property rather than its core activity.
    supported_by:
    - reference_id: PMID:23530241
      supporting_text: Analytical ultracentrifugation studies are consistent with Drp1 and Mff forming
        homodimers
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:23530241
  qualifier: enables
  review:
    summary: 'Protein homodimerization activity (IDA): equilibrium sedimentation shows the MFF cytoplasmic
      domain is a dimer.'
    action: KEEP_AS_NON_CORE
    reason: Directly demonstrated, but oligomerization supports the adaptor function rather than being
      the function itself.
    supported_by:
    - reference_id: PMID:23530241
      supporting_text: the cytoplasmic domain of Mff is a dimer
    - reference_id: PMID:23530241
      supporting_text: Analytical ultracentrifugation studies are consistent with Drp1 and Mff forming
        homodimers
- term:
    id: GO:0070585
    label: protein localization to mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1922984
  - PANTHER:PTN000420890
  - UniProtKB:Q9GZY8
  review:
    summary: 'Protein localization to mitochondrion: MFF recruits cytosolic DRP1 to the mitochondrial
      outer membrane.'
    action: ACCEPT
    reason: Here the localized protein is DRP1, and MFF performs the recruitment step directly by binding
      DRP1 at the membrane; this is the process counterpart of its adaptor activity. Supported experimentally
      (IMP, IDA), by ISS from mouse and by the PANTHER IBA.
    supported_by:
    - reference_id: PMID:21149567
      supporting_text: indicating that Mff functions in mitochondrial fission by regulating the mitochondrial
        recruitment step of Drp1
    - reference_id: PMID:21149567
      supporting_text: Drp1 foci on the mitochondria was clearly decreased and rather was dispersed throughout
        the cytoplasm in Mff RNAi cells
    - reference_id: PMID:23283981
      supporting_text: Fis1, Mff, MiD49, and MiD51 mediate Drp1 recruitment in mitochondrial fission.
