suggested_questions:
- question: How is the division of labour between MFF, FIS1, MiD49 and MiD51 set at a given fission site,
    and why does loss of MFF alone produce a severe neurological disease when the other adaptors remain?
- question: Do the peroxisomal and mitochondrial halves of MFF loss contribute separately to EMPF2 pathology,
    given that peroxisomal metabolic function is largely preserved in patient cells?
suggested_experiments:
- description: Rescue MFF-null patient fibroblasts or iPSC-derived neurons with organelle-restricted MFF
    (mitochondria-only versus peroxisome-only anchors) and measure organelle morphology, DRP1 recruitment
    and neuronal survival to apportion the disease mechanism between the two organelles.
