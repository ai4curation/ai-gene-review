id: Q9GZY8
gene_symbol: MFF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Mitochondrial fission factor (MFF) is a C-terminally tail-anchored protein of the mitochondrial
  outer membrane and peroxisomal membrane whose cytosolic N-terminal region, followed by a coiled-coil
  that mediates self-association, binds the dynamin-related GTPase DNM1L (DRP1). MFF is the main membrane
  receptor that recruits DRP1 from the cytosol to mitochondrial and peroxisomal constriction sites, where
  DRP1 assembles into helical oligomers that constrict and sever the membrane. Loss of MFF causes elongated,
  hyperconnected mitochondria and elongated peroxisomes, and biallelic MFF loss-of-function variants cause
  an early-onset encephalopathy due to defective mitochondrial and peroxisomal fission (EMPF2). MFF acts
  alongside the other DRP1 receptors MIEF2 (MiD49) and MIEF1 (MiD51), which are mitochondria-specific,
  and FIS1.
