  review:
    summary: IPI with DNM1L (O00429). The paper shows MFF binds DRP1 on the outer membrane and this binding
      recruits DRP1 to mitochondrial foci.
    action: MODIFY
    reason: 'Generic protein binding is uninformative. The cited experiment supports the more specific
      adaptor function: MFF, a tail-anchored outer-membrane protein, binds cytosolic DRP1 and recruits
      it to the membrane, i.e. protein-membrane adaptor activity.'
