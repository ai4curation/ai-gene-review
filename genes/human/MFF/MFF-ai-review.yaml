    label: mitochondrial fission
  evidence_type: IDA
  original_reference_id: PMID:23283981
  qualifier: involved_in
  review:
    summary: Mitochondrial fission. MFF is the principal outer-membrane receptor that recruits DNM1L/DRP1
      to mitochondrial (and peroxisomal) scission sites; its loss elongates mitochondria and peroxisomes.
    action: ACCEPT
    reason: Core process for MFF. Knockdown/knockout of MFF blocks DRP1 recruitment and fission (IMP),
      and MFF overexpression or reconstitution recruits DRP1 (IDA); the mouse ortholog supports the ISS
      transfer. MFF does part of the work by positioning the DRP1 GTPase at constriction sites.
    supported_by:
    - reference_id: PMID:21149567
      supporting_text: indicating that Mff functions in mitochondrial fission by regulating the mitochondrial
        recruitment step of Drp1
    - reference_id: PMID:23283981
      supporting_text: Fis1, Mff, MiD49, and MiD51 mediate Drp1 recruitment in mitochondrial fission.
    - reference_id: PMID:18353969
      supporting_text: We conclude that Mff is a novel component of a conserved membrane fission pathway
        used for constitutive and induced fission of mitochondria and peroxisomes.
    - reference_id: file:human/MFF/MFF-uniprot.txt
      supporting_text: Plays a role in mitochondrial and peroxisomal fission
