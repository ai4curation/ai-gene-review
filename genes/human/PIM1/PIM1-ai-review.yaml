id: P11309
gene_symbol: PIM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PIM1 encodes a constitutively active serine/threonine protein kinase with cytosolic, nuclear
  and long-isoform plasma-membrane pools. PIM1 phosphorylates cell-cycle, survival and nutrient-signaling
  substrates including CDKN1A, CDKN1B, GBP1 and DEPDC5, thereby linking cytokine-regulated expression
  to proliferation, apoptosis resistance, TORC1 activation and regulation of GBP1 antimicrobial activity.'
