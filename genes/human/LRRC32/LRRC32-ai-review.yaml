core_functions:
- description: Cell-surface docking receptor and chaperone for latent TGF-beta. GARP disulfide-bonds the
    latency-associated peptide of proTGFB1, outcompetes LTBP1, tethers the latent cytokine to the plasma
    membrane of regulatory T cells and platelets, and presents it for integrin alphaV-beta6/beta8-mediated
    activation, controlling TGF-beta bioavailability.
  molecular_function:
    id: GO:0050431
    label: transforming growth factor beta binding
