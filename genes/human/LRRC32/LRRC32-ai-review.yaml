suggested_questions:
- question: How is the switch between GARP holding TGF-beta latent and presenting it for integrin activation
    regulated on the Treg surface?
suggested_experiments:
- description: Test integrin alphaVbeta8-dependent activation of TGF-beta from purified GARP:proTGFB1
    complexes with disulfide and membrane-anchoring mutants.
  experiment_type: reconstituted activation assay
