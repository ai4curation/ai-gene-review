id: Q14392
gene_symbol: LRRC32
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LRRC32 (GARP, glycoprotein A repetitions predominant) is a single-pass type I transmembrane
  protein whose large extracellular region is almost entirely leucine-rich repeats. It is expressed at
  the surface of activated FOXP3+ regulatory T cells and platelets, where it is the cell-surface docking
  receptor for latent TGF-beta. It forms disulfide bonds (via Cys192 and Cys331) with the latency-associated
  peptide of proTGFB1, outcompeting LTBP1, and tethers the latent cytokine to the plasma membrane. GARP
  holds TGF-beta in its latent state and presents it for activation by integrins alphaV-beta6/beta8, thereby
  controlling the bioavailability and activation of TGF-beta that underlies regulatory T cell immunosuppression;
  the murine ortholog is also required for TGF-beta3 activation during palate fusion. GARP is a genuine,
  constitutively surface-exposed cell-surface protein with its ligand-binding LRR ectodomain facing the
  extracellular space.
