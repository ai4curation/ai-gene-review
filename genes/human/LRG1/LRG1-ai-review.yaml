- id: PMID:3856868
  title: Periodicity of leucine and tandem repetition of a 24-amino acid segment in
    the primary structure of leucine-rich alpha 2-glycoprotein of human serum.
  findings:
  - statement: Mature human plasma LRG is a single 312-residue glycosylated polypeptide.
    supporting_text: >-
      The complete primary structure of the 3.1S leucine-rich alpha 2-glycoprotein (LRG) present in human plasma has been determined. This protein (Mr approximately 45,000) consists of a single polypeptide chain with one galactosamine and four glucosamine oligosaccharides attached. The polypeptide has two intrachain disulfide bonds and contains 312 amino acid residues of which 66 are leucine.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Human LRG contains repeated 24-residue segments, eight of which display characteristic leucine-rich periodicity.
    supporting_text: >-
      The amino acid sequence can be exactly divided into 13 segments of 24 residues each, eight of which exhibit a periodic pattern in the occurrence of leucine, proline, and asparagine.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The authors proposed membrane derivation or association from sequence hydrophobicity and distant homologies.
    supporting_text: >-
      These structural characteristics and the homology to mitochondrial proteins and apolipoproteins suggest that LRG is a membrane-derived or membrane-associated protein containing a series of domains capable of bipolar surface orientation.
    reference_section_type: ABSTRACT
