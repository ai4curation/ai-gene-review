- id: PMID:32887674
  title: A Multifunctional Role of Leucine-Rich α-2-Glycoprotein 1 in Cutaneous Wound
    Healing Under Normal and Diabetic Conditions.
  findings:
  - statement: Wound-infiltrating myeloid cells are a major LRG1 source, and bone-marrow-derived LRG1 contributes to normal wound repair.
    supporting_text: >-
      In line with these observations, our study revealed that LRG1 is predominantly produced by the wound-infiltrating CD11b+ myeloid cells.
    reference_section_type: DISCUSSION
  - statement: LRG1 promotes keratinocyte migration and supports keratinocyte proliferation during re-epithelialization.
    supporting_text: >-
      Consistent with the previous report (21), we showed that LRG1 overexpression and knockdown affect keratinocyte migration.
    reference_section_type: DISCUSSION
  - statement: LRG1 promotes angiogenic behaviors of human dermal microvascular endothelial cells.
    supporting_text: >-
      We further showed that LRG1 promotes angiogenesis by mediating HDMEC proliferation, migration, and the ability to form tube-like structures.
    reference_section_type: DISCUSSION
  - statement: Lrg1 loss delays normal wound repair but protects diabetic mice from delayed closure through reduced NETosis.
    supporting_text: >-
      In conclusion, we define here a complex but critical role of LRG1 in normal and diabetic wound healing. Lrg1 deficiency leads to a significant delay in normal wound healing as a consequence of impaired inflammation, reepithelialization, and angiogenesis. On the other hand, there is a reduced NETosis in diabetic mice with ablation of Lrg1, which protects Lrg1−/− from the diabetes-induced delay in wound healing.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and full text were verified. The study directly supports wound-context effects on neutrophils, keratinocytes, endothelial cells, and NETosis. Much of the causal evidence uses global mouse Lrg1 knockout and bone-marrow transplantation, complemented by human primary/cell-line assays; the opposite net effects in normal versus diabetic wounds must not be collapsed.
