- id: PMID:23868260
  title: LRG1 promotes angiogenesis by modulating endothelial TGF-β signalling.
  findings:
  - statement: LRG1 is a secreted glycoprotein expressed by retinal vasculature and increased during neovascular growth.
    supporting_text: >-
      When ranked according to fold change, a gene encoding a secreted glycoprotein of unknown function, namely leucine-rich alpha-2-glycoprotein-1 (Lrg1), emerged as the most significantly up-regulated.
    reference_section_type: RESULTS
  - statement: LRG1 associates with the endothelial TGF-beta receptor complex and directly binds ALK5, TGFBR2, and endoglin ectodomains.
    supporting_text: >-
      Immunoprecipitation of the receptor ectodomain revealed coimmunoprecipitation of LRG1 with ALK5, TβRII and ENG indicating a direct interaction of LRG1 with these individual receptors (Fig 4b).
    reference_section_type: RESULTS
  - statement: LRG1 requires TGF-beta1 to stimulate the endothelial pro-angiogenic TGFBR2-ALK1-SMAD1/5/8 branch.
    supporting_text: >-
      The addition of LRG1 alone did not activate Smad2/3 or Smad1/5, but in combination with TGFβ1 there was a dramatic induction of Smad1/5 phosphorylation showing that LRG1 requires the presence of TGFβ1 to stimulate the pro-angiogenic TßRII-ALK1-Smad1/5/8 pathway (Fig 5a).
    reference_section_type: RESULTS
  - statement: Lrg1 loss reduces pathological ocular angiogenesis, while antibody blockade attenuates angiogenesis.
    supporting_text: >-
      Mice lacking Lrg1 develop a mild retinal vascular phenotype but exhibit a significant reduction in pathological ocular angiogenesis. LRG1 binds directly to the TGF-β accessory receptor endoglin, which, in the presence of TGF-β1, results in promotion of the pro-angiogenic Smad1/5/8 signalling pathway. LRG1 antibody blockade inhibits this switch and attenuates angiogenesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and full text were verified. This is the decisive mechanistic study for receptor-complex binding, TGF-beta-dependent endothelial SMAD1/5 signaling, and angiogenesis. Evidence spans mouse genetics and disease models, primary mouse endothelial cells, human HUVECs, and recombinant ectodomain assays; those species and assay boundaries should remain explicit.
