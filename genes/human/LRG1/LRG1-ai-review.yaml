knowledge_gaps:
- gap_statement: >-
    The structure, stoichiometry, and cell-context determinants of the
    LRG1-TGF-beta receptor assembly are unresolved, including how endoglin and
    ligand exposure govern conditional ALK1 association and selection between
    ALK1-SMAD1/5 and ALK5-SMAD2 outputs.
  boundary: >-
    LRG1 directly binds isolated ALK5, TGFBR2, and endoglin ectodomains, while
    ALK1 association requires endoglin and is enhanced by TGF-beta1; endothelial
    and fibroblast assays establish distinct downstream outputs.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining the receptor assembly is necessary to predict when LRG1 will drive
    angiogenic rather than profibrotic TGF-beta signaling and to target the
    mechanism selectively.
  resolution: >-
    Determine structures and binding stoichiometries of human LRG1 with defined
    TGFBR1, TGFBR2, endoglin, ACVRL1, and TGF-beta combinations, then reconstitute
    branch-specific signaling in primary human endothelial cells and fibroblasts.
  provenance:
  - reference_id: PMID:37121976
    supporting_text: >-
      However, the crystal structure of LRG1 in complex with cytochrome c or TGFβ will be required for further analysis.
- gap_statement: >-
    The physiological source, tissue distribution, and abundance of
    LPHN2-activating deglycosylated LRG1 in humans are unknown, as is the precise
    structural basis for LPHN2 selectivity over LPHN1 and LPHN3.
  boundary: >-
    Removing LRG1 glycans, especially at N325, increases LPHN2 binding, and the
    resulting angiogenic and neurotrophic outputs have been shown in mouse tissue
    explants and diabetic mouse models.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this gap will establish whether glycan-regulated LPHN2 signaling is
    a physiological human mechanism or primarily an experimentally induced state.
  resolution: >-
    Use site-resolved glycoproteomics and LPHN2-binding assays on endogenous human
    plasma, neutrophil, and tissue LRG1, coupled to structural analysis of a human
    LRG1-LPHN2 complex and receptor-paralog selectivity tests.
  provenance:
  - reference_id: PMID:37121976
    supporting_text: >-
      However, the cellular and molecular mechanisms responsible for LRG1 deglycosylation under physiological conditions remain unknown.
  - reference_id: PMID:37121976
    supporting_text: >-
      How glycans attached to LRG1 can attenuate the interaction between LRG1 and LPHN2 and why deglycosylated LRG1 can bind only to LPHN2, not to LPHN1 and LPHN3, remain to be determined.
- gap_statement: >-
    It is unknown whether human LRG1 binds human extracellular cytochrome c with
    physiologically relevant affinity and neutralizes cytochrome-c activity in
    vivo.
  boundary: >-
    Human LRG1 bound horse and snake cytochrome c, but not yeast cytochrome c, in
    surface-plasmon-resonance assays; independent proteome-scale screens report a
    human LRG1-CYCS interaction without locally accessible pair-specific assay
    detail.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This distinguishes a physiological extracellular damage-response function
    from a plausible but incompletely tested interaction.
  resolution: >-
    Measure binding of native human LRG1 glycoforms to human cytochrome c, map the
    interface, and test whether LRG1 alters extracellular cytochrome-c activity or
    clearance in human-cell and in-vivo models.
  provenance:
  - reference_id: PMID:20442399
    supporting_text: >-
