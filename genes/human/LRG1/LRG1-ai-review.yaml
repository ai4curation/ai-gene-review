proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous human LRG1 glycoforms bind and activate LPHN2, where are they
    generated, and under which physiological or disease conditions?
- question: >-
    What receptor stoichiometry and cell-state variables determine whether LRG1
    enhances ALK1-SMAD1/5 or ALK5-SMAD2 signaling?
- question: >-
    Does native human LRG1 bind human extracellular cytochrome c and neutralize a
    defined cytochrome-c-dependent activity in vivo?
- question: >-
    Which cellular sources of LRG1 account for its opposing net effects in normal
    and diabetic wound healing?
suggested_experiments:
- hypothesis: >-
    Endoglin and TGF-beta jointly stabilize an LRG1-containing receptor assembly
    that favors endothelial ALK1-SMAD1/5 signaling, whereas a distinct assembly
    supports fibroblast ALK5-SMAD2 signaling.
  experiment_type: Structural biochemistry and pathway reconstitution
  description: >-
    Quantify human LRG1 binding to purified TGFBR1, TGFBR2, endoglin, ACVRL1, and
    TGF-beta in defined combinations by orthogonal biophysical methods; determine
    complex stoichiometry and structure, then test matched receptor perturbations
    and SMAD outputs in primary human endothelial cells and fibroblasts.
- hypothesis: >-
    A discrete endogenous human LRG1 glycoform lacking or remodeling the N325 glycan
    is the physiologically active LPHN2 ligand.
  experiment_type: Glycoproteomics, receptor binding, and signaling assays
  description: >-
    Isolate LRG1 from human plasma, neutrophils, and relevant tissue fluids; map
    site-specific glycoforms by quantitative glycoproteomics, fractionate them,
    and compare LPHN1-3 binding and LPHN2-dependent signaling with recombinant
    native, deglycosylated, and N325-mutant controls.
- hypothesis: >-
    Human LRG1 recognizes human extracellular cytochrome c and changes its
    extracellular bioactivity or clearance.
  experiment_type: Species-matched biophysics and functional perturbation
  description: >-
    Measure binding kinetics between native human LRG1 glycoforms and human
    cytochrome c, map the interaction interface, and test LRG1 dose-response and
    loss-of-function effects in human-cell assays exposed to extracellular
    cytochrome c before pursuing an in-vivo model.
- hypothesis: >-
    Hepatic, neutrophil-derived, and local tissue LRG1 make separable contributions
    to normal repair and diabetes-associated NETosis and delayed wound closure.
  experiment_type: Cell-source-resolved wound model and human tissue validation
  description: >-
    Combine lineage-restricted Lrg1 deletion or rescue with normal and diabetic
    mouse wound models, time-resolved inflammation, re-epithelialization,
    angiogenesis, and NETosis measurements, and validate conserved mechanisms in
    organotypic human skin cultures with source-specific LRG1 perturbation.
