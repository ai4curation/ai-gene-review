id: P02750
gene_symbol: LRG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRG1 is a secreted, extensively glycosylated leucine-rich-repeat protein produced
  as a 347-amino-acid precursor with a cleaved signal peptide (residues 1-35) and
  an eight-LRR mature chain (residues 36-347). It circulates in plasma and is
  produced prominently by hepatocytes and neutrophils. LRG1 has no known catalytic
  activity; it functions extracellularly as a context-dependent receptor-binding
  and signaling modulator. In endothelial cells exposed to TGF-beta, LRG1 binds
  endoglin and type I and type II TGF-beta receptor components, favors the
  pro-angiogenic ALK1-SMAD1/5 branch, and promotes endothelial proliferation and
  angiogenesis. In mouse fibroblasts it can instead enhance TGF-beta-SMAD2 signaling
  and profibrotic responses without requiring endoglin, illustrating that its
  signaling output depends on cellular receptor context. LRG1 glycosylation also gates a
  distinct interaction with the adhesion G protein-coupled receptor LPHN2:
  removal of the N325 glycan increases receptor binding and LPHN2-dependent
  angiogenic and neurotrophic activity in experimental systems. LRG1 additionally
  contributes to inflammatory-cell, re-epithelialization, vascular, and NETosis
  responses during wound repair, with opposing net effects in normal and diabetic
  mouse wounds. No alternative protein isoforms are reported.
