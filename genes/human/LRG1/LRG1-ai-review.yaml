core_functions:
- description: >-
    Extracellular LRG1 binds components of the TGF-beta receptor system and
    modulates pathway output according to ligand, receptor, and cell context.
    Direct one-to-one ectodomain binding is established for TGFBR1/ALK5,
    TGFBR2, and the type III receptor endoglin; association with ACVRL1/ALK1 is
    conditional on endoglin and is enhanced by TGF-beta1. In endothelial cells,
    LRG1 alone is not an agonist, but in the presence of TGF-beta1 it favors the
    pro-angiogenic ALK1-SMAD1/5 branch and promotes angiogenesis. Enhancement of
    TGF-beta-SMAD2 signaling in mouse fibroblasts is endoglin-independent, showing
    that downstream output is cell-context-dependent rather than a universal ALK1
    mechanism.
  molecular_function:
    id: GO:0005160
    label: transforming growth factor beta receptor binding
  directly_involved_in:
  - id: GO:0030511
    label: positive regulation of transforming growth factor beta receptor signaling pathway
  - id: GO:0045766
    label: positive regulation of angiogenesis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:23868260
    supporting_text: >-
      Immunoprecipitation of the receptor ectodomain revealed coimmunoprecipitation of LRG1 with ALK5, TβRII and ENG indicating a direct interaction of LRG1 with these individual receptors (Fig 4b).
  - reference_id: PMID:23868260
    supporting_text: >-
      These studies revealed that LRG1 only associated with ALK1 in the presence of ENG, to which it bound, and this was enhanced by the addition of TGFβ1 (Fig 4d).
  - reference_id: PMID:23868260
    supporting_text: >-
      The addition of LRG1 alone did not activate Smad2/3 or Smad1/5, but in combination with TGFβ1 there was a dramatic induction of Smad1/5 phosphorylation showing that LRG1 requires the presence of TGFβ1 to stimulate the pro-angiogenic TßRII-ALK1-Smad1/5/8 pathway (Fig 5a).
  - reference_id: PMID:29279415
    supporting_text: >-
      Although endoglin, an accessory TGF-β receptor, is essential for LRG to promote TGF-β signaling in endothelial cells during angiogenesis, we found that endoglin did not contribute to the ability of LRG to enhance Smad2 phosphorylation in fibroblasts.
- description: >-
    Human LRG1 binds the adhesion G protein-coupled receptor LPHN2 through a
    glycan-state-dependent activity. Removal of LRG1 glycans, especially the
    N325 glycan, increases high-affinity receptor binding and LPHN2-dependent
    signaling. Angiogenic and neurotrophic outputs have been demonstrated in
    mouse tissue explants and diabetic mouse models, whereas the abundance and
    physiological generation of the relevant deglycosylated human LRG1 species
    remain unknown; this is therefore a conditional receptor-binding activity,
    not a constitutive property assigned to all circulating LRG1.
  molecular_function:
    id: GO:0061761
    label: alpha-latrotoxin receptor binding
  directly_involved_in:
