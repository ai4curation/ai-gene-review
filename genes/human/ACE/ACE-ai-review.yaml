  review:
    summary: ACE regulates arterial pressure through angiotensin production and vasoactive peptide metabolism.
    action: ACCEPT
    reason: Human ACE inhibition produces a blood-pressure response under sodium depletion (PMID:174834),
      while peptide chemistry establishes the renin–angiotensin mechanism. The IC, phylogenetic and ortholog
      contexts are compatible with this conserved role. PMID:11303049 concerns mouse N-domain inhibition
      and does not establish that isolated N-domain inhibition lowers pressure; P47820 is rat ACE.
