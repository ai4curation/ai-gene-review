id: P12821
gene_symbol: ACE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACE is a zinc-dependent, chloride-responsive ectopeptidase that processes extracellular bioactive
  peptides. Its principal peptidyl-dipeptidase activity converts angiotensin I to angiotensin II and degrades
  bradykinin and other peptide substrates, coupling peptide metabolism to vascular tone and blood-pressure
  control. Somatic ACE contains homologous N- and C-terminal catalytic domains with overlapping but substrate-dependent
  preferences; Ac-SDKP hydrolysis is N-domain-preferred rather than exclusive to that domain. Membrane-anchored
  ACE presents its catalytic domains extracellularly and is proteolytically cleaved to release an active
  soluble ectodomain. Testis-specific ACE contains the C-domain; mouse models establish a requirement
  for sperm ACE in male fertility. ACE also cleaves selected peptides through secondary endoproteolytic
  reactions and can associate with bradykinin receptors and intracellular signaling proteins; these activities
  depend on the substrate, protein form and cellular setting.
