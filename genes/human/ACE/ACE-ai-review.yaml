  review:
    summary: The mouse donor study demonstrates Cx43 depletion downstream of ACE/RAS activation but does
      not resolve a post-transcriptional gene-expression mechanism.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:25017399 shows cSrc activation and Cx43 protein depletion in cardiac ACE-overexpressing
      mice. The mechanistic interpretation emphasizes Cx43 internalization and degradation. The unchanged-mRNA
      comparison was performed in Cav1-null and inhibitor-treated Cav1-null myocardium, and the authors
      did not resolve altered translation or trafficking. This does not establish that ACE regulates production
      of the mature gene product after transcription, so the transferred gene-expression assignment exceeds
      the demonstrated mechanism.
