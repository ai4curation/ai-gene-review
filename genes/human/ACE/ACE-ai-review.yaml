functional_isoforms:
- id: ACE_SOMATIC_MEMBRANE
  name: Two-domain membrane-anchored somatic ACE
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P12821-1
  description: The canonical somatic form has extracellular N- and C-terminal catalytic domains, a membrane
    anchor and a short cytoplasmic tail. Both catalytic domains are competent, with substrate-dependent
    selectivity and interdomain effects (PMIDs:1851160,26403559,35818993).
- id: ACE_TESTIS
  name: Testis-specific C-domain ACE
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P12821-3
    - P22966-1
  description: The testis-specific form contains the C-domain with a distinct N terminus. Human recombinant
    testis ACE is catalytically active (PMID:1668266). Fertility evidence from mouse models does not establish
    a GPI-cleaving mechanism for purified human ACE, and N-domain-specific Aβ42-to-Aβ40 conversion is
    not assigned to this form.
- id: ACE_SHED_SOMATIC
  name: Proteolytically released somatic ACE ectodomain
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000028531
  description: An active soluble ectodomain is proteolytically released from membrane-anchored somatic
    ACE. This is distinct from the alternatively spliced Somatic-2 transcript/product (PMIDs:10769174,8253769,9642152).
core_functions:
- description: Catalyzes zinc-dependent removal of C-terminal dipeptides from extracellular bioactive
    peptides, generating angiotensin II from angiotensin I and inactivating bradykinin. The active membrane-anchored
    and proteolytically released somatic forms couple peptide metabolism to vascular regulation. Both
    somatic catalytic domains also hydrolyze Ac-SDKP, with N-domain preference that depends on substrate
    and assay conditions.
  molecular_function:
    id: GO:0008241
    label: peptidyl-dipeptidase activity
  directly_involved_in:
  - id: GO:0002003
    label: angiotensin maturation
  - id: GO:0010815
    label: bradykinin catabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:1851160
    supporting_text: 'Both domains are enzymatically active

      and cleave the C-terminal dipeptide of hippuryl-His-Leu or angiotensin I.'
  - reference_id: PMID:6270633
    supporting_text: 'Lung and kidney converting enzyme

      hydrolyzed bradykinin, angiotensin I, and enkephalins'
  - reference_id: PMID:8253769
    supporting_text: An active soluble form of ACE circulates in human plasma
  - reference_id: PMID:12386153
    supporting_text: 'ACE was mostly

      localized to the plasma membrane.'
  - reference_id: PMID:26403559
    supporting_text: the dipeptidyl carboxypeptidase product of Ac-SDKP hydrolysis (KP, Fig. 1A).
suggested_questions:
- question: How should ACE-mediated N-terminal tripeptide release be represented when GO:0008240 currently
    inherits a serine-peptidase mechanism, while ACE is a zinc metallopeptidase?
- question: Does the full PMID:7961923 paper support hydrolysis of a free dipeptide (GO:0070573), or only
    removal of a dipeptide from a longer substrate?
- question: What are the protein-level abundance, catalytic competence and domain selectivity of the alternatively
    spliced Somatic-2 product, separately from the shed somatic ectodomain?
- question: Can the historical source texts and dataset-specific protein tables be recovered to resolve
    the retained source-context uncertainties without inferring results from article titles?
- question: Which physiological substrates explain the testis-specific ACE fertility requirement, and
    which reported GPI-release effects are direct chemistry rather than downstream sperm-surface remodeling?
