  review:
    summary: Metallopeptidase activity identifies the metal-dependent mechanism of ACE’s core peptide
      cleavage.
    action: ACCEPT
    reason: ACE’s principal peptidyl-dipeptidase reaction is zinc-dependent. GO:0008241 describes terminal
      dipeptide removal but does not encode the metal-dependent mechanism, so GO:0008237 supplies informative
      complementary molecular-function information. The secondary metalloendopeptidase activity retained
      as non-core does not make the core mechanism class uninformative. Human domain biochemistry supports
      this conserved mechanism; each native evidence and reference identity remains unchanged. A target
      ACE accession among an IBA node’s descendant evidence is expected and is not circular support.
    supported_by:
    - reference_id: PMID:11432860
      supporting_text: 'Angiotensin (Ang) I-converting enzyme (ACE) is a Zn(2+) metalloprotease with two

        homologous catalytic domains.'
    - reference_id: PMID:1851160
      supporting_text: 'Both domains are enzymatically active

        and cleave the C-terminal dipeptide of hippuryl-His-Leu or angiotensin I.'
    additional_reference_ids:
    - PMID:11432860
    - PMID:1851160
