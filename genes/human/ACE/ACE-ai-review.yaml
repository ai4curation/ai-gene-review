- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001548
  review:
    summary: Proteolysis is true but already entailed by the accepted angiotensin-maturation process.
    action: TOO_GENERAL
    reason: ACE directly cleaves peptide bonds. The accepted GO:0002003 angiotensin maturation entails
      proteolysis through GO:0016486 peptide hormone processing, GO:0140448 signaling receptor ligand precursor processing, and
      GO:0016485 protein processing. The broad term adds no process specificity here. GO:0043171 peptide
      catabolic process is not a descendant of GO:0006508, so replacing proteolysis with it would not
      be the refinement previously claimed. Its independently supported native rows are retained separately.
      This decision concerns the broad term, not the validity of its source evidence.
    supported_by:
    - reference_id: PMID:1851160
      supporting_text: 'Both domains are enzymatically active

        and cleave the C-terminal dipeptide of hippuryl-His-Leu or angiotensin I.'
    additional_reference_ids:
    - PMID:1851160
