- id: PMID:7683654
  title: Differences in the properties and enzymatic specificities of the two active sites of angiotensin
    I-converting enzyme (kininase II). Studies with bradykinin and other natural peptides.
  findings:
  - statement: Wild-type recombinant ACE and variants with one domain deleted or zinc-coordinating histidines
      mutated were compared. Both active sites converted bradykinin to BK1-7 and BK1-5. Substance P and
      luteinizing-hormone-releasing hormone also revealed endoproteolytic/C-terminal cleavage capabilities
      and domain-dependent chloride responses. This supports both native peptidyl-dipeptidase and bradykinin-catabolism
