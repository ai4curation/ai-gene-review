  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P09470
  - ensembl:ENSMUSP00000001963
  review:
    summary: The electronic metallocarboxypeptidase assignment should distinguish single-residue from
      dipeptide release.
    action: MODIFY
    reason: GO:0004181 specifies release of a single C-terminal residue. The independently demonstrated
      ACE reaction removes a C-terminal dipeptide, represented by GO:0008241. This is a term-specificity
      correction to the mouse-derived electronic transfer, not a claim that every possible single-residue
      reaction has been experimentally excluded.
    supported_by:
    - reference_id: PMID:1851160
      supporting_text: 'Both domains are enzymatically active

        and cleave the C-terminal dipeptide of hippuryl-His-Leu or angiotensin I.'
    additional_reference_ids:
    - PMID:1851160
    proposed_replacement_terms:
