  review:
    summary: Reported N-terminal tripeptide release needs reconciliation with the current term’s mechanism-specific
      ancestry.
    action: UNDECIDED
    reason: PMID:2983326 explicitly reports N-terminal tripeptide release by ACE. However, GO:0008240
      currently descends from serine-type exopeptidase activity, whereas ACE is a zinc metallopeptidase.
      Preserve the native IDA term rather than asserting a serine mechanism or dismissing the reported
      reaction. An ontology-scope question remains.
