suggested_questions:
- question: Is Gαi1 specifically required (as opposed to redundant with Gαi2/Gαi3) for LGN-NuMA cortical anchoring and spindle orientation in human cells, given that most loss-of-function data deplete all three paralogs?
- question: Does the efficacy-dependent rate of AHD opening seen for μOR and NTSR1 with Gαi1 also hold for other Gi-coupled receptors and for Gαi2/Gαi3/Gαo, and does it predict cellular signalling bias?
- question: Which GPCR and effector partners are disrupted by the NEDHISB-associated GNAI1 variants, and do these act as dominant negatives on Gβγ sequestration or receptor coupling?
- question: Is there a functional nuclear pool of Gαi1 in human cells, as transferred by similarity from rat?
suggested_experiments:
- hypothesis: Gαi1 has a non-redundant role in mitotic spindle orientation.
  description: Paralog-specific knockout of GNAI1 (alone and with GNAI2/GNAI3) in polarized epithelial cells, with rescue by WT, Δmyr and GoLoco-binding-deficient Gαi1, measuring LGN/NuMA cortical recruitment and spindle angle.
  experiment_type: genetic perturbation and live imaging
- hypothesis: Disease variants in GNAI1 alter receptor-catalysed AHD opening and nucleotide exchange.
  description: smFRET on the Gαi1Δ6-90C/238C background carrying NEDHISB variants (for example Q52P), coupled to μOR and other Gi-coupled receptors, together with GTP turnover assays.
  experiment_type: single-molecule biophysics
