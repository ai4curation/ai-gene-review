- term:
    id: GO:0000132
    label: establishment of mitotic spindle orientation
  evidence_type: NAS
  original_reference_id: PMID:11781568
  qualifier: involved_in
  review:
    summary: Gαi1 is part of the cortical Gαi-LGN-NuMA complex that recruits dynein-dynactin to orient the mitotic spindle. The cited LGN paper (PMID:11781568) is about LGN-NuMA and spindle-pole organization, but later work shows Gαi anchors LGN-NuMA at the cortex.
    action: KEEP_AS_NON_CORE
    reason: Gαi-GDP is the membrane anchor that recruits LGN (GPSM2) and NuMA to the cortex, which is needed for cortical dynein and spindle orientation (PMID:15537540, PMID:22327364, PMID:26766442). This is a real but receptor-independent, non-canonical role. Most loss-of-function evidence depletes all three Gαi paralogs, so GNAI1-specific necessity is not shown. Kept as non-core.
    additional_reference_ids:
    - PMID:15537540
    - PMID:22327364
    - PMID:26766442
    supported_by:
    - &id017
      reference_id: PMID:15537540
      supporting_text: NuMA or Galphai can disrupt this association, allowing LGN to interact simultaneously with both proteins, resulting in their cortical localization
    - &id034
      reference_id: PMID:26766442
      supporting_text: Proper spatiotemporal localization of the evolutionarily conserved Gαi-LGN-NuMA protein complex is critical for mitotic spindle orientation
    - &id032
      reference_id: PMID:22327364
      supporting_text: we found that the LGN binding proteins Gαi and NuMA were required for LGN and dynein localization to the cell cortex
