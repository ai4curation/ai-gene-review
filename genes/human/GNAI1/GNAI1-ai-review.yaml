- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P30804
  review:
    summary: The ISS donor P30804 resolves in the source chain to an adenylyl-cyclase family protein,
      not a Gi1 ortholog, and the term has the opposite sign to Gi1's in vivo role.
    action: REMOVE
    reason: Gi1 mediates the adenylate cyclase-inhibiting arm of GPCR signaling (GO:0007193, retained
      here). Stimulation of some purified cyclases by high concentrations of Gi alpha (PMID:8119955)
      is an in vitro observation; GO annotates the gene's in vivo role, and no native Gi1-mediated
      cyclase-activating pathway has been shown. The transfer itself is unsound, because the donor is
      an adenylyl cyclase rather than a Galpha ortholog. An electronic inference that is both wrongly
      sourced and contradicted on biological grounds is removed.
    additional_reference_ids:
    - PMID:8119955
    supported_by:
    - reference_id: PMID:8119955
      supporting_text: High concentrations of Gi alpha can interact with site 1 on types I and II adenylyl cyclase and activate the enzymes.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: UniProtKB:P30804
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The ISS donor P30804 resolves in the source chain to an adenylyl-cyclase family protein,
          not a Gi1 ortholog. The transferred term is the activating arm of adenylate cyclase signaling,
          the opposite of Gi1's in vivo inhibitory role; high-concentration stimulation of purified
          cyclases in vitro (PMID:8119955) does not establish an in vivo pathway.
    source_defects:
    - defect_type: WRONG_WITH_FROM
      resource: UNIPROT
      slot: With/From
      requested_change: DELETE_ROW
      asserted_value: UniProtKB:P30804
      confidence: CONFIRMED
      explanation: >-
        The ISS annotation of human GNAI1 (P63096) to GO:0007189 adenylate cyclase-activating G
        protein-coupled receptor signaling pathway takes as its With/From UniProtKB:P30804, which is
        dog adenylate cyclase type 6 (ADCY6), not a Galpha ortholog. Gi alpha-1 mediates the opposite,
        cyclase-inhibiting arm (GO:0007193); no correct donor exists for the activating term, so the row
        should be deleted.
