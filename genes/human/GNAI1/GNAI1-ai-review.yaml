id: P63096
gene_symbol: GNAI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAI1 encodes Gαi1, the alpha subunit of inhibitory (Gi) heterotrimeric G proteins and a member of the G(i/o/t/z) subfamily of G-alpha GTPases. N-terminal myristoylation and palmitoylation anchor Gαi1 to the cytoplasmic face of the plasma membrane, where Gαi1-GDP assembles with Gβγ dimers into the inactive heterotrimer. Agonist-bound Gi-coupled GPCRs (for example 5-HT1, D2-like dopamine, μ-opioid, apelin, chemokine and lactate receptors) bind the heterotrimer through the Gα C-terminal α5 helix and catalyse GDP release. Release requires opening of the Gα α-helical domain away from the Ras-like domain; single-molecule FRET on human Gαi1 shows that opening passes through a partly open intermediate and that agonist efficacy is encoded in how fast the domain opens. GTP-bound Gαi1 separates from Gβγ and directly inhibits adenylyl cyclases (notably AC1, AC5 and AC6), lowering cAMP. Its intrinsic GTPase, accelerated by RGS GAPs, returns it to the GDP state. GoLoco proteins (RGS14, GPSM1-3,
  PCP2) bind Gαi1-GDP as nucleotide dissociation inhibitors. Outside receptor signalling, Gαi1-GDP anchors LGN (GPSM2) and NuMA at the mitotic cortex to recruit dynein for spindle positioning, and Gαi1 is found at centrosomes and the midbody, where it contributes to cytokinesis. De novo dominant GNAI1 variants that impair GTP binding and hydrolysis cause a neurodevelopmental disorder with hypotonia, impaired speech and epilepsy (NEDHISB).
