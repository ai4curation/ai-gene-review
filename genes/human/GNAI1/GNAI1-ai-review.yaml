id: P63096
gene_symbol: GNAI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAI1 encodes G alpha i1, a heterotrimeric G protein alpha subunit that transduces signals
  from Gi-coupled receptors. It binds and hydrolyzes guanine nucleotides and can directly inhibit selected
  adenylyl cyclase isoforms, reducing cAMP production in receptor- and effector-dependent contexts. In
  addition to plasma-membrane signaling, Gi1 participates in cortical LGN–NuMA machinery that orients
  mitotic spindles and localizes to centrosomal and cytokinetic structures. Its cellular effects include
  neurotransmitter, endocrine and immune-cell responses.
