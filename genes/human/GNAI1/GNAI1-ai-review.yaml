- id: PMID:42870023
  title: Ligand-dependent G protein dynamics underlying opioid efficacy.
  findings:
  - statement: The smFRET construct is human Gαi1 carrying R90C (AHD) and E238C (Ras-like domain) labelling sites on a minimal-cysteine background, with WT-like ligand-dependent GTP turnover.
    supporting_text: previously published minimal cysteine background (C3S;C66A;C214S;C350S;C325A;C351I) of human Gαi1
  - statement: Receptor-catalysed GDP-GTP exchange on Gαi1 requires large-scale opening of the α-helical domain.
    supporting_text: Activation of heterotrimeric G proteins by G-protein-coupled receptors (GPCRs) requires large-scale opening of the Gα α-helical domain (AHD) to expose the nucleotide-binding site and facilitate GDP-GTP exchange
  - statement: Ligand efficacy is encoded in the rate of AHD opening (lifetime of the closed state), not in the stability of the open state.
    supporting_text: Mean dwell times in this high-FRET state (τhigh) depended strongly on ligand efficacy
  - statement: AHD transitions pass through a partly open intermediate state.
    supporting_text: suggesting that a partially open AHD could mediate transitions between the GDP-bound and fully open conformations
  - statement: The relation between AHD opening and efficacy also holds for NTSR1-Gi complexes.
    supporting_text: Parallel smFRET imaging of NTSR1–Gi ternary complexes (Methods), which couple promiscuously in vitro, yielded a correlation between agonist-induced low-FRET occupancy and GTP turnover similar to that of μOR
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The Methods confirm that the construct is human Gαi1 (minimal-cysteine background, Gαi1Δ6-90C/238C) assembled with human Gβ1γ2 and coupled to mouse μOR or human NTSR1. This is direct mechanistic evidence for receptor-catalysed GDP release by AHD opening in Gαi1 heterotrimers. Published 2026, so not yet in GOA.
