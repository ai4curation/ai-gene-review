  - reference_id: PMID:31873303
    supporting_text: Both CTPS2 filaments are composed of stacked tetramers
suggested_questions:
- question: Does CTPS2 form stable hetero-oligomers with CTPS1 in cells, or do the
    repeated CTPS1-CTPS2 interactome edges reflect coassembly of nearby homomeric
    cytoophidia?
  experts:
  - CTPS structural enzymology
- question: Is the MitoCoP mitochondrion signal a trace CTPS2 pool, reversible
    mitochondria-associated localization under a stress condition, or co-fractionation
    of abundant cytosolic CTPS2?
  experts:
  - Mitochondrial proteomics
suggested_experiments:
- hypothesis: CTPS2 and CTPS1 differ in whether intertetramer filament contacts are
    stabilized by the C-terminal tail.
  description: Compare sequence-verified human CTPS2, CTPS1 and tail-swap proteins in
    matched purified CTP synthase activity, negative-stain EM and cryo-EM filament-state
    assays with substrate-, apo- and product-bound conditions.
