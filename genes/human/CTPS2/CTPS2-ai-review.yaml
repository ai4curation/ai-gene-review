id: Q9NRF8
gene_symbol: CTPS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CTPS2 is a glutamine-dependent CTP synthase that converts UTP, ATP and
  glutamine to CTP, ADP, phosphate and glutamate during de novo CTP
  biosynthesis. The enzyme is a cytosolic homotetramer that can polymerize into
  stacked-tetramer cytoophidia in the cytoplasm and nucleus; CTPS2 filaments
  switch between substrate-bound active and CTP/product-bound inactive states and
  tune cooperativity of feedback regulation.
