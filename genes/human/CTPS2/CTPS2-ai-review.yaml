core_functions:
- description: >-
    CTPS2 couples glutamine hydrolysis to ATP-dependent amination of UTP,
    producing CTP for nucleotide, phospholipid and glycan precursor synthesis.
    The reaction occurs predominantly in the cytosol, where CTPS2 homotetramers
    can assemble into cytoophidium filaments of stacked tetramers that tune
    feedback regulation.
