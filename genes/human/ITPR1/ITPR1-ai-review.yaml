id: Q14643
gene_symbol: ITPR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ITPR1 encodes inositol 1,4,5-trisphosphate receptor type 1, a large multi-pass endoplasmic-reticulum
  membrane protein that assembles as a homotetramer to form an IP3-gated calcium release channel. Binding
  of IP3 (generated by phospholipase C downstream of many surface receptors), together with calcium, opens
  the channel and releases Ca2+ from ER stores into the cytosol, shaping calcium signals that control
  processes from fertilization and secretion to synaptic signaling, autophagy, ER-mitochondria calcium
  transfer and apoptosis. It also localizes to the nuclear envelope and sarcoplasmic reticulum.
