suggested_questions:
- question: How do the four IP3R1 subunits cooperate and how does Ca2+ act as both co-agonist and inhibitor
    to produce calcium oscillations?
- question: Which ITPR1 interactions (IRBIT/AHCYL1, Bcl-2 family, at MAMs) set the threshold between physiological
    Ca2+ signaling and apoptotic ER Ca2+ release?
suggested_experiments:
- description: Cryo-EM of human ITPR1 in closed and IP3/Ca2+-bound open states to define the gating mechanism.
  experiment_type: structural biology
- description: ER-targeted Ca2+ sensors in ITPR1-null cells reconstituted with gating mutants to map IP3-
    and Ca2+-dependence of release.
  experiment_type: cell biology
