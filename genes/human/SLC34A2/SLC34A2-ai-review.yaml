id: O95436
gene_symbol: SLC34A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC34A2 (NaPi-IIb, NPT2b) is a multi-pass membrane protein of the type II sodium/phosphate
  cotransporter family that carries inorganic phosphate into cells electrogenically together with three
  sodium ions, with an apparent Km for phosphate near 110 micromolar and for sodium in the tens of millimolar.
  It is delivered to the apical (brush border) plasma membrane of polarized epithelia and is abundantly
  expressed in lung alveolar type II cells, small intestine, mammary gland, pancreas, prostate, salivary
  gland and kidney. In the intestine it mediates sodium-dependent dietary phosphate absorption, a step
  regulated by vitamin D and oestrogen, and in the lung it clears phosphate from alveolar fluid, which
  keeps surfactant phospholipid turnover from generating microliths. Biallelic loss-of-function mutations
  cause pulmonary alveolar microlithiasis and testicular microlithiasis, and SLC34A2 is a recurrent 5'
  fusion partner of ROS1 in lung adenocarcinoma as well as an antibody-drug-conjugate target in ovarian
  and lung cancer.
