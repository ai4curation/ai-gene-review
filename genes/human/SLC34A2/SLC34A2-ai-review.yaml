core_functions:
- description: Functions in the apical (brush border) membrane of polarized epithelia - intestine, lung
    alveolar type II cells, mammary and salivary gland - as an electrogenic type II sodium/phosphate cotransporter
    that imports inorganic phosphate from the luminal space together with three sodium ions, thereby mediating
    dietary phosphate absorption, alveolar phosphate clearance and phosphate homeostasis.
  molecular_function:
    id: GO:0005436
    label: sodium:phosphate symporter activity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0031526
    label: brush border membrane
  directly_involved_in:
  - id: GO:0035435
    label: phosphate ion transmembrane transport
  - id: GO:0044341
    label: sodium-dependent phosphate transport
  - id: GO:0030643
    label: intracellular phosphate ion homeostasis
  supported_by:
  - reference_id: file:human/SLC34A2/SLC34A2-uniprot.txt
    supporting_text: Reaction=3 Na(+)(out) + phosphate(out) = 3 Na(+)(in) + phosphate(in)
  - reference_id: PMID:12488042
    supporting_text: The recently cloned NaPi-IIb cotransporter is an apical membrane protein that is
      involved in the absorption of phosphate in the intestine.
  - reference_id: PMID:12488042
    supporting_text: had a K(m) for Pi of approximately 106 microM and a K(m) for Na(+) of approximately
      34 mM
suggested_questions:
- question: How is SLC34A2 trafficking between the apical membrane and intracellular vesicle pools regulated
    in lung alveolar type II cells, where loss of function causes microlithiasis?
- question: Does the large extracellular loop carry regulatory or protein-interaction functions in addition
    to being the glycosylated, antibody-accessible face used for ADC targeting?
- question: What accounts for the inverse pH dependence of NaPi-IIb relative to the renal type II transporters,
    and does it matter in alveolar fluid?
suggested_experiments:
- description: Electrophysiological characterization of patient-derived SLC34A2 missense variants in oocytes
    or mammalian cells, separating trafficking defects from transport defects.
- description: Surface biotinylation and live-cell imaging of SLC34A2 in polarized human alveolar and
    intestinal epithelial models under phosphate loading, to quantify regulated apical insertion and retrieval.
- description: Cryo-EM of human NaPi-IIb in sodium- and phosphate-bound states to define the ion and substrate
    sites inferred from the kinetics.
