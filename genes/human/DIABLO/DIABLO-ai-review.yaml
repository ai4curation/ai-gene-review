core_functions:
- description: Mature SMAC/DIABLO antagonizes IAP proteins through its exposed N-terminal
    binding motif and dimeric interaction surfaces, relieving XIAP-mediated caspase inhibition
    and competing with caspases for BIRC6 binding. This permits caspase activation and activity
    during intrinsic apoptotic signaling.
  molecular_function:
    id: GO:1990525
    label: BIR domain binding
  directly_involved_in:
  - id: GO:0097193
    label: intrinsic apoptotic signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:10929711
    supporting_text: binding to inhibitor of apoptosis proteins, IAPs, and removing their
      inhibitory activity.
  - reference_id: PMID:10972280
    supporting_text: ability to interact physically with IAPs.
  - reference_id: PMID:28288130
    supporting_text: Intramembrane cleavage of Smac by PARL generates an amino-terminal IAP-binding
      motif
  - reference_id: PMID:36758106
    supporting_text: enabling SMAC to competitively displace caspases, thus antagonizing BIRC6
      anticaspase function.
suggested_questions:
- question: Does endogenous human DIABLO undergo the CD40-tail-dependent recruitment observed
    in mouse B cells, and what molecular contribution does the recruited pool make?
- question: Which precursor-processing and native-compartment conditions permit the non-IAP
    interactions found by yeast two-hybrid and affinity-purification screens?
- question: Does the cell-cycle effect of mature-SMAC overexpression reflect a physiological
    DIABLO regulatory mechanism distinct from apoptotic signaling?
suggested_experiments:
- description: Use endogenous tagging and product-specific rescue to compare canonical DIABLO,
    Diablo-S and SMAC3 targeting, processing, XIAP/BIRC6 binding and caspase responses.
- description: Test selected non-IAP interactions with endogenous proteins and compartment-resolved
    assays, retaining precursor, mature-chain and partner-product controls.
