id: Q9NR28
gene_symbol: DIABLO
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DIABLO, also called SMAC, is a mitochondrial intermembrane-space IAP antagonist synthesized as a precursor
  and proteolytically matured to expose an N-terminal IAP-binding motif. After mitochondrial outer-membrane permeabilization
  releases mature DIABLO to the cytosol, it binds inhibitor-of-apoptosis proteins such as XIAP and BIRC6 and relieves
  their restraint of apoptotic caspases, thereby promoting caspase activation and apoptotic signaling.'
alternative_products:
- name: '1'
  id: Q9NR28-1
- name: 2 (Diablo-S)
  id: Q9NR28-2
  sequence_note: VSP_004397
- name: 3 (SMAC3)
  id: Q9NR28-3
  sequence_note: VSP_042785
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11604410
  qualifier: enables
  supporting_entities:
  - UniProtKB:P98170
  review:
    summary: Mature SMAC/DIABLO binds IAP BIR surfaces and antagonizes IAP anti-caspase functions.
    action: MODIFY
    reason: DIABLO's mature AVPI N terminus is an IAP-binding motif that occupies BIR grooves on XIAP and
      other IAPs, relieving inhibition of apoptotic caspases. GO:1990525 BIR domain binding is more
      informative than bare protein binding for this mechanism.
    proposed_replacement_terms:
    - id: GO:1990525
      label: BIR domain binding
    supported_by:
    - reference_id: PMID:11604410
      supporting_text: DIABLO/Smac, prevent XIAP inhibition of active caspase 3 in vitro and is able to 
        counteract XIAP protection of mammalian NT2 cells against UV-induced cell death.
