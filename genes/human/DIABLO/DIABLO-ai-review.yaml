id: Q9NR28
gene_symbol: DIABLO
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DIABLO, also called SMAC, is an inhibitor-of-apoptosis protein antagonist. The
  canonical precursor enters mitochondria and is processed by mitochondrial processing peptidase
  and PARL, exposing an N-terminal IAP-binding motif. After mitochondrial outer-membrane permeabilization,
  mature SMAC is released from the intermembrane space into the cytosol, where its N-terminal
  motif and dimeric interaction surfaces engage IAP proteins including XIAP and BIRC6. These
  interactions relieve restraint of apoptotic caspases and promote intrinsic apoptotic signaling.
  Alternative splice products differ in targeting and IAP-regulatory properties.
alternative_products:
- name: '1'
  id: Q9NR28-1
  description: Canonical 239-residue precursor. Processing removes residues 1–21 and then
    22–55 to produce the 184-residue mature chain (56–239).
- name: 2 (Diablo-S)
  id: Q9NR28-2
  sequence_note: VSP_004397
  description: The 186-residue Diablo-S product replaces canonical residues 1–60 with MKSDFYF.
    The corresponding human short construct was cytosolic and weak in the cytochrome-c-dependent
    initiation assay, while retaining partial relief of effector-caspase inhibition.
- name: 3 (SMAC3)
  id: Q9NR28-3
  sequence_note: VSP_042785
  description: The 195-residue SMAC3 product lacks canonical residues 62–105. Human tagged
    SMAC3 localized to mitochondria and was released during apoptosis; recombinant mature
    constructs bound XIAP BIR2/BIR3.
