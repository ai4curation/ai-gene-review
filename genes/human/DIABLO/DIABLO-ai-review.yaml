  original_reference_id: PMID:11801603
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96CA5
  review:
    summary: SMAC binds and antagonizes ML-IAP/BIRC7.
    action: MODIFY
    reason: Processed SMAC binds BIRC7/ML-IAP through the same N-terminal IAP-binding motif used to neutralize
      IAP family anti-apoptotic proteins. GO:1990525 BIR domain binding captures that IAP groove interaction
      more specifically than GO:0005515.
    proposed_replacement_terms:
    - id: GO:1990525
      label: BIR domain binding
    supported_by:
    - reference_id: PMID:11801603
      supporting_text: physically interacts with SMAC through its BIR (baculovirus IAP repeat) domain.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12559088
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y3A2
  review:
    summary: The cited interaction does not define a DIABLO molecular function.
    action: REMOVE
    reason: This row records a partner edge or substrate relationship, but the evidence does not establish a 
      specific DIABLO activity beyond its core IAP-antagonist role. Retaining GO:0005515 would add an 
      uninformative generic binding annotation.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15200957
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NR09
  review:
    summary: SMAC/DIABLO antagonizes the giant IAP BIRC6/BRUCE.
    action: MODIFY
    reason: BIRC6 is both an anti-caspase IAP and a UBA6-dependent ubiquitin ligase for caspases and SMAC.
      Recent BIRC6-client structures show that multivalent SMAC binding to BIRC6 BIR-domain client-binding
      sites obstructs client binding and competitively releases caspases, so GO:1990525 BIR domain binding
      is more specific than a standalone generic binding function.
    proposed_replacement_terms:
    - id: GO:1990525
      label: BIR domain binding
