proposed_new_terms: []
suggested_questions:
- question: >-
    What is the true transport mechanism of human OATP4A1 - does it operate as an
    electroneutral organic anion exchanger (e.g. coupled to glutamate or
    bicarbonate efflux as proposed), is it electrogenic, and do the counterions
    differ between tissues (placenta vs kidney vs testis)? UniProt flags these as
    unresolved.
- question: >-
    In polarized epithelia, particularly placental syncytiotrophoblast, is OATP4A1
    at the apical (microvillous) or basolateral membrane, and does its polarity
    differ by tissue? The family-level IBA assigns basolateral plasma membrane,
    but human placental estrone-sulphate uptake was assayed at the microvillous
    (apical) membrane.
- question: >-
    Which substrate(s) and tissue(s) define the dominant physiological role of
    this broadly expressed multispecific transporter (maternal-fetal thyroid
    hormone transfer, Leydig-cell thyroid hormone handling, renal/hepatic organic
    anion uptake)?
suggested_experiments:
- description: >-
    Quantitative flux and electrophysiology on purified, reconstituted human
    OATP4A1 to test ion-independence and electrogenicity directly, identify the
    coupling counterion(s), and define the substrate selectivity profile and
    apparent affinities for T3/T4/rT3, estrone 3-sulfate, taurocholate and PGE2.
- description: >-
    Polarized epithelial / primary trophoblast models with domain-selective
    labeling to resolve whether OATP4A1 is apical (microvillous) or basolateral
    in placental syncytiotrophoblast and in other polarized tissues.
- description: >-
    Tissue-specific knockout/knockdown (placental and Leydig-cell models) to test
    OATP4A1's physiological contribution to maternal-fetal thyroid hormone transfer
    and local thyroid hormone delivery.
