id: Q96BD0
gene_symbol: SLCO4A1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLCO4A1 encodes OATP4A1 (OATP-E), a broadly/ubiquitously expressed,
  Na+-independent, multispecific organic anion transmembrane transporter of the
  SLCO/OATP (organic anion transporting polypeptide) family. It is a 12-pass
  plasma-membrane glycoprotein that recognizes a broad range of amphipathic
  organic anions, including the thyroid hormones T3 (3,3',5-triiodo-L-thyronine,
  the preferred iodothyronine), T4 (L-thyroxine) and reverse-T3, the conjugated
  steroids estrone 3-sulfate and estradiol-17-beta-glucuronide, the bile acid
  taurocholate, and the prostanoid prostaglandin E2. Like other OATPs it does not
  couple transport to a Na+ gradient or to ATP; it most likely operates as an
  electroneutral organic anion exchanger (antiporter), with transport stimulated
  at low extracellular pH (dependent on a conserved TM3 histidine) and, at the
  placental microvillous membrane, proposed to be coupled to outward glutamate
  movement. The protein is widely expressed (kidney, pancreas, liver, heart,
  lung, brain, intestine, placenta, testis and other tissues); in placenta it is
  present in the syncytiotrophoblast and in testis it localizes to Leydig cells.
  Its dominant physiological substrate and the precise transport mechanism,
  electrogenicity and counterions remain to be established.
