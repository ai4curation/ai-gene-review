core_functions:
- description: >-
    Na+-independent, multispecific organic anion transmembrane transport, best
    characterized as thyroid hormone transport (T3, the preferred substrate, plus
    T4 and reverse-T3) across the plasma membrane, with conjugated steroids
    (estrone 3-sulfate, estradiol-17-beta-glucuronide), the bile acid taurocholate
    and prostaglandin E2 as additional substrates. OATP4A1 most likely acts as an
    electroneutral organic anion exchanger (antiporter) rather than a Na+- or
    ATP-coupled transporter.
