- id: PMID:27219064
  title: Centriolar CPAP/SAS-4 Imparts Slow Processive Microtubule Growth.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected original Methods/Results/Discussion/captions read
      in the bounded core consultation. Human PN2-3, engineered CPAPmini with a yeast
      GCN4 zipper, larger constructs and full-length cellular tests remain distinct.
      Slower growth plus catastrophe suppression/rescue supports controlled microtubule
      incorporation, not universal numerical full-length kinetics.
- id: PMID:27306797
  title: Molecular basis for CPAP-tubulin interaction in controlling centriolar and
    ciliary length.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected original Methods/Results/Discussion/captions read
      in the bounded core consultation. Human PN2-3EX121–1060 and isolated PN2-3 behave
      differently; human cellular and fly Sas-4 experiments remain distinguished.
      The paper explicitly cautions that fragment sequestration/depolymerization does
      not represent full-length cellular function.
core_functions:
- description: Binds tubulin and coordinates its controlled incorporation into centriolar
    microtubules during centriole replication and elongation. PN2-3-mediated tubulin
    recognition acts with assembly-partner interactions in building the centriole/basal-body
    system. Engineered fragments and larger constructs can have different effects
    on growth, so this core does not assign universal polymerase or depolymerase activity.
  molecular_function:
    id: GO:0015631
    label: tubulin binding
  directly_involved_in:
  - id: GO:0061511
    label: centriole elongation
  locations:
  - id: GO:0005814
    label: centriole
  - id: GO:0036064
    label: ciliary basal body
  in_complex:
    id: GO:0120099
    label: procentriole replication complex
  supported_by:
  - reference_id: PMID:27219064
    supporting_text: 'CPAP activity dampens microtubule growth and

      stabilizes microtubules by inhibiting catastrophes and promoting rescues.'
suggested_questions:
- question: Does the 1086-residue alternative product support centriole construction
    in human cells despite its altered/truncated C-terminal STIL-binding region, and
    which interactions depend on the retained versus lost sequence?
- question: How do full-length CPAP concentration, assembly partners and tubulin state
    reconcile slower growth/plus-end stabilization with growth enhancement seen for
    particular extended constructs?
- question: What is the molecular composition of the native CPAP-associated gamma-tubulin
    complex, and does CPAP directly contact gamma-tubulin or another complex subunit?
- question: Which endogenous genes and cell types require CPAP as a STAT5 coactivator,
    separately from indirect effects of centriole disruption?
- question: Which primary CPAP experiments, if any, specifically establish regulation
    of mitotic spindle organization or positive spindle assembly beyond aster nucleation
    and centriole construction?
suggested_experiments:
- description: Compare sequence-verified human products Q9HC77-1 and Q9HC77-2 in matched
    endogenous-replacement experiments, measuring centriole number/length, STIL recruitment,
    tubulin incorporation and ciliation at comparable expression.
- description: Reconstitute tubulin dynamics with matched full-length CPAP, PN2-3
    fragments and larger extended constructs across concentration ranges, adding STIL/CEP135
    separately and measuring growth, catastrophe, rescue and soluble tubulin occupancy.
- description: Combine native complex purification and reciprocal crosslinking/mass
    spectrometry with defined-component binding to distinguish CPAP gamma-tubulin
    association from small-complex stoichiometry or direct contact.
- description: Perturb CPAP acutely in a STAT5-responsive human cellular system while
    controlling for cell-cycle/centriole effects, then measure endogenous STAT5 occupancy
    and transcription alongside reporter activity.
status: COMPLETE
