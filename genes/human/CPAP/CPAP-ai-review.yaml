    - PMID:22020124
- term:
    id: GO:0007099
    label: centriole replication
  evidence_type: IMP
  original_reference_id: PMID:17681131
  qualifier: involved_in
  review:
    summary: CPAP contributes to human procentriole formation.
    action: ACCEPT
    reason: PMID:17681131 publisher-indexed Results and the separate original-author
      thesis show that CPAP depletion blocks Myc-Plk4-induced procentriole formation
      in U2OS cells and localize endogenous CPAP to the nascent structure. These findings
      combine necessity with structural placement; antibody-production fragments are
      not mistaken for functional isoform constructs.
- term:
    id: GO:0007099
    label: centriole replication
  evidence_type: IMP
  original_reference_id: PMID:22020124
  qualifier: involved_in
  review:
    summary: CPAP is required within the STIL-dependent procentriole assembly system.
    action: ACCEPT
    reason: Actual PMID:22020124 human CPAP depletion suppresses GFP-STIL-induced
      centriole amplification, alongside direct interaction and complex evidence.
      CPAP performs structural/tubulin-binding work in that assembly system; the outcome
      is not interpreted as CPAP catalyzing STIL or Plk4 activation.
- term:
    id: GO:0008275
    label: gamma-tubulin small complex
  evidence_type: NAS
  original_reference_id: PMID:11003675
  qualifier: part_of
  review:
    summary: The original study supports a gamma-tubulin-associated complex of unresolved
      precise composition.
    action: MODIFY
    reason: PMID:11003675 reports reciprocal endogenous CPAP/gamma-tubulin co-immunoprecipitation
      in SiHa cells and cosedimentation in gamma-tubulin-enriched Molt4 fractions
      (Results and Figure 7). Together these support a native gamma-tubulin-containing
      multiprotein complex at the broad GO:0000930 scope. They do not establish the
      defined small-complex composition, canonical gamma-TuRC membership, fixed stoichiometry,
      or direct CPAP–gamma-tubulin contact. The Discussion explicitly leaves precise
      composition unexamined. Those limits motivate generalizing GO:0008275, rather
      than discarding the positive complex evidence; the complex-membership judgment
      does not depend on an ordinary source qualifier.
    proposed_replacement_terms:
    - id: GO:0000930
      label: gamma-tubulin complex
