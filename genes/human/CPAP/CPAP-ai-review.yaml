  original_reference_id: PMID:12198240
  qualifier: enables
  review:
    summary: CPAP augments STAT5-dependent transcription in a defined reporter system.
    action: KEEP_AS_NON_CORE
    reason: The original PMID:12198240 Methods and Results test human CPAP residues
      5–1338, called full-length in the paper, with mouse Stat5a/b in human cells.
      Co-IP, hormone-dependent nuclear accumulation and increased STAT5-response-element
      reporter activity support the existing coactivator assignment. Equivalent JAK2
      and phospho-STAT5 controls do not establish upstream kinase activation or an
      endogenous target-gene mechanism. This context-specific activity is retained
      outside the principal centriole-construction core.
    supported_by:
    - reference_id: PMID:12198240
      supporting_text: CPAP was found to augment Stat5-mediated transcription.
