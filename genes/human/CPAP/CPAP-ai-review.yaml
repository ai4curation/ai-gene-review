- term:
    id: GO:0007020
    label: microtubule nucleation
  evidence_type: TAS
  original_reference_id: PMID:11003675
  qualifier: involved_in
  review:
    summary: The original reconstitution measures microtubule nucleation by isolated
      centrosomes.
    action: MODIFY
    reason: PMID:11003675 uses centrosomes isolated from nocodazole-treated human
      Molt4 cells with bovine brain tubulin. Anti-CPAP reduces aster number and microtubule
      length, with normal IgG, anti-gamma-tubulin and centrosome-free controls. This
      supports microtubule nucleation by a microtubule organizing center (GO:0051418).
      The assay does not establish the spindle-pole context required for astral microtubules
      (GO:0000235), and does not show autonomous nucleation by purified CPAP. Each
      original source assertion is preserved even where reviewed replacements converge.
    proposed_replacement_terms:
    - id: GO:0051418
      label: microtubule nucleation by microtubule organizing center
