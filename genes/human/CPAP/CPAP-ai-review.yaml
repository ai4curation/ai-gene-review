id: Q9HC77
gene_symbol: CPAP
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPAP is a centrosomal and centriolar protein that binds tubulin and organizes
  its incorporation during centriole construction. Its PN2-3 region recognizes tubulin,
  while coiled-coil and C-terminal interactions connect this activity to the centriolar
  assembly machinery, including STIL and CEP135. Reconstitution and cellular experiments
  support control of microtubule growth and centriole length, with the direction of
  the growth effect depending on the construct and assay. CPAP also associates with
  gamma-tubulin-containing complexes and contributes to centrosomal aster formation.
  Human CPAP has shown STAT5 coactivator activity in a defined reporter system. Pathogenic
  variants can disrupt centriole formation and cause primary microcephaly or Seckel
  syndrome.
