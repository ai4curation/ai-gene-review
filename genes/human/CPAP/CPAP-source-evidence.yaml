  date: '2026-10-12'
  assembly_method: Manual source-specific reassessment using unchanged original source objects, existing
    primary caches and separately recovered originals; ontology definitions retrieved from QuickGO.
  gamma_complex:
    source: PMID:11003675
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC86375/
    locators:
    - 'Materials and Methods: centrosome isolation and microtubule nucleation assay'
    - 'Results: CPAP is associated with the gamma-tubulin complex; Figure 7 caption'
    - 'Discussion: precise composition of the CPAP/gamma-tubulin complex remains unexamined'
    interpretation: Native reciprocal co-IP and gamma-enriched cosedimentation support broad GO:0000930;
      GO:0008275 small-complex composition, canonical TuRC membership and direct contact remain unestablished.
  nucleation:
    source: PMID:11003675
    original_terms:
    - GO:0007020
    - GO:0030954
    effective_term: GO:0051418
    ontology_urls:
    - https://www.ebi.ac.uk/QuickGO/term/GO:0051418
    - https://www.ebi.ac.uk/QuickGO/term/GO:0000235
    interpretation: Isolated Molt4 centrosomes plus bovine brain tubulin establish MTOC-mediated nucleation;
      an aster shape alone does not establish a spindle astral-microtubule context.
  integrated_core:
    core_process: GO:0061511
    existing_elongation_process: GO:0061511
    typed_relation: GO:0061511 part_of GO:0007099
    interpretation: Centriole elongation is the single specific core process, with the actual part_of
      relation to centriole replication retained explicitly. The broader replication role remains in the
      biological description and accepted annotations. This supersedes the previous choice of the broader
      process as the core term. Ciliary assembly remains accepted at the conserved centriole/basal-body
      construction scope, not as autonomous axonemal-tip polymerization.
    sources:
    - PMID:17681131
    - PMID:22020124
    - PMID:27306797
