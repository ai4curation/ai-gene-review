interpretation:
- Q96M96-1 is the displayed766aa sequence with a complete annotated DH206–393/PH1422–521 module.
- Q96M96-2 combines canonical249–514 with a14aa alternative tail. It omits the N-terminal region and parts of the
  annotated DH and PH1 domains; retained sequence does not prove a folded active module.
- Q96M96-3 has188aa after its official replacement/deletion edits and lacks a complete annotated DH domain.
- Rat1–297/1–249 experimental truncations and human disease-associated transcript predictions in PMID17564959 are
  not the recorded human280/188aa splice products.
- Additional transcript predictions in that paper are not silently equated with official isoform identifiers.
- Full-length UniProt CHAIN metadata is not evidence for natural proteolytic processing.
functional_product_assertions: []
source_context_scope: All25 imported GOA contexts identify parent Q96M96. No row is remapped to a natural splice
  product. Reconstructed sequence identity does not establish protein stability or biological activity.
experimental_boundary: PMID17564959 explicitly uses rat full-length Frabin-GFP and engineered1–297/1–249 fragments;
  these are not the human280/188-residue natural products.
