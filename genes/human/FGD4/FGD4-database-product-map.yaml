  scope: Three natural splice seed objects exactly match official text and JSON identifiers and VAR_SEQ references.
    Sequences are independently reconstructed from the official JSON edits; no separate isoform FASTA was acquired.
    Parent GOA remains unassigned to specific products; no functional product classes or experimental cleavage boundary
    are inferred.
  official_source: https://rest.uniprot.org/uniprotkb/Q96M96.json
interpretation:
  canonical: Q96M96-1 is 766 residues, with the complete annotated DH, two PH and FYVE domains.
  Q96M96-2: The 280-residue sequence retains canonical residues 249–514 followed by a 14-residue alternative tail.
    It retains only part of the canonical DH region and much of PH1; an intact catalytic fold or activity is not
    established.
  Q96M96-3: The 188-residue sequence lacks the complete canonical DH–PH architecture. No measured activity or stability
    is assigned.
  experimental_constructs: Rat full-length Frabin-GFP and engineered 1–297/1–249 constructs in PMID:17564959 are
    not the human 280/188-residue natural products. Human FGD1 residues 330–710 in PMID:8969170 are a different
    gene and construct.
