core_functions:
- description: Promotes guanine-nucleotide exchange in CDC42 signaling through its DH–PH module. Conserved family
    placement, domain evidence and curated CDC42 exchange-factor membership support this molecular role; target
    and ortholog cellular studies connect frabin to actin-rich protrusions. The intact full-length architecture
    is distinguished from short natural splice products and engineered truncations, whose catalytic competence is
    not assumed.
