id: Q96M96
gene_symbol: FGD4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGD4 encodes frabin, a cytoskeletal and membrane-associated regulator of CDC42 signaling. Its full-length
  protein combines an N-terminal actin-associated region with a DH exchange-factor domain, two PH domains and a
  FYVE zinc finger. Frabin links small-GTPase activation to actin-rich protrusions and cell shape, with an important
  role in peripheral nerve biology. Biallelic pathogenic variants cause the demyelinating neuropathy Charcot-Marie-Tooth
  disease type 4H. Alternative splicing also produces shorter transcripts whose protein activities remain poorly
  characterized.
