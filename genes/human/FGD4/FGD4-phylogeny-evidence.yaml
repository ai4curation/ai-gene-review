limitations:
- The complete canonical target sequence and its node ancestry are verified; experimental interpretation is separate.
- A descendant target appearing in its own donor list is expected. Donor count is not an evidential objection.
- The target protein has distinct N-terminal architecture and subcellular targeting from FGD1; a shared catalytic
  clade does not establish every paralog localization.
- No activity or localization is assigned to the two truncated natural products from canonical sequence alignment
  alone.
