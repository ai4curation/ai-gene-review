id: O00255
gene_symbol: MEN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MEN1 encodes menin, a 610-amino-acid, predominantly nuclear scaffold protein without a recognized
  enzymatic or sequence-specific DNA-binding domain. Its structure resembles a curved hand with a deep
  central pocket that binds short motifs of partner proteins. Through this pocket menin binds the N-terminus
  of the H3K4 methyltransferases KMT2A/MLL1 and KMT2B/MLL2, and with MLL1 forms a composite surface for
  the chromatin-anchoring protein LEDGF/PSIP1. As a subunit of MLL1/MLL2 complexes it targets H3K4 methylation
  to genes such as the HOX cluster, CDKN1B (p27) and CDKN2C (p18), acting as a transcriptional coactivator;
  MLL fusion oncoproteins depend on this interaction, which is the target of menin-MLL inhibitors in acute
  leukemia. The same pocket binds the AP-1 factor JunD, where menin blocks JNK-mediated JunD phosphorylation
  and represses JunD-driven transcription; menin also represses NF-kB (RELA) and TERT transcription and
  acts as a cofactor for SMAD3 in TGF-beta signaling. Menin binds double-stranded and branched DNA in
  a sequence-independent manner through basic residues of its C-terminal nuclear localization signals.
  It also takes part in DNA damage responses, relocating to chromatin after UV irradiation and associating
  with FANCD2. Germline loss-of-function mutations cause multiple endocrine neoplasia type 1, with tumors
  of the parathyroid, pancreatic islets and anterior pituitary.
