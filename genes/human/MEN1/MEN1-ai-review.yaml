core_functions:
- description: Scaffold subunit of MLL1/MLL2 (KMT2A/KMT2B) H3K4 methyltransferase complexes. Menin binds
    the MLL1/MLL2 N-terminal menin-binding motif in its central pocket and, together with MLL1, forms
    the binding surface for the chromatin anchor LEDGF/PSIP1, so that the methyltransferase complex is
    tethered to target loci (HOX genes, CDKN1B, CDKN2C, GATA3). This activity drives target-gene activation
    and is required by MLL fusion oncoproteins.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0045815
    label: transcription initiation-coupled chromatin remodeling
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0044665
    label: MLL1/2 complex
  supported_by:
  - reference_id: PMID:22327296
    supporting_text: Our findings also provides concrete evidence that menin acts as a scaffold protein
      to assemble a menin-MLL1-LEDGF ternary complex to coordinating gene transcription
  - reference_id: PMID:22327296
    supporting_text: menin promotes gene transcription by binding the transcription activator MLL1 through
      the peptide pocket while still interacting with the chromatin-anchoring protein LEDGF at a distinct
      surface formed by both menin and MLL1.
  - reference_id: PMID:17500065
    supporting_text: Menin is shared by MLL and MLL2 complexes only
  - reference_id: PMID:15199122
    supporting_text: Abrogation of menin expression phenocopies loss of MLL and reveals a critical role
      for menin in the maintenance of Hox gene expression.
  - reference_id: PMID:16239140
    supporting_text: oncogenic MLL fusion proteins retain an ability to stably associate with menin through
      a high-affinity, amino-terminal, conserved binding motif
- description: Transcription coactivator for DNA-binding factors whose targets need MLL-dependent H3K4
    methylation, for example the c-Myb/GATA-3 complex at the GATA3 locus and the CDK inhibitor genes p27Kip1
    and p18Ink4c. Menin itself binds DNA only sequence-independently; the sequence-specific partners determine
    which loci are targeted.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:15640349
    supporting_text: Menin activates transcription by means of a mechanism involving recruitment of MLL
      to the p27Kip1 and p18Ink4c promoters and coding regions.
  - reference_id: PMID:20484083
    supporting_text: c-Myb, GATA-3, and Menin form a core transcription complex that regulates GATA-3
      expression
  - reference_id: PMID:15331604
    supporting_text: Here we show that menin directly binds to double stranded DNA in a sequence-independent
      manner.
- description: Transcription corepressor of AP-1 (JunD) and NF-kB (RELA). The JunD menin-binding motif
    occupies the same pocket that binds MLL1; bound menin blocks JNK-mediated JunD phosphorylation and
    represses JunD-driven transcription, including at the TERT promoter.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:22327296
    supporting_text: The menin-JUND interaction blocks JUN N-terminal kinase (JNK)-mediated JUND phosphorylation
      and suppresses JUND-induced transcription.
  - reference_id: PMID:9989505
    supporting_text: Menin repressed transcriptional activation mediated by JunD fused to the Gal4 DNA-binding
      domain from a Gal4 responsive reporter, or by JunD from an AP1-responsive reporter.
  - reference_id: PMID:11526476
    supporting_text: Menin represses p65-mediated transcriptional activation on NF-kappaB sites in a dose-dependent
      and specific manner.
  - reference_id: PMID:12837246
    supporting_text: The third, the tumor suppressor Menin, is a direct repressor of hTERT.
suggested_questions:
- question: Does menin's sequence-independent dsDNA binding through its C-terminal NLS region contribute
    to recruiting or stabilizing MLL1/MLL2 complexes on chromatin in cells, or is targeting determined
    entirely by LEDGF and DNA-binding partners?
- question: Should UniProt's mouse menin GO:0001216 IDA (PMID:14992727), which Ensembl Compara projects
    to human, be reannotated as transcription coactivator activity, given that the paper shows recruitment
    of methyltransferase activity rather than sequence-specific DNA binding?
- question: How is the choice between menin's coactivator (MLL1/MLL2) and corepressor (JunD) roles regulated
    in a given cell, given that both partners compete for the same pocket?
suggested_experiments:
- hypothesis: Menin's chromatin occupancy depends on partner proteins rather than on its own DNA binding.
  description: Compare genome-wide menin occupancy (CUT&RUN) in cells expressing wild-type menin, NLS1/NLS2
    point mutants that lose dsDNA binding but stay nuclear, and pocket mutants that cannot bind MLL1/JunD,
    with and without LEDGF depletion or menin-MLL inhibitor treatment.
  experiment_type: genomics
- hypothesis: Menin has no intrinsic sequence preference for DNA.
  description: Run protein-binding microarray or HT-SELEX with purified full-length menin, with and without
    MLL1 N-terminal peptide, to test for any enriched motif beyond the sequence-independent binding reported
    in gel-shift assays.
  experiment_type: binding assay
