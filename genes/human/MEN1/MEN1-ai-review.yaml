  review:
    summary: PAINT propagation of transcription cis-regulatory region binding, seeded by mouse and human
      ChIP-based annotations.
    action: MARK_AS_OVER_ANNOTATED
    reason: Menin is found at specific regulatory regions (Hoxc8, CDKN1B, CDKN2C, GATA3) by ChIP, but
      its own DNA binding is sequence-independent and its targeting is attributed to DNA-binding partners
      (JunD, c-Myb/GATA-3, SMADs) and to the MLL1-LEDGF chromatin anchor. GO:0000976 asserts binding to
      a specific regulatory DNA sequence by the gene product, which overstates what menin does; its activity
      at these regions is better described by transcription coactivator/corepressor and adaptor terms.
      The IBA node inherits this interpretation of ChIP occupancy rather than evidence of sequence-specific
      binding.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000976222
        comment: Menin-family ancestral node. Menin descendants carry this term from ChIP occupancy at
          target loci; the related biology (recruitment to regulatory regions) is sound, but the term
          assigns sequence-specific regulatory-DNA binding to a protein that binds DNA only sequence-independently
          and is targeted by partners.
        source_status: SOURCE_WEAK_OR_INFERRED
      - source_id: MGI:MGI:1316736
        comment: Mouse menin descendant evidence is locus-occupancy (ChIP) data, which shows a menin-containing
          complex at regulatory regions rather than sequence-specific DNA binding by menin.
        source_status: SOURCE_WEAK_OR_INFERRED
      - source_id: UniProtKB:O00255
        comment: Human menin ChIP-based annotations (e.g. PMID:20484083) are among the descendant evidences;
          the same scoping issue applies.
        source_status: SOURCE_WEAK_OR_INFERRED
