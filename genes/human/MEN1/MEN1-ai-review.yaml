- term:
    id: GO:0001216
    label: DNA-binding transcription activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:O88559
  - ensembl:ENSMUSP00000058149
  review:
    summary: Ensembl Compara transfer of DNA-binding transcription activator activity from mouse menin
      O88559. The mouse source row is GO:0001216 IDA PMID:14992727 assigned by UniProt (QuickGO, 2026-10-24);
      Hughes et al. 2004 show menin in an MLL2/Ash2L H3K4 methyltransferase complex, ChIP at Hoxc8, and
      loss of Hoxc6/Hoxc8 expression in Men1-null cells.
    action: MODIFY
    reason: Menin has no sequence-specific DNA-binding domain. Its only demonstrated direct DNA binding
      is sequence-independent (dsDNA and branched structures, via basic NLS residues), and locus targeting
      depends on DNA-binding partners and the MLL1-LEDGF chromatin anchor. The source paper shows menin
      activates Hox transcription by recruiting histone methyltransferase activity, i.e. a coactivator,
      not a DNA-binding transcription factor. The essence (menin activates transcription of target genes)
      is sound, so the term is replaced by transcription coactivator activity, which captures menin's
      activity in MLL-dependent activation of Hox, CDKN1B/CDKN2C and GATA3.
    proposed_replacement_terms:
    - id: GO:0003713
      label: transcription coactivator activity
    supported_by:
    - reference_id: PMID:14992727
      supporting_text: menin activates the transcription of differentiation-regulating genes by covalent
        histone modification
    - reference_id: PMID:14992727
      supporting_text: Chromatin immunoprecipitation experiments reveal that menin is bound to the Hoxc8
        locus.
    - reference_id: PMID:15640349
      supporting_text: Menin has been shown to bind nonspecifically to DNA; however, the mechanisms responsible
        for its recruitment to specific chromosomal sites are not known.
    - reference_id: PMID:15331604
      supporting_text: These results indicate that menin not only binds to DNA in a non-sequence specific
        fashion
    - reference_id: PMID:15640349
      supporting_text: Menin activates transcription by means of a mechanism involving recruitment of
        MLL to the p27Kip1 and p18Ink4c promoters and coding regions.
    - reference_id: PMID:20484083
      supporting_text: c-Myb, GATA-3, and Menin form a core transcription complex that regulates GATA-3
        expression
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:O88559
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0001216
      corrected_value: GO:0003713
      corrected_label: transcription coactivator activity
      confidence: PROBABLE
      explanation: Mouse menin (O88559) carries GO:0001216 DNA-binding transcription activator activity,
        IDA, PMID:14992727, assigned by UniProt; Ensembl Compara projects it to human O00255. PMID:14992727
        shows menin co-purifying with an MLL2/Ash2L H3K4 methyltransferase complex, binding to the Hoxc8
        locus by ChIP, and loss of Hoxc6/Hoxc8 expression in Men1-null cells; it does not show sequence-specific
        DNA binding by menin. Menin binds DNA only sequence-independently (PMID:15331604) and acts as
        a coactivator/scaffold that brings MLL methyltransferase activity to target genes. GO:0003713
        transcription coactivator activity (or GO:0030674 protein-macromolecule adaptor activity) fits
        the evidence.
      supported_by:
      - reference_id: PMID:14992727
        supporting_text: menin activates the transcription of differentiation-regulating genes by covalent
          histone modification
      - reference_id: PMID:15331604
        supporting_text: These results indicate that menin not only binds to DNA in a non-sequence specific
          fashion
