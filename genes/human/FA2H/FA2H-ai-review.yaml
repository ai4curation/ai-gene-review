core_functions:
- description: Hydroxylates free fatty acids at carbon 2 to produce (R)-2-hydroxy acyl precursors for
    sphingolipid synthesis in the ER membrane. Human FA2H-expressing microsomes directly convert free
    C24 acid, and cellular human FA2H produces R-2-hydroxypalmitate. The N-terminal cytochrome-b5 heme-binding
    domain is an integral facet of the enzyme; domain deletion impairs the human microsomal reaction,
    while heme occupancy and physiological electron-transfer partners are not directly resolved by that
    assay. Conserved rodent lipid experiments connect the performed precursor step to hydroxylated GalCer
    and selected GlcCer species and to CNS myelin maintenance, without assigning downstream glycosyltransferase
    chemistry or equal activity to the natural 159-residue product.
