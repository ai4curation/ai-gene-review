    hydroxylated sphingolipids supplied entirely through free-fatty-acid hydroxylation and subsequent
    acyl incorporation under the tested conditions?
- question: Which hydroxylated acyl-chain species and cell-specific precursor pathways account for long-term
    myelin maintenance and for the different FA2H dependence of whole-skin versus epidermal glucosylceramides?
suggested_experiments:
- hypothesis: The natural 159-residue product may differ from displayed FA2H in abundance, localization
    or catalytic competence; sequence deletion alone does not determine which properties are retained.
  description: Combine isoform-resolved transcript analysis with product-specific targeted proteomics,
    then compare sequence-verified 372-residue and 159-residue constructs at matched abundance. Measure
    ER-marker colocalization, membrane association, stability, heme association and isotope-labelled free-fatty-acid
    product formation with vector and inactive-enzyme controls. Include the Met93-start construct as a
    separate experimental comparator.
  experiment_type: Product-resolved expression, localization and enzyme assays
- hypothesis: Direct free-fatty-acid turnover can be distinguished from direct ceramide-bound turnover
    and from downstream incorporation by following the labelled substrate and immediate product in a defined
    reaction.
  description: Compare matched isotope-labelled free fatty acids and ceramides in a reconstituted human
    FA2H membrane system with defined electron supply. Verify substrate presentation, monitor free-acid
    release, and resolve immediate products by LC-MS before adding downstream acyl-incorporation enzymes.
    Use inactive FA2H and enzyme-free controls to distinguish hydroxylation from hydrolysis or later lipid
    synthesis.
  experiment_type: Defined substrate-turnover and isotope-tracing assays
- hypothesis: Cell-specific supply and incorporation of hydroxylated acyl species may explain why FA2H
    loss affects selected skin lipids and later myelin integrity differently.
  description: Trace labelled free fatty acids into defined ceramide, GalCer and GlcCer species after
    conditional FA2H depletion and rescue in myelinating glial cultures and separately in sebaceous and
    epidermal models. Compare early lipid flux with later membrane organization and myelin integrity,
    using measured FA2H activity and matched cell-state controls to distinguish precursor supply from
    downstream glycosylation or secondary tissue damage.
  experiment_type: Cell-type-resolved lipid flux and conditional rescue
