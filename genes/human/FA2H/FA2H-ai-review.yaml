id: Q7L5A8
gene_symbol: FA2H
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FA2H is an endoplasmic-reticulum membrane fatty acid 2-hydroxylase that converts free fatty
  acids to their (R)-2-hydroxy derivatives. The displayed 372-residue protein combines an N-terminal cytochrome-b5
  domain with a membrane-associated hydroxylase domain. Its reaction supplies hydroxylated acyl precursors
  for ceramides and their galactosylceramide and glucosylceramide derivatives. Production of these lipids
  supports long-term myelin maintenance; mouse loss-of-function studies distinguish this role from initial
  myelin formation and show tissue-dependent effects on skin glucosylceramides. The human gene also encodes
  a distinct 159-residue natural product lacking residues 1–213 of the displayed sequence.
