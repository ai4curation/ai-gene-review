gene: CYP11B2
accession: UniProtKB:P19099
scope: Compact source guide for the 55 existing assertions. Original source fields, including the cortisol
  NOT assertion and the literal donor identities, are retained. Experimental constructs and processed
  chains are distinguished from official products. This file is a reviewer-authored locator and access
  guide, not a second annotation source or a schema-defined review document.
identity_and_products:
  official_record: https://www.uniprot.org/uniprotkb/P19099/entry
  sequence: https://rest.uniprot.org/uniprotkb/P19099.fasta
  conclusion: One 503-residue precursor is recorded, with a targeting segment at 1–24 and processed chain
    at 25–503; no alternative-product declaration is present. Processing is not a second splice product.
    Historical hybrid genes, engineered recombinant proteins and clinical variants are separate experimental
    entities.
source_selection:
  repository_sources:
  - CYP11B2-uniprot.txt
  - CYP11B2-goa.tsv
  - ../../../publications/PMID_15356073.md
  - ../../../publications/PMID_9814482.md
  conclusion: Existing publication caches and machine sources were preserved. A normal re-fetch backfilled
    supporting entities in 22 of the 55 rows without changing the other pre-existing source fields. Manual
    original access can be fuller than the unchanged publication cache; the access accounts below distinguish
    them.
owner_primary_accounts:
- reference: PMID:15356073
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC1283128/
  location: Methods; Results for cell incubations and human metabolite experiments; Discussion
  access: Full cached main text; selected complete scientific paragraphs read, without figure pixels or
    supplements.
  conclusion: CYP11B2-transfected V79 cells converted cortisol to 18-hydroxycortisol and 18-oxo-cortisol.
    These measurements support secondary cortisol metabolism, not cortisol synthesis. Human urinary-metabolite
    experiments are contextual; a specific extra-adrenal enzyme location is not established by those observations.
- reference: PMID:9814482
  original: https://pubmed.ncbi.nlm.nih.gov/9814482/
  location: Complete abstract
  access: Abstract-only cache; no full original read claimed.
  conclusion: CYP11B1/CYP11B2 hybrid constructs and substitutions alter 18-oxygenation. They are not official
    CYP11B2 splice products and are not substituted for wild-type CYP11B2 biochemical evidence.
- reference: PMID:19342457
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC2703558/
  location: Cell culture and adenovirus Methods; Results and captions for Figures 2 and 6; Discussion
  access: Original indexed main-text windows; the preserved normal cache is abstract-only. No figure pixels
    or supplement read.
  conclusion: Human H295R cells show potassium- and angiotensin-II-responsive CYP11B2 expression. NRSF
    perturbation changes CYP11B1, CYP11B2 and steroid secretion together; it does not isolate a CYP11B2-specific
    cortisol-producing step.
- reference: PMID:14614232
  original: https://pubmed.ncbi.nlm.nih.gov/14614232/
  location: Complete abstract
  access: Abstract-only; attempted publisher access did not recover full text.
  conclusion: Human G435S CYP11B2 deficiency and reduced 18-hydroxylase/oxidase activity are explicit.
    The blood-volume endpoint is unverified in the accessed text; established aldosterone physiology supports
    conservative retention of that context.
- reference: PMID:9838244
  original: https://pubmed.ncbi.nlm.nih.gov/9838244/
  location: Complete abstract
  access: Abstract-only; attempted publisher access did not recover full text.
  conclusion: Low sodium, elevated potassium, salt wasting and the historical codon-173 deletion are reported
    directly. No additional full-text clinical measurement or untested mapping of the historical variant
    to the current sequence is asserted.
- reference: PMID:34800366
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC8664129/
  table: https://ars.els-cdn.com/content/image/1-s2.0-S1550413121005295-mmc2.xlsx
  location: MitoCoP construction Methods/Results; Table S1 sheet A Excel row 284 and sheet B Excel row
    257
  access: Selected full-text main passages and exact original workbook entries; no figure pixels.
  conclusion: P19099/CYP11B2 is NotID_130 and enters MitoCoP through literature pool 4. Experimental identified/validated
    fields are empty. The target's mitochondrial membership is supported, but direct experimental detection
    by this study is not claimed.
paint:
  family: PANTHER:PTHR24279
  tree: https://www.pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR24279
  alignment: https://www.pantherdb.org/services/oai/pantherdb/familymsa?family=PTHR24279
  ancestral_evidence: https://data.pantherdb.org/ftp/downloads/paint/current/IBD.gaf
  conclusion: The current family has 165 nodes. Its human leaf PTN002517924 reconstructs the exact 503-residue
    sequence along a 14-node path. All eight relevant current IBDs lie on that path, with no target-path
    IRD or IKR loss record. The principal nodes are PTN001547321 and PTN001547324. Seed donor sets and
    current GAF donor sets are retained as distinct versions; self evidence is not treated as circularity.
  biological_scope: Broad glucocorticoid, cortisol-metabolic and cholesterol-pathway assertions are retained
    as secondary or contextual biology. The pathway judgment does not assert direct cholesterol binding,
    side-chain cleavage or homeostatic control.
donors:
  query: https://www.ebi.ac.uk/QuickGO/annotations
  conclusion: Nineteen complete UniProt-keyed queries yielded 562 records and 134 same-term joins across
    nine source rows. MOD identifiers were resolved through official cross-references. Zero results from
    literal MOD-identifier queries were not interpreted as evidence absence. The inner-membrane donor
    P14137 is rat Cyp11a1, a paralog, not a bovine CYP11B ortholog. Human CYP11B2 localization also has
    independent support. These database joins do not constitute reads of every donor paper. The GO_REF:0000024
    ortholog-transfer premise does not fit this paralog donor; propagation flags identify that method
    mismatch while preserving the experimentally supported donor location and independently supported
    target compartment.
  identity_locator: https://www.uniprot.org/uniprotkb/P14137/entry
