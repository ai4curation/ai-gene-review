reactome:
  normal_steps:
  - event: R-HSA-194017
    url: https://reactome.org/content/detail/R-HSA-194017
    scope: Deoxycorticosterone to corticosterone; catalyst 5600617, GO0004507, entity 194019/P19099.
  - event: R-HSA-193995
    url: https://reactome.org/content/detail/R-HSA-193995
    scope: Corticosterone to 18-hydroxycorticosterone; the precise GO0047783 reaction.
  - event: R-HSA-193965
    url: https://reactome.org/content/detail/R-HSA-193965
    scope: 18-hydroxycorticosterone to aldosterone; final 18-oxidation, not the preceding hydroxylation
      alone.
  pathways:
  - https://reactome.org/content/detail/R-HSA-193993
  - https://reactome.org/content/detail/R-HSA-211976
  failed_reactions:
  - R-HSA-5600598
  - R-HSA-6785244
  - R-HSA-6785245
  conclusion: Exact catalyst/entity/reference paths connect each event to human P19099. Entity 194019
    represents processed chain 25–503 at the mitochondrial inner membrane. Matrix metabolites do not imply
    a soluble matrix enzyme. The three FailedReaction models link to normal steps and a seven-member disease-variant
    set; they are not successful catalytic assays for every mutant.
gocam_and_interactions:
  conclusion: The selected GO-CAM gene index has no P19099 target activity. No new process assertion is
    inferred from that absence. The 55 seeded objects contain no generic protein-binding assertion requiring
    a partner-class audit.
chemistry_original_accounts:
- reference: PMID:1741400
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC48470/
  location: Original pages 1458–1462, Methods, Table 1 and Figures 3–4
  access: Independent consultation read complete page scans; owner read the normal abstract and fixed
    scientific recommendations. During the finite follow-up, the owner additionally inspected original
    page 1460 Methods and page 1461 Table 1/Results/Discussion and Figure 4 pixels.
  conclusion: Human full coding-region CYP11B2 expressed in COS7 mitochondrial fractions produced corticosterone,
    aldosterone and cortisol from the appropriate substrates. Table 1 cortisol formation from 11-deoxycortisol
    is 392.5 ± 18.5 pmol/mg. Biochemical range is distinct from predominant physiological cortisol production.
- reference: PMID:2256920
  original: https://doi.org/10.1016/s0006-291x(05)81058-7
  location: Complete abstract
  access: Full original not recovered.
  conclusion: The human 503-residue cDNA and positive sequential aldosterone production after COS7 expression
    are explicit in the abstract; finer uninspected assay details are not claimed.
- reference: PMID:23322723
  original: https://pmc.ncbi.nlm.nih.gov/articles/PMC5417327/
  location: Original Methods, substrate-turnover Results and Table 1
  access: Independent consultation read original scientific text; normal cache is abstract-only. During
    the finite follow-up, the owner additionally read the saved original construct/assay Methods, Table
    1 and selected complete turnover Results/Discussion.
  conclusion: Purified human CYP11B2 with human Adx/AdR directly processes deoxycorticosterone and 11-deoxycortisol.
    The construct starts at residue 30 with engineered MAKKTSS and a C-terminal His tag; it is distinct
    from the native processed chain and from a splice isoform. The time course releases intermediates,
    precluding a claim of universal uninterrupted processivity.
- reference: PMID:9703385
  original: https://doi.org/10.1530/eje.0.1390096
  location: Complete abstract and recovered indexed Results
  access: Incomplete full-original access.
  conclusion: Normal cortisol/precursor levels in the patients support physiological dispensability for
    maintaining those levels, but do not settle an unconditional absence of cortisol-forming chemistry.
    The original NOT field remains intact with UNDECIDED scope.
- reference: PMID:11856349
  original: https://doi.org/10.1046/j.1432-1033.2002.02729.x
  location: Abstract and selected original assay/construct passages
  access: Independent consultation read recovered indexed original passages; direct publisher routes failed.
  conclusion: Engineered substitutions and the wild-type comparator are kept separate. Historical Ser249
    construct variation is compatible with the current displayed sequence; bovine adrenodoxin in this
    COS1 assay is distinguished from the human partners in the 2013 purified system.
reaction_precision:
  corticosterone_18_hydroxylation: GO:0047783; RHEA:11872
  subsequent_18_oxidation: RHEA:50792; separately described from the GO0047783 definition
  core_encoding: 'Three distinct catalytic units share the existing aldosterone-biosynthesis output: two
    existing GO MFs and a proposed term for final 18-oxidation. Heme is a cofactor, not an additional
    unit. No NEW annotation is added.'
  final_reaction_locator: https://www.rhea-db.org/rhea/50792
  final_reaction_scope: The net reaction reduces O2 to water while oxidizing the C18 hydroxymethyl group.
    GO:0016705 is the proposed paired-donor redox parent; GO:0047783 describes the preceding reaction
    only. Rhea has no GO MF mapping in the inspected record; targeted QuickGO and OLS searches found no
    precise final-reaction term.
  cortisol_formation:
    rhea: https://www.rhea-db.org/rhea/46100
    verified_source: CYP11B2-uniprot.txt; official P19099 catalytic activity, supported by actual human
      turnover in PMID:1741400 Table 1 and PMID:23322723 Table 1.
  cortisol_metabolism:
    reactions:
    - https://www.rhea-db.org/rhea/76019
    - https://www.rhea-db.org/rhea/76023
    verified_source: Both exact reaction identifiers and equations occur in the official P19099 record.
      PMID:15356073 directly measures CYP11B2-transfected V79 cell cortisol conversion; direct Rhea-page
      reads for these two identifiers are not claimed.
followup_scope:
  cholesterol_comparison:
    query: https://www.ebi.ac.uk/QuickGO/annotations
    records:
      CYP17A1/P05093: 53
      CYP21A2/P08686: 39
      CYP19A1/P11511: 42
      CYP11B1/P15538: 46
    finding: Complete one-page current queries contain no GO:0008203 assertion for the first three comparators.
      CYP11B1 retains an IBA at the same PTN001547321 node. CYP21A2 and CYP19A1 carry the broader sterol
      TAS from Reactome R-HSA-211976.
    interpretation: The comparator absence and lack of a GO aldosterone-to-cholesterol ancestry edge identify
      a convention question; neither alone establishes target-specific functional loss or refutes the
      literal ancestral node. Existing broad pathway membership remains NC. The ortholog-method defect
      for rat Cyp11a1 in row 22 is distinct from this valid ancestral family-tree placement.
  mitochondrion: All four GO:0005739 source tuples are TOO_GENERAL relative to independently supported
    GO:0005743; original assay and MitoCoP pool-4 limits remain explicit.
  cortisol: Positive row 40 is NC on independently verified wild-type human chemistry while the original
    joint-regulation assay remains limited. Negated row 41 remains U with its source field unchanged.
  steroid_hydroxylase: The retained broad activity on final-step Reactome sources describes an independently
    established gene-level property, not an exact terminal-reaction mapping; the separate proposed MF
    encodes that final chemistry.
  provider: Original provider failures remain preserved. No additional provider run or invented provider
    text was used for this finite source-based correction.
