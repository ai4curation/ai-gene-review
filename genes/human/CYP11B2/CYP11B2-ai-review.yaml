id: P19099
gene_symbol: CYP11B2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP11B2 encodes aldosterone synthase, a heme-dependent cytochrome P450 associated with the
  mitochondrial inner membrane of adrenal zona glomerulosa cells. It converts deoxycorticosterone to aldosterone
  through sequential 11-beta hydroxylation, corticosterone 18-hydroxylation and subsequent 18-oxidation,
  using oxygen and electrons supplied through the mitochondrial adrenodoxin system. Aldosterone production
  links this catalytic activity to sodium, potassium and water balance. CYP11B2 also accepts other corticosteroid
  substrates, including demonstrated conversion of 11-deoxycortisol to cortisol and further metabolism
  of cortisol to 18-oxygenated derivatives. Loss of CYP11B2 activity causes aldosterone synthase deficiency
  and salt wasting. The 503-residue precursor undergoes mitochondrial targeting and processing.
