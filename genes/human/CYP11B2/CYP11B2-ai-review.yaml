suggested_questions:
- question: How much do endogenous wild-type CYP11B2 cortisol formation and cortisol 18-oxygenation contribute
    in human adrenal tissue under physiological substrate delivery, compared with the predominant CYP11B1
    pathway?
- question: How do substrate access and intermediate release control the balance between 18-hydroxycorticosterone
    accumulation and completed aldosterone synthesis in native mitochondria?
status: DRAFT
proposed_new_terms:
- proposed_name: 18-hydroxycorticosterone oxidase activity
  proposed_definition: 'Catalysis of the reaction: 18-hydroxycorticosterone + 2 reduced adrenodoxin +
    O2 + 2 H+ = aldosterone + 2 oxidized adrenodoxin + 2 H2O. The C18 hydroxymethyl group is oxidized
    to the aldehyde group of aldosterone.'
  justification: The final aldosterone-forming reaction is curated separately as RHEA:50792 and is performed
    by human CYP11B2. GO:0047783 instead converts corticosterone to 18-hydroxycorticosterone. Targeted
    current GO and OLS searches did not identify a molecular-function term for the final reaction, and
    the inspected Rhea record has no GO molecular-function mapping. This proposal requests precise representation
    of the established reaction, without assigning an invented GO identifier or inferring a gap merely
    from absence of an EC number. It does not require that freely supplied 18-hydroxycorticosterone be
    an efficient substrate in every assay; enzyme-bound intermediate handling is a separate mechanistic
    issue.
  proposed_parent:
    id: GO:0016705
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
      oxygen
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:50792
      label: 18-hydroxycorticosterone + 2 reduced [adrenodoxin] + O2 + 2 H(+) = aldosterone + 2 oxidized
        [adrenodoxin] + 2 H2O
  supported_by:
  - reference_id: file:human/CYP11B2/CYP11B2-uniprot.txt
  - reference_id: Reactome:R-HSA-193965
  - reference_id: PMID:1741400
  - reference_id: PMID:2256920
