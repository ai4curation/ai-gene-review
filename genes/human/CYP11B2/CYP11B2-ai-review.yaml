  review:
    summary: Retain broad cholesterol-metabolic pathway membership for the downstream steroidogenic reactions.
    action: KEEP_AS_NON_CORE
    reason: GO:0008203 names reactions and pathways involving cholesterol, rather than requiring every
      participant to bind cholesterol. The actual PTN001547321 duplication node contains the CYP11A1 and
      CYP11B branches and lies on the reconstructed CYP11B2 path; its literal IBD is supported by CYP11A1
      descendant evidence. CYP11B2 performs downstream oxidative steps in the cholesterol-derived steroid
      pathway explicitly represented in Reactome R-HSA-211976. It does not catalyze cholesterol side-chain
      cleavage. Complete current comparator queries find this term absent from CYP17A1, CYP21A2 and CYP19A1,
      and aldosterone biosynthesis is not a descendant of cholesterol metabolism in the inspected ontology.
      These findings expose a pathway-boundary convention to resolve, but neither establishes a misplaced
      ancestral node or loss of the broad pathway role. Retain this existing assertion conservatively
      as non-core, without claiming cholesterol binding, homeostatic control or direct cholesterol turnover.
