id: O75072
gene_symbol: FKTN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Fukutin (FKTN) is a Golgi membrane ribitol-phosphate transferase that initiates the ribitol-phosphate
  linker on the core M3 O-mannosyl glycan of alpha-dystroglycan. It transfers ribitol phosphate from CDP-ribitol
  to the C3 hydroxyl of the GalNAc residue. FKRP subsequently adds a second ribitol-phosphate unit, allowing
  further glycan extension and assembly of the extracellular-matrix-binding matriglycan chain. Fukutin
  associates with POMGNT1 and with the enzymatically active FKRP–RXYLT1 complex. Loss of fukutin impairs
  functional dystroglycan glycosylation and causes recessive muscular dystrophy with variable brain and
  eye abnormalities. Nuclear and extracellular pools have also been observed in particular experimental
  contexts.
