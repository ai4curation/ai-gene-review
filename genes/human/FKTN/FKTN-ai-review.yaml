core_functions:
- description: Transfers the first ribitol-phosphate unit from CDP-ribitol to GalNAc C3 of the core M3
    O-mannosyl glycan on alpha-dystroglycan in the Golgi. The resulting linker is extended by FKRP and
    RXYLT1 before matriglycan assembly, enabling functional dystroglycan glycosylation.
  molecular_function:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  directly_involved_in:
  - id: GO:0035269
    label: protein O-linked glycosylation via mannose
  locations:
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:1902494
    label: catalytic complex
  supported_by:
  - reference_id: PMID:26923585
  - reference_id: PMID:27194101
  - reference_id: PMID:25279699
  - reference_id: PMID:29477842
  - reference_id: file:human/FKTN/FKTN-source-evidence.md
suggested_questions:
- question: Which ontology term most precisely distinguishes the mammalian first ribitol-phosphate transfer
    to a glycopeptide-linked GalNAc acceptor from ribitol-phosphate-polymer extension? GO:0016780 is accurate;
    GO:0047356 should not be substituted without resolving its chemical scope.
- question: How do endogenous FKTN localization and function vary between Golgi, nuclear and extracellular
    pools, and do either natural product O75072-1 or O75072-2 account for those differences? The ER-specific
    immunogold assignment remains unresolved.
- question: Under what cellular conditions, if any, does CDP-glycerol competition regulate FKTN-dependent
    glycan maturation? The current donor/acceptor results establish in-vitro activity rather than physiological
    regulation.
- question: What explains the opposite proliferation responses and different phospho-c-Jun readouts in
    HeLa/ZR-75-1 and1321N1, and which effects require the glycan-transfer activity?
