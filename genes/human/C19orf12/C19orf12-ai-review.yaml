taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C19orf12 is a small membrane-associated protein found at mitochondria, the endoplasmic reticulum
  and lipid droplets. In human adipocytes it accumulates during differentiation and localizes to lipid
  droplet–mitochondrial contact regions, where it associates with components of the mitochondrial protein-import
  machinery and supports lipid turnover and mitochondrial utilization of long-chain fatty acids. Its precise
  molecular activity is unresolved. Wild-type protein redistributes during oxidative stress, and cell
  studies link its abundance or disease-associated variants to autophagic responses, stress sensitivity
  and mitochondrial calcium homeostasis. Pathogenic variants cause mitochondrial membrane protein-associated
  neurodegeneration and a form of hereditary spastic paraplegia.
