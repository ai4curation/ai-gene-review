suggested_questions:
- question: 'What molecular activity couples C19orf12 at lipid droplet–mitochondrial contact regions to
    fatty-acid utilization: regulation of mitochondrial protein composition, direct lipid handling, contact
    organization, or another mechanism? TOM coassociation and depletion phenotypes do not yet distinguish
    these models.'
  experts: []
- question: How do the four named products differ in expression, membrane topology and function? Historical
    long/short construct names and numbered variants need sequence-level mapping before they can be assigned
    to the current UniProt product accessions.
  experts: []
- question: Do endogenous C19orf12 perturbations and rescue establish direct roles in autophagic regulation,
    calcium homeostasis and neuronal survival beyond the currently inspected overexpression and patient-fibroblast
    phenotypes?
  experts: []
