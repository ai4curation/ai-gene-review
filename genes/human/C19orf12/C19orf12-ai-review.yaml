  review:
    action: ACCEPT
    summary: C19orf12 supports lipid turnover and mitochondrial fatty-acid utilization in human adipocytes.
    reason: PMID:38565923 combines targeted localization and TOM-component coassociation with early and
      late siRNA depletion. Late depletion reduces lipid turnover and fatty-acid-dependent respiratory
      capacity; palmitate and etomoxir experiments distinguish impaired fatty-acid utilization from a
      general loss of respiration. Retain the existing broad lipid-metabolism process. The paper leaves
      the molecular mechanism unresolved, so these data do not justify assigning lipase, fatty-acid transporter
      or lipid-transfer activity.
