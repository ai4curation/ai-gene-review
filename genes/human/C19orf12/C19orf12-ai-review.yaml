core_functions:
- description: Supports adipocyte lipid turnover and mitochondrial utilization of long-chain fatty acids
    at lipid droplet–mitochondrial contact regions. C19orf12 associates with mitochondrial import machinery
    in human adipocyte models; the molecular activity coupling this association to fatty-acid metabolism
    remains unresolved.
