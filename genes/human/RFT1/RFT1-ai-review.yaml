- id: file:human/RFT1/RFT1-hypotheses/family-constraint-cavity-vs-portal/openscientist.md
  title: OpenScientist family-constraint analysis - is the substrate cavity or the
    lipid portal the conserved surface of the RFT1 fold?
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Second independent computational run, framed on wild-type family
      constraint with disease variants excluded as both input and selection criterion.
      Unlike the first run this one performed real statistics - a 3,826-sequence Pfam
      PF04506 alignment, Henikoff-weighted Kullback-Leibler constraint per column,
      geometric classification against the AlphaFold model with stated criteria, and
      four controls (second metric, composition, 20,000-draw permutation null, membrane-axis
      perturbation), plus axis-independent continuous correlations. The Pfam family
      identity and its eukaryote-only taxonomic spread were checked against InterPro.
      One caveat the run does not draw itself is recorded in the gene notes - lipid-facing
      transmembrane residues are the fastest-evolving class in essentially every membrane
      protein, which the run confirms as its own frame sanity check, so low constraint
      at portal-lining positions has limited power to show the portal is non-functional.
      Its numbers live only in the report prose - unlike the first run it emitted no
      data artifacts, and no citations file was written.
  findings:
  - statement: Across the eukaryotic RFT1 family, constraint concentrates on the central
      substrate cavity while the lateral lipid portal sits at or below transmembrane
      background
    supporting_text: central-cavity-lining transmembrane (TM) positions are the single
      most evolutionarily constrained structural class, well above the TM background,
      whereas lateral lipid-portal-lining positions are statistically indistinguishable
      from background
  - statement: The cavity signal is not a fold-maintenance artifact - the cavity class
      contains no glycine or proline and is dominated by polar and charged side chains
    supporting_text: they are 28% charged and 47% polar, the chemistry of substrate
      coordination
  - statement: The most constrained transmembrane positions form one compact pocket
      rather than being dispersed across the fold
    supporting_text: the 15 most-constrained TM residues have a mean pairwise distance
      of 19.2 Å vs a random-TM null of 30.1 Å
  - statement: The requested archaeal and bacterial MOP comparison was not possible
      by sequence alignment
    supporting_text: PF04506/RFT1 has no alignable archaeal/bacterial members
  - statement: The portal class is operationally defined on a single apparently occluded
      model, and no open lateral gate was detected in it
    supporting_text: my first (ray-tracing) portal detector found
- id: file:human/RFT1/RFT1-bioinformatics/RESULTS.md
  title: RFT1 side-chain orientation - resolving a conflict between two structural
    analyses
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Local reproducible check written to settle a direct contradiction
      between the two OpenScientist runs over whether E298 faces the central axis or
      the lipid. Recomputes the membrane normal from helix geometry and tests the sign
      of each side-chain orientation under 24 perturbed axes.
  findings:
  - statement: E298 points toward the pore axis at 7.0 Angstrom, stable under every
      axis perturbation tested, corroborating the family-constraint run and refuting
      the earlier run's exposed outward-facing call
    supporting_text: E298 points inward, not outward
  - statement: R67 is inward-facing but peripheral at 17.2 Angstrom, so inward-facing
      and cavity-lining are not the same thing
    supporting_text: R67 is inward-facing but peripheral
- id: file:human/RFT1/RFT1-hypotheses/scramblase-vs-binding-cavity/openscientist.md
  title: OpenScientist structural analysis - do RFT1-CDG residues line the substrate
    cavity or the lipid portal?
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent computational run commissioned for this review, deliberately
      framed with both mechanistic models stated symmetrically rather than reusing
      this review's rationale. Its literature citations were spot-checked and resolve
      correctly, including PMID:19267216. Its central negative result - that residue
      mapping cannot discriminate the two models because headgroup binding is required
      under both - is a correction to the premise the run was given, and is recorded
      here rather than being quietly dropped. One secondary claim is wrong and was
      not imported - it flags human Q9NWF4 and mouse Q9D8F3 as divergent RFT1 paralogs
      at risk of annotation transfer, but those are SLC52A1/Slc52a2 riboflavin transporters
      that merely carry RFT1 as a legacy gene symbol; the transfer hazard is real
      but is nomenclature, not paralogy. No local bioinformatics holdout existed for
      this gene, so nothing was leaked into the prompt. Superseded in one respect -
      its classification of E298 as exposed and outward-facing is not reproducible
      and is contradicted both by the family-constraint run and by the local check in
      RFT1-bioinformatics/RESULTS.md; its E298 finding below should not be relied on.
  findings:
  - statement: The evolved architecture of human RFT1 is a polytopic two-lobed bundle
      enclosing a central pore axis separable from the lipid-facing periphery, with
      an internal inverted-topology repeat - the MOP/MATE/MurJ alternating-access fold
    supporting_text: a polytopic ~12–14-TM, two-lobed helical bundle enclosing a discrete
      central pore axis that is geometrically separable from the lipid-facing periphery
  - statement: The architecture assignment is model-based, not experimental
    supporting_text: is consistent with the MOP/MATE/MurJ two-domain architecture independently
      modelled for Rft1
  - statement: A buried, inward-facing basic residue at the narrowest point of the
      pore axis is invariant across the family from human to fungi to Dictyostelium,
      marking the substrate-binding site as a deeply conserved feature of the wild-type
      protein rather than an artefact of any one model
    supporting_text: an invariant Arg across all orthologs
  - statement: In the apo human model the innermost axis lining is net-acidic, so the
      cationic substrate cavity of the current mechanistic model is a property of substrate-docked
      predictions and not of the resting state
    supporting_text: the apo human model's innermost lining is net-acidic
  - statement: E298 is neither cavity-lining nor portal-lining, refuting that part
      of the tested hypothesis
    supporting_text: it is solvent-exposed, outward-facing, and a conserved
  - statement: No RFT1-CDG residue maps to the lateral dolichol portal
    supporting_text: No disease residue lines the lateral dolichol portal.
  - statement: Residue-level structural mapping cannot discriminate the transporter
      and chaperone models
    supporting_text: model, so cavity-localised disease mutations do not discriminate
      them.
