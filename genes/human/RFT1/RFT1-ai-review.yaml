    summary: Phylogenetic propagation of the glycolipid translocation process to the
      Rft1 family. The node placement is defensible - the biochemical capacity is
      conserved from archaea (HhAgl23) through yeast to human, as Chen et al. showed
      by reconstituting purified ScRft1, HsRft1 and HhAgl23 in the same assay.
    action: ACCEPT
    reason: The biological process term is directionally and energetically neutral,
      so it survives the controversy over whether RFT1's essential in-vivo role is
