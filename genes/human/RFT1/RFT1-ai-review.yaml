proposed_new_terms:
- proposed_name: glycolipid scramblase activity
  proposed_definition: Catalysis of the movement of a glycolipid from one leaflet of
    a membrane bilayer to the other, in either direction, by an ATP-independent mechanism.
  justification: GO currently offers no ATP-independent glycolipid translocase term.
    GO:0034202 (glycolipid floppase activity) and GO:0140327 (flippase activity) both
    require energy from ATP hydrolysis, and GO:0017128 (phospholipid scramblase activity)
    is restricted to phospholipid substrates. RFT1 and its archaeal counterpart Agl23
    translocate Man(5)GlcNAc(2)-PP-dolichol in reconstituted liposomes with no ATP
    present, so no existing term states the demonstrated activity at its true specificity;
    curators are forced either to use a definitionally wrong ATP-dependent term or
    to retreat to the generic parent GO:0140303. The same gap affects other MOP-superfamily
    glycolipid scramblases.
  proposed_parent:
    id: GO:0140303
    label: intramembrane lipid transporter activity
  supported_by:
  - reference_id: PMID:38886340
    supporting_text: Translocation was ATP-independent, occurred with similar kinetics
      for both dolichol or phytanol lipid carriers, and importantly, was dependent
      on addition of purified Rft1 or archaeal Agl23
  - reference_id: PMID:42417535
    supporting_text: While this activity has been demonstrated in liposomes reconstituted
      with purified Rft1, biochemical evidence of additional M5-DLO scramblases and
      the viability of Rft1-null Trypanosoma brucei suggest that scrambling may be
      a moonlighting function of Rft1 rather than its essential cellular role.
knowledge_gaps:
- gap_statement: It is not established which molecular activity of RFT1 is the one
    the protein evolved to perform and that is required for cell viability. The reconstituted
    M5-DLO scramblase activity may be a moonlighting capacity of a substrate-binding
    fold rather than its selected function, and no alternative activity (proposed candidates
    include chaperoning or routing M5-DLO on the cytosolic face) has been demonstrated.
  boundary: Firmly established - RFT1 is an essential polytopic ER membrane protein
    with cytosolic termini and a MOP/MATE-type two-lobed alternating-access architecture;
    it is required for dolichol-linked oligosaccharide assembly to proceed past M5-DLO
    in yeast and in mammalian cells; purified human RFT1 translocates M5GN2-PP-Dol across
    a bilayer in vitro without ATP; and across the eukaryotic family, evolutionary constraint
    is concentrated on the polar central cavity that would coordinate the substrate headgroup
    rather than on the lipid-facing surface. Not established - that the in-vitro translocase
    activity is the activity required in vivo.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: Every molecular function annotation on this gene rests on the flippase
    attribution, as does the Reactome reaction that two of the GOA rows derive from.
    If the selected function is substrate capture and routing rather than transport,
    then a whole eukaryotic protein family is annotated with the wrong molecular activity,
    and the transport step of the N-glycosylation pathway is attributed to a protein
    that does not carry it.
  resolution: A separation-of-function allele would settle it - an RFT1 variant that
    retains scramblase activity in reconstituted liposomes but fails to support viability,
    or the converse. The portal-blocking mutant of Chiduza et al. is the first attempt
    at the second half of this and needs direct biochemical confirmation that it is
    indeed scramblase-dead. Identifying the additional M5-DLO scramblase activity present
    in Rft1-free membranes would also resolve which protein carries the transport step
    in vivo. Structure alone will not settle it - substrate binding is required under
    both models, so no amount of mapping residues onto the binding site can separate
    them; what is needed is a variant that separates binding from transport. An independent
    structural analysis makes the underlying point in the positive direction - the fold
    is a genuine MOP/MATE alternating-access architecture, and a family-wide constraint
    analysis shows selection has preserved the polar substrate cavity far more strongly
    than the lipid-facing surface, with the most constrained positions forming one compact
    pocket. Substrate capture is therefore an evolved feature of this protein whichever
    activity it ultimately serves. That result does not by itself settle the question
    either, for a reason the analysis does not draw - lipid-facing residues are the
    fastest-evolving class in essentially any membrane protein, so weak constraint along
    a lipid transit path is the null expectation and cannot show the path is unused.
  provenance:
  - reference_id: PMID:39025454
    supporting_text: It is therefore not known what essential role Rft1 plays in N-glycosylation.
  - reference_id: PMID:42417535
    supporting_text: These data suggest that while M5-DLO binding is important for
      Rft1's essential function, scrambling activity is dispensable.
  - reference_id: PMID:18668045
    supporting_text: Rft1 may have a critical accessory role in translocating Man(5)GlcNAc(2)-PP-Dol
      in vivo, but the Man(5)GlcNAc(2)-PP-Dol flippase itself remains to be identified.
  - reference_id: file:human/RFT1/RFT1-hypotheses/scramblase-vs-binding-cavity/openscientist.md
    supporting_text: model, so cavity-localised disease mutations do not discriminate
      them.
- gap_statement: The identity of the ER protein(s) responsible for the Rft1-independent
    M5-DLO flippase activity detected in microsomes and in reconstituted vesicles is
    unknown.
  boundary: A specific, saturable, ATP-independent M5-DLO flippase activity is demonstrably
    present in ER membranes depleted of Rft1 and in vesicles reconstituted from Rft1-free
    ER protein, and Rft1-null trypanosomes retain it. No gene has been assigned to
    it.
  gap_kind:
