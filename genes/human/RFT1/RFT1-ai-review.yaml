- term:
    id: GO:0034202
    label: glycolipid floppase activity
  evidence_type: IDA
  original_reference_id: PMID:38886340
  review:
    summary: 'IDA from Chen et al. 2024, who reconstituted purified recombinant human
      RFT1 (HsRft1-FLAG) into proteoliposomes and measured M5GN2-PP-Dol translocation
      by coupled alpha1-2 mannosidase digestion, obtaining ~90% conversion in 2 h
      with selectivity for M5 over M3 substrate. The underlying activity is directly
      demonstrated on the human protein, so the evidence is sound. The term is not:
      GO:0034202 is defined as "Catalysis of the movement of a glycolipid from the
      cytosolic to the exoplasmic leaflet of a membrane, using energy from the hydrolysis
      of ATP", whereas the assayed activity is explicitly ATP-independent and was
      run in reactions containing no ATP.'
    action: MODIFY
    reason: The energetics in the GO:0034202 definition contradict the experiment
      that grounds the annotation. RFT1 is an ATP-independent, bidirectional scramblase-type
      carrier, not an ATP-driven floppase; the Menon-lab literature consistently calls
      it a scramblase. GO:0017128 has the right energetics but the wrong substrate
      class (phospholipid), and GO:0140327 flippase activity is both ATP-dependent
      and the wrong direction. GO:0140303 intramembrane lipid transporter activity is
      the correct ATP-agnostic parent, and matches the wording UniProt already uses
      for Q96AA3 ("Intramembrane glycolipid transporter"). A new ATP-independent glycolipid
      scramblase child term is proposed under proposed_new_terms so the activity can
      eventually be stated at full specificity. Note this MODIFY is about term energetics
      and is independent of the separate, still-open question of whether this activity
      is RFT1's essential in-vivo role.
    proposed_replacement_terms:
    - id: GO:0140303
      label: intramembrane lipid transporter activity
    additional_reference_ids:
    - PMID:42417535
    supported_by:
    - reference_id: PMID:38886340
      supporting_text: As with ScRft1, proteoliposomes reconstituted with HsRft1 showed
        almost 90% conversion of M5GN2 to M3GN2 after 2 h of incubation.
    - reference_id: PMID:38886340
      supporting_text: we sought to reconstitute liposomes with purified ScRft1 or
        HhAgl23 in reactions that contained α1-2 mannosidase, without ATP
    - reference_id: PMID:38886340
      supporting_text: this transbilayer translocation is rapid, ATP-independent, protease-sensitive,
        and occurs with exquisite substrate specificity
  qualifier: enables
- term:
    id: GO:0034203
    label: glycolipid translocation
  evidence_type: IDA
  original_reference_id: PMID:38886340
  review:
    summary: IDA for the biological process from the same fully reconstituted assay.
      Purified human RFT1 was necessary and sufficient for M5GN2-PP-Dol movement across
      the bilayer in protein-free liposomes.
    action: ACCEPT
    reason: This is the strongest and least contested annotation on the gene. Unlike
      the molecular function row, the process term makes no claim about energy coupling
      or direction, so it is fully satisfied by the reconstitution data. It also remains
      true under the alternative model - even authors who argue that scrambling is
      a moonlighting activity accept that the activity has been demonstrated with
      purified protein.
    additional_reference_ids:
    - PMID:42417535
    supported_by:
    - reference_id: PMID:38886340
      supporting_text: Translocation was ATP-independent, occurred with similar kinetics
        for both dolichol or phytanol lipid carriers, and importantly, was dependent
        on addition of purified Rft1 or archaeal Agl23
    - reference_id: PMID:42417535
      supporting_text: While this activity has been demonstrated in liposomes reconstituted
        with purified Rft1, biochemical evidence of additional M5-DLO scramblases
        and the viability of Rft1-null Trypanosoma brucei suggest that scrambling
        may be a moonlighting function of Rft1 rather than its essential cellular
        role.
  qualifier: involved_in
- term:
    id: GO:0034202
    label: glycolipid floppase activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-4570573
  review:
    summary: TAS from the Reactome disease reaction "Defective RFT1 does not flip
      the N-glycan precursor". Reactome asserts the canonical flippase model, which
      is a reasonable reading of the genetics but inherits the same ATP-dependence
      mismatch as the IDA row, and additionally states as settled a mechanism that
      the primary literature still treats as open.
    action: MODIFY
    reason: Same definitional problem as the IDA row - GO:0034202 requires ATP hydrolysis
      and RFT1's translocase activity is ATP-independent - so the replacement is GO:0140303
      intramembrane lipid transporter activity. Beyond the term choice, a TAS to a pathway
      database is weak evidence for a mechanism that is actively contested; Rft1-depleted
      sealed microsomes retain full M5-DLO flippase activity, and Rft1-null trypanosomes
      glycosylate normally, so "defective RFT1 does not flip the N-glycan precursor"
      is a model rather than an established fact. The IDA row carries the real evidence
      for this activity; this row should not be a second independent-looking assertion
      of a contested mechanism at a definitionally wrong term.
    proposed_replacement_terms:
    - id: GO:0140303
      label: intramembrane lipid transporter activity
    additional_reference_ids:
    - PMID:19494107
    - PMID:23720757
    supported_by:
    - reference_id: PMID:19494107
      supporting_text: no difference was seen in the level of M5-DLO flippase activity
        in sealed wild type and Rft1-depleted microsomal vesicles
    - reference_id: PMID:23720757
      supporting_text: They have normal steady-state levels of mDLO and significant
        N-glycosylation, indicating robust M5-DLO flippase activity.
  qualifier: enables
