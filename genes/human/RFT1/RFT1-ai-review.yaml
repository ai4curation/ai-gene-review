- question: Should GO annotate the reconstituted, ATP-independent M5-DLO translocase
    activity of RFT1 as its molecular function while the in-vivo essentiality of that
    activity is contested, or should the molecular function be held at a binding/carrier
    term until a separation-of-function allele is available?
