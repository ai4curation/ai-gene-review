suggested_experiments:
- hypothesis: RFT1's essential in-vivo function is M5-DLO binding/routing rather than
    transbilayer transport.
  description: Take the portal-blocking yeast Rft1 mutant that supports robust growth
    and assay it directly in the Chen et al. reconstituted proteoliposome system. If
    purified mutant protein is scramblase-dead in vitro yet complements in vivo, the
    transport activity is formally dispensable and the essential role lies elsewhere.
    Run the reciprocal test on the two central-cavity mutants that grow poorly.
  experiment_type: reconstitution biochemistry with separation-of-function alleles
- hypothesis: A protein other than RFT1 carries the physiological M5-DLO flippase activity
    in human ER.
  description: Apply activity-correlation profiling to detergent-solubilized human
    ER membranes depleted of RFT1 - fractionate, reconstitute each fraction into liposomes,
    assay M5-DLO scrambling, and correlate activity with quantitative proteomics across
    fractions to nominate candidate genes, then test the top candidates by knockout
    plus reconstitution.
  experiment_type: activity correlation profiling mass spectrometry
- hypothesis: The deeply conserved basic positions on the RFT1 pore axis serve substrate
    capture, and substrate capture is separable from transbilayer movement.
  description: Mutate the invariant near-axis arginine and the conserved basic vestibule
    position, then measure M5-DLO binding affinity and scramblase activity in parallel
    on purified protein in proteoliposomes. Conservation from human to fungi to Dictyostelium
    marks these positions as selected, so what they are selected for is the question
    that matters; the characterised RFT1-CDG substitutions at the same positions are
    convenient ready-made reagents for the binding arm. Residue position alone cannot
    answer it - substrate binding is required under both the transporter and the chaperone
    model, so only a measured dissociation between the two readouts is informative.
  experiment_type: structure-function analysis of conserved substrate-site residues
- hypothesis: Blocking the lateral lipid portal of human RFT1 abolishes transport in
    vitro but leaves the essential cellular function intact.
  description: Build the human equivalent of the portal-blocking salt-bridge mutant
    that supports robust growth in yeast, then run both halves of the test that has
    so far only been done in halves - purify the mutant and show it is scramblase-dead
    in the reconstituted proteoliposome assay, and separately show it rescues RFT1-null
    human cells. This is the sharpest available discriminator - a scramblase-dead mutant
    that still rescues would establish that transport is not the essential function
    in human cells, whereas loss of rescue would restore the canonical model.
  experiment_type: separation-of-function mutagenesis with paired in-vitro and in-vivo
    readouts
- hypothesis: The conserved central cavity, not the lipid-facing surface, carries the
    residues required for M5-DLO handling.
  description: Mutate the most family-constrained cavity positions identified by the
    constraint analysis - R290, N435, Y378, E64, E298, Q186, N283, E156 and the S/T
    cluster at 257, 286 and 412 - alongside a size-matched and hydrophobicity-matched
    set of lipid-facing positions as controls, and score every variant in the reconstituted
    flipping assay. The prediction is a large asymmetry, cavity mutants impairing transport
    while matched surface mutants do not. The matched control set is the part that matters
    - without it the experiment cannot distinguish a functional cavity from the generic
    tolerance of lipid-facing positions to substitution.
  experiment_type: constraint-guided mutagenesis with matched surface controls
- hypothesis: The substrate-binding cavity of RFT1 becomes cationic only on substrate
    engagement.
  description: Determine an experimental structure of human or yeast RFT1 with and
    without bound M5-DLO by cryo-EM. The cationic central cavity that underpins the
    current mechanistic model is a feature of substrate-docked predicted models; in
    the apo human AlphaFold model the innermost axis lining is net-acidic, so the
    electrostatics of the resting state and whether R67 and K152 actually contact the
    pyrophosphate are both unverified.
  experiment_type: cryo-EM structure determination
