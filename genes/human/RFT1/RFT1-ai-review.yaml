- id: PMID:19494107
  title: Suppression of Rft1 expression does not impair the transbilayer movement of
    Man5GlcNAc2-P-P-dolichol in sealed microsomes from yeast.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
