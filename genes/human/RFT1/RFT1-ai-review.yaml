- term:
    id: GO:0006488
    label: dolichol-linked oligosaccharide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18313027
  review:
    summary: IMP for LLO assembly - RFT1-deficient patient cells accumulate DolPP-GlcNAc2Man5
      and fail to build the mature Glc3Man9GlcNAc2-PP-dolichol precursor, pinpointing
      the step at which the pathway stalls.
    action: ACCEPT
    reason: This is the most defensible core process annotation for RFT1 and the one
      that best represents current knowledge. It captures the established requirement
      at the M5-DLO step while remaining agnostic between the transporter and chaperone
      models, both of which predict exactly this accumulation phenotype.
    additional_reference_ids:
    - PMID:19701946
    supported_by:
    - reference_id: PMID:18313027
      supporting_text: RFT1 deficiency in both yeast and human cells leads to the accumulation
        of incomplete DolPP-GlcNAc(2)Man(5) and to a profound glycosylation disorder
        in humans.
    - reference_id: PMID:23720757
      supporting_text: rather than facilitating M5-DLO flipping, Rft1 facilitates conversion
        of M5-DLO to mDLO by another mechanism, possibly by acting as an M5-DLO chaperone.
  qualifier: involved_in
- term:
    id: GO:0034203
    label: glycolipid translocation
  evidence_type: IGI
  original_reference_id: PMID:18313027
  review:
    summary: IGI with yeast RFT1 (UniProtKB:P38206) inferring the translocation process
      from complementation of Deltarft1 by human RFT1 cDNA. The experiment shows that
      the human protein restores pathway flux in cells lacking yeast Rft1; it does
      not distinguish transport from any other essential contribution to M5-DLO handling.
    action: MODIFY
    reason: This is precisely the inferential step the field disputes. Genetic loss
      of Rft1 causes M5-DLO accumulation, but the same genetic background retains
      full flippase activity in sealed microsomes (Rush 2009), Rft1-null Trypanosoma
      brucei flips M5-DLO and glycosylates normally (Jelk 2013), and a yeast Rft1 mutant
      engineered to block the lipid portal - and so predicted to lack scramblase activity
      - still supports robust growth (Chiduza 2026). Complementation therefore supports
      involvement in dolichol-linked oligosaccharide biosynthesis, the term the same
      paper already grounds by IMP, rather than the specific transport step. The transport
      claim is not lost by this change - it is carried, with far better evidence, by
      the Chen 2024 IDA rows.
    proposed_replacement_terms:
    - id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    additional_reference_ids:
    - PMID:19494107
    - PMID:23720757
    - PMID:42417535
    supported_by:
    - reference_id: PMID:19494107
      supporting_text: although Rft1 may play a critical role in vivo, depletion of
        this protein does not impair the transbilayer movement of M5-DLO in sealed
        microsomal fractions prepared from disrupted cells.
    - reference_id: PMID:23720757
      supporting_text: We report that TbRft1-null procyclic trypanosomes grow nearly
        normally.
    - reference_id: PMID:42417535
      supporting_text: Strikingly, the portal-blocking mutant which is predicted to
        lack scramblase activity supported robust growth.
  qualifier: involved_in
