id: Q96AA3
gene_symbol: RFT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RFT1 encodes a polytopic endoplasmic reticulum membrane protein of the
  MOP (multidrug/oligosaccharidyl-lipid/polysaccharide) transporter superfamily that
  acts on Man(5)GlcNAc(2)-PP-dolichol (M5-DLO), the lipid-linked oligosaccharide intermediate
  of the N-glycosylation pathway. The protein spans the membrane roughly 12-14 times
  with both termini facing the cytosol, is not itself N-glycosylated, and is essential
  for viability in yeast and mammalian cells. Purified human RFT1 reconstituted into
  proteoliposomes translocates M5-DLO across the bilayer by an ATP-independent, bidirectional
  (scramblase-like) mechanism, with selectivity for the Man5 over shorter Man3 intermediates.
  Whether this translocase activity is the essential physiological role of the protein
  remains actively disputed: M5-DLO flipping persists in Rft1-depleted microsomes and
  in vesicles reconstituted with Rft1-free ER protein, Rft1-null Trypanosoma brucei
  is viable and glycosylates normally, and a yeast mutant engineered to block the lipid
  portal still supports robust growth, leading to an alternative model in which RFT1
  acts as an M5-DLO chaperone that routes the intermediate for luminal completion.
  What is not in dispute is the pathway step at which the protein is required: loss
  of RFT1 function stalls dolichol-linked oligosaccharide assembly at M5-DLO and causes
  RFT1-CDG (CDG-In, OMIM 612015), a severe multisystem congenital disorder of glycosylation
  with neurodevelopmental abnormalities, hypotonia, epilepsy and sensorineural deafness.
existing_annotations:
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Phylogenetic (PAINT) propagation of ER membrane localization across the
      Rft1 family (PTN000319164), with yeast RFT1 (SGD:S000000116) and human RFT1
      itself among the donors. ER residence is the one part of the RFT1 picture that
      no party to the flippase controversy disputes, and it now has direct human evidence
      - Hirata et al. localized human Rft1 and mapped its topology, showing a polytopic
      ER protein with both termini cytosolic.
    action: ACCEPT
    reason: ER membrane is the well-established site of action and is independently
      supported by yeast genetics, human topology mapping, and the reconstitution
      work. The appearance of Q96AA3 in its own WITH/FROM reflects that the human
      gene's own experimental annotations helped seat the ancestral node, which is
      the expected pattern, not circularity.
    supported_by:
    - reference_id: PMID:39025454
      supporting_text: We show that it is a multispanning membrane protein located
        in the ER, with its N and C termini facing the cytoplasm.
    - reference_id: PMID:18313027
      supporting_text: The definition of the RFT1 defect establishes the functional
        conservation of the DolPP-GlcNAc(2)Man(5) translocation process in eukaryotes.
  qualifier: is_active_in
- term:
