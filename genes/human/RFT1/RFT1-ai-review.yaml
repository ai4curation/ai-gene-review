- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  review:
    summary: Nine IPI rows derived from the HuRI all-by-all binary yeast two-hybrid
      interactome map, with partners AQP6, BEST2, CNR2, CREB3L1, ERGIC3, MUC1, RNF144A,
      TMX2 and TSPAN12. All are membrane proteins; none has an established role in
      dolichol-linked oligosaccharide assembly or in N-glycosylation, and no follow-up
      validation of functional relevance to RFT1 has been reported.
    action: REMOVE
    reason: Bare "protein binding" conveys nothing about molecular function and is
      explicitly discouraged by project curation guidelines. These are unvalidated
      high-throughput Y2H hits between membrane proteins, a class prone to artefact,
      and none of them illuminates RFT1's activity or its contested essential role.
      If any of these interactions is later shown to be functional, the appropriate
      annotation would be a specific term, not GO:0005515.
    additional_reference_ids:
    - UniProt:Q96AA3
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all' reference interactome map
        of human binary protein interactions, or 'HuRI'.
