- id: PMID:11807558
  title: Translocation of lipid-linked oligosaccharides across the ER membrane requires
    Rft1 protein.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified. The founding genetic paper for the flippase model.
      Correctly cited, but its conclusion is the contested one - the authors show
      Rft1 is "required for" translocation in vivo, which later biochemistry (PMID:18668045,
      PMID:19494107) and genetics (PMID:23720757) showed does not entail that Rft1
      catalyses the step. A formal Brief Communication Arising was published against
      it.
  findings:
  - statement: Yeast Rft1 depletion blocks luminal appearance of M5GN2-PP-Dol, establishing
      the genetic requirement
    supporting_text: Here we provide evidence that yeast RFT1 encodes an evolutionarily
      conserved protein required for the translocation of Man5GlcNAc2-PP-Dol from
      the cytoplasmic to the lumenal leaflet of the ER membrane.
- id: PMID:18313027
  title: Human RFT1 deficiency leads to a disorder of N-linked glycosylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; the index RFT1-CDG paper and the source of the
      IMP and IGI rows in GOA. The mutant-phenotype and rescue data are solid and
      uncontested; only the mechanistic gloss ("translocation") inherits the family
      controversy.
  findings:
  - statement: Homozygous p.R67C causes CDG with intracellular DolPP-GlcNAc2Man5 accumulation
    supporting_text: A young patient diagnosed with a congenital disorder of glycosylation
      characterized by an intracellular accumulation of DolPP-GlcNAc(2)Man(5) was
      found to carry a homozygous point mutation in the RFT1 gene.
  - statement: Human RFT1 complements Deltarft1 yeast, demonstrating functional orthology
    supporting_text: Despite the low sequence similarity between the yeast and the
      human RFT1 proteins, we demonstrated both their functional orthology and the
      pathologic effect of the human p.R67C mutation by complementation assay in Deltarft1
      yeast cells.
  - statement: Causality confirmed by rescue of patient fibroblasts with wild-type
      cDNA
    supporting_text: The causality of the RFT1 p.R67C mutation was further established
      by restoration of normal glycosylation profiles in patient-derived fibroblasts
      after lentiviral expression of a normal RFT1 cDNA.
  - statement: RFT1 loss stalls LLO assembly at the M5GN2 intermediate in yeast and
      human cells
    supporting_text: RFT1 deficiency in both yeast and human cells leads to the accumulation
      of incomplete DolPP-GlcNAc(2)Man(5) and to a profound glycosylation disorder
      in humans.
- id: PMID:18668045
  title: Does Rft1 flip an N-glycan lipid precursor?
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified Nature Brief Communication Arising against PMID:11807558.
      This is the paper that opened the controversy and it is essential context for
      any RFT1 molecular function annotation; it was absent from the previous version
      of this review.
  findings:
  - statement: Reconstituted ER vesicles flip M5GN2-PP-Dol without Rft1
    supporting_text: We now show that a specific ER protein(s), but not Rft1, is required
      to flip Man(5)GlcNAc(2)-PP-Dol in reconstituted vesicles.
  - statement: Authors propose an accessory rather than catalytic role for Rft1
    supporting_text: Rft1 may have a critical accessory role in translocating Man(5)GlcNAc(2)-PP-Dol
      in vivo, but the Man(5)GlcNAc(2)-PP-Dol flippase itself remains to be identified.
