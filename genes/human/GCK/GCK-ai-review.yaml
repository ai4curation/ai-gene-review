id: P35557
gene_symbol: GCK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Glucokinase is an ATP-dependent enzyme that converts D-glucose to glucose 6-phosphate. Its relatively low glucose affinity and cooperative response couple glucose availability to metabolic flux. In pancreatic beta cells, this activity helps set the threshold for glucose-stimulated insulin secretion; in hepatocytes it supports glucose utilization and glycogen accumulation. Cytosolic GCK can be sequestered in the nucleus through interaction with GCKR. Tissue-specific promoters and alternative splicing generate proteins with different amino termini. Reduced GCK activity causes hyperglycemia, whereas activating variants can cause hyperinsulinemic hypoglycemia.
alternative_products:
- id: P35557-1
  name: '1'
  sequence_note: Displayed 465-residue sequence; the amino-terminal 15 residues differ from the two liver-associated products.
  description: The human islet cDNAs encode the 465-residue form (PMID:1511800; PMID:1612194). Direct enzyme studies often use human beta-cell GCK, but individual assays require their own construct identification. The current raw annotations are gene-level; the HuRI target clone is explicitly P35557-1.
- id: P35557-2
  name: '2'
  sequence_note: 466 residues; VSP_002074 replaces residues 1–15 with MAMDVTRSQAQTALTL. Direct FASTA and coordinate reconstruction agree.
  description: The 466-residue liver cDNA product is associated with alternative promoter use and splicing (PMID:1871135; PMID:1354840). In-vitro translation differs between the two liver mRNAs, but this does not establish different purified-enzyme catalytic activities or exclusive physiological roles.
- id: P35557-3
  name: '3'
  sequence_note: 464 residues; VSP_002075 replaces residues 1–15 with MPRPRSQLPQPNSQ. Direct FASTA and coordinate reconstruction agree.
  description: The 464-residue liver cDNA product has a distinct amino terminus (PMID:1871135). Lower translation of its mRNA in the reported system is not evidence that the protein lacks glucokinase activity. Its catalytic and localization differences from the other natural products remain unresolved.
