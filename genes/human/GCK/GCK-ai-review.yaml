core_functions:
- description: Catalyses glucose phosphorylation in the cytosol, supplying glucose 6-phosphate to glycolysis and coupling glucose concentration to insulin secretion and systemic glucose homeostasis. The glucose-sensing behavior arises from the regulated catalytic activity.
  molecular_function:
    id: GO:0004340
    label: glucokinase activity
  directly_involved_in:
  - id: GO:0006096
    label: glycolytic process
  - id: GO:0032024
    label: positive regulation of insulin secretion
  - id: GO:0042593
    label: glucose homeostasis
  locations:
