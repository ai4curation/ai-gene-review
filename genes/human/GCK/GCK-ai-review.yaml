suggested_questions:
- question: What physiological mannose or fructose flux is specifically attributable to GCK at tissue-relevant sugar concentrations, distinct from other hexokinases and ketohexokinase?
- question: Do the 466- and 464-residue liver products differ in catalytic regulation, GCKR interaction or localization when compared at equal protein abundance?
- question: Which mitochondrial GCK pool and membrane topology are established in human cells, and how do these relate to the conserved PAINT localization and rat fractionation evidence?
- question: Which leptin-specific GT1-7 assay underlies the rat donor annotation, and does the response transfer to human GCK-containing cells?
suggested_experiments:
- description: Measure isotope-labelled mannose and fructose phosphorylation with GCK-selective perturbation and rescue in human beta cells or hepatocytes while maintaining physiological competing glucose concentrations.
  hypothesis: Purified-enzyme substrate activity may differ from the GCK-dependent contribution to cellular alternative-sugar flux.
- description: Compare the three sequence-verified natural products at matched abundance for glucose kinetics, GCKR association and intracellular distribution.
  hypothesis: Amino-terminal and transcript differences may alter abundance or regulation without abolishing the shared catalytic activity.
