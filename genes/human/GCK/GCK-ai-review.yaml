  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic abstract directly establishes human beta-cell GCK sugar kinetics. Numerical Km and kcat values are also available in the inspected UniProt P35557 BIOPHYSICOCHEMICAL PROPERTIES block with explicit ECO:0000269 attribution to this PMID; these are curated-record evidence, not an independent reading of the inaccessible original tables. Mannose efficiency is comparable to glucose, whereas fructose has lower kcat/Km and much higher Km. GCK-specific physiological alternative-sugar flux remains unresolved.
  findings:
  - statement: Human beta-cell GCK directly phosphorylates several sugars, with glucose and mannose having the highest measured efficiencies in this assay.
