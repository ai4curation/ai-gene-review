id: P43897
gene_symbol: TSFM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TSFM encodes mitochondrial elongation factor Ts (EF-Ts), a nuclear-encoded matrix protein
  of the EF-Ts family. It is the guanine nucleotide exchange factor for mitochondrial elongation factor
  Tu (TUFM): it binds EF-Tu-GDP released from the mitoribosome, promotes exchange of GDP for GTP, and
  forms a stable EF-Tu-Ts complex, so regenerating EF-Tu-GTP for aminoacyl-tRNA delivery during elongation
  of the 13 mtDNA-encoded OXPHOS subunits. Mature EF-Ts also stabilises EF-Tu; in patient cells, loss
  of EF-Ts lowers EF-Tu levels, and the translation defect can be rescued by overexpressing either factor.
  Biallelic TSFM variants cause combined oxidative phosphorylation deficiency 3 (COXPD3), with presentations
  ranging from fatal neonatal encephalomyopathy, hepatopathy or hypertrophic cardiomyopathy to juvenile-onset
  Leigh syndrome, ataxia, neuropathy and optic atrophy.'
