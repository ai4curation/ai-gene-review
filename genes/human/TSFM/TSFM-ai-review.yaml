core_functions:
- description: 'Guanine nucleotide exchange factor for mitochondrial EF-Tu (TUFM): binds EF-Tu-GDP and
    promotes GDP-to-GTP exchange, regenerating EF-Tu-GTP for aminoacyl-tRNA delivery during mitochondrial
    translation elongation; the EF-Tu-Ts complex also stabilises EF-Tu.'
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0070125
    label: mitochondrial translational elongation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: file:human/TSFM/TSFM-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Associates with the EF-Tu.GDP complex and induces the exchange of GDP to GTP
  - reference_id: PMID:17033963
    supporting_text: EFTs functions as a guanine nucleotide exchange factor for EFTu, another translation
      elongation factor that brings aminoacylated transfer RNAs to the ribosomal A site as a ternary complex
      with guanosine triphosphate
  - reference_id: PMID:17033963
    supporting_text: These phenotypes and the translation defect were rescued by retroviral expression
      of either EFTs or EFTu
  - reference_id: PMID:30911037
    supporting_text: This protein participates in the elongation step of mitochondrial translation by
      binding and stabilizing the translation elongation factor Tu (EF-Tu)
proposed_new_terms: []
suggested_questions:
- question: Do COXPD3 variants act mainly by reducing EF-Ts nucleotide-exchange activity or by destabilising
    the EF-Tu-Ts complex, given that EF-Tu overexpression alone rescues the translation defect?
- question: Why does the same TSFM variant (R333W) produce encephalomyopathy, cardiomyopathy or hepatopathy
    in different families?
suggested_experiments:
- description: In vitro GDP/GTP exchange kinetics of recombinant human mtEF-Tu with wild-type and disease-variant
    EF-Ts, alongside complex-stability measurements, to separate catalytic from stabilising defects.
