    label: BIM-BCL-xl complex
  predicted_term_type: GO_CC
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 18.27). The BIM-BCL-xl complex contains BCL2L1 (Bcl-xL), not BCL2; rank 4 is the
      BCL2 version of the same complex, 0.01 units below it, and rank 5 returns to Bcl-xL with PUMA.
      So the list interleaves the two paralogs' complexes with no separation, and ranks the wrong
      one above the right one. BCL2 and BCL2L1 are the pair a curator most needs distinguished, and
      the same confusion appeared for Drosophila Buffy earlier in the cohort.
    supported_by:
    - reference_id: file:human/BCL2/BCL2-uniprot.txt
