    label: BAD-BCL-2 complex
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 19.09) and absent from GOA. BAD is a canonical BH3-only ligand of BCL2
      and the BAD-BCL-2 complex is the structurally characterised interaction that underlies this
      review's core function - BH3 domain binding to sequester pro-apoptotic partners. Correct, specific
      and novel.
    supported_by:
