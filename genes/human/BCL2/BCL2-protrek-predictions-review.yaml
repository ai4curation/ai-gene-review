id: P10415
gene_symbol: BCL2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for human BCL2. All five calls are Bcl-2 family complexes, which
  is the right level of description for a protein whose function is executed by sequestering BH3 partners
  - but two of the five name Bcl-xL rather than Bcl-2, so the model is not distinguishing the two
  closest paralogs in the family. The free-text channel makes the same substitution, leading with
  an isoform of Bcl-X. Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 paralog incorrect
  (PLI).
