      function during autophagosome formation.
proposed_new_terms: []
suggested_questions:
- question: Under which endogenous conditions does Nur77- or cleavage-dependent BCL2 conversion
    contribute materially to apoptosis and cytochrome-c release?
- question: Does the channel capacity of purified BCL2 operate in native membranes, and what
    are the conducting assembly and relevant substrates?
- question: Does BCL2 assemble a simultaneous calcineurin–IP3-receptor complex in human cells,
    or does it regulate these partners through separate interactions?
suggested_experiments:
  - description: Structure-function analysis of BCL2 variants that retain BH3 
      binding but lack membrane insertion to dissect OMM vs cytosolic functions
  - description: Live-cell imaging of BCL2-BECN1 vs BCL2-BAX interactions to 
      quantify relative occupancy under different stress conditions
