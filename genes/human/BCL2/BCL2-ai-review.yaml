- term:
    id: GO:0015267
    label: channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Human BCL2 has demonstrated membrane-channel capacity in reconstituted systems.
    action: KEEP_AS_NON_CORE
    reason: PMID:9219694 reports BCL2-dependent liposome permeabilization at acidic pH and Bax-channel
      inhibition at physiological pH. Independently, full-text PMID:9144199 records discrete channels
      from purified human BCL2(1–218), lacking its terminal anchor, at pH 7.4; acidic conditions
      increase membrane insertion. Thus channel capacity and resulting transmembrane ion movement
      cannot be rejected as absent or exclusively acidic. Their native physiological contribution
      remains unresolved and distinct from established channel inhibition. The channel IBD at
      PTN000135648 includes experimental human P10415 evidence, which is legitimate target grounding
      rather than circular transfer. The focused OpenScientist report concurs on channel capacity,
      but its acidic-only permeabilization summary describes the larger carboxyfluorescein readout
      and must not be generalized to small-ion conductance. Transmembrane transport does not require
      bulk solute movement or a conventional transporter architecture.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_label: PTN000135648
        source_status: SUPPORTS_TRANSFER
        comment: Target experimental channel evidence contributes to the IBD; uncertainty concerns
          physiological deployment, not existence of capacity.
    supported_by:
    - reference_id: PMID:9144199
      supporting_text: When the His 6 -Bcl-2 (ΔTM) protein was applied to planar bilayers at neutral
        pH in symmetric 0.5 M KCl, discrete channel activity was observed with random openings
        and closings.
    - reference_id: PMID:9219694
      supporting_text: 'Bcl-2, in contrast,

        triggered carboxyfluorescein release at acidic pH only.'
- term:
    id: GO:0001836
    label: release of cytochrome c from mitochondria
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: BCL2 can promote cytochrome-c release in a converted proapoptotic state, although
      ordinary intact BCL2 inhibits release.
    action: KEEP_AS_NON_CORE
    reason: The prior global replacement assumed that BCL2 can only inhibit this process. PMID:18835031
      shows that converted BCL2 exposes its BH3 domain and neutralizes BCLXL, facilitating Bax-dependent
      permeabilization; PMID:14980220 reports Nur77-dependent conversion and cytochrome-c release.
      This is active regulatory work, not evidence that BCL2 constitutively forms the cytochrome-c
      pore. Preserve the inherited process as contextual while focused adjudication evaluates
      the exact release-versus-regulation scope. The original PAINT source is PTN000135648.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_label: PTN000135648
        source_status: UNRESOLVED
        comment: Positive conditional target activity prevents rejection from the ordinary antiapoptotic
          state alone; exact process scope remains under adjudication.
    supported_by:
    - reference_id: PMID:18835031
      supporting_text: NuBCP-9-induced Bcl-2 conformational change not only neutralizes Bcl-2’s
        inhibition of Bax-mediated membrane permeabilization but also exposes the Bcl-2’s BH3
        motif neutralizing Bcl-XL’s inhibition of Bax
